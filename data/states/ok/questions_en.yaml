metadata:
  source: Oklahoma Driver Manual (oklahoma.gov)
  total_questions: 307
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_responsibility
  question: 'According to the Oklahoma Driver Manual, operating a motor vehicle on
    Oklahoma''s streets and highways is considered:'
  choices:
    A: A constitutional right
    B: A privilege granted by the state
    C: An unconditional guarantee for all residents
    D: A federal right
  answer: B
  explanation: The manual states that your license to operate a motor vehicle on Oklahoma's
    streets and highways is a privilege the state grants under certain conditions.
- id: 2
  category: driver_testing
  question: Who is responsible for giving and evaluating the required tests for an
    Oklahoma Driver License?
  choices:
    A: A local police officer
    B: A professional driver examiner from Service Oklahoma
    C: A certified high school driving instructor
    D: An independent third-party auditor
  answer: B
  explanation: The tests will be given and evaluated by a professional driver examiner
    from Service Oklahoma, according to state and national standards.
- id: 3
  category: license_system
  question: When must a driver with an out-of-state license apply for an Oklahoma
    Driver License?
  choices:
    A: Within 60 days of visiting the state
    B: Immediately upon crossing the state line
    C: When they establish residency in Oklahoma
    D: Only when their out-of-state license expires
  answer: C
  explanation: Drivers with an out-of-state license must apply for an Oklahoma Driver
    License when they establish residency.
- id: 4
  category: vehicle_information
  question: What must you do regarding your vehicles upon establishing residency in
    Oklahoma?
  choices:
    A: Sell any out-of-state vehicles
    B: Register your vehicles in Oklahoma
    C: Have your vehicles inspected by the highway patrol
    D: Pay a one-time federal import tax
  answer: B
  explanation: Upon establishing residency, your vehicles must be registered in Oklahoma.
- id: 5
  category: license_system
  question: Which of the following individuals is NOT required to have an Oklahoma
    Driver License?
  choices:
    A: A new resident who just moved to Oklahoma
    B: A resident who only drives on weekends
    C: Anyone operating a farm tractor solely for farm/ranch activities
    D: A 15-year-old nonresident with a home state license
  answer: C
  explanation: An Oklahoma License is NOT required for anyone operating a farm tractor
    or implement solely for farm/ranch activities.
- id: 6
  category: license_system
  question: A nonresident who is properly licensed in their home state does not need
    an Oklahoma license if they are at least what age?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: C
  explanation: An Oklahoma License is NOT required for nonresidents at least 16 years
    old who are properly licensed to drive in their home state or country.
- id: 7
  category: license_system
  question: Which group of nonresidents is exempt from needing an Oklahoma driver
    license if they have a valid license from their home state?
  choices:
    A: Nonresident students enrolled at an Oklahoma college or university
    B: Nonresidents working temporary construction jobs
    C: Nonresidents who own vacation property in Oklahoma
    D: Nonresidents staying in a hotel for more than 30 days
  answer: A
  explanation: An Oklahoma License is NOT required for nonresident students enrolled
    at an Oklahoma college or university and their spouses and children with valid
    licenses from their home states.
- id: 8
  category: license_system
  question: When presenting primary identification to apply for a license, which of
    the following is unacceptable?
  choices:
    A: A certified U.S. birth certificate
    B: An unexpired U.S. Passport
    C: A notarized photocopy of a birth certificate
    D: A Consular Report of Birth Abroad
  answer: C
  explanation: You are required to present primary identification. Notarized documents
    or photocopies are not acceptable.
- id: 9
  category: license_system
  question: Which of the following is an acceptable form of primary identification
    when applying for an Oklahoma Driver License?
  choices:
    A: A library card
    B: A valid Oklahoma Driver License originally issued after November 1, 2007
    C: A utility bill from the last 30 days
    D: A student ID card
  answer: B
  explanation: Acceptable primary ID includes a valid Oklahoma Driver License, originally
    issued after November 1, 2007.
- id: 10
  category: license_system
  question: If your name changes due to marriage, how must it appear on your driver
    license?
  choices:
    A: Exactly as stated on the marriage certificate
    B: As your first name and your spouse's last name
    C: Hyphenated with your maiden name
    D: However you write it on the application form
  answer: A
  explanation: A name change resulting from marriage, court order or divorce shall
    appear on the driver license or identification card exactly as stated on the marriage
    certificate, court order or divorce decree.
- id: 11
  category: license_system
  question: What must an applicant provide if they are renewing an Oklahoma license
    that has been expired for more than one year?
  choices:
    A: A secondary form of identification
    B: A document from the primary identification list
    C: A certified driving record
    D: Proof of vehicle registration
  answer: B
  explanation: Applicants for renewals with an expired Oklahoma license or Oklahoma
    ID card expired more than 1 year must provide a document from primary identification
    list.
- id: 12
  category: license_system
  question: If a customer wishes to establish a name change based on a common law
    marriage, what documentation is required?
  choices:
    A: A verbal confirmation from both spouses
    B: A notarized letter from a judge
    C: An 'Affidavit of Common Law Marriage' with notarized signatures of the husband
      and wife, plus another primary source
    D: A standard marriage certificate from any state
  answer: C
  explanation: 'Required documents include: For a common law marriage, ''Affidavit
    of Common Law Marriage'' containing the notarized signatures of the husband and
    wife, with another primary source.'
- id: 13
  category: driver_responsibility
  question: Is the Oklahoma Driver Manual considered an official legal reference to
    Oklahoma traffic laws?
  choices:
    A: Yes, it is the primary legal reference for the state.
    B: Yes, it contains the exact legal statutes for traffic laws.
    C: No, it is not an official legal reference, but explains knowledge and skills
      in everyday language.
    D: No, it is only a guide for out-of-state drivers.
  answer: C
  explanation: 'The manual states: ''It is not an official legal reference to Oklahoma
    traffic laws. Still, it explains in everyday language the knowledge and skills
    you will need to drive safely and legally...'''
- id: 14
  category: license_system
  question: What is required at a minimum to request a replacement for a lost, stolen,
    or mutilated Oklahoma Driver License?
  choices:
    A: A primary form of identification
    B: A police report
    C: Two pieces of mail showing your address
    D: A birth certificate and a social security card
  answer: A
  explanation: Applicants requesting replacement of a lost, stolen or mutilated Oklahoma
    Driver License or ID card must furnish, at a minimum, a primary form of identification.
- id: 15
  category: license_system
  question: If your primary ID is a USCIS document (including I-551) and you want
    to change your name on your license, what must you do first?
  choices:
    A: Provide a notarized letter from an employer
    B: Provide proof of the name change from USCIS
    C: Wait until you become a full U.S. citizen
    D: Bring a witness to the Service Oklahoma facility
  answer: B
  explanation: If USCIS document is the primary ID (including 1-551), applicant must
    provide proof of name change from USCIS before any change will be made.
- id: 16
  category: license_system
  question: Where should you report a legal name change before updating your driver
    license or identification card?
  choices:
    A: The Department of Public Safety
    B: The Social Security Administration
    C: The County Clerk's Office
    D: The Internal Revenue Service
  answer: B
  explanation: According to the manual, legal name changes should be reported to the
    Social Security Administration before changes are made on your license or identification
    card.
- id: 17
  category: license_system
  question: Beginning May 7, 2025, what will a REAL ID or valid federal identification
    document be required for?
  choices:
    A: Boarding a domestic flight
    B: Voting in a local election
    C: Applying for a passport
    D: Purchasing a firearm
  answer: A
  explanation: Beginning May 7, 2025, a REAL ID License or Identification Card or
    valid federal identification document will be required to board a domestic flight,
    visit military bases, or enter nuclear power plants.
- id: 18
  category: driver_testing
  question: What type of insurance document must you bring when taking your driving
    test?
  choices:
    A: Comprehensive insurance
    B: Collision insurance
    C: Auto liability insurance
    D: Uninsured motorist coverage
  answer: C
  explanation: The manual states that you must bring valid proof of auto liability
    insurance if you're taking the driving test.
- id: 19
  category: license_system
  question: What is the minimum age to obtain a Class D Learner Permit if you are
    taking or have passed an approved driver education course?
  choices:
    A: '14'
    B: '15'
    C: 15 ½
    D: '16'
  answer: B
  explanation: The minimum age for a Class D Learner Permit is 15, provided you are
    taking or have passed an approved driver education course.
- id: 20
  category: license_system
  question: What specific certificate must be presented to obtain a Class D Intermediate
    License?
  choices:
    A: Defensive Driving completion certificate
    B: Work Zone Safe completion certificate
    C: Highway Safety completion certificate
    D: First Aid completion certificate
  answer: B
  explanation: To obtain a Class D Intermediate License, the requirements state that
    you must present a Work Zone Safe completion certificate.
- id: 21
  category: safe_driving_rules
  question: If you have a 'Motorcycle License Only' at age 14 or 15, during what hours
    are you permitted to ride?
  choices:
    A: 5:00 a.m. to 10:00 p.m.
    B: 6:00 a.m. to 8:00 p.m.
    C: Sunrise to sunset
    D: 4:30 a.m. to 9:00 p.m.
  answer: D
  explanation: For a Motorcycle License Only, the manual specifies that you may ride
    only between the hours of 4:30 a.m. and 9:00 p.m.
- id: 22
  category: safe_driving_rules
  question: Are you allowed to carry a passenger if you hold a 'Motorcycle License
    Only' before the age of 16?
  choices:
    A: Yes, if they are wearing a helmet
    B: Yes, if they are an immediate family member
    C: No, you cannot carry a passenger
    D: No, unless they are over 21 years old
  answer: C
  explanation: The manual explicitly states for a Motorcycle License Only that 'You
    cannot carry a passenger.' These restrictions are lifted at age 16.
- id: 23
  category: license_system
  question: A Class A, B, or C Commercial License is required for a vehicle designed
    to transport how many passengers (including the driver)?
  choices:
    A: 10 or more
    B: 12 or more
    C: 15 or more
    D: 16 or more
  answer: D
  explanation: A Class A, B or C Commercial License is required for a vehicle designed
    to transport 16 or more passengers, including the driver.
- id: 24
  category: safe_driving_rules
  question: According to Oklahoma law, who is required to wear a helmet when operating
    a motorcycle?
  choices:
    A: Anyone under 18 years of age
    B: Anyone under 21 years of age
    C: All riders regardless of age
    D: Only riders with a learner permit
  answer: A
  explanation: The manual states under the Motorcycle License Permit section that
    'A helmet is required for anyone under 18 years of age.'
- id: 25
  category: license_system
  question: A Class D Learner Permit is valid only when accompanied by a licensed
    driver sitting beside you who is at least what age?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: A Learner Permit is valid only while a licensed driver, 21 or older,
    sits beside the driver.
- id: 26
  category: safe_driving_rules
  question: If you hold a 'Motorcycle License Only' for a motorcycle between 150cc
    and 300cc, where are you NOT allowed to drive?
  choices:
    A: On city streets with a speed limit over 35 mph
    B: On highways with a posted minimum speed limit
    C: On any road after 5:00 p.m.
    D: On two-lane rural highways
  answer: B
  explanation: If your motorcycle is over 150cc but not larger than 300cc, you may
    not drive on a highway with a posted minimum speed limit, such as an interstate
    or turnpike.
- id: 27
  category: license_system
  question: When applying for a license, which of the following is NOT considered
    valid proof of legal presence for a non-U.S. citizen?
  choices:
    A: A valid U.S. Passport
    B: A receipt for an application for presence in the U.S.
    C: An I-551 document
    D: Valid USCIS documentation
  answer: B
  explanation: 'The manual explicitly states: ''A receipt for an application for presence
    in the U.S. is NOT proof of legal presence.'''
- id: 28
  category: driver_testing
  question: When operating with a Motorcycle License Permit, the person instructing
    you must be at least 21, have a motorcycle endorsement, and maintain what with
    you?
  choices:
    A: Radio communication
    B: Visual contact
    C: Physical contact
    D: A following distance of no more than 50 feet
  answer: B
  explanation: You must be receiving instruction from a parent, legal guardian or
    any person 21 or older who has a valid Oklahoma Driver License with a motorcycle
    endorsement added and who has visual contact with the operator.
- id: 29
  category: license_system
  question: Which of the following will NOT be placed on an Oklahoma driver license
    or identification card?
  choices:
    A: Your legal first name
    B: Your date of birth
    C: Titles or ecclesiastical names
    D: Your legal last name
  answer: C
  explanation: The manual states that 'Titles or ecclesiastical names will not be
    placed on a driver license or an identification card.'
- id: 30
  category: driver_testing
  question: After obtaining a Class A, B or C Commercial Learner Permit, how long
    must you wait before you are eligible to take the Skills Tests?
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 180 days
  answer: B
  explanation: 'For a Class A, B or C Commercial Learner Permit, the manual states:
    ''You will be eligible for Skills Tests 14 days after obtaining the permit.'''
- id: 31
  category: license_system
  question: What is required for a person under 18 to apply for an Oklahoma Identification
    Card?
  choices:
    A: A high school diploma
    B: A custodial parent or legal guardian's signature on the consent form
    C: Passing a written knowledge test
    D: Proof of enrollment in driver education
  answer: B
  explanation: The manual states that to get an Identification Card, you must have
    a custodial parent or legal guardian sign the consent form if you are under 18.
- id: 32
  category: driver_testing
  question: How many hours of actual behind-the-wheel training are required for students
    taking Parent-Taught Driver Education?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 55 hours
  answer: D
  explanation: Students in the Parent-Taught Driver Education program are required
    to complete 30 hours of classroom training and 55 hours of actual behind-the-wheel
    training.
- id: 33
  category: safe_driving_rules
  question: Under the Graduated Driver License (GDL) program, a teen's restricted
    driving time is generally limited to which hours?
  choices:
    A: 6 a.m. to 9 p.m.
    B: 5 a.m. to 10 p.m.
    C: 7 a.m. to 11 p.m.
    D: 6 a.m. to 10 p.m.
  answer: B
  explanation: House Bill 1599 restricts teen driving time to the hours of 5 a.m.
    to 10 p.m., with exceptions for work, school, church, or if a licensed driver
    over 21 is seated next to them.
- id: 34
  category: safe_driving_rules
  question: Unless accompanied by a licensed driver over 21, a teen with a restricted
    license is limited to how many passengers?
  choices:
    A: Zero passengers
    B: One passenger, unless all passengers live in the same household
    C: Two passengers
    D: Three passengers
  answer: B
  explanation: The GDL law limits teens with a restricted license to one passenger
    unless all passengers live in the same household, or a licensed driver over 21
    years of age is seated next to the teenager.
- id: 35
  category: penalties_and_points
  question: What happens if you are convicted of a moving violation while holding
    a Graduated Driver License (learner or intermediate)?
  choices:
    A: Your license is permanently revoked
    B: You must pay a $500 fine and retake the driving test
    C: You will remain at your current GDL level until 6 months from the date of conviction
      has elapsed
    D: You are suspended from driving for 30 days
  answer: C
  explanation: If you break the rules and are convicted of a moving violation, you
    will remain at your current GDL level until 6 months from the date of conviction
    has elapsed.
- id: 36
  category: driver_testing
  question: If you fail the written test for a Class D license, how long must you
    wait before retesting?
  choices:
    A: At least one day
    B: At least one week
    C: At least 30 days
    D: You can retest immediately
  answer: A
  explanation: The manual states that if you fail the written test, by law you must
    wait at least one day before retesting.
- id: 37
  category: vehicle_information
  question: Which of the following is a requirement for the vehicle you use to take
    your driving test?
  choices:
    A: It must be less than 10 years old
    B: It must have a valid tag and you must show the security verification form
    C: It must have dual controls for the examiner
    D: It must be a four-door sedan
  answer: B
  explanation: To qualify for the driving test, the car you are using must have a
    valid tag, you must show the security verification form, and it must be in proper
    mechanical condition.
- id: 38
  category: driver_testing
  question: Who is allowed to be in the car with you and the examiner during your
    driving test?
  choices:
    A: A parent or legal guardian
    B: A certified driver education instructor
    C: Your pet
    D: No pets or additional people
  answer: D
  explanation: The manual explicitly states that no pets or additional people can
    be in the car with you and the examiner during the driving test.
- id: 39
  category: driver_testing
  question: Under what conditions will a driving skills test NOT be conducted?
  choices:
    A: When it is cloudy or overcast
    B: When the temperature is below freezing
    C: When roads are considered by the examiner to be slick or hazardous
    D: When it is raining lightly
  answer: C
  explanation: Skills tests will not be conducted when roads are considered by the
    examiner to be slick or hazardous.
- id: 40
  category: license_system
  question: If you have a Learning Permit and are 15 or older, how long must you have
    had your permit before you can take the driving test?
  choices:
    A: At least 30 days
    B: At least 3 months
    C: At least 6 months
    D: At least 1 year
  answer: C
  explanation: According to Table 2, applicants with a Learning Permit (age 15 and
    up) must be 16 years old and have had their permit for at least 6 months to take
    the driving test.
- id: 41
  category: license_system
  question: A 14- or 15-year-old with a motorcycle learner permit must hold the permit
    for how long before taking the driving test?
  choices:
    A: 14 days
    B: 30 days
    C: 6 months
    D: 1 year
  answer: B
  explanation: Table 2 states that a 14-15 year old motorcycle applicant must have
    had their permit for at least 30 days to take the driving test.
- id: 42
  category: license_system
  question: When transferring a valid Class D license from out-of-state, which test
    is strictly required?
  choices:
    A: Vision screening
    B: Written test
    C: Driving test
    D: All of the above
  answer: A
  explanation: Table 2 shows that for an Out-of-State Transfer of a valid Class D
    license, the Vision test is required, while the Written and Driving tests are
    at the discretion of the examiner and may be waived.
- id: 43
  category: driver_responsibility
  question: When a 14- or 15-year-old applies for a motorcycle license, what responsibility
    does the signing parent or guardian assume?
  choices:
    A: They must ride as a passenger at all times
    B: They must pay for the motorcycle's fuel and maintenance
    C: They assume financial and legal responsibility if the teen violates the law,
      damages property, or causes injury
    D: They must complete a basic rider course alongside the teen
  answer: C
  explanation: The manual states the custodial parent or legal guardian must agree
    to assume financial and legal responsibility if the teen violates the law, damages
    property, or causes personal injury while riding.
- id: 44
  category: license_system
  question: If you have been issued a Social Security Number, how will it be displayed
    on your Oklahoma Driver License or ID card?
  choices:
    A: It will be printed on the front of the card
    B: It will be printed on the back of the card
    C: It will be encoded in the magnetic stripe only
    D: It will not appear on your license or ID card
  answer: D
  explanation: 'The manual states: ''If you have been issued a Social Security Number,
    you must know your number when you apply... This number will not appear on your
    license or ID card.'''
- id: 45
  category: vehicle_information
  question: What is the minimum tire tread depth required for your vehicle to pass
    the driving test inspection?
  choices:
    A: 1/32 inch
    B: 2/32 inch
    C: 3/32 inch
    D: 4/32 inch
  answer: B
  explanation: Tires must have a minimum tread depth of 2/32" and no ply or cord exposed
    in the tread to pass the vehicle inspection.
- id: 46
  category: license_system
  question: Who legally owns your Oklahoma driver license?
  choices:
    A: You, the driver
    B: The federal government
    C: The State of Oklahoma
    D: The Department of Transportation
  answer: C
  explanation: You do not own your license. It is the property of the State of Oklahoma
    and can be denied, canceled, suspended or revoked if you do not abide by the laws.
- id: 47
  category: license_system
  question: By law, how many days do you have to notify Service Oklahoma when you
    move and change your address?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: When you move, you are required by law to notify Service Oklahoma within
    10 days.
- id: 48
  category: vehicle_information
  question: During a vehicle inspection, your vehicle's horn must be audible from
    what distance?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: To pass the vehicle inspection before your drive test, your horn must
    be audible at 200 feet.
- id: 49
  category: license_system
  question: Until what age is your Oklahoma driver license considered probationary?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: Until you are 18, your license is probationary, meaning you are in
    a trial period to show you can drive safely and legally.
- id: 50
  category: license_system
  question: What symbol will be printed on the face of your driver license if you
    choose to become an organ and tissue donor?
  choices:
    A: A blue ribbon
    B: A green cross
    C: A red heart
    D: A yellow star
  answer: C
  explanation: Checking the YES box for the organ donor option will cause a red heart
    to be printed on the face of the Driver License or Identification Card.
- id: 51
  category: driver_responsibility
  question: If you are involved in a collision, who are you required by law to show
    your driver license to?
  choices:
    A: Only a police officer or state trooper
    B: Only your insurance agent
    C: Anyone with whom you are involved in the collision
    D: A judge or magistrate only
  answer: C
  explanation: Under License Responsibilities, you must show your license to anyone
    with whom you are involved in a collision.
- id: 52
  category: license_system
  question: On what day does an Oklahoma driver license expire?
  choices:
    A: On your birthday
    B: On the last day of the month in which you paid your fee
    C: Exactly 4 years from the day it was issued
    D: On December 31st of the expiration year
  answer: B
  explanation: Your license can be issued for either 4 or 8 years from the month in
    which you paid your fee for your license. It expires on the last day of the month.
- id: 53
  category: license_system
  question: Military personnel stationed outside Oklahoma do not have to renew their
    driver license until how many days after they return to the state?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: Military personnel stationed outside Oklahoma do not have to renew
    until 60 days after they return to Oklahoma.
- id: 54
  category: vehicle_information
  question: Which of the following windshield damages will cause a vehicle to fail
    inspection?
  choices:
    A: Any tinting on the rear windows
    B: Star breaks or impact points that can be felt by touch
    C: A small scratch on the passenger side window
    D: Tinting that extends 3 inches from the top of the windshield
  answer: B
  explanation: Damage such as star breaks or impact points that can be felt by touch
    will not pass the windshield and glass inspection.
- id: 55
  category: driver_testing
  question: Which of the following is a reason you can fail the driving test?
  choices:
    A: Asking the examiner to repeat an instruction
    B: Refusing to perform a maneuver
    C: Driving a vehicle older than 1994
    D: Having a red heart on your learner permit
  answer: B
  explanation: You can fail the driving test for too many errors, dangerous driving,
    law violations, traffic collisions or refusing to perform a maneuver.
- id: 56
  category: penalties_and_points
  question: State law requires persons convicted of sex offenses or violent crimes
    relocating in Oklahoma to register with local law enforcement within how many
    days?
  choices:
    A: 3 days
    B: 5 days
    C: 10 days
    D: 14 days
  answer: A
  explanation: State Law requires persons convicted of sex offenses or violent crimes
    relocating in this state to register with the Oklahoma Department of Corrections
    within 10 days and local law enforcement within 3 days.
- id: 57
  category: license_system
  question: What does the veteran logo on an Oklahoma driver license look like?
  choices:
    A: A bald eagle with the word "Veteran"
    B: A military dog tag
    C: An American flag with the word "Veteran" underneath it
    D: A gold star with the word "Veteran"
  answer: C
  explanation: The veteran logo is an American flag with the word "Veteran" underneath
    it.
- id: 58
  category: license_system
  question: If your driver license has been expired for over 1 year, what must you
    present to renew it?
  choices:
    A: A certified birth certificate or United States passport
    B: A high school diploma or GED
    C: A recent utility bill and a W-2 form
    D: A voter registration card
  answer: A
  explanation: If your license is expired over 1 year, you must visit a Service Oklahoma
    location or a licensed operator location who is approved to accept a certified
    birth certificate or United States passport.
- id: 59
  category: license_system
  question: What can happen if you fail to notify Service Oklahoma when you change
    your address?
  choices:
    A: Your license may be suspended without you receiving notice.
    B: You will be fined $500 immediately.
    C: Your vehicle registration will be permanently canceled.
    D: You must retake the written driving test.
  answer: A
  explanation: According to the manual, failure to notify Service Oklahoma when you
    change your name or address can result in the suspension of your license without
    your receiving notice of the suspension.
- id: 60
  category: penalties_and_points
  question: What is the penalty upon conviction for driving without a valid license?
  choices:
    A: A fine of up to $250 and 30 days in jail.
    B: A fine of up to $500 or 6 months in jail or both.
    C: Mandatory suspension of driving privileges for one year.
    D: A fine of up to $1,000 and vehicle impoundment.
  answer: B
  explanation: The penalties for driving without a valid license include, on conviction,
    a fine of up to $500 or 6 months in jail or both.
- id: 61
  category: license_system
  question: What does Restriction code '9' on an Oklahoma driver's license mean?
  choices:
    A: The driver must wear corrective lenses.
    B: The driver is restricted to driving a motorcycle only.
    C: The driver must be accompanied by a licensed driver 21 years of age or older
      in the front seat.
    D: The driver can only operate a vehicle with an automatic transmission.
  answer: C
  explanation: Restriction 9 means the driver must be accompanied by a licensed driver
    21 years of age or older in the front seat. This is for people learning to drive.
- id: 62
  category: license_system
  question: Which restriction code is placed on a license for people with insulin-dependent
    diabetes, requiring food, fruit, or candy to be within reach?
  choices:
    A: Restriction 4
    B: Restriction 5
    C: Restriction 6
    D: Restriction 7
  answer: C
  explanation: Restriction 6 requires food, fruit or candy to be within reach of the
    driver, specifically for people with insulin-dependent diabetes.
- id: 63
  category: license_system
  question: Under a Restriction 'T' (Graduated driver license), what are the standard
    allowed driving hours unless traveling for school, church, or work?
  choices:
    A: 6:00 a.m. to 9:00 p.m.
    B: 5:00 a.m. to 10:00 p.m.
    C: 4:30 a.m. to 9:00 p.m.
    D: 7:00 a.m. to 11:00 p.m.
  answer: B
  explanation: Restriction 'T' allows driving from 5 a.m. to 10 p.m. unless for activities
    related to school, church or work, or if accompanied by a licensed driver at least
    21 years old.
- id: 64
  category: license_system
  question: If you are under 16 and have a Restriction '0' (Motorcycle only), between
    what hours are you allowed to ride?
  choices:
    A: 5:00 a.m. to 10:00 p.m.
    B: 6:00 a.m. to 8:00 p.m.
    C: 4:30 a.m. to 9:00 p.m.
    D: Sunrise to sunset
  answer: C
  explanation: For Restriction 0, riders under 16 are restricted to a motor scooter
    or motorcycle with a piston displacement of no more than 300cc, to ride only between
    4:30 a.m. and 9:00 p.m.
- id: 65
  category: penalties_and_points
  question: Service Oklahoma will suspend the driver license of an uninsured driver
    involved in a collision if there is any injury or property damage of at least
    what amount?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: B
  explanation: Service Oklahoma will suspend the driver license of the uninsured driver
    and/or owner of a vehicle involved in a collision where there is any injury or
    property damage of $500 or more.
- id: 66
  category: driver_responsibility
  question: What is the minimum limit of liability for property damage required by
    Oklahoma law per accident?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: D
  explanation: All Oklahoma drivers and/or vehicle owners are required by law to carry
    minimum limits of liability, which includes $25,000 of property damage per accident.
- id: 67
  category: penalties_and_points
  question: What is a possible penalty for failing to produce proof of liability insurance
    to a law enforcement officer upon request?
  choices:
    A: A fine of up to $250, 30 days in jail, or both, plus suspension of license
      and registration.
    B: A fine of up to $500, 6 months in jail, or both.
    C: A felony conviction and permanent revocation of driving privileges.
    D: A warning for the first offense and a $100 fine for the second offense.
  answer: A
  explanation: A conviction of failure to comply with the Compulsory Insurance Law
    or failure to produce proof of insurance can result in a fine of up to $250.00,
    30 days in jail or both, and suspension of license and registration.
- id: 68
  category: penalties_and_points
  question: What is the penalty for fraudulently creating, manufacturing, or counterfeiting
    a security verification form (proof of insurance)?
  choices:
    A: A simple misdemeanor with a $50 fine.
    B: A felony conviction which carries severe penalties in the form of fines and/or
      imprisonment.
    C: A mandatory 30-day suspension of driving privileges only.
    D: A fine of up to $250 and 6 months in jail.
  answer: B
  explanation: To fraudulently create, manufacture or counterfeit a security verification
    form may result in a felony conviction which carries severe penalties in the form
    of both fines and/or imprisonment.
- id: 69
  category: safe_driving_rules
  question: According to Oklahoma's mandatory safety requirements, who is required
    to wear a properly adjusted and fastened safety seat belt system?
  choices:
    A: Only the driver
    B: Every driver and front-seat passenger
    C: Only passengers under the age of 18
    D: All passengers in the vehicle regardless of seating position
  answer: B
  explanation: The manual states that every driver and front-seat passenger must wear
    a properly adjusted and fastened safety seat belt system.
- id: 70
  category: safe_driving_rules
  question: A driver must provide a child passenger restraint system for any transported
    child who is under what age?
  choices:
    A: 4 years of age
    B: 6 years of age
    C: 8 years of age
    D: 10 years of age
  answer: C
  explanation: Every driver, when transporting a child under 8 years of age in a motor
    vehicle, must provide for the protection of said child by properly using a child
    passenger restraint system.
- id: 71
  category: driver_responsibility
  question: If you let an unlicensed person drive your vehicle, who is breaking the
    law?
  choices:
    A: Only the unlicensed driver
    B: Only the owner of the vehicle
    C: Both you and the person who you let drive the car
    D: Neither, as long as the owner is in the passenger seat
  answer: C
  explanation: Even if you have a licensed driver with you, you are breaking the law
    if you don't have a license or Learner Permit. Both you and the person who lets
    you drive the car can be arrested.
- id: 72
  category: license_system
  question: What should you do if a restriction on your license is no longer needed
    or is in error?
  choices:
    A: Cross it out on your physical license with a permanent marker.
    B: Contact a driver license examiner at a Service Oklahoma location.
    C: Wait until your license expires and request the change upon renewal.
    D: Mail a letter to the local police department.
  answer: B
  explanation: When a restriction is no longer needed, such as a learner or physical
    restriction or if it is in error, contact a driver license examiner at a Service
    Oklahoma location.
- id: 73
  category: safe_driving_rules
  question: Until what age must a child passenger restraint system be rear-facing,
    unless the child reaches the manufacturer's weight or height limit?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 4 years
  answer: B
  explanation: The manual states that a child passenger restraint system must be rear-facing
    until the child reaches 2 years of age or until the child reaches the weight or
    height limit of the system.
- id: 74
  category: safe_driving_rules
  question: Where does the Highway Safety Administration recommend placing children
    under 12 years of age if your vehicle has a passenger-side airbag?
  choices:
    A: In the front seat with the airbag disabled
    B: In the front seat with a seatbelt
    C: In the back seat
    D: In a booster seat in the front
  answer: C
  explanation: If your car is equipped with an airbag on the passenger side, the Highway
    Safety Administration recommends putting children under 12 in the back seat due
    to the explosive power of airbags.
- id: 75
  category: defensive_driving
  question: According to the manual, why is the back seat at least 26 percent safer
    than the front seat?
  choices:
    A: It has more airbags
    B: Most serious crashes involve the front of the vehicle
    C: The seatbelts are stronger
    D: It is closer to the vehicle's center of gravity
  answer: B
  explanation: Even without airbags, the back seat is at least 26 percent safer than
    the front seat because most serious crashes involve the front of the vehicle.
- id: 76
  category: signs_and_signals
  question: What color is used for general warning signs?
  choices:
    A: Orange
    B: Yellow
    C: Fluorescent Yellow Green
    D: Red
  answer: B
  explanation: According to the sign color chart in the manual, yellow is used for
    general warning signs.
- id: 77
  category: signs_and_signals
  question: What shape is always used for a regulatory sign telling you about laws,
    regulations, or instructions?
  choices:
    A: Diamond
    B: Octagon
    C: Rectangle
    D: Triangle
  answer: C
  explanation: The manual states that a rectangle is always a regulatory sign, telling
    you about laws and regulations or giving you instructions.
- id: 78
  category: penalties_and_points
  question: What is the maximum penalty if a person damages or removes a traffic control
    device and it results in personal injury or death?
  choices:
    A: A misdemeanor and a $500 fine
    B: A felony punishable by up to 2 years imprisonment and a $1,000 fine
    C: A felony punishable by up to 5 years imprisonment
    D: A $5,000 fine and license revocation
  answer: B
  explanation: If damaging or removing a traffic control device results in personal
    injury or death, the person shall be guilty of a felony punishable by imprisonment
    for not more than 2 years and a fine of $1,000.00 or both.
- id: 79
  category: signs_and_signals
  question: When approaching a red octagon STOP sign, where must you come to a complete
    stop?
  choices:
    A: Only if other vehicles are present
    B: After entering the intersection
    C: Before the pedestrian crosswalk, even if it isn't marked
    D: At the exact location of the sign post
  answer: C
  explanation: At a STOP sign, you must come to a complete stop before the pedestrian
    crosswalk, even if it isn't marked, and stay stopped until the way is clear.
- id: 80
  category: safe_driving_rules
  question: What does a speed limit sign indicate?
  choices:
    A: The suggested speed for the road
    B: The minimum speed you can travel
    C: The highest speed you can travel under ideal conditions
    D: The speed you must maintain at all times
  answer: C
  explanation: A speed limit sign is a regulatory sign that shows the highest speed
    you can travel under ideal conditions.
- id: 81
  category: signs_and_signals
  question: What do diamond-shaped signs with a yellow background and black letters
    indicate?
  choices:
    A: Recreation and cultural areas
    B: Conditions immediately ahead such as road hazards or changes in direction
    C: Traffic laws and regulations
    D: Highway construction and maintenance
  answer: B
  explanation: Warning signs are diamond-shaped, with a yellow background and black
    letters. They signal conditions immediately ahead, such as road hazards or changes
    in direction.
- id: 82
  category: vehicle_information
  question: What should you consider doing when you see a warning sign for a steep
    hill ahead?
  choices:
    A: Shift into neutral
    B: Use a lower gear to slow your vehicle
    C: Accelerate to maintain speed
    D: Turn on your hazard lights
  answer: B
  explanation: When approaching a steep hill, all drivers should approach with caution
    and may want to use a lower gear to slow the vehicle.
- id: 83
  category: signs_and_signals
  question: On a warning sign or barricade, what do diagonal stripes sloping downward
    to the right mean?
  choices:
    A: Bear to the left
    B: Bear to the right
    C: The road is closed ahead
    D: Prepare to stop
  answer: B
  explanation: Stripes sloping downward to the right mean bear to the right. The diagonal
    stripes show the direction in which the traffic is to pass.
- id: 84
  category: safe_driving_rules
  question: When approaching a railroad crossing with an advance warning sign, within
    what distance of the first track should you be prepared to stop?
  choices:
    A: 5 to 10 feet
    B: 15 to 50 feet
    C: 50 to 100 feet
    D: 100 to 200 feet
  answer: B
  explanation: When you see an advance warning sign for railroad tracks, you must
    slow down and be prepared to stop within 15-50 feet of the first track.
- id: 85
  category: sharing_the_road
  question: Which of the following vehicles is required by law to stop at a railroad
    crossing?
  choices:
    A: A passenger car with a trailer
    B: A pickup truck
    C: A school bus
    D: A motorcycle
  answer: C
  explanation: School buses, church buses, motor coaches, and any vehicles hauling
    explosives or flammable liquids are required by law to stop at railroad crossings.
- id: 86
  category: safe_driving_rules
  question: How must a child who is at least 4 years old but younger than 8 years
    old, and shorter than 4 feet 9 inches, be secured in a vehicle?
  choices:
    A: By a child passenger restraint system or a seat belt
    B: Only by a rear-facing car seat
    C: Only by an adult holding them
    D: They are not required to be restrained in the back seat
  answer: A
  explanation: A child at least 4 years of age but younger than 8 years of age, if
    not taller than 4 feet 9 inches in height, shall be properly secured by use of
    a child passenger restraint system or a seat belt.
- id: 87
  category: signs_and_signals
  question: What is the purpose of a 'Center Lane Only' lane marked with left-turn
    arrows?
  choices:
    A: To pass slow-moving vehicles
    B: To park temporarily
    C: To enter only to make a left turn
    D: To make U-turns only
  answer: C
  explanation: The 'Center Lane Only' sign indicates you should enter this lane only
    to make a left turn, and you must not pass in this lane.
- id: 88
  category: sharing_the_road
  question: What does it mean when a railroad crossing is located within a "Quiet
    Zone"?
  choices:
    A: Trains will never sound their horns under any circumstances.
    B: Trains do not blow their horn during normal operation, but may for emergencies.
    C: Vehicles must turn off their radios before crossing the tracks.
    D: The crossing does not have flashing lights or gates.
  answer: B
  explanation: In a Quiet Zone, trains will not sound horns during normal operation,
    but the horn may still be sounded for emergency situations or other safety reasons.
- id: 89
  category: penalties_and_points
  question: What happens to speeding fines in a construction or maintenance zone when
    workers or equipment are present?
  choices:
    A: They are reduced by half.
    B: They remain the same as normal speeding fines.
    C: They are doubled.
    D: They are tripled.
  answer: C
  explanation: Speeding fines are doubled in a construction or maintenance zone when
    workers or equipment are present.
- id: 90
  category: penalties_and_points
  question: What is the penalty for failing to obey construction and maintenance signs,
    signals, and markings?
  choices:
    A: A warning for the first offense.
    B: A felony conviction with up to 1 year in jail.
    C: A misdemeanor punishable by a fine of $100 to $1,000 and/or up to 30 days in
      jail.
    D: A mandatory license suspension for 6 months.
  answer: C
  explanation: On conviction, failing to obey construction signs is a misdemeanor
    punishable by a fine between $100.00 to $1,000.00 and/or up to 30 days in jail
    plus liability for damage or injury.
- id: 91
  category: vehicle_information
  question: 'The Slow Moving Vehicle (SMV) emblem is used on vehicles traveling on
    public highways at speeds of:'
  choices:
    A: 15 MPH or less.
    B: 25 MPH or less.
    C: 35 MPH or less.
    D: 45 MPH or less.
  answer: B
  explanation: The Slow Moving Vehicle emblem is used on equipment traveling on public
    highways at speeds of 25 MPH or less.
- id: 92
  category: signs_and_signals
  question: On north-south interstate highways, where does the milepost numbering
    start?
  choices:
    A: At the northern state line.
    B: At the southern state line.
    C: At the eastern state line.
    D: At the western state line.
  answer: B
  explanation: Milepost numbering on north-south highways starts at the southern line,
    and on east-west highways at the western line.
- id: 93
  category: safe_driving_rules
  question: According to the manual, where is the only lawful place on the highway
    where you can throw trash?
  choices:
    A: In the ditch on the right side of the road.
    B: At any highway exit ramp.
    C: At a litter barrel sign located at rest areas, picnic areas, and toll stations.
    D: Out the window as long as it is biodegradable.
  answer: C
  explanation: The litter barrel sign marks the only lawful place on the highway where
    you can throw trash. Litter barrels are located at all rest and picnic areas and
    all turnpike toll stations.
- id: 94
  category: signs_and_signals
  question: How do color-blind people know the color of a standard vertical traffic
    light?
  choices:
    A: By the shape of the light housing.
    B: 'By the position of the lights: Red on top, Yellow in the middle, Green on
      the bottom.'
    C: By the brightness of the bulbs.
    D: By the flashing pattern of the lights.
  answer: B
  explanation: 'Color-blind people know the color by the position of the lights: Red
    on top—Yellow in the middle—Green on the bottom.'
- id: 95
  category: safe_driving_rules
  question: After coming to a complete stop at a red light, when are you permitted
    to turn left?
  choices:
    A: You may never turn left on a red light.
    B: When turning from a two-way street onto a one-way street.
    C: When turning from a one-way street into a one-way street, unless signs forbid
      it.
    D: Only between the hours of midnight and 6:00 AM.
  answer: C
  explanation: After coming to a complete stop, you may turn left from a one-way street
    into a one-way street unless there are signs forbidding the turn.
- id: 96
  category: signs_and_signals
  question: What should you do when approaching an intersection with a flashing yellow
    arrow for a left turn?
  choices:
    A: Stop completely and wait for a green arrow.
    B: Reduce speed and cautiously proceed with the left turn after yielding to oncoming
      traffic and pedestrians.
    C: Speed up to clear the intersection quickly.
    D: Treat it as a four-way stop.
  answer: B
  explanation: A flashing yellow arrow means you should reduce speed and cautiously
    proceed with a left turn after yielding to oncoming traffic and pedestrians.
- id: 97
  category: signs_and_signals
  question: 'A flashing red traffic light at a dangerous intersection means the same
    as a:'
  choices:
    A: Yield sign.
    B: Stop sign.
    C: Warning sign.
    D: Do Not Enter sign.
  answer: B
  explanation: 'A flashing red light means the same as a stop sign: You may go when
    it’s safe to cross the intersection.'
- id: 98
  category: safe_driving_rules
  question: If a traffic officer is directing traffic at an intersection with working
    traffic signals, what must you do?
  choices:
    A: Obey the traffic signals and ignore the officer.
    B: Obey the traffic officer at all times, even if it contradicts the signals.
    C: Treat the intersection as a four-way stop.
    D: Pull over and wait for the officer to leave.
  answer: B
  explanation: You must obey traffic signals, except when an officer is directing
    traffic. Then you must obey the traffic officer at all times.
- id: 99
  category: signs_and_signals
  question: What does a flashing "Don't Walk" pedestrian signal indicate?
  choices:
    A: Pedestrians should run across the street.
    B: Pedestrians may leave the curb if they hurry.
    C: Pedestrians should not leave the curb, but continue if already in the intersection.
    D: All vehicles must stop immediately.
  answer: C
  explanation: A flashing "Don't Walk" sign means pedestrians should not leave the
    curb, but continue if already in the intersection.
- id: 100
  category: signs_and_signals
  question: What does a yellow "X" lane control signal indicate?
  choices:
    A: The lane is open for traffic.
    B: You must clear the lane.
    C: You are driving in the wrong direction.
    D: You must stop immediately in that lane.
  answer: B
  explanation: A yellow "X" lane control signal means to clear the lane. If it is
    flashing, a left turn is permitted.
- id: 101
  category: signs_and_signals
  question: What does a solid yellow line in your lane next to a broken yellow line
    mean?
  choices:
    A: Passing is permitted for traffic in your lane.
    B: You are on a one-way street.
    C: Do not pass.
    D: You must turn left at the next intersection.
  answer: C
  explanation: A yellow solid line in your lane means "DO NOT PASS". Passing is only
    permitted if the broken line is in your lane.
- id: 102
  category: safe_driving_rules
  question: When two vehicles approach an intersection without stop signs or signals
    at the same time, who has the right-of-way?
  choices:
    A: The driver on the right yields to the driver on the left.
    B: The driver on the left yields to the driver on the right.
    C: The vehicle traveling faster has the right-of-way.
    D: The larger vehicle has the right-of-way.
  answer: B
  explanation: At intersections without stop signs or signals, when two vehicles approach
    at the same time, the driver on the left yields to the driver on the right.
- id: 103
  category: sharing_the_road
  question: How far must a vehicle stop from a blind person in the roadway or at an
    intersection?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: The law states that a vehicle must stop 15 feet from a blind person
    in the roadway or at an intersection.
- id: 104
  category: penalties_and_points
  question: What is the penalty for failing to stop for a school bus with red loading/unloading
    lights flashing?
  choices:
    A: A $500 fine and 30 days in jail.
    B: Mandatory revocation of driver license for one year.
    C: Suspension of driver license for 6 months.
    D: A warning for the first offense.
  answer: B
  explanation: It is mandatory revocation of driver license for one year for failing
    to stop for a school bus with red loading/unloading lights flashing.
- id: 105
  category: safe_driving_rules
  question: Under the Move Over Law (Bernardo-Mills Law), what must you do when approaching
    a stationary vehicle with flashing lights on a multi-lane road?
  choices:
    A: Stop immediately and wait for instructions.
    B: Honk your horn to warn the stationary vehicle.
    C: Move over to a lane that isn't next to the stopped vehicle if it's safe to
      do so.
    D: Maintain your speed and stay in the right lane.
  answer: C
  explanation: On a multi-lane road going in your direction, you must move over to
    a lane that isn’t next to the stopped vehicle if it’s safe to do so, or slow down
    and drive carefully if you cannot safely change lanes.
- id: 106
  category: sharing_the_road
  question: How should you treat a funeral procession at an intersection?
  choices:
    A: The procession must stop at all red lights and stop signs.
    B: The vehicles in the procession may follow the lead vehicle through the intersection
      regardless of traffic control devices.
    C: The procession must yield to all other traffic at intersections.
    D: The procession is only allowed to proceed without stopping if escorted by police.
  answer: B
  explanation: When the funeral lead vehicle enters an intersection, the remaining
    vehicles in the procession may follow through the intersection regardless of any
    traffic control devices.
- id: 107
  category: defensive_driving
  question: What is the proper speed control technique when crossing an intersection?
  choices:
    A: Maintain a constant speed before and during the crossing.
    B: Speed up before entering and slow down while crossing.
    C: Slow down before you enter, then increase your speed until you've cleared the
      intersection.
    D: Stop in the middle of the intersection to check for traffic.
  answer: C
  explanation: You should slow down before you enter, then increase your speed until
    you’ve cleared the intersection. DO NOT slow down while you’re turning or crossing.
- id: 108
  category: safe_driving_rules
  question: If a police officer signals you to stop while you are driving in the left
    lane, what should you do?
  choices:
    A: Pull over to the left shoulder immediately.
    B: Stop in your current lane and turn on hazard lights.
    C: Pull over to the right shoulder, even if it means crossing several lanes of
      traffic.
    D: Speed up to find the nearest exit.
  answer: C
  explanation: If an officer signals you to stop while you’re driving in the left
    lane, you must still pull over to the right shoulder, even if that means crossing
    several lanes of traffic.
- id: 109
  category: sharing_the_road
  question: In which of the following situations are you NOT required to stop for
    a school bus?
  choices:
    A: When you are running late for work.
    B: When the bus is on a different roadway or a divided highway.
    C: When the bus driver waves at you.
    D: When there are no children visible around the bus.
  answer: B
  explanation: You DON’T have to stop for a school bus when the bus is on a different
    roadway, or approaching traffic on a divided highway.
- id: 110
  category: defensive_driving
  question: What is a 'Secondary Crash'?
  choices:
    A: A crash involving more than two vehicles.
    B: Any crash that occurs because of another crash or incident, often due to distracted
      drivers.
    C: A crash that happens on a secondary road or side street.
    D: A minor collision that results in no injuries.
  answer: B
  explanation: A Secondary Crash is any crash that occurs because of another crash
    or incident. Many times, secondary crashes happen because a driver becomes distracted
    by the sight of a crash and takes their eyes off the road.
- id: 111
  category: safe_driving_rules
  question: What should you do if traffic is stopped and blocking an intersection
    you wish to cross?
  choices:
    A: Enter the intersection and wait until traffic clears.
    B: Honk your horn until the vehicles move.
    C: Stop before reaching the crosswalk and wait for the traffic to move.
    D: Maneuver around the stopped vehicles by using the oncoming lane.
  answer: C
  explanation: If traffic is stopped and is blocking an intersection, stop before
    reaching the crosswalk and wait for the traffic to move.
- id: 112
  category: safe_driving_rules
  question: 'When entering a public road from a private driveway or alley, you must:'
  choices:
    A: Yield only to vehicles, not pedestrians.
    B: Stop before the sidewalk or crosswalk, then go when it's safe to do so.
    C: Accelerate quickly to merge into traffic without stopping.
    D: Sound your horn and proceed without stopping.
  answer: B
  explanation: When entering or crossing a public road from a private road, alley,
    driveway or building, you must stop before the sidewalk or crosswalk, then go
    when it’s safe to do so.
- id: 113
  category: signs_and_signals
  question: What is one thing that yellow and white pavement markings show you?
  choices:
    A: The exact speed limit for the road.
    B: Where visibility is limited and passing is dangerous.
    C: The distance to the next major city.
    D: Where parking is free of charge.
  answer: B
  explanation: Yellow and white pavement markings show you which lane you should be
    using, where visibility is limited and passing is dangerous, where traffic is
    traveling toward you, and where you may safely wait for a left turn.
- id: 114
  category: driver_responsibility
  question: What should you do if another driver does not follow the rules of right-of-way?
  choices:
    A: Maintain your course and speed to assert your right-of-way.
    B: Yield to them when there is a possibility of damage or injury.
    C: Honk your horn and force them to stop.
    D: Report them to the police immediately while driving.
  answer: B
  explanation: When other people don’t follow the rules of right-of-way, you should
    yield—even if the right-of-way belongs to you—when there is a possibility of damage
    or injury.
- id: 115
  category: defensive_driving
  question: Which of the following should you NOT do when approaching a Traffic Incident
    Management (TIM) scene?
  choices:
    A: Slow down and proceed with caution.
    B: Move over to another lane if possible.
    C: Rubberneck to see what happened.
    D: Follow directions from emergency responders.
  answer: C
  explanation: When approaching a TIM scene, a driver should stay alert, move over,
    slow down, follow directions, and 'Do not Rubberneck'.
- id: 116
  category: sharing_the_road
  question: When yielding to a blind person crossing the street, where should you
    stop your vehicle?
  choices:
    A: Inside the crosswalk to protect them from other cars.
    B: Outside the crosswalk, not in the crosswalk.
    C: On top of the crosswalk lines.
    D: At least 50 feet away from the crosswalk.
  answer: B
  explanation: The law says you should stop immediately and let the person pass, and
    stop outside the crosswalk, not in the crosswalk.
- id: 117
  category: signs_and_signals
  question: What do yellow dashed lines on a roadway indicate?
  choices:
    A: Traffic moves in the same direction and passing is prohibited
    B: Traffic moves in opposite directions and passing is permitted when safe
    C: Traffic moves in the same direction and passing is permitted
    D: Traffic moves in opposite directions and passing is prohibited
  answer: B
  explanation: Yellow dashes mean traffic moves in opposite directions on each side
    of the line, and passing is permitted when it is safe.
- id: 118
  category: signs_and_signals
  question: 'A solid white line between lanes of traffic means:'
  choices:
    A: Traffic moves in opposite directions and passing is safe
    B: Traffic moves in the same direction, but passing is hazardous
    C: You are approaching a no-passing zone on a two-way road
    D: The lane is reserved for left turns only
  answer: B
  explanation: A solid white line indicates that traffic moves in the same direction
    on each side of the line, but passing is hazardous, such as when approaching an
    intersection or merge area.
- id: 119
  category: safe_driving_rules
  question: On a three-lane highway, what is the center lane used for?
  choices:
    A: Passing slower vehicles
    B: Normal driving
    C: Left turns only
    D: Emergency stopping
  answer: C
  explanation: On three-lane highways, drivers from either direction may use the center
    lane for left turns. You must enter this center lane only to make a left turn
    and must not pass in this lane.
- id: 120
  category: safe_driving_rules
  question: Why is driving too slowly on an expressway against the law?
  choices:
    A: It causes excessive wear on your vehicle's engine
    B: It is dangerous to the flow of traffic
    C: It reduces fuel efficiency
    D: It prevents emergency vehicles from passing
  answer: B
  explanation: The manual states that driving too slowly on an expressway is against
    the law because it is dangerous.
- id: 121
  category: defensive_driving
  question: What is the recommended following distance on an expressway in bad weather?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: C
  explanation: You should stay 3 seconds behind the vehicle in front of you on an
    expressway, but allow 4 seconds in bad weather.
- id: 122
  category: defensive_driving
  question: How far ahead should you watch for cars braking, entering, and exiting
    on an expressway?
  choices:
    A: 5-10 seconds
    B: 10-15 seconds
    C: 15-20 seconds
    D: 20-30 seconds
  answer: C
  explanation: To avoid collisions on an expressway, you should watch 15-20 seconds
    ahead for cars braking, entering, and exiting.
- id: 123
  category: safe_driving_rules
  question: If you miss your exit on a controlled-access highway, what should you
    do?
  choices:
    A: Cross the median to turn around
    B: Carefully back up on the right shoulder
    C: Make a U-turn at the next emergency vehicle turnaround
    D: Keep driving to the next exit, get off, and re-enter in the other direction
  answer: D
  explanation: Never turn around on the expressway or cross the median. Keep driving
    to the next exit, get off, and re-enter the highway in the other direction.
- id: 124
  category: safe_driving_rules
  question: 'When entering an expressway from an acceleration lane, you must:'
  choices:
    A: Yield to vehicles already on the expressway
    B: Force your way into the right lane
    C: Stop at the end of the ramp and wait for a gap
    D: Maintain a speed of 40 mph regardless of traffic
  answer: A
  explanation: When entering the expressway, you must yield to vehicles already on
    the expressway, enter in the acceleration lane, and adjust your speed.
- id: 125
  category: safe_driving_rules
  question: When leaving an expressway, how far in advance should you signal your
    right turn?
  choices:
    A: At least 50 feet before the exit
    B: At least 100 feet before the exit
    C: At least 200 feet before the exit
    D: At least 500 feet before the exit
  answer: B
  explanation: When leaving the expressway, you should signal right at least 100 feet
    before the exit.
- id: 126
  category: safe_driving_rules
  question: Before moving to the left to pass another vehicle, you should check ahead
    for at least how much clear roadway?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: Do not move to the left until you are sure you can do it safely. Check
    ahead for at least 200 feet of clear roadway without a 'No Passing Zone.'
- id: 127
  category: safe_driving_rules
  question: After passing a car on the left, when is it safe to return to the right
    lane?
  choices:
    A: As soon as your rear bumper clears their front bumper
    B: When you can see the passed car in your rearview mirror
    C: When the passed car flashes its headlights
    D: Three seconds after you have passed the vehicle
  answer: B
  explanation: Pass the car ahead and don't return to the right lane until you can
    see that car in the rearview mirror.
- id: 128
  category: safe_driving_rules
  question: Under which condition is it legally permitted to pass a vehicle on the
    right?
  choices:
    A: When the vehicle in front of you is making or about to make a left turn
    B: By driving off the pavement onto the shoulder
    C: When you are in a school zone
    D: When the vehicle ahead is driving below the speed limit on a two-lane road
  answer: A
  explanation: You may overtake and pass on the right when the vehicle in front of
    you is making or about to make a left turn. You can never legally pass on the
    right by driving off the pavement.
- id: 129
  category: safe_driving_rules
  question: You must NOT pass another vehicle within how many feet of an obstructed
    view, such as a bridge or tunnel?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: DO NOT PASS within 100 feet of an obstructed view or if vehicles or
    pedestrians might cross your path, such as bridges, viaducts, tunnels, or intersections.
- id: 130
  category: sharing_the_road
  question: What should you do if another vehicle is passing you?
  choices:
    A: Speed up so they can merge behind you
    B: Move to the left to block them if they are speeding
    C: Stay in your lane and do not increase your speed
    D: Honk your horn to alert them of your presence
  answer: C
  explanation: When someone is passing you, stay in your lane, move right if being
    passed on the left, and don't increase your speed.
- id: 131
  category: sharing_the_road
  question: What should you do if another vehicle is passing you and a car approaches
    from the opposite direction?
  choices:
    A: Increase your speed to get out of the way quickly.
    B: Move into the left lane to block the passing vehicle.
    C: Slow down and let the passing driver pull in front of you.
    D: Honk your horn to warn the passing driver.
  answer: C
  explanation: If a car approaches from the other direction while you're being passed,
    you should slow down and let the passing driver pull in front of you to keep everyone
    safe.
- id: 132
  category: safe_driving_rules
  question: How far in advance must you signal before you turn, slow down, or stop?
  choices:
    A: At least 50 feet or 1/4 of a block.
    B: At least 100 feet or 1/3 of a block.
    C: At least 200 feet or 1/2 of a block.
    D: At least 500 feet.
  answer: B
  explanation: The manual states that you should signal for at least 100 feet or 1/3
    of a block before you turn, slow down, or stop.
- id: 133
  category: signs_and_signals
  question: What is the correct arm signal to indicate you are slowing or stopping?
  choices:
    A: Arm and hand extended straight out.
    B: Arm and hand pointed upward.
    C: Arm and hand pointed down with palm to the rear.
    D: Waving the hand up and down out the window.
  answer: C
  explanation: The proper arm signal for slowing or stopping is extending your arm
    and hand pointed down with the palm to the rear.
- id: 134
  category: defensive_driving
  question: Why should you avoid turning your steering wheel to the left while waiting
    for oncoming traffic to pass before making a left turn?
  choices:
    A: It causes unnecessary wear on your power steering system.
    B: If you are hit from the rear, the impact can push you into oncoming cars.
    C: It makes it harder for vehicles behind you to see your turn signal.
    D: It is illegal to turn your wheels while stopped at an intersection.
  answer: B
  explanation: If you are hit from the rear while your wheels are turned to the left,
    the impact can push you right into oncoming cars. You should wait until you can
    complete the turn before turning the wheels.
- id: 135
  category: vehicle_information
  question: When making a turn, at what point should you select the proper gear?
  choices:
    A: While you are in the middle of the intersection.
    B: Just after you complete the turn.
    C: Before entering the intersection.
    D: While you are braking during the turn.
  answer: C
  explanation: You should select the proper gear before entering the intersection
    and accelerate slightly through the turn. You should not shift gears in the intersection.
- id: 136
  category: safe_driving_rules
  question: What is the recommended speed when making a turn?
  choices:
    A: 10 mph or less.
    B: 15 mph or less.
    C: 20 mph or less.
    D: 25 mph or less.
  answer: A
  explanation: The manual states that the recommended speed when turning is 10 mph
    or less.
- id: 137
  category: safe_driving_rules
  question: When you and another driver meet at an intersection and both of you want
    to turn left, how should you proceed?
  choices:
    A: Both drivers should turn to the right of each other.
    B: The driver who arrived first has the right-of-way.
    C: Each driver will turn to the left of the other.
    D: Both drivers must pull forward and wait in the center of the intersection.
  answer: C
  explanation: When meeting another driver at an intersection and both want to turn
    left, each will turn to the left of the other, leaving from the left lane and
    entering in the left lane.
- id: 138
  category: vehicle_information
  question: What is the proper technique for looking behind you when backing up a
    vehicle?
  choices:
    A: Rely entirely on your rearview mirror.
    B: Use both your rearview and side mirrors.
    C: Place your right arm on the back of the seat and look directly through the
      rear window.
    D: Open the driver's side door and look backward.
  answer: C
  explanation: When backing up, you should place your right arm on the back of the
    seat and look directly through the rear window.
- id: 139
  category: safe_driving_rules
  question: According to the manual, which of the following should you NEVER do when
    backing up?
  choices:
    A: Steer slightly in the direction the rear of the vehicle should move.
    B: Keep your speed slow.
    C: Use your rearview mirror for backing up.
    D: Place your left hand at the 12 o'clock position on the steering wheel.
  answer: C
  explanation: 'The manual explicitly states: ''Never use your rearview mirror for
    backing up.'''
- id: 140
  category: safe_driving_rules
  question: What does the 'Basic Speed Rule' require of drivers?
  choices:
    A: You must always drive at the exact posted speed limit.
    B: You must drive at a speed that is safe for the current conditions.
    C: You must drive 5 mph below the speed limit at night.
    D: You must never drive slower than the posted speed limit.
  answer: B
  explanation: The Basic Speed Rule does not set an exact speed limit but means that
    the speed you may drive is limited by the current conditions, requiring you to
    drive at a speed that is safe and allows you to stop without hitting anyone.
- id: 141
  category: penalties_and_points
  question: What is the maximum penalty for violating the Basic Speed Rule?
  choices:
    A: A $250 fine and 10 days in jail.
    B: A $500 fine and suspension of your license.
    C: A fine up to $654.00 and 30 days in jail.
    D: A $1,000 fine and 60 days in jail.
  answer: C
  explanation: Upon conviction of speeding (violating the Basic Speed Rule), you may
    be fined up to $654.00 and sentenced to 30 days in jail.
- id: 142
  category: penalties_and_points
  question: Under what circumstances do speeding fines double?
  choices:
    A: When driving at night on a two-lane highway.
    B: In school and construction zones when workers or equipment are present.
    C: When driving in heavy rain or fog.
    D: When passing another vehicle on a county road.
  answer: B
  explanation: Fines double in school and construction zones when workers or equipment
    are present.
- id: 143
  category: safe_driving_rules
  question: Unless otherwise posted, what is the state speed limit on turnpikes?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: Under state law, unless otherwise posted, the speed limit on turnpikes
    is 80 mph.
- id: 144
  category: safe_driving_rules
  question: What is the speed limit in a properly marked school zone on a highway
    outside of a municipality, unless otherwise posted?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: The state speed limit for school zones on any highway outside of a
    municipality in a properly marked zone is 25 mph, unless otherwise posted.
- id: 145
  category: defensive_driving
  question: What does it mean to 'overdrive your lights' when driving at night?
  choices:
    A: Using high beams when approaching oncoming traffic
    B: Driving so fast that you cannot stop within the distance you can see
    C: Leaving your headlights on during the daytime
    D: Using colored lenses that reduce the brightness of your headlights
  answer: B
  explanation: Overdriving your lights means you are driving too fast to stop within
    the distance you can see with your headlights. You must adjust your speed so you
    can stop before hitting objects in front of you.
- id: 146
  category: defensive_driving
  question: If you suspect another driver is targeting you in a road rage incident,
    what is the safest course of action?
  choices:
    A: Drive home immediately and lock your doors
    B: Pull over to the side of the road and confront the driver
    C: Go to a safe place with people, such as a police or fire station
    D: Speed up to lose the aggressive driver in traffic
  answer: C
  explanation: 'If you suspect another driver is targeting you, go to a safe place
    such as a police, fire or gas station where there are people, and call 911 if
    necessary. The manual explicitly warns: DO NOT drive home.'
- id: 147
  category: vehicle_information
  question: Which of the following is NOT listed as a factor that affects your stopping
    distance?
  choices:
    A: Your own reaction time
    B: The weight of your vehicle
    C: The condition of your brakes
    D: The time of day
  answer: D
  explanation: Stopping distance depends on your reaction time, weather and road conditions,
    the weight of your vehicle, and the condition of your brakes. Time of day is not
    listed as a direct factor for stopping distance.
- id: 148
  category: safe_driving_rules
  question: During the stopping process, what happens during the 'reaction' step?
  choices:
    A: You see or hear the danger
    B: Your brain tells your foot to brake
    C: You press the brake pedal until the car stops
    D: Your vehicle's antilock braking system engages
  answer: B
  explanation: According to the perception, reaction, and braking time chart, the
    reaction step is when the 'brain tells foot to brake' and takes about .66 seconds.
- id: 149
  category: defensive_driving
  question: What is the proper braking technique if you experience a flat tire or
    blowout?
  choices:
    A: Brake suddenly to stop as quickly as possible
    B: Tap your brakes slightly about one second apart
    C: Take your foot off the gas pedal and apply your brakes cautiously
    D: Pump the brake pedal rapidly
  answer: C
  explanation: For a flat tire or blowout, you should take your foot off the gas pedal
    and apply your brakes cautiously. The manual emphasizes to NEVER brake suddenly.
- id: 150
  category: defensive_driving
  question: If your vehicle runs off the pavement, what should you do to safely return
    to the road?
  choices:
    A: Jerk the steering wheel hard to the left
    B: Hold the steering wheel firmly, apply brakes lightly, and reduce speed
    C: Accelerate to gain traction on the loose shoulder
    D: Slam on the brakes and come to a complete stop off the road
  answer: B
  explanation: If you run off the pavement, hold the steering wheel firmly, apply
    your brakes lightly, and reduce your speed until you can safely return to the
    pavement.
- id: 151
  category: defensive_driving
  question: As a general rule, what should you do if your car starts to skid on an
    icy road?
  choices:
    A: Press the brake pedal as hard as you can
    B: Shift into neutral and use the emergency brake
    C: Take your foot off the brake and turn the steering wheel in the direction of
      the skid
    D: Steer in the opposite direction of the skid and accelerate
  answer: C
  explanation: If the car starts to skid, take your foot off the brake and turn the
    steering wheel in the direction of the skid, provided it does not steer you into
    oncoming traffic or danger.
- id: 152
  category: safe_driving_rules
  question: Why are roads likely to be very slick just after it begins to rain or
    drizzle?
  choices:
    A: The rain freezes immediately upon hitting the pavement
    B: The first few drops loosen built-up grease and dirt, creating a slippery film
    C: Rain causes the asphalt to expand and become smooth
    D: The water washes away the painted lane markings
  answer: B
  explanation: The roads are very slick just after it begins to rain because the first
    few drops loosen built-up grease and dirt on the road surface, covering it with
    a slippery film.
- id: 153
  category: defensive_driving
  question: What does 'hydroplaning' mean?
  choices:
    A: Your vehicle's brakes lock up on a wet surface
    B: Your tires lose contact with the road surface and ride on a film of water
    C: Water enters your engine block and causes it to stall
    D: Your vehicle slides sideways on black ice
  answer: B
  explanation: Hydroplaning means that your tires lose contact with the road surface
    and ride on the film of water, which reduces traction and increases stopping distance.
- id: 154
  category: safe_driving_rules
  question: What is one recommended method for determining a safe following distance?
  choices:
    A: Allow one car length for every 10 miles per hour of speed
    B: Keep exactly 50 feet between you and the car ahead at all times
    C: Allow one car length for every 20 miles per hour of speed
    D: Use the 'two-second rule' in all weather conditions
  answer: A
  explanation: To maintain a cushion of safety, the manual recommends allowing one
    car length for every 10 miles per hour of speed, or using the 'three-second rule'.
- id: 155
  category: sharing_the_road
  question: If you are traveling in a motorcade or funeral procession outside of a
    business or residential area, how much space should you leave between vehicles?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: C
  explanation: If traveling in a caravan or motorcade outside of a business or residential
    area, you should leave at least 200 feet between each vehicle so other cars or
    trucks can enter the line safely.
- id: 156
  category: sharing_the_road
  question: Why can it be dangerous to follow a truck too closely at higher speeds
    or on wet pavement?
  choices:
    A: Trucks always take much longer to stop than cars in wet conditions
    B: The truck's exhaust will obscure your vision
    C: Trucks may have better traction and be able to stop more quickly than a car
    D: The truck will hydroplane more easily than a car
  answer: C
  explanation: At higher speeds or on wet pavement, trucks may have better traction
    and be able to stop more quickly than a car. If following too closely, you may
    not be able to stop in time to avoid rear-ending the truck.
- id: 157
  category: defensive_driving
  question: When driving on ice, snow, or gravel in a vehicle with standard brakes,
    how should you apply the brakes to stop?
  choices:
    A: Slam on the brakes to lock the wheels
    B: Tap the brakes slightly, about one second apart
    C: Press the brake pedal firmly and hold it down
    D: Pump the brakes as rapidly as possible
  answer: B
  explanation: 'On ice, snow, sleet, gravel, sand and other loose surfaces, you should
    tap the brakes slightly, about one second apart. Braking suddenly can make the
    car skid. (Note: Never tap antilock brakes).'
- id: 158
  category: sharing_the_road
  question: Why might a truck be able to stop more quickly than a car at higher speeds
    or on wet pavement?
  choices:
    A: They have lighter frames.
    B: They have better traction.
    C: They have specialized anti-lock brakes.
    D: They have a lower center of gravity.
  answer: B
  explanation: According to the manual, at higher speeds or on wet pavement, trucks
    may have better traction and be able to stop more quickly than a car.
- id: 159
  category: safe_driving_rules
  question: When following another vehicle, what is the recommended following distance
    based on your speed?
  choices:
    A: One car length for every 10 mph of speed.
    B: Two car lengths for every 10 mph of speed.
    C: One car length for every 5 mph of speed.
    D: Three car lengths for every 20 mph of speed.
  answer: A
  explanation: The manual recommends allowing at least one car length for every 10
    mph of speed or applying the three-second rule.
- id: 160
  category: defensive_driving
  question: To increase your response time and help avoid rear-end collisions, how
    far ahead should you watch for brake lights?
  choices:
    A: Only the car immediately in front of you.
    B: Two cars down the line.
    C: Four or five cars down the line.
    D: Ten cars down the line.
  answer: C
  explanation: The manual advises to watch for brake lights on the four or five cars
    down the line to increase your response time.
- id: 161
  category: defensive_driving
  question: If someone is following you too closely (tailgating) and slowing down
    does not encourage them to pass, what should you do?
  choices:
    A: Speed up to increase the distance between you.
    B: Slam on your brakes to warn them.
    C: Pull over, stop, and let the tailgater pass.
    D: Turn on your hazard lights and maintain your speed.
  answer: C
  explanation: If flashing brake lights and slowing down fail, the manual states you
    should pull over, stop, and let the tailgater pass in a safe area.
- id: 162
  category: safe_driving_rules
  question: When you leave your parked car, truck, or van, which of the following
    is a required step?
  choices:
    A: Leave the keys in the ignition for emergencies.
    B: Put the gear in neutral.
    C: Set the parking brake.
    D: Turn on your parking lights.
  answer: C
  explanation: When you leave your vehicle, you must set the parking brake, put the
    gear in low, reverse or 'park', turn off the motor, and lock the ignition/remove
    the key.
- id: 163
  category: defensive_driving
  question: If your vehicle breaks down on a highway, what should you do after moving
    it completely off the highway?
  choices:
    A: Stand in the lane to direct traffic around your car.
    B: Turn on the emergency flashers.
    C: Leave the driver's side door open to signal distress.
    D: Have children stand near the road to wave for help.
  answer: B
  explanation: If your vehicle breaks down, move it completely off the highway and
    turn on the emergency flashers.
- id: 164
  category: safe_driving_rules
  question: When backing out of an angle parking space, what should you do to warn
    pedestrians nearby?
  choices:
    A: Turn on your high beams.
    B: Flash your hazard lights.
    C: Tap the horn.
    D: Rev your engine.
  answer: C
  explanation: When backing out of an angle parking space, the manual instructs drivers
    to tap the horn to warn pedestrians nearby.
- id: 165
  category: safe_driving_rules
  question: When parallel parking, how close must you park to the curb?
  choices:
    A: Within 6 inches.
    B: Within 12 inches.
    C: Within 18 inches.
    D: Within 24 inches.
  answer: C
  explanation: Unless signs prohibit it or the curb is painted yellow, you may park
    parallel to any curb and within 18 inches of the curb.
- id: 166
  category: safe_driving_rules
  question: When parallel parking on a hill, how close should you stop to the curb?
  choices:
    A: Within 6 inches.
    B: Within 12 inches.
    C: Within 18 inches.
    D: Within 24 inches.
  answer: A
  explanation: To park on a hill, the manual states you should parallel park as usual,
    but stop within six inches of the curb.
- id: 167
  category: safe_driving_rules
  question: How should you turn your wheels when parking facing downhill with a curb?
  choices:
    A: Turn your wheels sharply away from the curb.
    B: Turn your wheels toward the curb.
    C: Keep your wheels perfectly straight.
    D: Turn your wheels to the left.
  answer: B
  explanation: When facing downhill, you should turn your wheels toward the curb and
    drive forward slowly until the wheel is against the curb.
- id: 168
  category: safe_driving_rules
  question: When starting your vehicle on a hill and driving out into traffic, who
    has the right-of-way?
  choices:
    A: You have the right-of-way because you are entering the lane.
    B: The drivers already traveling in the lane.
    C: The vehicle traveling at the slowest speed.
    D: Pedestrians on the opposite side of the street.
  answer: B
  explanation: When driving out from a parked position on a hill, it is your responsibility
    to wait for an opening because the drivers already traveling have the right-of-way.
- id: 169
  category: penalties_and_points
  question: What is the penalty for making a false statement in an application for
    a disabled parking placard or using it without authorization?
  choices:
    A: A written warning.
    B: A fine of up to $500.
    C: A misdemeanor.
    D: A felony.
  answer: C
  explanation: Making a false statement in an application or unauthorized use of a
    disabled parking permit is a misdemeanor.
- id: 170
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet.
    B: 15 feet.
    C: 20 feet.
    D: 30 feet.
  answer: B
  explanation: The manual lists unlawful parking places, which includes parking within
    15 feet of a fire hydrant.
- id: 171
  category: safe_driving_rules
  question: You are not allowed to park within how many feet of the nearest rail of
    a railroad crossing?
  choices:
    A: 15 feet.
    B: 20 feet.
    C: 30 feet.
    D: 50 feet.
  answer: D
  explanation: It is illegal to park within 50 feet of the nearest rail of a railroad
    crossing.
- id: 172
  category: safe_driving_rules
  question: Under what circumstances is it legally permissible to stop or park your
    vehicle on a bridge or elevated structure?
  choices:
    A: When you need to check your GPS or mobile device.
    B: When necessary to avoid conflict with other traffic.
    C: When picking up or dropping off a pedestrian.
    D: When you have a valid disabled parking permit.
  answer: B
  explanation: The law states that no person shall stop or park on a bridge except
    when necessary to avoid conflict with other traffic, or in compliance with the
    law, a police officer, or a traffic-controlled device.
- id: 173
  category: sharing_the_road
  question: Who has the right-of-way in an unmarked crosswalk?
  choices:
    A: The vehicle traveling at the posted speed limit.
    B: The vehicle turning right on a red light.
    C: The pedestrian.
    D: Bicyclists only.
  answer: C
  explanation: Pedestrians in a crosswalk have the right-of-way over most vehicles,
    whether the crosswalk is marked or not.
- id: 174
  category: sharing_the_road
  question: How can you identify a blind pedestrian to whom you must yield?
  choices:
    A: They are wearing a yellow reflective vest.
    B: They are carrying a white or chrome cane or using a guide dog.
    C: They are accompanied by a crossing guard.
    D: They are carrying a red flag.
  answer: B
  explanation: Drivers must yield to blind pedestrians carrying a white or chrome
    cane or using a guide dog.
- id: 175
  category: defensive_driving
  question: If you are driving on a multi-lane street and the car in the lane next
    to you suddenly stops for no apparent reason, what should you do?
  choices:
    A: Speed up to pass the stopped car quickly.
    B: Honk your horn to alert the stopped driver to keep moving.
    C: Change lanes and proceed at the posted speed limit.
    D: Slow down and look out, as the driver may be stopped for a pedestrian.
  answer: D
  explanation: If you see the car in the lane next to you stop suddenly for no apparent
    reason, slow down and look out. That driver may be stopped for a pedestrian.
- id: 176
  category: sharing_the_road
  question: When overtaking and passing a bicycle proceeding in the same direction,
    what is the minimum safe distance you must leave between your vehicle and the
    bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: Oklahoma law (Title 47-11-1208-A) requires leaving a safe distance
    of not less than 3 feet until the motor vehicle is safely past the overtaken bicycle.
- id: 177
  category: safe_driving_rules
  question: If you are about to pass a bicycle on a narrow roadway and think the rider
    doesn't know you are coming, how should you signal them?
  choices:
    A: Blast your horn loudly until they move over.
    B: Rev your engine to get their attention.
    C: Honk your horn briefly as a signal.
    D: Flash your high beams repeatedly.
  answer: C
  explanation: You should honk your horn briefly as a signal that you're going to
    pass. You should not blast your horn or otherwise startle or try to intimidate
    the rider.
- id: 178
  category: sharing_the_road
  question: Under which of the following conditions is a bicyclist allowed to take
    the full lane of traffic?
  choices:
    A: When the lane is too narrow for both a car and a bicycle to safely share side
      by side.
    B: Whenever they are riding in a residential area.
    C: Only when riding at night.
    D: When they are riding below the posted speed limit.
  answer: A
  explanation: A bicyclist can ride in the full lane when the lane is too narrow for
    both a car and a bicycle to safely share the lane.
- id: 179
  category: signs_and_signals
  question: If you see a special flag on a bicycle, what might it indicate about the
    rider?
  choices:
    A: The rider is a beginner.
    B: The rider is carrying hazardous materials.
    C: The rider may have impaired hearing.
    D: The rider is a law enforcement officer.
  answer: C
  explanation: If you see this flag on a bicycle, slow down; the bicycle rider may
    have impaired hearing.
- id: 180
  category: safe_driving_rules
  question: Under Oklahoma's bicycle safety guidelines, what may a cyclist do when
    approaching a stop sign if no danger is present?
  choices:
    A: They must come to a complete stop for at least three seconds.
    B: They must dismount and walk the bicycle through the intersection.
    C: They can proceed through the intersection without stopping.
    D: They must wait for a motor vehicle to arrive before proceeding.
  answer: C
  explanation: At stop signs, if no danger is present, cyclists can proceed without
    stopping after slowing down.
- id: 181
  category: sharing_the_road
  question: How must a bicyclist handle a red traffic light?
  choices:
    A: They can ride through it without slowing down if no cars are visible.
    B: They must stop before entering the intersection, but can proceed if it is safe.
    C: They must wait until the light turns green in all circumstances.
    D: They are required to use the pedestrian crosswalk to bypass the red light.
  answer: B
  explanation: Cyclists must stop at a red light before entering the intersection,
    yield to any oncoming traffic, and if it's safe, they can proceed through the
    red light.
- id: 182
  category: defensive_driving
  question: According to research, what causes two-thirds of car/motorcycle collisions?
  choices:
    A: The motorcyclist speeding.
    B: The motorcyclist weaving between lanes.
    C: The driver of a car turning in front of the motorcycle.
    D: Poor weather conditions.
  answer: C
  explanation: Research shows that two-thirds of car/motorcycle collisions are caused
    not by the motorcyclist but by the driver who turned in front of the motorcycle.
- id: 183
  category: safe_driving_rules
  question: What is the recommended minimum following distance when driving behind
    a motorcycle?
  choices:
    A: One second
    B: Two seconds
    C: Three seconds
    D: Five seconds
  answer: C
  explanation: Allow at least a three-second following distance so the cyclist has
    enough time to maneuver or stop in an emergency.
- id: 184
  category: sharing_the_road
  question: Which of the following is true regarding sharing a lane with a motorcycle?
  choices:
    A: You may share a lane with a motorcycle if the lane is wide enough.
    B: You should not try to share a lane with a motorcycle and must respect its space.
    C: Motorcycles are required to ride on the shoulder to let cars pass.
    D: You can share a lane with a motorcycle only in residential areas.
  answer: B
  explanation: Motorcycles have the right to use the lane. You should not try to share
    a lane with a motorcycle and respect its space and position in traffic.
- id: 185
  category: sharing_the_road
  question: Why must you be careful not to pass a motorcycle too close or too fast?
  choices:
    A: The blast of air can blow a motorcycle out of control.
    B: The motorcycle's exhaust can damage your vehicle's paint.
    C: The motorcyclist might try to grab onto your vehicle.
    D: It is illegal to pass a motorcycle on a multi-lane highway.
  answer: A
  explanation: Pass as you would pass a car and don’t pass too close or too fast,
    as the blast of air can blow a motorcycle out of control.
- id: 186
  category: license_system
  question: What specific requirement must all operators of motorcycles meet regarding
    their driver license?
  choices:
    A: They must have a commercial driver license (CDL).
    B: They must have an M endorsement on their driver license.
    C: They must carry a special motorcycle insurance card.
    D: They must renew their license every year.
  answer: B
  explanation: All operators of motorcycles must have an M endorsement on their driver
    license.
- id: 187
  category: sharing_the_road
  question: Where do most collisions and injuries involving motorcycles occur?
  choices:
    A: On interstate highways
    B: At intersections
    C: In parking lots
    D: On rural two-lane roads
  answer: B
  explanation: According to the manual, most collisions and injuries involving motorcycles
    occur at intersections. Drivers should wait until the rider's intentions are absolutely
    clear before moving.
- id: 188
  category: sharing_the_road
  question: Why should you pay extra attention to motorcycles at night?
  choices:
    A: They are not required to use headlights at night.
    B: Their single headlight and taillight can blend into the lights of other vehicles.
    C: They travel much faster than cars at night.
    D: Their headlights are brighter and can blind other drivers.
  answer: B
  explanation: You can easily misjudge distance at night because the single headlight
    and single taillight of a motorcycle can blend into the lights of other vehicles.
- id: 189
  category: vehicle_information
  question: If a motorcycle is not equipped with a windshield of sufficient quality,
    size, and thickness, what must the operator wear?
  choices:
    A: A full-face helmet
    B: Sunglasses
    C: ANSI-approved goggles or face shield material
    D: A reflective vest
  answer: C
  explanation: State statutes require that in lieu of a windshield, the motorcycle
    operator shall wear ANSI-approved goggles or face shield material designed to
    protect against foreign objects.
- id: 190
  category: sharing_the_road
  question: How far behind a truck does its rear blind spot extend?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 200 feet
    D: Up to 500 feet
  answer: C
  explanation: A truck's blind spots are immediately in front on either side of the
    cab and up to 200 feet in the rear.
- id: 191
  category: safe_driving_rules
  question: What should you do if you are stopped behind a truck on an uphill grade?
  choices:
    A: Stay to the right in your lane and honk your horn.
    B: Stay to the left in your lane and leave extra space in front of your car.
    C: Pull up as close as possible to the truck's bumper.
    D: Turn on your hazard lights.
  answer: B
  explanation: If you're stopped behind a truck on an uphill grade, stay to the left
    in your lane so the driver can see you, and leave extra space in case the truck
    rolls back slightly when it starts to move.
- id: 192
  category: sharing_the_road
  question: When passing a truck, how might the truck driver signal that you are cleared
    to pull back in front of them?
  choices:
    A: By honking the horn twice
    B: By turning on their hazard lights
    C: By blinking the truck's headlights
    D: By waving their hand out the window
  answer: C
  explanation: If the driver blinks the truck's lights after you pass, it's a signal
    that you are cleared to pull back in front of the truck.
- id: 193
  category: defensive_driving
  question: When meeting a truck coming from the opposite direction, why should you
    keep as far as possible to the right side of the road?
  choices:
    A: To avoid being sideswiped and to reduce wind turbulence.
    B: Because the wind turbulence will suck your vehicle into the truck.
    C: To give the truck room to make a wide right turn.
    D: To allow the truck driver to see your license plate.
  answer: A
  explanation: Keep as far as possible to the right side of the road to avoid being
    sideswiped and to reduce the wind turbulence between you and the truck. The turbulence
    pushes vehicles apart; it does not suck them together.
- id: 194
  category: sharing_the_road
  question: Why is it dangerous to move into the open space on the right side of a
    truck making a right turn?
  choices:
    A: The truck will accelerate rapidly through the turn.
    B: Trucks make wide right turns and your car can be crunched or sideswiped.
    C: The truck driver will intentionally block the lane.
    D: It is illegal to pass any vehicle on the right.
  answer: B
  explanation: Trucks make wide right turns and often must leave an open space on
    the right side. If you are between the truck and the curb, the driver may not
    be able to see you and your car can be crunched or sideswiped.
- id: 195
  category: safe_driving_rules
  question: Approximately how long does it take for a train traveling at 55 mph to
    stop?
  choices:
    A: 500 feet
    B: A quarter of a mile
    C: Half a mile
    D: A mile or more
  answer: D
  explanation: A train traveling at 55 mph takes a mile or more to stop.
- id: 196
  category: defensive_driving
  question: According to the manual, where do most car/train collisions occur?
  choices:
    A: Within 25 miles of the driver's home
    B: On rural dirt roads
    C: During heavy rain or snowstorms
    D: At night in unlit areas
  answer: A
  explanation: Most collisions occur within 25 miles of the driver's home, often due
    to negligence when drivers cross the tracks without looking, listening, or stopping.
- id: 197
  category: safe_driving_rules
  question: When approaching a railroad crossing with an approaching train, what is
    the required stopping distance from the nearest rail?
  choices:
    A: Within 100 feet but not less than 50 feet
    B: Within 50 feet but not less than 15 feet
    C: Within 25 feet but not less than 10 feet
    D: Exactly 15 feet
  answer: B
  explanation: The law says a driver shall stop within 50 feet but not less than 15
    feet from the nearest rail of such railroad.
- id: 198
  category: safe_driving_rules
  question: Under what condition must a driver stop for a train approaching a highway
    crossing?
  choices:
    A: When the train is within 3000 feet and emits an audible signal
    B: Only when a crossing gate is fully lowered
    C: When a train approaching within approximately 1500 feet emits an audible signal
      and is an immediate hazard
    D: Only when a human flagman is present
  answer: C
  explanation: A driver must stop when a train approaching within approximately 1500
    feet of the highway crossing emits a signal audible from such distance and the
    train is an immediate hazard.
- id: 199
  category: signs_and_signals
  question: How should you treat a Railroad Crossbuck sign?
  choices:
    A: The same as a STOP sign
    B: The same as a YIELD sign
    C: The same as a DO NOT ENTER sign
    D: The same as a SPEED LIMIT sign
  answer: B
  explanation: Crossbucks are found at most public crossings. Treat them the same
    as a YIELD sign—slow down and prepare to stop if you see or hear a train approaching.
- id: 200
  category: sharing_the_road
  question: If a tractor-trailer has a long hood, how much of the road directly in
    front of the bumper might the trucker be unable to see?
  choices:
    A: The first 5-10 feet
    B: The first 10-20 feet
    C: The first 25-30 feet
    D: The first 40-50 feet
  answer: B
  explanation: If the tractor has a long hood, the trucker may not be able to see
    the first 10-20 feet of concrete in front of the bumper—plenty of room for a car
    to slip unnoticed into a dangerous position.
- id: 201
  category: sharing_the_road
  question: What should you keep in mind when passing a truck on a downhill grade?
  choices:
    A: Trucks travel slower downhill, so you should reduce your speed.
    B: Trucks travel faster downhill, so you may have to increase your speed to pass.
    C: You should pass the truck and immediately slow down to control their speed.
    D: It is illegal to pass a truck on a downhill grade.
  answer: B
  explanation: Because of their weight, trucks travel faster downhill and slower uphill.
    You may have to increase your speed to pass a truck on a downhill grade.
- id: 202
  category: safe_driving_rules
  question: What should you do if your vehicle stalls on the train tracks and the
    warning lights begin to flash?
  choices:
    A: Try to restart the engine immediately
    B: Stay in the vehicle and call 911
    C: Get out of the vehicle and run at a 45-degree angle away from the tracks in
      the direction the train is coming
    D: Get out and run in the same direction the train is traveling
  answer: C
  explanation: If your vehicle stalls on the tracks and the lights begin to flash,
    get out and run at a 45-degree angle away from the tracks in the direction that
    the train is coming, then immediately dial 911.
- id: 203
  category: sharing_the_road
  question: Which of the following vehicles are required to stop at highway-railway
    crossings?
  choices:
    A: Motorcycles and bicycles
    B: Trucks carrying hazardous materials and school buses
    C: Delivery vans and pickup trucks
    D: All vehicles traveling over 40 mph
  answer: B
  explanation: You must watch for vehicles that must stop at highway-railway crossings,
    which include trucks carrying hazardous materials, school buses, church buses,
    and passenger buses.
- id: 204
  category: safe_driving_rules
  question: 'If you are already crossing the railroad tracks and the warning lights
    begin flashing, you should:'
  choices:
    A: Stop immediately and back up
    B: Stop and wait for the train to pass
    C: Keep moving and finish driving through the crossing
    D: Shift into neutral and coast across
  answer: C
  explanation: If you are crossing the tracks and the warning lights begin flashing
    or the gates start coming down, don't stop. KEEP MOVING! The warning signals will
    allow enough time for you to finish driving through the crossing.
- id: 205
  category: signs_and_signals
  question: What is the Emergency Notification System (ENS) at a railroad crossing?
  choices:
    A: A red and yellow sign warning of a second train
    B: A siren that sounds when a train is 20 seconds away
    C: A blue and white emergency sign with a unique number identifying the exact
      location of the crossing
    D: An automatic gate that lowers to prevent vehicles from crossing
  answer: C
  explanation: The ENS is a blue and white emergency sign with a unique number assigned
    to each grade crossing and identifies the exact location of the crossing to the
    railroads.
- id: 206
  category: safe_driving_rules
  question: When must you dim your high beam headlights to low beams when approaching
    an oncoming vehicle?
  choices:
    A: Within 200 feet
    B: Within 500 feet
    C: Within 600 feet
    D: Within 1000 feet
  answer: D
  explanation: You must dim your high beam headlights to low beams within 1000 feet
    of an oncoming vehicle.
- id: 207
  category: safe_driving_rules
  question: 'When following another vehicle, you should dim your headlights to low
    beams within:'
  choices:
    A: 200 feet
    B: 400 feet
    C: 600 feet
    D: 1000 feet
  answer: C
  explanation: You must dim your high beam headlights to low beams within 600 feet
    of the vehicle you are following.
- id: 208
  category: safe_driving_rules
  question: According to Oklahoma law, when must headlights be used based on the time
    of day?
  choices:
    A: From sunset to sunrise
    B: Beginning 30 minutes after sunset and 30 minutes before sunrise
    C: Beginning 1 hour after sunset and 1 hour before sunrise
    D: Only when visibility is less than 500 feet
  answer: B
  explanation: Headlights must be used beginning 30 minutes after sunset and 30 minutes
    before sunrise.
- id: 209
  category: vehicle_information
  question: 'When driving a vehicle with a standard transmission, you should hold
    the clutch pedal all the way down when:'
  choices:
    A: Coasting down a steep hill
    B: Your speed drops below 10 mph as you are coming to a stop
    C: Driving through a school zone
    D: You want to rest your foot while driving
  answer: B
  explanation: Hold the clutch pedal all the way down when starting the motor, shifting
    gears and when your speed drops below 10 mph as you're coming to a stop.
- id: 210
  category: vehicle_information
  question: What does it mean to "ride the clutch"?
  choices:
    A: Shifting gears without using the clutch pedal
    B: Coasting down a hill in neutral
    C: Driving with your foot resting on the clutch pedal
    D: Using the clutch to brake suddenly
  answer: C
  explanation: Don't "ride the clutch," meaning don't drive with your foot resting
    on the clutch pedal.
- id: 211
  category: safe_driving_rules
  question: For a solid, strong grip on the steering wheel, where should your hands
    generally be placed?
  choices:
    A: Left hand at 12:00 and right hand at 6:00
    B: Left hand between 9:00 and 10:30, and right hand between 2:00 and 4:00
    C: Left hand at 8:00 and right hand at 4:00
    D: Both hands resting at the bottom of the wheel
  answer: B
  explanation: Generally, your left hand should be between 9:00 and 10:30 and your
    right hand between 2:00 and 4:00.
- id: 212
  category: alcohol_drugs_health
  question: Which of the following is a symptom of carbon monoxide poisoning?
  choices:
    A: Your skin turns red and flushed
    B: You feel hyperactive and energetic
    C: Lights seem brighter and your forehead tightens
    D: You experience sudden hunger
  answer: C
  explanation: Symptoms of carbon monoxide poisoning include feeling drowsy and/or
    dizzy, lights seeming brighter, blue skin/lips, and your forehead tightening.
- id: 213
  category: defensive_driving
  question: 'To help avoid carbon monoxide poisoning when driving in congested traffic,
    you should:'
  choices:
    A: Open the fresh-air vent
    B: Close the fresh-air vent
    C: Turn on the heater to maximum
    D: Roll down all the windows halfway
  answer: B
  explanation: To avoid carbon monoxide poisoning in congested traffic, close the
    fresh-air vent.
- id: 214
  category: driver_responsibility
  question: Before starting on a vacation or business trip, Oklahoma law requires
    you to have a physical copy of what in your vehicle?
  choices:
    A: Your birth certificate and passport
    B: A state highway map
    C: Your vehicle insurance and registration
    D: Your vehicle's maintenance log
  answer: C
  explanation: Before starting on a vacation or business trip, be sure you have a
    physical copy of your vehicle insurance and registration in your vehicle in accordance
    with Oklahoma law.
- id: 215
  category: sharing_the_road
  question: Why is it dangerous to pass cars or bicyclists at a highway-rail crossing?
  choices:
    A: The train engineer cannot see you passing
    B: Bicycle tires can get caught on the tracks and the rider can be thrown across
      your path
    C: It is illegal to drive faster than 15 mph at any crossing
    D: The crossing gates will automatically lower if you change lanes
  answer: B
  explanation: Never pass at a highway-rail crossing. Don't pass cars or bicyclists.
    The bicycle tires can get caught on the tracks and the rider can be thrown across
    your path.
- id: 216
  category: vehicle_information
  question: What must you have a physical copy of in your vehicle before starting
    a trip in accordance with Oklahoma law?
  choices:
    A: Your birth certificate
    B: Vehicle insurance and registration
    C: A passport
    D: Your vehicle's title
  answer: B
  explanation: The manual states that before starting on a trip, you must be sure
    you have a physical copy of your vehicle insurance and registration in your vehicle
    in accordance with Oklahoma law.
- id: 217
  category: safe_driving_rules
  question: Which of the following is an example of a "cognitive" driver distraction?
  choices:
    A: Taking your hands off the steering wheel
    B: Taking your eyes off the road
    C: Thinking about anything other than driving
    D: Reaching for a dropped item
  answer: C
  explanation: The manual defines cognitive distraction as "Thinking about anything
    other than driving."
- id: 218
  category: penalties_and_points
  question: What penalty can Learner's Permit or Intermediate License holders face
    for using a hand-held electronic device for non-life-threatening purposes?
  choices:
    A: A warning ticket
    B: Suspension or cancellation of their license
    C: A mandatory defensive driving course
    D: A $500 fine and vehicle impoundment
  answer: B
  explanation: Learner's Permit or Intermediate License holders can be suspended or
    have their license canceled for using a hand-held electronic device while operating
    a motor vehicle for non-life-threatening emergency purposes.
- id: 219
  category: defensive_driving
  question: What should you do if an animal suddenly runs in front of your vehicle?
  choices:
    A: Swerve sharply to the left
    B: Swerve sharply to the right
    C: DO NOT swerve to avoid hitting the animal
    D: Honk your horn and accelerate
  answer: C
  explanation: 'The manual explicitly states: "DO NOT swerve to avoid hitting the
    animal. This may result in a more serious crash than if your vehicle collided
    with the animal."'
- id: 220
  category: defensive_driving
  question: During which months do deer-vehicle crashes most often occur?
  choices:
    A: January to March
    B: April to June
    C: July to September
    D: October to December
  answer: D
  explanation: According to the manual, deer/vehicle crashes most often occur from
    October to December.
- id: 221
  category: safe_driving_rules
  question: At what depth of water will most vehicles, including SUVs, become buoyant
    and float?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches (2 feet)
  answer: D
  explanation: Most vehicles will float in just 2 feet (24 inches) of water, even
    SUVs.
- id: 222
  category: safe_driving_rules
  question: How much water on a flooded roadway is enough to cause you to lose control
    of your vehicle or knock you off your feet?
  choices:
    A: 2 inches
    B: 6 inches
    C: 12 inches
    D: 24 inches
  answer: B
  explanation: The manual warns that 6 inches of water may be enough to cause you
    to lose control of your vehicle, and you can be knocked off your feet by 6 inches
    of fast-moving water.
- id: 223
  category: driver_responsibility
  question: If you are involved in a minor crash and your vehicle is blocking the
    flow of traffic, what must you do?
  choices:
    A: Leave the vehicle exactly where it is until police arrive
    B: Move the vehicle or have it moved
    C: Wait for a tow truck before attempting to move it
    D: Abandon the vehicle and walk to safety
  answer: B
  explanation: If the crash is minor and your vehicle is blocking the flow of traffic,
    you must move it or have it moved.
- id: 224
  category: driver_responsibility
  question: What should you do if you collide with a parked car and cannot locate
    the owner?
  choices:
    A: Leave the scene immediately
    B: Wait by the car until the owner returns
    C: Leave your name, address, and insurance information where the owner will find
      it
    D: Call a tow truck to remove the damaged parked car
  answer: C
  explanation: If the collision involves a parked car or property and you can't locate
    the owner, leave the driver's and vehicle owner's name and address, and provide
    the information from the insurance verification form on the damaged property where
    the owner will find it.
- id: 225
  category: driver_responsibility
  question: After a crash, when is it acceptable to move an injured person?
  choices:
    A: Whenever they ask to be moved
    B: Only if it is a life-or-death necessity
    C: If they are blocking the roadway
    D: You should always move them to the side of the road
  answer: B
  explanation: If anyone is hurt, you must get help immediately but DO NOT try to
    move an injured person unless it is a life-or-death necessity.
- id: 226
  category: alcohol_drugs_health
  question: How does mixing alcohol with other drugs affect your body?
  choices:
    A: It cancels out the effects of the drugs
    B: It slows down the absorption of alcohol
    C: It multiplies the harmful effects on concentration and coordination
    D: It has no additional effect compared to drinking alcohol alone
  answer: C
  explanation: Mixing drugs can be especially dangerous because they react with each
    other and multiply the harmful effects on your concentration and coordination,
    especially when one of those drugs is alcohol.
- id: 227
  category: alcohol_drugs_health
  question: Which of the following drinks contains the most alcohol?
  choices:
    A: A 12-ounce can of beer
    B: A 5-ounce glass of wine
    C: A cocktail with 1.5 ounces of 80-proof distilled spirits
    D: They all contain the same amount of alcohol
  answer: D
  explanation: A 12-ounce can of beer, a 5-ounce glass of wine and a cocktail with
    1.5 ounces of 80-proof distilled spirits all contain the same amount of alcohol.
- id: 228
  category: alcohol_drugs_health
  question: What driving skill is affected almost immediately when you consume alcohol?
  choices:
    A: Your hearing
    B: Your judgment
    C: Your sense of direction
    D: Your night vision
  answer: B
  explanation: Alcohol moves quickly to your stomach, into your blood and to all parts
    of your body. Driving skills, especially your judgment, are affected almost immediately.
- id: 229
  category: penalties_and_points
  question: Under the Oklahoma Implied Consent Law, how long will your license be
    revoked if penalized?
  choices:
    A: 30 to 90 days
    B: 90 to 180 days
    C: 180 days to 2 years
    D: 2 to 5 years
  answer: C
  explanation: If your license is revoked under the Oklahoma Implied Consent Law,
    the revocation period will be from 180 days to 2 years, depending on your previous
    driving record.
- id: 230
  category: safe_driving_rules
  question: Which of the following drivers are prohibited from making hand-held phone
    calls while driving in Oklahoma?
  choices:
    A: All drivers over the age of 21
    B: Commercial drivers and public transit drivers
    C: Only drivers with out-of-state licenses
    D: Drivers operating a vehicle on a dirt road
  answer: B
  explanation: Commercial drivers or public transit drivers are also prohibited from
    making hand-held phone calls while driving.
- id: 231
  category: alcohol_drugs_health
  question: What does the Oklahoma Implied Consent Law mean for drivers?
  choices:
    A: You must consent to a vehicle search if pulled over.
    B: You agree to take one or more tests to determine your blood alcohol content
      (BAC).
    C: You automatically plead guilty to a DUI if arrested.
    D: You consent to paying traffic fines on the spot.
  answer: B
  explanation: The very act of driving or being in actual physical control of a motor
    vehicle means that you have agreed to take one or more tests to determine your
    blood alcohol content (BAC) under the Implied Consent Law.
- id: 232
  category: penalties_and_points
  question: What happens if you refuse to take a BAC test upon request by a law enforcement
    officer?
  choices:
    A: You will be given a warning.
    B: Your driving privilege will be automatically revoked.
    C: You will be fined $50 but keep your license.
    D: You must take a defensive driving course.
  answer: B
  explanation: Refusal to take the test upon request by a law enforcement officer
    will result in an automatic revocation of your driving privilege, even if you
    have not been drinking.
- id: 233
  category: penalties_and_points
  question: What is a potential penalty for a conviction of driving with a BAC over
    0.05 but less than 0.08?
  choices:
    A: A fine of $1,000 to $2,500
    B: Up to 6 months in jail
    C: A mandatory 5-year prison sentence
    D: Permanent loss of your driver license
  answer: B
  explanation: On conviction for a BAC over 0.05 but less than 0.08, penalties include
    a fine of $100–$500, up to 6 months in jail, or both.
- id: 234
  category: penalties_and_points
  question: What are the penalties for a first offense DUI conviction (BAC 0.08 or
    more)?
  choices:
    A: A felony, 1 to 5 years in prison, and a fine up to $2,500
    B: A misdemeanor, 10 days to 1 year in jail, and a fine up to $1,000
    C: A misdemeanor, up to 6 months in jail, and a fine of $100-$500
    D: A felony, 1 to 7 years in prison, and a fine up to $5,000
  answer: B
  explanation: A first offense DUI is a misdemeanor punishable by imprisonment in
    jail for not less than ten days nor more than 1 year and a fine of not more than
    $1,000.
- id: 235
  category: penalties_and_points
  question: 'If you are convicted of a second DUI offense within 10 years, it is classified
    as a:'
  choices:
    A: Misdemeanor
    B: Traffic infraction
    C: Felony
    D: Civil violation
  answer: C
  explanation: A second DUI offense within 10 years is classified as a felony, carrying
    imprisonment for 1 to 5 years and a fine up to $2,500.
- id: 236
  category: penalties_and_points
  question: For a first DUI revocation, how long will Service Oklahoma suspend your
    driving privilege?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: When Service Oklahoma receives notice of a DUI conviction, the license
    will be suspended for 180 days on the first revocation.
- id: 237
  category: alcohol_drugs_health
  question: According to the manual, drivers on amphetamines are how many times more
    likely to be involved in a car crash?
  choices:
    A: Two times
    B: Three times
    C: Four times
    D: Ten times
  answer: C
  explanation: Illegal drugs affect your ability to drive safely. For example, drivers
    on amphetamines are four times more likely to be involved in a car crash.
- id: 238
  category: alcohol_drugs_health
  question: Which of the following is true regarding driving and marijuana use in
    Oklahoma?
  choices:
    A: It is legal to drive as long as you have a medical marijuana card.
    B: It is illegal to drive with any detectable level of cannabis in your system.
    C: You can drive if your cannabis level is below 0.08%.
    D: Marijuana improves your ability to adjust to glare.
  answer: B
  explanation: Although the state has legalized cannabis for some medical purposes,
    it impairs driving performance, and it is illegal for anyone to drive with any
    detectable level of cannabis in their system.
- id: 239
  category: alcohol_drugs_health
  question: 'Under Oklahoma''s ''Zero Tolerance'' law, it is unlawful for anyone under
    21 to drive with:'
  choices:
    A: A BAC of 0.08 or higher only.
    B: ANY measurable quantity of alcohol in their blood or breath.
    C: A BAC of 0.05 or higher only.
    D: More than one drink per hour in their system.
  answer: B
  explanation: It is unlawful for any person under 21 years of age to drive with ANY
    measurable quantity of alcohol in the person's blood or breath at the time a test
    is administered.
- id: 240
  category: penalties_and_points
  question: What is the revocation period for a person under 21 for their first conviction
    of driving with a measurable amount of BAC?
  choices:
    A: 30 days
    B: 90 days
    C: Six months
    D: One year
  answer: C
  explanation: Under the Zero Tolerance Law, the first conviction or offense for a
    measurable amount of BAC results in a revocation period of SIX MONTHS.
- id: 241
  category: penalties_and_points
  question: 'If a person under 18 commits an offense relating to the possession or
    consumption of alcohol, the court may recommend canceling their license for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months, 1 year, or 2 years/until age 21
  answer: D
  explanation: At the discretion of the court, penalties for persons under 18 include
    a period of 6 months, 1 year, or 2 years or until the person attains the age of
    21 years, whichever is longer.
- id: 242
  category: driver_responsibility
  question: Can you be convicted of a DUI without a BAC test?
  choices:
    A: No, a BAC test is legally required for any DUI conviction.
    B: Yes, observations and information gathered by the arresting officer can result
      in a conviction.
    C: No, only a blood test can be used as evidence in court.
    D: Yes, but only if you confess to the crime.
  answer: B
  explanation: Observations and information gathered by the arresting officer are
    also evidence that may be used in court and can result in a conviction without
    a BAC test.
- id: 243
  category: penalties_and_points
  question: If you are convicted of driving with a BAC over 0.05 but less than 0.08,
    how long is the suspension for a first offense?
  choices:
    A: 30 days
    B: 6 months
    C: 180 days
    D: 1 year
  answer: A
  explanation: When Service Oklahoma receives notice of a conviction for a BAC over
    0.05 but less than 0.08, the first suspension of the person's driving privilege
    is 30 days.
- id: 244
  category: penalties_and_points
  question: What is the maximum prison sentence for a third or subsequent DUI offense?
  choices:
    A: 1 year
    B: 5 years
    C: 7 years
    D: 10 years
  answer: D
  explanation: For a third or subsequent DUI offense, the penalty includes imprisonment
    for not less than 1 year, not to exceed 10 years, and a fine of not more than
    $5,000.
- id: 245
  category: alcohol_drugs_health
  question: What should you do before taking a prescription or over-the-counter drug
    and driving?
  choices:
    A: Take a double dose to stay alert.
    B: Check the label for warnings about side effects like drowsiness.
    C: Drink a caffeinated beverage to counteract any effects.
    D: Only drive during daylight hours.
  answer: B
  explanation: Before you take a drug, check the label for warnings about side effects
    such as drowsiness or nervousness. If unsure, ask a pharmacist or doctor.
- id: 246
  category: penalties_and_points
  question: What is the maximum penalty for carrying, buying, or using a fake ID according
    to the manual?
  choices:
    A: 1 year in prison and a $1,000 fine
    B: 5 years in prison and a $5,000 fine
    C: 7 years in prison and a $10,000 fine
    D: 10 years in prison and a $25,000 fine
  answer: C
  explanation: Every time you use, carry, borrow or buy a fake ID, it is a felony
    and you could spend 7 years in prison and face a $10,000 fine.
- id: 247
  category: license_system
  question: How much does it cost to get a copy of your 3-year driving record if you
    are under 65 years old?
  choices:
    A: $10.00
    B: $15.00
    C: $20.00
    D: $25.00
  answer: D
  explanation: There is a $25.00 fee for a copy of your driving record. Service Oklahoma
    will provide the driving record to people over 65 at no charge.
- id: 248
  category: license_system
  question: At what age can an Oklahoma resident obtain a copy of their driving record
    at no charge?
  choices:
    A: Over 55
    B: Over 60
    C: Over 65
    D: Over 70
  answer: C
  explanation: Service Oklahoma will provide the driving record to people over 65
    at no charge.
- id: 249
  category: penalties_and_points
  question: Under the Oklahoma Mandatory Point System, how many points will result
    in a license suspension if accumulated within 5 years?
  choices:
    A: 6 or more points
    B: 8 or more points
    C: 10 or more points
    D: 12 or more points
  answer: C
  explanation: If you accumulate 10 or more points within 5 years, your license will
    be suspended.
- id: 250
  category: penalties_and_points
  question: How many points are assessed on your driving record for a reckless driving
    conviction?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: According to the Mandatory Point System, reckless driving results in
    4 points assessed on your driving record.
- id: 251
  category: penalties_and_points
  question: Which of the following violations will result in 4 points being added
    to your driving record?
  choices:
    A: Speeding in excess of 25 mph above the posted limit
    B: Failure to stop or remain stopped for a school bus loading or unloading
    C: Failure to yield right of way
    D: Careless driving
  answer: B
  explanation: Failure to stop or remain stopped for a school bus loading or unloading
    results in 4 points. Speeding more than 25 mph over the limit is 3 points, while
    failure to yield and careless driving are 2 points.
- id: 252
  category: license_system
  question: 'A driver license issued to a person under the age of 18 is considered:'
  choices:
    A: Unrestricted
    B: Probationary
    C: Temporary
    D: Conditional
  answer: B
  explanation: 'A license issued to drivers under 18 is considered probationary: You
    are on a trial period to show you can drive safely and legally.'
- id: 253
  category: penalties_and_points
  question: 'For a driver under 18 with a probationary license, Service Oklahoma can
    cancel or suspend the license for:'
  choices:
    A: Only felony convictions
    B: Any moving traffic violation
    C: Accumulating 5 points on their record
    D: Only alcohol-related offenses
  answer: B
  explanation: Service Oklahoma can, at its discretion, cancel or suspend your probationary
    license for any moving traffic violation.
- id: 254
  category: penalties_and_points
  question: State law requires your driving privilege to be revoked for 6 months to
    3 years for which of the following convictions?
  choices:
    A: Operating a defective vehicle
    B: Following too close
    C: Any felony in which a motor vehicle is used
    D: Speeding 10 mph over the limit
  answer: C
  explanation: Mandatory revocation of your license for 6 months to 3 years is required
    for a conviction of any felony in which a motor vehicle is used.
- id: 255
  category: alcohol_drugs_health
  question: 'If you are under age 21, your driving privilege will be mandatorily revoked
    for driving or being in actual physical control of a motor vehicle with:'
  choices:
    A: A blood alcohol content of 0.08% or higher
    B: Any measurable quantity of alcohol
    C: A blood alcohol content of 0.05% or higher
    D: A blood alcohol content of 0.02% or higher
  answer: B
  explanation: State law requires mandatory revocation for 6 months to 3 years if
    under age 21, driving or being in actual physical control of a motor vehicle with
    any measurable quantity of alcohol.
- id: 256
  category: driver_responsibility
  question: Who recommends standards for the physical, emotional, and mental capacity
    of license applicants and licensed drivers in Oklahoma?
  choices:
    A: The Department of Public Safety Identity Verification Unit
    B: The Medical Advisory Committee
    C: The Oklahoma Legislature
    D: The Highway Patrol
  answer: B
  explanation: Oklahoma law authorizes a Medical Advisory Committee, composed of medical
    doctors, to recommend standards for the physical, emotional and mental capacity
    of license applicants and licensed drivers.
- id: 257
  category: penalties_and_points
  question: How many points are assessed for operating a defective vehicle?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: A
  explanation: According to the Mandatory Point System, operating a defective vehicle
    results in 1 point.
- id: 258
  category: license_system
  question: What information is required on the records request form to obtain a copy
    of your driving record?
  choices:
    A: Full name, Social Security number, and address
    B: Full name, date of birth, and driver license number
    C: Full name, address, and vehicle registration number
    D: Full name, date of birth, and eye color
  answer: B
  explanation: The records request form must be complete with your full name, date
    of birth and driver license number.
- id: 259
  category: penalties_and_points
  question: Which of the following actions can lead to the cancellation of your identification
    card or driver license?
  choices:
    A: Loaning your license to another person
    B: Displaying a license with an altered date of birth
    C: Using a false name on an application
    D: All of the above
  answer: D
  explanation: Your ID card or driver license may be canceled if you loan it to another
    person, display one with altered information, or use a false or fictitious name
    on an application, among other violations.
- id: 260
  category: penalties_and_points
  question: How many points are assessed for speeding in excess of 25 mph above the
    posted limit?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: The Mandatory Point System assesses 3 points for speed in excess of
    25 mph above the posted limit.
- id: 261
  category: penalties_and_points
  question: How many points are added to your driving record for driving left of center
    or the wrong way on a one-way street?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: According to the point system, driving left of center or the wrong
    way on a one-way street results in 2 points on your driving record.
- id: 262
  category: penalties_and_points
  question: What is the point penalty for operating a defective vehicle?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: A
  explanation: Operating a defective vehicle results in 1 point being added to your
    driving record.
- id: 263
  category: penalties_and_points
  question: How many points are deducted from your driving record for each 12-month
    period in which there are no convictions of any pointable traffic violations?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Two (2) points are deducted for each 12-month period in which there
    are no convictions of any pointable traffic violations.
- id: 264
  category: penalties_and_points
  question: How long must you go without any traffic violation convictions for your
    points to be reduced to zero?
  choices:
    A: One year
    B: Two consecutive years
    C: Three consecutive years
    D: Five consecutive years
  answer: C
  explanation: Points are reduced to zero if there are no traffic violation convictions
    for three consecutive years.
- id: 265
  category: penalties_and_points
  question: How many points can be deducted for successfully completing a Service
    Oklahoma-approved Defensive Driving Course?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Two (2) points are deducted for successful completion of a Service
    Oklahoma-approved Driver Compliance or Defensive Driving Course.
- id: 266
  category: penalties_and_points
  question: How often can you receive point reduction credit for completing a Service
    Oklahoma-approved Driver Compliance or Defensive Driving Course?
  choices:
    A: Once every 12 months
    B: Once every 24 months
    C: Once every 36 months
    D: Once every 5 years
  answer: B
  explanation: Credit for completing the defensive driving course can be given once
    every 24 months.
- id: 267
  category: driver_responsibility
  question: What is the minimum liability insurance requirement for injury or death
    of one person in Oklahoma?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: The minimum limit of liability for injury or death of one person is
    $25,000.
- id: 268
  category: driver_responsibility
  question: If you are involved in a collision, to whom must you show your proof of
    insurance?
  choices:
    A: Only to law enforcement officers
    B: Only to your insurance agent
    C: To the other driver and other people involved
    D: Only to a representative of Service Oklahoma
  answer: C
  explanation: If you are in a collision, you must show your proof of insurance to
    the other driver and to the other people involved.
- id: 269
  category: license_system
  question: What could happen if you fail to keep an updated address on file with
    Service Oklahoma?
  choices:
    A: You will be fined $250 immediately.
    B: Your vehicle registration will be permanently revoked.
    C: You could face a license suspension without your knowledge.
    D: You will be required to retake the driving test.
  answer: C
  explanation: Failure to keep an updated address with Service Oklahoma could result
    in a suspension without your knowledge.
- id: 270
  category: penalties_and_points
  question: What is the maximum fine and jail time for a conviction of failure to
    comply with the Compulsory Insurance Law?
  choices:
    A: Up to $100 and 10 days in jail
    B: Up to $250 and 30 days in jail
    C: Up to $500 and 60 days in jail
    D: Up to $1,000 and 6 months in jail
  answer: B
  explanation: The penalty for not having insurance includes a fine of up to $250,
    30 days in jail, or both.
- id: 271
  category: penalties_and_points
  question: In addition to fines and possible jail time, what happens upon conviction
    of failure to produce proof of insurance to a law enforcement officer?
  choices:
    A: Suspension of your license and registration
    B: A mandatory defensive driving course
    C: Confiscation of your vehicle
    D: A permanent revocation of your driving privileges
  answer: A
  explanation: A conviction of failure to produce proof of insurance to a law enforcement
    officer results in suspension of your license and registration, in addition to
    fines and/or jail time.
- id: 272
  category: penalties_and_points
  question: When points are deducted from your driving record for safe driving or
    completing a defensive driving course, what is the lowest your point total can
    go?
  choices:
    A: -2 points
    B: 0 points
    C: 1 point
    D: 2 points
  answer: B
  explanation: The manual states that the point total cannot go below zero.
- id: 273
  category: penalties_and_points
  question: How many points are assessed for "all other violations" that do not require
    suspension or revocation action?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: A
  explanation: All other violations (excluding the violations requiring suspension
    or revocation action) result in 1 point.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 274
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 275
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 276
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 277
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 278
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 279
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 280
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 281
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A black and white NO PASSING ZONE pennant-shaped sign means you are
    not allowed to pass other vehicles in this area. It marks the beginning of a no-passing
    zone.
  id: 282
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 283
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
