  choices:
    A: White markings on the curb
    B: A curb that is painted green
    C: Yellow markings on the curb
    D: An unpainted curb in a residential area
  answer: C
  explanation: The manual states, 'Parking is not allowed where there are yellow markings
    on the curb...'
- id: 260
