  choices:
    A: To collect tolls for using the freeway.
    B: To allow police to check for vehicle registration.
    C: To help evenly space vehicles merging onto the freeway.
    D: To give priority access to carpools and buses.
  answer: C
  explanation: Section 6 states that metered ramps help "evenly space the number of
