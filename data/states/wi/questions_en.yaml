  question: If a law enforcement officer gives you a ticket and you disagree with
    it, what does the manual advise you to do at the scene?
  choices:
    A: Calmly explain to the officer why they are mistaken.
    B: Refuse to sign or accept the ticket.
    C: Do not argue and wait for your opportunity in court.
    D: Immediately call a lawyer from the scene.
  answer: C
  explanation: The manual advises, 'Do not argue if given a ticket. You will have
    an opportunity in front of a judge or court to express concerns.'
- id: 308
  category: sharing_the_road
  question: When driving at night, what is the first thing you should do if you see
