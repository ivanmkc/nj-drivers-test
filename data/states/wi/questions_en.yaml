  choices:
    A: Bright orange
    B: Fluorescent green
    C: Light blue
    D: Reflective white
  answer: B
  explanation: The manual notes for the School Crossing/School Zone sign that it 'May
    be fluorescent green or yellow.'
- id: 257
  category: signs_and_signals
  question: What does a 'Keep Right' regulatory sign indicate?
  choices:
    A: Slower traffic must stay in the right lane
