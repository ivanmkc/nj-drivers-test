  question: What is a potential consequence if you disobey a traffic signal at a metered
    freeway entrance ramp?
  choices:
    A: You can be ticketed.
    B: Your license will be immediately suspended.
    C: You will receive a warning by mail.
    D: Your vehicle will be impounded.
