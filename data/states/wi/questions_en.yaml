    C: Turn right or go straight
    D: Make a U-turn
  answer: B
  explanation: Based on the example for a 'Left Lane | Middle Lane | Right Lane Sign'
    in Section 4, the sign for each lane dictates the allowed movements. In this scenario,
    the middle lane is for going straight only.
- id: 270
