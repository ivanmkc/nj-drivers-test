- id: 297
  category: safe_driving_rules
  question: What is the correct procedure as you approach your intended exit in a
    roundabout?
  choices:
    A: Turn on your right turn signal and exit.
    B: Slow down and wait for the vehicle behind you to pass.
    C: Honk your horn briefly to alert other drivers.
