    flashing?
  choices:
    A: The ramp is closed and you must find another entrance.
    B: The traffic signals on the ramp are active and must be obeyed.
    C: There is a crash ahead on the freeway.
    D: Only one car may proceed at a time without stopping.
  answer: B
  explanation: According to Section 6, "The ramp is metered when the sign 'Ramp Metered
    When Flashing' is on," meaning the traffic signals are in operation.
- id: 301
