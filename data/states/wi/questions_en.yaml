- id: 235
  category: safe_driving_rules
  question: When waiting to make a left turn at an intersection with oncoming traffic,
    where should you position your vehicle?
  choices:
    A: Behind the white stop line until the path is completely clear.
    B: In the crosswalk, blocking pedestrians.
    C: About halfway into the intersection.
    D: In the right lane to allow others to pass.
  answer: C
  explanation: The manual instructs to 'Slowly approach the intersection and wait
    about halfway in the intersection. Make sure to leave room for oncoming traffic
    to turn in front of you.'
- id: 236
  category: safe_driving_rules
  question: If you are turning left from a street with multiple left-turn lanes and
    you start in the middle lane, which lane must you enter on the new street?
  choices:
    A: The right-most lane.
    B: The left-most lane.
    C: The middle lane.
    D: Any available lane.
  answer: C
  explanation: The manual states, 'If you are in the middle lane you need to end up
    in the middle lane of the street you are turning onto.'
- id: 237
  category: driver_testing
  question: During the third step of a Y-Turn, what action should you take after stopping
    at the opposite curb?
  choices:
    A: Signal right and pull forward into the lane of traffic.
    B: Turn your steering wheel all the way to the right and stop.
    C: Look over your right shoulder and reverse the car enough to move forward.
    D: Honk your horn to alert traffic before backing up.
  answer: C
  explanation: The third step of a Y-Turn is to 'Look behind you, over your right
    shoulder. Reverse your car enough so that you can move forward again. Stop.'
- id: 238
  category: sharing_the_road
  question: What is the correct and safe response if another vehicle is trying to
    pass you?
  choices:
    A: Speed up to prevent them from passing.
    B: Move to the left to block them.
    C: Stay in your lane and slow down.
    D: Flash your headlights to signal it is unsafe.
  answer: C
  explanation: The manual states, 'If someone is trying to pass you, stay in your
    lane and slow down.'
- id: 239
  category: safe_driving_rules
  question: What is the proper way to check your blind spot before changing lanes
    to the left?
  choices:
    A: Look only in your rearview mirror.
    B: Look only in your left side mirror.
    C: Check over your left shoulder.
    D: Lean forward to get a better view in your mirrors.
  answer: C
  explanation: The manual instructs, 'If moving to the left lane, check over your
    left shoulder.' It also clarifies, 'You cannot see these areas by only looking
    in your mirrors.'
- id: 240
  category: safe_driving_rules
  question: What does the manual state about passing multiple vehicles at once?
  choices:
    A: It is allowed if you have a clear view of the road ahead.
    B: You should pass only one vehicle at a time.
    C: It is safer than passing vehicles individually.
    D: You may pass two vehicles at a time, but no more.
  answer: B
  explanation: The manual warns, 'There might not be enough time to pass several vehicles
    at once...' and instructs to 'Pass only one vehicle at a time on the left side.'
- id: 241
  category: vehicle_information
  question: When backing up, in addition to using your mirrors and backup camera,
    what should you do to ensure safety?
  choices:
    A: Turn on your interior dome light.
    B: Turn your body and look over your right shoulder through the rear window.
    C: Open your driver's side door to look behind you.
    D: Rely on the sound of your backup alarm.
  answer: B
  explanation: The manual states, 'Do not only depend on your mirrors and backup camera
    when backing up. Turn your body and look behind you and out of your windows. Look
    over your right shoulder through the rear window.'
- id: 242
  category: driver_responsibility
  question: When parking your vehicle with an automatic transmission on a level surface,
    what should you do after shifting to (P) Park?
  choices:
    A: Turn your wheels towards the curb.
    B: Leave the engine running.
    C: Set the parking brake.
    D: Turn on your hazard lights.
  answer: C
  explanation: The manual instructs, 'When parking on a level surface, put your vehicle
    in (P) Park (or in gear if you have a manual transmission) and set the parking
    brake.'
- id: 243
  category: defensive_driving
  question: How can you help a driver who is following you?
  choices:
    A: By braking suddenly to get them to back off.
    B: By speeding up to create more space.
    C: By keeping a steady speed and signaling in advance.
    D: By weaving slightly within your lane.
  answer: C
  explanation: The manual suggests, 'You can help a driver behind you by keeping a
    steady speed and signaling in advance when you need to slow down or turn.'
- id: 244
  category: safe_driving_rules
  question: When you need to cross traffic on a multi-lane road, what is the most
    important consideration?
  choices:
    A: Ensuring you have enough room to get all the way across.
    B: Honking your horn before you start to cross.
    C: Crossing as quickly as possible, even if it means cutting someone off.
    D: Waiting for a police officer to direct you.
  answer: A
  explanation: The manual states, 'When you cross traffic and multi-lane roads make
    sure there is enough room to get all the way across.'
- id: 245
  category: defensive_driving
  question: According to the manual, what type of unsafe action when turning can lead
    to a crash?
  choices:
    A: Signaling too early.
    B: Making a last-second change in your path.
    C: Turning too slowly.
    D: Checking your mirrors more than once.
  answer: B
  explanation: The manual warns, 'Last second changes are unsafe and could cause a
    crash.'
- id: 246
  category: sharing_the_road
  question: On a multi-lane road, what is the intended use of the lane farthest to
    the left?
  choices:
    A: For drivers traveling at or below the speed limit.
    B: For vehicles to go around slower ones.
    C: For emergency vehicles only.
    D: For vehicles preparing to exit on the right.
  answer: B
  explanation: The manual states, 'The lane farthest on the left of a multi-lane road
    is used for vehicles to go around slower ones.'
- id: 247
  category: safe_driving_rules
  question: When parking uphill on a street without a curb, which way should you turn
    your front wheels?
  choices:
    A: Straight ahead
    B: All the way to the left
    C: All the way to the right
    D: Slightly to the left
  answer: C
  explanation: The manual states, 'If you are parked uphill without a curb, you will
    turn your wheels all the way to the right before you put your car in park.'
- id: 248
  category: safe_driving_rules
  question: During the process of parallel parking, when should you first straighten
    your wheels after beginning to back up?
  choices:
    A: When your back bumper is clear of the vehicle in front
    B: When your front door passes the back bumper of the vehicle you are parking
      behind
    C: As soon as you are parallel with the curb
    D: After you have stopped completely
  answer: B
  explanation: Step 3 of parallel parking states, 'Once your front door passes the
    back bumper of the vehicle you are parking behind, straighten your wheel.'
- id: 249
  category: safe_driving_rules
  question: After successfully parallel parking, what is the minimum recommended distance
    you should leave between your car and the vehicles in front of and behind you?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 6 feet
  answer: B
  explanation: The manual specifies, 'You should be about a foot away from the curb
    and at least 2 feet away from the vehicle in front of you and behind you.'
- id: 250
  category: defensive_driving
  question: The driver's manual advises that strong emotions can negatively affect
    your driving. Which of the following is listed as an emotion that should prevent
    you from driving?
  choices:
    A: Excitement
    B: Calmness
    C: Contentment
    D: Indifference
  answer: A
  explanation: The manual states, 'Do not drive if you are very worried, excited,
    afraid, angry or depressed.'
- id: 251
  category: safe_driving_rules
  question: According to the manual, what is the proper use for a light tap on your
    vehicle's horn?
  choices:
    A: To warn someone you are about to hit them
    B: To signal you are making a turn
    C: To show frustration with slow traffic
    D: To get another driver's attention on the road
  answer: D
  explanation: The manual explains, 'A light tap on the horn should be enough to signal
    to another driver to get their attention on the road.'
- id: 252
  category: vehicle_information
  question: In which of the following situations is it appropriate to use your high
    beam headlights?
  choices:
    A: When driving in heavy fog
    B: When following another vehicle within 200 feet
    C: When driving in an unfamiliar area with no oncoming vehicles
    D: When driving on a well-lit city street at night
  answer: C
  explanation: The manual says you can use your high beams when 'There are no vehicles
    coming toward you' and 'You are in an unfamiliar place or construction area.'
- id: 253
  category: safe_driving_rules
  question: If you plan to make a turn immediately after crossing through an intersection,
    when should you activate your turn signal?
  choices:
    A: At least 100 feet before the intersection
    B: While you are in the middle of the intersection
    C: Once you have crossed the intersection
    D: Only after you have started the turn
  answer: C
  explanation: The manual states, 'If you are turning after an intersection, start
    signaling once you cross the intersection.'
- id: 254
  category: safe_driving_rules
  question: What is the correct hand signal to indicate you are stopping or slowing
    down?
  choices:
    A: Point your hand straight out the window
    B: Bend your elbow and point your hand up
    C: Point your hand toward the ground
    D: Make a circular motion with your hand
  answer: C
  explanation: The manual explains, 'If you are stopping or slowing down point your
    hand to the ground.'
- id: 255
  category: signs_and_signals
  question: When would you most likely see a '2-Way Traffic' warning sign?
  choices:
    A: When a one-way street is about to begin
