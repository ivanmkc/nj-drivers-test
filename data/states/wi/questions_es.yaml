questions:
- id: 1
  category: driver_responsibility
  question: 'Según el Manual del Conductor de Wisconsin, conducir se considera:'
  choices:
    A: Un derecho constitucional
    B: Un privilegio y una responsabilidad muy importante
    C: Un requisito para todos los ciudadanos mayores de 18 años
    D: Un pasatiempo opcional
  answer: B
  explanation: 'El manual establece: "También es fundamental recordar que conducir
    es un privilegio y una responsabilidad muy importante".'
- id: 2
  category: safe_driving_rules
  question: ¿Cuál de los siguientes se enumera en el manual como un comportamiento
    seguro para ayudarle a tomar el control de su conducción?
  choices:
    A: Conducir ligeramente por encima del límite de velocidad para seguir el ritmo
      del tráfico
    B: Compartir la carretera con peatones y ciclistas
    C: Confiar únicamente en sus pasajeros para vigilar las motocicletas
    D: Realizar múltiples tareas mientras opera el vehículo
  answer: B
  explanation: El manual enumera "Compartir la carretera con peatones y ciclistas"
    como uno de los comportamientos seguros a desarrollar al volante.
- id: 3
  category: driver_responsibility
  question: ¿Qué organización se menciona específicamente como responsable de educar
    al público sobre las reglas de la carretera y de hacer cumplir las leyes de tránsito
    de Wisconsin?
  choices:
    A: Departamento de Vehículos Motorizados de Wisconsin (DMV)
    B: Patrulla Estatal de Wisconsin (Wisconsin State Patrol)
    C: Administración Nacional de Seguridad del Tráfico en las Carreteras
    D: Departamento de Transporte de Wisconsin
  answer: B
  explanation: 'El manual establece: "La Patrulla Estatal de Wisconsin educa al público
    sobre las reglas de la carretera y hace cumplir las leyes de tránsito de Wisconsin".'
- id: 4
  category: license_system
  question: ¿Cuál es la función principal del DMV según se describe en la sección
    introductoria del manual?
  choices:
    A: Hacer cumplir las leyes de tránsito de Wisconsin en la carretera
    B: Diseñar las carreteras de Wisconsin a través de un enfoque de Sistema Seguro
      (Safe System)
    C: Garantizar que los conductores estén capacitados y calificados para operar
      un vehículo
    D: Operar la Línea Directa Nacional contra la Trata de Personas
  answer: C
  explanation: El texto señala que "el DMV garantiza que los conductores estén capacitados
    y calificados para operar un vehículo, incluso a través de recursos útiles como
    este Manual del Conductor".
- id: 5
  category: defensive_driving
  question: ¿Cuál es el objetivo del enfoque de Sistema Seguro (Safe System) de Wisconsin
    para la seguridad vial?
  choices:
    A: Garantizar que todos los conductores aprueben el examen de conocimientos en
      su primer intento
    B: Diseñar y operar el sistema de transporte para que los errores de los conductores
      no resulten mortales
    C: Eliminar todas las paradas de tráfico por parte de la Patrulla Estatal de Wisconsin
    D: Reemplazar todas las intersecciones tradicionales con rotondas
  answer: B
  explanation: El manual explica que el enfoque de Sistema Seguro "tiene como objetivo
    diseñar y operar el sistema de transporte de Wisconsin para que los errores de
    los conductores no resulten mortales".
- id: 6
  category: driver_testing
  question: ¿Dónde puede encontrar el examen de práctica en línea para la licencia
    de conducir Clase D?
  choices:
    A: KnowToDrive.com/Wisconsin
    B: wisconsindmv.gov
    C: love146.org/online-safety
    D: tatnonprofit.org/youth
  answer: B
  explanation: El manual establece que el examen de práctica en línea para la licencia
    de conducir Clase D "se puede encontrar en nuestro sitio web del DMV wisconsindmv.gov".
- id: 7
  category: driver_responsibility
  question: ¿En cuántos condados de Wisconsin se han reportado casos de trata de personas?
  choices:
    A: 10 condados
    B: 25 condados
    C: 50 condados
    D: En los 72 condados
  answer: D
  explanation: 'La sección sobre trata de personas establece explícitamente: "Se han
    reportado casos de trata de personas en los 72 condados de Wisconsin".'
- id: 8
  category: driver_responsibility
  question: Según la información sobre la trata de personas en el manual, ¿cualquier
    persona menor de qué edad que intercambie actos sexuales por dinero u otras cosas
    de valor se considera víctima?
  choices:
    A: Menor de 16 años
    B: Menor de 18 años
    C: Menor de 21 años
    D: Menor de 25 años
  answer: B
  explanation: 'El texto establece: "Cualquier persona menor de 18 años que intercambie
    actos sexuales por dinero u otras cosas de valor se considera víctima de trata
    de personas".'
- id: 9
  category: driver_responsibility
  question: ¿Qué palabra puede enviar por mensaje de texto a BeFree (233733) para
    comunicarse con la Línea Directa Nacional contra la Trata de Personas?
  choices:
    A: SAFE
    B: HELP
    C: STOP
    D: ALERT
  answer: B
  explanation: El manual proporciona la información de contacto de la Línea Directa
    Nacional contra la Trata de Personas como "1-888-3737-888 o envíe la palabra HELP
    por mensaje de texto a BeFree (233733)".
- id: 10
  category: driver_responsibility
  question: Según el manual, ¿cómo conocen a menudo los traficantes de personas a
    sus víctimas?
  choices:
    A: A través de cursos de educación vial
    B: En los centros de servicio del DMV
    C: En línea mientras fingen ser otra persona
    D: A través del Programa de Subvenciones para la Educación Vial
  answer: C
  explanation: La sección "Manténgase seguro" advierte que "los traficantes a menudo
    conocen a sus víctimas en línea mientras fingen ser otra persona".
- id: 11
  category: driver_testing
  question: Según la Sección 1 del Índice del manual, ¿cuál de los siguientes es un
    requisito para el examen de conducir?
  choices:
    A: Un examen físico médico
    B: Un examen de señales de tráfico
    C: Una prueba de emisiones
    D: Una verificación de antecedentes
  answer: B
  explanation: La Sección 1 (Requisitos del examen de conducir) enumera la evaluación
    de la visión, el examen de señales de tráfico, el examen de conocimientos y el
    examen de habilidades.
- id: 12
  category: license_system
  question: Basándose en la Progresión de Licencias descrita en la Sección 2, ¿qué
    licencia sigue inmediatamente después de un Permiso de Instrucción?
  choices:
    A: Licencia Ocupacional
    B: Licencia de Conducir Regular
    C: Licencia Probatoria
    D: Licencia de Conducir Comercial (CDL)
  answer: C
  explanation: La Sección 2 (Progresión de Licencias) enumera el orden como Patrocinio,
    Permiso de Instrucción, Licencia Probatoria y luego Licencia de Conducir Regular.
- id: 13
  category: safe_driving_rules
  question: ¿Cuál de los siguientes temas está clasificado bajo "Comportamientos de
    Conducción Peligrosos" en la Sección 9 del manual?
  choices:
    A: Retroceder
    B: Conducir con somnolencia
    C: Seguridad en granjas
    D: Conducción en invierno
  answer: B
  explanation: La Sección 9 (Comportamientos de Conducción Peligrosos) incluye Alcohol,
    Drogas y Conducción; Conducción Distraída; y Conducción con Somnolencia.
- id: 14
  category: sharing_the_road
  question: La Sección 10 del manual cubre "Compartir la Carretera". ¿Cuál de los
    siguientes es un tema incluido en esta sección?
  choices:
    A: Zonas ciegas (No-Zones)
    B: Rampas con semáforo (Metered Ramps)
    C: Intercambios de diamante divergente
    D: Rotondas
  answer: A
  explanation: La Sección 10 (Compartir la Carretera) enumera Peatones, Vehículos
    de Emergencia, Autobuses Escolares, Motocicletas, Bicicletas y Zonas ciegas (No-Zones).
- id: 15
  category: penalties_and_points
  question: Según la Sección 11 del Índice, ¿qué sistema utiliza Wisconsin para rastrear
    su privilegio de conducir?
  choices:
    A: El sistema de deméritos
    B: El sistema de puntos
    C: El sistema de faltas (strikes)
    D: El sistema de citaciones
  answer: B
  explanation: La Sección 11 (Su privilegio de conducir) enumera el "Sistema de puntos"
    como su primer tema.
- id: 16
  category: driver_testing
  question: ¿Cuál es la agudeza visual mínima requerida en al menos un ojo para aprobar
    la evaluación de la visión para una licencia de automóvil regular?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Según el manual, Wisconsin requiere que los solicitantes de automóviles
    regulares tengan una agudeza visual de al menos 20/40 en un ojo (corregida o no
    corregida).
- id: 17
  category: driver_testing
  question: ¿Cuál es el campo de visión requerido desde el centro de cada ojo para
    aprobar la evaluación de la visión?
  choices:
    A: 50 grados
    B: 70 grados
    C: 90 grados
    D: 120 grados
  answer: B
  explanation: El manual establece que los solicitantes deben tener un campo de visión
    de 70 grados desde el centro de cada ojo.
- id: 18
  category: driver_testing
  question: ¿Cuántas preguntas debe responder correctamente para aprobar el Examen
    de Señales de Tráfico?
  choices:
    A: 10 de 15
    B: 12 de 15
    C: 15 de 20
    D: 40 de 50
  answer: B
  explanation: Hay 15 preguntas en el Examen de Señales de Tráfico y debe responder
    12 preguntas (80%) correctamente para aprobar.
- id: 19
  category: driver_testing
  question: ¿Cuál es el costo por realizar el examen de conocimientos en persona en
    un centro de atención al cliente del DMV?
  choices:
    A: $10
    B: $15
    C: $25
    D: Es gratis
  answer: D
  explanation: El manual establece que los exámenes en un centro de atención al cliente
    del DMV son gratuitos.
- id: 20
  category: driver_testing
  question: Si un solicitante tiene entre 15 y 17 años, ¿cuánto cuesta realizar el
    examen de conocimientos en línea?
  choices:
    A: Es gratis
    B: $10
    C: $15
    D: $20
  answer: B
  explanation: Los solicitantes de entre 15 y 17 años pueden realizar el examen de
    conocimientos en línea por un costo de $10.
- id: 21
  category: driver_testing
  question: ¿Cuál de los siguientes NO figura como una parte del vehículo que el examinador
    del DMV revisará antes de su examen de habilidades?
  choices:
    A: Bocina
    B: Nivel de aceite del motor
    C: Placas de matrícula
    D: Espejos
  answer: B
  explanation: Antes del examen, el examinador revisa la bocina, las luces/señales,
    las placas de matrícula, las puertas, los espejos y más. El nivel de aceite del
    motor no está en la lista.
- id: 22
  category: license_system
  question: ¿Cuántos documentos que demuestren que vive en Wisconsin debe traer al
    solicitar una licencia?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Para solicitar una licencia, debe traer dos documentos que demuestren
    que vive en Wisconsin, como una factura de servicios públicos o un estado de cuenta
    financiero.
- id: 23
  category: driver_responsibility
  question: ¿Qué significa que un adulto firme como patrocinador (sponsor) de un conductor
    menor de 18 años?
  choices:
    A: Deben viajar en el vehículo en todo momento.
    B: Pagan el curso de educación vial.
    C: Aceptan la responsabilidad legal y financiera por los incidentes causados por
      el menor.
    D: Garantizan que el menor aprobará el examen de habilidades.
  answer: C
  explanation: El patrocinador acepta la responsabilidad, lo que significa que es
    legal y financieramente responsable de los incidentes causados por el menor al
    conducir.
- id: 24
  category: license_system
  question: ¿Bajo qué condición debe un menor presentar un comprobante de seguro en
    lugar de tener un patrocinador?
  choices:
    A: Tienen 16 años y viven con sus padres.
    B: Están casados y su cónyuge es menor de 18 años.
    C: Han completado 50 horas de conducción supervisada.
    D: Están realizando el examen de conocimientos en línea.
  answer: B
  explanation: Debe presentar un comprobante de seguro en lugar de tener un patrocinador
    si está casado y su cónyuge es menor de 18 años, entre otros criterios específicos.
- id: 25
  category: license_system
  question: ¿Qué edad debe tener para solicitar un permiso de instrucción si está
    inscrito en un programa de educación vial?
  choices:
    A: 14 años
    B: 15 años
    C: 15 años y medio
    D: 16 años
  answer: B
  explanation: Si es menor de 18 años, debe tener al menos 15 años y estar inscrito
    en un programa de educación vial para solicitar un permiso de instrucción.
- id: 26
  category: safe_driving_rules
  question: Si tiene un permiso de instrucción y conduce durante las horas de oscuridad,
    ¿quién debe acompañarlo en el asiento del pasajero?
  choices:
    A: Cualquier conductor con licencia mayor de 18 años
    B: Un hermano que tenga al menos 16 años
    C: Un instructor calificado o una persona con licencia de 25 años de edad con
      al menos dos años de experiencia de conducción con licencia
    D: Cualquier persona con una licencia probatoria válida
  answer: C
  explanation: Si opera un vehículo durante las horas de oscuridad, debe estar acompañado
    por un instructor calificado o una persona con licencia de 25 años de edad con
    al menos dos años de experiencia de conducción con licencia que ocupe el asiento
    a su lado.
- id: 27
  category: safe_driving_rules
  question: ¿Cuántos años de experiencia de conducción con licencia debe tener, como
    mínimo, la persona que acompaña al titular de un permiso de instrucción en el
    asiento del pasajero?
  choices:
    A: Un año
    B: Dos años
    C: Tres años
    D: Cinco años
  answer: B
  explanation: El titular de un permiso de instrucción de clase D debe conducir con
    otra persona en el automóvil que tenga al menos dos años de experiencia de conducción
    con licencia.
- id: 28
  category: license_system
  question: ¿Cuánto tiempo debe tener su permiso de instrucción un conductor menor
    de 18 años antes de poder obtener una licencia probatoria?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Si es menor de 18 años, debe tener su permiso de instrucción durante
    al menos seis meses y cumplir 16 años para obtener una licencia probatoria.
- id: 29
  category: driver_testing
  question: ¿Cuántas horas totales de práctica de conducción supervisada debe completar
    un menor antes de obtener una licencia probatoria?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Con un permiso de instrucción válido, debe practicar la conducción
    durante al menos 40 horas durante el día y 10 horas durante la oscuridad, para
    un total de 50 horas.
- id: 30
  category: safe_driving_rules
  question: Mientras conduce con una licencia probatoria, ¿cuándo se le permite usar
    un teléfono?
  choices:
    A: Cuando está detenido en un semáforo en rojo
    B: Solo para informar una emergencia
    C: Cuando usa un dispositivo de manos libres
    D: Nunca se le permite usar un teléfono bajo ninguna circunstancia
  answer: B
  explanation: 'El manual establece para las licencias probatorias: "Recuerde que
    no se permiten teléfonos mientras conduce, a menos que necesite informar una emergencia".'
- id: 31
  category: license_system
  question: ¿Por cuánto tiempo se requieren las restricciones de pasajeros y de horario
    de la Licencia de Conducir Graduada (GDL) para conductores menores de 18 años?
  choices:
    A: Durante los primeros 6 meses
    B: Durante los primeros 9 meses
    C: Durante los primeros 12 meses
    D: Hasta que el conductor cumpla 21 años
  answer: B
  explanation: Según el manual, las restricciones de la GDL se requieren durante los
    primeros nueve meses, a menos que cumpla 18 años antes de ese tiempo.
- id: 32
  category: license_system
  question: Bajo una Licencia de Conducir Graduada (GDL), ¿dónde se le permite conducir
    solo entre la medianoche y las 5 a.m.?
  choices:
    A: En cualquier lugar dentro de los límites de su ciudad de residencia
    B: Solo entre el hogar, la escuela y/o el trabajo
    C: Solo en emergencias médicas
    D: Nunca se le permite conducir solo durante esas horas
  answer: B
  explanation: El manual establece que de las 12 p.m. (medianoche) a las 5 a.m., puede
    conducir solo ÚNICAMENTE SI conduce entre el hogar, la escuela y/o el trabajo.
- id: 33
  category: penalties_and_points
  question: ¿Qué causará que las restricciones de su Licencia de Conducir Graduada
    (GDL) se extiendan por seis meses?
  choices:
    A: Recibir una multa de estacionamiento
    B: Ser condenado por una infracción de tráfico en movimiento
    C: No renovar su licencia con 90 días de anticipación
    D: Conducir con un familiar inmediato
  answer: B
  explanation: Las restricciones de la licencia de conducir graduada se extenderán
    seis meses si es condenado por una infracción de tráfico en movimiento, viola
    cualquier restricción o si su licencia es suspendida o revocada.
- id: 34
  category: license_system
  question: ¿Con qué frecuencia debe renovarse una licencia de conducir regular de
    Wisconsin?
  choices:
    A: Cada 4 años
    B: Cada 5 años
    C: Cada 8 años
    D: Cada 10 años
  answer: C
  explanation: El manual establece que la renovación de su licencia de conducir debe
    realizarse cada ocho años.
- id: 35
  category: license_system
  question: Si se muda a Wisconsin con una licencia de conducir regular de otro estado,
    ¿dentro de cuántos días debe solicitar una licencia de Wisconsin?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Para una licencia de conducir regular de otro estado, debe solicitar
    una licencia de conducir de Wisconsin dentro de los 60 días posteriores a su mudanza.
- id: 36
  category: license_system
  question: ¿Cómo se marca una licencia de conducir que cumple con REAL ID en Wisconsin?
  choices:
    A: Con un círculo dorado
    B: Con una estrella
    C: Con un águila calva
    D: Con un código de barras en el frente
  answer: B
  explanation: El manual señala que el DMV de Wisconsin emite REAL-ID que cumple con
    los requisitos de Seguridad Nacional, la cual está marcada con una estrella.
- id: 37
  category: safe_driving_rules
  question: Si dos conductores llegan a una parada de cuatro vías exactamente al mismo
    tiempo, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que va derecho
    D: El conductor que gira a la derecha
  answer: B
  explanation: De acuerdo con las reglas de derecho de paso, si uno o más conductores
    llegan a la parada al mismo tiempo, el conductor de la derecha pasa primero.
- id: 38
  category: sharing_the_road
  question: Al encontrarse con un peatón que utiliza un perro guía o lleva un bastón
    blanco, ¿qué debe hacer?
  choices:
    A: Tocar la bocina para avisarle que usted está allí
    B: Detenerse al menos a diez pies de distancia hasta que esté fuera de la calzada
    C: Ceder el paso solo si se encuentra en un cruce de peatones marcado
    D: Rodearlo lentamente con el vehículo
  answer: B
  explanation: Debe ceder el derecho de paso a los peatones que utilicen un perro
    guía o lleven un bastón blanco deteniéndose al menos a diez pies de distancia
    hasta que la persona esté fuera de la calzada.
- id: 39
  category: safe_driving_rules
  question: ¿Qué regla debe utilizar para determinar una distancia de seguimiento
    segura en condiciones normales de conducción?
  choices:
    A: La regla de los dos segundos
    B: La regla de los tres segundos
    C: La regla de los cuatro segundos de distancia de seguimiento
    D: La regla de la longitud de un vehículo
  answer: C
  explanation: El manual instruye a los conductores a conducir a una velocidad en
    la que siempre puedan detenerse de manera segura utilizando la “Regla de los cuatro
    segundos de distancia de seguimiento”.
- id: 40
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad normal en una zona escolar cuando hay
    niños presentes en Wisconsin?
  choices:
    A: 15 millas por hora
    B: 20 millas por hora
    C: 25 millas por hora
    D: 35 millas por hora
  answer: A
  explanation: El manual especifica que el límite de velocidad normal en una zona
    escolar cuando hay niños presentes es de 15 millas por hora.
- id: 41
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    zonas residenciales?
  choices:
    A: 15 millas por hora
    B: 25 millas por hora
    C: 30 millas por hora
    D: 35 millas por hora
  answer: B
  explanation: A menos que se indique lo contrario, el límite de velocidad en zonas
    residenciales es de 25 millas por hora.
- id: 42
  category: defensive_driving
  question: Al incorporarse a una carretera de alta velocidad desde un carril de aceleración,
    ¿cuál es su responsabilidad?
  choices:
    A: Detenerse al final de la rampa y esperar un espacio
    B: Obligar a otros conductores a cambiar su velocidad para que usted pueda entrar
    C: Encontrar un espacio seguro en el tráfico para incorporarse legalmente
    D: Conducir por el arcén (hombro) hasta que se abra un espacio
  answer: C
  explanation: En el carril de aceleración, usted aumenta la velocidad mientras se
    incorpora. El manual establece que es su responsabilidad encontrar un espacio
    seguro en el tráfico para incorporarse legalmente.
- id: 43
  category: defensive_driving
  question: ¿Con cuánta anticipación debería poder ver hacia adelante para mantener
    un mejor control de su vehículo?
  choices:
    A: De 3 a 5 segundos de anticipación
    B: De 5 a 10 segundos de anticipación
    C: De 10 a 15 segundos de anticipación
    D: De 20 a 30 segundos de anticipación
  answer: C
  explanation: Para tener un mejor control de su vehículo, el conductor debe poder
    ver de 10 a 15 segundos por delante de su vehículo.
- id: 44
  category: safe_driving_rules
  question: ¿Cuál es el patrón de búsqueda recomendado antes de atravesar una intersección?
  choices:
    A: Mirar a la derecha, luego a la izquierda
    B: Mirar solo hacia adelante
    C: Mirar a la izquierda, a la derecha y a la izquierda de nuevo
    D: Mirar el espejo retrovisor y luego a la izquierda
  answer: C
  explanation: El manual aconseja estar alerta mirando a la izquierda, a la derecha
    y a la izquierda de nuevo antes de atravesar la intersección, incluso si usted
    tiene el derecho de paso.
- id: 45
  category: safe_driving_rules
  question: ¿A quién debe ceder el derecho de paso en una intersección en T no controlada?
  choices:
    A: Al vehículo en la calle que termina
    B: Al tráfico transversal
    C: Al vehículo que gira a la izquierda
    D: Al vehículo que toque la bocina primero
  answer: B
  explanation: De acuerdo con las reglas de derecho de paso del manual, debe ceder
    el derecho de paso al tráfico transversal en una intersección en T no controlada.
- id: 46
  category: safe_driving_rules
  question: ¿Qué significa "bajar por inercia" (coast) al conducir, algo que el manual
    desaconseja?
  choices:
    A: Conducir sin usar el acelerador
    B: Poner el coche en la posición neutral (punto muerto)
    C: Conducir con el freno de mano parcialmente accionado
    D: Apagar el motor mientras se está en movimiento
  answer: B
  explanation: 'El manual establece: "No baje por inercia mientras conduce; esto significa
    poner su coche en la posición neutral. Manténgase en ''marcha'' para poder tener
    un control total sobre su vehículo".'
- id: 47
  category: defensive_driving
  question: ¿Con qué frecuencia debe revisar su espejo retrovisor para ver si alguien
    lo sigue demasiado de cerca?
  choices:
    A: Cada 3 a 5 segundos
    B: Cada 6 a 8 segundos
    C: Cada 10 a 12 segundos
    D: Cada 15 a 20 segundos
  answer: B
  explanation: 'El manual aconseja: "Revise su espejo retrovisor cada 6 a 8 segundos
    para ver si alguien lo sigue demasiado de cerca (tailgating)".'
- id: 48
  category: safe_driving_rules
  question: ¿Qué debe hacer si otro conductor lo sigue demasiado de cerca (tailgating)?
  choices:
    A: Tocar los frenos rápidamente para advertirle
    B: Aumentar la velocidad para incrementar la distancia entre los vehículos
    C: Reducir lentamente la velocidad para animarlo a que lo adelante
    D: Cambiar de carril inmediatamente sin señalizar
  answer: C
  explanation: 'El manual establece: "Si alguien lo sigue demasiado de cerca, reduzca
    lentamente su velocidad. Esto debería animarlo a que lo adelante".'
- id: 49
  category: safe_driving_rules
  question: ¿Por qué es importante mantener el volante recto mientras espera para
    girar a la izquierda?
  choices:
    A: Evita que el líquido de la dirección asistida se sobrecaliente
    B: Le ayuda a acelerar más rápido cuando el camino esté despejado
    C: Evita que sea empujado hacia el tráfico en sentido contrario si alguien lo
      choca por detrás
    D: Indica a otros conductores que usted está cediendo el derecho de paso
  answer: C
  explanation: 'El manual explica: "Si gira el volante a la izquierda y alguien lo
    choca por detrás, será empujado hacia el tráfico en sentido contrario. Es importante
    mantener el volante, las ruedas y el vehículo rectos".'
- id: 50
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite hacer un giro en U en una carretera
    rural de dos carriles?
  choices:
    A: Solo cuando hay un carril designado para giros en U
    B: Si se hace de manera segura y no interfiere con el tráfico
    C: Solo durante las horas del día
    D: Los giros en U nunca están permitidos en carreteras rurales de dos carriles
  answer: B
  explanation: 'El manual establece: "Puede hacer un giro en U en cualquier carretera
    rural de dos carriles si se hace de manera segura y no interfiere con el tráfico".'
- id: 51
  category: safe_driving_rules
  question: ¿Al girar a la derecha desde una calzada de cuatro carriles, desde qué
    carril debe girar?
  choices:
    A: El carril más cercano a la línea central
    B: Cualquier carril, siempre que ponga la señal
    C: El carril más cercano al bordillo derecho o al borde de la calzada
    D: El carril con la menor cantidad de tráfico
  answer: C
  explanation: 'El manual especifica: ''Para girar a la derecha desde una calzada
    de cuatro carriles, debe girar desde el carril más cercano al bordillo derecho
    o al borde de la calzada''.'
- id: 52
  category: vehicle_information
  question: ¿Cuál es el primer paso al realizar un giro en Y (Y-Turn)?
  choices:
    A: Señalizar a la izquierda y revisar su punto ciego
    B: Mirar hacia atrás por encima de su hombro derecho y dar marcha atrás
    C: Señalizar a la derecha, verificar el tráfico, acercarse lo más posible a la
      derecha y detenerse
    D: Avanzar y continuar en su carril de tráfico
  answer: C
  explanation: 'El primer paso de un giro en Y es: ''1. Señalizar a la derecha. Verificar
    el tráfico a la derecha y en sus espejos. Acercarse lo más posible a la derecha.
    Detenerse''.'
- id: 53
  category: sharing_the_road
  question: ¿Cuándo está permitido usar un arcén pavimentado para adelantar a otro
    vehículo?
  choices:
    A: Cuando el vehículo de adelante circula por debajo del límite de velocidad
    B: Solo si el vehículo de adelante está detenido o realizando un giro a la izquierda
    C: Cuando conduce en una autopista de varios carriles
    D: Nunca está permitido adelantar por un arcén pavimentado
  answer: B
  explanation: 'El manual establece: ''Puede usar un arcén pavimentado para rodear
    a alguien solo si está detenido o realizando un giro a la izquierda''.'
- id: 54
  category: defensive_driving
  question: ¿Cómo sabe que es seguro regresar al carril de circulación después de
    adelantar a otro vehículo?
  choices:
    A: Cuando esté a una distancia de un vehículo por delante del vehículo adelantado
    B: Cuando vea ambos faros delanteros del vehículo que acaba de adelantar en su
      espejo retrovisor
    C: Cuando el conductor del vehículo adelantado le haga ráfagas con las luces altas
    D: Tres segundos después de haber pasado el vehículo
  answer: B
  explanation: 'El manual establece: ''Una vez que vea ambos faros delanteros del
    vehículo que acaba de adelantar en su espejo retrovisor, es seguro regresar al
    carril de circulación''.'
- id: 55
  category: vehicle_information
  question: ¿Cuál es la velocidad máxima a la que debe circular al dar marcha atrás?
  choices:
    A: 10 millas por hora
    B: 5 millas por hora
    C: No más rápido que el paso lento de una persona
    D: El límite de velocidad señalizado de la carretera
  answer: C
  explanation: 'El manual aconseja: ''Cuando sea necesario dar marcha atrás, muévase
    lentamente. No retroceda más rápido que el paso lento de una persona''.'
- id: 56
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida en una carretera?
  choices:
    A: Detenerse inmediatamente y dar marcha atrás por el arcén
    B: Hacer un giro en U en el siguiente cruce de mediana disponible
    C: Poner su vehículo en reversa y retroceder por el carril del extremo derecho
    D: Continuar hasta la siguiente salida y volver a entrar en la carretera para
      regresar a la salida que se pasó
  answer: D
  explanation: 'El manual establece explícitamente: ''Si se pasa de su salida o giro
    en una carretera, no dé marcha atrás. Continúe hasta la siguiente salida y vuelva
    a entrar en la carretera para regresar a la salida que se pasó''.'
- id: 57
  category: safe_driving_rules
  question: ¿Dónde está estrictamente prohibido estacionar según el texto del manual
    proporcionado?
  choices:
    A: En cualquier carretera rural de dos carriles
    B: Donde haya marcas amarillas en el bordillo o frente a hidrantes de incendio
    C: En el lado del extremo derecho de la carretera
    D: En áreas residenciales con calles estrechas
  answer: B
  explanation: 'El manual establece: ''No se permite estacionar donde haya marcas
    amarillas en el bordillo o en áreas frente a hidrantes de incendio''.'
- id: 58
  category: safe_driving_rules
  question: ¿Se le permite exceder el límite de velocidad al adelantar a otro vehículo?
  choices:
    A: Sí, pero solo por 5 mph
    B: Sí, si está adelantando a un camión grande o autobús
    C: No, no puede sobrepasar el límite de velocidad para adelantar a otro vehículo
    D: Sí, pero solo en una autopista de varios carriles
  answer: C
  explanation: 'El manual establece claramente: ''No puede sobrepasar el límite de
    velocidad para adelantar a otro vehículo en la carretera''.'
- id: 59
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar el volante al estacionar cuesta arriba con
    bordillo?
  choices:
    A: Todo hacia la derecha
    B: Todo hacia la izquierda
    C: Mantener las ruedas rectas
    D: Ligeramente hacia la derecha
  answer: B
  explanation: Según el manual, si está estacionado cuesta arriba con bordillo, girará
    las ruedas todo hacia la izquierda antes de poner el coche en posición de estacionamiento
    (park).
- id: 60
  category: safe_driving_rules
  question: Al estacionar su vehículo cuesta abajo, ¿en qué dirección debe girar las
    ruedas?
  choices:
    A: Todo hacia la derecha
    B: Todo hacia la izquierda
    C: Mantenerlas rectas
    D: Hacia el centro de la carretera
  answer: A
  explanation: El manual establece que si está estacionado cuesta abajo, moverá las
    ruedas todo hacia la derecha.
- id: 61
  category: safe_driving_rules
  question: ¿Al buscar un espacio para estacionarse en paralelo, qué tan más largo
    que su vehículo debe ser el espacio?
  choices:
    A: 1-2 pies
    B: 3-6 pies
    C: 6-8 pies
    D: 8-10 pies
  answer: B
  explanation: El manual aconseja buscar un espacio de estacionamiento que sea aproximadamente
    de 3 a 6 pies más largo que su vehículo al prepararse para estacionarse en paralelo.
- id: 62
  category: safe_driving_rules
  question: Después de estacionarse en paralelo con éxito, ¿a qué distancia aproximada
    debe estar su vehículo del bordillo?
  choices:
    A: Unas 6 pulgadas
    B: Aproximadamente un pie
    C: Aproximadamente 2 pies
    D: Aproximadamente 3 pies
  answer: B
  explanation: Una vez que enderece las ruedas después de estacionarse en paralelo,
    debe estar a aproximadamente un pie de distancia del bordillo y al menos a 2 pies
    de distancia de los vehículos delante y detrás de usted.
- id: 63
  category: safe_driving_rules
  question: ¿Debe usar sus luces bajas cuando no pueda ver a un vehículo o persona
    desde qué distancia?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: Debe usar sus luces bajas cuando no pueda ver a un vehículo o persona
    que esté a 500 pies (aproximadamente una cuadra) de distancia.
- id: 64
  category: safe_driving_rules
  question: ¿Durante qué período de tiempo está legalmente obligado a usar sus luces
    bajas?
  choices:
    A: Desde la puesta del sol hasta el amanecer
    B: Media hora después de la puesta del sol hasta media hora antes del amanecer
    C: Una hora después de la puesta del sol hasta una hora antes del amanecer
    D: Solo cuando esté completamente oscuro
  answer: B
  explanation: El manual establece que debe usar sus luces bajas desde media hora
    después de la puesta del sol hasta media hora antes del amanecer.
- id: 65
  category: defensive_driving
  question: ¿Qué debe hacer si un conductor que viene en sentido contrario olvida
    apagar sus luces altas?
  choices:
    A: Parpadear sus luces altas rápidamente
    B: Mirar hacia el lado izquierdo de la carretera
    C: Mirar hacia el lado derecho de la carretera
    D: Encender sus luces de emergencia
  answer: C
  explanation: Si alguien conduce hacia usted y olvida apagar sus luces altas, debe
    mirar hacia el lado derecho de la carretera.
- id: 66
  category: safe_driving_rules
  question: Si va a girar en una intersección, ¿cuándo debe comenzar a señalizar?
  choices:
    A: Unos tres segundos (unos 100 pies) antes del giro
    B: Unos cinco segundos (unos 200 pies) antes del giro
    C: Justo al entrar en la intersección
    D: Solo después de haberse detenido en la intersección
  answer: A
  explanation: Si va a girar en una intersección, debe comenzar a señalizar unos tres
    segundos (unos 100 pies) antes del giro.
- id: 67
  category: vehicle_information
  question: ¿Cuál es la señal manual correcta para indicar un giro a la derecha?
  choices:
    A: Apuntar con la mano hacia afuera de la ventana del lado del conductor, de forma
      recta
    B: Doblar el codo y apuntar con la mano hacia arriba
    C: Apuntar con la mano hacia el suelo
    D: Mover la mano en un movimiento circular
  answer: B
  explanation: Si desea girar a la derecha usando una señal manual, doble el codo
    y apunte con la mano hacia arriba.
- id: 68
  category: signs_and_signals
  question: ¿De qué color y forma son la mayoría de las señales de advertencia?
  choices:
    A: Octágonos rojos y blancos
    B: Rectángulos blancos y negros
    C: Amarillas con letras o símbolos negros, la mayoría en forma de diamante
    D: Verdes con letras blancas, la mayoría cuadradas
  answer: C
  explanation: Las señales de advertencia son amarillas con letras o símbolos negros.
    La mayoría tiene forma de diamante.
- id: 69
  category: signs_and_signals
  question: Una señal en forma de triángulo con marcas naranjas reflectantes indica
    un vehículo de movimiento lento. ¿Cuál es la velocidad máxima a la que probablemente
    viaja este vehículo?
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: Una señal de Vehículo de Movimiento Lento es una señal en forma de
    triángulo con marcas naranjas reflectantes. Este vehículo podría viajar a 25 mph
    o menos.
- id: 70
  category: signs_and_signals
  question: ¿Cómo es una señal de Zona de No Adelantar?
  choices:
    A: Un banderín amarillo con letras negras
    B: Un octágono rojo con letras blancas
    C: Un triángulo rojo y blanco que apunta hacia abajo
    D: Un rectángulo blanco con letras negras
  answer: A
  explanation: Una señal de Zona de No Adelantar es un banderín amarillo con letras
    negras. No se le permite adelantar a ningún vehículo en la zona de no adelantar.
- id: 71
  category: signs_and_signals
  question: Si un oficial de policía o un guardia de cruce escolar le da instrucciones
    que difieren de un semáforo o señal de tráfico, ¿qué debe hacer?
  choices:
    A: Siga el semáforo o la señal
    B: Siga las instrucciones del oficial de policía o del guardia de cruce
    C: Deténgase y espere a que la luz cambie a verde
    D: Toque la bocina para alertarlos sobre la señal
  answer: B
  explanation: Debe seguir las instrucciones de la policía, los guardias de cruce
    escolar y otros trabajadores, incluso si son diferentes al semáforo o a la señal
    en la carretera.
- id: 72
  category: defensive_driving
  question: ¿Cuándo es apropiado tocar la bocina de su vehículo con fuerza?
  choices:
    A: Para saludar a un amigo
    B: Para hacerle una señal a un conductor que circula demasiado lento
    C: Para advertir a alguien si usted va a chocar con ellos o si ellos van a chocar
      con usted
    D: Para avisar a los peatones que se está acercando a un cruce peatonal
  answer: C
  explanation: Puede tocar la bocina con fuerza para advertir a alguien si usted va
    a chocar con ellos o si ellos van a chocar con usted.
- id: 73
  category: vehicle_information
  question: ¿Cuándo debe usar las luces de estacionamiento de su vehículo?
  choices:
    A: Siempre que esté conduciendo con niebla densa
    B: Solo cuando esté estacionado y con el motor encendido pero sin movimiento
    C: Al conducir entre la puesta del sol y el amanecer
    D: Al estacionar en paralelo en una calle concurrida
  answer: B
  explanation: Según el manual, las luces de estacionamiento solo deben usarse cuando
    esté estacionado y con el motor encendido sin movimiento.
- id: 74
  category: penalties_and_points
  question: ¿Qué sucede con las multas de tráfico en las zonas de obras de construcción?
  choices:
    A: Se reducen a la mitad
    B: Se mantienen iguales
    C: Se duplican
    D: Se triplican
  answer: C
  explanation: Las multas de tráfico se duplican en las zonas de obras de construcción
    como una sanción para incentivar a los conductores a reducir la velocidad y proteger
    a los trabajadores.
- id: 75
  category: safe_driving_rules
  question: ¿Cuándo se le permite usar su teléfono celular en una zona de construcción?
  choices:
    A: Cuando use un dispositivo de manos libres
    B: Solo si está informando una emergencia
    C: Cuando el tráfico esté completamente detenido
    D: Nunca se le permite usar un teléfono celular
  answer: B
  explanation: Según el manual, solo puede usar su teléfono celular en una zona de
    construcción si está informando una emergencia.
- id: 76
  category: signs_and_signals
  question: ¿De qué color son las señales de destino que muestran direcciones hacia
    parques, áreas históricas o museos?
  choices:
    A: Azul
    B: Naranja
    C: Marrón
    D: Amarillo
  answer: C
  explanation: Las señales de destino de color marrón muestran información sobre lugares
    divertidos o hermosos, como parques, áreas históricas o museos.
- id: 77
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de las señales de marcadores de milla
    en la autopista?
  choices:
    A: Mostrar el límite de velocidad actual
    B: Indicar las próximas paradas de descanso
    C: Mejorar los tiempos de respuesta de emergencia ante incidentes en la autopista
    D: Advertir a los conductores sobre las próximas zonas de construcción
  answer: C
  explanation: Los marcadores de milla le ayudan a ubicar dónde se encuentra en la
    carretera, lo que mejora los tiempos de respuesta de emergencia ante incidentes
    en la autopista.
- id: 78
  category: signs_and_signals
  question: ¿Qué tipo de señal de ruta parece un escudo con rojo en la parte superior
    y azul en la parte inferior?
  choices:
    A: Carretera del condado (County Road)
    B: Ruta de los EE. UU. (U.S. Route)
    C: Carretera estatal (State Road)
    D: Autopista interestatal (Interstate Highway)
  answer: D
  explanation: Una señal de autopista interestatal parece un escudo con rojo en la
    parte superior y azul en la parte inferior, y tiene letras blancas.
- id: 79
  category: safe_driving_rules
  question: ¿Qué NO debe hacer mientras cruza las vías del tren?
  choices:
    A: Mirar a ambos lados
    B: Cambiar de marcha
    C: Mantener una distancia segura
    D: Ceder el paso a los trenes
  answer: B
  explanation: El manual establece explícitamente que no debe cambiar de marcha mientras
    cruza las vías del tren.
- id: 80
  category: signs_and_signals
  question: ¿Qué significa una señal de "Exento" (Exempt) en un cruce de ferrocarril?
  choices:
    A: Las vías ya no están en uso
    B: Ciertos vehículos no están obligados a detenerse antes de cruzar
    C: El cruce no tiene luces intermitentes
    D: Los trenes deben detenerse ante los vehículos
  answer: B
  explanation: Una señal de "Exento" significa que ciertos vehículos no están obligados
    a detenerse antes de cruzar las vías del tren.
- id: 81
  category: defensive_driving
  question: ¿Si su vehículo se queda atascado en las vías del tren, cómo puede encontrar
    un número de teléfono para reportar la condición insegura?
  choices:
    A: Busque una señal azul con letras blancas en el cruce
    B: Busque una señal de advertencia amarilla
    C: Revise la parte posterior de la señal de cruce ferroviario (crossbuck)
    D: Llame solo al 911
  answer: A
  explanation: Una señal azul con letras blancas se encuentra en cada cruce de carretera
    y ferrocarril. Muestra un número de teléfono para reportar condiciones inseguras
    o emergencias.
- id: 82
  category: safe_driving_rules
  question: ¿Cómo debe proceder si un semáforo se queda sin energía o no funciona
    correctamente?
  choices:
    A: Ceda el paso al vehículo a su derecha
    B: Proceda como si la señal fuera una señal de ceda el paso (yield)
    C: Proceda como si la señal fuera una señal de alto (stop)
    D: Espere a que llegue un oficial de policía
  answer: C
  explanation: Si un semáforo se queda sin energía o no funciona correctamente, debe
    proceder como si la señal fuera una señal de alto (stop).
- id: 83
  category: safe_driving_rules
  question: ¿Bajo qué condición puede girar a la izquierda con una luz roja fija?
  choices:
    A: Nunca puede girar a la izquierda con luz roja
    B: Si está girando desde una calle de un solo sentido hacia otra calle de un solo
      sentido
    C: Si no hay tráfico en sentido contrario
    D: Si está girando desde una calle de doble sentido hacia una calle de un solo
      sentido
  answer: B
  explanation: Puede girar a la izquierda en rojo si está girando desde una calle
    de un solo sentido hacia otra calle de un solo sentido, siempre que se detenga
    primero y ceda el paso al tráfico.
- id: 84
  category: safe_driving_rules
  question: ¿Qué debe hacer si ya se encuentra en la intersección cuando se enciende
    la luz amarilla fija?
  choices:
    A: Detenerse inmediatamente en la intersección
    B: Retroceder para salir de la intersección
    C: Continuar a través de la intersección
    D: Orillarse a un lado
  answer: C
  explanation: Si se encuentra en la intersección cuando se enciende la luz amarilla,
    no se detenga. Puede continuar a través de la intersección.
- id: 85
  category: signs_and_signals
  question: ¿Qué significa una luz de tráfico amarilla intermitente?
  choices:
    A: Deténgase por completo y espere la luz verde
    B: La luz está a punto de cambiar a rojo
    C: Reduzca la velocidad, verifique el tráfico transversal y proceda con precaución
    D: Ceda el paso al tráfico en sentido contrario y gire a la izquierda
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad,
    verificar el tráfico transversal y proceder con precaución.
- id: 86
  category: safe_driving_rules
  question: Al girar a la izquierda con una luz verde fija, ¿qué debe hacer?
  choices:
    A: Proceder de inmediato porque tiene el derecho de paso
    B: Ceder el paso al tráfico en sentido contrario
    C: Esperar una flecha verde
    D: Detenerse y esperar a que la luz cambie a amarillo
  answer: B
  explanation: Si está girando a la izquierda, una luz verde fija significa que puede
    girar, pero solo cuando sea seguro hacerlo. El tráfico en sentido contrario tiene
    el derecho de paso.
- id: 87
  category: signs_and_signals
  question: ¿Qué significa una luz verde fija cuando está girando a la izquierda en
    una intersección?
  choices:
    A: Usted tiene el derecho de paso sobre el tráfico en sentido contrario.
    B: Puede girar, pero solo cuando sea seguro hacerlo, cediendo el paso al tráfico
      en sentido contrario.
    C: Debe esperar una flecha verde antes de girar.
    D: Puede girar sin ceder el paso a los peatones.
  answer: B
  explanation: Según el manual, si está girando a la izquierda, una luz verde fija
    significa que puede girar, pero solo cuando sea seguro hacerlo. El tráfico en
    sentido contrario tiene el derecho de paso.
- id: 88
  category: safe_driving_rules
  question: ¿Cuándo se le permite cruzar una línea blanca continua que separa los
    carriles de tráfico que van en la misma dirección?
  choices:
    A: Siempre que necesite rebasar a un vehículo más lento.
    B: Solo cuando haya un peligro o esté girando dentro de la siguiente cuadra.
    C: Cuando esté conduciendo en una zona escolar.
    D: Nunca se le permite cruzar una línea blanca continua.
  answer: B
  explanation: El manual establece que una línea blanca continua entre carriles significa
    que no puede cruzar. Solo puede cruzar si hay un peligro o si va a girar dentro
    de la siguiente cuadra.
- id: 89
  category: safe_driving_rules
  question: Dos líneas amarillas continuas significan que ningún carril de circulación
    puede rebasar. ¿Cuál es una excepción a esta regla?
  choices:
    A: Rebasar a un vehículo que va a menos de la mitad del límite de velocidad, a
      menos que sea equipo agrícola.
    B: Rebasar a un autobús escolar con sus luces amarillas intermitentes encendidas.
    C: Rebasar a un tractor agrícola que va a menos de la mitad del límite de velocidad.
    D: Rebasar cuando llega tarde a una emergencia.
  answer: A
  explanation: Una excepción a la regla de las dos líneas amarillas continuas es que
    puede rebasar a un vehículo que va a menos de la mitad del límite de velocidad
    si es seguro, excepto si se trata de equipo agrícola.
- id: 90
  category: safe_driving_rules
  question: ¿Dónde debe estar posicionado su vehículo al detenerse en un cruce peatonal?
  choices:
    A: Sus ruedas delanteras deben estar sobre la línea blanca continua.
    B: Sus ruedas delanteras deben detenerse justo antes de la línea blanca continua.
    C: Debe detenerse a la mitad del cruce peatonal.
    D: Debe detenerse al menos 10 pies antes del cruce peatonal.
  answer: B
  explanation: El manual establece que sus ruedas delanteras deben detenerse justo
    antes de la línea blanca continua, y no debe detenerse sobre el cruce peatonal.
- id: 91
  category: safe_driving_rules
  question: ¿Para qué se utiliza el carril central compartido?
  choices:
    A: Para rebasar vehículos que circulan despacio.
    B: Para estacionarse durante emergencias.
    C: Para vehículos que giran a la izquierda o realizan un giro en U.
    D: Para uso exclusivo de autobuses y bicicletas.
  answer: C
  explanation: El carril central compartido es solo para vehículos que giran a la
    izquierda o realizan un giro en U. Los vehículos pueden usar este carril en cualquier
    dirección.
- id: 92
  category: signs_and_signals
  question: ¿Qué indica una señal de "X" amarilla sobre un carril reversible?
  choices:
    A: El carril está abierto para circular.
    B: El carril está cerrado a todo el tráfico.
    C: El carril es solo para giros a la izquierda.
    D: El carril está cambiando y usted debe moverse a un carril con una flecha verde.
  answer: D
  explanation: Una "X" amarilla en un carril reversible significa que el carril está
    cambiando y usted debe moverse a un carril con una "flecha" verde.
- id: 93
  category: safe_driving_rules
  question: ¿Cuándo se le permite legalmente circular por un carril reservado (como
    un carril para autobuses o bicicletas) si no está operando ese tipo de vehículo?
  choices:
    A: Cuando el tráfico en los carriles de uso general está muy congestionado.
    B: Si necesita girar cruzando el carril reservado en la siguiente media cuadra.
    C: Al conducir entre las 6 a.m. y las 9 a.m.
    D: Nunca se le permite circular por un carril reservado bajo ninguna circunstancia.
  answer: B
  explanation: Es ilegal circular por un carril reservado a menos que se opere ese
    tipo de vehículo, pero puede circular por este carril si necesita girar cruzando
    el carril reservado en la siguiente media cuadra.
- id: 94
  category: safe_driving_rules
  question: ¿Qué tipo de vehículo NO tiene permitido circular por un carril flexible
    (flex lane)?
  choices:
    A: Automóviles de pasajeros.
    B: Motocicletas.
    C: Camiones grandes.
    D: Vehículos de viaje compartido (carpool).
  answer: C
  explanation: El manual establece explícitamente que "ningún camión grande puede
    circular por el carril flexible".
- id: 95
  category: safe_driving_rules
  question: ¿En qué dirección se mueve el tráfico en una glorieta (roundabout)?
  choices:
    A: En el sentido de las agujas del reloj.
    B: En sentido contrario a las agujas del reloj.
    C: En un patrón de figura en ocho.
    D: En línea recta sin girar.
  answer: B
  explanation: Según el manual, las glorietas son una opción de flujo de tráfico más
    segura y eficiente donde el tráfico se mueve en sentido contrario a las agujas
    del reloj.
- id: 96
  category: sharing_the_road
  question: Al acercarse a una glorieta, ¿a cuál de los siguientes debe ceder el paso?
  choices:
    A: Al tráfico que se aproxima por su derecha.
    B: Al tráfico a su izquierda que ya se encuentra en la glorieta.
    C: A los vehículos que intentan entrar en la glorieta desde el lado opuesto.
    D: Solo a los vehículos de emergencia.
  answer: B
  explanation: Al llegar a la glorieta, debe ceder el paso a peatones, bicicletas,
    camiones de carga (semitrucks) y al tráfico a su izquierda que ya se encuentra
    en la glorieta.
- id: 97
  category: safe_driving_rules
  question: ¿Qué debe hacer si un vehículo de emergencia con las sirenas encendidas
    entra en la glorieta mientras usted ya está conduciendo dentro de ella?
  choices:
    A: Detenerse inmediatamente dentro de la glorieta para dejarlos pasar.
    B: Acelerar y salir de la glorieta lo más rápido posible.
    C: Salir de manera segura en la siguiente derecha y luego hacerse a un lado.
    D: Hacerse a un lado hacia la izquierda de la isla central.
  answer: C
  explanation: Si ya se encuentra en la glorieta cuando entra un vehículo de emergencia,
    debe salir de manera segura en la siguiente derecha y luego hacerse a un lado.
    Debe evitar detenerse en la glorieta.
- id: 98
  category: safe_driving_rules
  question: ¿Por qué debe avanzar completamente hasta la línea blanca de parada en
    una rampa de entrada a la autopista con semáforo de control de acceso (metered
    ramp)?
  choices:
    A: Para permitir que pasen los vehículos que vienen detrás.
    B: Para que sus neumáticos activen los sensores en el pavimento.
    C: Para tener una mejor vista del tráfico de la autopista.
    D: Para evitar recibir una multa por bloquear el paso de peatones.
  answer: B
  explanation: En una rampa con semáforo de control, debe avanzar completamente hasta
    la línea blanca de parada para que sus neumáticos activen los sensores en el pavimento.
- id: 99
  category: signs_and_signals
  question: ¿Qué indica una flecha verde fija?
  choices:
    A: Puede girar en la dirección de la flecha y no debería haber tráfico en sentido
      contrario ni cruzado.
    B: Puede girar, pero primero debe ceder el paso al tráfico en sentido contrario.
    C: El carril está cambiando y debe incorporarse al siguiente carril.
    D: Solo puede seguir recto a través de la intersección.
  answer: A
  explanation: Una flecha verde fija significa que puede girar en la dirección de
    la flecha. No debería haber tráfico en sentido contrario ni cruzado mientras la
    flecha esté en verde.
- id: 100
  category: signs_and_signals
  question: ¿Qué significa una marca vial con una línea amarilla discontinua y otra
    continua?
  choices:
    A: Se permite rebasar para el tráfico en ambos lados de la carretera.
    B: Se prohíbe rebasar para el tráfico en ambos lados de la carretera.
    C: Puede rebasar si se encuentra en el lado de la línea discontinua, pero no si
      está en el lado de la línea continua.
    D: Puede rebasar si se encuentra en el lado de la línea continua, pero no si está
      en el lado de la línea discontinua.
  answer: C
  explanation: Las líneas amarillas discontinuas y continuas significan que puede
    rebasar si se encuentra en el lado de la línea discontinua. Si está en el lado
    de la línea continua, no puede rebasar.
- id: 101
  category: sharing_the_road
  question: Si está girando legalmente a través de un carril reservado y hay un ciclista
    en el carril, ¿qué debe hacer?
  choices:
    A: Acelerar para rebasar al ciclista antes de realizar el giro.
    B: Tocar la bocina para advertir al ciclista que se quite del camino.
    C: Situarse detrás del ciclista y realizar el giro una vez que sea seguro hacerlo.
    D: Detenerse en el carril de uso general y esperar a que el ciclista gire primero.
  answer: C
  explanation: El manual establece que si hay un ciclista en el carril reservado,
    debe situarse detrás de él y realizar el giro una vez que sea seguro hacerlo.
- id: 102
  category: safe_driving_rules
  question: ¿Qué debe hacer al acercarse a una rampa de entrada a la autopista con
    semáforo de control de acceso (metered) que tiene una señal roja?
  choices:
    A: Detenerse 10 pies detrás de la línea blanca.
    B: Avanzar completamente hasta la línea blanca de parada.
    C: Continuar sin detenerse si la autopista está despejada.
    D: Esperar a que el vehículo en el carril adyacente avance primero.
  answer: B
  explanation: El manual establece que debe avanzar completamente hasta la línea blanca
    de parada para que sus neumáticos activen los sensores en el pavimento.
- id: 103
  category: driver_responsibility
  question: Si un oficial de la ley lo detiene durante una parada de tráfico, ¿dónde
    debe colocar las manos?
  choices:
    A: En su regazo.
    B: Fuera de la ventana.
    C: En la parte superior del volante a la vista.
    D: En sus bolsillos o dentro de su chaqueta.
  answer: C
  explanation: Si lo detiene un oficial de la ley, debe poner las manos en la parte
    superior del volante a la vista y no realizar movimientos bruscos.
- id: 104
  category: defensive_driving
  question: ¿En qué momento del día están más activos los ciervos?
  choices:
    A: Desde el amanecer hasta el mediodía.
    B: Durante la parte más calurosa de la tarde.
    C: Desde el atardecer hasta el amanecer.
    D: Solo durante lluvia intensa o niebla.
  answer: C
  explanation: Según el manual, los ciervos están más activos en las horas comprendidas
    entre el atardecer y el amanecer.
- id: 105
  category: driver_responsibility
  question: Si atropella a un ciervo con su vehículo, ¿cuáles son las reglas con respecto
    a quedarse con el animal?
  choices:
    A: Es ilegal que cualquier persona se quede con el ciervo.
    B: Solo los oficiales de la ley o el control de animales pueden llevarse al ciervo.
    C: Usted puede quedárselo, o el siguiente automovilista puede quedárselo si usted
      no lo desea.
    D: Debe dejarlo a un lado de la carretera.
  answer: C
  explanation: 'El manual establece: ''Si atropella a un ciervo, puede quedárselo.
    Si no lo desea, el siguiente automovilista puede quedárselo''. También debe llamar
    a la policía para que puedan emitir una etiqueta (tag).'
- id: 106
  category: sharing_the_road
  question: ¿Qué se requiere de los vehículos que circulan en una línea de procesión
    funeraria?
  choices:
    A: Deben tener sus luces de emergencia (hazard lights) parpadeando en todo momento.
    B: Deben tener sus faros delanteros encendidos.
    C: Deben tocar la bocina al pasar por las intersecciones.
    D: Deben conducir al menos 15 mph por debajo del límite de velocidad indicado.
  answer: B
  explanation: El manual especifica que los vehículos en una línea de procesión funeraria
    deben tener sus faros delanteros encendidos, y otros conductores no deben interrumpir
    ni interferir con la línea.
- id: 107
  category: safe_driving_rules
  question: ¿Qué parte de la calzada es probable que se congele antes que el resto
    de la carretera en condiciones climáticas severas?
  choices:
    A: Intersecciones.
    B: Puentes y pasos elevados.
    C: Túneles.
    D: Arcenes de grava.
  answer: B
  explanation: Es importante recordar que, en condiciones climáticas severas, los
    puentes y pasos elevados se congelan antes que el resto de la calzada.
- id: 108
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo comienza a experimentar hidroplaneo (hydroplaning)?
  choices:
    A: Pisar los frenos a fondo inmediatamente.
    B: Girar el volante bruscamente hacia la derecha.
    C: Levantar suavemente el pie del acelerador y mantener el volante recto.
    D: Acelerar para atravesar el agua estancada.
  answer: C
  explanation: Si se encuentra derrapando o experimentando hidroplaneo, debe levantar
    suavemente el pie del acelerador, mantener el volante recto y no intentar detenerse
    ni girar hasta que sus neumáticos vuelvan a agarrarse a la carretera.
- id: 109
  category: defensive_driving
  question: ¿Hacia dónde debe girar el volante si su vehículo comienza a derrapar
    y pierde el control?
  choices:
    A: Gire el volante en la dirección opuesta al derrape.
    B: Gire el volante en la dirección a la que desea que vaya el vehículo.
    C: Mantenga el volante perfectamente recto.
    D: Gire el volante rápidamente de un lado a otro.
  answer: B
  explanation: Al derrapar, debe mantenerse alejado del freno, girar el volante en
    la dirección a la que desea que vaya el vehículo y volver a girarlo en la otra
    dirección tan pronto como el automóvil comience a enderezarse.
- id: 110
  category: sharing_the_road
  question: Al conducir en clima invernal, ¿cuánto espacio debe dar a los quitanieves
    cuando sus luces están parpadeando?
  choices:
    A: Al menos 50 pies.
    B: Al menos 100 pies.
    C: Al menos 200 pies.
    D: Al menos 500 pies.
  answer: C
  explanation: El manual aconseja dar a los quitanieves al menos 200 pies de espacio
    cuando sus luces parpadean en rojo, ámbar o verde.
- id: 111
  category: sharing_the_road
  question: ¿Por qué debe evitar tocar la bocina cuando se encuentre con ganado en
    la carretera o a lo largo de ella?
  choices:
    A: Es ilegal usar la bocina en zonas rurales.
    B: Podría asustar al animal.
    C: Hará que el agricultor detenga el equipo por completo.
    D: Viola las ordenanzas locales sobre ruidos.
  answer: B
  explanation: Al encontrarse con ganado, debe ceder el paso y no tocar la bocina
    porque esto podría asustar al animal.
- id: 112
  category: defensive_driving
  question: ¿Cómo puede advertir a los vehículos que vienen detrás de usted si ve
    un vehículo detenido a un lado de la carretera?
  choices:
    A: Encienda las luces altas.
    B: Toque la bocina dos veces.
    C: Presione el pedal del freno tres o cuatro veces suavemente.
    D: Desvíese ligeramente hacia el carril de al lado.
  answer: C
  explanation: Si ve un vehículo a un lado de la carretera, advierta a los demás vehículos
    que vienen detrás presionando el pedal del freno tres o cuatro veces suavemente.
- id: 113
  category: vehicle_information
  question: ¿Cuál es la forma correcta de utilizar el Sistema de Frenos Antibloqueo
    (ABS) en una emergencia?
  choices:
    A: Bombee los frenos suavemente hasta detenerse.
    B: Aplique una presión firme y continua al pedal del freno.
    C: Toque los frenos repetidamente para evitar que las ruedas se bloqueen.
    D: Presione el pedal del freno ligeramente y gire bruscamente.
  answer: B
  explanation: La forma correcta de usar el ABS en una emergencia es aplicar una presión
    firme y continua al pedal del freno hasta que el vehículo se haya detenido o el
    peligro haya pasado.
- id: 114
  category: driver_responsibility
  question: Debe reportar un choque a la policía si hay daños a la propiedad de al
    menos ¿qué cantidad?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: Debe reportar un choque a la policía si hay daños a la propiedad de
    $1,000 o más.
- id: 115
  category: driver_responsibility
  question: 'Se requiere que reporte un choque a la policía si causa daños a la propiedad
    del gobierno (como señales o barandillas) de al menos:'
  choices:
    A: $100
    B: $200
    C: $500
    D: $1,000
  answer: B
  explanation: Un choque debe reportarse a la policía si hay daños a la propiedad
    del gobierno de $200 o más.
- id: 116
  category: safe_driving_rules
  question: ¿Qué función del vehículo NO debe usar cuando conduce por carreteras invernales
    resbaladizas?
  choices:
    A: Faros delanteros
    B: Limpiaparabrisas
    C: Desempañador
    D: Control de crucero (cruise control)
  answer: D
  explanation: 'Los consejos de conducción en invierno del manual establecen explícitamente:
    ''No use el control de crucero (cruise control) en carreteras resbaladizas''.'
- id: 117
  category: defensive_driving
  question: Si experimenta el reventón de un neumático mientras conduce, ¿qué debe
    hacer primero?
  choices:
    A: Frenar bruscamente de inmediato
    B: Poner el coche en punto muerto (neutral)
    C: Sujetar el volante para mantener el vehículo en línea recta
    D: Bombear el pedal del freno varias veces
  answer: C
  explanation: Si tiene un reventón de neumático, debe sujetar el volante para mantener
    el vehículo en línea recta, levantar el pie del acelerador y reducir la velocidad
    poco a poco.
- id: 118
  category: defensive_driving
  question: ¿Cuál es la respuesta adecuada si el pedal del acelerador se queda atascado
    mientras conduce?
  choices:
    A: Mantenga la vista en la carretera y ponga el coche en punto muerto (neutral)
    B: Apague el motor inmediatamente mientras todavía está en el tráfico
    C: Tire del freno de mano con toda su fuerza
    D: Bombee el pedal del acelerador repetidamente hasta que se desatasque
  answer: A
  explanation: Si el pedal del acelerador se atasca, mantenga la vista en la carretera,
    ponga el coche en punto muerto (neutral), deténgase a un lado de la carretera
    cuando sea seguro y luego apague el motor.
- id: 119
  category: alcohol_drugs_health
  question: ¿Cuál es la concentración de alcohol legal permitida para conductores
    menores de 21 años?
  choices:
    A: 0.08%
    B: 0.04%
    C: 0.02%
    D: 0.00%
  answer: D
  explanation: La concentración de alcohol legal permitida para conductores menores
    de 21 años es del 0.00%. Esto significa que no puede tener nada de alcohol en
    su sistema mientras conduce un vehículo.
- id: 120
  category: penalties_and_points
  question: Bajo la Ley de Consentimiento Implícito (Implied Consent Law), ¿qué sucede
    si se niega a hacerse una prueba de concentración de alcohol prohibida (PAC)?
  choices:
    A: Se le dará una advertencia y se le permitirá conducir a casa
    B: Perderá sus privilegios de conducir durante al menos un año
    C: Recibirá 6 puntos de demérito en su licencia
    D: Se le requerirá tomar un examen de conducir escrito
  answer: B
  explanation: Si se niega a una prueba de PAC, el oficial debe arrestarlo por violación
    de la Ley de Consentimiento Implícito (Implied Consent Law), y perderá sus privilegios
    de conducir durante al menos un año.
- id: 121
  category: safe_driving_rules
  question: ¿Cuándo se les permite a los titulares de un permiso de instrucción y
    de una licencia probatoria usar un teléfono celular mientras conducen?
  choices:
    A: Al usar un dispositivo de manos libres
    B: Solo para reportar una emergencia
    C: Cuando están detenidos en un semáforo en rojo
    D: Al leer indicaciones del GPS
  answer: B
  explanation: Los titulares de permisos de instrucción y licencias probatorias solo
    pueden usar un teléfono celular para reportar una emergencia.
- id: 122
  category: sharing_the_road
  question: ¿Qué debe hacer si se aproxima a una patrulla de policía detenida a un
    lado de la carretera con las luces y sirenas encendidas?
  choices:
    A: Detenerse inmediatamente en su carril y esperar a que se retire
    B: Tocar la bocina para avisar que está pasando
    C: Cambiarse al carril que no esté más cerca del vehículo detenido o reducir la
      velocidad
    D: Aumentar la velocidad para pasar rápido por la escena
  answer: C
  explanation: Si ve una patrulla de policía detenida a un lado de la carretera con
    las luces y sirenas encendidas, cámbiese de carril o reduzca la velocidad; es
    la ley. Al acercarse a un vehículo de emergencia con las luces intermitentes,
    asegúrese de cambiarse al carril que no esté más cerca del vehículo detenido.
- id: 123
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene con sus luces rojas intermitentes,
    ¿a qué distancia debe detenerse?
  choices:
    A: Al menos 10 pies
    B: Al menos 15 pies
    C: Al menos 20 pies
    D: Al menos 50 pies
  answer: C
  explanation: Cuando un autobús escolar se detiene con sus luces rojas intermitentes,
    debe detenerse al menos a 20 pies de distancia.
- id: 124
  category: sharing_the_road
  question: ¿Bajo qué condición NO es obligatorio detenerse ante un autobús escolar
    con luces rojas intermitentes?
  choices:
    A: Cuando viaja en la misma dirección que el autobús en una carretera de varios
      carriles
    B: Cuando se encuentra en una carretera dividida y en el lado opuesto de la barrera
      con respecto al autobús
    C: Cuando llega tarde a una emergencia
    D: Cuando no hay niños visibles fuera del autobús
  answer: B
  explanation: Si se encuentra en una carretera o calzada dividida y no está en el
    mismo lado que el autobús escolar, no es necesario detenerse. Una carretera dividida
    tiene una barrera entre los carriles que van en direcciones opuestas.
- id: 125
  category: sharing_the_road
  question: ¿Cuánto espacio debe dejarle a un ciclista al rebasarlo?
  choices:
    A: Al menos un pie
    B: Al menos dos pies
    C: Al menos tres pies
    D: Al menos cinco pies
  answer: C
  explanation: Deje a los ciclistas al menos tres pies de espacio cuando los rebase.
- id: 126
  category: sharing_the_road
  question: ¿Qué es una "Zona Ciega" (No-Zone) al compartir la carretera con camiones
    grandes?
  choices:
    A: Un carril designado donde no se permite circular a los camiones
    B: Un área de unos 200 pies detrás y 20 pies delante de los camiones grandes donde
      no pueden verlo
    C: Una zona cerca de las escuelas donde los vehículos comerciales deben reducir
      la velocidad
    D: El área en una carretera dividida donde está prohibido rebasar
  answer: B
  explanation: Las Zonas Ciegas (No-Zones) son lugares donde los vehículos grandes
    no pueden verlo. Esta área se encuentra aproximadamente a 200 pies detrás y 20
    pies delante de los camiones grandes.
- id: 127
  category: penalties_and_points
  question: ¿Cuántos puntos de demérito en un período de 12 meses causarán que su
    privilegio de conducir sea suspendido o revocado?
  choices:
    A: 6 puntos o más
    B: 8 puntos o más
    C: 10 puntos o más
    D: 12 puntos o más
  answer: D
  explanation: No podrá conducir si acumula 12 o más puntos de demérito en cualquier
    período de 12 meses. Su privilegio de conducir será suspendido o revocado.
- id: 128
  category: penalties_and_points
  question: Si tiene una licencia probatoria, ¿qué sucede con sus puntos de demérito
    tras su segunda condena de tráfico?
  choices:
    A: Sus puntos se reducen a la mitad
    B: Sus puntos se duplican
    C: Sus puntos se borran si toma una clase de seguridad
    D: Sus puntos siguen siendo los mismos pero sus multas se duplican
  answer: B
  explanation: Si tiene una licencia probatoria, una tarjeta de identificación o ningún
    tipo de licencia, se le duplicarán los puntos. Estos puntos se duplican en la
    segunda condena y en cualquier otra posterior.
- id: 129
  category: penalties_and_points
  question: Un infractor de tráfico habitual es alguien que es condenado por cuatro
    o más infracciones de tráfico graves o 12 o más infracciones leves, ¿dentro de
    qué plazo?
  choices:
    A: Un año
    B: Tres años
    C: Cinco años
    D: Ten años
  answer: C
  explanation: Un infractor habitual es alguien que es condenado por cuatro o más
    infracciones de tráfico graves o 12 o más infracciones leves en un plazo de cinco
    años.
- id: 130
  category: license_system
  question: ¿Una licencia ocupacional le permite conducir hasta cuántas horas por
    semana para el trabajo, la escuela y el mantenimiento del hogar?
  choices:
    A: 20 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: D
  explanation: Una licencia ocupacional le permite conducir hasta 12 horas al día
    y hasta 60 horas a la semana para ir y volver del trabajo, la escuela y los lugares
    que necesite visitar para mantener su hogar.
- id: 131
  category: safe_driving_rules
  question: ¿Según la ley de Wisconsin, quién está obligado a usar el cinturón de
    seguridad en un vehículo?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero
    B: Solo los pasajeros menores de 18 años
    C: El conductor y todos los pasajeros de cualquier edad
    D: Solo los pasajeros en vehículos sin bolsas de aire (airbags)
  answer: C
  explanation: La ley de Wisconsin exige que usted y sus pasajeros usen cinturones
    de seguridad a cualquier edad.
- id: 132
  category: vehicle_information
  question: Si su vehículo está equipado con bolsas de aire (airbags), ¿aún necesita
    usar el cinturón de seguridad?
  choices:
    A: No, las bolsas de aire reemplazan la necesidad de usar cinturones de seguridad.
    B: Sí, aún necesita usar el cinturón de seguridad incluso si su vehículo tiene
      bolsas de aire.
    C: Solo si conduce por la autopista.
    D: Solo los pasajeros del asiento trasero deben usarlos.
  answer: B
  explanation: 'El manual establece: "Aún necesita usar el cinturón de seguridad incluso
    si su vehículo tiene bolsas de aire". Los cinturones de seguridad ayudan a mantenerlo
    en posición para controlar el vehículo y evitar lesiones.'
- id: 133
  category: safe_driving_rules
  question: ¿Cómo debe colocarse la correa de regazo de su cinturón de seguridad?
  choices:
    A: Holgada sobre los muslos
    B: Ajustada sobre el estómago
    C: Ajustada sobre los huesos de la cadera, justo debajo del estómago
    D: En la parte alta de la cintura
  answer: C
  explanation: La correa de regazo debe quedar ajustada sobre los huesos de la cadera,
    justo debajo del estómago.
- id: 134
  category: safe_driving_rules
  question: ¿Cuál es la forma correcta de usar el cinturón de hombro?
  choices:
    A: Debajo del brazo para mayor comodidad
    B: Cruzando el pecho con suficiente espacio para poner el puño entre el cinturón
      y el pecho
    C: Colgando holgadamente sobre el hombro
    D: Detrás de la espalda si le roza el cuello
  answer: B
  explanation: El cinturón de hombro debe usarse cruzando el pecho. Ajuste su cinturón
    de modo que pueda poner el puño entre el cinturón y su pecho. Nunca coloque el
    cinturón de hombro debajo del brazo.
- id: 135
  category: safe_driving_rules
  question: Generalmente, ¿a qué edad puede un niño pasar de un asiento de seguridad
    para niños a un asiento elevado (booster seat)?
  choices:
    A: Dos años
    B: Cuatro años
    C: Seis años
    D: Ocho años
  answer: B
  explanation: Generalmente, los niños deben estar en un asiento de seguridad para
    niños hasta que cumplan los cuatro años y en un asiento elevado (booster seat)
    hasta los ocho años.
- id: 136
  category: safe_driving_rules
  question: Generalmente, ¿hasta qué edad deben permanecer los niños en un asiento
    elevado (booster seat)?
  choices:
    A: Cuatro años
    B: Seis años
    C: Ocho años
    D: Diez años
  answer: C
  explanation: Generalmente, los niños deben estar en un asiento de seguridad para
    niños hasta que cumplan los cuatro años y en un asiento elevado (booster seat)
    hasta los ocho años.
- id: 137
  category: driver_responsibility
  question: ¿Qué tipo de seguro de automóvil se requiere para conducir en Wisconsin?
  choices:
    A: Seguro de cobertura total (comprehensive)
    B: Seguro de colisión
    C: Seguro de responsabilidad civil (liability) válido
    D: Solo cobertura para conductores sin seguro
  answer: C
  explanation: Debe tener un seguro de responsabilidad civil (liability) válido para
    conducir en Wisconsin y presentar un comprobante si un oficial de policía lo solicita.
- id: 138
  category: driver_responsibility
  question: Si conduce el automóvil de otra persona, ¿de quién es la responsabilidad
    de asegurarse de que el vehículo tenga seguro?
  choices:
    A: Responsabilidad del propietario del vehículo
    B: Su responsabilidad como conductor
    C: Responsabilidad de la compañía de seguros
    D: Responsabilidad del DMV
  answer: B
  explanation: Si conduce el automóvil de otra persona, es su deber asegurarse de
    que tenga seguro.
- id: 139
  category: license_system
  question: Si decide informar una discapacidad invisible al DMV, ¿quién tendrá acceso
    a esta información?
  choices:
    A: Solo su compañía de seguros
    B: El público en general
    C: Los oficiales de la ley y los empleados del WisDOT
    D: Solo los profesionales médicos
  answer: C
  explanation: La información que proporcione estará disponible para los oficiales
    de la ley y los empleados del Departamento de Transporte de Wisconsin (WisDOT).
- id: 140
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de edad y ciudadanía para iniciar el
    proceso de petición de una tarjeta de identificación gratuita para votar en Wisconsin?
  choices:
    A: 16 años de edad y ser ciudadano de los EE. UU.
    B: 17 años de edad y ser ciudadano de los EE. UU.
    C: 18 años de edad y ser ciudadano de los EE. UU.
    D: 18 años de edad y ser residente permanente
  answer: B
  explanation: Debe tener al menos 17 años de edad y ser ciudadano de los EE. UU.
    para iniciar el proceso de petición de una identificación gratuita para votar.
- id: 141
  category: driver_responsibility
  question: Si tiene 18 años o más y se registra para ser donante de órganos y tejidos,
    ¿quién puede anular su decisión?
  choices:
    A: Sus padres
    B: Su cónyuge
    C: Su médico
    D: Nadie puede anular su decisión
  answer: D
  explanation: Si tiene 18 años o más, su decisión de ser donante de órganos y tejidos
    no puede ser anulada por su familia ni por ninguna otra persona.
- id: 142
  category: vehicle_information
  question: ¿Cómo afecta la baja presión de aire en sus neumáticos a su vehículo?
  choices:
    A: Aumenta el rendimiento del combustible.
    B: Disminuye el rendimiento del combustible.
    C: Mejora la distancia de frenado.
    D: Evita el desgaste del motor.
  answer: B
  explanation: La baja presión de aire en los neumáticos disminuye el rendimiento
    del combustible.
- id: 143
  category: defensive_driving
  question: ¿Qué hábito de conducción ayuda a ahorrar combustible y proteger sus frenos?
  choices:
    A: Conducir con paradas y arranques frecuentes en tráfico pesado
    B: Reducir la velocidad poco a poco
    C: Frenar bruscamente en las intersecciones
    D: Conducir con baja presión en los neumáticos
  answer: B
  explanation: Cuando reduce la velocidad poco a poco, esto ayuda a ahorrar combustible
    y a cuidar sus frenos.
- id: 144
  category: license_system
  question: ¿Cuál es el propósito del Programa de Subvenciones para la Educación Vial
    (Driver Education Grant Program)?
  choices:
    A: Pagar la matrícula universitaria de los conductores seguros
    B: Proporcionar vehículos gratuitos a familias de bajos ingresos
    C: Pagar la capacitación de conductores en el aula y/o detrás del volante para
      adolescentes que califican por sus ingresos
    D: Reembolsar a los conductores las primas del seguro de automóvil
  answer: C
  explanation: El Programa de Subvenciones para la Educación Vial permite que los
    adolescentes que califican por sus ingresos reciban el pago del estado para su
    capacitación de conductores en el aula y/o detrás del volante.
- id: 145
  category: alcohol_drugs_health
  question: ¿Qué debe hacer si tiene un problema de salud que podría afectar su conducción?
  choices:
    A: Dejar de conducir por completo sin avisar a nadie.
    B: Informar la condición de salud al DMV.
    C: Decírselo únicamente a su compañía de seguros.
    D: Esperar hasta que expire su licencia para mencionarlo.
  answer: B
  explanation: Muchos problemas de salud pueden afectar su conducción. Debe informar
    al DMV sobre las condiciones de salud que podrían afectar su capacidad para conducir.
- id: 146
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en las zonas periféricas de ciudades
    y pueblos donde no hay un límite de velocidad señalizado?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: De acuerdo con el cuestionario de práctica del manual, el límite de
    velocidad máximo en las zonas periféricas de ciudades y pueblos sin un límite
    de velocidad señalizado es de 35 mph.
- id: 147
  category: driver_responsibility
  question: Si se ve involucrado en un accidente automovilístico grave, ¿cuál de las
    siguientes es una acción obligatoria?
  choices:
    A: Abandonar la escena inmediatamente
    B: Esperar a que el otro conductor pida ayuda
    C: Determinar si alguien está herido
    D: Mover los vehículos antes de verificar cómo están los pasajeros
  answer: C
  explanation: El manual establece que si se ve involucrado en un accidente automovilístico
    grave, debe detenerse, determinar si alguien está herido y llamar al 911.
- id: 148
  category: driver_responsibility
  question: ¿A qué número debe llamar si se ve involucrado en un accidente automovilístico
    grave?
  choices:
    A: '311'
    B: '411'
    C: '511'
    D: '911'
  answer: D
  explanation: Si se ve involucrado en un accidente automovilístico grave, el manual
    le indica que se detenga, verifique si hay heridos y llame al 911.
- id: 149
  category: safe_driving_rules
  question: Al girar a la izquierda en una intersección, ¿a quién debe cederle el
    paso?
  choices:
    A: Solo a los autos que están rebasando
    B: A los vehículos que vienen en sentido contrario que siguen recto o giran a
      la derecha
    C: A los vehículos que giran a la izquierda desde la dirección opuesta
    D: A nadie en particular
  answer: B
  explanation: Los conductores que giran a la izquierda deben ceder el paso a los
    vehículos que vienen en sentido contrario y que continúan recto o giran a la derecha.
- id: 150
  category: safe_driving_rules
  question: ¿Qué tipo de luces delanteras debe usar al conducir con niebla?
  choices:
    A: Luces altas (high beams)
    B: Luces bajas (low beams)
    C: Solo las luces de estacionamiento
    D: Luces de emergencia (hazards)
  answer: B
  explanation: Al conducir con niebla, lluvia intensa o nieve, debe utilizar las luces
    bajas (low beams).
- id: 151
  category: safe_driving_rules
  question: Si conduce bajo lluvia intensa o nieve, ¿qué luces es apropiado utilizar?
  choices:
    A: Luces bajas
    B: Luces altas
    C: Solo luces de conducción
    D: Luces interiores del techo
  answer: A
  explanation: Debe usar las luces bajas al conducir con niebla, lluvia intensa o
    nieve.
- id: 152
  category: signs_and_signals
  question: ¿Cómo debe reaccionar al acercarse a una intersección con una luz amarilla
    intermitente?
  choices:
    A: Esperar a que la luz cambie a verde
    B: Detenerse por completo antes de cruzar
    C: Aumentar la velocidad para despejar la intersección rápidamente
    D: Reducir la velocidad y proceder con precaución
  answer: D
  explanation: Al acercarse a una intersección con una luz amarilla intermitente,
    debe reducir la velocidad y proceder con precaución.
- id: 153
  category: signs_and_signals
  question: ¿Qué indica una sola línea amarilla discontinua que separa el tráfico?
  choices:
    A: Los carriles van en la misma dirección
    B: No se puede adelantar bajo ninguna circunstancia
    C: Puede adelantar si es seguro hacerlo y los carriles van en direcciones opuestas
    D: Debe detenerse antes de cruzar la línea
  answer: C
  explanation: Una sola línea amarilla discontinua significa que los carriles van
    en direcciones opuestas y usted puede adelantar si es seguro hacerlo.
- id: 154
  category: signs_and_signals
  question: ¿De qué color es la línea que separa el tráfico que se mueve en direcciones
    opuestas?
  choices:
    A: Blanco
    B: Amarillo
    C: Rojo
    D: Azul
  answer: B
  explanation: Una sola línea amarilla discontinua separa el tráfico donde los carriles
    van en direcciones opuestas.
- id: 155
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado para incorporarse a una autopista interestatal?
  choices:
    A: Detenerse siempre antes de entrar a la autopista
    B: Seleccionar un espacio seguro e incorporarse al carril de tráfico
    C: Incorporarse a través de dos carriles a la vez y aumentar la velocidad
    D: Forzar su entrada al tráfico para que otros conductores le cedan el paso
  answer: B
  explanation: Al incorporarse a una autopista interestatal, debe seleccionar un espacio
    seguro e incorporarse al carril de tráfico.
- id: 156
  category: safe_driving_rules
  question: ¿Bajo qué condiciones es aceptable conducir más rápido que el límite de
    velocidad establecido?
  choices:
    A: Si no ve ningún otro tráfico en su carril
    B: Siempre que existan condiciones seguras para hacerlo
    C: Al adelantar a otro vehículo
    D: Nunca
  answer: D
  explanation: Según el cuestionario de práctica del manual, nunca está bien conducir
    más rápido que el límite de velocidad establecido.
- id: 157
  category: defensive_driving
  question: ¿A qué distancia hacia adelante debe mirar en la carretera mientras conduce?
  choices:
    A: De 1 a 2 cuadras
    B: De 200 a 250 yardas
    C: De 10 a 15 segundos
    D: De 5 a 8 segundos
  answer: C
  explanation: Al conducir, debe mirar de 10 a 15 segundos hacia adelante en la carretera.
- id: 158
  category: sharing_the_road
  question: Si desea adelantar a una bicicleta pero se aproxima un vehículo en sentido
    contrario, ¿qué debe hacer?
  choices:
    A: Aumentar la velocidad para adelantar a la bicicleta antes de que el auto se
      acerque
    B: Tocar la bocina a la bicicleta para que se salga de la carretera
    C: Reducir la velocidad y dejar pasar al auto, luego adelantar a la bicicleta
    D: Orillarse a un lado de la carretera y detenerse por completo
  answer: C
  explanation: Si desea adelantar a una bicicleta y hay un vehículo en sentido contrario,
    debe reducir la velocidad y dejar pasar al auto, luego adelantar a la bicicleta.
- id: 159
  category: safe_driving_rules
  question: ¿Cuál es una práctica de seguridad recomendada al conducir de noche?
  choices:
    A: Usar siempre las luces altas
    B: Mirar directamente a los faros de los vehículos que vienen en sentido contrario
    C: Conducir más cerca del vehículo de adelante para ver sus luces traseras
    D: Aumentar su distancia de seguimiento
  answer: D
  explanation: Al conducir de noche, debe aumentar su distancia de seguimiento.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 160
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 161
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una calle de un solo sentido o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 162
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 163
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 164
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 165
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal de forma pentagonal (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 166
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces de vías férreas. Significa que debe ceder el paso a los trenes.
    Si se acerca un tren, debe detenerse.
  id: 167
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 168
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: Fin de la carretera
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 169
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel de estacionamiento para discapacitados o una placa de matrícula válida
    pueden estacionar en estos espacios. Las infracciones conllevan multas elevadas.
  id: 170
- id: 171
  category: driver_responsibility
  question: ¿Según la carta de presentación del manual, cuál es una responsabilidad
    clave de la Patrulla Estatal de Wisconsin (Wisconsin State Patrol)?
  choices:
    A: Diseñar e ingeniar autopistas más seguras.
    B: Emitir licencias de conducir y permisos de instrucción.
    C: Educar al público y hacer cumplir las leyes de tránsito.
    D: Proporcionar exámenes de práctica en línea para nuevos conductores.
  answer: C
  explanation: El manual establece que la 'Patrulla Estatal de Wisconsin educa al
    público sobre las reglas de la carretera y hace cumplir las leyes de tránsito
    de Wisconsin'.
- id: 172
  category: driver_responsibility
  question: El manual enumera varios lugares comunes donde puede ocurrir la trata
    de personas. ¿Cuál de los siguientes lugares se menciona específicamente?
  choices:
    A: Bibliotecas públicas
    B: Cines
    C: Centros comerciales
    D: Paradas de camiones
  answer: D
  explanation: El manual indica que la trata de personas puede ocurrir en lugares
    que incluyen 'hoteles y moteles, paradas de camiones, áreas de descanso, casinos,
    restaurantes, salones de uñas, granjas y más'.
- id: 173
  category: safe_driving_rules
  question: ¿Según el Índice, cuál de los siguientes temas se trata en la Sección
    8, 'Manejo de emergencias'?
  choices:
    A: Conducir con sueño
    B: Emergencias en la carretera
    C: Rotondas
    D: Conducción en invierno
  answer: B
  explanation: El Índice muestra que la Sección 8, 'Manejo de emergencias', incluye
    el tema 'Emergencias en la carretera'.
- id: 174
  category: safe_driving_rules
  question: Según el Índice, ¿qué sección del manual consultaría para obtener información
    sobre la conducción en condiciones climáticas severas?
  choices:
    A: 'Sección 3: Conceptos básicos'
    B: 'Sección 5: Señales, marcas en el pavimento y control de carriles'
    C: 'Sección 7: Condiciones de conducción'
    D: 'Sección 9: Comportamientos de conducción peligrosos'
  answer: C
  explanation: El Índice enumera 'Clima severo' como un tema bajo la Sección 7, 'Condiciones
    de conducción'.
- id: 175
  category: driver_responsibility
  question: ¿Cuál es el número de teléfono de la Línea Nacional Directa contra la
    Trata de Personas que se proporciona en el manual?
  choices:
    A: '911'
    B: 1-800-SAFE-RIDE
    C: 1-888-3737-888
    D: '511'
  answer: C
  explanation: El manual proporciona el número de la Línea Nacional Directa contra
    la Trata de Personas como 1-888-3737-888 para quienes necesiten ayuda o deseen
    reportar una pista.
- id: 176
  category: signs_and_signals
  question: El Índice indica que la información sobre el Intercambio de Diamante Divergente
    (DDI) se puede encontrar en ¿qué sección?
  choices:
    A: 'Sección 3: Conceptos básicos'
    B: 'Sección 4: Señales'
    C: 'Sección 6: Situaciones de conducción'
    D: 'Sección 8: Manejo de emergencias'
  answer: C
  explanation: 'El Índice enumera ''Intercambio de Diamante Divergente (DDI)'' bajo
    la Sección 6: Situaciones de conducción.'
- id: 177
  category: alcohol_drugs_health
  question: ¿En qué sección del manual encontraría información específicamente sobre
    los peligros de conducir con sueño?
  choices:
    A: 'Sección 1: Requisitos del examen de conducir'
    B: 'Sección 7: Condiciones de conducción'
    C: 'Sección 8: Manejo de emergencias'
    D: 'Sección 9: Comportamientos de conducción peligrosos'
  answer: D
  explanation: 'El Índice muestra que ''Conducir con sueño'' es una subsección dentro
    de la Sección 9: Comportamientos de conducción peligrosos.'
- id: 178
  category: safe_driving_rules
  question: La carta de presentación del Administrador del DMV enumera varios comportamientos
    clave para una conducción segura. ¿Cuál de las siguientes es una de las recomendaciones
    enumeradas?
  choices:
    A: Conducir siempre por el carril de la extrema derecha.
    B: Evitar conducir durante las horas pico.
    C: Eliminar las distracciones y concentrarse en el vehículo.
    D: Revisar la presión de los neumáticos antes de cada viaje.
  answer: C
  explanation: La carta de presentación del manual aconseja a los nuevos conductores
    'Eliminar las distracciones y concentrarse en operar el vehículo de manera segura'.
- id: 179
  category: driver_responsibility
  question: El manual proporciona un recurso para aprender sobre la seguridad en línea
    para prevenir la trata de personas. ¿Cuál es el sitio web mencionado para estos
    consejos?
  choices:
    A: wisconsindmv.gov
    B: tatnonprofit.org/youth
    C: love146.org/online-safety
    D: KnowToDrive.com/Wisconsin
  answer: C
  explanation: Para aprender consejos sobre cómo mantenerse seguro en línea frente
    a los traficantes, el manual dirige a los lectores a love146.org/online-safety.
- id: 180
  category: sharing_the_road
  question: ¿Según el Índice, en qué parte del manual se encuentra la información
    sobre las reglas para conducir cerca de autobuses escolares?
  choices:
    A: 'Sección 3: Conceptos básicos'
    B: 'Sección 6: Situaciones de conducción'
    C: 'Sección 10: Compartir la carretera'
    D: 'Sección 4: Señales'
  answer: C
  explanation: 'El Índice enumera ''Autobuses escolares'' como un tema bajo la Sección
    10: Compartir la carretera.'
- id: 181
  category: driver_responsibility
  question: ¿Cómo define el Manual del Conductor de Wisconsin la trata de personas?
  choices:
    A: El acto de cruzar ilegalmente las fronteras estatales.
    B: Conducir sin una licencia válida o seguro.
    C: Manipular a alguien para que trabaje o realice actos sexuales por dinero.
    D: Transportar a sabiendas a personas indocumentadas.
  answer: C
  explanation: El manual define la trata de personas como cuando 'una persona manipula
    o se aprovecha de otra para que trabaje para ella o realice actos sexuales por
    dinero'.
- id: 182
  category: signs_and_signals
  question: Si desea revisar el significado de los diferentes tipos de marcas viales
    en la carretera, ¿qué sección del manual debe consultar?
  choices:
    A: 'Sección 3: Conceptos básicos'
    B: 'Sección 4: Señales'
    C: 'Sección 5: Señales, marcas en el pavimento y controles de carril'
    D: 'Sección 7: Condiciones de conducción'
  answer: C
  explanation: El índice indica que la Sección 5 cubre 'Señales, marcas en el pavimento
    y controles de carril', lo cual incluye los tipos de marcas viales.
- id: 183
  category: signs_and_signals
  question: Según el índice, ¿cuál de las siguientes NO es una categoría de señal
    analizada en la Sección 4?
  choices:
    A: Reglamentaria
    B: De servicio
    C: Zona escolar
    D: De destino
  answer: C
  explanation: El índice de la Sección 4 enumera señales de Advertencia, Reglamentarias,
    de Construcción, de Destino, de Servicio, de Marcador de Milla, de Número de Ruta
    y de Cruce de Ferrocarril. 'Zona escolar' es un tipo de señal, pero no figura
    como una categoría principal en esta sección.
- id: 184
  category: driver_testing
  question: Para los conductores de 15 a 17 años, la portada del manual promueve realizar
    el examen de conocimientos en casa. ¿Qué sitio web se proporciona para este propósito?
  choices:
    A: wisconsindmv.gov
    B: KnowToDrive.com/Wisconsin
    C: love146.org/online-safety
    D: tatnonprofit.org/youth
  answer: B
  explanation: La portada del manual dirige a los jóvenes de 15 a 17 años a KnowToDrive.com/Wisconsin
    para obtener más información sobre cómo realizar el examen de conocimientos en
    casa.
- id: 185
  category: driver_responsibility
  question: El manual describe un compromiso de seguridad de tres partes del Departamento
    de Transporte de Wisconsin. Además del DMV y la Patrulla Estatal de Wisconsin,
    ¿cuál es el tercer componente mencionado?
  choices:
    A: Los departamentos del sheriff del condado que hacen cumplir las ordenanzas
      locales.
    B: Escuelas de educación vial que brindan capacitación al volante.
    C: La ingeniería de carreteras mediante un enfoque de Sistema Seguro (Safe System).
    D: El sistema judicial que penaliza a los conductores imprudentes.
  answer: C
  explanation: La carta del Administrador del DMV establece que la seguridad se logra
    a través del DMV, la Patrulla Estatal y el hecho de que 'las carreteras de Wisconsin
    se diseñan mediante un enfoque estratégico de Sistema Seguro (Safe System) para
    la seguridad vial'.
- id: 186
  category: sharing_the_road
  question: Según el índice, ¿dónde encontraría información sobre seguridad agrícola
    y conducción rural?
  choices:
    A: 'Sección 3: Conceptos básicos'
    B: 'Sección 10: Compartir la carretera'
    C: 'Sección 8: Manejo de emergencias'
    D: 'Sección 7: Condiciones de conducción'
  answer: D
  explanation: El índice enumera 'Seguridad agrícola/Conducción rural' como un tema
    bajo la Sección 7, 'Condiciones de conducción'.
- id: 187
  category: driver_testing
  question: ¿Aproximadamente cuánto tiempo debe prever para completar el examen de
    conocimientos de Wisconsin en un centro de atención al cliente del DMV?
  choices:
    A: 15 minutos
    B: 30 minutos
    C: 45 minutos
    D: 60 minutos
  answer: C
  explanation: 'La Sección 1, Parte C establece: ''Este examen tardará unos 45 minutos
    en completarse''.'
- id: 188
  category: driver_testing
  question: ¿Cuál es el porcentaje mínimo de preguntas que debe responder correctamente
    para aprobar tanto el Examen de Señales de Carretera como el Examen de Conocimientos?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 90%
  answer: C
  explanation: La Sección 1 establece que debe responder correctamente 12 de 15 preguntas
    (80%) en el examen de señales y 40 de 50 preguntas (80%) en el examen de conocimientos.
- id: 189
  category: driver_testing
  question: Durante el examen de habilidades, el examinador del DMV evaluará su capacidad
    para realizar maniobras específicas. ¿Cuál de las siguientes figura como una maniobra
    requerida?
  choices:
    A: Giro de tres puntos
    B: Giro en Y (Y-turn)
    C: Estacionamiento en paralelo en una colina
    D: Frenado de emergencia
  answer: B
  explanation: La Sección 1, Parte D enumera las maniobras evaluadas, incluyendo 'un
    giro en Y (Y-turn), parada/arranque al lado de la carretera y estacionamiento'.
- id: 190
  category: license_system
  question: Al presentar documentos al DMV para solicitar una licencia de conducir,
    ¿cuál es un requisito clave para todos los artículos?
  choices:
    A: Pueden ser fotocopias si el original no está disponible.
    B: Deben ser originales o copias certificadas, y no estar vencidos.
    C: Pueden estar vencidos hasta por 30 días.
    D: Solo el comprobante de residencia debe ser original.
  answer: B
  explanation: 'La Sección 2 establece: ''Todos los artículos anteriores deben ser
    válidos; no se aceptan fotocopias y no deben estar vencidos''.'
- id: 191
  category: license_system
  question: Según el manual, ¿cuál de los siguientes es un documento aceptable para
    demostrar su identidad?
  choices:
    A: Una tarjeta de identificación de estudiante de su escuela.
    B: Una tarjeta de crédito con su nombre.
    C: Una tarjeta del Seguro Social con su firma.
    D: Una factura de servicios públicos a su nombre.
  answer: C
  explanation: La Sección 2 enumera la 'tarjeta del Seguro Social con su firma o una
    tarjeta de identificación emitida por el estado con su fotografía' como ejemplos
    de prueba de identidad.
- id: 192
  category: driver_responsibility
  question: Además de aceptar la responsabilidad legal y financiera, ¿qué más debe
    verificar un patrocinador adulto para un conductor menor de 18 años?
  choices:
    A: Que el menor tenga su propio seguro de automóvil.
    B: Que el menor tenga un promedio de calificaciones (GPA) de 2.0 o superior.
    C: Que el menor esté inscrito en un programa escolar y no sea un ausente escolar
      habitual.
    D: Que el menor haya completado un curso de primeros auxilios.
  answer: C
  explanation: La Sección 2, Parte A establece que el patrocinador 'firmará y verificará
    que la persona menor de 18 años de edad esté inscrita en un programa escolar y
    no sea un ausente escolar habitual'.
- id: 193
  category: driver_responsibility
  question: ¿Qué establece el manual con respecto a la capacidad de un patrocinador
    para retirar su patrocinio a un conductor menor de edad?
  choices:
    A: El patrocinio solo puede retirarse si el menor recibe una multa de tráfico.
    B: El patrocinio puede retirarse en cualquier momento.
    C: El patrocinio solo puede retirarse con una orden judicial.
    D: El patrocinio es permanente hasta que el conductor cumpla 18 años.
  answer: B
  explanation: 'La Sección 2, Parte A establece: ''El patrocinador puede retirar su
    patrocinio en cualquier momento''.'
- id: 194
  category: driver_responsibility
  question: Si un solicitante adolescente menor de 18 años no vive con un padre o
    tutor legal, ¿quién tiene permitido firmar como patrocinador?
  choices:
    A: Un amigo cercano de la familia mayor de 25 años.
    B: Un maestro o el director de la escuela.
    C: Un hermano o hermana que tenga 18 años de edad o más.
    D: Un conductor con licencia que conozca al solicitante desde hace 5 años.
  answer: C
  explanation: La Sección 2, Parte A enumera a un 'hermano de 18 años de edad o más'
    como un posible patrocinador si el solicitante adolescente no vive con un padre
    o tutor legal.
- id: 195
  category: driver_testing
  question: Si no aprueba el examen de la vista en el DMV, se le remitirá a un especialista
    de la vista con ¿qué formulario específico?
  choices:
    A: Informe de Visión MV2020
    B: Certificado de Examen de la Vista por una Autoridad Competente (MV3030V/T579)
    C: Certificado de Salud Visual del Conductor (DVHC-1)
    D: Informe de Examen Médico (MV3030B)
  answer: B
  explanation: La Sección 1, Parte A especifica que si no aprueba el examen de la
    vista, se le entregará el 'Certificado de Examen de la Vista por una Autoridad
    Competente (MV3030V/T579)' para que lo lleve a un especialista de la vista.
- id: 196
  category: driver_testing
  question: ¿Cuántas preguntas hay en total en el examen de conocimientos para la
    licencia de conducir de Wisconsin?
  choices:
    A: '25'
    B: '40'
    C: '50'
    D: '75'
  answer: C
  explanation: 'La Sección 1, Parte C establece: ''El examen de conocimientos incluirá
    50 preguntas''.'
- id: 197
  category: driver_testing
  question: Antes de que comience su examen de habilidades, el examinador del DMV
    realizará una inspección de seguridad en su vehículo. ¿Cuál de los siguientes
    elementos será revisado?
  choices:
    A: Profundidad de la banda de rodadura y presión de aire de los neumáticos
    B: Niveles de aceite del motor y refrigerante
    C: Radio y aire acondicionado
    D: Bocina, luces y espejos
  answer: D
  explanation: La Sección 1, Parte D establece que el examinador revisará la 'bocina,
    luces/señales, placas de matrícula, puertas, espejos y más'.
- id: 198
  category: license_system
  question: ¿Cuál de los siguientes se enumera como un ejemplo aceptable de un documento
    que demuestre que vive en Wisconsin?
  choices:
    A: Una carta de un amigo
    B: Una tarjeta de biblioteca
    C: Un cheque personal con su dirección
    D: Una factura de servicios públicos con su nombre y dirección
  answer: D
  explanation: La Sección 2 ofrece 'Factura de servicios públicos o estado de cuenta
    financiero con su nombre y dirección de WI' como ejemplos para demostrar que vive
    en Wisconsin.
- id: 199
  category: driver_responsibility
  question: Para un conductor menor de 18 años, ¿durante cuánto tiempo se requiere
    un patrocinador adulto?
  choices:
    A: Solo durante la fase del permiso de instrucción.
    B: Hasta que el conductor complete 50 horas de práctica.
    C: Durante la fase de prueba (probatoria) hasta que el conductor cumpla 18 años.
    D: Durante los primeros seis meses de la licencia de prueba.
  answer: C
  explanation: 'La Sección 2, Parte A establece: ''Seguirá necesitando un patrocinador
    durante su fase de prueba hasta que cumpla 18 años''.'
- id: 200
  category: penalties_and_points
  question: Según el Índice de contenidos, ¿qué sección del manual contiene información
    sobre el Sistema de Puntos para conductores de Wisconsin?
  choices:
    A: 'Sección 9: Comportamientos de conducción peligrosos'
    B: 'Sección 11: Su privilegio de conducir'
    C: 'Sección 12: Otra información importante'
    D: 'Sección 2: Progresión de las licencias'
  answer: B
  explanation: 'El Índice de contenidos muestra que la ''Sección 11: Su privilegio
    de conducir'' contiene la subsección ''A. Sistema de puntos''.'
- id: 201
  category: vehicle_information
  question: ¿Basándose en el Índice, dónde encontraría información sobre los Requisitos
    Mínimos de Seguro para conductores en Wisconsin?
  choices:
    A: 'Sección 12: Otra información importante'
    B: 'Sección 10: Compartir la carretera'
    C: 'Sección 11: Su privilegio de conducir'
    D: 'Sección 1: Requisitos del examen de conducir'
  answer: A
  explanation: 'El Índice enumera ''E. Requisitos de seguro'' bajo la ''Sección 12:
    Otra información importante''.'
- id: 202
  category: driver_testing
  question: ¿Qué tipo de instrucciones debe esperar del examinador del DMV durante
    su examen de habilidades?
  choices:
    A: Preguntas con trampa para poner a prueba su atención
    B: Instrucciones vagas para ver cómo reacciona
    C: Comandos simples y directos como 'gire a la izquierda' o 'haga un giro en Y'
      (Y-Turn)
    D: Una lista completa de todas las maniobras antes de que comience el examen
  answer: C
  explanation: 'La Sección 1, Parte D establece: ''El examinador del DMV le dará instrucciones
    como: “En la próxima intersección, gire a la izquierda” o “Haga un giro en Y”
    (Y-Turn)''.'
- id: 203
  category: license_system
  question: Si el titular de un permiso de instrucción menor de 18 años conduce con
    una persona que no es un instructor calificado, padre, tutor o cónyuge, ¿cuál
    es la edad mínima para esa persona acompañante?
  choices:
    A: '19'
    B: '21'
    C: '25'
    D: '18'
  answer: B
  explanation: El manual establece que la persona acompañante puede ser 'Una persona
    de 21 años de edad o más. Si el titular del permiso es menor de 18 años, se requiere
    que la persona con licencia que lo acompaña tenga una autorización por escrito
    del padre o tutor del menor...'
- id: 204
  category: license_system
  question: Bajo las restricciones de la Licencia de Conducir Graduada (GDL), ¿cuántas
    personas que NO sean familiares inmediatos pueden viajar con usted entre las 5
    a.m. y la medianoche?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cero
  answer: A
  explanation: El manual establece que de 5 a.m. a medianoche, un titular de GDL puede
    conducir con 'una persona adicional' además de los familiares inmediatos o un
    conductor acompañante calificado.
- id: 205
  category: license_system
  question: ¿A partir de qué fecha se requerirá una tarjeta que cumpla con REAL ID
    (u otra forma de identificación aceptable) para volar dentro de los EE. UU. o
    visitar una base militar?
  choices:
    A: 1 de enero de 2025
    B: 7 de mayo de 2025
    C: 4 de julio de 2026
    D: 31 de diciembre de 2024
  answer: B
  explanation: Según el manual, 'se le requerirá mostrar una identificación que cumpla
    con REAL ID... a partir del 7 de mayo de 2025'.
- id: 206
  category: penalties_and_points
  question: Para el titular de una licencia probatoria, ¿qué sucede con los puntos
    de demérito por una segunda o futura condena por infracción de tráfico en movimiento?
  choices:
    A: Se reducen a la mitad
    B: Permanecen igual
    C: Se duplican
    D: Se perdonan
  answer: C
  explanation: 'El manual establece: ''Las restricciones son similares a las del permiso,
    ya que los puntos en la segunda o futuras condenas se duplican''.'
- id: 207
  category: driver_testing
  question: Para obtener una licencia probatoria, un conductor menor de 18 años debe
    completar un mínimo de ¿cuántas horas de conducción supervisada durante las horas
    de oscuridad?
  choices:
    A: 5 horas
    B: 10 horas
    C: 20 horas
    D: 40 horas
  answer: B
  explanation: El manual requiere un total de 50 horas de práctica, '10 de las cuales
    deben ser durante las horas de oscuridad'.
- id: 208
  category: license_system
  question: ¿Cuál es el tiempo máximo de antelación a su fecha de vencimiento con
    el que puede renovar una licencia de conducir regular de Wisconsin?
  choices:
    A: 60 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: 'El manual establece: ''Puede renovar su licencia hasta con un año
    de antelación a la fecha de vencimiento''.'
- id: 209
  category: license_system
  question: Si se muda a Wisconsin y la licencia de conducir de su estado anterior
    es una REAL ID, ¿qué debe hacer para obtener una REAL ID de Wisconsin?
  choices:
    A: Su estado de REAL ID se transfiere automáticamente.
    B: Solo necesita mostrar su antigua tarjeta REAL ID.
    C: Debe presentar todos los documentos aceptables nuevamente en Wisconsin.
    D: Debe esperar 60 días antes de solicitarla.
  answer: C
  explanation: 'Cuando se pregunta si una REAL ID de otro estado se transferirá, el
    manual responde: ''No. Deberá presentar todos los documentos aceptables en Wisconsin''.'
- id: 210
  category: license_system
  question: Si usted es titular de un permiso de instrucción y tiene al menos 16 años,
    ¿bajo qué condición puede una persona adicional viajar en un asiento que no sea
    el delantero?
  choices:
    A: La persona es un familiar inmediato.
    B: La persona también es un instructor calificado.
    C: La persona tiene licencia, 25 años o más, con al menos 2 años de experiencia.
    D: Nunca se permiten pasajeros adicionales.
  answer: C
  explanation: 'El manual señala: ''Si tiene al menos 16 años de edad, además del
    conductor acompañante con licencia, otra persona con licencia de 25 años de edad
    o más con al menos 2 años de experiencia de conducción puede ocupar un asiento
    en el vehículo que no sea el asiento delantero''.'
- id: 211
  category: driver_testing
  question: Si es menor de 18 años y está inscrito en un programa de educación vial,
    ¿qué formulario firmado debe proporcionar su escuela de práctica de manejo antes
    de que pueda solicitar un permiso de instrucción?
  choices:
    A: Una boleta de calificaciones escolar
    B: Un certificado de finalización
    C: Solicitud de Licencia de Conducir de Wisconsin (DL) MV3001
    D: Un formulario de consentimiento de los padres MV2002
  answer: C
  explanation: 'El manual establece: ''Su escuela de práctica de manejo le proporcionará
    una Solicitud de Licencia de Conducir de Wisconsin (DL) MV3001 firmada. Debe tener
    este documento completado antes de solicitar su permiso de instrucción''.'
- id: 212
  category: license_system
  question: ¿Mientras conduce con una licencia probatoria entre las 5 a.m. y la medianoche,
    cuántos miembros de su familia inmediata pueden viajar con usted?
  choices:
    A: Solo uno
    B: Solo sus padres
    C: Cualquier número
    D: Dos, si uno es un padre
  answer: C
  explanation: El manual especifica que de 5 a.m. a medianoche, 'Cualquier número
    de miembros de la familia inmediata puede viajar' con el titular de una licencia
    de conducir graduada (GDL).
- id: 213
  category: license_system
  question: ¿Cuál es la edad mínima para un instructor calificado que acompaña al
    titular de un permiso de instrucción?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: B
  explanation: 'La persona en el asiento del pasajero debe ser una de las siguientes:
    ''Un instructor calificado de 19 años o más...'''
- id: 214
  category: driver_testing
  question: Para calificar para una licencia probatoria, un menor debe completar un
    mínimo de 50 horas totales de conducción supervisada. ¿Cuántas de esas horas deben
    ser durante el día?
  choices:
    A: 10 horas
    B: 25 horas
    C: 40 horas
    D: 50 horas
  answer: C
  explanation: El manual requiere que un conductor 'practique la conducción durante
    al menos 40 horas durante el día y 10 horas durante la noche (50 horas en total)'.
- id: 215
  category: license_system
  question: ¿Cuánto tiempo antes de su cumpleaños en el año de vencimiento de su licencia
    le enviará el DMV un aviso de recordatorio de renovación para su licencia de conducir
    regular?
  choices:
    A: 10 a 20 días
    B: 30 días
    C: 45 a 60 días
    D: 90 días
  answer: C
  explanation: 'El manual establece: ''Recibirá un aviso de recordatorio de renovación
    entre 45 y 60 días antes de su cumpleaños en el año en que vence su licencia de
    conducir''.'
- id: 216
  category: driver_testing
  question: ¿Cuál es el nombre de la aplicación móvil mencionada en el manual que
    un patrocinador puede usar para realizar un seguimiento de las horas de práctica
    de un estudiante de conducción?
  choices:
    A: DMV Drive
    B: RoadReady
    C: WI Practice Log
    D: GDL Tracker
  answer: B
  explanation: El manual sugiere que un patrocinador puede imprimir un registro de
    conducción 'o puede descargar nuestra aplicación móvil RoadReady'.
- id: 217
  category: driver_testing
  question: Para obtener un permiso de instrucción, ¿qué debe hacer una persona de
    18 años o más?
  choices:
    A: Inscribirse en un programa de educación vial.
    B: Aprobar el examen de conocimientos, el examen de señales y el examen de la
      vista.
    C: Completar primero 50 horas de conducción supervisada.
    D: Hacer que un patrocinador firme su solicitud.
  answer: B
  explanation: 'El manual establece: ''Si tiene 18 años o más, puede comenzar aprobando
    el examen de conocimientos, el examen de señales de tránsito y el examen de la
    vista''. A diferencia de los menores, no se les exige estar inscritos en un programa
    de educación vial.'
- id: 218
  category: license_system
  question: A partir del 7 de mayo de 2025, ¿qué tipo de identificación se requerirá
    para volar dentro de los EE. UU. o visitar edificios federales?
  choices:
    A: Cualquier licencia de conducir estatal válida
    B: Una licencia de conducir con foto
    C: Una licencia que cumpla con REAL ID u otra forma aceptable, como un pasaporte
    D: Un certificado de registro del vehículo
  answer: C
  explanation: El manual establece que a partir del 7 de mayo de 2025, se le requerirá
    mostrar una identificación que cumpla con REAL ID (o mostrar otra forma de identificación
    aceptable, como un pasaporte) para volar dentro de los EE. UU. o visitar edificios
    federales.
- id: 219
  category: driver_responsibility
  question: Además de su licencia de conducir, ¿qué otros dos documentos debe asegurarse
    de tener en su vehículo antes de conducir?
  choices:
    A: Título del vehículo y manual del propietario
    B: Comprobante de seguro y registro del vehículo
    C: Certificado de nacimiento y tarjeta de seguro social
    D: Su último informe de inspección del vehículo y un mapa
  answer: B
  explanation: La Sección 3 establece que antes de conducir, debe asegurarse de tener
    su licencia de conducir válida, comprobante de seguro y registro del vehículo.
- id: 220
  category: safe_driving_rules
  question: Al usar la 'Regla de los cuatro segundos de distancia de seguimiento',
    usted llega al objeto estacionario seleccionado antes de terminar de contar 'mil
    cuatro'. ¿Qué indica esto?
  choices:
    A: Está conduciendo demasiado lento para las condiciones.
    B: Está siguiendo a una distancia segura.
    C: El vehículo delante de usted ha disminuido la velocidad inesperadamente.
    D: Va demasiado rápido o sigue demasiado de cerca.
  answer: D
  explanation: El manual explica que si llega al objeto antes de terminar de decir
    'mil cuatro', va demasiado rápido.
- id: 221
  category: safe_driving_rules
  question: De acuerdo con la 'Regla de los cuatro segundos de distancia de seguimiento',
    ¿qué ajuste debe hacer en condiciones adversas como lluvia o nieve?
  choices:
    A: Disminuir la cuenta a dos segundos.
    B: Mantener la cuenta de cuatro segundos independientemente de las condiciones.
    C: Añadir un segundo por cada condición adversa.
    D: Utilizar la regla solo cuando el clima sea perfecto.
  answer: C
  explanation: El manual establece que se debe 'Añadir un segundo por cada condición
    adversa, como tráfico pesado, lluvia, nieve y/o hielo' al utilizar la regla de
    distancia de seguimiento.
- id: 222
  category: safe_driving_rules
  question: En una carretera de varios carriles, si conduce más lento que la mayoría
    del tráfico, ¿qué carril debe utilizar?
  choices:
    A: El carril del extremo izquierdo
    B: El carril central
    C: El carril del extremo derecho
    D: Cualquier carril es aceptable
  answer: C
  explanation: 'El manual aconseja: ''Conduzca en el carril del extremo derecho de
    una carretera de varios carriles si conduce más lento que la mayoría del tráfico''.'
- id: 223
  category: penalties_and_points
  question: Además del exceso de velocidad, ¿qué otros dos comportamientos al conducir
    se mencionan explícitamente en el manual como ilegales?
  choices:
    A: Conducir en punto muerto y seguir muy de cerca (tailgating)
    B: Competir en carreras y conducir de manera temeraria
    C: Conducir demasiado lento y no usar las luces de giro
    D: Incorporarse demasiado rápido y cambiar de carril con frecuencia
  answer: B
  explanation: 'El texto establece: ''Competir en carreras y conducir de manera temeraria
    no están permitidos y son ilegales''.'
- id: 224
  category: safe_driving_rules
  question: Cuando se incorpora al tráfico, debe intentar entrar a la misma velocidad
    que el tráfico para evitar ¿qué?
  choices:
    A: Recibir una multa por exceso de velocidad
    B: Consumir demasiado combustible
    C: Obligar a otro conductor a cambiar de velocidad o dirección
    D: Pasarse de su salida
  answer: C
  explanation: 'El manual establece: ''Evite obligar a otro conductor a cambiar de
    velocidad o dirección debido a su incorporación''.'
- id: 225
  category: vehicle_information
  question: ¿Cuál es la función principal de un carril de deceleración, también conocido
    como rampa de salida?
  choices:
    A: Permitir que los vehículos aceleren antes de entrar en una autopista.
    B: Proporcionar un espacio para el estacionamiento de emergencia.
    C: Permitir que el tráfico disminuya la velocidad gradualmente al salir de una
      vía de alta velocidad.
    D: Servir como carril para dar la vuelta en U en una autopista.
  answer: C
  explanation: El manual explica que 'En el carril de deceleración (rampa de salida)
    el tráfico disminuye la velocidad; aquí es donde usted también reducirá la velocidad
    gradualmente'.
- id: 226
  category: signs_and_signals
  question: El manual define una intersección como el lugar donde se cruzan dos puntos.
    ¿Cuál de los siguientes se enumera como un ejemplo de intersección?
  choices:
    A: Una curva cerrada en la carretera
    B: Una entrada particular (driveway) o la entrada a un estacionamiento
    C: Un puente o paso elevado
    D: Un área de descanso designada
  answer: B
  explanation: 'La Sección 3 define las intersecciones y establece: ''Esto incluye
    calles transversales, entradas particulares, entradas a estacionamientos y cruces
    ferroviarios''.'
- id: 227
  category: defensive_driving
  question: Si su visión de una intersección está obstruida por árboles, edificios
    o vehículos estacionados, ¿cómo debe proceder?
  choices:
    A: Toque la bocina y avance rápidamente.
    B: Deténgase por completo y espere a que otro automóvil pase primero.
    C: Acérquese a un ritmo lento y avance con precaución.
    D: Encienda las luces altas para alertar a otros conductores.
  answer: C
  explanation: 'El manual aconseja: ''Acérquese a una intersección obstruida a un
    ritmo lento. Si no puede ver, avance con precaución''.'
- id: 228
  category: defensive_driving
  question: Para evitar un choque causado por una distracción, ¿qué actividad específica
    al costado de la carretera advierte el manual a los conductores que NO miren?
  choices:
    A: Vallas publicitarias y anuncios
    B: Arquitectura o paisajes inusuales
    C: Conductores que han sido detenidos por la policía
    D: Animales pastando cerca de la carretera
  answer: C
  explanation: 'El manual establece: ''No mire a los conductores que han sido detenidos
    ni otras actividades al costado de la carretera. Esto podría causar un choque''.'
- id: 229
  category: sharing_the_road
  question: Si otro vehículo circula por el carril justo al lado de usted, ¿qué debe
    hacer para mantener un colchón de espacio seguro alrededor de su vehículo?
  choices:
    A: Acelerar para ponerse delante de ellos rápidamente.
    B: Tocar la bocina para que se muevan.
    C: Permanecer en la misma posición y dejar que pasen.
    D: Avanzar o quedarse atrás del otro vehículo cuando sea seguro.
  answer: D
  explanation: 'El manual aconseja: ''Si un vehículo circula justo al lado de usted
    en una carretera, avance o quédese detrás del vehículo cuando sea seguro. Esto
    mantendrá espacio alrededor de todo su vehículo''.'
- id: 230
  category: safe_driving_rules
  question: En una intersección no controlada sin señales ni semáforos, ¿quién tiene
    el derecho de paso?
  choices:
    A: El vehículo que se mueve más rápido.
    B: El vehículo de la izquierda.
    C: El vehículo que viene por la derecha.
    D: El vehículo en la carretera más ancha.
  answer: C
  explanation: El manual establece que se debe ceder el derecho de paso a los 'Vehículos
    que vienen por la derecha cuando no hay señales ni semáforos (intersecciones no
    controladas)'.
- id: 231
  category: safe_driving_rules
  question: 'Al girar a la izquierda, debe ceder el paso a:'
  choices:
    A: Vehículos detrás de usted
    B: Vehículos que giran a la derecha desde la misma dirección
    C: Vehículos que se aproximan desde la dirección opuesta
    D: Todos los peatones, incluso si no están en un cruce peatonal
  answer: C
  explanation: El manual indica que debe ceder el paso a los "vehículos que se aproximan
    si está realizando un giro a la izquierda o un giro en U".
- id: 232
  category: safe_driving_rules
  question: 'El manual recomienda añadir una distancia de seguimiento adicional más
    allá de los cuatro segundos estándar cuando usted:'
  choices:
    A: conduce en tráfico ligero de la ciudad.
    B: sigue a una motocicleta o a un camión grande.
    C: se aproxima a un semáforo en verde.
    D: conduce en una carretera recta y seca.
  answer: B
  explanation: 'El manual establece: "Es posible que deba dejar segundos adicionales
    de espacio delante de usted si: ... Sigue a camiones, autobuses, furgonetas, vehículos
    grandes, motocicletas o bicicletas".'
- id: 233
  category: defensive_driving
  question: Para mantenerse al tanto de la situación detrás de su vehículo, ¿con qué
    frecuencia recomienda el manual revisar el espejo retrovisor?
  choices:
    A: Cada 2 a 4 segundos.
    B: Cada 6 a 8 segundos.
    C: Cada 10 a 12 segundos.
    D: Solo cuando planee cambiar de carril o girar.
  answer: B
  explanation: 'El manual aconseja: "Revise su espejo retrovisor cada 6 a 8 segundos
    para ver si alguien lo sigue demasiado de cerca (tailgating)".'
- id: 234
  category: sharing_the_road
  question: ¿Por qué debería dejar espacio adicional para vehículos grandes como camiones
    y autobuses cuando están girando?
  choices:
    A: La ley les exige detenerse por completo antes de girar.
    B: Pueden cruzar la línea central para completar el giro.
    C: Sus luces de freno suelen ser difíciles de ver.
    D: Tienen el derecho de paso absoluto en todas las intersecciones.
  answer: B
  explanation: 'El manual dice: "Deje espacio adicional a los vehículos grandes, como
    camiones y autobuses, ya que pueden cruzar la línea central durante un giro".'
- id: 235
  category: safe_driving_rules
  question: Al esperar para realizar un giro a la izquierda en una intersección con
    tráfico en sentido contrario, ¿dónde debe posicionar su vehículo?
  choices:
    A: Detrás de la línea blanca de parada hasta que el camino esté completamente
      despejado.
    B: En el cruce peatonal, bloqueando a los peatones.
    C: Aproximadamente a la mitad de la intersección.
    D: En el carril derecho para permitir que otros pasen.
  answer: C
  explanation: 'El manual indica: "Acérquese lentamente a la intersección y espere
    aproximadamente a la mitad de la misma. Asegúrese de dejar espacio para que el
    tráfico en sentido contrario gire delante de usted".'
- id: 236
  category: safe_driving_rules
  question: Si está girando a la izquierda desde una calle con múltiples carriles
    de giro a la izquierda y comienza en el carril central, ¿en qué carril debe entrar
    en la nueva calle?
  choices:
    A: El carril más a la derecha.
    B: El carril más a la izquierda.
    C: El carril central.
    D: Cualquier carril disponible.
  answer: C
  explanation: 'El manual establece: "Si se encuentra en el carril central, debe terminar
    en el carril central de la calle a la que está girando".'
- id: 237
  category: driver_testing
  question: Durante el tercer paso de un giro en Y (Y-Turn), ¿qué acción debe tomar
    después de detenerse en la acera opuesta?
  choices:
    A: Señalizar a la derecha y avanzar hacia el carril de tráfico.
    B: Girar el volante completamente hacia la derecha y detenerse.
    C: Mirar sobre su hombro derecho y retroceder el automóvil lo suficiente para
      poder avanzar.
    D: Tocar la bocina para alertar al tráfico antes de retroceder.
  answer: C
  explanation: 'El tercer paso de un giro en Y es: "Mire hacia atrás, sobre su hombro
    derecho. Retroceda su automóvil lo suficiente para que pueda avanzar de nuevo.
    Deténgase".'
- id: 238
  category: sharing_the_road
  question: ¿Cuál es la respuesta correcta y segura si otro vehículo intenta adelantarlo?
  choices:
    A: Aumentar la velocidad para evitar que lo adelanten.
    B: Moverse a la izquierda para bloquearlo.
    C: Mantenerse en su carril y disminuir la velocidad.
    D: Parpadear sus faros para indicar que no es seguro.
  answer: C
  explanation: 'El manual establece: "Si alguien intenta adelantarlo, manténgase en
    su carril y disminuya la velocidad".'
- id: 239
  category: safe_driving_rules
  question: ¿Cuál es la forma adecuada de revisar su punto ciego antes de cambiar
    de carril a la izquierda?
  choices:
    A: Mirar solo por el espejo retrovisor.
    B: Mirar solo por el espejo lateral izquierdo.
    C: Mirar sobre su hombro izquierdo.
    D: Inclinarse hacia adelante para obtener una mejor vista en sus espejos.
  answer: C
  explanation: 'El manual indica: "Si se mueve al carril izquierdo, mire sobre su
    hombro izquierdo". También aclara: "No puede ver estas áreas solo mirando por
    sus espejos".'
- id: 240
  category: safe_driving_rules
  question: ¿Qué establece el manual sobre adelantar a varios vehículos a la vez?
  choices:
    A: Está permitido si tiene una vista despejada de la carretera por delante.
    B: Debe adelantar solo un vehículo a la vez.
    C: Es más seguro que adelantar vehículos individualmente.
    D: Puede adelantar dos vehículos a la vez, pero no más.
  answer: B
  explanation: 'El manual advierte: "Es posible que no haya tiempo suficiente para
    adelantar a varios vehículos a la vez..." e indica "Adelante solo un vehículo
    a la vez por el lado izquierdo".'
- id: 241
  category: vehicle_information
  question: Al retroceder, además de usar los espejos y la cámara de reversa, ¿qué
    debe hacer para garantizar la seguridad?
  choices:
    A: Encender la luz interior del techo.
    B: Girar el cuerpo y mirar por encima del hombro derecho a través de la ventana
      trasera.
    C: Abrir la puerta del lado del conductor para mirar hacia atrás.
    D: Confiar en el sonido de su alarma de reversa.
  answer: B
  explanation: 'El manual establece: ''No dependa únicamente de sus espejos y de la
    cámara de reversa al retroceder. Gire su cuerpo y mire hacia atrás y por las ventanas.
    Mire por encima de su hombro derecho a través de la ventana trasera''.'
- id: 242
  category: driver_responsibility
  question: Al estacionar su vehículo con transmisión automática en una superficie
    nivelada, ¿qué debe hacer después de poner la marcha en (P) Park?
  choices:
    A: Girar las ruedas hacia el bordillo.
    B: Dejar el motor encendido.
    C: Poner el freno de estacionamiento.
    D: Encender las luces de emergencia.
  answer: C
  explanation: 'El manual indica: ''Al estacionar en una superficie nivelada, ponga
    su vehículo en (P) Park (o en una marcha si tiene transmisión manual) y ponga
    el freno de estacionamiento''.'
- id: 243
  category: defensive_driving
  question: ¿Cómo puede ayudar a un conductor que lo sigue?
  choices:
    A: Frenando repentinamente para que se aleje.
    B: Acelerando para crear más espacio.
    C: Manteniendo una velocidad constante y señalizando con anticipación.
    D: Zigzagueando ligeramente dentro de su carril.
  answer: C
  explanation: 'El manual sugiere: ''Puede ayudar a un conductor detrás de usted manteniendo
    una velocidad constante y señalizando con anticipación cuando necesite reducir
    la velocidad o girar''.'
- id: 244
  category: safe_driving_rules
  question: Cuando necesite cruzar el tráfico en una carretera de varios carriles,
    ¿cuál es la consideración más importante?
  choices:
    A: Asegurarse de tener suficiente espacio para cruzar por completo.
    B: Tocar la bocina antes de empezar a cruzar.
    C: Cruzar lo más rápido posible, incluso si eso significa cerrarle el paso a alguien.
    D: Esperar a que un oficial de policía lo dirija.
  answer: A
  explanation: 'El manual establece: ''Cuando cruce el tráfico y carreteras de varios
    carriles, asegúrese de que haya suficiente espacio para cruzar por completo''.'
- id: 245
  category: defensive_driving
  question: Según el manual, ¿qué tipo de acción insegura al girar puede provocar
    un choque?
  choices:
    A: Señalizar demasiado pronto.
    B: Realizar un cambio de último segundo en su trayectoria.
    C: Girar demasiado lento.
    D: Revisar los espejos más de una vez.
  answer: B
  explanation: 'El manual advierte: ''Los cambios de último segundo son inseguros
    y podrían causar un choque''.'
- id: 246
  category: sharing_the_road
  question: En una carretera de varios carriles, ¿cuál es el uso previsto del carril
    situado más a la izquierda?
  choices:
    A: Para conductores que viajan al límite de velocidad o por debajo de este.
    B: Para que los vehículos rebasen a los más lentos.
    C: Solo para vehículos de emergencia.
    D: Para vehículos que se preparan para salir por la derecha.
  answer: B
  explanation: 'El manual establece: ''El carril situado más a la izquierda de una
    carretera de varios carriles se utiliza para que los vehículos rebasen a los más
    lentos''.'
- id: 247
  category: safe_driving_rules
  question: Al estacionar cuesta arriba en una calle sin bordillo, ¿hacia qué lado
    debe girar las ruedas delanteras?
  choices:
    A: Hacia adelante (rectas)
    B: Completamente hacia la izquierda
    C: Completamente hacia la derecha
    D: Ligeramente hacia la izquierda
  answer: C
  explanation: 'El manual establece: ''Si está estacionado cuesta arriba sin bordillo,
    girará las ruedas completamente hacia la derecha antes de poner el auto en (P)
    Park''.'
- id: 248
  category: safe_driving_rules
  question: Durante el proceso de estacionamiento en paralelo, ¿cuándo debe enderezar
    las ruedas por primera vez después de comenzar a retroceder?
  choices:
    A: Cuando su parachoques trasero haya pasado el vehículo de adelante
    B: Cuando su puerta delantera pase el parachoques trasero del vehículo detrás
      del cual se está estacionando
    C: Tan pronto como esté paralelo al bordillo
    D: Después de haberse detenido por completo
  answer: B
  explanation: 'El paso 3 del estacionamiento en paralelo establece: ''Una vez que
    su puerta delantera pase el parachoques trasero del vehículo detrás del cual se
    está estacionando, enderece el volante''.'
- id: 249
  category: safe_driving_rules
  question: Después de estacionar en paralelo con éxito, ¿cuál es la distancia mínima
    recomendada que debe dejar entre su auto y los vehículos de adelante y de atrás?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 6 pies
  answer: B
  explanation: 'El manual especifica: ''Debe estar a un pie de distancia del bordillo
    y al menos a 2 pies de distancia del vehículo que tiene delante y detrás''.'
- id: 250
  category: defensive_driving
  question: El manual del conductor advierte que las emociones fuertes pueden afectar
    negativamente su conducción. ¿Cuál de las siguientes se menciona como una emoción
    que debería impedirle conducir?
  choices:
    A: Excitación
    B: Calma
    C: Satisfacción
    D: Indiferencia
  answer: A
  explanation: 'El manual establece: ''No conduzca si está muy preocupado, excitado,
    asustado, enojado o deprimido''.'
- id: 251
  category: safe_driving_rules
  question: ¿Según el manual, cuál es el uso adecuado de un toque ligero de la bocina
    de su vehículo?
  choices:
    A: Para advertir a alguien que está a punto de golpearlo
    B: Para señalar que va a realizar un giro
    C: Para mostrar frustración con el tráfico lento
    D: Para llamar la atención de otro conductor en la carretera
  answer: D
  explanation: 'El manual explica: ''Un toque ligero de la bocina debería ser suficiente
    para señalar a otro conductor y llamar su atención en la carretera''.'
- id: 252
  category: vehicle_information
  question: ¿En cuál de las siguientes situaciones es apropiado usar las luces altas
    (high beam)?
  choices:
    A: Al conducir con niebla densa
    B: Al seguir a otro vehículo a menos de 200 pies
    C: Al conducir en un área desconocida sin vehículos que vengan en sentido contrario
    D: Al conducir en una calle de la ciudad bien iluminada por la noche
  answer: C
  explanation: El manual dice que puede usar las luces altas cuando 'no hay vehículos
    que vengan hacia usted' y 'se encuentra en un lugar desconocido o en una zona
    de construcción'.
- id: 253
  category: safe_driving_rules
  question: Si planea realizar un giro inmediatamente después de cruzar una intersección,
    ¿cuándo debe activar su luz direccional?
  choices:
    A: Al menos 100 pies antes de la intersección
    B: Mientras se encuentra en medio de la intersección
    C: Una vez que haya cruzado la intersección
    D: Solo después de haber comenzado el giro
  answer: C
  explanation: 'El manual establece: ''Si va a girar después de una intersección,
    comience a señalar una vez que haya cruzado la intersección''.'
- id: 254
  category: safe_driving_rules
  question: ¿Cuál es la señal manual correcta para indicar que se va a detener o a
    reducir la velocidad?
  choices:
    A: Apuntar con la mano directamente hacia afuera de la ventana
    B: Doblar el codo y apuntar con la mano hacia arriba
    C: Apuntar con la mano hacia el suelo
    D: Hacer un movimiento circular con la mano
  answer: C
  explanation: 'El manual explica: ''Si se va a detener o a reducir la velocidad,
    apunte con la mano hacia el suelo''.'
- id: 255
  category: signs_and_signals
  question: ¿Cuándo es más probable que vea una señal de advertencia de 'Tráfico en
    dos sentidos' (2-Way Traffic)?
  choices:
    A: Cuando está a punto de comenzar una calle de un solo sentido
    B: Al salir de una carretera de un solo sentido y entrar en una carretera con
      tráfico en sentido contrario
    C: Antes de que comience una autopista dividida
    D: En cualquier carretera con dos o más carriles
  answer: B
  explanation: 'El manual establece: ''Verá esta señal cuando salga de una calzada
    de un solo sentido y entre en una calzada con tráfico en sentido contrario''.'
- id: 256
  category: signs_and_signals
  question: Además del amarillo estándar, ¿qué otro color se puede utilizar para una
    señal de Cruce Escolar o Zona Escolar para aumentar la visibilidad?
  choices:
    A: Naranja brillante
    B: Verde fluorescente
    C: Azul claro
    D: Blanco reflectante
  answer: B
  explanation: El manual señala para la señal de Cruce Escolar/Zona Escolar que 'puede
    ser verde fluorescente o amarilla'.
- id: 257
  category: signs_and_signals
  question: ¿Qué indica una señal reglamentaria de 'Manténgase a la derecha' (Keep
    Right)?
  choices:
    A: El tráfico más lento debe permanecer en el carril derecho
    B: Debe prepararse para realizar un giro a la derecha
    C: Una isla de tráfico u obstáculo divide la carretera más adelante
    D: Se aproxima a una curva cerrada a la derecha
  answer: C
  explanation: 'El manual explica: ''Manténgase a la derecha: una isla de tráfico
    u obstáculo divide la carretera más adelante''.'
- id: 258
  category: signs_and_signals
  question: ¿Según el manual, dónde se utilizan normalmente las señales de 'No entrar'
    (Do Not Enter)?
  choices:
    A: Al comienzo de las zonas escolares
    B: Antes de curvas cerradas en una autopista
    C: En rampas de salida que van en la dirección equivocada o en calles de un solo
      sentido
    D: En todas las intersecciones con parada en las cuatro direcciones
  answer: C
  explanation: El manual establece que una señal de 'No entrar' 'se utiliza en rampas
    de salida que van en la dirección equivocada o en calles de un solo sentido'.
- id: 259
  category: safe_driving_rules
  question: Además de una señal de 'No estacionar', ¿cuál de las siguientes opciones
    indica un área donde el estacionamiento está prohibido?
  choices:
    A: Marcas blancas en el bordillo
    B: Un bordillo que está pintado de verde
    C: Marcas amarillas en el bordillo
    D: Un bordillo sin pintar en una zona residencial
  answer: C
  explanation: 'El manual establece: ''No se permite estacionar donde haya marcas
    amarillas en el bordillo...'''
- id: 260
  category: safe_driving_rules
  question: Al comenzar a estacionar en paralelo, ¿cómo debe posicionar su vehículo
    junto al automóvil estacionado delante del espacio deseado?
  choices:
    A: Deténgase unos 10 pies detrás de él
    B: Deténgase a la par de él, a unos 2 pies de distancia
    C: Deténgase con su parachoques trasero alineado con el parachoques delantero
      de este
    D: Deténgase en un ángulo de 45 grados con respecto a él
  answer: B
  explanation: 'El paso 1 del estacionamiento en paralelo le indica: ''Deténgase a
    la par del vehículo que está delante de donde desea estacionar. Deténgase a unos
    2 pies de distancia de este''.'
- id: 261
  category: signs_and_signals
  question: ¿Cuál es la forma y el color de una señal de ruta de carretera estatal
    de Wisconsin?
  choices:
    A: Un escudo con rojo en la parte superior y azul en la parte inferior
    B: Una forma de insignia de policía que es gris o blanca
    C: Una forma similar a una jarra de leche con un pico en la parte inferior
    D: Un rectángulo con bordes redondeados que es blanco
  answer: C
  explanation: La Sección 4 describe una señal de carretera estatal con una apariencia
    'como una jarra de leche con un pico en la parte inferior. Esta señal es blanca
    con letras negras'.
- id: 262
  category: sharing_the_road
  question: Además de no detenerse sobre las vías, ¿qué acción específica debe evitar
    mientras su vehículo cruza las vías del tren?
  choices:
    A: Revisar sus espejos
    B: Cambiar de marcha (velocidades)
    C: Encender su radio
    D: Usar su señal de giro
  answer: B
  explanation: 'La Sección 4 sobre Cruces de Ferrocarril establece explícitamente:
    ''No cambie de marcha mientras cruza las vías del tren''.'
- id: 263
  category: sharing_the_road
  question: 'Un emblema de vehículo de movimiento lento, un triángulo naranja reflectante,
    indica que el vehículo puede estar viajando a una velocidad de:'
  choices:
    A: 25 mph o menos
    B: 35 mph o menos
    C: 45 mph o menos
    D: 55 mph o menos
  answer: A
  explanation: La Sección 4 explica que la señal de Vehículo de Movimiento Lento indica
    que 'Este vehículo podría viajar a 25 mph o menos'.
- id: 264
  category: signs_and_signals
  question: ¿Cuál es la forma única de una señal de 'Zona de No Rebasar' (No Passing
    Zone)?
  choices:
    A: Un triángulo que apunta hacia abajo
    B: Un octágono
    C: Un círculo
    D: Un banderín
  answer: D
  explanation: La Sección 4 describe la señal de 'Zona de No Rebasar' como 'Un banderín
    amarillo con letras negras'.
- id: 265
  category: signs_and_signals
  question: ¿Qué información se incluye en una señal de marcador de milla?
  choices:
    A: El número de ruta y la ciudad más cercana
    B: La dirección de viaje, el número de ruta y el número de milla
    C: El nombre del condado y el número de milla
    D: El límite de velocidad y la dirección de viaje
  answer: B
  explanation: Según la Sección 4, 'Cada marcador de milla incluye la dirección de
    viaje, el número de ruta y el número de milla'.
- id: 266
  category: signs_and_signals
  question: ¿Con qué frecuencia se colocan los marcadores de milla a lo largo de las
    carreteras en Wisconsin?
  choices:
    A: Cada milla
    B: Cada media milla
    C: Cada una a dos décimas de milla
    D: Cada cinco millas
  answer: C
  explanation: La Sección 4 establece que los marcadores de milla 'están en cada una
    a dos décimas de milla'.
- id: 267
  category: signs_and_signals
  question: Si ve una señal de 'Señalero de construcción de carretera adelante', ¿qué
    debe hacer?
  choices:
    A: Continuar con precaución a su velocidad actual
    B: Detenerse y esperar a que el señalero se retire
    C: Seguir las instrucciones del señalero
    D: Tocar la bocina para que el señalero sepa que lo ha visto
  answer: C
  explanation: La Sección 4 explica que un señalero de construcción de carreteras
    es 'Un trabajador con una señal o una bandera. Usted debe seguir sus instrucciones'.
- id: 268
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal circular amarilla con una 'X' negra
    y las letras 'RR'?
  choices:
    A: La carretera adelante está cerrada
    B: Hay un cruce de ferrocarril adelante
    C: Está entrando en una zona de no rebasar
    D: Hay una intersección de cuatro vías adelante
  answer: B
  explanation: 'La Sección 4 identifica esta señal como la señal de Advertencia de
    Cruce de Ferrocarril y establece: ''Esto significa que hay un cruce de ferrocarril.
    Esté alerta y asegúrese de estar atento a un tren''.'
- id: 269
  category: signs_and_signals
  question: 'Se aproxima a una intersección con una señal que muestra tres carriles.
    La señal para el carril del extremo izquierdo muestra una flecha que apunta a
    la izquierda y una flecha que apunta recto. El carril central muestra una flecha
    recta. El carril derecho muestra una flecha de giro a la derecha. Desde el carril
    central, usted puede:'
  choices:
    A: Girar a la izquierda o seguir recto
    B: Solo seguir recto
    C: Girar a la derecha o seguir recto
    D: Hacer un giro en U
  answer: B
  explanation: Basado en el ejemplo de una 'Señal de Carril Izquierdo | Carril Central
    | Carril Derecho' en la Sección 4, la señal para cada carril dicta los movimientos
    permitidos. En este escenario, el carril central es solo para seguir recto.
- id: 270
  category: signs_and_signals
  question: ¿Cuál es el propósito de las señales de destino de color café (marrón)?
  choices:
    A: Mostrar direcciones hacia servicios esenciales como hospitales y gasolineras
    B: Indicar la distancia a la próxima ciudad importante
    C: Mostrar información sobre lugares divertidos o hermosos como parques y museos
    D: Advertir sobre próximas zonas de construcción
  answer: C
  explanation: 'La Sección 4 establece: ''Señales de destino de color café: muestran
    información sobre lugares divertidos o hermosos. Algunas señales muestran cuántas
    millas le tomará llegar a la ubicación que figura en la señal''.'
- id: 271
  category: sharing_the_road
  question: En un cruce de ferrocarril, ¿qué indica una señal con un aspa blanca (crossbuck)
    y el número '3' debajo?
  choices:
    A: El cruce está tres millas adelante
    B: Debe detenerse durante tres segundos
    C: Hay tres vías que cruzar
    D: El límite de velocidad es de 30 mph
  answer: C
  explanation: La Sección 4 explica que en una señal de 'Tren aproximándose', 'se
    indica el número de vías. Podría haber más de una vía que cruzar'.
- id: 272
  category: signs_and_signals
  question: Se aproxima a una rotonda de dos carriles. La señal elevada para el carril
    izquierdo muestra una flecha de giro a la izquierda y una flecha de giro en U.
    La señal para el carril derecho muestra una flecha recta y una flecha de giro
    a la derecha. Para seguir recto a través de la rotonda, ¿qué carril debe utilizar?
  choices:
    A: Solo el carril izquierdo
    B: Solo el carril derecho
    C: Cualquiera de los dos carriles, izquierdo o derecho
    D: No se puede seguir recto desde esta rotonda
  answer: B
  explanation: Según el ejemplo de 'Señal de carril izquierdo | carril derecho' para
    rotondas en la Sección 4, el carril derecho está designado para los conductores
    que desean seguir recto o girar a la derecha.
- id: 273
  category: signs_and_signals
  question: ¿Cómo es una señal de ruta de carretera del condado (County Road)?
  choices:
    A: Un rectángulo blanco con bordes redondeados y letras negras
    B: Un cuadrado azul con letras blancas
    C: Una forma de placa de policía gris con letras negras
    D: Un banderín amarillo con letras negras
  answer: A
  explanation: 'La Sección 4 describe la señal de carretera del condado: ''La señal
    del condado es rectangular con bordes redondeados. Es blanca con letras negras''.'
- id: 274
  category: signs_and_signals
  question: Al acercarse a un cruce de ferrocarril, ve una señal que dice 'TRACKS
    OUT-OF-SERVICE' (Vías fuera de servicio). ¿Qué significa esto?
  choices:
    A: Debe detenerse y esperar a un vehículo de servicio
    B: Las vías ya no están en uso
    C: Solo los trenes de servicio utilizan estas vías
    D: Las luces de advertencia no funcionan
  answer: B
  explanation: 'La Sección 4 establece: ''Algunas señales pueden tener un letrero
    de “Vías fuera de servicio” cruzado sobre ellas. Esto significa que las vías ya
    no están en uso''.'
- id: 275
  category: signs_and_signals
  question: ¿Cuál es el propósito de la señal azul con letras blancas que se encuentra
    en todos los cruces de carretera y ferrocarril?
  choices:
    A: Indicar el límite de velocidad para el cruce.
    B: Mostrar el número de vías que hay adelante.
    C: Proporcionar un número de teléfono para informar problemas o emergencias.
    D: Advertir de una próxima señal de alto.
  answer: C
  explanation: La señal azul de 'Informar problema o emergencia' en cada cruce de
    carretera y ferrocarril muestra un número de teléfono para informar condiciones
    inseguras, como un vehículo atascado en las vías o una luz de advertencia que
    no funciona correctamente.
- id: 276
  category: sharing_the_road
  question: Antes de cruzar vías dobles de ferrocarril, ¿qué debe hacer después de
    que haya pasado un tren?
  choices:
    A: Proceder de inmediato, ya que la segunda vía siempre está despejada.
    B: Esperar hasta que el primer tren esté lejos para poder ver si las otras vías
      están despejadas.
    C: Tocar la bocina para advertir a cualquier otro tren que se aproxime.
    D: Cruzar lentamente, mirando solo en la dirección en la que se fue el primer
      tren.
  answer: B
  explanation: 'El manual establece: ''Antes de cruzar una vía doble de ferrocarril,
    debe esperar hasta que el tren esté lejos para poder ver que las vías están despejadas''.'
- id: 277
  category: signs_and_signals
  question: ¿Qué significa una flecha roja intermitente en una intersección?
  choices:
    A: Debe detenerse y esperar a una flecha verde.
    B: Debe realizar una parada completa y luego puede proceder cuando sea seguro.
    C: Puede proceder sin detenerse, pero con precaución.
    D: El giro está prohibido; debe seguir recto.
  answer: B
  explanation: 'Según el manual, una flecha roja intermitente significa: ''Debe realizar
    una parada completa. Puede avanzar cuando sea seguro hacerlo''.'
- id: 278
  category: safe_driving_rules
  question: Se aproxima a una intersección y el semáforo cambia a luz amarilla fija.
    ¿Qué debe hacer?
  choices:
    A: Acelerar para pasar la intersección antes de que cambie a rojo.
    B: Detenerse inmediatamente, incluso si está dentro de la intersección.
    C: Reducir la velocidad y detenerse antes de entrar en la intersección.
    D: Continuar a su velocidad actual, ya que usted tiene el derecho de paso.
  answer: C
  explanation: 'Para una luz amarilla fija, el manual establece: ''Debe reducir la
    velocidad y detenerse antes de entrar en la intersección''. Si ya se encuentra
    dentro de la intersección, debe continuar y pasar.'
- id: 279
  category: signs_and_signals
  question: 'Bajo la ley de Wisconsin, se permite un giro a la izquierda con luz roja
    fija solo cuando:'
  choices:
    A: Gira desde cualquier calle hacia una calle de un solo sentido.
    B: Gira desde una calle de doble sentido hacia otra de doble sentido.
    C: Gira desde una calle de un solo sentido hacia otra calle de un solo sentido.
    D: Nunca se permite girar a la izquierda con luz roja fija.
  answer: C
  explanation: 'El manual especifica para una luz roja fija: ''Puede girar a la izquierda
    en rojo si está girando desde una calle de un solo sentido hacia otra calle de
    un solo sentido''.'
- id: 280
  category: signs_and_signals
  question: Según el manual, ¿qué indica una línea amarilla continua o discontinua
    en el borde de la calzada?
  choices:
    A: El borde derecho del carril de tráfico.
    B: Una zona donde no se permite estacionar.
    C: El borde izquierdo de los carriles de tráfico que van en su dirección.
    D: El inicio de una zona de rebase.
  answer: C
  explanation: 'Bajo ''Líneas de borde y de carril'', el manual establece: ''Una línea
    amarilla continua o discontinua indica el borde izquierdo de los carriles de tráfico
    que van en su dirección''.'
- id: 281
  category: safe_driving_rules
  question: ¿Cuándo es permisible cruzar una línea blanca continua situada entre carriles
    de tráfico?
  choices:
    A: Siempre que desee cambiar de carril.
    B: Solo si está adelantando a un vehículo que circula despacio.
    C: Para evitar un peligro o si va a girar dentro de la siguiente cuadra.
    D: Nunca es permisible cruzar una línea blanca continua.
  answer: C
  explanation: 'Para una línea blanca continua entre carriles, el manual establece:
    ''Solo puede cruzar si hay un peligro o si va a girar dentro de la siguiente cuadra''.'
- id: 282
  category: safe_driving_rules
  question: El manual enumera una excepción para cruzar dos líneas amarillas continuas
    que separan el tráfico en direcciones opuestas. ¿Cuándo se le permite hacer esto?
  choices:
    A: Para adelantar a un vehículo que circula a una velocidad inferior al límite.
    B: Para girar hacia una entrada privada (driveway) cuando sea seguro hacerlo.
    C: Para realizar un giro en U en cualquier punto.
    D: Para adelantar a un ciclista.
  answer: B
  explanation: 'El manual establece una excepción para dos líneas amarillas continuas:
    ''Puede cruzar la línea si gira hacia una entrada privada y es seguro hacerlo''.'
- id: 283
  category: signs_and_signals
  question: ¿Qué significan las líneas amarillas dobles discontinuas en una calzada?
  choices:
    A: Un carril central compartido para girar.
    B: Un carril reversible con señales especiales.
    C: El comienzo de una zona de no adelantar.
    D: Un carril reservado para vehículos de alta ocupación (HOV).
  answer: B
  explanation: El manual describe los carriles reversibles como aquellos que tienen
    'líneas amarillas dobles discontinuas' para separarlos.
- id: 284
  category: signs_and_signals
  question: ¿Qué indica una señal de flecha verde mostrada sobre un carril reversible?
  choices:
    A: El carril está a punto de cerrarse; debe salir.
    B: El carril está abierto para el tráfico en su dirección.
    C: Solo puede girar a la izquierda desde este carril.
    D: El carril está cerrado para todo el tráfico.
  answer: B
  explanation: En un sistema de carriles reversibles, una señal de flecha verde significa
    que el 'carril está abierto' para su uso.
- id: 285
  category: safe_driving_rules
  question: Si está detenido en una intersección y el semáforo se pone en verde, ¿qué
    debe hacer antes de avanzar?
  choices:
    A: Tocar la bocina para alertar al tráfico transversal.
    B: Avanzar inmediatamente para mantener el flujo del tráfico.
    C: Esperar a que el coche de atrás empiece a moverse.
    D: Permitir que despeje cualquier tráfico transversal que ya esté en la intersección.
  answer: D
  explanation: 'Bajo las reglas de luz ''verde fija'', el manual establece: ''Si está
    detenido y luego la luz se pone verde, debe permitir que el tráfico transversal
    despeje antes de poder avanzar''.'
- id: 286
  category: safe_driving_rules
  question: 'Usted conduce por una carretera con dos líneas amarillas continuas. Puede
    cruzar estas líneas para adelantar a otro vehículo ÚNICAMENTE si:'
  choices:
    A: El otro vehículo es equipo agrícola.
    B: El otro vehículo circula a menos de la mitad del límite de velocidad y no es
      equipo agrícola.
    C: El otro vehículo es un ciclista.
    D: Tiene prisa y el camino está despejado.
  answer: B
  explanation: 'Una excepción a la regla de las ''dos líneas amarillas continuas''
    es: ''Puede adelantar a un vehículo que circule a menos de la mitad del límite
    de velocidad si es seguro, excepto si se trata de equipo agrícola''.'
- id: 287
  category: signs_and_signals
  question: ¿Cuál es el significado de una flecha amarilla intermitente?
  choices:
    A: Detenerse por completo antes de girar.
    B: El giro está protegido; usted tiene el derecho de paso.
    C: Ceder el paso al tráfico que viene en sentido contrario y a los peatones primero,
      luego avanzar con precaución.
    D: La señal está a punto de ponerse roja; prepárese para detenerse.
  answer: C
  explanation: El manual establece que una flecha amarilla intermitente significa
    que debe 'ceder el paso primero antes de girar y avanzar con precaución'.
- id: 288
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima a un cruce de ferrocarril y la barrera
    del tren está bajando?
  choices:
    A: Acelerar para cruzar las vías antes de que la barrera baje por completo.
    B: Detenerse y esperar, y no conducir rodeando o por debajo de la barrera.
    C: Detenerse, luego rodear la barrera si no ve un tren.
    D: Esperar a que la barrera baje por completo y luego avanzar si la vía parece
      despejada.
  answer: B
  explanation: 'El manual establece explícitamente para una barrera de tren: ''No
    conduzca rodeando la barrera ni por debajo de una barrera que esté subiendo o
    bajando''.'
- id: 289
  category: signs_and_signals
  question: ¿Cuál es el propósito de una línea blanca continua en el borde derecho
    de una calzada?
  choices:
    A: Indicar que no se permite adelantar.
    B: Marcar el borde derecho del carril de tráfico.
    C: Separar el tráfico que se mueve en direcciones opuestas.
    D: Mostrar dónde debe detenerse en una intersección.
  answer: B
  explanation: Como se describe en 'Líneas de borde y de carril', una línea blanca
    continua 'indica el borde derecho del carril de tráfico'.
- id: 290
  category: safe_driving_rules
  question: Un carril central compartido, marcado con líneas amarillas continuas y
    discontinuas y símbolos de giro blancos, ¿con qué propósito debe utilizarse?
  choices:
    A: Para adelantar a vehículos más lentos por la izquierda.
    B: Como un carril de circulación normal durante las horas pico.
    C: Para vehículos que giran a la izquierda o realizan un giro en U.
    D: Solo para vehículos de emergencia.
  answer: C
  explanation: El manual describe el 'carril central compartido' como aquel que es
    'solo para vehículos que giran a la izquierda o realizan un giro en U'.
- id: 291
  category: signs_and_signals
  question: ¿Qué significa una señal de "X" roja cuando se muestra sobre un carril
    reversible o flexible?
  choices:
    A: El carril está a punto de cerrarse, prepárese para incorporarse.
    B: El carril está cerrado y no se puede utilizar.
    C: El carril está reservado solo para vehículos de emergencia.
    D: El carril está abierto para circular.
  answer: B
  explanation: El manual establece que una "X" roja sobre un carril significa que
    el carril está cerrado y no se puede utilizar.
- id: 292
  category: signs_and_signals
  question: ¿Qué indica típicamente un símbolo de diamante blanco en una señal o pintado
    en la calzada?
  choices:
    A: Un carril reservado para vehículos especiales.
    B: Un carril que terminará pronto.
    C: Un carril con un límite de velocidad reducido.
    D: Un carril designado para giros en U.
  answer: A
  explanation: Según la Sección 5, los carriles reservados para vehículos especiales
    "a menudo tienen un diamante blanco colocado al lado de la señal y en la calzada".
- id: 293
  category: safe_driving_rules
  question: ¿Bajo qué condición específica puede entrar legalmente en un carril reservado
    (por ejemplo, un carril exclusivo para autobuses) si no está operando el tipo
    de vehículo especificado?
  choices:
    A: Si está adelantando a un vehículo más lento.
    B: Si necesita realizar un giro dentro de la siguiente media cuadra.
    C: Si el tráfico en los carriles de uso general está detenido.
    D: Si viaja por menos de una cuadra completa.
  answer: B
  explanation: 'El manual establece: "Puede circular por este carril si necesita girar
    cruzando el carril reservado en la siguiente media cuadra".'
- id: 294
  category: signs_and_signals
  question: Una señal de carril reservado indica "SOLO VIAJES COMPARTIDOS DE 4 PERSONAS,
    LUN–VIE, 6AM–9AM". ¿Cuándo se le permite a un vehículo con solo tres personas
    usar este carril?
  choices:
    A: Los sábados y domingos.
    B: Entre las 9 a.m. y las 6 a.m. los días de semana.
    C: Si también es un autobús.
    D: Nunca, bajo estas restricciones publicadas.
  answer: D
  explanation: El ejemplo de la señal especifica que debe haber cuatro personas en
    el automóvil durante las horas restringidas. Un automóvil con tres personas no
    cumple con el requisito de "4 PERSONAS" (4 RIDER).
- id: 295
  category: signs_and_signals
  question: En algunas autopistas, un arcén pavimentado puede usarse como un "carril
    flexible" (flex lane). ¿Qué tipo de línea separa este carril especial de los carriles
    de uso general?
  choices:
    A: Una línea blanca continua.
    B: Una línea blanca discontinua.
    C: Una línea amarilla continua.
    D: Una línea amarilla discontinua.
  answer: C
  explanation: 'La Sección 5 establece: "Una línea amarilla continua separa este carril
    especial".'
- id: 296
  category: safe_driving_rules
  question: Al acercarse a una rotonda, debe ceder el paso a peatones, bicicletas
    y al tráfico que ya está en la rotonda. ¿A qué otro tipo de vehículo establece
    específicamente el manual que debe ceder el paso?
  choices:
    A: Motocicletas
    B: Autobuses
    C: Semirremolques (semitrucks)
    D: Vehículos que giran a la derecha
  answer: C
  explanation: La Sección 6 enumera los pasos para llegar a una rotonda, lo cual incluye
    "Ceder el paso a los semirremolques".
- id: 297
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento correcto al acercarse a la salida deseada en
    una rotonda?
  choices:
    A: Active la señal de giro a la derecha y salga.
    B: Reduzca la velocidad y espere a que el vehículo detrás de usted pase.
    C: Toque la bocina brevemente para alertar a otros conductores.
    D: Muévase al carril del extremo izquierdo antes de salir.
  answer: A
  explanation: 'El manual instruye a los conductores en una rotonda: "Al llegar a
    su salida, active la señal de giro a la derecha y salga".'
- id: 298
  category: safe_driving_rules
  question: ¿Cuál es el propósito principal de las rampas con semáforo (metered ramps)
    en las entradas de las autopistas?
  choices:
    A: Cobrar peajes por usar la autopista.
    B: Permitir que la policía verifique el registro del vehículo.
    C: Ayudar a espaciar uniformemente los vehículos que se incorporan a la autopista.
    D: Dar acceso prioritario a viajes compartidos (carpools) y autobuses.
  answer: C
  explanation: La Sección 6 establece que las rampas con semáforo ayudan a "espaciar
    uniformemente el número de vehículos que se incorporan a la autopista. Esto reduce
    la congestión en la autopista y en la rampa de entrada".
- id: 299
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia si desobedece una señal de tráfico en
    una rampa de entrada a la autopista con semáforo?
  choices:
    A: Puede ser multado.
    B: Su licencia será suspendida de inmediato.
    C: Recibirá una advertencia por correo.
    D: Su vehículo será confiscado.
  answer: A
  explanation: 'El manual establece claramente: "Si desobedece una señal de rampa,
    puede ser multado".'
- id: 300
  category: signs_and_signals
  question: ¿Qué significa cuando la señal "Ramp Metered When Flashing" está parpadeando
    activamente?
  choices:
    A: La rampa está cerrada y debe buscar otra entrada.
    B: Las señales de tráfico en la rampa están activas y deben obedecerse.
    C: Hay un accidente más adelante en la autopista.
    D: Solo un automóvil puede avanzar a la vez sin detenerse.
  answer: B
  explanation: Según la Sección 6, "La rampa tiene semáforo cuando la señal 'Ramp
    Metered When Flashing' está encendida", lo que significa que las señales de tráfico
    están en funcionamiento.
- id: 301
  category: safe_driving_rules
  question: Según el manual, ¿cuál de los siguientes es un beneficio establecido de
    un Intercambio de Diamante Divergente (DDI)?
  choices:
    A: Aumenta el límite de velocidad a través del intercambio.
    B: Elimina la congestión y reduce los costos de las carreteras.
    C: Proporciona una ruta directa para camiones comerciales.
    D: Elimina la necesidad de señales de tráfico.
  answer: B
  explanation: La Sección 6 explica que un Intercambio de Diamante Divergente (DDI)
    "ayuda con la seguridad, elimina la congestión y reduce el costo de nuevas carreteras".
- id: 302
  category: driver_responsibility
  question: Según el manual, ¿cuál es la máxima prioridad de las fuerzas del orden
    al realizar una parada de tráfico?
  choices:
    A: Emitir una citación por la infracción.
    B: La seguridad y el bienestar del público.
    C: Registrar el vehículo en busca de artículos ilegales.
    D: Verificar la licencia de conducir y el registro del vehículo.
  answer: B
  explanation: 'La sección sobre Paradas de Tráfico comienza indicando: "La máxima
    prioridad de las fuerzas del orden es la seguridad y el bienestar del público".'
- id: 303
  category: signs_and_signals
  question: En una autopista con un carril flexible (flex lane), ¿qué significa una
    señal de flecha verde sobre el carril del acotamiento?
  choices:
    A: El carril es solo para girar.
    B: El carril está abierto y puede utilizarse para circular.
    C: El carril está a punto de cerrarse; prepárese para incorporarse.
    D: El carril está abierto solo para vehículos de emergencia.
  answer: B
  explanation: El manual especifica para los carriles flexibles que una "Flecha Verde
    – El carril está abierto y puede ser utilizado".
- id: 304
  category: sharing_the_road
  question: ¿Cuándo se le permite utilizar el acotamiento pavimentado de algunas autopistas
    como un "carril flexible" (flex lane)?
  choices:
    A: En cualquier momento para evitar la congestión del tráfico.
    B: Solo durante las horas del día.
    C: Cuando la señalización, como una flecha verde, indique que puede hacerlo.
    D: Siempre que los carriles de uso general estén llenos.
  answer: C
  explanation: El manual establece que para un carril flexible, "La señalización le
    indicará cuándo puede usar este carril" y "Verá esto publicado junto a las señales
    de carril flexible".
- id: 305
  category: safe_driving_rules
  question: Al conducir en una rotonda de varios carriles, ¿qué acción debe evitar
    mientras esté dentro del círculo?
  choices:
    A: Usar su señal de giro.
    B: Cambiar de carril.
    C: Mantener una velocidad baja.
    D: Ceder el paso a los camiones semirremolque.
  answer: B
  explanation: 'El manual proporciona una regla de seguridad clave para las rotondas:
    "No cambie de carril mientras esté en la rotonda".'
- id: 306
  category: driver_responsibility
  question: Si es detenido por las fuerzas del orden, ¿qué debe hacer con su vehículo
    inmediatamente después de orillarse en el lado derecho de la carretera?
  choices:
    A: Dejar el motor en marcha pero apagar el radio.
    B: Poner el vehículo en estacionamiento (P), apagar el auto y el radio.
    C: Mantener el auto en marcha (D) con el pie en el freno.
    D: Apagar el auto pero dejar las luces delanteras encendidas.
  answer: B
  explanation: El manual establece que si es detenido por las fuerzas del orden, debe
    'Poner su vehículo en estacionamiento (P), apagar su auto y el radio'.
- id: 307
  category: driver_responsibility
  question: Si un oficial de la ley le entrega una multa y usted no está de acuerdo
    con ella, ¿qué le aconseja el manual hacer en el lugar de los hechos?
  choices:
    A: Explicar calmadamente al oficial por qué está equivocado.
    B: Negarse a firmar o aceptar la multa.
    C: No discutir y esperar su oportunidad en el tribunal.
    D: Llamar inmediatamente a un abogado desde el lugar.
  answer: C
  explanation: 'El manual aconseja: ''No discuta si le dan una multa. Tendrá la oportunidad
    ante un juez o tribunal de expresar sus inquietudes''.'
- id: 308
  category: sharing_the_road
  question: Al conducir de noche, ¿qué es lo primero que debe hacer si ve el reflejo
    de sus luces delanteras en los ojos de un venado?
  choices:
    A: Acelerar para pasar al venado rápidamente.
    B: Encender y apagar las luces altas repetidamente.
    C: Virar bruscamente hacia el otro carril para evitarlo.
    D: Reducir la velocidad, usar la bocina y estar listo para detenerse.
  answer: D
  explanation: 'El manual instruye: ''Si ve sus ojos, reduzca la velocidad. Use su
    bocina y esté listo para detenerse''.'
- id: 309
  category: driver_responsibility
  question: Si atropella a un venado y desea conservarlo legalmente, ¿qué debe hacer?
  choices:
    A: Llevar inmediatamente al venado a un carnicero para su procesamiento.
    B: Llamar a la policía para que puedan emitir una etiqueta (tag) para el venado.
    C: No se le permite conservar un venado que haya atropellado con su vehículo.
    D: Presentar un informe al Departamento de Recursos Naturales en un plazo de 24
      horas.
  answer: B
  explanation: 'El manual establece: ''Si atropella a un venado, puede conservarlo...
    Llame a la policía para que puedan emitir una etiqueta (tag) para el venado''.'
- id: 310
  category: safe_driving_rules
  question: En un cortejo fúnebre, ¿qué vehículo tiene la responsabilidad de obedecer
    las señales de tráfico?
  choices:
    A: Todos los vehículos del cortejo.
    B: Solo el último vehículo de la fila.
    C: Solo el primer vehículo de la fila.
    D: Ningún vehículo, ya que el cortejo tiene el derecho de paso.
  answer: C
  explanation: Según el manual, 'El primer vehículo de la fila debe seguir las señales
    de tráfico'.
- id: 311
  category: vehicle_information
  question: El manual describe los "neumáticos lisos" (bald tires) como neumáticos
    con mucho desgaste. ¿Cuál es el peligro principal asociado con ellos?
  choices:
    A: Aumentan el consumo de combustible.
    B: Hacen que el vehículo haga más ruido.
    C: Reducen la tracción y aumentan la distancia de frenado.
    D: Tienen más probabilidades de atraer clavos y otros objetos afilados.
  answer: C
  explanation: 'El manual establece: "Los neumáticos que tienen mucho desgaste se
    denominan ''neumáticos lisos''. Los neumáticos lisos reducen la tracción y aumentan
    la distancia de frenado".'
- id: 312
  category: defensive_driving
  question: ¿Cómo pueden las condiciones de visibilidad reducida, como por la noche
    o con niebla, afectar su juicio sobre otros vehículos?
  choices:
    A: Los vehículos pueden parecer que se mueven más rápido de lo que realmente lo
      hacen.
    B: Los vehículos pueden parecer que están más cerca de lo que realmente están.
    C: Los vehículos pueden parecer que se mueven más lento de lo que realmente lo
      hacen.
    D: Se vuelve más fácil juzgar la velocidad del tráfico que viene en sentido contrario.
  answer: C
  explanation: 'El manual advierte: "Cuando hay visibilidad reducida, los vehículos
    pueden parecer que se mueven más lento de lo que realmente lo hacen".'
- id: 313
  category: safe_driving_rules
  question: Si su automóvil no tiene un Sistema de Frenos Antibloqueo (ABS), ¿cómo
    debe frenar en una carretera resbaladiza para evitar derrapar?
  choices:
    A: Aplique presión firme y continua al pedal del freno.
    B: Bombee los frenos suavemente.
    C: Pise los frenos lo más fuerte posible.
    D: Cambie a una marcha más baja y no use los frenos.
  answer: B
  explanation: 'El manual aconseja: "Si su automóvil no tiene un Sistema de Frenos
    Antibloqueo (ABS), bombee los frenos suavemente. Esto ayudará a que su automóvil
    no derrape ni se deslice en carreteras resbaladizas".'
- id: 314
  category: defensive_driving
  question: Además de en puentes y pasos elevados, ¿dónde sugiere el manual que debe
    buscar puntos con hielo en días fríos y húmedos?
  choices:
    A: En medio de carreteras anchas y abiertas.
    B: En superficies de asfalto recién pavimentadas.
    C: En carreteras con mucho tráfico.
    D: En lugares con sombra.
  answer: D
  explanation: 'Para detectar carreteras resbaladizas o con hielo, el manual enumera:
    "Lugares con sombra, pasos elevados y puentes en días fríos y húmedos".'
- id: 315
  category: vehicle_information
  question: Antes de conducir en invierno, es importante limpiar la nieve y el hielo
    de todas las ventanas, luces y espejos laterales. ¿Qué otra parte de su vehículo
    también debe limpiarse?
  choices:
    A: El techo.
    B: Las placas de matrícula.
    C: Los guardabarros.
    D: La antena de radio.
  answer: B
  explanation: Los consejos de conducción en invierno del manual indican que es importante
    "quitar la nieve y el hielo de todas las ventanas, luces del vehículo, espejos
    laterales y placas de matrícula".
- id: 316
  category: safe_driving_rules
  question: Al conducir en carreteras de invierno resbaladizas, ¿cuál es la forma
    correcta de usar los faros delanteros?
  choices:
    A: Encienda los faros, pero no use las luces altas.
    B: Use las luces altas en todo momento para una visibilidad máxima.
    C: Mantenga los faros apagados para reducir el resplandor en la nieve.
    D: Alterne entre luces bajas y altas para alertar a otros conductores.
  answer: A
  explanation: Un consejo de conducción en invierno en el manual es "Encender los
    faros delanteros y no usar las luces altas (luces brillantes)".
- id: 317
  category: sharing_the_road
  question: ¿Cuál es la edad mínima requerida para operar un tractor agrícola o maquinaria
    agrícola autopropulsada en las autopistas de Wisconsin?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: 'El manual establece: "Nadie menor de 16 años puede operar un tractor
    agrícola o maquinaria agrícola autopropulsada en las autopistas".'
- id: 318
  category: safe_driving_rules
  question: Según el manual, ¿cuál es el efecto en el riesgo de choque de un conductor
    adolescente cuando hay otro adolescente en el vehículo?
  choices:
    A: La probabilidad de un choque se reduce a la mitad.
    B: La probabilidad de un choque se duplica.
    C: La probabilidad de un choque se triplica.
    D: No hay cambios en el riesgo de choque.
  answer: B
  explanation: 'El manual establece: "La probabilidad de un choque se duplica si un
    conductor adolescente tiene a otro adolescente en el vehículo".'
- id: 319
  category: defensive_driving
  question: Si debe girar para evitar un choque, ¿cuál es una acción crucial para
    evitar causar otra colisión?
  choices:
    A: Toque la bocina continuamente mientras gira.
    B: Gire hacia el carril contrario si está vacío.
    C: Quite una mano del volante para prepararse para el impacto.
    D: Esté preparado para mantener el vehículo bajo control después del giro.
  answer: D
  explanation: 'El manual advierte: "Una vez que haya girado o cambiado de carril,
    debe estar preparado para mantener el vehículo bajo control. Algunos conductores
    se desvían de una colisión solo para terminar en otra".'
- id: 320
  category: defensive_driving
  question: ¿Bajo qué circunstancias podría ser mejor acelerar para evitar un choque?
  choices:
    A: Cuando está a punto de ser golpeado por el costado o por detrás.
    B: Cuando otro vehículo se aproxima de frente en su carril.
    C: Cuando se aproxima a una luz verde que ha estado encendida por mucho tiempo.
    D: Cuando intenta incorporarse a un tráfico que se mueve rápido.
  answer: A
  explanation: El manual sugiere que acelerar para evitar un choque "puede ocurrir
    cuando otro vehículo está a punto de golpearlo por el costado o por detrás".
- id: 321
  category: defensive_driving
  question: Si su vehículo comienza a derrapar porque sus neumáticos han perdido el
    agarre en la carretera, ¿cuál es el primer paso que debe tomar?
  choices:
    A: Gire el volante bruscamente.
    B: No pise el freno.
    C: Bombee el pedal del freno rápidamente.
    D: Ponga el vehículo en punto muerto (neutral).
  answer: B
  explanation: El primer paso indicado en el manual para controlar un derrape es 'No
    pise el freno'.
