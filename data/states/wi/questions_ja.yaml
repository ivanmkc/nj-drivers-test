questions:
- id: 1
  category: driver_responsibility
  question: ウィスコンシン州ドライバーズ・ハンドブックによると、運転はどのように考えられていますか？
  choices:
    A: 憲法上の権利
    B: 特権であり、非常に重要な責任
    C: 18歳以上のすべての市民に対する義務
    D: 任意で行う趣味
  answer: B
  explanation: ハンドブックには、「運転は特権であり、非常に重要な責任であることを忘れないことが極めて重要です」と記載されています。
- id: 2
  category: safe_driving_rules
  question: ハンドブックにおいて、安全な運転をコントロールするために役立つ「安全な行動」として挙げられているのは次のうちどれですか？
  choices:
    A: 交通の流れに合わせるために、制限速度をわずかに超えて運転すること
    B: 歩行者や自転車利用者と道路を共有すること
    C: オートバイに注意することを同乗者だけに頼ること
    D: 車両の運転中にマルチタスク（並行作業）を行うこと
  answer: B
  explanation: ハンドブックでは、運転中に身につけるべき安全な行動の一つとして「歩行者や自転車利用者と道路を共有すること」を挙げています。
- id: 3
  category: driver_responsibility
  question: 道路交通法規について一般市民を教育し、ウィスコンシン州の交通法を執行する責任があると具体的に言及されている組織はどこですか？
  choices:
    A: ウィスコンシン州陸運局 (DMV)
    B: ウィスコンシン州パトロール隊 (Wisconsin State Patrol)
    C: 全米高速道路交通安全局 (NHTSA)
    D: ウィスコンシン州運輸省 (WisDOT)
  answer: B
  explanation: マニュアルには、「ウィスコンシン州パトロール隊は、道路交通法規について一般市民を教育し、ウィスコンシン州の交通法を執行します」と記載されています。
- id: 4
  category: license_system
  question: ハンドブックの導入部で説明されている、DMV（陸運局）の主な役割は何ですか？
  choices:
    A: 高速道路でウィスコンシン州の交通法を執行すること
    B: セーフ・システム・アプローチを通じてウィスコンシン州の道路を設計すること
    C: ドライバーが車両を運転するための訓練を受け、資格を有していることを確実にすること
    D: 全米人身売買ホットラインを運営すること
  answer: C
  explanation: 本文には、「DMVは、このドライバーズ・ハンドブックのような役立つリソースなどを通じて、ドライバーが車両を運転するための訓練を受け、資格を有していることを確実にします」と記されています。
- id: 5
  category: defensive_driving
  question: ウィスコンシン州の公路安全に対する「セーフ・システム・アプローチ」の目標は何ですか？
  choices:
    A: すべてのドライバーが最初の受験で知識試験に合格するようにすること
    B: ドライバーのミスが致命的な結果にならないよう、交通システムを設計・運用すること
    C: ウィスコンシン州パトロール隊による交通取り締まりをすべてなくすこと
    D: 従来の交差点をすべてラウンドアバウト（環状交差点）に置き換えること
  answer: B
  explanation: マニュアルでは、セーフ・システム・アプローチは「ドライバーのミスが致命的な結果にならないよう、ウィスコンシン州の交通システムを設計・運用することを目指している」と説明されています。
- id: 6
  category: driver_testing
  question: オンラインのクラスD運転免許練習問題（Practice Test）はどこで見つけることができますか？
  choices:
    A: KnowToDrive.com/Wisconsin
    B: wisconsindmv.gov
    C: love146.org/online-safety
    D: tatnonprofit.org/youth
  answer: B
  explanation: ハンドブックには、オンラインのクラスD運転免許練習問題は「DMVのウェブサイト wisconsindmv.gov で見つけることができます」と記載されています。
- id: 7
  category: driver_responsibility
  question: ウィスコンシン州の何個の郡で人身売買の事例が報告されていますか？
  choices:
    A: 10の郡
    B: 25の郡
    C: 50の郡
    D: 全72郡
  answer: D
  explanation: 人身売買に関するセクションでは、「ウィスコンシン州の全72郡で人身売買の事例が報告されています」と明記されています。
- id: 8
  category: driver_responsibility
  question: ハンドブックの人身売買に関する情報によると、何歳未満の人が金銭やその他の価値のあるものと引き換えに性的行為を行った場合、被害者とみなされますか？
  choices:
    A: 16歳未満
    B: 18歳未満
    C: 21歳未満
    D: 25歳未満
  answer: B
  explanation: 本文には、「金銭やその他の価値のあるものと引き換えに性的行為を行う18歳未満の者は、人身売買の被害者とみなされます」と記されています。
- id: 9
  category: driver_responsibility
  question: 全米人身売買ホットラインに連絡するために、BeFree (233733) にテキストメッセージで送信する単語は何ですか？
  choices:
    A: SAFE
    B: HELP
    C: STOP
    D: ALERT
  answer: B
  explanation: マニュアルでは、全米人身売買ホットラインの連絡先を「1-888-3737-888、または BeFree (233733) に HELP
    とテキスト送信してください」と案内しています。
- id: 10
  category: driver_responsibility
  question: ハンドブックによると、人身売買の加害者は多くの場合どのようにして被害者と出会いますか？
  choices:
    A: 運転者教育コースを通じて
    B: DMV（陸運局）のサービスセンターで
    C: オンラインで、別人を装って
    D: 運転者教育助成プログラムを通じて
  answer: C
  explanation: 「安全を保つために（Stay safe）」のセクションでは、「人身売買の加害者は、オンラインで別人を装いながら被害者と出会うことが多い」と警告しています。
- id: 11
  category: driver_testing
  question: ハンドブックの目次セクション1によると、運転免許試験の要件として正しいものはどれですか？
  choices:
    A: 健康診断
    B: 道路標識テスト
    C: 排ガス検査
    D: 身辺調査
  answer: B
  explanation: セクション1（運転免許試験の要件）には、視力検査、道路標識テスト、知識テスト、および技能テストが記載されています。
- id: 12
  category: license_system
  question: セクション2に記載されている「免許の段階（Progression of Licenses）」に基づき、学習許可証（Instruction Permit）の直後に取得する免許はどれですか？
  choices:
    A: 職業免許 (Occupational License)
    B: 普通運転免許 (Regular Driver License)
    C: 試用免許 (Probationary License)
    D: 商用運転免許 (Commercial Driver License)
  answer: C
  explanation: セクション2（免許の段階）では、スポンサーシップ、学習許可証（Instruction Permit）、試用免許（Probationary
    License）、そして普通運転免許（Regular Driver License）の順で記載されています。
- id: 13
  category: safe_driving_rules
  question: ハンドブックのセクション9「危険な運転行動（Dangerous Driving Behaviors）」に分類されているトピックはどれですか？
  choices:
    A: 後退（バック）
    B: 居眠り運転 (Drowsy Driving)
    C: 農場での安全
    D: 冬の運転
  answer: B
  explanation: セクション9（危険な運転行動）には、アルコール・薬物と運転、わき見運転（Distracted Driving）、および居眠り運転（Drowsy
    Driving）が含まれています。
- id: 14
  category: sharing_the_road
  question: ハンドブックのセクション10は「道路の共有（Sharing the Road）」を扱っています。このセクションに含まれるトピックはどれですか？
  choices:
    A: ノーゾーン（No-Zones：大型車の死角）
    B: メーター制ランプ（信号制御付き入口）
    C: ダイバージング・ダイヤモンド・インターチェンジ
    D: ラウンドアバウト（環状交差点）
  answer: A
  explanation: セクション10（道路の共有）には、歩行者、緊急車両、スクールバス、オートバイ、自転車、およびノーゾーン（No-Zones）が記載されています。
- id: 15
  category: penalties_and_points
  question: 目次のセクション11によると、ウィスコンシン州が運転資格を管理するために使用しているシステムは何ですか？
  choices:
    A: デメリット制度
    B: ポイント制度 (Point System)
    C: ストライク制度
    D: 交通違反通告制度
  answer: B
  explanation: セクション11（運転資格について）では、最初のトピックとして「ポイント制度（Point System）」が挙げられています。
- id: 16
  category: driver_testing
  question: 普通自動車免許の視力検査に合格するために、少なくとも片方の目に必要な最低視力はどれくらいですか？
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: マニュアルによると、ウィスコンシン州では普通自動車の申請者は、片方の目で少なくとも20/40の視力（矯正の有無を問わず）が必要です。
- id: 17
  category: driver_testing
  question: 視力検査に合格するために必要な、各眼の中心からの視野は何度ですか？
  choices:
    A: 50度
    B: 70度
    C: 90度
    D: 120度
  answer: B
  explanation: マニュアルには、申請者は各眼の中心から70度の視野が必要であると記載されています。
- id: 18
  category: driver_testing
  question: 道路標識テストに合格するには、何問正解する必要がありますか？
  choices:
    A: 15問中10問
    B: 15問中12問
    C: 20問中15問
    D: 50問中40問
  answer: B
  explanation: 道路標識テストは15問あり、合格するには12問（80%）正解する必要があります。
- id: 19
  category: driver_testing
  question: DMVカスタマーサービスセンターで対面の知識テストを受ける際の費用はいくらですか？
  choices:
    A: $10
    B: $15
    C: $25
    D: 無料です
  answer: D
  explanation: マニュアルには、DMVカスタマーサービスセンターでのテストは無料であると記載されています。
- id: 20
  category: driver_testing
  question: 15歳から17歳の申請者がオンラインで知識テストを受ける場合、費用はいくらかかりますか？
  choices:
    A: 無料です
    B: $10
    C: $15
    D: $20
  answer: B
  explanation: 15歳から17歳の申請者は、$10の費用でオンライン知識テストを受けることができます。
- id: 21
  category: driver_testing
  question: 技能試験の前にDMVの試験官が点検する車両部品として、リストに含まれていないものは次のうちどれですか？
  choices:
    A: クラクション（警音器）
    B: エンジンオイルの量
    C: ナンバープレート
    D: ミラー（後写鏡）
  answer: B
  explanation: 試験の前に、試験官はクラクション、ライト/信号、ナンバープレート、ドア、ミラーなどを点検します。エンジンオイルの量はリストに含まれていません。
- id: 22
  category: license_system
  question: 免許を申請する際、ウィスコンシン州に居住していることを証明する書類を何通持参する必要がありますか？
  choices:
    A: 1通
    B: 2通
    C: 3通
    D: 4通
  answer: B
  explanation: 免許を申請するには、公共料金の請求書や金融機関の明細書など、ウィスコンシン州に居住していることを証明する書類を2通持参する必要があります。
- id: 23
  category: driver_responsibility
  question: 18歳未満の運転者のために成人がスポンサーとして署名することは、何を意味しますか？
  choices:
    A: 常に車両に同乗しなければならない。
    B: 運転教育コースの費用を支払う。
    C: 未成年者が起こした事故に対して、法的および金銭的な責任を負う。
    D: 未成年者が技能試験に合格することを保証する。
  answer: C
  explanation: スポンサーは法的責任（ライアビリティ）を引き受けます。つまり、未成年者の運転によって引き起こされた事故に対して、法的および金銭的に責任を負うことを意味します。
- id: 24
  category: license_system
  question: 未成年者がスポンサーを立てる代わりに、保険の証明を提出しなければならないのはどのような条件の場合ですか？
  choices:
    A: 16歳で両親と同居している場合。
    B: 結婚しており、配偶者が18歳未満の場合。
    C: 50時間の監督下での運転練習を完了している場合。
    D: オンラインで知識試験を受けている場合。
  answer: B
  explanation: 結婚しており、配偶者が18歳未満である場合などは、特定の基準に基づき、スポンサーを立てる代わりに保険の証明を提出する必要があります。
- id: 25
  category: license_system
  question: 運転教育プログラムに登録している場合、仮免許（instruction permit）を申請するには何歳である必要がありますか？
  choices:
    A: 14歳
    B: 15歳
    C: 15歳半
    D: 16歳
  answer: B
  explanation: 18歳未満の場合、仮免許を申請するには、少なくとも15歳以上であり、運転教育プログラムに登録している必要があります。
- id: 26
  category: safe_driving_rules
  question: 仮免許（instruction permit）を保持しており、夜間に運転する場合、助手席に誰が同乗しなければなりませんか？
  choices:
    A: 18歳以上の免許保持者であれば誰でもよい。
    B: 16歳以上の兄弟姉妹。
    C: 資格のある教官、または2年以上の運転経験を持つ25歳以上の免許保持者。
    D: 有効な試用免許（probationary license）を持つ人であれば誰でもよい。
  answer: C
  explanation: 夜間に車両を運転する場合、助手席に資格のある教官、または2年以上の運転経験を持つ25歳以上の免許保持者が同乗している必要があります。
- id: 27
  category: safe_driving_rules
  question: 仮免許（instruction permit）保持者の助手席に同乗する人は、少なくとも何年の運転経験が必要ですか？
  choices:
    A: 1年
    B: 2年
    C: 3年
    D: 5年
  answer: B
  explanation: クラスDの仮免許保持者は、少なくとも2年の運転経験を持つ免許保持者を同乗させて運転しなければなりません。
- id: 28
  category: license_system
  question: 18歳未満の運転者が試用免許（probationary license）を取得するには、仮免許（instruction permit）を最低どれくらいの期間保持する必要がありますか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 9ヶ月
    D: 12ヶ月
  answer: B
  explanation: 18歳未満の場合、試用免許を取得するには、仮免許を少なくとも6ヶ月間保持し、16歳に達している必要があります。
- id: 29
  category: driver_testing
  question: 未成年者が試用免許（probationary license）を取得する前に、合計で何時間の監督下での運転練習を完了する必要がありますか？
  choices:
    A: 30時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: C
  explanation: 有効な仮免許を使用して、日中に少なくとも40時間、夜間に10時間の計50時間の運転練習を行う必要があります。
- id: 30
  category: safe_driving_rules
  question: 試用免許（probationary license）で運転中、電話の使用が許可されるのはどのような時ですか？
  choices:
    A: 赤信号で停車している時。
    B: 緊急事態を通報する場合のみ。
    C: ハンズフリー機器を使用している時。
    D: いかなる状況でも電話の使用は許可されない。
  answer: B
  explanation: マニュアルには試用免許について、「緊急事態を通報する必要がある場合を除き、運転中の電話の使用は禁止されていることを忘れないでください」と記載されています。
- id: 31
  category: license_system
  question: 18歳未満の運転者に対し、段階的運転免許制度（GDL）の同乗者制限および時間制限はどのくらいの期間適用されますか？
  choices:
    A: 最初の6ヶ月間
    B: 最初の9ヶ月間
    C: 最初の12ヶ月間
    D: 運転者が21歳になるまで
  answer: B
  explanation: マニュアルによると、GDLの制限は最初の9ヶ月間適用されます。ただし、その期間内に18歳になる場合はその限りではありません。
- id: 32
  category: license_system
  question: 段階的運転免許制度（GDL）において、午前0時から午前5時までの間に一人で運転することが許可されているのはどこですか？
  choices:
    A: 自宅のある市内のどこでも
    B: 自宅、学校、および/または職場との間のみ
    C: 医療上の緊急事態のみ
    D: この時間帯に一人で運転することは一切許可されていない
  answer: B
  explanation: マニュアルには、午前0時から午前5時までは、自宅、学校、および/または職場との間を運転する場合に限り、一人で運転できると記載されています。
- id: 33
  category: penalties_and_points
  question: 段階的運転免許制度（GDL）の制限が6ヶ月間延長される原因となるのはどれですか？
  choices:
    A: 駐車違反切符を切られること
    B: 動的交通違反（走行中の違反）で有罪判決を受けること
    C: 免許更新を90日前に忘れること
    D: 近親者と同乗して運転すること
  answer: B
  explanation: 動的交通違反で有罪判決を受けた場合、制限に違反した場合、または免許が停止・取り消しになった場合、段階的運転免許の制限は6ヶ月間延長されます。
- id: 34
  category: license_system
  question: ウィスコンシン州の通常の運転免許証は、どのくらいの頻度で更新する必要がありますか？
  choices:
    A: Every 4 years
    B: Every 5 years
    C: Every 8 years
    D: Every 10 years
  answer: C
  explanation: マニュアルには、運転免許証の更新は8年ごとに行う必要があると記載されています。
- id: 35
  category: license_system
  question: 他の州の通常運転免許証を持ってウィスコンシン州に転入した場合、何日以内にウィスコンシン州の免許を申請する必要がありますか？
  choices:
    A: 10日以内
    B: 30日以内
    C: 60日以内
    D: 90日以内
  answer: C
  explanation: 他州の通常運転免許証を持っている場合、転入後60日以内にウィスコンシン州の運転免許証を申請する必要があります。
- id: 36
  category: license_system
  question: ウィスコンシン州において、REAL ID準拠の運転免許証はどのように表示されていますか？
  choices:
    A: 金色の円
    B: 星印
    C: ハクトウワシ
    D: 表面のバーコード
  answer: B
  explanation: マニュアルには、ウィスコンシン州のDMVは国土安全保障省の要件を満たすREAL IDを発行しており、それには星印が付いていると記されています。
- id: 37
  category: safe_driving_rules
  question: 4方向一時停止（four-way stop）の交差点に2台の車が同時に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側の運転者
    B: 右側の運転者
    C: 直進する運転者
    D: 右折する運転者
  answer: B
  explanation: 優先権のルールによると、1台以上の運転者が同時に停止位置に到着した場合、右側の運転者が先に進みます。
- id: 38
  category: sharing_the_road
  question: 盲導犬を連れている、または白い杖（白杖）を持っている歩行者に遭遇したとき、どうしなければなりませんか？
  choices:
    A: 自分の存在を知らせるためにクラクションを鳴らす
    B: その人が路上からいなくなるまで、少なくとも10フィート（約3メートル）離れた場所で停止する
    C: 横断歩道内にいる場合のみ道を譲る
    D: ゆっくりと避けて運転する
  answer: B
  explanation: 盲導犬を使用している、または白い杖を持っている歩行者に対しては、その人が路上からいなくなるまで少なくとも10フィート離れた場所で停止し、優先権を譲らなければなりません。
- id: 39
  category: safe_driving_rules
  question: 通常の運転条件下で安全な車間距離を判断するために、どのルールを使用すべきですか？
  choices:
    A: 2秒ルール
    B: 3秒ルール
    C: 4秒車間距離ルール
    D: 車1台分ルール
  answer: C
  explanation: マニュアルでは、「4秒車間距離ルール」を使用して、常に安全に停止できる速度で運転するよう指示しています。
- id: 40
  category: safe_driving_rules
  question: ウィスコンシン州において、子供がいる時間帯のスクールゾーンでの通常の制限速度は時速何マイルですか？
  choices:
    A: 時速15マイル
    B: 時速20マイル
    C: 時速25マイル
    D: 時速35マイル
  answer: A
