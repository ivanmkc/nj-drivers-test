- id: 185
  category: driver_responsibility
  question: ハンドブックには、ウィスコンシン州運輸局による安全への3つの取り組みが記載されています。DMVとウィスコンシン州警察（State Patrol）以外に挙げられている3つ目の要素は何ですか？
