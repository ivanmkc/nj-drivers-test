  explanation: 手信号で右折したい場合は、肘を曲げて手を上に向けます。
- id: 68
  category: signs_and_signals
  question: ほとんどの警戒標識（Warning signs）の色と形はどのようなものですか？
  choices:
    A: 赤と白の八角形
    B: 白と黒の長方形
    C: 黄色地に黒の文字または記号で、ほとんどがひし形
    D: 緑地に白の文字で、ほとんどが正方形
  answer: C
  explanation: 警戒標識は黄色地に黒の文字または記号が描かれています。そのほとんどがひし形です。
- id: 69
  category: signs_and_signals
  question: 反射材付きのオレンジ色のマーキングがある三角形の標識は、低速走行車両を示しています。この車両の最高速度はおよそ時速何マイルですか？
  choices:
    A: 時速15マイル以下
    B: 時速25マイル以下
    C: 時速35マイル以下
    D: 時速45マイル以下
  answer: B
  explanation: 低速走行車両（Slow Moving Vehicle）の標識は、反射材付きのオレンジ色のマーキングがある三角形の標識です。この車両は時速25マイル以下で走行します。
- id: 70
  category: signs_and_signals
  question: 追い越し禁止区域（No Passing Zone）の標識はどのような形をしていますか？
  choices:
    A: 黒の文字が書かれた黄色のペナント型（三角旗型）
    B: 白の文字が書かれた赤の八角形
    C: 下向きの赤と白の三角形
    D: 黒の文字が書かれた白の長方形
  answer: A
  explanation: 追い越し禁止区域の標識は、黒の文字が書かれた黄色のペナント型です。追い越し禁止区域内では、いかなる車両も追い越すことはできません。
- id: 71
  category: signs_and_signals
  question: 警察官や学童擁護員（スクール・クロッシング・ガード）が信号機や標識と異なる指示を出した場合、どうすべきですか？
  choices:
    A: 信号機や標識に従う
    B: 警察官や学童擁護員の指示に従う
    C: 停車して信号が青になるのを待つ
    D: クラクションを鳴らして標識を知らせる
  answer: B
  explanation: 道路上の信号機や標識と異なっていても、警察官、学童擁護員、その他の作業員の指示に従わなければなりません。
- id: 72
  category: defensive_driving
  question: 車のクラクションを強く鳴らすのが適切なのはどのような時ですか？
  choices:
    A: 友人に挨拶をする時
    B: 走行が遅すぎるドライバーに合図を送る時
    C: 自分が相手に衝突しそうな時、または相手が自分に衝突しそうな時に警告する時
    D: 歩行者に横断歩道に近づいていることを知らせる時
  answer: C
  explanation: 自分が相手に衝突しそうな時、または相手が自分に衝突しそうな時に警告するために、クラクションを強く鳴らすことができます。
- id: 73
  category: vehicle_information
  question: 車の駐車灯（パーキングライト）はいつ使用すべきですか？
  choices:
    A: 濃霧の中を走行している時はいつでも
    B: 駐車してアイドリングしている時のみ
    C: 日没から日の出までの間に走行している時
    D: 交通量の多い通りで縦列駐車をする時
  answer: B
  explanation: マニュアルによると、駐車灯は駐車してアイドリングしている時にのみ使用してください。
- id: 74
  category: penalties_and_points
  question: 道路工事区域内での交通違反の罰金はどうなりますか？
  choices:
    A: 半額に減額される
    B: 変わらない
    C: 2倍になる
    D: 3倍になる
  answer: C
  explanation: 工事区域内での交通違反の罰金は、ドライバーに減速を促し、作業員を保護するための罰則として2倍になります。
- id: 75
  category: safe_driving_rules
  question: 工事区域内で携帯電話の使用が許可されるのはどのような時ですか？
  choices:
    A: ハンズフリー器具を使用している時
    B: 緊急事態を通報する場合のみ
    C: 交通が完全に停止している時
    D: いかなる場合も使用してはならない
  answer: B
  explanation: マニュアルによると、工事区域内で携帯電話を使用できるのは、緊急事態を通報する場合のみです。
- id: 76
  category: signs_and_signals
  question: 公園、史跡、美術館などへの道順を示す案内標識は何色ですか？
  choices:
    A: 青
    B: オレンジ
    C: 茶色
    D: 黄色
  answer: C
  explanation: 茶色の案内標識は、公園、史跡、美術館などの娯楽施設や景勝地に関する情報を示します。
- id: 77
  category: signs_and_signals
  question: 高速道路にあるマイルマーカー（距離標）の主な目的は何ですか？
  choices:
    A: 現在の制限速度を示すため
    B: この先の休憩所を示すため
    C: 高速道路での事故に対する緊急対応時間を短縮するため
    D: この先の工事区域をドライバーに警告するため
  answer: C
  explanation: マイルマーカーは道路上の現在地を特定するのに役立ち、高速道路での事故に対する緊急対応時間を短縮させます。
- id: 78
  category: signs_and_signals
  question: 上部が赤、下部が青の盾のような形をした路線標識はどれですか？
  choices:
    A: 郡道（County Road）
    B: 米国国道（U.S. Route）
    C: 州道（State Road）
    D: 州間高速道路（Interstate Highway）
  answer: D
  explanation: 州間高速道路（Interstate Highway）の標識は、上部が赤、下部が青の盾のような形で、白の文字が使われています。
- id: 79
  category: safe_driving_rules
  question: 踏切を横断中に「してはいけない」ことは何ですか？
  choices:
    A: 左右を確認する
    B: ギアチェンジをする
    C: 安全な距離を保つ
    D: 列車に道を譲る
  answer: B
  explanation: マニュアルには、踏切を横断中にギアチェンジをしてはならないと明記されています。
- id: 80
  category: signs_and_signals
  question: 踏切にある「Exempt（免除）」の標識は何を意味しますか？
  choices:
    A: 線路がもう使われていないこと
    B: 特定の車両は横断前に停止する必要がないこと
    C: 踏切に点滅信号がないこと
    D: 列車が車両のために停止しなければならないこと
  answer: B
  explanation: 「Exempt（免除）」の標識は、特定の車両が踏切を横断する前に停止する必要がないことを意味します。
- id: 81
  category: defensive_driving
  question: 踏切で車両が動けなくなった場合、危険な状態を報告するための電話番号はどこで確認できますか？
  choices:
    A: 踏切にある白い文字の青い標識を探す
    B: 黄色の警告標識を探す
    C: クロスバック（十字型）標識の裏を確認する
    D: 911にのみ電話する
  answer: A
  explanation: すべての道路と鉄道の交差部（踏切）には、白い文字の青い標識が設置されています。そこには、危険な状況や緊急事態を報告するための電話番号が記載されています。
- id: 82
  category: safe_driving_rules
  question: 信号機が停電したり、正常に作動していない場合は、どのように進むべきですか？
  choices:
    A: 右側の車両に道を譲る
    B: 譲れ（Yield）の標識があるものとして進む
    C: 一時停止（Stop）の標識があるものとして進む
    D: 警察官が到着するのを待つ
  answer: C
  explanation: 信号機が停電したり、正常に作動していない場合は、一時停止標識があるものとして進まなければなりません。
- id: 83
  category: safe_driving_rules
  question: どのような条件下で、赤信号の点灯中に左折することができますか？
  choices:
    A: 赤信号での左折は決して許可されない
    B: 一方通行の道路から別の一方通行の道路へ左折する場合
    C: 対向車がいない場合
    D: 対面通行の道路から一方通行の道路へ左折する場合
  answer: B
  explanation: 一方通行の道路から別の一方通行の道路へ左折する場合、まず一時停止し、他の交通に道を譲った後であれば、赤信号でも左折することができます。
- id: 84
  category: safe_driving_rules
  question: 黄信号が点灯したときに、すでに交差点内にいる場合はどうすべきですか？
  choices:
    A: 交差点内ですぐに停止する
    B: 交差点からバックして出る
    C: そのまま交差点を通過する
    D: 路肩に寄せる
  answer: C
  explanation: 黄信号が点灯したときに交差点内にいる場合は、停止してはいけません。そのまま交差点を通過することができます。
- id: 85
  category: signs_and_signals
  question: 黄色の点滅信号は何を意味しますか？
  choices:
    A: 完全に停止し、青信号を待つ
    B: 信号がまもなく赤に変わる
    C: 減速し、交差する交通を確認して、注意して進む
    D: 対向車に道を譲って左折する
  answer: C
  explanation: 黄色の点滅信号は、減速し、交差する交通を確認した上で、注意して進むべきであることを意味します。
- id: 86
  category: safe_driving_rules
  question: 青信号の点灯中に左折する場合、何をしなければなりませんか？
  choices:
    A: 優先権があるため、すぐに進む
    B: 対向車に道を譲る
    C: 青色の矢印信号を待つ
    D: 停止して信号が黄色に変わるのを待つ
  answer: B
  explanation: 左折する場合、青信号の点灯は、安全が確認できた場合にのみ曲がれることを意味します。対向車に優先権があります。
- id: 87
  category: signs_and_signals
  question: 交差点で左折する際、青信号の点灯は何を意味しますか？
  choices:
    A: 対向車に対して優先権がある
    B: 曲がることはできるが、安全な場合に限り、対向車に道を譲らなければならない
    C: 曲がる前に青色の矢印信号を待たなければならない
    D: 歩行者に道を譲らずに曲がることができる
  answer: B
  explanation: マニュアルによると、左折する場合、青信号の点灯は、安全が確認できた場合にのみ曲がれることを意味します。対向車に優先権があります。
- id: 88
  category: safe_driving_rules
  question: 同じ方向に進む車線を区切る白の実線を越えることが許可されるのはどのような時ですか？
  choices:
    A: 遅い車両を追い越す必要があるときはいつでも
    B: 危険がある場合、または次のブロック内で曲がる場合のみ
    C: スクールゾーンを走行しているとき
    D: 白の実線を越えることは決して許されない
  answer: B
  explanation: マニュアルには、車線間の白の実線は越えてはならないと記載されています。危険がある場合、または次のブロック内で曲がる場合にのみ越えることができます。
- id: 89
  category: safe_driving_rules
  question: 2本の黄色の実線は、どの車線からも追い越しができないことを意味します。このルールの例外は何ですか？
  choices:
    A: 制限速度の半分未満で走行している車両を追い越す場合（農耕器具を除く）
    B: 黄色の点滅灯をつけているスクールバスを追い越す場合
    C: 制限速度の半分未満で走行している農用トラクターを追い越す場合
    D: 緊急事態で遅れているときに追い越す場合
  answer: A
  explanation: 2本の黄色の実線のルールの例外として、安全であれば、制限速度の半分未満で走行している車両を追い越すことができます。ただし、その車両が農耕器具である場合は除きます。
- id: 90
  category: safe_driving_rules
  question: 横断歩道で停止するとき、車両はどの位置にあるべきですか？
  choices:
    A: 前輪が白の実線の上にある状態
    B: 前輪が白の実線の直前で停止している状態
    C: 横断歩道の途中で停止するべきである
    D: 横断歩道の少なくとも10フィート手前で停止するべきである
  answer: B
  explanation: マニュアルには、前輪は白の実線の直前で停止させるべきであり、横断歩道の上で停止してはならないと記載されています。
- id: 91
  category: safe_driving_rules
  question: 共有センターレーン（中央車線）は何のために使用されますか？
  choices:
    A: 低速車両の追い越し。
    B: 緊急時の駐車。
    C: 左折またはUターンをする車両。
    D: バスと自転車の専用使用。
  answer: C
  explanation: 共有センターレーンは、左折またはUターンをする車両のみが使用できます。車両はどちらの方向からでもこの車線を使用できます。
- id: 92
  category: signs_and_signals
  question: リバーシブルレーンの上にある黄色の「X」信号は何を示していますか？
  choices:
    A: その車線は走行可能です。
    B: その車線はすべての交通に対して閉鎖されています。
    C: その車線は左折専用です。
    D: 車線が切り替わるため、緑の矢印がある車線に移動する必要があります。
  answer: D
  explanation: リバーシブルレーンの黄色の「X」は、車線が切り替わることを意味しており、緑の「矢印」がある車線に移動しなければなりません。
- id: 93
  category: safe_driving_rules
  question: その種類の車両を運転していない場合、法的に専用車線（バス専用レーンや自転車レーンなど）を走行できるのはいつですか？
  choices:
    A: 一般車線の交通がひどく混雑しているとき。
    B: 次の半ブロック以内で専用車線を横切って曲がる必要があるとき。
    C: 午前6時から午前9時の間に運転するとき。
    D: いかなる状況においても、専用車線を走行することは許可されていません。
  answer: B
  explanation: その種類の車両を運転していない限り、専用車線を走行することは違法ですが、次の半ブロック以内で専用車線を横切って曲がる必要がある場合は、この車線を走行することができます。
- id: 94
  category: safe_driving_rules
  question: フレックスレーン（flex lane）を走行することが許可されていない車両の種類はどれですか？
  choices:
    A: 乗用車。
    B: オートバイ。
    C: 大型トラック。
    D: 相乗り車両（カープール車両）。
  answer: C
  explanation: マニュアルには「大型トラックはフレックスレーンを走行できない」と明記されています。
- id: 95
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）では、交通はどの方向に進みますか？
  choices:
    A: 時計回り。
    B: 反時計回り。
    C: 8の字パターン。
    D: 曲がらずに直進。
  answer: B
  explanation: マニュアルによると、ラウンドアバウトはより安全で効率的な交通の流れの選択肢であり、交通は反時計回りに進みます。
- id: 96
  category: sharing_the_road
  question: ラウンドアバウトに近づく際、以下のどれに道を譲らなければなりませんか？
  choices:
    A: 右側から近づいてくる交通。
    B: すでにラウンドアバウト内にいる左側の交通。
    C: 反対側からラウンドアバウトに入ろうとしている車両。
    D: 緊急車両のみ。
  answer: B
  explanation: ラウンドアバウトに到達したら、歩行者、自転車、セミトレーラー、およびすでにラウンドアバウト内にいる左側の交通に道を譲らなければなりません。
- id: 97
  category: safe_driving_rules
  question: すでにラウンドアバウト内を走行中に、サイレンを鳴らした緊急車両が進入してきた場合、どうすべきですか？
  choices:
    A: 通過させるために、ラウンドアバウト内ですぐに停止する。
    B: 加速して、できるだけ早くラウンドアバウトを出る。
    C: 次の右側の出口で安全に出てから、路肩に寄せる。
    D: 中央の島（センターアイランド）の左側に寄せる。
  answer: C
  explanation: 緊急車両が進入してきたときにすでにラウンドアバウト内にいる場合は、次の右側の出口で安全に出てから、路肩に寄せる必要があります。ラウンドアバウト内での停止は避けなければなりません。
- id: 98
  category: safe_driving_rules
  question: メーター制の高速道路入口ランプ（合流車線）で、白い停止線の直前まで進まなければならないのはなぜですか？
  choices:
    A: 後続車が通過できるようにするため。
    B: タイヤが路面のセンサーを作動させるようにするため。
    C: 高速道路の交通状況をよりよく確認するため。
    D: 横断歩道を塞いで違反切符を切られないようにするため。
  answer: B
  explanation: メーター制のランプでは、タイヤが路面のセンサーを作動させるように、白い停止線の直前まで進む必要があります。
- id: 99
  category: signs_and_signals
  question: 点灯している緑の矢印は何を示していますか？
  choices:
    A: 矢印の方向に曲がることができ、対向車や交差する交通はないはずです。
    B: 曲がることはできますが、まず対向車に道を譲らなければなりません。
    C: 車線が切り替わるため、隣の車線に合流しなければなりません。
    D: 交差点を直進することしかできません。
  answer: A
  explanation: 点灯している緑の矢印は、矢印の方向に曲がることができることを意味します。矢印が緑の間は、対向車や交差する交通はないはずです。
- id: 100
  category: signs_and_signals
  question: 破線と実線の両方の黄色い線がある道路標示は何を意味しますか？
  choices:
    A: 道路の両側の交通に対して追い越しが許可されている。
    B: 道路の両側の交通に対して追い越しが禁止されている。
    C: 破線側にいる場合は追い越しができるが、実線側にいる場合はできない。
    D: 実線側にいる場合は追い越しができるが、破線側にいる場合はできない。
  answer: C
  explanation: 黄色の破線と実線は、破線側にいる場合は追い越しができることを意味します。実線側にいる場合は、追い越しはできません。
- id: 101
  category: sharing_the_road
  question: 専用車線（リザーブドレーン）を横切って法的に右左折しようとしている際、その車線に自転車がいる場合、どうすべきですか？
  choices:
    A: 加速して、自転車を追い越してから曲がる。
    B: クラクションを鳴らして、自転車に道を譲るよう警告する。
    C: 自転車の後ろに入り、安全が確認できてから曲がる。
    D: 一般車線で停止し、自転車が先に曲がるのを待つ。
  answer: C
  explanation: マニュアルによると、専用車線に自転車がいる場合は、自転車の後ろに移動し、安全が確認できてから曲がるべきであるとされています。
- id: 102
  category: safe_driving_rules
  question: 赤信号の信号制御付き高速道路入口ランプ（メーター制ランプ）に近づく際、どうすべきですか？
  choices:
    A: 白い停止線の10フィート手前で停止する。
    B: 白い停止線のすぐ手前まで進む。
    C: 高速道路が空いていれば、停止せずに進む。
    D: 隣の車線の車両が先に行くのを待つ。
  answer: B
  explanation: マニュアルには、タイヤが路面のセンサーを作動させるように、白い停止線のすぐ手前まで進むべきであると記載されています。
- id: 103
  category: driver_responsibility
  question: 交通取り締まりで警察官に車を止められた際、手はどこに置くべきですか？
  choices:
    A: 膝の上。
    B: 窓の外。
    C: ハンドルの上部の見える位置。
    D: ポケットの中やジャケットの内側。
  answer: C
  explanation: 警察官に止められた場合は、手をハンドルの上部の見える位置に置き、急な動きをしないようにしてください。
- id: 104
  category: defensive_driving
  question: シカが最も活発に活動するのは一日のうちどの時間帯ですか？
  choices:
    A: 日の出から正午まで。
    B: 午後の最も暑い時間帯。
    C: 日没から日の出まで。
    D: 大雨や霧の時のみ。
  answer: C
  explanation: マニュアルによると、シカは日没から日の出までの時間帯に最も活発になります。
- id: 105
  category: driver_responsibility
  question: 車両でシカをはねてしまった場合、その個体を所有することに関する規則はどうなっていますか？
  choices:
    A: 誰であってもシカを所有することは違法である。
    B: 警察官または動物管理官のみがシカを回収できる。
    C: あなたが所有することも、あなたが希望しない場合は次のドライバーが所有することもできる。
    D: 道路脇に放置しなければならない。
  answer: C
  explanation: マニュアルには「シカをはねた場合、それを所有することができます。あなたが希望しない場合は、次のドライバーが所有することができます」と記載されています。また、警察に連絡してタグを発行してもらう必要があります。
- id: 106
  category: sharing_the_road
  question: 葬列の車列を走行する車両には何が義務付けられていますか？
  choices:
    A: 常にハザードランプを点滅させなければならない。
    B: ヘッドライトを点灯させなければならない。
    C: 交差点を通過する際にクラクションを鳴らさなければならない。
    D: 制限速度より少なくとも時速15マイル以上減速して走行しなければならない。
  answer: B
  explanation: マニュアルでは、葬列の車列に加わる車両はヘッドライトを点灯させなければならず、他のドライバーはその列に割り込んだり妨害したりしてはならないと規定されています。
- id: 107
  category: safe_driving_rules
  question: 悪天候時、路面の他の部分よりも先に凍結しやすいのはどこですか？
  choices:
    A: 交差点。
    B: 橋や高架橋。
    C: トンネル。
    D: 砂利の路肩。
  answer: B
  explanation: 悪天候時には、橋や高架橋が路面の他の部分よりも先に凍結することを覚えておくことが重要です。
- id: 108
  category: defensive_driving
  question: 車両がハイドロプレーニング現象を起こし始めたら、どうすべきですか？
  choices:
    A: すぐにブレーキを強く踏む。
    B: ハンドルを右に急に切る。
    C: アクセルペダルから足を離し、ハンドルをまっすぐに保つ。
    D: 加速して水たまりを通り抜ける。
  answer: C
  explanation: スリップしたりハイドロプレーニング現象が起きたりした場合は、アクセルペダルから足を離し、ハンドルをまっすぐに保ち、タイヤが再び路面をグリップするまで停止や旋回を試みないでください。
- id: 109
  category: defensive_driving
  question: 車両がスリップし始めて制御を失った場合、どのようにハンドル操作をすべきですか？
  choices:
    A: スリップしている方向とは逆の方向にハンドルを切る。
    B: 車両を進めたい方向にハンドルを切る。
    C: ハンドルを完全にまっすぐに保つ。
    D: ハンドルを素早く左右に切る。
  answer: B
  explanation: スリップしたときは、ブレーキを踏まず、車両を進めたい方向にハンドルを切り、車が直進し始めたらすぐにハンドルを戻します。
- id: 110
  category: sharing_the_road
  question: 冬の天候下で走行中、除雪車のライトが点滅している場合、どの程度の距離を空けるべきですか？
  choices:
    A: 少なくとも50フィート。
    B: 少なくとも100フィート。
    C: 少なくとも200フィート。
    D: 少なくとも500フィート。
  answer: C
  explanation: マニュアルでは、除雪車が赤、琥珀色、または緑色のライトを点滅させているときは、少なくとも200フィートの距離を空けるようアドバイスしています。
- id: 111
  category: sharing_the_road
  question: 高速道路上やその周辺で家畜に遭遇した際、クラクションを鳴らすのを避けるべきなのはなぜですか？
  choices:
    A: 田舎道でクラクションを使用することは違法だから。
    B: 動物を驚かせてしまう可能性があるから。
    C: 農家が農機具を完全に停止させてしまうから。
    D: 地域の騒音規制に抵触するから。
  answer: B
  explanation: 家畜に遭遇した際は、進路を譲り、動物を驚かせないようクラクションを鳴らしてはいけません。
- id: 112
  category: defensive_driving
  question: 道路の脇に停車している車両を見つけた場合、どのようにして後続車に警告できますか？
  choices:
    A: ハイビームを点灯させる。
    B: クラクションを2回鳴らす。
    C: ブレーキペダルを3、4回軽く踏む。
    D: 隣の車線へ少しはみ出すように走る。
  answer: C
  explanation: 道路脇に停車している車両を見つけた場合は、ブレーキペダルを3、4回軽く踏んで（ポンピングブレーキ）、後続車に警告してください。
- id: 113
  category: vehicle_information
  question: 緊急時にアンチロック・ブレーキ・システム（ABS）を使用する正しい方法は何ですか？
  choices:
    A: 停車するまで、ゆっくりとブレーキを数回踏む。
    B: ブレーキペダルを強く、一定の圧力で踏み続ける。
    C: 車輪のロックを防ぐため、ブレーキを繰り返し軽く踏む。
    D: ブレーキペダルを軽く踏み、ハンドルを急に切る。
  answer: B
  explanation: 緊急時にABSを使用する正しい方法は、車両が停止するか危険が去るまで、ブレーキペダルを強く一定の圧力で踏み続けることです。
- id: 114
  category: driver_responsibility
  question: 物損被害が少なくともいくら以上の場合、警察に事故を報告しなければなりませんか？
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: $1,000以上の物損被害がある場合、警察に事故を報告する必要があります。
- id: 115
  category: driver_responsibility
  question: 公共物（標識やガードレールなど）に少なくともいくら以上の損害を与えた場合、警察への事故報告が義務付けられていますか？
  choices:
    A: $100
    B: $200
    C: $500
    D: $1,000
  answer: B
  explanation: $200以上の公共物への損害がある場合、警察に事故を報告しなければなりません。
- id: 116
  category: safe_driving_rules
  question: 滑りやすい冬の道を運転する際、使用すべきではない車両機能は何ですか？
  choices:
    A: ヘッドライト
    B: ワイパー
    C: デフロスター（除霜装置）
    D: クルーズコントロール
  answer: D
  explanation: マニュアルの冬道運転のヒントには、「滑りやすい道路ではクルーズコントロールを使用しないでください」と明記されています。
- id: 117
  category: defensive_driving
  question: 走行中にタイヤがパンク（破裂）した場合、まず何をすべきですか？
  choices:
    A: すぐにブレーキを強く踏む。
    B: ギアをニュートラルに入れる。
    C: ハンドルをしっかり握り、車両を直進させる。
    D: ブレーキペダルを数回踏む。
  answer: C
  explanation: タイヤがパンクした場合は、ハンドルをしっかり握って直進を保ち、アクセルペダルから足を離して、少しずつ速度を落としてください。
- id: 118
  category: defensive_driving
  question: 走行中にアクセルペダルが戻らなくなった場合、どのように対処するのが適切ですか？
  choices:
    A: 道路から目を離さず、ギアをニュートラルに入れる。
    B: 走行中であっても、すぐにエンジンを切る。
    C: パーキングブレーキを力いっぱい引く。
    D: 戻るまでアクセルペダルを繰り返し踏む。
  answer: A
  explanation: アクセルペダルが戻らなくなった場合は、道路から目を離さずにギアをニュートラルに入れ、安全を確認して路肩に寄せてからエンジンを切ってください。
- id: 119
  category: alcohol_drugs_health
  question: 21歳未満の運転者に許容される法定アルコール濃度はいくらですか？
  choices:
    A: 0.08%
    B: 0.04%
    C: 0.02%
    D: 0.00%
  answer: D
  explanation: 21歳未満の運転者に許容される法定アルコール濃度は0.00%です。つまり、体内に一切のアルコールがない状態で運転しなければなりません。
- id: 120
  category: penalties_and_points
  question: 黙示の同意法（Implied Consent Law）に基づき、アルコール濃度（PAC）テストの受検を拒否した場合、どうなりますか？
  choices:
    A: 警告を受け、そのまま運転して帰宅できる。
    B: 少なくとも1年間、運転免許の効力が停止される。
    C: 免許証に6点の減点（デメリットポイント）が科される。
    D: 筆記試験の再受験を求められる。
  answer: B
  explanation: PACテストを拒否した場合、警察官は黙示の同意法違反であなたを逮捕しなければならず、少なくとも1年間は運転免許の効力を失うことになります。
- id: 121
  category: safe_driving_rules
  question: 練習許可証（Instruction permit）および試用免許（Probationary license）の保持者が、運転中に携帯電話を使用できるのはどのような時ですか？
  choices:
    A: ハンズフリー機器を使用している時
    B: 緊急事態を報告する場合のみ
    C: 赤信号で停止している時
    D: GPSの経路案内を読んでいる時
  answer: B
  explanation: 練習許可証および試用免許の保持者は、緊急事態を報告する場合にのみ携帯電話を使用できます。
- id: 122
  category: sharing_the_road
  question: 赤色灯を点灯させサイレンを鳴らして道路脇に停車している警察車両に近づく場合、どうしなければなりませんか？
  choices:
    A: 直ちに走行車線で停止し、車両が立ち去るのを待つ
    B: 通過することを知らせるためにクラクションを鳴らす
    C: 停車車両から離れた方の車線に移動するか、減速する
    D: 現場を素早く通り過ぎるために加速する
  answer: C
  explanation: 赤色灯を点灯させサイレンを鳴らして道路脇に停車している警察車両を見かけた場合は、車線を移動するか減速することが法律で義務付けられています。緊急車両がライトを点滅させて停車している場所に近づく際は、停車車両に最も近い車線以外の車線に移動するようにしてください。
- id: 123
  category: sharing_the_road
  question: スクールバスが赤色灯を点滅させて停車している場合、少なくとも何フィート離れて停止しなければなりませんか？
  choices:
    A: 少なくとも10フィート
    B: 少なくとも15フィート
    C: 少なくとも20フィート
    D: 少なくとも50フィート
  answer: C
  explanation: スクールバスが赤色灯を点滅させて停車している場合、バスから少なくとも20フィート離れた場所で停止する必要があります。
- id: 124
  category: sharing_the_road
  question: 赤色灯を点滅させているスクールバスに対して、停止する必要が「ない」のはどのような状況ですか？
  choices:
    A: 多車線道路でバスと同じ方向に走行している時
    B: 中央分離帯のある道路（Divided highway）で、バスとは反対側の車線にいる時
    C: 緊急の用事で遅れている時
    D: バスの外に子供が見当たらない時
  answer: B
  explanation: 中央分離帯のある道路（Divided highway）を走行しており、スクールバスと同じ側にいない場合は、停止する必要はありません。中央分離帯のある道路とは、反対方向に進む車線の間に障壁がある道路のことです。
- id: 125
  category: sharing_the_road
  question: 自転車を追い越す際、どれくらいの距離を空けなければなりませんか？
  choices:
    A: 少なくとも1フィート
    B: 少なくとも2フィート
    C: 少なくとも3フィート
    D: 少なくとも5フィート
  answer: C
  explanation: 自転車を追い越す際は、少なくとも3フィートの距離を空けてください。
- id: 126
  category: sharing_the_road
  question: 大型トラックと道路を共有する際の「ノー・ゾーン（No-Zone）」とは何ですか？
  choices:
    A: トラックの走行が禁止されている指定車線
    B: 大型トラックの後方約200フィート、前方約20フィートの、運転手から見えないエリア
    C: 商用車が減速しなければならない学校近くの区域
    D: 中央分離帯のある道路で追い越しが禁止されているエリア
  answer: B
  explanation: ノー・ゾーン（No-Zone）とは、大型車両の運転手からあなたの車が見えない場所のことです。このエリアは、大型トラックの後方約200フィート、前方約20フィートに及びます。
- id: 127
  category: penalties_and_points
  question: 12ヶ月の期間内に何ポイントの違反点数（Demerit points）が累積すると、運転免許の停止または取り消しの対象となりますか？
  choices:
    A: 6ポイント以上
    B: 8ポイント以上
    C: 10ポイント以上
    D: 12ポイント以上
  answer: D
  explanation: 12ヶ月の期間内に12ポイント以上の違反点数が累積すると、運転ができなくなります。運転免許は停止または取り消されます。
- id: 128
  category: penalties_and_points
  question: 試用免許（Probationary license）を保持している場合、2回目の交通違反で有罪となった際、違反点数はどうなりますか？
  choices:
    A: 点数が半分に減らされる
    B: 点数が2倍になる
    C: 安全講習を受ければ点数が抹消される
    D: 点数は変わらないが、罰金が2倍になる
  answer: B
  explanation: 試用免許、身分証明書（IDカード）、または免許を保持していない場合、点数は2倍になります。これらの点数は、2回目以降の有罪判決時に2倍として計算されます。
- id: 129
  category: penalties_and_points
  question: 常習的交通違反者（Habitual traffic offender）とは、どのくらいの期間内に4回以上の重大な交通違反、または12回以上の軽微な違反で有罪判決を受けた人のことですか？
  choices:
    A: 1年間
    B: 3年間
    C: 5年間
    D: 10年間
  answer: C
  explanation: 常習的違反者とは、5年以内に4回以上の重大な交通違反、または12回以上の軽微な違反で有罪判決を受けた人のことを指します。
- id: 130
  category: license_system
  question: 就労・生活用限定免許（Occupational license）では、仕事、通学、および家事維持のために、週に最大何時間まで運転が認められていますか？
  choices:
    A: 20時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: D
  explanation: 就労・生活用限定免許では、仕事、通学、および生活を維持するために必要な場所への往復として、1日最大12時間、週に最大60時間までの運転が認められています。
- id: 131
  category: safe_driving_rules
  question: ウィスコンシン州の法律では、車内の誰にシートベルトの着用が義務付けられていますか？
  choices:
    A: 運転者と助手席の乗員のみ
    B: 18歳未満の乗員のみ
    C: 運転者および年齢を問わずすべての乗員
    D: エアバッグのない車両の乗員のみ
  answer: C
  explanation: ウィスコンシン州の法律では、運転者および年齢を問わずすべての乗員がシートベルト（安全ベルト）を着用することが義務付けられています。
- id: 132
  category: vehicle_information
  question: 車両にエアバッグが装備されている場合でも、シートベルトを着用する必要がありますか？
  choices:
    A: いいえ、エアバッグがシートベルトの代わりになります。
    B: はい、車両にエアバッグがあってもシートベルトを着用する必要があります。
    C: 高速道路を走行する場合のみ必要です。
    D: 後部座席の乗員のみ着用する必要があります。
  answer: B
  explanation: マニュアルには「車両にエアバッグが装備されている場合でも、シートベルトを着用する必要があります」と記載されています。シートベルトは、車両を制御できる位置に体を固定し、怪我を防ぐのに役立ちます。
- id: 133
  category: safe_driving_rules
  question: シートベルトの腰ベルト（ラップベルト）はどのように装着すべきですか？
  choices:
    A: 太ももの上で緩めに
    B: 腹部を横切るようにぴったりと
    C: 腹部のすぐ下の腰骨を横切るようにぴったりと
    D: ウエストの高い位置に
  answer: C
  explanation: 腰ベルトは、腹部のすぐ下の腰骨を横切るようにぴったりとフィットさせる必要があります。
- id: 134
  category: safe_driving_rules
  question: 肩ベルト（ショルダーベルト）の正しい着用方法は何ですか？
  choices:
    A: 快適さのために脇の下に通す
    B: 胸を横切るようにし、ベルトと胸の間に拳が入る程度の隙間を作る
    C: 肩の上に緩くかける
    D: 首に擦れる場合は背中の後ろに通す
  answer: B
  explanation: 肩ベルトは胸を横切るように着用してください。ベルトと胸の間に拳が入る程度に調整します。肩ベルトを脇の下に通してはいけません。
- id: 135
  category: safe_driving_rules
  question: 一般的に、子供がチャイルドシートからジュニアシート（ブースターシート）に移行できるのは何歳からですか？
  choices:
    A: 2歳
    B: 4歳
    C: 6歳
    D: 8歳
  answer: B
  explanation: 一般的に、子供は4歳になるまでチャイルドシートを使用し、8歳になるまでジュニアシート（ブースターシート）を使用する必要があります。
- id: 136
  category: safe_driving_rules
  question: 一般的に、子供は何歳になるまでジュニアシート（ブースターシート）を使用し続ける必要がありますか？
  choices:
    A: 4歳
    B: 6歳
    C: 8歳
    D: 10歳
  answer: C
  explanation: 一般的に、子供は4歳になるまでチャイルドシートを使用し、8歳になるまでジュニアシート（ブースターシート）を使用する必要があります。
- id: 137
  category: driver_responsibility
  question: ウィスコンシン州で運転するために必要な自動車保険の種類は何ですか？
  choices:
    A: 総合保険（コンプリヘンシブ）
    B: 車両保険（コリジョン）
    C: 有効な賠償責任保険（ライアビリティ）
    D: 無保険車傷害保険のみ
  answer: C
  explanation: ウィスコンシン州で運転するには、有効な賠償責任保険（ライアビリティ保険）に加入している必要があり、警察官に求められた場合はその証明を提示しなければなりません。
- id: 138
  category: driver_responsibility
  question: 他人の車を運転する場合、その車両に保険がかかっていることを確認するのは誰の責任ですか？
  choices:
    A: 車両所有者の責任
    B: 運転者としてのあなたの責任
    C: 保険会社の責任
    D: DMV（陸運局）の責任
  answer: B
  explanation: 他人の車を運転する場合、その車に保険がかかっていることを確認するのは運転者であるあなたの役目です。
- id: 139
  category: license_system
  question: 見えない障害（インビジブル・ディサビリティ）をDMVに報告することを選択した場合、その開示情報にアクセスできるのは誰ですか？
  choices:
    A: 保険会社のみ
    B: 一般公衆
    C: 法執行官およびウィスコンシン州運輸省（WisDOT）の職員
    D: 医療専門家のみ
  answer: C
  explanation: あなたが行った開示情報は、法執行官およびウィスコンシン州運輸省（WisDOT）の職員が利用できるようになります。
- id: 140
  category: license_system
  question: ウィスコンシン州で投票用の無料IDカードの申請プロセスを開始するための最低年齢と市民権の要件は何ですか？
  choices:
    A: 16歳かつ米国市民
    B: 17歳かつ米国市民
    C: 18歳かつ米国市民
    D: 18歳かつ永住権保持者
  answer: B
  explanation: 投票用の無料IDを申請するプロセスを開始するには、17歳以上かつ米国市民である必要があります。
- id: 141
  category: driver_responsibility
  question: 18歳以上で臓器・組織提供者として登録した場合、誰がその決定を覆すことができますか？
  choices:
    A: 両親
    B: 配偶者
    C: 医師
    D: 誰もその決定を覆すことはできない
  answer: D
  explanation: 18歳以上の場合、臓器・組織提供者になるというあなたの決定は、家族や他のいかなる人物によっても覆されることはありません。
- id: 142
  category: vehicle_information
  question: タイヤの空気圧が低いと、車両にどのような影響を与えますか？
  choices:
    A: 燃費が向上する。
    B: 燃費が悪化する。
    C: 制動距離が改善される。
    D: エンジンの摩耗を防ぐ。
  answer: B
  explanation: タイヤの空気圧が低いと、燃費が悪化します。
- id: 143
  category: defensive_driving
  question: 燃料とブレーキの節約に役立つ運転習慣はどれですか？
  choices:
    A: 渋滞の中でのストップ・アンド・ゴー走行
    B: 少しずつ減速する
    C: 交差点で急ブレーキをかける
    D: 低いタイヤ空気圧で運転する
  answer: B
  explanation: 少しずつ減速することは、燃料とブレーキの節約に役立ちます。
- id: 144
  category: license_system
  question: 運転教育助成プログラム（Driver Education Grant Program）の目的は何ですか？
  choices:
    A: 安全運転者の大学授業料を支払うため
    B: 低所得世帯に無料の車両を提供するため
    C: 収入要件を満たすティーンエイジャーの学科および/または実技教習の費用を支払うため
    D: 運転者に自動車保険料を払い戻すため
  answer: C
  explanation: 運転教育助成プログラムは、収入要件を満たすティーンエイジャーが、州の負担で学科および/または実技（behind-the-wheel）の運転教習を受けられるようにするものです。
- id: 145
  category: alcohol_drugs_health
  question: 運転に影響を与える可能性のある健康上の問題がある場合、どうすべきですか？
  choices:
    A: 誰にも知らせずに運転を完全にやめる。
    B: 健康状態をDMV（陸運局）に報告する。
    C: 保険会社にのみ伝える。
    D: 免許の有効期限が切れるまで言わずに待つ。
  answer: B
  explanation: 多くの健康上の問題が運転に影響を与える可能性があります。運転に影響を及ぼす可能性のある健康状態については、DMVに報告する必要があります。
- id: 146
  category: safe_driving_rules
  question: 速度制限の標識がない市や村の郊外における最高速度制限は何マイルですか？
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: マニュアルの練習問題によると、速度制限の標識がない市や村の郊外における最高速度制限は35 mphです。
- id: 147
  category: driver_responsibility
  question: 重大な自動車事故に巻き込まれた場合、義務付けられている行動は次のうちどれですか？
  choices:
    A: 直ちに現場を離れる
    B: 相手の運転手が助けを呼ぶのを待つ
    C: 負傷者がいないか確認する
    D: 乗客の確認をする前に車両を移動させる
  answer: C
  explanation: マニュアルには、重大な自動車事故に巻き込まれた場合、停車し、負傷者がいないか確認し、911に通報しなければならないと記載されています。
- id: 148
  category: driver_responsibility
  question: 重大な自動車事故に巻き込まれた場合、どの番号に電話すべきですか？
  choices:
    A: '311'
    B: '411'
    C: '511'
    D: '911'
  answer: D
  explanation: 重大な自動車事故に巻き込まれた場合、マニュアルでは停車し、負傷の有無を確認し、911に電話するように指示しています。
- id: 149
  category: safe_driving_rules
  question: 交差点で左折する場合、誰に道を譲らなければなりませんか？
  choices:
    A: 追い越し車のみ
    B: 直進または右折してくる対向車
    C: 反対方向から左折してくる車両
    D: 特に誰もいない
  answer: B
  explanation: 左折する運転者は、直進または右折してくる対向車に道を譲らなければなりません。
- id: 150
  category: safe_driving_rules
  question: 霧の中を運転する際、どの種類のヘッドライトを使用すべきですか？
  choices:
    A: ハイビーム
    B: ロービーム
    C: パーキングライト（車幅灯）のみ
    D: ハザードランプ
  answer: B
  explanation: 霧、激しい雨、または雪の中を運転するときは、ロービームを使用する必要があります。
- id: 151
  category: safe_driving_rules
  question: 激しい雨や雪の中を走行する場合、どのライトを使用するのが適切ですか？
  choices:
    A: ロービーム
    B: ハイビーム
    C: ドライビングライトのみ
    D: 車内灯
  answer: A
  explanation: 霧、激しい雨、または雪の中を走行するときは、ロービームを使用する必要があります。
- id: 152
  category: signs_and_signals
  question: 黄色の点滅信号がある交差点に近づいたとき、どのように対応すべきですか？
  choices:
    A: 青信号になるのを待つ
    B: 交差点を通過する前に完全に停止する
    C: 素早く交差点を通過するために加速する
    D: 速度を落とし、注意して進む
  answer: D
  explanation: 黄色の点滅信号がある交差点に近づくときは、速度を落とし、注意して進まなければなりません。
- id: 153
  category: signs_and_signals
  question: 対向車線を分ける黄色の一本の破線は何を示していますか？
  choices:
    A: 車線が同じ方向に進んでいること
    B: いかなる状況でも追い越しは禁止されていること
    C: 車線が反対方向に進んでおり、安全であれば追い越しが可能であること
    D: 線を越える前に停止しなければならないこと
  answer: C
  explanation: 黄色の一本の破線は、車線が反対方向に進んでおり、安全であれば追い越しが可能であることを意味します。
- id: 154
  category: signs_and_signals
  question: 反対方向に進む交通を分けている線の色は何色ですか？
  choices:
    A: 白
    B: 黄色
    C: 赤
    D: 青
  answer: B
  explanation: 黄色の一本の破線は、車線が反対方向に進んでいる交通を分けます。
- id: 155
  category: safe_driving_rules
  question: 州間高速道路（インターステート）へ合流する際の適切な手順は何ですか？
  choices:
    A: 高速道路に入る前に必ず停止する
    B: 安全な車間の隙間を選び、交通の流れの中に合流する
    C: 一度に2車線分を合流し、加速する
    D: 他のドライバーが譲るように、強引に交通の流れに割り込む
  answer: B
  explanation: 州間高速道路に合流するときは、安全な車間の隙間を選び、交通の流れの中に合流する必要があります。
- id: 156
  category: safe_driving_rules
  question: 標識に表示されている制限速度を超えて運転してもよいのは、どのような条件下ですか？
  choices:
    A: 自分の車線に他の車が見当たらない場合
    B: 安全な状況である限り
    C: 他の車両を追い越すとき
    D: いかなる場合も認められない
  answer: D
  explanation: マニュアルの練習問題によると、標識の制限速度を超えて運転してよいことは決してありません。
- id: 157
  category: defensive_driving
  question: 運転中、道路のどのくらい先まで前方を見るべきですか？
  choices:
    A: 1〜2ブロック先
    B: 200〜250ヤード先
    C: 10〜15秒先
    D: 5〜8秒先
  answer: C
  explanation: 運転中は、道路の10〜15秒先を見る必要があります。
- id: 158
  category: sharing_the_road
  question: 自転車を追い越したいときに、対向車が近づいてきている場合はどうすべきですか？
  choices:
    A: 対向車が来る前に自転車を追い越すために加速する
    B: 自転車に道を譲るようクラクションを鳴らす
    C: 速度を落として対向車を通過させてから、自転車を追い越す
    D: 路肩に寄せて完全に停止する
  answer: C
  explanation: 自転車を追い越そうとしているときに対向車がいる場合は、速度を落として対向車を通過させてから、自転車を追い越すべきです。
- id: 159
  category: safe_driving_rules
  question: 夜間の運転において推奨される安全策は何ですか？
  choices:
    A: 常にハイビームを使用する
    B: 対向車のヘッドライトを直視する
    C: テールランプが見えるように前方の車両に近づいて走行する
    D: 車間距離を長く取る
  answer: D
  explanation: 夜間に運転するときは、車間距離を長く取る必要があります。
- id: 160
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 速度を落とし、注意して進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「止まれ（STOP）」の標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に、交通状況と歩行者を確認してください。
  image: stop.png
- id: 161
  category: signs_and_signals
  question: この標識は何をすることを求めていますか？
  choices:
    A: 完全停止する
    B: 加速して交通の流れに合流する
    C: 徐行し、他の車両や歩行者に優先権を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「譲れ（YIELD）」の標識は、徐行して他の車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  image: yield.png
- id: 162
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターンする
    B: 注意して走行を続ける
    C: 停止して後退するか、引き返す — あなたは逆走しています
    D: その区域を素早く立ち去るために加速する
  answer: C
  explanation: 赤と白の「進入禁止（WRONG WAY）」の標識は、一方通行の道路や高速道路のランプを交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に引き返すか後退してください。
  image: wrong_way.png
- id: 163
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が禁止されていることを意味します。
  image: no_left_turn.png
- id: 164
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。速度制限の標識は、理想的な条件下でのその区域の法定最高速度を示しています。
  image: speed_limit_25.png
- id: 165
  category: signs_and_signals
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園やサファリパークがある
    B: この付近でシカが頻繁に道路を横断する
    C: この先が狩猟区域である
    D: 近くに野生動物保護区がある
  answer: B
  explanation: シカのシルエットが描かれた黄色いひし形の標識は、この付近でシカが頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  image: deer_crossing.png
- id: 166
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは通学路の横断歩道
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路の横断歩道を示しています。速度を落とし、子供に注意してください。
  image: school_zone.png
- id: 167
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型の鉄道クロバック（crossbuck）標識は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  image: railroad_crossbuck.png
- id: 168
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: 曲がり方が緩やかであることを示している
    B: より大幅な減速が必要な急カーブを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（角度の急な矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。このカーブの手前では、より大幅に速度を落とす必要があります。
  image: sharp_turn_right.png
- id: 169
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 中央分離帯のある道路の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって反対車線と仕切られた「中央分離帯のある道路（divided highway）」になることを警告しています。右側を通行してください。
  image: divided_highway.png
- id: 170
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転手
  answer: C
  explanation: 車椅子のシンボルが描かれた青い標識は、障害者のために予約された駐車スペースを示しています。有効な障害者用駐車許可証またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反には高額な罰金が科せられます。
  image: handicap_parking.png
- id: 171
  category: driver_responsibility
  question: ハンドブックの冒頭の書簡によると、ウィスコンシン州巡回警察（Wisconsin State Patrol）の主な責務は何ですか？
  choices:
    A: 安全な高速道路の設計とエンジニアリング。
    B: 運転免許証および学習許可証の発行。
    C: 公衆への啓発と交通法規の執行。
    D: 新規ドライバー向けのオンライン練習テストの提供。
  answer: C
  explanation: ハンドブックには、「ウィスコンシン州巡回警察は、道路規則について公衆を啓発し、ウィスコンシン州の交通法規を執行します」と記載されています。
- id: 172
  category: driver_responsibility
  question: ハンドブックには、人身売買が発生する可能性のある一般的な場所がいくつか挙げられています。具体的に言及されている場所は次のうちどれですか？
  choices:
    A: 公共図書館
    B: 映画館
    C: ショッピングモール
    D: トラックストップ
  answer: D
  explanation: マニュアルには、人身売買は「ホテルやモーテル、トラックストップ、休憩所、カジノ、レストラン、ネイルサロン、農場など」を含む場所で発生する可能性があると記載されています。
- id: 173
  category: safe_driving_rules
  question: 目次によると、セクション8「緊急時の対応（Handling Emergencies）」で扱われているトピックは次のうちどれですか？
  choices:
    A: 居眠り運転
    B: 路上での緊急事態
    C: ラウンドアバウト
    D: 冬の運転
  answer: B
  explanation: 目次には、セクション8「緊急時の対応（Handling Emergencies）」に「路上での緊急事態（Roadside Emergencies）」というトピックが含まれていることが示されています。
- id: 174
  category: safe_driving_rules
  question: 目次に基づくと、悪天候時の運転に関する情報を確認するには、ハンドブックのどのセクションを参照すればよいですか？
  choices:
    A: セクション3：基本事項（The Basics）
    B: セクション5：信号、路面標示、車線制御（Signals, Pavement Markings and Lane Controls）
    C: セクション7：運転条件（Driving Conditions）
    D: セクション9：危険な運転行動（Dangerous Driving Behaviors）
  answer: C
  explanation: 目次では、セクション7「運転条件（Driving Conditions）」の下に「悪天候（Severe Weather）」がトピックとして記載されています。
- id: 175
  category: driver_responsibility
  question: ハンドブックに記載されている全米人身売買ホットライン（National Human Trafficking Hotline）の電話番号は何番ですか？
  choices:
    A: '911'
    B: 1-800-SAFE-RIDE
    C: 1-888-3737-888
    D: '511'
  answer: C
  explanation: ハンドブックには、助けが必要な場合や情報提供を行いたい場合のための全米人身売買ホットラインの番号として、1-888-3737-888が記載されています。
- id: 176
  category: signs_and_signals
  question: 目次によると、ダイバージング・ダイヤモンド・インターチェンジ（DDI）に関する情報はどのセクションにありますか？
  choices:
    A: セクション3：基本事項（The Basics）
    B: セクション4：標識（Signs）
    C: セクション6：運転状況（Driving Situations）
    D: セクション8：緊急時の対応（Handling Emergencies）
  answer: C
  explanation: 目次では、セクション6「運転状況（Driving Situations）」の下に「ダイバージング・ダイヤモンド・インターチェンジ（DDI）」が記載されています。
- id: 177
  category: alcohol_drugs_health
  question: 居眠り運転の危険性に関する具体的な情報は、ハンドブックのどのセクションにありますか？
  choices:
    A: セクション1：運転免許試験の要件
    B: セクション7：運転条件
    C: セクション8：緊急時の対応
    D: セクション9：危険な運転行動
  answer: D
