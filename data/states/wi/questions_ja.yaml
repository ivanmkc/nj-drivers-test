- id: 209
  category: license_system
  question: ウィスコンシン州に転入し、以前の州の運転免許証がREAL IDであった場合、ウィスコンシン州のREAL IDを取得するにはどうすればよいですか？
  choices:
    A: REAL IDのステータスは自動的に引き継がれる。
    B: 以前のREAL IDカードを提示するだけでよい。
    C: ウィスコンシン州で、認められているすべての書類を再度提示しなければならない。
    D: 申請する前に60日間待たなければならない。
  answer: C
  explanation: 他の州のREAL IDが引き継がれるかどうかという問いに対し、マニュアルでは「いいえ。ウィスコンシン州に認められているすべての書類を提示する必要があります」と回答しています。
- id: 210
  category: license_system
  question: 16歳以上の練習許可証（Instruction Permit）保持者の場合、どのような条件下で、助手席以外の席にもう1人同乗させることができますか？
  choices:
    A: その人物が近親者である場合。
    B: その人物も資格のある教官である場合。
    C: その人物が免許を保持しており、25歳以上で、少なくとも2年の運転経験がある場合。
    D: 追加の同乗者は一切認められない。
  answer: C
  explanation: マニュアルには次のように記されています。「16歳以上の場合、同乗する免許保持者に加えて、25歳以上で少なくとも2年の運転経験がある別の免許保持者1名が、助手席以外の席に同乗することができます。」
- id: 211
  category: driver_testing
  question: 18歳未満で運転教育プログラムに登録している場合、学習許可証（instruction permit）を申請する前に、実技教習所から提供される署名済みの書類は何ですか？
  choices:
    A: 学校の成績表
    B: 修了証明書
    C: ウィスコンシン州運転免許証（DL）申請書 MV3001
    D: 保護者の同意書 MV2002
  answer: C
  explanation: マニュアルには、「実技教習所から署名済みのウィスコンシン州運転免許証（DL）申請書 MV3001が提供されます。学習許可証を申請する前に、これを完了させておく必要があります」と記載されています。
- id: 212
  category: license_system
  question: 午前5時から深夜0時までの間に試用免許（probationary license）で運転している際、同乗が許可されている近親者の人数は何人ですか？
  choices:
    A: 1人のみ
    B: 両親のみ
    C: 人数制限なし
    D: 1人が親であれば2人まで
  answer: C
  explanation: マニュアルでは、午前5時から深夜0時まで、GDL（段階的運転免許制度）保持者は「人数に関わらず近親者を同乗させることができる」と規定されています。
- id: 213
  category: license_system
  question: 学習許可証（instruction permit）保持者に同乗する資格を持つ指導員の最低年齢は何歳ですか？
  choices:
    A: 18歳
    B: 19歳
    C: 21歳
    D: 25歳
  answer: B
  explanation: 助手席に座る人物は、「19歳以上の資格を持つ指導員...」のいずれかである必要があります。
- id: 214
  category: driver_testing
  question: 試用免許（probationary license）を取得するためには、未成年者は合計50時間以上の監督下での運転練習を完了する必要があります。そのうち、日中に練習しなければならないのは何時間ですか？
  choices:
    A: 10時間
    B: 25時間
    C: 40時間
    D: 50時間
  answer: C
  explanation: マニュアルでは、運転者は「日中に少なくとも40時間、夜間に10時間（合計50時間）の運転練習を行うこと」を求めています。
- id: 215
  category: license_system
  question: 普通運転免許の有効期限が切れる年の誕生日の何日前に、DMVから更新通知が届きますか？
  choices:
    A: 10日から20日前
    B: 30日前
    C: 45日から60日前
    D: 90日前
  answer: C
  explanation: マニュアルには、「運転免許証が失効する年の誕生日の45日から60日前に、更新通知が届きます」と記載されています。
- id: 216
  category: driver_testing
  question: マニュアルに記載されている、スポンサー（保護者など）が練習生の運転練習時間を記録するために使用できるモバイルアプリの名前は何ですか？
  choices:
    A: DMV Drive
    B: RoadReady
    C: WI Practice Log
    D: GDL Tracker
  answer: B
  explanation: マニュアルでは、スポンサーは運転記録ログを印刷するか、「またはRoadReadyモバイルアプリをダウンロードすることもできる」と提案しています。
- id: 217
  category: driver_testing
  question: 18歳以上の人が学習許可証（instruction permit）を取得するには、何をしなければなりませんか？
  choices:
    A: 運転教育プログラムに登録する。
    B: 知識試験、標識試験、および視力検査に合格する。
    C: まず50時間の監督下での運転を完了する。
    D: 申請書にスポンサーの署名をもらう。
  answer: B
  explanation: マニュアルには、「18歳以上の場合は、知識試験、道路標識試験、および視力検査に合格することから始めることができます」と記載されています。未成年者とは異なり、運転教育プログラムへの登録は義務付けられていません。
- id: 218
  category: license_system
  question: 2025年5月7日以降、米国内の飛行機への搭乗や連邦政府施設への訪問に必要となる身分証明書の種類は何ですか？
  choices:
    A: 有効な州発行の運転免許証であればどれでもよい
    B: 写真付きの運転免許証
    C: REAL ID準拠の免許証、またはパスポートなどの他の受け入れ可能な形態
    D: 車両登録証
  answer: C
  explanation: マニュアルには、2025年5月7日以降、米国内の飛行機への搭乗や連邦政府施設への訪問には、REAL ID準拠の身分証明書を提示する（またはパスポートなどの他の受け入れ可能な身分証明書を提示する）ことが義務付けられると記載されています。
- id: 219
  category: driver_responsibility
  question: 運転免許証以外に、運転前に車内に備え付けておくべき2つの書類は何ですか？
  choices:
    A: 車両所有権証（タイトル）とオーナーズマニュアル
    B: 保険加入証明書と車両登録証
    C: 出生証明書と社会保障カード
    D: 直近の車両点検レポートと地図
  answer: B
  explanation: セクション3では、運転前に、有効な運転免許証、保険加入証明書、および車両登録証を所持していることを確認する必要があると述べています。
- id: 220
  category: safe_driving_rules
  question: 「4秒間の車間距離ルール」を使用している際、「1004（ワン・サウザンド・フォー）」と数え終わる前に、目印にした静止物に到達してしまいました。これは何を意味していますか？
  choices:
    A: 状況に対して運転速度が遅すぎる。
    B: 安全な車間距離を保っている。
    C: 前方の車両が予期せず減速した。
    D: 速度が速すぎるか、車間距離が近すぎる。
  answer: D
  explanation: マニュアルでは、「1004」と言い終わる前にその物に到達してしまった場合は、速度が速すぎると説明されています。
- id: 221
  category: safe_driving_rules
  question: 「4秒車間距離ルール」に従い、雨や雪などの悪条件下ではどのような調整を行うべきですか？
  choices:
    A: カウントを2秒に減らす。
    B: 状況に関係なく4秒のカウントを維持する。
    C: 悪条件ごとに1秒追加する。
    D: 晴天時のみこのルールを使用する。
  answer: C
  explanation: マニュアルには、車間距離ルールを使用する際、「交通渋滞、雨、雪、氷などの悪条件ごとに1秒追加する」と記載されています。
- id: 222
  category: safe_driving_rules
  question: 多車線道路で、他の多くの交通の流れよりも遅い速度で走行する場合、どの車線を使用すべきですか？
  choices:
    A: 一番左の車線
    B: 中央車線
    C: 一番右の車線
    D: どの車線でもよい
  answer: C
  explanation: マニュアルでは、「他の交通よりも遅く走る場合は、多車線道路の一番右の車線を走行してください」とアドバイスしています。
- id: 223
  category: penalties_and_points
  question: スピード違反に加えて、マニュアルで明示的に違法とされている2つの運転行為は何ですか？
  choices:
    A: 惰性走行と車間距離保持義務違反（あおり運転）
    B: レース（競走）と無謀運転
    C: 低速走行と合図不履行
    D: 急な合流と頻繁な車線変更
  answer: B
  explanation: 本文には、「レース（競走）と無謀運転は許可されておらず、違法です」と記載されています。
- id: 224
  category: safe_driving_rules
  question: 交通の流れに合流するとき、何を避けるために周囲と同じ速度で進入すべきですか？
  choices:
    A: スピード違反の切符を切られること
    B: 燃料を使いすぎること
    C: 他のドライバーに速度や方向の変更を強いること
    D: 出口を通り過ぎること
  answer: C
  explanation: マニュアルには、「合流によって他のドライバーに速度や方向の変更を強いることを避けてください」と記載されています。
- id: 225
  category: vehicle_information
  question: 減速車線（オフランプ）の主な機能は何ですか？
  choices:
    A: 高速道路に入る前に車両を加速させるため。
    B: 緊急駐車用のスペースを提供するため。
    C: 高速道路を出る際に交通が徐々に減速できるようにするため。
    D: 高速道路でのUターン車線として機能するため。
  answer: C
  explanation: マニュアルでは、「減速車線（オフランプ）では交通が減速します。ここが、あなたも徐々に減速する場所です」と説明されています。
- id: 226
  category: signs_and_signals
  question: マニュアルでは、交差点を2つの地点が交わる場所と定義しています。交差点の例として挙げられているのは次のうちどれですか？
  choices:
    A: 道路の急カーブ
    B: ドライブウェイ（私道）や駐車場の入り口
    C: 橋や跨線橋
    D: 指定された休憩所
  answer: B
  explanation: セクション3では交差点を定義しており、「これには交差する通り、ドライブウェイ、駐車場の入り口、鉄道踏切が含まれます」と述べています。
- id: 227
  category: defensive_driving
  question: 木、建物、または駐車車両によって交差点の視界が遮られている場合、どのように進むべきですか？
  choices:
    A: クラクションを鳴らして素早く進む。
    B: 完全に停止し、他の車が先に行くのを待つ。
    C: 低速で接近し、注意しながら前進する。
    D: ハイビームを点灯して他のドライバーに警告する。
  answer: C
  explanation: マニュアルでは、「視界が遮られた交差点には低速で接近してください。見えない場合は、注意しながら前進してください」とアドバイスしています。
- id: 228
  category: defensive_driving
  question: 脇見運転による事故を避けるために、マニュアルがドライバーに見ないよう警告している特定の路上活動は何ですか？
  choices:
    A: 看板や広告
    B: 珍しい建築物や景色
    C: 警察に止められているドライバー
    D: 道路の近くで草を食べている動物
  answer: C
  explanation: マニュアルには、「警察に止められているドライバーやその他の路上活動を見ないでください。これは事故の原因となる可能性があります」と記載されています。
- id: 229
  category: sharing_the_road
  question: 他の車両がすぐ隣の車線を走行している場合、自車の周囲に安全なスペースクッションを維持するために何をすべきですか？
  choices:
    A: 加速して素早くその車の前に出る。
    B: クラクションを鳴らして移動させる。
    C: 同じ位置を維持し、相手を追い越させる。
    D: 安全なときに、その車両の前に出るか後ろに下がる。
  answer: D
  explanation: マニュアルでは、「道路で車両がすぐ隣を走行している場合は、安全なときにその車両の前に出るか、後ろに移動してください。これにより、車両の周囲にスペースを確保できます」とアドバイスしています。
- id: 230
  category: safe_driving_rules
  question: 標識や信号のない交差点（無制御交差点）では、誰に優先権がありますか？
  choices:
    A: より速く走っている車両。
    B: 左側から来る車両。
    C: 右側から来る車両。
    D: より広い道路を走っている車両。
  answer: C
  explanation: マニュアルには、「信号や交通灯がない場合（無制御交差点）、右側から来る車両」に優先権を譲るべきであると記載されています。
- id: 231
  category: safe_driving_rules
  question: 左折する際、誰に対して優先権を譲らなければなりませんか？
  choices:
    A: 後方の車両
    B: 同じ方向から右折しようとしている車両
    C: 反対方向から直進してくる対向車
    D: 横断歩道内にいない場合も含め、すべての歩行者
  answer: C
  explanation: マニュアルには、「左折またはUターンをする場合は、対向車に優先権を譲らなければならない」と記載されています。
- id: 232
  category: safe_driving_rules
  question: マニュアルでは、どのような場合に標準の4秒以上の車間距離を空けることを推奨していますか？
  choices:
    A: 市街地の交通量が少ない場所を走行している時
    B: オートバイや大型トラックの後ろを走行している時
    C: 青信号の交差点に近づいている時
    D: 直線で乾燥した道路を走行している時
  answer: B
  explanation: マニュアルには、「トラック、バス、バン、大型車両、オートバイ、または自転車の後ろを走行している場合は、前方にさらに数秒分のスペースを空ける必要があるかもしれません」と記載されています。
- id: 233
  category: defensive_driving
  question: 車両後方の状況を把握するために、マニュアルではどのくらいの頻度でルームミラー（バックミラー）を確認することを推奨していますか？
  choices:
    A: 2〜4秒ごと
    B: 6〜8秒ごと
    C: 10〜12秒ごと
    D: 車線変更や右左折を計画している時のみ
  answer: B
  explanation: マニュアルでは、「後方の車両が車間距離を詰めすぎていないか（あおり運転）を確認するために、6〜8秒ごとにルームミラーを確認してください」とアドバイスしています。
- id: 234
  category: sharing_the_road
  question: トラックやバスなどの大型車両が右左折する際、なぜ十分なスペースを空ける必要があるのですか？
  choices:
    A: 法律により、曲がる前に完全に停止することが義務付けられているため
    B: 右左折を完了するために、センターラインを越える可能性があるため
    C: ブレーキランプが見えにくいことが多いため
    D: すべての交差点において絶対的な優先権を持っているため
  answer: B
  explanation: マニュアルには、「トラックやバスなどの大型車両は、右左折時にセンターラインを越える可能性があるため、十分なスペースを空けてください」と記載されています。
- id: 235
  category: safe_driving_rules
  question: 対向車がある交差点で左折待ちをする際、車両をどこに配置すべきですか？
  choices:
    A: 進路が完全にクリアになるまで、白い停止線の手前で待機する
    B: 歩行者を妨げる形で横断歩道の中に停車する
    C: 交差点の中ほどまで進んで待機する
    D: 他の車両が追い越せるように右側の車線に寄る
  answer: C
  explanation: マニュアルでは、「ゆっくりと交差点に近づき、交差点の中ほどで待機してください。対向車が自分の前を曲がれるだけのスペースを必ず残してください」と指示されています。
- id: 236
  category: safe_driving_rules
  question: 複数の左折車線がある通りから左折し、中央の車線から開始した場合、曲がった先の通りではどの車線に入る必要がありますか？
  choices:
    A: 最も右側の車線
    B: 最も左側の車線
    C: 中央の車線
    D: 空いている任意の車線
  answer: C
  explanation: マニュアルには、「中央の車線にいる場合は、曲がった先の通りでも中央の車線に入る必要があります」と記載されています。
- id: 237
  category: driver_testing
  question: Yターンの第3ステップにおいて、反対側の縁石で停止した後、どのような行動をとるべきですか？
  choices:
    A: 右に合図を出し、車列に向かって前進する
    B: ハンドルを右いっぱいに切り、停止する
    C: 右肩越しに後方を確認し、前進できる分だけバックして停止する
    D: バックする前にクラクションを鳴らして周囲の交通に知らせる
  answer: C
  explanation: Yターンの第3ステップは、「右肩越しに後方を確認します。再び前進できるだけの距離をバックします。そして停止します」という手順です。
- id: 238
  category: sharing_the_road
  question: 他の車両があなたを追い越そうとしている場合、正しく安全な対応は何ですか？
  choices:
    A: 追い越しを阻止するために加速する
    B: 進路を妨害するために左に寄る
    C: 自分の車線を維持し、速度を落とす
    D: 安全ではないことを知らせるためにヘッドライトを点滅させる
  answer: C
  explanation: マニュアルには、「誰かがあなたを追い越そうとしている場合は、自分の車線を維持し、速度を落としてください」と記載されています。
- id: 239
  category: safe_driving_rules
  question: 左側に車線変更する前に、死角を確認する適切な方法は何ですか？
  choices:
    A: ルームミラー（バックミラー）のみを確認する
    B: 左側のサイドミラーのみを確認する
    C: 左肩越しに目視で確認する
    D: ミラーでよりよく見えるように、身を乗り出して確認する
  answer: C
  explanation: マニュアルでは、「左車線に移動する場合は、左肩越しに確認してください」と指示されています。また、「ミラーを見るだけではこれらのエリアを確認することはできません」とも説明されています。
- id: 240
  category: safe_driving_rules
  question: 一度に複数の車両を追い越すことについて、マニュアルにはどのように記載されていますか？
  choices:
    A: 前方の道路がはっきりと見えている場合は許可される
    B: 一度に1台ずつ追い越すべきである
    C: 個別に追い越すよりも安全である
    D: 一度に2台までは追い越してもよいが、それ以上は不可
  answer: B
  explanation: マニュアルでは、「一度に複数の車両を追い越すのに十分な時間がない可能性があります」と警告しており、「左側から一度に1台ずつ追い越してください」と指示しています。
- id: 241
  category: vehicle_information
  question: 後退する際、ミラーやバックカメラを使用することに加えて、安全を確保するために何をすべきですか？
  choices:
    A: 車内のドームライトをつける。
    B: 体を回し、後部窓越しに右肩越しに後ろを見る。
    C: 運転席のドアを開けて後ろを見る。
    D: バックアラームの音を頼りにする。
  answer: B
  explanation: マニュアルには、「後退する際、ミラーやバックカメラだけに頼ってはいけません。体を回して、窓から後ろを確認してください。後部窓越しに右肩越しに後ろを見てください」と記載されています。
- id: 242
  category: driver_responsibility
  question: 平坦な場所でオートマチック車を駐車する際、シフトを(P)パークに入れた後、何をすべきですか？
  choices:
    A: 車輪を縁石の方に向ける。
    B: エンジンをかけたままにする。
    C: パーキングブレーキをかける。
    D: ハザードランプをつける。
  answer: C
  explanation: マニュアルには、「平坦な場所に駐車するときは、車両を(P)パークに入れ（マニュアル車の場合はギアを入れ）、パーキングブレーキをかけてください」と指示されています。
- id: 243
  category: defensive_driving
  question: 後続のドライバーを助けるために、どのようなことができますか？
  choices:
    A: 相手を離れさせるために急ブレーキをかける。
    B: 距離を空けるためにスピードを上げる。
    C: 一定の速度を保ち、早めに合図を出す。
    D: 車線内で少し蛇行する。
  answer: C
  explanation: マニュアルでは、「減速や右左折が必要なときに、一定の速度を保ち、早めに合図を出すことで、後続のドライバーを助けることができます」と提案されています。
- id: 244
  category: safe_driving_rules
  question: 複数車線の道路で交通を横切る必要がある場合、最も重要な考慮事項は何ですか？
  choices:
    A: 反対側まで完全に渡りきるのに十分なスペースがあることを確認する。
    B: 横切り始める前にクラクションを鳴らす。
    C: 誰かの進路を妨害することになっても、できるだけ早く横切る。
    D: 警察官が誘導してくれるのを待つ。
  answer: A
  explanation: マニュアルには、「交通や複数車線の道路を横切るときは、反対側まで完全に渡りきるのに十分なスペースがあることを確認してください」と記載されています。
- id: 245
  category: defensive_driving
  question: マニュアルによると、右左折時のどのような不安全な行動が衝突事故につながる可能性がありますか？
  choices:
    A: 合図を出すのが早すぎる。
    B: 直前に進路を変更する。
    C: 曲がる速度が遅すぎる。
    D: ミラーを複数回確認する。
  answer: B
  explanation: マニュアルでは、「直前の変更は危険であり、衝突事故を引き起こす可能性があります」と警告しています。
- id: 246
  category: sharing_the_road
  question: 複数車線の道路において、一番左側の車線はどのような目的で使用されますか？
  choices:
    A: 制限速度以下で走行するドライバー用。
    B: 遅い車両を追い越す車両用。
    C: 緊急車両専用。
    D: 右側から出る準備をしている車両用。
  answer: B
  explanation: マニュアルには、「複数車線の道路の一番左側の車線は、遅い車両を追い越す車両のために使用されます」と記載されています。
- id: 247
  category: safe_driving_rules
  question: 縁石のない道路で上り坂に駐車する場合、前輪はどちらの方向に向けるべきですか？
  choices:
    A: まっすぐ前。
    B: 左いっぱいに切る。
    C: 右いっぱいに切る。
    D: 少し左に向ける。
  answer: C
  explanation: マニュアルには、「縁石のない上り坂に駐車する場合は、パーキングに入れる前に車輪を右いっぱいに切ってください」と記載されています。
- id: 248
  category: safe_driving_rules
  question: 縦列駐車の過程で、後退を始めた後、最初に車輪をまっすぐにするのはいつですか？
  choices:
    A: 自分の後部バンパーが前の車両を通り過ぎたとき。
    B: 自分のフロントドアが、その後に駐車しようとしている車両の後部バンパーを通過したとき。
    C: 縁石と平行になった直後。
    D: 完全に停止した後。
  answer: B
  explanation: 縦列駐車のステップ3には、「自分のフロントドアが、その後に駐車しようとしている車両の後部バンパーを通過したら、ハンドルをまっすぐにしてください」と記載されています。
- id: 249
  category: safe_driving_rules
  question: 縦列駐車に成功した後、自車と前後の車両との間に空けるべき推奨される最小距離はどれくらいですか？
  choices:
    A: 1フィート (約30cm)。
    B: 2フィート (約60cm)。
    C: 3フィート (約90cm)。
    D: 6フィート (約1.8m)。
  answer: B
  explanation: マニュアルには、「縁石から約1フィート離れ、前後の車両から少なくとも2フィート離れる必要があります」と明記されています。
- id: 250
  category: defensive_driving
  question: ドライバーズマニュアルでは、強い感情が運転に悪影響を及ぼす可能性があるとアドバイスしています。運転を控えるべき感情として挙げられているのは次のうちどれですか？
  choices:
    A: 興奮。
    B: 冷静。
    C: 満足。
    D: 無関心。
  answer: A
  explanation: マニュアルには、「非常に心配していたり、興奮していたり、恐れていたり、怒っていたり、落ち込んでいたりする場合は、運転しないでください」と記載されています。
- id: 251
  category: safe_driving_rules
  question: マニュアルによると、車両のクラクションを軽く鳴らす適切な使い方はどれですか？
  choices:
    A: 誰かにぶつかりそうだと警告するため
    B: 右左折すること合図するため
    C: 渋滞に対する不満を示すため
    D: 道路上の他の運転者の注意を引くため
  answer: D
  explanation: マニュアルには、「道路上の他の運転者に合図を送り、注意を引くには、クラクションを軽く鳴らすだけで十分である」と説明されています。
- id: 252
  category: vehicle_information
  question: ハイビーム（走行用前照灯）の使用が適切なのは、次のうちどの状況ですか？
  choices:
    A: 濃霧の中を運転しているとき
    B: 200フィート以内の距離で他の車両に続いているとき
    C: 対向車がいない不慣れな場所を運転しているとき
    D: 夜間、街灯の明るい市街地の道路を運転しているとき
  answer: C
  explanation: マニュアルでは、「対向車がいないとき」や「不慣れな場所や工事区域にいるとき」にハイビームを使用できるとされています。
- id: 253
  category: safe_driving_rules
  question: 交差点を通過した直後に右左折する予定がある場合、いつ方向指示器（ウィンカー）を出すべきですか？
  choices:
    A: 交差点の手前少なくとも100フィートの地点
    B: 交差点の真ん中にいるとき
    C: 交差点を通過した後
    D: 右左折を開始した後のみ
  answer: C
  explanation: マニュアルには、「交差点を過ぎてから曲がる場合は、交差点を通過した後に合図を開始してください」と記載されています。
- id: 254
  category: safe_driving_rules
  question: 停止または徐行を示す正しい手信号は何ですか？
  choices:
    A: 窓から手をまっすぐ外に出す
    B: 肘を曲げて手を上に向ける
    C: 手を地面の方に向ける
    D: 手で円を描くように動かす
  answer: C
  explanation: マニュアルでは、「停止または徐行する場合は、手を地面の方に向けてください」と説明されています。
- id: 255
  category: signs_and_signals
  question: 「対面交通（2-Way Traffic）」の警戒標識を最もよく見かけるのはどのような時ですか？
  choices:
    A: 一方通行の道路が始まろうとしているとき
    B: 一方通行の道路を出て、対向車のある道路に入るとき
    C: 中央分離帯のある高速道路が始まる手前
    D: 2車線以上あるすべての道路
  answer: B
  explanation: マニュアルには、「この標識は、一方通行の道路を出て、対向車のある道路に入るときに表示されます」と記載されています。
- id: 256
  category: signs_and_signals
  question: 学校横断歩道またはスクールゾーンの標識において、視認性を高めるために標準的な黄色の他にどのような色が使用されることがありますか？
  choices:
    A: 鮮やかなオレンジ色
    B: 蛍光の緑色
    C: 薄い青色
    D: 反射する白色
  answer: B
  explanation: マニュアルの学校横断歩道／スクールゾーンの標識に関する項目には、「蛍光の緑色または黄色の場合がある」と記されています。
- id: 257
  category: signs_and_signals
  question: 「右側通行（Keep Right）」の規制標識は何を示していますか？
  choices:
    A: 低速車は右車線を走行しなければならない
    B: 右折の準備をしなければならない
    C: 前方の道路が交通島や障害物によって分かれている
    D: 前方に急な右カーブがある
  answer: C
  explanation: マニュアルでは、「右側通行（Keep Right） – 前方の道路が交通島や障害物によって分かれていること」を意味すると説明されています。
- id: 258
  category: signs_and_signals
  question: マニュアルによると、「進入禁止（Do Not Enter）」の標識は通常どこで使用されますか？
  choices:
    A: スクールゾーンの始まり
    B: 高速道路の急カーブの手前
    C: 逆方向に向かう出口ランプや一方通行の道路
    D: すべての4方向一時停止交差点
  answer: C
  explanation: マニュアルには、「進入禁止」の標識は「逆方向に向かう出口ランプや一方通行の道路で使用される」と記載されています。
- id: 259
  category: safe_driving_rules
  question: 「駐車禁止」の標識以外で、駐車が禁止されている場所を示すものは次のうちどれですか？
  choices:
    A: 縁石の白い標示
    B: 緑色に塗られた縁石
    C: 縁石の黄色い標示
    D: 住宅街の塗られていない縁石
  answer: C
  explanation: マニュアルには、「縁石に黄色い標示がある場所では駐車は許可されていません」と記載されています。
- id: 260
  category: safe_driving_rules
  question: 縦列駐車を開始する際、駐車したいスペースの前方に停まっている車両に対して、自車をどのように配置すべきですか？
  choices:
    A: その車両の約10フィート後ろで止まる
    B: その車両と並行に、約2フィート離れて止まる
    C: 自車のリアバンパーとその車両のフロントバンパーを合わせて止まる
    D: その車両に対して45度の角度で止まる
  answer: B
  explanation: 縦列駐車のステップ1では、「駐車したい場所の前方にある車両と並行に止まります。その車両から約2フィート離れて止まってください」と指示されています。
- id: 261
  category: signs_and_signals
  question: ウィスコンシン州道のルート標識の形と色は何ですか？
  choices:
    A: 上部が赤、下部が青の盾形
    B: グレーまたは白の警察のバッジの形
    C: 底に注ぎ口があるミルクジャグのような形
    D: 角が丸い白い長方形
  answer: C
  explanation: セクション4では、州道標識を「底に注ぎ口があるミルクジャグのような形。この標識は白地に黒の文字」と説明しています。
- id: 262
  category: sharing_the_road
  question: 踏切を通過中、線路上で停止しないこと以外に、特に避けるべき行動は何ですか？
  choices:
    A: ミラーを確認すること
    B: ギアチェンジをすること
    C: ラジオをつけること
    D: 方向指示器（ウィンカー）を使うこと
  answer: B
  explanation: 踏切に関するセクション4には、「踏切を渡っている間はギアチェンジをしないでください」と明記されています。
- id: 263
  category: sharing_the_road
  question: 反射材のオレンジ色の三角形である低速車両マークは、その車両が以下のどの速度で走行している可能性があることを示していますか？
  choices:
    A: 時速25マイル（25 mph）以下
    B: 時速35マイル（35 mph）以下
    C: 時速45マイル（45 mph）以下
    D: 時速55マイル（55 mph）以下
  answer: A
  explanation: セクション4では、低速車両標識は「この車両は時速25マイル（25 mph）以下で走行している可能性がある」ことを示すと説明されています。
- id: 264
  category: signs_and_signals
  question: 「追い越し禁止（No Passing Zone）」標識の独特な形は何ですか？
  choices:
    A: 下向きの三角形
    B: 八角形
    C: 円形
    D: ペナント形（三角旗）
  answer: D
  explanation: セクション4では、「追い越し禁止」標識を「黒い文字が書かれた黄色のペナント形」と説明しています。
- id: 265
  category: signs_and_signals
  question: マイルマーカー（距離標）にはどのような情報が含まれていますか？
  choices:
    A: ルート番号と最寄りの都市
    B: 進行方向、ルート番号、およびマイル数
    C: 郡名とマイル数
    D: 制限速度と進行方向
  answer: B
  explanation: セクション4によると、「各マイルマーカーには、進行方向、ルート番号、およびマイル数が含まれています。」
- id: 266
  category: signs_and_signals
  question: ウィスコンシン州のハイウェイ沿いには、どのくらいの頻度でマイルマーカーが設置されていますか？
  choices:
    A: 1マイルごと
    B: 0.5マイルごと
    C: 0.1〜0.2マイル（10分の1〜10分の2マイル）ごと
    D: 5マイルごと
  answer: C
  explanation: セクション4では、マイルマーカーは「0.1〜0.2マイル（10分の1〜10分の2マイル）ごとに設置されている」と述べられています。
- id: 267
  category: signs_and_signals
  question: 「この先道路工事の誘導員（Flagger）あり」の標識を見た場合、どうしなければなりませんか？
  choices:
    A: 現在の速度のまま注意して進む
    B: 停止して、誘導員がいなくなるのを待つ
    C: 誘導員の指示に従う
    D: 誘導員に気づいていることを知らせるためにクラクションを鳴らす
  answer: C
  explanation: セクション4では、道路工事の誘導員を「標識や旗を持った作業員。その指示に従わなければなりません」と説明しています。
- id: 268
  category: signs_and_signals
  question: 黒い「X」と「RR」の文字が書かれた黄色い円形の標識の意味は何ですか？
  choices:
    A: この先の道路は通行止めである
    B: この先に踏切がある
    C: 追い越し禁止区間に入ろうとしている
    D: この先に十字路の交差点がある
  answer: B
  explanation: セクション4では、この標識を踏切警告標識（Railroad Crossing Warning sign）と特定し、「これは踏切があることを意味します。注意を払い、列車が来ないか必ず確認してください」と述べています。
- id: 269
  category: signs_and_signals
  question: 3車線を示す標識がある交差点に近づいています。一番左の車線の標識には左折の矢印と直進の矢印が表示されています。中央の車線には直進の矢印が表示されています。右側の車線には右折の矢印が表示されています。中央の車線からは、どのように進むことができますか？
  choices:
    A: 左折または直進ができる
    B: 直進のみできる
    C: 右折または直進ができる
    D: Uターンができる
  answer: B
  explanation: セクション4の「左車線｜中央車線｜右車線標識」の例に基づくと、各車線の標識が許可される動きを規定しています。このシナリオでは、中央車線は直進専用です。
- id: 270
  category: signs_and_signals
  question: 茶色の目的地標識の目的は何ですか？
  choices:
    A: 病院やガソリンスタンドなどの不可欠なサービスへの道順を示すため
    B: 次の主要都市までの距離を示すため
    C: 公園や博物館などの楽しい場所や美しい場所に関する情報を示すため
    D: この先の工事区間を警告するため
  answer: C
  explanation: セクション4では、「茶色の目的地標識 — 楽しい場所や美しい場所に関する情報を示します。標識に記載された場所まであと何マイルかかるかを示す標識もあります」と述べられています。
- id: 271
  category: sharing_the_road
  question: 踏切で、白のX字型標識（クロバック）の下に「3」という数字がある標識は何を示していますか？
  choices:
    A: 踏切は3マイル先にある
    B: 3秒間停止しなければならない
    C: 横断する線路が3本ある
    D: 制限速度は30 mphである
  answer: C
  explanation: セクション4では、「列車接近」標識に「線路の数が記載されている。横断する線路が複数ある可能性がある」と説明されています。
- id: 272
  category: signs_and_signals
  question: 2車線のラウンドアバウト（環状交差点）に近づいています。左車線の頭上標識には左折矢印とUターン矢印が表示されています。右車線の標識には直進矢印と右折矢印が表示されています。ラウンドアバウトを直進するには、どちらの車線を使用すべきですか？
  choices:
    A: 左車線のみ
    B: 右車線のみ
    C: 左または右のどちらの車線でもよい
    D: このラウンドアバウトからは直進できない
  answer: B
  explanation: セクション4のラウンドアバウトに関する「左車線｜右車線標識」の例に基づくと、右車線は直進または右折を希望するドライバー用に指定されています。
- id: 273
  category: signs_and_signals
  question: 郡道（County Road）のルート標識はどのような形をしていますか？
  choices:
    A: 角が丸い白の長方形に黒の文字
    B: 青の正方形に白の文字
    C: 警察のバッジのような灰色の形に黒の文字
    D: 黄色のペナント型に黒の文字
  answer: A
  explanation: セクション4では、郡道標識について「郡の標識は角が丸い長方形である。白地に黒の文字で書かれている」と説明されています。
- id: 274
  category: signs_and_signals
  question: 踏切に近づいた際、「TRACKS OUT-OF-SERVICE（線路使用休止中）」と書かれた標識を見かけました。これは何を意味しますか？
  choices:
    A: 停止して作業車両を待たなければならない
    B: 線路はもう使われていない
    C: 作業用列車のみがこの線路を使用する
    D: 警告灯が作動していない
  answer: B
  explanation: セクション4には、「一部の標識には『Tracks out-of-service』という表示が重なっている場合があります。これは、その線路がもう使われていないことを意味します」と記載されています。
- id: 275
  category: signs_and_signals
  question: すべての道路と鉄道の交差部（踏切）にある、白文字の青い標識の目的は何ですか？
  choices:
    A: 踏切の制限速度を示すため
    B: 前方の線路の数を示すため
    C: 問題や緊急事態を報告するための電話番号を提供するため
    D: この先の停止標識を警告するため
  answer: C
  explanation: すべての道路と鉄道の交差部にある青い「問題または緊急事態の報告（Report Problem or Emergency）」標識には、線路上の車両の立ち往生や警告灯の故障などの危険な状況を報告するための電話番号が記載されています。
- id: 276
  category: sharing_the_road
  question: 複線の踏切を渡る前、1本の列車が通過した後に何をすべきですか？
  choices:
    A: 2本目の線路は常に安全なので、すぐに進む
    B: 最初の列車が十分に遠ざかり、他の線路が空いているか確認できるまで待つ
    C: 他に接近してくる列車に警告するためにクラクションを鳴らす
    D: 最初の列車が進んだ方向だけを見て、ゆっくりと渡る
  answer: B
  explanation: マニュアルには、「複線の踏切を渡る前は、線路が空いていることを確認できるよう、列車が遠くに離れるまで待つ必要がある」と記載されています。
- id: 277
  category: signs_and_signals
  question: 交差点での赤の点滅矢印は何を意味しますか？
  choices:
    A: 停止して、青の矢印を待たなければならない
    B: 一時停止し、安全であれば進むことができる
    C: 停止せずに進んでもよいが、注意が必要である
    D: 右左折は禁止されており、直進しなければならない
  answer: B
  explanation: マニュアルによると、赤の点滅矢印は「一時停止しなければならない。安全であれば進んでもよい」という意味です。
- id: 278
  category: safe_driving_rules
  question: 交差点に近づいたところ、信号が黄色の点灯に変わりました。どうすべきですか？
  choices:
    A: 赤に変わる前に交差点を通過するために加速する
    B: たとえ交差点の中にいても、すぐに停止する
    C: 減速し、交差点に入る前に停止する
    D: 優先権があるので、現在の速度で進み続ける
  answer: C
  explanation: 黄色の点灯信号について、マニュアルには「減速し、交差点に入る前に停止しなければならない」と記載されています。すでに交差点内にいる場合は、そのまま通過してください。
- id: 279
  category: signs_and_signals
  question: ウィスコンシン州の法律では、赤信号の点灯中に左折が許可されるのはどのような場合ですか？
  choices:
    A: 任意の通りから一方通行の道路へ曲がる場合
    B: 対面通行の道路から対面通行の道路へ曲がる場合
    C: 一方通行の道路から一方通行の道路へ曲がる場合
    D: 赤信号の点灯中に左折することは決して許可されない
  answer: C
  explanation: マニュアルでは、赤信号の点灯について次のように規定されています。「一方通行の道路から一方通行の道路へ曲がる場合は、赤信号でも左折できる場合があります。」
- id: 280
  category: signs_and_signals
  question: マニュアルによると、道路の端にある黄色の実線または破線は何を示していますか？
  choices:
    A: 車線の右端
    B: 駐車禁止区域
    C: 進行方向の車線の左端
    D: 追い越し車線の始まり
  answer: C
  explanation: 「路肩および車線境界線」の項目で、マニュアルは「黄色の実線または破線は、進行方向の車線の左端を示している」と述べています。
- id: 281
  category: safe_driving_rules
  question: 車線間の実線の白線を越えてもよいのはどのような場合ですか？
  choices:
    A: 車線変更をしたいときはいつでも。
    B: 低速車両を追い越す場合のみ。
    C: 危険を回避する場合、または次のブロック内で右左折する場合。
    D: 実線の白線を越えることは決して許されない。
  answer: C
  explanation: 車線間の実線の白線について、マニュアルには「危険がある場合、または次のブロック内で右左折する場合にのみ越えることができる」と記載されています。
- id: 282
  category: safe_driving_rules
  question: マニュアルには、対向車線を分ける2本の実線の黄線を越える際の例外が記載されています。どのような場合にこれが許可されますか？
  choices:
    A: 制限速度より遅く走行している車両を追い越すとき。
    B: 安全が確認できた状態で、私道（ドライブウェイ）に入るとき。
    C: 任意の場所でUターンをするとき。
    D: 自転車を追い越すとき。
  answer: B
  explanation: マニュアルには2本の実線の黄線に関する例外として、「安全が確認でき、私道（ドライブウェイ）に入る場合は、線を越えることができる」と記載されています。
- id: 283
  category: signs_and_signals
  question: 道路上の2本の破線の黄線は何を意味しますか？
  choices:
    A: 共有のセンター右左折車線。
    B: 特殊な信号機を備えたリバーシブルレーン。
    C: 追い越し禁止区間の始まり。
    D: 高乗車人数車両（HOV）専用車線。
  answer: B
  explanation: マニュアルでは、リバーシブルレーンを区切るものとして「2本の破線の黄線」が説明されています。
- id: 284
  category: signs_and_signals
  question: リバーシブルレーンの上に表示されている緑色の矢印信号は何を示していますか？
  choices:
    A: 車線が間もなく閉鎖されるため、車線から出る必要がある。
    B: その車線は自分の進行方向に対して開放されている。
    C: その車線からは左折しかできない。
    D: その車線はすべての交通に対して閉鎖されている。
  answer: B
  explanation: リバーシブルレーンシステムにおいて、緑色の矢印信号は、その車線が使用可能（開放されている）であることを意味します。
- id: 285
  category: safe_driving_rules
  question: 交差点で停止中に信号が青になった場合、進む前に何をしなければなりませんか？
  choices:
    A: 交差する交通に知らせるためにクラクションを鳴らす。
    B: 交通の流れを維持するために直ちに進む。
    C: 後ろの車が動き出すのを待つ。
    D: すでに交差点内にいる交差車両が通過し終えるのを待つ。
  answer: D
  explanation: 「青信号（点灯）」の規則において、マニュアルには「停止中に信号が青になった場合、進む前に交差する交通が通過し終えるのを待たなければならない」と記載されています。
- id: 286
  category: safe_driving_rules
  question: 2本の実線の黄線がある道路を走行しています。他の車両を追い越すためにこれらの線を越えてもよいのは、どのような場合に限られますか？
  choices:
    A: 相手の車両が農耕器具である場合。
    B: 相手の車両が制限速度の半分未満で走行しており、かつ農耕器具ではない場合。
    C: 相手の車両が自転車である場合。
    D: 急いでおり、道が開けている場合。
  answer: B
  explanation: 「2本の実線の黄線」の規則の例外として、「安全であれば、制限速度の半分未満で走行している車両を追い越すことができる。ただし、それが農耕器具である場合を除く」とあります。
- id: 287
  category: signs_and_signals
  question: 黄色の矢印の点滅は何を意味しますか？
  choices:
    A: 曲がる前に完全に停止する。
    B: 右左折は保護されており、優先権がある。
    C: 対向車や歩行者に先に道を譲り、その後注意して進む。
    D: 信号が間もなく赤になるため、停止の準備をする。
  answer: C
  explanation: マニュアルには、黄色の矢印の点滅は「曲がる前にまず道を譲り、注意して進む」ことを意味すると記載されています。
- id: 288
  category: safe_driving_rules
  question: 踏切に近づいたときに遮断機が下りてきている場合、どうすべきですか？
  choices:
    A: 遮断機が完全に下りる前に踏切を渡るために加速する。
    B: 停止して待ち、遮断機の周りを通り抜けたり、下をくぐったりしない。
    C: 停止し、列車が見えなければ遮断機を避けて進む。
    D: 遮断機が完全に下りるのを待ち、線路に何もなければ進む。
  answer: B
  explanation: マニュアルには踏切の遮断機について、「遮断機の周りを運転したり、上がりかけや下がりかけの遮断機の下をくぐったりしてはならない」と明記されています。
- id: 289
  category: signs_and_signals
  question: 車道の右端にある実線の白線の目的は何ですか？
  choices:
    A: 追い越しが禁止されていることを示すため。
    B: 車線の右端を示すため。
    C: 反対方向に進む交通を分けるため。
    D: 交差点で停止すべき場所を示すため。
  answer: B
  explanation: 「路肩線および車線境界線」の項目で説明されている通り、実線の白線は「車線の右端」を示します。
- id: 290
  category: safe_driving_rules
  question: 実線と破線の黄線、および白色の右左折記号で示された「共有センター車線」は、どのような目的で使用されますか？
  choices:
    A: 左側から低速車両を追い越すため。
    B: ラッシュアワー時の通常の走行車線として。
    C: 左折またはUターンをする車両のため。
    D: 緊急車両専用として。
  answer: C
  explanation: マニュアルでは「共有センター車線」について、「左折またはUターンをする車両のみが使用する」と説明されています。
- id: 291
  category: signs_and_signals
  question: 可逆車線（リバーシブルレーン）やフレックスレーンの上に赤い「X」印が表示されている場合、それは何を意味しますか？
  choices:
    A: 車線がまもなく閉鎖されるため、合流の準備をすること。
    B: 車線は閉鎖されており、使用できない。
    C: 緊急車両専用の車線である。
    D: 通行可能である。
  answer: B
  explanation: マニュアルには、車線上の赤い「X」印は、その車線が閉鎖されており使用できないことを意味すると記載されています。
- id: 292
  category: signs_and_signals
  question: 標識や路面に描かれた白いひし形の記号は、通常何を意味しますか？
  choices:
    A: 特定の車両専用に予約された車線。
    B: まもなく終了する車線。
    C: 制限速度が引き下げられた車線。
    D: Uターン専用に指定された車線。
  answer: A
  explanation: セクション5によると、特定車両用の専用車線には「標識の横や路面に白いひし形が表示されていることが多い」とされています。
- id: 293
  category: safe_driving_rules
  question: 指定された種類の車両を運転していない場合、どのような特定の条件下で、法的に専用車線（バス専用車線など）に入ることができますか？
  choices:
    A: 低速車両を追い越す場合。
    B: 次の半ブロック以内で右左折する必要がある場合。
    C: 一般車線の交通が停止している場合。
    D: 1ブロック未満の距離を走行する場合。
  answer: B
  explanation: マニュアルには、「次の半ブロック以内で専用車線を横切って曲がる必要がある場合は、その車線を走行することができる」と記載されています。
- id: 294
  category: signs_and_signals
  question: 専用車線の標識に「4 RIDER CAR POOLS ONLY, MON–FRI, 6AM–9AM（4人乗り以上の相乗り車両専用、月〜金、午前6時〜午前9時）」と表示されています。3人しか乗っていない車両がこの車線を使用できるのはいつですか？
  choices:
    A: 土曜日と日曜日。
    B: 平日の午前9時から午前6時の間。
    C: その車両がバスでもある場合。
    D: この制限表示がある限り、いかなる時も使用できない。
  answer: D
  explanation: 標識の例では、制限時間内は車内に4人が乗っていなければならないと指定されています。3人乗りの車は「4 RIDER（4人乗り）」の要件を満たしません。
- id: 295
  category: signs_and_signals
  question: 一部の高速道路では、舗装された路肩を「フレックスレーン」として使用できます。この特殊な車線と一般車線を区切っているのは、どのような種類の線ですか？
  choices:
    A: 白の実線。
    B: 白の破線。
    C: 黄色の実線。
    D: 黄色の破線。
  answer: C
  explanation: セクション5には、「黄色の実線がこの特殊な車線を区切っている」と記載されています。
- id: 296
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）に接近する際は、歩行者、自転車、およびすでに交差点内にいる車両に道を譲らなければなりません。マニュアルには、他にどのような種類の車両に道を譲らなければならないと具体的に記載されていますか？
  choices:
    A: オートバイ
    B: バス
    C: セミトレーラー（セミトラック）
    D: 右折車
  answer: C
  explanation: セクション6のラウンドアバウトへの進入手順には、「セミトレーラー（セミトラック）に道を譲る」ことが含まれています。
- id: 297
  category: safe_driving_rules
  question: ラウンドアバウトで目的の出口に近づいた際の正しい手順は何ですか？
  choices:
    A: 右側の方向指示器を出し、出口から出る。
    B: 減速し、後続車が通り過ぎるのを待つ。
    C: 軽く警笛（ホーン）を鳴らして他の運転者に知らせる。
    D: 出る前に一番左の車線に移動する。
  answer: A
  explanation: マニュアルは、ラウンドアバウト内の運転者に対し、「出口に達したら、右側の方向指示器を出し、出口から出る」よう指示しています。
- id: 298
  category: safe_driving_rules
  question: フリーウェイ（高速道路）入口にあるメーター制ランプ（信号制御入口）の主な目的は何ですか？
  choices:
    A: フリーウェイの使用料を徴収するため。
    B: 警察が車両登録を確認できるようにするため。
    C: フリーウェイに合流する車両の間隔を均等にするため。
    D: 相乗り車両やバスに優先権を与えるため。
  answer: C
  explanation: セクション6には、メーター制ランプは「フリーウェイに合流する車両の数を均等に分散させるのに役立つ。これにより、フリーウェイや入口ランプでの渋滞が緩和される」と記載されています。
- id: 299
  category: penalties_and_points
  question: メーター制のフリーウェイ入口ランプで交通信号に従わなかった場合、どのような結果を招く可能性がありますか？
  choices:
    A: 交通違反の切符を切られる可能性がある。
    B: 免許が直ちに停止される。
    C: 郵送で警告を受ける。
    D: 車両が押収される。
  answer: A
  explanation: マニュアルには、「ランプの信号に従わない場合、切符を切られる可能性がある」と明確に記載されています。
- id: 300
  category: signs_and_signals
  question: 「Ramp Metered When Flashing（点滅時メーター作動中）」の標識が点滅している場合、それは何を意味しますか？
  choices:
    A: ランプは閉鎖されており、別の入口を探さなければならない。
    B: ランプの交通信号が作動中であり、それに従わなければならない。
    C: 前方のフリーウェイで事故が発生している。
    D: 停止することなく、一度に1台ずつ進むことができる。
  answer: B
  explanation: セクション6によると、「『Ramp Metered When Flashing』の標識が点灯しているときは、ランプがメーター制御されている」、つまり交通信号が作動していることを意味します。
- id: 301
  category: safe_driving_rules
  question: 'マニュアルによると、ダイアモンド型交差（DDI: Diverging Diamond Interchange）の利点として述べられているものは次のうちどれですか？'
  choices:
    A: 交差点内の制限速度を上げることができる。
    B: 混雑を解消し、道路建設費用を抑えることができる。
    C: 商用トラックに直行ルートを提供する。
    D: 交通信号の必要性をなくす。
  answer: B
  explanation: セクション6では、ダイアモンド型交差（DDI）は「安全性を高め、混雑を解消し、新しい道路の建設費用を抑えるのに役立つ」と説明されています。
- id: 302
  category: driver_responsibility
  question: マニュアルによると、法執行機関が交通取り締まり（トラフィックストップ）を行う際の最優先事項は何ですか？
  choices:
    A: 違反に対して召喚状（チケット）を発行すること。
    B: 公衆の安全と福祉。
    C: 車内に違法な物品がないか捜索すること。
    D: 運転免許証と車両登録証を確認すること。
  answer: B
  explanation: 交通取り締まりに関するセクションは、「法執行機関の最優先事項は、公衆の安全と福祉である」という記述から始まっています。
- id: 303
  category: signs_and_signals
  question: フレックスレーン（flex lane）のある高速道路で、路肩車線の上に緑色の矢印信号が表示されている場合、それは何を意味しますか？
  choices:
    A: その車線は右左折専用である。
    B: その車線は開放されており、走行に使用できる。
    C: その車線はまもなく閉鎖されるため、合流の準備をすること。
    D: その車線は緊急車両専用として開放されている。
  answer: B
  explanation: マニュアルではフレックスレーンについて、「緑の矢印 － 車線は開放されており、使用可能である」と規定されています。
- id: 304
  category: sharing_the_road
  question: 一部の高速道路で、舗装された路肩を「フレックスレーン（flex lane）」として使用することが許可されるのはいつですか？
  choices:
    A: 交通渋滞を回避するためであれば、いつでも可能。
    B: 日中の時間帯のみ。
    C: 緑色の矢印などの標識によって、使用可能であることが示されているとき。
    D: 一般車線が満車であるときはいつでも。
  answer: C
  explanation: マニュアルにはフレックスレーンについて、「標識がいつその車線を使用できるかを指示する」および「フレックスレーンの標識の横に掲示される」と記載されています。
- id: 305
  category: safe_driving_rules
  question: 多車線ラウンドアバウトを走行中、円道内で避けるべき行動は何ですか？
  choices:
    A: 方向指示器（ウィンカー）を使用すること。
    B: 車線を変更すること。
    C: 低速を維持すること。
    D: セミトレーラーに道を譲ること。
  answer: B
  explanation: マニュアルにはラウンドアバウトにおける重要な安全規則として、「ラウンドアバウト内にいる間は車線を変更してはならない」と記載されています。
- id: 306
  category: driver_responsibility
  question: 法執行機関に止められた際、道路の右側に車を寄せた直後にすべきことは何ですか？
  choices:
    A: エンジンはかけたままにし、ラジオだけを切る。
    B: ギアをパーキングに入れ、エンジンとラジオを切る。
    C: ブレーキを踏んだまま、ギアをドライブに入れておく。
    D: エンジンは切るが、ヘッドライトは点灯したままにする。
  answer: B
  explanation: マニュアルには、法執行機関に止められた場合は「車両をパーキングに入れ、エンジンとラジオを切ること」と記載されています。
- id: 307
  category: driver_responsibility
  question: 法執行機関の警察官から違反切符を渡され、その内容に同意できない場合、マニュアルではその場でどのように対応するよう助言していますか？
  choices:
    A: 警察官がなぜ間違っているのかを冷静に説明する。
    B: 署名や違反切符の受け取りを拒否する。
    C: 議論はせず、法廷で意見を述べる機会を待つ。
    D: その場ですぐに弁護士に電話する。
  answer: C
  explanation: マニュアルでは、「違反切符を渡されても議論しないでください。裁判官や法廷の前で懸念を表明する機会があります」と助言しています。
- id: 308
  category: sharing_the_road
  question: 夜間の運転中、鹿の目にヘッドライトが反射しているのが見えた場合、まず最初にすべきことは何ですか？
  choices:
    A: 鹿のそばを素早く通り過ぎるために加速する。
    B: ハイビームを繰り返し点滅させる。
    C: 鹿を避けるために反対車線へ急ハンドルを切る。
    D: 減速し、クラクションを鳴らし、停まれる態勢をとる。
  answer: D
  explanation: マニュアルには、「（鹿の）目が見えたら減速してください。クラクションを鳴らし、停車できる準備をしてください」と指示されています。
- id: 309
  category: driver_responsibility
  question: 鹿を車で跳ねてしまい、それを合法的に持ち帰りたい場合、どうしなければなりませんか？
  choices:
    A: すぐに鹿を精肉店に持ち込み、処理を依頼する。
    B: 警察に連絡し、鹿用のタグ（証明書）を発行してもらう。
    C: 車両で跳ねた鹿を持ち帰ることは許可されていない。
    D: 24時間以内に天然資源局（DNR）に報告書を提出する。
  answer: B
  explanation: マニュアルには、「鹿を跳ねた場合、それを保持することができます。警察に連絡して、鹿用のタグを発行してもらってください」と記載されています。
- id: 310
  category: safe_driving_rules
  question: 葬列（葬儀の車列）において、交通標識や信号に従う責任があるのはどの車両ですか？
  choices:
    A: 車列に加わっているすべての車両。
    B: 車列の最後尾の車両のみ。
    C: 車列の先頭の車両のみ。
    D: 車列には優先権があるため、どの車両も従う必要はない。
  answer: C
  explanation: マニュアルによると、「車列の先頭車両は、交通標識や信号に従わなければならない」とされています。
- id: 311
  category: vehicle_information
  question: マニュアルでは「ボールドタイヤ（溝のないタイヤ）」を摩耗の激しいタイヤと説明しています。これに関連する主な危険は何ですか？
  choices:
    A: 燃料消費が増える。
    B: 車両の騒音が大きくなる。
    C: 牽引力（トラクション）が低下し、制動距離が長くなる。
    D: 釘などの鋭利なものを拾いやすくなる。
  answer: C
  explanation: マニュアルには、「摩耗の激しいタイヤは『ボールドタイヤ』と呼ばれます。ボールドタイヤは牽引力を低下させ、制動距離を長くします」と記載されています。
- id: 312
  category: defensive_driving
  question: 夜間や霧の中など、視界が悪い状況は、他の車両に対する判断にどのような影響を与えますか？
  choices:
    A: 車両が実際よりも速く動いているように見えることがある。
    B: 車両が実際よりも近くにいるように見えることがある。
    C: 車両が実際よりも遅く動いているように見えることがある。
    D: 対向車の速度を判断しやすくなる。
  answer: C
  explanation: マニュアルでは、「視界が悪いとき、車両は実際よりも遅く動いているように見えることがあります」と警告しています。
- id: 313
  category: safe_driving_rules
  question: アンチロック・ブレーキ・システム（ABS）が搭載されていない車で、滑りやすい路面でスリップを避けるためにどのようにブレーキをかけるべきですか？
  choices:
    A: ブレーキペダルを強く、踏み込み続ける。
    B: ブレーキを軽くポンピングする（断続的に踏む）。
    C: できるだけ強く急ブレーキをかける。
    D: 低いギアに入れ、ブレーキは使用しない。
  answer: B
  explanation: マニュアルでは、「車にアンチロック・ブレーキ・システム（ABS）が搭載されていない場合は、ブレーキを軽くポンピングしてください。これにより、滑りやすい路面での車の横滑りやスリップを防ぐことができます」とアドバイスしています。
- id: 314
  category: defensive_driving
  question: 寒くて湿った日に、橋や高架橋以外で凍結箇所に注意すべき場所として、マニュアルはどこを挙げていますか？
  choices:
    A: 広くて開放的な道路の中央。
    B: 舗装したばかりのアスファルトの路面。
    C: 交通量の多い道路。
    D: 日陰の場所。
  answer: D
  explanation: 滑りやすい路面や凍結した道路を見つけるために、マニュアルには「寒くて湿った日の日陰の場所、高架橋、橋」が挙げられています。
- id: 315
  category: vehicle_information
  question: 冬に運転する前には、すべての窓、ランプ、サイドミラーから雪や氷を取り除くことが重要です。車両の他にどの部分を清掃しなければなりませんか？
  choices:
    A: 屋根（ルーフ）。
    B: ナンバープレート。
    C: タイヤハウス（ホイールウェル）。
    D: ラジオアンテナ。
  answer: B
  explanation: マニュアルの冬の運転に関するヒントには、「すべての窓、車両ランプ、サイドミラー、ナンバープレートから雪や氷を取り除く」ことが重要であると記載されています。
- id: 316
  category: safe_driving_rules
  question: 滑りやすい冬の道路を運転する際、ヘッドライトの正しい使い方はどれですか？
  choices:
    A: ヘッドライトを点灯させるが、ハイビームは使用しない。
    B: 視認性を最大にするため、常にハイビームを使用する。
    C: 雪への反射を抑えるため、ヘッドライトを消灯したままにする。
    D: 他のドライバーに警告するため、ロービームとハイビームを交互に切り替える。
  answer: A
  explanation: マニュアルにある冬の運転のヒントは、「ヘッドライトを点灯し、ハイビーム（遠目）は使用しないこと」です。
- id: 317
  category: sharing_the_road
  question: ウィスコンシン州の公道で農用トラクターや自走式農業機械を運転するために必要な最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
  answer: C
  explanation: マニュアルには、「16歳未満の者は、公道で農用トラクターや自走式農業機械を運転することはできません」と記載されています。
- id: 318
  category: safe_driving_rules
  question: マニュアルによると、10代のドライバーが運転する車に別の10代が同乗している場合、事故のリスクにはどのような影響がありますか？
  choices:
    A: 事故の可能性が半分になる。
    B: 事故の可能性が2倍になる。
    C: 事故の可能性が3倍になる。
    D: 事故のリスクに変化はない。
  answer: B
  explanation: マニュアルには、「10代のドライバーが別の10代を同乗させている場合、事故の可能性は2倍になります」と記載されています。
- id: 319
  category: defensive_driving
  question: 衝突を避けるためにハンドルを切らなければならない場合、別の衝突を引き起こさないために重要な行動は何ですか？
  choices:
    A: ハンドルを切っている間、継続的にクラクションを鳴らす。
    B: 対向車線が空いている場合は、対向車線にハンドルを切る。
    C: 衝撃に備えて片手をハンドルから離す。
    D: ハンドルを切った後、車両を制御し続ける準備をしておく。
  answer: D
  explanation: マニュアルでは、「回避のためにハンドルを切ったり車線を変更したりした後は、車両を制御し続ける準備ができていなければなりません。一部のドライバーは、一つの衝突を回避したものの、結果として別の衝突を起こしてしまいます」と警告しています。
- id: 320
  category: defensive_driving
  question: 衝突を避けるために加速するのが最善であるのは、どのような状況ですか？
  choices:
    A: 側方または後方から衝突されそうになったとき。
    B: 自分の車線に別の車両が正面から近づいてきたとき。
    C: 変わりそうな青信号（まもなく黄色になる信号）に近づいているとき。
    D: 流れの速い交通に合流しようとしているとき。
  answer: A
  explanation: マニュアルでは、衝突を避けるために加速することが有効な場合として、「別の車両が側方または後方から衝突しそうになったとき」を挙げています。
- id: 321
  category: defensive_driving
  question: タイヤが路面のグリップを失い、車両がスリップ（横滑り）し始めた場合、まず最初にとるべき行動は何ですか？
  choices:
    A: ハンドルを急に切る。
    B: ブレーキを踏まない。
    C: ブレーキペダルを素早くポンピングする。
    D: ギアをニュートラルに入れる。
  answer: B
  explanation: マニュアルに記載されているスリップ対処法の最初のステップは、「ブレーキを踏まない」ことです。
