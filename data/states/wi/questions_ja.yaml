- id: 208
  category: license_system
  question: ウィスコンシン州の通常運転免許証は、有効期限のどのくらい前から更新手続きが可能ですか？
  choices:
    A: 60日前
    B: 90日前
    C: 6ヶ月前
    D: 1年前
  answer: D
