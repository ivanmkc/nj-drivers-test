- image: stop.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 減速し、注意して進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（止まれ）」の標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進行する前に、他の車両や歩行者がいないか確認してください。
  id: 160
- image: yield.png
  category: signs_and_signals
  question: この標識は運転者に何を求めていますか？
  choices:
    A: 完全に一時停止する
    B: 加速して交通の流れに合流する
    C: 減速し、他の車両や歩行者に優先権を譲る
    D: 停止せずに進行する
  answer: C
  explanation: 赤と白の三角形の「YIELD（譲れ）」標識は、減速して他の車両や歩行者に優先権を譲らなければならないことを意味します。他の交通が安全に通過できるように、必要に応じて一時停止しなければなりません。
  id: 161
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路への進入禁止
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「DO NOT ENTER（進入禁止）」標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや一方通行の道路など、進入すると対向車と衝突する危険がある場所で見られます。
  id: 162
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見た場合、どうするべきですか？
  choices:
    A: Uターンする
    B: 注意しながら運転を続ける
    C: 逆走しているため、停止して後退するか方向転換する
    D: 加速してそのエリアを素早く抜け出す
  answer: C
  explanation: 赤と白の「WRONG WAY（逆走）」標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に方向転換するか後退してください。
  id: 163
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方向（左方向）にのみ流れる
    C: 中央分離帯の左側を通行する
    D: 左側に高速道路の出口あり
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」標識は、この道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 164
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 他の車両の追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、この場所でのUターン（転回）が禁止されていることを意味します。
  id: 165
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行動は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、この交差点での左折が禁止されていることを意味します。
  id: 166
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: Uターン禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、この場所での右折が禁止されていることを意味します。
  id: 167
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道路が狭くなる
    B: この区間では他の車両を追い越してはならない
    C: この先、対面通行
    D: 右側を通行する
  answer: B
  explanation: ペナント型（横向きの三角形）の白黒の「NO PASSING ZONE（追い越し禁止区間）」標識は、このエリアで他の車両を追い越してはならないことを意味します。これは追い越し禁止区間の始まりを示しています。
  id: 168
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転者に何を指示していますか？
  choices:
    A: 右に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線減少
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 169
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形状と色から判断して、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事用標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。制限速度の標識は、理想的な条件下でのそのエリアの法定最高速度を示しています。
  id: 170
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: 前方に動物園またはアニマルパークがある
    B: このエリアでは鹿が頻繁に道路を横断する
    C: 前方に狩猟エリアがある
    D: 近くに野生動物保護区がある
  answer: B
  explanation: 鹿のシルエットが描かれた黄色いひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 171
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 前方にスクールゾーンがある
    B: 前方に横断歩道がある
    C: 近くにハイキングコースがある
    D: 前方にバス停がある
  answer: B
  explanation: 歩行者の図が描かれた黄色いひし形の標識は、前方に横断歩道があることを警告しています。道路を横断する歩行者のために停止する準備をしてください。
  id: 172
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは学校の横断歩道
    D: 病院の区域
  answer: C
  explanation: 五角形の蛍光黄緑色の標識は、スクールゾーンまたは学校の横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 173
- image: railroad_crossing.png
  category: signs_and_signals
  question: この黄色い丸い標識は何を警告していますか？
  choices:
    A: 前方にラウンドアバウト（環状交差点）がある
    B: 病院の区域
    C: 前方に踏切がある
    D: 追い越し禁止区域
  answer: C
  explanation: 黒い「X」と2つの「R」が描かれた黄色い丸い標識は、前方に踏切があることを事前に警告する標識です。速度を落とし、列車が来ないかよく見て音を聞いて確認してください。
  id: 174
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 学校の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX型の踏切標識（クロスバック）は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が接近している場合は、停止しなければなりません。
  id: 175
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: 前方は行き止まり
    B: 右折必須
    C: 前方に右カーブがある
    D: 前方に迂回路がある
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、前方の道路にカーブがあることを警告しています。カーブに入る前に速度を落としてください。
  id: 176
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどう違いますか？
  choices:
    A: より緩やかな曲がり角を示す
    B: より大幅な減速を必要とする急な曲がり角を警告する
    C: 右折専用を意味する
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角を示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 177
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道路
    B: 前方に単一のカーブがある
    C: 反対方向への2つの連続するカーブ
    D: 前方にラウンドアバウト（環状交差点）がある
  answer: C
  explanation: リバースカーブ（S字カーブ）の標識は、前方に反対方向への2つのカーブがあることを警告しています。速度を落とし、道路が最初に一方へ、次に他方へ曲がることに備えてください。
  id: 178
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 単一の急カーブ
    B: 滑りやすい路面
    C: 前方に連続するカーブや曲がり角がある
    D: 前方に丘がある
  answer: C
  explanation: 曲がりくねった道路の標識は、前方に連続するカーブや曲がり角があることを警告しています。速度を落とし、変化する道路状況に注意してください。
  id: 179
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の減少
    B: 別の道路からの合流車両
    C: 中央分離帯のある幹線道路の始まり
    D: 1車線への道路の幅員減少
  answer: B
  explanation: 黄色いひし形の合流標識は、別の道路からの車両があなたの車線に合流してくることを警告しています。速度と位置を調整する準備をしてください。
  id: 180
- image: road_narrows.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、橋あり
    B: この先、道路幅減少
    C: 車線終了
    D: 中央分離帯のある道路の終了
  answer: B
  explanation: この警戒標識は、この先の道路が狭くなることを示しています。道路幅の減少に備え、車線内の位置を調整してください。
  id: 181
- image: divided_highway.png
  category: signs_and_signals
  question: この標識は、この先に何があることを示していますか？
  choices:
    A: 道路の終点
    B: 対面通行
    C: 中央分離帯のある道路の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や防護柵で対向車線と区切られた道路になることを警告しています。右側を通行してください。
  id: 182
- image: divided_highway_ends.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある道路の始まり
    B: 中央分離帯のある道路が終わり、対面通行に戻る
    C: この先、合流地点あり
    D: この先、道路工事中
  answer: B
  explanation: この標識は、中央分離帯のある道路が終了することを警告しています。対向車線との間を区切る中央分離帯がなくなります。対面通行に備えてください。
  id: 183
- image: two_way_traffic.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある道路の始まり
    B: この先、追い越し可能区間
    C: この先、対面通行 — 車両が双方向に通行する
    D: この先、車線変更あり
  answer: C
  explanation: この標識は、この先が対面通行になることを警告しています。一方通行の道路や中央分離帯のある道路が終わり、反対方向に向かう車両とすれ違うことになります。
  id: 184
- image: slippery_when_wet.png
  category: signs_and_signals
  question: この標識はどのような路面状況を警告していますか？
  choices:
    A: 凍結した路面状況
    B: 濡れると滑りやすくなる道路
    C: この先、曲がりくねった道路
    D: 凹凸のある路面
  answer: B
  explanation: 「濡れると滑りやすい（Slippery when wet）」の標識は、雨天時や路面が濡れている時に非常に滑りやすくなることを警告しています。速度を落とし、急ブレーキや急ハンドルを避けてください。
  id: 185
- image: hill.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 道路の段差
    B: 凹凸のある路面
    C: この先、急な坂道または勾配あり
    D: 道路工事
  answer: C
  explanation: この標識は、この先に急な坂道や勾配があることを警告しています。特にトラックの運転時や牽引時には、速度を調整し、低速ギアにシフトダウンする必要があるかもしれません。
  id: 186
- image: signal_ahead.png
  category: signs_and_signals
  question: この標識は何に備えるよう警告していますか？
  choices:
    A: この先、一時停止標識あり
    B: この先、信号機あり
    C: スクールクロッシング（学校近くの横断歩道）
    D: 警察の検問所
  answer: B
  explanation: この標識は、この先に信号機があることを警告しています。信号が赤または黄色の場合は停止する準備をしてください。この標識は、遠くから信号機が見えにくい場所によく設置されます。
  id: 187
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識は、この先に何があることを示していますか？
  choices:
    A: ゆずれ（Yield）標識
    B: 信号機
    C: 必ず停止しなければならない一時停止標識
    D: スピードバンプ（減速帯）
  answer: C
  explanation: この標識は、この先に一時停止標識があることを警告しています。減速を始め、一時停止標識で完全に停止する準備をしてください。
  id: 188
- image: cross_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、踏切あり
    B: この先、十字路または交差点あり
    C: この先、病院あり
    D: 横断歩道
  answer: B
  explanation: この標識は、この先に十字路または四差路の交差点があることを警告しています。脇道から進入してくる車両に注意してください。
  id: 189
- image: side_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、T字路あり
    B: 右側から合流する脇道あり
    C: 道路のカーブ
    D: 行き止まり
  answer: B
  explanation: この標識は、右側から合流する脇道があることを警告しています。脇道から幹線道路に進入してくる車両に注意してください。
  id: 190
- image: added_lane.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 車線が合流している
    B: 車線が減少している
    C: 新しい車線が追加されるため、合流の必要はない
    D: 右折必須
  answer: C
  explanation: 車線追加の標識は、合流を必要とせずに新しい車線が幹線道路に加わることを意味します。ランプ（進入路）から進入する車両には、専用の新しい車線が用意されています。
  id: 191
- image: no_parking.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 常時停車
    B: このエリアでの駐車
    C: 停車またはアイドリング
    D: 荷物の積み下ろし
  answer: B
  explanation: 赤と白の「駐車禁止（NO PARKING）」の標識は、このエリアに車両を駐車できないことを意味します。乗客の乗り降りのために短時間停車することは許可されています。
  id: 192
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識があるスペースには誰が駐車できますか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用プラカードまたはナンバープレートを掲示している車両のみ
    D: 障害のある同乗者がいるすべての運転手
  answer: C
  explanation: 車椅子のマークが描かれた青い標識は、障害者専用の駐車スペースを示しています。有効な障害者用駐車プラカードまたはナンバープレートを掲示している車両のみが、これらのスペースに駐車できます。違反した場合は高額な罰金が科せられます。
  id: 193
