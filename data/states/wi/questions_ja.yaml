- id: 64
  category: safe_driving_rules
  question: 法的にロービーム（すれ違い用前照灯）の使用が義務付けられている時間帯はいつですか？
  choices:
    A: 日没から日の出まで
    B: 日没の30分後から日の出の30分前まで
    C: 日没の1時間後から日の出の1時間前まで
    D: 完全に暗いときのみ
  answer: B
  explanation: マニュアルには、日没の30分後から日の出の30分前までは、ロービーム（ヘッドライト）を使用しなければならないと記載されています。
- id: 65
  category: defensive_driving
  question: 対向車のドライバーがハイビーム（走行用前照灯）を消し忘れている場合、どうすべきですか？
  choices:
    A: ハイビームを素早く点滅させる
    B: 道路の左側を見る
    C: 道路の右側を見る
    D: ハザードランプを点灯させる
  answer: C
  explanation: 対向車がハイビームを消し忘れている場合は、道路の右側を見るようにしてください。
- id: 66
  category: safe_driving_rules
  question: 交差点で曲がる場合、いつ合図（ウィンカー）を出し始めるべきですか？
  choices:
    A: 右左折の約3秒前（約100フィート手前）
    B: 右左折の約5秒前（約200フィート手前）
    C: 交差点に入った直後
    D: 交差点で停止した後のみ
  answer: A
  explanation: 交差点で曲がる場合は、右左折の約3秒前（約100フィート手前）から合図を出し始める必要があります。
- id: 67
  category: vehicle_information
  question: 右折を示す正しい手信号は何ですか？
  choices:
    A: 運転席の窓から手を水平に真っ直ぐ出す
    B: 肘を曲げて手を上に向ける
    C: 手を地面の方に向ける
    D: 手を円を描くように振る
