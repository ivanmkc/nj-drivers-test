questions:
- id: 1
  category: driver_responsibility
  question: ウィスコンシン州運転者ハンドブック（Wisconsin Motorists' Handbook）によると、運転は次のように見なされています：
  choices:
    A: 憲法上の権利
    B: 特権であり、非常に重要な責任
    C: 18歳以上のすべての市民の義務
    D: 任意の趣味
  answer: B
  explanation: ハンドブックには、「運転は特権であり、非常に重要な責任であることを覚えておくことも極めて重要です」と記載されています。
- id: 2
  category: safe_driving_rules
  question: 運転をコントロールするための安全な行動として、ハンドブックに記載されているのは次のうちどれですか？
  choices:
    A: 交通の流れに乗るために制限速度をわずかに超えて運転する
    B: 歩行者や自転車と道路を共有する
    C: オートバイの確認を同乗者のみに頼る
    D: 車両の運転中にマルチタスクを行う
  answer: B
  explanation: ハンドブックでは、運転中に身につけるべき安全な行動の一つとして「歩行者や自転車と道路を共有する」ことを挙げています。
- id: 3
  category: driver_responsibility
  question: 交通規則について一般市民を教育し、ウィスコンシン州の交通法を執行する責任があるとして、具体的に言及されている組織はどれですか？
  choices:
    A: ウィスコンシン州車両管理局（DMV）
    B: ウィスコンシン州警察（Wisconsin State Patrol）
    C: 米国国家道路交通安全局（NHTSA）
    D: ウィスコンシン州運輸省（WisDOT）
  answer: B
  explanation: マニュアルには、「ウィスコンシン州警察（Wisconsin State Patrol）は、交通規則について一般市民を教育し、ウィスコンシン州の交通法を執行します」と記載されています。
- id: 4
  category: license_system
  question: ハンドブックの導入部分で説明されている、DMVの主な役割は何ですか？
  choices:
    A: 高速道路でウィスコンシン州の交通法を執行すること
    B: セーフシステム（Safe System）アプローチを通じてウィスコンシン州の道路を設計すること
    C: 運転者が車両を操作するための訓練を受け、資格を有していることを確認すること
    D: 全米人身売買ホットライン（National Human Trafficking Hotline）を運営すること
  answer: C
  explanation: 本文には、「DMVは、この運転者ハンドブックのような役立つリソースを通じて、運転者が車両を操作するための訓練を受け、資格を有していることを確認します」と記されています。
- id: 5
  category: defensive_driving
  question: 交通安全に対するウィスコンシン州の「セーフシステム（Safe System）」アプローチの目標は何ですか？
  choices:
    A: すべての運転者が最初の挑戦で学科試験に合格することを保証すること
    B: 運転者のミスが致命的な結果にならないように交通システムを設計および運用すること
    C: ウィスコンシン州警察による交通取締りをすべてなくすこと
    D: 従来のすべての交差点をラウンドアバウト（環状交差点）に置き換えること
  answer: B
  explanation: マニュアルでは、セーフシステムアプローチは「運転者のミスが致命的な結果にならないようにウィスコンシン州の交通システムを設計および運用することを目指している」と説明されています。
- id: 6
  category: driver_testing
  question: オンラインのクラスD運転免許模擬試験（Online Class D Driver License Practice Test）はどこで見つけることができますか？
  choices:
    A: KnowToDrive.com/Wisconsin
    B: wisconsindmv.gov
    C: love146.org/online-safety
    D: tatnonprofit.org/youth
  answer: B
  explanation: ハンドブックには、オンラインのクラスD運転免許模擬試験は「DMVのウェブサイト wisconsindmv.gov で見つけることができます」と記載されています。
- id: 7
  category: driver_responsibility
  question: ウィスコンシン州のいくつの郡で人身売買の事例が報告されていますか？
  choices:
    A: 10郡
    B: 25郡
    C: 50郡
    D: 全72郡
  answer: D
  explanation: 人身売買に関するセクションには、「ウィスコンシン州の全72郡で人身売買の事例が報告されています」と明記されています。
- id: 8
  category: driver_responsibility
  question: ハンドブックの人身売買に関する情報によると、金銭やその他の価値あるものと引き換えに性行為を行う場合、何歳未満であれば被害者と見なされますか？
  choices:
    A: 16歳未満
    B: 18歳未満
    C: 21歳未満
    D: 25歳未満
  answer: B
  explanation: 本文には、「金銭やその他の価値あるものと引き換えに性行為を行う18歳未満の者はすべて、人身売買の被害者と見なされます」と記載されています。
- id: 9
  category: driver_responsibility
  question: 全米人身売買ホットライン（National Human Trafficking Hotline）に連絡するために、BeFree（233733）にテキスト送信できる単語は何ですか？
  choices:
    A: SAFE
    B: HELP
    C: STOP
    D: ALERT
  answer: B
  explanation: マニュアルには、全米人身売買ホットラインの連絡先として「1-888-3737-888、またはBeFree（233733）にHELPとテキスト送信」と記載されています。
- id: 10
  category: driver_responsibility
  question: ハンドブックによると、人身売買業者は被害者とどのように出会うことが多いですか？
  choices:
    A: 運転者教育コースを通じて
    B: DMVサービスセンターで
    C: オンラインで別人になりすまして
    D: 運転者教育助成プログラムを通じて
  answer: C
  explanation: 「安全を保つ（Stay safe）」のセクションでは、「人身売買業者は、オンラインで別人になりすまして被害者と出会うことが多い」と警告しています。
- id: 11
  category: driver_testing
  question: ハンドブックの目次セクション1によると、運転免許試験の要件は次のうちどれですか？
  choices:
    A: 健康診断
    B: 道路標識テスト
    C: 排出ガス検査
    D: 身元調査
  answer: B
  explanation: セクション1（運転免許試験の要件）には、視力検査、道路標識テスト、学科試験、および技能試験が記載されています。
- id: 12
  category: license_system
  question: セクション2に概説されている免許の段階（Progression of Licenses）に基づくと、仮免許（Instruction Permit）の直後に取得する免許はどれですか？
  choices:
    A: 職業運転免許 (Occupational License)
    B: 通常の運転免許 (Regular Driver License)
    C: 見習い免許 (Probationary License)
    D: 商用運転免許 (Commercial Driver License)
  answer: C
  explanation: セクション2（免許の段階）では、スポンサーシップ、仮免許（Instruction Permit）、見習い免許（Probationary
    License）、そして通常の運転免許（Regular Driver License）の順に記載されています。
- id: 13
  category: safe_driving_rules
  question: ハンドブックのセクション9で「危険な運転行動（Dangerous Driving Behaviors）」に分類されているトピックは次のうちどれですか？
  choices:
    A: 後退（バック）
    B: 居眠り運転 (Drowsy Driving)
    C: 農作業の安全
    D: 冬季の運転
  answer: B
  explanation: セクション9（危険な運転行動）には、アルコール・薬物と運転、ながら運転（Distracted Driving）、および居眠り運転（Drowsy
    Driving）が含まれています。
- id: 14
  category: sharing_the_road
  question: ハンドブックのセクション10は「道路の共有（Sharing the Road）」について説明しています。このセクションに含まれるトピックは次のうちどれですか？
  choices:
    A: ノーゾーン（死角）
    B: 信号機付きランプ（Metered Ramps）
    C: 分岐ダイヤモンド型インターチェンジ
    D: ラウンドアバウト（環状交差点）
  answer: A
  explanation: セクション10（道路の共有）には、歩行者、緊急車両、スクールバス、オートバイ、自転車、およびノーゾーン（死角）が記載されています。
- id: 15
  category: penalties_and_points
  question: 目次のセクション11によると、ウィスコンシン州が運転の特権（運転免許の有効性）を管理するために使用しているシステムは何ですか？
  choices:
    A: 減点システム
    B: ポイントシステム（点数制度）
    C: ストライクシステム
    D: 違反切符システム
  answer: B
  explanation: セクション11（運転の特権）では、最初のトピックとして「ポイントシステム（Point System）」が挙げられています。
- id: 16
  category: driver_testing
  question: 通常の自動車免許の視力検査に合格するために、少なくとも片方の目に必要な最低視力はどれくらいですか？
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: マニュアルによると、ウィスコンシン州では、通常の自動車免許の申請者は片方の目で少なくとも20/40の視力（矯正または裸眼）を持つことが義務付けられています。
- id: 17
  category: driver_testing
  question: 視力検査に合格するために必要な、各目の中心からの視野角は何度ですか？
  choices:
    A: 50度
    B: 70度
    C: 90度
    D: 120度
  answer: B
  explanation: マニュアルには、申請者は各目の中心から70度の視野を持たなければならないと記載されています。
- id: 18
  category: driver_testing
  question: 道路標識テストに合格するには、何問正解する必要がありますか？
  choices:
    A: 15問中10問
    B: 15問中12問
    C: 20問中15問
    D: 50問中40問
  answer: B
  explanation: 道路標識テストには15問あり、合格するには12問（80%）正解する必要があります。
- id: 19
  category: driver_testing
  question: DMVカスタマーサービスセンターで直接学科試験を受ける場合の手数料はいくらですか？
  choices:
    A: $10
    B: $15
    C: $25
    D: 無料
  answer: D
  explanation: マニュアルには、DMVカスタマーサービスセンターでの試験は無料であると記載されています。
- id: 20
  category: driver_testing
  question: 申請者が15歳から17歳の場合、オンラインで学科試験を受けるための費用はいくらですか？
  choices:
    A: 無料
    B: $10
    C: $15
    D: $20
  answer: B
  explanation: 15歳から17歳の申請者は、10ドルの手数料でオンラインの学科試験を受けることができます。
- id: 21
  category: driver_testing
  question: 技能試験の前にDMVの試験官が点検する車両部品として記載されていないものは、次のうちどれですか？
  choices:
    A: クラクション
    B: エンジンオイルの量
    C: ナンバープレート
    D: ミラー
  answer: B
  explanation: 試験前に、試験官はクラクション、ライト/方向指示器、ナンバープレート、ドア、ミラーなどを点検します。エンジンオイルの量は記載されていません。
- id: 22
  category: license_system
  question: 運転免許証を申請する際、ウィスコンシン州に居住していることを証明する書類をいくつ持参する必要がありますか？
  choices:
    A: 1つ
    B: 2つ
    C: 3つ
    D: 4つ
  answer: B
  explanation: 運転免許証を申請するには、公共料金の請求書や金融機関の明細書など、ウィスコンシン州に居住していることを証明する書類を2つ持参する必要があります。
- id: 23
  category: driver_responsibility
  question: 18歳未満の運転者のスポンサー（保証人）として大人が署名することは、何を意味しますか？
  choices:
    A: 常に車両に同乗しなければならない。
    B: 運転者教育コースの費用を支払う。
    C: 未成年者が引き起こした事故に対する法的および経済的責任を引き受ける。
    D: 未成年者が技能試験に合格することを保証する。
  answer: C
  explanation: スポンサーは責任を引き受けます。つまり、未成年者の運転によって引き起こされた事故に対して、法的および経済的な責任を負うことを意味します。
- id: 24
  category: license_system
  question: 未成年者がスポンサーを立てる代わりに、保険の証明書を提出しなければならないのはどのような条件のときですか？
  choices:
    A: 16歳で両親と同居している場合。
    B: 既婚であり、配偶者が18歳未満である場合。
    C: 50時間の監督付き運転を完了している場合。
    D: オンラインで学科試験を受けている場合。
  answer: B
  explanation: 他の特定の基準に加えて、既婚であり配偶者が18歳未満である場合は、スポンサーを立てる代わりに保険の証明書を提出する必要があります。
- id: 25
  category: license_system
  question: 運転者教育プログラムに登録している場合、仮免許証（instruction permit）を申請するには何歳である必要がありますか？
  choices:
    A: 14歳
    B: 15歳
    C: 15歳半
    D: 16歳
  answer: B
  explanation: 18歳未満の場合、仮免許証を申請するには、15歳以上であり、運転者教育プログラムに登録している必要があります。
- id: 26
  category: safe_driving_rules
  question: 仮免許証（instruction permit）を所持し、夜間（暗い時間帯）に運転する場合、助手席には誰が同乗しなければなりませんか？
  choices:
    A: 18歳以上の免許を持つ運転者
    B: 16歳以上の兄弟姉妹
    C: 有資格の指導員、または2年以上の運転経験を持つ25歳以上の免許所持者
    D: 有効な試用免許証（probationary license）を持つ人
  answer: C
  explanation: 夜間（暗い時間帯）に車両を運転する場合、有資格の指導員、または2年以上の運転経験を持つ25歳以上の免許所持者が助手席に同乗しなければなりません。
- id: 27
  category: safe_driving_rules
  question: 仮免許証所持者の助手席に同乗する人は、少なくとも何年の運転経験（免許取得後の期間）が必要ですか？
  choices:
    A: 1年
    B: 2年
    C: 3年
    D: 5年
  answer: B
  explanation: クラスDの仮免許証所持者は、少なくとも2年以上の運転経験を持つ人を同乗させて運転しなければなりません。
- id: 28
  category: license_system
  question: 18歳未満の運転者が試用免許証（probationary license）を取得する前に、仮免許証をどのくらいの期間保持しなければなりませんか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 9ヶ月
    D: 12ヶ月
  answer: B
  explanation: 18歳未満の場合、試用免許証を取得するには、仮免許証を少なくとも6ヶ月間保持し、16歳になっている必要があります。
- id: 29
  category: driver_testing
  question: 未成年者が試用免許証を取得する前に完了しなければならない、監督付きの運転練習の合計時間は何時間ですか？
  choices:
    A: 30時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: C
  explanation: 有効な仮免許証を使用して、日中に少なくとも40時間、夜間に10時間、合計50時間の運転練習を行う必要があります。
- id: 30
  category: safe_driving_rules
  question: 試用免許証（probationary license）で運転中、電話の使用が許可されるのはどのような場合ですか？
  choices:
    A: 赤信号で停車しているとき
    B: 緊急事態を報告する場合のみ
    C: ハンズフリー機器を使用しているとき
    D: いかなる状況でも電話の使用は許可されない
  answer: B
  explanation: マニュアルには試用免許証について次のように記載されています。「緊急事態を報告する必要がある場合を除き、運転中の電話の使用は許可されていないことを覚えておいてください。」
- id: 31
  category: license_system
  question: 18歳未満の運転者に対する段階的運転免許（GDL）の同乗者および運転時間の制限は、どのくらいの期間義務付けられていますか？
  choices:
    A: 最初の6ヶ月間
    B: 最初の9ヶ月間
    C: 最初の12ヶ月間
    D: 運転者が21歳になるまで
  answer: B
  explanation: マニュアルによると、それ以前に18歳にならない限り、GDLの制限は最初の9ヶ月間義務付けられています。
- id: 32
  category: license_system
  question: 段階的運転免許（GDL）において、午前0時から午前5時までの間、単独での運転が許可されているのはどこへ向かう場合ですか？
  choices:
    A: 居住する市の境界内であればどこでも
    B: 自宅、学校、職場間の移動のみ
    C: 医療の緊急事態のみ
    D: この時間帯は単独での運転は一切許可されていない
  answer: B
  explanation: マニュアルには、午前0時（深夜）から午前5時までの間は、自宅、学校、職場間を運転する場合に「のみ」単独での運転が許可されると記載されています。
- id: 33
  category: penalties_and_points
  question: 段階的運転免許（GDL）の制限が6ヶ月間延長される原因となるのはどれですか？
  choices:
    A: 駐車違反切符を切られること
    B: 走行中の交通違反で有罪となること
    C: 免許更新を90日前に完了しないこと
    D: 直系の家族と同乗して運転すること
  answer: B
  explanation: 走行中の交通違反で有罪判決を受けた場合、何らかの制限に違反した場合、または免許が停止・取り消しになった場合、段階的運転免許の制限は6ヶ月間延長されます。
- id: 34
  category: license_system
  question: ウィスコンシン州の通常の運転免許証は、どのくらいの頻度で更新する必要がありますか？
  choices:
    A: 4年ごと
    B: 5年ごと
    C: 8年ごと
    D: 10年ごと
  answer: C
  explanation: マニュアルには、運転免許証の更新は8年ごとに行う必要があると記載されています。
- id: 35
  category: license_system
  question: 他州の通常の運転免許証を持った状態でウィスコンシン州に引っ越した場合、何日以内にウィスコンシン州の免許証を申請する必要がありますか？
  choices:
    A: 10日以内
    B: 30日以内
    C: 60日以内
    D: 90日以内
  answer: C
  explanation: 他州の通常の運転免許証を持っている場合、引っ越し後60日以内にウィスコンシン州の運転免許証を申請する必要があります。
- id: 36
  category: license_system
  question: ウィスコンシン州において、REAL ID（リアルID）準拠の運転免許証にはどのようなマークが付いていますか？
  choices:
    A: 金色の円
    B: 星のマーク
    C: ハクトウワシのマーク
    D: 表面にバーコード
  answer: B
  explanation: マニュアルには、ウィスコンシン州DMV（車両管理局）は国土安全保障省の要件を満たすREAL IDを発行しており、それには星のマークが付いていると記載されています。
- id: 37
  category: safe_driving_rules
  question: 2人の運転者が4方向一時停止（フォーウェイ・ストップ）の交差点に全く同時に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側の運転者
    B: 右側の運転者
    C: 直進する運転者
    D: 右折する運転者
  answer: B
  explanation: 優先権のルールによると、複数の運転者が同時に一時停止線に到着した場合、右側の運転者が先に進みます。
- id: 38
  category: sharing_the_road
  question: 盲導犬を連れている、または白杖を持っている歩行者に遭遇した場合、どうしなければなりませんか？
  choices:
    A: クラクションを鳴らして自分の存在を知らせる
    B: 歩行者が車道から離れるまで、少なくとも10フィート離れた場所で停止する
    C: 標示のある横断歩道にいる場合のみ道を譲る
    D: ゆっくりと迂回して運転する
  answer: B
  explanation: 盲導犬を連れている、または白杖を持っている歩行者に対しては、その人が車道から離れるまで少なくとも10フィート離れた場所で停止し、優先権を譲らなければなりません。
- id: 39
  category: safe_driving_rules
  question: 通常の運転状況において、安全な車間距離を決定するためにはどのルールを使用すべきですか？
  choices:
    A: 2秒ルール
    B: 3秒ルール
    C: 4秒の車間距離ルール
    D: 車1台分の距離ルール
  answer: C
  explanation: マニュアルでは、「4秒の車間距離ルール」を使用し、常に安全に停止できる速度で運転するよう指導しています。
- id: 40
  category: safe_driving_rules
  question: ウィスコンシン州において、子供がいる場合のスクールゾーンの通常の制限速度は時速何マイルですか？
  choices:
    A: 時速15マイル
    B: 時速20マイル
    C: 時速25マイル
    D: 時速35マイル
  answer: A
  explanation: マニュアルには、子供がいる場合のスクールゾーンの通常の制限速度は時速15マイルであると明記されています。
- id: 41
  category: safe_driving_rules
  question: 別の標識がない限り、住宅街での制限速度は時速何マイルですか？
  choices:
    A: 時速15マイル
    B: 時速25マイル
    C: 時速30マイル
    D: 時速35マイル
  answer: B
  explanation: 別の標識がない限り、住宅街での制限速度は時速25マイルです。
- id: 42
  category: defensive_driving
  question: 加速車線から高速道路に合流する際、運転者にはどのような責任がありますか？
  choices:
    A: ランプ（進入路）の終わりで停止し、車間が空くのを待つ
    B: 自分が合流できるように、他の運転者に速度を変更させる
    C: 交通の流れの中に安全な車間を見つけ、合法的に合流する
    D: 車間が空くまで路肩を走行する
  answer: C
  explanation: 加速車線では、速度を上げて合流します。マニュアルには、交通の流れの中に安全な車間を見つけて合法的に合流することが運転者の責任であると記載されています。
- id: 43
  category: defensive_driving
  question: 車両をより適切にコントロールするためには、どのくらい先まで見通せるようにしておくべきですか？
  choices:
    A: 3～5秒先
    B: 5～10秒先
    C: 10～15秒先
    D: 20～30秒先
  answer: C
  explanation: 車両をより適切にコントロールするためには、運転者は自車の10～15秒先を見通せるようにしておく必要があります。
- id: 44
  category: safe_driving_rules
  question: 交差点を通過する前に推奨される安全確認の手順はどれですか？
  choices:
    A: 右を見て、次に左を見る
    B: 前方のみを見る
    C: 左を見て、右を見て、もう一度左を見る
    D: ルームミラーを見て、次に左を見る
  answer: C
  explanation: マニュアルでは、たとえ自分に優先権がある場合でも、交差点を通過する前に左、右、そしてもう一度左を確認して警戒を怠らないよう推奨しています。
- id: 45
  category: safe_driving_rules
  question: 信号や標識のないT字路（丁字路）では、誰に優先権を譲らなければなりませんか？
  choices:
    A: 突き当たりの道路（交差する道路に向かって進む道路）にいる車両
    B: 交差する道路を走る車両
    C: 左折する車両
    D: 最初にクラクションを鳴らした車両
  answer: B
  explanation: マニュアルの優先権の規則によれば、信号や標識のないT字路では、交差する道路を走る車両に優先権を譲らなければなりません。
- id: 46
  category: safe_driving_rules
  question: マニュアルで推奨されていない、運転中の「コースト（惰性走行）」とは何を意味しますか？
  choices:
    A: アクセルを使わずに運転すること
    B: 車のギアをニュートラルに入れること
    C: パーキングブレーキを部分的にかけたまま運転すること
    D: 走行中にエンジンを切ること
  answer: B
  explanation: マニュアルには、「運転中にコースト（惰性走行）をしてはいけません。これは車のギアをニュートラルに入れることを意味します。車両を完全にコントロールできるように、常に『ギア』を入れた状態を保ってください」と記載されています。
- id: 47
  category: defensive_driving
  question: 後続車が車間距離を詰めすぎていないか確認するために、どのくらいの頻度でルームミラーを見るべきですか？
  choices:
    A: 3～5秒ごと
    B: 6～8秒ごと
    C: 10～12秒ごと
    D: 15～20秒ごと
  answer: B
  explanation: マニュアルでは、「6～8秒ごとにルームミラーを確認し、後続車が車間距離を詰めすぎていないか（あおり運転をしていないか）を確認してください」と推奨しています。
- id: 48
  category: safe_driving_rules
  question: 他の運転者に車間距離を詰められている（あおり運転を受けている）場合、どうするべきですか？
  choices:
    A: ブレーキを軽く素早く踏んで警告する
    B: 速度を上げて車間距離を広げる
    C: ゆっくりと速度を落とし、相手に追い越しを促す
    D: 合図を出さずにすぐに車線変更する
  answer: C
  explanation: マニュアルには、「もし誰かに車間距離を詰められている場合は、ゆっくりと速度を落としてください。これにより、相手に追い越しを促すことができます」と記載されています。
- id: 49
  category: safe_driving_rules
  question: 左折待ちをしている間、ハンドルをまっすぐに保つことが重要なのはなぜですか？
  choices:
    A: パワーステアリングフルードの過熱を防ぐため
    B: 進路がクリアになったときに、より速く加速できるため
    C: 後ろから追突された場合に、対向車線に押し出されるのを防ぐため
    D: 優先権を譲っていることを他の運転者に知らせるため
  answer: C
  explanation: マニュアルでは、「ハンドルを左に切った状態で後ろから追突されると、対向車線に押し出されてしまいます。ハンドル、タイヤ、そして車体をまっすぐに保つことが重要です」と説明されています。
- id: 50
  category: safe_driving_rules
  question: 郊外の片側1車線（往復2車線）の幹線道路でUターンが許可されるのは、どのような条件のときですか？
  choices:
    A: 指定されたUターン車線がある場合のみ
    B: 安全に行うことができ、交通の妨げにならない場合
    C: 日中のみ
    D: 郊外の片側1車線の幹線道路ではUターンは一切許可されない
  answer: B
  explanation: マニュアルには、「安全に行うことができ、交通の妨げにならない場合は、郊外の片側1車線（往復2車線）の幹線道路でUターンをすることができます」と記載されています。
- id: 51
  category: safe_driving_rules
  question: 4車線道路から右折する場合、どの車線から右折しなければなりませんか？
  choices:
    A: センターラインに最も近い車線
    B: ウインカーを出していればどの車線でもよい
    C: 右側の縁石または道路の端に最も近い車線
    D: 最も交通量の少ない車線
  answer: C
  explanation: マニュアルには、「4車線道路から右折するには、右側の縁石または道路の端に最も近い車線から右折しなければならない」と規定されています。
- id: 52
  category: vehicle_information
  question: Yターンを行う際の最初のステップは何ですか？
  choices:
    A: 左のウインカーを出し、死角を確認する
    B: 右肩越しに後方を確認し、後退する
    C: 右のウインカーを出し、交通状況を確認し、できるだけ右側に寄せて停止する
    D: 前進し、自分の車線をそのまま進む
  answer: C
  explanation: Yターンの最初のステップは次の通りです。「1. 右のウインカーを出す。右側の交通状況とミラーを確認する。できるだけ右側に寄せる。停止する。」
- id: 53
  category: sharing_the_road
  question: 舗装された路肩を使用して他の車両を追い越すことが許可されるのはどのような場合ですか？
  choices:
    A: 前方の車両が制限速度を下回って走行している場合
    B: 前方の車両が停止しているか、左折しようとしている場合のみ
    C: 多車線ハイウェイを走行している場合
    D: 舗装された路肩での追い越しは決して許可されない
  answer: B
  explanation: マニュアルには、「前方の車両が停止しているか、左折しようとしている場合にのみ、舗装された路肩を使用してその車両を追い越すことができる」と記載されています。
- id: 54
  category: defensive_driving
  question: 他の車両を追い越した後、元の走行車線に戻るのが安全であるとどのように判断しますか？
  choices:
    A: 追い越した車両より車1台分前に出たとき
    B: 追い越した車両の両方のヘッドライトがルームミラーに見えたとき
    C: 追い越された車両の運転手がハイビームを点滅させたとき
    D: 車両を通り過ぎてから3秒後
  answer: B
  explanation: マニュアルには、「追い越したばかりの車両の両方のヘッドライトがルームミラーに見えたら、走行車線に戻っても安全である」と記載されています。
- id: 55
  category: vehicle_information
  question: 後退（バック）する際の最高速度はどのくらいですか？
  choices:
    A: 時速10マイル
    B: 時速5マイル
    C: ゆっくり歩く速度以下
    D: その道路の標識に示された制限速度
  answer: C
  explanation: マニュアルでは、「後退が必要な場合はゆっくり動くこと。ゆっくり歩く速度より速く後退してはならない」とアドバイスしています。
- id: 56
  category: safe_driving_rules
  question: 道路で降りる予定の出口を通り過ぎてしまった場合、どうすればよいですか？
  choices:
    A: すぐに停止し、路肩を後退する
    B: 次に利用可能な中央分離帯の交差部でUターンする
    C: ギアをリバースに入れ、一番右の車線を後退する
    D: 次の出口まで進み、道路に入り直して通り過ぎた出口に戻る
  answer: D
  explanation: マニュアルには、「道路で出口や曲がり角を通り過ぎてしまった場合、後退してはならない。次の出口まで進み、道路に入り直して通り過ぎた出口に戻ること」と明記されています。
- id: 57
  category: safe_driving_rules
  question: 提供されたマニュアルのテキストによると、駐車が厳しく禁止されているのはどこですか？
  choices:
    A: 郊外の2車線道路
    B: 縁石に黄色の標示がある場所、または消火栓の前
    C: 道路の一番右側
    D: 狭い道路のある住宅街
  answer: B
  explanation: マニュアルには、「縁石に黄色の標示がある場所、または消火栓の前のエリアでは駐車が禁止されている」と記載されています。
- id: 58
  category: safe_driving_rules
  question: 他の車両を追い越す際、制限速度を超えることは許可されていますか？
  choices:
    A: はい、ただし時速5マイルまで
    B: はい、大型トラックやバスを追い越す場合
    C: いいえ、他の車両を追い越すために制限速度を超えることはできない
    D: はい、ただし多車線ハイウェイの場合のみ
  answer: C
  explanation: マニュアルには、「道路上で他の車両を追い越すために制限速度を超えることはできない」と明確に記載されています。
- id: 59
  category: safe_driving_rules
  question: 縁石のある上り坂で駐車する場合、ハンドルをどちらの方向に切るべきですか？
  choices:
    A: 右いっぱいに切る
    B: 左いっぱいに切る
    C: タイヤをまっすぐにする
    D: 少し右に切る
  answer: B
  explanation: マニュアルによると、縁石のある上り坂で駐車する場合、車をパーキングに入れる前にタイヤを左いっぱいに切ります。
- id: 60
  category: safe_driving_rules
  question: 下り坂で車を駐車する場合、タイヤをどちらの方向に向けるべきですか？
  choices:
    A: 右いっぱいに切る
    B: 左いっぱいに切る
    C: まっすぐにする
    D: 道路の中央に向ける
  answer: A
  explanation: マニュアルには、下り坂で駐車する場合、タイヤを右いっぱいに切ると記載されています。
- id: 61
  category: safe_driving_rules
  question: 縦列駐車をするためのスペースを探す際、自分の車よりどれくらい長いスペースが必要ですか？
  choices:
    A: 1〜2フィート
    B: 3〜6フィート
    C: 6〜8フィート
    D: 8〜10フィート
  answer: B
  explanation: マニュアルでは、縦列駐車の準備をする際、自分の車より約3〜6フィート長い駐車スペースを見つけることを推奨しています。
- id: 62
  category: safe_driving_rules
  question: 縦列駐車を完了した後、車は縁石からおよそどのくらい離れているべきですか？
  choices:
    A: 約6インチ
    B: 約1フィート
    C: 約2フィート
    D: 約3フィート
  answer: B
  explanation: 縦列駐車後にタイヤをまっすぐに戻した際、縁石から約1フィート離れ、前後の車から少なくとも2フィート離れている必要があります。
- id: 63
  category: safe_driving_rules
  question: 車や人がどの距離から見えない場合、ロービームヘッドライトを使用しなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 500フィート
    D: 1000フィート
  answer: C
  explanation: 500フィート（約1ブロック）離れた車や人が見えない場合は、ロービームヘッドライトを使用しなければなりません。
- id: 64
  category: safe_driving_rules
  question: 法律上、ロービームヘッドライトの使用が義務付けられているのはどの時間帯ですか？
  choices:
    A: 日没から日の出まで
    B: 日没の30分後から日の出の30分前まで
    C: 日没の1時間後から日の出の1時間前まで
    D: 完全に暗くなった時のみ
  answer: B
  explanation: マニュアルには、日没の30分後から日の出の30分前まではロービームヘッドライトを使用しなければならないと記載されています。
- id: 65
  category: defensive_driving
  question: 対向車の運転手がハイビームを消し忘れている場合、どうするべきですか？
  choices:
    A: 自分のハイビームを素早く点滅させる
    B: 道路の左側を見る
    C: 道路の右側を見る
    D: ハザードランプを点灯させる
  answer: C
  explanation: 対向車がハイビームを消し忘れて向かってくる場合は、道路の右側を見るようにしてください。
- id: 66
  category: safe_driving_rules
  question: 交差点で曲がる場合、いつウインカー（方向指示器）を出し始めるべきですか？
  choices:
    A: 曲がる約3秒前（約100フィート手前）
    B: 曲がる約5秒前（約200フィート手前）
    C: 交差点に入った直後
    D: 交差点で停止した後のみ
  answer: A
  explanation: 交差点で曲がる場合は、曲がる約3秒前（約100フィート手前）からウインカーを出し始める必要があります。
- id: 67
  category: vehicle_information
  question: 右折を示す正しい手信号（ハンドシグナル）はどれですか？
  choices:
    A: 運転席の窓から腕をまっすぐ外に出す
    B: 肘を曲げて手を上に向ける
    C: 手を地面に向ける
    D: 手を円を描くように振る
  answer: B
  explanation: 手信号を使って右折したい場合は、肘を曲げて手を上に向けます。
- id: 68
  category: signs_and_signals
  question: ほとんどの警戒標識（警告標識）はどのような色と形をしていますか？
  choices:
    A: 赤と白の八角形
    B: 白と黒の長方形
    C: 黄色に黒の文字または記号で、主にひし形
    D: 緑色に白の文字で、主に正方形
  answer: C
  explanation: 警戒標識は黄色に黒の文字または記号が描かれています。ほとんどがひし形です。
- id: 69
  category: signs_and_signals
  question: 反射するオレンジ色のマークがついた三角形の標識は、低速走行車を示しています。この車両の最高速度はおよそどれくらいですか？
  choices:
    A: 15 mph以下
    B: 25 mph以下
    C: 35 mph以下
    D: 45 mph以下
  answer: B
  explanation: 低速走行車（Slow Moving Vehicle）の標識は、反射するオレンジ色のマークがついた三角形の標識です。この車両は25 mph以下で走行している可能性があります。
- id: 70
  category: signs_and_signals
  question: 追い越し禁止区域（No Passing Zone）の標識はどのような見た目ですか？
  choices:
    A: 黄色のペナント型（横向きの三角形）に黒の文字
    B: 赤の八角形に白の文字
    C: 下向きの赤と白の三角形
    D: 白の長方形に黒の文字
  answer: A
  explanation: 追い越し禁止区域の標識は、黄色のペナント型に黒の文字が描かれています。追い越し禁止区域では、いかなる車両も追い越すことは許可されていません。
- id: 71
  category: signs_and_signals
  question: 警察官やスクールクロッシングガード（学童擁護員）が、信号機や標識と異なる指示を出した場合、どうすればよいですか？
  choices:
    A: 信号機や標識に従う
    B: 警察官やクロッシングガードの指示に従う
    C: 停止して信号が青になるのを待つ
    D: クラクションを鳴らして標識があることを知らせる
  answer: B
  explanation: 道路上の信号機や標識と異なる場合でも、警察官、スクールクロッシングガード、その他の作業員の指示に従わなければなりません。
- id: 72
  category: defensive_driving
  question: 車のクラクションを強く鳴らすのが適切なのはいつですか？
  choices:
    A: 友人に挨拶するため
    B: 遅すぎる運転をしているドライバーに合図するため
    C: 衝突しそうになったり、衝突されそうになったりしたときに警告するため
    D: 横断歩道に近づいていることを歩行者に知らせるため
  answer: C
  explanation: 衝突しそうになったり、衝突されそうになったりしたときに、警告するためにクラクションを強く鳴らすことができます。
- id: 73
  category: vehicle_information
  question: 車のパーキングライト（車幅灯）はいつ使用すべきですか？
  choices:
    A: 濃霧の中で運転しているときはいつでも
    B: 駐車してアイドリングしているときのみ
    C: 日没から日の出までの間に運転するとき
    D: 交通量の多い通りで縦列駐車するとき
  answer: B
  explanation: マニュアルによると、パーキングライトは駐車してアイドリングしているときにのみ使用すべきです。
- id: 74
  category: penalties_and_points
  question: 道路工事区域での交通違反の罰金はどうなりますか？
  choices:
    A: 半額に減額される
    B: 変わらない
    C: 2倍になる
    D: 3倍になる
  answer: C
  explanation: ドライバーに減速を促し、作業員を保護するための罰則として、道路工事区域での交通違反の罰金は2倍になります。
- id: 75
  category: safe_driving_rules
  question: 工事区域で携帯電話の使用が許可されるのはいつですか？
  choices:
    A: ハンズフリー機器を使用しているとき
    B: 緊急事態を通報する場合のみ
    C: 交通が完全に停止しているとき
    D: 携帯電話の使用は一切許可されない
  answer: B
  explanation: マニュアルによると、工事区域で携帯電話を使用できるのは、緊急事態を通報する場合のみです。
- id: 76
  category: signs_and_signals
  question: 公園、歴史的地域、または博物館への道順を示す案内標識は何色ですか？
  choices:
    A: 青色
    B: オレンジ色
    C: 茶色
    D: 黄色
  answer: C
  explanation: 茶色の案内標識は、公園、歴史的地域、博物館などの娯楽施設や景勝地に関する情報を示しています。
- id: 77
  category: signs_and_signals
  question: 高速道路にあるマイルマーカー（距離標）の主な目的は何ですか？
  choices:
    A: 現在の制限速度を示すため
    B: 前方の休憩所を示すため
    C: 高速道路での事故に対する緊急対応時間を短縮するため
    D: 前方の工事区域をドライバーに警告するため
  answer: C
  explanation: マイルマーカーは道路上の現在地を特定するのに役立ち、これにより高速道路での事故に対する緊急対応時間が短縮されます。
- id: 78
  category: signs_and_signals
  question: 上部が赤、下部が青の盾の形をした路線標識はどの種類ですか？
  choices:
    A: 郡道（カウンティ・ロード）
    B: 国道（U.S.ルート）
    C: 州道（ステート・ロード）
    D: 州間高速道路（インターステート・ハイウェイ）
  answer: D
  explanation: 州間高速道路（インターステート・ハイウェイ）の標識は、上部が赤、下部が青の盾の形をしており、白い文字が書かれています。
- id: 79
  category: safe_driving_rules
  question: 踏切を通過中に「してはいけない」ことは何ですか？
  choices:
    A: 左右を確認する
    B: ギアをチェンジする
    C: 安全な車間距離を保つ
    D: 電車に道を譲る
  answer: B
  explanation: マニュアルには、踏切を通過中にギアをチェンジしてはならないと明記されています。
- id: 80
  category: signs_and_signals
  question: 踏切にある「Exempt（免除）」の標識は何を意味しますか？
  choices:
    A: 線路はもう使用されていない
    B: 特定の車両は踏切前で一時停止する必要がない
    C: その踏切には点滅灯がない
    D: 電車は車両のために停止しなければならない
  answer: B
  explanation: 「Exempt（免除）」の標識は、特定の車両が踏切を通過する前に一時停止する必要がないことを意味します。
- id: 81
  category: defensive_driving
  question: 車両が踏切内で立ち往生した場合、危険な状況を報告するための電話番号はどこで確認できますか？
  choices:
    A: 踏切にある白文字の青い標識を探す
    B: 黄色の警告標識を探す
    C: クロスバック標識（踏切標識）の裏側を確認する
    D: 911にのみ電話する
  answer: A
  explanation: すべての公道と鉄道の踏切には、白文字の青い標識が設置されています。この標識には、危険な状況や緊急事態を報告するための電話番号が記載されています。
- id: 82
  category: safe_driving_rules
  question: 信号機が停電している、または正常に作動していない場合、どのように進むべきですか？
  choices:
    A: 右側の車両に道を譲る
    B: 信号機が「ゆずれ（Yield）」の標識であるかのように進む
    C: 信号機が「止まれ（Stop）」の標識であるかのように進む
    D: 警察官が到着するのを待つ
  answer: C
  explanation: 信号機が停電している、または正常に作動していない場合は、信号機が「止まれ」の標識であるかのように進まなければなりません。
- id: 83
  category: safe_driving_rules
  question: 赤の点灯信号で左折できるのはどのような条件のときですか？
  choices:
    A: 赤信号で左折することは絶対にできない
    B: 一方通行の道路から別の一方通行の道路へ左折する場合
    C: 対向車がいない場合
    D: 対面通行の道路から一方通行の道路へ左折する場合
  answer: B
  explanation: 一方通行の道路から別の一方通行の道路へ左折する場合、最初に一時停止し、他の交通に道を譲ることを条件に、赤信号でも左折することができます。
- id: 84
  category: safe_driving_rules
  question: 黄色の点灯信号に変わったとき、すでに交差点内にいる場合はどうすべきですか？
  choices:
    A: 交差点内で直ちに停止する
    B: 後退して交差点から出る
    C: そのまま交差点を通過する
    D: 路肩に寄せる
  answer: C
  explanation: 黄信号に変わったときに交差点内にいる場合は、停止してはいけません。そのまま交差点を通過することができます。
- id: 85
  category: signs_and_signals
  question: 黄色の点滅信号は何を意味しますか？
  choices:
    A: 完全に停止し、青信号を待つ
    B: 信号がまもなく赤に変わる
    C: 減速し、交差する交通を確認して、注意しながら進む
    D: 対向車に道を譲り、左折する
  answer: C
  explanation: 黄色の点滅信号は、減速し、交差する交通を確認して、注意しながら進むべきであることを意味します。
- id: 86
  category: safe_driving_rules
  question: 青の点灯信号で左折する場合、何をしなければなりませんか？
  choices:
    A: 優先権があるため、直ちに進む
    B: 対向車に道を譲る
    C: 青の矢印信号を待つ
    D: 停止し、信号が黄色に変わるのを待つ
  answer: B
  explanation: 左折する場合、青の点灯信号は左折できることを意味しますが、安全な場合のみです。対向車に優先権があります。
- id: 87
  category: signs_and_signals
  question: 交差点で左折する際、青の点灯信号は何を意味しますか？
  choices:
    A: 対向車よりも優先権がある。
    B: 左折できるが、安全な場合のみであり、対向車に道を譲らなければならない。
    C: 左折する前に青の矢印信号を待たなければならない。
    D: 歩行者に道を譲ることなく左折できる。
  answer: B
  explanation: マニュアルによると、左折する場合、青の点灯信号は左折できることを意味しますが、安全な場合のみです。対向車に優先権があります。
- id: 88
  category: safe_driving_rules
  question: 同一方向に進む車線を分ける実線の白線を越えることが許可されるのはいつですか？
  choices:
    A: 遅い車両を追い越す必要があるときはいつでも。
    B: 危険がある場合、または次のブロック内で曲がる場合のみ。
    C: スクールゾーンを運転しているとき。
    D: 実線の白線を越えることは絶対に許可されない。
  answer: B
  explanation: マニュアルには、車線間の実線の白線は越えてはならないことを意味すると記載されています。危険がある場合、または次のブロック内で曲がる場合にのみ越えることができます。
- id: 89
  category: safe_driving_rules
  question: 2本の実線の黄色い線は、どちらの車線からも追い越しができないことを意味します。このルールの例外は何ですか？
  choices:
    A: 制限速度の半分未満で走行している車両を追い越す場合（ただし、農業用機器を除く）。
    B: 黄色の点滅信号をつけているスクールバスを追い越す場合。
    C: 制限速度の半分未満で走行している農業用トラクターを追い越す場合。
    D: 緊急事態で遅れているときに追い越す場合。
  answer: A
  explanation: 2本の実線の黄色い線のルールの例外として、安全であれば制限速度の半分未満で走行している車両を追い越すことができます（ただし、農業用機器を除く）。
- id: 90
  category: safe_driving_rules
  question: 横断歩道で停止する際、車両はどの位置にあるべきですか？
  choices:
    A: 前輪が実線の白線の上にあるべきである。
    B: 前輪が実線の白線の直前で停止するべきである。
    C: 横断歩道の途中で停止するべきである。
    D: 横断歩道の少なくとも10フィート手前で停止するべきである。
  answer: B
  explanation: マニュアルには、前輪は実線の白線の直前で停止するべきであり、横断歩道の上で停止してはならないと記載されています。
- id: 91
  category: safe_driving_rules
  question: 共有の中央車線（shared center lane）は何のために使用されますか？
  choices:
    A: 低速で走行する車両を追い越すため。
    B: 緊急時の駐車のため。
    C: 左折またはUターンする車両のため。
    D: バスおよび自転車の専用利用のため。
  answer: C
  explanation: 共有の中央車線は、左折またはUターンする車両専用です。どちらの方向に進む車両もこの車線を使用できます。
- id: 92
  category: signs_and_signals
  question: リバーシブルレーン（可逆車線）の上にある黄色の「X」信号は何を示していますか？
  choices:
    A: その車線は通行可能である。
    B: その車線はすべての車両に対して通行止めである。
    C: その車線は左折専用である。
    D: 車線の進行方向が変更されるため、緑色の矢印の車線に移動する必要がある。
  answer: D
  explanation: リバーシブルレーンの黄色の「X」は、車線の進行方向が変更されることを意味し、緑色の「矢印」の車線に移動しなければなりません。
- id: 93
  category: safe_driving_rules
  question: 指定された種類の車両（バスや自転車など）を運転していない場合、専用車線を走行することが法的に許可されるのはいつですか？
  choices:
    A: 一般車線の交通が激しく渋滞しているとき。
    B: 次の半ブロック以内で専用車線を横切って曲がる必要がある場合。
    C: 午前6時から午前9時の間に運転しているとき。
    D: いかなる状況でも専用車線を走行することは許可されない。
  answer: B
  explanation: 指定された種類の車両を運転していない限り、専用車線を走行することは違法ですが、次の半ブロック以内で専用車線を横切って曲がる必要がある場合は、この車線を走行することができます。
- id: 94
  category: safe_driving_rules
  question: フレックスレーン（flex lane）を走行することが許可されていない車両はどれですか？
  choices:
    A: 乗用車。
    B: オートバイ。
    C: 大型トラック。
    D: 相乗り車両（カープール）。
  answer: C
  explanation: マニュアルには「大型トラックはフレックスレーンを走行できない」と明記されています。
- id: 95
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）では、交通はどの方向に進みますか？
  choices:
    A: 時計回り。
    B: 反時計回り。
    C: 8の字型。
    D: 曲がらずに直進。
  answer: B
  explanation: マニュアルによると、ラウンドアバウトはより安全で効率的な交通の流れの選択肢であり、交通は反時計回りに進みます。
- id: 96
  category: sharing_the_road
  question: ラウンドアバウトに近づく際、次のうちどれに道を譲らなければなりませんか？
  choices:
    A: 右側から近づいてくる車両。
    B: すでにラウンドアバウト内にいる左側の車両。
    C: 反対側からラウンドアバウトに進入しようとしている車両。
    D: 緊急車両のみ。
  answer: B
  explanation: ラウンドアバウトに到達した際は、歩行者、自転車、セミトレーラートラック、およびすでにラウンドアバウト内にいる左側の車両に道を譲らなければなりません。
- id: 97
  category: safe_driving_rules
  question: すでにラウンドアバウト内を走行しているときに、サイレンを鳴らした緊急車両が進入してきた場合、どうすればよいですか？
  choices:
    A: ラウンドアバウト内で直ちに停止し、緊急車両を通過させる。
    B: 速度を上げ、できるだけ早くラウンドアバウトから退出する。
    C: 次の右折出口で安全に退出してから、車を道の端に寄せる。
    D: 中央島の左側に車を寄せる。
  answer: C
  explanation: 緊急車両が進入してきたときにすでにラウンドアバウト内にいる場合は、次の右折出口で安全に退出してから、車を道の端に寄せる必要があります。ラウンドアバウト内で停止することは避けなければなりません。
- id: 98
  category: safe_driving_rules
  question: メーター付きの高速道路入口ランプ（合流車線）で、白い停止線まで完全に車を進めなければならないのはなぜですか？
  choices:
    A: 後続の車両が追い越せるようにするため。
    B: タイヤが路面のセンサーを作動させるようにするため。
    C: 高速道路の交通状況をよりよく確認するため。
    D: 横断歩道を塞いだことによる違反切符を避けるため。
  answer: B
  explanation: メーター付きのランプでは、タイヤが路面のセンサーを作動させるように、白い停止線まで完全に車を進める必要があります。
- id: 99
  category: signs_and_signals
  question: 点灯している緑色の矢印信号は何を示していますか？
  choices:
    A: 矢印の方向に曲がることができ、対向車や交差する交通はないはずである。
    B: 曲がってもよいが、先に対向車に道を譲らなければならない。
    C: 車線が変更されるため、隣の車線に合流しなければならない。
    D: 交差点を直進することしかできない。
  answer: A
  explanation: 点灯している緑色の矢印は、矢印の方向に曲がることができることを意味します。矢印が緑色の間は、対向車や交差する交通はないはずです。
- id: 100
  category: signs_and_signals
  question: 破線と実線の両方の黄色い線がある道路標示は何を意味しますか？
  choices:
    A: 道路の両側の交通において追い越しが許可されている。
    B: 道路の両側の交通において追い越しが禁止されている。
    C: 破線側にいる場合は追い越しができるが、実線側にいる場合はできない。
    D: 実線側にいる場合は追い越しができるが、破線側にいる場合はできない。
  answer: C
  explanation: 黄色い破線と実線は、破線側にいる場合は追い越しができることを意味します。実線側にいる場合は、追い越しをしてはいけません。
- id: 101
  category: sharing_the_road
  question: 専用車線を横切って合法的に曲がる際、その車線に自転車がいる場合、どうすべきですか？
  choices:
    A: 加速して自転車を追い越してから曲がる。
    B: クラクションを鳴らして、自転車に道を譲るよう警告する。
    C: 自転車の後ろに移動し、安全が確認できてから曲がる。
    D: 一般車線で停止し、自転車が先に曲がるのを待つ。
  answer: C
  explanation: マニュアルには、専用車線に自転車がいる場合、その後ろに移動し、安全が確認できてから曲がるべきであると記載されています。
- id: 102
  category: safe_driving_rules
  question: 赤信号が点灯しているランプメーター（流入制限）のある高速道路の入り口ランプに近づいた場合、どうすべきですか？
  choices:
    A: 白線の10フィート手前で停止する。
    B: 白い停止線のところまで完全に進んで停止する。
    C: 高速道路が空いていれば、止まらずに進む。
    D: 隣の車線の車が先に進むのを待つ。
  answer: B
  explanation: マニュアルには、タイヤが路面のセンサーを作動させるように、白い停止線のところまで完全に進んで停止すべきであると記載されています。
- id: 103
  category: driver_responsibility
  question: 交通取締りで警察官に車を止められた場合、手はどこに置くべきですか？
  choices:
    A: 膝の上。
    B: 窓の外。
    C: よく見えるようにハンドルの上部。
    D: ポケットや上着の中。
  answer: C
  explanation: 警察官に止められた場合は、よく見えるようにハンドルの上部に手を置き、急な動きをしないようにすべきです。
- id: 104
  category: defensive_driving
  question: 鹿が最も活発に行動するのは1日のうちどの時間帯ですか？
  choices:
    A: 日の出から正午まで。
    B: 午後の最も暑い時間帯。
    C: 日没から日の出まで。
    D: 大雨や濃霧の時のみ。
  answer: C
  explanation: マニュアルによると、鹿は日没から日の出までの時間帯に最も活発に行動します。
- id: 105
  category: driver_responsibility
  question: 車で鹿をはねてしまった場合、その動物を引き取ることに関する規則はどうなっていますか？
  choices:
    A: 誰であっても鹿を引き取ることは違法である。
    B: 警察または動物管理局のみが鹿を引き取ることができる。
    C: 自分が引き取ることもできるし、不要な場合は次の運転手が引き取ることもできる。
    D: 道路脇に放置しなければならない。
  answer: C
  explanation: マニュアルには「鹿をはねた場合、それを引き取ることができます。不要な場合は、次の運転手が引き取ることができます」と記載されています。また、警察に連絡してタグ（許可証）を発行してもらう必要があります。
- id: 106
  category: sharing_the_road
  question: 葬列の車列を走行する車両には何が求められますか？
  choices:
    A: 常にハザードランプを点滅させなければならない。
    B: ヘッドライトを点灯させなければならない。
    C: 交差点を通過する際にクラクションを鳴らさなければならない。
    D: 制限速度より少なくとも15 mph遅い速度で走行しなければならない。
  answer: B
  explanation: マニュアルでは、葬列の車列にいる車両はヘッドライトを点灯させなければならず、他の運転手はその車列に割り込んだり妨害したりしてはならないと規定されています。
- id: 107
  category: safe_driving_rules
  question: 悪天候時、道路の他の部分よりも先に凍結しやすいのはどの部分ですか？
  choices:
    A: 交差点。
    B: 橋や高架道路。
    C: トンネル。
    D: 砂利の路肩。
  answer: B
  explanation: 悪天候時には、橋や高架道路が道路の他の部分よりも先に凍結することを覚えておくことが重要です。
- id: 108
  category: defensive_driving
  question: 車がハイドロプレーニング現象を起こし始めた場合、どうすべきですか？
  choices:
    A: すぐに急ブレーキをかける。
    B: ハンドルを右に急に切る。
    C: アクセルペダルからゆっくり足を離し、ハンドルをまっすぐに保つ。
    D: 加速して水たまりを通り抜ける。
  answer: C
  explanation: スリップしたりハイドロプレーニング現象が起きたりした場合は、アクセルペダルからゆっくり足を離し、ハンドルをまっすぐに保ち、タイヤが再び路面をグリップするまで停止や方向転換を試みないようにすべきです。
- id: 109
  category: defensive_driving
  question: 車がスリップし始めてコントロールを失った場合、どのようにハンドル操作をすべきですか？
  choices:
    A: スリップしている方向とは逆の方向にハンドルを切る。
    B: 車を進めたい方向にハンドルを切る。
    C: ハンドルを完全にまっすぐに保つ。
    D: ハンドルを素早く左右に切る。
  answer: B
  explanation: スリップした時は、ブレーキを踏まず、車を進めたい方向にハンドルを切り、車がまっすぐになり始めたらすぐにハンドルを反対方向に戻すべきです。
- id: 110
  category: sharing_the_road
  question: 冬の天候下で運転する際、除雪車がランプを点滅させている場合、どのくらいの間隔を空けるべきですか？
  choices:
    A: 少なくとも50フィート。
    B: 少なくとも100フィート。
    C: 少なくとも200フィート。
    D: 少なくとも500フィート。
  answer: C
  explanation: マニュアルでは、除雪車が赤、黄、または緑のランプを点滅させている場合、少なくとも200フィートの間隔を空けるよう推奨しています。
- id: 111
  category: sharing_the_road
  question: 高速道路やその沿線で家畜に遭遇した際、クラクションを鳴らすのを避けるべきなのはなぜですか？
  choices:
    A: 地方部でクラクションを使用することは違法だから。
    B: 動物を驚かせてしまう可能性があるから。
    C: 農家が農機具を完全に停止させてしまうから。
    D: 地域の騒音条例に違反するから。
  answer: B
  explanation: 家畜に遭遇した場合は、道を譲り、クラクションを鳴らさないようにする必要があります。これは動物を驚かせてしまう可能性があるためです。
- id: 112
  category: defensive_driving
  question: 道路脇に停車している車両を見つけた場合、後続車にどのように警告できますか？
  choices:
    A: ハイビームを点灯する。
    B: クラクションを2回鳴らす。
    C: ブレーキペダルを3、4回軽く踏む。
    D: 隣の車線に少しだけ進路をそらす。
  answer: C
  explanation: 道路脇に車両がいるのを見つけた場合は、ブレーキペダルを3、4回軽く踏んで後続車に警告してください。
- id: 113
  category: vehicle_information
  question: 緊急時にアンチロック・ブレーキ・システム（ABS）を使用する正しい方法は何ですか？
  choices:
    A: 停止するまでブレーキを優しくポンピングする。
    B: ブレーキペダルをしっかりと継続的に踏み込む。
    C: 車輪のロックを防ぐためにブレーキを繰り返し軽く踏む。
    D: ブレーキペダルを軽く踏み、急ハンドルを切る。
  answer: B
  explanation: 緊急時のABSの正しい使用方法は、車両が停止するか危険が去るまで、ブレーキペダルをしっかりと継続的に踏み込むことです。
- id: 114
  category: driver_responsibility
  question: 物的損害がいくら以上の場合、警察に事故を報告しなければなりませんか？
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: 物的損害が$1,000以上の場合、警察に事故を報告する必要があります。
- id: 115
  category: driver_responsibility
  question: 標識やガードレールなどの公共物（政府の財産）に以下の金額以上の損害を与えた場合、警察に事故を報告する義務があります：
  choices:
    A: $100
    B: $200
    C: $500
    D: $1,000
  answer: B
  explanation: 公共物（政府の財産）に$200以上の損害を与えた場合、警察に事故を報告しなければなりません。
- id: 116
  category: safe_driving_rules
  question: 滑りやすい冬の道路を運転する際、使用してはいけない車の機能はどれですか？
  choices:
    A: ヘッドライト
    B: ワイパー
    C: デフロスター（霜取り装置）
    D: クルーズコントロール
  answer: D
  explanation: マニュアルの冬期運転のヒントには、「滑りやすい道路ではクルーズコントロールを使用しないでください」と明記されています。
- id: 117
  category: defensive_driving
  question: 運転中にタイヤがパンク（バースト）した場合、まず何をすべきですか？
  choices:
    A: すぐに急ブレーキをかける
    B: ギアをニュートラルに入れる
    C: 車両が直進するようにハンドルをしっかり握る
    D: ブレーキペダルを数回ポンピングする
  answer: C
  explanation: タイヤがパンク（バースト）した場合は、車両が直進するようにハンドルをしっかり握り、アクセルペダルから足を離して、少しずつ減速する必要があります。
- id: 118
  category: defensive_driving
  question: 運転中にアクセルペダルが戻らなくなった（引っかかった）場合の正しい対応は何ですか？
  choices:
    A: 前方から目を離さず、ギアをニュートラルに入れる
    B: 走行中のまま、すぐにエンジンを切る
    C: パーキングブレーキを思い切り引く
    D: 戻るまでアクセルペダルを繰り返し踏み込む
  answer: A
  explanation: アクセルペダルが戻らなくなった場合は、前方から目を離さず、ギアをニュートラルに入れ、安全な時に道路脇に寄せてからエンジンを切ります。
- id: 119
  category: alcohol_drugs_health
  question: 21歳未満の運転者に法的に許容されている血中アルコール濃度はどれくらいですか？
  choices:
    A: 0.08%
    B: 0.04%
    C: 0.02%
    D: 0.00%
  answer: D
  explanation: 21歳未満の運転者に法的に許容されている血中アルコール濃度は0.00%です。これは、車を運転する際、体内にアルコールが一切残っていてはならないことを意味します。
- id: 120
  category: penalties_and_points
  question: 黙示の同意法（Implied Consent Law）の下で、禁止アルコール濃度（PAC）検査を拒否した場合、どうなりますか？
  choices:
    A: 警告を受け、車で帰宅することが許可される
    B: 少なくとも1年間、運転免許（運転の特権）を失う
    C: 免許に6点の違反点数が科される
    D: 筆記試験の受験が義務付けられる
  answer: B
  explanation: PAC検査を拒否した場合、警察官は黙示の同意法違反であなたを逮捕しなければならず、あなたは少なくとも1年間運転免許（運転の特権）を失うことになります。
- id: 121
  category: safe_driving_rules
  question: 仮免許（instruction permit）および試用免許（probationary license）の所持者が、運転中に携帯電話を使用できるのはどのような場合ですか？
  choices:
    A: ハンズフリー機器を使用する場合
    B: 緊急事態を報告する場合のみ
    C: 赤信号で停車している場合
    D: GPSのルート案内を見る場合
  answer: B
  explanation: 仮免許および試用免許の所持者は、緊急事態を報告する場合にのみ携帯電話を使用することができます。
- id: 122
  category: sharing_the_road
  question: ライトを点滅させ、サイレンを鳴らして路肩に停車しているパトカーに近づいた場合、どうしなければなりませんか？
  choices:
    A: 現在の車線で直ちに停止し、パトカーが離れるのを待つ
    B: 通過することを知らせるためにクラクションを鳴らす
    C: 停車している車両から離れた車線に移動するか、減速する
    D: 現場を早く通り過ぎるために加速する
  answer: C
  explanation: ライトを点滅させ、サイレンを鳴らして路肩に停車しているパトカーを見かけた場合、車線を変更するか減速することが法律で義務付けられています。ライトを点滅させている緊急車両に近づく際は、必ず停車している車両から離れた車線に移動してください。
- id: 123
  category: sharing_the_road
  question: スクールバスが赤いライトを点滅させて停車している場合、どのくらい離れて停止しなければなりませんか？
  choices:
    A: 少なくとも10フィート
    B: 少なくとも15フィート
    C: 少なくとも20フィート
    D: 少なくとも50フィート
  answer: C
  explanation: スクールバスが赤いライトを点滅させて停車している場合、バスから少なくとも20フィート離れて停止する必要があります。
- id: 124
  category: sharing_the_road
  question: 赤いライトを点滅させているスクールバスに対して、停止しなくてもよいのはどのような条件の時ですか？
  choices:
    A: 複数車線の道路で、バスと同じ方向に走行している場合
    B: 分離道路（divided highway）を走行しており、バスとは中央分離帯の反対側にいる場合
    C: 緊急事態で急いでいる場合
    D: バス外に子供の姿が見えない場合
  answer: B
  explanation: 分離道路（divided highway/roadway）を走行しており、スクールバスと同じ側にいない場合は、停止する必要はありません。分離道路には、反対方向に向かう車線の間に中央分離帯（バリア）があります。
- id: 125
  category: sharing_the_road
  question: 自転車を追い越す際、どのくらいの間隔を空けなければなりませんか？
  choices:
    A: 少なくとも1フィート
    B: 少なくとも2フィート
    C: 少なくとも3フィート
    D: 少なくとも5フィート
  answer: C
  explanation: 自転車を追い越す際は、少なくとも3フィートの間隔を空けてください。
- id: 126
  category: sharing_the_road
  question: 大型トラックと同じ道路を走行する際の「ノーゾーン（No-Zone）」とは何ですか？
  choices:
    A: トラックの走行が禁止されている指定車線
    B: 大型トラックの後方約200フィートおよび前方約20フィートの、トラック運転手から死角となるエリア
    C: 商用車が減速しなければならない学校周辺の区域
    D: 分離道路における追い越し禁止区域
  answer: B
  explanation: ノーゾーンとは、大型車両の運転手からあなたの車が見えない死角のことです。このエリアは、大型トラックの後方約200フィートおよび前方約20フィートに及びます。
- id: 127
  category: penalties_and_points
  question: 12ヶ月間に何点の違反点数（demerit points）が累積すると、運転免許が停止または取り消しになりますか？
  choices:
    A: 6点以上
    B: 8点以上
    C: 10点以上
    D: 12点以上
  answer: D
  explanation: 任意の12ヶ月間に12点以上の違反点数が累積すると、運転できなくなります。運転免許は停止または取り消しとなります。
- id: 128
  category: penalties_and_points
  question: 試用免許（probationary license）を所持している場合、2回目の交通違反の有罪判決を受けると違反点数はどうなりますか？
  choices:
    A: 点数が半分に減らされる
    B: 点数が2倍になる
    C: 安全講習を受講すれば点数が消去される
    D: 点数は変わらないが、罰金が2倍になる
  answer: B
  explanation: 試用免許、身分証明書（IDカード）を所持している、または免許を所持していない場合、違反点数は2倍になります。これらの点数は、2回目以降のすべての有罪判決において2倍になります。
- id: 129
  category: penalties_and_points
  question: 常習的交通違反者（habitual traffic offender）とは、どのくらいの期間内に4回以上の重大な交通違反、または12回以上の軽微な違反で有罪判決を受けた人のことを指しますか？
  choices:
    A: 1年以内
    B: 3年以内
    C: 5年以内
    D: 10年以内
  answer: C
  explanation: 常習的違反者とは、5年以内に4回以上の重大な交通違反、または12回以上の軽微な違反で有罪判決を受けた人のことを指します。
- id: 130
  category: license_system
  question: 職業運転免許（occupational license）では、仕事、学校、および家事の維持のために、週に最大何時間まで運転することが許可されていますか？
  choices:
    A: 20時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: D
  explanation: 職業運転免許では、仕事、学校、および家事の維持のために訪れる必要がある場所への往復として、1日に最大12時間、週に最大60時間まで運転することが許可されています。
- id: 131
  category: safe_driving_rules
  question: ウィスコンシン州法によると、車内でシートベルトの着用が義務付けられているのは誰ですか？
  choices:
    A: 運転手と助手席の乗客のみ
    B: 18歳未満の乗客のみ
    C: 運転手とすべての年齢の乗客
    D: エアバッグのない車両の乗客のみ
  answer: C
  explanation: ウィスコンシン州法では、年齢に関係なく、運転手と同乗者にシートベルト（安全ベルト）の着用を義務付けています。
- id: 132
  category: vehicle_information
  question: 車両にエアバッグが装備されている場合でも、シートベルトを着用する必要がありますか？
  choices:
    A: いいえ、エアバッグがシートベルトの代わりになります。
    B: はい、車両にエアバッグがあってもシートベルトを着用する必要があります。
    C: 高速道路を運転している場合のみ必要です。
    D: 後部座席の乗客のみ着用する必要があります。
  answer: B
  explanation: マニュアルには「車両にエアバッグが装備されていても、シートベルトを着用する必要があります」と記載されています。シートベルトは、車両を制御し怪我を防ぐための適切な姿勢を保つのに役立ちます。
- id: 133
  category: safe_driving_rules
  question: シートベルトのラップベルト（腰ベルト）はどのように配置するべきですか？
  choices:
    A: 太ももの上に緩くかける
    B: お腹の上にぴったりと合わせる
    C: お腹のすぐ下にある腰骨の上にぴったりと合わせる
    D: ウエストの高い位置に合わせる
  answer: C
  explanation: ラップベルト（腰ベルト）は、お腹のすぐ下にある腰骨の上にぴったりと合わせる必要があります。
- id: 134
  category: safe_driving_rules
  question: ショルダーベルトの正しい着用方法は何ですか？
  choices:
    A: 快適にするため脇の下に挟む
    B: 胸を斜めに横切り、ベルトと胸の間に拳が入る程度のゆとりを持たせる
    C: 肩の上に緩くかける
    D: 首に擦れる場合は背中の後ろに回す
  answer: B
  explanation: ショルダーベルトは胸を斜めに横切るように着用する必要があります。ベルトと胸の間に拳が入るようにベルトを調整してください。ショルダーベルトを脇の下に通すことは絶対にしないでください。
- id: 135
  category: safe_driving_rules
  question: 一般的に、子供がチャイルドシート（幼児用補助装置）からブースターシート（学童用補助装置）に移行できるのは何歳ですか？
  choices:
    A: 2歳
    B: 4歳
    C: 6歳
    D: 8歳
  answer: B
  explanation: 一般的に、子供は4歳になるまでチャイルドシートを使用し、8歳になるまでブースターシートを使用することが義務付けられています。
- id: 136
  category: safe_driving_rules
  question: 一般的に、子供は何歳になるまでブースターシートを使用し続けなければなりませんか？
  choices:
    A: 4歳
    B: 6歳
    C: 8歳
    D: 10歳
  answer: C
  explanation: 一般的に、子供は4歳になるまでチャイルドシートを使用し、8歳になるまでブースターシートを使用することが義務付けられています。
- id: 137
  category: driver_responsibility
  question: ウィスコンシン州で運転するために必要な自動車保険の種類は何ですか？
  choices:
    A: 車両保険（総合保険）
    B: 衝突保険
    C: 有効な自動車賠償責任保険
    D: 無保険車傷害保険のみ
  answer: C
  explanation: ウィスコンシン州で運転するには有効な自動車賠償責任保険に加入している必要があり、警察官から求められた場合はその証明書を提示しなければなりません。
- id: 138
  category: driver_responsibility
  question: 他人の車を運転する場合、その車両が保険に加入していることを確認する責任は誰にありますか？
  choices:
    A: 車両所有者の責任
    B: 運転手であるあなたの責任
    C: 保険会社の責任
    D: 車両管理局（DMV）の責任
  answer: B
  explanation: 他人の車を運転する場合、その車が保険に加入していることを確認するのはあなたの責任です。
- id: 139
  category: license_system
  question: 目に見えない障害（invisible disability）を車両管理局（DMV）に申告することを選択した場合、誰がその開示情報にアクセスできますか？
  choices:
    A: あなたの保険会社のみ
    B: 一般大衆
    C: 法執行官およびウィスコンシン州交通局（WisDOT）の職員
