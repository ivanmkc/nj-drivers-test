- id: 41
  category: safe_driving_rules
  question: 標識などで別途指定がない限り、住宅街の制限速度は何マイル毎時（mph）ですか？
  choices:
    A: 15マイル毎時
    B: 25マイル毎時
    C: 30マイル毎時
    D: 35マイル毎時
  answer: B
  explanation: 標識などで別途指定がない限り、住宅街の制限速度は25マイル毎時（mph）です。
- id: 42
  category: defensive_driving
  question: 加速車線から高速道路に合流する際、運転者の責任は何ですか？
  choices:
    A: ランプの端で停止し、隙間ができるのを待つ
    B: 他のドライバーに速度を変えさせて進入する
    C: 交通の流れの中に安全な隙間を見つけて合法的に合流する
    D: 隙間ができるまで路肩を走行する
  answer: C
  explanation: 加速車線では、合流しながら加速します。マニュアルには、交通の流れの中に安全な隙間を見つけて合法的に合流することは運転者の責任であると記載されています。
- id: 43
  category: defensive_driving
  question: 車両をより適切に制御するために、前方のどのくらい先まで見通せるようにすべきですか？
  choices:
    A: 3〜5秒先
    B: 5〜10秒先
    C: 10〜15秒先
    D: 20〜30秒先
  answer: C
  explanation: 車両をより適切に制御するために、運転者は車両の10〜15秒先まで見通せる必要があります。
- id: 44
  category: safe_driving_rules
  question: 交差点を通過する前に推奨される確認パターンは何ですか？
  choices:
    A: 右を見てから左を見る
    B: 直前のみを見る
    C: 左、右、そしてもう一度左を見る
    D: バックミラーを見てから左を見る
  answer: C
  explanation: マニュアルでは、優先権がある場合でも、交差点を通過する前に左、右、そしてもう一度左を確認して警戒することを推奨しています。
- id: 45
  category: safe_driving_rules
  question: 信号や標識のないT字路（無制御のT字路）では、誰に優先権を譲らなければなりませんか？
  choices:
    A: 突き当たりの道路（終端路）にいる車両
    B: 交差する道路の交通（横断車両）
    C: 左折する車両
    D: 最初にクラクションを鳴らした車両
  answer: B
  explanation: マニュアルの優先権に関する規則によると、信号や標識のないT字路では、交差する道路の交通に優先権を譲る必要があります。
- id: 46
  category: safe_driving_rules
  question: マニュアルで推奨されていない、運転中の「コースト（惰性走行）」とは何を意味しますか？
  choices:
    A: アクセルを使わずに運転すること
    B: ギアをニュートラルに入れること
    C: パーキングブレーキを半分かけた状態で運転すること
    D: 走行中にエンジンを切ること
  answer: B
  explanation: マニュアルには、「運転中にコースト（惰性走行）をしないでください。これはギアをニュートラルに入れることを意味します。車両を完全に制御できるように、常に『ギア』を入れた状態にしてください」と記載されています。
- id: 47
  category: defensive_driving
  question: 後続車が車間距離を詰めすぎていないか確認するために、どのくらいの頻度でバックミラーをチェックすべきですか？
  choices:
    A: 3〜5秒ごと
    B: 6〜8秒ごと
    C: 10〜12秒ごと
    D: 15〜20秒ごと
  answer: B
  explanation: マニュアルでは、「後続車が車間距離を詰めすぎていないか（テールゲーティング）、6〜8秒ごとにバックミラーを確認してください」と推奨しています。
- id: 48
  category: safe_driving_rules
  question: 他のドライバーに車間距離を詰められた（テールゲーティングされた）場合、どうすべきですか？
  choices:
    A: 素早くブレーキを踏んで警告する
    B: 速度を上げて車間距離を広げる
    C: ゆっくりと速度を落とし、相手が追い越していくように促す
    D: 合図を出さずにすぐに車線を変更する
  answer: C
  explanation: マニュアルには、「誰かに車間距離を詰められた場合は、ゆっくりと速度を落としてください。これにより、相手があなたの車を避けて追い越していくよう促すことができます」と記載されています。
- id: 49
  category: safe_driving_rules
  question: 左折待ちをしている間、ハンドルを真っ直ぐに保つことが重要なのはなぜですか？
  choices:
    A: パワーステアリング液の過熱を防ぐため
    B: 道が開いたときに素早く加速できるようにするため
    C: 後ろから追突された際に、対向車線に押し出されるのを防ぐため
    D: 他のドライバーに優先権を譲っていることを知らせるため
  answer: C
  explanation: マニュアルでは、「ハンドルを左に切った状態で後ろから追突されると、対向車線に押し出されてしまいます。ハンドル、車輪、そして車体を真っ直ぐに保つことが重要です」と説明されています。
- id: 50
  category: safe_driving_rules
  question: 郊外の2車線道路でUターンが許可されるのはどのような条件ですか？
  choices:
    A: 指定されたUターン車線がある場合のみ
    B: 安全に行われ、他の交通の妨げにならない場合
    C: 日中のみ
    D: 郊外の2車線道路ではUターンは一切禁止されている
  answer: B
  explanation: マニュアルには、「安全に行われ、他の交通の妨げにならないのであれば、郊外のいかなる2車線道路でもUターンをすることができます」と記載されています。
- id: 51
  category: safe_driving_rules
  question: 4車線道路から右折する場合、どの車線から曲がらなければなりませんか？
  choices:
    A: 中央線に最も近い車線
    B: 合図を出す限り、どの車線からでもよい
    C: 右側の縁石または路側端に最も近い車線
    D: 交通量が最も少ない車線
  answer: C
  explanation: マニュアルには、「4車線道路から右折するには、右側の縁石または路側端に最も近い車線から曲がらなければならない」と明記されています。
- id: 52
  category: vehicle_information
  question: Yターン（3点方向転換）を行う際の最初のステップは何ですか？
  choices:
    A: 左側に合図を出し、死角を確認する
    B: 右肩越しに後方を確認し、後退する
    C: 右側に合図を出し、交通状況を確認し、できるだけ右側に寄せて停車する
    D: 前進し、そのまま走行車線を進む
  answer: C
  explanation: Yターンの最初のステップは、「1. 右側に合図を出す。右側の交通状況とミラーを確認する。できるだけ右側に寄せる。停車する。」です。
- id: 53
  category: sharing_the_road
  question: 舗装された路肩を使用して他の車両を追い越すことが許されるのはどのような時ですか？
  choices:
    A: 前方の車両が速度制限を下回って走行しているとき
    B: 前方の車両が停車しているか、左折しようとしているときのみ
    C: 多車線の高速道路を走行しているとき
    D: 舗装された路肩での追い越しは決して許されない
  answer: B
  explanation: マニュアルには、「舗装された路肩を使用して誰かを追い越すことができるのは、その車両が停車しているか、左折しようとしている場合のみである」と記載されています。
- id: 54
  category: defensive_driving
  question: 他の車両を追い越した後、走行車線に戻っても安全だとどのように判断しますか？
  choices:
    A: 追い越した車両の1台分前方に達したとき
    B: 追い越したばかりの車両の両方のヘッドライトがバックミラーに見えたとき
    C: 追い越された車両の運転手がハイビームを点滅させたとき
    D: 車両を通り過ぎてから3秒経過したとき
  answer: B
  explanation: マニュアルには、「追い越したばかりの車両の両方のヘッドライトがバックミラーに見えたら、走行車線に戻っても安全である」と記載されています。
- id: 55
  category: vehicle_information
  question: バック（後退）する際の最大速度はどのくらいにすべきですか？
  choices:
    A: 時速10マイル
