  explanation: マニュアルには、下り坂で駐車する場合は、車輪を右いっぱいに動かすと記載されています。
- id: 61
  category: safe_driving_rules
  question: 縦列駐車のスペースを探す際、自車よりもどれくらい長いスペースが必要ですか？
  choices:
    A: 1〜2フィート
    B: 3〜6フィート
    C: 6〜8フィート
    D: 8〜10フィート
  answer: B
  explanation: マニュアルでは、縦列駐車の準備をする際、自車よりも約3〜6フィート長い駐車スペースを探すよう推奨しています。
- id: 62
  category: safe_driving_rules
  question: 縦列駐車が完了した後、車両は縁石から約どのくらい離れている必要がありますか？
