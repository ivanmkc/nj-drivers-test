questions:
- id: 1
  category: driver_responsibility
  question: ウィスコンシン州ドライバーズ・ハンドブックによると、運転はどのように考えられていますか？
  choices:
    A: 憲法上の権利
    B: 特権であり、非常に重要な責任
    C: 18歳以上の全市民に対する義務
    D: 任意で行う趣味
  answer: B
  explanation: ハンドブックには、「運転は特権であり、非常に重要な責任であることを忘れないことが極めて重要です」と記載されています。
- id: 2
  category: safe_driving_rules
  question: ハンドブックにおいて、安全な運転をコントロールするために役立つ「安全な行動」として挙げられているのは次のうちどれですか？
  choices:
    A: 交通の流れに合わせるために制限速度をわずかに超えて運転する
    B: 歩行者や自転車利用者と道路を共有する
    C: オートバイに注意することを同乗者だけに任せる
    D: 車両の操作中にマルチタスク（並行作業）を行う
  answer: B
  explanation: ハンドブックでは、運転中に身につけるべき安全な行動の一つとして「歩行者や自転車利用者と道路を共有する」を挙げています。
- id: 3
  category: driver_responsibility
  question: 道路交通法規について一般市民を教育し、ウィスコンシン州の交通法を執行する責任があると具体的に言及されている組織はどれですか？
  choices:
    A: ウィスコンシン州車両局 (DMV)
    B: ウィスコンシン州巡回警察 (Wisconsin State Patrol)
    C: 全米高速道路交通安全局 (NHTSA)
    D: ウィスコンシン州運輸局 (DOT)
  answer: B
  explanation: マニュアルには、「ウィスコンシン州巡回警察 (Wisconsin State Patrol) は、道路交通法規について一般市民を教育し、ウィスコンシン州の交通法を執行します」と記載されています。
- id: 4
  category: license_system
  question: ハンドブックの導入部で説明されている、DMVの主な役割は何ですか？
  choices:
    A: 高速道路におけるウィスコンシン州の交通法を執行すること
    B: 「セーフ・システム」アプローチを通じてウィスコンシン州の道路を設計すること
    C: ドライバーが車両を操作するための訓練を受け、資格を有していることを確認すること
    D: 全米人身売買ホットラインを運営すること
  answer: C
  explanation: 本文には、「DMVは、このドライバーズ・ハンドブックのような役立つリソースなどを通じて、ドライバーが車両を操作するための訓練を受け、資格を有していることを確認します」と記されています。
- id: 5
  category: defensive_driving
  question: ウィスコンシン州の高速道路安全に対する「セーフ・システム (Safe System)」アプローチの目的は何ですか？
  choices:
    A: すべてのドライバーが最初の受験で知識試験に合格するようにすること
    B: ドライバーのミスが致命的なものにならないよう、交通システムを設計・運用すること
    C: ウィスコンシン州巡回警察によるすべての交通取り締まりをなくすこと
    D: すべての従来の交差点をラウンドアバウト（環状交差点）に置き換えること
  answer: B
  explanation: マニュアルでは、セーフ・システム・アプローチは「ドライバーのミスが致命的なものにならないよう、ウィスコンシン州の交通システムを設計・運用することを目指している」と説明されています。
- id: 6
  category: driver_testing
  question: 普通免許（クラスD）のオンライン練習問題はどこで見つけることができますか？
  choices:
    A: KnowToDrive.com/Wisconsin
    B: wisconsindmv.gov
    C: love146.org/online-safety
    D: tatnonprofit.org/youth
  answer: B
  explanation: ハンドブックには、普通免許（クラスD）のオンライン練習問題は「DMVのウェブサイト wisconsindmv.gov で見つけることができます」と記載されています。
- id: 7
  category: driver_responsibility
  question: ウィスコンシン州の全何郡で人身売買の事例が報告されていますか？
  choices:
    A: 10郡
    B: 25郡
    C: 50郡
    D: 全72郡
  answer: D
  explanation: 人身売買のセクションには、「人身売買の事例は、ウィスコンシン州の全72郡で報告されています」と明記されています。
- id: 8
  category: driver_responsibility
  question: ハンドブックの人身売買に関する情報によると、何歳未満の者が金銭やその他の価値のあるものと引き換えに性行為を行った場合に被害者とみなされますか？
  choices:
    A: 16歳未満
    B: 18歳未満
    C: 21歳未満
    D: 25歳未満
  answer: B
  explanation: 本文には、「金銭やその他の価値のあるものと引き換えに性行為を行う18歳未満の者は、人身売買の被害者とみなされます」と記載されています。
- id: 9
  category: driver_responsibility
  question: 全米人身売買ホットラインに連絡するために、BeFree (233733) に送信するテキストメッセージの単語は何ですか？
  choices:
    A: SAFE
    B: HELP
    C: STOP
    D: ALERT
  answer: B
  explanation: マニュアルには、全米人身売買ホットラインの連絡先として「1-888-3737-888 または BeFree (233733) に HELP
    とテキスト送信してください」と記載されています。
- id: 10
  category: driver_responsibility
  question: ハンドブックによると、人身売買の加害者は多くの場合どのようにして被害者と接触しますか？
  choices:
    A: 運転教育コースを通じて
    B: DMVのサービスセンターで
    C: オンラインで別人を装って
    D: 運転教育助成プログラムを通じて
  answer: C
  explanation: 「安全を保つために (Stay safe)」のセクションでは、「加害者はしばしば、オンラインで別人を装いながら被害者と接触します」と警告しています。
- id: 11
  category: driver_testing
  question: ハンドブックの目次第1節によると、運転免許試験の要件として正しいものはどれですか？
  choices:
    A: 健康診断
    B: 道路標識テスト
    C: 排ガス検査
    D: 背景調査（身辺調査）
  answer: B
  explanation: 第1節（運転免許試験の要件）には、視力検査、道路標識テスト、知識テスト、および技能テストが記載されています。
- id: 12
  category: license_system
  question: 第2節に記載されている「免許の段階的取得（Progression of Licenses）」に基づくと、仮免許（Instruction Permit）の直後に取得する免許は何ですか？
  choices:
    A: 就労免許（Occupational License）
    B: 普通運転免許（Regular Driver License）
    C: 見習い免許（Probationary License）
    D: 商用運転免許（Commercial Driver License）
  answer: C
  explanation: 第2節（免許の段階的取得）では、スポンサーシップ、仮免許（Instruction Permit）、見習い免許（Probationary
    License）、そして普通運転免許（Regular Driver License）の順で取得の流れが記載されています。
- id: 13
  category: safe_driving_rules
  question: ハンドブックの第9節「危険な運転行動（Dangerous Driving Behaviors）」に分類されているトピックはどれですか？
  choices:
    A: 後退（バック）
    B: 居眠り運転（Drowsy Driving）
    C: 農場での安全
    D: 冬季の運転
  answer: B
  explanation: 第9節（危険な運転行動）には、アルコール・薬物と運転、わき見運転（Distracted Driving）、および居眠り運転（Drowsy
    Driving）が含まれています。
- id: 14
  category: sharing_the_road
  question: ハンドブックの第10節は「道路の共有（Sharing the Road）」についてです。この節に含まれるトピックはどれですか？
  choices:
    A: ノーゾーン（No-Zones：大型車の死角）
    B: メーター制ランプ
    C: DDI（Diverging Diamond Interchanges：分岐型ダイヤモンド交差点）
    D: ラウンドアバウト（環状交差点）
  answer: A
  explanation: 第10節（道路の共有）には、歩行者、緊急車両、スクールバス、オートバイ、自転車、およびノーゾーン（No-Zones）が記載されています。
- id: 15
  category: penalties_and_points
  question: 目次の第11節によると、ウィスコンシン州が運転資格を管理するために使用しているシステムは何ですか？
  choices:
    A: デメリット・システム
    B: ポイント・システム（点数制度）
    C: ストライク・システム
    D: 召喚（シテーション）・システム
  answer: B
  explanation: 第11節（あなたの運転資格）では、最初のトピックとして「ポイント・システム（Point System）」が挙げられています。
- id: 16
  category: driver_testing
  question: 普通自動車免許の視力検査に合格するために、少なくとも片方の目に必要な最低視力はどれくらいですか？
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: マニュアルによると、ウィスコンシン州では普通車の申請者は、片方の目の視力が（矯正または未矯正で）少なくとも20/40である必要があります。
- id: 17
  category: driver_testing
  question: 視力検査に合格するために必要な、各眼の中心からの視野は何度ですか？
  choices:
    A: 50度
    B: 70度
    C: 90度
    D: 120度
  answer: B
  explanation: マニュアルには、申請者は各眼の中心から70度の視野を持っていなければならないと記載されています。
- id: 18
  category: driver_testing
  question: 道路標識テストに合格するには、何問正解する必要がありますか？
  choices:
    A: 15問中10問
    B: 15問中12問
    C: 20問中15問
    D: 50問中40問
  answer: B
  explanation: 道路標識テストは15問あり、合格するには12問（80%）に正解する必要があります。
- id: 19
  category: driver_testing
  question: DMVカスタマーサービスセンターで知識テストを対面で受ける場合の費用はいくらですか？
  choices:
    A: $10
    B: $15
    C: $25
    D: 無料
  answer: D
  explanation: マニュアルには、DMVカスタマーサービスセンターでのテストは無料であると記載されています。
- id: 20
  category: driver_testing
  question: 申請者が15歳から17歳の場合、オンラインで知識テストを受けるのにいくらかかりますか？
  choices:
    A: 無料
    B: $10
    C: $15
    D: $20
  answer: B
  explanation: 15歳から17歳の申請者は、10ドルの手数料でオンライン知識テストを受けることができます。
- id: 21
  category: driver_testing
  question: 技能試験（skills test）の前に、DMVの試験官が点検する車両部品としてリストに含まれていないものはどれですか？
  choices:
    A: 警音器（ホーン）
    B: エンジンオイルの量
    C: ナンバープレート
    D: ミラー
  answer: B
  explanation: 試験の前に、試験官はホーン、ライト/信号、ナンバープレート、ドア、ミラーなどを点検します。エンジンオイルの量はリストに含まれていません。
- id: 22
  category: license_system
  question: 免許を申請する際、ウィスコンシン州に居住していることを証明する書類を何通持参する必要がありますか？
  choices:
    A: 1通
    B: 2通
    C: 3通
    D: 4通
  answer: B
  explanation: 免許を申請するには、公共料金の請求書や金融機関の明細書など、ウィスコンシン州に居住していることを証明する書類を2通持参する必要があります。
- id: 23
  category: driver_responsibility
  question: 18歳未満の運転者のスポンサーとして成人が署名することは、何を意味しますか？
  choices:
    A: 常に車両に同乗しなければならない。
    B: 運転教育コースの費用を支払う。
    C: 未成年者が起こした事故に対して法的および金銭的な責任を負う。
    D: 未成年者が技能試験に合格することを保証する。
  answer: C
  explanation: スポンサーは責任を引き受けることになります。つまり、未成年者の運転によって引き起こされた事故に対して、法的および金銭的に責任を負うことを意味します。
- id: 24
  category: license_system
  question: 未成年者がスポンサーを立てる代わりに、保険の証明を提出しなければならないのはどのような条件の場合ですか？
  choices:
    A: 16歳で両親と同居している場合
    B: 結婚しており、配偶者が18歳未満の場合
    C: 50時間の監督下での運転練習を完了している場合
    D: オンラインで知識試験を受けている場合
  answer: B
  explanation: 結婚しており、配偶者が18歳未満である場合などは、スポンサーを立てる代わりに保険の証明を提出する必要があります。
- id: 25
  category: license_system
  question: 運転教育プログラムに登録している場合、仮免許（instruction permit）を申請するには何歳である必要がありますか？
  choices:
    A: 14歳
    B: 15歳
    C: 15歳半
    D: 16歳
  answer: B
  explanation: 18歳未満の場合、仮免許を申請するには少なくとも15歳以上であり、運転教育プログラムに登録している必要があります。
- id: 26
  category: safe_driving_rules
  question: 仮免許（instruction permit）を保持しており、夜間に運転する場合、助手席に誰が同乗しなければなりませんか？
  choices:
    A: 18歳以上の免許保有者であれば誰でもよい
    B: 16歳以上の兄弟姉妹
    C: 資格のある教官、または少なくとも2年の運転経験がある25歳以上の免許保有者
    D: 有効な試用免許（probationary license）を持つ人なら誰でもよい
  answer: C
  explanation: 夜間に車両を運転する場合、助手席に資格のある教官、または少なくとも2年の運転経験がある25歳以上の免許保有者が同乗している必要があります。
- id: 27
  category: safe_driving_rules
  question: 仮免許（instruction permit）保持者の助手席に同乗する人は、少なくとも何年の運転経験が必要ですか？
  choices:
    A: 1年
    B: 2年
    C: 3年
    D: 5年
  answer: B
  explanation: クラスDの仮免許保持者は、少なくとも2年の運転経験がある免許保有者を同乗させて運転しなければなりません。
- id: 28
  category: license_system
  question: 18歳未満の運転者が試用免許（probationary license）を取得するには、仮免許（instruction permit）を最低どれくらいの期間保持する必要がありますか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 9ヶ月
    D: 12ヶ月
  answer: B
  explanation: 18歳未満の場合、試用免許を取得するには、仮免許を少なくとも6ヶ月間保持し、16歳に達している必要があります。
- id: 29
  category: driver_testing
  question: 未成年者が試用免許（probationary license）を取得する前に、合計で何時間の監督下での運転練習を完了する必要がありますか？
  choices:
    A: 30時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: C
  explanation: 有効な仮免許を使用して、日中に少なくとも40時間、夜間に10時間の計50時間の運転練習を行う必要があります。
- id: 30
  category: safe_driving_rules
  question: 試用免許（probationary license）で運転中、電話の使用が許可されるのはどのような時ですか？
  choices:
    A: 赤信号で停車している時
    B: 緊急事態を通報する場合のみ
    C: ハンズフリー機器を使用している時
    D: いかなる状況でも電話の使用は許可されない
  answer: B
  explanation: マニュアルには試用免許について、「緊急事態を通報する必要がある場合を除き、運転中の電話の使用は禁止されていることを忘れないでください」と記載されています。
- id: 31
  category: license_system
  question: 18歳未満のドライバーに義務付けられている段階的運転免許制度（GDL）の同乗者制限および時間制限の期間はどれくらいですか？
  choices:
    A: 最初の6ヶ月間
    B: 最初の9ヶ月間
    C: 最初の12ヶ月間
    D: ドライバーが21歳になるまで
  answer: B
  explanation: マニュアルによると、その期間内に18歳にならない限り、GDLの制限は最初の9ヶ月間適用されます。
- id: 32
  category: license_system
  question: 段階的運転免許（GDL）において、午前0時から午前5時の間に一人で運転することが許可されるのはどのような場合ですか？
  choices:
    A: 居住している市内の制限範囲内であればどこでも
    B: 自宅、学校、職場の間を移動する場合のみ
    C: 医療上の緊急事態の場合のみ
    D: この時間帯に一人で運転することは一切許可されない
  answer: B
  explanation: マニュアルには、午前0時から午前5時までの間、自宅、学校、職場との間を運転する場合に限り、一人で運転できると記載されています。
- id: 33
  category: penalties_and_points
  question: 段階的運転免許（GDL）の制限が6ヶ月間延長される原因となるのはどれですか？
  choices:
    A: 駐車違反切符を切られる
    B: 交通違反（走行中の違反）で有罪判決を受ける
    C: 免許更新を90日前までに行わなかった
    D: 同居の家族と一緒に運転する
  answer: B
  explanation: 交通違反（走行中の違反）で有罪判決を受けた場合、制限に違反した場合、または免許が停止・取消された場合、段階的運転免許の制限は6ヶ月間延長されます。
- id: 34
  category: license_system
  question: ウィスコンシン州の通常の運転免許証は、どのくらいの頻度で更新する必要がありますか？
  choices:
    A: 4年ごと
    B: 5年ごと
    C: 8年ごと
    D: 10年ごと
  answer: C
  explanation: マニュアルには、運転免許証の更新は8年ごとに行う必要があると記載されています。
- id: 35
  category: license_system
  question: 他州の普通運転免許証を持ってウィスコンシン州に転入した場合、何日以内にウィスコンシン州の免許を申請する必要がありますか？
  choices:
    A: 10日以内
    B: 30日以内
    C: 60日以内
    D: 90日以内
  answer: C
  explanation: 他州の普通運転免許証を所持している場合、転入後60日以内にウィスコンシン州の運転免許証を申請する必要があります。
- id: 36
  category: license_system
  question: ウィスコンシン州において、REAL ID準拠の運転免許証はどのように識別されますか？
  choices:
    A: 金の円形マーク
    B: 星のマーク
    C: ハクトウワシのマーク
    D: 表面のバーコード
  answer: B
  explanation: マニュアルには、ウィスコンシン州のDMVが発行する国土安全保障省の要件を満たすREAL-IDには、星のマークが付いていると記されています。
- id: 37
  category: safe_driving_rules
  question: 4方向一時停止（4-way stop）の交差点に2人のドライバーが全く同時に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側のドライバー
    B: 右側のドライバー
    C: 直進するドライバー
    D: 右折するドライバー
  answer: B
  explanation: 優先権のルールに従い、複数のドライバーが同時に停止場所に到着した場合は、右側のドライバーが先に進みます。
- id: 38
  category: sharing_the_road
  question: 盲導犬を連れている、または白い杖を持っている歩行者に遭遇したとき、どうしなければなりませんか？
  choices:
    A: クラクションを鳴らして、自分の存在を知らせる
    B: その人が路上から離れるまで、少なくとも10フィート離れた場所で停止する
    C: 横断歩道内にいる場合のみ道を譲る
    D: 歩行者の周りをゆっくりと避けて運転する
  answer: B
  explanation: 盲導犬を連れている、または白い杖を持っている歩行者に対しては、その人が路上から離れるまで、少なくとも10フィート（約3メートル）離れた場所で停止し、優先権を譲らなければなりません。
- id: 39
  category: safe_driving_rules
  question: 通常の運転条件下で、安全な車間距離を判断するために使用すべきルールは何ですか？
  choices:
    A: 2秒ルール
    B: 3秒ルール
    C: 4秒間の車間距離ルール
    D: 車1台分の距離ルール
  answer: C
  explanation: マニュアルでは、「4秒間の車間距離ルール」を使用して、常に安全に停止できる速度で運転するよう指示しています。
- id: 40
  category: safe_driving_rules
  question: ウィスコンシン州において、子供がいる場合のスクールゾーンでの通常の制限速度はどれくらいですか？
  choices:
    A: 時速15マイル
    B: 時速20マイル
    C: 時速25マイル
    D: 時速35マイル
  answer: A
  explanation: マニュアルには、子供がいる場合のスクールゾーンでの通常の制限速度は時速15マイルであると明記されています。
- id: 41
  category: safe_driving_rules
  question: 特に標識がない場合、住宅街の制限速度は何マイルですか？
  choices:
    A: 時速15マイル
    B: 時速25マイル
    C: 時速30マイル
    D: 時速35マイル
  answer: B
  explanation: 特に標識がない限り、住宅街の制限速度は時速25マイルです。
- id: 42
  category: defensive_driving
  question: 加速車線から高速道路に合流する際、運転者の責任は何ですか？
  choices:
    A: ランプ（接続路）の端で停止し、隙間ができるのを待つ
    B: 他の運転者に速度を変えさせて、自分が進入できるようにする
    C: 交通の流れの中に安全な隙間を見つけて、合法的に合流する
    D: 隙間ができるまで路肩を走行する
  answer: C
  explanation: 加速車線では、合流しながら速度を上げます。マニュアルには、交通の流れの中に安全な隙間を見つけて合法的に合流することは運転者の責任であると記載されています。
- id: 43
  category: defensive_driving
  question: 車両をより適切に制御するために、前方のどのくらい先まで見通せる必要がありますか？
  choices:
    A: 3〜5秒先
    B: 5〜10秒先
    C: 10〜15秒先
    D: 20〜30秒先
  answer: C
  explanation: 車両をより適切に制御するためには、運転者は自車の10〜15秒先まで見通せる必要があります。
- id: 44
  category: safe_driving_rules
  question: 交差点を通過する前に推奨される安全確認のパターンは何ですか？
  choices:
    A: 右を見て、次に左を見る
    B: 前方のみを見る
    C: 左、右、そしてもう一度左を見る
    D: バックミラーを見て、次に左を見る
  answer: C
  explanation: マニュアルでは、自分に優先権がある場合でも、交差点を通過する前に左、右、そしてもう一度左を確認して警戒することを推奨しています。
- id: 45
  category: safe_driving_rules
  question: 信号や標識のないT字路（丁字路）では、誰に優先権を譲らなければなりませんか？
  choices:
    A: 突き当たりの道路から来る車両
    B: 交差する道路の交通（直進車など）
    C: 左折する車両
    D: 最初にクラクションを鳴らした車両
  answer: B
  explanation: マニュアルの優先権に関する規則によると、信号や標識のないT字路では、交差する道路の交通に優先権を譲る必要があります。
- id: 46
  category: safe_driving_rules
  question: マニュアルで禁止されている、運転中の「コースティング（惰性走行）」とは何を意味しますか？
  choices:
    A: アクセルを使わずに運転すること
    B: ギアをニュートラルの位置に入れること
    C: パーキングブレーキを半分かけた状態で運転すること
    D: 走行中にエンジンを切ること
  answer: B
  explanation: マニュアルには、「運転中にコースティング（惰性走行）をしないでください。これはギアをニュートラルに入れることを意味します。車両を完全に制御できるように、常にギアを入れた状態（走行ギア）にしてください」と記載されています。
- id: 47
  category: defensive_driving
  question: 後続車が車間距離を詰めすぎていないかを確認するために、どのくらいの頻度でバックミラーをチェックすべきですか？
  choices:
    A: 3〜5秒ごと
    B: 6〜8秒ごと
    C: 10〜12秒ごと
    D: 15〜20秒ごと
  answer: B
  explanation: マニュアルでは、「後続車が車間距離を詰めすぎていないか（テールゲーティング）を確認するために、6〜8秒ごとにバックミラーをチェックしてください」とアドバイスしています。
- id: 48
  category: safe_driving_rules
  question: 他の運転者に車間距離を詰められた（あおり運転をされた）場合、どうすべきですか？
  choices:
    A: ブレーキを素早く踏んで警告する
    B: 速度を上げて車間距離を広げる
    C: ゆっくりと速度を落とし、相手が追い越して行くように促す
    D: 合図を出さずにすぐに車線変更する
  answer: C
  explanation: マニュアルには、「後続車に車間距離を詰められた場合は、ゆっくりと速度を落としてください。これにより、相手があなたの車の周りを追い越して行くよう促すことができます」と記載されています。
- id: 49
  category: safe_driving_rules
  question: 左折待ちをしている間、ハンドルをまっすぐに保つことが重要なのはなぜですか？
  choices:
    A: パワーステアリング液の過熱を防ぐため
    B: 道が開いたときに素早く加速するため
    C: 後方から追突された際に、対向車線に押し出されるのを防ぐため
    D: 他の運転者に優先権を譲っていることを知らせるため
  answer: C
  explanation: マニュアルでは、「ハンドルを左に切った状態で後方から追突されると、対向車線に押し出されてしまいます。ハンドル、車輪、および車体をまっすぐに保つことが重要です」と説明されています。
- id: 50
  category: safe_driving_rules
  question: 郊外の2車線道路において、どのような条件下でUターンが許可されますか？
  choices:
    A: 指定されたUターン車線がある場合のみ
    B: 安全に行われ、他の交通の妨げにならない場合
    C: 日中の時間帯のみ
    D: 郊外の2車線道路ではUターンは一切禁止されている
  answer: B
  explanation: マニュアルには、「安全に行われ、他の交通の妨げにならないのであれば、郊外のいかなる2車線道路でもUターンをすることができます」と記載されています。
- id: 51
  category: safe_driving_rules
  question: 4車線の道路から右折する場合、どの車線から曲がらなければなりませんか？
  choices:
    A: センターラインに最も近い車線
    B: 合図を出す限り、どの車線からでもよい
    C: 右側の縁石または道路の端に最も近い車線
    D: 交通量が最も少ない車線
  answer: C
  explanation: マニュアルには、「4車線の道路から右折するには、右側の縁石または道路の端に最も近い車線から曲がらなければならない」と明記されています。
- id: 52
  category: vehicle_information
  question: Yターン（3点方向転換）を行う際の最初のステップは何ですか？
  choices:
    A: 左に合図を出し、死角を確認する
    B: 右肩越しに後方を確認し、後退する
    C: 右に合図を出し、交通状況を確認し、できるだけ右側に寄せて停車する
    D: 前進し、そのまま車線を進む
  answer: C
  explanation: Yターンの最初のステップは、「1. 右に合図を出す。右側とミラーで交通状況を確認する。できるだけ右側に寄せる。停車する。」です。
- id: 53
  category: sharing_the_road
  question: 舗装された路肩を使用して他の車両を追い越すことが許されるのはどのような時ですか？
  choices:
    A: 前方の車両が速度制限を下回って走行しているとき
    B: 前方の車両が停車しているか、左折しようとしているときのみ
    C: 多車線の高速道路を走行しているとき
    D: 舗装された路肩での追い越しは決して許されない
  answer: B
  explanation: マニュアルには、「舗装された路肩を使用して誰かを避けて通ることができるのは、その車両が停車しているか、左折しようとしている場合のみである」と記載されています。
- id: 54
  category: defensive_driving
  question: 他の車両を追い越した後、走行車線に戻っても安全だとどのように判断しますか？
  choices:
    A: 追い越した車両の1台分前方に達したとき
    B: 追い越したばかりの車両の両方のヘッドライトがルームミラーに見えたとき
    C: 追い越された車両のドライバーがハイビームを点滅させたとき
    D: 車両を通り過ぎてから3秒後
  answer: B
  explanation: マニュアルには、「追い越したばかりの車両の両方のヘッドライトがルームミラーに見えたら、走行車線に戻っても安全である」と記載されています。
- id: 55
  category: vehicle_information
  question: 後退（バック）する際の最大速度はどのくらいにすべきですか？
  choices:
    A: 時速10マイル (10 mph)
    B: 時速5マイル (5 mph)
    C: ゆっくりとした歩行速度を超えない程度
    D: その道路の指定速度制限
  answer: C
  explanation: マニュアルでは、「後退が必要な場合はゆっくり移動すること。ゆっくりとした歩行速度より速く後退してはならない」とアドバイスしています。
- id: 56
  category: safe_driving_rules
  question: 道路で出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 直ちに停車し、路肩を後退する
    B: 次の中央分離帯の交差路でUターンする
    C: ギアをリバースに入れ、一番右側の車線を後退する
    D: 次の出口まで進み、再び道路に入り直して通り過ぎた出口まで戻る
  answer: D
  explanation: マニュアルには、「道路で出口や曲がり角を通り過ぎてしまった場合、後退してはならない。次の出口まで進み、再び道路に入り直して通り過ぎた出口まで戻ること」と明確に記されています。
- id: 57
  category: safe_driving_rules
  question: 提供されたマニュアルのテキストによると、駐車が厳格に禁止されているのはどこですか？
  choices:
    A: 郊外の2車線道路のどこでも
    B: 縁石に黄色の標示がある場所、または消火栓の前
    C: 道路の右端
    D: 道幅の狭い住宅街
  answer: B
  explanation: マニュアルには、「縁石に黄色の標示がある場所や、消火栓の前のエリアには駐車できない」と記載されています。
- id: 58
  category: safe_driving_rules
  question: 他の車両を追い越す際、速度制限を超えてもよいですか？
  choices:
    A: はい、ただし時速5マイルまで
    B: はい、大型トラックやバスを追い越す場合ならよい
    C: いいえ、他の車両を追い越すために速度制限を超えることはできない
    D: はい、ただし多車線の高速道路に限る
  answer: C
  explanation: マニュアルには、「道路上で他の車両を追い越すために速度制限を超えることはできない」とはっきりと記載されています。
- id: 59
  category: safe_driving_rules
  question: 縁石のある上り坂で駐車する場合、ハンドルをどちらの方向に切るべきですか？
  choices:
    A: 右いっぱいに切る
    B: 左いっぱいに切る
    C: 車輪をまっすぐにしておく
    D: わずかに右に切る
  answer: B
  explanation: マニュアルによると、縁石のある上り坂で駐車する場合は、パーキングに入れる前に車輪を左いっぱいに切ります。
- id: 60
  category: safe_driving_rules
  question: 車両を下り坂で駐車する場合、車輪をどちらの方向に向けなければなりませんか？
  choices:
    A: 右いっぱいに向ける
    B: 左いっぱいに向ける
    C: まっすぐにしておく
    D: 道路の中央に向ける
  answer: A
  explanation: マニュアルには、下り坂で駐車する場合は、車輪を右いっぱいに動かすと記載されています。
- id: 61
  category: safe_driving_rules
  question: 縦列駐車のスペースを探す際、自車よりもどのくらい長いスペースが必要ですか？
  choices:
    A: 1〜2フィート
    B: 3〜6フィート
    C: 6〜8フィート
    D: 8〜10フィート
  answer: B
  explanation: マニュアルでは、縦列駐車の準備をする際、自車よりも約3〜6フィート長い駐車スペースを見つけるよう推奨しています。
- id: 62
  category: safe_driving_rules
  question: 縦列駐車が完了した後、車両は縁石から約どのくらいの距離にあるべきですか？
  choices:
    A: 約6インチ
    B: 約1フィート
    C: 約2フィート
    D: 約3フィート
  answer: B
  explanation: 縦列駐車後にハンドルを直進状態に戻したとき、縁石から約1フィート離れ、前後の車両からは少なくとも2フィート離れている必要があります。
- id: 63
  category: safe_driving_rules
  question: 車両や歩行者がどのくらいの距離から見えない場合に、ロービーム（すれ違い用前照灯）を使用しなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 500フィート
    D: 1000フィート
  answer: C
  explanation: 500フィート（約1ブロック）先にいる車両や歩行者が見えない場合は、ロービーム（ヘッドライト）を使用しなければなりません。
- id: 64
  category: safe_driving_rules
  question: 法的にロービーム（ヘッドライト）の使用が義務付けられている時間帯はいつですか？
  choices:
    A: 日没から日の出まで
    B: 日没の30分後から日の出の30分前まで
    C: 日没の1時間後から日の出の1時間前まで
    D: 完全に暗いときのみ
  answer: B
  explanation: マニュアルには、日没の30分後から日の出の30分前までは、ロービーム（ヘッドライト）を使用しなければならないと記載されています。
- id: 65
  category: defensive_driving
  question: 対向車のドライバーがハイビーム（走行用前照灯）を消し忘れている場合、どうすべきですか？
  choices:
    A: ハイビームを素早く点滅させる
    B: 道路の左側を見る
    C: 道路の右側を見る
    D: ハザードランプを点灯させる
  answer: C
  explanation: 対向車がハイビームを消し忘れている場合は、道路の右側を見るようにしてください。
- id: 66
  category: safe_driving_rules
  question: 交差点で曲がる場合、いつから合図（ウィンカー）を出し始めるべきですか？
  choices:
    A: 右左折の約3秒前（約100フィート手前）
    B: 右左折の約5秒前（約200フィート手前）
    C: 交差点に入った直後
    D: 交差点で停止した後のみ
  answer: A
  explanation: 交差点で曲がる場合は、右左折の約3秒前（約100フィート手前）から合図を出し始める必要があります。
- id: 67
  category: vehicle_information
  question: 右折を示す正しい手信号は何ですか？
  choices:
    A: 運転席の窓から手を水平に出す
    B: 肘を曲げて手を上に向ける
    C: 手を地面に向ける
    D: 手を円を描くように振る
  answer: B
  explanation: 手信号で右折したい場合は、肘を曲げて手を上に向けます。
- id: 68
  category: signs_and_signals
  question: ほとんどの警戒標識（Warning signs）の色と形はどのようなものですか？
  choices:
    A: 赤と白の八角形
    B: 白と黒の長方形
    C: 黄色地に黒の文字または記号で、主にひし形
    D: 緑地に白の文字で、主に正方形
  answer: C
  explanation: 警戒標識は黄色地に黒の文字または記号が描かれています。その多くはひし形をしています。
- id: 69
  category: signs_and_signals
  question: 反射材付きのオレンジ色のマークがある三角形の標識は、低速走行車両（Slow-moving vehicle）を示します。この車両が走行している可能性のある最高速度はどれくらいですか？
  choices:
    A: 時速15マイル以下
    B: 時速25マイル以下
    C: 時速35マイル以下
    D: 時速45マイル以下
  answer: B
  explanation: 低速走行車両の標識は、反射材付きのオレンジ色のマークがある三角形の標識です。この車両は時速25マイル以下で走行します。
- id: 70
  category: signs_and_signals
  question: 追い越し禁止（No Passing Zone）の標識はどのような形をしていますか？
  choices:
    A: 黒い文字が書かれた黄色のペナント型（三角旗型）
    B: 白い文字が書かれた赤い八角形
    C: 下向きの赤と白の三角形
    D: 黒い文字が書かれた白い長方形
  answer: A
  explanation: 追い越し禁止の標識は、黒い文字が書かれた黄色のペナント型です。追い越し禁止区間では、いかなる車両も追い越すことはできません。
- id: 71
  category: signs_and_signals
  question: 警察官や学童擁護員（スクール・クロッシング・ガード）が信号機や標識と異なる指示を出した場合、どうすべきですか？
  choices:
    A: 信号機や標識に従う
    B: 警察官や学童擁護員の指示に従う
    C: 停止して信号が青になるのを待つ
    D: クラクションを鳴らして標識の存在を知らせる
  answer: B
  explanation: 道路上の信号機や標識と異なる場合であっても、警察官、学童擁護員、その他の作業員の指示に従わなければなりません。
- id: 72
  category: defensive_driving
  question: 車のクラクションを強く鳴らすのが適切なのはどのような時ですか？
  choices:
    A: 友人に挨拶をする時
    B: 走行が遅すぎるドライバーに合図を送る時
    C: 自分が誰かに衝突しそうな時、または誰かが自分に衝突しそうな時に警告する時
    D: 歩行者に横断歩道に近づいていることを知らせる時
  answer: C
  explanation: 自分が誰かに衝突しそうな時、または誰かが自分に衝突しそうな時に警告するために、クラクションを強く鳴らすことができます。
- id: 73
  category: vehicle_information
  question: 車の駐車灯（パーキングライト）はいつ使用すべきですか？
  choices:
    A: 濃霧の中を走行している時はいつでも
    B: 停車してアイドリングしている時のみ
    C: 日没から日の出までの間に走行する時
    D: 交通量の多い通りで縦列駐車をする時
  answer: B
  explanation: マニュアルによると、駐車灯は停車してアイドリングしている時にのみ使用してください。
- id: 74
  category: penalties_and_points
  question: 道路工事区域内での交通違反の罰金はどうなりますか？
  choices:
    A: 半額になる
    B: 変わらない
    C: 2倍になる
    D: 3倍になる
  answer: C
  explanation: 道路工事区域内では、ドライバーに減速を促し作業員を保護するための罰則として、交通違反の罰金が2倍になります。
- id: 75
  category: safe_driving_rules
  question: 工事区域内で携帯電話の使用が許可されるのはどのような時ですか？
  choices:
    A: ハンズフリー機器を使用している時
    B: 緊急事態を通報する場合のみ
    C: 交通が完全に停止している時
    D: 携帯電話の使用は一切許可されない
  answer: B
  explanation: マニュアルによると、工事区域内で携帯電話を使用できるのは、緊急事態を通報する場合のみです。
- id: 76
  category: signs_and_signals
  question: 公園、史跡、美術館などへの道順を示す案内標識は何色ですか？
  choices:
    A: 青
    B: オレンジ
    C: 茶色
    D: 黄色
  answer: C
  explanation: 茶色の案内標識は、公園、史跡、美術館などの楽しくて美しい場所に関する情報を示します。
- id: 77
  category: signs_and_signals
  question: 高速道路にあるマイルマーカー（距離標）の主な目的は何ですか？
  choices:
    A: 現在の制限速度を示すため
    B: この先の休憩所を示すため
    C: 高速道路での事故に対する緊急対応時間を短縮するため
    D: この先の工事区域をドライバーに警告するため
  answer: C
  explanation: マイルマーカーは道路上の現在地を特定するのに役立ち、高速道路での事故に対する緊急対応時間を短縮します。
- id: 78
  category: signs_and_signals
  question: 上部が赤、下部が青の盾のような形をした路線標識はどれですか？
  choices:
    A: 郡道（County Road）
    B: 米国国道（U.S. Route）
    C: 州道（State Road）
    D: 州間高速道路（Interstate Highway）
  answer: D
  explanation: 州間高速道路（Interstate Highway）の標識は、上部が赤、下部が青の盾のような形で、白い文字で書かれています。
- id: 79
  category: safe_driving_rules
  question: 踏切を通過中に「してはいけない」ことは何ですか？
  choices:
    A: 左右を確認する
    B: ギアチェンジをする
    C: 安全な距離を保つ
    D: 列車に道を譲る
  answer: B
  explanation: マニュアルには、踏切を通過中にギアチェンジをしてはならないと明記されています。
- id: 80
  category: signs_and_signals
  question: 踏切にある「Exempt（免除）」の標識は何を意味しますか？
  choices:
    A: その線路はもう使われていない
    B: 特定の車両は横断前に停止する必要がない
    C: その踏切には点滅灯がない
    D: 列車は車両のために停止しなければならない
  answer: B
  explanation: 「Exempt（免除）」の標識は、特定の車両が踏切を渡る前に停止する必要がないことを意味します。
- id: 81
  category: defensive_driving
  question: 踏切で車両が立ち往生した場合、危険な状況を報告するための電話番号はどこで確認できますか？
  choices:
    A: 踏切にある青地に白文字の標識を探す
    B: 黄色の警戒標識を探す
    C: クロスバック標識（X字型の踏切標識）の裏側を確認する
    D: 911にのみ電話する
  answer: A
  explanation: すべての道路と鉄道の交差部（踏切）には、青地に白文字の標識が設置されています。そこには、危険な状況や緊急事態を報告するための電話番号が記載されています。
- id: 82
  category: safe_driving_rules
  question: 信号機が停電したり、正常に作動していない場合、どのように進むべきですか？
  choices:
    A: 右側の車両に道を譲る
    B: 信号を「譲れ（Yield）」の標識として扱って進む
    C: 信号を「一時停止（Stop）」の標識として扱って進む
    D: 警察官が到着するまで待つ
  answer: C
  explanation: 信号機が停電したり、正常に作動していない場合は、その信号を一時停止標識として扱って進まなければなりません。
- id: 83
  category: safe_driving_rules
  question: 赤信号で左折ができるのはどのような条件のときですか？
  choices:
    A: 赤信号で左折することは決してできない
    B: 一方通行の道路から別の一方通行の道路へ曲がる場合
    C: 対向車がいない場合
    D: 対面通行の道路から一方通行の道路へ曲がる場合
  answer: B
  explanation: 一方通行の道路から別の一方通行の道路へ左折する場合に限り、まず一時停止し、他の交通に道を譲った上で、赤信号でも左折することができます。
- id: 84
  category: safe_driving_rules
  question: 黄色の点灯信号に変わったとき、すでに交差点内にいる場合はどうすべきですか？
  choices:
    A: 交差点内ですぐに停止する
    B: 交差点からバックして出る
    C: そのまま交差点を通過する
    D: 路肩に寄せる
  answer: C
  explanation: 黄色信号に変わったときにすでに交差点内にいる場合は、停止してはいけません。そのまま交差点を通過してください。
- id: 85
  category: signs_and_signals
  question: 黄色の点滅信号は何を意味しますか？
  choices:
    A: 完全に停止し、青信号を待つ
    B: 信号がまもなく赤に変わる
    C: 徐行し、交差する交通を確認して、注意して進む
    D: 対向車に道を譲って左折する
  answer: C
  explanation: 黄色の点滅信号は、徐行し、交差する交通を確認した上で、注意して進むべきであることを意味します。
- id: 86
  category: safe_driving_rules
  question: 青信号で左折するとき、何をしなければなりませんか？
  choices:
    A: 優先権があるため、すぐに進む
    B: 対向車に道を譲る
    C: 青色の矢印信号を待つ
    D: 停止して信号が黄色に変わるのを待つ
  answer: B
  explanation: 左折する場合、青信号は「安全が確認できた場合に限り曲がることができる」ことを意味します。対向車に優先権があります。
- id: 87
  category: signs_and_signals
  question: 交差点で左折する際、青信号は何を意味しますか？
  choices:
    A: 対向車に対して優先権がある
    B: 対向車に道を譲り、安全な場合にのみ曲がることができる
    C: 曲がる前に青色の矢印信号を待たなければならない
    D: 歩行者に道を譲らずに曲がることができる
  answer: B
  explanation: マニュアルによると、左折する場合、青信号は安全な場合にのみ曲がることができることを意味しますが、対向車に道を譲らなければなりません。対向車に優先権があります。
- id: 88
  category: safe_driving_rules
  question: 同じ方向に進む車線を区切る実線の白線を越えることが許可されるのはどのようなときですか？
  choices:
    A: 遅い車両を追い越す必要があるときはいつでも
    B: 危険がある場合、または次のブロック内で曲がる場合のみ
    C: スクールゾーンを走行しているとき
    D: 実線の白線を越えることは決して許されない
  answer: B
  explanation: マニュアルには、車線間の実線の白線は越えてはならないと記載されています。越えることができるのは、危険がある場合、または次のブロック内で曲がる場合に限られます。
- id: 89
  category: safe_driving_rules
  question: 2本の実線の黄色い線は、どの車線からも追い越しができないことを意味します。このルールの例外は何ですか？
  choices:
    A: 制限速度の半分未満で走行している車両を追い越す場合（農耕器具を除く）
    B: 黄色の点滅灯をつけたスクールバスを追い越す場合
    C: 制限速度の半分未満で走行している農用トラクターを追い越す場合
    D: 緊急事態で遅れているときに追い越す場合
  answer: A
  explanation: 2本の実線の黄色い線のルールの例外として、安全であれば制限速度の半分未満で走行している車両を追い越すことができますが、それが農耕器具である場合は除きます。
- id: 90
  category: safe_driving_rules
  question: 横断歩道で停止するとき、車両はどの位置にあるべきですか？
  choices:
    A: 前輪が実線の白線の上にある状態
    B: 前輪が実線の白線の直前で止まっている状態
    C: 横断歩道の途中で止まるべきである
    D: 横断歩道の少なくとも10フィート手前で止まるべきである
  answer: B
  explanation: マニュアルには、前輪は実線の白線の直前で停止させるべきであり、横断歩道の上で停止してはならないと記載されています。
- id: 91
  category: safe_driving_rules
  question: 共有センターレーン（Shared center lane）は何のために使用されますか？
  choices:
    A: 低速車両を追い越すため。
    B: 緊急時の駐車のため。
    C: 車両が左折またはUターンするため。
    D: バスと自転車が専用で使用するため。
  answer: C
  explanation: 共有センターレーンは、左折またはUターンをする車両のみが使用できます。いずれの方向から進んできた車両も、この車線を利用することができます。
- id: 92
  category: signs_and_signals
  question: リバーシブルレーンの上にある黄色の「X」信号は何を示していますか？
  choices:
    A: その車線は走行可能である。
    B: その車線はすべての交通に対して閉鎖されている。
    C: その車線は左折専用である。
    D: 車線の通行方向が切り替わるため、緑の矢印が表示されている車線へ移動しなければならない。
  answer: D
  explanation: リバーシブルレーンの黄色い「X」は、車線の運用が変更されることを意味しており、緑の「矢印」が表示されている車線に移動する必要があります。
- id: 93
  category: safe_driving_rules
  question: 指定された車両（バスや自転車など）を運転していない場合、法的に専用車線（Reserved lane）を走行できるのはどのような時ですか？
  choices:
    A: 一般車線がひどく渋滞している時。
    B: 次の半ブロック以内で、その専用車線を横切って曲がる必要がある時。
    C: 午前6時から午前9時の間に運転している時。
    D: いかなる状況においても、専用車線を走行することは決して許されない。
  answer: B
  explanation: 指定された種類の車両を運転している場合を除き、専用車線を走行することは違法ですが、次の半ブロック以内でその車線を横切って曲がる必要がある場合には、その車線を走行することができます。
- id: 94
  category: safe_driving_rules
  question: フレックスレーン（Flex lane）を走行することが許可されていない車両はどれですか？
  choices:
    A: 乗用車
    B: オートバイ
    C: 大型トラック
    D: カープール（相乗り）車両
  answer: C
  explanation: マニュアルには「大型トラックはフレックスレーンを走行できない」と明記されています。
- id: 95
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）内では、交通はどの方向に進みますか？
  choices:
    A: 時計回り
    B: 反時計回り
    C: 「8の字」のパターン
    D: 曲がらずに直進
  answer: B
  explanation: マニュアルによると、ラウンドアバウトはより安全で効率的な交通の流れを実現する選択肢であり、交通は反時計回りに進みます。
- id: 96
  category: sharing_the_road
  question: ラウンドアバウトに接近する際、以下のどれに対して進路を譲らなければなりませんか？
  choices:
    A: 右側から接近してくる車両。
    B: 左側に位置し、すでにラウンドアバウト内にいる車両。
    C: 反対側からラウンドアバウトに入ろうとしている車両。
    D: 緊急車両のみ。
  answer: B
  explanation: ラウンドアバウトに到達した際は、歩行者、自転車、セミトレーラー、および左側のすでにラウンドアバウト内にいる車両に進路を譲らなければなりません。
- id: 97
  category: safe_driving_rules
  question: すでにラウンドアバウト内を走行している時に、サイレンを鳴らした緊急車両が進入してきた場合、どうすべきですか？
  choices:
    A: 緊急車両を通過させるため、直ちにラウンドアバウト内で停止する。
    B: 速度を上げ、できるだけ早くラウンドアバウトから出る。
    C: 次の出口で安全に右に出てから、車を寄せて停車する。
    D: 中央島（センターアイランド）の左側に車を寄せる。
  answer: C
  explanation: 緊急車両が進入してきた時にすでにラウンドアバウト内にいる場合は、次の出口で安全に右に出てから、車を寄せて停車してください。ラウンドアバウト内での停止は避けなければなりません。
- id: 98
  category: safe_driving_rules
  question: メーター制の高速道路入り口ランプ（Metered freeway entrance ramp）で、白い停止線の直前まで完全に進まなければならないのはなぜですか？
  choices:
    A: 後続車が追い越せるようにするため。
    B: タイヤで路面のセンサーを反応させるため。
    C: 高速道路の交通状況をよりよく確認するため。
    D: 横断歩道を塞いで違反切符を切られないようにするため。
  answer: B
  explanation: メーター制のランプでは、タイヤが路面のセンサーを反応させるように、白い停止線の直前まで完全に進む必要があります。
- id: 99
  category: signs_and_signals
  question: 緑色の矢印信号の点灯は何を示していますか？
  choices:
    A: 矢印の方向に進むことができ、対向車や交差する交通はないはずである。
    B: 曲がることはできるが、まず対向車に進路を譲らなければならない。
    C: 車線が切り替わるため、隣の車線に合流しなければならない。
    D: 交差点を直進することしかできない。
  answer: A
  explanation: 緑色の矢印信号は、その矢印の方向に進めることを意味します。矢印が緑色の間は、対向車や交差する交通はないはずです。
- id: 100
  category: signs_and_signals
  question: 黄色の破線と実線が並んでいる道路標示は何を意味しますか？
  choices:
    A: 道路の両側の車両ともに追い越しが許可されている。
    B: 道路の両側の車両ともに追い越しが禁止されている。
    C: 破線側にいる場合は追い越しができるが、実線側にいる場合は追い越しができない。
    D: 実線側にいる場合は追い越しができるが、破線側にいる場合は追い越しができない。
  answer: C
  explanation: 黄色い破線と実線の標示は、破線側にいる場合は追い越しが可能であることを意味します。実線側にいる場合は、追い越しは禁止されています。
- id: 101
  category: sharing_the_road
  question: 専用車線を横切って法的に右左折しようとしている際に、その車線内に自転車利用者がいる場合、どうすべきですか？
  choices:
    A: 右左折する前に、スピードを上げて自転車を追い越す。
    B: クラクションを鳴らして、自転車利用者に道を譲るよう警告する。
    C: 自転車利用者の後ろに移動し、安全が確認できてから右左折する。
    D: 一般車線で停止し、自転車利用者が先に曲がるのを待つ。
  answer: C
  explanation: マニュアルには、専用車線に自転車利用者がいる場合は、その人の後ろに移動し、安全が確認できてから右左折すべきであると記載されています。
- id: 102
  category: safe_driving_rules
  question: 信号制御（メーター制）のある高速道路の入口ランプに接近し、信号が赤である場合、どうすべきですか？
  choices:
    A: 白い停止線の10フィート手前で停止する。
    B: 白い停止線のすぐ手前まで進んで停止する。
    C: 高速道路が空いている場合は、停止せずに進む。
    D: 隣の車線の車両が先に行くのを待つ。
  answer: B
  explanation: マニュアルには、タイヤが路面のセンサーを反応させるよう、白い停止線のすぐ手前まで進んで停止すべきであると記載されています。
- id: 103
  category: driver_responsibility
  question: 交通取り締まりで警察官に車を止められた際、手はどこに置くべきですか？
  choices:
    A: 膝の上。
    B: 窓の外。
    C: ハンドル（ステアリングホイール）の上部の、はっきりと見える場所。
    D: ポケットの中、またはジャケットの内側。
  answer: C
  explanation: 警察官に止められた場合は、手をハンドル（ステアリングホイール）の上部のはっきりと見える場所に置き、急な動きをしないようにしてください。
- id: 104
  category: defensive_driving
  question: シカが最も活発に活動するのは、一日のうちのどの時間帯ですか？
  choices:
    A: 日の出から正午まで。
    B: 午後の最も暑い時間帯。
    C: 日没から日の出まで。
    D: 激しい雨や霧の時のみ。
  answer: C
  explanation: マニュアルによると、シカは日没から日の出までの時間帯に最も活発になります。
- id: 105
  category: driver_responsibility
  question: 車両でシカをはねてしまった場合、その動物を持ち帰ることに関する規則はどうなっていますか？
  choices:
    A: 誰であってもシカを持ち帰ることは違法である。
    B: 警察官または動物管理官のみがシカを回収できる。
    C: あなたが持ち帰ることもできるし、あなたが希望しない場合は次に通りかかったドライバーが持ち帰ることもできる。
    D: 道路の脇に放置しなければならない。
  answer: C
  explanation: マニュアルには「シカをはねた場合、それを持ち帰ることができます。あなたが希望しない場合は、次に通りかかったドライバーが持ち帰ることができます」と記載されています。また、警察に連絡してタグ（所有許可証）を発行してもらう必要があります。
- id: 106
  category: sharing_the_road
  question: 葬列（葬儀の車列）に加わって走行している車両には、何が義務付けられていますか？
  choices:
    A: 常にハザードランプを点滅させなければならない。
    B: ヘッドライトを点灯させなければならない。
    C: 交差点を通過する際にクラクションを鳴らさなければならない。
    D: 規定の制限速度より少なくとも時速15マイル以上減速して走行しなければならない。
  answer: B
  explanation: マニュアルでは、葬列に加わっている車両はヘッドライトを点灯させなければならず、他のドライバーはその車列に割り込んだり妨害したりしてはならないと規定されています。
- id: 107
  category: safe_driving_rules
  question: 悪天候時、路面の他の部分よりも先に凍結しやすいのはどこですか？
  choices:
    A: 交差点。
    B: 橋や高架道路。
    C: トンネル。
    D: 砂利の路肩。
  answer: B
  explanation: 悪天候時には、橋や高架道路が路面の他の部分よりも先に凍結することを覚えておくことが重要です。
- id: 108
  category: defensive_driving
  question: 車両がハイドロプレーニング現象を起こし始めたら、どうすべきですか？
  choices:
    A: すぐにブレーキを強く踏む。
    B: ハンドルを右に急に切る。
    C: アクセルペダルからゆっくり足を離し、ハンドルをまっすぐに保つ。
    D: 加速して、たまっている水を突き抜ける。
  answer: C
  explanation: スリップしたりハイドロプレーニング現象が起きたりした場合は、アクセルペダルからゆっくり足を離し、ハンドルをまっすぐに保ちます。タイヤが再び路面をグリップするまで、停止や旋回を試みてはいけません。
- id: 109
  category: defensive_driving
  question: 車両がスリップし始めて制御を失った場合、どのようにハンドル操作をすべきですか？
  choices:
    A: スリップしている方向とは逆の方向にハンドルを切る。
    B: 車両を進めたい方向にハンドルを切る。
    C: ハンドルを完全にまっすぐに保つ。
    D: ハンドルを素早く左右に回す。
  answer: B
  explanation: スリップしたときは、ブレーキを踏まずに、車両を進めたい方向にハンドルを切り、車がまっすぐになり始めたらすぐに反対方向に回して戻します。
- id: 110
  category: sharing_the_road
  question: 冬の天候下で走行中、除雪車がライトを点滅させている場合、どのくらいの距離を空けるべきですか？
  choices:
    A: 少なくとも50フィート。
    B: 少なくとも100フィート。
    C: 少なくとも200フィート。
    D: 少なくとも500フィート。
  answer: C
  explanation: マニュアルでは、除雪車が赤、琥珀色、または緑色のライトを点滅させているときは、少なくとも200フィートの距離を空けるようアドバイスしています。
- id: 111
  category: sharing_the_road
  question: 高速道路上や道路沿いで家畜に遭遇した際、クラクションを鳴らすのを避けるべきなのはなぜですか？
  choices:
    A: 田舎道でクラクションを使用することは違法だから。
    B: 動物を驚かせてしまう可能性があるから。
    C: 農家が農機具を完全に停止させてしまう原因になるから。
    D: 地域の騒音規制に抵触するから。
  answer: B
  explanation: 家畜に遭遇した際は、進路を譲り、動物を驚かせないようクラクションを鳴らさないようにしてください。
- id: 112
  category: defensive_driving
  question: 道路脇に停車している車両を見つけた場合、後続車にどのように警告を伝えることができますか？
  choices:
    A: ハイビームを点灯させる。
    B: クラクションを2回鳴らす。
    C: ブレーキペダルを3、4回軽く踏む（ポンピングブレーキ）。
    D: 隣の車線へ少しはみ出すように走る。
  answer: C
  explanation: 道路脇に停車車両があるのを見つけた場合は、ブレーキペダルを3、4回軽く踏んで後続車に警告を伝えてください。
- id: 113
  category: vehicle_information
  question: 緊急時にアンチロック・ブレーキ・システム（ABS）を使用する適切な方法は何ですか？
  choices:
    A: 停止するまで、優しくポンピングブレーキを繰り返す。
    B: ブレーキペダルを強く、継続的に踏み続ける。
    C: 車輪のロックを避けるため、ブレーキを繰り返し軽く叩くように踏む。
    D: ブレーキペダルを軽く踏み、ハンドルを急に切る。
  answer: B
  explanation: 緊急時にABSを使用する適切な方法は、車両が停止するか危険が去るまで、ブレーキペダルを強く、継続的に踏み続けることです。
- id: 114
  category: driver_responsibility
  question: 物損被害が少なくともいくら以上の場合、警察に事故を報告しなければなりませんか？
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: 物損被害が1,000ドル以上の場合は、警察に事故を報告する必要があります。
- id: 115
  category: driver_responsibility
  question: 公共物（標識やガードレールなど）に少なくともいくら以上の損害を与えた場合、警察に事故を報告する義務がありますか？
  choices:
    A: $100
    B: $200
    C: $500
    D: $1,000
  answer: B
  explanation: 公共物に200ドル以上の損害が発生した事故は、警察に報告しなければなりません。
- id: 116
  category: safe_driving_rules
  question: 滑りやすい冬の道を運転する際、使用してはいけない車両機能は何ですか？
  choices:
    A: ヘッドライト
    B: ワイパー
    C: デフロスター（除霜装置）
    D: クルーズコントロール
  answer: D
  explanation: マニュアルの冬道運転のヒントには、「滑りやすい道路ではクルーズコントロールを使用しないでください」と明記されています。
- id: 117
  category: defensive_driving
  question: 走行中にタイヤがパンク（バースト）した場合、まず何をすべきですか？
  choices:
    A: すぐにブレーキを強く踏む。
    B: ギアをニュートラルに入れる。
    C: ハンドルをしっかり握り、車両を直進させる。
    D: ブレーキペダルを数回ポンピングする。
  answer: C
  explanation: タイヤがパンクした場合は、ハンドルをしっかり握って直進を保ち、アクセルペダルから足を離して、少しずつ減速してください。
- id: 118
  category: defensive_driving
  question: 走行中にアクセルペダルが戻らなくなった（固着した）場合、適切な対処法は何ですか？
  choices:
    A: 道路から目を離さず、ギアをニュートラルに入れる。
    B: 交通の中にいる間に、すぐにエンジンを切る。
    C: パーキングブレーキを力いっぱい引く。
    D: 戻るまでアクセルペダルを繰り返し踏み込む。
  answer: A
  explanation: アクセルペダルが戻らなくなった場合は、道路から目を離さず、ギアをニュートラルに入れ、安全を確認して道路脇に寄せてからエンジンを切ってください。
- id: 119
  category: alcohol_drugs_health
  question: 21歳未満の運転者に許容される法定アルコール濃度はいくらですか？
  choices:
    A: 0.08%
    B: 0.04%
    C: 0.02%
    D: 0.00%
  answer: D
  explanation: 21歳未満の運転者に許容される法定アルコール濃度は0.00%です。つまり、車両を運転する際、体内に一切のアルコールが入っていてはいけません。
- id: 120
  category: penalties_and_points
  question: 「黙示の同意法（Implied Consent Law）」に基づき、禁止アルコール濃度（PAC）検査を拒否した場合はどうなりますか？
  choices:
    A: 警告を受け、そのまま運転して帰宅できる。
    B: 少なくとも1年間、運転免許の効力が停止される。
    C: 免許証に6点の減点が科される。
    D: 筆記試験の再受験を求められる。
  answer: B
  explanation: PAC検査を拒否した場合、警察官は黙示の同意法違反であなたを逮捕しなければならず、少なくとも1年間は運転資格を失うことになります。
- id: 121
  category: safe_driving_rules
  question: 仮免許（instruction permit）および試用免許（probationary license）の保持者が、運転中に携帯電話を使用できるのはどのような時ですか？
  choices:
    A: ハンズフリー機器を使用している時
    B: 緊急事態を通報する場合のみ
    C: 赤信号で停車している時
    D: GPSの経路案内を読んでいる時
  answer: B
  explanation: 仮免許および試用免許の保持者は、緊急事態を通報する場合にのみ携帯電話を使用することができます。
- id: 122
  category: sharing_the_road
  question: 赤色灯を点灯させサイレンを鳴らして路肩に停車しているパトカーに近づく場合、どうしなければなりませんか？
  choices:
    A: 自分の車線ですぐに停車し、パトカーが立ち去るのを待つ
    B: 通過することを知らせるためにクラクションを鳴らす
    C: 停車車両から離れた方の車線に移動するか、減速する
    D: 現場を素早く通り過ぎるために加速する
  answer: C
  explanation: 赤色灯を点灯させサイレンを鳴らして路肩に停車しているパトカーを見かけた場合は、車線を移動するか減速することが法律で義務付けられています。緊急車両に近づく際は、停車車両に最も近い車線以外の車線に移動するようにしてください。
- id: 123
  category: sharing_the_road
  question: スクールバスが赤色灯を点滅させて停車している場合、少なくとも何フィート離れて停車しなければなりませんか？
  choices:
    A: 少なくとも10フィート
    B: 少なくとも15フィート
    C: 少なくとも20フィート
    D: 少なくとも50フィート
  answer: C
  explanation: スクールバスが赤色灯を点滅させて停車しているときは、バスから少なくとも20フィート離れた場所で停車する必要があります。
- id: 124
  category: sharing_the_road
  question: 赤色灯を点滅させているスクールバスに対して、停車する必要が「ない」のはどのような状況ですか？
  choices:
    A: 多車線道路でバスと同じ方向に走行している時
    B: 中央分離帯のある道路（divided highway）で、バスとは反対側の車線を走行している時
    C: 緊急の用事で遅れている時
    D: バスの外に子供の姿が見えない時
  answer: B
  explanation: 中央分離帯のある道路を走行しており、スクールバスがいる側とは反対側の車線にいる場合は、停車する必要はありません。中央分離帯のある道路とは、反対方向に進む車線の間に障壁がある道路のことです。
- id: 125
  category: sharing_the_road
  question: 自転車を追い越す際、どのくらいの距離を空けなければなりませんか？
  choices:
    A: 少なくとも1フィート
    B: 少なくとも2フィート
    C: 少なくとも3フィート
    D: 少なくとも5フィート
  answer: C
  explanation: 自転車を追い越すときは、少なくとも3フィートの間隔を空けてください。
- id: 126
  category: sharing_the_road
  question: 大型トラックと道路を共有する際の「ノー・ゾーン（No-Zone）」とは何ですか？
  choices:
    A: トラックの走行が禁止されている指定車線
    B: 大型トラックの運転手から見えない、車両の後方約200フィートおよび前方約20フィートの範囲
    C: 商用車が減速しなければならない学校近くの区域
    D: 中央分離帯のある道路で追い越しが禁止されている区域
  answer: B
  explanation: ノー・ゾーンとは、大型車両の運転手からあなたの車が見えない死角のことです。この範囲は、大型トラックの後方約200フィート、前方約20フィートに及びます。
- id: 127
  category: penalties_and_points
  question: 12ヶ月間に何点の減点ポイント（demerit points）が累積すると、運転免許の停止または取り消しになりますか？
  choices:
    A: 6ポイント以上
    B: 8ポイント以上
    C: 10ポイント以上
    D: 12ポイント以上
  answer: D
  explanation: 12ヶ月間に12ポイント以上の減点ポイントが累積すると、運転ができなくなります。運転免許は停止または取り消されます。
- id: 128
  category: penalties_and_points
  question: 試用免許（probationary license）の保持者が2回目の交通違反で有罪判決を受けた場合、減点ポイントはどうなりますか？
  choices:
    A: ポイントが半分に減らされる
    B: ポイントが2倍になる
    C: 安全講習を受ければポイントが抹消される
    D: ポイントは変わらないが、罰金が2倍になる
  answer: B
  explanation: 試用免許、身分証明書（IDカード）、または免許を持っていない場合、ポイントは2倍になります。これらのポイントは、2回目以降の有罪判決時に2倍として計算されます。
- id: 129
  category: penalties_and_points
  question: 常習交通違反者（habitual traffic offender）とは、何年以内に4回以上の重大な交通違反、または12回以上の軽微な違反で有罪判決を受けた人のことですか？
  choices:
    A: 1年
    B: 3年
    C: 5年
    D: 10年
  answer: C
  explanation: 常習違反者とは、5年以内に4回以上の重大な交通違反、または12回以上の軽微な違反で有罪判決を受けた人のことを指します。
- id: 130
  category: license_system
  question: 就労用免許（occupational license）では、仕事、通学、および家事維持のために、週に最大何時間まで運転が許可されますか？
  choices:
    A: 20時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: D
  explanation: 就労用免許では、仕事、通学、および生活を維持するために必要な場所への往復として、1日最大12時間、週に最大60時間までの運転が認められています。
- id: 131
  category: safe_driving_rules
  question: ウィスコンシン州法に基づき、車内でシートベルトの着用が義務付けられているのは誰ですか？
  choices:
    A: 運転者と助手席の同乗者のみ
    B: 18歳未満の同乗者のみ
    C: 運転者および年齢を問わずすべての同乗者
    D: エアバッグのない車両の同乗者のみ
  answer: C
  explanation: ウィスコンシン州法では、運転者および年齢を問わずすべての同乗者がシートベルト（安全ベルト）を着用することを義務付けています。
- id: 132
  category: vehicle_information
  question: 車両にエアバッグが装備されている場合でも、シートベルトを着用する必要がありますか？
  choices:
    A: いいえ、エアバッグがあればシートベルトを着用する必要はありません。
    B: はい、車両にエアバッグが装備されていても、シートベルトを着用する必要があります。
    C: 高速道路を走行する場合のみ必要です。
    D: 後部座席の同乗者のみ着用する必要があります。
  answer: B
  explanation: マニュアルには「車両にエアバッグが装備されていても、シートベルトを着用する必要があります」と記載されています。シートベルトは、車両を制御するための正しい姿勢を保ち、怪我を避けるのに役立ちます。
- id: 133
  category: safe_driving_rules
  question: シートベルトの腰ベルト（ラップベルト）はどのように装着すべきですか？
  choices:
    A: 太ももの上に緩めに通す
    B: 腹部を横切るようにぴったりと締める
    C: 腹部のすぐ下の腰骨を横切るようにぴったりと締める
    D: ウエストの高い位置に締める
  answer: C
  explanation: 腰ベルトは、腹部のすぐ下の腰骨を横切るようにぴったりとフィットさせる必要があります。
- id: 134
  category: safe_driving_rules
  question: 肩ベルト（ショルダーベルト）の正しい着用方法は何ですか？
  choices:
    A: 快適さのために脇の下に通す
    B: 胸を横切るように通し、ベルトと胸の間に握りこぶしが入る程度の余裕を持たせる
    C: 肩の上に緩くかける
    D: 首に当たる場合は背中の後ろに通す
  answer: B
  explanation: 肩ベルトは胸を横切るように着用してください。ベルトと胸の間に握りこぶしが入る程度に調整します。肩ベルトを脇の下に通してはいけません。
- id: 135
  category: safe_driving_rules
  question: 一般的に、子供がチャイルドシートからブースターシートに切り替えることができるのは何歳からですか？
  choices:
    A: 2歳
    B: 4歳
    C: 6歳
    D: 8歳
  answer: B
  explanation: 一般的に、子供は4歳になるまでチャイルドシートを使用し、8歳になるまでブースターシートを使用しなければなりません。
- id: 136
  category: safe_driving_rules
  question: 一般的に、子供は何歳になるまでブースターシートを使用し続ける必要がありますか？
  choices:
    A: 4歳
    B: 6歳
    C: 8歳
    D: 10歳
  answer: C
  explanation: 一般的に、子供は4歳になるまでチャイルドシートを使用し、8歳になるまでブースターシートを使用しなければなりません。
- id: 137
  category: driver_responsibility
  question: ウィスコンシン州で運転するために必要な自動車保険の種類は何ですか？
  choices:
    A: 総合保険 (Comprehensive insurance)
    B: 車両保険 (Collision insurance)
    C: 有効な賠償責任保険 (Liability car insurance)
    D: 無保険車傷害特約のみ
  answer: C
  explanation: ウィスコンシン州で運転するには、有効な賠償責任保険（ライアビリティ保険）に加入している必要があり、警察官から求められた場合にはその証明を提示しなければなりません。
- id: 138
  category: driver_responsibility
  question: 他人の車を運転する場合、その車両が保険に加入していることを確認する責任は誰にありますか？
  choices:
    A: 車両所有者の責任
    B: 運転者としてのあなたの責任
    C: 保険会社の責任
    D: 陸運局（DMV）の責任
  answer: B
  explanation: 他人の車を運転する場合、その車が保険に加入していることを確認するのは運転者であるあなたの役目です。
- id: 139
  category: license_system
  question: 外見からは分からない障害（インビジブル・ディサビリティ）をDMVに申告することを選択した場合、その情報を閲覧できるのは誰ですか？
  choices:
    A: あなたの保険会社のみ
    B: 一般公衆
    C: 法執行官およびウィスコンシン州運輸局（WisDOT）の職員
    D: 医療専門家のみ
  answer: C
  explanation: 申告された情報は、法執行官（警察官など）およびウィスコンシン州運輸局（WisDOT）の職員が閲覧できるようになります。
- id: 140
  category: license_system
  question: ウィスコンシン州で投票用の無料身分証明書（IDカード）の申請手続きを開始するための最低年齢と市民権の要件は何ですか？
  choices:
    A: 16歳以上かつ米国市民
    B: 17歳以上かつ米国市民
    C: 18歳以上かつ米国市民
    D: 18歳以上かつ永住権保持者
  answer: B
  explanation: 投票用の無料IDの申請手続きを開始するには、17歳以上かつ米国市民である必要があります。
- id: 141
  category: driver_responsibility
  question: 18歳以上で臓器・組織提供者として登録した場合、その決定を覆すことができるのは誰ですか？
  choices:
    A: 両親
    B: 配偶者
    C: 医師
    D: 誰もその決定を覆すことはできない
  answer: D
  explanation: 18歳以上の場合、臓器・組織提供者になるという本人の決定は、家族や他のいかなる人物によっても覆されることはありません。
- id: 142
  category: vehicle_information
  question: タイヤの空気圧が低いと、車両にどのような影響を与えますか？
  choices:
    A: 燃費が向上する。
    B: 燃費が悪化する。
    C: 制動距離が改善される。
    D: エンジンの摩耗を防ぐ。
  answer: B
  explanation: タイヤの空気圧が低いと、燃費が悪化します。
- id: 143
  category: defensive_driving
  question: 燃料とブレーキの節約に役立つ運転習慣はどれですか？
  choices:
    A: 激しい渋滞の中でのストップ・アンド・ゴー走行
    B: 少しずつ減速する
    C: 交差点で急ブレーキをかける
    D: 低いタイヤ空気圧で走行する
  answer: B
  explanation: 少しずつ減速することで、燃料とブレーキの節約に役立ちます。
- id: 144
  category: license_system
  question: 運転者教育助成プログラム（Driver Education Grant Program）の目的は何ですか？
  choices:
    A: 安全運転者に大学の授業料を支払うため
    B: 低所得世帯に無料の車両を提供するため
    C: 収入要件を満たすティーンエイジャーの学科および/または実技講習の費用を支払うため
    D: 運転者に自動車保険料を払い戻すため
  answer: C
  explanation: 運転者教育助成プログラムは、収入要件を満たすティーンエイジャーが、州の負担で学科および/または実技（behind-the-wheel）の運転講習を受けられるようにするものです。
- id: 145
  category: alcohol_drugs_health
  question: 運転に影響を与える可能性のある健康上の問題がある場合、どうすべきですか？
  choices:
    A: 誰にも知らせずに運転を完全にやめる。
    B: 健康状態をDMV（陸運局）に報告する。
    C: 保険会社にのみ伝える。
    D: 免許の有効期限が切れるまで報告を待つ。
  answer: B
  explanation: 多くの健康上の問題が運転に影響を与える可能性があります。運転に影響を及ぼす可能性のある健康状態については、DMVに報告する必要があります。
- id: 146
  category: safe_driving_rules
  question: 速度制限の標識がない市や村の郊外における最高速度制限は何マイルですか？
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: マニュアルの練習問題によると、速度制限の標識がない市や村の郊外における最高速度制限は35 mphです。
- id: 147
  category: driver_responsibility
  question: 重大な自動車事故に巻き込まれた場合、義務付けられている行動は次のうちどれですか？
  choices:
    A: 直ちに現場を離れる
    B: 相手のドライバーが助けを呼ぶのを待つ
    C: 負傷者がいないか確認する
    D: 乗客の確認をする前に車両を移動させる
  answer: C
  explanation: マニュアルには、重大な自動車事故に巻き込まれた場合、停車し、負傷者がいないか確認し、911に通報しなければならないと記載されています。
- id: 148
  category: driver_responsibility
  question: 重大な自動車事故に巻き込まれた場合、どの番号に電話すべきですか？
  choices:
    A: '311'
    B: '411'
    C: '511'
    D: '911'
  answer: D
  explanation: 重大な自動車事故に巻き込まれた場合、マニュアルでは停車し、負傷の有無を確認し、911に電話するよう指示されています。
- id: 149
  category: safe_driving_rules
  question: 交差点で左折する場合、誰に道を譲らなければなりませんか？
  choices:
    A: 追い越し車のみ
    B: 直進または右折してくる対向車
    C: 反対方向から左折してくる車両
    D: 特に誰もいない
  answer: B
  explanation: 左折する運転者は、直進または右折してくる対向車に道を譲らなければなりません。
- id: 150
  category: safe_driving_rules
  question: 霧の中を走行する際、どの種類のヘッドライトを使用すべきですか？
  choices:
    A: ハイビーム
    B: ロービーム
    C: 駐停車灯（パーキングライト）のみ
    D: 非常点滅表示灯（ハザードランプ）
  answer: B
  explanation: 霧、激しい雨、または雪の中を走行する際は、ロービームを使用する必要があります。
- id: 151
  category: safe_driving_rules
  question: 激しい雨や雪の中を運転する場合、どのライトを使用するのが適切ですか？
  choices:
    A: ロービーム（すれ違い用前照灯）
    B: ハイビーム（走行用前照灯）
    C: ドライビングライトのみ
    D: 車内灯
  answer: A
  explanation: 霧、激しい雨、または雪の中を運転するときは、ロービームを使用する必要があります。
- id: 152
  category: signs_and_signals
  question: 黄色の点滅信号がある交差点に近づいたとき、どのように対応すべきですか？
  choices:
    A: 青信号になるのを待つ
    B: 交差点を通過する前に完全に停止する
    C: 交差点を素早く通過するために加速する
    D: 徐行し、注意して進む
  answer: D
  explanation: 黄色の点滅信号がある交差点に近づくときは、速度を落とし、注意して進まなければなりません。
- id: 153
  category: signs_and_signals
  question: 交通を仕切る1本の黄色の破線は何を示していますか？
  choices:
    A: 車線が同じ方向に進んでいること
    B: いかなる状況でも追い越しが禁止されていること
    C: 車線が反対方向に進んでおり、安全であれば追い越しが可能であること
    D: 線を越える前に停止しなければならないこと
  answer: C
  explanation: 1本の黄色の破線は、車線が反対方向に進んでおり、安全であれば追い越しができることを意味します。
- id: 154
  category: signs_and_signals
  question: 反対方向に進む交通を分ける線の色は何色ですか？
  choices:
    A: 白
    B: 黄色
    C: 赤
    D: 青
  answer: B
  explanation: 1本の黄色の破線は、車線が反対方向に進んでいる場所で交通を分けます。
- id: 155
  category: safe_driving_rules
  question: 州間高速道路（インターステート）に合流する際の適切な手順は何ですか？
  choices:
    A: 高速道路に入る前に必ず停止する
    B: 安全な車間の空きを見つけ、交通の流れに合流する
    C: 一度に2車線をまたいで合流し、加速する
    D: 他のドライバーが譲るように、強引に割り込む
  answer: B
  explanation: 州間高速道路に合流するときは、安全な車間の空きを見つけ、交通の流れに合流する必要があります。
- id: 156
  category: safe_driving_rules
  question: 掲示されている制限速度を超えて運転してもよいのは、どのような状況ですか？
  choices:
    A: 自分の車線に他の車が見当たらない場合
    B: 安全な状況である限り
    C: 他の車両を追い越すとき
    D: いかなる場合も認められない
  answer: D
  explanation: マニュアルの練習問題によると、掲示されている制限速度を超えて運転することは、いかなる場合も認められません。
- id: 157
  category: defensive_driving
  question: 運転中、道路のどのくらい先を見るべきですか？
  choices:
    A: 1〜2ブロック先
    B: 200〜250ヤード先
    C: 10〜15秒先
    D: 5〜8秒先
  answer: C
  explanation: 運転中は、道路の10〜15秒先を見るようにすべきです。
- id: 158
  category: sharing_the_road
  question: 自転車を追い越したいときに、対向車が近づいてきている場合はどうすべきですか？
  choices:
    A: 対向車が来る前に自転車を追い越せるよう加速する
    B: 自転車にクラクションを鳴らし、道路から退くよう促す
    C: 減速して対向車を通過させ、その後に自転車を追い越す
    D: 路肩に寄せて完全に停止する
  answer: C
  explanation: 自転車を追い越したいときに対向車がいる場合は、速度を落として対向車を先に通過させ、その後に自転車を追い越すべきです。
- id: 159
  category: safe_driving_rules
  question: 夜間運転時に推奨される安全策は何ですか？
  choices:
    A: 常にハイビームを使用する
    B: 対向車のヘッドライトを直視する
    C: 前の車のテールランプが見えるよう、車間距離を詰めて運転する
    D: 車間距離を長く取る
  answer: D
  explanation: 夜間に運転するときは、車間距離を長く取る必要があります。
- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 徐行し、注意して進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤色の八角形の「STOP（一時停止）」標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に交通状況と歩行者を確認してください。
  id: 160
- image: yield.png
  category: signs_and_signals
  id: 161
  question: この標識は何をすることを求めていますか？
  choices:
    A: 一時停止する
    B: 加速して交通の流れに合流する
    C: 徐行し、他の車両や歩行者に優先権を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「ゆずれ（YIELD）」標識は、速度を落とし、他の車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
- image: wrong_way.png
  category: signs_and_signals
  id: 162
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: 転回（Uターン）する
    B: 注意深く運転を続ける
    C: 停止して後退するか、向きを変える。あなたは逆走しています。
    D: そのエリアを早く抜けるために加速する
  answer: C
  explanation: 赤と白の「進入禁止（WRONG WAY）」標識は、一方通行の道路や高速道路のランプで、交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に向きを変えるか後退してください。
- image: no_left_turn.png
  category: signs_and_signals
  id: 163
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が禁止されていることを意味します。
- image: speed_limit_25.png
  category: signs_and_signals
  id: 164
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 白い長方形に黒い文字の標識は規制標識です。最高速度制限の標識は、理想的な条件下でのその区域の法定最高速度を示しています。
- image: deer_crossing.png
  category: signs_and_signals
  id: 165
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園やサファリパークがある
    B: この区域では鹿が頻繁に道路を横断する
    C: この先が狩猟区域である
    D: 近くに野生動物保護区がある
  answer: B
  explanation: 鹿のシルエットが描かれた黄色いひし形の標識は、この区域で鹿が頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
- image: school_zone.png
  category: signs_and_signals
  id: 166
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区域
    C: 学校区域または通学路
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、学校区域または通学路であることを示しています。速度を落とし、子供に注意してください。
- image: railroad_crossbuck.png
  category: signs_and_signals
  id: 167
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型のクロスバック（Crossbuck）標識は踏切に設置されます。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
- image: sharp_turn_right.png
  category: signs_and_signals
  id: 168
  question: この標識はカーブの標識とどう違いますか？
  choices:
    A: より緩やかな曲がり角を示している
    B: より大きな減速が必要な急カーブを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（角度の急な矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
- image: divided_highway.png
  category: signs_and_signals
  id: 169
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 分離帯のある道路（中央分離帯のあるハイウェイ）の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって反対車線と仕切られた分離道路になることを警告しています。右側を通行してください。
- image: handicap_parking.png
  category: signs_and_signals
  id: 170
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転手
  answer: C
  explanation: 車椅子のシンボルが描かれた青い標識は、障害者のために予約された駐車スペースであることを示しています。有効な障害者用駐車許可証またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反には高額な罰金が科せられます。
- id: 171
  category: driver_responsibility
  question: ハンドブックの冒頭の書簡によると、ウィスコンシン州パトロール隊（Wisconsin State Patrol）の主な責務は何ですか？
  choices:
    A: より安全な高速道路の設計とエンジニアリング。
    B: 運転免許証および学習許可証の発行。
    C: 一般市民への教育と交通法の執行。
    D: 新規ドライバー向けのオンライン練習テストの提供。
  answer: C
  explanation: ハンドブックには、「ウィスコンシン州パトロール隊は、道路交通法について一般市民を教育し、ウィスコンシン州の交通法を執行します」と記載されています。
- id: 172
  category: driver_responsibility
  question: ハンドブックには、人身売買が発生する可能性のある一般的な場所がいくつか挙げられています。次の場所のうち、具体的に言及されているのはどれですか？
  choices:
    A: 公立図書館
    B: 映画館
    C: ショッピングモール
    D: トラックストップ（トラック休憩所）
  answer: D
  explanation: マニュアルには、人身売買が発生する可能性のある場所として、「ホテルやモーテル、トラックストップ、休憩所、カジノ、レストラン、ネイルサロン、農場など」が挙げられています。
- id: 173
  category: safe_driving_rules
  question: 目次によると、セクション8「緊急時の対応（Handling Emergencies）」で扱われているトピックは次のうちどれですか？
  choices:
    A: 居眠り運転
    B: 路上での緊急事態
    C: ラウンドアバウト
    D: 冬の運転
  answer: B
  explanation: 目次を見ると、セクション8「緊急時の対応」には「路上での緊急事態（Roadside Emergencies）」というトピックが含まれています。
- id: 174
  category: safe_driving_rules
  question: 目次に基づくと、悪天候時の運転に関する情報を確認するには、ハンドブックのどのセクションを参照すればよいですか？
  choices:
    A: セクション3：基本事項（The Basics）
    B: セクション5：信号、路面標示、車線規制（Signals, Pavement Markings and Lane Controls）
    C: セクション7：運転条件（Driving Conditions）
    D: セクション9：危険な運転行動（Dangerous Driving Behaviors）
  answer: C
  explanation: 目次では、「悪天候（Severe Weather）」はセクション7「運転条件」の下のトピックとして記載されています。
- id: 175
  category: driver_responsibility
  question: ハンドブックに記載されている全米人身売買ホットライン（National Human Trafficking Hotline）の電話番号は何番ですか？
  choices:
    A: '911'
    B: 1-800-SAFE-RIDE
    C: 1-888-3737-888
    D: '511'
  answer: C
