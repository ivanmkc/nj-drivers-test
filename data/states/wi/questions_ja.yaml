- id: 210
  category: license_system
  question: 16歳以上の練習許可証（instruction permit）保持者の場合、どのような条件下で助手席以外の席に同乗者を乗せることができますか？
  choices:
    A: その人物が近親者である場合
    B: その人物も資格のある教官である場合
    C: 免許保持者で25歳以上、かつ2年以上の運転経験がある場合
    D: 追加の同乗者は一切認められない
  answer: C
  explanation: マニュアルには次のように記されています。「16歳以上の場合、同乗する免許保持者に加えて、25歳以上で少なくとも2年の運転経験を持つ別の免許保持者1名が、助手席以外の座席に同乗することができます。」
- id: 211
  category: driver_testing
  question: 18歳未満で運転教育プログラムに登録している場合、学習許可証（instruction permit）を申請する前に、実技教習所から提供される署名済みのフォームは何ですか？
  choices:
    A: 学校の通知表
    B: 修了証
    C: ウィスコンシン州運転免許証（DL）申請書 MV3001
    D: 保護者同意書 MV2002
  answer: C
  explanation: マニュアルには、「実技教習所が署名済みのウィスコンシン州運転免許証（DL）申請書 MV3001を提供します。学習許可証を申請する前に、これを完了させておく必要があります」と記載されています。
- id: 212
  category: license_system
  question: 試用免許（probationary license）で午前5時から深夜0時の間に運転する場合、同乗できる近親者は何人までですか？
  choices:
    A: 1人のみ
    B: 両親のみ
    C: 人数制限なし
    D: 1人が親であれば2人
  answer: C
  explanation: マニュアルには、午前5時から深夜0時まで、GDL（段階的運転免許）保持者は「人数に関わらず近親者を同乗させることができる」と明記されています。
- id: 213
  category: license_system
  question: 学習許可証（instruction permit）保持者に同乗する資格を持つ指導員の最低年齢は何歳ですか？
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: B
  explanation: 助手席に座る人物は、以下のいずれかである必要があります。「19歳以上の資格を持つ指導員...」
- id: 214
  category: driver_testing
  question: 試用免許（probationary license）を取得するには、未成年者は合計50時間以上の監督下での運転を完了する必要があります。そのうち、日中の運転は何時間必要ですか？
  choices:
    A: 10時間
    B: 25時間
    C: 40時間
    D: 50時間
  answer: C
  explanation: マニュアルでは、運転者は「日中に少なくとも40時間、夜間に10時間（合計50時間）の運転練習を行う」ことが求められています。
- id: 215
  category: license_system
  question: 通常の運転免許証の更新について、免許の有効期限が切れる年の誕生日のどのくらい前に、DMVから更新通知が届きますか？
  choices:
    A: 10〜20日前
    B: 30日前
    C: 45〜60日前
    D: 90日前
  answer: C
  explanation: マニュアルには、「運転免許証の有効期限が切れる年の誕生日の45〜60日前に、更新通知が届きます」と記載されています。
- id: 216
  category: driver_testing
  question: スポンサーが教習生の練習時間を記録するために使用できる、マニュアルに記載されているモバイルアプリの名前は何ですか？
  choices:
    A: DMV Drive
    B: RoadReady
    C: WI Practice Log
    D: GDL Tracker
  answer: B
  explanation: マニュアルでは、スポンサーは運転記録を印刷するか、「またはRoadReadyモバイルアプリをダウンロードする」ことができると提案しています。
- id: 217
  category: driver_testing
  question: 18歳以上の人が学習許可証（instruction permit）を取得するには、何をしなければなりませんか？
  choices:
    A: 運転教育プログラムに登録する。
    B: 知識テスト、標識テスト、および視力検査に合格する。
    C: 最初に50時間の監督下での運転を完了する。
    D: スポンサーに申請書への署名をもらう。
  answer: B
  explanation: マニュアルには、「18歳以上の場合は、知識テスト、道路標識テスト、および視力検査に合格することから始めることができます」と記載されています。未成年者とは異なり、運転教育プログラムへの登録は義務付けられていません。
- id: 218
  category: license_system
  question: 2025年5月7日以降、米国内の飛行機利用や連邦政府施設への訪問には、どのような身分証明書が必要になりますか？
  choices:
    A: 有効な州発行の運転免許証であればどれでも
    B: 写真付きの運転免許証
    C: REAL ID準拠の免許証、またはパスポートなどの他の認められた書類
    D: 車両登録証
  answer: C
  explanation: マニュアルには、2025年5月7日以降、米国内の飛行機利用や連邦政府施設への訪問には、REAL ID準拠の身分証明書を提示する（またはパスポートなどの他の認められた身分証明書を提示する）必要があると記載されています。
- id: 219
  category: driver_responsibility
  question: 運転免許証以外に、運転する前に車内に備え付けておくべき2つの書類は何ですか？
  choices:
    A: 車両所有権証（タイトル）と取扱説明書
    B: 保険の証明と車両登録証
    C: 出生証明書と社会保障カード
    D: 直近の車両点検報告書と地図
  answer: B
  explanation: セクション3では、運転する前に、有効な運転免許証、保険の証明、および車両登録証を所持していることを確認する必要があると述べています。
- id: 220
  category: safe_driving_rules
  question: 「4秒間の車間距離ルール」を使用している際、「1004（ワン・サウザンド・フォー）」と数え終わる前に、選択した静止物に到達してしまいました。これは何を示していますか？
  choices:
    A: 状況に対して運転速度が遅すぎる。
    B: 安全な車間距離を保っている。
    C: 前方の車両が予期せず減速した。
    D: スピードが出すぎているか、車間距離が近すぎる。
  answer: D
  explanation: マニュアルでは、「1004（ワン・サウザンド・フォー）」と言い終わる前にその地点に到達した場合は、スピードが出すぎていると説明されています。
- id: 221
  category: safe_driving_rules
  question: 「4秒車間距離ルール」に従い、雨や雪などの悪条件の場合、どのような調整を行うべきですか？
  choices:
    A: カウントを2秒に減らす。
    B: 状況に関係なく4秒のカウントを維持する。
    C: 悪条件が1つ重なるごとに1秒追加する。
    D: 完璧な天候の時のみこのルールを使用する。
  answer: C
  explanation: マニュアルには、車間距離ルールを使用する際、「交通渋滞、雨、雪、氷などの悪条件が1つ重なるごとに1秒追加すること」と記載されています。
- id: 222
  category: safe_driving_rules
  question: 複数車線の道路で、他の多くの交通の流れよりも遅い速度で走行している場合、どの車線を使用すべきですか？
  choices:
    A: 一番左側の車線
    B: 中央の車線
    C: 一番右側の車線
    D: どの車線でも構わない
  answer: C
  explanation: マニュアルでは、「他の交通の流れよりも遅い速度で走行する場合は、複数車線道路の一番右側の車線を走行すること」とアドバイスしています。
- id: 223
  category: penalties_and_points
  question: スピード違反に加えて、マニュアルで違法であると明記されている2つの運転行為はどれですか？
  choices:
    A: コースティング（慣性走行）とあおり運転（車間距離不保持）
    B: 競走（レース）と無謀運転
    C: 低速走行と方向指示器の不使用
    D: 急な合流と頻繁な車線変更
  answer: B
  explanation: 本文には、「競走（レース）と無謀運転は認められておらず、違法である」と記されています。
- id: 224
  category: safe_driving_rules
  question: 交通の流れに合流する際、何を避けるために周囲と同じ速度で進入すべきですか？
  choices:
    A: スピード違反の切符を切られること
    B: 燃料を使いすぎること
    C: 他のドライバーに速度や方向の変更を強いること
    D: 出口を通り過ぎること
  answer: C
  explanation: マニュアルには、「合流によって他のドライバーに速度や方向の変更を強いることを避けること」と記載されています。
- id: 225
  category: vehicle_information
  question: オフランプ（出口ランプ）とも呼ばれる「減速車線」の主な機能は何ですか？
  choices:
    A: 高速道路に入る前に車両を加速させるため。
    B: 緊急駐車用のスペースを提供するため。
    C: 高速道路から出る際に、交通が徐々に減速できるようにするため。
    D: 高速道路でのUターン車線として機能するため。
  answer: C
  explanation: マニュアルでは、「減速車線（オフランプ）では交通が減速し、ここであなたも徐々に速度を落とすことになります」と説明されています。
- id: 226
  category: signs_and_signals
  question: マニュアルでは、交差点を「2つの地点が交わる場所」と定義しています。交差点の例として挙げられているのは次のうちどれですか？
  choices:
    A: 道路の急カーブ
    B: 私道（ドライブウェイ）や駐車場の入り口
    C: 橋や跨線橋
    D: 指定された休憩所
  answer: B
  explanation: セクション3では交差点を定義しており、「これには交差する道路、私道（ドライブウェイ）、駐車場の入り口、踏切が含まれる」と述べています。
- id: 227
  category: defensive_driving
  question: 木々、建物、または駐車車両によって交差点の視界が遮られている場合、どのように進むべきですか？
  choices:
    A: クラクションを鳴らして素早く進む。
    B: 完全に停止し、他の車が先に行くのを待つ。
    C: 低速で接近し、注意しながら前進する。
    D: ハイビームを点灯して他のドライバーに警告する。
  answer: C
  explanation: マニュアルでは、「視界が遮られた交差点には低速で接近してください。見えない場合は、注意して前進してください」とアドバイスしています。
- id: 228
  category: defensive_driving
  question: 注意散漫による事故を避けるため、マニュアルがドライバーに見ないよう警告している特定の路上活動は何ですか？
  choices:
    A: 看板や広告
    B: 珍しい建築物や景色
    C: 警察に止められているドライバー
    D: 道路の近くで草を食べている動物
  answer: C
  explanation: マニュアルには、「警察に止められているドライバーやその他の路上活動を見ないでください。これは事故の原因となる可能性があります」と記載されています。
- id: 229
  category: sharing_the_road
  question: 他の車両がすぐ隣の車線を走行している場合、自車の周囲に安全なスペース・クッションを維持するために何をすべきですか？
  choices:
    A: 加速して素早くその車の前に出る。
    B: クラクションを鳴らして相手を移動させる。
    C: 同じ位置を維持し、相手を追い越させる。
    D: 安全な時に、その車両の前方に進むか後方に下がる。
  answer: D
  explanation: マニュアルでは、「道路で車両がすぐ隣を走行している場合は、安全な時にその車両の前方に進むか後方に移動してください。これにより、自車の周囲にスペースを確保できます」とアドバイスしています。
- id: 230
  category: safe_driving_rules
  question: 標識や信号のない交差点（無制御交差点）では、誰に優先権がありますか？
  choices:
    A: より速く走っている車両。
    B: 左側にいる車両。
    C: 右側から来る車両。
    D: より広い道路にいる車両。
  answer: C
  explanation: マニュアルには、「信号や交通灯がない場合（無制御交差点）、右側から来る車両に優先権を譲らなければならない」と記載されています。
- id: 231
  category: safe_driving_rules
  question: 左折する際、誰に対して優先権を譲らなければなりませんか？
  choices:
    A: 自車の後方の車両
    B: 同じ方向から右折してくる車両
    C: 反対方向から直進してくる対向車
    D: 横断歩道にいない場合も含め、すべての歩行者
  answer: C
  explanation: マニュアルには、「左折またはUターンをする場合は、接近してくる車両に優先権を譲るべきである」と記載されています。
- id: 232
  category: safe_driving_rules
  question: マニュアルでは、次のような場合に標準の4秒以上の車間距離を空けることを推奨しています。
  choices:
    A: 交通量の少ない市街地を走行しているとき
    B: オートバイや大型トラックの後ろを走行しているとき
    C: 青信号の交差点に近づいているとき
    D: 直線で乾燥した道路を走行しているとき
  answer: B
  explanation: マニュアルには、「トラック、バス、バン、大型車両、オートバイ、または自転車の後ろを走行している場合は、前方にさらに数秒分のスペースを空ける必要がある場合があります」と記載されています。
- id: 233
  category: defensive_driving
  question: 自車の後方の状況を把握し続けるために、マニュアルではどのくらいの頻度でバックミラーを確認することを推奨していますか？
  choices:
    A: 2〜4秒ごと
    B: 6〜8秒ごと
    C: 10〜12秒ごと
    D: 車線変更や右左折を計画しているときのみ
  answer: B
  explanation: マニュアルでは、「誰かが車間距離を詰めすぎていないか（あおり運転）を確認するために、6〜8秒ごとにバックミラーをチェックしてください」とアドバイスしています。
- id: 234
  category: sharing_the_road
  question: トラックやバスなどの大型車両が曲がる際、なぜ十分なスペースを空ける必要があるのですか？
  choices:
    A: 法律により、曲がる前に完全に停止することが義務付けられているため
    B: 曲がりきるためにセンターラインを越える可能性があるため
    C: ブレーキランプが見えにくいことが多いため
    D: すべての交差点において絶対的な優先権を持っているため
  answer: B
  explanation: マニュアルには、「トラックやバスなどの大型車両は、右左折中にセンターラインを越える可能性があるため、十分なスペースを空けてください」と記載されています。
- id: 235
  category: safe_driving_rules
  question: 対向車がいる交差点で左折待ちをする際、車両をどこに配置すべきですか？
  choices:
    A: 進路が完全にクリアになるまで、白い停止線の手前
    B: 歩行者を妨げるような横断歩道の中
    C: 交差点の中ほどまで進んだ位置
    D: 他車が追い越せるように右側の車線
  answer: C
  explanation: マニュアルでは、「ゆっくりと交差点に近づき、交差点の中ほどで待ちます。対向車が自車の前を曲がれるようにスペースを空けておくようにしてください」と指示されています。
- id: 236
  category: safe_driving_rules
  question: 複数の左折車線がある道路から左折する場合、中央の車線から開始したなら、曲がった先の道路ではどの車線に入る必要がありますか？
  choices:
    A: 一番右側の車線
    B: 一番左側の車線
    C: 中央の車線
    D: 空いている任意の車線
  answer: C
  explanation: マニュアルには、「中央の車線にいる場合は、曲がった先の道路でも中央の車線に入る必要があります」と記載されています。
- id: 237
  category: driver_testing
  question: Yターン（3点切り返し）の3番目のステップにおいて、反対側の縁石で停止した後、どのような行動をとるべきですか？
  choices:
    A: 右に合図を出し、前進して車流に入る
    B: ハンドルを右いっぱいに切り、停止する
    C: 右肩越しに後方を確認し、前進できる分だけバックする
    D: バックする前にクラクションを鳴らして周囲の交通に知らせる
  answer: C
  explanation: Yターンの3番目のステップは、「右肩越しに後方を確認します。再び前進できる程度に車をバックさせ、停止します」というものです。
- id: 238
  category: sharing_the_road
  question: 他の車両があなたを追い越そうとしている場合、正しく安全な対応は何ですか？
  choices:
    A: 追い越しを阻止するためにスピードを上げる
    B: 進路を妨害するために左側に寄る
    C: 自分の車線を維持し、速度を落とす
    D: 危険であることを知らせるためにヘッドライトを点滅させる
  answer: C
  explanation: マニュアルには、「誰かがあなたを追い越そうとしている場合は、自分の車線を維持し、速度を落としてください」と記載されています。
- id: 239
  category: safe_driving_rules
  question: 左に車線変更する前に、死角を確認する適切な方法は何ですか？
  choices:
    A: バックミラー（ルームミラー）だけを見る
    B: 左側のサイドミラーだけを見る
    C: 左肩越しに目視で確認する
    D: ミラーがよく見えるように身を乗り出す
  answer: C
  explanation: マニュアルでは、「左車線に移動する場合は、左肩越しに確認してください」と指示されています。また、「ミラーを見るだけではこれらのエリアを確認することはできません」とも説明されています。
- id: 240
  category: safe_driving_rules
  question: マニュアルでは、一度に複数の車両を追い越すことについてどのように述べていますか？
  choices:
    A: 前方の道路がはっきりと見えている場合は許可される
    B: 一度に1台ずつ追い越すべきである
    C: 個別に追い越すよりも安全である
    D: 一度に2台までは追い越してもよいが、それ以上は不可
  answer: B
  explanation: マニュアルでは、「一度に数台の車両を追い越すのに十分な時間がない可能性があります...」と警告しており、「左側から一度に1台ずつのみ追い越してください」と指示しています。
- id: 241
  category: vehicle_information
  question: 後退（バック）する際、ミラーやバックカメラの使用に加えて、安全を確保するために何をすべきですか？
  choices:
    A: 車内灯をつける。
    B: 体を回し、後方窓越しに右肩越しに後ろを見る。
    C: 運転席側のドアを開けて後ろを確認する。
    D: バックアラームの音を頼りにする。
  answer: B
  explanation: マニュアルには、「後退する際は、ミラーやバックカメラだけに頼ってはいけません。体を回して、窓から後ろを確認してください。後方窓越しに右肩越しに後ろを見てください」と記載されています。
- id: 242
  category: driver_responsibility
  question: 平坦な場所でオートマチック車を駐車する際、パーキング（P）にシフトを入れた後、何をすべきですか？
  choices:
    A: 車輪を縁石の方に向ける。
    B: エンジンをかけたままにする。
    C: パーキングブレーキをかける。
    D: ハザードランプを点灯させる。
  answer: C
  explanation: マニュアルには、「平坦な場所に駐車するときは、車両をパーキング（P）に入れ（マニュアル車の場合はギアを入れ）、パーキングブレーキをかけてください」と指示されています。
- id: 243
  category: defensive_driving
  question: 後続車のドライバーを助けるために、どのようなことができますか？
  choices:
    A: 急ブレーキをかけて車間距離を空けさせる。
    B: 加速してスペースを作る。
    C: 一定の速度を保ち、早めに合図を出す。
    D: 車線内で少し蛇行する。
  answer: C
  explanation: マニュアルでは、「減速や右左折が必要な際、一定の速度を保ち、早めに合図を出すことで、後続車のドライバーを助けることができます」と推奨しています。
- id: 244
  category: safe_driving_rules
  question: 多車線道路で交通を横断する必要がある場合、最も重要な考慮事項は何ですか？
  choices:
    A: 完全に向こう側まで渡り切るための十分なスペースがあることを確認する。
    B: 横断を始める前にクラクションを鳴らす。
    C: 他の車を遮ってでも、できるだけ早く横断する。
    D: 警察官が誘導してくれるのを待つ。
  answer: A
  explanation: マニュアルには、「交通や多車線道路を横断するときは、完全に向こう側まで渡り切るための十分なスペースがあることを確認してください」と記載されています。
- id: 245
  category: defensive_driving
  question: マニュアルによると、右左折時のどのような不安全な行動が衝突事故につながる可能性がありますか？
  choices:
    A: 早すぎる合図。
    B: 直前での進路変更。
    C: 遅すぎる右左折。
    D: ミラーを複数回確認すること。
  answer: B
  explanation: マニュアルでは、「直前での変更は危険であり、衝突事故の原因となる可能性があります」と警告しています。
- id: 246
  category: sharing_the_road
  question: 多車線道路において、一番左側の車線はどのような目的で使用されますか？
  choices:
    A: 制限速度以下で走行するドライバー用。
    B: 遅い車両を追い越す車両用。
    C: 緊急車両専用。
    D: 右側から出る準備をする車両用。
  answer: B
  explanation: マニュアルには、「多車線道路の一番左側の車線は、遅い車両を追い越すために使用されます」と記載されています。
- id: 247
  category: safe_driving_rules
  question: 縁石のない道路で上り坂に駐車する場合、前輪はどちらの方向に向けるべきですか？
  choices:
    A: まっすぐ前
    B: 左いっぱいに切る
    C: 右いっぱいに切る
    D: 少し左に切る
  answer: C
  explanation: マニュアルには、「縁石のない上り坂で駐車する場合は、パーキングに入れる前に車輪を右いっぱいに切ってください」と記載されています。
- id: 248
  category: safe_driving_rules
  question: 縦列駐車の過程で、後退を始めた後、最初に車輪をまっすぐにするのはいつですか？
  choices:
    A: 後部バンパーが前の車を通り過ぎたとき
    B: 自分の車のフロントドアが、前に停まっている車の後部バンパーを通り過ぎたとき
    C: 縁石と平行になった直後
    D: 完全に停止した後
  answer: B
  explanation: 縦列駐車のステップ3には、「自分の車のフロントドアが、前に停まっている車の後部バンパーを通り過ぎたら、ハンドルをまっすぐに戻してください」と記載されています。
- id: 249
  category: safe_driving_rules
  question: 縦列駐車が完了した後、前後の車両との間に空けるべき推奨される最小距離はどれくらいですか？
  choices:
    A: 1フィート（約30cm）
    B: 2フィート（約60cm）
    C: 3フィート（約90cm）
    D: 6フィート（約1.8m）
  answer: B
  explanation: マニュアルには、「縁石から約1フィート離し、前後の車両から少なくとも2フィート（約60cm）離す必要があります」と明記されています。
- id: 250
  category: defensive_driving
  question: ドライバーズマニュアルでは、強い感情が運転に悪影響を及ぼす可能性があると助言しています。運転を控えるべき感情として挙げられているのは次のうちどれですか？
  choices:
    A: 興奮（Excitement）
    B: 冷静
    C: 満足
    D: 無関心
  answer: A
  explanation: マニュアルには、「非常に心配していたり、興奮していたり、恐れていたり、怒っていたり、落ち込んでいたりする場合は、運転しないでください」と記載されています。
- id: 251
  category: safe_driving_rules
  question: マニュアルによると、車のクラクションを軽く鳴らす適切な使い方はどれですか？
  choices:
    A: 誰かにぶつかりそうだと警告するため
    B: 右左折すること合図するため
    C: 渋滞に対する不満を示すため
    D: 道路上で他のドライバーの注意を引くため
  answer: D
  explanation: マニュアルには、「クラクションを軽く鳴らすことは、道路上の他のドライバーに合図を送り、注意を引くのに十分であるべきです」と説明されています。
- id: 252
  category: vehicle_information
  question: 次のうち、ハイビーム（走行用前照灯）を使用するのが適切な状況はどれですか？
  choices:
    A: 濃霧の中を運転しているとき
    B: 200フィート以内で他の車両に続いているとき
    C: 対向車がいない不慣れな場所を運転しているとき
    D: 夜間、街灯の明るい市街地を運転しているとき
  answer: C
  explanation: マニュアルでは、「向かってくる車両がいないとき」や「不慣れな場所や工事区域にいるとき」にハイビームを使用できるとされています。
- id: 253
  category: safe_driving_rules
  question: 交差点を通過した直後に右左折する予定がある場合、いつ方向指示器（ウィンカー）を作動させるべきですか？
  choices:
    A: 交差点の少なくとも100フィート手前
    B: 交差点の真ん中にいるとき
    C: 交差点を通過した後
    D: 右左折を開始した後のみ
  answer: C
  explanation: マニュアルには、「交差点を過ぎてから曲がる場合は、交差点を通過してから合図を開始してください」と記載されています。
- id: 254
  category: safe_driving_rules
  question: 停止または減速することを示す正しい手信号はどれですか？
  choices:
    A: 手を窓から真っ直ぐ外に出す
    B: 肘を曲げて手を上に向ける
    C: 手を地面の方に向ける
    D: 手で円を描くように動かす
  answer: C
  explanation: マニュアルでは、「停止または減速する場合は、手を地面の方に向けてください」と説明されています。
- id: 255
  category: signs_and_signals
  question: 「対面交通（2-Way Traffic）」の警戒標識を最もよく見かけるのはどのような時ですか？
  choices:
    A: 一方通行の道路が始まろうとしているとき
    B: 一方通行の道路を出て、対向車のある道路に入るとき
    C: 中央分離帯のある高速道路が始まる手前
    D: 2車線以上あるすべての道路
  answer: B
  explanation: マニュアルには、「この標識は、一方通行の道路を出て、対向車のある道路に入るときに見られます」と記載されています。
- id: 256
  category: signs_and_signals
  question: 視認性を高めるために、学校周辺の横断歩道やスクールゾーンの標識には、標準的な黄色に加えて他に何色が使用されることがありますか？
  choices:
    A: 鮮やかなオレンジ色
    B: 蛍光グリーン
    C: ライトブルー
    D: 反射ホワイト
  answer: B
  explanation: マニュアルの学校周辺の横断歩道／スクールゾーンの標識に関する項目には、「蛍光グリーンまたは黄色の場合があります」と記されています。
- id: 257
  category: signs_and_signals
  question: 「右側通行（Keep Right）」の規制標識は何を示していますか？
  choices:
    A: 低速車は右車線を走行しなければならない
    B: 右折の準備をしなければならない
    C: 前方の道路が交通島や障害物によって分かれている
    D: 前方に急な右カーブがある
  answer: C
  explanation: マニュアルでは、「右側通行（Keep Right） – 前方の道路が交通島や障害物によって分かれています」と説明されています。
- id: 258
  category: signs_and_signals
  question: マニュアルによると、「進入禁止（Do Not Enter）」の標識は通常どこで使用されますか？
  choices:
    A: スクールゾーンの始まり
    B: 高速道路の急カーブの手前
    C: 逆方向に向かう出口ランプや一方通行の通り
    D: すべての4方向一時停止交差点
  answer: C
  explanation: マニュアルには、「進入禁止（Do Not Enter）」の標識は「逆方向に向かう出口ランプや一方通行の通りで使用されます」と記載されています。
- id: 259
  category: safe_driving_rules
  question: 「駐車禁止」の標識以外に、駐車が禁止されている場所を示すものはどれですか？
  choices:
    A: 縁石の白い標示
    B: 緑色に塗られた縁石
    C: 縁石の黄色の標示
    D: 住宅街の塗られていない縁石
  answer: C
  explanation: マニュアルには、「縁石に黄色の標示がある場所では駐車は許可されていません...」と記載されています。
- id: 260
  category: safe_driving_rules
  question: 縦列駐車を開始する際、目的のスペースの前に駐車している車に対して、自車をどのように配置すべきですか？
  choices:
    A: その車の約10フィート後ろで停止する
    B: その車と横に並び、約2フィート離れて停止する
    C: 自車のリアバンパーとその車のフロントバンパーを合わせて停止する
    D: その車に対して45度の角度で停止する
  answer: B
  explanation: 縦列駐車のステップ1では、「駐車したい場所の前にある車両と横に並んで停止します。その車両から約2フィート離れて停止してください」と指示されています。
- id: 261
  category: signs_and_signals
  question: ウィスコンシン州道のルート標識の形状と色は何ですか？
  choices:
    A: 上が赤、下が青の盾形
    B: グレーまたは白の警察のバッジのような形
    C: 底に注ぎ口があるミルクジャグのような形
    D: 角が丸い白の長方形
  answer: C
  explanation: セクション4では、州道標識について「底に注ぎ口があるミルクジャグのような形をしています。この標識は白地に黒の文字で書かれています」と説明されています。
- id: 262
  category: sharing_the_road
  question: 線路上で停止しないこと以外に、車両で踏切を横断中に避けるべき特定の動作は何ですか？
  choices:
    A: ミラーを確認すること
    B: ギアチェンジ（変速）すること
    C: ラジオをつけること
    D: 方向指示器（ウィンカー）を使うこと
  answer: B
  explanation: 踏切に関するセクション4には、「踏切を横断中にギアチェンジをしてはいけません」と明記されています。
- id: 263
  category: sharing_the_road
  question: 反射材を用いたオレンジ色の三角形である「低速車両マーク」は、その車両が以下のどの速度で走行している可能性があることを示していますか？
  choices:
    A: 25 mph以下
    B: 35 mph以下
    C: 45 mph以下
    D: 55 mph以下
  answer: A
  explanation: セクション4では、低速車両標識について「この車両は25 mph以下で走行している可能性があります」と説明されています。
- id: 264
  category: signs_and_signals
  question: 「追い越し禁止区域（No Passing Zone）」標識の独特な形状は何ですか？
  choices:
    A: 下向きの三角形
    B: 八角形
    C: 円形
    D: ペナント型（横向きの三角形）
  answer: D
  explanation: セクション4では、「追い越し禁止区域」の標識を「黒の文字が書かれた黄色のペナント型」と説明しています。
- id: 265
  category: signs_and_signals
  question: マイルマーカー（距離標）にはどのような情報が含まれていますか？
  choices:
    A: ルート番号と最も近い都市
    B: 進行方向、ルート番号、およびマイル数
    C: 郡名とマイル数
    D: 制限速度と進行方向
  answer: B
  explanation: セクション4によると、「各マイルマーカーには、進行方向、ルート番号、およびマイル数が含まれています」とされています。
- id: 266
  category: signs_and_signals
  question: ウィスコンシン州のハイウェイ沿いには、どのくらいの頻度でマイルマーカーが設置されていますか？
  choices:
    A: 1マイルごと
    B: 0.5マイルごと
    C: 0.1〜0.2マイルごと
    D: 5マイルごと
  answer: C
  explanation: セクション4では、マイルマーカーは「0.1〜0.2マイル（10分の1〜10分の2マイル）ごとに設置されている」と述べられています。
- id: 267
  category: signs_and_signals
  question: 「この先に道路工事の旗振り員あり（Road Construction Flagger Ahead）」の標識を見かけた場合、どうしなければなりませんか？
  choices:
    A: 現在の速度のまま注意して進む
    B: 停止し、旗振り員がいなくなるまで待つ
    C: 旗振り員の指示に従う
    D: 旗振り員に気づいていることを知らせるためにクラクションを鳴らす
  answer: C
  explanation: セクション4では、道路工事の旗振り員について「標識や旗を持った作業員です。彼らの指示に従わなければなりません」と説明されています。
- id: 268
  category: signs_and_signals
  question: 黒い「X」と「RR」の文字が書かれた黄色い円形の標識の意味は何ですか？
  choices:
    A: この先の道路は閉鎖されている
    B: この先に踏切がある
    C: 追い越し禁止区域に入ろうとしている
    D: この先に十字路の交差点がある
  answer: B
  explanation: セクション4では、この標識を「踏切警告標識」と特定し、「これは踏切があることを意味します。注意を払い、列車が来ないか必ず確認してください」と述べています。
- id: 269
  category: signs_and_signals
  question: 3車線を示している標識がある交差点に近づいています。一番左の車線の標識には左折の矢印と直進の矢印が表示されています。中央の車線には直進の矢印が表示されています。右の車線には右折の矢印が表示されています。中央の車線からできることは何ですか？
  choices:
    A: 左折または直進
    B: 直進のみ
    C: 右折または直進
    D: Uターン
  answer: B
  explanation: セクション4の「左車線｜中央車線｜右車線標識」の例に基づくと、各車線の標識が許可された動きを規定します。このシナリオでは、中央車線は直進専用です。
- id: 270
  category: signs_and_signals
  question: 茶色の案内標識の目的は何ですか？
  choices:
    A: 病院やガソリンスタンドなどの不可欠なサービスへの道順を示すため
    B: 次の主要都市までの距離を示すため
    C: 公園や美術館などのレジャー施設や景勝地に関する情報を示すため
    D: この先の工事区域を警告するため
  answer: C
  explanation: セクション4には、「茶色の案内標識 – レジャー施設や景勝地に関する情報を示します。一部の標識には、標識に記載された場所まであと何マイルかかるかが表示されています」と記載されています。
- id: 271
  category: sharing_the_road
  question: 踏切で、白いクロバック（X字型の標識）の下に「3」という数字がある標識は何を示していますか？
  choices:
    A: この先3マイルに踏切がある
    B: 3秒間停止しなければならない
    C: 横断する線路が3本ある
    D: 制限速度は30 mphである
  answer: C
  explanation: セクション4では、「列車接近」標識において「線路の数が記載されている。横断する線路が複数ある場合がある」と説明されています。
- id: 272
  category: signs_and_signals
  question: 2車線のラウンドアバウト（環状交差点）に近づいています。左車線の頭上標識には左折矢印とUターン矢印が表示されています。右車線の標識には直進矢印と右折矢印が表示されています。ラウンドアバウトを直進するには、どちらの車線を使用すべきですか？
  choices:
    A: 左車線のみ
    B: 右車線のみ
    C: 左車線または右車線のいずれか
    D: このラウンドアバウトからは直進できない
  answer: B
  explanation: セクション4のラウンドアバウトに関する「左車線｜右車線標識」の例に基づくと、右車線は直進または右折を希望するドライバー用に指定されています。
- id: 273
  category: signs_and_signals
  question: 郡道（County Road）のルート標識はどのような外観ですか？
  choices:
    A: 角が丸い白い長方形に黒い文字
    B: 青い正方形に白い文字
    C: グレーの警察バッジの形に黒い文字
    D: 黄色いペナント型に黒い文字
  answer: A
  explanation: セクション4では、郡道標識について「郡の標識は角が丸い長方形である。白地に黒い文字で記載されている」と説明されています。
- id: 274
  category: signs_and_signals
  question: 踏切に近づいた際、「TRACKS OUT-OF-SERVICE（線路使用休止中）」と書かれた標識を見かけました。これは何を意味しますか？
  choices:
    A: 停止してサービス車両を待たなければならない
    B: 線路はもう使用されていない
    C: サービス列車のみがこの線路を使用する
    D: 警告灯が作動していない
  answer: B
  explanation: セクション4には、「一部の標識には『Tracks out-of-service』という表示が重なっている場合があります。これは、その線路がもはや使用されていないことを意味します」と記載されています。
- id: 275
  category: signs_and_signals
  question: すべての高速道路・鉄道踏切にある、白文字の青い標識の目的は何ですか？
  choices:
    A: 踏切の制限速度を示すため
    B: 前方の線路の数を示すため
    C: 問題や緊急事態を報告するための電話番号を提供するため
    D: 前方の停止標識を警告するため
  answer: C
  explanation: すべての高速道路・鉄道踏切にある青い「問題または緊急事態の報告（Report Problem or Emergency）」標識には、線路上の車両の立ち往生や警告灯の故障などの危険な状況を報告するための電話番号が記載されています。
- id: 276
  category: sharing_the_road
  question: 複線の踏切を渡る前、1台の列車が通過した後に何をすべきですか？
  choices:
    A: 2本目の線路は常に空いているため、直ちに進む
    B: 最初の列車が遠ざかり、他の線路が空いていることを確認できるまで待つ
    C: 他の接近中の列車に警告するためにクラクションを鳴らす
    D: 最初の列車が進んだ方向だけを見て、ゆっくりと渡る
  answer: B
  explanation: マニュアルには、「複線の踏切を渡る前に、列車が遠ざかり、線路が空いていることが確認できるまで待つ必要がある」と記載されています。
- id: 277
  category: signs_and_signals
  question: 交差点での赤色の点滅矢印は何を意味しますか？
  choices:
    A: 停止して青色の矢印を待たなければならない
    B: 一時停止し、安全を確認してから進むことができる
    C: 停止せずに進んでもよいが、注意が必要である
    D: 右左折は禁止されており、直進しなければならない
  answer: B
  explanation: マニュアルによると、赤色の点滅矢印は「一時停止しなければならない。安全であれば進んでもよい」という意味です。
- id: 278
  category: safe_driving_rules
  question: 交差点に近づいたところ、信号機が黄色の点灯に変わりました。どうすべきですか？
  choices:
    A: 赤に変わる前に交差点を通過するために加速する
    B: 交差点内にいても、直ちに停止する
    C: 減速し、交差点に入る前に停止する
    D: 優先権があるため、現在の速度で進み続ける
  answer: C
  explanation: 黄色の点灯信号について、マニュアルには「減速し、交差点に入る前に停止しなければならない」と記載されています。すでに交差点内にいる場合は、そのまま通過してください。
- id: 279
  category: signs_and_signals
  question: ウィスコンシン州の法律では、赤色の点灯信号での左折が許可されるのはどのような場合ですか？
  choices:
    A: 任意の通りから一方通行の通りへ曲がる場合
    B: 対面通行の通りから対面通行の通りへ曲がる場合
    C: 一方通行の通りから一方通行の通りへ曲がる場合
    D: 赤色の点灯信号での左折は決して許可されない
  answer: C
  explanation: マニュアルでは、赤色の点灯信号について「一方通行の通りから一方通行の通りへ曲がる場合は、赤信号でも左折できる」と規定されています。
- id: 280
  category: signs_and_signals
  question: マニュアルによると、路肩にある黄色い実線または破線は何を示していますか？
  choices:
    A: 車線の右端
    B: 駐車禁止区域
    C: 進行方向の車線の左端
    D: 追い越し区間の始まり
  answer: C
  explanation: 「路肩および車線境界線」の項目で、マニュアルには「黄色い実線または破線は、進行方向の車線の左端を示している」と記載されています。
- id: 281
  category: safe_driving_rules
  question: 車線間にある白の実線を越えてもよいのはどのような時ですか？
  choices:
    A: 車線変更をしたい時はいつでも。
    B: 低速車両を追い越す場合のみ。
    C: 危険を避けるため、または次のブロック内で曲がる場合。
    D: 白の実線を越えることは決して許されない。
  answer: C
  explanation: 車線間の白の実線について、マニュアルには「危険がある場合、または次のブロック内で曲がる場合にのみ越えることができる」と記載されています。
- id: 282
  category: safe_driving_rules
  question: マニュアルには、反対方向の交通を分ける2本の黄色の実線を越える際の例外が記載されています。どのような場合に越えることが許されますか？
  choices:
    A: 制限速度よりも遅く走っている車両を追い越すため。
    B: 安全が確認でき、私道（ドライブウェイ）に入るために曲がる時。
    C: いかなる地点でもUターン（転回）をするため。
    D: 自転車を追い越すため。
  answer: B
  explanation: 2本の黄色の実線に関する例外として、マニュアルには「私道（ドライブウェイ）に入り、かつ安全である場合には、線を越えることができる」と記載されています。
- id: 283
  category: signs_and_signals
  question: 道路上の2本の黄色の破線は何を意味しますか？
  choices:
    A: 共有センターレーン（中央左折車線）。
    B: 特殊な信号機を備えたリバーシブルレーン。
    C: 追い越し禁止区間の始まり。
    D: 高乗車人数車両（HOV）専用車線。
  answer: B
  explanation: マニュアルでは、リバーシブルレーン（中央線変移区間）を区切るものとして「2本の黄色の破線」が説明されています。
- id: 284
  category: signs_and_signals
  question: リバーシブルレーンの上に表示されている緑の矢印信号は何を示していますか？
  choices:
    A: 車線が閉鎖されようとしているため、車線から出る必要がある。
    B: その車線はあなたの進行方向の交通に対して開放されている。
    C: その車線からは左折しかできない。
    D: その車線はすべての交通に対して閉鎖されている。
  answer: B
  explanation: リバーシブルレーン・システムにおいて、緑の矢印信号は「車線が開放されている」ことを意味し、使用可能です。
- id: 285
  category: safe_driving_rules
  question: 交差点で停止中に信号が青になった場合、進む前に何をしなければなりませんか？
  choices:
    A: 交差する交通に知らせるためにクラクションを鳴らす。
    B: 交通の流れを維持するために直ちに進む。
    C: 後ろの車が動き出すのを待つ。
    D: すでに交差点内に入っている交差車両が通り過ぎるのを待つ。
  answer: D
  explanation: 「青信号（点灯）」のルールにおいて、マニュアルには「停止中に信号が青になった場合は、進む前に交差する交通がクリアになる（通り過ぎる）のを待たなければならない」と記載されています。
- id: 286
  category: safe_driving_rules
  question: 2本の黄色の実線がある道路を走行しています。他の車両を追い越すためにこれらの線を越えてもよいのは、どのような場合に限られますか？
  choices:
    A: 相手の車両が農耕器具である場合。
    B: 相手の車両が制限速度の半分未満で走行しており、かつ農耕器具ではない場合。
    C: 相手の車両が自転車である場合。
    D: 急いでおり、道が空いている場合。
  answer: B
  explanation: 「2本の黄色の実線」のルールの例外として、「安全であれば、制限速度の半分未満で走行している車両を追い越すことができる。ただし、それが農耕器具である場合を除く」とあります。
- id: 287
  category: signs_and_signals
  question: 黄色の矢印の点滅は何を意味しますか？
  choices:
    A: 曲がる前に完全に停止する。
    B: 右左折は保護されており、あなたに優先権がある。
    C: 対向車や歩行者に先に道を譲り、その後注意して進む。
    D: 信号が赤に変わろうとしているため、停止の準備をする。
  answer: C
  explanation: マニュアルには、黄色の矢印の点滅は「曲がる前にまず道を譲り、注意して進む」ことを意味すると記載されています。
- id: 288
  category: safe_driving_rules
  question: 踏切に近づいた際、遮断機が下りてきている場合はどうすべきですか？
  choices:
    A: 遮断機が完全に下りる前に、スピードを上げて線路を渡る。
    B: 停止して待ち、遮断機の周りを通り抜けたり、下をくぐったりしてはいけない。
    C: 停止し、列車が見えなければ遮断機を避けて進む。
    D: 遮断機が完全に下りるのを待ち、線路が空いているように見えれば進む。
  answer: B
  explanation: マニュアルには踏切の遮断機について、「遮断機の周りを走行したり、上がっている途中や下がっている途中の遮断機の下をくぐったりしてはならない」と明記されています。
- id: 289
  category: signs_and_signals
  question: 道路の右端にある白の実線の目的は何ですか？
  choices:
    A: 追い越しが禁止されていることを示すため。
    B: 車線の右端をマークするため。
    C: 反対方向に進む交通を分けるため。
    D: 交差点で停止すべき場所を示すため。
  answer: B
  explanation: 「路側帯および車線境界線」の項目で説明されている通り、白の実線は「車線の右端」を示します。
- id: 290
  category: safe_driving_rules
  question: 黄色の実線と破線、および白の右左折マークで示された「共有センターレーン」は、どのような目的で使用されますか？
  choices:
    A: 左側から低速車両を追い越すため。
    B: ラッシュアワー時の通常の走行車線として。
    C: 左折またはUターン（転回）をする車両のため。
    D: 緊急車両専用として。
  answer: C
  explanation: マニュアルでは「共有センターレーン」について、「左折またはUターン（転回）をする車両のみが使用する」と説明されています。
- id: 291
  category: signs_and_signals
  question: リバーシブルレーン（可変車線）やフレックスレーンの上に赤い「X」信号が表示されている場合、それは何を意味しますか？
  choices:
    A: 車線がまもなく閉鎖されるため、合流の準備をしてください。
    B: 車線は閉鎖されており、使用できません。
    C: 緊急車両専用の車線です。
    D: 通行可能です。
  answer: B
  explanation: マニュアルには、車線上の赤い「X」は、その車線が閉鎖されており使用できないことを意味すると記載されています。
- id: 292
  category: signs_and_signals
  question: 標識や路面に描かれた白いダイヤモンド（ひし形）の記号は、通常何を示していますか？
  choices:
    A: 特定の車両専用の車線。
    B: まもなく終了する車線。
    C: 制限速度が引き下げられた車線。
    D: Uターン専用の車線。
  answer: A
  explanation: セクション5によると、特定車両用の専用車線には「標識の横や路面に白いダイヤモンドが表示されていることが多い」とされています。
- id: 293
  category: safe_driving_rules
  question: 指定された種類の車両を運転していない場合、どのような特定の条件下で、法的に専用車線（バス専用車線など）に入ることができますか？
  choices:
    A: 低速車両を追い越す場合。
    B: 次の半ブロック以内で右左折する必要がある場合。
    C: 一般車線の交通が停止している場合。
    D: 1ブロック未満の距離を走行する場合。
  answer: B
  explanation: マニュアルには、「次の半ブロック以内で専用車線を横切って曲がる必要がある場合は、この車線を走行できます」と記載されています。
- id: 294
  category: signs_and_signals
  question: 専用車線の標識に「4 RIDER CAR POOLS ONLY, MON–FRI, 6AM–9AM（4人乗り以上の相乗り車両専用、月〜金、午前6時〜午前9時）」と表示されています。3人しか乗っていない車両がこの車線を使用できるのはいつですか？
  choices:
    A: 土曜日と日曜日。
    B: 平日の午前9時から午前6時の間。
    C: その車両がバスでもある場合。
    D: この制限表示がある限り、いかなる時も使用できない。
  answer: D
  explanation: 標識の例では、制限時間内は車内に4人が乗っていなければならないと規定されています。3人乗りの車は「4 RIDER（4人乗り）」の要件を満たしません。
- id: 295
  category: signs_and_signals
  question: 一部の高速道路では、舗装された路肩を「フレックスレーン」として使用できます。この特殊な車線と一般車線を区切っているのはどのような種類の線ですか？
  choices:
    A: 白の実線。
    B: 白の破線。
    C: 黄色の実線。
    D: 黄色の破線。
  answer: C
  explanation: セクション5には、「黄色の実線がこの特殊な車線を区切っています」と記載されています。
- id: 296
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）に近づく際は、歩行者、自転車、およびすでに交差点内にいる車両に道を譲らなければなりません。マニュアルには、他にどのような種類の車両に道を譲る必要があると具体的に記載されていますか？
  choices:
    A: オートバイ
    B: バス
    C: セミトレーラー（セミトラック）
    D: 右折する車両
  answer: C
  explanation: セクション6には、ラウンドアバウトに到達する際の手順がリストされており、その中に「セミトレーラー（セミトラック）に道を譲る」ことが含まれています。
- id: 297
  category: safe_driving_rules
  question: ラウンドアバウトで目的の出口に近づいた際の正しい手順は何ですか？
  choices:
    A: 右の方向指示器を出し、出口から出る。
    B: 減速し、後続車が通り過ぎるのを待つ。
    C: 他の運転者に知らせるために軽くクラクションを鳴らす。
    D: 出る前に一番左の車線に移動する。
  answer: A
  explanation: マニュアルは、ラウンドアバウト内の運転者に対し、「出口に到達したら、右の方向指示器を出し、出口から出てください」と指示しています。
- id: 298
  category: safe_driving_rules
  question: フリーウェイ（高速道路）入口のメーター制ランプ（信号制御付きランプ）の主な目的は何ですか？
  choices:
    A: フリーウェイ利用料を徴収するため。
    B: 警察が車両登録を確認できるようにするため。
    C: フリーウェイに合流する車両の間隔を均等にするため。
    D: 相乗り車両やバスに優先的に進入させるため。
  answer: C
  explanation: セクション6には、メーター制ランプは「フリーウェイに合流する車両の数を均等に分散させるのに役立ちます。これにより、フリーウェイおよび入口ランプでの渋滞が緩和されます」と記載されています。
- id: 299
  category: penalties_and_points
  question: メーター制のフリーウェイ入口ランプで交通信号に従わなかった場合、どのような結果になる可能性がありますか？
  choices:
    A: 違反切符を切られる可能性がある。
    B: 免許が即座に停止される。
    C: 郵送で警告を受ける。
    D: 車両が押収される。
  answer: A
  explanation: マニュアルには、「ランプの信号に従わない場合、違反切符を切られる可能性があります」とはっきりと記載されています。
- id: 300
  category: signs_and_signals
  question: 「Ramp Metered When Flashing（点滅時メーター作動中）」の標識が点滅している場合、それは何を意味しますか？
  choices:
    A: ランプは閉鎖されており、別の入口を探さなければならない。
    B: ランプの交通信号が作動中であり、従わなければならない。
    C: 前方のフリーウェイで事故が発生している。
    D: 停止することなく、一度に1台の車だけが進むことができる。
  answer: B
  explanation: セクション6によると、「『Ramp Metered When Flashing』の標識が点灯しているとき、ランプはメーター制になります」。これは交通信号が作動していることを意味します。
- id: 301
  category: safe_driving_rules
  question: 'マニュアルによると、ダイアモンド型交差（DDI: Diverging Diamond Interchange）の利点として述べられているのは次のうちどれですか？'
  choices:
    A: 交差点内の制限速度を上げることができる。
    B: 混雑を解消し、道路建設コストを削減できる。
    C: 商用トラックに直行ルートを提供できる。
    D: 交通信号の必要性をなくすことができる。
  answer: B
  explanation: セクション6では、ダイアモンド型交差（DDI）は「安全性を高め、混雑を解消し、新しい道路のコストを削減するのに役立つ」と説明されています。
- id: 302
  category: driver_responsibility
  question: マニュアルによると、法執行官が交通取り締まり（トラフィックストップ）を行う際の最優先事項は何ですか？
  choices:
    A: 違反に対して反則切符を発行すること。
    B: 公衆の安全と健康を守ること。
    C: 車内に違法な物品がないか捜索すること。
    D: 運転免許証と車両登録証を確認すること。
  answer: B
  explanation: 交通取り締まりに関するセクションの冒頭には、「法執行機関の最優先事項は、公衆の安全と健康である」と記載されています。
- id: 303
  category: signs_and_signals
  question: フレックスレーン（flex lane）のある高速道路で、路肩車線の上に緑色の矢印信号が表示されている場合、それは何を意味しますか？
  choices:
    A: その車線は右左折専用である。
    B: その車線は開放されており、走行に使用できる。
    C: その車線はまもなく閉鎖されるため、合流の準備をすること。
    D: その車線は緊急車両専用として開放されている。
  answer: B
  explanation: マニュアルのフレックスレーンに関する規定では、「緑色の矢印 － 車線は開放されており、使用可能である」と明記されています。
- id: 304
  category: sharing_the_road
  question: 一部の高速道路で、舗装された路肩を「フレックスレーン（flex lane）」として使用することが許可されるのはいつですか？
  choices:
    A: 交通渋滞を回避したいときはいつでも。
    B: 日中の時間帯のみ。
    C: 緑色の矢印などの標識が、使用可能であることを示しているとき。
    D: 一般車線が満杯のときはいつでも。
  answer: C
  explanation: マニュアルには、フレックスレーンについて「標識がこの車線を使用できるタイミングを知らせる」および「フレックスレーンの標識の横に掲示される」と記載されています。
- id: 305
  category: safe_driving_rules
  question: 複数車線のラウンドアバウト（環状交差点）を走行中、円内で避けるべき行動はどれですか？
  choices:
    A: 方向指示器（ウィンカー）を使用すること。
    B: 車線を変更すること。
    C: 低速を維持すること。
    D: セミトレーラーなどの大型トラックに道を譲ること。
  answer: B
  explanation: マニュアルには、ラウンドアバウトにおける重要な安全規則として「ラウンドアバウト内では車線を変更してはならない」と記載されています。
- id: 306
  category: driver_responsibility
  question: 法執行官に止められ、道路の右側に車を寄せた直後にすべきことは何ですか？
  choices:
    A: エンジンはかけたままにし、ラジオだけを切る。
    B: ギアをパーキングに入れ、エンジンとラジオを切る。
    C: ギアをドライブに入れたまま、ブレーキを踏み続ける。
    D: エンジンを切るが、ヘッドライトは点灯したままにする。
  answer: B
  explanation: マニュアルには、法執行官に止められた場合、「車両をパーキングに入れ、エンジンとラジオを切ること」と記載されています。
- id: 307
  category: driver_responsibility
  question: 法執行官から反則切符を渡され、その内容に同意できない場合、マニュアルでは現場でどのようにすることを推奨していますか？
  choices:
    A: なぜ警察官が間違っているのかを冷静に説明する。
    B: 反則切符への署名や受け取りを拒否する。
    C: 議論はせず、裁判所で意見を述べる機会を待つ。
    D: 現場からすぐに弁護士に電話をかける。
  answer: C
  explanation: マニュアルでは、「反則切符を渡されても議論してはいけません。懸念を表明する機会は、裁判官や裁判所の前で与えられます」とアドバイスしています。
- id: 308
  category: sharing_the_road
  question: 夜間の運転中、シカの目にヘッドライトが反射しているのが見えた場合、まず最初にすべきことは何ですか？
  choices:
    A: 素早く通り過ぎるために加速する。
    B: ハイビームを繰り返し点滅させる。
    C: 衝突を避けるために反対車線へ急ハンドルを切る。
    D: 減速し、クラクションを鳴らし、停止できる態勢をとる。
  answer: D
  explanation: マニュアルには、「（シカの）目が見えたら減速してください。クラクションを鳴らし、停止できる態勢をとってください」と指示されています。
- id: 309
  category: driver_responsibility
  question: シカと衝突し、そのシカを合法的に引き取りたい（所有したい）場合、どうしなければなりませんか？
  choices:
    A: すぐにシカを精肉店に持ち込み、処理を依頼する。
    B: 警察に連絡し、シカ用のタグを発行してもらう。
    C: 車両で衝突したシカを所有することは許可されていない。
    D: 24時間以内に天然資源局（DNR）に報告書を提出する。
  answer: B
  explanation: マニュアルには、「シカと衝突した場合、それを所有することができます。警察に連絡して、シカ用のタグを発行してもらってください」と記載されています。
- id: 310
  category: safe_driving_rules
  question: 葬列（フューネラル・プロセッション）において、交通標識や信号に従う責任があるのはどの車両ですか？
  choices:
    A: 列に加わっているすべての車両。
    B: 列の最後尾の車両のみ。
    C: 列の先頭の車両のみ。
    D: 葬列には優先権があるため、どの車両も従う必要はない。
  answer: C
  explanation: マニュアルによると、「列の最初の車両は、交通標識や信号に従わなければならない」とされています。
- id: 311
  category: vehicle_information
  question: マニュアルでは、摩耗の激しいタイヤを「ボールドタイヤ（溝のないタイヤ）」と呼んでいます。これらに関連する主な危険は何ですか？
  choices:
    A: 燃料消費量が増加する。
    B: 車両の騒音が大きくなる。
    C: トラクション（摩擦力）が低下し、制動距離が長くなる。
    D: 釘やその他の鋭利な物体を拾いやすくなる。
  answer: C
  explanation: マニュアルには、「摩耗の激しいタイヤは『ボールドタイヤ』と呼ばれます。ボールドタイヤはトラクションを低下させ、制動距離を長くします」と記載されています。
- id: 312
  category: defensive_driving
  question: 夜間や霧の中など、視界が悪い状況は、他の車両に対する判断にどのような影響を与えますか？
  choices:
    A: 車両が実際よりも速く動いているように見えることがある。
    B: 車両が実際よりも近くにいるように見えることがある。
    C: 車両が実際よりも遅く動いているように見えることがある。
    D: 対向車の速度を判断しやすくなる。
  answer: C
  explanation: マニュアルでは、「視界が低下しているとき、車両は実際よりも遅く動いているように見えることがあります」と警告しています。
- id: 313
  category: safe_driving_rules
  question: 車にアンチロック・ブレーキ・システム（ABS）が装備されていない場合、滑りやすい路面で横滑りを避けるためにどのようにブレーキをかけるべきですか？
  choices:
    A: ブレーキペダルを強く、連続的に踏み続ける。
    B: ブレーキを軽く数回に分けて踏む（ポンピングブレーキ）。
    C: できるだけ強くブレーキを踏み込む。
    D: 低いギアにシフトダウンし、ブレーキは使用しない。
  answer: B
  explanation: マニュアルでは、「車にアンチロック・ブレーキ・システム（ABS）が装備されていない場合は、ブレーキを軽く数回に分けて踏んでください。これにより、滑りやすい路面での車の横滑りやスリップを防ぐことができます」とアドバイスしています。
- id: 314
  category: defensive_driving
  question: 寒くて湿った日に、橋や高架橋以外で凍結箇所に注意すべき場所として、マニュアルはどこを挙げていますか？
  choices:
    A: 広くて開放的な道路の中央。
    B: 舗装したばかりのアスファルトの路面。
    C: 交通量の多い道路。
    D: 日陰の場所。
  answer: D
  explanation: 滑りやすい路面や凍結した道路を見つけるために、マニュアルには「寒くて湿った日の日陰の場所、高架橋、橋」が挙げられています。
- id: 315
  category: vehicle_information
  question: 冬に運転する前には、すべての窓、ランプ、サイドミラーの雪や氷を取り除くことが重要です。車両の他にどの部分も清掃しなければなりませんか？
  choices:
    A: 屋根（ルーフ）。
    B: ナンバープレート。
    C: ホイールハウス（タイヤの周り）。
    D: ラジオのアンテナ。
  answer: B
  explanation: マニュアルの冬の運転のヒントには、「すべての窓、車両ランプ、サイドミラー、ナンバープレートから雪や氷を取り除く」ことが重要であると記されています。
- id: 316
  category: safe_driving_rules
  question: 滑りやすい冬の道を運転する際、ヘッドライトの正しい使い方はどれですか？
  choices:
    A: ヘッドライトを点灯させるが、ハイビームは使用しない。
    B: 視認性を最大にするため、常にハイビームを使用する。
    C: 雪への反射を抑えるため、ヘッドライトは消灯しておく。
    D: 他のドライバーに警告するために、ロービームとハイビームを交互に切り替える。
  answer: A
  explanation: マニュアルにある冬の運転のヒントは、「ヘッドライトを点灯し、ハイビーム（上向きライト）は使用しないこと」です。
- id: 317
  category: sharing_the_road
  question: ウィスコンシン州の幹線道路で農用トラクターや自走式農機具を運転するために必要な最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
  answer: C
  explanation: マニュアルには、「16歳未満の者は、幹線道路で農用トラクターや自走式農機具を運転することはできません」と記載されています。
- id: 318
  category: safe_driving_rules
  question: マニュアルによると、ティーンエイジャーのドライバーが別のティーンエイジャーを同乗させている場合、事故のリスクにはどのような影響がありますか？
  choices:
    A: 事故の可能性が半分になる。
    B: 事故の可能性が2倍になる。
    C: 事故の可能性が3倍になる。
    D: 事故のリスクに変化はない。
  answer: B
  explanation: マニュアルには、「ティーンエイジャーのドライバーが別のティーンエイジャーを同乗させている場合、事故の可能性は2倍になります」と記載されています。
- id: 319
  category: defensive_driving
  question: 衝突を避けるためにハンドルを切らなければならない場合、別の衝突を引き起こさないために重要な行動は何ですか？
  choices:
    A: ハンドルを切っている間、継続的にクラクションを鳴らす。
    B: 対向車線が空いていれば、対向車線にハンドルを切る。
    C: 衝撃に備えて、片手をハンドルから離して体を支える。
    D: ハンドルを切った後、車両の制御を維持できるように備える。
  answer: D
  explanation: マニュアルでは、「回避したり車線を変更したりした後は、車両の制御を維持できるように備えなければなりません。ある衝突を避けようとしてハンドルを切り、結果として別の衝突を引き起こしてしまうドライバーもいます」と警告しています。
- id: 320
  category: defensive_driving
  question: 衝突を避けるために、加速することが最善であるのはどのような状況ですか？
  choices:
    A: 側方または後方から衝突されそうなとき。
    B: 別の車両が自分の車線に正面から向かってくるとき。
    C: 変わりそうな青信号（まもなく黄色になる信号）に近づいているとき。
    D: 流れの速い交通に合流しようとしているとき。
  answer: A
  explanation: マニュアルでは、衝突を避けるために加速することが有効な場面として、「別の車両が側方または後方から衝突しそうなとき」を挙げています。
- id: 321
  category: defensive_driving
  question: タイヤが路面のグリップを失い、車両がスリップ（横滑り）し始めた場合、まず最初にとるべき行動は何ですか？
  choices:
    A: ハンドルを急に切る。
    B: ブレーキを踏まない。
    C: ブレーキペダルを素早くポンピングする。
    D: ギアをニュートラルに入れる。
  answer: B
  explanation: マニュアルに記載されているスリップ時の対処法の第一歩は「ブレーキを踏まない」ことです。
- id: 322
  category: alcohol_drugs_health
  question: ウィスコンシン州のドライバーズ・ハンドブックによると、飲酒後に酔いを覚ます唯一の方法は何ですか？
  choices:
    A: ブラックコーヒーを飲む
    B: 冷たいシャワーを浴びる
    C: 時間の経過
    D: たくさん食事を摂る
  answer: C
  explanation: ハンドブックには「酔いを覚ます唯一のものは時間である」と記載されています。
- id: 323
  category: alcohol_drugs_health
  question: ウィスコンシン州の黙示的同意法（Implied Consent Law）に基づき、警察官から禁止アルコール濃度（PAC）検査を求められた際に拒否するとどうなりますか？
  choices:
    A: 口頭注意のみを受ける
    B: 100ドルの罰金を科され、釈放される
    C: 警察官に逮捕され、少なくとも1年間は運転免許が停止される
    D: 車両が30日間押収される
  answer: C
  explanation: ハンドブックには、PAC検査を拒否した場合、「警察官は黙示的同意法違反であなたを逮捕しなければなりません。あなたは少なくとも1年間運転資格を失い、その他の罰則を受けることになります」と記載されています。
- id: 324
  category: alcohol_drugs_health
  question: ウィスコンシン州のハンドブックでは、運転中に体内に微量でも規制薬物（controlled substance）が含まれていることについてどのように述べられていますか？
  choices:
    A: 法的制限値以下であれば許可される
    B: 障害がある状態での運転（酒気帯び・薬物運転）と同じとみなされる
    C: その物質が違法である場合にのみ問題となる
    D: 物質の種類によって扱いが異なる
  answer: B
  explanation: ハンドブックには「いかなる量の規制薬物であっても、障害がある状態での運転（酒気帯び・薬物運転）と同じである」と記載されています。
- id: 325
  category: alcohol_drugs_health
  question: ウィスコンシン州のハンドブックによると、運転前に処方薬や市販薬について何を確認すべきですか？
  choices:
    A: 有効期限のみ
    B: 副作用に関する警告ラベル
    C: 免許を持つ医師によって処方されたかどうか
    D: 用法・用量の指示
  answer: B
  explanation: ハンドブックでは「ハンドルを握る前に、副作用に関する警告ラベルを確認してください。ラベルに『重機の操作をしないでください』と記載されている場合、これには自動車も含まれます」と助言しています。
- id: 326
  category: alcohol_drugs_health
  question: ウィスコンシン州のドライバーズ・ハンドブックによると、マリファナを使用するドライバーに関する研究で何が示されていますか？
  choices:
    A: 運転速度は遅くなるが、それ以外は安全である
    B: 運転中にミスを犯しやすくなる
    C: 少量の使用であれば影響はない
    D: 反応速度が速くなる
  answer: B
  explanation: ハンドブックには「マリファナを使用する人は、運転中にミスを犯しやすくなることが研究で示されています」と記載されています。
- id: 327
  category: alcohol_drugs_health
  question: 禁止アルコール濃度（PAC）検査は何を測定するものですか？
  choices:
    A: 過去24時間以内に何杯飲酒したか
    B: 呼気検査または血液検査によって、測定可能な量のアルコールが検出されるかどうか
    C: 直線上を歩く能力
    D: 最後に飲酒してからどれくらい時間が経過したか
  answer: B
  explanation: ハンドブックでは「PAC検査は、呼気検査または血液検査によって測定可能な量のアルコールが含まれているかどうかを調べるものである」と説明されています。
- id: 328
  category: alcohol_drugs_health
  question: ウィスコンシン州のハンドブックによると、アルコール、薬物、その他の物質は運転にどのような影響を与えますか？
  choices:
    A: 視力にのみ影響を与える
    B: 運転に対する自信を高める
    C: 思考や意思決定に影響を与え、距離、速度、動きの判断に支障をきたす
    D: 主に眠気を引き起こすが、判断力は損なわない
  answer: C
  explanation: ハンドブックには、アルコール、薬物、その他の物質は「思考や意思決定の方法に影響を与えます。他車の距離、速度、動きを把握することが困難になります」と記載されています。
- id: 329
  category: alcohol_drugs_health
  question: ウィスコンシン州において、処方薬の影響下で運転することは合法ですか？
  choices:
    A: 有効な処方箋がある限り合法である
    B: 薬に「運転禁止」と明記されていない限り合法である
    C: いいえ、処方薬や市販薬を含むいかなる薬物の影響下で運転することも違法である
    D: 処方した医師が運転を許可した場合のみ合法である
  answer: C
  explanation: ハンドブックには「いかなる薬物の影響下で運転することも違法であり、これには処方薬や市販薬も含まれます」と記載されています。
