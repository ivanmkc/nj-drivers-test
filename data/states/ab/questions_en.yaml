questions:
- id: 1
  category: license_system
  question: In Alberta, what is the minimum age required to apply for a Class 7 Learner's
    License?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: A
  explanation: According to the Alberta Driver's Guide, an individual must be at least
    14 years of age to apply for a Class 7 Learner's License.
- id: 2
  category: license_system
  question: A person with a Class 7 Learner's License must be accompanied by a supervisor
    who is at least 18 years old and holds which class of license?
  choices:
    A: A valid Class 7 license
    B: A valid Class 5-GDL license
    C: A valid non-GDL Class 5 license (or higher)
    D: Any valid operator's license
  answer: C
  explanation: The supervisor must be at least 18 years old and hold a full (non-GDL)
    Class 5 license or higher. A Class 5-GDL driver is not permitted to supervise
    a learner.
- id: 3
  category: license_system
  question: Under the Alberta Graduated Driver Licensing (GDL) program, how many demerit
    points will result in a license suspension for a GDL driver?
  choices:
    A: 5 points
    B: 8 points
    C: 12 points
    D: 15 points
  answer: B
  explanation: Drivers in the GDL program (Class 7 or Class 5-GDL) are suspended when
    they accumulate 8 or more demerit points within a two-year period.
- id: 4
  category: license_system
  question: What is the alcohol limit (BAC) for a driver with a Class 7 or Class 5-GDL
    license in Alberta?
  choices:
    A: 0.00% (Zero tolerance)
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: Alberta has a zero-tolerance policy for alcohol and drugs for all GDL
    drivers. Any amount of alcohol in the blood will result in an immediate suspension
    and vehicle seizure.
- id: 5
  category: license_system
  question: Between what hours is a Class 7 Learner's License holder prohibited from
    driving in Alberta?
  choices:
    A: 10:00 PM to 6:00 AM
    B: 11:00 PM to 7:00 AM
    C: Midnight to 5:00 AM
    D: Midnight to 6:00 AM
  answer: C
  explanation: Class 7 license holders are restricted from driving between the hours
    of 12:00 midnight and 5:00 AM.
- id: 6
  category: license_system
  question: To exit the GDL program and obtain a full Class 5 license, a driver must
    have been suspension-free for how many months immediately preceding the application?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: To exit the GDL program, a driver must be in the probationary stage
    (Class 5-GDL) for at least 24 months and have been suspension-free for the last
    12 months.
- id: 7
  category: license_system
  question: How long must an individual hold a Class 7 Learner's License before they
    are eligible to take the basic road test for a Class 5-GDL license?
  choices:
    A: 6 months
    B: 9 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: A person must hold a Class 7 license for at least one continuous year
    before they can take the road test to move to the Class 5-GDL level.
- id: 8
  category: license_system
  question: If you move to Alberta from another province, how many days do you have
    to register your vehicle and obtain an Alberta driver's license?
  choices:
    A: 14 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: D
  explanation: New residents of Alberta must exchange their previous license for an
    Alberta driver's license and register their vehicle within 90 days of moving to
    the province.
- id: 9
  category: license_system
  question: What is the maximum number of passengers allowed in a vehicle driven by
    a Class 5-GDL driver?
  choices:
    A: Two passengers
    B: Three passengers
    C: Limited only by the number of working seatbelts
    D: No passengers allowed
  answer: C
  explanation: In Alberta, the number of passengers for a Class 5-GDL driver is limited
    only by the number of functioning seatbelts in the vehicle.
- id: 10
  category: license_system
  question: Which of the following is NOT a requirement to obtain an Alberta driver's
    license?
  choices:
    A: Be a resident of Alberta
    B: Provide proof of Canadian citizenship or legal presence
    C: Own a registered motor vehicle
    D: Provide proof of identity and residency
  answer: C
  explanation: While you must provide proof of residency, identity, and legal presence,
    you do not need to own a vehicle to obtain a driver's license.
- id: 11
  category: license_system
  question: If you change your name or address, you must notify Alberta Registries
    within how many days?
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: Alberta law requires that you notify a registry agent of a change of
    name or address within 14 days.
- id: 12
  category: license_system
  question: For a fully licensed (non-GDL) driver in Alberta, at what demerit point
    total is the license suspended?
  choices:
    A: 8 points
    B: 10 points
    C: 15 points
    D: 20 points
  answer: C
  explanation: Fully licensed drivers (non-GDL) are suspended when they accumulate
    15 or more demerit points within a two-year period.
- id: 13
  category: license_system
  question: Which license class is required in Alberta to operate a motorcycle?
  choices:
    A: Class 4
    B: Class 5
    C: Class 6
    D: Class 7
  answer: C
  explanation: A Class 6 license is required to operate a motorcycle in Alberta. If
    a driver already has a Class 5, they must pass a motorcycle knowledge and road
    test to add the Class 6 endorsement.
- id: 14
  category: license_system
  question: What documents must a driver be able to produce when requested by a police
    officer?
  choices:
    A: Driver's license and birth certificate
    B: Driver's license, vehicle registration, and valid proof of insurance
    C: Vehicle registration and bill of sale
    D: Driver's license and vehicle purchase agreement
  answer: B
  explanation: Under the Traffic Safety Act, drivers must carry and produce a valid
    driver's license, the vehicle's registration certificate, and valid financial
    responsibility cards (insurance pink card).
- id: 15
  category: license_system
  question: A Class 5-GDL driver is prohibited from which of the following activities
    that a full Class 5 driver can do?
  choices:
    A: Driving on provincial highways
    B: Driving at night
    C: Acting as a supervisor for a Class 7 learner
    D: Towing a trailer
  answer: C
  explanation: A Class 5-GDL driver cannot serve as the accompanying supervisor for
    a person with a Class 7 Learner's License.
- id: 16
  category: license_system
  question: In Alberta, how long is the license suspension period for a first-time
    demerit point accumulation?
  choices:
    A: 14 days
    B: 1 month
    C: 3 months
    D: 6 months
  answer: B
  explanation: In Alberta, when a driver accumulates the maximum allowed demerit points
    for the first time within a two-year period, their license is suspended for 1
    month.
- id: 17
  category: license_system
  question: What is the minimum age required to apply for a Class 4 driver's license
    in Alberta, which allows the operation of a taxi or ambulance?
  choices:
    A: 16 years old
    B: 18 years old
    C: 21 years old
    D: 25 years old
  answer: B
  explanation: To obtain a Class 4 license in Alberta for professional driving (taxis,
    ambulances, small buses), the applicant must be at least 18 years of age.
- id: 18
  category: license_system
  question: If an Alberta driver completes an approved defensive driving course before
    reaching the demerit limit, how many points can be removed from their driving
    record?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 7 points
  answer: B
  explanation: Alberta drivers may earn a 3-point reduction on their driving record
    by successfully completing an approved defensive driving course once every two
    years.
- id: 19
  category: license_system
  question: For drivers holding a Class 1, 2, or 4 license in Alberta, how often must
    a medical report be submitted if the driver is under the age of 45?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 5 years
    D: Every 10 years
  answer: C
  explanation: Commercial drivers (Classes 1, 2, and 4) in Alberta must submit a medical
    report every 5 years until age 45, every 2 years until age 65, and annually thereafter.
- id: 20
  category: license_system
  question: Under Alberta law, a holder of a Class 7 Learner's License is permitted
    to operate a moped under what condition?
  choices:
    A: They must be accompanied by a supervisor
    B: They may operate a moped independently
    C: They can only drive during daylight hours
    D: They are not allowed to operate a moped
  answer: B
  explanation: In Alberta, a Class 7 Learner's License allows the holder to operate
    a moped independently, provided they are at least 14 years old.
- id: 21
  category: license_system
  question: Which endorsement code is required on an Alberta driver's license to operate
    a vehicle equipped with air brakes?
  choices:
    A: Endorsement A
    B: Endorsement S
    C: Endorsement Q
    D: Endorsement Z
  answer: C
  explanation: The 'Q' endorsement is required in Alberta for any driver operating
    a vehicle equipped with an air brake system.
- id: 22
  category: license_system
  question: In Alberta, individuals under what age must have parental or guardian
    consent to apply for a first driver's license?
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 19 years old
  answer: C
  explanation: Applicants under the age of 18 in Alberta must have a parent or legal
    guardian sign a consent form before they can be issued a license.
- id: 23
  category: license_system
  question: A Class 3 driver's license in Alberta allows the holder to operate which
    of the following?
  choices:
    A: A vehicle with only 2 axles
    B: A single vehicle with 3 or more axles
    C: Any bus designed to carry more than 15 passengers
    D: A motorcycle
  answer: B
  explanation: A Class 3 license in Alberta permits the operation of a single vehicle
    with three or more axles, or a single vehicle with three or more axles towing
    a trailer with one or more axles (if the trailer is not equipped with air brakes).
- id: 24
  category: license_system
  question: When a Class 7 learner is practicing driving, where must the supervising
    driver be seated?
  choices:
    A: Anywhere in the vehicle
    B: In the seat directly behind the driver
    C: In the front passenger seat
    D: In the passenger side rear seat
  answer: C
  explanation: The supervisor for a Class 7 learner must be seated in the front passenger
    seat of the vehicle to provide immediate assistance and instruction.
- id: 25
  category: license_system
  question: If you fail the Alberta driver's knowledge test, how long must you wait
    before you are eligible to take the test again?
  choices:
    A: 1 hour
    B: 12 hours
    C: 24 hours
    D: 7 days
  answer: C
  explanation: Alberta Registry rules require a waiting period of 24 hours before
    a candidate can retake a failed knowledge test.
- id: 26
  category: license_system
  question: What is the minimum age required to obtain a Class 3 driver's license
    in Alberta?
  choices:
    A: 16 years old
    B: 18 years old
    C: 19 years old
    D: 21 years old
  answer: B
  explanation: The minimum age to apply for a Class 3 license (heavy trucks with 3+
    axles) in Alberta is 18 years old.
- id: 27
  category: license_system
  question: On an Alberta driver's license, what does 'Condition Code A' signify?
  choices:
    A: Automatic transmission only
    B: Daylight driving only
    C: Corrective lenses required
    D: Hand controls required
  answer: C
  explanation: Condition Code A on an Alberta license indicates that the driver is
    required to wear corrective lenses (glasses or contacts) while operating a motor
    vehicle.
- id: 28
  category: license_system
  question: 'If your Alberta driver''s license is lost or stolen, you must immediately:'
  choices:
    A: Wait 30 days to see if it is returned
    B: Apply for a new license at a registry agent
    C: Write a letter to the Minister of Transportation
    D: Continue driving using your passport as a substitute
  answer: B
  explanation: If a license is lost or stolen, the driver must apply for a replacement
    at a registry agent office immediately to remain legally authorized to drive.
- id: 29
  category: license_system
  question: 'In Alberta, a person who is a full-time student from another province
    is:'
  choices:
    A: Required to get an Alberta license within 90 days
    B: Exempt from holding an Alberta license if they have a valid license from their
      home province
    C: Required to get an Alberta license within 30 days
    D: Only allowed to drive on weekends
  answer: B
  explanation: Full-time students attending an accredited Alberta educational institution
    are exempt from the requirement to obtain an Alberta driver's license, provided
    they hold a valid license from their home province or country.
- id: 30
  category: driver_testing
  question: To pass the Alberta Class 7 knowledge test, a candidate must correctly
    answer at least how many out of the 30 questions?
  choices:
    A: '20'
    B: '22'
    C: '25'
    D: '28'
  answer: C
  explanation: The Alberta knowledge test consists of 30 multiple-choice questions,
    and a minimum score of 25 is required to pass.
- id: 31
  category: driver_testing
  question: During an Alberta road test, which of the following vehicle conditions
    would result in the examiner refusing to conduct the test?
  choices:
    A: The vehicle is missing a radio
    B: The vehicle has a small dent in the rear bumper
    C: The vehicle's brake lights or signal lights are not working
    D: The vehicle's interior is not vacuumed
  answer: C
  explanation: The vehicle provided for a road test must be in safe working condition.
    Non-functional brake lights, signal lights, or a cracked windshield that obstructs
    the view are grounds for test cancellation.
- id: 32
  category: driver_testing
  question: Which of the following actions will result in an immediate 'automatic
    failure' during an Alberta road test?
  choices:
    A: Failing to use a turn signal once
    B: Driving 2 km/h under the speed limit
    C: Committing a traffic violation, such as failing to stop for a red light
    D: Taking more than three maneuvers to parallel park
  answer: C
  explanation: Committing any traffic violation, such as running a red light or stop
    sign, or performing a dangerous action that requires the examiner to intervene,
    results in an immediate failure.
- id: 33
  category: driver_testing
  question: In Alberta, what is the minimum amount of third-party liability insurance
    coverage required to register a vehicle?
  choices:
    A: $50,000
    B: $100,000
    C: $200,000
    D: $500,000
  answer: C
  explanation: Alberta law requires all registered vehicles to carry a minimum of
    $200,000 in third-party liability insurance.
- id: 34
  category: driver_testing
  question: If a driver's license has been expired for more than ____ years, the person
    must pass a knowledge test and a road test before a new license will be issued.
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: In Alberta, if your license has been expired for more than three years,
    you are treated as a new driver and must pass both the knowledge and road tests.
- id: 35
  category: driver_testing
  question: Who is legally responsible for reporting a medical condition that may
    affect their ability to drive to Alberta Transportation?
  choices:
    A: The driver's insurance company
    B: The driver's employer
    C: The driver themselves
    D: Only the driver's physician
  answer: C
  explanation: While physicians are required to report certain conditions, the driver
    is legally responsible for reporting any medical condition that might interfere
    with the safe operation of a motor vehicle.
- id: 36
  category: driver_testing
  question: How many demerit points are recorded against an Alberta driver's record
    for a conviction of distracted driving?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: In Alberta, a distracted driving conviction results in a significant
    fine and 3 demerit points being added to the driver's record.
- id: 37
  category: driver_testing
  question: When taking a Class 6 (motorcycle) road test, what specific equipment
    is the applicant required to provide?
  choices:
    A: A leather jacket
    B: An approved motorcycle safety helmet and eye protection
    C: Steel-toed boots
    D: A passenger to act as a weight ballast
  answer: B
  explanation: For a Class 6 road test, the applicant must provide a motorcycle in
    good working order and wear an approved motorcycle safety helmet and eye protection.
- id: 38
  category: driver_testing
  question: During an Alberta road test, who is allowed to be in the vehicle besides
    the driver and the Driver Examiner?
  choices:
    A: A parent or guardian if the driver is under 18
    B: A translator
    C: No one, unless the person is an authorized government official observing the
      examiner
    D: The driver's driving instructor
  answer: C
  explanation: To ensure safety and lack of distraction, only the driver and the examiner
    are permitted in the vehicle, with the exception of authorized government staff
    conducting an audit.
- id: 39
  category: driver_testing
  question: What happens if a driver accumulates 8 to 14 demerit points in Alberta
    (for a fully licensed driver)?
  choices:
    A: The license is automatically suspended
    B: The driver receives a courtesy notice by mail
    C: The driver must attend a mandatory hearing
    D: The driver's insurance is automatically cancelled
  answer: B
  explanation: For fully licensed drivers, when 8 to 14 points are accumulated, a
    courtesy notice is mailed to the driver. Suspension occurs at 15 points.
- id: 40
  category: driver_testing
  question: If you are required to take a road test for a Class 5-GDL license, what
    is the 'Basic' road test duration approximately?
  choices:
    A: 15 minutes
    B: 30 minutes
    C: 60 minutes
    D: 90 minutes
  answer: B
  explanation: The Class 5 Basic road test in Alberta typically takes approximately
    30 minutes to complete.
- id: 41
  category: driver_testing
  question: To meet the minimum vision standards for a Class 5 license in Alberta,
    what must your vision be in your better eye (with or without corrective lenses)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: In Alberta, the minimum vision requirement for a Class 5 license is
    20/40 in the better eye, with or without corrective lenses.
- id: 42
  category: driver_testing
  question: The Alberta Class 7 knowledge test consists of 30 multiple-choice questions.
    What is the minimum number of correct answers required to pass?
  choices:
    A: '20'
    B: '22'
    C: '25'
    D: '28'
  answer: C
  explanation: To pass the Alberta knowledge test, you must correctly answer at least
    25 out of 30 questions.
- id: 43
  category: driver_testing
  question: If you fail a road test in Alberta, what is the minimum amount of time
    you must wait before you are eligible to take the test again?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 14 days
  answer: A
  explanation: According to Alberta driver testing rules, if you fail a road test,
    you must wait at least 24 hours before you can attempt the test again.
- id: 44
  category: driver_testing
  question: At what age are Alberta drivers first required to submit a medical report
    from a physician to renew their driver's license?
  choices:
    A: '65'
    B: '70'
    C: '75'
    D: '80'
  answer: C
  explanation: In Alberta, drivers are required to submit a medical report at age
    75, age 80, and every two years thereafter.
- id: 45
  category: driver_testing
  question: Which license class is required in Alberta to operate a vehicle with three
    or more axles, such as a large dump truck, provided it is not a bus?
  choices:
    A: Class 1
    B: Class 2
    C: Class 3
    D: Class 4
  answer: C
  explanation: A Class 3 license allows the operation of any motor vehicle that the
    holder of a Class 5 may operate, plus a single motor vehicle with three or more
    axles.
- id: 46
  category: driver_testing
  question: In Alberta, what is the 'Code Q' endorsement on a driver's license?
  choices:
    A: Motorcycle endorsement
    B: Air brake endorsement
    C: School bus endorsement
    D: Heavy trailer endorsement
  answer: B
  explanation: The Code Q endorsement indicates that the driver is certified to operate
    vehicles equipped with air brakes.
- id: 47
  category: driver_testing
  question: As of April 2023, what is the primary requirement for a GDL driver to
    exit the Graduated Driver Licensing program and move to a full Class 5 license?
  choices:
    A: Passing the Advanced Road Test
    B: Completing 24 months of probationary driving with no suspensions in the last
      12 months
    C: Attending a mandatory 4-hour safety seminar
    D: Paying a $500 exit fee
  answer: B
  explanation: As of April 1, 2023, the Advanced Road Test was eliminated. Drivers
    now exit the GDL program automatically if they complete 24 months of probationary
    driving and have no suspensions or demerits in the final 12 months.
- id: 48
  category: driver_testing
  question: When taking a road test in Alberta, who is responsible for providing the
    vehicle?
  choices:
    A: The Alberta government
    B: The registry agent
    C: The driver examiner
    D: The person taking the test
  answer: D
  explanation: The applicant is responsible for providing a vehicle for the road test
    that is in good mechanical condition and has valid insurance and registration.
- id: 49
  category: driver_testing
  question: If you are bringing a vehicle into Alberta from another province, it must
    pass an Out-of-Province Vehicle Inspection before it can be registered. Within
    how many days must the vehicle be registered after the inspection is completed?
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: An Out-of-Province Vehicle Inspection certificate is valid for 14 days
    from the date of issue, and the vehicle must be registered within this timeframe.
- id: 50
  category: driver_testing
  question: Which of the following is a valid reason for an examiner to refuse to
    conduct a road test in Alberta?
  choices:
    A: The vehicle's windshield is cracked in a way that obstructs the driver's view
    B: The vehicle is a manual transmission
    C: The vehicle is more than 10 years old
    D: The vehicle has winter tires in the summer
  answer: A
  explanation: A vehicle must be safe and meet equipment standards. A cracked windshield
    that obstructs the driver's or examiner's view is a valid reason to refuse the
    test.
- id: 51
  category: driver_testing
  question: If your Alberta driver's license is suspended for a criminal code offense,
    what must you do before your license can be reinstated?
  choices:
    A: Wait 5 years
    B: Pay a reinstatement fee and complete any required programs (like Planning Ahead
      or IMPACT)
    C: Write a letter of apology to the Ministry of Transportation
    D: Nothing; it is reinstated automatically after the time expires
  answer: B
  explanation: Reinstatement after a criminal code suspension requires paying a fee
    and often completing mandatory programs like 'Planning Ahead' or 'IMPACT' (impaired
    driving programs).
- id: 52
  category: driver_responsibility
  question: In Alberta, what is the minimum amount of property damage that requires
    a collision to be reported to the police?
  choices:
    A: $1,000
    B: $2,000
    C: $5,000
    D: $10,000
  answer: C
  explanation: As of January 1, 2024, collisions in Alberta must be reported to the
    police if the combined property damage to all vehicles and property exceeds $5,000,
    or if there is any injury or death.
- id: 53
  category: driver_responsibility
  question: In Alberta, what is the minimum fine for a first-time conviction of driving
    an uninsured vehicle?
  choices:
    A: $500
    B: $1,250
    C: $2,875
    D: $5,000
  answer: C
  explanation: The minimum fine for driving without insurance in Alberta is $2,875
    (including the victim fine surcharge) for a first offense. Failure to pay can
    lead to jail time.
- id: 54
  category: driver_responsibility
  question: How many demerit points are assigned to an Alberta driver's record for
    failing to remain at the scene of an accident?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 10 points
  answer: C
  explanation: Failing to remain at the scene of an accident is a serious offense
    in Alberta and carries a penalty of 7 demerit points.
- id: 55
  category: driver_responsibility
  question: When you sell a vehicle in Alberta, what must you do with the license
    plates?
  choices:
    A: Leave them on the vehicle for the new owner.
    B: Return them to a registry agent or keep them for your next vehicle.
    C: Destroy them immediately.
    D: Give them to the police.
  answer: B
  explanation: In Alberta, license plates are registered to the owner, not the vehicle.
    When a vehicle is sold, the seller must remove the plates and can either transfer
    them to a new vehicle or return them to a registry agent.
- id: 56
  category: driver_responsibility
  question: If you are involved in a collision with an unattended vehicle and cannot
    locate the owner, what is your legal responsibility in Alberta?
  choices:
    A: Leave the scene if the damage looks minor.
    B: Wait for 30 minutes, then leave if no one shows up.
    C: Leave a written notice with your name, address, and license number on the vehicle.
    D: Only report it if the damage is over $5,000.
  answer: C
  explanation: Alberta law requires that if you hit an unattended vehicle, you must
    leave a written notice with your contact information and driver's license number.
- id: 57
  category: driver_responsibility
  question: When passing an emergency vehicle or tow truck stopped on the side of
    the road with its lights flashing, what is the maximum speed allowed in Alberta
    if the posted limit is 100 km/h?
  choices:
    A: 50 km/h
    B: 60 km/h
    C: 80 km/h
    D: The posted speed limit.
  answer: B
  explanation: In Alberta, you must slow to 60 km/h (or the posted speed limit, whichever
    is lower) when passing emergency vehicles or tow trucks stopped on the side of
    the road with lights flashing.
- id: 58
  category: driver_responsibility
  question: If you purchase a vehicle from a private seller, how many days do you
    have to transfer the registration to your name while using your existing valid
    license plate?
  choices:
    A: 7 days
    B: 14 days
    C: 21 days
    D: 30 days
  answer: B
  explanation: In Alberta, you can use your existing valid license plate on a newly
    purchased vehicle for up to 14 days from the date on the Bill of Sale, provided
    you carry the Bill of Sale and proof of insurance for the new vehicle.
- id: 59
  category: driver_responsibility
  question: Which of the following is a mandatory requirement for a Bill of Sale in
    Alberta?
  choices:
    A: The buyer's insurance policy number.
    B: The signature of a witness or notary public.
    C: The Vehicle Identification Number (VIN), date of sale, and signatures of both
      buyer and seller.
    D: The buyer's driver's license number.
  answer: C
  explanation: A valid Bill of Sale in Alberta must include the VIN, the date of sale,
    the purchase price, and the names and signatures of both the buyer and the seller.
- id: 60
  category: driver_responsibility
  question: In Alberta, a 'Damage Sticker' is required before a vehicle can be repaired
    if it has been involved in a reportable collision. Who issues this sticker?
  choices:
    A: The insurance company
    B: The auto body shop
    C: The police
    D: Alberta Registries
  answer: C
  explanation: Police issue a damage sticker to show that the collision has been reported.
    Auto body shops in Alberta are prohibited from repairing damage exceeding $5,000
    without this sticker.
- id: 61
  category: driver_responsibility
  question: If an Alberta driver is involved in a collision with a domestic animal
    (e.g., a horse or cow), what must they do if the owner cannot be found?
  choices:
    A: Leave the scene immediately.
    B: Report the collision to the police.
    C: Call the local SPCA only.
    D: No action is required if the animal is not injured.
  answer: B
  explanation: If you strike a domestic animal and cannot find the owner, you must
    report the accident to the police.
- id: 62
  category: driver_responsibility
  question: In Alberta, vehicle registration expires annually. How is the expiry month
    determined for an individual?
  choices:
    A: The month of the owner's birthday.
    B: The month the vehicle was purchased.
    C: Based on the first letter of the owner's last name.
    D: December 31st for all residents.
  answer: C
  explanation: Alberta uses a staggered registration system where the expiry month
    is determined by the first letter of the registrant's last name.
- id: 63
  category: driver_responsibility
  question: What happens to your driver's license if you fail to satisfy a legal judgment
    against you for damages resulting from a motor vehicle accident?
  choices:
    A: Nothing, as long as you have insurance.
    B: Your license will be suspended until the judgment is paid.
    C: You will be required to retake your road test.
    D: You will be fined $500 but keep your license.
  answer: B
  explanation: Under the Traffic Safety Act, if you fail to pay a judgment for damages
    caused by a motor vehicle, your driver's license and vehicle registration will
    be suspended until the debt is satisfied.
- id: 64
  category: driver_responsibility
  question: When applying for an Alberta driver's license, what must a person under
    the age of 18 provide?
  choices:
    A: A letter from their school principal.
    B: Proof of employment.
    C: Consent from a parent or legal guardian.
    D: A $500 security deposit.
  answer: C
  explanation: Applicants under 18 years of age must have parental or guardian consent
    to apply for a first-time driver's license or to renew a license in Alberta.
- id: 65
  category: driver_responsibility
  question: 'In Alberta, you must report a collision to the police immediately if
    the total damage to all vehicles and property appears to be more than:'
  choices:
    A: $1,000
    B: $2,000
    C: $5,000
    D: $10,000
  answer: C
  explanation: As of September 1, 2024, the property damage reporting threshold in
    Alberta increased from $2,000 to $5,000. Any collision involving injury, death,
    or damage exceeding $5,000 must be reported to the police.
- id: 66
  category: driver_responsibility
  question: 'If you are convicted of driving a motor vehicle without valid insurance
    in Alberta, the minimum fine for a first offense is approximately:'
  choices:
    A: $500
    B: $1,500
    C: $2,875
    D: $5,000
  answer: C
  explanation: Driving without insurance is a serious offense in Alberta. The minimum
    fine for a first offense is $2,875, and failure to pay can result in jail time.
- id: 67
  category: driver_responsibility
  question: Which document is NOT required to be in the vehicle while it is being
    operated on an Alberta highway?
  choices:
    A: The vehicle's Bill of Sale.
    B: A valid certificate of registration.
    C: A valid financial responsibility card (pink card).
    D: A valid driver's license.
  answer: A
  explanation: While a Bill of Sale is needed to register a vehicle, it is not required
    to be carried in the vehicle once the vehicle is registered. You must, however,
    carry the registration, insurance (pink card), and your driver's license.
- id: 68
  category: driver_responsibility
  question: What is the consequence for an Alberta driver who is caught driving while
    their license is suspended?
  choices:
    A: A mandatory $500 fine only.
    B: The vehicle may be seized and impounded for 30 days.
    C: A verbal warning for the first offense.
    D: The driver must retake the learner's knowledge test.
  answer: B
  explanation: Under the Traffic Safety Act, driving while suspended results in the
    vehicle being seized and impounded for 30 days, regardless of whether the driver
    is the owner.
- id: 69
  category: driver_responsibility
  question: 'An Alberta ''Financial Responsibility Card'' is more commonly known as:'
  choices:
    A: A credit card.
    B: A pink card.
    C: A driver's license.
    D: A vehicle registration certificate.
  answer: B
  explanation: The Financial Responsibility Card is the proof of insurance document,
    which is traditionally printed on pink paper in Alberta.
- id: 70
  category: driver_responsibility
  question: If you are involved in a collision where someone is injured, what is your
    first legal responsibility?
  choices:
    A: Call your insurance company.
    B: Take photos of the damage.
    C: Remain at the scene and render reasonable assistance.
    D: Move the vehicles out of traffic immediately.
  answer: C
  explanation: Under the Alberta Traffic Safety Act, drivers involved in a collision
    must remain at the scene and provide reasonable assistance to any person injured.
- id: 71
  category: driver_responsibility
  question: Which of the following must be included on a Bill of Sale when purchasing
    a vehicle privately in Alberta?
  choices:
    A: The buyer's insurance policy number.
    B: The Vehicle Identification Number (VIN).
    C: The seller's driver's license number.
    D: The buyer's date of birth.
  answer: B
  explanation: A valid Bill of Sale in Alberta must include the date of sale, the
    description of the vehicle (Year, Make, Model), the VIN, and the signatures of
    the buyer and seller.
- id: 72
  category: driver_responsibility
  question: If an Alberta resident brings a vehicle from another province, what must
    be completed before it can be registered in Alberta?
  choices:
    A: A road test in the vehicle.
    B: An Out-of-Province Vehicle Inspection.
    C: A paint color verification.
    D: Nothing; all Canadian registrations are automatically valid.
  answer: B
  explanation: Vehicles from outside Alberta must generally pass an Out-of-Province
    Vehicle Inspection at a certified mechanic before they can be registered in Alberta.
- id: 73
  category: driver_responsibility
  question: In Alberta, what is the penalty for failing to produce a valid insurance
    card to a police officer upon request?
  choices:
    A: A fine and potential vehicle seizure.
    B: 3 demerit points.
    C: A mandatory 24-hour license suspension.
    D: There is no penalty if you provide it within 48 hours.
  answer: A
  explanation: Drivers must be able to produce valid proof of insurance when requested
    by a peace officer. Failure to do so can result in a significant fine and the
    vehicle may be towed/seized.
- id: 74
  category: safe_driving_rules
  question: In Alberta, unless otherwise posted, what are the standard hours for school
    zones on school days?
  choices:
    A: 7:30 AM to 4:30 PM
    B: 8:00 AM to 5:00 PM
    C: 8:00 AM to 9:30 AM, 11:30 AM to 1:30 PM, and 3:00 PM to 4:30 PM
    D: 8:30 AM to one hour after sunset
  answer: C
  explanation: According to the Alberta Driver's Guide, school zone hours are 8:00
    AM to 9:30 AM, 11:30 AM to 1:30 PM, and 3:00 PM to 4:30 PM on school days, unless
    municipal bylaws or signs indicate otherwise.
- id: 75
  category: safe_driving_rules
  question: What are the standard hours for playground zones in Alberta?
  choices:
    A: 8:00 AM to 8:00 PM
    B: 8:30 AM to one hour after sunset
    C: 7:00 AM to 10:00 PM
    D: Sunrise to sunset
  answer: B
  explanation: In Alberta, playground zones are in effect every day from 8:30 AM to
    one hour after sunset.
- id: 76
  category: safe_driving_rules
  question: Under Alberta law, where is a U-turn specifically prohibited?
  choices:
    A: On a roadway between intersections in a residential area
    B: At an intersection controlled by a traffic control signal (lights)
    C: At an intersection with a stop sign
    D: On a two-lane rural highway
  answer: B
  explanation: In Alberta, U-turns are prohibited at intersections controlled by traffic
    lights, in the middle of a block between intersections in urban areas, and where
    a sign prohibits them.
- id: 77
  category: safe_driving_rules
  question: In Alberta, how far must you park away from a fire hydrant?
  choices:
    A: 2 meters
    B: 3 meters
    C: 5 meters
    D: 10 meters
  answer: C
  explanation: You must not park within 5 meters of a fire hydrant. If the hydrant
    is not located at the curb, the distance is measured from the point on the curb
    nearest the hydrant.
- id: 78
  category: safe_driving_rules
  question: When parking near a stop sign or marked crosswalk, what is the minimum
    required distance you must maintain?
  choices:
    A: 3 meters
    B: 5 meters
    C: 6 meters
    D: 8 meters
  answer: B
  explanation: Alberta regulations state you must not park within 5 meters of a stop
    sign, yield sign, or a marked crosswalk.
- id: 79
  category: safe_driving_rules
  question: In Alberta, is it legal to turn left on a red light?
  choices:
    A: No, it is never legal
    B: Yes, from a two-way street to a one-way street
    C: Yes, from a one-way street to another one-way street after a complete stop
    D: Yes, at any intersection if no traffic is coming
  answer: C
  explanation: A left turn on a red light is permitted in Alberta only when turning
    from a one-way street onto another one-way street, provided the driver comes to
    a complete stop and yields to pedestrians and other traffic.
- id: 80
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit on a primary provincial
    highway located outside an urban area in Alberta?
  choices:
    A: 80 km/h
    B: 90 km/h
    C: 100 km/h
    D: 110 km/h
  answer: C
  explanation: The default speed limit for a primary provincial highway outside an
    urban area in Alberta is 100 km/h unless signs indicate otherwise.
- id: 81
  category: safe_driving_rules
  question: What is the default speed limit within an urban area in Alberta unless
    otherwise posted?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 30 km/h
  answer: B
  explanation: The standard speed limit within an urban area (cities, towns, villages)
    is 50 km/h unless signs state a different limit.
- id: 82
  category: safe_driving_rules
  question: When approaching an uncontrolled intersection (one without signs or signals),
    what must a driver do?
  choices:
    A: Maintain speed and proceed with caution
    B: Yield the right-of-way to the vehicle on their left
    C: Yield the right-of-way to the vehicle on their right
    D: Always come to a full stop
  answer: C
  explanation: At an uncontrolled intersection in Alberta, you must yield the right-of-way
    to the vehicle on your right.
- id: 83
  category: safe_driving_rules
  question: What does a solid yellow line on your side of the center line mean in
    Alberta?
  choices:
    A: Passing is permitted if safe
    B: Passing is prohibited
    C: You are in a one-way zone
    D: You must turn left
  answer: B
  explanation: A solid yellow line on your side of the center line indicates that
    passing is prohibited.
- id: 84
  category: safe_driving_rules
  question: When a school bus is stopped with its red lights flashing and stop arm
    extended on a non-divided highway, how far back must you stop?
  choices:
    A: 5 meters
    B: 10 meters
    C: 15 meters
    D: 20 meters
  answer: D
  explanation: On a non-divided highway, drivers approaching from both directions
    must stop at least 20 meters from a school bus when its red lights are flashing
    and the stop arm is out.
- id: 85
  category: safe_driving_rules
  question: When parking a vehicle uphill on a two-way street with a curb, how should
    the front wheels be positioned?
  choices:
    A: Parallel to the curb
    B: Turned to the right (toward the curb)
    C: Turned to the left (toward the center of the road)
    D: It does not matter
  answer: C
  explanation: When parking uphill with a curb, turn the front wheels to the left
    so that if the vehicle rolls, the back of the tire will hit the curb and stop
    the car.
- id: 86
  category: safe_driving_rules
  question: In Alberta, what is the recommended following distance behind another
    vehicle under normal driving conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 seconds
    D: One car length for every 10 km/h
  answer: B
  explanation: The Alberta Driver's Guide recommends a minimum following distance
    of 2 seconds under normal conditions.
- id: 87
  category: safe_driving_rules
  question: When entering a traffic circle (roundabout) in Alberta, whom must you
    yield to?
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle
    C: No one, you have the right of way
    D: Only pedestrians
  answer: B
  explanation: Drivers entering a traffic circle must yield to traffic already circulating
    in the circle.
- id: 88
  category: safe_driving_rules
  question: In Alberta, unless otherwise posted, what is the speed limit for a school
    zone during the times it is in effect?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: In Alberta, the speed limit in school zones is 30 km/h during the hours
    of 8:00 am – 9:30 am, 11:30 am – 1:30 pm, and 3:00 pm – 4:30 pm on school days,
    unless otherwise posted by the municipality.
- id: 89
  category: safe_driving_rules
  question: When passing a stopped emergency vehicle with its sirens or lights flashing
    on a highway with a speed limit of 100 km/h, what is the maximum speed you are
    permitted to travel in the lane adjacent to the vehicle?
  choices:
    A: 50 km/h
    B: 60 km/h
    C: 80 km/h
    D: The posted speed limit
  answer: B
  explanation: In Alberta, you must slow down to 60 km/h (or the posted speed limit,
    whichever is lower) when passing emergency vehicles or tow trucks stopped on the
    side of the road with their lights flashing.
- id: 90
  category: safe_driving_rules
  question: What is the minimum distance you must park from a stop sign, yield sign,
    or marked crosswalk?
  choices:
    A: 3 meters
    B: 5 meters
    C: 8 meters
    D: 10 meters
  answer: B
  explanation: You must not park within 5 meters of a stop sign, yield sign, or a
    marked crosswalk to ensure visibility for other drivers and pedestrians.
- id: 91
  category: safe_driving_rules
  question: Under what specific condition is a left turn on a red light permitted
    in Alberta?
  choices:
    A: From a two-way street onto a one-way street
    B: From a one-way street onto another one-way street
    C: At any intersection if no traffic is coming
    D: It is never permitted
  answer: B
  explanation: In Alberta, you may turn left on a red light only if you are turning
    from a one-way street onto another one-way street, after coming to a complete
    stop and yielding to pedestrians and other traffic.
- id: 92
  category: safe_driving_rules
  question: In Alberta, U-turns are strictly prohibited in which of the following
    locations?
  choices:
    A: On a curve or near the crest of a hill where you cannot be seen by other drivers
      within 150 meters
    B: On any street in a residential area
    C: At any intersection with a four-way stop
    D: On a gravel road
  answer: A
  explanation: U-turns are prohibited on a curve or hill where visibility is less
    than 150 meters, at intersections controlled by traffic lights (unless a sign
    permits), and where a sign prohibits them.
- id: 93
  category: safe_driving_rules
  question: In Alberta, what is the penalty for a first-time distracted driving conviction?
  choices:
    A: $172 fine and 2 demerit points
    B: $300 fine and 3 demerit points
    C: $600 fine and 3 demerit points
    D: $1,000 fine and 6 demerit points
  answer: B
  explanation: Distracted driving in Alberta carries a $300 fine and 3 demerit points
    against the driver's license.
- id: 94
  category: safe_driving_rules
  question: When two vehicles approach an uncontrolled 'T' intersection at the same
    time, who has the right of way?
  choices:
    A: The vehicle on the right
    B: The vehicle on the left
    C: The vehicle on the terminating road (the road that ends)
    D: The vehicle on the through road
  answer: A
  explanation: At all uncontrolled intersections in Alberta, including 'T' intersections,
    the driver on the left must yield to the driver on the right.
- id: 95
  category: safe_driving_rules
  question: In Alberta, what is the rule regarding funeral processions at intersections?
  choices:
    A: They must follow all traffic lights and stop signs
    B: You may break through the procession if your light is green
    C: It is illegal to interrupt or drive through a funeral procession
    D: Processions are only allowed on Sundays
  answer: C
  explanation: In Alberta, it is illegal to break through or interfere with a funeral
    procession. Once the lead vehicle has entered an intersection, the rest of the
    procession may follow regardless of traffic control devices, provided their headlights
    are on.
- id: 96
  category: defensive_driving
  question: When driving in urban areas of Alberta, how far ahead should you scan
    the road to identify potential hazards?
  choices:
    A: 5 to 8 seconds
    B: 12 to 15 seconds
    C: 20 to 25 seconds
    D: 30 to 40 seconds
  answer: B
  explanation: In urban areas, drivers should scan 12 to 15 seconds ahead (about one
    to one-and-a-half blocks) to anticipate hazards.
- id: 97
  category: defensive_driving
  question: In Alberta, you must switch your high beam headlights to low beams when
    you are within what distance of an oncoming vehicle?
  choices:
    A: 100 metres
    B: 150 metres
    C: 300 metres
    D: 500 metres
  answer: C
  explanation: According to the Alberta Traffic Safety Act, you must dim your high
    beams when an oncoming vehicle is within 300 metres.
- id: 98
  category: defensive_driving
  question: When following another vehicle at night in Alberta, at what distance must
    you switch your headlights from high beam to low beam?
  choices:
    A: 50 metres
    B: 150 metres
    C: 300 metres
    D: 450 metres
  answer: B
  explanation: You must use low beam headlights when following another vehicle within
    150 metres to avoid blinding the driver in front of you through their mirrors.
- id: 99
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet Alberta highway, what is
    the first thing you should do?
  choices:
    A: Brake hard to regain traction
    B: Turn the steering wheel sharply to the right
    C: Ease off the accelerator and keep the steering wheel straight
    D: Shift the vehicle into neutral immediately
  answer: C
  explanation: If hydroplaning, you should decelerate by easing off the gas pedal.
    Do not brake, as this can cause a skid. Keep the steering wheel straight until
    you regain contact with the road.
- id: 100
  category: defensive_driving
  question: When driving on a rural Alberta highway, how far ahead should you scan
    the road for potential hazards?
  choices:
    A: 10 to 12 seconds
    B: 12 to 15 seconds
    C: 20 to 25 seconds
    D: 45 to 60 seconds
  answer: C
  explanation: On highways or rural roads, you should scan 20 to 25 seconds ahead
    because higher speeds require more distance to react and stop.
- id: 101
  category: defensive_driving
  question: When driving in heavy fog in Alberta, which lighting configuration is
    the safest to use?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: Low beams should be used in fog. High beams reflect off the moisture
    in the fog, creating glare and making it harder to see.
- id: 102
  category: defensive_driving
  question: 'If you are driving a vehicle equipped with Anti-lock Brakes (ABS) and
    need to perform an emergency stop on a slippery road, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure to the brake pedal
    C: Lightly tap the brakes to avoid locking
    D: Use the emergency parking brake
  answer: B
  explanation: With ABS, you should apply firm, continuous pressure. The system will
    automatically pump the brakes for you to prevent lock-up.
- id: 103
  category: defensive_driving
  question: In Alberta, what is the recommended following distance when driving under
    adverse conditions such as ice, snow, or heavy rain?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: At least 4 seconds
    D: 10 seconds
  answer: C
  explanation: In poor weather or road conditions, you should double the normal following
    distance to at least four seconds to account for increased stopping distances.
- id: 104
  category: defensive_driving
  question: To avoid being blinded by the glare of oncoming headlights at night, where
    should an Alberta driver look?
  choices:
    A: Directly at the oncoming headlights
    B: To the left side of the road
    C: Slightly to the right, toward the edge of the driving lane
    D: At the center line of the road
  answer: C
  explanation: If blinded by glare, look slightly to the right toward the white line
    or edge of the road to maintain your position without looking directly into the
    light.
- id: 105
  category: defensive_driving
  question: Why is the road surface most slippery during the first few minutes of
    rain in Alberta?
  choices:
    A: The tires are not yet warm enough to grip
    B: Rain mixes with oil and grease on the road surface
    C: The rain creates a vacuum between the tire and the road
    D: The water is colder when it first hits the pavement
  answer: B
  explanation: When it first starts to rain, the water mixes with oil, dust, and grease
    on the road that hasn't washed away yet, creating a very slippery film.
- id: 106
  category: defensive_driving
  question: When driving in Alberta, what is 'threshold braking'?
  choices:
    A: Braking hard enough to lock the wheels
    B: Applying the brakes just short of locking the wheels
    C: Pumping the brakes to clear water from the drums
    D: Braking only when you reach the threshold of an intersection
  answer: B
  explanation: Threshold braking is used in vehicles without ABS; it involves applying
    the brakes as firmly as possible without locking the wheels.
- id: 107
  category: defensive_driving
  question: In Alberta, when are collisions with wildlife (such as deer or moose)
    most likely to occur?
  choices:
    A: Mid-day when the sun is highest
    B: During heavy rainstorms
    C: Dusk and dawn
    D: Only during the winter months
  answer: C
  explanation: Wildlife is most active and hardest to see during dusk and dawn. Drivers
    should be especially cautious during these times, especially in rural areas.
- id: 108
  category: defensive_driving
  question: If you encounter 'black ice' while driving on an Alberta highway, what
    is the best way to maintain control?
  choices:
    A: Accelerate slightly to gain momentum
    B: Shift to a lower gear immediately
    C: Avoid sudden steering or braking movements
    D: Turn on your hazard lights and stop on the shoulder
  answer: C
  explanation: Black ice is nearly invisible. If you hit it, stay calm, avoid sudden
    braking or steering, and ease off the accelerator to let the vehicle slow down
    naturally.
- id: 109
  category: defensive_driving
  question: In ideal driving conditions, what is the minimum recommended following
    distance an Alberta driver should maintain behind the vehicle in front?
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 seconds
    D: 6 seconds
  answer: B
  explanation: The Alberta Driver's Guide recommends a minimum following distance
    of two seconds under ideal conditions. This distance should be increased in poor
    weather or road conditions.
- id: 110
  category: defensive_driving
  question: When following a large commercial vehicle or a motorcycle in Alberta,
    why should you increase your following distance to at least 4 seconds?
  choices:
    A: To allow the vehicle to see you in their mirrors and provide a safety cushion
    B: Because large vehicles are required to drive slower by law
    C: To avoid the wind turbulence created by motorcycles
    D: Because motorcycles are legally allowed to stop faster than cars
  answer: A
  explanation: Increasing following distance behind large vehicles ensures you stay
    out of their blind spots (No-Zones) and gives you a better view of the road ahead.
    For motorcycles, it provides a safety cushion as they can stop very quickly.
- id: 111
  category: defensive_driving
  question: To maintain a proper 'visual lead time' while driving in an urban area
    in Alberta, how far ahead should you be scanning the road?
  choices:
    A: 5 to 8 seconds
    B: 12 to 15 seconds
    C: 20 to 25 seconds
    D: 30 to 40 seconds
  answer: B
  explanation: Alberta's defensive driving guidelines suggest scanning 12 to 15 seconds
    ahead in urban areas (about one to one-and-a-half blocks) to anticipate hazards.
- id: 112
  category: defensive_driving
  question: When driving on rural Alberta highways, what is the recommended visual
    lead time for scanning the road ahead?
  choices:
    A: 10 to 12 seconds
    B: 15 to 18 seconds
    C: 20 to 25 seconds
    D: 45 to 60 seconds
  answer: C
  explanation: In rural areas, where speeds are higher, drivers should scan 20 to
    25 seconds ahead to identify potential hazards like wildlife or intersections.
- id: 113
  category: defensive_driving
  question: 'According to the Alberta Traffic Safety Act, you must switch your high
    beam headlights to low beams when an oncoming vehicle is within:'
  choices:
    A: 50 metres
    B: 150 metres
    C: 300 metres
    D: 500 metres
  answer: B
  explanation: Alberta law requires drivers to use low beam headlights when within
    150 metres of an oncoming vehicle to avoid blinding the other driver.
- id: 114
  category: defensive_driving
  question: When driving in heavy fog, snow, or rain in Alberta, which headlight setting
    provides the best visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Daytime running lights only
  answer: B
  explanation: Low beams should be used in adverse weather. High beams reflect off
    the moisture in the air (fog/snow), creating a 'white wall' effect that reduces
    visibility.
- id: 115
  category: defensive_driving
  question: Why should Alberta drivers be particularly cautious when driving over
    bridge decks or overpasses when temperatures are near freezing?
  choices:
    A: They are usually narrower than the rest of the road
    B: They may be icy even when other road surfaces are dry
    C: The speed limit is automatically reduced by 20 km/h
