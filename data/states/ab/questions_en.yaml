    mirrors (the 'No-Zone').
- id: 172
  category: sharing_the_road
  question: An emergency vehicle with its siren and lights operating is approaching
    you from behind on a two-way road. What should you do?
  choices:
    A: Stop exactly where you are in the lane.
    B: Speed up to stay ahead of the emergency vehicle.
    C: Move to the right edge of the road and stop.
    D: Move to the left edge of the road and stop.
  answer: C
  explanation: When an emergency vehicle with sirens/lights approaches, you must move
    to the right-hand curb or edge of the roadway and come to a complete stop until
    it has passed.
- id: 173
  category: sharing_the_road
  question: You are driving on a divided highway and see a school bus stopped on the
    opposite side of the median with its red lights flashing. What are you required
    to do?
  choices:
    A: Stop and wait for the lights to stop flashing.
    B: Slow down to 20 km/h.
    C: Proceed with caution; you do not need to stop.
    D: Stop only if there are children crossing the median.
  answer: C
  explanation: On a divided highway (where a physical median separates traffic), drivers
    on the opposite side of the bus are not required to stop, though they should still
    proceed with caution.
- id: 174
  category: sharing_the_road
  question: When turning right, what is the most important action to take regarding
    cyclists?
  choices:
    A: Honk to warn them you are turning.
    B: Check your passenger-side blind spot for cyclists who may be traveling straight.
    C: Speed up to get ahead of the cyclist before the turn.
    D: Cyclists must always yield to turning cars, so no special action is needed.
  answer: B
  explanation: Drivers must check their right blind spot for cyclists before turning
    right, as a cyclist may be proceeding straight through the intersection on the
    driver's right side.
- id: 175
  category: sharing_the_road
  question: Why should you leave extra space when following a motorcycle?
  choices:
    A: Motorcycles have a much shorter stopping distance than cars.
    B: Motorcycles are legally allowed to drive slower than the speed limit.
    C: Motorcyclists often use hand signals which are hard to see.
    D: Motorcycles are more likely to stall at intersections.
  answer: A
  explanation: Motorcycles are light and have high-performance braking systems, allowing
    them to stop much more quickly than a car. Following too closely increases the
    risk of a rear-end collision.
- id: 176
  category: sharing_the_road
  question: When a large truck is turning right at an intersection, what should you
    be aware of?
  choices:
    A: The truck will always stay in the right-most lane.
    B: The truck may need to swing wide to the left before or during the turn.
    C: The truck will stop completely before making the turn.
    D: The truck has the right-of-way over all other vehicles regardless of signs.
  answer: B
  explanation: Large vehicles have a long wheelbase and need to swing wide to clear
    the curb. Drivers should never try to pass a truck on the right when it is approaching
    an intersection.
- id: 177
  category: sharing_the_road
  question: If you see a pedestrian with a white cane raised at an intersection, what
    does this indicate?
  choices:
    A: The pedestrian is a traffic surveyor.
    B: The pedestrian is visually impaired and has the right-of-way.
    C: The pedestrian is indicating they are waiting for a bus.
    D: The pedestrian is warning you of a hazard ahead.
  answer: B
  explanation: A white cane indicates the pedestrian is visually impaired. Drivers
    must give them extra consideration and yield the right-of-way.
- id: 178
  category: sharing_the_road
  question: Which of the following vehicles are included in Alberta's 'Slow Down,
    Move Over' laws regarding stopped vehicles with flashing lights?
  choices:
    A: Only Police and Fire vehicles.
    B: Only Ambulances.
    C: Emergency vehicles, tow trucks, and highway maintenance vehicles.
    D: Any vehicle with hazard lights on.
  answer: C
  explanation: Alberta's law applies to all 'regulated' roadside vehicles with flashing
    lights, including tow trucks, snowplows, and service vehicles, not just emergency
    responders.
- id: 179
  category: sharing_the_road
  question: A cyclist in front of you extends their left arm out and downward. What
    does this signal mean?
  choices:
    A: They are turning left.
    B: They are turning right.
    C: They are slowing down or stopping.
    D: They are waving you to pass.
  answer: C
  explanation: The hand signal for slowing or stopping is the left arm extended out
    and bent downward at the elbow.
- id: 180
  category: sharing_the_road
  question: In Alberta, what is the penalty for failing to stop for a school bus with
    its alternating flashing red lights and stop arm extended?
  choices:
    A: $250 fine and 3 demerit points
    B: $402 fine and 4 demerit points
    C: $567 fine and 6 demerit points
    D: $1,000 fine and license suspension
  answer: C
  explanation: In Alberta, failing to stop for a school bus with flashing red lights
    carries a significant fine of $567 and 6 demerit points, reflecting the high safety
    risk to children.
- id: 181
  category: sharing_the_road
  question: In Alberta, if you are driving on a two-lane undivided highway and a school
    bus is stopped with flashing red lights in the oncoming lane, what must you do?
  choices:
    A: Slow down to 20 km/h and pass with caution
    B: Stop at least 20 metres before the bus and wait until the lights stop flashing
    C: Stop only if there are children crossing the road
    D: Continue at the speed limit as the bus is on the other side
  answer: B
  explanation: On an undivided highway, traffic in both directions must stop for a
    school bus with flashing red lights. You must stop at least 20 metres away.
- id: 182
  category: sharing_the_road
  question: When a school bus is displaying alternating flashing amber lights, what
    does this indicate to Alberta drivers?
  choices:
    A: The bus is about to stop to load or unload students; be prepared to stop
    B: The bus has a mechanical issue and is pulling over
    C: You must stop immediately
    D: You should speed up to pass the bus before the lights turn red
  answer: A
  explanation: Flashing amber lights are a warning that the bus is preparing to stop.
    Drivers should use extreme caution and be ready to stop when the lights change
    to red.
- id: 183
  category: sharing_the_road
  question: According to the Alberta Driver's Guide, what is the minimum distance
    you must maintain when following an emergency vehicle that has its lights and
    sirens activated?
  choices:
    A: 50 metres
    B: 100 metres
    C: 150 metres
    D: 200 metres
  answer: C
  explanation: It is illegal to follow within 150 metres of any emergency vehicle
    (fire truck, ambulance, police car) that has its siren or flashing lights operating.
- id: 184
  category: sharing_the_road
  question: 'When turning right, a motorist in Alberta should check their ''blind
    spot'' for cyclists because:'
  choices:
    A: Cyclists are required to yield to all turning vehicles
    B: Cyclists may be riding to the right of the vehicle and could be traveling straight
      through
    C: Cyclists always have the right of way over turning vehicles
    D: Cyclists are not allowed to use the traffic lane
  answer: B
  explanation: Cyclists often ride near the curb. Before turning right, you must check
    your shoulder to ensure a cyclist isn't beside you intending to go straight.
- id: 185
  category: sharing_the_road
  question: Under Alberta law, who has the right-of-way at an intersection with no
    crosswalk markings when a pedestrian is attempting to cross?
  choices:
    A: The motorist, because there is no marked crosswalk
    B: The pedestrian, as every intersection is considered an 'unmarked crosswalk'
    C: The motorist, unless the pedestrian is using a white cane
    D: Whoever arrives at the intersection first
  answer: B
  explanation: In Alberta, every intersection is considered a crosswalk, whether it
    is marked or unmarked. Drivers must yield to pedestrians at all intersections.
- id: 186
  category: sharing_the_road
  question: When sharing the road with large commercial vehicles, you should be aware
    that they have 'No-Zones.' What are these?
  choices:
    A: Areas where the truck is not allowed to drive
    B: Large blind spots behind and on both sides of the truck where the driver cannot
      see you
    C: Weight-restricted zones on residential streets
    D: The area directly in front of the truck's grill
  answer: B
  explanation: No-Zones are large blind spots. If you cannot see the truck driver's
    face in their side-view mirrors, they cannot see you.
- id: 187
  category: sharing_the_road
  question: 'In Alberta, if you are caught speeding in a construction zone when workers
    are present, the fine is:'
  choices:
    A: Reduced by half
    B: The same as a regular speeding ticket
    C: Doubled
    D: Tripled
  answer: C
  explanation: To protect road workers, Alberta law dictates that speeding fines are
    doubled when workers are present in a construction zone.
- id: 188
  category: sharing_the_road
  question: What is the correct procedure for a motorist when a funeral procession
    is crossing an intersection?
  choices:
    A: Honk to signal your presence
    B: Yield the right-of-way and do not break through the procession
    C: Pass the procession on the right
    D: Only yield if the procession has a police escort
  answer: B
  explanation: In Alberta, it is a matter of law and respect to yield to funeral processions.
    You must not drive through or interfere with a funeral procession.
- id: 189
  category: sharing_the_road
  question: 'When a large truck is turning right at an intersection, it may need to:'
  choices:
    A: Stay close to the curb to prevent cars from passing
    B: Swing wide to the left before turning to clear the curb
    C: Speed up to complete the turn quickly
    D: Turn from the far-left lane
  answer: B
  explanation: Large vehicles have a wide turning radius and 'off-tracking' (where
    the rear wheels follow a shorter path than the front wheels), requiring them to
    swing wide to clear the curb.
- id: 190
  category: sharing_the_road
  question: 'When a pedestrian is using a white cane in Alberta, it indicates they
    are visually impaired. Drivers should:'
  choices:
    A: Honk to let them know you are there
    B: Give them extra space and be prepared to stop, as they have the right-of-way
    C: Only stop if they are in a marked crosswalk
    D: Drive faster to get out of their way
  answer: B
  explanation: A white cane is a signal of visual impairment. Drivers must exercise
    extreme caution and yield the right-of-way to these pedestrians.
- id: 191
  category: sharing_the_road
  question: When passing a cyclist in Alberta, what is the recommended practice for
    safety?
  choices:
    A: Change lanes if possible or provide at least one metre of space
    B: Stay in your lane and maintain your speed
    C: Honk your horn to warn the cyclist you are passing
    D: Pass as closely as possible to encourage them to use the sidewalk
  answer: A
  explanation: The Alberta Driver's Guide recommends giving cyclists plenty of room.
    Changing lanes is the safest way to pass a cyclist.
- id: 192
  category: vehicle_information
  question: According to the Alberta Vehicle Equipment Regulation, what is the minimum
    required tread depth for tires on a passenger vehicle?
  choices:
    A: 1.0 millimetre
    B: 1.6 millimetres
    C: 2.5 millimetres
    D: 3.2 millimetres
  answer: B
  explanation: In Alberta, tires are considered unsafe if the tread depth is less
    than 1.6 millimetres (approximately 2/32 of an inch).
- id: 193
  category: vehicle_information
  question: In Alberta, when must you ensure your vehicle's headlights are turned
    on?
  choices:
    A: From sunset to sunrise
    B: Whenever you are driving on a highway
    C: From one hour after sunset until one hour before sunrise
    D: Only when it is raining or snowing
  answer: C
  explanation: Alberta law requires headlights to be on from one hour after sunset
    until one hour before sunrise, and at any time when visibility is reduced to less
    than 150 metres.
- id: 194
  category: vehicle_information
  question: Which of the following is true regarding window tinting on a vehicle registered
    in Alberta?
  choices:
    A: Any level of tint is allowed on the front side windows.
    B: Tinting is allowed on the windshield as long as it is less than 30% light blockage.
    C: No person shall install any transparent or translucent substance on a windshield
      or the windows to the direct left or right of the driver.
    D: Tinting is only prohibited on the rear window.
  answer: C
  explanation: Alberta's Vehicle Equipment Regulation prohibits aftermarket window
    tint film on the windshield and the front side windows (driver and front passenger
    sides).
- id: 195
  category: vehicle_information
  question: 'Every motor vehicle in Alberta must be equipped with a horn that can
    be heard under normal conditions from a distance of at least:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: The Alberta Vehicle Equipment Regulation states that a motor vehicle
    must have a horn that emits sound audible under normal conditions from a distance
    of not less than 60 metres.
- id: 196
  category: vehicle_information
  question: In Alberta, what are the requirements for a vehicle's brake system?
  choices:
    A: Only a foot brake (service brake) is required.
    B: Only a parking brake is required.
    C: 'The vehicle must have two separate braking systems: a service brake and a
      parking brake.'
    D: Brakes are only required on the rear wheels.
  answer: C
  explanation: 'Alberta law requires motor vehicles to have two independent braking
    systems: the service brake (foot brake) and the parking brake (emergency brake).'
- id: 197
  category: vehicle_information
  question: 'A vehicle''s tail lamps in Alberta must be clearly visible from a distance
    of at least:'
  choices:
    A: 60 metres
    B: 100 metres
    C: 150 metres
    D: 200 metres
  answer: C
  explanation: Tail lamps must be red and must be visible from a distance of at least
    150 metres to the rear.
- id: 198
  category: vehicle_information
  question: In Alberta, if a vehicle's load or a trailer obstructs the driver's view
    through the interior rearview mirror, what equipment is required?
  choices:
    A: A wide-angle interior mirror
    B: An outside rearview mirror on the left side only
    C: Outside rearview mirrors on both the right and left sides
    D: No additional equipment is required if the driver uses a spotter
  answer: C
  explanation: If the view to the rear is obstructed, the vehicle must be equipped
    with mirrors on both the left and right sides to provide the driver with a clear
    view of the highway to the rear.
- id: 199
  category: vehicle_information
  question: What is the Alberta regulation regarding mufflers and exhaust systems?
  choices:
    A: Mufflers are optional for vehicles driven only in daylight.
    B: A muffler may be bypassed if the driver is over 18.
    C: Every motor vehicle propelled by an internal combustion engine must have an
      exhaust muffler in good working order.
    D: Exhaust cut-outs are permitted for highway driving.
  answer: C
  explanation: Alberta law requires an effective muffler to prevent excessive or unusual
    noise. Widening the exhaust or using 'cut-outs' is illegal.
- id: 200
  category: vehicle_information
  question: In Alberta, a vehicle's license plate must be illuminated by a tail lamp
    or a separate white light so that it is visible from what distance?
  choices:
    A: 15 metres
    B: 30 metres
    C: 50 metres
    D: 100 metres
  answer: A
  explanation: The rear license plate must be illuminated with a white light so that
    it is clearly legible from a distance of 15 metres to the rear.
- id: 201
  category: vehicle_information
  question: Under Alberta's Vehicle Equipment Regulation, what is the maximum height
    allowed for the mounting of headlamps on a service vehicle?
  choices:
    A: 1000 millimetres
    B: 1370 millimetres
    C: 1500 millimetres
    D: 2000 millimetres
  answer: B
  explanation: Headlamps on a motor vehicle must be mounted no higher than 1370 millimetres
    from the ground.
- id: 202
  category: vehicle_information
  question: 'In Alberta, mudguards (mud flaps) are required on the rear of a vehicle
    or trailer if:'
  choices:
    A: The vehicle is a passenger car.
    B: The vehicle is driven on gravel roads.
    C: The body of the vehicle does not provide adequate protection to prevent the
      throwing of dirt and water.
    D: The vehicle has four-wheel drive.
  answer: C
  explanation: Trucks, trailers, and other vehicles must have mudguards or fenders
    that cover the full width of the tire and extend down to at least the center of
    the rear axle if the body doesn't provide this protection.
- id: 203
  category: vehicle_information
  question: What is the requirement for turn signal lights on a vehicle in Alberta?
  choices:
    A: They must be visible from 30 metres in normal sunlight.
    B: They must be visible from 100 metres in normal sunlight.
    C: They are only required on the rear of the vehicle.
    D: They must be white in the front and yellow in the back.
  answer: B
  explanation: Turn signal lamps must be visible from a distance of not less than
    100 metres in normal sunlight.
- id: 204
  category: vehicle_information
  question: According to the Alberta Driver's Guide, when must a vehicle's headlights
    be turned on?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset until one hour before sunrise
    C: Only when it is raining or snowing
    D: From 30 minutes after sunset until 30 minutes before sunrise
  answer: B
  explanation: In Alberta, headlights must be used from one hour after sunset until
    one hour before sunrise, and at any time when visibility is reduced to less than
    150 meters.
- id: 205
  category: vehicle_information
  question: What is the minimum legal tire tread depth for a passenger vehicle in
    Alberta?
  choices:
    A: 0.8 millimeters
    B: 1.6 millimeters
    C: 2.4 millimeters
    D: 3.2 millimeters
  answer: B
  explanation: Under the Alberta Vehicle Equipment Regulation, tires are considered
    unsafe if the tread depth is less than 1.6 millimeters (approx. 2/32 of an inch).
- id: 206
  category: vehicle_information
  question: Regarding window tinting, what is the law in Alberta for the windshield
    and front side windows?
  choices:
    A: Any level of tint is allowed as long as the driver is visible
    B: Only a 30% tint is allowed on front side windows
    C: No aftermarket tinting is allowed on the windshield or front side windows
    D: Tinting is allowed only if the vehicle has two side mirrors
  answer: C
  explanation: In Alberta, it is illegal to apply any aftermarket window tint to the
    windshield or the front side windows (driver and passenger side).
- id: 207
  category: vehicle_information
  question: In Alberta, a vehicle's service brake (foot brake) must be capable of
    stopping the vehicle on a dry, level, paved surface within what distance at a
    speed of 30 km/h?
  choices:
    A: 6 meters
    B: 9 meters
    C: 12 meters
    D: 15 meters
  answer: B
  explanation: The Alberta Vehicle Equipment Regulation states that the service brake
    must be able to stop the vehicle within 9 meters when traveling at 30 km/h.
- id: 208
  category: vehicle_information
  question: If your vehicle's interior rear-view mirror is obstructed by a trailer
    or load, what is the equipment requirement in Alberta?
  choices:
    A: You must remove the obstruction immediately
    B: You must have an outside mirror on the driver's side only
    C: You must have outside mirrors on both the left and right sides
    D: No additional mirrors are required if you use a spotter
  answer: C
  explanation: If the view from the internal rear-view mirror is obstructed, Alberta
    law requires the vehicle to be equipped with both left and right-side exterior
    mirrors.
- id: 209
  category: vehicle_information
  question: 'A vehicle''s horn must be audible under normal conditions from a distance
    of at least:'
  choices:
    A: 30 meters
    B: 60 meters
    C: 100 meters
    D: 150 meters
  answer: B
  explanation: According to Alberta's Vehicle Equipment Regulation, every motor vehicle
    must have a horn that can be heard from a distance of at least 60 meters.
- id: 210
  category: vehicle_information
  question: What color must the light be that illuminates the rear license plate in
    Alberta?
  choices:
    A: Red
    B: Blue
    C: White
    D: Amber
  answer: C
  explanation: Alberta law requires the rear license plate to be illuminated by a
    white light so that the plate is clearly legible from a distance of 15 meters.
- id: 211
  category: vehicle_information
  question: 'Under Alberta''s Vehicle Equipment Regulation, mudguards (fenders) are
    required on the rear of a vehicle if:'
  choices:
    A: The vehicle is a motorcycle
    B: The vehicle is a passenger car with low clearance
    C: The body of the vehicle does not effectively reduce the spray or splash of
      water and mud
    D: The vehicle is only driven in the winter
  answer: C
  explanation: Mudguards or fenders are required on the rear of vehicles (especially
    trucks and trailers) to prevent the tires from throwing debris, mud, or water
    onto the windshields of other vehicles.
- id: 212
  category: vehicle_information
  question: 'In Alberta, turn signal lights must be visible in normal sunlight from
    a distance of at least:'
  choices:
    A: 15 meters
    B: 30 meters
    C: 60 meters
    D: 100 meters
  answer: B
  explanation: Turn signal lamps must be visible from a distance of not less than
    30 meters in normal sunlight.
- id: 213
  category: vehicle_information
  question: In Alberta, if a load extends more than 1.5 meters beyond the rear of
    the vehicle, what must be attached to the end of the load during daylight hours?
  choices:
    A: A white flag
    B: A red flag (at least 30cm x 30cm)
    C: A yellow flashing light
    D: Nothing is required during daylight
  answer: B
  explanation: When a load extends 1.5 meters or more beyond the rear of a vehicle,
    a red flag at least 30 cm square must be displayed at the end of the load during
    the day. At night, a red light must be used.
- id: 214
  category: signs_and_signals
  question: Unless otherwise posted, playground zone speed limits in Alberta are in
    effect during which hours?
  choices:
    A: 8:00 AM to 8:00 PM
    B: 8:30 AM to one hour after sunset
    C: 7:30 AM to 9:00 PM
    D: Sunrise to sunset
  answer: B
  explanation: In Alberta, playground zone restrictions are in effect every day from
    8:30 AM to one hour after sunset.
- id: 215
  category: signs_and_signals
  question: When approaching an intersection with a flashing red light in Alberta,
    what must a driver do?
  choices:
    A: Slow down and proceed with caution
    B: Stop and wait for the light to turn green
    C: Stop and yield the right-of-way to traffic, then proceed when safe
    D: Yield to pedestrians but do not stop for vehicles
  answer: C
  explanation: A flashing red light means the same as a stop sign. You must come to
    a complete stop, yield to cross traffic and pedestrians, and proceed only when
    safe.
- id: 216
  category: signs_and_signals
  question: In Alberta, what does a flashing amber (yellow) traffic light mean?
  choices:
    A: Stop and wait for the light to change
    B: The light is about to turn red
    C: Proceed with caution after yielding to pedestrians and other vehicles
    D: Speed up to clear the intersection quickly
  answer: C
  explanation: A flashing amber light is a cautionary signal. Drivers may proceed
    with caution after yielding to pedestrians and other vehicles within the intersection.
- id: 217
  category: signs_and_signals
  question: 'In Alberta, a flashing green light at an intersection (not an arrow)
    generally indicates:'
  choices:
    A: A protected left turn is allowed
    B: The light is pedestrian-actuated
    C: Emergency vehicles are approaching
    D: The intersection is under construction
  answer: B
  explanation: In Alberta, a flashing green light typically means it is a pedestrian-actuated
    signal. Drivers may proceed with caution, but must be prepared to stop if the
    light changes.
- id: 218
  category: signs_and_signals
  question: In Alberta, what does a solid white line between lanes of traffic moving
    in the same direction mean?
  choices:
    A: Lane changing is encouraged
    B: Lane changing is hazardous and should be avoided
    C: The lane is reserved for bicycles only
    D: Traffic is moving in opposite directions
  answer: B
  explanation: Solid white lines are used to indicate that lane changing is discouraged
    or hazardous. Drivers should stay in their lane.
- id: 219
  category: signs_and_signals
  question: Under Alberta law, when are you permitted to turn left on a red light?
  choices:
    A: Never
    B: Only when turning from a one-way street onto another one-way street
    C: Anytime there is no oncoming traffic
    D: Only between the hours of midnight and 6:00 AM
  answer: B
  explanation: In Alberta, you can turn left on a red light only if you are turning
    from a one-way street onto another one-way street, after coming to a complete
    stop and yielding to traffic and pedestrians.
- id: 220
  category: signs_and_signals
  question: 'A ''X'' pavement marking in Alberta indicates that you are approaching:'
  choices:
    A: A hospital zone
    B: A railway crossing
    C: A crosswalk
    D: A dead-end street
  answer: B
  explanation: Large 'X' markings on the pavement warn drivers that they are approaching
    a railway crossing.
- id: 221
  category: signs_and_signals
  question: 'A white diamond marking on a lane in Alberta indicates that the lane
    is:'
  choices:
    A: Reserved for specific types of vehicles
    B: A high-speed passing lane
    C: An exit-only lane
    D: Under construction
  answer: A
  explanation: A diamond marking indicates a reserved lane, such as for buses, taxis,
    or high-occupancy vehicles (HOV).
- id: 222
  category: signs_and_signals
  question: When approaching a traffic circle (roundabout) in Alberta, which vehicle
    has the right-of-way?
  choices:
    A: The vehicle entering the circle
    B: The vehicle already in the circle
    C: The vehicle traveling at the highest speed
    D: The vehicle on the right
  answer: B
  explanation: In Alberta, drivers entering a traffic circle must yield to traffic
    already in the circle.
- id: 223
  category: signs_and_signals
  question: In Alberta, where is a U-turn NOT prohibited?
  choices:
    A: On a curve in the road
    B: At an intersection controlled by a traffic light (unless a sign permits it)
    C: On a roadway between intersections in a residential area
    D: Near the crest of a hill where visibility is less than 150 metres
  answer: C
  explanation: U-turns are prohibited on curves, near crests of hills, and at intersections
    with traffic lights (unless signs permit). They are generally allowed on residential
    roads between intersections if they can be done safely.
- id: 224
  category: signs_and_signals
  question: What does a sign with a fluorescent yellow-green background indicate in
    Alberta?
  choices:
    A: Construction zone
    B: School zone or pedestrian crossing
    C: Directional information
    D: Provincial park boundary
  answer: B
  explanation: Fluorescent yellow-green is used for school, pedestrian, and bicycle
    signs to provide high visibility.
- id: 225
  category: signs_and_signals
  question: In Alberta, if you are at a stop sign and another vehicle arrives at the
    same time at a 4-way stop, who goes first?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle turning right
    D: The vehicle that is larger
  answer: B
  explanation: At a 4-way stop, if two vehicles arrive at the same time, the driver
    on the left must yield to the driver on the right.
- id: 226
  category: signs_and_signals
  question: Unless otherwise posted, what are the effective hours for a playground
    zone in Alberta?
  choices:
    A: 8:00 AM to 8:00 PM
    B: 8:00 AM to 4:30 PM on school days
