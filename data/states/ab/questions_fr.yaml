  answer: C
  explanation: Un excès de vitesse de plus de 50 km/h au-dessus de la limite est une
    infraction grave en Alberta et entraîne 6 points d'inaptitude, ainsi qu'une comparution
    obligatoire devant le tribunal.
- id: 162
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués pour avoir omis de céder
    le passage à un piéton dans un passage pour piétons en Alberta ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: Le fait de ne pas céder le passage à un piéton dans un passage pour
    piétons est une infraction entraînant 4 points d'inaptitude en Alberta.
- id: 163
  category: penalties_and_points
  question: Dans le cadre du programme de sanctions immédiates au bord de la route
    (IRS) « AVERTISSEMENT » de l'Alberta (taux d'alcoolémie de 0,05 à 0,08), quelle
    est la durée de suspension du permis pour une première infraction ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: B
  explanation: Un premier « AVERTISSEMENT » à l'IRS (taux d'alcoolémie entre 0,05
    et 0,08) entraîne une suspension immédiate du permis de conduire de 3 jours.
- id: 164
  category: penalties_and_points
  question: En Alberta, combien de points d'inaptitude sont attribués pour une « conduite
    acrobatique » (stunting) (effectuer des actions comme des cabrés, des dérapages
    contrôlés ou conduire d'une manière qui distrait les autres usagers) ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: La conduite acrobatique sur une route en Alberta entraîne une pénalité
    de 3 points d'inaptitude et une amende importante.
- id: 165
  category: penalties_and_points
  question: Quelle est l'amende minimale pour une première infraction de conduite
    d'un véhicule à moteur non assuré sur une route de l'Alberta ?
  choices:
    A: 500 $
    B: 1 500 $
    C: 2 875 $
    D: 5 000 $
  answer: C
  explanation: L'amende minimale pour conduite sans assurance en Alberta est de 2
    875 $ pour une première infraction. Le non-paiement peut entraîner une peine d'emprisonnement.
- id: 166
  category: penalties_and_points
  question: Combien de points d'inaptitude sont appliqués pour avoir « suivi de trop
    près » (talonnage) en Alberta ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: Suivre de trop près est considéré comme une violation grave de la sécurité
    et entraîne 4 points d'inaptitude en Alberta.
- id: 167
  category: penalties_and_points
  question: Si vous êtes reconnu coupable d'avoir omis de vous arrêter pour un agent
    de la paix en Alberta, combien de points d'inaptitude sont ajoutés à votre dossier
    ?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 7 points
  answer: D
  explanation: L'omission de s'arrêter pour un agent de la paix est l'une des infractions
    les plus lourdement sanctionnées en Alberta, entraînant 7 points d'inaptitude.
- id: 168
  category: sharing_the_road
  question: En Alberta, lorsqu'il s'approche d'un autobus scolaire dans l'une ou l'autre
    direction sur une route à chaussée unique dont les feux jaunes alternatifs clignotent,
    que doit faire un conducteur ?
  choices:
    A: S'arrêter immédiatement et attendre les feux rouges.
    B: Avancer avec prudence et se tenir prêt à s'arrêter.
    C: Accélérer pour dépasser l'autobus avant que les feux ne passent au rouge.
    D: S'arrêter à au moins 20 mètres de distance.
  answer: B
  explanation: Les feux jaunes clignotants d'un autobus scolaire signifient qu'il
    se prépare à s'arrêter. Les conducteurs doivent faire preuve de prudence et être
    prêts à s'arrêter, car les feux rouges alternatifs commenceront bientôt à clignoter.
- id: 169
  category: sharing_the_road
  question: Selon le Guide du conducteur de l'Alberta, quelle est la distance minimale
    recommandée qu'un automobiliste doit maintenir lorsqu'il dépasse un cycliste sur
    une route dont la limite de vitesse est de 60 km/h ou moins ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 1,5 mètre
    D: 2 mètres
  answer: B
  explanation: Les directives de l'Alberta suggèrent un espace minimal de 1 mètre
    lors du dépassement d'un cycliste dans les zones de 60 km/h ou moins, et de 1,5
    mètre dans les zones de plus de 60 km/h.
- id: 170
  category: sharing_the_road
  question: À une intersection en Alberta où il n'y a pas de passages pour piétons
    marqués ou de lignes d'arrêt, où le piéton a-t-il la priorité ?
  choices:
    A: Les piétons n'ont la priorité qu'aux passages pour piétons marqués.
    B: Les piétons ont la priorité à toutes les intersections, qu'elles soient marquées
      ou non.
    C: Les piétons doivent céder le passage à tous les véhicules aux intersections
      non marquées.
    D: Les piétons n'ont la priorité que s'il y a un panneau « Passage pour piétons
      ».
  answer: B
  explanation: En Alberta, chaque intersection est considérée comme ayant un « passage
    pour piétons non marqué », à moins qu'un panneau n'indique le contraire. Les conducteurs
    doivent céder le passage aux piétons à toutes les intersections.
- id: 171
  category: sharing_the_road
  question: Lorsque vous suivez un gros véhicule commercial, pourquoi devriez-vous
    augmenter votre distance de sécurité plus que vous ne le feriez pour une voiture
    de tourisme ?
  choices:
    A: Les gros véhicules roulent toujours beaucoup plus lentement que la limite de
      vitesse.
    B: Pour permettre au conducteur du camion de vous voir dans son rétroviseur intérieur.
    C: Parce que les gros véhicules sont tenus par la loi de s'arrêter à tous les
      passages à niveau.
    D: Pour améliorer votre champ de vision et permettre au conducteur du camion de
      vous voir dans ses rétroviseurs latéraux.
  answer: D
  explanation: Les gros véhicules ont des angles morts importants. Si vous suivez
    de trop près, vous ne pouvez pas voir la route devant vous, et le conducteur du
    camion ne peut pas vous voir dans ses rétroviseurs latéraux (la « zone de danger
    » ou « No-Zone »).
- id: 172
  category: sharing_the_road
  question: Un véhicule d'urgence dont la sirène et les gyrophares sont en marche
    s'approche de vous par l'arrière sur une route à deux sens. Que devez-vous faire
    ?
  choices:
    A: Arrêtez-vous exactement là où vous êtes dans la voie.
    B: Accélérez pour rester devant le véhicule d'urgence.
    C: Déplacez-vous vers le bord droit de la route et arrêtez-vous.
    D: Déplacez-vous vers le bord gauche de la route et arrêtez-vous.
  answer: C
  explanation: Lorsqu'un véhicule d'urgence avec sirènes/gyrophares s'approche, vous
    devez vous diriger vers la bordure ou le bord droit de la chaussée et vous arrêter
    complètement jusqu'à ce qu'il soit passé.
- id: 173
  category: sharing_the_road
  question: Vous conduisez sur une route à chaussées séparées et voyez un autobus
    scolaire arrêté de l'autre côté du terre-plein central avec ses feux rouges clignotants.
    Que devez-vous faire ?
  choices:
    A: Arrêtez-vous et attendez que les feux cessent de clignoter.
    B: Ralentissez à 20 km/h.
    C: Procédez avec prudence ; vous n'avez pas besoin de vous arrêter.
    D: Arrêtez-vous uniquement si des enfants traversent le terre-plein central.
  answer: C
  explanation: Sur une route à chaussées séparées (où un terre-plein physique sépare
    la circulation), les conducteurs se trouvant du côté opposé à l'autobus ne sont
    pas tenus de s'arrêter, bien qu'ils doivent tout de même procéder avec prudence.
- id: 174
  category: sharing_the_road
  question: Lorsque vous tournez à droite, quelle est l'action la plus importante
    à prendre concernant les cyclistes ?
  choices:
    A: Klaxonnez pour les avertir que vous tournez.
    B: Vérifiez votre angle mort du côté passager pour les cyclistes qui pourraient
      continuer tout droit.
    C: Accélérez pour dépasser le cycliste avant le virage.
    D: Les cyclistes doivent toujours céder le passage aux voitures qui tournent,
      donc aucune action spéciale n'est nécessaire.
  answer: B
  explanation: Les conducteurs doivent vérifier leur angle mort droit avant de tourner
    à droite, car un cycliste peut traverser l'intersection tout droit sur le côté
    droit du conducteur.
- id: 175
  category: sharing_the_road
  question: Pourquoi devriez-vous laisser un espace supplémentaire lorsque vous suivez
    une moto ?
  choices:
    A: Les motos ont une distance d'arrêt beaucoup plus courte que les voitures.
    B: Les motos sont légalement autorisées à rouler plus lentement que la limite
      de vitesse.
    C: Les motocyclistes utilisent souvent des signaux manuels qui sont difficiles
      à voir.
    D: Les motos sont plus susceptibles de caler aux intersections.
  answer: A
  explanation: Les motos sont légères et possèdent des systèmes de freinage haute
    performance, ce qui leur permet de s'arrêter beaucoup plus rapidement qu'une voiture.
    Suivre de trop près augmente le risque de collision arrière.
- id: 176
  category: sharing_the_road
  question: Lorsqu'un gros camion tourne à droite à une intersection, de quoi devez-vous
    être conscient ?
  choices:
    A: Le camion restera toujours dans la voie la plus à droite.
    B: Le camion peut avoir besoin de faire un virage large vers la gauche avant ou
      pendant le virage.
    C: Le camion s'arrêtera complètement avant d'effectuer le virage.
    D: Le camion a la priorité sur tous les autres véhicules, quels que soient les
      panneaux.
  answer: B
  explanation: Les gros véhicules ont un empattement long et doivent effectuer un
    virage large pour ne pas heurter la bordure. Les conducteurs ne devraient jamais
    tenter de dépasser un camion par la droite lorsqu'il s'approche d'une intersection.
- id: 177
  category: sharing_the_road
  question: Si vous voyez un piéton avec une canne blanche levée à une intersection,
    qu'est-ce que cela indique ?
  choices:
    A: Le piéton est un enquêteur de circulation.
    B: Le piéton est malvoyant et a la priorité.
    C: Le piéton indique qu'il attend un autobus.
    D: Le piéton vous avertit d'un danger devant.
  answer: B
  explanation: Une canne blanche indique que le piéton est malvoyant. Les conducteurs
    doivent leur accorder une attention particulière et leur céder la priorité.
- id: 178
  category: sharing_the_road
  question: Lesquels des véhicules suivants sont inclus dans les lois « Ralentir,
    se tasser » (Slow Down, Move Over) de l'Alberta concernant les véhicules arrêtés
    avec des feux clignotants ?
  choices:
    A: Uniquement les véhicules de police et de pompiers.
    B: Uniquement les ambulances.
    C: Les véhicules d'urgence, les dépanneuses et les véhicules d'entretien routier.
    D: Tout véhicule ayant ses feux de détresse allumés.
  answer: C
  explanation: La loi de l'Alberta s'applique à tous les véhicules de bord de route
    « réglementés » munis de feux clignotants, y compris les dépanneuses, les chasse-neige
    et les véhicules de service, et pas seulement aux intervenants d'urgence.
- id: 179
  category: sharing_the_road
  question: Un cycliste devant vous tend le bras gauche vers l'extérieur et vers le
    bas. Que signifie ce signal ?
  choices:
    A: Il tourne à gauche.
    B: Il tourne à droite.
    C: Il ralentit ou s'arrête.
    D: Il vous fait signe de passer.
  answer: C
  explanation: Le signal manuel pour ralentir ou s'arrêter consiste à tendre le bras
    gauche vers l'extérieur et à le plier vers le bas au niveau du coude.
- id: 180
  category: sharing_the_road
  question: En Alberta, quelle est la sanction pour ne pas s'être arrêté devant un
    autobus scolaire dont les feux rouges alternatifs clignotent et dont le bras d'arrêt
    est déployé ?
  choices:
    A: Amende de 250 $ et 3 points d'inaptitude
    B: Amende de 402 $ et 4 points d'inaptitude
    C: Amende de 567 $ et 6 points d'inaptitude
    D: Amende de 1 000 $ et suspension du permis
  answer: C
  explanation: En Alberta, le fait de ne pas s'arrêter pour un autobus scolaire aux
    feux rouges clignotants entraîne une amende importante de 567 $ et 6 points d'inaptitude,
    ce qui reflète le risque élevé pour la sécurité des enfants.
- id: 181
  category: sharing_the_road
  question: En Alberta, si vous circulez sur une route à deux voies non séparées et
    qu'un autobus scolaire est arrêté avec ses feux rouges clignotants dans la voie
    opposée, que devez-vous faire ?
  choices:
    A: Ralentir à 20 km/h et dépasser avec prudence
    B: S'arrêter à au moins 20 mètres de l'autobus et attendre que les feux cessent
      de clignoter
    C: S'arrêter uniquement si des enfants traversent la route
    D: Continuer à la limite de vitesse car l'autobus se trouve de l'autre côté
  answer: B
  explanation: Sur une route non séparée, la circulation dans les deux sens doit s'arrêter
    pour un autobus scolaire aux feux rouges clignotants. Vous devez vous arrêter
    à une distance d'au moins 20 mètres.
- id: 182
  category: sharing_the_road
  question: Lorsqu'un autobus scolaire affiche des feux jaunes alternatifs clignotants,
    qu'est-ce que cela indique aux conducteurs de l'Alberta ?
  choices:
    A: L'autobus est sur le point de s'arrêter pour faire monter ou descendre des
      élèves ; soyez prêt à vous arrêter
    B: L'autobus a un problème mécanique et se range sur le côté
    C: Vous devez vous arrêter immédiatement
    D: Vous devriez accélérer pour dépasser l'autobus avant que les feux ne deviennent
      rouges
  answer: A
  explanation: Les feux jaunes clignotants sont un avertissement que l'autobus se
    prépare à s'arrêter. Les conducteurs doivent faire preuve d'une extrême prudence
    et être prêts à s'arrêter lorsque les feux passent au rouge.
- id: 183
  category: sharing_the_road
  question: Selon le Guide du conducteur de l'Alberta, quelle est la distance minimale
    que vous devez maintenir lorsque vous suivez un véhicule d'urgence dont les gyrophares
    et les sirènes sont activés ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Il est illégal de suivre à moins de 150 mètres tout véhicule d'urgence
    (camion de pompiers, ambulance, voiture de police) dont la sirène ou les gyrophares
    sont en marche.
- id: 184
  category: sharing_the_road
  question: 'Lorsqu''il tourne à droite, un automobiliste en Alberta doit vérifier
    son « angle mort » pour les cyclistes parce que :'
  choices:
    A: Les cyclistes sont tenus de céder le passage à tous les véhicules qui tournent
    B: Les cyclistes peuvent circuler à la droite du véhicule et pourraient continuer
      tout droit
    C: Les cyclistes ont toujours la priorité sur les véhicules qui tournent
    D: Les cyclistes ne sont pas autorisés à utiliser la voie de circulation
  answer: B
  explanation: Les cyclistes roulent souvent près du trottoir. Avant de tourner à
    droite, vous devez vérifier par-dessus votre épaule pour vous assurer qu'un cycliste
    ne se trouve pas à côté de vous avec l'intention d'aller tout droit.
- id: 185
  category: sharing_the_road
  question: Selon la loi de l'Alberta, qui a la priorité à une intersection sans marquage
    de passage pour piétons lorsqu'un piéton tente de traverser ?
  choices:
    A: L'automobiliste, car il n'y a pas de passage pour piétons marqué
    B: Le piéton, car chaque intersection est considérée comme un « passage pour piétons
      non marqué »
    C: L'automobiliste, à moins que le piéton n'utilise une canne blanche
    D: Le premier arrivé à l'intersection
  answer: B
  explanation: En Alberta, chaque intersection est considérée comme un passage pour
    piétons, qu'elle soit marquée ou non. Les conducteurs doivent céder le passage
    aux piétons à toutes les intersections.
- id: 186
  category: sharing_the_road
  question: Lorsque vous partagez la route avec de gros véhicules commerciaux, vous
    devez savoir qu'ils ont des « zones de danger » (No-Zones). De quoi s'agit-il
    ?
  choices:
    A: Zones où le camion n'est pas autorisé à circuler
    B: Angles morts importants derrière et des deux côtés du camion où le conducteur
      ne peut pas vous voir
    C: Zones à restriction de poids dans les rues résidentielles
    D: La zone située directement devant la calandre du camion
  answer: B
  explanation: Les « No-Zones » sont de grands angles morts. Si vous ne voyez pas
    le visage du conducteur du camion dans ses rétroviseurs extérieurs, il ne peut
    pas vous voir.
- id: 187
  category: sharing_the_road
  question: 'En Alberta, si vous êtes pris en flagrant délit d''excès de vitesse dans
    une zone de construction en présence de travailleurs, l''amende est :'
  choices:
    A: Réduite de moitié
    B: La même qu'une contravention pour excès de vitesse ordinaire
    C: Doublée
    D: Triplée
  answer: C
  explanation: Pour protéger les travailleurs de la route, la loi de l'Alberta stipule
    que les amendes pour excès de vitesse sont doublées lorsque des travailleurs sont
    présents dans une zone de construction.
- id: 188
  category: sharing_the_road
  question: Quelle est la procédure correcte pour un automobiliste lorsqu'un cortège
    funèbre traverse une intersection ?
  choices:
    A: Klaxonner pour signaler votre présence
    B: Céder le passage et ne pas couper le cortège
    C: Dépasser le cortège par la droite
    D: Ne céder le passage que si le cortège a une escorte policière
  answer: B
  explanation: En Alberta, c'est une question de loi et de respect que de céder le
    passage aux cortèges funèbres. Vous ne devez pas traverser ou gêner un cortège
    funèbre.
- id: 189
  category: sharing_the_road
  question: 'Lorsqu''un gros camion tourne à droite à une intersection, il peut avoir
    besoin de :'
  choices:
    A: Rester près du trottoir pour empêcher les voitures de passer
    B: Faire un large écart vers la gauche avant de tourner pour ne pas heurter le
      trottoir
    C: Accélérer pour terminer le virage rapidement
    D: Tourner à partir de la voie de l'extrême gauche
  answer: B
  explanation: Les gros véhicules ont un large rayon de braquage et un phénomène de
    « déport » (où les roues arrière suivent une trajectoire plus courte que les roues
    avant), ce qui les oblige à s'écarter largement pour éviter le trottoir.
- id: 190
  category: sharing_the_road
  question: 'Lorsqu''un piéton utilise une canne blanche en Alberta, cela indique
    qu''il a une déficience visuelle. Les conducteurs doivent :'
  choices:
    A: Klaxonner pour lui signaler votre présence
    B: Lui laisser plus d'espace et être prêt à s'arrêter, car il a la priorité
    C: S'arrêter uniquement s'il se trouve dans un passage pour piétons balisé
    D: Conduire plus vite pour ne pas le gêner
  answer: B
  explanation: Une canne blanche est un signal de déficience visuelle. Les conducteurs
    doivent faire preuve d'une extrême prudence et céder le passage à ces piétons.
- id: 191
  category: sharing_the_road
  question: En Alberta, quelle est la pratique recommandée pour dépasser un cycliste
    en toute sécurité ?
  choices:
    A: Changer de voie si possible ou laisser au moins un mètre d'espace
    B: Rester dans votre voie et maintenir votre vitesse
    C: Klaxonner pour avertir le cycliste que vous le dépassez
    D: Passer le plus près possible pour l'encourager à utiliser le trottoir
  answer: A
  explanation: Le Guide du conducteur de l'Alberta recommande de laisser beaucoup
    d'espace aux cyclistes. Changer de voie est le moyen le plus sûr de dépasser un
    cycliste.
- id: 192
  category: vehicle_information
  question: Selon le Règlement sur l'équipement des véhicules de l'Alberta (Alberta
    Vehicle Equipment Regulation), quelle est la profondeur de sculpture minimale
    requise pour les pneus d'un véhicule de tourisme ?
  choices:
    A: 1,0 millimètre
    B: 1,6 millimètre
    C: 2,5 millimètres
    D: 3,2 millimètres
  answer: B
  explanation: En Alberta, les pneus sont considérés comme dangereux si la profondeur
    de la sculpture est inférieure à 1,6 millimètre (environ 2/32 de pouce).
- id: 193
  category: vehicle_information
  question: En Alberta, quand devez-vous vous assurer que les phares de votre véhicule
    sont allumés ?
  choices:
    A: Du coucher au lever du soleil
    B: Chaque fois que vous conduisez sur une autoroute
    C: D'une heure après le coucher du soleil jusqu'à une heure avant le lever du
      soleil
    D: Uniquement lorsqu'il pleut ou qu'il neige
  answer: C
  explanation: La loi de l'Alberta exige que les phares soient allumés d'une heure
    après le coucher du soleil jusqu'à une heure avant le lever du soleil, et à tout
    moment lorsque la visibilité est réduite à moins de 150 mètres.
- id: 194
  category: vehicle_information
  question: Laquelle des affirmations suivantes est vraie concernant le teintage des
    vitres d'un véhicule immatriculé en Alberta ?
  choices:
    A: Tout niveau de teinte est autorisé sur les vitres latérales avant.
    B: Le teintage est autorisé sur le pare-brise tant qu'il bloque moins de 30 %
      de la lumière.
    C: Nul ne doit installer de substance transparente ou translucide sur un pare-brise
      ou sur les vitres situées directement à gauche ou à droite du conducteur.
    D: Le teintage n'est interdit que sur la lunette arrière.
  answer: C
  explanation: Le Règlement sur l'équipement des véhicules de l'Alberta interdit l'application
    de films teintés après-vente sur le pare-brise et les vitres latérales avant (côtés
    conducteur et passager avant).
- id: 195
  category: vehicle_information
  question: 'En Alberta, tout véhicule à moteur doit être équipé d''un klaxon pouvant
    être entendu dans des conditions normales à une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Le Règlement sur l'équipement des véhicules de l'Alberta stipule qu'un
    véhicule à moteur doit être muni d'un klaxon émettant un son audible dans des
    conditions normales à une distance d'au moins 60 mètres.
- id: 196
  category: vehicle_information
  question: En Alberta, quelles sont les exigences relatives au système de freinage
    d'un véhicule ?
  choices:
    A: Seul un frein à pied (frein de service) est requis.
    B: Seul un frein de stationnement est requis.
    C: 'Le véhicule doit posséder deux systèmes de freinage distincts : un frein de
      service et un frein de stationnement.'
    D: Les freins ne sont requis que sur les roues arrière.
  answer: C
  explanation: 'La loi de l''Alberta exige que les véhicules à moteur soient équipés
    de deux systèmes de freinage indépendants : le frein de service (frein à pied)
    et le frein de stationnement (frein d''urgence).'
- id: 197
  category: vehicle_information
  question: 'En Alberta, les feux arrière d''un véhicule doivent être clairement visibles
    à une distance d''au moins :'
  choices:
    A: 60 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Les feux arrière doivent être rouges et doivent être visibles à une
    distance d'au moins 150 mètres vers l'arrière.
- id: 198
  category: vehicle_information
  question: En Alberta, si le chargement d'un véhicule ou une remorque obstrue la
    vue du conducteur dans le rétroviseur intérieur, quel équipement est requis ?
  choices:
    A: Un rétroviseur intérieur grand angle
    B: Un rétroviseur extérieur du côté gauche uniquement
    C: Des rétroviseurs extérieurs sur les côtés droit et gauche
    D: Aucun équipement supplémentaire n'est requis si le conducteur utilise un signaleur
  answer: C
  explanation: Si la vue vers l'arrière est obstruée, le véhicule doit être équipé
    de rétroviseurs sur les côtés gauche et droit pour permettre au conducteur d'avoir
    une vue dégagée de la route à l'arrière.
- id: 199
  category: vehicle_information
  question: Quelle est la réglementation de l'Alberta concernant les silencieux et
    les systèmes d'échappement ?
  choices:
    A: Les silencieux sont facultatifs pour les véhicules conduits uniquement de jour.
    B: Un silencieux peut être contourné si le conducteur a plus de 18 ans.
    C: Tout véhicule à moteur propulsé par un moteur à combustion interne doit être
      muni d'un silencieux d'échappement en bon état de fonctionnement.
    D: Les dispositifs de dérivation d'échappement (cut-outs) sont autorisés pour
      la conduite sur autoroute.
  answer: C
  explanation: La loi de l'Alberta exige un silencieux efficace pour prévenir les
    bruits excessifs ou inhabituels. L'élargissement de l'échappement ou l'utilisation
    de dispositifs de dérivation (cut-outs) est illégal.
- id: 200
  category: vehicle_information
  question: En Alberta, la plaque d'immatriculation d'un véhicule doit être éclairée
    par un feu arrière ou une lumière blanche distincte afin d'être visible à quelle
    distance ?
  choices:
    A: 15 mètres
    B: 30 mètres
    C: 50 mètres
    D: 100 mètres
  answer: A
  explanation: La plaque d'immatriculation arrière doit être éclairée par une lumière
    blanche de manière à être clairement lisible à une distance de 15 mètres vers
    l'arrière.
- id: 201
  category: vehicle_information
  question: Selon le Règlement sur l'équipement des véhicules de l'Alberta, quelle
    est la hauteur maximale autorisée pour le montage des phares sur un véhicule de
    service ?
  choices:
    A: 1000 millimètres
    B: 1370 millimètres
    C: 1500 millimètres
    D: 2000 millimètres
  answer: B
  explanation: Les phares d'un véhicule à moteur doivent être montés à une hauteur
    maximale de 1370 millimètres du sol.
- id: 202
  category: vehicle_information
  question: 'En Alberta, des garde-boue (mud flaps) sont requis à l''arrière d''un
    véhicule ou d''une remorque si :'
  choices:
    A: Le véhicule est une voiture de tourisme.
    B: Le véhicule circule sur des routes de gravier.
    C: La carrosserie du véhicule n'offre pas une protection adéquate pour empêcher
      la projection de terre et d'eau.
    D: Le véhicule est équipé d'une traction intégrale (4x4).
  answer: C
  explanation: Les camions, remorques et autres véhicules doivent être munis de garde-boue
    ou d'ailes couvrant toute la largeur du pneu et descendant au moins jusqu'au centre
    de l'essieu arrière si la carrosserie n'offre pas cette protection.
- id: 203
  category: vehicle_information
  question: Quelle est l'exigence concernant les feux de changement de direction (clignotants)
    sur un véhicule en Alberta ?
  choices:
    A: Ils doivent être visibles à 30 mètres en plein soleil.
    B: Ils doivent être visibles à 100 mètres en plein soleil.
    C: Ils ne sont requis qu'à l'arrière du véhicule.
    D: Ils doivent être blancs à l'avant et jaunes à l'arrière.
  answer: B
  explanation: Les feux de changement de direction doivent être visibles à une distance
    d'au moins 100 mètres en plein soleil.
- id: 204
  category: vehicle_information
  question: Selon le Guide du conducteur de l'Alberta, quand les phares d'un véhicule
    doivent-ils être allumés ?
  choices:
    A: Du coucher au lever du soleil
    B: D'une heure après le coucher du soleil jusqu'à une heure avant le lever du
      soleil
    C: Uniquement lorsqu'il pleut ou qu'il neige
    D: De 30 minutes après le coucher du soleil jusqu'à 30 minutes avant le lever
      du soleil
  answer: B
  explanation: En Alberta, les phares doivent être utilisés d'une heure après le coucher
    du soleil jusqu'à une heure avant le lever du soleil, et à tout moment où la visibilité
    est réduite à moins de 150 mètres.
- id: 205
  category: vehicle_information
  question: Quelle est la profondeur minimale légale de la bande de roulement des
    pneus pour un véhicule de tourisme en Alberta ?
  choices:
    A: 0,8 millimètre
    B: 1,6 millimètre
    C: 2,4 millimètres
    D: 3,2 millimètres
  answer: B
  explanation: Selon le Règlement sur l'équipement des véhicules de l'Alberta, les
    pneus sont considérés comme dangereux si la profondeur de la bande de roulement
    est inférieure à 1,6 millimètre (environ 2/32 de pouce).
- id: 206
  category: vehicle_information
  question: En ce qui concerne les vitres teintées, quelle est la loi en Alberta pour
    le pare-brise et les vitres latérales avant ?
  choices:
    A: Tout niveau de teinte est autorisé tant que le conducteur est visible
    B: Seule une teinte de 30 % est autorisée sur les vitres latérales avant
    C: Aucune teinte après-vente n'est autorisée sur le pare-brise ou les vitres latérales
      avant
    D: La teinte n'est autorisée que si le véhicule possède deux rétroviseurs extérieurs
  answer: C
  explanation: En Alberta, il est illégal d'appliquer une pellicule teintée après-vente
    sur le pare-brise ou sur les vitres latérales avant (côté conducteur et passager).
- id: 207
  category: vehicle_information
  question: En Alberta, le frein de service (frein à pied) d'un véhicule doit être
    capable d'arrêter le véhicule sur une surface pavée, plane et sèche sur quelle
    distance à une vitesse de 30 km/h ?
  choices:
    A: 6 mètres
    B: 9 mètres
    C: 12 mètres
    D: 15 mètres
  answer: B
  explanation: Le Règlement sur l'équipement des véhicules de l'Alberta stipule que
    le frein de service doit pouvoir arrêter le véhicule sur une distance de 9 mètres
    lorsqu'il roule à 30 km/h.
- id: 208
  category: vehicle_information
  question: Si le rétroviseur intérieur de votre véhicule est obstrué par une remorque
    ou un chargement, quelle est l'exigence en matière d'équipement en Alberta ?
  choices:
    A: Vous devez retirer l'obstruction immédiatement
    B: Vous devez avoir un rétroviseur extérieur du côté conducteur uniquement
    C: Vous devez avoir des rétroviseurs extérieurs sur les côtés gauche et droit
    D: Aucun rétroviseur supplémentaire n'est requis si vous utilisez un signaleur
  answer: C
  explanation: Si la vue depuis le rétroviseur intérieur est obstruée, la loi de l'Alberta
    exige que le véhicule soit équipé de rétroviseurs extérieurs à gauche et à droite.
- id: 209
  category: vehicle_information
  question: 'Le klaxon d''un véhicule doit être audible dans des conditions normales
    à une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Selon le Règlement sur l'équipement des véhicules de l'Alberta, chaque
    véhicule à moteur doit être muni d'un klaxon pouvant être entendu à une distance
    d'au moins 60 mètres.
- id: 210
  category: vehicle_information
  question: De quelle couleur doit être le feu qui éclaire la plaque d'immatriculation
    arrière en Alberta ?
  choices:
    A: Rouge
    B: Bleu
    C: Blanc
    D: Ambre
  answer: C
  explanation: La loi de l'Alberta exige que la plaque d'immatriculation arrière soit
    éclairée par un feu blanc afin que la plaque soit clairement lisible à une distance
    de 15 mètres.
- id: 211
  category: vehicle_information
  question: 'En vertu du Règlement sur l''équipement des véhicules de l''Alberta,
    des garde-boue (ailes) sont requis à l''arrière d''un véhicule si :'
  choices:
    A: Le véhicule est une motocyclette
    B: Le véhicule est une voiture de tourisme à garde au sol basse
    C: La carrosserie du véhicule ne réduit pas efficacement les projections ou les
      éclaboussures d'eau et de boue
    D: Le véhicule n'est conduit qu'en hiver
  answer: C
  explanation: Des garde-boue ou des ailes sont requis à l'arrière des véhicules (particulièrement
    les camions et les remorques) pour empêcher les pneus de projeter des débris,
    de la boue ou de l'eau sur les pare-brise des autres véhicules.
- id: 212
  category: vehicle_information
  question: 'En Alberta, les feux de changement de direction doivent être visibles
    à la lumière normale du jour à une distance d''au moins :'
  choices:
    A: 15 mètres
    B: 30 mètres
    C: 60 mètres
    D: 100 mètres
  answer: B
  explanation: Les feux de changement de direction doivent être visibles à une distance
    d'au moins 30 mètres à la lumière normale du jour.
- id: 213
  category: vehicle_information
  question: En Alberta, si un chargement dépasse de plus de 1,5 mètre l'arrière du
    véhicule, que doit-on fixer à l'extrémité du chargement pendant les heures de
    clarté ?
  choices:
    A: Un drapeau blanc
    B: Un drapeau rouge (au moins 30 cm x 30 cm)
    C: Un feu clignotant jaune
    D: Rien n'est requis pendant la journée
  answer: B
  explanation: Lorsqu'un chargement dépasse de 1,5 mètre ou plus l'arrière d'un véhicule,
    un drapeau rouge d'au moins 30 cm carrés doit être affiché à l'extrémité du chargement
    pendant la journée. La nuit, un feu rouge doit être utilisé.
- id: 214
  category: signs_and_signals
  question: Sauf indication contraire, les limites de vitesse dans les zones de jeux
    en Alberta sont en vigueur pendant quelles heures ?
  choices:
    A: De 8 h 00 à 20 h 00
    B: De 8 h 30 à une heure après le coucher du soleil
    C: De 7 h 30 à 21 h 00
    D: Du lever au coucher du soleil
  answer: B
  explanation: En Alberta, les restrictions des zones de jeux sont en vigueur tous
    les jours de 8 h 30 jusqu'à une heure après le coucher du soleil.
- id: 215
  category: signs_and_signals
  question: En approchant d'une intersection avec un feu rouge clignotant en Alberta,
    que doit faire un conducteur ?
  choices:
    A: Ralentir et avancer avec prudence
    B: S'arrêter et attendre que le feu passe au vert
    C: S'arrêter et céder le passage à la circulation, puis avancer quand c'est sécuritaire
    D: Céder le passage aux piétons mais ne pas s'arrêter pour les véhicules
  answer: C
  explanation: Un feu rouge clignotant a la même signification qu'un panneau d'arrêt.
    Vous devez effectuer un arrêt complet, céder le passage à la circulation transversale
    et aux piétons, et ne repartir que lorsque c'est sécuritaire.
- id: 216
  category: signs_and_signals
  question: En Alberta, que signifie un feu de circulation jaune (ambre) clignotant
    ?
  choices:
    A: S'arrêter et attendre que le feu change
    B: Le feu est sur le point de passer au rouge
    C: Avancer avec prudence après avoir cédé le passage aux piétons et aux autres
      véhicules
    D: Accélérer pour dégager l'intersection rapidement
  answer: C
  explanation: Un feu jaune clignotant est un signal de prudence. Les conducteurs
    peuvent avancer avec prudence après avoir cédé le passage aux piétons et aux autres
    véhicules se trouvant dans l'intersection.
- id: 217
  category: signs_and_signals
  question: 'En Alberta, un feu vert clignotant à une intersection (pas une flèche)
    indique généralement :'
  choices:
    A: Un virage à gauche protégé est autorisé
    B: Le feu est actionné par les piétons
    C: Des véhicules d'urgence approchent
    D: L'intersection est en travaux
  answer: B
  explanation: En Alberta, un feu vert clignotant signifie généralement qu'il s'agit
    d'un signal actionné par les piétons. Les conducteurs peuvent avancer avec prudence,
    mais doivent être prêts à s'arrêter si le feu change.
- id: 218
  category: signs_and_signals
  question: En Alberta, que signifie une ligne blanche continue entre des voies de
    circulation circulant dans la même direction ?
  choices:
    A: Le changement de voie est encouragé
    B: Le changement de voie est dangereux et doit être évité
    C: La voie est réservée uniquement aux vélos
    D: La circulation se déplace dans des directions opposées
  answer: B
  explanation: Les lignes blanches continues sont utilisées pour indiquer que le changement
    de voie est déconseillé ou dangereux. Les conducteurs doivent rester dans leur
    voie.
- id: 219
  category: signs_and_signals
  question: En vertu de la loi de l'Alberta, quand est-il permis de tourner à gauche
    à un feu rouge ?
  choices:
    A: Jamais
    B: Uniquement lors d'un virage d'une rue à sens unique vers une autre rue à sens
      unique
    C: Chaque fois qu'il n'y a pas de circulation en sens inverse
    D: Uniquement entre minuit et 6 h 00
  answer: B
  explanation: En Alberta, vous pouvez tourner à gauche à un feu rouge uniquement
    si vous tournez d'une rue à sens unique vers une autre rue à sens unique, après
    avoir effectué un arrêt complet et cédé le passage à la circulation et aux piétons.
- id: 220
  category: signs_and_signals
  question: 'Un marquage au sol en forme de « X » en Alberta indique que vous approchez
    de :'
  choices:
    A: Une zone hospitalière
    B: Un passage à niveau
    C: Un passage pour piétons
    D: Une impasse
  answer: B
  explanation: De grands marquages en « X » sur la chaussée avertissent les conducteurs
    qu'ils approchent d'un passage à niveau.
- id: 221
  category: signs_and_signals
  question: 'Un marquage en forme de losange blanc sur une voie en Alberta indique
    que la voie est :'
  choices:
    A: Réservée à des types de véhicules spécifiques
    B: Une voie de dépassement à grande vitesse
    C: Une voie de sortie obligatoire
    D: En travaux
  answer: A
  explanation: Un marquage en losange indique une voie réservée, par exemple pour
    les autobus, les taxis ou les véhicules multioccupants (VMO).
- id: 222
  category: signs_and_signals
  question: En approchant d'un carrefour giratoire (rond-point) en Alberta, quel véhicule
    a la priorité ?
  choices:
    A: Le véhicule qui entre dans le carrefour
    B: Le véhicule déjà engagé dans le carrefour
    C: Le véhicule circulant à la vitesse la plus élevée
    D: Le véhicule à droite
  answer: B
  explanation: En Alberta, les conducteurs qui entrent dans un carrefour giratoire
    doivent céder le passage aux véhicules déjà engagés dans celui-ci.
- id: 223
  category: signs_and_signals
  question: En Alberta, où un demi-tour n'est-il PAS interdit ?
  choices:
    A: Dans un virage
    B: À une intersection contrôlée par des feux de circulation (sauf si un panneau
      le permet)
    C: Sur une chaussée entre deux intersections dans une zone résidentielle
    D: Près du sommet d'une côte où la visibilité est inférieure à 150 mètres
  answer: C
  explanation: Les demi-tours sont interdits dans les virages, près du sommet des
    côtes et aux intersections avec des feux de circulation (sauf indication contraire).
    Ils sont généralement autorisés sur les routes résidentielles entre les intersections
    s'ils peuvent être effectués en toute sécurité.
- id: 224
  category: signs_and_signals
  question: Que signifie un panneau avec un fond jaune-vert fluorescent en Alberta
    ?
  choices:
    A: Zone de travaux
    B: Zone scolaire ou passage pour piétons
    C: Informations directionnelles
    D: Limite d'un parc provincial
  answer: B
  explanation: Le jaune-vert fluorescent est utilisé pour les panneaux scolaires,
    de piétons et de cyclistes afin d'offrir une grande visibilité.
- id: 225
  category: signs_and_signals
  question: En Alberta, si vous êtes à un panneau d'arrêt et qu'un autre véhicule
    arrive en même temps à un arrêt multidirectionnel (4-way stop), qui passe en premier
    ?
  choices:
    A: Le véhicule à gauche
    B: Le véhicule à droite
    C: Le véhicule qui tourne à droite
    D: Le véhicule le plus gros
  answer: B
  explanation: À un arrêt multidirectionnel, si deux véhicules arrivent en même temps,
    le conducteur à gauche doit céder le passage au conducteur à droite.
- id: 226
  category: signs_and_signals
  question: Sauf indication contraire, quelles sont les heures d'entrée en vigueur
    d'une zone de jeux en Alberta ?
  choices:
    A: De 8 h 00 à 20 h 00
    B: De 8 h 00 à 16 h 30 les jours d'école
    C: De 8 h 30 à une heure après le coucher du soleil
    D: Du lever au coucher du soleil
  answer: C
  explanation: En Alberta, les zones de jeux sont en vigueur tous les jours de 8 h
    30 à une heure après le coucher du soleil.
- id: 227
  category: signs_and_signals
  question: Que signifie un feu vert clignotant à une intersection en Alberta ?
  choices:
    A: Le feu est sur le point de passer au jaune
    B: Il s'agit d'un signal actionné par les piétons ; avancez avec prudence
    C: Vous avez un virage à gauche protégé
    D: Des véhicules d'urgence approchent
  answer: B
  explanation: En Alberta, un feu vert clignotant indique un signal actionné par les
    piétons. Les conducteurs peuvent avancer mais doivent être prêts à s'arrêter si
    le feu passe au jaune ou au rouge.
- id: 228
  category: signs_and_signals
  question: En approchant d'un passage à niveau muni d'un feu rouge clignotant et
    de sonneries, que doit faire le conducteur ?
  choices:
    A: Ralentir et traverser si aucun train n'est visible
    B: S'arrêter à au moins 5 mètres du rail le plus proche
    C: S'arrêter à au moins 15 mètres du rail le plus proche
    D: S'arrêter à au moins 5 mètres et à au plus 15 mètres du rail le plus proche
  answer: D
  explanation: La loi de l'Alberta exige que les conducteurs s'arrêtent à une distance
    comprise entre 5 et 15 mètres du rail le plus proche à un passage à niveau lorsque
    les signaux sont activés.
- id: 229
  category: signs_and_signals
  question: 'Une ligne blanche continue tracée en travers d''une voie à une intersection
    est appelée :'
  choices:
    A: Ligne de cédez-le-passage
    B: Ligne d'arrêt
    C: Limite pour piétons
    D: Marquage de passage pour piétons
  answer: B
  explanation: Une ligne blanche continue en travers d'une voie à une intersection
    est une ligne d'arrêt, indiquant l'endroit où un véhicule doit effectuer un arrêt
    complet.
- id: 230
  category: signs_and_signals
  question: En Alberta, que signifie un marquage au sol en forme de « X » ?
  choices:
    A: Zone de stationnement interdit
    B: Zone hospitalière à venir
    C: Passage à niveau à venir
    D: Intersection à venir
  answer: C
  explanation: Un grand « X » peint sur la chaussée indique que vous approchez d'un
    passage à niveau.
- id: 231
  category: signs_and_signals
  question: Quelle est la signification d'une ligne jaune continue à côté d'une ligne
    jaune discontinue sur une route ?
  choices:
    A: Le dépassement est interdit pour tous les véhicules
    B: Le dépassement est autorisé pour le conducteur qui a la ligne discontinue de
      son côté
    C: Le dépassement est autorisé pour le conducteur qui a la ligne continue de son
      côté
    D: La route se rétrécit devant
  answer: B
  explanation: Lorsqu'une ligne jaune continue et une ligne jaune discontinue sont
    présentes ensemble, le dépassement n'est autorisé que pour le véhicule qui a la
    ligne discontinue de son côté de la route.
- id: 232
  category: signs_and_signals
  question: Quel signal manuel un conducteur doit-il utiliser pour indiquer qu'il
    ralentit ou qu'il s'arrête ?
  choices:
    A: Bras gauche tendu horizontalement par la fenêtre
    B: Bras gauche sorti et plié vers le haut au niveau du coude
    C: Bras gauche sorti et plié vers le bas au niveau du coude
    D: Bras droit faisant signe par la fenêtre
  answer: C
  explanation: Pour signaler un arrêt ou une diminution de la vitesse à l'aide de
    signaux manuels, le conducteur doit tendre le bras gauche vers l'extérieur et
    le plier vers le bas au niveau du coude.
- id: 233
  category: signs_and_signals
  question: 'Un panneau avec un losange blanc sur fond noir indique :'
  choices:
    A: Un itinéraire pour marchandises dangereuses
    B: Une voie réservée à certains véhicules comme les autobus ou le covoiturage
    C: Une zone de travaux à venir
    D: Une impasse
  answer: B
  explanation: En Alberta, un symbole de losange sur un panneau ou sur la chaussée
    indique une voie réservée à certains types de véhicules, tels que les autobus,
    les taxis ou les véhicules multioccupants (VMO/HOV).
- id: 234
  category: signs_and_signals
  question: Selon la loi de l'Alberta, où les demi-tours ne sont-ils PAS autorisés
    ?
  choices:
    A: Dans un virage
    B: À une intersection contrôlée par des feux de circulation
    C: Près du sommet d'une côte où la visibilité est inférieure à 150 mètres
    D: Toutes les réponses ci-dessus
  answer: D
  explanation: En Alberta, les demi-tours sont interdits aux intersections munies
    de feux de circulation, dans les virages et près du sommet d'une côte où la visibilité
    est réduite.
- id: 235
  category: signs_and_signals
  question: Que indique un panneau en forme de pentagone de couleur jaune-vert fluorescent
    ?
  choices:
    A: Une zone de jeux
    B: Une zone scolaire ou un passage pour écoliers
    C: Une zone de construction
    D: Un passage pour piétons
  answer: B
  explanation: Un panneau en forme de pentagone avec un fond jaune-vert fluorescent
    est utilisé pour avertir les conducteurs qu'ils se trouvent dans une zone scolaire
    ou un passage pour écoliers, ou qu'ils s'en approchent.
- id: 236
  category: signs_and_signals
  question: Laquelle des propositions suivantes décrit une « voie de virage centrale
    partagée » ?
  choices:
    A: Une voie utilisée pour dépasser les véhicules lents
    B: Une voie réservée uniquement aux véhicules d'urgence
    C: Une voie au centre d'une rue à double sens utilisée par les véhicules circulant
      dans l'une ou l'autre direction pour tourner à gauche
    D: Une voie utilisée uniquement pour les demi-tours
  answer: C
  explanation: Une voie de virage centrale partagée est située au milieu d'une rue
    à double sens et est utilisée par les conducteurs des deux directions pour tourner
    à gauche dans des entrées privées ou des intersections.
- id: 237
  category: signs_and_signals
  question: Quelle est la signification d'un panneau représentant un cercle rouge
    avec une barre horizontale blanche à l'intérieur ?
  choices:
    A: Sens interdit
    B: Stationnement interdit
    C: Défense de dépasser
    D: Arrêt à venir
  answer: A
  explanation: Un cercle rouge avec une barre horizontale blanche est le panneau de
    « sens interdit », indiquant que les véhicules ne sont pas autorisés à s'engager
    sur la route ou dans la zone où le panneau est installé.
