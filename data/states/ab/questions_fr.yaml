questions:
- id: 1
  category: license_system
  question: En Alberta, quel est l'âge minimum requis pour demander un permis d'apprenti
    conducteur de classe 7 ?
  choices:
    A: 14 ans
    B: 15 ans
    C: 16 ans
    D: 18 ans
  answer: A
  explanation: Selon le Guide du conducteur de l'Alberta, une personne doit être âgée
    d'au moins 14 ans pour demander un permis d'apprenti conducteur de classe 7.
- id: 2
  category: license_system
  question: Une personne titulaire d'un permis d'apprenti conducteur de classe 7 doit
    être accompagnée d'un superviseur âgé d'au moins 18 ans et titulaire de quelle
    classe de permis ?
  choices:
    A: Un permis de classe 7 valide
    B: Un permis de classe 5-GDL valide
    C: Un permis de classe 5 valide non-GDL (ou supérieur)
    D: Tout permis de conduire valide
  answer: C
  explanation: Le superviseur doit être âgé d'au moins 18 ans et détenir un permis
    de classe 5 complet (non-GDL) ou supérieur. Un conducteur titulaire d'un permis
    de classe 5-GDL n'est pas autorisé à superviser un apprenti.
- id: 3
  category: license_system
  question: Dans le cadre du programme de permis de conduire progressif (GDL) de l'Alberta,
    combien de points d'inaptitude entraînent une suspension de permis pour un conducteur
    GDL ?
  choices:
    A: 5 points
    B: 8 points
    C: 12 points
    D: 15 points
  answer: B
  explanation: Les conducteurs du programme GDL (classe 7 ou classe 5-GDL) sont suspendus
    lorsqu'ils accumulent 8 points d'inaptitude ou plus sur une période de deux ans.
- id: 4
  category: license_system
  question: Quelle est la limite d'alcoolémie (BAC) pour un conducteur titulaire d'un
    permis de classe 7 ou de classe 5-GDL en Alberta ?
  choices:
    A: 0,00 % (Tolérance zéro)
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: L'Alberta applique une politique de tolérance zéro pour l'alcool et
    les drogues pour tous les conducteurs GDL. Toute quantité d'alcool dans le sang
    entraînera une suspension immédiate et la saisie du véhicule.
- id: 5
  category: license_system
  question: Entre quelles heures est-il interdit de conduire pour un titulaire de
    permis d'apprenti conducteur de classe 7 en Alberta ?
  choices:
    A: De 22 h 00 à 6 h 00
    B: De 23 h 00 à 7 h 00
    C: De minuit à 5 h 00
    D: De minuit à 6 h 00
  answer: C
  explanation: Les titulaires d'un permis de classe 7 ont l'interdiction de conduire
    entre minuit et 5 h 00 du matin.
- id: 6
  category: license_system
  question: Pour quitter le programme GDL et obtenir un permis de classe 5 complet,
    un conducteur doit avoir été sans suspension pendant combien de mois précédant
    immédiatement la demande ?
  choices:
    A: 6 mois
    B: 12 mois
    C: 18 mois
    D: 24 mois
  answer: B
  explanation: Pour quitter le programme GDL, un conducteur doit être en période de
    probation (classe 5-GDL) pendant au moins 24 mois et n'avoir subi aucune suspension
    au cours des 12 derniers mois.
- id: 7
  category: license_system
  question: Pendant combien de temps une personne doit-elle détenir un permis d'apprenti
    conducteur de classe 7 avant d'être admissible à l'examen de conduite de base
    pour un permis de classe 5-GDL ?
  choices:
    A: 6 mois
    B: 9 mois
    C: 1 an
    D: 2 ans
  answer: C
  explanation: Une personne doit détenir un permis de classe 7 pendant au moins une
    année continue avant de pouvoir passer l'examen de conduite pour passer au niveau
    de la classe 5-GDL.
- id: 8
  category: license_system
  question: Si vous déménagez en Alberta en provenance d'une autre province, de combien
    de jours disposez-vous pour immatriculer votre véhicule et obtenir un permis de
    conduire de l'Alberta ?
  choices:
    A: 14 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: D
  explanation: Les nouveaux résidents de l'Alberta doivent échanger leur permis précédent
    contre un permis de conduire de l'Alberta et immatriculer leur véhicule dans les
    90 jours suivant leur installation dans la province.
- id: 9
  category: license_system
  question: Quel est le nombre maximum de passagers autorisés dans un véhicule conduit
    par un conducteur de classe 5-GDL ?
  choices:
    A: Deux passagers
    B: Trois passagers
    C: Limité uniquement par le nombre de ceintures de sécurité fonctionnelles
    D: Aucun passager autorisé
  answer: C
  explanation: En Alberta, le nombre de passagers pour un conducteur de classe 5-GDL
    est limité uniquement par le nombre de ceintures de sécurité fonctionnelles dans
    le véhicule.
- id: 10
  category: license_system
  question: Laquelle des conditions suivantes n'est PAS requise pour obtenir un permis
    de conduire de l'Alberta ?
  choices:
    A: Être résident de l'Alberta
    B: Fournir une preuve de citoyenneté canadienne ou de présence légale
    C: Posséder un véhicule à moteur immatriculé
    D: Fournir une preuve d'identité et de résidence
  answer: C
  explanation: Bien que vous deviez fournir une preuve de résidence, d'identité et
    de présence légale, vous n'avez pas besoin de posséder un véhicule pour obtenir
    un permis de conduire.
- id: 11
  category: license_system
  question: Si vous changez de nom ou d'adresse, vous devez en informer les bureaux
    d'enregistrement de l'Alberta (Alberta Registries) dans un délai de combien de
    jours ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 30 jours
    D: 60 jours
  answer: B
  explanation: La loi de l'Alberta exige que vous informiez un agent d'enregistrement
    de tout changement de nom ou d'adresse dans un délai de 14 jours.
- id: 12
  category: license_system
  question: Pour un conducteur titulaire d'un permis complet (non-GDL) en Alberta,
    à partir de quel total de points d'inaptitude le permis est-il suspendu ?
  choices:
    A: 8 points
    B: 10 points
    C: 15 points
    D: 20 points
  answer: C
  explanation: Les conducteurs titulaires d'un permis complet (non-GDL) voient leur
    permis suspendu lorsqu'ils accumulent 15 points d'inaptitude ou plus sur une période
    de deux ans.
- id: 13
  category: license_system
  question: Quelle classe de permis est requise en Alberta pour conduire une motocyclette
    ?
  choices:
    A: Classe 4
    B: Classe 5
    C: Classe 6
    D: Classe 7
  answer: C
  explanation: Un permis de classe 6 est requis pour conduire une motocyclette en
    Alberta. Si un conducteur possède déjà une classe 5, il doit réussir un examen
    théorique et un examen pratique de conduite de motocyclette pour ajouter la mention
    de classe 6.
- id: 14
  category: license_system
  question: Quels documents un conducteur doit-il être en mesure de présenter à la
    demande d'un agent de police ?
  choices:
    A: Permis de conduire et certificat de naissance
    B: Permis de conduire, certificat d'immatriculation du véhicule et preuve d'assurance
      valide
    C: Certificat d'immatriculation et acte de vente
    D: Permis de conduire et contrat d'achat du véhicule
  answer: B
  explanation: En vertu de la loi sur la sécurité routière (Traffic Safety Act), les
    conducteurs doivent avoir sur eux et présenter un permis de conduire valide, le
    certificat d'immatriculation du véhicule et des cartes de responsabilité financière
    valides (carte rose d'assurance).
- id: 15
  category: license_system
  question: Parmi les activités suivantes, laquelle est interdite à un conducteur
    de classe 5-GDL alors qu'elle est autorisée pour un conducteur de classe 5 complet
    ?
  choices:
    A: Conduire sur les autoroutes provinciales
    B: Conduire la nuit
    C: Agir en tant que superviseur pour un apprenti conducteur de classe 7
    D: Remorquer une remorque
  answer: C
  explanation: Un conducteur de classe 5-GDL ne peut pas agir en tant que superviseur
    accompagnateur pour une personne titulaire d'un permis d'apprenti conducteur de
    classe 7.
- id: 16
  category: license_system
  question: En Alberta, quelle est la durée de la période de suspension du permis
    pour une première accumulation de points d'inaptitude ?
  choices:
    A: 14 jours
    B: 1 mois
    C: 3 mois
    D: 6 mois
  answer: B
  explanation: En Alberta, lorsqu'un conducteur accumule le nombre maximal de points
    d'inaptitude autorisés pour la première fois sur une période de deux ans, son
    permis est suspendu pendant 1 mois.
- id: 17
  category: license_system
  question: Quel est l'âge minimum requis pour demander un permis de conduire de classe
    4 en Alberta, lequel permet de conduire un taxi ou une ambulance ?
  choices:
    A: 16 ans
    B: 18 ans
    C: 21 ans
    D: 25 ans
  answer: B
  explanation: Pour obtenir un permis de classe 4 en Alberta pour la conduite professionnelle
    (taxis, ambulances, petits autobus), le demandeur doit être âgé d'au moins 18
    ans.
- id: 18
  category: license_system
  question: Si un conducteur de l'Alberta suit un cours de conduite préventive approuvé
    avant d'atteindre la limite de points d'inaptitude, combien de points peuvent
    être retirés de son dossier de conduite ?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 7 points
  answer: B
  explanation: Les conducteurs de l'Alberta peuvent obtenir une réduction de 3 points
    sur leur dossier de conduite en réussissant un cours de conduite préventive approuvé
    une fois tous les deux ans.
- id: 19
  category: license_system
  question: Pour les conducteurs titulaires d'un permis de classe 1, 2 ou 4 en Alberta,
    à quelle fréquence un rapport médical doit-il être soumis si le conducteur a moins
    de 45 ans ?
  choices:
    A: Tous les ans
    B: Tous les 2 ans
    C: Tous les 5 ans
    D: Tous les 10 ans
  answer: C
  explanation: Les conducteurs commerciaux (classes 1, 2 et 4) en Alberta doivent
    soumettre un rapport médical tous les 5 ans jusqu'à l'âge de 45 ans, tous les
    2 ans jusqu'à l'âge de 65 ans, et chaque année par la suite.
- id: 20
  category: license_system
  question: Selon la loi de l'Alberta, le titulaire d'un permis d'apprenti conducteur
    de classe 7 est autorisé à conduire un cyclomoteur (moped) à quelle condition
    ?
  choices:
    A: Il doit être accompagné d'un superviseur
    B: Il peut conduire un cyclomoteur de manière indépendante
    C: Il ne peut conduire que pendant les heures de clarté
    D: Il n'est pas autorisé à conduire un cyclomoteur
  answer: B
  explanation: En Alberta, un permis d'apprenti conducteur de classe 7 permet à son
    titulaire de conduire un cyclomoteur de manière indépendante, à condition d'être
    âgé d'au moins 14 ans.
- id: 21
  category: license_system
  question: Quel code de mention est requis sur un permis de conduire de l'Alberta
    pour conduire un véhicule équipé de freins à air ?
  choices:
    A: Mention A
    B: Mention S
    C: Mention Q
    D: Mention Z
  answer: C
  explanation: La mention « Q » est requise en Alberta pour tout conducteur utilisant
    un véhicule équipé d'un système de freins à air.
- id: 22
  category: license_system
  question: En Alberta, les personnes de moins de quel âge doivent avoir le consentement
    d'un parent ou d'un tuteur pour demander un premier permis de conduire ?
  choices:
    A: 16 ans
    B: 17 ans
    C: 18 ans
    D: 19 ans
  answer: C
  explanation: Les demandeurs de moins de 18 ans en Alberta doivent faire signer un
    formulaire de consentement par un parent ou un tuteur légal avant de pouvoir obtenir
    un permis.
- id: 23
  category: license_system
  question: Un permis de conduire de classe 3 en Alberta permet à son titulaire de
    conduire lequel des véhicules suivants ?
  choices:
    A: Un véhicule avec seulement 2 essieux
    B: Un véhicule simple avec 3 essieux ou plus
    C: Tout autobus conçu pour transporter plus de 15 passagers
    D: Une motocyclette
  answer: B
  explanation: Un permis de classe 3 en Alberta permet de conduire un véhicule simple
    à trois essieux ou plus, ou un véhicule simple à trois essieux ou plus remorquant
    une remorque à un ou plusieurs essieux (si la remorque n'est pas équipée de freins
    à air).
- id: 24
  category: license_system
  question: Lorsqu'un apprenti conducteur de classe 7 s'exerce à la conduite, où le
    conducteur superviseur doit-il être assis ?
  choices:
    A: N'importe où dans le véhicule
    B: Sur le siège directement derrière le conducteur
    C: Sur le siège passager avant
    D: Sur le siège arrière côté passager
  answer: C
  explanation: Le superviseur d'un apprenti de classe 7 doit être assis sur le siège
    passager avant du véhicule pour pouvoir fournir une assistance et des instructions
    immédiates.
- id: 25
  category: license_system
  question: Si vous échouez à l'examen théorique de conduite de l'Alberta, combien
    de temps devez-vous attendre avant de pouvoir repasser l'examen ?
  choices:
    A: 1 heure
    B: 12 heures
    C: 24 heures
    D: 7 jours
  answer: C
  explanation: Les règles des bureaux d'enregistrement de l'Alberta exigent une période
    d'attente de 24 heures avant qu'un candidat puisse repasser un examen théorique
    échoué.
- id: 26
  category: license_system
  question: Quel est l'âge minimum requis pour obtenir un permis de conduire de classe
    3 en Alberta ?
  choices:
    A: 16 ans
    B: 18 ans
    C: 19 ans
    D: 21 ans
  answer: B
  explanation: L'âge minimum pour demander un permis de classe 3 (camions lourds à
    3 essieux ou plus) en Alberta est de 18 ans.
- id: 27
  category: license_system
  question: Sur un permis de conduire de l'Alberta, que signifie le « code de condition
    A » ?
  choices:
    A: Transmission automatique seulement
    B: Conduite de jour seulement
    C: Lentilles correctrices requises
    D: Commandes manuelles requises
  answer: C
  explanation: Le code de condition A sur un permis de l'Alberta indique que le conducteur
    est tenu de porter des lentilles correctrices (lunettes ou verres de contact)
    lorsqu'il conduit un véhicule à moteur.
- id: 28
  category: license_system
  question: 'Si votre permis de conduire de l''Alberta est perdu ou volé, vous devez
    immédiatement :'
  choices:
    A: Attendre 30 jours pour voir s'il est retourné
    B: Demander un nouveau permis auprès d'un agent d'enregistrement
    C: Écrire une lettre au ministre des Transports
    D: Continuer à conduire en utilisant votre passeport comme substitut
  answer: B
  explanation: Si un permis est perdu ou volé, le conducteur doit immédiatement demander
    un remplacement auprès d'un bureau d'agent d'enregistrement pour rester légalement
    autorisé à conduire.
- id: 29
  category: license_system
  question: 'En Alberta, une personne qui est étudiante à temps plein provenant d''une
    autre province est :'
  choices:
    A: Tenue d'obtenir un permis de l'Alberta dans les 90 jours
    B: Exempte de l'obligation de détenir un permis de l'Alberta si elle possède un
      permis valide de sa province d'origine
    C: Tenue d'obtenir un permis de l'Alberta dans les 30 jours
    D: Autorisée à conduire uniquement les fins de semaine
  answer: B
  explanation: Les étudiants à temps plein fréquentant un établissement d'enseignement
    agréé de l'Alberta sont exemptés de l'obligation d'obtenir un permis de conduire
    de l'Alberta, à condition de détenir un permis valide de leur province ou pays
    d'origine.
- id: 30
  category: driver_testing
  question: Pour réussir l'examen théorique de classe 7 de l'Alberta, un candidat
    doit répondre correctement à au moins combien de questions sur 30 ?
  choices:
    A: '20'
    B: '22'
    C: '25'
    D: '28'
  answer: C
  explanation: L'examen théorique de l'Alberta se compose de 30 questions à choix
    multiples, et un score minimum de 25 est requis pour réussir.
- id: 31
  category: driver_testing
  question: Lors d'un examen de conduite en Alberta, laquelle des conditions suivantes
    du véhicule entraînerait le refus de l'examinateur de mener l'examen ?
  choices:
    A: Le véhicule n'a pas de radio
    B: Le véhicule a une petite bosse sur le pare-chocs arrière
    C: Les feux de freinage ou les clignotants du véhicule ne fonctionnent pas
    D: L'intérieur du véhicule n'a pas été aspiré
  answer: C
  explanation: Le véhicule fourni pour un examen de conduite doit être en bon état
    de fonctionnement sécuritaire. Des feux de freinage ou des clignotants non fonctionnels,
    ou un pare-brise fissuré qui obstruerait la vue, sont des motifs d'annulation
    de l'examen.
- id: 32
  category: driver_testing
  question: Laquelle des actions suivantes entraînera un « échec automatique » immédiat
    lors d'un examen de conduite en Alberta ?
  choices:
    A: Oublier d'utiliser un clignotant une seule fois
    B: Conduire à 2 km/h sous la limite de vitesse
    C: Commettre une infraction au code de la route, comme ne pas s'arrêter à un feu
      rouge
    D: Prendre plus de trois manœuvres pour effectuer un stationnement en parallèle
  answer: C
  explanation: Commettre toute infraction au code de la route, comme brûler un feu
    rouge ou un panneau d'arrêt, ou effectuer une action dangereuse nécessitant l'intervention
    de l'examinateur, entraîne un échec immédiat.
- id: 33
  category: driver_testing
  question: En Alberta, quel est le montant minimum de la couverture d'assurance responsabilité
    civile requis pour immatriculer un véhicule ?
  choices:
    A: 50 000 $
    B: 100 000 $
    C: 200 000 $
    D: 500 000 $
  answer: C
  explanation: La loi de l'Alberta exige que tous les véhicules immatriculés détiennent
    une assurance responsabilité civile d'un montant minimum de 200 000 $.
- id: 34
  category: driver_testing
  question: Si un permis de conduire est expiré depuis plus de ____ ans, la personne
    doit réussir un examen théorique et un examen de conduite avant qu'un nouveau
    permis ne soit délivré.
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: C
  explanation: En Alberta, si votre permis est expiré depuis plus de trois ans, vous
    êtes considéré comme un nouveau conducteur et devez réussir les examens théorique
    et pratique.
- id: 35
  category: driver_testing
  question: Qui est légalement responsable de signaler à Alberta Transportation un
    problème de santé susceptible d'affecter sa capacité à conduire ?
  choices:
    A: La compagnie d'assurance du conducteur
    B: L'employeur du conducteur
    C: Le conducteur lui-même
    D: Uniquement le médecin du conducteur
  answer: C
  explanation: Bien que les médecins soient tenus de signaler certaines conditions,
    le conducteur est légalement responsable de signaler tout problème de santé qui
    pourrait nuire à la conduite sécuritaire d'un véhicule à moteur.
- id: 36
  category: driver_testing
  question: Combien de points d'inaptitude sont inscrits au dossier d'un conducteur
    de l'Alberta pour une condamnation pour conduite distraite ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: En Alberta, une condamnation pour conduite distraite entraîne une amende
    importante et l'ajout de 3 points d'inaptitude au dossier du conducteur.
- id: 37
  category: driver_testing
  question: Lors d'un examen de conduite de classe 6 (moto), quel équipement spécifique
    le candidat doit-il fournir ?
  choices:
    A: Un blouson de cuir
    B: Un casque de sécurité pour moto homologué et une protection oculaire
    C: Des bottes à embout d'acier
    D: Un passager pour servir de lest
  answer: B
  explanation: Pour un examen de conduite de classe 6, le candidat doit fournir une
    moto en bon état de fonctionnement et porter un casque de sécurité pour moto homologué
    ainsi qu'une protection oculaire.
- id: 38
  category: driver_testing
  question: Lors d'un examen de conduite en Alberta, qui est autorisé à se trouver
    dans le véhicule en plus du conducteur et de l'examinateur ?
  choices:
    A: Un parent ou tuteur si le conducteur a moins de 18 ans
    B: Un traducteur
    C: Personne, sauf s'il s'agit d'un représentant gouvernemental autorisé observant
      l'examinateur
    D: Le moniteur de conduite du conducteur
  answer: C
  explanation: Pour garantir la sécurité et éviter les distractions, seuls le conducteur
    et l'examinateur sont autorisés dans le véhicule, à l'exception du personnel gouvernemental
    autorisé effectuant un audit.
- id: 39
  category: driver_testing
  question: Que se passe-t-il si un conducteur accumule de 8 à 14 points d'inaptitude
    en Alberta (pour un conducteur titulaire d'un permis complet) ?
  choices:
    A: Le permis est automatiquement suspendu
    B: Le conducteur reçoit un avis de courtoisie par la poste
    C: Le conducteur doit assister à une audience obligatoire
    D: L'assurance du conducteur est automatiquement annulée
  answer: B
  explanation: Pour les conducteurs titulaires d'un permis complet, lorsqu'ils accumulent
    de 8 à 14 points, un avis de courtoisie leur est envoyé par la poste. La suspension
    intervient à 15 points.
- id: 40
  category: driver_testing
  question: Si vous devez passer un examen de conduite pour un permis de classe 5-GDL,
    quelle est la durée approximative de l'examen de conduite « de base » ?
  choices:
    A: 15 minutes
    B: 30 minutes
    C: 60 minutes
    D: 90 minutes
  answer: B
  explanation: L'examen de conduite de base de classe 5 en Alberta dure généralement
    environ 30 minutes.
- id: 41
  category: driver_testing
  question: Pour satisfaire aux normes de vision minimales pour un permis de classe
    5 en Alberta, quelle doit être votre vision dans votre meilleur œil (avec ou sans
    lentilles correctrices) ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: En Alberta, l'exigence de vision minimale pour un permis de classe
    5 est de 20/40 dans le meilleur œil, avec ou sans lentilles correctrices.
- id: 42
  category: driver_testing
  question: L'examen théorique de classe 7 de l'Alberta se compose de 30 questions
    à choix multiples. Quel est le nombre minimal de bonnes réponses requis pour réussir
    ?
  choices:
    A: '20'
    B: '22'
    C: '25'
    D: '28'
  answer: C
  explanation: Pour réussir l'examen théorique de l'Alberta, vous devez répondre correctement
    à au moins 25 questions sur 30.
- id: 43
  category: driver_testing
  question: Si vous échouez à un examen de conduite en Alberta, quel est le délai
    minimal d'attente avant de pouvoir repasser l'examen ?
  choices:
    A: 24 heures
    B: 48 heures
    C: 7 jours
    D: 14 jours
  answer: A
  explanation: Selon les règles d'examen de conduite de l'Alberta, si vous échouez
    à un examen pratique, vous devez attendre au moins 24 heures avant de pouvoir
    tenter l'examen à nouveau.
- id: 44
  category: driver_testing
  question: À quel âge les conducteurs de l'Alberta sont-ils tenus pour la première
    fois de présenter un rapport médical d'un médecin pour renouveler leur permis
    de conduire ?
  choices:
    A: '65'
    B: '70'
    C: '75'
    D: '80'
  answer: C
  explanation: En Alberta, les conducteurs sont tenus de présenter un rapport médical
    à l'âge de 75 ans, à 80 ans, puis tous les deux ans par la suite.
- id: 45
  category: driver_testing
  question: Quelle classe de permis est requise en Alberta pour conduire un véhicule
    à trois essieux ou plus, comme un gros camion à benne basculante, à condition
    qu'il ne s'agisse pas d'un autobus ?
  choices:
    A: Classe 1
    B: Classe 2
    C: Classe 3
    D: Classe 4
  answer: C
  explanation: Un permis de classe 3 permet de conduire tout véhicule à moteur que
    le titulaire d'un permis de classe 5 peut conduire, plus un véhicule à moteur
    unique à trois essieux ou plus.
- id: 46
  category: driver_testing
  question: En Alberta, qu'est-ce que la mention « Code Q » sur un permis de conduire
    ?
  choices:
    A: Mention pour motocyclette
    B: Mention pour freins pneumatiques
    C: Mention pour autobus scolaire
    D: Mention pour remorque lourde
  answer: B
  explanation: La mention Code Q indique que le conducteur est certifié pour conduire
    des véhicules équipés de freins pneumatiques.
- id: 47
  category: driver_testing
  question: Depuis avril 2023, quelle est la condition principale pour qu'un conducteur
    GDL quitte le programme de permis de conduire progressif (GDL) et obtienne un
    permis complet de classe 5 ?
  choices:
    A: Réussir l'examen de conduite avancé
    B: Avoir terminé 24 mois de conduite probatoire sans suspension au cours des 12
      derniers mois
    C: Assister à un séminaire de sécurité obligatoire de 4 heures
    D: Payer des frais de sortie de 500 $
  answer: B
  explanation: Depuis le 1er avril 2023, l'examen de conduite avancé a été supprimé.
    Les conducteurs quittent désormais le programme GDL automatiquement s'ils ont
    terminé 24 mois de conduite probatoire et n'ont eu aucune suspension ou point
    d'inaptitude au cours des 12 derniers mois.
- id: 48
  category: driver_testing
  question: Lors d'un examen de conduite en Alberta, qui est responsable de fournir
    le véhicule ?
  choices:
    A: Le gouvernement de l'Alberta
    B: L'agent de registre
    C: L'examinateur de conduite
    D: La personne qui passe l'examen
  answer: D
  explanation: Le candidat est responsable de fournir pour l'examen de conduite un
    véhicule en bon état mécanique, doté d'une assurance et d'une immatriculation
    valides.
- id: 49
  category: driver_testing
  question: Si vous apportez un véhicule en Alberta en provenance d'une autre province,
    il doit passer une inspection de véhicule hors province avant de pouvoir être
    immatriculé. Dans quel délai le véhicule doit-il être immatriculé après la fin
    de l'inspection ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 30 jours
    D: 60 jours
  answer: B
  explanation: Un certificat d'inspection de véhicule hors province est valide pendant
    14 jours à compter de la date de délivrance, et le véhicule doit être immatriculé
    dans ce délai.
- id: 50
  category: driver_testing
  question: Laquelle des situations suivantes est un motif valable pour qu'un examinateur
    refuse de faire passer un examen de conduite en Alberta ?
  choices:
    A: Le pare-brise du véhicule est fissuré d'une manière qui obstrue la vue du conducteur
    B: Le véhicule est à transmission manuelle
    C: Le véhicule a plus de 10 ans
    D: Le véhicule est équipé de pneus d'hiver en été
  answer: A
  explanation: Un véhicule doit être sécuritaire et respecter les normes d'équipement.
    Un pare-brise fissuré qui obstrue la vue du conducteur ou de l'examinateur est
    un motif valable pour refuser l'examen.
- id: 51
  category: driver_testing
  question: Si votre permis de conduire de l'Alberta est suspendu pour une infraction
    au Code criminel, que devez-vous faire avant que votre permis puisse être rétabli
    ?
  choices:
    A: Attendre 5 ans
    B: Payer des frais de rétablissement et suivre les programmes requis (comme Planning
      Ahead ou IMPACT)
    C: Écrire une lettre d'excuses au ministère des Transports
    D: Rien ; il est rétabli automatiquement après l'expiration du délai
  answer: B
  explanation: Le rétablissement après une suspension liée au Code criminel nécessite
    le paiement de frais et souvent le suivi de programmes obligatoires comme « Planning
    Ahead » ou « IMPACT » (programmes sur la conduite avec facultés affaiblies).
- id: 52
  category: driver_responsibility
  question: En Alberta, quel est le montant minimum des dommages matériels qui oblige
    à signaler une collision à la police ?
  choices:
    A: 1 000 $
    B: 2 000 $
    C: 5 000 $
    D: 10 000 $
  answer: C
  explanation: Depuis le 1er janvier 2024, les collisions en Alberta doivent être
    signalées à la police si les dommages matériels combinés à tous les véhicules
    et biens dépassent 5 000 $, ou s'il y a des blessés ou des décès.
- id: 53
  category: driver_responsibility
  question: En Alberta, quelle est l'amende minimale pour une première condamnation
    pour conduite d'un véhicule non assuré ?
  choices:
    A: 500 $
    B: 1 250 $
    C: 2 875 $
    D: 5 000 $
  answer: C
  explanation: L'amende minimale pour conduite sans assurance en Alberta est de 2
    875 $ (incluant la suramende compensatoire pour les victimes) pour une première
    infraction. Le non-paiement peut entraîner une peine d'emprisonnement.
- id: 54
  category: driver_responsibility
  question: Combien de points d'inaptitude sont inscrits au dossier d'un conducteur
    de l'Alberta pour avoir omis de rester sur les lieux d'un accident ?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 10 points
  answer: C
  explanation: Le délit de fuite (omission de rester sur les lieux d'un accident)
    est une infraction grave en Alberta et entraîne une pénalité de 7 points d'inaptitude.
- id: 55
  category: driver_responsibility
  question: Lorsque vous vendez un véhicule en Alberta, que devez-vous faire des plaques
    d'immatriculation ?
  choices:
    A: Les laisser sur le véhicule pour le nouveau propriétaire.
    B: Les rapporter à un agent d'immatriculation ou les conserver pour votre prochain
      véhicule.
    C: Les détruire immédiatement.
    D: Les remettre à la police.
  answer: B
  explanation: En Alberta, les plaques d'immatriculation sont enregistrées au nom
    du propriétaire, et non du véhicule. Lorsqu'un véhicule est vendu, le vendeur
    doit retirer les plaques et peut soit les transférer sur un nouveau véhicule,
    soit les rapporter à un agent d'immatriculation.
- id: 56
  category: driver_responsibility
  question: Si vous êtes impliqué dans une collision avec un véhicule sans occupant
    et que vous ne parvenez pas à localiser le propriétaire, quelle est votre responsabilité
    légale en Alberta ?
  choices:
    A: Quitter les lieux si les dommages semblent mineurs.
    B: Attendre 30 minutes, puis partir si personne ne se présente.
    C: Laisser un avis écrit avec votre nom, votre adresse et votre numéro de permis
      sur le véhicule.
    D: Ne le signaler que si les dommages dépassent 5 000 $.
  answer: C
  explanation: La loi de l'Alberta exige que si vous heurtez un véhicule sans occupant,
    vous devez laisser un avis écrit contenant vos coordonnées et votre numéro de
    permis de conduire.
- id: 57
  category: driver_responsibility
  question: En dépassant un véhicule d'urgence ou une dépanneuse arrêté sur le bord
    de la route avec ses gyrophares allumés, quelle est la vitesse maximale autorisée
    en Alberta si la limite affichée est de 100 km/h ?
  choices:
    A: 50 km/h
    B: 60 km/h
    C: 80 km/h
    D: La limite de vitesse affichée.
  answer: B
  explanation: En Alberta, vous devez ralentir à 60 km/h (ou à la limite de vitesse
    affichée, selon la plus basse des deux) lorsque vous dépassez des véhicules d'urgence
    ou des dépanneuses arrêtés sur le bord de la route avec leurs gyrophares allumés.
- id: 58
  category: driver_responsibility
  question: Si vous achetez un véhicule à un vendeur particulier, de combien de jours
    disposez-vous pour transférer l'immatriculation à votre nom tout en utilisant
    votre plaque d'immatriculation valide existante ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 21 jours
    D: 30 jours
  answer: B
  explanation: En Alberta, vous pouvez utiliser votre plaque d'immatriculation valide
    existante sur un véhicule nouvellement acheté pendant un maximum de 14 jours à
    compter de la date figurant sur l'acte de vente, à condition d'avoir sur vous
    l'acte de vente et une preuve d'assurance pour le nouveau véhicule.
- id: 59
  category: driver_responsibility
  question: Laquelle des conditions suivantes est obligatoire pour un acte de vente
    (Bill of Sale) en Alberta ?
  choices:
    A: Le numéro de police d'assurance de l'acheteur.
    B: La signature d'un témoin ou d'un notaire.
    C: Le numéro d'identification du véhicule (NIV/VIN), la date de vente et les signatures
      de l'acheteur et du vendeur.
    D: Le numéro de permis de conduire de l'acheteur.
  answer: C
  explanation: Un acte de vente valide en Alberta doit inclure le NIV (VIN), la date
    de la vente, le prix d'achat, ainsi que les noms et signatures de l'acheteur et
    du vendeur.
- id: 60
  category: driver_responsibility
  question: En Alberta, un « autocollant de dommage » est requis avant qu'un véhicule
    puisse être réparé s'il a été impliqué dans une collision devant être signalée.
    Qui délivre cet autocollant ?
  choices:
    A: La compagnie d'assurance
    B: L'atelier de carrosserie
    C: La police
    D: Alberta Registries (Services d'immatriculation)
  answer: C
  explanation: La police délivre un autocollant de dommage pour prouver que la collision
    a été signalée. En Alberta, il est interdit aux ateliers de carrosserie de réparer
    des dommages dépassant 5 000 $ sans cet autocollant.
- id: 61
  category: driver_responsibility
  question: Si un conducteur de l'Alberta est impliqué dans une collision avec un
    animal domestique (par exemple, un cheval ou une vache), que doit-il faire si
    le propriétaire ne peut être trouvé ?
  choices:
    A: Quitter les lieux immédiatement.
    B: Signaler la collision à la police.
    C: Appeler uniquement la SPCA locale.
    D: Aucune action n'est requise si l'animal n'est pas blessé.
  answer: B
  explanation: Si vous frappez un animal domestique et que vous ne trouvez pas le
    propriétaire, vous devez signaler l'accident à la police.
- id: 62
  category: driver_responsibility
  question: En Alberta, l'immatriculation des véhicules expire annuellement. Comment
    le mois d'expiration est-il déterminé pour un particulier ?
  choices:
    A: Le mois de l'anniversaire du propriétaire.
    B: Le mois où le véhicule a été acheté.
    C: Selon la première lettre du nom de famille du propriétaire.
    D: Le 31 décembre pour tous les résidents.
  answer: C
  explanation: L'Alberta utilise un système d'immatriculation échelonné où le mois
    d'expiration est déterminé par la première lettre du nom de famille du titulaire.
- id: 63
  category: driver_responsibility
  question: Qu'arrive-t-il à votre permis de conduire si vous ne respectez pas un
    jugement légal rendu contre vous pour des dommages résultant d'un accident de
    véhicule à moteur ?
  choices:
    A: Rien, tant que vous avez une assurance.
    B: Votre permis sera suspendu jusqu'à ce que le jugement soit payé.
    C: Vous devrez repasser votre examen de conduite.
    D: Vous recevrez une amende de 500 $, mais vous conserverez votre permis.
  answer: B
  explanation: En vertu de la loi sur la sécurité routière (Traffic Safety Act), si
    vous ne payez pas un jugement pour des dommages causés par un véhicule à moteur,
    votre permis de conduire et l'immatriculation de votre véhicule seront suspendus
    jusqu'à ce que la dette soit acquittée.
- id: 64
  category: driver_responsibility
  question: Lors d'une demande de permis de conduire en Alberta, que doit fournir
    une personne de moins de 18 ans ?
  choices:
    A: Une lettre du directeur de son école.
    B: Une preuve d'emploi.
    C: Le consentement d'un parent ou d'un tuteur légal.
    D: Un dépôt de garantie de 500 $.
  answer: C
  explanation: Les demandeurs de moins de 18 ans doivent obtenir le consentement d'un
    parent ou d'un tuteur pour demander un premier permis de conduire ou pour renouveler
    un permis en Alberta.
- id: 65
  category: driver_responsibility
  question: 'En Alberta, vous devez signaler immédiatement une collision à la police
    si les dommages totaux à tous les véhicules et à la propriété semblent s''élever
    à plus de :'
  choices:
    A: 1 000 $
    B: 2 000 $
    C: 5 000 $
    D: 10 000 $
  answer: C
  explanation: Depuis le 1er septembre 2024, le seuil de déclaration des dommages
    matériels en Alberta est passé de 2 000 $ à 5 000 $. Toute collision impliquant
    des blessures, un décès ou des dommages dépassant 5 000 $ doit être signalée à
    la police.
- id: 66
  category: driver_responsibility
  question: 'Si vous êtes reconnu coupable de conduite d''un véhicule à moteur sans
    assurance valide en Alberta, l''amende minimale pour une première infraction est
    d''environ :'
  choices:
    A: 500 $
    B: 1 500 $
    C: 2 875 $
    D: 5 000 $
  answer: C
  explanation: Conduire sans assurance est une infraction grave en Alberta. L'amende
    minimale pour une première infraction est de 2 875 $, et le non-paiement peut
    entraîner une peine d'emprisonnement.
- id: 67
  category: driver_responsibility
  question: Quel document n'est PAS requis à bord du véhicule lorsqu'il circule sur
    une route de l'Alberta ?
  choices:
    A: L'acte de vente du véhicule (Bill of Sale).
    B: Un certificat d'immatriculation valide.
    C: Une carte de responsabilité financière valide (carte rose).
    D: Un permis de conduire valide.
  answer: A
  explanation: Bien qu'un acte de vente soit nécessaire pour immatriculer un véhicule,
    il n'est pas obligatoire de le conserver dans le véhicule une fois celui-ci immatriculé.
    Vous devez cependant avoir sur vous l'immatriculation, l'assurance (carte rose)
    et votre permis de conduire.
- id: 68
  category: driver_responsibility
  question: Quelle est la conséquence pour un conducteur de l'Alberta qui est pris
    à conduire alors que son permis est suspendu ?
  choices:
    A: Une amende obligatoire de 500 $ seulement.
    B: Le véhicule peut être saisi et mis en fourrière pendant 30 jours.
    C: Un avertissement verbal pour la première infraction.
    D: Le conducteur doit repasser l'examen théorique de l'apprenti conducteur.
  answer: B
  explanation: En vertu de la loi sur la sécurité routière (Traffic Safety Act), la
    conduite pendant une suspension entraîne la saisie et la mise en fourrière du
    véhicule pendant 30 jours, que le conducteur en soit le propriétaire ou non.
- id: 69
  category: driver_responsibility
  question: 'En Alberta, une « carte de responsabilité financière » est plus communément
    appelée :'
  choices:
    A: Une carte de crédit.
    B: Une carte rose.
    C: Un permis de conduire.
    D: Un certificat d'immatriculation de véhicule.
  answer: B
  explanation: La carte de responsabilité financière est le document de preuve d'assurance,
    qui est traditionnellement imprimé sur du papier rose en Alberta.
- id: 70
  category: driver_responsibility
  question: Si vous êtes impliqué dans une collision où quelqu'un est blessé, quelle
    est votre première responsabilité légale ?
  choices:
    A: Appeler votre compagnie d'assurance.
    B: Prendre des photos des dommages.
    C: Rester sur les lieux et porter une assistance raisonnable.
    D: Déplacer immédiatement les véhicules hors de la circulation.
  answer: C
  explanation: En vertu de la loi sur la sécurité routière de l'Alberta, les conducteurs
    impliqués dans une collision doivent rester sur les lieux et fournir une assistance
    raisonnable à toute personne blessée.
- id: 71
  category: driver_responsibility
  question: Lequel des éléments suivants doit figurer sur un acte de vente lors de
    l'achat d'un véhicule auprès d'un particulier en Alberta ?
  choices:
    A: Le numéro de police d'assurance de l'acheteur.
    B: Le numéro d'identification du véhicule (VIN).
    C: Le numéro de permis de conduire du vendeur.
    D: La date de naissance de l'acheteur.
  answer: B
  explanation: Un acte de vente valide en Alberta doit inclure la date de la vente,
    la description du véhicule (année, marque, modèle), le VIN et les signatures de
    l'acheteur et du vendeur.
- id: 72
  category: driver_responsibility
  question: Si un résident de l'Alberta apporte un véhicule d'une autre province,
    que doit-il faire avant de pouvoir l'immatriculer en Alberta ?
  choices:
    A: Un examen de conduite avec le véhicule.
    B: Une inspection de véhicule hors province.
    C: Une vérification de la couleur de la peinture.
    D: Rien ; toutes les immatriculations canadiennes sont automatiquement valides.
  answer: B
  explanation: Les véhicules provenant de l'extérieur de l'Alberta doivent généralement
    passer une inspection de véhicule hors province chez un mécanicien certifié avant
    de pouvoir être immatriculés en Alberta.
- id: 73
  category: driver_responsibility
  question: En Alberta, quelle est la sanction pour ne pas avoir présenté une carte
    d'assurance valide à un agent de police sur demande ?
  choices:
    A: Une amende et une saisie potentielle du véhicule.
    B: 3 points d'inaptitude.
    C: Une suspension obligatoire du permis de 24 heures.
    D: Il n'y a pas de sanction si vous la fournissez dans les 48 heures.
  answer: A
  explanation: Les conducteurs doivent être en mesure de présenter une preuve d'assurance
    valide lorsqu'un agent de la paix le demande. Le défaut de le faire peut entraîner
    une amende importante et le véhicule peut être remorqué ou saisi.
- id: 74
  category: safe_driving_rules
  question: En Alberta, sauf indication contraire, quelles sont les heures standard
    pour les zones scolaires les jours de classe ?
  choices:
    A: De 7 h 30 à 16 h 30
    B: De 8 h 00 à 17 h 00
    C: De 8 h 00 à 9 h 30, de 11 h 30 à 13 h 30 et de 15 h 00 à 16 h 30
    D: De 8 h 30 à une heure après le coucher du soleil
  answer: C
  explanation: Selon le Guide du conducteur de l'Alberta, les heures des zones scolaires
    sont de 8 h 00 à 9 h 30, de 11 h 30 à 13 h 30 et de 15 h 00 à 16 h 30 les jours
    de classe, à moins que les règlements municipaux ou la signalisation n'indiquent
    le contraire.
- id: 75
  category: safe_driving_rules
  question: Quelles sont les heures standard pour les zones de jeux en Alberta ?
  choices:
    A: De 8 h 00 à 20 h 00
    B: De 8 h 30 à une heure après le coucher du soleil
    C: De 7 h 00 à 22 h 00
    D: Du lever au coucher du soleil
  answer: B
  explanation: En Alberta, les zones de jeux sont en vigueur tous les jours de 8 h
    30 à une heure après le coucher du soleil.
- id: 76
  category: safe_driving_rules
  question: Selon la loi de l'Alberta, où un demi-tour est-il spécifiquement interdit
    ?
  choices:
    A: Sur une chaussée entre des intersections dans une zone résidentielle
    B: À une intersection contrôlée par des feux de circulation
    C: À une intersection avec un panneau d'arrêt
    D: Sur une route rurale à deux voies
  answer: B
  explanation: En Alberta, les demi-tours sont interdits aux intersections contrôlées
    par des feux de circulation, au milieu d'un pâté de maisons entre des intersections
    dans les zones urbaines, et là où un panneau l'interdit.
- id: 77
  category: safe_driving_rules
  question: En Alberta, à quelle distance d'une borne d'incendie devez-vous vous stationner
    ?
  choices:
    A: 2 mètres
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: C
  explanation: Vous ne devez pas vous stationner à moins de 5 mètres d'une borne d'incendie.
    Si la borne n'est pas située sur le trottoir, la distance est mesurée à partir
    du point sur le trottoir le plus proche de la borne.
- id: 78
  category: safe_driving_rules
  question: Lors d'un stationnement près d'un panneau d'arrêt ou d'un passage pour
    piétons marqué, quelle est la distance minimale requise que vous devez maintenir
    ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 6 mètres
    D: 8 mètres
  answer: B
  explanation: Les règlements de l'Alberta stipulent que vous ne devez pas vous stationner
    à moins de 5 mètres d'un panneau d'arrêt, d'un panneau de cédez le passage ou
    d'un passage pour piétons marqué.
- id: 79
  category: safe_driving_rules
  question: En Alberta, est-il légal de tourner à gauche au feu rouge ?
  choices:
    A: Non, ce n'est jamais légal
    B: Oui, d'une rue à double sens vers une rue à sens unique
    C: Oui, d'une rue à sens unique vers une autre rue à sens unique après un arrêt
      complet
    D: Oui, à n'importe quelle intersection s'il n'y a pas de circulation
  answer: C
  explanation: Un virage à gauche au feu rouge est autorisé en Alberta uniquement
    lors d'un virage d'une rue à sens unique vers une autre rue à sens unique, à condition
    que le conducteur s'immobilise complètement et cède le passage aux piétons et
    aux autres véhicules.
- id: 80
  category: safe_driving_rules
  question: Sauf indication contraire, quelle est la limite de vitesse sur une route
    provinciale principale située à l'extérieur d'une zone urbaine en Alberta ?
  choices:
    A: 80 km/h
    B: 90 km/h
    C: 100 km/h
    D: 110 km/h
  answer: C
  explanation: La limite de vitesse par défaut pour une route provinciale principale
    à l'extérieur d'une zone urbaine en Alberta est de 100 km/h, sauf si des panneaux
    indiquent le contraire.
- id: 81
  category: safe_driving_rules
  question: Quelle est la limite de vitesse par défaut dans une zone urbaine en Alberta,
    sauf indication contraire ?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 30 km/h
  answer: B
  explanation: La limite de vitesse standard dans une zone urbaine (villes, municipalités,
    villages) est de 50 km/h, à moins que des panneaux n'indiquent une limite différente.
- id: 82
  category: safe_driving_rules
  question: À l'approche d'une intersection non réglementée (sans panneaux ni signaux),
    que doit faire un conducteur ?
  choices:
    A: Maintenir sa vitesse et avancer avec prudence
    B: Céder le passage au véhicule situé à sa gauche
    C: Céder le passage au véhicule situé à sa droite
    D: Toujours marquer un arrêt complet
  answer: C
  explanation: À une intersection non réglementée en Alberta, vous devez céder le
    passage au véhicule situé à votre droite.
- id: 83
  category: safe_driving_rules
  question: Que signifie une ligne jaune continue de votre côté de la ligne médiane
    en Alberta ?
  choices:
    A: Le dépassement est autorisé si la sécurité le permet
    B: Le dépassement est interdit
    C: Vous êtes dans une zone à sens unique
    D: Vous devez tourner à gauche
  answer: B
  explanation: Une ligne jaune continue de votre côté de la ligne médiane indique
    que le dépassement est interdit.
- id: 84
  category: safe_driving_rules
  question: Lorsqu'un autobus scolaire est arrêté avec ses feux rouges clignotants
    et son bras d'arrêt déployé sur une route non divisée, à quelle distance devez-vous
    vous arrêter ?
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 20 mètres
  answer: D
  explanation: Sur une route non divisée, les conducteurs arrivant des deux directions
    doivent s'arrêter à au moins 20 mètres d'un autobus scolaire lorsque ses feux
    rouges clignotent et que le bras d'arrêt est sorti.
- id: 85
  category: safe_driving_rules
  question: Lors du stationnement d'un véhicule en montée sur une rue à double sens
    avec une bordure de trottoir, comment les roues avant doivent-elles être positionnées
    ?
  choices:
    A: Parallèles à la bordure
    B: Tournées vers la droite (vers la bordure)
    C: Tournées vers la gauche (vers le centre de la route)
    D: Cela n'a pas d'importance
  answer: C
  explanation: Lors d'un stationnement en montée avec une bordure, tournez les roues
    avant vers la gauche de sorte que si le véhicule recule, l'arrière du pneu frappe
    la bordure et arrête la voiture.
- id: 86
  category: safe_driving_rules
  question: En Alberta, quelle est la distance de sécurité recommandée derrière un
    autre véhicule dans des conditions de conduite normales ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 4 secondes
    D: La longueur d'une voiture pour chaque 10 km/h
  answer: B
  explanation: Le Guide du conducteur de l'Alberta recommande une distance de sécurité
    minimale de 2 secondes dans des conditions normales.
- id: 87
  category: safe_driving_rules
  question: En entrant dans un carrefour giratoire (rond-point) en Alberta, à qui
    devez-vous céder le passage ?
  choices:
    A: À la circulation entrant par la droite
    B: À la circulation déjà engagée dans le carrefour
    C: À personne, vous avez la priorité
    D: Uniquement aux piétons
  answer: B
  explanation: Les conducteurs entrant dans un carrefour giratoire doivent céder le
    passage aux véhicules qui circulent déjà dans le cercle.
- id: 88
  category: safe_driving_rules
  question: En Alberta, sauf indication contraire, quelle est la limite de vitesse
    dans une zone scolaire pendant les heures où elle est en vigueur ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: En Alberta, la limite de vitesse dans les zones scolaires est de 30
    km/h pendant les heures de 8h00 à 9h30, de 11h30 à 13h30 et de 15h00 à 16h30 les
    jours d'école, sauf indication contraire de la municipalité.
- id: 89
  category: safe_driving_rules
  question: En dépassant un véhicule d'urgence arrêté avec ses sirènes ou ses feux
    clignotants sur une autoroute où la limite de vitesse est de 100 km/h, quelle
    est la vitesse maximale autorisée dans la voie adjacente au véhicule ?
  choices:
    A: 50 km/h
    B: 60 km/h
    C: 80 km/h
    D: La limite de vitesse affichée
  answer: B
  explanation: En Alberta, vous devez ralentir à 60 km/h (or la limite de vitesse
    affichée, selon la plus basse des deux) lorsque vous dépassez des véhicules d'urgence
    ou des dépanneuses arrêtés sur le bord de la route avec leurs feux clignotants.
- id: 90
  category: safe_driving_rules
  question: Quelle est la distance minimale à laquelle vous devez vous stationner
    d'un panneau d'arrêt, d'un panneau de cédez le passage ou d'un passage pour piétons
    marqué ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 8 mètres
    D: 10 mètres
  answer: B
  explanation: Vous ne devez pas vous stationner à moins de 5 mètres d'un panneau
    d'arrêt, d'un panneau de cédez le passage ou d'un passage pour piétons marqué
    afin d'assurer la visibilité pour les autres conducteurs et les piétons.
- id: 91
  category: safe_driving_rules
  question: Dans quelle condition spécifique un virage à gauche au feu rouge est-il
    autorisé en Alberta ?
  choices:
    A: D'une rue à double sens vers une rue à sens unique
    B: D'une rue à sens unique vers une autre rue à sens unique
    C: À n'importe quelle intersection si aucun trafic n'arrive
    D: Ce n'est jamais autorisé
  answer: B
  explanation: En Alberta, vous pouvez tourner à gauche au feu rouge uniquement si
    vous passez d'une rue à sens unique à une autre rue à sens unique, après avoir
    marqué un arrêt complet et cédé le passage aux piétons et aux autres véhicules.
- id: 92
  category: safe_driving_rules
  question: En Alberta, les demi-tours sont strictement interdits dans lequel des
    endroits suivants ?
  choices:
    A: Dans une courbe ou près du sommet d'une colline où vous ne pouvez pas être
      vu par les autres conducteurs à moins de 150 mètres
    B: Sur n'importe quelle rue d'une zone résidentielle
    C: À toute intersection munie d'un arrêt obligatoire dans les quatre directions
    D: Sur une route de gravier
  answer: A
  explanation: Les demi-tours sont interdits dans une courbe ou sur une colline où
    la visibilité est inférieure à 150 mètres, aux intersections contrôlées par des
    feux de circulation (sauf si un panneau l'autorise) et là où un panneau l'interdit.
- id: 93
  category: safe_driving_rules
  question: En Alberta, quelle est la sanction pour une première condamnation pour
    conduite distraite ?
  choices:
    A: Amende de 172 $ et 2 points d'inaptitude
    B: Amende de 300 $ et 3 points d'inaptitude
    C: Amende de 600 $ et 3 points d'inaptitude
    D: Amende de 1 000 $ et 6 points d'inaptitude
  answer: B
  explanation: La conduite distraite en Alberta entraîne une amende de 300 $ et 3
    points d'inaptitude au dossier de conduite.
- id: 94
  category: safe_driving_rules
  question: Lorsque deux véhicules s'approchent d'une intersection en « T » non contrôlée
    en même temps, qui a la priorité ?
  choices:
    A: Le véhicule à droite
    B: Le véhicule à gauche
    C: Le véhicule sur la route qui se termine (l'impasse)
    D: Le véhicule sur la route transversale
  answer: A
  explanation: À toutes les intersections non contrôlées en Alberta, y compris les
    intersections en « T », le conducteur à gauche doit céder le passage au conducteur
    à sa droite.
- id: 95
  category: safe_driving_rules
  question: En Alberta, quelle est la règle concernant les cortèges funèbres aux intersections
    ?
  choices:
    A: Ils doivent respecter tous les feux de circulation et panneaux d'arrêt
    B: Vous pouvez couper le cortège si votre feu est vert
    C: Il est illégal d'interrompre ou de traverser un cortège funèbre
    D: Les cortèges ne sont autorisés que le dimanche
  answer: C
  explanation: En Alberta, il est illégal de couper ou d'interférer avec un cortège
    funèbre. Une fois que le véhicule de tête est entré dans une intersection, le
    reste du cortège peut suivre quels que soient les dispositifs de contrôle de la
    circulation, à condition que leurs phares soient allumés.
- id: 96
  category: defensive_driving
  question: Lorsque vous conduisez dans des zones urbaines en Alberta, à quelle distance
    devant vous devez-vous scruter la route pour identifier les dangers potentiels
    ?
  choices:
    A: 5 à 8 secondes
    B: 12 à 15 secondes
    C: 20 à 25 secondes
    D: 30 à 40 secondes
  answer: B
  explanation: Dans les zones urbaines, les conducteurs doivent scruter de 12 à 15
    secondes devant eux (environ un pâté de maisons à un pâté de maisons et demi)
    pour anticiper les dangers.
- id: 97
  category: defensive_driving
  question: En Alberta, vous devez passer de vos feux de route aux feux de croisement
    lorsque vous vous trouvez à quelle distance d'un véhicule venant en sens inverse
    ?
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 300 mètres
    D: 500 mètres
  answer: C
  explanation: Selon la loi sur la sécurité routière de l'Alberta (Traffic Safety
    Act), vous devez baisser vos feux de route lorsqu'un véhicule venant en sens inverse
    se trouve à moins de 300 mètres.
- id: 98
  category: defensive_driving
  question: Lorsque vous suivez un autre véhicule la nuit en Alberta, à quelle distance
    devez-vous passer de vos feux de route aux feux de croisement ?
  choices:
    A: 50 mètres
    B: 150 mètres
    C: 300 mètres
    D: 450 mètres
  answer: B
  explanation: Vous devez utiliser les feux de croisement lorsque vous suivez un autre
    véhicule à moins de 150 mètres pour éviter d'éblouir le conducteur devant vous
    via ses rétroviseurs.
- id: 99
  category: defensive_driving
  question: Si votre véhicule commence à faire de l'aquaplanage sur une autoroute
    mouillée en Alberta, quelle est la première chose à faire ?
  choices:
    A: Freiner fort pour regagner de la traction
    B: Tourner le volant brusquement vers la droite
    C: Relâcher l'accélérateur et maintenir le volant droit
    D: Mettre immédiatement le véhicule au point mort
  answer: C
  explanation: En cas d'aquaplanage, vous devez ralentir en relâchant la pédale d'accélérateur.
    Ne freinez pas, car cela pourrait provoquer un dérapage. Maintenez le volant droit
    jusqu'à ce que vous retrouviez le contact avec la route.
- id: 100
  category: defensive_driving
  question: Lorsque vous conduisez sur une autoroute rurale de l'Alberta, à quelle
    distance devant vous devriez-vous balayer la route du regard pour repérer les
    dangers potentiels ?
  choices:
    A: 10 à 12 secondes
    B: 12 à 15 secondes
    C: 20 à 25 secondes
    D: 45 à 60 secondes
  answer: C
  explanation: Sur les autoroutes ou les routes rurales, vous devriez balayer la route
    du regard 20 à 25 secondes à l'avance, car les vitesses plus élevées nécessitent
    une plus grande distance pour réagir et s'arrêter.
- id: 101
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais en Alberta, quelle configuration
    d'éclairage est la plus sûre à utiliser ?
  choices:
    A: Feux de route (pleins phares)
    B: Feux de croisement (codes)
    C: Feux de stationnement uniquement
    D: Feux de détresse uniquement
  answer: B
  explanation: Les feux de croisement doivent être utilisés dans le brouillard. Les
    feux de route se reflètent sur l'humidité du brouillard, créant un éblouissement
    et rendant la visibilité plus difficile.
- id: 102
  category: defensive_driving
  question: 'Si vous conduisez un véhicule équipé d''un système de freinage antiblocage
    (ABS) et que vous devez effectuer un arrêt d''urgence sur une route glissante,
    vous devriez :'
  choices:
    A: Pomper les freins rapidement
    B: Appliquer une pression ferme et constante sur la pédale de frein
    C: Appuyer légèrement sur les freins pour éviter le blocage
    D: Utiliser le frein de stationnement d'urgence
  answer: B
  explanation: Avec l'ABS, vous devez appliquer une pression ferme et continue. Le
    système pompera automatiquement les freins pour vous afin d'empêcher le blocage
    des roues.
- id: 103
  category: defensive_driving
  question: En Alberta, quelle est la distance de sécurité recommandée lorsque vous
    conduisez dans des conditions défavorables comme le verglas, la neige ou une pluie
    forte ?
  choices:
    A: 2 secondes
    B: 3 secondes
    C: Au moins 4 secondes
    D: 10 secondes
  answer: C
  explanation: Par mauvais temps ou lorsque les conditions routières sont mauvaises,
    vous devriez doubler la distance de sécurité normale pour la porter à au moins
    quatre secondes afin de tenir compte de l'augmentation des distances de freinage.
- id: 104
  category: defensive_driving
  question: Pour éviter d'être ébloui par les phares des véhicules venant en sens
    inverse la nuit, où un conducteur de l'Alberta devrait-il regarder ?
  choices:
    A: Directement vers les phares qui arrivent
    B: Vers le côté gauche de la route
    C: Légèrement vers la droite, vers le bord de la voie de circulation
    D: Vers la ligne centrale de la route
  answer: C
  explanation: Si vous êtes ébloui, regardez légèrement vers la droite, vers la ligne
    blanche ou le bord de la route, pour maintenir votre position sans regarder directement
    la source lumineuse.
- id: 105
  category: defensive_driving
  question: Pourquoi la surface de la route est-elle la plus glissante durant les
    premières minutes de pluie en Alberta ?
  choices:
    A: Les pneus ne sont pas encore assez chauds pour adhérer
    B: La pluie se mélange à l'huile et à la graisse sur la surface de la route
    C: La pluie crée un vide entre le pneu et la route
    D: L'eau est plus froide lorsqu'elle touche le pavé pour la première fois
  answer: B
  explanation: Lorsqu'il commence à pleuvoir, l'eau se mélange à l'huile, à la poussière
    et à la graisse sur la route qui n'ont pas encore été évacuées, créant une pellicule
    très glissante.
- id: 106
  category: defensive_driving
  question: En Alberta, qu'est-ce que le « freinage au seuil » (threshold braking)
    ?
  choices:
    A: Freiner assez fort pour bloquer les roues
    B: Appliquer les freins juste avant le point de blocage des roues
    C: Pomper les freins pour évacuer l'eau des tambours
    D: Freiner uniquement lorsque vous atteignez le seuil d'une intersection
  answer: B
  explanation: Le freinage au seuil est utilisé dans les véhicules sans ABS ; il consiste
    à appliquer les freins aussi fermement que possible sans toutefois bloquer les
    roues.
- id: 107
  category: defensive_driving
  question: En Alberta, quand les collisions avec la faune (comme les cerfs ou les
    orignaux) sont-elles les plus susceptibles de se produire ?
  choices:
    A: En milieu de journée, quand le soleil est au plus haut
    B: Pendant les fortes tempêtes de pluie
    C: À l'aube et au crépuscule
    D: Uniquement pendant les mois d'hiver
  answer: C
  explanation: Les animaux sauvages sont plus actifs et plus difficiles à voir à l'aube
    et au crépuscule. Les conducteurs doivent être particulièrement prudents durant
    ces périodes, surtout dans les zones rurales.
- id: 108
  category: defensive_driving
  question: Si vous rencontrez de la « glace noire » (verglas) en conduisant sur une
    autoroute de l'Alberta, quelle est la meilleure façon de garder le contrôle ?
  choices:
    A: Accélérer légèrement pour gagner de l'élan
    B: Rétrograder immédiatement vers une vitesse inférieure
    C: Éviter les mouvements brusques de direction ou de freinage
    D: Allumer vos feux de détresse et vous arrêter sur l'accotement
  answer: C
  explanation: La glace noire est presque invisible. Si vous roulez dessus, restez
    calme, évitez de freiner ou de tourner brusquement le volant, et relâchez l'accélérateur
    pour laisser le véhicule ralentir naturellement.
- id: 109
  category: defensive_driving
  question: Dans des conditions de conduite idéales, quelle est la distance de sécurité
    minimale recommandée qu'un conducteur de l'Alberta devrait maintenir derrière
    le véhicule qui le précède ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 4 secondes
    D: 6 secondes
  answer: B
  explanation: Le guide du conducteur de l'Alberta recommande une distance de sécurité
    minimale de deux secondes dans des conditions idéales. Cette distance doit être
    augmentée par mauvais temps ou si la route est en mauvais état.
- id: 110
  category: defensive_driving
  question: Lorsque vous suivez un gros véhicule commercial ou une motocyclette en
    Alberta, pourquoi devriez-vous augmenter votre distance de suivi à au moins 4
    secondes ?
  choices:
    A: Pour permettre au conducteur du véhicule de vous voir dans ses rétroviseurs
      et offrir une marge de sécurité
    B: Parce que la loi oblige les gros véhicules à rouler plus lentement
    C: Pour éviter les turbulences de vent créées par les motocyclettes
    D: Parce que les motocyclettes sont légalement autorisées à s'arrêter plus rapidement
      que les voitures
  answer: A
  explanation: Augmenter la distance de suivi derrière les gros véhicules garantit
    que vous restez hors de leurs angles morts (No-Zones) et vous donne une meilleure
    vue de la route devant vous. Pour les motocyclettes, cela offre une marge de sécurité
    car elles peuvent s'arrêter très rapidement.
- id: 111
  category: defensive_driving
  question: Pour maintenir un « temps d'anticipation visuelle » approprié en conduisant
    dans une zone urbaine en Alberta, à quelle distance devant vous devriez-vous balayer
    la route du regard ?
  choices:
    A: 5 à 8 secondes
    B: 12 à 15 secondes
    C: 20 à 25 secondes
    D: 30 à 40 secondes
  answer: B
  explanation: Les directives de conduite préventive de l'Alberta suggèrent de balayer
    du regard 12 à 15 secondes à l'avance en zone urbaine (environ un pâté de maisons
    à un pâté de maisons et demi) pour anticiper les dangers.
- id: 112
  category: defensive_driving
  question: Lorsque vous conduisez sur les autoroutes rurales de l'Alberta, quel est
    le temps d'anticipation visuelle recommandé pour balayer la route devant vous
    ?
  choices:
    A: 10 à 12 secondes
    B: 15 à 18 secondes
    C: 20 à 25 secondes
    D: 45 à 60 secondes
  answer: C
  explanation: Dans les zones rurales, où les vitesses sont plus élevées, les conducteurs
    devraient balayer du regard 20 à 25 secondes à l'avance pour identifier les dangers
    potentiels comme la faune ou les intersections.
- id: 113
  category: defensive_driving
  question: 'Selon la loi sur la sécurité routière de l''Alberta (Traffic Safety Act),
    vous devez passer de vos feux de route aux feux de croisement lorsqu''un véhicule
    arrivant en sens inverse se trouve à moins de :'
  choices:
    A: 50 mètres
    B: 150 mètres
    C: 300 mètres
    D: 500 mètres
  answer: B
  explanation: La loi de l'Alberta exige que les conducteurs utilisent les feux de
    croisement lorsqu'ils se trouvent à moins de 150 mètres d'un véhicule venant en
    sens inverse pour éviter d'éblouir l'autre conducteur.
- id: 114
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais, de la neige ou de la
    pluie en Alberta, quel réglage de phares offre la meilleure visibilité ?
  choices:
    A: Feux de route
    B: Feux de croisement
    C: Feux de stationnement uniquement
    D: Feux de jour uniquement
  answer: B
  explanation: Les feux de croisement doivent être utilisés par mauvais temps. Les
    feux de route se reflètent sur l'humidité de l'air (brouillard/neige), créant
    un effet de « mur blanc » qui réduit la visibilité.
- id: 115
  category: defensive_driving
  question: Pourquoi les conducteurs de l'Alberta devraient-ils être particulièrement
    prudents lorsqu'ils circulent sur des tabliers de ponts ou des viaducs lorsque
    les températures sont proches du point de congélation ?
  choices:
    A: Ils sont généralement plus étroits que le reste de la route
    B: Ils peuvent être glacés même lorsque les autres surfaces routières sont sèches
    C: La limite de vitesse est automatiquement réduite de 20 km/h
    D: Ils sont plus sujets à l'aquaplanage que les routes plates
  answer: B
  explanation: Les tabliers de ponts et les viaducs gèlent plus rapidement que les
    autres surfaces routières car l'air froid circule à la fois au-dessus et au-dessous
    de la structure.
- id: 116
  category: defensive_driving
  question: En Alberta, lorsque vous dépassez un véhicule d'urgence arrêté dont les
    sirènes ou les gyrophares clignotent, à quelle vitesse devez-vous ralentir si
    la limite de vitesse affichée est de 80 km/h ou plus ?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: C
  explanation: La loi de l'Alberta exige que les conducteurs ralentissent à 60 km/h
    (ou à la limite de vitesse affichée si elle est inférieure à 60 km/h) lorsqu'ils
    dépassent des véhicules d'urgence ou des dépanneuses arrêtés sur le bord de la
    route avec leurs gyrophares allumés.
- id: 117
  category: defensive_driving
  question: Pour éviter les effets de la fatigue et de « l'hypnose de la route » lors
    de longs trajets sur les principales autoroutes de l'Alberta, à quelle fréquence
    un conducteur devrait-il prévoir de faire une pause ?
  choices:
    A: Toutes les heures
    B: Toutes les 2 heures ou tous les 200 km
    C: Toutes les 5 heures
    D: Seulement lorsqu'il commence à sentir ses yeux se fermer
  answer: B
  explanation: Le guide du conducteur de l'Alberta suggère de faire une pause toutes
    les deux heures ou tous les 200 kilomètres pour maintenir la vigilance et prévenir
    la fatigue.
- id: 118
  category: defensive_driving
  question: Si l'arrière de votre véhicule commence à déraper vers la droite sur une
    route glacée de l'Alberta, comment devriez-vous diriger le volant ?
  choices:
    A: Tourner vers la gauche
    B: Tourner vers la droite
    C: Garder le volant parfaitement droit
    D: Tourner le volant d'avant en arrière rapidement
  answer: B
  explanation: En cas de dérapage, vous devez diriger le volant dans la direction
    où vous voulez que l'avant du véhicule aille. Si l'arrière dérape vers la droite,
    tourner vers la droite aide à réaligner le véhicule.
- id: 119
  category: defensive_driving
  question: Lors d'un changement de voie en Alberta, quel est l'objectif principal
    d'effectuer une « vérification par-dessus l'épaule » ?
  choices:
    A: Vérifier la distance du véhicule qui se trouve directement derrière vous
    B: Voir s'il y a un véhicule dans votre angle mort
    C: S'assurer que votre clignotant fonctionne
    D: Vérifier l'état de vos pneus arrière
  answer: B
  explanation: Une vérification par-dessus l'épaule est essentielle car les rétroviseurs
    ne montrent pas tout. Elle vous permet de voir les véhicules qui se trouvent dans
    « l'angle mort » à côté de votre voiture.
- id: 120
  category: defensive_driving
  question: 'En Alberta, la « glace noire » est plus susceptible de se former sur
    la chaussée lorsque :'
  choices:
    A: Il neige abondamment avec des vents violents
    B: Les températures sont bien en dessous de -30 °C
    C: Les températures sont proches du point de congélation et de l'humidité est
      présente sur la route
    D: Le soleil brille directement sur une route sèche
  answer: C
  explanation: La glace noire est une couche de glace mince et transparente qui se
    forme lorsque l'humidité gèle sur la surface de la route, se produisant souvent
