questions:
- id: 1
  category: driver_responsibility
  question: ¿Cuáles son los propósitos principales del Manual del Conductor de Texas?
  choices:
    A: Servir como referencia legal oficial en los tribunales y proporcionar tarifas
      de seguros.
    B: Ayudarle a calificar para una licencia de conducir de Texas y ayudarle a convertirse
      en un conductor más seguro.
    C: Registrar su vehículo y proporcionar una lista de escuelas de manejo locales.
    D: Resumir el Código Penal de Texas y programar exámenes de manejo.
  answer: B
  explanation: 'El manual establece que su propósito principal es: 1) ayudarle a calificar
    para una licencia de conducir de Texas, y 2) ayudarle a convertirse en un conductor
    más seguro.'
- id: 2
  category: safe_driving_rules
  question: Si desea leer el lenguaje exacto de las leyes de tránsito o penales a
    las que se hace referencia en el manual, ¿qué documentos debe consultar?
  choices:
    A: El Apéndice del Manual del Conductor de Texas
    B: El Código Administrativo de Texas
    C: El Código de Transporte de Texas y el Código Penal de Texas
    D: El Libro de Reglas del Departamento de Seguridad Pública
  answer: C
  explanation: El manual no es una referencia legal oficial. Para conocer el lenguaje
    exacto de las leyes de tránsito o penales, debe consultar el Código de Transporte
    de Texas y el Código Penal de Texas.
- id: 3
  category: license_system
  question: ¿Con qué frecuencia se reúne la Legislatura de Texas para realizar cambios
    regulares a las leyes de tránsito?
  choices:
    A: Cada seis meses
    B: Cada año
    C: Cada dos años
    D: Cada cuatro años
  answer: C
  explanation: El texto señala que la Legislatura de Texas se reúne cada dos años
    y realiza cambios regulares a las leyes de tránsito.
- id: 4
  category: license_system
  question: ¿Con cuánto tiempo de anticipación debe avisar si necesita hacer arreglos
    especiales para adaptarse a una discapacidad antes de visitar una oficina de licencias
    de conducir?
  choices:
    A: Al menos 24 horas
    B: Al menos 48 horas
    C: Al menos de tres a cuatro días hábiles
    D: Al menos de cinco a siete días hábiles
  answer: D
  explanation: El manual solicita que se comunique con ellos al menos de cinco a siete
    días hábiles antes de su visita para tener tiempo de atender una solicitud de
    la ADA (Ley sobre Estadounidenses con Discapacidades).
- id: 5
  category: safe_driving_rules
  question: ¿Aproximadamente cuántas millas de vías públicas hay en el estado de Texas?
  choices:
    A: Más de 100,000 millas
    B: Más de 250,000 millas
    C: Más de 314,000 millas
    D: Más de 500,000 millas
  answer: C
  explanation: Según la carta del Coronel, Texas es un estado grande con más de 314,000
    millas de vías públicas.
- id: 6
  category: defensive_driving
  question: ¿Aproximadamente cuántas personas mueren en accidentes de tránsito cada
    año en Texas?
  choices:
    A: 1,500
    B: 3,500
    C: 5,000
    D: 10,000
  answer: B
  explanation: El manual establece que, trágicamente, cada año en Texas, aproximadamente
    3,500 personas mueren en accidentes de tránsito.
- id: 7
  category: defensive_driving
  question: Para prevenir consecuencias trágicas en la carretera, el Departamento
    de Seguridad Pública de Texas aconseja a los conductores mantenerse alerta ante
    conductores incapacitados y evitar ¿qué cosa en sus propios vehículos?
  choices:
    A: Escuchar la radio
    B: Distracciones
    C: Llevar pasajeros
    D: Conducir de noche
  answer: B
  explanation: El manual enfatiza que los conductores deben evitar distracciones en
    su propio vehículo mientras se mantienen alerta ante conductores incapacitados
    o inseguros.
- id: 8
  category: license_system
  question: Según la Tabla de Contenido, ¿de qué otra manera se conoce a una Licencia
    Ocupacional?
  choices:
    A: Licencia por Dificultades
    B: Licencia de Necesidad Esencial
    C: Licencia Provisional
    D: Licencia Restringida
  answer: B
  explanation: La Tabla de Contenido enumera la 'Licencia Ocupacional (Licencia de
    Necesidad Esencial)' en el Capítulo 1.
- id: 9
  category: driver_responsibility
  question: ¿Qué capítulo del Manual del Conductor de Texas cubre la Ley de Seguro
    de Responsabilidad Civil y la Evidencia de Responsabilidad Financiera?
  choices:
    A: Capítulo 1
    B: Capítulo 2
    C: Capítulo 3
    D: Capítulo 4
  answer: C
  explanation: 'Según la Tabla de Contenido, el Capítulo 3: Responsabilidad de Seguridad
    cubre la Ley de Seguro de Responsabilidad Civil y la Evidencia de Responsabilidad
    Financiera.'
- id: 10
  category: sharing_the_road
  question: 'Según la Tabla de Contenido, ¿cuál de los siguientes temas se cubre en
    el Capítulo 4: Derecho de Paso?'
  choices:
    A: Ceder el Derecho de Paso a los Autobuses Escolares
    B: Equipo Requerido para Vehículos
    C: Sanciones por Conducir sin Licencia
    D: Señales de Tránsito
  answer: A
  explanation: 'La Tabla de Contenido muestra que ''Ceder el Derecho de Paso a los
    Autobuses Escolares'' es una sección dentro del Capítulo 4: Derecho de Paso.'
- id: 11
  category: license_system
  question: ¿Dónde se pueden encontrar los Procedimientos de Quejas del Departamento
    de Seguridad Pública de Texas si no recibe adaptaciones razonables de la ADA?
  choices:
    A: El Código Penal de Texas
    B: 37 Código Administrativo de Texas §1.41
    C: El Código de Transporte de Texas
    D: Capítulo 5 del Manual del Conductor de Texas
  answer: B
  explanation: El manual establece que los Procedimientos de Quejas del DPS se pueden
    encontrar en el 37 Código Administrativo de Texas §1.41.
- id: 12
  category: vehicle_information
  question: ¿En qué capítulo del manual encontraría información sobre el 'Equipo que
    no debe tener' en su vehículo?
  choices:
    A: 'Capítulo 1: Su licencia de conducir'
    B: 'Capítulo 2: Inspección y registro del vehículo'
    C: 'Capítulo 3: Responsabilidad de seguridad'
    D: 'Capítulo 5: Señales, letreros y marcadores'
  answer: B
  explanation: 'El índice enumera el ''Equipo que no debe tener'' bajo el Capítulo
    2: Inspección y registro del vehículo.'
- id: 13
  category: license_system
  question: ¿Qué división del Departamento de Seguridad Pública de Texas es responsable
    de publicar el Manual del Conductor de Texas?
  choices:
    A: La División de Patrulla de Caminos
    B: La División de Inspección de Vehículos
    C: La División de Licencias de Conducir
    D: La División de Seguridad Vial
  answer: C
  explanation: La introducción establece que el Departamento de Seguridad Pública
    de Texas (DPS), División de Licencias de Conducir, proporciona el manual.
- id: 14
  category: penalties_and_points
  question: Según el índice, ¿el Capítulo 1 incluye información sobre las sanciones
    por cuál de las siguientes infracciones cometidas por menores?
  choices:
    A: Exceso de velocidad en una zona escolar
    B: Infracciones relacionadas con el alcohol no relacionadas con la conducción
    C: Conducir sin cinturón de seguridad
    D: Enviar mensajes de texto mientras se conduce
  answer: B
  explanation: El índice del Capítulo 1 enumera una sección titulada 'Sanciones por
    infracciones relacionadas con el alcohol no relacionadas con la conducción por
    menores'.
- id: 15
  category: alcohol_drugs_health
  question: Según el manual, ¿cuál es el asesino número uno en las carreteras?
  choices:
    A: El exceso de velocidad
    B: La conducción distraída
    C: El alcohol
    D: El mal tiempo
  answer: C
  explanation: El manual establece explícitamente que 'El asesino número uno es el
    alcohol' en el capítulo que cubre el impacto del alcohol y las drogas en la capacidad
    de conducir.
- id: 16
  category: safe_driving_rules
  question: ¿Cómo afecta el aumento de velocidad a su capacidad de conducir?
  choices:
    A: Aumenta su tiempo de reacción
    B: Reduce su campo de visión
    C: Mejora la tracción de su vehículo
    D: Amplía su campo de visión
  answer: B
  explanation: El manual incluye una sección específica titulada 'La velocidad reduce
    su campo de visión' en el capítulo de Velocidad y límites de velocidad.
- id: 17
  category: safe_driving_rules
  question: Al acercarse a vehículos de emergencia o de las fuerzas del orden detenidos
    a un lado de la carretera, ¿qué acción específica se destaca en el capítulo de
    límites de velocidad?
  choices:
    A: Tocar la bocina
    B: Mantener su velocidad
    C: Reducir la velocidad o cambiar de carril (Slow Down or Move Over)
    D: Detenerse inmediatamente
  answer: C
  explanation: El manual incluye la regla de 'Reducir la velocidad o cambiar de carril'
    (Slow Down or Move Over) en el capítulo sobre velocidad y límites de velocidad.
- id: 18
  category: signs_and_signals
  question: ¿Qué tipo de emblema se requiere específicamente para ciertos vehículos
    que viajan a velocidades más bajas?
  choices:
    A: Emblema de vehículo de alta ocupación
    B: Emblema de vehículo de movimiento lento
    C: Emblema de vehículo comercial
    D: Emblema de carga ancha
  answer: B
  explanation: El manual enumera el 'Emblema de vehículo de movimiento lento' en la
    sección de señales y letreros.
- id: 19
  category: defensive_driving
  question: ¿Cuál de las siguientes opciones está categorizada explícitamente como
    una 'Situación especial de conducción' en el manual?
  choices:
    A: Conducir en una zona escolar
    B: Estacionamiento en paralelo
    C: Conducción en invierno
    D: Ceder el paso en una intersección
  answer: C
  explanation: La 'Conducción en invierno' aparece en el capítulo titulado 'Algunas
    situaciones especiales de conducción'.
- id: 20
  category: sharing_the_road
  question: ¿Qué tipo de marca en el pavimento se menciona específicamente en el capítulo
    de leyes y seguridad para bicicletas?
  choices:
    A: Línea amarilla continua
    B: Marca de carril compartido
    C: Línea blanca discontinua
    D: Marca de cruce peatonal
  answer: B
  explanation: La 'Marca de carril compartido' se enumera específicamente en el capítulo
    de Leyes y seguridad para bicicletas.
- id: 21
  category: driver_responsibility
  question: ¿Cuál de los siguientes es un tipo específico de choque descrito en el
    capítulo de choques de vehículos de motor?
  choices:
    A: Choque que involucra un vehículo desatendido
    B: Choque que involucra a un peatón
    C: Choque que involucra una bicicleta
    D: Choque que involucra un tren
  answer: A
  explanation: '"Choque que involucra un vehículo desatendido" (Crash Involving an
    Unattended Vehicle) aparece explícitamente como una sección en el capítulo de
    Choques de vehículos de motor.'
- id: 22
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor con respecto a las señales de advertencia
    y las barricadas?
  choices:
    A: Conducir alrededor de ellas con cuidado
    B: Moverlas si bloquean el camino
    C: Obedecer las señales de advertencia y las barricadas
    D: Reportarlas a las autoridades
  answer: C
  explanation: El manual instruye explícitamente a los conductores a "Obedecer las
    señales de advertencia y las barricadas" en la sección de señales de tránsito.
- id: 23
  category: vehicle_information
  question: ¿Qué gas peligroso se destaca específicamente como un consejo de seguridad
    adicional a tener en cuenta?
  choices:
    A: Dióxido de nitrógeno
    B: Monóxido de carbono
    C: Dióxido de azufre
    D: Ozono
  answer: B
  explanation: El "Monóxido de carbono" se enumera en el capítulo de Consejos de seguridad
    adicionales.
- id: 24
  category: sharing_the_road
  question: ¿Cuál de los siguientes se considera un "Camión grande" según la sección
    de compartir el camino?
  choices:
    A: Una camioneta de reparto
    B: Una camioneta pickup con remolque
    C: Una combinación de camión-tractor
    D: Un vehículo de pasajeros de servicio pesado
  answer: C
  explanation: El manual especifica "Camiones grandes y combinaciones de camión-tractor"
    en la sección sobre compartir el camino con camiones.
- id: 25
  category: driver_responsibility
  question: ¿Cuál es la responsabilidad de un conductor cuando está involucrado en
    un choque donde alguien resulta herido, según el capítulo de choques?
  choices:
    A: Esperar a los servicios de emergencia sin intervenir
    B: Ayudar a los heridos
    C: Dirigir el tráfico alrededor del choque
    D: Mover los vehículos inmediatamente
  answer: B
  explanation: '"Ayudar a los heridos" (Aiding the Injured) se enumera como una sección
    específica en el capítulo de Choques de vehículos de motor.'
- id: 26
  category: signs_and_signals
  question: ¿Cuál de las siguientes se enumera como una categoría específica de señales
    de tránsito?
  choices:
    A: Señales sugestivas
    B: Señales de guía
    C: Señales opcionales
    D: Señales temporales
  answer: B
  explanation: Las "Señales de guía" (Guide Signs) se enumeran explícitamente como
    una categoría bajo Señales de tránsito.
- id: 27
  category: sharing_the_road
  question: Además de los camiones grandes, motocicletas y bicicletas, ¿con qué otro
    medio de transporte específico instruye el manual a los conductores a "Compartir
    el camino"?
  choices:
    A: Tren ligero
    B: Aviones
    C: Carruajes tirados por caballos
    D: Peatones
  answer: A
  explanation: '"Compartir el camino con el tren ligero" (Share the Road with Light
    Rail) es una sección específica en el capítulo de Situaciones especiales de manejo.'
- id: 28
  category: penalties_and_points
  question: ¿Qué tipo de choque involucra a un conductor que abandona la escena sin
    proporcionar su información?
  choices:
    A: Choque desatendido
    B: Choques de atropello y fuga
    C: Choque contra un objeto fijo
    D: Choque por infracción en movimiento
  answer: B
  explanation: Los "Choques de atropello y fuga" (Hit-and-Run Crashes) se enumeran
    explícitamente en el capítulo de Choques de vehículos de motor.
- id: 29
  category: sharing_the_road
  question: ¿Qué se requiere de las bicicletas antes de que puedan ser operadas de
    manera segura en la vía pública?
  choices:
    A: Deben estar registradas en el estado
    B: Deben tener un motor acoplado
    C: Deben estar debidamente equipadas
    D: Deben estar pintadas de un color brillante
  answer: C
  explanation: El manual establece que "Las bicicletas deben estar debidamente equipadas"
    en el capítulo de Leyes y seguridad para bicicletas.
- id: 30
  category: license_system
  question: ¿Cuántos días tiene un nuevo residente con una licencia válida de otro
    estado para establecer su residencia y obtener una licencia de conducir de Texas?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Según el manual, los nuevos residentes que están intercambiando una
    licencia válida de otro estado tienen 90 días para establecer su residencia en
    Texas con el fin de obtener una licencia de conducir de Texas.
- id: 31
  category: license_system
  question: ¿Cuál de las siguientes personas está exenta de tener una licencia de
    conducir de Texas?
  choices:
    A: Una persona que conduce un vehículo comercial de motor a través de las fronteras
      estatales
    B: Una persona que opera temporalmente un tractor agrícola en una carretera
    C: Un joven de 16 años que conduce el automóvil familiar a la escuela
    D: Un nuevo residente que ha vivido en Texas durante 6 meses
  answer: B
  explanation: Cualquier persona que opere o mueva temporalmente maquinaria vial,
    un tractor agrícola o un implemento agrícola en una carretera está exenta de tener
    una licencia de Texas, a menos que el vehículo sea un vehículo comercial de motor.
- id: 32
  category: license_system
  question: ¿Cuál es la edad mínima para que un no residente conduzca un vehículo
    de Clase C o Clase M en Texas usando una licencia de conducir válida de su estado
    de origen o provincia canadiense?
  choices:
    A: 15 años
    B: 16 años
    C: 18 años
    D: 21 años
  answer: B
  explanation: Cualquier no residente que tenga al menos 16 años de edad y posea una
    licencia de conducir válida emitida en su estado de origen o provincia canadiense
    puede conducir un vehículo que esté permitido operar con una licencia de conducir
    de Clase C o Clase M en Texas.
- id: 33
  category: license_system
  question: ¿Por cuánto tiempo sigue siendo válida una licencia de conducir de Texas
    para una persona en las fuerzas armadas de los EE. UU. después de ser dada de
    baja con honores del servicio o regresar a Texas?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Una licencia de conducir de Texas en posesión de una persona en las
    fuerzas armadas de los EE. UU. sigue siendo válida mientras continúe el servicio
    y la persona permanezca ausente de Texas, siempre que la ausencia no exceda los
    90 días a partir de la fecha en que es dada de baja con honores del servicio o
    regresa a Texas.
- id: 34
  category: license_system
  question: ¿Cuáles son los requisitos para el conductor con licencia que debe acompañar
    a un estudiante de manejo con una licencia de aprendizaje?
  choices:
    A: Debe tener al menos 18 años con 6 meses de experiencia de manejo
    B: Debe tener al menos 21 años con al menos un año de experiencia de manejo
    C: Debe ser un padre o tutor legal mayor de 25 años
    D: Debe ser un instructor de manejo certificado
  answer: B
  explanation: El conductor con licencia que acompaña a un aprendiz debe tener al
    menos 21 años de edad con al menos un año de experiencia de manejo, debe ocupar
    el asiento junto al conductor y no puede estar intoxicado, dormido o distraído.
- id: 35
  category: license_system
  question: ¿Cuándo vence una licencia de aprendizaje para un solicitante menor de
    18 años?
  choices:
    A: En su cumpleaños número 16
    B: En su cumpleaños número 18
    C: En su cumpleaños número 21
    D: Un año a partir de la fecha de emisión
  answer: B
  explanation: Una licencia de aprendizaje indicará "Learner License" (Licencia de
    aprendizaje) en la parte frontal de la tarjeta y vencerá en el cumpleaños número
    18 del menor.
- id: 36
  category: license_system
  question: ¿Por cuánto tiempo es válido un formulario de Verificación de Inscripción
    y Asistencia (VOE) durante el verano?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: D
  explanation: El VOE no puede tener una fecha de más de 30 días antes de la fecha
    de solicitud de una licencia durante el año escolar o de más de 90 días durante
    el verano.
- id: 37
  category: license_system
  question: Para obtener un formulario de Verificación de Inscripción y Asistencia
    (VOE), ¿cuántos días debe haber asistido a la escuela un estudiante en el semestre
    de otoño o primavera anterior a la solicitud?
  choices:
    A: Al menos 45 días
    B: Al menos 60 días
    C: Al menos 80 días
    D: Al menos 90 días
  answer: C
  explanation: Un estudiante debe haber asistido a la escuela durante al menos 80
    días en el semestre de otoño o primavera anterior a la fecha de solicitud para
    cumplir con el requisito del VOE.
- id: 38
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para solicitar una licencia por dificultades
    extremas (hardship license) en Texas?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 17 años de edad
  answer: B
  explanation: Una persona que solicita una licencia por dificultades extremas debe
    tener al menos 15 años de edad, pero no más de 18.
- id: 39
  category: license_system
  question: ¿Cuál de las siguientes es una razón válida para que el Departamento de
    Seguridad Pública (DPS) emita una licencia por dificultades extremas a un menor?
  choices:
    A: El menor necesita conducir a eventos sociales
    B: El menor está inscrito en un programa de educación vocacional que requiere
      una licencia
    C: Los padres del menor no tienen tiempo para llevarlo a la escuela
    D: El menor quiere adelantarse en el programa de Licencias de Conducir Graduadas
      (GDL)
  answer: B
  explanation: El DPS emitirá una licencia por dificultades extremas si se determina
    que es necesaria porque el menor solicitante está inscrito en un programa de educación
    vocacional que requiere una licencia para participar.
- id: 40
  category: driver_responsibility
  question: Según el Manual del Conductor de Texas, los conductores jóvenes representan
    el 6.5 por ciento de la población de conductores, pero ¿de qué porcentaje de choques
    fatales son responsables?
  choices:
    A: 6.5 por ciento
    B: 10 por ciento
    C: 13 por ciento
    D: 25 por ciento
  answer: C
  explanation: Los conductores jóvenes representan el 6.5 por ciento de la población
    de conductores, pero son responsables del 13 por ciento de los choques fatales.
- id: 41
  category: license_system
  question: Bajo la Fase Uno del programa de Licencias de Conducir Graduales (GDL),
    ¿cuánto tiempo debe un solicitante menor de 18 años mantener una licencia de aprendizaje
    o por dificultad antes de que se le pueda emitir una licencia provisional?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: La Fase Uno requiere que los solicitantes menores de 18 años mantengan
    una licencia válida de aprendizaje, por dificultad, o una combinación de ambas,
    por un mínimo de seis meses antes de la emisión de una licencia provisional.
- id: 42
  category: penalties_and_points
  question: ¿Qué sucede si la licencia de aprendizaje de un menor es suspendida durante
    la Fase Uno del programa de Licencias de Conducir Graduales (GDL)?
  choices:
    A: El menor debe reiniciar el período de seis meses desde el principio.
    B: El menor queda permanentemente descalificado para obtener una licencia provisional.
    C: El período inicial de seis meses se extiende por el número de días de la suspensión.
    D: La suspensión no tiene efecto sobre el requisito de seis meses.
  answer: C
  explanation: Si su licencia es suspendida durante la Fase Uno, el período inicial
    de seis meses se extiende por el número de días de la suspensión porque su licencia
    es inválida durante el período de suspensión.
- id: 43
  category: license_system
  question: ¿Qué tipo de licencia está exenta de los requisitos de la Fase Uno del
    programa de Licencias de Conducir Graduales (GDL)?
  choices:
    A: Licencias Clase A
    B: Licencias Clase B
    C: Licencias Clase C
    D: Licencias Clase M (motocicleta)
  answer: D
  explanation: Los requisitos de la Fase Uno no se aplican a las licencias Clase M
    (motocicleta). Bajo el programa GDL, no hay un tiempo mínimo que una persona deba
    mantener una licencia de motocicleta restringida antes de solicitar una licencia
    Clase M.
- id: 44
  category: license_system
  question: ¿Qué debe hacer un solicitante con sus licencias de conducir e identificaciones
    válidas emitidas previamente antes de recibir una nueva licencia de conducir de
    Texas?
  choices:
    A: Conservarlas como una forma de identificación de respaldo.
    B: Entregarlas al Departamento de Seguridad Pública.
    C: Enviarlas por correo a su estado de residencia anterior.
    D: Destruirlas en casa.
  answer: B
  explanation: 'Una Nota Especial en el manual establece: ''No puede recibir una licencia
    de conducir de Texas hasta que entregue todas las licencias de conducir e identificaciones
    válidas emitidas''.'
- id: 45
  category: license_system
  question: ¿Cuánto tiempo debe una persona mantener una licencia de aprendizaje de
    Texas antes de ser elegible para la Fase Dos del programa de Licencias de Conducir
    Graduales (GDL)?
  choices:
    A: Tres meses
    B: Seis meses
    C: Nueve meses
    D: Doce meses
  answer: B
  explanation: Según el manual, una licencia de aprendizaje de Texas debe mantenerse
    durante seis meses a partir de la fecha de emisión antes de que la persona sea
    elegible para la Fase Dos.
- id: 46
  category: safe_driving_rules
  question: Durante la Fase Dos del programa GDL, un conductor no puede operar un
    vehículo motorizado con más de ¿cuántos pasajeros menores de 21 años que no sean
    familiares?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Durante la Fase Dos, las personas no pueden conducir un vehículo motorizado
    con más de un pasajero en el vehículo menor de 21 años que no sea un familiar.
- id: 47
  category: safe_driving_rules
  question: ¿Cuáles son las horas de conducción restringidas para una persona en la
    Fase Dos del programa GDL, a menos que conduzca por trabajo, escuela o una emergencia
    médica?
  choices:
    A: De 10:00 p.m. a 4:00 a.m.
    B: De 11:00 p.m. a 6:00 a.m.
    C: De medianoche a 5:00 a.m.
    D: De 1:00 a.m. a 5:00 a.m.
  answer: C
  explanation: La Fase Dos restringe a las personas de conducir entre la medianoche
    y las 5:00 a.m. a menos que la operación sea necesaria por trabajo, una actividad
    relacionada con la escuela o una emergencia médica.
- id: 48
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a los dispositivos de comunicación inalámbrica
    para los conductores menores de 18 años?
  choices:
    A: Solo pueden usar dispositivos de manos libres.
    B: Solo pueden usar dispositivos inalámbricos cuando están detenidos en un semáforo
      en rojo.
    C: Tienen prohibido usar cualquier dispositivo de comunicación inalámbrica, incluidos
      los de manos libres, excepto en una emergencia.
    D: Pueden usar dispositivos inalámbricos si un adulto con licencia está en el
      asiento del pasajero.
  answer: C
  explanation: Todos los conductores menores de 18 años tienen prohibido usar un dispositivo
    de comunicación inalámbrica, incluido un dispositivo de manos libres, excepto
    en caso de emergencia.
- id: 49
  category: license_system
  question: ¿Cuándo vence una licencia de conducir provisional?
  choices:
    A: En el cumpleaños número 18 del titular de la licencia
    B: En el cumpleaños número 21 del titular de la licencia
    C: Cuatro años a partir de la fecha de emisión
    D: Ocho años a partir de la fecha de emisión
  answer: A
  explanation: Una licencia provisional se emite a personas de 16 a 18 años de edad,
    está marcada como 'PROVISIONAL' y vence en el cumpleaños número 18 del titular
    de la licencia.
- id: 50
  category: license_system
  question: Si un solicitante tiene 16 años y presenta una licencia de conducir válida
    de otro estado, ¿qué tipo de licencia de Texas se le emitirá después de aprobar
    el examen de manejo?
  choices:
    A: Una licencia de aprendizaje de Fase Uno
    B: Una licencia provisional de Fase Dos
    C: Una licencia de conducir estándar Clase C
    D: Una licencia de motocicleta Clase M
  answer: B
  explanation: A los solicitantes que tengan al menos 16 años pero menos de 18 años
    y presenten una licencia de conducir válida de otro estado se les emitirá una
    licencia provisional de Fase Dos con restricciones de pasajeros y de horario.
- id: 51
  category: license_system
  question: ¿Cómo se marcará una licencia de conducir si se emite a una persona menor
    de 21 años?
  choices:
    A: '"MINOR" (Menor)'
    B: '"PROVISIONAL" (Provisional)'
    C: '"UNDER 21" (Menor de 21)'
    D: '"RESTRICTED" (Restringida)'
  answer: C
  explanation: El manual establece que todas las licencias emitidas a personas menores
    de 21 años estarán marcadas como 'UNDER 21' (Menor de 21).
- id: 52
  category: license_system
  question: ¿Por cuántos años es típicamente válida una licencia de conducir estándar
    no comercial para personas de 18 años o más?
  choices:
    A: Cuatro años
    B: Cinco años
    C: Seis años
    D: Ocho años
  answer: D
  explanation: La mayoría de las licencias de conducir no comerciales emitidas a personas
    de 18 años o más son válidas por ocho años.
- id: 53
  category: license_system
  question: ¿Cuál de las siguientes es una razón por la que un solicitante podría
    recibir una licencia de conducir con un plazo menor a los ocho años estándar?
  choices:
    A: Tener 85 años de edad o más
    B: Tener un historial de multas de estacionamiento
    C: Conducir un vehículo recreativo
    D: Tener una licencia Clase M
  answer: A
  explanation: Algunos solicitantes reciben licencias con plazos más cortos debido
    a restricciones que incluyen la verificación de presencia legal, requisitos de
    registro de delincuentes sexuales o tener 85 años de edad o más.
- id: 54
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos está exento de requerir una Licencia
    de Conducir Comercial (CDL)?
  choices:
    A: Un camión de reparto utilizado para una empresa comercial
    B: Un vehículo recreativo conducido para uso personal
    C: Un autobús de pasajeros que transporta a 20 personas de alquiler
    D: Un camión con remolque utilizado para el comercio interestatal
  answer: B
  explanation: Las personas que operan un vehículo recreativo conducido para uso personal
    están exentas de obtener una CDL.
- id: 55
  category: vehicle_information
  question: Una licencia de conducir Clase A permite a una persona conducir un vehículo
    con una clasificación de peso bruto combinado (GCWR) de 26,001 libras o más, siempre
    que el vehículo remolcado exceda ¿qué peso?
  choices:
    A: 5,000 libras
    B: 10,000 libras
    C: 15,000 libras
    D: 20,000 libras
  answer: B
  explanation: Una licencia de conducir Clase A permite conducir un vehículo o combinación
    de vehículos con un GCWR de 26,001 libras o más, siempre que la clasificación
    de peso bruto del vehículo (GVWR) del vehículo o vehículos remolcados supere las
    10,000 libras.
- id: 56
  category: vehicle_information
  question: Bajo una licencia de conducir Clase C, un autociclo se define como un
    vehículo de motor que cumple con varios requisitos. ¿Cuál de los siguientes es
    UNO de esos requisitos?
  choices:
    A: Debe tener cuatro ruedas en el suelo al moverse.
    B: Debe estar equipado con manubrios en lugar de un volante.
    C: Debe estar equipado con asientos que no requieran que el operador se siente
      a horcajadas sobre el asiento.
    D: No debe estar certificado para cumplir con los requisitos federales de seguridad
      para motocicletas.
  answer: C
  explanation: Un autociclo se define como un vehículo que no tiene más de tres ruedas,
    está equipado con un volante, está equipado con asientos que no requieren que
    el operador se siente a horcajadas sobre el asiento, y está fabricado para cumplir
    con los requisitos federales de seguridad para una motocicleta.
- id: 57
  category: vehicle_information
  question: ¿Cuál es el límite de la clasificación de peso bruto del vehículo (GVWR)
    para un solo vehículo conducido con una licencia de conducir estándar Clase C?
  choices:
    A: Menos de 10,000 libras
    B: Menos de 20,000 libras
    C: Menos de 26,001 libras
    D: 26,001 libras o más
  answer: C
  explanation: Una licencia de conducir Clase C permite a una persona conducir un
    solo vehículo con una clasificación de peso bruto del vehículo (GVWR) de menos
    de 26,001 libras.
- id: 58
  category: driver_testing
  question: ¿Qué debe aprobar una persona antes de solicitar una licencia de conducir
    Clase M (motocicleta)?
  choices:
    A: Un examen de manejo de vehículos comerciales
    B: Un curso de capacitación para operadores de motocicletas aprobado por el estado
    C: Un examen de certificación de autociclos
    D: Un curso de manejo defensivo
  answer: B
  explanation: Antes de solicitar una licencia Clase M, debe aprobar un curso de capacitación
    para operadores de motocicletas aprobado por el estado.
- id: 59
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para obtener una licencia Clase M
    para una motocicleta de más de 250 cc?
  choices:
    A: 15 años de edad
    B: 16 años de edad con la finalización de los cursos de educación y capacitación
      requeridos
    C: 18 años de edad
    D: 21 años de edad
  answer: B
  explanation: La edad mínima para una licencia de motocicleta es de 16 años con la
    finalización de la fase presencial de un curso de educación vial (32 horas) y
    un curso de capacitación para operadores de motocicletas aprobado por el estado
    (16 horas).
- id: 60
  category: license_system
  question: ¿Bajo qué condición puede un joven de 15 años obtener una licencia para
    operar una motocicleta de 250 cc o menos?
  choices:
    A: Si tiene una licencia Clase C válida
    B: Si está acompañado por un padre o tutor con licencia en todo momento
    C: Con la aprobación del DPS para una licencia de conducir por dificultades extremas
      (hardship license) o la finalización de los cursos de educación requeridos
    D: Los jóvenes de 15 años no pueden obtener una licencia de motocicleta bajo ninguna
      circunstancia
  answer: C
  explanation: Para una motocicleta de 250 cc o menos, la edad mínima es de 15 años
    con la aprobación del DPS para una licencia de conducir por dificultades extremas
    (hardship license) o la finalización de la fase presencial de un curso de educación
    vial y un curso de capacitación para operadores de motocicletas aprobado por el
    estado.
- id: 61
  category: license_system
  question: ¿Qué veteranos son elegibles para estar exentos de pagar las tarifas de
    la licencia de conducir y la tarjeta de identificación (ID)?
  choices:
    A: Todos los veteranos con baja honorable
    B: Los veteranos que sirvieron en una zona de combate designada
    C: Los veteranos con al menos un 30 por ciento de discapacidad relacionada con
      el servicio
    D: Los veteranos con baja honorable que reciben compensación por una discapacidad
      relacionada con el servicio de al menos el 60 por ciento
  answer: D
  explanation: Los veteranos que tienen una baja honorable y reciben compensación
    por una discapacidad relacionada con el servicio de al menos el 60 por ciento
    están exentos de pagar las tarifas de la licencia de conducir y la tarjeta de
    identificación.
- id: 62
  category: license_system
  question: 'Un veterano que cumple con los requisitos de discapacidad para una exención
    de tarifas aún tendrá que pagar las tarifas si solicita:'
  choices:
    A: Una licencia de motocicleta Clase M
    B: Una licencia de conducir comercial (CDL)
    C: Una tarjeta de identificación (ID)
    D: Una licencia de conducir Clase C
  answer: B
  explanation: Las personas que solicitan una CDL o que deben registrarse como delincuentes
    sexuales no son elegibles para la exención de tarifas para veteranos.
- id: 63
  category: license_system
  question: ¿Cómo están formateadas las tarjetas de identificación (ID) de Texas para
    las personas menores de 21 años?
  choices:
    A: Están impresas en formato horizontal
    B: Están impresas en formato vertical
    C: Tienen un borde rojo alrededor de la fotografía
    D: No incluyen fotografía
  answer: B
  explanation: Las tarjetas de identificación se muestran en formato vertical para
    las personas menores de 21 años y son horizontales para las personas de 21 años
    o más.
- id: 64
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para que se le emita una tarjeta
    de identificación (ID) de Texas?
  choices:
    A: 15 años
    B: 16 años
    C: 18 años
    D: Las tarjetas de identificación se pueden emitir a cualquier persona de cualquier
      edad
  answer: D
  explanation: Según la tabla de Tarjetas de Identificación en el manual, las tarjetas
    de identificación se pueden emitir a cualquier persona de cualquier edad.
- id: 65
  category: driver_responsibility
  question: ¿Cómo debe agregar información sobre una reacción alérgica a los medicamentos
    en su licencia de conducir?
  choices:
    A: Solicitar al DPS que lo imprima en el frente de la tarjeta durante su solicitud
    B: Enviar un formulario médico a la Junta Asesora Médica
    C: Usar un bolígrafo de tinta permanente para escribir el nombre del medicamento
      en el reverso de la tarjeta
    D: Pegar una etiqueta de alerta médica en el frente de la tarjeta
  answer: C
  explanation: El DPS no imprime información médica en las licencias de conducir.
    Para agregar información médica, use un bolígrafo de tinta permanente y escriba
    el nombre del medicamento que puede causar una reacción alérgica en el reverso
    de su tarjeta.
- id: 66
  category: driver_responsibility
  question: Si elige registrarse como donante de órganos, ¿cómo se indicará esto en
    su licencia de conducir?
  choices:
    A: Se imprimirá un pequeño corazón con la palabra 'donor' (donante) en el frente
    B: Las palabras 'Organ Donor' (Donante de órganos) se imprimirán en rojo en el
      reverso
    C: Su licencia tendrá un fondo azul especial
    D: Se agregará un código médico a su historial de manejo
  answer: A
  explanation: Si elige ser donante de órganos, se imprimirá un pequeño corazón con
    la palabra 'donor' (donante) en el frente de la tarjeta.
- id: 67
  category: license_system
  question: ¿A qué edad se les brinda a los solicitantes de licencias de conducir
    en la oficina la oportunidad de completar una solicitud de registro de votantes?
  choices:
    A: 16 años
    B: 17 años y 10 meses
    C: 18 años
    D: 21 años
  answer: B
  explanation: A todos los solicitantes en la oficina que tienen al menos 17 años
    y 10 meses de edad se les brinda la oportunidad de completar una solicitud de
    registro de votantes.
- id: 68
  category: license_system
  question: ¿Quién se registra automáticamente en el servicio selectivo al emitirse
    una tarjeta de identificación o licencia de conducir?
  choices:
    A: Todos los solicitantes entre 18 y 25 años de edad
    B: Todos los hombres de 18 a 25 años de edad que son ciudadanos estadounidenses
      o inmigrantes
    C: Solo los ciudadanos estadounidenses varones que tienen exactamente 18 años
    D: Cualquier persona que solicite una licencia de conducir comercial (CDL)
  answer: B
  explanation: Todos los hombres de 18 a 25 años de edad que son ciudadanos estadounidenses
    o inmigrantes se registran automáticamente en el servicio selectivo al emitirse
    una tarjeta de identificación o licencia de conducir.
- id: 69
  category: license_system
  question: Al solicitar una licencia de conducir de Texas, ¿qué debe hacer con cualquier
    licencia de conducir válida de otro estado que posea actualmente?
  choices:
    A: Conservarla como una forma secundaria de identificación
    B: Entregarla
    C: Enviarla por correo de regreso al estado emisor
    D: Pagar una tarifa adicional para mantener ambas licencias activas
  answer: B
  explanation: Para solicitar una licencia de conducir de Texas, debe entregar cualquier
    licencia de conducir válida de otro estado.
- id: 70
  category: penalties_and_points
  question: ¿Cuál de las siguientes opciones se registrará como parte de su historial
    de manejo permanente?
  choices:
    A: Solo las condenas de tránsito que ocurran dentro del estado de Texas
    B: Multas de estacionamiento y de peaje
    C: Condenas por infracciones de tránsito en movimiento o choques, incluidos los
      registros de otros estados
    D: Contribuciones voluntarias realizadas durante la solicitud de la licencia
  answer: C
  explanation: Cualquier condena por infracciones de tránsito en movimiento o choques,
    incluidos los registros de condenas de otros estados, se registrará como parte
    de su historial de manejo permanente.
- id: 71
  category: driver_responsibility
  question: Al solicitar una licencia de conducir original, ¿qué debe proporcionar
    con respecto a la responsabilidad financiera?
  choices:
    A: Prueba de seguro médico
    B: Evidencia de seguro de vehículo o una declaración de que no posee un vehículo
      motorizado
    C: Un depósito de $500 al Departamento de Seguridad Pública
    D: Un informe de crédito que muestre un buen puntaje crediticio
  answer: B
  explanation: Al solicitar una licencia de conducir original, debe proporcionar evidencia
    de responsabilidad financiera o una declaración de que no posee un vehículo motorizado
    que requiera el mantenimiento de responsabilidad financiera.
- id: 72
  category: license_system
  question: ¿A cuál de los siguientes programas puede hacer una contribución monetaria
    voluntaria al solicitar una licencia de conducir?
  choices:
    A: El Fondo de Mantenimiento de Carreteras de Texas
    B: El Programa de Educación, Detección y Tratamiento de la Ceguera
    C: El Fondo de Transporte de Escuelas Públicas
    D: La Cuenta de Parques Estatales y Vida Silvestre
  answer: B
  explanation: Los solicitantes pueden contribuir voluntariamente a varios programas,
    incluido el Programa de Educación, Detección y Tratamiento de la Ceguera administrado
    por la Comisión para Ciegos de Texas.
- id: 73
  category: license_system
  question: ¿Cómo se maneja la tarifa administrativa de $1 si está completando múltiples
    transacciones de licencia de conducir al mismo tiempo en persona?
  choices:
    A: Se le cobra $1 por cada transacción por separado
    B: La tarifa se exime por completo para las visitas en persona
    C: Solo se le cobrará la tarifa administrativa de $1 una vez
    D: La tarifa aumenta a $5 para múltiples transacciones
  answer: C
  explanation: Si está completando múltiples transacciones al mismo tiempo, en persona,
    por teléfono o en línea, solo se le cobrará la tarifa administrativa de $1 una
    vez.
- id: 74
  category: driver_testing
  question: ¿Cuál es la puntuación mínima requerida para aprobar cualquier examen
    de conocimientos?
  choices:
    A: 75 por ciento
    B: 80 por ciento
    C: 70 por ciento
    D: 85 por ciento
  answer: C
  explanation: Debe obtener una calificación del 70 por ciento o más para aprobar
    cualquier examen de conocimientos.
- id: 75
  category: driver_testing
  question: ¿Por cuánto tiempo es válida una licencia de conducir temporal después
    de aprobar todos los exámenes correspondientes?
  choices:
    A: 30 días
    B: 45 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Después de haber aprobado todos los exámenes correspondientes, se le
    emitirá una licencia temporal, que puede usar durante 45 días o hasta que reciba
    su licencia permanente por correo.
- id: 76
  category: driver_responsibility
  question: ¿Qué debe presentar un nuevo residente de Texas al entregar una licencia
    de conducir de otro estado?
  choices:
    A: Un certificado de nacimiento y pasaporte
    B: Evidencia de que cada vehículo motorizado de su propiedad está registrado actualmente
      en Texas
    C: Un historial de manejo de su estado anterior
    D: Prueba de haber completado un curso de educación vial de Texas
  answer: B
  explanation: Un nuevo residente de Texas debe presentar, junto con la solicitud
    de licencia de conducir, evidencia de que cada vehículo motorizado propiedad de
    la persona está registrado actualmente en Texas, o indicar que no posee un vehículo
    motorizado.
- id: 77
  category: driver_testing
  question: ¿Qué sucede si no aprueba los exámenes de conocimientos y de manejo en
    su primer intento?
  choices:
    A: Debe pagar una nueva tarifa de inmediato
    B: Su solicitud se retendrá por 90 días
    C: Debe esperar un año antes de volver a presentar la solicitud
    D: Queda descalificado permanentemente para obtener una licencia
  answer: B
  explanation: Si no aprueba los exámenes de conocimientos y de manejo en su primer
    intento, su solicitud se retendrá por 90 días.
- id: 78
  category: driver_testing
  question: ¿A qué edad se requiere que las personas completen con éxito un curso
    de educación vial aprobado para solicitar una licencia?
  choices:
    A: Menores de 18 años
    B: Menores de 21 años
    C: Menores de 25 años
    D: Todos los solicitantes sin importar la edad
  answer: C
  explanation: Las personas menores de 25 años deben completar con éxito un curso
    de educación vial aprobado.
- id: 79
  category: license_system
  question: ¿Quién puede pedirle al DPS que cancele la licencia de un menor de 18
    años?
  choices:
    A: El director de una escuela
    B: La persona que firmó la solicitud bajo juramento
    C: Cualquier conductor con licencia mayor de 21 años
    D: Un oficial de la ley
  answer: B
  explanation: La persona que firma (padre, tutor, empleador o juez del condado) puede
    pedirle al DPS que cancele su licencia en cualquier momento antes de que cumpla
    18 años.
- id: 80
  category: driver_testing
  question: ¿Cuál de las siguientes acciones resultará en reprobar automáticamente
    su examen de manejo?
  choices:
    A: Que le deduzcan más de 10 puntos
    B: Pedirle al examinador que repita una instrucción
    C: Negarse a seguir las instrucciones
    D: Usar una cámara de reversa al estacionarse en paralelo
  answer: C
  explanation: 'Su solicitud de licencia no será aprobada si usted: 1. Viola la ley
    2. Se niega a seguir las instrucciones 3. Conduce peligrosamente o tiene un choque
    4. Le deducen más de 30 puntos.'
- id: 81
  category: vehicle_information
  question: Al tomar el examen de manejo, ¿cuál es la política con respecto al uso
    de tecnología de estacionamiento del vehículo?
  choices:
    A: Puede usar una función de estacionamiento automático del vehículo
    B: Puede usar una cámara de reversa, pero no una función de estacionamiento automático
      del vehículo
    C: No puede usar espejos ni cámaras
    D: Debe desactivar todos los sensores electrónicos
  answer: B
  explanation: Puede usar la cámara de reversa de su vehículo para estacionarse en
    paralelo; sin embargo, no se permitirá el uso de una función de estacionamiento
    automático del vehículo.
- id: 82
  category: safe_driving_rules
  question: Durante la parte de parada rápida del examen de manejo, ¿a qué velocidad
    se le puede pedir que detenga su automóvil lo más rápido posible?
  choices:
    A: Aproximadamente a 10 mph
    B: Aproximadamente a 20 mph
    C: Aproximadamente a 30 mph
    D: Aproximadamente a 40 mph
  answer: B
  explanation: 'Parada rápida: se le puede pedir que detenga su automóvil lo más rápido
    posible a aproximadamente 20 mph sin que las llantas patinen.'
- id: 83
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera condena por conducir sin licencia?
  choices:
    A: Una multa de hasta $200
    B: Una multa de $25 a $200
    C: Reclusión en la cárcel por hasta 30 días
    D: Una multa de hasta $4,000
  answer: A
  explanation: Según la tabla de Sanciones por Conducir sin Licencia, una primera
    condena resulta en una multa de hasta $200.
- id: 84
  category: penalties_and_points
  question: ¿Cuál es la sanción si un conductor opera un vehículo sin licencia y sin
    seguro, y causa un choque que resulta en lesiones corporales graves o la muerte?
  choices:
    A: Una multa de hasta $500
    B: Un delito menor de Clase C
    C: Un delito menor de Clase A castigado con una multa de hasta $4,000 y/o hasta
      365 días de cárcel
    D: Un delito grave castigado con hasta 5 años de prisión
  answer: C
  explanation: Conducir sin licencia, operar un vehículo sin seguro en el momento
    del delito, y que el conductor cause un choque que resulte en lesiones corporales
    graves o la muerte es un delito menor de Clase A castigado con una multa de hasta
    $4,000 y/o reclusión en la cárcel por no más de 365 días.
- id: 85
  category: driver_testing
  question: ¿Cuál de las siguientes NO es una de las cuatro habilidades básicas en
    las que se evalúa a todos los conductores durante el examen de manejo?
  choices:
    A: Control
    B: Observación
    C: Exceso de velocidad
    D: Posicionamiento
  answer: C
  explanation: 'Todos los conductores son evaluados en cuatro habilidades básicas:
    Control, Observación, Posicionamiento y Señalización.'
- id: 86
  category: driver_responsibility
  question: Si aprueba el examen de manejo, ¿a quién debe mostrar su licencia de conducir
    si se la solicitan?
  choices:
    A: Solo a un policía estatal
    B: A cualquier oficial de paz, juez o cualquier persona con la que esté involucrado
      en un choque
    C: A cualquier conductor con licencia que pida verla
    D: Solo a un juez o juez de paz
  answer: B
  explanation: 'Si aprueba el examen de manejo, lleve siempre su licencia con usted
    al conducir y, si se la solicitan, muéstrela a: 1. Cualquier oficial de paz, alguacil,
    agente de policía, juez, juez de paz o policía estatal. 2. Cualquier persona con
    la que esté involucrado en un choque.'
- id: 87
  category: driver_testing
  question: ¿Cuántas veces puede reprobar los exámenes de conocimientos y de manejo
    antes de que se requiera una nueva solicitud y el pago de la tarifa?
  choices:
    A: Dos veces
    B: Tres veces
    C: Cuatro veces
    D: Cinco veces
  answer: B
  explanation: Después de 90 días o tres exámenes reprobados, se requerirá una nueva
    solicitud y el pago de la tarifa.
- id: 88
  category: vehicle_information
  question: Al operar un vehículo de transmisión manual (estándar) durante el examen
    de manejo, ¿cuándo debe pisar el embrague (clutch) hasta el fondo?
  choices:
    A: Solo al arrancar el motor
    B: Siempre que conduzca a más de 30 mph
    C: Al arrancar el motor, cambiar de marcha, detenerse y cuando la velocidad baje
      de 10 mph
    D: Debe conducir con el pie apoyado en el embrague en todo momento
  answer: C
  explanation: En transmisiones manuales (estándar), pise el embrague (clutch) hasta
    el fondo al arrancar el motor, cambiar de marcha, al detenerse y una vez que su
    velocidad baje de 10 mph. No conduzca con el pie apoyado en el embrague.
- id: 89
  category: license_system
  question: ¿Cuántos días tiene para reportar un cambio de dirección al DPS de Texas?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Según el manual, un cambio de dirección debe ser reportado al DPS dentro
    de 30 días.
- id: 90
  category: license_system
  question: ¿Con qué frecuencia se debe renovar una licencia de conducir de Texas?
  choices:
    A: Cada 4 años
    B: Cada 6 años
    C: Cada 8 años
    D: Cada 10 años
  answer: C
  explanation: El manual establece que una licencia de conducir de Texas debe renovarse
    cada ocho años.
- id: 91
  category: license_system
  question: ¿Con qué frecuencia debe una persona presentarse en persona en una oficina
    de licencias de conducir para un examen de la vista y para actualizar su foto,
    firma y huellas dactilares?
  choices:
    A: Al menos una vez cada 8 años
    B: Al menos una vez cada 10 años
    C: Al menos una vez cada 12 años
    D: Al menos una vez cada 16 años
  answer: D
  explanation: Una persona debe presentarse en una oficina de licencias de conducir
    al menos una vez cada dieciséis (16) años para un examen de la vista y para actualizar
    la foto, la firma y las huellas dactilares.
- id: 92
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restablecimiento por una Revocación Administrativa
    de la Licencia (ALR, por sus siglas en inglés)?
  choices:
    A: $50
    B: $100
    C: $125
    D: $200
  answer: C
  explanation: El manual especifica que las Revocaciones Administrativas de la Licencia
    (ALR) requieren una tarifa de restablecimiento de $125.
- id: 93
  category: license_system
  question: ¿Cuál de los siguientes grupos de conductores NO es elegible para renovar
    su licencia de conducir utilizando métodos alternativos como en línea o por correo?
  choices:
    A: Conductores mayores de 50 años
    B: Titulares de una licencia de conducir comercial (CDL)
    C: Conductores que han tenido una licencia por más de 10 años
    D: Personal militar en servicio activo
  answer: B
  explanation: Los métodos alternativos de renovación no se extenderán a los titulares
    de una licencia de conducir comercial (CDL), entre otros grupos específicos.
- id: 94
  category: penalties_and_points
  question: 'Bajo las Suspensiones y Revocaciones Administrativas, su licencia puede
    ser suspendida por infracciones de tránsito repetidas si usted tiene:'
  choices:
    A: Dos o más condenas de tránsito dentro de cualquier período de 12 meses
    B: Tres o más condenas de tránsito dentro de cualquier período de 24 meses
    C: Cuatro o más condenas de tránsito que ocurran por separado dentro de cualquier
      período de 12 meses
    D: Cinco o más condenas de tránsito dentro de cualquier período de 24 meses
  answer: C
  explanation: El DPS tiene la autoridad de suspender o revocar una licencia por infracciones
    repetidas de las leyes de tránsito, incluyendo cuatro o más condenas de tránsito
    que ocurran por separado dentro de cualquier período de 12 meses.
- id: 95
  category: license_system
  question: Si regresa a Texas del servicio militar y su licencia ha estado vencida
    por más de dos años, ¿cuánto tiempo tiene después de ser dado de baja con honores
    para renovarla sin tomar los exámenes de conocimientos y de manejo?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Dentro de los 90 días posteriores a ser dados de baja con honores,
    el personal militar que regresa del servicio activo puede presentar sus documentos
    de separación para obtener una renovación sin tomar los exámenes cuando la licencia
    ha estado vencida por más de dos años.
- id: 96
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resultará en una suspensión automática
    de los privilegios de conducir para personas menores de 21 años?
  choices:
    A: No completar una clase de concientización sobre el tabaco cuando se requiera
    B: Estacionarse en una zona de carga
    C: Conducir con el registro del vehículo vencido
    D: No usar el cinturón de seguridad
  answer: A
  explanation: Para las personas menores de 21 años, no completar una clase de concientización
    sobre el tabaco cuando se requiera es una Infracción del Código de Salud y Seguridad
    que resultará en la suspensión automática del privilegio de conducir.
- id: 97
  category: license_system
  question: ¿Qué debe hacer para cambiar información en su licencia de conducir que
    no sea su dirección?
  choices:
    A: Enviar por correo un formulario DL-64 completado
    B: Visitar una oficina de licencias de conducir
    C: Llamar a la línea directa del DPS
    D: Actualizarla a través del portal en línea
  answer: B
  explanation: 'El manual establece: ''Para cambiar cualquier otra información en
    su licencia de conducir o tarjeta de identificación, deberá visitar una oficina
    de licencias de conducir''.'
- id: 98
  category: license_system
  question: ¿Cuál es el propósito de una restricción impuesta en su licencia de conducir?
  choices:
    A: Castigarlo por infracciones de tránsito pasadas
    B: Aumentar el costo de su seguro de auto
    C: Hacerlo un conductor más seguro
    D: Limitar el número de pasajeros que puede llevar
  answer: C
  explanation: Se puede imponer una restricción en su licencia. Esto no tiene la intención
    de interferir con su conducción, sino de hacerlo un conductor más seguro.
- id: 99
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restablecimiento requerida por una suspensión por
    el Curso de Educación sobre Drogas?
  choices:
    A: $10
    B: $50
    C: $100
    D: $125
  answer: C
  explanation: El manual señala que hay una tarifa de restablecimiento de $100 por
    un Curso de Educación sobre Drogas.
- id: 100
  category: license_system
  question: Si un titular de una licencia de Texas elegible que se encuentra fuera
    del estado la renueva por correo, ¿por cuánto tiempo es válida la licencia renovada
    una vez que regresa a Texas?
  choices:
    A: Hasta 30 días después de regresar a Texas
    B: Hasta 60 días después de regresar a Texas
    C: Hasta 90 días después de regresar a Texas o hasta la fecha de vencimiento,
      lo que ocurra primero
    D: Hasta 180 días después de regresar a Texas
  answer: C
  explanation: Para los titulares de licencias de Texas fuera del estado que renuevan
    por correo, la licencia será renovada y válida hasta la fecha de vencimiento indicada
    o hasta 90 días después de su regreso a Texas, lo que ocurra primero.
- id: 101
  category: penalties_and_points
  question: ¿Cuál de las siguientes se considera una razón para una Suspensión o Revocación
    Administrativa en lugar de una Suspensión Obligatoria automática?
  choices:
    A: Conducir en estado de ebriedad (DWI) por el uso de alcohol o drogas
    B: Homicidio por intoxicación o agresión por intoxicación
    C: Causar un choque grave mientras se conduce un vehículo motorizado
    D: Alcanzar y rebasar un autobús escolar (condena posterior)
  answer: C
  explanation: Causar un choque grave mientras se conduce un vehículo motorizado está
    catalogado bajo las Suspensiones y Revocaciones Administrativas, mientras que
    el DWI, el homicidio por intoxicación y rebasar un autobús escolar son Suspensiones
    Obligatorias.
- id: 102
  category: alcohol_drugs_health
  question: 'Bajo la ley de Revocación Administrativa de Licencias (ALR), el DPS está
    autorizado a suspender la licencia de una persona mayor de 21 años que no pase
    una prueba de aliento o sangre que indique una concentración de alcohol en la
    sangre (BAC) de al menos:'
  choices:
    A: '0.02'
    B: '0.04'
    C: '0.08'
    D: '0.10'
  answer: C
  explanation: El DPS está autorizado a suspender la licencia de las personas mayores
    de 21 años que no pasen una prueba de aliento o sangre que indique un nivel de
    BAC de 0.08 o más.
- id: 103
  category: alcohol_drugs_health
  question: Para las personas menores de 21 años, ¿por qué cantidad de alcohol está
    autorizado el DPS a suspender una licencia o privilegio de conducir bajo la ley
    ALR?
  choices:
    A: Un BAC de 0.08 o más
    B: Un BAC de 0.04 o más
    C: Un BAC de 0.02 o más
    D: Cualquier cantidad detectable de alcohol
  answer: D
  explanation: El DPS está autorizado a suspender la licencia de las personas menores
    de 21 años por cualquier cantidad detectable de alcohol.
- id: 104
  category: license_system
  question: ¿Cuál de las siguientes situaciones requiere la cancelación de una licencia
    de conducir o tarjeta de identificación?
  choices:
    A: Recibir una sola multa por exceso de velocidad
    B: Educación vial incompleta
    C: Estacionarse en una zona para discapacitados sin un permiso
    D: No usar el cinturón de seguridad
  answer: B
  explanation: Los casos que requieren la cancelación de una licencia de conducir
    o tarjeta de identificación incluyen educación vial incompleta, declaraciones
    falsas en una solicitud y el retiro de la autorización de los padres para los
    menores.
- id: 105
  category: penalties_and_points
  question: Al recibir una orden judicial, ¿por cuál de las siguientes razones el
    DPS suspenderá, revocará o cancelará una licencia o privilegio de conducir?
  choices:
    A: Manutención infantil atrasada
    B: Acumular dos multas de estacionamiento
    C: Conducir 5 mph por encima del límite de velocidad
    D: No ceder el paso en una señal de ceda el paso
  answer: A
  explanation: Al recibir una orden judicial, el DPS suspenderá, revocará o cancelará
    una licencia por manutención infantil atrasada, entre otras razones como estar
    mentalmente incapacitado o ser químicamente dependiente.
- id: 106
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de conducir un vehículo
    motorizado mientras su licencia de conducir está suspendida, cancelada, denegada
    o revocada (DWLI) sin ningún factor agravante?
  choices:
    A: Delito menor de Clase A, sancionable con una multa de hasta $4,000
    B: Delito menor de Clase B, sancionable con una multa de hasta $2,000
    C: Delito menor de Clase C, sancionable con una multa de hasta $500
    D: Una multa de $125 y 10 horas de servicio comunitario
  answer: C
  explanation: Conducir mientras una licencia está suspendida, cancelada, denegada
    o revocada es un delito menor de Clase C, sancionable con una multa de hasta $500.
- id: 107
  category: penalties_and_points
  question: 'Conducir con una Licencia Inválida (DWLI) se convierte en un delito menor
    de Clase A sancionable con una multa de hasta $4,000 y/o hasta 365 días en la
    cárcel si la persona conducía sin seguro y:'
  choices:
    A: Fue sorprendida conduciendo a más de 20 mph por encima del límite de velocidad
    B: Causó un choque que resultó en lesiones corporales graves o la muerte de otra
      persona
    C: Se negó a someterse a una prueba de alcoholemia
    D: Tenía una condena previa por exactamente la misma infracción
  answer: B
  explanation: El DWLI es un delito menor de Clase A si la persona conducía sin seguro
    en el momento de la infracción y causó un choque que resultó en lesiones corporales
    graves o la muerte de otra persona.
- id: 108
  category: alcohol_drugs_health
  question: Para una primera infracción relacionada con el alcohol no vinculada a
    la conducción por parte de un menor, ¿por cuánto tiempo se suspenderá su licencia
    de conducir (o se denegará el privilegio)?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: A
  explanation: Por una primera infracción relacionada con el alcohol no vinculada
    a la conducción por parte de un menor, la licencia de conducir será suspendida
    (o el privilegio denegado si no tiene licencia) por 30 días.
- id: 109
  category: penalties_and_points
  question: ¿Cuál es la sanción por una tercera infracción relacionada con el alcohol
    no vinculada a la conducción para un menor que tiene al menos 17 años de edad
    pero menos de 21?
  choices:
    A: Delito menor de Clase C con una suspensión de 30 días
    B: Delito menor de Clase C con una suspensión de 60 días
    C: Delito menor de Clase B sancionable con una multa de $250 a $2,000 y una suspensión
      de 180 días
    D: Delito menor de Clase A sancionable con una multa de hasta $4,000 y una suspensión
      de 365 días
  answer: C
  explanation: Una tercera infracción para un menor de al menos 17 años pero menor
    de 21 es un delito menor de Clase B sancionable con una multa de $250 a $2,000,
    y la licencia de conducir será suspendida por 180 días.
- id: 110
  category: penalties_and_points
  question: ¿Cuál es la sanción para una persona que compra, proporciona o vende una
    bebida alcohólica a un menor?
  choices:
    A: Una multa de hasta $500 y 20 horas de servicio comunitario
    B: Una multa de hasta $2,000 y/o reclusión en la cárcel por hasta 180 días
    C: Una multa de hasta $4,000 y/o reclusión en la cárcel por hasta un año
    D: Una suspensión obligatoria de la licencia de conducir de 180 días
  answer: C
  explanation: Una persona que compra, proporciona o vende una bebida alcohólica a
    un menor está sujeta a una multa de hasta $4,000 y/o reclusión en la cárcel por
    hasta un año.
- id: 111
  category: license_system
  question: ¿Qué es una licencia ocupacional (también llamada licencia de necesidad
    esencial)?
  choices:
    A: Una licencia emitida exclusivamente para conductores de camiones comerciales
    B: Una licencia restringida especial para personas cuya licencia ha sido suspendida
      o revocada, pero que pueden demostrar una necesidad esencial para conducir
    C: Una licencia que permite a los menores conducir de ida y vuelta a la escuela
    D: Un permiso temporal emitido mientras se espera una tarjeta de identificación
      permanente por correo
  answer: B
  explanation: Una licencia ocupacional es un tipo especial de licencia restringida
    que se emite a personas cuya licencia de conducir ha sido cancelada, suspendida,
    revocada o denegada, y que pueden demostrar ante un tribunal que existe una necesidad
    esencial para conducir.
- id: 112
  category: license_system
  question: ¿Cuál es la tarifa de una licencia ocupacional si se autoriza por un año?
  choices:
    A: $10
    B: $20
    C: $50
    D: $125
  answer: A
  explanation: La tarifa de una licencia ocupacional es de $10 por un año o $20 si
    se autoriza por dos años.
- id: 113
  category: license_system
  question: ¿Por cuánto tiempo se puede usar la orden judicial de una licencia ocupacional
    para conducir mientras se procesa la licencia oficial?
  choices:
    A: 10 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: C
  explanation: La orden judicial se puede usar durante 45 días para conducir mientras
    se procesa la licencia ocupacional.
- id: 114
  category: license_system
  question: ¿Qué tipo de vehículo NO se puede conducir con una licencia ocupacional?
  choices:
    A: Un automóvil de pasajeros
    B: Una camioneta (pickup)
    C: Un vehículo de motor comercial
    D: Un vehículo utilitario deportivo (SUV)
  answer: C
  explanation: El manual establece que no se puede emitir una licencia ocupacional
    para conducir un vehículo de motor comercial.
- id: 115
  category: license_system
  question: ¿Por cuál de las siguientes razones está autorizado el DPS a denegar la
    emisión de una licencia de conducir a un solicitante?
  choices:
    A: Adquirir combustible para vehículos de motor sin pagar
    B: Recibir una sola infracción de estacionamiento
    C: No registrarse para votar
    D: Tener seguro de vehículo de otro estado
  answer: A
  explanation: A un solicitante se le puede denegar la licencia de conducir por adquirir
    combustible para vehículos de motor sin pagar, entre otras razones como manutención
    infantil atrasada o ciertos delitos de daños a la propiedad (criminal mischief).
- id: 116
  category: vehicle_information
  question: Para fines de registro, ¿por cuánto tiempo es válido un Reporte de Inspección
    de Vehículos (VIR) aprobado?
  choices:
    A: 30 días a partir del mes de inspección
    B: 60 días a partir del mes de inspección
    C: 90 días a partir del mes de inspección
    D: 1 año a partir del mes de inspección
  answer: C
  explanation: El VIR solo es válido por 90 días a partir del mes de inspección para
    fines de registro.
- id: 117
  category: vehicle_information
  question: ¿A qué velocidad debe viajar un vehículo para que su freno de pie pueda
    detener el automóvil en una distancia de 25 pies?
  choices:
    A: 10 mph
    B: 20 mph
    C: 30 mph
    D: 40 mph
  answer: B
  explanation: El freno de pie debe detener el automóvil en una distancia de 25 pies
    a una velocidad de 20 mph.
- id: 118
  category: vehicle_information
  question: 'La bocina (claxon) de un vehículo debe poder escucharse a una distancia
    mínima de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las bocinas deben escucharse a una distancia mínima de 200 pies.
- id: 119
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima requerida de la banda de rodadura para
    las llantas de un vehículo?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 3/32 de pulgada
    D: 4/32 de pulgada
  answer: B
  explanation: Se requiere que todos los vehículos tengan llantas en condiciones adecuadas
    y seguras con una profundidad mínima de 2/32 de pulgada.
- id: 120
  category: signs_and_signals
  question: Un emblema de vehículo de movimiento lento debe mostrarse en ciertos vehículos,
    como tractores agrícolas, que están destinados a viajar a qué velocidad o menos?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: Los tractores y maquinaria agrícola, maquinaria de construcción de
    carreteras, vehículos tirados por animales y ciertos otros vehículos de motor
    destinados a viajar a 25 mph o menos deben mostrar el emblema de vehículo de movimiento
    lento.
- id: 121
  category: vehicle_information
  question: ¿Es ilegal tener cualquier objeto que sobresalga más de cuántas pulgadas
    más allá del lado izquierdo de la carrocería, el estribo o los guardabarros de
    su vehículo?
  choices:
    A: 2 pulgadas
    B: 3 pulgadas
    C: 5 pulgadas
    D: 6 pulgadas
  answer: B
  explanation: No debe tener nada que sobresalga más de tres pulgadas más allá del
    lado izquierdo o seis pulgadas más allá del lado derecho de la carrocería, el
    estribo o los guardabarros de su vehículo.
- id: 122
  category: vehicle_information
  question: ¿Cuál de las siguientes opciones se considera insegura y NO está permitida
    en un vehículo de pasajeros estándar?
  choices:
    A: Una luz roja visible desde la parte delantera
    B: Una luz blanca en la placa de matrícula
    C: Luces de estacionamiento de color ámbar en la parte delantera
    D: Dos luces de marcha atrás
  answer: A
  explanation: Una luz roja visible desde la parte delantera se considera insegura
    y no está permitida, excepto en un vehículo de emergencia.
- id: 123
  category: vehicle_information
  question: ¿Cuál es el requisito del estado con respecto a la distancia mínima al
    suelo para un vehículo modificado?
  choices:
    A: La carrocería debe estar al menos a 6 pulgadas del suelo.
    B: La carrocería no debe estar por debajo de la parte más baja de los rines de
      las ruedas.
    C: El vehículo debe tener al menos 10 pulgadas de espacio libre.
    D: Los parachoques deben estar al menos a 16 pulgadas de la superficie de la carretera.
  answer: B
  explanation: Un vehículo no debe ser modificado ni llevar peso de tal manera que
    la carrocería quede por debajo de la parte más baja de los rines de las ruedas.
- id: 124
  category: safe_driving_rules
  question: ¿Cuándo es ilegal usar las luces de marcha atrás de su vehículo?
  choices:
    A: Al estacionar en un área oscura
    B: Cuando el vehículo está en movimiento hacia adelante
    C: Al retroceder para salir de una entrada de vehículos
    D: Al advertir sobre peligros de tráfico inusuales
  answer: B
  explanation: Se permiten dos luces de marcha atrás por separado o en combinación
    con otras luces, pero no debe usarlas cuando el vehículo está en movimiento hacia
    adelante.
- id: 125
  category: license_system
  question: ¿Cuántos días tiene un propietario para registrar un vehículo recién comprado?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Un propietario debe registrar un vehículo recién comprado dentro de
    los 30 días posteriores a la compra.
- id: 126
  category: license_system
  question: ¿Por cuánto tiempo se reconocen como válidas las placas temporales del
    comprador (temporary tags)?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Las placas temporales del comprador son reconocidas por 60 días.
- id: 127
  category: vehicle_information
  question: 'El espejo retrovisor de un vehículo debe poder reflejar una vista de
    la carretera por una distancia de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: Un espejo retrovisor debe poder reflejar una vista de la carretera
    por una distancia de al menos 200 pies hacia la parte trasera del vehículo.
- id: 128
  category: vehicle_information
  question: ¿A qué altura deben colocarse los dos reflectores rojos en la parte trasera
    de un vehículo?
  choices:
    A: 10 a 40 pulgadas
    B: 15 a 60 pulgadas
    C: 20 a 70 pulgadas
    D: 24 a 80 pulgadas
  answer: B
  explanation: Los reflectores deben colocarse a una altura de 15 a 60 pulgadas y
    ser visibles hasta a 600 pies de distancia.
- id: 129
  category: vehicle_information
  question: ¿Cuál de los siguientes dispositivos está estrictamente prohibido en su
    vehículo?
  choices:
    A: Un dispositivo de interferencia de radar
    B: Un sistema de navegación GPS
    C: Una cámara de tablero
    D: Un dispositivo de comunicación manos libres
  answer: A
  explanation: No se permite un dispositivo de interferencia de radar diseñado, fabricado,
    utilizado o destinado a interferir, codificar, interrumpir o causar el mal funcionamiento
    de un dispositivo de radar o láser utilizado para medir la velocidad de un vehículo.
- id: 130
  category: vehicle_information
  question: ¿Para cuál de los siguientes propósitos NO se puede utilizar un vehículo
    registrado para uso agrícola?
  choices:
    A: Asistir a la iglesia o a la escuela
    B: Visitar médicos para recibir tratamiento médico
    C: Empleo remunerado
    D: Transportar a miembros de la familia para necesidades del hogar
  answer: C
  explanation: El manual establece que los vehículos registrados para uso agrícola
    pueden usarse para necesidades familiares como visitas a la iglesia, la escuela
    o el médico, pero no pueden usarse para un empleo remunerado.
- id: 131
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos NO requiere ser registrado o inspeccionado
    cuando se opera temporalmente en las carreteras?
  choices:
    A: Automóviles de pasajeros
    B: Barredoras mecánicas
    C: Camiones de reparto comercial
    D: Motocicletas
  answer: B
  explanation: Las barredoras mecánicas están incluidas en la lista de vehículos que
    no requieren ser registrados, inspeccionados ni mostrar una placa de matrícula
    cuando se operan temporalmente en las carreteras.
- id: 132
  category: license_system
  question: ¿Cuántos días tiene un no residente para registrar su vehículo en Texas
    después de establecer su residencia o comenzar un empleo remunerado?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Cuando un no residente establece su residencia en Texas o comienza
    un empleo remunerado, su vehículo puede ser operado durante 30 días. Después de
    30 días, el vehículo debe ser registrado en Texas.
- id: 133
  category: license_system
  question: ¿Qué debe hacer un nuevo residente de Texas antes de solicitar una licencia
    de conducir de Texas?
  choices:
    A: Registrar cada vehículo que posea
    B: Entregar sus placas de matrícula de otro estado
    C: Completar un curso de manejo defensivo
    D: Pagar un depósito de $55,000 al contralor del estado
  answer: A
  explanation: Un nuevo residente de Texas debe registrar cada vehículo que posea
    antes de solicitar una licencia de conducir de Texas.
- id: 134
  category: driver_responsibility
  question: ¿Cuál es la cantidad mínima de seguro de responsabilidad civil requerida
    contra daños a la propiedad en Texas?
  choices:
    A: $15,000
    B: $25,000
    C: $30,000
    D: $60,000
  answer: B
  explanation: A partir del 1 de enero de 2011, la cantidad mínima de seguro de responsabilidad
    civil incluye $25,000 contra daños a la propiedad.
- id: 135
  category: driver_responsibility
  question: Según la Ley de Responsabilidad de Seguridad de Vehículos Motorizados
    de Texas, ¿cuál es el seguro de responsabilidad civil mínimo requerido contra
    lesiones o muerte de dos o más personas?
  choices:
    A: $25,000
    B: $30,000
    C: $50,000
    D: $60,000
  answer: D
  explanation: La cantidad mínima de seguro de responsabilidad civil incluye $60,000
    contra lesiones o muerte de dos o más personas.
- id: 136
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una forma aceptable de evidencia de responsabilidad
    financiera en Texas?
  choices:
    A: Una promesa verbal de pagar por los daños
    B: Un certificado que muestre un depósito de $55,000 con el contralor del estado
    C: Una licencia de conducir válida de Texas
    D: Un informe de inspección del vehículo
  answer: B
  explanation: La evidencia aceptada de responsabilidad financiera incluye un certificado
    emitido por el contralor del estado que demuestre que el propietario tiene en
    depósito dinero o valores por al menos $55,000.
- id: 137
  category: penalties_and_points
  question: Si un conductor recibe una segunda condena por conducir sin evidencia
    de responsabilidad financiera, ¿por cuánto tiempo será incautado su vehículo?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: D
  explanation: Para una segunda condena y posteriores, el vehículo conducido u operado
    por la persona será incautado por 180 días, siempre que el acusado fuera propietario
    en el momento de la infracción y la condena.
- id: 138
  category: driver_responsibility
  question: ¿La licencia de conducir o el privilegio de conducir se suspenderá si
    un fallo judicial resultante de un choque no se ha cumplido dentro de cuántos
    días?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: El registro del vehículo, la licencia o el privilegio de conducir de
    un conductor se suspenderán si un fallo judicial resultante de un choque no se
    ha cumplido dentro de los 60 días posteriores al fallo.
- id: 139
  category: safe_driving_rules
  question: Cuando conduzca por un camino sin pavimentar que se cruza con un camino
    pavimentado, ¿qué debe hacer?
  choices:
    A: Ceder el derecho de paso a los vehículos que transitan por el camino pavimentado
    B: Tomar el derecho de paso si llega primero
    C: Ceder el paso solo a los vehículos que se acercan por la derecha
    D: Detenerse y esperar una señal de otros conductores
  answer: A
  explanation: Si conduce por un camino sin pavimentar que se cruza con un camino
    pavimentado, debe ceder el derecho de paso a los vehículos que transitan por el
    camino pavimentado.
- id: 140
  category: safe_driving_rules
  question: Si conduce por una carretera de uno o dos carriles que se cruza con una
    carretera dividida o una carretera con tres o más carriles, ¿quién tiene el derecho
    de paso?
  choices:
    A: El vehículo en la carretera de uno o dos carriles
    B: El vehículo que llega primero a la intersección
    C: Los vehículos que transitan por la carretera dividida o de tres o más carriles
    D: El vehículo que se acerca por la izquierda
  answer: C
  explanation: Debe ceder el derecho de paso a los vehículos que transitan por la
    carretera dividida o de tres (3) o más carriles cuando se cruza desde una carretera
    de uno o dos carriles.
- id: 141
  category: safe_driving_rules
  question: Al acercarse a una intersección no controlada por señales, semáforos,
    múltiples carriles o pavimento, ¿a qué vehículo debe cederle el derecho de paso?
  choices:
    A: A cualquier vehículo que se acerque por su izquierda
    B: A cualquier vehículo que se acerque por su derecha
    C: Al vehículo más grande en la intersección
    D: Al vehículo que viaje a la mayor velocidad
  answer: B
  explanation: Al acercarse a este tipo de intersección, ceda el derecho de paso a
    cualquier vehículo que haya entrado o se esté acercando a la intersección por
    su derecha.
- id: 142
  category: safe_driving_rules
  question: ¿Qué debe hacer al entrar a una calle desde un camino privado, callejón
    o entrada de vehículos?
  choices:
    A: Tocar la bocina y avanzar sin detenerse
    B: Detenerse antes de la acera y ceder el paso a todos los vehículos y peatones
      que se acerquen
    C: Ceder el paso solo a los vehículos, ya que los peatones deben cederle el paso
      a usted
    D: Acelerar rápidamente para incorporarse al tráfico
  answer: B
  explanation: Al entrar o cruzar un camino, calle o carretera desde un camino privado,
    callejón, edificio o entrada de vehículos, debe detenerse antes de la acera y
    ceder el derecho de paso a todos los vehículos y peatones que se acerquen.
- id: 143
  category: penalties_and_points
  question: ¿Cuál es la sanción si un conductor no cede el derecho de paso y causa
    lesiones corporales graves a otra persona?
  choices:
    A: Una multa de $175 a $350
    B: Una multa de $500 a $2,000
    C: Una multa de $1,000 a $4,000
    D: Una multa de $5,000 y la revocación de la licencia
  answer: C
  explanation: Si un conductor comete una infracción de tránsito por no ceder el derecho
    de paso y causa lesiones corporales graves a otra persona, la sanción es una multa
    de $1,000 a $4,000.
- id: 144
  category: safe_driving_rules
  question: 'Al acercarse a una intersección en forma de ''T'' desde una calle que
    termina en la intersección, usted debe:'
  choices:
    A: Mantener su velocidad e incorporarse al carril derecho.
    B: Detenerse y ceder el derecho de paso a los vehículos en la calle principal
      (calle de paso).
    C: Ceder el paso solo si hay una señal de alto o ceda el paso.
    D: Tomar el derecho de paso si va a girar a la derecha.
  answer: B
  explanation: Al acercarse a una intersección de una calle principal viajando desde
    una calle que termina en la intersección, debe detenerse y ceder el derecho de
    paso a los vehículos que transitan por la calle principal.
- id: 145
  category: sharing_the_road
  question: En una vía dividida en tres o más carriles con el tráfico moviéndose en
    la misma dirección, si un vehículo que entra a un carril desde la derecha se encuentra
    con un vehículo que entra al mismo carril desde la izquierda, ¿quién debe ceder
    el paso?
  choices:
    A: El vehículo que entra desde la derecha debe ceder el derecho de paso.
    B: El vehículo que entra desde la izquierda debe ceder el derecho de paso.
    C: Ambos vehículos deben detenerse y esperar a que el otro avance.
    D: El vehículo que viaja a mayor velocidad tiene el derecho de paso.
  answer: A
  explanation: En una vía dividida en tres o más carriles, un vehículo que entra a
    un carril de tráfico desde la derecha debe ceder el derecho de paso a un vehículo
    que entra al mismo carril de tráfico desde la izquierda.
- id: 146
  category: safe_driving_rules
  question: Al acercarse a un cruce de ferrocarril a nivel donde se aproxima un tren,
    ¿a qué distancia debe detener su vehículo?
  choices:
    A: Entre 10 y 30 pies del riel más cercano.
    B: Entre 15 y 50 pies del riel más cercano.
    C: Exactamente a 20 pies del riel más cercano.
    D: Al menos a 100 pies del riel más cercano.
  answer: B
  explanation: Al acercarse a un cruce de ferrocarril a nivel, debe detenerse entre
    15 y 50 pies del riel más cercano si se aproxima un tren, una señal advierte de
    un tren o la barrera del cruce está bajada.
- id: 147
  category: penalties_and_points
  question: ¿Cuál es la multa por no obedecer la ley con respecto a los cruces de
    ferrocarril a nivel?
  choices:
    A: De $50 a $200
    B: De $100 a $500
    C: De $200 a $1,000
    D: De $500 a $1,250
  answer: A
  explanation: Una persona que no obedece la ley con respecto a los cruces de ferrocarril
    a nivel está sujeta a una multa de $50 a $200.
- id: 148
  category: defensive_driving
  question: Si su automóvil se apaga en las vías del tren y se aproxima un tren, ¿cuál
    es la acción más segura?
  choices:
    A: Quedarse en el vehículo, abrocharse el cinturón de seguridad y llamar al 911
      de inmediato.
    B: Salir y correr en línea recta por las vías alejándose del tren.
    C: Salir rápidamente y correr hacia el tren que se aproxima, a un lado de las
      vías.
    D: Intentar encender el automóvil hasta que el tren esté a 500 pies, luego salir.
  answer: C
  explanation: Si se aproxima un tren y su vehículo está apagado, salga rápidamente
    y aléjese de las vías. Corra hacia el tren que se aproxima, a un lado de las vías,
    para evitar los escombros que salgan volando.
- id: 149
  category: sharing_the_road
  question: ¿A cuántos pies de distancia no se le permite seguir a un camión de bomberos
    que responde a una alarma o a una ambulancia cuando sus luces rojas intermitentes
    están encendidas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: No se le permite seguir a menos de 500 pies a un camión de bomberos
    que responde a una alarma o a una ambulancia cuando las luces rojas intermitentes
    están encendidas.
- id: 150
  category: safe_driving_rules
  question: 'Si se acerca a un vehículo de emergencia detenido con sus luces encendidas
    en una carretera con un límite de velocidad de 45 mph, y no puede desocupar el
    carril más cercano, usted debe:'
  choices:
    A: Reducir la velocidad a 25 mph o menos.
    B: Reducir la velocidad a 15 mph o menos.
    C: Reducir la velocidad a 5 mph o menos.
    D: Mantener su velocidad pero avanzar con extrema precaución.
  answer: A
  explanation: Si no puede desocupar el carril más cercano al vehículo de emergencia,
    debe reducir la velocidad a no más de 20 mph por debajo del límite de velocidad
    indicado cuando el límite de velocidad indicado sea de 25 mph o más. (45 mph -
    20 mph = 25 mph).
- id: 151
  category: sharing_the_road
  question: 'Cuando se acerque a un autobús escolar que muestre luces rojas intermitentes
    alternadas, debe detenerse y NO puede rebasarlo hasta que:'
  choices:
    A: Los niños hayan cruzado la calle de manera segura y llegado a la acera.
    B: Haya esperado al menos 60 segundos.
    C: El autobús haya reanudado la marcha, el conductor le indique que avance o las
      luces rojas dejen de parpadear.
    D: El conductor del autobús encienda las luces amarillas de advertencia de peligro.
  answer: C
  explanation: 'No rebase el autobús escolar hasta que: 1. El autobús escolar haya
    reanudado la marcha; 2. El conductor le indique que avance; o 3. Las luces rojas
    ya no estén parpadeando.'
- id: 152
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones NO está obligado a detenerse ante
    un autobús escolar?
  choices:
    A: Cuando viaja en dirección opuesta en una carretera de dos carriles.
    B: Cuando se encuentra en una carretera diferente o en una autopista de acceso
      controlado donde el autobús está en una zona de carga y no se permite el cruce
      de peatones.
    C: Cuando conduce un vehículo comercial o un vehículo de emergencia.
    D: Cuando el autobús está detenido en un cruce de ferrocarril con las luces de
      advertencia de peligro encendidas.
  answer: B
  explanation: No es necesario detenerse al pasar un autobús escolar en una carretera
    diferente o cuando se encuentra en una autopista de acceso controlado donde el
    autobús está detenido en una zona de carga y no se permite el cruce de peatones.
- id: 153
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera condena por no ceder el derecho de
    paso a un autobús escolar?
  choices:
    A: Una multa de $50 a $200.
    B: Una multa de $200 a $500.
    C: Una multa de $500 a $1,250.
    D: Una multa de $1,000 a $2,000.
  answer: C
  explanation: Según la Tabla 15, la sanción por una primera condena por no ceder
    el derecho de paso a un autobús escolar es una multa de $500 a $1,250.
- id: 154
  category: sharing_the_road
  question: Si un semáforo cambia a verde mientras un peatón todavía está en el cruce
    peatonal, ¿qué debe hacer?
  choices:
    A: Tocar la bocina para advertir al peatón que se dé prisa.
    B: Avanzar con cuidado alrededor del peatón.
    C: Ceder el derecho de paso al peatón para que termine de cruzar.
    D: El peatón debe regresar inmediatamente a la acera.
  answer: C
  explanation: Si el semáforo cambia después de que el peatón haya ingresado al cruce
    peatonal, de igual manera debe cederle el derecho de paso.
- id: 155
  category: signs_and_signals
  question: ¿Dónde se colocan las señales de 'Cruce Peatonal en la Calle' (In-Street
    Pedestrian Crossing)?
  choices:
    A: En el lado izquierdo o derecho de la carretera.
    B: Sobre la calzada en el cruce peatonal.
    C: En la carretera, en la ubicación del cruce peatonal sobre la línea central,
      en una línea de carril o en una isla central (mediana).
    D: 500 pies antes del cruce peatonal en el arcén derecho.
  answer: C
  explanation: Las señales de 'Cruce Peatonal en la Calle' se colocan en la carretera,
    en la ubicación del cruce peatonal sobre la línea central, en una línea de carril
    o en una isla central (mediana). No se colocarán en el lado izquierdo ni derecho
    de la carretera.
- id: 156
  category: signs_and_signals
  question: ¿Qué información se proporciona en la señal azul y blanca del Sistema
    de Notificación de Emergencias (ENS) en un cruce de ferrocarril?
  choices:
    A: El horario del tren y el límite de velocidad máxima.
    B: El número de contacto de emergencia del ferrocarril y el Número de Inventario
      Nacional de Cruces del USDOT.
    C: La distancia al hospital y a la estación de policía más cercanos.
    D: El monto de la multa por detenerse en las vías.
  answer: B
  explanation: La señal del ENS incluye el número de contacto de emergencia del ferrocarril
    y el Número de Inventario Nacional de Cruces del Departamento de Transporte de
    EE. UU. (USDOT), que identifica la ubicación exacta.
- id: 157
  category: signs_and_signals
  question: ¿Cuál es el propósito de las luces incrustadas en la calzada (in-roadway
    lights)?
  choices:
    A: Iluminar la carretera durante cortes de energía severos.
    B: Advertir a los usuarios de la vía que se acercan a una condición en o cerca
      de la carretera que podría requerir que disminuyan la velocidad o se detengan.
    C: Indicar el límite de velocidad en una zona escolar durante el horario activo.
    D: Guiar a los vehículos de emergencia al lugar de un accidente.
  answer: B
  explanation: Las luces incrustadas en la calzada son tipos especiales de luces instaladas
    en la superficie de la carretera para advertir a los usuarios de la vía que se
    acercan a una condición en o cerca de la carretera que tal vez no vean, lo que
    podría requerir que disminuyan la velocidad o se detengan por completo.
- id: 158
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a una luz roja fija en una intersección?
  choices:
    A: Detenerse solo si hay peatones presentes.
    B: Detenerse antes de ingresar al cruce peatonal o a la intersección.
    C: Disminuir la velocidad y avanzar con precaución.
    D: Ceder el paso al tráfico de la derecha y avanzar.
  answer: B
  explanation: 'El manual establece para una Luz Roja Fija (Detenerse): "Deténgase
    antes de ingresar al cruce peatonal o a la intersección".'
- id: 159
  category: safe_driving_rules
  question: Si un oficial de la ley está dirigiendo el tráfico y le indica que haga
    algo que normalmente se considera ilegal, ¿qué debe hacer?
  choices:
    A: Obedecer las señales de tráfico en lugar de al oficial.
    B: Pedirle al oficial una aclaración antes de avanzar.
    C: Obedecer al oficial de la ley en todo momento.
    D: Hacerse a un lado y esperar a que el oficial se vaya.
  answer: C
  explanation: 'El manual establece: "Debe obedecer a un oficial de la ley en todo
    momento cuando esté dirigiendo el tráfico, incluso si le está indicando que haga
    algo que normalmente se considera ilegal".'
- id: 160
  category: signs_and_signals
  question: ¿Qué indica una flecha amarilla intermitente para dar vuelta a la izquierda?
  choices:
    A: Tiene el derecho de paso para dar vuelta a la izquierda.
    B: No se le permite dar vuelta a la izquierda.
    C: Puede dar vuelta a la izquierda, pero debe ceder el derecho de paso al tráfico
      en sentido contrario.
    D: Debe detenerse por completo antes de dar vuelta a la izquierda.
  answer: C
  explanation: Según el manual, "Una flecha amarilla intermitente permite a un conductor
    dar vuelta a la izquierda, pero el conductor debe ceder el derecho de paso al
    tráfico en sentido contrario".
- id: 161
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico marrón?
  choices:
    A: Guía de servicios para automovilistas
    B: Guía de recreación pública y lugares pintorescos
    C: Advertencia de construcción y mantenimiento
    D: Advertencia general o precaución
  answer: B
  explanation: La tabla de Colores Estándar describe que las señales marrones indican
    "Guía de recreación pública y lugares pintorescos".
- id: 162
  category: signs_and_signals
  question: ¿Qué forma de señal se utiliza exclusivamente para advertir sobre peligros
    existentes o posibles en las carreteras o áreas adyacentes?
  choices:
    A: Diamante
    B: Pentágono
    C: Banderín
    D: Redonda
  answer: A
  explanation: La tabla de Señales por Forma establece que la forma de Diamante es
    "Exclusivamente para advertir sobre peligros existentes o posibles en las carreteras
    o áreas adyacentes".
- id: 163
  category: signs_and_signals
  question: ¿Qué tipo de señal tiene forma de banderín?
  choices:
    A: Advertencia anticipada de zona escolar
    B: Señal de ceder el paso
    C: Advertencia anticipada de zonas de no adelantar
    D: Advertencia anticipada de cruce de ferrocarril
  answer: C
  explanation: La tabla de Señales por Forma indica que la forma de Banderín se utiliza
    para la "Advertencia anticipada de zonas de no adelantar".
- id: 164
  category: signs_and_signals
  question: Cuando se encuentra con una señal de advertencia, ¿cuál es una de las
    acciones que debe tomar?
  choices:
    A: Detenerse inmediatamente
    B: Reducir la velocidad al menos a la indicada en las señales de velocidad
    C: Tocar la bocina para alertar a otros
    D: Detenerse a un lado en el arcén
  answer: B
  explanation: 'El manual establece que cuando se encuentra con una señal de advertencia,
    debe: "1. Prestar atención 2. Seguir las instrucciones 3. Reducir la velocidad
    al menos a la indicada en las señales de velocidad".'
- id: 165
  category: defensive_driving
  question: Al conducir en una carretera mojada y acercarse a una señal que le advierte
    que disminuya la velocidad, ¿qué acciones debe evitar?
  choices:
    A: Usar los limpiaparabrisas
    B: Girar, acelerar o detenerse repentinamente
    C: Revisar el espejo retrovisor
    D: Conducir en el carril derecho
  answer: B
  explanation: 'La descripción de la señal de advertencia de carretera mojada aconseja:
    "Disminuya la velocidad en carretera mojada. No gire, acelere ni se detenga repentinamente".'
- id: 166
  category: defensive_driving
  question: ¿Cómo debe conducir cuando ve una señal de advertencia que indica que
    la superficie de la carretera está cubierta de grava suelta?
  choices:
    A: Acelerar para mantener la tracción
    B: Aplicar los frenos repentinamente si comienza a resbalar
    C: Ir lo suficientemente despacio para mantener el control total y no hacer giros
      bruscos
    D: Cambiar a marcha neutral
  answer: C
  explanation: 'El manual establece para la grava suelta: "Vaya lo suficientemente
    despacio para mantener el control total de su vehículo. No aplique los frenos
    repentinamente ni haga giros bruscos".'
- id: 167
  category: safe_driving_rules
  question: ¿Por qué debe tener extrema precaución para evitar salirse de la parte
    pavimentada de la carretera cuando hay una señal de arcén blando (soft shoulder)?
  choices:
    A: La tierra al lado del pavimento es blanda y puede hacer que pierda el control.
    B: Hay zanjas ocultas que dañarán sus neumáticos.
    C: Los peatones caminan con frecuencia por los arcenes blandos.
    D: Es ilegal conducir por el arcén bajo cualquier circunstancia.
  answer: A
  explanation: El manual explica que para un arcén blando, debe "Tener extrema precaución
    para evitar salirse de la parte pavimentada de la carretera, porque la tierra
    al lado del pavimento es blanda y puede hacer que pierda el control del automóvil".
- id: 168
  category: sharing_the_road
  question: ¿Por qué a veces el pavimento está ranurado y quién debe tener especial
    precaución al encontrarlo?
  choices:
    A: Para reducir el ruido; los camiones grandes deben tener precaución.
    B: Para disminuir la posibilidad de pavimento resbaladizo en clima húmedo; los
      motociclistas deben tener precaución.
    C: Para frenar a los vehículos que van a exceso de velocidad; los autos deportivos
      deben tener precaución.
    D: Para marcar los cruces peatonales; los ciclistas deben tener precaución.
  answer: B
  explanation: 'El manual establece: "El pavimento ha sido ranurado para disminuir
    la posibilidad de pavimento resbaladizo en clima húmedo. Los motociclistas deben
    tener precaución".'
- id: 169
  category: vehicle_information
  question: ¿Qué acción puede ser necesaria cuando ve una señal de advertencia que
    indica que se acerca a una pendiente descendente?
  choices:
    A: Cambiar a una marcha más alta para ahorrar combustible.
    B: Apagar el motor para evitar el sobrecalentamiento.
    C: Usar una marcha más baja para frenar su vehículo.
    D: Aplicar el freno de estacionamiento ligeramente.
  answer: C
  explanation: 'El manual aconseja para una pendiente descendente: "Se está acercando
    a una pendiente descendente; todos los conductores deben acercarse con precaución.
    Puede ser necesario usar una marcha más baja para frenar su vehículo".'
- id: 170
  category: signs_and_signals
  question: ¿Qué significa si se muestra una flecha verde al mismo tiempo que una
    luz roja?
  choices:
    A: Debe detenerse y esperar una luz verde fija antes de girar.
    B: Puede avanzar con cuidado en la dirección de la flecha después de ceder el
      paso a otros vehículos y peatones.
    C: El semáforo está funcionando mal y debe tratarse como una parada de cuatro
      vías.
    D: Solo puede seguir recto, pero no puede girar.
  answer: B
  explanation: 'El manual establece: "Una flecha verde mostrada al mismo tiempo que
    una luz roja significa que el conductor puede avanzar con cuidado en la dirección
    de la flecha después de ceder el paso a otros vehículos y peatones".'
- id: 171
  category: signs_and_signals
  question: ¿Qué forma se utiliza exclusivamente para las señales de alto (stop)?
  choices:
    A: Pentágono
    B: Octágono
    C: Triángulo equilátero
    D: Rectángulo vertical
  answer: B
  explanation: La tabla de Señales por Forma enumera "Octágono" con la descripción
    "Exclusivamente para señales de alto".
- id: 172
  category: safe_driving_rules
  question: Cuando ve una señal de advertencia que indica que dos carreteras se unen
    y comienza un carril adicional, ¿qué debe hacer?
  choices:
    A: Debe incorporarse inmediatamente al carril izquierdo.
    B: Debe detenerse por completo antes de entrar al nuevo carril.
    C: No está obligado a incorporarse, pero debe estar atento al tráfico en el nuevo
      carril.
    D: Debe ceder el paso a todos los vehículos en el carril adyacente.
  answer: C
  explanation: 'El manual describe la señal de carril adicional: "Se aproxima a un
    punto donde dos carreteras se unen y comienza un carril adicional. No está obligado
    a incorporarse. Esté atento al tráfico en el nuevo carril".'
- id: 173
  category: safe_driving_rules
  question: En una vía con múltiples carriles que viajan en la misma dirección, ¿para
    qué está destinado el carril del extremo izquierdo?
  choices:
    A: Tráfico más lento
    B: Solo para rebasar
    C: Paradas de emergencia
    D: Solo para vehículos compartidos (carpool)
  answer: B
  explanation: Según el manual, en vías con más de un carril con vehículos que viajan
    en la misma dirección, el tráfico más lento debe circular por un carril que no
    sea el del extremo izquierdo. El carril del extremo izquierdo es solo para rebasar.
- id: 174
  category: safe_driving_rules
  question: ¿Cuándo está permitido usar el carril central de giro para rebasar a otros
    vehículos?
  choices:
    A: Cuando el tráfico se mueve por debajo del límite de velocidad publicado
    B: Solo durante las horas de luz del día
    C: Cuando el carril derecho está bloqueado por obras
    D: Nunca debe usarse para rebasar
  answer: D
  explanation: El manual establece que el carril central solo se usa para vehículos
    que giran a la izquierda, y nunca debe usarse para rebasar o avanzar entre el
    tráfico.
- id: 175
  category: safe_driving_rules
  question: Cuando se le requiere detenerse en un cruce de ferrocarril, ¿cuál es la
    distancia de parada correcta desde el riel más cercano?
  choices:
    A: Entre 5 y 10 pies
    B: Entre 15 y 50 pies
    C: Entre 50 y 100 pies
    D: Al menos a 100 pies de distancia
  answer: B
  explanation: En los cruces de ferrocarril, debe detenerse a una distancia de entre
    15 y 50 pies del riel más cercano cuando se lo indique un abanderado, cuando haya
    luces rojas intermitentes o cuando un dispositivo de advertencia le indique que
    se acerca un tren.
- id: 176
  category: signs_and_signals
  question: ¿Qué indica una 'X' amarilla fija en una señal de control de uso de carril
    elevada?
  choices:
    A: Se le permite conducir en el carril
    B: Debe detenerse inmediatamente en ese carril
    C: Debe prepararse para despejar el carril de manera segura
    D: El carril está reservado solo para giros a la izquierda
  answer: C
  explanation: Una X amarilla fija significa que el conductor debe prepararse para
    despejar de manera segura el carril sobre el cual se encuentra la señal, ya que
    se está realizando un cambio en el control del carril.
- id: 177
  category: safe_driving_rules
  question: ¿Qué restricción se aplica al uso de dispositivos de comunicación inalámbrica
    en una zona escolar?
  choices:
    A: Solo pueden usarse con un accesorio de manos libres
    B: Su uso está completamente prohibido
    C: Pueden usarse si se conduce a menos de 15 mph
    D: Están permitidos para enviar mensajes de texto pero no para llamar
  answer: B
  explanation: El manual establece explícitamente que el uso de un dispositivo de
    comunicación inalámbrica está prohibido en la zona escolar.
- id: 178
  category: safe_driving_rules
  question: Si dos vehículos llegan a una intersección de parada en todas las direcciones
    (all-way stop) exactamente al mismo tiempo, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo que gira a la izquierda
    B: El vehículo de la izquierda
    C: El vehículo de la derecha
    D: El vehículo más grande
  answer: C
  explanation: En una intersección donde todo el tráfico que se aproxima debe detenerse,
    si dos vehículos llegan al mismo tiempo, debe ceder el paso al vehículo que está
    a su derecha.
- id: 179
  category: safe_driving_rules
  question: ¿Por cuál de las siguientes razones es aceptable detenerse en el arcén
    (hombro) de la carretera?
  choices:
    A: Para contestar una llamada telefónica
    B: Para descansar si está cansado
    C: Para revisar un mapa y buscar direcciones
    D: Por una avería mecánica o problemas con los neumáticos
  answer: D
  explanation: El manual indica que el arcén de la carretera solo debe ser utilizado
    por vehículos que necesiten detenerse debido a una avería mecánica, problemas
    con los neumáticos, falta de combustible u otras emergencias.
- id: 180
  category: signs_and_signals
  question: ¿Qué indica a los conductores una doble línea blanca en la calzada?
  choices:
    A: Los conductores no deben cambiar de carril ni cruzar las líneas para girar
    B: El carril termina y los conductores deben incorporarse a la izquierda
    C: Se permite rebasar si la vía está despejada
    D: La carretera está cambiando de tráfico de un solo sentido a doble sentido
  answer: A
  explanation: Según el manual, los conductores no deben cambiar de carril ni cruzar
    dobles líneas blancas para girar.
- id: 181
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de los marcadores de millas (mileposts)
    instalados en las autopistas interestatales?
  choices:
    A: Indicar el límite de velocidad actual
    B: Identificar la ubicación de choques o emergencias
    C: Mostrar la distancia hasta la próxima área de descanso
    D: Marcar el límite de un condado diferente
  answer: B
  explanation: Los marcadores de millas proporcionan un medio para identificar la
    ubicación de choques, averías u otras emergencias. Se instalan cada milla en las
    autopistas interestatales.
- id: 182
  category: signs_and_signals
  question: ¿Durante qué horas están restringidos los carriles preferenciales para
    Vehículos de Alta Ocupación (HOV) a autobuses y vehículos compartidos (carpools)
    según el texto provisto?
  choices:
    A: De 7 a.m. a 10 a.m., de lunes a viernes
    B: De 6 a.m. a 9 a.m., de lunes a viernes
    C: De 3 p.m. a 6 p.m., de lunes a viernes
    D: Las 24 horas del día, los siete días de la semana
  answer: B
  explanation: El manual establece que los autobuses y los vehículos utilizados para
    viajes compartidos (carpools) pueden usar el carril HOV solo entre las 6 a.m.
    y las 9 a.m., de lunes a viernes.
- id: 183
  category: signs_and_signals
  question: Al acercarse a una señal de alto (stop), ¿cuál de las siguientes acciones
    es obligatoria?
  choices:
    A: Reducir la velocidad a 5 mph y avanzar si la intersección está despejada
    B: Detenerse por completo antes del cruce peatonal o la intersección
    C: Ceder el paso solo a los vehículos que se acercan por la derecha
    D: Detenerse solo si hay peatones cruzando activamente
  answer: B
  explanation: La señal de alto significa detenerse por completo, ceder el paso a
    los peatones u otros vehículos y luego avanzar con cuidado. Deténgase antes del
    cruce peatonal, la intersección o la señal de alto. Reducir la velocidad no es
    suficiente.
- id: 184
  category: signs_and_signals
  question: ¿Qué indica una señal de velocidad recomendada (Advisory Speed Sign) colocada
    antes de una curva?
  choices:
    A: La velocidad mínima requerida en la carretera
    B: La velocidad máxima a la que puede transitar de manera segura por la curva
      más adelante
    C: El límite de velocidad solo para camiones comerciales
    D: La velocidad a la que debe ingresar a la autopista
  answer: B
  explanation: Una señal de velocidad recomendada indica la velocidad máxima a la
    que puede transitar de manera segura por la curva más adelante.
- id: 185
  category: signs_and_signals
  question: ¿Cuál es la función de un semáforo de rampa (ramp meter)?
  choices:
    A: Pesa los vehículos comerciales que ingresan a la carretera
    B: Indica a los conductores cuándo ingresar a la autopista
    C: Mide la velocidad de los vehículos en la rampa de salida
    D: Cuenta el número de pasajeros en un vehículo compartido
  answer: B
  explanation: El semáforo de rampa (rojo o verde) indica a los conductores cuándo
    ingresar a la autopista.
- id: 186
  category: safe_driving_rules
  question: En una carretera de carriles múltiples con cuatro o más carriles, ¿qué
    indica una doble línea amarilla?
  choices:
    A: Puede cruzar para rebasar si el camino está despejado
    B: Está ingresando a una zona escolar
    C: No cruce la doble línea amarilla para rebasar
    D: El carril está reservado solo para dar vuelta a la izquierda
  answer: C
  explanation: En una carretera de carriles múltiples (cuatro o más carriles), no
    debe cruzar la doble línea amarilla para rebasar. Debe mantenerse en su carril
    tanto como sea posible.
- id: 187
  category: safe_driving_rules
  question: ¿Cuál es el uso correcto de un carril central en una carretera de carriles
    múltiples?
  choices:
    A: Como carril de tránsito continuo para vehículos más rápidos
    B: Para rebasar vehículos más lentos por la izquierda
    C: Para reducir la velocidad o detenerse con el fin de dar una vuelta segura a
      la izquierda
    D: Para estacionarse en situaciones de emergencia
  answer: C
  explanation: El carril central está en un punto donde el vehículo tendrá tiempo
    para reducir la velocidad o detenerse con el fin de realizar una maniobra segura
    para dar vuelta a la izquierda. Nunca debe usarse para rebasar o como carril de
    tránsito continuo.
- id: 188
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla continua en su lado de la carretera?
  choices:
    A: Una zona de no rebasar
    B: Se permite rebasar si es seguro
    C: Se está acercando a un cruce peatonal
    D: El carril se está terminando
  answer: A
  explanation: Una línea amarilla continua en su lado de la carretera marca una 'zona
    de no rebasar'. Las líneas discontinuas o entrecortadas le permiten rebasar o
    cambiar de carril, si es seguro.
- id: 189
  category: signs_and_signals
  question: ¿Cuál es la regla con respecto a las marcas en el pavimento que consisten
    en líneas blancas dobles continuas?
  choices:
    A: Se permite cruzar con precaución
    B: Está prohibido cruzar
    C: Indican un cruce peatonal
    D: Marcan un carril central para dar vuelta a la izquierda
  answer: B
  explanation: Según el manual, está prohibido cruzar donde hay una marca en el pavimento
    de líneas blancas dobles continuas.
- id: 190
  category: penalties_and_points
  question: ¿Qué sucede con las multas de tránsito por infracciones que ocurren en
    zonas de construcción?
  choices:
    A: Siguen siendo las mismas que las infracciones normales
    B: Se reducen a la mitad
    C: Se duplican cuando hay trabajadores presentes
    D: Se triplican independientemente de la presencia de trabajadores
  answer: C
  explanation: Las multas de tránsito se duplican por infracciones que ocurren en
    zonas de construcción donde hay trabajadores presentes en cualquier parte de la
    zona de construcción.
- id: 191
  category: signs_and_signals
  question: Al acercarse a una barricada o panel vertical, ¿qué indican las franjas
    diagonales inclinadas hacia abajo a la derecha?
  choices:
    A: La carretera está completamente cerrada
    B: El conductor debe mantenerse a la izquierda
    C: El conductor debe mantenerse a la derecha
    D: Hay un cruce de peatones más adelante
  answer: C
  explanation: Las franjas inclinadas hacia abajo a la derecha significan que el conductor
    debe mantenerse a la derecha para pasar.
- id: 192
  category: safe_driving_rules
  question: ¿Qué debe hacer si un abanderado en una zona de trabajo le indica que
    se detenga?
  choices:
    A: Detenerse en su carril y no desviarse a la derecha ni a la izquierda
    B: Hacerse a un lado en el arcén derecho y detenerse
    C: Avanzar lentamente hasta que el abanderado se mueva
    D: Tocar la bocina para confirmar la instrucción
  answer: A
  explanation: Cuando un abanderado le indique que se detenga, debe hacerlo en su
    carril y no desviarse a la derecha ni a la izquierda. No debe intentar avanzar
    hasta que se le indique hacerlo.
- id: 193
  category: penalties_and_points
  question: ¿Cuál es la sanción por conducir alrededor de una barricada donde el agua
    cubre cualquier parte de un camino, calle o carretera?
  choices:
    A: Una multa de $1 a $200
    B: Un delito menor de Clase C sin tiempo de cárcel
    C: Un delito menor de Clase B castigado con una multa de hasta $2,000 y/o hasta
      180 días de cárcel
    D: Suspensión inmediata de la licencia por un año
  answer: C
  explanation: El delito es un delito menor de Clase B castigado con una multa de
    hasta $2,000 y/o hasta 180 días de cárcel cuando se ha colocado una señal de advertencia
    o barricada en un lugar donde el agua cubre cualquier parte de un camino, calle
    o carretera.
- id: 194
  category: vehicle_information
  question: 'Se requiere un emblema de vehículo de movimiento lento para los vehículos
    diseñados para operar a una velocidad máxima de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: Los vehículos de movimiento lento son aquellos diseñados para operar
    a una velocidad máxima de 25 mph o menos, y el emblema es obligatorio para todos
    estos vehículos.
- id: 195
  category: safe_driving_rules
  question: ¿Con qué distancia de anticipación debe señalizar continuamente antes
    de girar o detenerse?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: Debe señalizar continuamente durante al menos 100 pies antes de girar
    o detenerse, y asegurarse de apagar las luces direccionales una vez que haya completado
    el giro.
- id: 196
  category: safe_driving_rules
  question: ¿A cuántos pies de una intersección o cruce de ferrocarril nunca debe
    conducir por el lado izquierdo de la carretera para rebasar a otro vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Nunca conduzca por el lado izquierdo de la carretera cuando esté a
    menos de 100 pies de, o cruzando, una intersección o cruce de ferrocarril.
- id: 197
  category: safe_driving_rules
  question: 'Según el manual, siempre debe señalizar sus intenciones en todas las
    siguientes situaciones EXCEPTO:'
  choices:
    A: Al cambiar de carril
    B: Al salir de un espacio de estacionamiento paralelo a la acera
    C: Al conducir en línea recta a través de un semáforo en verde
    D: Al entrar o salir de una autopista
  answer: C
  explanation: Siempre debe señalizar al cambiar de carril, hacer un giro, salir de
    un espacio de estacionamiento en paralelo, reducir la velocidad o detenerse, entrar
    o salir de una autopista, o al hacerse a un lado de la carretera. Conducir en
    línea recta no requiere señalización.
- id: 198
  category: sharing_the_road
  question: ¿Qué indica a otros conductores una bandera especial en la parte trasera
    de una bicicleta?
  choices:
    A: El ciclista transporta materiales peligrosos
    B: El ciclista es un principiante
    C: El operador de la bicicleta puede tener discapacidad auditiva
    D: La bicicleta es parte de una carrera
  answer: C
  explanation: Si ve esta bandera en la parte trasera de una bicicleta, reduzca la
    velocidad, ya que el operador de la bicicleta puede tener discapacidad auditiva.
- id: 199
  category: signs_and_signals
  question: ¿Cuál es el color básico utilizado para los dispositivos de control de
    tráfico en zonas de trabajo de construcción y mantenimiento?
  choices:
    A: Rojo
    B: Amarillo
    C: Naranja
    D: Verde
  answer: C
  explanation: El naranja es el color básico para los dispositivos de construcción
    y mantenimiento, como señales, barricadas, paneles verticales, tambores, conos
    y tubos.
- id: 200
  category: safe_driving_rules
  question: 'Siempre debe mantenerse en el lado derecho de la carretera EXCEPTO cuando:'
  choices:
    A: Se acerca a una colina o curva
    B: Conduce en una calle de un solo sentido
    C: Está a menos de 100 pies de un puente
    D: Se acerca a un cruce de ferrocarril
  answer: B
  explanation: Siempre manténgase en el lado derecho de la carretera excepto al rebasar
    a otro vehículo en una calle de dos o tres carriles, al conducir en una calle
    de un solo sentido, o cuando el lado derecho de la carretera esté bloqueado.
- id: 201
  category: signs_and_signals
  question: ¿Cuál es el propósito de los barriles instalados frente a obstáculos sólidos
    y en áreas de alta frecuencia de choques?
  choices:
    A: Almacenar suministros de agua de emergencia
    B: Actuar como un amortiguador de impactos y reducir la gravedad de los choques
    C: Marcar los cruces peatonales
    D: Indicar una ruta de desvío
  answer: B
  explanation: Los barriles diseñados para actuar como amortiguadores de impactos
    reducen la gravedad de los choques. Por lo general, se instalan frente a un obstáculo
    sólido y en áreas de alta frecuencia de choques.
- id: 202
  category: safe_driving_rules
  question: Al rebasar en una carretera de dos carriles, ¿a cuántos pies de distancia
    de un vehículo que se aproxima debe regresar al carril derecho?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El manual indica que debe asegurarse de tener suficiente tiempo y espacio
    para rebasar al vehículo de adelante y regresar al carril derecho antes de que
    un vehículo que se aproxima esté a menos de 200 pies de usted.
- id: 203
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes condiciones está permitido rebasar por la
    derecha usando un acotamiento pavimentado (paved shoulder)?
  choices:
    A: Cuando el tráfico se mueve por debajo del límite de velocidad publicado
    B: Cuando el vehículo al que está rebasando se prepara para dar una vuelta a la
      izquierda
    C: Cuando conduce por un camino rural sin pavimentar
    D: Cuando desea esquivar un autobús escolar detenido
  answer: B
  explanation: Puede rebasar por un acotamiento pavimentado cuando el vehículo al
    que está rebasando disminuye la velocidad o está detenido en la parte principal
    transitada de la carretera, está averiado o se prepara para dar una vuelta a la
    izquierda.
- id: 204
  category: defensive_driving
  question: ¿Qué debe hacer cuando otro vehículo lo está rebasando?
  choices:
    A: Acelerar para apartarse de su camino rápidamente
    B: Moverse a la izquierda para bloquearlo si va a exceso de velocidad
    C: No aumentar su velocidad y mantenerse en su carril
    D: Tocar la bocina para alertarlo de su presencia
  answer: C
  explanation: Cuando otro vehículo lo esté rebasando, no debe aumentar su velocidad,
    debe mantenerse en su carril y hacer que sea lo más seguro y fácil posible para
    el otro conductor rebasarlo.
- id: 205
  category: defensive_driving
  question: Si no puede incorporarse al carril adecuado dentro de media cuadra antes
    de dar una vuelta, ¿cuál es la acción más segura que debe tomar?
  choices:
    A: Detenerse en su carril actual y esperar a que el tráfico se despeje
    B: Dar la vuelta desde su carril actual lo más rápido posible
    C: No dar la vuelta y continuar recto
    D: Dar marcha atrás a su vehículo hasta que pueda entrar al carril adecuado
  answer: C
  explanation: El manual aconseja que si no puede incorporarse al carril adecuado
    dentro de media cuadra antes de dar la vuelta, no dé la vuelta y continúe recto.
- id: 206
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe poner la direccional adecuada antes de dar
    una vuelta?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: Debe poner la direccional adecuada al menos 100 pies antes de dar la
    vuelta.
- id: 207
  category: safe_driving_rules
  question: Al dar una vuelta a la izquierda desde una calle de un solo sentido hacia
    una calle de doble sentido, ¿cómo debe completar la vuelta?
  choices:
    A: Dar la vuelta desde el carril izquierdo hacia el carril derecho
    B: Dar la vuelta desde el carril derecho hacia el carril izquierdo
    C: Dar la vuelta desde el carril central hacia el carril derecho
    D: Dar la vuelta desde el carril izquierdo hacia el carril izquierdo
  answer: A
  explanation: Si va a dar una vuelta a la izquierda desde una calle de un solo sentido,
    debe dar la vuelta desde el carril izquierdo hacia el carril derecho, moviéndose
    en la misma dirección.
- id: 208
  category: safe_driving_rules
  question: ¿A qué distancia de una boca de incendios (hidrante) es ilegal estacionar
    o detener un vehículo?
  choices:
    A: A menos de 10 pies
    B: A menos de 15 pies
    C: A menos de 20 pies
    D: A menos de 30 pies
  answer: B
  explanation: No debe estacionar ni permitir que un vehículo se detenga con el motor
    en marcha a menos de 15 pies de una boca de incendios (hidrante).
- id: 209
  category: safe_driving_rules
  question: ¿En cuál de los siguientes lugares es ilegal estacionar, detenerse o dejar
    un vehículo parado?
  choices:
    A: En un puente o dentro de un túnel de carretera
    B: En una entrada de garaje residencial privada
    C: En un acotamiento pavimentado fuera de un área urbana
    D: Junto a un bordillo (acera) en un distrito comercial
  answer: A
  explanation: No debe estacionar, detenerse ni permitir que un vehículo se quede
    parado con el motor en marcha en un puente u otra estructura elevada en una carretera
    o dentro de un túnel de carretera.
- id: 210
  category: safe_driving_rules
  question: ¿A qué distancia de un cruce peatonal en una intersección es ilegal estacionar
    o detener un vehículo?
  choices:
    A: A menos de 10 pies
    B: A menos de 15 pies
    C: A menos de 20 pies
    D: A menos de 30 pies
  answer: C
  explanation: No debe estacionar ni permitir que un vehículo se detenga con el motor
    en marcha a menos de 20 pies de un cruce peatonal en una intersección.
- id: 211
  category: safe_driving_rules
  question: ¿A cuántos pies del riel más cercano de un cruce de ferrocarril no debe
    estacionar un vehículo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: D
  explanation: No estacione un vehículo, ocupado o no, a menos de 50 pies del riel
    más cercano de un cruce de ferrocarril.
- id: 212
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de estacionarse ilegalmente
    en un espacio reservado para personas con discapacidades?
  choices:
    A: Una multa de $100 a $200
    B: Una multa de $250 a $500
    C: Una multa de $500 a $750
    D: Una multa de $1,000 a $1,250
  answer: C
  explanation: Estacionarse ilegalmente en un espacio reservado para personas con
    discapacidades es un delito menor castigado con una multa de $500 a $750 por la
    primera infracción.
- id: 213
  category: driver_responsibility
  question: ¿Bajo qué condición puede usar una tarjeta de identificación de parabrisas
    para estacionamiento de discapacitados?
  choices:
    A: Siempre que esté haciendo un mandado rápido para un familiar discapacitado
    B: Solo cuando transporte a la persona discapacitada a la que se le emitió
    C: Si se la pidió prestada a un amigo que no la está usando actualmente
    D: Cuando todos los demás espacios de estacionamiento regulares estén llenos
  answer: B
  explanation: La ley de Texas establece específicamente que no puede usar una tarjeta
    de identificación de parabrisas para estacionamiento de discapacitados a menos
    que transporte a la persona discapacitada a la que se le emitió.
- id: 214
  category: defensive_driving
  question: ¿Cómo sabe que es seguro regresar al carril derecho después de rebasar
    a un vehículo por la izquierda?
  choices:
    A: Cuando esté a 50 pies por delante del vehículo
    B: Cuando pueda ver el automóvil que acaba de rebasar en su espejo retrovisor
    C: Cuando el conductor al que rebasó parpadee sus faros
    D: Cuando haya acelerado a 10 mph por encima del límite de velocidad
  answer: B
  explanation: Espere hasta que pueda ver el automóvil que acaba de rebasar en su
    espejo retrovisor antes de regresar al carril derecho.
- id: 215
  category: safe_driving_rules
  question: Si debe estacionarse en una carretera fuera de un distrito comercial o
    residencial por la noche, ¿qué debe hacer?
  choices:
    A: Encender las luces altas
    B: Dejar las luces intermitentes de peligro encendidas y las puertas sin seguro
    C: Usar las luces de estacionamiento o dejar los faros en luces bajas
    D: Apagar todas las luces para ahorrar la batería de su vehículo
  answer: C
  explanation: Si no puede estacionarse fuera de la vía por la noche en una carretera
    fuera de un área urbana, use sus luces de estacionamiento o deje sus faros en
    luces bajas.
- id: 216
  category: vehicle_information
  question: Al prepararse para dar vuelta, ¿qué debe evitar hacer mientras ejecuta
    la vuelta?
  choices:
    A: Usar ambas manos en el volante
    B: Mirar en todas las direcciones en busca de tráfico
    C: Usar el freno o el embrague
    D: Mantenerse en el carril de vuelta adecuado
  answer: C
  explanation: 'El manual indica a los conductores que reduzcan la velocidad a una
    velocidad de giro razonable antes de dar la vuelta y dice: ''No use el freno ni
    el embrague mientras da la vuelta''.'
- id: 217
  category: safe_driving_rules
  question: ¿Cuál es el propósito de las áreas rayadas adyacentes a los espacios de
    estacionamiento para discapacitados?
  choices:
    A: Están designadas para el estacionamiento de motocicletas.
    B: Son para elevadores de sillas de ruedas.
    C: Están designadas para la carga y descarga de bienes comerciales.
    D: Están reservadas solo para autos compactos.
  answer: B
  explanation: Según el manual, no debe estacionarse en las áreas rayadas adyacentes
    a los espacios de estacionamiento para discapacitados porque estas áreas rayadas
    son para elevadores de sillas de ruedas.
- id: 218
  category: safe_driving_rules
  question: Al dejar un vehículo motorizado desatendido, ¿cuál de las siguientes acciones
    NO es requerida por la ley (a menos que use un encendido remoto)?
  choices:
    A: Apagar el motor
    B: Bloquear el encendido
    C: Retirar la llave del encendido
    D: Encender las luces intermitentes de peligro
  answer: D
  explanation: Es ilegal permitir que un automóvil permanezca inactivo y desatendido
    sin apagar el motor, bloquear el encendido, retirar la llave y poner el freno
    de mano. Encender las luces intermitentes de peligro no es un requisito establecido.
- id: 219
  category: safe_driving_rules
  question: Al estacionarse en paralelo en una vía que permite el tráfico en ambos
    sentidos, ¿qué tan cerca deben estar las ruedas derechas de su vehículo del bordillo
    derecho o borde de la vía?
  choices:
    A: A no más de 6 pulgadas
    B: A no más de 12 pulgadas
    C: A no más de 18 pulgadas
    D: A no más de 24 pulgadas
  answer: C
  explanation: En una vía que permite el tráfico en ambos sentidos, el conductor debe
    estacionarse con las ruedas derechas del vehículo a no más de 18 pulgadas del
    bordillo derecho o borde de la vía.
- id: 220
  category: safe_driving_rules
  question: ¿Es legal avanzar por inercia en una pendiente descendente con las marchas
    o la transmisión en neutral?
  choices:
    A: Sí, pero solo en áreas rurales.
    B: Sí, es una forma recomendada de ahorrar combustible.
    C: No, es ilegal.
    D: No, a menos que conduzca con transmisión manual.
  answer: C
  explanation: El manual establece explícitamente que es ilegal avanzar por inercia
    en una pendiente descendente con las marchas o la transmisión en neutral.
- id: 221
  category: defensive_driving
  question: En buenas condiciones de la carretera, ¿cuál es la distancia de seguimiento
    mínima recomendada para velocidades superiores a 30 mph?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: C
  explanation: Para velocidades superiores a 30 mph, debe mantener una distancia de
    4 segundos entre los vehículos durante buenas condiciones de la carretera.
- id: 222
  category: defensive_driving
  question: ¿Cómo puede saber si está siguiendo al vehículo de adelante demasiado
    de cerca?
  choices:
    A: No puede ver sus espejos laterales.
    B: Alcanza el mismo objeto fijo que el vehículo de adelante en menos de dos segundos.
    C: Viaja exactamente a la misma velocidad que el vehículo de adelante.
    D: Puede leer su placa (matrícula) claramente.
  answer: B
  explanation: 'Una nota especial en el manual indica: Cuando el vehículo de adelante
    pasa un objeto fijo y usted alcanza el mismo objeto fijo en menos de dos segundos,
    lo está siguiendo demasiado de cerca.'
- id: 223
  category: defensive_driving
  question: Según el Manual del Conductor de Texas, ¿cuánto tiempo le toma a una persona
    promedio pensar, reaccionar y aplicar los frenos?
  choices:
    A: 1/2 segundo
    B: 1 segundo
    C: 1-1/2 segundos
    D: 2 segundos
  answer: C
  explanation: A una persona promedio le toma 1-1/2 segundos pensar, reaccionar y
    aplicar los frenos.
- id: 224
  category: defensive_driving
  question: ¿Cómo afecta conducir a 60 mph su campo de visión en comparación con estar
    parado?
  choices:
    A: Se reduce a aproximadamente 2/3.
    B: Se reduce a aproximadamente 1/2.
    C: Se reduce a aproximadamente 2/5.
    D: Se reduce a aproximadamente 1/5.
  answer: D
  explanation: El manual indica que a 60 mph, su campo de visión se reduce a aproximadamente
    1/5 en comparación con un campo de visión estacionario de 180 grados o más.
- id: 225
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en un distrito urbano a menos que
    se indique lo contrario?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: La tabla de Límites de Velocidad enumera el límite de velocidad máximo
    para un Distrito Urbano como 30 mph.
- id: 226
  category: safe_driving_rules
  question: Cuando las entidades establecen o modifican un límite de velocidad, ¿cómo
    deben compararse los límites de velocidad diurnos y nocturnos?
  choices:
    A: Los límites nocturnos deben ser 5 mph más bajos que los límites diurnos.
    B: Los límites nocturnos deben ser 10 mph más bajos que los límites diurnos.
    C: Deben establecer el mismo límite de velocidad para el día y la noche.
    D: Los límites diurnos se aplican solo durante el horario escolar.
  answer: C
  explanation: Las entidades que establecen o modifican un límite de velocidad deben
    establecer el mismo límite de velocidad para el día y la noche.
- id: 227
  category: penalties_and_points
  question: ¿Cuál es el rango de sanción penal por una condena de carreras callejeras
    (street racing)?
  choices:
    A: De un delito menor de Clase C a un delito menor de Clase A
    B: De un delito menor de Clase B a un delito grave de segundo grado
    C: Una multa de tránsito y una sanción de $500
    D: Solo un delito grave de primer grado
  answer: B
  explanation: La sanción penal por una condena de carreras de velocidad varía desde
    un delito menor de Clase B hasta un delito grave de segundo grado.
- id: 228
  category: defensive_driving
  question: Con buenos frenos y neumáticos en pavimento seco y nivelado, ¿cuál es
    la distancia total aproximada de frenado cuando se viaja a 50 mph?
  choices:
    A: 109 pies
    B: 164 pies
    C: 229 pies
    D: 303 pies
  answer: C
  explanation: Según la tabla de Distancias Aproximadas de Frenado, ir a 50 mph requiere
    229 pies para detenerse.
- id: 229
  category: safe_driving_rules
  question: ¿Qué debe hacer para notificar a otros conductores cuando va a salir de
    su lugar de estacionamiento actual?
  choices:
    A: Tocar la bocina dos veces.
    B: Parpadear las luces altas.
    C: Usar su luz direccional.
    D: Agitar la mano por la ventana.
  answer: C
  explanation: 'El manual indica: ''Asegúrese de usar su luz direccional para notificar
    a otros conductores que está saliendo de su lugar de estacionamiento actual''.'
- id: 230
  category: safe_driving_rules
  question: ¿En qué dirección fluye el tráfico en una rotonda moderna?
  choices:
    A: En el sentido de las agujas del reloj alrededor de una isla central
    B: En sentido contrario a las agujas del reloj alrededor de una isla central
    C: En línea recta a través de la isla central
    D: Tanto en el sentido de las agujas del reloj como en sentido contrario dependiendo
      del carril
  answer: B
  explanation: El manual indica que una rotonda moderna es una intersección circular
    de un solo sentido donde el tráfico fluye en sentido contrario a las agujas del
    reloj alrededor de una isla central.
- id: 231
  category: defensive_driving
  question: ¿Cuántos puntos de conflicto potenciales tiene una rotonda moderna en
    comparación con una intersección tradicional de cuatro vías con semáforo?
  choices:
    A: 8 puntos de conflicto potenciales en comparación con 32
    B: 16 puntos de conflicto potenciales en comparación con 32
    C: 32 puntos de conflicto potenciales en comparación con 8
    D: 4 puntos de conflicto potenciales en comparación con 16
  answer: A
  explanation: Según el manual, el diseño de una rotonda moderna solo tiene ocho puntos
    de conflicto potenciales, a diferencia de una intersección tradicional de cuatro
    vías con semáforo que tiene 32.
- id: 232
  category: safe_driving_rules
  question: ¿Qué debe hacer si se acerca un vehículo de emergencia mientras conduce
    dentro de una rotonda?
  choices:
    A: Detenerse inmediatamente dentro de la rotonda para dejarlos pasar
    B: Acelerar y salir de la rotonda lo más rápido posible
    C: Despejar la rotonda primero y luego hacerse a un lado para el vehículo de emergencia
    D: Hacerse a un lado hacia el lado izquierdo de la isla central
  answer: C
  explanation: 'El manual indica explícitamente: ''no se detenga ante vehículos de
    emergencia dentro de la rotonda. Despeje la rotonda primero y luego hágase a un
    lado para el vehículo de emergencia''.'
- id: 233
  category: safe_driving_rules
  question: Según el manual, ¿cuánta agua en movimiento se requiere para arrastrar
    camionetas (pick-ups), vehículos utilitarios deportivos (SUV) y la mayoría de
    los demás vehículos?
  choices:
    A: Seis pulgadas
    B: Doce pulgadas
    C: Dieciocho pulgadas
    D: Dos pies
  answer: D
  explanation: El manual establece que dos pies de agua en movimiento arrastrarán
    camionetas (pick-ups), vehículos utilitarios deportivos (SUV) y la mayoría de
    los demás vehículos.
- id: 234
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si su vehículo se apaga en una inundación?
  choices:
    A: Quedarse dentro del vehículo y esperar a los equipos de emergencia
    B: Salir rápidamente y moverse a un terreno más alto
    C: Bajar las ventanas y permanecer con el cinturón de seguridad abrochado
    D: Intentar encender el motor repetidamente hasta que arranque
  answer: B
  explanation: Los funcionarios del Servicio Meteorológico Nacional y de la División
    de Manejo de Emergencias de Texas dicen que si su vehículo se apaga en una inundación,
    salga rápidamente y muévase a un terreno más alto.
- id: 235
  category: sharing_the_road
  question: En una autopista nivelada, ¿cuánto tiempo más se tarda en rebasar a un
    camión que a un automóvil de pasajeros?
  choices:
    A: De uno a dos segundos más
    B: De tres a cinco segundos más
    C: De cinco a siete segundos más
    D: De siete a diez segundos más
  answer: B
  explanation: El manual señala que, en una autopista nivelada, se tarda de tres a
    cinco segundos más en rebasar a un camión que a un automóvil.
- id: 236
  category: sharing_the_road
  question: ¿Qué significa si el conductor de un camión parpadea sus luces delanteras
    después de que usted lo ha rebasado?
  choices:
    A: Usted conduce demasiado lento y necesita acelerar
    B: Hay un peligro o un oficial de policía más adelante
    C: Es una señal de que hay espacio libre para que usted regrese al carril delante
      del camión
    D: Sus luces altas están cegando al conductor del camión
  answer: C
  explanation: Si el conductor parpadea las luces del camión después de que usted
    lo rebasa, es una señal de que hay espacio libre para que usted regrese al carril
    delante del camión.
- id: 237
  category: sharing_the_road
  question: Al encontrarse con un camión que viene en dirección opuesta, ¿por qué
    debe mantenerse lo más a la orilla posible de su carril?
  choices:
    A: Para evitar un choque lateral y reducir la turbulencia del viento que empuja
      a los vehículos separándolos
    B: Para evitar un choque lateral y reducir la turbulencia del viento que atrae
      a los vehículos entre sí
    C: Para darle al conductor del camión una mejor vista de sus faros
    D: Para evitar que rocas y escombros golpeen su parabrisas
  answer: A
  explanation: El manual aconseja mantenerse lo más a la orilla posible para evitar
    un choque lateral y reducir la turbulencia del viento, señalando que 'la turbulencia
    empuja a los vehículos separándolos; no los atrae entre sí'.
- id: 238
  category: sharing_the_road
  question: Aproximadamente, ¿cuánta distancia puede necesitar un camión con remolque
    (tráiler) completamente cargado que viaja a 55 mph para detenerse por completo?
  choices:
    A: 150 pies
    B: 240 pies
    C: 300 pies
    D: Más de 400 pies
  answer: D
  explanation: Mientras que un automóvil de pasajeros promedio a 55 mph se detiene
    en unos 240 pies, un camión con remolque completamente cargado puede tardar más
    de 400 pies en detenerse por completo.
- id: 239
  category: sharing_the_road
  question: ¿Cuál es una excelente regla general para los automovilistas que comparten
    la vía con un camión con remolque para evitar los puntos ciegos?
  choices:
    A: Si puede ver las luces traseras del camión, está a una distancia segura
    B: Si no puede ver al conductor del camión en su espejo lateral, él no puede verlo
      a usted
    C: Manténgase siempre a la distancia de un automóvil del parachoques trasero del
      camión
    D: Si conduce por el lado derecho del camión, está en una zona segura
  answer: B
  explanation: 'El manual establece que una excelente regla general es: ''Si no puede
    ver al conductor del camión en su espejo lateral, él no puede verlo a usted''.'
- id: 240
  category: sharing_the_road
  question: ¿Por qué siempre debe bajar las luces de sus faros al seguir a un camión
    por la noche?
  choices:
    A: Las luces altas agotarán la batería de su vehículo más rápido
    B: Las luces altas que se reflejan en los grandes espejos laterales del camión
      cegarán al conductor del camión
    C: Los camiones tienen sensores especiales que se ven afectados por las luces
      altas
    D: Es ilegal usar luces altas en cualquier autopista de varios carriles
  answer: B
  explanation: Cuando siga a un camión por la noche, siempre baje las luces de sus
    faros porque las luces altas de un vehículo que va detrás cegarán al conductor
    del camión cuando se reflejen en los grandes espejos laterales del camión.
- id: 241
  category: sharing_the_road
  question: ¿Por qué es peligroso rebasar a un camión por la derecha en una intersección?
  choices:
    A: Los camiones aceleran mucho más rápido que los automóviles desde una parada
    B: Los camiones hacen giros amplios a la derecha y a veces dejan un espacio abierto
      a la derecha justo antes de girar
    C: El espejo del lado derecho del conductor del camión suele estar desactivado
      en el tráfico de la ciudad
    D: Los camiones siempre ponen la marcha atrás antes de hacer un giro a la derecha
  answer: B
  explanation: Los camiones hacen giros amplios a la derecha y a veces dejan un espacio
    abierto a la derecha justo antes de girar. Rebasar por la derecha puede provocar
    un choque si el camión gira.
- id: 242
  category: sharing_the_road
  question: ¿Por qué los camiones con remolque (tractor-trailers) a menudo se mantienen
    en el carril central en las autopistas de varios carriles?
  choices:
    A: Para ayudar al flujo del tráfico local al entrar y salir de la autopista y
      aumentar las opciones para evitar un choque
    B: Porque el carril central está designado legalmente como el único carril para
      camiones
    C: Para evitar que los vehículos de pasajeros los rebasen por ambos lados
    D: Porque el carril central suele estar pavimentado con materiales más resistentes
  answer: A
  explanation: En las autopistas de varios carriles, los camiones con remolque se
    mantienen en el carril central para ayudar al flujo del tráfico local al entrar
    y salir de la autopista y para aumentar las opciones del conductor si tiene que
    cambiar de carril para evitar un choque.
- id: 243
  category: sharing_the_road
  question: ¿Por qué un número considerable de choques entre automóviles y camiones
    ocurren en las intersecciones?
  choices:
    A: Los camiones no están obligados a detenerse en los semáforos en amarillo
    B: Los automóviles de pasajeros no pueden ver los semáforos por encima del camión
    C: Debido a su gran tamaño, un camión con remolque a menudo parece viajar a una
      velocidad menor de la que realmente lleva
    D: Los conductores de camiones no pueden ver las señales de tráfico debido a la
      altura de sus cabinas
  answer: C
  explanation: El manual explica que, debido a su gran tamaño, un camión con remolque
    a menudo parece viajar a una velocidad menor de la que realmente lleva, lo que
    hace que los conductores calculen mal qué tan cerca o qué tan rápido se acerca
    en las intersecciones.
- id: 244
  category: sharing_the_road
  question: Según el manual, ¿cuál es una de las razones por las que los conductores
    pueden no ver a un motociclista que se acerca?
  choices:
    A: Las motocicletas no están obligadas a tener faros delanteros
    B: El perfil de una motocicleta es mucho más pequeño que el perfil de un automóvil
    C: Las motocicletas suelen viajar mucho más lento que los automóviles de pasajeros
    D: Los motociclistas están obligados legalmente a circular por el arcén (hombro)
      de la carretera
  answer: B
  explanation: Una de las razones comunes por las que los conductores no ven a los
    motociclistas es porque el perfil de una motocicleta es mucho más pequeño que
    el perfil de un automóvil, lo que los hace más difíciles de ver.
- id: 245
  category: sharing_the_road
  question: Según la Administración Nacional de Seguridad del Tráfico en las Carreteras
    (NHTSA), ¿qué probabilidad mayor tienen los motociclistas de morir en un accidente
    de tráfico en comparación con los ocupantes de un automóvil de pasajeros?
  choices:
    A: 10 veces más probable
    B: 20 veces más probable
    C: 35 veces más probable
    D: 50 veces más probable
  answer: C
  explanation: El manual indica que, según la Administración Nacional de Seguridad
    del Tráfico en las Carreteras (NHTSA), los motociclistas tienen aproximadamente
    35 veces más probabilidades de morir en un accidente de tráfico que los ocupantes
    de un automóvil de pasajeros.
- id: 246
  category: sharing_the_road
  question: ¿Cuál es el tipo de choque más común entre automóviles y motocicletas?
  choices:
    A: Un automóvil que choca por detrás a una motocicleta en una señal de alto
    B: Un automóvil que gira a la izquierda frente a una motocicleta en una intersección
    C: Una motocicleta que rebasa a un automóvil por el lado derecho
    D: Un automóvil y una motocicleta que se rozan lateralmente en la autopista
  answer: B
  explanation: El manual señala que el choque más común entre automóviles y motocicletas
    ocurre en una intersección cuando el conductor de un automóvil gira a la izquierda
    frente a una motocicleta.
- id: 247
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada al conducir detrás de
    una motocicleta?
  choices:
    A: Dos a tres segundos
    B: Al menos cuatro a seis segundos
    C: La longitud de un vehículo completo
    D: Diez segundos
  answer: B
  explanation: El manual aconseja dejar una mayor distancia de seguimiento, al menos
    de cuatro a seis segundos, al seguir a una motocicleta para que el motociclista
    tenga suficiente tiempo para maniobrar o detenerse en caso de emergencia.
- id: 248
  category: defensive_driving
  question: ¿Por qué un conductor debe esperar para asegurarse de que una motocicleta
    va a girar antes de avanzar, incluso si la luz direccional de la motocicleta está
    parpadeando?
  choices:
    A: Las luces direccionales de las motocicletas generalmente no se apagan automáticamente
      y los motociclistas a veces olvidan apagarlas.
    B: Las motocicletas a menudo tienen sistemas eléctricos defectuosos.
    C: Los motociclistas usan las luces direccionales para indicar que están reduciendo
      la velocidad.
    D: Es ilegal avanzar mientras la luz direccional de cualquier vehículo esté parpadeando.
  answer: A
  explanation: El manual advierte a los conductores que no se dejen engañar por una
    luz direccional parpadeante porque las señales de las motocicletas generalmente
    no se apagan automáticamente y los motociclistas a veces olvidan apagarlas.
- id: 249
  category: sharing_the_road
  question: ¿Cómo debe tratar un conductor el espacio del carril de una motocicleta?
  choices:
    A: Compartir el carril si la motocicleta circula en el extremo derecho.
    B: Permitir al motociclista el ancho completo del carril y no intentar compartir
      el carril.
    C: Rebasar a la motocicleta en el mismo carril si hay suficiente espacio.
    D: Forzar a la motocicleta hacia el arcén (hombro) para permitir que el tráfico
      más rápido pase.
  answer: B
  explanation: El manual indica que se debe permitir al motociclista el ancho completo
    del carril. Aunque parezca que hay suficiente espacio, la motocicleta tiene derecho
    a un carril completo y no se debe intentar compartir el carril con ellos.
- id: 250
  category: safe_driving_rules
  question: ¿Cuánto espacio se recomienda dejar detrás de un motociclista al detenerse
    en una intersección, semáforo o cruce?
  choices:
    A: La mitad de la longitud de un vehículo
    B: La longitud de un vehículo completo
    C: La longitud de tres vehículos
    D: Cuatro a seis segundos
  answer: B
  explanation: Se recomienda dejar la longitud de un vehículo completo al detenerse
    detrás de un motociclista para ayudar a prevenir un impacto con la motocicleta
    en caso de que su vehículo sufra un choque por detrás.
- id: 251
  category: license_system
  question: ¿Qué agencia administra actualmente el programa de Capacitación y Seguridad
    para Operadores de Motocicletas de Texas a partir de 2020?
  choices:
    A: Departamento de Seguridad Pública (DPS)
    B: Departamento de Transporte de Texas (TxDOT)
    C: Departamento de Licencias y Regulación de Texas (TDLR)
    D: Administración Nacional de Seguridad del Tráfico en las Carreteras (NHTSA)
  answer: C
  explanation: La Legislatura de Texas trasladó la administración del programa de
    Capacitación y Seguridad para Operadores de Motocicletas del DPS al TDLR en 2020.
- id: 252
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una característica de los trenes de tren ligero
    (light rail) que requiere que los conductores y peatones se mantengan muy alerta?
  choices:
    A: Viajan significativamente más rápido que el tráfico normal.
    B: Son muy silenciosos, a menudo más silenciosos que la mayoría de los autobuses
      y automóviles.
    C: Cambian de vía frecuentemente sin previo aviso.
    D: Siempre tienen el derecho de paso sobre los vehículos de emergencia.
  answer: B
  explanation: El manual enfatiza que el tren ligero es muy silencioso y, de hecho,
    más silencioso que la mayoría de los autobuses y automóviles, por lo que es posible
    que no escuche acercarse a un tren ligero.
- id: 253
  category: sharing_the_road
  question: ¿Bajo qué condición se le permite a un ciclista ocupar todo el carril
    en lugar de circular lo más a la derecha posible?
  choices:
    A: Cuando el ciclista viaja por debajo del límite de velocidad.
    B: Cuando el carril tiene un ancho inferior al estándar, lo que hace que sea inseguro
      compartirlo lado a lado.
    C: Cuando el ciclista circula por una autopista de varios carriles.
    D: Los ciclistas siempre deben circular en el extremo derecho sin importar las
      condiciones.
  answer: B
  explanation: Un ciclista puede ocupar todo el carril cuando este tiene un ancho
    inferior al estándar, lo que hace que sea inseguro para un automóvil y una bicicleta
    compartir el carril de manera segura lado a lado.
- id: 254
  category: safe_driving_rules
  question: ¿Qué debe hacer un automovilista al prepararse para dar una vuelta a la
    derecha cerca del tráfico de bicicletas?
  choices:
    A: Acelerar para rebasar a la bicicleta antes de dar la vuelta.
    B: Tocar la bocina para advertir al ciclista que se quite del camino.
    C: Dar la vuelta cruzando directamente la trayectoria del tráfico de bicicletas.
    D: Reducir la velocidad y unirse al tráfico de bicicletas para dar una vuelta
      a la derecha de manera segura.
  answer: D
  explanation: El manual indica que un automovilista debe reducir la velocidad y unirse
    al tráfico de bicicletas al prepararse para dar una vuelta a la derecha, evitando
    dar la vuelta cruzando directamente la trayectoria del tráfico de bicicletas.
- id: 255
  category: sharing_the_road
  question: ¿Qué afirmación describe con precisión los derechos de un ciclista en
    la vía?
  choices:
    A: Los ciclistas deben ceder el derecho de paso a todos los vehículos de motor.
    B: Los ciclistas están restringidos a circular solo por aceras o ciclovías designadas.
    C: Una persona que anda en bicicleta tiene todos los derechos y responsabilidades
      que el conductor de un vehículo.
    D: Los ciclistas solo están permitidos en vías con límites de velocidad inferiores
      a 35 mph.
  answer: C
  explanation: 'El manual establece explícitamente: ''Una bicicleta es un vehículo.
    Cualquier persona que ande en bicicleta tiene todos los derechos y responsabilidades
    que el conductor de un vehículo''.'
- id: 256
  category: driver_responsibility
  question: Según el manual, ¿qué sucede con la tasa de choques si los conductores
    reaccionan medio segundo más lento debido a distracciones?
  choices:
    A: Los choques aumentan en un 25%
    B: Los choques aumentan en un 50%
    C: Los choques se duplican
    D: Los choques se triplican
  answer: C
  explanation: 'El manual establece: ''Si los conductores reaccionan medio segundo
    más lento debido a distracciones, los choques se duplican''.'
- id: 257
  category: defensive_driving
  question: ¿Por qué un motociclista podría cambiar repentinamente de velocidad o
    ajustar su posición dentro de un carril?
  choices:
    A: Para bloquear intencionalmente el tráfico detrás de ellos.
    B: En reacción a cambios en el clima, la carretera o las condiciones del tráfico,
      como baches o grava.
    C: Porque las motocicletas no pueden mantener una velocidad constante.
    D: Para señalar que están a punto de dar una vuelta en U.
  answer: B
  explanation: Los motociclistas pueden cambiar repentinamente de velocidad o ajustar
    su posición dentro de un carril en reacción a cambios en el clima, la carretera
    o las condiciones del tráfico, que pueden incluir baches, grava, cruces de ferrocarril
    y superficies mojadas o resbaladizas.
- id: 258
  category: safe_driving_rules
  question: ¿Cuál es una regla de seguridad crucial con respecto a conducir cerca
    de las vías del tren ligero?
  choices:
    A: Puede estacionarse en las vías si deja encendidas las luces intermitentes de
      peligro.
    B: Puede conducir alrededor de las barreras de cruce si no se ve ningún tren.
    C: No conduzca, no se detenga ni estacione su vehículo en las vías.
    D: Debe competir con el tren hasta el cruce para evitar retrasos.
  answer: C
  explanation: 'Las reglas de seguridad para el tren ligero establecen explícitamente:
    ''No conduzca, no se detenga ni estacione su vehículo en las vías. Es peligroso
    e ilegal''.'
- id: 259
  category: sharing_the_road
  question: ¿Cuál es una causa común de choques entre automóviles y bicicletas en
    intersecciones con señales de alto (STOP)?
  choices:
    A: El ciclista pasa demasiado rápido por la intersección.
    B: Un automovilista avanza desde una señal de alto y no cede el derecho de paso
      al tráfico transversal de bicicletas.
    C: El ciclista no usa señales manuales.
    D: El automovilista se detiene por demasiado tiempo en la señal de alto.
  answer: B
  explanation: Uno de los choques más comunes entre automóviles y bicicletas causados
    por un automovilista ocurre cuando este avanza desde una señal de alto y no cede
    el derecho de paso al tráfico transversal de bicicletas.
- id: 260
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un consejo recomendado para evitar distraerse
    mientras conduce?
  choices:
    A: Ajustar los espejos mientras conduce a baja velocidad
    B: Participar en conversaciones complejas para mantenerse despierto
    C: Revisar mapas y planificar su ruta antes de comenzar a conducir
    D: Enviar mensajes de texto solo cuando esté detenido en un semáforo en rojo
  answer: C
  explanation: Para evitar distraerse, el manual recomienda que "Revise mapas y planifique
    su ruta antes de comenzar a conducir".
- id: 261
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias puede usar legalmente un teléfono celular mientras
    conduce?
  choices:
    A: Para leer un mensaje de texto si no responde
    B: Para comunicarse con las autoridades o durante una emergencia
    C: Cuando viaja a menos de 20 mph
    D: Cuando usa un dispositivo de manos libres para enviar mensajes de texto
  answer: B
  explanation: 'El manual establece: "Puede usar un teléfono celular para comunicarse
    con las autoridades o durante una emergencia".'
- id: 262
  category: alcohol_drugs_health
  question: Cuando una persona bebe alcohol o usa drogas, ¿cuál es uno de los primeros
    efectos que experimenta?
  choices:
    A: Pierde su capacidad de juicio y su vista se ve afectada
    B: Su tiempo de reacción a los sonidos se vuelve más rápido
    C: Su capacidad para calcular la velocidad mejora
    D: Se vuelve más coordinada
  answer: A
  explanation: Según el manual, "Cuando una persona bebe alcohol o usa drogas, uno
    de los primeros efectos es que pierde su capacidad de juicio y su vista se ve
    afectada...".
- id: 263
  category: alcohol_drugs_health
  question: ¿Qué efecto tiene la cafeína en un conductor ebrio?
  choices:
    A: Mejora su capacidad para operar un vehículo
    B: Acelera el tiempo que tarda en recuperar la sobriedad
    C: Le ayuda a mantenerse alerta pero no puede hacer que recupere la sobriedad
    D: Disminuye su concentración de alcohol en la sangre
  answer: C
  explanation: 'El manual señala: "Aunque la cafeína puede ayudar a los conductores
    somnolientos a mantenerse alerta, no puede hacer que un conductor ebrio recupere
    la sobriedad. Los estudios demuestran que cantidades normales de cafeína no mejoran
    la capacidad de un conductor ebrio para operar un vehículo".'
- id: 264
  category: alcohol_drugs_health
  question: ¿Cuál es una consecuencia peligrosa de mezclar alcohol con otras drogas?
  choices:
    A: El alcohol puede enmascarar los efectos de otras drogas
    B: El alcohol neutraliza los efectos de los tranquilizantes
    C: Mejora las reacciones de respuesta del conductor
    D: Disminuye el efecto acumulativo general de las drogas
  answer: A
  explanation: El manual advierte que tomar más de una droga es peligroso porque "Además
    de intensificar los efectos generales de las otras drogas, el alcohol también
    puede enmascarar los efectos de esas drogas, aumentando el riesgo de que una persona
    tome malas decisiones...".
- id: 265
  category: alcohol_drugs_health
  question: 'En Texas, una persona de 21 años o más se considera legalmente intoxicada
    si tiene una Concentración de Alcohol en la Sangre (BAC) de:'
  choices:
    A: 0.04 o más
    B: 0.06 o más
    C: 0.08 o más
    D: 0.10 o más
  answer: C
  explanation: 'El manual establece: "En Texas, una persona de 21 años o más se considera
    legalmente intoxicada si tiene un BAC de 0.08 o más".'
- id: 266
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una condena por poseer un envase abierto
    de alcohol en el área de pasajeros de un vehículo motorizado?
  choices:
    A: $200
    B: $500
    C: $1,000
    D: $2,000
  answer: B
  explanation: La condena por poseer un envase abierto de alcohol en el área de pasajeros
    de un vehículo motorizado se castiga con una multa que no excederá los $500.
- id: 267
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma de minimizar los efectos del
    alcohol y recuperar la sobriedad?
  choices:
    A: Tomar una ducha fría
    B: Beber café negro
    C: Hacer ejercicio vigorosamente
    D: El tiempo
  answer: D
  explanation: 'El manual desmiente los mitos sobre recuperar la sobriedad, afirmando:
    "Solo el tiempo, basado en el peso corporal, la cantidad de bebidas y la ingesta
    de alimentos, puede minimizar los efectos del alcohol".'
- id: 268
  category: alcohol_drugs_health
  question: ¿Aproximadamente cuánto tiempo tarda el cuerpo en eliminar cada bebida
    alcohólica consumida?
  choices:
    A: 30 minutos
    B: Una hora
    C: Dos horas
    D: Cuatro horas
  answer: B
  explanation: Según el manual, "El cuerpo tarda aproximadamente una hora en eliminar
    cada bebida consumida".
- id: 269
  category: penalties_and_points
  question: ¿Qué significa la ley de Tolerancia Cero de Texas para los menores que
    operan un vehículo motorizado?
  choices:
    A: Pueden tener un BAC de hasta 0.02 sin penalización
    B: Se les permite una bebida por cada hora de conducción
    C: Cualquier cantidad detectable de alcohol en su sistema es un delito penal
    D: Solo son penalizados si su BAC es de 0.08 o más
  answer: C
  explanation: Tolerancia cero significa que si un menor tiene "cualquier cantidad
    detectable de alcohol en su sistema mientras opera un vehículo motorizado en un
    lugar público... el menor ha cometido el delito penal de Conducir Bajo la Influencia
    del Alcohol por un Menor (DUI)".
- id: 270
  category: penalties_and_points
  question: ¿Cuál es el período de suspensión de la licencia para la primera infracción
    de un menor relacionada con el alcohol que no implica conducir?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: A
  explanation: Para una primera infracción de un menor relacionada con el alcohol
    que no implica conducir, la sanción incluye que su "licencia será suspendida (o
    el privilegio denegado si no tiene licencia) por 30 días".
- id: 271
  category: defensive_driving
  question: ¿Cuál de las siguientes es una señal de que otro conductor puede estar
    distraído?
  choices:
    A: Mantiene una velocidad constante
    B: Viaja a velocidades inconsistentes
    C: Usa sus luces direccionales correctamente
    D: Mantiene una distancia de seguimiento segura
  answer: B
  explanation: Para reconocer a los conductores distraídos, el manual aconseja estar
    atento a "Vehículos que viajan a velocidades inconsistentes".
- id: 272
  category: alcohol_drugs_health
  question: Según el manual, ¿cómo afectan las dosis sociales típicas de marihuana
    a un conductor?
  choices:
    A: Mejoran las habilidades sensoriales y perceptivas
    B: No tienen ningún efecto sobre la concentración
    C: Afectan negativamente las habilidades sensoriales y perceptivas
    D: Hacen que el conductor esté más coordinado y alerta
  answer: C
  explanation: 'El manual establece: "Las personas que están bajo la influencia de
    la marihuana tienen afectadas sus habilidades sensoriales y perceptivas".'
- id: 273
  category: alcohol_drugs_health
  question: Según la Ley de Consentimiento Implícito, ¿cuál es la sanción por la primera
    infracción de un menor al negarse a proporcionar una muestra de aliento o de sangre?
  choices:
    A: Suspensión de la licencia por 60 días
    B: Suspensión de la licencia por 90 días
    C: Suspensión de la licencia por 180 días
    D: Suspensión de la licencia por 1 año
  answer: C
  explanation: La primera infracción de un menor por negarse a proporcionar una muestra
    resulta en la suspensión de la licencia de conducir (o la denegación del privilegio
    si no tiene licencia) por 180 días.
- id: 274
  category: penalties_and_points
  question: Si un menor proporciona una muestra de aliento o de sangre que confirma
    cualquier cantidad detectable de alcohol por debajo del límite legal de 0.08 (BAC),
    ¿cuál es la suspensión de la licencia por una primera infracción?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: A un menor que proporcione una muestra que confirme una cantidad detectable
    de alcohol por debajo del límite legal de 0.08 de concentración de alcohol en
    la sangre (BAC) se le suspenderá la licencia por 60 días por una primera infracción.
- id: 275
  category: penalties_and_points
  question: ¿Qué tipo de delito es Conducir en Estado de Ebriedad (DWI) con un pasajero
    menor de 15 años?
  choices:
    A: Delito menor de Clase A
    B: Delito menor de Clase B
    C: Delito grave de cárcel estatal
    D: Delito grave de segundo grado
  answer: C
  explanation: Conducir en estado de ebriedad (DWI) con un pasajero menor de 15 años
    es un delito grave de cárcel estatal castigado con una multa que no exceda los
    $10,000 y reclusión en una cárcel estatal de 180 días a 2 años.
- id: 276
  category: alcohol_drugs_health
  question: Si un adulto se niega a dar una muestra de sangre o de aliento para su
    análisis, ¿por cuánto tiempo se suspenderá su licencia de conducir por una primera
    infracción?
  choices:
    A: 90 días
    B: 180 días
    C: 365 días
    D: 730 días
  answer: B
  explanation: A una persona que se niegue a dar una muestra de sangre o de aliento
    para su análisis se le suspenderá la licencia de conducir por 180 días por una
    primera infracción.
- id: 277
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes opciones contiene aproximadamente la misma cantidad
    de alcohol que una lata de cerveza de 12 onzas?
  choices:
    A: Una copa de vino de 3 onzas
    B: Una copa de vino de 5 onzas
    C: Una bebida refrescante de vino (wine cooler) de 10 onzas
    D: Una bebida mixta con 3 onzas de licor
  answer: B
  explanation: Una bebida estándar puede incluir una lata de cerveza de 12 onzas,
    una bebida mixta con 1.5 onzas de licor o una copa de vino de 5 onzas. Todas contienen
    aproximadamente la misma cantidad de alcohol.
- id: 278
  category: penalties_and_points
  question: 'Para la primera infracción de un menor por conducir en estado de ebriedad
    (DWI), la posesión de un envase abierto de una bebida alcohólica aumenta el tiempo
    mínimo de reclusión en la cárcel a:'
  choices:
    A: 3 días
    B: 6 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: Para la primera infracción de un menor por conducir en estado de ebriedad
    (DWI), la posesión de un envase abierto de una bebida alcohólica aumenta la reclusión
    mínima a seis días.
- id: 279
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por la primera infracción de un adulto por Conducir
    en Estado de Ebriedad (DWI)?
  choices:
    A: Hasta $500
    B: Hasta $1,000
    C: Hasta $2,000
    D: Hasta $4,000
  answer: C
  explanation: La sanción por la primera infracción de un adulto por conducir en estado
    de ebriedad (DWI) incluye una multa de hasta $2,000.
- id: 280
  category: penalties_and_points
  question: 'El homicidio involuntario por intoxicación se clasifica como:'
  choices:
    A: Delito menor de Clase A
    B: Delito grave de cárcel estatal
    C: Delito grave de tercer grado
    D: Delito grave de segundo grado
  answer: D
  explanation: El homicidio involuntario por intoxicación es un delito grave de segundo
    grado castigado con una multa que no exceda los $10,000 y encarcelamiento de 2
    a 20 años.
- id: 281
  category: alcohol_drugs_health
  question: Además de tener una concentración de alcohol en la sangre (BAC) de 0.08
    o más, ¿de qué otra manera se define el límite legal de intoxicación en Texas?
  choices:
    A: Tener cualquier cantidad detectable de alcohol en el sistema
    B: Cualquier cantidad que resulte en la pérdida del uso normal de las facultades
      mentales o físicas
    C: Negarse a someterse a una prueba de alcoholemia
    D: Conducir con un envase abierto en el vehículo
  answer: B
  explanation: El límite legal en Texas es de 0.08 BAC o cualquier cantidad que resulte
    en la pérdida del uso normal de las facultades mentales o físicas.
- id: 282
  category: penalties_and_points
  question: ¿Cuál es la sanción si un menor se niega a proporcionar una muestra de
    aliento o de sangre por segunda vez o en ocasiones posteriores?
  choices:
    A: Licencia de conducir suspendida por 180 días
    B: Licencia de conducir suspendida por 1 año
    C: Licencia de conducir suspendida por 2 años
    D: Licencia de conducir revocada permanentemente
  answer: C
  explanation: Para la segunda infracción y posteriores de un menor por negarse a
    proporcionar una muestra, su licencia de conducir será suspendida por 2 años.
- id: 283
  category: penalties_and_points
  question: ¿Cuántas horas de servicio comunitario se requieren para la primera infracción
    de un menor por Conducir Bajo la Influencia (DUI) de Alcohol y Drogas?
  choices:
    A: De 8 a 12 horas
    B: De 20 a 40 horas
    C: De 40 a 60 horas
    D: De 80 a 100 horas
  answer: B
  explanation: La primera infracción de DUI de un menor es un delito menor de Clase
    C que requiere de 20 a 40 horas de servicio comunitario.
- id: 284
  category: alcohol_drugs_health
  question: Según el manual, ¿cuál de las siguientes combinaciones representa aproximadamente
    la misma cantidad de alcohol?
  choices:
    A: Una lata de cerveza de 16 onzas, una bebida mixta con 2 onzas de licor o una
      copa de vino de 8 onzas
    B: Una lata de cerveza de 12 onzas, una bebida mixta con 1.5 onzas de licor o
      una copa de vino de 5 onzas
    C: Una lata de cerveza de 8 onzas, una bebida mixta con 1 onza de licor o una
      copa de vino de 4 onzas
    D: Una lata de cerveza de 12 onzas, una bebida mixta con 2 onzas de licor o una
      copa de vino de 6 onzas
  answer: B
  explanation: El manual establece que una bebida puede incluir una lata de cerveza
    de 12 onzas, una bebida mixta con 1.5 onzas de licor o una copa de vino de 5 onzas,
    y todas contienen aproximadamente la misma cantidad de alcohol.
- id: 285
  category: driver_responsibility
  question: Si usted está involucrado en un choque que no es investigado por un oficial
    de la ley y resulta en daños a la propiedad de $1,000 o más, ¿cuál es la fecha
    límite para presentar un informe por escrito al TxDOT?
  choices:
    A: A más tardar el quinto día después de la fecha del choque
    B: A más tardar el décimo día después de la fecha del choque
    C: A más tardar el decimoquinto día después de la fecha del choque
    D: A más tardar el trigésimo día después de la fecha del choque
  answer: B
  explanation: Si un choque no es investigado por las autoridades y resulta en daños
    de $1,000 o más, debe hacer un informe por escrito y presentarlo al TxDOT a más
    tardar el décimo día después de la fecha del choque.
- id: 286
  category: driver_responsibility
  question: ¿En cuál de las siguientes situaciones siempre debe notificar a la agencia
    de la ley correspondiente lo antes posible después de un choque?
  choices:
    A: Cuando el daño a cualquiera de los vehículos parece ser menor a $500
    B: Cuando sospecha que un conductor involucrado está intoxicado
    C: Cuando el choque ocurre en un vecindario residencial
    D: Cuando ambos vehículos pueden ser conducidos de manera segura fuera de la escena
  answer: B
  explanation: 'El manual enumera cuatro situaciones específicas en las que siempre
    debe notificar a las autoridades: lesiones o muerte, los vehículos no se pueden
    mover, un conductor abandona la escena o sospecha que un conductor está intoxicado.'
- id: 287
  category: safe_driving_rules
  question: ¿Qué debe hacer si está en un choque que resulta SOLAMENTE en daños a
    un vehículo, y los vehículos pueden ser conducidos de manera normal y segura?
  choices:
    A: Dejar los vehículos exactamente donde están hasta que llegue la policía a tomar
      fotos
    B: Mover los vehículos lo antes posible a un sitio designado para la investigación
      de choques u otro lugar adecuado
    C: Conducir a casa inmediatamente y llamar a su compañía de seguros
    D: Empujar los vehículos hacia la mediana central y esperar a una grúa
  answer: B
  explanation: Si un choque resulta solo en daños a un vehículo y cada vehículo puede
    ser conducido de manera normal y segura, los conductores deben mover su vehículo
    lo antes posible a un sitio designado para la investigación de choques, una vía
    lateral o la calle transversal adecuada más cercana.
- id: 288
  category: driver_responsibility
  question: ¿Qué se requiere si usted choca y daña un vehículo desatendido y no puede
    localizar al operador o propietario?
  choices:
    A: Abandonar la escena si el daño parece ser menor a $200
    B: Esperar junto al vehículo hasta por una hora antes de irse
    C: Sujetar de forma segura un aviso por escrito en un lugar visible proporcionando
      su nombre, dirección y una declaración de las circunstancias
    D: Llamar a una grúa para que retiren el vehículo desatendido de la vía
  answer: C
  explanation: Si daña un vehículo desatendido y no puede localizar al propietario,
    debe sujetar de forma segura un aviso por escrito en un lugar visible proporcionando
    su nombre, dirección y una declaración de las circunstancias de la colisión.
- id: 289
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de no detenerse en la escena
    de un choque que resulta en la muerte de una persona?
  choices:
    A: Delito menor de Clase A castigable con hasta 1 año de cárcel
    B: Delito grave de primer grado castigable con cadena perpetua
    C: Delito grave de segundo grado castigable con una multa de hasta $10,000 y de
      2 a 20 años de prisión
    D: Delito grave de tercer grado castigable con una multa de hasta $10,000 y de
      2 a 10 años de prisión
  answer: C
  explanation: Un choque de primera infracción que resulta en la muerte de una persona
    donde el conductor no se detiene es un delito grave de segundo grado castigable
    con una multa que no exceda los $10,000 y encarcelamiento en el TDCJ de 2 a 20
    años.
- id: 290
  category: penalties_and_points
  question: ¿Cuál es la sanción por no detenerse en un choque que resulta en menos
    de $200 en daños a un vehículo (primera infracción)?
  choices:
    A: Delito menor de Clase C castigable con una multa que no exceda los $500
    B: Delito menor de Clase B castigable con una multa que no exceda los $2,000
    C: Delito menor de Clase A castigable con hasta 1 año de cárcel
    D: Delito grave de cárcel estatal castigable con hasta 2 años de cárcel
  answer: A
  explanation: Para una primera infracción por no detenerse con menos de $200 en daños,
    la sanción es un delito menor de Clase C castigable con una multa que no exceda
    los $500.
- id: 291
  category: driver_responsibility
  question: Al ayudar a una persona herida en la escena de un choque, ¿cuál es el
    protocolo adecuado con respecto a mover a la víctima?
  choices:
    A: Moverla a un lado de la carretera inmediatamente para evitar más lesiones por
      el tráfico
    B: No mover ni levantar a la víctima a menos que sea absolutamente necesario
    C: Hacer que la víctima se ponga de pie y camine para comprobar si hay huesos
      rotos
    D: Colocar a la víctima en su vehículo para mantenerla abrigada hasta que llegue
      la ambulancia
  answer: B
  explanation: 'El manual aconseja: ''No mueva ni levante a la(s) víctima(s) a menos
    que sea absolutamente necesario. Si se debe mover a una víctima, busque ayuda
    y trate de no cambiar la posición en la que fue encontrada''.'
- id: 292
  category: sharing_the_road
  question: Según las reglas de seguridad para peatones, ¿por dónde debe caminar si
    no hay aceras disponibles?
  choices:
    A: En el lado derecho de la carretera con el flujo del tráfico
    B: En el lado izquierdo de la carretera de frente al tráfico
    C: En el centro de la carretera donde sea más visible
    D: En el arcén de la carretera caminando en zigzag
  answer: B
  explanation: 'Las reglas de seguridad para peatones establecen: ''Camine por el
    lado izquierdo de la carretera si no hay aceras. Salga del pavimento cuando se
    acerque un automóvil''.'
- id: 293
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso si un peatón cruza una calle en cualquier
    punto que no sea dentro de un cruce peatonal en una intersección?
  choices:
    A: El peatón siempre tiene el derecho de paso
    B: El peatón debe ceder el derecho de paso a todos los vehículos
    C: Los vehículos deben ceder el derecho de paso al peatón
    D: El derecho de paso es para quien haya llegado primero al punto de cruce
  answer: B
  explanation: 'El manual establece: ''Si cruza una calle en cualquier punto que no
    sea dentro de un cruce peatonal en una intersección, usted (el peatón) debe ceder
    el derecho de paso a todos los vehículos''.'
- id: 294
  category: safe_driving_rules
  question: Según el Manual del Conductor de Texas, ¿cuáles son las causas más comunes
    de choques en Texas?
  choices:
    A: Malas condiciones climáticas, construcción de carreteras y fallas del vehículo
    B: Exceso de velocidad, no ceder el paso o detenerse adecuadamente y conducir
      bajo la influencia del alcohol
    C: Conducción distraída, conductores sin experiencia y conducción nocturna
    D: Seguir muy de cerca a otro vehículo (tailgating), rebasar de manera incorrecta
      e ignorar las señales de tráfico
  answer: B
  explanation: 'El manual establece explícitamente: ''La mayoría de los choques en
    Texas son el resultado del exceso de velocidad, no ceder el paso o detenerse adecuadamente
    y conducir bajo la influencia del alcohol''.'
- id: 295
  category: driver_responsibility
  question: Si necesita la dirección y el número de teléfono de la compañía de seguros
    del otro conductor después de un choque y no aparece en su tarjeta, ¿a quién debe
    llamar?
  choices:
    A: Al Departamento de Transporte de Texas
    B: Al Departamento de Seguridad Pública de Texas
    C: Al Departamento de Seguros de Texas
    D: A la línea que no es de emergencia del departamento de policía local
  answer: C
  explanation: 'El manual indica: ''Si tiene el nombre de la compañía de seguros del
    conductor y la información no aparece directamente en la tarjeta de seguro, llame
    al Departamento de Seguros de Texas al (800) 252-3439 para obtener la dirección
    y el número de teléfono de la compañía''.'
- id: 296
  category: vehicle_information
  question: Según el Departamento de Seguros de Texas, ¿qué tipo de cobertura pagará
    los daños en choques de atropello y fuga (hit-and-run) si se reportan a una agencia
    de la ley?
  choices:
    A: Cobertura a todo riesgo (comprehensive)
    B: Cobertura de colisión
    C: Cobertura de responsabilidad civil
    D: Cobertura de automovilista sin seguro
  answer: D
  explanation: 'El manual establece: ''El Departamento de Seguros de Texas advierte
    que la cobertura de automovilista sin seguro pagará los daños en choques de atropello
    y fuga reportados a una agencia de la ley''.'
- id: 297
  category: sharing_the_road
  question: Al cruzar una calle por un cruce peatonal, ¿qué posición debe mantener
    un peatón?
  choices:
    A: Mantenerse en el lado izquierdo del cruce peatonal
    B: Mantenerse en el lado derecho del cruce peatonal si es posible
    C: Caminar exactamente por el centro del cruce peatonal
    D: Caminar en diagonal a través del cruce peatonal
  answer: B
  explanation: 'Las reglas de seguridad para peatones establecen: ''Al cruzar por
    un cruce peatonal, manténgase a la derecha si es posible''.'
- id: 298
  category: sharing_the_road
  question: ¿A quién se le permite legalmente llevar un bastón blanco en una calle
    o carretera pública?
  choices:
    A: A cualquier peatón que camine de noche.
    B: A los peatones que cruzan fuera de un cruce peatonal.
    C: A las personas ciegas, parcialmente ciegas o discapacitadas.
    D: A los oficiales de control de tráfico y guardias de cruce.
  answer: C
  explanation: El manual establece que las personas ciegas, parcialmente ciegas o
    discapacitadas pueden llevar un bastón blanco mientras caminan. Otras personas
    no deben mostrar un bastón blanco en ninguna calle o carretera pública.
- id: 299
  category: sharing_the_road
  question: ¿Cómo se manejan las infracciones a las leyes de tránsito para una persona
    que opera una bicicleta?
  choices:
    A: Reciben una advertencia en lugar de una multa.
    B: Están sujetos a las mismas sanciones que una persona que opera un vehículo
      motorizado.
    C: Solo se les multa con la mitad del monto de una infracción de vehículo motorizado.
    D: Las infracciones en bicicleta no se registran en el historial de manejo del
      individuo.
  answer: B
  explanation: Cualquier persona que opere una bicicleta está sujeta a las mismas
    sanciones por violar una ley de tránsito que una persona que opera un vehículo
    motorizado, y las condenas se registrarán en su historial de manejo.
- id: 300
  category: safe_driving_rules
  question: ¿Cómo debe señalar un ciclista que se va a detener?
  choices:
    A: Apuntando su brazo izquierdo horizontalmente.
    B: Apuntando su brazo derecho horizontalmente.
    C: Apuntando su brazo izquierdo hacia arriba.
    D: Apuntando su brazo izquierdo hacia abajo.
  answer: D
  explanation: Los ciclistas deben señalar que se detienen usando su brazo izquierdo
    apuntando hacia abajo.
- id: 301
  category: safe_driving_rules
  question: ¿Por dónde debe circular un ciclista cuando transita en una vía de un
    solo sentido con dos o más carriles de tráfico marcados?
  choices:
    A: En el centro del carril más a la derecha.
    B: Lo más cerca posible del bordillo izquierdo o borde de la vía.
    C: Lo más cerca posible del bordillo derecho o borde de la vía.
    D: En cualquier carril que se mueva más rápido que el tráfico.
  answer: B
  explanation: Al conducir una bicicleta en una vía de un solo sentido con dos o más
    carriles de tráfico marcados, el ciclista debe circular lo más cerca posible del
    bordillo izquierdo o borde de la vía.
- id: 302
  category: vehicle_information
  question: ¿Qué tipo de luz delantera se requiere en una bicicleta que se usa de
    noche?
  choices:
    A: Una luz amarilla visible desde 300 pies.
    B: Una luz blanca visible desde al menos 500 pies.
    C: Una luz roja intermitente visible desde 200 pies.
    D: Una luz blanca visible desde al menos 1000 pies.
  answer: B
  explanation: Toda bicicleta que se use de noche debe estar equipada con un faro
    en la parte delantera que emita una luz blanca visible desde una distancia de
    al menos 500 pies.
- id: 303
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a los ciclistas que transportan paquetes
    o bultos?
  choices:
    A: No deben transportar ningún paquete que pese más de 10 libras.
    B: Deben usar una canasta delantera para todos los paquetes.
    C: No deben transportar nada que les impida mantener al menos una mano en el manubrio.
    D: Tienen prohibido transportar cualquier paquete mientras circulan por una vía
      pública.
  answer: C
  explanation: Un ciclista nunca debe transportar ningún paquete, bulto o artículo
    que le impida mantener al menos una mano en el manubrio.
- id: 304
  category: defensive_driving
  question: Según los principios del manejo defensivo, ¿qué exige la ley que hagan
    los conductores con respecto a los errores de otros conductores?
  choices:
    A: Reportarlos inmediatamente a las autoridades.
    B: Tocar la bocina para alertar al otro conductor.
    C: Protegerse mutuamente de sus propios errores.
    D: Mantener su derecho de paso independientemente del error.
  answer: C
  explanation: Para evitar choques, el conductor defensivo debe saber que la ley exige
    que los conductores se protejan mutuamente de sus propios errores.
- id: 305
  category: safe_driving_rules
  question: ¿Bajo qué condiciones un niño menor de 8 años está exento de ir asegurado
    en un asiento de seguridad para niños?
  choices:
    A: Si viaja en el asiento trasero de una camioneta (pickup).
    B: Si mide más de 4'9" de altura.
    C: Si lleva puesto un cinturón de seguridad estándar para adultos.
    D: Si está acompañado por un padre o tutor.
  answer: B
  explanation: Todo niño menor de 8 años debe ir asegurado en un asiento de seguridad
    para niños aprobado a nivel federal si ocupa un asiento en un vehículo equipado
    con cinturón de seguridad, a menos que el niño mida más de 4'9" de altura.
- id: 306
  category: driver_responsibility
  question: ¿Cuánto mayores son sus probabilidades de morir en un choque si sale despedido
    de su vehículo?
  choices:
    A: Dos veces mayores.
    B: Tres veces mayores.
    C: Cuatro veces mayores.
    D: Cinco veces mayores.
  answer: D
  explanation: Los cinturones de seguridad ayudan a evitar que salga despedido de
    su vehículo. Sus probabilidades de morir son cinco veces mayores si sale despedido
    de su vehículo.
- id: 307
  category: penalties_and_points
  question: ¿Cuál es la sanción que se le impone a un conductor si un pasajero menor
    de 17 años viaja sin cinturón de seguridad?
  choices:
    A: Una multa de $25 a $50.
    B: Una multa de $50 a $100.
    C: Una multa de $100 a $200.
    D: Una multa de $200 a $500.
  answer: C
  explanation: Según la tabla de sanciones, si un pasajero menor de 17 años viaja
    sin cinturón de seguridad, se le impone al conductor una multa de $100 a $200.
- id: 308
  category: safe_driving_rules
  question: Por lo general, es un delito permitir que un niño ocupe la caja de una
    camioneta o remolque de caja abierta si es menor de ¿qué edad?
  choices:
    A: 15 años de edad.
    B: 16 años de edad.
    C: 17 años de edad.
    D: 18 años de edad.
  answer: D
  explanation: Es un delito conducir una camioneta de caja abierta, un camión de plataforma
    abierta o remolcar un remolque de plataforma abierta cuando un niño menor de 18
    años de edad ocupa la caja o plataforma del camión o remolque.
- id: 309
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una defensa válida contra el enjuiciamiento
    por conducir con un niño menor de 18 años en la caja abierta de una camioneta
    (pickup)?
  choices:
    A: El vehículo viaja a menos de 25 mph.
    B: El vehículo está siendo operado en una playa.
    C: El niño está acompañado por un adulto en la caja de la camioneta.
    D: El vehículo viaja una distancia de menos de 5 millas.
  answer: B
  explanation: Es una defensa contra el enjuiciamiento que el conductor estuviera
    operando o remolcando el vehículo en una playa, en un desfile/emergencia, transportando
    trabajadores agrícolas, en el único vehículo propiedad del hogar o en un paseo
    en carreta de heno permitido.
- id: 310
  category: sharing_the_road
  question: ¿Cuál es uno de los propósitos de una marca de carril compartido en una
    vía?
  choices:
    A: Designar un carril exclusivamente para el uso de bicicletas.
    B: Reducir la probabilidad de que un ciclista choque contra la puerta abierta
      de un vehículo estacionado.
    C: Indicar dónde los ciclistas deben bajarse y caminar.
    D: Advertir a los automovilistas de un cruce peatonal próximo.
  answer: B
  explanation: La marca de carril compartido se puede usar para ayudar a los ciclistas
    con el posicionamiento lateral en un carril compartido con estacionamiento paralelo
    en la calle, con el fin de reducir la probabilidad de que un ciclista choque contra
    la puerta abierta de un vehículo estacionado.
- id: 311
  category: alcohol_drugs_health
  question: ¿Qué establece el manual con respecto a los peatones y el alcohol?
  choices:
    A: Los peatones bajo la influencia del alcohol deben caminar por el lado izquierdo
      de la vía.
    B: Los peatones pueden consumir alcohol en la vía si usan ropa reflectante.
    C: Los peatones no deben caminar por una vía cuando están bajo la influencia del
      alcohol.
    D: Los peatones bajo la influencia del alcohol tienen el derecho de paso sobre
      los vehículos.
  answer: C
  explanation: 'El manual establece: "No camine por una vía cuando esté bajo la influencia
    o consumiendo una bebida alcohólica. El alcohol es un factor contribuyente en
    los accidentes de tránsito de peatones".'
- id: 312
  category: safe_driving_rules
  question: Según la ley de Texas, ¿es un delito operar un vehículo motorizado que
    remolca un bote o una moto acuática si una persona que viaja dentro o sobre el
    bote es menor de qué edad?
  choices:
    A: 15 años de edad
    B: 16 años de edad
    C: 18 años de edad
    D: 21 años de edad
  answer: C
  explanation: Es un delito que una persona opere un vehículo motorizado que remolca
    un bote o una moto acuática en el cual viaja una persona menor de 18 años de edad.
- id: 313
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una defensa válida contra el enjuiciamiento
    por operar un camión mientras otra persona ocupa un remolque arrastrado por el
    camión?
  choices:
    A: La persona en el remolque es mayor de 21 años.
    B: El vehículo viaja por una autopista interestatal.
    C: El remolque está diseñado para ser habitado por personas.
    D: El conductor viaja a menos de 30 mph.
  answer: C
  explanation: Es una defensa contra el enjuiciamiento que la persona que ocupa el
    remolque o semirremolque se encontraba en una parte del vehículo diseñada para
    ser habitada por personas.
- id: 314
  category: safe_driving_rules
  question: ¿Qué debe hacer con las luces de su vehículo si es detenido por las autoridades
    policiales durante la noche?
  choices:
    A: Apagar todas las luces para evitar cegar al oficial.
    B: Encender las luces altas.
    C: Encender la luz interior del techo.
    D: Parpadear los faros delanteros repetidamente.
  answer: C
  explanation: Si es detenido por las autoridades policiales durante la noche, debe
    encender la luz interior del techo.
- id: 315
  category: safe_driving_rules
  question: Cuando es detenido por un oficial de policía, ¿dónde debe mantener las
    manos mientras espera instrucciones?
  choices:
    A: En su regazo o en los bolsillos.
    B: Claramente a la vista en la parte superior del volante.
    C: Fuera de la ventana del lado del conductor.
    D: Buscando su licencia en la guantera.
  answer: B
  explanation: Debe mantener ambas manos claramente a la vista en la parte superior
    del volante y esperar a que el oficial de policía le dé instrucciones.
- id: 316
  category: defensive_driving
  question: Si un vehículo de emergencia autorizado se acerca para detenerlo, pero
    siente que el área no es segura para detenerse de inmediato, ¿cuál es un paso
    que debe tomar?
  choices:
    A: Acelerar para encontrar un lugar seguro más rápido.
    B: Encender las luces de emergencia y conducir lentamente por debajo del límite
      de velocidad indicado.
    C: Apagar todas las luces para que el oficial sepa que está buscando un lugar.
    D: Detenerse bruscamente en el medio del carril.
  answer: B
  explanation: Si siente que el área no es segura para detenerse de inmediato, puede
    encender las luces de emergencia y conducir lenta y cuidadosamente por debajo
    del límite de velocidad indicado.
- id: 317
  category: driver_responsibility
  question: ¿Por qué los conductores y pasajeros deben permanecer en el vehículo durante
    una parada de tráfico a menos que se les pida que salgan?
  choices:
    A: Salir del vehículo es una infracción de tránsito que conlleva una multa.
    B: Salir del vehículo puede ser percibido como un comportamiento agresivo y una
      amenaza para la seguridad del oficial.
    C: Es ilegal pararse a un lado de la autopista.
    D: El oficial necesita inspeccionar primero el exterior del vehículo.
  answer: B
  explanation: Los conductores y pasajeros no deben salir del vehículo a menos que
    se les pida que lo hagan. Salir de su vehículo puede ser percibido como un comportamiento
    agresivo y una amenaza para la seguridad del oficial.
- id: 318
  category: safe_driving_rules
  question: ¿Cuándo es el mejor momento para buscar su licencia de conducir y los
    documentos del seguro durante una parada de tráfico?
  choices:
    A: Tan pronto como vea las luces de la policía detrás de usted.
    B: Mientras el oficial camina hacia su vehículo.
    C: Después de informar al oficial dónde se encuentran y seguir sus instrucciones.
    D: Solo después de que el oficial amenace con arrestarlo.
  answer: C
  explanation: Antes de meter la mano en la guantera o debajo del asiento para buscar
    su comprobante de seguro o licencia de conducir, informe al oficial dónde se encuentran
    los artículos y siga las instrucciones del oficial.
- id: 319
  category: driver_responsibility
  question: Si es arrestado legalmente durante una parada de tráfico, ¿qué información
    está obligado por ley a proporcionar al oficial?
  choices:
    A: Su nombre, dirección de residencia y fecha de nacimiento.
    B: Su número de seguro social y empleador.
    C: Solo su nombre y número de teléfono.
    D: No está obligado a proporcionar ninguna información.
  answer: A
  explanation: Si es arrestado legalmente, también está obligado a dar su nombre,
    dirección de residencia y fecha de nacimiento.
- id: 320
  category: driver_responsibility
  question: ¿Bajo qué circunstancia puede un oficial de policía registrar su vehículo
    sin su consentimiento?
  choices:
    A: Si conduce un automóvil deportivo rojo.
    B: Si se niega a responder a sus preguntas.
    C: Si el oficial tiene causa probable para creer que su vehículo contiene evidencia
      de un delito.
    D: Un oficial nunca puede registrar su vehículo sin su consentimiento.
  answer: C
  explanation: Si un oficial tiene causa probable para creer que su vehículo contiene
    evidencia de un delito, puede ser registrado sin su consentimiento.
- id: 321
  category: penalties_and_points
  question: ¿Qué delito se comete si una persona da un nombre ficticio a un oficial
    de la ley que la ha detenido legalmente?
  choices:
    A: Evadir el arresto
    B: Delito de identificación falsa
    C: Conducción agresiva
    D: Delito menor de clase C
  answer: B
  explanation: Una persona comete un delito de identificación falsa si da un nombre
    falso o ficticio a un oficial de la ley que la ha arrestado o detenido legalmente.
- id: 322
  category: penalties_and_points
  question: ¿Cuál de las siguientes acciones lo someterá a sanciones mayores si está
    evadiendo el arresto o la detención?
  choices:
    A: Huir a pie por un vecindario residencial.
    B: Usar un vehículo o embarcación mientras evade el arresto.
    C: Negarse a responder las preguntas del oficial.
    D: Negar el consentimiento para registrar su vehículo.
  answer: B
  explanation: Estará sujeto a sanciones mayores si usa un vehículo o embarcación
    mientras evade el arresto o si causa lesiones a otra persona.
- id: 323
  category: defensive_driving
  question: Para ayudar a evitar la furia al volante, ¿cómo debe usar la bocina (claxon)
    de su vehículo si es necesario?
  choices:
    A: Mantener presionada la bocina durante al menos cinco segundos.
    B: Dar un toque ligero a la bocina.
    C: Tocar la bocina repetidamente mientras hace contacto visual.
    D: Nunca usar la bocina bajo ninguna circunstancia.
  answer: B
  explanation: Si necesita usar la bocina, dé un toque ligero; no la mantenga presionada.
- id: 324
  category: defensive_driving
  question: ¿Cuál de los siguientes es un ejemplo de comportamiento de conducción
    agresiva que debe evitarse?
  choices:
    A: Usar la luz direccional antes de cambiar de carril.
    B: Acelerar intencionalmente para evitar que alguien lo rebase o entre a su carril.
    C: Permitir tiempo adicional para su viaje en caso de tráfico.
    D: Seguir a otros vehículos a una distancia segura.
  answer: B
  explanation: 'Los consejos para evitar la furia al volante incluyen: No reduzca
    la velocidad intencionalmente, no frene bruscamente ni acelere para evitar que
    alguien lo rebase o entre a su carril de circulación.'
- id: 325
  category: safe_driving_rules
  question: Si transporta un arma de fuego en su vehículo, ¿qué se le recomienda hacer
    con respecto a su licencia y documentación de seguro?
  choices:
    A: Guardar el arma de fuego en el mismo compartimento que sus documentos.
    B: Entregar el arma al oficial junto con sus documentos.
    C: Guardar el arma de fuego en un lugar separado de su licencia y documentación
      de seguro.
    D: Colocar el arma de fuego en el asiento del pasajero antes de que el oficial
      se acerque.
  answer: C
  explanation: Se recomienda a los conductores que transportan armas de fuego en sus
    vehículos que las guarden en un lugar separado de la licencia y la documentación
    del seguro.
- id: 326
  category: safe_driving_rules
  question: 'Un vehículo eléctrico de vecindario solo puede ser operado en una calle
    o carretera si el límite de velocidad publicado es de:'
  choices:
    A: 30 mph o menos
    B: 35 mph o menos
    C: 45 mph o menos
    D: 55 mph o menos
  answer: C
  explanation: Los vehículos eléctricos de vecindario solo pueden ser operados en
    una calle o carretera cuando el límite de velocidad publicado es de 45 mph o menos.
- id: 327
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo publicado para una calle o carretera
    donde se puede operar un scooter con motor?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 45 mph
  answer: C
  explanation: Un scooter con motor solo puede ser operado en una calle o carretera
    cuando el límite de velocidad publicado es de 35 mph o menos.
- id: 328
  category: vehicle_information
  question: ¿Cómo define el Manual del Conductor de Texas un Dispositivo Electrónico
    de Movilidad Personal Asistida (EPAMD, por sus siglas en inglés)?
  choices:
    A: Un vehículo todoterreno de cuatro ruedas con motor de gasolina
    B: Un dispositivo de dos ruedas no en tándem diseñado para transportar a una persona,
      que se autoequilibra
    C: Un scooter a gasolina con un motor que no excede los 40 cc
    D: Una bicicleta con ruedas de más de 14 pulgadas de diámetro
  answer: B
  explanation: Un EPAMD, como un Segway, se define como un dispositivo de dos ruedas
    no en tándem diseñado para transportar a una persona, que se autoequilibra y es
    impulsado por un sistema de propulsión eléctrica.
- id: 329
  category: sharing_the_road
  question: Al operar un Dispositivo Electrónico de Movilidad Personal Asistida (EPAMD)
    en una vía pública, ¿por dónde se debe circular?
  choices:
    A: En el centro del carril
    B: Tan cerca como sea posible del borde izquierdo
    C: Tan cerca como sea posible del borde derecho
    D: En el acotamiento (hombro) de frente al tráfico que se aproxima
  answer: C
  explanation: Cuando se opera en una vía pública, un EPAMD debe circular tan cerca
    como sea posible del borde derecho.
- id: 330
  category: defensive_driving
  question: Según las 'Claves para una conducción segura', ¿cuál de las siguientes
    afirmaciones es cierta con respecto a la cortesía y el derecho de paso?
  choices:
    A: El derecho de paso es antes que la seguridad
    B: La seguridad es antes que el derecho de paso
    C: Siempre debe insistir en tomar el derecho de paso
    D: La cortesía solo es requerida en áreas residenciales
  answer: B
  explanation: 'En la sección ''Sus claves para una conducción segura'', el manual
    establece para la Cortesía: ''La seguridad es antes que el derecho de paso''.'
- id: 331
  category: vehicle_information
  question: Al transportar materiales sueltos en las vías públicas, la carga debe
    estar completamente cerrada y cubierta. ¿Cuál de los siguientes materiales está
    exento de este requisito?
  choices:
    A: Tierra y arena
    B: Grava
    C: Astillas de madera
    D: Productos agrícolas en su estado natural
  answer: D
  explanation: El manual establece que ninguna persona debe transportar material suelto
    capaz de volar o derramarse (como tierra, arena, grava, astillas de madera) a
    menos que esté cerrado y cubierto, a excepción de los productos agrícolas en su
    estado natural.
- id: 332
  category: safe_driving_rules
  question: 'Cuando un vehículo remolca a otro, la barra de tracción, cadena, cuerda,
    cable u otra conexión no debe medir más de:'
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: Cuando un vehículo remolca a otro, la conexión no debe medir más de
    15 pies de un vehículo a otro.
- id: 333
  category: vehicle_information
  question: ¿Qué tipo de bandera debe colocarse en la conexión cuando un vehículo
    remolca a otro?
  choices:
    A: Una bandera roja cuadrada de no menos de 10 pulgadas
    B: Una bandera blanca cuadrada de no menos de 12 pulgadas
    C: Una bandera amarilla cuadrada de no menos de 15 pulgadas
    D: Una bandera naranja cuadrada de no menos de 18 pulgadas
  answer: B
  explanation: Al remolcar, debe colocar una bandera blanca cuadrada de no menos de
    12 pulgadas en la conexión.
- id: 334
  category: driver_responsibility
  question: Para prevenir la intoxicación por monóxido de carbono, ¿cuál de las siguientes
    acciones NO debe hacer?
  choices:
    A: Asegurarse de recibir suficiente aire fresco
    B: Dejar las rejillas de ventilación abiertas cuando siga de cerca a otro automóvil
    C: Mover a una víctima de intoxicación al aire fresco
    D: Llamar al 911 si encuentra a una víctima de intoxicación
  answer: B
  explanation: El manual enumera explícitamente 'Dejar las rejillas de ventilación
    abiertas cuando siga de cerca a otro automóvil' en la sección de 'Lo que no debe
    hacer' para prevenir la intoxicación por monóxido de carbono.
- id: 335
  category: license_system
  question: Si solicita el código de restricción por 'Impedimento de comunicación
    con un oficial de la paz' (Communication Impediment with a Peace Officer) en su
    licencia de conducir de Texas, ¿dónde se colocará el código?
  choices:
    A: En la parte delantera de la licencia en texto rojo
    B: En la parte posterior de su licencia
    C: En la placa de su vehículo
    D: En la calcomanía de registro de su vehículo
  answer: B
  explanation: El código por 'Impedimento de comunicación con un oficial de la paz'
    irá en la parte posterior de su licencia, de manera similar a otros códigos como
    el de donante de órganos o lentes correctivos.
- id: 336
  category: license_system
  question: Según el glosario, ¿con qué tipo de licencia de conducir se puede operar
    un autociclo (autocycle)?
  choices:
    A: Licencia de conducir Clase A
    B: Licencia de conducir Clase B
    C: Licencia de conducir Clase C
    D: Licencia de conducir Clase M (Motocicleta)
  answer: C
  explanation: El glosario establece que un autociclo se puede operar con una licencia
    de conducir Clase C.
- id: 337
  category: safe_driving_rules
  question: ¿Cuál es la definición de la 'ley básica de velocidad' (basic speed law)?
  choices:
    A: Siempre debe conducir exactamente al límite de velocidad publicado
    B: No puede conducir más rápido de lo que sea seguro y prudente para las condiciones
      existentes, independientemente de los límites de velocidad publicados
    C: Puede exceder el límite de velocidad por 5 mph para rebasar a otro vehículo
    D: Debe conducir al menos 10 mph por debajo del límite de velocidad en condiciones
      de mal tiempo
  answer: B
  explanation: La ley básica de velocidad significa que no puede conducir más rápido
    de lo que sea seguro y prudente para las condiciones existentes, independientemente
    de los límites de velocidad publicados.
- id: 338
  category: vehicle_information
  question: Según el glosario, una bicicleta es impulsada por fuerza humana y tiene
    dos ruedas en tándem. Para ser clasificada como bicicleta, ¿al menos una de estas
    ruedas debe tener más de qué tamaño de diámetro?
  choices:
    A: 10 pulgadas
    B: 12 pulgadas
    C: 14 pulgadas
    D: 16 pulgadas
  answer: C
  explanation: Una bicicleta se define como un vehículo que tiene dos ruedas en tándem,
    de las cuales al menos una tiene más de 14 pulgadas de diámetro.
- id: 339
  category: vehicle_information
  question: Por lo general, se requieren cadenas de seguridad al remolcar un remolque.
    ¿Cuál de las siguientes es una excepción a esta regla?
  choices:
    A: Remolcar una casa rodante para uso recreativo
    B: Remolcar un remolque de bote a un lago
    C: Remolcar un remolque o semirremolque utilizado para fines agrícolas
    D: Remolcar un vehículo averiado a un mecánico
  answer: C
  explanation: Los requisitos de las cadenas de seguridad no se aplican a un automóvil
    de pasajeros o camioneta ligera que remolca un remolque o semirremolque utilizado
    para fines agrícolas.
- id: 340
  category: safe_driving_rules
  question: Al cambiar de carril, ¿qué debe hacer con su luz direccional después de
    completar el cambio de carril?
  choices:
    A: Dejar la luz direccional encendida durante al menos una milla
    B: Apagar la luz direccional después de completar su cambio de carril
    C: Solo usar la luz direccional si hay un vehículo directamente detrás de usted
    D: Tocar la bocina antes de cambiar de carril en lugar de usar una señal
  answer: B
  explanation: 'El manual establece: ''Señalice adecuadamente sus intenciones de cambiar
    de carril y cambie de carril cuando sea seguro hacerlo. Apague su luz direccional
    después de completar su cambio de carril''.'
- id: 341
  category: safe_driving_rules
  question: ¿Qué es un punto ciego?
  choices:
    A: Un área donde la visión del conductor está bloqueada por el sol
    B: Un área que los espejos retrovisores no pueden mostrar
    C: Una zona frente al vehículo donde se ocultan objetos pequeños
    D: Una sección de la carretera sin alumbrado público
  answer: B
  explanation: Según el manual, un punto ciego es un área que los espejos retrovisores
    no pueden mostrar.
- id: 342
  category: alcohol_drugs_health
  question: ¿Qué mide la concentración de alcohol en la sangre (BAC)?
  choices:
    A: La cantidad de alcohol en la sangre expresada como un porcentaje de alcohol
      etílico en relación con el volumen de líquidos en el torrente sanguíneo
    B: El número de bebidas alcohólicas consumidas en una hora
    C: El límite legal de alcohol permitido para conductores comerciales
    D: La velocidad a la que el hígado procesa el alcohol
  answer: A
  explanation: La concentración de alcohol en la sangre (BAC) se define como la cantidad
    de alcohol en la sangre expresada como un porcentaje de alcohol etílico en relación
    con el volumen de líquidos en el torrente sanguíneo.
- id: 343
  category: vehicle_information
  question: ¿Un vehículo se considera un vehículo de motor comercial si está diseñado
    para transportar a cuántos pasajeros (incluyendo al conductor)?
  choices:
    A: 8 o más
    B: 10 o más
    C: 12 o más
    D: 16 o más
  answer: D
  explanation: Un vehículo de motor comercial incluye un vehículo que está diseñado
    para transportar a 16 o más pasajeros, incluyendo al conductor.
- id: 344
  category: signs_and_signals
  question: ¿Qué es un "crossbuck" (señal en forma de cruz)?
  choices:
    A: Una zona de cruce peatonal en un área escolar
    B: Una señal grande y blanca en forma de X ubicada antes de un cruce de ferrocarril
    C: Una intersección donde cuatro carreteras se encuentran en ángulos iguales
    D: Una señal de advertencia de cruce de ciervos
  answer: B
  explanation: Un "crossbuck" es una señal grande y blanca en forma de X ubicada antes
    de un cruce de ferrocarril.
- id: 345
  category: defensive_driving
  question: ¿Cuál es la definición de manejo defensivo?
  choices:
    A: Conducir por debajo del límite de velocidad en todo momento para evitar colisiones
    B: Protegerse a sí mismo y a los demás de situaciones de conducción peligrosas
      e inesperadas mediante el uso de un sistema de gestión de espacio
    C: Ceder el derecho de paso a todos los demás vehículos en las intersecciones
    D: Desviarse bruscamente para evitar obstáculos en la calzada
  answer: B
  explanation: El manejo defensivo es protegerse a sí mismo y a los demás de situaciones
    de conducción peligrosas e inesperadas mediante el uso de un sistema de gestión
    de espacio.
- id: 346
  category: alcohol_drugs_health
  question: 'En Texas, un menor puede ser acusado de Conducir Bajo la Influencia (DUI)
    si conduce con:'
  choices:
    A: Una concentración de alcohol en la sangre de 0.08% o más
    B: Cualquier cantidad detectable de alcohol en su sistema
    C: Una concentración de alcohol en la sangre superior al 0.05%
    D: Recipientes abiertos de alcohol en el vehículo
  answer: B
  explanation: Conducir bajo la influencia (DUI) es un delito menor de Clase C por
    el cual un menor puede ser acusado en Texas si conduce con cualquier cantidad
    detectable de alcohol en su sistema.
- id: 347
  category: driver_responsibility
  question: ¿Qué causa la hipnosis de carretera?
  choices:
    A: Conducir bajo la influencia de alucinógenos
    B: Mirar fijamente los faros del tráfico en sentido contrario por la noche
    C: La concentración en la carretera por delante y la monotonía de conducir
    D: La falta de sueño antes de un viaje largo por carretera
  answer: C
  explanation: La hipnosis de carretera es una condición de somnolencia o estado de
    trance causada por la concentración en la carretera por delante y la monotonía
    de conducir.
- id: 348
  category: safe_driving_rules
  question: 'El hidroplaneo ocurre cuando:'
  choices:
    A: Los frenos de un vehículo fallan debido a la humedad excesiva
    B: La superficie de contacto de una llanta pierde contacto con la carretera al
      elevarse sobre el agua
    C: Un conductor pierde visibilidad durante una fuerte tormenta de lluvia
    D: Un vehículo es conducido hacia una intersección inundada
  answer: B
  explanation: El hidroplaneo ocurre cuando la superficie de contacto de una llanta
    pierde contacto con la carretera al elevarse sobre el agua.
- id: 349
  category: penalties_and_points
  question: ¿Qué significa la ley de consentimiento implícito para los conductores?
  choices:
    A: Los conductores consienten automáticamente a registros de vehículos en los
      puntos de control fronterizos
    B: Los conductores consienten automáticamente a someterse a pruebas de contenido
      de alcohol en la sangre y otras drogas si son detenidos por sospecha de consumo
    C: Los conductores acuerdan pagar todas las multas por infracciones de tránsito
      dentro de 30 días
    D: Los conductores consienten a la donación de órganos al recibir su licencia
  answer: B
  explanation: La ley de consentimiento implícito significa que cualquier persona
    que recibe una licencia de conducir consiente automáticamente a someterse a pruebas
    de contenido de alcohol en la sangre y otras drogas si es detenida por sospecha
    de consumo de alcohol o drogas mientras conduce.
- id: 350
  category: driver_responsibility
  question: ¿Qué tipo de seguro proporciona compensación por los daños que el asegurado
    está legalmente obligado a pagar y cubre a otros cuando usted tiene la culpa?
  choices:
    A: Seguro de colisión
    B: Seguro a todo riesgo (comprehensive)
    C: Seguro de responsabilidad civil
    D: Seguro sin culpa (no-fault)
  answer: C
  explanation: El seguro de responsabilidad civil proporciona compensación por los
    daños que el asegurado está legalmente obligado a pagar; cubre a otros cuando
    usted tiene la culpa.
- id: 351
  category: vehicle_information
  question: 'Un ciclomotor (moped) es un ciclo impulsado por motor que no puede alcanzar
    una velocidad en una milla de más de:'
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: Un ciclomotor es un ciclo impulsado por motor que no puede alcanzar
    una velocidad en una milla de más de 30 mph.
- id: 352
  category: license_system
  question: ¿Cuál es la diferencia entre la cancelación y la denegación de una licencia
    de conducir?
  choices:
    A: La cancelación es temporal, mientras que la denegación es permanente
    B: La cancelación es la retirada de una licencia hasta que el conductor esté calificado,
      mientras que la denegación es la retención de una licencia porque la persona
      no es elegible
    C: La cancelación se aplica a conductores comerciales, mientras que la denegación
      se aplica a conductores regulares
    D: La cancelación es emitida por un tribunal, mientras que la denegación es emitida
      por un oficial de policía
  answer: B
  explanation: La cancelación es la retirada de una licencia o privilegio de conducir
    hasta que el conductor esté calificado o sea elegible. La denegación es la retención
    de una licencia o privilegio de conducir porque la persona no es elegible para
    obtener una licencia.
- id: 353
  category: penalties_and_points
  question: ¿Qué es un dispositivo de bloqueo de encendido (ignition interlock device)?
  choices:
    A: Un dispositivo que evita que un vehículo sea robado bloqueando el volante
    B: Un dispositivo de control mecánico en el que el conductor debe exhalar para
      arrancar el vehículo
    C: Un sistema que apaga automáticamente el motor si el vehículo está inactivo
      por mucho tiempo
    D: Una herramienta utilizada por los mecánicos para probar las emisiones de un
      vehículo
  answer: B
  explanation: Un dispositivo de bloqueo de encendido es un dispositivo de control
    mecánico especial instalado en el tablero de un vehículo motorizado. Un conductor
    debe exhalar en el dispositivo para arrancar el vehículo.
- id: 354
  category: safe_driving_rules
  question: ¿Cuál de las siguientes opciones describe una carrera de aceleración (drag
    race)?
  choices:
    A: Conducir un vehículo fuera de la carretera de manera imprudente
    B: Dos o más vehículos acelerando uno al lado del otro en un intento competitivo
      de superarse en distancia
    C: Entrar y salir zigzagueando del tráfico en una autopista de acceso controlado
    D: Huir de un vehículo policial a altas velocidades
  answer: B
  explanation: Una carrera de aceleración es la operación de dos o más vehículos desde
    un punto uno al lado del otro a velocidades de aceleración en un intento competitivo
    de superarse en distancia, o comparar velocidades en un recorrido seleccionado.
- id: 355
  category: safe_driving_rules
  question: ¿Qué significa 'sobrepasar' (over drive) el alcance de sus faros?
  choices:
    A: Conducir con las luces altas encendidas en condiciones de niebla
    B: Conducir a una velocidad que hace que su distancia de frenado sea mayor que
      la distancia iluminada por sus faros
    C: Usar los faros durante el día para aumentar la visibilidad
    D: Conducir con los faros apuntando demasiado alto, cegando al tráfico en sentido
      contrario
  answer: B
  explanation: Sobrepasar el alcance de los faros significa conducir a una velocidad
    que hace que su distancia de frenado sea mayor que la distancia iluminada por
    sus faros.
- id: 356
  category: safe_driving_rules
  question: Al estacionar en paralelo, ¿a qué distancia debe estar su vehículo del
    bordillo (acera)?
  choices:
    A: De 6 a 18 pulgadas
    B: De 12 a 24 pulgadas
    C: De 2 a 10 pulgadas
    D: De 18 a 24 pulgadas
  answer: A
  explanation: Al estacionar en paralelo, el vehículo se alinea de forma paralela
    o en la misma dirección que el bordillo y debe estar a una distancia de 6 a 18
    pulgadas del mismo.
- id: 357
  category: vehicle_information
  question: ¿Cuál de los siguientes es un ejemplo de un dispositivo de retención pasivo?
  choices:
    A: Un cinturón de regazo manual
    B: Un asiento de seguridad para niños
    C: Una bolsa de aire (airbag)
    D: Un reposacabezas
  answer: C
  explanation: Un dispositivo de retención pasivo, como una bolsa de aire o un cinturón
    de seguridad automático, funciona sin que el pasajero o el conductor tengan que
    activarlo.
- id: 358
  category: signs_and_signals
  question: ¿Qué define un giro a la izquierda protegido?
  choices:
    A: Un giro a la izquierda realizado en una señal de alto (STOP)
    B: Un giro a la izquierda realizado desde un carril central compartido
    C: Un giro a la izquierda realizado sin un semáforo especial para girar a la izquierda
    D: Un giro a la izquierda realizado con una flecha verde para girar a la izquierda
      mientras el tráfico en sentido contrario está detenido
  answer: D
  explanation: Un giro a la izquierda protegido es un giro a la izquierda realizado
    con una flecha verde para girar a la izquierda o una luz verde retrasada mientras
    el tráfico en sentido contrario está detenido.
- id: 359
  category: penalties_and_points
  question: ¿Cuál es la definición de la revocación de una licencia de conducir?
  choices:
    A: La retirada temporal de una licencia de conducir por un período de tiempo definido
    B: La terminación de una licencia o privilegio de conducir por un período de tiempo
      indefinido
    C: Una restricción impuesta en una licencia que requiere un dispositivo de bloqueo
      de encendido
    D: Una advertencia emitida antes de que se suspenda una licencia
  answer: B
  explanation: La revocación es la terminación de una licencia o privilegio de conducir
    por un período de tiempo indefinido. Puede ser restaurada cuando se hayan cumplido
    todos los requisitos.
- id: 360
  category: safe_driving_rules
  question: Al hacer un giro a la derecha en rojo, ¿qué debe hacer antes de girar?
  choices:
    A: Reducir la velocidad a 5 mph y avanzar si está despejado
    B: Detenerse detrás de las líneas de la intersección
    C: Tocar la bocina para advertir a los peatones
    D: Esperar a que parpadee la señal para peatones
  answer: B
  explanation: Un giro a la derecha en rojo implica girar a la derecha cuando la luz
    roja está encendida, después de detenerse detrás de las líneas de la intersección,
    a menos que esté específicamente prohibido girar.
- id: 361
  category: signs_and_signals
  question: ¿Cuál es el propósito de las bandas sonoras (rumble strips) en el pavimento?
  choices:
    A: Proporcionar mejor tracción en la lluvia o la nieve
    B: Alertar a los conductores que se aproximan a zonas de construcción, plazas
      de peaje u otras condiciones de tráfico
    C: Marcar el límite de una zona escolar
    D: Indicar un carril compartido para dar vuelta a la izquierda
  answer: B
  explanation: Las bandas sonoras son secciones de pavimento rugoso destinadas a alertar
    a los conductores que se aproximan a zonas de construcción, plazas de peaje u
    otras condiciones de tráfico.
- id: 362
  category: defensive_driving
  question: ¿Qué es una parada escalonada (staggered stop)?
  choices:
    A: Detenerse cuando la línea blanca desaparece visualmente debajo de la línea
      del capó para dejar espacio adicional a los vehículos que dan vuelta a la izquierda
    B: Detenerse en una señal de alto, avanzar y detenerse de nuevo
    C: Bombear los frenos repetidamente para detenerse gradualmente
    D: Detenerse detrás de un vehículo con suficiente espacio para maniobrar alrededor
      de él
  answer: A
  explanation: Una parada escalonada consiste en detenerse cuando la línea blanca
    desaparece visualmente debajo de la línea del capó. Esto permite dejar espacio
    adicional para los vehículos que dan vuelta a la izquierda.
- id: 363
  category: penalties_and_points
  question: ¿En qué se diferencia la suspensión de una licencia de una revocación?
  choices:
    A: Una suspensión es por un período indefinido, mientras que una revocación es
      permanente
    B: Una suspensión es la retirada temporal de una licencia por un período de tiempo
      definido
    C: Una suspensión solo se aplica a conductores comerciales
    D: Una suspensión requiere la instalación de un dispositivo de bloqueo de encendido
      (interlock)
  answer: B
  explanation: La suspensión es la retirada temporal de una licencia o privilegio
    de conducir por un período de tiempo definido, mientras que la revocación es por
    un período indefinido.
- id: 364
  category: alcohol_drugs_health
  question: ¿Qué es la visión de túnel?
  choices:
    A: La incapacidad de ver claramente de noche
    B: Cuando los objetos en su visión periférica se vuelven borrosos a medida que
      aumenta la velocidad
    C: La capacidad de ver en un campo de visión estrecho de 140 grados o menos con
      poca visión periférica efectiva
    D: El área que una persona puede ver alrededor del campo de visión central
  answer: C
  explanation: La visión de túnel es la capacidad de ver en un campo de visión estrecho
    de 140 grados o menos con poca visión periférica efectiva.
- id: 365
  category: safe_driving_rules
  question: ¿Qué define a una intersección no controlada?
  choices:
    A: Una intersección donde los semáforos parpadean en amarillo
    B: Una intersección que no tiene señales ni semáforos para regular el tráfico
    C: Una intersección con una rotonda (glorieta)
    D: Una intersección donde varios carriles se fusionan en uno solo
  answer: B
  explanation: Una intersección no controlada es aquella que no tiene señales ni semáforos
    para regular el tráfico, incluyendo los cruces de ferrocarril que no tienen luces
    rojas intermitentes ni barreras de cruce.
- id: 366
  category: alcohol_drugs_health
  question: ¿Qué establece la ley de cero tolerancia?
  choices:
    A: Es ilegal que cualquier persona conduzca con una concentración de alcohol en
      la sangre superior al 0.08%
    B: Es ilegal que las personas menores de 21 años conduzcan con cualquier cantidad
      medible de alcohol en la sangre
    C: Los conductores perderán su licencia inmediatamente si son sorprendidos por
      exceso de velocidad en una zona escolar
    D: Ningún conductor puede negarse a una prueba de alcoholemia
  answer: B
  explanation: La ley de cero tolerancia establece que es ilegal que las personas
    menores de 21 años conduzcan con cualquier cantidad medible de alcohol en la sangre.
- id: 367
  category: defensive_driving
  question: ¿Qué efecto visual ocurre cuando los objetos en su visión periférica se
    vuelven borrosos y distorsionados a medida que aumenta su velocidad?
  choices:
    A: Visión de túnel
    B: Ceguera nocturna
    C: Mancha de velocidad (speed smear)
    D: Visibilidad reducida
  answer: C
  explanation: La mancha de velocidad (speed smear) ocurre cuando los objetos en su
    visión periférica se vuelven borrosos y distorsionados a medida que aumenta su
    velocidad.
- id: 368
  category: safe_driving_rules
  question: ¿Para qué se utiliza la técnica de 'balancear un vehículo' (rocking a
    vehicle)?
  choices:
    A: Para probar el sistema de suspensión del vehículo
    B: Para sacar un vehículo de nieve profunda, lodo o arena
    C: Para advertir a otros conductores de una falla en el vehículo
    D: Para ejecutar un cambio de sentido en un camino de entrada estrecho
  answer: B
  explanation: Balancear un vehículo consiste en repetir la secuencia de conducir
    un poco hacia adelante y luego un poco hacia atrás para sacar su vehículo de nieve
    profunda, lodo o arena.
- id: 369
  category: driver_responsibility
  question: ¿Qué tipo de seguro cubre los costos hasta cierta cantidad si usted es
    chocado por otro vehículo cuyo conductor no tiene seguro?
  choices:
    A: Seguro sin culpa (no-fault insurance)
    B: Seguro de daños a la propiedad
    C: Seguro contra conductores con seguro insuficiente
    D: Seguro contra conductores sin seguro
  answer: D
  explanation: El seguro contra conductores sin seguro cubre los costos hasta cierta
    cantidad si usted es chocado por otro vehículo cuyo conductor no tiene seguro.
- id: 370
  category: safe_driving_rules
  question: ¿Cómo define la 'visibilidad' el Manual del Conductor de Texas?
  choices:
    A: La distancia que tarda un vehículo en detenerse
    B: La capacidad de ver
    C: El brillo de los faros de un vehículo
    D: La claridad del parabrisas
  answer: B
  explanation: El manual define la visibilidad simplemente como 'la capacidad de ver'.
- id: 371
  category: signs_and_signals
  question: ¿Cuál es el propósito de una señal de advertencia?
  choices:
    A: Indicar el límite de velocidad máxima
    B: Alertarle sobre posibles peligros y condiciones de la vía
    C: Proporcionar indicaciones hacia un destino
    D: Mostrar dónde está prohibido estacionar
  answer: B
  explanation: Una señal de advertencia se define como 'una señal que le alerta sobre
    posibles peligros y condiciones de la vía'.
- id: 372
  category: vehicle_information
  question: ¿Qué significa si una luz de advertencia en su panel de instrumentos permanece
    encendida?
  choices:
    A: El sistema está funcionando de manera óptima
    B: Es un recordatorio para encender los faros
    C: Hay un mal funcionamiento del sistema
    D: El vehículo necesita un cambio de aceite
  answer: C
  explanation: Una luz de advertencia es una luz en el panel de instrumentos que avisa
    sobre un mal funcionamiento del sistema y generalmente permanece encendida mientras
    el sistema falla.
- id: 373
  category: safe_driving_rules
  question: ¿Qué significa 'ceder el paso' (yield) en la vía?
  choices:
    A: Detenerse por completo y esperar la luz verde
    B: Permitir que otro vehículo o usuario de la vía avance primero
    C: Incorporarse al tráfico sin reducir la velocidad
    D: Tocar la bocina para advertir a otros conductores
  answer: B
  explanation: Ceder el paso significa 'permitir que otro vehículo o usuario de la
    vía avance primero'.
- id: 374
  category: alcohol_drugs_health
  question: ¿A personas menores de qué edad se aplica la 'ley de tolerancia cero'?
  choices:
    A: '18'
    B: '21'
    C: '25'
    D: '16'
  answer: B
  explanation: La ley de tolerancia cero hace que sea ilegal para las personas menores
    de 21 años conducir con cualquier cantidad medible de alcohol en la sangre.
- id: 375
  category: alcohol_drugs_health
  question: Según la ley de tolerancia cero, ¿cuánto alcohol se le permite tener en
    la sangre a una persona menor de 21 años mientras conduce?
  choices:
    A: Menos del 0.08%
    B: Menos del 0.04%
    C: Cualquier cantidad medible es ilegal
    D: Hasta una bebida estándar
  answer: C
  explanation: La ley de tolerancia cero establece que es ilegal que las personas
    menores de 21 años conduzcan con 'cualquier cantidad medible de alcohol en la
    sangre'.
- id: 376
  category: license_system
  question: Aproximadamente, ¿cuántas oficinas de licencias de conducir (DLO) ofrece
    el DPS en todo el estado para servicios en persona?
  choices:
    A: Más de 50
    B: Más de 100
    C: Más de 220
    D: Más de 500
  answer: C
  explanation: El DPS ofrece citas para servicios de licencias de conducir y tarjetas
    de identificación (DL/ID) en persona en más de 220 oficinas de licencias de conducir
    (DLO) en todo el estado.
- id: 377
  category: license_system
  question: ¿Cuántos mostradores de servicio se pueden encontrar en los 'megacentros'
    del DPS?
  choices:
    A: Hasta 10
    B: Hasta 15
    C: Hasta 20
    D: Hasta 25
  answer: D
  explanation: Los megacentros ofrecen hasta 25 mostradores de servicio para atender
    a los clientes.
- id: 378
  category: license_system
  question: ¿Cuál de las siguientes es una opción de servicio alternativa recomendada
    por el DPS para las renovaciones de licencias de conducir elegibles?
  choices:
    A: Renovaciones en línea
    B: Renovaciones desde el vehículo (drive-thru)
    C: Renovaciones en quioscos de supermercados
    D: Renovaciones mediante visitas a domicilio
  answer: A
  explanation: El DPS recomienda a los clientes utilizar opciones de servicio alternativas,
    como renovaciones en línea, por teléfono o por correo, cuando sean elegibles.
- id: 379
  category: license_system
  question: ¿Qué se requiere para recibir servicios de licencia de conducir o identificación
    (ID) en persona en una oficina del DPS?
  choices:
    A: Una cita programada
    B: Un boleto de turno sin cita previa
    C: Una solicitud por escrito enviada por correo
    D: Una remisión de una escuela de manejo
  answer: A
  explanation: Según el manual, 'Todos los servicios de DL/ID en persona se brindan
    mediante cita programada'.
- id: 380
  category: license_system
  question: ¿Con cuánta anticipación puede programar una cita para servicios de licencia
    de conducir en persona?
  choices:
    A: Hasta un mes
    B: Hasta tres meses
    C: Hasta seis meses
    D: Hasta un año
  answer: C
  explanation: Las citas para servicios de DL/ID en persona se pueden programar con
    hasta seis meses de anticipación.
- id: 381
  category: license_system
  question: ¿Qué debe hacer si no puede asistir a su cita programada para la licencia
    de conducir?
  choices:
    A: Transferirla a un amigo
    B: Cancelarla para que otros clientes puedan ser atendidos
    C: Presentarse al día siguiente en su lugar
    D: Nada, expirará automáticamente
  answer: B
  explanation: 'El manual establece: ''Si no puede asistir a su cita, por favor cancélela
    para que otros clientes puedan ser atendidos de inmediato''.'
- id: 382
  category: driver_testing
  question: ¿Por qué el DPS está ampliando las opciones de educación y exámenes a
    través de terceros?
  choices:
    A: Para reemplazar todas las oficinas de licencias de conducir administradas por
      el estado
    B: Para brindar más flexibilidad a los clientes que obtienen una licencia por
      primera vez
    C: Para aumentar el costo de obtener una licencia de conducir
    D: Para hacer el examen de manejo más difícil
  answer: B
  explanation: El departamento está ampliando las opciones de educación y exámenes
    a través de terceros 'para brindar más flexibilidad a los clientes que obtienen
    una licencia por primera vez'.
- id: 383
  category: license_system
  question: ¿Por qué el DPS está trabajando para que haya más opciones de servicio
    disponibles en línea?
  choices:
    A: Para reducir el número de visitas requeridas a la oficina de licencias de conducir
    B: Para eliminar la necesidad de exámenes de manejo
    C: Para eliminar gradualmente las licencias de conducir físicas
    D: Para aumentar los ingresos del estado
  answer: A
  explanation: El departamento está trabajando para que haya más opciones de servicio
    disponibles en línea 'para reducir el número de visitas requeridas a la oficina
    de licencias de conducir (DLO)'.
- id: 384
  category: driver_testing
  question: ¿Para qué tipo de operadores proporciona preguntas de estudio y repaso
    el Apéndice C del Manual del Conductor de Texas?
  choices:
    A: Operadores de Clase A
    B: Operadores de Clase B
    C: Operadores de Clase C
    D: Conductores Comerciales
  answer: C
  explanation: El título del Apéndice C es 'Preguntas de estudio y repaso para operadores
    de Clase C'.
- id: 385
  category: license_system
  question: ¿Cuándo NO se cobra la tarifa administrativa de $1 por un trámite de licencia
    de conducir?
  choices:
    A: Cuando el trámite se completa en línea
    B: Cuando el trámite se completa en persona
    C: Cuando el trámite se realiza por correo
    D: Cuando se completa más de un trámite al mismo tiempo
  answer: C
  explanation: 'Según el Apéndice D: Tarifas, la tarifa administrativa de $1 no se
    cobra por los trámites realizados por correo.'
- id: 386
  category: license_system
  question: ¿Por cuánto tiempo es válida una nueva licencia de conducir de Clase C
    para una persona entre las edades de 18 y 84 años?
  choices:
    A: 2 años
    B: 4 años
    C: 6 años
    D: 8 años
  answer: D
  explanation: El manual establece que una nueva licencia de conducir (Clase A, B
    o C) para personas de 18 a 84 años vence después de ocho años en el cumpleaños
    del conductor.
- id: 387
  category: license_system
  question: ¿Cuál es la tarifa de renovación y el período de vencimiento de una licencia
    de conducir para una persona de 85 años o más?
  choices:
    A: $33, vence en 8 años
    B: $16, vence en 6 años
    C: $9, vence en 2 años
    D: Gratis, vence en 4 años
  answer: C
  explanation: Para las personas de 85 años o más, la renovación de la licencia de
    conducir cuesta $9 y vence dos años después de la fecha de vencimiento anterior.
- id: 388
  category: license_system
  question: ¿Cuál es la tarifa para una licencia de conducir nueva o renovada para
    un veterano con un 60% de discapacidad que cumple con los requisitos de exención
    de tarifas?
  choices:
    A: $9
    B: $11
    C: $16
    D: Gratis
  answer: D
  explanation: El Apéndice D indica que una licencia de conducir nueva o renovada
    para un veterano con un 60% de discapacidad es gratis, siempre que cumpla con
    los requisitos para la exención de tarifas.
- id: 389
  category: license_system
  question: ¿Cuánto cuesta reemplazar una licencia de conducir perdida, robada o dañada?
  choices:
    A: $9
    B: $11
    C: $16
    D: $33
  answer: B
  explanation: La tarifa para reemplazar una licencia de conducir perdida, robada
    o dañada es de $11, y la fecha de vencimiento actual no cambia.
- id: 390
  category: license_system
  question: ¿Cuál es la tarifa para una tarjeta de identificación (ID) nueva o renovada
    para una persona de 60 años o más?
  choices:
    A: $6
    B: $11
    C: $16
    D: $21
  answer: A
  explanation: Según la tabla de Tarifas de Tarjetas de Identificación (ID), una tarjeta
    de identificación nueva o renovada para alguien de 60 años o más cuesta $6.
- id: 391
  category: license_system
  question: ¿Qué indica el Código de Restricción A en una licencia de conducir de
    Texas?
  choices:
    A: Solo conducción diurna
    B: Con lentes correctivos
    C: Transmisión automática
    D: Dirección asistida
  answer: B
  explanation: 'El Apéndice E: Códigos de Restricción indica que el Código A requiere
    que el conductor maneje ''Con lentes correctivos''.'
- id: 392
  category: license_system
  question: Si un conductor tiene el Código de Restricción B en su licencia, ¿qué
    se requiere cuando conduce?
  choices:
    A: No debe exceder las 45 mph
    B: Debe conducir un vehículo con transmisión automática
    C: Un conductor con licencia de 21 años de edad o mayor debe ir en el asiento
      delantero
    D: Está restringido a solo conducción diurna
  answer: C
  explanation: El Código de Restricción B exige que 'Un conductor con licencia de
    21 años de edad o mayor (LOFS) debe ir en el asiento delantero'.
- id: 393
  category: license_system
  question: ¿Qué código de restricción indica que un conductor está restringido a
    'Solo conducción diurna'?
  choices:
    A: Código A
    B: Código C
    C: Código D
    D: Código F
  answer: B
  explanation: El Apéndice E establece que el Código de Restricción C es para 'Solo
    conducción diurna'.
- id: 394
  category: safe_driving_rules
  question: ¿Qué limitación se le impone a un conductor con el Código de Restricción
    D?
  choices:
    A: Velocidad que no exceda las 45 mph
    B: Velocidad que no exceda las 55 mph
    C: Vehículo que no exceda las 26,000 libras
    D: Solo conducción intraestatal
  answer: A
  explanation: Según el Apéndice E, el Código de Restricción D significa 'Velocidad
    que no exceda las 45 mph'.
- id: 395
  category: vehicle_information
  question: El Código de Restricción I se aplica a las motocicletas. ¿Qué especifica?
  choices:
    A: La motocicleta debe tener transmisión automática
    B: La motocicleta no debe exceder los 250cc
    C: El conductor debe usar casco
    D: La motocicleta está restringida a tres ruedas
  answer: B
  explanation: El Código de Restricción I especifica 'Motocicleta que no exceda los
    250cc' según el Apéndice E.
- id: 396
  category: alcohol_drugs_health
  question: ¿Qué requiere el Código de Restricción P39 que un conductor tenga en su
    vehículo?
  choices:
    A: Dirección asistida
    B: Dispositivos protésicos aplicables
    C: Un dispositivo de bloqueo de encendido
    D: Espejos retrovisores exteriores
  answer: C
  explanation: El Apéndice E enumera el Código de Restricción P39 como 'Se requiere
    bloqueo de encendido' (Ignition Interlock required).
- id: 397
  category: license_system
  question: ¿Cuál es la tarifa anual para una licencia de conducir ocupacional?
  choices:
    A: $10
    B: $16
    C: $21
    D: $25
  answer: A
  explanation: La tabla de Tarifas de Licencias de Conducir muestra que una licencia
    de conducir ocupacional nueva o renovada cuesta $10 por año.
- id: 398
  category: vehicle_information
  question: ¿Qué código de restricción requiere que el conductor use un espejo retrovisor
    exterior o un audífono?
  choices:
    A: Código H
    B: Código S
    C: Código U
    D: Código W
  answer: B
  explanation: El Código de Restricción S se describe en el Apéndice E como 'Espejo
    retrovisor exterior o audífono'.
- id: 399
  category: license_system
  question: ¿De cuánto es la tarifa de una licencia de conducir de término limitado
    emitida a visitantes temporales en los EE. UU.?
  choices:
    A: $16
    B: $21
    C: $25
    D: $33
  answer: C
  explanation: La tarifa de una licencia de conducir de término limitado para visitantes
    temporales en los EE. UU. es de $25, como se indica en la tabla de Tarifas de
    Licencias de Conducir.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) octagonal roja significa que debe detenerse
    por completo en la línea de alto, el cruce peatonal o antes de ingresar a la intersección.
    Verifique si hay tráfico y peatones antes de continuar.
  id: 400
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar que otros pasen de manera segura.
  id: 401
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entrar en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de DIRECCIÓN PROHIBIDA (DO NOT ENTER) significa
    que no debe entrar en la carretera o rampa donde está colocada esta señal. Por
    lo general, se ve en las rampas de salida de las autopistas o en calles de un
    solo sentido donde entrar lo pondría en la trayectoria del tráfico en sentido
    contrario.
  id: 402
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: 'Detenerse y retroceder o dar la vuelta: va en sentido contrario'
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que viaja en contra del tráfico en una vía de un solo sentido o en una rampa de
    autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 403
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Mantenerse a la izquierda de la mediana
    D: Salida de autopista a la izquierda
  answer: B
  explanation: 'Una señal en blanco y negro de UN SOLO SENTIDO (ONE WAY) con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 404
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Adelantar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 405
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Ir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 406
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite adelantar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 407
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No adelantar a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Mantenerse a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO ADELANTAR
    (NO PASSING ZONE) significa que no se le permite adelantar a otros vehículos en
    esta área. Marca el comienzo de una zona donde se prohíbe adelantar.
  id: 408
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye a hacer esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Mantenerse a la derecha de un separador u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isleta
    de tráfico, mediana u obstrucción.
  id: 409
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 410
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la vía en esta área
    C: Área de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la vía en esta área. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 411
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminar cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con la figura de un peatón
    advierte sobre un cruce de peatones más adelante. Esté preparado para detenerse
    ante los peatones que cruzan la vía.
  id: 412
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal de color amarillo verdoso fluorescente en forma de pentágono
    (5 lados) indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté
    atento a los niños.
  id: 413
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no adelantar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 414
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (cruz de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 415
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La vía termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la vía más adelante. Reduzca la velocidad antes de entrar a la
    curva.
  id: 416
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa solo girar a la derecha
    D: Solo se usa en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Necesita reducir su velocidad de manera más
    significativa antes de este giro.
  id: 417
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la vía advierte esta señal?
  choices:
    A: Una vía sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la vía se curve primero
    hacia un lado y luego hacia el otro.
  id: 418
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de vía resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de vía sinuosa advierte de una serie de curvas o giros más
    adelante. Reduzca su velocidad y esté alerta a las condiciones cambiantes de la
    vía.
  id: 419
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico incorporándose desde otra vía
    C: El comienzo de una autopista dividida
    D: Una vía que se estrecha a un carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra vía se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 420
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: Fin de carril
    D: Fin de autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción en el ancho de la vía y ajuste su posición
    en el carril.
  id: 421
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: Fin de la carretera
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en sentido
    contrario. Manténgase a la derecha.
  id: 422
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida termina. El tráfico en
    sentido contrario ya no estará separado por una mediana. Prepárese para el tráfico
    de doble sentido.
  id: 423
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de adelantamiento más adelante
    C: Tráfico de doble sentido más adelante — el tráfico se mueve en ambas direcciones
    D: Desvío de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una vía de sentido único o de una autopista dividida y se
    encontrará con vehículos que viajan en dirección opuesta.
  id: 424
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera helada
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 425
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina empinada o pendiente más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina empinada o pendiente más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 426
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Prepárese para detenerse
    si la luz está roja o amarilla. Esta señal a menudo se coloca donde el semáforo
    puede no ser visible desde la distancia.
  id: 427
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (stop) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (stop) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 428
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce o una intersección de 4 vías más
    adelante. Esté atento al tráfico que ingresa desde las carreteras laterales.
  id: 429
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una carretera lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una carretera lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera principal desde la vía
    lateral.
  id: 430
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se unen
    B: Un carril termina
    C: Se añade un carril nuevo — no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin necesidad de incorporarse. El tráfico que entra por la rampa
    tiene su propio carril nuevo.
  id: 431
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionar en esta área
    C: Detenerse o dejar el motor en marcha
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 432
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: A cualquier persona por menos de 15 minutos
    B: Solo a personas de la tercera edad
    C: Solo a vehículos que muestren un cartel o placa de discapacidad válido
    D: A cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de una silla de ruedas indica estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que muestren un
    cartel o placa de matrícula de estacionamiento para discapacitados válido pueden
    estacionar en estos espacios. Las infracciones conllevan multas severas.
  id: 433
