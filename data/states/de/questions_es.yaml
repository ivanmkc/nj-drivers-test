questions:
- id: 1
  category: license_system
  question: ¿En Delaware, cuál es la edad mínima para ser elegible para un Permiso
    de Aprendizaje de Nivel 1?
  choices:
    A: 15 años
    B: 15 años y 6 meses
    C: 16 años
    D: 17 años
  answer: C
  explanation: Según el Manual del Conductor de Delaware, un solicitante debe tener
    al menos 16 años para ser elegible para un Permiso de Aprendizaje de Nivel 1 como
    parte del programa de Licencia de Conducir Graduada (GDL).
- id: 2
  category: license_system
  question: Durante los primeros seis meses de tener un Permiso de Aprendizaje de
    Nivel 1 de Delaware, ¿cuántas horas de conducción deben ser supervisadas por un
    adulto con licencia?
  choices:
    A: 30 horas, incluyendo 5 horas de noche
    B: 40 horas, incluyendo 10 horas de noche
    C: 50 horas, incluyendo 10 horas de noche
    D: 60 horas, incluyendo 15 horas de noche
  answer: C
  explanation: La ley de Delaware exige que el titular del permiso complete 50 horas
    de conducción, con al menos 10 de esas horas de noche, verificadas por un patrocinador.
- id: 3
  category: license_system
  question: Bajo el programa de Licencia de Conducir Graduada (GDL) de Delaware, durante
    los primeros seis meses del Permiso de Aprendizaje de Nivel 1, ¿quién debe estar
    en el asiento delantero con el conductor?
  choices:
    A: Cualquier conductor con licencia mayor de 18 años
    B: Solo un padre o tutor con licencia
    C: Un conductor con licencia que tenga al menos 25 años y haya tenido una licencia
      durante al menos 5 años
    D: Un conductor con licencia que tenga al menos 21 años y haya tenido una licencia
      durante al menos 1 año
  answer: C
  explanation: El supervisor debe ser un conductor con licencia de al menos 25 años
    de edad que haya tenido una licencia Clase D durante al menos 5 años.
- id: 4
  category: license_system
  question: Durante los segundos seis meses del Permiso de Aprendizaje de Nivel 1
    de Delaware, ¿cuándo se le permite al conductor conducir sin supervisión?
  choices:
    A: En cualquier momento del día o de la noche
    B: Solo entre las 6:00 AM y las 10:00 PM
    C: Solo entre las 5:00 AM y la medianoche
    D: Solo cuando conduce hacia la escuela o el trabajo
  answer: B
  explanation: Después de los primeros seis meses, el titular del permiso puede conducir
    sin supervisión entre las 6:00 AM y las 10:00 PM. Conducir entre las 10:00 PM
    y las 6:00 AM todavía requiere supervisión, a menos que se viaje hacia o desde
    el trabajo, la iglesia o actividades escolares.
- id: 5
  category: license_system
  question: ¿Cuál es la restricción de pasajeros para el titular de un Permiso de
    Aprendizaje de Nivel 1 de Delaware durante todo el primer año?
  choices:
    A: No se permiten pasajeros en ningún momento
    B: Solo se permiten miembros de la familia
    C: Solo se permite un pasajero que no sea familiar además del supervisor
    D: Se permiten hasta tres pasajeros si son mayores de 21 años
  answer: C
  explanation: A excepción de los miembros de la familia inmediata, solo se permite
    un pasajero adicional en el vehículo, siempre que el supervisor esté presente
    (durante los primeros 6 meses) o mientras se conduce sin supervisión (durante
    los segundos 6 meses).
- id: 6
  category: license_system
  question: Si se muda a Delaware desde otro estado, ¿dentro de cuántos días debe
    solicitar una licencia de conducir de Delaware?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Los nuevos residentes deben solicitar una licencia de conducir de Delaware
    dentro de los 60 días posteriores a la transferencia de su residencia al estado.
- id: 7
  category: license_system
  question: Después de cambiar su nombre o dirección, ¿cuántos días tiene para notificar
    al DMV de Delaware?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La ley de Delaware exige que notifique al DMV sobre un cambio de nombre
    o dirección dentro de los 30 días.
- id: 8
  category: license_system
  question: ¿En Delaware, cuál es el período de vencimiento estándar para una licencia
    de conducir Clase D recién emitida?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: Una licencia de conducir estándar de Delaware es válida por un período
    de 8 años.
- id: 9
  category: license_system
  question: Bajo la ley de 'Tolerancia Cero' de Delaware, ¿cuál es el límite de concentración
    de alcohol en sangre (BAC) para conductores menores de 21 años?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: La ley de Tolerancia Cero de Delaware establece que cualquier persona
    menor de 21 años que conduzca, opere o tenga el control físico de un vehículo
    con un BAC de 0.02% o superior se le revocará la licencia.
- id: 10
  category: license_system
  question: ¿Cuántos puntos se asignan en un registro de conducción de Delaware por
    exceder el límite de velocidad por 1-9 mph?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: A
  explanation: En Delaware, exceder el límite de velocidad de 1 a 9 mph resulta en
    2 puntos en su registro de conducción.
- id: 11
  category: license_system
  question: ¿Cuál de las siguientes infracciones conlleva el valor de puntos más alto
    (6 puntos) en el sistema de puntos de Delaware?
  choices:
    A: Seguir a otro vehículo demasiado de cerca
    B: Rebasar un autobús escolar detenido
    C: Exceso de velocidad de 15 a 19 mph sobre el límite
    D: No ceder el derecho de paso
  answer: B
  explanation: Rebasar un autobús escolar detenido con luces rojas intermitentes es
    una infracción grave en Delaware y conlleva 6 puntos.
- id: 12
  category: license_system
  question: En Delaware, ¿cuánto tiempo permanecen los puntos en su valor total en
    su historial de conducción antes de reducirse a un crédito de medio punto?
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: B
  explanation: Los puntos se evalúan a su valor total durante los primeros 12 meses.
    Después de 12 meses, los puntos se acreditan a la mitad de su valor durante los
    siguientes 12 meses.
- id: 13
  category: license_system
  question: Para cumplir con la ley de responsabilidad financiera de Delaware, ¿cuál
    es el monto mínimo de seguro de responsabilidad civil requerido por lesiones corporales
    de una persona en un accidente?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Delaware requiere una cobertura mínima de responsabilidad civil de
    $25,000 por lesiones corporales o muerte de una persona en cualquier accidente.
- id: 14
  category: license_system
  question: Un conductor de Delaware puede ser acusado de "Conducción Agresiva" (Aggressive
    Driving) si comete ¿cuántas infracciones de tráfico específicas en un solo incidente?
  choices:
    A: Dos o más
    B: Tres o más
    C: Cuatro o más
    D: Cinco o más
  answer: B
  explanation: Según el Título 21, Sección 4175A, una persona es culpable de conducción
    agresiva si viola tres o más títulos específicos (como exceso de velocidad, seguir
    demasiado de cerca o no ceder el paso) en un solo incidente.
- id: 15
  category: license_system
  question: ¿Cuál es la sanción por una condena por primera infracción de conducir
    sin una licencia válida en Delaware?
  choices:
    A: Una multa de $50 a $200
    B: 30 días obligatorios en la cárcel
    C: Revocación permanente de los privilegios de conducir
    D: Una multa de $500 a $1,000
  answer: A
  explanation: Una primera infracción por conducir sin licencia en Delaware suele
    conllevar una multa que oscila entre $50 y $200.
- id: 16
  category: license_system
  question: En Delaware, ¿cuántos puntos se acreditan a su historial de conducción
    por completar un curso de conducción defensiva aprobado por el DMV?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: La ley de Delaware permite que se aplique un crédito de 3 puntos al
    historial de un conductor tras completar con éxito un curso de conducción defensiva
    aprobado por el DMV.
- id: 17
  category: license_system
  question: Para aprobar el examen de la vista para una licencia de conducir de Delaware,
    ¿qué agudeza visual debe tener el solicitante en al menos un ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Delaware requiere que los conductores tengan al menos una agudeza visual
    de 20/40 en al menos un ojo, con o sin lentes correctivos.
- id: 18
  category: license_system
  question: Bajo la ley de Delaware, ¿quién es legalmente responsable de la conducta
    negligente o deliberada de un conductor menor de 18 años?
  choices:
    A: Solo el conductor menor de edad
    B: El instructor de manejo
    C: La persona que firmó la solicitud de licencia del menor
    D: El DMV del estado
  answer: C
  explanation: La persona que firma (patrocina) la solicitud de licencia de un menor
    en Delaware es considerada responsable solidaria junto con el menor por cualquier
    daño causado por la negligencia o mala conducta deliberada del menor mientras
    conduce.
- id: 19
  category: license_system
  question: ¿Cuál es la tarifa estándar para una licencia de conducir Clase D de Delaware
    por 8 años?
  choices:
    A: $25
    B: $40
    C: $50
    D: $60
  answer: B
  explanation: La tarifa para una licencia de conducir Clase D estándar de Delaware
    por 8 años es de $40.00.
- id: 20
  category: license_system
  question: En el sistema de puntos de Delaware, ¿cuántos puntos se asignan por rebasar
    un autobús escolar detenido con sus luces rojas intermitentes?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Rebasar un autobús escolar detenido con luces rojas intermitentes es
    una infracción grave en Delaware y resulta en 6 puntos en el historial del conductor
    y una suspensión inmediata.
- id: 21
  category: license_system
  question: ¿En Delaware, no detenerse ante un semáforo en rojo resultará en cuántos
    puntos añadidos a su historial de conducción?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: No detenerse ante un semáforo en rojo es una infracción de 3 puntos
    en el estado de Delaware.
- id: 22
  category: license_system
  question: ¿Por cuánto tiempo se revocará una licencia de conducir de Delaware si
    el conductor es condenado por abandonar la escena de un accidente (Hit and Run)
    que resultó en lesiones o muerte?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: La ley de Delaware exige una revocación de 1 año de los privilegios
    de conducir por cualquier condena por abandonar la escena de un accidente que
    involucre lesiones físicas o la muerte.
- id: 23
  category: license_system
  question: Bajo la Ley de Consentimiento Implícito (Implied Consent Law) de Delaware,
    ¿cuál es la sanción por negarse por primera vez a someterse a una prueba química
    de alcohol o drogas?
  choices:
    A: Suspensión de la licencia por 3 meses
    B: Suspensión de la licencia por 6 meses
    C: Revocación de la licencia por 12 meses
    D: Revocación de la licencia por 24 meses
  answer: C
  explanation: Si se niega a una prueba química en Delaware, su licencia será revocada
    por 12 meses por una primera infracción bajo la Ley de Consentimiento Implícito.
- id: 24
  category: license_system
  question: ¿A qué edad terminan oficialmente las restricciones del programa de Licencia
    de Conducir Graduada (GDL) de Delaware, siempre que el conductor haya tenido el
    permiso durante al menos 12 meses?
  choices:
    A: '17'
    B: '18'
    C: '19'
    D: '21'
  answer: B
  explanation: El programa GDL de Delaware y sus restricciones asociadas terminan
    cuando el conductor alcanza la edad de 18 años.
- id: 25
  category: license_system
  question: Para obtener una 'REAL ID' de Delaware que cumpla con las normas federales,
    ¿cuántos documentos que prueben la residencia en Delaware debe proporcionar el
    solicitante?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: El DMV de Delaware requiere dos documentos separados que muestren el
    nombre del solicitante y la dirección residencial de Delaware para emitir una
    REAL ID.
- id: 26
  category: license_system
  question: Si no renueva el registro de su vehículo en Delaware antes de que expire,
    ¿cuál es el cargo por mora obligatorio?
  choices:
    A: $10
    B: $20
    C: $30
    D: $50
  answer: B
  explanation: Delaware cobra un cargo por mora de $20.00 si el registro de un vehículo
    no se renueva antes de la fecha de vencimiento.
- id: 27
  category: license_system
  question: Los nuevos residentes de Delaware deben hacer que su vehículo sea inspeccionado
    y registrado dentro de ¿cuántos días después de establecer la residencia?
  choices:
    A: 30 días
    B: 45 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Los nuevos residentes tienen 60 días para registrar sus vehículos en
    Delaware después de establecer la residencia.
- id: 28
  category: license_system
  question: Bajo el Programa de Mejora del Conductor (Driver Improvement Program)
    de Delaware, ¿a los cuántos puntos enviará el DMV al conductor una carta de advertencia
    y requerirá una entrevista obligatoria?
  choices:
    A: 8 puntos
    B: 10 puntos
    C: 12 puntos
    D: 14 puntos
  answer: C
  explanation: Cuando un conductor alcanza los 12 puntos en su historial de Delaware,
    se le envía una carta de advertencia y debe asistir a una entrevista obligatoria
    o programa de modificación de conducta.
- id: 29
  category: driver_testing
  question: Al realizar el examen de manejo en Delaware, ¿cuál de los siguientes es
    un requisito para el vehículo que usted proporcione?
  choices:
    A: Debe ser un vehículo de transmisión manual
    B: Debe tener una cámara de reversa que sea totalmente funcional
    C: El examinador debe tener acceso libre al freno de pie o a un freno de estacionamiento
      montado en el centro
    D: Debe ser un vehículo fabricado en los últimos 10 años
  answer: C
  explanation: Para el examen de manejo de Delaware, el vehículo debe permitir que
    el examinador alcance el freno de pie o un freno de estacionamiento ubicado en
    la consola central en caso de una emergencia.
- id: 30
  category: driver_testing
  question: ¿En Delaware, cuál es el límite de velocidad máximo para carreteras de
    dos carriles a menos que se indique lo contrario?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: B
  explanation: Según el Manual del Conductor de Delaware, el límite de velocidad para
    carreteras de dos carriles es de 50 mph a menos que las señales indiquen lo contrario.
- id: 31
  category: driver_testing
  question: Si un conductor de Delaware es condenado por una primera ofensa de DUI
    con un BAC (concentración de alcohol en sangre) de .15 a .19, ¿cuánto tiempo dura
    el período de revocación de la licencia?
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: C
  explanation: Para una primera ofensa de DUI en Delaware con un BAC entre .15 y .19,
    el período de revocación es de 18 meses.
- id: 32
  category: driver_testing
  question: ¿Cuál es el límite de velocidad en una zona escolar de Delaware cuando
    hay niños presentes o cuando las luces están parpadeando?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: El límite de velocidad en las zonas escolares de Delaware es de 20
    mph.
- id: 33
  category: driver_testing
  question: Según la ley de Delaware, los niños deben estar sujetos en un asiento
    de seguridad para niños o en un asiento elevado (booster seat) hasta que alcancen
    ¿qué edad o peso?
  choices:
    A: 6 años o 50 libras
    B: 7 años o 60 libras
    C: 8 años o 65 libras
    D: 10 años o 80 libras
  answer: C
  explanation: La ley de Delaware exige que todos los niños utilicen un asiento de
    seguridad para niños o un asiento elevado hasta que cumplan 8 años O pesen 65
    libras.
- id: 34
  category: driver_testing
  question: En Delaware, ¿cuándo es obligatorio encender los faros delanteros en relación
    con las condiciones climáticas?
  choices:
    A: Solo cuando la visibilidad es inferior a 100 pies
    B: Solo después del atardecer
    C: Siempre que utilice los limpiaparabrisas
    D: Solo durante nevadas intensas o niebla
  answer: C
  explanation: La ley de Delaware exige que los conductores enciendan los faros delanteros
    siempre que los limpiaparabrisas del vehículo estén en uso debido a la lluvia,
    la nieve o el aguanieve.
- id: 35
  category: driver_testing
  question: ¿Cuál es la multa por una primera infracción de la ley de Delaware que
    prohíbe el uso de un teléfono celular de mano mientras se conduce?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: La multa por una primera infracción por uso de teléfono celular de
    mano en Delaware es de $100, más los costos judiciales adicionales.
- id: 36
  category: driver_testing
  question: ¿Cuántos puntos se asignan en el historial de conducción de Delaware por
    no detenerse ante una luz roja?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: En Delaware, no detenerse ante una luz roja resulta en la adición de
    3 puntos a su historial de conducción.
- id: 37
  category: driver_testing
  question: Si reprueba el examen de conducir (road test) en Delaware, ¿cuánto tiempo
    debe esperar antes de ser elegible para volver a tomarlo?
  choices:
    A: 24 horas
    B: 48 horas
    C: 7 días
    D: 10 días
  answer: D
  explanation: Si reprueba el examen de conducir en Delaware, debe esperar al menos
    10 días antes de poder realizar el examen nuevamente.
- id: 38
  category: driver_testing
  question: Después de comprar un vehículo en Delaware, ¿dentro de cuántos días debe
    solicitar un nuevo título y registro?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley de Delaware exige que solicite el título y el registro dentro
    de los 30 días posteriores a la compra de un vehículo.
- id: 39
  category: driver_testing
  question: ¿Cuál es el cargo por mora por renovar el registro de un vehículo después
    de que haya vencido en Delaware?
  choices:
    A: $10.00
    B: $20.00
    C: $50.00
    D: El doble del costo del registro
  answer: B
  explanation: Delaware cobra un cargo por mora de $20.00 si renueva el registro de
    su vehículo después de la fecha de vencimiento.
- id: 40
  category: driver_testing
  question: ¿Cuántos puntos se asignan en su historial de conducción de Delaware por
    'Seguir demasiado de cerca' (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: Seguir demasiado de cerca es una infracción de 3 puntos en el sistema
    de puntos de Delaware.
- id: 41
  category: driver_testing
  question: ¿Para prevenir lesiones por una bolsa de aire (air bag), el manual de
    Delaware recomienda que los niños se sienten en el asiento trasero hasta que tengan
    al menos qué edad o estatura?
  choices:
    A: 10 años o 60 pulgadas
    B: 12 años o 65 pulgadas
    C: 13 años o 60 pulgadas
    D: 15 años o 65 pulgadas
  answer: B
  explanation: El Manual del Conductor de Delaware recomienda que los niños menores
    de 12 años o de menos de 65 pulgadas de estatura se sienten en el asiento trasero
    para evitar lesiones causadas por las bolsas de aire.
- id: 42
  category: driver_testing
  question: Bajo la ley de 'Moverse a un lado' (Move Over law) de Delaware, ¿qué debe
    hacer al acercarse a un vehículo de emergencia estacionado con luces intermitentes
    en una autopista de carriles múltiples?
  choices:
    A: Detenerse inmediatamente en su carril
    B: Mantener la velocidad pero tocar la bocina
    C: Cambiarse a un carril que no sea adyacente al vehículo de emergencia, si es
      seguro hacerlo
    D: Acelerar para pasar el vehículo lo más rápido posible
  answer: C
  explanation: La ley Move Over de Delaware exige que los conductores se cambien a
    un carril que no sea adyacente al vehículo de emergencia, o que reduzcan la velocidad
    significativamente si un cambio de carril no es seguro.
- id: 43
  category: driver_testing
  question: Para aprobar el examen escrito de conocimientos de Delaware, ¿cuál es
    la puntuación mínima requerida?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: El examen de conocimientos de Delaware consta de 30 preguntas, y el
    solicitante debe responder correctamente al menos 24 (80%) para aprobar.
- id: 44
  category: driver_testing
  question: Bajo la 'Ley de Consentimiento Implícito' (Implied Consent Law) de Delaware,
    al conducir un vehículo motorizado, ¿usted ha aceptado qué?
  choices:
    A: Llevar siempre a un pasajero.
    B: Someterse a una prueba química de alcohol o drogas si lo solicita la policía.
    C: Permitir que cualquier oficial de policía registre su vehículo en cualquier
      momento.
    D: Mantener un historial de conducción limpio durante al menos cinco años.
  answer: B
  explanation: La Ley de Consentimiento Implícito de Delaware establece que se considera
    que cualquier persona que opera un vehículo motorizado ha dado su consentimiento
    para una prueba química de su aliento, sangre u orina para determinar la presencia
    de alcohol o drogas.
- id: 45
  category: driver_testing
  question: ¿A qué nivel de puntos envía el DMV de Delaware una carta de advertencia
    a un conductor con respecto a su acumulación de puntos?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: El DMV de Delaware envía una carta de advertencia al conductor cuando
    este alcanza los 8 puntos en su historial de conducción.
- id: 46
  category: driver_testing
  question: 'La ley de Delaware exige que los conductores usen sus faros delanteros
    siempre que estén usando sus:'
  choices:
    A: Luces de emergencia (hazard lights)
    B: Limpiaparabrisas
    C: Desempañador
    D: Luces direccionales
  answer: B
  explanation: La ley de Delaware exige que los faros delanteros deben estar encendidos
    cuando los limpiaparabrisas están en uso debido a la lluvia, nieve o aguanieve.
- id: 47
  category: driver_testing
  question: En Delaware, ¿a cuántos pies de un hidrante de incendios no se puede estacionar
    un vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Delaware prohíbe estacionar a menos de 15 pies de un hidrante
    de incendios.
- id: 48
  category: driver_testing
  question: ¿Cuál es la multa base por una primera infracción por usar un teléfono
    celular de mano mientras se conduce en Delaware?
  choices:
    A: 25 dólares
    B: 50 dólares
    C: 100 dólares
    D: 250 dólares
  answer: C
  explanation: La multa base por una primera infracción de la ley de manos libres
    para teléfonos celulares de Delaware es de $100.
- id: 49
  category: driver_testing
  question: Al seguir a otro vehículo bajo condiciones normales de conducción en Delaware,
    ¿cuál es la distancia de seguimiento recomendada?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de Delaware recomienda una distancia de seguimiento
    de al menos 3 segundos detrás del vehículo que está delante de usted.
- id: 50
  category: driver_testing
  question: 'Al entrar en una rotonda en Delaware, los conductores deben ceder el
    paso a:'
  choices:
    A: El tráfico que entra por la derecha
    B: El tráfico que ya está en el círculo
    C: Nadie; el conductor que entra tiene el derecho de paso
    D: El tráfico que sale del círculo únicamente
  answer: B
  explanation: En Delaware, el tráfico que entra en una rotonda debe ceder el paso
    al tráfico que ya está circulando dentro de la rotonda.
- id: 51
  category: driver_testing
  question: ¿Qué exige la ley de 'Hacerse a un lado' (Move Over) de Delaware a los
    conductores cuando se aproximan a un vehículo de emergencia detenido con luces
    intermitentes?
  choices:
    A: Detenerse por completo hasta que el vehículo se retire
    B: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    C: Moverse a un carril no adyacente o reducir la velocidad significativamente
      si cambiar de carril no es seguro
    D: Aumentar la velocidad para pasar la escena lo más rápido posible
  answer: C
  explanation: La ley de Delaware exige que los conductores se cambien de carril o
    reduzcan la velocidad al acercarse a vehículos de emergencia, grúas y vehículos
    de servicios públicos detenidos en el arcén con luces intermitentes.
- id: 52
  category: driver_testing
  question: En Delaware, ¿con cuántos pies de antelación, como mínimo, debe usar su
    señal de giro antes de doblar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: D
  explanation: La ley de Delaware exige que los conductores indiquen su intención
    de girar al menos 300 pies antes de realizar el giro.
- id: 53
  category: driver_testing
  question: En Delaware, si un conductor es condenado por conducir a 25 mph por encima
    del límite de velocidad establecido, ¿cuál es la sanción obligatoria además de
    los puntos?
  choices:
    A: Una suspensión obligatoria de la licencia por 1 mes
    B: Una revocación obligatoria de la licencia por 1 año
    C: El conductor debe presentarse en persona para una entrevista en el DMV
    D: El conductor debe volver a tomar el examen de conducir
  answer: C
  explanation: En Delaware, por exceder el límite de velocidad en 25 mph o más, el
    conductor debe presentarse a una entrevista en el DMV. Al alcanzar las 25 mph
    de exceso, también se autoriza una suspensión de 1 mes.
- id: 54
  category: driver_responsibility
  question: En Delaware, ¿cuál es la cobertura mínima de seguro de responsabilidad
    civil requerida por lesiones corporales o muerte de dos o más personas en un solo
    accidente?
  choices:
    A: $25,000
    B: $30,000
    C: $50,000
    D: $100,000
  answer: C
  explanation: Los requisitos mínimos de seguro de responsabilidad civil de Delaware
    son $25,000 por una persona y $50,000 por lesiones corporales de dos o más personas.
- id: 55
  category: driver_responsibility
  question: Según la ley de Delaware, ¿debe informar inmediatamente un accidente a
    la policía si los daños a la propiedad exceden qué cantidad?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: Los accidentes deben informarse a la policía de inmediato si resultan
    en lesiones o muerte, o si los daños a la propiedad parecen exceder los $1,500.
- id: 56
  category: driver_responsibility
  question: Bajo la Ley de Consentimiento Implícito (Implied Consent Law) de Delaware,
    si usted se niega a someterse a una prueba química para determinar su BAC, ¿por
    cuánto tiempo se le revocará su privilegio de conducir por una primera infracción?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: D
  explanation: Bajo la Ley de Consentimiento Implícito, la negativa a someterse a
    una prueba química en una primera infracción resulta en la revocación de los privilegios
    de conducir por 12 meses.
- id: 57
  category: driver_responsibility
  question: Si usted se convierte en residente de Delaware, ¿dentro de cuántos días
    debe registrar su vehículo en el estado?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Los nuevos residentes deben registrar sus vehículos en Delaware dentro
    de los 60 días posteriores al establecimiento de su residencia.
- id: 58
  category: driver_responsibility
  question: En Delaware, ¿cuál es la multa base por una primera infracción por no
    usar el cinturón de seguridad?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: La multa por una infracción del cinturón de seguridad en Delaware es
    de $25, más costos judiciales y evaluaciones adicionales.
- id: 59
  category: driver_responsibility
  question: En el sistema de puntos de Delaware, ¿una licencia de conducir será suspendida
    por 4 meses una vez que el total de puntos alcance qué nivel?
  choices:
    A: 10 puntos
    B: 12 puntos
    C: 14 puntos
    D: 16 puntos
  answer: C
  explanation: Se activa una suspensión obligatoria de 4 meses cuando un conductor
    alcanza los 14 puntos en su historial.
- id: 60
  category: driver_responsibility
  question: ¿Cuál es la multa mínima por una primera infracción por operar un vehículo
    sin el seguro requerido en Delaware?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: La multa por una primera infracción de conducir sin seguro en Delaware
    oscila entre $1,500 y $2,000.
- id: 61
  category: driver_responsibility
  question: Al comprar un vehículo a otra persona, ¿dentro de cuántos días debe transferirse
    el título al nuevo propietario en Delaware?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: El comprador de un vehículo debe solicitar un nuevo título dentro de
    los 30 días posteriores a la fecha de compra para evitar un cargo por retraso.
- id: 62
  category: driver_responsibility
  question: Para una primera infracción por DUI en Delaware con un BAC (concentración
    de alcohol en sangre) entre .08 y .15, ¿cuál es la duración típica de la revocación
    de la licencia?
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: B
  explanation: Una condena por DUI por primera vez con un BAC en el rango de .08 a
    .15 resulta en una revocación de los privilegios de conducir por 12 meses.
- id: 63
  category: driver_responsibility
  question: En Delaware, ¿cuál es la multa mínima por una primera infracción por estacionarse
    en un espacio designado para personas con discapacidad sin un permiso válido?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: B
  explanation: La multa mínima por una primera infracción por estacionarse ilegalmente
    en un espacio para personas con discapacidad en Delaware es de $100.
- id: 64
  category: driver_responsibility
  question: 'En Delaware, se debe notificar a la policía sobre un accidente si los
    daños a la propiedad parecen ser de al menos:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: Según el Manual del Conductor de Delaware, se debe notificar a la policía
    sobre cualquier accidente que involucre un vehículo motorizado y que resulte en
    daños a la propiedad por un monto aparente de $1,500 o más.
- id: 65
  category: driver_responsibility
  question: Al comprar un vehículo a un particular en Delaware, ¿dentro de cuántos
    días debe el comprador solicitar un nuevo certificado de título?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: El comprador de un vehículo debe solicitar un nuevo certificado de
    título en el DMV dentro de los 30 días posteriores a la fecha de compra.
- id: 66
  category: driver_responsibility
  question: ¿Cuál de los siguientes es un requisito para registrar un vehículo en
    Delaware?
  choices:
    A: Comprobante de cualquier seguro de auto válido en los EE. UU.
    B: Comprobante de seguro de responsabilidad civil de Delaware
    C: Una carta notariada de un empleador
    D: Un pasaporte válido
  answer: B
  explanation: Para registrar un vehículo en Delaware, debe presentar un comprobante
    de seguro de responsabilidad civil de Delaware. No se aceptan pólizas de seguro
    de otros estados para el registro.
- id: 67
  category: driver_responsibility
  question: Si cancela su seguro de auto en Delaware, ¿qué debe hacer con su placa
    (matrícula)?
  choices:
    A: Conservarla hasta obtener un nuevo seguro
    B: Destruirla inmediatamente
    C: Entregarla al DMV inmediatamente
    D: Transferirla a un amigo
  answer: C
  explanation: Si cancela su seguro, debe entregar su placa al DMV inmediatamente.
    No hacerlo puede resultar en la suspensión de su registro y de su licencia de
    conducir.
- id: 68
  category: driver_responsibility
  question: 'Si choca contra un vehículo desatendido en Delaware y no puede encontrar
    al propietario, usted debe:'
  choices:
    A: Esperar 2 horas a que regrese el propietario
    B: Dejar una nota con su información y notificar a la estación de policía más
      cercana
    C: Solo dejar una nota con su número de teléfono
    D: Irse si no hay daños visibles
  answer: B
  explanation: La ley de Delaware exige que localice al propietario o deje un aviso
    por escrito en un lugar visible y notifique a la estación de policía más cercana.
- id: 69
  category: driver_responsibility
  question: En Delaware, la mayoría de los registros de vehículos estándar pueden
    renovarse por ¿cuál de los siguientes períodos?
  choices:
    A: 6 meses o 1 año
    B: 1 año o 2 años
    C: 3 años o 5 años
    D: 1 año solamente
  answer: B
  explanation: Los registros de vehículos estándar en Delaware pueden renovarse por
    uno o dos años.
- id: 70
  category: driver_responsibility
  question: El DMV de Delaware realiza un programa de auditoría aleatoria para verificar
    ¿cuál de los siguientes?
  choices:
    A: El kilometraje del vehículo
    B: El estado del registro de votantes
    C: El seguro de auto válido
    D: El porcentaje de tinte de las ventanas
  answer: C
  explanation: El DMV realiza una auditoría aleatoria de todos los vehículos registrados
    en Delaware para verificar que estén asegurados continuamente. No responder o
    no proporcionar el comprobante resulta en la suspensión.
- id: 71
  category: driver_responsibility
  question: 'Antes de que un vehículo pueda ser registrado o que su registro sea renovado
    en Delaware, debe aprobar:'
  choices:
    A: Un examen de manejo
    B: Una inspección de seguridad y emisiones
    C: Una verificación de antecedentes del propietario
    D: Una verificación en una estación de pesaje
  answer: B
  explanation: Todos los vehículos registrados en Delaware deben aprobar una inspección
    de seguridad, y la mayoría de los vehículos también deben aprobar una prueba de
    emisiones de escape.
- id: 72
  category: driver_responsibility
  question: 'En Delaware, se requiere que informe un accidente a la policía de inmediato
    si este involucra:'
  choices:
    A: Un conductor que tiene un permiso de aprendizaje
    B: Cualquier lesión o muerte
    C: Un vehículo de más de 10 años de antigüedad
    D: Un neumático desinflado
  answer: B
  explanation: La ley de Delaware exige el reporte inmediato de cualquier accidente
    que resulte en lesiones o la muerte de cualquier persona, independientemente del
    monto de los daños a la propiedad.
- id: 73
  category: driver_responsibility
  question: ¿Cuál es el cargo por demora en Delaware por no solicitar una transferencia
    de título dentro de los 30 días posteriores a la compra?
  choices:
    A: $10
    B: $25
    C: $35
    D: $50
  answer: C
  explanation: Se cobra un cargo por demora de $35 si la solicitud de un certificado
    de título se realiza después del límite legal de 30 días.
- id: 74
  category: driver_responsibility
  question: ¿Dónde debe guardarse la tarjeta de registro en un vehículo registrado
    en Delaware?
  choices:
    A: En la billetera del conductor en todo momento
    B: En el vehículo en todo momento
    C: En la residencia del propietario
    D: En el maletero
  answer: B
  explanation: Según la ley de Delaware, la tarjeta de registro debe llevarse en el
    vehículo en todo momento mientras este se encuentre en funcionamiento.
- id: 75
  category: safe_driving_rules
  question: Al estacionar cerca de una intersección en Delaware, ¿a cuántos pies de
    distancia como mínimo debe estar de cualquier señal de alto (stop) o señal de
    tráfico?
  choices:
    A: 20 pies
    B: 30 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: La ley de Delaware prohíbe estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de alto o señal de control de tráfico ubicada al costado
    de una carretera.
- id: 76
  category: safe_driving_rules
  question: 'Según la ley de Delaware, se requiere que encienda sus faros delanteros
    siempre que esté utilizando sus:'
  choices:
    A: Luces de emergencia
    B: Limpiaparabrisas
    C: Luces altas
    D: Control de crucero
  answer: B
  explanation: La ley de Delaware exige que los conductores enciendan sus faros delanteros
    cuando los limpiaparabrisas están en uso debido a la lluvia, nieve o aguanieve.
- id: 77
  category: safe_driving_rules
  question: En Delaware, ¿se le prohíbe rebasar a otro vehículo cuando se encuentre
    a cuántos pies de una intersección o un cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: No debe rebasar a otro vehículo cuando se aproxime a menos de 100 pies
    de una intersección o un cruce de ferrocarril.
- id: 78
  category: safe_driving_rules
  question: 'Al conducir en una carretera de varios carriles en Delaware, como la
    I-95 o la SR-1, el carril izquierdo está destinado para:'
  choices:
    A: Circular al límite de velocidad
    B: Rebasar únicamente
    C: Solo vehículos de emergencia
    D: Vehículos con más de dos pasajeros
  answer: B
  explanation: La ley de Delaware exige que los conductores permanezcan en el carril
    derecho, excepto cuando estén adelantando y rebasando a otro vehículo.
- id: 79
  category: safe_driving_rules
  question: 'No debe dar una vuelta en U en una curva o colina en Delaware si su vehículo
    no puede ser visto por otros conductores que se aproximen desde cualquier dirección
    dentro de:'
  choices:
    A: 300 pies
    B: 400 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Delaware prohíbe las vueltas en U donde el conductor no pueda
    ver a 500 pies en cada dirección.
- id: 80
  category: safe_driving_rules
  question: 'Para mantener una distancia de seguimiento segura en Delaware, el manual
    del conductor recomienda seguir al vehículo que tiene delante por al menos:'
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: La longitud de un automóvil por cada 10 mph
  answer: B
  explanation: El Manual del Conductor de Delaware recomienda una distancia de seguimiento
    de al menos tres segundos en condiciones normales.
- id: 81
  category: safe_driving_rules
  question: En una carretera de Delaware con cuatro o más carriles (como la Ruta 13),
    ¿qué tráfico debe detenerse cuando un autobús escolar se detiene con las luces
    rojas intermitentes y el brazo de parada extendido?
  choices:
    A: El tráfico en todos los carriles y direcciones
    B: Solo el tráfico que circula detrás del autobús
    C: Solo el tráfico en el carril inmediatamente al lado del autobús
    D: No se requiere que ningún tráfico se detenga si hay una mediana
  answer: B
  explanation: En Delaware, en una carretera con cuatro o más carriles, solo el tráfico
    que sigue al autobús debe detenerse. El tráfico que se aproxima en la dirección
    opuesta no se detiene, pero debe proceder con precaución.
- id: 82
  category: safe_driving_rules
  question: 'En Delaware, debe informar un accidente a la policía de inmediato si
    los daños estimados a la propiedad son de al menos:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: La ley de Delaware exige informar a la policía sobre cualquier accidente
    que involucre daños a la propiedad de $1,500 o más.
- id: 83
  category: safe_driving_rules
  question: Según la ley de Delaware, ¿se le prohíbe estacionar a menos de cuántos
    pies de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Delaware establece que no debe estacionar a menos de 15 pies
    de un hidrante de incendios.
- id: 84
  category: safe_driving_rules
  question: En Delaware, ¿a qué distancia debe estacionarse de una señal de alto (stop),
    una baliza intermitente o una señal de control de tráfico?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: No se permite estacionar a menos de 30 pies de cualquier baliza intermitente,
    señal de alto o señal de control de tráfico ubicada al costado de una carretera.
- id: 85
  category: safe_driving_rules
  question: Al estacionar cerca de una intersección en Delaware, ¿cuál es la distancia
    mínima que debe mantener de un paso de peatones?
  choices:
    A: 15 pies
    B: 20 pies
    C: 25 pies
    D: 30 pies
  answer: B
  explanation: Las regulaciones de Delaware prohíben estacionar a menos de 20 pies
    de un paso de peatones en una intersección.
- id: 86
  category: safe_driving_rules
  question: En Delaware, cuando se estaciona en paralelo, ¿sus neumáticos deben estar
    a menos de cuántas pulgadas del bordillo?
  choices:
    A: 6 pulgadas
    B: 10 pulgadas
    C: 12 pulgadas
    D: 18 pulgadas
  answer: C
  explanation: Al estacionar a lo largo del bordillo, la ley de Delaware exige que
    las ruedas estén a menos de 12 pulgadas del mismo.
- id: 87
  category: safe_driving_rules
  question: Según el Manual del Conductor de Delaware, ¿cuál es la distancia de seguimiento
    recomendada detrás del vehículo que está delante de usted en condiciones ideales?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: Delaware recomienda la 'regla de los tres segundos' para mantener una
    distancia de seguimiento segura detrás de otros vehículos.
- id: 88
  category: safe_driving_rules
  question: ¿Qué sucede con las multas por infracciones de tráfico en Delaware cuando
    la infracción se comete en una zona de obras designada?
  choices:
    A: Las multas se reducen a la mitad
    B: Las multas siguen siendo las mismas
    C: Las multas se duplican
    D: Las multas se triplican
  answer: C
  explanation: En Delaware, las multas por exceso de velocidad y otras infracciones
    de tráfico se duplican cuando ocurren en una zona de obras.
- id: 89
  category: safe_driving_rules
  question: La ley 'Move Over' de Delaware exige que los conductores cambien de carril
    o reduzcan la velocidad al acercarse a ¿cuál de los siguientes vehículos detenidos
    en el acotamiento?
  choices:
    A: Solo patrullas de policía
    B: Solo ambulancias y camiones de bomberos
    C: Cualquier vehículo con luces de emergencia intermitentes
    D: Vehículos de emergencia, grúas y vehículos de servicios públicos con luces
      intermitentes
  answer: D
  explanation: La Ley Move Over de Delaware se aplica a vehículos de emergencia, grúas
    y vehículos de servicios públicos (como camiones de DelDOT o de la compañía eléctrica)
    que están detenidos con sus luces intermitentes encendidas.
- id: 90
  category: safe_driving_rules
  question: En Delaware, debe bajar las luces altas de sus faros cuando se encuentre
    a menos de cuántos pies de un vehículo que viene en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Delaware exige que baje las luces altas cuando se encuentre
    a menos de 500 pies de un vehículo que se aproxima en sentido contrario.
- id: 91
  category: safe_driving_rules
  question: Según la ley de Delaware, es ilegal usar un teléfono celular de mano mientras
    se conduce. ¿Cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Solo es ilegal para conductores menores de 18 años
    B: Es legal si está detenido en un semáforo en rojo
    C: Es ilegal que todos los conductores usen un dispositivo de mano mientras el
      vehículo está en movimiento
    D: Es legal en autopistas pero no en ciudades
  answer: C
  explanation: En Delaware, el uso de teléfonos celulares de mano mientras se conduce
    está prohibido para todos los conductores. Esto incluye hablar, enviar mensajes
    de texto o navegar mientras el vehículo está en movimiento.
- id: 92
  category: defensive_driving
  question: Para evitar el frenado de último minuto o la necesidad de girar repentinamente,
    las leyes y pautas de seguridad de Delaware sugieren que debe mirar hacia adelante
    a qué distancia?
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 12 segundos
    C: De 15 a 20 segundos
    D: De 25 a 30 segundos
  answer: B
  explanation: Las pautas de seguridad de Delaware establecen que los conductores
    deben mirar al menos de 10 a 12 segundos por delante de su vehículo para identificar
    posibles peligros con anticipación.
- id: 93
  category: defensive_driving
  question: 'En Delaware, debe atenuar sus luces altas al seguir a otro vehículo desde
    atrás a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: Según el Manual del Conductor de Delaware, debe usar las luces bajas
    cuando siga a otro vehículo a una distancia de 200 pies o menos.
- id: 94
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (hydroplaning) en Delaware,
    haciendo que los neumáticos pierdan parte del contacto con la superficie de la
    carretera?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El Manual del Conductor de Delaware advierte que el hidroplaneo puede
    comenzar a velocidades tan bajas como 35 mph, y a 50 mph, los neumáticos pueden
    perder todo contacto con la carretera.
- id: 95
  category: defensive_driving
  question: Si conduce con niebla densa en Delaware, ¿qué juego de luces debe usar
    para obtener la mejor visibilidad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Luces de emergencia
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque las luces altas se
    reflejan en la niebla y, de hecho, disminuyen la visibilidad.
- id: 96
  category: defensive_driving
  question: 'Si su vehículo está equipado con un Sistema de Frenos Antibloqueo (ABS)
    y necesita detenerse rápidamente en una carretera resbaladiza de Delaware, debe:'
  choices:
    A: Bombear los frenos rápidamente
    B: Presionar el pedal del freno con fuerza y mantenerlo presionado
    C: Tocar ligeramente los frenos
    D: Cambiar a neutral y usar el freno de emergencia
  answer: B
  explanation: El Manual del Conductor de Delaware instruye a los conductores con
    ABS a presionar el pedal del freno con fuerza y mantenerlo presionado; el sistema
    bombeará automáticamente los frenos por usted.
- id: 97
  category: defensive_driving
  question: Al cambiar de carril en Delaware, ¿cuál es la forma más efectiva de revisar
    sus 'puntos ciegos'?
  choices:
    A: Mirar por el espejo retrovisor
    B: Mirar por los espejos laterales
    C: Girar la cabeza y mirar por encima del hombro
    D: Revisar su cámara de reversa
  answer: C
  explanation: Los espejos no lo muestran todo; las pautas de Delaware establecen
    que debe girar la cabeza y mirar por encima del hombro en la dirección en la que
    planea moverse para revisar los puntos ciegos.
- id: 98
  category: defensive_driving
  question: Según las pautas de seguridad de Delaware, ¿cómo debe ajustar su distancia
    de seguimiento al conducir en carreteras resbaladizas o con poca visibilidad?
  choices:
    A: Mantenerla en cuatro segundos
    B: Aumentarla a seis segundos o más
    C: Disminuirla a dos segundos para mantenerse cerca del auto de adelante
    D: La distancia de seguimiento no necesita cambiar si tiene neumáticos de invierno
  answer: B
  explanation: Delaware recomienda aumentar la distancia de seguimiento a seis segundos
    o más durante condiciones adversas como lluvia, nieve o hielo para permitir distancias
    de frenado más largas.
- id: 99
  category: defensive_driving
  question: Al acercarse a una intersección en Delaware, ¿en qué orden debe observar
    el tráfico?
  choices:
    A: Derecha, luego izquierda, luego derecha otra vez
    B: Izquierda, luego derecha, luego izquierda otra vez
    C: Solo hacia adelante
    D: Solo en la dirección del tráfico que viene en sentido contrario
  answer: B
  explanation: 'El manual de Delaware enseña la regla de ''Izquierda, Derecha, Izquierda'':
    mire a la izquierda primero (ya que el tráfico de la izquierda está más cerca),
    luego a la derecha, y luego a la izquierda nuevamente justo antes de entrar en
    la intersección.'
- id: 100
  category: defensive_driving
  question: En Delaware, si conduce de noche y sus luces altas le permiten ver a 350
    pies de distancia, ¿cuál es la velocidad máxima segura a la que debe conducir
    para evitar 'sobrepasar el alcance' de sus faros?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 65 mph
  answer: C
  explanation: Los manuales de seguridad de Delaware sugieren que a 50 mph, se necesitan
    unos 400 pies para detenerse por completo; por lo tanto, conducir a más de 50
    mph con faros que solo alcanzan los 350 pies es 'sobrepasar el alcance' de sus
    luces.
- id: 101
  category: defensive_driving
  question: ¿Al conducir en una autopista de Delaware con tres o más carriles, qué
    carril es generalmente el más fluido para el tráfico directo?
  choices:
    A: El carril izquierdo
    B: El carril derecho
    C: El carril central
    D: El acotamiento
  answer: C
  explanation: El Manual del Conductor de Delaware sugiere que el carril central suele
    ser el más fluido para el tráfico directo, ya que el carril derecho es para el
    tráfico más lento o incorporaciones y el carril izquierdo es para rebasar.
- id: 102
  category: defensive_driving
  question: 'Para evitar frenar a último momento o la necesidad de girar repentinamente,
    la ley de Delaware sugiere que debe mirar hacia adelante de su vehículo al menos:'
  choices:
    A: 3 a 5 segundos
    B: 5 a 8 segundos
    C: 10 a 12 segundos
    D: 20 a 25 segundos
  answer: C
  explanation: El Manual del Conductor de Delaware establece que escanear de 10 a
    12 segundos hacia adelante le permite ver los peligros a tiempo y proporciona
    suficiente tiempo para reaccionar de manera segura.
- id: 103
  category: defensive_driving
  question: 'Al conducir de noche en Delaware, debe bajar las luces altas cuando un
    vehículo que viene en dirección contraria esté a menos de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Delaware exige que los conductores cambien a luces bajas
    cuando un vehículo que se aproxima esté a menos de 500 pies para evitar cegar
    al otro conductor.
- id: 104
  category: defensive_driving
  question: 'En Delaware, el hidroplaneo (donde los neumáticos pierden contacto con
    la carretera y se deslizan sobre una fina capa de agua) puede comenzar a velocidades
    tan bajas como:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El Manual del Conductor de Delaware advierte que el hidroplaneo puede
    comenzar a velocidades tan bajas como 35 mph, y en una lluvia intensa, sus neumáticos
    pueden perder todo contacto con la carretera a 55 mph.
- id: 105
  category: defensive_driving
  question: Al conducir con niebla, ¿qué configuración de faros debe usar en Delaware
    para garantizar la máxima visibilidad y seguridad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: No se requieren luces durante la niebla diurna
  answer: B
  explanation: Debe usar las luces bajas en la niebla porque las luces altas se reflejan
    en las gotas de agua de la niebla, lo que provoca deslumbramiento y dificulta
    la visión.
- id: 106
  category: defensive_driving
  question: 'En Delaware, completar un curso de conducción defensiva aprobado por
    el estado otorga al conductor una reducción obligatoria de la prima del seguro
    de:'
  choices:
    A: 5% por dos años
    B: 10% por tres años
    C: 15% por un año
    D: 20% por cinco años
  answer: B
  explanation: La ley de Delaware exige que las compañías de seguros otorguen un descuento
    del 10% en la parte de responsabilidad civil del seguro de automóvil durante tres
    años al completar un curso de conducción defensiva aprobado.
- id: 107
  category: defensive_driving
  question: 'Al escanear hacia adelante en un entorno urbano, el Manual del Conductor
    de Delaware recomienda mirar al menos:'
  choices:
    A: Una cuadra adelante
    B: Dos cuadras adelante
    C: Tres cuadras adelante
    D: Media milla adelante
  answer: A
  explanation: En la ciudad, mirar de 10 a 12 segundos hacia adelante corresponde
    aproximadamente a una cuadra de la ciudad.
- id: 108
  category: defensive_driving
  question: Según el Manual del Conductor de Delaware, a 55 mph, ¿aproximadamente
    cuántos pies se necesitan para reaccionar y detener su vehículo por completo?
  choices:
    A: 100 pies
    B: 150 pies
    C: 225 pies
    D: 400 pies
  answer: C
  explanation: A 55 mph, la distancia total de frenado (incluyendo el tiempo de reacción
    y la distancia de frenado) es de aproximadamente 225 pies.
- id: 109
  category: defensive_driving
  question: 'Al compartir la carretera con camiones grandes, los conductores de Delaware
    deben estar al tanto de las ''Zonas Prohibidas'' (No-Zones). Estas son:'
  choices:
    A: Áreas donde no se permite circular a los camiones
    B: Puntos ciegos donde el conductor del camión no puede ver su vehículo
    C: Carriles especiales reservados para vehículos de emergencia
    D: Zonas de velocidad restringida para vehículos comerciales
  answer: B
  explanation: Las 'No-Zones' son los grandes puntos ciegos alrededor de un camión
    (delante, detrás y a los lados) donde su automóvil desaparece de la vista del
    conductor del camión, lo que aumenta el riesgo de una colisión.
- id: 110
  category: alcohol_drugs_health
  question: Bajo la ley de 'Consentimiento Implícito' (Implied Consent) de Delaware,
    ¿qué acepta un conductor al operar un vehículo motorizado?
  choices:
    A: Mantener un seguro de cobertura total en todo momento
    B: Someterse a una prueba química de aliento, sangre u orina si se sospecha que
      conduce bajo la influencia
    C: Permitir que la policía registre su vehículo sin una orden judicial
    D: Llevar su registro y prueba de seguro en la guantera
  answer: B
  explanation: La ley de Consentimiento Implícito de Delaware significa que se considera
    que cualquier persona que opera un vehículo motorizado ha dado su consentimiento
    para una prueba química para determinar la presencia de alcohol o drogas.
- id: 111
  category: alcohol_drugs_health
  question: ¿En Delaware, cuál es el período de revocación de la licencia por una
    primera condena por DUI si el BAC del conductor era inferior a 0.15?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: C
  explanation: Para una primera infracción por DUI en Delaware con un BAC inferior
    a 0.15, el período de revocación de la licencia es de 12 meses.
- id: 112
  category: alcohol_drugs_health
  question: 'En Delaware, si se niega a someterse a una prueba química de alcohol
    o drogas (primera infracción), su licencia será revocada por:'
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: B
  explanation: Bajo la ley de Consentimiento Implícito, la primera negativa a una
    prueba química resulta en una revocación de la licencia por 12 meses.
- id: 113
  category: alcohol_drugs_health
  question: Bajo la Ley de Tolerancia Cero de Delaware, ¿por cuánto tiempo se le revocará
    la licencia a un conductor menor de 21 años que sea sorprendido con un BAC de
    0.02 o superior en su primera infracción?
  choices:
    A: 30 días
    B: 2 meses
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Para conductores menores de 21 años, una primera violación de la Tolerancia
    Cero resulta en una revocación de la licencia por 2 meses.
- id: 114
  category: alcohol_drugs_health
  question: ¿En Delaware, cuál es la multa mínima por una primera condena por DUI?
  choices:
    A: $250
    B: $575
    C: $1,000
    D: $2,300
  answer: B
  explanation: La multa por una primera infracción por DUI en Delaware oscila entre
    $575 y $2,300.
- id: 115
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al programa
    del Dispositivo de Bloqueo de Encendido (IID) en Delaware?
  choices:
    A: Solo se requiere para conductores con una tercera infracción por DUI
    B: Es opcional para todos los infractores de DUI
    C: Todos los infractores de DUI deben tener instalado un IID para recuperar los
      privilegios de conducir
    D: Solo se requiere si el BAC era superior a 0.20
  answer: C
  explanation: La ley de Delaware exige que todos los infractores por DUI (incluidos
    los que cometen la primera infracción) participen en el programa del Dispositivo
    de Bloqueo de Encendido (IID) para obtener una licencia condicional o restablecer
    sus privilegios de conducir.
- id: 116
  category: alcohol_drugs_health
  question: En Delaware, si es condenado por un DUI mientras transporta a un menor
    de 17 años, ¿cuál es la sanción adicional?
  choices:
    A: No hay sanción adicional
    B: Una multa adicional y posible servicio comunitario
    C: Revocación permanente automática de su licencia
    D: Sentencia de cárcel obligatoria de 30 días
  answer: B
  explanation: Transportar a un niño bajo la influencia es un factor agravante en
    Delaware, lo que conlleva multas adicionales y posible servicio comunitario.
- id: 117
  category: alcohol_drugs_health
  question: ¿Cuántos días tiene un conductor de Delaware para solicitar una audiencia
    administrativa con el DMV después de ser arrestado por un DUI?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: Un conductor tiene 15 días a partir de la fecha del arresto por DUI
    para solicitar una audiencia administrativa para impugnar la revocación de la
    licencia.
- id: 118
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma de reducir eficazmente la concentración de alcohol
    en sangre (BAC) en su cuerpo?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Tiempo
    D: Hacer ejercicio vigorosamente
  answer: C
  explanation: El tiempo es el único factor que puede reducir el BAC. El cuerpo metaboliza
    el alcohol a un ritmo constante que no puede acelerarse con café, comida o duchas.
- id: 119
  category: alcohol_drugs_health
  question: 'En Delaware, si está tomando un medicamento recetado y este afecta su
    conducción, usted puede:'
  choices:
    A: No ser acusado de DUI porque el medicamento era legal
    B: Ser acusado de DUI al igual que si estuviera bebiendo alcohol
    C: Solo ser acusado si también tiene alcohol en su sistema
    D: Ser acusado únicamente de una infracción de tráfico menor
  answer: B
  explanation: Según la ley de Delaware, conducir bajo la influencia de cualquier
    droga (ya sea recetada, de venta libre o ilegal) que afecte su capacidad para
    conducir es una infracción por DUI.
- id: 120
  category: alcohol_drugs_health
  question: ¿Qué sucede si un conductor de Delaware es condenado por una segunda infracción
    de DUI dentro de los 5 años posteriores a la primera?
  choices:
    A: Revocación de la licencia por 12 meses
    B: Revocación de la licencia por 18 meses
    C: Revocación de la licencia por 24 meses
    D: Revocación de la licencia por 60 meses
  answer: C
  explanation: Una segunda infracción por DUI dentro de los 5 años resulta en una
    revocación de la licencia por 24 meses en Delaware, independientemente del nivel
    de BAC.
- id: 121
  category: alcohol_drugs_health
  question: ¿Según el Manual del Conductor de Delaware, qué efecto tiene en un conductor
    la mezcla de alcohol y drogas (sinergismo)?
  choices:
    A: Los efectos de la droga son anulados por el alcohol
    B: Los efectos del alcohol son anulados por la droga
    C: El efecto combinado es mucho mayor que la suma de las partes
    D: No hay una diferencia medible en el deterioro
  answer: C
  explanation: Mezclar alcohol y drogas crea un efecto sinérgico, lo que significa
    que el deterioro es significativamente peor que si se usara cualquiera de las
    sustancias por separado.
- id: 122
  category: alcohol_drugs_health
  question: En Delaware, si tiene una condición médica que causa pérdida del conocimiento
    (como la epilepsia), ¿cuánto tiempo debe estar libre de convulsiones antes de
    que se le pueda otorgar la licencia?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Delaware generalmente requiere que las personas con condiciones que
    causan pérdida del conocimiento estén libres de tales episodios durante al menos
    6 meses antes de poder conducir.
- id: 123
  category: alcohol_drugs_health
  question: Si un conductor de Delaware es condenado por una primera infracción de
    'Tolerancia Cero' (menor de 21 años con un BAC de .01 o superior), ¿por cuánto
    tiempo se le revocará la licencia?
  choices:
    A: 30 días
    B: 2 meses
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Bajo la ley de Tolerancia Cero de Delaware, una primera infracción
    para un conductor menor de 21 años resulta en una revocación de la licencia por
    2 meses.
- id: 124
  category: alcohol_drugs_health
  question: En Delaware, un Dispositivo de Bloqueo de Encendido (IID) es obligatorio
    para una primera infracción de DUI si la concentración de alcohol en sangre (BAC)
    del conductor es igual o superior a qué nivel?
  choices:
    A: '0.08'
    B: '0.10'
    C: '0.15'
    D: '0.20'
  answer: C
  explanation: La ley de Delaware exige la instalación de un Dispositivo de Bloqueo
    de Encendido (IID) para una primera infracción de DUI si el BAC del infractor
    es de 0.15 o superior.
- id: 125
  category: alcohol_drugs_health
  question: Según el Manual del Conductor de Delaware, ¿cuál es la primera facultad
    que se ve afectada por el consumo de alcohol?
  choices:
    A: Visión
    B: Coordinación muscular
    C: Juicio
    D: Habla
  answer: C
  explanation: El alcohol llega al cerebro casi de inmediato. La primera facultad
    que se ve afectada es el juicio de la persona, seguida de sus reflejos y coordinación.
- id: 126
  category: alcohol_drugs_health
  question: Si un conductor de Delaware es menor de 21 años y es condenado por comprar
    o poseer alcohol, incluso si no estaba conduciendo, ¿por cuánto tiempo se le revocará
    la licencia por una primera infracción?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: A
  explanation: En Delaware, cualquier persona menor de 21 años que sea condenada por
    comprar o poseer alcohol se enfrenta a una revocación de la licencia de 30 días
    por una primera infracción.
- id: 127
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones sobre las drogas y la conducción
    es verdadera según la ley de Delaware?
  choices:
    A: Solo las drogas ilegales pueden dar lugar a un cargo de DUI
    B: Los medicamentos recetados siempre son seguros de usar al conducir
    C: Los medicamentos para el resfriado de venta libre no pueden afectar la capacidad
      de conducción
    D: Un conductor puede ser acusado de DUI por estar bajo la influencia de cualquier
      droga, incluidos los medicamentos recetados y los de venta libre
  answer: D
  explanation: En Delaware, un cargo de DUI puede aplicarse a cualquier sustancia
    que afecte la conducción, incluidas las drogas ilegales, los medicamentos recetados
    y los medicamentos de venta libre.
- id: 128
  category: alcohol_drugs_health
  question: ¿Qué es el 'efecto sinérgico' mencionado en el Manual del Conductor de
    Delaware con respecto al alcohol y las drogas?
  choices:
    A: El efecto del alcohol desaparece más rápido al tomar medicamentos
    B: El efecto combinado del alcohol y las drogas es mayor que la suma de sus partes
    C: La capacidad del cuerpo para procesar el alcohol de manera más eficiente con
      la comida
    D: El límite legal de BAC es más alto si hay medicamentos presentes
  answer: B
  explanation: El efecto sinérgico ocurre cuando se toman alcohol y drogas (incluso
    las legales) juntos, lo que causa un impacto mucho más grave en el sistema nervioso
    central de lo que cualquiera de los dos causaría por separado.
- id: 129
  category: alcohol_drugs_health
  question: En Delaware, ¿cuántas horas le toma típicamente al cuerpo eliminar el
    alcohol contenido en una bebida estándar?
  choices:
    A: 30 minutos
    B: 1 hora
    C: 2 horas
    D: 5 horas
  answer: B
  explanation: El cuerpo descompone químicamente el alcohol a un ritmo constante.
    El cuerpo tarda aproximadamente una hora en eliminar el alcohol de una bebida
    estándar (por ejemplo, 12 oz de cerveza, 5 oz de vino o 1.5 oz de licor).
- id: 130
  category: alcohol_drugs_health
  question: Si un conductor es condenado por un DUI en Delaware y tenía a un menor
    (menor de 18 años) en el vehículo en el momento de la infracción, ¿qué sucede?
  choices:
    A: Se exonera la multa si el conductor asiste a asesoramiento
    B: El conductor se enfrenta a multas adicionales y a un período de revocación
      más largo
    C: La licencia del conductor es revocada permanentemente
    D: El conductor solo es acusado de una infracción de pasajero
  answer: B
  explanation: En Delaware, tener a un menor en el vehículo durante una infracción
    de DUI es un factor agravante que resulta en sanciones adicionales, incluyendo
    multas más altas y períodos extendidos de revocación de la licencia.
- id: 131
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes NO es un factor que determina la concentración
    de alcohol en sangre (BAC) de una persona?
  choices:
    A: La cantidad de alcohol consumida
    B: El peso corporal de la persona
    C: El tipo de bebida alcohólica (por ejemplo, cerveza frente a vodka)
    D: La cantidad de tiempo durante la cual se consumió el alcohol
  answer: C
  explanation: El BAC se determina por la cantidad de alcohol, el peso corporal y
    el tiempo. El "tipo" de bebida no importa tanto como el contenido real de alcohol;
    una cerveza estándar, una copa de vino y un trago de licor contienen aproximadamente
    la misma cantidad de alcohol.
- id: 132
  category: alcohol_drugs_health
  question: En Delaware, si usted se ve involucrado en un choque que resulte en lesiones
    o muerte, debe someterse a una prueba química. Si se niega, ¿cuánto tiempo dura
    el periodo de revocación por una primera infracción?
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: D
  explanation: Aunque una negativa estándar por primera infracción es de 12 meses,
    la ley de Delaware especifica que si un conductor se niega a una prueba química
    después de un choque que involucre lesiones o muerte, el periodo de revocación
    es de 24 meses para una primera infracción.
- id: 133
  category: penalties_and_points
  question: Bajo el sistema de puntos de Delaware, ¿qué medida toma el DMV cuando
    un conductor alcanza los 12 puntos en su registro?
  choices:
    A: Se envía una carta de advertencia al conductor
    B: Se suspende la licencia del conductor por 2 meses
    C: El conductor debe asistir a una entrevista de mejoramiento del conductor
    D: Se revoca la licencia del conductor por 1 año
  answer: C
  explanation: En Delaware, alcanzar los 12 puntos requiere que el conductor asista
    a una entrevista de mejoramiento del conductor. Se envía una carta de advertencia
    a los 8 puntos.
- id: 134
  category: penalties_and_points
  question: Si un conductor de Delaware acumula 14 puntos en su registro, ¿por cuánto
    tiempo se suspenderán sus privilegios de conducción?
  choices:
    A: 2 meses
    B: 4 meses
    C: 6 meses
    D: 12 meses
  answer: B
  explanation: En Delaware, acumular 14 puntos resulta en una suspensión obligatoria
    de la licencia de 4 meses.
- id: 135
  category: penalties_and_points
  question: ¿Cuál es el periodo de suspensión obligatoria de la licencia para un conductor
    de Delaware condenado por 'exhibiciones de velocidad' (carreras) en una carretera?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: La ley de Delaware exige una suspensión de la licencia de 6 meses para
    cualquier persona condenada por carreras o exhibiciones de velocidad.
- id: 136
  category: penalties_and_points
  question: Para una primera condena por DUI en Delaware con un BAC inferior a 0.15,
    ¿por cuánto tiempo se revoca la licencia del conductor?
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: B
  explanation: Una primera condena por DUI con un BAC inferior a 0.15 resulta en una
    revocación de 12 meses. Los niveles de BAC más altos resultan en revocaciones
    más largas (18 o 24 meses).
- id: 137
  category: penalties_and_points
  question: En el sistema de puntos de Delaware, ¿cuántos puntos se asignan por una
    infracción de 'no ceder el paso'?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: Una infracción por no ceder el paso conlleva una penalización de 3
    puntos en Delaware.
- id: 138
  category: penalties_and_points
  question: En Delaware, ¿cuál es la multa por una primera condena por operar un vehículo
    que no está cubierto por el seguro requerido?
  choices:
    A: $500 a $1,000
    B: $1,000 a $1,500
    C: $1,500 a $2,000
    D: $2,500 a $4,000
  answer: C
  explanation: Operar un vehículo sin seguro por primera vez en Delaware conlleva
    una multa de $1,500 a $2,000 y una suspensión obligatoria de la licencia de 6
    meses.
- id: 139
  category: penalties_and_points
  question: ¿A partir de qué límite de puntos se enfrenta un conductor de Delaware
    a una suspensión obligatoria de la licencia de 12 meses?
  choices:
    A: 18 puntos
    B: 20 puntos
    C: 22 puntos
    D: 24 puntos
  answer: C
  explanation: En Delaware, alcanzar los 22 puntos en un registro de conducción resulta
    en una suspensión obligatoria de la licencia de 12 meses (1 año).
- id: 140
  category: penalties_and_points
  question: En Delaware, los niños deben estar debidamente asegurados en un sistema
    de retención infantil hasta que alcancen ¿qué edad o peso?
  choices:
    A: 6 años de edad o 50 lbs
    B: 7 años de edad o 60 lbs
    C: 8 años de edad o 65 lbs
    D: 10 años de edad o 80 lbs
  answer: C
  explanation: La ley de Delaware exige que los niños utilicen un sistema de retención
    infantil hasta que tengan 8 años O pesen 65 lbs.
- id: 141
  category: penalties_and_points
  question: Según la ley de Infractores Habituales de Delaware, ¿la licencia de una
    persona puede ser revocada si es condenada por cuántas infracciones de tráfico
    'graves' dentro de un periodo de 5 años?
  choices:
    A: '2'
    B: '3'
    C: '5'
    D: '10'
  answer: B
  explanation: La ley de Infractores Habituales se aplica a los conductores que cometen
    3 infracciones de tráfico graves (como DUI o conducción temeraria) en un periodo
    de 5 años.
- id: 142
  category: penalties_and_points
  question: En Delaware, ¿cuál es la tarifa de reinstalación de una licencia de conducir
    que fue revocada por una infracción relacionada con DUI (conducir bajo la influencia)?
  choices:
    A: $25
    B: $50
    C: $143.75
    D: $200
  answer: D
  explanation: Aunque la tarifa de reinstalación estándar es más baja, Delaware cobra
    una tarifa de $200 para reinstalar una licencia revocada por infracciones relacionadas
    con el alcohol.
- id: 143
  category: penalties_and_points
  question: En Delaware, alcanzar 16 puntos en su historial de conducción resultará
    en una suspensión obligatoria de la licencia por ¿cuántos meses?
  choices:
    A: 4 meses
    B: 6 meses
    C: 8 meses
    D: 12 meses
  answer: B
  explanation: De acuerdo con el sistema de puntos de Delaware, acumular 16 puntos
    conlleva una suspensión obligatoria de la licencia por 6 meses.
- id: 144
  category: sharing_the_road
  question: En Delaware, si se encuentra en una carretera de cuatro o más carriles,
    ¿cuándo está obligado a detenerse ante un autobús escolar que tiene sus luces
    rojas intermitentes encendidas y el brazo de parada extendido?
  choices:
    A: Solo si viaja en la misma dirección que el autobús
    B: Solo si viaja en la dirección opuesta al autobús
    C: Debe detenerse independientemente de la dirección en la que viaje
    D: Solo necesita detenerse si no hay una mediana física
  answer: A
  explanation: Según el Manual del Conductor de Delaware, en una carretera con cuatro
    o más carriles, debe detenerse solo si viaja en la misma dirección que el autobús.
- id: 145
  category: sharing_the_road
  question: Al rebasar a un ciclista en Delaware, ¿cuál es la cantidad mínima de espacio
    que un automovilista debe mantener entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Delaware exige que los automovilistas dejen una distancia
    de seguridad al rebasar una bicicleta, la cual se define como no menos de 3 pies.
- id: 146
  category: sharing_the_road
  question: Bajo la ley de Delaware, ¿quién está obligado a usar un casco de seguridad
    mientras opera o viaja en una motocicleta?
  choices:
    A: Todas las personas, independientemente de su edad
    B: Solo las personas menores de 19 años o aquellas que han tenido una licencia
      por menos de dos años
    C: Solo las personas menores de 21 años
    D: Nadie está legalmente obligado a usar casco en Delaware
  answer: B
  explanation: En Delaware, toda persona de hasta 19 años de edad debe usar casco.
    Además, cualquier persona que haya tenido un endoso o licencia de motocicleta
    por menos de dos años también debe usar casco.
- id: 147
  category: sharing_the_road
  question: Al conducir cerca de un camión comercial grande, ¿qué es la 'No-Zone'
    (Zona de No Visibilidad)?
  choices:
    A: El área donde los camiones tienen prohibido circular
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión donde el conductor no puede verlo
    C: El carril designado específicamente para rebasar camiones
    D: El área directamente frente al camión solamente
  answer: B
  explanation: La 'No-Zone' se refiere a los grandes puntos ciegos alrededor de un
    camión. Si no puede ver la cara del conductor del camión en su espejo lateral,
    él no puede verlo a usted.
- id: 148
  category: sharing_the_road
  question: En Delaware, cuando un peatón se encuentra en un cruce de peatones no
    marcado en una intersección, ¿quién tiene el derecho de paso?
  choices:
    A: El automovilista, porque no hay líneas pintadas
    B: El peatón
    C: Quien llegue primero a la intersección
    D: El automovilista, pero solo si usa su bocina
  answer: B
  explanation: La ley de Delaware establece que los conductores deben ceder el derecho
    de paso a los peatones que cruzan la carretera dentro de cualquier cruce de peatones
    marcado o no marcado en una intersección.
- id: 149
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los derechos
    de los ciclistas en las carreteras de Delaware?
  choices:
    A: Los ciclistas siempre deben circular por la acera
    B: Los ciclistas tienen los mismos derechos y deben obedecer las mismas leyes
      que los operadores de vehículos motorizados
    C: Los ciclistas siempre tienen el derecho de paso sobre los autos en todo momento
    D: No se permiten ciclistas en ninguna carretera pública en Delaware
  answer: B
  explanation: En Delaware, una persona que monta en bicicleta tiene todos los derechos
    y todos los deberes aplicables al conductor de un vehículo, con ciertas excepciones.
- id: 150
  category: sharing_the_road
  question: 'Para una primera infracción por rebasar a un autobús escolar detenido
    con las luces rojas intermitentes en Delaware, la multa será de al menos:'
  choices:
    A: $50
    B: $115
    C: $500
    D: $1,000
  answer: B
  explanation: Bajo el Título 21 § 4166 de Delaware, la multa por una primera infracción
    de rebasar a un autobús escolar detenido no es inferior a $115 ni superior a $230.
- id: 151
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor de Delaware cuando un vehículo de emergencia
    con sirenas y luces intermitentes se aproxima por detrás?
  choices:
    A: Acelerar para mantenerse delante del vehículo
    B: Detenerse inmediatamente en el carril de circulación actual
    C: Detenerse en el borde derecho de la calzada y parar hasta que el vehículo haya
      pasado
    D: Detenerse en la mediana izquierda y parar
  answer: C
  explanation: Al aproximarse un vehículo de emergencia autorizado, los conductores
    deben ceder el paso e inmediatamente conducir a una posición paralela y lo más
    cerca posible del borde derecho o bordillo de la carretera.
- id: 152
  category: sharing_the_road
  question: 'En Delaware, si ve a un peatón que lleva un bastón blanco o utiliza un
    perro guía, usted debe:'
  choices:
    A: Tocar la bocina para alertarlos de su presencia
    B: Ceder el paso y tomar precauciones para evitar lesiones
    C: Pasarlos rápidamente para evitar confundir al perro
    D: Solo detenerse si están en un cruce peatonal marcado
  answer: B
  explanation: La ley de Delaware exige que los conductores cedan el paso a cualquier
    peatón total o parcialmente ciego que lleve un bastón blanco o utilice un perro
    guía.
- id: 153
  category: sharing_the_road
  question: 'Para proporcionar una distancia de seguimiento segura detrás de una motocicleta,
    el Manual del Conductor de Delaware sugiere un espacio mínimo de al menos:'
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 5 segundos
    D: 10 segundos
  answer: B
  explanation: El Manual del Conductor de Delaware recomienda una distancia de seguimiento
    de al menos 2 segundos para todos los vehículos en condiciones ideales, aunque
    señala que más espacio es más seguro al seguir motocicletas.
- id: 154
  category: sharing_the_road
  question: Al andar en bicicleta por una carretera de Delaware, ¿en qué dirección
    debe viajar el ciclista?
  choices:
    A: De frente al tráfico que viene en sentido contrario
    B: En la misma dirección que el tráfico de vehículos motorizados
    C: Solo en el lado izquierdo de la carretera
    D: En contra del flujo del tráfico para ver mejor los autos
  answer: B
  explanation: Los ciclistas deben circular con el flujo del tráfico, al igual que
    los vehículos motorizados.
- id: 155
  category: sharing_the_road
  question: ¿Por qué debe evitar quedar atrapado con su vehículo entre un camión y
    el bordillo cuando el camión se aproxima a una intersección?
  choices:
    A: Los camiones a menudo necesitan abrirse hacia la izquierda para girar a la
      derecha
    B: Los camiones están obligados por ley a girar desde el carril central
    C: Los camiones tienen una distancia de frenado más corta que los autos
    D: Es ilegal conducir en el carril contiguo a un camión
  answer: A
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para no golpear el bordillo al girar a la derecha. Si intenta pasar por la derecha,
    puede quedar apretado entre el camión y el bordillo.
- id: 156
  category: sharing_the_road
  question: 'En Delaware, los vehículos en un cortejo fúnebre que siguen a un vehículo
    guía con las luces encendidas:'
  choices:
    A: Deben ceder el paso a todo el tráfico en las intersecciones
    B: Pueden continuar a través de una luz roja o señal de alto si el vehículo guía
      ha entrado legalmente en la intersección
    C: Deben detenerse en todas las luces rojas independientemente de la posición
      del vehículo guía
    D: Solo se les permite conducir por el arcén de la carretera
  answer: B
  explanation: La ley de Delaware (Título 21 § 4124) permite que los vehículos en
    un cortejo fúnebre sigan al vehículo guía a través de una intersección a pesar
    de un dispositivo de control de tráfico, siempre que ejerzan el debido cuidado.
- id: 157
  category: sharing_the_road
  question: 'Si camina por una carretera de Delaware donde no hay aceras, debe caminar:'
  choices:
    A: En el lado derecho con el flujo del tráfico
    B: En el lado izquierdo de frente al tráfico que viene en sentido contrario
    C: En el centro del carril para ser más visible
    D: Solo durante las horas del día
  answer: B
  explanation: Cuando no hay aceras, los peatones deben caminar únicamente por el
    lado izquierdo de la calzada o su arcén, de frente al tráfico que pueda aproximarse
    desde la dirección opuesta.
- id: 158
  category: sharing_the_road
  question: Al adelantar a una bicicleta que viaja en la misma dirección en una carretera
    de Delaware, ¿cuánta distancia debe mantener un automovilista entre su vehículo
    y la bicicleta?
  choices:
    A: Al menos 1 pie
    B: Al menos 2 pies
    C: Al menos 3 pies
    D: Al menos 5 pies
  answer: C
  explanation: La ley de Delaware exige que los automovilistas dejen un mínimo de
    tres pies de espacio libre al adelantar a un ciclista.
- id: 159
  category: sharing_the_road
  question: Bajo la ley 'Delaware Yield', ¿cómo debe aproximarse un ciclista a una
    señal de alto cuando no hay otro tráfico presente en la intersección?
  choices:
    A: Debe detenerse por completo y esperar 3 segundos
    B: Puede reducir la velocidad y continuar a través de la señal de alto sin detenerse
    C: Debe detenerse y bajarse de la bicicleta
    D: Debe detenerse y esperar una luz verde
  answer: B
  explanation: La ley Delaware Yield permite a los ciclistas tratar las señales de
    alto como señales de ceder el paso, lo que significa que pueden continuar sin
    detenerse si es seguro hacerlo y no hay tráfico cruzado.
- id: 160
  category: sharing_the_road
  question: En Delaware, ¿cuál es el requisito de casco para los conductores y pasajeros
    de motocicletas de 19 años de edad o más?
  choices:
    A: Deben usar casco en todo momento
    B: No se requiere que tengan casco en absoluto
    C: Deben tener un casco aprobado en su posesión en la motocicleta
    D: Solo necesitan casco cuando conducen en autopistas
  answer: C
  explanation: En Delaware, toda persona de hasta 19 años debe usar casco. Aquellos
    de 19 años o más deben tener un casco aprobado en su posesión, aunque el uso es
    opcional para ese grupo de edad.
- id: 161
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el conductor puede necesitar:'
  choices:
    A: Permanecer estrictamente en el carril derecho
    B: Girar ampliamente hacia la izquierda para completar el giro
    C: Acelerar para despejar la intersección
    D: Girar únicamente desde el carril izquierdo
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse ampliamente hacia la
    izquierda para hacer un giro a la derecha sin que las ruedas traseras golpeen
    el bordillo u otros objetos.
- id: 162
  category: sharing_the_road
  question: Si está conduciendo y un vehículo de emergencia con sirenas y luces intermitentes
    se aproxima por detrás, ¿cuál es la acción correcta en Delaware?
  choices:
    A: Detenerse inmediatamente en su carril
    B: Acelerar para salir del camino
    C: Hacerse a un lado hacia el borde derecho de la carretera y detenerse
    D: Moverse al carril izquierdo y reducir la velocidad
  answer: C
  explanation: La ley de Delaware exige que los conductores cedan el derecho de paso
    acercándose lo más posible al borde derecho o bordillo de la calzada y deteniéndose
    hasta que el vehículo de emergencia haya pasado.
- id: 163
  category: sharing_the_road
  question: En Delaware, ¿dónde se encuentran las "Zonas Prohibidas" (No-Zones) de
    un camión grande?
  choices:
    A: Solo directamente detrás del camión
    B: Solo en el lado izquierdo del camión
    C: Directamente al frente, directamente detrás y a ambos lados del camión
    D: Solo en la parte delantera del camión
  answer: C
  explanation: Las "Zonas Prohibidas" son los grandes puntos ciegos alrededor de un
    camión donde el conductor del camión no puede ver a otros vehículos. Estas se
    encuentran al frente, atrás y en ambos lados.
- id: 164
  category: sharing_the_road
  question: 'Según la ley de Delaware, si no hay aceras, los peatones deben caminar:'
  choices:
    A: En el lado derecho de la carretera con el flujo del tráfico
    B: En el lado izquierdo de la carretera de frente al tráfico que viene en sentido
      contrario
    C: En medio de la carretera
    D: En el arcén en la misma dirección que el tráfico
  answer: B
  explanation: Cuando no se proporcionan aceras, los peatones deben caminar por el
    lado izquierdo de la carretera o por su arcén, de frente al tráfico que se aproxima
    desde la dirección opuesta.
- id: 165
  category: sharing_the_road
  question: En Delaware, ¿cuál es la distancia mínima de seguimiento que debe mantener
    detrás de una motocicleta?
  choices:
    A: 2 segundos
    B: 4 segundos
    C: La longitud de 1 automóvil
    D: 50 pies
  answer: B
  explanation: El Manual del Conductor de Delaware recomienda una distancia de seguimiento
    de al menos 4 segundos detrás de una motocicleta para permitir maniobras o paradas
    repentinas.
- id: 166
  category: sharing_the_road
  question: ¿Qué significa un triángulo naranja reflectante en la parte trasera de
    un vehículo en Delaware?
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo es un conductor aprendiz
    C: El vehículo es un vehículo de movimiento lento (25 mph o menos)
    D: El vehículo es una carga de gran tamaño
  answer: C
  explanation: Un triángulo naranja reflectante indica un vehículo de movimiento lento,
    como equipo agrícola o maquinaria de construcción, que viaja a velocidades de
    25 mph o menos.
- id: 167
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene en una carretera de dos carriles
    con sus luces rojas intermitentes, ¿quién debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico en la dirección opuesta
    C: El tráfico en ambas direcciones
    D: Nadie, si el límite de velocidad es superior a 35 mph
  answer: C
  explanation: En una carretera de dos carriles en Delaware, el tráfico en ambas direcciones
    debe detenerse ante un autobús escolar con luces rojas intermitentes y un brazo
    de parada extendido.
- id: 168
  category: sharing_the_road
  question: Si va a girar a la derecha y un ciclista está a su derecha y un poco más
    adelante que usted, ¿qué debe hacer?
  choices:
    A: Acelerar y girar delante del ciclista
    B: Tocar la bocina para advertir al ciclista que se detenga
    C: Ceder el paso y dejar que el ciclista despeje la intersección antes de girar
    D: Obligar al ciclista a subir a la acera
  answer: C
  explanation: Los automovilistas deben ceder el paso a los ciclistas que viajan en
    línea recta a través de una intersección antes de realizar un giro a la derecha.
- id: 169
  category: sharing_the_road
  question: 'En Delaware, los peatones tienen el derecho de paso en un cruce peatonal:'
  choices:
    A: Solo si el cruce está marcado con líneas blancas
    B: Solo en intersecciones con semáforos
    C: Tanto en cruces peatonales marcados como no marcados en las intersecciones
    D: Solo durante las horas del día
  answer: C
  explanation: Los conductores deben ceder el paso a los peatones tanto en los cruces
    peatonales marcados como en los no marcados en las intersecciones.
- id: 170
  category: sharing_the_road
  question: 'Al seguir a un camión grande por la noche, debe atenuar sus luces delanteras
    porque:'
  choices:
    A: Los espejos del camión reflejarán la luz hacia los ojos del conductor
    B: Los conductores de camiones tienen mejor visión nocturna
    C: Las luces altas pueden dañar los reflectores del camión
    D: La ley exige el uso de luces de estacionamiento únicamente
  answer: A
  explanation: Las luces brillantes que se reflejan en los grandes espejos laterales
    de un camión pueden cegar al conductor, dificultándole ver la carretera por delante.
- id: 171
  category: vehicle_information
  question: Según la ley de Delaware, ¿cuándo es obligatorio tener encendidas las
    luces delanteras?
  choices:
    A: Solo entre la medianoche y las 6:00 AM
    B: Siempre que use los limpiaparabrisas
    C: Solo al conducir por carreteras rurales sin iluminación
    D: Solo cuando la visibilidad sea inferior a 500 pies
  answer: B
  explanation: La ley de Delaware exige que las luces delanteras estén encendidas
    cuando se utilicen los limpiaparabrisas, desde el atardecer hasta el amanecer,
    o en cualquier momento en que la visibilidad sea inferior a 1,000 pies.
- id: 172
  category: vehicle_information
  question: 'Según la ley de Delaware, un neumático se considera inseguro si la banda
    de rodadura está desgastada a menos de:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: En Delaware, los neumáticos se consideran legalmente inseguros si la
    profundidad de la banda de rodadura es inferior a 2/32 de pulgada.
- id: 173
  category: vehicle_information
  question: ¿Cuál es el requisito de Delaware para la audibilidad de la bocina de
    un vehículo?
  choices:
    A: Debe escucharse desde al menos 100 pies de distancia
    B: Debe escucharse desde al menos 200 pies de distancia
    C: Debe escucharse desde al menos 500 pies de distancia
    D: Debe escucharse desde al menos 1,000 pies de distancia
  answer: B
  explanation: Todo vehículo motorizado en Delaware debe estar equipado con una bocina
    que pueda escucharse en condiciones normales desde una distancia de al menos 200
    pies.
- id: 174
  category: vehicle_information
  question: En Delaware, ¿cuántos pies antes de girar debe señalizar continuamente
    su intención de girar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: D
  explanation: La ley de Delaware exige que los conductores señalicen su intención
    de girar al menos 300 pies antes del giro.
- id: 175
  category: vehicle_information
  question: Con respecto al polarizado de ventanas en Delaware, ¿cuál de las siguientes
    afirmaciones es verdadera para las ventanas laterales delanteras?
  choices:
    A: Se permite cualquier nivel de oscuridad siempre que el conductor sea visible
    B: El polarizado de repuesto (aftermarket) está prohibido en las ventanas laterales
      delanteras sin una exención médica
    C: Se permite el polarizado hasta un 50% de transmisión de luz
    D: Solo se pueden polarizar las 4 pulgadas superiores de las ventanas laterales
      delanteras
  answer: B
  explanation: La ley de Delaware prohíbe el uso de polarizado de ventanas de repuesto
    (aftermarket) en las ventanas laterales delanteras y el parabrisas, a menos que
    el conductor tenga una exención médica específica.
- id: 176
  category: vehicle_information
  question: 'En Delaware, la placa de matrícula trasera de su vehículo debe estar
    iluminada para que sea legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La placa de matrícula trasera debe estar iluminada por una luz blanca
    para que sea claramente legible desde una distancia de 50 pies hacia atrás.
- id: 177
  category: vehicle_information
  question: ¿Cuál es la altura máxima permitida para el parachoques de un automóvil
    de pasajeros en Delaware?
  choices:
    A: 18 pulgadas
    B: 20 pulgadas
    C: 22 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: En Delaware, la altura máxima para los parachoques delantero y trasero
    en un automóvil de pasajeros es de 22 pulgadas desde el suelo.
- id: 178
  category: vehicle_information
  question: Según la ley de Delaware, ¿a los niños de cuál de las siguientes categorías
    se les prohíbe sentarse en el asiento del pasajero delantero de un vehículo equipado
    con una bolsa de aire (airbag) en el lado del pasajero?
  choices:
    A: Niños menores de 5 años o de menos de 40 libras
    B: Niños menores de 8 años o de menos de 50 pulgadas de altura
    C: Niños menores de 12 años o de menos de 65 pulgadas de altura
    D: Niños menores de 16 años o de menos de 100 libras
  answer: C
  explanation: La ley de Delaware establece que los niños menores de 12 años o de
    menos de 65 pulgadas de altura no deben ocupar el asiento del pasajero delantero
    de ningún vehículo equipado con una bolsa de aire (airbag) en el lado del pasajero.
- id: 179
  category: vehicle_information
  question: ¿Con qué frecuencia deben someterse a inspecciones de seguridad y emisiones
    la mayoría de los vehículos de más de siete años en Delaware?
  choices:
    A: Cada año
    B: Cada dos años
    C: Cada cinco años
    D: Solo cuando se transfiere el título
  answer: B
  explanation: En Delaware, los vehículos que no están exentos (generalmente aquellos
    con más de 7 años de antigüedad del modelo) deben ser inspeccionados cada dos
    años para seguridad y emisiones.
- id: 180
  category: vehicle_information
  question: ¿Cuál es la cobertura mínima de seguro de responsabilidad civil por daños
    a la propiedad requerida para un vehículo motorizado registrado en Delaware?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: B
  explanation: Los requisitos mínimos de seguro de responsabilidad civil de Delaware
    incluyen $10,000 por daños a la propiedad en cualquier accidente.
- id: 181
  category: vehicle_information
  question: ¿Cuál de los siguientes es un elemento de equipo prohibido para vehículos
    de pasajeros privados en Delaware?
  choices:
    A: Una luz roja visible desde la parte delantera del vehículo
    B: Un enganche para remolque
    C: Un asiento del conductor ajustable
    D: Una tercera luz de freno
  answer: A
  explanation: La ley de Delaware prohíbe que los vehículos privados estén equipados
    con una luz roja visible directamente desde la parte delantera central del mismo,
    ya que estas están reservadas para vehículos de emergencia.
- id: 182
  category: vehicle_information
  question: 'En Delaware, todo vehículo motorizado debe estar equipado con un espejo
    retrovisor que permita al conductor ver la carretera a una distancia de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: Delaware requiere al menos un espejo retrovisor que proporcione una
    visión de la carretera de al menos 200 pies hacia la parte trasera del vehículo.
- id: 183
  category: vehicle_information
  question: En Delaware, ¿cuál es la profundidad mínima legal de la banda de rodadura
    de los neumáticos para que un vehículo de pasajeros pase la inspección?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de Delaware exige que los neumáticos tengan una profundidad
    de banda de rodadura de al menos 2/32 de pulgada en todas las ranuras principales
    de la banda de rodadura.
- id: 184
  category: vehicle_information
  question: En Delaware, ¿a cuántos pies de distancia debe bajar sus luces altas (dim)
    cuando sigue a otro vehículo por detrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: Debe bajar sus luces altas cuando esté siguiendo a otro vehículo a
    menos de 200 pies para no causar deslumbramiento en el espejo retrovisor del conductor
    que va adelante.
- id: 185
  category: vehicle_information
  question: Según la ley de Delaware, ¿durante cuántos pies debe señalizar su intención
    de girar antes de realizar el giro real?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 300 pies
    D: Al menos 500 pies
  answer: C
  explanation: La ley de Delaware exige que los conductores señalen su intención de
    girar al menos 300 pies antes de realizar el giro.
- id: 186
  category: vehicle_information
  question: 'Todo vehículo motorizado que circule por las carreteras de Delaware debe
    estar equipado con una bocina que pueda oírse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las regulaciones de equipo de Delaware exigen una bocina en buen estado
    de funcionamiento capaz de emitir un sonido audible en condiciones normales desde
    una distancia no inferior a 200 pies.
- id: 187
  category: vehicle_information
  question: Los vehículos de pasajeros nuevos en Delaware generalmente están exentos
    de la inspección de seguridad y emisiones durante los primeros ____ años de vida
    del vehículo.
  choices:
    A: 2 años
    B: 3 años
    C: 5 años
    D: 7 años
  answer: D
  explanation: Delaware ofrece una exención de inspección de 7 años para vehículos
    de pasajeros nuevos, aunque los propietarios aún deben pagar las tarifas de registro
    correspondientes.
- id: 188
  category: vehicle_information
  question: 'En Delaware, si la visión trasera de su vehículo está obstruida por un
    remolque o carga, se requiere que tenga:'
  choices:
    A: Un pasajero que actúe como observador en todo momento
    B: Espejos tanto en el lado izquierdo como en el derecho del vehículo
    C: Un espejo retrovisor interior de gran angular
    D: Un sistema de cámara de reversa
  answer: B
  explanation: Si el espejo retrovisor interior no proporciona una visión clara hacia
    atrás (debido a una carga o remolque), la ley de Delaware exige espejos exteriores
    tanto a la izquierda como a la derecha.
- id: 189
  category: vehicle_information
  question: 'La ley de Delaware exige que el freno de estacionamiento de un vehículo
    debe ser capaz de mantener el vehículo:'
  choices:
    A: Solo en superficies planas
    B: En cualquier pendiente (colina) en la que se opere
    C: Solo cuando el vehículo tiene una marcha puesta
    D: Durante al menos 10 minutos
  answer: B
  explanation: El freno de estacionamiento debe ser adecuado para mantener el vehículo
    en cualquier pendiente en la que se opere, independientemente de la carga.
- id: 190
  category: vehicle_information
  question: ¿En qué condados de Delaware se requiere la prueba de emisiones como parte
    del proceso de inspección del vehículo?
  choices:
    A: Solo en el condado de New Castle
    B: En los condados de New Castle y Kent
    C: En los condados de Kent y Sussex
    D: En los tres condados (New Castle, Kent y Sussex)
  answer: B
  explanation: Las pruebas de emisiones son obligatorias para los vehículos registrados
    en el condado de New Castle y el condado de Kent. El condado de Sussex actualmente
    solo requiere inspecciones de seguridad para vehículos más antiguos.
- id: 191
  category: vehicle_information
  question: ¿A excepción de los vehículos de emergencia, la ley de Delaware prohíbe
    el uso de qué color de luz visible directamente desde el frente del centro del
    vehículo?
  choices:
    A: Blanco
    B: Ámbar
    C: Rojo
    D: Amarillo
  answer: C
  explanation: La ley de Delaware prohíbe que cualquier vehículo que no sea un vehículo
    de emergencia autorizado muestre una luz roja visible directamente desde el frente
    del centro del mismo.
- id: 192
  category: vehicle_information
  question: 'Todo vehículo motorizado en Delaware debe estar equipado con al menos
    dos luces traseras en la parte posterior que emitan una luz roja claramente visible
    desde una distancia de:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Las luces traseras deben ser rojas y deben ser visibles desde una distancia
    de 500 pies hacia atrás bajo condiciones atmosféricas normales.
- id: 193
  category: vehicle_information
  question: ¿Dónde debe colocarse la calcomanía (etiqueta) de vencimiento del registro
    en una placa de matrícula de Delaware?
  choices:
    A: En la esquina superior izquierda
    B: En la esquina superior derecha
    C: En la esquina inferior izquierda
    D: En la esquina inferior derecha
  answer: D
  explanation: En Delaware, la calcomanía de validación que muestra la fecha de vencimiento
    debe colocarse en la esquina inferior derecha de la placa de matrícula.
- id: 194
  category: signs_and_signals
  question: En Delaware, ¿qué debe hacer antes de girar a la derecha con luz roja?
  choices:
    A: Reducir la velocidad y girar si no viene tráfico
    B: Hacer una parada completa y ceder el paso al tráfico y a los peatones
    C: Nunca se permite girar a la derecha en rojo en Delaware
    D: Esperar a que la luz cambie a verde
  answer: B
  explanation: Según el Manual del Conductor de Delaware, usted puede girar a la derecha
    en rojo después de hacer una parada completa y ceder el paso a todo el tráfico
    y peatones, siempre que no haya una señal que prohíba el giro.
- id: 195
  category: signs_and_signals
  question: Según la ley de Delaware, ¿cuándo se permite un giro a la izquierda con
    luz roja?
  choices:
    A: Nunca
    B: Desde una calle de doble sentido hacia una calle de un solo sentido
    C: Desde una calle de un solo sentido hacia otra calle de un solo sentido
    D: Solo durante situaciones de emergencia
  answer: C
  explanation: En Delaware, un giro a la izquierda en rojo solo se permite al girar
    desde una calle de un solo sentido hacia otra calle de un solo sentido después
    de una parada completa y ceder el paso al tráfico.
- id: 196
  category: signs_and_signals
  question: 'Una luz roja intermitente en una intersección en Delaware significa:'
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: La señal está averiada; trátela como una parada de cuatro vías
    C: Detenerse por completo y avanzar solo cuando sea seguro hacerlo
    D: Ceder el paso al tráfico de la derecha únicamente
  answer: C
  explanation: Una luz roja intermitente tiene el mismo significado que una señal
    de alto (STOP). Debe detenerse por completo y avanzar cuando sea seguro.
- id: 197
  category: signs_and_signals
  question: ¿Qué indica una luz amarilla intermitente a un conductor de Delaware?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: La luz está a punto de cambiar a rojo
    C: Proceder con precaución
    D: Ceder el paso a todos los peatones pero no a otros vehículos
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y proceder con precaución, manteniéndose alerta ante posibles peligros.
- id: 198
  category: signs_and_signals
  question: 'En Delaware, una luz amarilla fija significa:'
  choices:
    A: Acelerar para despejar la intersección antes de la luz roja
    B: La señal está cambiando a rojo y debe detenerse si es seguro hacerlo
    C: Usted tiene el derecho de paso sobre el tráfico que gira
    D: Detenerse inmediatamente, incluso si está en medio de la intersección
  answer: B
  explanation: Una luz amarilla fija indica que la señal está a punto de cambiar a
    rojo. Los conductores deben detenerse si pueden hacerlo de manera segura; de lo
    contrario, deben despejar la intersección.
- id: 199
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal en forma de banderín (pennant) colocada
    en el lado izquierdo de la carretera en Delaware?
  choices:
    A: Zona escolar
    B: Zona de no rebasar (No Passing Zone)
    C: Ceder el paso
    D: Cruce de ferrocarril
  answer: B
  explanation: Una señal en forma de banderín se utiliza específicamente para marcar
    el inicio de una 'Zona de no rebasar' y se coloca en el lado izquierdo de la carretera
    para que sea visible para los conductores que intentan rebasar.
- id: 200
  category: signs_and_signals
  question: En Delaware, ¿qué indican los símbolos blancos de 'sharrow' (una bicicleta
    con dos galones) en un carril?
  choices:
    A: El carril está reservado solo para bicicletas
    B: No se permiten bicicletas en este carril
    C: Los automovilistas deben esperar que las bicicletas ocupen todo el carril de
      circulación
    D: Las bicicletas deben permanecer en el acotamiento
  answer: C
  explanation: Las marcas de carril compartido (sharrows) alertan a los automovilistas
    que los ciclistas pueden estar en el carril de circulación y ayudan a los ciclistas
    a posicionarse de manera segura lejos de los autos estacionados.
- id: 201
  category: signs_and_signals
  question: 'Cuando un conductor de Delaware extiende su brazo y mano izquierdos directamente
    hacia afuera por la ventana, está señalando:'
  choices:
    A: Un giro a la derecha
    B: Un giro a la izquierda
    C: Una parada o disminución de la velocidad
    D: Una emergencia
  answer: B
  explanation: La señal manual estándar para un giro a la izquierda es el brazo y
    la mano izquierdos extendidos horizontalmente hacia afuera.
- id: 202
  category: signs_and_signals
  question: ¿Qué indica una señal de forma redonda en Delaware?
  choices:
    A: Ceda el paso (Yield)
    B: Pare (Stop)
    C: Cruce de ferrocarril más adelante
    D: Hospital cercano
  answer: C
  explanation: Una señal circular (redonda) se utiliza exclusivamente para advertir
    a los conductores que se aproximan a un cruce de ferrocarril.
- id: 203
  category: signs_and_signals
  question: ¿En Delaware, cuál es la sanción civil por una infracción de primera vez
    captada por una cámara de semáforo en rojo?
  choices:
    A: $25.00
    B: $75.00
    C: $112.50
    D: $250.00
  answer: C
  explanation: El Manual del Conductor de Delaware especifica que la sanción civil
    por una infracción de cámara de semáforo en rojo es de $112.50.
- id: 204
  category: signs_and_signals
  question: ¿Qué significa una línea blanca continua entre dos carriles de tráfico
    que se mueven en la misma dirección en Delaware?
  choices:
    A: Puede cruzarla en cualquier momento
    B: Separa el tráfico que se mueve en direcciones opuestas
    C: Se desaconseja el cambio de carril
    D: El carril es solo para vehículos HOV (vehículos con alta ocupación)
  answer: C
  explanation: Una línea blanca continua indica que los conductores deben permanecer
    en su carril y que se desaconseja el cambio de carril debido a posibles peligros.
- id: 205
  category: signs_and_signals
  question: ¿De qué color son las señales de 'Gestión de Incidentes' (Incident Management)
    de Delaware, utilizadas para el control temporal del tráfico durante emergencias?
  choices:
    A: Naranja
    B: Rosa fluorescente
    C: Amarillo-verde fluorescente
    D: Rojo brillante
  answer: B
  explanation: Las señales de color rosa fluorescente se utilizan en Delaware para
    la gestión de incidentes con el fin de advertir sobre situaciones de emergencia
    temporales, como choques o incendios.
- id: 206
  category: signs_and_signals
  question: 'Si está señalizando una parada mediante señales manuales, su brazo debe
    estar:'
  choices:
    A: Extendido hacia afuera
    B: Doblado hacia arriba en un ángulo de 90 grados
    C: Doblado hacia abajo en un ángulo de 90 grados
    D: Agitándose de arriba abajo
  answer: C
  explanation: Para señalizar una parada o disminución de la velocidad mediante señales
    manuales, el brazo y la mano izquierdos deben extenderse hacia abajo en un ángulo
    de 90 grados.
- id: 207
  category: signs_and_signals
  question: En Delaware, ¿qué significa una señal de flecha roja fija?
  choices:
    A: Puede girar con precaución en la dirección de la flecha después de detenerse.
    B: Debe detenerse y no puede girar en la dirección de la flecha.
    C: Puede girar solo si no hay tráfico en sentido contrario.
    D: La señal está a punto de cambiar a verde.
  answer: B
  explanation: Según el Manual del Conductor de Delaware, una flecha roja fija significa
    que debe detenerse y no puede girar en la dirección de la flecha. Debe esperar
    a que la señal cambie a una flecha verde o luz verde.
- id: 208
  category: signs_and_signals
  question: Según la ley de Delaware, ¿cuándo se le permite realizar un giro a la
    izquierda con luz roja?
  choices:
    A: Nunca
    B: Desde una calle de sentido único hacia otra calle de sentido único después
      de una parada completa.
    C: Desde una calle de doble sentido hacia una calle de sentido único.
    D: En cualquier momento que no haya tráfico cruzado.
  answer: B
  explanation: La ley de Delaware permite un giro a la izquierda en rojo solo cuando
    se gira desde una calle de sentido único hacia otra calle de sentido único, siempre
    que el conductor se detenga por completo y ceda el paso al tráfico y a los peatones.
- id: 209
  category: signs_and_signals
  question: 'En Delaware, una luz amarilla intermitente en una intersección significa
    que usted debe:'
  choices:
    A: Detenerse y esperar a que la luz cambie a verde.
    B: Aumentar la velocidad para despejar la intersección rápidamente.
    C: Reducir la velocidad y proceder con precaución.
    D: Tratarla como una parada de cuatro vías (four-way stop).
  answer: C
  explanation: Una luz amarilla intermitente indica que debe reducir la velocidad
    y estar especialmente alerta mientras atraviesa la intersección con precaución.
- id: 210
  category: signs_and_signals
  question: ¿Qué indica una 'X roja' (Red X) mostrada sobre un carril reversible en
    Delaware?
  choices:
    A: El carril está reservado solo para vehículos de emergencia.
    B: El carril está a punto de cambiar de dirección.
    C: No se le permite usar el carril.
    D: Debe salir de la autopista inmediatamente.
  answer: C
  explanation: En Delaware, se utilizan señales elevadas para los carriles reversibles.
    Una 'X roja' significa que el carril está cerrado al tráfico que se mueve en su
    dirección.
- id: 211
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para indicar un giro a la derecha en
    Delaware?
  choices:
    A: Brazo izquierdo extendido hacia afuera de la ventana.
    B: Brazo izquierdo extendido hacia arriba fuera de la ventana.
    C: Brazo izquierdo extendido hacia abajo fuera de la ventana.
    D: Brazo derecho extendido hacia afuera de la ventana.
  answer: B
  explanation: Para señalar un giro a la derecha mediante señales manuales, el conductor
    debe extender el brazo izquierdo por la ventana y doblarlo hacia arriba a la altura
    del codo.
- id: 212
  category: signs_and_signals
  question: En Delaware, ¿qué significan las líneas amarillas dobles continuas en
    el centro de la carretera?
  choices:
    A: Se permite adelantar desde cualquier lado.
    B: Se permite adelantar solo por la derecha.
    C: Está prohibido adelantar en ambas direcciones.
    D: La carretera es de un solo sentido.
  answer: C
  explanation: Las líneas amarillas dobles continuas indican que no se permite adelantar
    a los vehículos que circulan en ninguna de las dos direcciones.
- id: 213
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de tráfico con "luz roja intermitente"
    en Delaware?
  choices:
    A: Reduzca la velocidad y prepárese para detenerse.
    B: La señal está averiada; proceda con precaución.
    C: Lo mismo que una señal de alto; deténgase por completo y ceda el paso antes
      de continuar.
    D: Ceda el paso al tráfico que viene en sentido contrario pero no se detenga.
  answer: C
  explanation: Una luz roja intermitente significa lo mismo que una señal de alto.
    Debe detenerse por completo y ceder el paso a cualquier vehículo o peatón en la
    intersección antes de continuar.
- id: 214
  category: signs_and_signals
  question: En Delaware, ¿qué indica un símbolo de diamante blanco pintado en el pavimento?
  choices:
    A: Hay un cruce de peatones más adelante.
    B: El carril está reservado para vehículos específicos como autobuses o vehículos
      de alta ocupación (HOV).
    C: Hay un cruce de ferrocarril más adelante.
    D: El carril es solo para paradas de emergencia.
  answer: B
  explanation: El símbolo del diamante en el pavimento indica un carril restringido,
    como un carril para vehículos de alta ocupación (HOV) o un carril para autobuses.
- id: 215
  category: signs_and_signals
  question: ¿Qué significan las líneas blancas discontinuas en el pavimento en Delaware?
  choices:
    A: Separan carriles de tráfico que se mueven en direcciones opuestas.
    B: Indican el borde de la calzada.
    C: Separan carriles de tráfico que se mueven en la misma dirección.
    D: Indican una zona de "no adelantar".
  answer: C
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección. Puede cruzar estas líneas para cambiar de carril
    si es seguro hacerlo.
- id: 216
  category: signs_and_signals
  question: ¿Qué indica una línea blanca continua en el borde derecho de la carretera?
  choices:
    A: Un carril para vehículos de movimiento lento.
    B: El borde del carril de circulación (línea de niebla).
    C: Un carril exclusivo para bicicletas.
    D: Una zona donde se permite adelantar.
  answer: B
  explanation: Una línea blanca continua a lo largo del lado de la carretera marca
    el borde del carril de circulación y a menudo se denomina línea de niebla.
- id: 217
  category: signs_and_signals
  question: En Delaware, ¿cuál es el significado de una luz de tráfico "amarilla fija"?
  choices:
    A: Deténgase inmediatamente, incluso si está en la intersección.
    B: La señal está cambiando a rojo; despeje la intersección.
    C: Puede entrar en la intersección si acelera.
    D: La señal está cambiando a verde.
  answer: B
  explanation: Una luz amarilla fija significa que la señal está cambiando de verde
    a rojo. Le advierte que despeje la intersección o que se detenga si puede hacerlo
    de manera segura.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Haga un alto total
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, en el cruce de peatones o antes de entrar
    en la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 218
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Haga un alto total
    B: Acelere para incorporarse al tráfico
    C: Reduzca la velocidad y ceda el paso al tráfico y a los peatones
    D: Continúe sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen con seguridad.
  id: 219
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta carretera
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRE (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar le pondría en el camino del tráfico que viene en sentido contrario.
  id: 220
- image: wrong_way.png
  category: signs_and_signals
  question: ¿Qué debe hacer si ve esta señal?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está circulando en contra del tráfico en una calle de un solo sentido o en
    una rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 221
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Mantenerse a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 222
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 223
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 224
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 225
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal amarilla con letras negras en forma de banderín de ZONA DE
    NO REBASAR (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos
    en esta área. Marca el inicio de una zona donde está prohibido adelantar.
  id: 226
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse al lado derecho de una isla de tráfico,
    mediana u obstrucción.
  id: 227
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 228
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 229
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de caminata cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 230
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal fluorescente de color amarillo verdoso en forma de pentágono
    (5 lados) indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté
    atento a los niños.
  id: 231
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta (roundabout) más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 232
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima un
    tren, debe detenerse.
  id: 233
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 234
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 235
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera curve primero
    hacia un lado y luego hacia el otro.
  id: 236
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 237
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación (merge) en forma de diamante advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 238
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 239
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 240
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Esté preparado para
    el tráfico de doble sentido.
  id: 241
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: Tráfico de doble sentido más adelante — el tráfico se mueve en ambas direcciones
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una calle de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 242
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 243
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina empinada o pendiente más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina empinada o pendiente más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 244
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 245
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 246
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las calles laterales.
  id: 247
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una calle lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la carretera desde la calle lateral.
  id: 248
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril — no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir incorporación. El tráfico que entra desde la rampa tiene
    su propio carril nuevo.
  id: 249
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer de pie o al ralentí
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 250
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 251
