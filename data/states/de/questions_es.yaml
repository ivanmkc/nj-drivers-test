questions:
- id: 1
  category: driver_responsibility
  question: 'Según el mensaje del Gobernador en el manual del conductor de Delaware,
    conducir se considera:'
  choices:
    A: Un derecho constitucional
    B: Un privilegio, no un derecho
    C: Un derecho absoluto para residentes mayores de 18 años
    D: Un derecho federal
  answer: B
  explanation: 'El mensaje del Gobernador establece explícitamente: "Estúdielo, tómelo
    en serio y recuerde: conducir es un privilegio, no un derecho".'
- id: 2
  category: safe_driving_rules
  question: 'Según el manual, la conducción segura implica todo lo siguiente, EXCEPTO:'
  choices:
    A: Mantenerse concentrado
    B: Evitar distracciones
    C: Respetar los límites de velocidad
    D: Confiar únicamente en sus habilidades de conducción
  answer: D
  explanation: El manual establece que la conducción segura "no se trata solo de aprobar
    un examen; se trata de mantenerse concentrado, evitar distracciones, seguir los
    límites de velocidad y nunca conducir bajo la influencia". Señala que los mejores
    conductores entienden que respetar la carretera es tan importante como transitar
    por ella.
- id: 3
  category: driver_responsibility
  question: 'Para ayudar a proteger el medio ambiente y garantizar un Delaware más
    ecológico, el manual sugiere que los conductores consideren:'
  choices:
    A: Conducir más rápido para reducir el tiempo en la carretera
    B: Compartir el vehículo (carpooling), consolidar viajes o usar el transporte
      público
    C: Conducir únicamente por autopistas interestatales
    D: Comprar un vehículo más grande
  answer: B
  explanation: 'El mensaje del Gobernador aconseja a los conductores: "Considere compartir
    el vehículo, consolidar viajes o usar el transporte público para ayudar a proteger
    nuestro medio ambiente y garantizar un Delaware más ecológico para las generaciones
    futuras".'
- id: 4
  category: sharing_the_road
  question: 'La División de Vehículos Motorizados de Delaware alienta a todos los
    automovilistas a compartir las vías de una manera que sea:'
  choices:
    A: Cuidadosa, cortés, sobria y defensiva
    B: Agresiva pero segura
    C: Rápida y eficiente
    D: Competitiva y alerta
  answer: A
  explanation: 'El mensaje del DMV establece: "Alentamos a todos los automovilistas
    a compartir las vías de manera cuidadosa, cortés, sobria y defensiva..."'
- id: 5
  category: license_system
  question: ¿A dónde deben dirigirse las correcciones, sugerencias o recomendaciones
    con respecto al manual del conductor?
  choices:
    A: La Oficina del Gobernador
    B: El Secretario de Transporte
    C: Jefe de Servicios al Conductor (Chief of Driver Services)
    D: El Director de la División de Vehículos Motorizados
  answer: C
  explanation: El manual señala que las correcciones, sugerencias o recomendaciones
    pueden dirigirse al "Chief of Driver Services, Delaware Division of Motor Vehicles,
    P.O. Box 698, Dover, DE 19903".
- id: 6
  category: license_system
  question: ¿Cuál de las siguientes se enumera como una clasificación específica de
    licencia de conducir en el índice del manual de Delaware?
  choices:
    A: Licencia de Operador Clase E
    B: Licencia de Operador Clase D
    C: Licencia de Operador Clase F
    D: Licencia de Operador Clase Z
  answer: B
  explanation: El índice, bajo "DRIVER LICENSE CLASSIFICATIONS" (Clasificaciones de
    Licencia de Conducir), enumera la "Licencia de Operador Clase D".
- id: 7
  category: license_system
  question: Según el índice, ¿cuál de los siguientes registros está asociado con la
    información de la licencia de conducir?
  choices:
    A: Registro de Propiedad de Mascotas
    B: Registro de Parientes Cercanos (Next Of Kin Registry)
    C: Registro Nacional de Armas de Fuego
    D: Registro de Propiedad Estatal
  answer: B
  explanation: El "Next Of Kin Registry" (Registro de Parientes Cercanos) aparece
    en el índice bajo la sección de INFORMACIÓN ADICIONAL.
- id: 8
  category: license_system
  question: ¿Qué indicador específico se puede colocar en una licencia de conducir
    o tarjeta de identificación de Delaware según el índice del manual?
  choices:
    A: Indicador de ingresos
    B: Indicador de educación
    C: Indicador de veterano
    D: Indicador de empleo
  answer: C
  explanation: El índice incluye una sección titulada "Veteran indicator on Driver
    License/Identification Card" (Indicador de veterano en la licencia de conducir/tarjeta
    de identificación) bajo INFORMACIÓN ADICIONAL.
- id: 9
  category: license_system
  question: ¿A qué ley sobre delincuentes sexuales se hace referencia específicamente
    en el índice?
  choices:
    A: Ley de Jessica (Jessica's Law)
    B: Ley de Megan (Megan’s Law)
    C: Ley de Amber (Amber's Law)
    D: La Ley Adam Walsh
  answer: B
  explanation: El índice enumera "Megan’s Law/Sex Offenders" (Ley de Megan/Delincuentes
    Sexuales) bajo la sección de INFORMACIÓN ADICIONAL.
- id: 10
  category: license_system
  question: El manual contiene información sobre la divulgación obligatoria de ¿qué
    detalle personal?
  choices:
    A: Números de Seguro Social
    B: Números de cuentas bancarias
    C: Números de pasaporte
    D: Historial médico
  answer: A
  explanation: El índice enumera "Mandatory Disclosure Of Social Security Numbers"
    (Divulgación obligatoria de los números de Seguro Social) en la sección de INFORMACIÓN
    ADICIONAL.
- id: 11
  category: license_system
  question: ¿Qué significan las siglas "CLP" en la sección de clasificaciones de licencias
    de conducir?
  choices:
    A: Profesional Licenciado Certificado
    B: Permiso de Aprendizaje Comercial (Commercial Learner’s Permit)
    C: Permiso de Licencia de Clase
    D: Programa de Aprendizaje Condicional
  answer: B
  explanation: Bajo la sección de CLASIFICACIONES DE LICENCIAS DE CONDUCIR, el Índice
    enumera el "Permiso de Aprendizaje Comercial (CLP)".
- id: 12
  category: license_system
  question: ¿Cuál de los siguientes programas aparece en la sección de Información
    Adicional del manual?
  choices:
    A: Programa Adopt-A-Highway (Adopte una Carretera)
    B: Programa de Donación de Órganos y Tejidos
    C: Programa de Rutas Seguras a la Escuela
    D: Programa de Dinero por Vehículos Viejos (Cash for Clunkers)
  answer: B
  explanation: El "Programa de Donación de Órganos y Tejidos" aparece explícitamente
    en el Índice bajo la sección de INFORMACIÓN ADICIONAL.
- id: 13
  category: license_system
  question: Según el Índice, ¿en qué sistema pueden encontrar los solicitantes información
    sobre el registro?
  choices:
    A: Sistema de Servicio Selectivo (Selective Service System)
    B: Sistema de Milicia Estatal
    C: Sistema de la Reserva Federal
    D: Sistema de la Guardia Nacional
  answer: A
  explanation: El Índice incluye una sección para el "Registro en el Sistema de Servicio
    Selectivo" bajo INFORMACIÓN ADICIONAL.
- id: 14
  category: license_system
  question: ¿Qué tarjeta específica se menciona como una opción en la sección de Requisitos
    Generales para las personas que solicitan privilegios de conducción?
  choices:
    A: Tarjeta de Privilegio de Conducción (Driving Privilege Card)
    B: Tarjeta de Tránsito Condicional
    C: Tarjeta de Movilidad Restringida
    D: Tarjeta de Viaje Provisional
  answer: A
  explanation: El Índice enumera los "Requisitos de la Tarjeta de Privilegio de Conducción"
    y "¿Cómo obtengo una Tarjeta de Privilegio de Conducción?" bajo la sección de
    REQUISITOS GENERALES.
- id: 15
  category: driver_responsibility
  question: 'El Índice enumera una sección sobre TAT, que representa una iniciativa
    relacionada con:'
  choices:
    A: Seguimiento de Accidentes de Tráfico
    B: Peajes y Tránsito
    C: Trata de Personas (Human Trafficking)
    D: Pruebas de Alcohol para Adolescentes
  answer: C
  explanation: El Índice enumera "TAT- Trata de Personas" bajo la sección de INFORMACIÓN
    ADICIONAL.
- id: 16
  category: license_system
  question: ¿Cuál de los siguientes se clasifica como un endoso (endorsement) específico
    en una licencia de conducir de Delaware?
  choices:
    A: Licencia de Conducir Graduada
    B: Licencia Temporal
    C: Autobús Escolar
    D: Permiso de Aprendizaje Clase D
  answer: C
  explanation: Según la sección de endosos del manual, la designación de Autobús Escolar
    se clasifica como un endoso, junto con Motocicleta y Taxi/Limusina.
- id: 17
  category: driver_testing
  question: El Examen de Conducir de Delaware incluye una Prueba de Carretera, una
    Prueba de las Reglas de la Carretera, una Prueba de Señales y Semáforos, y ¿qué
    otra evaluación?
  choices:
    A: Evaluación de Audición
    B: Evaluación de la Vista
    C: Evaluación de Reflejos
    D: Evaluación de Renuncia Médica
  answer: B
  explanation: La sección de Examen del Conductor enumera la Evaluación de la Vista
    junto con la Prueba de Señales y Semáforos, la Prueba de las Reglas de la Carretera
    y la Prueba de Carretera.
- id: 18
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones no relacionadas con la conducción
    se menciona como un motivo potencial para la suspensión de una licencia de conducir?
  choices:
    A: Violaciones por ruido
    B: Morosidad en la Manutención Infantil (Child Support Delinquency)
    C: Ausentismo escolar injustificado
    D: Arrojar basura
  answer: B
  explanation: Bajo la sección de 'Revocación y Suspensión de la Licencia', la 'Morosidad
    en la Manutención Infantil' se enumera explícitamente como una causa para tomar
    medidas contra una licencia de conducir.
- id: 19
  category: penalties_and_points
  question: ¿Bajo qué programa se administran el Sistema de Puntos de Delaware y el
    Crédito de Puntos?
  choices:
    A: Programa de Mejoramiento del Conductor con Problemas (Driver Improvement Problem
      Driver Program)
    B: Programa de Dispositivo de Interbloqueo de Encendido
    C: Programa de Licencia de Conducir Graduada
    D: Programa de Consentimiento Implícito
  answer: A
  explanation: El Sistema de Puntos de Delaware y el Crédito de Puntos son subsecciones
    del Programa de Mejoramiento del Conductor con Problemas.
- id: 20
  category: alcohol_drugs_health
  question: Según la sección de Conducción con Facultades Alteradas (Impaired Driving),
    ¿cuál de los siguientes se categoriza junto con la conducción distraída y bajo
    los efectos del alcohol como una alteración?
  choices:
    A: Conducción Agresiva
    B: Conducir con Somnolencia (Drowsy Driving)
    C: Exceso de Velocidad Grave
    D: Reincidencia Habitual
  answer: B
  explanation: '''Conducir con Somnolencia'' y ''Conducción Distraída'' se enumeran
    específicamente bajo la sección de ''Conducción con Facultades Alteradas'' del
    manual.'
- id: 21
  category: alcohol_drugs_health
  question: ¿La ley de Delaware describe sanciones y procedimientos específicos para
    Conducir Bajo la Influencia (DUI) hasta qué infracción?
  choices:
    A: Tercera infracción
    B: Cuarta infracción
    C: Quinta infracción
    D: Séptima infracción
  answer: D
  explanation: El manual describe sanciones específicas por DUI para infracciones
    secuenciales, hasta la 'Séptima infracción'.
- id: 22
  category: alcohol_drugs_health
  question: ¿Qué programa está disponible para una Elección de Primera Infracción
    (FOE) con respecto a un DUI?
  choices:
    A: Programa de Crédito de Puntos
    B: Programa de Dispositivo de Bloqueo de Encendido (IID)
    C: Programa de Infractor Habitual
    D: Programa de Renuncia Médica
  answer: B
  explanation: El manual enumera el 'Programa de Dispositivo de Bloqueo de Encendido
    (IID) para la Elección de Primera Infracción (FOE)' bajo las sanciones por DUI.
- id: 23
  category: alcohol_drugs_health
  question: ¿Qué ley se enumera específicamente bajo las Leyes de Delaware sobre Beber
    y Conducir junto con la Ley de Consentimiento Implícito?
  choices:
    A: Ley de Tolerancia Cero
    B: Ley del Sistema de Puntos
    C: Ley de Conducción Agresiva
    D: Ley de Revocación Obligatoria
  answer: A
  explanation: La 'Ley de Tolerancia Cero' se enumera directamente en la sección de
    Leyes de Delaware sobre Beber y Conducir, junto con la Ley de Consentimiento Implícito.
- id: 24
  category: vehicle_information
  question: ¿En qué tres grupos principales clasifica la Sección Tres del manual el
    equipo de los vehículos motorizados?
  choices:
    A: Equipo Requerido, Adicional y Prohibido
    B: Equipo Estándar, de Lujo y Opcional
    C: Equipo Interior, Exterior y del Motor
    D: Equipo de Seguridad, Cosmético y de Rendimiento
  answer: A
  explanation: La sección de Equipo de Vehículos Motorizados se divide en 'Equipo
    Requerido', 'Equipo Adicional' y 'Equipo Prohibido'.
- id: 25
  category: driver_responsibility
  question: ¿Cómo aborda el manual del conductor de Delaware las condiciones médicas
    que pueden afectar la conducción?
  choices:
    A: Requiere que los conductores esperen el informe de un médico
    B: Incluye una política de Autoinforme de Condiciones Médicas
    C: Establece que las condiciones médicas están exentas de ser informadas
    D: Solo requiere informes para conductores comerciales
  answer: B
  explanation: La sección de Información e Informes Médicos incluye una subsección
    específica para el 'Autoinforme de Condiciones Médicas'.
- id: 26
  category: penalties_and_points
  question: ¿Cuál de los siguientes comportamientos de conducción se aborda específicamente
    con su propia subsección bajo el Programa de Mejora del Conductor para Conductores
    con Problemas?
  choices:
    A: Seguir muy de cerca (Tailgating)
    B: Conducción Agresiva
    C: No ceder el paso
    D: Rebase inadecuado
  answer: B
  explanation: La 'Conducción Agresiva' se enumera explícitamente como un tema bajo
    el Programa de Mejora del Conductor para Conductores con Problemas.
- id: 27
  category: driver_testing
  question: Durante la parte del Examen de Manejo del Examen del Conductor, ¿qué se
    requiere explícitamente según los encabezados del manual?
  choices:
    A: Un vehículo motorizado para ser conducido durante el examen de manejo
    B: Un vehículo de instrucción de doble control
    C: Un instructor de manejo certificado
    D: Un vehículo con menos de 5 años de antigüedad
  answer: A
  explanation: El manual incluye una sección específica titulada 'Vehículo motorizado
    para ser conducido durante el examen de manejo' bajo los requisitos del Examen
    del Conductor.
- id: 28
  category: penalties_and_points
  question: ¿Qué tipo de revocación se enumera para los conductores que cometen repetidamente
    infracciones de tráfico graves?
  choices:
    A: Revocación de Crédito de Puntos
    B: Revocación de Infractor Habitual
    C: Revocación de Tolerancia Cero
    D: Revocación de Consentimiento Implícito
  answer: B
  explanation: La 'Revocación de Infractor Habitual' se enumera en la sección de Revocación
    y Suspensión de Licencia para infractores reincidentes.
- id: 29
  category: license_system
  question: Si se suspende la licencia de un conductor, ¿para qué tipo de licencia
    podría ser elegible según el manual?
  choices:
    A: Licencia Clase D
    B: Licencia Ocupacional
    C: Endoso de Taxi/Limusina
    D: Permiso de Aprendiz Temporal
  answer: B
  explanation: El manual enumera la 'Licencia Ocupacional' bajo el Programa de Mejora
    del Conductor para Conductores con Problemas, que generalmente se usa para conducir
    durante una suspensión. También se enumera bajo 'Licencias Condicionales, Ocupacionales
    y por Dificultades Económicas'.
- id: 30
  category: vehicle_information
  question: ¿Cuál de las siguientes prácticas de seguridad se cubre específicamente
    en la sección de Equipo de Vehículos Motorizados?
  choices:
    A: Uso de cinturones de seguridad y sistemas de retención infantil
    B: Ajustar los espejos antes de conducir
    C: Revisar la presión de los neumáticos mensualmente
    D: Usar las señales de giro
  answer: A
  explanation: '''Uso de cinturones de seguridad y sistemas de retención infantil''
    se enumera explícitamente como un tema bajo la sección de Equipo de Vehículos
    Motorizados.'
- id: 31
  category: safe_driving_rules
  question: Bajo la Ley de "Moverse a un lado" (Move Over Law) de Delaware, ¿qué debe
    hacer un conductor al acercarse a un vehículo de emergencia estacionado con sus
    luces intermitentes encendidas?
  choices:
    A: Mantener la velocidad y permanecer en el carril actual
    B: Detenerse inmediatamente hasta que el vehículo de emergencia se retire
    C: Ceder el derecho de paso cambiando a un carril que no sea adyacente al vehículo,
      o reducir la velocidad a un nivel seguro si cambiar de carril no es seguro
    D: Tocar la bocina para alertar a los trabajadores de emergencia de su presencia
  answer: C
  explanation: La Ley de "Moverse a un lado" (Move Over Law) exige que los conductores
    que se aproximen a vehículos de emergencia estacionados con luces intermitentes
    se muevan a un carril no adyacente si es posible, o que reduzcan significativamente
    la velocidad si no se puede realizar un cambio de carril de manera segura.
- id: 32
  category: safe_driving_rules
  question: ¿Cuál es la restricción con respecto al uso del teléfono celular mientras
    se conduce en Delaware?
  choices:
    A: Los conductores pueden usar teléfonos de mano solo cuando están detenidos en
      un semáforo en rojo
    B: El uso de teléfonos celulares de mano y dispositivos electrónicos mientras
      se conduce está estrictamente prohibido
    C: Los conductores pueden enviar mensajes de texto pero no pueden realizar llamadas
      de voz
    D: Solo a los conductores menores de 18 años se les prohíbe el uso de teléfonos
      celulares de mano
  answer: B
  explanation: La ley de Delaware prohíbe el uso de teléfonos celulares de mano y
    otros dispositivos electrónicos portátiles mientras se opera un vehículo motorizado.
- id: 33
  category: safe_driving_rules
  question: ¿Cuándo se requiere que usted se detenga ante un autobús escolar con sus
    luces rojas intermitentes encendidas?
  choices:
    A: Solo cuando viaja en la misma dirección que el autobús
    B: Solo si hay niños cruzando activamente la calle
    C: Al acercarse desde cualquier dirección en una carretera de dos carriles, o
      desde la misma dirección en una carretera de varios carriles
    D: Nunca se requiere que se detenga, pero debe reducir la velocidad a 15 mph
  answer: C
  explanation: Los conductores deben detenerse ante un autobús escolar con luces rojas
    intermitentes cuando viajan en la misma dirección, o desde cualquier dirección
    en una carretera de dos carriles. No es necesario detenerse si se viaja en la
    dirección opuesta en una carretera de cuatro o más carriles.
- id: 34
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad estándar
    en un distrito residencial en Delaware?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: El límite de velocidad general en un distrito residencial o comercial
    en Delaware es de 25 mph, a menos que se indique lo contrario.
- id: 35
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso en una rotonda?
  choices:
    A: Los vehículos que entran a la rotonda
    B: Los vehículos que ya están circulando dentro de la rotonda
    C: Los vehículos más grandes, como camiones y autobuses
    D: Los vehículos que se aproximan por la derecha
  answer: B
  explanation: Al acercarse a una rotonda, los conductores deben ceder el derecho
    de paso al tráfico que ya está circulando dentro de la rotonda.
- id: 36
  category: safe_driving_rules
  question: ¿Cuál es el propósito de un carril central compartido?
  choices:
    A: Se utiliza para rebasar vehículos más lentos
    B: Es un carril designado solo para vehículos de emergencia
    C: Está reservado para realizar giros a la izquierda por vehículos que viajan
      en cualquier dirección
    D: Se utiliza como carril de estacionamiento durante las horas no pico
  answer: C
  explanation: Un carril central compartido está reservado para vehículos que realizan
    giros a la izquierda desde cualquier dirección. No se puede utilizar para rebasar
    ni como un carril de conducción regular.
- id: 37
  category: sharing_the_road
  question: 'Al rebasar a un ciclista que viaja en la misma dirección, la ley de Delaware
    exige que deje un espacio libre mínimo de:'
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: Los conductores deben dejar un mínimo de 3 pies de espacio libre al
    rebasar a un ciclista para garantizar su seguridad.
- id: 38
  category: signs_and_signals
  question: ¿Qué indica una luz roja fija en una señal de cruce peatonal activada
    de alta intensidad (HAWK)?
  choices:
    A: Proceder con precaución
    B: Detenerse y permanecer detenido hasta que la luz cambie
    C: Ceder el paso a los peatones y luego proceder sin detenerse
    D: El cruce peatonal está fuera de servicio
  answer: B
  explanation: Una luz roja fija en una señal HAWK requiere que los conductores se
    detengan y permanezcan detenidos mientras los peatones cruzan.
- id: 39
  category: safe_driving_rules
  question: 'Bajo la restricción general de velocidad de Delaware (ley de velocidad
    básica), usted debe:'
  choices:
    A: Conducir siempre exactamente al límite de velocidad indicado
    B: Nunca conducir más rápido de lo que sea seguro para el clima actual, el tráfico
      y las condiciones de la carretera
    C: Conducir 5 mph por debajo del límite de velocidad por la noche
    D: Mantenerse al ritmo del flujo del tráfico independientemente del límite de
      velocidad
  answer: B
  explanation: La restricción general de velocidad establece que nunca debe conducir
    más rápido de lo que sea razonable y seguro para las condiciones actuales, independientemente
    del límite de velocidad indicado.
- id: 40
  category: safe_driving_rules
  question: ¿Cuándo es legal rebasar a otro vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante está girando a la izquierda y hay suficiente
      pavimento para rebasar con seguridad
    B: Cuando conduce por una carretera de tierra de un solo carril
    C: Cuando el vehículo de adelante conduce por debajo del límite de velocidad
    D: Nunca es legal rebasar por la derecha
  answer: A
  explanation: Se permite rebasar por la derecha cuando el vehículo al que está adelantando
    está girando o está a punto de girar a la izquierda, siempre que haya suficiente
    pavimento para hacerlo de manera segura sin salirse de la carretera.
- id: 41
  category: sharing_the_road
  question: ¿Por qué es importante aumentar la distancia de seguimiento al conducir
    detrás de una motocicleta?
  choices:
    A: Las motocicletas deben circular más despacio que los automóviles
    B: Las motocicletas pueden detenerse mucho más rápido que los vehículos más grandes
      y pueden cambiar de posición en el carril para evitar peligros
    C: Las motocicletas tienen luces de freno más brillantes que pueden causar deslumbramiento
    D: Las motocicletas no están sujetas a las leyes de tránsito estándar
  answer: B
  explanation: Las motocicletas pueden detenerse más rápido que los automóviles y
    pueden cambiar repentinamente de velocidad o de posición en el carril para evitar
    baches o escombros. Una mayor distancia de seguimiento le da más tiempo para reaccionar.
- id: 42
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios es ilegal estacionarse?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: Las normas de estacionamiento de Delaware prohíben detener o estacionar
    un vehículo a menos de 15 pies de un hidrante de incendios.
- id: 43
  category: signs_and_signals
  question: Al acercarse a una zona de obras, ¿qué indica un panel de flecha parpadeante
    que apunta hacia la izquierda?
  choices:
    A: El tráfico debe detenerse y esperar a un abanderado
    B: El carril izquierdo está cerrado más adelante
    C: Incorpórese al carril izquierdo porque el carril actual está cerrado más adelante
    D: Un desvío comienza hacia la derecha
  answer: C
  explanation: Un panel de flecha parpadeante en una zona de obras indica al tráfico
    que debe incorporarse en la dirección que señala la flecha porque el carril actual
    está cerrado más adelante.
- id: 44
  category: sharing_the_road
  question: ¿Cuándo tienen los peatones el derecho de paso en un cruce peatonal?
  choices:
    A: Solo cuando el cruce peatonal está marcado con líneas blancas
    B: Solo en intersecciones con semáforos
    C: Cuando ya están en el cruce peatonal o entrando en él
    D: Los peatones siempre deben ceder el paso a los vehículos motorizados
  answer: C
  explanation: Los conductores deben ceder el derecho de paso a los peatones que ya
    se encuentran en un cruce peatonal o que están entrando en él, ya sea que el cruce
    esté marcado o no.
- id: 45
  category: safe_driving_rules
  question: ¿Quién está obligado a usar el cinturón de seguridad en un vehículo en
    movimiento en Delaware?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero
    B: Solo los pasajeros menores de 18 años
    C: Todos los ocupantes del vehículo, independientemente de su edad o posición
      en el asiento
    D: Solo el conductor
  answer: C
  explanation: La ley de Delaware exige que todos los ocupantes de un vehículo motorizado
    estén debidamente sujetos por un cinturón de seguridad o un sistema de retención
    infantil adecuado.
- id: 46
  category: sharing_the_road
  question: Según el manual, ¿cuál de los siguientes tiene una sección dedicada titulada
    'Compartir la carretera con' (Sharing The Road With) ese tipo de vehículo específico?
  choices:
    A: Escúteres eléctricos
    B: Motocicletas
    C: Hoverboards
    D: Monopatines (Skateboards)
  answer: B
  explanation: El manual incluye una sección dedicada titulada 'Compartir la carretera
    con motocicletas'. Los escúteres eléctricos, hoverboards y monopatines no tienen
    sus propias secciones de compartir la carretera. (pág. 97)
- id: 47
  category: safe_driving_rules
  question: ¿Cuál de los siguientes se enumera como un paso necesario en la sección
    'Antes de conducir' (Before You Drive)?
  choices:
    A: Revisar la presión de los neumáticos
    B: Llenar el tanque de gasolina
    C: Limpiar las superficies de vidrio
    D: Probar los frenos
  answer: C
  explanation: '''Limpiar las superficies de vidrio'' se enumera explícitamente como
    un tema a tratar en la sección ''ANTES DE CONDUCIR''.'
- id: 48
  category: driver_responsibility
  question: El manual incluye una sección sobre los derechos constitucionales y legales
    de una persona durante ¿qué evento específico?
  choices:
    A: Una parada de tráfico
    B: Un registro de vehículo
    C: Un examen de conducir
    D: Una colisión
  answer: A
  explanation: El texto incluye secciones que detallan los derechos constitucionales
    y legales de una persona, así como los procedimientos de las fuerzas del orden,
    'durante una parada de tráfico'.
- id: 49
  category: vehicle_information
  question: ¿Cuál de los siguientes está categorizado bajo las habilidades de 'Conducción
    básica' (Basic Driving) en la Sección Cinco?
  choices:
    A: Cambiar un neumático
    B: Estacionamiento en paralelo
    C: Dirección (Steering)
    D: Incorporación al tráfico (Merging)
  answer: C
  explanation: '''Dirección'' (Steering) se enumera explícitamente como uno de los
    temas fundamentales bajo el encabezado ''CONDUCCIÓN BÁSICA''.'
- id: 50
  category: defensive_driving
  question: Según el manual, ¿qué dos acciones principales implica la comunicación
    con otros conductores?
  choices:
    A: Tocar la bocina y usar las señales de giro
    B: Hacer saber a los demás que usted está allí y hacer saber a los demás lo que
      está haciendo
    C: Hacer contacto visual y saludar con la mano
    D: Encender y apagar los faros y frenar
  answer: B
  explanation: En la sección 'COMUNICACIÓN', los dos subtemas enumerados son 'Hacer
    saber a los demás que usted está allí' y 'Hacer saber a los demás lo que está
    haciendo'.
- id: 51
  category: safe_driving_rules
  question: Al ajustar su velocidad, el manual especifica que debe ajustarla a ¿cuál
    de los siguientes factores?
  choices:
    A: El límite de velocidad y el clima
    B: La hora del día y la visibilidad
    C: Las capacidades de su vehículo y la carga
    D: Las condiciones de la carretera y el tráfico
  answer: D
  explanation: La sección 'AJUSTE DE VELOCIDAD' enumera específicamente 'Ajuste a
    las condiciones de la carretera' y 'Ajuste al tráfico' como los factores primordiales.
- id: 52
  category: defensive_driving
  question: ¿Qué regla específica se menciona en el manual con respecto a qué tan
    bien puede ver?
  choices:
    A: La regla de los dos segundos
    B: La regla de la distancia de visibilidad
    C: La regla de los tres segundos
    D: La regla de la distancia de seguimiento
  answer: B
  explanation: La 'Regla de la distancia de visibilidad' (Sight Distance Rule) aparece
    explícitamente en la sección '¿QUÉ TAN BIEN PUEDE VER?'.
- id: 53
  category: defensive_driving
  question: El manual enumera varios factores que afectan qué tan bien puede ver.
    ¿Cuál de los siguientes NO es uno de los factores enumerados explícitamente en
    esta sección?
  choices:
    A: Oscuridad
    B: Lluvia, niebla o nieve
    C: Resplandor del sol
    D: Colinas y curvas
  answer: C
  explanation: La sección '¿QUÉ TAN BIEN PUEDE VER?' enumera la oscuridad, lluvia/niebla/nieve,
    colinas y curvas, vehículos estacionados, la regla de la distancia de visibilidad
    y los límites de velocidad. El resplandor del sol no figura en este extracto.
- id: 54
  category: defensive_driving
  question: En la sección 'Compartir el espacio', ¿cuál de las siguientes es una situación
    específica cubierta para la gestión del espacio?
  choices:
    A: Espacio para estacionar
    B: Espacio para incorporarse al tráfico (merge)
    C: Espacio para girar
    D: Espacio para retroceder
  answer: B
  explanation: '''Espacio para incorporarse'' (Space To Merge) se enumera explícitamente
    como un subtema bajo ''COMPARTIR EL ESPACIO'', junto con el espacio adelante,
    atrás, a los lados, para cruzar o entrar, y para rebasar.'
- id: 55
  category: alcohol_drugs_health
  question: Según la sección 'Estar en condiciones para conducir', ¿qué sentidos físicos
    o condiciones se abordan específicamente?
  choices:
    A: Visión, audición y fatiga
    B: Reflejos, visión y edad
    C: Audición, flexibilidad y enfermedad
    D: Fatiga, estrés y emociones
  answer: A
  explanation: La sección 'ESTAR EN CONDICIONES PARA CONDUCIR' enumera la 'Visión',
    la 'Audición' y la 'Fatiga' como temas clave antes de tratar el tema de beber
    y conducir.
- id: 56
  category: sharing_the_road
  question: ¿Qué tipo de vehículo tiene una sección específica que detalla 'Choques
    al retroceder' y 'Reportar una infracción de seguridad comercial'?
  choices:
    A: Motocicletas
    B: Ciclomotores (mopeds)
    C: Camiones
    D: Tractores agrícolas
  answer: C
  explanation: '''Choques al retroceder'' y ''Reportar una infracción de seguridad
    comercial'' se enumeran inmediatamente después de ''Compartir la carretera con
    un camión''.'
- id: 57
  category: driver_responsibility
  question: Según la Sección Cinco, ¿qué debe hacer un conductor con respecto a su
    carga antes de conducir?
  choices:
    A: Pesar la carga
    B: Asegurar la carga
    C: Cubrir la carga con una lona
    D: Distribuir la carga uniformemente
  answer: B
  explanation: '''Asegurar su carga'' (Secure Your Load) se enumera como un paso obligatorio
    en la sección ''ANTES DE CONDUCIR''.'
- id: 58
  category: driver_responsibility
  question: El manual proporciona información sobre cómo y dónde presentar un elogio
    o una queja contra ¿quién?
  choices:
    A: Un instructor de manejo
    B: Un conductor de camión comercial
    C: Un oficial de la ley
    D: Un funcionario del DMV
  answer: C
  explanation: El texto incluye una sección titulada 'Cómo y dónde presentar un elogio
    a favor de o una queja contra un oficial de la ley'.
- id: 59
  category: sharing_the_road
  question: Junto con los tractores agrícolas y la maquinaria vial, ¿qué otro tipo
    de equipo se agrupa en su sección específica de compartir la carretera?
  choices:
    A: Equipo de jardinería
    B: Equipo de construcción
    C: Equipo de minería
    D: Equipo de remolque
  answer: B
  explanation: El manual incluye una sección titulada 'Tractores y equipos agrícolas,
    maquinaria vial y equipo de construcción'.
- id: 60
  category: safe_driving_rules
  question: En la sección 'Conducción básica', ¿cuál de las siguientes acciones se
    enumera junto con Arrancar, Acelerar y Maniobrar (Steering)?
  choices:
    A: Ceder el paso
    B: Estacionar
    C: Detenerse
    D: Retroceder
  answer: C
  explanation: '''Detenerse'' se enumera explícitamente como un tema en la sección
    ''CONDUCCIÓN BÁSICA'', junto con Arrancar, Acelerar, Maniobrar, Exceso de velocidad,
    Frenado, Ver bien, Escanear y Uso de las luces.'
- id: 61
  category: driver_responsibility
  question: Si existe un conflicto entre el manual del conductor de Delaware y la
    ley estatal o federal, ¿cuál tiene precedencia?
  choices:
    A: El manual del conductor
    B: El código o legislación real
    C: Ordenanzas locales del condado
    D: La discreción del oficial de policía
  answer: B
  explanation: Según el manual, si existe un conflicto, el código o la legislación
    real siempre tendrá precedencia.
- id: 62
  category: license_system
  question: Si desea un endoso para conducir una motocicleta, ¿qué manual debe leer?
  choices:
    A: El Manual del Conductor Comercial
    B: El Manual del Conductor de Delaware
    C: El Manual del Operador de Motocicletas
    D: El Manual de Seguridad Vial
  answer: C
  explanation: El manual establece que si desea un endoso para conducir una motocicleta,
    debe leer el Manual del Operador de Motocicletas.
- id: 63
  category: driver_testing
  question: ¿Cómo puede una persona con una discapacidad solicitar una prueba de audio
    o una adaptación especial para su examen de conocimientos?
  choices:
    A: Preguntando al examinador el día de la prueba
    B: Llamando y programando una cita antes de acudir a una oficina del DMV
    C: Enviando una solicitud por escrito por correo con 30 días de antelación
    D: Realizando el examen en línea en su lugar
  answer: B
  explanation: Si tiene una discapacidad y necesita una adaptación especial para realizar
    un examen, debe llamar y programar una cita antes de acudir a una oficina del
    DMV. Las pruebas de audio están disponibles a petición.
- id: 64
  category: vehicle_information
  question: Según las definiciones de Delaware, ¿una bicicleta con motor eléctrico
    debe tener una velocidad máxima inferior a qué cantidad en una superficie nivelada
    pavimentada?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: El término bicicleta incluye un vehículo con un motor eléctrico de
    menos de 750 vatios cuya velocidad máxima en una superficie nivelada pavimentada
    es inferior a 20 mph.
- id: 65
  category: sharing_the_road
  question: ¿Cuál es el propósito de una 'Caja para Bicicletas' (Bike Box) en una
    intersección?
  choices:
    A: Proporcionar un espacio de estacionamiento para bicicletas
    B: Almacenar bicicletas que han sido confiscadas
    C: Proporcionar a los ciclistas una forma segura de girar y una forma visible
      de adelantarse al tráfico
    D: Advertir a los conductores sobre un carril para bicicletas próximo
  answer: C
  explanation: Una 'Caja para Bicicletas' (Bike Box) es un área designada al frente
    de un carril de tráfico en las intersecciones que proporciona a los ciclistas
    una forma segura de girar y una forma visible de adelantarse al tráfico.
- id: 66
  category: penalties_and_points
  question: En el contexto de las leyes de vehículos motorizados, ¿cuál de los siguientes
    se incluye en la definición de ser 'Condenado' (Convicted)?
  choices:
    A: Recibir una advertencia por escrito de un oficial de policía
    B: Estar involucrado en un choque
    C: La pérdida de una fianza o una declaración de culpabilidad
    D: Reprobar el examen de habilidades de conducción
  answer: C
  explanation: '''Condenado'' (Convicted) significa haber sido declarado culpable
    en un tribunal de justicia por una violación de las leyes de vehículos motorizados,
    la pérdida de una fianza o una declaración de culpabilidad.'
- id: 67
  category: vehicle_information
  question: Para fines de licencia en Delaware, ¿un vehículo se considera un Vehículo
    Motorizado Comercial (CMV) si está diseñado para transportar cuántos ocupantes
    (incluido el conductor)?
  choices:
    A: 8 o más
    B: 10 o más
    C: 12 o más
    D: 16 o más
  answer: D
  explanation: Un Vehículo Motorizado Comercial (CMV) incluye un vehículo diseñado
    para transportar a 16 o más ocupantes (incluido el conductor).
- id: 68
  category: vehicle_information
  question: ¿Una camioneta pickup, una furgoneta de carga, una furgoneta de pasajeros
    o un autobús se clasifica como 'Vehículo Comercial' si pesa más de qué cantidad?
  choices:
    A: 5,000 libras
    B: 10,000 libras
    C: 15,000 libras
    D: 26,000 libras
  answer: A
  explanation: '''Vehículo Comercial'' significa un vehículo clasificado como camioneta
    pickup/furgoneta de carga/furgoneta de pasajeros/autobús (de más de 5,000 libras).'
- id: 69
  category: safe_driving_rules
  question: ¿Qué define una 'Autopista Dividida'?
  choices:
    A: Una autopista con al menos cuatro carriles de tráfico
    B: Una autopista dividida en dos o más calzadas por un espacio intermedio, una
      barrera física o una sección divisoria
    C: Una autopista que cruza fronteras estatales
    D: Una carretera que es compartida tanto por vehículos motorizados como por trenes
  answer: B
  explanation: '''Autopista Dividida'' significa cualquier autopista dividida en dos
    o más calzadas por un espacio intermedio, una barrera física o una sección divisoria
    claramente indicada, construida de tal manera que impida el tráfico vehicular.'
- id: 70
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a una Tarjeta
    de Privilegio de Conducir (DPC)?
  choices:
    A: Puede usarse para comprar armas de fuego
    B: Es una forma válida de identificación para fines federales
    C: Se emite solo para fines de conducción y no debe usarse como una forma válida
      de identificación
    D: Permite al titular conducir vehículos motorizados comerciales
  answer: C
  explanation: Una DPC (Tarjeta de Privilegio de Conducir) es una licencia de conducir
    válida que se emite solo para fines de conducción y no debe usarse como una forma
    válida de identificación.
- id: 71
  category: driver_responsibility
  question: ¿Según el manual, quién es considerado un 'Conductor'?
  choices:
    A: Solo alguien que posee una licencia de conducir válida
    B: Cualquier persona que tenga el control físico real de un vehículo motorizado
    C: El propietario registrado del vehículo
    D: Cualquier persona sentada en el asiento delantero de un vehículo
  answer: B
  explanation: '''Conductor'' incluye a cualquier persona que tenga el control físico
    real de un vehículo motorizado.'
- id: 72
  category: license_system
  question: ¿Cuáles son los nombres comunes del Certificado de Educación Vial que
    se entrega a los estudiantes que completan con éxito un curso aprobado?
  choices:
    A: El 'Certificado Verde' o 'Certificado Dorado'
    B: El 'Certificado Azul' o 'Certificado Blanco'
    C: El 'Certificado Rojo' o 'Certificado Plateado'
    D: El 'Certificado Amarillo' o 'Certificado Negro'
  answer: B
  explanation: El Certificado de Educación Vial se conoce comúnmente como el 'Certificado
    Azul' o 'Certificado Blanco'.
- id: 73
  category: safe_driving_rules
  question: ¿Qué es una 'Autopista Expresa' (Express Highway)?
  choices:
    A: Una carretera de peaje que requiere un pase electrónico
    B: Una carretera propiedad de individuos o instituciones privadas
    C: Una carretera estatal o interestatal especialmente diseñada para el tráfico
      directo
    D: Una carretera con un límite de velocidad superior a 70 mph
  answer: C
  explanation: '''Autopista Expresa'' (Express Highway) significa una carretera estatal
    o interestatal especialmente diseñada para el tráfico directo.'
- id: 74
  category: license_system
  question: Una Licencia de Conducir Graduada (GDL) es un permiso restringido emitido
    a una persona que ha completado un curso de educación vial aprobado y se encuentra
    en qué grupo de edad (asumiendo que no tiene un IEP)?
  choices:
    A: Al menos 15 años o menos de 17 años
    B: Al menos 16 años o menos de 18 años
    C: Al menos 17 años o menos de 21 años
    D: Al menos 18 años o menos de 25 años
  answer: B
  explanation: GDL significa Licencia de Conducir Graduada (Graduated Driver License),
    la cual es un permiso restringido emitido a cualquier persona que tenga al menos
    16 años o menos de 18 años (o menos de 22 con un IEP activo).
- id: 75
  category: safe_driving_rules
  question: ¿Incluye la definición de 'Carretera' (Highway) los caminos propiedad
    de individuos o instituciones privadas?
  choices:
    A: Sí, todos los caminos se consideran carreteras
    B: Sí, si están pavimentados
    C: No, solo incluye caminos abiertos al tráfico vehicular público
    D: No, solo incluye carreteras interestatales
  answer: C
  explanation: '''Carretera'' (Highway) significa todo el ancho entre las líneas limítrofes
    de cada camino abierto al tráfico vehicular público, pero no incluye caminos propiedad
    de individuos privados o de instituciones.'
- id: 76
  category: vehicle_information
  question: ¿Según el manual, cuál de las siguientes características define a una
    'Minimoto' (Minibike)?
  choices:
    A: Un motor de más de 55 centímetros cúbicos
    B: Un asiento a menos de 25 pulgadas del suelo
    C: Un tamaño de llanta de exactamente 12 pulgadas
    D: Una longitud de más de 50 pulgadas de eje a eje
  answer: B
  explanation: El manual define una 'Minimoto' (Minibike) como un ciclo impulsado
    por motor con un tamaño de llanta de menos de 10 pulgadas, menos de 40 pulgadas
    de largo, un motor de menos de 45 cc, o un asiento a menos de 25 pulgadas del
    suelo.
- id: 77
  category: safe_driving_rules
  question: En el manual del conductor, ¿cuál es la diferencia entre los términos
    'Debe' (Must) y 'Debería' (Should)?
  choices:
    A: '''Debe'' es una acción recomendada, mientras que ''Debería'' es requerida
      por ley.'
    B: '''Debe'' significa una acción requerida por ley, mientras que ''Debería''
      es una acción recomendada.'
    C: Ambos términos significan que una acción es requerida por ley.
    D: Ambos términos significan que una acción es solo recomendada.
  answer: B
  explanation: Según el manual, 'Debe' (Must) significa una acción o práctica requerida
    por ley, mientras que 'Debería' (Should) significa una acción o práctica recomendada
    que no es requerida por ley.
- id: 78
  category: license_system
  question: ¿Qué significan las siglas 'NDR' en el contexto de las licencias de conducir?
  choices:
    A: Registro Nacional de Conductores (National Driver Register)
    B: Registro de Conducción a Nivel Nacional (Nationwide Driving Record)
    C: Departamento Nacional de Carreteras (National Department of Roads)
    D: Registro de Nuevos Conductores (New Driver Registry)
  answer: A
  explanation: El manual establece que 'NDR' significa Registro Nacional de Conductores
    (National Driver Register), que es una base de datos computarizada de información
    sobre conductores a quienes se les ha suspendido o revocado la licencia.
- id: 79
  category: safe_driving_rules
  question: ¿Cómo se define 'Calzada' (Roadway) en el manual del conductor?
  choices:
    A: Todo el ancho entre las líneas limítrofes de cada camino abierto al tráfico
      público.
    B: La parte de la carretera utilizada para el tráfico vehicular, excluyendo el
      arcén (shoulder).
    C: Un área establecida oficialmente para el uso exclusivo de peatones.
    D: Una carretera en una ciudad o un distrito suburbano.
  answer: B
  explanation: El manual define 'Calzada' (Roadway) como la parte de la carretera
    mejorada, diseñada o utilizada ordinariamente para el tráfico vehicular, excluyendo
    el arcén (shoulder).
- id: 80
  category: sharing_the_road
  question: ¿Cuál es otro nombre para una 'Vía Ciclista de Doble Sentido' (Two-Way
    Cycle Track)?
  choices:
    A: Sendero de uso compartido
    B: Carril de bicicletas protegido
    C: Zona de seguridad peatonal
    D: Arcén de la carretera
  answer: B
  explanation: El manual establece que una 'Vía Ciclista de Doble Sentido' (Two-Way
    Cycle Track) también se conoce como carriles para bicicletas protegidos, vías
    ciclistas separadas y senderos para bicicletas en la calle.
- id: 81
  category: penalties_and_points
  question: ¿Cuál es la multa base para un automovilista sin seguro en Delaware?
  choices:
    A: $50.00
    B: $100.00
    C: $200.00
    D: $25.00
  answer: B
  explanation: La sección de Tarifas de Vehículos Motorizados indica que la multa
    por Automovilista Sin Seguro es de $100.00 (más $5.00 por día después del trigésimo
    primer día a partir de la fecha de envío de la notificación).
- id: 82
  category: penalties_and_points
  question: ¿Cuál es el costo para restablecer una licencia de conducir revocada?
  choices:
    A: $25.00
    B: $40.00
    C: $50.00
    D: $200.00
  answer: D
  explanation: De acuerdo con el programa de tarifas, el costo de restablecimiento
    de la licencia de conducir (DL) tras una revocación es de $200.00.
- id: 83
  category: license_system
  question: ¿Cuál es el costo de una licencia de conducir Clase D de 8 años?
  choices:
    A: $20.00
    B: $24.00
    C: $40.00
    D: $48.00
  answer: C
  explanation: El programa de tarifas indica que el costo de la licencia de conducir
    Clase D por 8 años es de $40.00.
- id: 84
  category: vehicle_information
  question: ¿Cuánto cobra el DMV por la emisión o renovación de un cartel de estacionamiento
    para personas con discapacidad (Handicap Placard)?
  choices:
    A: $5.00
    B: $10.00
    C: $20.00
    D: Sin cargo
  answer: D
  explanation: La sección de Tarifas de Vehículos Motorizados establece que 'no hay
    cargo' por un cartel de estacionamiento para personas con discapacidad.
- id: 85
  category: penalties_and_points
  question: ¿Qué sucede si presenta un cheque sin fondos al DMV y no paga el monto
    original más la multa de $25 en un plazo de 10 días?
  choices:
    A: Se le cobrarán $5 adicionales por día.
    B: Su licencia de conducir y/o registro serán suspendidos.
    C: Su vehículo será confiscado.
    D: Se le requerirá volver a tomar el examen de conducir.
  answer: B
  explanation: La sección de notas especifica que si el monto original más la multa
    de $25.00 por un cheque sin fondos no se paga en un plazo de 10 días, su licencia
    de conducir y/o registro serán suspendidos.
- id: 86
  category: license_system
  question: ¿Bajo qué condición el DMV exonerará los cargos por mora a los miembros
    militares en servicio activo que renueven después de su fecha de vencimiento?
  choices:
    A: Si han tenido un historial de manejo limpio durante los últimos 5 años.
    B: Si presentan pruebas de que estaban desplegados o destacados fuera de Delaware
      en el momento del vencimiento.
    C: Si pagan por una renovación de 8 años en lugar de una de 4 años.
    D: Si completan un curso de manejo defensivo aprobado.
  answer: B
  explanation: El DMV no cobrará cargos por mora a los miembros militares en servicio
    activo si pueden presentar pruebas de que estaban desplegados o destacados fuera
    del estado de Delaware en el momento del vencimiento.
- id: 87
  category: vehicle_information
  question: Si pagó un impuesto sobre ventas o transferencia por la compra de un vehículo
    en otro estado, ¿dentro de cuántos días antes de registrar el vehículo en Delaware
    debe haber ocurrido la compra para recibir un crédito fiscal?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: La ley de Delaware permite un crédito sobre el impuesto a las ventas
    o gravamen similar pagado a otro estado por la compra de un vehículo dentro de
    los 90 días anteriores al registro del vehículo en Delaware.
- id: 88
  category: vehicle_information
  question: Según el manual, ¿entre qué potencias debe estar clasificado el motor
    eléctrico de un 'Ciclomotor' (Moped)?
  choices:
    A: 250 vatios y 500 vatios
    B: 500 vatios y 750 vatios
    C: 751 vatios y 2,000 vatios
    D: 2,001 vatios y 3,000 vatios
  answer: C
  explanation: El manual define un 'Ciclomotor' (Moped) como aquel que tiene un motor
    de combustión interna de menos de 55 cc, o un motor eléctrico con una potencia
    de entre 751 vatios y 2,000 vatios.
- id: 89
  category: penalties_and_points
  question: ¿Cuál es el cargo máximo que la División de Vehículos Motorizados de Delaware
    puede cobrar por un pago devuelto, como un cheque sin fondos?
  choices:
    A: $15.00
    B: $20.00
    C: $25.00
    D: $30.00
  answer: C
  explanation: La ley de Delaware permite a la División cobrar una tarifa razonable
    que no exceda los $25.00 a cualquier persona que presente un pago que sea devuelto
    por falta de fondos.
- id: 90
  category: penalties_and_points
  question: Si recibe una carta certificada sobre un pago sin fondos al DMV, ¿cuántos
    días tiene para realizar el pago antes de que se suspenda su licencia o registro?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: La División otorga 10 días para realizar el pago después del envío
    de la notificación. Si no se recibe en un plazo de 10 días, la División suspenderá
    de inmediato la licencia de conducir o el registro del vehículo de la persona.
- id: 91
  category: vehicle_information
  question: ¿Según el programa de tarifas del DMV de Delaware, cuál es el costo de
    un Título de vehículo con un Gravamen (Lien)?
  choices:
    A: $35.00
    B: $50.00
    C: $55.00
    D: $25.00
  answer: C
  explanation: El programa de tarifas indica que el costo de un Título (con Gravamen/Lien)
    es de $55.00.
- id: 92
  category: vehicle_information
  question: ¿Cómo se calcula la tarifa estándar de documentación del vehículo en Delaware?
  choices:
    A: 3.75% del precio de compra o del valor del libro NADA, el que sea mayor
    B: 4.25% del precio de compra o del valor del libro NADA, el que sea mayor
    C: Una tarifa fija de $8.00 para todos los vehículos
    D: 5.00% del precio de compra solamente
  answer: B
  explanation: La tarifa de documentación se calcula como el 4.25% del precio de compra
    o del valor del libro NADA, el que sea mayor (con un mínimo de $8.00). Las casas
    móviles se calculan al 3.75%.
- id: 93
  category: license_system
  question: ¿Cómo se puede distinguir visualmente una licencia de conducir de Delaware
    que cumple con las normas federales de una que no las cumple?
  choices:
    A: Tiene una estrella plateada en la esquina inferior izquierda
    B: Tiene una estrella dorada en la esquina superior derecha
    C: Está impresa en formato vertical
    D: Tiene impreso 'Federal ID' en tinta roja
  answer: B
  explanation: Una licencia o identificación (DL/ID) que cumple con las normas se
    distingue por la estrella dorada en la esquina superior derecha de la misma.
- id: 94
  category: license_system
  question: ¿Qué frase está impresa en el margen superior de una licencia de conducir
    o tarjeta de identificación de Delaware que no cumple con las normas federales?
  choices:
    A: '"Not for Federal ID"'
    B: '"State Use Only"'
    C: '"Driving Privilege Only"'
    D: '"Non-Compliant Card"'
  answer: A
  explanation: Una tarjeta que no cumple con las normas se distingue por la frase
    "Not for Federal ID" impresa en el margen superior de la DL/ID.
- id: 95
  category: license_system
  question: ¿Cuál es la tarifa de reemplazo que se cobra si decide convertir su licencia
    que no cumple con las normas a una que sí cumple con las normas federales?
  choices:
    A: $10.00
    B: $15.00
    C: $20.00
    D: $25.00
  answer: C
  explanation: Para convertir su licencia, visite cualquier oficina local del DMV
    y presente los documentos requeridos. Se cobrará una tarifa de reemplazo de licencia
    de $20.00.
- id: 96
  category: license_system
  question: ¿De cuánto tiempo dispone para obtener una licencia de conducir de Delaware
    después de convertirse en residente de buena fe de Delaware?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Se requiere que obtenga una licencia de conducir de Delaware dentro
    de los 60 días posteriores a convertirse en residente de buena fe de Delaware.
- id: 97
  category: license_system
  question: ¿Cuál de las siguientes personas está exenta de tener una licencia de
    conducir de Delaware mientras conduce en la carretera?
  choices:
    A: Un nuevo residente que se mudó a Delaware hace 90 días
    B: Una persona que opera un tractor agrícola temporalmente en una carretera
    C: Un no residente de 15 años con un permiso de aprendizaje de su estado de origen
    D: Un turista extranjero con un permiso de conducir internacional vencido
  answer: B
  explanation: Las personas están exentas mientras conducen u operan una aplanadora,
    maquinaria vial, o un tractor agrícola o implemento de labranza temporalmente
    en una carretera.
- id: 98
  category: driver_testing
  question: 'La División de Vehículos Motorizados NO emitirá una licencia de conducir
    a un solicitante menor de 18 años si este:'
  choices:
    A: No es dueño de su propio vehículo
    B: No ha completado un curso de educación vial aprobado por el Departamento de
      Educación de Delaware
    C: No ha tenido un permiso de aprendizaje durante al menos dos años
    D: Está solicitando una licencia que cumple con las normas federales
  answer: B
  explanation: La ley no permite la emisión de una licencia si usted es menor de 18
    años y no ha completado un curso de educación vial aprobado por el Departamento
    de Educación de Delaware.
- id: 99
  category: license_system
  question: 'Según la ley de Delaware, se le puede denegar una licencia de conducir
    si usted:'
  choices:
    A: No entiende las señales de tránsito en inglés
    B: Es mayor de 75 años
    C: Usa anteojos recetados
    D: Tiene una tarjeta de identificación que no cumple con las normas federales
  answer: A
  explanation: La ley no permite que la División de Vehículos Motorizados emita una
    licencia de conducir cuando usted no entiende las señales de tránsito en inglés.
- id: 100
  category: alcohol_drugs_health
  question: Si está sujeto a la pérdida del conocimiento debido a enfermedades del
    sistema nervioso central, ¿qué debe proporcionar para obtener una licencia?
  choices:
    A: Una exención de un juez
    B: Una certificación por escrito de su médico autorizado de que la discapacidad
      está bajo control suficiente
    C: Prueba de seguro médico
    D: Un certificado de examen de conducir especializado
  answer: B
  explanation: Debe proporcionar a la división una certificación por escrito de su
    médico autorizado que indique que la discapacidad física de dicha persona está
    bajo control suficiente para permitirle conducir un vehículo motorizado de manera
    segura.
- id: 101
  category: license_system
  question: ¿En cuál de las siguientes ciudades de Delaware puede solicitar en persona
    una licencia de conducir?
  choices:
    A: Newark
    B: Rehoboth Beach
    C: Georgetown
    D: Smyrna
  answer: C
  explanation: Debe solicitarla en persona en la División de Vehículos Motorizados
    (Division) en Delaware City, Dover, Georgetown o Wilmington.
- id: 102
  category: license_system
  question: ¿Por qué un solicitante con estatus migratorio A-1 (Embajador) no es elegible
    para una licencia de conducir emitida por Delaware?
  choices:
    A: Están exentos de todas las leyes de tránsito
    B: Solo se les puede emitir una licencia de conducir del Departamento de Estado
      de los Estados Unidos
    C: No están obligados a poseer ningún tipo de licencia de conducir
    D: En su lugar, deben obtener un permiso de conducir internacional
  answer: B
  explanation: Los solicitantes con estatus migratorio A-1 no son elegibles porque
    a quienes tienen estatus "A" solo se les puede emitir una licencia de conducir
    del Departamento de Estado de los Estados Unidos.
- id: 103
  category: license_system
  question: ¿Cuál de los siguientes estatus migratorios se considera no elegible para
    una licencia de conducir o tarjeta de identificación emitida por Delaware?
  choices:
    A: Visitante B-2 por placer (turista)
    B: Residente permanente
    C: Asilado
    D: Refugiado
  answer: A
  explanation: Aquellos que se encuentran legalmente en los Estados Unidos bajo el
    estatus migratorio B-2 (Visitante por placer/turista) no son elegibles para una
    licencia de conducir o tarjeta de identificación emitida por Delaware.
- id: 104
  category: license_system
  question: ¿Cuál es el periodo de vencimiento de una licencia de conducir emitida
    a un ciudadano estadounidense o a un inmigrante residente permanente?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: Según el manual, los ciudadanos estadounidenses y los inmigrantes residentes
    permanentes reciben una licencia de conducir y una tarjeta de identificación de
    8 años.
- id: 105
  category: license_system
  question: Si los registros de inmigración de un no inmigrante muestran un periodo
    de estancia autorizada 'indefinido', ¿qué fecha de vencimiento se utilizará para
    su licencia de conducir?
  choices:
    A: 6 meses
    B: 1 año
    C: 4 años
    D: 8 años
  answer: B
  explanation: Se utilizará una fecha de vencimiento de un año cuando los registros
    de inmigración muestren 'indefinido' o 'duración del estatus' para el periodo
    de estancia autorizada.
- id: 106
  category: driver_testing
  question: ¿Qué examen médico obligatorio debe aprobar cada conductor al solicitar
    una licencia?
  choices:
    A: Una prueba de audición
    B: Un control de la presión arterial
    C: Un examen de la vista
    D: Una evaluación de reflejos
  answer: C
  explanation: El manual establece que cada conductor debe aprobar un examen de la
    vista.
- id: 107
  category: license_system
  question: ¿Qué deben hacer los solicitantes si ya tienen una licencia de conducir
    o una tarjeta de identificación de otro estado?
  choices:
    A: Conservarla como una forma secundaria de identificación
    B: Entregar su licencia y/o tarjeta de identificación del otro estado
    C: Pagar una tarifa por doble licencia
    D: Destruirla ellos mismos después de 30 días
  answer: B
  explanation: Los solicitantes que tengan una licencia o una tarjeta de identificación
    (ID) en otro estado deben entregar su licencia y/o tarjeta de identificación del
    otro estado o estados.
- id: 108
  category: penalties_and_points
  question: ¿Cuál es la sanción por hacer declaraciones falsas o intentar fraude al
    presentar documentos inválidos en una solicitud de licencia de conducir?
  choices:
    A: Se considera una falta leve y resulta en una advertencia
    B: Se considera perjurio y puede resultar en multas, denegación de licencias y
      suspensión
    C: Resulta en una sentencia de cárcel obligatoria de 30 días
    D: Requiere que el solicitante vuelva a tomar el examen escrito
  answer: B
  explanation: Las declaraciones falsas, el intento de fraude o la tergiversación
    constituyen perjurio y pueden dar lugar a multas y a la denegación de licencias.
    Una licencia de conducir puede ser suspendida en cualquier momento en que se encuentre
    información falsa en la solicitud firmada.
- id: 109
  category: license_system
  question: ¿Cuál de los siguientes NO es un documento aceptable para demostrar su
    Número de Seguro Social (SSN)?
  choices:
    A: Formulario de impuestos W-2
    B: Talón de pago que contenga el SSN completo
    C: Tarjeta de Medicare/Medicaid
    D: Tarjeta de Seguro Social
  answer: C
  explanation: El manual establece explícitamente que las tarjetas de Medicare/Medicaid
    no son aceptables como prueba del Número de Seguro Social.
- id: 110
  category: license_system
  question: ¿Cuántos comprobantes de residencia en Delaware se requieren al solicitar
    una licencia de conducir o una tarjeta de identificación?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Cada solicitante debe proporcionar dos comprobantes de residencia del
    solicitante en Delaware.
- id: 111
  category: license_system
  question: ¿Cuál es un requisito para los dos comprobantes de residencia en Delaware?
  choices:
    A: Deben tener un matasellos de los últimos 60 días
    B: Deben tener un matasellos de los últimos 6 meses
    C: Pueden ser cartas personales de amigos
    D: Pueden mostrar una dirección de apartado postal (PO box)
  answer: A
  explanation: Los comprobantes de residencia deben provenir de fuentes distintas,
    mostrar una dirección física (no un apartado postal) y tener un matasellos de
    los últimos 60 días. NO se aceptarán cartas o tarjetas que no sean comerciales.
- id: 112
  category: license_system
  question: ¿Qué información adicional debe incluirse en un certificado de nacimiento
    si el solicitante es menor de 18 años o es elegible para el programa IEP GDL?
  choices:
    A: El logotipo oficial del hospital
    B: La firma del médico tratante
    C: El nombre de los padres o tutores legales
    D: El tipo de sangre del solicitante
  answer: C
  explanation: Si el solicitante es menor de 18 años o es elegible para el programa
    IEP GDL, se debe presentar un documento que contenga el nombre de los padres o
    tutores legales (como un certificado de nacimiento).
- id: 113
  category: license_system
  question: ¿Cuál de los siguientes se considera un certificado de nacimiento emitido
    en los EE. UU. aceptable para fines de identificación?
  choices:
    A: Un registro de anuncio del hospital
    B: Una tarjeta de registro de nacimiento tamaño billetera
    C: Una fotocopia del certificado de nacimiento original
    D: Una copia original o certificada con un sello en relieve emitida por la Oficina
      de Estadísticas Vitales
  answer: D
  explanation: Un certificado de nacimiento debe ser una copia original o certificada,
    tener un sello en relieve y ser emitido por la Oficina de Estadísticas Vitales
    o la Junta Estatal de Salud. No se aceptan tarjetas de billetera ni anuncios de
    hospital.
- id: 114
  category: license_system
  question: ¿A través de qué sistema verifica el DMV electrónicamente el estatus legal
    y la duración de la estancia autorizada de un no ciudadano?
  choices:
    A: Sistema de Verificación Sistemática de Extranjeros para la Determinación de
      Beneficios (SAVE)
    B: Registro Nacional de Conductores (NDR)
    C: Base de datos de la Administración de Seguridad en el Transporte (TSA)
    D: Verificación de antecedentes de la Oficina Federal de Investigaciones (FBI)
  answer: A
  explanation: Los no ciudadanos deben proporcionar documentos que puedan ser verificados
    electrónicamente a través del Sistema de Verificación Sistemática de Extranjeros
    para la Determinación de Beneficios (SAVE) del Departamento de Seguridad Nacional.
- id: 115
  category: license_system
  question: ¿Cuál es la fecha de vencimiento máxima para una licencia de conducir
    emitida a un no inmigrante/visitante temporal?
  choices:
    A: 8 años
    B: 5 años
    C: Está limitada por su estancia autorizada en los EE. UU.
    D: 1 año independientemente de su visa
  answer: C
  explanation: Para los no inmigrantes/visitantes temporales, la fecha de vencimiento
    está limitada por su estancia autorizada en los EE. UU., la cual se verifica electrónicamente
    a través de SAVE.
- id: 116
  category: license_system
  question: ¿Qué debe contener un documento de identificación principal para ser aceptado
    por el DMV?
  choices:
    A: Nombre completo, fecha de nacimiento y ser verificable
    B: Nombre completo, dirección física y una fotografía
    C: Fecha de nacimiento, número de Seguro Social y firma
    D: Nombre completo, estatura y color de ojos
  answer: A
  explanation: Un documento principal debe contener el nombre completo y la fecha
    de nacimiento, y debe ser verificable (se puede contactar a la agencia emisora
    para determinar la autenticidad del documento).
- id: 117
  category: driver_testing
  question: Además de un examen de la vista, ¿a qué otros exámenes está sujeto cada
    solicitante de licencia de conducir?
  choices:
    A: Una prueba de aptitud física
    B: Un examen escrito y de habilidades viales
    C: Una evaluación psicológica
    D: Un curso de conducción defensiva
  answer: B
  explanation: El manual establece que cada solicitante de licencia de conducir está
    sujeto a un examen escrito y de habilidades viales.
- id: 118
  category: license_system
  question: ¿Cuál de los siguientes documentos es aceptable como prueba de un número
    de Seguro Social?
  choices:
    A: Una tarjeta de Medicare
    B: Una tarjeta de Medicaid
    C: Un formulario de impuestos W-2
    D: Un pasaporte vencido
  answer: C
  explanation: Un formulario de impuestos W-2 figura como una prueba aceptable de
    un número de Seguro Social. Se indica explícitamente que las tarjetas de Medicare
    y Medicaid no son aceptables.
- id: 119
  category: license_system
  question: ¿Qué servicio de entrega es aceptable para el correo utilizado como prueba
    de residencia en Delaware?
  choices:
    A: FedEx
    B: UPS
    C: DHL
    D: USPS
  answer: D
  explanation: Según el manual, 'El correo debe haber sido entregado por el USPS...
    (no se aceptan UPS/FedEx/DHL)'.
- id: 120
  category: license_system
  question: ¿Cuánto tiempo debe esperar después de cambiar su nombre en la Administración
    del Seguro Social antes de presentarse en el DMV?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 1 semana
  answer: B
  explanation: El manual requiere que 'Debe cambiar su nombre en la Administración
    del Seguro Social y esperar 48 horas antes de presentarse en el DMV'.
- id: 121
  category: license_system
  question: ¿Cuál de los siguientes NO es un comprobante aceptable de un cambio de
    nombre legal?
  choices:
    A: Un documento de cambio de nombre finalizado por orden judicial
    B: Un certificado de matrimonio firmado por un miembro del clero
    C: Una sentencia de divorcio finalizada que indique su nombre legal
    D: Un certificado de unión civil emitido por una agencia gubernamental con un
      sello en relieve
  answer: B
  explanation: 'El manual establece explícitamente: ''No se aceptan certificados de
    matrimonio firmados por un miembro del clero''. Deben ser emitidos por una agencia
    gubernamental con un sello en relieve.'
- id: 122
  category: license_system
  question: Si un menor fue adoptado fuera de los EE. UU. y su certificado de nacimiento
    extranjero NO incluye a los padres adoptivos, ¿qué documento adicional se requiere?
  choices:
    A: Una carta de la escuela del menor
    B: Un pasaporte de los EE. UU.
    C: Los documentos de adopción
    D: Una prueba de ADN
  answer: C
  explanation: 'El manual señala: ''Si los padres adoptivos NO figuran en el certificado
    de nacimiento, se requerirán los documentos de adopción...'''
- id: 123
  category: license_system
  question: ¿Quién es elegible para solicitar una Tarjeta de Privilegio de Conducir
    (DPC) de Delaware?
  choices:
    A: Ciudadanos de los EE. UU. que perdieron su certificado de nacimiento
    B: Personas con documentos de presencia legal válidos
    C: Cualquier residente de un estado vecino
    D: Residentes extranjeros de Delaware que no pueden presentar pruebas de presencia
      legal
  answer: D
  explanation: 'El manual establece: ''La DPC solo está disponible para residentes
    extranjeros de Delaware que no pueden presentar pruebas de presencia legal en
    los Estados Unidos... Los ciudadanos de los EE. UU. y las personas con documentos
    de presencia legal válidos no son elegibles para una DPC''.'
- id: 124
  category: license_system
  question: ¿Para qué es válida una Tarjeta de Privilegio de Conducir (DPC) de Delaware?
  choices:
    A: Como una forma válida de identificación para abordar vuelos
    B: Únicamente para fines de conducción dentro del estado de Delaware
    C: Para fines de conducción en cualquier estado de los EE. UU.
    D: Como prueba de presencia legal en los Estados Unidos
  answer: B
  explanation: El manual explica que la DPC 'se emite únicamente para fines de conducción
    dentro del estado de Delaware y no debe utilizarse como una forma válida de identificación'.
- id: 125
  category: license_system
  question: ¿Cuál es el costo de una Tarjeta de Privilegio de Conducir (DPC) y por
    cuánto tiempo es válida?
  choices:
    A: $20.00, válida por 4 años
    B: $40.00, válida por 8 años
    C: $72.00, válida por 4 años
    D: $20.00, válida por 5 años
  answer: A
  explanation: Según el manual, 'El costo de la DPC es de $20.00 y es válida por un
    período de 4 años'.
- id: 126
  category: license_system
  question: Al solicitar una DPC, ¿qué tarifa cobra la Oficina Estatal de Identificación
    (SBI) por las huellas dactilares y la validación de la identificación?
  choices:
    A: $20
    B: $48
    C: $72
    D: $100
  answer: C
  explanation: El manual establece que durante el proceso de la DPC, 'la SBI tomará
    las huellas dactilares, validará la identificación y cobrará una tarifa de $72'.
- id: 127
  category: license_system
  question: 'Para obtener una DPC, los solicitantes deben presentar una Certificación
    de Cumplimiento de Presentación que confirme que han presentado los impuestos
    de Delaware de los últimos:'
  choices:
    A: Un año
    B: Dos años
    C: Tres años
    D: Cinco años
  answer: B
  explanation: Los solicitantes deben obtener un documento de Certificación de Cumplimiento
    de Presentación de la División de Ingresos de Delaware 'que confirme que han presentado
    los impuestos de Delaware de los dos años anteriores'.
- id: 128
  category: license_system
  question: Si un solicitante de una Tarjeta de Privilegio de Conducir es menor de
    18 años, ¿qué documento adicional debe presentar?
  choices:
    A: Una carta del director de su escuela secundaria
    B: Una copia original y traducida de su certificado de nacimiento
    C: Una autorización firmada por un instructor de manejo
    D: Comprobante de empleo
  answer: B
  explanation: La Tabla de Documentos Requeridos para la DPC establece que si el solicitante
    es menor de 18 años, 'también debe tener una copia original y traducida del certificado
    de nacimiento'.
- id: 129
  category: license_system
  question: ¿Cuál de los siguientes es un documento alternativo aprobado específicamente
    para solicitantes de México que solicitan una DPC?
  choices:
    A: Credencial para Votar del Instituto Federal Electoral (IFE) de México
    B: Licencia de conducir mexicana
    C: Certificado de nacimiento mexicano
    D: Tarjeta de Seguro Social mexicana
  answer: A
  explanation: El manual enumera la 'Credencial para Votar del Instituto Federal Electoral
    (IFE) Credencial para Votar' como un documento alternativo aprobado para México.
- id: 130
  category: license_system
  question: ¿La tarjeta de registro consular de cuál de los siguientes países NO figura
    explícitamente como aceptada para una DPC en el manual?
  choices:
    A: Brasil
    B: Colombia
    C: Argentina
    D: Ecuador
  answer: C
  explanation: El manual enumera las tarjetas consulares válidas aceptadas de Brasil,
    Colombia, Ecuador, Guatemala y México. Argentina no está en esta lista.
- id: 131
  category: license_system
  question: ¿Si un documento requerido para una Tarjeta de Privilegio de Conducir
    (Driving Privilege Card) está en un idioma extranjero, qué debe acompañarlo?
  choices:
    A: Un resumen notarizado del documento
    B: Una traducción al inglés realizada por un traductor profesional
    C: Una traducción verbal proporcionada por el solicitante
    D: Una traducción completada por un miembro de la familia
  answer: B
  explanation: El manual requiere que 'los documentos en idiomas extranjeros deben
    ser traducidos al inglés por un traductor profesional y acompañar al documento
    original en el idioma extranjero'.
- id: 132
  category: license_system
  question: 'Para ser aceptado como prueba de residencia en Delaware, el correo debe
    tener el sello postal o haber sido recibido dentro de los últimos:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: 'El manual establece: ''El correo debe haber sido entregado por el
    USPS y tener el sello postal o haber sido recibido dentro de los últimos 60 días''.'
- id: 133
  category: license_system
  question: ¿Qué documento debe presentar un solicitante como prueba de haber aprobado
    un curso certificado de educación vial de Delaware?
  choices:
    A: Un Certificado Rojo/Blanco
    B: Un Certificado Azul/Blanco
    C: Un Certificado Oro/Azul
    D: Un Certificado Verde/Blanco
  answer: B
  explanation: Los solicitantes deben presentar un Certificado de Educación Vial de
    Delaware (Certificado Azul/Blanco) como prueba de que aprobaron un curso certificado
    de educación vial de Delaware.
- id: 134
  category: driver_responsibility
  question: ¿Cuál es la responsabilidad legal del patrocinador que firma una solicitud
    del programa de Licencia de Conducir Graduada (GDL)?
  choices:
    A: Son los únicos responsables de cualquier multa de tráfico que reciba el solicitante.
    B: Son solidariamente responsables con el solicitante de la GDL por cualquier
      daño resultante de la negligencia del solicitante.
    C: Deben pagar las primas del seguro de automóvil del solicitante.
    D: No son responsables del solicitante una vez que se emite el permiso.
  answer: B
  explanation: El patrocinador es considerado solidariamente responsable con el solicitante
    de la GDL por cualquier daño resultante de la negligencia del solicitante de la
    GDL.
- id: 135
  category: license_system
  question: ¿Cuál es la tarifa para una licencia Clase D y por cuánto tiempo es válida
    la nueva licencia?
  choices:
    A: $25.00 por 5 años
    B: $40.00 por 8 años
    C: $50.00 por 10 años
    D: $40.00 por 5 años
  answer: B
  explanation: El solicitante debe pagar una tarifa de $40.00 por la licencia Clase
    D y pasar un examen de la vista al momento de la solicitud. Todas las licencias
    nuevas serán licencias de 8 años.
- id: 136
  category: safe_driving_rules
  question: 'Mientras opera un vehículo motorizado, el titular de un Permiso de Aprendiz
    de Nivel Uno (Level One Learner''s Permit):'
  choices:
    A: Puede usar un teléfono celular solo si es manos libres.
    B: Puede usar un dispositivo de mensajería de texto solo cuando esté detenido
      en un semáforo en rojo.
    C: No debe operar un vehículo motorizado mientras usa un teléfono celular o un
      dispositivo electrónico similar.
    D: Puede usar un teléfono celular solo para llamar a su patrocinador.
  answer: C
  explanation: El titular del permiso no debe operar un vehículo motorizado mientras
    usa un teléfono celular, un dispositivo de mensajería de texto o un dispositivo
    electrónico similar.
- id: 137
  category: license_system
  question: ¿Cuáles son los requisitos para el conductor supervisor de un titular
    de un Permiso de Aprendiz de Nivel Uno?
  choices:
    A: Debe tener al menos 21 años y haber tenido una licencia durante 3 años.
    B: Debe tener al menos 25 años y haber tenido una licencia Clase D durante al
      menos 5 años.
    C: Debe tener al menos 18 años y ser un miembro de la familia inmediata.
    D: Debe ser un instructor certificado de educación vial.
  answer: B
  explanation: El supervisor debe ser un padre, tutor o conductor con licencia debidamente
    autorizado (aprobado por el patrocinador) que tenga al menos 25 años de edad y
    haya tenido una licencia Clase D durante al menos 5 años.
- id: 138
  category: safe_driving_rules
  question: ¿Dónde debe estar sentado el conductor supervisor cuando el titular de
    un Permiso de Aprendiz de Nivel Uno está conduciendo?
  choices:
    A: En cualquier lugar del vehículo, siempre que tenga una vista clara del conductor.
    B: En el asiento trasero directamente detrás del conductor.
    C: Al lado del titular del permiso en el asiento delantero del vehículo.
    D: En el asiento delantero o en el asiento trasero, siempre que lleve puesto el
      cinturón de seguridad.
  answer: C
  explanation: El conductor supervisor debe estar sentado al lado del titular del
    permiso en el asiento delantero del vehículo cuando este esté en movimiento. Ninguna
    otra persona que no sea el conductor supervisor puede estar en el asiento delantero.
- id: 139
  category: license_system
  question: 'Durante los primeros seis meses después de la emisión de un Permiso de
    Aprendiz de Nivel Uno, el titular del permiso:'
  choices:
    A: Puede conducir sin supervisión durante las horas del día.
    B: Debe ser supervisado en todo momento.
    C: Puede conducir sin supervisión hacia y desde la escuela.
    D: Debe completar 100 horas de conducción.
  answer: B
  explanation: Durante los primeros seis meses después de la emisión de un Permiso
    de Aprendiz de Nivel Uno, el titular del permiso debe ser supervisado en todo
    momento.
- id: 140
  category: driver_testing
  question: ¿Cuántas horas de experiencia de conducción debe certificar el patrocinador
    que el titular del permiso ha completado durante los primeros seis meses?
  choices:
    A: 30 horas, incluyendo 5 horas de conducción nocturna.
    B: 40 horas, incluyendo 10 horas de conducción nocturna.
    C: 50 horas, incluyendo 10 horas de conducción nocturna.
    D: 60 horas, incluyendo 15 horas de conducción nocturna.
  answer: C
  explanation: El patrocinador debe certificar que el titular del permiso ha conducido
    durante 50 horas; 10 de las cuales incluyen conducción nocturna.
- id: 141
  category: safe_driving_rules
  question: ¿Después de los primeros seis meses de autoridad de conducción válida
    del Permiso de Aprendiz de Nivel Uno (Level One Learner's Permit), entre qué horas
    puede conducir sin supervisión el titular del permiso?
  choices:
    A: 5:00 a.m. y 9:00 p.m.
    B: 6:00 a.m. y 10:00 p.m.
    C: 7:00 a.m. y 11:00 p.m.
    D: 6:00 a.m. y 8:00 p.m.
  answer: B
  explanation: Después de los primeros seis meses de autoridad de conducción válida
    del Permiso de Aprendiz de Nivel Uno, el titular del permiso puede conducir sin
    supervisión entre las 6:00 a.m. y las 10:00 p.m.
- id: 142
  category: license_system
  question: 'Durante los segundos seis meses del programa GDL, un titular de permiso
    puede conducir sin supervisión entre las 10:00 p.m. y las 6:00 a.m. ÚNICAMENTE
    cuando se dirija directamente hacia y desde:'
  choices:
    A: Actividades religiosas, actividades laborales y actividades escolares en propiedad
      escolar.
    B: Tiendas de comestibles, gasolineras e instalaciones médicas.
    C: Reuniones familiares, eventos deportivos y grupos de estudio.
    D: Cualquier ubicación dentro de un radio de 10 millas de su hogar.
  answer: A
  explanation: 'Excepción: El titular del permiso puede viajar sin supervisión durante
    esas horas cuando se dirija directamente hacia y desde actividades religiosas,
    actividades laborales y actividades escolares del titular del permiso en propiedad
    escolar.'
- id: 143
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción al violar las restricciones
    del Permiso de Aprendiz de Nivel Uno?
  choices:
    A: Una multa de $100 y 2 puntos en el historial de conducción.
    B: Una suspensión de un mes de los privilegios de conducción.
    C: Una suspensión de dos meses de los privilegios de conducción.
    D: Revocación inmediata del permiso hasta los 18 años.
  answer: C
  explanation: Las personas que violen las restricciones del Permiso de Aprendiz de
    Nivel Uno se consideran como conductores sin licencia, lo que resultará en una
    suspensión de dos meses por la primera infracción.
- id: 144
  category: license_system
  question: ¿Qué sucede con un Permiso de Aprendiz de Nivel Uno del GDL una vez que
    el titular del permiso ha completado 12 meses completos de autoridad de conducción
    válida?
  choices:
    A: El titular del permiso debe volver a tomar el examen de habilidades viales.
    B: El permiso se convierte automáticamente en una licencia Clase D.
    C: El titular del permiso debe pagar una tarifa adicional de $40 para la actualización.
    D: El permiso vence y el conductor debe solicitarlo de nuevo.
  answer: B
  explanation: El Permiso de Aprendiz de Nivel Uno del GDL se convertirá automáticamente
    en una licencia Clase D una vez que el titular del permiso haya completado 12
    meses completos de autoridad de conducción válida.
- id: 145
  category: safe_driving_rules
  question: Durante el segundo período de seis meses del programa GDL, cuando NO hay
    un supervisor presente, ¿cuál es la restricción de pasajeros?
  choices:
    A: No se permiten pasajeros en el vehículo.
    B: Solo se permiten miembros de la familia inmediata en el vehículo.
    C: Solo un pasajero adicional además del conductor puede estar en el vehículo.
    D: Se permiten hasta tres pasajeros si llevan puesto el cinturón de seguridad.
  answer: C
  explanation: Durante el segundo período de seis meses de conducción sin supervisión,
    cuando no hay un supervisor presente, solo un pasajero adicional además del conductor
    puede estar en el vehículo.
- id: 146
  category: license_system
  question: ¿Cuándo se convierte automáticamente un Permiso de Aprendiz de Nivel Uno
    del GDL en una licencia Clase D?
  choices:
    A: Después de 6 meses de autoridad de conducción válida
    B: Después de 12 meses de autoridad de conducción válida
    C: Cuando el conductor cumple 18 años
    D: Después de aprobar un segundo examen de habilidades viales
  answer: B
  explanation: Según el manual, el Permiso de Aprendiz de Nivel Uno del GDL se convertirá
    automáticamente en una licencia Clase D una vez que el titular del permiso haya
    completado 12 meses completos de autoridad de conducción válida.
- id: 147
  category: driver_responsibility
  question: Si es mayor de 18 años y está aprendiendo a conducir con un permiso de
    instrucción temporal, ¿debe estar acompañado por un conductor con licencia que
    tenga al menos qué edad?
  choices:
    A: 18 años de edad
    B: 21 años de edad
    C: 25 años de edad
    D: 30 años de edad
  answer: B
  explanation: El manual establece que mientras aprende a conducir, debe estar acompañado
    por un conductor con licencia que esté calificado para conducir la clase de vehículo
    en el que se está entrenando, y debe tener al menos 21 años de edad.
- id: 148
  category: driver_testing
  question: ¿Cuánto tiempo debe esperar un solicitante por primera vez mayor de 18
    años después de que se emite su permiso de aprendiz antes de poder realizar un
    examen vial?
  choices:
    A: Al menos 10 días
    B: Al menos 30 días
    C: Al menos 60 días
    D: Al menos 6 meses
  answer: A
  explanation: Para obtener su licencia, debe realizar un examen vial, pero no antes
    de que hayan pasado al menos 10 días desde que se emitió el permiso.
- id: 149
  category: license_system
  question: Si se muda a Delaware desde otro estado, ¿cuántos días tiene para solicitar
    una licencia de conducir de Delaware después de convertirse en residente?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Si se muda a Delaware desde otro estado, debe solicitar una licencia
    de conducir de Delaware dentro de los 60 días posteriores a convertirse en residente.
- id: 150
  category: license_system
  question: Al transferir una licencia de conducir de otro estado a Delaware, ¿cuál
    de los siguientes endosos no es transferible?
  choices:
    A: Motocicleta
    B: Pasajeros (P)
    C: Taxi/Limusina (Z)
    D: Camión cisterna (N)
  answer: C
  explanation: El manual establece explícitamente que el endoso de Taxi/Limusina (Z)
    no es transferible.
- id: 151
  category: driver_testing
  question: Delaware tiene un acuerdo de reciprocidad que exime a los conductores
    de los exámenes de conocimientos y de carretera para una licencia Clase D si se
    transfieren de ¿cuál de los siguientes países?
  choices:
    A: Canadá
    B: México
    C: Alemania
    D: Reino Unido
  answer: C
  explanation: Delaware tiene un acuerdo de reciprocidad con Alemania, Taiwán (República
    de China) y Francia, eximiendo así a estos conductores de los exámenes de conocimientos
    y de carretera únicamente para una licencia Clase D.
- id: 152
  category: license_system
  question: Si un solicitante menor de edad (menor de 18 años) se muda a Delaware
    y ha tenido una licencia de conducir de otro estado por menos de 12 meses, ¿a
    qué es elegible?
  choices:
    A: Una licencia de operador Clase D
    B: Un Permiso de Aprendizaje de Nivel Uno (Level One Learner's Permit)
    C: Una licencia de conducir permanente
    D: Una licencia comercial restringida
  answer: B
  explanation: Si al solicitante menor de edad se le emitió una licencia de otro estado
    por menos de 12 meses, puede ser elegible para un Permiso de Aprendizaje de Nivel
    Uno (Level One Learner's Permit).
- id: 153
  category: license_system
  question: ¿Por cuántos años se emite típicamente una licencia de conducir estándar
    de Delaware antes de que deba ser renovada?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: Las licencias de conducir de Delaware se emitirán por ocho años, con
    la excepción de la duración de la estancia por inmigración, los titulares de endoso
    de materiales peligrosos (hazmat) y los titulares de la Tarjeta de Privilegio
    de Conducir.
- id: 154
  category: penalties_and_points
  question: ¿Cuál es el cargo por pago tardío que se cobra si renueva su licencia
    de conducir de Delaware después de la fecha de vencimiento?
  choices:
    A: $5.00
    B: $10.00
    C: $12.00
    D: $20.00
  answer: B
  explanation: Se cobra un cargo por pago tardío de $10.00 si la renovación se realiza
    después de la fecha de vencimiento.
- id: 155
  category: license_system
  question: ¿Con cuánta antelación puede renovar una licencia de conducir estándar
    de Delaware antes de su fecha de vencimiento?
  choices:
    A: Hasta 30 días antes
    B: Hasta 60 días antes
    C: Hasta 90 días antes
    D: Hasta 180 días antes
  answer: D
  explanation: Puede renovar en cualquier momento durante el período de 180 días (seis
    meses) antes del vencimiento de su licencia.
- id: 156
  category: penalties_and_points
  question: ¿Qué sucede con una licencia de conducir permanente si es suspendida o
    revocada?
  choices:
    A: Se destruye permanentemente y no puede ser reemplazada.
    B: Se cambia a una licencia Clase D al ser restablecida.
    C: Se restablece como una licencia permanente después de una tarifa de $50.
    D: Se convierte en un Permiso de Aprendizaje de Nivel Uno.
  answer: B
  explanation: Siempre que una licencia permanente sea suspendida o revocada, se cambia
    a una licencia Clase D al momento del restablecimiento.
- id: 157
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por conducir sin el equipo requerido especificado
    en una licencia restringida (como lentes)?
  choices:
    A: Se le requerirá volver a tomar el examen de carretera.
    B: Está sujeto a arresto y su licencia puede ser suspendida.
    C: Recibirá una advertencia y una multa de $10.
    D: Su licencia será revocada permanentemente sin posibilidad de restablecimiento.
  answer: B
  explanation: Si conduce sin el equipo requerido, está sujeto a arresto y su licencia
    de conducir puede ser suspendida.
- id: 158
  category: license_system
  question: ¿Cuál es la tarifa para obtener un reemplazo de la licencia de conducir
    si la suya se pierde, es robada o se destruye?
  choices:
    A: $1.15
    B: $10.00
    C: $20.00
    D: $24.00
  answer: C
  explanation: Si su licencia se pierde, es robada o se destruye, puede solicitarla
    en línea o acudir a la División para obtener una licencia de reemplazo que se
    emitirá por una tarifa de $20.00.
- id: 159
  category: license_system
  question: Después de cambiar legalmente su nombre, ¿cuánto tiempo tiene para comparecer
    en persona ante el DMV para cambiar el nombre en su licencia de conducir?
  choices:
    A: 10 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Dentro de los 30 días posteriores al cambio legal de su nombre, debe
    comparecer en persona ante el DMV para cambiar el nombre en su licencia de conducir
    o tarjeta de identificación.
- id: 160
  category: driver_responsibility
  question: ¿Cuántos días tiene para notificar a la División de Vehículos Motorizados
    después de cambiar su dirección en Delaware?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Después de cambiar su dirección en Delaware, tiene 30 días para notificar
    tanto a la Sección de Registro de Vehículos como a la de Licencias de Conducir
    de la División de Vehículos Motorizados.
- id: 161
  category: license_system
  question: ¿Por cuánto tiempo es válida una tarjeta de identificación de Delaware
    antes de que expire?
  choices:
    A: Cuatro años desde la fecha de emisión
    B: Cinco años a partir del próximo cumpleaños del solicitante
    C: Ocho años a partir del próximo cumpleaños del solicitante
    D: Diez años desde la fecha de emisión
  answer: C
  explanation: La tarifa para una tarjeta de identificación es de $40.00 y vence ocho
    años después del próximo cumpleaños del solicitante.
- id: 162
  category: license_system
  question: ¿Quién debe acompañar a un solicitante menor de 18 años que solicita una
    tarjeta de identificación?
  choices:
    A: Cualquier adulto mayor de 21 años
    B: Un patrocinador que sea la madre, el padre o el tutor designado por el tribunal
    C: Un instructor de manejo con licencia
    D: Un hermano mayor con una licencia de conducir válida
  answer: B
  explanation: Un patrocinador que sea la madre o el padre o un tutor designado por
    el tribunal, según conste en el certificado de nacimiento del menor, debe acompañar
    a cualquier solicitante menor de 18 años.
- id: 163
  category: license_system
  question: ¿Cuál de los siguientes NO figura como un documento original aceptable
    para demostrar el servicio militar para un indicador de veterano?
  choices:
    A: DD-214
    B: Certificado de baja honorable (Honorable Discharge Certificate)
    C: Diploma de escuela secundaria
    D: Identificación militar (Military ID)
  answer: C
  explanation: Los documentos aceptables para demostrar el servicio militar incluyen
    una identificación militar (Military ID), NGB-22, DD-214, DD-256, Certificado
    de baja honorable (Honorable Discharge Certificate) o una licencia de conducir
    válida de otro estado con una designación de veterano.
- id: 164
  category: license_system
  question: ¿Cuál es la tarifa para agregar un indicador de veterano a su licencia
    de conducir fuera de una transacción de renovación o duplicado?
  choices:
    A: Siempre es gratis
    B: $5.00
    C: $10.00
    D: $40.00
  answer: C
  explanation: El indicador de veterano se puede agregar de forma gratuita durante
    las transacciones de renovación o duplicado. De lo contrario, hay una tarifa de
    $10.00.
- id: 165
  category: driver_responsibility
  question: ¿A qué edad mínima puede un residente de Delaware registrarse para votar
    en el DMV, siempre que cumpla 18 años para el día de las elecciones generales?
  choices:
    A: 15 años de edad
    B: 16 años de edad
    C: 17 años de edad
    D: 18 años de edad
  answer: B
  explanation: Puede registrarse para votar si es ciudadano de los EE. UU., residente
    de buena fe de Delaware, tiene al menos 16 años de edad y es mentalmente competente.
- id: 166
  category: driver_responsibility
  question: Si se registra automáticamente para votar al solicitar una licencia de
    conducir de Delaware, ¿bajo qué partido político se le registrará de forma predeterminada?
  choices:
    A: Demócrata
    B: Republicano
    C: Independiente
    D: No afiliado (Unaffiliated)
  answer: D
  explanation: De conformidad con la ley de Delaware, las personas elegibles que son
    registradas automáticamente para votar por el Departamento de Elecciones se registran
    como No Afiliadas (Unaffiliated).
- id: 167
  category: license_system
  question: ¿De qué color es el indicador médico voluntario que puede aparecer en
    una licencia de conducir de Delaware?
  choices:
    A: Rojo
    B: Azul
    C: Verde
    D: Amarillo
  answer: B
  explanation: Un indicador médico azul puede aparecer en el documento como un medio
    para que el titular comparta una condición médica con quienes brindan atención
    médica de emergencia.
- id: 168
  category: driver_responsibility
  question: 'La tarjeta de comunicación para el parasol (Visor Communication card)
    está disponible a pedido para personas que son:'
  choices:
    A: Discapacitadas visuales
    B: Sordas o con dificultades auditivas
    C: Discapacitadas físicamente
    D: No hablan inglés
  answer: B
  explanation: La solicitud de la tarjeta de comunicación para el parasol (Visor Communication
    card) para personas sordas o con dificultades auditivas está disponible a pedido
    y en el sitio web.
- id: 169
  category: penalties_and_points
  question: Según la Ley de Megan (Megan's Law), ¿cuántos días tiene un delincuente
    sexual condenado para registrarse después de llegar a un condado, ciudad o pueblo
    de Delaware para residir?
  choices:
    A: 3 días
    B: 7 días
    C: 14 días
    D: 30 días
  answer: B
  explanation: El registro debe realizarse dentro de los siete días posteriores a
    la llegada a cualquier condado, ciudad o pueblo en el que resida temporalmente
    o esté domiciliado durante ese período de tiempo.
- id: 170
  category: license_system
  question: ¿A quién podría revelar la División de Vehículos Motorizados (DMV) su
    número de Seguro Social obligatorio?
  choices:
    A: A personas privadas que lo soliciten
    B: A empresas locales para verificaciones de antecedentes
    C: A agencias estatales para llevar a cabo sus funciones gubernamentales
    D: A empresas de marketing
  answer: C
  explanation: Los números de seguro social no se revelarán a empresas ni a personas
    privadas, pero pueden revelarse a agencias estatales para llevar a cabo sus funciones
    gubernamentales.
- id: 171
  category: driver_responsibility
  question: 'Para los solicitantes masculinos, firmar una solicitud de licencia de
    conducir o tarjeta de identificación constituye el consentimiento para:'
  choices:
    A: Unirse a la Guardia Nacional
    B: Registrarse en el Sistema de Servicio Selectivo si es necesario
    C: Convertirse en donante de órganos
    D: Registrarse como votante no afiliado
  answer: B
  explanation: Los solicitantes masculinos deben entender que su firma en las solicitudes
    de licencia o tarjeta de identificación constituye el consentimiento para ser
    registrados en el Sistema de Servicio Selectivo, si así se requiere.
- id: 172
  category: driver_responsibility
  question: ¿Cuántos contactos de emergencia puede designar en el registro voluntario
    de Allegados (Next of Kin) de Delaware?
  choices:
    A: Uno
    B: Hasta dos
    C: Hasta tres
    D: Ilimitados
  answer: B
  explanation: El registro de Allegados (Next of Kin) de Delaware es un programa voluntario
    diseñado para ofrecer a los ciudadanos de Delaware la opción de designar hasta
    dos contactos de emergencia diferentes, uno primario y uno secundario.
- id: 173
  category: driver_responsibility
  question: ¿Qué símbolo aparecerá en su licencia de conducir de Delaware si elige
    ser donante de órganos y tejidos?
  choices:
    A: Una cruz médica azul
    B: Una cinta verde
    C: Un corazón rojo
    D: Una estrella de plata
  answer: C
  explanation: Si acepta ser donante de órganos y tejidos, aparecerá un "CORAZÓN ROJO"
    en su licencia.
- id: 174
  category: alcohol_drugs_health
  question: ¿Qué protección brinda la Ley del Buen Samaritano de Delaware a alguien
    que llama al 9-1-1 por una persona que está sufriendo una sobredosis de drogas?
  choices:
    A: Protección contra el enjuiciamiento por posesión de una sustancia ilegal
    B: Una recompensa monetaria por salvar una vida
    C: Inmunidad frente a todas las futuras infracciones de tráfico
    D: Reemplazo gratuito de su licencia de conducir
  answer: A
  explanation: Las Leyes del Buen Samaritano de Delaware protegen a las personas que
    solicitan asistencia médica para alguien que está sufriendo una sobredosis de
    drogas o alcohol de ser enjuiciadas por posesión de una sustancia ilegal.
- id: 175
  category: alcohol_drugs_health
  question: Bajo las leyes del Buen Samaritano, ¿las personas están protegidas de
    daños civiles por administrar qué medicamento vital durante una sobredosis de
    opioides?
  choices:
    A: Insulina
    B: Naloxona
    C: Epinefrina
    D: Penicilina
  answer: B
  explanation: Según el manual, las leyes del Buen Samaritano protegen a las personas
    de daños civiles por administrar naloxona, un medicamento vital que puede revertir
    una sobredosis de opioides.
- id: 176
  category: driver_responsibility
  question: ¿Cuál de las siguientes se considera una señal de alerta de trata de personas
    en un negocio o residencia?
  choices:
    A: Un negocio con ventanas grandes y abiertas y puertas sin llave
    B: Trabajadores que viajan largas distancias hasta el lugar de trabajo
    C: Comunicación restringida o controlada donde no se permite que la persona hable
      por sí misma
    D: Empleados que toman descansos frecuentes y sin supervisión
  answer: C
  explanation: El manual enumera varias señales de alerta de trata de personas, incluyendo
    la comunicación restringida o controlada donde no se permite que la persona hable
    por sí misma, o ser vigilada o seguida.
- id: 177
  category: license_system
  question: 'Una licencia de operador Clase D es válida para un solo vehículo motorizado
    con una Clasificación de Peso Bruto del Vehículo (GVWR) no mayor a:'
  choices:
    A: 10,000 libras
    B: 16,000 libras
    C: 26,000 libras
    D: 32,000 libras
  answer: C
  explanation: Una licencia de operador Clase D es válida para cualquier vehículo
    motorizado individual, y un remolque, con una clasificación de peso bruto del
    vehículo (GVWR) no mayor a 26,000 libras.
- id: 178
  category: license_system
  question: ¿Se exonera el requisito de una Licencia de Conducir Comercial (CDL) al
    operar cuál de los siguientes vehículos?
  choices:
    A: Un autobús escolar que transporta 16 o más pasajeros
    B: Un camión de reparto para un negocio comercial
    C: Vehículos recreativos personales
    D: Un vehículo que transporta materiales peligrosos
  answer: C
  explanation: El manual establece que el requisito de una CDL se exonera cuando el
    conductor opera equipo agrícola, equipo de extinción de incendios, vehículos recreativos
    o miembros militares que operan vehículos militares.
- id: 179
  category: license_system
  question: Para calificar para una exención de CDL, ¿un vehículo agrícola debe usarse
    dentro de cuántas millas de la granja de la persona?
  choices:
    A: 50 millas
    B: 100 millas
    C: 150 millas
    D: 200 millas
  answer: C
  explanation: Para calificar para la exención de CDL para vehículos agrícolas, el
    vehículo debe usarse dentro de las 150 millas de la granja de la persona.
- id: 180
  category: license_system
  question: 'Al conducir con un Permiso de Aprendizaje Comercial (CLP), se le permite
    conducir un Vehículo Motorizado Comercial (CMV) solo si:'
  choices:
    A: Está conduciendo durante las horas del día
    B: Está acompañado por otro conductor con licencia CDL calificado en el mismo
      tipo de CMV
    C: No transporta ninguna carga
    D: Permanece dentro de las 50 millas de su hogar
  answer: B
  explanation: Un permiso de aprendizaje CDL le permite conducir un Vehículo Motorizado
    Comercial (CMV), pero solo con otro conductor con licencia CDL calificado en el
    mismo tipo de CMV.
- id: 181
  category: license_system
  question: 'Se requiere una licencia CDL Clase A para una combinación de vehículos
    con una Clasificación de Peso Bruto Combinado (GVWR) de 26,001 libras o más, siempre
    que la unidad remolcada supere las:'
  choices:
    A: 5,000 libras
    B: 10,000 libras
    C: 15,000 libras
    D: 20,000 libras
  answer: B
  explanation: Se requiere una licencia CDL Clase A para cualquier combinación de
    vehículos con un GVWR de 26,001 libras o más, siempre que el GVWR de la(s) unidad(es)
    remolcada(s) sea superior a 10,000 libras.
- id: 182
  category: license_system
  question: ¿Qué clase de CDL se requiere para un vehículo con un GVWR de menos de
    26,001 libras que está diseñado para transportar 16 o más pasajeros?
  choices:
    A: CDL Clase A
    B: CDL Clase B
    C: CDL Clase C
    D: Clase A no comercial
  answer: C
  explanation: Se requiere una licencia CDL Clase C para vehículos con un GVWR de
    menos de 26,001 libras que estén diseñados para transportar 16 o más pasajeros
    (incluido el conductor) o que se utilicen para transportar materiales peligrosos.
- id: 183
  category: license_system
  question: 'Un Permiso de Aprendizaje Clase D autoriza al titular a operar un vehículo
    Clase D bajo la condición de que esté acompañado por un conductor con la licencia
    adecuada mayor de:'
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: 30 años
  answer: B
  explanation: El permiso autoriza a sus titulares a operar un vehículo Clase D bajo
    la condición de que el titular del permiso esté acompañado por un conductor con
    la licencia adecuada mayor de 21 años.
- id: 184
  category: license_system
  question: 'Cuando se encuentra temporalmente fuera del estado, se puede emitir una
    licencia temporal por única vez a un operador válido de Clase D por un período
    que no exceda los:'
  choices:
    A: Tres meses
    B: Seis meses
    C: Nueve meses
    D: Doce meses
  answer: B
  explanation: Se emite una licencia temporal por única vez por un período que no
    exceda los seis meses para extender la fecha de vencimiento o reemplazar una licencia
    extraviada cuando se encuentra temporalmente fuera del estado.
- id: 185
  category: license_system
  question: 'Las personas menores de 18 años que soliciten un endoso de motocicleta
    deben:'
  choices:
    A: Completar el Programa de Educación para Motociclistas
    B: Tener al menos 5 años de experiencia de conducción
    C: Solo conducir motocicletas con sidecar
    D: Pagar un recargo de $50.00
  answer: A
  explanation: Las personas menores de 18 años deben tener la solicitud de motocicleta
    firmada por sus padres o tutor legal y deben completar el Programa de Educación
    para Motociclistas aprobado por la División.
- id: 186
  category: safe_driving_rules
  question: ¿Por cuánto tiempo deben un motociclista recién endosado y sus pasajeros
    usar casco y protección para los ojos?
  choices:
    A: Durante los primeros 6 meses
    B: Durante el primer año
    C: Durante los primeros 2 años
    D: Hasta que cumplan 21 años
  answer: C
  explanation: Cualquier persona que obtenga un nuevo endoso para motocicleta, o alguien
    que viaje con la persona recién endosada, está obligada por ley a usar casco y
    protección para los ojos durante los primeros 2 años después de recibir el endoso.
- id: 187
  category: license_system
  question: Un permiso de aprendizaje de motocicleta es válido inicialmente por seis
    meses. ¿Cuántas veces se puede extender por seis meses adicionales?
  choices:
    A: No se puede extender
    B: Solo una vez
    C: Dos veces
    D: Ilimitadas veces
  answer: B
  explanation: Una vez que haya aprobado el examen de conocimientos, se le otorgará
    un permiso de motocicleta que es válido por seis meses. Puede extender el permiso
    solo una vez por seis meses adicionales.
- id: 188
  category: license_system
  question: ¿Cuál de las siguientes es una restricción al operar una motocicleta con
    un permiso de instrucción temporal?
  choices:
    A: No debe exceder las 45 mph
    B: No se le permite operar en el sistema de autopistas interestatales federales
    C: Solo puede conducir los fines de semana
    D: Debe conducir con un instructor de motocicletas con licencia en todo momento
  answer: B
  explanation: 'Las restricciones para un permiso de aprendizaje de motocicleta incluyen:
    no llevar pasajeros, no operar entre el atardecer y el amanecer, uso obligatorio
    de casco y protección para los ojos, y no se permite la operación en el sistema
    de autopistas interestatales federales.'
- id: 189
  category: license_system
  question: 'Al operar una motocicleta con un permiso de aprendizaje, se prohíbe conducir
    entre:'
  choices:
    A: El atardecer y el amanecer
    B: Las 10:00 PM y las 6:00 AM
    C: La medianoche y las 5:00 AM
    D: Horarios de tráfico de hora pico
  answer: A
  explanation: Una de las restricciones al operar una motocicleta con un permiso de
    instrucción temporal es que está prohibido operar la motocicleta entre el atardecer
    y el amanecer.
- id: 190
  category: license_system
  question: ¿Cuál es la tarifa para solicitar una extensión de un permiso de instrucción
    temporal de motocicleta en el DMV?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: A
  explanation: Debe solicitar una extensión en el DMV antes de la fecha de vencimiento
    y pagar una tarifa de $5.00.
- id: 191
  category: license_system
  question: ¿Para obtener un endoso de autobús escolar, un conductor no debe tener
    más de cuántos puntos en su historial durante los últimos tres años?
  choices:
    A: Tres puntos
    B: Cuatro puntos
    C: Cinco puntos
    D: Seis puntos
  answer: C
  explanation: Los conductores no deben tener más de cinco puntos (valor total de
    puntos) en su historial durante los últimos tres años para obtener un endoso de
    autobús escolar.
- id: 192
  category: license_system
  question: ¿Son transferibles a Delaware los endosos de taxi/limusina de otros estados?
  choices:
    A: Sí, si el conductor aprueba un examen de la vista.
    B: Sí, si el conductor paga una tarifa de transferencia.
    C: No, los endosos de taxi/limusina de otros estados no son transferibles.
    D: No, a menos que el conductor haya tenido el endoso por más de 5 años.
  answer: C
  explanation: 'El manual establece explícitamente: "NOTA: Los endosos de taxi/limusina
    de otros estados no son transferibles".'
- id: 193
  category: driver_testing
  question: Si sus privilegios de conducción de Clase D han estado vencidos por más
    de un año pero menos de cinco años, ¿qué exámenes debe realizar para volver a
    solicitarlos?
  choices:
    A: Solo el examen de la vista
    B: Los exámenes de la vista y de conocimientos de Clase D
    C: Los exámenes de la vista, conocimientos y de carretera
    D: Solo el examen de carretera
  answer: B
  explanation: Si sus privilegios de conducción de Clase D han estado vencidos por
    más de un año, se requiere que realice el examen de la vista y el examen de conocimientos
    de Clase D.
- id: 194
  category: driver_testing
  question: ¿Qué exámenes debe realizar si sus privilegios de conducción de Clase
    D han sido revocados por más de 5 años?
  choices:
    A: Solo los exámenes de la vista y de conocimientos
    B: Solo los exámenes de conocimientos y de carretera
    C: Los exámenes de la vista, conocimientos y de carretera
    D: Solo el examen de carretera
  answer: C
  explanation: Si han pasado más de 5 años desde que sus privilegios de conducción
    de Clase D fueron revocados, debe volver a solicitar su licencia de Clase D y
    realizar los exámenes de la vista, conocimientos y de carretera.
- id: 195
  category: driver_testing
  question: ¿Cuál es la visión mínima aceptable para una licencia de conducir estándar
    de Delaware?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: La visión mínima aceptable para una licencia de conducir de Delaware
    es 20/40, con o sin anteojos o lentes de contacto.
- id: 196
  category: driver_testing
  question: ¿Bajo qué condición se le puede otorgar a un conductor el permiso para
    conducir solo durante el día?
  choices:
    A: Si su visión está entre 20/40 y 20/50
    B: Si su visión es 20/20 en un solo ojo
    C: Si tiene más de 70 años
    D: Si reprueba el examen de señales y semáforos de la carretera
  answer: A
  explanation: Se puede otorgar el permiso para conducir solo durante el día si su
    visión está entre 20/40 y 20/50.
- id: 197
  category: driver_testing
  question: ¿Qué tan pronto es elegible para realizar un examen de carretera de Clase
    D después de aprobar el examen de conocimientos?
  choices:
    A: Inmediatamente
    B: 5 días después
    C: 10 días después
    D: 14 días después
  answer: C
  explanation: Usted es elegible para realizar un examen de carretera de Clase D o
    de motocicleta 10 días después de aprobar el examen de conocimientos.
- id: 198
  category: driver_testing
  question: ¿En qué día de la semana NO se realizan exámenes de carretera en Delaware?
  choices:
    A: Lunes
    B: Martes
    C: Miércoles
    D: Viernes
  answer: C
  explanation: Los exámenes de carretera se realizan todos los días de la semana,
    excepto los miércoles.
- id: 199
  category: driver_testing
  question: Al llegar para su examen de carretera, ¿cuál es el requisito de edad mínima
    para el conductor con licencia que lo acompaña?
  choices:
    A: 18 años de edad
    B: 21 años de edad
    C: 25 años de edad
    D: No hay un requisito de edad mínima
  answer: B
  explanation: Al llegar para su EXAMEN DE CARRETERA, debe presentar la licencia de
    conducir válida del conductor acompañante que tenga al menos 21 años de edad.
- id: 200
  category: driver_testing
  question: ¿Cuál de las siguientes maniobras se le requerirá demostrar durante el
    examen de carretera?
  choices:
    A: Retroceder 100 pies
    B: Estacionamiento en paralelo
    C: Conducir en una autopista interestatal federal
    D: Conducir de noche
  answer: B
  explanation: Durante el examen de carretera, se le requerirá demostrar maniobras
    como el estacionamiento en paralelo, un giro de tres puntos y retroceder 50 pies.
- id: 201
  category: driver_testing
  question: ¿Cuál de las siguientes acciones está prohibida durante el examen de manejo?
  choices:
    A: Usar las luces direccionales del vehículo
    B: Ajustar los espejos antes de comenzar
    C: Poner música
    D: Tener las ventanas bajas
  answer: C
  explanation: No se permite el uso de teléfonos celulares ni poner música durante
    el examen de manejo.
- id: 202
  category: driver_testing
  question: Si reprueba cualquier parte del examen de manejo, ¿cuánto tiempo debe
    esperar antes de volver a tomarlo?
  choices:
    A: 24 horas
    B: 3 días
    C: 7 días
    D: Al menos 10 días
  answer: D
  explanation: Si reprueba cualquier parte del examen de manejo, debe esperar al menos
    diez días antes de volver a tomar el examen o los exámenes.
- id: 203
  category: license_system
  question: Para obtener un endoso de Taxi/Limusina, ¿dentro de cuántos días debe
    un conductor completar un curso de manejo defensivo de un proveedor aprobado?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: El conductor debe completar un curso de manejo defensivo dentro de
    los 30 días a través de un proveedor aprobado para obtener un endoso de Taxi/Limusina.
- id: 204
  category: alcohol_drugs_health
  question: ¿Cuándo se requiere que un conductor con una condición médica proporcione
    a la División un nuevo informe médico cada año?
  choices:
    A: Antes del 1 de enero de cada año
    B: A más tardar el último día del mes de cumpleaños de la persona
    C: En el aniversario exacto de la emisión de su licencia
    D: Dentro de los 30 días posteriores a su cumpleaños
  answer: B
  explanation: Según el manual, a cualquier persona con licencia para operar un vehículo
    motorizado basada en un informe médico se le puede requerir que proporcione a
    la División un nuevo informe médico cada año, a más tardar el último día del mes
    de cumpleaños de la persona.
- id: 205
  category: penalties_and_points
  question: ¿Cuál es la tarifa de reinstalación para una licencia de conducir suspendida
    en Delaware?
  choices:
    A: $25.00
    B: $50.00
    C: $100.00
    D: $200.00
  answer: B
  explanation: El manual establece que se debe pagar una tarifa de $50.00 para reinstalar
    una licencia suspendida.
- id: 206
  category: driver_testing
  question: ¿Quién está autorizado por la ley de Delaware para presentar una solicitud
    de reexamen de la capacidad de una persona para operar un vehículo motorizado
    de manera segura?
  choices:
    A: Cualquier ciudadano preocupado
    B: Familiares directos, fuerzas del orden o profesionales médicos con licencia
    C: Solo agentes de seguros y empleadores
    D: Solo un juez o funcionario judicial
  answer: B
  explanation: La Sección 2714 del Título 21 permite a la División aceptar solicitudes
    de reexamen presentadas por miembros de la familia inmediata del conductor, las
    fuerzas del orden o un profesional médico con licencia.
- id: 207
  category: alcohol_drugs_health
  question: ¿Qué sucede si un conductor entrega voluntariamente su licencia porque
    no puede obtener un informe médico favorable, pero luego obtiene uno antes de
    la fecha de suspensión?
  choices:
    A: Deben pagar una tarifa de reinstalación de $50
    B: Deben pagar una tarifa de reinstalación de $200
    C: No hay tarifa por la reinstalación
    D: Se les prohíbe conducir permanentemente
  answer: C
  explanation: 'El manual establece: "Al recibir un informe médico favorable, no hay
    tarifa por la reinstalación si la licencia se entrega voluntariamente antes de
    la fecha de suspensión".'
- id: 208
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resultará en una revocación obligatoria
    de la licencia?
  choices:
    A: Hacer girar las ruedas (quemar llanta)
    B: Turfing (causar destrucción al césped)
    C: Rebasar un autobús escolar detenido
    D: Intentar huir de un oficial de policía
  answer: D
  explanation: Intentar huir de un oficial de policía después de haber recibido una
    señal visual o auditiva para detenerse figura en la lista de "Revocaciones obligatorias".
    Las otras opciones figuran como motivos para la suspensión de la licencia.
- id: 209
  category: penalties_and_points
  question: ¿Cuántas condenas por conducción temeraria en un período de 12 meses resultarán
    en una revocación obligatoria de la licencia?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: El manual enumera "Tres condenas por conducción temeraria en un período
    de 12 meses consecutivos" como causa de revocación obligatoria.
- id: 210
  category: penalties_and_points
  question: Según la ley de Revocación por Infractor Habitual, la licencia de un conductor
    puede ser revocada por hasta cinco años si acumula cualquier combinación de tres
    infracciones graves ¿dentro de qué período de tiempo?
  choices:
    A: 12 meses
    B: 3 años
    C: 5 años
    D: 10 años
  answer: C
  explanation: 'El manual establece: "Cualquier combinación de tres de las siguientes
    infracciones en un período de cinco años puede condenarlo como infractor habitual".'
- id: 211
  category: penalties_and_points
  question: ¿Cuántas condenas totales (incluyendo infracciones graves y menores como
    el exceso de velocidad) dentro de un período de tres años pueden resultar en que
    un conductor sea declarado infractor habitual?
  choices:
    A: '3'
    B: '5'
    C: '7'
    D: '10'
  answer: D
  explanation: 'El manual señala: "Cualquier combinación de las infracciones anteriores
    e infracciones menores, como el exceso de velocidad, que resulte en 10 condenas
    en tres años puede condenarlo como infractor habitual".'
- id: 212
  category: penalties_and_points
  question: ¿Cuál es la diferencia entre una suspensión de la licencia y una revocación
    de la licencia?
  choices:
    A: La suspensión es una cancelación, mientras que la revocación es un retiro temporal.
    B: La suspensión es un retiro temporal, mientras que la revocación es una cancelación.
    C: La suspensión requiere una tarifa de $200, mientras que la revocación requiere
      una tarifa de $50.
    D: La suspensión solo se aplica a problemas médicos, mientras que la revocación
      se aplica a infracciones de tránsito.
  answer: B
  explanation: 'El manual establece explícitamente: "La suspensión de una licencia
    es un retiro temporal de su privilegio de conducir. La revocación de una licencia
    es una cancelación de su privilegio de conducir".'
- id: 213
  category: driver_responsibility
  question: ¿Cómo maneja la División de Vehículos Motorizados (DMV) la infracción
    de conducción de un residente de Delaware cometida en otro estado?
  choices:
    A: Las infracciones fuera del estado son ignoradas.
    B: Solo se registran las multas de estacionamiento fuera del estado.
    C: La licencia será suspendida o revocada si la infracción fuera motivo para ello
      en Delaware.
    D: El conductor debe entregar su licencia de Delaware y solicitar una en el otro
      estado.
  answer: C
  explanation: 'El manual establece: "La División suspenderá o revocará la licencia
    de cualquier residente de Delaware que haya sido condenado por una infracción
    en otro estado que, si se cometiera en Delaware, sería motivo de suspensión o
    revocación de la licencia".'
- id: 214
  category: penalties_and_points
  question: ¿A un conductor se le puede suspender la licencia por morosidad en la
    manutención de los hijos si tiene 30 días o más de retraso y debe al menos qué
    cantidad en mora?
  choices:
    A: $500.00
    B: $1,000.00
    C: $2,500.00
    D: $5,000.00
  answer: B
  explanation: El manual establece que a cualquier persona que deba $1,000.00 o más
    en mora o manutención retroactiva y tenga 30 días o más de retraso se le puede
    suspender la licencia.
- id: 215
  category: alcohol_drugs_health
  question: A partir de agosto de 2024, ¿cuál es la política del DMV con respecto
    a los profesionales con licencia que informan sobre las condiciones médicas de
    los pacientes?
  choices:
    A: Los profesionales están obligados por ley a informar todas las condiciones
      médicas.
    B: Los profesionales ya no están obligados a informar las condiciones médicas,
      pero se les anima a informar sobre los pacientes que representen un peligro.
    C: Los profesionales enfrentan una multa de $50 si no informan sobre un paciente.
    D: Los profesionales tienen estrictamente prohibido informar cualquier condición
      médica del paciente al DMV.
  answer: B
  explanation: 'El manual establece: "A partir de agosto de 2024, el DMV ya no requiere
    el informe obligatorio de condiciones médicas. Se anima a los profesionales con
    licencia a informar sobre los pacientes que puedan representar un peligro al conducir".'
- id: 216
  category: penalties_and_points
  question: ¿Qué sucede si paga una fianza después de ser arrestado por una infracción
    de revocación obligatoria y no comparece ante el tribunal?
  choices:
    A: Se le emite una advertencia.
    B: Su licencia será suspendida por 30 días.
    C: Su licencia será revocada al igual que si hubiera sido condenado.
    D: Debe pagar una tarifa adicional de $50 pero conserva sus privilegios de conducir.
  answer: C
  explanation: 'El manual establece: "Si paga una fianza después de ser arrestado
    por cualquiera de las causas enumeradas anteriormente, y no comparece ante el
    tribunal, su licencia será revocada al igual que si hubiera sido condenado".'
- id: 217
  category: penalties_and_points
  question: ¿Cuál es la tarifa de reinstalación si su licencia es suspendida debido
    a tener 30 días o más de retraso en los pagos de manutención infantil?
  choices:
    A: $25.00
    B: $50.00
    C: $75.00
    D: $100.00
  answer: B
  explanation: Según el manual, se debe pagar una tarifa de reinstalación de $50.00
    a la División de Vehículos Motorizados para reinstalar la licencia después de
    una suspensión por manutención infantil.
- id: 218
  category: penalties_and_points
  question: ¿Cuántos puntos se evalúan en su registro de conducir por rebasar a un
    autobús escolar detenido?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 5 puntos
    D: 6 puntos
  answer: D
  explanation: Rebasar a un autobús escolar detenido resulta en 6 puntos en su registro
    de conducir y puede resultar en acciones adicionales, incluida la suspensión.
- id: 219
  category: penalties_and_points
  question: ¿Cómo se calculan internamente los puntos para la acción administrativa
    durante los segundos 12 meses a partir de la fecha de una infracción?
  choices:
    A: Se acreditan al valor total del punto.
    B: Se acreditan a la mitad del valor del punto.
    C: Se acreditan a un cuarto del valor del punto.
    D: Se eliminan completamente del cálculo.
  answer: B
  explanation: Los puntos se calculan internamente para la acción administrativa al
    valor total del punto durante los primeros 12 meses y a la mitad del valor del
    punto durante los segundos 12 meses a partir de la fecha de la infracción.
- id: 220
  category: penalties_and_points
  question: ¿Qué acción administrativa toma la División de Vehículos Motorizados cuando
    un conductor acumula 8 puntos calculados?
  choices:
    A: Envía al conductor una carta de advertencia.
    B: Impone una suspensión obligatoria de 2 meses.
    C: Requiere un curso de modificación de conducta.
    D: Revoca la licencia del conductor por un año.
  answer: A
  explanation: Cuando un conductor alcanza los 8 puntos calculados, la División de
    Vehículos Motorizados envía al conductor una carta de advertencia (advisory letter).
- id: 221
  category: penalties_and_points
  question: ¿Cuál es la sanción por acumular 14 puntos calculados bajo el Programa
    de Mejora del Conductor con Problemas (Driver Improvement Problem Driver Program)?
  choices:
    A: Suspensión obligatoria de la licencia por 2 meses
    B: Suspensión obligatoria de la licencia por 4 meses
    C: Suspensión obligatoria de la licencia por 6 meses
    D: Suspensión obligatoria de la licencia por 8 meses
  answer: B
  explanation: Acumular 14 puntos calculados resulta en una suspensión obligatoria
    de la licencia por 4 meses.
- id: 222
  category: penalties_and_points
  question: ¿Bajo qué condición NO se asignarán puntos por una infracción de exceso
    de velocidad de 1 a 14 mph sobre el límite de velocidad establecido para un titular
    de licencia Clase D?
  choices:
    A: Si es la primera infracción dentro de cualquier período de 3 años y la multa
      se paga a través del Centro de Evaluación Voluntaria (Voluntary Assessment Center).
    B: Si el conductor completa un curso de manejo defensivo en un plazo de 30 días.
    C: Si el conductor nunca ha recibido una multa por exceso de velocidad en su vida.
    D: Si el conductor estaba rebasando a otro vehículo en el momento de la infracción.
  answer: A
  explanation: Una infracción por exceso de velocidad de 1 a 14 mph sobre el límite
    no recibirá puntos si es la primera infracción dentro de cualquier período de
    3 años y la multa se paga a través del Centro de Evaluación Voluntaria o el Tribunal
    del Concejal (Alderman's Court) como un pago por correo o en línea declarándose
    culpable.
- id: 223
  category: penalties_and_points
  question: ¿Cuál es la sanción por una condena por conducir a 25 mph sobre el límite
    de velocidad establecido?
  choices:
    A: Se envía una carta de advertencia al conductor.
    B: El conductor será suspendido por un mes.
    C: El conductor será suspendido por cuatro meses.
    D: La licencia del conductor será revocada permanentemente.
  answer: B
  explanation: El conductor será suspendido por un mes al ser condenado por conducir
    a 25 mph sobre el límite de velocidad establecido.
- id: 224
  category: penalties_and_points
  question: ¿De cuánto tiempo es la suspensión de la licencia para un conductor condenado
    por conducir a 50 mph o más sobre el límite de velocidad establecido?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Se impone una suspensión de un año al ser condenado por conducir a
    50 mph o más sobre el límite de velocidad establecido o por conducir a 100 mph
    en una autopista.
- id: 225
  category: license_system
  question: ¿Cuándo NO se emite una licencia ocupacional durante un período de suspensión?
  choices:
    A: Durante el último mes de la suspensión.
    B: Durante el primer mes de la suspensión.
    C: Si el conductor tiene una licencia Clase D.
    D: Si el conductor debe pagar una tarifa de reinstalación.
  answer: B
  explanation: Según el manual, las licencias ocupacionales no se emiten durante el
    primer mes de la suspensión.
- id: 226
  category: license_system
  question: No se emitirá una licencia ocupacional si su nivel de puntos calculados
    alcanza o supera ¿cuántos puntos en un período de 24 meses?
  choices:
    A: 10 puntos
    B: 12 puntos
    C: 14 puntos
    D: 15 puntos
  answer: D
  explanation: Si el nivel de puntos calculados alcanza 15 o más puntos en un período
    de 24 meses, no se emitirá una licencia ocupacional hasta que los puntos calculados
    sean menos de 15 puntos.
- id: 227
  category: penalties_and_points
  question: ¿Cuál es la consecuencia de una condena por conducir durante un período
    de suspensión o revocación?
  choices:
    A: Una sentencia de cárcel obligatoria de 30 días.
    B: El período de suspensión o revocación se extiende por un período igual, hasta
      un año.
    C: Una multa de $500 e incautación inmediata del vehículo.
    D: Revocación permanente de los privilegios de conducir.
  answer: B
  explanation: Una condena por conducir durante la suspensión o revocación extenderá
    el período de suspensión o revocación por un período igual, hasta un año.
- id: 228
  category: safe_driving_rules
  question: Según la ley de Delaware, una persona es culpable de conducción agresiva
    si es condenada por ¿cuántas infracciones específicas del Título 21 como resultado
    de una conducta continua?
  choices:
    A: Dos o más
    B: Tres o más
    C: Cuatro o más
    D: Cinco o más
  answer: B
  explanation: Las personas condenadas por tres o más de estas infracciones (como
    no ceder el paso, cambio de carril inseguro, etc.) como resultado de una conducta
    continua son culpables de conducción agresiva.
- id: 229
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción de conducción agresiva?
  choices:
    A: Entre $50.00 y $100.00
    B: Entre $100.00 y $300.00
    C: Entre $300.00 y $500.00
    D: Exactamente $500.00
  answer: B
  explanation: Los infractores de la ley de conducción agresiva serán multados con
    entre $100.00 y $300.00 por la primera infracción.
- id: 230
  category: driver_responsibility
  question: ¿Cuál es la duración mínima y la tarifa estándar para un curso aprobado
    de modificación de conducta/conducción actitudinal?
  choices:
    A: 4 horas de duración y $50.00
    B: 6 horas de duración y $75.00
    C: 8 horas de duración y $100.00
    D: 10 horas de duración y $150.00
  answer: C
  explanation: El curso de modificación de conducta/conducción actitudinal tiene una
    duración mínima de ocho horas y la tarifa del curso es de $100.00.
- id: 231
  category: defensive_driving
  question: ¿Cómo afecta completar un curso aprobado de conducción defensiva a su
    historial de conducción con el DMV?
  choices:
    A: Elimina 3 puntos existentes de su valor total de puntos.
    B: Proporciona un crédito de tres puntos aplicado a futuras infracciones para
      acciones administrativas.
    C: Borra su infracción de tráfico más reciente.
    D: Evita que su compañía de seguros vea su historial de conducción.
  answer: B
  explanation: La finalización satisfactoria de un curso aprobado de conducción defensiva
    proporciona un crédito de tres puntos que solo se aplica a futuras infracciones
    para acciones administrativas, y no elimina ni reduce los puntos existentes del
    DMV.
- id: 232
  category: alcohol_drugs_health
  question: ¿Cuál es el límite de concentración de alcohol en sangre (BAC) que constituye
    evidencia concluyente para conducir bajo la influencia en Delaware?
  choices:
    A: '.02'
    B: '.04'
    C: '.08'
    D: '.10'
  answer: C
  explanation: En Delaware, un BAC de .08 o superior, o la presencia de cualquier
    droga ilícita o recreativa, es evidencia concluyente de que un conductor está
    bajo la influencia.
- id: 233
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes bebidas contiene la mayor cantidad de alcohol?
  choices:
    A: Una lata de 12 onzas de cerveza regular
    B: Una copa de 5 onzas de vino de mesa
    C: Un trago (shot) de 1.5 onzas de licor de 80 grados (80-proof)
    D: Todas contienen la misma cantidad de alcohol
  answer: D
  explanation: Una lata de cerveza de 12 onzas, una copa de vino de 5 onzas y un cóctel
    con 1.5 onzas de bebidas espirituosas destiladas de 80 grados contienen la misma
    cantidad de alcohol.
- id: 234
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia si un conductor se niega a someterse
    a una prueba química en Delaware?
  choices:
    A: Recibirá una multa de advertencia.
    B: Su licencia de conducir puede ser revocada.
    C: Debe pagar una multa obligatoria de $500 en el acto.
    D: Se le requerirá volver a tomar el examen de conducir escrito.
  answer: B
  explanation: Si un conductor se niega a realizar una prueba química, su licencia
    puede ser revocada.
- id: 235
  category: penalties_and_points
  question: Según el estatuto de tolerancia cero de Delaware, ¿qué nivel de BAC exige
    la revocación de la licencia para conductores menores de 21 años?
  choices:
    A: '.00'
    B: '.02'
    C: '.04'
    D: '.08'
  answer: B
  explanation: El estatuto de tolerancia cero de Delaware exige la revocación de la
    licencia para conductores menores de edad con un BAC de .02.
- id: 236
  category: penalties_and_points
  question: ¿Cuál es la sanción por la primera condena de un conductor de vehículo
    motorizado comercial por conducir con un BAC de .04 o más?
  choices:
    A: Descalificación para conducir un vehículo comercial por 6 meses
    B: Descalificación para conducir un vehículo comercial por un año
    C: Descalificación de por vida para conducir un vehículo comercial
    D: Una sentencia de cárcel obligatoria de 30 días
  answer: B
  explanation: Cualquier conductor que opere un vehículo motorizado comercial que
    se niegue a someterse a una prueba de aliento o de sangre para determinar su BAC,
    o cuyo BAC sea de .04 o más, será descalificado para conducir un vehículo comercial
    por un año.
- id: 237
  category: alcohol_drugs_health
  question: Después de consumir alcohol, ¿aproximadamente cuánto tiempo tarda en llegar
    al cerebro?
  choices:
    A: De 5 a 10 minutos
    B: De 10 a 15 minutos
    C: De 20 a 40 minutos
    D: De 1 a 2 horas
  answer: C
  explanation: El alcohol pasa del estómago a la sangre y a todas las partes del cuerpo.
    Llega al cerebro en un lapso de 20 a 40 minutos.
- id: 238
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma efectiva de recuperar la sobriedad
    después de beber alcohol?
  choices:
    A: Beber café solo (negro) y cargado
    B: Tomar una ducha fría
    C: Tomar aire fresco y hacer ejercicio
    D: Dejar que pase el tiempo
  answer: D
  explanation: No hay forma de recuperar la sobriedad rápidamente. El café, el aire
    fresco, el ejercicio o las duchas frías no ayudarán. El tiempo es lo único que
    le devolverá la sobriedad.
- id: 239
  category: alcohol_drugs_health
  question: ¿Cómo afecta el peso de una persona a su concentración de alcohol en sangre
    (BAC)?
  choices:
    A: Una persona de menor peso requiere menos alcohol para alcanzar un nivel de
      BAC específico.
    B: Una persona de mayor peso requiere menos alcohol para alcanzar un nivel de
      BAC específico.
    C: El peso no tiene ningún efecto sobre los niveles de BAC.
    D: Una persona de menor peso procesa el alcohol más rápido, manteniendo su BAC
      más bajo.
  answer: A
  explanation: Cuanto menor sea el peso del bebedor, menor será la cantidad de bebida
    alcohólica necesaria para llevar la concentración de alcohol en sangre a un nivel
    específico. Se necesita aproximadamente la mitad para una persona que pesa 100
    libras que para otra que pesa 200 libras.
- id: 240
  category: defensive_driving
  question: 'Si aparta la vista de la carretera durante 3 a 4 segundos mientras viaja
    a 55 mph, su vehículo recorrerá aproximadamente la longitud de:'
  choices:
    A: Un cruce de peatones
    B: Una cancha de baloncesto
    C: Un campo de fútbol americano completo
    D: Una cuadra de la ciudad
  answer: C
  explanation: Si aparta la vista de la carretera mientras viaja a 55 mph durante
    3 a 4 segundos, su vehículo recorre la longitud de un campo de fútbol americano
    completo.
- id: 241
  category: alcohol_drugs_health
  question: ¿Qué efecto tienen las "pastillas estimulantes" (pep pills) o "estimulantes"
    (uppers) en un conductor?
  choices:
    A: Mejoran permanentemente los reflejos y el tiempo de reacción.
    B: Hacen que el conductor se sienta más alerta por un corto tiempo, pero luego
      causan nerviosismo y mareos.
    C: Contrarrestan de forma segura los efectos del alcohol.
    D: No tienen ningún efecto en la capacidad de una persona para conducir de forma
      segura.
  answer: B
  explanation: Las pastillas estimulantes, los "estimulantes" (uppers) y las pastillas
    para adelgazar pueden hacer que un conductor se sienta más alerta por un corto
    tiempo. Sin embargo, más tarde pueden hacer que la persona se sienta nerviosa,
    mareada, incapaz de concentrarse y pueden afectar su visión.
- id: 242
  category: alcohol_drugs_health
  question: ¿Cuál es el factor principal que determina cuánto alcohol llega al torrente
    sanguíneo?
  choices:
    A: La cantidad de comida en el estómago
    B: Cómo se mezclan las bebidas
    C: La cantidad de alcohol en las bebidas ingeridas
    D: El tipo de mezclador utilizado con el licor
  answer: C
  explanation: La velocidad de este movimiento y la cantidad de alcohol que llega
    a la sangre dependen principalmente de cuánto alcohol hay en las bebidas ingeridas.
- id: 243
  category: penalties_and_points
  question: Si un menor es condenado por conducir bajo la influencia del alcohol,
    ¿por cuánto tiempo se le puede revocar la licencia?
  choices:
    A: Por 6 meses
    B: Por 1 año
    C: Hasta que cumpla los 18 años
    D: Hasta que cumpla los 21 años
  answer: D
  explanation: Si es condenado por conducir bajo la influencia del alcohol, la licencia
    del menor puede ser revocada hasta que cumpla los 21 años de edad.
- id: 244
  category: driver_responsibility
  question: ¿Cuál de los siguientes se considera un comportamiento peligroso de conducción
    distraída?
  choices:
    A: Ajustar los espejos antes de arrancar el vehículo
    B: Mantener conversaciones emocionales intensas con los pasajeros
    C: Revisar el velocímetro ocasionalmente
    D: Usar los limpiaparabrisas durante la lluvia
  answer: B
  explanation: Mantener conversaciones emocionales intensas y complicadas por teléfono
    celular o con los pasajeros se enumera como una actividad de conducción distraída
    en la que usted puede estar haciendo más cosas de las que puede manejar de manera
    segura.
- id: 245
  category: safe_driving_rules
  question: Según los instructores de conducción, ¿aproximadamente cuántas decisiones
    toma un conductor por cada milla recorrida?
  choices:
    A: '50'
    B: '100'
    C: '200'
    D: '500'
  answer: C
  explanation: Los instructores de conducción estiman que un conductor toma 200 decisiones
    por cada milla de conducción.
- id: 246
  category: alcohol_drugs_health
  question: ¿Cómo afecta el consumo de alimentos antes y durante la ingestión de alcohol
    a la absorción del mismo?
  choices:
    A: Evita que la persona se emborrache.
    B: Acelera la rapidez con la que el alcohol llega a la sangre.
    C: Retrasa la rapidez con la que el alcohol llega a la sangre.
    D: Reduce la cantidad total de alcohol que entra en el torrente sanguíneo.
  answer: C
  explanation: La comida retrasa la rapidez con la que el alcohol llega a la sangre.
    Recuerde, la comida solo retrasa el momento en que el alcohol entra en la sangre,
    no evitará que usted se emborrache.
- id: 247
  category: safe_driving_rules
  question: ¿A qué se refiere el término "Hipnosis de carretera" (Highway Hypnosis)?
  choices:
    A: Una condición médica causada por mirar fijamente los faros brillantes.
    B: El estado de no ser consciente del entorno causado por la monotonía.
    C: Un trance inducido por escuchar música a alto volumen mientras se conduce.
    D: Quedarse dormido al volante después de consumir alcohol.
  answer: B
  explanation: 'Según el manual, la "Hipnosis de carretera" se refiere comúnmente
    al estado de no ser consciente del entorno. Es causada por la monotonía: el sonido
    del viento, los neumáticos y el zumbido constante del motor.'
- id: 248
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es una señal de que un conductor puede estar somnoliento?
  choices:
    A: Mantener una velocidad constante y estable.
    B: Recordar las últimas millas recorridas con todo detalle.
    C: Tener pensamientos errantes y desconectados.
    D: Mantener los ojos enfocados con nitidez.
  answer: C
  explanation: El manual enumera varias señales de conductores somnolientos, incluyendo
    tener pensamientos errantes y desconectados, dificultad para mantener la cabeza
    erguida y pérdida de enfoque en la mirada.
- id: 249
  category: alcohol_drugs_health
  question: Si se le acusa de un DUI, ¿puede utilizar el hecho de que tiene derecho
    legal a consumir una droga como defensa?
  choices:
    A: Sí, si tiene una receta válida de un médico.
    B: Sí, pero solo para medicamentos de venta libre.
    C: No, el hecho de tener derecho legal a consumir alcohol o una droga no se considerará
      una defensa.
    D: No, a menos que la droga haya sido administrada por un profesional médico inmediatamente
      antes de conducir.
  answer: C
  explanation: 'El manual establece: "El hecho de que una persona acusada de violar
    la ley de DUI (conducir bajo la influencia) tenga, o haya tenido, derecho legal
    a consumir alcohol o una droga no se considerará una defensa".'
- id: 250
  category: alcohol_drugs_health
  question: 'Bajo la Ley de Consentimiento Implícito de Delaware, se considera que
    cualquier persona arrestada por conducir bajo la influencia ha dado su consentimiento
    para:'
  choices:
    A: Un registro del maletero e interior de su vehículo.
    B: Pruebas químicas de su aliento, sangre y/u orina.
    C: Una sentencia de cárcel obligatoria de 30 días.
    D: La confiscación y venta inmediata de su vehículo.
  answer: B
  explanation: La Ley de Consentimiento Implícito establece que cualquier persona
    arrestada por conducir bajo la influencia se considerará que ha dado su consentimiento
    para someterse a una prueba o pruebas químicas de su aliento, sangre y/u orina.
- id: 251
  category: penalties_and_points
  question: ¿Qué le sucede a un menor condenado por una infracción de DUI en Delaware?
  choices:
    A: Su licencia es revocada por exactamente 6 meses.
    B: Deben pagar una multa de $1,000 y completar 100 horas de servicio comunitario.
    C: El Tribunal de Familia presenta una orden para revocar su licencia hasta que
      cumplan 21 años.
    D: Su licencia se suspende hasta que se gradúen de la escuela secundaria.
  answer: C
  explanation: Por una infracción de la ley de DUI de Delaware, el Tribunal de Familia
    debe presentar una orden a la División de Vehículos Motorizados para revocar la
    licencia y/o el privilegio de conducir de cualquier menor hasta el momento en
    que se le permita legalmente consumir bebidas alcohólicas (21 años).
- id: 252
  category: penalties_and_points
  question: Bajo la Ley de Tolerancia Cero (Zero Tolerance Law), ¿cuál es la sanción
    por una primera infracción para cualquier persona menor de 21 años que conduzca
    después de consumir bebidas alcohólicas?
  choices:
    A: Revocación de la licencia de conducir por dos meses.
    B: Revocación de la licencia de conducir por seis meses.
    C: Una multa obligatoria de $500.
    D: Revocación de la licencia de conducir hasta los 21 años.
  answer: A
  explanation: La Ley de Tolerancia Cero establece que cualquier persona menor de
    21 años que conduzca después de consumir bebidas alcohólicas verá revocada su
    licencia de conducir por un período de dos meses por la primera infracción.
- id: 253
  category: alcohol_drugs_health
  question: 'La ley de consumo o posesión por menores de edad NO se aplica cuando:'
  choices:
    A: El alcohol se consume en una fiesta privada con amigos.
    B: El alcohol se consume en relación con cualquier servicio religioso.
    C: La persona tiene al menos 18 años y está acompañada por su cónyuge.
    D: El alcohol fue comprado legalmente en otro estado.
  answer: B
  explanation: El manual señala que esta sección no se aplicará a la posesión o consumo
    de licor alcohólico en relación con cualquier servicio religioso o por miembros
    de la misma familia dentro del hogar privado.
- id: 254
  category: penalties_and_points
  question: Después de un arresto por DUI, ¿cuánto tiempo tiene un conductor para
    solicitar una audiencia administrativa antes de que expire su licencia temporal
    y comience la revocación?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: El oficial emitirá una licencia temporal de 15 días. El conductor tendrá
    15 días para solicitar una audiencia administrativa. La licencia será revocada
    al final del período de 15 días si no se solicita una audiencia.
- id: 255
  category: alcohol_drugs_health
  question: En una audiencia administrativa de vehículos motorizados, ¿qué concentración
    de alcohol en sangre (BAC) se considera evidencia concluyente de que el conductor
    estaba bajo la influencia?
  choices:
    A: .04 o superior
    B: .05 o superior
    C: .08 o superior
    D: .10 o superior
  answer: C
  explanation: Una prueba química de .08 de BAC o superior, o la presencia de cualquier
    droga, es evidencia concluyente de que el conductor estaba bajo la influencia.
- id: 256
  category: penalties_and_points
  question: 'Si un conductor recibe un fallo desfavorable en una audiencia administrativa
    por negarse a una prueba química (primera infracción), su licencia será revocada
    por:'
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 18 meses
  answer: C
  explanation: Si el conductor recibe un fallo desfavorable en una audiencia administrativa
    por una prueba química rechazada, la revocación es de 12 meses para una primera
    infracción.
- id: 257
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para restablecer una licencia
    de conducir después de una revocación por causa probable o por negarse a una prueba
    química?
  choices:
    A: Pago de una tarifa de restablecimiento de $100.
    B: Pago de una tarifa de restablecimiento de $200.
    C: Finalización de 50 horas de servicio comunitario.
    D: Compra de un vehículo nuevo.
  answer: B
  explanation: Uno de los términos para el restablecimiento de una licencia de conducir
    y/o privilegio de conducir es el pago de la tarifa de restablecimiento de $200.00.
- id: 258
  category: penalties_and_points
  question: Para una primera infracción de DUI con un BAC de .20 o superior, ¿por
    cuánto tiempo revocará el DMV la licencia del conductor?
  choices:
    A: 12 meses
    B: 18 meses
    C: 24 meses
    D: 30 meses
  answer: C
  explanation: Para una primera infracción de DUI, la pérdida de la licencia por parte
    del DMV es de 24 meses para un BAC de .20 o superior o por negarse a someterse
    a una prueba química.
- id: 259
  category: penalties_and_points
  question: ¿Cuánto tiempo debe permanecer con el dispositivo de interbloqueo de encendido
    (IID) una persona que elige el programa de Elección de Primer Ofensor (FOE) con
    una licencia IID?
  choices:
    A: Dos meses
    B: Cuatro meses
    C: Seis meses
    D: Doce meses
  answer: B
  explanation: Cualquier persona que elija el programa FOE con la licencia IID debe
    permanecer con el IID durante cuatro meses a partir de la fecha en que se emitió
    la licencia IID.
- id: 260
  category: penalties_and_points
  question: ¿Cuál es el rango de multa de la sanción judicial para una segunda infracción
    de DUI?
  choices:
    A: $500.00 a $1,500.00
    B: $750.00 a $2,500.00
    C: $1,000.00 a $3,000.00
    D: $1,500.00 a $5,000.00
  answer: B
  explanation: Para una segunda infracción de DUI, las sanciones del tribunal incluyen
    una multa de $750.00 a $2,500.00.
- id: 261
  category: penalties_and_points
  question: ¿Cuál es el período de pérdida de la licencia del DMV por una segunda
    infracción de DUI con un BAC de .20 o superior, o por negarse a someterse a una
    prueba química?
  choices:
    A: 18 meses
    B: 24 meses
    C: 30 meses
    D: 36 meses
  answer: C
  explanation: Según el manual, la pérdida de la licencia por parte del DMV por una
    segunda infracción de DUI es de 30 meses para un BAC de .20 o superior, o por
    negarse a someterse a una prueba química.
- id: 262
  category: penalties_and_points
  question: 'Una tercera infracción de DUI que ocurra en cualquier momento después
    de dos infracciones previas es clasificada por el tribunal como un:'
  choices:
    A: Delito grave (Felonía) de Clase D
    B: Delito grave (Felonía) de Clase E
    C: Delito grave (Felonía) de Clase F
    D: Delito grave (Felonía) de Clase G
  answer: D
  explanation: El manual establece que una tercera infracción de DUI es un delito
    grave (felonía) de Clase G que ocurre en cualquier momento después de dos infracciones
    previas.
- id: 263
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una séptima o posterior infracción de DUI?
  choices:
    A: Hasta $5,000.00
    B: Hasta $7,000.00
    C: Hasta $10,000.00
    D: Hasta $15,000.00
  answer: D
  explanation: Para una séptima o posterior infracción de DUI, las sanciones del tribunal
    incluyen una multa de hasta $15,000.00.
- id: 264
  category: penalties_and_points
  question: ¿Está disponible una licencia con Dispositivo de Bloqueo de Encendido
    (IID) para conductores que operan vehículos de clase de Licencia de Conducir Comercial
    (CDL)?
  choices:
    A: Sí, pero solo para infractores de DUI por primera vez.
    B: Sí, después de completar un período de espera de 6 meses.
    C: No, la licencia IID no está disponible para vehículos de clase CDL.
    D: No, a menos que el conductor pase una prueba adicional de habilidades viales.
  answer: C
  explanation: 'El manual establece explícitamente: "La licencia IID no está disponible
    para vehículos de clase CDL ni es válida para ningún endoso periférico".'
- id: 265
  category: penalties_and_points
  question: ¿Cuál es el período mínimo de revocación obligatorio antes de que un conductor
    sea elegible para solicitar un IID después de una condena por una tercera infracción
    de DUI?
  choices:
    A: 30 a 45 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: C
  explanation: Todos los infractores de DUI son elegibles para solicitar el IID después
    de un período mínimo de revocación obligatorio. Para una condena por tercera infracción,
    este período es de 90 días.
- id: 266
  category: penalties_and_points
  question: Si un infractor de DUI elige obtener una licencia IID por una cuarta y
    subsiguiente condena, ¿cuánto tiempo debe tener el dispositivo en su(s) vehículo(s)?
  choices:
    A: 16 a 28 meses
    B: 21 a 33 meses
    C: Al menos 36 meses
    D: Al menos 54 meses
  answer: D
  explanation: Según el Título 21, Sección 4177C(d) del Código de Delaware, el requisito
    de tiempo del IID para una cuarta y subsiguiente condena es de al menos 54 meses.
- id: 267
  category: vehicle_information
  question: ¿Cuántos días tienen los nuevos residentes para titular y registrar sus
    vehículos después de mudarse a Delaware?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: El manual establece que los nuevos residentes deben titular y registrar
    sus vehículos dentro de los 60 días posteriores a su mudanza a Delaware.
- id: 268
  category: vehicle_information
  question: ¿A qué distancia mínima deben estar orientadas y ser lo suficientemente
    potentes las luces altas (faros delanteros) para revelar personas y vehículos?
  choices:
    A: 100 pies
    B: 250 pies
    C: 350 pies
    D: 500 pies
  answer: C
  explanation: Las reglas de equipo requerido establecen que las luces altas deben
    estar orientadas y ser lo suficientemente potentes para revelar personas y vehículos
    a una distancia de al menos 350 pies.
- id: 269
  category: safe_driving_rules
  question: ¿Cuándo deben encenderse los faros delanteros de su vehículo debido a
    las inclemencias del tiempo?
  choices:
    A: Siempre que el desempañador esté funcionando
    B: Siempre que los limpiaparabrisas estén en uso
    C: Solo cuando la visibilidad sea inferior a 500 pies
    D: Solo cuando se conduce por la autopista
  answer: B
  explanation: El manual exige que los faros delanteros deben estar encendidos cuando
    los limpiaparabrisas estén en uso debido a las inclemencias del tiempo.
- id: 270
  category: vehicle_information
  question: ¿Cuáles son los requisitos para las luces traseras en un automóvil registrado
    en Delaware?
  choices:
    A: Al menos una luz roja visible desde 350 pies
    B: Al menos dos luces rojas visibles desde 500 pies
    C: Al menos dos luces ámbar visibles desde 100 pies
    D: Al menos una luz blanca visible desde 500 pies
  answer: B
  explanation: Todo automóvil debe tener al menos dos luces rojas, de diseño original,
    en la parte trasera que sean visibles desde una distancia de 500 pies.
- id: 271
  category: vehicle_information
  question: La luz de la placa de matrícula debe ser blanca y lo suficientemente potente
    como para que el número de registro sea visible desde ¿qué distancia?
  choices:
    A: 50 pies
    B: 100 pies
    C: 350 pies
    D: 500 pies
  answer: A
  explanation: La luz de la placa de matrícula debe ser blanca y lo suficientemente
    potente como para que el número de la placa de registro se vea desde una distancia
    de 50 pies.
- id: 272
  category: vehicle_information
  question: 'Las luces de freno deben encenderse cuando se presiona el pedal del freno
    y ser visibles desde una distancia de al menos:'
  choices:
    A: 50 pies bajo la luz solar normal
    B: 100 pies bajo la luz solar normal
    C: 350 pies bajo la luz solar normal
    D: 500 pies bajo la luz solar normal
  answer: B
  explanation: Las luces de freno deben encenderse cuando se presiona el pedal del
    freno y ser visibles desde una distancia de al menos 100 pies bajo la luz solar
    normal.
- id: 273
  category: vehicle_information
  question: Para los vehículos fabricados después de 1953, ¿qué colores están permitidos
    para las señales de giro traseras?
  choices:
    A: Cualquier tono entre blanco y ámbar
    B: Cualquier tono entre ámbar y rojo
    C: Solo rojo sólido
    D: Solo ámbar sólido
  answer: B
  explanation: Según el manual, las señales de giro delanteras pueden ser de cualquier
    tono entre blanco y ámbar, mientras que las traseras pueden ser de cualquier tono
    entre ámbar y rojo.
- id: 274
  category: vehicle_information
  question: 'El freno de estacionamiento o de emergencia debe ser capaz de detener
    el vehículo en una distancia de 54 pies a una velocidad de:'
  choices:
    A: 10 mph
    B: 20 mph
    C: 30 mph
    D: 40 mph
  answer: B
  explanation: El freno de estacionamiento o de emergencia debe detener el vehículo
    en una distancia de 54 pies a una velocidad de 20 mph.
- id: 275
  category: vehicle_information
  question: ¿De qué tipo de vidrio deben estar hechos el parabrisas y todas las ventanas
    laterales y traseras?
  choices:
    A: Vidrio de privacidad teñido
    B: Plexiglás inastillable
    C: Vidrio de seguridad automotriz
    D: Vidrio comercial templado
  answer: C
  explanation: El manual establece que el parabrisas y todas las ventanas laterales
    y traseras deben estar hechos de vidrio de seguridad automotriz.
- id: 276
  category: vehicle_information
  question: ¿A qué distancia mínima debe poder escucharse la bocina de su vehículo
    en condiciones normales?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El manual establece que la bocina de un vehículo debe poder emitir
    un sonido que se escuche en condiciones normales a una distancia de al menos 200
    pies.
- id: 277
  category: safe_driving_rules
  question: 'La ley de Delaware exige que las luces delanteras estén encendidas cuando:'
  choices:
    A: Está conduciendo en una zona de trabajo designada.
    B: Usa los limpiaparabrisas.
    C: Está conduciendo en una carretera de varios carriles.
    D: Está conduciendo entre las 8:00 AM y las 5:00 PM.
  answer: B
  explanation: La ley de Delaware exige que las luces delanteras estén encendidas
    siempre que use los limpiaparabrisas.
- id: 278
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe cambiar sus luces delanteras a luces bajas
    antes de encontrarse con otro vehículo?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: Las luces delanteras deben cambiarse a luces bajas 500 pies antes de
    encontrarse con otro vehículo.
- id: 279
  category: vehicle_information
  question: ¿Durante cuál de los siguientes períodos son legales los neumáticos con
    clavos en Delaware?
  choices:
    A: 1 de noviembre al 31 de marzo
    B: 15 de octubre al 15 de abril
    C: 1 de septiembre al 1 de mayo
    D: 1 de diciembre al 28 de febrero
  answer: B
  explanation: Los neumáticos con clavos son legales en Delaware desde el 15 de octubre
    hasta el 15 de abril inclusive.
- id: 280
  category: safe_driving_rules
  question: 'Cuando un vehículo remolca a otro, la barra de tracción o la conexión
    entre ellos no debe medir más de:'
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La barra de tracción u otra conexión entre dos vehículos cualesquiera,
    cuando uno remolca al otro, no debe tener más de 15 pies de largo.
- id: 281
  category: safe_driving_rules
  question: Si se utiliza una cadena, cuerda o cable para remolcar un vehículo, ¿qué
    se le debe colocar?
  choices:
    A: Una bandera roja de al menos 12 pulgadas cuadradas
    B: Un triángulo reflectante amarillo
    C: Una bandera blanca de al menos 18 pulgadas cuadradas
    D: Una luz ámbar intermitente
  answer: A
  explanation: Si se utiliza una cadena, cuerda o cable para remolcar un vehículo,
    se le debe colocar una bandera roja de al menos 12 pulgadas cuadradas.
- id: 282
  category: driver_responsibility
  question: Si un oficial de policía detiene un vehículo y ve ocupantes sin el cinturón
    de seguridad puesto, ¿quién recibe la multa?
  choices:
    A: Solo los pasajeros que no llevan el cinturón
    B: El conductor del vehículo
    C: Tanto el conductor como los pasajeros que no llevan el cinturón
    D: El propietario registrado del vehículo, incluso si no está presente
  answer: B
  explanation: El conductor del vehículo recibe una multa por cualquier ocupante del
    vehículo que no esté sujeto o que esté sujeto incorrectamente.
- id: 283
  category: license_system
  question: ¿Dentro de cuántos días después de convertirse en residente de Delaware
    deben los nuevos residentes titular y registrar sus vehículos?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Los nuevos residentes deben titular/registrar sus vehículos dentro
    de los 60 días posteriores a convertirse en residentes de Delaware.
- id: 284
  category: driver_responsibility
  question: ¿Qué debe hacer el propietario de un vehículo antes de cancelar el seguro
    de su vehículo por cualquier motivo?
  choices:
    A: Pagar una tarifa de cancelación de $50 al DMV
    B: Entregar su placa de matrícula válida a la División
    C: Notificar a su departamento de policía local
    D: Obtener un registro temporal de 30 días
  answer: B
  explanation: Los propietarios que cancelen el seguro por cualquier motivo deben
    primero entregar su placa de matrícula válida a la División. No hacerlo resultará
    en multas.
- id: 285
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción por conducir un vehículo
    sin seguro en Delaware?
  choices:
    A: Una multa de $500 y una suspensión de 30 días
    B: Una multa de entre $1,500 y $2,000 y una suspensión obligatoria de seis meses
    C: Una multa de $3,000 e incautación del vehículo
    D: Una multa de $100 y una advertencia
  answer: B
  explanation: La sanción por conducir un vehículo sin seguro es una multa no menor
    de $1,500.00 ni mayor de $2,000.00 y la suspensión obligatoria de la licencia
    de conducir y/o los privilegios de conducción por seis meses.
- id: 286
  category: vehicle_information
  question: 'Las luces intermitentes están generalmente prohibidas en los vehículos
    de motor ordinarios, excepto cuando se usan para:'
  choices:
    A: Conducir en niebla densa
    B: Indicar un peligro de tráfico con las luces de emergencia (four-way flashers)
    C: Conducir por debajo del límite de velocidad establecido
    D: Advertir a otros conductores de un control de velocidad policial
  answer: B
  explanation: Las luces intermitentes están generalmente prohibidas excepto en vehículos
    de emergencia, autobuses escolares, equipos de remoción de nieve, para indicar
    giros o como medio para indicar un peligro de tráfico (luces de emergencia).
- id: 287
  category: vehicle_information
  question: Si un vehículo tiene ventanas tintadas instaladas, ¿qué equipo adicional
    debe tener el vehículo?
  choices:
    A: Espejos exteriores tanto en el lado derecho como en el izquierdo
    B: Un sistema de cámara de visión trasera
    C: Faros de descarga de alta intensidad
    D: Una calcomanía especial en la placa de matrícula
  answer: A
  explanation: Los vehículos con tinte instalado deben tener espejos exteriores tanto
    en el lado derecho como en el izquierdo del vehículo.
- id: 288
  category: safe_driving_rules
  question: ¿A qué distancia de un vehículo al que sigue debe cambiar sus faros a
    luces bajas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los faros deben cambiarse a luces bajas cuando se encuentre a menos
    de 200 pies del vehículo al que sigue.
- id: 289
  category: license_system
  question: La ley estatal exige que informe un cambio de dirección a la División
    de Vehículos Motorizados (DMV) ¿dentro de cuántos días?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley estatal exige que los cambios de dirección se informen a la
    División de Vehículos Motorizados dentro de los 30 días.
- id: 290
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima requerida de la banda de rodadura de los
    neumáticos para pasar una inspección de vehículos en Delaware?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 3/32 de pulgada
    D: 4/32 de pulgada
  answer: B
  explanation: Según el manual, la profundidad de la banda de rodadura debe ser de
    al menos 2/32 de pulgada medida en dos bandas de rodadura adyacentes.
- id: 291
  category: vehicle_information
  question: Durante una inspección del parabrisas, ¿una grieta de qué tamaño resultará
    en una falla obligatoria?
  choices:
    A: Más de 2 pulgadas
    B: Más de 3 pulgadas
    C: Más de 4 pulgadas
    D: Más de 5 pulgadas
  answer: D
  explanation: El manual establece que los parabrisas deben estar libres de grietas,
    agujeros o roturas, y que las grietas de más de cinco pulgadas o las astillas
    en forma de estrella de más de una pulgada son elementos de falla obligatoria.
- id: 292
  category: vehicle_information
  question: ¿Cuánto cuesta una inspección de seguridad del vehículo para un residente
    de Delaware?
  choices:
    A: $10.00
    B: $20.00
    C: $35.00
    D: No tiene costo
  answer: D
  explanation: 'El manual establece explícitamente: "No hay ningún cargo por una inspección
    para los residentes de Delaware".'
- id: 293
  category: vehicle_information
  question: Según las regulaciones de Delaware, ¿dónde está estrictamente prohibida
    la aplicación de tintado de ventanas o dispositivos de protección solar?
  choices:
    A: Solo en la ventana trasera
    B: En las ventanas laterales traseras
    C: En el parabrisas delantero y las ventanas laterales delanteras
    D: En cualquier ventana del vehículo
  answer: C
  explanation: El manual especifica que no se puede aplicar ningún tinte o dispositivo
    de protección solar al parabrisas delantero ni a las ventanas laterales delanteras.
- id: 294
  category: penalties_and_points
  question: ¿Cuál es el cargo por mora que se cobra por renovar el registro de un
    vehículo después de que haya vencido?
  choices:
    A: $10.00
    B: $15.00
    C: $20.00
    D: $35.00
  answer: C
  explanation: Se cobra un cargo por mora de $20.00 por la renovación después del
    vencimiento del registro del vehículo.
- id: 295
  category: vehicle_information
  question: Al traer un vehículo motorizado estándar a Delaware desde otro estado,
    ¿cuál es la tarifa de documentación del vehículo que se debe pagar?
  choices:
    A: 3.75 por ciento del valor del vehículo
    B: 4.25 por ciento del valor del vehículo
    C: Una tarifa fija de $35.00
    D: Una tarifa fija de $55.00
  answer: B
  explanation: Siempre que se traiga un vehículo motorizado a Delaware desde otro
    estado, el propietario debe pagar una tarifa de documentación del vehículo del
    4.25 por ciento del valor del vehículo (a menos que se presente un comprobante
    de un impuesto similar pagado a otro estado dentro de los 90 días).
- id: 296
  category: vehicle_information
  question: ¿Cuál es la tarifa para un certificado de título de Delaware si existe
    un gravamen (lien) contra el vehículo?
  choices:
    A: $20.00
    B: $35.00
    C: $40.00
    D: $55.00
  answer: D
  explanation: La tarifa del título es de $35.00 si no hay gravamen o de $55.00 si
    hay un gravamen contra el vehículo.
- id: 297
  category: license_system
  question: Si un solicitante de un certificado de título es menor de 18 años, ¿quién
    debe firmar la solicitud?
  choices:
    A: Un instructor de manejo con licencia
    B: Un notario público
    C: El padre, la madre, el tutor o el custodio designado por el tribunal
    D: Solo el solicitante
  answer: C
  explanation: Si usted es menor de 18 años, su solicitud de certificado de título
    debe estar firmada por su padre, madre, tutor o custodio designado por el tribunal
    que otorgue el consentimiento.
- id: 298
  category: vehicle_information
  question: ¿Con cuánta anticipación puede hacer inspeccionar su vehículo antes de
    la fecha de vencimiento de su registro?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Puede hacer inspeccionar su vehículo en cualquier momento 90 días antes
    de la fecha de vencimiento del registro.
- id: 299
  category: vehicle_information
  question: ¿Los remolques que pesan hasta qué cantidad NO requieren una nueva inspección
    antes de la renovación del registro?
  choices:
    A: 2,000 libras o menos
    B: 3,000 libras o menos
    C: 4,000 libras o menos
    D: 5,000 libras o menos
  answer: C
  explanation: Los remolques que pesan 4,000 libras o menos no requieren una nueva
    inspección antes de la renovación del registro.
- id: 300
  category: license_system
  question: Si cambia su dirección dentro de Delaware, ¿cuántos días tiene para notificar
    al DMV?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Si cambia su dirección dentro de Delaware, tiene treinta (30) días
    para notificar tanto a la Sección de Servicios de Vehículos como a la de Licencias
    de Conducir del DMV.
- id: 301
  category: license_system
  question: ¿Al cambiar su nombre, qué debe completarse ANTES de realizar el cambio
    en el título y el registro de su vehículo?
  choices:
    A: Debe cambiar su nombre en su licencia de conducir
    B: Debe obtener una nueva inspección del vehículo
    C: Debe pagar un cargo por mora de $20
    D: Debe notificar a su compañía de seguros por escrito
  answer: A
  explanation: Este cambio de nombre debe completarse en su licencia de conducir antes
    de realizar el cambio en el título y el registro.
- id: 302
  category: vehicle_information
  question: Los residentes de Delaware pueden renovar su registro por correo si residen
    temporalmente a más de ¿cuántas millas fuera del estado?
  choices:
    A: 50 millas
    B: 100 millas
    C: 150 millas
    D: 200 millas
  answer: D
  explanation: Los residentes de Delaware que residen temporalmente a más de 200 millas
    fuera del estado pueden renovar su registro por correo.
- id: 303
  category: vehicle_information
  question: ¿Qué tipo de prueba de emisiones se utiliza para los vehículos a gasolina
    de 1996 y más nuevos?
  choices:
    A: Prueba de sonda en el tubo de escape
    B: Prueba de Diagnóstico a Bordo (OBD-II)
    C: Inspección visual de humo
    D: Prueba de presión del convertidor catalítico
  answer: B
  explanation: Los vehículos a gasolina de 1996 y los vehículos diésel de 1997, así
    como los más nuevos, se probarán mediante la Prueba de Diagnóstico a Bordo (OBD-II).
- id: 304
  category: vehicle_information
  question: ¿Cuál es la altura máxima permitida del parachoques en los automóviles
    de pasajeros, medida desde el suelo hasta la parte inferior del parachoques?
  choices:
    A: 18 pulgadas
    B: 20 pulgadas
    C: 22 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: La altura del parachoques en los automóviles de pasajeros no debe exceder
    las 22 pulgadas desde el suelo hasta la parte inferior del parachoques.
- id: 305
  category: vehicle_information
  question: ¿A qué distancia fuera del estado debe residir temporalmente un residente
    de Delaware para ser elegible para renovar el registro de su vehículo por correo?
  choices:
    A: Más de 50 millas
    B: Más de 100 millas
    C: Más de 200 millas
    D: Más de 500 millas
  answer: C
  explanation: Según el manual, los residentes de Delaware que residen temporalmente
    a más de 200 millas fuera del estado (como el personal militar y los estudiantes
    universitarios) pueden renovar su registro por correo.
- id: 306
  category: driver_responsibility
  question: ¿Qué documentos deben acompañar a un vehículo motorizado siempre que se
    opere en Delaware?
  choices:
    A: El título del vehículo y el certificado de nacimiento del conductor
    B: El certificado de registro y el comprobante de seguro de responsabilidad civil
    C: El manual del propietario del vehículo y un informe de inspección reciente
    D: La tarjeta de seguro social del conductor y el título del vehículo
  answer: B
  explanation: El manual establece que el certificado de registro y el comprobante
    de seguro de responsabilidad civil deben acompañar al vehículo motorizado siempre
    que esté en funcionamiento.
- id: 307
  category: vehicle_information
  question: ¿Dónde debe colocarse en la placa de matrícula la calcomanía de registro
    que muestra el año y el mes de vencimiento?
  choices:
    A: En la esquina superior izquierda
    B: En la esquina superior derecha
    C: En la esquina inferior izquierda
    D: En la esquina inferior derecha
  answer: D
  explanation: El manual especifica que la placa de matrícula debe llevar la calcomanía
    que muestra el año y el mes de vencimiento en la esquina inferior derecha de la
    placa.
- id: 308
  category: vehicle_information
  question: ¿Cuál es el período de gracia para un registro de vehículo vencido en
    Delaware?
  choices:
    A: 30 días
    B: 15 días
    C: 7 días
    D: No hay período de gracia
  answer: D
  explanation: El manual establece explícitamente que su registro vence a la medianoche
    del día del mes indicado en la calcomanía, y 'No hay período de gracia'.
- id: 309
  category: safe_driving_rules
  question: Según las leyes de vehículos motorizados de Delaware, ¿a quién se le otorga
    el derecho de paso?
  choices:
    A: Al vehículo que llega primero a una intersección
    B: A los peatones en todas las situaciones
    C: A nadie se le otorga el derecho de paso; la ley solo describe quién debe cederlo
    D: A los vehículos que circulan por una carretera de varios carriles
  answer: C
  explanation: El manual señala que las leyes de vehículos motorizados de Delaware
    y otros estados no otorgan a nadie el derecho de paso; más bien, la ley describe
    quién debe ceder el derecho de paso.
- id: 310
  category: signs_and_signals
  question: ¿Bajo qué condición se permite un giro a la izquierda con una luz roja
    fija en Delaware?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de un solo sentido
    B: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido
      después de una parada completa
    C: En cualquier momento que no haya tráfico en sentido contrario
    D: Los giros a la izquierda en rojo nunca están permitidos
  answer: B
  explanation: Los giros a la izquierda en rojo están permitidos después de una parada
    completa desde una calle de un solo sentido hacia otra calle de un solo sentido,
    a menos que lo prohíba una señal publicada o una flecha roja fija.
- id: 311
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: El semáforo está averiado y usted tiene el derecho de paso
    C: Significa lo mismo que una señal de alto; debe detenerse por completo
    D: Prepárese para detenerse ya que la luz va a cambiar a rojo fijo
  answer: C
  explanation: El manual establece que una luz roja intermitente significa lo mismo
    que una señal de alto. Debe detenerse por completo y avanzar solo cuando sea seguro.
- id: 312
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor al acercarse a una intersección donde los
    semáforos están apagados o no iluminados?
  choices:
    A: Mantener la velocidad y avanzar si la intersección está despejada
    B: Tratar la intersección como una parada de cuatro vías (four-way stop)
    C: Reducir la velocidad y prepararse para ceder el paso a otros vehículos que
      estén en la intersección o acercándose a ella
    D: Detenerse a un lado y esperar a que las luces se enciendan de nuevo
  answer: C
  explanation: En caso de semáforos apagados, el conductor que se aproxima debe reducir
    la velocidad y prepararse para ceder el paso a otros vehículos que estén en la
    intersección o acercándose a ella.
- id: 313
  category: signs_and_signals
  question: ¿Qué se requiere cuando se encuentra con una flecha roja intermitente?
  choices:
    A: No puede avanzar en la dirección de la flecha bajo ninguna circunstancia
    B: Puede girar en la dirección de la flecha después de detenerse por completo
      y ceder el paso al tráfico
    C: Debe reducir la velocidad y avanzar sin detenerse si el camino está despejado
    D: Debe esperar a una flecha verde antes de realizar su giro
  answer: B
  explanation: Se permiten los giros en la dirección de una flecha roja intermitente
    después de detenerse por completo, lo que permite a los conductores seleccionar
    un espacio seguro en el tráfico antes de completar el giro.
- id: 314
  category: signs_and_signals
  question: ¿Qué indica una flecha amarilla intermitente?
  choices:
    A: La visualización de la flecha verde ha terminado y debe detenerse
    B: Se permite el movimiento en la dirección indicada después de ceder el paso
      al tráfico en sentido contrario y a los peatones
    C: Usted tiene el derecho de paso exclusivo para girar
    D: El semáforo está a punto de cambiar a verde
  answer: B
  explanation: Una flecha amarilla intermitente significa que se permite el movimiento
    en la dirección indicada después de ceder el paso al tráfico en sentido contrario
    y a los peatones.
- id: 315
  category: sharing_the_road
  question: ¿Qué significa una señal peatonal de "NO CRUCE" (DON'T WALK) intermitente?
  choices:
    A: Los peatones no deben comenzar a cruzar, pero aquellos que ya están cruzando
      deben terminar lo más rápido posible
    B: Los peatones pueden comenzar a cruzar pero deben ceder el paso a los vehículos
      que giran
    C: Los peatones deben detenerse inmediatamente en el cruce peatonal y esperar
      a la siguiente señal
    D: La señal peatonal está fuera de servicio
  answer: A
  explanation: La señal intermitente de NO CRUCE (DON'T WALK) significa que si el
    peatón ha comenzado a cruzar la calle, debe terminar de cruzar lo más rápido posible.
    Si no ha comenzado, no debe hacerlo.
- id: 316
  category: sharing_the_road
  question: ¿Cuál es el propósito de una Señal Peatonal Accesible (APS)?
  choices:
    A: Detener el tráfico automáticamente cuando se acerca un peatón
    B: Comunicar la información de la señal peatonal en formatos no visuales para
      personas ciegas o con discapacidad visual
    C: Proporcionar tiempo de cruce adicional para peatones de edad avanzada
    D: Grabar video de los vehículos que no ceden el paso en los cruces peatonales
  answer: B
  explanation: Una APS comunica la información de la señal peatonal en formatos no
    visuales (tonos audibles, mensajes verbales, superficies vibratorias) para que
    los peatones ciegos o con discapacidad visual sepan cuándo comienza el intervalo
    de CRUCE (WALK).
- id: 317
  category: signs_and_signals
  question: ¿Cómo se activa una señal de Cruce Activado de Alta Intensidad (HAWK)?
  choices:
    A: Por un vehículo que pasa sobre un sensor en la carretera
    B: Por un peatón que presiona el botón del cruce peatonal
    C: Por un vehículo de emergencia que se aproxima
    D: Funciona con un temporizador automático continuo
  answer: B
  explanation: La señal HAWK se activa cuando un peatón presiona el botón del cruce
    peatonal, lo que desencadena una serie de etapas para detener el tráfico y que
    los peatones puedan cruzar.
- id: 318
  category: signs_and_signals
  question: ¿En qué se diferencia una Baliza Rectangular de Destello Rápido (RRFB)
    de una baliza normal?
  choices:
    A: Parpadea con un ritmo lento y constante
    B: Muestra una luz roja fija en lugar de una luz intermitente
    C: Parpadea más rápidamente y en un patrón de "tartamudeo" (stutter)
    D: Solo se activa durante el horario escolar
  answer: C
  explanation: El manual establece que las Balizas Rectangulares de Destello Rápido
    parpadean más rápidamente y en un patrón de "tartamudeo", a diferencia de la frecuencia
    de destello regular de la mayoría de las balizas.
- id: 319
  category: signs_and_signals
  question: ¿Cuál de las siguientes opciones describe la forma y el color de una señal
    de alto (stop sign)?
  choices:
    A: Un diamante de 4 lados que es amarillo con letras negras
    B: Una señal de 8 lados que es roja con letras blancas
    C: Una señal circular que es roja con letras blancas
    D: Un triángulo de 3 lados que es rojo y blanco
  answer: B
  explanation: 'El manual establece explícitamente: "La señal de alto es la única
    señal de 8 lados que verá en la carretera. Es roja con letras blancas".'
- id: 320
  category: signs_and_signals
  question: Al acercarse a una intersección con una señal de alto, ¿dónde debe detenerse
    por completo si no hay una línea de parada o un cruce peatonal?
  choices:
    A: Diez pies antes de la señal de alto
    B: Antes de entrar en la intersección
    C: Al lado de la señal de alto
    D: Después de ceder el paso al primer vehículo a la derecha
  answer: B
  explanation: El manual establece que si no hay una línea de parada o un cruce peatonal,
    debe detenerse por completo antes de entrar en la intersección.
- id: 321
  category: sharing_the_road
  question: ¿Qué señales de tráfico deben obedecer los ciclistas cuando circulan por
    carriles de circulación general en lugar de carriles designados para bicicletas?
  choices:
    A: Solo los indicadores de señal con forma de bicicleta
    B: Señales de cruce de peatones
    C: Las señales de tráfico circulares y de flecha regulares
    D: No están obligados a obedecer las señales de tráfico en los carriles generales
  answer: C
  explanation: Según el manual, los ciclistas que circulan por carriles de circulación
    general deben obedecer las señales de tráfico circulares y de flecha regulares.
- id: 322
  category: signs_and_signals
  question: ¿Cuál es el esquema de colores y la forma típica de las señales reglamentarias?
  choices:
    A: En forma de diamante y amarillas con letras negras
    B: Rectangulares con letras blancas sobre un fondo verde
    C: Cuadradas, rectangulares o de forma especial, generalmente blancas, rojas o
      negras
    D: De cinco lados y de color amarillo-verde fluorescente
  answer: C
  explanation: Las señales reglamentarias son cuadradas, rectangulares o tienen una
    forma especial y suelen ser blancas, rojas o negras con letras o símbolos negros,
    rojos, blancos o verdes.
- id: 323
  category: signs_and_signals
  question: ¿Qué forma y color tiene la señal utilizada exclusivamente para advertir
    sobre escuelas y cruces escolares?
  choices:
    A: Redonda, negra sobre amarillo
    B: De cinco lados, negra sobre amarillo o amarillo-verde fluorescente
    C: De diamante, negra sobre naranja
    D: Rectangular, blanca sobre azul
  answer: B
  explanation: El manual especifica que una señal de cinco lados, negra sobre amarillo
    (o amarillo-verde fluorescente), se utiliza únicamente para advertir sobre escuelas
    y cruces escolares.
- id: 324
  category: signs_and_signals
  question: ¿Qué indica una señal redonda con letras negras sobre un fondo amarillo?
  choices:
    A: Que hay una rotonda más adelante
    B: Que se está aproximando a una intersección entre una carretera y una vía férrea
    C: Que comienza una zona de no rebasar
    D: Que está entrando en una zona escolar
  answer: B
  explanation: Una señal redonda que es negra sobre amarillo se utiliza como advertencia
    anticipada de que se está aproximando a una intersección entre una carretera y
    una vía férrea.
- id: 325
  category: safe_driving_rules
  question: Al conducir por una calzada marcada con una señal de advertencia de "resbaladizo
    cuando está mojado", ¿cuándo es generalmente más peligrosa la superficie de la
    carretera?
  choices:
    A: Durante la primera media hora de lluvia
    B: Después de que haya estado lloviendo durante varias horas
    C: Inmediatamente después de que deje de llover
    D: Cuando la temperatura baja del punto de congelación
  answer: A
  explanation: El manual señala para la señal de "Calzada resbaladiza cuando está
    mojada" que la primera media hora de lluvia es la más peligrosa.
- id: 326
  category: vehicle_information
  question: ¿Qué acción debe tomar cuando vea una señal de advertencia que indica
    una colina empinada más adelante?
  choices:
    A: Poner el vehículo en punto muerto para bajar la colina por inercia
    B: Acelerar para mantener su velocidad
    C: Reducir la velocidad y estar preparado para cambiar a una marcha más baja
    D: Aplicar el freno de emergencia de forma continua
  answer: C
  explanation: Para una colina empinada más adelante, el manual aconseja reducir la
    velocidad y estar preparado para cambiar a una marcha más baja para controlar
    la velocidad y cuidar los frenos.
- id: 327
  category: safe_driving_rules
  question: ¿Cómo deben los conductores ejecutar una "incorporación en cremallera"
    (zipper merge) al acercarse a una reducción de carril?
  choices:
    A: Incorporarse lo antes posible al carril abierto
    B: Detenerse en el carril que se cierra y esperar un espacio en el tráfico
    C: Utilizar ambos carriles para avanzar hasta el punto de reducción de carril
      e incorporarse alternando turnos
    D: Acelerar para rebasar a todos los vehículos antes de que termine el carril
  answer: C
  explanation: El método de incorporación en cremallera espera que los conductores
    en los carriles que se incorporan utilicen ambos carriles para avanzar hasta el
    punto de reducción de carril e incorporarse en ese lugar, alternando turnos.
- id: 328
  category: signs_and_signals
  question: ¿Qué colores se utilizan en los marcadores de ruta en forma de escudo
    para el sistema de autopistas interestatales?
  choices:
    A: Números negros sobre un fondo blanco
    B: Letras blancas sobre un fondo verde
    C: Letras blancas sobre un fondo marrón
    D: Cuarto superior rojo con letras blancas, y una parte inferior azul con números
      blancos
  answer: D
  explanation: El sistema interestatal tiene marcadores de ruta donde el cuarto superior
    lleva la leyenda "interstate" en letras blancas sobre un fondo rojo, mientras
    que los tres cuartos inferiores son azules con el número de la ruta en letras
    blancas grandes.
- id: 329
  category: signs_and_signals
  question: ¿Qué señales son típicamente rectangulares con fondo azul y letras blancas?
  choices:
    A: Señales de servicios para el automovilista (por ejemplo, gasolina, comida,
      alojamiento)
    B: Señales de recreación (por ejemplo, parques estatales)
    C: Señales de guía para destinos y distancias
    D: Señales reglamentarias para límites de velocidad
  answer: A
  explanation: Las señales de información para servicios al automovilista suelen tener
    letras blancas sobre un fondo azul rectangular.
- id: 330
  category: signs_and_signals
  question: ¿Qué indica una baliza intermitente circular roja que complementa una
    señal?
  choices:
    A: Una señal de advertencia o de límite de velocidad
    B: Una señal de Pare (Stop) o de Prohibido el Paso (Do Not Enter)
    C: Una intersección entre una carretera y una vía férrea
    D: Un límite de velocidad en zona escolar
  answer: B
  explanation: El manual establece que las balizas que complementan las señales de
    Pare (Stop) y Prohibido el Paso (Do Not Enter) son rojas.
- id: 331
  category: penalties_and_points
  question: ¿Cuál es la sanción por exceder el límite de velocidad en una zona de
    obras en la carretera?
  choices:
    A: Su licencia es suspendida inmediatamente
    B: Se le requerirá asistir a una escuela de tráfico
    C: Las multas por la infracción de exceso de velocidad se duplican
    D: Recibirá una advertencia por la primera infracción
  answer: C
  explanation: El manual establece explícitamente que las multas por exceder el límite
    de velocidad en una zona de obras se duplican.
- id: 332
  category: defensive_driving
  question: ¿Cuál de las siguientes es una práctica de conducción segura recomendada
    al viajar a través de una zona de obras?
  choices:
    A: Zigzaguear de carril en carril para evitar vehículos lentos
    B: Frenar repentinamente si ve trabajadores
    C: Frenar gradualmente para dar a los conductores detrás de usted tiempo suficiente
      para reducir la velocidad
    D: Conducir por el arcén para evitar el tráfico detenido
  answer: C
  explanation: 'Al conducir a través de una zona de obras, el manual aconseja: ''No
    zigzaguee de carril en carril. Frene gradualmente para dar a los conductores detrás
    de usted tiempo suficiente para reducir la velocidad''.'
- id: 333
  category: signs_and_signals
  question: ¿Qué indica a los conductores una señal de advertencia de 'Carril añadido'
    (Added lane)?
  choices:
    A: No es necesario incorporarse, pero esté atento a otros vehículos que cambien
      de carril
    B: Debe incorporarse inmediatamente al carril izquierdo
    C: La calzada se estrecha a un solo carril más adelante
    D: Comienza el tráfico en dos direcciones
  answer: A
  explanation: La señal de 'Carril añadido' significa que no es necesario incorporarse,
    pero debe estar atento a otros vehículos que cambien de carril.
- id: 334
  category: signs_and_signals
  question: Al conducir bajo una señal de carril elevada, ¿qué significa si se utiliza
    la palabra 'ONLY' (SOLO) con una flecha?
  choices:
    A: Puede elegir seguir recto o girar en la dirección de la flecha
    B: Debe ir en la dirección que indica la flecha sin ninguna otra opción
    C: Solo los vehículos de alta ocupación pueden usar el carril
    D: El carril está reservado solo para vehículos de emergencia
  answer: B
  explanation: El manual establece que cuando se utiliza la palabra 'ONLY' en una
    señal de carril elevada, debe ir en la dirección que indica la flecha; no hay
    otra opción.
- id: 335
  category: signs_and_signals
  question: ¿De qué color y forma son la mayoría de las señales de advertencia utilizadas
    en las áreas de obras en calles y carreteras?
  choices:
    A: Rojas y octogonales
    B: Naranjas y en forma de diamante
    C: Amarillas y circulares
    D: Blancas y rectangulares
  answer: B
  explanation: El manual establece que la mayoría de las señales de advertencia utilizadas
    en las áreas de obras en calles y carreteras son naranjas y tienen forma de diamante.
- id: 336
  category: safe_driving_rules
  question: Según la ley de Delaware, ¿cuál de las siguientes acciones está permitida
    al conducir?
  choices:
    A: Enviar mensajes de texto en un dispositivo de mano
    B: Usar una computadora portátil o portátil
    C: Marcar un número de teléfono y luego soltar el dispositivo
    D: Jugar juegos en un dispositivo electrónico de mano
  answer: C
  explanation: A los conductores se les permite marcar un número de teléfono o activar/desactivar
    su equipo inalámbrico, y luego deben soltar el dispositivo.
- id: 337
  category: license_system
  question: ¿Cuál es la regla de uso de teléfonos celulares para los conductores con
    una Licencia de Conducir Graduada (GDL)?
  choices:
    A: Pueden usar dispositivos de manos libres únicamente.
    B: Está prohibido todo uso de teléfonos celulares o dispositivos electrónicos.
    C: Pueden enviar mensajes de texto pero no realizar llamadas de voz.
    D: Pueden usar dispositivos de mano solo para informar una emergencia.
  answer: B
  explanation: El manual señala que todo uso de teléfonos celulares o dispositivos
    electrónicos, incluyendo los de manos libres, está prohibido para los conductores
    con una Licencia de Conducir Graduada (GDL).
- id: 338
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe hacer la señal antes de la acción prevista,
    como detenerse, girar o cambiar de carril?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: La ley de Delaware exige que se haga la señal 300 pies antes de la
    acción prevista.
- id: 339
  category: sharing_the_road
  question: ¿Cuándo debe detenerse ante un autobús escolar que está cargando o descargando
    niños?
  choices:
    A: Solo cuando viaja en la misma dirección que el autobús.
    B: Desde cualquier dirección, a menos que se encuentre en el lado opuesto de una
      carretera con cuatro o más carriles.
    C: Solo si el autobús está detenido en una carretera de dos carriles.
    D: Nunca se requiere que se detenga, pero debe reducir la velocidad a 15 mph.
  answer: B
  explanation: Siempre debe detenerse antes de llegar a cualquier autobús escolar
    desde cualquier dirección cuando esté detenido para cargar o descargar niños en
    edad escolar, excepto cuando se encuentre en el lado opuesto de una carretera
    que tenga cuatro o más carriles.
- id: 340
  category: safe_driving_rules
  question: ¿Qué debe hacer ante la aproximación inmediata de un vehículo de emergencia
    autorizado que utiliza una sirena o luces intermitentes?
  choices:
    A: Detenerse inmediatamente en su carril actual.
    B: Acelerar para despejar la intersección rápidamente.
    C: Ceder el paso y conducir hacia el borde o la acera de la derecha, despejando
      cualquier intersección.
    D: Moverse al carril izquierdo y reducir la velocidad.
  answer: C
  explanation: Todos los demás vehículos deberán ceder el paso y conducirán inmediatamente
    hacia el borde o la acera de la derecha de la calzada, despejando cualquier intersección,
    hasta que el vehículo de emergencia autorizado haya pasado.
- id: 341
  category: defensive_driving
  question: ¿Qué debe hacer si se encuentra en una carretera de dos carriles y se
    aproxima a un vehículo de emergencia estacionado con luces intermitentes?
  choices:
    A: Detenerse y esperar a que el vehículo apague sus luces.
    B: Cambiarse al carril de la izquierda.
    C: Mantener su velocidad y tocar la bocina.
    D: Reducir la velocidad por debajo del límite de velocidad indicado hasta que
      haya pasado completamente el vehículo.
  answer: D
  explanation: En una carretera de dos carriles, la Ley de Moverse a un Lado (Move
    Over Law) exige que reduzca la velocidad por debajo del límite de velocidad indicado
    hasta que haya pasado completamente el vehículo o vehículos detenidos.
- id: 342
  category: safe_driving_rules
  question: 'Si un oficial de policía le da una instrucción que contradice una señal
    de tráfico, usted debe:'
  choices:
    A: Obedecer la señal de tráfico.
    B: Obedecer la instrucción del oficial de policía.
    C: Detenerse a un lado y esperar a que cambie la señal.
    D: Proceder con precaución usando su propio juicio.
  answer: B
  explanation: Debe obedecer las instrucciones de un oficial de policía, incluso si
    son contrarias a las leyes, letreros, señales y marcas viales.
- id: 343
  category: safe_driving_rules
  question: ¿Es legal transitar por una propiedad privada para evadir una señal de
    tráfico o un letrero vial?
  choices:
    A: Sí, si la intersección está bloqueada por un accidente.
    B: Sí, si tiene el permiso del dueño de la propiedad.
    C: No, no debe intentar evadir una señal de tráfico o un letrero vial de esta
      manera.
    D: No, a menos que sea entre las horas de medianoche y las 6 AM.
  answer: C
  explanation: No debe intentar evadir una señal de tráfico o un letrero vial saliéndose
    de la carretera y transitando por una propiedad privada.
- id: 344
  category: signs_and_signals
  question: ¿Qué información se encuentra en el letrero azul del Sistema de Notificación
    de Emergencia (ENS) en un cruce de ferrocarril?
  choices:
    A: El horario del tren y el mapa de la ruta
    B: Un número de despacho de emergencia y un número del DOT que identifica la ubicación
    C: El límite de velocidad para los trenes que pasan
    D: La altura de despeje del cruce de ferrocarril
  answer: B
  explanation: El letrero ENS contiene un número de despacho de emergencia para contactar
    al ferrocarril y un número del DOT que identifica la ubicación física del cruce
    a nivel.
- id: 345
  category: defensive_driving
  question: 'Al cruzar las vías del ferrocarril, es prudente NO:'
  choices:
    A: Mirar a ambos lados
    B: Cambiar de marcha (velocidades)
    C: Mantener una velocidad constante
    D: Revisar si hay señales de advertencia
  answer: B
  explanation: Es prudente no cambiar de marcha al cruzar las vías del ferrocarril,
    en caso de que el motor se apague.
- id: 346
  category: signs_and_signals
  question: ¿Cómo es la señal de advertencia anticipada para un cruce de ferrocarril?
  choices:
    A: Un octágono rojo con letras blancas
    B: Un rectángulo blanco con letras negras
    C: Una señal circular amarilla con un símbolo de “X” y las letras “RR” en negro
    D: Un diamante amarillo con un símbolo de tren en negro
  answer: C
  explanation: Una señal de advertencia circular amarilla con un símbolo de “X” y
    las letras “RR” en negro se coloca a lo largo de la carretera antes de llegar
    a un cruce de ferrocarril. Esta es la señal de advertencia anticipada.
- id: 347
  category: sharing_the_road
  question: Si otro vehículo lo está adelantando (pasando), ¿qué le exige la ley de
    Delaware que haga?
  choices:
    A: Ceder el paso hacia la derecha y no aumentar su velocidad hasta ser completamente
      adelantado.
    B: Acelerar para evitar que lo pasen.
    C: Moverse a la izquierda para bloquear su camino.
    D: Encender y apagar sus faros para advertirles.
  answer: A
  explanation: Los vehículos que están siendo adelantados deben ceder el paso hacia
    la derecha y no aumentar su velocidad hasta que hayan sido completamente adelantados.
- id: 348
  category: signs_and_signals
  question: ¿Qué indica una señal de advertencia circular amarilla con un símbolo
    de 'X' y las letras 'RR' en negro?
  choices:
    A: Se encuentra actualmente en un cruce de ferrocarril.
    B: Es una señal de advertencia anticipada colocada antes de llegar a un cruce
      de ferrocarril.
    C: El cruce de ferrocarril adelante está cerrado al tráfico.
    D: Los trenes se están aproximando actualmente al cruce.
  answer: B
  explanation: El manual establece que una señal de advertencia circular amarilla
    con un símbolo de 'X' y las letras 'RR' en negro se coloca a lo largo de la carretera
    antes de llegar a un cruce de ferrocarril. Esta es la señal de advertencia anticipada.
- id: 349
  category: signs_and_signals
  question: Una señal blanca en forma de 'X' (crossbuck) ubicada en un cruce de ferrocarril,
    ¿tiene el mismo significado que qué otra señal?
  choices:
    A: Una señal de Pare (Stop)
    B: Una señal de Ceda el paso (Yield)
    C: Una señal de No entrar (Do Not Enter)
    D: Una señal de Límite de velocidad
  answer: B
  explanation: Según el manual, una señal blanca en forma de 'X' o 'crossbuck' con
    la leyenda 'Railroad Crossing' tiene el mismo significado que una señal de Ceda
    el paso, lo que significa que debe ceder el paso a los trenes que cruzan.
- id: 350
  category: safe_driving_rules
  question: ¿Qué indican las líneas blancas sólidas dobles entre los carriles de tráfico?
  choices:
    A: Puede cruzarlas para cambiar de carril si es seguro hacerlo.
    B: Se le desaconseja cambiar de carril.
    C: El cambio de carril está prohibido.
    D: El carril está reservado para vehículos de alta ocupación.
  answer: C
  explanation: El manual establece explícitamente que 'Las líneas blancas sólidas
    dobles prohíben el cambio de carril'.
- id: 351
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia puede cruzar una línea amarilla continua entre
    carriles de tráfico opuestos?
  choices:
    A: Al adelantar a un vehículo que circula despacio en una carretera de dos carriles.
    B: Al girar hacia una entrada privada (driveway), si es seguro hacerlo.
    C: Cuando el vehículo delante de usted está detenido en un semáforo.
    D: Nunca puede cruzar una línea amarilla continua bajo ninguna circunstancia.
  answer: B
  explanation: El manual señala que, aunque generalmente no se puede adelantar cruzando
    una línea amarilla continua, "puede cruzar una línea amarilla continua para girar
    hacia una entrada privada (driveway), si es seguro hacerlo".
- id: 352
  category: signs_and_signals
  question: Al conducir en un carril reversible, ¿qué significa una señal de "X" amarilla
    fija sobre el carril?
  choices:
    A: Puede usar el carril debajo de ella.
    B: No puede usar el carril debajo de ella.
    C: El uso del carril está cambiando y debe salir de él tan pronto como sea seguro.
    D: Debe detenerse inmediatamente en el carril.
  answer: C
  explanation: Según la sección del manual sobre Carriles Reversibles, "una 'X' amarilla
    fija significa que el uso del carril está cambiando y debe salir de él tan pronto
    como sea seguro hacerlo".
- id: 353
  category: signs_and_signals
  question: ¿Qué indica una señal de "HOV 3" sobre un carril reservado?
  choices:
    A: El carril está reservado para vehículos con al menos tres personas en ellos.
    B: El carril está reservado para vehículos que viajan a al menos 30 mph.
    C: El carril solo está abierto durante tres horas al día.
    D: El carril está reservado para vehículos comerciales con 3 o más ejes.
  answer: A
  explanation: El manual explica que HOV (por sus siglas en inglés) significa "Vehículos
    de Alta Ocupación" y una señal de "HOV 3" significa que "debe haber al menos tres
    personas en el vehículo".
- id: 354
  category: safe_driving_rules
  question: ¿Cuál es la velocidad recomendada al acercarse a una rotonda?
  choices:
    A: 5-10 mph
    B: 10-15 mph
    C: 15-20 mph
    D: 20-25 mph
  answer: B
  explanation: El manual instruye a los conductores que, al acercarse a una rotonda,
    deben "mantenerse a la derecha de la isla divisoria y reducir la velocidad a 10-15
    mph".
- id: 355
  category: sharing_the_road
  question: Al circular por una rotonda, ¿quién tiene el derecho de paso?
  choices:
    A: Los vehículos que entran a la rotonda.
    B: Los peatones que esperan para cruzar fuera de la rotonda.
    C: Los vehículos que ya están en la rotonda.
    D: Los vehículos que se aproximan por la derecha.
  answer: C
  explanation: 'El manual establece: "Una vez que esté en la rotonda, no se detenga
    excepto para evitar una colisión; usted tiene el derecho de paso sobre el tráfico
    que entra". Debe "ceder el paso al tráfico que ya está en la rotonda" al entrar.'
- id: 356
  category: safe_driving_rules
  question: ¿Cuál es una característica operativa única de una Intersección de Diamante
    Divergente (DDI)?
  choices:
    A: El tráfico se mueve en el sentido de las agujas del reloj alrededor de una
      isla central.
    B: El tráfico circula brevemente por el lado izquierdo de la carretera para permitir
      giros a la izquierda sin cruzar el tráfico que viene en sentido contrario.
    C: Todos los vehículos deben detenerse por completo antes de entrar en la intersección.
    D: Los giros a la izquierda están completamente prohibidos para reducir los puntos
      de conflicto.
  answer: B
  explanation: 'El manual describe una DDI indicando: "Dentro del intercambio, el
    tráfico circula brevemente por el lado izquierdo de la carretera para permitir
    que los movimientos de giro a la izquierda ocurran sin cruzar el tráfico que viene
    en sentido contrario ni detenerse".'
- id: 357
  category: signs_and_signals
  question: ¿Cómo están marcados a cada lado los carriles centrales compartidos, que
    están reservados para realizar giros a la izquierda o giros en U?
  choices:
    A: Por líneas amarillas continuas dobles.
    B: Por una línea blanca continua y una línea blanca discontinua.
    C: Por una línea amarilla continua y una línea amarilla discontinua.
    D: Por líneas amarillas discontinuas dobles.
  answer: C
  explanation: Según la sección de Carril Central Compartido, "estos carriles están
    marcados a cada lado por una línea amarilla continua y una línea amarilla discontinua".
- id: 358
  category: safe_driving_rules
  question: ¿Cuándo es aceptable dar marcha atrás con un vehículo en un carril de
    circulación?
  choices:
    A: Cuando se pasa de su giro o salida.
    B: Solo para estacionar en paralelo o si es necesario para salir de una entrada
      privada (driveway).
    C: Cuando necesite dejar a un pasajero rápidamente.
    D: Cuando la carretera esté libre de tráfico por al menos 500 pies.
  answer: B
  explanation: 'La sección de Reglas Generales establece: "Nunca dé marcha atrás con
    un vehículo en ningún carril de circulación, excepto para estacionar en paralelo,
    o si es necesario para salir de una entrada privada (driveway). Es inseguro hacerlo".'
- id: 359
  category: safe_driving_rules
  question: En una carretera con tres o más carriles que viajan en la misma dirección,
    ¿qué carril debe usar si hay mucho tráfico entrando o saliendo?
  choices:
    A: El carril del extremo derecho
    B: El carril del extremo izquierdo
    C: El carril de circulación central
    D: El acotamiento (shoulder)
  answer: C
  explanation: 'El manual aconseja: "En una carretera con tres o más carriles que
    viajan en la misma dirección, si hay mucho tráfico entrando o saliendo, use el
    carril de circulación central".'
- id: 360
  category: safe_driving_rules
  question: En Delaware, ¿es legal adelantar por la derecha a los vehículos que giran
    a la izquierda utilizando el acotamiento (shoulder)?
  choices:
    A: Sí, pero se requiere un cuidado extremo porque otros conductores no esperarán
      que usted esté allí.
    B: Sí, y usted tiene automáticamente el derecho de paso sobre todo el resto del
      tráfico.
    C: No, adelantar por la derecha siempre es ilegal.
    D: No, adelantar por el acotamiento está estrictamente prohibido bajo cualquier
      circunstancia.
  answer: A
  explanation: 'El manual establece: "Puede usar el acotamiento (shoulder) para adelantar
    por la derecha a los vehículos que giran a la izquierda en Delaware; sin embargo,
    otros conductores no esperarán que usted esté allí, por lo que se requiere un
    cuidado extremo".'
- id: 361
  category: defensive_driving
  question: Al girar a la derecha, ¿por qué debe evitar abrirse demasiado hacia la
    izquierda antes de realizar el giro?
  choices:
    A: Hará que el motor de su vehículo se apague.
    B: El conductor detrás de usted puede pensar que está cambiando de carril o girando
      a la izquierda e intentar rebasarlo por la derecha.
    C: Es ilegal girar el volante a la izquierda cuando su luz direccional indica
      a la derecha.
    D: No podrá ver a los peatones en el cruce peatonal.
  answer: B
  explanation: 'El manual advierte con respecto a los giros a la derecha: ''Si se
    abre demasiado, el conductor detrás de usted puede pensar que está cambiando de
    carril o que va a girar a la izquierda y puede intentar rebasarlo por la derecha''.'
- id: 362
  category: safe_driving_rules
  question: ¿En qué carril de aproximación debe estar al acercarse a una rotonda si
    tiene la intención de seguir recto?
  choices:
    A: Solo en el carril de aproximación derecho.
    B: Solo en el carril de aproximación izquierdo.
    C: Cualquier carril de aproximación está bien.
    D: El carril central de giro.
  answer: C
  explanation: 'Las instrucciones del manual sobre cómo usar una rotonda establecen:
    ''esté en el carril de aproximación derecho si tiene la intención de girar a la
    derecha, esté en el carril de aproximación izquierdo si tiene la intención de
    hacer un giro a la izquierda o un giro en U, y cualquier carril de aproximación
    está bien si va a seguir recto''.'
- id: 363
  category: safe_driving_rules
  question: ¿Qué regla se aplica al cruzar una mediana legal no señalizada?
  choices:
    A: Mantenerse a la izquierda
    B: Mantenerse a la derecha
    C: Ceder el paso a todos los vehículos detrás de usted
    D: Detenerse y esperar una luz verde
  answer: B
  explanation: Cuando el cruce es legal y no está marcado de otra manera, la regla
    de "mantenerse a la derecha" se aplica en los cruces de medianas. Los conductores
    deben tratar la mediana igual que una calzada y permanecer a la derecha de la
    apertura.
- id: 364
  category: sharing_the_road
  question: ¿Por qué debe evitar usar la bocina al ceder el paso a un peatón con un
    perro guía o un bastón blanco?
  choices:
    A: Es ilegal usar la bocina en un cruce peatonal
    B: Podría confundir o asustar al peatón ciego
    C: Indica a otros conductores que lo rebasen
    D: Hará que el perro guía se vuelva agresivo
  answer: B
  explanation: Los peatones que usan un perro guía o llevan un bastón blanco tienen
    el derecho de paso absoluto. No use la bocina, ya que podría confundir o asustar
    al peatón ciego.
- id: 365
  category: safe_driving_rules
  question: Si dos vehículos llegan a una parada de 4 vías exactamente al mismo tiempo,
    ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo a la izquierda
    B: El vehículo a la derecha
    C: El vehículo que viaja más rápido
    D: El vehículo que gira a la izquierda
  answer: B
  explanation: En una parada de 4 vías, el conductor que llega primero a la intersección
    pasa primero. Si más de un vehículo llega al mismo tiempo, el vehículo a la derecha
    pasa primero.
- id: 366
  category: sharing_the_road
  question: ¿Qué debe hacer si se encuentra en una intersección y se aproxima un vehículo
    de emergencia con su sirena y luces intermitentes encendidas?
  choices:
    A: Detenerse inmediatamente en medio de la intersección
    B: Orillarse al borde derecho de la intersección
    C: Cruzar la intersección antes de orillarse
    D: Salir de la intersección en reversa
  answer: C
  explanation: Si se encuentra en una intersección, cruce la intersección antes de
    orillarse al borde derecho de la carretera para dejar pasar a un vehículo de emergencia.
- id: 367
  category: signs_and_signals
  question: ¿Qué indican las luces amarillas intermitentes alternas en la parte superior
    de un autobús escolar?
  choices:
    A: El autobús está experimentando una falla mecánica
    B: El autobús está a punto de activar sus luces rojas para subir o bajar niños
    C: El autobús viaja a una velocidad inferior a 15 mph
    D: El autobús está cediendo el paso a un vehículo de emergencia
  answer: B
  explanation: Las luces amarillas se activarán aproximadamente 10 segundos antes
    de las luces rojas intermitentes superiores para advertir a los conductores de
    los vehículos que se aproximan que se está a punto de realizar una parada para
    subir o bajar escolares.
- id: 368
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción al rebasar un autobús escolar
    detenido con sus luces rojas intermitentes?
  choices:
    A: Una multa de $50 y una advertencia
    B: Una suspensión de la licencia por un mes y una multa de $115 a $230
    C: Una suspensión de la licencia por seis meses y una multa de $500
    D: Una sentencia de prisión obligatoria de un año
  answer: B
  explanation: Por una primera infracción, el conductor es multado con $115 a $230
    (o encarcelado de 30 a 60 días) y la División de Vehículos Motorizados suspenderá
    la licencia de conducir por un período de un mes.
- id: 369
  category: safe_driving_rules
  question: Al estacionarse en paralelo en una carretera de dos sentidos, ¿a qué distancia
    debe estar su vehículo del bordillo o del borde de la carretera?
  choices:
    A: A menos de 6 pulgadas
    B: A menos de 12 pulgadas
    C: A menos de 18 pulgadas
    D: A menos de 24 pulgadas
  answer: B
  explanation: Al estacionarse en una carretera de dos sentidos, debe estacionarse
    en paralelo y a menos de 12 pulgadas del bordillo o del borde de la carretera.
- id: 370
  category: vehicle_information
  question: Si su automóvil tiene transmisión manual, ¿cómo debe dejarlo cuando esté
    estacionado y orientado cuesta abajo?
  choices:
    A: En punto muerto (neutral)
    B: En marcha baja
    C: En reversa
    D: En marcha alta
  answer: C
  explanation: Si su automóvil tiene transmisión manual, déjelo en reversa cuando
    esté estacionado y orientado cuesta abajo. Esto ayudará a prevenir un choque si
    su freno de emergencia o de estacionamiento fallara.
- id: 371
  category: safe_driving_rules
  question: En una intersección donde no hay una señal de alto (stop), una señal de
    ceder el paso (yield) o un semáforo, ¿a qué vehículo debe cederle el paso?
  choices:
    A: A los vehículos que vienen por la izquierda
    B: A los vehículos que vienen por la derecha
    C: A los vehículos que giran a la izquierda
    D: A los vehículos que se mueven más rápido
  answer: B
  explanation: En una intersección donde no hay señal de alto, señal de ceder el paso
    o semáforo, los conductores deben ceder el paso a los vehículos que vienen por
    la derecha.
- id: 372
  category: safe_driving_rules
  question: ¿Cuándo es legal entrar en una intersección?
  choices:
    A: Tan pronto como la luz cambie a verde, independientemente del tráfico que haya
      adelante
    B: Solo cuando pueda atravesarla sin tener que detenerse
    C: Cuando esté girando a la derecha en rojo, incluso si bloquea el paso de peatones
    D: Siempre que tenga el derecho de paso, incluso si el tráfico está congestionado
  answer: B
  explanation: Los conductores no pueden entrar en una intersección a menos que puedan
    atravesarla sin tener que detenerse. Debe esperar hasta que el tráfico de adelante
    avance para no bloquear la intersección.
- id: 373
  category: safe_driving_rules
  question: ¿Cuándo es legal conducir sobre una acera?
  choices:
    A: Para evitar un atasco de tráfico
    B: Al estacionar su vehículo
    C: Solo para cruzarla al entrar o salir de una entrada privada (driveway), callejón
      o estacionamiento
    D: Nunca es legal bajo ninguna circunstancia
  answer: C
  explanation: Los conductores que cruzan una acera para entrar o salir de una entrada
    privada, callejón o estacionamiento deben ceder el paso a los peatones. Es ilegal
    conducir sobre una acera excepto para cruzarla.
- id: 374
  category: penalties_and_points
  question: Bajo el Programa Piloto de Seguridad de Autobuses Escolares, ¿cuál es
    la multa civil por una primera infracción de no cumplir con la ley de detención
    ante un autobús escolar detectada mediante un sistema de cámaras?
  choices:
    A: $50
    B: $100
    C: $230
    D: $500
  answer: B
  explanation: El propietario u operador de un vehículo que no haya cumplido con la
    ley de detención ante un autobús escolar, según lo evidenciado por la información
    obtenida de un sistema de cámaras de seguridad de autobuses escolares, estará
    sujeto a una multa civil o administrativa de $100 por una primera infracción.
- id: 375
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso cuando un conductor entra en una glorieta
    o rotonda?
  choices:
    A: El conductor que entra en la glorieta
    B: Los conductores que ya están en la glorieta
    C: El conductor a la derecha
    D: El conductor que viaja a una velocidad mayor
  answer: B
  explanation: Los conductores que entran en una glorieta o rotonda deben ceder el
    paso a los conductores que ya se encuentran dentro de la misma.
- id: 376
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un paso obligatorio al estacionar y dejar su
    vehículo en una carretera o calle?
  choices:
    A: Dejar el motor en marcha para salidas rápidas
    B: Mantener las llaves en el encendido
    C: Apagar el motor, bloquear el encendido, quitar la llave y poner los frenos
    D: Dejar las ventanillas bajadas
  answer: C
  explanation: Al estacionar y dejar su vehículo en una carretera o calle, debe apagar
    el motor, bloquear el encendido, quitar la llave y poner los frenos.
- id: 377
  category: safe_driving_rules
  question: Al estacionar cuesta arriba en una calle con bordillo (acera), ¿hacia
    qué lado debe girar las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Hacia adelante, rectas
    D: Hacia el borde de la carretera
  answer: B
  explanation: Cuando se estaciona cuesta arriba y hay un bordillo, debe girar las
    ruedas delanteras en dirección contraria al bordillo y hacer que la rueda delantera
    del lado más cercano entre en contacto con el bordillo.
- id: 378
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en una zona escolar en Delaware?
  choices:
    A: 15 millas por hora
    B: 20 millas por hora
    C: 25 millas por hora
    D: 35 millas por hora
  answer: B
  explanation: De acuerdo con la tabla de límites de velocidad, el límite de velocidad
    en zonas escolares es de 20 millas por hora.
- id: 379
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en la Ruta 1 y la Interestatal 495?
  choices:
    A: 55 millas por hora
    B: 60 millas por hora
    C: 65 millas por hora
    D: 70 millas por hora
  answer: C
  explanation: El límite de velocidad en la Ruta 1 y la interestatal 495 es de 65
    millas por hora.
- id: 380
  category: signs_and_signals
  question: ¿Qué indica una señal de velocidad recomendada (advisory speed sign)?
  choices:
    A: El límite de velocidad máximo legal absoluto
    B: Una velocidad recomendada para las condiciones, a menudo mostrada debajo de
      una señal de advertencia
    C: La velocidad mínima a la que se le permite viajar
    D: Un límite de velocidad que solo se aplica por la noche
  answer: B
  explanation: Las señales de velocidad recomendada tienen letras negras sobre un
    fondo amarillo y advierten que las condiciones a menudo pueden hacer que sea inseguro
    conducir más rápido. Son velocidades recomendadas, no límites de velocidad específicos.
- id: 381
  category: sharing_the_road
  question: Si un peatón debe caminar por una calzada por la noche, ¿qué le exige
    la ley que haga?
  choices:
    A: Caminar en el centro del carril
    B: Llevar una luz o un reflector
    C: Caminar en la misma dirección que el tráfico
    D: Usar ropa oscura para evitar distraer a los conductores
  answer: B
  explanation: Es ilegal que un peatón camine por cualquier calzada por la noche sin
    llevar una luz o un reflector.
- id: 382
  category: sharing_the_road
  question: Al caminar por una carretera donde no hay acera, ¿cómo debe caminar un
    peatón?
  choices:
    A: Por el arcén de frente al tráfico que viene en sentido contrario
    B: Por el arcén en la misma dirección que el tráfico
    C: En el carril de tráfico situado más a la derecha
    D: En la mediana de la autopista
  answer: A
  explanation: Cuando no hay acera, los peatones deben caminar por el arcén de frente
    al tráfico que viene en sentido contrario, lo más lejos posible de la carretera.
- id: 383
  category: safe_driving_rules
  question: ¿A cuántos pies de una baliza intermitente, señal de alto (stop) o señal
    de tráfico no debe estacionar su vehículo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Es ilegal detenerse o estacionarse a menos de 30 pies de cualquier
    baliza intermitente, señal de alto o señal de tráfico.
- id: 384
  category: safe_driving_rules
  question: ¿Cuál de las siguientes opciones describe mejor la Restricción General
    de Velocidad en Delaware?
  choices:
    A: Siempre debe conducir exactamente al límite de velocidad indicado.
    B: No debe conducir a una velocidad superior a la que sea razonable bajo las condiciones
      existentes.
    C: Puede exceder el límite de velocidad por 5 mph para adelantar a otro vehículo.
    D: Debe conducir al menos 10 mph por debajo del límite de velocidad en caso de
      mal tiempo.
  answer: B
  explanation: La Restricción General de Velocidad establece que no debe conducir
    en una autopista de Delaware a una velocidad superior a la que sea razonable bajo
    las condiciones existentes.
- id: 385
  category: vehicle_information
  question: Al estacionar un vehículo en el arcén de una autopista desde el atardecer
    hasta el amanecer, ¿qué debe hacer?
  choices:
    A: Encender las luces altas
    B: Encender las luces de estacionamiento o las luces intermitentes de advertencia
      (4-way flashers)
    C: Activar la luz de giro solo del lado de la calle
    D: Dejar encendida la luz interior del techo
  answer: B
  explanation: Cuando estacione un vehículo en el arcén desde el atardecer hasta el
    amanecer, debe encender las luces de estacionamiento o las luces intermitentes
    de advertencia. Las luces de giro no deben parpadear en un solo lado.
- id: 386
  category: sharing_the_road
  question: Si un vehículo se detiene frente a usted para permitir que un peatón cruce
    la carretera, ¿qué debe hacer?
  choices:
    A: Tocar la bocina para alertar al peatón
    B: Adelantar al vehículo detenido por la derecha
    C: Adelantar al vehículo detenido por la izquierda
    D: No debe adelantar al vehículo detenido
  answer: D
  explanation: Como conductor, no debe adelantar a un vehículo que se ha detenido
    para permitir que un peatón cruce la carretera.
- id: 387
  category: defensive_driving
  question: 'Al abrir la puerta de un vehículo estacionado del lado de la calle, debe
    estar especialmente atento a:'
  choices:
    A: Peatones en la acera
    B: Ciclistas que se aproximan
    C: Vehículos que salen de entradas privadas en reversa
    D: Niños jugando en la calle
  answer: B
  explanation: Gire y verifique si viene algún vehículo si debe usar la puerta del
    lado de la calle. Esté especialmente atento a los ciclistas que se aproximan;
    pueden resultar gravemente heridos por una colisión con la puerta de un automóvil.
- id: 388
  category: sharing_the_road
  question: ¿Cuándo debe un peatón ceder el paso a los vehículos?
  choices:
    A: Al cruzar dentro de un paso de peatones marcado.
    B: Al cruzar la calzada donde se dispone de un túnel para peatones o un paso elevado.
    C: Cuando son ciegos y cruzan con un bastón blanco.
    D: Al cruzar con una señal de "caminar" (walk).
  answer: B
  explanation: Los peatones deben ceder el paso al cruzar la calzada donde se dispone
    de un túnel para peatones o un paso elevado, o al cruzar fuera de un paso de peatones
    marcado o no marcado en una intersección.
- id: 389
  category: sharing_the_road
  question: Según la ley de Delaware, ¿qué carreteras NO tienen permitido usar los
    ciclistas?
  choices:
    A: Autopistas de acceso limitado
    B: Carreteras rurales de dos carriles
    C: Carreteras con un límite de velocidad superior a 45 mph
    D: Carreteras sin carriles para bicicletas designados
  answer: A
  explanation: Los ciclistas tienen derecho a utilizar todas las carreteras de Delaware,
    excepto las autopistas de acceso limitado.
- id: 390
  category: safe_driving_rules
  question: Según la Ley de Delaware Amigable con las Bicicletas (Bicycle Friendly
    Delaware Act), ¿qué debe hacer un conductor al adelantar a una bicicleta si el
    carril de circulación es demasiado estrecho para compartirlo?
  choices:
    A: Tocar la bocina para advertir al ciclista que se mueva.
    B: Pasar cerca mientras reduce la velocidad a 15 mph.
    C: Cambiar completamente de carril, incluso si requiere cruzar una línea amarilla
      doble.
    D: Compartir el carril pero dejar al menos un pie de distancia.
  answer: C
  explanation: La ley exige que los conductores cambien completamente de carril (incluyendo
    cruzar una línea central amarilla doble) al adelantar bicicletas si los carriles
    de circulación son demasiado estrechos para compartirlos de forma segura lado
    a lado.
- id: 391
  category: defensive_driving
  question: ¿Cuándo es legal que un automovilista toque la bocina a un ciclista?
  choices:
    A: Cuando el ciclista circula demasiado despacio en el centro del carril.
    B: Al advertir al ciclista de una colisión o peligro inminente.
    C: Al prepararse para rebasar al ciclista en una carretera de dos carriles.
    D: Cuando el ciclista se aproxima a una señal de alto (stop).
  answer: B
  explanation: Los automovilistas tienen prohibido tocar la bocina a los ciclistas
    a menos que exista un peligro o colisión inminente.
- id: 392
  category: safe_driving_rules
  question: Al rebasar una bicicleta en un carril de circulación muy ancho sin cambiar
    de carril, ¿cuál es la distancia mínima de seguridad que un conductor debe dejar
    entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: La ley exige que usted reduzca la velocidad y deje un mínimo de tres
    pies de distancia en todo momento entre su vehículo y la bicicleta al rebasar.
- id: 393
  category: driver_responsibility
  question: ¿Quién es el responsable ante la ley si un menor de 18 años circula en
    bicicleta sin casco?
  choices:
    A: El menor
    B: El departamento de policía local
    C: El padre, madre o tutor
    D: El distrito escolar
  answer: C
  explanation: Como padre o madre, usted es responsable si su hijo (menor de 18 años)
    no lleva casco.
- id: 394
  category: vehicle_information
  question: ¿Qué equipo de iluminación se requiere para una bicicleta cuando se circula
    de noche?
  choices:
    A: Una luz delantera blanca visible a 500 pies y un reflector trasero rojo visible
      a 600 pies.
    B: Una luz delantera amarilla visible a 300 pies y una luz trasera roja visible
      a 300 pies.
    C: Una luz delantera blanca visible a 1000 pies y neumáticos reflectantes.
    D: La ley solo exige ropa reflectante.
  answer: A
  explanation: No debe circular de noche a menos que tenga una luz delantera blanca
    visible a 500 pies y un reflector trasero rojo visible a 600 pies (junto con reflectores
    o luces laterales).
- id: 395
  category: sharing_the_road
  question: ¿Cuál de las siguientes acciones es ilegal que realice un ciclista mientras
    circula por la carretera?
  choices:
    A: Circular sobre un asiento permanente.
    B: Mantener solo una mano en el manubrio mientras hace señales.
    C: Usar auriculares que cubran ambos oídos.
    D: Ceder el paso a los peatones en una acera.
  answer: C
  explanation: Las normas de circulación establecen que, al montar en bicicleta, no
    se deben usar auriculares que cubran ambos oídos.
- id: 396
  category: signs_and_signals
  question: ¿Bajo qué condición DEBE un ciclista detenerse por completo ante una señal
    de alto (stop)?
  choices:
    A: En todas las intersecciones, independientemente del tamaño de la vía.
    B: Cuando la intersección es con una carretera principal que tiene 3 o más carriles
      de circulación.
    C: Solo cuando hay un oficial de policía presente.
    D: Al girar a la derecha hacia una vía secundaria.
  answer: B
  explanation: Los ciclistas deben detenerse en todas las señales de alto ubicadas
    en intersecciones con carreteras principales (3 carriles de circulación o más),
    o si un vehículo está detenido ante la señal, o en caso de tráfico intenso.
- id: 397
  category: signs_and_signals
  question: ¿Cómo puede un ciclista tratar una señal de alto en una intersección con
    una vía secundaria si no hay vehículos detenidos ni tráfico intenso?
  choices:
    A: Como una luz verde, manteniendo la velocidad máxima.
    B: Como una señal de ceda el paso, procediendo con precaución sin detenerse tras
      ceder el derecho de paso.
    C: Como una luz roja intermitente, que requiere una parada completa durante 3
      segundos.
    D: Como una señal de desvío, que les obliga a dar la vuelta.
  answer: B
  explanation: En las señales de alto que controlan intersecciones con vías secundarias
    sin vehículos detenidos, los ciclistas pueden tratar la señal de alto como una
    señal de ceda el paso y proceder con precaución sin detenerse.
- id: 398
  category: sharing_the_road
  question: ¿Por qué las motocicletas suelen ser difíciles de identificar para otros
    conductores en el tráfico?
  choices:
    A: Generalmente están pintadas de colores oscuros.
    B: Circulan a velocidades mucho más altas que los automóviles.
    C: Solo tienen unos dos pies de ancho en comparación con los automóviles de cinco
      o seis pies de ancho.
    D: No están obligadas a usar luces delanteras durante el día.
  answer: C
  explanation: Las motocicletas no se identifican fácilmente en el tráfico principalmente
    porque solo tienen unos dos pies de ancho en comparación con el ancho de cinco
    a seis pies de los automóviles.
- id: 399
  category: defensive_driving
  question: ¿Dónde ocurren la mayoría de los accidentes de bicicleta graves y fatales?
  choices:
    A: En autopistas de acceso limitado
    B: En las intersecciones
    C: En ciclovías de doble sentido
    D: En entradas residenciales
  answer: B
  explanation: Según el manual, la mayoría de los accidentes de bicicleta graves y
    fatales ocurren en las intersecciones.
- id: 400
  category: sharing_the_road
  question: ¿Qué debe hacer un ciclista al adelantar a un peatón en una acera?
  choices:
    A: Bajarse de la bicicleta y pasar caminando junto al peatón.
    B: Pasar lo más cerca posible para ahorrar espacio.
    C: Dar una señal audible antes de adelantar.
    D: Encender su luz delantera blanca de forma intermitente.
  answer: C
  explanation: Los ciclistas deben ceder el paso a los peatones en las aceras y en
    los cruces peatonales, y dar una señal audible antes de adelantarlos.
- id: 401
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una regla fundamental para que los ciclistas
    adultos sigan siendo predecibles en la carretera?
  choices:
    A: Circular en sentido contrario al tráfico de vehículos motorizados para ver
      los autos que vienen de frente.
    B: Circular con el tráfico de vehículos motorizados, no en contra de este.
    C: Virar bruscamente con frecuencia para evitar peligros menores en la carretera.
    D: Usar la acera siempre que se viaje cuesta arriba.
  answer: B
  explanation: Para ser predecibles, los ciclistas deben circular con el tráfico de
    vehículos motorizados, no en contra de este, y señalar sus intenciones claramente.
- id: 402
  category: sharing_the_road
  question: ¿Cuál es la distancia de seguimiento recomendada detrás de un motociclista
    cuando se viaja a velocidades inferiores a 40 mph?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Tres segundos
    D: Cuatro segundos
  answer: B
  explanation: Según el manual, la distancia de seguimiento detrás de un motociclista
    debe ser de una cuenta de dos segundos cuando se viaja a velocidades inferiores
    a 40 mph.
- id: 403
  category: sharing_the_road
  question: Cuando se viaja a velocidades superiores a 40 mph, ¿cuál debería ser su
    distancia de seguimiento detrás de una motocicleta?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: C
  explanation: El manual establece que la distancia de seguimiento detrás de un motociclista
    debe ser de una cuenta de cuatro segundos para velocidades superiores a 40 mph.
- id: 404
  category: defensive_driving
  question: ¿Cuál de las siguientes maniobras representa un gran porcentaje de los
    choques entre automóviles y motocicletas que producen lesiones?
  choices:
    A: Colisiones por alcance en los semáforos
    B: Giros a la izquierda frente a un motociclista que viene en sentido contrario
    C: Giros a la derecha en rojo
    D: Colisiones frontales en autopistas interestatales
  answer: B
  explanation: El manual señala que los giros a la izquierda frente a un motociclista
    que viene en sentido contrario representan un gran porcentaje de los choques entre
    automóviles y motocicletas que producen lesiones.
- id: 405
  category: vehicle_information
  question: ¿Cuál es una característica común de las señales de giro en la mayoría
    de las motocicletas que los conductores deben tener en cuenta?
  choices:
    A: Se cancelan automáticamente después de un giro.
    B: No se cancelan automáticamente.
    C: Solo son obligatorias en la parte trasera de la motocicleta.
    D: Parpadean más rápido que las señales de giro de los automóviles.
  answer: B
  explanation: Las señales de giro no se cancelan automáticamente en la mayoría de
    las motocicletas, lo que significa que un conductor a veces puede olvidar apagar
    la señal.
- id: 406
  category: sharing_the_road
  question: ¿Es legal desplazarse al mismo carril junto a una motocicleta si el carril
    es ancho y el ciclista circula muy a un lado?
  choices:
    A: Sí, pero solo si está rebasando a la motocicleta.
    B: Sí, si el tráfico es pesado y el carril es lo suficientemente ancho.
    C: No, es ilegal y extremadamente peligroso.
    D: No, a menos que el motociclista le indique con la mano que pase.
  answer: C
  explanation: 'El manual establece explícitamente: "Nunca se desplace al mismo carril
    junto a una motocicleta, incluso si el carril es ancho y el ciclista circula muy
    a un lado. No solo es ilegal, sino que es extremadamente peligroso".'
- id: 407
  category: vehicle_information
  question: ¿Cuál es la duración del período de registro para ciclomotores (mopeds)
    y triciclos motorizados (tripeds), y cuál es el costo?
  choices:
    A: Un año y $5.00
    B: Tres años y $5.00
    C: Tres años y $15.00
    D: Cinco años y $10.00
  answer: B
  explanation: Los ciclomotores y triciclos motorizados deben estar registrados, y
    el registro/renovación del registro será por tres años y costará $5.00.
- id: 408
  category: vehicle_information
  question: ¿Los ciclomotores y triciclos motorizados deben estar equipados con una
    campana o dispositivo capaz de emitir una señal audible a qué distancia mínima?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Los ciclomotores y triciclos motorizados deben tener una luz en la
    parte delantera y trasera, y contar con una campana o dispositivo capaz de emitir
    una señal audible a una distancia de al menos 100 pies.
- id: 409
  category: safe_driving_rules
  question: ¿En qué lugares está legalmente prohibido el funcionamiento de ciclomotores
    y triciclos motorizados?
  choices:
    A: En calles residenciales
    B: En vías públicas con límites de velocidad superiores a 35 mph
    C: En autopistas interestatales y de acceso limitado
    D: En carreteras sin un carril designado para bicicletas
  answer: C
  explanation: Los ciclomotores y triciclos motorizados no deben operarse en autopistas
    interestatales y de acceso limitado, ni en el derecho de paso de un ferrocarril
    en funcionamiento.
- id: 410
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para registrar un vehículo todoterreno
    (OHV)?
  choices:
    A: 16 años de edad
    B: 18 años de edad
    C: 21 años de edad
    D: 25 años de edad
  answer: B
  explanation: Para procesar una solicitud de registro de un OHV, el solicitante debe
    tener una descripción del OHV y tener al menos 18 años de edad.
- id: 411
  category: vehicle_information
  question: ¿Todos los vehículos todoterreno (OHV) deben estar equipados con un silenciador
    que reduzca el nivel de ruido en qué porcentaje?
  choices:
    A: 25%
    B: 40%
    C: 50%
    D: 60%
  answer: D
  explanation: El manual establece que todos los vehículos todoterreno (OHV) deben
    tener un silenciador que reduzca el nivel de ruido en un 60%.
- id: 412
  category: safe_driving_rules
  question: ¿Cuál de los siguientes vehículos NO está permitido conducir en la carretera?
  choices:
    A: Ciclomotores
    B: Trípodes
    C: Tractores agrícolas
    D: Carritos de golf
  answer: D
  explanation: No debe conducir una minimoto, un go-kart, un carrito de golf, una
    moto de cross, un scooter motorizado, una moto de nieve u otros vehículos todoterreno
    en la carretera.
- id: 413
  category: signs_and_signals
  question: ¿Cómo es el emblema de "Vehículo de movimiento lento"?
  choices:
    A: Una señal amarilla circular y reflectante
    B: Una señal naranja triangular, fluorescente y reflectante
    C: Una señal verde reflectante en forma de diamante
    D: Una señal roja rectangular y fluorescente
  answer: B
  explanation: Un emblema de "Vehículo de movimiento lento" se describe como una señal
    naranja triangular, fluorescente y reflectante.
- id: 414
  category: sharing_the_road
  question: En una carretera nivelada, ¿aproximadamente cuánto tiempo más se tarda
    en rebasar a un camión en comparación con un automóvil?
  choices:
    A: De uno a dos segundos más
    B: De tres a cinco segundos más
    C: De cinco a ocho segundos más
    D: De diez a doce segundos más
  answer: B
  explanation: En una carretera nivelada, solo se tarda de tres a cinco segundos más
    en rebasar a un camión que a un automóvil.
- id: 415
  category: sharing_the_road
  question: ¿Qué derechos y deberes se aplican al jinete de un animal o al conductor
    de un vehículo tirado por animales en la carretera?
  choices:
    A: Deben cabalgar de frente al tráfico en todo momento.
    B: Solo se les permite circular por el arcén de la carretera.
    C: Tienen todos los derechos y deberes del conductor de un vehículo motorizado.
    D: Deben ceder el paso a todos los vehículos motorizados.
  answer: C
  explanation: Como jinete de cualquier animal o conductor de cualquier vehículo tirado
    por animales en la carretera, usted tiene todos los derechos y todos los deberes
    del conductor de un vehículo motorizado, excepto donde las leyes no tengan aplicación.
- id: 416
  category: sharing_the_road
  question: ¿Cuándo es seguro volver a su carril después de rebasar a un camión?
  choices:
    A: Tan pronto como pase el parachoques delantero del camión
    B: Cuando pueda ver la parte delantera del camión en su espejo retrovisor
    C: Cuando el conductor del camión toque la bocina
    D: Después de haber mantenido su velocidad de rebase durante 10 segundos
  answer: B
  explanation: El manual establece que debe asegurarse de volver al carril solo cuando
    pueda ver la parte delantera del camión en su espejo retrovisor.
- id: 417
  category: sharing_the_road
  question: ¿Qué debe hacer para ayudar al conductor de un camión que está rebasando
    su vehículo?
  choices:
    A: Acelerar para apartarse de su camino
    B: Moverse al centro de su carril y mantener la velocidad
    C: Mantenerse en el lado exterior de su carril y reducir su velocidad ligeramente
    D: Parpadear sus faros repetidamente
  answer: C
  explanation: Cuando un camión lo rebase, puede ayudar al conductor del camión manteniéndose
    en el lado exterior de su carril y reduciendo ligeramente su velocidad. Nunca
    debe acelerar mientras un camión lo está rebasando.
- id: 418
  category: sharing_the_road
  question: Al encontrarse con un camión que viene en dirección opuesta, ¿por qué
    debe mantenerse lo más alejado posible hacia el lado de la carretera?
  choices:
    A: Para evitar ser succionado hacia el costado del camión por la turbulencia del
      viento
    B: Para reducir la turbulencia del viento que empuja a los vehículos y evitar
      un choque lateral
    C: Para darle espacio al camión para realizar un giro a la izquierda amplio
    D: Para evitar el punto ciego delantero del camión
  answer: B
  explanation: El manual aconseja mantenerse lo más alejado posible hacia el lado
    para evitar un choque lateral y reducir la turbulencia del viento, señalando que
    la turbulencia empuja a los vehículos para separarlos en lugar de succionarlos.
- id: 419
  category: sharing_the_road
  question: Para evitar seguir demasiado cerca en el punto ciego trasero de un camión,
    ¿cuál es la distancia mínima de seguimiento que debe permitir?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Six segundos
  answer: C
  explanation: El manual establece permitir al menos cuatro segundos entre su vehículo
    y el camión para evitar seguir demasiado cerca en la "Zona Prohibida" (No-Zone)
    trasera.
- id: 420
  category: sharing_the_road
  question: ¿Por qué es peligroso meterse entre un vehículo comercial y el bordillo
    derecho en una intersección?
  choices:
    A: El camión puede necesitar abrirse hacia la izquierda para realizar con seguridad
      un giro a la derecha.
    B: El sistema de escape del camión expulsa gases peligrosos hacia el lado derecho.
    C: El conductor del camión acelerará rápidamente.
    D: El punto ciego del lado derecho del camión es el más pequeño.
  answer: A
  explanation: Los conductores de camiones a veces necesitan abrirse hacia la izquierda
    para realizar con seguridad un giro a la derecha. Meterse entre el vehículo comercial
    y el bordillo aumenta la posibilidad de un choque.
- id: 421
  category: sharing_the_road
  question: ¿Qué porcentaje de todos los choques de vehículos comerciales ocurre mientras
    el vehículo está retrocediendo?
  choices:
    A: 25 por ciento
    B: 40 por ciento
    C: 50 por ciento
    D: 66 por ciento
  answer: D
  explanation: Según el manual, el sesenta y seis por ciento de todos los choques
    de vehículos comerciales ocurren mientras se retrocede.
- id: 422
  category: vehicle_information
  question: ¿Cuál es el mejor momento para revisar la presión de aire de los neumáticos
    de su vehículo?
  choices:
    A: Inmediatamente después de un viaje largo
    B: Cuando los neumáticos están fríos
    C: Mientras el vehículo está en marcha
    D: Durante la parte más calurosa del día
  answer: B
  explanation: El manual indica a los conductores que revisen la presión de aire de
    los neumáticos con un manómetro cuando los neumáticos estén fríos.
- id: 423
  category: vehicle_information
  question: ¿Cómo puede usar una moneda de un centavo (penny) para verificar si la
    banda de rodadura de su neumático es segura?
  choices:
    A: Inserte la moneda en la banda de rodadura con la 'cabeza' hacia abajo; si la
      banda no llega al menos a la cabeza de Abe, el neumático no es seguro.
    B: Coloque la moneda plana sobre el neumático; si se desliza, el neumático no
      es seguro.
    C: Inserte la moneda en la banda de rodadura con el 'escudo' hacia abajo; si puede
      ver el monumento, el neumático no es seguro.
    D: Frote la moneda contra la pared lateral para verificar si hay sequedad o grietas.
  answer: A
  explanation: Revise la banda de rodadura con una moneda de un centavo insertándola
    en la ranura con la 'cabeza' hacia abajo. Si la banda de rodadura no cubre al
    menos la parte superior de la cabeza de Abe, el neumático no es seguro y debe
    ser reemplazado.
- id: 424
  category: vehicle_information
  question: ¿Cuál de las siguientes es una señal de que su vehículo puede necesitar
    amortiguadores o piezas de suspensión nuevos?
  choices:
    A: El pedal del freno llega hasta el fondo del piso.
    B: El vehículo rebota mucho después de un bache o una parada.
    C: El volante vibra al conducir por una carretera lisa.
    D: El motor hace un ruido fuerte al acelerar.
  answer: B
  explanation: Si el vehículo rebota mucho después de un bache o una parada, o si
    es difícil de controlar, es posible que necesite amortiguadores nuevos u otras
    piezas de la suspensión.
- id: 425
  category: safe_driving_rules
  question: Según el manual, ¿cuál es la mejor manera de prolongar la vida útil de
    su automóvil y ahorrar combustible?
  choices:
    A: Usar únicamente gasolina premium.
    B: Conducir durante el tráfico pesado para mantener velocidades bajas.
    C: Usar el vehículo lo menos posible mediante la planificación de viajes.
    D: Calentar el motor durante 10 minutos antes de cada viaje.
  answer: C
  explanation: El manual establece que la mejor manera de prolongar la vida útil de
    su automóvil y ahorrar combustible es usarlo lo menos posible, lo cual se puede
    lograr mediante la planificación de viajes.
- id: 426
  category: sharing_the_road
  question: ¿Qué debe esperar al rebasar un camión en una pendiente descendente?
  choices:
    A: El camión perderá velocidad, lo que facilitará el rebase.
    B: El impulso del camión hará que vaya más rápido, por lo que es posible que deba
      aumentar su velocidad.
    C: El camión se detendrá automáticamente en el acotamiento.
    D: El conductor del camión encenderá sus luces de emergencia.
  answer: B
  explanation: En una pendiente descendente, el impulso del camión hará que este aumente
    su velocidad, por lo que es posible que usted deba aumentar la suya para poder
    rebasarlo.
- id: 427
  category: sharing_the_road
  question: ¿A qué se refiere el término 'No-Zone' (Zona Prohibida) cuando se comparte
    la carretera con camiones?
  choices:
    A: Áreas donde los vehículos comerciales tienen prohibido circular.
    B: Las áreas de peligro alrededor de los camiones donde es más probable que ocurran
      choques debido a los puntos ciegos.
    C: Los carriles de rebase designados únicamente para vehículos de pasajeros.
    D: La distancia mínima de seguimiento requerida detrás de un vehículo comercial.
  answer: B
  explanation: La 'No-Zone' representa las áreas de peligro (puntos ciegos) alrededor
    de los camiones donde es más probable que ocurran choques.
- id: 428
  category: vehicle_information
  question: ¿Cuál es uno de los principales riesgos de conducir con neumáticos desgastados
    o lisos en carreteras mojadas?
  choices:
    A: Aumento del ahorro de combustible
    B: Bloqueo del volante
    C: Un mayor riesgo de hidroplaneo (hydroplaning)
    D: Sobrecalentamiento del sistema de escape
  answer: C
  explanation: El manual advierte que los neumáticos desgastados pueden causar 'hidroplaneo'
    (hydroplaning) y aumentar la probabilidad de tener un neumático desinflado o pinchado.
- id: 429
  category: vehicle_information
  question: ¿Cuál es una de las funciones principales del sistema de escape de un
    vehículo?
  choices:
    A: Enfriar los gases calientes provenientes del funcionamiento del motor.
    B: Proporcionar un viaje cómodo sobre diversas superficies de carretera.
    C: Mantener la lluvia y la nieve fuera del parabrisas.
    D: Alertar a otros conductores de que se está deteniendo.
  answer: A
  explanation: El sistema de escape ayuda a reducir el ruido del motor, ayuda a enfriar
    los gases calientes que resultan del funcionamiento del motor y traslada estos
    gases hacia la parte trasera del vehículo.
- id: 430
  category: vehicle_information
  question: ¿Cuál es un peligro potencial de un sistema de escape con fugas?
  choices:
    A: Puede hacer que el motor se sobrecaliente rápidamente.
    B: Puede causar la muerte dentro de un vehículo en muy poco tiempo.
    C: Hará que el vehículo rebote después de una parada.
    D: Aumenta significativamente el ahorro de combustible.
  answer: B
  explanation: 'El manual establece: "Los gases de un escape con fugas pueden causar
    la muerte dentro de un vehículo en muy poco tiempo".'
- id: 431
  category: safe_driving_rules
  question: Según el manual, ¿cuál es el único momento en que debe usar la bocina?
  choices:
    A: Para saludar a amigos en la carretera.
    B: Para expresar enojo hacia otro conductor.
    C: Para avisarle a un conductor que el semáforo se ha puesto en verde.
    D: Como advertencia para los demás.
  answer: D
  explanation: 'El manual establece: "Solo use la bocina como advertencia para los
    demás".'
- id: 432
  category: defensive_driving
  question: ¿Cuál es la fuerza de impacto de un objeto no asegurado de 20 lb que viaja
    a 55 mph?
  choices:
    A: 100 lbs.
    B: 500 lbs.
    C: 1,000 lbs.
    D: 2,000 lbs.
  answer: C
  explanation: 'El manual establece: "¡Un objeto de 20 lb a 55 mph tiene una fuerza
    de 1,000 lb al momento del impacto!"'
- id: 433
  category: vehicle_information
  question: ¿En qué medida puede la suciedad en los lentes de los faros delanteros,
    luces de marcha atrás, de freno y traseras reducir su luz?
  choices:
    A: En un 10%
    B: En un 25%
    C: En un 50%
    D: En un 75%
  answer: C
  explanation: 'El manual establece: "La suciedad en los lentes puede reducir la luz
    en un 50%".'
- id: 434
  category: safe_driving_rules
  question: ¿A qué distancia aproximada debe estar posicionado su asiento con respecto
    al volante?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: 'El manual establece: "El asiento debe estar posicionado aproximadamente
    a 12 pulgadas del volante".'
- id: 435
  category: vehicle_information
  question: ¿Cuál es un buen ajuste para los espejos laterales de su vehículo?
  choices:
    A: Ajustarlos de modo que pueda ver todo el costado de su vehículo mientras está
      sentado hacia atrás.
    B: Ajustarlos de modo que pueda ver solo el costado de su vehículo cuando se incline
      ligeramente hacia adelante.
    C: Ajustarlos de modo que apunten directamente al suelo detrás de los neumáticos
      traseros.
    D: Ajustarlos de modo que pueda ver al conductor del automóvil que está detrás
      de usted.
  answer: B
  explanation: 'El manual establece: "Un buen ajuste para los espejos laterales es
    configurarlos de modo que, al inclinarse ligeramente hacia adelante, pueda ver
    solo el costado de su vehículo".'
- id: 436
  category: penalties_and_points
  question: ¿Qué puede ocurrir si se coloca el cinturón de hombro debajo del brazo
    o detrás de usted mientras conduce?
  choices:
    A: Proporciona una mejor protección en un choque con volcadura.
    B: Se considera un uso adecuado si el cinturón de regazo está ajustado.
    C: Puede provocar lesiones graves y la emisión de una multa.
    D: Desactiva el sistema de bolsas de aire (airbags) del vehículo.
  answer: C
  explanation: 'El manual establece: "Colocarse el cinturón de hombro debajo del brazo
    o detrás de usted puede provocar lesiones graves; y, debido a que no se considera
    un uso adecuado del cinturón de seguridad, podría resultar en la emisión de una
    multa".'
- id: 437
  category: defensive_driving
  question: ¿Por qué deben usarse los cinturones de seguridad incluso si el vehículo
    está equipado con bolsas de aire (airbags)?
  choices:
    A: Las bolsas de aire no lo protegen si recibe un impacto lateral o trasero, o
      si el vehículo vuelca.
    B: Las bolsas de aire solo se despliegan a velocidades superiores a 55 mph.
    C: Se sabe que las bolsas de aire fallan el 50% de las veces.
    D: Las bolsas de aire solo protegen a los pasajeros en el asiento trasero.
  answer: A
  explanation: 'El manual establece: "Si bien las bolsas de aire son una buena protección
    contra el impacto con el volante, el tablero o el parabrisas, no lo protegen si
    recibe un impacto lateral o trasero, o si el vehículo vuelca".'
- id: 438
  category: safe_driving_rules
  question: Según la ley de Delaware, ¿qué niños están obligados a viajar en un asiento
    de seguridad para el automóvil orientado hacia atrás?
  choices:
    A: Niños menores de 1 año Y 20 libras
    B: Niños menores de 2 años Y 30 libras
    C: Niños menores de 4 años Y 40 libras
    D: Niños menores de 8 años Y 60 libras
  answer: B
  explanation: La ley de Delaware exige que "los niños menores de 2 años Y de 30 libras
    viajen en un asiento de seguridad orientado hacia atrás".
- id: 439
  category: safe_driving_rules
  question: Al asegurar adecuadamente a un niño en un asiento de seguridad, ¿dónde
    debe colocarse el broche del pecho?
  choices:
    A: A la altura del ombligo del niño
    B: A la altura de la clavícula del niño
    C: A la altura de las axilas del niño
    D: A través del cuello del niño
  answer: C
  explanation: 'El manual establece: "El broche del pecho debe estar a la altura de
    las axilas del niño".'
- id: 440
  category: safe_driving_rules
  question: 'Por lo general, un niño NO debe ocupar el asiento del pasajero delantero
    de un vehículo si es:'
  choices:
    A: Menor de 10 años o mide menos de 5'0"
    B: Menor de 12 años o mide menos de 5'5"
    C: Menor de 14 años o mide menos de 5'8"
    D: Menor de 16 años o mide menos de 6'0"
  answer: B
  explanation: 'El manual establece: "Un niño menor de 12 años o de menos de 5’5”
    de estatura no debe ocupar el asiento del pasajero delantero de un vehículo".'
- id: 441
  category: vehicle_information
  question: ¿Qué significa probablemente si su vehículo rebota mucho después de un
    bache o una parada, o si es difícil de controlar?
  choices:
    A: Tiene un sistema de escape con fugas.
    B: El dispositivo de compresión de su motor está fallando.
    C: Es posible que necesite amortiguadores nuevos u otras piezas de la suspensión.
    D: Sus neumáticos están demasiado inflados.
  answer: C
  explanation: 'El manual establece: "Si el vehículo rebota mucho después de un bache
    o una parada o es difícil de controlar, es posible que necesite amortiguadores
    nuevos u otras piezas de la suspensión".'
- id: 442
  category: safe_driving_rules
  question: Una vez instalada, ¿cuánto debe moverse la silla de seguridad para niños
    al revisarla en la trayectoria del cinturón con una fuerza moderada?
  choices:
    A: No más de una pulgada de lado a lado y de adelante hacia atrás
    B: No más de dos pulgadas de lado a lado y de adelante hacia atrás
    C: No más de tres pulgadas de lado a lado y de adelante hacia atrás
    D: Debe tener suficiente holgura para moverse libremente
  answer: A
  explanation: 'El manual establece: "Una vez instaladas, las sillas de seguridad
    no deben moverse más de una pulgada de lado a lado y de adelante hacia atrás cuando
    se revisan en la trayectoria del cinturón con una fuerza moderada".'
- id: 443
  category: safe_driving_rules
  question: ¿Dónde no debe instalar NUNCA una silla de seguridad orientada hacia atrás?
  choices:
    A: En el asiento trasero detrás del conductor
    B: En el asiento trasero detrás del pasajero
    C: En el centro del asiento trasero
    D: Frente a una bolsa de aire frontal activa
  answer: D
  explanation: 'El manual establece: "Nunca instale una silla de seguridad orientada
    hacia atrás frente a una bolsa de aire frontal activa".'
- id: 444
  category: driver_responsibility
  question: Los estudios han demostrado que el simple hecho de usar el cinturón de
    seguridad puede reducir la probabilidad de morir o sufrir lesiones graves en un
    choque, ¿en qué medida?
  choices:
    A: En un 10%
    B: En un 25%
    C: Casi a la mitad
    D: En un 90%
  answer: C
  explanation: 'El manual establece: "Los estudios han demostrado que puede reducir
    su probabilidad de morir o sufrir lesiones graves en un choque casi a la mitad
    con el simple hecho de usar el cinturón de seguridad".'
- id: 445
  category: vehicle_information
  question: ¿Qué tan ajustado debe estar el arnés de la silla de seguridad para niños
    cuando está correctamente instalada?
  choices:
    A: Lo suficientemente flojo como para que quepan dos dedos debajo de las correas.
    B: No debería poder pellizcar el exceso de correa en la clavícula del niño.
    C: Lo suficientemente apretado como para que el niño no pueda mover los brazos
      ni las piernas.
    D: Lo suficientemente flojo como para pellizcar al menos una pulgada de correa.
  answer: B
  explanation: 'El manual establece: "No debería poder pellizcar el exceso de correa
    del arnés entre sus dedos cuando intente pellizcar las correas del arnés en la
    clavícula del niño".'
- id: 446
  category: vehicle_information
  question: ¿Dónde debe colocarse el broche para el pecho de una silla de seguridad
    para niños?
  choices:
    A: A la altura de la clavícula del niño
    B: A la altura del ombligo del niño
    C: A la altura de las axilas del niño
    D: A través de la cintura del niño
  answer: C
  explanation: Según el manual, "El broche para el pecho debe estar a la altura de
    las axilas del niño".
- id: 447
  category: safe_driving_rules
  question: Si la temperatura exterior es de 94 grados, ¿qué tan caliente puede llegar
    a estar el interior de un automóvil en solo media hora con las ventanas cerradas?
  choices:
    A: 100 grados
    B: 112 grados
    C: 122 grados
    D: 132 grados
  answer: C
  explanation: El manual señala que un estudio encontró que "con las ventanas cerradas
    y la temperatura exterior a 94 grados, el interior de un automóvil podría estar
    a 122 grados en solo media hora..."
- id: 448
  category: defensive_driving
  question: ¿Cuál de las siguientes es una afirmación verdadera con respecto a las
    muertes por accidentes de tránsito y la distancia del viaje?
  choices:
    A: La mayoría de las muertes por accidentes de tránsito ocurren en viajes por
      carretera a través del país.
    B: Más de la mitad de todas las muertes por accidentes de tránsito ocurren a menos
      de 25 millas de casa.
    C: Las muertes por accidentes de tránsito rara vez ocurren en carreteras con límites
      de velocidad de menos de 45 mph.
    D: Los viajes cortos por la ciudad no requieren el uso de cinturones de seguridad.
  answer: B
  explanation: 'El manual desmiente el mito de que los cinturones de seguridad no
    son necesarios en la ciudad al afirmar: "Más de la mitad de todas las muertes
    por accidentes de tránsito ocurren a menos de 25 millas de casa".'
- id: 449
  category: defensive_driving
  question: ¿Qué sucede con los pasajeros que no están asegurados en un vehículo cuando
    este es golpeado por el costado?
  choices:
    A: Se deslizarán lejos del punto del choque.
    B: Saldrán despedidos del vehículo de forma segura.
    C: Permanecerán inmóviles en sus asientos.
    D: Se deslizarán hacia el punto del choque.
  answer: D
  explanation: El manual explica que cuando un vehículo es golpeado por el costado,
    "Todo lo que hay en el vehículo que no esté sujeto, incluidos los pasajeros, se
    deslizará efectivamente hacia el punto del choque, no lejos de él".
- id: 450
  category: defensive_driving
  question: 'La fuerza de un choque frontal a 25 mph es equivalente a:'
  choices:
    A: Caer de un edificio de un piso.
    B: Pedalear una bicicleta a toda velocidad contra una pared de ladrillos.
    C: Ser tacleado por un jugador de fútbol americano profesional.
    D: Dejar caer un peso pesado sobre su pie.
  answer: B
  explanation: 'El manual establece: "Incluso a 25 mph, la fuerza de un choque frontal
    es la misma que pedalear una bicicleta a toda velocidad contra una pared de ladrillos
    o lanzarse desde un edificio de tres pisos hacia la acera".'
- id: 451
  category: driver_responsibility
  question: Durante una parada de tráfico, ¿qué información debe proporcionar una
    persona a un oficial de la ley según la ley de Delaware?
  choices:
    A: Solo su nombre y número de licencia de conducir.
    B: Su nombre, dirección y una explicación de por qué está conduciendo y hacia
      dónde se dirige.
    C: Su número de seguro social y el registro del vehículo.
    D: Solo su comprobante de seguro y destino.
  answer: B
  explanation: De acuerdo con 11 Del. C. §1902, "una persona debe proporcionar su
    nombre, dirección y una explicación de por qué está conduciendo en la vía y hacia
    dónde se dirige".
- id: 452
  category: driver_responsibility
  question: ¿Bajo qué circunstancias puede un oficial registrar el vehículo de una
    persona en el lugar durante una parada de tráfico?
  choices:
    A: Solo si el conductor es puesto bajo arresto.
    B: Solo si el oficial tiene una orden firmada por un juez.
    C: Si se otorga el consentimiento, si existe causa probable o durante un inventario
      de remolque.
    D: A un oficial nunca se le permite registrar un vehículo en el lugar.
  answer: C
  explanation: 'El manual establece: "El vehículo de una persona puede ser registrado
    en el lugar si se otorga el consentimiento al oficial para hacerlo, si el oficial
    cree que tiene causa probable para hacerlo, o como parte de una evaluación de
    inventario de un vehículo que está siendo remolcado".'
- id: 453
  category: penalties_and_points
  question: Si una persona no proporciona identificación o no explica sus acciones
    a satisfacción de un oficial, ¿cuánto tiempo puede ser detenida legalmente antes
    de ser liberada o arrestada?
  choices:
    A: Hasta 30 minutos
    B: Hasta una hora
    C: Hasta dos horas
    D: Hasta 24 horas
  answer: C
  explanation: El manual especifica que "Al final del período de detención, que no
    puede exceder las dos horas, la persona será liberada o arrestada y acusada de
    un delito".
- id: 454
  category: safe_driving_rules
  question: Al detenerse a un lado para un vehículo de emergencia o una parada de
    tráfico, ¿hacia dónde debe mover su vehículo?
  choices:
    A: Al arcén izquierdo de la calzada.
    B: Al lado derecho de la calzada, siempre que sea posible.
    C: Detenerse inmediatamente en su carril actual.
    D: Al camellón central.
  answer: B
  explanation: 'El manual instruye: "Al detenerse a un lado para un vehículo de emergencia,
    los movimientos deben realizarse hacia el lado derecho de la calzada, siempre
    que sea posible".'
- id: 455
  category: driver_responsibility
  question: ¿Qué debe hacer si tiene un arma en su vehículo durante una parada de
    tráfico?
  choices:
    A: Esconder el arma debajo del asiento antes de que el oficial se acerque.
    B: Esperar hasta que el oficial pregunte si tiene alguna arma.
    C: Informar al oficial al primer contacto.
    D: Entregar el arma al oficial de inmediato.
  answer: C
  explanation: 'El manual establece explícitamente: "Si tiene un arma(s) en el vehículo,
    informe al oficial al primer contacto".'
- id: 456
  category: vehicle_information
  question: Antes de arrancar un vehículo con transmisión automática, ¿en qué posición
    debe estar el selector de cambios?
  choices:
    A: Neutral (N)
    B: Drive (D)
    C: Primera marcha
    D: Park (P)
  answer: D
  explanation: Según el manual, "Para un vehículo que tiene una transmisión automática,
    debe colocar el selector de cambios en 'park' (estacionamiento)".
- id: 457
  category: safe_driving_rules
  question: ¿Cuál es la posición recomendada de las manos en el volante?
  choices:
    A: Mano izquierda a las 12 en punto y mano derecha en la palanca de cambios.
    B: Ambas manos en la posición de las 6 en punto.
    C: Mano izquierda entre las 8 y las 10 en punto y mano derecha entre las 2 y las
      4 en punto.
    D: Mano izquierda a las 10 en punto y mano derecha a las 10 en punto.
  answer: C
  explanation: 'El manual recomienda: "Ambas manos deben colocarse en lados opuestos
    del volante (por ejemplo, la mano izquierda entre las 8 y las 10 en punto y la
    mano derecha entre las 2 y las 4 en punto)".'
- id: 458
  category: vehicle_information
  question: ¿Qué técnica de dirección debe utilizarse al girar en esquinas cerradas?
  choices:
    A: La técnica de empujar y tirar (push-pull)
    B: La técnica de mano sobre mano (hand-over-hand)
    C: La técnica de giro con una sola mano
    D: La técnica de deslizar entre los dedos
  answer: B
  explanation: 'El manual establece: "Al girar en esquinas cerradas, gire el volante
    utilizando la técnica de ''mano sobre mano'' (hand-over-hand)".'
- id: 459
  category: vehicle_information
  question: ¿Cómo debe enderezar el volante después de completar un giro?
  choices:
    A: Dejar que el volante se deslice libremente entre sus dedos.
    B: Enderezar el volante a mano.
    C: Acelerar rápidamente para que el volante se enderece solo.
    D: Usar solo la mano izquierda para guiarlo de regreso.
  answer: B
  explanation: 'El manual aconseja: "Cuando complete un giro, enderece el volante
    a mano. Dejar que se deslice entre sus dedos podría ser peligroso".'
- id: 460
  category: safe_driving_rules
  question: ¿Cuál es la técnica recomendada para girar el volante al tomar esquinas
    cerradas?
  choices:
    A: El método de empujar y tirar (push-pull)
    B: La técnica de mano sobre mano (hand-over-hand)
    C: Dirección con una sola mano
    D: Dejar que el volante se deslice entre sus dedos
  answer: B
  explanation: El manual establece que al girar en esquinas cerradas, debe girar el
    volante utilizando la técnica de "mano sobre mano" (hand-over-hand).
- id: 461
  category: safe_driving_rules
  question: ¿Después de completar un giro, por qué debería enderezar el volante con
    la mano en lugar de dejar que se deslice entre sus dedos?
  choices:
    A: Ayuda a mantener la alineación del vehículo.
    B: Dejar que se deslice entre sus dedos podría ser peligroso.
    C: Evita el desgaste de la bomba de la dirección asistida.
    D: Es un requisito de la ley de Delaware.
  answer: B
  explanation: 'El manual establece explícitamente: ''Cuando complete un giro, enderece
    el volante con la mano. Dejar que se deslice entre sus dedos podría ser peligroso''.'
- id: 462
  category: safe_driving_rules
  question: Según el manual, ¿cuándo es especialmente fácil viajar mucho más rápido
    de lo que uno piensa?
  choices:
    A: Al conducir de noche
    B: Al conducir bajo lluvia intensa
    C: Cuando sale de carreteras de alta velocidad y conduce por carreteras locales
      más lentas
    D: Al conducir un vehículo recién comprado
  answer: C
  explanation: El manual señala que es fácil viajar mucho más rápido de lo que uno
    piensa, y 'Esto es especialmente cierto cuando sale de carreteras de alta velocidad
    y conduce por carreteras locales mucho más lentas'.
- id: 463
  category: vehicle_information
  question: ¿Cómo debe frenar en una emergencia si su vehículo está equipado con un
    Sistema de Frenos Antibloqueo (ABS)?
  choices:
    A: Bombee los frenos rápidamente para evitar derrapes.
    B: Frene lo más fuerte posible y, si es necesario, maniobre para evitar un choque.
    C: Frene suavemente y aplique el freno de estacionamiento.
    D: Frene lo más fuerte posible sin bloquear las ruedas.
  answer: B
  explanation: Con ABS, el manual indica 'frenar lo más fuerte posible y, si es necesario,
    maniobrar para evitar un choque'. Frenar sin bloquear las ruedas es la técnica
    para vehículos sin ABS.
- id: 464
  category: safe_driving_rules
  question: ¿Por qué es ilegal en Delaware conducir con audífonos o auriculares que
    cubran o entren en ambos oídos?
  choices:
    A: Distrae visualmente al conductor.
    B: Dificulta escuchar las bocinas o sirenas de emergencia.
    C: Interfiere con el sistema Bluetooth del vehículo.
    D: Hace que el conductor exceda la velocidad.
  answer: B
  explanation: 'El manual establece: ''No conduzca con audífonos o auriculares que
    cubran o entren en ambos oídos. Esto es ilegal en Delaware... porque dificulta
    escuchar las bocinas o sirenas de emergencia''.'
- id: 465
  category: defensive_driving
  question: ¿Cuál es una consecuencia potencial de 'curiosear' (reducir la velocidad
    para mirar un choque o actividad al costado de la carretera)?
  choices:
    A: Ayuda a las autoridades a despejar la escena más rápido.
    B: Mejora el flujo de tráfico al obligar a los conductores a reducir la velocidad.
    C: Podría chocar con un vehículo de adelante que haya disminuido la velocidad
      o se haya detenido.
    D: Previene choques secundarios.
  answer: C
  explanation: 'El manual advierte contra el curioseo, indicando: ''Si aparta la vista
    de la carretera para mirar algo, podría chocar con un vehículo de adelante que
    haya disminuido la velocidad o se haya detenido''.'
- id: 466
  category: sharing_the_road
  question: Si se encuentra con un conductor agresivo en la carretera, ¿cuál es la
    mejor manera de ayudar a las autoridades?
  choices:
    A: Desafiarlos para que se detengan a un lado.
    B: Hacer contacto visual para demostrar que no está intimidado.
    C: Seguirlos de cerca para obtener su número de placa.
    D: Mantener la calma, evitar el contacto visual y reportar su número de placa
      al 911.
  answer: D
  explanation: El manual aconseja ayudar a las autoridades manteniendo la calma, evitando
    el contacto visual, no desafiándolos y reportando la conducción agresiva llamando
    al 911 con su número de placa.
- id: 467
  category: defensive_driving
  question: Para conducir de manera segura y evitar frenar a último momento, ¿qué
    tan adelante suelen mirar los conductores más seguros?
  choices:
    A: Al menos 2 segundos adelante
    B: Al menos 5 segundos adelante
    C: Al menos 10 segundos adelante
    D: Al menos 20 segundos adelante
  answer: C
  explanation: Según el manual, 'Los conductores más seguros tienden a mirar al menos
    10 segundos por delante de su vehículo'.
- id: 468
  category: defensive_driving
  question: 'Al conducir en la autopista, una distancia de visión de 10 segundos es
    aproximadamente igual a:'
  choices:
    A: Una cuadra de la ciudad
    B: Cuatro cuadras de la ciudad o un cuarto de milla
    C: Media milla
    D: Una milla
  answer: B
  explanation: 'El manual establece: ''En la autopista, 10 segundos son aproximadamente
    cuatro cuadras de la ciudad o un cuarto de milla''.'
- id: 469
  category: defensive_driving
  question: ¿Cómo ayuda a ahorrar combustible el mirar bien adelante en la carretera?
  choices:
    A: Le permite ir a rebufo detrás de vehículos más grandes.
    B: Le ayuda a encontrar la ruta más corta a su destino.
    C: Le permite reducir la velocidad gradualmente y evitar frenazos innecesarios.
    D: Aumenta la aerodinámica de su vehículo.
  answer: C
  explanation: El manual explica que al mirar bien adelante, 'Los conductores... pueden
    reducir la velocidad gradualmente o cambiar de carril y evitar frenazos innecesarios
    que conducen a un menor rendimiento de millas por galón'.
- id: 470
  category: safe_driving_rules
  question: Antes de entrar en una intersección, ¿qué debe hacer para asegurarse de
    no bloquearla si tiene que detenerse?
  choices:
    A: Acelerar rápidamente para atravesar la intersección.
    B: Mirar a través de la intersección para asegurarse de que el camino esté despejado
      en todo el trayecto.
    C: Tocar la bocina para advertir al tráfico que cruza.
    D: Encender las luces de emergencia.
  answer: B
  explanation: 'El manual aconseja: ''Mire a través de la intersección antes de comenzar
    a moverse para asegurarse de que el camino esté despejado en todo el trayecto
    a través de la intersección, y que no la bloqueará si tiene que detenerse''.'
- id: 471
  category: safe_driving_rules
  question: ¿En Delaware, se le permite girar a la izquierda con luz roja?
  choices:
    A: No, los giros a la izquierda en rojo siempre son ilegales.
    B: Sí, pero solo desde una calle de un solo sentido hacia otra calle de un solo
      sentido, a menos que esté prohibido.
    C: Sí, desde cualquier calle hacia una calle de un solo sentido.
    D: Sí, siempre que no haya tráfico en sentido contrario.
  answer: B
  explanation: 'El manual establece: ''También puede girar a la izquierda desde una
    calle de un solo sentido hacia otra calle de un solo sentido, a menos que esté
    prohibido''.'
- id: 472
  category: defensive_driving
  question: ¿Qué debe hacer si está detenido en una intersección y su visión de la
    calle transversal está bloqueada?
  choices:
    A: Esperar a que el vehículo detrás de usted toque la bocina antes de avanzar.
    B: Avanzar lentamente hacia adelante hasta que pueda ver.
    C: Acelerar rápidamente para despejar el punto ciego pronto.
    D: Girar a la derecha en lugar de seguir recto.
  answer: B
  explanation: 'El manual indica: ''Si se detuvo y su visión de una calle transversal
    está bloqueada, avance lentamente hacia adelante hasta que pueda ver''.'
- id: 473
  category: sharing_the_road
  question: ¿Cuál es una de las principales causas de muertes en los cruces ferroviarios?
  choices:
    A: Suponer que no viene un tren.
    B: Cruzar las vías demasiado lento.
    C: Cambiar de marcha mientras se está en las vías.
    D: No escuchar la bocina del tren.
  answer: A
  explanation: 'El manual establece explícitamente: ''Suponer que no viene un tren
    es una de las principales causas de muertes en los cruces ferroviarios''.'
- id: 474
  category: sharing_the_road
  question: En un cruce ferroviario con más de una vía, ¿por qué debe esperar hasta
    que el tren que pasa esté bien alejado por la vía antes de comenzar a cruzar?
  choices:
    A: Para permitir que las barreras del cruce se restablezcan por completo.
    B: Para evitar la turbulencia creada por el tren que pasa.
    C: Porque otro tren puede estar oculto por el que acaba de pasar.
    D: Para asegurarse de no recibir una multa de las cámaras automáticas.
  answer: C
  explanation: 'El manual advierte: ''En los cruces con más de una vía, espere hasta
    que el tren que pasa esté bien alejado por la vía antes de comenzar a cruzar.
    Otro tren puede estar oculto por el que acaba de pasar''.'
- id: 475
  category: safe_driving_rules
  question: ¿Qué debe hacer en un cruce ferroviario con más de una vía después de
    que pase un tren?
  choices:
    A: Cruzar inmediatamente para evitar retrasar el tráfico detrás de usted.
    B: Esperar hasta que el tren que pasa esté bien alejado por la vía antes de comenzar
      a cruzar.
    C: Tocar la bocina para advertir a cualquier tren oculto antes de cruzar.
    D: Acelerar para cruzar las vías lo más rápido posible.
  answer: B
  explanation: En los cruces con más de una vía, debe esperar hasta que el tren que
    pasa esté bien alejado por la vía antes de comenzar a cruzar porque otro tren
    puede estar oculto por el que acaba de pasar.
- id: 476
  category: defensive_driving
  question: ¿Por qué es necesario mirar por encima del hombro al cambiar de carril?
  choices:
    A: Para revisar el humo del escape de su vehículo.
    B: Para ver los vehículos en sus puntos ciegos que no se pueden ver a través de
      los espejos.
    C: Para asegurarse de que sus pasajeros tengan el cinturón de seguridad bien abrochado.
    D: Para buscar vehículos de emergencia que estén muy atrás.
  answer: B
  explanation: Debe girar la cabeza y mirar por encima del hombro para ver los vehículos
    en sus puntos ciegos, ya que estas son áreas cerca de las esquinas traseras de
    su vehículo que no puede ver a través de sus espejos.
- id: 477
  category: defensive_driving
  question: Al cambiar de carril en una carretera de varios carriles, ¿por qué es
    importante revisar el carril más alejado?
  choices:
    A: Para ver si puede saltarse un carril y moverse dos veces.
    B: Alguien en ese carril puede estar planeando moverse al mismo carril al que
      usted desea entrar.
    C: Para buscar vehículos policiales que vigilen el tráfico.
    D: Para medir el ancho total de la calzada.
  answer: B
  explanation: Debe asegurarse de revisar el carril más alejado, si lo hay, porque
    alguien en ese carril puede estar planeando moverse al mismo carril al que usted
    desea entrar.
- id: 478
  category: vehicle_information
  question: ¿Cuál es la técnica adecuada para mirar hacia atrás al retroceder un vehículo?
  choices:
    A: Confiar totalmente en su espejo retrovisor.
    B: Usar solo sus espejos laterales para guiarse.
    C: Colocar su brazo derecho en el respaldo del asiento y mirar directamente a
      través de la ventana trasera.
    D: Abrir la puerta del lado del conductor y mirar hacia atrás.
  answer: C
  explanation: Al retroceder, debe colocar su brazo derecho en el respaldo del asiento
    y girarse para poder mirar directamente a través de la ventana trasera. No debe
    depender de sus espejos.
- id: 479
  category: safe_driving_rules
  question: Según la ley de Delaware, ¿a qué distancia debe bajar las luces altas
    cuando se aproxima un vehículo en sentido contrario?
  choices:
    A: A menos de 200 pies
    B: A menos de 300 pies
    C: A menos de 500 pies
    D: A menos de 1000 pies
  answer: C
  explanation: La ley de Delaware exige que baje las luces altas siempre que se encuentre
    a una distancia aproximada de una cuadra (dentro de los 500 pies) de un vehículo
    que se aproxima.
- id: 480
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un requisito legal en Delaware con respecto
    a los faros delanteros y las condiciones climáticas?
  choices:
    A: Debe encender sus faros delanteros siempre que tenga los limpiaparabrisas encendidos.
    B: Debe usar luces altas en caso de niebla intensa o nieve.
    C: Puede conducir solo con las luces de estacionamiento encendidas durante una
      lluvia ligera.
    D: Los faros delanteros solo son obligatorios cuando está completamente oscuro
      afuera.
  answer: A
  explanation: Es ley en Delaware que debe encender sus luces en caso de lluvia, neblina
    y nieve, y en cualquier momento que tenga los limpiaparabrisas encendidos.
- id: 481
  category: defensive_driving
  question: Si un conductor que viene en sentido contrario no baja sus luces altas,
    ¿qué debe hacer usted?
  choices:
    A: Mantener sus luces altas encendidas para desquitarse con el otro conductor.
    B: Mirar hacia el lado derecho de la carretera para evitar ser deslumbrado.
    C: Mirar directamente a sus faros para calcular su distancia.
    D: Cerrar los ojos brevemente hasta que el vehículo pase.
  answer: B
  explanation: Si un conductor no baja sus luces, mire hacia el lado derecho de la
    carretera. Esto evita que usted se deslumbre y le permite ver el borde de la carretera
    para mantenerse en su curso.
- id: 482
  category: safe_driving_rules
  question: ¿Por qué debe usar las luces bajas en lugar de las luces altas en la niebla
    o cuando llueve intensamente?
  choices:
    A: Las luces altas agotarán la batería del vehículo más rápido en mal tiempo.
    B: La ley federal exige el uso de luces bajas en todas las condiciones climáticas.
    C: La luz de las luces altas se reflejará, causando deslumbramiento y dificultando
      la visión.
    D: Las luces altas deslumbrarán a los conductores que vienen detrás de usted.
  answer: C
  explanation: Debe usar las luces bajas en la niebla o cuando esté nevando o lloviendo
    intensamente porque la luz de las luces altas se reflejará, causando deslumbramiento
    y dificultando la visión hacia adelante.
- id: 483
  category: sharing_the_road
  question: ¿En cuál de las siguientes situaciones debería tocar la bocina ligeramente?
  choices:
    A: Para saludar a un amigo que camina por la acera.
    B: Para animar a un conductor lento delante de usted a que acelere.
    C: Cuando una persona en bicicleta parece estar moviéndose hacia su carril de
      circulación.
    D: Cuando conduce cerca de peatones ciegos.
  answer: C
  explanation: Se debe tocar la bocina ligeramente cuando una persona a pie o en bicicleta
    parece estar moviéndose hacia su carril de circulación. No debe usar la bocina
    para saludar a amigos, animar a alguien a conducir más rápido o cerca de peatones
    ciegos.
- id: 484
  category: driver_responsibility
  question: ¿Cuándo es inapropiado usar la bocina de su vehículo?
  choices:
    A: Cuando un niño está a punto de correr hacia la calle.
    B: Para informar a otros conductores de un error que cometieron.
    C: Al adelantar a un conductor que comienza a girar hacia su carril.
    D: Al salir de un callejón estrecho donde no puede ver lo que hay adelante.
  answer: B
  explanation: El manual enumera específicamente "Informar a otros conductores de
    un error" como una ocasión en la que no debe usar la bocina.
- id: 485
  category: safe_driving_rules
  question: Si su vehículo se avería y no tiene bengalas de emergencia, ¿cómo puede
    advertir al resto del tráfico?
  choices:
    A: Pararse en medio del carril de tráfico y agitar los brazos.
    B: Mantener las luces completamente apagadas para ahorrar batería.
    C: Pararse a un lado de la carretera donde esté a salvo del tráfico y hacer señas
      al tráfico para que rodee su vehículo.
    D: Caminar por el centro de la autopista para buscar un teléfono de emergencia.
  answer: C
  explanation: Si no tiene bengalas de emergencia, párese a un lado de la carretera
    donde esté a salvo del tráfico y haga señas al tráfico para que rodee su vehículo,
    usando un paño blanco si tiene uno. Nunca se pare en la calzada.
- id: 486
  category: vehicle_information
  question: ¿Cómo puede señalar visualmente una emergencia si su vehículo se avería
    en la autopista?
  choices:
    A: Atar un paño rojo al volante.
    B: Levantar el capó o atar un paño blanco a la antena, al espejo lateral o a la
      manija de la puerta.
    C: Tocar la bocina continuamente durante 5 minutos.
    D: Dejar la puerta del lado del conductor abierta de par en par.
  answer: B
  explanation: Para señalar una emergencia, debe levantar el capó o atar un paño blanco
    a la antena, al espejo lateral o a la manija de la puerta.
- id: 487
  category: sharing_the_road
  question: ¿Cuál es la mejor manera de manejar cuando se conduce cerca del punto
    ciego de otro vehículo?
  choices:
    A: Quedarse en el punto ciego para que no puedan incorporarse a su carril.
    B: Tocar la bocina continuamente mientras conduce en su punto ciego.
    C: Acelerar o retroceder para que el otro conductor pueda ver su vehículo más
      fácilmente.
    D: Encender las luces altas para que vean su reflejo en sus espejos.
  answer: C
  explanation: Debe intentar evitar conducir a ambos lados y ligeramente detrás de
    otro vehículo. Acelere o retroceda para que el otro conductor pueda ver su vehículo
    más fácilmente.
- id: 488
  category: defensive_driving
  question: ¿Cuándo es especialmente importante revisar detrás de su vehículo al reducir
    la velocidad?
  choices:
    A: Al acercarse a un semáforo en verde.
    B: Al reducir la velocidad rápidamente o en puntos donde un conductor que le sigue
      no esperaría que usted redujera la velocidad.
    C: Solo cuando conduce en una autopista interestatal de varios carriles.
    D: Al subir una colina empinada.
  answer: B
  explanation: Debe revisar detrás de su vehículo cada vez que reduzca la velocidad,
    y es muy importante cuando reduce la velocidad rápidamente o en puntos donde un
    conductor que le sigue no esperaría que usted redujera la velocidad, como entradas
    privadas o espacios de estacionamiento.
- id: 489
  category: defensive_driving
  question: ¿Por qué debe encender los faros cuando conduce alejándose de un sol naciente
    o poniente?
  choices:
    A: Para ayudarle a ver la carretera detrás de usted en su espejo retrovisor.
    B: Porque los rayos del sol agotarán la batería de su vehículo.
    C: Los conductores que vienen hacia usted pueden tener dificultades para ver su
      vehículo debido al deslumbramiento.
    D: Es requerido por la ley de Delaware durante todas las horas del día.
  answer: C
  explanation: Al conducir alejándose de un sol naciente o poniente, los conductores
    que vienen hacia usted pueden tener dificultades para ver su vehículo. Sus faros
    les ayudarán a verle.
- id: 490
  category: sharing_the_road
  question: ¿Por qué debe evitar quedarse al lado de un vehículo grande como un camión
    o un autobús?
  choices:
    A: Viajan a velocidades más altas que los automóviles de pasajeros.
    B: Tienen puntos ciegos grandes, lo que dificulta que sus conductores le vean.
    C: Se les exige usar solo el carril izquierdo.
    D: Emiten gases de escape que pueden oscurecer su visión.
  answer: B
  explanation: 'El manual establece: ''Nunca se quede al lado de un vehículo grande
    como un camión o un autobús. Estos vehículos tienen puntos ciegos grandes y es
    difícil para los conductores de vehículos grandes verle''.'
- id: 491
  category: safe_driving_rules
  question: ¿Según la ley de Delaware, cuál es la distancia mínima con la que debe
    señalizar antes de realizar un giro?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: El manual especifica que la ley de Delaware establece que debe señalizar
    durante al menos 300 pies antes de girar.
- id: 492
  category: safe_driving_rules
  question: ¿Qué debe hacer si planea girar, pero hay una entrada para autos o una
    calle entre usted y el giro previsto?
  choices:
    A: Señalizar inmediatamente para advertir a los conductores detrás de usted.
    B: Esperar hasta haber pasado la calle o entrada intermedia antes de señalizar.
    C: Usar señales manuales en lugar de señales eléctricas.
    D: Presionar sus frenos continuamente hasta llegar al giro.
  answer: B
  explanation: 'El manual aconseja: ''Si hay calles, entradas para autos o accesos
    entre usted y el lugar donde desea girar, espere hasta haberlos pasado para señalizar''.'
- id: 493
  category: defensive_driving
  question: ¿Cómo puede avisar a los conductores que vienen detrás de usted que está
    a punto de reducir la velocidad o detenerse en un lugar inesperado?
  choices:
    A: Encender las luces de emergencia.
    B: Tocar la bocina tres veces.
    C: Presionar el pedal del freno tres o cuatro veces rápidamente.
    D: Sacar la mano por la ventana y agitarla.
  answer: C
  explanation: 'El manual establece: ''Si va a detenerse o reducir la velocidad en
    un lugar donde otro conductor no lo espera, presione el pedal del freno tres o
    cuatro veces rápidamente para avisar a quienes vienen detrás que está a punto
    de reducir la velocidad''.'
- id: 494
  category: safe_driving_rules
  question: En comparación con detenerse a 30 mph, ¿cuánta distancia se necesita para
    detener un vehículo que viaja a 60 mph?
  choices:
    A: Aproximadamente la misma distancia
    B: El doble de la distancia
    C: Más del triple de la distancia
    D: Cuatro veces la distancia
  answer: C
  explanation: Según el manual, detenerse a 60 mph no requiere el doble de la distancia
    que a 30 mph, sino más del triple de la distancia.
- id: 495
  category: safe_driving_rules
  question: ¿Cuál es el momento más seguro para reducir la velocidad en una curva?
  choices:
    A: Antes de entrar en la curva
    B: Mientras está en medio de la curva
    C: Justo al salir de la curva
    D: Debe mantener una velocidad constante durante toda la curva
  answer: A
  explanation: 'El manual indica: ''Reduzca siempre la velocidad antes de entrar en
    la curva para no tener que frenar dentro de ella. Frenar en una curva puede hacer
    que el vehículo patine''.'
- id: 496
  category: safe_driving_rules
  question: ¿Cuánto debe reducir su velocidad al conducir en una carretera mojada?
  choices:
    A: Aproximadamente 5 mph
    B: Aproximadamente 10 mph
    C: Reducir la velocidad a la mitad
    D: Reducir la velocidad al mínimo posible
  answer: B
  explanation: 'El manual proporciona pautas específicas para carreteras resbaladizas,
    indicando: ''En una carretera mojada, debe reducir su velocidad aproximadamente
    10 mph''.'
- id: 497
  category: safe_driving_rules
  question: ¿Cómo debe ajustar su velocidad al conducir sobre nieve compacta?
  choices:
    A: Reducir su velocidad en 10 mph
    B: Reducir su velocidad a la mitad
    C: Mantener el límite de velocidad indicado
    D: Aumentar su velocidad para mantener la tracción
  answer: B
  explanation: 'Según la sección del manual sobre carreteras resbaladizas: ''En nieve
    compacta, debe reducir su velocidad a la mitad''.'
- id: 498
  category: defensive_driving
  question: ¿Por qué los pasos elevados y los puentes pueden ser más peligrosos durante
    el clima frío?
  choices:
    A: Acumulan más aceite del tráfico.
    B: Suelen estar construidos con pendientes más pronunciadas.
    C: Pueden estar más fríos que otras vías y tener placas de hielo incluso cuando
      el resto del pavimento no las tiene.
    D: No tienen un drenaje adecuado para la nieve derretida.
  answer: C
  explanation: 'El manual explica: ''El pavimento en los puentes puede estar helado
    incluso cuando el resto del pavimento no lo está. Esto se debe a que los puentes
    pueden estar más fríos que otras vías''.'
- id: 499
  category: safe_driving_rules
  question: ¿A qué temperatura es más resbaladizo el hielo en la carretera?
  choices:
    A: Muy por debajo del punto de congelación (alrededor de 0 grados Fahrenheit)
    B: Cerca del punto de congelación, cuando el hielo puede mojarse
    C: Cuando la temperatura baja rápidamente por la noche
    D: El hielo mantiene el mismo nivel de deslizamiento independientemente de la
      temperatura
  answer: B
  explanation: 'El manual señala: ''Cuando la temperatura está cerca del punto de
    congelación, el hielo puede mojarse. Esto hace que las condiciones sean más resbaladizas
    que a temperaturas muy por debajo del punto de congelación''.'
- id: 500
  category: safe_driving_rules
  question: ¿A qué velocidad pueden sus neumáticos perder toda tracción con la carretera
    durante una lluvia intensa?
  choices:
    A: 25 mph
    B: 35 mph
    C: 50 mph
    D: 65 mph
  answer: C
  explanation: 'El manual establece con respecto al hidroplaneo: ''En una lluvia intensa,
    sus neumáticos pueden perder toda tracción con la carretera a unas 50 mph''.'
- id: 501
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si siente que sus neumáticos han perdido
    tracción con la carretera (hidroplaneo)?
  choices:
    A: Frenar bruscamente de inmediato.
    B: Girar el volante bruscamente hacia la derecha.
    C: Levantar el pie del acelerador y mantener el volante recto.
    D: Acelerar ligeramente para recuperar la tracción.
  answer: C
  explanation: 'Si sus neumáticos pierden tracción, el manual indica: ''Levante el
    pie del acelerador. Mantenga el volante recto''.'
- id: 502
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado para incorporarse al tráfico de alta
    velocidad desde una rampa?
  choices:
    A: Conducir hasta el final de la rampa y detenerse hasta que haya un espacio.
    B: Usar la rampa para alcanzar la velocidad de los otros vehículos antes de incorporarse
      a la carretera.
    C: Entrar a la autopista a baja velocidad y acelerar gradualmente.
    D: Ceder el paso al tráfico deteniéndose a mitad de la rampa.
  answer: B
  explanation: 'El manual aconseja: ''Use la rampa para alcanzar la velocidad de los
    otros vehículos antes de incorporarse a la carretera. No conduzca hasta el final
    de la rampa y se detenga...'''
- id: 503
  category: safe_driving_rules
  question: Al salir de una carretera principal que tiene una rampa de salida, ¿cuándo
    debe comenzar a reducir la velocidad?
  choices:
    A: Aproximadamente 500 pies antes de la rampa de salida
    B: Tan pronto como encienda su luz direccional
    C: Solo después de haberse incorporado a la rampa de salida
    D: Mientras todavía se encuentra en el flujo principal de tráfico
  answer: C
  explanation: 'El manual establece: ''Si la carretera por la que viaja tiene rampas
    de salida, no reduzca la velocidad hasta que se incorpore a la rampa de salida''.'
- id: 504
  category: signs_and_signals
  question: ¿Qué indica una calcomanía de triángulo naranja en la parte trasera de
    un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos.
    B: El vehículo es un vehículo de movimiento lento que generalmente circula a 25
      mph o menos.
    C: El vehículo es de respuesta a emergencias.
    D: El vehículo está averiado y espera una grúa.
  answer: B
  explanation: El manual explica que los tractores agrícolas, los vehículos de tracción
    animal y los vehículos de mantenimiento de carreteras suelen circular a 25 mph
    o menos y 'deben tener una calcomanía de vehículo de movimiento lento (un triángulo
    naranja) en la parte trasera'.
- id: 505
  category: signs_and_signals
  question: ¿Qué símbolo debe haber en la parte trasera de los tractores agrícolas,
    vehículos de tracción animal y vehículos de mantenimiento de carreteras que suelen
    circular a 25 mph o menos?
  choices:
    A: Una luz amarilla intermitente
    B: Un triángulo naranja
    C: Un octágono rojo
    D: Un diamante blanco
  answer: B
  explanation: Según el manual, los tractores agrícolas, los vehículos de tracción
    animal y los vehículos de mantenimiento de carreteras suelen circular a 25 mph
    o menos y deben tener una calcomanía de vehículo de movimiento lento, que es un
    triángulo naranja, en la parte trasera.
- id: 506
  category: safe_driving_rules
  question: Según el manual, ¿cómo se compara la tasa de accidentes fatales por la
    noche con la conducción diurna?
  choices:
    A: Es la misma que durante el día
    B: Es el doble de alta que durante el día
    C: Es dos veces y media más alta que durante el día
    D: Es cuatro veces más alta que durante el día
  answer: C
  explanation: Por milla recorrida, la tasa de accidentes fatales por la noche en
    todo el país es dos veces y media más alta que durante el día.
- id: 507
  category: defensive_driving
  question: ¿Qué debe hacer al pasar vehículos por la noche para evitar el resplandor
    de sus faros?
  choices:
    A: Mirar directamente a sus faros para rastrear su posición
    B: Encender sus luces altas para contrarrestar el resplandor
    C: Cerrar los ojos brevemente hasta que el vehículo pase
    D: Usar miradas rápidas para verificar su posición y el borde derecho de la carretera
  answer: D
  explanation: Al pasar vehículos por la noche, no mire fijamente a sus faros. Debe
    usar miradas rápidas para conocer la posición en el carril de los vehículos que
    vienen en sentido contrario, conocer su propia posición, estar seguro del borde
    derecho de la carretera y mirar hacia adelante en busca de objetos.
- id: 508
  category: defensive_driving
  question: 'Si ve a otro conductor con su luz direccional parpadeando, usted debe:'
  choices:
    A: Asumir que hará el giro y continuar
    B: Tocar la bocina para avisarle que usted está allí
    C: Planificar con anticipación y decidir qué hacer tanto si gira como si no lo
      hace
    D: Acelerar para pasarlo antes de que gire
  answer: C
  explanation: El manual establece que no debe confiar en que el otro conductor hará
    lo que usted cree que va a hacer. Cuando su luz direccional esté parpadeando,
    no asuma que hará un giro; planifique con anticipación y decida qué hacer tanto
    si gira como si no lo hace.
- id: 509
  category: safe_driving_rules
  question: Bajo condiciones ideales, con buenos neumáticos y pavimento seco, ¿aproximadamente
    cuántos pies se necesitan para reaccionar y detener su vehículo a 50 mph?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 400 pies
  answer: D
  explanation: A 50 mph, puede tomar alrededor de 400 pies reaccionar ante algo que
    vea y detener su vehículo, lo cual es aproximadamente la longitud de una cuadra
    de la ciudad.
- id: 510
  category: safe_driving_rules
  question: A 30 mph, ¿aproximadamente cuántos pies se necesitan para reaccionar y
    detener su vehículo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 400 pies
  answer: B
  explanation: A 30 mph, puede tomar alrededor de 200 pies detenerse. Eso es casi
    la mitad de una cuadra de la ciudad en longitud.
- id: 511
  category: vehicle_information
  question: Por la noche, ¿a qué distancia aproximada le permiten ver sus faros delanteros?
  choices:
    A: 150 pies
    B: 250 pies
    C: 350 pies
    D: 500 pies
  answer: C
  explanation: Sus faros delanteros le permitirán ver a unos 350 pies de distancia.
    Debe conducir a una velocidad que le permita detenerse dentro de esta distancia.
- id: 512
  category: safe_driving_rules
  question: 'En una lluvia muy intensa, tormenta de nieve o niebla espesa donde no
    pueda ver a más de 200 pies de distancia, no puede conducir de manera segura a
    más de:'
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: En una lluvia muy intensa, tormenta de nieve o niebla espesa, es posible
    que no pueda ver mucho más allá de 200 pies. Cuando no pueda ver más allá de esa
    distancia, no podrá conducir de manera segura a más de 30 mph.
- id: 513
  category: safe_driving_rules
  question: ¿Qué regla debe utilizar para saber si está conduciendo demasiado rápido
    para su distancia de visibilidad?
  choices:
    A: La regla de los dos segundos
    B: La regla de los tres segundos
    C: La regla de los cuatro segundos de distancia de visibilidad
    D: La regla de la longitud de un vehículo
  answer: C
  explanation: Para saber si está conduciendo demasiado rápido para las condiciones,
    utilice la "regla de los cuatro segundos de distancia de visibilidad". Si llega
    a un objeto estacionario antes de terminar de contar hasta cuatro mil uno (four-one-thousand),
    va demasiado rápido para su distancia de visibilidad.
- id: 514
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los límites
    de velocidad señalizados?
  choices:
    A: Nunca recibirá una multa si conduce por debajo del límite de velocidad señalizado
    B: Se publican para condiciones ideales y debe reducir la velocidad si la carretera
      está mojada o con hielo
    C: Se aplican solo durante las horas del día
    D: Son sugerencias y pueden excederse si el tráfico es ligero
  answer: B
  explanation: Los límites de velocidad se publican para condiciones ideales. Si la
    carretera está mojada o con hielo, si no puede ver bien o si el tráfico es pesado,
    debe reducir la velocidad. Puede recibir una multa por viajar demasiado rápido
    en condiciones inseguras, incluso si está por debajo del límite señalizado.
- id: 515
  category: safe_driving_rules
  question: ¿Cuál es una forma sencilla de saber si está siguiendo al vehículo de
    adelante demasiado de cerca en condiciones normales?
  choices:
    A: La regla de los dos segundos
    B: La regla de los tres segundos
    C: La regla de los cuatro segundos
    D: La regla de los cinco segundos
  answer: B
  explanation: Existe una forma sencilla de saber si está siguiendo demasiado de cerca.
    Se llama la "regla de los tres segundos" y funciona a cualquier velocidad.
- id: 516
  category: sharing_the_road
  question: ¿Por qué debería aumentar su distancia de seguimiento a al menos cuatro
    segundos cuando sigue a una motocicleta?
  choices:
    A: Las motocicletas pueden acelerar más rápido que los automóviles
    B: Las motocicletas bloquean su vista de la carretera por delante
    C: Si la motocicleta se cae, necesita una distancia adicional para evitar golpear
      al conductor
    D: Las motocicletas deben conducir más lento que el resto del tráfico
  answer: C
  explanation: Al seguir motocicletas, si la motocicleta se cayera, necesitaría una
    distancia adicional para evitar golpear al conductor. Las posibilidades de una
    caída son mayores en carreteras mojadas o con hielo, grava o superficies metálicas.
- id: 517
  category: sharing_the_road
  question: 'Debe aumentar su distancia de seguimiento cuando esté detrás de camiones
    grandes o autobuses porque:'
  choices:
    A: Es más probable que se averíen
    B: Es posible que los conductores no puedan verlo directamente detrás de ellos
      y bloquean su vista de la carretera por delante
    C: Viajan a velocidades mucho más altas que los automóviles de pasajeros
    D: Emiten gases de escape que pueden oscurecer su visión
  answer: B
  explanation: Los conductores de camiones, autobuses, furgonetas o vehículos que
    remolcan caravanas o remolques pueden no verlo cuando está directamente detrás
    de ellos. Los vehículos grandes también bloquean su vista de la carretera por
    delante, por lo que retroceder le permite más espacio para ver y ser visto.
- id: 518
  category: defensive_driving
  question: Como parte de la conducción defensiva, ¿en qué debería pensar constantemente
    mientras conduce?
  choices:
    A: Cómo adelantar al vehículo que tiene delante
    B: Una "ruta de escape" en caso de que surja una emergencia repentina
    C: La velocidad exacta de los vehículos en el carril opuesto
    D: Cómo llegar a su destino en el menor tiempo posible
  answer: B
  explanation: Debe pensar constantemente en una "ruta de escape" mientras conduce.
    Si surge una emergencia repentina, tendrá listo un plan de acción.
- id: 519
  category: safe_driving_rules
  question: ¿Por qué las plazas de peaje se consideran "puntos problemáticos" donde
    es posible que deba reducir la velocidad?
  choices:
    A: Los vehículos están cambiando de carril, preparándose para detenerse y acelerando
      de nuevo
    B: Los operadores de las cabinas de peaje a menudo cruzan los carriles caminando
    C: El límite de velocidad es siempre de 15 mph en todas las plazas de peaje
    D: Por lo general, hay tractores agrícolas y vehículos de tracción animal presentes
  answer: A
  explanation: Las plazas de peaje son puntos problemáticos porque los vehículos cambian
    de carril y se preparan para detenerse, y luego aceleran de nuevo al salir de
    la plaza. El número de carriles también podría cambiar.
- id: 520
  category: defensive_driving
  question: ¿Qué debe hacer si lo siguen demasiado de cerca (tailgated) y no hay un
    carril derecho al cual moverse?
  choices:
    A: Toque sus frenos rápidamente para advertir al conductor.
    B: Aumente la velocidad para incrementar la distancia.
    C: Espere hasta que el camino por delante esté despejado y reduzca la velocidad
      lentamente.
    D: Encienda sus luces de emergencia y deténgase.
  answer: C
  explanation: El manual establece que si lo siguen demasiado de cerca y no hay un
    carril derecho, debe esperar hasta que el camino por delante esté despejado y
    luego reducir la velocidad lentamente. Esto anima al conductor que lo sigue de
    cerca a rebasarlo. Nunca debe reducir la velocidad rápidamente.
- id: 521
  category: safe_driving_rules
  question: ¿Por qué debe dejar espacio adicional cuando se detiene en una colina
    o pendiente detrás de otro vehículo?
  choices:
    A: Para mejorar su visibilidad de la carretera adelante.
    B: El vehículo de adelante puede rodar hacia atrás cuando arranque.
    C: Para permitir que los peatones crucen entre los vehículos.
    D: Es requerido por ley para los vehículos de emergencia.
  answer: B
  explanation: Según el manual, debe dejar espacio adicional cuando se detiene en
    una colina o pendiente porque el vehículo de adelante puede rodar hacia atrás
    cuando arranque o se ponga en marcha.
- id: 522
  category: sharing_the_road
  question: 'Al rebasar a un ciclista, los automovilistas deben dejar un espacio libre
    mínimo de:'
  choices:
    A: Dos pies.
    B: Tres pies.
    C: Cuatro pies.
    D: Cinco pies.
  answer: B
  explanation: El manual establece explícitamente que los automovilistas deben dejar
    un mínimo de tres pies de espacio libre en todo momento al rebasar a un ciclista.
- id: 523
  category: safe_driving_rules
  question: ¿Qué tan grande debe ser el espacio que necesita cada vez que quiera incorporarse
    al tráfico, cambiar de carril o entrar en una calzada?
  choices:
    A: Dos segundos.
    B: Tres segundos.
    C: Cuatro segundos.
    D: Seis segundos.
  answer: C
  explanation: El manual establece que cada vez que desee incorporarse al tráfico,
    cambiar de carril o entrar en una calzada, necesita un espacio de unos cuatro
    segundos.
- id: 524
  category: safe_driving_rules
  question: ¿Cuál es la forma más segura de cruzar varios carriles de tráfico?
  choices:
    A: Espere a que todos los carriles estén despejados y crúcelos todos a la vez.
    B: Crúcelos un carril a la vez.
    C: Acelere rápidamente para minimizar el tiempo en la intersección.
    D: Use sus luces de emergencia al cruzar varios carriles.
  answer: B
  explanation: El manual aconseja que si desea cruzar varios carriles, lo haga uno
    a la vez. Es muy difícil determinar que todos los carriles estén libres y sean
    seguros para cruzar a la vez.
- id: 525
  category: safe_driving_rules
  question: 'Si tiene luz verde pero hay vehículos bloqueando la intersección adelante,
    usted debe:'
  choices:
    A: Entrar en la intersección y esperar a que el tráfico se despeje.
    B: Tocar la bocina hasta que los vehículos se muevan.
    C: No comenzar a cruzar la intersección.
    D: Pasar rozando los vehículos por el acotamiento.
  answer: C
  explanation: Incluso si tiene la luz verde, no comience a cruzar la intersección
    si hay vehículos bloqueando su camino. Si se queda atrapado en la intersección
    cuando la luz cambie a rojo, bloqueará el tráfico y podría recibir una multa.
- id: 526
  category: safe_driving_rules
  question: A una velocidad de 55 mph, ¿aproximadamente cuánto tiempo necesita para
    rebasar a otro vehículo de manera segura?
  choices:
    A: 5 segundos.
    B: 10 segundos.
    C: 15 segundos.
    D: 20 segundos.
  answer: B
  explanation: El manual establece que a una velocidad de 55 mph, necesita unos 10
    segundos para rebasar, lo que significa que necesita un espacio de 10 segundos
    en el tráfico que viene en sentido contrario.
- id: 527
  category: safe_driving_rules
  question: ¿Cuándo es seguro regresar al carril de circulación después de rebasar
    a otro vehículo?
  choices:
    A: Cuando esté a una distancia de un vehículo por delante del vehículo rebasado.
    B: Tan pronto como active su luz direccional derecha.
    C: Cuando pueda ver ambos faros delanteros del vehículo que acaba de rebasar en
      su espejo retrovisor.
    D: Cuando el conductor del vehículo rebasado haga destellos con sus faros.
  answer: C
  explanation: Antes de regresar al carril de circulación, debe dejar suficiente espacio.
    Es seguro regresar cuando pueda ver ambos faros delanteros del vehículo que acaba
    de rebasar en su espejo retrovisor.
- id: 528
  category: sharing_the_road
  question: ¿Por qué debe tener especial precaución al asumir que una motocicleta
    va a girar solo porque su luz direccional está encendida?
  choices:
    A: A las motocicletas se les permite girar desde cualquier carril.
    B: Las luces direccionales de las motocicletas a menudo no se cancelan solas.
    C: Las motocicletas usan frecuentemente las luces direccionales para indicar que
      están disminuyendo la velocidad.
    D: Las luces direccionales de las motocicletas suelen ser demasiado tenues para
      verse con claridad.
  answer: B
  explanation: El manual advierte que nunca se debe asumir que otro conductor girará
    solo porque una señal está encendida, señalando que esto es particularmente cierto
    en el caso de las motocicletas, ya que sus señales a menudo no se cancelan solas.
- id: 529
  category: defensive_driving
  question: Si está adelantando a una bicicleta y un vehículo viene en sentido contrario
    al mismo tiempo, ¿qué debe hacer?
  choices:
    A: Acelerar para rebasar la bicicleta antes de que llegue el vehículo.
    B: Tocar la bocina para que la bicicleta se salga de la carretera.
    C: Pasar apretado entre la bicicleta y el vehículo que viene en sentido contrario.
    D: Reducir la velocidad y dejar que el vehículo que viene en sentido contrario
      pase primero, luego dar espacio adicional a la bicicleta.
  answer: D
  explanation: Cuando sea posible, enfrente los peligros potenciales uno a la vez.
    Si está adelantando a una bicicleta con un vehículo que viene en sentido contrario,
    reduzca la velocidad y deje que el vehículo pase primero para poder dar espacio
    adicional a la bicicleta.
- id: 530
  category: sharing_the_road
  question: Al acercarse a un cruce de ferrocarril, ¿para cuál de los siguientes vehículos
    que están obligados a detenerse debe dejar espacio adicional?
  choices:
    A: Motocicletas y ciclomotores.
    B: Autobuses de tránsito, autobuses escolares y vehículos que transportan materiales
      peligrosos.
    C: Vehículos de pasajeros que remolcan remolques.
    D: Camiones de entrega y vehículos postales.
  answer: B
  explanation: El manual instruye a los conductores a dejar espacio adicional para
    los vehículos que deben detenerse en los cruces de ferrocarril, incluidos los
    autobuses de tránsito, los autobuses escolares o los vehículos que transportan
    materiales peligrosos.
- id: 531
  category: safe_driving_rules
  question: 'Al cruzar el tráfico, detenerse a mitad de camino solo es seguro cuando:'
  choices:
    A: Usted conduce un automóvil compacto.
    B: Hay un divisor central (mediana) lo suficientemente grande para su vehículo.
    C: El tráfico que viene en sentido contrario se mueve a menos de 30 mph.
    D: Usted tiene activadas las luces de emergencia.
  answer: B
  explanation: Cuando cruza el tráfico, detenerse a mitad de camino solo es seguro
    cuando hay un divisor central lo suficientemente grande para su vehículo, de modo
    que ninguna parte del mismo sobresalga hacia el tráfico.
- id: 532
  category: defensive_driving
  question: 'Si debe repartir el espacio entre dos peligros, como un camión con remolque
    que viene en sentido contrario y un automóvil estacionado, usted debe:'
  choices:
    A: Conducir exactamente en medio de los dos peligros.
    B: Maniobrar más cerca del camión con remolque que viene en sentido contrario.
    C: Dejar un poco más de espacio del lado del peligro más grave.
    D: Detenerse por completo hasta que uno de los peligros se mueva.
  answer: C
  explanation: Al repartir el espacio entre dos peligros, si uno es más peligroso
    que el otro, debe dejar un poco más de espacio en el lado más peligroso (por ejemplo,
    dejando más espacio para el camión con remolque que está pasando).
- id: 533
  category: safe_driving_rules
  question: Debido a que su vista está bloqueada, ¿a qué distancia de una colina o
    curva no debe comenzar a rebasar a otro vehículo?
  choices:
    A: A un décimo de milla.
    B: A un cuarto de milla.
    C: A un tercio de milla.
    D: A media milla.
  answer: C
  explanation: Debe ser capaz de ver al menos a un tercio de milla de distancia. Debe
    tratar una curva o una colina como lo haría con un vehículo que viene en sentido
    contrario, lo que significa que no debe comenzar a rebasar si se encuentra a menos
    de un tercio de milla de una colina o curva.
- id: 534
  category: license_system
  question: ¿Cuál es el requisito mínimo de visión para aprobar el examen de la vista
    sin una restricción de conducción diurna en Delaware?
  choices:
    A: Visión de 20/20 en ambos ojos
    B: Visión de 20/30 en al menos un ojo
    C: Visión de 20/40 en al menos un ojo
    D: Visión de 20/50 en al menos un ojo
  answer: C
  explanation: Según el manual, para aprobar el examen de la vista debe tener al menos
    una visión de 20/40 en al menos un ojo. Aquellos con visión de 20/50 están restringidos
    a conducir únicamente durante el día.
- id: 535
  category: license_system
  question: ¿Qué restricción se impone a los conductores de Delaware que tienen una
    visión de 20/50?
  choices:
    A: Deben usar lentes correctivos en todo momento.
    B: Están restringidos a conducir únicamente durante el día.
    C: No pueden conducir en autopistas interestatales.
    D: Están restringidos a conducir a menos de 45 mph.
  answer: B
  explanation: El manual establece que los conductores con visión de 20/50 están restringidos
    a conducir únicamente durante el día.
- id: 536
  category: safe_driving_rules
  question: ¿Por qué debe evitar el uso de gafas oscuras o lentes de contacto teñidos
    por la noche?
  choices:
    A: Aumentan el resplandor de los faros que vienen en sentido contrario.
    B: Pueden reducir la luz que necesita para ver con claridad.
    C: Causan fatiga ocular severa en viajes largos.
    D: Es ilegal usarlos mientras se conduce en Delaware.
  answer: B
  explanation: El manual aconseja evitar las gafas oscuras o los lentes de contacto
    teñidos por la noche porque pueden reducir la luz que necesita para ver con claridad,
    incluso si cree que ayudan con el resplandor.
- id: 537
  category: safe_driving_rules
  question: Según el manual, ¿cómo se comparan los expedientes de conducción de los
    conductores con discapacidad auditiva con los de los conductores con buena audición?
  choices:
    A: Son ligeramente peores debido a que se pierden las advertencias sonoras.
    B: Son mucho mejores porque se distraen menos.
    C: Son tan buenos como los de los conductores con buena audición.
    D: Tienen tasas más altas de colisiones menores.
  answer: C
  explanation: Los estudios han demostrado que los expedientes de conducción de los
    conductores con discapacidad auditiva son tan buenos como los de los conductores
    con buena audición, ya que aprenden a confiar más en su visión y a mantenerse
    alerta.
- id: 538
  category: defensive_driving
  question: Para ayudar a prevenir la fatiga en un viaje largo, ¿qué recomienda el
    manual con respecto a las comidas?
  choices:
    A: Comer una comida abundante para mantener sus niveles de energía.
    B: Comer ligero, porque las comidas abundantes pueden darle sueño.
    C: Evitar comer por completo hasta llegar a su destino.
    D: Comer alimentos con alto contenido de azúcar para mantenerse alerta.
  answer: B
  explanation: El manual recomienda comer ligero y no ingerir una comida abundante
    antes de salir, porque algunas personas sienten sueño después de comer una comida
    grande.
- id: 539
  category: defensive_driving
  question: ¿Con qué frecuencia debe tomar un descanso en un viaje largo para evitar
    la fatiga?
  choices:
    A: Cada 30 minutos
    B: Aproximadamente cada hora
    C: Cada 3 o 4 horas
    D: Solo cuando necesite reabastecer combustible a su vehículo
  answer: B
  explanation: Para ayudar a no cansarse en un viaje largo, el manual aconseja tomar
    descansos deteniéndose aproximadamente cada hora, o cuando lo necesite.
- id: 540
  category: alcohol_drugs_health
  question: A nivel nacional, ¿en qué porcentaje aproximado de los accidentes de tráfico
    en los que alguien muere está involucrado el alcohol?
  choices:
    A: 15%
    B: 28%
    C: 40%
    D: 50%
  answer: B
  explanation: A nivel nacional, el alcohol está involucrado en aproximadamente el
    28% de los accidentes de tráfico en los que alguien muere.
- id: 541
  category: alcohol_drugs_health
  question: ¿Por qué los conductores nuevos se ven más afectados por el alcohol que
    los conductores experimentados?
  choices:
    A: Por lo general, tienen una menor tolerancia al alcohol.
    B: Todavía están aprendiendo a conducir.
    C: Tienden a conducir a velocidades más altas.
    D: Es más probable que conduzcan de noche.
  answer: B
  explanation: El manual establece que los conductores nuevos se ven más afectados
    por el alcohol que los conductores experimentados porque todavía están aprendiendo
    a conducir.
- id: 542
  category: alcohol_drugs_health
  question: Si un conductor tiene epilepsia, ¿qué se requiere para que pueda conducir
    legalmente en Delaware?
  choices:
    A: Solo deben conducir durante las horas del día.
    B: Deben estar certificados de que la afección está bajo un control médico suficiente.
    C: Deben tener a un conductor con licencia en el asiento del pasajero en todo
      momento.
    D: Se les prohíbe permanentemente conducir.
  answer: B
  explanation: En Delaware, las personas sujetas a la pérdida del conocimiento debido
    a una enfermedad del sistema nervioso central (como la epilepsia) deben estar
    certificadas de que la enfermedad está bajo el control suficiente para permitirles
    conducir de manera segura.
- id: 543
  category: alcohol_drugs_health
  question: ¿Por qué los diabéticos que toman insulina deben tener precaución al conducir?
  choices:
    A: La insulina causa ceguera nocturna permanente.
    B: Pueden experimentar una reacción a la insulina, un desmayo o un choque (shock).
    C: Los medicamentos de insulina causan somnolencia severa.
    D: Son más susceptibles a la furia al volante.
  answer: B
  explanation: Los diabéticos que toman insulina no deben conducir cuando exista alguna
    posibilidad de una reacción a la insulina, desmayo, convulsión o choque (shock),
    lo cual podría resultar de saltarse una comida o tomar la dosis incorrecta.
- id: 544
  category: driver_responsibility
  question: ¿Qué sugiere el manual que haga si está enojado o emocionado antes de
    conducir?
  choices:
    A: Conducir un poco más rápido para llegar pronto a su destino.
    B: Escuchar música a todo volumen para distraerse.
    C: Darse tiempo para calmarse y mantenerse fuera de la carretera hasta estar tranquilo.
    D: Bajar las ventanillas para que entre aire fresco mientras conduce.
  answer: C
  explanation: Si está enojado o emocionado, el manual aconseja darse tiempo para
    calmarse, dar un paseo corto si es necesario y mantenerse fuera de la carretera
    hasta que se haya tranquilizado.
- id: 545
  category: sharing_the_road
  question: Si otro conductor lo rebasa cuando no tiene suficiente espacio, ¿cuál
    es la acción más segura a tomar?
  choices:
    A: Acelerar para evitar que se le cruce delante.
    B: Tocar la bocina continuamente para advertirles de su error.
    C: Virar hacia el arcén (acotamiento) para darles espacio.
    D: Reducir la velocidad y dejar que regresen al carril de circulación de manera
      segura.
  answer: D
  explanation: Si otro conductor comete un error, no lo empeore. Si un conductor lo
    rebasa sin suficiente espacio, reduzca la velocidad y deje que regrese al carril
    de circulación de manera segura.
- id: 546
  category: sharing_the_road
  question: Según el manual, ¿cuál de los siguientes es un ejemplo de un conductor
    que puede estar confundido y requiere precaución adicional?
  choices:
    A: Un conductor que busca señales de tráfico o números de casas.
    B: Un repartidor que entrega un paquete.
    C: Un trabajador de la construcción dirigiendo el tráfico.
    D: Un conductor que sale de un espacio de estacionamiento en reversa.
  answer: A
  explanation: El manual enumera a los "conductores que buscan señales de tráfico
    o números de casas" bajo la categoría de "personas que pueden estar confundidas".
    Los repartidores y los trabajadores de la construcción se enumeran como "distraídos",
    y los conductores que salen en reversa tienen su "visión bloqueada".
- id: 547
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia de no usar lentes correctivos si su
    licencia de conducir dice que debe usarlos?
  choices:
    A: Su vehículo será confiscado de inmediato.
    B: Podría recibir una multa si lo detienen.
    C: Su licencia será revocada permanentemente.
    D: Se le requerirá volver a tomar el examen de conducir.
  answer: B
  explanation: 'El manual establece: "Si su licencia de conducir dice que debe usar
    lentes correctivos y no lo hace y resulta que lo detienen, podría recibir una
    multa".'
- id: 548
  category: driver_responsibility
  question: Si se siente preocupado o molesto por algo mientras conduce, ¿qué sugiere
    el manual que podría ayudarlo a mantener su mente en la conducción?
  choices:
    A: Llamar a un amigo usando un dispositivo de manos libres.
    B: Escuchar la radio.
    C: Beber una bebida con cafeína.
    D: Conducir por carreteras menos pobladas.
  answer: B
  explanation: Si está preocupado, se siente desanimado o molesto, el manual sugiere
    intentar mantener su mente en la conducción y señala que "algunos han descubierto
    que escuchar la radio ayuda".
- id: 549
  category: vehicle_information
  question: ¿Por qué nunca debe girar el encendido de su vehículo a la posición de
    "bloqueo" (lock) mientras aún está en movimiento?
  choices:
    A: Hará que el motor se incendie.
    B: Hará que la dirección se bloquee y perderá el control.
    C: Bloqueará inmediatamente los frenos.
    D: Agotará la batería.
  answer: B
  explanation: 'El manual establece: "Nunca gire el encendido de su vehículo a la
    posición de ''bloqueo'' (lock) mientras aún está en movimiento. Esto hará que
    la dirección se bloquee si intenta girar el volante, y perderá el control de su
    vehículo".'
- id: 550
  category: defensive_driving
  question: ¿Qué es lo primero que debe intentar si sus frenos dejan de funcionar?
  choices:
    A: Cambiar a punto muerto (neutral) de inmediato.
    B: Tirar de la palanca del freno de estacionamiento lo más rápido posible.
    C: Bombear el pedal del freno varias veces.
    D: Apagar el encendido.
  answer: C
  explanation: Si sus frenos dejan de funcionar, el manual aconseja primero "bombear
    el pedal del freno varias veces. Esto a menudo generará suficiente presión de
    frenado para permitirle detenerse".
- id: 551
  category: safe_driving_rules
  question: ¿Cómo debe secar los frenos después de conducir por agua profunda?
  choices:
    A: Conducir a alta velocidad para secarlos con el aire.
    B: Poner el vehículo en una marcha baja, conducir lentamente y presionar los frenos
      ligeramente.
    C: Detener el vehículo y dejar el motor en ralentí durante 10 minutos.
    D: Bombear los frenos rápidamente mientras está en punto muerto (neutral).
  answer: B
  explanation: Para secar los frenos mojados, el manual indica "poner el vehículo
    en una marcha baja, conducir lentamente y presionar/aplicar los frenos ligeramente".
- id: 552
  category: defensive_driving
  question: Si su vehículo se sale del pavimento, ¿a qué velocidad es seguro intentar
    regresar a la calzada?
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: Cualquier velocidad, siempre que gire bruscamente
  answer: A
  explanation: 'El manual establece: "No intente regresar al pavimento hasta que tenga
    su vehículo bajo control, su velocidad se haya reducido a 15 mph o menos y haya
    verificado el tráfico detrás de usted".'
- id: 553
  category: defensive_driving
  question: ¿Qué debe hacer de inmediato si el pedal del acelerador se atasca y el
    motor sigue acelerando?
  choices:
    A: Apagar el motor mientras aún está en la carretera.
    B: Cambiar rápidamente a punto muerto (neutral).
    C: Bombear el pedal del freno repetidamente.
    D: Tirar del freno de emergencia.
  answer: B
  explanation: Si el pedal del acelerador se atasca, el manual dice que mantenga la
    vista en la carretera y "cambie rápidamente a punto muerto (neutral)", luego salga
    de la carretera y apague el motor.
- id: 554
  category: defensive_driving
  question: ¿Por qué NO debe usar agua para apagar el incendio de un vehículo?
  choices:
    A: Dañará los componentes del motor.
    B: La gasolina encendida flotará sobre el agua y propagará el fuego.
    C: Causará un cortocircuito en la batería.
    D: Crea humo tóxico.
  answer: B
  explanation: 'El manual advierte con respecto a los incendios de vehículos: "No
    use agua; la gasolina encendida flotará sobre ella y propagará el fuego".'
- id: 555
  category: safe_driving_rules
  question: Si su vehículo se apaga en las vías del tren y se aproxima un tren, ¿en
    qué dirección debe correr después de salir?
  choices:
    A: En la misma dirección en la que viaja el tren.
    B: Alejándose directamente de las vías en un ángulo de 90 grados.
    C: En la dirección general de donde viene el tren.
    D: Hacia la señal de cruce de ferrocarril más cercana.
  answer: C
  explanation: El manual aconseja "correr en la dirección general de donde viene el
    tren, para que los escombros de la colisión no le golpeen".
- id: 556
  category: defensive_driving
  question: Al intentar evitar una colisión, ¿cuáles son las tres opciones principales
    de un conductor?
  choices:
    A: Detenerse, girar o acelerar.
    B: Frenar, tocar la bocina o desviarse.
    C: Acelerar, frenar o prepararse para el impacto.
    D: Reducir la marcha, girar a la derecha o detenerse.
  answer: A
  explanation: 'El manual establece: "Para evitar una colisión, los conductores tienen
    tres opciones: detenerse, girar o acelerar".'
- id: 557
  category: defensive_driving
  question: Si su vehículo NO tiene ABS, ¿cuál es el procedimiento adecuado para girar
    rápidamente y evitar una colisión?
  choices:
    A: Girar el volante bruscamente mientras presiona el pedal del freno hasta el
      fondo.
    B: Pisar el pedal del freno, soltarlo y luego girar el volante.
    C: Acelerar ligeramente mientras gira el volante.
    D: Cambiar a punto muerto (neutral) y girar el volante.
  answer: B
  explanation: 'Sin ABS, el manual establece: "Debe pisar el pedal del freno, luego
    soltarlo y girar el volante. Frenar ralentizará el vehículo, pondrá más peso en
    los neumáticos delanteros y permitirá un giro más rápido".'
- id: 558
  category: defensive_driving
  question: ¿Cuál es la causa principal de los derrapes de los vehículos?
  choices:
    A: Conducir con neumáticos desinflados.
    B: Viajar demasiado rápido para las condiciones.
    C: Bombear los frenos demasiado rápido.
    D: Girar el volante demasiado lento.
  answer: B
  explanation: 'El manual establece explícitamente: "Los derrapes son causados por
    conductores que viajan demasiado rápido para las condiciones".'
- id: 559
  category: defensive_driving
  question: ¿Qué debe hacer con el pedal del freno si su vehículo comienza a derrapar?
  choices:
    A: Presionarlo firmemente hasta el fondo.
    B: Bombearlo rápidamente.
    C: No tocar el freno.
    D: Presionarlo ligeramente cada pocos segundos.
  answer: C
  explanation: Si su vehículo comienza a derrapar, el manual dice "no toque el freno.
    Hasta que el vehículo disminuya la velocidad, sus frenos no funcionarán y podrían
    hacer que derrape más".
- id: 560
  category: defensive_driving
  question: Si su vehículo está a punto de ser golpeado por delante, ¿qué debe intentar
    hacer?
  choices:
    A: Girar el vehículo para recibir un "golpe de refilón" en lugar de ser golpeado
      de frente.
    B: Acelerar para reducir el tiempo de impacto.
    C: Poner las manos frente a su cara y agacharse.
    D: Cambiar a reversa inmediatamente.
  answer: A
  explanation: 'El manual aconseja: "Si su vehículo está a punto de ser golpeado por
    delante, es importante intentar recibir un ''golpe de refilón'' en lugar de ser
    golpeado de frente. Esto significa... que debe intentar girar el vehículo".'
- id: 561
  category: driver_responsibility
  question: ¿Qué debe hacer si se ve involucrado en un choque con un vehículo estacionado?
  choices:
    A: Dejar una nota en el parabrisas e irse.
    B: Intentar localizar al propietario.
    C: Llamar a una grúa para el vehículo estacionado.
    D: Esperar exactamente 15 minutos antes de irse.
  answer: B
  explanation: 'El manual establece: ''Si se ve involucrado en un choque con un vehículo
    estacionado, debe intentar localizar al propietario''.'
- id: 562
  category: defensive_driving
  question: Si el incendio de un vehículo se sale de control, ¿a qué distancia del
    vehículo debe alejarse?
  choices:
    A: Al menos 25 pies
    B: Al menos 50 pies
    C: Al menos 100 pies
    D: Al menos 200 pies
  answer: C
  explanation: 'El manual advierte: ''Si un incendio se sale de control, aléjese al
    menos 100 pies del vehículo, ya que el tanque de gasolina podría explotar''.'
- id: 563
  category: driver_responsibility
  question: Si se ve involucrado en un choque donde alguien resulta herido o muerto,
    ¿qué debe hacer antes de abandonar la escena?
  choices:
    A: Intercambiar información del seguro e irse.
    B: Mover a la persona herida a un lado de la carretera.
    C: Esperar hasta que la policía haya hablado con usted y obtenido toda la información
      que necesiten.
    D: Darle agua a la persona herida para prevenir el estado de choque (shock).
  answer: C
  explanation: Es un delito abandonar el lugar de un choque en el que su vehículo
    estuvo involucrado si hay heridos o muertos antes de que la policía haya hablado
    con usted y obtenido toda la información necesaria sobre el accidente.
- id: 564
  category: safe_driving_rules
  question: ¿Cuándo debe mover a una persona herida en la escena de un choque?
  choices:
    A: Siempre que se quejen de dolor de espalda.
    B: Solo si se encuentran en un vehículo en llamas o en otro peligro inmediato
      de ser atropellados.
    C: Tan pronto como sea posible para despejar la calzada.
    D: Cuando le pidan ayuda para ponerse de pie.
  answer: B
  explanation: No debe mover a los heridos a menos que se encuentren en un vehículo
    en llamas o en otro peligro inmediato de ser golpeados por otro vehículo, ya que
    mover a una persona puede empeorar sus lesiones.
- id: 565
  category: safe_driving_rules
  question: ¿Cómo debe tratar una hemorragia grave en la escena de un choque?
  choices:
    A: Aplicar un torniquete por encima de la herida.
    B: Aplicar presión directamente sobre la herida con la mano o un paño.
    C: Elevar la herida y esperar a los paramédicos.
    D: Lavar la herida con agua inmediatamente.
  answer: B
  explanation: Si hay hemorragia, aplique presión directamente sobre la herida con
    la mano o con un paño. Incluso una hemorragia grave casi siempre puede detenerse
    o reducirse aplicando presión sobre la herida.
- id: 566
  category: safe_driving_rules
  question: ¿Qué debe hacer para ayudar a evitar que una persona herida entre en estado
    de choque (shock)?
  choices:
    A: Darles una bebida caliente.
    B: Hacer que caminen para mantener el flujo sanguíneo.
    C: Cubrirlos con una manta o abrigo para mantenerlos calientes.
    D: Salpicarles agua fría en la cara.
  answer: C
  explanation: Para ayudar a evitar que una persona herida entre en estado de choque,
    cúbrala con una manta o abrigo para mantenerla caliente.
- id: 567
  category: safe_driving_rules
  question: ¿Por qué debe apagar el encendido de los vehículos accidentados en la
    escena de un choque?
  choices:
    A: Para ahorrar la batería del vehículo.
    B: Para evitar que el vehículo ruede.
    C: Porque el combustible podría haberse derramado y el fuego es un peligro real.
    D: Para que la radio deje de sonar.
  answer: C
  explanation: Debe apagar el encendido de los vehículos accidentados porque el combustible
    podría haberse derramado y el fuego es un peligro real.
- id: 568
  category: driver_responsibility
  question: ¿Bajo qué condición debe un conductor involucrado en un choque informarlo
    inmediatamente a la policía?
  choices:
    A: Cuando el choque resulte en daños a la propiedad de $100 o más.
    B: Cuando el choque resulte en lesiones o la muerte de cualquier persona.
    C: Solo cuando el otro conductor no tenga seguro.
    D: Siempre que se raye un vehículo estacionado.
  answer: B
  explanation: El conductor de cualquier vehículo involucrado en un choque debe informar
    inmediatamente dicho accidente a la agencia policial cuando el choque resulte
    en lesiones o la muerte de cualquier persona.
- id: 569
  category: driver_responsibility
  question: Si ocurre un choque en una carretera pública, ¿con qué cantidad de daños
    aparentes a la propiedad debe informarse a la policía?
  choices:
    A: $100 o más
    B: $250 o más
    C: $500 o más
    D: $1,000 o más
  answer: C
  explanation: Un choque debe informarse a la policía cuando ocurra en una carretera
    pública y resulte en daños a la propiedad por un valor aparente de $500.00 o más.
- id: 570
  category: driver_responsibility
  question: Si un choque involucra a un conductor afectado por el alcohol o las drogas,
    ¿cuál es el umbral de daños a la propiedad para informarlo a la policía?
  choices:
    A: $250 o más
    B: $500 o más
    C: $750 o más
    D: $1,000 o más
  answer: D
  explanation: Un choque debe informarse cuando parezca que el accidente involucra
    a un conductor cuya capacidad física se ha visto afectada como resultado del consumo
    de alcohol o drogas, y resulte en daños a la propiedad por un valor aparente de
    $1,000.00 o más.
- id: 571
  category: driver_responsibility
  question: ¿Qué debe hacer si se ve involucrado en un choque y no hay heridos ni
    muertos, pero su vehículo dañado está obstruyendo el tráfico?
  choices:
    A: Dejar el vehículo exactamente donde está hasta que llegue la policía.
    B: Hacer todo esfuerzo razonable para mover el vehículo de manera que no obstruya
      el tráfico.
    C: Abandonar el vehículo y caminar para buscar ayuda.
    D: Pararse en el carril de tráfico para dirigir a otros vehículos a su alrededor.
  answer: B
  explanation: Si no hay heridos ni muertos y el vehículo dañado está obstruyendo
    el tráfico, el conductor debe hacer todo esfuerzo razonable para mover el vehículo
    o hacer que lo muevan para no obstruir el flujo regular del tráfico.
- id: 572
  category: driver_responsibility
  question: ¿Qué información deben intercambiar los conductores cuando se ven involucrados
    en un choque que resulta en daños a la propiedad, lesiones o muerte?
  choices:
    A: Nombre, dirección, número de registro del vehículo, número de licencia de conducir,
      y compañía de seguros y número de póliza.
    B: Nombre, número de teléfono y número de seguro social.
    C: Solo la compañía de seguros y el número de póliza.
    D: Número de licencia de conducir y fecha de nacimiento.
  answer: A
  explanation: Si hay daños a la propiedad personal, lesiones o muerte, el conductor
    deberá proporcionar su nombre, dirección, número de registro del vehículo, número
    de licencia de conducir, y la compañía de seguros y el número de póliza.
- id: 573
  category: safe_driving_rules
  question: ¿Por qué nunca debe conducir a la escena de un choque, incendio u otro
    desastre solo para mirar?
  choices:
    A: Podría recibir una multa de tráfico por curiosear (rubbernecking).
    B: Puede bloquear el paso a la policía, bomberos y vehículos de rescate.
    C: El seguro de su vehículo puede ser cancelado.
    D: Hará que su vehículo se sobrecaliente.
  answer: B
  explanation: Nunca conduzca a la escena de un choque, incendio u otro desastre solo
    para mirar. Puede bloquear el paso a la policía, bomberos, ambulancias, grúas
    y otros vehículos de rescate.
- id: 574
  category: safe_driving_rules
  question: ¿Qué debe hacer si hay líneas eléctricas caídas con cables en la carretera
    en la escena de un choque?
  choices:
    A: Usar un palo de madera para quitarlos del camino.
    B: Pasar sobre ellos rápidamente con el vehículo.
    C: No acercarse a ellos.
    D: Recogerlos usando guantes de goma.
  answer: C
  explanation: Si hay líneas eléctricas caídas con cables en la carretera en la escena
    de un choque, no se acerque a ellos.
- id: 575
  category: driver_responsibility
  question: ¿Cómo puede informar sobre un problema inmediato en las condiciones de
    la carretera, como el mal funcionamiento de un semáforo o escombros en la vía?
  choices:
    A: Llamar al 911 y pedir hablar con el departamento de bomberos.
    B: Contactar al Centro de Gestión de Transporte de DelDOT.
    C: Dejar una nota en la señal de alto (stop) más cercana.
    D: Esperar hasta renovar su licencia para informarlo.
  answer: B
  explanation: Si observa una condición en la carretera que deba atenderse de inmediato,
    debe contactar directamente al Centro de Gestión de Transporte de DelDOT.
- id: 576
  category: safe_driving_rules
  question: Según el manual, ¿cuál es la distancia mínima de seguimiento que debe
    mantener detrás de otro vehículo en condiciones normales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: B
  explanation: El manual establece que no debe seguir a menos de tres segundos detrás
    del vehículo que va delante. La regla de los cuatro segundos se aplica a la distancia
    de visibilidad, no a la distancia de seguimiento. (pág. 125)
- id: 577
  category: safe_driving_rules
  question: ¿Qué significan las siglas HOV en relación con el control de carriles?
  choices:
    A: Heavy Occupancy Vehicles (Vehículos de ocupación pesada)
    B: High Output Vehicles (Vehículos de alto rendimiento)
    C: High Occupancy Vehicles (Vehículos de alta ocupación)
    D: Highway Operating Vehicles (Vehículos de operación en carretera)
  answer: C
  explanation: El manual define HOV como Vehículos de Alta Ocupación (High Occupancy
    Vehicles).
- id: 578
