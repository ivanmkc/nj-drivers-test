  question: En situaciones de emergencia, ¿qué significan las siglas ENS?
  choices:
    A: Emergency Notification System (Sistema de Notificación de Emergencia)
    B: Emergency Navigation System (Sistema de Navegación de Emergencia)
    C: Essential Network System (Sistema de Red Esencial)
    D: Early Notification System (Sistema de Notificación Temprana)
  answer: A
  explanation: El manual se refiere al ENS como el Sistema de Notificación de Emergencia
