metadata:
  source: Delaware Driver Manual (Jul 2025) (dmv.de.gov)
  total_questions: 649
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_responsibility
  question: 'According to the Governor''s message in the Delaware driver''s manual,
    driving is considered:'
  choices:
    A: A constitutional right
    B: A privilege, not a right
    C: An absolute right for residents over 18
    D: A federal right
  answer: B
  explanation: 'The Governor''s message explicitly states: "Study it, take it seriously,
    and remember—driving is a privilege, not a right."'
- id: 2
  category: safe_driving_rules
  question: 'According to the manual, safe driving involves all of the following EXCEPT:'
  choices:
    A: Staying focused
    B: Avoiding distractions
    C: Following speed limits
    D: Relying solely on your driving skills
  answer: D
  explanation: The manual states that safe driving "isn’t just about passing a test—it’s
    about staying focused, avoiding distractions, following speed limits, and never
    driving under the influence." It notes that the best drivers understand respecting
    the road is just as important as navigating it.
- id: 3
  category: driver_responsibility
  question: 'To help protect the environment and ensure a greener Delaware, the manual
    suggests that drivers consider:'
  choices:
    A: Driving faster to reduce time on the road
    B: Carpooling, conserving trips, or using public transit
    C: Only driving on interstate highways
    D: Purchasing a larger vehicle
  answer: B
  explanation: The Governor's message advises drivers to "Consider carpooling, conserving
    trips, or using public transit to help protect our environment and ensure a greener
    Delaware for future generations."
- id: 4
  category: sharing_the_road
  question: 'The Delaware Division of Motor Vehicles encourages all motorists to share
    the roadways in a manner that is:'
  choices:
    A: Careful, courteous, sober, and defensive
    B: Aggressive but safe
    C: Fast and efficient
    D: Competitive and alert
  answer: A
  explanation: 'The DMV message states: "We encourage all motorists to share the roadways
    in a careful, courteous, sober, and defensive manner..."'
- id: 5
  category: license_system
  question: Where should corrections, suggestions, or recommendations regarding the
    driver's manual be addressed?
  choices:
    A: The Governor's Office
    B: The Secretary of Transportation
    C: Chief of Driver Services
    D: The Director of the Division of Motor Vehicles
  answer: C
  explanation: The manual notes that corrections, suggestions, or recommendations
    may be addressed to the "Chief of Driver Services, Delaware Division of Motor
    Vehicles, P.O. Box 698, Dover, DE 19903."
- id: 6
  category: license_system
  question: Which of the following is listed as a specific driver license classification
    in the Delaware manual's Table of Contents?
  choices:
    A: Class E Operator’s License
    B: Class D Operator’s License
    C: Class F Operator’s License
    D: Class Z Operator’s License
  answer: B
  explanation: The Table of Contents under "DRIVER LICENSE CLASSIFICATIONS" lists
    the "Class D Operator’s License."
- id: 7
  category: license_system
  question: According to the Table of Contents, which of the following registries
    is associated with driver license information?
  choices:
    A: Pet Ownership Registry
    B: Next Of Kin Registry
    C: National Firearms Registry
    D: State Property Registry
  answer: B
  explanation: The "Next Of Kin Registry" is listed in the Table of Contents under
    the ADDITIONAL INFORMATION section.
- id: 8
  category: license_system
  question: What specific indicator can be placed on a Delaware Driver License or
    Identification Card according to the manual's Table of Contents?
  choices:
    A: Income indicator
    B: Education indicator
    C: Veteran indicator
    D: Employment indicator
  answer: C
  explanation: The Table of Contents includes a section titled "Veteran indicator
    on Driver License/Identification Card" under ADDITIONAL INFORMATION.
- id: 9
  category: license_system
  question: Which law regarding sex offenders is specifically referenced in the Table
    of Contents?
  choices:
    A: Jessica's Law
    B: Megan’s Law
    C: Amber's Law
    D: The Adam Walsh Act
  answer: B
  explanation: The Table of Contents lists "Megan’s Law/Sex Offenders" under the ADDITIONAL
    INFORMATION section.
- id: 10
  category: license_system
  question: The manual contains information on the mandatory disclosure of which personal
    detail?
  choices:
    A: Social Security Numbers
    B: Bank Account Numbers
    C: Passport Numbers
    D: Medical History
  answer: A
  explanation: The Table of Contents lists "Mandatory Disclosure Of Social Security
    Numbers" in the ADDITIONAL INFORMATION section.
- id: 11
  category: license_system
  question: What does the acronym "CLP" stand for in the driver license classifications
    section?
  choices:
    A: Certified Licensed Professional
    B: Commercial Learner’s Permit
    C: Class License Permit
    D: Conditional Learner’s Program
  answer: B
  explanation: Under DRIVER LICENSE CLASSIFICATIONS, the Table of Contents lists "Commercial
    Learner’s Permit (CLP)."
- id: 12
  category: license_system
  question: Which of the following programs is listed in the Additional Information
    section of the manual?
  choices:
    A: Adopt-A-Highway Program
    B: Organ And Tissue Donor Program
    C: Safe Routes to School Program
    D: Cash for Clunkers Program
  answer: B
  explanation: The "Organ And Tissue Donor Program" is explicitly listed in the Table
    of Contents under the ADDITIONAL INFORMATION section.
- id: 13
  category: license_system
  question: According to the Table of Contents, applicants may find information regarding
    registration for which system?
  choices:
    A: Selective Service System
    B: State Militia System
    C: Federal Reserve System
    D: National Guard System
  answer: A
  explanation: The Table of Contents includes a section for "Selective Service System
    Registration" under ADDITIONAL INFORMATION.
- id: 14
  category: license_system
  question: Which specific card is mentioned as an option in the General Requirements
    section for individuals applying for driving privileges?
  choices:
    A: Driving Privilege Card
    B: Conditional Transit Card
    C: Restricted Mobility Card
    D: Provisional Travel Card
  answer: A
  explanation: The Table of Contents lists "Driving Privilege Card Requirements" and
    "How Do I Get A Driving Privilege Card?" under the GENERAL REQUIREMENTS section.
- id: 15
  category: driver_responsibility
  question: 'The Table of Contents lists a section on TAT, which stands for an initiative
    related to:'
  choices:
    A: Traffic Accident Tracking
    B: Tolls and Transit
    C: Human Trafficking
    D: Teen Alcohol Testing
  answer: C
  explanation: The Table of Contents lists "TAT- Human Trafficking" under the ADDITIONAL
    INFORMATION section.
- id: 16
  category: license_system
  question: Which of the following is classified as a specific endorsement on a Delaware
    driver's license?
  choices:
    A: Graduated Driver License
    B: Temporary License
    C: School Bus
    D: Class D Learner Permit
  answer: C
  explanation: According to the manual's endorsements section, a School Bus designation
    is classified as an endorsement, along with Motorcycle and Taxi/Limo.
- id: 17
  category: driver_testing
  question: The Delaware Driver Examination includes a Road Test, Rules of the Road
    Test, Highway Sign and Signal Test, and what other screening?
  choices:
    A: Hearing Screening
    B: Vision Screening
    C: Reflex Screening
    D: Medical Surrender Screening
  answer: B
  explanation: The Driver Examination section lists Vision Screening alongside the
    Highway Sign And Signal Test, Rules Of The Road Test, and Road Test.
- id: 18
  category: penalties_and_points
  question: Which of the following non-driving offenses is listed as a potential reason
    for the suspension of a driver license?
  choices:
    A: Noise violations
    B: Child Support Delinquency
    C: Truancy
    D: Littering
  answer: B
  explanation: Under the 'License Revocation and Suspension' section, 'Child Support
    Delinquency' is explicitly listed as a cause for action against a driver's license.
- id: 19
  category: penalties_and_points
  question: The Delaware Point System and Point Credit are administered under which
    program?
  choices:
    A: Driver Improvement Problem Driver Program
    B: Ignition Interlock Device Program
    C: Graduated Driver License Program
    D: Implied Consent Program
  answer: A
  explanation: The Delaware Point System and Point Credit are sub-sections of the
    Driver Improvement Problem Driver Program.
- id: 20
  category: alcohol_drugs_health
  question: According to the Impaired Driving section, which of the following is categorized
    alongside distracted and drunk driving as an impairment?
  choices:
    A: Aggressive Driving
    B: Drowsy Driving
    C: Serious Speeding
    D: Habitual Offending
  answer: B
  explanation: '''Drowsy Driving'' and ''Distracted Driving'' are specifically listed
    under the ''Impaired Driving'' section of the manual.'
- id: 21
  category: alcohol_drugs_health
  question: Delaware law outlines specific penalties and procedures for Driving Under
    The Influence (DUI) up to which offense?
  choices:
    A: Third Offense
    B: Fourth Offense
    C: Fifth Offense
    D: Seventh Offense
  answer: D
  explanation: The manual outlines specific DUI penalties for sequential offenses,
    up to the 'Seventh Offense'.
- id: 22
  category: alcohol_drugs_health
  question: What program is available for a First Offense Election (FOE) regarding
    a DUI?
  choices:
    A: Point Credit Program
    B: Ignition Interlock Device (IID) Program
    C: Habitual Offender Program
    D: Medical Surrender Program
  answer: B
  explanation: The manual lists the 'Ignition Interlock Device (IID) Program for First
    Offense Election (FOE)' under DUI penalties.
- id: 23
  category: alcohol_drugs_health
  question: Which law is specifically listed under Delaware Drinking and Driving Laws
    alongside the Implied Consent Law?
  choices:
    A: Zero Tolerance Law
    B: Point System Law
    C: Aggressive Driving Law
    D: Mandatory Revocation Law
  answer: A
  explanation: The 'Zero Tolerance Law' is listed directly under the Delaware Drinking
    and Driving Laws section, along with the Implied Consent Law.
- id: 24
  category: vehicle_information
  question: Section Three of the manual categorizes motor vehicle equipment into which
    three main groups?
  choices:
    A: Required, Additional, and Prohibited Equipment
    B: Standard, Luxury, and Optional Equipment
    C: Interior, Exterior, and Engine Equipment
    D: Safety, Cosmetic, and Performance Equipment
  answer: A
  explanation: The Motor Vehicle Equipment section is divided into 'Required Equipment,'
    'Additional Equipment,' and 'Prohibited Equipment.'
- id: 25
  category: driver_responsibility
  question: How does the Delaware driver's manual address medical conditions that
    may affect driving?
  choices:
    A: It requires drivers to wait for a doctor's report
    B: It includes a policy for Self-Reporting of Medical Conditions
    C: It states medical conditions are exempt from reporting
    D: It only requires reporting for commercial drivers
  answer: B
  explanation: The Medical Information and Reporting section includes a specific subsection
    for the 'Self-Reporting Of Medical Conditions.'
- id: 26
  category: penalties_and_points
  question: Which of the following driving behaviors is specifically addressed with
    its own subsection under the Driver Improvement Problem Driver Program?
  choices:
    A: Tailgating
    B: Aggressive Driving
    C: Failure to Yield
    D: Improper Passing
  answer: B
  explanation: '''Aggressive Driving'' is explicitly listed as a topic under the Driver
    Improvement Problem Driver Program.'
- id: 27
  category: driver_testing
  question: During the Road Test portion of the Driver Examination, what is explicitly
    required according to the manual's headings?
  choices:
    A: A Motor Vehicle To Be Driven During Road Test
    B: A dual-control instructional vehicle
    C: A certified driving instructor
    D: A vehicle less than 5 years old
  answer: A
  explanation: The manual includes a specific section titled 'Motor Vehicle To Be
    Driven During Road Test' under the Driver Examination requirements.
- id: 28
  category: penalties_and_points
  question: What type of revocation is listed for drivers who repeatedly commit serious
    traffic offenses?
  choices:
    A: Point Credit Revocation
    B: Habitual Offender Revocation
    C: Zero Tolerance Revocation
    D: Implied Consent Revocation
  answer: B
  explanation: '''Habitual Offender Revocation'' is listed under the License Revocation
    and Suspension section for repeat offenders.'
- id: 29
  category: license_system
  question: If a driver's license is suspended, what type of license might they be
    eligible for according to the manual?
  choices:
    A: Class D License
    B: Occupational License
    C: Taxi/Limo Endorsement
    D: Temporary Learner Permit
  answer: B
  explanation: The manual lists 'Occupational License' under the Driver Improvement
    Problem Driver Program, which is typically used for driving during suspension.
    It is also listed under 'Conditional, Occupational, And Hardship Licenses'.
- id: 30
  category: vehicle_information
  question: Which of the following safety practices is specifically covered under
    the Motor Vehicle Equipment section?
  choices:
    A: Using Safety Belts And Child Restraints
    B: Adjusting mirrors before driving
    C: Checking tire pressure monthly
    D: Using turn signals
  answer: A
  explanation: '''Using Safety Belts And Child Restraints'' is explicitly listed as
    a topic under the Motor Vehicle Equipment section.'
- id: 31
  category: safe_driving_rules
  question: Under Delaware's Move Over Law, what must a driver do when approaching
    a stationary emergency vehicle with its lights flashing?
  choices:
    A: Maintain speed and stay in the current lane
    B: Stop immediately until the emergency vehicle leaves
    C: Yield the right-of-way by changing to a lane not adjacent to the vehicle, or
      reduce speed to a safe level if changing lanes is unsafe
    D: Sound the horn to alert the emergency workers of your presence
  answer: C
  explanation: The Move Over Law requires drivers approaching stationary emergency
    vehicles with flashing lights to move over to a non-adjacent lane if possible,
    or significantly reduce speed if a lane change cannot be made safely.
- id: 32
  category: safe_driving_rules
  question: What is the restriction regarding cell phone use while driving in Delaware?
  choices:
    A: Drivers may use hand-held phones only when stopped at a red light
    B: The use of hand-held cell phones and electronic devices while driving is strictly
      prohibited
    C: Drivers may text but cannot make voice calls
    D: Only drivers under 18 are prohibited from using hand-held cell phones
  answer: B
  explanation: Delaware law prohibits the use of hand-held cell phones and other hand-held
    electronic devices while operating a motor vehicle.
- id: 33
  category: safe_driving_rules
  question: When are you required to stop for a school bus with its red lights flashing?
  choices:
    A: Only when you are traveling in the same direction as the bus
    B: Only if children are actively crossing the street
    C: When approaching from either direction on a two-lane road, or from the same
      direction on a multi-lane road
    D: You are never required to stop, but you must slow down to 15 mph
  answer: C
  explanation: Drivers must stop for a school bus with flashing red lights when traveling
    in the same direction, or from either direction on a two-lane road. You do not
    have to stop if traveling in the opposite direction on a highway with four or
    more lanes.
- id: 34
  category: safe_driving_rules
  question: Unless otherwise posted, what is the standard speed limit in a residential
    district in Delaware?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: The general speed limit in a residential or business district in Delaware
    is 25 mph unless otherwise posted.
- id: 35
  category: sharing_the_road
  question: Who has the right-of-way in a roundabout?
  choices:
    A: Vehicles entering the roundabout
    B: Vehicles already circulating within the roundabout
    C: Larger vehicles such as trucks and buses
    D: Vehicles approaching from the right
  answer: B
  explanation: When approaching a roundabout, drivers must yield the right-of-way
    to traffic already circulating inside the roundabout.
- id: 36
  category: safe_driving_rules
  question: What is the purpose of a shared center lane?
  choices:
    A: It is used for passing slower vehicles
    B: It is a designated lane for emergency vehicles only
    C: It is reserved for making left turns by vehicles traveling in either direction
    D: It is used as a parking lane during non-peak hours
  answer: C
  explanation: A shared center lane is reserved for vehicles making left turns from
    either direction. It cannot be used for passing or as a regular driving lane.
- id: 37
  category: sharing_the_road
  question: 'When passing a bicyclist traveling in the same direction, Delaware law
    requires you to leave a minimum clearance of:'
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 5 feet
  answer: C
  explanation: Drivers must leave a minimum of 3 feet of clearance when passing a
    bicyclist to ensure their safety.
- id: 38
  category: signs_and_signals
  question: What does a solid red light on a High Intensity Activated Crosswalk (HAWK)
    signal indicate?
  choices:
    A: Proceed with caution
    B: Stop and remain stopped until the light changes
    C: Yield to pedestrians, then proceed without stopping
    D: The crosswalk is out of order
  answer: B
  explanation: A solid red light on a HAWK signal requires drivers to stop and remain
    stopped while pedestrians cross.
- id: 39
  category: safe_driving_rules
  question: 'Under Delaware''s general speed restriction (basic speed law), you must:'
  choices:
    A: Always drive at the exact posted speed limit
    B: Never drive faster than is safe for current weather, traffic, and road conditions
    C: Drive 5 mph below the speed limit at night
    D: Keep up with the flow of traffic regardless of the speed limit
  answer: B
  explanation: The general speed restriction states that you must never drive faster
    than is reasonable and safe for current conditions, regardless of the posted speed
    limit.
- id: 40
  category: safe_driving_rules
  question: When is it legal to pass another vehicle on the right?
  choices:
    A: When the vehicle ahead is making a left turn and there is sufficient pavement
      to pass safely
    B: When you are driving on a single-lane dirt road
    C: When the vehicle ahead is driving below the speed limit
    D: It is never legal to pass on the right
  answer: A
  explanation: Passing on the right is permitted when the vehicle you are overtaking
    is making or about to make a left turn, provided there is enough pavement to do
    so safely without driving off the road.
- id: 41
  category: sharing_the_road
  question: Why is it important to increase your following distance when driving behind
    a motorcycle?
  choices:
    A: Motorcycles are required to drive slower than cars
    B: Motorcycles can stop much more quickly than larger vehicles and may change
      lane position to avoid hazards
    C: Motorcycles have brighter brake lights that can cause glare
    D: Motorcycles are not subject to standard traffic laws
  answer: B
  explanation: Motorcycles can stop faster than cars and may suddenly change speed
    or lane position to avoid potholes or debris. A greater following distance gives
    you more time to react.
- id: 42
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: Delaware parking rules prohibit stopping or parking a vehicle within
    15 feet of a fire hydrant.
- id: 43
  category: signs_and_signals
  question: When approaching a work zone, what does a flashing arrow panel pointing
    to the left indicate?
  choices:
    A: Traffic must stop and wait for a flagger
    B: The left lane is closed ahead
    C: Merge into the left lane because the current lane is closed ahead
    D: A detour is starting to the right
  answer: C
  explanation: A flashing arrow panel in a work zone directs traffic to merge in the
    direction the arrow is pointing because the current lane is closed ahead.
- id: 44
  category: sharing_the_road
  question: When do pedestrians have the right-of-way at a crosswalk?
  choices:
    A: Only when the crosswalk is marked with white lines
    B: Only at intersections with traffic lights
    C: When they are already in the crosswalk or stepping into it
    D: Pedestrians must always yield to motor vehicles
  answer: C
  explanation: Drivers must yield the right-of-way to pedestrians who are already
    in a crosswalk or who are stepping into it, whether the crosswalk is marked or
    unmarked.
- id: 45
  category: safe_driving_rules
  question: Who is required to wear a safety belt in a moving vehicle in Delaware?
  choices:
    A: Only the driver and front-seat passengers
    B: Only passengers under the age of 18
    C: All occupants in the vehicle, regardless of age or seating position
    D: Only the driver
  answer: C
  explanation: Delaware law requires all occupants of a motor vehicle to be properly
    restrained by a safety belt or appropriate child restraint system.
- id: 46
  category: sharing_the_road
  question: According to the manual, which of the following is explicitly listed as
    a vehicle type you must share the road with?
  choices:
    A: Bicycles
    B: Motorcycles
    C: Electric Scooters
    D: Hoverboards
  answer: B
  explanation: The manual specifically includes a section titled 'Sharing The Road
    With Motorcycles.' Bicycles and scooters are not mentioned in this specific text
    excerpt.
- id: 47
  category: safe_driving_rules
  question: Which of the following is listed as a necessary step in the 'Before You
    Drive' section?
  choices:
    A: Check the tire pressure
    B: Fill the gas tank
    C: Clean glass surfaces
    D: Test the brakes
  answer: C
  explanation: '''Clean Glass Surfaces'' is explicitly listed as a topic to address
    under the ''BEFORE YOU DRIVE'' section.'
- id: 48
  category: driver_responsibility
  question: The manual includes a section on an individual's constitutional and legal
    rights during what specific event?
  choices:
    A: A traffic stop
    B: A vehicle registration
    C: A driving test
    D: A collision
  answer: A
  explanation: The text includes sections detailing an individual's constitutional
    and legal rights, as well as law-enforcement procedures, 'during a traffic stop.'
- id: 49
  category: vehicle_information
  question: Which of the following is categorized under 'Basic Driving' skills in
    Section Five?
  choices:
    A: Changing a tire
    B: Parallel parking
    C: Steering
    D: Merging
  answer: C
  explanation: '''Steering'' is explicitly listed as one of the fundamental topics
    under the ''BASIC DRIVING'' heading.'
- id: 50
  category: defensive_driving
  question: According to the manual, communicating with other drivers involves which
    two main actions?
  choices:
    A: Honking your horn and using turn signals
    B: Letting others know you are there and letting others know what you are doing
    C: Making eye contact and waving
    D: Flashing your headlights and braking
  answer: B
  explanation: Under the 'COMMUNICATING' section, the two sub-topics listed are 'Let
    Others Know You Are There' and 'Let Others Know What You Are Doing.'
- id: 51
  category: safe_driving_rules
  question: When adjusting your speed, the manual specifies that you should adjust
    to which of the following?
  choices:
    A: The speed limit and the weather
    B: Time of day and visibility
    C: Your vehicle's capabilities and the load
    D: Road conditions and traffic
  answer: D
  explanation: The 'ADJUSTING SPEED' section specifically lists 'Adjusting To Road
    Conditions' and 'Adjusting To Traffic' as the primary factors.
- id: 52
  category: defensive_driving
  question: Which specific rule is mentioned in the manual regarding how well you
    can see?
  choices:
    A: The Two-Second Rule
    B: The Sight Distance Rule
    C: The Three-Second Rule
    D: The Following Distance Rule
  answer: B
  explanation: The 'Sight Distance Rule' is explicitly listed under the 'HOW WELL
    CAN YOU SEE?' section.
- id: 53
  category: defensive_driving
  question: The manual lists several factors that affect how well you can see. Which
    of the following is NOT one of the factors explicitly listed in this section?
  choices:
    A: Darkness
    B: Rain, Fog, Or Snow
    C: Sun glare
    D: Hills And Curves
  answer: C
  explanation: The section 'HOW WELL CAN YOU SEE?' lists Darkness, Rain/Fog/Snow,
    Hills And Curves, Parked Vehicles, Sight Distance Rule, and Speed Limits. Sun
    glare is not listed in this excerpt.
- id: 54
  category: defensive_driving
  question: In the 'Sharing Space' section, which of the following is a specific situation
    covered for managing space?
  choices:
    A: Space to park
    B: Space to merge
    C: Space to turn
    D: Space to reverse
  answer: B
  explanation: '''Space To Merge'' is explicitly listed as a sub-topic under ''SHARING
    SPACE,'' along with space ahead, behind, to the side, to cross or enter, and to
    pass.'
- id: 55
  category: alcohol_drugs_health
  question: According to the 'Be In Shape To Drive' section, which physical senses
    or conditions are specifically addressed?
  choices:
    A: Vision, Hearing, and Fatigue
    B: Reflexes, Vision, and Age
    C: Hearing, Flexibility, and Illness
    D: Fatigue, Stress, and Emotion
  answer: A
  explanation: The 'BE IN SHAPE TO DRIVE' section lists 'Vision,' 'Hearing,' and 'Fatigue'
    as key topics before discussing Drinking And Driving.
- id: 56
  category: sharing_the_road
  question: Which type of vehicle has a specific section detailing 'Backing Crashes'
    and 'Reporting a Commercial Safety Violation'?
  choices:
    A: Motorcycles
    B: Mopeds
    C: Trucks
    D: Farm Tractors
  answer: C
  explanation: '''Backing Crashes'' and ''Reporting a Commercial Safety Violation''
    are listed immediately following ''Sharing The Road With A Truck.'''
- id: 57
  category: driver_responsibility
  question: What must a driver do regarding their load before driving, according to
    Section Five?
  choices:
    A: Weigh the load
    B: Secure the load
    C: Cover the load with a tarp
    D: Distribute the load evenly
  answer: B
  explanation: '''Secure Your Load'' is listed as a required step under the ''BEFORE
    YOU DRIVE'' section.'
- id: 58
  category: driver_responsibility
  question: The manual provides information on how and where to file a compliment
    or complaint against whom?
  choices:
    A: A driving instructor
    B: A commercial truck driver
    C: A law-enforcement officer
    D: A DMV official
  answer: C
  explanation: The text includes a section titled 'How and where to file a compliment
    on behalf of or a complaint against a law-enforcement officer.'
- id: 59
  category: sharing_the_road
  question: Along with Farm Tractors and Road Machinery, what other type of equipment
    is grouped in its specific sharing the road section?
  choices:
    A: Landscaping Equipment
    B: Construction Equipment
    C: Mining Equipment
    D: Towing Equipment
  answer: B
  explanation: The manual lists a section titled 'Farm Tractors And Equipment, Road
    Machinery, and Construction Equipment.'
- id: 60
  category: safe_driving_rules
  question: Under the 'Basic Driving' section, which of the following actions is listed
    alongside Starting, Accelerating, and Steering?
  choices:
    A: Yielding
    B: Parking
    C: Stopping
    D: Reversing
  answer: C
  explanation: '''Stopping'' is explicitly listed as a topic under the ''BASIC DRIVING''
    section, along with Starting, Accelerating, Steering, Speeding, Braking, Seeing
    Well, Scanning, and Using Your Lights.'
- id: 61
  category: driver_responsibility
  question: If a conflict exists between the Delaware driver's manual and state or
    federal law, which takes precedence?
  choices:
    A: The driver's manual
    B: The actual code or legislation
    C: Local county ordinances
    D: The police officer's discretion
  answer: B
  explanation: According to the manual, if a conflict exists, then the actual code
    or legislation will always take precedence.
- id: 62
  category: license_system
  question: If you want an endorsement to drive a motorcycle, which manual should
    you read?
  choices:
    A: The Commercial Driver Manual
    B: The Delaware Driver's Manual
    C: The Motorcycle Operator Manual
    D: The Highway Safety Manual
  answer: C
  explanation: The manual states that if you want an endorsement to drive a motorcycle,
    you should read the Motorcycle Operator Manual.
- id: 63
  category: driver_testing
  question: How can a person with a disability request an audio test or special accommodation
    for their knowledge exam?
  choices:
    A: By asking the examiner on the day of the test
    B: By calling and making an appointment prior to coming to a DMV site
    C: By submitting a written request by mail 30 days in advance
    D: By completing the exam online instead
  answer: B
  explanation: If you have a disability and need a special accommodation in order
    to take an exam, you must call and make an appointment prior to coming to a DMV
    site. Audio tests are available upon request.
- id: 64
  category: vehicle_information
  question: Under Delaware definitions, an electric motor bicycle must have a maximum
    speed of less than what amount on a paved level surface?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: The term bicycle includes a vehicle with an electric motor of less
    than 750 watts whose maximum speed on a paved level surface is less than 20 mph.
- id: 65
  category: sharing_the_road
  question: What is the purpose of a 'Bike Box' at an intersection?
  choices:
    A: To provide a parking space for bicycles
    B: To store bicycles that have been impounded
    C: To provide bicyclists with a safe way to turn and a visible way to get ahead
      of traffic
    D: To warn drivers of an upcoming bicycle lane
  answer: C
  explanation: A 'Bike Box' is a designated area at the head of a traffic lane at
    intersections that provides bicyclists with a safe way to turn and a visible way
    to get ahead of traffic.
- id: 66
  category: penalties_and_points
  question: In the context of motor vehicle laws, which of the following is included
    in the definition of being 'Convicted'?
  choices:
    A: Receiving a written warning from a police officer
    B: Being involved in a crash
    C: Forfeiture of a bail bond or a plea of guilty
    D: Failing the driving skills test
  answer: C
  explanation: '''Convicted'' means having been found guilty in a court of law of
    a violation of the motor vehicle laws, forfeiture of bail bond, or a plea of guilty.'
- id: 67
  category: vehicle_information
  question: For Delaware licensing purposes, a vehicle is considered a Commercial
    Motor Vehicle (CMV) if it is designed to carry how many occupants (including the
    driver)?
  choices:
    A: 8 or more
    B: 10 or more
    C: 12 or more
    D: 16 or more
  answer: D
  explanation: A Commercial Motor Vehicle (CMV) includes a vehicle designed to carry
    16 or more occupants (including the driver).
- id: 68
  category: vehicle_information
  question: A pickup truck, cargo van, passenger van, or bus is classified as a 'Commercial
    Vehicle' if it is over what weight?
  choices:
    A: 5,000 pounds
    B: 10,000 pounds
    C: 15,000 pounds
    D: 26,000 pounds
  answer: A
  explanation: '''Commercial Vehicle'' means a vehicle classified as a pickup truck/cargo
    van/passenger van/bus (over 5,000 pounds).'
- id: 69
  category: safe_driving_rules
  question: What defines a 'Divided Highway'?
  choices:
    A: A highway with at least four lanes of traffic
    B: A highway divided into two or more roadways by an intervening space, physical
      barrier, or dividing section
    C: A highway that crosses state borders
    D: A road that is shared by both motor vehicles and trains
  answer: B
  explanation: '''Divided Highway'' means any highway divided into two or more roadways
    by an intervening space, physical barrier, or clearly indicated dividing section
    so constructed as to impede vehicular traffic.'
- id: 70
  category: license_system
  question: Which of the following is true regarding a Driving Privilege Card (DPC)?
  choices:
    A: It can be used to purchase firearms
    B: It is a valid form of identification for federal purposes
    C: It is issued for driving purposes only and is not to be used as a valid form
      of identification
    D: It allows the holder to drive commercial motor vehicles
  answer: C
  explanation: A DPC (Driving Privilege Card) is a valid driver license that is issued
    for driving purposes only and is not to be used as a valid form of identification.
- id: 71
  category: driver_responsibility
  question: According to the manual, who is considered a 'Driver'?
  choices:
    A: Only someone who holds a valid driver's license
    B: Anyone who is in actual physical control of a motor vehicle
    C: The registered owner of the vehicle
    D: Anyone sitting in the front seat of a vehicle
  answer: B
  explanation: '''Driver'' includes anyone who is in actual physical control of a
    motor vehicle.'
- id: 72
  category: license_system
  question: What are the common names for the Driver Education Certificate presented
    to students who successfully complete an approved course?
  choices:
    A: The 'Green Certificate' or 'Gold Certificate'
    B: The 'Blue Certificate' or 'White Certificate'
    C: The 'Red Certificate' or 'Silver Certificate'
    D: The 'Yellow Certificate' or 'Black Certificate'
  answer: B
  explanation: The Driver Education Certificate is commonly referred to as the 'Blue
    Certificate' or 'White Certificate'.
- id: 73
  category: safe_driving_rules
  question: What is an 'Express Highway'?
  choices:
    A: A toll road that requires an electronic pass
    B: A road owned by private individuals or institutions
    C: A State or Interstate highway especially designed for through traffic
    D: A highway with a speed limit over 70 mph
  answer: C
  explanation: '''Express Highway'' means a State or Interstate highway especially
    designed for through traffic.'
- id: 74
  category: license_system
  question: A Graduated Driver License (GDL) is a restricted permit issued to a person
    who has completed an approved driver education course and is within which age
    group (assuming no IEP)?
  choices:
    A: At least age 15 or under age 17
    B: At least age 16 or under age 18
    C: At least age 17 or under age 21
    D: At least age 18 or under age 25
  answer: B
  explanation: GDL means Graduated Driver License which is a restricted permit issued
    to any person who is at least age 16 or under age 18 (or under 22 with an active
    IEP).
- id: 75
  category: safe_driving_rules
  question: Does the definition of a 'Highway' include roads owned by private individuals
    or institutions?
  choices:
    A: Yes, all roads are considered highways
    B: Yes, if they are paved
    C: No, it only includes roads open to public vehicular traffic
    D: No, it only includes Interstate highways
  answer: C
  explanation: '''Highway'' means the entire width between boundary lines of every
    road open to public vehicular traffic, but does not include roads owned by private
    individuals or by institutions.'
- id: 76
  category: vehicle_information
  question: According to the manual, which of the following characteristics defines
    a 'Minibike'?
  choices:
    A: An engine of more than 55 cubic centimeters
    B: A seat less than 25 inches above the ground
    C: A wheel rim size of exactly 12 inches
    D: A length of more than 50 inches from hub to hub
  answer: B
  explanation: The manual defines a 'Minibike' as a motor-driven cycle with a wheel
    rim size less than 10 inches, less than 40 inches long, an engine less than 45
    cc, or a seat less than 25 inches above the ground.
- id: 77
  category: safe_driving_rules
  question: In the driver's manual, what is the difference between the terms 'Must'
    and 'Should'?
  choices:
    A: '''Must'' is a recommended action, while ''Should'' is required by law.'
    B: '''Must'' means an action required by law, while ''Should'' is a recommended
      action.'
    C: Both terms mean an action is required by law.
    D: Both terms mean an action is only recommended.
  answer: B
  explanation: According to the manual, 'Must' means an action or practice required
    by law, whereas 'Should' means a recommended action or practice not required by
    law.
- id: 78
  category: license_system
  question: What does the acronym 'NDR' stand for in the context of driver licensing?
  choices:
    A: National Driver Register
    B: Nationwide Driving Record
    C: National Department of Roads
    D: New Driver Registry
  answer: A
  explanation: The manual states that 'NDR' means National Driver Register, which
    is a computerized database of information about drivers who have had their licenses
    suspended or revoked.
- id: 79
  category: safe_driving_rules
  question: How is a 'Roadway' defined in the driver's manual?
  choices:
    A: The entire width between boundary lines of every road open to public traffic.
    B: The portion of the highway used for vehicular traffic, excluding the shoulder.
    C: An area officially set aside for exclusive use of pedestrians.
    D: A highway in a city or a suburban district.
  answer: B
  explanation: The manual defines 'Roadway' as that portion of the highway improved,
    designed, or ordinarily used for vehicular traffic, excluding the shoulder.
- id: 80
  category: sharing_the_road
  question: What is another name for a 'Two-Way Cycle Track'?
  choices:
    A: Shared-use path
    B: Protected bike lane
    C: Pedestrian safety zone
    D: Highway shoulder
  answer: B
  explanation: The manual states that a 'Two-Way Cycle Track' is also known as protected
    bike lanes, separated bikeways, and on-street bike paths.
- id: 81
  category: penalties_and_points
  question: What is the base penalty fee for an Uninsured Motorist in Delaware?
  choices:
    A: $50.00
    B: $100.00
    C: $200.00
    D: $25.00
  answer: B
  explanation: The Motor Vehicle Fees section lists the Uninsured Motorist Penalty
    fee as $100.00 (plus $5.00 per day after the 31st day from the mailing date of
    notice).
- id: 82
  category: penalties_and_points
  question: How much is the fee to reinstate a revoked driver's license?
  choices:
    A: $25.00
    B: $40.00
    C: $50.00
    D: $200.00
  answer: D
  explanation: According to the fee schedule, the DL Revocation Reinstatement fee
    is $200.00.
- id: 83
  category: license_system
  question: What is the fee for an 8-year Class D Driver License?
  choices:
    A: $20.00
    B: $24.00
    C: $40.00
    D: $48.00
  answer: C
  explanation: The fee schedule lists the Driver License Class D 8yr fee as $40.00.
- id: 84
  category: vehicle_information
  question: How much does the DMV charge for the issuance or renewal of a Handicap
    Placard?
  choices:
    A: $5.00
    B: $10.00
    C: $20.00
    D: No Charge
  answer: D
  explanation: The Motor Vehicle Fees section states that there is 'No Charge' for
    a Handicap Placard.
- id: 85
  category: penalties_and_points
  question: What happens if you present an uncollectible check to the DMV and fail
    to pay the original amount plus the $25 penalty fee within 10 days?
  choices:
    A: You will be charged an additional $5 per day.
    B: Your driver's license and/or registration will be suspended.
    C: Your vehicle will be impounded.
    D: You will be required to retake the driving test.
  answer: B
  explanation: The notes section specifies that if the original amount plus the $25.00
    penalty fee for an uncollectible check is not paid within 10 days, your driver's
    license and/or registration will be suspended.
- id: 86
  category: license_system
  question: Under what condition will the DMV waive late fees for active duty military
    members renewing past their expiration date?
  choices:
    A: If they have a clean driving record for the past 5 years.
    B: If they provide proof they were deployed or stationed outside Delaware at the
      time of expiration.
    C: If they pay for an 8-year renewal instead of a 4-year renewal.
    D: If they complete an approved defensive driving course.
  answer: B
  explanation: The DMV will not charge late fees for active duty military members
    if they can provide proof that they were deployed or stationed outside of the
    State of Delaware at the time of expiration.
- id: 87
  category: vehicle_information
  question: If you paid a sales or transfer tax on a vehicle purchase in another state,
    within how many days prior to registering the vehicle in Delaware must the purchase
    have occurred to receive a tax credit?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: Delaware law allows a credit on a sales tax or similar levy paid to
    another state on the purchase of a vehicle within 90 days prior to registering
    the vehicle in Delaware.
- id: 88
  category: vehicle_information
  question: According to the manual, an electric motor on a 'Moped' must be rated
    between which wattages?
  choices:
    A: 250 watts and 500 watts
    B: 500 watts and 750 watts
    C: 751 watts and 2,000 watts
    D: 2,001 watts and 3,000 watts
  answer: C
  explanation: The manual defines a 'Moped' as having an internal combustion motor
    less than 55 cc, or an electric motor rated between 751 watts and 2,000 watts.
- id: 89
  category: penalties_and_points
  question: What is the maximum fee the Delaware Division of Motor Vehicles can charge
    for a returned payment, such as a bounced check?
  choices:
    A: $15.00
    B: $20.00
    C: $25.00
    D: $30.00
  answer: C
  explanation: Delaware law allows the Division to charge a reasonable fee not to
    exceed $25.00 to any person presenting a payment that is returned as uncollectible.
- id: 90
  category: penalties_and_points
  question: If you receive a certified letter regarding an uncollectible payment to
    the DMV, how many days do you have to furnish payment before your license or registration
    is suspended?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: The Division allows 10 days to furnish payment after mailing the notification.
    If not received within 10 days, the Division shall forthwith suspend the individual's
    driver license or vehicle registration.
- id: 91
  category: vehicle_information
  question: According to the Delaware DMV fee schedule, what is the cost for a vehicle
    Title with a Lien?
  choices:
    A: $35.00
    B: $50.00
    C: $55.00
    D: $25.00
  answer: C
  explanation: The fee schedule lists the cost of a Title (with Lien) as $55.00.
- id: 92
  category: vehicle_information
  question: How is the standard vehicle document fee calculated in Delaware?
  choices:
    A: 3.75% of the purchase price or NADA book value, whichever is greater
    B: 4.25% of the purchase price or NADA book value, whichever is greater
    C: A flat fee of $8.00 for all vehicles
    D: 5.00% of the purchase price only
  answer: B
  explanation: The document fee is calculated as 4.25% of the purchase price or NADA
    book value, whichever is greater (with a minimum of $8.00). Mobile homes are calculated
    at 3.75%.
- id: 93
  category: license_system
  question: How can you visually distinguish a federally compliant Delaware driver
    license from a non-compliant one?
  choices:
    A: It has a silver star in the lower left-hand corner
    B: It has a gold star in the upper right-hand corner
    C: It is printed in a vertical format
    D: It has 'Federal ID' printed in red ink
  answer: B
  explanation: A compliant DL/ID is distinguishable by the gold star in the upper
    right-hand corner of the DL/ID.
- id: 94
  category: license_system
  question: What phrase is printed in the upper margin of a non-compliant Delaware
    driver license or identification card?
  choices:
    A: '"Not for Federal ID"'
    B: '"State Use Only"'
    C: '"Driving Privilege Only"'
    D: '"Non-Compliant Card"'
  answer: A
  explanation: A non-compliant card is distinguishable by the phrase "Not for Federal
    ID" printed in the upper margin of the DL/ID.
- id: 95
  category: license_system
  question: What is the replacement fee assessed if you choose to convert your non-compliant
    license to a federally compliant status?
  choices:
    A: $10.00
    B: $15.00
    C: $20.00
    D: $25.00
  answer: C
  explanation: To convert your license, visit any local DMV and provide the required
    documents. There will be a $20.00 replacement license fee assessed.
- id: 96
  category: license_system
  question: How long do you have to obtain a Delaware driver license after becoming
    a bona fide Delaware resident?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: You are required to obtain a Delaware driver license within 60 days
    after becoming a bona fide Delaware resident.
- id: 97
  category: license_system
  question: Which of the following individuals is exempt from holding a Delaware driver
    license while driving on the highway?
  choices:
    A: A new resident who moved to Delaware 90 days ago
    B: A person operating a farm tractor temporarily on a highway
    C: A 15-year-old non-resident with a learner's permit from their home state
    D: A foreign tourist with an expired international driving permit
  answer: B
  explanation: Individuals are exempt while driving or operating a road roller, road
    machinery, or farm tractor or implement of husbandry temporarily on a highway.
- id: 98
  category: driver_testing
  question: 'The Division of Motor Vehicles will NOT issue a driver license to an
    applicant under the age of 18 if they:'
  choices:
    A: Do not own their own vehicle
    B: Have not completed a Delaware Department of Education approved driver education
      course
    C: Have not held a learner's permit for at least two years
    D: Are applying for a federally compliant license
  answer: B
  explanation: The law does not permit issuing a license if you are under the age
    of 18 and have not completed a Delaware Department of Education approved course
    in driver education.
- id: 99
  category: license_system
  question: 'According to Delaware law, you may be denied a driver license if you:'
  choices:
    A: Do not understand road signs in English
    B: Are over the age of 75
    C: Wear prescription glasses
    D: Have a non-compliant identification card
  answer: A
  explanation: The law does not permit the Division of Motor Vehicles to issue a driver
    license when you do not understand road signs in English.
- id: 100
  category: alcohol_drugs_health
  question: If you are subject to loss of consciousness from diseases of the central
    nervous system, what must you provide to obtain a license?
  choices:
    A: A waiver from a judge
    B: A written certification by your licensed practitioner that the disability is
      under sufficient control
    C: Proof of medical insurance
    D: A specialized driving test certificate
  answer: B
  explanation: You must furnish the division with a written certification by your
    licensed practitioner that such person's physical disability is under sufficient
    control to permit you to drive a motor vehicle safely.
- id: 101
  category: license_system
  question: In which of the following Delaware cities can you apply in person for
    a driver license?
  choices:
    A: Newark
    B: Rehoboth Beach
    C: Georgetown
    D: Smyrna
  answer: C
  explanation: You must apply in person at the Division of Motor Vehicles (Division)
    in Delaware City, Dover, Georgetown or Wilmington.
- id: 102
  category: license_system
  question: Why is an applicant with an A-1 immigration status (Ambassador) ineligible
    for a Delaware-issued driver license?
  choices:
    A: They are exempt from all traffic laws
    B: They may only be issued a driver's license from the United States State Department
    C: They are not required to hold any form of driver license
    D: They must obtain an international driving permit instead
  answer: B
  explanation: Immigration status A-1 applicants are ineligible because an "A" status
    may only be issued a driver's license from the United States State Department.
- id: 103
  category: license_system
  question: Which of the following immigration statuses is considered ineligible for
    a Delaware-issued driver license or identification card?
  choices:
    A: B-2 Visitor for pleasure (tourist)
    B: Permanent Resident
    C: Asylee
    D: Refugee
  answer: A
  explanation: Those legally in the United States under immigration status B-2 (Visitor
    for pleasure/tourist) are not eligible for a Delaware-issued driver license or
    identification card.
- id: 104
  category: license_system
  question: What is the expiration period for a driver's license issued to a U.S.
    Citizen or Permanent Resident Immigrant?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: According to the manual, U.S. Citizens and Permanent Resident Immigrants
    receive an 8-year Driver License and ID card.
- id: 105
  category: license_system
  question: If a non-immigrant's immigration records show an 'indefinite' period of
    authorized stay, what expiration date will be used for their driver's license?
  choices:
    A: 6 months
    B: 1 year
    C: 4 years
    D: 8 years
  answer: B
  explanation: A one-year expiration date will be used when immigration records show
    'indefinite' or 'duration of status' for the period of authorized stay.
- id: 106
  category: driver_testing
  question: What mandatory medical screening must every driver pass when applying
    for a license?
  choices:
    A: A hearing test
    B: A blood pressure check
    C: An eye-screening examination
    D: A reflex evaluation
  answer: C
  explanation: The manual states that each driver must pass an eye-screening examination.
- id: 107
  category: license_system
  question: What must applicants do if they already have a driver's license or ID
    card from another state?
  choices:
    A: Keep it as a secondary form of ID
    B: Surrender their license and/or ID card from the other state
    C: Pay a dual-licensing fee
    D: Destroy it themselves after 30 days
  answer: B
  explanation: Applicants who are licensed or have an identification (ID) card in
    another state must surrender their license and/or ID card from the other state(s).
- id: 108
  category: penalties_and_points
  question: What is the penalty for making false statements or attempting fraud by
    displaying invalid documents on a driver license application?
  choices:
    A: It is considered a misdemeanor and results in a warning
    B: It is considered perjury and may result in fines, denial of licenses, and suspension
    C: It results in a mandatory 30-day jail sentence
    D: It requires the applicant to retake the written exam
  answer: B
  explanation: False statements, attempted fraud, or misrepresentation is perjury
    and may result in fines and denial of licenses. A driver license may be suspended
    any time false information is found on the signed application.
- id: 109
  category: license_system
  question: Which of the following is NOT an acceptable document to prove your Social
    Security Number (SSN)?
  choices:
    A: W-2 tax form
    B: Pay stub containing full SSN
    C: Medicare/Medicaid card
    D: Social Security Card
  answer: C
  explanation: The manual explicitly states that Medicare/Medicaid cards are not acceptable
    as proof of a Social Security Number.
- id: 110
  category: license_system
  question: How many proofs of Delaware residency are required when applying for a
    driver's license or ID card?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Each applicant must provide two proofs of the applicant's Delaware
    residency.
- id: 111
  category: license_system
  question: What is a requirement for the two proofs of Delaware residency?
  choices:
    A: They must be postmarked within the last 60 days
    B: They must be postmarked within the last 6 months
    C: They can be non-business letters from friends
    D: They can display a Post Office box address
  answer: A
  explanation: Proofs of residency must be from separate sources, display a physical
    address (not a PO box), and be postmarked within the last 60 days. Non-business
    letters/cards will NOT be accepted.
- id: 112
  category: license_system
  question: What additional information must be included on a birth certificate if
    the applicant is under 18 or eligible for the IEP GDL program?
  choices:
    A: The hospital's official logo
    B: The attending physician's signature
    C: The parent(s) or legal guardian(s) name(s)
    D: The applicant's blood type
  answer: C
  explanation: If the applicant is under 18 or is eligible for the IEP GDL program,
    a document containing parent(s) or legal guardian(s) name(s) must be presented
    (such as a birth certificate).
- id: 113
  category: license_system
  question: Which of the following is considered an acceptable U.S. issued certificate
    of birth for identification purposes?
  choices:
    A: A hospital announcement record
    B: A wallet-sized birth registration card
    C: A photocopy of the original birth certificate
    D: An original or certified copy with a raised seal issued by the Bureau of Vital
      Statistics
  answer: D
  explanation: A certificate of birth must be an original or certified copy, have
    a raised seal, and be issued by the Bureau of Vital Statistics or State Board
    of Health. Wallet cards and hospital announcements are not accepted.
- id: 114
  category: license_system
  question: Through which system does the DMV electronically verify a non-citizen's
    legal status and authorized length of stay?
  choices:
    A: Systematic Alien Verification for Entitlements System (SAVE)
    B: National Driver Register (NDR)
    C: Transportation Security Administration (TSA) database
    D: Federal Bureau of Investigation (FBI) background check
  answer: A
  explanation: Non-citizens must provide documents that can be verified electronically
    through the Department of Homeland Security's Systematic Alien Verification for
    Entitlements System (SAVE).
- id: 115
  category: license_system
  question: What is the maximum expiration date for a driver's license issued to a
    non-immigrant/temporary visitor?
  choices:
    A: 8 years
    B: 5 years
    C: It is limited by their authorized stay in the U.S.
    D: 1 year regardless of their visa
  answer: C
  explanation: For non-immigrant/temporary visitors, the expiration date is limited
    by their authorized stay in the U.S., which is verified electronically through
    SAVE.
- id: 116
  category: license_system
  question: What must a primary identification document contain to be accepted by
    the DMV?
  choices:
    A: Full name, date of birth, and be verifiable
    B: Full name, physical address, and a photograph
    C: Date of birth, Social Security Number, and signature
    D: Full name, height, and eye color
  answer: A
  explanation: A primary document must contain the full name and date of birth and
    must be verifiable (the issuing agency can be contacted to determine the authenticity
    of the document).
- id: 117
  category: driver_testing
  question: In addition to an eye-screening examination, what other exams is every
    driver license applicant subject to?
  choices:
    A: A physical fitness test
    B: A written and road skills exam
    C: A psychological evaluation
    D: A defensive driving course
  answer: B
  explanation: The manual states that every driver license applicant is subject to
    a written and road skills exam.
- id: 118
  category: license_system
  question: Which of the following documents is acceptable as proof of a Social Security
    Number?
  choices:
    A: A Medicare card
    B: A Medicaid card
    C: A W-2 tax form
    D: An expired passport
  answer: C
  explanation: A W-2 tax form is listed as an acceptable proof of a Social Security
    Number. Medicare and Medicaid cards are explicitly noted as not acceptable.
- id: 119
  category: license_system
  question: Which delivery service is acceptable for mail used as proof of Delaware
    residency?
  choices:
    A: FedEx
    B: UPS
    C: DHL
    D: USPS
  answer: D
  explanation: According to the manual, 'Mail must have been delivered by the USPS...
    (UPS/FedEx/DHL not accepted).'
- id: 120
  category: license_system
  question: How long must you wait after changing your name with the Social Security
    Administration before appearing at the DMV?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 1 week
  answer: B
  explanation: The manual requires that 'You must change your name with the Social
    Security Administration and wait 48 hours before appearing at DMV.'
- id: 121
  category: license_system
  question: Which of the following is NOT an acceptable proof of a legal name change?
  choices:
    A: A finalized court ordered name change document
    B: A marriage certificate signed by a clergy member
    C: A finalized divorce decree stating your legal name
    D: A civil union certificate issued by a government agency with a raised seal
  answer: B
  explanation: The manual explicitly states, 'Marriage certificates signed by a clergy
    are not accepted.' They must be issued by a government agency with a raised seal.
- id: 122
  category: license_system
  question: If a minor was adopted outside the U.S. and their foreign birth certificate
    does NOT list the adoptive parents, what additional document is required?
  choices:
    A: A letter from the minor's school
    B: A U.S. passport
    C: The adoption paperwork
    D: A DNA test
  answer: C
  explanation: 'The manual notes: ''If the adoptive parents are NOT listed on the
    birth certificate, the adoption paperwork will be required...'''
- id: 123
  category: license_system
  question: Who is eligible to apply for a Delaware Driving Privilege Card (DPC)?
  choices:
    A: U.S. Citizens who lost their birth certificate
    B: Persons with valid legal presence documents
    C: Any resident of a neighboring state
    D: Foreign Delaware residents unable to produce legal presence
  answer: D
  explanation: 'The manual states: ''The DPC is only available to foreign Delaware
    residents who are unable to produce legal presence within the United States...
    U.S. Citizens and persons with valid legal presence documents are not eligible
    for a DPC.'''
- id: 124
  category: license_system
  question: What is a Delaware Driving Privilege Card (DPC) valid for?
  choices:
    A: As a valid form of identification for boarding flights
    B: For driving purposes only within the state of Delaware
    C: For driving purposes in any U.S. state
    D: As proof of legal presence in the United States
  answer: B
  explanation: The manual explains that the DPC 'is issued for driving purposes only
    within the state of Delaware and is not to be used as a valid form of identification.'
- id: 125
  category: license_system
  question: What is the fee for a Driving Privilege Card (DPC) and how long is it
    valid?
  choices:
    A: $20.00, valid for 4 years
    B: $40.00, valid for 8 years
    C: $72.00, valid for 4 years
    D: $20.00, valid for 5 years
  answer: A
  explanation: According to the manual, 'The fee for the DPC is $20.00 and it is valid
    for a period of 4 years.'
- id: 126
  category: license_system
  question: When applying for a DPC, what fee is collected by the State Bureau of
    Identification (SBI) for fingerprints and ID validation?
  choices:
    A: $20
    B: $48
    C: $72
    D: $100
  answer: C
  explanation: The manual states that during the DPC process, 'SBI will collect fingerprints,
    validate identification and collect a $72 fee.'
- id: 127
  category: license_system
  question: 'To get a DPC, applicants must provide a Certification of Filing Compliance
    confirming they have filed Delaware taxes for the previous:'
  choices:
    A: One year
    B: Two years
    C: Three years
    D: Five years
  answer: B
  explanation: Applicants must collect a Certification of Filing Compliance document
    from the Delaware Division of Revenue 'confirming they have filed Delaware taxes
    for the previous two years.'
- id: 128
  category: license_system
  question: If an applicant for a Driving Privilege Card is under 18, what additional
    document must they provide?
  choices:
    A: A letter from their high school principal
    B: An original and translated copy of their birth certificate
    C: A signed permission slip from a driving instructor
    D: Proof of employment
  answer: B
  explanation: The DPC Required Documents Table states that if the applicant is under
    18, they 'must also have original and translated copy of birth certificate.'
- id: 129
  category: license_system
  question: Which of the following is an approved alternate document specifically
    for applicants from Mexico applying for a DPC?
  choices:
    A: Mexican Federal Electoral Card (IFE)
    B: Mexican Driver's License
    C: Mexican Birth Certificate
    D: Mexican Social Security Card
  answer: A
  explanation: The manual lists the 'Mexican Federal Electoral Card (Instituto Federal
    Electoral (IFE) Credencial para Votar)' as an alternate approved document for
    Mexico.
- id: 130
  category: license_system
  question: Which of the following countries' Consular Registration cards is NOT explicitly
    listed as accepted for a DPC in the manual?
  choices:
    A: Brazil
    B: Colombia
    C: Argentina
    D: Ecuador
  answer: C
  explanation: The manual lists accepted valid consular cards from Brazil, Colombia,
    Ecuador, Guatemala, and Mexico. Argentina is not on this list.
- id: 131
  category: license_system
  question: If a required document for a Driving Privilege Card is in a foreign language,
    what must accompany it?
  choices:
    A: A notarized summary of the document
    B: An English translation by a professional translator
    C: A verbal translation provided by the applicant
    D: A translation completed by a family member
  answer: B
  explanation: The manual requires that 'Documents in foreign languages must be translated
    into English by a professional translator and accompany the original foreign language
    document.'
- id: 132
  category: license_system
  question: 'To be accepted as proof of Delaware residency, mail must be postmarked
    or received within the last:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: 'The manual states: ''Mail must have been delivered by the USPS and
    be postmarked or received within the last 60 days.'''
- id: 133
  category: license_system
  question: What document must an applicant present as proof of passing a certified
    Delaware Driver Education Course?
  choices:
    A: A Red/White Certificate
    B: A Blue/White Certificate
    C: A Gold/Blue Certificate
    D: A Green/White Certificate
  answer: B
  explanation: Applicants must present a Delaware Driver Education Certificate (Blue/White
    Certificate) as proof that they passed a certified Delaware Driver Education Course.
- id: 134
  category: driver_responsibility
  question: What is the legal responsibility of the sponsor who signs a GDL program
    application?
  choices:
    A: They are solely liable for any traffic tickets the applicant receives.
    B: They are jointly liable with the GDL applicant for any damages resulting from
      the applicant's negligence.
    C: They must pay the applicant's auto insurance premiums.
    D: They are not liable for the applicant once the permit is issued.
  answer: B
  explanation: The sponsor is held jointly liable with the GDL applicant for any damages
    resulting from the GDL applicant's negligence.
- id: 135
  category: license_system
  question: What is the fee for a Class D license, and how long is the new license
    valid?
  choices:
    A: $25.00 for 5 years
    B: $40.00 for 8 years
    C: $50.00 for 10 years
    D: $40.00 for 5 years
  answer: B
  explanation: The applicant must pay a $40.00 Class D license fee and pass an eye
    screen at the time of application. All new licenses will be 8 year licenses.
- id: 136
  category: safe_driving_rules
  question: 'While operating a motor vehicle, a Level One Learner''s Permit holder:'
  choices:
    A: May use a cellular telephone only if it is hands-free.
    B: May use a text messaging device only when stopped at a red light.
    C: Shall not operate a motor vehicle while using a cellular telephone or similar
      electronic device.
    D: May use a cellular telephone only to call their sponsor.
  answer: C
  explanation: The permit holder shall not operate a motor vehicle while using a cellular
    telephone, text messaging device, or similar electronic device.
- id: 137
  category: license_system
  question: What are the requirements for the supervising driver of a Level One Learner's
    Permit holder?
  choices:
    A: Must be at least 21 years old and have held a license for 3 years.
    B: Must be at least 25 years old and have held a Class D license for at least
      5 years.
    C: Must be at least 18 years old and an immediate family member.
    D: Must be a certified driver education instructor.
  answer: B
  explanation: The supervisor must be a properly licensed parent, guardian or licensed
    driver (approved by the sponsor) who is at least 25 years of age and has held
    a Class D license for at least 5 years.
- id: 138
  category: safe_driving_rules
  question: Where must the supervising driver be seated when a Level One Learner's
    Permit holder is driving?
  choices:
    A: Anywhere in the vehicle as long as they have a clear view of the driver.
    B: In the back seat directly behind the driver.
    C: Beside the permit holder in the front seat of the vehicle.
    D: In the front seat or the back seat, provided they are wearing a seatbelt.
  answer: C
  explanation: The supervising driver must be seated beside the permit holder in the
    front seat of the vehicle when it is in motion. No person other than the supervising
    driver can be in the front seat.
- id: 139
  category: license_system
  question: 'During the first six months after issuance of a Level One Learner''s
    Permit, the permit holder:'
  choices:
    A: May drive unsupervised during daylight hours.
    B: Must be supervised at all times.
    C: May drive unsupervised to and from school.
    D: Must complete 100 hours of driving.
  answer: B
  explanation: For the first six months after issuance of a Level One Learner's Permit,
    the permit holder must be supervised at all times.
- id: 140
  category: driver_testing
  question: How many hours of driving experience must the sponsor certify that the
    permit holder has completed during the first six months?
  choices:
    A: 30 hours, including 5 hours of night driving.
    B: 40 hours, including 10 hours of night driving.
    C: 50 hours, including 10 hours of night driving.
    D: 60 hours, including 15 hours of night driving.
  answer: C
  explanation: The sponsor shall certify that the permit holder has driven for 50
    hours; 10 of which includes night-time driving.
- id: 141
  category: safe_driving_rules
  question: After the first six months of valid Level One Learner's Permit driving
    authority, between what hours may the permit holder drive unsupervised?
  choices:
    A: 5:00 a.m. and 9:00 p.m.
    B: 6:00 a.m. and 10:00 p.m.
    C: 7:00 a.m. and 11:00 p.m.
    D: 6:00 a.m. and 8:00 p.m.
  answer: B
  explanation: After the first six months of valid Level One Learner's Permit driving
    authority, the permit holder may drive unsupervised between the hours of 6:00
    a.m. and 10:00 p.m.
- id: 142
  category: license_system
  question: 'During the second six months of the GDL program, a permit holder may
    drive unsupervised between 10:00 p.m. and 6:00 a.m. ONLY when going directly to
    and from:'
  choices:
    A: Church activities, work activities, and school activities on school property.
    B: Grocery stores, gas stations, and medical facilities.
    C: Family gatherings, sporting events, and study groups.
    D: Any location within a 10-mile radius of their home.
  answer: A
  explanation: 'Exception: The permit holder may travel without supervision during
    those hours when going directly to and from church activities, work activities,
    and the permit holder''s school activities on school property.'
- id: 143
  category: penalties_and_points
  question: What is the penalty for a first offense of violating the Level One Learner's
    Permit restrictions?
  choices:
    A: A $100 fine and 2 points on the driving record.
    B: A one-month suspension of driving privileges.
    C: A two-month suspension of driving privileges.
    D: Immediate revocation of the permit until age 18.
  answer: C
  explanation: Persons who violate the Level One Learner's Permit restrictions are
    considered as driving without a license which will result in a two-month suspension
    for the first offense.
- id: 144
  category: license_system
  question: What happens to a GDL Level One Learner's Permit once the permit holder
    has completed a full 12 months of valid driving authority?
  choices:
    A: The permit holder must retake the road skills exam.
    B: The permit automatically converts to a Class D license.
    C: The permit holder must pay an additional $40 fee to upgrade.
    D: The permit expires and the driver must reapply.
  answer: B
  explanation: The GDL Level One Learner's Permit will automatically convert to a
    Class D license once the permit holder has completed a full 12 months of valid
    driving authority.
- id: 145
  category: safe_driving_rules
  question: During the second six-month period of the GDL program, when a supervisor
    is NOT present, what is the passenger restriction?
  choices:
    A: No passengers are allowed in the vehicle.
    B: Only immediate family members are allowed in the vehicle.
    C: Only one other passenger in addition to the driver can be in the vehicle.
    D: Up to three passengers are allowed if they are wearing seatbelts.
  answer: C
  explanation: During the second six month period of unsupervised driving, when a
    supervisor is not present, only one other passenger in addition to the driver
    can be in the vehicle.
- id: 146
  category: license_system
  question: When does a GDL Level One Learner's Permit automatically convert to a
    Class D license?
  choices:
    A: After 6 months of valid driving authority
    B: After 12 months of valid driving authority
    C: When the driver turns 18 years old
    D: After passing a second road skills exam
  answer: B
  explanation: According to the manual, the GDL Level One Learner's Permit will automatically
    convert to a Class D license once the permit holder has completed a full 12 months
    of valid driving authority.
- id: 147
  category: driver_responsibility
  question: If you are over 18 and learning to drive with a temporary instruction
    permit, you must be accompanied by a licensed driver who is at least what age?
  choices:
    A: 18 years of age
    B: 21 years of age
    C: 25 years of age
    D: 30 years of age
  answer: B
  explanation: The manual states that while learning to drive, you must be accompanied
    by a licensed driver who is qualified to drive the class of vehicle in which you
    are training, and they must be at least 21 years of age.
- id: 148
  category: driver_testing
  question: How long must a first-time applicant over the age of 18 wait after their
    learner's permit is issued before they can take a road exam?
  choices:
    A: At least 10 days
    B: At least 30 days
    C: At least 60 days
    D: At least 6 months
  answer: A
  explanation: To obtain your license, you must take a road exam, but not until at
    least 10 days after the permit was issued.
- id: 149
  category: license_system
  question: If you move into Delaware from another state, how many days do you have
    to apply for a Delaware driver's license after becoming a resident?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: If you move into Delaware from another State, you must apply for a
    Delaware driver's license within 60 days after becoming a resident.
- id: 150
  category: license_system
  question: When transferring a driver's license from another state to Delaware, which
    of the following endorsements is non-transferrable?
  choices:
    A: Motorcycle
    B: Passenger (P)
    C: Taxi/Limousine (Z)
    D: Tanker (N)
  answer: C
  explanation: The manual explicitly states that the Taxi/Limousine (Z) endorsement
    is non-transferrable.
- id: 151
  category: driver_testing
  question: Delaware has a reciprocity agreement exempting drivers from the knowledge
    and road exams for a Class D license if they are transferring from which of the
    following countries?
  choices:
    A: Canada
    B: Mexico
    C: Germany
    D: United Kingdom
  answer: C
  explanation: Delaware has a reciprocity agreement with Germany, Taiwan (Republic
    of China) and France thereby exempting these drivers from the knowledge and road
    exams for a Class D license only.
- id: 152
  category: license_system
  question: If a minor applicant (under 18) moves to Delaware and has held an out-of-state
    driver's license for less than 12 months, what are they eligible for?
  choices:
    A: A Class D operator's license
    B: A Level One Learner's Permit
    C: A permanent driver's license
    D: A restricted commercial license
  answer: B
  explanation: If the minor applicant was issued an out-of-state license for less
    than 12 months, they may be eligible for a Level One Learner's Permit.
- id: 153
  category: license_system
  question: For how many years is a standard Delaware driver's license typically issued
    before it must be renewed?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: Delaware driver licenses will be issued for eight years, with the exception
    of Immigration length of stay, hazmat holders and Driving Privilege Card holders.
- id: 154
  category: penalties_and_points
  question: What is the late fee charged if you renew your Delaware driver's license
    after the expiration date?
  choices:
    A: $5.00
    B: $10.00
    C: $12.00
    D: $20.00
  answer: B
  explanation: A $10.00 late fee is charged if the renewal takes place after the expiration
    date.
- id: 155
  category: license_system
  question: How early can you renew a standard Delaware driver's license prior to
    its expiration date?
  choices:
    A: Up to 30 days prior
    B: Up to 60 days prior
    C: Up to 90 days prior
    D: Up to 180 days prior
  answer: D
  explanation: You may renew at any time during the 180-day (six months) period prior
    to the expiration of your license.
- id: 156
  category: penalties_and_points
  question: What happens to a permanent driver's license if it is suspended or revoked?
  choices:
    A: It is permanently destroyed and cannot be replaced.
    B: It is changed to a Class D license upon reinstatement.
    C: It is reinstated as a permanent license after a $50 fee.
    D: It is converted to a Level One Learner's Permit.
  answer: B
  explanation: Whenever a permanent license is suspended or revoked, it is changed
    to a Class D license upon reinstatement.
- id: 157
  category: penalties_and_points
  question: What is a potential penalty for driving without the required equipment
    specified on a restricted license (such as glasses)?
  choices:
    A: You will be required to retake the road exam.
    B: You are subject to arrest and your license may be suspended.
    C: You will receive a warning and a $10 fine.
    D: Your license will be permanently revoked with no chance of reinstatement.
  answer: B
  explanation: If you drive without the required equipment, you are subject to arrest
    and your driver license may be suspended.
- id: 158
  category: license_system
  question: What is the fee to obtain a replacement driver's license if yours is lost,
    stolen, or destroyed?
  choices:
    A: $1.15
    B: $10.00
    C: $20.00
    D: $24.00
  answer: C
  explanation: If your license is lost, stolen, or destroyed, you may apply online
    or go to the Division for a replacement license which will be issued for a fee
    of $20.00.
- id: 159
  category: license_system
  question: After legally changing your name, how long do you have to appear in person
    at the DMV to change the name on your driver's license?
  choices:
    A: 10 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Within 30 days after legally changing your name, you must appear in
    person at the DMV to change the name on your driver license or identification
    card.
- id: 160
  category: driver_responsibility
  question: How many days do you have to notify the Division of Motor Vehicles after
    changing your Delaware address?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: After changing your Delaware address, you have 30 days to notify both
    the Vehicle Registration and Driver License Sections of the Division of Motor
    Vehicles.
- id: 161
  category: license_system
  question: How long is a Delaware identification card valid before it expires?
  choices:
    A: Four years from the date of issue
    B: Five years from the applicant's next birthday
    C: Eight years from the applicant's next birthday
    D: Ten years from the date of issue
  answer: C
  explanation: The fee for an identification card is $40.00 and it expires eight years
    from the applicant's next birthday.
- id: 162
  category: license_system
  question: Who must accompany an applicant under the age of 18 applying for an identification
    card?
  choices:
    A: Any adult over the age of 21
    B: A sponsor who is the mother, father, or court-appointed guardian
    C: A licensed driving instructor
    D: An older sibling with a valid driver's license
  answer: B
  explanation: A sponsor who is the mother or father or a court appointed guardian
    as listed on the minor's birth certificate must accompany any applicant under
    the age of 18.
- id: 163
  category: license_system
  question: Which of the following is NOT listed as an acceptable original document
    to prove military service for a veteran indicator?
  choices:
    A: DD-214
    B: Honorable Discharge Certificate
    C: High school diploma
    D: Military ID
  answer: C
  explanation: Acceptable documents to prove military service include a Military ID,
    NGB-22, DD-214, DD-256, Honorable Discharge Certificate, or a valid out-of-state
    driver license with a veteran designation.
- id: 164
  category: license_system
  question: What is the fee to add a veteran indicator to your driver license outside
    of a renewal or duplicate transaction?
  choices:
    A: It is always free
    B: $5.00
    C: $10.00
    D: $40.00
  answer: C
  explanation: The veteran indicator may be added free of charge during renewal or
    duplicate transactions. Otherwise, there is a $10.00 fee.
- id: 165
  category: driver_responsibility
  question: At what minimum age can a Delaware resident register to vote at the DMV,
    provided they will be 18 by the day of the general election?
  choices:
    A: 15 years of age
    B: 16 years of age
    C: 17 years of age
    D: 18 years of age
  answer: B
  explanation: You may register to vote if you are a U.S. citizen, a bona fide resident
    of Delaware, are at least 16 years of age and are mentally competent.
- id: 166
  category: driver_responsibility
  question: If you are automatically registered to vote when applying for a Delaware
    driver license, what political party will you be registered under by default?
  choices:
    A: Democrat
    B: Republican
    C: Independent
    D: Unaffiliated
  answer: D
  explanation: Pursuant to Delaware law, eligible individuals who are automatically
    registered to vote by the Department of Elections are registered as Unaffiliated.
- id: 167
  category: license_system
  question: What color is the voluntary medical indicator that may appear on a Delaware
    driver license?
  choices:
    A: Red
    B: Blue
    C: Green
    D: Yellow
  answer: B
  explanation: A blue medical indicator may appear on the document as a means for
    the holder to share a medical condition to those giving emergency medical care.
- id: 168
  category: driver_responsibility
  question: 'The Visor Communication card is available upon request for individuals
    who are:'
  choices:
    A: Visually impaired
    B: Deaf or hard of hearing
    C: Physically disabled
    D: Non-English speakers
  answer: B
  explanation: The Visor Communication card application for deaf or hard of hearing
    individuals is available upon request and on the website.
- id: 169
  category: penalties_and_points
  question: Under Megan's Law, how many days does a convicted sex offender have to
    register after coming into a Delaware county, city, or town to reside?
  choices:
    A: 3 days
    B: 7 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: Registration must occur within seven days of coming into any county,
    city, or town in which they temporarily reside or is domiciled for that length
    of time.
- id: 170
  category: license_system
  question: To whom might the Division of Motor Vehicles release your mandatory Social
    Security Number?
  choices:
    A: Private individuals upon request
    B: Local businesses for background checks
    C: State agencies to carry out their governmental functions
    D: Marketing firms
  answer: C
  explanation: Social security numbers will not be released to businesses or private
    individuals, but may be released to State agencies to carry out their governmental
    functions.
- id: 171
  category: driver_responsibility
  question: 'For male applicants, signing a driver license or identification card
    application constitutes consent to:'
  choices:
    A: Join the National Guard
    B: Register with the Selective Service System if required
    C: Become an organ donor
    D: Register as an Unaffiliated voter
  answer: B
  explanation: Male applicants are to understand that their signature on license or
    identification card applications constitutes consent to be registered with the
    Selective Service System, if so required.
- id: 172
  category: driver_responsibility
  question: How many emergency contacts can you designate in Delaware's voluntary
    Next of Kin registry?
  choices:
    A: One
    B: Up to two
    C: Up to three
    D: Unlimited
  answer: B
  explanation: Delaware's Next of Kin registry is a voluntary program designed to
    provide Delaware citizens... the option to designate up to two different emergency
    contacts, a primary and a secondary.
- id: 173
  category: driver_responsibility
  question: What symbol will be displayed on your Delaware driver license if you choose
    to be an Organ and Tissue Donor?
  choices:
    A: A blue medical cross
    B: A green ribbon
    C: A red heart
    D: A silver star
  answer: C
  explanation: If you say yes to being an Organ and Tissue Donor, a "RED HEART" will
    be displayed on your license.
- id: 174
  category: alcohol_drugs_health
  question: What protection does Delaware's Good Samaritan Law provide to someone
    who calls 9-1-1 for a person experiencing a drug overdose?
  choices:
    A: Protection from prosecution for possession of an illegal substance
    B: A monetary reward for saving a life
    C: Immunity from all future traffic violations
    D: Free replacement of their driver license
  answer: A
  explanation: Delaware's Good Samaritan Laws protect individuals who request medical
    assistance for someone who is experiencing a drug or alcohol overdose... from
    being prosecuted for possession of an illegal substance.
- id: 175
  category: alcohol_drugs_health
  question: Under Good Samaritan laws, individuals are protected from civil damages
    for administering what life-saving medication during an opioid overdose?
  choices:
    A: Insulin
    B: Naloxone
    C: Epinephrine
    D: Penicillin
  answer: B
  explanation: According to the manual, Good Samaritan laws protect individuals from
    civil damages for administering naloxone, a life-saving medication that can reverse
    an opioid overdose.
- id: 176
  category: driver_responsibility
  question: Which of the following is considered a red flag for human trafficking
    at a business or residence?
  choices:
    A: A business with large, open windows and unlocked doors
    B: Workers who commute long distances to the place of business
    C: Restricted or controlled communication where a person is not allowed to speak
      for themselves
    D: Employees taking frequent, unsupervised breaks
  answer: C
  explanation: The manual lists several red flags for human trafficking, including
    restricted or controlled communication where a person is not allowed to speak
    for themselves, or being watched or followed.
- id: 177
  category: license_system
  question: 'A Class D Operator''s License is valid for a single motor vehicle with
    a Gross Vehicle Weight Rating (GVWR) not greater than:'
  choices:
    A: 10,000 pounds
    B: 16,000 pounds
    C: 26,000 pounds
    D: 32,000 pounds
  answer: C
  explanation: A Class D Operator's License is valid for any single motor vehicle,
    and a trailer, with a gross vehicle weight rating (GVWR) not greater than 26,000
    pounds.
- id: 178
  category: license_system
  question: The requirement for a Commercial Driver License (CDL) is waived when operating
    which of the following vehicles?
  choices:
    A: A school bus carrying 16 or more passengers
    B: A delivery truck for a commercial business
    C: Personal recreational vehicles
    D: A vehicle transporting hazardous materials
  answer: C
  explanation: The manual states that the requirement for a CDL is waived when the
    driver is operating farm equipment, firefighting equipment, recreational vehicles,
    or military members operating military vehicles.
- id: 179
  category: license_system
  question: To qualify for a CDL waiver, a farm vehicle must be used within how many
    miles of the person's farm?
  choices:
    A: 50 miles
    B: 100 miles
    C: 150 miles
    D: 200 miles
  answer: C
  explanation: To qualify for the farm vehicle CDL waiver, the vehicle must be used
    within 150 miles of the person's farm.
- id: 180
  category: license_system
  question: 'When driving with a Commercial Learners Permit (CLP), you are permitted
    to drive a Commercial Motor Vehicle (CMV) only if:'
  choices:
    A: You are driving during daylight hours
    B: You are accompanied by another licensed CDL driver qualified in the same type
      of CMV
    C: You are not carrying any cargo
    D: You stay within 50 miles of your home
  answer: B
  explanation: A CDL learner's permit allows you to drive a Commercial Motor Vehicle
    (CMV), but only with another licensed CDL driver qualified in the same type CMV.
- id: 181
  category: license_system
  question: 'A CDL Class A license is required for a combination of vehicles with
    a Gross Combined Weight Rating (GVWR) of 26,001 pounds or more, provided the towed
    unit is in excess of:'
  choices:
    A: 5,000 pounds
    B: 10,000 pounds
    C: 15,000 pounds
    D: 20,000 pounds
  answer: B
  explanation: A CDL Class A license is required for any combination of vehicles with
    a GVWR of 26,001 pounds or more, provided the GVWR of the towed unit(s) is in
    excess of 10,000 pounds.
- id: 182
  category: license_system
  question: Which CDL class is required for a vehicle with a GVWR of less than 26,001
    pounds that is designed to transport 16 or more passengers?
  choices:
    A: CDL Class A
    B: CDL Class B
    C: CDL Class C
    D: Non-CDL Class A
  answer: C
  explanation: A CDL Class C license is required for vehicles with a GVWR of less
    than 26,001 pounds that are designed to transport 16 or more passengers (including
    the driver) or used to transport hazardous materials.
- id: 183
  category: license_system
  question: 'A Class D Learner Permit authorizes the holder to operate a Class D vehicle
    under the condition that they are accompanied by a properly licensed driver over
    the age of:'
  choices:
    A: '18'
    B: '21'
    C: '25'
    D: '30'
  answer: B
  explanation: The permit authorizes its holders to operate a Class D vehicle under
    the condition that the permit holder is accompanied by a properly licensed driver
    over the age of 21.
- id: 184
  category: license_system
  question: 'When temporarily out-of-state, a one-time temporary license may be issued
    to a valid Class D operator for a period not to exceed:'
  choices:
    A: Three months
    B: Six months
    C: Nine months
    D: Twelve months
  answer: B
  explanation: A one-time temporary license is issued for a period not to exceed six
    months to extend the expiration date or replace a lost license when temporarily
    out-of-state.
- id: 185
  category: license_system
  question: 'Persons under the age of 18 applying for a motorcycle endorsement must:'
  choices:
    A: Complete the Motorcycle Rider Education Program
    B: Have at least 5 years of driving experience
    C: Only ride motorcycles with a sidecar
    D: Pay a $50.00 surcharge
  answer: A
  explanation: Persons under the age of 18 must have the motorcycle application signed
    by their parents or legal guardian and must complete the Motorcycle Rider Education
    Program as approved by the Division.
- id: 186
  category: safe_driving_rules
  question: For how long must a newly endorsed motorcycle rider and their passengers
    wear a helmet and eye protection?
  choices:
    A: For the first 6 months
    B: For the first year
    C: For the first 2 years
    D: Until they turn 21
  answer: C
  explanation: Any person who obtains a new endorsement for a motorcycle, or someone
    riding with the newly endorsed person, is required by law to wear a helmet and
    eye protection for the first 2 years after receiving the endorsement.
- id: 187
  category: license_system
  question: A motorcycle learner permit is initially valid for six months. How many
    times can it be extended for an additional six months?
  choices:
    A: It cannot be extended
    B: Only once
    C: Twice
    D: Unlimited times
  answer: B
  explanation: Once you have passed the knowledge exam, you will be issued a motorcycle
    permit which is valid for six months. You can extend the permit only once for
    an additional six months.
- id: 188
  category: license_system
  question: Which of the following is a restriction when operating a motorcycle with
    a temporary instruction permit?
  choices:
    A: You must not exceed 45 mph
    B: You are not permitted to operate on the federal interstate highway system
    C: You can only ride on weekends
    D: You must ride with a licensed motorcycle instructor at all times
  answer: B
  explanation: 'Restrictions for a motorcycle learner permit include: no passengers,
    no operating between sunset and sunrise, mandatory helmet and eye protection,
    and operation is not permitted on the federal interstate highway system.'
- id: 189
  category: license_system
  question: 'When operating a motorcycle with a learner permit, driving is prohibited
    between:'
  choices:
    A: Sunset and sunrise
    B: 10:00 PM and 6:00 AM
    C: Midnight and 5:00 AM
    D: Rush hour traffic times
  answer: A
  explanation: One of the restrictions when operating a motorcycle with a temporary
    instruction permit is that operating a motorcycle between sunset and sunrise is
    prohibited.
- id: 190
  category: license_system
  question: What is the fee to apply for an extension of a motorcycle temporary instruction
    permit at the DMV?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: A
  explanation: You must apply for an extension at DMV before the expiration date and
    pay a $5.00 fee.
- id: 191
  category: license_system
  question: To obtain a school bus endorsement, a driver must not have more than how
    many points on their record for the past three years?
  choices:
    A: Three points
    B: Four points
    C: Five points
    D: Six points
  answer: C
  explanation: Drivers must not have more than five points (full point value) on their
    record for the past three years to obtain a school bus endorsement.
- id: 192
  category: license_system
  question: Are out-of-state Taxi/Limo endorsements transferrable to Delaware?
  choices:
    A: Yes, if the driver passes a vision test.
    B: Yes, if the driver pays a transfer fee.
    C: No, out-of-state Taxi/Limo endorsements are not transferrable.
    D: No, unless the driver has held the endorsement for over 5 years.
  answer: C
  explanation: 'The manual explicitly states: "NOTE: Out of State Taxi/Limo endorsements
    are not transferrable."'
- id: 193
  category: driver_testing
  question: If your Class D driving privileges have been expired for over one year
    but less than five years, what exams are you required to take to reapply?
  choices:
    A: Only the vision exam
    B: The vision and Class D knowledge exams
    C: The vision, knowledge, and road exams
    D: Only the road exam
  answer: B
  explanation: If your Class D driving privileges have been expired over one year,
    you are required to take the vision and Class D knowledge exam.
- id: 194
  category: driver_testing
  question: What exams must you take if your Class D driving privileges have been
    revoked for over 5 years?
  choices:
    A: Vision and knowledge exams only
    B: Knowledge and road exams only
    C: Vision, knowledge, and road exams
    D: Only the road exam
  answer: C
  explanation: If it has been over 5 years since your Class D driving privileges were
    revoked, you must reapply for your Class D license and take the vision, knowledge,
    and road exams.
- id: 195
  category: driver_testing
  question: What is the minimum acceptable vision for a standard Delaware driver license?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Minimum acceptable vision for a Delaware driver license is 20/40, with
    or without glasses or contact lenses.
- id: 196
  category: driver_testing
  question: Under what condition may a driver be granted permission for daylight only
    driving?
  choices:
    A: If their vision is between 20/40 and 20/50
    B: If their vision is 20/20 in only one eye
    C: If they are over the age of 70
    D: If they fail the highway sign and signal test
  answer: A
  explanation: Permission for daylight only driving may be granted if your vision
    is between 20/40 and 20/50.
- id: 197
  category: driver_testing
  question: How soon are you eligible to take a Class D road exam after passing the
    knowledge exam?
  choices:
    A: Immediately
    B: 5 days later
    C: 10 days later
    D: 14 days later
  answer: C
  explanation: You are eligible to take a Class D or motorcycle road exam 10 days
    after you pass the knowledge exam.
- id: 198
  category: driver_testing
  question: On which weekday are road exams NOT given in Delaware?
  choices:
    A: Monday
    B: Tuesday
    C: Wednesday
    D: Friday
  answer: C
  explanation: Road exams are given on every weekday, except Wednesday.
- id: 199
  category: driver_testing
  question: When arriving for your road exam, what is the minimum age requirement
    for the accompanying licensed driver?
  choices:
    A: 18 years of age
    B: 21 years of age
    C: 25 years of age
    D: There is no minimum age requirement
  answer: B
  explanation: Upon arriving for your ROAD EXAM you must have the valid driver license
    of the accompanying driver who is at least 21 years of age.
- id: 200
  category: driver_testing
  question: Which of the following maneuvers will you be required to demonstrate during
    the road exam?
  choices:
    A: Backing up 100 feet
    B: Parallel parking
    C: Driving on a federal interstate highway
    D: Nighttime driving
  answer: B
  explanation: During the road exam, you will be required to demonstrate maneuvers
    such as parallel parking, a three point turn, and backing 50 feet.
- id: 201
  category: driver_testing
  question: Which of the following is prohibited during the road test?
  choices:
    A: Using the vehicle's turn signals
    B: Adjusting the mirrors before starting
    C: Playing music
    D: Having the windows rolled down
  answer: C
  explanation: No cell phone use or playing of music is permitted during the road
    test.
- id: 202
  category: driver_testing
  question: If you fail any part of the road exam, how long must you wait before taking
    it again?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: At least 10 days
  answer: D
  explanation: If you fail any part of the road exam, you must wait at least ten days
    before taking the exam or exams again.
- id: 203
  category: license_system
  question: To obtain a Taxi/Limo endorsement, a driver must complete a defensive
    driving course from an approved provider within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: The driver must complete a defensive driving course within 30 days
    from an approved provider to obtain a Taxi/Limo endorsement.
- id: 204
  category: alcohol_drugs_health
  question: When is a driver with a medical condition required to furnish the Division
    with a new medical report each year?
  choices:
    A: By January 1st of each year
    B: No later than the last day of the person's birthday month
    C: On the exact anniversary of their license issuance
    D: Within 30 days of their birthday
  answer: B
  explanation: According to the manual, any person licensed to operate a motor vehicle
    based on a medical report may be required to furnish the Division with a new medical
    report every year no later than the last day of the person's birthday month.
- id: 205
  category: penalties_and_points
  question: What is the reinstatement fee for a suspended driver's license in Delaware?
  choices:
    A: $25.00
    B: $50.00
    C: $100.00
    D: $200.00
  answer: B
  explanation: The manual states that a fee of $50.00 must be paid to reinstate a
    suspended license.
- id: 206
  category: driver_testing
  question: Who is permitted by Delaware law to submit a request for the re-examination
    of a person's ability to safely operate a motor vehicle?
  choices:
    A: Any concerned citizen
    B: Immediate family members, law enforcement, or licensed practitioners
    C: Insurance agents and employers only
    D: Only a judge or court official
  answer: B
  explanation: Section 2714 of Title 21 allows the Division to accept requests for
    re-examination submitted by members of a driver's immediate family, law enforcement,
    or a licensed practitioner.
- id: 207
  category: alcohol_drugs_health
  question: What happens if a driver voluntarily surrenders their license because
    they cannot obtain a favorable medical report, but later obtains one before the
    suspension date?
  choices:
    A: They must pay a $50 reinstatement fee
    B: They must pay a $200 reinstatement fee
    C: There is no fee for reinstatement
    D: They are permanently barred from driving
  answer: C
  explanation: 'The manual states: "Upon receipt of a favorable medical report, there
    is no fee for reinstatement if the license is voluntarily surrendered before the
    suspension date."'
- id: 208
  category: penalties_and_points
  question: Which of the following offenses will result in a mandatory license revocation?
  choices:
    A: Spinning wheels
    B: Turfing (causing destruction to grass)
    C: Passing a stopped school bus
    D: Attempting to flee from a police officer
  answer: D
  explanation: Attempting to flee from a police officer after having received a visual
    or audible signal to stop is listed under "Mandatory Revocations." The other options
    are listed under reasons for a license suspension.
- id: 209
  category: penalties_and_points
  question: How many convictions for reckless driving within a 12-month period will
    result in a mandatory license revocation?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: The manual lists "Three convictions for reckless driving in a period
    of 12 consecutive months" as a cause for mandatory revocation.
- id: 210
  category: penalties_and_points
  question: Under the Habitual Offender Revocation law, a driver's license may be
    revoked for up to five years if they accumulate any combination of three major
    offenses within what time period?
  choices:
    A: 12 months
    B: 3 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: 'The manual states: "Any combination of three of the following offenses
    in a five year period may convict you as a habitual offender."'
- id: 211
  category: penalties_and_points
  question: How many total convictions (including major and lesser offenses like speeding)
    within a three-year period may result in a driver being declared a habitual offender?
  choices:
    A: '3'
    B: '5'
    C: '7'
    D: '10'
  answer: D
  explanation: 'The manual notes: "Any combination of the above offenses and lesser
    offenses, such as speeding, that result in 10 convictions in three years may convict
    you as a habitual offender."'
- id: 212
  category: penalties_and_points
  question: What is the difference between a license suspension and a license revocation?
  choices:
    A: Suspension is a cancellation, while revocation is a temporary removal.
    B: Suspension is a temporary removal, while revocation is a cancellation.
    C: Suspension requires a $200 fee, while revocation requires a $50 fee.
    D: Suspension only applies to medical issues, while revocation applies to traffic
      violations.
  answer: B
  explanation: 'The manual explicitly states: "Suspension of a license is a temporary
    removal of your driving privilege. Revocation of a license is a cancellation of
    your driving privilege."'
- id: 213
  category: driver_responsibility
  question: How does the Division of Motor Vehicles handle a Delaware resident's driving
    violation committed in another state?
  choices:
    A: Out-of-state violations are ignored.
    B: Only out-of-state parking tickets are recorded.
    C: The license will be suspended or revoked if the violation would be grounds
      for it in Delaware.
    D: The driver must surrender their Delaware license and apply for one in the other
      state.
  answer: C
  explanation: 'The manual states: "The Division will suspend or revoke the license
    of any Delaware resident who has been convicted of a violation in another state
    which, if committed in Delaware, would be grounds for suspension or revocation
    of a license."'
- id: 214
  category: penalties_and_points
  question: A driver may have their license suspended for Child Support Delinquency
    if they are 30 or more days delinquent and owe at least what amount in arrears?
  choices:
    A: $500.00
    B: $1,000.00
    C: $2,500.00
    D: $5,000.00
  answer: B
  explanation: The manual states that any person who owes $1,000.00 or more in arrears
    or retroactive support and is 30 or more days delinquent may have their license
    suspended.
- id: 215
  category: alcohol_drugs_health
  question: As of August 2024, what is the DMV's policy regarding licensed practitioners
    reporting patients' medical conditions?
  choices:
    A: Practitioners are mandated by law to report all medical conditions.
    B: Practitioners are no longer required to report medical conditions, but are
      encouraged to report patients who pose a danger.
    C: Practitioners face a $50 fine if they fail to report a patient.
    D: Practitioners are strictly prohibited from reporting any patient medical conditions
      to the DMV.
  answer: B
  explanation: 'The manual states: "As of August 2024, DMV no longer requires mandatory
    reporting of medical conditions. Licensed practitioners are encouraged to report
    patients who may pose a danger driving."'
- id: 216
  category: penalties_and_points
  question: What happens if you post a bond after being arrested for a mandatory revocation
    offense and do not appear in court?
  choices:
    A: You are issued a warning.
    B: Your license will be suspended for 30 days.
    C: Your license shall be revoked just as if you had been convicted.
    D: You must pay an additional $50 fee but keep your driving privileges.
  answer: C
  explanation: 'The manual states: "If you post a bond after being arrested for any
    of the causes listed above, and you do not appear in court, your license shall
    be revoked just as if you had been convicted."'
- id: 217
  category: penalties_and_points
  question: What is the reinstatement fee if your license is suspended due to being
    30 or more days delinquent in child support payments?
  choices:
    A: $25.00
    B: $50.00
    C: $75.00
    D: $100.00
  answer: B
  explanation: According to the manual, a reinstatement fee of $50.00 must be paid
    to the Division of Motor Vehicles in order to reinstate the license after a child
    support suspension.
- id: 218
  category: penalties_and_points
  question: How many points are assessed on your driving record for passing a stopped
    school bus?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: D
  explanation: Passing a stopped school bus results in 6 points on your driving record
    and may result in additional actions including suspension.
- id: 219
  category: penalties_and_points
  question: How are points calculated internally for administrative action during
    the second 12 months from the date of a violation?
  choices:
    A: They are credited at full point value.
    B: They are credited at half point value.
    C: They are credited at quarter point value.
    D: They are removed from the calculation completely.
  answer: B
  explanation: Points are calculated internally for administrative action at full
    point value for the first 12 months and half point value for the second 12 months
    from the date of violation.
- id: 220
  category: penalties_and_points
  question: What administrative action does the Division of Motor Vehicles take when
    a driver accumulates 8 calculated points?
  choices:
    A: Sends the driver an advisory letter.
    B: Imposes a mandatory 2-month suspension.
    C: Requires a behavior modification course.
    D: Revokes the driver's license for one year.
  answer: A
  explanation: When a driver reaches 8 calculated points, the Division of Motor Vehicles
    sends the driver an advisory letter.
- id: 221
  category: penalties_and_points
  question: What is the penalty for accumulating 14 calculated points under the Driver
    Improvement Problem Driver Program?
  choices:
    A: Mandatory 2-month license suspension
    B: Mandatory 4-month license suspension
    C: Mandatory 6-month license suspension
    D: Mandatory 8-month license suspension
  answer: B
  explanation: Accumulating 14 calculated points results in a mandatory 4-month license
    suspension.
- id: 222
  category: penalties_and_points
  question: Under what condition will a speeding violation of 1 to 14 mph over the
    posted speed limit NOT be assessed points for a Class D license holder?
  choices:
    A: If it is the first violation within any 3-year period and the ticket is paid
      through the Voluntary Assessment Center.
    B: If the driver completes a defensive driving course within 30 days.
    C: If the driver has never received a speeding ticket before in their lifetime.
    D: If the driver was passing another vehicle at the time of the violation.
  answer: A
  explanation: A speeding violation of 1 to 14 mph over the limit will not be assessed
    points if it is the first violation within any 3-year period and the ticket is
    paid through the Voluntary Assessment Center or Alderman's Court as a guilty mail
    in or online payment.
- id: 223
  category: penalties_and_points
  question: What is the penalty for a conviction of driving 25 mph over the posted
    speed limit?
  choices:
    A: A warning letter is sent to the driver.
    B: The driver will be suspended for one month.
    C: The driver will be suspended for four months.
    D: The driver's license will be permanently revoked.
  answer: B
  explanation: The driver will be suspended for one month when convicted of driving
    25 mph over the posted speed limit.
- id: 224
  category: penalties_and_points
  question: How long is the license suspension for a driver convicted of driving 50
    mph or more over the posted speed limit?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: A one-year suspension is imposed when convicted of driving 50 mph or
    more over the posted speed limit or driving 100 mph on a highway.
- id: 225
  category: license_system
  question: When is an occupational license NOT issued during a period of suspension?
  choices:
    A: During the last month of the suspension.
    B: During the first month of the suspension.
    C: If the driver has a Class D license.
    D: If the driver is required to pay a reinstatement fee.
  answer: B
  explanation: According to the manual, occupational licenses are not issued during
    the first month of the suspension.
- id: 226
  category: license_system
  question: An occupational license will not be issued if your calculated point level
    reaches or exceeds how many points in a 24-month period?
  choices:
    A: 10 points
    B: 12 points
    C: 14 points
    D: 15 points
  answer: D
  explanation: If the calculated point level reaches 15 or more points in a 24-month
    period, an occupational license will not be issued until the calculated points
    are less than 15 points.
- id: 227
  category: penalties_and_points
  question: What is the consequence of a conviction for driving during a period of
    suspension or revocation?
  choices:
    A: A mandatory 30-day jail sentence.
    B: The suspension or revocation period is extended for a like period, up to one
      year.
    C: A $500 fine and immediate vehicle impoundment.
    D: Permanent revocation of driving privileges.
  answer: B
  explanation: A conviction for driving during suspension or revocation shall extend
    the period of suspension or revocation for a like period, up to one year.
- id: 228
  category: safe_driving_rules
  question: Under Delaware law, an individual is guilty of aggressive driving if they
    are convicted of how many specific Title 21 offenses as a result of continuous
    conduct?
  choices:
    A: Two or more
    B: Three or more
    C: Four or more
    D: Five or more
  answer: B
  explanation: Individuals convicted of three or more of these offenses (such as failure
    to yield, unsafe lane change, etc.) as a result of continuous conduct are guilty
    of aggressive driving.
- id: 229
  category: penalties_and_points
  question: What is the fine for a first offense of aggressive driving?
  choices:
    A: Between $50.00 and $100.00
    B: Between $100.00 and $300.00
    C: Between $300.00 and $500.00
    D: Exactly $500.00
  answer: B
  explanation: Offenders of the aggressive driving law will be fined between $100.00
    and $300.00 for the first offense.
- id: 230
  category: driver_responsibility
  question: What is the minimum length and standard fee for an approved behavioral
    modification/attitudinal-driving course?
  choices:
    A: 4 hours long and $50.00
    B: 6 hours long and $75.00
    C: 8 hours long and $100.00
    D: 10 hours long and $150.00
  answer: C
  explanation: The behavioral modification/attitudinal-driving course is a minimum
    of eight hours long and the fee for the course is $100.00.
- id: 231
  category: defensive_driving
  question: How does completing an approved defensive driving course affect your driving
    record with the DMV?
  choices:
    A: It removes 3 existing points from your overall point value.
    B: It provides a three-point credit applied to future violations for administrative
      action.
    C: It erases your most recent traffic violation.
    D: It prevents your insurance company from seeing your driving record.
  answer: B
  explanation: The satisfactory completion of an approved defensive driving course
    provides a three-point credit that is only applied to future violations for Administrative
    action, and does not remove or reduce existing DMV points.
- id: 232
  category: alcohol_drugs_health
  question: What is the conclusive evidence Blood Alcohol Concentration (BAC) limit
    for driving under the influence in Delaware?
  choices:
    A: '.02'
    B: '.04'
    C: '.08'
    D: '.10'
  answer: C
  explanation: In Delaware, a BAC of .08 or greater or the presence of any illicit
    or recreational drug is conclusive evidence that a driver is under the influence.
- id: 233
  category: alcohol_drugs_health
  question: Which of the following beverages contains the most alcohol?
  choices:
    A: A 12-ounce can of regular beer
    B: A 5-ounce glass of table wine
    C: A 1.5-ounce shot of 80-proof liquor
    D: They all contain the same amount of alcohol
  answer: D
  explanation: A 12-ounce can of beer, a 5-ounce glass of wine, and a cocktail with
    1.5-ounces of 80 proof distilled spirits all contain the same amount of alcohol.
- id: 234
  category: penalties_and_points
  question: What is a potential consequence if a driver refuses to submit to chemical
    testing in Delaware?
  choices:
    A: They will receive a warning ticket.
    B: Their driver's license may be revoked.
    C: They must pay a mandatory $500 fine on the spot.
    D: They will be required to retake the written driving test.
  answer: B
  explanation: If a driver refuses chemical testing, their license may be revoked.
- id: 235
  category: penalties_and_points
  question: Under Delaware's zero tolerance statute, what BAC level mandates a license
    revocation for drivers under the age of 21?
  choices:
    A: '.00'
    B: '.02'
    C: '.04'
    D: '.08'
  answer: B
  explanation: Delaware’s zero tolerance statute mandates a license revocation for
    underage drivers with a .02 BAC.
- id: 236
  category: penalties_and_points
  question: What is the penalty for a commercial motor vehicle driver's first conviction
    of driving with a BAC of .04 or more?
  choices:
    A: Disqualification from driving a commercial vehicle for 6 months
    B: Disqualification from driving a commercial vehicle for one year
    C: Lifetime disqualification from driving a commercial vehicle
    D: A mandatory 30-day jail sentence
  answer: B
  explanation: Any driver operating a commercial motor vehicle who refuses to submit
    to a breath or blood test to determine their BAC, or whose BAC is .04 or more,
    will be disqualified from driving a commercial vehicle for one year.
- id: 237
  category: alcohol_drugs_health
  question: After consuming alcohol, approximately how long does it take for it to
    reach your brain?
  choices:
    A: 5 to 10 minutes
    B: 10 to 15 minutes
    C: 20 to 40 minutes
    D: 1 to 2 hours
  answer: C
  explanation: Alcohol goes from your stomach into your blood and to all parts of
    your body. It reaches your brain in 20 to 40 minutes.
- id: 238
  category: alcohol_drugs_health
  question: Which of the following is the only effective way to sober up after drinking
    alcohol?
  choices:
    A: Drinking strong black coffee
    B: Taking a cold shower
    C: Getting fresh air and exercise
    D: Allowing time to pass
  answer: D
  explanation: There is no way to sober up quickly. Coffee, fresh air, exercise, or
    cold showers will not help. Time is the only thing that will sober you up.
- id: 239
  category: alcohol_drugs_health
  question: How does a person's weight affect their Blood Alcohol Concentration (BAC)?
  choices:
    A: A lower weight person requires less alcohol to reach a specified BAC level.
    B: A higher weight person requires less alcohol to reach a specified BAC level.
    C: Weight has no effect on BAC levels.
    D: A lower weight person processes alcohol faster, keeping their BAC lower.
  answer: A
  explanation: The lower the weight of the drinker, the lower the amount of alcoholic
    beverage it takes to bring the blood alcohol concentration to a specified level.
    It takes about half as much for a person weighing 100 pounds as for another weighing
    200 pounds.
- id: 240
  category: defensive_driving
  question: 'If you take your eyes off the road for 3-4 seconds while traveling at
    55 mph, your vehicle will travel approximately the length of:'
  choices:
    A: A crosswalk
    B: A basketball court
    C: An entire football field
    D: A city block
  answer: C
  explanation: If you take your eyes off the road while traveling 55 mph for 3-4 seconds,
    your vehicle travels the length of an entire football field.
- id: 241
  category: alcohol_drugs_health
  question: What effect do "pep pills" or "uppers" have on a driver?
  choices:
    A: They permanently improve reflexes and reaction time.
    B: They make a driver feel more alert for a short time, but later cause nervousness
      and dizziness.
    C: They safely counteract the effects of alcohol.
    D: They have no effect on a person's ability to drive safely.
  answer: B
  explanation: Pep pills, "uppers," and diet pills can make a driver feel more alert
    for a short time. Later however, they can cause a person to be nervous, dizzy,
    unable to concentrate, and they can affect your vision.
- id: 242
  category: alcohol_drugs_health
  question: What is the primary factor that determines how much alcohol gets into
    the bloodstream?
  choices:
    A: The amount of food in the stomach
    B: How the drinks are mixed
    C: The amount of alcohol in the drinks taken
    D: The type of mixer used with the liquor
  answer: C
  explanation: The rate of this movement and how much alcohol gets into the blood
    depends primarily on how much alcohol is in the drinks taken.
- id: 243
  category: penalties_and_points
  question: If a minor is convicted of driving under the influence of alcohol, how
    long may their license be revoked?
  choices:
    A: For 6 months
    B: For 1 year
    C: Until they reach the age of 18
    D: Until they reach the age of 21
  answer: D
  explanation: If convicted of driving under the influence of alcohol, the minor’s
    license may be revoked until they reach the age of 21 years.
- id: 244
  category: driver_responsibility
  question: Which of the following is considered a dangerous distracted driving behavior?
  choices:
    A: Adjusting the mirrors before starting the vehicle
    B: Engaging in intense emotional conversations with passengers
    C: Checking the speedometer occasionally
    D: Using windshield wipers during rain
  answer: B
  explanation: Engaging in intense, complicated emotional conversations on a cell
    phone or with passengers is listed as a distracted driving activity where you
    may be doing more things than you can manage safely.
- id: 245
  category: safe_driving_rules
  question: According to driving instructors, approximately how many decisions does
    a driver make for every mile of driving?
  choices:
    A: '50'
    B: '100'
    C: '200'
    D: '500'
  answer: C
  explanation: Driving instructors estimate that a driver makes 200 decisions for
    every mile of driving.
- id: 246
  category: alcohol_drugs_health
  question: How does eating food before and while drinking affect alcohol absorption?
  choices:
    A: It prevents the person from getting drunk.
    B: It speeds up how fast alcohol gets into the blood.
    C: It slows down how fast alcohol gets into the blood.
    D: It lowers the total amount of alcohol that enters the bloodstream.
  answer: C
  explanation: Food slows down how fast alcohol gets into your blood. Remember, food
    only slows when the alcohol gets into your blood, it will not keep you from getting
    drunk.
- id: 247
  category: safe_driving_rules
  question: What does the term 'Highway Hypnosis' refer to?
  choices:
    A: A medical condition caused by staring at bright headlights.
    B: The state of being unaware of surroundings caused by monotony.
    C: A trance induced by listening to loud music while driving.
    D: Falling asleep at the wheel after consuming alcohol.
  answer: B
  explanation: According to the manual, 'Highway Hypnosis' commonly refers to the
    state of being unaware of surroundings. It is caused by monotony—the sound of
    the wind, the tires, and the steady hum of the engine.
- id: 248
  category: safe_driving_rules
  question: Which of the following is a sign that a driver may be drowsy?
  choices:
    A: Maintaining a constant, steady speed.
    B: Remembering the last few miles driven in vivid detail.
    C: Having wandering, disconnected thoughts.
    D: Keeping your eyes sharply in focus.
  answer: C
  explanation: The manual lists several signs of drowsy drivers, including having
    wandering, disconnected thoughts, trouble keeping your head up, and eyes going
    out of focus.
- id: 249
  category: alcohol_drugs_health
  question: If you are charged with a DUI, can you use the fact that you are legally
    entitled to use a drug as a defense?
  choices:
    A: Yes, if you have a valid prescription from a doctor.
    B: Yes, but only for over-the-counter medications.
    C: No, being legally entitled to use alcohol or a drug shall not be considered
      a defense.
    D: No, unless the drug was administered by a medical professional immediately
      before driving.
  answer: C
  explanation: 'The manual states: ''The fact that a person charged with violating
    the DUI law is, or has been, legally entitled to use alcohol or a drug shall not
    be considered a defense.'''
- id: 250
  category: alcohol_drugs_health
  question: 'Under Delaware''s Implied Consent Law, anyone arrested for driving under
    the influence is deemed to have given consent to:'
  choices:
    A: A search of their vehicle's trunk and interior.
    B: Chemical tests of their breath, blood, and/or urine.
    C: A mandatory 30-day jail sentence.
    D: Immediate confiscation and sale of their vehicle.
  answer: B
  explanation: The Implied Consent Law states that anyone arrested for driving under
    the influence shall be deemed to have given consent to submit to a chemical test
    or tests of their breath, blood, and/or urine.
- id: 251
  category: penalties_and_points
  question: What happens to a juvenile convicted of a Delaware DUI violation?
  choices:
    A: Their license is revoked for exactly 6 months.
    B: They must pay a $1,000 fine and complete 100 hours of community service.
    C: The Family Court submits an order to revoke their license until they are 21
      years old.
    D: Their license is suspended until they graduate from high school.
  answer: C
  explanation: For a violation of the Delaware DUI law, the Family Court must submit
    an order to the Division of Motor Vehicles to revoke the license and/or driving
    privilege of any juvenile until such time as they are legally permitted to drink
    alcoholic beverages (21 years old).
- id: 252
  category: penalties_and_points
  question: Under the Zero Tolerance Law, what is the penalty for a first offense
    for anyone under 21 who drives after consuming alcoholic beverages?
  choices:
    A: Driver license revoked for two months.
    B: Driver license revoked for six months.
    C: A mandatory $500 fine.
    D: Driver license revoked until age 21.
  answer: A
  explanation: The Zero Tolerance Law states that anyone under 21 who drives after
    consuming alcoholic beverages shall have their driver license revoked for a period
    of two months for the first offense.
- id: 253
  category: alcohol_drugs_health
  question: 'The underage consumption or possession law does NOT apply when:'
  choices:
    A: The alcohol is consumed at a private party with friends.
    B: The alcohol is consumed in connection with any religious service.
    C: The person is at least 18 years old and accompanied by a spouse.
    D: The alcohol was purchased legally in another state.
  answer: B
  explanation: The manual notes that this section shall not apply to the possession
    or consumption of alcoholic liquor in connection with any religious service or
    by members of the same family within the private home.
- id: 254
  category: penalties_and_points
  question: After a DUI arrest, how long does a driver have to request an administrative
    hearing before their temporary license expires and revocation begins?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: The officer will issue a 15-day temporary license. The driver will
    have 15 days to request an administrative hearing. The license will be revoked
    at the end of the 15-day period if no hearing is requested.
- id: 255
  category: alcohol_drugs_health
  question: At a Motor Vehicle Administrative Hearing, what Blood Alcohol Concentration
    (BAC) is considered conclusive evidence that the driver was under the influence?
  choices:
    A: .04 or greater
    B: .05 or greater
    C: .08 or greater
    D: .10 or greater
  answer: C
  explanation: A chemical test of .08 BAC or greater, or the presence of any drug
    is conclusive evidence that the driver was under the influence.
- id: 256
  category: penalties_and_points
  question: 'If a driver receives an unfavorable ruling at an administrative hearing
    for refusing a chemical test (1st offense), their license will be revoked for:'
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 18 months
  answer: C
  explanation: If the driver receives an unfavorable ruling at an administrative hearing
    for a refused chemical test, the revocation is 12 months for a 1st offense.
- id: 257
  category: license_system
  question: Which of the following is a requirement for reinstating a driver license
    after a revocation for probable cause or a refused chemical test?
  choices:
    A: Payment of a $100 reinstatement fee.
    B: Payment of a $200 reinstatement fee.
    C: Completion of 50 hours of community service.
    D: Purchasing a brand new vehicle.
  answer: B
  explanation: One of the terms for reinstatement of a driver license and/or driving
    privilege is the payment of the $200.00 reinstatement fee.
- id: 258
  category: penalties_and_points
  question: For a first offense DUI with a BAC of .20 or greater, how long will the
    DMV revoke the driver's license?
  choices:
    A: 12 months
    B: 18 months
    C: 24 months
    D: 30 months
  answer: C
  explanation: For a first offense DUI, the loss of license by DMV is 24 months for
    a BAC of .20 or greater or refusal to submit to a chemical test.
- id: 259
  category: penalties_and_points
  question: How long must a person who elects the First Offender Election (FOE) program
    with an IID license remain on the Ignition Interlock Device?
  choices:
    A: Two months
    B: Four months
    C: Six months
    D: Twelve months
  answer: B
  explanation: Any person who elects the FOE program with the IID license, must remain
    on the IID for four months from the date the IID license was issued.
- id: 260
  category: penalties_and_points
  question: What is the court sanction fine range for a second DUI offense?
  choices:
    A: $500.00 to $1,500.00
    B: $750.00 to $2,500.00
    C: $1,000.00 to $3,000.00
    D: $1,500.00 to $5,000.00
  answer: B
  explanation: For a second DUI offense, the sanctions by the Court include a fine
    of $750.00 to $2,500.00.
- id: 261
  category: penalties_and_points
  question: What is the DMV loss of license period for a second DUI offense with a
    BAC of .20 or greater, or refusal to submit to a chemical test?
  choices:
    A: 18 months
    B: 24 months
    C: 30 months
    D: 36 months
  answer: C
  explanation: According to the manual, the loss of license by DMV for a second DUI
    offense is 30 months for a BAC of .20 or greater, or refusal to submit to a chemical
    test.
- id: 262
  category: penalties_and_points
  question: 'A third DUI offense occurring any time after two prior offenses is classified
    by the court as a:'
  choices:
    A: Class D Felony
    B: Class E Felony
    C: Class F Felony
    D: Class G Felony
  answer: D
  explanation: The manual states that a Third DUI Offense is a Class G Felony occurring
    any time after two prior offenses.
- id: 263
  category: penalties_and_points
  question: What is the maximum fine for a seventh or greater DUI offense?
  choices:
    A: Up to $5,000.00
    B: Up to $7,000.00
    C: Up to $10,000.00
    D: Up to $15,000.00
  answer: D
  explanation: For a seventh or greater DUI offense, the sanctions by the court include
    a fine of up to $15,000.00.
- id: 264
  category: penalties_and_points
  question: Is an Ignition Interlock Device (IID) license available for drivers operating
    Commercial Driver License (CDL) class vehicles?
  choices:
    A: Yes, but only for first-time DUI offenders.
    B: Yes, after completing a 6-month waiting period.
    C: No, the IID license is not available for CDL class vehicles.
    D: No, unless the driver passes an additional road skills test.
  answer: C
  explanation: The manual explicitly states, "The IID license is not available for
    CDL class vehicles or valid for any peripheral endorsements."
- id: 265
  category: penalties_and_points
  question: How long is the minimum mandated revocation period before a driver is
    eligible to apply for an IID after a Third Offense DUI Conviction?
  choices:
    A: 30 to 45 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: C
  explanation: All DUI offenders are eligible to apply for the IID after a minimum
    mandated revocation period. For a Third Offense Conviction, this period is 90
    days.
- id: 266
  category: penalties_and_points
  question: If a DUI offender chooses to obtain an IID license for a fourth and subsequent
    conviction, how long must they have the device on their vehicle(s)?
  choices:
    A: 16 to 28 months
    B: 21 to 33 months
    C: At least 36 months
    D: At least 54 months
  answer: D
  explanation: Per Title 21, Section 4177C(d) of the Delaware Code, the IID time requirement
    for a Fourth and Subsequent Conviction is at least 54 months.
- id: 267
  category: vehicle_information
  question: How many days do new residents have to title and register their vehicles
    after moving to Delaware?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: The manual states that new residents must title/register their vehicles
    within 60 days after moving to Delaware.
- id: 268
  category: vehicle_information
  question: High beam headlights must be aimed and strong enough to reveal persons
    and vehicles at least how far ahead?
  choices:
    A: 100 feet
    B: 250 feet
    C: 350 feet
    D: 500 feet
  answer: C
  explanation: Required equipment rules state that high beams must be aimed and strong
    enough to reveal persons and vehicles at least 350 feet ahead.
- id: 269
  category: safe_driving_rules
  question: When must your vehicle's headlights be turned on due to inclement weather?
  choices:
    A: Whenever the defroster is running
    B: Whenever the windshield wipers are in use
    C: Only when visibility is less than 500 feet
    D: Only when driving on the highway
  answer: B
  explanation: The manual requires that headlights must be on when windshield wipers
    are in use due to inclement weather.
- id: 270
  category: vehicle_information
  question: What are the requirements for taillights on an automobile registered in
    Delaware?
  choices:
    A: At least one red light visible from 350 feet
    B: At least two red lights visible from 500 feet
    C: At least two amber lights visible from 100 feet
    D: At least one white light visible from 500 feet
  answer: B
  explanation: Every automobile must have at least two, original design, red lights
    on the rear that are visible from a distance of 500 feet.
- id: 271
  category: vehicle_information
  question: A license plate light must be white and strong enough to make the registration
    number visible from what distance?
  choices:
    A: 50 feet
    B: 100 feet
    C: 350 feet
    D: 500 feet
  answer: A
  explanation: The license plate light must be white and strong enough for the number
    on the registration plate to be seen from a distance of 50 feet.
- id: 272
  category: vehicle_information
  question: 'Stop lights must light up when the brake pedal is pushed and be visible
    from a distance of at least:'
  choices:
    A: 50 feet in normal sunlight
    B: 100 feet in normal sunlight
    C: 350 feet in normal sunlight
    D: 500 feet in normal sunlight
  answer: B
  explanation: Stop lights must light when the brake pedal is pushed and be visible
    from a distance of at least 100 feet in normal sunlight.
- id: 273
  category: vehicle_information
  question: For vehicles manufactured after 1953, what colors are permitted for the
    rear turn signals?
  choices:
    A: Any shade between white and amber
    B: Any shade between amber and red
    C: Only solid red
    D: Only solid amber
  answer: B
  explanation: According to the manual, turn signals in the front may be any shade
    between white and amber, while those in the rear may be any shade between amber
    and red.
- id: 274
  category: vehicle_information
  question: 'The parking or emergency brake must be able to stop the vehicle within
    a distance of 54 feet from a speed of:'
  choices:
    A: 10 mph
    B: 20 mph
    C: 30 mph
    D: 40 mph
  answer: B
  explanation: The parking or emergency brake must stop the vehicle within a distance
    of 54 feet from a speed of 20 mph.
- id: 275
  category: vehicle_information
  question: What type of glass must the windshield and all side and rear windows be
    made of?
  choices:
    A: Tinted privacy glass
    B: Shatterproof plexiglass
    C: Automotive safety glass
    D: Tempered commercial glass
  answer: C
  explanation: The manual states that the windshield and all side and rear windows
    must be made of automotive safety glass.
- id: 276
  category: vehicle_information
  question: Your vehicle's horn must be able to make a sound that can be heard under
    normal conditions from at least how far away?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: The manual states that a vehicle's horn must be able to make a sound
    that can be heard under normal conditions at least 200 feet away.
- id: 277
  category: safe_driving_rules
  question: 'Delaware law requires your headlights to be turned on when:'
  choices:
    A: You are driving in a designated work zone.
    B: You use your windshield wipers.
    C: You are driving on a multi-lane highway.
    D: You are driving between 8:00 AM and 5:00 PM.
  answer: B
  explanation: Delaware law requires your headlights to be on any time you use your
    windshield wipers.
- id: 278
  category: safe_driving_rules
  question: You must switch your headlights to low beams how far in advance of meeting
    another vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: Headlights must be switched to low beams 500 feet before meeting another
    vehicle.
- id: 279
  category: vehicle_information
  question: During which of the following periods are studded tires legal in Delaware?
  choices:
    A: November 1 to March 31
    B: October 15 to April 15
    C: September 1 to May 1
    D: December 1 to February 28
  answer: B
  explanation: Studded tires are legal in Delaware from October 15 to April 15 inclusive.
- id: 280
  category: safe_driving_rules
  question: 'When one vehicle is towing another, the draw bar or connection between
    them must be no longer than:'
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: The draw bar or other connection between any two vehicles, one of which
    is towing the other, must be no more than 15 feet long.
- id: 281
  category: safe_driving_rules
  question: If a chain, rope, or cable is used to tow a vehicle, what must be attached
    to it?
  choices:
    A: A red flag at least 12 inches square
    B: A yellow reflective triangle
    C: A white flag at least 18 inches square
    D: A flashing amber light
  answer: A
  explanation: If a chain, rope or cable is used to tow a vehicle, a red flag at least
    12 inches square must be attached to it.
- id: 282
  category: driver_responsibility
  question: If a police officer pulls over a vehicle and sees unbuckled occupants
    inside, who receives the ticket?
  choices:
    A: Only the unrestrained passengers
    B: The driver of the vehicle
    C: Both the driver and the unrestrained passengers
    D: The registered owner of the vehicle, even if not present
  answer: B
  explanation: The driver of the vehicle receives a ticket for any unrestrained or
    improperly restrained vehicle occupants.
- id: 283
  category: license_system
  question: New residents must title and register their vehicles within how many days
    after becoming a Delaware resident?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: New residents must title/register their vehicles within 60 days after
    becoming a Delaware resident.
- id: 284
  category: driver_responsibility
  question: What must a vehicle owner do before cancelling their vehicle insurance
    for any reason?
  choices:
    A: Pay a $50 cancellation fee to the DMV
    B: Surrender their valid license plate to the Division
    C: Notify their local police department
    D: Obtain a temporary 30-day registration
  answer: B
  explanation: Owners cancelling insurance for any reason must first surrender their
    valid license plate to the Division. Failure to do so will result in fines.
- id: 285
  category: penalties_and_points
  question: What is the penalty for a first offense of operating an uninsured vehicle
    in Delaware?
  choices:
    A: A fine of $500 and a 30-day suspension
    B: A fine between $1,500 and $2,000 and a mandatory six-month suspension
    C: A fine of $3,000 and vehicle impoundment
    D: A fine of $100 and a warning
  answer: B
  explanation: The penalty for operating an uninsured vehicle is a fine not less than
    $1,500.00 nor more than $2,000.00 and mandatory suspension of driver license and/or
    driving privileges for six months.
- id: 286
  category: vehicle_information
  question: 'Flashing lights are generally prohibited on ordinary motor vehicles,
    except when used for:'
  choices:
    A: Driving in heavy fog
    B: Indicating a traffic hazard with four-way flashers
    C: Driving below the posted speed limit
    D: Warning other drivers of a police speed trap
  answer: B
  explanation: Flashing lights are generally prohibited except on emergency vehicles,
    school buses, snow removal equipment, for indicating turns, or as a means of indicating
    a traffic hazard (four-way flashers).
- id: 287
  category: vehicle_information
  question: If a vehicle has tinted windows installed, what additional equipment must
    the vehicle have?
  choices:
    A: Outside mirrors on both the right and left sides
    B: A rearview camera system
    C: High-intensity discharge headlights
    D: A special license plate sticker
  answer: A
  explanation: Vehicles with tint installed must have outside mirrors on both the
    right and left sides of the vehicle.
- id: 288
  category: safe_driving_rules
  question: You must switch your headlights to low beams when you are within what
    distance of a vehicle you are following?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Headlights must be switched to low beams when within 200 feet of the
    vehicle you are following.
- id: 289
  category: license_system
  question: State law requires that you report a change of address to the Division
    of Motor Vehicles within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: State law requires changes of address to be reported to the Division
    of Motor Vehicles within 30 days.
- id: 290
  category: vehicle_information
  question: What is the minimum required tire tread depth to pass a Delaware vehicle
    inspection?
  choices:
    A: 1/32 inch
    B: 2/32 inch
    C: 3/32 inch
    D: 4/32 inch
  answer: B
  explanation: According to the manual, tread depth must be at least 2/32 inch measured
    in two adjacent treads.
- id: 291
  category: vehicle_information
  question: During a windshield inspection, a crack of what size will result in a
    mandatory failure?
  choices:
    A: Over 2 inches
    B: Over 3 inches
    C: Over 4 inches
    D: Over 5 inches
  answer: D
  explanation: The manual states that windshields must be free of cracks, holes, or
    breaks, and that cracks over five inches or star chips over one inch are mandatory
    failure items.
- id: 292
  category: vehicle_information
  question: How much does a vehicle safety inspection cost for a Delaware resident?
  choices:
    A: $10.00
    B: $20.00
    C: $35.00
    D: There is no charge
  answer: D
  explanation: The manual explicitly states, "There is no charge for an inspection
    for Delaware residents."
- id: 293
  category: vehicle_information
  question: According to Delaware regulations, where is the application of window
    tinting or sun-screening devices strictly prohibited?
  choices:
    A: The rear window only
    B: The rear side windows
    C: The front windshield and front side windows
    D: Any window on the vehicle
  answer: C
  explanation: The manual specifies that no tinting or sun-screening device may be
    applied to the front windshield or to the front side windows.
- id: 294
  category: penalties_and_points
  question: What is the late fee assessed for renewing a vehicle registration after
    it has expired?
  choices:
    A: $10.00
    B: $15.00
    C: $20.00
    D: $35.00
  answer: C
  explanation: A late fee of $20.00 is assessed for renewal after vehicle registration
    expiration.
- id: 295
  category: vehicle_information
  question: When bringing a standard motor vehicle into Delaware from another state,
    what is the vehicle document fee that must be paid?
  choices:
    A: 3.75 percent of the vehicle's value
    B: 4.25 percent of the vehicle's value
    C: A flat fee of $35.00
    D: A flat fee of $55.00
  answer: B
  explanation: Whenever a motor vehicle is brought into Delaware from another state,
    the owner must pay a vehicle document fee of 4.25 percent of the value of the
    vehicle (unless proof of a similar tax paid to another state within 90 days is
    presented).
- id: 296
  category: vehicle_information
  question: What is the fee for a Delaware certificate of title if there is a lien
    against the vehicle?
  choices:
    A: $20.00
    B: $35.00
    C: $40.00
    D: $55.00
  answer: D
  explanation: The title fee is $35.00 if there is no lien or $55.00 if there is a
    lien against the vehicle.
- id: 297
  category: license_system
  question: If an applicant for a certificate of title is under 18 years of age, who
    must sign the application?
  choices:
    A: A licensed driving instructor
    B: A notary public
    C: A father, mother, guardian, or court-appointed custodian
    D: The applicant only
  answer: C
  explanation: If you are less than 18 years of age, your application for a certificate
    of title must be signed by your father, mother, guardian, or court-appointed custodian
    granting consent.
- id: 298
  category: vehicle_information
  question: How early can you have your vehicle inspected prior to the expiration
    date of your registration?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: You may have your vehicle inspected any time 90 days prior to the expiration
    date of the registration.
- id: 299
  category: vehicle_information
  question: Trailers weighing up to what amount do NOT require re-inspection prior
    to registration renewal?
  choices:
    A: 2,000 pounds or less
    B: 3,000 pounds or less
    C: 4,000 pounds or less
    D: 5,000 pounds or less
  answer: C
  explanation: Trailers weighing 4,000 pounds or less do not require re-inspection
    prior to renewal of the registration.
- id: 300
  category: license_system
  question: If you change your address within Delaware, how many days do you have
    to notify the DMV?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: If you change your address within Delaware, you have thirty (30) days
    in which to notify both the Vehicle Services and Driver License Sections of the
    DMV.
- id: 301
  category: license_system
  question: When changing your name, what must be completed BEFORE making the change
    on your vehicle title and registration?
  choices:
    A: You must change your name on your driver license
    B: You must get a new vehicle inspection
    C: You must pay a $20 late fee
    D: You must notify your insurance company in writing
  answer: A
  explanation: This name change must be completed on your driver license prior to
    making the change on the title and registration.
- id: 302
  category: vehicle_information
  question: Delaware residents may renew their registration by mail if they are temporarily
    residing more than how many miles out of state?
  choices:
    A: 50 miles
    B: 100 miles
    C: 150 miles
    D: 200 miles
  answer: D
  explanation: Delaware residents who are temporarily residing more than 200 miles
    out of state may renew their registration by mail.
- id: 303
  category: vehicle_information
  question: What type of emissions test is used for 1996 gas-powered and newer vehicles?
  choices:
    A: Exhaust pipe sniffer test
    B: Onboard Diagnostic Test (OBD-II)
    C: Visual smoke inspection
    D: Catalytic converter pressure test
  answer: B
  explanation: 1996 gas-powered and 1997 diesel-powered, and newer vehicles will be
    tested using the Onboard Diagnostic Test (OBD-II).
- id: 304
  category: vehicle_information
  question: What is the maximum allowable bumper height on passenger cars, measured
    from the ground to the bottom of the bumper?
  choices:
    A: 18 inches
    B: 20 inches
    C: 22 inches
    D: 24 inches
  answer: C
  explanation: Bumper height on passenger cars must not exceed 22 inches from the
    ground to the bottom of the bumper.
- id: 305
  category: vehicle_information
  question: How far out of state must a Delaware resident be temporarily residing
    to be eligible to renew their vehicle registration by mail?
  choices:
    A: More than 50 miles
    B: More than 100 miles
    C: More than 200 miles
    D: More than 500 miles
  answer: C
  explanation: According to the manual, Delaware residents who are temporarily residing
    more than 200 miles out of state (such as military personnel and college students)
    may renew their registration by mail.
- id: 306
  category: driver_responsibility
  question: Which documents must accompany a motor vehicle whenever it is operated
    in Delaware?
  choices:
    A: The vehicle's title and the driver's birth certificate
    B: The registration certificate and proof of liability insurance
    C: The vehicle's owner manual and a recent inspection report
    D: The driver's social security card and the vehicle's title
  answer: B
  explanation: The manual states that the registration certificate and proof of liability
    insurance must accompany the motor vehicle whenever it is operated.
- id: 307
  category: vehicle_information
  question: Where must the registration sticker showing the year and month of expiration
    be placed on the license plate?
  choices:
    A: In the upper left corner
    B: In the upper right corner
    C: In the lower left corner
    D: In the lower right corner
  answer: D
  explanation: The manual specifies that the license plate must bear the sticker showing
    the year and month of expiration on the lower right corner of the plate.
- id: 308
  category: vehicle_information
  question: What is the grace period for an expired vehicle registration in Delaware?
  choices:
    A: 30 days
    B: 15 days
    C: 7 days
    D: There is no grace period
  answer: D
  explanation: The manual explicitly states that your registration expires at midnight
    on the day of the month indicated on the sticker, and 'There is no grace period.'
- id: 309
  category: safe_driving_rules
  question: According to Delaware motor vehicle laws, who is given the right-of-way?
  choices:
    A: The vehicle that arrives first at an intersection
    B: Pedestrians in all situations
    C: No one is given the right-of-way; the law only describes who is to yield
    D: Vehicles traveling on a multi-lane highway
  answer: C
  explanation: The manual notes that motor vehicle laws of Delaware and other states
    do not give anyone the right-of-way; rather, the law describes who is to yield
    the right-of-way.
- id: 310
  category: signs_and_signals
  question: Under what condition is a left turn on a steady red light permissible
    in Delaware?
  choices:
    A: When turning from a two-way street onto a one-way street
    B: When turning from a one-way street to another one-way street after a full stop
    C: Anytime there is no oncoming traffic
    D: Left turns on red are never permitted
  answer: B
  explanation: Left turns on red are permissible after a full stop from a one-way
    street to another one-way street unless prohibited by a posted sign or a steady
    red arrow.
- id: 311
  category: signs_and_signals
  question: What does a flashing red traffic light mean?
  choices:
    A: Slow down and proceed with caution
    B: The traffic signal is broken and you have the right-of-way
    C: It means the same as a stop sign; you must come to a complete stop
    D: Prepare to stop as the light is turning solid red
  answer: C
  explanation: The manual states that a flashing red light means the same as a stop
    sign. You must come to a complete stop and proceed only when safe.
- id: 312
  category: signs_and_signals
  question: What should a driver do when approaching an intersection where the traffic
    signals are dark or not illuminated?
  choices:
    A: Maintain speed and proceed if the intersection is clear
    B: Treat the intersection as a four-way stop
    C: Reduce speed and prepare to yield to other vehicles in or approaching the intersection
    D: Pull over and wait for the lights to turn back on
  answer: C
  explanation: In the event of dark traffic signals, the approaching driver shall
    reduce speed and prepare to yield to other vehicles that are in or approaching
    the intersection.
- id: 313
  category: signs_and_signals
  question: What is required when you encounter a flashing red arrow?
  choices:
    A: You may not proceed in the direction of the arrow under any circumstances
    B: You may turn in the direction of the arrow after coming to a full stop and
      yielding to traffic
    C: You must slow down and proceed without stopping if the way is clear
    D: You must wait for a green arrow before making your turn
  answer: B
  explanation: Turns are permitted in the direction of a flashing red arrow after
    coming to a full stop, which enables drivers to select a safe gap in traffic before
    completing the turn.
- id: 314
  category: signs_and_signals
  question: What does a flashing yellow arrow indicate?
  choices:
    A: The green arrow display has ended and you must stop
    B: Movement in the indicated direction is permitted after yielding to opposing
      traffic and pedestrians
    C: You have the exclusive right-of-way to turn
    D: The traffic signal is about to turn green
  answer: B
  explanation: A flashing yellow arrow means the movement in the indicated direction
    is permitted after yielding to opposing traffic and pedestrians.
- id: 315
  category: sharing_the_road
  question: What does a flashing 'DON'T WALK' pedestrian signal mean?
  choices:
    A: Pedestrians should not start to cross, but those already crossing should finish
      as rapidly as possible
    B: Pedestrians may begin crossing but must yield to turning vehicles
    C: Pedestrians must stop immediately in the crosswalk and wait for the next signal
    D: The pedestrian signal is out of order
  answer: A
  explanation: The flashing DON'T WALK signal means that if the pedestrian has started
    to cross the street, they should finish crossing as rapidly as possible. If they
    have not started, they should not start.
- id: 316
  category: sharing_the_road
  question: What is the purpose of an Accessible Pedestrian Signal (APS)?
  choices:
    A: To stop traffic automatically when a pedestrian approaches
    B: To communicate pedestrian signal information in non-visual formats for the
      blind or visually impaired
    C: To provide extra crossing time for elderly pedestrians
    D: To record video of vehicles that fail to yield at crosswalks
  answer: B
  explanation: An APS communicates pedestrian signal information in non-visual formats
    (audible tones, verbal messages, vibrating surfaces) to let pedestrians who are
    blind or visually impaired know when the WALK interval begins.
- id: 317
  category: signs_and_signals
  question: How is a High Intensity Activated Crosswalk (HAWK) signal activated?
  choices:
    A: By a vehicle driving over a sensor in the road
    B: By a pedestrian pressing the crosswalk button
    C: By an approaching emergency vehicle
    D: It operates on a continuous automatic timer
  answer: B
  explanation: The HAWK signal is activated when a pedestrian presses the crosswalk
    button, which triggers a series of stages to stop traffic so pedestrians can cross.
- id: 318
  category: signs_and_signals
  question: How does a Rectangular Rapid-Flashing Beacon differ from a regular beacon?
  choices:
    A: It flashes in a slow, steady rhythm
    B: It displays a solid red light instead of a flashing light
    C: It flashes more rapidly and in a 'stutter' pattern
    D: It is only activated during school hours
  answer: C
  explanation: The manual states that Rectangular Rapid-Flashing Beacons flash more
    rapidly and in a 'stutter' pattern, as opposed to the regular flash rate of most
    beacons.
- id: 319
  category: signs_and_signals
  question: Which of the following describes the shape and color of a stop sign?
  choices:
    A: A 4-sided diamond that is yellow with black letters
    B: An 8-sided sign that is red with white letters
    C: A circular sign that is red with white letters
    D: A 3-sided triangle that is red and white
  answer: B
  explanation: 'The manual explicitly states: ''The stop sign is the only 8-sided
    sign you will see on the highway. It’s red with white letters.'''
- id: 320
  category: signs_and_signals
  question: When approaching an intersection with a stop sign, where must you make
    a complete stop if there is no stop line or crosswalk?
  choices:
    A: Ten feet before the stop sign
    B: Before entering the intersection
    C: Next to the stop sign
    D: After yielding to the first vehicle on the right
  answer: B
  explanation: The manual states that if there is no stop line or crosswalk, you must
    make a complete stop before entering the intersection.
- id: 321
  category: sharing_the_road
  question: Which traffic signals must bicyclists obey when traveling in general travel
    lanes rather than designated bicycle lanes?
  choices:
    A: Only bicycle-shaped signal indicators
    B: Pedestrian crossing signals
    C: The regular circular and arrow traffic signals
    D: They are not required to obey traffic signals in general lanes
  answer: C
  explanation: According to the manual, bicyclists traveling in general travel lanes
    are to obey the regular circular and arrow traffic signals.
- id: 322
  category: signs_and_signals
  question: What is the typical color scheme and shape of regulatory signs?
  choices:
    A: Diamond shaped and yellow with black lettering
    B: Rectangular with white letters on a green background
    C: Square, rectangular, or special shape, usually white, red, or black
    D: Five-sided and fluorescent yellow-green
  answer: C
  explanation: Regulatory signs are square, rectangular, or have a special shape and
    are usually white, red, or black with black, red, white, or green letters or symbols.
- id: 323
  category: signs_and_signals
  question: What shape and color is the sign used exclusively to warn of schools and
    school crossings?
  choices:
    A: Round, black on yellow
    B: Five-sided, black on yellow or fluorescent yellow-green
    C: Diamond, black on orange
    D: Rectangular, white on blue
  answer: B
  explanation: The manual specifies that a five-sided sign, black on yellow (or fluorescent
    yellow-green), is used only to warn of schools and school crossings.
- id: 324
  category: signs_and_signals
  question: What does a round sign with black lettering on a yellow background indicate?
  choices:
    A: A roundabout is ahead
    B: You are approaching a highway-rail intersection
    C: A no-passing zone begins
    D: You are entering a school zone
  answer: B
  explanation: A round sign that is black on yellow is used as an advance warning
    that you are approaching a highway-rail intersection.
- id: 325
  category: safe_driving_rules
  question: When driving on a roadway marked with a 'slippery when wet' warning sign,
    when is the road surface generally the most hazardous?
  choices:
    A: During the first half hour of rain
    B: After it has been raining for several hours
    C: Immediately after the rain stops
    D: When the temperature drops below freezing
  answer: A
  explanation: The manual notes for the 'Roadway slippery when wet' sign that the
    first half hour of rain is the most hazardous.
- id: 326
  category: vehicle_information
  question: What action should you take when you see a warning sign indicating a steep
    hill ahead?
  choices:
    A: Shift into neutral to coast down the hill
    B: Accelerate to maintain your speed
    C: Slow down and be ready to shift to a lower gear
    D: Apply your emergency brake continuously
  answer: C
  explanation: For a steep hill ahead, the manual advises to slow down and be ready
    to shift to a lower gear to control speed and save brakes.
- id: 327
  category: safe_driving_rules
  question: How should drivers execute a 'zipper merge' when approaching a lane reduction?
  choices:
    A: Merge as early as possible into the open lane
    B: Stop in the closing lane and wait for a gap in traffic
    C: Use both lanes to advance to the lane reduction point and merge by alternating
      turns
    D: Speed up to pass all vehicles before the lane ends
  answer: C
  explanation: The zipper merge method expects drivers in merging lanes to use both
    lanes to advance to the lane reduction point and merge at the location, alternating
    turns.
- id: 328
  category: signs_and_signals
  question: What colors are used on the shield-shaped route markers for the interstate
    highway system?
  choices:
    A: Black numbers on a white background
    B: White letters on a green background
    C: White letters on a brown background
    D: Red top quarter with white letters, and a blue bottom with white numbers
  answer: D
  explanation: The interstate system has route markers where the top quarter carries
    the legend 'interstate' in white letters on a red background while the bottom
    three-quarters is blue with the route number in large white letters.
- id: 329
  category: signs_and_signals
  question: Which signs are typically rectangular with a blue background and white
    letters?
  choices:
    A: Motorist service signs (e.g., gas, food, lodging)
    B: Recreation signs (e.g., state parks)
    C: Guide signs for destinations and distances
    D: Regulatory signs for speed limits
  answer: A
  explanation: Information signs for motorist services usually have white letters
    on a rectangular blue background.
- id: 330
  category: signs_and_signals
  question: What does a red circular flashing beacon supplementing a sign indicate?
  choices:
    A: A warning or speed limit sign
    B: A Stop or Do Not Enter sign
    C: A highway-rail intersection
    D: A school zone speed limit
  answer: B
  explanation: The manual states that beacons supplementing Stop and Do Not Enter
    signs are red.
- id: 331
  category: penalties_and_points
  question: What is the penalty for exceeding the speed limit in a highway work zone?
  choices:
    A: Your license is immediately suspended
    B: You will be required to attend traffic school
    C: The fines for the speeding violation are doubled
    D: You will receive a warning for the first offense
  answer: C
  explanation: The manual explicitly states that fines for exceeding the speed limit
    in a work zone are doubled.
- id: 332
  category: defensive_driving
  question: Which of the following is a recommended safe driving practice when traveling
    through a work zone?
  choices:
    A: Weave from lane to lane to avoid slow vehicles
    B: Brake suddenly if you see workers
    C: Brake gradually to give drivers behind you ample time to slow down
    D: Drive on the shoulder to bypass stopped traffic
  answer: C
  explanation: 'When driving through a work zone, the manual advises: ''Do not weave
    from lane to lane. Brake gradually to give drivers behind you ample time to slow
    down.'''
- id: 333
  category: signs_and_signals
  question: What does an 'Added lane' warning sign indicate to drivers?
  choices:
    A: Merging is not required, but watch for other vehicles changing lanes
    B: You must merge immediately into the left lane
    C: The roadway narrows to one lane ahead
    D: Two-way traffic is beginning
  answer: A
  explanation: The 'Added lane' sign means merging is not required, but you should
    watch for other vehicles changing lanes.
- id: 334
  category: signs_and_signals
  question: When driving under an overhead lane signal, what does it mean if the word
    'ONLY' is used with an arrow?
  choices:
    A: You may choose to go straight or turn in the direction of the arrow
    B: You must go in the direction the arrow points with no other option
    C: Only high-occupancy vehicles may use the lane
    D: The lane is reserved for emergency vehicles only
  answer: B
  explanation: The manual states that when the word 'ONLY' is used on an overhead
    lane signal, you must go in the direction the arrow points; there is no option.
- id: 335
  category: signs_and_signals
  question: What color and shape are most warning signs used in highway and street
    work areas?
  choices:
    A: Red and octagonal
    B: Orange and diamond-shaped
    C: Yellow and circular
    D: White and rectangular
  answer: B
  explanation: The manual states that most warning signs used in highway and street
    work areas are orange and diamond shaped.
- id: 336
  category: safe_driving_rules
  question: Under Delaware law, which of the following actions is permitted while
    driving?
  choices:
    A: Texting on a hand-held device
    B: Using a laptop or portable computer
    C: Dialing a phone number and then putting the device down
    D: Playing games on a hand-held electronic device
  answer: C
  explanation: Drivers are permitted to dial a phone number or to activate/deactivate
    their wireless equipment, and then they must put the device down.
- id: 337
  category: license_system
  question: What is the cell phone usage rule for drivers with a Graduated Driver
    License (GDL)?
  choices:
    A: They may use hands-free devices only.
    B: All cell phone or electronic device use is prohibited.
    C: They may text but not make voice calls.
    D: They may use hand-held devices only to report an emergency.
  answer: B
  explanation: The manual notes that all cell phone or electronic device use, including
    hands-free, is prohibited by drivers with a Graduated Driver License (GDL).
- id: 338
  category: safe_driving_rules
  question: How far in advance must you signal prior to your intended action, such
    as stopping, turning, or changing lanes?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Delaware law requires you to signal 300 feet prior to your intended
    action.
- id: 339
  category: sharing_the_road
  question: When must you stop for a school bus that is loading or unloading children?
  choices:
    A: Only when you are traveling in the same direction as the bus.
    B: From either direction, unless you are on the opposite side of a highway with
      four or more lanes.
    C: Only if the bus is stopped on a two-lane road.
    D: You are never required to stop, but you must slow down to 15 mph.
  answer: B
  explanation: You must always stop before reaching any school bus from either direction
    when it is stopped to load or unload school children except when you are on the
    opposite side of a highway having four or more lanes.
- id: 340
  category: safe_driving_rules
  question: What must you do upon the immediate approach of an authorized emergency
    vehicle using a siren or flashing lights?
  choices:
    A: Stop immediately in your current lane.
    B: Speed up to clear the intersection quickly.
    C: Yield the right-of-way and drive to the right-hand edge or curb clear of any
      intersections.
    D: Move to the left lane and slow down.
  answer: C
  explanation: Every other vehicle shall yield the right-of-way and shall immediately
    drive to the right-hand edge or curb of the roadway clear of any intersections
    until the authorized emergency vehicle has passed.
- id: 341
  category: defensive_driving
  question: If you are on a two-lane roadway and approach a stationary emergency vehicle
    with flashing lights, what should you do?
  choices:
    A: Stop and wait for the vehicle to turn off its lights.
    B: Move over a lane to the left.
    C: Maintain your speed and honk your horn.
    D: Slow down below the posted speed limit until you have completely passed the
      vehicle.
  answer: D
  explanation: On a two-lane roadway, the Move Over Law requires you to slow down
    below the posted speed limit until you have completely passed the stopped vehicle(s).
- id: 342
  category: safe_driving_rules
  question: 'If a police officer gives you an instruction that contradicts a traffic
    signal, you must:'
  choices:
    A: Obey the traffic signal.
    B: Obey the police officer's instruction.
    C: Pull over and wait for the signal to change.
    D: Proceed with caution using your own judgment.
  answer: B
  explanation: You must obey the instructions of a police officer even though they
    may be contrary to laws, signs, signals, and markings.
- id: 343
  category: safe_driving_rules
  question: Is it legal to travel across private property to evade a traffic signal
    or road sign?
  choices:
    A: Yes, if the intersection is blocked by an accident.
    B: Yes, if you have the property owner's permission.
    C: No, you must not try to evade a traffic signal or road sign in this manner.
    D: No, unless it is between the hours of midnight and 6 AM.
  answer: C
  explanation: You must not try to evade a traffic signal or road sign by leaving
    the road and traveling across private property.
- id: 344
  category: signs_and_signals
  question: What information is found on the blue Emergency Notification System (ENS)
    sign at a railroad crossing?
  choices:
    A: The train schedule and route map
    B: An emergency dispatch number and a DOT number identifying the location
    C: The speed limit for trains passing through
    D: The clearance height of the railroad crossing
  answer: B
  explanation: The ENS sign contains an emergency dispatch number for contacting the
    railroad and a DOT number that identifies the grade crossing’s physical location.
- id: 345
  category: defensive_driving
  question: 'When crossing railroad tracks, it is wise NOT to:'
  choices:
    A: Look both ways
    B: Shift gears
    C: Maintain a steady speed
    D: Check for warning signs
  answer: B
  explanation: It is wise not to shift gears when crossing railroad tracks, just in
    case you might stall.
- id: 346
  category: signs_and_signals
  question: What does the Advance Warning Sign for a railroad crossing look like?
  choices:
    A: A red octagon with white letters
    B: A white rectangle with black letters
    C: A round yellow sign with an “X” symbol and black “RR” letters
    D: A yellow diamond with a black train symbol
  answer: C
  explanation: A round yellow warning sign with an “X” symbol and black “RR” letters
    is placed along the road before you get to a railroad crossing. This is the Advance
    Warning Sign.
- id: 347
  category: sharing_the_road
  question: If another vehicle is overtaking (passing) you, what does Delaware law
    require you to do?
  choices:
    A: Give way to the right and not increase your speed until fully overtaken.
    B: Speed up to prevent them from passing.
    C: Move to the left to block their path.
    D: Flash your headlights to warn them.
  answer: A
  explanation: Vehicles being overtaken shall give way to the right and not increase
    their speed until fully overtaken.
- id: 348
  category: signs_and_signals
  question: What does a round yellow warning sign with an 'X' symbol and black 'RR'
    letters indicate?
  choices:
    A: You are currently at a railroad crossing.
    B: It is an Advance Warning Sign placed before you get to a railroad crossing.
    C: The railroad crossing ahead is closed to traffic.
    D: Trains are currently approaching the crossing.
  answer: B
  explanation: The manual states that a round yellow warning sign with an 'X' symbol
    and black 'RR' letters is placed along the road before you get to a railroad crossing.
    This is the Advance Warning Sign.
- id: 349
  category: signs_and_signals
  question: A white, X-shaped 'crossbuck' sign located at a railroad crossing has
    the same meaning as which other sign?
  choices:
    A: A Stop sign
    B: A Yield sign
    C: A Do Not Enter sign
    D: A Speed Limit sign
  answer: B
  explanation: According to the manual, a white, X-shaped sign or 'crossbuck' with
    Railroad Crossing on it has the same meaning as a Yield sign, meaning you must
    yield to crossing trains.
- id: 350
  category: safe_driving_rules
  question: What do double solid white lines between lanes of traffic indicate?
  choices:
    A: You may cross them to change lanes if it is safe to do so.
    B: You are discouraged from changing lanes.
    C: Lane-changing is prohibited.
    D: The lane is reserved for high-occupancy vehicles.
  answer: C
  explanation: The manual explicitly states that 'Double solid white lines prohibit
    lane-changing.'
- id: 351
  category: safe_driving_rules
  question: Under what circumstance may you cross a solid yellow line between opposing
    lanes of traffic?
  choices:
    A: When passing a slow-moving vehicle on a two-lane road.
    B: When you are turning into a driveway, if it is safe to do so.
    C: When the vehicle in front of you is stopped at a traffic light.
    D: You may never cross a solid yellow line under any circumstances.
  answer: B
  explanation: The manual notes that while you generally cannot pass across a solid
    yellow line, 'You may cross a solid yellow line to turn into a driveway, if it
    is safe to do so.'
- id: 352
  category: signs_and_signals
  question: When driving in a reversible lane, what does a steady yellow 'X' signal
    overhead mean?
  choices:
    A: You can use the lane beneath it.
    B: You cannot use the lane beneath it.
    C: The use of the lane is changing and you should move out of it as soon as it
      is safe.
    D: You must stop immediately in the lane.
  answer: C
  explanation: According to the manual's section on Reversible Lanes, 'A steady yellow
    "X" means that the use of the lane is changing and you should move out of it as
    soon as it is safe to do so.'
- id: 353
  category: signs_and_signals
  question: What does an 'HOV 3' sign indicate about a reserved lane?
  choices:
    A: The lane is reserved for vehicles with at least three people in them.
    B: The lane is reserved for vehicles traveling at least 30 mph.
    C: The lane is only open for three hours a day.
    D: The lane is reserved for commercial vehicles with 3 or more axles.
  answer: A
  explanation: The manual explains that HOV stands for 'High Occupancy Vehicles' and
    an 'HOV 3' sign means 'there must be at least three people in the vehicle.'
- id: 354
  category: safe_driving_rules
  question: What is the recommended speed when approaching a roundabout?
  choices:
    A: 5-10 mph
    B: 10-15 mph
    C: 15-20 mph
    D: 20-25 mph
  answer: B
  explanation: The manual instructs drivers that upon approaching a roundabout, they
    should 'stay to the right of the splitter island and slow down to 10-15 mph.'
- id: 355
  category: sharing_the_road
  question: When navigating a roundabout, who has the right-of-way?
  choices:
    A: Vehicles entering the roundabout.
    B: Pedestrians waiting to cross outside the roundabout.
    C: Vehicles already in the roundabout.
    D: Vehicles approaching from the right.
  answer: C
  explanation: 'The manual states: ''Once you’re in the roundabout, do not stop except
    to avoid a collision; you have the right-of-way over entering traffic.'' You must
    ''Yield to traffic already in the roundabout'' when entering.'
- id: 356
  category: safe_driving_rules
  question: What is a unique operational feature of a Diverging Diamond Intersection
    (DDI)?
  choices:
    A: Traffic moves clockwise around a central island.
    B: Traffic briefly drives on the left side of the road to allow left turns without
      crossing oncoming traffic.
    C: All vehicles must come to a complete stop before entering the intersection.
    D: Left turns are completely prohibited to reduce conflict points.
  answer: B
  explanation: 'The manual describes a DDI by stating: ''Within the interchange, traffic
    briefly drives on the left side of the road to allow left turn movements to occur
    without crossing oncoming traffic or stopping.'''
- id: 357
  category: signs_and_signals
  question: How are shared center lanes, which are reserved for making left turns
    or U-turns, marked on each side?
  choices:
    A: By double solid yellow lines.
    B: By a solid white and broken white line.
    C: By a solid yellow and broken yellow line.
    D: By double broken yellow lines.
  answer: C
  explanation: According to the Shared Center Lane section, 'These lanes are marked
    on each side by a solid yellow and broken yellow lines.'
- id: 358
  category: safe_driving_rules
  question: When is it acceptable to back a vehicle in a travel lane?
  choices:
    A: When you miss your turn or exit.
    B: Only to parallel park or if necessary to exit a driveway.
    C: When you need to drop off a passenger quickly.
    D: When the road is clear of traffic for at least 500 feet.
  answer: B
  explanation: 'The General Rules section states: ''Never back a vehicle in any travel
    lane except to parallel park, or if necessary to exit a driveway. It is unsafe
    to do so.'''
- id: 359
  category: safe_driving_rules
  question: On a road with three or more lanes traveling in the same direction, which
    lane should you use if there is a lot of entering or exiting traffic?
  choices:
    A: The far right lane
    B: The far left lane
    C: The center travel lane
    D: The shoulder
  answer: C
  explanation: 'The manual advises: ''On a road with three or more lanes traveling
    in the same direction, if there is a lot of entering or exiting traffic, use the
    center travel lane.'''
- id: 360
  category: safe_driving_rules
  question: In Delaware, is it legal to pass left-turning vehicles on the right by
    using the shoulder?
  choices:
    A: Yes, but extreme care is required because other drivers will not expect you
      to be there.
    B: Yes, and you automatically have the right-of-way over all other traffic.
    C: No, passing on the right is always illegal.
    D: No, passing on the shoulder is strictly prohibited under all circumstances.
  answer: A
  explanation: 'The manual states: ''You may use the shoulder to pass left-turning
    vehicles on the right in Delaware; however, other drivers will not expect you
    to be there so extreme care is required.'''
- id: 361
  category: defensive_driving
  question: When making a right turn, why should you avoid swinging wide to the left
    before making the turn?
  choices:
    A: It will cause your vehicle's engine to stall.
    B: The driver behind you may think you are changing lanes or turning left and
      try to pass you on the right.
    C: It is illegal to turn the steering wheel to the left when your turn signal
      is indicating right.
    D: You will not be able to see pedestrians in the crosswalk.
  answer: B
  explanation: 'The manual warns regarding right turns: ''If you swing wide, the driver
    behind you may think you are changing lanes or going to turn left and may try
    to pass you on the right.'''
- id: 362
  category: safe_driving_rules
  question: Which approach lane should you be in when approaching a roundabout if
    you intend to proceed straight?
  choices:
    A: The right approach lane only.
    B: The left approach lane only.
    C: Any approach lane is okay.
    D: The center turn lane.
  answer: C
  explanation: 'The manual''s instructions on how to use a roundabout state: ''be
    in the right approach lane if you intend to turn right, be in the left approach
    lane if you intend on making a left or U-turn, and any approach lane is okay if
    you are proceeding straight.'''
- id: 363
  category: safe_driving_rules
  question: What rule applies when crossing a legal, unmarked median?
  choices:
    A: Keep to the left
    B: Keep to the right
    C: Yield to all vehicles behind you
    D: Stop and wait for a green light
  answer: B
  explanation: When crossing is legal and not marked otherwise, the rule "keep to
    the right" applies in median crossings. Drivers should treat the median the same
    as a roadway and stay to the right of the opening.
- id: 364
  category: sharing_the_road
  question: Why should you avoid using your horn when yielding to a pedestrian with
    a guide dog or white cane?
  choices:
    A: It is illegal to use a horn in a crosswalk
    B: It could confuse or frighten the blind pedestrian
    C: It signals other drivers to pass you
    D: It will cause the guide dog to become aggressive
  answer: B
  explanation: Pedestrians using a guide dog or carrying a white cane have absolute
    right-of-way. Do not use your horn as it could confuse or frighten the blind pedestrian.
- id: 365
  category: safe_driving_rules
  question: If two vehicles arrive at a 4-way stop at the exact same time, who has
    the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling faster
    D: The vehicle turning left
  answer: B
  explanation: At a 4-way stop, the driver reaching the intersection first goes first.
    If more than one vehicle arrives at the same time, the vehicle on the right goes
    first.
- id: 366
  category: sharing_the_road
  question: What should you do if you are in an intersection and an emergency vehicle
    approaches with its siren and flashing lights on?
  choices:
    A: Stop immediately in the middle of the intersection
    B: Pull over to the right edge of the intersection
    C: Drive through the intersection before you pull over
    D: Reverse out of the intersection
  answer: C
  explanation: If you are in an intersection, drive through the intersection before
    you pull over to the right edge of the road for an emergency vehicle.
- id: 367
  category: signs_and_signals
  question: What do the overhead alternately flashing yellow lights on a school bus
    indicate?
  choices:
    A: The bus is experiencing mechanical failure
    B: The bus is about to activate its red lights to load or unload children
    C: The bus is traveling at a speed less than 15 mph
    D: The bus is yielding to an emergency vehicle
  answer: B
  explanation: Yellow lights will be activated approximately 10 seconds prior to the
    overhead flashing red lights to warn drivers of approaching vehicles that a stop
    to load or unload school children is about to be made.
- id: 368
  category: penalties_and_points
  question: What is the penalty for a first offense of passing a stopped school bus
    with its red lights flashing?
  choices:
    A: A fine of $50 and a warning
    B: A one-month license suspension and a fine of $115 to $230
    C: A six-month license suspension and a $500 fine
    D: A mandatory one-year prison sentence
  answer: B
  explanation: For a first offense, the driver is fined $115 to $230 (or imprisoned
    30-60 days) and the Division of Motor Vehicles shall suspend the driver license
    for a period of one month.
- id: 369
  category: safe_driving_rules
  question: When parallel parking on a two-way highway, how close must your vehicle
    be to the curb or edge of the highway?
  choices:
    A: Within 6 inches
    B: Within 12 inches
    C: Within 18 inches
    D: Within 24 inches
  answer: B
  explanation: When parking on a two-way highway you must park parallel to and within
    12 inches of the curb or edge of the highway.
- id: 370
  category: vehicle_information
  question: If your car has a manual transmission, how should you leave it when parked
    and headed downhill?
  choices:
    A: In neutral
    B: In low gear
    C: In reverse
    D: In high gear
  answer: C
  explanation: If your car has a manual transmission, leave it in reverse when parked
    and headed downhill. This will help prevent a crash if your emergency or parking
    brake should fail.
- id: 371
  category: safe_driving_rules
  question: At an intersection where there is no stop sign, yield sign, or traffic
    signal, which vehicle should you yield to?
  choices:
    A: Vehicles coming from the left
    B: Vehicles coming from the right
    C: Vehicles turning left
    D: Vehicles that are moving the fastest
  answer: B
  explanation: At an intersection where there is no stop sign, yield sign, or traffic
    signal, drivers should yield to vehicles coming from the right.
- id: 372
  category: safe_driving_rules
  question: When is it legal to enter an intersection?
  choices:
    A: As soon as the light turns green, regardless of traffic ahead
    B: Only when you can get through it without having to stop
    C: When you are turning right on red, even if it blocks the crosswalk
    D: Whenever you have the right-of-way, even if traffic is backed up
  answer: B
  explanation: Drivers may not enter an intersection unless they can get through it
    without having to stop. You should wait until traffic ahead clears so that you
    are not blocking the intersection.
- id: 373
  category: safe_driving_rules
  question: When is it legal to drive on a sidewalk?
  choices:
    A: When avoiding a traffic jam
    B: When parking your vehicle
    C: Only to cross it when entering or exiting a driveway, alley, or parking lot
    D: It is never legal under any circumstances
  answer: C
  explanation: Drivers crossing a sidewalk entering or exiting a driveway, alley,
    or parking lot must yield to pedestrians. It is illegal to drive on a sidewalk
    except to cross it.
- id: 374
  category: penalties_and_points
  question: Under the School Bus Safety Pilot Program, what is the civil assessment
    for a first offense of failing to comply with the school bus stop law using a
    camera system?
  choices:
    A: $50
    B: $100
    C: $230
    D: $500
  answer: B
  explanation: The owner or operator of a vehicle who has failed to comply with the
    school bus stop law, as evidenced by information obtained from a school bus safety
    camera system, shall be subject to a civil or administrative assessment of $100
    for a first offense.
- id: 375
  category: safe_driving_rules
  question: Who has the right-of-way when a driver is entering a traffic circle or
    rotary?
  choices:
    A: The driver entering the circle
    B: Drivers already in the circle
    C: The driver on the right
    D: The driver traveling at a higher speed
  answer: B
  explanation: Drivers entering a traffic circle or rotary must yield to drivers already
    in the circle.
- id: 376
  category: safe_driving_rules
  question: Which of the following is a required step when parking and leaving your
    vehicle on a highway or street?
  choices:
    A: Leave the engine running for quick departures
    B: Keep the keys in the ignition
    C: Stop the engine, lock the ignition, remove the key, and set the brakes
    D: Leave the windows rolled down
  answer: C
  explanation: When parking and leaving your vehicle on a highway or street, you must
    stop the engine, lock the ignition, remove the key, and set the brakes.
- id: 377
  category: safe_driving_rules
  question: When parking headed uphill on a street with a curb, which way should you
    turn your front wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Straight ahead
    D: Toward the edge of the highway
  answer: B
  explanation: When headed uphill and there is a curb, you must turn your front wheels
    away from the curb and bring the near-side front wheel into contact with the curb.
- id: 378
  category: safe_driving_rules
  question: What is the maximum speed limit in a school zone in Delaware?
  choices:
    A: 15 miles per hour
    B: 20 miles per hour
    C: 25 miles per hour
    D: 35 miles per hour
  answer: B
  explanation: According to the speed limits table, the speed limit in school zones
    is 20 miles per hour.
- id: 379
  category: safe_driving_rules
  question: What is the speed limit on Route 1 and Interstate 495?
  choices:
    A: 55 miles per hour
    B: 60 miles per hour
    C: 65 miles per hour
    D: 70 miles per hour
  answer: C
  explanation: The speed limit on Route 1 and interstate 495 is 65 miles per hour.
- id: 380
  category: signs_and_signals
  question: What does an advisory speed sign indicate?
  choices:
    A: The absolute legal maximum speed limit
    B: A recommended speed for conditions, often shown under a warning sign
    C: The minimum speed you are allowed to travel
    D: A speed limit only enforced at night
  answer: B
  explanation: Advisory speed signs have black letters on a yellow background and
    warn you that conditions may often make it unsafe to drive faster. They are recommended
    speeds, not specific speed limits.
- id: 381
  category: sharing_the_road
  question: If a pedestrian must walk along a roadway at night, what does the law
    require them to do?
  choices:
    A: Walk in the center of the lane
    B: Carry a light or reflector
    C: Walk in the same direction as traffic
    D: Wear dark clothing to avoid distracting drivers
  answer: B
  explanation: It is illegal for a pedestrian to walk along any roadway at night without
    carrying a light or reflector.
- id: 382
  category: sharing_the_road
  question: When walking along a road where no sidewalk is provided, how should a
    pedestrian walk?
  choices:
    A: On the shoulder facing oncoming traffic
    B: On the shoulder in the same direction as traffic
    C: In the right-most traffic lane
    D: In the median of the highway
  answer: A
  explanation: When there is no sidewalk, pedestrians must walk on the shoulder facing
    oncoming traffic as far away from the road as possible.
- id: 383
  category: safe_driving_rules
  question: You must not park your vehicle within how many feet of a flashing beacon,
    stop sign, or traffic signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: It is illegal to stop or park within 30 feet of any flashing beacon,
    stop sign, or traffic signal.
- id: 384
  category: safe_driving_rules
  question: Which of the following best describes the General Speed Restriction in
    Delaware?
  choices:
    A: You must always drive exactly at the posted speed limit.
    B: You must not drive at a speed greater than is reasonable under existing conditions.
    C: You may exceed the speed limit by 5 mph to pass another vehicle.
    D: You must drive at least 10 mph below the speed limit in bad weather.
  answer: B
  explanation: The General Speed Restriction states you must not drive on a Delaware
    highway at a speed greater than is reasonable under existing conditions.
- id: 385
  category: vehicle_information
  question: When parking a vehicle on the shoulder of a highway from sunset to sunrise,
    what must you do?
  choices:
    A: Turn on your high beam headlights
    B: Turn on your parking lights or 4-way flashers
    C: Flash your turn signal on the street side only
    D: Leave your interior dome light on
  answer: B
  explanation: When you park a vehicle on the shoulder from sunset to sunrise, you
    must turn on your parking lights or 4-way flashers. Turn signal lights shall not
    be flashed on one side only.
- id: 386
  category: sharing_the_road
  question: If a vehicle is stopped in front of you to allow a pedestrian to cross
    the highway, what must you do?
  choices:
    A: Honk your horn to alert the pedestrian
    B: Pass the stopped vehicle on the right
    C: Pass the stopped vehicle on the left
    D: You must not pass the stopped vehicle
  answer: D
  explanation: As a driver, you must not pass a vehicle stopped to allow a pedestrian
    to cross the highway.
- id: 387
  category: defensive_driving
  question: 'When opening the door of a parked vehicle on the street side, you should
    be especially aware of:'
  choices:
    A: Pedestrians on the sidewalk
    B: Oncoming bicyclists
    C: Vehicles backing out of driveways
    D: Children playing in the street
  answer: B
  explanation: Turn and check for any oncoming vehicle if you must use the door on
    the street side. Be especially aware of oncoming bicyclists; they may be severely
    injured by a collision with a car door.
- id: 388
  category: sharing_the_road
  question: When must a pedestrian yield the right-of-way to vehicles?
  choices:
    A: When crossing within a marked crosswalk.
    B: When crossing the roadway where a pedestrian tunnel or overhead crossing is
      provided.
    C: When they are blind and crossing with a white cane.
    D: When crossing on a walk signal.
  answer: B
  explanation: Pedestrians must yield the right-of-way when crossing the roadway where
    a pedestrian tunnel or overhead crossing is provided, or when crossing outside
    of a marked or unmarked crosswalk at an intersection.
- id: 389
  category: sharing_the_road
  question: According to Delaware law, which roadways are bicyclists NOT allowed to
    use?
  choices:
    A: Limited access highways
    B: Two-lane rural roads
    C: Roads with a speed limit over 45 mph
    D: Roads without designated bike lanes
  answer: A
  explanation: Cyclists have the right to use all Delaware roads except limited access
    highways.
- id: 390
  category: safe_driving_rules
  question: Under the Bicycle Friendly Delaware Act, what must a driver do when passing
    a bicycle if the travel lane is too narrow for sharing?
  choices:
    A: Honk the horn to warn the cyclist to move over.
    B: Pass closely while reducing speed to 15 mph.
    C: Completely change lanes, even if it requires crossing a double yellow line.
    D: Share the lane but leave at least one foot of clearance.
  answer: C
  explanation: The law requires drivers to completely change lanes (including crossing
    a double yellow center line) when passing bicycles if the travel lanes are too
    narrow for sharing safely side by side.
- id: 391
  category: defensive_driving
  question: When is it legal for a motorist to honk their horn at a bicyclist?
  choices:
    A: When the bicyclist is riding too slowly in the center of the lane.
    B: When warning the cyclist of an imminent collision or danger.
    C: When preparing to pass the bicyclist on a two-lane road.
    D: When the bicyclist is approaching a stop sign.
  answer: B
  explanation: Motorists are forbidden from honking their horn at bicyclists unless
    there is an imminent danger or collision.
- id: 392
  category: safe_driving_rules
  question: When passing a bicycle in a very wide travel lane without changing lanes,
    what is the minimum clearance a driver must leave between their vehicle and the
    bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: The law requires that you slow down and leave a minimum of three feet
    of clearance at all times between your vehicle and the bicycle when passing.
- id: 393
  category: driver_responsibility
  question: Who is held responsible under the law if a child under the age of 18 is
    riding a bicycle without a helmet?
  choices:
    A: The child
    B: The local police department
    C: The parent or guardian
    D: The school district
  answer: C
  explanation: As a parent, you are responsible if your child (under the age of 18)
    is not wearing a helmet.
- id: 394
  category: vehicle_information
  question: What lighting equipment is required for a bicycle when riding at night?
  choices:
    A: A white headlight visible for 500 feet and a red rear reflector visible for
      600 feet.
    B: A yellow headlight visible for 300 feet and a red taillight visible for 300
      feet.
    C: A white headlight visible for 1000 feet and reflective tires.
    D: Only reflective clothing is required by law.
  answer: A
  explanation: You must not ride at night unless you have a white headlight visible
    for 500 feet and a red rear reflector visible for 600 feet (along with side reflectors
    or lights).
- id: 395
  category: sharing_the_road
  question: Which of the following is illegal for a bicyclist to do while riding on
    the highway?
  choices:
    A: Ride on a permanent seat.
    B: Keep only one hand on the handlebars while signaling.
    C: Wear a headset covering both ears.
    D: Yield to pedestrians on a sidewalk.
  answer: C
  explanation: The rules of the road state that when riding a bicycle, you must not
    wear a headset covering both ears.
- id: 396
  category: signs_and_signals
  question: Under what condition MUST a bicyclist come to a complete stop at a stop
    sign?
  choices:
    A: At all intersections, regardless of the road size.
    B: When the intersection is with a major road having 3 or more travel lanes.
    C: Only when a police officer is present.
    D: When turning right onto a minor road.
  answer: B
  explanation: Bicyclists must stop at all stop signs located at intersections with
    major (3 travel lanes or more) roads, or if a vehicle is stopped at the sign,
    or for heavy traffic.
- id: 397
  category: signs_and_signals
  question: How may a bicyclist treat a stop sign at an intersection with a minor
    road if there is no stopped vehicle and no heavy traffic?
  choices:
    A: As a green light, maintaining full speed.
    B: As a yield sign, cautiously proceeding without stopping after yielding right-of-way.
    C: As a flashing red light, requiring a full stop for 3 seconds.
    D: As a detour sign, requiring them to turn around.
  answer: B
  explanation: At stop signs controlling intersections with minor roads with no stopped
    vehicle, bicyclists may treat the stop sign as a yield sign and cautiously proceed
    without stopping.
- id: 398
  category: sharing_the_road
  question: Why are motorcycles often difficult for other drivers to identify in traffic?
  choices:
    A: They are usually painted in dark colors.
    B: They travel at much higher speeds than cars.
    C: They are only about two feet wide compared to five- or six-foot wide cars.
    D: They are not required to use headlights during the day.
  answer: C
  explanation: Motorcycles are not easily identified in traffic primarily because
    they are only about two feet wide compared with the five- to six-foot width of
    cars.
- id: 399
  category: defensive_driving
  question: Where do most serious and fatal bicycle crashes occur?
  choices:
    A: On limited access highways
    B: At intersections
    C: On two-way cycle tracks
    D: In residential driveways
  answer: B
  explanation: According to the manual, most serious and fatal bicycle crashes occur
    at intersections.
- id: 400
  category: sharing_the_road
  question: What must a bicyclist do when overtaking a pedestrian on a sidewalk?
  choices:
    A: Dismount and walk the bicycle past the pedestrian.
    B: Pass as closely as possible to save space.
    C: Give an audible signal before overtaking.
    D: Flash their white headlight.
  answer: C
  explanation: Bicyclists must yield to pedestrians on a sidewalk and in a crosswalk
    and give an audible signal before overtaking.
- id: 401
  category: sharing_the_road
  question: Which of the following is a critical rule for adult cyclists to remain
    predictable on the road?
  choices:
    A: Riding against motor vehicle traffic to see oncoming cars.
    B: Riding with motor vehicle traffic, not against it.
    C: Swerving frequently to avoid minor road hazards.
    D: Using the sidewalk whenever traveling uphill.
  answer: B
  explanation: To be predictable, cyclists must ride with motor vehicle traffic, not
    against it, and signal intentions clearly.
- id: 402
  category: sharing_the_road
  question: What is the recommended following distance behind a motorcyclist when
    traveling at speeds under 40 mph?
  choices:
    A: One second
    B: Two seconds
    C: Three seconds
    D: Four seconds
  answer: B
  explanation: According to the manual, following distance behind a motorcyclist should
    be at a two-second count when traveling at speeds under 40 mph.
- id: 403
  category: sharing_the_road
  question: When traveling at speeds above 40 mph, what should your following distance
    be behind a motorcycle?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Six seconds
  answer: C
  explanation: The manual states that the following distance behind a motorcyclist
    should be a four-second count for speeds above 40 mph.
- id: 404
  category: defensive_driving
  question: Which of the following maneuvers accounts for a large percentage of car/cycle
    injury-producing crashes?
  choices:
    A: Rear-end collisions at stoplights
    B: Left turns in front of an oncoming motorcyclist
    C: Right turns on red
    D: Head-on collisions on interstate highways
  answer: B
  explanation: The manual notes that left turns in front of an oncoming motorcyclist
    account for a large percentage of car/cycle injury-producing crashes.
- id: 405
  category: vehicle_information
  question: What is a common feature of turn signals on most motorcycles that drivers
    should be aware of?
  choices:
    A: They are automatically self-canceling after a turn.
    B: They are not automatically self-canceling.
    C: They are only required on the rear of the motorcycle.
    D: They flash faster than automobile turn signals.
  answer: B
  explanation: Turn signals are not automatically self-canceling on most motorcycles,
    meaning a rider may sometimes forget to turn the signal off.
- id: 406
  category: sharing_the_road
  question: Is it legal to move into the same lane alongside a motorcycle if the lane
    is wide and the cyclist is riding far to one side?
  choices:
    A: Yes, but only if you are passing the motorcycle.
    B: Yes, if traffic is heavy and the lane is wide enough.
    C: No, it is illegal and extremely hazardous.
    D: No, unless the motorcyclist waves you past.
  answer: C
  explanation: 'The manual explicitly states: "Never move into the same lane alongside
    a motorcycle even if the lane is wide and the cyclist is riding far to one side.
    It is not only illegal, it is extremely hazardous."'
- id: 407
  category: vehicle_information
  question: How long is the registration period for mopeds and tripeds, and what is
    the cost?
  choices:
    A: One year and $5.00
    B: Three years and $5.00
    C: Three years and $15.00
    D: Five years and $10.00
  answer: B
  explanation: Mopeds and tripeds must be registered, and the registration/re-registration
    shall be for three years and cost $5.00.
- id: 408
  category: vehicle_information
  question: Mopeds and tripeds must be equipped with a bell or device capable of giving
    an audible signal for at least what distance?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Mopeds and tripeds must have a light on front and rear and have a bell
    or device capable of giving a signal audible for a distance of at least 100 feet.
- id: 409
  category: safe_driving_rules
  question: Where are mopeds and tripeds legally prohibited from operating?
  choices:
    A: On residential streets
    B: On public roads with speed limits over 35 mph
    C: On interstate and limited access highways
    D: On roads without a designated bicycle lane
  answer: C
  explanation: Mopeds and tripeds shall not be operated upon interstate and limited
    access highways, nor on the right-of-way of an operating railroad.
- id: 410
  category: license_system
  question: What is the minimum age requirement to register an Off Highway Vehicle
    (OHV)?
  choices:
    A: 16 years of age
    B: 18 years of age
    C: 21 years of age
    D: 25 years of age
  answer: B
  explanation: To process a registration application for an OHV, the applicant must
    have a description of the OHV and be at least 18 years of age.
- id: 411
  category: vehicle_information
  question: All Off Highway Vehicles (OHVs) must be equipped with a muffler that reduces
    the noise level by what percentage?
  choices:
    A: 25%
    B: 40%
    C: 50%
    D: 60%
  answer: D
  explanation: The manual states that all OHVs must have a muffler that reduces the
    noise level by 60%.
- id: 412
  category: safe_driving_rules
  question: Which of the following vehicles is NOT permitted to be driven on the highway?
  choices:
    A: Mopeds
    B: Tripeds
    C: Farm tractors
    D: Golf carts
  answer: D
  explanation: You must not drive a minibike, a go-cart, golf cart, dirtbike, motorized
    scooter, snowmobile, or other all-terrain vehicles upon the highway.
- id: 413
  category: signs_and_signals
  question: What does a "Slow-Moving Vehicle" emblem look like?
  choices:
    A: A circular, reflective yellow sign
    B: A triangular, fluorescent and reflective orange sign
    C: A diamond-shaped, reflective green sign
    D: A rectangular, fluorescent red sign
  answer: B
  explanation: A "Slow-Moving Vehicle" emblem is described as a triangular, fluorescent
    and reflective orange sign.
- id: 414
  category: sharing_the_road
  question: On a level highway, approximately how much longer does it take to pass
    a truck compared to a car?
  choices:
    A: One to two seconds longer
    B: Three to five seconds longer
    C: Five to eight seconds longer
    D: Ten to twelve seconds longer
  answer: B
  explanation: On a level highway, it takes only three to five seconds longer to pass
    a truck than a car.
- id: 415
  category: sharing_the_road
  question: What rights and duties apply to the rider of an animal or the driver of
    an animal-drawn vehicle on the highway?
  choices:
    A: They must ride facing oncoming traffic at all times.
    B: They are only permitted to travel on the shoulder of the road.
    C: They have all the rights and duties of the driver of a motor vehicle.
    D: They must yield the right-of-way to all motorized vehicles.
  answer: C
  explanation: As the rider of any animal or the driver of any animal-drawn vehicle
    on the highway, you have all the rights and all the duties of the driver of a
    motor vehicle except where the laws can have no application.
- id: 416
  category: sharing_the_road
  question: When is it safe to move back into your lane after passing a truck?
  choices:
    A: As soon as you clear the truck's front bumper
    B: When you can see the front of the truck in your rear-view mirror
    C: When the truck driver sounds their horn
    D: After you have maintained your passing speed for 10 seconds
  answer: B
  explanation: The manual states to be sure to move back only when you can see the
    front of the truck in your rear-view mirror.
- id: 417
  category: sharing_the_road
  question: What should you do to help a truck driver who is passing your vehicle?
  choices:
    A: Speed up to get out of their way
    B: Move to the center of your lane and maintain speed
    C: Keep to the far side of your lane and reduce your speed slightly
    D: Blink your headlights repeatedly
  answer: C
  explanation: When a truck passes you, you can help the truck driver by keeping to
    the far side of your lane and reducing your speed slightly. You should never speed
    up while a truck is passing.
- id: 418
  category: sharing_the_road
  question: When meeting a truck coming from the opposite direction, why should you
    keep as far as possible to the side of the road?
  choices:
    A: To avoid being sucked into the side of the truck by wind turbulence
    B: To reduce wind turbulence that pushes the vehicles apart and avoid a sideswipe
    C: To give the truck room to make a wide left turn
    D: To avoid the truck's front blind spot
  answer: B
  explanation: The manual advises keeping as far as possible to the side to avoid
    a sideswipe crash and to reduce wind turbulence, noting that turbulence pushes
    the vehicles apart rather than sucking them together.
- id: 419
  category: sharing_the_road
  question: To avoid tailgating in a truck's rear blindspot, what is the minimum following
    distance you should allow?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Six seconds
  answer: C
  explanation: The manual states to allow at least four seconds between your vehicle
    and the truck to avoid tailgating in the rear No-Zone.
- id: 420
  category: sharing_the_road
  question: Why is it dangerous to cut in between a commercial vehicle and the right
    curb at an intersection?
  choices:
    A: The truck may need to swing wide to the left to safely negotiate a right turn.
    B: The truck's exhaust system vents hazardous gases to the right side.
    C: The truck driver will be accelerating rapidly.
    D: The truck's right side blindspot is the smallest.
  answer: A
  explanation: Truck drivers sometimes need to swing wide to the left in order to
    safely negotiate a right turn. Cutting in between the commercial vehicle and the
    curb increases the possibility of a crash.
- id: 421
  category: sharing_the_road
  question: What percentage of all commercial vehicle crashes occur while the vehicle
    is backing up?
  choices:
    A: 25 percent
    B: 40 percent
    C: 50 percent
    D: 66 percent
  answer: D
  explanation: According to the manual, sixty-six percent of all commercial vehicle
    crashes are while backing.
- id: 422
  category: vehicle_information
  question: When is the best time to check your vehicle's tire air pressure?
  choices:
    A: Immediately after a long trip
    B: When the tires are cold
    C: While the vehicle is running
    D: During the hottest part of the day
  answer: B
  explanation: The manual instructs drivers to check tire air pressure with an air
    pressure gauge when the tires are cold.
- id: 423
  category: vehicle_information
  question: How can you use a penny to check if your tire tread is safe?
  choices:
    A: Stick the penny into the tread 'head' first; if the tread does not come at
      least to Abe's head, the tire is unsafe.
    B: Place the penny flat on the tire; if it slides off, the tire is unsafe.
    C: Stick the penny into the tread 'tails' first; if you can see the memorial,
      the tire is unsafe.
    D: Rub the penny against the sidewall to check for dry rot.
  answer: A
  explanation: Check the tread with a penny by sticking it into the tread 'head' first.
    If the tread does not come at least to Abe's head, the tire is unsafe and needs
    to be replaced.
- id: 424
  category: vehicle_information
  question: Which of the following is a sign that your vehicle may need new shocks
    or suspension parts?
  choices:
    A: The brake pedal goes all the way to the floor.
    B: The vehicle bounces a lot after a bump or a stop.
    C: The steering wheel shakes when driving on a smooth road.
    D: The engine makes a loud noise when accelerating.
  answer: B
  explanation: If the vehicle bounces a lot after a bump or a stop or is hard to control,
    you may need new shocks or other suspension parts.
- id: 425
  category: safe_driving_rules
  question: According to the manual, what is the best way to prolong the life of your
    car and save on fuel?
  choices:
    A: Use premium gasoline only.
    B: Drive during heavy traffic to keep speeds low.
    C: Use the vehicle as little as possible through trip planning.
    D: Warm up the engine for 10 minutes before every trip.
  answer: C
  explanation: The manual states that the best way to prolong the life of your car
    and save on fuel is to use it as little as possible, which can be achieved through
    trip planning.
- id: 426
  category: sharing_the_road
  question: What should you expect when passing a truck on a downgrade?
  choices:
    A: The truck will lose speed, making it easier to pass.
    B: The truck's momentum will cause it to go faster, so you may need to increase
      your speed.
    C: The truck will automatically pull over to the shoulder.
    D: The truck driver will turn on their hazard lights.
  answer: B
  explanation: On a downgrade, the truck's momentum will cause it to go faster, so
    you may need to increase your speed to pass.
- id: 427
  category: sharing_the_road
  question: What does the term 'No-Zone' refer to when sharing the road with trucks?
  choices:
    A: Areas where commercial vehicles are prohibited from driving.
    B: The danger areas around trucks where crashes are more likely to occur because
      of blind spots.
    C: The designated passing lanes for passenger vehicles only.
    D: The minimum following distance required behind a commercial vehicle.
  answer: B
  explanation: The No-Zone represents danger areas (blind spots) around trucks where
    crashes are more likely to occur.
- id: 428
  category: vehicle_information
  question: What is a major risk of driving with worn or bald tires on wet roads?
  choices:
    A: Increased fuel economy
    B: The steering wheel locking up
    C: An increased chance of hydroplaning
    D: The exhaust system overheating
  answer: C
  explanation: The manual warns that worn tires can cause 'hydroplaning' and increase
    the chance of having a flat tire.
- id: 429
  category: vehicle_information
  question: What is one of the primary functions of a vehicle's exhaust system?
  choices:
    A: To cool the hot gases coming from running the engine.
    B: To provide a comfortable ride over varying road surfaces.
    C: To keep rain and snow off the windshield.
    D: To alert other drivers that you are stopping.
  answer: A
  explanation: The exhaust system helps reduce the noise from the engine, helps cool
    the hot gases coming from running the engine, and moves these gases to the rear
    of the vehicle.
- id: 430
  category: vehicle_information
  question: What is a potential danger of a leaky exhaust system?
  choices:
    A: It can cause the engine to overheat rapidly.
    B: It can cause death inside a vehicle in a very short time.
    C: It will cause the vehicle to bounce after a stop.
    D: It increases fuel economy significantly.
  answer: B
  explanation: The manual states, "Gases from a leaky exhaust can cause death inside
    a vehicle in a very short time."
- id: 431
  category: safe_driving_rules
  question: According to the manual, when is the only time you should use your horn?
  choices:
    A: To greet friends on the road.
    B: To express anger at another driver.
    C: To let a driver know the light has turned green.
    D: As a warning to others.
  answer: D
  explanation: The manual states, "Only use your horn as a warning to others."
- id: 432
  category: defensive_driving
  question: What is the force of impact for a 20 lb. unsecured object traveling at
    55 mph?
  choices:
    A: 100 lbs.
    B: 500 lbs.
    C: 1,000 lbs.
    D: 2,000 lbs.
  answer: C
  explanation: The manual states, "A 20 lb. object at 55 mph has a force of 1,000
    lbs. at impact!"
- id: 433
  category: vehicle_information
  question: How much can dirt on the lenses of your headlights, backup, brake, and
    taillights reduce their light?
  choices:
    A: By 10%
    B: By 25%
    C: By 50%
    D: By 75%
  answer: C
  explanation: The manual states, "Dirt on the lenses can reduce the light by 50%."
- id: 434
  category: safe_driving_rules
  question: Approximately how far should your seating be positioned from the steering
    wheel?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: The manual states, "Seating should be positioned approximately 12 inches
    from the steering wheel."
- id: 435
  category: vehicle_information
  question: What is a good adjustment for your vehicle's side mirrors?
  choices:
    A: Set them so you can see the entire side of your vehicle while sitting back.
    B: Set them so you can see just the side of your vehicle when you lean forward
      slightly.
    C: Set them so they point directly at the ground behind the rear tires.
    D: Set them so you can see the driver in the car behind you.
  answer: B
  explanation: The manual states, "A good adjustment for the side mirrors is to set
    them so that when you lean forward slightly, you can see just the side of your
    vehicle."
- id: 436
  category: penalties_and_points
  question: What can result from putting the shoulder belt under your arm or behind
    you while driving?
  choices:
    A: It provides better protection in a rollover crash.
    B: It is considered proper use if the lap belt is tight.
    C: It can result in serious injury and a ticket being issued.
    D: It disables the vehicle's airbag system.
  answer: C
  explanation: The manual states, "Putting the shoulder belt under your arm or behind
    you can result in serious injury; and, because it is not considered proper safety
    belt use, could result in a ticket being issued."
- id: 437
  category: defensive_driving
  question: Why must safety belts be worn even if the vehicle is equipped with air
    bags?
  choices:
    A: Air bags do not protect you if you are hit from the side or rear, or if the
      vehicle rolls over.
    B: Air bags only deploy at speeds over 55 mph.
    C: Air bags are known to fail 50% of the time.
    D: Air bags only protect the passengers in the back seat.
  answer: A
  explanation: The manual states, "While air bags are good protection against hitting
    the steering wheel, dashboard, or windshield, they do not protect you if you are
    hit from the side or rear, or if the vehicle rolls over."
- id: 438
  category: safe_driving_rules
  question: According to Delaware law, which children are required to ride in a rear-facing
    car seat?
  choices:
    A: Children under age 1 AND 20 pounds
    B: Children under age 2 AND 30 pounds
    C: Children under age 4 AND 40 pounds
    D: Children under age 8 AND 60 pounds
  answer: B
  explanation: Delaware law requires "Children under age 2 AND 30 pounds to ride in
    a rear-facing car seat."
- id: 439
  category: safe_driving_rules
  question: When properly securing a child in a car seat, where should the chest clip
    be positioned?
  choices:
    A: Even with the child's belly button
    B: Even with the child's collarbone
    C: Even with the child's arm pits
    D: Across the child's neck
  answer: C
  explanation: The manual states, "The chest clip should be even with the child’s
    arm pits."
- id: 440
  category: safe_driving_rules
  question: 'A child should generally NOT occupy the front passenger seat of a vehicle
    if they are:'
  choices:
    A: Under the age of 10 or under 5'0"
    B: Under the age of 12 or under 5'5"
    C: Under the age of 14 or under 5'8"
    D: Under the age of 16 or under 6'0"
  answer: B
  explanation: The manual states, "A child under the age of 12 or under 5’5” should
    not occupy the front passenger seat of a vehicle."
- id: 441
  category: vehicle_information
  question: What does it likely mean if your vehicle bounces a lot after a bump or
    a stop, or is hard to control?
  choices:
    A: You have a leaky exhaust system.
    B: Your engine compression device is failing.
    C: You may need new shocks or other suspension parts.
    D: Your tires are overinflated.
  answer: C
  explanation: The manual states, "If the vehicle bounces a lot after a bump or a
    stop or is hard to control, you may need new shocks or other suspension parts."
- id: 442
  category: safe_driving_rules
  question: Once installed, how much should a child's car seat move when checked at
    the belt path with moderate force?
  choices:
    A: Not more than one inch side-to-side and front-to-back
    B: Not more than two inches side-to-side and front-to-back
    C: Not more than three inches side-to-side and front-to-back
    D: It should have enough slack to move freely
  answer: A
  explanation: The manual states, "Once installed, car seats should not move more
    than one inch side-to-side and front-to-back when checked at the belt path with
    moderate force."
- id: 443
  category: safe_driving_rules
  question: Where should you NEVER install a rear-facing car seat?
  choices:
    A: In the back seat behind the driver
    B: In the back seat behind the passenger
    C: In the middle of the back seat
    D: In front of an active frontal air bag
  answer: D
  explanation: The manual states, "Never install a rear-facing car seat in front of
    an active frontal air bag."
- id: 444
  category: driver_responsibility
  question: Studies have shown that simply wearing your seatbelt can cut your chance
    of dying or being seriously injured in a crash by how much?
  choices:
    A: By 10%
    B: By 25%
    C: Nearly in half
    D: By 90%
  answer: C
  explanation: The manual states, "Studies have shown that you can cut your chance
    of dying or being seriously injured in a crash nearly in half by simply wearing
    your seatbelt."
- id: 445
  category: vehicle_information
  question: How tight should a child's car seat harness be when properly installed?
  choices:
    A: Loose enough to fit two fingers underneath the straps.
    B: You should not be able to pinch excess webbing at the child's collarbone.
    C: Tight enough that the child cannot move their arms or legs.
    D: Loose enough to pinch at least one inch of webbing.
  answer: B
  explanation: 'The manual states: "You should not be able to pinch excess webbing
    of the harness between your fingers when you try to pinch the harness straps at
    the child’s collarbone."'
- id: 446
  category: vehicle_information
  question: Where should the chest clip of a child's car seat be positioned?
  choices:
    A: Even with the child's collarbone
    B: Even with the child's belly button
    C: Even with the child's arm pits
    D: Across the child's waist
  answer: C
  explanation: According to the manual, "The chest clip should be even with the child’s
    arm pits."
- id: 447
  category: safe_driving_rules
  question: If the outside temperature is 94 degrees, how hot can the inside of a
    car get in just half an hour with the windows up?
  choices:
    A: 100 degrees
    B: 112 degrees
    C: 122 degrees
    D: 132 degrees
  answer: C
  explanation: The manual notes that one study found "with the windows up and the
    temperature outside at 94 degrees, the inside of a car could be 122 degrees in
    just half an hour..."
- id: 448
  category: defensive_driving
  question: Which of the following is a true statement regarding traffic deaths and
    trip distance?
  choices:
    A: Most traffic deaths happen on cross-country road trips.
    B: Over half of all traffic deaths happen within 25 miles of home.
    C: Traffic deaths rarely occur on roads posted at less than 45 mph.
    D: Short trips around town do not require the use of safety belts.
  answer: B
  explanation: The manual dispels the myth that safety belts aren't needed around
    town by stating, "Over half of all traffic deaths happen within 25 miles of home."
- id: 449
  category: defensive_driving
  question: What happens to unsecured passengers in a vehicle when it is struck from
    the side?
  choices:
    A: They will slide away from the point of the crash.
    B: They will be thrown clear of the vehicle safely.
    C: They will remain stationary in their seats.
    D: They will slide toward the point of the crash.
  answer: D
  explanation: The manual explains that when a vehicle is struck from the side, "Everything
    in the vehicle that is not fastened down, including the passengers, will effectively
    slide toward the point of crash, not away from it."
- id: 450
  category: defensive_driving
  question: 'The force of a head-on crash at 25 mph is equivalent to:'
  choices:
    A: Falling off a one-story building.
    B: Pedaling a bicycle full-speed into a brick wall.
    C: Being tackled by a professional football player.
    D: Dropping a heavy weight on your foot.
  answer: B
  explanation: 'The manual states: "Even at 25 mph, the force of a head-on crash is
    the same as pedaling a bicycle full-speed into a brick wall or diving off a three-story
    building onto the sidewalk."'
- id: 451
  category: driver_responsibility
  question: During a traffic stop, what information must an individual provide to
    a law-enforcement officer according to Delaware law?
  choices:
    A: Only their name and driver's license number.
    B: Their name, address, and an explanation of why they are driving and where they
      are going.
    C: Their social security number and vehicle registration.
    D: Only their proof of insurance and destination.
  answer: B
  explanation: In accordance with 11 Del. C. §1902, "an individual must provide their
    name, address and an explanation as to why they are driving on the roadway and
    where they are going."
- id: 452
  category: driver_responsibility
  question: Under what circumstances can an officer search an individual's vehicle
    on-scene during a traffic stop?
  choices:
    A: Only if the driver is placed under arrest.
    B: Only if the officer has a signed warrant from a judge.
    C: If consent is provided, there is probable cause, or during a tow inventory.
    D: An officer is never allowed to search a vehicle on-scene.
  answer: C
  explanation: 'The manual states: "An individual’s vehicle may be searched on-scene
    if consent is provided to the officer to do so, if the officer believes they have
    probable cause to do so, or as part of an inventory assessment of a vehicle that
    is being towed."'
- id: 453
  category: penalties_and_points
  question: If a person fails to provide identification or explain their actions to
    an officer's satisfaction, how long can they be legally detained before being
    released or arrested?
  choices:
    A: Up to 30 minutes
    B: Up to one hour
    C: Up to two hours
    D: Up to 24 hours
  answer: C
  explanation: The manual specifies that "At the end of the detention period, which
    may not exceed two hours, the person will either be released, or arrested and
    charged with a crime."
- id: 454
  category: safe_driving_rules
  question: When pulling over for an emergency vehicle or traffic stop, where should
    you move your vehicle?
  choices:
    A: To the left shoulder of the roadway.
    B: To the right side of the roadway, whenever possible.
    C: Stop immediately in your current lane.
    D: To the center median.
  answer: B
  explanation: 'The manual instructs: "When pulling over for an emergency vehicle,
    movements should be made to the right side of the roadway, whenever possible."'
- id: 455
  category: driver_responsibility
  question: What should you do if you have a weapon in your vehicle during a traffic
    stop?
  choices:
    A: Hide the weapon under the seat before the officer approaches.
    B: Wait until the officer asks if you have any weapons.
    C: Inform the officer upon first contact.
    D: Hand the weapon to the officer immediately.
  answer: C
  explanation: 'The manual explicitly states: "If you have a weapon(s) in the vehicle,
    inform the officer upon first contact."'
- id: 456
  category: vehicle_information
  question: Before starting a vehicle with an automatic transmission, what position
    must the shift selector be in?
  choices:
    A: Neutral
    B: Drive
    C: First gear
    D: Park
  answer: D
  explanation: According to the manual, "For a vehicle that has an automatic transmission,
    you must put the shift selector in 'park.'"
- id: 457
  category: safe_driving_rules
  question: What is the recommended hand position on the steering wheel?
  choices:
    A: Left hand at 12 o'clock and right hand on the gear shift.
    B: Both hands at the 6 o'clock position.
    C: Left hand between 8 and 10 o'clock and right hand between 2 and 4 o'clock.
    D: Left hand at 10 o'clock and right hand at 10 o'clock.
  answer: C
  explanation: 'The manual recommends: "Both hands should be placed on opposite sides
    of the steering wheel (e.g., left hand between 8 and 10 o’clock and right hand
    between 2 and 4 o’clock)."'
- id: 458
  category: vehicle_information
  question: What steering technique should be used when turning sharp corners?
  choices:
    A: The push-pull technique
    B: The hand-over-hand technique
    C: The one-handed spin technique
    D: The slip-through-fingers technique
  answer: B
  explanation: 'The manual states: "When turning sharp corners, turn the steering
    wheel using the ''hand-over-hand'' technique."'
- id: 459
  category: vehicle_information
  question: How should you straighten out the steering wheel after completing a turn?
  choices:
    A: Let the wheel slip freely through your fingers.
    B: Straighten out the steering wheel by hand.
    C: Accelerate quickly so the wheel straightens itself.
    D: Use only your left hand to guide it back.
  answer: B
  explanation: 'The manual advises: "When you complete a turn, straighten out the
    steering wheel by hand. Letting it slip through your fingers could be dangerous."'
- id: 460
  category: safe_driving_rules
  question: What is the recommended technique for turning the steering wheel when
    making sharp corners?
  choices:
    A: The push-pull method
    B: The hand-over-hand technique
    C: One-handed steering
    D: Letting the wheel slip through your fingers
  answer: B
  explanation: The manual states that when turning sharp corners, you should turn
    the steering wheel using the 'hand-over-hand' technique.
- id: 461
  category: safe_driving_rules
  question: After completing a turn, why should you straighten out the steering wheel
    by hand rather than letting it slip through your fingers?
  choices:
    A: It helps maintain the vehicle's alignment.
    B: Letting it slip through your fingers could be dangerous.
    C: It prevents wear and tear on the power steering pump.
    D: It is required by Delaware law.
  answer: B
  explanation: The manual explicitly states, 'When you complete a turn, straighten
    out the steering wheel by hand. Letting it slip through your fingers could be
    dangerous.'
- id: 462
  category: safe_driving_rules
  question: According to the manual, when is it especially easy to be traveling much
    faster than you think?
  choices:
    A: When driving at night
    B: When driving in heavy rain
    C: When you leave high-speed roads and drive on slower local roads
    D: When driving a newly purchased vehicle
  answer: C
  explanation: The manual notes that it is easy to be traveling much faster than you
    think, and 'This is especially true when you leave high speed roads and are driving
    on much slower local roads.'
- id: 463
  category: vehicle_information
  question: How should you brake in an emergency if your vehicle is equipped with
    an Anti-Lock Brake System (ABS)?
  choices:
    A: Pump the brakes rapidly to avoid skidding.
    B: Brake as hard as possible and, if necessary, steer to avoid crashing.
    C: Brake gently and apply the parking brake.
    D: Brake as hard as possible without locking the wheels.
  answer: B
  explanation: With ABS, the manual instructs to 'brake as hard as possible and, if
    necessary, steer to avoid crashing.' Braking without locking the wheels is the
    technique for vehicles without ABS.
- id: 464
  category: safe_driving_rules
  question: Why is it illegal in Delaware to drive with headphones or earphones that
    cover or go in both ears?
  choices:
    A: It distracts the driver visually.
    B: It makes it hard to hear emergency horns or sirens.
    C: It interferes with the vehicle's Bluetooth system.
    D: It causes the driver to speed.
  answer: B
  explanation: The manual states, 'Do not drive with head or earphones that cover
    or go in both ears. This is illegal in Delaware... because it makes it hard to
    hear emergency horns or sirens.'
- id: 465
  category: defensive_driving
  question: What is a potential consequence of 'rubbernecking' (slowing down to look
    at a crash or roadside activity)?
  choices:
    A: It helps law enforcement clear the scene faster.
    B: It improves traffic flow by forcing drivers to slow down.
    C: You could run into a vehicle ahead that has slowed or stopped.
    D: It prevents secondary crashes.
  answer: C
  explanation: The manual warns against rubbernecking, stating, 'If you take your
    eyes off the road to look at something, you could run into a vehicle ahead that
    has slowed or stopped.'
- id: 466
  category: sharing_the_road
  question: If you encounter an aggressive driver on the road, how can you best assist
    law enforcement?
  choices:
    A: Challenge them to get them to pull over.
    B: Make eye contact to show you are not intimidated.
    C: Follow them closely to get their license plate number.
    D: Remain calm, avoid eye contact, and report their tag number to 911.
  answer: D
  explanation: The manual advises assisting law enforcement by remaining calm, avoiding
    eye contact, not challenging them, and reporting aggressive driving by calling
    911 with their tag number.
- id: 467
  category: defensive_driving
  question: To drive safely and avoid last-minute braking, how far ahead do safer
    drivers tend to look?
  choices:
    A: At least 2 seconds ahead
    B: At least 5 seconds ahead
    C: At least 10 seconds ahead
    D: At least 20 seconds ahead
  answer: C
  explanation: According to the manual, 'Safer drivers tend to look at least 10 seconds
    ahead of their vehicle.'
- id: 468
  category: defensive_driving
  question: 'When driving on the highway, a 10-second looking distance is approximately
    equal to:'
  choices:
    A: One city block
    B: Four city blocks or a quarter of a mile
    C: Half a mile
    D: One mile
  answer: B
  explanation: The manual states, 'On the highway, 10 seconds is about four city blocks
    or a quarter of a mile.'
- id: 469
  category: defensive_driving
  question: How does looking well down the road help you save fuel?
  choices:
    A: It allows you to draft behind larger vehicles.
    B: It helps you find the shortest route to your destination.
    C: It allows you to slow down gradually and avoid unnecessary braking.
    D: It increases your vehicle's aerodynamics.
  answer: C
  explanation: The manual explains that by looking well ahead, 'Drivers... can slow
    down gradually or change lanes and avoid unnecessary braking that leads to lower
    miles per gallon.'
- id: 470
  category: safe_driving_rules
  question: Before entering an intersection, what should you do to ensure you will
    not block it if you have to stop?
  choices:
    A: Accelerate quickly to get through the intersection.
    B: Look across the intersection to make sure the path is clear all the way through.
    C: Sound your horn to warn crossing traffic.
    D: Turn on your hazard lights.
  answer: B
  explanation: The manual advises, 'Look across the intersection before you start
    to move to make sure the path is clear all the way through the intersection, and
    you will not block it if you have to stop.'
- id: 471
  category: safe_driving_rules
  question: In Delaware, are you permitted to turn left on a red light?
  choices:
    A: No, left turns on red are always illegal.
    B: Yes, but only from a one-way street onto another one-way street, unless prohibited.
    C: Yes, from any street onto a one-way street.
    D: Yes, as long as there is no oncoming traffic.
  answer: B
  explanation: The manual states, 'You may also turn left from a one-way street onto
    another one-way street unless prohibited.'
- id: 472
  category: defensive_driving
  question: What should you do if you are stopped at an intersection and your view
    of the cross street is blocked?
  choices:
    A: Wait for the vehicle behind you to honk before moving.
    B: Edge forward slowly until you can see.
    C: Accelerate rapidly to clear the blind spot quickly.
    D: Turn right instead of going straight.
  answer: B
  explanation: The manual instructs, 'If you were stopped and your view of a cross
    street is blocked, edge forward slowly until you can see.'
- id: 473
  category: sharing_the_road
  question: What is one of the leading causes of fatalities at railroad crossings?
  choices:
    A: Assuming that a train is not coming.
    B: Crossing the tracks too slowly.
    C: Shifting gears while on the tracks.
    D: Failing to hear the train's horn.
  answer: A
  explanation: The manual explicitly states, 'Assuming that a train is not coming
    is one of the leading causes of fatalities at railroad crossings.'
- id: 474
  category: sharing_the_road
  question: At a railroad crossing with more than one track, why should you wait until
    a passing train is well down the track before starting to cross?
  choices:
    A: To allow the crossing gates to fully reset.
    B: To avoid the turbulence created by the passing train.
    C: Because another train may be hidden by the one that just passed.
    D: To ensure you do not get a ticket from automated cameras.
  answer: C
  explanation: The manual warns, 'At crossings with more than one track, wait until
    the passing train is well down the track before starting to cross. Another train
    may be hidden by the one that just passed.'
- id: 475
  category: safe_driving_rules
  question: What should you do at a railroad crossing with more than one track after
    a train passes?
  choices:
    A: Cross immediately to avoid delaying traffic behind you.
    B: Wait until the passing train is well down the track before starting to cross.
    C: Honk your horn to warn any hidden trains before crossing.
    D: Speed up to cross the tracks as quickly as possible.
  answer: B
  explanation: At crossings with more than one track, you must wait until the passing
    train is well down the track before starting to cross because another train may
    be hidden by the one that just passed.
- id: 476
  category: defensive_driving
  question: Why is it necessary to look over your shoulder when changing lanes?
  choices:
    A: To check your vehicle's exhaust smoke.
    B: To see vehicles in your blind spots that cannot be seen through your mirrors.
    C: To ensure your passengers are securely fastened.
    D: To check for emergency vehicles far behind you.
  answer: B
  explanation: You must turn your head and look over your shoulder to see vehicles
    in your blind spots, as these are areas near the rear corners of your vehicle
    that you cannot see through your mirrors.
- id: 477
  category: defensive_driving
  question: When changing lanes on a multi-lane road, why is it important to check
    the far lane?
  choices:
    A: To see if you can skip a lane and move over twice.
    B: Someone in that lane may be planning to move into the same lane you want to
      enter.
    C: To check for police vehicles monitoring traffic.
    D: To measure the total width of the roadway.
  answer: B
  explanation: You must be sure to check the far lane, if there is one, because someone
    in that lane may be planning to move into the same lane you want to enter.
- id: 478
  category: vehicle_information
  question: What is the proper technique for looking behind you when backing up a
    vehicle?
  choices:
    A: Rely entirely on your rearview mirror.
    B: Use only your side mirrors to guide you.
    C: Place your right arm on the back of the seat and look directly through the
      rear window.
    D: Open your driver's side door and look backward.
  answer: C
  explanation: When backing up, you should place your right arm on the back of the
    seat and turn around so that you can look directly through the rear window. You
    should not depend on your mirrors.
- id: 479
  category: safe_driving_rules
  question: By Delaware law, at what distance must you dim your high beams when an
    oncoming vehicle approaches?
  choices:
    A: Within 200 feet
    B: Within 300 feet
    C: Within 500 feet
    D: Within 1000 feet
  answer: C
  explanation: Delaware law requires you to dim your high beams whenever you come
    within about a one-block distance (within 500 feet) of an oncoming vehicle.
- id: 480
  category: safe_driving_rules
  question: Which of the following is a legal requirement in Delaware regarding headlights
    and weather conditions?
  choices:
    A: You must turn on your headlights anytime you have your wipers on.
    B: You must use high beams in heavy fog or snow.
    C: You may drive with only parking lights on during light rain.
    D: Headlights are only required when it is completely dark outside.
  answer: A
  explanation: It is the law in Delaware that you must turn on your lights in rain,
    mist, and snow, and at any time you have your wipers on.
- id: 481
  category: defensive_driving
  question: If an oncoming driver fails to dim their high beam headlights, what should
    you do?
  choices:
    A: Keep your high beams on to get back at the other driver.
    B: Look toward the right side of the road to avoid being blinded.
    C: Look directly at their headlights to gauge their distance.
    D: Close your eyes briefly until the vehicle passes.
  answer: B
  explanation: If a driver fails to dim their lights, look toward the right side of
    the road. This keeps you from being blinded and allows you to see the edge of
    the road to stay on course.
- id: 482
  category: safe_driving_rules
  question: Why should you use low beams instead of high beams in fog or when it is
    raining hard?
  choices:
    A: High beams will drain the vehicle's battery faster in bad weather.
    B: Low beams are required by federal law in all weather conditions.
    C: Light from high beams will reflect back, causing glare and making it more difficult
      to see.
    D: High beams will blind the drivers following behind you.
  answer: C
  explanation: You should use low beams in fog or when it is snowing or raining hard
    because light from high beams will reflect back, causing glare and making it more
    difficult to see ahead.
- id: 483
  category: sharing_the_road
  question: In which of the following situations should you give your horn a light
    tap?
  choices:
    A: To greet a friend walking on the sidewalk.
    B: To encourage a slow driver in front of you to speed up.
    C: When a person on a bike appears to be moving into your lane of travel.
    D: When you are driving around blind pedestrians.
  answer: C
  explanation: A light tap on the horn should be used when a person on foot or on
    a bike appears to be moving into your lane of travel. You should not use your
    horn to greet friends, encourage someone to drive faster, or around blind pedestrians.
- id: 484
  category: driver_responsibility
  question: When is it inappropriate to use your vehicle's horn?
  choices:
    A: When a child is about to run into the street.
    B: To apprise other drivers of an error they made.
    C: When passing a driver who starts turning into your lane.
    D: When exiting a narrow alley where you cannot see what is ahead.
  answer: B
  explanation: The manual specifically lists "Apprising other drivers of an error"
    as an occasion when you should not use your horn.
- id: 485
  category: safe_driving_rules
  question: If your vehicle breaks down and you do not have emergency flares, how
    can you warn other traffic?
  choices:
    A: Stand in the middle of the traffic lane and wave your arms.
    B: Keep your lights completely off to save your battery.
    C: Stand by the side of the road where you are safe from traffic and wave traffic
      around your vehicle.
    D: Walk down the center of the highway to find an emergency phone.
  answer: C
  explanation: If you do not have emergency flares, stand by the side of the road
    where you are safe from traffic and wave traffic around your vehicle, using a
    white cloth if you have one. Never stand in the roadway.
- id: 486
  category: vehicle_information
  question: How can you visually signal an emergency if your vehicle breaks down on
    the highway?
  choices:
    A: Tie a red cloth to the steering wheel.
    B: Lift the hood or tie a white cloth to the antenna, side mirror, or door handle.
    C: Honk your horn continuously for 5 minutes.
    D: Leave your driver's side door wide open.
  answer: B
  explanation: To signal an emergency, you should lift the hood or tie a white cloth
    to the antenna, side mirror, or door handle.
- id: 487
  category: sharing_the_road
  question: What is the best way to handle driving near another vehicle's blind spot?
  choices:
    A: Stay in the blind spot so they cannot merge into your lane.
    B: Honk your horn continuously while driving in their blind spot.
    C: Either speed up or drop back so the other driver can see your vehicle more
      easily.
    D: Turn on your high beams so they see your reflection in their mirrors.
  answer: C
  explanation: You should try to avoid driving on either side and slightly to the
    rear of another vehicle. Either speed up or drop back so the other driver can
    see your vehicle more easily.
- id: 488
  category: defensive_driving
  question: When is it especially important to check behind your vehicle when slowing
    down?
  choices:
    A: When approaching a green traffic light.
    B: When slowing down quickly or at points where a following driver would not expect
      you to slow down.
    C: Only when driving on a multi-lane interstate highway.
    D: When driving up a steep hill.
  answer: B
  explanation: You must check behind your vehicle whenever you slow down, and it is
    very important when you slow down quickly or at points where a following driver
    would not expect you to slow down, such as private driveways or parking spaces.
- id: 489
  category: defensive_driving
  question: Why should you turn on your headlights when driving away from a rising
    or setting sun?
  choices:
    A: To help you see the road behind you in your rearview mirror.
    B: Because the sun's rays will drain your vehicle's battery.
    C: Drivers coming towards you may have trouble seeing your vehicle due to the
      glare.
    D: It is required by Delaware law during all daylight hours.
  answer: C
  explanation: When driving away from a rising or setting sun, drivers coming towards
    you may have trouble seeing your vehicle. Your headlights will help them see you.
- id: 490
  category: sharing_the_road
  question: Why should you avoid staying alongside a large vehicle such as a truck
    or bus?
  choices:
    A: They travel at higher speeds than passenger cars.
    B: They have large blind spots, making it hard for their drivers to see you.
    C: They are required to use the left lane only.
    D: They emit exhaust fumes that can obscure your vision.
  answer: B
  explanation: 'The manual states: ''Never stay alongside a large vehicle such as
    a truck or bus. These vehicles have large blind spots, and it’s hard for drivers
    of large vehicles to see you.'''
- id: 491
  category: safe_driving_rules
  question: According to Delaware law, what is the minimum distance you must signal
    before making a turn?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: The manual specifies that Delaware law states you must signal for at
    least 300 feet before turning.
- id: 492
  category: safe_driving_rules
  question: What should you do if you plan to turn, but there is a driveway or street
    between you and your intended turn?
  choices:
    A: Signal immediately to warn drivers behind you.
    B: Wait until you have passed the intervening street or driveway before signaling.
    C: Use hand signals instead of electrical signals.
    D: Tap your brakes continuously until you reach the turn.
  answer: B
  explanation: 'The manual advises: ''If there are streets, driveways, or entrances
    between you and where you want to turn, wait until you have passed them to signal.'''
- id: 493
  category: defensive_driving
  question: How can you let drivers behind you know that you are about to slow down
    or stop at an unexpected place?
  choices:
    A: Turn on your hazard lights.
    B: Honk your horn three times.
    C: Tap your brake pedal three or four times quickly.
    D: Wave your hand out the window.
  answer: C
  explanation: 'The manual states: ''If you are going to stop or slow down at a place
    where another driver does not expect it, tap your brake pedal three or four times
    quickly to let those behind you know you are about to slow down.'''
- id: 494
  category: safe_driving_rules
  question: Compared to stopping at 30 mph, how much distance does it take to stop
    a vehicle traveling at 60 mph?
  choices:
    A: About the same distance
    B: Twice the distance
    C: Over three times the distance
    D: Four times the distance
  answer: C
  explanation: According to the manual, stopping at 60 mph does not take twice the
    distance it takes at 30 mph, but over three times the distance.
- id: 495
  category: safe_driving_rules
  question: When is the safest time to slow down for a curve?
  choices:
    A: Before you enter the curve
    B: While you are in the middle of the curve
    C: Just as you exit the curve
    D: You should maintain a constant speed through the curve
  answer: A
  explanation: 'The manual instructs: ''Always slow down before you enter the curve
    so you do not have to brake in the curve. Braking in a curve can cause the vehicle
    to skid.'''
- id: 496
  category: safe_driving_rules
  question: How much should you reduce your speed when driving on a wet road?
  choices:
    A: By about 5 mph
    B: By about 10 mph
    C: Cut your speed in half
    D: Slow to a crawl
  answer: B
  explanation: 'The manual provides specific guidelines for slippery roads, stating:
    ''On a wet road you should reduce your speed about 10 mph.'''
- id: 497
  category: safe_driving_rules
  question: How should you adjust your speed when driving on packed snow?
  choices:
    A: Reduce your speed by 10 mph
    B: Cut your speed in half
    C: Maintain the posted speed limit
    D: Increase your speed to maintain traction
  answer: B
  explanation: 'According to the manual''s section on slippery roads: ''On packed
    snow you should cut your speed in half.'''
- id: 498
  category: defensive_driving
  question: Why can overpasses and bridges be more dangerous during cold weather?
  choices:
    A: They accumulate more oil from traffic.
    B: They are usually built with steeper inclines.
    C: They can be colder than other roadways and have icy spots even when other pavement
      is not.
    D: They do not have adequate drainage for melting snow.
  answer: C
  explanation: 'The manual explains: ''The pavement on bridges can be icy even when
    other pavement is not. This is because bridges can be colder than other roadways.'''
- id: 499
  category: safe_driving_rules
  question: At what temperature is ice on the road most slippery?
  choices:
    A: Well below freezing (around 0 degrees Fahrenheit)
    B: Around the freezing point when the ice can become wet
    C: When the temperature drops rapidly at night
    D: Ice maintains the same level of slipperiness regardless of temperature
  answer: B
  explanation: 'The manual notes: ''When the temperature is around the freezing point,
    ice can become wet. This makes conditions more slippery than at temperatures well
    below freezing.'''
- id: 500
  category: safe_driving_rules
  question: At what speed can your tires lose all traction with the road during a
    heavy rain?
  choices:
    A: 25 mph
    B: 35 mph
    C: 50 mph
    D: 65 mph
  answer: C
  explanation: 'The manual states regarding hydroplaning: ''In a heavy rain, your
    tires can lose all traction with the road at about 50 mph.'''
- id: 501
  category: defensive_driving
  question: What is the first thing you should do if it feels like your tires have
    lost traction with the road (hydroplaning)?
  choices:
    A: Slam on the brakes immediately.
    B: Turn the steering wheel sharply to the right.
    C: Ease your foot off the gas pedal and keep the steering wheel straight.
    D: Accelerate slightly to regain traction.
  answer: C
  explanation: 'If your tires lose traction, the manual instructs you to: ''Ease your
    foot off the gas pedal. Keep the steering wheel straight.'''
- id: 502
  category: safe_driving_rules
  question: What is the proper procedure for entering high-speed traffic from a ramp?
  choices:
    A: Drive to the end of the ramp and stop until there is a gap.
    B: Use the ramp to reach the speed of other vehicles before pulling onto the road.
    C: Enter the highway at a slow speed and gradually accelerate.
    D: Yield to traffic by stopping halfway down the ramp.
  answer: B
  explanation: 'The manual advises: ''Use the ramp to reach the speed of other vehicles
    before you pull onto the road. Do not drive to the end of the ramp and stop...'''
- id: 503
  category: safe_driving_rules
  question: When leaving a main road that has an exit ramp, when should you begin
    to slow down?
  choices:
    A: About 500 feet before the exit ramp
    B: As soon as you turn your signal on
    C: Only after you move onto the exit ramp
    D: While you are still in the main flow of traffic
  answer: C
  explanation: 'The manual states: ''If the road you are traveling has exit ramps,
    do not slow down until you move onto the exit ramp.'''
- id: 504
  category: signs_and_signals
  question: What does an orange triangle decal on the back of a vehicle indicate?
  choices:
    A: The vehicle is carrying hazardous materials.
    B: The vehicle is a slow-moving vehicle that usually goes 25 mph or less.
    C: The vehicle is an emergency responder.
    D: The vehicle is broken down and waiting for a tow.
  answer: B
  explanation: The manual explains that farm tractors, animal-drawn vehicles, and
    roadway maintenance vehicles usually go 25 mph or less and 'should have a slow-moving
    vehicle decal (an orange triangle) on the back.'
- id: 505
  category: signs_and_signals
  question: What symbol should be on the back of farm tractors, animal-drawn vehicles,
    and roadway maintenance vehicles that usually go 25 mph or less?
  choices:
    A: A flashing yellow light
    B: An orange triangle
    C: A red octagon
    D: A white diamond
  answer: B
  explanation: According to the manual, farm tractors, animal-drawn vehicles, and
    roadway maintenance vehicles usually go 25 mph or less and should have a slow-moving
    vehicle decal, which is an orange triangle, on the back.
- id: 506
  category: safe_driving_rules
  question: According to the manual, how does the fatal crash rate at night compare
    to daytime driving?
  choices:
    A: It is the same as during the day
    B: It is twice as high as during the day
    C: It is two-and-one-half times as high as during the day
    D: It is four times as high as during the day
  answer: C
  explanation: Per mile driven, the fatal crash rate at night throughout the nation
    is two-and-one-half times as high as during the day.
- id: 507
  category: defensive_driving
  question: What should you do when passing vehicles at night to avoid the glare of
    their headlights?
  choices:
    A: Stare directly at their headlights to track their position
    B: Turn on your high beams to counter the glare
    C: Close your eyes briefly until the vehicle passes
    D: Use quick glances to check your position and the right edge of the road
  answer: D
  explanation: When passing vehicles at night, do not stare at their headlights. You
    should use quick glances to learn the lane position of oncoming vehicles, learn
    your own position, be certain of the right edge of the road, and look ahead for
    objects.
- id: 508
  category: defensive_driving
  question: 'If you see another driver with their turn signal flashing, you should:'
  choices:
    A: Assume they will make the turn and proceed
    B: Honk your horn to let them know you are there
    C: Plan ahead and decide what to do if they don't turn as well as if they do
    D: Speed up to pass them before they turn
  answer: C
  explanation: The manual states that you should not trust the other driver to do
    what you think they are going to do. When their turn signal is flashing, don't
    assume they will make a turn; plan ahead and decide what to do if they don't turn
    as well as if they do.
- id: 509
  category: safe_driving_rules
  question: Under ideal conditions with good tires and dry pavement, about how many
    feet does it take to react and bring your vehicle to a stop at 50 mph?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 400 feet
  answer: D
  explanation: At 50 mph, it can take about 400 feet to react to something you see
    and bring your vehicle to a stop, which is about the length of a city block.
- id: 510
  category: safe_driving_rules
  question: At 30 mph, approximately how many feet does it take to react and stop
    your vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 400 feet
  answer: B
  explanation: At 30 mph, it can take about 200 feet to stop. That is almost half
    a city block in length.
- id: 511
  category: vehicle_information
  question: At night, your headlights will let you see about how far ahead?
  choices:
    A: 150 feet
    B: 250 feet
    C: 350 feet
    D: 500 feet
  answer: C
  explanation: Your headlights will let you see about 350 feet ahead. You should drive
    at a speed that allows you to stop within this distance.
- id: 512
  category: safe_driving_rules
  question: 'In a very heavy rain, snowstorm, or thick fog where you cannot see more
    than 200 feet ahead, you cannot safely drive faster than:'
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: In a very heavy rain, snowstorm, or thick fog, you may not be able
    to see much more than 200 feet ahead. When you cannot see any farther than that,
    you cannot safely drive faster than 30 mph.
- id: 513
  category: safe_driving_rules
  question: Which rule should you use to tell if you are driving too fast for your
    sight distance?
  choices:
    A: The Two-Second Rule
    B: The Three-Second Rule
    C: The Four-Second Sight Distance Rule
    D: The One-Car-Length Rule
  answer: C
  explanation: To tell if you are driving too fast for conditions, use the 'Four-Second
    Sight Distance Rule.' If you reach a stationary object before you finish counting
    to four-one-thousand, you are going too fast for your sight distance.
- id: 514
  category: safe_driving_rules
  question: Which of the following is true regarding posted speed limits?
  choices:
    A: You can never get a ticket if you are driving under the posted speed limit
    B: They are posted for ideal conditions and you must slow down if the road is
      wet or icy
    C: They apply only during daylight hours
    D: They are suggestions and can be exceeded if traffic is light
  answer: B
  explanation: Speed limits are posted for ideal conditions. If the road is wet or
    icy, if you cannot see well, or if traffic is heavy, you must slow down. You can
    get a ticket for traveling too fast during unsafe conditions even if you are under
    the posted limit.
- id: 515
  category: safe_driving_rules
  question: What is an easy way to tell if you are following the vehicle ahead too
    closely under normal conditions?
  choices:
    A: The two-second rule
    B: The three-second rule
    C: The four-second rule
    D: The five-second rule
  answer: B
  explanation: There is an easy way to tell if you are following too closely. It is
    called the 'three-second rule,' and it works at any speed.
- id: 516
  category: sharing_the_road
  question: Why should you increase your following distance to at least four seconds
    when following a motorcycle?
  choices:
    A: Motorcycles can accelerate faster than cars
    B: Motorcycles block your view of the road ahead
    C: If the motorcycle falls over, you need extra distance to avoid hitting the
      rider
    D: Motorcycles are required to drive slower than other traffic
  answer: C
  explanation: When following motorcycles, if the motorcycle should fall over, you
    need extra distance to avoid hitting the rider. The chances of a fall are greatest
    on wet or icy roads, gravel, or metal surfaces.
- id: 517
  category: sharing_the_road
  question: 'You should increase your following distance when behind large trucks
    or buses because:'
  choices:
    A: They are more likely to break down
    B: The drivers may not be able to see you directly behind them and they block
      your view of the road ahead
    C: They travel at much higher speeds than passenger cars
    D: They emit exhaust fumes that can obscure your vision
  answer: B
  explanation: The drivers of trucks, buses, vans or vehicles pulling campers or trailers
    may not be able to see you when you are directly behind them. Large vehicles also
    block your view of the road ahead, so falling back allows you more room to see
    and be seen.
- id: 518
  category: defensive_driving
  question: As part of driving defensively, what should you constantly be thinking
    of as you drive?
  choices:
    A: How to pass the vehicle ahead of you
    B: An 'escape route' in case a sudden emergency arises
    C: The exact speed of the vehicles in the opposite lane
    D: How to reach your destination in the shortest time possible
  answer: B
  explanation: You should constantly be thinking of an 'escape route' as you drive.
    If a sudden emergency arises, you will have a plan of action ready.
- id: 519
  category: safe_driving_rules
  question: Why are toll plazas considered 'trouble spots' where you may need to slow
    down?
  choices:
    A: Vehicles are changing lanes, preparing to stop, and speeding up again
    B: Toll booth operators often walk across the lanes
    C: The speed limit is always 15 mph at all toll plazas
    D: There are usually farm tractors and animal-drawn vehicles present
  answer: A
  explanation: Toll plazas are trouble spots because vehicles are changing lanes and
    preparing to stop and then speeding up again when leaving the plaza. The number
    of lanes could also change.
- id: 520
  category: defensive_driving
  question: What should you do if you are being followed too closely (tailgated) and
    there is no right lane to move into?
  choices:
    A: Tap your brakes quickly to warn the driver.
    B: Speed up to increase the distance.
    C: Wait until the road ahead is clear and reduce speed slowly.
    D: Turn on your hazard lights and stop.
  answer: C
  explanation: The manual states that if you are being followed too closely and there
    is no right lane, you should wait until the road ahead is clear then reduce speed
    slowly. This encourages the tailgater to drive around you. You should never slow
    down quickly.
- id: 521
  category: safe_driving_rules
  question: Why should you leave extra space when stopped on a hill or incline behind
    another vehicle?
  choices:
    A: To improve your visibility of the road ahead.
    B: The vehicle ahead may roll back when it starts up.
    C: To allow pedestrians to cross between vehicles.
    D: It is required by law for emergency vehicles.
  answer: B
  explanation: According to the manual, you should leave extra space when stopped
    on a hill or incline because the vehicle ahead may roll back when it starts up
    or takes off.
- id: 522
  category: sharing_the_road
  question: 'When passing a cyclist, motorists are required to leave a minimum clearance
    of:'
  choices:
    A: Two feet.
    B: Three feet.
    C: Four feet.
    D: Five feet.
  answer: B
  explanation: The manual explicitly states that motorists are required to leave a
    minimum of three feet of clearance at all times when passing a cyclist.
- id: 523
  category: safe_driving_rules
  question: How large of a gap do you need whenever you want to merge with other traffic,
    change lanes, or enter a roadway?
  choices:
    A: Two seconds.
    B: Three seconds.
    C: Four seconds.
    D: Six seconds.
  answer: C
  explanation: The manual states that anytime you want to merge with other traffic,
    change lanes, or enter a roadway, you need a gap of about four seconds.
- id: 524
  category: safe_driving_rules
  question: What is the safest way to cross several lanes of traffic?
  choices:
    A: Wait for all lanes to be clear and cross them all at once.
    B: Cross them one lane at a time.
    C: Accelerate quickly to minimize time in the intersection.
    D: Use your hazard lights while crossing multiple lanes.
  answer: B
  explanation: The manual advises that if you want to cross several lanes, take them
    one at a time. It is very difficult to determine that all lanes are free and safe
    to cross at once.
- id: 525
  category: safe_driving_rules
  question: 'If you have a green light but there are vehicles blocking the intersection
    ahead, you should:'
  choices:
    A: Enter the intersection and wait for traffic to clear.
    B: Honk your horn until the vehicles move.
    C: Not start across the intersection.
    D: Squeeze past the vehicles on the shoulder.
  answer: C
  explanation: Even if you have the green light, do not start across the intersection
    if there are vehicles blocking your way. If you are caught in the intersection
    when the light changes to red, you will block other traffic and can get a ticket.
- id: 526
  category: safe_driving_rules
  question: At a speed of 55 mph, approximately how much time do you need to pass
    another vehicle safely?
  choices:
    A: 5 seconds.
    B: 10 seconds.
    C: 15 seconds.
    D: 20 seconds.
  answer: B
  explanation: The manual states that at a speed of 55 mph, you need about 10 seconds
    to pass, which means you need a 10-second gap in oncoming traffic.
- id: 527
  category: safe_driving_rules
  question: When is it safe to return to the driving lane after passing another vehicle?
  choices:
    A: When you are one car length ahead of the passed vehicle.
    B: As soon as you activate your right turn signal.
    C: When you can see both headlights of the vehicle you just passed in your rearview
      mirror.
    D: When the driver of the passed vehicle flashes their headlights.
  answer: C
  explanation: Before returning to the driving lane, you must leave enough room. It
    is safe to return when you can see both headlights of the vehicle you just passed
    in your rearview mirror.
- id: 528
  category: sharing_the_road
  question: Why should you be particularly cautious about assuming a motorcycle is
    turning just because its turn signal is on?
  choices:
    A: Motorcycles are allowed to turn from any lane.
    B: Motorcycle turn signals often do not cancel by themselves.
    C: Motorcycles frequently use turn signals to indicate they are slowing down.
    D: Motorcycle turn signals are usually too dim to see clearly.
  answer: B
  explanation: The manual warns never to assume another driver will turn just because
    a signal is on, noting this is particularly true of motorcycles as their signals
    often do not cancel by themselves.
- id: 529
  category: defensive_driving
  question: If you are overtaking a bicycle and an oncoming vehicle is approaching
    at the same time, what should you do?
  choices:
    A: Speed up to pass the bicycle before the vehicle arrives.
    B: Honk your horn so the bicycle moves off the road.
    C: Squeeze between the bicycle and the oncoming vehicle.
    D: Slow down and let the oncoming vehicle pass first, then give extra room to
      the bicycle.
  answer: D
  explanation: When possible, take potential hazards one at a time. If overtaking
    a bicycle with an oncoming vehicle approaching, slow down and let the vehicle
    pass first so you can give extra room to the bicycle.
- id: 530
  category: sharing_the_road
  question: When approaching a railroad crossing, you should leave extra room for
    which of the following vehicles that are required to stop?
  choices:
    A: Motorcycles and mopeds.
    B: Transit buses, school buses, and vehicles carrying hazardous materials.
    C: Passenger vehicles towing trailers.
    D: Delivery trucks and postal vehicles.
  answer: B
  explanation: The manual instructs drivers to leave extra room for vehicles required
    to come to a stop at railroad crossings, including transit buses, school buses,
    or vehicles carrying hazardous materials.
- id: 531
  category: safe_driving_rules
  question: 'When crossing traffic, stopping halfway across is only safe when:'
  choices:
    A: You are driving a compact car.
    B: There is a median divider large enough for your vehicle.
    C: The oncoming traffic is moving slower than 30 mph.
    D: You have your hazard lights activated.
  answer: B
  explanation: When you cross traffic, stopping halfway across is only safe when there
    is a median divider large enough for your vehicle so that no part of it sticks
    out into traffic.
- id: 532
  category: defensive_driving
  question: 'If you must split the difference between two hazards, such as an oncoming
    tractor-trailer and a parked car, you should:'
  choices:
    A: Drive exactly in the middle of the two hazards.
    B: Steer closer to the oncoming tractor-trailer.
    C: Leave a little more room on the side of the more dangerous hazard.
    D: Stop completely until one of the hazards moves.
  answer: C
  explanation: When splitting the difference between two hazards, if one hazard is
    more dangerous than the other, you should leave a little more space on the dangerous
    side (e.g., leaving more room for the passing tractor-trailer).
- id: 533
  category: safe_driving_rules
  question: Because your view is blocked, you should not start to pass another vehicle
    if you are within what distance of a hill or curve?
  choices:
    A: One-tenth of a mile.
    B: One-quarter of a mile.
    C: One-third of a mile.
    D: One-half of a mile.
  answer: C
  explanation: You have to be able to see at least one-third of a mile ahead. You
    should treat a curve or a hill as you do an oncoming vehicle, meaning you should
    not start to pass if you are within one-third of a mile of a hill or curve.
- id: 534
  category: license_system
  question: What is the minimum vision requirement to pass the vision screening without
    a daylight driving restriction in Delaware?
  choices:
    A: 20/20 vision in both eyes
    B: 20/30 vision in at least one eye
    C: 20/40 vision in at least one eye
    D: 20/50 vision in at least one eye
  answer: C
  explanation: According to the manual, to pass the vision screening you must have
    at least 20/40 vision in at least one eye. Those with 20/50 vision are restricted
    to daylight driving only.
- id: 535
  category: license_system
  question: What restriction is placed on Delaware drivers who have 20/50 vision?
  choices:
    A: They must wear corrective lenses at all times.
    B: They are restricted to daylight driving only.
    C: They cannot drive on interstate highways.
    D: They are restricted to driving under 45 mph.
  answer: B
  explanation: The manual states that drivers with 20/50 vision are restricted to
    daylight driving only.
- id: 536
  category: safe_driving_rules
  question: Why should you avoid wearing dark glasses or tinted contact lenses at
    night?
  choices:
    A: They increase the glare from oncoming headlights.
    B: They can cut down the light that you need to see clearly.
    C: They cause severe eye fatigue on long trips.
    D: They are illegal to wear while driving in Delaware.
  answer: B
  explanation: The manual advises avoiding dark glasses or tinted contact lenses at
    night because they can cut down the light that you need to see clearly, even if
    you think they help with glare.
- id: 537
  category: safe_driving_rules
  question: According to the manual, how do the driving records of hearing-impaired
    drivers compare to those of drivers with good hearing?
  choices:
    A: They are slightly worse due to missed audio warnings.
    B: They are much better because they are less distracted.
    C: They are just as good as those drivers with good hearing.
    D: They have higher rates of minor collisions.
  answer: C
  explanation: Studies have shown that the driving records of hearing-impaired drivers
    are just as good as those drivers with good hearing, as they learn to rely more
    on their vision and stay alert.
- id: 538
  category: defensive_driving
  question: To help prevent fatigue on a long trip, what does the manual recommend
    regarding meals?
  choices:
    A: Eat a large meal to maintain your energy levels.
    B: Eat lightly, because large meals can make you sleepy.
    C: Avoid eating completely until you reach your destination.
    D: Eat high-sugar foods to stay alert.
  answer: B
  explanation: The manual recommends to eat lightly and not eat a large meal before
    you leave, because some people get sleepy after they eat a big meal.
- id: 539
  category: defensive_driving
  question: How often should you take a rest break on a long trip to avoid fatigue?
  choices:
    A: Every 30 minutes
    B: Every hour or so
    C: Every 3 to 4 hours
    D: Only when you need to refuel your vehicle
  answer: B
  explanation: To help keep from getting tired on a long trip, the manual advises
    taking breaks by stopping every hour or so, or when you need to.
- id: 540
  category: alcohol_drugs_health
  question: Nationally, alcohol is involved in approximately what percentage of traffic
    crashes in which someone is killed?
  choices:
    A: 15%
    B: 28%
    C: 40%
    D: 50%
  answer: B
  explanation: Nationally, alcohol is involved in about 28% of the traffic crashes
    in which someone is killed.
- id: 541
  category: alcohol_drugs_health
  question: Why are new drivers more affected by alcohol than experienced drivers?
  choices:
    A: They generally have a lower alcohol tolerance.
    B: They are still learning to drive.
    C: They tend to drive at faster speeds.
    D: They are more likely to drive at night.
  answer: B
  explanation: The manual states that new drivers are more affected by alcohol than
    experienced drivers because they are still learning to drive.
- id: 542
  category: alcohol_drugs_health
  question: If a driver has epilepsy, what is required for them to drive legally in
    Delaware?
  choices:
    A: They must only drive during daylight hours.
    B: They must be certified that the condition is under sufficient medical control.
    C: They must have a licensed driver in the passenger seat at all times.
    D: They are permanently prohibited from driving.
  answer: B
  explanation: In Delaware, persons subject to loss of consciousness due to disease
    of the central nervous system (like epilepsy) must be certified that the infirmity
    is under sufficient control to permit them to drive safely.
- id: 543
  category: alcohol_drugs_health
  question: Why should diabetics who take insulin be cautious about driving?
  choices:
    A: Insulin causes permanent night blindness.
    B: They may experience an insulin reaction, blackout, or shock.
    C: Insulin medication causes severe drowsiness.
    D: They are more susceptible to road rage.
  answer: B
  explanation: Diabetics who take insulin should not drive when there is any chance
    of an insulin reaction, blackout, convulsion, or shock, which could result from
    skipping a meal or taking the wrong dosage.
- id: 544
  category: driver_responsibility
  question: What does the manual suggest you do if you are angry or excited before
    driving?
  choices:
    A: Drive slightly faster to get to your destination quickly.
    B: Listen to loud music to distract yourself.
    C: Give yourself time to cool off and stay off the road until calm.
    D: Roll down the windows for fresh air while driving.
  answer: C
  explanation: If you are angry or excited, the manual advises giving yourself time
    to cool off, taking a short walk if necessary, and staying off the road until
    you have calmed down.
- id: 545
  category: sharing_the_road
  question: If another driver passes you when they do not have enough room, what is
    the safest action to take?
  choices:
    A: Speed up to prevent them from cutting you off.
    B: Honk your horn continuously to warn them of their mistake.
    C: Swerve onto the shoulder to give them room.
    D: Slow down and let them return to the drive lane safely.
  answer: D
  explanation: If another driver makes a mistake, do not make it worse. If a driver
    passes you without enough room, slow down and let them return to the drive lane
    safely.
- id: 546
  category: sharing_the_road
  question: According to the manual, which of the following is an example of a driver
    who may be confused and requires extra caution?
  choices:
    A: A driver looking for street signs or house numbers.
    B: A delivery person dropping off a package.
    C: A construction worker directing traffic.
    D: A driver backing out of a parking space.
  answer: A
  explanation: The manual lists 'Drivers looking for street signs or house numbers'
    under the category of 'People who may be confused'. Delivery persons and construction
    workers are listed as 'distracted', and drivers backing out have their 'view blocked'.
- id: 547
  category: penalties_and_points
  question: What is a potential consequence of not wearing corrective lenses if your
    driver license says you must wear them?
  choices:
    A: Your vehicle will be immediately impounded.
    B: You could get a ticket if you are stopped.
    C: Your license will be permanently revoked.
    D: You will be required to retake the driving test.
  answer: B
  explanation: 'The manual states: ''If your driver license says you must wear corrective
    lenses and you do not and you happen to be stopped, you could get a ticket.'''
- id: 548
  category: driver_responsibility
  question: If you are feeling worried or upset about something while driving, what
    does the manual suggest might help keep your mind on your driving?
  choices:
    A: Calling a friend on a hands-free device.
    B: Listening to the radio.
    C: Drinking a caffeinated beverage.
    D: Driving on less populated roads.
  answer: B
  explanation: If you are worried, feeling down, or upset, the manual suggests trying
    to keep your mind on your driving and notes that 'Some have found listening to
    the radio helps.'
- id: 549
  category: vehicle_information
  question: Why should you never turn your vehicle's ignition to the 'lock' position
    while it is still in motion?
  choices:
    A: It will cause the engine to catch fire.
    B: It will cause the steering to lock and you will lose control.
    C: It will immediately lock the brakes.
    D: It will drain the battery.
  answer: B
  explanation: The manual states, 'Never turn your vehicle’s ignition to the "lock"
    position while it is still in motion. This will cause the steering to lock if
    you try to turn the steering wheel, and you will lose control of your vehicle.'
- id: 550
  category: defensive_driving
  question: What is the first thing you should try if your brakes stop working?
  choices:
    A: Shift into neutral immediately.
    B: Pull the parking brake handle as fast as possible.
    C: Pump the brake pedal several times.
    D: Turn off the ignition.
  answer: C
  explanation: If your brakes stop working, the manual advises to first 'Pump the
    brake pedal several times. This will often build up enough brake pressure to allow
    you to stop.'
- id: 551
  category: safe_driving_rules
  question: How should you dry your brakes after driving through deep water?
  choices:
    A: Drive at a high speed to air dry them.
    B: Put the car in low gear, drive slowly, and tap the brakes lightly.
    C: Stop the car and let the engine idle for 10 minutes.
    D: Pump the brakes rapidly while in neutral.
  answer: B
  explanation: To dry wet brakes, the manual instructs to 'put your car in low gear,
    drive slowly, and tap/apply brakes lightly.'
- id: 552
  category: defensive_driving
  question: If your vehicle runs off the pavement, at what speed is it safe to try
    to return to the roadway?
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: Any speed, as long as you turn sharply
  answer: A
  explanation: The manual states, 'Don’t try to get back onto the pavement until you
    have your vehicle under control, your speed is reduced to 15 mph or less, and
    you have looked for traffic behind you.'
- id: 553
  category: defensive_driving
  question: What should you do immediately if your gas pedal sticks and the motor
    keeps going faster?
  choices:
    A: Turn off the engine while still on the road.
    B: Quickly shift to neutral.
    C: Pump the brake pedal repeatedly.
    D: Pull the emergency brake.
  answer: B
  explanation: If the gas pedal sticks, the manual says to keep your eyes on the road
    and 'Quickly shift to neutral,' then pull off the road and turn off the engine.
- id: 554
  category: defensive_driving
  question: Why should you NOT use water to put out a vehicle fire?
  choices:
    A: It will damage the engine components.
    B: Burning gas will float on water and spread the fire.
    C: It will cause the battery to short circuit.
    D: It creates toxic smoke.
  answer: B
  explanation: 'The manual warns regarding vehicle fires: ''Do not use water – burning
    gas will float on it and spread the fire.'''
- id: 555
  category: safe_driving_rules
  question: If your vehicle stalls on railroad tracks and a train is coming, in which
    direction should you run after getting out?
  choices:
    A: In the same direction the train is traveling.
    B: Directly away from the tracks at a 90-degree angle.
    C: In the general direction the train is coming from.
    D: Toward the nearest railroad crossing signal.
  answer: C
  explanation: The manual advises to 'run in the general direction the train is coming
    from, so that debris from the collision will not hit you.'
- id: 556
  category: defensive_driving
  question: When trying to avoid a collision, what are a driver's three main options?
  choices:
    A: Stop, turn, or speed up.
    B: Brake, honk, or swerve.
    C: Accelerate, brake, or brace for impact.
    D: Downshift, steer right, or stop.
  answer: A
  explanation: 'The manual states, ''In avoiding a collision, drivers have three options:
    stop, turn, or speed up.'''
- id: 557
  category: defensive_driving
  question: If your vehicle does NOT have ABS, what is the proper procedure to turn
    quickly to avoid a collision?
  choices:
    A: Turn the steering wheel sharply while pressing the brake pedal to the floor.
    B: Step on the brake pedal, let up, and then turn the steering wheel.
    C: Accelerate slightly while turning the steering wheel.
    D: Shift to neutral and turn the steering wheel.
  answer: B
  explanation: 'Without ABS, the manual states: ''You should step on the brake pedal,
    then let up and turn the steering wheel. Braking will slow the vehicle, put more
    weight on the front tires, and allow for a quicker turn.'''
- id: 558
  category: defensive_driving
  question: What is the primary cause of vehicle skids?
  choices:
    A: Driving with underinflated tires.
    B: Traveling too fast for conditions.
    C: Pumping the brakes too quickly.
    D: Turning the steering wheel too slowly.
  answer: B
  explanation: The manual explicitly states, 'Skids are caused by drivers traveling
    too fast for conditions.'
- id: 559
  category: defensive_driving
  question: What should you do with the brake pedal if your vehicle begins to skid?
  choices:
    A: Press it firmly to the floor.
    B: Pump it rapidly.
    C: Stay off the brake.
    D: Tap it lightly every few seconds.
  answer: C
  explanation: If your vehicle begins to skid, the manual says to 'Stay off the brake.
    Until the vehicle slows, your brakes will not work and could cause you to skid
    more.'
- id: 560
  category: defensive_driving
  question: If your vehicle is about to be hit from the front, what should you try
    to do?
  choices:
    A: Turn the vehicle to have a 'glancing blow' rather than being struck head-on.
    B: Accelerate to reduce the impact time.
    C: Throw your hands in front of your face and duck.
    D: Shift into reverse immediately.
  answer: A
  explanation: The manual advises, 'If your vehicle is about to be hit from the front,
    it is important to try to have a "glancing blow" rather than being struck head
    on. This means... you should try to turn the vehicle.'
- id: 561
  category: driver_responsibility
  question: What must you do if you are involved in a crash with a parked vehicle?
  choices:
    A: Leave a note on the windshield and drive away.
    B: Try to locate the owner.
    C: Call a tow truck for the parked vehicle.
    D: Wait exactly 15 minutes before leaving.
  answer: B
  explanation: The manual states, 'If you are involved in a crash with a parked vehicle,
    you must try to locate the owner.'
- id: 562
  category: defensive_driving
  question: If a vehicle fire gets out of control, how far away from the vehicle should
    you move?
  choices:
    A: At least 25 feet
    B: At least 50 feet
