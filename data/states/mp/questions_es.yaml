questions:
- id: 1
  category: license_system
  question: ¿En las Islas Marianas del Norte, cuál es la edad mínima requerida para
    solicitar un Permiso de Aprendizaje (Learner's Permit)?
  choices:
    A: 14 años y 6 meses
    B: 15 años
    C: 15 años y 6 meses
    D: 16 años
  answer: C
  explanation: Según la Oficina de Vehículos Motorizados (BMV) de la CNMI, un solicitante
    debe tener al menos 15 años y 6 meses de edad para obtener un Permiso de Aprendizaje.
- id: 2
  category: license_system
  question: Bajo el sistema de Licencia de Conducir Graduada (GDL) de la CNMI, ¿cuánto
    tiempo debe un menor tener un Permiso de Aprendizaje antes de ser elegible para
    una Licencia Intermedia?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Una persona debe tener un Permiso de Aprendizaje durante al menos seis
    meses y permanecer libre de condenas antes de solicitar una Licencia Intermedia.
- id: 3
  category: license_system
  question: Mientras conduce con un Permiso de Aprendizaje en la CNMI, ¿qué edad mínima
    debe tener el supervisor en el asiento delantero?
  choices:
    A: 18 años de edad
    B: 21 años de edad
    C: 25 años de edad
    D: 30 años de edad
  answer: B
  explanation: La persona que acompaña al titular del permiso debe ser un conductor
    con licencia que tenga al menos 21 años de edad.
- id: 4
  category: license_system
  question: ¿Cuál es el toque de queda para un conductor que tiene una Licencia Intermedia
    de la CNMI?
  choices:
    A: 9:00 PM a 5:00 AM
    B: 10:00 PM a 6:00 AM
    C: 11:00 PM a 5:00 AM
    D: Medianoche a 6:00 AM
  answer: B
  explanation: Los titulares de una Licencia Intermedia tienen restringido conducir
    entre las 10:00 PM y las 6:00 AM, a menos que estén acompañados por un conductor
    con licencia de 21 años o más, o por motivos específicos de empleo o educación.
- id: 5
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Aprendizaje de la CNMI a partir
    de la fecha de emisión?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: B
  explanation: En las Islas Marianas del Norte, un Permiso de Aprendizaje suele ser
    válido por un período de un año.
- id: 6
  category: license_system
  question: ¿Cuántas horas de práctica de conducción certificada, incluyendo horas
    nocturnas, se requieren para pasar de un Permiso de Aprendizaje a una Licencia
    Intermedia en la CNMI?
  choices:
    A: 30 en total (5 por la noche)
    B: 40 en total (10 por la noche)
    C: 50 en total (10 por la noche)
    D: 20 en total (0 por la noche)
  answer: C
  explanation: Los requisitos de la GDL de la CNMI especifican 50 horas de conducción
    supervisada, con al menos 10 de esas horas realizadas por la noche.
- id: 7
  category: license_system
  question: 'Si se muda a una nueva residencia dentro de la CNMI, debe notificar a
    la Oficina de Vehículos Motorizados (BMV) su cambio de dirección en un plazo de:'
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: A
  explanation: La ley de la CNMI exige que los conductores notifiquen a la BMV cualquier
    cambio de dirección dentro de los 10 días posteriores a la mudanza.
- id: 8
  category: license_system
  question: ¿Cuál es el requisito mínimo de visión para aprobar el examen de la vista
    para una licencia de conducir de la CNMI?
  choices:
    A: 20/20 en ambos ojos
    B: 20/40 en al menos un ojo
    C: 20/50 en ambos ojos
    D: 20/30 en al menos un ojo
  answer: B
  explanation: Para calificar para una licencia de conducir en la CNMI, el solicitante
    debe tener una visión de al menos 20/40 en al menos un ojo, con o sin lentes correctivos.
- id: 9
  category: license_system
  question: Según la ley de la CNMI, una licencia de conducir puede ser suspendida
    si el conductor acumula ¿cuántos puntos en un período de 12 meses?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: El sistema de puntos de la CNMI dicta que la acumulación de 12 o más
    puntos en un período de 12 meses resultará en la suspensión de la licencia.
- id: 10
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es necesario para solicitar una
    licencia de conducir original de la CNMI?
  choices:
    A: Prueba del número de Seguro Social
    B: Un pasaporte válido o certificado de nacimiento
    C: Prueba de residencia en la CNMI
    D: Una copia de su diploma de escuela secundaria
  answer: D
  explanation: Si bien se requieren pruebas de identidad, SSN y residencia, un diploma
    de escuela secundaria no es un requisito para obtener una licencia de conducir
    en la CNMI.
- id: 11
  category: license_system
  question: ¿Cuál es el límite de Concentración de Alcohol en Sangre (BAC) para un
    conductor menor de 21 años en las CNMI (Ley de Tolerancia Cero)?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Las CNMI aplican una Ley de Tolerancia Cero para menores, donde una
    concentración de alcohol en sangre (BAC) de 0.02% o superior resulta en sanciones
    inmediatas a la licencia.
- id: 12
  category: license_system
  question: En las CNMI, ¿por cuánto tiempo es válida normalmente una Licencia de
    Operador estándar (Clase C) antes de que deba renovarse?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: 10 años
  answer: B
  explanation: Una licencia de conducir estándar de las CNMI es generalmente válida
    por un período de 3 años.
- id: 13
  category: license_system
  question: Para obtener una Licencia de Operador Completa (sin restricciones) en
    las CNMI, ¿cuánto tiempo debe haber tenido un conductor una Licencia Intermedia
    sin ninguna infracción de tráfico?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Hasta que cumplan 21 años
  answer: B
  explanation: Bajo el sistema de Licencia de Conducir Gradual (GDL), un conductor
    debe mantener una Licencia Intermedia durante al menos 12 meses consecutivos (1
    año) sin ninguna condena de tráfico antes de pasar a una Licencia Completa.
- id: 14
  category: license_system
  question: 'Si su licencia de conducir de las CNMI se pierde o se destruye, usted
    debe:'
  choices:
    A: Esperar hasta la fecha de vencimiento original para obtener una nueva
    B: Solicitar una licencia duplicada en la BMV y pagar la tarifa requerida
    C: Continuar conduciendo con un informe policial como su licencia
    D: Solicitar un Permiso de Aprendizaje completamente nuevo
  answer: B
  explanation: Si una licencia se pierde o se destruye, el conductor debe solicitar
    inmediatamente un duplicado en la Oficina de Vehículos Motorizados (BMV) y pagar
    la tarifa de reemplazo.
- id: 15
  category: license_system
  question: ¿Cuál de los siguientes es un requisito obligatorio para el registro de
    vehículos en las CNMI?
  choices:
    A: Prueba de seguro de responsabilidad civil
    B: Prueba de un título universitario
    C: Una carta de recomendación de un empleador
    D: Propiedad de al menos dos vehículos
  answer: A
  explanation: En las CNMI, debe proporcionar prueba de un seguro de responsabilidad
    civil válido para registrar un vehículo y mantener una licencia válida.
- id: 16
  category: license_system
  question: 'En las Islas Marianas del Norte, una Licencia de Operador Clase C le
    permite conducir un vehículo motorizado con una Clasificación de Peso Bruto Vehicular
    (GVWR) de menos de:'
  choices:
    A: 8,000 lbs
    B: 10,000 lbs
    C: 15,000 lbs
    D: 26,001 lbs
  answer: B
  explanation: En las CNMI, una Licencia de Operador Clase C estándar es para conducir
    vehículos con una Clasificación de Peso Bruto Vehicular (GVWR) de menos de 10,000
    libras.
- id: 17
  category: license_system
  question: Un visitante de las CNMI que tenga una licencia de conducir válida de
    otro país o territorio de los EE. UU. puede conducir legalmente por un máximo
    de ¿cuántos días?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: De acuerdo con la ley de las CNMI, un visitante con una licencia extranjera
    o de otro estado válida puede conducir por un período que no exceda los 30 días.
- id: 18
  category: license_system
  question: 'Bajo el sistema GDL de las CNMI, si el titular de una Licencia Intermedia
    es condenado por una infracción de tráfico, el período requerido ''libre de infracciones''
    para pasar a una Licencia Comple:'
  choices:
    A: Se reduce a la mitad
    B: Permanece igual
    C: Se reinicia desde la fecha de la infracción
    D: Resulta en la pérdida permanente de los privilegios de conducir
  answer: C
  explanation: Para progresar de una Licencia Intermedia a una Licencia Completa,
    el conductor debe permanecer libre de infracciones durante 6 meses consecutivos.
    Si ocurre una infracción, el período de 6 meses se reinicia.
- id: 19
  category: license_system
  question: ¿La Oficina de Vehículos Motorizados (BMV) en las Islas Marianas del Norte
    es una división de qué departamento gubernamental?
  choices:
    A: Departamento de Comercio
    B: Departamento de Obras Públicas
    C: Departamento de Seguridad Pública
    D: Departamento de Finanzas
  answer: C
  explanation: La Oficina de Vehículos Motorizados (BMV) de las CNMI está bajo la
    jurisdicción del Departamento de Seguridad Pública (DPS).
- id: 20
  category: license_system
  question: Al solicitar una licencia de conducir de las CNMI, ¿cuál es el propósito
    de la designación de 'Donante de órganos'?
  choices:
    A: Es un requisito obligatorio para todos los conductores
    B: Le permite saltarse el examen escrito
    C: Indica su consentimiento legal para donar órganos o tejidos al fallecer
    D: Proporciona un descuento en la tarifa de la licencia
  answer: C
  explanation: La designación de donante de órganos es una elección voluntaria que
    indica su consentimiento legal para ser donante de órganos o tejidos en caso de
    su fallecimiento.
- id: 21
  category: license_system
  question: ¿Cuál es la edad mínima requerida en la CNMI para solicitar una licencia
    Clase D (Chófer), utilizada normalmente para operar taxis?
  choices:
    A: 16 años
    B: 18 años
    C: 21 años
    D: 25 años
  answer: C
  explanation: Para operar un taxi o trabajar como chófer profesional (Clase D) en
    la CNMI, el solicitante debe tener al menos 21 años de edad.
- id: 22
  category: license_system
  question: Mientras se opera un vehículo con un Permiso de Aprendizaje, ¿cuál de
    los siguientes es un requisito estricto con respecto al documento del permiso
    en sí?
  choices:
    A: Puede dejarse en casa si tiene una foto del mismo
    B: Debe estar en posesión inmediata del conductor
    C: Debe mantenerse en la guantera en todo momento
    D: Debe mostrarse en el tablero
  answer: B
  explanation: La ley de la CNMI exige que cualquier persona que opere un vehículo
    motorizado debe tener su licencia o permiso válido en su posesión inmediata.
- id: 23
  category: license_system
  question: Bajo las restricciones de la Licencia Intermedia de la CNMI, ¿cuántos
    pasajeros menores de 18 años (que no sean familiares inmediatos) puede transportar
    el conductor?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Los titulares de una Licencia Intermedia en la CNMI tienen restringido
    el transporte de no más de un pasajero menor de 18 años que no sea un familiar
    inmediato.
- id: 24
  category: license_system
  question: Si reprueba el examen de habilidades de conducción (examen práctico) de
    la CNMI, ¿cuánto tiempo debe esperar normalmente antes de ser elegible para volver
    a tomarlo?
  choices:
    A: 24 horas
    B: 3 días
    C: 1 semana
    D: 1 mes
  answer: C
  explanation: En la CNMI, si un solicitante reprueba el examen práctico, generalmente
    se requiere que espere al menos una semana antes de intentar el examen nuevamente.
- id: 25
  category: license_system
  question: 'Si cambia legalmente su nombre (por ejemplo, por matrimonio u orden judicial),
    debe notificar a la BMV de la CNMI y obtener un duplicado de la licencia en un
    plazo de:'
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: El final del año calendario
  answer: A
  explanation: Las regulaciones de la CNMI exigen que los conductores notifiquen a
    la BMV sobre un cambio de nombre dentro de los 10 días.
- id: 26
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una Licencia de Conducir Comercial
    (CDL) en la CNMI para el comercio intraestatal?
  choices:
    A: 18 años
    B: 19 años
    C: 21 años
    D: 25 años
  answer: C
  explanation: Los solicitantes de una Licencia de Conducir Comercial (CDL) en la
    CNMI deben tener al menos 21 años de edad.
- id: 27
  category: license_system
  question: Bajo el sistema de puntos de la CNMI, ¿cuántos puntos se asignan a su
    historial de conducción por 'abandonar la escena de un accidente' (choque y fuga)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Abandonar la escena de un accidente que involucre daños a la propiedad
    o lesiones es una infracción grave en la CNMI y, por lo general, resulta en la
    adición de 6 puntos al historial del conductor.
- id: 28
  category: license_system
  question: ¿Qué clase de licencia se requiere específicamente para operar una motocicleta
    en las Islas Marianas del Norte?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase M
  answer: A
  explanation: En la CNMI, la Clase A es la designación utilizada para la operación
    de motocicletas.
- id: 29
  category: license_system
  question: ¿Los solicitantes de qué tipo de licencia de la CNMI deben presentar un
    certificado de examinador médico (tarjeta médica) para demostrar aptitud física?
  choices:
    A: Clase C (Operador)
    B: Permiso de Aprendizaje
    C: Clase B o CDL (Vehículos Pesados/Comerciales)
    D: Licencia Intermedia
  answer: C
  explanation: Los conductores de vehículos pesados (Clase B) o vehículos comerciales
    (CDL) en la CNMI deben proporcionar un certificado médico para garantizar que
    cumplen con los estándares de salud física para la seguridad.
- id: 30
  category: license_system
  question: 'La ley de ''Consentimiento Implícito'' en la CNMI significa que al conducir
    un vehículo motorizado, usted ha dado su consentimiento para:'
  choices:
    A: Un registro de su vehículo en cualquier momento
    B: Una prueba química de su aliento, sangre u orina para detectar alcohol/drogas
    C: Permitir que los pasajeros viajen en la caja de una camioneta
    D: Pagar todas las multas de tráfico inmediatamente en efectivo
  answer: B
  explanation: El Consentimiento Implícito significa que se considera que cualquier
    persona que opere un vehículo motorizado en la CNMI ha dado su consentimiento
    para una prueba química de su aliento, sangre u orina para determinar el contenido
    de alcohol o drogas si es arrestada por conducir bajo la influencia (DUI).
- id: 31
  category: driver_testing
  question: En las Islas Marianas del Norte, ¿cuál es el límite de velocidad máximo
    para cualquier vehículo de motor en una carretera, a menos que se indique lo contrario?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: De acuerdo con 9 CMC § 5201, el límite de velocidad máximo en la Mancomunidad
    de las Islas Marianas del Norte (CNMI) es de 45 millas por hora, a menos que se
    indique una velocidad diferente.
- id: 32
  category: driver_testing
  question: Al presentarse para su examen de conducción en la CNMI, ¿qué debe proporcionar
    con respecto al vehículo que utilizará para el examen?
  choices:
    A: Un vehículo con al menos medio tanque de gasolina
    B: Un vehículo con un registro válido y seguro vigente
    C: Un vehículo que tenga menos de 10 años de antigüedad
    D: Comprobante de que el vehículo fue comprado en la CNMI
  answer: B
  explanation: Para realizar el examen de conducción, el solicitante debe proporcionar
    un vehículo que esté en condiciones seguras de funcionamiento y que tenga un certificado
    de registro válido y un seguro vigente.
- id: 33
  category: driver_testing
  question: En la CNMI, se requiere que baje las luces altas de sus faros cuando un
    vehículo que viene en sentido contrario está a cuántos pies de distancia?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Las normas de seguridad estándar en la CNMI exigen que los conductores
    bajen las luces altas cuando un vehículo que viene en sentido contrario se encuentra
    a menos de 500 pies para evitar cegar al otro conductor.
- id: 34
  category: driver_testing
  question: Según la ley de la CNMI, ¿cuál es la multa mínima por una primera condena
    por Conducir Bajo la Influencia (DUI)?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: De acuerdo con 9 CMC § 7105, una persona condenada por una primera
    ofensa de DUI será multada con no menos de $250.
- id: 35
  category: driver_testing
  question: 'Al estacionar su vehículo en una pendiente cuesta abajo en la CNMI, debe
    girar sus ruedas delanteras:'
  choices:
    A: Hacia la acera (bordillo)
    B: Lejos de la acera (bordillo)
    C: Paralelas a la acera (bordillo)
    D: Hacia la izquierda
  answer: A
  explanation: Al estacionar cuesta abajo, debe girar las ruedas hacia la acera para
    que, si el vehículo rueda, lo haga hacia la acera en lugar de hacia el tráfico.
- id: 36
  category: driver_testing
  question: En las Islas Marianas del Norte, debe señalizar su intención de girar
    al menos ¿cuántos pies antes del giro real?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 150 pies
  answer: C
  explanation: La ley 9 CMC § 5306 requiere que los conductores den una señal continua
    durante al menos 100 pies antes de girar.
- id: 37
  category: driver_testing
  question: ¿Qué significa una luz de tráfico roja intermitente en una intersección
    en la CNMI?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse, luego proceder solo cuando sea seguro hacerlo
    C: La luz está a punto de ponerse verde
    D: Ceder el paso a todo el tráfico que viene de la izquierda
  answer: B
  explanation: Una luz roja intermitente tiene el mismo significado que una señal
    de alto; debe detenerse por completo y proceder solo cuando sea seguro.
- id: 38
  category: driver_testing
  question: En la CNMI, ¿es ilegal estacionarse a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: De acuerdo con 9 CMC § 5604, ninguna persona debe detener, parar o
    estacionar un vehículo a menos de 15 pies de un hidrante de incendios.
- id: 39
  category: driver_testing
  question: 'En la CNMI, una persona que deliberadamente no cumple o se niega a cumplir
    con cualquier orden o instrucción legal de un oficial de policía es culpable de:'
  choices:
    A: Una infracción
    B: Un delito menor (misdemeanor)
    C: Un delito grave (felony)
    D: Nada, si tiene una licencia válida
  answer: B
  explanation: Bajo 9 CMC § 5102, es un delito menor (misdemeanor) no cumplir o negarse
    deliberadamente a cumplir con cualquier orden o instrucción legal de cualquier
    oficial de policía investido por ley con autoridad para dirigir, controlar o regular
    el tráfico.
- id: 40
  category: driver_testing
  question: Cuando dos vehículos llegan al mismo tiempo a una intersección no controlada
    en la CNMI, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo a la izquierda
    B: El vehículo a la derecha
    C: El vehículo que viaja a mayor velocidad
    D: El vehículo más grande
  answer: B
  explanation: En una intersección sin señales ni semáforos, el conductor del vehículo
    a la izquierda debe ceder el derecho de paso al vehículo a la derecha.
- id: 41
  category: driver_testing
  question: ¿En las CNMI, cuál es el límite de velocidad al pasar por una escuela
    mientras hay niños presentes o cuando una zona escolar está activa?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El artículo 9 CMC § 5204 establece un límite de velocidad de 15 millas
    por hora al pasar por un edificio escolar o sus terrenos durante el recreo escolar
    o mientras los niños entran o salen de la escuela.
- id: 42
  category: driver_testing
  question: 'Si usted se ve involucrado en un accidente de tráfico en las CNMI que
    resulte en lesiones o muerte, debe:'
  choices:
    A: Conducir hasta la estación de policía más cercana antes de detenerse
    B: Detenerse inmediatamente y permanecer en la escena hasta haber cumplido con
      los requisitos legales
    C: Detenerse solo si su vehículo está dañado
    D: Esperar 24 horas antes de reportar el incidente
  answer: B
  explanation: Según el artículo 9 CMC § 6101, el conductor de cualquier vehículo
    involucrado en un accidente que resulte en lesiones o muerte debe detenerse inmediatamente
    en la escena y permanecer allí hasta haber proporcionado identificación y prestado
    auxilio.
- id: 43
  category: driver_testing
  question: Al conducir en las CNMI, ¿cuál es la distancia de seguimiento recomendada
    detrás de otro vehículo bajo condiciones normales?
  choices:
    A: El largo de un vehículo por cada 20 mph
    B: Al menos dos segundos
    C: Exactamente 50 pies
    D: El largo de un vehículo
  answer: B
  explanation: El Manual del Conductor de las CNMI recomienda una distancia de seguimiento
    de al menos dos segundos para permitir suficiente tiempo para reaccionar ante
    paradas repentinas o peligros.
- id: 44
  category: driver_testing
  question: 'Para conductores de 21 años de edad o más en las CNMI, es ilegal conducir
    con una concentración de alcohol en sangre (BAC) de:'
  choices:
    A: 0.02% o más
    B: 0.05% o más
    C: 0.08% o más
    D: 0.10% o más
  answer: C
  explanation: En las CNMI, el límite legal de concentración de alcohol en sangre
    (BAC) para conductores adultos (21 años o más) es de 0.08%.
- id: 45
  category: driver_testing
  question: ¿Cuál es el monto mínimo requerido de cobertura de seguro de responsabilidad
    civil por daños a la propiedad para un vehículo motorizado en las CNMI?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $20,000
  answer: B
  explanation: La ley de seguro obligatorio de las CNMI requiere un mínimo de $10,000
    para daños a la propiedad en cualquier accidente.
- id: 46
  category: driver_testing
  question: Según la ley de las CNMI, ¿los niños menores de qué edad deben estar debidamente
    asegurados en un sistema de retención infantil?
  choices:
    A: Menores de 4 años
    B: Menores de 5 años
    C: Menores de 7 años
    D: Menores de 8 años
  answer: B
  explanation: La ley de las CNMI exige que los niños menores de 5 años, o que pesen
    menos de 60 libras, deben estar asegurados en un sistema de retención infantil
    aprobado.
- id: 47
  category: driver_testing
  question: En las CNMI, ¿cuántos puntos se asignan a su historial de conducción por
    una condena de 'Conducción Temeraria' (Reckless Driving)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La conducción temeraria es una infracción grave en las CNMI y resulta
    en la adición de 6 puntos al historial del conductor.
- id: 48
  category: driver_testing
  question: Al estacionarse en una vía pública en las CNMI, ¿no debe estacionarse
    a menos de cuántos pies de una señal de pare (stop) o señal de tráfico?
  choices:
    A: 20 pies
    B: 30 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: Las regulaciones de las CNMI prohíben estacionarse a menos de 30 pies
    al aproximarse a cualquier señal intermitente, señal de pare o señal de control
    de tráfico ubicada al costado de una carretera.
- id: 49
  category: driver_testing
  question: ¿Cuál es la multa por una primera infracción por usar un dispositivo electrónico
    portátil (enviar mensajes de texto/llamar) mientras conduce en las CNMI?
  choices:
    A: Hasta $100
    B: Hasta $250
    C: Hasta $500
    D: Hasta $1,000
  answer: C
  explanation: Bajo la ley de 'Manos Libres' (Hands-Free) de las CNMI (Ley Pública
    16-46), la sanción por usar un dispositivo electrónico portátil mientras se conduce
    puede ser una multa de hasta $500.
- id: 50
  category: driver_testing
  question: De acuerdo con el sistema de puntos de las CNMI, ¿cuántos puntos se agregan
    a su historial por 'Exceso de Velocidad' (Speeding) (de 1 a 10 millas sobre el
    límite)?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Exceder la velocidad entre 1 y 10 millas por hora sobre el límite establecido
    resulta en 2 puntos en el historial de conducción de las CNMI.
- id: 51
  category: driver_testing
  question: 'En las CNMI, si usted se ve involucrado en un accidente que resulte en
    lesiones o muerte, debe notificar inmediatamente a:'
  choices:
    A: La Oficina de Vehículos Motorizados (BMV)
    B: El Departamento de Seguridad Pública (Policía)
    C: Solo a su agente de seguros
    D: La oficina del Gobernador
  answer: B
  explanation: La ley de las CNMI exige que el conductor de cualquier vehículo involucrado
    en un accidente que resulte en lesiones o muerte notifique de inmediato al Departamento
    de Seguridad Pública (DPS).
- id: 52
  category: driver_testing
  question: 'Bajo la ley de Consentimiento Implícito (Implied Consent) de las CNMI,
    si usted se niega a someterse a una prueba química de alcohol, sus privilegios
    de conducir serán suspendidos por:'
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Al conducir en las CNMI, usted da su consentimiento para ser sometido
    a pruebas de alcohol. La negativa a realizar la prueba resulta en una suspensión
    automática de la licencia por 6 meses.
- id: 53
  category: driver_responsibility
  question: 'En las Islas Marianas del Norte, si usted se ve involucrado en un accidente
    de tráfico que resulte en daños a la propiedad, debe informarlo al Departamento
    de Seguridad Pública si los daños a la propiedad de cualquier persona parecen
    exceder los:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: De acuerdo con la ley de las CNMI (9 CMC § 4101), se debe presentar
    un informe por escrito al Departamento de Seguridad Pública dentro de las 24 horas
    si el accidente resulta en lesiones corporales, muerte o daños a la propiedad
    que excedan los $500.
- id: 54
  category: driver_responsibility
  question: Todo vehículo motorizado que circule por las carreteras públicas de las
    CNMI debe estar cubierto por una póliza de seguro de responsabilidad civil. ¿Cuál
    es la cobertura mínima requerida por lesiones corporales o muerte de una persona
    en un solo accidente?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: C
  explanation: La ley de las CNMI (9 CMC § 8101) exige un mínimo de $15,000 por lesiones
    corporales o muerte de una persona en un solo accidente.
- id: 55
  category: driver_responsibility
  question: Bajo las leyes de responsabilidad financiera de las CNMI, ¿cuál es la
    cobertura mínima de seguro de responsabilidad civil requerida por lesiones corporales
    o muerte de dos o más personas en un solo accidente?
  choices:
    A: $20,000
    B: $30,000
    C: $40,000
    D: $50,000
  answer: B
  explanation: El requisito mínimo de responsabilidad de las CNMI para lesiones corporales
    o muerte que involucre a dos o más personas en un solo accidente es de $30,000.
- id: 56
  category: driver_responsibility
  question: ¿Cuál es la cobertura mínima de seguro de responsabilidad civil requerida
    por daños o destrucción de la propiedad de terceros en un solo accidente en las
    Islas Marianas del Norte?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $20,000
  answer: B
  explanation: La ley de las CNMI exige un mínimo de $10,000 en cobertura para daños
    a la propiedad resultantes de un accidente de vehículo motorizado.
- id: 57
  category: driver_responsibility
  question: Si un oficial de la ley en las CNMI solicita una prueba de seguro durante
    una parada de tráfico y usted no puede proporcionarla, ¿cuál de las siguientes
    situaciones podría ocurrir?
  choices:
    A: Se le dará solo una advertencia verbal
    B: El registro de su vehículo puede ser suspendido y podría enfrentar una multa
    C: Se le requerirá vender el vehículo dentro de las 48 horas
    D: No se tomará ninguna medida si tiene una licencia de conducir válida
  answer: B
  explanation: Operar un vehículo sin el seguro de responsabilidad civil requerido
    en las CNMI es una infracción que puede dar lugar a multas y a la suspensión del
    registro del vehículo y de los privilegios de conducir.
- id: 58
  category: driver_responsibility
  question: Si usted choca contra un vehículo desatendido en las CNMI y no puede localizar
    al propietario, ¿cuál es su responsabilidad legal?
  choices:
    A: Esperar 10 minutos y luego irse si no aparece nadie
    B: Dejar una nota por escrito con su nombre, dirección y una explicación, y notificar
      a la policía
    C: Tocar la bocina hasta que alguien llegue
    D: Informarlo únicamente a su compañía de seguros
  answer: B
  explanation: Los conductores que chocan contra un vehículo desatendido deben intentar
    encontrar al propietario. Si no tienen éxito, deben dejar una nota visible con
    su información de contacto e informar de la colisión al Departamento de Seguridad
    Pública.
- id: 59
  category: driver_responsibility
  question: En las Islas Marianas del Norte, ¿con qué frecuencia debe renovarse el
    registro de un vehículo motorizado?
  choices:
    A: Cada 6 meses
    B: Cada año
    C: Cada 2 años
    D: Cada 5 años
  answer: B
  explanation: El registro de vehículos en las CNMI debe renovarse anualmente en la
    Oficina de Vehículos Motorizados (BMV).
- id: 60
  category: driver_responsibility
  question: 'Cuando se vende o transfiere un vehículo en las CNMI, el propietario
    debe notificar la transferencia a la Oficina de Vehículos Motorizados (BMV) dentro
    de:'
  choices:
    A: 24 horas
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Según la ley de las CNMI, el propietario de un vehículo debe notificar
    a la BMV sobre una transferencia de propiedad dentro de los 10 días posteriores
    a la transacción.
- id: 61
  category: driver_responsibility
  question: 'En las CNMI, una persona condenada por su primera infracción de DUI (conducir
    bajo la influencia) se enfrenta a una sentencia mínima obligatoria de cárcel de:'
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 1 semana
  answer: C
  explanation: Según 9 CMC § 7105, una primera condena por DUI en las CNMI conlleva
    una pena de prisión mínima obligatoria de no menos de 72 horas consecutivas.
- id: 62
  category: driver_responsibility
  question: 'Si se niega a someterse a una prueba química de alcohol o drogas cuando
    lo solicite un oficial de la ley en las CNMI, su licencia será suspendida automáticamente
    por:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 2 años
  answer: C
  explanation: Bajo la ley de las CNMI, una primera negativa a realizarse una prueba
    química resulta en una suspensión administrativa de la licencia de 6 meses.
- id: 63
  category: driver_responsibility
  question: ¿Dónde debe colocarse la calcomanía de validación del registro en la placa
    de matrícula de un vehículo en las Islas Marianas del Norte?
  choices:
    A: Solo en la placa delantera
    B: En la placa trasera
    C: En la esquina inferior izquierda del parabrisas
    D: En el parachoques trasero
  answer: B
  explanation: En las CNMI, la calcomanía de registro (sticker) debe fijarse en la
    placa de matrícula trasera para demostrar que el registro del vehículo está al
    día.
- id: 64
  category: driver_responsibility
  question: 'Si no cumple con una sentencia judicial resultante de un accidente de
    vehículo motorizado en las CNMI dentro de los 30 días, la Oficina de Vehículos
    Motorizados (BMV) está autorizada a:'
  choices:
    A: Aumentar las primas de su seguro
    B: Confiscar su vehículo permanentemente
    C: Suspender su licencia de conducir y el registro del vehículo
    D: Emitir una nueva licencia con una restricción de 'deudor'
  answer: C
  explanation: Bajo las leyes de responsabilidad financiera, el incumplimiento del
    pago de una sentencia por daños resultantes de un accidente conllevará la suspensión
    tanto de sus privilegios de conducción como del registro del vehículo.
- id: 65
  category: driver_responsibility
  question: 'En las CNMI, la ley de ''Deber de dar información y prestar ayuda'' requiere
    que un conductor involucrado en un accidente proporcione su nombre, dirección
    y número de registro del vehículo a:'
  choices:
    A: Solo a su agente de seguros
    B: Cualquier persona golpeada o al conductor/ocupante de cualquier vehículo con
      el que haya chocado
    C: Solo a los testigos
    D: A la BMV dentro de los 30 días
  answer: B
  explanation: La ley de las CNMI (9 CMC § 4103) exige que los conductores en accidentes
    proporcionen información de identificación a las otras partes involucradas y presten
    asistencia razonable a cualquier persona herida.
- id: 66
  category: driver_responsibility
  question: En las Islas Marianas del Norte, ¿cuáles son los requisitos mínimos de
    seguro de responsabilidad civil para un vehículo motorizado?
  choices:
    A: $10,000 por lesiones corporales a una persona, $20,000 por dos o más, y $5,000
      por daños a la propiedad
    B: $15,000 por lesiones corporales a una persona, $30,000 por dos o más, y $15,000
      por daños a la propiedad
    C: $25,000 por lesiones corporales a una persona, $50,000 por dos o más, y $10,000
      por daños a la propiedad
    D: $50,000 por lesiones corporales a una persona, $100,000 por dos o more, y $25,000
      por daños a la propiedad
  answer: B
  explanation: Según el Código de Vehículos de las CNMI (9 CMC § 8101), la cobertura
    mínima obligatoria de seguro de responsabilidad civil es de $15,000 por lesiones/muerte
    de una persona, $30,000 por dos o más personas, y $15,000 por daños a la propiedad.
- id: 67
  category: driver_responsibility
  question: ¿Con qué frecuencia debe someterse a una inspección de seguridad un vehículo
    motorizado registrado en las Islas Marianas del Norte?
  choices:
    A: Cada 6 meses
    B: Cada año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: En las CNMI, los vehículos deben someterse a una inspección de seguridad
    anualmente como parte del proceso de renovación del registro para garantizar que
    cumplen con los estándares de seguridad.
- id: 68
  category: driver_responsibility
  question: ¿Dónde debe guardarse el certificado de registro válido de un vehículo
    motorizado en las CNMI?
  choices:
    A: En la residencia del propietario
    B: En la guantera o llevado de otro modo en el vehículo
    C: En la Oficina de Vehículos Motorizados
    D: En el maletero del vehículo
  answer: B
  explanation: La ley de las CNMI exige que la tarjeta de registro se lleve en el
    vehículo para el cual fue emitida o que la persona que conduce el vehículo la
    lleve consigo para mostrarla a petición de un oficial de policía.
- id: 69
  category: driver_responsibility
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    un conductor adulto (21 años o más) en las Islas Marianas del Norte?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En las CNMI, es ilegal que una persona de 21 años o más opere un vehículo
    motorizado con un BAC de 0.08% o superior.
- id: 70
  category: driver_responsibility
  question: En las CNMI, ¿quién es legalmente responsable de asegurar que un pasajero
    menor de 16 años use el cinturón de seguridad o esté en un sistema de retención
    infantil?
  choices:
    A: El pasajero
    B: Los padres del pasajero (incluso si no están en el auto)
    C: El conductor del vehículo
    D: Solo el propietario del vehículo
  answer: C
  explanation: El conductor es responsable de la seguridad de los menores en el vehículo
    y debe asegurarse de que estén debidamente abrochados o asegurados en un asiento
    de seguridad infantil aprobado.
- id: 71
  category: driver_responsibility
  question: ¿Qué debe hacer si vende su vehículo a otra persona en las CNMI?
  choices:
    A: Nada; el nuevo propietario es el único responsable de todo el papeleo
    B: Conservar las placas de matrícula para su próximo coche
    C: Endosar el certificado de propiedad y notificar a la BMV sobre la transferencia
      dentro de un plazo específico
    D: Cancelar su seguro y tirar el registro
  answer: C
  explanation: Cuando se vende un vehículo, el vendedor debe firmar el título para
    transferirlo al comprador y se debe notificar a la BMV para actualizar los registros
    de registro y propiedad.
- id: 72
  category: driver_responsibility
  question: Si un oficial de la ley de las CNMI solicita una prueba de responsabilidad
    financiera, ¿qué documento debe proporcionar?
  choices:
    A: Su certificado de nacimiento
    B: Una tarjeta de identificación de seguro de vehículo motorizado válida
    C: El historial de reparaciones de su vehículo
    D: Un extracto bancario que muestre al menos $1,000
  answer: B
  explanation: La prueba de responsabilidad financiera se demuestra típicamente proporcionando
    una tarjeta de seguro válida emitida por una compañía de seguros autorizada para
    operar en las CNMI.
- id: 73
  category: driver_responsibility
  question: En las CNMI, ¿cuál es la multa máxima por una primera infracción por estacionarse
    en un espacio designado para personas con discapacidades sin un cartel o placa
    válida?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: Las CNMI aplican multas estrictas por el estacionamiento no autorizado
    en espacios para personas con discapacidades, con multas que generalmente comienzan
    en $250 por la primera infracción para garantizar la accesibilidad.
- id: 74
  category: driver_responsibility
  question: ¿Qué sucede con sus privilegios de conducir en las CNMI si se niega a
    realizar una prueba química de alcohol cuando lo solicita un oficial de policía?
  choices:
    A: Nada, siempre y cuando no estuviera excediendo el límite de velocidad
    B: Su licencia será suspendida automáticamente por un período de tiempo
    C: Se le dará una segunda oportunidad al día siguiente
    D: Se le requerirá tomar una prueba escrita en su lugar
  answer: B
  explanation: Bajo la ley de Consentimiento Implícito (9 CMC § 7106), la negativa
    a someterse a una prueba química resulta en una suspensión administrativa de la
    licencia, independientemente de si luego es condenado por conducir bajo la influencia
    (DUI).
- id: 75
  category: driver_responsibility
  question: ¿Cuándo se le permite conducir un vehículo motorizado en las CNMI sin
    un registro válido?
  choices:
    A: Cuando conduce directamente a la BMV para renovarlo
    B: Si el vehículo tiene menos de un año de antigüedad
    C: Nunca; es ilegal operar un vehículo no registrado en las vías públicas
    D: Solo los domingos y días festivos
  answer: C
  explanation: Todos los vehículos motorizados que operan en las carreteras públicas
    de las CNMI deben estar registrados de manera actual y válida en la Oficina de
    Vehículos Motorizados (BMV).
- id: 76
  category: driver_responsibility
  question: 'En las CNMI, si es declarado culpable de ''atropello y fuga'' (abandonar
    la escena de un accidente) que involucre lesiones personales, la sanción puede
    incluir:'
  choices:
    A: Solo una multa de $50
    B: Una charla de seguridad obligatoria de 5 minutos
    C: Prisión y/o multas elevadas, y la revocación de la licencia
    D: Ninguna sanción si regresa dentro de las 24 horas
  answer: C
  explanation: Abandonar la escena de un accidente que involucre lesiones o muerte
    es un delito grave en las CNMI (9 CMC § 5101), castigado con multas, prisión y
    la pérdida de los privilegios de conducir.
- id: 77
  category: safe_driving_rules
  question: Al estacionarse cerca de una intersección, ¿cuál es la distancia mínima
    que debe mantener de una señal de alto o semáforo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Los conductores en las CNMI no deben estacionarse a menos de 30 pies
    de cualquier señal intermitente oficial, señal de alto o señal de control de tráfico
    ubicada al costado de una calzada.
- id: 78
  category: safe_driving_rules
  question: ¿Qué señal manual es la forma correcta de indicar un giro a la derecha
    en las CNMI?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido recto hacia afuera de la ventana
  answer: B
  explanation: Para señalar un giro a la derecha usando señales manuales, el conductor
    debe extender su brazo izquierdo por la ventana y doblarlo hacia arriba a la altura
    del codo.
- id: 79
  category: safe_driving_rules
  question: En las CNMI, ¿cuándo se le permite girar a la derecha con luz roja?
  choices:
    A: Nunca, debe esperar a la luz verde
    B: Solo si hay una señal que lo permita específicamente
    C: Después de detenerse por completo y ceder el paso a los peatones y a otros
      vehículos, a menos que una señal lo prohíba
    D: Solo entre las 10:00 PM y las 5:00 AM
  answer: C
  explanation: La ley de las CNMI permite girar a la derecha en rojo después de una
    parada completa y de ceder el paso al tráfico y a los peatones, siempre que no
    haya una señal que prohíba el giro.
- id: 80
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima que debe mantener de un paso de peatones
    en una intersección al estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: C
  explanation: En las CNMI, es ilegal estacionarse a menos de 20 pies de un paso de
    peatones en una intersección.
- id: 81
  category: safe_driving_rules
  question: ¿A menos que se indique lo contrario, cuál es el límite de velocidad en
    distritos residenciales y comerciales en las CNMI?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: El límite de velocidad predeterminado para zonas residenciales y comerciales
    en las Islas Marianas del Norte es de 25 mph.
- id: 82
  category: safe_driving_rules
  question: ¿Cuándo es legal rebasar a otro vehículo por la derecha en las CNMI?
  choices:
    A: Siempre que el vehículo de adelante vaya demasiado lento
    B: Cuando el vehículo de adelante esté girando o esté por girar a la izquierda
      y haya suficiente ancho de pavimento
    C: Solo en calles de un solo sentido
    D: Rebasar por la derecha nunca es legal
  answer: B
  explanation: Rebasar por la derecha está permitido en las CNMI cuando el vehículo
    que se está adelantando está girando a la izquierda y hay suficiente espacio en
    el lado derecho de la carretera para rebasar de manera segura sin salirse del
    pavimento.
- id: 83
  category: safe_driving_rules
  question: Al conducir de noche, ¿a cuántos pies de distancia de un vehículo que
    viene en sentido contrario debe bajar sus luces altas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Las normas de seguridad de las CNMI exigen que los conductores cambien
    a luces bajas cuando un vehículo que viene en sentido contrario se encuentra a
    menos de 500 pies para evitar cegar al otro conductor.
- id: 84
  category: safe_driving_rules
  question: Para mantener una distancia de seguimiento segura detrás del vehículo
    que está delante de usted, ¿qué regla recomienda usar el Manual del Conductor
    de las CNMI?
  choices:
    A: La regla de la longitud de un vehículo
    B: La regla de los dos segundos
    C: La regla de los tres segundos
    D: La regla de los cinco segundos
  answer: C
  explanation: Las CNMI recomiendan una distancia de seguimiento de tres segundos
    en condiciones normales de conducción para permitir suficiente tiempo para reaccionar
    ante peligros.
- id: 85
  category: safe_driving_rules
  question: Al estacionar un vehículo cuesta abajo en una calle de doble sentido con
    acera, ¿hacia dónde deben girarse las ruedas delanteras?
  choices:
    A: Hacia la acera
    B: En dirección contraria a la acera
    C: Paralelas a la acera
    D: No importa
  answer: A
  explanation: Al estacionar cuesta abajo, gire las ruedas hacia la acera para que,
    si el vehículo rueda, choque contra la acera y se detenga.
- id: 86
  category: safe_driving_rules
  question: En las CNMI, ¿qué debe hacer cuando un autobús escolar se detiene con
    sus luces rojas intermitentes y el brazo de parada extendido en una carretera
    de dos carriles?
  choices:
    A: Reducir la velocidad y pasar con cuidado
    B: Detenerse solo si viaja en la misma dirección que el autobús
    C: Detenerse desde cualquier dirección hasta que las luces dejen de parpadear
      y el brazo se retraiga
    D: Tocar la bocina y continuar
  answer: C
  explanation: En una carretera de dos carriles en las CNMI, el tráfico en ambas direcciones
    debe detenerse ante un autobús escolar con luces rojas intermitentes.
- id: 87
  category: safe_driving_rules
  question: Según la ley de las CNMI, ¿quién está obligado a usar el cinturón de seguridad
    en un vehículo motorizado en movimiento?
  choices:
    A: Solo el conductor
    B: Solo el conductor y los pasajeros del asiento delantero
    C: Solo los pasajeros menores de 18 años
    D: El conductor y todos los pasajeros, independientemente de su posición en el
      asiento
  answer: D
  explanation: La ley de las CNMI exige que el conductor y todos los pasajeros de
    un vehículo motorizado estén debidamente sujetos por un cinturón de seguridad
    o un sistema de retención infantil.
- id: 88
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo permitido en cualquier carretera
    en las CNMI, a menos que las señales indiquen lo contrario?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: El límite de velocidad máximo en las carreteras de las CNMI es de 45
    millas por hora, a menos que se indique un límite inferior por seguridad.
- id: 89
  category: safe_driving_rules
  question: Cuando tenga la intención de girar, ¿debe dar una señal continua durante
    al menos cuántos pies antes de girar?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 200 pies
  answer: C
  explanation: La ley de las CNMI exige que los conductores señalen su intención de
    girar de forma continua durante al menos 100 pies antes de llegar a la intersección
    o al punto de giro.
- id: 90
  category: safe_driving_rules
  question: ¿A cuántos pies de distancia debe estacionarse de una señal de pare, una
    baliza intermitente o una señal de control de tráfico ubicada al costado de la
    calzada?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Se prohíbe a los conductores estacionar a menos de 30 pies de cualquier
    baliza intermitente oficial, señal de pare (stop) o señal de control de tráfico.
- id: 91
  category: safe_driving_rules
  question: ¿Cuando un autobús escolar se detiene en una carretera de dos carriles
    con sus luces rojas intermitentes, quién debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que se aproxima por el frente
    C: El tráfico de ambas direcciones
    D: Nadie está obligado a detenerse si no hay niños visibles
  answer: C
  explanation: En una carretera de dos carriles en las CNMI, los conductores que viajan
    en ambas direcciones deben detenerse ante un autobús escolar con luces rojas intermitentes.
- id: 92
  category: safe_driving_rules
  question: Para conductores de 21 años de edad o más, ¿cuál es el límite legal de
    concentración de alcohol en sangre (BAC) en las CNMI?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En las Islas Marianas del Norte, es ilegal que un adulto (21+) opere
    un vehículo motorizado con un BAC de 0.08% o superior.
- id: 93
  category: safe_driving_rules
  question: En las CNMI, ¿cuál es el propósito principal de un carril central marcado
    con líneas amarillas continuas y discontinuas en ambos lados?
  choices:
    A: Rebasar tráfico lento
    B: Solo estacionamiento de emergencia
    C: Solo giros a la izquierda
    D: Viajes a alta velocidad
  answer: C
  explanation: Los carriles centrales marcados de esta manera están designados solo
    para giros a la izquierda y no deben usarse para rebasar o para el tráfico directo.
- id: 94
  category: safe_driving_rules
  question: 'Un giro en U está prohibido en las CNMI si su vehículo no puede ser visto
    por otros conductores que se aproximan desde cualquier dirección dentro de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: Los giros en U son ilegales en curvas o colinas donde el vehículo no
    puede ser visto por otros conductores dentro de una distancia de 200 pies en cualquier
    dirección.
- id: 95
  category: safe_driving_rules
  question: Al estacionar su vehículo en paralelo a un bordillo (acera), ¿a cuántas
    pulgadas del bordillo debe estar?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Las regulaciones de las CNMI requieren que un vehículo estacionado
    en paralelo al bordillo debe estar a menos de 12 pulgadas de dicho bordillo.
- id: 96
  category: safe_driving_rules
  question: Cuando se aproxima un vehículo de emergencia con sirenas y luces intermitentes,
    ¿qué debe hacer?
  choices:
    A: Acelerar para salir del camino
    B: Detenerse inmediatamente en su carril
    C: Conducir hacia el borde derecho de la carretera y detenerse
    D: Seguir de cerca al vehículo de emergencia
  answer: C
  explanation: Ante la aproximación de un vehículo de emergencia que utiliza señales
    auditivas o visuales, los conductores deben ceder el paso moviéndose hacia el
    borde derecho de la carretera y deteniéndose.
- id: 97
  category: safe_driving_rules
  question: ¿Cuál es la señal manual correcta para indicar que está disminuyendo la
    velocidad o deteniéndose?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido hacia afuera
  answer: C
  explanation: La señal manual estándar para disminuir la velocidad o detenerse es
    el brazo izquierdo y la mano extendidos hacia abajo.
- id: 98
  category: safe_driving_rules
  question: En las CNMI, ¿está prohibido estacionar a cuántos pies de un cruce peatonal
    en una intersección?
  choices:
    A: 10 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: B
  explanation: Para mantener la visibilidad de peatones y conductores, se prohíbe
    estacionar a menos de 20 pies de un cruce peatonal en una intersección.
- id: 99
  category: defensive_driving
  question: Según el Manual del Conductor de las CNMI, ¿con cuánta anticipación debe
    observar la carretera para identificar posibles peligros a tiempo?
  choices:
    A: 5 a 8 segundos
    B: 10 a 15 segundos
    C: 20 a 25 segundos
    D: 30 a 40 segundos
  answer: B
  explanation: Para ser un conductor seguro en las CNMI, debe mirar hacia adelante
    al menos 10 a 15 segundos. Esto le permite ver los peligros antes de llegar a
    ellos y le da tiempo para reaccionar.
- id: 100
  category: defensive_driving
  question: ¿Cuál es la distancia mínima de seguimiento recomendada detrás del vehículo
    que va delante de usted bajo condiciones de conducción ideales en las Islas Marianas
    del Norte?
  choices:
    A: La longitud de un automóvil
    B: Dos segundos
    C: Cuatro segundos
    D: 50 pies
  answer: B
  explanation: El Manual del Conductor de las CNMI recomienda la 'regla de los dos
    segundos' como distancia mínima de seguimiento en condiciones ideales para asegurar
    que tenga suficiente tiempo para detenerse si el vehículo de adelante frena repentinamente.
- id: 101
  category: defensive_driving
  question: ¿A qué distancia debe cambiar de luces altas a luces bajas cuando sigue
    a otro vehículo por la noche en las Islas Marianas del Norte?
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: B
  explanation: Debe atenuar sus luces altas cuando siga a otro vehículo a una distancia
    de 300 pies o menos para que sus luces no se reflejen en su espejo retrovisor
    y causen deslumbramiento.
- id: 102
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar a ocurrir el hidroplaneo (hidroplaneo
    o 'hydroplaning', cuando los neumáticos pierden contacto con la carretera debido
    al agua) en la CNMI?
  choices:
    A: Tan solo a 35 mph
    B: Solo por encima de 55 mph
    C: Exactamente a 45 mph
    D: Solo durante tifones
  answer: A
  explanation: El hidroplaneo puede ocurrir a velocidades tan bajas como 35 mph cuando
    hay agua estancada en la carretera. En una tormenta de lluvia intensa, los neumáticos
    pueden perder todo contacto con la carretera a 55 mph.
- id: 103
  category: defensive_driving
  question: Durante un aguacero en la CNMI, ¿cuándo suelen estar más resbaladizas
    las carreteras?
  choices:
    A: Después de que ha estado lloviendo durante varias horas
    B: Justo después de que deja de llover
    C: Durante los primeros minutos de la lluvia
    D: Solo cuando vuelve a salir el sol
  answer: C
  explanation: Las carreteras están más resbaladizas durante los primeros minutos
    de lluvia porque el agua se mezcla con el aceite y el polvo del pavimento que
    aún no han sido lavados.
- id: 104
  category: defensive_driving
  question: Cuando desea cambiar de carril, ¿cómo debe revisar sus 'puntos ciegos'
    según los estándares de seguridad de la CNMI?
  choices:
    A: Revise su espejo retrovisor únicamente
    B: Revise sus espejos laterales únicamente
    C: Gire la cabeza y mire por encima del hombro en la dirección a la que planea
      moverse
    D: Toque la bocina y espere a que los otros conductores se muevan
  answer: C
  explanation: Los espejos no lo muestran todo. Para revisar adecuadamente los puntos
    ciegos, debe girar la cabeza y mirar por encima del hombro antes de cambiar de
    carril.
- id: 105
  category: defensive_driving
  question: Si conduce con niebla densa o humo espeso en la CNMI, ¿qué luces debe
    utilizar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia (hazard lights)
  answer: B
  explanation: Use las luces bajas en caso de niebla o humo. Las luces altas se reflejan
    en la humedad del aire o en las partículas de humo, lo que provoca deslumbramiento
    y dificulta la visión.
- id: 106
  category: defensive_driving
  question: Al detenerse en una intersección, ¿en qué orden debe observar el tráfico
    antes de continuar?
  choices:
    A: Derecha, Izquierda, Derecha
    B: Izquierda, Derecha, Izquierda
    C: Solo hacia adelante
    D: Solo detrás de usted
  answer: B
  explanation: Debe mirar a la izquierda, luego a la derecha y después a la izquierda
    de nuevo. Mirar a la izquierda primero es fundamental porque los vehículos que
    vienen por la izquierda están más cerca de usted.
- id: 107
  category: defensive_driving
  question: En la CNMI, ¿qué debe hacer cuando se aproxima un vehículo de emergencia
    con luces intermitentes y sirena desde cualquier dirección?
  choices:
    A: Acelerar para quitarse del camino
    B: Detenerse exactamente donde está
    C: Orillarse al borde derecho de la carretera y detenerse
    D: Orillarse al borde izquierdo de la carretera y detenerse
  answer: C
  explanation: Los conductores deben ceder el paso a los vehículos de emergencia orillándose
    al borde derecho de la carretera y deteniéndose hasta que el vehículo haya pasado.
- id: 108
  category: defensive_driving
  question: Si un vehículo lo sigue muy de cerca (tailgating) en una carretera de
    la CNMI, ¿cuál es la táctica de conducción defensiva más segura?
  choices:
    A: Frenar bruscamente para asustarlos
    B: Aumentar su distancia de seguimiento con respecto al automóvil que tiene delante
    C: Encender sus luces altas
    D: Aumentar la velocidad significativamente
  answer: B
  explanation: Si alguien lo sigue muy de cerca, debe aumentar el espacio delante
    de su vehículo. Esto le da más tiempo para reaccionar y le permite frenar de forma
    más gradual, reduciendo el riesgo de ser chocado por detrás.
- id: 109
  category: defensive_driving
  question: Al conducir por una carretera mojada en la CNMI, ¿cuánto debe aumentar
    su distancia de seguimiento para mantenerse seguro?
  choices:
    A: Debe permanecer igual
    B: Al menos el doble de la distancia de seguimiento normal
    C: Exactamente 5 pies
    D: Disminuirla para poder ver mejor al auto de adelante
  answer: B
  explanation: Debido a que las carreteras mojadas aumentan la distancia necesaria
    para detenerse y disminuyen la tracción, debe al menos duplicar su distancia de
    seguimiento para mantener la seguridad.
- id: 110
  category: defensive_driving
  question: Para evitar la necesidad de frenar o girar en el último momento en el
    tráfico de la CNMI, ¿con cuánta antelación debe observar la carretera?
  choices:
    A: 5 segundos
    B: De 10 a 15 segundos
    C: 25 segundos
    D: Solo el automóvil que está directamente delante de usted
  answer: B
  explanation: La conducción defensiva en la CNMI requiere mirar de 10 a 15 segundos
    hacia adelante para identificar posibles peligros antes de que requieran una acción
    de emergencia.
- id: 111
  category: defensive_driving
  question: ¿En las Islas Marianas del Norte, cuándo está legalmente obligado a tener
    encendidos los faros delanteros?
  choices:
    A: Solo cuando está lloviendo
    B: Desde una hora después de la puesta del sol hasta una hora antes de la salida
      del sol
    C: Desde la puesta del sol hasta la salida del sol
    D: Solo cuando las luces de la calle están apagadas
  answer: C
  explanation: La ley de la CNMI exige que los conductores utilicen los faros delanteros
    desde la puesta del sol hasta la salida del sol y en cualquier otro momento en
    que la visibilidad sea baja.
- id: 112
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (donde los neumáticos pierden
    contacto con la carretera y se deslizan sobre una fina capa de agua) en la CNMI?
  choices:
    A: A velocidades tan bajas como 35 mph
    B: Solo a velocidades superiores a 55 mph
    C: Solo durante tifones
    D: A velocidades tan bajas como 15 mph
  answer: A
  explanation: En condiciones de humedad, el hidroplaneo puede comenzar a velocidades
    tan bajas como 35 mph. En una tormenta de lluvia intensa, los neumáticos pueden
    perder todo contacto con la carretera a 55 mph.
- id: 113
  category: defensive_driving
  question: Cuando empieza a llover en la CNMI, ¿por qué las carreteras están más
    resbaladizas durante los primeros minutos?
  choices:
    A: El agua está más fría que el asfalto
    B: El aceite y la grasa de la carretera se mezclan con el agua
    C: Los neumáticos todavía están calientes por la conducción en seco
    D: La lluvia elimina el polvo que mejora la tracción
  answer: B
  explanation: Los primeros minutos de lluvia son los más peligrosos porque el agua
    se mezcla con el aceite y la grasa de la superficie de la carretera que aún no
    han sido lavados.
- id: 114
  category: defensive_driving
  question: 'En la CNMI, debe atenuar las luces altas cuando siga a otro vehículo
    por detrás a una distancia de:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: B
  explanation: Al seguir a un vehículo por detrás, debe atenuar las luces altas a
    menos de 300 pies para evitar el deslumbramiento en el espejo retrovisor del conductor
    que va delante.
- id: 115
  category: defensive_driving
  question: 'Para revisar adecuadamente su ''punto ciego'' antes de cambiar de carril
    en una carretera de la CNMI, usted debe:'
  choices:
    A: Revisar solo el espejo retrovisor
    B: Revisar solo los espejos laterales
    C: Girar la cabeza y mirar por encima del hombro en la dirección en la que planea
      moverse
    D: Tocar la bocina para ver si hay alguien allí
  answer: C
  explanation: Los espejos no lo muestran todo; debe realizar una comprobación por
    encima del hombro para ver los vehículos en sus puntos ciegos antes de cambiar
    de carril.
- id: 116
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera resbaladiza en la
    CNMI, ¿cuál es la acción más segura a tomar?
  choices:
    A: Frenar bruscamente de inmediato
    B: Girar el volante en la dirección opuesta al derrape
    C: Levantar suavemente el pie del acelerador y girar el volante en la dirección
      en la que desea que vaya la parte delantera del automóvil
    D: Poner el coche en punto muerto y apagar el motor
  answer: C
  explanation: Para recuperarse de un derrape, debe evitar frenar, soltar el acelerador
    y girar en la dirección en la que desea que el vehículo se dirija.
- id: 117
  category: defensive_driving
  question: 'Si otro conductor lo sigue demasiado de cerca (tailgating) mientras conduce
    en la CNMI, usted debe:'
  choices:
    A: Frenar repentinamente para advertirle
    B: Acelerar para aumentar la distancia
    C: Reducir la velocidad gradualmente para animarlo a que lo pase
    D: Encender las luces altas
  answer: C
  explanation: Si un conductor lo sigue demasiado de cerca, la maniobra defensiva
    más segura es reducir la velocidad gradualmente para proporcionar más espacio
    delante de usted y animar al otro conductor a rebasarlo.
- id: 118
  category: defensive_driving
  question: Al acercarse a una intersección en la CNMI, ¿en qué orden debe observar
    el tráfico transversal?
  choices:
    A: Derecha, luego izquierda
    B: Izquierda, derecha, luego izquierda otra vez
    C: Solo hacia adelante
    D: Derecha, izquierda, luego derecha otra vez
  answer: B
  explanation: Debe mirar a la izquierda, luego a la derecha y luego a la izquierda
    otra vez porque el vehículo que viene por la izquierda está más cerca de usted
    y representa el peligro más inmediato.
- id: 119
  category: defensive_driving
  question: Si debe conducir a través de una niebla densa en la CNMI, ¿qué ajuste
    de luces debe utilizar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo las luces de estacionamiento
    D: Ninguna luz, para evitar el deslumbramiento
  answer: B
  explanation: Se deben usar las luces bajas en la niebla. Las luces altas se reflejan
    en las gotas de niebla y, de hecho, disminuyen la visibilidad del conductor.
- id: 120
  category: defensive_driving
  question: 'Al conducir en la CNMI, la ''distancia total de parada'' es la suma de:'
  choices:
    A: La distancia de frenado y la longitud del automóvil
    B: La distancia de reacción y la distancia de frenado
    C: La distancia de percepción, la distancia de reacción y la distancia de frenado
    D: La velocidad y la fricción de la carretera
  answer: C
  explanation: La distancia total de parada incluye el tiempo que se tarda en ver
    el peligro (percepción), el tiempo para mover el pie al freno (reacción) y el
    tiempo que tarda el vehículo en detenerse (frenado).
- id: 121
  category: alcohol_drugs_health
  question: 'En las Islas Marianas del Norte, se considera legalmente que una persona
    conduce bajo los efectos del alcohol o drogas (DUI) si su concentración de alcohol
    en sangre (BAC) es igual o superior a:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: De acuerdo con el Código de Vehículos de la CNMI (9 CMC § 7105), es
    ilegal que cualquier persona que tenga un BAC de 0.08% o más conduzca o tenga
    el control físico real de un vehículo.
- id: 122
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción inmediata por negarse a someterse a una prueba química
    de alcohol o drogas cuando lo solicita un oficial de la ley en la CNMI?
  choices:
    A: Una advertencia verbal solamente
    B: Una multa de $50
    C: El oficial confiscará su licencia y sus privilegios de conducir serán suspendidos
    D: No hay sanción si es la primera vez que lo detienen
  answer: C
  explanation: Según la ley de la CNMI, si un conductor se niega a una prueba química,
    el oficial confiscará la licencia y se suspenderán los privilegios de conducir
    de la persona, generalmente por un período de al menos seis meses a un año, dependiendo
    de los antecedentes.
- id: 123
  category: alcohol_drugs_health
  question: En las Islas Marianas del Norte, ¿en qué parte del vehículo es ilegal
    poseer un recipiente abierto de una bebida alcohólica?
  choices:
    A: Solo en el compartimento de la puerta del lado del conductor
    B: Solo en el maletero
    C: En el compartimento de pasajeros (cualquier área ocupada normalmente por el
      conductor o los pasajeros)
    D: Solo en la guantera
  answer: C
  explanation: La sección 9 CMC § 7109 prohíbe la posesión de un recipiente abierto
    de alcohol en el compartimento de pasajeros de un vehículo motorizado mientras
    se encuentra en una vía pública.
- id: 124
  category: alcohol_drugs_health
  question: 'Si se le condena por una primera infracción de DUI en la CNMI, el tribunal
    puede imponer una multa de:'
  choices:
    A: No menos de $100 y no más de $500
    B: No menos de $500 y no más de $1,000
    C: Exactamente $2,500
    D: Sin multa, solo servicio comunitario
  answer: B
  explanation: Para una primera condena por DUI en la CNMI, la ley prescribe una multa
    de no menos de $500 y no más de $1,000, además de una posible pena de prisión
    y la suspensión de la licencia.
- id: 125
  category: alcohol_drugs_health
  question: ¿Cuál es la siguiente afirmación verdadera con respecto a los medicamentos
    recetados o de venta libre y la conducción en la CNMI?
  choices:
    A: Siempre es legal usarlos mientras se conduce porque un médico los recetó
    B: Solo afectan la conducción si se toman con alcohol
    C: Es ilegal conducir bajo la influencia de cualquier droga que lo incapacite
      para operar un vehículo de manera segura
    D: Solo los narcóticos ilegales se consideran 'drogas' bajo las leyes de DUI
  answer: C
  explanation: La ley de la CNMI (9 CMC § 7105) se aplica a cualquier persona bajo
    la influencia del alcohol, cualquier droga o una combinación de ambos que afecte
    su capacidad para conducir de manera segura, independientemente de si la droga
    es legal o recetada.
- id: 126
  category: alcohol_drugs_health
  question: ¿Cuál es el período mínimo de revocación de la licencia por una primera
    condena por DUI en la CNMI?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 2 años
  answer: C
  explanation: Una primera condena por DUI en la CNMI generalmente resulta en un período
    obligatorio de revocación/suspensión de la licencia de al menos seis meses.
- id: 127
  category: alcohol_drugs_health
  question: Si un conductor es condenado por DUI mientras una persona menor de 16
    años era pasajera en el vehículo, ¿qué sucede en la CNMI?
  choices:
    A: El conductor recibe solo una multa estándar
    B: El conductor enfrenta sanciones aumentadas y tiempo mínimo obligatorio en la
      cárcel
    C: El conductor solo es acusado de una infracción por el uso del cinturón de seguridad
    D: La licencia del conductor se suspende por solo 10 días
  answer: B
  explanation: Conducir bajo la influencia con un pasajero menor de edad es un factor
    agravante en la CNMI que conlleva un aumento de las multas y términos mínimos
    obligatorios de prisión.
- id: 128
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de reducir su concentración de alcohol
    en sangre (BAC) después de beber alcohol?
  choices:
    A: Beber café negro cargado
    B: Tomar una ducha fría
    C: Hacer ejercicio o correr
    D: Dar tiempo para que su cuerpo procese el alcohol
  answer: D
  explanation: El tiempo es el único factor que puede reducir el BAC. El hígado procesa
    el alcohol a un ritmo constante, y el café, las duchas o el ejercicio no aceleran
    este proceso.
- id: 129
  category: alcohol_drugs_health
  question: 'En la CNMI, si está operando un vehículo motorizado comercial, se le
    considera legalmente ebrio si su BAC es de:'
  choices:
    A: 0.01% o superior
    B: 0.04% o superior
    C: 0.08% o superior
    D: 0.10% o superior
  answer: B
  explanation: En consonancia con los estándares federales adoptados en la CNMI, el
    límite de BAC para los conductores comerciales es de 0.04%.
- id: 130
  category: alcohol_drugs_health
  question: ¿Qué efecto tiene en su capacidad de conducción la combinación de alcohol
    con otra droga (efecto sinérgico)?
  choices:
    A: Los efectos de la droga y el alcohol se anulan entre sí
    B: La droga reducirá los efectos del alcohol
    C: La combinación puede multiplicar los efectos de ambos, aumentando drásticamente
      el deterioro
    D: No hay diferencia en comparación con beber alcohol solo
  answer: C
  explanation: Mezclar alcohol con otras drogas (incluso las de venta libre) puede
    crear un efecto sinérgico donde el deterioro combinado es mucho mayor que la suma
    de los efectos individuales.
- id: 131
  category: alcohol_drugs_health
  question: 'Si usted se ve involucrado en un accidente de tráfico en las CNMI que
    resulte en una fatalidad, y existe una causa probable para creer que conducía
    bajo la influencia (DUI):'
  choices:
    A: Las pruebas son opcionales
    B: Puede esperar 24 horas antes de realizar una prueba de BAC
    C: Se puede administrar una prueba química incluso sin su consentimiento
    D: Solo tiene que realizar una prueba de visión
  answer: C
  explanation: En casos que involucren muerte o lesiones corporales graves donde se
    sospeche de DUI, la ley de las CNMI permite la realización de pruebas químicas
    obligatorias.
- id: 132
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma de conducir fatigado, lo cual puede
    ser tan peligroso como conducir bajo la influencia (DUI)?
  choices:
    A: Mayor estado de alerta
    B: Tiempos de reacción más rápidos
    C: Dificultad para concentrarse o párpados pesados
    D: Mejora de la visión periférica
  answer: C
  explanation: La fatiga causa síntomas similares al deterioro por alcohol, incluyendo
    tiempos de reacción lentos, mal juicio y dificultad para concentrarse en la carretera.
- id: 133
  category: alcohol_drugs_health
  question: 'Si tiene una condición médica (como epilepsia o diabetes) que pueda afectar
    su capacidad para conducir de manera segura, usted debe:'
  choices:
    A: Mantenerlo en secreto ante el BMV
    B: Solo conducir de noche
    C: Informar a la Oficina de Vehículos Motorizados (BMV) y proporcionar una autorización
      médica si se le solicita
    D: Dejar de conducir para siempre de inmediato sin consultar a un médico
  answer: C
  explanation: Los conductores en las CNMI están obligados a informar a la BMV sobre
    condiciones físicas o mentales que puedan afectar su capacidad para operar un
    vehículo de manera segura durante el proceso de obtención de la licencia.
- id: 134
  category: alcohol_drugs_health
  question: 'En las CNMI, una segunda condena por DUI dentro de un período de cinco
    años resulta en una sentencia de cárcel mínima obligatoria de:'
  choices:
    A: 48 horas
    B: 72 horas
    C: 10 días
    D: 30 días
  answer: B
  explanation: Según el código 9 CMC § 7105, una segunda condena por DUI dentro de
    cinco años conlleva una pena de prisión mínima obligatoria de 72 horas.
- id: 135
  category: alcohol_drugs_health
  question: 'Para una primera condena por DUI en las Islas Marianas del Norte, el
    tribunal puede imponer una multa de:'
  choices:
    A: No menos de $100 y no más de $500
    B: No menos de $500 y no más de $1,000
    C: Exactamente $2,000
    D: No se requiere multa para una primera infracción
  answer: B
  explanation: Según el código 9 CMC § 7105, una primera condena por DUI conlleva
    una multa de no menos de $500 y no más de $1,000, además de otras posibles sanciones.
- id: 136
  category: alcohol_drugs_health
  question: 'Si un conductor en las CNMI es condenado por una primera infracción de
    DUI, sus privilegios de conducción generalmente serán suspendidos por un período
    de:'
  choices:
    A: 30 días
    B: 60 a 90 días
    C: 6 meses a 1 año
    D: Permanentemente
  answer: C
  explanation: Una primera condena por DUI en las CNMI generalmente resulta en una
    suspensión obligatoria de la licencia que oscila entre 6 meses y 1 año.
- id: 137
  category: alcohol_drugs_health
  question: Para los conductores de vehículos motorizados comerciales en las CNMI,
    el límite legal máximo de BAC es más bajo que para los conductores estándar. ¿Cuál
    es el límite para los titulares de una licencia de conducir comercial (CDL)?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.06%
  answer: C
  explanation: De acuerdo con las regulaciones federales y locales, el límite de BAC
    para los operadores de vehículos motorizados comerciales es de 0.04%.
- id: 138
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto probable de tomar un medicamento recetado y luego consumir
    alcohol antes de conducir?
  choices:
    A: El alcohol anulará los efectos del medicamento
    B: El medicamento hará que el alcohol sea menos potente
    C: La combinación puede multiplicar los efectos de ambos, deteriorando gravemente
      la capacidad de conducción
    D: No hay efecto si el medicamento es recetado legalmente
  answer: C
  explanation: Combinar alcohol con otras drogas (incluso medicamentos recetados o
    de venta libre) puede causar un efecto sinérgico, haciendo que el deterioro sea
    mucho peor que con cualquiera de las sustancias por separado.
- id: 139
  category: alcohol_drugs_health
  question: 'En las CNMI, si es condenado por un segundo DUI dentro de un período
    de 10 años, el tiempo mínimo obligatorio de cárcel es de:'
  choices:
    A: 24 horas
    B: 48 horas
    C: 10 días
    D: 30 días
  answer: C
  explanation: Para una segunda condena por DUI dentro de un período de 10 años en
    las CNMI, la ley exige una pena de prisión mínima de no menos de 10 días.
- id: 140
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la primera facultad que se ve afectada por
    el consumo de alcohol?
  choices:
    A: La visión
    B: La coordinación muscular
    C: El juicio y la toma de decisiones
    D: La audición
  answer: C
  explanation: El alcohol afecta primero las funciones cerebrales superiores, lo que
    significa que el juicio y la capacidad de tomar decisiones seguras se ven afectados
    antes de que aparezcan síntomas físicos como visión borrosa o pérdida de coordinación.
- id: 141
  category: alcohol_drugs_health
  question: 'Si está tomando un medicamento nuevo y no está seguro de sus efectos
    en su conducción, debe:'
  choices:
    A: Conducir solo por calles secundarias
    B: Consultar a su médico o farmacéutico antes de conducir
    C: Esperar 30 minutos después de tomarlo y luego conducir si se siente bien
    D: Beber café para contrarrestar cualquier somnolencia
  answer: B
  explanation: Es responsabilidad del conductor conocer los efectos de cualquier medicamento
    que tome. Consultar a un profesional médico es la única forma segura de determinar
    si un fármaco afectará la conducción.
- id: 142
  category: alcohol_drugs_health
  question: 'En las CNMI, una persona condenada por DUI que cause ''lesiones corporales
    graves'' a otra persona se enfrenta a:'
  choices:
    A: Solo una multa de tráfico estándar
    B: Un mínimo obligatorio de 1 año de prisión
    C: Penas agravadas, incluyendo un encarcelamiento más prolongado y multas más
      altas
    D: Solo servicio comunitario
  answer: C
  explanation: El DUI que involucra lesiones corporales graves o la muerte conlleva
    penas penales significativamente agravadas bajo el código penal de las CNMI, más
    allá de los cargos estándar por DUI.
- id: 143
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes opciones puede ayudar a 'despejar' (sober up)
    a una persona que ha estado bebiendo alcohol?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Hacer ejercicio o correr
    D: Solo el tiempo
  answer: D
  explanation: El cuerpo solo puede procesar el alcohol a una tasa fija (aproximadamente
    una bebida estándar por hora). El café, las duchas y el ejercicio no reducen el
    BAC ni aceleran el proceso de sobriedad.
- id: 144
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años y se descubre que está operando un vehículo con
    cualquier cantidad medible de alcohol en su sistema (0.02% o superior), está infringiendo:'
  choices:
    A: La Ley de Consentimiento Implícito (Implied Consent Law)
    B: La Ley de Tolerancia Cero (Zero Tolerance Law)
    C: La Ley de Derecho de Paso (Right of Way Law)
    D: La Ley de Velocidad Básica (Basic Speed Law)
  answer: B
  explanation: La Ley de Tolerancia Cero se aplica a los conductores menores de la
    edad legal para beber de 21 años, lo que hace ilegal conducir incluso con una
    pequeña cantidad de alcohol en el sistema.
- id: 145
  category: alcohol_drugs_health
  question: 'En las CNMI, si se sospecha que un conductor está bajo la influencia
    de drogas en lugar de alcohol, un oficial de policía:'
  choices:
    A: No puede arrestarlo sin un resultado de alcoholímetro
    B: Puede solicitar una prueba de sangre u orina para detectar sustancias controladas
    C: Debe liberarlo si pasa una prueba de visión
    D: Solo puede emitir una multa por conducción temeraria
  answer: B
  explanation: La ley de Consentimiento Implícito cubre tanto el alcohol como las
    sustancias controladas. Los oficiales pueden solicitar pruebas químicas (sangre/orina)
    si tienen una causa probable para creer que un conductor está bajo los efectos
    de las drogas.
- id: 146
  category: penalties_and_points
  question: ¿Cuál es la multa máxima para una persona declarada culpable de tirar
    basura desde un vehículo motorizado en las Islas Marianas del Norte?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Según la Ley Pública de las CNMI, tirar basura es una infracción grave,
    y el tribunal puede imponer una multa de hasta $1,000 por arrojar basura desde
    un vehículo.
- id: 147
  category: penalties_and_points
  question: Si es condenado por exceso de velocidad de 21 millas por hora o más sobre
    el límite de velocidad establecido en las CNMI, ¿cuántos puntos se añadirán a
    su historial?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: D
  explanation: Exceder el límite de velocidad por más de 21 mph es una infracción
    de alto puntaje en las CNMI, lo que resulta en la adición de 6 puntos al historial
    del conductor.
- id: 148
  category: penalties_and_points
  question: Para una primera condena por DUI en las CNMI, ¿por cuánto tiempo pueden
    suspenderse sus privilegios de conducir?
  choices:
    A: De 10 a 20 días
    B: De 30 a 90 días
    C: De 6 meses a 1 año
    D: Permanentemente
  answer: B
  explanation: Una primera condena por conducir bajo la influencia (DUI) en las CNMI
    generalmente resulta en una suspensión de la licencia que oscila entre 30 y 90
    días, además de multas y posible tiempo en la cárcel.
- id: 149
  category: penalties_and_points
  question: En las CNMI, ¿cuál es la multa por una primera infracción de la ley obligatoria
    del cinturón de seguridad?
  choices:
    A: $25
    B: $75
    C: $150
    D: $200
  answer: A
  explanation: La ley del cinturón de seguridad de las CNMI (9 CMC § 5806) establece
    una multa de $25 por la primera infracción por no usar el cinturón de seguridad.
- id: 150
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a su historial de conducción de las CNMI por
    no detenerse ante un autobús escolar con sus luces rojas parpadeando y el brazo
    de parada extendido?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: No detenerse ante un autobús escolar es una infracción de seguridad
    grave en las CNMI y resulta en la adición de 6 puntos al historial del conductor.
- id: 151
  category: penalties_and_points
  question: Según la Ley Pública 17-72 de la CNMI, ¿cuál es la multa por una primera
    infracción por usar un dispositivo móvil para enviar un mensaje de texto mientras
    se conduce?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: La CNMI prohíbe enviar mensajes de texto mientras se conduce. Una primera
    infracción de esta ley conlleva una multa de $100.
- id: 152
  category: penalties_and_points
  question: En la CNMI, ¿cuántos puntos se asignan por la infracción de 'Seguir demasiado
    de cerca' (tailgating)?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Seguir a otro vehículo demasiado de cerca es una infracción de tráfico
    en la CNMI que resulta en 2 puntos en el registro del conductor.
- id: 153
  category: penalties_and_points
  question: ¿A qué sanciones puede enfrentarse una persona condenada por conducir
    un vehículo motorizado en la CNMI mientras su licencia está suspendida o revocada?
  choices:
    A: Solo una multa de hasta $100
    B: Prisión de hasta 6 meses y una multa
    C: Una advertencia verbal por la primera infracción
    D: Ninguna sanción si se dirigía al trabajo
  answer: B
  explanation: Conducir con una licencia suspendida o revocada es una infracción grave
    en la CNMI, castigada con una multa y una posible pena de prisión de hasta 6 meses
    (9 CMC § 2202).
- id: 154
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción de la ley de Sistemas de
    Retención Infantil de la CNMI (no asegurar a un niño en un asiento de seguridad
    adecuado)?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: No asegurar adecuadamente a un niño en un sistema de retención infantil
    aprobado en la CNMI resulta en una multa de $100 por la primera infracción.
- id: 155
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por realizar un 'Giro ilegal' en las Islas
    Marianas del Norte?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Realizar un giro ilegal (como un giro en U indebido o girar desde el
    carril equivocado) resulta en 2 puntos en su registro de conducir de la CNMI.
- id: 156
  category: penalties_and_points
  question: En la CNMI, ¿cuántos puntos se añaden a su registro por 'No ceder el paso'?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: No ceder el paso a otros vehículos o peatones es una infracción de
    3 puntos en la CNMI.
- id: 157
  category: penalties_and_points
  question: 'Si una persona es sorprendida conduciendo mientras su licencia está suspendida
    o revocada en la CNMI, puede enfrentarse a:'
  choices:
    A: Solo una multa
    B: Una advertencia verbal
    C: Prisión y suspensión adicional
    D: Ninguna sanción si es la primera infracción
  answer: C
  explanation: Conducir con una licencia suspendida o revocada es un delito penal
    grave en la CNMI, castigado con multas, posible tiempo en la cárcel y una extensión
    del período de suspensión.
- id: 158
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por 'Adelantamiento ilegal' (adelantar donde
    está prohibido por señales o marcas) en la CNMI?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: El adelantamiento ilegal se categoriza como una infracción de 3 puntos
    en el sistema de puntos de la CNMI.
- id: 159
  category: penalties_and_points
  question: En la CNMI, está prohibido el uso de un dispositivo electrónico portátil
    (como un teléfono celular) para enviar mensajes de texto mientras se conduce.
    ¿Cuál es la multa por una primera infracción?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Según la ley de la CNMI, el uso de un dispositivo electrónico portátil
    mientras se conduce es ilegal, y una primera infracción suele resultar en una
    multa de $100.
- id: 160
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a su registro por 'No detenerse ante una señal
    de alto' o 'Ignorar una señal de tráfico' en la CNMI?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 6 puntos
  answer: C
  explanation: Ignorar los dispositivos de control de tráfico, como las señales de
    alto o las luces rojas, resulta en 3 puntos en el registro de un conductor de
    la CNMI.
- id: 161
  category: sharing_the_road
  question: Cuando un vehículo de emergencia (como una patrulla de policía o una ambulancia)
    se aproxima con la sirena y las luces intermitentes encendidas, ¿qué debe hacer
    el conductor de un vehículo en las CNMI?
  choices:
    A: Acelerar para quitarse del camino
    B: Detenerse inmediatamente en medio del carril
    C: Ceder el derecho de paso e inmediatamente conducir a una posición paralela
      y lo más cerca posible del borde o acera derecha y detenerse
    D: Seguir al vehículo de emergencia para avanzar más rápido entre el tráfico
  answer: C
  explanation: La ley de las CNMI exige que los conductores se orillen hacia el borde
    derecho de la carretera y se detengan hasta que el vehículo de emergencia haya
    pasado.
- id: 162
  category: sharing_the_road
  question: 'En las CNMI, es ilegal seguir a un vehículo de emergencia que responde
    a una alarma a una distancia menor de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Según el Título 9 de las CNMI, Sección 5209, es ilegal que el conductor
    de cualquier vehículo que no esté en misión oficial siga a cualquier aparato de
    bomberos que viaje en respuesta a una alarma de incendio a una distancia menor
    de 500 pies.
- id: 163
  category: sharing_the_road
  question: Al compartir la carretera con un ciclista en las Islas Marianas del Norte,
    ¿cuánto espacio debería mantener idealmente entre su vehículo y la bicicleta?
  choices:
    A: Al menos 1 pie
    B: Al menos 3 pies
    C: Al menos 5 pies
    D: Al menos 10 pies
  answer: B
  explanation: Aunque las 'leyes de 3 pies' son comunes en las jurisdicciones de EE.
    UU., incluidas las CNMI, es la distancia de seguridad estándar recomendada para
    evitar golpear a un ciclista con el espejo retrovisor lateral.
- id: 164
  category: sharing_the_road
  question: Según la ley de las CNMI, ¿quién está obligado a usar un casco protector
    al operar o viajar como pasajero en una motocicleta?
  choices:
    A: Solo los conductores menores de 18 años
    B: Solo el operador de la motocicleta
    C: Todos los operadores y pasajeros, independientemente de su edad
    D: Solo aquellos con menos de un año de experiencia en la conducción
  answer: C
  explanation: Las Islas Marianas del Norte exigen que todos los operadores y pasajeros
    de motocicletas usen un casco de seguridad que cumpla con los estándares aprobados.
- id: 165
  category: sharing_the_road
  question: Cuando un peatón cruza la calle dentro de un paso de peatones marcado
    o no marcado en una intersección en las CNMI, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor del vehículo
    B: El peatón
    C: Quien haya llegado primero a la intersección
    D: El vehículo, si viaja al límite de velocidad
  answer: B
  explanation: La ley de las CNMI exige que los conductores cedan el derecho de paso
    a los peatones que cruzan la calzada dentro de cualquier paso de peatones marcado
    o dentro de cualquier paso de peatones no marcado en una intersección.
- id: 166
  category: sharing_the_road
  question: Los camiones comerciales grandes tienen 'No-Zones' (Zonas Prohibidas).
    ¿Qué son estas?
  choices:
    A: Áreas donde los camiones no tienen permitido circular
    B: Zonas de velocidad restringida para vehículos pesados
    C: Puntos ciegos alrededor de la parte delantera, trasera y laterales del camión
      donde el conductor no puede ver a otros vehículos
    D: Áreas de estacionamiento designadas para la carga de mercancías
  answer: C
  explanation: Las 'No-Zones' son grandes puntos ciegos alrededor de los camiones.
    Si usted conduce en estas áreas, el conductor del camión no puede verlo, lo que
    aumenta significativamente el riesgo de una colisión.
- id: 167
  category: sharing_the_road
  question: 'En las CNMI, la ley exige que los ciclistas:'
  choices:
    A: Circulen por la acera en todo momento
    B: Circulen en sentido contrario al tráfico para poder ver los coches
    C: Circulen en el mismo sentido del tráfico y obedezcan las mismas reglas que
      los vehículos motorizados
    D: Solo circulen por ciclovías designadas
  answer: C
  explanation: Los ciclistas en las CNMI tienen los mismos derechos y responsabilidades
    que los conductores de vehículos motorizados y deben circular en la misma dirección
    que el tráfico.
- id: 168
  category: sharing_the_road
  question: 'Si ve a un peatón usando un bastón blanco o un perro guía en una intersección,
    usted debe:'
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Reducir la velocidad y continuar si no están en su carril
    C: Detenerse y ceder el derecho de paso al peatón
    D: Rodearlos rápidamente
  answer: C
  explanation: Los peatones ciegos o con discapacidad visual siempre tienen el derecho
    de paso. Usted debe detenerse por completo para garantizar su seguridad.
- id: 169
  category: sharing_the_road
  question: ¿Por qué nunca debe colocarse directamente al lado de un camión grande
    que está señalizando un giro a la derecha en una intersección?
  choices:
    A: El camión podría acelerar repentinamente
    B: Los camiones grandes a menudo necesitan abrirse hacia la izquierda para completar
      un giro a la derecha, y podrían aplastar su vehículo
    C: Los camiones están obligados por ley a girar desde el carril izquierdo
    D: La turbulencia del aire del camión empujará su coche hacia la acera
  answer: B
  explanation: Los vehículos grandes requieren más espacio para girar. A menudo se
    abren hacia la izquierda antes de girar a la derecha; si intenta rebasar por la
    derecha, puede quedar atrapado entre el camión y la acera.
- id: 170
  category: sharing_the_road
  question: 'En las CNMI, si un peatón camina por una carretera donde no hay aceras,
    debe caminar:'
  choices:
    A: En el lado derecho, con el flujo del tráfico
    B: En el lado izquierdo, de frente al tráfico que viene en sentido contrario
    C: En medio de la carretera
    D: En el lado que tenga más sombra
  answer: B
  explanation: Por seguridad, los peatones deben caminar de frente al tráfico cuando
    no hay aceras disponibles, para que puedan ver los vehículos que se aproximan
    y tomar medidas evasivas si es necesario.
- id: 171
  category: sharing_the_road
  question: ¿Qué equipo es legalmente obligatorio al andar en bicicleta por la noche
    en las CNMI?
  choices:
    A: Un timbre y una canasta
    B: Una luz blanca en la parte delantera y un reflector rojo o luz roja en la parte
      trasera
    C: Un chaleco amarillo y una luz para el casco
    D: Cinta reflectante solo en los pedales
  answer: B
  explanation: Para ser visible para los automovilistas por la noche, la ley de las
    CNMI exige que las bicicletas estén equipadas con una luz blanca delantera y un
    reflector o luz roja trasera.
- id: 172
  category: sharing_the_road
  question: ¿Es legal el 'lane splitting' (una motocicleta que circula entre dos carriles
    de tráfico detenido o en movimiento) en las Islas Marianas del Norte?
  choices:
    A: Sí, se recomienda para reducir la congestión del tráfico
    B: Sí, pero solo si el tráfico se mueve a menos de 15 mph
    C: No, es ilegal y peligroso
    D: No, a menos que la motocicleta sea un vehículo de emergencia
  answer: C
  explanation: El 'lane splitting' no está permitido en las CNMI. Las motocicletas
    deben ocupar un carril completo y seguir las mismas reglas de uso de carriles
    que los automóviles.
- id: 173
  category: sharing_the_road
  question: 'Al seguir a un camión o autobús grande, debe aumentar su distancia de
    seguimiento porque:'
  choices:
    A: Le permite ver alrededor del vehículo y le da al conductor más espacio para
      detenerse
    B: Los camiones están obligados a detenerse en todas las intersecciones
    C: Evita que el camión ruede hacia atrás en las colinas
    D: Los vehículos grandes siempre viajan a 10 mph por debajo del límite de velocidad
  answer: A
  explanation: Aumentar la distancia de seguimiento detrás de vehículos grandes mejora
    su campo de visión y le da más tiempo para reaccionar si el camión se detiene
    repentinamente.
- id: 174
  category: sharing_the_road
  question: En las CNMI, ¿cuál es la multa máxima por una primera infracción al rebasar
    ilegalmente un autobús escolar detenido?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Según la ley de las CNMI, la sanción por no detenerse ante un autobús
    escolar puede resultar en una multa de hasta $500 por la primera infracción.
- id: 175
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los motociclistas
    en las Islas Marianas del Norte?
  choices:
    A: Los cascos solo son obligatorios para los conductores menores de 18 años.
    B: Los cascos son opcionales si el conductor tiene 5 años de experiencia.
    C: Todos los operadores y pasajeros deben usar un casco de seguridad bien abrochado.
    D: Los cascos solo son obligatorios en carreteras con límites de velocidad superiores
      a 35 mph.
  answer: C
  explanation: La ley de las CNMI exige que toda persona que opere o viaje en una
    motocicleta debe usar un casco de seguridad de un tipo aprobado por el Comisionado.
- id: 176
  category: sharing_the_road
  question: 'Al compartir la carretera con una bicicleta en las CNMI, un automovilista
    debe:'
  choices:
    A: Ceder el paso a la bicicleta como lo haría con cualquier otro vehículo.
    B: Obligar a la bicicleta a salir de la carretera si se mueve lentamente.
    C: Tocar la bocina continuamente hasta que el ciclista se mueva a la acera.
    D: Asumir que la bicicleta siempre se detendrá ante los semáforos en verde.
  answer: A
  explanation: Las bicicletas generalmente se tratan como vehículos según la ley de
    las CNMI; los automovilistas deben ceder el paso y tratarlas con el mismo respeto
    que a los vehículos motorizados.
- id: 177
  category: sharing_the_road
  question: Los camiones grandes tienen 'No-Zones' (Zonas Prohibidas). ¿A qué se refiere
    este término?
  choices:
    A: Áreas donde no se permite la circulación de camiones.
    B: Los puntos ciegos alrededor de un camión donde el conductor no puede ver otros
      vehículos.
    C: Las zonas de velocidad restringida para vehículos pesados.
    D: El área de carga del camión.
  answer: B
  explanation: Las 'No-Zones' son grandes puntos ciegos alrededor de los camiones
    (delante, detrás y a los lados) donde los automóviles desaparecen de la vista
    del conductor del camión, lo que aumenta el riesgo de una colisión.
- id: 178
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima que debe mantener al seguir a un vehículo
    de emergencia que responde a una llamada en las CNMI?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: Es ilegal seguir a cualquier camión de bomberos que viaje en respuesta
    a una alarma de incendio a menos de 500 pies o conducir o estacionar dentro de
    la cuadra donde se ha detenido el camión de bomberos.
- id: 179
  category: sharing_the_road
  question: Según la ley de las CNMI, ¿es legal el 'lane splitting' (una motocicleta
    que circula entre filas de automóviles detenidos o en movimiento)?
  choices:
    A: Sí, se recomienda para reducir el tráfico.
    B: Sí, pero solo a velocidades inferiores a 15 mph.
    C: No, es ilegal y peligroso.
    D: Sí, pero solo durante las horas del día.
  answer: C
  explanation: Las motocicletas tienen derecho al uso completo de un carril, y no
    se permite el 'lane splitting' (filtrarse entre carriles de tráfico).
- id: 180
  category: sharing_the_road
  question: 'Cuando se opera una bicicleta de noche en las CNMI, debe estar equipada
    con una lámpara en la parte delantera que emita una luz blanca visible desde al
    menos:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Por seguridad, las regulaciones de las CNMI exigen que las bicicletas
    utilizadas de noche tengan una lámpara delantera visible desde 500 pies y un reflector
    rojo en la parte trasera.
- id: 181
  category: sharing_the_road
  question: ¿Por qué debe un conductor extremar las precauciones cuando un camión
    grande está girando a la derecha en una intersección?
  choices:
    A: Los camiones siempre giran desde el carril izquierdo.
    B: Los camiones a menudo necesitan abrirse hacia la izquierda para no chocar con
      el bordillo.
    C: Se requiere que los camiones se detengan por completo antes de girar a la derecha.
    D: Los camiones tienen un límite de velocidad más alto al girar.
  answer: B
  explanation: Los vehículos grandes necesitan más espacio para maniobrar; a menudo
    se abren hacia la izquierda para realizar un giro a la derecha. Los conductores
    nunca deben intentar meterse entre el camión y el bordillo.
- id: 182
  category: sharing_the_road
  question: 'En las CNMI, si camina por una carretera que no tiene acera, debe caminar:'
  choices:
    A: En el lado derecho, con el flujo del tráfico.
    B: En el lado izquierdo, de frente al tráfico que viene en sentido contrario.
    C: En medio de la carretera.
    D: Solo por la noche.
  answer: B
  explanation: Los peatones que caminan por una calzada sin aceras deben caminar por
    el lado izquierdo de la carretera de frente al tráfico para que puedan ver los
    vehículos que se aproximan.
- id: 183
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene en una carretera de cuatro carriles
    dividida por una mediana en las CNMI, ¿deben detenerse los conductores del lado
    opuesto de la mediana?
  choices:
    A: Sí, todos deben detenerse.
    B: No, los conductores del lado opuesto de una carretera dividida no necesitan
      detenerse.
    C: Sí, pero solo si hay niños cruzando la mediana.
    D: Solo si el límite de velocidad es superior a 35 mph.
  answer: B
  explanation: En una carretera dividida con una barrera física o mediana, el tráfico
    que se mueve en la dirección opuesta a un autobús escolar detenido generalmente
    no está obligado a detenerse, aunque se recomienda precaución.
- id: 184
  category: sharing_the_road
  question: 'Cuando vea un vehículo de emergencia estacionado con sus luces intermitentes
    a un lado de la carretera, debe:'
  choices:
    A: Mantener su velocidad y permanecer en su carril.
    B: Reducir la velocidad y, si es seguro hacerlo, cambiarse a un carril que no
      esté adyacente al vehículo.
    C: Detenerse inmediatamente en la calzada para ver si necesitan ayuda.
    D: Encender sus luces altas para alertar a otros conductores.
  answer: B
  explanation: Comúnmente conocida como la regla de "Moverse al carril de al lado"
    (Move Over), los conductores deben reducir la velocidad y cambiar de carril si
    es posible para proporcionar un margen de seguridad a los socorristas en el arcén.
- id: 185
  category: vehicle_information
  question: 'Según el Manual del Conductor de las CNMI, los faros delanteros de su
    vehículo deben estar encendidos durante el período comprendido entre el atardecer
    y el amanecer y siempre que la visibilidad sea inferior a:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: B
  explanation: En las Islas Marianas del Norte, los faros deben usarse desde el atardecer
    hasta el amanecer y en cualquier momento en que la visibilidad sea inferior a
    500 pies debido al clima u otras condiciones.
- id: 186
  category: vehicle_information
  question: 'Todo vehículo de motor operado en las carreteras de las CNMI debe estar
    equipado con una bocina que pueda oírse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: Las regulaciones de equipamiento de vehículos de las CNMI establecen
    que una bocina debe ser audible en condiciones normales desde una distancia no
    menor a 200 pies.
- id: 187
  category: vehicle_information
  question: 'Según la ley de las CNMI, todos los vehículos de motor deben tener un
    sistema de frenado que incluya:'
  choices:
    A: Solo un freno de pedal
    B: Solo un freno de emergencia accionado manualmente
    C: Dos medios separados para aplicar los frenos (freno de servicio y freno de
      estacionamiento)
    D: Un sistema de frenado automático (ABS)
  answer: C
  explanation: 'Los vehículos deben estar equipados con dos formas separadas de aplicar
    los frenos: un freno de servicio (freno de pedal) para el frenado regular y un
    freno de estacionamiento o de emergencia.'
- id: 188
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para que un vehículo de pasajeros pase la inspección de seguridad en las CNMI?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos se consideran inseguros y no pasarán la inspección si
    la banda de rodadura está desgastada a menos de 2/32 de pulgada.
- id: 189
  category: vehicle_information
  question: Con respecto a los sistemas de escape de los vehículos en las CNMI, ¿cuál
    de las siguientes opciones es ILEGAL?
  choices:
    A: Un silenciador en buen estado de funcionamiento
    B: Un sistema de escape que evite el humo excesivo
    C: Un recorte del silenciador, derivación (bypass) o dispositivo similar
    D: Un tubo de escape que se extienda hasta la parte trasera del vehículo
  answer: C
  explanation: La ley de las CNMI prohíbe el uso de recortes de silenciador, derivaciones
    o cualquier dispositivo que aumente el ruido o permita que el escape evite el
    silenciador.
- id: 190
  category: vehicle_information
  question: 'En las CNMI, su vehículo debe tener al menos un espejo retrovisor que
    le permita ver la carretera hacia atrás por una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El espejo retrovisor debe estar colocado para proporcionar al conductor
    una visión clara de la carretera durante al menos 200 pies hacia la parte trasera
    del vehículo.
- id: 191
  category: vehicle_information
  question: ¿Con qué frecuencia debe un vehículo motorizado de propiedad privada someterse
    a una inspección de seguridad en una estación de inspección autorizada de las
    CNMI?
  choices:
    A: Cada 6 meses
    B: Una vez al año
    C: Una vez cada dos años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: En las CNMI, los vehículos deben pasar una inspección de seguridad
    anualmente (una vez al año) como requisito para la renovación del registro.
- id: 192
  category: vehicle_information
  question: 'De acuerdo con las regulaciones de polarizado de ventanas de las CNMI,
    no se puede aplicar material de polarizado al parabrisas EXCEPTO:'
  choices:
    A: Todo el parabrisas puede estar polarizado hasta un 35%
    B: Solo las 4 pulgadas inferiores del parabrisas
    C: Por encima de la línea AS-1 o las 4 pulgadas superiores del parabrisas
    D: No se permite polarizado en ninguna parte del parabrisas
  answer: C
  explanation: La ley de las CNMI permite el polarizado solo en la parte superior
    del parabrisas, específicamente por encima de la línea AS-1 del fabricante o las
    4 pulgadas superiores.
- id: 193
  category: vehicle_information
  question: 'La placa trasera de un vehículo en las CNMI debe estar iluminada por
    una luz blanca para que sea claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: Los vehículos deben tener una lámpara que ilumine la placa trasera
    con una luz blanca, haciéndola visible desde una distancia de 50 pies.
- id: 194
  category: vehicle_information
  question: Si transporta una carga que se extiende más de 4 pies más allá de la parte
    trasera de la caja de su vehículo, ¿qué debe colocarse al final de la carga durante
    el día?
  choices:
    A: Un paño blanco
    B: Una bandera roja de al menos 12 pulgadas cuadradas
    C: Una señal de advertencia amarilla
    D: No se requiere nada durante el día
  answer: B
  explanation: Para cargas que se extiendan más de 4 pies más allá de la parte trasera
    del vehículo, se debe mostrar una bandera roja (de al menos 12x12 pulgadas) durante
    el día, y se debe usar una luz roja por la noche.
- id: 195
  category: vehicle_information
  question: En las CNMI, ¿qué equipo se requiere si la carga o la carrocería de un
    vehículo obstruye la visión del conductor hacia atrás a través del espejo interior?
  choices:
    A: El conductor debe usar un observador
    B: El conductor debe mantener las ventanas bajas
    C: Un espejo exterior en el lado izquierdo y en el lado derecho del vehículo
    D: Un sistema de cámara de visión trasera
  answer: C
  explanation: Si la vista del espejo retrovisor interior está obstruida, el vehículo
    debe estar equipado con espejos laterales tanto en el lado izquierdo como en el
    derecho para asegurar que el conductor pueda ver la carretera hacia atrás.
- id: 196
  category: vehicle_information
  question: 'En las Islas Marianas del Norte, todo vehículo motorizado debe estar
    equipado con una bocina que sea audible en condiciones normales desde una distancia
    de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: De acuerdo con los estándares de equipo de vehículos de las CNMI, un
    vehículo motorizado debe tener una bocina audible desde una distancia no menor
    a 200 pies.
- id: 197
  category: vehicle_information
  question: 'En las CNMI, debe atenuar sus luces altas (cambiar a luces bajas) cuando
    siga a otro vehículo a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Para evitar reflejar el resplandor en el espejo retrovisor del conductor
    que va delante, debe cambiar a luces bajas cuando lo siga a menos de 300 pies.
- id: 198
  category: vehicle_information
  question: Todo vehículo motorizado que circule por las carreteras de las CNMI debe
    estar equipado con ¿cuál de los siguientes sistemas de frenado?
  choices:
    A: Solo un freno de pie (freno de servicio)
    B: Solo un freno de estacionamiento
    C: Tanto un freno de servicio como un freno de estacionamiento
    D: Un paracaídas de arrastre de emergencia
  answer: C
  explanation: 'La ley de las CNMI requiere dos medios separados para aplicar los
    frenos: un freno de servicio (freno de pie) y un freno de estacionamiento, cada
    uno efectivo en al menos dos ruedas.'
- id: 199
  category: vehicle_information
  question: 'En las Islas Marianas del Norte, el espejo retrovisor de un vehículo
    debe estar ajustado para proporcionar una visión de la carretera por una distancia
    de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: El manual del conductor y el código de vehículos especifican que los
    espejos deben reflejar una visión de la carretera de al menos 200 pies hacia la
    parte trasera del vehículo.
- id: 200
  category: vehicle_information
  question: 'En las CNMI, es ilegal conducir un vehículo si el parabrisas está:'
  choices:
    A: Equipado con limpiaparabrisas
    B: Hecho de vidrio de seguridad
    C: Cubierto con cualquier letrero o póster que obstruya la visión clara del conductor
    D: Limpio y despejado
  answer: C
  explanation: La ley de las CNMI prohíbe colocar cualquier letrero, póster o material
    no transparente en el parabrisas que obstruya la visión del conductor de la carretera.
- id: 201
  category: vehicle_information
  question: Según la ley de la CNMI, ¿con cuántas luces traseras, como mínimo, debe
    estar equipado todo vehículo de motor que emitan una luz roja visible desde 500
    pies?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: A
  explanation: Aunque la mayoría de los autos modernos tienen dos, la ley de la CNMI
    (9 CMC § 5202) exige que todo vehículo de motor lleve al menos una luz trasera
    en la parte posterior que emita una luz roja visible desde 500 pies.
- id: 202
  category: vehicle_information
  question: En la CNMI, las luces direccionales deben ser visibles desde una distancia
    no menor a ___ pies bajo la luz solar normal.
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Las luces direccionales en la CNMI deben ser visibles desde una distancia
    de 100 pies tanto hacia adelante como hacia atrás bajo la luz solar normal.
- id: 203
  category: vehicle_information
  question: De acuerdo con las regulaciones de polarizado de ventanas de la CNMI,
    ¿cuál es el porcentaje mínimo de transmisión de luz requerido para las ventanas
    laterales delanteras?
  choices:
    A: 20%
    B: 35%
    C: 70%
    D: 90%
  answer: C
  explanation: La ley de la CNMI generalmente sigue los estándares de seguridad que
    requieren al menos un 70% de transmisión de luz para el parabrisas y las ventanas
    laterales delanteras para garantizar la visibilidad del conductor.
- id: 204
  category: vehicle_information
  question: Si las luces direccionales de su vehículo no funcionan, debe usar señales
    manuales. ¿Cuál es la señal manual correcta para un giro a la derecha en la CNMI?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido recto hacia afuera
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido hacia arriba en un ángulo de 90 grados.
- id: 205
  category: vehicle_information
  question: 'En la CNMI, el sistema de escape de un vehículo debe mantenerse para
    evitar el escape de:'
  choices:
    A: Cualquier sonido en absoluto
    B: Humo o vapores excesivos
    C: Calor
    D: Vapor de agua
  answer: B
  explanation: La ley de la CNMI exige que el motor y el mecanismo de potencia de
    cada vehículo de motor estén equipados y ajustados para evitar el escape de vapores
    o humo excesivos.
- id: 206
  category: signs_and_signals
  question: En las Islas Marianas del Norte, ¿qué significa una luz de tráfico roja
    intermitente?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: La luz está a punto de cambiar a verde
    C: Detenerse por completo y proceder solo cuando sea seguro hacerlo
    D: Ceder el paso a todo el tráfico que viene de la derecha únicamente
  answer: C
  explanation: 'Según el Manual del Conductor de la CNMI, una luz roja intermitente
    significa lo mismo que una señal de alto: debe detenerse por completo y proceder
    solo cuando el camino esté despejado.'
- id: 207
  category: signs_and_signals
  question: Cuando un conductor en la CNMI extiende su brazo izquierdo por la ventana
    y apunta directamente hacia abajo, ¿qué señal está dando?
  choices:
    A: Realizar un giro a la izquierda
    B: Realizar un giro a la derecha
    C: Reducir la velocidad o detenerse
    D: Permitir que otros pasen
  answer: C
  explanation: La señal manual estándar para reducir la velocidad o detenerse es el
    brazo izquierdo extendido hacia abajo con la palma hacia atrás.
- id: 208
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla sólida doble en el centro de una calzada
    en la CNMI?
  choices:
    A: Se permite rebasar si el camino está despejado
    B: Está prohibido rebasar en ambas direcciones
    C: Se permite rebasar solo durante las horas del día
    D: La carretera es de un solo sentido
  answer: B
  explanation: Las líneas amarillas sólidas dobles indican que está prohibido rebasar
    para el tráfico que circula en ambas direcciones.
- id: 209
  category: signs_and_signals
  question: 'Una señal en forma de banderín (triángulo isósceles que apunta a la derecha)
    que se encuentra en el lado izquierdo de la carretera en la CNMI significa:'
  choices:
    A: Una zona escolar más adelante
    B: Un requisito de ceder el paso
    C: Una zona de no rebasar
    D: Un callejón sin salida
  answer: C
  explanation: La señal en forma de banderín se utiliza específicamente para marcar
    el inicio de una 'Zona de No Rebasar'.
- id: 210
  category: signs_and_signals
  question: En la CNMI, ¿qué debe hacer al acercarse a una señal de tráfico amarilla
    intermitente?
  choices:
    A: Detenerse y esperar la luz verde
    B: Acelerar para despejar la intersección rápidamente
    C: Reducir la velocidad y proceder con precaución
    D: Tratarla como una parada de cuatro vías
  answer: C
  explanation: Una luz amarilla intermitente es una advertencia para reducir la velocidad
    y estar especialmente alerta mientras avanza por la intersección.
- id: 211
  category: signs_and_signals
  question: ¿Cuál es el significado de una línea blanca continua pintada a través
    de un carril en una intersección en las CNMI?
  choices:
    A: Marca el borde de la carretera
    B: Es una línea de parada, que indica dónde detenerse ante una señal o semáforo
    C: Indica una zona exclusiva para peatones
    D: Significa que debe girar a la derecha
  answer: B
  explanation: Una línea blanca continua a través de un carril es una línea de parada.
    Los conductores deben detenerse detrás de esta línea ante señales de alto o luces
    rojas.
- id: 212
  category: signs_and_signals
  question: 'En las CNMI, una señal circular con un borde rojo y una línea horizontal
    blanca en el centro significa:'
  choices:
    A: Ceda el paso al tráfico que viene en sentido contrario
    B: No estacionarse
    C: No entrar (Do Not Enter)
    D: Calle de un solo sentido
  answer: C
  explanation: La señal de 'No entrar' (Do Not Enter) es un cuadrado con un círculo
    rojo y una barra horizontal blanca, utilizada para evitar que los conductores
    entren en una carretera en la dirección equivocada.
- id: 213
  category: signs_and_signals
  question: ¿Según las leyes de tránsito de las CNMI, se le permite girar a la derecha
    con luz roja?
  choices:
    A: No, debe esperar a la luz verde
    B: Sí, pero solo entre las 10:00 PM y las 5:00 AM
    C: Sí, después de detenerse por completo y ceder el paso a peatones y al tráfico,
      a menos que una señal lo prohíba
    D: Sí, pero solo si no hay otros autos en la intersección
  answer: C
  explanation: En las CNMI, se permite girar a la derecha en rojo después de una parada
    completa y ceder el paso, siempre que no haya una señal que indique 'No girar
    a la derecha en rojo' (No Right Turn on Red).
- id: 214
  category: signs_and_signals
  question: ¿Qué significa una línea blanca discontinua en una carretera de las CNMI?
  choices:
    A: El tráfico se mueve en direcciones opuestas; prohibido adelantar
    B: El tráfico se mueve en la misma dirección; se permite cambiar de carril
    C: El borde de la calzada
    D: Un carril exclusivo para bicicletas
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección e indican que puede cambiar de carril si es seguro
    hacerlo.
- id: 215
  category: signs_and_signals
  question: 'Una señal de cinco lados (pentágono) de color amarillo o verde-amarillo
    fluorescente indica:'
  choices:
    A: Una zona de construcción
    B: Un cruce de ferrocarril
    C: Una zona escolar o cruce escolar
    D: Un hospital cercano
  answer: C
  explanation: La forma de pentágono se reserva exclusivamente para advertencias relacionadas
    con escuelas, como zonas escolares o cruces escolares.
- id: 216
  category: signs_and_signals
  question: En las CNMI, ¿qué indica una luz amarilla fija en un semáforo?
  choices:
    A: Acelerar para pasar antes de la luz roja
    B: La señal está cambiando a rojo; despeje la intersección o deténgase si es seguro
    C: Usted tiene el derecho de paso sobre el tráfico que gira
    D: El semáforo está averiado; trátelo como una señal de alto
  answer: B
  explanation: Una luz amarilla fija significa que la señal está a punto de cambiar
    a rojo. Debe detenerse si puede hacerlo de manera segura; de lo contrario, despeje
    la intersección.
- id: 217
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de un símbolo de diamante blanco pintado
    en un carril en las CNMI?
  choices:
    A: Marca un carril para vehículos de alta ocupación (HOV) o carril restringido
    B: Indica un cruce de peatones
    C: Marca la ubicación de un hidrante de incendios
    D: Indica una curva cerrada más adelante
  answer: A
  explanation: El símbolo de diamante en el pavimento se utiliza para designar carriles
    reservados para vehículos específicos, como autobuses o vehículos compartidos
    (HOV).
- id: 218
  category: signs_and_signals
  question: Cuando ve una señal que muestra un círculo rojo con una raya diagonal
    sobre un símbolo, ¿qué significa en las CNMI?
  choices:
    A: La acción mostrada es recomendada
    B: La acción mostrada está prohibida
    C: La acción mostrada es solo para camiones
    D: La acción mostrada está permitida después de detenerse
  answer: B
  explanation: Un círculo rojo con una raya diagonal es un símbolo reglamentario estándar
    que significa 'No' o 'Prohibido' para la acción representada (por ejemplo, No
    girar en U).
- id: 219
  category: signs_and_signals
  question: Si un semáforo en las CNMI está apagado (no funciona debido a un corte
    de energía), ¿cómo debe tratar la intersección?
  choices:
    A: Como un paso libre para todos; proceda bajo su propio riesgo
    B: Ceda el paso al tráfico en la carretera principal únicamente
    C: Como una parada obligatoria para todos (parada de cuatro vías)
    D: Mantenga la velocidad y toque la bocina para advertir a los demás
  answer: C
  explanation: Cuando los semáforos no funcionan, la intersección debe tratarse como
    una parada de cuatro vías, donde los conductores ceden el paso a quienes llegaron
    primero o al vehículo de la derecha.
- id: 220
  category: signs_and_signals
  question: 'Una luz amarilla intermitente en una intersección en las Islas Marianas
    del Norte significa que usted debe:'
  choices:
    A: Detenerse y esperar la luz verde
    B: Acelerar para despejar la intersección
    C: Reducir la velocidad y proceder con precaución
    D: Tratarla como una parada de cuatro vías
  answer: C
  explanation: Una luz amarilla intermitente es una advertencia para reducir la velocidad,
    estar alerta y cruzar la intersección con precaución.
- id: 221
  category: signs_and_signals
  question: ¿Qué forma de señal se utiliza exclusivamente para las señales de 'Ceder
    el paso' (Yield) en las Islas Marianas del Norte?
  choices:
    A: Octágono
    B: Diamante (Rombo)
    C: Triángulo invertido
    D: Banderín
  answer: C
  explanation: La señal de ceder el paso es un triángulo equilátero de tres lados
    con el vértice apuntando hacia abajo.
- id: 222
  category: signs_and_signals
  question: Cuando ve una señal de 'Zona de no adelantar' (No Passing Zone) en una
    carretera de las CNMI, ¿qué forma tiene?
  choices:
    A: Redonda
    B: Cuadrada
    C: Banderín (triángulo lateral)
    D: Diamante (Rombo)
  answer: C
  explanation: Se coloca una señal en forma de banderín en el lado izquierdo de la
    carretera para advertir a los conductores que están entrando en una zona donde
    está prohibido adelantar.
- id: 223
  category: signs_and_signals
  question: En las CNMI, ¿qué indica un conductor que extiende el brazo izquierdo
    recto hacia afuera de la ventana?
  choices:
    A: Un giro a la derecha
    B: Un giro a la izquierda
    C: Una parada
    D: Necesidad de asistencia
  answer: B
  explanation: La señal manual estándar para un giro a la izquierda es el brazo izquierdo
    extendido recto hacia afuera de la ventana.
- id: 224
  category: signs_and_signals
  question: ¿Cuál es el significado de una línea blanca discontinua (punteada) en
    una carretera de varios carriles de las CNMI?
  choices:
    A: El tráfico se mueve en direcciones opuestas; se permite adelantar
    B: El tráfico se mueve en la misma dirección; se permiten los cambios de carril
    C: El borde de la calzada
    D: Una zona de construcción próxima
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección, lo que indica que puede cruzar las líneas para
    cambiar de carril cuando sea seguro.
- id: 225
  category: signs_and_signals
  question: ¿Qué indica habitualmente una señal en forma de diamante (rombo) en las
    Islas Marianas del Norte?
  choices:
    A: Información reglamentaria (como límites de velocidad)
    B: Advertencia o precaución sobre las condiciones próximas de la carretera
    C: Guía recreativa pública y paisajística
    D: Instrucciones de Pare o Ceder el paso
  answer: B
  explanation: Las señales en forma de diamante se utilizan como señales de advertencia
    para alertar a los conductores sobre peligros o cambios en la carretera más adelante.
- id: 226
  category: signs_and_signals
  question: En las CNMI, ¿de qué color son las marcas utilizadas para indicar una
    zona de hidrante de incendios donde está prohibido estacionar?
  choices:
    A: Azul
    B: Verde
    C: Rojo
    D: Blanco
  answer: C
  explanation: Las marcas rojas en el bordillo o la pintura roja en la carretera suelen
    indicar zonas de 'Prohibido estacionar', que incluyen las áreas cercanas a los
    hidrantes de incendios.
- id: 227
  category: signs_and_signals
  question: 'Una señal amarilla circular con una ''X'' negra y las letras ''RR'' advierte
    a los conductores de las CNMI sobre:'
  choices:
    A: Una zona de reparación de carreteras
    B: Un cruce de ferrocarril más adelante
    C: Un área de descanso en la carretera
    D: Una superficie de carretera irregular
  answer: B
  explanation: La señal amarilla redonda con una 'X' negra y 'RR' es la señal de advertencia
    anticipada estándar para un cruce de ferrocarril.
