metadata:
  source: CNMI Driver Manual
  total_questions: 227
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In the Northern Mariana Islands, what is the minimum age required to apply
    for a Learner's Permit?
  choices:
    A: 14 years and 6 months
    B: 15 years
    C: 15 years and 6 months
    D: 16 years
  answer: C
  explanation: According to the CNMI Bureau of Motor Vehicles (BMV), an applicant
    must be at least 15 years and 6 months old to obtain a Learner's Permit.
- id: 2
  category: license_system
  question: Under the CNMI Graduated Driver Licensing (GDL) system, how long must
    a minor hold a Learner's Permit before they are eligible for an Intermediate License?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: A person must hold a Learner's Permit for at least six months and remain
    conviction-free before applying for an Intermediate License.
- id: 3
  category: license_system
  question: While driving with a Learner's Permit in the CNMI, the supervisor in the
    front seat must be at least how old?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: 30 years old
  answer: B
  explanation: The person accompanying a permit holder must be a licensed driver who
    is at least 21 years of age.
- id: 4
  category: license_system
  question: What is the curfew for a driver holding a CNMI Intermediate License?
  choices:
    A: 9:00 PM to 5:00 AM
    B: 10:00 PM to 6:00 AM
    C: 11:00 PM to 5:00 AM
    D: Midnight to 6:00 AM
  answer: B
  explanation: Intermediate License holders are restricted from driving between 10:00
    PM and 6:00 AM unless accompanied by a licensed driver aged 21 or older, or for
    specific employment/educational purposes.
- id: 5
  category: license_system
  question: A CNMI Learner's Permit is valid for how long from the date of issuance?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: In the Northern Mariana Islands, a Learner's Permit is typically valid
    for a period of one year.
- id: 6
  category: license_system
  question: How many hours of certified driving practice, including nighttime hours,
    are required to move from a Learner's Permit to an Intermediate License in the
    CNMI?
  choices:
    A: 30 total (5 at night)
    B: 40 total (10 at night)
    C: 50 total (10 at night)
    D: 20 total (0 at night)
  answer: C
  explanation: CNMI GDL requirements specify 50 hours of supervised driving, with
    at least 10 of those hours being at night.
- id: 7
  category: license_system
  question: 'If you move to a new residence within the CNMI, you must notify the Bureau
    of Motor Vehicles (BMV) of your change of address within:'
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: CNMI law requires drivers to notify the BMV of any change of address
    within 10 days of the move.
- id: 8
  category: license_system
  question: What is the minimum vision requirement to pass the eye exam for a CNMI
    driver's license?
  choices:
    A: 20/20 in both eyes
    B: 20/40 in at least one eye
    C: 20/50 in both eyes
    D: 20/30 in at least one eye
  answer: B
  explanation: To qualify for a driver's license in the CNMI, an applicant must have
    at least 20/40 vision in at least one eye, with or without corrective lenses.
- id: 9
  category: license_system
  question: Under CNMI law, a driver's license may be suspended if the driver accumulates
    how many points within a 12-month period?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: D
  explanation: The CNMI point system dictates that accumulating 12 or more points
    within a 12-month period will result in a license suspension.
- id: 10
  category: license_system
  question: Which of the following documents is NOT required to apply for an original
    CNMI driver's license?
  choices:
    A: Proof of Social Security Number
    B: A valid passport or birth certificate
    C: Proof of residency in the CNMI
    D: A copy of your high school diploma
  answer: D
  explanation: While proof of identity, SSN, and residency are required, a high school
    diploma is not a requirement for a driver's license in the CNMI.
- id: 11
  category: license_system
  question: What is the Blood Alcohol Concentration (BAC) limit for a driver under
    the age of 21 in the CNMI (Zero Tolerance Law)?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: The CNMI enforces a Zero Tolerance Law for minors, where a BAC of 0.02%
    or higher results in immediate license penalties.
- id: 12
  category: license_system
  question: In the CNMI, how long is a standard Operator's License (Class C) typically
    valid for before it must be renewed?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: 10 years
  answer: B
  explanation: A standard CNMI driver's license is generally valid for a period of
    3 years.
- id: 13
  category: license_system
  question: To obtain a Full Operator's License (unrestricted) in the CNMI, a driver
    must have held an Intermediate License for at least how long without any traffic
    violations?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Until they turn 21
  answer: B
  explanation: Under the GDL system, a driver must hold an Intermediate License for
    at least 12 consecutive months (1 year) without any traffic convictions before
    graduating to a Full License.
- id: 14
  category: license_system
  question: 'If your CNMI driver''s license is lost or destroyed, you must:'
  choices:
    A: Wait until the original expiration date to get a new one
    B: Apply for a duplicate license at the BMV and pay the required fee
    C: Continue driving with a police report as your license
    D: Apply for a brand new Learner's Permit
  answer: B
  explanation: If a license is lost or destroyed, the driver must immediately apply
    for a duplicate at the BMV and pay the replacement fee.
- id: 15
  category: license_system
  question: Which of the following is a mandatory requirement for vehicle registration
    in the CNMI?
  choices:
    A: Proof of liability insurance
    B: Proof of a college degree
    C: A letter of recommendation from an employer
    D: Ownership of at least two vehicles
  answer: A
  explanation: In the CNMI, you must provide proof of valid liability insurance to
    register a vehicle and maintain a valid license.
- id: 16
  category: license_system
  question: 'In the Northern Mariana Islands, a Class C Operator''s License allows
    you to drive a motor vehicle with a Gross Vehicle Weight Rating (GVWR) of less
    than:'
  choices:
    A: 8,000 lbs
    B: 10,000 lbs
    C: 15,000 lbs
    D: 26,001 lbs
  answer: B
  explanation: In the CNMI, a standard Class C Operator's License is for driving vehicles
    with a GVWR of less than 10,000 pounds.
- id: 17
  category: license_system
  question: A visitor to the CNMI who has a valid driver's license from another country
    or US territory may legally drive for up to how many days?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: According to CNMI law, a visitor with a valid foreign or out-of-state
    license may drive for a period not to exceed 30 days.
- id: 18
  category: license_system
  question: 'Under the CNMI GDL system, if an Intermediate License holder is convicted
    of a traffic violation, the required ''violation-free'' period to graduate to
    a Full License:'
  choices:
    A: Is reduced by half
    B: Remains the same
    C: Restarts from the date of the violation
    D: Results in permanent loss of driving privileges
  answer: C
  explanation: To progress from an Intermediate License to a Full License, the driver
    must remain violation-free for 6 consecutive months. If a violation occurs, the
    6-month clock restarts.
- id: 19
  category: license_system
  question: The Bureau of Motor Vehicles (BMV) in the Northern Mariana Islands is
    a division of which government department?
  choices:
    A: Department of Commerce
    B: Department of Public Works
    C: Department of Public Safety
    D: Department of Finance
  answer: C
  explanation: The CNMI Bureau of Motor Vehicles (BMV) is under the jurisdiction of
    the Department of Public Safety (DPS).
- id: 20
  category: license_system
  question: When applying for a CNMI driver's license, what is the purpose of the
    'Organ Donor' designation?
  choices:
    A: It is a mandatory requirement for all drivers
    B: It allows you to skip the written exam
    C: It indicates your legal consent to donate organs/tissues upon death
    D: It provides a discount on the license fee
  answer: C
  explanation: The organ donor designation is a voluntary choice that indicates your
    legal consent to be an organ or tissue donor in the event of your death.
- id: 21
  category: license_system
  question: In the CNMI, what is the minimum age required to apply for a Class D (Chauffeur's)
    license, typically used for operating taxis?
  choices:
    A: 16 years old
    B: 18 years old
    C: 21 years old
    D: 25 years old
  answer: C
  explanation: To operate a taxi or work as a professional chauffeur (Class D) in
    the CNMI, the applicant must be at least 21 years of age.
- id: 22
  category: license_system
  question: While operating a vehicle with a Learner's Permit, which of the following
    is a strict requirement regarding the permit document itself?
  choices:
    A: It can be left at home if you have a photo of it
    B: It must be in the driver's immediate possession
    C: It must be kept in the glove compartment at all times
    D: It must be displayed on the dashboard
  answer: B
  explanation: CNMI law requires that any person operating a motor vehicle must have
    their valid license or permit in their immediate possession.
- id: 23
  category: license_system
  question: Under the CNMI Intermediate License restrictions, how many passengers
    under the age of 18 (who are not immediate family members) can the driver transport?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: Intermediate License holders in the CNMI are restricted to carrying
    no more than one passenger under the age of 18 who is not an immediate family
    member.
- id: 24
  category: license_system
  question: If you fail the CNMI driving skills (road) test, how long must you typically
    wait before you are eligible to retake it?
  choices:
    A: 24 hours
    B: 3 days
    C: 1 week
    D: 1 month
  answer: C
  explanation: In the CNMI, if an applicant fails the road test, they are generally
    required to wait at least one week before attempting the test again.
- id: 25
  category: license_system
  question: 'If you legally change your name (e.g., through marriage or court order),
    you must notify the CNMI BMV and obtain a duplicate license within:'
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: The end of the calendar year
  answer: A
  explanation: CNMI regulations require drivers to notify the BMV of a name change
    within 10 days.
- id: 26
  category: license_system
  question: What is the minimum age to apply for a Commercial Driver's License (CDL)
    in the CNMI for intrastate commerce?
  choices:
    A: 18 years old
    B: 19 years old
    C: 21 years old
    D: 25 years old
  answer: C
  explanation: Applicants for a Commercial Driver's License (CDL) in the CNMI must
    be at least 21 years of age.
- id: 27
  category: license_system
  question: Under the CNMI point system, how many points are assessed against your
    driving record for 'Leaving the scene of an accident' (Hit and Run)?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Leaving the scene of an accident involving property damage or injury
    is a serious offense in the CNMI and typically results in 6 points being added
    to the driver's record.
- id: 28
  category: license_system
  question: Which license class is specifically required to operate a motorcycle in
    the Northern Mariana Islands?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class M
  answer: A
  explanation: In the CNMI, Class A is the designation used for the operation of motorcycles.
- id: 29
  category: license_system
  question: Applicants for which type of CNMI license are required to submit a medical
    examiner's certificate (medical card) to prove physical fitness?
  choices:
    A: Class C (Operator)
    B: Learner's Permit
    C: Class B or CDL (Heavy Vehicles/Commercial)
    D: Intermediate License
  answer: C
  explanation: Drivers of heavy vehicles (Class B) or commercial vehicles (CDL) in
    the CNMI must provide a medical certificate to ensure they meet physical health
    standards for safety.
- id: 30
  category: license_system
  question: 'The ''Implied Consent'' law in the CNMI means that by driving a motor
    vehicle, you have given consent to:'
  choices:
    A: A search of your vehicle at any time
    B: A chemical test of your breath, blood, or urine for alcohol/drugs
    C: Allowing passengers to ride in the bed of a truck
    D: Pay all traffic fines immediately in cash
  answer: B
  explanation: Implied Consent means that any person who operates a motor vehicle
    in the CNMI is deemed to have given consent to a chemical test of their breath,
    blood, or urine to determine alcohol or drug content if arrested for DUI.
- id: 31
  category: driver_testing
  question: In the Northern Mariana Islands, what is the maximum speed limit for any
    motor vehicle on a highway, unless otherwise posted?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: According to 9 CMC § 5201, the maximum speed limit in the CNMI is 45
    miles per hour unless a different speed is posted.
- id: 32
  category: driver_testing
  question: When arriving for your road test in the CNMI, what must you provide regarding
    the vehicle you will use for the exam?
  choices:
    A: A vehicle with at least half a tank of gas
    B: A vehicle with a valid registration and current insurance
    C: A vehicle that is less than 10 years old
    D: Proof that the vehicle was purchased in the CNMI
  answer: B
  explanation: To take the road test, the applicant must provide a vehicle that is
    in safe operating condition and has a valid registration and current insurance
    certificate.
- id: 33
  category: driver_testing
  question: In the CNMI, you are required to dim your high-beam headlights when an
    oncoming vehicle is within how many feet?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Standard safety regulations in the CNMI require drivers to dim high
    beams when an oncoming vehicle is within 500 feet to avoid blinding the other
    driver.
- id: 34
  category: driver_testing
  question: Under CNMI law, what is the minimum fine for a first-time conviction of
    Driving Under the Influence (DUI)?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: According to 9 CMC § 7105, a person convicted of a first DUI offense
    shall be fined not less than $250.
- id: 35
  category: driver_testing
  question: 'When parking your vehicle on a downhill grade in the CNMI, you should
    turn your front wheels:'
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the left
  answer: A
  explanation: When parking downhill, you should turn your wheels toward the curb
    so that if the vehicle rolls, it will roll into the curb rather than into traffic.
- id: 36
  category: driver_testing
  question: In the Northern Mariana Islands, you must signal your intention to turn
    at least how many feet before the actual turn?
  choices:
    A: 50 feet
    B: 75 feet
    C: 100 feet
    D: 150 feet
  answer: C
  explanation: 9 CMC § 5306 requires drivers to give a continuous signal for at least
    100 feet before turning.
- id: 37
  category: driver_testing
  question: What does a flashing red traffic light mean at an intersection in the
    CNMI?
  choices:
    A: Slow down and proceed with caution
    B: Stop, then proceed only when it is safe to do so
    C: The light is about to turn green
    D: Yield to all traffic coming from the left
  answer: B
  explanation: A flashing red light has the same meaning as a stop sign; you must
    come to a complete stop and proceed only when it is safe.
- id: 38
  category: driver_testing
  question: In the CNMI, it is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: According to 9 CMC § 5604, no person shall stop, stand, or park a vehicle
    within 15 feet of a fire hydrant.
- id: 39
  category: driver_testing
  question: 'In the CNMI, a person who willfully fails or refuses to comply with any
    lawful order or direction of a police officer is guilty of:'
  choices:
    A: An infraction
    B: A misdemeanor
    C: A felony
    D: Nothing, if they have a valid license
  answer: B
  explanation: Under 9 CMC § 5102, it is a misdemeanor to willfully fail or refuse
    to comply with any lawful order or direction of any police officer invested by
    law with authority to direct, control, or regulate traffic.
- id: 40
  category: driver_testing
  question: When two vehicles reach an uncontrolled intersection at the same time
    in the CNMI, who has the right of way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling at a higher speed
    D: The larger vehicle
  answer: B
  explanation: At an intersection without signs or signals, the driver of the vehicle
    on the left must yield the right of way to the vehicle on the right.
- id: 41
  category: driver_testing
  question: In the CNMI, what is the speed limit when passing a school while children
    are present or when a school zone is active?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: 9 CMC § 5204 establishes a speed limit of 15 miles per hour when passing
    a school building or the grounds thereof during school recess or while children
    are going to or leaving school.
- id: 42
  category: driver_testing
  question: 'If you are involved in a traffic accident in the CNMI that results in
    injury or death, you must:'
  choices:
    A: Drive to the nearest police station before stopping
    B: Immediately stop and remain at the scene until you have fulfilled legal requirements
    C: Only stop if your vehicle is damaged
    D: Wait 24 hours before reporting the incident
  answer: B
  explanation: Under 9 CMC § 6101, the driver of any vehicle involved in an accident
    resulting in injury or death must immediately stop at the scene and remain there
    until they have provided identification and rendered aid.
- id: 43
  category: driver_testing
  question: When driving in the CNMI, what is the recommended following distance behind
    another vehicle under normal conditions?
  choices:
    A: One car length for every 20 mph
    B: At least two seconds
    C: Exactly 50 feet
    D: One car length
  answer: B
  explanation: The CNMI Driver's Manual recommends a following distance of at least
    two seconds to allow enough time to react to sudden stops or hazards.
- id: 44
  category: driver_testing
  question: 'For drivers 21 years of age or older in the CNMI, it is illegal to drive
    with a Blood Alcohol Concentration (BAC) of:'
  choices:
    A: 0.02% or higher
    B: 0.05% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: C
  explanation: In the CNMI, the legal limit for Blood Alcohol Concentration (BAC)
    for adult drivers (21 and over) is 0.08%.
- id: 45
  category: driver_testing
  question: What is the minimum required amount of property damage liability insurance
    coverage for a motor vehicle in the CNMI?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $20,000
  answer: B
  explanation: The CNMI mandatory insurance law requires a minimum of $10,000 for
    property damage in any one accident.
- id: 46
  category: driver_testing
  question: Under CNMI law, children under what age must be properly secured in a
    child passenger restraint system?
  choices:
    A: Under 4 years old
    B: Under 5 years old
    C: Under 7 years old
    D: Under 8 years old
  answer: B
  explanation: CNMI law requires that children under the age of 5, or weighing less
    than 60 pounds, must be secured in an approved child restraint system.
- id: 47
  category: driver_testing
  question: In the CNMI, how many points are assessed against your driving record
    for a conviction of 'Reckless Driving'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Reckless driving is a serious offense in the CNMI and results in 6
    points being added to the driver's record.
- id: 48
  category: driver_testing
  question: When parking on a public highway in the CNMI, you must not park within
    how many feet of a stop sign or traffic signal?
  choices:
    A: 20 feet
    B: 30 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: CNMI regulations prohibit parking within 30 feet upon the approach
    to any flashing signal, stop sign, or traffic-control signal located at the side
    of a roadway.
- id: 49
  category: driver_testing
  question: What is the fine for a first-time offense of using a handheld electronic
    device (texting/calling) while driving in the CNMI?
  choices:
    A: Up to $100
    B: Up to $250
    C: Up to $500
    D: Up to $1,000
  answer: C
  explanation: Under the CNMI 'Hands-Free' law (Public Law 16-46), the penalty for
    using a handheld electronic device while driving can be a fine of up to $500.
- id: 50
  category: driver_testing
  question: According to the CNMI point system, how many points are added to your
    record for 'Speeding' (1 to 10 miles over the limit)?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Speeding between 1 and 10 miles per hour over the posted limit results
    in 2 points on a CNMI driving record.
- id: 51
  category: driver_testing
  question: 'In the CNMI, if you are involved in an accident resulting in injury or
    death, you must immediately notify:'
  choices:
    A: The Bureau of Motor Vehicles (BMV)
    B: The Department of Public Safety (Police)
    C: Your insurance agent only
    D: The Governor's office
  answer: B
  explanation: CNMI law requires the driver of any vehicle involved in an accident
    resulting in injury or death to immediately notify the Department of Public Safety
    (DPS).
- id: 52
  category: driver_testing
  question: 'Under the CNMI Implied Consent law, if you refuse to submit to a chemical
    test for alcohol, your driving privileges will be suspended for:'
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: By driving in the CNMI, you give consent to be tested for alcohol.
    Refusal to take the test results in an automatic 6-month license suspension.
- id: 53
  category: driver_responsibility
  question: 'In the Northern Mariana Islands, if you are involved in a traffic accident
    that results in property damage, you must report it to the Department of Public
    Safety if the damage to any one person''s property appears to exceed:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: According to CNMI law (9 CMC § 4101), a written report must be made
    to the Department of Public Safety within 24 hours if the accident results in
    bodily injury, death, or property damage exceeding $500.
- id: 54
  category: driver_responsibility
  question: Every motor vehicle operated on CNMI public highways must be covered by
    a liability insurance policy. What is the minimum required coverage for bodily
    injury to or death of one person in any one accident?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: C
  explanation: CNMI law (9 CMC § 8101) requires a minimum of $15,000 for bodily injury
    to or death of one person in any one accident.
- id: 55
  category: driver_responsibility
  question: Under CNMI financial responsibility laws, what is the minimum liability
    insurance coverage required for bodily injury to or death of two or more persons
    in any one accident?
  choices:
    A: $20,000
    B: $30,000
    C: $40,000
    D: $50,000
  answer: B
  explanation: The CNMI minimum liability requirement for bodily injury or death involving
    two or more persons in a single accident is $30,000.
- id: 56
  category: driver_responsibility
  question: What is the minimum liability insurance coverage required for injury to
    or destruction of property of others in any one accident in the Northern Mariana
    Islands?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $20,000
  answer: B
  explanation: CNMI law requires a minimum of $10,000 in coverage for property damage
    resulting from a motor vehicle accident.
- id: 57
  category: driver_responsibility
  question: If a law enforcement officer in the CNMI requests proof of insurance during
    a traffic stop and you cannot provide it, which of the following may occur?
  choices:
    A: You will be given a verbal warning only
    B: Your vehicle registration may be suspended and you may face a fine
    C: You will be required to sell the vehicle within 48 hours
    D: No action will be taken if you have a valid driver's license
  answer: B
  explanation: Operating a vehicle without the required liability insurance in the
    CNMI is a violation that can lead to fines and the suspension of vehicle registration
    and driving privileges.
- id: 58
  category: driver_responsibility
  question: If you strike an unattended vehicle in the CNMI and cannot locate the
    owner, what is your legal responsibility?
  choices:
    A: Wait for 10 minutes and then leave if no one shows up
    B: Leave a written notice with your name, address, and an explanation, and notify
      the police
    C: Honk your horn until someone arrives
    D: Report it to your insurance company only
  answer: B
  explanation: Drivers who hit an unattended vehicle must attempt to find the owner.
    If unsuccessful, they must leave a conspicuous note with their contact information
    and report the collision to the Department of Public Safety.
- id: 59
  category: driver_responsibility
  question: In the Northern Mariana Islands, how often must a motor vehicle's registration
    be renewed?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Every 5 years
  answer: B
  explanation: Vehicle registration in the CNMI must be renewed annually with the
    Bureau of Motor Vehicles (BMV).
- id: 60
  category: driver_responsibility
  question: 'When a vehicle is sold or transferred in the CNMI, the owner must notify
    the Bureau of Motor Vehicles (BMV) of the transfer within:'
  choices:
    A: 24 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: Under CNMI law, the owner of a vehicle must notify the BMV of a transfer
    of ownership within 10 days of the transaction.
- id: 61
  category: driver_responsibility
  question: 'In the CNMI, a person convicted of their first DUI (Driving Under the
    Influence) offense faces a mandatory minimum jail sentence of:'
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 1 week
  answer: C
  explanation: According to 9 CMC § 7105, a first-time DUI conviction in the CNMI
    carries a mandatory minimum imprisonment of not less than 72 consecutive hours.
- id: 62
  category: driver_responsibility
  question: 'If you refuse to submit to a chemical test for alcohol or drugs when
    requested by a law enforcement officer in the CNMI, your license will be automatically
    suspended for:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 2 years
  answer: C
  explanation: Under CNMI law, a first refusal to take a chemical test results in
    an administrative license suspension of 6 months.
- id: 63
  category: driver_responsibility
  question: Where must the registration validation sticker be placed on a vehicle's
    license plate in the Northern Mariana Islands?
  choices:
    A: On the front license plate only
    B: On the rear license plate
    C: On the lower left corner of the windshield
    D: On the rear bumper
  answer: B
  explanation: In the CNMI, the registration sticker (tag) must be affixed to the
    rear license plate to show that the vehicle's registration is current.
- id: 64
  category: driver_responsibility
  question: 'If you fail to satisfy a court judgment resulting from a motor vehicle
    accident in the CNMI within 30 days, the Bureau of Motor Vehicles (BMV) is authorized
    to:'
  choices:
    A: Increase your insurance premiums
    B: Impound your vehicle permanently
    C: Suspend your driver's license and vehicle registration
    D: Issue a new license with a 'debtor' restriction
  answer: C
  explanation: Under financial responsibility laws, failure to pay a judgment for
    damages resulting from an accident will lead to the suspension of both your driving
    privileges and vehicle registration.
- id: 65
  category: driver_responsibility
  question: 'In the CNMI, the ''Duty to Give Information and Render Aid'' law requires
    a driver involved in an accident to provide their name, address, and vehicle registration
    number to:'
  choices:
    A: Their insurance agent only
    B: Any person struck or the driver/occupant of any vehicle collided with
    C: Witnesses only
    D: The BMV within 30 days
  answer: B
  explanation: CNMI law (9 CMC § 4103) requires drivers in accidents to provide identifying
    information to the other parties involved and to render reasonable assistance
    to any person injured.
- id: 66
  category: driver_responsibility
  question: In the Northern Mariana Islands, what are the minimum liability insurance
    requirements for a motor vehicle?
  choices:
    A: $10,000 for bodily injury to one person, $20,000 for two or more, and $5,000
      for property damage
    B: $15,000 for bodily injury to one person, $30,000 for two or more, and $15,000
      for property damage
    C: $25,000 for bodily injury to one person, $50,000 for two or more, and $10,000
      for property damage
    D: $50,000 for bodily injury to one person, $100,000 for two or more, and $25,000
      for property damage
  answer: B
  explanation: According to the CNMI Vehicle Code (9 CMC § 8101), the minimum mandatory
    liability insurance coverage is $15,000 for injury/death of one person, $30,000
    for two or more persons, and $15,000 for property damage.
- id: 67
  category: driver_responsibility
  question: How often must a motor vehicle registered in the Northern Mariana Islands
    undergo a safety inspection?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: In the CNMI, vehicles must undergo a safety inspection annually as
    part of the registration renewal process to ensure they meet safety standards.
- id: 68
  category: driver_responsibility
  question: Where must the valid certificate of registration for a motor vehicle be
    kept in the CNMI?
  choices:
    A: At the owner's residence
    B: In the glove compartment or otherwise carried in the vehicle
    C: At the Bureau of Motor Vehicles
    D: In the trunk of the vehicle
  answer: B
  explanation: CNMI law requires that the registration card be carried in the vehicle
    for which it is issued or on the person driving the vehicle to be displayed upon
    demand by a police officer.
- id: 69
  category: driver_responsibility
  question: What is the legal Blood Alcohol Concentration (BAC) limit for an adult
    driver (21 or older) in the Northern Mariana Islands?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In the CNMI, it is illegal for a person 21 years of age or older to
    operate a motor vehicle with a BAC of 0.08% or higher.
- id: 70
  category: driver_responsibility
  question: In the CNMI, who is legally responsible for ensuring that a passenger
    under the age of 16 is wearing a seatbelt or is in a child restraint system?
  choices:
    A: The passenger
    B: The passenger's parents (even if not in the car)
    C: The driver of the vehicle
    D: The vehicle owner only
  answer: C
  explanation: The driver is responsible for the safety of minors in the vehicle and
    must ensure they are properly buckled up or secured in an approved child safety
    seat.
- id: 71
  category: driver_responsibility
  question: What must you do if you sell your vehicle to another person in the CNMI?
  choices:
    A: Nothing; the new owner is solely responsible for all paperwork
    B: Keep the license plates for your next car
    C: Endorse the certificate of ownership and notify the BMV of the transfer within
      a specific timeframe
    D: Cancel your insurance and throw away the registration
  answer: C
  explanation: When a vehicle is sold, the seller must sign the title over to the
    buyer and the BMV must be notified to update the registration and ownership records.
- id: 72
  category: driver_responsibility
  question: If a CNMI law enforcement officer requests proof of financial responsibility,
    what document should you provide?
  choices:
    A: Your birth certificate
    B: A valid motor vehicle insurance identification card
    C: Your vehicle's repair history
    D: A bank statement showing at least $1,000
  answer: B
  explanation: Proof of financial responsibility is typically demonstrated by providing
    a valid insurance card issued by an insurance company authorized to do business
    in the CNMI.
- id: 73
  category: driver_responsibility
  question: In the CNMI, what is the maximum fine for a first-time offense of parking
    in a space designated for persons with disabilities without a valid placard or
    plate?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: The CNMI enforces strict fines for unauthorized parking in disabled
    spaces, with fines typically starting at $250 for the first offense to ensure
    accessibility.
- id: 74
  category: driver_responsibility
  question: What happens to your CNMI driving privileges if you refuse to take a chemical
    test for alcohol when requested by a police officer?
  choices:
    A: Nothing, as long as you weren't speeding
    B: Your license will be automatically suspended for a period of time
    C: You will be given a second chance the next day
    D: You will be required to take a written test instead
  answer: B
  explanation: Under the Implied Consent law (9 CMC § 7106), refusal to submit to
    a chemical test results in an administrative license suspension, regardless of
    whether you are later convicted of DUI.
- id: 75
  category: driver_responsibility
  question: When are you allowed to drive a motor vehicle in the CNMI without valid
    registration?
  choices:
    A: When driving directly to the BMV to renew it
    B: If the vehicle is less than one year old
    C: Never; it is illegal to operate an unregistered vehicle on public roads
    D: Only on Sundays and holidays
  answer: C
  explanation: All motor vehicles operated on public highways in the CNMI must be
    currently and validly registered with the Bureau of Motor Vehicles.
- id: 76
  category: driver_responsibility
  question: 'In the CNMI, if you are convicted of ''Hit and Run'' (leaving the scene
    of an accident) involving personal injury, the penalty may include:'
  choices:
    A: Only a $50 fine
    B: A mandatory 5-minute safety lecture
    C: Imprisonment and/or heavy fines, and license revocation
    D: No penalty if you return within 24 hours
  answer: C
  explanation: Leaving the scene of an accident involving injury or death is a serious
    crime in the CNMI (9 CMC § 5101), punishable by fines, imprisonment, and the loss
    of driving privileges.
- id: 77
  category: safe_driving_rules
  question: When parking near an intersection, what is the minimum distance you must
    maintain from a stop sign or traffic signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Drivers in the CNMI must not park within 30 feet of any official flashing
    signal, stop sign, or traffic control signal located at the side of a roadway.
- id: 78
  category: safe_driving_rules
  question: Which hand signal is the correct way to indicate a right turn in the CNMI?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out the window
  answer: B
  explanation: To signal a right turn using hand signals, the driver should extend
    their left arm out the window and bend it upward at the elbow.
- id: 79
  category: safe_driving_rules
  question: In the CNMI, when are you allowed to turn right on a red light?
  choices:
    A: Never, you must wait for a green light
    B: Only if there is a sign specifically allowing it
    C: After coming to a complete stop and yielding to pedestrians and other traffic,
      unless a sign prohibits it
    D: Only between the hours of 10:00 PM and 5:00 AM
  answer: C
  explanation: CNMI law allows a right turn on red after a full stop and yielding
    to traffic and pedestrians, provided there is no sign prohibiting the turn.
- id: 80
  category: safe_driving_rules
  question: What is the minimum distance you must maintain from a crosswalk at an
    intersection when parking?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: C
  explanation: In the CNMI, it is illegal to park within 20 feet of a crosswalk at
    an intersection.
- id: 81
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit in residential and business
    districts in the CNMI?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: The default speed limit for residential and business areas in the Northern
    Mariana Islands is 25 mph.
- id: 82
  category: safe_driving_rules
  question: When is it legal to pass another vehicle on the right in the CNMI?
  choices:
    A: Whenever the vehicle in front is going too slow
    B: When the vehicle ahead is making or about to make a left turn and there is
      sufficient pavement width
    C: Only on one-way streets
    D: Passing on the right is never legal
  answer: B
  explanation: Passing on the right is permitted in the CNMI when the vehicle being
    overtaken is making a left turn and there is enough room on the right side of
    the road to pass safely without leaving the pavement.
- id: 83
  category: safe_driving_rules
  question: When driving at night, you must dim your high-beam headlights when you
    are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: CNMI safety regulations require drivers to switch to low beams when
    an oncoming vehicle is within 500 feet to avoid blinding the other driver.
- id: 84
  category: safe_driving_rules
  question: To maintain a safe following distance behind the vehicle in front of you,
    the CNMI Driver's Manual recommends using which rule?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The three-second rule
    D: The five-second rule
  answer: C
  explanation: The CNMI recommends a three-second following distance under normal
    driving conditions to allow enough time to react to hazards.
- id: 85
  category: safe_driving_rules
  question: When parking a vehicle headed downhill on a two-way street with a curb,
    how should the front wheels be turned?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: A
  explanation: When parking downhill, turn your wheels toward the curb so that if
    the vehicle rolls, it will hit the curb and stop.
- id: 86
  category: safe_driving_rules
  question: In the CNMI, what must you do when a school bus is stopped with its red
    lights flashing and stop arm extended on a two-lane road?
  choices:
    A: Slow down and pass carefully
    B: Stop only if you are traveling in the same direction as the bus
    C: Stop from either direction until the lights stop flashing and the arm is retracted
    D: Honk your horn and proceed
  answer: C
  explanation: On a two-lane road in the CNMI, traffic in both directions must stop
    for a school bus with flashing red lights.
- id: 87
  category: safe_driving_rules
  question: According to CNMI law, who is required to wear a seat belt in a moving
    motor vehicle?
  choices:
    A: Only the driver
    B: Only the driver and front-seat passengers
    C: Only passengers under the age of 18
    D: The driver and all passengers, regardless of seating position
  answer: D
  explanation: CNMI law mandates that the driver and all passengers in a motor vehicle
    must be properly restrained by a seat belt or child restraint system.
- id: 88
  category: safe_driving_rules
  question: What is the maximum speed limit allowed on any highway in the CNMI, unless
    signs indicate otherwise?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: The maximum speed limit on CNMI highways is 45 miles per hour unless
    a lower limit is posted for safety.
- id: 89
  category: safe_driving_rules
  question: When you intend to turn, you must give a continuous signal for at least
    how many feet before turning?
  choices:
    A: 50 feet
    B: 75 feet
    C: 100 feet
    D: 200 feet
  answer: C
  explanation: CNMI law requires drivers to signal their intent to turn continuously
    for at least 100 feet before reaching the intersection or turn point.
- id: 90
  category: safe_driving_rules
  question: How many feet must you park away from a stop sign, flashing beacon, or
    traffic control signal located at the side of the roadway?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Drivers are prohibited from parking within 30 feet of any official
    flashing beacon, stop sign, or traffic control signal.
- id: 91
  category: safe_driving_rules
  question: When a school bus is stopped on a two-lane highway with its red lights
    flashing, who must stop?
  choices:
    A: Only traffic following the bus
    B: Only traffic approaching from the front
    C: Traffic from both directions
    D: No one is required to stop if there are no children visible
  answer: C
  explanation: On a two-lane road in the CNMI, drivers traveling in both directions
    must stop for a school bus with flashing red lights.
- id: 92
  category: safe_driving_rules
  question: For drivers 21 years of age or older, what is the legal Blood Alcohol
    Concentration (BAC) limit in the CNMI?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In the Northern Mariana Islands, it is illegal for an adult (21+) to
    operate a motor vehicle with a BAC of 0.08% or higher.
- id: 93
  category: safe_driving_rules
  question: In the CNMI, what is the primary purpose of a center lane marked with
    solid and broken yellow lines on both sides?
  choices:
    A: Passing slower traffic
    B: Emergency parking only
    C: Left turns only
    D: High-speed travel
  answer: C
  explanation: Center lanes marked this way are designated for left turns only and
    should not be used for passing or through travel.
- id: 94
  category: safe_driving_rules
  question: 'A U-turn is prohibited in the CNMI if your vehicle cannot be seen by
    other drivers approaching from either direction within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: U-turns are illegal on curves or hills where the vehicle cannot be
    seen by other drivers within 200 feet in either direction.
- id: 95
  category: safe_driving_rules
  question: When parking your vehicle parallel to a curb, it must be within how many
    inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: CNMI regulations require that a vehicle parked parallel to the curb
    must be within 12 inches of that curb.
- id: 96
  category: safe_driving_rules
  question: When an emergency vehicle with sirens and flashing lights approaches,
    what should you do?
  choices:
    A: Speed up to get out of the way
    B: Stop immediately in your lane
    C: Drive to the right-hand edge of the road and stop
    D: Follow the emergency vehicle closely
  answer: C
  explanation: Upon the approach of an emergency vehicle using audible or visual signals,
    drivers must yield the right-of-way by pulling to the right edge of the road and
    stopping.
- id: 97
  category: safe_driving_rules
  question: What is the correct hand signal to indicate that you are slowing down
    or stopping?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out
  answer: C
  explanation: The standard hand signal for slowing or stopping is the left arm and
    hand extended downward.
- id: 98
  category: safe_driving_rules
  question: In the CNMI, parking is prohibited within how many feet of a crosswalk
    at an intersection?
  choices:
    A: 10 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: B
  explanation: To maintain visibility for pedestrians and drivers, parking is prohibited
    within 20 feet of a crosswalk at an intersection.
- id: 99
  category: defensive_driving
  question: According to the CNMI Driver's Manual, how far ahead should you scan the
    road to identify potential hazards early?
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 25 seconds
    D: 30 to 40 seconds
  answer: B
  explanation: To be a safe driver in the CNMI, you should look ahead at least 10
    to 15 seconds. This allows you to see hazards before you reach them and gives
    you time to react.
- id: 100
  category: defensive_driving
  question: What is the recommended minimum following distance behind the vehicle
    in front of you under ideal driving conditions in the Northern Mariana Islands?
  choices:
    A: One car length
    B: Two seconds
    C: Four seconds
    D: 50 feet
  answer: B
  explanation: The CNMI Driver's Manual recommends the 'two-second rule' as a minimum
    following distance under ideal conditions to ensure you have enough time to stop
    if the vehicle ahead brakes suddenly.
- id: 101
  category: defensive_driving
  question: When following another vehicle at night in the Northern Mariana Islands,
    at what distance should you dim your high beams to low beams?
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: B
  explanation: You must dim your high beams when following another vehicle within
    300 feet so that your lights do not reflect in their rearview mirror and cause
    glare.
- id: 102
  category: defensive_driving
  question: At what speed can hydroplaning (tires losing contact with the road due
    to water) begin to occur in the CNMI?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Exactly 45 mph
    D: Only during typhoons
  answer: A
  explanation: Hydroplaning can occur at speeds as low as 35 mph when there is standing
    water on the road. In a heavy rainstorm, tires can lose all contact with the road
    at 55 mph.
- id: 103
  category: defensive_driving
  question: During a rain shower in the CNMI, when are the roads usually the most
    slippery?
  choices:
    A: After it has been raining for several hours
    B: Just after the rain stops
    C: During the first few minutes of the rain
    D: Only when the sun comes back out
  answer: C
  explanation: Roads are most slippery during the first few minutes of rain because
    the water mixes with oil and dust on the pavement that has not yet been washed
    away.
- id: 104
  category: defensive_driving
  question: When you want to change lanes, how should you check your 'blind spots'
    according to CNMI safety standards?
  choices:
    A: Check your rearview mirror only
    B: Check your side mirrors only
    C: Turn your head and look over your shoulder in the direction you plan to move
    D: Honk your horn and wait for other drivers to move
  answer: C
  explanation: Mirrors do not show everything. To properly check blind spots, you
    must turn your head and look over your shoulder before changing lanes.
- id: 105
  category: defensive_driving
  question: If you are driving in heavy fog or thick smoke in the CNMI, which lights
    should you use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: Use low beams in fog or smoke. High beams reflect off the moisture
    in the air or smoke particles, causing glare and making it harder for you to see.
- id: 106
  category: defensive_driving
  question: When stopped at an intersection, in which order should you scan for traffic
    before proceeding?
  choices:
    A: Right, Left, Right
    B: Left, Right, Left
    C: Straight ahead only
    D: Behind you only
  answer: B
  explanation: You should look left, then right, then left again. Looking left first
    is critical because vehicles coming from the left are closer to you.
- id: 107
  category: defensive_driving
  question: In the CNMI, what must you do when an emergency vehicle with flashing
    lights and a siren is approaching from any direction?
  choices:
    A: Speed up to get out of the way
    B: Stop exactly where you are
    C: Pull over to the right edge of the road and stop
    D: Pull over to the left edge of the road and stop
  answer: C
  explanation: Drivers must yield the right-of-way to emergency vehicles by pulling
    to the right-hand edge of the road and stopping until the vehicle has passed.
- id: 108
  category: defensive_driving
  question: If a vehicle is tailgating you (following too closely) on a CNMI road,
    what is the safest defensive driving tactic?
  choices:
    A: Brake hard to scare them
    B: Increase your following distance from the car in front of you
    C: Turn on your high beams
    D: Speed up significantly
  answer: B
  explanation: If being tailgated, you should increase the space in front of your
    vehicle. This gives you more time to react and allows you to brake more gradually,
    reducing the risk of being rear-ended.
- id: 109
  category: defensive_driving
  question: When driving on a wet road in the CNMI, how much should you increase your
    following distance to stay safe?
  choices:
    A: It should stay the same
    B: At least double the normal following distance
    C: By exactly 5 feet
    D: Decrease it so you can see the car ahead better
  answer: B
  explanation: Because wet roads increase the distance required to stop and decrease
    traction, you should at least double your following distance to maintain safety.
- id: 110
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning in CNMI traffic,
    how far ahead should you scan the road?
  choices:
    A: 5 seconds
    B: 10 to 15 seconds
    C: 25 seconds
    D: Only the car directly in front of you
  answer: B
  explanation: Defensive driving in the CNMI requires looking 10 to 15 seconds ahead
    to identify potential hazards before they require emergency action.
- id: 111
  category: defensive_driving
  question: In the Northern Mariana Islands, when are you legally required to have
    your headlights turned on?
  choices:
    A: Only when it is raining
    B: From one hour after sunset to one hour before sunrise
    C: From sunset to sunrise
    D: Only when street lights are off
  answer: C
  explanation: CNMI law requires drivers to use headlights from sunset to sunrise
    and at any other time when visibility is low.
- id: 112
  category: defensive_driving
  question: At what speed can hydroplaning (where tires lose contact with the road
    and ride on a thin film of water) begin in the CNMI?
  choices:
    A: At speeds as low as 35 mph
    B: Only at speeds above 55 mph
    C: Only during typhoons
    D: At speeds as low as 15 mph
  answer: A
  explanation: In wet conditions, hydroplaning can begin at speeds as low as 35 mph.
    In a heavy rainstorm, tires can lose all contact with the road at 55 mph.
- id: 113
  category: defensive_driving
  question: When it begins to rain in the CNMI, why are the roads most slippery during
    the first few minutes?
  choices:
    A: The water is colder than the asphalt
    B: Oil and grease on the road mix with the water
    C: Tires are still hot from dry driving
    D: The rain washes away the traction-enhancing dust
  answer: B
  explanation: The first few minutes of rain are the most dangerous because the water
    mixes with oil and grease on the road surface that has not yet been washed away.
- id: 114
  category: defensive_driving
  question: 'In the CNMI, you should dim your high beams when following another vehicle
    from behind within:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: B
  explanation: When following a vehicle from behind, you must dim your high beams
    within 300 feet to prevent glare in the lead driver's rearview mirror.
- id: 115
  category: defensive_driving
  question: 'To properly check your ''blind spot'' before changing lanes on a CNMI
    highway, you should:'
  choices:
    A: Check your rearview mirror only
    B: Check your side mirrors only
    C: Turn your head and look over your shoulder in the direction you plan to move
    D: Honk your horn to see if anyone is there
  answer: C
  explanation: Mirrors do not show everything; you must perform a shoulder check to
    see vehicles in your blind spots before changing lanes.
- id: 116
  category: defensive_driving
  question: If your vehicle begins to skid on a slippery road in the CNMI, what is
    the safest action to take?
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Ease your foot off the gas pedal and steer in the direction you want the front
      of the car to go
    D: Shift the car into neutral and turn off the engine
  answer: C
  explanation: To recover from a skid, you should stay off the brakes, ease off the
    accelerator, and steer in the direction you want the vehicle to go.
- id: 117
  category: defensive_driving
  question: 'If you are being tailgated by another driver while driving in the CNMI,
    you should:'
  choices:
    A: Brake suddenly to warn them
    B: Speed up to increase the gap
    C: Slow down gradually to encourage them to pass you
    D: Turn on your high beams
  answer: C
  explanation: If a tailgater is following too closely, the safest defensive move
    is to slow down gradually to provide more space in front of you and encourage
    the other driver to pass.
- id: 118
  category: defensive_driving
  question: When approaching an intersection in the CNMI, in what order should you
    scan for cross-traffic?
  choices:
    A: Right, then left
    B: Left, right, then left again
    C: Straight ahead only
    D: Right, left, then right again
  answer: B
  explanation: You should look left, then right, then left again because the vehicle
    coming from the left is closer to you and poses the more immediate danger.
- id: 119
  category: defensive_driving
  question: If you must drive through heavy fog in the CNMI, which light setting should
    you use?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: No lights, to avoid glare
  answer: B
  explanation: Low beams should be used in fog. High beams reflect off the fog droplets
    and actually decrease visibility for the driver.
- id: 120
  category: defensive_driving
  question: 'When driving in the CNMI, ''total stopping distance'' is the sum of:'
  choices:
    A: Braking distance and car length
    B: Reaction distance and braking distance
    C: Perception distance, reaction distance, and braking distance
    D: Speed and road friction
  answer: C
  explanation: Total stopping distance includes the time it takes to see the hazard
    (perception), the time to move your foot to the brake (reaction), and the time
    it takes for the car to stop (braking).
- id: 121
  category: alcohol_drugs_health
  question: 'In the Northern Mariana Islands, a person is legally considered to be
    driving under the influence (DUI) if their Blood Alcohol Concentration (BAC) is
    at or above:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: According to CNMI Vehicle Code (9 CMC § 7105), it is unlawful for any
    person who has a BAC of 0.08% or more to drive or be in actual physical control
    of a vehicle.
- id: 122
  category: alcohol_drugs_health
  question: What is the immediate penalty for refusing to submit to a chemical test
    for alcohol or drugs when requested by a law enforcement officer in the CNMI?
  choices:
    A: A verbal warning only
    B: A fine of $50
    C: The officer will seize your license and your driving privileges will be suspended
    D: There is no penalty if it is your first time being stopped
  answer: C
  explanation: Under CNMI law, if a driver refuses a chemical test, the officer shall
    seize the license and the person's driving privileges will be suspended, usually
    for a period of at least six months to one year depending on prior history.
- id: 123
  category: alcohol_drugs_health
  question: In the Northern Mariana Islands, it is illegal to possess an open container
    of an alcoholic beverage in which part of the vehicle?
  choices:
    A: Only the driver's side door pocket
    B: The trunk only
    C: The passenger compartment (any area normally occupied by the driver or passengers)
    D: The glove compartment only
  answer: C
  explanation: 9 CMC § 7109 prohibits the possession of an open container of alcohol
    in the passenger compartment of a motor vehicle while on a public highway.
- id: 124
  category: alcohol_drugs_health
  question: 'If you are convicted of a first-offense DUI in the CNMI, the court may
    impose a fine of:'
  choices:
    A: Not less than $100 and not more than $500
    B: Not less than $500 and not more than $1,000
    C: Exactly $2,500
    D: No fine, only community service
  answer: B
  explanation: For a first DUI conviction in the CNMI, the law prescribes a fine of
    not less than $500 and not more than $1,000, in addition to potential imprisonment
    and license suspension.
- id: 125
  category: alcohol_drugs_health
  question: Which of the following is true regarding prescription or over-the-counter
    drugs and driving in the CNMI?
  choices:
    A: They are always legal to use while driving because a doctor prescribed them
    B: They only affect driving if taken with alcohol
    C: It is illegal to drive under the influence of any drug that renders you incapable
      of safely operating a vehicle
    D: Only illegal narcotics are considered 'drugs' under DUI laws
  answer: C
  explanation: CNMI law (9 CMC § 7105) applies to any person under the influence of
    alcohol, any drug, or a combination of both that impairs their ability to drive
    safely, regardless of whether the drug is legal or prescribed.
- id: 126
  category: alcohol_drugs_health
  question: What is the minimum period of license revocation for a first-time DUI
    conviction in the CNMI?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 2 years
  answer: C
  explanation: A first-time DUI conviction in the CNMI typically results in a mandatory
    license revocation/suspension period of at least six months.
- id: 127
  category: alcohol_drugs_health
  question: If a driver is convicted of DUI while a person under the age of 16 was
    a passenger in the vehicle, what happens in the CNMI?
  choices:
    A: The driver receives a standard fine only
    B: The driver faces enhanced penalties and mandatory minimum jail time
    C: The driver is only charged with a seatbelt violation
    D: The driver's license is suspended for only 10 days
  answer: B
  explanation: Driving under the influence with a minor passenger is an aggravating
    factor in the CNMI that leads to increased fines and mandatory minimum imprisonment
    terms.
- id: 128
  category: alcohol_drugs_health
  question: What is the only effective way to reduce your Blood Alcohol Concentration
    (BAC) after drinking alcohol?
  choices:
    A: Drinking strong black coffee
    B: Taking a cold shower
    C: Exercising or running
    D: Allowing time for your body to process the alcohol
  answer: D
  explanation: Time is the only factor that can lower BAC. The liver processes alcohol
    at a constant rate, and coffee, showers, or exercise do not speed up this process.
- id: 129
  category: alcohol_drugs_health
  question: 'In the CNMI, if you are operating a commercial motor vehicle, you are
    considered legally intoxicated if your BAC is:'
  choices:
    A: 0.01% or higher
    B: 0.04% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: B
  explanation: In alignment with federal standards adopted in the CNMI, the BAC limit
    for commercial drivers is 0.04%.
- id: 130
  category: alcohol_drugs_health
  question: What effect does combining alcohol with another drug (synergistic effect)
    have on your driving ability?
  choices:
    A: The effects of the drug and alcohol cancel each other out
    B: The drug will reduce the effects of the alcohol
    C: The combination can multiply the effects of both, drastically increasing impairment
    D: There is no difference compared to drinking alcohol alone
  answer: C
  explanation: Mixing alcohol with other drugs (even over-the-counter ones) can create
    a synergistic effect where the combined impairment is much greater than the sum
    of the individual effects.
- id: 131
  category: alcohol_drugs_health
  question: 'If you are involved in a traffic accident in the CNMI that results in
    a fatality, and there is probable cause to believe you were driving under the
    influence:'
  choices:
    A: Testing is optional
    B: You can wait 24 hours before taking a BAC test
    C: A chemical test may be administered even without your consent
    D: You only have to take a vision test
  answer: C
  explanation: In cases involving death or serious bodily injury where DUI is suspected,
    CNMI law allows for mandatory chemical testing.
- id: 132
  category: alcohol_drugs_health
  question: Which of the following is a symptom of driving while fatigued, which can
    be as dangerous as driving under the influence?
  choices:
    A: Increased alertness
    B: Faster reaction times
    C: Difficulty focusing or heavy eyelids
    D: Improved peripheral vision
  answer: C
  explanation: Fatigue causes symptoms similar to alcohol impairment, including slow
    reaction times, poor judgment, and difficulty focusing on the road.
- id: 133
  category: alcohol_drugs_health
  question: 'If you have a medical condition (such as epilepsy or diabetes) that may
    affect your ability to drive safely, you must:'
  choices:
    A: Keep it a secret from the BMV
    B: Only drive at night
    C: Inform the Bureau of Motor Vehicles and provide medical clearance if requested
    D: Stop driving forever immediately without consulting a doctor
  answer: C
  explanation: Drivers in the CNMI are required to disclose physical or mental conditions
    that may impair their ability to operate a vehicle safely to the BMV during the
    licensing process.
- id: 134
  category: alcohol_drugs_health
  question: 'In the CNMI, a second DUI conviction within a five-year period results
    in a mandatory minimum jail sentence of:'
  choices:
    A: 48 hours
    B: 72 hours
    C: 10 days
    D: 30 days
  answer: B
  explanation: Under 9 CMC § 7105, a second DUI conviction within five years carries
    a mandatory minimum imprisonment of 72 hours.
- id: 135
  category: alcohol_drugs_health
  question: 'For a first-time DUI conviction in the Northern Mariana Islands, the
    court may impose a fine of:'
  choices:
    A: Not less than $100 and not more than $500
    B: Not less than $500 and not more than $1,000
    C: Exactly $2,000
    D: No fine is required for a first offense
  answer: B
  explanation: Under 9 CMC § 7105, a first-time DUI conviction carries a fine of not
    less than $500 and not more than $1,000, in addition to other potential penalties.
- id: 136
  category: alcohol_drugs_health
  question: 'If a driver in the CNMI is convicted of a first-offense DUI, their driving
    privileges will typically be suspended for a period of:'
  choices:
    A: 30 days
    B: 60 to 90 days
    C: 6 months to 1 year
    D: Permanently
  answer: C
  explanation: A first-time DUI conviction in the CNMI generally results in a mandatory
    license suspension ranging from 6 months to 1 year.
- id: 137
  category: alcohol_drugs_health
  question: For drivers of commercial motor vehicles in the CNMI, the maximum legal
    BAC limit is lower than for standard drivers. What is the limit for CDL holders?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.06%
  answer: C
  explanation: In accordance with federal and local regulations, the BAC limit for
    operators of commercial motor vehicles is 0.04%.
- id: 138
  category: alcohol_drugs_health
  question: What is the likely effect of taking a prescription drug and then consuming
    alcohol before driving?
  choices:
    A: The alcohol will cancel out the drug's effects
    B: The drug will make the alcohol less potent
    C: The combination can multiply the effects of both, severely impairing driving
      ability
    D: There is no effect if the drug is legally prescribed
  answer: C
  explanation: Combining alcohol with other drugs (even prescription or over-the-counter
    medications) can cause a synergistic effect, making the impairment much worse
    than either substance alone.
- id: 139
  category: alcohol_drugs_health
  question: 'In the CNMI, if you are convicted of a second DUI within a 10-year period,
    the mandatory minimum jail time is:'
  choices:
    A: 24 hours
    B: 48 hours
    C: 10 days
    D: 30 days
  answer: C
  explanation: For a second DUI conviction within a 10-year period in the CNMI, the
    law mandates a minimum imprisonment of not less than 10 days.
- id: 140
  category: alcohol_drugs_health
  question: Which of the following is the first faculty to be affected by the consumption
    of alcohol?
  choices:
    A: Vision
    B: Muscle coordination
    C: Judgment and decision-making
    D: Hearing
  answer: C
  explanation: Alcohol affects the brain's higher functions first, meaning judgment
    and the ability to make safe decisions are impaired before physical symptoms like
    blurred vision or loss of coordination appear.
- id: 141
  category: alcohol_drugs_health
  question: 'If you are taking a new medication and are unsure of its effects on your
    driving, you should:'
  choices:
    A: Drive only on side streets
    B: Consult your doctor or pharmacist before driving
    C: Wait 30 minutes after taking it and then drive if you feel fine
    D: Drink coffee to counteract any drowsiness
  answer: B
  explanation: It is the driver's responsibility to know the effects of any medication
    they take. Consulting a medical professional is the only safe way to determine
    if a drug will impair driving.
- id: 142
  category: alcohol_drugs_health
  question: 'In the CNMI, a person convicted of DUI who causes ''serious bodily injury''
    to another person faces:'
  choices:
    A: Only a standard traffic fine
    B: A mandatory minimum of 1 year in prison
    C: Enhanced penalties including longer imprisonment and higher fines
    D: Community service only
  answer: C
  explanation: DUI involving serious bodily injury or death carries significantly
    enhanced criminal penalties under the CNMI criminal code, beyond standard DUI
    charges.
- id: 143
  category: alcohol_drugs_health
  question: Which of the following can help 'sober up' a person who has been drinking
    alcohol?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising or running
    D: Only time
  answer: D
  explanation: The body can only process alcohol at a fixed rate (roughly one standard
    drink per hour). Coffee, showers, and exercise do not lower BAC or speed up the
    sobering process.
- id: 144
  category: alcohol_drugs_health
  question: 'If you are under 21 and are found to be operating a vehicle with any
    measurable amount of alcohol in your system (0.02% or higher), you are in violation
    of:'
  choices:
    A: The Implied Consent Law
    B: The Zero Tolerance Law
    C: The Right of Way Law
    D: The Basic Speed Law
  answer: B
  explanation: The Zero Tolerance Law applies to drivers under the legal drinking
    age of 21, making it illegal to drive with even a small amount of alcohol in the
    system.
- id: 145
  category: alcohol_drugs_health
  question: 'In the CNMI, if a driver is suspected of being under the influence of
    drugs rather than alcohol, a police officer:'
  choices:
    A: Cannot arrest them without a breathalyzer result
    B: Can request a blood or urine test to detect controlled substances
    C: Must release them if they pass a vision test
    D: Can only issue a ticket for reckless driving
  answer: B
  explanation: The Implied Consent law covers both alcohol and controlled substances.
    Officers can request chemical tests (blood/urine) if they have probable cause
    to believe a driver is impaired by drugs.
- id: 146
  category: penalties_and_points
  question: What is the maximum fine for a person found guilty of littering from a
    motor vehicle in the Northern Mariana Islands?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Under CNMI Public Law, littering is a serious offense, and the court
    may impose a fine of up to $1,000 for throwing trash from a vehicle.
- id: 147
  category: penalties_and_points
  question: If you are convicted of speeding 21 miles per hour or more over the posted
    speed limit in the CNMI, how many points will be added to your record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: D
  explanation: Speeding in excess of 21 mph over the limit is a high-point violation
    in the CNMI, resulting in 6 points being added to the driver's record.
- id: 148
  category: penalties_and_points
  question: For a first-time DUI conviction in the CNMI, for how long may your driving
    privileges be suspended?
  choices:
    A: 10 to 20 days
    B: 30 to 90 days
    C: 6 months to 1 year
    D: Permanently
  answer: B
  explanation: A first conviction for Driving Under the Influence (DUI) in the CNMI
    typically results in a license suspension ranging from 30 to 90 days, in addition
    to fines and potential jail time.
- id: 149
  category: penalties_and_points
  question: In the CNMI, what is the fine for a first-time violation of the mandatory
    seat belt law?
  choices:
    A: $25
    B: $75
    C: $150
    D: $200
  answer: A
  explanation: The CNMI seat belt law (9 CMC § 5806) mandates a fine of $25 for the
    first offense of failing to wear a seat belt.
- id: 150
  category: penalties_and_points
  question: How many points are added to your CNMI driving record for failing to stop
    for a school bus with its red lights flashing and stop arm extended?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Failing to stop for a school bus is a serious safety violation in the
    CNMI and results in 6 points being added to the driver's record.
- id: 151
  category: penalties_and_points
  question: Under CNMI Public Law 17-72, what is the fine for a first offense of using
    a mobile device to send a text message while driving?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: The CNMI prohibits texting while driving. A first-time violation of
    this law carries a fine of $100.
- id: 152
  category: penalties_and_points
  question: In the CNMI, how many points are assessed for the violation of 'Following
    too closely' (tailgating)?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Following another vehicle too closely is a traffic violation in the
    CNMI that results in 2 points on the driver's record.
- id: 153
  category: penalties_and_points
  question: A person convicted of driving a motor vehicle in the CNMI while their
    license is suspended or revoked may face which of the following penalties?
  choices:
    A: A fine of up to $100 only
    B: Imprisonment for up to 6 months and a fine
    C: A verbal warning for the first offense
    D: No penalty if they were driving to work
  answer: B
  explanation: Driving with a suspended or revoked license is a serious offense in
    the CNMI, punishable by a fine and potential imprisonment of up to 6 months (9
    CMC § 2202).
- id: 154
  category: penalties_and_points
  question: What is the fine for a first-time violation of the CNMI Child Restraint
    law (failing to secure a child in a proper car seat)?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: Failure to properly secure a child in an approved child restraint system
    in the CNMI results in a fine of $100 for the first offense.
- id: 155
  category: penalties_and_points
  question: How many points are assessed for making an 'Illegal Turn' in the Northern
    Mariana Islands?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Making an illegal turn (such as an improper U-turn or turning from
    the wrong lane) results in 2 points on your CNMI driving record.
- id: 156
  category: penalties_and_points
  question: In the CNMI, how many points are added to your record for 'Failure to
    yield the right of way'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Failing to yield the right of way to other vehicles or pedestrians
    is a 3-point violation in the CNMI.
- id: 157
  category: penalties_and_points
  question: 'If a person is caught driving while their license is suspended or revoked
    in the CNMI, they may face:'
  choices:
    A: A fine only
    B: A verbal warning
    C: Imprisonment and additional suspension
    D: No penalty if it is a first offense
  answer: C
  explanation: Driving with a suspended or revoked license is a serious criminal offense
    in the CNMI, punishable by fines, potential jail time, and an extension of the
    suspension period.
- id: 158
  category: penalties_and_points
  question: How many points are assessed for 'Illegal Passing' (passing where prohibited
    by signs or markings) in the CNMI?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Illegal passing is categorized as a 3-point violation in the CNMI point
    system.
- id: 159
  category: penalties_and_points
  question: In the CNMI, using a handheld electronic device (like a cell phone) to
    text while driving is prohibited. What is the fine for a first offense?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Under CNMI law, the use of a handheld electronic device while driving
    is illegal, and a first offense typically results in a $100 fine.
- id: 160
  category: penalties_and_points
  question: How many points are added to your record for 'Failure to stop for a Stop
    Sign' or 'Disregarding a Traffic Signal' in the CNMI?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 6 points
  answer: C
  explanation: Disregarding traffic control devices, such as stop signs or red lights,
    results in 3 points on a CNMI driver's record.
- id: 161
  category: sharing_the_road
  question: When an emergency vehicle (such as a police car or ambulance) is approaching
    with its siren and flashing lights on, what is the driver of a vehicle required
    to do in the CNMI?
  choices:
    A: Speed up to get out of the way
    B: Stop immediately in the middle of the lane
    C: Yield the right-of-way and immediately drive to a position parallel to, and
      as close as possible to, the right-hand edge or curb and stop
    D: Follow the emergency vehicle to get through traffic faster
  answer: C
  explanation: CNMI law requires drivers to pull over to the right-hand edge of the
    road and stop until the emergency vehicle has passed.
- id: 162
  category: sharing_the_road
  question: 'In the CNMI, it is illegal to follow an emergency vehicle responding
    to an alarm closer than:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: Under CNMI Title 9, Section 5209, it is unlawful for the driver of
    any vehicle other than one on official business to follow any fire apparatus traveling
    in response to a fire alarm closer than 500 feet.
- id: 163
  category: sharing_the_road
  question: When sharing the road with a bicyclist in the Northern Mariana Islands,
    how much space should you ideally maintain between your vehicle and the bicycle?
  choices:
    A: At least 1 foot
    B: At least 3 feet
    C: At least 5 feet
    D: At least 10 feet
  answer: B
  explanation: While specific '3-foot laws' are common across US jurisdictions including
    the CNMI, it is the standard safe passing distance recommended to avoid clipping
    a cyclist with a side-view mirror.
- id: 164
  category: sharing_the_road
  question: According to CNMI law, who is required to wear a protective helmet when
    operating or riding as a passenger on a motorcycle?
  choices:
    A: Only riders under the age of 18
    B: Only the operator of the motorcycle
    C: All operators and passengers, regardless of age
    D: Only those with less than one year of riding experience
  answer: C
  explanation: The Northern Mariana Islands requires all motorcycle operators and
    passengers to wear a safety helmet that meets approved standards.
- id: 165
  category: sharing_the_road
  question: When a pedestrian is crossing the street within a marked or unmarked crosswalk
    at an intersection in the CNMI, who has the right-of-way?
  choices:
    A: The driver of the vehicle
    B: The pedestrian
    C: Whoever arrived at the intersection first
    D: The vehicle, if it is traveling at the speed limit
  answer: B
  explanation: CNMI law requires drivers to yield the right-of-way to pedestrians
    crossing the roadway within any marked crosswalk or within any unmarked crosswalk
    at an intersection.
- id: 166
  category: sharing_the_road
  question: Large commercial trucks have 'No-Zones.' What are these?
  choices:
    A: Areas where trucks are not allowed to drive
    B: Speed-restricted zones for heavy vehicles
    C: Blind spots around the front, rear, and sides of the truck where the driver
      cannot see other vehicles
    D: Designated parking areas for freight loading
  answer: C
  explanation: No-Zones are large blind spots around trucks. If you are driving in
    these areas, the truck driver cannot see you, significantly increasing the risk
    of a collision.
- id: 167
  category: sharing_the_road
  question: 'In the CNMI, bicyclists are required by law to:'
  choices:
    A: Ride on the sidewalk at all times
    B: Ride against the flow of traffic so they can see cars
    C: Ride with the flow of traffic and obey the same rules as motor vehicles
    D: Only ride on designated bike paths
  answer: C
  explanation: Bicyclists in the CNMI have the same rights and responsibilities as
    motor vehicle drivers and must ride in the same direction as traffic.
- id: 168
  category: sharing_the_road
  question: 'If you see a pedestrian using a white cane or a guide dog at an intersection,
    you must:'
  choices:
    A: Honk your horn to let them know you are there
    B: Slow down and proceed if they are not in your lane
    C: Stop and yield the right-of-way to the pedestrian
    D: Drive around them quickly
  answer: C
  explanation: Pedestrians who are blind or visually impaired always have the right-of-way.
    You must come to a complete stop to ensure their safety.
- id: 169
  category: sharing_the_road
  question: Why should you never pull up directly alongside a large truck that is
    signaling a right turn at an intersection?
  choices:
    A: The truck might speed up suddenly
    B: Large trucks often need to swing wide to the left to complete a right turn,
      and they could crush your vehicle
    C: Trucks are legally required to turn from the left lane
    D: The air turbulence from the truck will push your car into the curb
  answer: B
  explanation: Large vehicles require more space to turn. They often swing wide to
    the left before turning right; if you try to pass on the right, you may be caught
    between the truck and the curb.
- id: 170
  category: sharing_the_road
  question: 'In the CNMI, if a pedestrian is walking along a road where there are
    no sidewalks, they should walk:'
  choices:
    A: On the right side, with the flow of traffic
    B: On the left side, facing oncoming traffic
    C: In the middle of the road
    D: On whichever side has more shade
  answer: B
  explanation: For safety, pedestrians should walk facing traffic when no sidewalk
    is available so they can see approaching vehicles and take evasive action if necessary.
- id: 171
  category: sharing_the_road
  question: When riding a bicycle at night in the CNMI, what equipment is legally
    required?
  choices:
    A: A bell and a basket
    B: A white light on the front and a red reflector or red light on the rear
    C: A yellow vest and a helmet light
    D: Reflective tape on the pedals only
  answer: B
  explanation: To be visible to motorists at night, CNMI law requires bicycles to
    be equipped with a front white light and a rear red reflector or light.
- id: 172
  category: sharing_the_road
  question: Is 'lane splitting' (a motorcycle driving between two lanes of stopped
    or moving traffic) legal in the Northern Mariana Islands?
  choices:
    A: Yes, it is encouraged to reduce traffic congestion
    B: Yes, but only if the traffic is moving slower than 15 mph
    C: No, it is illegal and dangerous
    D: No, unless the motorcycle is an emergency vehicle
  answer: C
  explanation: Lane splitting is not permitted in the CNMI. Motorcycles must occupy
    a full lane and follow the same lane-usage rules as cars.
- id: 173
  category: sharing_the_road
  question: 'When following a large truck or bus, you should increase your following
    distance because:'
  choices:
    A: It allows you to see around the vehicle and gives the driver more room to stop
    B: Trucks are required to stop at all intersections
    C: It prevents the truck from rolling backward on hills
    D: Large vehicles always travel 10 mph below the speed limit
  answer: A
  explanation: Increasing your following distance behind large vehicles improves your
    field of vision and gives you more time to react if the truck stops suddenly.
- id: 174
  category: sharing_the_road
  question: In the CNMI, what is the maximum fine for a first-time offense of illegally
    passing a stopped school bus?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Under CNMI law, the penalty for failing to stop for a school bus can
    result in a fine of up to $500 for the first offense.
- id: 175
  category: sharing_the_road
  question: Which of the following is true regarding motorcycle riders in the Northern
    Mariana Islands?
  choices:
    A: Helmets are only required for riders under 18.
    B: Helmets are optional if the rider has 5 years of experience.
    C: All operators and passengers must wear a safety helmet securely fastened.
    D: Helmets are only required on highways with speed limits over 35 mph.
  answer: C
  explanation: CNMI law mandates that every person operating or riding upon a motorcycle
    must wear a safety helmet of a type approved by the Commissioner.
- id: 176
  category: sharing_the_road
  question: 'When sharing the road with a bicycle in the CNMI, a motorist should:'
  choices:
    A: Yield the right-of-way to the bicycle as you would to any other vehicle.
    B: Force the bicycle off the road if it is moving slowly.
    C: Honk continuously until the cyclist moves to the sidewalk.
    D: Assume the bicycle will always stop at green lights.
  answer: A
  explanation: Bicycles are generally treated as vehicles under CNMI law; motorists
    must yield the right-of-way and treat them with the same respect as motor vehicles.
- id: 177
  category: sharing_the_road
  question: Large trucks have 'No-Zones.' What does this term refer to?
  choices:
    A: Areas where trucks are not allowed to drive.
    B: The blind spots around a truck where the driver cannot see other vehicles.
    C: The speed-restricted zones for heavy vehicles.
    D: The cargo area of the truck.
  answer: B
  explanation: No-Zones are large blind spots around trucks (front, back, and sides)
    where cars disappear from the truck driver's view, increasing the risk of a collision.
- id: 178
  category: sharing_the_road
  question: What is the minimum distance you must maintain when following an emergency
    vehicle that is responding to a call in the CNMI?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: It is illegal to follow any fire apparatus traveling in response to
    a fire alarm closer than 500 feet or to drive into or park within the block where
    the fire apparatus has stopped.
- id: 179
  category: sharing_the_road
  question: Under CNMI law, is 'lane splitting' (a motorcycle riding between rows
    of stopped or moving cars) legal?
  choices:
    A: Yes, it is encouraged to reduce traffic.
    B: Yes, but only at speeds under 15 mph.
    C: No, it is illegal and dangerous.
    D: Yes, but only during daylight hours.
  answer: C
  explanation: Motorcycles are entitled to the full use of a lane, and lane splitting
    (filtering between lanes of traffic) is not permitted.
- id: 180
  category: sharing_the_road
  question: 'When a bicycle is operated at night in the CNMI, it must be equipped
    with a lamp on the front that emits a white light visible from at least:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: For safety, CNMI regulations require bicycles used at night to have
    a front lamp visible from 500 feet and a red reflector on the rear.
- id: 181
  category: sharing_the_road
  question: Why should a driver be extra cautious when a large truck is making a right
    turn at an intersection?
  choices:
    A: Trucks always turn from the left lane.
    B: Trucks often need to swing wide to the left to clear the curb.
    C: Trucks are required to stop completely before turning right.
    D: Trucks have a higher speed limit when turning.
  answer: B
  explanation: Large vehicles need more room to maneuver; they often swing wide to
    the left to make a right turn. Drivers should never try to squeeze between the
    truck and the curb.
- id: 182
  category: sharing_the_road
  question: 'In the CNMI, if you are walking along a highway that does not have a
    sidewalk, you should walk:'
  choices:
    A: On the right side, with the flow of traffic.
    B: On the left side, facing oncoming traffic.
    C: In the middle of the road.
    D: Only at night.
  answer: B
  explanation: Pedestrians walking on a roadway without sidewalks must walk on the
    left side of the road facing traffic so they can see approaching vehicles.
- id: 183
  category: sharing_the_road
  question: When a school bus is stopped on a four-lane highway divided by a median
    strip in the CNMI, do drivers on the opposite side of the median need to stop?
  choices:
    A: Yes, everyone must stop.
    B: No, drivers on the opposite side of a divided highway do not need to stop.
    C: Yes, but only if children are crossing the median.
    D: Only if the speed limit is over 35 mph.
  answer: B
  explanation: On a divided highway with a physical barrier or median, traffic moving
    in the opposite direction of a stopped school bus is generally not required to
    stop, though caution is still advised.
- id: 184
  category: sharing_the_road
  question: 'When you see a stationary emergency vehicle with its lights flashing
    on the side of the road, you should:'
  choices:
    A: Maintain your speed and stay in your lane.
    B: Slow down and, if safe to do so, move over to a lane not adjacent to the vehicle.
    C: Stop immediately in the roadway to see if they need help.
    D: Turn on your high beams to alert other drivers.
  answer: B
  explanation: Commonly known as the 'Move Over' rule, drivers should slow down and
    change lanes if possible to provide a safety buffer for emergency responders on
    the shoulder.
- id: 185
  category: vehicle_information
  question: 'According to the CNMI Driver''s Manual, your vehicle''s headlights must
    be turned on during the period from sunset to sunrise and whenever visibility
    is less than:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: B
  explanation: In the Northern Mariana Islands, headlights must be used from sunset
    to sunrise and at any time when visibility is less than 500 feet due to weather
    or other conditions.
- id: 186
  category: vehicle_information
  question: 'Every motor vehicle operated on CNMI highways must be equipped with a
    horn that can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: CNMI vehicle equipment regulations state that a horn must be audible
    under normal conditions from a distance of not less than 200 feet.
- id: 187
  category: vehicle_information
  question: 'Under CNMI law, all motor vehicles must have a braking system that includes:'
  choices:
    A: Only a foot brake
    B: Only a hand-operated emergency brake
    C: Two separate means of applying the brakes (service brake and parking brake)
    D: An automatic braking system (ABS)
  answer: C
  explanation: 'Vehicles must be equipped with two separate ways to apply brakes:
    a service brake (foot brake) for regular stopping and a parking/emergency brake.'
- id: 188
  category: vehicle_information
  question: What is the minimum legal tire tread depth for a passenger vehicle to
    pass safety inspection in the CNMI?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires are considered unsafe and will fail inspection if the tread is
    worn down to less than 2/32 of an inch.
- id: 189
  category: vehicle_information
  question: Regarding vehicle exhaust systems in the CNMI, which of the following
    is ILLEGAL?
  choices:
    A: A muffler in good working order
    B: An exhaust system that prevents excessive smoke
    C: A muffler cutout, bypass, or similar device
    D: A tailpipe extending to the rear of the vehicle
  answer: C
  explanation: CNMI law prohibits the use of muffler cutouts, bypasses, or any device
    that increases noise or allows exhaust to bypass the muffler.
- id: 190
  category: vehicle_information
  question: 'In the CNMI, your vehicle must have at least one rearview mirror that
    allows you to see the highway to the rear for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: The rearview mirror must be positioned to provide the driver with a
    clear view of the road for at least 200 feet to the rear of the vehicle.
- id: 191
  category: vehicle_information
  question: How often must a privately owned motor vehicle undergo a safety inspection
    at an authorized CNMI inspection station?
  choices:
    A: Every 6 months
    B: Once every year
    C: Once every two years
    D: Only when the vehicle is sold
  answer: B
  explanation: In the CNMI, vehicles must pass a safety inspection annually (once
    a year) as a requirement for registration renewal.
- id: 192
  category: vehicle_information
  question: 'According to CNMI window tinting regulations, no tinting material may
    be applied to the windshield EXCEPT:'
  choices:
    A: The entire windshield may be tinted up to 35%
    B: Only the bottom 4 inches of the windshield
    C: Above the AS-1 line or the top 4 inches of the windshield
    D: No tint is allowed on any part of the windshield
  answer: C
  explanation: CNMI law allows tinting only on the uppermost portion of the windshield,
    specifically above the manufacturer's AS-1 line or the top 4 inches.
- id: 193
  category: vehicle_information
  question: 'The rear license plate on a vehicle in the CNMI must be illuminated by
    a white light so that it is clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Vehicles must have a lamp that illuminates the rear license plate with
    a white light, making it visible from a distance of 50 feet.
- id: 194
  category: vehicle_information
  question: If you are carrying a load that extends more than 4 feet beyond the rear
    of your vehicle bed, what must be attached to the end of the load during the day?
  choices:
    A: A white cloth
    B: A red flag at least 12 inches square
    C: A yellow warning sign
    D: Nothing is required during daylight
  answer: B
  explanation: For loads extending more than 4 feet beyond the rear of the vehicle,
    a red flag (at least 12x12 inches) must be displayed during the day, and a red
    light must be used at night.
- id: 195
  category: vehicle_information
  question: In the CNMI, what equipment is required if a vehicle's load or body obstructs
    the driver's view to the rear through the inside mirror?
  choices:
    A: The driver must use a spotter
    B: The driver must keep the windows down
    C: An outside mirror on the left side and right side of the vehicle
    D: A rear-facing camera system
  answer: C
  explanation: If the interior rearview mirror's view is obstructed, the vehicle must
    be equipped with side mirrors on both the left and right sides to ensure the driver
    can see the road to the rear.
- id: 196
  category: vehicle_information
  question: 'In the Northern Mariana Islands, every motor vehicle must be equipped
    with a horn that is audible under normal conditions from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: According to CNMI vehicle equipment standards, a motor vehicle must
    have a horn audible from a distance of not less than 200 feet.
- id: 197
  category: vehicle_information
  question: 'In the CNMI, you must dim your high-beam headlights when following another
    vehicle within a distance of:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: To avoid reflecting glare into the rearview mirror of the driver ahead,
    you must switch to low beams when following within 300 feet.
- id: 198
  category: vehicle_information
  question: Every motor vehicle operated on CNMI highways must be equipped with which
    of the following braking systems?
  choices:
    A: Only a foot brake (service brake)
    B: Only a parking brake
    C: Both a service brake and a parking brake
    D: An emergency drag chute
  answer: C
  explanation: 'CNMI law requires two separate means of applying brakes: a service
    brake (foot brake) and a parking brake, each effective on at least two wheels.'
- id: 199
  category: vehicle_information
  question: 'In the Northern Mariana Islands, a vehicle''s rearview mirror must be
    adjusted to provide a view of the highway for a distance of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: The driver's manual and vehicle code specify that mirrors must reflect
    a view of the highway for at least 200 feet to the rear of the vehicle.
- id: 200
  category: vehicle_information
  question: 'In the CNMI, it is illegal to drive a vehicle if the windshield is:'
  choices:
    A: Equipped with wipers
    B: Made of safety glass
    C: Covered with any sign or poster that obstructs the driver's clear view
    D: Clean and clear
  answer: C
  explanation: CNMI law prohibits placing any sign, poster, or non-transparent material
    on the windshield that obstructs the driver's view of the highway.
- id: 201
  category: vehicle_information
  question: Under CNMI law, every motor vehicle must be equipped with at least how
    many tail lamps emitting a red light visible from 500 feet?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: A
  explanation: While most modern cars have two, CNMI law (9 CMC § 5202) requires every
    motor vehicle to carry at least one tail lamp on the rear that emits a red light
    visible from 500 feet.
- id: 202
  category: vehicle_information
  question: In the CNMI, turn signal lamps must be visible from a distance of not
    less than ___ feet in normal sunlight.
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Turn signal lamps in the CNMI must be visible from a distance of 100
    feet both to the front and the rear in normal sunlight.
- id: 203
  category: vehicle_information
  question: According to CNMI window tinting regulations, what is the minimum percentage
    of light transmission required for the front side windows?
  choices:
    A: 20%
    B: 35%
    C: 70%
    D: 90%
  answer: C
  explanation: CNMI law generally follows safety standards requiring at least 70%
    light transmission for the windshield and front side windows to ensure driver
    visibility.
- id: 204
  category: vehicle_information
  question: If your vehicle's turn signals are not working, you must use hand signals.
    What is the correct hand signal for a right turn in the CNMI?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    upward at a 90-degree angle.
- id: 205
  category: vehicle_information
  question: 'In the CNMI, a vehicle''s exhaust system must be maintained to prevent
    the escape of:'
  choices:
    A: Any sound at all
    B: Excessive smoke or fumes
    C: Heat
    D: Water vapor
  answer: B
  explanation: CNMI law requires the engine and power mechanism of every motor vehicle
    to be equipped and adjusted to prevent the escape of excessive fumes or smoke.
- id: 206
  category: signs_and_signals
  question: In the Northern Mariana Islands, what does a flashing red traffic light
    signify?
  choices:
    A: Slow down and proceed with caution
    B: The light is about to change to green
    C: Stop completely and proceed only when it is safe to do so
    D: Yield to all traffic coming from the right only
  answer: C
  explanation: 'According to the CNMI Driver''s Manual, a flashing red light means
    the same as a stop sign: you must come to a complete stop and proceed only when
    the way is clear.'
- id: 207
  category: signs_and_signals
  question: When a driver in the CNMI extends their left arm out the window and points
    it straight down, what signal are they giving?
  choices:
    A: Making a left turn
    B: Making a right turn
    C: Slowing down or stopping
    D: Allowing others to pass
  answer: C
  explanation: The standard hand signal for slowing down or stopping is the left arm
    extended downward with the palm facing the rear.
- id: 208
  category: signs_and_signals
  question: What does a double solid yellow line in the center of a CNMI roadway indicate?
  choices:
    A: Passing is permitted if the way is clear
    B: Passing is prohibited in both directions
    C: Passing is permitted only during daylight hours
    D: The road is one-way only
  answer: B
  explanation: Double solid yellow lines indicate that passing is prohibited for traffic
    moving in both directions.
- id: 209
  category: signs_and_signals
  question: 'A pennant-shaped sign (isosceles triangle pointing right) found on the
    left side of the road in the CNMI signifies:'
  choices:
    A: A school zone ahead
    B: A yield requirement
    C: A no passing zone
    D: A dead end
  answer: C
  explanation: The pennant-shaped sign is used specifically to mark the beginning
    of a 'No Passing Zone'.
- id: 210
  category: signs_and_signals
  question: In the CNMI, what should you do when approaching a flashing yellow traffic
    signal?
  choices:
    A: Stop and wait for a green light
    B: Speed up to clear the intersection quickly
    C: Slow down and proceed with caution
    D: Treat it as a four-way stop
  answer: C
  explanation: A flashing yellow light is a warning to slow down and be especially
    alert as you proceed through the intersection.
- id: 211
  category: signs_and_signals
  question: What is the meaning of a solid white line painted across a lane at an
    intersection in the CNMI?
  choices:
    A: It marks the edge of the highway
    B: It is a stop line, indicating where to stop for a sign or signal
    C: It indicates a pedestrian-only zone
    D: It means you must turn right
  answer: B
  explanation: A solid white line across a lane is a stop line. Drivers must stop
    behind this line at stop signs or red lights.
- id: 212
  category: signs_and_signals
  question: 'In the CNMI, a circular sign with a red border and a white horizontal
    line in the center means:'
  choices:
    A: Yield to oncoming traffic
    B: No Parking
    C: Do Not Enter
    D: One Way Street
  answer: C
  explanation: The 'Do Not Enter' sign is a square with a red circle and a white horizontal
    bar, used to prevent drivers from entering a road in the wrong direction.
- id: 213
  category: signs_and_signals
  question: Under CNMI traffic laws, are you permitted to turn right on a red light?
  choices:
    A: No, you must wait for a green light
    B: Yes, but only between the hours of 10:00 PM and 5:00 AM
    C: Yes, after coming to a complete stop and yielding to pedestrians and traffic,
      unless a sign prohibits it
    D: Yes, but only if there are no other cars at the intersection
  answer: C
  explanation: In the CNMI, right turns on red are permitted after a full stop and
    yielding, provided there is no sign stating 'No Right Turn on Red'.
- id: 214
  category: signs_and_signals
  question: What does a broken white line on a CNMI highway signify?
  choices:
    A: Traffic is moving in opposite directions; no passing
    B: Traffic is moving in the same direction; lane changing is permitted
    C: The edge of the roadway
    D: A dedicated bicycle lane
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction
    and indicate that you may change lanes if it is safe to do so.
- id: 215
  category: signs_and_signals
  question: 'A five-sided (pentagon) yellow or fluorescent yellow-green sign indicates:'
  choices:
    A: A construction zone
    B: A railroad crossing
    C: A school zone or school crossing
    D: A hospital nearby
  answer: C
  explanation: The pentagon shape is reserved exclusively for school-related warnings,
    such as school zones or school crossings.
- id: 216
  category: signs_and_signals
  question: In the CNMI, what does a steady yellow traffic light indicate?
  choices:
    A: Speed up to beat the red light
    B: The signal is changing to red; clear the intersection or stop if safe
    C: You have the right of way over turning traffic
    D: The light is broken; treat it as a stop sign
  answer: B
  explanation: A steady yellow light means the signal is about to turn red. You should
    stop if you can do so safely; otherwise, clear the intersection.
- id: 217
  category: signs_and_signals
  question: What is the primary purpose of a white diamond symbol painted on a lane
    in the CNMI?
  choices:
    A: It marks a high-occupancy vehicle (HOV) or restricted lane
    B: It indicates a pedestrian crossing
    C: It marks the location of a fire hydrant
    D: It indicates a sharp curve ahead
  answer: A
  explanation: The diamond symbol on the pavement is used to designate lanes reserved
    for specific vehicles, such as buses or carpools (HOV).
- id: 218
  category: signs_and_signals
  question: When you see a sign showing a red circle with a diagonal slash over a
    symbol, what does it mean in the CNMI?
  choices:
    A: The action shown is recommended
    B: The action shown is prohibited
    C: The action shown is only for trucks
    D: The action shown is permitted after stopping
  answer: B
  explanation: A red circle with a diagonal slash is a standard regulatory symbol
    meaning 'No' or 'Prohibited' for the action depicted (e.g., No U-Turn).
- id: 219
  category: signs_and_signals
  question: If a CNMI traffic signal is dark (not working due to a power outage),
    how must you treat the intersection?
  choices:
    A: As a free-for-all; proceed at your own risk
    B: Yield to traffic on the main road only
    C: As an all-way stop (four-way stop)
    D: Maintain speed and honk to warn others
  answer: C
  explanation: When traffic signals are not operating, the intersection should be
    treated as a four-way stop, where drivers yield to those who arrived first or
    to the vehicle on the right.
- id: 220
  category: signs_and_signals
  question: 'A flashing yellow light at an intersection in the Northern Mariana Islands
    means you should:'
  choices:
    A: Stop and wait for a green light
    B: Speed up to clear the intersection
    C: Slow down and proceed with caution
    D: Treat it as a four-way stop
  answer: C
  explanation: A flashing yellow light is a warning to slow down, be alert, and proceed
    through the intersection with caution.
- id: 221
  category: signs_and_signals
  question: Which sign shape is exclusively used for 'Yield' signs in the Northern
    Mariana Islands?
  choices:
    A: Octagon
    B: Diamond
    C: Inverted Triangle
    D: Pennant
  answer: C
  explanation: The yield sign is a three-sided equilateral triangle with the apex
    pointing downward.
- id: 222
  category: signs_and_signals
  question: When you see a 'No Passing Zone' sign on a CNMI highway, what shape is
    it?
  choices:
    A: Round
    B: Square
    C: Pennant (sideways triangle)
    D: Diamond
  answer: C
  explanation: A pennant-shaped sign is placed on the left side of the road to warn
    drivers that they are entering a no-passing zone.
- id: 223
  category: signs_and_signals
  question: In the CNMI, a driver extending their left arm straight out the window
    is signaling which of the following?
  choices:
    A: A right turn
    B: A left turn
    C: A stop
    D: A need for assistance
  answer: B
  explanation: The standard hand signal for a left turn is the left arm extended straight
    out the window.
- id: 224
  category: signs_and_signals
  question: What is the meaning of a broken (dashed) white line on a CNMI multi-lane
    highway?
  choices:
    A: Traffic is moving in opposite directions; passing is allowed
    B: Traffic is moving in the same direction; lane changes are permitted
    C: The edge of the roadway
    D: An upcoming construction zone
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction,
    indicating that you may cross the lines to change lanes when safe.
- id: 225
  category: signs_and_signals
  question: What does a diamond-shaped sign usually indicate in the Northern Mariana
    Islands?
  choices:
    A: Regulatory information (like speed limits)
    B: Warning or caution about upcoming road conditions
    C: Public recreation and scenic guidance
    D: Stop or Yield instructions
  answer: B
  explanation: Diamond-shaped signs are used as warning signs to alert drivers to
    hazards or changes in the road ahead.
- id: 226
  category: signs_and_signals
  question: In the CNMI, what color are the markings used to indicate a fire hydrant
    zone where parking is prohibited?
  choices:
    A: Blue
    B: Green
    C: Red
    D: White
  answer: C
  explanation: Red curb markings or red paint on the road typically indicate 'No Parking'
    zones, which include areas near fire hydrants.
- id: 227
  category: signs_and_signals
  question: 'A circular yellow sign with a black ''X'' and the letters ''RR'' warns
    CNMI drivers of:'
  choices:
    A: A road repair zone
    B: A railroad crossing ahead
    C: A rest road area
    D: A rough road surface
  answer: B
  explanation: The round yellow sign with a black 'X' and 'RR' is the standard advance
    warning sign for a railroad crossing.
