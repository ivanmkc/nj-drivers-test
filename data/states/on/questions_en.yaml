metadata:
  source: Official MTO Driver Handbook
  total_questions: 219
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Ontario, a G1 driver must be accompanied by a fully licensed driver
    who has at least how many years of driving experience?
  choices:
    A: 2 years
    B: 3 years
    C: 4 years
    D: 5 years
  answer: C
  explanation: According to the Ontario Ministry of Transportation, the accompanying
    driver must have a valid Class G (or higher) license and at least four years of
    driving experience.
- id: 2
  category: license_system
  question: Under the Ontario Graduated Licensing System, what is the Blood Alcohol
    Concentration (BAC) limit for G1 and G2 drivers?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: Novice drivers (G1, G2, M1, M2) and all drivers age 21 and under must
    have a blood alcohol level of zero when driving.
- id: 3
  category: license_system
  question: A G1 driver is restricted from driving between which hours?
  choices:
    A: 11:00 PM to 4:00 AM
    B: 12:00 AM to 5:00 AM
    C: 1:00 AM to 6:00 AM
    D: 9:00 PM to 6:00 AM
  answer: B
  explanation: G1 drivers are prohibited from driving between midnight (12:00 AM)
    and 5:00 AM.
- id: 4
  category: license_system
  question: If you change your name or address, you must notify the Ministry of Transportation
    within how many days?
  choices:
    A: 6 days
    B: 10 days
    C: 14 days
    D: 30 days
  answer: A
  explanation: Ontario law requires you to notify the Ministry of Transportation of
    any change in name or address within six days of the change.
- id: 5
  category: license_system
  question: A G2 driver aged 19 or under, driving between midnight and 5:00 AM, is
    limited to how many passengers aged 19 or under for the first six months of having
    their license?
  choices:
    A: Zero passengers
    B: One passenger
    C: Two passengers
    D: Three passengers
  answer: B
  explanation: For the first six months, G2 drivers aged 19 or under can carry only
    one passenger aged 19 or under between midnight and 5:00 AM. After six months,
    the limit increases to three passengers.
- id: 6
  category: license_system
  question: What is the minimum age to apply for a G1 driver's license in Ontario?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: C
  explanation: You must be at least 16 years old to apply for a Level 1 (G1) learner's
    permit in Ontario.
- id: 7
  category: license_system
  question: 'If a G1 driver successfully completes a government-approved beginner
    driver education course, the mandatory waiting period before the G1 road test
    is reduced from 12 months to:'
  choices:
    A: 4 months
    B: 6 months
    C: 8 months
    D: 10 months
  answer: C
  explanation: Completing an approved driver education course reduces the G1 waiting
    period from 12 months to 8 months.
- id: 8
  category: license_system
  question: For a novice driver (G1 or G2), how many demerit points will lead to a
    60-day license suspension?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: B
  explanation: Novice drivers face a 60-day license suspension if they accumulate
    9 or more demerit points.
- id: 9
  category: license_system
  question: 'The accompanying driver for a G1 holder must have a Blood Alcohol Concentration
    (BAC) of less than:'
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: C
  explanation: The accompanying driver must have a BAC of less than 0.05% if they
    are 22 or older. If the accompanying driver is 21 or under, their BAC must be
    zero.
- id: 10
  category: license_system
  question: Which of the following highways is a G1 driver generally NOT permitted
    to drive on unless accompanied by a licensed driving instructor?
  choices:
    A: Highway 7
    B: Highway 401
    C: Highway 17
    D: Any gravel road
  answer: B
  explanation: G1 drivers are prohibited from driving on 400-series highways (like
    the 401, 400, 404, etc.) and high-speed expressways like the QEW or Don Valley
    Parkway, unless with a certified instructor.
- id: 11
  category: license_system
  question: In Ontario, what is the 'Escalating Sanction' for a first-time G1 or G2
    driver convicted of violating graduated licensing conditions?
  choices:
    A: A warning letter
    B: A 30-day license suspension
    C: A 90-day license suspension
    D: Permanent license cancellation
  answer: B
  explanation: For novice drivers, the first conviction for violating GDL conditions
    (e.g., BAC, night driving, passenger limits) results in a 30-day license suspension.
- id: 12
  category: license_system
  question: A fully licensed (Class G) driver will have their license suspended for
    30 days if they accumulate how many demerit points?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: D
  explanation: Fully licensed drivers face a 30-day suspension if they reach 15 demerit
    points.
- id: 13
  category: license_system
  question: When a person moves to Ontario from another province or country, they
    must register their vehicle within how many days?
  choices:
    A: 14 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents of Ontario must register their motor vehicle within 30
    days of moving to the province.
- id: 14
  category: license_system
  question: How long is a Class G driver's license typically valid for before it must
    be renewed?
  choices:
    A: 2 years
    B: 3 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: In Ontario, a standard driver's license is usually valid for five years
    and expires on the driver's birthday.
- id: 15
  category: license_system
  question: Which of the following is a requirement to obtain a G2 license?
  choices:
    A: Passing a written knowledge test
    B: Passing a vision test
    C: Passing the G1 road test
    D: Completing 100 hours of night driving
  answer: C
  explanation: To move from a G1 to a G2 license, a driver must pass the G1 road test
    (Level 1 road test) which tests basic driving skills.
- id: 16
  category: license_system
  question: In Ontario, how long do demerit points remain on your driving record from
    the date of the offence?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: According to the Ontario Ministry of Transportation, demerit points
    stay on your record for two years from the date of the offence.
- id: 17
  category: license_system
  question: What is the minimum fine for a first-time conviction of failing to stop
    for a school bus with its red lights flashing in Ontario?
  choices:
    A: $200
    B: $400
    C: $1,000
    '0': $2,000
  answer: B
  explanation: For a first offence of failing to stop for a school bus, the fine ranges
    from $400 to $2,000 and includes six demerit points.
- id: 18
  category: license_system
  question: Under Ontario's 'Stunt Driving' laws, what is the duration of the immediate
    roadside driver's license suspension?
  choices:
    A: 3 days
    B: 7 days
    C: 14 days
    D: 30 days
  answer: C
  explanation: If charged with stunt driving or street racing, your license is suspended
    immediately at the roadside for 14 days.
- id: 19
  category: license_system
  question: A fully licensed driver (Class G) convicted of distracted driving for
    the first time will receive how many demerit points?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: A first conviction for distracted driving in Ontario results in a fine,
    a 3-day license suspension, and 3 demerit points.
- id: 20
  category: license_system
  question: Which professionals are legally required to report to the Ministry of
    Transportation if a patient has a medical condition that may make it unsafe to
    drive?
  choices:
    A: Only family doctors
    B: Physicians, optometrists, and nurse practitioners
    C: Only police officers
    D: Only pharmacists
  answer: B
  explanation: In Ontario, physicians, optometrists, and nurse practitioners are required
    by law to report patients who have certain high-risk medical conditions.
- id: 21
  category: license_system
  question: Once a driver in Ontario reaches the age of 80, how often must they participate
    in a license renewal session?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 5 years
    D: Only if they have an accident
  answer: B
  explanation: Drivers aged 80 and over must renew their driver's license every two
    years, which includes a vision test and a group education session.
- id: 22
  category: license_system
  question: How many demerit points are added to your record for a conviction of 'Following
    too closely'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Following too closely is a 4-demerit point offence in Ontario.
- id: 23
  category: license_system
  question: In Ontario, failing to remain at the scene of an accident results in how
    many demerit points?
  choices:
    A: 3 points
    B: 5 points
    C: 6 points
    D: 7 points
  answer: D
  explanation: Failing to remain at the scene of an accident is one of the most serious
    HTA offences and carries 7 demerit points.
- id: 24
  category: license_system
  question: 'For a first-time distracted driving conviction, a fully licensed Ontario
    driver faces a mandatory license suspension of:'
  choices:
    A: 3 days
    B: 7 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: Under Ontario law, a first conviction for distracted driving results
    in a mandatory 3-day license suspension upon conviction.
- id: 25
  category: license_system
  question: Which license class is required to operate a motorcycle in Ontario?
  choices:
    A: Class A
    B: Class D
    C: Class G
    D: Class M
  answer: D
  explanation: A Class M license is required to operate motorcycles, motor tricycles,
    limited-speed motorcycles (mopeds), and motor-assisted bicycles.
- id: 26
  category: license_system
  question: What is the maximum fine for a conviction of 'Careless Driving' in Ontario?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Careless driving carries a fine of $400 to $2,000, 6 demerit points,
    and a possible jail term or license suspension.
- id: 27
  category: license_system
  question: If your Ontario driver's license is suspended for any reason, what is
    the administrative fee you must pay to have it reinstated?
  choices:
    A: $150
    B: $198
    C: $281
    D: $350
  answer: C
  explanation: As of current Ontario regulations, the administrative fee for license
    reinstatement after a suspension is $281.
- id: 28
  category: license_system
  question: 'If a fully licensed driver is caught in the ''Warn Range'' (BAC of 0.05
    to 0.08) for the first time, their license will be suspended at the roadside for:'
  choices:
    A: 12 hours
    B: 24 hours
    C: 3 days
    D: 7 days
  answer: C
  explanation: In Ontario, a first-time 'Warn Range' (0.05 to 0.08 BAC) violation
    results in an immediate 3-day roadside license suspension.
- id: 29
  category: driver_testing
  question: In Ontario, drivers aged 80 and over must undergo a renewal process every
    how many years?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 5 years
    D: Every 10 years
  answer: B
  explanation: Once a driver reaches age 80, they must renew their license every two
    years. The process includes a vision test, a driver record review, and a group
    education session.
- id: 30
  category: driver_testing
  question: 'To meet the vision standards for a Class G license in Ontario, your visual
    acuity must be at least:'
  choices:
    A: 20/20 in each eye
    B: 20/30 in the better eye
    C: 20/50 with both eyes open and examined together
    D: 20/100 in at least one eye
  answer: C
  explanation: Ontario vision standards require a visual acuity of not less than 20/50
    with both eyes open and examined together, with or without corrective lenses.
- id: 31
  category: driver_testing
  question: 'If a fully licensed driver is convicted of distracted driving for the
    first time, the minimum fine if settled out of court is approximately:'
  choices:
    A: $110
    B: $300
    C: $615
    D: $1,500
  answer: C
  explanation: In Ontario, a first-time conviction for distracted driving carries
    a set fine of $615 (including victim surcharge and court fees) if settled out
    of court.
- id: 32
  category: driver_testing
  question: Under Ontario's 'Move Over' law, what is the fine for a first offense
    of failing to move over for an emergency vehicle with flashing lights?
  choices:
    A: $100 to $500
    B: $400 to $2,000
    C: $1,000 to $5,000
    D: $50 to $100
  answer: B
  explanation: Failing to move over for an emergency vehicle or tow truck with flashing
    lights results in a fine of $400 to $2,000 and 3 demerit points for a first offense.
- id: 33
  category: driver_testing
  question: In Ontario, the driver is responsible for ensuring all passengers under
    what age are properly buckled up?
  choices:
    A: Under 12 years old
    B: Under 16 years old
    C: Under 18 years old
    D: Under 21 years old
  answer: B
  explanation: Drivers are responsible for ensuring that all passengers under the
    age of 16 are properly secured by a seatbelt or appropriate child car seat.
- id: 34
  category: driver_testing
  question: What is the minimum fine for failing to stop when signaled by a police
    officer in Ontario?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: B
  explanation: If you fail to stop for a police officer, you can be fined between
    $1,000 and $10,000, and you may face imprisonment or license suspension.
- id: 35
  category: driver_testing
  question: In Ontario, G1 and G2 drivers must have a zero presence of which substance
    in their system while driving?
  choices:
    A: Alcohol only
    B: Cannabis only
    C: Illegal drugs only
    D: Both alcohol and drugs (including cannabis)
  answer: D
  explanation: Ontario has a zero-tolerance policy for both alcohol and drugs (including
    THC/cannabis) for all novice drivers (G1, G2, M1, M2) and drivers age 21 and under.
- id: 36
  category: driver_testing
  question: 'When passing a cyclist, Ontario law requires drivers to maintain a minimum
    distance of:'
  choices:
    A: 0.5 metres
    B: 1 metre
    C: 2 metres
    D: 3 metres
  answer: B
  explanation: The 'One-Metre Rule' requires motorists to maintain a minimum distance
    of one metre when passing a cyclist where practicable.
- id: 37
  category: driver_testing
  question: During an Ontario road test, your test may be cancelled if your vehicle
    has which of the following defects?
  choices:
    A: A dirty windshield
    B: A non-functioning brake light
    C: Low fuel level
    D: A missing hubcap
  answer: B
  explanation: For safety reasons, examiners will cancel a road test if the vehicle
    is not in good working order, including non-functional brake lights, turn signals,
    or cracked windshields that obstruct vision.
- id: 38
  category: driver_testing
  question: If your G2 license expires before you take your G road test, what must
    you do?
  choices:
    A: Pay a late fee and renew it immediately
    B: Apply for an automatic 6-month extension
    C: Start the graduated licensing process over from the beginning (G1)
    D: Take only the vision test to get it back
  answer: C
  explanation: If a novice license (G1 or G2) expires, you must start the process
    over from the beginning, including the knowledge test and waiting periods, unless
    you have a road test booked before the expiry date.
- id: 39
  category: driver_testing
  question: 'For a first-time Criminal Code offense related to impaired driving, a
    driver faces a mandatory license suspension of at least:'
  choices:
    A: 30 days
    B: 90 days
    C: 1 year
    D: 3 years
  answer: C
  explanation: A first-time conviction under the Criminal Code for impaired driving
    results in a minimum 1-year court-ordered license suspension.
- id: 40
  category: driver_testing
  question: How many demerit points are assigned for failing to yield to a pedestrian
    at a pedestrian crossover?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Failing to yield to a pedestrian at a pedestrian crossover results
    in 4 demerit points and a significant fine.
- id: 41
  category: driver_testing
  question: In Ontario, if you are approaching an emergency vehicle with its red or
    red and blue lights flashing and it is stopped on the side of the road, what must
    you do according to the 'Move Over' law?
  choices:
    A: Stop immediately and wait for the vehicle to move
    B: Maintain your speed but honk to alert the emergency workers
    C: Slow down and, if safe to do so, move into another lane
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Ontario's 'Move Over' law requires drivers to slow down and pass with
    caution when an emergency vehicle is stopped with lights flashing. If the road
    has multiple lanes, you must move into another lane if it can be done safely.
- id: 42
  category: driver_testing
  question: When a streetcar is stopped to take on or discharge passengers and there
    is no safety island, what is the minimum distance you must stay behind the rear
    doors?
  choices:
    A: 1 metre
    B: 2 metres
    C: 3 metres
    D: 5 metres
  answer: B
  explanation: Under the Highway Traffic Act, drivers must stay at least 2 metres
    behind the rear doors of a streetcar when it is stopped for passengers, unless
    there is a designated safety island.
- id: 43
  category: driver_testing
  question: 'In Ontario, you must report a collision to the police or a Collision
    Reporting Centre if the total damage to all vehicles and property appears to be
    more than:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    '0': $5,000
  answer: C
  explanation: Collisions must be reported to the police if there are injuries or
    if the total property damage to all vehicles involved appears to be $2,000 or
    more.
- id: 44
  category: driver_testing
  question: How many demerit points will be added to your Ontario driving record for
    a conviction of speeding 30 to 49 km/h over the speed limit?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Speeding 30 to 49 km/h over the posted limit results in 4 demerit points
    in Ontario.
- id: 45
  category: driver_testing
  question: When approaching a pedestrian crossover in Ontario, when are you permitted
    to drive your vehicle through the crossover?
  choices:
    A: As soon as the pedestrian is out of your lane
    B: Only after the pedestrian has completely crossed the road and is on the sidewalk
    C: If the pedestrian waves you through
    D: If the pedestrian is more than halfway across
  answer: B
  explanation: At pedestrian crossovers and school crossings, drivers must wait until
    pedestrians have completely crossed the road (from curb to curb) before proceeding.
- id: 46
  category: driver_testing
  question: What is the Blood Alcohol Concentration (BAC) limit for a fully licensed
    driver (Class G) to be in the 'Warn Range' in Ontario?
  choices:
    A: 0.02 to 0.05
    B: 0.05 to 0.08
    C: 0.08 to 0.10
    D: Above 0.08
  answer: B
  explanation: In Ontario, the 'Warn Range' for fully licensed drivers is a BAC between
    0.05 and 0.08. Driving in this range can result in an immediate roadside license
    suspension.
- id: 47
  category: driver_testing
  question: When driving at night, you must switch from high-beam to low-beam headlights
    when you are within how many metres of a vehicle you are following?
  choices:
    A: 30 metres
    B: 60 metres
    C: 150 metres
    D: 200 metres
  answer: B
  explanation: You must switch to low beams when following another vehicle within
    60 metres, or when approaching an oncoming vehicle within 150 metres.
- id: 48
  category: driver_testing
  question: When entering a roundabout in Ontario, who has the right-of-way?
  choices:
    A: Traffic entering the roundabout
    B: Traffic already in the roundabout
    C: The vehicle traveling at the highest speed
    D: The vehicle entering from the right
  answer: B
  explanation: Drivers entering a roundabout must yield to traffic already circulating
    in the roundabout.
- id: 49
  category: driver_testing
  question: In Ontario, if you are convicted of failing to stop for a school bus for
    a second time, what is the maximum fine you could face?
  choices:
    A: $1,000
    B: $2,000
    C: $4,000
    D: $6,000
  answer: C
  explanation: For a second or subsequent conviction of failing to stop for a school
    bus, the fine ranges from $1,000 to $4,000, and you may also face up to six months
    in jail.
- id: 50
  category: driver_testing
  question: 'When parking your vehicle facing downhill on a street with a curb, you
    should turn your steering wheel:'
  choices:
    A: To the left (toward the center of the road)
    B: To the right (toward the curb)
    C: Keep the wheels straight
    D: It does not matter
  answer: B
  explanation: When parking downhill, you should turn your wheels toward the curb
    (right) so that if the vehicle rolls, it will roll into the curb and stop.
- id: 51
  category: driver_testing
  question: In Ontario, what is the zero-tolerance policy regarding drugs for novice
    drivers (G1, G2, M1, M2)?
  choices:
    A: They can have a small amount of THC in their system
    B: They can have drugs if they have a medical prescription
    C: They must have zero presence of cannabis or other drugs in their system
    D: The policy only applies to alcohol, not drugs
  answer: C
  explanation: Novice drivers (G1, G2, etc.) and young drivers under 22 have a zero-tolerance
    requirement for both alcohol and drugs (including cannabis) while driving.
- id: 52
  category: driver_testing
  question: 'If you are involved in an accident where someone is injured, you must:'
  choices:
    A: Report it to the police immediately
    B: Report it only if the damage is over $2,000
    C: Wait 24 hours before reporting
    D: Only report it to your insurance company
  answer: A
  explanation: Any collision involving personal injury, regardless of the amount of
    property damage, must be reported to the police immediately.
- id: 53
  category: driver_testing
  question: Which of the following describes the correct hand signal for a right turn?
  choices:
    A: Left arm extended straight out the window
    B: Left arm out and bent upward at the elbow
    C: Left arm out and bent downward at the elbow
    D: Right arm extended straight out the window
  answer: B
  explanation: The hand signal for a right turn is the left arm extended out the window
    and bent upward at the elbow.
- id: 54
  category: driver_responsibility
  question: What is the minimum fine for a first-time conviction of driving a motor
    vehicle without valid insurance in Ontario?
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: D
  explanation: Under the Compulsory Automobile Insurance Act of Ontario, the minimum
    fine for a first offense of driving without insurance is $5,000, plus a 25% victim
    fine surcharge.
- id: 55
  category: driver_responsibility
  question: When selling a used vehicle privately in Ontario, the seller is legally
    required to provide the buyer with which document?
  choices:
    A: A Used Vehicle Information Package (UVIP)
    B: A 10-year driving record
    C: A blank insurance application
    D: A certified criminal record check
  answer: A
  explanation: In Ontario, private sellers must provide the buyer with a Used Vehicle
    Information Package (UVIP) which contains the vehicle's history and lien information.
- id: 56
  category: driver_responsibility
  question: If you are involved in a collision where someone is injured, what is your
    immediate legal obligation?
  choices:
    A: Drive to the nearest hospital to report it
    B: Remain at the scene and render all possible assistance
    C: Call your insurance company before speaking to anyone
    D: Leave your contact information on a note and continue driving
  answer: B
  explanation: The Highway Traffic Act requires drivers involved in an accident to
    remain at or immediately return to the scene and provide assistance to anyone
    injured.
- id: 57
  category: driver_responsibility
  question: After purchasing a used vehicle from a private seller, the buyer must
    register the transfer of ownership at a ServiceOntario centre within how many
    days?
  choices:
    A: 2 days
    B: 6 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: In Ontario, the buyer of a used vehicle must register the transfer
    of ownership within 6 days of the purchase date.
- id: 58
  category: driver_responsibility
  question: Which of the following is a mandatory component of all automobile insurance
    policies in Ontario?
  choices:
    A: Comprehensive coverage
    B: Collision coverage
    C: Third-party liability coverage
    D: Rental car reimbursement
  answer: C
  explanation: Ontario law requires all motorists to carry at least $200,000 in Third-Party
    Liability insurance, though most drivers carry more.
- id: 59
  category: driver_responsibility
  question: When you sell your vehicle in Ontario, what happens to the license plates?
  choices:
    A: They must stay with the vehicle for the new owner
    B: They must be destroyed immediately
    C: You keep the plates and the 'plate portion' of the vehicle permit
    D: You must give them to the buyer along with the 'vehicle portion'
  answer: C
  explanation: In Ontario, license plates move with the owner, not the vehicle. You
    keep your plates and the plate portion of the permit when you sell a car.
- id: 60
  category: driver_responsibility
  question: If you hit a parked vehicle and cannot find the owner, what are you required
    to do by law?
  choices:
    A: Wait for 30 minutes, then leave if no one shows up
    B: Leave a note with your name and address and report the accident to police
    C: Nothing, if the damage appears to be less than $2,000
    D: Only report it if the other vehicle is a commercial truck
  answer: B
  explanation: If you hit a parked vehicle or property and the owner is not present,
    you must leave a note with your information and report the incident to the police
    or a Collision Reporting Centre.
- id: 61
  category: driver_responsibility
  question: A Safety Standards Certificate (SSC) is required to register a vehicle
    as 'fit'. How long is this certificate valid for in Ontario?
  choices:
    A: 14 days
    B: 36 days
    C: 60 days
    D: 1 year
  answer: B
  explanation: In Ontario, a Safety Standards Certificate is valid for 36 days from
    the date of the inspection.
- id: 62
  category: driver_responsibility
  question: At the scene of a collision, you must exchange information with other
    involved parties. Which of the following is NOT legally required to be exchanged?
  choices:
    A: Your name and address
    B: Your vehicle plate number
    C: Your insurance company and policy number
    D: Your driving record history
  answer: D
  explanation: Drivers must exchange names, addresses, plate numbers, and insurance
    details. They are not required to share their personal driving record history
    with other drivers.
- id: 63
  category: driver_responsibility
  question: If you are convicted of failing to remain at the scene of a collision
    in Ontario, how many demerit points will be added to your record?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 9 points
  answer: C
  explanation: Failing to remain at the scene of an accident is a serious offense
    that carries a penalty of 7 demerit points in Ontario.
- id: 64
  category: driver_responsibility
  question: Which document must be kept in the vehicle at all times while driving
    in Ontario?
  choices:
    A: The original vehicle purchase receipt
    B: The vehicle permit (or a true copy)
    C: The Used Vehicle Information Package
    D: The vehicle's service manual
  answer: B
  explanation: Drivers must carry the vehicle permit (registration) or a true copy
    of it at all times while operating the vehicle.
- id: 65
  category: driver_responsibility
  question: 'In Ontario, ''Uninsured Automobile Coverage'' protects you if:'
  choices:
    A: You forget to pay your insurance premium
    B: You are involved in an accident with a driver who does not have insurance
    C: You decide to cancel your insurance policy
    D: You drive a vehicle that you do not own
  answer: B
  explanation: Uninsured Automobile Coverage is mandatory in Ontario and protects
    you and your family if you are injured or killed by an uninsured motorist or a
    hit-and-run driver.
- id: 66
  category: driver_responsibility
  question: 'If your driver''s license is suspended for a Highway Traffic Act conviction,
    you may also have to pay a reinstatement fee of:'
  choices:
    A: $50
    B: $150
    C: $281
    D: $500
  answer: C
  explanation: As of current Ontario regulations, drivers must pay a $281 administrative
    fee to reinstate a license that was suspended for most Highway Traffic Act violations.
- id: 67
  category: driver_responsibility
  question: In Ontario, what is the minimum amount of third-party liability insurance
    coverage required by law?
  choices:
    A: $50,000
    B: $100,000
    C: $200,000
    D: $500,000
  answer: C
  explanation: Under the Compulsory Automobile Insurance Act, every motor vehicle
    registered in Ontario must be insured for at least $200,000 in third-party liability
    coverage.
- id: 68
  category: driver_responsibility
  question: Where must the vehicle permit (ownership) or a true copy be kept while
    operating a motor vehicle?
  choices:
    A: In a safe at your primary residence
    B: In the vehicle or on the person of the driver
    C: At the office of your insurance provider
    D: It must be displayed in the rear window
  answer: B
  explanation: Ontario law requires that the vehicle permit (or a true copy) be carried
    in the vehicle or on the person of the driver so it can be produced upon the request
    of a police officer.
- id: 69
  category: driver_responsibility
  question: A Safety Standards Certificate is required when transferring ownership
    of a used vehicle to anyone other than a spouse. For how many days is this certificate
    valid after the inspection?
  choices:
    A: 14 days
    B: 30 days
    C: 36 days
    D: 60 days
  answer: C
  explanation: In Ontario, a Safety Standards Certificate is valid for 36 days from
    the date of the inspection for the purpose of transferring ownership or registering
    a vehicle.
- id: 70
  category: driver_responsibility
  question: What is the maximum fine for providing false information to the Ministry
    of Transportation regarding insurance or vehicle registration?
  choices:
    A: $1,000
    B: $5,000
    C: $10,000
    D: $25,000
  answer: D
  explanation: Providing false information on an application for a permit, a license,
    or in any statement required under the Highway Traffic Act can result in a fine
    of up to $25,000, imprisonment, or license suspension.
- id: 71
  category: driver_responsibility
  question: In Ontario, is it legal to show proof of auto insurance to a police officer
    on a mobile device (electronic insurance card)?
  choices:
    A: No, only the original pink paper slip is accepted
    B: Yes, but only if the vehicle is a rental
    C: Yes, electronic proof of insurance is legally accepted in Ontario
    D: No, you must have a physical photocopy
  answer: C
  explanation: As of 2019, Ontario drivers have the option to provide proof of insurance
    in an electronic format on a mobile device, in addition to the traditional paper
    'pink slip'.
- id: 72
  category: driver_responsibility
  question: What can happen if you fail to pay a traffic fine in Ontario within the
    required timeframe?
  choices:
    A: Your vehicle will be impounded immediately
    B: Your driver's license may be suspended and you will be unable to renew your
      vehicle permit
    C: You will be required to retake your G1 written test
    D: Nothing, as long as you pay it within one year
  answer: B
  explanation: Failure to pay a court-ordered fine for a traffic violation can result
    in the suspension of your driver's license and the Ministry's refusal to validate
    or issue vehicle permits.
- id: 73
  category: driver_responsibility
  question: 'According to the Highway Traffic Act, your vehicle''s license plates
    must be:'
  choices:
    A: Kept free from dirt and obstructions so they are clearly visible
    B: Covered with a tinted plastic shield for protection
    C: Mounted only in the rear window
    D: Changed every two years
  answer: A
  explanation: License plates in Ontario must be kept clean and clearly visible at
    all times. Using plate covers that are tinted or obstruct the numbers/letters
    is illegal.
- id: 74
  category: driver_responsibility
  question: 'An Accessible Parking Permit allows a vehicle to park in designated spaces
    only if:'
  choices:
    A: The vehicle has a handicap sticker on the bumper
    B: The person to whom the permit was issued is being transported in the vehicle
    C: The driver is over the age of 65
    D: The vehicle is an SUV or van
  answer: B
  explanation: An Accessible Parking Permit is issued to an individual, not a vehicle.
    It can only be used when the person named on the permit is using the vehicle.
- id: 75
  category: driver_responsibility
  question: 'In Ontario, insurance companies are required by law to provide a discount
    to drivers who:'
  choices:
    A: Drive less than 5,000 km per year
    B: Install four winter tires on their vehicle
    C: Have never received a speeding ticket
    D: Use a dashcam
  answer: B
  explanation: As of 2016, all private insurance companies in Ontario are mandated
    by the government to offer a discount to drivers who use winter tires.
- id: 76
  category: safe_driving_rules
  question: Unless otherwise posted, what is the maximum speed limit in Ontario cities,
    towns, and villages?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: B
  explanation: According to the Ontario Highway Traffic Act, the statutory speed limit
    is 50 km/h in cities, towns, villages, and built-up areas unless signs indicate
    otherwise.
- id: 77
  category: safe_driving_rules
  question: In Ontario, what is the minimum distance you must park away from a fire
    hydrant?
  choices:
    A: 1.5 metres
    B: 3 metres
    C: 5 metres
    D: 9 metres
  answer: B
  explanation: The Ontario Highway Traffic Act prohibits parking a vehicle within
    3 metres of a fire hydrant.
- id: 78
  category: safe_driving_rules
  question: When approaching an emergency vehicle or tow truck with flashing lights
    stopped on the side of a highway with two or more lanes, what does Ontario's 'Move
    Over' law require you to do?
  choices:
    A: Stop immediately and wait for instructions
    B: Maintain speed but honk to alert the workers
    C: Slow down and move into another lane if it can be done safely
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Ontario's 'Move Over' law requires drivers to slow down and, if the
    highway has more than one lane, move into another lane if it is safe to do so
    when passing emergency vehicles or tow trucks with flashing lights.
- id: 79
  category: safe_driving_rules
  question: Under what specific condition is a left turn on a red light permitted
    in Ontario?
  choices:
    A: It is never permitted
    B: From a two-way street onto a one-way street
    C: From a one-way street onto another one-way street
    D: At any intersection after coming to a complete stop
  answer: C
  explanation: In Ontario, you may turn left on a red light only if you are turning
    from a one-way street into another one-way street, provided you come to a complete
    stop and yield to traffic and pedestrians.
- id: 80
  category: safe_driving_rules
  question: What is the penalty for speeding in a designated construction zone in
    Ontario when workers are present?
  choices:
    A: The fine is tripled
    B: The fine is doubled
    C: A mandatory 7-day license suspension
    D: There is no extra penalty, only standard fines apply
  answer: B
  explanation: In Ontario, speeding fines are doubled in construction zones when workers
    are present, as per the Highway Traffic Act.
- id: 81
  category: safe_driving_rules
  question: At a pedestrian crossover (not a standard intersection), when are you
    allowed to proceed after a pedestrian has started crossing?
  choices:
    A: As soon as the pedestrian is out of your lane
    B: When the pedestrian is halfway across the road
    C: Only after the pedestrian has completely crossed the road and is on the sidewalk
    D: When the pedestrian waves you through
  answer: C
  explanation: At pedestrian crossovers and school crossings, drivers must remain
    stopped until the pedestrian has completely reached the other side of the road.
- id: 82
  category: safe_driving_rules
  question: 'When driving at night, you must switch your high-beam headlights to low-beams
    when following another vehicle within:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 150 metres
    D: 200 metres
  answer: B
  explanation: Ontario law requires drivers to switch to low-beam headlights when
    following another vehicle within 60 metres to avoid blinding the driver ahead.
- id: 83
  category: safe_driving_rules
  question: When parking a vehicle facing uphill on a two-way street with a curb,
    how should the front wheels be turned?
  choices:
    A: To the right (towards the curb)
    B: To the left (away from the curb)
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn the wheels to the left (away
    from the curb) so that if the vehicle rolls backward, the back of the front tire
    will hit the curb and stop the car.
- id: 84
  category: safe_driving_rules
  question: When approaching a railway crossing where a signal is flashing, what is
    the minimum distance you must stop from the nearest rail?
  choices:
    A: 3 metres
    B: 5 metres
    C: 10 metres
    D: 15 metres
  answer: B
  explanation: In Ontario, when a signal is warning of an approaching train, you must
    stop at least 5 metres from the nearest rail.
- id: 85
  category: safe_driving_rules
  question: In Ontario, High Occupancy Vehicle (HOV) lanes on 400-series highways
    are generally reserved for vehicles carrying at least how many people?
  choices:
    A: 1 person (driver only)
    B: 2 people
    C: 3 people
    D: 4 people
  answer: B
  explanation: Most HOV lanes in Ontario require a minimum of two people (driver plus
    at least one passenger) in the vehicle, though certain vehicles like buses, emergency
    vehicles, and licensed taxis are exempt.
- id: 86
  category: safe_driving_rules
  question: 'When a school crossing guard displays a ''stop'' sign, you must:'
  choices:
    A: Stop and wait until all children have crossed, but you can go before the guard
      leaves the road
    B: Slow down and proceed with caution
    C: Stop and wait until the children and the school crossing guard have completely
      left the roadway
    D: Stop only if there are children present
  answer: C
  explanation: Under the Highway Traffic Act, drivers must stop and remain stopped
    until all pedestrians and the school crossing guard have safely cleared the entire
    roadway.
- id: 87
  category: safe_driving_rules
  question: In Ontario, what is the default speed limit in a built-up area (city,
    town, or village) unless otherwise posted?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: B
  explanation: According to the Ontario Highway Traffic Act, the statutory speed limit
    is 50 km/h in built-up areas and 80 km/h elsewhere, unless signs indicate otherwise.
- id: 88
  category: safe_driving_rules
  question: When parking your vehicle near a fire hydrant in Ontario, what is the
    minimum distance you must maintain?
  choices:
    A: 1 metre
    B: 3 metres
    C: 5 metres
    D: 10 metres
  answer: B
  explanation: In Ontario, you are prohibited from parking within 3 metres of a fire
    hydrant.
- id: 89
  category: safe_driving_rules
  question: When driving at night, you must switch your high-beam headlights to low-beams
    when you are within what distance of an oncoming vehicle?
  choices:
    A: 60 metres
    B: 100 metres
    C: 150 metres
    D: 250 metres
  answer: C
  explanation: Ontario law requires drivers to switch to low-beam headlights when
    an oncoming vehicle is within 150 metres to avoid blinding the other driver.
- id: 90
  category: safe_driving_rules
  question: When following another vehicle at night, you must switch from high-beams
    to low-beams when you are within what distance of the vehicle ahead?
  choices:
    A: 30 metres
    B: 60 metres
    C: 120 metres
    D: 150 metres
  answer: B
  explanation: You must use low-beam headlights when you are following another vehicle
    within 60 metres, except when overtaking and passing.
- id: 91
  category: safe_driving_rules
  question: When two vehicles arrive at an uncontrolled intersection (no signs or
    lights) at approximately the same time, who has the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle travelling at a higher speed
    D: The vehicle on the larger road
  answer: B
  explanation: At an intersection without signs or lights, you must yield the right-of-way
    to any vehicle approaching from the right.
- id: 92
  category: safe_driving_rules
  question: At a pedestrian crossover (not a standard intersection with lights), what
    must a driver do when a pedestrian is crossing?
  choices:
    A: Stop and wait until the pedestrian has completely crossed the road and is on
      the sidewalk
    B: Stop and wait until the pedestrian has cleared the driver's half of the road
    C: Slow down and drive around the pedestrian
    D: Honk to warn the pedestrian to move faster
  answer: A
  explanation: At pedestrian crossovers and school crossings, drivers must remain
    stopped until the pedestrian has completely finished crossing the entire road.
- id: 93
  category: safe_driving_rules
  question: What is the recommended following distance behind another vehicle under
    normal driving conditions in Ontario?
  choices:
    A: One car length
    B: Two seconds
    C: Three car lengths
    D: Five seconds
  answer: B
  explanation: The Ontario Driver's Handbook recommends a minimum following distance
    of at least two seconds behind the vehicle in front of you.
- id: 94
  category: safe_driving_rules
  question: 'When entering a roundabout in Ontario, you must:'
  choices:
    A: Yield to traffic already in the roundabout approaching from your left
    B: Yield to traffic approaching from your right
    C: Stop before entering, regardless of traffic
    D: Accelerate to merge with the flow of traffic
  answer: A
  explanation: When entering a roundabout, you must yield to traffic already in the
    circle coming from your left.
- id: 95
  category: safe_driving_rules
  question: In Ontario, you are prohibited from following a fire department vehicle
    responding to an alarm within what distance?
  choices:
    A: 50 metres
    B: 100 metres
    C: 150 metres
    D: 200 metres
  answer: C
  explanation: It is illegal to follow within 150 metres of a fire vehicle responding
    to a call.
- id: 96
  category: defensive_driving
  question: In ideal driving conditions, what is the recommended minimum following
    distance behind the vehicle in front of you according to the Ontario Driver's
    Handbook?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 4 seconds
  answer: B
  explanation: The Ontario Driver's Handbook recommends maintaining a minimum two-second
    following distance in ideal conditions to allow enough time to react to sudden
    stops.
- id: 97
  category: defensive_driving
  question: 'To maintain proper situational awareness while driving, the Ontario Driver''s
    Handbook suggests scanning the road ahead to where you will be in approximately:'
  choices:
    A: 2 to 5 seconds
    B: 5 to 8 seconds
    C: 12 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: Effective scanning involves looking 12 to 15 seconds ahead of your
    current position to anticipate potential hazards and traffic changes.
- id: 98
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet road, what is the safest
    course of action?
  choices:
    A: Brake hard to slow down quickly
    B: Accelerate to cut through the water
    C: Ease off the gas pedal and steer in the direction you want to go
    D: Turn the steering wheel sharply to the right
  answer: C
  explanation: When hydroplaning, you should avoid braking or sudden steering. Easing
    off the accelerator allows the vehicle to slow down until the tires regain contact
    with the road.
- id: 99
  category: defensive_driving
  question: When driving in heavy fog in Ontario, which headlight setting should you
    use to ensure maximum visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights at all
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    moisture in the air, creating a glare that makes it harder to see.
- id: 100
  category: defensive_driving
  question: When approaching a railway crossing with a signal or gate activated, you
    must stop at least how many metres from the nearest rail?
  choices:
    A: 2 metres
    B: 5 metres
    C: 10 metres
    D: 15 metres
  answer: B
  explanation: In Ontario, you must stop at least 5 metres from the nearest rail at
    a railway crossing when a signal is warning of an approaching train.
- id: 101
  category: defensive_driving
  question: If your vehicle's brakes fail while you are driving, what should be your
    first defensive action?
  choices:
    A: Turn off the ignition immediately
    B: Shift the vehicle into neutral
    C: Pump the brake pedal rapidly
    D: Apply the emergency brake as hard as possible
  answer: C
  explanation: Pumping the brake pedal can often build up enough hydraulic pressure
    to stop the vehicle if the failure is partial.
- id: 102
  category: defensive_driving
  question: 'When an emergency vehicle with a siren and flashing lights is approaching
    your vehicle from either direction on a two-way road, you must:'
  choices:
    A: Stop where you are immediately
    B: Speed up to get out of the way
    C: Signal and pull to the right as far as possible and stop
    D: Pull over to the left shoulder and stop
  answer: C
  explanation: Drivers must pull to the right and come to a complete stop to provide
    a clear path for emergency vehicles.
- id: 103
  category: defensive_driving
  question: Under the Highway Traffic Act, you are prohibited from passing another
    vehicle within how many metres of a bridge, viaduct, or tunnel if your view is
    obstructed?
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: A
  explanation: Section 149 of the Highway Traffic Act states you cannot drive to the
    left side of the roadway when approaching within 30 metres of a bridge, viaduct,
    or tunnel.
- id: 104
  category: defensive_driving
  question: 'When entering a freeway via an acceleration lane, the correct defensive
    driving procedure is to:'
  choices:
    A: Stop at the end of the acceleration lane and wait for a gap
    B: Drive slowly and wait for a driver to wave you in
    C: Increase your speed to match the flow of freeway traffic and merge safely
    D: Always yield to the vehicles on the shoulder of the freeway
  answer: C
  explanation: The acceleration lane is intended for drivers to increase their speed
    to match the traffic already on the freeway so they can merge without causing
    others to brake.
- id: 105
  category: defensive_driving
  question: To maintain proper situational awareness, the MTO recommends scanning
    the road ahead how far in advance?
  choices:
    A: 2 to 5 seconds
    B: 5 to 8 seconds
    C: 12 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: Drivers should scan the road 12 to 15 seconds ahead in the city and
    further on the highway to anticipate hazards.
- id: 106
  category: defensive_driving
  question: 'Under Ontario''s ''Move Over'' law, if you see an emergency vehicle with
    flashing lights stopped on the side of the road, you must slow down and move over
    if safe. Failure to do so for a first offense results in 3 demerit points and
    a fine of:'
  choices:
    A: $100 to $500
    B: $400 to $2,000
    C: $1,000 to $5,000
    D: $2,000 to $10,000
  answer: B
  explanation: A first conviction for failing to move over for an emergency vehicle
    or tow truck with flashing lights carries a fine of $400 to $2,000 and 3 demerit
    points.
- id: 107
  category: defensive_driving
  question: When driving in heavy fog, which lighting configuration should you use
    for maximum visibility?
  choices:
    A: High-beam headlights
    B: Parking lights only
    C: Low-beam headlights
    D: No lights, to reduce glare
  answer: C
  explanation: Low-beam headlights should be used in fog because high beams reflect
    off the moisture in the air, creating a 'white wall' that reduces visibility.
- id: 108
  category: defensive_driving
  question: What is the best way to check your blind spots before changing lanes?
  choices:
    A: Check your rearview mirror
    B: Check your side-view mirrors
    C: Turn your head and look over your shoulder
    D: Lean forward to change the angle of the side mirrors
  answer: C
  explanation: Mirrors do not show everything. A shoulder check (turning your head)
    is the only way to ensure your blind spots are clear.
- id: 109
  category: defensive_driving
  question: In winter conditions, 'black ice' is most likely to form on which of the
    following surfaces first?
  choices:
    A: Gravel roads
    B: Bridges and overpasses
    C: Steep hills
    D: Multi-lane highways
  answer: B
  explanation: Bridges and overpasses freeze more quickly than other road surfaces
    because the cold air circulates both above and below the structure.
- id: 110
  category: defensive_driving
  question: When driving behind a large commercial truck, why should you maintain
    a greater following distance than you would for a car?
  choices:
    A: Trucks can stop much faster than cars
    B: To stay out of the truck driver's blind spots (No-Zones)
    C: Trucks are required to drive slower than the speed limit
    D: To avoid the truck's exhaust fumes
  answer: B
  explanation: Large trucks have significant blind spots at the rear. If you cannot
    see the truck's side mirrors, the driver cannot see you.
- id: 111
  category: defensive_driving
  question: When driving in a heavy rainstorm, when is the road surface typically
    the most slippery?
  choices:
    A: After it has been raining for several hours
    B: Just as the rain begins to fall
    C: When the rain stops and the sun comes out
    D: During the middle of the storm
  answer: B
  explanation: Roads are most slippery at the start of a rainstorm because the water
    mixes with oil and grease on the pavement that has not yet washed away.
- id: 112
  category: alcohol_drugs_health
  question: If a fully licensed driver is caught in the 'Warn Range' (0.05 to 0.08
    BAC) for the first time, what is the immediate roadside license suspension period?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: B
  explanation: A first-time 'Warn Range' offense results in an immediate 3-day roadside
    license suspension and a $250 administrative monetary penalty.
- id: 113
  category: alcohol_drugs_health
  question: Under Ontario's zero-tolerance laws, which drivers must maintain a BAC
    of 0.00% and zero presence of drugs?
  choices:
    A: Only G1 drivers
    B: Only G1 and G2 drivers
    C: Drivers age 21 and under, and all novice drivers (G1, G2, M1, M2)
    D: Only drivers under the age of 18
  answer: C
  explanation: In Ontario, all novice drivers (regardless of age) and all drivers
    aged 21 and under must have zero alcohol and zero drugs in their system while
    driving.
- id: 114
  category: alcohol_drugs_health
  question: In Ontario, if a police officer demands a breath or oral fluid sample
    and you refuse, what are the immediate consequences?
  choices:
    A: A 24-hour suspension only
    B: A warning and a court date
    C: The same penalties as having a BAC over 0.08, including a 90-day suspension
      and 7-day vehicle impoundment
    D: A 3-day suspension and a $100 fine
  answer: C
  explanation: Refusing to provide a breath, blood, or oral fluid sample upon legal
    demand results in an immediate 90-day Administrative Driver's Licence Suspension
    (ADLS) and a 7-day vehicle impoundment, the same as a BAC over 0.08.
- id: 115
  category: alcohol_drugs_health
  question: What is the BAC limit for drivers of commercial vehicles (e.g., trucks
    over 4,500 kg or buses) in Ontario?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    '0': 0.08%
  answer: A
  explanation: Drivers of commercial vehicles in Ontario are subject to zero-tolerance
    rules, meaning they must have a BAC of 0.00% while operating the vehicle.
- id: 116
  category: alcohol_drugs_health
  question: If you are convicted of a first-time impaired driving offence under the
    Criminal Code of Canada, what is the minimum mandatory license suspension in Ontario?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: A first-time conviction for impaired driving under the Criminal Code
    carries a minimum 1-year court-ordered license suspension in Ontario.
- id: 117
  category: alcohol_drugs_health
  question: In Ontario, what is the 'Back on Track' program?
  choices:
    A: A high-speed driving course
    B: Ontario's remedial measures program for people convicted of impaired driving
      or multiple warn-range suspensions
    C: A program for renewing expired licenses
    D: A program for young drivers to get their G2 faster
  answer: B
  explanation: Back on Track is Ontario's mandatory remedial measures program for
    drivers convicted of impaired driving or those who receive more than one 'Warn
    Range' suspension.
- id: 118
  category: alcohol_drugs_health
  question: How must legal cannabis be stored in a vehicle while driving in Ontario?
  choices:
    A: Anywhere in the vehicle as long as it is in a bag
    B: It must be in its original packaging and unopened, or stored in a place not
      readily available to any person in the vehicle (e.g., the trunk)
    C: Only in the glove compartment
    D: It cannot be transported in a vehicle under any circumstances
  answer: B
  explanation: Cannabis must be in its original unopened packaging or stored in a
    way that it is not accessible to the driver or passengers (like the trunk) while
    the vehicle is in motion.
- id: 119
  category: alcohol_drugs_health
  question: In Ontario, if your license is suspended for a Criminal Code driving conviction,
    when does the 'Ignition Interlock' requirement typically apply?
  choices:
    A: Only if you caused an accident
    B: Only for third-time offenders
    C: After the mandatory suspension period is over, as a condition of license reinstatement
    D: Immediately upon being charged
  answer: C
  explanation: After the court-ordered suspension period for an impaired driving conviction
    ends, drivers are typically required to use an ignition interlock device for a
    specific period to regain their driving privileges.
- id: 120
  category: alcohol_drugs_health
  question: What happens to a vehicle if a driver is caught with a BAC over 0.08 or
    refuses a breath test in Ontario?
  choices:
    A: It is impounded for 24 hours
    B: It is impounded for 7 days
    C: It is seized and sold by the province
    D: Nothing, only the driver's license is affected
  answer: B
  explanation: Drivers caught with a BAC over 0.08 or who refuse a breath test face
    an immediate 7-day vehicle impoundment at the roadside.
- id: 121
  category: alcohol_drugs_health
  question: Which of the following is true regarding prescription or over-the-counter
    drugs and driving in Ontario?
  choices:
    A: They are always legal to use while driving because they are medicine
    B: They are only illegal if you don't have a prescription
    C: It is illegal to drive if the drug impairs your ability to operate a vehicle
    D: Only illegal drugs are monitored by police
  answer: C
  explanation: Impaired driving laws apply to all drugs, including prescription medications
    and over-the-counter drugs, if they affect your ability to drive safely.
- id: 122
  category: alcohol_drugs_health
  question: What is the immediate Administrative Driver's Licence Suspension (ADLS)
    period for a driver whose BAC is found to be over 0.08?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: If a driver blows over 0.08, they receive an immediate 90-day Administrative
    Driver's Licence Suspension (ADLS) at the roadside, independent of any future
    court proceedings.
- id: 123
  category: alcohol_drugs_health
  question: Under 'Mandatory Alcohol Screening' laws in Ontario, when can a police
    officer demand a breath sample?
  choices:
    A: Only if the driver is swerving
    B: Only after an accident has occurred
    C: At any time, provided the officer has lawfully stopped the vehicle
    D: Only if the officer smells alcohol
  answer: C
  explanation: Under Canadian law (applied in Ontario), police officers who have lawfully
    stopped a vehicle can demand a breath sample from any driver without needing 'reasonable
    suspicion' that the driver has been drinking.
- id: 124
  category: alcohol_drugs_health
  question: In Ontario, what is the maximum Blood Alcohol Concentration (BAC) allowed
    for drivers age 21 and under?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.00%
  answer: D
  explanation: In Ontario, all drivers age 21 and under, regardless of license class,
    must have a BAC of zero when driving.
- id: 125
  category: alcohol_drugs_health
  question: 'In Ontario, if you refuse to provide a breath or blood sample to a police
    officer, you will face an immediate roadside license suspension of:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Under Ontario law, refusing to perform a physical sobriety test or
    provide a breath/blood/fluid sample results in an immediate 90-day administrative
    driver's license suspension.
- id: 126
  category: alcohol_drugs_health
  question: If a driver is caught with a BAC over 0.08 or refuses a breathalyzer test,
    their vehicle will be impounded at the roadside for how many days?
  choices:
    A: 3 days
    B: 7 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: Drivers charged with alcohol or drug-impaired driving (or refusal)
    face an immediate 7-day vehicle impoundment at the roadside.
- id: 127
  category: alcohol_drugs_health
  question: What is the Blood Alcohol Concentration (BAC) limit for drivers of commercial
    vehicles (Class A, B, C, D, E, or F) in Ontario?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: Drivers of commercial vehicles in Ontario are subject to a zero-tolerance
    rule, meaning they must have a BAC of 0.00% while operating the vehicle.
- id: 128
  category: alcohol_drugs_health
  question: Under Ontario's zero-tolerance laws for drugs, which drivers must have
    no presence of cannabis (THC) in their system?
  choices:
    A: Only G1 drivers
    B: Only G2 drivers
    C: Novice drivers and drivers age 21 and under
    D: All drivers regardless of age or license class
  answer: C
  explanation: Ontario has a zero-tolerance policy for drugs (specifically THC) for
    all novice drivers (G1, G2, M1, M2) and all drivers age 21 and under.
- id: 129
  category: alcohol_drugs_health
  question: If you are convicted of a first-time impaired driving offense under the
    Criminal Code, you must use an ignition interlock device for at least how long?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: A first-time Criminal Code conviction for impaired driving carries
    a mandatory minimum 1-year period of using an ignition interlock device after
    the license suspension is lifted.
- id: 130
  category: alcohol_drugs_health
  question: What is the Administrative Monetary Penalty (AMP) that must be paid to
    the Ministry of Transportation for a first-time roadside license suspension?
  choices:
    A: No fine, just suspension
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: Drivers who receive a roadside suspension (Warn Range or Zero Tolerance)
    are required to pay a $250 administrative monetary penalty.
- id: 131
  category: alcohol_drugs_health
  question: 'When alcohol and drugs (even prescription medications) are taken together,
    the effect on your driving ability is:'
  choices:
    A: Reduced
    B: The same as taking them separately
    C: Greater than the sum of the two
    D: Cancelled out
  answer: C
  explanation: Combining alcohol and drugs can produce a synergistic effect, meaning
    the impairment is significantly worse than the effect of either substance alone.
- id: 132
  category: alcohol_drugs_health
  question: 'In Ontario, if a driver is caught in the ''Warn Range'' (0.05 to 0.08)
    for a second time within five years, the roadside suspension period is:'
  choices:
    A: 3 days
    B: 7 days
    C: 30 days
    D: 90 days
  answer: B
  explanation: A second 'Warn Range' occurrence within a five-year period results
    in an immediate 7-day roadside license suspension and mandatory education programs.
- id: 133
  category: alcohol_drugs_health
  question: If you are a G1 or G2 driver and you are caught with any alcohol in your
    blood, your license will be suspended at the roadside for how many days?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: B
  explanation: Under Ontario's zero-tolerance policy for novice drivers, any amount
    of alcohol (above 0.00 BAC) results in an immediate 3-day roadside license suspension.
- id: 134
  category: penalties_and_points
  question: A fully licensed (Class G) driver in Ontario will receive a warning letter
    after accumulating how many demerit points?
  choices:
    A: 3 points
    B: 6 points
    C: 9 points
    D: 15 points
  answer: B
  explanation: For a fully licensed driver, the Ministry of Transportation sends a
    warning letter at 6 demerit points. At 9 points, you may be required to attend
    an interview.
- id: 135
  category: penalties_and_points
  question: How many demerit points will be recorded against your license for failing
    to remain at the scene of an accident?
  choices:
    A: 3 points
    B: 5 points
    C: 6 points
    D: 7 points
  answer: D
  explanation: Failing to remain at the scene of an accident is a serious offense
    in Ontario and carries the maximum penalty of 7 demerit points.
- id: 136
  category: penalties_and_points
  question: Under Ontario's 'Stunt Driving' laws, a driver can be charged for speeding
    if they are traveling at what speed over the limit in a zone where the limit is
    less than 80 km/h?
  choices:
    A: 30 km/h or more
    B: 40 km/h or more
    '0': 50 km/h or more
    D: 60 km/h or more
  answer: B
  explanation: As of 2021, stunt driving includes speeding 40 km/h or more over the
    limit in zones where the speed limit is less than 80 km/h, or 50 km/h or more
    over the limit in zones where the limit is 80 km/h or higher.
- id: 137
  category: penalties_and_points
  question: In Ontario, what is the 'Warn Range' Blood Alcohol Concentration (BAC)
    for fully licensed drivers that results in an immediate roadside license suspension?
  choices:
    A: 0.02 to 0.05
    B: 0.05 to 0.08
    C: 0.08 to 0.10
    D: Over 0.08 only
  answer: B
  explanation: The 'Warn Range' in Ontario is a BAC between 0.05 and 0.08. Drivers
    in this range face immediate roadside license suspensions and administrative monetary
    penalties.
- id: 138
  category: penalties_and_points
  question: If a driver is convicted of 'Careless Driving' in Ontario, how many demerit
    points are added to their driving record?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 7 points
  answer: C
  explanation: Careless driving is a major offense under the Highway Traffic Act and
    results in 6 demerit points, along with potential fines, jail time, and license
    suspension.
- id: 139
  category: penalties_and_points
  question: How many demerit points are assigned for failing to stop for a school
    bus with its red lights flashing?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 7 points
  answer: C
  explanation: Failing to stop for a school bus with its red lights flashing results
    in 6 demerit points and a substantial fine.
- id: 140
  category: penalties_and_points
  question: What is the duration of the mandatory roadside vehicle impoundment for
    a driver charged with 'Stunt Driving' in Ontario?
  choices:
    A: 3 days
    B: 7 days
    C: 14 days
    D: 30 days
  answer: C
  explanation: Under Ontario's MOMS Act (Moving Ontarians More Safely), the roadside
    vehicle impoundment period for stunt driving is 14 days.
- id: 141
  category: penalties_and_points
  question: How many demerit points are added for failing to stop at a stop sign or
    a red light?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failing to stop for a stop sign or a red light results in 3 demerit
    points being added to your driving record.
- id: 142
  category: penalties_and_points
  question: 'A fully licensed driver convicted of a second distracted driving offense
    will face a license suspension of:'
  choices:
    A: 3 days
    B: 7 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: For a second conviction of distracted driving, a fully licensed driver
    faces a 7-day license suspension, a fine of up to $2,000, and 6 demerit points.
- id: 143
  category: penalties_and_points
  question: 'If you are convicted of failing to stop when signaled by a police officer
    and the court determines you willfully avoided the police (flight), your license
    will be suspended for a minimum of:'
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: If you are convicted of fleeing from police, the mandatory minimum
    license suspension is 5 years, and it can be as long as a lifetime suspension.
- id: 144
  category: penalties_and_points
  question: How many demerit points are recorded for 'improperly opening a vehicle
    door' (often called 'dooring' a cyclist)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 0 points (fine only)
  answer: B
  explanation: Improperly opening a vehicle door into the path of traffic or a cyclist
    results in 3 demerit points and a significant fine.
- id: 145
  category: penalties_and_points
  question: What is the range of the fine for failing to wear a seatbelt in Ontario?
  choices:
    A: $50 to $200
    B: $100 to $500
    C: $200 to $1,000
    D: $500 to $2,000
  answer: C
  explanation: In Ontario, the fine for seatbelt violations ranges from $200 to $1,000,
    plus two demerit points.
- id: 146
  category: penalties_and_points
  question: 'If you are caught driving while your license is suspended for a Criminal
    Code offense, the fine for a first offense ranges from:'
  choices:
    A: $500 to $2,000
    B: $1,000 to $5,000
    C: $2,000 to $10,000
    D: $5,000 to $25,000
  answer: D
  explanation: Driving while suspended for a Criminal Code offense carries a very
    high fine in Ontario, ranging from $5,000 to $25,000 for a first offense.
- id: 147
  category: penalties_and_points
  question: In Ontario, what is the fine for failing to stop for a pedestrian at a
    pedestrian crossover?
  choices:
    A: $100 to $500
    B: $300 to $1,000
    C: $500 to $1,500
    D: $1,000 to $2,000
  answer: B
  explanation: Drivers who fail to yield to pedestrians at crossovers or school crossings
    face fines between $300 and $1,000 and 4 demerit points.
- id: 148
  category: penalties_and_points
  question: 'For a first-time conviction of distracted driving, a fully licensed (Class
    G) driver will have their license suspended for:'
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: B
  explanation: In Ontario, a first conviction for distracted driving for a Class G
    driver includes a mandatory 3-day license suspension.
- id: 149
  category: penalties_and_points
  question: 'Under the ''Move Over'' law, failing to slow down and move over for an
    emergency vehicle with its lights flashing can result in a first-offense fine
    of:'
  choices:
    A: $100 to $500
    B: $200 to $1,000
    C: $400 to $2,000
    D: $1,000 to $5,000
  answer: C
  explanation: Ontario's 'Move Over' law carries a fine of $400 to $2,000 and 3 demerit
    points for a first offense.
- id: 150
  category: penalties_and_points
  question: In Ontario, how many demerit points are added to your record for speeding
    16 to 29 km/h over the posted limit?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Speeding between 16 and 29 km/h over the posted speed limit results
    in 3 demerit points in Ontario.
- id: 151
  category: sharing_the_road
  question: When driving on a road WITHOUT a median, how far back must you stop from
    a school bus that has its overhead red lights flashing and stop arm extended?
  choices:
    A: 5 metres
    B: 10 metres
    C: 20 metres
    D: 50 metres
  answer: C
  explanation: In Ontario, on a road without a median, motorists traveling in both
    directions must stop at least 20 metres away from a school bus with its red lights
    flashing.
- id: 152
  category: sharing_the_road
  question: What is the minimum distance a motorist must maintain when passing a cyclist
    in Ontario?
  choices:
    A: 0.5 metres
    B: 1 metre
    C: 2 metres
    D: 3 metres
  answer: B
  explanation: Ontario law requires motorists to maintain a minimum distance of one
    metre when passing a cyclist where practicable.
- id: 153
  category: sharing_the_road
  question: When a streetcar stops to let passengers on or off and there is no safety
    zone, how far behind the rear doors must a driver stop?
  choices:
    A: 1 metre
    B: 2 metres
    C: 5 metres
    D: 10 metres
  answer: B
  explanation: Drivers must stay at least two metres behind the rear doors of a streetcar
    when it is stopped to allow passengers to board or exit, unless there is a pedestrian
    safety zone.
- id: 154
  category: sharing_the_road
  question: What is the demerit point penalty for a first-time conviction of failing
    to move over for an emergency vehicle or tow truck with flashing lights?
  choices:
    A: 2 points
    B: 3 points
    C: 6 points
    D: 7 points
  answer: B
  explanation: A conviction for failing to move over for an emergency vehicle or tow
    truck results in 3 demerit points, along with a significant fine.
- id: 155
  category: sharing_the_road
  question: Why should you stay well back when following a large commercial truck?
  choices:
    A: To allow the truck driver to see you in their side mirrors
    B: To avoid the 'No-Zone' blind spots
    C: To have a better view of the road ahead
    D: All of the above
  answer: D
  explanation: Staying back allows you to see the truck's mirrors (meaning the driver
    can see you), avoids blind spots, and improves your overall visibility of traffic
    conditions.
- id: 156
  category: sharing_the_road
  question: If you are turning right at an intersection and a cyclist is positioned
    to your right and intends to go straight, who has the right of way?
  choices:
    A: The motorist, because they are larger
    B: The cyclist
    C: Whoever reaches the intersection first
    D: The motorist, because cyclists must always yield to turning cars
  answer: B
  explanation: Cyclists going straight have the right of way over motorists turning
    right. You must check your blind spot for cyclists before making a right turn.
- id: 157
  category: sharing_the_road
  question: On a highway divided by a median, do vehicles approaching a school bus
    from the front (opposite direction) need to stop when the bus has its red lights
    flashing?
  choices:
    A: Yes, they must always stop
    B: No, only vehicles following the bus must stop
    C: Yes, but only if there are more than two lanes
    D: No, but they must honk their horn
  answer: B
  explanation: On a highway divided by a median, traffic coming from the opposite
    direction of a school bus is not required to stop.
- id: 158
  category: sharing_the_road
  question: In Ontario, is 'lane splitting' (a motorcycle driving between two lanes
    of traffic) legal?
  choices:
    A: Yes, it is encouraged to reduce traffic
    B: Yes, but only at speeds under 20 km/h
    C: No, it is illegal and considered a dangerous maneuver
    D: Yes, but only on 400-series highways
  answer: C
  explanation: Lane splitting is illegal in Ontario and can result in charges such
    as careless driving or making an unsafe lane change.
- id: 159
  category: sharing_the_road
  question: What is the minimum following distance you must maintain behind a fire
    department vehicle responding to an alarm?
  choices:
    A: 50 metres
    B: 100 metres
    C: 150 metres
    D: 200 metres
  answer: C
  explanation: Section 159(3) of the Highway Traffic Act states you must not follow
    within 150 metres of a fire department vehicle responding to an alarm.
- id: 160
  category: sharing_the_road
  question: 'If you see a pedestrian using a white cane, it usually indicates that
    the person:'
  choices:
    A: Is an elderly person
    B: Has a visual impairment
    C: Is a crossing guard
    D: Is a person with a walking disability
  answer: B
  explanation: A white cane is a tool used by people who are blind or have low vision
    to navigate safely. Drivers should exercise extra caution.
- id: 161
  category: sharing_the_road
  question: What is the demerit point penalty for a driver who fails to leave the
    required 1-metre distance when passing a cyclist?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 0 points (fine only)
  answer: A
  explanation: Failing to leave a one-metre distance when passing a bicycle results
    in 2 demerit points upon conviction.
- id: 162
  category: sharing_the_road
  question: 'When a large truck is turning right at an intersection, it may often:'
  choices:
    A: Turn from the left lane
    B: Swing wide to the left before turning right
    C: Stop and back up to make the turn
    D: Speed up to clear the intersection
  answer: B
  explanation: Large trucks need more space to turn. They may swing wide to the left
    to clear the curb on a right turn. Do not attempt to pass them on the right at
    an intersection.
- id: 163
  category: sharing_the_road
  question: In a school zone, if a crossing guard is displaying a 'STOP' sign, when
    can you proceed?
  choices:
    A: As soon as the children have reached the sidewalk
    B: When the crossing guard is out of your lane
    C: Only when the crossing guard and all children have safely reached the sidewalk
      and the guard has lowered the sign
    D: If the guard signals you to go while still in the road
  answer: C
  explanation: Under the Highway Traffic Act, drivers must remain stopped until the
    crossing guard and all pedestrians have completely left the roadway.
- id: 164
  category: sharing_the_road
  question: 'When approaching a stopped emergency vehicle with its red or red and
    blue lights flashing on a highway with two or more lanes in the same direction,
    Ontario''s ''Move Over'' law requires you to:'
  choices:
    A: Stop immediately in your lane
    B: Maintain speed but honk to alert the officer
    C: Slow down and move into another lane if it can be done safely
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Ontario law requires drivers to slow down and, if safe to do so, move
    over a lane when passing a stopped emergency vehicle or tow truck with flashing
    lights.
- id: 165
  category: sharing_the_road
  question: Large commercial vehicles have 'No-Zones.' What does this term refer to?
  choices:
    A: Areas where trucks are not allowed to drive
    B: The cargo area of the truck
    C: Blind spots around the front, back, and sides of the truck
    D: The weight limit of the truck
  answer: C
  explanation: The 'No-Zone' refers to the large blind spots around a commercial truck
    where the driver cannot see other vehicles. If you cannot see the truck driver's
    face in their mirrors, they cannot see you.
- id: 166
  category: sharing_the_road
  question: In Ontario, what are the penalties for 'dooring' a cyclist (opening a
    vehicle door into the path of a cyclist)?
  choices:
    A: A $50 fine and 1 demerit point
    B: A $150 fine and no demerit points
    C: A fine of $300 to $1,000 and 3 demerit points
    D: A mandatory 7-day license suspension
  answer: C
  explanation: Ontario's 'dooring' law carries a fine between $300 and $1,000 and
    3 demerit points upon conviction.
- id: 167
  category: sharing_the_road
  question: When a school bus is stopped on a highway that has a median strip, who
    must stop when the bus has its red lights flashing?
  choices:
    A: Only vehicles approaching from the front
    B: Only vehicles coming from behind the bus
    C: Vehicles in both directions
    D: No one is required to stop on a divided highway
  answer: B
  explanation: On a highway divided by a median strip, only vehicles following the
    school bus must stop. Traffic approaching from the opposite direction (on the
    other side of the median) does not need to stop.
- id: 168
  category: sharing_the_road
  question: 'When following a motorcycle, you should allow for:'
  choices:
    A: Less following distance than a car because they are smaller
    B: The same following distance as a car
    C: At least a two-second following distance
    D: A three-second or more following distance
  answer: D
  explanation: Because motorcycles can stop very quickly and are more affected by
    road conditions, you should allow a following distance of at least three seconds
    (or more in poor weather).
- id: 169
  category: sharing_the_road
  question: 'A ''Slow Moving Vehicle'' sign is an orange triangle with a red border.
    This sign is displayed on vehicles that travel at less than:'
  choices:
    A: 20 km/h
    B: 40 km/h
    C: 60 km/h
    D: 80 km/h
  answer: B
  explanation: The slow-moving vehicle sign is required on vehicles (like farm tractors
    or construction equipment) that travel at 40 km/h or less.
- id: 170
  category: sharing_the_road
  question: In Ontario, cyclists are required by law to have which of the following
    equipment when riding from a half-hour before sunset to a half-hour after sunrise?
  choices:
    A: A white light on the front and a red light or reflector on the rear
    B: A bell or horn
    C: White reflective tape on the front forks
    D: All of the above
  answer: D
  explanation: For night riding, Ontario law requires a white light on the front,
    a red light or reflector on the rear, and white reflective tape on the front forks/red
    reflective tape on the rear stays. A bell or horn is required at all times.
- id: 171
  category: sharing_the_road
  question: 'When you hear a siren or see the flashing lights of an emergency vehicle
    approaching from any direction, you must:'
  choices:
    A: Speed up to get out of the way
    B: Pull to the right as far as possible and stop
    C: Stop exactly where you are
    D: Pull to the left and stop
  answer: B
  explanation: Drivers must pull to the right as far as possible and come to a complete
    stop until the emergency vehicle has passed, ensuring they do not block intersections
    or emergency exits.
- id: 172
  category: vehicle_information
  question: In Ontario, you are required to turn on your vehicle's headlights during
    which of the following times?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From one-half hour after sunset to one-half hour before sunrise
    D: Only when it is raining or snowing
  answer: C
  explanation: According to the Ontario Highway Traffic Act, Section 62(1), headlights
    must be turned on from one-half hour after sunset to one-half hour before sunrise,
    and at any other time when visibility is less than 150 metres.
- id: 173
  category: vehicle_information
  question: 'When using high-beam headlights, Ontario law requires you to switch to
    low beams when an oncoming vehicle is within:'
  choices:
    A: 100 metres
    B: 150 metres
    C: 200 metres
    D: 300 metres
  answer: B
  explanation: Under the Highway Traffic Act, Section 168, drivers must switch to
    low-beam headlights when an oncoming vehicle is within 150 metres to avoid blinding
    the other driver.
- id: 174
  category: vehicle_information
  question: In Ontario, what is the minimum legal tread depth for tires on a passenger
    vehicle?
  choices:
    A: 1.0 millimetre
    B: 1.5 millimetres
    C: 1.6 millimetres
    D: 2.0 millimetres
  answer: B
  explanation: Ontario Regulation 625 states that tires on a motor vehicle must not
    be worn to the point where the tread depth is less than 1.5 millimetres.
- id: 175
  category: vehicle_information
  question: Every motor vehicle in Ontario must be equipped with how many independent
    braking systems?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: 'The Highway Traffic Act, Section 64, requires every motor vehicle
    (other than a motorcycle) to have two independent braking systems: a service brake
    (foot brake) and a parking/emergency brake.'
- id: 176
  category: vehicle_information
  question: Which of the following is true regarding aftermarket window tinting on
    the windshield of a vehicle in Ontario?
  choices:
    A: It is allowed if it is less than 30% dark
    B: It is allowed only on the top 15 cm of the windshield
    C: No aftermarket tinting is allowed on the windshield
    D: It is allowed if the driver has a medical note
  answer: C
  explanation: Ontario law prohibits the application of any aftermarket window tinting
    to the windshield. For vehicles manufactured after January 1, 2017, the front
    side windows must also allow at least 70% of light to pass through.
- id: 177
  category: vehicle_information
  question: 'A motor vehicle in Ontario must be equipped with a horn that is capable
    of emitting sound audible under normal conditions from a distance of at least:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: The Highway Traffic Act, Section 75(4), requires every motor vehicle
    to be equipped with a horn in good working order capable of emitting sound audible
    from a distance of not less than 60 metres.
- id: 178
  category: vehicle_information
  question: If you are towing a trailer in Ontario that is 2.05 metres wide or more,
    what additional equipment is required?
  choices:
    A: A 'Wide Load' sign on the front of the towing vehicle
    B: Clearance lamps and reflectors
    C: A pilot vehicle following behind
    D: Extended side mirrors that reach 50cm past the trailer
  answer: B
  explanation: Under the Highway Traffic Act, trailers with a width of 2.05 metres
    or more must be equipped with clearance lamps and reflectors to indicate the width
    of the vehicle to other drivers.
- id: 179
  category: vehicle_information
  question: 'In Ontario, the rear license plate must be illuminated by a white light
    so that the plate is clearly visible from a distance of:'
  choices:
    A: 15 metres
    B: 30 metres
    C: 50 metres
    D: 100 metres
  answer: A
  explanation: The Highway Traffic Act, Section 62(19), requires the rear license
    plate to be illuminated by a white light so that the numbers on the plate are
    clearly visible from a distance of 15 metres.
- id: 180
  category: vehicle_information
  question: If your vehicle's interior rearview mirror is obstructed by a trailer
    or a load, what does Ontario law require?
  choices:
    A: You must remove the obstruction immediately
    B: You must have an exterior mirror on the left side only
    C: You must have exterior mirrors on both the left and right sides
    D: You must drive with your hazard lights on
  answer: C
  explanation: If the view from the interior rearview mirror is obstructed, the Highway
    Traffic Act requires the vehicle to be equipped with side mirrors on both the
    left and right sides to provide a clear view of the road to the rear.
- id: 181
  category: vehicle_information
  question: 'Every motor vehicle must be equipped with a muffler in good working order
    to prevent:'
  choices:
    A: Any sound from the engine
    B: Excessive or unusual noise and excessive smoke
    C: The engine from overheating
    D: The vehicle from exceeding the speed limit
  answer: B
  explanation: The Highway Traffic Act, Section 75(1), requires a muffler to prevent
    excessive or unusual noise and excessive smoke. It also prohibits the use of 'muffler
    cut-outs' or similar devices.
- id: 182
  category: vehicle_information
  question: 'A ''Slow Moving Vehicle'' sign must be displayed on the rear of any vehicle
    that is designed to travel at a speed of:'
  choices:
    A: 20 km/h or less
    B: 40 km/h or less
    C: 60 km/h or less
    D: 80 km/h or less
  answer: B
  explanation: Under the Highway Traffic Act, Section 76, a slow-moving vehicle sign
    (an orange triangle with a red border) must be displayed on the rear of any vehicle
    that operates at 40 km/h or less.
- id: 183
  category: vehicle_information
  question: 'In Ontario, it is illegal to drive a motor vehicle if a television or
    computer screen is visible to the driver, EXCEPT for:'
  choices:
    A: Watching a movie while in heavy traffic
    B: Checking social media notifications
    C: A GPS navigation screen or a screen providing vehicle information
    D: Reading a digital book
  answer: C
  explanation: The Highway Traffic Act, Section 78.1, prohibits screens visible to
    the driver, but makes exceptions for screens used for GPS navigation, vehicle
    system information, or collision avoidance.
- id: 184
  category: vehicle_information
  question: Every motor vehicle in Ontario (other than a motorcycle) must be equipped
    with which of the following for use during inclement weather?
  choices:
    A: Fog lights
    B: A windshield wiper system in good working order
    C: Snow tires between October and April
    D: Mud flaps on all four wheels
  answer: B
  explanation: The Highway Traffic Act, Section 66(2), requires every motor vehicle
    other than a motorcycle to be equipped with a windshield wiper system that is
    in good working order.
- id: 185
  category: vehicle_information
  question: In Ontario, what color of flashing light is used by volunteer firefighters
    responding to an emergency in their personal vehicles?
  choices:
    A: Red
    B: Blue
    C: Green
    D: Amber
  answer: C
  explanation: A flashing green light on a vehicle identifies a volunteer firefighter
    responding to an emergency call. Other drivers should yield the right-of-way as
    a courtesy.
- id: 186
  category: vehicle_information
  question: 'Under the Highway Traffic Act, your vehicle''s horn must be audible from
    a distance of at least:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: Ontario law requires every motor vehicle to be equipped with a horn
    that is in good working order and capable of emitting sound audible under normal
    conditions from a distance of not less than 60 metres.
- id: 187
  category: vehicle_information
  question: When are studded tires permitted for use in Northern Ontario (districts
    such as Algoma, Cochrane, Kenora, etc.)?
  choices:
    A: All year round
    B: October 1 to April 30
    C: September 1 to May 31
    D: November 1 to March 31
  answer: C
  explanation: In Northern Ontario, studded tires can be used from September 1 to
    May 31. For Southern Ontario residents, they are generally prohibited unless the
    vehicle is from out-of-province or the driver is from the North.
- id: 188
  category: vehicle_information
  question: 'In Ontario, your vehicle must have a rear-view mirror. If your view through
    the rear-view mirror is obstructed by a trailer or load, you must:'
  choices:
    A: Remove the obstruction immediately
    B: Have both a left and right external side-view mirror
    C: Drive only during daylight hours
    D: Install a camera system; mirrors are not required
  answer: B
  explanation: If the interior rear-view mirror is obstructed, the Highway Traffic
    Act requires the vehicle to be equipped with mirrors on both the left and right
    exterior sides providing a clear view of the road to the rear.
- id: 189
  category: vehicle_information
  question: 'According to Ontario law, headlights must be turned on:'
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From one-half hour before sunset to one-half hour after sunrise
    D: Only when it is raining or snowing
  answer: C
  explanation: Headlights must be turned on from one-half hour before sunset to one-half
    hour after sunrise, and at any other time when visibility is reduced to less than
    150 metres.
- id: 190
  category: vehicle_information
  question: What is the legal requirement for the condition of a vehicle's muffler
    in Ontario?
  choices:
    A: It must be loud enough to warn pedestrians
    B: It must prevent excessive or unusual noise and smoke
    C: It is only required for vehicles older than 10 years
    D: It must be chrome-plated
  answer: B
  explanation: The Highway Traffic Act requires every motor vehicle to be equipped
    with a muffler in good working order to prevent excessive or unusual noise and
    excessive smoke.
- id: 191
  category: vehicle_information
  question: Regarding license plates in Ontario, which of the following is illegal?
  choices:
    A: Using a frame that does not cover any numbers or letters
    B: Using a clear plastic cover that does not obstruct the view
    C: Using a tinted or colored cover that obstructs the view of the plate
    D: Attaching the plate to the rear bumper
  answer: C
  explanation: It is illegal to use any cover or device that obstructs or discolors
    the license plate, making it difficult for police or cameras to read.
- id: 192
  category: vehicle_information
  question: In Ontario, how many white light-emitting lamps are permitted on the rear
    of a vehicle while it is moving forward?
  choices:
    A: Zero
    B: One
    C: Two
    D: As many as the driver desires
  answer: A
  explanation: Except for the license plate light and backup lights (which only activate
    in reverse), no vehicle shall be equipped with a lamp that casts a white light
    to the rear while moving forward.
- id: 193
  category: vehicle_information
  question: If you are found to be driving a vehicle with a tampered odometer in Ontario,
    you are in violation of which act?
  choices:
    A: The Environmental Protection Act
    B: The Highway Traffic Act
    C: The Criminal Code of Canada
    D: The Consumer Protection Act
  answer: B
  explanation: Tampering with an odometer to misrepresent a vehicle's mileage is an
    offence under the Ontario Highway Traffic Act.
- id: 194
  category: signs_and_signals
  question: In Ontario, when approaching a pedestrian crossover with flashing lights,
    what must a driver do?
  choices:
    A: Stop and proceed once the pedestrian is halfway across.
    B: Slow down and proceed with caution if the pedestrian is not in your lane.
    C: Stop and remain stopped until all pedestrians have completely crossed the road.
    D: Honk to alert the pedestrian and proceed slowly.
  answer: C
  explanation: According to the Ontario Highway Traffic Act, drivers must stop and
    stay stopped until the pedestrian has completely crossed the roadway at a pedestrian
    crossover (identified by specific signs and often flashing lights).
- id: 195
  category: signs_and_signals
  question: What does a flashing blue light on top of a vehicle indicate in Ontario?
  choices:
    A: A police vehicle on an emergency call.
    B: A snow-removal vehicle in operation.
    C: A volunteer firefighter responding to a call.
    D: An ambulance or fire truck.
  answer: B
  explanation: In Ontario, flashing blue lights are used specifically on snow-removal
    vehicles to improve visibility during winter maintenance operations.
- id: 196
  category: signs_and_signals
  question: 'A traffic signal with a white vertical bar on a black background means:'
  choices:
    A: All vehicles may proceed straight through.
    B: Only emergency vehicles may proceed.
    C: Only public transit vehicles may proceed.
    D: The lane is closed for construction.
  answer: C
  explanation: A white vertical bar on a black background is a transit priority signal,
    allowing public transit buses to move through the intersection while other traffic
    remains stopped.
- id: 197
  category: signs_and_signals
  question: When a traffic light turns left-turn green arrow while the main light
    is red, what are you permitted to do?
  choices:
    A: Turn left, as you have the right-of-way.
    B: Stop and wait for the main light to turn green.
    C: Turn left only if there is no oncoming traffic.
    D: Turn right after making a complete stop.
  answer: A
  explanation: A green arrow indicates a protected turn; you may proceed in the direction
    of the arrow, and oncoming traffic will be facing a red light.
- id: 198
  category: signs_and_signals
  question: In Ontario, what does a flashing amber (yellow) light at an intersection
    mean?
  choices:
    A: Stop and wait for the light to turn green.
    B: The light is about to turn red; clear the intersection.
    C: Slow down and proceed with caution.
    D: Treat it as a four-way stop.
  answer: C
  explanation: A flashing amber light means you should slow down and proceed with
    caution through the intersection.
- id: 199
  category: signs_and_signals
  question: What is the meaning of a sign that is a red circle with a white horizontal
    bar in the middle?
  choices:
    A: No stopping.
    B: Do not enter.
    C: No parking.
    D: One-way street ahead.
  answer: B
  explanation: The 'Do Not Enter' sign is a regulatory sign indicating that traffic
    is prohibited from entering the roadway in that direction.
- id: 200
  category: signs_and_signals
  question: Which hand signal is correct for a driver intending to slow down or stop?
  choices:
    A: Left arm extended straight out the window.
    B: Left arm out and bent upward at the elbow.
    C: Left arm out and bent downward at the elbow, palm facing back.
    D: Right arm extended straight out the passenger window.
  answer: C
  explanation: To signal a stop or decrease in speed, the driver should extend their
    left arm out the window and point it downward.
- id: 201
  category: signs_and_signals
  question: A 'Slow Moving Vehicle' sign is required on vehicles that travel at what
    maximum speed?
  choices:
    A: 30 km/h or less.
    B: 40 km/h or less.
    C: 50 km/h or less.
    D: 60 km/h or less.
  answer: B
  explanation: The triangular orange sign with a red border must be displayed on the
    rear of any vehicle that travels at less than 40 km/h.
- id: 202
  category: signs_and_signals
  question: In Ontario, what does a solid white line on the left side of your lane
    indicate?
  choices:
    A: You may cross it to pass other vehicles.
    B: It separates traffic moving in the same direction; crossing is discouraged.
    C: It separates traffic moving in opposite directions.
    D: It marks the edge of the shoulder.
  answer: B
  explanation: Solid white lines are used to separate lanes of traffic moving in the
    same direction. While not strictly illegal to cross in all contexts, it is discouraged
    and often indicates that lane changes are unsafe.
- id: 203
  category: signs_and_signals
  question: What shape and color is a standard Ontario 'Yield' sign?
  choices:
    A: An upside-down triangle with a red border and white center.
    B: An octagon with a red background and white text.
    C: A diamond with a yellow background and black symbols.
    D: A square with a white background and black text.
  answer: A
  explanation: The yield sign is an equilateral triangle pointing downward, with a
    red border and a white interior.
- id: 204
  category: signs_and_signals
  question: 'A sign showing a green circle with a straight-ahead arrow inside means:'
  choices:
    A: You must go straight only.
    B: You may go straight or turn.
    C: One-way street ahead.
    D: Hidden intersection ahead.
  answer: A
  explanation: A green circle is a permissive sign. When it contains a straight arrow,
    it indicates that you are only permitted to go straight through the intersection.
- id: 205
  category: signs_and_signals
  question: What is the purpose of a 'Bike Box' (a painted green area with a white
    bicycle symbol) at an intersection?
  choices:
    A: It is a parking spot for bicycles only.
    B: It allows cyclists to pull in front of stopped traffic to be more visible.
    C: It is a loading zone for delivery trucks.
    D: It indicates a high-speed cycling lane.
  answer: B
  explanation: Bike boxes are designed to increase the visibility of cyclists at intersections
    by allowing them to wait in front of motorized traffic at a red light.
- id: 206
  category: signs_and_signals
  question: What does a sign with an orange background and black symbols typically
    indicate?
  choices:
    A: Regulatory rules like speed limits.
    B: Points of interest and services.
    C: Temporary conditions or construction zones.
    D: School zones and pedestrian crossings.
  answer: C
  explanation: In Ontario, orange signs are used for temporary conditions, such as
    road construction, maintenance, or traffic detours.
- id: 207
  category: signs_and_signals
  question: 'A white diamond symbol painted on a lane in Ontario indicates:'
  choices:
    A: A railway crossing ahead
    B: A high-occupancy vehicle (HOV) or reserved lane
    C: A pedestrian crossover
    D: An area where passing is permitted
  answer: B
  explanation: The diamond symbol marks lanes reserved for specific vehicles, such
    as buses, taxis, or vehicles with a minimum number of occupants (HOV).
- id: 208
  category: signs_and_signals
  question: 'In Ontario, a flashing green light at an intersection (advanced green)
    means:'
  choices:
    A: You must stop and wait for it to turn solid green
    B: You may turn left, go straight, or turn right while opposing traffic is facing
      a red light
    C: The light is about to turn red immediately
    D: Pedestrians have the right of way in all directions
  answer: B
  explanation: A flashing green light or a green arrow with a green light is an 'advanced'
    signal that allows you to turn left, go straight, or turn right while oncoming
    traffic is stopped by a red light.
- id: 209
  category: signs_and_signals
  question: When approaching a flashing red traffic signal at an intersection, what
    must you do?
  choices:
    A: Slow down and proceed with caution without stopping
    B: Stop and wait for the light to turn solid green
    C: Stop, and proceed only when it is safe to do so
    D: Yield to traffic from the right only, then proceed
  answer: C
  explanation: A flashing red light must be treated the same as a stop sign. You must
    come to a complete stop and proceed only when it is safe.
- id: 210
  category: signs_and_signals
  question: 'A sign in the shape of a pentagon (five-sided) is used in Ontario for:'
  choices:
    A: Stop signs
    B: Yield signs
    C: School zones or school crossings
    D: Hospital zones
  answer: C
  explanation: Pentagon-shaped signs are specifically used to warn drivers they are
    entering a school zone or approaching a school crossing.
- id: 211
  category: signs_and_signals
  question: If your vehicle's turn signals are not working, what is the correct hand
    signal for a right turn?
  choices:
    A: Left arm extended straight out the window
    B: Left arm out the window and bent upward at the elbow
    C: Left arm out the window and pointing toward the ground
    D: Right arm extended straight out the window
  answer: B
  explanation: To signal a right turn using hand signals, the driver extends the left
    arm out the window and bends it upward at the elbow.
- id: 212
  category: signs_and_signals
  question: What does a solid white line on the pavement between two lanes of traffic
    moving in the same direction mean?
  choices:
    A: You may change lanes at any time
    B: It marks the edge of the roadway only
    C: Lane changing is discouraged or prohibited
    D: It is a dedicated lane for emergency vehicles
  answer: C
  explanation: A solid white line between lanes of traffic indicates that lane changing
    is discouraged or may be illegal in certain contexts (like approaching an intersection).
- id: 213
  category: signs_and_signals
  question: 'In Ontario, a ''Transit Priority'' signal is identified by:'
  choices:
    A: A flashing blue light
    B: A steady white vertical bar on a black background
    C: A double green light
    D: A flashing yellow arrow
  answer: B
  explanation: Transit priority signals allow buses to bypass traffic. They are shown
    as a vertical white bar on a black background above the regular traffic lights.
- id: 214
  category: signs_and_signals
  question: 'When you see a regulatory sign with a red circle and a black bar inside
    it (no symbol), it means:'
  choices:
    A: Do not enter
    B: Road closed ahead
    C: Yield to oncoming traffic
    D: No parking
  answer: A
  explanation: The 'Do Not Enter' sign is a square white sign with a red circle containing
    a horizontal white bar (or sometimes a black bar in older variations/diagrams),
    indicating you cannot enter that road.
- id: 215
  category: signs_and_signals
  question: At a pedestrian crossover, what must a driver do when a pedestrian is
    waiting to cross or is crossing?
  choices:
    A: Slow down and proceed if the pedestrian is not in your lane
    B: Stop and remain stopped until the pedestrian has completely crossed the entire
      roadway
    C: Honk to let the pedestrian know you are passing
    D: Only stop if the pedestrian has stepped off the curb
  answer: B
  explanation: Under Ontario law, drivers and cyclists must stop and yield the entire
    width of the roadway at pedestrian crossovers and school crossings where there
    is a crossing guard.
- id: 216
  category: signs_and_signals
  question: 'A green circle on a white sign with a black symbol inside indicates:'
  choices:
    A: The action shown is prohibited
    B: The action shown is mandatory
    C: The action shown is permitted
    D: A warning of hazards ahead
  answer: C
  explanation: In Ontario's sign system, a green circle means you may do the activity
    shown inside the circle.
- id: 217
  category: signs_and_signals
  question: A 'Slow Moving Vehicle' sign, required on vehicles traveling less than
    40 km/h, is what shape and color?
  choices:
    A: A yellow diamond
    B: A triangular sign with an orange center and red border
    C: A white rectangle with black lettering
    D: A blue square with a white border
  answer: B
  explanation: The slow-moving vehicle sign is a highly reflective orange triangle
    with a red border, used on farm tractors and heavy equipment.
- id: 218
  category: signs_and_signals
  question: When a streetcar is stopped to take on or discharge passengers where there
    is no safety zone, what does Ontario law require you to do?
  choices:
    A: Pass on the left with caution
    B: Stop 2 metres behind the rear doors of the streetcar
    C: Stop 5 metres behind the rear doors of the streetcar
    D: Slow down to 10 km/h and pass carefully
  answer: B
  explanation: Drivers must stay at least 2 metres behind the rear doors of a stopped
    streetcar to allow passengers to board or exit safely when there is no safety
    island.
- id: 219
  category: signs_and_signals
  question: What do broken yellow lines on a roadway indicate?
  choices:
    A: You are on a one-way street
    B: You may pass if the way is clear
    C: You must never pass
    D: The lane is for emergency vehicles only
  answer: B
  explanation: Broken yellow lines separate lanes of traffic moving in opposite directions;
    you may pass when it is safe to do so.
