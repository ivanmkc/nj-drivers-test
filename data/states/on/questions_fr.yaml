questions:
- id: 1
  category: license_system
  question: En Ontario, un conducteur titulaire d'un permis G1 doit être accompagné
    d'un conducteur titulaire d'un permis complet ayant au moins combien d'années
    d'expérience de conduite ?
  choices:
    A: 2 ans
    B: 3 ans
    C: 4 ans
    D: 5 ans
  answer: C
  explanation: Selon le ministère des Transports de l'Ontario, le conducteur accompagnateur
    doit détenir un permis de catégorie G valide (ou plus élevé) et avoir au moins
    quatre ans d'expérience de conduite.
- id: 2
  category: license_system
  question: En vertu du système de délivrance graduelle des permis de l'Ontario, quelle
    est la limite de taux d'alcoolémie (BAC) pour les conducteurs G1 et G2 ?
  choices:
    A: 0,00 %
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: Les conducteurs novices (G1, G2, M1, M2) et tous les conducteurs âgés
    de 21 ans et moins doivent avoir un taux d'alcoolémie de zéro lorsqu'ils conduisent.
- id: 3
  category: license_system
  question: Un conducteur G1 a l'interdiction de conduire entre quelles heures ?
  choices:
    A: 23 h 00 à 4 h 00
    B: Minuit (00 h 00) à 5 h 00
    C: 1 h 00 à 6 h 00
    D: 21 h 00 à 6 h 00
  answer: B
  explanation: Les conducteurs G1 ont l'interdiction de conduire entre minuit (00
    h 00) et 5 h 00.
- id: 4
  category: license_system
  question: Si vous changez de nom ou d'adresse, vous devez en aviser le ministère
    des Transports dans un délai de combien de jours ?
  choices:
    A: 6 jours
    B: 10 jours
    C: 14 jours
    D: 30 jours
  answer: A
  explanation: La loi de l'Ontario exige que vous informiez le ministère des Transports
    de tout changement de nom ou d'adresse dans les six jours suivant le changement.
- id: 5
  category: license_system
  question: Un conducteur G2 âgé de 19 ans ou moins, conduisant entre minuit et 5
    h 00, est limité à combien de passagers âgés de 19 ans ou moins pendant les six
    premiers mois suivant l'obtention de son permis ?
  choices:
    A: Zéro passager
    B: Un passager
    C: Deux passagers
    D: Trois passagers
  answer: B
  explanation: Pendant les six premiers mois, les conducteurs G2 âgés de 19 ans ou
    moins ne peuvent transporter qu'un seul passager âgé de 19 ans ou moins entre
    minuit et 5 h 00. Après six mois, la limite passe à trois passagers.
- id: 6
  category: license_system
  question: Quel est l'âge minimum pour demander un permis de conduire G1 en Ontario
    ?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: C
  explanation: Vous devez avoir au moins 16 ans pour demander un permis d'apprenti
    conducteur de niveau 1 (G1) en Ontario.
- id: 7
  category: license_system
  question: 'Si un conducteur G1 suit avec succès un cours de conduite pour débutants
    approuvé par le gouvernement, la période d''attente obligatoire avant l''examen
    de conduite G1 est réduite de 12 mois à :'
  choices:
    A: 4 mois
    B: 6 mois
    C: 8 mois
    D: 10 mois
  answer: C
  explanation: Le fait de suivre un cours de conduite approuvé réduit la période d'attente
    du permis G1 de 12 mois à 8 mois.
- id: 8
  category: license_system
  question: Pour un conducteur novice (G1 ou G2), combien de points d'inaptitude entraînent
    une suspension de permis de 60 jours ?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: B
  explanation: Les conducteurs novices s'exposent à une suspension de permis de 60
    jours s'ils accumulent 9 points d'inaptitude ou plus.
- id: 9
  category: license_system
  question: 'Le conducteur accompagnateur d''un titulaire de permis G1 doit avoir
    un taux d''alcoolémie (BAC) inférieur à :'
  choices:
    A: 0,00 %
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: C
  explanation: Le conducteur accompagnateur doit avoir un taux d'alcoolémie inférieur
    à 0,05 % s'il est âgé de 22 ans ou plus. Si le conducteur accompagnateur a 21
    ans ou moins, son taux d'alcoolémie doit être de zéro.
- id: 10
  category: license_system
  question: Sur laquelle des autoroutes suivantes un conducteur G1 n'est-il généralement
    PAS autorisé à conduire, à moins d'être accompagné d'un moniteur de conduite certifié
    ?
  choices:
    A: Autoroute 7
    B: Autoroute 401
    C: Autoroute 17
    D: Toute route de gravier
  answer: B
  explanation: Il est interdit aux conducteurs G1 de circuler sur les autoroutes de
    la série 400 (comme la 401, 400, 404, etc.) et les voies rapides comme la QEW
    ou la Don Valley Parkway, sauf s'ils sont accompagnés d'un moniteur certifié.
- id: 11
  category: license_system
  question: En Ontario, quelle est la « sanction progressive » pour un conducteur
    de catégorie G1 ou G2 reconnu coupable d'avoir enfreint les conditions du système
    de délivrance graduelle des permis (GDL) pour la première fois ?
  choices:
    A: Une lettre d'avertissement
    B: Une suspension de permis de 30 jours
    C: Une suspension de permis de 90 jours
    D: L'annulation permanente du permis
  answer: B
  explanation: 'Pour les conducteurs novices, la première condamnation pour violation
    des conditions du système de délivrance graduelle des permis (GDL) (ex. : taux
    d''alcoolémie, conduite de nuit, limites de passagers) entraîne une suspension
    de permis de 30 jours.'
- id: 12
  category: license_system
  question: Un conducteur titulaire d'un permis complet (catégorie G) verra son permis
    suspendu pendant 30 jours s'il accumule combien de points d'inaptitude ?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: D
  explanation: Les conducteurs titulaires d'un permis complet font face à une suspension
    de 30 jours s'ils atteignent 15 points d'inaptitude.
- id: 13
  category: license_system
  question: Lorsqu'une personne s'installe en Ontario en provenance d'une autre province
    ou d'un autre pays, elle doit immatriculer son véhicule dans un délai de combien
    de jours ?
  choices:
    A: 14 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: B
  explanation: Les nouveaux résidents de l'Ontario doivent immatriculer leur véhicule
    automobile dans les 30 jours suivant leur installation dans la province.
- id: 14
  category: license_system
  question: Pendant combien de temps un permis de conduire de catégorie G est-il généralement
    valide avant de devoir être renouvelé ?
  choices:
    A: 2 ans
    B: 3 ans
    C: 5 ans
    D: 10 ans
  answer: C
  explanation: En Ontario, un permis de conduire standard est généralement valide
    pendant cinq ans et expire le jour de l'anniversaire du conducteur.
- id: 15
  category: license_system
  question: Laquelle des conditions suivantes est requise pour obtenir un permis G2
    ?
  choices:
    A: Réussir un examen théorique écrit
    B: Réussir un test de vue
    C: Réussir l'examen de conduite G1
    D: Effectuer 100 heures de conduite de nuit
  answer: C
  explanation: Pour passer d'un permis G1 à un permis G2, un conducteur doit réussir
    l'examen de conduite G1 (examen de conduite de niveau 1) qui évalue les compétences
    de conduite de base.
- id: 16
  category: license_system
  question: En Ontario, pendant combien de temps les points d'inaptitude restent-ils
    dans votre dossier de conduite à compter de la date de l'infraction ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: B
  explanation: Selon le ministère des Transports de l'Ontario, les points d'inaptitude
    restent à votre dossier pendant deux ans à compter de la date de l'infraction.
- id: 17
  category: license_system
  question: Quelle est l'amende minimale pour une première condamnation pour avoir
    omis de s'arrêter devant un autobus scolaire dont les feux rouges clignotent en
    Ontario ?
  choices:
    A: 200 $
    B: 400 $
    C: 1 000 $
    D: 2 000 $
  answer: B
  explanation: Pour une première infraction consistant à ne pas s'arrêter pour un
    autobus scolaire, l'amende varie de 400 $ à 2 000 $ et comprend six points d'inaptitude.
- id: 18
  category: license_system
  question: En vertu des lois de l'Ontario sur la « conduite acrobatique » (stunt
    driving), quelle est la durée de la suspension immédiate du permis de conduire
    sur le bord de la route ?
  choices:
    A: 3 jours
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: C
  explanation: Si vous êtes accusé de conduite acrobatique ou de course de rue, votre
    permis est suspendu immédiatement sur le bord de la route pour une durée de 14
    jours.
- id: 19
  category: license_system
  question: Un conducteur titulaire d'un permis complet (catégorie G) reconnu coupable
    de conduite distraite pour la première fois recevra combien de points d'inaptitude
    ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Une première condamnation pour conduite distraite en Ontario entraîne
    une amende, une suspension de permis de 3 jours et 3 points d'inaptitude.
- id: 20
  category: license_system
  question: Quels professionnels sont légalement tenus de signaler au ministère des
    Transports si un patient présente un état de santé susceptible de rendre la conduite
    dangereuse ?
  choices:
    A: Uniquement les médecins de famille
    B: Les médecins, les optométristes et les infirmiers praticiens
    C: Uniquement les agents de police
    D: Uniquement les pharmaciens
  answer: B
  explanation: En Ontario, les médecins, les optométristes et les infirmiers praticiens
    sont tenus par la loi de signaler les patients qui présentent certains problèmes
    de santé à haut risque.
- id: 21
  category: license_system
  question: Une fois qu'un conducteur en Ontario atteint l'âge de 80 ans, à quelle
    fréquence doit-il participer à une séance de renouvellement de permis ?
  choices:
    A: Chaque année
    B: Tous les 2 ans
    C: Tous les 5 ans
    D: Uniquement s'il a un accident
  answer: B
  explanation: Les conducteurs âgés de 80 ans et plus doivent renouveler leur permis
    de conduire tous les deux ans, ce qui comprend un test de vision et une séance
    d'éducation de groupe.
- id: 22
  category: license_system
  question: Combien de points d'inaptitude sont ajoutés à votre dossier pour une condamnation
    pour « suivi de trop près » ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Le suivi de trop près est une infraction entraînant 4 points d'inaptitude
    en Ontario.
- id: 23
  category: license_system
  question: En Ontario, le fait de ne pas rester sur les lieux d'un accident entraîne
    combien de points d'inaptitude ?
  choices:
    A: 3 points
    B: 5 points
    C: 6 points
    D: 7 points
  answer: D
  explanation: Le fait de ne pas rester sur les lieux d'un accident est l'une des
    infractions les plus graves au Code de la route (HTA) et entraîne 7 points d'inaptitude.
- id: 24
  category: license_system
  question: 'Pour une première condamnation pour conduite distraite, un conducteur
    de l''Ontario titulaire d''un permis complet s''expose à une suspension de permis
    obligatoire de :'
  choices:
    A: 3 jours
    B: 7 jours
    C: 30 jours
    D: 60 jours
  answer: A
  explanation: Selon la loi de l'Ontario, une première condamnation pour conduite
    distraite entraîne une suspension de permis obligatoire de 3 jours dès la condamnation.
- id: 25
  category: license_system
  question: Quelle catégorie de permis est requise pour conduire une motocyclette
    en Ontario ?
  choices:
    A: Catégorie A
    B: Catégorie D
    C: Catégorie G
    D: Catégorie M
  answer: D
  explanation: Un permis de catégorie M est requis pour conduire des motocyclettes,
    des tricycles à moteur, des cyclomoteurs à vitesse limitée et des vélos à aide
    motrice.
- id: 26
  category: license_system
  question: Quelle est l'amende maximale pour une condamnation pour « conduite imprudente
    » en Ontario ?
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: C
  explanation: La conduite imprudente entraîne une amende de 400 $ à 2 000 $, 6 points
    d'inaptitude, et une possible peine d'emprisonnement ou suspension de permis.
- id: 27
  category: license_system
  question: Si votre permis de conduire de l'Ontario est suspendu pour quelque raison
    que ce soit, quels sont les frais administratifs que vous devez payer pour le
    rétablir ?
  choices:
    A: 150 $
    B: 198 $
    C: 281 $
    D: 350 $
  answer: C
  explanation: Selon les règlements actuels de l'Ontario, les frais administratifs
    pour le rétablissement du permis après une suspension sont de 281 $.
- id: 28
  category: license_system
  question: 'Si un conducteur titulaire d''un permis complet est pris dans la « zone
    d''avertissement » (BAC de 0,05 à 0,08) pour la première fois, son permis sera
    suspendu sur-le-champ pour :'
  choices:
    A: 12 heures
    B: 24 heures
    C: 3 jours
    D: 7 jours
  answer: C
  explanation: En Ontario, une première infraction dans la « zone d'avertissement
    » (taux d'alcoolémie ou BAC de 0,05 à 0,08) entraîne une suspension immédiate
    du permis de conduire de 3 jours sur les lieux.
- id: 29
  category: driver_testing
  question: En Ontario, les conducteurs âgés de 80 ans et plus doivent se soumettre
    à un processus de renouvellement tous les combien d'années ?
  choices:
    A: Chaque année
    B: Tous les 2 ans
    C: Tous les 5 ans
    D: Tous les 10 ans
  answer: B
  explanation: Lorsqu'un conducteur atteint l'âge de 80 ans, il doit renouveler son
    permis tous les deux ans. Le processus comprend un test de vision, un examen du
    dossier de conduite et une séance d'éducation de groupe.
- id: 30
  category: driver_testing
  question: 'Pour satisfaire aux normes de vision pour un permis de catégorie G en
    Ontario, votre acuité visuelle doit être d''au moins :'
  choices:
    A: 20/20 dans chaque œil
    B: 20/30 dans le meilleur œil
    C: 20/50 avec les deux yeux ouverts et examinés ensemble
    D: 20/100 dans au moins un œil
  answer: C
  explanation: Les normes de vision de l'Ontario exigent une acuité visuelle d'au
    moins 20/50 avec les deux yeux ouverts et examinés ensemble, avec ou sans lentilles
    correctrices.
- id: 31
  category: driver_testing
  question: 'Si un conducteur titulaire d''un permis complet est reconnu coupable
    de conduite distraite pour la première fois, l''amende minimale s''il règle l''affaire
    hors cour est d''environ :'
  choices:
    A: 110 $
    B: 300 $
    C: 615 $
    D: 1 500 $
  answer: C
  explanation: En Ontario, une première condamnation pour conduite distraite entraîne
    une amende fixée à 615 $ (incluant la surtaxe de la victime et les frais de justice)
    si l'affaire est réglée hors cour.
- id: 32
  category: driver_testing
  question: En vertu de la loi ontarienne « Tassez-vous » (Move Over), quelle est
    l'amende pour une première infraction en cas de défaut de se tasser pour un véhicule
    d'urgence dont les feux clignotent ?
  choices:
    A: 100 $ à 500 $
    B: 400 $ à 2 000 $
    C: 1 000 $ à 5 000 $
    D: 50 $ à 100 $
  answer: B
  explanation: Le fait de ne pas se tasser pour un véhicule d'urgence ou une dépanneuse
    dont les feux clignotent entraîne une amende de 400 $ à 2 000 $ et 3 points d'inaptitude
    pour une première infraction.
- id: 33
  category: driver_testing
  question: En Ontario, le conducteur est responsable de s'assurer que tous les passagers
    de moins de quel âge sont correctement attachés ?
  choices:
    A: Moins de 12 ans
    B: Moins de 16 ans
    C: Moins de 18 ans
    D: Moins de 21 ans
  answer: B
  explanation: Les conducteurs sont responsables de s'assurer que tous les passagers
    de moins de 16 ans sont correctement attachés par une ceinture de sécurité ou
    un siège d'auto pour enfant approprié.
- id: 34
  category: driver_testing
  question: Quelle est l'amende minimale pour avoir omis de s'arrêter lorsqu'un agent
    de police en donne l'ordre en Ontario ?
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: B
  explanation: Si vous ne vous arrêtez pas pour un agent de police, vous pouvez être
    condamné à une amende comprise entre 1 000 $ et 10 000 $, et vous pourriez faire
    face à une peine d'emprisonnement ou à une suspension de permis.
- id: 35
  category: driver_testing
  question: En Ontario, les conducteurs G1 et G2 doivent avoir une présence nulle
    de quelle substance dans leur organisme en conduisant ?
  choices:
    A: Alcool uniquement
    B: Cannabis uniquement
    C: Drogues illégales uniquement
    D: À la fois l'alcool et les drogues (y compris le cannabis)
  answer: D
  explanation: L'Ontario applique une politique de tolérance zéro pour l'alcool et
    les drogues (y compris le THC/cannabis) pour tous les conducteurs novices (G1,
    G2, M1, M2) et les conducteurs de 21 ans et moins.
- id: 36
  category: driver_testing
  question: 'Lorsqu''il dépasse un cycliste, la loi de l''Ontario exige que le conducteur
    maintienne une distance minimale de :'
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 2 mètres
    D: 3 mètres
  answer: B
  explanation: La « règle du un mètre » exige que les automobilistes maintiennent
    une distance minimale d'un mètre lorsqu'ils dépassent un cycliste, lorsque cela
    est possible.
- id: 37
  category: driver_testing
  question: 'Lors d''un examen de conduite en Ontario, votre test peut être annulé
    si votre véhicule présente l''une des défectuosités suivantes :'
  choices:
    A: Un pare-brise sale
    B: Un feu de freinage non fonctionnel
    C: Un bas niveau de carburant
    D: Un enjoliveur manquant
  answer: B
  explanation: Pour des raisons de sécurité, les examinateurs annuleront un examen
    de conduite si le véhicule n'est pas en bon état de fonctionnement, ce qui inclut
    les feux de freinage non fonctionnels, les clignotants ou les pare-brise fissurés
    qui obstruent la vision.
- id: 38
  category: driver_testing
  question: Si votre permis G2 expire avant que vous ne passiez votre examen de conduite
    G, que devez-vous faire ?
  choices:
    A: Payer des frais de retard et le renouveler immédiatement
    B: Demander une prolongation automatique de 6 mois
    C: Recommencer le processus de délivrance graduelle des permis depuis le début
      (G1)
    D: Passer uniquement l'examen de la vue pour le récupérer
  answer: C
  explanation: Si un permis novice (G1 ou G2) expire, vous devez recommencer le processus
    depuis le début, y compris l'examen théorique et les périodes d'attente, à moins
    que vous n'ayez un examen de conduite réservé avant la date d'expiration.
- id: 39
  category: driver_testing
  question: 'Pour une première infraction au Code criminel liée à la conduite avec
    facultés affaiblies, un conducteur s''expose à une suspension de permis obligatoire
    d''au moins :'
  choices:
    A: 30 jours
    B: 90 jours
    C: 1 an
    D: 3 ans
  answer: C
  explanation: Une première condamnation en vertu du Code criminel pour conduite avec
    facultés affaiblies entraîne une suspension de permis ordonnée par le tribunal
    d'une durée minimale d'un an.
- id: 40
  category: driver_testing
  question: Combien de points d'inaptitude sont attribués pour avoir omis de céder
    le passage à un piéton à un passage pour piétons ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Le fait de ne pas céder le passage à un piéton à un passage pour piétons
    entraîne 4 points d'inaptitude et une amende importante.
- id: 41
  category: driver_testing
  question: En Ontario, si vous approchez d'un véhicule de secours dont les feux rouges
    ou rouges et bleus clignotent et qu'il est arrêté sur le bord de la route, que
    devez-vous faire selon la loi sur l'obligation de changer de voie (« Move Over
    ») ?
  choices:
    A: S'arrêter immédiatement et attendre que le véhicule se déplace
    B: Maintenir votre vitesse mais klaxonner pour alerter les intervenants d'urgence
    C: Ralentir et, si cela peut se faire en toute sécurité, changer de voie
    D: Accélérer pour dépasser le véhicule le plus rapidement possible
  answer: C
  explanation: La loi ontarienne sur l'obligation de changer de voie (« Move Over
    ») exige que les conducteurs ralentissent et dépassent avec prudence lorsqu'un
    véhicule de secours est arrêté avec ses feux clignotants. Si la route comporte
    plusieurs voies, vous devez changer de voie si cela peut être fait en toute sécurité.
- id: 42
  category: driver_testing
  question: Lorsqu'un tramway est arrêté pour prendre ou déposer des passagers et
    qu'il n'y a pas d'îlot de sécurité, quelle est la distance minimale à laquelle
    vous devez rester derrière les portes arrière ?
  choices:
    A: 1 mètre
    B: 2 mètres
    C: 3 mètres
    D: 5 mètres
  answer: B
  explanation: En vertu du Code de la route, les conducteurs doivent rester à au moins
    2 mètres derrière les portes arrière d'un tramway lorsqu'il est arrêté pour des
    passagers, à moins qu'il n'y ait un îlot de sécurité désigné.
- id: 43
  category: driver_testing
  question: 'En Ontario, vous devez signaler une collision à la police ou à un centre
    de rapport de collision si les dommages totaux à tous les véhicules et à la propriété
    semblent être supérieurs à :'
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: C
  explanation: Les collisions doivent être signalées à la police s'il y a des blessés
    ou si les dommages matériels totaux à tous les véhicules impliqués semblent s'élever
    à 2 000 $ ou plus.
- id: 44
  category: driver_testing
  question: Combien de points d'inaptitude seront ajoutés à votre dossier de conduite
    de l'Ontario pour une condamnation pour excès de vitesse de 30 à 49 km/h au-dessus
    de la limite de vitesse ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Un excès de vitesse de 30 à 49 km/h au-dessus de la limite affichée
    entraîne 4 points d'inaptitude en Ontario.
- id: 45
  category: driver_testing
  question: En approchant d'un passage pour piétons en Ontario, quand êtes-vous autorisé
    à conduire votre véhicule à travers le passage ?
  choices:
    A: Dès que le piéton n'est plus dans votre voie
    B: Seulement après que le piéton a complètement traversé la route et se trouve
      sur le trottoir
    C: Si le piéton vous fait signe de passer
    D: Si le piéton a dépassé la moitié du chemin
  answer: B
  explanation: Aux passages pour piétons et aux passages d'écoliers, les conducteurs
    doivent attendre que les piétons aient complètement traversé la route (d'un trottoir
    à l'autre) avant de continuer.
- id: 46
  category: driver_testing
  question: Quelle est la limite du taux d'alcoolémie (BAC) pour qu'un conducteur
    titulaire d'un permis complet (catégorie G) se trouve dans la « fourchette d'avertissement
    » en Ontario ?
  choices:
    A: 0,02 à 0,05
    B: 0,05 à 0,08
    C: 0,08 à 0,10
    D: Supérieur à 0,08
  answer: B
  explanation: En Ontario, la « fourchette d'avertissement » pour les conducteurs
    titulaires d'un permis complet est un taux d'alcoolémie (BAC) compris entre 0,05
    et 0,08. Conduire dans cette fourchette peut entraîner une suspension immédiate
    du permis sur le bord de la route.
- id: 47
  category: driver_testing
  question: Lorsque vous conduisez de nuit, à quelle distance d'un véhicule que vous
    suivez devez-vous passer des feux de route aux feux de croisement ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 150 mètres
    D: 200 mètres
  answer: B
  explanation: Vous devez passer aux feux de croisement lorsque vous suivez un autre
    véhicule à moins de 60 mètres, ou lorsque vous croisez un véhicule venant en sens
    inverse à moins de 150 mètres.
- id: 48
  category: driver_testing
  question: En entrant dans un carrefour giratoire en Ontario, qui a la priorité ?
  choices:
    A: La circulation entrant dans le carrefour giratoire
    B: La circulation déjà engagée dans le carrefour giratoire
    C: Le véhicule circulant à la vitesse la plus élevée
    D: Le véhicule entrant par la droite
  answer: B
  explanation: Les conducteurs entrant dans un carrefour giratoire doivent céder le
    passage à la circulation qui y circule déjà.
- id: 49
  category: driver_testing
  question: En Ontario, si vous êtes reconnu coupable de ne pas vous être arrêté pour
    un autobus scolaire pour la deuxième fois, quelle est l'amende maximale à laquelle
    vous pourriez faire face ?
  choices:
    A: 1 000 $
    B: 2 000 $
    C: 4 000 $
    D: 6 000 $
  answer: C
  explanation: Pour une deuxième condamnation ou une condamnation subséquente pour
    omission de s'arrêter pour un autobus scolaire, l'amende varie de 1 000 $ à 4
    000 $, et vous pourriez également faire face à une peine d'emprisonnement allant
    jusqu'à six mois.
- id: 50
  category: driver_testing
  question: 'Lorsque vous garez votre véhicule en pente descendante sur une rue avec
    un trottoir, vous devez tourner votre volant :'
  choices:
    A: Vers la gauche (vers le centre de la route)
    B: Vers la droite (vers le trottoir)
    C: Garder les roues droites
    D: Cela n'a pas d'importance
  answer: B
  explanation: Lorsque vous vous garez en pente descendante, vous devez tourner vos
    roues vers le trottoir (à droite) de sorte que si le véhicule se met à rouler,
    il butera contre le trottoir et s'arrêtera.
- id: 51
  category: driver_testing
  question: En Ontario, quelle est la politique de tolérance zéro concernant les drogues
    pour les conducteurs débutants (G1, G2, M1, M2) ?
  choices:
    A: Ils peuvent avoir une petite quantité de THC dans leur organisme
    B: Ils peuvent consommer des drogues s'ils ont une prescription médicale
    C: Ils ne doivent avoir aucune présence de cannabis ou d'autres drogues dans leur
      organisme
    D: La politique ne s'applique qu'à l'alcool, pas aux drogues
  answer: C
  explanation: Les conducteurs débutants (G1, G2, etc.) et les jeunes conducteurs
    de moins de 22 ans sont soumis à une exigence de tolérance zéro pour l'alcool
    et les drogues (y compris le cannabis) au volant.
- id: 52
  category: driver_testing
  question: 'Si vous êtes impliqué dans un accident où quelqu''un est blessé, vous
    devez :'
  choices:
    A: Le signaler immédiatement à la police
    B: Le signaler uniquement si les dommages dépassent 2 000 $
    C: Attendre 24 heures avant de le signaler
    D: Le signaler uniquement à votre compagnie d'assurance
  answer: A
  explanation: Toute collision impliquant des blessures corporelles, quel que soit
    le montant des dommages matériels, doit être signalée immédiatement à la police.
- id: 53
  category: driver_testing
  question: Laquelle des propositions suivantes décrit le signal manuel correct pour
    un virage à droite ?
  choices:
    A: Le bras gauche tendu horizontalement par la fenêtre
    B: Le bras gauche sorti et plié vers le haut au niveau du coude
    C: Le bras gauche sorti et plié vers le bas au niveau du coude
    D: Le bras droit tendu horizontalement par la fenêtre
  answer: B
  explanation: Le signal manuel pour un virage à droite consiste à sortir le bras
    gauche par la fenêtre et à le plier vers le haut au niveau du coude.
- id: 54
  category: driver_responsibility
  question: Quelle est l'amende minimale pour une première condamnation pour conduite
    d'un véhicule à moteur sans assurance valide en Ontario ?
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 500 $
    D: 5 000 $
  answer: D
  explanation: En vertu de la Loi sur l'assurance-automobile obligatoire de l'Ontario,
    l'amende minimale pour une première infraction de conduite sans assurance est
    de 5 000 $, plus une suramende compensatoire pour les victimes de 25 %.
- id: 55
  category: driver_responsibility
  question: Lors de la vente d'un véhicule d'occasion à titre privé en Ontario, le
    vendeur est légalement tenu de fournir quel document à l'acheteur ?
  choices:
    A: Une trousse d'information sur les véhicules d'occasion (TIVO / UVIP)
    B: Un dossier de conduite de 10 ans
    C: Une demande d'assurance vierge
    D: Une vérification certifiée du casier judiciaire
  answer: A
  explanation: En Ontario, les vendeurs privés doivent fournir à l'acheteur une trousse
    d'information sur les véhicules d'occasion (UVIP) qui contient l'historique du
    véhicule et les informations sur les privilèges (liens).
- id: 56
  category: driver_responsibility
  question: Si vous êtes impliqué dans une collision où quelqu'un est blessé, quelle
    est votre obligation légale immédiate ?
  choices:
    A: Se rendre à l'hôpital le plus proche pour le signaler
    B: Rester sur les lieux et porter toute l'assistance possible
    C: Appeler votre compagnie d'assurance avant de parler à qui que ce soit
    D: Laisser vos coordonnées sur une note et continuer à conduire
  answer: B
  explanation: Le Code de la route exige que les conducteurs impliqués dans un accident
    restent sur les lieux ou y retournent immédiatement et portent assistance à toute
    personne blessée.
- id: 57
  category: driver_responsibility
  question: Après l'achat d'un véhicule d'occasion auprès d'un vendeur privé, l'acheteur
    doit enregistrer le transfert de propriété dans un centre ServiceOntario dans
    un délai de combien de jours ?
  choices:
    A: 2 jours
    B: 6 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: En Ontario, l'acheteur d'un véhicule d'occasion doit enregistrer le
    transfert de propriété dans les 6 jours suivant la date d'achat.
- id: 58
  category: driver_responsibility
  question: Laquelle des options suivantes est une composante obligatoire de toutes
    les polices d'assurance automobile en Ontario ?
  choices:
    A: La garantie accidents sans collision (assurance complète)
    B: La garantie collision
    C: La garantie de responsabilité civile
    D: Le remboursement des frais de location de voiture
  answer: C
  explanation: La loi de l'Ontario exige que tous les automobilistes détiennent au
    moins 200 000 $ d'assurance responsabilité civile, bien que la plupart des conducteurs
    en détiennent davantage.
- id: 59
  category: driver_responsibility
  question: Lorsque vous vendez votre véhicule en Ontario, qu'advient-il des plaques
    d'immatriculation ?
  choices:
    A: Elles doivent rester sur le véhicule pour le nouveau propriétaire
    B: Elles doivent être détruites immédiatement
    C: Vous gardez les plaques et la partie « plaque » du permis de véhicule
    D: Vous devez les donner à l'acheteur avec la partie « véhicule »
  answer: C
  explanation: En Ontario, les plaques d'immatriculation suivent le propriétaire,
    pas le véhicule. Vous conservez vos plaques et la partie « plaque » du permis
    lorsque vous vendez une voiture.
- id: 60
  category: driver_responsibility
  question: Si vous heurtez un véhicule stationné et que vous ne pouvez pas trouver
    le propriétaire, que devez-vous faire selon la loi ?
  choices:
    A: Attendre 30 minutes, puis partir si personne ne se présente
    B: Laisser une note avec votre nom et adresse et signaler l'accident à la police
    C: Rien, si les dommages semblent être inférieurs à 2 000 $
    D: Ne le signaler que si l'autre véhicule est un camion commercial
  answer: B
  explanation: Si vous heurtez un véhicule stationné ou une propriété et que le propriétaire
    n'est pas présent, vous devez laisser une note avec vos informations et signaler
    l'incident à la police ou à un centre de rapport de collision.
- id: 61
  category: driver_responsibility
  question: Un certificat de sécurité (SSC) est requis pour immatriculer un véhicule
    comme étant « en bon état ». Quelle est la durée de validité de ce certificat
    en Ontario ?
  choices:
    A: 14 jours
    B: 36 jours
    C: 60 jours
    D: 1 an
  answer: B
  explanation: En Ontario, un certificat de sécurité est valide pendant 36 jours à
    compter de la date de l'inspection.
- id: 62
  category: driver_responsibility
  question: Sur les lieux d'une collision, vous devez échanger des renseignements
    avec les autres parties impliquées. Lequel des éléments suivants n'est PAS légalement
    requis ?
  choices:
    A: Votre nom et votre adresse
    B: Le numéro de plaque de votre véhicule
    C: Votre compagnie d'assurance et votre numéro de police
    D: L'historique de votre dossier de conduite
  answer: D
  explanation: Les conducteurs doivent échanger leurs noms, adresses, numéros de plaque
    et détails d'assurance. Ils ne sont pas tenus de partager l'historique de leur
    dossier de conduite personnel avec les autres conducteurs.
- id: 63
  category: driver_responsibility
  question: Si vous êtes déclaré coupable d'omission de rester sur les lieux d'une
    collision en Ontario, combien de points d'inaptitude seront ajoutés à votre dossier
    ?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 9 points
  answer: C
  explanation: L'omission de rester sur les lieux d'un accident est une infraction
    grave qui entraîne une pénalité de 7 points d'inaptitude en Ontario.
- id: 64
  category: driver_responsibility
  question: Quel document doit être conservé dans le véhicule en tout temps lors de
    la conduite en Ontario ?
  choices:
    A: Le reçu d'achat original du véhicule
    B: Le permis de véhicule (ou une copie certifiée conforme)
    C: La trousse d'information sur les véhicules d'occasion
    D: Le manuel d'entretien du véhicule
  answer: B
  explanation: Les conducteurs doivent avoir sur eux le permis de véhicule (immatriculation)
    ou une copie certifiée conforme en tout temps lorsqu'ils utilisent le véhicule.
- id: 65
  category: driver_responsibility
  question: 'En Ontario, la « Garantie contre les automobilistes non assurés » vous
    protège si :'
  choices:
    A: Vous oubliez de payer votre prime d'assurance
    B: Vous êtes impliqué dans un accident avec un conducteur qui n'a pas d'assurance
    C: Vous décidez d'annuler votre police d'assurance
    D: Vous conduisez un véhicule qui ne vous appartient pas
  answer: B
  explanation: La garantie contre les automobilistes non assurés est obligatoire en
    Ontario et vous protège, vous et votre famille, si vous êtes blessé ou tué par
    un automobiliste non assuré ou par un conducteur ayant commis un délit de fuite.
- id: 66
  category: driver_responsibility
  question: 'Si votre permis de conduire est suspendu pour une condamnation en vertu
    du Code de la route, vous pourriez également devoir payer des frais de rétablissement
    de :'
  choices:
    A: 50 $
    B: 150 $
    C: 281 $
    D: 500 $
  answer: C
  explanation: Selon la réglementation actuelle de l'Ontario, les conducteurs doivent
    payer des frais administratifs de 281 $ pour rétablir un permis qui a été suspendu
    pour la plupart des infractions au Code de la route.
- id: 67
  category: driver_responsibility
  question: En Ontario, quel est le montant minimum de couverture d'assurance responsabilité
    civile requis par la loi ?
  choices:
    A: 50 000 $
    B: 100 000 $
    C: 200 000 $
    D: 500 000 $
  answer: C
  explanation: En vertu de la Loi sur l'assurance-automobile obligatoire, tout véhicule
    à moteur immatriculé en Ontario doit être assuré pour au moins 200 000 $ en couverture
    de responsabilité civile.
- id: 68
  category: driver_responsibility
  question: Où doit être conservé le permis de véhicule (certificat de propriété)
    ou une copie certifiée conforme lors de l'utilisation d'un véhicule à moteur ?
  choices:
    A: Dans un coffre-fort à votre résidence principale
    B: Dans le véhicule ou sur la personne du conducteur
    C: Au bureau de votre assureur
    D: Il doit être affiché dans la lunette arrière
  answer: B
  explanation: La loi de l'Ontario exige que le permis de véhicule (ou une copie certifiée
    conforme) soit transporté dans le véhicule ou sur la personne du conducteur afin
    de pouvoir être présenté à la demande d'un agent de police.
- id: 69
  category: driver_responsibility
  question: Un certificat de sécurité est requis lors du transfert de propriété d'un
    véhicule d'occasion à toute personne autre qu'un conjoint. Pendant combien de
    jours ce certificat est-il valide après l'inspection ?
  choices:
    A: 14 jours
    B: 30 jours
    C: 36 jours
    D: 60 jours
  answer: C
  explanation: En Ontario, un certificat de sécurité est valide pendant 36 jours à
    compter de la date de l'inspection aux fins de transfert de propriété ou d'immatriculation
    d'un véhicule.
- id: 70
  category: driver_responsibility
  question: Quelle est l'amende maximale pour avoir fourni de faux renseignements
    au ministère des Transports concernant l'assurance ou l'immatriculation d'un véhicule
    ?
  choices:
    A: 1 000 $
    B: 5 000 $
    C: 10 000 $
    D: 25 000 $
  answer: D
  explanation: Le fait de fournir de faux renseignements sur une demande de permis,
    de licence ou dans toute déclaration requise en vertu du Code de la route peut
    entraîner une amende allant jusqu'à 25 000 $, une peine d'emprisonnement ou la
    suspension du permis.
- id: 71
  category: driver_responsibility
  question: En Ontario, est-il légal de présenter une preuve d'assurance automobile
    à un agent de police sur un appareil mobile (carte d'assurance électronique) ?
  choices:
    A: Non, seul le feuillet rose original en papier est accepté
    B: Oui, mais seulement s'il s'agit d'un véhicule de location
    C: Oui, la preuve d'assurance électronique est légalement acceptée en Ontario
    D: Non, vous devez avoir une photocopie physique
  answer: C
  explanation: Depuis 2019, les conducteurs de l'Ontario ont la possibilité de fournir
    une preuve d'assurance sous format électronique sur un appareil mobile, en plus
    du traditionnel « feuillet rose » en papier.
- id: 72
  category: driver_responsibility
  question: Que peut-il arriver si vous ne payez pas une amende pour infraction au
    code de la route en Ontario dans les délais requis ?
  choices:
    A: Votre véhicule sera immédiatement mis en fourrière
    B: Votre permis de conduire peut être suspendu et vous ne pourrez pas renouveler
      votre permis de véhicule
    C: Vous devrez repasser votre examen écrit G1
    D: Rien, tant que vous payez dans l'année qui suit
  answer: B
  explanation: Le non-paiement d'une amende ordonnée par le tribunal pour une infraction
    au code de la route peut entraîner la suspension de votre permis de conduire et
    le refus du ministère de valider ou de délivrer des permis de véhicule (certificats
    d'immatriculation).
- id: 73
  category: driver_responsibility
  question: 'Selon le Code de la route, les plaques d''immatriculation de votre véhicule
    doivent être :'
  choices:
    A: Maintenues exemptes de saleté et d'obstructions afin d'être clairement visibles
    B: Recouvertes d'une protection en plastique teinté pour les protéger
    C: Fixées uniquement sur la lunette arrière
    D: Changées tous les deux ans
  answer: A
  explanation: En Ontario, les plaques d'immatriculation doivent être propres et clairement
    visibles en tout temps. L'utilisation de couvre-plaques teintés ou qui obstruent
    les chiffres/lettres est illégale.
- id: 74
  category: driver_responsibility
  question: 'Un permis de stationnement accessible permet à un véhicule de se garer
    dans les places désignées uniquement si :'
  choices:
    A: Le véhicule porte un autocollant pour handicapés sur le pare-chocs
    B: La personne à qui le permis a été délivré est transportée dans le véhicule
    C: Le conducteur est âgé de plus de 65 ans
    D: Le véhicule est un VUS ou une fourgonnette
  answer: B
  explanation: Un permis de stationnement accessible est délivré à une personne, et
    non à un véhicule. Il ne peut être utilisé que lorsque la personne nommée sur
    le permis utilise le véhicule.
- id: 75
  category: driver_responsibility
  question: 'En Ontario, les compagnies d''assurance sont tenues par la loi d''accorder
    un rabais aux conducteurs qui :'
  choices:
    A: Conduisent moins de 5 000 km par an
    B: Installent quatre pneus d'hiver sur leur véhicule
    C: N'ont jamais reçu de contravention pour excès de vitesse
    D: Utilisent une caméra de tableau de bord (dashcam)
  answer: B
  explanation: Depuis 2016, toutes les compagnies d'assurance privées de l'Ontario
    sont mandatées par le gouvernement pour offrir un rabais aux conducteurs qui utilisent
    des pneus d'hiver.
- id: 76
  category: safe_driving_rules
  question: Sauf indication contraire, quelle est la limite de vitesse maximale dans
    les cités, villes et villages de l'Ontario ?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: B
  explanation: Selon le Code de la route de l'Ontario, la limite de vitesse légale
    est de 50 km/h dans les cités, villes, villages et zones bâties, à moins que des
    panneaux n'indiquent le contraire.
- id: 77
  category: safe_driving_rules
  question: En Ontario, quelle est la distance minimale à laquelle vous devez vous
    stationner d'une borne d'incendie ?
  choices:
    A: 1,5 mètre
    B: 3 mètres
    C: 5 mètres
    D: 9 mètres
  answer: B
  explanation: Le Code de la route de l'Ontario interdit de stationner un véhicule
    à moins de 3 mètres d'une borne d'incendie.
- id: 78
  category: safe_driving_rules
  question: Lorsque vous approchez d'un véhicule de secours ou d'une dépanneuse avec
    des feux clignotants arrêté sur le bord d'une autoroute à deux voies ou plus,
    que vous oblige à faire la loi « tassez-vous » de l'Ontario ?
  choices:
    A: S'arrêter immédiatement et attendre les instructions
    B: Maintenir sa vitesse mais klaxonner pour alerter les travailleurs
    C: Ralentir et changer de voie si cela peut être fait en toute sécurité
    D: Accélérer pour dépasser le véhicule le plus rapidement possible
  answer: C
  explanation: La loi « tassez-vous » de l'Ontario exige que les conducteurs ralentissent
    et, si l'autoroute comporte plus d'une voie, changent de voie si cela est sécuritaire
    lorsqu'ils dépassent des véhicules de secours ou des dépanneuses dont les feux
    clignotent.
- id: 79
  category: safe_driving_rules
  question: Sous quelle condition spécifique un virage à gauche au feu rouge est-il
    autorisé en Ontario ?
  choices:
    A: Ce n'est jamais autorisé
    B: D'une rue à double sens vers une rue à sens unique
    C: D'une rue à sens unique vers une autre rue à sens unique
    D: À n'importe quelle intersection après avoir marqué un arrêt complet
  answer: C
  explanation: En Ontario, vous pouvez tourner à gauche au feu rouge uniquement si
    vous passez d'une rue à sens unique à une autre rue à sens unique, à condition
    de marquer un arrêt complet et de céder le passage à la circulation et aux piétons.
- id: 80
  category: safe_driving_rules
  question: Quelle est la sanction pour un excès de vitesse dans une zone de travaux
    désignée en Ontario lorsque des travailleurs sont présents ?
  choices:
    A: L'amende est triplée
    B: L'amende est doublée
    C: Une suspension obligatoire du permis de 7 jours
    D: Il n'y a pas de sanction supplémentaire, seules les amendes standard s'appliquent
  answer: B
  explanation: En Ontario, les amendes pour excès de vitesse sont doublées dans les
    zones de travaux lorsque des travailleurs sont présents, conformément au Code
    de la route.
- id: 81
  category: safe_driving_rules
  question: À un passage pour piétons (qui n'est pas une intersection standard), quand
    êtes-vous autorisé à continuer après qu'un piéton a commencé à traverser ?
  choices:
    A: Dès que le piéton n'est plus dans votre voie
    B: Quand le piéton est à la moitié de la route
    C: Seulement après que le piéton a complètement traversé la route et se trouve
      sur le trottoir
    D: Quand le piéton vous fait signe de passer
  answer: C
  explanation: Aux passages pour piétons et aux passages d'écoliers, les conducteurs
    doivent rester à l'arrêt jusqu'à ce que le piéton ait complètement atteint l'autre
    côté de la route.
- id: 82
  category: safe_driving_rules
  question: 'Lorsque vous conduisez la nuit, vous devez passer de vos feux de route
    aux feux de croisement lorsque vous suivez un autre véhicule à moins de :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 150 mètres
    D: 200 mètres
  answer: B
  explanation: La loi de l'Ontario exige que les conducteurs passent aux feux de croisement
    lorsqu'ils suivent un autre véhicule à moins de 60 mètres afin d'éviter d'éblouir
    le conducteur devant eux.
- id: 83
  category: safe_driving_rules
  question: Lorsque vous stationnez un véhicule face à la pente (montée) sur une rue
    à double sens avec une bordure de trottoir, comment les roues avant doivent-elles
    être tournées ?
  choices:
    A: Vers la droite (vers la bordure)
    B: Vers la gauche (à l'opposé de la bordure)
    C: Parallèles à la bordure
    D: Cela n'a pas d'importance
  answer: B
  explanation: Lors d'un stationnement en montée avec une bordure, tournez les roues
    vers la gauche (à l'opposé de la bordure) de sorte que si le véhicule recule,
    l'arrière du pneu avant frappe la bordure et arrête la voiture.
- id: 84
  category: safe_driving_rules
  question: À l'approche d'un passage à niveau où un signal clignote, quelle est la
    distance minimale à laquelle vous devez vous arrêter du rail le plus proche ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: En Ontario, lorsqu'un signal avertit de l'approche d'un train, vous
    devez vous arrêter à au moins 5 mètres du rail le plus proche.
- id: 85
  category: safe_driving_rules
  question: En Ontario, les voies réservées aux véhicules multioccupants (VMO - HOV)
    sur les autoroutes de la série 400 sont généralement réservées aux véhicules transportant
    au moins combien de personnes ?
  choices:
    A: 1 personne (conducteur seul)
    B: 2 personnes
    C: 3 personnes
    D: 4 personnes
  answer: B
  explanation: La plupart des voies VMO en Ontario exigent un minimum de deux personnes
    (le conducteur plus au moins un passager) dans le véhicule, bien que certains
    véhicules comme les autobus, les véhicules d'urgence et les taxis licenciés soient
    exemptés.
- id: 86
  category: safe_driving_rules
  question: 'Lorsqu''un passeur scolaire (brigadier) brandit un panneau « arrêt »,
    vous devez :'
  choices:
    A: Arrêter et attendre que tous les enfants aient traversé, mais vous pouvez partir
      avant que le passeur ne quitte la route
    B: Ralentir et avancer avec prudence
    C: Arrêter et attendre que les enfants et le passeur scolaire aient complètement
      quitté la chaussée
    D: Arrêter seulement s'il y a des enfants présents
  answer: C
  explanation: En vertu du Code de la route, les conducteurs doivent s'arrêter et
    rester à l'arrêt jusqu'à ce que tous les piétons et le passeur scolaire aient
    quitté la chaussée en toute sécurité.
- id: 87
  category: safe_driving_rules
  question: En Ontario, quelle est la limite de vitesse par défaut dans une zone bâtie
    (ville, municipalité ou village), à moins d'indication contraire ?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: B
  explanation: Selon le Code de la route de l'Ontario, la limite de vitesse légale
    est de 50 km/h dans les zones bâties et de 80 km/h ailleurs, à moins que des panneaux
    n'indiquent le contraire.
- id: 88
  category: safe_driving_rules
  question: Lorsque vous stationnez votre véhicule près d'une borne d'incendie en
    Ontario, quelle est la distance minimale que vous devez maintenir ?
  choices:
    A: 1 mètre
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: B
  explanation: En Ontario, il est interdit de se stationner à moins de 3 mètres d'une
    borne d'incendie.
- id: 89
  category: safe_driving_rules
  question: Lorsque vous conduisez la nuit, vous devez passer de vos feux de route
    aux feux de croisement lorsque vous vous trouvez à quelle distance d'un véhicule
    venant en sens inverse ?
  choices:
    A: 60 mètres
    B: 100 mètres
    C: 150 mètres
    D: 250 mètres
  answer: C
  explanation: La loi de l'Ontario exige que les conducteurs passent aux feux de croisement
    lorsqu'un véhicule venant en sens inverse se trouve à moins de 150 mètres afin
    d'éviter d'éblouir l'autre conducteur.
- id: 90
  category: safe_driving_rules
  question: Lorsque vous suivez un autre véhicule la nuit, vous devez passer des feux
    de route aux feux de croisement lorsque vous vous trouvez à quelle distance du
    véhicule qui vous précède ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 120 mètres
    D: 150 mètres
  answer: B
  explanation: Vous devez utiliser les feux de croisement lorsque vous suivez un autre
    véhicule à moins de 60 mètres, sauf lors d'une manœuvre de dépassement.
- id: 91
  category: safe_driving_rules
  question: Lorsque deux véhicules arrivent à une intersection non contrôlée (sans
    panneaux ni feux) à peu près en même temps, qui a la priorité de passage ?
  choices:
    A: Le véhicule à gauche
    B: Le véhicule à droite
    C: Le véhicule circulant à une vitesse plus élevée
    D: Le véhicule se trouvant sur la route la plus large
  answer: B
  explanation: À une intersection sans panneaux ni feux, vous devez céder le passage
    à tout véhicule s'approchant par la droite.
- id: 92
  category: safe_driving_rules
  question: À un passage pour piétons (qui n'est pas une intersection standard avec
    des feux), que doit faire un conducteur lorsqu'un piéton traverse ?
  choices:
    A: S'arrêter et attendre que le piéton ait complètement traversé la route et soit
      sur le trottoir
    B: S'arrêter et attendre que le piéton ait libéré la moitié de la route du côté
      du conducteur
    C: Ralentir et contourner le piéton
    D: Klaxonner pour avertir le piéton de se dépêcher
  answer: A
  explanation: Aux passages pour piétons et aux passages d'écoliers, les conducteurs
    doivent rester à l'arrêt jusqu'à ce que le piéton ait complètement fini de traverser
    toute la chaussée.
- id: 93
  category: safe_driving_rules
  question: Quelle est la distance de suivi recommandée derrière un autre véhicule
    dans des conditions de conduite normales en Ontario ?
  choices:
    A: La longueur d'une voiture
    B: Deux secondes
    C: La longueur de trois voitures
    D: Cinq secondes
  answer: B
  explanation: Le Guide officiel de l'automobiliste de l'Ontario recommande une distance
    de suivi minimale d'au moins deux secondes derrière le véhicule qui vous précède.
- id: 94
  category: safe_driving_rules
  question: 'En entrant dans un carrefour giratoire en Ontario, vous devez :'
  choices:
    A: Céder le passage au trafic déjà engagé dans le carrefour giratoire venant de
      votre gauche
    B: Céder le passage au trafic s'approchant par votre droite
    C: S'arrêter avant d'entrer, quel que soit le trafic
    D: Accélérer pour s'insérer dans le flux de la circulation
  answer: A
  explanation: En entrant dans un carrefour giratoire, vous devez céder le passage
    aux véhicules déjà engagés dans le cercle venant de votre gauche.
- id: 95
  category: safe_driving_rules
  question: En Ontario, il est interdit de suivre un véhicule de pompiers répondant
    à une alarme à moins de quelle distance ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Il est illégal de suivre à moins de 150 mètres un véhicule de pompiers
    répondant à un appel.
- id: 96
  category: defensive_driving
  question: Dans des conditions de conduite idéales, quelle est la distance de suivi
    minimale recommandée derrière le véhicule qui vous précède selon le Guide officiel
    de l'automobiliste de l'Ontario ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 3 secondes
    D: 4 secondes
  answer: B
  explanation: Le Guide officiel de l'automobiliste de l'Ontario recommande de maintenir
    une distance de suivi minimale de deux secondes dans des conditions idéales afin
    de disposer d'assez de temps pour réagir aux arrêts soudains.
- id: 97
  category: defensive_driving
  question: 'Pour maintenir une bonne conscience de la situation en conduisant, le
    Guide officiel de l''automobiliste de l''Ontario suggère de balayer la route du
    regard jusqu''à l''endroit où vous vous trouverez dans environ :'
  choices:
    A: 2 à 5 secondes
    B: 5 à 8 secondes
    C: 12 à 15 secondes
    D: 20 à 30 secondes
  answer: C
  explanation: Un balayage visuel efficace consiste à regarder de 12 à 15 secondes
    devant votre position actuelle pour anticiper les dangers potentiels et les changements
    de circulation.
- id: 98
  category: defensive_driving
  question: Si votre véhicule commence à faire de l'aquaplanage sur une route mouillée,
    quelle est la meilleure chose à faire ?
  choices:
    A: Freiner brusquement pour ralentir rapidement
    B: Accélérer pour fendre l'eau
    C: Relâcher la pédale d'accélérateur et diriger le volant dans la direction où
      vous voulez aller
    D: Tourner le volant brusquement vers la droite
  answer: C
  explanation: En cas d'aquaplanage, vous devez éviter de freiner ou de donner des
    coups de volant brusques. Relâcher l'accélérateur permet au véhicule de ralentir
    jusqu'à ce que les pneus retrouvent le contact avec la route.
- id: 99
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais en Ontario, quel réglage
    de phares devez-vous utiliser pour assurer une visibilité maximale ?
  choices:
    A: Feux de route
    B: Feux de croisement
    C: Feux de stationnement uniquement
    D: Aucun feu
  answer: B
  explanation: Les feux de croisement doivent être utilisés dans le brouillard car
    les feux de route se reflètent sur l'humidité de l'air, créant un éblouissement
    qui rend la visibilité plus difficile.
- id: 100
  category: defensive_driving
  question: À l'approche d'un passage à niveau dont le signal ou la barrière est activé,
    vous devez vous arrêter à au moins combien de mètres du rail le plus proche ?
  choices:
    A: 2 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: En Ontario, vous devez vous arrêter à au moins 5 mètres du rail le
    plus proche à un passage à niveau lorsqu'un signal avertit de l'approche d'un
    train.
- id: 101
  category: defensive_driving
  question: Si les freins de votre véhicule lâchent pendant que vous conduisez, quelle
    devrait être votre première action défensive ?
  choices:
    A: Couper le contact immédiatement
    B: Mettre le véhicule au point mort
    C: Pomper la pédale de frein rapidement
    D: Serrer le frein d'urgence le plus fort possible
  answer: C
  explanation: Pomper la pédale de frein peut souvent accumuler une pression hydraulique
    suffisante pour arrêter le véhicule si la défaillance est partielle.
- id: 102
  category: defensive_driving
  question: 'Lorsqu''un véhicule d''urgence avec une sirène et des feux clignotants
    s''approche de votre véhicule de n''importe quelle direction sur une route à deux
    voies, vous devez :'
  choices:
    A: S'arrêter immédiatement là où vous êtes
    B: Accélérer pour libérer le passage
    C: Signaler et se ranger à droite le plus loin possible et s'arrêter
    D: Se ranger sur l'accotement gauche et s'arrêter
  answer: C
  explanation: Les conducteurs doivent se ranger à droite et s'arrêter complètement
    pour laisser le passage libre aux véhicules d'urgence.
- id: 103
  category: defensive_driving
  question: En vertu du Code de la route (Highway Traffic Act), il vous est interdit
    de dépasser un autre véhicule à moins de combien de mètres d'un pont, d'un viaduc
    ou d'un tunnel si votre vue est obstruée ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: A
  explanation: L'article 149 du Code de la route stipule que vous ne pouvez pas conduire
    sur le côté gauche de la chaussée à l'approche de moins de 30 mètres d'un pont,
    d'un viaduc ou d'un tunnel.
- id: 104
  category: defensive_driving
  question: 'Lorsque vous entrez sur une autoroute par une voie d''accélération, la
    procédure de conduite défensive correcte consiste à :'
  choices:
    A: S'arrêter au bout de la voie d'accélération et attendre un espace
    B: Rouler lentement et attendre qu'un conducteur vous fasse signe d'entrer
    C: Augmenter votre vitesse pour correspondre au flux de la circulation sur l'autoroute
      et s'insérer en toute sécurité
    D: Toujours céder le passage aux véhicules sur l'accotement de l'autoroute
  answer: C
  explanation: La voie d'accélération est destinée aux conducteurs pour augmenter
    leur vitesse afin de correspondre à celle de la circulation déjà présente sur
    l'autoroute, de sorte qu'ils puissent s'insérer sans forcer les autres à freiner.
- id: 105
  category: defensive_driving
  question: Pour maintenir une conscience situationnelle adéquate, le MTO (ministère
    des Transports) recommande de balayer la route du regard jusqu'à quelle distance
    à l'avance ?
  choices:
    A: 2 à 5 secondes
    B: 5 à 8 secondes
    C: 12 à 15 secondes
    D: 20 à 30 secondes
  answer: C
  explanation: Les conducteurs doivent balayer la route du regard 12 à 15 secondes
    à l'avance en ville et plus loin sur l'autoroute pour anticiper les dangers.
- id: 106
  category: defensive_driving
  question: 'En vertu de la loi « Move Over » (se tasser) de l''Ontario, si vous voyez
    un véhicule d''urgence avec des feux clignotants arrêté sur le bord de la route,
    vous devez ralentir et vous tasser si cela est sécuritaire. Le non-respect de
    cette règle pour une première infraction entraîne 3 points d''inaptitude et une
    amende de :'
  choices:
    A: 100 $ à 500 $
    B: 400 $ à 2 000 $
    C: 1 000 $ à 5 000 $
    D: 2 000 $ à 10 000 $
  answer: B
  explanation: Une première condamnation pour avoir omis de se tasser pour un véhicule
    d'urgence ou une dépanneuse avec des feux clignotants entraîne une amende de 400
    $ à 2 000 $ et 3 points d'inaptitude.
- id: 107
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais, quelle configuration
    d'éclairage devez-vous utiliser pour une visibilité maximale ?
  choices:
    A: Feux de route (pleins phares)
    B: Feux de stationnement uniquement
    C: Feux de croisement (codes)
    D: Aucun feu, pour réduire l'éblouissement
  answer: C
  explanation: Les feux de croisement doivent être utilisés dans le brouillard car
    les feux de route se reflètent sur l'humidité de l'air, créant un « mur blanc
    » qui réduit la visibilité.
- id: 108
  category: defensive_driving
  question: Quelle est la meilleure façon de vérifier vos angles morts avant de changer
    de voie ?
  choices:
    A: Vérifier votre rétroviseur intérieur
    B: Vérifier vos rétroviseurs extérieurs
    C: Tourner la tête et regarder par-dessus votre épaule
    D: Se pencher en avant pour changer l'angle des rétroviseurs latéraux
  answer: C
  explanation: Les rétroviseurs ne montrent pas tout. Une vérification par-dessus
    l'épaule (contrôle latéral) est le seul moyen de s'assurer que vos angles morts
    sont libres.
- id: 109
  category: defensive_driving
  question: En conditions hivernales, la « glace noire » est plus susceptible de se
    former en premier sur laquelle des surfaces suivantes ?
  choices:
    A: Routes de gravier
    B: Ponts et viaducs
    C: Collines escarpées
    D: Autoroutes à plusieurs voies
  answer: B
  explanation: Les ponts et les viaducs gèlent plus rapidement que les autres surfaces
    routières car l'air froid circule à la fois au-dessus et au-dessous de la structure.
- id: 110
  category: defensive_driving
  question: Lorsque vous conduisez derrière un gros camion commercial, pourquoi devriez-vous
    maintenir une distance de sécurité plus grande que pour une voiture ?
  choices:
    A: Les camions peuvent s'arrêter beaucoup plus vite que les voitures
    B: Pour rester hors des angles morts du conducteur du camion (zones de danger)
    C: Les camions sont tenus de rouler plus lentement que la limite de vitesse
    D: Pour éviter les gaz d'échappement du camion
  answer: B
  explanation: Les gros camions ont des angles morts importants à l'arrière. Si vous
    ne voyez pas les rétroviseurs latéraux du camion, le conducteur ne peut pas vous
    voir.
- id: 111
  category: defensive_driving
  question: Lors d'une forte pluie, à quel moment la chaussée est-elle généralement
    la plus glissante ?
  choices:
    A: Après qu'il a plu pendant plusieurs heures
    B: Juste au moment où la pluie commence à tomber
    C: Quand la pluie s'arrête et que le soleil revient
    D: Au milieu de la tempête
  answer: B
  explanation: Les routes sont les plus glissantes au début d'une averse car l'eau
    se mélange à l'huile et à la graisse sur la chaussée qui n'ont pas encore été
    évacuées par le ruissellement.
- id: 112
  category: alcohol_drugs_health
  question: Si un conducteur titulaire d'un permis complet est intercepté dans la
    « zone d'avertissement » (taux d'alcoolémie de 0,05 à 0,08) pour la première fois,
    quelle est la durée de la suspension immédiate du permis de conduire sur les lieux
    ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: B
  explanation: Une première infraction dans la « zone d'avertissement » entraîne une
    suspension immédiate du permis de conduire de 3 jours sur les lieux et une sanction
    administrative pécuniaire de 250 $.
- id: 113
  category: alcohol_drugs_health
  question: En vertu des lois de tolérance zéro de l'Ontario, quels conducteurs doivent
    maintenir un taux d'alcoolémie (BAC) de 0,00 % et une absence totale de drogues
    ?
  choices:
    A: Uniquement les conducteurs de catégorie G1
    B: Uniquement les conducteurs de catégories G1 et G2
    C: Les conducteurs de 21 ans et moins, ainsi que tous les conducteurs débutants
      (G1, G2, M1, M2)
    D: Uniquement les conducteurs de moins de 18 ans
  answer: C
  explanation: En Ontario, tous les conducteurs débutants (quel que soit leur âge)
    et tous les conducteurs âgés de 21 ans et moins doivent n'avoir aucune trace d'alcool
    ni de drogue dans leur organisme lorsqu'ils conduisent.
- id: 114
  category: alcohol_drugs_health
  question: En Ontario, si un agent de police exige un échantillon d'haleine ou de
    fluide oral et que vous refusez, quelles sont les conséquences immédiates ?
  choices:
    A: Une suspension de 24 heures seulement
    B: Un avertissement et une date de comparution au tribunal
    C: Les mêmes sanctions que pour un taux d'alcoolémie supérieur à 0,08, incluant
      une suspension de 90 jours et la mise en fourrière du véhicule pendant 7 jours
    D: Une suspension de 3 jours et une amende de 100 $
  answer: C
  explanation: Le refus de fournir un échantillon d'haleine, de sang ou de fluide
    oral suite à une demande légale entraîne une suspension administrative immédiate
    du permis de conduire (ADLS) de 90 jours et une mise en fourrière du véhicule
    de 7 jours, soit les mêmes sanctions qu'un taux d'alcoolémie supérieur à 0,08.
- id: 115
  category: alcohol_drugs_health
  question: 'Quel est le taux d''alcoolémie (BAC) limite pour les conducteurs de véhicules
    commerciaux (ex. : camions de plus de 4 500 kg ou autobus) en Ontario ?'
  choices:
    A: 0,00 %
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: Les conducteurs de véhicules commerciaux en Ontario sont soumis aux
    règles de tolérance zéro, ce qui signifie qu'ils doivent avoir un taux d'alcoolémie
    de 0,00 % lorsqu'ils conduisent le véhicule.
- id: 116
  category: alcohol_drugs_health
  question: Si vous êtes reconnu coupable d'une première infraction de conduite avec
    facultés affaiblies en vertu du Code criminel du Canada, quelle est la suspension
    de permis obligatoire minimale en Ontario ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 1 an
    D: 2 ans
  answer: C
  explanation: Une première condamnation pour conduite avec facultés affaiblies en
    vertu du Code criminel entraîne une suspension de permis ordonnée par le tribunal
    d'une durée minimale d'un an en Ontario.
- id: 117
  category: alcohol_drugs_health
  question: En Ontario, qu'est-ce que le programme « Back on Track » (Remise en piste)
    ?
  choices:
    A: Un cours de conduite à haute vitesse
    B: Le programme de mesures correctives de l'Ontario pour les personnes reconnues
      coupables de conduite avec facultés affaiblies ou ayant reçu plusieurs suspensions
      dans la zone d'avertissement
    C: Un programme pour renouveler les permis expirés
    D: Un programme permettant aux jeunes conducteurs d'obtenir leur permis G2 plus
      rapidement
  answer: B
  explanation: « Back on Track » est le programme de mesures correctives obligatoire
    de l'Ontario pour les conducteurs reconnus coupables de conduite avec facultés
    affaiblies ou ceux qui reçoivent plus d'une suspension dans la « zone d'avertissement
    ».
- id: 118
  category: alcohol_drugs_health
  question: Comment le cannabis légal doit-il être transporté dans un véhicule en
    Ontario ?
  choices:
    A: N'importe où dans le véhicule, tant qu'il est dans un sac
    B: 'Il doit être dans son emballage d''origine non ouvert, ou rangé dans un endroit
      qui n''est pas facilement accessible aux personnes dans le véhicule (ex. : le
      coffre)'
    C: Uniquement dans la boîte à gants
    D: Il ne peut être transporté dans un véhicule sous aucune circonstance
  answer: B
  explanation: Le cannabis doit être dans son emballage d'origine non ouvert ou rangé
    de manière à ne pas être accessible au conducteur ou aux passagers (comme dans
    le coffre) pendant que le véhicule est en mouvement.
- id: 119
  category: alcohol_drugs_health
  question: En Ontario, si votre permis est suspendu pour une condamnation de conduite
    en vertu du Code criminel, quand l'exigence d'un « antidémarreur avec éthylomètre
    » (Ignition Interlock) s'applique-t-elle généralement ?
  choices:
    A: Uniquement si vous avez causé un accident
    B: Uniquement pour les récidivistes (troisième fois)
    C: Après la fin de la période de suspension obligatoire, comme condition de rétablissement
      du permis
    D: Immédiatement après avoir été inculpé
  answer: C
  explanation: Une fois la période de suspension ordonnée par le tribunal pour une
    condamnation de conduite avec facultés affaiblies terminée, les conducteurs sont
    généralement tenus d'utiliser un antidémarreur avec éthylomètre pendant une période
    déterminée pour récupérer leurs privilèges de conduite.
- id: 120
  category: alcohol_drugs_health
  question: Qu'arrive-t-il à un véhicule si un conducteur est intercepté avec un taux
    d'alcoolémie (BAC) supérieur à 0,08 ou s'il refuse un alcootest en Ontario ?
  choices:
    A: Il est mis en fourrière pendant 24 heures
    B: Il est mis en fourrière pendant 7 jours
    C: Il est saisi et vendu par la province
    D: Rien, seul le permis du conducteur est affecté
  answer: B
  explanation: Les conducteurs interceptés avec un taux d'alcoolémie supérieur à 0,08
    ou qui refusent un alcootest font face à une mise en fourrière immédiate du véhicule
    pendant 7 jours sur les lieux.
- id: 121
  category: alcohol_drugs_health
  question: Laquelle des affirmations suivantes est vraie concernant les médicaments
    sur ordonnance ou en vente libre et la conduite en Ontario ?
  choices:
    A: Leur utilisation est toujours légale en conduisant car il s'agit de médicaments
    B: Ils ne sont illégaux que si vous n'avez pas d'ordonnance
    C: Il est illégal de conduire si le médicament altère votre capacité à conduire
      un véhicule
    D: Seules les drogues illégales sont surveillées par la police
  answer: C
  explanation: Les lois sur la conduite avec facultés affaiblies s'appliquent à toutes
    les drogues, y compris les médicaments sur ordonnance et les médicaments en vente
    libre, s'ils affectent votre capacité à conduire en toute sécurité.
- id: 122
  category: alcohol_drugs_health
  question: Quelle est la période de suspension administrative immédiate du permis
    de conduire (ADLS) pour un conducteur dont le taux d'alcoolémie (BAC) est supérieur
    à 0,08 ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 180 jours
  answer: C
  explanation: Si un conducteur dépasse un taux de 0,08, il reçoit une suspension
    administrative immédiate du permis de conduire (ADLS) de 90 jours sur le bord
    de la route, indépendamment de toute procédure judiciaire future.
- id: 123
  category: alcohol_drugs_health
  question: En vertu des lois sur le « dépistage obligatoire de l'alcool » en Ontario,
    quand un agent de police peut-il exiger un échantillon d'haleine ?
  choices:
    A: Seulement si le conducteur fait des embardées
    B: Seulement après qu'un accident s'est produit
    C: À tout moment, à condition que l'agent ait légalement arrêté le véhicule
    D: Seulement si l'agent sent l'alcool
  answer: C
  explanation: En vertu de la loi canadienne (appliquée en Ontario), les agents de
    police qui ont légalement arrêté un véhicule peuvent exiger un échantillon d'haleine
    de n'importe quel conducteur sans avoir besoin d'un « soupçon raisonnable » que
    le conducteur a bu.
- id: 124
  category: alcohol_drugs_health
  question: En Ontario, quel est le taux d'alcoolémie (BAC) maximal autorisé pour
    les conducteurs de 21 ans et moins ?
  choices:
    A: 0,02 %
    B: 0,05 %
    C: 0,08 %
    D: 0,00 %
  answer: D
  explanation: En Ontario, tous les conducteurs de 21 ans et moins, quelle que soit
    la catégorie de permis, doivent avoir un taux d'alcoolémie de zéro lorsqu'ils
    conduisent.
- id: 125
  category: alcohol_drugs_health
  question: 'En Ontario, si vous refusez de fournir un échantillon d''haleine ou de
    sang à un agent de police, vous ferez l''objet d''une suspension immédiate du
    permis de conduire sur le bord de la route de :'
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 1 an
  answer: C
  explanation: En vertu de la loi de l'Ontario, le refus de se soumettre à un test
    de sobriété physique ou de fournir un échantillon d'haleine, de sang ou de fluide
    entraîne une suspension administrative immédiate du permis de conduire de 90 jours.
- id: 126
  category: alcohol_drugs_health
  question: Si un conducteur est pris avec un taux d'alcoolémie (BAC) supérieur à
    0,08 ou refuse un test d'alcootest, son véhicule sera mis en fourrière sur le
    bord de la route pendant combien de jours ?
  choices:
    A: 3 jours
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: Les conducteurs accusés de conduite avec facultés affaiblies par l'alcool
    ou la drogue (ou de refus) font l'objet d'une mise en fourrière immédiate du véhicule
    pendant 7 jours sur le bord de la route.
- id: 127
  category: alcohol_drugs_health
  question: Quelle est la limite de taux d'alcoolémie (BAC) pour les conducteurs de
    véhicules commerciaux (catégories A, B, C, D, E ou F) en Ontario ?
  choices:
    A: 0,00 %
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: Les conducteurs de véhicules commerciaux en Ontario sont soumis à une
    règle de tolérance zéro, ce qui signifie qu'ils doivent avoir un taux d'alcoolémie
    de 0,00 % lorsqu'ils conduisent le véhicule.
- id: 128
  category: alcohol_drugs_health
  question: En vertu des lois de tolérance zéro de l'Ontario pour les drogues, quels
    conducteurs ne doivent avoir aucune présence de cannabis (THC) dans leur organisme
    ?
  choices:
    A: Seulement les conducteurs G1
    B: Seulement les conducteurs G2
    C: Les conducteurs novices et les conducteurs de 21 ans et moins
    D: Tous les conducteurs, quels que soient leur âge ou leur catégorie de permis
  answer: C
  explanation: L'Ontario a une politique de tolérance zéro pour les drogues (en particulier
    le THC) pour tous les conducteurs novices (G1, G2, M1, M2) et tous les conducteurs
    de 21 ans et moins.
- id: 129
  category: alcohol_drugs_health
  question: Si vous êtes reconnu coupable d'une première infraction de conduite avec
    facultés affaiblies en vertu du Code criminel, pendant combien de temps au moins
    devez-vous utiliser un dispositif d'antidémarrage avec éthylomètre ?
  choices:
    A: 6 mois
    B: 1 an
    C: 2 ans
    D: 3 ans
  answer: B
  explanation: Une première condamnation en vertu du Code criminel pour conduite avec
    facultés affaiblies entraîne une période minimale obligatoire d'un an d'utilisation
    d'un dispositif d'antidémarrage avec éthylomètre après la levée de la suspension
    du permis.
- id: 130
  category: alcohol_drugs_health
  question: Quelle est la sanction administrative pécuniaire (AMP) qui doit être payée
    au ministère des Transports pour une première suspension de permis sur le bord
    de la route ?
  choices:
    A: Aucune amende, seulement la suspension
    B: 100 $
    C: 250 $
    D: 500 $
  answer: C
  explanation: Les conducteurs qui reçoivent une suspension sur le bord de la route
    (fourchette d'avertissement ou tolérance zéro) sont tenus de payer une sanction
    administrative pécuniaire de 250 $.
- id: 131
  category: alcohol_drugs_health
  question: 'Lorsque l''alcool et les drogues (même les médicaments sur ordonnance)
    sont consommés ensemble, l''effet sur votre capacité de conduite est :'
  choices:
    A: Réduit
    B: Le même que de les prendre séparément
    C: Supérieur à la somme des deux
    D: Annulé
  answer: C
  explanation: La combinaison d'alcool et de drogues peut produire un effet synergique,
    ce qui signifie que l'affaiblissement des facultés est nettement plus grave que
    l'effet de l'une ou l'autre substance seule.
- id: 132
  category: alcohol_drugs_health
  question: 'En Ontario, si un conducteur est pris dans la « zone d''avertissement
    » (0,05 à 0,08) pour la deuxième fois en cinq ans, la période de suspension immédiate
    du permis est de :'
  choices:
    A: 3 jours
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: B
  explanation: Une deuxième occurrence dans la « zone d'avertissement » sur une période
    de cinq ans entraîne une suspension immédiate du permis de conduire de 7 jours
    sur le bord de la route et des programmes d'éducation obligatoires.
- id: 133
  category: alcohol_drugs_health
  question: Si vous êtes un conducteur de catégorie G1 ou G2 et que vous êtes pris
    avec de l'alcool dans le sang, votre permis sera suspendu sur-le-champ pour combien
    de jours ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: B
  explanation: En vertu de la politique de tolérance zéro de l'Ontario pour les nouveaux
    conducteurs, toute quantité d'alcool (supérieure à 0,00 d'alcoolémie [BAC]) entraîne
    une suspension immédiate du permis de conduire de 3 jours.
- id: 134
  category: penalties_and_points
  question: Un conducteur titulaire d'un permis complet (catégorie G) en Ontario recevra
    une lettre d'avertissement après avoir accumulé combien de points d'inaptitude
    ?
  choices:
    A: 3 points
    B: 6 points
    C: 9 points
    D: 15 points
  answer: B
  explanation: Pour un conducteur titulaire d'un permis complet, le ministère des
    Transports envoie une lettre d'avertissement à 6 points d'inaptitude. À 9 points,
    vous pourriez être tenu de vous présenter à une entrevue.
- id: 135
  category: penalties_and_points
  question: Combien de points d'inaptitude seront inscrits à votre dossier de conduite
    pour avoir omis de rester sur les lieux d'un accident ?
  choices:
    A: 3 points
    B: 5 points
    C: 6 points
    D: 7 points
  answer: D
  explanation: Le délit de fuite (omission de rester sur les lieux d'un accident)
    est une infraction grave en Ontario et entraîne la peine maximale de 7 points
    d'inaptitude.
- id: 136
  category: penalties_and_points
  question: En vertu des lois de l'Ontario sur la « conduite de cascade » (stunt driving),
    un conducteur peut être accusé d'excès de vitesse s'il roule à quelle vitesse
    au-dessus de la limite dans une zone où la limite est inférieure à 80 km/h ?
  choices:
    A: 30 km/h ou plus
    B: 40 km/h ou plus
    C: 50 km/h ou plus
    D: 60 km/h ou plus
  answer: B
  explanation: Depuis 2021, la conduite de cascade inclut un excès de vitesse de 40
    km/h ou plus au-dessus de la limite dans les zones où la limite de vitesse est
    inférieure à 80 km/h, ou de 50 km/h ou plus dans les zones où la limite est de
    80 km/h ou plus.
- id: 137
  category: penalties_and_points
  question: En Ontario, quelle est la « zone d'avertissement » du taux d'alcoolémie
    (BAC) pour les conducteurs titulaires d'un permis complet qui entraîne une suspension
    immédiate du permis ?
  choices:
    A: 0,02 à 0,05
    B: 0,05 à 0,08
    C: 0,08 à 0,10
    D: Plus de 0,08 seulement
  answer: B
  explanation: La « zone d'avertissement » en Ontario se situe entre 0,05 et 0,08
    d'alcoolémie. Les conducteurs se trouvant dans cette fourchette s'exposent à des
    suspensions immédiates de permis et à des sanctions administratives pécuniaires.
- id: 138
  category: penalties_and_points
  question: Si un conducteur est reconnu coupable de « conduite imprudente » en Ontario,
    combien de points d'inaptitude sont ajoutés à son dossier de conduite ?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 7 points
  answer: C
  explanation: La conduite imprudente est une infraction majeure en vertu du Code
    de la route et entraîne 6 points d'inaptitude, ainsi que des amendes potentielles,
    des peines d'emprisonnement et la suspension du permis.
- id: 139
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués pour avoir omis de s'arrêter
    pour un autobus scolaire dont les feux rouges clignotent ?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 7 points
  answer: C
  explanation: L'omission de s'arrêter pour un autobus scolaire dont les feux rouges
    clignotent entraîne 6 points d'inaptitude et une amende substantielle.
- id: 140
  category: penalties_and_points
  question: Quelle est la durée de la mise en fourrière obligatoire du véhicule sur
    le bord de la route pour un conducteur accusé de « conduite de cascade » en Ontario
    ?
  choices:
    A: 3 jours
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: C
  explanation: En vertu de la Loi de l'Ontario sur la sécurité des usagers de la route
    (Loi MOMS), la période de mise en fourrière immédiate du véhicule pour conduite
    de cascade est de 14 jours.
- id: 141
  category: penalties_and_points
  question: Combien de points d'inaptitude sont ajoutés pour avoir omis de s'immobiliser
    à un panneau d'arrêt ou à un feu rouge ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: L'omission de s'immobiliser à un panneau d'arrêt ou à un feu rouge
    entraîne l'ajout de 3 points d'inaptitude à votre dossier de conduite.
- id: 142
  category: penalties_and_points
  question: 'Un conducteur titulaire d''un permis complet reconnu coupable d''une
    deuxième infraction pour conduite distraite fera face à une suspension de permis
    de :'
  choices:
    A: 3 jours
    B: 7 jours
    C: 30 jours
    D: 60 jours
  answer: B
  explanation: Pour une deuxième condamnation pour conduite distraite, un conducteur
    titulaire d'un permis complet s'expose à une suspension de permis de 7 jours,
    une amende pouvant aller jusqu'à 2 000 $ et 6 points d'inaptitude.
- id: 143
  category: penalties_and_points
  question: 'Si vous êtes reconnu coupable d''avoir omis de vous arrêter à la demande
    d''un agent de police et que le tribunal détermine que vous avez délibérément
    évité la police (fuite), votre permis sera suspendu pour une période minimale
    de :'
  choices:
    A: 1 an
    B: 2 ans
    C: 5 ans
    D: 10 ans
  answer: C
  explanation: Si vous êtes reconnu coupable de fuite devant la police, la suspension
    minimale obligatoire du permis est de 5 ans, et elle peut aller jusqu'à une suspension
    à vie.
- id: 144
  category: penalties_and_points
  question: Combien de points d'inaptitude sont inscrits pour avoir « ouvert incorrectement
    la portière d'un véhicule » (souvent appelé « l'emportiérage » d'un cycliste)
    ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 0 point (amende seulement)
  answer: B
  explanation: L'ouverture incorrecte d'une portière de véhicule dans la trajectoire
    de la circulation ou d'un cycliste entraîne 3 points d'inaptitude et une amende
    importante.
- id: 145
  category: penalties_and_points
  question: Quelle est la fourchette de l'amende pour le non-port de la ceinture de
    sécurité en Ontario ?
  choices:
    A: 50 $ à 200 $
    B: 100 $ à 500 $
    C: 200 $ à 1 000 $
    D: 500 $ à 2 000 $
  answer: C
  explanation: En Ontario, l'amende pour les infractions liées à la ceinture de sécurité
    varie de 200 $ à 1 000 $, plus deux points d'inaptitude.
- id: 146
  category: penalties_and_points
  question: 'Si vous êtes pris à conduire alors que votre permis est suspendu pour
    une infraction au Code criminel, l''amende pour une première infraction varie
    de :'
  choices:
    A: 500 $ à 2 000 $
    B: 1 000 $ à 5 000 $
    C: 2 000 $ à 10 000 $
    D: 5 000 $ à 25 000 $
  answer: D
  explanation: Conduire pendant une suspension pour une infraction au Code criminel
    entraîne une amende très élevée en Ontario, allant de 5 000 $ à 25 000 $ pour
    une première infraction.
- id: 147
  category: penalties_and_points
  question: En Ontario, quelle est l'amende pour avoir omis de s'arrêter pour un piéton
    à un passage pour piétons ?
  choices:
    A: 100 $ à 500 $
    B: 300 $ à 1 000 $
    C: 500 $ à 1 500 $
    D: 1 000 $ à 2 000 $
  answer: B
  explanation: Les conducteurs qui ne cèdent pas le passage aux piétons aux passages
    pour piétons ou aux passages d'écoliers s'exposent à des amendes comprises entre
    300 $ et 1 000 $ et à 4 points d'inaptitude.
- id: 148
  category: penalties_and_points
  question: 'Pour une première condamnation pour conduite distraite, un conducteur
    titulaire d''un permis complet (catégorie G) verra son permis suspendu pendant
    :'
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: B
  explanation: En Ontario, une première condamnation pour conduite distraite pour
    un conducteur de catégorie G comprend une suspension de permis obligatoire de
    3 jours.
- id: 149
  category: penalties_and_points
  question: 'En vertu de la loi « Move Over » (ralentir et s''écarter), le fait de
    ne pas ralentir et de ne pas s''écarter pour un véhicule d''urgence dont les feux
    clignotent peut entraîner, pour une première infraction, une amende de :'
  choices:
    A: 100 $ à 500 $
    B: 200 $ à 1 000 $
    C: 400 $ à 2 000 $
    D: 1 000 $ à 5 000 $
  answer: C
  explanation: La loi ontarienne sur l'obligation de ralentir et de s'écarter prévoit
    une amende de 400 $ à 2 000 $ et 3 points d'inaptitude pour une première infraction.
- id: 150
  category: penalties_and_points
  question: En Ontario, combien de points d'inaptitude sont ajoutés à votre dossier
    pour un excès de vitesse de 16 à 29 km/h au-dessus de la limite affichée ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Un excès de vitesse compris entre 16 et 29 km/h au-dessus de la limite
    de vitesse affichée entraîne 3 points d'inaptitude en Ontario.
- id: 151
  category: sharing_the_road
  question: Lorsque vous conduisez sur une route SANS terre-plein central, à quelle
    distance devez-vous vous arrêter derrière un autobus scolaire dont les feux rouges
    supérieurs clignotent et dont le bras d'arrêt est déployé ?
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 20 mètres
    D: 50 mètres
  answer: C
  explanation: En Ontario, sur une route sans terre-plein central, les automobilistes
    circulant dans les deux sens doivent s'arrêter à au moins 20 mètres d'un autobus
    scolaire dont les feux rouges clignotent.
- id: 152
  category: sharing_the_road
  question: Quelle est la distance minimale qu'un automobiliste doit maintenir lorsqu'il
    dépasse un cycliste en Ontario ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 2 mètres
    D: 3 mètres
  answer: B
  explanation: La loi de l'Ontario exige que les automobilistes maintiennent une distance
    minimale d'un mètre lorsqu'ils dépassent un cycliste, dans la mesure du possible.
- id: 153
  category: sharing_the_road
  question: Lorsqu'un tramway s'arrête pour laisser monter ou descendre des passagers
    et qu'il n'y a pas de zone de sécurité, à quelle distance derrière les portes
    arrière le conducteur doit-il s'arrêter ?
  choices:
    A: 1 mètre
    B: 2 mètres
    C: 5 mètres
    D: 10 mètres
  answer: B
  explanation: Les conducteurs doivent rester à au moins deux mètres derrière les
    portes arrière d'un tramway lorsqu'il est arrêté pour permettre aux passagers
    de monter ou de descendre, à moins qu'il n'y ait une zone de sécurité pour piétons.
- id: 154
  category: sharing_the_road
  question: Quelle est la sanction en points d'inaptitude pour une première condamnation
    pour avoir omis de se tasser pour un véhicule d'urgence ou une dépanneuse dont
    les feux clignotent ?
  choices:
    A: 2 points
    B: 3 points
    C: 6 points
    D: 7 points
  answer: B
  explanation: Une condamnation pour avoir omis de se tasser pour un véhicule d'urgence
    ou une dépanneuse entraîne 3 points d'inaptitude, ainsi qu'une amende importante.
- id: 155
  category: sharing_the_road
  question: Pourquoi devriez-vous rester bien en retrait lorsque vous suivez un gros
    camion commercial ?
  choices:
    A: Pour permettre au conducteur du camion de vous voir dans ses rétroviseurs latéraux
    B: Pour éviter les angles morts (zones de danger)
    C: Pour avoir une meilleure vue de la route devant vous
    D: Toutes les réponses ci-dessus
  answer: D
  explanation: Rester en retrait vous permet de voir les rétroviseurs du camion (ce
    qui signifie que le conducteur peut vous voir), d'éviter les angles morts et d'améliorer
    votre visibilité globale des conditions de circulation.
- id: 156
  category: sharing_the_road
  question: Si vous tournez à droite à une intersection et qu'un cycliste est positionné
    à votre droite et a l'intention d'aller tout droit, qui a la priorité ?
  choices:
    A: L'automobiliste, parce qu'il est plus gros
    B: Le cycliste
    C: Le premier arrivé à l'intersection
    D: L'automobiliste, car les cyclistes doivent toujours céder le passage aux voitures
      qui tournent
  answer: B
  explanation: Les cyclistes qui vont tout droit ont la priorité sur les automobilistes
    qui tournent à droite. Vous devez vérifier votre angle mort pour détecter les
    cyclistes avant d'effectuer un virage à droite.
- id: 157
  category: sharing_the_road
  question: Sur une route divisée par un terre-plein central, les véhicules s'approchant
    d'un autobus scolaire par l'avant (sens inverse) doivent-ils s'arrêter lorsque
    l'autobus a ses feux rouges clignotants ?
  choices:
    A: Oui, ils doivent toujours s'arrêter
    B: Non, seuls les véhicules suivant l'autobus doivent s'arrêter
    C: Oui, mais seulement s'il y a plus de deux voies
    D: Non, mais ils doivent klaxonner
  answer: B
  explanation: Sur une route divisée par un terre-plein central, la circulation venant
    du sens inverse d'un autobus scolaire n'est pas tenue de s'arrêter.
- id: 158
  category: sharing_the_road
  question: En Ontario, l'inter-file (une moto circulant entre deux voies de circulation)
    est-elle légale ?
  choices:
    A: Oui, c'est encouragé pour réduire le trafic
    B: Oui, mais seulement à des vitesses inférieures à 20 km/h
    C: Non, c'est illégal et considéré comme une manœuvre dangereuse
    D: Oui, mais seulement sur les autoroutes de la série 400
  answer: C
  explanation: L'inter-file est illégale en Ontario et peut entraîner des accusations
    telles que la conduite imprudente ou un changement de voie dangereux.
- id: 159
  category: sharing_the_road
  question: Quelle est la distance de suivi minimale que vous devez maintenir derrière
    un véhicule du service d'incendie répondant à une alarme ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: L'article 159(3) du Code de la route stipule que vous ne devez pas
    suivre à moins de 150 mètres un véhicule du service d'incendie répondant à une
    alarme.
- id: 160
  category: sharing_the_road
  question: 'Si vous voyez un piéton utilisant une canne blanche, cela indique généralement
    que la personne :'
  choices:
    A: Est une personne âgée
    B: A une déficience visuelle
    C: Est un brigadier scolaire
    D: Est une personne ayant un handicap physique
  answer: B
  explanation: Une canne blanche est un outil utilisé par les personnes aveugles ou
    malvoyantes pour se déplacer en toute sécurité. Les conducteurs doivent faire
    preuve d'une prudence accrue.
- id: 161
  category: sharing_the_road
  question: Quelle est la pénalité en points d'inaptitude pour un conducteur qui ne
    laisse pas la distance obligatoire de 1 mètre en dépassant un cycliste ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 0 point (amende seulement)
  answer: A
  explanation: Le fait de ne pas laisser une distance d'un mètre lors du dépassement
    d'un vélo entraîne 2 points d'inaptitude en cas de condamnation.
- id: 162
  category: sharing_the_road
  question: 'Lorsqu''un gros camion tourne à droite à une intersection, il peut souvent
    :'
  choices:
    A: Tourner à partir de la voie de gauche
    B: S'écarter largement vers la gauche avant de tourner à droite
    C: S'arrêter et reculer pour effectuer le virage
    D: Accélérer pour dégager l'intersection
  answer: B
  explanation: Les gros camions ont besoin de plus d'espace pour tourner. Ils peuvent
    s'écarter largement vers la gauche pour éviter de heurter le trottoir lors d'un
    virage à droite. N'essayez pas de les dépasser par la droite à une intersection.
- id: 163
  category: sharing_the_road
  question: Dans une zone scolaire, si un brigadier scolaire brandit un panneau «
    ARRÊT », quand pouvez-vous circuler ?
  choices:
    A: Dès que les enfants ont atteint le trottoir
    B: Lorsque le brigadier n'est plus dans votre voie
    C: Uniquement lorsque le brigadier et tous les enfants ont atteint le trottoir
      en toute sécurité et que le brigadier a abaissé son panneau
    D: Si le brigadier vous fait signe de passer alors qu'il est encore sur la chaussée
  answer: C
  explanation: En vertu du Code de la route, les conducteurs doivent rester arrêtés
    jusqu'à ce que le brigadier scolaire et tous les piétons aient complètement quitté
    la chaussée.
- id: 164
  category: sharing_the_road
  question: 'À l''approche d''un véhicule de secours arrêté avec ses feux rouges ou
    rouges et bleus clignotants sur une autoroute à deux voies ou plus dans la même
    direction, la loi ontarienne sur le « corridor de sécurité » (Move Over) vous
    oblige à :'
  choices:
    A: S'arrêter immédiatement dans votre voie
    B: Maintenir votre vitesse mais klaxonner pour alerter l'agent
    C: Ralentir et changer de voie si cela peut être fait en toute sécurité
    D: Accélérer pour dépasser le véhicule le plus rapidement possible
  answer: C
  explanation: La loi de l'Ontario exige que les conducteurs ralentissent et, si cela
    est sécuritaire, changent de voie lorsqu'ils dépassent un véhicule de secours
    ou une dépanneuse dont les feux clignotent.
- id: 165
  category: sharing_the_road
  question: Les gros véhicules commerciaux ont des « No-Zones ». À quoi ce terme fait-il
    référence ?
  choices:
    A: Aux zones où les camions ne sont pas autorisés à circuler
    B: À la zone de chargement du camion
    C: Aux angles morts à l'avant, à l'arrière et sur les côtés du camion
    D: À la limite de poids du camion
  answer: C
  explanation: La « No-Zone » fait référence aux angles morts importants autour d'un
    camion commercial où le conducteur ne peut pas voir les autres véhicules. Si vous
    ne voyez pas le visage du conducteur dans ses rétroviseurs, il ne peut pas vous
    voir.
- id: 166
  category: sharing_the_road
  question: En Ontario, quelles sont les sanctions pour l'emportiérage d'un cycliste
    (ouvrir la portière d'un véhicule sur la trajectoire d'un cycliste) ?
  choices:
    A: Une amende de 50 $ et 1 point d'inaptitude
    B: Une amende de 150 $ et aucun point d'inaptitude
    C: Une amende de 300 $ à 1 000 $ et 3 points d'inaptitude
    D: Une suspension obligatoire du permis de 7 jours
  answer: C
  explanation: La loi ontarienne sur l'emportiérage prévoit une amende comprise entre
    300 $ et 1 000 $ et 3 points d'inaptitude en cas de condamnation.
- id: 167
  category: sharing_the_road
  question: Lorsqu'un autobus scolaire est arrêté sur une route comportant un terre-plein
    central, qui doit s'arrêter lorsque l'autobus a ses feux rouges clignotants ?
  choices:
    A: Seulement les véhicules arrivant de l'avant
    B: Seulement les véhicules venant de l'arrière de l'autobus
    C: Les véhicules dans les deux sens
    D: Personne n'est tenu de s'arrêter sur une route à chaussées séparées
  answer: B
  explanation: Sur une route séparée par un terre-plein central, seuls les véhicules
    qui suivent l'autobus scolaire doivent s'arrêter. La circulation venant de la
    direction opposée (de l'autre côté du terre-plein) n'a pas besoin de s'arrêter.
- id: 168
  category: sharing_the_road
  question: 'Lorsque vous suivez une motocyclette, vous devez prévoir :'
  choices:
    A: Une distance de suivi moindre qu'une voiture car elles sont plus petites
    B: La même distance de suivi qu'une voiture
    C: Au moins une distance de suivi de deux secondes
    D: Une distance de suivi de trois secondes ou plus
  answer: D
  explanation: Comme les motocyclettes peuvent s'arrêter très rapidement et sont plus
    affectées par l'état de la route, vous devez laisser une distance de suivi d'au
    moins trois secondes (ou plus par mauvais temps).
- id: 169
  category: sharing_the_road
  question: 'Le panneau « Véhicule lent » est un triangle orange avec une bordure
    rouge. Ce panneau est affiché sur les véhicules qui circulent à moins de :'
  choices:
    A: 20 km/h
    B: 40 km/h
    C: 60 km/h
    D: 80 km/h
  answer: B
  explanation: Le panneau de véhicule lent est obligatoire sur les véhicules (comme
    les tracteurs agricoles ou les équipements de construction) qui circulent à 40
    km/h ou moins.
- id: 170
  category: sharing_the_road
  question: En Ontario, la loi exige que les cyclistes possèdent quel équipement lorsqu'ils
    circulent d'une demi-heure avant le coucher du soleil à une demi-heure après son
    lever ?
  choices:
    A: Un feu blanc à l'avant et un feu rouge ou un réflecteur à l'arrière
    B: Une sonnette ou un klaxon
    C: Du ruban réfléchissant blanc sur la fourche avant
    D: Toutes ces réponses
  answer: D
  explanation: Pour la conduite de nuit, la loi de l'Ontario exige un feu blanc à
    l'avant, un feu rouge ou un réflecteur à l'arrière, ainsi que du ruban réfléchissant
    blanc sur la fourche avant et du ruban réfléchissant rouge sur les haubans arrière.
    Une sonnette ou un klaxon est requis en tout temps.
- id: 171
  category: sharing_the_road
  question: 'Lorsque vous entendez une sirène ou voyez les feux clignotants d''un
    véhicule d''urgence s''approchant de n''importe quelle direction, vous devez :'
  choices:
    A: Accélérer pour dégager la voie
    B: Vous ranger le plus possible vers la droite et vous arrêter
    C: Vous arrêter exactement là où vous êtes
    D: Vous ranger vers la gauche et vous arrêter
  answer: B
  explanation: Les conducteurs doivent se ranger le plus possible vers la droite et
    s'immobiliser complètement jusqu'à ce que le véhicule d'urgence soit passé, en
    veillant à ne pas bloquer les intersections ou les sorties de secours.
- id: 172
  category: vehicle_information
  question: En Ontario, à quel moment êtes-vous tenu d'allumer les phares de votre
    véhicule ?
  choices:
    A: Du coucher au lever du soleil
    B: D'une heure après le coucher du soleil à une heure avant le lever du soleil
    C: D'une demi-heure après le coucher du soleil à une demi-heure avant le lever
      du soleil
    D: Uniquement lorsqu'il pleut ou qu'il neige
  answer: C
  explanation: Selon le Code de la route de l'Ontario, article 62(1), les phares doivent
    être allumés d'une demi-heure après le coucher du soleil à une demi-heure avant
    le lever du soleil, et à tout autre moment où la visibilité est inférieure à 150
    mètres.
- id: 173
  category: vehicle_information
  question: 'Lorsque vous utilisez les phares de route (pleins phares), la loi de
    l''Ontario exige que vous passiez aux phares de croisement (codes) lorsqu''un
    véhicule arrivant en sens inverse se trouve à moins de :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: En vertu de l'article 168 du Code de la route, les conducteurs doivent
    passer aux phares de croisement lorsqu'un véhicule arrivant en sens inverse se
    trouve à moins de 150 mètres afin d'éviter d'éblouir l'autre conducteur.
- id: 174
  category: vehicle_information
  question: En Ontario, quelle est la profondeur de sculpture minimale légale pour
    les pneus d'un véhicule de tourisme ?
  choices:
    A: 1,0 millimètre
    B: 1,5 millimètre
    C: 1,6 millimètre
    D: 2,0 millimètres
  answer: B
  explanation: Le Règlement de l'Ontario 625 stipule que les pneus d'un véhicule à
    moteur ne doivent pas être usés au point où la profondeur de la sculpture est
    inférieure à 1,5 millimètre.
- id: 175
  category: vehicle_information
  question: En Ontario, tout véhicule à moteur doit être équipé de combien de systèmes
    de freinage indépendants ?
  choices:
    A: Un
    B: Deux
    C: Trois
    D: Quatre
  answer: B
  explanation: 'L''article 64 du Code de la route exige que tout véhicule à moteur
    (autre qu''une motocyclette) soit équipé de deux systèmes de freinage indépendants
    : un frein de service (frein au pied) et un frein de stationnement ou de secours.'
- id: 176
  category: vehicle_information
  question: Laquelle des affirmations suivantes est vraie concernant le teintage des
    vitres après-vente sur le pare-brise d'un véhicule en Ontario ?
  choices:
    A: Il est autorisé s'il est sombre à moins de 30 %
    B: Il est autorisé uniquement sur les 15 cm supérieurs du pare-brise
    C: Aucun teintage après-vente n'est autorisé sur le pare-brise
    D: Il est autorisé si le conducteur possède une note médicale
  answer: C
  explanation: La loi de l'Ontario interdit l'application de tout teintage de vitre
    après-vente sur le pare-brise. Pour les véhicules fabriqués après le 1er janvier
    2017, les vitres latérales avant doivent également laisser passer au moins 70
    % de la lumière.
- id: 177
  category: vehicle_information
  question: 'En Ontario, un véhicule à moteur doit être équipé d''un klaxon capable
    d''émettre un son audible dans des conditions normales à une distance d''au moins
    :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: L'article 75(4) du Code de la route exige que tout véhicule à moteur
    soit équipé d'un klaxon en bon état de fonctionnement capable d'émettre un son
    audible à une distance d'au moins 60 mètres.
- id: 178
  category: vehicle_information
  question: Si vous remorquez une remorque en Ontario d'une largeur de 2,05 mètres
    ou plus, quel équipement supplémentaire est requis ?
  choices:
    A: Un panneau « Wide Load » (chargement large) à l'avant du véhicule tracteur
    B: Des feux de gabarit et des réflecteurs
    C: Un véhicule d'escorte suivant derrière
    D: Des rétroviseurs extérieurs prolongés dépassant de 50 cm la remorque
  answer: B
  explanation: En vertu du Code de la route, les remorques d'une largeur de 2,05 mètres
    ou plus doivent être équipées de feux de gabarit et de réflecteurs pour indiquer
    la largeur du véhicule aux autres conducteurs.
- id: 179
  category: vehicle_information
  question: 'En Ontario, la plaque d''immatriculation arrière doit être éclairée par
    une lumière blanche afin que la plaque soit clairement visible à une distance
    de :'
  choices:
    A: 15 mètres
    B: 30 mètres
    C: 50 mètres
    D: 100 mètres
  answer: A
  explanation: L'article 62(19) du Code de la route exige que la plaque d'immatriculation
    arrière soit éclairée par une lumière blanche afin que les numéros sur la plaque
    soient clairement visibles à une distance de 15 mètres.
- id: 180
  category: vehicle_information
  question: Si le rétroviseur intérieur de votre véhicule est obstrué par une remorque
    ou un chargement, qu'exige la loi de l'Ontario ?
  choices:
    A: Vous devez retirer l'obstruction immédiatement
    B: Vous devez avoir un rétroviseur extérieur du côté gauche uniquement
    C: Vous devez avoir des rétroviseurs extérieurs sur les côtés gauche et droit
    D: Vous devez conduire avec vos feux de détresse allumés
  answer: C
  explanation: Si la vue depuis le rétroviseur intérieur est obstruée, le Code de
    la route exige que le véhicule soit équipé de rétroviseurs latéraux à gauche et
    à droite pour offrir une vue dégagée de la route vers l'arrière.
- id: 181
  category: vehicle_information
  question: 'Tout véhicule à moteur doit être équipé d''un silencieux en bon état
    de fonctionnement pour prévenir :'
  choices:
    A: Tout son provenant du moteur
    B: Un bruit excessif ou inhabituel et une fumée excessive
    C: La surchauffe du moteur
    D: Le véhicule de dépasser la limite de vitesse
  answer: B
  explanation: L'article 75(1) du Code de la route exige un silencieux pour prévenir
    les bruits excessifs ou inhabituels et la fumée excessive. Il interdit également
    l'utilisation de « dispositifs de dérivation du silencieux » ou d'appareils similaires.
- id: 182
  category: vehicle_information
  question: 'Un panneau « Véhicule lent » doit être affiché à l''arrière de tout véhicule
    conçu pour circuler à une vitesse de :'
  choices:
    A: 20 km/h ou moins
    B: 40 km/h ou moins
    C: 60 km/h ou moins
    D: 80 km/h ou moins
  answer: B
  explanation: En vertu de l'article 76 du Code de la route, un panneau de véhicule
    lent (un triangle orange avec une bordure rouge) doit être affiché à l'arrière
    de tout véhicule circulant à 40 km/h ou moins.
- id: 183
  category: vehicle_information
  question: 'En Ontario, il est illégal de conduire un véhicule à moteur si un écran
    de télévision ou d''ordinateur est visible par le conducteur, SAUF pour :'
  choices:
    A: Regarder un film dans un trafic dense
    B: Consulter les notifications des réseaux sociaux
    C: Un écran de navigation GPS ou un écran fournissant des informations sur le
      véhicule
    D: Lire un livre numérique
  answer: C
  explanation: L'article 78.1 du Code de la route interdit les écrans visibles par
    le conducteur, mais prévoit des exceptions pour les écrans utilisés pour la navigation
    GPS, les informations sur le système du véhicule ou l'évitement de collisions.
- id: 184
  category: vehicle_information
  question: En Ontario, tout véhicule à moteur (autre qu'une motocyclette) doit être
    équipé de quel élément suivant pour une utilisation par mauvais temps ?
  choices:
    A: Phares antibrouillard
    B: Un système d'essuie-glace en bon état de fonctionnement
    C: Pneus d'hiver entre octobre et avril
    D: Garde-boue sur les quatre roues
  answer: B
  explanation: L'article 66(2) du Code de la route exige que tout véhicule à moteur
    autre qu'une motocyclette soit équipé d'un système d'essuie-glace en bon état
    de fonctionnement.
- id: 185
  category: vehicle_information
  question: En Ontario, quelle couleur de feu clignotant est utilisée par les pompiers
    bénévoles répondant à une urgence dans leur véhicule personnel ?
  choices:
    A: Rouge
    B: Bleu
    C: Vert
    D: Ambre
  answer: C
  explanation: Un feu vert clignotant sur un véhicule identifie un pompier bénévole
    répondant à un appel d'urgence. Les autres conducteurs devraient céder le passage
    par courtoisie.
- id: 186
  category: vehicle_information
  question: 'En vertu du Code de la route, le klaxon de votre véhicule doit être audible
    à une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: La loi de l'Ontario exige que tout véhicule à moteur soit équipé d'un
    klaxon en bon état de fonctionnement et capable d'émettre un son audible dans
    des conditions normales à une distance d'au moins 60 mètres.
- id: 187
  category: vehicle_information
  question: Quand les pneus à crampons sont-ils autorisés dans le Nord de l'Ontario
    (districts tels qu'Algoma, Cochrane, Kenora, etc.) ?
  choices:
    A: Toute l'année
    B: Du 1er octobre au 30 avril
    C: Du 1er septembre au 31 mai
    D: Du 1er novembre au 31 mars
  answer: C
  explanation: Dans le Nord de l'Ontario, les pneus à crampons peuvent être utilisés
    du 1er septembre au 31 mai. Pour les résidents du Sud de l'Ontario, ils sont généralement
    interdits, sauf si le véhicule provient de l'extérieur de la province ou si le
    conducteur vient du Nord.
- id: 188
  category: vehicle_information
  question: 'En Ontario, votre véhicule doit avoir un rétroviseur. Si votre vue à
    travers le rétroviseur est obstruée par une remorque ou un chargement, vous devez
    :'
  choices:
    A: Retirer l'obstruction immédiatement
    B: Avoir des rétroviseurs extérieurs gauche et droit
    C: Conduire uniquement pendant les heures de clarté
    D: Installer un système de caméra ; les rétroviseurs ne sont pas requis
  answer: B
  explanation: Si le rétroviseur intérieur est obstrué, le Code de la route exige
    que le véhicule soit équipé de rétroviseurs sur les côtés extérieurs gauche et
    droit offrant une vue dégagée de la route vers l'arrière.
- id: 189
  category: vehicle_information
  question: 'Selon la loi de l''Ontario, les phares doivent être allumés :'
  choices:
    A: Du coucher au lever du soleil
    B: D'une heure après le coucher du soleil à une heure avant le lever du soleil
    C: D'une demi-heure avant le coucher du soleil à une demi-heure après le lever
      du soleil
    D: Uniquement lorsqu'il pleut ou qu'il neige
  answer: C
  explanation: Les phares doivent être allumés d'une demi-heure avant le coucher du
    soleil à une demi-heure après le lever du soleil, et à tout autre moment où la
    visibilité est réduite à moins de 150 mètres.
- id: 190
  category: vehicle_information
  question: Quelle est l'exigence légale concernant l'état du silencieux d'un véhicule
    en Ontario ?
  choices:
    A: Il doit être assez bruyant pour avertir les piétons
    B: Il doit prévenir les bruits et la fumée excessifs ou inhabituels
    C: Il n'est requis que pour les véhicules de plus de 10 ans
    D: Il doit être chromé
  answer: B
  explanation: Le Code de la route exige que tout véhicule à moteur soit équipé d'un
    silencieux en bon état de fonctionnement pour prévenir les bruits excessifs ou
    inhabituels et la fumée excessive.
- id: 191
  category: vehicle_information
  question: Concernant les plaques d'immatriculation en Ontario, laquelle des situations
    suivantes est illégale ?
  choices:
    A: Utiliser un cadre qui ne couvre aucun chiffre ni aucune lettre
    B: Utiliser un couvercle en plastique transparent qui n'obstrue pas la vue
    C: Utiliser un couvercle teinté ou coloré qui obstrue la vue de la plaque
    D: Fixer la plaque sur le pare-chocs arrière
  answer: C
  explanation: Il est illégal d'utiliser tout couvercle ou dispositif qui obstrue
    ou décolore la plaque d'immatriculation, la rendant difficile à lire pour la police
    ou les caméras.
- id: 192
  category: vehicle_information
  question: En Ontario, combien de lampes émettant une lumière blanche sont autorisées
    à l'arrière d'un véhicule lorsqu'il avance ?
  choices:
    A: Zéro
    B: Une
    C: Deux
    D: Autant que le conducteur le souhaite
  answer: A
  explanation: À l'exception de l'éclairage de la plaque d'immatriculation et des
    feux de recul (qui ne s'activent qu'en marche arrière), aucun véhicule ne doit
    être équipé d'une lampe projetant une lumière blanche vers l'arrière lorsqu'il
    avance.
- id: 193
  category: vehicle_information
  question: Si vous êtes surpris à conduire un véhicule dont l'odomètre a été trafiqué
    en Ontario, vous enfreignez quelle loi ?
  choices:
    A: La Loi sur la protection de l'environnement
    B: Le Code de la route (Highway Traffic Act)
    C: Le Code criminel du Canada
    D: La Loi sur la protection du consommateur
  answer: B
  explanation: Modifier un odomètre pour fausser le kilométrage d'un véhicule est
    une infraction en vertu du Code de la route de l'Ontario.
- id: 194
  category: signs_and_signals
  question: En Ontario, à l'approche d'un passage pour piétons muni de feux clignotants,
    que doit faire un conducteur ?
  choices:
    A: S'arrêter et repartir une fois que le piéton a traversé la moitié de la chaussée.
    B: Ralentir et avancer avec prudence si le piéton n'est pas dans votre voie.
    C: S'arrêter et rester à l'arrêt jusqu'à ce que tous les piétons aient complètement
      traversé la route.
    D: Klaxonner pour alerter le piéton et avancer lentement.
  answer: C
  explanation: Selon le Code de la route de l'Ontario, les conducteurs doivent s'arrêter
    et rester à l'arrêt jusqu'à ce que le piéton ait complètement traversé la chaussée
    à un passage pour piétons (identifié par des panneaux spécifiques et souvent des
    feux clignotants).
- id: 195
  category: signs_and_signals
  question: Que signifie un feu bleu clignotant sur le toit d'un véhicule en Ontario
    ?
  choices:
    A: Un véhicule de police en intervention d'urgence.
    B: Un véhicule de déneigement en service.
    C: Un pompier volontaire répondant à un appel.
    D: Une ambulance ou un camion de pompiers.
  answer: B
  explanation: En Ontario, les feux bleus clignotants sont utilisés spécifiquement
    sur les véhicules de déneigement pour améliorer la visibilité lors des opérations
    d'entretien hivernal.
- id: 196
  category: signs_and_signals
  question: 'Un signal lumineux avec une barre verticale blanche sur fond noir signifie
    :'
  choices:
    A: Tous les véhicules peuvent continuer tout droit.
    B: Seuls les véhicules d'urgence peuvent passer.
    C: Seuls les véhicules de transport en commun peuvent passer.
    D: La voie est fermée pour cause de travaux.
  answer: C
  explanation: Une barre verticale blanche sur fond noir est un signal de priorité
    pour le transport en commun, permettant aux autobus de traverser l'intersection
    pendant que les autres véhicules restent à l'arrêt.
- id: 197
  category: signs_and_signals
  question: Lorsqu'un feu de signalisation affiche une flèche verte de virage à gauche
    alors que le feu principal est rouge, qu'êtes-vous autorisé à faire ?
  choices:
    A: Tourner à gauche, car vous avez la priorité.
    B: S'arrêter et attendre que le feu principal passe au vert.
    C: Tourner à gauche seulement s'il n'y a pas de circulation en sens inverse.
    D: Tourner à droite après avoir marqué un arrêt complet.
  answer: A
  explanation: Une flèche verte indique un virage protégé ; vous pouvez avancer dans
    la direction de la flèche, et la circulation venant en sens inverse fera face
    à un feu rouge.
- id: 198
  category: signs_and_signals
  question: En Ontario, que signifie un feu jaune (ambre) clignotant à une intersection
    ?
  choices:
    A: S'arrêter et attendre que le feu passe au vert.
    B: Le feu est sur le point de passer au rouge ; dégagez l'intersection.
    C: Ralentir et avancer avec prudence.
    D: Le traiter comme un arrêt obligatoire à quatre sens.
  answer: C
  explanation: Un feu jaune clignotant signifie que vous devez ralentir et traverser
    l'intersection avec prudence.
- id: 199
  category: signs_and_signals
  question: Quelle est la signification d'un panneau représentant un cercle rouge
    avec une barre horizontale blanche au milieu ?
  choices:
    A: Arrêt interdit.
    B: Entrée interdite.
    C: Stationnement interdit.
    D: Rue à sens unique devant.
  answer: B
  explanation: Le panneau « Entrée interdite » est un panneau de prescription indiquant
    qu'il est interdit aux véhicules de s'engager sur la chaussée dans cette direction.
- id: 200
  category: signs_and_signals
  question: Quel signal manuel est correct pour un conducteur ayant l'intention de
    ralentir ou de s'arrêter ?
  choices:
    A: Le bras gauche tendu horizontalement par la fenêtre.
    B: Le bras gauche sorti et plié vers le haut au niveau du coude.
    C: Le bras gauche sorti et plié vers le bas au niveau du coude, la paume vers
      l'arrière.
    D: Le bras droit tendu horizontalement par la fenêtre du passager.
  answer: C
  explanation: Pour signaler un arrêt ou une diminution de vitesse, le conducteur
    doit sortir son bras gauche par la fenêtre et le pointer vers le bas.
- id: 201
  category: signs_and_signals
  question: Un panneau « Véhicule à lente allure » est obligatoire sur les véhicules
    circulant à quelle vitesse maximale ?
  choices:
    A: 30 km/h ou moins.
    B: 40 km/h ou moins.
    C: 50 km/h ou moins.
    D: 60 km/h ou moins.
  answer: B
  explanation: Le panneau triangulaire orange avec une bordure rouge doit être affiché
    à l'arrière de tout véhicule circulant à moins de 40 km/h.
- id: 202
  category: signs_and_signals
  question: En Ontario, qu'indique une ligne blanche continue sur le côté gauche de
    votre voie ?
  choices:
    A: Vous pouvez la franchir pour dépasser d'autres véhicules.
    B: Elle sépare les voies de circulation circulant dans la même direction ; le
      franchissement est déconseillé.
    C: Elle sépare les véhicules circulant dans des directions opposées.
    D: Elle marque le bord de l'accotement.
  answer: B
  explanation: Les lignes blanches continues sont utilisées pour séparer les voies
    de circulation circulant dans la même direction. Bien qu'il ne soit pas strictement
    illégal de les franchir dans tous les contextes, cela est déconseillé et indique
    souvent que les changements de voie sont dangereux.
- id: 203
  category: signs_and_signals
  question: De quelle forme et de quelle couleur est un panneau « Cédez le passage
    » standard en Ontario ?
  choices:
    A: Un triangle inversé avec une bordure rouge et un centre blanc.
    B: Un octogone avec un fond rouge et du texte blanc.
    C: Un losange avec un fond jaune et des symboles noirs.
    D: Un carré avec un fond blanc et du texte noir.
  answer: A
  explanation: Le panneau de cédez le passage est un triangle équilatéral pointant
    vers le bas, avec une bordure rouge et un intérieur blanc.
- id: 204
  category: signs_and_signals
  question: 'Un panneau affichant un cercle vert avec une flèche pointant tout droit
    à l''intérieur signifie :'
  choices:
    A: Vous devez obligatoirement aller tout droit.
    B: Vous pouvez aller tout droit ou tourner.
    C: Rue à sens unique devant.
    D: Intersection cachée devant.
  answer: A
  explanation: Un cercle vert est un panneau d'obligation ou de permission. Lorsqu'il
    contient une flèche droite, il indique que vous n'êtes autorisé qu'à aller tout
    droit à l'intersection.
- id: 205
  category: signs_and_signals
  question: Quel est l'objectif d'un « sas vélo » (une zone peinte en vert avec un
    symbole de bicyclette blanc) à une intersection ?
  choices:
    A: C'est une place de stationnement pour les vélos uniquement.
    B: Il permet aux cyclistes de se placer devant les véhicules arrêtés pour être
      plus visibles.
    C: C'est une zone de déchargement pour les camions de livraison.
    D: Il indique une voie cyclable à grande vitesse.
  answer: B
  explanation: Les sas vélo sont conçus pour augmenter la visibilité des cyclistes
    aux intersections en leur permettant d'attendre devant le trafic motorisé à un
    feu rouge.
- id: 206
  category: signs_and_signals
  question: Qu'indique généralement un panneau avec un fond orange et des symboles
    noirs ?
  choices:
    A: Des règles réglementaires comme les limites de vitesse.
    B: Des points d'intérêt et des services.
    C: Des conditions temporaires ou des zones de travaux.
    D: Des zones scolaires et des passages pour piétons.
  answer: C
  explanation: En Ontario, les panneaux oranges sont utilisés pour les conditions
    temporaires, telles que la construction routière, l'entretien ou les déviations
    de trafic.
- id: 207
  category: signs_and_signals
  question: 'Un symbole de losange blanc peint sur une voie en Ontario indique :'
  choices:
    A: Un passage à niveau devant
    B: Une voie réservée aux véhicules à occupation multiple (VOM/HOV) ou une voie
      réservée
    C: Un passage pour piétons
    D: Une zone où le dépassement est autorisé
  answer: B
  explanation: Le symbole du losange marque les voies réservées à certains types de
    véhicules, tels que les autobus, les taxis ou les véhicules transportant un nombre
    minimal d'occupants (VOM).
- id: 208
  category: signs_and_signals
  question: 'En Ontario, un feu vert clignotant à une intersection (vert avancé) signifie
    :'
  choices:
    A: Vous devez vous arrêter et attendre qu'il devienne vert fixe
    B: Vous pouvez tourner à gauche, aller tout droit ou tourner à droite pendant
      que le trafic opposé fait face à un feu rouge
    C: Le feu est sur le point de passer au rouge immédiatement
    D: Les piétons ont la priorité dans toutes les directions
  answer: B
  explanation: Un feu vert clignotant ou une flèche verte avec un feu vert est un
    signal « avancé » qui vous permet de tourner à gauche, d'aller tout droit ou de
    tourner à droite pendant que la circulation venant en sens inverse est arrêtée
    par un feu rouge.
- id: 209
  category: signs_and_signals
  question: En approchant d'un feu rouge clignotant à une intersection, que devez-vous
    faire ?
  choices:
    A: Ralentir et avancer avec prudence sans s'arrêter
    B: S'arrêter et attendre que le feu devienne vert fixe
    C: S'arrêter, et ne repartir que lorsqu'il est sécuritaire de le faire
    D: Céder le passage au trafic venant de la droite uniquement, puis avancer
  answer: C
  explanation: Un feu rouge clignotant doit être traité de la même manière qu'un panneau
    d'arrêt. Vous devez marquer un arrêt complet et ne repartir que lorsque la voie
    est libre.
- id: 210
  category: signs_and_signals
  question: 'Un panneau en forme de pentagone (cinq côtés) est utilisé en Ontario
    pour :'
  choices:
    A: Les panneaux d'arrêt
    B: Les panneaux de cédez le passage
    C: Les zones scolaires ou les passages scolaires
    D: Les zones hospitalières
  answer: C
  explanation: Les panneaux en forme de pentagone sont spécifiquement utilisés pour
    avertir les conducteurs qu'ils entrent dans une zone scolaire ou qu'ils approchent
    d'un passage scolaire.
- id: 211
  category: signs_and_signals
  question: Si les clignotants de votre véhicule ne fonctionnent pas, quel est le
    signal manuel correct pour un virage à droite ?
  choices:
    A: Bras gauche tendu horizontalement par la fenêtre
    B: Bras gauche sorti par la fenêtre et plié vers le haut au niveau du coude
    C: Bras gauche sorti par la fenêtre et pointant vers le sol
    D: Bras droit tendu horizontalement par la fenêtre
  answer: B
  explanation: Pour signaler un virage à droite à l'aide de signaux manuels, le conducteur
    sort le bras gauche par la fenêtre et le plie vers le haut au niveau du coude.
- id: 212
  category: signs_and_signals
  question: Que signifie une ligne blanche continue sur la chaussée entre deux voies
    de circulation circulant dans la même direction ?
  choices:
    A: Vous pouvez changer de voie à tout moment
    B: Elle marque uniquement le bord de la route
    C: Le changement de voie est déconseillé ou interdit
    D: Il s'agit d'une voie réservée aux véhicules d'urgence
  answer: C
  explanation: Une ligne blanche continue entre les voies de circulation indique que
    le changement de voie est déconseillé ou peut être illégal dans certains contextes
    (comme à l'approche d'une intersection).
- id: 213
  category: signs_and_signals
  question: 'En Ontario, un signal de « priorité au transport en commun » est identifié
    par :'
  choices:
    A: Un feu bleu clignotant
    B: Une barre verticale blanche fixe sur fond noir
    C: Un double feu vert
    D: Une flèche jaune clignotante
  answer: B
  explanation: Les signaux de priorité au transport en commun permettent aux autobus
    de contourner la circulation. Ils se présentent sous la forme d'une barre blanche
    verticale sur fond noir, située au-dessus des feux de circulation habituels.
- id: 214
  category: signs_and_signals
  question: 'Lorsque vous voyez un panneau de signalisation réglementaire avec un
    cercle rouge et une barre noire à l''intérieur (sans symbole), cela signifie :'
  choices:
    A: Entrée interdite
    B: Route fermée plus loin
    C: Cédez le passage à la circulation en sens inverse
    D: Stationnement interdit
  answer: A
  explanation: Le panneau « Entrée interdite » est un panneau carré blanc avec un
    cercle rouge contenant une barre horizontale blanche (ou parfois une barre noire
    dans certaines variantes), indiquant que vous ne pouvez pas entrer sur cette route.
- id: 215
  category: signs_and_signals
  question: À un passage pour piétons, que doit faire un conducteur lorsqu'un piéton
    attend pour traverser ou est en train de traverser ?
  choices:
    A: Ralentir et continuer si le piéton n'est pas dans votre voie
    B: S'arrêter et rester à l'arrêt jusqu'à ce que le piéton ait complètement traversé
      toute la chaussée
    C: Klaxonner pour informer le piéton que vous passez
    D: S'arrêter uniquement si le piéton est descendu du trottoir
  answer: B
  explanation: Selon la loi de l'Ontario, les conducteurs et les cyclistes doivent
    s'arrêter et céder le passage sur toute la largeur de la chaussée aux passages
    pour piétons et aux passages scolaires où se trouve un passeur scolaire.
- id: 216
  category: signs_and_signals
  question: 'Un cercle vert sur un panneau blanc avec un symbole noir à l''intérieur
    indique :'
  choices:
    A: L'action illustrée est interdite
    B: L'action illustrée est obligatoire
    C: L'action illustrée est autorisée
    D: Un avertissement de dangers à venir
  answer: C
  explanation: Dans le système de signalisation de l'Ontario, un cercle vert signifie
    que vous pouvez effectuer l'activité indiquée à l'intérieur du cercle.
- id: 217
  category: signs_and_signals
  question: Un panneau « véhicule lent », obligatoire sur les véhicules circulant
    à moins de 40 km/h, est de quelle forme et de quelle couleur ?
  choices:
    A: Un losange jaune
    B: Un panneau triangulaire avec un centre orange et une bordure rouge
    C: Un rectangle blanc avec des lettres noires
    D: Un carré bleu avec une bordure blanche
  answer: B
  explanation: Le panneau de véhicule lent est un triangle orange hautement réfléchissant
    avec une bordure rouge, utilisé sur les tracteurs agricoles et l'équipement lourd.
- id: 218
  category: signs_and_signals
  question: Lorsqu'un tramway est arrêté pour faire monter ou descendre des passagers
    là où il n'y a pas de zone de sécurité, que vous oblige la loi de l'Ontario à
    faire ?
  choices:
    A: Dépasser par la gauche avec prudence
    B: S'arrêter à 2 mètres derrière les portes arrière du tramway
    C: S'arrêter à 5 mètres derrière les portes arrière du tramway
    D: Ralentir à 10 km/h et dépasser prudemment
  answer: B
  explanation: Les conducteurs doivent rester à au moins 2 mètres derrière les portes
    arrière d'un tramway arrêté pour permettre aux passagers de monter ou de descendre
    en toute sécurité lorsqu'il n'y a pas de refuge pour piétons.
- id: 219
  category: signs_and_signals
  question: Que signifient les lignes jaunes discontinues sur une chaussée ?
  choices:
    A: Vous êtes sur une rue à sens unique
    B: Vous pouvez dépasser si la voie est libre
    C: Vous ne devez jamais dépasser
    D: La voie est réservée uniquement aux véhicules d'urgence
  answer: B
  explanation: Les lignes jaunes discontinues séparent les voies de circulation circulant
    dans des directions opposées ; vous pouvez dépasser lorsque vous pouvez le faire
    en toute sécurité.
