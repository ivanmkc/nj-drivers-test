questions:
- id: 1
  category: license_system
  question: ¿En Colorado, cuál es la edad mínima para solicitar un permiso de instrucción
    si está inscrito en un curso de educación vial aprobado por el estado?
  choices:
    A: 14 años y 6 meses
    B: 15 años
    C: 15 años y 6 meses
    D: 16 años
  answer: B
  explanation: Según el Manual del Conductor de Colorado, un menor puede solicitar
    un permiso de instrucción a los 15 años si está inscrito en un curso de educación
    vial de 30 horas aprobado por el estado.
- id: 2
  category: license_system
  question: Durante los primeros seis meses después de recibir una licencia de conducir
    para menores en Colorado, ¿quién tiene permitido ser pasajero en el vehículo?
  choices:
    A: Cualquier amigo del conductor
    B: Solo hermanos y nadie más
    C: Ningún pasajero menor de 21 años, a menos que un padre o tutor esté presente
    D: Hasta dos pasajeros menores de 21 años
  answer: C
  explanation: Las leyes de GDL (Licencia de Conducir Graduada) de Colorado establecen
    que durante los primeros seis meses de tener una licencia para menores, no se
    permiten pasajeros menores de 21 años a menos que un padre u otro adulto con licencia
    (21+) esté en el vehículo. Existen excepciones para emergencias médicas o hermanos.
- id: 3
  category: license_system
  question: Un conductor menor de edad en Colorado (menor de 18 años) está sujeto
    a una suspensión de la licencia si acumula ¿cuántos puntos en cualquier periodo
    de 12 meses consecutivos?
  choices:
    A: 3 puntos
    B: 6 puntos
    C: 9 puntos
    D: 12 puntos
  answer: B
  explanation: Para conductores menores de 18 años, el sistema de puntos de Colorado
    activa una suspensión al acumular 6 puntos en 12 meses o 7 puntos durante la vigencia
    de la licencia.
- id: 4
  category: license_system
  question: ¿Cuántas horas de experiencia de manejo, incluyendo horas nocturnas, debe
    registrar el titular de un permiso para menores antes de solicitar una licencia
    de conducir de Colorado?
  choices:
    A: 40 horas en total, 5 de noche
    B: 50 horas en total, 10 de noche
    C: 60 horas en total, 15 de noche
    D: 30 horas en total, 10 de noche
  answer: B
  explanation: La ley de Colorado exige que los titulares de permisos para menores
    completen 50 horas de conducción supervisada, con al menos 10 de esas horas realizadas
    durante la noche.
- id: 5
  category: license_system
  question: Bajo las leyes de GDL de Colorado, ¿cuáles son las restricciones de toque
    de queda para un conductor menor durante el primer año de tener una licencia?
  choices:
    A: No conducir entre las 10 PM y las 4 AM
    B: No conducir entre las 11 PM y las 5 AM
    C: No conducir entre las 12 AM y las 5 AM
    D: No conducir entre las 9 PM y las 6 AM
  answer: C
  explanation: Durante el primer año de tener una licencia para menores, los conductores
    menores de 18 años no tienen permitido conducir entre la medianoche y las 5 AM,
    a menos que estén acompañados por un padre/tutor o por razones específicas como
    trabajo o escuela.
- id: 6
  category: license_system
  question: Si se muda a una nueva residencia dentro de Colorado, debe notificar al
    Departamento de Ingresos (Department of Revenue) sobre su cambio de dirección
    en un plazo de ¿cuántos días?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La ley de Colorado exige que notifique al DMV sobre un cambio de dirección
    o de nombre en un plazo de 30 días.
- id: 7
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un permiso de instrucción de Colorado
    si NO ha completado un curso de educación vial de 30 horas pero SÍ ha completado
    un programa de concientización para conductores de 4 horas?
  choices:
    A: 15 años
    B: 15 años y 6 meses
    C: 16 años
    D: 17 años
  answer: B
  explanation: En Colorado, si no toma el curso completo de 30 horas, puede esperar
    hasta los 15 años y 6 meses para obtener un permiso, siempre que complete un programa
    de concientización para conductores de 4 horas.
- id: 8
  category: license_system
  question: A un conductor adulto (21 años o más) en Colorado se le suspenderá la
    licencia si acumula ¿cuántos puntos en un periodo de 12 meses?
  choices:
    A: 8 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: C
  explanation: Para conductores de 21 años o más, el umbral para la suspensión de
    la licencia es de 12 puntos en cualquier periodo de 12 meses consecutivos o 18
    puntos en cualquier periodo de 24 meses consecutivos.
- id: 9
  category: license_system
  question: Cuando un menor con un permiso de instrucción está conduciendo, el adulto
    supervisor debe tener al menos 21 años y haber tenido una licencia válida durante
    ¿cuánto tiempo como mínimo?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: La persona que supervisa al titular de un permiso debe tener al menos
    21 años de edad y haber tenido una licencia de conducir válida durante al menos
    un año.
- id: 10
  category: license_system
  question: ¿En Colorado, cuál es la concentración mínima de alcohol en sangre (BAC)
    para que un conductor menor de 21 años sea acusado de una infracción de consumo
    de alcohol y conducción por parte de un menor (UDD)?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Colorado tiene una política de 'tolerancia cero' para menores. Un BAC
    entre 0.02% y 0.05% para un conductor menor de 21 años resultará en un cargo de
    UDD (Underage Drinking and Driving).
- id: 11
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de instrucción de Colorado después
    de la fecha de emisión?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: En Colorado, los permisos de instrucción son válidos por un período
    de 3 años a partir de la fecha en que se emiten.
- id: 12
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que un menor de 18 años solicite
    una licencia de conducir de Colorado?
  choices:
    A: Deben haber tenido un permiso de instrucción durante al menos 12 meses
    B: Deben haber tenido un permiso de instrucción durante al menos 6 meses
    C: Deben tener al menos 17 años de edad
    D: No deben tener más de 2 puntos en su permiso
  answer: A
  explanation: La ley de Colorado exige que los menores de 18 años mantengan su permiso
    de instrucción durante 12 meses completos antes de ser elegibles para solicitar
    una licencia de conducir.
- id: 13
  category: license_system
  question: Para los conductores de 18 a 20 años, ¿cuántos puntos acumulados en un
    plazo de 12 meses resultarán en la suspensión de la licencia?
  choices:
    A: 7 puntos
    B: 9 puntos
    C: 12 puntos
    D: 14 puntos
  answer: B
  explanation: Para los conductores de 18 a 20 años, el límite de suspensión es de
    9 puntos en 12 meses, 12 puntos en 24 meses o 14 puntos entre los 18 y los 21
    años.
- id: 14
  category: license_system
  question: ¿Cuál es el monto mínimo obligatorio de seguro de responsabilidad civil
    por daños a la propiedad requerido para un conductor de Colorado?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: B
  explanation: La ley de Colorado exige una cobertura mínima de responsabilidad civil
    de $25,000 por persona por lesiones corporales, $50,000 por accidente por lesiones
    corporales y $15,000 por accidente por daños a la propiedad (25/50/15).
- id: 15
  category: license_system
  question: Si un conductor menor de edad (menor de 18 años) es sorprendido usando
    un teléfono móvil mientras conduce por una situación que no es de emergencia,
    ¿cuál es la penalización de puntos por una primera infracción?
  choices:
    A: 0 puntos
    B: 1 punto
    C: 3 puntos
    D: 6 puntos
  answer: B
  explanation: Según la ley de Colorado, es ilegal que los conductores menores de
    18 años usen un teléfono celular mientras conducen. Una primera infracción resulta
    en una penalización de 1 punto en su historial de manejo y una multa.
- id: 16
  category: license_system
  question: En Colorado, si tiene 16 años o más pero es menor de 21, ¿cuál es el requisito
    mínimo para solicitar un permiso de instrucción?
  choices:
    A: Completar un curso de educación vial de 30 horas
    B: Completar un programa de concientización para conductores de 4 horas
    C: Aprobar únicamente el examen escrito y la evaluación de la vista y física
    D: Completar 50 horas de conducción supervisada
  answer: C
  explanation: Según el Manual del Conductor de Colorado, las personas de 16 a 21
    años pueden solicitar un permiso de instrucción aprobando el examen escrito y
    la evaluación de la vista sin que se les exija tomar un curso formal de educación
    o concientización vial.
- id: 17
  category: license_system
  question: Si cambia su nombre debido a matrimonio o una orden judicial, ¿cuántos
    días tiene para notificar al Departamento de Ingresos de Colorado y obtener una
    licencia corregida?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: La ley de Colorado exige que notifique al Departamento de Ingresos
    dentro de los 30 días posteriores a un cambio de nombre o de dirección.
- id: 18
  category: license_system
  question: 'Para cumplir con los estándares mínimos de visión para una licencia de
    conducir de Colorado, su agudeza visual debe ser de al menos:'
  choices:
    A: 20/20 en ambos ojos
    B: 20/40 en su mejor ojo
    C: 20/50 en ambos ojos
    D: 20/30 en su mejor ojo
  answer: B
  explanation: Colorado requiere una agudeza visual mínima de 20/40 en el mejor ojo
    para que se le otorgue una licencia sin restricciones.
- id: 19
  category: license_system
  question: Una licencia de conducir estándar 'Clase R' de Colorado le permite operar
    ¿cuál de los siguientes vehículos?
  choices:
    A: Cualquier vehículo que pese más de 26,001 libras
    B: Una motocicleta sin ningún endoso adicional
    C: Un automóvil de pasajeros o un camión con una clasificación de peso bruto vehicular
      (GVWR) de menos de 26,001 libras
    D: Un autobús comercial diseñado para transportar 16 o más pasajeros
  answer: C
  explanation: Una licencia Clase R es la licencia de operador estándar para automóviles
    de pasajeros, camionetas y camiones pequeños con una Clasificación de Peso Bruto
    Vehicular (GVWR) de menos de 26,001 libras.
- id: 20
  category: license_system
  question: En Colorado, ¿cuál es la tarifa para restablecer su licencia después de
    una suspensión o revocación?
  choices:
    A: $25
    B: $60
    C: $95
    D: $150
  answer: C
  explanation: Según las regulaciones actuales de Colorado, la tarifa para el restablecimiento
    del privilegio de conducir después de una suspensión o revocación es de $95.
- id: 21
  category: license_system
  question: Según la ley de Colorado, ¿se considera a una persona como "Infractor
    Habitual" si acumula cuántas condenas de tráfico "graves" en un periodo de siete
    años?
  choices:
    A: Dos
    B: Tres
    C: Cinco
    D: Diez
  answer: B
  explanation: Un Infractor Habitual se define como alguien que tiene 3 o más condenas
    graves (como DUI, conducción temeraria o conducir bajo suspensión) en un periodo
    de 7 años.
- id: 22
  category: license_system
  question: Cuando un menor de edad tiene un permiso de instrucción de Colorado, ¿quién
    está obligado a usar el cinturón de seguridad en el vehículo?
  choices:
    A: Solo el conductor y el pasajero del asiento delantero
    B: Solo los pasajeros menores de 18 años
    C: Todos los ocupantes del vehículo, independientemente de su edad o posición
      en el asiento
    D: Solo el conductor
  answer: C
  explanation: Las leyes de Licencia de Conducir Gradual (GDL) de Colorado especifican
    que cuando el titular de un permiso está conduciendo, todos los ocupantes del
    vehículo deben usar el cinturón de seguridad.
- id: 23
  category: license_system
  question: Si un padre o tutor que firmó la "Declaración Jurada de Responsabilidad
    y Tutela" (Affidavit of Liability and Guardianship) para el permiso de un menor
    decide que ya no quiere ser responsable, ¿qué sucede?
  choices:
    A: El menor puede seguir conduciendo hasta que cumpla 18 años
    B: El menor debe encontrar un nuevo cosignatario en un plazo de 30 días
    C: La licencia o permiso del menor será cancelado
    D: El padre debe pagar una multa pero el permiso sigue siendo válido
  answer: C
  explanation: La persona que firmó la declaración jurada puede retirar su firma en
    cualquier momento, lo que resulta en la cancelación inmediata de la licencia o
    permiso del menor.
- id: 24
  category: license_system
  question: Para cumplir con los requisitos de "Real ID" de Colorado, ¿cuál de los
    siguientes NO es un documento requerido para un solicitante de licencia por primera
    vez?
  choices:
    A: Comprobante del número de Seguro Social
    B: Comprobante del nombre legal completo y fecha de nacimiento
    C: Dos documentos que demuestren la residencia en Colorado
    D: Comprobante de un diploma de escuela secundaria o GED
  answer: D
  explanation: Los requisitos de Real ID incluyen prueba de identidad, número de Seguro
    Social (SSN) y residencia, pero no requieren certificados educativos como un diploma
    de escuela secundaria.
- id: 25
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de instrucción para motocicletas
    en Colorado?
  choices:
    A: 6 meses
    B: 1 año
    C: 3 años
    D: Hasta que el conductor cumpla 21 años
  answer: C
  explanation: Un permiso de instrucción para motocicletas en Colorado es válido por
    3 años a partir de la fecha de emisión.
- id: 26
  category: license_system
  question: Para los residentes de Colorado de entre 21 y 64 años, ¿por cuánto tiempo
    suele ser válida una licencia de conducir estándar antes de que venza?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: D
  explanation: En Colorado, una licencia de conducir emitida a un adulto de entre
    21 y 64 años suele ser válida por 10 años.
- id: 27
  category: license_system
  question: Si usted es un nuevo residente de Colorado, ¿dentro de cuántos días después
    de convertirse en residente debe obtener una licencia de conducir de Colorado?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes deben obtener una licencia de conducir de Colorado
    dentro de los 30 días posteriores a la fecha en que establezcan su residencia
    en el estado.
- id: 28
  category: license_system
  question: ¿Cuál de las siguientes condenas resultará en una revocación automática
    de su privilegio de conducir en Colorado?
  choices:
    A: Una sola multa por exceso de velocidad de 10 mph sobre el límite
    B: Abandonar la escena de un accidente que involucre muerte o lesiones
    C: No usar una señal de giro
    D: Conducir con una luz trasera rota
  answer: B
  explanation: Abandonar la escena de un accidente que involucre muerte o lesiones
    personales es una infracción grave que resulta en la revocación obligatoria de
    la licencia de conducir en Colorado.
- id: 29
  category: license_system
  question: En Colorado, si es menor de 18 años y solicita su primera licencia, ¿durante
    cuánto tiempo debe haber tenido su permiso de instrucción como mínimo?
  choices:
    A: 6 meses
    B: 9 meses
    C: 12 meses
    D: 24 meses
  answer: C
  explanation: Los menores de 18 años deben tener su permiso de instrucción de Colorado
    durante 12 meses completos antes de ser elegibles para solicitar una licencia
    de conducir.
- id: 30
  category: license_system
  question: ¿Cuál es el valor de puntos asignado a su licencia de Colorado por la
    condena de "Exceso de velocidad de 10 a 19 mph sobre el límite"?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Bajo el sistema de puntos de Colorado, el exceso de velocidad de 10
    a 19 mph sobre el límite establecido resulta en la adición de 4 puntos al registro
    del conductor.
- id: 31
  category: driver_testing
  question: ¿Cuál es la puntuación mínima requerida para aprobar el examen escrito
    de conocimientos de Colorado?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: El examen escrito de conocimientos de Colorado consta de 25 preguntas,
    y los solicitantes deben responder correctamente al menos 20 (80%) para aprobar.
- id: 32
  category: driver_testing
  question: Si usa lentes correctivos (anteojos o lentes de contacto) para aprobar
    el examen de la vista de Colorado, ¿qué código de restricción se colocará en su
    licencia?
  choices:
    A: Restricción A
    B: Restricción B
    C: Restricción C
    D: Restricción S
  answer: A
  explanation: En Colorado, la Restricción 'A' indica que el conductor debe usar lentes
    correctivos mientras opera un vehículo motorizado.
- id: 33
  category: driver_testing
  question: Al presentarse para un examen de habilidades de conducción (práctico)
    en Colorado, ¿cuál de los siguientes debe proporcionar para el vehículo que se
    utilizará?
  choices:
    A: Una carta notariada del fabricante
    B: Registro (matrícula) válido y comprobante de seguro vigente
    C: Un registro de mantenimiento de los últimos 12 meses
    D: Una factura de venta
  answer: B
  explanation: Los solicitantes deben proporcionar un vehículo que esté en condiciones
    seguras de funcionamiento, junto con el registro válido y el comprobante de seguro
    para ese vehículo específico.
- id: 34
  category: driver_testing
  question: Bajo la Ley de Consentimiento Expreso (Express Consent Law) de Colorado,
    ¿cuál es la sanción por negarse por primera vez a realizar una prueba química
    de alcohol o drogas?
  choices:
    A: Una suspensión de la licencia por 90 días
    B: Una suspensión de la licencia por 6 meses
    C: Una revocación de la licencia por 1 año
    D: Una revocación de la licencia por 2 años
  answer: C
  explanation: Al conducir en Colorado, usted otorga su 'consentimiento expreso' para
    realizar pruebas químicas. Negarse a realizar la prueba resulta en la revocación
    automática de su privilegio de conducir por 1 año en caso de una primera infracción.
- id: 35
  category: driver_testing
  question: En Colorado, ¿cuántos puntos se asignan a su historial de conducción por
    exceder el límite de velocidad de 5 a 9 millas por hora?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: A
  explanation: De acuerdo con el sistema de puntos de Colorado, exceder el límite
    de velocidad entre 5 y 9 mph resulta en 1 punto en su historial de conducción.
- id: 36
  category: driver_testing
  question: ¿Cuál es el límite legal de Delta-9 THC (marihuana) en la sangre de un
    conductor en Colorado, por encima del cual se presume que conduce bajo los efectos
    de sustancias?
  choices:
    A: 2 nanogramos por mililitro
    B: 5 nanogramos por mililitro
    C: 10 nanogramos por mililitro
    D: Cualquier cantidad detectable
  answer: B
  explanation: La ley de Colorado especifica que los conductores con 5 nanogramos
    o más de Delta-9 THC por mililitro en su sangre completa pueden ser procesados
    por conducir bajo la influencia (DUI).
- id: 37
  category: driver_testing
  question: ¿Cuántos puntos se asignan a una licencia de conducir de Colorado por
    'Abandonar la escena de un accidente' (Hit and Run)?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: Abandonar la escena de un accidente es una infracción grave en Colorado
    y conlleva una sanción de 12 puntos, lo que resulta en una suspensión automática
    para conductores adultos dentro de un período de 12 meses.
- id: 38
  category: driver_testing
  question: En Colorado, ¿cuál es el monto mínimo requerido de seguro de responsabilidad
    civil por lesiones corporales o muerte de una persona en un solo accidente?
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: B
  explanation: La ley de Colorado requiere un mínimo de $25,000 por lesiones corporales
    o muerte de una persona en cualquier accidente.
- id: 39
  category: driver_testing
  question: Al solicitar una licencia de conducir de Colorado, ¿cuántos documentos
    se requieren para demostrar la residencia en Colorado para una licencia que cumpla
    con la ley REAL ID?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ninguno, si tiene pasaporte
  answer: B
  explanation: Para obtener una licencia de Colorado que cumpla con la ley REAL ID,
    debe proporcionar dos documentos que demuestren su dirección física en Colorado.
- id: 40
  category: driver_testing
  question: En Colorado, ¿cuántos puntos se asignan por 'Conducir por el lado equivocado
    de la carretera'?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Conducir por el lado equivocado de la carretera es una infracción de
    4 puntos en el estado de Colorado.
- id: 41
  category: driver_testing
  question: 'De acuerdo con la ley de Colorado, debe seguir a un vehículo de emergencia
    que tenga las luces y sirenas encendidas a una distancia no menor de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Es ilegal en Colorado seguir a un camión de bomberos u otro vehículo
    de emergencia a una distancia menor de 500 pies cuando este esté respondiendo
    a una alarma.
- id: 42
  category: driver_testing
  question: 'En Colorado, si usted se ve involucrado en un accidente que no es investigado
    por las autoridades, debe presentar un informe de accidente si hay alguna lesión
    o si los daños a la propiedad exceden los:'
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: Cualquier cantidad
  answer: B
  explanation: Si un oficial de policía no investiga el accidente, usted debe presentar
    un informe ante el DMV si hay lesiones, muertes o daños a la propiedad que parezcan
    exceder los $1,000.
- id: 43
  category: driver_testing
  question: ¿En Colorado, cuántos puntos se asignan por 'No ceder el paso' (Failure
    to yield right-of-way)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: No ceder el derecho de paso es una infracción de 3 puntos en el historial
    de conducción de Colorado.
- id: 44
  category: driver_testing
  question: Para realizar el examen de habilidades de conducción (examen práctico)
    de Colorado, ¿cuál de los siguientes requisitos debe cumplir su vehículo?
  choices:
    A: Debe estar equipado con una transmisión manual
    B: Debe tener menos de 10 años de antigüedad
    C: Debe tener un registro vigente y comprobante de seguro
    D: Debe tener un pedal de freno en el lado del pasajero para el examinador
  answer: C
  explanation: Según el Manual del Conductor de Colorado, el vehículo utilizado para
    el examen de conducción debe estar debidamente registrado, tener un seguro vigente
    y estar en condiciones mecánicas seguras.
- id: 45
  category: driver_testing
  question: Al solicitar un permiso o licencia de Colorado, ¿cuál de los siguientes
    NO es un documento aceptable para demostrar su número de Seguro Social?
  choices:
    A: Una tarjeta de Seguro Social original
    B: Un formulario W-2
    C: Un talón de pago que contenga su nombre completo y su SSN completo
    D: Una nota escrita a mano de un empleador actual
  answer: D
  explanation: Colorado requiere documentos oficiales para la prueba del SSN, como
    la tarjeta real, un W-2 o un talón de pago impreso. No se aceptan notas escritas
    a mano.
- id: 46
  category: driver_testing
  question: Para aprobar el examen de la vista para una licencia de conducir de Colorado,
    ¿cuál es el campo de visión total mínimo requerido?
  choices:
    A: 90 grados
    B: 100 grados
    C: 110 grados
    D: 140 grados
  answer: C
  explanation: Los estándares de visión de Colorado requieren un campo de visión total
    de al menos 110 grados para una licencia estándar.
- id: 47
  category: driver_testing
  question: Al solicitar una licencia de conducir o tarjeta de identificación de Colorado,
    ¿se le da la oportunidad de hacer cuál de las siguientes opciones?
  choices:
    A: Registrarse para votar
    B: Inscribirse en el registro de donantes de órganos y tejidos
    C: Hacer una contribución voluntaria al fondo 911 de Colorado
    D: Todas las anteriores
  answer: D
  explanation: El proceso de solicitud del DMV de Colorado permite a los solicitantes
    registrarse para votar, unirse al registro de donantes y contribuir a varios fondos
    estatales.
- id: 48
  category: driver_testing
  question: Durante el examen de habilidades de conducción de Colorado, ¿cuál de las
    siguientes acciones resultará en una reprobación inmediata?
  choices:
    A: No usar una señal de giro una vez
    B: Conducir a 2 mph por debajo del límite de velocidad
    C: Cualquier infracción de tráfico o acción de conducción peligrosa
    D: Ajustar los espejos laterales mientras el vehículo está detenido
  answer: C
  explanation: Se produce una reprobación inmediata si el solicitante comete una infracción
    de tráfico, realiza una acción peligrosa o se ve involucrado en un accidente durante
    el examen práctico.
- id: 49
  category: driver_testing
  question: Para un residente de Colorado de entre 21 y 64 años, ¿por cuántos años
    es válida normalmente una licencia de conducir estándar?
  choices:
    A: 3 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: B
  explanation: En Colorado, una licencia de conducir estándar para adultos de entre
    21 y 64 años es válida por 5 años.
- id: 50
  category: driver_testing
  question: ¿En Colorado, cuál es la edad mínima para solicitar una Licencia de Conducir
    Comercial (CDL) para operación intraestatal (solo dentro de Colorado)?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: Aunque debe tener 21 años para la conducción comercial interestatal
    (entre estados), Colorado permite a los residentes solicitar una CDL intraestatal
    a los 18 años.
- id: 51
  category: driver_testing
  question: La ley de Colorado exige que los conductores tengan una cobertura mínima
    de seguro de ¿cuánto por lesiones corporales o muerte de una persona en cualquier
    accidente?
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: B
  explanation: Los requisitos mínimos de seguro obligatorio de Colorado son $25,000
    por lesiones corporales a una persona, $50,000 por lesiones corporales a todas
    las personas y $15,000 por daños a la propiedad (25/50/15).
- id: 52
  category: driver_testing
  question: En Colorado, ¿qué clase de licencia y endoso se requiere específicamente
    para operar una motocicleta?
  choices:
    A: Clase A
    B: Clase B
    C: Clase R con un endoso 'M'
    D: Clase C
  answer: C
  explanation: Para operar una motocicleta en Colorado, debe tener una licencia de
    conducir válida (Clase R) con un endoso de motocicleta (M).
- id: 53
  category: driver_testing
  question: 'La ley de "Consentimiento Expreso" (Express Consent) de Colorado significa
    que, al operar un vehículo motorizado, usted ha dado su consentimiento para:'
  choices:
    A: Un registro del maletero de su vehículo en cualquier momento
    B: Una prueba química de su sangre, aliento u orina para determinar el contenido
      de alcohol o drogas
    C: Una revisión de sus registros telefónicos privados por parte de las autoridades
    D: Pagar todas las multas de tráfico inmediatamente después de ser detenido
  answer: B
  explanation: La ley de Consentimiento Expreso establece que cualquier persona que
    conduzca un vehículo motorizado en Colorado ha aceptado someterse a una prueba
    química si un oficial tiene causa probable para creer que está conduciendo bajo
    la influencia.
- id: 54
  category: driver_testing
  question: Para obtener un permiso de instrucción de Colorado, ¿cuál de las siguientes
    pruebas debe aprobar el solicitante?
  choices:
    A: Solo las pruebas de la vista y escrita
    B: Solo las pruebas escrita y de manejo
    C: Pruebas de la vista, escrita y física
    D: Solo las pruebas de la vista y de manejo
  answer: A
  explanation: Para obtener un permiso, debe aprobar el examen de la vista y el examen
    escrito de conocimientos. El examen de manejo (habilidades) se requiere más adelante
    para obtener la licencia completa.
- id: 55
  category: driver_testing
  question: Si su licencia de conducir de Colorado vence, ¿de cuánto tiempo es el
    período de gracia permitido para seguir conduciendo antes de que deba renovarla?
  choices:
    A: 10 días
    B: 30 días
    C: 90 días
    D: No hay período de gracia
  answer: D
  explanation: Es ilegal conducir con una licencia vencida en Colorado. No hay período
    de gracia; debe renovarla en la fecha de vencimiento o antes.
- id: 56
  category: driver_responsibility
  question: 'En Colorado, si usted está involucrado en un accidente que cause alguna
    lesión o muerte, la ley le exige:'
  choices:
    A: Esperar 24 horas antes de notificar a la policía
    B: Notificar inmediatamente a la agencia de cumplimiento de la ley más cercana
    C: Informar solo si los daños superan los $1,000
    D: Presentar un informe solo si usted tiene la culpa
  answer: B
  explanation: La ley de Colorado exige que cualquier accidente que involucre lesiones
    corporales o muerte debe ser reportado inmediatamente a la agencia de cumplimiento
    de la ley más cercana.
- id: 57
  category: driver_responsibility
  question: Al convertirse en residente de Colorado, ¿cuántos días tiene para registrar
    su vehículo en el estado?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Según la ley de Colorado, un vehículo debe registrarse dentro de los
    90 días posteriores a que el propietario se convierta en residente del estado.
- id: 58
  category: driver_responsibility
  question: 'Bajo la ley de "Consentimiento Expreso" (Express Consent) de Colorado,
    al conducir un vehículo motorizado, usted ha aceptado:'
  choices:
    A: Mantener su vehículo en buenas condiciones mecánicas
    B: Llevar un pasajero en todo momento
    C: Una prueba química de su sangre, aliento u orina si se sospecha de un DUI
    D: Permitir que la policía registre su vehículo en cualquier momento
  answer: C
  explanation: La Ley de Consentimiento Expreso significa que al operar un vehículo
    en Colorado, usted ya ha dado su consentimiento para realizar pruebas químicas
    si un oficial tiene causa probable para creer que está conduciendo bajo la influencia
    (DUI).
- id: 59
  category: driver_responsibility
  question: ¿Cuántos puntos se asignan a su historial de manejo de Colorado por una
    condena por no proporcionar un comprobante de seguro válido?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: B
  explanation: No proporcionar evidencia válida de seguro en Colorado resulta en la
    adición de 4 puntos a su historial de manejo.
- id: 60
  category: driver_responsibility
  question: 'En Colorado, se considera que un conductor está "Conduciendo con la Capacidad
    Disminuida" (DWAI) si su contenido de alcohol en sangre (BAC) es de al menos:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: En Colorado, un BAC de 0.05% pero inferior a 0.08% es suficiente para
    ser acusado de Conducir con la Capacidad Disminuida (DWAI).
- id: 61
  category: driver_responsibility
  question: ¿Según la ley de Colorado, un conductor puede ser acusado de un DUI si
    su sangre contiene cuántos nanogramos de THC activo por mililitro?
  choices:
    A: 1 nanogramo
    B: 2 nanogramos
    C: 5 nanogramos
    D: 10 nanogramos
  answer: C
  explanation: La ley de Colorado especifica que un jurado puede inferir que un conductor
    estaba bajo la influencia si su sangre contiene 5 nanogramos o más de Delta-9
    THC por mililitro.
- id: 62
  category: driver_responsibility
  question: Para la mayoría de los vehículos de pasajeros en Colorado, ¿dónde deben
    exhibirse las placas de matrícula?
  choices:
    A: Solo en la parte trasera del vehículo
    B: Solo en la parte delantera del vehículo
    C: Tanto en la parte delantera como en la trasera del vehículo
    D: Dentro de la ventana trasera
  answer: C
  explanation: 'La ley de Colorado exige que la mayoría de los vehículos motorizados
    exhiban dos placas de matrícula: una en la parte delantera y otra en la parte
    trasera.'
- id: 63
  category: driver_responsibility
  question: ¿Cuál es la multa mínima obligatoria por una primera condena por conducir
    sin un seguro válido en Colorado?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Una primera infracción por conducir sin seguro en Colorado conlleva
    una multa mínima obligatoria de $500.
- id: 64
  category: driver_responsibility
  question: 'Si choca contra un vehículo desatendido y no puede encontrar al propietario,
    la ley de Colorado le exige:'
  choices:
    A: Esperar 30 minutos y luego irse
    B: Dejar un aviso en un lugar visible del vehículo con su información
    C: Irse si no hay daños visibles
    D: Solo reportarlo si el otro vehículo vale más de $2,000
  answer: B
  explanation: Si choca contra un vehículo estacionado, debe intentar localizar al
    propietario. Si no puede encontrarlo, debe dejar una nota por escrito con su nombre,
    dirección y número de registro del vehículo.
- id: 65
  category: driver_responsibility
  question: 'Si se ve involucrado en un accidente menor en una autopista y no hay
    heridos, usted debe:'
  choices:
    A: Dejar los vehículos exactamente donde están hasta que llegue la policía
    B: Mover los vehículos fuera de los carriles de circulación hacia el acotamiento
      (shoulder) si es seguro hacerlo
    C: Caminar inmediatamente a la salida más cercana para pedir ayuda
    D: Permanecer en el vehículo con el cinturón de seguridad puesto en medio del
      carril
  answer: B
  explanation: Para evitar más accidentes y congestión de tráfico, la ley de Colorado
    exige que los conductores muevan los vehículos involucrados en accidentes menores
    que solo causaron daños a la propiedad fuera del flujo de tráfico si se pueden
    mover de manera segura.
- id: 66
  category: driver_responsibility
  question: Si su licencia es revocada por un DUI o una violación de Consentimiento
    Expreso (Express Consent), ¿por cuánto tiempo se le requiere generalmente mantener
    un certificado SR-22 (responsabilidad financiera)?
  choices:
    A: 6 meses
    B: 1 año
    C: 3 años
    D: 10 años
  answer: C
  explanation: Tras la revocación de la licencia por infracciones relacionadas con
    el alcohol, Colorado generalmente requiere que el conductor mantenga el seguro
    SR-22 durante 3 años.
- id: 67
  category: driver_responsibility
  question: En Colorado, ¿cuáles son los requisitos mínimos de seguro de responsabilidad
    civil por lesiones corporales por persona?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de Colorado exige un mínimo de $25,000 por lesiones corporales
    a una persona en cualquier accidente.
- id: 68
  category: driver_responsibility
  question: ¿Cuántos días tiene un nuevo residente de Colorado para registrar su vehículo
    después de convertirse en residente?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Según la ley de Colorado, debe registrar su vehículo dentro de los
    90 días posteriores a convertirse en residente.
- id: 69
  category: driver_responsibility
  question: Si un conductor de Colorado es condenado por una primera infracción por
    conducir sin un seguro válido, ¿cuántos puntos se asignan a su licencia?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: B
  explanation: Conducir sin seguro de vehículo motorizado en Colorado resulta en la
    adición de 4 puntos a su historial de manejo por la primera infracción.
- id: 70
  category: driver_responsibility
  question: 'Si se ve involucrado en un accidente en Colorado donde ocurre una lesión
    o muerte, y no hay ningún oficial de policía presente, usted debe:'
  choices:
    A: Esperar 24 horas antes de reportar el accidente
    B: Reportar el accidente a la agencia de la ley más cercana de inmediato
    C: Solo reportar el accidente si los daños a la propiedad superan los $2,500
    D: Intercambiar información e irse; reportar es opcional
  answer: B
  explanation: La ley de Colorado exige el reporte inmediato de cualquier accidente
    que involucre lesiones, muerte o daños a la propiedad a la agencia de la ley más
    cercana si un oficial no está en la escena.
- id: 71
  category: driver_responsibility
  question: ¿En Colorado, cuál es el requisito mínimo de seguro de responsabilidad
    civil por lesiones corporales cuando dos o más personas resultan heridas en un
    solo accidente?
  choices:
    A: $25,000
    B: $50,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: La ley de Colorado exige $50,000 por lesiones corporales a dos o más
    personas en cualquier accidente.
- id: 72
  category: driver_responsibility
  question: Si un conductor de Colorado es condenado por "Abandonar la escena de un
    accidente" (Hit and Run) que involucre solo daños a la propiedad, ¿cuántos puntos
    se agregan a su historial?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: D
  explanation: Abandonar la escena de un accidente que involucre daños a otro vehículo
    o propiedad resulta en 12 puntos, lo que generalmente conlleva a la suspensión
    de la licencia.
- id: 73
  category: driver_responsibility
  question: Bajo la ley "Move Over" (Hacerse a un lado) de Colorado, ¿qué debe hacer
    un conductor al acercarse a un vehículo de emergencia estacionado con luces intermitentes?
  choices:
    A: Detenerse por completo hasta que el vehículo se retire
    B: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    C: Cambiarse a otro carril si es seguro, o reducir la velocidad significativamente
      si no es posible cambiarse de carril
    D: Acelerar para pasar el vehículo lo más rápido posible
  answer: C
  explanation: La ley de Colorado exige que los conductores se cambien al menos a
    un carril de distancia o, si eso no es posible, reduzcan y mantengan una velocidad
    segura al pasar vehículos de emergencia o de mantenimiento estacionados.
- id: 74
  category: driver_responsibility
  question: ¿En Colorado, quién está obligado a usar el cinturón de seguridad o estar
    en un sistema de retención infantil en el asiento delantero de un vehículo?
  choices:
    A: Solo el conductor
    B: Solo los pasajeros menores de 18 años
    C: El conductor y cada pasajero del asiento delantero
    D: Solo el conductor y los pasajeros menores de 16 años
  answer: C
  explanation: La ley de Colorado exige que el conductor y cada pasajero del asiento
    delantero usen el cinturón de seguridad o estén en un sistema de retención infantil.
- id: 75
  category: driver_responsibility
  question: ¿En Colorado, hasta qué edad debe estar asegurado un niño en un sistema
    de retención infantil (como un asiento elevado o "booster seat")?
  choices:
    A: 5 años
    B: 6 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: La ley de Colorado exige que los niños estén en un sistema de retención
    infantil (asiento de seguridad o booster) hasta que cumplan 8 años.
- id: 76
  category: driver_responsibility
  question: 'Si se le condena por tirar basura desde un vehículo motorizado en Colorado,
    la multa es:'
  choices:
    A: $20
    B: $50
    C: Hasta $500
    D: Exactamente $1,000
  answer: C
  explanation: Tirar basura en Colorado es un delito, y las condenas pueden resultar
    en multas de hasta $500 y potencialmente servicio comunitario.
- id: 77
  category: driver_responsibility
  question: Cuando un oficial de la ley de Colorado solicita una prueba de seguro,
    ¿cuál de las siguientes NO es una forma aceptable de prueba?
  choices:
    A: Una tarjeta de seguro en papel emitida por la aseguradora
    B: Una imagen electrónica de la tarjeta de seguro en un teléfono inteligente
    C: Una declaración verbal del número de póliza y la compañía
    D: Una impresión de la página de declaraciones de la póliza de seguro
  answer: C
  explanation: Los conductores deben proporcionar evidencia física o electrónica del
    seguro. Una declaración verbal no es prueba suficiente de responsabilidad financiera.
- id: 78
  category: driver_responsibility
  question: Si un oficial de policía no investiga un accidente, y el accidente resultó
    en lesiones o daños a la propiedad, ¿cuántos días tiene para presentar un informe
    ante el Departamento de Ingresos (Department of Revenue)?
  choices:
    A: 24 horas
    B: 10 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Si un accidente no es investigado por las autoridades y hay daños o
    lesiones, debe presentar un informe dentro de los 10 días.
- id: 79
  category: safe_driving_rules
  question: ¿En Colorado, cuál es el límite de velocidad predeterminado en un distrito
    residencial si no hay otra señalización?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: Según el Manual del Conductor de Colorado, el límite de velocidad en
    cualquier distrito residencial es de 30 mph, a menos que se indique lo contrario.
- id: 80
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en carreteras de montaña estrechas y sinuosas
    o en curvas ciegas en Colorado?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: El Manual del Conductor de Colorado establece que el límite de velocidad
    es de 20 mph en carreteras de montaña estrechas y sinuosas y en curvas ciegas.
- id: 81
  category: safe_driving_rules
  question: En Colorado, ¿a cuántos pies de un hidrante de incendios está prohibido
    estacionarse?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: La ley de Colorado prohíbe estacionarse a menos de 15 pies de un hidrante
    de incendios.
- id: 82
  category: safe_driving_rules
  question: Al estacionarse en paralelo en Colorado, ¿a qué distancia deben estar
    las ruedas del bordillo (curb)?
  choices:
    A: A menos de 6 pulgadas
    B: A menos de 12 pulgadas
    C: A menos de 18 pulgadas
    D: A menos de 24 pulgadas
  answer: B
  explanation: En Colorado, al estacionarse en una calle de doble sentido, debe estacionar
    con las ruedas del lado derecho paralelas y a no más de 12 pulgadas del bordillo
    derecho.
- id: 83
  category: safe_driving_rules
  question: En Colorado, al conducir en una carretera con un límite de velocidad de
    40 mph o más, ¿con cuánta anticipación debe señalizar antes de girar o cambiar
    de carril?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: En Colorado, debe señalizar al menos 200 pies antes de un giro o cambio
    de carril en carreteras donde el límite de velocidad es de 40 mph o superior.
    En áreas urbanas (menos de 40 mph), el requisito es de 100 pies.
- id: 84
  category: safe_driving_rules
  question: Al adelantar a un ciclista en Colorado, ¿cuál es la distancia legal mínima
    que debe mantener entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Colorado exige que los automovilistas dejen al menos tres
    pies de espacio al rebasar o adelantar a los ciclistas.
- id: 85
  category: safe_driving_rules
  question: ¿Cuál es la sanción por exceso de velocidad en una zona de mantenimiento,
    reparación o construcción en Colorado cuando hay trabajadores presentes?
  choices:
    A: Una multa fija de $500
    B: Suspensión obligatoria de la licencia por 30 días
    C: Las multas se duplican
    D: Incautación del vehículo
  answer: C
  explanation: La ley de Colorado establece que las multas por infracciones de exceso
    de velocidad se duplican en las zonas de mantenimiento, reparación o construcción
    cuando hay señales colocadas y trabajadores presentes.
- id: 86
  category: safe_driving_rules
  question: Al estacionar un vehículo cuesta abajo en una calle con bordillo (curb),
    ¿hacia dónde debe girar las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Paralelas al bordillo
    D: No importa
  answer: A
  explanation: Al estacionar cuesta abajo con bordillo, debe girar las ruedas hacia
    el bordillo para que, si el vehículo rueda, choque contra el bordillo y se detenga.
- id: 87
  category: safe_driving_rules
  question: En Colorado, ¿es legal girar a la izquierda con el semáforo en rojo?
  choices:
    A: No, nunca es legal
    B: Sí, pero solo desde una calle de un solo sentido hacia otra calle de un solo
      sentido
    C: Sí, desde cualquier calle siempre que no haya tráfico cruzado
    D: Sí, pero solo entre las 12:00 AM y las 5:00 AM
  answer: B
  explanation: En Colorado, se permite girar a la izquierda en rojo solo cuando se
    gira desde una calle de un solo sentido hacia otra calle de un solo sentido, después
    de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 88
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada detrás de otro vehículo
    bajo condiciones de conducción ideales en Colorado?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de Colorado recomienda una distancia de seguimiento
    mínima de 3 segundos en condiciones ideales para permitir suficiente tiempo para
    reaccionar ante peligros.
- id: 89
  category: safe_driving_rules
  question: En Colorado, cuando dos vehículos llegan al mismo tiempo a una intersección
    sin señales ni semáforos, ¿qué conductor tiene la preferencia de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que viaja a mayor velocidad
    D: El conductor que circula por la vía más grande
  answer: B
  explanation: En una intersección sin señales ni semáforos, el conductor de la izquierda
    debe ceder el paso al conductor de la derecha.
- id: 90
  category: safe_driving_rules
  question: En Colorado, ¿a cuántos pies de un vehículo que viene en sentido contrario
    debe bajar las luces altas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Colorado exige que los conductores bajen las luces altas
    (cambien a luces bajas) cuando estén a menos de 500 pies de un vehículo que viene
    en sentido contrario o a menos de 200 pies cuando siguen a otro vehículo.
- id: 91
  category: safe_driving_rules
  question: ¿Cuándo dos vehículos se encuentran en un camino de montaña empinado donde
    ninguno puede pasar, qué vehículo tiene el derecho de paso?
  choices:
    A: El vehículo que baja (cuesta abajo)
    B: El vehículo más pesado
    C: El vehículo que sube (cuesta arriba)
    D: El vehículo que viaja más rápido
  answer: C
  explanation: En Colorado, cuando dos vehículos se encuentran en una pendiente pronunciada
    donde el camino no es lo suficientemente ancho para pasar, el vehículo que sube
    tiene el derecho de paso. El vehículo que baja debe retroceder hasta que el vehículo
    que sube pueda pasar.
- id: 92
  category: safe_driving_rules
  question: En Colorado, ¿cuál es el límite de velocidad no señalizado en un distrito
    comercial designado?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: El límite de velocidad predeterminado en los distritos comerciales
    de Colorado es de 25 mph, a menos que las señales indiquen lo contrario.
- id: 93
  category: safe_driving_rules
  question: Bajo la ley de Colorado, ¿a cuántos pies de un hidrante de incendios está
    prohibido estacionar?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: Es ilegal estacionar a menos de 15 pies de un hidrante de incendios
    en Colorado.
- id: 94
  category: safe_driving_rules
  question: Al conducir en áreas urbanas, ¿con cuántos pies de antelación debe señalizar
    su intención de girar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: En áreas urbanas o metropolitanas, debe señalizar continuamente durante
    al menos 100 pies antes de realizar un giro. En autopistas o a velocidades superiores
    a 40 mph, debe señalizar durante al menos 200 pies.
- id: 95
  category: safe_driving_rules
  question: En Colorado, ¿qué significa una señal de flecha amarilla intermitente?
  choices:
    A: Detenerse y esperar una flecha verde
    B: La señal está a punto de cambiar a rojo; despeje la intersección
    C: Se permite girar después de ceder el paso al tráfico en sentido contrario y
      a los peatones
    D: El tráfico en sentido contrario tiene una luz roja
  answer: C
  explanation: Una flecha amarilla intermitente significa que se permite girar a la
    izquierda, pero primero debe ceder el paso al tráfico en sentido contrario y a
    los peatones, y luego proceder con precaución.
- id: 96
  category: safe_driving_rules
  question: 'En Colorado, es ilegal hacer un giro en U si no puede ver en ambas direcciones
    por al menos:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 700 pies
    D: 1,000 pies
  answer: C
  explanation: Los giros en U están prohibidos en una curva o cerca de la cima de
    una colina donde el vehículo no pueda ser visto por el conductor de cualquier
    otro vehículo que se aproxime desde cualquier dirección dentro de los 700 pies.
- id: 97
  category: defensive_driving
  question: Según el Manual del Conductor de Colorado, ¿cuál es la distancia de seguimiento
    recomendada detrás del vehículo que está delante de usted bajo condiciones normales
    de conducción?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de Colorado recomienda una distancia de seguimiento
    mínima de 3 segundos bajo condiciones normales de conducción para permitir suficiente
    tiempo para reaccionar ante peligros.
- id: 98
  category: defensive_driving
  question: Para evitar el frenado de último minuto o la necesidad de girar repentinamente
    en Colorado, ¿qué tan adelante debe mirar o explorar el camino?
  choices:
    A: 5 segundos
    B: 10-12 segundos
    C: 20-30 segundos
    D: Solo el auto que está directamente frente a usted
  answer: B
  explanation: Explorar el camino con 10 a 12 segundos de antelación le permite ver
    peligros potenciales a tiempo y ajustar su velocidad o posición de manera segura.
- id: 99
  category: defensive_driving
  question: En Colorado, ¿a qué velocidad puede comenzar el hidroplaneo (hydroplaning)
    cuando sus neumáticos comienzan a perder contacto con el camino durante una lluvia
    fuerte?
  choices:
    A: 25 mph
    B: 35 mph
    C: 50 mph
    D: 65 mph
  answer: B
  explanation: El hidroplaneo (hydroplaning) puede comenzar a velocidades tan bajas
    como 35 mph, y a 55 mph, los neumáticos pueden perder todo contacto con la superficie
    de la carretera.
- id: 100
  category: defensive_driving
  question: 'En Colorado, debe bajar sus luces altas (dim high beams) cuando sigue
    a otro vehículo a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 600 pies
  answer: B
  explanation: La ley de Colorado exige que los conductores cambien a luces bajas
    cuando siguen a otro vehículo a menos de 200 pies para evitar cegar al conductor
    que va delante.
- id: 101
  category: defensive_driving
  question: Bajo la Ley de Tracción de Vehículos de Pasajeros de Colorado (Código
    15), ¿cuál es la profundidad mínima requerida de la banda de rodadura para todos
    los neumáticos de un vehículo?
  choices:
    A: 1/16 de pulgada
    B: 2/32 de pulgada
    C: 3/16 de pulgada
    D: 4/32 de pulgada
  answer: C
  explanation: Cuando la Ley de Tracción está en vigor, todos los neumáticos deben
    tener una profundidad de banda de rodadura de al menos 3/16 de pulgada.
- id: 102
  category: defensive_driving
  question: Cuando la Ley de Cadenas para Vehículos de Pasajeros de Colorado (Código
    16) está en vigor, ¿qué se requiere para todos los vehículos de pasajeros?
  choices:
    A: Solo se requieren neumáticos para nieve
    B: Solo se permiten vehículos 4WD/AWD
    C: Todos los vehículos deben tener cadenas o un dispositivo de tracción alternativo
      aprobado
    D: Los vehículos deben conducir con las luces de emergencia encendidas
  answer: C
  explanation: El Código 16 es la medida de seguridad final antes de que se cierre
    una carretera; requiere que cada vehículo de pasajeros tenga cadenas o un dispositivo
    de tracción alternativo como AutoSock.
- id: 103
  category: defensive_driving
  question: Al conducir con niebla densa en Colorado, ¿qué luces debe utilizar para
    garantizar la mejor visibilidad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque las luces altas se
    reflejan en la humedad del aire, lo que provoca deslumbramiento y reduce la visibilidad.
- id: 104
  category: defensive_driving
  question: 'Para revisar correctamente su "punto ciego" antes de cambiar de carril
    en Colorado, usted debe:'
  choices:
    A: Revisar su espejo retrovisor
    B: Revisar sus espejos laterales
    C: Girar la cabeza y mirar por encima del hombro en la dirección del giro
    D: Confiar en el sistema de monitoreo de punto ciego de su vehículo
  answer: C
  explanation: Los espejos no lo muestran todo; debe girar la cabeza para revisar
    las áreas que sus espejos no pueden ver antes de cambiar de carril.
- id: 105
  category: defensive_driving
  question: Al entrar en una rotonda en Colorado, ¿quién tiene el derecho de paso?
  choices:
    A: El tráfico que entra a la rotonda
    B: El tráfico que ya está en la rotonda
    C: El vehículo a la derecha
    D: El vehículo que viaja a la velocidad más alta
  answer: B
  explanation: Los conductores que entran en una rotonda deben ceder el paso al tráfico
    que ya circula dentro de la misma.
- id: 106
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera helada de Colorado,
    ¿cuál es la respuesta correcta de conducción defensiva?
  choices:
    A: Pisar los frenos a fondo inmediatamente
    B: Girar el volante en la dirección opuesta al derrape
    C: Soltar el acelerador y girar el volante en la dirección a la que desea que
      vaya la parte delantera del vehículo
    D: Poner el auto en punto muerto (neutral) y cerrar los ojos
  answer: C
  explanation: Para recuperarse de un derrape, quite el pie del acelerador y gire
    el volante en la dirección a la que desea ir. Evite pisar los frenos a fondo,
    ya que esto puede bloquear las ruedas.
- id: 107
  category: defensive_driving
  question: Al estar detenido en una intersección en Colorado, ¿cuál es la secuencia
    de observación recomendada antes de avanzar cuando la luz se pone en verde?
  choices:
    A: Mirar solo hacia adelante
    B: Mirar a la izquierda y luego a la derecha
    C: Mirar a la izquierda, luego a la derecha y luego a la izquierda otra vez
    D: Mirar a la derecha y luego a la izquierda
  answer: C
  explanation: Observar a la izquierda, a la derecha y a la izquierda otra vez ayuda
    a asegurar que ningún vehículo se esté pasando el semáforo en rojo desde ninguno
    de los lados antes de entrar en la intersección.
- id: 108
  category: defensive_driving
  question: Al seguir a otro vehículo por la noche en Colorado, ¿a qué distancia debe
    cambiar sus luces altas a luces bajas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 600 pies
  answer: B
  explanation: La ley de Colorado exige que los conductores bajen sus luces altas
    cuando sigan a otro vehículo a una distancia de 200 pies.
- id: 109
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar a ocurrir el hidroplaneo (los neumáticos
    pierden contacto con la carretera debido al agua) en Colorado?
  choices:
    A: Tan solo a 35 mph
    B: Solo por encima de 55 mph
    C: Solo por encima de 65 mph
    D: A cualquier velocidad superior a 20 mph
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    En una tormenta de lluvia intensa, los neumáticos pueden perder todo contacto
    con la carretera a 55 mph.
- id: 110
  category: defensive_driving
  question: Para evitar la necesidad de frenar o girar de último momento en el tráfico
    de Colorado, ¿con cuánta anticipación debería estar mirando (observando) hacia
    adelante?
  choices:
    A: 5 segundos
    B: 10-15 segundos
    C: 20-30 segundos
    D: Exactamente una milla
  answer: B
  explanation: El Manual del Conductor de Colorado recomienda mirar con 10 a 15 segundos
    de anticipación, lo que equivale aproximadamente a una cuadra de la ciudad o un
    cuarto de milla en la carretera.
- id: 111
  category: defensive_driving
  question: ¿En Colorado, cuántos puntos se evalúan contra su licencia de conducir
    por la infracción de 'Seguir demasiado de cerca' (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Seguir demasiado de cerca se considera un error grave de conducción
    defensiva en Colorado y resulta en 4 puntos en su historial de manejo.
- id: 112
  category: defensive_driving
  question: Al conducir por una pendiente montañosa empinada en Colorado, ¿cuál es
    la forma más segura de controlar su velocidad y evitar el 'desvanecimiento de
    los frenos' (brake fade)?
  choices:
    A: Mantener el pie en el pedal del freno constantemente
    B: Cambiar a una marcha más baja
    C: Apagar el motor
    D: Poner el coche en punto muerto (neutral)
  answer: B
  explanation: Cambiar a una marcha más baja permite que el frenado del motor ayude
    a controlar la velocidad, lo que evita que los frenos se sobrecalienten y fallen
    (brake fade) en los largos descensos de las montañas de Colorado.
- id: 113
  category: defensive_driving
  question: En Colorado, si conduce bajo lluvia intensa, nieve o niebla y no puede
    ver a más de ____ pies de distancia, debe usar sus faros delanteros.
  choices:
    A: 200 pies
    B: 500 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: La ley de Colorado exige que los faros se enciendan si la visibilidad
    es inferior a 1,000 pies debido a las condiciones climáticas.
- id: 114
  category: defensive_driving
  question: 'Al conducir sobre nieve compacta o carreteras con hielo en Colorado,
    la distancia de seguimiento recomendada debe aumentarse a:'
  choices:
    A: 4 segundos
    B: 6 segundos
    C: 8 a 10 segundos
    D: 15 a 20 segundos
  answer: C
  explanation: Debido a que las distancias de frenado aumentan significativamente
    sobre nieve y hielo, Colorado recomienda aumentar la distancia de seguimiento
    a 8-10 segundos.
- id: 115
  category: defensive_driving
  question: 'Según la ley ''Move Over'' (Hacerse a un lado) de Colorado, si ve un
    vehículo de emergencia con luces intermitentes a un costado de la carretera, usted
    debe:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Acelerar para pasarlos rápidamente
    C: Cambiarse de carril si es posible, o reducir la velocidad al menos 20 mph por
      debajo del límite
    D: Mantener su velocidad y permanecer en su carril
  answer: C
  explanation: La ley de Colorado exige que los conductores se cambien de carril ante
    vehículos de emergencia o mantenimiento estacionados. Si no es posible cambiarse
    de carril, debe reducir la velocidad a una que sea al menos 20 mph menor que el
    límite indicado (o 25 mph si el límite es inferior a 45 mph).
- id: 116
  category: defensive_driving
  question: 'Si está conduciendo y sus neumáticos pierden tracción sobre un parche
    de aceite o agua (hidroplaneo), usted debe:'
  choices:
    A: Frenar bruscamente para detener el deslizamiento
    B: Soltar gradualmente el pedal del acelerador y mantener el volante derecho
    C: Girar el volante bruscamente hacia la derecha
    D: Cambiar a reversa
  answer: B
  explanation: Para recuperarse del hidroplaneo, debe soltar el acelerador gradualmente
    y evitar frenar o realizar movimientos bruscos del volante hasta que los neumáticos
    recuperen el contacto con la carretera.
- id: 117
  category: defensive_driving
  question: 'Al entrar en un túnel en una autopista de Colorado (como el Túnel Memorial
    Eisenhower-Johnson), usted debe:'
  choices:
    A: Encender las luces altas
    B: Encender las luces bajas
    C: Acelerar para pasar más rápido
    D: Encender las luces de emergencia (hazards)
  answer: B
  explanation: Las pautas de seguridad de Colorado recomiendan encender las luces
    bajas antes de entrar en los túneles para aumentar la visibilidad y asegurar que
    su vehículo sea visto por otros.
- id: 118
  category: alcohol_drugs_health
  question: En Colorado, los conductores pueden ser arrestados por DUI si su sangre
    contiene ¿cuántos nanogramos de Delta-9 THC por mililitro?
  choices:
    A: 1 nanogramo
    B: 2 nanogramos
    C: 5 nanogramos
    D: 10 nanogramos
  answer: C
  explanation: La ley de Colorado especifica que un jurado puede inferir que un conductor
    estaba bajo la influencia de la marihuana si su sangre contiene 5 nanogramos o
    más de Delta-9 THC por mililitro.
- id: 119
  category: alcohol_drugs_health
  question: ¿Cuántos puntos se evalúan contra una licencia de conducir de Colorado
    por una condena de Conducir con la Capacidad Disminuida (DWAI)?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: Una condena por DWAI resulta en la adición de 8 puntos a su historial
    de manejo de Colorado.
- id: 120
  category: alcohol_drugs_health
  question: Si un conductor de Colorado se niega a realizarse una prueba química cuando
    se sospecha de un DUI, ¿por cuánto tiempo se le revocará la licencia por una primera
    infracción?
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Bajo la Ley de Consentimiento Expreso (Express Consent Law), negarse
    a una prueba química resulta en la revocación automática de su privilegio de conducir
    por 1 año por la primera infracción.
- id: 121
  category: alcohol_drugs_health
  question: ¿Qué es el "efecto sinérgico" en el contexto de la seguridad al conducir?
  choices:
    A: El efecto de conducir mientras se está cansado
    B: El efecto combinado del alcohol y las drogas siendo mayor que cada uno por
      separado
    C: La mejora de la visión al usar lentes recetados
    D: La mejora del tiempo de reacción después de beber café
  answer: B
  explanation: El efecto sinérgico ocurre cuando se mezclan el alcohol y las drogas
    (incluso las recetadas o de venta libre), multiplicando los efectos de deterioro
    en el conductor.
- id: 122
  category: alcohol_drugs_health
  question: ¿Cuántos puntos se evalúan contra la licencia de un menor por una primera
    infracción de consumo de alcohol y conducción por menores de edad (UDD) en Colorado?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: Una primera infracción de UDD (BAC entre 0.02% y 0.05% para menores
    de 21 años) resulta en la evaluación de 4 puntos contra la licencia de conducir.
- id: 123
  category: alcohol_drugs_health
  question: 'En Colorado, un conductor es designado como "Conductor ebrio persistente"
    (PDD) si es sorprendido conduciendo con un BAC de:'
  choices:
    A: 0.08% o superior
    B: 0.12% o superior
    C: 0.15% o superior
    D: 0.20% o superior
  answer: C
  explanation: Un conductor es clasificado como Conductor ebrio persistente (PDD)
    si tiene un BAC de 0.15% o superior, o si tiene múltiples infracciones de DUI/DWAI
    o se niega a una prueba química.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es una sanción obligatoria por una primera condena
    por DUI en Colorado?
  choices:
    A: Pérdida permanente del vehículo
    B: Entre 48 y 96 horas de servicio público útil
    C: Un mínimo de 30 días en la prisión estatal
    D: Revocación de por vida de los privilegios de conducir
  answer: B
  explanation: En Colorado, una primera condena por DUI requiere entre 48 y 96 horas
    de servicio público útil (servicio comunitario).
- id: 125
  category: alcohol_drugs_health
  question: 'En Colorado, "Conducir bajo la influencia" (DUI) se define como conducir
    cuando una persona ha consumido alcohol o drogas que le afectan hasta:'
  choices:
    A: El grado más mínimo
    B: Un grado moderado
    C: Un grado que la hace sustancialmente incapaz de operar el vehículo de manera
      segura
    D: Un grado que causa un accidente inmediato
  answer: C
  explanation: El DUI se define como ser "sustancialmente incapaz" de operar un vehículo
    de manera segura. El DWAI es el cargo menor, definido como estar afectado hasta
    el "grado más mínimo".
- id: 126
  category: alcohol_drugs_health
  question: 'Si es condenado por un DUI en Colorado, se le requerirá instalar un dispositivo
    de bloqueo de encendido (IID) si su BAC fue de o superior a:'
  choices:
    A: 0.05%
    B: 0.08%
    C: 0.15%
    D: 0.25%
  answer: C
  explanation: Los conductores con un BAC de 0.15% o superior son designados como
    Conductores ebrios persistentes y deben usar un dispositivo de bloqueo de encendido
    durante al menos dos años para recuperar los privilegios de conducir completos.
- id: 127
  category: alcohol_drugs_health
  question: ¿Cuál de estos factores tiene la mayor influencia en la rapidez con la
    que su cuerpo procesa el alcohol?
  choices:
    A: El tipo de alcohol (cerveza frente a licor)
    B: Tomar una ducha fría
    C: El tiempo
    D: Beber café solo
  answer: C
  explanation: Solo el tiempo puede reducir la concentración de alcohol en la sangre.
    El café, las duchas y el ejercicio no aceleran el proceso metabólico.
- id: 128
  category: alcohol_drugs_health
  question: 'Si tiene una condición médica que causa lapsos de conciencia (como la
    epilepsia), la ley de Colorado le exige:'
  choices:
    A: Conducir solo durante las horas del día
    B: Estar libre de episodios durante un período de tiempo (generalmente 6 meses)
      y contar con una certificación médica
    C: Entregar su licencia de forma permanente
    D: Conducir solo con un pasajero que pueda tomar el volante
  answer: B
  explanation: Colorado exige que los conductores con condiciones que afectan la conciencia
    estén libres de episodios durante una duración específica y proporcionen una autorización
    médica para garantizar que puedan operar un vehículo de manera segura.
- id: 129
  category: alcohol_drugs_health
  question: Para una primera infracción de consumo de alcohol y conducción por menores
    de edad (UDD) en Colorado, ¿cuál es el período obligatorio de revocación de la
    licencia?
  choices:
    A: 30 días
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Una primera infracción de UDD (BAC entre 0.02% y 0.05% para conductores
    menores de 21 años) resulta en una revocación de la licencia por 3 meses.
- id: 130
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de combinar alcohol con otras drogas, como medicamentos
    recetados o de venta libre?
  choices:
    A: Los efectos de ambos se reducen
    B: El alcohol anula los efectos secundarios de la droga
    C: Puede multiplicar los efectos de ambos, provocando un deterioro grave
    D: No hay un efecto medible en la capacidad de conducción
  answer: C
  explanation: Combinar alcohol con otras drogas (efecto sinérgico) puede aumentar
    drásticamente el deterioro más allá de los efectos de cualquiera de las sustancias
    por sí sola.
- id: 131
  category: alcohol_drugs_health
  question: 'Un infractor de DUI por primera vez en Colorado con un BAC de 0.15% o
    superior debe instalar un dispositivo de interbloqueo de encendido (IID) por al
    menos:'
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: Bajo las leyes de Conductor Ebrio Persistente (PDD) de Colorado, un
    infractor por primera vez con un BAC de 0.15% o superior debe usar un IID por
    al menos dos años.
- id: 132
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de reducir su contenido de alcohol en
    sangre (BAC) antes de conducir?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Ejercicio vigoroso
    D: Permitir que pase el tiempo para que su cuerpo procese el alcohol
  answer: D
  explanation: Solo el tiempo puede reducir el BAC. El cuerpo procesa el alcohol a
    un ritmo constante, y métodos como el café o las duchas no aceleran este proceso.
- id: 133
  category: alcohol_drugs_health
  question: Para los conductores de vehículos motorizados comerciales (titulares de
    CDL) en Colorado, ¿cuál es el límite de BAC que resulta en una descalificación?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: El límite legal para conductores comerciales es de 0.04%. Cualquier
    BAC en este nivel o superior resulta en la descalificación de los privilegios
    de la CDL.
- id: 134
  category: alcohol_drugs_health
  question: 'En Colorado, si una persona menor de 21 años es declarada culpable de
    poseer o consumir alcohol (incluso si no estaba conduciendo), puede enfrentar:'
  choices:
    A: Una prohibición permanente para obtener una licencia
    B: La revocación de la licencia de conducir
    C: Solo una pequeña multa sin impacto en la conducción
    D: Servicio militar obligatorio
  answer: B
  explanation: Las leyes de 'Compra y Posesión' de Colorado significan que los menores
    pueden perder sus privilegios de conducir por delitos relacionados con el alcohol,
    incluso si no estaban conduciendo en ese momento.
- id: 135
  category: alcohol_drugs_health
  question: En Colorado, ¿puede ser acusado de DUI por conducir bajo la influencia
    de medicamentos recetados legalmente?
  choices:
    A: No, porque el medicamento es legal
    B: Solo si no lleva consigo el frasco de la receta
    C: Sí, si el medicamento afecta su capacidad para conducir de manera segura
    D: Solo si el medicamento es un narcótico de la Lista I
  answer: C
  explanation: Un cargo de DUI se aplica a cualquier sustancia que afecte la conducción,
    incluidos los medicamentos recetados legales y los medicamentos de venta libre.
- id: 136
  category: penalties_and_points
  question: Según la ley de Colorado, ¿cuántos puntos vale una condena por 'Conducción
    Temeraria' (Reckless Driving) en su historial de manejo?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: La conducción temeraria es una infracción grave en Colorado y conlleva
    una penalización de 8 puntos.
- id: 137
  category: penalties_and_points
  question: En Colorado, ¿cuál es la penalización de puntos por 'Seguir Demasiado
    Cerca' (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Seguir demasiado cerca se considera un peligro de seguridad significativo
    en Colorado y se penaliza con 4 puntos.
- id: 138
  category: penalties_and_points
  question: Bajo la ley de 'Consentimiento Expreso' (Express Consent) de Colorado,
    si se niega a realizar una prueba química cuando lo solicita un oficial que sospecha
    que conduce bajo los efectos del alcohol (DUI), ¿cuál es la sanción administrativa
    inmediata?
  choices:
    A: Solo una multa de $500
    B: Su licencia será revocada por un año
    C: 48 horas obligatorias en la cárcel
    D: 6 puntos añadidos a su licencia
  answer: B
  explanation: Al conducir en Colorado, usted otorga su 'consentimiento expreso' para
    las pruebas químicas. La negativa resulta en una revocación automática de un año
    de su privilegio de conducir.
- id: 139
  category: penalties_and_points
  question: ¿Cuál es la penalización de puntos por no detenerse ante un autobús escolar
    con luces rojas intermitentes en Colorado?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: No detenerse ante un autobús escolar es una infracción mayor en Colorado
    y resulta en 6 puntos.
- id: 140
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por 'Conducción Descuidada' (Careless Driving)
    en Colorado?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: La conducción descuidada (conducir de una manera sin la debida consideración
    por el ancho, la pendiente, las curvas, las esquinas, el tráfico y el uso de las
    calles) resulta en 4 puntos.
- id: 141
  category: penalties_and_points
  question: Para un conductor de 21 años de edad o más, ¿cuántos puntos acumulados
    en cualquier periodo de 24 meses consecutivos resultarán en la suspensión de la
    licencia?
  choices:
    A: 12 puntos
    B: 15 puntos
    C: 18 puntos
    D: 24 puntos
  answer: C
  explanation: Los conductores adultos (mayores de 21 años) enfrentan una suspensión
    si acumulan 12 puntos en 12 meses, o 18 puntos en 24 meses.
- id: 142
  category: penalties_and_points
  question: En Colorado, exceder el límite de velocidad por 40 mph o más es una infracción
    de alto puntaje. ¿Cuántos puntos se asignan?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: Exceder el límite de velocidad por 40 mph o más resulta en 12 puntos,
    lo cual es suficiente para provocar una suspensión inmediata para la mayoría de
    los conductores.
- id: 143
  category: penalties_and_points
  question: Abandonar la escena de un accidente (Hit and Run) en Colorado, ¿cuántos
    puntos genera en su historial de conducción?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: Abandonar la escena de un accidente es una infracción grave y resulta
    en la adición de 12 puntos al historial del conductor.
- id: 144
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por no detenerse ante una luz roja o una señal
    de alto (stop sign) en Colorado?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: No detenerse ante una señal de tráfico (luz roja) o una señal de alto
    resulta en 4 puntos en su historial de conducción de Colorado.
- id: 145
  category: penalties_and_points
  question: Si se le condena por operar un vehículo motorizado sin una póliza de seguro
    válida en Colorado, ¿cuántos puntos se añaden a su licencia por una primera infracción?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 10 puntos
  answer: B
  explanation: Operar un vehículo sin seguro en Colorado resulta en 4 puntos en su
    licencia, además de multas y una posible suspensión.
- id: 146
  category: penalties_and_points
  question: 'Bajo la ley de ''Consentimiento Expreso'' (Express Consent) de Colorado,
    si se niega a realizarse una prueba química cuando lo solicite la policía, su
    licencia será revocada automáticamente por:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Al conducir en Colorado, usted otorga su 'Consentimiento Expreso' para
    realizarse pruebas químicas. La negativa resulta en la revocación automática de
    la licencia por 1 año por una primera infracción.
- id: 147
  category: penalties_and_points
  question: Según la ley de Colorado, no ceder el paso a un vehículo de emergencia,
    mantenimiento o grúa que esté detenido (Ley de Moverse a un Lado o 'Move Over
    Law') resulta en ¿cuántos puntos?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Violar la ley 'Move Over' de Colorado al no ceder el paso o no moverse
    a un lado ante vehículos de emergencia detenidos resulta en 4 puntos.
- id: 148
  category: penalties_and_points
  question: Si se le sorprende excediendo el límite de velocidad por un margen de
    20 a 39 mph en Colorado, ¿cuántos puntos se asignarán contra su licencia?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: Exceder el límite de velocidad por 20-39 mph resulta en 6 puntos en
    Colorado. (Excederlo por 10-19 mph son 4 puntos).
- id: 149
  category: penalties_and_points
  question: Para un conductor menor de 18 años en Colorado, ¿cuántos puntos se asignan
    por una infracción a la ley del cinturón de seguridad?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Si bien las infracciones del cinturón de seguridad suelen ser secundarias
    para los adultos, para los conductores menores de edad en Colorado, una infracción
    del cinturón de seguridad resulta en 2 puntos.
- id: 150
  category: penalties_and_points
  question: En Colorado, no detenerse ante un autobús escolar que tiene sus luces
    rojas intermitentes encendidas y el brazo de parada extendido resulta en ¿cuántos
    puntos?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: No detenerse ante un autobús escolar es una infracción de seguridad
    importante en Colorado y conlleva una penalización de 6 puntos.
- id: 151
  category: sharing_the_road
  question: ¿Bajo la ley de Colorado, cuántos puntos se evalúan contra su licencia
    de conducir por rebasar un autobús escolar mientras sus luces rojas están parpadeando
    y su brazo de parada está extendido?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Rebasar un autobús escolar detenido con las luces rojas parpadeando
    es una infracción grave en Colorado y resulta en la adición de 6 puntos a su historial
    de conducción.
- id: 152
  category: sharing_the_road
  question: ¿Qué exige la ley de 'Moverse a un lado' (Move Over) de Colorado a los
    conductores al acercarse a un vehículo de emergencia estacionario con luces parpadeantes
    en una autopista de varios carriles?
  choices:
    A: Detenerse por completo hasta que el vehículo de emergencia se retire
    B: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    C: Moverse al menos un carril si es seguro hacerlo, o reducir la velocidad significativamente
      si no es posible cambiarse de carril
    D: Solo moverse si el vehículo de emergencia es una patrulla de policía
  answer: C
  explanation: La ley de Colorado exige que los conductores se muevan al menos un
    carril al acercarse a vehículos de emergencia, de remolque o de mantenimiento
    estacionarios. Si no es seguro moverse, el conductor debe reducir la velocidad
    a al menos 20 mph por debajo del límite publicado (o 25 mph si el límite es de
    45 mph o menos).
- id: 153
  category: sharing_the_road
  question: De acuerdo con la ley de 'Parada de Seguridad de Colorado' (SB22-102),
    ¿qué se les permite hacer a los ciclistas en una señal de alto si la intersección
    está despejada?
  choices:
    A: Mantener la velocidad máxima sin mirar
    B: Tratar la señal de alto como una señal de ceda el paso y proceder a una velocidad
      razonable sin detenerse
    C: Siempre deben detenerse por completo durante al menos 3 segundos
    D: Solo pueden omitir la parada si están en un grupo de 5 o más personas
  answer: B
  explanation: La Parada de Seguridad de Colorado permite a los ciclistas tratar las
    señales de alto como señales de ceda el paso y los semáforos en rojo como señales
    de alto (si la luz está en rojo y no se aproxima tráfico) cuando el camino está
    despejado.
- id: 154
  category: sharing_the_road
  question: A partir de agosto de 2024, ¿bajo qué condición específica permite la
    ley de Colorado el 'filtrado de carriles' (lane filtering) para motocicletas?
  choices:
    A: Las motocicletas pueden filtrar a cualquier velocidad en cualquier carretera
    B: El tráfico debe estar detenido y la motocicleta no debe exceder las 15 mph
    C: Las motocicletas solo pueden filtrar por el arcén (hombro) derecho
    D: El filtrado solo está permitido en autopistas rurales de dos carriles
  answer: B
  explanation: La ley HB24-1159 permite que las motocicletas rebasen vehículos detenidos
    en el mismo carril si el tráfico está completamente parado y la motocicleta no
    supera las 15 mph. No se permite en los arcenes ni entre vehículos en movimiento.
- id: 155
  category: sharing_the_road
  question: 'En Colorado, si ve a un peatón usando un bastón blanco o un perro guía,
    usted debe:'
  choices:
    A: Tocar la bocina para hacerles saber que usted está allí
    B: Ceder el derecho de paso y detenerse por completo
    C: Reducir la velocidad y conducir cerca de ellos
    D: Solo detenerse si están en un cruce de peatones marcado
  answer: B
  explanation: La ley de Colorado exige que los conductores se detengan por completo
    para permitir que una persona ciega o con discapacidad visual que use un bastón
    o un perro guía cruce la calle, independientemente de si se encuentra en un cruce
    de peatones.
- id: 156
  category: sharing_the_road
  question: 'Al conducir cerca de un camión comercial grande, la ''Zona No'' (No-Zone)
    se refiere a:'
  choices:
    A: El área donde los camiones no tienen permitido circular
    B: Los puntos ciegos alrededor del camión donde su vehículo no puede ser visto
      por el conductor
    C: La zona de velocidad restringida para camiones en las montañas
    D: El área de carga del camión
  answer: B
  explanation: La 'Zona No' (No-Zone) representa los grandes puntos ciegos detrás,
    delante y a ambos lados de un camión comercial donde el conductor del camión no
    puede ver a otros vehículos.
- id: 157
  category: sharing_the_road
  question: 'Cuando un automovilista realiza un giro a la derecha cruzando un carril
    para bicicletas en Colorado, debe:'
  choices:
    A: Acelerar para adelantarse a cualquier ciclista
    B: Señalizar, verificar si hay ciclistas y ceder el paso a cualquier ciclista
      en el carril antes de girar
    C: Detenerse siempre en el carril de bicicletas para esperar un espacio en el
      tráfico
    D: Los ciclistas siempre deben ceder el paso a los autos que giran
  answer: B
  explanation: Los automovilistas deben ceder el paso a los ciclistas en un carril
    para bicicletas antes de realizar un giro. Debe revisar sus espejos y puntos ciegos
    para asegurarse de que no se aproximen ciclistas por detrás a su derecha.
- id: 158
  category: sharing_the_road
  question: En una autopista de Colorado con al menos dos carriles en cada dirección,
    usted se acerca a una grúa estacionaria con sus luces ámbar parpadeando. ¿Cuál
    es el requisito legal?
  choices:
    A: Solo necesita moverse para luces rojas y azules
    B: Debe moverse un carril si es seguro, ya que la ley de 'Moverse a un lado' incluye
      vehículos de remolque y de servicio
    C: Debe detenerse y preguntar si necesitan ayuda
    D: Debe mantener su velocidad y permanecer en su carril
  answer: B
  explanation: La ley de 'Moverse a un lado' (Move Over) de Colorado se amplió para
    incluir grúas estacionarias, vehículos de servicios públicos y vehículos de mantenimiento
    que muestren luces parpadeantes ámbar o blancas.
- id: 159
  category: sharing_the_road
  question: ¿Cuándo NO es obligatorio detenerse ante un autobús escolar en Colorado
    que tiene sus luces rojas parpadeando y el brazo de parada extendido?
  choices:
    A: Cuando viaja en la dirección opuesta en una autopista dividida con una mediana
      o barrera
    B: Cuando tiene prisa y el autobús está detenido por más de 2 minutos
    C: Cuando el autobús está detenido en una zona residencial
    D: Cuando no hay niños visibles
  answer: A
  explanation: No es necesario detenerse si viaja en la dirección opuesta en una autopista
    dividida donde la carretera está separada por una mediana, una franja de césped
    o una barrera de concreto.
- id: 160
  category: sharing_the_road
  question: En Colorado, ¿quién está legalmente obligado a usar casco mientras viaja
    o conduce una motocicleta?
  choices:
    A: Todos los ocupantes, independientemente de su edad
    B: Nadie; el uso del casco es opcional para todos
    C: Solo el conductor, no el pasajero
    D: Cualquier conductor o pasajero menor de 18 años
  answer: D
  explanation: La ley de Colorado exige que todos los conductores y pasajeros de motocicletas
    menores de 18 años usen un casco aprobado por el DOT. Para los mayores de 18 años,
    el uso del casco es opcional, aunque se requiere protección ocular para todos.
- id: 161
  category: sharing_the_road
  question: Si usted está girando a la izquierda en una intersección y un peatón está
    cruzando la calle a la que usted está girando, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor, porque tiene la luz verde
    B: El peatón, incluso si el cruce peatonal no está marcado
    C: El peatón, pero solo si hay una señal de 'Caminar' (Walk)
    D: Quien haya entrado primero en la intersección
  answer: B
  explanation: En Colorado, los conductores deben ceder el paso a los peatones tanto
    en los cruces peatonales marcados como en los no marcados en las intersecciones.
- id: 162
  category: sharing_the_road
  question: Al seguir a un camión grande, ¿por qué debería aumentar su distancia de
    seguimiento más de lo que lo haría con un automóvil de pasajeros?
  choices:
    A: Para permitir que el conductor del camión lo vea en sus espejos retrovisores
    B: Porque los camiones siempre conducen más lento que el límite de velocidad
    C: Porque los camiones están obligados a detenerse en todos los cruces ferroviarios
    D: Para evitar que el camión ruede hacia atrás y lo golpee
  answer: A
  explanation: Si sigue a un camión demasiado de cerca, se encuentra en el punto ciego
    trasero del conductor (No-Zone). Aumentar su distancia asegura que el conductor
    del camión pueda verlo en sus espejos laterales.
- id: 163
  category: sharing_the_road
  question: 'Bajo la ley de Colorado, a los ciclistas se les permite circular de dos
    en fondo (uno al lado del otro) solo si:'
  choices:
    A: Están en una carrera de bicicletas designada
    B: No impiden el movimiento normal y razonable del tráfico
    C: Es después del atardecer
    D: Están en una acera
  answer: B
  explanation: La ley de Colorado (CRS 42-4-1412) permite a los ciclistas circular
    de dos en fondo siempre que no impidan el flujo razonable del tráfico. Si están
    impidiendo el tráfico, deben circular en fila india.
- id: 164
  category: sharing_the_road
  question: 'No ceder el paso a un vehículo de emergencia (violación de la Ley de
    Moverse a un Lado [Move Over Law]) en Colorado que resulte en la lesión de otra
    persona se clasifica como:'
  choices:
    A: Un delito de tráfico de clase 1 (Class 1 misdemeanor)
    B: Una infracción de tráfico menor
    C: Un delito grave de clase 2 (Class 2 felony)
    D: Una infracción que no resta puntos
  answer: A
  explanation: Si bien una violación estándar de la Ley de Moverse a un Lado es una
    infracción de tráfico de Clase A, si la violación resulta en lesiones corporales
    a otra persona, se eleva a un delito de tráfico de clase 1 (Class 1 misdemeanor).
- id: 165
  category: sharing_the_road
  question: 'En Colorado, cuando un autobús escolar se detiene con sus luces rojas
    intermitentes y el brazo de parada extendido, usted debe detenerse a menos que:'
  choices:
    A: Usted viaje en la dirección opuesta en una carretera con al menos dos carriles
      en cada dirección.
    B: Usted viaje en la dirección opuesta en una carretera separada por un divisor
      físico o una franja de césped.
    C: Usted se encuentre al menos a 100 pies de distancia del autobús.
    D: El conductor del autobús le haga señas para que pase.
  answer: B
  explanation: De acuerdo con el Manual del Conductor de Colorado, usted debe detenerse
    ante un autobús escolar con luces rojas intermitentes a menos que viaje en la
    dirección opuesta en una carretera de varios carriles que esté dividida por una
    mediana u otra barrera física.
- id: 166
  category: sharing_the_road
  question: 'La ley de ''Moverse a un Lado'' (Move Over) de Colorado requiere que
    los conductores que se aproximen a un vehículo de emergencia, de remolque o de
    mantenimiento estacionado con luces intermitentes deban:'
  choices:
    A: Detenerse por completo hasta que el vehículo se mueva.
    B: Mantener la velocidad pero cambiarse al carril izquierdo.
    C: Moverse al menos un carril si es seguro, o reducir la velocidad significativamente
      si no es posible cambiarse de carril.
    D: Tocar la bocina para alertar a los trabajadores de su presencia.
  answer: C
  explanation: La ley de Colorado exige que los conductores se muevan un carril al
    aproximarse a vehículos de emergencia o mantenimiento estacionados. Si cambiarse
    de carril no es seguro o posible, el conductor debe reducir la velocidad a al
    menos 20 mph por debajo del límite publicado (o a 25 mph si el límite es de 45
    mph o menos).
- id: 167
  category: sharing_the_road
  question: En Colorado, si un peatón está cruzando la calle en una intersección sin
    un cruce peatonal marcado, ¿quién tiene el derecho de paso?
  choices:
    A: El automovilista, porque no hay un cruce pintado.
    B: El peatón, ya que cada intersección se considera un 'cruce peatonal no marcado'.
    C: El automovilista, a menos que el peatón esté usando un bastón blanco.
    D: El peatón, pero solo si está cruzando una calle de sentido único.
  answer: B
  explanation: La ley de Colorado dicta que los peatones tienen el derecho de paso
    en todas las intersecciones, ya sea que el cruce peatonal esté marcado o no.
- id: 168
  category: sharing_the_road
  question: 'Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    aproxima por detrás, la ley de Colorado le exige:'
  choices:
    A: Detenerse exactamente donde está en su carril.
    B: Aumentar la velocidad para despejar el camino.
    C: Detenerse lo más a la derecha posible y parar.
    D: Moverse al arcén izquierdo y detenerse.
  answer: C
  explanation: Los conductores deben ceder el derecho de paso a los vehículos de emergencia
    moviéndose hacia el borde derecho o la acera de la carretera y deteniéndose hasta
    que el vehículo haya pasado.
- id: 169
  category: sharing_the_road
  question: En Colorado, ¿cuál es la penalización de puntos que se aplica a su licencia
    de conducir por una primera infracción de no detenerse ante un autobús escolar?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: No detenerse ante un autobús escolar con sus luces rojas intermitentes
    es una infracción grave en Colorado y resulta en la adición de 6 puntos al registro
    del conductor.
- id: 170
  category: sharing_the_road
  question: 'Cuando un ciclista se prepara para girar a la izquierda en una intersección,
    legalmente se le permite:'
  choices:
    A: Girar únicamente desde el extremo derecho de la carretera.
    B: Bajarse de la bicicleta y cruzar caminando únicamente por el paso de peatones.
    C: Usar el carril de giro a la izquierda al igual que un vehículo motorizado.
    D: Girar a la izquierda únicamente desde la acera.
  answer: C
  explanation: Los ciclistas tienen los mismos derechos y deberes que los automovilistas
    en Colorado. Pueden desplazarse al carril de giro a la izquierda o al centro del
    carril para prepararse para un giro a la izquierda.
- id: 171
  category: sharing_the_road
  question: ¿Por qué debe evitar colocarse en el espacio del lado derecho de un camión
    grande en una intersección?
  choices:
    A: Los camiones tienen una 'Zona No' (No-Zone) en el lado derecho y pueden necesitar
      abrirse hacia la izquierda para girar a la derecha.
    B: Los camiones están obligados legalmente a girar únicamente desde el carril
      izquierdo.
    C: Los gases de escape están más concentrados en el lado derecho.
    D: Es ilegal rebasar a cualquier vehículo por la derecha en Colorado.
  answer: A
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para no subir al bordillo al girar a la derecha. Si usted se encuentra en la 'Zona
    No' (No-Zone) a su derecha, el conductor no puede verlo y usted podría quedar
    atrapado entre el camión y el bordillo.
- id: 172
  category: sharing_the_road
  question: 'Según la ley de Colorado, usted debe ceder el paso a cualquier peatón
    que esté:'
  choices:
    A: Usando una chaqueta de color amarillo brillante.
    B: Usando un bastón blanco o un perro guía.
    C: Cruzando la calle en contra de una señal de 'No caminar'.
    D: Caminando por el arcén de una carretera rural.
  answer: B
  explanation: La ley de Colorado exige que los conductores se detengan por completo
    y cedan el paso a cualquier peatón que sea ciego o tenga una discapacidad visual
    y lleve un bastón blanco o utilice un perro guía.
- id: 173
  category: sharing_the_road
  question: 'Una violación de la ley de ''Hacerse a un lado'' (Move Over) de Colorado
    que no resulte en lesiones se clasifica como:'
  choices:
    A: Infracción de tráfico de Clase A
    B: Delito de tráfico menor de Clase 2 (Class 2 Misdemeanor)
    C: Felonía de Clase 1
    D: Falta leve (Petty Offense)
  answer: B
  explanation: Violar la ley de 'Hacerse a un lado' (C.R.S. 42-4-705) es un delito
    de tráfico menor de Clase 2 en Colorado. Si resulta en una lesión, las penas se
    vuelven significativamente más severas.
- id: 174
  category: sharing_the_road
  question: 'En Colorado, las bicicletas que circulan de noche deben estar equipadas
    con una lámpara delantera que emita una luz blanca visible desde una distancia
    de al menos:'
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Colorado exige que las bicicletas tengan una luz delantera
    blanca visible desde 500 pies y un reflector o luz trasera roja visible desde
    600 pies cuando circulen entre la puesta del sol y el amanecer.
- id: 175
  category: vehicle_information
  question: En Colorado, debe usar sus faros delanteros entre la puesta del sol y
    el amanecer y en cualquier otro momento en que no pueda ver claramente a una distancia
    de al menos ¿cuántos pies?
  choices:
    A: 500 pies
    B: 1,000 pies
    C: 1,500 pies
    D: 2,000 pies
  answer: B
  explanation: La ley de Colorado exige que los faros delanteros estén encendidos
    desde la puesta del sol hasta el amanecer y siempre que la visibilidad sea inferior
    a 1,000 pies debido al clima u otras condiciones.
- id: 176
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos es requerido por la ley de Colorado en
    todos los vehículos para reducir el ruido del motor y evitar el humo excesivo?
  choices:
    A: Un convertidor catalítico
    B: Un silenciador (muffler)
    C: Un turbocompresor
    D: Un filtro de aire
  answer: B
  explanation: La ley de Colorado exige que todo vehículo motorizado esté equipado
    con un silenciador en buen estado de funcionamiento para evitar ruidos inusuales
    o excesivos y humo. Los recortes o derivaciones del silenciador son ilegales.
- id: 177
  category: vehicle_information
  question: Según la ley de Colorado, ¿cuál es el requisito de transmisión de luz
    para el polarizado de las ventanas laterales delanteras si el parabrisas también
    está polarizado?
  choices:
    A: Al menos un 20% de transmisión de luz
    B: Al menos un 50% de transmisión de luz
    C: Al menos un 70% de transmisión de luz
    D: Al menos un 35% de transmisión de luz
  answer: C
  explanation: En Colorado, si el parabrisas está polarizado (solo las 4 pulgadas
    superiores), las ventanas laterales delanteras deben permitir el paso de al menos
    el 70% de la luz. Si el parabrisas no está polarizado, las ventanas laterales
    pueden tener una oscuridad de hasta el 27%.
- id: 178
  category: vehicle_information
  question: En Colorado, si una carga se extiende más de ¿cuántos pies más allá de
    la parte trasera de un vehículo, se debe colocar una bandera roja (día) o una
    luz roja (noche) al final de la carga?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: C
  explanation: La ley de Colorado exige una bandera roja (de al menos 12 pulgadas
    cuadradas) durante el día o una luz roja por la noche si una carga se extiende
    4 pies o más más allá de la parte trasera de la carrocería del vehículo.
- id: 179
  category: vehicle_information
  question: La ley de Colorado exige que la bocina de su vehículo sea audible desde
    una distancia de al menos ¿cuántos pies?
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: Todo vehículo motorizado en Colorado debe estar equipado con una bocina
    capaz de emitir un sonido audible en condiciones normales desde una distancia
    no inferior a 200 pies.
- id: 180
  category: vehicle_information
  question: En Colorado, todo vehículo motorizado debe estar equipado con al menos
    un espejo que permita al conductor ver la carretera a una distancia de al menos
    ¿cuántos pies hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Colorado exige que los vehículos tengan espejos que proporcionen
    una visión de la carretera de al menos 200 pies hacia la parte trasera del vehículo.
- id: 181
  category: vehicle_information
  question: ¿Cuál es el requisito específico para la luz de la placa de matrícula
    trasera de un vehículo en Colorado?
  choices:
    A: Debe ser azul o blanca y visible desde 100 pies.
    B: Debe ser blanca y hacer que la placa sea claramente legible desde 50 pies.
    C: Debe ser roja y visible desde 50 pies.
    D: Debe ser blanca y visible desde 200 pies.
  answer: B
  explanation: La ley de Colorado exige una luz blanca para iluminar la placa de matrícula
    trasera de modo que sea claramente legible desde una distancia de 50 pies hacia
    atrás.
- id: 182
  category: vehicle_information
  question: Según la Ley de Cadenas para Vehículos de Pasajeros de Colorado (Código
    16), ¿qué deben llevar los vehículos de pasajeros no equipados (aquellos sin tracción
    en las cuatro ruedas [4WD/AWD] o neumáticos adecuados)?
  choices:
    A: Mantas adicionales y agua
    B: Una pala y arena
    C: Cadenas o un dispositivo de tracción alternativo aprobado
    D: Un neumático de repuesto de tamaño completo
  answer: C
  explanation: Cuando se implementa el Código 16, todos los vehículos de pasajeros
    deben tener cadenas o un dispositivo de tracción alternativo aprobado (como AutoSock)
    para al menos dos neumáticos de tracción, independientemente del tipo de neumático
    o sistema de tracción.
- id: 183
  category: vehicle_information
  question: En Colorado, ¿cuál de las siguientes afirmaciones es verdadera con respecto
    al uso del freno de estacionamiento de un vehículo?
  choices:
    A: Solo es obligatorio para vehículos con transmisión manual.
    B: Debe ser capaz de detener el vehículo en cualquier pendiente en la que se opere.
    C: Solo es obligatorio al estacionar en una colina con una inclinación superior
      a 15 grados.
    D: Debe aplicarse solo cuando el motor está apagado.
  answer: B
  explanation: La ley de Colorado exige que todos los vehículos motorizados tengan
    un freno de servicio y un freno de estacionamiento. El freno de estacionamiento
    debe ser adecuado para detener el vehículo en cualquier pendiente en la que se
    opere.
- id: 184
  category: vehicle_information
  question: ¿En cuál de las siguientes áreas de Colorado se requiere generalmente
    una prueba de emisiones para el registro del vehículo?
  choices:
    A: Solo en la ciudad de Aspen
    B: En el área metropolitana de Denver-Boulder y el North Front Range
    C: Solo para vehículos con más de 25 años de antigüedad en todo el estado
    D: Solo para vehículos diésel en el condado de El Paso
  answer: B
  explanation: El programa de Inspección y Reajuste de Automóviles (AIR) requiere
    pruebas de emisiones en el área metropolitana de Denver (incluidos los condados
    de Boulder, Broomfield, Denver, Douglas y Jefferson) y partes de los condados
    de Adams, Arapahoe, Larimer y Weld.
- id: 185
  category: vehicle_information
  question: ¿Qué establece la ley de Colorado con respecto a los objetos que cuelgan
    del espejo retrovisor o las calcomanías en el parabrisas?
  choices:
    A: Son legales siempre que midan menos de 5 pulgadas.
    B: Son legales solo si son pases oficiales de parques estatales.
    C: Están prohibidos si obstruyen la visión clara del conductor a través del parabrisas.
    D: Solo están prohibidos para conductores menores de 18 años.
  answer: C
  explanation: La ley de Colorado prohíbe que cualquier persona conduzca un vehículo
    con cualquier letrero, póster u otro material no transparente sobre el parabrisas
    delantero, las aletas laterales o las ventanas laterales o traseras que obstruya
    la visión clara del conductor.
- id: 186
  category: vehicle_information
  question: En Colorado, las luces de freno deben ser visibles desde una distancia
    de al menos ¿cuántos pies hacia atrás bajo la luz solar normal?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: La ley de Colorado exige que las luces de freno (stop lamps) sean visibles
    desde una distancia no menor a 100 pies hacia atrás bajo la luz solar normal.
- id: 187
  category: vehicle_information
  question: En Colorado, debe encender los faros delanteros si no puede ver claramente
    a una distancia de al menos ¿cuántos pies hacia adelante?
  choices:
    A: 500 pies
    B: 1,000 pies
    C: 1,500 pies
    D: 2,000 pies
  answer: B
  explanation: La ley de Colorado exige que los faros delanteros se enciendan entre
    la puesta del sol y el amanecer, y en cualquier otro momento en que la visibilidad
    sea inferior a 1,000 pies.
- id: 188
  category: vehicle_information
  question: 'Según la ley de Colorado, la placa de registro trasera (placa de matrícula)
    debe estar iluminada de modo que sea claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Colorado exige una luz blanca para iluminar la placa de matrícula
    trasera de modo que sea claramente legible desde una distancia de 50 pies hacia
    atrás.
- id: 189
  category: vehicle_information
  question: ¿Cuál es la transmisión de luz mínima permitida para el polarizado de
    las ventanas laterales delanteras de un vehículo en Colorado?
  choices:
    A: 20%
    B: 27%
    C: 35%
    D: 70%
  answer: B
  explanation: La ley de Colorado especifica que las ventanas laterales delanteras
    (a la izquierda y derecha del conductor) deben permitir el paso de al menos el
    27% de la luz.
- id: 190
  category: vehicle_information
  question: ¿En Colorado, todo niño menor de qué edad y peso debe estar debidamente
    sujeto en un sistema de retención infantil orientado hacia atrás?
  choices:
    A: Menor de 1 año y menos de 20 libras
    B: Menor de 2 años y menos de 30 libras
    C: Menor de 4 años y menos de 40 libras
    D: Menor de 6 meses y menos de 15 libras
  answer: A
  explanation: La ley de Colorado exige que los niños utilicen un asiento de seguridad
    infantil orientado hacia atrás hasta que tengan al menos 1 año de edad y pesen
    al menos 20 libras.
- id: 191
  category: vehicle_information
  question: 'Si la visión trasera de su vehículo está obstruida por un remolque o
    una carga, la ley de Colorado exige que tenga:'
  choices:
    A: Un pasajero que actúe como guía
    B: Un espejo retrovisor de ángulo ancho
    C: Espejos exteriores tanto a la izquierda como a la derecha
    D: Un sistema de cámara de reversa
  answer: C
  explanation: Si el espejo retrovisor interno está obstruido, la ley de Colorado
    exige que el vehículo esté equipado con espejos laterales tanto a la izquierda
    como a la derecha que proporcionen una visión de la carretera de al menos 200
    pies hacia atrás.
- id: 192
  category: vehicle_information
  question: 'La ley de Colorado exige que todo vehículo motorizado esté equipado con
    un freno de estacionamiento que sea capaz de detener el vehículo:'
  choices:
    A: Solo en una superficie nivelada
    B: Solo cuando el vehículo está vacío
    C: En cualquier pendiente en la que se opere
    D: Solo cuando el motor está en marcha
  answer: C
  explanation: El sistema de freno de estacionamiento debe ser capaz de detener el
    vehículo en cualquier pendiente (colina) en la que se opere, independientemente
    de la carga.
- id: 193
  category: vehicle_information
  question: En los condados de Colorado que requieren pruebas de emisiones, ¿con qué
    frecuencia deben someterse normalmente a una inspección de emisiones la mayoría
    de los vehículos (de más de 7 años)?
  choices:
    A: Cada año
    B: Cada dos años
    C: Cada cinco años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: En las áreas del programa de emisiones de Colorado (como Denver y Boulder),
    la mayoría de los vehículos de gasolina de más de 7 años deben aprobar una prueba
    de emisiones cada dos años.
- id: 194
  category: vehicle_information
  question: Bajo condiciones normales (sin Ley de Tracción [Traction Law]) en Colorado,
    ¿cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 3/32 de pulgada
    D: 4/32 de pulgada
  answer: B
  explanation: Para condiciones de conducción estándar en Colorado, los neumáticos
    se consideran inseguros e ilegales si la banda de rodadura es inferior a 2/32
    de pulgada.
- id: 195
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la ley
    de cinturones de seguridad de Colorado para ocupantes menores de 18 años?
  choices:
    A: Es una ley de aplicación secundaria (secondary enforcement)
    B: Es una ley de aplicación primaria (primary enforcement)
    C: Los cinturones de seguridad solo son obligatorios en el asiento delantero
    D: Los cinturones de seguridad son opcionales si el vehículo tiene bolsas de aire
  answer: B
  explanation: Si bien el uso del cinturón de seguridad para adultos en Colorado es
    de aplicación secundaria, es una ley de aplicación primaria para todos los ocupantes
    menores de 18 años, lo que significa que un conductor puede ser detenido únicamente
    por esta infracción.
- id: 196
  category: vehicle_information
  question: 'Con respecto a los sistemas de escape de los vehículos, la ley de Colorado
    prohíbe específicamente el uso de:'
  choices:
    A: Convertidores catalíticos
    B: Tubos de escape dobles
    C: Recortes o derivaciones (bypasses) del silenciador
    D: Tubos de escape cromados
  answer: C
  explanation: La ley de Colorado prohíbe el uso de recortes de silenciador, derivaciones
    o dispositivos similares que aumenten el ruido o impidan la reducción efectiva
    del ruido del escape.
- id: 197
  category: vehicle_information
  question: 'En Colorado, se debe mostrar un emblema de ''Vehículo de Movimiento Lento''
    en la parte trasera de cualquier vehículo que no sea capaz de mantener una velocidad
    superior a:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: El emblema triangular naranja de 'Vehículo de Movimiento Lento' es
    obligatorio para los vehículos diseñados para viajar a velocidades de 25 mph o
    menos.
- id: 198
  category: signs_and_signals
  question: 'Una marca en forma de diamante en el centro de un carril indica que el
    carril es:'
  choices:
    A: Reservado solo para camiones pesados.
    B: Un carril para vehículos de alta ocupación (HOV) o carril restringido.
    C: Un área designada para detenerse en caso de emergencia.
    D: Un carril que termina en 500 pies.
  answer: B
  explanation: En Colorado, las marcas en el pavimento en forma de diamante se utilizan
    para indicar carriles restringidos, como los carriles HOV para vehículos con múltiples
    ocupantes, autobuses o motocicletas.
- id: 199
  category: signs_and_signals
  question: Si las luces de giro de su vehículo fallan, ¿cuál es la señal manual correcta
    para indicar un giro a la izquierda?
  choices:
    A: Brazo extendido hacia afuera de la ventana.
    B: Brazo doblado hacia arriba en un ángulo de 90 grados.
    C: Brazo doblado hacia abajo en un ángulo de 90 grados.
    D: Brazo agitándose en movimiento circular.
  answer: A
  explanation: Para señalar un giro a la izquierda usando señales manuales en Colorado,
    debe extender el brazo izquierdo horizontalmente hacia afuera de la ventana.
- id: 200
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de tráfico de color rosa fluorescente
    en Colorado?
  choices:
    A: Zona escolar más adelante.
    B: Recreación pública y parques.
    C: Gestión de incidentes (accidentes o escenas de emergencia).
    D: Cruce de peatones.
  answer: C
  explanation: Las señales de color rosa fluorescente se utilizan específicamente
    para la gestión de incidentes para advertir a los conductores sobre accidentes,
    inundaciones u otras situaciones de emergencia temporales.
- id: 201
  category: signs_and_signals
  question: Cuando ve una señal que indica "Ley de Cadenas en Vigor" (Chain Law in
    Effect), ¿qué significa esto para los vehículos de pasajeros en Colorado?
  choices:
    A: Solo los camiones comerciales deben llevar cadenas.
    B: Todos los vehículos deben tener cadenas o dispositivos de tracción alternativos
      en las cuatro llantas.
    C: Los vehículos deben tener neumáticos para nieve, neumáticos para todo clima
      (M+S) o cadenas/dispositivos de tracción según lo especificado por el "Código"
      actual.
    D: La carretera está cerrada a todo el tráfico, excepto a los servicios de emergencia.
  answer: C
  explanation: La Ley de Tracción de Vehículos de Pasajeros de Colorado (Código 15)
    exige que todos los automovilistas tengan una profundidad de banda de rodadura
    de 3/16" y neumáticos para todas las estaciones (M+S), neumáticos de invierno
    o dispositivos de tracción cuando la ley esté activa.
- id: 202
  category: signs_and_signals
  question: 'Una luz de semáforo amarilla fija significa:'
  choices:
    A: Acelerar para despejar la intersección antes de que la luz cambie a rojo.
    B: Detenerse inmediatamente, incluso si se encuentra en medio de la intersección.
    C: La señal se está preparando para cambiar a rojo; despeje la intersección o
      deténgase si puede hacerlo de manera segura.
    D: Los peatones tienen el derecho de paso para entrar en el cruce peatonal.
  answer: C
  explanation: Una luz amarilla fija indica que la señal está cambiando a rojo. La
    ley de Colorado exige que los conductores se detengan si es seguro hacerlo; de
    lo contrario, deben despejar la intersección.
- id: 203
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas sólidas dobles pintadas en el pavimento?
  choices:
    A: Puede cruzar las líneas para rebasar el tráfico más lento.
    B: Separación de carriles que se mueven en direcciones opuestas.
    C: Los cambios de carril están prohibidos.
    D: Se está aproximando a un cruce de ferrocarril.
  answer: C
  explanation: Las líneas blancas sólidas dobles indican que los cambios de carril
    están prohibidos. Estas se ven a menudo cerca de las entradas de túneles o en
    los límites de los carriles expresos (Express Lanes) en Colorado.
- id: 204
  category: signs_and_signals
  question: 'En Colorado, si ve un vehículo de emergencia estacionado con luces intermitentes
    a un lado de una autopista de varios carriles, usted debe:'
  choices:
    A: Detenerse y esperar instrucciones del oficial.
    B: Mantener su velocidad y permanecer en su carril actual.
    C: Cambiarse al menos a un carril de distancia del vehículo si es seguro, o reducir
      la velocidad significativamente.
    D: Encender sus luces altas para alertar a otros conductores.
  answer: C
  explanation: La ley "Move Over" (Hacerse a un lado) de Colorado exige que los conductores
    se cambien de carril al pasar vehículos de emergencia, de remolque o de mantenimiento
    estacionados con luces intermitentes. Si no es posible cambiarse de carril, el
    conductor debe reducir la velocidad.
- id: 205
  category: signs_and_signals
  question: ¿De qué combinación de colores suele ser una señal de "Contramano" (Wrong
    Way)?
  choices:
    A: Amarillo y negro
    B: Blanco y negro
    C: Rojo y blanco
    D: Naranja y negro
  answer: C
  explanation: Las señales reglamentarias que prohíben ciertas acciones, como "Contramano"
    (Wrong Way) o "No Entrar" (Do Not Enter), utilizan un esquema de colores rojo
    y blanco.
- id: 206
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente en una intersección en Colorado?
  choices:
    A: Reducir la velocidad y proceder con precaución.
    B: El semáforo está descompuesto; trátelo como una luz amarilla.
    C: Detenerse por completo y proceder solo cuando sea seguro hacerlo, tratándola
      como una señal de alto (Pare).
    D: Ceder el paso a todo el tráfico que viene de la derecha únicamente.
  answer: C
  explanation: Una luz roja intermitente tiene el mismo significado que una señal
    de alto (Pare). Debe detenerse por completo y ceder el derecho de paso antes de
    continuar.
- id: 207
  category: signs_and_signals
  question: 'Las marcas verdes en el pavimento en algunas áreas urbanas de Colorado
    se utilizan para identificar:'
  choices:
    A: Zonas de carga de vehículos eléctricos.
    B: Carriles para bicicletas o áreas donde se cruzan las trayectorias de bicicletas
      y vehículos.
    C: Zonas de estacionamiento solo para residentes.
    D: Carriles de viaje compartido (carpool) ecológicos.
  answer: B
  explanation: Colorado utiliza marcas verdes en el pavimento para aumentar la visibilidad
    de los carriles para bicicletas y resaltar las posibles áreas de "conflicto" donde
    los automovilistas y ciclistas cruzan sus trayectorias.
- id: 208
  category: signs_and_signals
  question: ¿Qué significa una línea amarilla sólida en su lado de la línea central
    discontinua?
  choices:
    A: Puede rebasar si no hay tráfico en sentido contrario.
    B: Se encuentra en una zona de construcción.
    C: Rebasar está prohibido en su lado.
    D: La carretera más adelante es una calle de un solo sentido.
  answer: C
  explanation: Una línea amarilla sólida en su lado de la línea central indica una
    "zona de no rebasar" para su dirección de viaje.
- id: 209
  category: signs_and_signals
  question: 'Cuando ve un "Carril central compartido para girar" (marcado por líneas
    amarillas sólidas y discontinuas en ambos lados), este carril se puede utilizar
    para:'
  choices:
    A: Rebasar vehículos más lentos.
    B: Hacer giros a la izquierda únicamente.
    C: Hacer giros a la derecha únicamente.
    D: Estacionamiento de emergencia únicamente.
  answer: B
  explanation: Los carriles centrales compartidos para girar están reservados para
    vehículos que realizan giros a la izquierda desde cualquier dirección. No deben
    usarse para rebasar o para circular de paso.
- id: 210
  category: signs_and_signals
  question: 'En Colorado, una señal con fondo naranja y letras o símbolos negros indica:'
  choices:
    A: Advertencia general de peligros en la carretera.
    B: Información reglamentaria.
    C: Zonas de trabajo de construcción o mantenimiento.
    D: Guía direccional hacia parques estatales.
  answer: C
  explanation: El naranja es el color estándar para las señales de zonas de trabajo,
    alertando a los conductores sobre operaciones de construcción, mantenimiento o
    servicios públicos más adelante.
- id: 211
  category: signs_and_signals
  question: ¿Qué significa una señal de flecha amarilla intermitente en una intersección
    de Colorado?
  choices:
    A: Detenerse y esperar una flecha verde
    B: La señal está a punto de cambiar a rojo; despeje la intersección
    C: Se permiten los giros, pero debe ceder el paso al tráfico en sentido contrario
      y a los peatones
    D: Usted tiene el derecho de paso para girar a la izquierda
  answer: C
  explanation: En Colorado, una flecha amarilla intermitente significa que se permiten
    los giros después de ceder el paso al tráfico en sentido contrario y a los peatones.
    El tráfico en sentido contrario tiene luz verde.
- id: 212
  category: signs_and_signals
  question: Según la ley de Colorado, ¿qué significan las líneas amarillas continuas
    dobles en el centro de la carretera?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: Está prohibido rebasar en ambas direcciones
    D: La carretera es de un solo sentido
  answer: C
  explanation: Las líneas amarillas continuas dobles significan que no se permite
    rebasar a los vehículos que viajan en cualquier dirección.
- id: 213
  category: signs_and_signals
  question: En Colorado, ¿cuál es el significado específico de una marca de pavimento
    'sharrow' (un símbolo de bicicleta con dos galones arriba)?
  choices:
    A: Las bicicletas están prohibidas en esta calzada
    B: El carril está reservado exclusivamente para bicicletas
    C: Los automovilistas deben esperar bicicletas y pueden compartir el carril
    D: Las bicicletas deben permanecer en el acotamiento (shoulder)
  answer: C
  explanation: Un 'sharrow' indica una marca de carril compartido, alertando a los
    automovilistas que los ciclistas pueden ocupar el carril completo y ayudando a
    los ciclistas a posicionarse de manera segura.
- id: 214
  category: signs_and_signals
  question: Cuando ve una señal de 'Ley de Tracción' (Código 15) activa en las montañas
    de Colorado, ¿cuál es la profundidad mínima requerida de la banda de rodadura
    para los neumáticos en vehículos de tracción en todas las ruedas?
  choices:
    A: 1/16 de pulgada
    B: 2/32 de pulgada
    C: 3/16 de pulgada
    D: 4/32 de pulgada
  answer: C
  explanation: Bajo la Ley de Tracción de Vehículos de Pasajeros de Colorado, todos
    los vehículos deben tener neumáticos con al menos 3/16 de pulgada de profundidad
    de banda de rodadura cuando la ley está en vigor.
- id: 215
  category: signs_and_signals
  question: En Colorado, ¿qué significa una línea blanca continua pintada en el pavimento
    entre los carriles de tráfico?
  choices:
    A: Se está acercando a una zona escolar
    B: Se desaconsejan o restringen los cambios de carril
    C: La carretera está cambiando de doble sentido a un solo sentido
    D: Debe detenerse por completo
  answer: B
  explanation: Una línea blanca continua indica que se desaconsejan los cambios de
    carril debido a peligros potenciales, aunque no es estrictamente ilegal a menos
    que vaya acompañada de señalización específica o en ciertas zonas.
- id: 216
  category: signs_and_signals
  question: 'En Colorado, una señal amarilla circular con una ''X'' negra y las letras
    ''RR'' es una:'
  choices:
    A: Señal reglamentaria
    B: Señal de advertencia anticipada de cruce de ferrocarril
    C: Señal de contramano (wrong way)
    D: Señal de carretera cerrada
  answer: B
  explanation: La señal amarilla circular con una 'X' negra y 'RR' es la señal de
    advertencia anticipada de que se está acercando a un cruce de ferrocarril.
- id: 217
  category: signs_and_signals
  question: Según el Manual del Conductor de Colorado, ¿cuándo se le permite girar
    a la izquierda con luz roja?
  choices:
    A: Nunca
    B: Solo al girar desde una calle de un solo sentido hacia otra calle de un solo
      sentido
    C: En cualquier momento que no haya tráfico en sentido contrario
    D: Solo si un oficial de policía se lo indica
  answer: B
  explanation: En Colorado, puede girar a la izquierda con luz roja solo cuando gire
    desde una calle de un solo sentido hacia otra calle de un solo sentido, después
    de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 218
  category: signs_and_signals
  question: En Colorado, ¿qué indica un símbolo en forma de diamante pintado en un
    carril?
  choices:
    A: El carril es solo para vehículos de emergencia
    B: El carril está reservado para vehículos de alta ocupación (HOV) o tipos específicos
      de tráfico
    C: El carril terminará pronto
    D: El carril es solo para vehículos de movimiento lento
  answer: B
  explanation: El símbolo de diamante marca carriles restringidos, como los carriles
    HOV para autobuses y vehículos compartidos, o los Carriles Express en Colorado.
- id: 219
  category: signs_and_signals
  question: ¿Cuál es la forma estándar de una señal de advertencia anticipada de zona
    escolar en Colorado?
  choices:
    A: Diamante
    B: Octágono
    C: Pentágono (cinco lados)
    D: Triángulo
  answer: C
  explanation: Las señales de zona escolar y de cruce escolar tienen forma de pentágono
    (cinco lados) y suelen ser de color amarillo-verde fluorescente.
- id: 220
  category: signs_and_signals
  question: ¿Al acercarse a un vehículo de emergencia estacionado con luces intermitentes
    en una autopista de Colorado con al menos dos carriles en cada dirección, qué
    le exige hacer la ley de 'Hacerse a un lado' (Move Over)?
  choices:
    A: Detenerse inmediatamente en su carril
    B: Mantener la velocidad pero tocar la bocina
    C: Cambiarse a un carril que no esté adyacente al vehículo de emergencia si es
      seguro hacerlo
    D: Acelerar para rebasar el vehículo rápidamente
  answer: C
  explanation: La ley de 'Hacerse a un lado' (Move Over) de Colorado exige que los
    conductores se muevan al menos un carril al rebasar vehículos de emergencia, grúas
    o de mantenimiento estacionados. Si no es seguro cambiarse de carril, el conductor
    debe reducir la velocidad significativamente.
- id: 221
  category: signs_and_signals
  question: 'Una luz amarilla intermitente en una intersección significa:'
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Acelerar para despejar la intersección
    C: Proceder con precaución
    D: Tratarla como una señal de alto (Stop)
  answer: C
  explanation: Una luz amarilla intermitente es una advertencia para proceder con
    precaución, indicando generalmente un peligro o una calle transversal que debe
    detenerse.
- id: 222
  category: signs_and_signals
  question: En Colorado, ¿de qué color son las señales reglamentarias que proporcionan
    información sobre los límites de velocidad y el estacionamiento?
  choices:
    A: Amarillas con letras negras
    B: Naranjas con letras negras
    C: Blancas con letras negras
    D: Verdes con letras blancas
  answer: C
  explanation: Las señales reglamentarias, que indican lo que debe o no debe hacer
    (como los límites de velocidad), suelen ser rectangulares y blancas con letras
    negras.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 223
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 224
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 225
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda
    de manera segura.
  id: 226
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 227
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 228
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 229
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permiten vueltas en U
    B: No se permiten vueltas a la izquierda
    C: No se permiten vueltas a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 230
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro que dice "NO PASSING
    ZONE" significa que no se le permite rebasar a otros vehículos en esta área. Marca
    el inicio de una zona de no rebasar.
  id: 231
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "KEEP RIGHT" (Manténgase a la derecha)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 232
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 233
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los venados cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un venado
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 234
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 235
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 236
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras "R" es la
    señal de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca
    la velocidad, mire y escuche si vienen trenes.
  id: 237
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca un tren,
    debe detenerse.
  id: 238
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 239
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 240
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 241
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 242
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una carretera dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 243
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la carretera dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 244
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una carretera dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    carretera dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 245
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: La carretera dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la carretera dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 246
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una carretera dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 247
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 248
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 249
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Prepárese para
    detenerse si la luz está en rojo o amarillo. Esta señal suele colocarse donde
    el semáforo puede no ser visible desde la distancia.
  id: 250
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (yield)
    B: Un semáforo
    C: Una señal de alto (stop) donde debe detenerse
    D: Un reductor de velocidad (tope/resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (stop) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
