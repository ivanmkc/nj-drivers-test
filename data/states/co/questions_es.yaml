questions:
- id: 1
  category: license_system
  question: ¿Qué edad debe tener para operar un vehículo motorizado, una motocicleta
    de baja potencia o un ciclomotor en las calles y autopistas públicas de Colorado?
  choices:
    A: '15'
    B: '16'
    C: '18'
    D: '21'
  answer: B
  explanation: Según el manual, cualquier persona que opere un vehículo motorizado,
    una motocicleta de baja potencia o un ciclomotor en las calles y autopistas públicas
    de Colorado debe tener 16 años o más.
- id: 2
  category: license_system
  question: Si se convierte en residente de Colorado, ¿dentro de cuántos días debe
    obtener una licencia de conducir de Colorado?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Debe obtener una licencia de conducir de Colorado dentro de los 30
    días posteriores a convertirse en residente, a menos que cumpla con excepciones
    específicas militares o de educación.
- id: 3
  category: license_system
  question: ¿Cuál de las siguientes opciones lo establece como residente de Colorado
    para fines de la licencia de conducir?
  choices:
    A: Residir dentro del estado de manera continua durante 90 días
    B: Visitar el estado para unas vacaciones de 2 semanas
    C: Pasar por el estado en un viaje a través del país
    D: Tener un pariente que viva en Colorado
  answer: A
  explanation: Se le considera residente si posee u opera un negocio en Colorado,
    ha residido dentro del estado de manera continua durante 90 días o tiene un empleo
    remunerado dentro del estado.
- id: 4
  category: driver_responsibility
  question: ¿Cuántos días tiene para notificar al DMV si cambia su nombre o dirección?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Si tiene un cambio en su dirección o nombre, debe notificar a la División
    de Vehículos Motorizados (DMV) dentro de los 30 días.
- id: 5
  category: driver_testing
  question: Al planear tomar el examen de conocimientos de conducción (escrito) en
    una oficina del DMV, ¿qué restricción de tiempo debe tener en cuenta?
  choices:
    A: Los exámenes solo se administran por la mañana.
    B: Los exámenes no se administran dentro de los 30 minutos previos a la hora de
      cierre programada de una oficina.
    C: Los exámenes deben completarse en 15 minutos.
    D: Los exámenes solo se administran los fines de semana.
  answer: B
  explanation: Los exámenes escritos no se administran dentro de los 30 minutos previos
    a la hora de cierre programada de una oficina.
- id: 6
  category: license_system
  question: Al conducir con un permiso de instrucción, ¿quién debe estar sentado en
    el asiento del pasajero delantero?
  choices:
    A: Cualquier conductor con licencia de 18 años o más.
    B: Una persona de 21 años o más que tenga una licencia válida de Colorado.
    C: Un padre o tutor, independientemente de si tiene licencia.
    D: Únicamente un instructor de manejo certificado.
  answer: B
  explanation: Cuando conduce con un permiso de instrucción, debe tener a una persona
    de 21 años o más que tenga una licencia válida de Colorado en el asiento del pasajero
    delantero.
- id: 7
  category: driver_testing
  question: ¿Quién administra principalmente el Examen de Habilidades de Conducción
    (examen práctico) en Colorado?
  choices:
    A: Oficinas estatales de licencias de conducir
    B: Escuelas de Conducción Comerciales Certificadas
    C: Departamentos de policía locales
    D: La Patrulla Estatal de Colorado
  answer: B
  explanation: Los exámenes prácticos son administrados principalmente por Escuelas
    de Conducción Comerciales Certificadas, ya que actualmente no se puede programar
    un examen práctico en una oficina estatal de licencias de conducir.
- id: 8
  category: driver_testing
  question: Si usted proporciona el vehículo para su examen práctico, ¿qué documentación
    debe tener el vehículo?
  choices:
    A: Un certificado reciente de la prueba de emisiones
    B: Seguro y registro vigentes
    C: Una factura de venta
    D: Una garantía del fabricante
  answer: B
  explanation: Si proporciona el vehículo para el examen práctico, este debe tener
    seguro y registro vigentes.
- id: 9
  category: driver_testing
  question: ¿Cuál de los siguientes elementos revisa el examinador por seguridad antes
    de que comience un examen práctico?
  choices:
    A: El sistema de aire acondicionado
    B: El volumen del radio
    C: Si las puertas y ventanas del vehículo se abren desde el interior
    D: El nivel de aceite del motor
  answer: C
  explanation: El examinador revisará la seguridad del vehículo, incluyendo si las
    puertas y ventanas del vehículo se abren desde el interior del automóvil.
- id: 10
  category: driver_testing
  question: ¿Quién tiene permitido estar en el vehículo durante un examen práctico?
  choices:
    A: El conductor, el examinador y un familiar
    B: Solo el conductor y el examinador
    C: El conductor, el examinador y un traductor si es necesario
    D: El conductor, el examinador y una mascota de apoyo emocional
  answer: B
  explanation: Por razones de seguridad, solo el conductor y el examinador están permitidos
    en el vehículo durante el examen. No se permiten intérpretes/traductores, familiares,
    amigos ni mascotas.
- id: 11
  category: driver_testing
  question: ¿Qué debe hacer con los dispositivos electrónicos y objetos en su vehículo
    antes de realizar el examen de manejo?
  choices:
    A: Encenderlos para que el examinador pueda probarlos.
    B: Dejarlos como están.
    C: Apagar los dispositivos electrónicos y retirar los objetos del tablero y del
      espejo retrovisor.
    D: Colocar todos los objetos en el asiento del pasajero.
  answer: C
  explanation: Debe apagar cualquier dispositivo electrónico en su vehículo, incluyendo
    el radio y su teléfono celular, y retirar los objetos del tablero y del espejo
    retrovisor antes de realizar el examen de manejo.
- id: 12
  category: driver_testing
  question: Si reprueba el examen de manejo, ¿cuánto tiempo debe esperar antes de
    volver a realizarlo?
  choices:
    A: Puede volver a realizarlo de inmediato.
    B: Hasta el siguiente día hábil.
    C: Una semana completa.
    D: 30 días.
  answer: B
  explanation: Si reprueba el examen de manejo, debe esperar hasta el siguiente día
    hábil antes de volver a realizar el examen.
- id: 13
  category: license_system
  question: ¿Cuál de las siguientes personas está exenta del requisito de obtener
    una licencia de conducir de Colorado dentro de los 30 días posteriores a convertirse
    en residente?
  choices:
    A: Alguien que acaba de comprar una casa en Colorado.
    B: Alguien que comenzó un nuevo trabajo de tiempo completo en Denver.
    C: Alguien que esté prestando servicio activo en las fuerzas armadas de los EE.
      UU.
    D: Alguien que ha vivido en el estado de forma continua durante 90 días.
  answer: C
  explanation: Debe obtener una licencia dentro de los 30 días, a menos que esté prestando
    servicio activo en las fuerzas armadas de los EE. UU., sea dependiente de un miembro
    en servicio activo o resida en Colorado con el propósito principal de continuar
    su educación.
- id: 14
  category: driver_testing
  question: Durante el examen de manejo, ¿qué le pedirá el examinador que haga?
  choices:
    A: Realizar maniobras ilegales para poner a prueba su nivel de alerta.
    B: Demostrar prácticas de conducción legales y seguras.
    C: Conducir por encima del límite de velocidad para probar el control del vehículo.
    D: Responder preguntas escritas mientras conduce.
  answer: B
  explanation: El examen de manejo mide su habilidad y conocimiento de las prácticas
    de conducción legales y seguras. No se le pedirá que haga nada ilegal.
- id: 15
  category: license_system
  question: Según el manual, ¿cuál de los siguientes servicios se puede completar
    utilizando los servicios en línea del DMV?
  choices:
    A: Realizar el examen de habilidades de conducción (examen de manejo).
    B: Pagar una tarifa de restablecimiento.
    C: Obtener una inspección de emisiones del vehículo.
    D: Comprar un vehículo nuevo.
  answer: B
  explanation: La lista de servicios en línea del DMV incluye "Pagar una tarifa de
    restablecimiento" entre otras opciones como renovar una licencia o pagar una citación.
- id: 16
  category: driver_testing
  question: ¿Qué debe hacer si reprueba el examen de manejo?
  choices:
    A: Volver a realizarlo de inmediato
    B: Esperar hasta el siguiente día hábil
    C: Esperar una semana
    D: Completar 6 horas más de capacitación
  answer: B
  explanation: Según el manual, si reprueba el examen de manejo, debe esperar hasta
    el siguiente día hábil antes de volver a realizar el examen.
- id: 17
  category: driver_testing
  question: Al realizar el examen de manejo, ¿cuál es la regla con respecto a las
    cámaras de reversa y las advertencias de punto ciego?
  choices:
    A: Deben estar completamente apagadas.
    B: Están permitidas, pero no reemplazan las habilidades de búsqueda física.
    C: Pueden usarse como un reemplazo total de mirar por encima del hombro.
    D: Solo están permitidas para conductores mayores de 18 años.
  answer: B
  explanation: El manual establece que el uso de tecnologías críticas para la seguridad,
    como las cámaras de reversa y las advertencias de punto ciego, está permitido
    durante el examen, pero no reemplazan las habilidades de búsqueda física.
- id: 18
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe encender la luz direccional antes de girar
    o cambiar de carril en una carretera de 4 carriles?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: C
  explanation: Las luces direccionales deben encenderse continuamente 200 pies antes
    de girar o cambiar de carril en carreteras de 4 carriles.
- id: 19
  category: safe_driving_rules
  question: Cuando se detiene detrás de otro vehículo en una intersección, ¿qué se
    considera una distancia adecuada?
  choices:
    A: La longitud de un automóvil
    B: Cuando puede ver el parachoques trasero del vehículo que está delante de usted
    C: Cuando puede ver las ruedas traseras tocando el suelo del vehículo que está
      delante de usted
    D: 10 pies
  answer: C
  explanation: Se encuentra a una distancia adecuada si puede ver las ruedas traseras
    tocando el suelo del vehículo que está delante de usted.
- id: 20
  category: license_system
  question: Si es menor de 18 años, ¿quién debe firmar la Declaración Jurada de Responsabilidad
    y Tutela (Affidavit of Liability and Guardianship)?
  choices:
    A: Un instructor de manejo
    B: Solo un notario público
    C: Un padre, tutor legal u otro adulto responsable dispuesto a aceptar la responsabilidad
      legal
    D: El director de una escuela
  answer: C
  explanation: La solicitud debe ir acompañada de una Declaración Jurada de Responsabilidad
    firmada por un padre, padrastro, abuelo con poder notarial, tutor legal, cónyuge
    mayor de 18 años o cualquier otro adulto responsable dispuesto a aceptar la responsabilidad
    legal.
- id: 21
  category: license_system
  question: ¿Cuántas horas de experiencia de conducción debe registrar un menor antes
    de solicitar una licencia de conducir?
  choices:
    A: 30 horas (5 por la noche)
    B: 40 horas (10 por la noche)
    C: 50 horas (10 por la noche)
    D: 60 horas (15 por la noche)
  answer: C
  explanation: La ley de Colorado exige que los menores presenten un registro de conducción
    completo y firmado que demuestre 50 horas de experiencia de conducción, de las
    cuales 10 deben haber sido por la noche.
- id: 22
  category: safe_driving_rules
  question: ¿Cuál es la restricción de pasajeros para un conductor menor durante los
    primeros seis meses después de la emisión de su licencia?
  choices:
    A: Ningún pasajero menor de 21 años, a menos que un padre o un adulto con licencia
      esté en el vehículo.
    B: Se permite un pasajero menor de 21 años.
    C: Solo se permiten hermanos en el vehículo.
    D: Tantos pasajeros como cinturones de seguridad haya.
  answer: A
  explanation: Durante los primeros seis meses después de la emisión de su licencia,
    no puede llevar a ningún pasajero menor de 21 años, a menos que un padre u otro
    conductor adulto con licencia esté en el vehículo (con excepciones para hermanos
    y emergencias médicas).
- id: 23
  category: safe_driving_rules
  question: ¿Cuál es el toque de queda de conducción para un conductor con licencia
    durante su primer año?
  choices:
    A: No conducir entre las 10 p.m. y las 6 a.m.
    B: No conducir entre la medianoche y las 5 a.m.
    C: No conducir entre las 11 p.m. y las 5 a.m.
    D: No conducir entre la medianoche y las 6 a.m.
  answer: B
  explanation: Durante su primer año como conductor con licencia, no se permite conducir
    entre la medianoche y las 5 a.m., a menos que esté acompañado por un instructor,
    padre o tutor legal (con ciertas excepciones).
- id: 24
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una razón por la cual su privilegio de conducir
    puede ser suspendido, revocado o cancelado?
  choices:
    A: No pagar una multa de estacionamiento
    B: No pagar la manutención infantil ordenada
    C: Recibir una sola multa por exceso de velocidad de 5 mph sobre el límite
    D: Conducir entre la medianoche y las 5 a.m. después de su primer año de licencia
  answer: B
  explanation: No pagar la manutención infantil ordenada figura explícitamente en
    el manual como una razón por la cual su privilegio de conducir puede ser suspendido,
    revocado o cancelado.
- id: 25
  category: safe_driving_rules
  question: ¿Quién está exento de la ley de cinturones de seguridad de Colorado?
  choices:
    A: Pasajeros del asiento delantero
    B: Niños menores de 16 años
    C: El conductor de una camioneta de reparto mientras está en el trabajo
    D: Conductores en una autopista de 4 carriles
  answer: C
  explanation: Las excepciones a la ley del cinturón de seguridad incluyen al personal
    de emergencia, autobuses de pasajeros/escolares, equipo agrícola, el conductor
    de camionetas de reparto mientras está en el trabajo y cualquier persona con una
    declaración médica por escrito.
- id: 26
  category: safe_driving_rules
  question: ¿Cómo debe asegurarse en un vehículo a un niño menor de 2 años y que pese
    menos de 40 libras?
  choices:
    A: En un sistema de retención infantil orientado hacia adelante en el asiento
      trasero
    B: En un sistema de retención infantil orientado hacia atrás en el asiento trasero
    C: En un asiento elevado (booster seat) en el asiento delantero
    D: Con un cinturón de seguridad estándar en el asiento trasero
  answer: B
  explanation: Los niños menores de 2 años y que pesen menos de 40 libras deben estar
    debidamente asegurados en el asiento trasero del vehículo en un sistema de retención
    infantil orientado hacia atrás.
- id: 27
  category: driver_testing
  question: Durante el examen de conducción, ¿cómo deben estar posicionadas las ruedas
    de su vehículo mientras espera para realizar un giro en una intersección?
  choices:
    A: Apuntando en la dirección del giro
    B: Apuntando hacia adelante hasta comenzar a realizar el giro
    C: Giradas ligeramente hacia la derecha
    D: Giradas ligeramente hacia la izquierda
  answer: B
  explanation: Al detenerse, debe mantener las ruedas del vehículo apuntando hacia
    adelante mientras está detenido, y no girar las ruedas hasta comenzar a realizar
    el giro.
- id: 28
  category: driver_testing
  question: ¿Qué métodos aprobados de control de la dirección se mencionan para el
    manejo del carril durante el examen de conducción?
  choices:
    A: Conducción con una sola mano y conducción con la palma
    B: Mano sobre mano (hand-over-hand) o empujar-tirar-deslizar (push-pull-slide)
    C: Posición de las diez y las dos o de las nueve y las tres
    D: Agarre por debajo y agarre por encima
  answer: B
  explanation: El manual especifica el uso de un método aprobado de control de la
    dirección, que es mano sobre mano o empujar-tirar-deslizar.
- id: 29
  category: penalties_and_points
  question: ¿Qué sucede si la persona que firmó la Declaración Jurada de Responsabilidad
    (Affidavit of Liability) de un menor retira su firma?
  choices:
    A: El menor debe pagar una multa.
    B: El permiso o la licencia del menor será cancelado.
    C: El menor debe completar 12 horas adicionales de conducción.
    D: El menor queda restringido a conducir solo durante las horas del día.
  answer: B
  explanation: Si el firmante decide dejar de aceptar la responsabilidad por su conducción,
    esa persona puede retirar su firma y su permiso/licencia será cancelado.
- id: 30
  category: safe_driving_rules
  question: Al acercarse a una intersección, ¿qué patrón de búsqueda debe utilizar
    antes de entrar?
  choices:
    A: Mirar a la derecha, luego a la izquierda
    B: Mirar solo hacia adelante
    C: Mirar a la izquierda, a la derecha, a la izquierda
    D: Mirar a la derecha, a la izquierda, a la derecha
  answer: C
  explanation: El manual establece bajo el factor de calificación de "Búsqueda" que
    un conductor debe mirar a la izquierda, a la derecha y a la izquierda antes de
    entrar en las intersecciones.
- id: 31
  category: safe_driving_rules
  question: ¿Cuál es el requisito para los niños de entre 9 y 18 años que viajan en
    un vehículo motorizado?
  choices:
    A: Deben viajar en un asiento elevador (booster seat) en la parte trasera del
      vehículo.
    B: Deben estar debidamente sujetos con un cinturón de seguridad o un sistema de
      retención infantil.
    C: Se les permite viajar sin cinturón de seguridad si están en el asiento trasero.
    D: Deben sentarse en el asiento del pasajero delantero con un cinturón de seguridad.
  answer: B
  explanation: El manual establece que los niños de entre 9 y 18 años deben estar
    debidamente sujetos con un cinturón de seguridad o un sistema de retención infantil
    de acuerdo con las instrucciones del fabricante.
- id: 32
  category: safe_driving_rules
  question: Si un conductor es menor de 18 años, ¿cuál es la regla con respecto al
    número de pasajeros permitidos en el vehículo?
  choices:
    A: Pueden llevar tantos pasajeros como quepan cómodamente en el vehículo.
    B: No se les permite llevar ningún pasajero menor de 18 años.
    C: El número de pasajeros no debe exceder el número de cinturones de seguridad.
    D: Pueden llevar hasta tres pasajeros independientemente del número de cinturones
      de seguridad.
  answer: C
  explanation: Según el manual, el número de pasajeros en vehículos conducidos por
    personas menores de 18 años no debe exceder el número de cinturones de seguridad.
- id: 33
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los recipientes
    abiertos en un vehículo motorizado en una vía pública?
  choices:
    A: Es legal poseer un recipiente abierto de marihuana si se tiene una tarjeta
      médica.
    B: Es ilegal poseer un recipiente abierto de alcohol o marihuana en el área de
      pasajeros.
    C: Se permiten recipientes abiertos de alcohol si el nivel de alcohol en sangre
      (BAC) del conductor es inferior al 0.08%.
    D: Los pasajeros pueden poseer recipientes abiertos de alcohol, pero el conductor
      no.
  answer: B
  explanation: El manual establece explícitamente que es ilegal que alguien posea
    un recipiente abierto de alcohol o de marihuana mientras se encuentra en el área
    de pasajeros de un vehículo motorizado que está en una vía pública.
- id: 34
  category: alcohol_drugs_health
  question: Según la ley de Colorado, ¿qué significa conducir con la capacidad disminuida
    (DWAI)?
  choices:
    A: El conductor es sustancialmente incapaz de conducir de forma segura.
    B: La concentración de alcohol en sangre del conductor es exactamente del 0.08%.
    C: El conductor está afectado en el grado más mínimo.
    D: El conductor ha consumido varios tipos de drogas simultáneamente.
  answer: C
  explanation: El manual define DWAI como que el conductor está afectado en el grado
    más mínimo, mientras que DUI significa que el conductor es sustancialmente incapaz
    de conducir de forma segura.
- id: 35
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes factores NO afecta la concentración de alcohol
    en sangre (BAC) de una persona?
  choices:
    A: El peso corporal de la persona
    B: Si el alcohol consumido fue cerveza, vino o licor
    C: La cantidad de tiempo transcurrido desde que se consumió la última bebida
    D: El sexo de la persona
  answer: B
  explanation: 'El manual establece que el BAC de una persona depende de la cantidad
    consumida, el peso corporal, el período de consumo, el tiempo transcurrido desde
    la última bebida y el sexo. Señala explícitamente: ''No hay diferencia si la bebida
    es cerveza, vino o licor''.'
- id: 36
  category: alcohol_drugs_health
  question: En promedio, ¿a qué ritmo disminuye la concentración de alcohol en sangre
    (BAC) de una persona por hora?
  choices:
    A: 0.010%
    B: 0.015%
    C: 0.020%
    D: 0.050%
  answer: B
  explanation: Una vez que el alcohol está en el torrente sanguíneo, el cuerpo lo
    elimina a través de los procesos corporales normales. En promedio, el BAC de una
    persona disminuirá un 0.015% por hora.
- id: 37
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera condena por conducir bajo la influencia
    (DUI) para un conductor de 21 años o más?
  choices:
    A: 8 puntos para la suspensión y de 2 a 180 días de cárcel
    B: 9 meses de revocación de la licencia y de 5 a 365 días de cárcel
    C: 1 año de revocación de la licencia y de 10 a 365 días de cárcel
    D: 2 años de revocación de la licencia y de 60 a 365 días de cárcel
  answer: B
  explanation: Según la Tabla 1, una primera condena por conducir bajo la influencia
    (DUI) conlleva una revocación de 9 meses, una multa de $600 a $1,000, de 5 a 365
    días de cárcel y de 48 a 96 horas de servicio público.
- id: 38
  category: penalties_and_points
  question: ¿Qué sucede si una persona menor de 21 años es condenada por comprar o
    poseer alcohol, incluso si la conducción no es un factor?
  choices:
    A: Reciben una advertencia por la primera infracción.
    B: Deben pagar una multa de $500 pero conservan sus privilegios de conducir.
    C: Están sujetos a la revocación de su privilegio de conducir.
    D: Se les requiere instalar un dispositivo de bloqueo de encendido.
  answer: C
  explanation: 'El manual establece: ''Cualquier persona menor de 21 años que sea
    condenada por comprar o poseer alcohol está sujeta a la revocación de su privilegio
    de conducir, incluso si la conducción no es un factor''.'
- id: 39
  category: alcohol_drugs_health
  question: ¿Es el uso medicinal de la marihuana una defensa válida para un cargo
    de DUI o DWAI?
  choices:
    A: Sí, si el conductor tiene una tarjeta de marihuana medicinal válida.
    B: Sí, pero solo para un cargo de DWAI, no de DUI.
    C: No, el hecho de que la marihuana se haya utilizado con fines medicinales no
      es una defensa.
    D: No, a menos que el nivel de THC del conductor sea inferior a 5 ng/ml.
  answer: C
  explanation: 'El manual establece explícitamente: ''El hecho de que la marihuana
    u otras drogas se hayan utilizado con fines medicinales no es una defensa para
    DUI o DWAI''.'
- id: 40
  category: alcohol_drugs_health
  question: ¿Cuál es la relación entre los niveles de THC en la sangre, el aliento
    o la saliva y el grado de deterioro individual?
  choices:
    A: Los niveles más altos de THC siempre indican un mayor grado de deterioro.
    B: No existe correlación entre los niveles de THC y el grado de deterioro individual.
    C: El deterioro solo está presente si los niveles de THC superan los 5 ng/ml.
    D: Los niveles de THC en la saliva son la medida más precisa del deterioro.
  answer: B
  explanation: El manual señala que, a diferencia del alcohol, 'no existe correlación
    entre los niveles de Delta-9-Tetrahidrocannabinol (THC) en la sangre, el aliento
    o el fluido oral (o muestra de saliva) y el grado de deterioro individual'.
- id: 41
  category: alcohol_drugs_health
  question: ¿A qué nivel de THC en la sangre existe una inferencia permisible de que
    un conductor estaba bajo la influencia (DUI)?
  choices:
    A: 2 nanogramos por mililitro (ng/ml)
    B: 5 nanogramos por mililitro (ng/ml)
    C: 8 nanogramos por mililitro (ng/ml)
    D: 10 nanogramos por mililitro (ng/ml)
  answer: B
  explanation: 'El manual establece: ''Existe una inferencia permisible de que un
    conductor estaba bajo la influencia (DUI) si la sangre del conductor contenía
    5 nanogramos de THC por mililitro (ng/ml) de sangre''.'
- id: 42
  category: alcohol_drugs_health
  question: ¿Qué muestran los datos de Colorado con respecto al deterioro por múltiples
    drogas (polidrogas) en comparación con el deterioro por una sola droga (que no
    sea alcohol)?
  choices:
    A: Es menos común y menos peligroso.
    B: Es más común y más peligroso.
    C: Es igualmente común pero menos peligroso.
    D: Rara vez ocurre en Colorado.
  answer: B
  explanation: Según el manual, 'los datos de Colorado muestran que el deterioro por
    múltiples drogas es más común que el deterioro por cualquier droga individual
    que no sea el alcohol, y también es más peligroso'.
- id: 43
  category: driver_responsibility
  question: Bajo la Ley de Consentimiento Expreso (Express Consent Law) de Colorado,
    ¿qué acepta usted al operar un vehículo motorizado en el estado?
  choices:
    A: Permitir que las fuerzas del orden registren su vehículo sin una orden judicial.
    B: Declararse culpable de cualquier delito de conducción relacionado con el alcohol.
    C: Realizarse una prueba química para determinar la presencia de alcohol y/o drogas
      en su sangre.
    D: Instalar un dispositivo de interbloqueo de encendido si lo detienen por exceso
      de velocidad.
  answer: C
  explanation: Colorado tiene una ley de consentimiento expreso, lo que significa
    que cuando usted opera un vehículo motorizado en el estado, acepta someterse a
    una prueba química para determinar la presencia de alcohol y/o drogas en su sangre.
- id: 44
  category: penalties_and_points
  question: ¿Cuál es la sanción si se niega a realizarse una prueba química cuando
    se sospecha que conduce bajo los efectos del alcohol o drogas?
  choices:
    A: Una suspensión de la licencia por 6 meses y una multa de $500.
    B: Una revocación de la licencia por 1 año y el requisito de instalar un dispositivo
      de interbloqueo de encendido durante dos años.
    C: Una revocación de la licencia por 2 años y 60 días de cárcel.
    D: 8 puntos añadidos a su historial de conducción y 24 horas de servicio público.
  answer: B
  explanation: Si se niega a realizarse la prueba, su licencia de conducir será revocada
    por un año y se le requerirá instalar un dispositivo de interbloqueo de encendido
    en cualquier vehículo motorizado que conduzca durante dos años.
- id: 45
  category: penalties_and_points
  question: ¿Permite la ley de Colorado que un conductor negocie los cargos (plea
    bargain) para evitar una condena por un delito de conducción relacionado con el
    alcohol o las drogas?
  choices:
    A: Sí, solo para un primer delito de DWAI.
    B: Sí, si el nivel de alcohol en sangre (BAC) del conductor era inferior al 0.08%.
    C: No, la ley de Colorado no le permite negociar los cargos para evitar una condena
      por un delito de conducción relacionado con el alcohol o las drogas.
    D: No, a menos que el conductor acepte instalar un dispositivo de interbloqueo
      de encendido.
  answer: C
  explanation: 'El manual establece explícitamente: ''La ley de Colorado no le permite
    negociar los cargos para evitar una condena por un delito de conducción relacionado
    con el alcohol o las drogas''.'
- id: 46
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de auriculares mientras se conduce en Colorado?
  choices:
    A: Puede usar auriculares si el volumen se mantiene bajo.
    B: No puede operar un vehículo motorizado mientras usa auriculares que cubran
      ambos oídos.
    C: Los auriculares están permitidos solo en autopistas.
    D: Puede usar auriculares si están conectados a través de Bluetooth.
  answer: B
  explanation: No puede operar un vehículo motorizado mientras usa auriculares. La
    definición de auriculares incluye cualquier dispositivo o casco que cubra la totalidad
    o una parte de ambos oídos.
- id: 47
  category: defensive_driving
  question: Para prevenir la fatiga al conducir, ¿con qué frecuencia debe interrumpir
    los periodos largos de conducción?
  choices:
    A: En segmentos de una hora
    B: En segmentos de dos horas
    C: En segmentos de tres horas
    D: En segmentos de cuatro horas
  answer: B
  explanation: Divida los periodos largos de conducción en segmentos de dos horas.
    Si siente somnolencia, salga de la carretera y descanse.
- id: 48
  category: driver_responsibility
  question: ¿Qué se identifica como la causa principal del error del conductor?
  choices:
    A: Exceso de velocidad
    B: Conducir bajo la influencia
    C: Distracciones
    D: Malas condiciones climáticas
  answer: C
  explanation: Las distracciones son la causa principal del error del conductor. Una
    distracción es cualquier cosa que desvíe su atención, incluso momentáneamente,
    de la tarea de conducir.
- id: 49
  category: vehicle_information
  question: Si su vehículo rebota, el volante vibra o el vehículo se jala hacia un
    lado, ¿qué debería pedirle a un mecánico que revise?
  choices:
    A: El sistema de escape
    B: El sistema de dirección
    C: El sistema de suspensión
    D: Los neumáticos
  answer: D
  explanation: Si el vehículo rebota, el volante vibra o el vehículo se jala hacia
    un lado, pida a un mecánico que revise sus neumáticos.
- id: 50
  category: vehicle_information
  question: ¿Por qué es particularmente peligroso un sistema de escape con fugas?
  choices:
    A: Reduce significativamente el ahorro de combustible.
    B: Puede hacer que el motor se apague en medio del tráfico pesado.
    C: Los gases de un sistema de escape con fugas pueden causar la muerte en muy
      poco tiempo.
    D: Hace que el vehículo rebote excesivamente.
  answer: C
  explanation: Los gases de un sistema de escape con fugas pueden causar la muerte
    en muy poco tiempo. Nunca encienda el motor en su garaje ni permanezca sentado
    en el automóvil con el motor en marcha sin abrir una ventana.
- id: 51
  category: vehicle_information
  question: ¿Cómo debe colocar la cabeza para ajustar correctamente el espejo lateral
    del pasajero?
  choices:
    A: Contra la ventana lateral izquierda
    B: Centrada debajo del espejo retrovisor interior o justo encima de la consola
      central
    C: Apoyada contra el reposacabezas del asiento del pasajero
    D: Mirando directamente sobre su hombro derecho
  answer: B
  explanation: Para ajustar el espejo lateral del pasajero, coloque la cabeza de modo
    que quede centrada debajo del espejo retrovisor interior o justo encima de la
    consola central. Ajuste el espejo de modo que apenas pueda ver el costado del
    automóvil en la parte derecha del espejo.
- id: 52
  category: vehicle_information
  question: ¿Por qué es importante asegurarse de que no haya objetos sueltos en el
    piso de su vehículo?
  choices:
    A: Pueden rodar debajo del pedal del freno o del acelerador e interferir con una
      conducción segura.
    B: Harán que el vehículo no pase una prueba de emisiones.
    C: Pueden hacer que el sistema de suspensión rebote excesivamente.
    D: Aumentan la distancia de frenado del vehículo.
  answer: A
  explanation: Asegúrese de que no haya objetos en el piso que puedan rodar debajo
    del pedal del freno o del acelerador e interferir con su conducción segura.
- id: 53
  category: safe_driving_rules
  question: Independientemente de la marca y el modelo de su vehículo, ¿dónde debe
    estar su pie derecho antes de arrancar el motor?
  choices:
    A: En el pedal del acelerador
    B: En el piso del vehículo
    C: En el pedal del embrague (clutch)
    D: En el pedal del freno
  answer: D
  explanation: Sin importar la marca y el modelo, su pie derecho debe estar en el
    freno antes de arrancar el vehículo.
- id: 54
  category: safe_driving_rules
  question: Al retroceder (dar marcha atrás), ¿en qué dirección debe girar el volante?
  choices:
    A: En la dirección opuesta a la que desea que se mueva la parte trasera del vehículo
    B: En la dirección en la que desea que se mueva el vehículo
    C: Siempre hacia la derecha
    D: Siempre hacia la izquierda
  answer: B
  explanation: El volante siempre se gira en la dirección en la que desea que se mueva
    el vehículo, ya sea que se mueva hacia adelante o en reversa.
- id: 55
  category: safe_driving_rules
  question: ¿Cuáles son las posiciones recomendadas de las manos en la parte exterior
    del volante para un mejor control del vehículo?
  choices:
    A: Posiciones de las 10 y las 2 o de las 9 y las 3
    B: Posiciones de las 3 y las 9 o de las 4 y las 8
    C: Posiciones de las 12 y las 6
    D: Posiciones de las 11 y la 1
  answer: B
  explanation: Usted tiene un mejor control del vehículo cuando coloca ambas manos
    en la parte exterior del volante, en lados opuestos, en las posiciones de las
    3 y las 9 o en las posiciones de las 4 y las 8.
- id: 56
  category: safe_driving_rules
  question: Al retroceder su vehículo, ¿dónde debe colocar su mano izquierda en el
    volante?
  choices:
    A: En la posición de las 3 en punto
    B: En la posición de las 6 en punto
    C: En la posición de las 9 en punto
    D: En la posición de las 12 en punto
  answer: D
  explanation: 'Para retroceder su vehículo de manera segura, debe: [...] Sujetar
    el volante en la posición de las 12 en punto con su mano izquierda.'
- id: 57
  category: signs_and_signals
  question: Además de las señales y los semáforos, ¿las instrucciones de quién debe
    obedecer para el control del tráfico?
  choices:
    A: Solo de los oficiales de la ley
    B: De la policía, el personal de carreteras o los guardias de cruce escolar
    C: De cualquier peatón en un cruce de peatones
    D: De otros conductores que hagan señales con las manos
  answer: B
  explanation: El control del tráfico también puede ser proporcionado por la policía,
    el personal de carreteras o los guardias de cruce escolar. Usted debe obedecer
    las instrucciones de estas personas.
- id: 58
  category: vehicle_information
  question: ¿Cómo deben ajustarse los reposacabezas de su vehículo?
  choices:
    A: De modo que el reposacabezas toque la base de su cuello
    B: De modo que el reposacabezas toque la parte posterior de su cabeza
    C: De modo que esté al menos dos pulgadas por debajo de la parte superior de su
      cabeza
    D: De modo que esté completamente inclinado hacia atrás
  answer: B
  explanation: 'Reposacabezas: Deben ajustarse de modo que el reposacabezas toque
    la parte posterior de su cabeza.'
- id: 59
  category: safe_driving_rules
  question: Al mover el vehículo hacia adelante, ¿cómo debe presionar el acelerador?
  choices:
    A: Suavemente con el talón del pie en el pedal
    B: Firmemente con los dedos de los pies
    C: Suavemente con la parte anterior de la planta del pie en el pedal y el talón
      en el piso
    D: Con el costado del pie para permitir un frenado rápido
  answer: C
  explanation: Señalice y, si es seguro, presione el acelerador suavemente con la
    parte anterior de la planta del pie en el pedal y el talón del pie en el piso.
- id: 60
  category: signs_and_signals
  question: ¿Qué debe hacer si un semáforo no funciona o está fallando?
  choices:
    A: Continuar con precaución sin detenerse.
    B: Tratar la intersección como una parada de cuatro vías.
    C: Esperar hasta que llegue la policía para dirigir el tráfico.
    D: Tratar la intersección como una señal de ceda el paso.
  answer: B
  explanation: Según el manual, si el semáforo no funciona o está fallando, debe tratar
    la intersección como una parada de cuatro vías (four-way stop).
- id: 61
  category: safe_driving_rules
  question: ¿Bajo qué condición puede girar legalmente a la izquierda con una luz
    roja fija?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de un solo sentido.
    B: Siempre que no haya tráfico en sentido contrario visible.
    C: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido,
      a menos que una señal lo prohíba.
    D: Nunca puede girar a la izquierda con una luz roja fija.
  answer: C
  explanation: 'El manual establece: ''Además, puede girar a la izquierda con luz
    roja si está girando desde una calle de un solo sentido hacia otra calle de un
    solo sentido, a menos que una señal lo prohíba''.'
- id: 62
  category: signs_and_signals
  question: ¿Qué indica una flecha amarilla intermitente para un conductor que gira
    a la izquierda?
  choices:
    A: El conductor tiene el derecho de paso para girar a la izquierda de inmediato.
    B: El conductor debe proceder con precaución y debe ceder el paso al tráfico en
      sentido contrario y a los peatones.
    C: La señal está a punto de cambiar a verde.
    D: El conductor debe detenerse por completo y esperar una flecha verde.
  answer: B
  explanation: Una flecha amarilla intermitente significa que el conductor que gira
    a la izquierda debe proceder con precaución y debe ceder el paso al tráfico en
    sentido contrario y a los peatones.
- id: 63
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de las señales HAWK?
  choices:
    A: Advertir a los conductores de un próximo cruce de ferrocarril.
    B: Indicar el límite de velocidad en una zona escolar.
    C: Permitir que los peatones crucen la calle de manera segura.
    D: Controlar el flujo de tráfico en las rampas de entrada a la autopista.
  answer: C
  explanation: Las señales HAWK (Cruce Peatonal Activado de Alta Intensidad) son señales
    de tráfico que permiten a los peatones cruzar la calle de manera segura operando
    en una secuencia de amarillo y rojo intermitente.
- id: 64
  category: signs_and_signals
  question: ¿Cómo son las señales reglamentarias?
  choices:
    A: Amarillas o verde fluorescente con símbolos negros.
    B: Fondo naranja con letras negras.
    C: Fondo verde con letras blancas.
    D: Negras o rojas sobre un fondo blanco.
  answer: D
  explanation: Las señales reglamentarias le informan sobre las leyes y regulaciones
    que se aplican en un lugar. Son negras o rojas sobre un fondo blanco.
- id: 65
  category: safe_driving_rules
  question: Al cruzar las vías del tren, ¿qué acción debe evitar realizar?
  choices:
    A: Encender sus faros delanteros.
    B: Cambiar de marcha.
    C: Mirar a ambos lados.
    D: Reducir la velocidad.
  answer: B
  explanation: 'El manual advierte explícitamente: ''No cambie de marcha al cruzar
    las vías del tren en caso de que su vehículo se apague''.'
- id: 66
  category: signs_and_signals
  question: ¿Qué información proporciona una señal azul del Sistema de Notificación
    de Emergencia Ferroviaria (ENS)?
  choices:
    A: El horario del tren para ese cruce específico.
    B: Un número de teléfono para reportar problemas y un número del DOT que identifica
      la ubicación.
    C: El límite de velocidad máximo para cruzar las vías.
    D: La distancia al próximo cruce de ferrocarril disponible.
  answer: B
  explanation: Las señales ENS son señales azules en cada cruce a nivel de carretera
    y ferrocarril que proporcionan un número de teléfono para reportar problemas o
    emergencias, junto con un número del DOT que identifica la ubicación exacta.
- id: 67
  category: signs_and_signals
  question: ¿Qué indican las señales de guía con fondo verde?
  choices:
    A: Áreas recreativas, históricas o culturales.
    B: Direcciones a instalaciones de servicio.
    C: Información direccional y de kilometraje hacia destinos específicos.
    D: Zonas de trabajo y trabajadores viales.
  answer: C
  explanation: Las señales de guía tienen un fondo verde y proporcionan información
    direccional y de kilometraje hacia destinos específicos.
- id: 68
  category: sharing_the_road
  question: ¿Qué significa un triángulo naranja reflectante en la parte trasera de
    un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos.
    B: El vehículo está diseñado para viajar a velocidades inferiores a 25 millas
      por hora.
    C: El vehículo es un autobús escolar que realiza paradas frecuentes.
    D: El vehículo es de respuesta a emergencias.
  answer: B
  explanation: Un triángulo naranja reflectante en la parte trasera de un vehículo
    es un marcador de vehículo de movimiento lento, lo que significa que está diseñado
    para viajar a velocidades inferiores a 25 millas por hora.
- id: 69
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por estacionarse ilegalmente en un lugar
    designado para personas con discapacidad sin un cartel o placa?
  choices:
    A: Una advertencia por la primera infracción.
    B: Una multa de $50 y un punto en su licencia.
    C: Un cargo por delito menor, sujeto a una multa de $350 a $5,000, posible tiempo
      en la cárcel y pérdida de los privilegios de conducir.
    D: Solo el remolque de su vehículo.
  answer: C
  explanation: Si se estaciona ilegalmente en un lugar designado para personas con
    discapacidad sin un cartel o placa, podría ser acusado de un delito menor, sujeto
    a una multa de $350 a $5,000, posible tiempo en la cárcel, pérdida de los privilegios
    de conducir y/o el embargo de su automóvil.
- id: 70
  category: sharing_the_road
  question: ¿Bajo qué condición puede cruzar una línea amarilla continua o líneas
    amarillas continuas dobles?
  choices:
    A: Para rebasar a un vehículo motorizado que circula más lento si tiene prisa.
    B: Para rebasar a un ciclista con un espacio mínimo de tres pies cuando el carril
      de circulación contrario esté despejado.
    C: Nunca puede cruzar una línea amarilla continua bajo ninguna circunstancia.
    D: Para estacionarse en el lado opuesto de la carretera.
  answer: B
  explanation: Las líneas amarillas continuas y las líneas amarillas continuas dobles
    prohíben rebasar, a menos que sea para rebasar a un ciclista con un espacio mínimo
    de tres pies cuando el carril de circulación contrario esté despejado.
- id: 71
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas discontinuas en la calzada?
  choices:
    A: Separan el tráfico que se mueve en direcciones opuestas.
    B: Marcan el acotamiento de la calzada.
    C: Separan los carriles de tráfico que se mueven en la misma dirección, y usted
      puede cambiar de carril si es seguro hacerlo.
    D: Indican un área designada solo para ciclistas.
  answer: C
  explanation: Las líneas blancas separan los carriles de tráfico que se mueven en
    la misma dirección. Una línea blanca discontinua significa que puede cambiar de
    carril si es seguro hacerlo.
- id: 72
  category: sharing_the_road
  question: ¿Qué designa la pintura verde en la calzada?
  choices:
    A: Un carril o área designada para ciclistas para aumentar su visibilidad.
    B: Un carril exclusivo para vehículos de alta ocupación (HOV).
    C: Un cruce peatonal en una zona escolar.
    D: Una zona de carga para vehículos comerciales.
  answer: A
  explanation: La pintura verde indica un carril o área en la calzada designada para
    ciclistas y aumenta la visibilidad de los mismos.
- id: 73
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente?
  choices:
    A: El semáforo está a punto de ponerse en verde.
    B: Significa lo mismo que una señal de PARE (STOP); deténgase y luego avance solo
      después de ceder el paso.
    C: Avance con precaución sin detenerse.
    D: Ceda el paso al tráfico de la derecha.
  answer: B
  explanation: Una luz roja intermitente significa lo mismo que una señal de PARE
    (STOP). Deténgase; luego avance solo después de ceder el paso a los peatones y
    al resto del tráfico.
- id: 74
  category: sharing_the_road
  question: ¿Qué informan los "sharrows" (marcas de carril compartido) pintados en
    la calle a los usuarios de la vía?
  choices:
    A: La carretera está cerrada al tráfico de bicicletas.
    B: El carril puede ser demasiado estrecho para que conductores y ciclistas circulen
      uno al lado del otro.
    C: Los ciclistas deben circular por la acera.
    D: Los vehículos se aproximan a una curva cerrada.
  answer: B
  explanation: Algunas calles tienen marcas de carril compartido o "sharrows" pintadas,
    lo que informa a los usuarios de la vía que el carril puede ser demasiado estrecho
    para que conductores y ciclistas circulen uno al lado del otro.
- id: 75
  category: sharing_the_road
  question: ¿Qué indica una marca de pavimento "sharrow"?
  choices:
    A: El carril está reservado exclusivamente para bicicletas.
    B: El carril puede ser demasiado estrecho para que conductores y ciclistas circulen
      uno al lado del otro.
    C: Los conductores deben detenerse y ceder el paso al tráfico que viene en sentido
      contrario.
    D: El carril es una zona de conflicto designada.
  answer: B
  explanation: El manual establece que las marcas de carril compartido o "sharrows"
    informan a los usuarios de la vía que el carril puede ser demasiado estrecho para
    que conductores y ciclistas circulen uno al lado del otro.
- id: 76
  category: safe_driving_rules
  question: Si se aproxima por detrás a un vehículo que está detenido en un cruce
    de peatones, ¿qué debe hacer?
  choices:
    A: Rebasar al vehículo por la derecha si hay suficiente espacio.
    B: Tocar la bocina para alertar a los peatones.
    C: No debe rebasar y debe detenerse detrás del vehículo o antes del cruce de peatones.
    D: Cambiar de carril y cruzar el paso de peatones a baja velocidad.
  answer: C
  explanation: Según el manual, siempre que se aproxime por detrás a un vehículo que
    esté detenido en un cruce de peatones, no debe rebasarlo y debe detenerse detrás
    del vehículo o antes del cruce de peatones en el carril adyacente.
- id: 77
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a un carril
    de giro a la izquierda de dos sentidos (carril de giro central)?
  choices:
    A: Puede utilizarse para rebasar vehículos lentos.
    B: Puede utilizarse como un carril de circulación normal durante las horas pico.
    C: Es para el uso exclusivo de vehículos que giran a la izquierda y no puede utilizarse
      para rebasar.
    D: Puede girar a la izquierda desde cualquier otro carril si el carril de giro
      central está ocupado.
  answer: C
  explanation: El manual especifica que un carril de giro a la izquierda de dos sentidos
    es para el uso exclusivo de vehículos que giran a la izquierda y no debe ser utilizado
    para rebasar o circular, excepto para realizar un giro a la izquierda.
- id: 78
  category: sharing_the_road
  question: ¿Cuál es la regla con respecto a los carriles para bicicletas en las intersecciones?
  choices:
    A: Los carriles para bicicletas terminan en la intersección a menos que las líneas
      pintadas continúen a través de ella.
    B: Un carril para bicicletas se extiende a través de una intersección, independientemente
      de si la pintura lo conecta en ambos lados.
    C: Los conductores pueden estacionarse en un carril para bicicletas en una intersección
      si van a girar a la derecha.
    D: Los ciclistas deben bajarse y caminar con sus bicicletas a través de la intersección.
  answer: B
  explanation: 'El manual establece: "Un carril para bicicletas se extiende a través
    de una intersección, independientemente de si la pintura conecta el carril para
    bicicletas en ambos lados".'
- id: 79
  category: sharing_the_road
  question: Según la ley de Colorado, ¿a quién debe ceder el paso al entrar, salir
    o conducir en una glorieta?
  choices:
    A: Solo a los peatones en el cruce peatonal.
    B: A cualquier vehículo que se aproxime por su derecha.
    C: A un camión, autobús, vehículo de emergencia o vehículo recreativo.
    D: A los vehículos que están entrando en la glorieta al mismo tiempo que usted.
  answer: C
  explanation: Antes de entrar en la glorieta, la ley de Colorado exige que los conductores
    cedan el paso al conductor de un camión, autobús, vehículo de emergencia o vehículo
    recreativo (vehículo grande) al entrar, salir o conducir en una glorieta.
- id: 80
  category: safe_driving_rules
  question: ¿Qué sucede si dos conductores de vehículos grandes entran o conducen
    en una glorieta al mismo tiempo?
  choices:
    A: El conductor de la izquierda debe ceder el paso al conductor de la derecha.
    B: El conductor de la derecha debe ceder el paso al conductor de la izquierda.
    C: Ambos conductores deben detenerse y esperar una señal de tráfico.
    D: El vehículo que circula a mayor velocidad tiene la preferencia de paso.
  answer: B
  explanation: La ley exige que cuando dos conductores de vehículos grandes entren,
    salgan o circulen en una glorieta al mismo tiempo, el conductor de la derecha
    debe ceder el paso al conductor de la izquierda.
- id: 81
  category: signs_and_signals
  question: ¿Cuál es una característica principal de un Intercambio de Diamante Divergente
    (DDI)?
  choices:
    A: Requiere que todos los vehículos se detengan en una glorieta central.
    B: Cruza el tráfico hacia el lado opuesto de la carretera para permitir movimientos
      ininterrumpidos hacia las rampas de la autopista.
    C: Utiliza una serie de paradas en las cuatro direcciones para controlar el tráfico
      de las rampas de entrada a la autopista.
    D: Restringe todos los movimientos de giro a la izquierda hacia la autopista.
  answer: B
  explanation: Un intercambio de diamante divergente cruza el tráfico hacia el lado
    opuesto de la carretera a través de un intercambio para que los vehículos tengan
    movimientos ininterrumpidos hacia las rampas de la autopista, eliminando los conflictos
    típicos de los giros a la izquierda.
- id: 82
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones sobre el derecho de paso es verdadera?
  choices:
    A: Una señal de tráfico en verde le garantiza el derecho de paso.
    B: La ley otorga el derecho de paso al vehículo más grande en una intersección.
    C: La ley establece quién debe ceder el derecho de paso, pero no le otorga el
      derecho de paso a nadie.
    D: Los peatones siempre deben ceder el derecho de paso a los vehículos motorizados.
  answer: C
  explanation: 'El manual establece explícitamente: ''La ley establece quién debe
    ceder el derecho de paso, pero no le otorga el derecho de paso a nadie, incluso
    si su señal de tráfico está en verde''.'
- id: 83
  category: safe_driving_rules
  question: Si dos vehículos llegan a una intersección con parada en las cuatro direcciones
    al mismo tiempo, ¿quién debe ceder el paso?
  choices:
    A: El vehículo de la derecha debe ceder el paso al vehículo de la izquierda.
    B: El vehículo de la izquierda debe ceder el paso al vehículo de la derecha.
    C: El vehículo que viaja más rápido debe ceder el paso.
    D: El vehículo que gira a la derecha debe ceder el paso al vehículo que va recto.
  answer: B
  explanation: Cuando más de un vehículo llega a la intersección al mismo tiempo,
    el vehículo de la izquierda debe ceder el derecho de paso y permitir que el vehículo
    de la derecha pase primero.
- id: 84
  category: defensive_driving
  question: Cuando dos vehículos se encuentran en un camino de montaña empinado y
    estrecho que no es lo suficientemente ancho para ambos, ¿quién tiene el derecho
    de paso?
  choices:
    A: El vehículo que va cuesta abajo debe ceder el paso retrocediendo o deteniéndose.
    B: El vehículo que va cuesta arriba siempre debe retroceder hasta un lugar más
      ancho.
    C: El vehículo más pesado tiene el derecho de paso.
    D: El vehículo que toque la bocina primero tiene el derecho de paso.
  answer: A
  explanation: Cuando los vehículos se encuentran en un camino empinado y estrecho
    que no es lo suficientemente ancho para dos vehículos, el vehículo que va cuesta
    abajo debe ceder el derecho de paso retrocediendo hasta un lugar más ancho o deteniéndose.
- id: 85
  category: safe_driving_rules
  question: ¿Qué debe hacer si un vehículo de emergencia con luces intermitentes y
    una sirena se aproxima mientras usted está en medio de una intersección?
  choices:
    A: Detenerse inmediatamente en medio de la intersección.
    B: Hacerse a un lado en el borde derecho de la intersección y detenerse.
    C: Cruzar la intersección, luego hacerse a un lado en el borde derecho de la carretera
      y detenerse.
    D: Acelerar para despejar la intersección y continuar conduciendo normalmente.
  answer: C
  explanation: 'El manual instruye: ''Si se encuentra en una intersección, cruce la
    intersección y luego hágase a un lado''.'
- id: 86
  category: safe_driving_rules
  question: Si se aproxima a un vehículo de emergencia detenido a un lado de la carretera
    y no puede cambiar de carril, ¿a qué velocidad debe reducir si el límite de velocidad
    indicado es de 45 MPH o menos?
  choices:
    A: 15 MPH
    B: 20 MPH
    C: 25 MPH
    D: 30 MPH
  answer: C
  explanation: Si no puede cambiar de carril para alejarse de un vehículo de emergencia
    detenido, debe reducir la velocidad a 25 MPH si el límite de velocidad indicado
    es de 45 MPH o menos.
- id: 87
  category: safe_driving_rules
  question: Si no puede cambiar de carril al pasar un vehículo de emergencia detenido
    y el límite de velocidad indicado es de 65 MPH, ¿a qué velocidad debe reducir
    su velocidad?
  choices:
    A: 25 MPH
    B: 35 MPH
    C: 45 MPH
    D: 55 MPH
  answer: C
  explanation: Si el límite de velocidad indicado es superior a 45 MPH, debe reducir
    la velocidad a 20 MPH por debajo del límite de velocidad indicado. (65 MPH - 20
    MPH = 45 MPH).
- id: 88
  category: signs_and_signals
  question: ¿Qué indican las líneas discontinuas en un carril para bicicletas o autobuses?
  choices:
    A: Una zona de conflicto donde los conductores y ciclistas cruzarán sus trayectorias.
    B: Un área donde se permite el estacionamiento los fines de semana.
    C: Una zona de adelantamiento designada para vehículos motorizados.
    D: Una zona donde los ciclistas deben bajarse de la bicicleta y caminar.
  answer: A
  explanation: Las zonas de conflicto están marcadas por líneas discontinuas en un
    carril para bicicletas o autobuses que alertan a los conductores y ciclistas de
    que cruzarán sus trayectorias entre sí.
- id: 89
  category: signs_and_signals
  question: ¿Cómo se marcan normalmente los carriles reversibles?
  choices:
    A: Con pintura verde sólida en todo el carril.
    B: Con una sola línea blanca sólida en ambos lados.
    C: Con una barrera o líneas amarillas dobles discontinuas.
    D: Con un diamante blanco pintado en el centro del carril.
  answer: C
  explanation: Los carriles reversibles están separados por una barrera o marcados
    por líneas amarillas dobles discontinuas.
- id: 90
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    cualquier distrito comercial en Colorado?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 40 mph
  answer: B
  explanation: Según el manual, a menos que se indique lo contrario, el límite de
    velocidad en Colorado es de 25 mph en cualquier distrito comercial.
- id: 91
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad predeterminado en carreteras de montaña
    estrechas y sinuosas y en curvas cerradas?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 40 mph
  answer: A
  explanation: El manual establece que, a menos que se indique lo contrario, el límite
    de velocidad es de 20 mph en carreteras de montaña estrechas y sinuosas y en curvas
    cerradas.
- id: 92
  category: sharing_the_road
  question: ¿A qué distancia debe detener su vehículo antes de llegar a un autobús
    escolar que está detenido con sus luces rojas intermitentes?
  choices:
    A: Al menos 10 pies
    B: Al menos 15 pies
    C: Al menos 20 pies
    D: Al menos 50 pies
  answer: C
  explanation: Debe detener su vehículo al menos a 20 pies de distancia antes de llegar
    a un autobús escolar que esté detenido con sus luces rojas intermitentes.
- id: 93
  category: sharing_the_road
  question: ¿Bajo qué condición NO es obligatorio detenerse ante un autobús escolar
    con luces rojas intermitentes?
  choices:
    A: Cuando viaja en la dirección opuesta en una carretera de dos carriles
    B: Cuando hay una mediana u otra barrera física que separa el autobús de su vehículo
    C: Cuando se aproxima al autobús en una intersección
    D: Cuando el autobús está detenido en el lado opuesto de una carretera de cuatro
      carriles sin mediana
  answer: B
  explanation: El manual especifica que no es obligatorio detenerse si hay una mediana
    u otra barrera física que separe el autobús de su vehículo.
- id: 94
  category: sharing_the_road
  question: ¿Cuándo es ilegal rebasar a un quitanieves autorizado?
  choices:
    A: Cuando viaja por debajo del límite de velocidad
    B: Cuando está trabajando en una formación en la que los quitanieves están dispuestos
      en diagonal
    C: Cuando tiene sus luces amarillas intermitentes
    D: Cuando está despejando el arcén derecho de la carretera
  answer: B
  explanation: Es ilegal rebasar a un quitanieves autorizado cuando está trabajando
    en una formación en la que los quitanieves están dispuestos en diagonal.
- id: 95
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por no respetar el límite de velocidad en
    una zona de obras o construcción?
  choices:
    A: Suspensión inmediata de la licencia
    B: Servicio comunitario obligatorio
    C: Multas dobles
    D: Incautación del vehículo
  answer: C
  explanation: El manual establece que no respetar el límite de velocidad en una zona
    de obras o construcción puede resultar en multas dobles.
- id: 96
  category: safe_driving_rules
  question: En áreas urbanas, ¿con cuánta antelación debe señalizar continuamente
    antes de realizar un giro o un cambio de carril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: En áreas urbanas, debe señalizar continuamente durante 100 pies antes
    de realizar un giro o un cambio de carril.
- id: 97
  category: safe_driving_rules
  question: En una carretera de cuatro carriles donde el límite de velocidad indicado
    es superior a 40 mph, ¿con cuánta antelación debe señalizar antes de realizar
    un giro o un cambio de carril?
  choices:
    A: 100 pies
    B: 150 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: En carreteras de cuatro carriles donde el límite de velocidad indicado
    es superior a 40 mph, debe señalizar durante 200 pies antes de realizar un giro
    o un cambio de carril.
- id: 98
  category: defensive_driving
  question: ¿Por qué nunca debe girar las ruedas delanteras hacia la izquierda mientras
    espera para realizar un giro a la izquierda?
  choices:
    A: Causa un desgaste innecesario en su sistema de dirección asistida
    B: Bloquea la vista del tráfico que viene en sentido contrario
    C: Si lo chocan por detrás, sería empujado hacia el tráfico que viene en sentido
      contrario
    D: Es ilegal girar el volante mientras está completamente detenido
  answer: C
  explanation: Nunca gire las ruedas delanteras hacia la izquierda mientras espera
    para girar. Si lo chocan por detrás, sería empujado hacia el tráfico que viene
    en sentido contrario.
- id: 99
  category: safe_driving_rules
  question: Según el Consejo Nacional de Seguridad (National Safety Council), ¿aproximadamente
    cuántos pies tarda en detenerse un automóvil de pasajeros ligero que viaja a 55
    mph?
  choices:
    A: 100 pies
    B: 150 pies
    C: 200 pies
    D: 250 pies
  answer: C
  explanation: Según el Consejo Nacional de Seguridad, un automóvil de pasajeros ligero
    que viaja a 55 mph puede detenerse en unos 200 pies.
- id: 100
  category: sharing_the_road
  question: ¿Cuándo debe ceder el paso a un autobús de tránsito?
  choices:
    A: Siempre que esté detenido en una parada de autobús designada
    B: Cuando esté señalizando para entrar en un carril de tráfico y la señal de ceder
      el paso en la parte trasera del autobús esté iluminada
    C: Solo cuando tenga sus luces rojas intermitentes
    D: Siempre que viaje más lento que el límite de velocidad indicado
  answer: B
  explanation: Debe ceder el paso a un autobús de tránsito si este está señalizando
    para entrar en un carril de tráfico y la señal de ceder el paso en la parte trasera
    del autobús está iluminada.
- id: 101
  category: safe_driving_rules
  question: Si las luces direccionales de su vehículo no funcionan y debe usar señales
    manuales, ¿cuándo debe finalizar la señal manual?
  choices:
    A: Después de haber terminado completamente el giro
    B: A la mitad del giro
    C: Antes de comenzar a girar para que pueda completar el giro con ambas manos
      en el volante
    D: No necesita finalizarla hasta que acelere al límite de velocidad
  answer: C
  explanation: Finalice su señal manual antes de comenzar a girar para que pueda completar
    el giro con ambas manos en el volante.
- id: 102
  category: safe_driving_rules
  question: ¿En qué tipo de vía debe utilizar un giro de tres puntos (three-point
    turnabout)?
  choices:
    A: Una autopista de cuatro carriles
    B: Una vía de dos carriles
    C: Una calle de un solo sentido
    D: Una interestatal urbana
  answer: B
  explanation: El manual establece que solo se debe utilizar un giro de tres puntos
    en una vía de dos carriles.
- id: 103
  category: safe_driving_rules
  question: ¿A qué distancia debe estacionarse de un hidrante de incendios?
  choices:
    A: Al menos 10 pies
    B: Al menos 15 pies
    C: Al menos 20 pies
    D: Al menos 30 pies
  answer: B
  explanation: Según el manual, no puede estacionar un vehículo a menos de 15 pies
    de un hidrante de incendios.
- id: 104
  category: safe_driving_rules
  question: ¿A cuántos pies de una señal de tráfico o de una señal de alto no puede
    estacionar su vehículo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: El manual establece que no se puede estacionar un vehículo a menos
    de 30 pies de una señal de tráfico, una señal de alto o un cruce de ferrocarril.
- id: 105
  category: safe_driving_rules
  question: Al estacionar en paralelo donde esté permitido, ¿a qué distancia del bordillo
    (curb) debe estar su vehículo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Donde se permite el estacionamiento en paralelo, su vehículo debe estar
    a menos de 12 pulgadas del bordillo o lo más cerca posible del borde exterior
    del acotamiento (shoulder).
- id: 106
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar las ruedas delanteras cuando estacione cuesta
    arriba junto a un bordillo?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Recto hacia adelante
    D: Hacia la derecha
  answer: B
  explanation: Cuando se dirija cuesta arriba donde hay un bordillo, debe girar las
    ruedas delanteras en dirección contraria al bordillo y dejar que su vehículo ruede
    hacia atrás lentamente hasta que la parte trasera de la rueda delantera descanse
    contra el bordillo.
- id: 107
  category: safe_driving_rules
  question: Al estacionar cuesta arriba en una carretera sin bordillo, ¿hacia qué
    lado debe girar las ruedas delanteras?
  choices:
    A: Hacia la izquierda
    B: Hacia la derecha
    C: Recto hacia adelante
    D: En dirección contraria al borde de la carretera
  answer: B
  explanation: Cuando se dirija cuesta arriba sin bordillo, gire las ruedas delanteras
    hacia la derecha para que, si su vehículo se mueve, ruede fuera de la autopista
    y no hacia la calzada.
- id: 108
  category: safe_driving_rules
  question: Al entrar en una autopista desde una rampa de entrada, ¿qué debe hacer
    para incorporarse de forma segura?
  choices:
    A: Detenerse al final del carril de aceleración y esperar un espacio
    B: Incorporarse inmediatamente a través de la línea blanca continua
    C: Intentar aumentar su velocidad para igualar el tráfico de la autopista
    D: Conducir por el acotamiento hasta alcanzar el límite de velocidad
  answer: C
  explanation: Al entrar en una autopista desde una rampa de entrada, intente aumentar
    su velocidad para igualar el tráfico de la autopista. No debe incorporarse hasta
    que la línea blanca continua haya terminado y no debe detenerse en el carril de
    aceleración a menos que sea absolutamente necesario.
- id: 109
  category: safe_driving_rules
  question: 'En una autopista, el carril de la extrema izquierda está reservado principalmente
    para:'
  choices:
    A: Tráfico más lento
    B: Rebasar vehículos y giros a la izquierda
    C: Vehículos que salen de la autopista
    D: Solo vehículos de emergencia
  answer: B
  explanation: El carril de rebase (el carril de la extrema izquierda) está reservado
    para rebasar vehículos en carriles que no son de rebase, giros a la izquierda
    y condiciones en las que el volumen de tráfico no permite incorporarse a carriles
    que no son de rebase.
- id: 110
  category: safe_driving_rules
  question: Al salir de una autopista, ¿cuándo debe activar su luz direccional?
  choices:
    A: 50 pies antes del carril de desaceleración
    B: 100 pies antes del carril de desaceleración
    C: 200 pies antes del comienzo del carril de desaceleración
    D: Tan pronto como entre en el carril de desaceleración
  answer: C
  explanation: Al salir de la autopista, active su luz direccional 200 pies antes
    del comienzo del carril de desaceleración.
- id: 111
  category: safe_driving_rules
  question: ¿Al cambiar de carril, cuánto tiempo debe dejar activada la luz direccional
    antes de salir de su carril?
  choices:
    A: Un mínimo de 3 segundos o 200 pies
    B: Un mínimo de 5 segundos o 300 pies
    C: Un mínimo de 2 segundos o 100 pies
    D: Hasta que haya entrado completamente en el nuevo carril
  answer: A
  explanation: Al cambiar de carril, debe activar la luz direccional y dejarla activada
    durante un mínimo de 3 segundos o 200 pies antes de salir de su carril.
- id: 112
  category: defensive_driving
  question: ¿Cuál es la forma correcta de revisar sus puntos ciegos al cambiar de
    carril?
  choices:
    A: Revisar el espejo retrovisor
    B: Revisar los espejos laterales
    C: Mirar por encima del hombro
    D: Activar la luz direccional y esperar a que toquen la bocina
  answer: C
  explanation: Para revisar su punto ciego, que es el área ligeramente hacia atrás
    y al lado de su vehículo que no puede ver en sus espejos, debe mirar por encima
    del hombro.
- id: 113
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿cuándo es seguro volver a su carril anterior?
  choices:
    A: Cuando esté en paralelo con el vehículo
    B: Cuando pueda ver el parachoques delantero del vehículo en su espejo lateral
    C: Cuando pueda ver ambos faros delanteros del vehículo rebasado en su espejo
      retrovisor
    D: Tres segundos después de rebasar al vehículo
  answer: C
  explanation: Cuando pueda ver ambos faros delanteros del vehículo que rebasó en
    el espejo retrovisor, cambie de carril para volver a su carril anterior.
- id: 114
  category: sharing_the_road
  question: ¿Cuánto espacio debe dejar entre su vehículo y un ciclista al rebasarlo?
  choices:
    A: Un mínimo de dos pies
    B: Un mínimo de tres pies
    C: Un mínimo de cuatro pies
    D: Un mínimo de cinco pies
  answer: B
  explanation: Si rebasa a un ciclista, debe dejar un espacio mínimo de tres pies
    entre la parte más externa de su vehículo, incluyendo cualquier saliente como
    espejos o remolques, y el ciclista.
- id: 115
  category: sharing_the_road
  question: Al rebasar a un ciclista, ¿se le permite cruzar una línea amarilla continua?
  choices:
    A: No, siempre es ilegal cruzar una línea amarilla continua
    B: Sí, pero solo si toca la bocina primero
    C: Sí, puede cruzarla brevemente cuando no haya tráfico en sentido contrario y
      tenga una visión clara hacia adelante
    D: Sí, pero solo en zonas de rebase designadas
  answer: C
  explanation: Si rebasa a un ciclista, puede cruzar brevemente una línea amarilla
    continua cuando no haya tráfico en sentido contrario y tenga una visión clara
    hacia adelante.
- id: 116
  category: safe_driving_rules
  question: NO se le permite rebasar a otro vehículo si se encuentra a menos de cuántos
    pies de una intersección o cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: No rebase a menos de 100 pies de una intersección o cruce de ferrocarril.
    Rebasar a menos de 100 pies de estas áreas es ilegal.
- id: 117
  category: safe_driving_rules
  question: Al rebasar, ¿debe ser capaz de regresar de manera segura al lado derecho
    antes de llegar a qué distancia de un vehículo que viene en sentido contrario?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: No rebase si no puede regresar de manera segura al lado derecho antes
    de llegar a menos de 200 pies de un vehículo que viene en sentido contrario, incluyendo
    a un ciclista en el carril o arcén contrario.
- id: 118
  category: safe_driving_rules
  question: Según la ley de Colorado, ¿cuándo es ilegal rebasar a otro vehículo?
  choices:
    A: A menos de 200 pies de una intersección
    B: A menos de 100 pies de cualquier intersección
    C: A menos de 500 pies de un cruce de ferrocarril
    D: Al conducir en una carretera de varios carriles
  answer: B
  explanation: El manual establece que es ilegal rebasar a menos de 100 pies de cualquier
    intersección o cruce de ferrocarril.
- id: 119
  category: defensive_driving
  question: Al conducir por una curva, ¿cuándo debería comenzar a acelerar?
  choices:
    A: Antes de entrar en la curva
    B: Tan pronto como gire el volante
    C: Solo después de llegar a la mitad de la curva
    D: Después de haber salido completamente de la curva
  answer: C
  explanation: El manual aconseja reducir siempre la velocidad antes de entrar en
    una curva y comenzar a acelerar solo después de llegar a la mitad de la curva.
- id: 120
  category: safe_driving_rules
  question: 'La ley de Colorado exige que conduzca con los faros delanteros encendidos
    desde el atardecer hasta el amanecer o cuando la visibilidad sea inferior a:'
  choices:
    A: 500 pies
    B: 1,000 pies
    C: 1,500 pies
    D: 2,000 pies
  answer: B
  explanation: La ley de Colorado exige que conduzca con los faros delanteros encendidos
    desde el atardecer hasta el amanecer o cuando la visibilidad sea inferior a 1,000
    pies.
- id: 121
  category: safe_driving_rules
  question: 'Al seguir a otro vehículo por la noche, debe usar las luces bajas si
    se encuentra a una distancia de:'
  choices:
    A: 100 pies del vehículo que tiene delante
    B: 200 pies del vehículo que tiene delante
    C: 300 pies del vehículo que tiene delante
    D: 500 pies del vehículo que tiene delante
  answer: B
  explanation: Al seguir a otro vehículo, debe usar las luces bajas, con las luces
    antiniebla apagadas, si se encuentra a menos de 200 pies del vehículo que tiene
    delante.
- id: 122
  category: defensive_driving
  question: ¿Qué debe hacer si un automóvil que se aproxima por la noche está usando
    sus luces altas?
  choices:
    A: Hacer cambio de luces repetidamente hasta que bajen las suyas
    B: Mirar directamente a los faros para calcular su distancia
    C: Bajar la vista por debajo del resplandor y usar las líneas laterales pintadas
      para guiar su vehículo
    D: Hacerse a un lado en el acotamiento y detenerse inmediatamente
  answer: C
  explanation: 'El manual establece: "Nunca mire directamente a los faros de un automóvil
    que se aproxima. A medida que el vehículo se acerque, baje la vista por debajo
    del resplandor y use las líneas laterales pintadas para guiar su vehículo".'
- id: 123
  category: defensive_driving
  question: ¿Cuál es una acción recomendada si su vehículo comienza a hidroplanear
    (hydroplane)?
  choices:
    A: Frenar bruscamente para recuperar la tracción de inmediato
    B: Dar un volantazo en la dirección opuesta al derrape
    C: Comenzar a girar lentamente en la dirección en la que está hidroplaneando
    D: Acelerar para que los neumáticos atraviesen el agua estancada
  answer: C
  explanation: Si hidroplanea, debe quitar el pie del acelerador y comenzar a girar
    lentamente en la dirección en la que está hidroplaneando hasta que recupere el
    control.
- id: 124
  category: safe_driving_rules
  question: ¿Qué función del vehículo NO debe usar si la carretera está mojada o con
    hielo?
  choices:
    A: Limpiaparabrisas
    B: Luces bajas
    C: Desempañadores
    D: Control de crucero (cruise control)
  answer: D
  explanation: 'El manual establece explícitamente: "Si la carretera está mojada o
    con hielo, no use el control de crucero".'
- id: 125
  category: sharing_the_road
  question: ¿Cuándo es ilegal rebasar a un quitanieves en Colorado?
  choices:
    A: Siempre que circule por debajo del límite de velocidad indicado
    B: Cuando circula en tándem con otros quitanieves con luces amarillas intermitentes
    C: Cuando está estacionado en el acotamiento con el motor en marcha
    D: Siempre que esté nevando intensamente y la visibilidad sea escasa
  answer: B
  explanation: Es ilegal rebasar a un quitanieves operado por la ciudad, el condado
    o el estado mientras está trabajando con sus luces amarillas intermitentes y circula
    en tándem con uno o más quitanieves.
- id: 126
  category: vehicle_information
  question: ¿Cómo afecta el tener un vehículo con tracción en las 4 ruedas a su distancia
    de frenado en condiciones de conducción estacionales?
  choices:
    A: Pueden detenerse mucho antes que los automóviles convencionales
    B: No pueden detenerse antes que un automóvil convencional
    C: Requieren el doble de distancia de frenado que un automóvil convencional
    D: Evitan por completo el derrape al frenar
  answer: B
  explanation: El manual señala que, si bien los vehículos con tracción en las 4 ruedas
    tienen mayor tracción, no pueden detenerse antes que un automóvil convencional.
- id: 127
  category: vehicle_information
  question: ¿Qué técnica de frenado debe usar en condiciones resbaladizas si su vehículo
    NO tiene frenos antibloqueo (ABS)?
  choices:
    A: Bombear los frenos lo más rápido posible
    B: Frenar bruscamente y mantener el pedal presionado con firmeza
    C: Usar el frenado de umbral (threshold braking) aplicando presión justo antes
      de que se bloqueen los frenos
    D: Aplicar el freno de mano suavemente para reducir la velocidad
  answer: C
  explanation: Si no tiene frenos antibloqueo, debe usar el frenado de umbral (threshold
    braking) cuando derrape o en condiciones resbaladizas, aplicando presión de frenado
    hasta un punto justo antes de que se bloqueen los frenos.
- id: 128
  category: safe_driving_rules
  question: Cuando dos vehículos se encuentran en una carretera de montaña empinada
    donde ninguno puede pasar, ¿qué vehículo tiene el derecho de paso?
  choices:
    A: El vehículo que va cuesta abajo
    B: El vehículo que va cuesta arriba
    C: El vehículo más grande
    D: El vehículo que viaja más rápido
  answer: B
  explanation: Según la sección de conducción en montaña, los vehículos que suben
    tienen el derecho de paso sobre los vehículos que bajan.
- id: 129
  category: defensive_driving
  question: ¿Qué debe hacer para controlar su velocidad al conducir por colinas o
    montañas empinadas?
  choices:
    A: Poner el vehículo en punto muerto (neutral) y dejarse llevar
    B: Pisar los frenos continuamente
    C: Cambiar a marchas (velocidades) más bajas
    D: Apagar el motor
  answer: C
  explanation: El manual aconseja a los conductores cambiar a marchas más bajas para
    controlar la velocidad al conducir por colinas o montañas empinadas.
- id: 130
  category: defensive_driving
  question: ¿Qué es el "washboarding" en los caminos rurales?
  choices:
    A: Un tipo de lluvia intensa que arrastra la superficie de la carretera
    B: Una serie de baches o corrugaciones que pueden afectar la dirección y el control
      del vehículo
    C: Una técnica utilizada para limpiar el lodo de los neumáticos antes de entrar
      en una autopista
    D: Una pintura reflectante utilizada para marcar curvas rurales
  answer: B
  explanation: El "washboarding" (efecto de tabla de lavar) se define en el manual
    como una serie de baches o corrugaciones que pueden afectar la dirección y el
    control del vehículo, y que a menudo se encuentran en caminos de grava.
- id: 131
  category: sharing_the_road
  question: ¿Por qué se recomienda dar a los ciclistas más de los tres pies de distancia
    de rebase requeridos en caminos rurales?
  choices:
    A: Porque los ciclistas tienden a circular por el centro del carril en los caminos
      rurales
    B: Porque los caminos rurales suelen ser más anchos que las calles de la ciudad
    C: Debido a las peligrosas ráfagas de viento que pueden hacer que los vehículos
      golpeen a los ciclistas
    D: Porque los ciclistas están obligados a circular por el arcén sin pavimentar
  answer: C
  explanation: Se recomiendan velocidades más bajas y más de los tres pies de distancia
    de rebase requeridos al adelantar a ciclistas en caminos rurales debido a las
    peligrosas ráfagas de viento que pueden hacer que los vehículos golpeen a los
    ciclistas.
- id: 132
  category: safe_driving_rules
  question: ¿Cuándo debe bajar las luces altas (luces de carretera) ante un vehículo
    que viene en sentido contrario?
  choices:
    A: A menos de 200 pies
    B: A menos de 300 pies
    C: A menos de 500 pies
    D: A menos de 1,000 pies
  answer: C
  explanation: Si conduce con las luces altas encendidas, debe bajarlas antes de estar
    a menos de 500 pies de cualquier vehículo que venga en sentido contrario para
    que el otro conductor no quede cegado por el resplandor.
- id: 133
  category: penalties_and_points
  question: ¿Qué sucede con las multas de tráfico por infracciones cometidas en una
    zona de obras?
  choices:
    A: Se reducen a la mitad
    B: Se duplican
    C: Se triplican
    D: Siguen siendo las mismas que en las carreteras normales
  answer: B
  explanation: Según el manual, al igual que en las zonas escolares, las multas se
    duplican en las zonas de obras para garantizar que los conductores cumplan con
    las señales y las indicaciones.
- id: 134
  category: safe_driving_rules
  question: ¿Cuál es el tipo de choque más común que ocurre en las zonas de obras?
  choices:
    A: Colisiones frontales
    B: Colisiones laterales
    C: Colisiones por alcance (traseras)
    D: Volcamientos
  answer: C
  explanation: El manual establece que la mayoría de los choques en zonas de obras
    son colisiones por alcance debido a un conductor distraído.
- id: 135
  category: safe_driving_rules
  question: Según la ley de Colorado, ¿cuándo es permisible usar un dispositivo móvil
    para enviar mensajes de texto mientras se conduce?
  choices:
    A: Cuando está detenido en un semáforo en rojo
    B: Cuando conduce por una carretera rural sin tráfico
    C: Para contactar a las autoridades policiales, al departamento de bomberos o
      en una emergencia
    D: Para leer un mensaje rápido de un familiar
  answer: C
  explanation: La ley de Colorado prohíbe el uso de dispositivos móviles para enviar
    mensajes de texto mientras se conduce, a menos que sea para contactar a las autoridades
    policiales, al departamento de bomberos o si se trata de una emergencia.
- id: 136
  category: vehicle_information
  question: ¿Cuáles son las posiciones de las manos más efectivas en el volante?
  choices:
    A: Las 10 y las 2
    B: Las 8 y las 4 o las 9 y las 3
    C: Las 12 y las 6
    D: Una mano a las 12
  answer: B
  explanation: El manual establece que las posiciones de las manos más efectivas en
    el volante son las 8 y las 4 o las 9 y las 3.
- id: 137
  category: vehicle_information
  question: ¿Cuál de las siguientes es una técnica de dirección incorrecta y potencialmente
    peligrosa al realizar un giro?
  choices:
    A: Usar el método de mano sobre mano
    B: Usar el método de empujar-tirar-deslizar
    C: Girar el volante con la palma de la mano
    D: Mantener ambas manos en el volante
  answer: C
  explanation: 'El manual advierte específicamente a los conductores: ''No gire el
    volante con la palma de la mano ni deje que se deslice entre sus dedos después
    de realizar un giro''.'
- id: 138
  category: defensive_driving
  question: ¿Hacia dónde debe mirar al girar, conducir a través de o entrar en una
    intersección?
  choices:
    A: Mirar a la derecha, luego a la izquierda
    B: Mirar a la izquierda, a la derecha y luego a la izquierda de nuevo
    C: Mirar solo hacia adelante
    D: Mirar a la izquierda, luego de frente
  answer: B
  explanation: Para escanear correctamente, siempre debe mirar a la izquierda, a la
    derecha y luego a la izquierda de nuevo al girar, conducir a través de o entrar
    en una intersección.
- id: 139
  category: defensive_driving
  question: ¿Con cuánta anticipación debe mirar hacia adelante en la carretera para
    evitar frenazos de último minuto o giros bruscos?
  choices:
    A: Al menos 3 segundos adelante
    B: Al menos 5 segundos adelante
    C: Al menos 10 segundos adelante
    D: Al menos 15 segundos adelante
  answer: C
  explanation: Para evitar frenazos de último minuto o la necesidad de girar bruscamente,
    debe mirar hacia adelante en la carretera al menos 10 segundos por delante de
    su vehículo.
- id: 140
  category: defensive_driving
  question: ¿Con qué frecuencia debe revisar el tráfico detrás de usted en su espejo
    retrovisor?
  choices:
    A: Cada 2 a 3 segundos
    B: Cada 5 a 8 segundos
    C: Cada 10 a 15 segundos
    D: Solo cuando se esté preparando para cambiar de carril
  answer: B
  explanation: Debe revisar el tráfico detrás de usted en su espejo retrovisor cada
    5 a 8 segundos para saber si alguien lo sigue demasiado de cerca o se acerca demasiado
    rápido.
- id: 141
  category: safe_driving_rules
  question: ¿Qué regla debe utilizar para calcular cuánto espacio dejar entre su vehículo
    y el vehículo que tiene delante en condiciones normales?
  choices:
    A: La regla de los dos segundos
    B: La regla de los tres segundos
    C: La regla de los cuatro segundos
    D: La regla de un largo de vehículo por cada 10 mph
  answer: B
  explanation: En condiciones normales, utilice la regla de los tres segundos para
    calcular cuánto espacio debe dejar entre su vehículo y el vehículo que tiene delante.
- id: 142
  category: defensive_driving
  question: ¿Por qué es peligroso conducir considerablemente más lento que otros vehículos
    en la carretera?
  choices:
    A: Siempre es la forma más segura de conducir
    B: Ahorra combustible y reduce el desgaste del vehículo
    C: Puede aumentar la imprevisibilidad y causar embotellamientos y más situaciones
      de rebase
    D: Evita colisiones por alcance en tráfico pesado
  answer: C
  explanation: Conducir considerablemente más lento que otros vehículos puede aumentar
    la imprevisibilidad y comprometer la seguridad al causar embotellamientos y más
    situaciones de rebase.
- id: 143
  category: safe_driving_rules
  question: ¿Cuál es la forma correcta de realizar una incorporación en cremallera
    (Zipper Merge) cuando hay un carril cerrado más adelante?
  choices:
    A: Incorporarse lo antes posible y esperar en el carril abierto
    B: Conducir por ambos carriles por igual y turnarse para ocupar el carril abierto
      justo antes del punto de cierre
    C: Acelerar para rebasar a todos los vehículos antes de que se cierre el carril
    D: Detenerse en el carril que se cierra hasta que alguien le deje pasar
  answer: B
  explanation: Cuando hay un carril cerrado más adelante, los conductores deben continuar
    conduciendo por ambos carriles por igual. Justo antes de que termine el carril,
    los autos deben turnarse para ocupar el carril abierto con cuidado, al estilo
    de una cremallera.
- id: 144
  category: safe_driving_rules
  question: ¿Cuáles de los siguientes lugares se consideran 'Zonas Lentas' (Slow Zones)
    que requieren velocidades más bajas y mayor atención?
  choices:
    A: Autopistas interestatales y carriles de rebase
    B: Caminos rurales abiertos y vías expresas
    C: Plazas de peaje, puentes estrechos y calles residenciales
    D: Puntos de incorporación y rampas de entrada
  answer: C
  explanation: Las Zonas Lentas son lugares donde se congregan personas o tráfico
    que requieren velocidades más bajas, incluyendo centros comerciales, escuelas,
    puentes estrechos, plazas de peaje y calles residenciales.
- id: 145
  category: driver_responsibility
  question: ¿Qué debe hacer con la iluminación de su vehículo si la policía lo detiene
    por la noche?
  choices:
    A: Apagar todas las luces para evitar cegar al oficial
    B: Encender las luces altas
    C: Encender las luces interiores para ayudar con la visibilidad
    D: Encender las luces de emergencia continuamente
  answer: C
  explanation: Cuando lo detengan por la noche, debe encender las luces interiores
    para ayudar con la visibilidad del oficial.
- id: 146
  category: driver_responsibility
  question: Si tiene un arma en el vehículo cuando la policía lo detiene, ¿cuál es
    el protocolo correcto?
  choices:
    A: Entregar el arma al oficial inmediatamente
    B: Esconder el arma debajo del asiento antes de que el oficial se acerque
    C: Informar al oficial en el primer contacto, pero no intente alcanzarla ni entregársela
    D: Colocar el arma en el tablero donde sea claramente visible
  answer: C
  explanation: Debe informar al oficial si tiene un arma en el vehículo en el primer
    contacto, pero no intente alcanzarla ni intente entregársela al oficial.
- id: 147
  category: driver_responsibility
  question: Cuando un oficial lo detiene, ¿cuándo debe buscar su licencia de conducir
    o los documentos del vehículo?
  choices:
    A: Tenerlos listos en la mano antes de que el oficial se acerque a la ventana
    B: Buscarlos tan pronto como detenga su vehículo para ahorrar tiempo
    C: Esperar las instrucciones del oficial antes de buscar sus documentos
    D: Salir del vehículo para sacarlos del maletero o del asiento trasero
  answer: C
  explanation: Durante una parada de tráfico, debe esperar las instrucciones del oficial
    antes de buscar su licencia de conducir o los documentos del vehículo.
- id: 148
  category: driver_responsibility
  question: Durante una parada de tráfico, ¿qué puede suceder si se niega a firmar
    una multa de tráfico?
  choices:
    A: Su licencia será revocada inmediatamente.
    B: Puede resultar en su arresto.
    C: Admite legalmente su culpabilidad por la infracción.
    D: El oficial está obligado a emitir una advertencia en su lugar.
  answer: B
  explanation: Según el manual, su aceptación y firma en una multa de tráfico no es
    una admisión de culpabilidad; sin embargo, la negativa a firmar una multa de tráfico
    puede resultar en su arresto.
- id: 149
  category: sharing_the_road
  question: ¿Bajo qué condición se le permite a una motocicleta de dos ruedas realizar
    el filtrado de carriles (lane filtering)?
  choices:
    A: A velocidades de hasta 25 mph cuando el tráfico se mueve lentamente.
    B: Solo en autopistas con un límite de velocidad publicado de más de 55 mph.
    C: A una velocidad no mayor a 15 mph cuando los vehículos circundantes están detenidos.
    D: Al circular a través del tráfico en movimiento en el carril izquierdo.
  answer: C
  explanation: Una motocicleta de dos ruedas puede rebasar a otros vehículos motorizados
    detenidos en el mismo carril (filtrado de carriles) si hay suficiente espacio
    para pasar de manera segura a una velocidad no mayor a 15 millas por hora.
- id: 150
  category: sharing_the_road
  question: Al rebasar un camión grande o un autobús, ¿cuándo es seguro volver al
    carril delante de él?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del camión.
    B: Cuando pueda ver al conductor en su espejo lateral.
    C: Cuando pueda ver ambos faros delanteros del vehículo en su espejo retrovisor.
    D: Después de haber señalizado su intención durante al menos 3 segundos.
  answer: C
  explanation: Debido a que los camiones requieren distancias más largas para frenar,
    no debe colocarse delante de un camión o autobús hasta que pueda ver ambos faros
    delanteros del vehículo en su espejo retrovisor.
- id: 151
  category: sharing_the_road
  question: ¿Por qué es importante permanecer detrás de las barras de parada pintadas
    de blanco en las señales de alto y los semáforos?
  choices:
    A: Para evitar bloquear los cruces peatonales.
    B: Porque están cuidadosamente medidas para dar a los camiones el espacio que
      necesitan para girar.
    C: Para activar los sensores magnéticos del semáforo en la carretera.
    D: Porque es ilegal tocar la línea blanca con los neumáticos delanteros.
  answer: B
  explanation: Debe permanecer detrás de las barras de parada pintadas de blanco porque
    muchas están cuidadosamente medidas para dar a los camiones el espacio que necesitan
    para girar.
- id: 152
  category: sharing_the_road
  question: ¿Cuál es una señal común de un camión o autobús fuera de control?
  choices:
    A: Luces de emergencia parpadeantes y bocinazos.
    B: El vehículo desviándose entre varios carriles.
    C: Humo saliendo de los frenos.
    D: El conductor agitando el brazo por la ventana.
  answer: C
  explanation: El manual establece que una señal de un camión o autobús fuera de control
    es el humo que sale de los frenos.
- id: 153
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso cuando un autobús comercial sale de un
    lugar de parada y se incorpora al tráfico?
  choices:
    A: Los vehículos que ya circulan por el carril de tráfico.
    B: El autobús.
    C: Los peatones que esperan para cruzar la calle.
    D: Cualquier vehículo que se mueva a una velocidad mayor.
  answer: B
  explanation: Los autobuses tienen el derecho de paso al salir de un lugar de parada
    e incorporarse al tráfico.
- id: 154
  category: safe_driving_rules
  question: ¿A qué distancia debe detenerse de un autobús escolar que tiene sus luces
    rojas parpadeando y el brazo de parada extendido?
  choices:
    A: A no menos de 10 pies del parachoques delantero o trasero.
    B: A no menos de 15 pies del parachoques delantero o trasero.
    C: A no menos de 20 pies del parachoques delantero o trasero.
    D: A no menos de 50 pies del parachoques delantero o trasero.
  answer: C
  explanation: Los vehículos deben detenerse a no menos de 20 pies del parachoques
    delantero o trasero del autobús escolar cuando sus luces rojas están parpadeando.
- id: 155
  category: safe_driving_rules
  question: Si viaja en la dirección opuesta a un autobús escolar detenido en una
    carretera dividida con una mediana que separa el tráfico, ¿qué debe hacer?
  choices:
    A: Detenerse hasta que las luces rojas dejen de parpadear.
    B: Reducir la velocidad a 10 mph y proceder con precaución.
    C: No está legalmente obligado a detenerse.
    D: Detenerse, ceder el paso a los peatones y luego continuar.
  answer: C
  explanation: Si viaja en una carretera dividida con cuatro o más carriles y una
    mediana, solo los vehículos que viajan en ambos carriles detrás del autobús escolar
    deben detenerse, no el tráfico que viaja en la dirección opuesta.
- id: 156
  category: safe_driving_rules
  question: ¿Qué significa cuando un autobús escolar activa sus luces amarillas de
    advertencia superiores?
  choices:
    A: El autobús está experimentando una falla mecánica.
    B: El autobús está a punto de detenerse para subir o bajar niños.
    C: El autobús está acelerando para incorporarse a un tráfico denso.
    D: El autobús se está preparando para dar marcha atrás.
  answer: B
  explanation: Cuando un autobús escolar está a punto de detenerse para subir o bajar
    niños, el conductor del autobús activa las luces de advertencia de color ámbar
    (amarillo).
- id: 157
  category: safe_driving_rules
  question: ¿Qué debe hacer inmediatamente si su vehículo se apaga en un cruce de
    ferrocarril?
  choices:
    A: Permanecer en el vehículo y llamar al 911.
    B: Intentar empujar el vehículo fuera de las vías usted mismo.
    C: Hacer que todos salgan y se alejen lo más posible.
    D: Esperar en el vehículo hasta que vea que se acerca un tren, luego salir.
  answer: C
  explanation: Si su vehículo se apaga en un cruce, haga que todos salgan e inmediatamente
    aléjense lo más posible, incluso si no ve que se acerque un tren.
- id: 158
  category: safe_driving_rules
  question: ¿Aproximadamente cuánto tiempo le toma detenerse a un tren de carga promedio
    que viaja a 55 mph?
  choices:
    A: Aproximadamente media milla.
    B: Aproximadamente una milla.
    C: Aproximadamente dos millas.
    D: Aproximadamente 500 pies.
  answer: B
  explanation: El tren de carga promedio que viaja a 55 mph requiere aproximadamente
    una milla para detenerse.
- id: 159
  category: signs_and_signals
  question: ¿Cuál de las siguientes es la única señal de tráfico redonda?
  choices:
    A: Una señal de alto.
    B: Una señal de ceda el paso.
    C: Una señal de advertencia anticipada de ferrocarril.
    D: Una señal de cruce de ferrocarril (crossbuck).
  answer: C
  explanation: La señal de advertencia anticipada de ferrocarril es la única señal
    de tráfico redonda.
- id: 160
  category: signs_and_signals
  question: Si no hay una línea de parada pintada visible en un cruce de ferrocarril,
    ¿a qué distancia de las vías debe detenerse?
  choices:
    A: Al menos 5 pies.
    B: Al menos 10 pies.
    C: Al menos 15 pies.
    D: Al menos 20 pies.
  answer: B
  explanation: Si no hay ninguna línea visible, debe estar al menos a 10 pies de las
    vías, ya que los trenes sobresalen de las vías por 3 pies.
- id: 161
  category: signs_and_signals
  question: ¿Cómo debe tratar un conductor una señal de cruce de ferrocarril (crossbuck)?
  choices:
    A: Igual que una señal de alto.
    B: Igual que una señal de ceda el paso.
    C: Igual que una señal de límite de velocidad.
    D: Igual que una señal de advertencia para acelerar.
  answer: B
  explanation: Las señales de cruce de ferrocarril (crossbuck) deben tratarse de la
    misma manera que una señal de ceda el paso.
- id: 162
  category: signs_and_signals
  question: ¿De qué color es la señal del Sistema de Notificación de Emergencias (ENS)
    ubicada en los cruces ferroviarios a nivel en carreteras públicas?
  choices:
    A: Rojo
    B: Amarillo
    C: Verde
    D: Azul
  answer: D
  explanation: Todos los cruces ferroviarios a nivel en carreteras públicas tienen
    señales del Sistema de Notificación de Emergencias (ENS) de color AZUL que proporcionan
    un número de teléfono para llamar en caso de emergencia.
- id: 163
  category: sharing_the_road
  question: ¿Qué información en una señal del Sistema de Notificación de Emergencias
    (ENS) ayuda al despachador del ferrocarril a saber exactamente dónde se encuentra
    un cruce?
  choices:
    A: El marcador de milla de la carretera más cercana
    B: El número de cruce del DOT (X-ING)
    C: El código postal local
    D: Las coordenadas GPS del cruce
  answer: B
  explanation: Al proporcionar el número de cruce del DOT (X-ING) ubicado en la señal,
    el despachador del ferrocarril sabe exactamente dónde está el cruce y puede notificar
    rápidamente a los trenes.
- id: 164
  category: sharing_the_road
  question: ¿Aproximadamente cuánto pesa un Vehículo de Tren Ligero (LRV)?
  choices:
    A: Hasta 10 toneladas
    B: Hasta 20 toneladas
    C: Hasta 30 toneladas
    D: Hasta 40 toneladas
  answer: D
  explanation: El manual establece que cada vagón de tren ligero pesa hasta 40 toneladas
    y no puede detenerse rápidamente.
- id: 165
  category: vehicle_information
  question: ¿Cuál es la altura estándar de los cables aéreos sobre el centro de las
    vías del tren ligero?
  choices:
    A: 15 pies
    B: 16 pies, 6 pulgadas
    C: 18 pies, 6 pulgadas
    D: 20 pies
  answer: C
  explanation: Tenga en cuenta la altura de su vehículo. Los cables aéreos tienen
    una altura estándar de 18 pies y 6 pulgadas sobre el centro de las vías.
- id: 166
  category: sharing_the_road
  question: 'Al rebasar a un ciclista, la ley de Colorado exige que los automovilistas
    mantengan una distancia mínima de paso de:'
  choices:
    A: Dos pies
    B: Tres pies
    C: Cuatro pies
    D: Cinco pies
  answer: B
  explanation: Al rebasar ciclistas, los automovilistas deben dejar un mínimo de tres
    pies de distancia desde la parte más externa de su vehículo o cualquier accesorio.
- id: 167
  category: safe_driving_rules
  question: ¿Es legal que un automovilista cruce una línea amarilla doble para rebasar
    a un ciclista?
  choices:
    A: No, nunca es legal cruzar una línea amarilla doble.
    B: Sí, pero solo si el ciclista le indica que pase.
    C: Sí, si no hay tráfico en sentido contrario y es necesario para proporcionar
      el mínimo de tres pies de distancia de paso.
    D: No, a menos que esté conduciendo un vehículo de emergencia autorizado.
  answer: C
  explanation: Es legal cruzar una línea amarilla doble cuando no hay tráfico en sentido
    contrario si es necesario para proporcionar el mínimo de tres pies de distancia
    de paso.
- id: 168
  category: sharing_the_road
  question: ¿Bajo qué condición se permite a los ciclistas circular uno al lado del
    otro en la calzada?
  choices:
    A: Solo cuando circulan en un carril para bicicletas designado
    B: Solo en vecindarios residenciales
    C: Si no impiden el movimiento normal y razonable del tráfico
    D: A los ciclistas nunca se les permite circular uno al lado del otro
  answer: C
  explanation: Los ciclistas pueden circular uno al lado del otro si no impiden el
    movimiento normal y razonable del tráfico. Esto puede ayudarles a ser más visibles
    para los conductores.
- id: 169
  category: safe_driving_rules
  question: ¿Cuándo se le permite a un automovilista conducir a través de un carril
    para bicicletas designado?
  choices:
    A: Nunca
    B: Al rebasar a un vehículo motorizado más lento
    C: Al girar, entrar o salir de otra carretera, entrada privada o callejón
    D: Siempre que el carril de circulación principal esté congestionado
  answer: C
  explanation: No se detenga, estacione ni conduzca en un sendero o carril designado
    para bicicletas. Sin embargo, puede cruzar un carril para bicicletas al girar,
    entrar o salir de otra carretera, entrada privada o callejón.
- id: 170
  category: sharing_the_road
  question: Según una ley de Colorado de 2022, ¿cómo pueden los ciclistas de 15 años
    o más tratar las señales de alto cuando la intersección está despejada?
  choices:
    A: Como señales de ceda el paso
    B: Como luces verdes
    C: Deben detenerse por completo durante al menos 3 segundos
    D: Como cruces peatonales
  answer: A
  explanation: Una nueva ley aprobada en 2022 establece que cuando una intersección
    está despejada y un ciclista ya tiene el derecho de paso, los ciclistas de 15
    años o más pueden tratar las señales de alto como señales de ceda el paso.
- id: 171
  category: defensive_driving
  question: ¿Cuál es el propósito del comportamiento comúnmente conocido como el 'Dutch
    Reach' (Alcance Holandés)?
  choices:
    A: Maniobrar de forma segura para salir de un derrape en carreteras mojadas
    B: Usar la mano más alejada de la puerta para abrirla, lo que ayuda a verificar
      si vienen ciclistas
    C: Asegurar la carga en el techo de un vehículo
    D: Señalizar un giro cuando las luces direccionales de un vehículo fallan
  answer: B
  explanation: Cuando esté estacionado en la calle, use la mano más alejada de la
    puerta (la más cercana al centro del vehículo) para abrirla, un comportamiento
    conocido como 'Dutch Reach', para verificar si hay ciclistas antes de abrir la
    puerta.
- id: 172
  category: sharing_the_road
  question: ¿Cómo debe un ciclista usar las señales manuales para indicar un giro
    a la derecha?
  choices:
    A: Extender el brazo izquierdo directamente hacia la izquierda
    B: Bajar el brazo izquierdo hacia abajo a la altura del codo
    C: Extender el brazo derecho recto hacia afuera o el brazo izquierdo hacia arriba
      en ángulo recto
    D: Mover la mano derecha en movimiento circular
  answer: C
  explanation: Para un giro a la derecha, un ciclista debe extender el brazo derecho
    recto hacia afuera o el brazo izquierdo hacia arriba en ángulo recto.
- id: 173
  category: sharing_the_road
  question: ¿Por qué un ciclista podría elegir legalmente circular por el centro del
    carril de circulación en lugar de por el extremo derecho?
  choices:
    A: Para retrasar intencionalmente el tráfico de vehículos motorizados
    B: Para evitar obstáculos como la zona de apertura de puertas de autos estacionados,
      vidrios rotos o rejillas de drenaje
    C: Porque tienen prohibido usar los carriles para bicicletas designados
    D: Para prepararse para un giro en U repentino en medio de la cuadra
  answer: B
  explanation: Los ciclistas pueden optar por circular en el centro del carril de
    circulación en carreteras estrechas o para evitar obstáculos como la zona de apertura
    de puertas de autos estacionados, vidrios rotos o rejillas de drenaje.
- id: 174
  category: sharing_the_road
  question: En una calle de sentido único con varios carriles, ¿por dónde se le permite
    circular a un ciclista?
  choices:
    A: Solo en el lado derecho de la calzada
    B: Solo en el lado izquierdo de la calzada
    C: Ya sea en el lado derecho o en el izquierdo de la calzada
    D: Solo en el carril central
  answer: C
  explanation: En una calle de sentido único con varios carriles, sepa que un ciclista
    puede circular tanto por el lado derecho como por el izquierdo de la calzada.
- id: 175
  category: defensive_driving
  question: ¿Por qué los conductores deben evitar tocar la bocina cerca de los ciclistas
    a menos que haya un riesgo inmediato de choque?
  choices:
    A: Es ilegal usar la bocina dentro de los límites de la ciudad
    B: Usar la bocina puede asustar a un ciclista y provocar que choque
    C: Agotará la batería del vehículo innecesariamente
    D: Los ciclistas no pueden oír las bocinas debido al ruido del tráfico
  answer: B
  explanation: Evite tocar la bocina cerca de los ciclistas a menos que haya un riesgo
    inmediato de choque. El uso de la bocina puede asustar al ciclista y provocar
    que pierda el control o choque.
- id: 176
  category: penalties_and_points
  question: Obligar a un ciclista a salirse de la carretera tiene consecuencias legales
    y ¿qué infracción constituye?
  choices:
    A: Conducción descuidada
    B: Conducción agresiva
    C: Una infracción de tráfico menor
    D: Conducción defensiva
  answer: B
  explanation: No obligue a un ciclista a salirse de la carretera; esto constituye
    conducción agresiva y tiene consecuencias legales.
- id: 177
  category: sharing_the_road
  question: ¿Qué señal manual debe usar un ciclista para indicar que está disminuyendo
    la velocidad o deteniéndose?
  choices:
    A: Extender el brazo izquierdo directamente hacia la izquierda.
    B: Extender el brazo derecho recto hacia afuera.
    C: Extender el brazo izquierdo hacia arriba en ángulo recto.
    D: Bajar el brazo izquierdo hacia abajo a la altura del codo.
  answer: D
  explanation: De acuerdo con el manual, si un ciclista está disminuyendo la velocidad
    o deteniéndose, bajará el brazo izquierdo hacia abajo a la altura del codo.
- id: 178
  category: sharing_the_road
  question: Bajo la ley de filtrado de carriles de Colorado, ¿cuál es la velocidad
    máxima a la que puede circular una motocicleta de dos ruedas mientras rebasa vehículos
    motorizados detenidos en el mismo carril?
  choices:
    A: 10 millas por hora
    B: 15 millas por hora
    C: 20 millas por hora
    D: 25 millas por hora
  answer: B
  explanation: El manual establece que una motocicleta de dos ruedas puede rebasar
    de forma segura a una velocidad no mayor a 15 millas por hora durante el filtrado
    de carriles, siempre que los vehículos circundantes estén detenidos y haya suficiente
    espacio.
- id: 179
  category: sharing_the_road
  question: ¿Por qué los motociclistas se mueven frecuentemente dentro de su carril?
  choices:
    A: Para prepararse para una maniobra de rebase ilegal.
    B: Porque los vientos fuertes los obligan a desplazarse constantemente.
    C: Para que puedan ver, ser vistos y evitar peligros en la carretera.
    D: Para evitar que otros vehículos los rebasen.
  answer: C
  explanation: El manual explica que los motociclistas se mueven frecuentemente en
    su carril para poder ver, ser vistos y evitar peligros en la vía.
- id: 180
  category: defensive_driving
  question: ¿Cómo puede un automovilista prevenir una colisión con un ciclista al
    salir de un vehículo estacionado?
  choices:
    A: Tocar la bocina antes de abrir la puerta.
    B: Siempre verificar detrás de usted antes de abrir una puerta hacia la calzada.
    C: Abrir la puerta rápidamente para minimizar el tiempo que está en la calzada.
    D: Confiar únicamente en el espejo retrovisor para verificar si hay bicicletas.
  answer: B
  explanation: Para prevenir colisiones causadas por la apertura de la puerta de un
    vehículo, el manual aconseja verificar siempre detrás de usted antes de abrir
    una puerta hacia la calzada.
- id: 181
  category: sharing_the_road
  question: ¿Cuándo tienen los peatones el derecho de paso en los cruces peatonales?
  choices:
    A: Solo cuando las líneas del cruce están claramente pintadas.
    B: Solo en intersecciones controladas por un semáforo.
    C: En todas las intersecciones y cruces peatonales, incluso si las líneas no están
      marcadas o pintadas.
    D: Solo cuando un guardia de cruce está dirigiendo activamente el tráfico.
  answer: C
  explanation: El manual establece que los peatones tienen el derecho de paso en todas
    las intersecciones y cruces peatonales, incluso si las líneas no están marcadas
    o pintadas.
- id: 182
  category: safe_driving_rules
  question: ¿Por qué nunca debe rebasar a un vehículo que está detenido en un cruce
    peatonal?
  choices:
    A: El vehículo detenido podría retroceder repentinamente.
    B: Es ilegal cambiar de carril cerca de cualquier intersección.
    C: El conductor puede estar deteniéndose para ceder el paso a peatones que usted
      no puede ver.
    D: Podría bloquear la vista de la señal de tráfico.
  answer: C
  explanation: El manual advierte que nunca se deben rebasar vehículos detenidos en
    un cruce peatonal porque el conductor puede estar deteniéndose para ceder el paso
    a peatones que usted no puede ver.
- id: 183
  category: safe_driving_rules
  question: ¿Qué debe hacer con respecto a los peatones al girar con luz roja?
  choices:
    A: Ceder el paso solo a los peatones en el cruce peatonal al que está entrando.
    B: Detenerse por completo y verificar si hay peatones en todas las direcciones
      antes de avanzar.
    C: Reducir la velocidad y continuar si no se aproximan otros vehículos.
    D: Tocar la bocina para advertir a los peatones antes de realizar el giro.
  answer: B
  explanation: Al girar con luz roja, debe detenerse por completo y verificar si hay
    peatones en todas las direcciones para asegurarse de que su camino esté despejado
    antes de avanzar.
- id: 184
  category: driver_responsibility
  question: ¿Cuándo se les permite a los conductores usar un dispositivo electrónico
    móvil mientras conducen?
  choices:
    A: Cuando están detenidos en una luz roja o señal de alto.
    B: Cuando conducen a velocidades inferiores a 20 mph.
    C: Solo si es con un dispositivo de manos libres o en una situación de emergencia.
    D: Los dispositivos móviles están completamente prohibidos en todas las circunstancias.
  answer: C
  explanation: A los conductores no se les permite usar ningún dispositivo electrónico
    móvil mientras conducen, a menos que sea con un dispositivo de manos libres o
    en una situación de emergencia.
- id: 185
  category: penalties_and_points
  question: Si es condenado por conducción temeraria en Colorado, ¿cuántos puntos
    como máximo se pueden asignar a su historial de conducción?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: Si un oficial de la ley nota que sus acciones ponen en peligro a otra
    persona o propiedad, se le puede acusar bajo el estatuto de conducción temeraria
    de Colorado y, si es condenado, se pueden asignar hasta ocho puntos a su historial
    de conducción.
- id: 186
  category: defensive_driving
  question: ¿Cómo define el manual la conducción agresiva?
  choices:
    A: Operar un vehículo de manera que ponga en peligro a las personas, ya sea de
      forma intencional o no.
    B: Cualquier comportamiento al volante que ponga en peligro a otros y/o a la propiedad
      mediante una acción deliberada sin tener en cuenta la seguridad.
    C: Conducir ligeramente por encima del límite de velocidad establecido en una
      carretera rural.
    D: Usar un dispositivo móvil de manos libres mientras se navega en tráfico pesado.
  answer: B
  explanation: La conducción agresiva se define como cualquier comportamiento al volante
    que ponga en peligro a otros y/o a la propiedad mediante una acción deliberada
    sin tener en cuenta la seguridad.
- id: 187
  category: defensive_driving
  question: ¿Cuál es la forma recomendada de protegerse de un conductor agresivo?
  choices:
    A: Hacer contacto visual directo para demostrar que no se siente intimidado.
    B: Igualar su velocidad para evitar que lo rebase.
    C: Evitar el contacto visual, retroceder y no intentar igualar el acto agresivo.
    D: Tocar la bocina repetidamente para alertar a otros conductores sobre su comportamiento.
  answer: C
  explanation: Para protegerse de un conductor agresivo, no interactúe con ese conductor.
    Evite el contacto visual y no intente igualar un acto agresivo. Retroceda y ceda
    el paso.
- id: 188
  category: driver_responsibility
  question: ¿A qué número de teléfono celular especial pueden llamar los automovilistas
    y ciclistas para reportar conductores agresivos a la Patrulla Estatal de Colorado?
  choices:
    A: '*911 (*911)'
    B: '*DOT (*368)'
    C: '*CSP (*277)'
    D: '*PAT (*728)'
  answer: C
  explanation: Marque *CSP (*277) para reportar conductores agresivos. La Patrulla
    Estatal de Colorado ha reservado este número de teléfono celular especial para
    este propósito.
- id: 189
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una señal manual correcta para un ciclista
    que realiza un giro a la derecha?
  choices:
    A: Extender el brazo izquierdo directamente hacia la izquierda.
    B: Bajar el brazo izquierdo a la altura del codo.
    C: Extender el brazo derecho recto o el brazo izquierdo hacia arriba en ángulo
      recto.
    D: Agitar la mano derecha en movimiento circular.
  answer: C
  explanation: Para un giro a la derecha, un ciclista debe extender el brazo derecho
    recto o el brazo izquierdo hacia arriba en ángulo recto.
- id: 190
  category: penalties_and_points
  question: ¿Cuál de los siguientes actos agresivos puede resultar en cargos penales
    más allá de un cargo por conducción temeraria?
  choices:
    A: Tocar la bocina y gritar a otro conductor.
    B: Seguir muy de cerca (tailgating) a otro conductor para que acelere.
    C: Rebasar a un vehículo por el acotamiento.
    D: Golpear o embestir a otro vehículo.
  answer: D
  explanation: Algunos actos, como mostrar un arma a otro automovilista, golpear o
    embestir a otro vehículo o la persecución a alta velocidad de un vehículo, pueden
    resultar en cargos penales más allá de un cargo por conducción temeraria.
- id: 191
  category: safe_driving_rules
  question: Al detenerse en una intersección con un cruce de peatones, ¿dónde debe
    estar posicionado su vehículo?
  choices:
    A: Puede detenerse en el cruce de peatones si se está preparando para girar a
      la derecha en rojo.
    B: No se detenga con ninguna parte de su vehículo cubriendo el área del cruce
      de peatones.
    C: Puede bloquear el cruce de peatones siempre que no haya peatones visibles en
      ese momento.
    D: Deténgase a mitad del cruce de peatones para tener una mejor vista del tráfico
      transversal.
  answer: B
  explanation: 'El manual establece explícitamente: ''No se detenga con ninguna parte
    de su vehículo cubriendo el área del cruce de peatones''.'
- id: 192
  category: defensive_driving
  question: ¿Cuál de los siguientes es un consejo recomendado para evitar convertirse
    en un conductor agresivo?
  choices:
    A: Seguir muy de cerca (tailgate) a los conductores lentos para animarlos a acelerar.
    B: Salir temprano para cualquier viaje para permitir suficiente tiempo.
    C: Tocar la bocina a los conductores poco corteses para darles una lección.
    D: Transferir su enojo de otras situaciones a su conducción.
  answer: B
  explanation: El manual sugiere salir temprano para cualquier viaje para permitir
    suficiente tiempo y evitar transferir el enojo de otras situaciones a su conducción.
- id: 193
  category: defensive_driving
  question: ¿Cuáles son las tres opciones principales que tiene un conductor para
    evitar una colisión?
  choices:
    A: Reducir la velocidad o detenerse, girar o acelerar.
    B: Tocar la bocina, frenar bruscamente o dar un volantazo.
    C: Cerrar los ojos, frenar o prepararse para el impacto.
    D: Cambiar a punto muerto (neutral), apagar el motor o aplicar el freno de estacionamiento.
  answer: A
  explanation: 'Según el manual, para evitar una colisión, los conductores tienen
    tres opciones: reducir la velocidad o detenerse, girar o acelerar.'
- id: 194
  category: vehicle_information
  question: ¿Cómo debe frenar durante una emergencia si su vehículo está equipado
    con un Sistema de Frenos Antibloqueo (ABS)?
  choices:
    A: Bombear los frenos rápidamente para evitar derrapar.
    B: Aplicar los frenos con una presión fuerte y firme y no soltar.
    C: Tocar ligeramente el pedal del freno hasta que el vehículo se detenga.
    D: Aplicar el freno de estacionamiento simultáneamente con el freno de pie.
  answer: B
  explanation: Con el ABS, debe aplicar los frenos con una presión fuerte y firme
    y no soltar el pedal del freno, ya que el sistema solo funciona con el pedal presionado.
- id: 195
  category: vehicle_information
  question: Si su vehículo NO tiene ABS, ¿cuál es el procedimiento adecuado para girar
    rápidamente y evitar una colisión?
  choices:
    A: Girar el volante bruscamente mientras mantiene el pedal del freno presionado
      hasta el fondo.
    B: Presionar el pedal del freno, soltarlo y luego girar el volante.
    C: Acelerar mientras gira el volante para mantener la tracción.
    D: Cambiar a punto muerto (neutral) y girar el volante sin frenar.
  answer: B
  explanation: Sin ABS, debe presionar el pedal del freno, pero luego soltarlo y girar
    el volante. El freno debe soltarse antes de realizar un giro evasivo para evitar
    que las ruedas delanteras se bloqueen.
- id: 196
  category: safe_driving_rules
  question: Cuando un animal grande corre repentinamente frente a su vehículo, ¿cuál
    podría ser la alternativa más segura para evitar un choque más grave?
  choices:
    A: Dar un volantazo brusco hacia el carril contrario.
    B: Frenar de golpe y bloquear el volante.
    C: Atropellar al animal en lugar de tomar una acción evasiva drástica que cause
      la pérdida de control.
    D: Acelerar para asustar al animal y que se quite del camino.
  answer: C
  explanation: El manual establece que tomar una acción evasiva drástica puede resultar
    en la pérdida del control del vehículo y un choque más grave. Lamentablemente,
    la alternativa más segura para los pasajeros puede ser atropellar al animal.
- id: 197
  category: vehicle_information
  question: ¿Cuál es el primer paso que debe tomar si su vehículo experimenta una
    falla en los frenos?
  choices:
    A: Cambiar a una marcha más alta.
    B: Apagar el motor inmediatamente.
    C: Tirar de la palanca del freno de estacionamiento con la mayor fuerza posible.
    D: Quitar el pie del acelerador y bombear el pedal del freno varias veces.
  answer: D
  explanation: Si experimenta una falla en los frenos, debe quitar el pie del acelerador
    y bombear el pedal del freno varias veces. Esto a menudo generará suficiente presión
    de frenado para permitirle detenerse.
- id: 198
  category: vehicle_information
  question: ¿Qué debe hacer si experimenta el reventón de un neumático mientras conduce?
  choices:
    A: Frenar de golpe y detenerse en la carretera inmediatamente.
    B: Sujetar el volante con fuerza, mantener el vehículo recto y reducir la velocidad
      gradualmente.
    C: Acelerar ligeramente para mantener el control del vehículo.
    D: Girar el volante bruscamente hacia el lado del reventón.
  answer: B
  explanation: Durante el reventón de un neumático, sujete el volante con fuerza,
    mantenga el vehículo recto mientras reduce la velocidad gradualmente, quite el
    pie del acelerador y use los frenos ligeramente.
- id: 199
  category: vehicle_information
  question: Si el pedal del acelerador se atasca mientras conduce, ¿qué debe hacer?
  choices:
    A: Cambiar rápidamente a punto muerto (neutral), salir de la carretera y apagar
      el motor.
    B: Agacharse e intentar tirar del pedal hacia arriba con la mano.
    C: Apagar el encendido inmediatamente mientras aún está en la calzada.
    D: Aplicar el freno de estacionamiento y mantener el vehículo en marcha (drive).
  answer: A
  explanation: En caso de un pedal de acelerador atascado, mantenga la vista en la
    carretera, cambie rápidamente a punto muerto (neutral), salga de la carretera
    cuando sea seguro hacerlo y apague el motor.
- id: 200
  category: driver_responsibility
  question: ¿Qué se requiere de un pasajero si el conductor está físicamente incapacitado
    para informar sobre un choque?
  choices:
    A: El pasajero tiene permitido abandonar la escena inmediatamente.
    B: El pasajero debe hacerse cargo de la conducción del vehículo.
    C: El pasajero está obligado a informar sobre el choque y permanecer en la escena
      si así lo indican las autoridades.
    D: El pasajero debe mover el vehículo fuera de la autopista sin importar su estado.
  answer: C
  explanation: Si el conductor está físicamente incapacitado, se requiere que un pasajero
    informe sobre el choque y, si las autoridades lo indican, permanezca en la escena
    hasta que estas lleguen.
- id: 201
  category: driver_responsibility
  question: Bajo el Estado de Alerta de Accidente (Accident Alert Status), ¿cuándo
    se le permite intercambiar información y presentar un informe dentro de las 24
    horas en lugar de esperar a la policía en la escena?
  choices:
    A: Cuando hay lesiones menores pero los vehículos se pueden conducir.
    B: Cuando hay alcohol involucrado pero no hay heridos.
    C: Cuando no hay alcohol ni drogas involucrados, no hay heridos y todos los vehículos
      se pueden conducir.
    D: Cuando un vehículo es pérdida total pero no hay heridos.
  answer: C
  explanation: Bajo el Estado de Alerta de Accidente, si no hay alcohol ni drogas
    involucrados, no hay heridos y todos los vehículos aún se pueden conducir, puede
    intercambiar información y debe presentar un informe de accidente dentro de las
    24 horas.
- id: 202
  category: driver_responsibility
  question: ¿Qué debe hacer si choca contra un auto estacionado y no puede encontrar
    al dueño?
  choices:
    A: Esperar en la escena hasta por una hora y luego irse.
    B: Llamar a las autoridades policiales y dejar una nota en un lugar donde el dueño
      pueda encontrarla.
    C: Abandonar la escena inmediatamente si no hay daños visibles.
    D: Tocar la bocina tres veces y alejarse.
  answer: B
  explanation: Si un choque involucra a un auto estacionado y no puede encontrar al
    dueño, llame a las autoridades policiales y deje una nota en un lugar donde el
    dueño del auto pueda encontrarla.
- id: 203
  category: safe_driving_rules
  question: Según la Ley "Move It", ¿cuándo deben los automovilistas retirar sus vehículos
    de una autopista dividida después de un choque menor?
  choices:
    A: Cuando el vehículo se puede conducir, no hay drogas ni alcohol involucrados
      y no hay heridos.
    B: Solo cuando lleguen las autoridades policiales y les indiquen que lo hagan.
    C: Siempre que haya más de $1,000 en daños a la propiedad.
    D: Cuando el choque involucre a un vehículo comercial.
  answer: A
  explanation: La ley estatal exige retirar los vehículos de una autopista dividida
    después de un choque menor cuando el vehículo se puede conducir, no hay drogas
    ni alcohol involucrados y no hay heridos.
- id: 204
  category: safe_driving_rules
  question: Bajo la Ley "Move Over" de Colorado, ¿qué debe hacer si no puede cambiarse
    de carril de manera segura ante un vehículo detenido con luces de emergencia intermitentes?
  choices:
    A: Detener su vehículo por completo hasta que el vehículo detenido apague sus
      luces de emergencia.
    B: Mantener su velocidad pero tocar la bocina para alertar al personal.
    C: Reducir la velocidad al menos 20 mph por debajo del límite de velocidad indicado.
    D: Acelerar para pasar el vehículo detenido lo más rápido posible.
  answer: C
  explanation: Si no es seguro cambiarse de carril, o si se encuentra en una carretera
    con un solo carril en cada dirección, debe reducir la velocidad al menos 20 mph
    por debajo del límite de velocidad indicado.
- id: 205
  category: driver_responsibility
  question: Bajo las leyes del Buen Samaritano, ¿cuándo es apropiado mover a la víctima
    de un choque?
  choices:
    A: Siempre que se queje de dolor en el cuello.
    B: Solo si la vida de la víctima está en peligro.
    C: Tan pronto como llegue a la escena para despejar la carretera.
    D: Solo después de que hayan llegado las autoridades policiales.
  answer: B
  explanation: Una persona razonable y prudente que actúe bajo las leyes del Buen
    Samaritano movería a una víctima solo si la vida de esta se encuentra en peligro.
- id: 206
  category: vehicle_information
  question: ¿Qué debe esperar si su vehículo experimenta una falla de energía mientras
    conduce?
  choices:
    A: El volante se bloqueará por completo y no se podrá girar.
    B: Los frenos dejarán de funcionar por completo.
    C: El volante puede ser difícil de girar y es posible que deba presionar el pedal
      del freno con mucha fuerza.
    D: El vehículo cambiará automáticamente a la posición de estacionamiento (P).
  answer: C
  explanation: Durante una falla de energía, el volante puede ser difícil de girar
    pero podrá hacerlo, y los frenos seguirán funcionando pero es posible que deba
    presionar el pedal del freno con mucha fuerza.
- id: 207
  category: driver_responsibility
  question: ¿Qué debe hacer antes de brindar atención a una víctima consciente en
    la escena de una emergencia?
  choices:
    A: Pedirle su permiso
    B: Moverla a un lado de la carretera
    C: Esperar a que llegue la policía
    D: Revisar su licencia de conducir
  answer: A
  explanation: 'El manual establece: ''Pida permiso a una víctima consciente antes
    de brindarle atención''.'
- id: 208
  category: driver_responsibility
  question: Antes de brindar más atención a una víctima, ¿qué es lo primero que debe
    verificar?
  choices:
    A: Huesos rotos
    B: Emergencias que ponen en peligro la vida
    C: Hemorragia interna
    D: Lesiones en la cabeza
  answer: B
  explanation: Según el manual, debe 'Verificar si la víctima tiene emergencias que
    pongan en peligro la vida antes de brindar más atención'.
- id: 209
  category: driver_responsibility
  question: ¿Cuánto tiempo debe continuar brindando atención a una víctima después
    de solicitar ayuda profesional?
  choices:
    A: Hasta que la víctima se sienta mejor
    B: Hasta que llegue personal más capacitado
    C: Durante al menos 15 minutos
    D: Hasta que haya dado una declaración a la policía
  answer: B
  explanation: 'El manual indica: ''Solicite ayuda profesional... y continúe brindando
    atención hasta que llegue personal más capacitado''.'
- id: 210
  category: license_system
  question: ¿Qué símbolo aparece en su licencia de conducir, permiso o identificación
    de Colorado si se registra como donante de órganos y tejidos?
  choices:
    A: Una cinta verde
    B: Una cruz roja
    C: Un corazón con una 'Y'
    D: Una estrella con una 'D'
  answer: C
  explanation: 'El manual establece: ''Si dice que Sí, aparecerá un corazón con una
    “Y” en la parte frontal de su licencia, permiso o identificación''.'
- id: 211
  category: driver_responsibility
  question: ¿Cuántas vidas puede salvar potencialmente un solo donante de órganos?
  choices:
    A: Hasta 2 vidas
    B: Hasta 4 vidas
    C: Hasta 8 vidas
    D: Hasta 15 vidas
  answer: C
  explanation: Según el manual, "Un solo donante puede salvar hasta ocho vidas a través
    de la donación de órganos..."
- id: 212
  category: driver_responsibility
  question: ¿Cuántas vidas puede salvar y sanar un donante a través de la donación
    de ojos y tejidos?
  choices:
    A: Más de 10
    B: Más de 25
    C: Más de 50
    D: Más de 75
  answer: D
  explanation: El manual señala que un donante puede "salvar y sanar a más de 75 vidas
    a través de la donación de ojos y tejidos".
- id: 213
  category: driver_responsibility
  question: ¿Afectará su decisión de ser donante de órganos la atención médica que
    reciba antes de morir?
  choices:
    A: Sí, los médicos priorizarán la preservación de órganos sobre su vida.
    B: Sí, recibirá tratamientos experimentales.
    C: No, los médicos y enfermeros que lo atienden antes de la muerte no participan
      en el proceso de donación.
    D: No, pero será trasladado a un hospital diferente de inmediato.
  answer: C
  explanation: 'El manual establece explícitamente: "Su decisión de ser donante no
    afectará la atención médica. Los médicos y enfermeros que lo atienden antes de
    la muerte no participan en el proceso de donación".'
- id: 214
  category: license_system
  question: ¿Quién administra el Registro de Donantes de Órganos y Tejidos Donate
    Life Colorado?
  choices:
    A: El Departamento de Transporte de Colorado
    B: La División de Vehículos Motorizados (DMV)
    C: Donor Alliance
    D: El Gobierno Federal
  answer: C
  explanation: 'El manual establece: "El registro de donantes es administrado por
    Donor Alliance, una agencia de recuperación de órganos y tejidos sin fines de
    lucro designada por el gobierno federal..."'
- id: 215
  category: driver_responsibility
  question: ¿Puede una persona con una afección crónica como diabetes o hepatitis
    registrarse como donante de órganos?
  choices:
    A: No, las afecciones crónicas lo descalifican para la donación.
    B: Sí, cualquier persona puede registrarse independientemente de su edad o condición
      médica.
    C: Sí, pero solo si son menores de 50 años.
    D: No, a menos que se hayan curado durante al menos cinco años.
  answer: B
  explanation: 'El manual confirma: "Cualquier persona, independientemente de su edad
    o condición médica, puede registrarse como donante. Los pacientes con afecciones
    crónicas como diabetes y hepatitis pueden potencialmente salvar y sanar vidas
    a través de la donación".'
- id: 216
  category: license_system
  question: ¿Cuál es el propósito del Fondo de Concientización sobre la Donación de
    Órganos y Tejidos Emily Keyes-John W. Buckner?
  choices:
    A: Pagar cirugías de trasplante para pacientes sin seguro
    B: Financiar la divulgación pública y la educación sobre la donación de órganos
      y tejidos
    C: Compensar a las familias de los donantes de órganos
    D: Construir nuevos hospitales en Colorado
  answer: B
  explanation: Según el manual, "Sus contribuciones al fondo se destinan directamente
    a la divulgación pública y la educación sobre la donación de órganos y tejidos".
- id: 217
  category: driver_responsibility
  question: ¿Aproximadamente cuántas personas en Colorado están esperando un trasplante
    de órgano para salvar su vida?
  choices:
    A: Cerca de 500
    B: Cerca de 1,000
    C: Cerca de 1,500
    D: Cerca de 5,000
  answer: C
  explanation: 'El manual establece: "En Colorado, hay cerca de 1,500 personas esperando
    un trasplante de órgano para salvar su vida..."'
- id: 218
  category: license_system
  question: Cuando se inscribe como donante de órganos, ojos y tejidos en el DMV,
    ¿cuánto tiempo permanece vigente su registro?
  choices:
    A: Por un año
    B: Hasta que expire su licencia de conducir
    C: Por cinco años
    D: Permanece vigente a menos que usted lo cambie
  answer: D
  explanation: 'El manual establece: "Cuando se inscribe como donante de órganos,
    ojos y tejidos, su registro permanece vigente a menos que usted lo cambie".'
- id: 219
  category: license_system
  question: De acuerdo con los servicios en línea destacados en el manual, ¿cuál de
    las siguientes acciones puede realizar en línea?
  choices:
    A: Realizar su examen de habilidades de conducción
    B: Actualizar su permiso a una licencia
    C: Imprimir una licencia de conducir física permanente
    D: Entregar su licencia de otro estado
  answer: B
  explanation: La lista de "Servicios en línea destacados" incluye la capacidad de
    "Actualizar su permiso a una licencia".
- id: 220
  category: license_system
  question: ¿Cuál de los siguientes se enumera como un servicio en línea destacado
    proporcionado por el DMV de Colorado?
  choices:
    A: Comprar un seguro de vehículo
    B: Pagar una multa de tráfico
    C: Disputar una infracción de estacionamiento
    D: Reportar un vehículo robado
  answer: B
  explanation: La sección de "Servicios en línea destacados" enumera explícitamente
    "Pagar una multa de tráfico" como un servicio en línea disponible.
- id: 221
  category: driver_testing
  question: ¿Puede realizar el examen de permiso en casa en Colorado?
  choices:
    A: Sí, existe un servicio en línea para realizar el examen de permiso en casa.
    B: No, los exámenes de permiso deben realizarse en persona en una oficina del
      DMV.
    C: Sí, pero solo si es mayor de 21 años.
    D: No, los exámenes de permiso solo se ofrecen en las escuelas secundarias.
  answer: A
  explanation: 'El manual incluye una sección que dice: "¡Realice su examen de permiso
    en casa! ¡ESCANEE PARA REALIZAR SU EXAMEN AHORA!".'
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, en el cruce de peatones o antes de entrar
    en la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 222
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 223
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entrar en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico que viene en sentido contrario.
  id: 224
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una calle de un solo sentido o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 225
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Mantenerse a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 226
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Adelantar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 227
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 228
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite adelantar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 229
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No adelantar a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro con forma de banderín de ZONA DE NO ADELANTAR
    (NO PASSING ZONE) significa que no se le permite adelantar a otros vehículos en
    esta área. Marca el inicio de una zona de no adelantar.
  id: 230
- image: keep_right.png
  category: signs_and_signals
  id: 231
  question: ¿Qué le indica esta señal a los conductores que hagan?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha únicamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isleta
    de tráfico, mediana u obstrucción.
- image: speed_limit_25.png
  category: signs_and_signals
  id: 232
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
- image: deer_crossing.png
  category: signs_and_signals
  id: 233
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
- image: pedestrian_crossing.png
  category: signs_and_signals
  id: 234
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
- image: school_zone.png
  category: signs_and_signals
  id: 235
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal pentagonal (de 5 lados) de color amarillo verdoso fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
- image: railroad_crossing.png
  category: signs_and_signals
  id: 236
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
- image: railroad_crossbuck.png
  category: signs_and_signals
  id: 237
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces de vías férreas. Significa que debe ceder el paso a los trenes.
    Si se aproxima un tren, debe detenerse.
- image: curve_right.png
  category: signs_and_signals
  id: 238
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Se requiere giro a la derecha
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
- image: sharp_turn_right.png
  category: signs_and_signals
  id: 239
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos severo
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
- image: reverse_curve.png
  category: signs_and_signals
  id: 240
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que la carretera curve
    primero en un sentido y luego en el otro.
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 241
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Esté preparado para
    ajustar su velocidad y posición.
  id: 242
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la carretera y
    ajuste su posición en el carril.
  id: 243
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 244
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
  id: 245
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: Tráfico en ambos sentidos más adelante — el tráfico se mueve en ambas direcciones
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos más adelante. Puede
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 246
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 247
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente empinada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente empinada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 248
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca
    donde el semáforo puede no ser visible desde la distancia.
  id: 249
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 250
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde los caminos laterales.
  id: 251
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 252
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 253
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse o permanecer con el motor encendido
    D: Carga o descarga
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 254
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 255
