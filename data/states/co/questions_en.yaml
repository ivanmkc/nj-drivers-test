metadata:
  source: 2025 Colorado Driver's Manual
  total_questions: 251
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Colorado, what is the minimum age to apply for an instruction permit
    if you are enrolled in a state-approved driver education course?
  choices:
    A: 14 years and 6 months
    B: 15 years
    C: 15 years and 6 months
    D: 16 years
  answer: B
  explanation: According to the Colorado Driver Handbook, a minor can apply for an
    instruction permit at age 15 if they are enrolled in a state-approved 30-hour
    driver education course.
- id: 2
  category: license_system
  question: For the first six months after receiving a Colorado minor driver's license,
    who is permitted to be a passenger in the vehicle?
  choices:
    A: Any friend of the driver
    B: Only siblings and no one else
    C: No passengers under age 21, unless a parent or guardian is present
    D: Up to two passengers under age 21
  answer: C
  explanation: Colorado GDL laws state that for the first six months of holding a
    minor license, no passengers under age 21 are allowed unless a parent or another
    licensed adult (21+) is in the vehicle. Exceptions exist for medical emergencies
    or siblings.
- id: 3
  category: license_system
  question: A minor driver in Colorado (under 18) is subject to a license suspension
    if they accumulate how many points within any 12 consecutive months?
  choices:
    A: 3 points
    B: 6 points
    C: 9 points
    D: 12 points
  answer: B
  explanation: For drivers under 18 years of age, the Colorado point system triggers
    a suspension at 6 points within 12 months or 7 points for the duration of the
    license.
- id: 4
  category: license_system
  question: How many hours of driving experience, including nighttime hours, must
    a minor permit holder log before applying for a Colorado driver's license?
  choices:
    A: 40 hours total, 5 at night
    B: 50 hours total, 10 at night
    C: 60 hours total, 15 at night
    D: 30 hours total, 10 at night
  answer: B
  explanation: Colorado law requires minor permit holders to complete 50 hours of
    supervised driving, with at least 10 of those hours being at night.
- id: 5
  category: license_system
  question: Under Colorado's GDL laws, what are the curfew restrictions for a minor
    driver during the first year of holding a license?
  choices:
    A: No driving between 10 PM and 4 AM
    B: No driving between 11 PM and 5 AM
    C: No driving between 12 AM and 5 AM
    D: No driving between 9 PM and 6 AM
  answer: C
  explanation: For the first year of holding a minor license, drivers under 18 are
    not allowed to drive between midnight and 5 AM unless accompanied by a parent/guardian
    or for specific reasons like work or school.
- id: 6
  category: license_system
  question: If you move to a new residence within Colorado, you must notify the Department
    of Revenue of your address change within how many days?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Colorado law requires that you notify the DMV of an address or name
    change within 30 days.
- id: 7
  category: license_system
  question: What is the minimum age to apply for a Colorado instruction permit if
    you have NOT completed a 30-hour driver education course but HAVE completed a
    4-hour driver awareness program?
  choices:
    A: 15 years
    B: 15 years and 6 months
    C: 16 years
    D: 17 years
  answer: B
  explanation: In Colorado, if you do not take the full 30-hour course, you may wait
    until age 15 years and 6 months to get a permit, provided you complete a 4-hour
    driver awareness program.
- id: 8
  category: license_system
  question: An adult driver (21 or older) in Colorado will have their license suspended
    if they accumulate how many points within a 12-month period?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: For drivers 21 and older, the threshold for license suspension is 12
    points in any 12 consecutive months or 18 points in any 24 consecutive months.
- id: 9
  category: license_system
  question: When a minor with an instruction permit is driving, the supervising adult
    must be at least 21 years old and have held a valid license for at least how long?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: The person supervising a permit holder must be at least 21 years of
    age and have held a valid driver's license for at least one year.
- id: 10
  category: license_system
  question: In Colorado, what is the minimum blood alcohol concentration (BAC) for
    a driver under 21 to be charged with an Underage Drinking and Driving (UDD) offense?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Colorado has a 'zero tolerance' policy for minors. A BAC between 0.02%
    and 0.05% for a driver under 21 will result in a UDD charge.
- id: 11
  category: license_system
  question: How long is a Colorado instruction permit valid for after the date of
    issuance?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: In Colorado, instruction permits are valid for a period of 3 years
    from the date they are issued.
- id: 12
  category: license_system
  question: Which of the following is a requirement for a minor under 18 to apply
    for a Colorado driver's license?
  choices:
    A: They must have held an instruction permit for at least 12 months
    B: They must have held an instruction permit for at least 6 months
    C: They must be at least 17 years old
    D: They must have no more than 2 points on their permit
  answer: A
  explanation: Colorado law requires minors under 18 to hold their instruction permit
    for a full 12 months before they are eligible to apply for a driver's license.
- id: 13
  category: license_system
  question: For drivers aged 18 to 20, how many points accumulated within 12 months
    will result in a license suspension?
  choices:
    A: 7 points
    B: 9 points
    C: 12 points
    D: 14 points
  answer: B
  explanation: For drivers aged 18 through 20, the suspension threshold is 9 points
    in 12 months, 12 points in 24 months, or 14 points between the ages of 18 and
    21.
- id: 14
  category: license_system
  question: What is the mandatory minimum amount of property damage liability insurance
    required for a Colorado driver?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: B
  explanation: Colorado law requires minimum liability coverage of $25,000 per person
    for bodily injury, $50,000 per accident for bodily injury, and $15,000 per accident
    for property damage (25/50/15).
- id: 15
  category: license_system
  question: If a minor driver (under 18) is caught using a mobile phone while driving
    for a non-emergency, what is the point penalty for a first offense?
  choices:
    A: 0 points
    B: 1 point
    C: 3 points
    D: 6 points
  answer: B
  explanation: Under Colorado law, it is illegal for drivers under 18 to use a cell
    phone while driving. A first offense results in a 1-point penalty on their driving
    record and a fine.
- id: 16
  category: license_system
  question: In Colorado, if you are 16 years of age or older but under 21, what is
    the minimum requirement to apply for an instruction permit?
  choices:
    A: Completion of a 30-hour driver education course
    B: Completion of a 4-hour driver awareness program
    C: Passing the written vision and physical screening only
    D: Completion of 50 hours of supervised driving
  answer: C
  explanation: According to the Colorado Driver Handbook, individuals aged 16 to 21
    may apply for an instruction permit by passing the written test and vision screening
    without being required to take a formal driver education or awareness course.
- id: 17
  category: license_system
  question: If you change your name due to marriage or a court order, how many days
    do you have to notify the Colorado Department of Revenue and obtain a corrected
    license?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Colorado law requires that you notify the Department of Revenue within
    30 days of a name change or a change of address.
- id: 18
  category: license_system
  question: 'To meet the minimum vision standards for a Colorado driver''s license,
    your visual acuity must be at least:'
  choices:
    A: 20/20 in both eyes
    B: 20/40 in your better eye
    C: 20/50 in both eyes
    D: 20/30 in your better eye
  answer: B
  explanation: Colorado requires a minimum visual acuity of 20/40 in the better eye
    to be issued a license without restrictions.
- id: 19
  category: license_system
  question: A standard Colorado 'Class R' driver's license allows you to operate which
    of the following vehicles?
  choices:
    A: Any vehicle weighing over 26,001 lbs
    B: A motorcycle without any additional endorsement
    C: A passenger car or a truck with a GVWR of less than 26,001 lbs
    D: A commercial bus designed to carry 16 or more passengers
  answer: C
  explanation: A Class R license is the standard operator's license for passenger
    cars, vans, and small trucks with a Gross Vehicle Weight Rating (GVWR) of less
    than 26,001 lbs.
- id: 20
  category: license_system
  question: In Colorado, what is the fee to have your license reinstated after a suspension
    or revocation?
  choices:
    A: $25
    B: $60
    C: $95
    D: $150
  answer: C
  explanation: As of current Colorado regulations, the fee for reinstatement of a
    driving privilege following a suspension or revocation is $95.
- id: 21
  category: license_system
  question: Under Colorado law, a person is considered a 'Habitual Offender' if they
    accumulate how many 'major' traffic convictions within a seven-year period?
  choices:
    A: Two
    B: Three
    C: Five
    D: Ten
  answer: B
  explanation: A Habitual Offender is defined as someone having 3 or more major convictions
    (such as DUI, Reckless Driving, or Driving Under Suspension) within a 7-year period.
- id: 22
  category: license_system
  question: When a minor holds a Colorado instruction permit, who is required to wear
    a seat belt in the vehicle?
  choices:
    A: Only the driver and the front-seat passenger
    B: Only passengers under the age of 18
    C: Every occupant in the vehicle, regardless of age or seating position
    D: Only the driver
  answer: C
  explanation: Colorado GDL laws specify that when a permit holder is driving, every
    occupant in the vehicle must wear a seat belt.
- id: 23
  category: license_system
  question: If a parent or guardian who signed the 'Affidavit of Liability and Guardianship'
    for a minor's permit decides they no longer want to be responsible, what happens?
  choices:
    A: The minor can continue driving until they turn 18
    B: The minor must find a new co-signer within 30 days
    C: The minor's license or permit will be cancelled
    D: The parent must pay a fine but the permit remains valid
  answer: C
  explanation: The person who signed the affidavit may withdraw their signature at
    any time, which results in the immediate cancellation of the minor's license or
    permit.
- id: 24
  category: license_system
  question: To comply with Colorado's 'Real ID' requirements, which of the following
    is NOT a required document for a first-time license applicant?
  choices:
    A: Proof of Social Security number
    B: Proof of full legal name and date of birth
    C: Two documents proving Colorado residency
    D: Proof of a high school diploma or GED
  answer: D
  explanation: Real ID requirements include proof of identity, SSN, and residency,
    but do not require educational certificates like a high school diploma.
- id: 25
  category: license_system
  question: A Colorado motorcycle instruction permit is valid for how long?
  choices:
    A: 6 months
    B: 1 year
    C: 3 years
    D: Until the driver turns 21
  answer: C
  explanation: A Colorado motorcycle instruction permit is valid for 3 years from
    the date of issuance.
- id: 26
  category: license_system
  question: For Colorado residents aged 21 to 64, how long is a standard driver's
    license typically valid before it expires?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: D
  explanation: In Colorado, a driver's license issued to an adult between the ages
    of 21 and 64 is generally valid for 10 years.
- id: 27
  category: license_system
  question: If you are a new resident to Colorado, you must obtain a Colorado driver's
    license within how many days of becoming a resident?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents must obtain a Colorado driver's license within 30 days
    of establishing residency in the state.
- id: 28
  category: license_system
  question: Which of the following convictions will result in an automatic revocation
    of your Colorado driving privilege?
  choices:
    A: A single speeding ticket for 10 mph over the limit
    B: Leaving the scene of an accident involving death or injury
    C: Failure to use a turn signal
    D: Driving with a broken taillight
  answer: B
  explanation: Leaving the scene of an accident involving death or personal injury
    is a major offense that results in the mandatory revocation of a driver's license
    in Colorado.
- id: 29
  category: license_system
  question: In Colorado, if you are under 18 and applying for your first license,
    you must have held your instruction permit for at least how long?
  choices:
    A: 6 months
    B: 9 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: Minors under the age of 18 must hold their Colorado instruction permit
    for a full 12 months before they are eligible to apply for a driver's license.
- id: 30
  category: license_system
  question: What is the point value assessed against your Colorado license for the
    conviction of 'Speeding 10-19 mph over the limit'?
  choices:
    A: 1 point
    B: 2 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Under the Colorado point system, speeding 10 to 19 mph over the posted
    limit results in 4 points being added to the driver's record.
- id: 31
  category: driver_testing
  question: To pass the Colorado written knowledge test, what is the minimum passing
    score required?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: The Colorado written knowledge test consists of 25 questions, and applicants
    must answer at least 20 correctly (80%) to pass.
- id: 32
  category: driver_testing
  question: If you use corrective lenses (glasses or contacts) to pass the Colorado
    vision screening, which restriction code will be placed on your license?
  choices:
    A: Restriction A
    B: Restriction B
    C: Restriction C
    D: Restriction S
  answer: A
  explanation: In Colorado, Restriction 'A' indicates that the driver must wear corrective
    lenses while operating a motor vehicle.
- id: 33
  category: driver_testing
  question: When arriving for a Colorado driving skills (road) test, which of the
    following must you provide for the vehicle being used?
  choices:
    A: A notarized letter from the manufacturer
    B: Valid registration and proof of current insurance
    C: A maintenance log from the last 12 months
    D: A bill of sale
  answer: B
  explanation: Applicants must provide a vehicle that is in safe working condition,
    along with valid registration and proof of insurance for that specific vehicle.
- id: 34
  category: driver_testing
  question: Under Colorado's Express Consent Law, what is the penalty for a first-time
    refusal to take a chemical test for alcohol or drugs?
  choices:
    A: A 90-day license suspension
    B: A 6-month license suspension
    C: A 1-year license revocation
    D: A 2-year license revocation
  answer: C
  explanation: By driving in Colorado, you give 'express consent' to chemical testing.
    Refusal to take the test results in an automatic 1-year revocation of your driving
    privilege for a first offense.
- id: 35
  category: driver_testing
  question: In Colorado, how many points are assessed against your driving record
    for speeding 5 to 9 miles per hour over the posted limit?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: A
  explanation: According to the Colorado point system, speeding 5-9 mph over the limit
    results in 1 point on your driving record.
- id: 36
  category: driver_testing
  question: What is the legal limit for Delta-9 THC (marijuana) in a driver's blood
    in Colorado, above which they are presumed to be driving while impaired?
  choices:
    A: 2 nanograms per milliliter
    B: 5 nanograms per milliliter
    C: 10 nanograms per milliliter
    D: Any detectable amount
  answer: B
  explanation: Colorado law specifies that drivers with 5 nanograms or more of Delta-9
    THC per milliliter in their whole blood can be prosecuted for driving under the
    influence (DUI).
- id: 37
  category: driver_testing
  question: How many points are assessed against a Colorado driver's license for 'Leaving
    the scene of an accident' (Hit and Run)?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: D
  explanation: Leaving the scene of an accident is a major violation in Colorado and
    carries a penalty of 12 points, which results in an automatic suspension for adult
    drivers within a 12-month period.
- id: 38
  category: driver_testing
  question: In Colorado, what is the minimum required amount of liability insurance
    for bodily injury to or death of one person in any one accident?
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: B
  explanation: Colorado law requires a minimum of $25,000 for bodily injury or death
    to one person in any one accident.
- id: 39
  category: driver_testing
  question: When applying for a Colorado driver's license, how many documents are
    required to prove Colorado residency for a REAL ID-compliant license?
  choices:
    A: One
    B: Two
    C: Three
    D: None, if you have a passport
  answer: B
  explanation: To obtain a REAL ID-compliant Colorado license, you must provide two
    documents that prove your Colorado physical address.
- id: 40
  category: driver_testing
  question: In Colorado, how many points are assessed for 'Driving on the wrong side
    of the road'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Driving on the wrong side of the road is a 4-point violation in the
    state of Colorado.
- id: 41
  category: driver_testing
  question: 'According to Colorado law, you must follow an emergency vehicle with
    its lights and sirens on at a distance of no less than:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: It is illegal in Colorado to follow a fire apparatus or other emergency
    vehicle closer than 500 feet when it is responding to an alarm.
- id: 42
  category: driver_testing
  question: 'In Colorado, if you are involved in an accident that is not investigated
    by law enforcement, you must file an accident report if there is any injury or
    if property damage exceeds:'
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: Any amount
  answer: B
  explanation: If a police officer does not investigate the accident, you must file
    a report with the DMV if there are injuries, deaths, or property damage that appears
    to exceed $1,000.
- id: 43
  category: driver_testing
  question: In Colorado, how many points are assessed for 'Failure to yield right-of-way'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Failure to yield the right-of-way is a 3-point violation on a Colorado
    driving record.
- id: 44
  category: driver_testing
  question: To take the Colorado driving skills (road) test, your vehicle must meet
    which of the following requirements?
  choices:
    A: It must be equipped with a manual transmission
    B: It must be less than 10 years old
    C: It must have valid registration and proof of insurance
    D: It must have a passenger-side brake pedal for the examiner
  answer: C
  explanation: According to the Colorado Driver Handbook, the vehicle used for the
    driving test must be properly registered, have valid insurance, and be in safe
    mechanical condition.
- id: 45
  category: driver_testing
  question: When applying for a Colorado permit or license, which of the following
    is NOT an acceptable document to prove your Social Security number?
  choices:
    A: An original Social Security Card
    B: A W-2 form
    C: A pay stub containing your full name and full SSN
    D: A handwritten note from a current employer
  answer: D
  explanation: Colorado requires official documents for proof of SSN, such as the
    actual card, a W-2, or a printed pay stub. Handwritten notes are not accepted.
- id: 46
  category: driver_testing
  question: To pass the vision screening for a Colorado driver's license, what is
    the minimum required total field of vision?
  choices:
    A: 90 degrees
    B: 100 degrees
    C: 110 degrees
    D: 140 degrees
  answer: C
  explanation: Colorado vision standards require a total field of vision of at least
    110 degrees for a standard license.
- id: 47
  category: driver_testing
  question: When applying for a Colorado driver's license or ID card, you are given
    the opportunity to do which of the following?
  choices:
    A: Register to vote
    B: Sign up for the organ and tissue donor registry
    C: Make a voluntary contribution to the Colorado 911 fund
    D: All of the above
  answer: D
  explanation: The Colorado DMV application process allows applicants to register
    to vote, join the donor registry, and contribute to various state funds.
- id: 48
  category: driver_testing
  question: During the Colorado driving skills test, which of the following actions
    will result in an immediate failure?
  choices:
    A: Failing to use a turn signal once
    B: Driving 2 mph below the speed limit
    C: Any traffic violation or dangerous driving action
    D: Adjusting the side mirrors while the vehicle is stopped
  answer: C
  explanation: An immediate failure occurs if the applicant commits a traffic violation,
    performs a dangerous action, or is involved in an accident during the road test.
- id: 49
  category: driver_testing
  question: For a Colorado resident between the ages of 21 and 64, a standard driver's
    license is typically valid for how many years?
  choices:
    A: 3 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: B
  explanation: In Colorado, a standard adult driver's license for those aged 21 to
    64 is valid for 5 years.
- id: 50
  category: driver_testing
  question: In Colorado, what is the minimum age to apply for a Commercial Driver's
    License (CDL) for intrastate (within Colorado only) operation?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: While you must be 21 for interstate (between states) commercial driving,
    Colorado allows residents to apply for an intrastate CDL at age 18.
- id: 51
  category: driver_testing
  question: Colorado law requires drivers to carry a minimum of how much insurance
    coverage for bodily injury to or death of one person in any one accident?
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: B
  explanation: Colorado's mandatory minimum insurance requirements are $25,000 for
    bodily injury to one person, $50,000 for bodily injury to all persons, and $15,000
    for property damage (25/50/15).
- id: 52
  category: driver_testing
  question: In Colorado, which license class and endorsement is specifically required
    to operate a motorcycle?
  choices:
    A: Class A
    B: Class B
    C: Class R with an 'M' endorsement
    D: Class C
  answer: C
  explanation: To operate a motorcycle in Colorado, you must have a valid driver's
    license (Class R) with a motorcycle (M) endorsement.
- id: 53
  category: driver_testing
  question: 'Colorado''s ''Express Consent'' law means that by operating a motor vehicle,
    you have given consent to:'
  choices:
    A: A search of your vehicle's trunk at any time
    B: A chemical test of your blood, breath, or urine to determine alcohol or drug
      content
    C: A review of your private cell phone records by law enforcement
    D: Pay all traffic fines immediately upon being pulled over
  answer: B
  explanation: The Express Consent law states that any person who drives a motor vehicle
    in Colorado has consented to take a chemical test if an officer has probable cause
    to believe they are driving under the influence.
- id: 54
  category: driver_testing
  question: To obtain a Colorado instruction permit, an applicant must pass which
    of the following tests?
  choices:
    A: Vision and Written tests only
    B: Written and Road tests only
    C: Vision, Written, and Physical tests
    D: Vision and Road tests only
  answer: A
  explanation: To get a permit, you must pass the vision screening and the written
    knowledge test. The road (skills) test is required later to upgrade to a full
    license.
- id: 55
  category: driver_testing
  question: If your Colorado driver's license expires, how much of a grace period
    are you allowed to continue driving before you must renew it?
  choices:
    A: 10 days
    B: 30 days
    C: 90 days
    D: There is no grace period
  answer: D
  explanation: It is illegal to drive with an expired license in Colorado. There is
    no grace period; you must renew it on or before the expiration date.
- id: 56
  category: driver_responsibility
  question: 'In Colorado, if you are involved in an accident that causes any injury
    or death, you are required by law to:'
  choices:
    A: Wait 24 hours before notifying the police
    B: Notify the nearest law enforcement agency immediately
    C: Only report it if the damage exceeds $1,000
    D: File a report only if you are at fault
  answer: B
  explanation: Colorado law requires that any accident involving bodily injury or
    death must be reported to the nearest law enforcement agency immediately.
- id: 57
  category: driver_responsibility
  question: Upon becoming a resident of Colorado, how many days do you have to register
    your vehicle in the state?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: According to Colorado law, a vehicle must be registered within 90 days
    of the owner becoming a resident of the state.
- id: 58
  category: driver_responsibility
  question: 'Under Colorado''s ''Express Consent'' law, by driving a motor vehicle,
    you have agreed to:'
  choices:
    A: Keep your vehicle in good mechanical condition
    B: Carry a passenger at all times
    C: A chemical test of your blood, breath, or urine if suspected of a DUI
    D: Allow police to search your vehicle at any time
  answer: C
  explanation: The Express Consent Law means that by operating a vehicle in Colorado,
    you have already given consent to chemical testing if an officer has probable
    cause to believe you are driving under the influence.
- id: 59
  category: driver_responsibility
  question: How many points are assessed against your Colorado driving record for
    a conviction of failing to provide valid proof of insurance?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: B
  explanation: Failing to provide valid evidence of insurance in Colorado results
    in 4 points being added to your driving record.
- id: 60
  category: driver_responsibility
  question: 'In Colorado, a driver is considered to be ''Driving While Ability Impaired''
    (DWAI) if their Blood Alcohol Content (BAC) is at least:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: In Colorado, a BAC of 0.05% but less than 0.08% is sufficient to be
    charged with Driving While Ability Impaired (DWAI).
- id: 61
  category: driver_responsibility
  question: Under Colorado law, a driver can be charged with a DUI if their blood
    contains how many nanograms of active THC per milliliter?
  choices:
    A: 1 nanogram
    B: 2 nanograms
    C: 5 nanograms
    D: 10 nanograms
  answer: C
  explanation: Colorado law specifies that a jury can infer a driver was under the
    influence if their blood contains 5 nanograms or more of Delta-9 THC per milliliter.
- id: 62
  category: driver_responsibility
  question: For most passenger vehicles in Colorado, where must license plates be
    displayed?
  choices:
    A: Rear of the vehicle only
    B: Front of the vehicle only
    C: Both the front and the rear of the vehicle
    D: Inside the rear window
  answer: C
  explanation: 'Colorado law requires that most motor vehicles display two license
    plates: one on the front and one on the rear.'
- id: 63
  category: driver_responsibility
  question: What is the mandatory minimum fine for a first-time conviction of driving
    without valid insurance in Colorado?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: A first-time offense for driving without insurance in Colorado carries
    a mandatory minimum fine of $500.
- id: 64
  category: driver_responsibility
  question: 'If you strike an unattended vehicle and cannot find the owner, Colorado
    law requires you to:'
  choices:
    A: Wait for 30 minutes and then leave
    B: Leave a notice in a conspicuous place on the vehicle with your information
    C: Drive away if there is no visible damage
    D: Only report it if the other vehicle is worth more than $2,000
  answer: B
  explanation: If you hit a parked vehicle, you must attempt to locate the owner.
    If they cannot be found, you must leave a written notice with your name, address,
    and vehicle registration number.
- id: 65
  category: driver_responsibility
  question: 'If you are involved in a minor accident on a highway and there are no
    injuries, you should:'
  choices:
    A: Leave the vehicles exactly where they are until police arrive
    B: Move the vehicles off the travel lanes to the shoulder if it is safe to do
      so
    C: Immediately walk to the nearest exit for help
    D: Stay in the vehicle with your seatbelt on in the middle of the lane
  answer: B
  explanation: To prevent further accidents and traffic congestion, Colorado law requires
    drivers to move vehicles involved in minor property-damage-only accidents out
    of the flow of traffic if they can be moved safely.
- id: 66
  category: driver_responsibility
  question: If your license is revoked for a DUI or Express Consent violation, how
    long are you typically required to maintain an SR-22 (financial responsibility)
    certificate?
  choices:
    A: 6 months
    B: 1 year
    C: 3 years
    D: 10 years
  answer: C
  explanation: Following a license revocation for alcohol-related offenses, Colorado
    generally requires the driver to maintain SR-22 insurance for 3 years.
- id: 67
  category: driver_responsibility
  question: In Colorado, what are the minimum bodily injury liability insurance requirements
    per person?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Colorado law requires a minimum of $25,000 for bodily injury to one
    person in any one accident.
- id: 68
  category: driver_responsibility
  question: How many days does a new resident of Colorado have to register their vehicle
    after becoming a resident?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: According to Colorado law, you must register your vehicle within 90
    days of becoming a resident.
- id: 69
  category: driver_responsibility
  question: If a Colorado driver is convicted of a first-time offense for driving
    without valid insurance, how many points are assessed against their license?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: B
  explanation: Driving without motor vehicle insurance in Colorado results in 4 points
    being added to your driving record for the first offense.
- id: 70
  category: driver_responsibility
  question: 'If you are involved in an accident in Colorado where an injury or death
    occurs, and no police officer is present, you must:'
  choices:
    A: Wait 24 hours before reporting the accident
    B: Report the accident to the nearest law enforcement agency immediately
    C: Only report the accident if the property damage exceeds $2,500
    D: Exchange information and leave; reporting is optional
  answer: B
  explanation: Colorado law requires immediate reporting of any accident involving
    injury, death, or property damage to the nearest law enforcement agency if an
    officer is not at the scene.
- id: 71
  category: driver_responsibility
  question: In Colorado, what is the minimum liability insurance requirement for bodily
    injury when two or more people are injured in a single accident?
  choices:
    A: $25,000
    B: $50,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: Colorado law requires $50,000 for bodily injury to two or more people
    in any one accident.
- id: 72
  category: driver_responsibility
  question: If a Colorado driver is convicted of 'Leaving the Scene of an Accident'
    (Hit and Run) involving only property damage, how many points are added to their
    record?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: D
  explanation: Leaving the scene of an accident involving damage to another vehicle
    or property results in 12 points, which typically leads to a license suspension.
- id: 73
  category: driver_responsibility
  question: Under Colorado's 'Move Over' law, what must a driver do when approaching
    a stationary emergency vehicle with flashing lights?
  choices:
    A: Stop completely until the vehicle leaves
    B: Maintain speed but honk to alert the emergency workers
    C: Move over one lane if safe, or slow down significantly if moving over is not
      possible
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Colorado law requires drivers to move over at least one lane or, if
    that is not possible, reduce and maintain a safe speed when passing stationary
    emergency or maintenance vehicles.
- id: 74
  category: driver_responsibility
  question: In Colorado, who is required to wear a seat belt or be in a child restraint
    system in the front seat of a vehicle?
  choices:
    A: Only the driver
    B: Only passengers under the age of 18
    C: The driver and every front seat passenger
    D: Only the driver and passengers under 16
  answer: C
  explanation: Colorado law requires the driver and every front seat passenger to
    wear a seat belt or be in a child restraint system.
- id: 75
  category: driver_responsibility
  question: In Colorado, a child must be secured in a child restraint system (such
    as a booster seat) until they reach what age?
  choices:
    A: 5 years old
    B: 6 years old
    C: 8 years old
    D: 10 years old
  answer: C
  explanation: Colorado law requires children to be in a child restraint system (car
    seat or booster) until they are 8 years old.
- id: 76
  category: driver_responsibility
  question: 'If you are convicted of littering from a motor vehicle in Colorado, the
    fine is:'
  choices:
    A: $20
    B: $50
    C: Up to $500
    D: Exactly $1,000
  answer: C
  explanation: Littering in Colorado is a crime, and convictions can result in fines
    up to $500 and potentially community service.
- id: 77
  category: driver_responsibility
  question: When a Colorado law enforcement officer requests proof of insurance, which
    of the following is NOT an acceptable form of proof?
  choices:
    A: A paper insurance card issued by the insurer
    B: An electronic image of the insurance card on a smartphone
    C: A verbal statement of the policy number and carrier
    D: A printout of the insurance policy's declarations page
  answer: C
  explanation: Drivers must provide physical or electronic evidence of insurance.
    A verbal statement is not sufficient proof of financial responsibility.
- id: 78
  category: driver_responsibility
  question: If a police officer does not investigate an accident, and the accident
    resulted in injury or property damage, how many days do you have to file a report
    with the Department of Revenue?
  choices:
    A: 24 hours
    B: 10 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: If an accident is not investigated by law enforcement, and there is
    damage or injury, you must file a report within 10 days.
- id: 79
  category: safe_driving_rules
  question: In Colorado, what is the default speed limit in a residence district if
    not otherwise posted?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: According to the Colorado Driver Handbook, the speed limit in any residence
    district is 30 mph unless otherwise posted.
- id: 80
  category: safe_driving_rules
  question: What is the speed limit on narrow, winding mountain highways or blind
    curves in Colorado?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: The Colorado Driver Handbook states that the speed limit is 20 mph
    on narrow, winding mountain highways and blind curves.
- id: 81
  category: safe_driving_rules
  question: In Colorado, you must not park within how many feet of a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: Colorado law prohibits parking within 15 feet of a fire hydrant.
- id: 82
  category: safe_driving_rules
  question: When parallel parking in Colorado, how close must your wheels be to the
    curb?
  choices:
    A: Within 6 inches
    B: Within 12 inches
    C: Within 18 inches
    D: Within 24 inches
  answer: B
  explanation: In Colorado, when parking on a two-way street, you must park with the
    right-hand wheels parallel to and within 12 inches of the right-hand curb.
- id: 83
  category: safe_driving_rules
  question: In Colorado, when driving on a highway with a speed limit of 40 mph or
    higher, how far in advance must you signal before turning or changing lanes?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: In Colorado, you must signal at least 200 feet before a turn or lane
    change on highways where the speed limit is 40 mph or greater. In urban areas
    (under 40 mph), the requirement is 100 feet.
- id: 84
  category: safe_driving_rules
  question: When passing a bicyclist in Colorado, what is the minimum legal distance
    you must maintain between your vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Colorado law requires motorists to give bicyclists at least three feet
    of space when overtaking or passing them.
- id: 85
  category: safe_driving_rules
  question: What is the penalty for speeding in a Colorado maintenance, repair, or
    construction zone when workers are present?
  choices:
    A: A flat $500 fine
    B: Mandatory 30-day license suspension
    C: Fines are doubled
    D: Vehicle impoundment
  answer: C
  explanation: Colorado law mandates that fines for speeding violations are doubled
    in maintenance, repair, or construction zones when signs are posted and workers
    are present.
- id: 86
  category: safe_driving_rules
  question: When parking a vehicle facing downhill on a street with a curb, how should
    you turn your front wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: A
  explanation: When parking downhill with a curb, you should turn your wheels toward
    the curb so that if the vehicle rolls, it will hit the curb and stop.
- id: 87
  category: safe_driving_rules
  question: In Colorado, is it legal to make a left turn on a red light?
  choices:
    A: No, it is never legal
    B: Yes, but only from a one-way street onto another one-way street
    C: Yes, from any street as long as there is no cross traffic
    D: Yes, but only between the hours of 12:00 AM and 5:00 AM
  answer: B
  explanation: In Colorado, a left turn on red is permitted only when turning from
    a one-way street onto another one-way street, after coming to a complete stop
    and yielding to traffic and pedestrians.
- id: 88
  category: safe_driving_rules
  question: What is the recommended following distance behind another vehicle under
    ideal driving conditions in Colorado?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The Colorado Driver Handbook recommends a minimum following distance
    of 3 seconds under ideal conditions to allow enough time to react to hazards.
- id: 89
  category: safe_driving_rules
  question: In Colorado, when two vehicles reach an intersection with no signs or
    signals at the same time, which driver has the right of way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver traveling at a higher speed
    D: The driver on the larger road
  answer: B
  explanation: At an intersection with no signs or signals, the driver on the left
    must yield the right of way to the driver on the right.
- id: 90
  category: safe_driving_rules
  question: In Colorado, you must dim your high-beam headlights when you are within
    how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Colorado law requires drivers to dim their high beams when within 500
    feet of an oncoming vehicle or within 200 feet when following another vehicle.
- id: 91
  category: safe_driving_rules
  question: When two vehicles meet on a steep mountain road where neither can pass,
    which vehicle has the right-of-way?
  choices:
    A: The vehicle traveling downhill
    B: The heavier vehicle
    C: The vehicle traveling uphill
    D: The vehicle traveling faster
  answer: C
  explanation: In Colorado, when two vehicles meet on a steep grade where the road
    is not wide enough to pass, the vehicle going uphill has the right-of-way. The
    vehicle facing downhill must back up until the uphill vehicle can pass.
- id: 92
  category: safe_driving_rules
  question: In Colorado, what is the unposted speed limit in a designated business
    district?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: The default speed limit in Colorado business districts is 25 mph unless
    signs indicate otherwise.
- id: 93
  category: safe_driving_rules
  question: Under Colorado law, you are prohibited from parking within how many feet
    of a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: It is illegal to park within 15 feet of a fire hydrant in Colorado.
- id: 94
  category: safe_driving_rules
  question: When driving in urban areas, you must signal your intention to turn at
    least how many feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: In urban or metropolitan areas, you must signal continuously for at
    least 100 feet before making a turn. On highways or at speeds above 40 mph, you
    must signal for at least 200 feet.
- id: 95
  category: safe_driving_rules
  question: In Colorado, what does a flashing yellow arrow signal mean?
  choices:
    A: Stop and wait for a green arrow
    B: The signal is about to turn red; clear the intersection
    C: Turns are allowed after yielding to oncoming traffic and pedestrians
    D: Oncoming traffic has a red light
  answer: C
  explanation: A flashing yellow arrow means left turns are allowed, but you must
    first yield to oncoming traffic and pedestrians, then proceed with caution.
- id: 96
  category: safe_driving_rules
  question: 'In Colorado, it is illegal to make a U-turn if you cannot see in both
    directions for at least:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 700 feet
    D: 1,000 feet
  answer: C
  explanation: U-turns are prohibited on a curve or near the crest of a hill where
    the vehicle cannot be seen by the driver of any other vehicle approaching from
    either direction within 700 feet.
- id: 97
  category: defensive_driving
  question: According to the Colorado Driver Handbook, what is the recommended following
    distance behind the vehicle in front of you under normal driving conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The Colorado Driver Handbook recommends a minimum following distance
    of 3 seconds under normal driving conditions to allow enough time to react to
    hazards.
- id: 98
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly in Colorado,
    how far ahead should you look or scan the road?
  choices:
    A: 5 seconds
    B: 10-12 seconds
    C: 20-30 seconds
    D: Only the car directly in front of you
  answer: B
  explanation: Scanning 10-12 seconds ahead allows you to see potential hazards early
    and adjust your speed or position safely.
- id: 99
  category: defensive_driving
  question: In Colorado, at what speed can hydroplaning begin as your tires start
    to lose contact with the road during heavy rain?
  choices:
    A: 25 mph
    B: 35 mph
    C: 50 mph
    D: 65 mph
  answer: B
  explanation: Hydroplaning can start at speeds as low as 35 mph, and at 55 mph, tires
    may lose all contact with the road surface.
- id: 100
  category: defensive_driving
  question: 'In Colorado, you must dim your high beam headlights when following another
    vehicle within a distance of:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 600 feet
  answer: B
  explanation: Colorado law requires drivers to switch to low beams when following
    another vehicle within 200 feet to avoid blinding the driver ahead.
- id: 101
  category: defensive_driving
  question: Under Colorado's Passenger Vehicle Traction Law (Code 15), what is the
    minimum required tread depth for all tires on a vehicle?
  choices:
    A: 1/16 inch
    B: 2/32 inch
    C: 3/16 inch
    D: 4/32 inch
  answer: C
  explanation: When the Traction Law is in effect, all tires must have a tread depth
    of at least 3/16 inch.
- id: 102
  category: defensive_driving
  question: When Colorado's Passenger Vehicle Chain Law (Code 16) is in effect, what
    is required for all passenger vehicles?
  choices:
    A: Only snow tires are required
    B: Only 4WD/AWD vehicles are allowed
    C: All vehicles must have chains or an approved alternative traction device
    D: Vehicles must drive with hazard lights on
  answer: C
  explanation: Code 16 is the final safety measure before a highway is closed; it
    requires every passenger vehicle to have chains or an alternative traction device
    like AutoSock.
- id: 103
  category: defensive_driving
  question: 'To properly check your ''blind spot'' before changing lanes in Colorado,
    you should:'
  choices:
    A: Check your rearview mirror
    B: Check your side mirrors
    C: Turn your head and look over your shoulder in the direction of the turn
    D: Rely on your vehicle's blind-spot monitoring system
  answer: C
  explanation: Mirrors do not show everything; you must turn your head to check the
    areas your mirrors cannot see before changing lanes.
- id: 104
  category: defensive_driving
  question: When entering a roundabout in Colorado, who has the right-of-way?
  choices:
    A: Traffic entering the roundabout
    B: Traffic already in the roundabout
    C: The vehicle on the right
    D: The vehicle traveling at the highest speed
  answer: B
  explanation: Drivers entering a roundabout must yield to the traffic already circulating
    within the roundabout.
- id: 105
  category: defensive_driving
  question: If your vehicle starts to skid on an icy Colorado road, what is the correct
    defensive driving response?
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Let off the accelerator and steer in the direction you want the front of the
      vehicle to go
    D: Shift the car into neutral and close your eyes
  answer: C
  explanation: To recover from a skid, take your foot off the gas and steer in the
    direction you want to go. Avoid slamming on the brakes as it can lock the wheels.
- id: 106
  category: defensive_driving
  question: When stopped at an intersection in Colorado, what is the recommended scanning
    sequence before proceeding when the light turns green?
  choices:
    A: Look straight ahead only
    B: Look left, then right
    C: Look left, then right, then left again
    D: Look right, then left
  answer: C
  explanation: Scanning left, right, and left again helps ensure no vehicles are running
    the red light from either side before you enter the intersection.
- id: 107
  category: defensive_driving
  question: When following another vehicle at night in Colorado, at what distance
    must you dim your high beams to low beams?
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 600 feet
  answer: B
  explanation: Colorado law requires drivers to dim their high beams when following
    another vehicle within 200 feet.
- id: 108
  category: defensive_driving
  question: At what speed can hydroplaning (tires losing contact with the road due
    to water) begin to occur in Colorado?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Only above 65 mph
    D: At any speed over 20 mph
  answer: A
  explanation: Hydroplaning can start at speeds as low as 35 mph. In a heavy rainstorm,
    tires can lose all contact with the road at 55 mph.
- id: 109
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning in Colorado traffic,
    how far ahead should you be looking (scanning)?
  choices:
    A: 5 seconds
    B: 10-15 seconds
    C: 20-30 seconds
    D: Exactly one mile
  answer: B
  explanation: The Colorado Driver Handbook recommends looking 10-15 seconds ahead,
    which is about one city block or a quarter-mile on the highway.
- id: 110
  category: defensive_driving
  question: In Colorado, how many points are assessed against your driver's license
    for the violation of 'Following too closely' (tailgating)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Following too closely is considered a serious defensive driving error
    in Colorado and results in 4 points on your driving record.
- id: 111
  category: defensive_driving
  question: When driving down a steep mountain grade in Colorado, what is the safest
    way to control your speed and prevent 'brake fade'?
  choices:
    A: Keep your foot on the brake pedal constantly
    B: Shift to a lower gear
    C: Turn off the engine
    D: Shift the car into neutral
  answer: B
  explanation: Shifting to a lower gear allows engine braking to help control speed,
    which prevents brakes from overheating and failing (brake fade) on long Colorado
    mountain descents.
- id: 112
  category: defensive_driving
  question: In Colorado, if you are driving in heavy rain, snow, or fog and cannot
    see more than ____ feet ahead, you must use your headlights.
  choices:
    A: 200 feet
    B: 500 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: Colorado law requires headlights to be turned on if visibility is less
    than 1,000 feet due to weather conditions.
- id: 113
  category: defensive_driving
  question: 'When driving on packed snow or icy roads in Colorado, the recommended
    following distance should be increased to:'
  choices:
    A: 4 seconds
    B: 6 seconds
    C: 8 to 10 seconds
    D: 15 to 20 seconds
  answer: C
  explanation: Because stopping distances are significantly increased on snow and
    ice, Colorado recommends increasing following distance to 8-10 seconds.
- id: 114
  category: defensive_driving
  question: 'Under Colorado''s ''Move Over'' law, if you see an emergency vehicle
    with flashing lights on the side of the road, you must:'
  choices:
    A: Stop immediately in your lane
    B: Speed up to pass them quickly
    C: Move over a lane if possible, or reduce speed to at least 20 mph below the
      limit
    D: Maintain your speed and stay in your lane
  answer: C
  explanation: Colorado law requires drivers to move over a lane for stationary emergency/maintenance
    vehicles. If moving over is not possible, you must slow down to a speed that is
    at least 20 mph less than the posted limit (or 25 mph if the limit is less than
    45 mph).
- id: 115
  category: defensive_driving
  question: 'If you are driving and your tires lose traction on a patch of oil or
    water (hydroplaning), you should:'
  choices:
    A: Brake hard to stop the sliding
    B: Ease your foot off the gas pedal and keep the steering wheel straight
    C: Turn the wheel sharply to the right
    D: Shift into reverse
  answer: B
  explanation: To recover from hydroplaning, you should ease off the gas and avoid
    braking or sudden steering movements until the tires regain contact with the road.
- id: 116
  category: defensive_driving
  question: 'When entering a tunnel on a Colorado highway (like the Eisenhower-Johnson
    Memorial Tunnel), you should:'
  choices:
    A: Turn on your high beams
    B: Turn on your low beam headlights
    C: Speed up to get through faster
    D: Turn on your hazard lights
  answer: B
  explanation: Colorado safety guidelines recommend turning on low beam headlights
    before entering tunnels to increase visibility and ensure your vehicle is seen
    by others.
- id: 117
  category: alcohol_drugs_health
  question: In Colorado, drivers can be arrested for DUI if their blood contains how
    many nanograms of Delta-9 THC per milliliter?
  choices:
    A: 1 nanogram
    B: 2 nanograms
    C: 5 nanograms
    D: 10 nanograms
  answer: C
  explanation: Colorado law specifies that a jury can infer a driver was under the
    influence of marijuana if their blood contains 5 nanograms or more of Delta-9
    THC per milliliter.
- id: 118
  category: alcohol_drugs_health
  question: How many points are assessed against a Colorado driver's license for a
    Driving While Ability Impaired (DWAI) conviction?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: A DWAI conviction results in 8 points being added to your Colorado
    driving record.
- id: 119
  category: alcohol_drugs_health
  question: If a Colorado driver refuses to take a chemical test when suspected of
    a DUI, their license will be revoked for how long for a first offense?
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Under the Express Consent Law, refusing a chemical test results in
    an automatic 1-year revocation of your driving privilege for the first offense.
- id: 120
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' in the context of driving safety?
  choices:
    A: The effect of driving while tired
    B: The combined effect of alcohol and drugs being greater than each alone
    C: The improvement of vision when wearing prescription lenses
    D: The reaction time improvement after drinking coffee
  answer: B
  explanation: The synergistic effect occurs when alcohol and drugs (even prescription
    or over-the-counter) are mixed, multiplying the impairment effects on the driver.
- id: 121
  category: alcohol_drugs_health
  question: How many points are assessed against a minor's license for a first Underage
    Drinking and Driving (UDD) offense in Colorado?
  choices:
    A: 2 points
    B: 4 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: A first UDD offense (BAC between 0.02% and 0.05% for those under 21)
    results in 4 points being assessed against the driver's license.
- id: 122
  category: alcohol_drugs_health
  question: 'In Colorado, a driver is designated as a ''Persistent Drunk Driver''
    (PDD) if they are caught driving with a BAC of:'
  choices:
    A: 0.08% or higher
    B: 0.12% or higher
    C: 0.15% or higher
    D: 0.20% or higher
  answer: C
  explanation: A driver is classified as a Persistent Drunk Driver (PDD) if they have
    a BAC of 0.15% or higher, or if they have multiple DUI/DWAI offenses or refuse
    a chemical test.
- id: 123
  category: alcohol_drugs_health
  question: Which of the following is a mandatory penalty for a first DUI conviction
    in Colorado?
  choices:
    A: Permanent loss of vehicle
    B: Between 48 and 96 hours of useful public service
    C: A minimum of 30 days in state prison
    D: Lifetime revocation of driving privileges
  answer: B
  explanation: In Colorado, a first DUI conviction requires between 48 and 96 hours
    of useful public service (community service).
- id: 124
  category: alcohol_drugs_health
  question: 'In Colorado, ''Driving Under the Influence'' (DUI) is defined as driving
    when a person has consumed alcohol or drugs that affects them to:'
  choices:
    A: The slightest degree
    B: A moderate degree
    C: A degree that renders them substantially incapable of safe operation
    D: A degree that causes an immediate accident
  answer: C
  explanation: DUI is defined as being 'substantially incapable' of safe vehicle operation.
    DWAI is the lesser charge, defined as being affected to the 'slightest degree'.
- id: 125
  category: alcohol_drugs_health
  question: 'If you are convicted of a DUI in Colorado, you will be required to install
    an Ignition Interlock Device (IID) if your BAC was at or above:'
  choices:
    A: 0.05%
    B: 0.08%
    C: 0.15%
    D: 0.25%
  answer: C
  explanation: Drivers with a BAC of 0.15% or higher are designated as Persistent
    Drunk Drivers and must use an Ignition Interlock Device for at least two years
    to regain full driving privileges.
- id: 126
  category: alcohol_drugs_health
  question: Which of these factors has the greatest influence on how quickly your
    body processes alcohol?
  choices:
    A: The type of alcohol (beer vs. liquor)
    B: Taking a cold shower
    C: Time
    D: Drinking black coffee
  answer: C
  explanation: Only time can reduce the concentration of alcohol in your blood. Coffee,
    showers, and exercise do not speed up the metabolic process.
- id: 127
  category: alcohol_drugs_health
  question: 'If you have a medical condition that causes lapses of consciousness (such
    as epilepsy), Colorado law requires you to:'
  choices:
    A: Only drive during daylight hours
    B: Be episode-free for a period of time (usually 6 months) and have a doctor's
      certification
    C: Surrender your license permanently
    D: Drive only with a passenger who can take the wheel
  answer: B
  explanation: Colorado requires drivers with conditions affecting consciousness to
    be episode-free for a specific duration and provide medical clearance to ensure
    they can safely operate a vehicle.
- id: 128
  category: alcohol_drugs_health
  question: For a first Underage Drinking and Driving (UDD) offense in Colorado, what
    is the mandatory license revocation period?
  choices:
    A: 30 days
    B: 3 months
    C: 6 months
    D: 1 year
  answer: B
  explanation: A first UDD offense (BAC between 0.02% and 0.05% for drivers under
    21) results in a 3-month license revocation.
- id: 129
  category: alcohol_drugs_health
  question: What is the effect of combining alcohol with other drugs, such as prescription
    or over-the-counter medications?
  choices:
    A: The effects of both are reduced
    B: The alcohol cancels out the drug's side effects
    C: It can multiply the effects of both, leading to severe impairment
    D: There is no measurable effect on driving ability
  answer: C
  explanation: Combining alcohol with other drugs (synergistic effect) can drastically
    increase impairment beyond the effects of either substance alone.
- id: 130
  category: alcohol_drugs_health
  question: 'A first-time DUI offender in Colorado with a BAC of 0.15% or higher is
    required to install an Ignition Interlock Device (IID) for at least:'
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: Under Colorado's Persistent Drunk Driver (PDD) laws, a first-time offender
    with a BAC of 0.15% or higher must use an IID for at least two years.
- id: 131
  category: alcohol_drugs_health
  question: For drivers of commercial motor vehicles (CDL holders) in Colorado, what
    is the BAC limit that results in a disqualification?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: The legal limit for commercial drivers is 0.04%. Any BAC at or above
    this level results in a disqualification of CDL privileges.
- id: 132
  category: alcohol_drugs_health
  question: 'In Colorado, if a person under 21 is convicted of possessing or consuming
    alcohol (even if not driving), they may face:'
  choices:
    A: A permanent ban from ever getting a license
    B: Driver's license revocation
    C: Only a small fine with no impact on driving
    D: Mandatory military service
  answer: B
  explanation: Colorado's 'Buy and Possess' laws mean that minors can lose their driving
    privileges for alcohol-related offenses even if they were not driving at the time.
- id: 133
  category: alcohol_drugs_health
  question: In Colorado, can you be charged with a DUI for driving under the influence
    of legally prescribed medication?
  choices:
    A: No, because the medication is legal
    B: Only if you do not have the prescription bottle with you
    C: Yes, if the medication impairs your ability to drive safely
    D: Only if the medication is a Schedule I narcotic
  answer: C
  explanation: A DUI charge applies to any substance that impairs driving, including
    legal prescription drugs and over-the-counter medications.
- id: 134
  category: penalties_and_points
  question: Under Colorado law, how many points is a 'Reckless Driving' conviction
    worth on your driving record?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: Reckless driving is a serious offense in Colorado and carries a penalty
    of 8 points.
- id: 135
  category: penalties_and_points
  question: In Colorado, what is the point penalty for 'Following Too Closely' (tailgating)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Following too closely is considered a significant safety hazard in
    Colorado and is penalized with 4 points.
- id: 136
  category: penalties_and_points
  question: Under Colorado's 'Express Consent' law, if you refuse to take a chemical
    test when requested by an officer who suspects you of DUI, what is the immediate
    administrative penalty?
  choices:
    A: A $500 fine only
    B: Your license will be revoked for one year
    C: A mandatory 48 hours in jail
    D: 6 points added to your license
  answer: B
  explanation: By driving in Colorado, you give 'express consent' to chemical testing.
    Refusal results in an automatic one-year revocation of your driving privilege.
- id: 137
  category: penalties_and_points
  question: What is the point penalty for failing to stop for a school bus with flashing
    red lights in Colorado?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Failing to stop for a school bus is a major violation in Colorado and
    results in 6 points.
- id: 138
  category: penalties_and_points
  question: How many points are assessed for 'Careless Driving' in Colorado?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Careless driving (driving in a manner without due regard for the width,
    grade, curves, corners, traffic, and use of the streets) results in 4 points.
- id: 139
  category: penalties_and_points
  question: For a driver 21 years of age or older, how many points accumulated within
    any 24 consecutive months will result in a license suspension?
  choices:
    A: 12 points
    B: 15 points
    C: 18 points
    D: 24 points
  answer: C
  explanation: Adult drivers (21+) face suspension if they accumulate 12 points in
    12 months, or 18 points in 24 months.
- id: 140
  category: penalties_and_points
  question: In Colorado, speeding 40 mph or more over the posted limit is a high-point
    violation. How many points are assessed?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: D
  explanation: Speeding 40 mph or more over the limit results in 12 points, which
    is enough to trigger an immediate suspension for most drivers.
- id: 141
  category: penalties_and_points
  question: Leaving the scene of an accident (Hit and Run) in Colorado results in
    how many points on your driving record?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: D
  explanation: Leaving the scene of an accident is a major violation and results in
    12 points being added to the driver's record.
- id: 142
  category: penalties_and_points
  question: How many points are assessed for failing to stop for a red light or a
    stop sign in Colorado?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Failure to stop for a traffic signal (red light) or a stop sign results
    in 4 points on your Colorado driving record.
- id: 143
  category: penalties_and_points
  question: If you are convicted of operating a motor vehicle without a valid insurance
    policy in Colorado, how many points are added to your license for a first offense?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 10 points
  answer: B
  explanation: Operating a vehicle without insurance in Colorado results in 4 points
    on your license, in addition to fines and potential suspension.
- id: 144
  category: penalties_and_points
  question: 'Under Colorado''s ''Express Consent'' law, if you refuse to take a chemical
    test when requested by law enforcement, your license will be automatically revoked
    for:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: By driving in Colorado, you give 'Express Consent' to chemical testing.
    Refusal results in an automatic 1-year license revocation for a first offense.
- id: 145
  category: penalties_and_points
  question: Under Colorado law, failing to yield the right-of-way to a stationary
    emergency, maintenance, or tow vehicle (Move Over Law) results in how many points?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Violating Colorado's 'Move Over' law by failing to yield or move over
    for stationary emergency vehicles results in 4 points.
- id: 146
  category: penalties_and_points
  question: If you are caught speeding 20 to 39 mph over the posted speed limit in
    Colorado, how many points will be assessed against your license?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: Speeding 20-39 mph over the limit results in 6 points in Colorado.
    (10-19 mph over is 4 points).
- id: 147
  category: penalties_and_points
  question: For a minor driver under 18 in Colorado, how many points are assessed
    for a violation of the seat belt law?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: While seat belt violations are often secondary for adults, for minor
    drivers in Colorado, a seat belt violation results in 2 points.
- id: 148
  category: penalties_and_points
  question: In Colorado, failing to stop for a school bus with its red lights flashing
    and stop arm extended results in how many points?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: Failing to stop for a school bus is a significant safety violation
    in Colorado and carries a 6-point penalty.
- id: 149
  category: sharing_the_road
  question: Under Colorado law, how many points are assessed against your driver's
    license for passing a school bus while its red lights are flashing and its stop
    arm is extended?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Passing a stopped school bus with its red lights flashing is a serious
    offense in Colorado and results in 6 points being added to your driving record.
- id: 150
  category: sharing_the_road
  question: Colorado's 'Move Over' law requires drivers to do what when approaching
    a stationary emergency vehicle with flashing lights on a multi-lane highway?
  choices:
    A: Stop completely until the emergency vehicle leaves
    B: Maintain speed but honk to alert the emergency workers
    C: Move over at least one lane if safe to do so, or slow down significantly if
      moving over is not possible
    D: Only move over if the emergency vehicle is a police cruiser
  answer: C
  explanation: Colorado law requires drivers to move over at least one lane when approaching
    stationary emergency, tow, or maintenance vehicles. If moving over is unsafe,
    the driver must reduce speed to at least 20 mph below the posted limit (or 25
    mph if the limit is 45 mph or less).
- id: 151
  category: sharing_the_road
  question: According to the 'Colorado Safety Stop' law (SB22-102), what are bicyclists
    permitted to do at a stop sign if the intersection is clear?
  choices:
    A: Maintain full speed without looking
    B: Treat the stop sign as a yield sign and proceed at a reasonable speed without
      stopping
    C: They must always come to a complete stop for at least 3 seconds
    D: They may only skip the stop if they are in a group of 5 or more
  answer: B
  explanation: The Colorado Safety Stop allows bicyclists to treat stop signs as yield
    signs and stop lights as stop signs (if the light is red and no traffic is approaching)
    when the coast is clear.
- id: 152
  category: sharing_the_road
  question: As of August 2024, Colorado law allows motorcycle 'lane filtering' under
    which specific condition?
  choices:
    A: Motorcycles can filter at any speed on any road
    B: Traffic must be stopped, and the motorcycle must not exceed 15 mph
    C: Motorcycles can only filter on the right shoulder
    D: Filtering is only allowed on rural two-lane highways
  answer: B
  explanation: HB24-1159 allows motorcycles to pass stopped vehicles in the same lane
    if traffic is at a complete stop and the motorcycle does not exceed 15 mph. It
    is not allowed on shoulders or between moving vehicles.
- id: 153
  category: sharing_the_road
  question: 'In Colorado, if you see a pedestrian using a white cane or a guide dog,
    you must:'
  choices:
    A: Honk your horn to let them know you are there
    B: Yield the right-of-way and come to a complete stop
    C: Slow down and drive around them closely
    D: Only stop if they are in a marked crosswalk
  answer: B
  explanation: Colorado law requires drivers to come to a complete stop to let a blind
    or visually impaired person using a cane or guide dog cross the road, regardless
    of whether they are in a crosswalk.
- id: 154
  category: sharing_the_road
  question: 'When driving near a large commercial truck, the ''No-Zone'' refers to:'
  choices:
    A: The area where trucks are not allowed to drive
    B: The blind spots around the truck where your vehicle cannot be seen by the driver
    C: The speed-restricted zone for trucks in the mountains
    D: The cargo area of the truck
  answer: B
  explanation: The 'No-Zone' represents the large blind spots behind, in front, and
    on both sides of a commercial truck where the truck driver cannot see other vehicles.
- id: 155
  category: sharing_the_road
  question: 'When a motorist is making a right turn across a bike lane in Colorado,
    they should:'
  choices:
    A: Speed up to get ahead of any bicyclists
    B: Signal, check for bicyclists, and yield to any bicyclist in the lane before
      turning
    C: Always stop in the bike lane to wait for a gap in traffic
    D: Bicyclists must always yield to turning cars
  answer: B
  explanation: Motorists must yield to bicyclists in a bike lane before making a turn.
    You should check your mirrors and blind spots to ensure no cyclists are approaching
    from behind on your right.
- id: 156
  category: sharing_the_road
  question: On a Colorado highway with at least two lanes in each direction, you approach
    a stationary tow truck with its amber lights flashing. What is the legal requirement?
  choices:
    A: You only need to move over for red and blue lights
    B: You must move over one lane if safe, as the Move Over law includes tow and
      service vehicles
    C: You must stop and ask if they need assistance
    D: You should maintain your speed and stay in your lane
  answer: B
  explanation: Colorado's Move Over law was expanded to include stationary tow trucks,
    utility service vehicles, and maintenance vehicles displaying flashing amber or
    white lights.
- id: 157
  category: sharing_the_road
  question: When are you NOT required to stop for a school bus in Colorado that has
    its red lights flashing and stop arm extended?
  choices:
    A: When you are traveling in the opposite direction on a divided highway with
      a median or barrier
    B: When you are in a hurry and the bus is stopped for more than 2 minutes
    C: When the bus is stopped in a residential zone
    D: When there are no children visible
  answer: A
  explanation: You do not need to stop if you are traveling in the opposite direction
    on a divided highway where the road is separated by a median, grass strip, or
    concrete barrier.
- id: 158
  category: sharing_the_road
  question: In Colorado, who is legally required to wear a helmet while riding or
    operating a motorcycle?
  choices:
    A: All riders regardless of age
    B: No one; helmets are optional for everyone
    C: Only the operator, not the passenger
    D: Any operator or passenger under the age of 18
  answer: D
  explanation: Colorado law requires all motorcycle operators and passengers under
    18 years of age to wear a DOT-approved helmet. For those 18 and older, helmets
    are optional, though eye protection is required for all.
- id: 159
  category: sharing_the_road
  question: If you are turning left at an intersection and a pedestrian is crossing
    the street you are turning into, who has the right-of-way?
  choices:
    A: The driver, because they have a green light
    B: The pedestrian, even if the crosswalk is unmarked
    C: The pedestrian, but only if there is a 'Walk' signal
    D: Whoever entered the intersection first
  answer: B
  explanation: In Colorado, drivers must yield to pedestrians in both marked and unmarked
    crosswalks at intersections.
- id: 160
  category: sharing_the_road
  question: When following a large truck, why should you increase your following distance
    more than you would for a passenger car?
  choices:
    A: To allow the truck driver to see you in their rear-view mirrors
    B: Because trucks always drive slower than the speed limit
    C: Because trucks are required to stop at all railroad crossings
    D: To prevent the truck from rolling backward into you
  answer: A
  explanation: If you follow a truck too closely, you are in the driver's rear blind
    spot (No-Zone). Increasing your distance ensures the truck driver can see you
    in their side mirrors.
- id: 161
  category: sharing_the_road
  question: 'Under Colorado law, bicyclists are allowed to ride two abreast (side-by-side)
    only if:'
  choices:
    A: They are in a designated bike race
    B: They do not impede the normal and reasonable movement of traffic
    C: It is after sunset
    D: They are on a sidewalk
  answer: B
  explanation: Colorado law (CRS 42-4-1412) allows bicyclists to ride two abreast
    as long as they do not impede the reasonable flow of traffic. If they are impeding
    traffic, they must ride single file.
- id: 162
  category: sharing_the_road
  question: 'Failure to yield to an emergency vehicle (Move Over Law violation) in
    Colorado that results in the injury of another person is classified as:'
  choices:
    A: A Class 1 misdemeanor traffic offense
    B: A minor traffic infraction
    C: A Class 2 felony
    D: A non-point offense
  answer: A
  explanation: While a standard Move Over violation is a Class A traffic infraction,
    if the violation results in bodily injury to another person, it is elevated to
    a Class 1 misdemeanor traffic offense.
- id: 163
  category: sharing_the_road
  question: 'In Colorado, when a school bus is stopped with its red lights flashing
    and stop arm extended, you must stop unless:'
  choices:
    A: You are traveling in the opposite direction on a highway with at least two
      lanes in each direction.
    B: You are traveling in the opposite direction on a road separated by a physical
      median or grass strip.
    C: You are at least 100 feet away from the bus.
    D: The bus driver signals you to pass.
  answer: B
  explanation: According to the Colorado Driver Handbook, you must stop for a school
    bus with flashing red lights unless you are traveling in the opposite direction
    on a multi-lane highway that is divided by a median or other physical barrier.
- id: 164
  category: sharing_the_road
  question: 'Colorado''s ''Move Over'' law requires drivers approaching a stationary
    emergency, tow, or maintenance vehicle with flashing lights to:'
  choices:
    A: Stop completely until the vehicle moves.
    B: Maintain speed but move to the left lane.
    C: Move over at least one lane if safe, or slow down significantly if moving over
      is not possible.
    D: Honk to alert the workers of your presence.
  answer: C
  explanation: Colorado law requires drivers to move over one lane when approaching
    stationary emergency or maintenance vehicles. If moving over is not safe or possible,
    the driver must reduce speed to at least 20 mph below the posted limit (or to
    25 mph if the limit is 45 mph or less).
- id: 165
  category: sharing_the_road
  question: In Colorado, if a pedestrian is crossing the street at an intersection
    without a marked crosswalk, who has the right of way?
  choices:
    A: The motorist, because there is no painted crosswalk.
    B: The pedestrian, as every intersection is considered an 'unmarked crosswalk'.
    C: The motorist, unless the pedestrian is using a white cane.
    D: The pedestrian, but only if they are crossing a one-way street.
  answer: B
  explanation: Colorado law dictates that pedestrians have the right of way at all
    intersections, whether the crosswalk is marked or unmarked.
- id: 166
  category: sharing_the_road
  question: 'When an emergency vehicle with sirens and flashing lights is approaching
    from behind, Colorado law requires you to:'
  choices:
    A: Stop exactly where you are in your lane.
    B: Speed up to get out of the way.
    C: Pull as far to the right as possible and stop.
    D: Move to the left shoulder and stop.
  answer: C
  explanation: Drivers must yield the right of way to emergency vehicles by pulling
    to the right-hand edge or curb of the roadway and stopping until the vehicle has
    passed.
- id: 167
  category: sharing_the_road
  question: In Colorado, what is the point penalty assessed against your driver's
    license for a first offense of failing to stop for a school bus?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Failing to stop for a school bus with its red lights flashing is a
    serious offense in Colorado and results in 6 points being added to the driver's
    record.
- id: 168
  category: sharing_the_road
  question: 'When a bicyclist is preparing to make a left turn at an intersection,
    they are legally allowed to:'
  choices:
    A: Only turn from the far right side of the road.
    B: Dismount and walk the bike across the crosswalk only.
    C: Use the left-turn lane just like a motor vehicle.
    D: Turn left from the sidewalk only.
  answer: C
  explanation: Bicyclists have the same rights and duties as motorists in Colorado.
    They may move into the left-turn lane or the center of the lane to prepare for
    a left turn.
- id: 169
  category: sharing_the_road
  question: Why should you avoid pulling up into the space on the right side of a
    large truck at an intersection?
  choices:
    A: Trucks have a 'No-Zone' on the right side and may need to swing wide to the
      left to make a right turn.
    B: Trucks are legally required to turn from the left lane only.
    C: The exhaust fumes are more concentrated on the right side.
    D: It is illegal to pass any vehicle on the right in Colorado.
  answer: A
  explanation: Large trucks often need to swing wide to the left to clear the curb
    when making a right turn. If you are in the 'No-Zone' on their right, the driver
    cannot see you and you may be squeezed between the truck and the curb.
- id: 170
  category: sharing_the_road
  question: 'Under Colorado law, you must yield the right of way to any pedestrian
    who is:'
  choices:
    A: Wearing a bright yellow jacket.
    B: Using a white cane or a guide dog.
    C: Crossing the street against a 'Don't Walk' signal.
    D: Walking on the shoulder of a rural highway.
  answer: B
  explanation: Colorado law requires drivers to come to a complete stop and yield
    to any pedestrian who is blind or visually impaired and carrying a white cane
    or using a guide dog.
- id: 171
  category: sharing_the_road
  question: 'A violation of Colorado''s ''Move Over'' law that does not result in
    injury is classified as a:'
  choices:
    A: Class A Traffic Infraction
    B: Class 2 Misdemeanor Traffic Offense
    C: Class 1 Felony
    D: Petty Offense
  answer: B
  explanation: Violating the Move Over law (C.R.S. 42-4-705) is a Class 2 misdemeanor
    traffic offense in Colorado. If it results in an injury, the penalties become
    significantly more severe.
- id: 172
  category: sharing_the_road
  question: 'In Colorado, bicycles ridden at night must be equipped with a front lamp
    emitting a white light visible from a distance of at least:'
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Colorado law requires bicycles to have a white front light visible
    from 500 feet and a red rear reflector or light visible from 600 feet when riding
    between sunset and sunrise.
- id: 173
  category: vehicle_information
  question: In Colorado, you must use your headlights between sunset and sunrise and
    at any other time when you cannot see clearly for at least how many feet?
  choices:
    A: 500 feet
    B: 1,000 feet
    C: 1,500 feet
    D: 2,000 feet
  answer: B
  explanation: Colorado law requires headlights to be on from sunset to sunrise and
    whenever visibility is less than 1,000 feet due to weather or other conditions.
- id: 174
  category: vehicle_information
  question: Which of the following equipment is required by Colorado law to be on
    all vehicles to reduce engine noise and prevent excessive smoke?
  choices:
    A: A catalytic converter
    B: A muffler
    C: A turbocharger
    D: An air filter
  answer: B
  explanation: Colorado law requires every motor vehicle to be equipped with a muffler
    in good working order to prevent unusual or excessive noise and smoke. Muffler
    cutouts or bypasses are illegal.
- id: 175
  category: vehicle_information
  question: According to Colorado law, what is the light transmission requirement
    for window tinting on the front side windows if the windshield is also tinted?
  choices:
    A: At least 20% light transmission
    B: At least 50% light transmission
    C: At least 70% light transmission
    D: At least 35% light transmission
  answer: C
  explanation: In Colorado, if the windshield is tinted (top 4 inches only), the front
    side windows must allow at least 70% of light to pass through. If the windshield
    is not tinted, the side windows may be as dark as 27%.
- id: 176
  category: vehicle_information
  question: In Colorado, if a load extends more than how many feet beyond the rear
    of a vehicle, a red flag (day) or red light (night) must be attached to the end
    of the load?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: C
  explanation: Colorado law requires a red flag (at least 12 inches square) during
    the day or a red light at night if a load extends 4 feet or more beyond the rear
    of the vehicle's body.
- id: 177
  category: vehicle_information
  question: Colorado law requires your vehicle's horn to be audible from a distance
    of at least how many feet?
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: Every motor vehicle in Colorado must be equipped with a horn capable
    of emitting sound audible under normal conditions from a distance of not less
    than 200 feet.
- id: 178
  category: vehicle_information
  question: In Colorado, every motor vehicle must be equipped with at least one mirror
    that allows the driver to see the highway for a distance of at least how many
    feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Colorado law requires vehicles to have mirrors that provide a view
    of the highway for at least 200 feet to the rear of the vehicle.
- id: 179
  category: vehicle_information
  question: Under the Colorado Passenger Vehicle Chain Law (Code 16), what are unequipped
    passenger vehicles (those without 4WD/AWD or proper tires) required to carry?
  choices:
    A: Extra blankets and water
    B: A shovel and sand
    C: Chains or an approved alternative traction device
    D: A full-size spare tire
  answer: C
  explanation: When Code 16 is implemented, all passenger vehicles must have chains
    or an approved alternative traction device (like AutoSock) for at least two drive
    tires, regardless of tire type or drive system.
- id: 180
  category: vehicle_information
  question: In Colorado, which of the following is true regarding the use of a vehicle's
    parking brake?
  choices:
    A: It is only required for vehicles with manual transmissions.
    B: It must be able to hold the vehicle on any grade on which it is operated.
    C: It is only required when parking on a hill steeper than 15 degrees.
    D: It must be applied only when the engine is turned off.
  answer: B
  explanation: Colorado law requires all motor vehicles to have a service brake and
    a parking brake. The parking brake must be adequate to hold the vehicle on any
    grade on which it is operated.
- id: 181
  category: vehicle_information
  question: In which of the following Colorado areas is an emissions test generally
    required for vehicle registration?
  choices:
    A: Only in the City of Aspen
    B: In the Denver-Boulder metropolitan area and the North Front Range
    C: Only for vehicles older than 25 years statewide
    D: Only for diesel vehicles in El Paso County
  answer: B
  explanation: The Automobile Inspection and Readjustment (AIR) program requires emissions
    testing in the Denver metro area (including Boulder, Broomfield, Denver, Douglas,
    and Jefferson counties) and parts of Adams, Arapahoe, Larimer, and Weld counties.
- id: 182
  category: vehicle_information
  question: What does Colorado law state regarding objects hanging from the rearview
    mirror or stickers on the windshield?
  choices:
    A: They are legal as long as they are smaller than 5 inches.
    B: They are legal only if they are official state park passes.
    C: They are prohibited if they obstruct the driver's clear view through the windshield.
    D: They are only prohibited for drivers under the age of 18.
  answer: C
  explanation: Colorado law prohibits any person from driving a vehicle with any sign,
    poster, or other non-transparent material upon the front windshield, side wings,
    or side or rear windows which obstructs the driver's clear view.
- id: 183
  category: vehicle_information
  question: In Colorado, brake lights must be visible from a distance of at least
    how many feet to the rear in normal sunlight?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Colorado law requires that stop lamps (brake lights) must be visible
    from a distance of not less than 100 feet to the rear in normal sunlight.
- id: 184
  category: vehicle_information
  question: In Colorado, you must turn on your headlights if you cannot see clearly
    for a distance of at least how many feet ahead?
  choices:
    A: 500 feet
    B: 1,000 feet
    C: 1,500 feet
    D: 2,000 feet
  answer: B
  explanation: Colorado law requires headlights to be turned on between sunset and
    sunrise and at any other time when visibility is less than 1,000 feet.
- id: 185
  category: vehicle_information
  question: 'According to Colorado law, the rear registration plate (license plate)
    must be illuminated so that it is clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Colorado law requires a white light to illuminate the rear license
    plate so that it is clearly legible from a distance of 50 feet to the rear.
- id: 186
  category: vehicle_information
  question: What is the minimum light transmission allowed for window tinting on the
    front side windows of a vehicle in Colorado?
  choices:
    A: 20%
    B: 27%
    C: 35%
    D: 70%
  answer: B
  explanation: Colorado law specifies that the front side windows (to the left and
    right of the driver) must allow at least 27% of light to pass through.
- id: 187
  category: vehicle_information
  question: In Colorado, every child under what age and weight must be properly restrained
    in a rear-facing child restraint system?
  choices:
    A: Under 1 year old and less than 20 pounds
    B: Under 2 years old and less than 30 pounds
    C: Under 4 years old and less than 40 pounds
    D: Under 6 months old and less than 15 pounds
  answer: A
  explanation: Colorado law requires children to be in a rear-facing child safety
    seat until they are at least 1 year old and weigh at least 20 pounds.
- id: 188
  category: vehicle_information
  question: 'If your vehicle''s view to the rear is obstructed by a trailer or load,
    Colorado law requires you to have:'
  choices:
    A: A passenger to act as a spotter
    B: A wide-angle rearview mirror
    C: Both left and right outside mirrors
    D: A backup camera system
  answer: C
  explanation: If the internal rearview mirror is obstructed, Colorado law requires
    the vehicle to be equipped with both left and right side-view mirrors that provide
    a view of the highway for at least 200 feet to the rear.
- id: 189
  category: vehicle_information
  question: In Colorado counties that require emissions testing, how often must most
    vehicles (older than 7 years) typically undergo an emissions inspection?
  choices:
    A: Every year
    B: Every two years
    C: Every five years
    D: Only when the vehicle is sold
  answer: B
  explanation: In the Colorado emissions program areas (such as Denver and Boulder),
    most gasoline-powered vehicles older than 7 years must pass an emissions test
    every two years.
- id: 190
  category: vehicle_information
  question: Under normal (non-Traction Law) conditions in Colorado, what is the minimum
    legal tread depth for tires?
  choices:
    A: 1/32 inch
    B: 2/32 inch
    C: 3/32 inch
    D: 4/32 inch
  answer: B
  explanation: For standard driving conditions in Colorado, tires are considered unsafe
    and illegal if the tread is less than 2/32 of an inch.
- id: 191
  category: vehicle_information
  question: Which of the following is true regarding Colorado's seat belt law for
    occupants under the age of 18?
  choices:
    A: It is a secondary enforcement law
    B: It is a primary enforcement law
    C: Seat belts are only required in the front seat
    D: Seat belts are optional if the vehicle has airbags
  answer: B
  explanation: While seat belt use for adults in Colorado is secondary enforcement,
    it is a primary enforcement law for all occupants under 18 years of age, meaning
    a driver can be pulled over solely for this violation.
- id: 192
  category: vehicle_information
  question: 'Regarding vehicle exhaust systems, Colorado law specifically prohibits
    the use of:'
  choices:
    A: Catalytic converters
    B: Dual exhaust pipes
    C: Muffler cutouts or bypasses
    D: Chrome-plated tailpipes
  answer: C
  explanation: Colorado law prohibits the use of muffler cutouts, bypasses, or similar
    devices that increase noise or prevent the effective reduction of exhaust noise.
- id: 193
  category: vehicle_information
  question: 'In Colorado, a ''Slow Moving Vehicle'' emblem must be displayed on the
    rear of any vehicle that is not capable of maintaining a speed higher than:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: The triangular orange 'Slow Moving Vehicle' emblem is required for
    vehicles designed to travel at speeds of 25 mph or less.
- id: 194
  category: signs_and_signals
  question: 'A diamond-shaped marking in the center of a lane indicates that the lane
    is:'
  choices:
    A: Reserved for heavy trucks only.
    B: A high-occupancy vehicle (HOV) or restricted lane.
    C: A designated emergency pull-off area.
    D: A lane that ends in 500 feet.
  answer: B
  explanation: In Colorado, diamond-shaped pavement markings are used to indicate
    restricted lanes, such as HOV lanes for vehicles with multiple occupants, buses,
    or motorcycles.
- id: 195
  category: signs_and_signals
  question: If your vehicle's turn signals fail, what is the correct hand signal to
    indicate a left turn?
  choices:
    A: Arm extended straight out the window.
    B: Arm bent upward at a 90-degree angle.
    C: Arm bent downward at a 90-degree angle.
    D: Arm waving in a circular motion.
  answer: A
  explanation: To signal a left turn using hand signals in Colorado, you must extend
    your left arm horizontally out the window.
- id: 196
  category: signs_and_signals
  question: What is the meaning of a fluorescent pink traffic sign in Colorado?
  choices:
    A: School zone ahead.
    B: Public recreation and parks.
    C: Incident management (accidents or emergency scenes).
    D: Pedestrian crossing.
  answer: C
  explanation: Fluorescent pink signs are used specifically for incident management
    to warn drivers of accidents, floods, or other temporary emergency situations.
- id: 197
  category: signs_and_signals
  question: When you see a sign indicating 'Chain Law in Effect,' what does this mean
    for passenger vehicles in Colorado?
  choices:
    A: Only commercial trucks must have chains.
    B: All vehicles must have chains or alternative traction devices on all four tires.
    C: Vehicles must have snow tires, all-weather tires (M+S), or chains/traction
      devices as specified by the current 'Code'.
    D: The road is closed to all traffic except emergency responders.
  answer: C
  explanation: Colorado's Passenger Vehicle Traction Law (Code 15) requires all motorists
    to have 3/16" tread depth and either all-season tires (M+S), winter tires, or
    traction devices when the law is active.
- id: 198
  category: signs_and_signals
  question: 'A steady yellow traffic light means:'
  choices:
    A: Accelerate to clear the intersection before the light turns red.
    B: Stop immediately, even if you are in the middle of the intersection.
    C: The signal is getting ready to turn red; clear the intersection or stop if
      you can do so safely.
    D: Pedestrians have the right-of-way to enter the crosswalk.
  answer: C
  explanation: A steady yellow light indicates the signal is changing to red. Colorado
    law requires drivers to stop if it is safe to do so; otherwise, they should clear
    the intersection.
- id: 199
  category: signs_and_signals
  question: What do double solid white lines painted on the pavement indicate?
  choices:
    A: You may cross the lines to pass slower traffic.
    B: Separation of lanes moving in opposite directions.
    C: Lane changes are prohibited.
    D: You are approaching a railroad crossing.
  answer: C
  explanation: Double solid white lines indicate that lane changes are prohibited.
    These are often seen near tunnel entrances or Express Lane boundaries in Colorado.
- id: 200
  category: signs_and_signals
  question: 'In Colorado, if you see a stationary emergency vehicle with flashing
    lights on the side of a multi-lane highway, you must:'
  choices:
    A: Stop and wait for instructions from the officer.
    B: Maintain your speed and stay in your current lane.
    C: Move over at least one lane away from the vehicle if safe, or slow down significantly.
    D: Turn on your high beams to alert other drivers.
  answer: C
  explanation: Colorado's 'Move Over' law requires drivers to move over a lane when
    passing stationary emergency, tow, or maintenance vehicles with flashing lights.
    If moving over is not possible, the driver must slow down.
- id: 201
  category: signs_and_signals
  question: A 'Wrong Way' sign is typically what color combination?
  choices:
    A: Yellow and Black
    B: White and Black
    C: Red and White
    D: Orange and Black
  answer: C
  explanation: Regulatory signs that prohibit certain actions, such as 'Wrong Way'
    or 'Do Not Enter,' use a red and white color scheme.
- id: 202
  category: signs_and_signals
  question: What does a flashing red light at an intersection mean in Colorado?
  choices:
    A: Slow down and proceed with caution.
    B: The light is broken; treat it as a yellow light.
    C: Stop completely and proceed only when it is safe to do so, treating it like
      a stop sign.
    D: Yield to all traffic coming from the right only.
  answer: C
  explanation: A flashing red light has the same meaning as a stop sign. You must
    come to a complete stop and yield the right-of-way before proceeding.
- id: 203
  category: signs_and_signals
  question: 'Green pavement markings in some Colorado urban areas are used to identify:'
  choices:
    A: Electric vehicle charging zones.
    B: Bicycle lanes or areas where paths for bicycles and vehicles cross.
    C: Parking zones for residents only.
    D: Eco-friendly carpool lanes.
  answer: B
  explanation: Colorado uses green pavement markings to increase the visibility of
    bike lanes and highlight potential 'conflict' areas where motorists and cyclists
    cross paths.
- id: 204
  category: signs_and_signals
  question: What does a solid yellow line on your side of the center dash line mean?
  choices:
    A: You may pass if there is no oncoming traffic.
    B: You are in a construction zone.
    C: Passing is prohibited on your side.
    D: The road ahead is a one-way street.
  answer: C
  explanation: A solid yellow line on your side of the center line indicates a 'no-passing
    zone' for your direction of travel.
- id: 205
  category: signs_and_signals
  question: 'When you see a ''Shared Center Turn Lane'' (marked by solid and broken
    yellow lines on both sides), this lane can be used for:'
  choices:
    A: Passing slower vehicles.
    B: Making left turns only.
    C: Making right turns only.
    D: Emergency parking only.
  answer: B
  explanation: Shared center turn lanes are reserved for vehicles making left turns
    from either direction. They are not to be used for passing or through-travel.
- id: 206
  category: signs_and_signals
  question: 'In Colorado, a sign with an orange background and black letters/symbols
    indicates:'
  choices:
    A: General warning of road hazards.
    B: Regulatory information.
    C: Construction or maintenance work zones.
    D: Directional guidance to state parks.
  answer: C
  explanation: Orange is the standard color for work zone signs, alerting drivers
    to construction, maintenance, or utility operations ahead.
- id: 207
  category: signs_and_signals
  question: What does a flashing yellow arrow signal mean at a Colorado intersection?
  choices:
    A: Stop and wait for a green arrow
    B: The signal is about to turn red; clear the intersection
    C: Turns are allowed, but you must yield to oncoming traffic and pedestrians
    D: You have the right-of-way to turn left
  answer: C
  explanation: In Colorado, a flashing yellow arrow means turns are permitted after
    yielding to oncoming traffic and pedestrians. Oncoming traffic has a green light.
- id: 208
  category: signs_and_signals
  question: Under Colorado law, what do double solid yellow lines in the center of
    the road signify?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on the right
    C: Passing is prohibited in both directions
    D: The road is a one-way street
  answer: C
  explanation: Double solid yellow lines mean that passing is not allowed for vehicles
    traveling in either direction.
- id: 209
  category: signs_and_signals
  question: In Colorado, what is the specific meaning of a 'sharrow' pavement marking
    (a bicycle symbol with two chevrons above it)?
  choices:
    A: Bicycles are prohibited on this roadway
    B: The lane is reserved exclusively for bicycles
    C: Motorists should expect bicycles and may share the lane
    D: Bicycles must stay on the shoulder
  answer: C
  explanation: A sharrow indicates a shared-lane marking, alerting motorists that
    bicyclists may occupy the full lane and helping bicyclists position themselves
    safely.
- id: 210
  category: signs_and_signals
  question: When you see a 'Traction Law' (Code 15) sign active in Colorado mountains,
    what is the minimum required tread depth for tires on all-wheel drive vehicles?
  choices:
    A: 1/16 inch
    B: 2/32 inch
    C: 3/16 inch
    D: 4/32 inch
  answer: C
  explanation: Under Colorado's Passenger Vehicle Traction Law, all vehicles must
    have tires with at least 3/16 inch tread depth when the law is in effect.
- id: 211
  category: signs_and_signals
  question: In Colorado, what does a solid white line painted on the pavement between
    lanes of traffic mean?
  choices:
    A: You are approaching a school zone
    B: Lane changes are discouraged or restricted
    C: The road is changing from two-way to one-way
    D: You must come to a complete stop
  answer: B
  explanation: A solid white line indicates that lane changes are discouraged due
    to potential hazards, though not strictly illegal unless accompanied by specific
    signage or in certain zones.
- id: 212
  category: signs_and_signals
  question: 'In Colorado, a circular yellow sign with a black ''X'' and the letters
    ''RR'' is a:'
  choices:
    A: Regulatory sign
    B: Railroad advance warning sign
    C: Wrong way sign
    D: Road closed sign
  answer: B
  explanation: The circular yellow sign with a black 'X' and 'RR' is the advance warning
    sign that you are approaching a railroad crossing.
- id: 213
  category: signs_and_signals
  question: According to the Colorado Driver Handbook, when are you permitted to turn
    left on a red light?
  choices:
    A: Never
    B: Only when turning from a one-way street onto another one-way street
    C: Anytime there is no oncoming traffic
    D: Only if a police officer signals you to do so
  answer: B
  explanation: In Colorado, you may turn left on a red light only when turning from
    a one-way street onto another one-way street, after coming to a complete stop
    and yielding to traffic and pedestrians.
- id: 214
  category: signs_and_signals
  question: In Colorado, what does a diamond-shaped symbol painted on a lane indicate?
  choices:
    A: The lane is for emergency vehicles only
    B: The lane is reserved for high-occupancy vehicles (HOV) or specific types of
      traffic
    C: The lane is ending soon
    D: The lane is for slow-moving vehicles only
  answer: B
  explanation: The diamond symbol marks restricted lanes, such as HOV lanes for buses
    and carpools, or Express Lanes in Colorado.
- id: 215
  category: signs_and_signals
  question: What is the standard shape of a school zone advance warning sign in Colorado?
  choices:
    A: Diamond
    B: Octagon
    C: Pentagon (five-sided)
    D: Triangle
  answer: C
  explanation: School zone and school crossing signs are pentagon-shaped (five-sided)
    and are usually fluorescent yellow-green.
- id: 216
  category: signs_and_signals
  question: When approaching a stationary emergency vehicle with flashing lights on
    a Colorado highway with at least two lanes in each direction, what does the 'Move
    Over' law require you to do?
  choices:
    A: Stop immediately in your lane
    B: Maintain speed but honk your horn
    C: Move to a lane that is not adjacent to the emergency vehicle if safe to do
      so
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: Colorado's Move Over law requires drivers to move over at least one
    lane when passing stationary emergency, tow, or maintenance vehicles. If moving
    over is unsafe, the driver must slow down significantly.
- id: 217
  category: signs_and_signals
  question: 'A flashing yellow light at an intersection means:'
  choices:
    A: Stop and wait for the light to turn green
    B: Speed up to clear the intersection
    C: Proceed with caution
    D: Treat it as a stop sign
  answer: C
  explanation: A flashing yellow light is a warning to proceed with caution, usually
    indicating a hazard or a cross-street that must stop.
- id: 218
  category: signs_and_signals
  question: In Colorado, what color are regulatory signs that provide information
    about speed limits and parking?
  choices:
    A: Yellow with black lettering
    B: Orange with black lettering
    C: White with black lettering
    D: Green with white lettering
  answer: C
  explanation: Regulatory signs, which tell you what you must or must not do (like
    speed limits), are typically rectangular and white with black lettering.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 219
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 220
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 221
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 222
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 223
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 224
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 225
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 226
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 227
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 228
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 229
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
