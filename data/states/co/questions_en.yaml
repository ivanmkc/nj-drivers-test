metadata:
  source: Colorado Driver Handbook (DR 2337, January 2025)
  total_questions: 255
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: How old must you be to operate a motor vehicle, motor-driven cycle, or
    moped on Colorado's public streets and highways?
  choices:
    A: '15'
    B: '16'
    C: '18'
    D: '21'
  answer: B
  explanation: According to the manual, anyone who operates a motor vehicle, motor-driven
    cycle or moped on Colorado's public streets and highways must be 16 or older.
- id: 2
  category: license_system
  question: If you become a resident of Colorado, within how many days must you obtain
    a Colorado driver license?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: You must get a Colorado driver license within 30 days of becoming a
    resident unless you meet specific military or education exceptions.
- id: 3
  category: license_system
  question: Which of the following establishes you as a resident of Colorado for driver
    licensing purposes?
  choices:
    A: Residing within the state continuously for 90 days
    B: Visiting the state for a 2-week vacation
    C: Passing through the state on a cross-country trip
    D: Having a relative who lives in Colorado
  answer: A
  explanation: You are considered a resident if you own or operate a business in Colorado,
    have resided within the state continuously for 90 days, or have gainful employment
    within the state.
- id: 4
  category: driver_responsibility
  question: How many days do you have to notify the DMV if you change your name or
    address?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: If you have a change to your address or name you must notify the Division
    of Motor Vehicles within 30 days.
- id: 5
  category: driver_testing
  question: When planning to take the driving knowledge (written) test at a DMV office,
    what time restriction should you keep in mind?
  choices:
    A: Tests are only given in the morning.
    B: Tests are not given within 30 minutes of an office's scheduled closing time.
    C: Tests must be completed within 15 minutes.
    D: Tests are only administered on weekends.
  answer: B
  explanation: Written tests are not given within 30 minutes of an office's scheduled
    closing time.
- id: 6
  category: license_system
  question: When driving with an instruction permit, who must be seated in the front
    passenger seat?
  choices:
    A: Any licensed driver 18 years or older.
    B: A person 21 years or older who has a valid Colorado license.
    C: A parent or guardian, regardless of whether they have a license.
    D: A certified driving instructor only.
  answer: B
  explanation: When you are driving with an instruction permit, you must have a person
    who is 21 years or older who has a valid Colorado license in the front passenger
    seat.
- id: 7
  category: driver_testing
  question: Who primarily administers the Driving Skills Test (drive test) in Colorado?
  choices:
    A: State driver license offices
    B: Certified Commercial Driving Schools
    C: Local police departments
    D: The Colorado State Patrol
  answer: B
  explanation: Drive tests are primarily being given by Certified Commercial Driving
    Schools, as you cannot currently schedule a drive test at a State driver license
    office.
- id: 8
  category: driver_testing
  question: If you provide the vehicle for your drive test, what documentation must
    the vehicle have?
  choices:
    A: A recent emissions test certificate
    B: Current insurance and registration
    C: A bill of sale
    D: A manufacturer's warranty
  answer: B
  explanation: If you provide the vehicle for the drive test, it must have current
    insurance and registration.
- id: 9
  category: driver_testing
  question: Which of the following is checked by the examiner for safety before a
    drive test begins?
  choices:
    A: The air conditioning system
    B: The radio volume
    C: Whether the vehicle's doors and windows open from the inside
    D: The engine oil level
  answer: C
  explanation: The examiner will check the vehicle for safety, including whether the
    vehicle's doors and windows open from inside the automobile.
- id: 10
  category: driver_testing
  question: Who is allowed in the vehicle during a drive test?
  choices:
    A: The driver, the examiner, and one family member
    B: Only the driver and the examiner
    C: The driver, the examiner, and a translator if needed
    D: The driver, the examiner, and a pet for emotional support
  answer: B
  explanation: For safety reasons, only the driver and the examiner are allowed in
    the vehicle during the test. Interpreters/Translators, family, friends or pets
    are not allowed.
- id: 11
  category: driver_testing
  question: What must you do with electronic devices and objects in your vehicle before
    taking the drive test?
  choices:
    A: Turn them on so the examiner can test them.
    B: Leave them as they are.
    C: Turn off electronic devices and remove objects from the dashboard and rearview
      mirror.
    D: Place all objects on the passenger seat.
  answer: C
  explanation: You must turn off any electronic devices in your vehicle, including
    the radio and your cell phone, and remove objects from the dashboard and the rearview
    mirror before taking the drive test.
- id: 12
  category: driver_testing
  question: If you fail the drive test, how long must you wait before retaking it?
  choices:
    A: You can retake it immediately.
    B: Until the next business day.
    C: One full week.
    D: 30 days.
  answer: B
  explanation: If you fail the drive test, you must wait until the next business day
    before retaking the test.
- id: 13
  category: license_system
  question: Which of the following individuals is exempt from the requirement to get
    a Colorado driver license within 30 days of becoming a resident?
  choices:
    A: Someone who just bought a house in Colorado.
    B: Someone who started a new full-time job in Denver.
    C: Someone serving on active duty in the U.S. military.
    D: Someone who has lived in the state continuously for 90 days.
  answer: C
  explanation: You must get a license within 30 days unless you are serving on active
    duty in the U.S. military, are a dependent of an active duty member, or are residing
    in Colorado for the principal purpose of furthering your education.
- id: 14
  category: driver_testing
  question: During the drive test, what will the examiner ask you to do?
  choices:
    A: Perform illegal maneuvers to test your awareness.
    B: Demonstrate legal and safe driving practices.
    C: Drive above the speed limit to test vehicle control.
    D: Answer written questions while driving.
  answer: B
  explanation: The drive test measures your skill and knowledge of legal and safe
    driving practices. You will not be asked to do anything illegal.
- id: 15
  category: license_system
  question: According to the manual, which of the following services can be completed
    using DMV online services?
  choices:
    A: Taking the driving skills (drive) test.
    B: Paying a reinstatement fee.
    C: Getting a vehicle emissions inspection.
    D: Purchasing a new vehicle.
  answer: B
  explanation: The list of DMV online services includes 'Pay a Reinstatement Fee'
    among other options like renewing a license or paying a citation.
- id: 16
  category: driver_testing
  question: What must you do if you fail the drive test?
  choices:
    A: Retake it immediately
    B: Wait until the next business day
    C: Wait one week
    D: Complete 6 more hours of training
  answer: B
  explanation: According to the manual, if you fail the drive test, you must wait
    until the next business day before retaking the test.
- id: 17
  category: driver_testing
  question: When taking the drive test, what is the rule regarding backup cameras
    and blind spot warnings?
  choices:
    A: They must be turned off completely.
    B: They are allowed but do not take the place of physical searching skills.
    C: They can be used as a complete replacement for looking over your shoulder.
    D: They are only allowed for drivers over the age of 18.
  answer: B
  explanation: The manual states that the use of safety-critical technologies such
    as back-up cameras and blind spot warnings are allowed during the test, but they
    do not take the place of physical searching skills.
- id: 18
  category: safe_driving_rules
  question: How far in advance must you turn on your turn signal before turning or
    changing lanes on a 4-lane highway?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: C
  explanation: Turn signals must be turned on continuously 200 feet before turning
    or changing lanes on 4-lane highways.
- id: 19
  category: safe_driving_rules
  question: When stopped behind another vehicle at an intersection, what is considered
    an adequate distance?
  choices:
    A: One car length
    B: When you can see the rear bumper of the vehicle in front of you
    C: When you can see the rear wheels touching the ground of the vehicle in front
      of you
    D: 10 feet
  answer: C
  explanation: You are at an adequate distance if you can see the rear wheels touching
    the ground of the vehicle in front of you.
- id: 20
  category: license_system
  question: If you are under 18, who must sign the Affidavit of Liability and Guardianship?
  choices:
    A: A driving instructor
    B: A notary public only
    C: A parent, legal guardian, or other responsible adult willing to accept legal
      liability
    D: A school principal
  answer: C
  explanation: The application must be accompanied by an Affidavit of Liability signed
    by a parent, stepparent, grandparent with power of attorney, legal guardian, spouse
    older than 18, or any other responsible adult willing to accept legal liability.
- id: 21
  category: license_system
  question: How many hours of driving experience must a minor log before applying
    for a driver license?
  choices:
    A: 30 hours (5 at night)
    B: 40 hours (10 at night)
    C: 50 hours (10 at night)
    D: 60 hours (15 at night)
  answer: C
  explanation: Colorado law requires minors to submit a completed and signed driving
    log showing 50 hours of driving experience, 10 of which must have been at night.
- id: 22
  category: safe_driving_rules
  question: What is the passenger restriction for a minor driver during the first
    six months after their license is issued?
  choices:
    A: No passengers under 21, unless a parent or licensed adult driver is in the
      vehicle.
    B: One passenger under 21 is allowed.
    C: Only siblings are allowed in the vehicle.
    D: As many passengers as there are seat belts.
  answer: A
  explanation: For the first six months after your license is issued, you cannot have
    any passengers under 21, unless a parent or another licensed adult driver is in
    the vehicle (with exceptions for siblings and medical emergencies).
- id: 23
  category: safe_driving_rules
  question: What is the driving curfew for a licensed driver during their first year?
  choices:
    A: No driving between 10 p.m. and 6 a.m.
    B: No driving between midnight and 5 a.m.
    C: No driving between 11 p.m. and 5 a.m.
    D: No driving between midnight and 6 a.m.
  answer: B
  explanation: For your first year as a licensed driver, driving between midnight
    and 5 a.m. is not allowed unless accompanied by an instructor, parent, or legal
    guardian (with certain exceptions).
- id: 24
  category: penalties_and_points
  question: Which of the following is a reason your driving privilege may be suspended,
    revoked, or canceled?
  choices:
    A: Failing to pay a parking ticket
    B: Failing to pay ordered child support
    C: Getting a single speeding ticket for 5 mph over the limit
    D: Driving between midnight and 5 a.m. after your first year of licensing
  answer: B
  explanation: Failing to pay ordered child support is explicitly listed in the manual
    as a reason your driving privilege may be suspended, revoked, or canceled.
- id: 25
  category: safe_driving_rules
  question: Who is exempt from the Colorado seat belt law?
  choices:
    A: Front seat passengers
    B: Children under 16
    C: The driver of a delivery van while on the job
    D: Drivers on a 4-lane highway
  answer: C
  explanation: Exceptions to the seat belt law include emergency personnel, passenger/school
    buses, farm equipment, the driver of delivery vans while on the job, and anyone
    with a written medical statement.
- id: 26
  category: safe_driving_rules
  question: How must a child who is less than 2 years old and weighs less than 40
    pounds be secured in a vehicle?
  choices:
    A: In a forward-facing child restraint system in the rear seat
    B: In a rear-facing child restraint system in the rear seat
    C: In a booster seat in the front seat
    D: With a standard seat belt in the rear seat
  answer: B
  explanation: Children less than 2 years old and weighing less than 40 pounds must
    be properly secured in the rear seat of the vehicle in a rear-facing child restraint
    system.
- id: 27
  category: driver_testing
  question: During the drive test, how should your vehicle's wheels be positioned
    while waiting to make a turn at an intersection?
  choices:
    A: Pointed in the direction of the turn
    B: Pointed straight ahead until beginning to make the turn
    C: Turned slightly to the right
    D: Turned slightly to the left
  answer: B
  explanation: When stopping, you must keep the vehicle’s wheels pointed straight
    ahead while stopped, and do not turn the wheels until beginning to make the turn.
- id: 28
  category: driver_testing
  question: What approved methods of steering control are mentioned for lane management
    during the drive test?
  choices:
    A: One-handed steering and palm steering
    B: Hand-over-hand or push-pull-slide
    C: Ten-and-two or nine-and-three
    D: Underhand grip and overhand grip
  answer: B
  explanation: The manual specifies to use an approved method of steering control,
    which is hand-over-hand or push-pull-slide.
- id: 29
  category: penalties_and_points
  question: What happens if the person who signed a minor's Affidavit of Liability
    withdraws their signature?
  choices:
    A: The minor must pay a fine.
    B: The minor's permit or license will be canceled.
    C: The minor must complete 12 additional hours of driving.
    D: The minor is restricted to driving only during daylight hours.
  answer: B
  explanation: If the signer decides to no longer accept responsibility for your driving,
    that person may withdraw their signature and your permit/license will be canceled.
- id: 30
  category: safe_driving_rules
  question: When approaching an intersection, what searching pattern should you use
    before entering?
  choices:
    A: Look right, then left
    B: Look straight ahead only
    C: Look left, right, left
    D: Look right, left, right
  answer: C
  explanation: The manual states under the 'Searching' grading factor that a driver
    must look left, right, left before entering intersections.
- id: 31
  category: safe_driving_rules
  question: What is the requirement for children between 9 and 18 years old riding
    in a motor vehicle?
  choices:
    A: They must ride in a booster seat in the rear of the vehicle.
    B: They must be properly restrained in a seat belt or child restraint system.
    C: They are allowed to ride without a seat belt if they are in the back seat.
    D: They must sit in the front passenger seat with a seat belt.
  answer: B
  explanation: The manual states that children between 9 and 18 years old must be
    properly restrained in a seat belt or child restraint system according to the
    manufacturer's instructions.
- id: 32
  category: safe_driving_rules
  question: If a driver is younger than 18, what is the rule regarding the number
    of passengers allowed in the vehicle?
  choices:
    A: They can carry as many passengers as can comfortably fit in the vehicle.
    B: They are not allowed to carry any passengers under the age of 18.
    C: The number of passengers must not exceed the number of seat belts.
    D: They can carry up to three passengers regardless of the number of seat belts.
  answer: C
  explanation: According to the manual, the number of passengers in vehicles driven
    by persons younger than 18 must not exceed the number of seat belts.
- id: 33
  category: alcohol_drugs_health
  question: Which of the following is true regarding open containers in a motor vehicle
    on a public road?
  choices:
    A: It is lawful to possess an open container of marijuana if you have a medical
      card.
    B: It is unlawful to possess an open container of alcohol or marijuana in the
      passenger area.
    C: Open containers of alcohol are allowed if the driver's BAC is under 0.08%.
    D: Passengers may possess open containers of alcohol, but the driver may not.
  answer: B
  explanation: The manual explicitly states that it is unlawful for someone to either
    possess an open container of alcohol or possess an open container of marijuana
    while in the passenger area of a motor vehicle that is on a public road.
- id: 34
  category: alcohol_drugs_health
  question: According to Colorado law, what does Driving While Ability is Impaired
    (DWAI) mean?
  choices:
    A: The driver is substantially incapable of safe driving.
    B: The driver's Blood Alcohol Concentration is exactly 0.08%.
    C: The driver is impaired to the slightest degree.
    D: The driver has consumed multiple types of drugs simultaneously.
  answer: C
  explanation: The manual defines DWAI as meaning the driver is impaired to the slightest
    degree, whereas DUI means the driver is substantially incapable of safe driving.
- id: 35
  category: alcohol_drugs_health
  question: Which of the following factors does NOT affect a person's Blood Alcohol
    Concentration (BAC)?
  choices:
    A: The person's body weight
    B: Whether the alcohol consumed was beer, wine, or liquor
    C: The amount of time since the last drink was consumed
    D: The person's sex
  answer: B
  explanation: 'The manual states that a person''s BAC depends on amount consumed,
    body weight, time period of consumption, time since last drink, and sex. It explicitly
    notes: ''It does not make a difference whether a drink is beer, wine or liquor.'''
- id: 36
  category: alcohol_drugs_health
  question: On average, at what rate does a person's Blood Alcohol Concentration (BAC)
    drop per hour?
  choices:
    A: 0.010%
    B: 0.015%
    C: 0.020%
    D: 0.050%
  answer: B
  explanation: Once alcohol is in the bloodstream, the body eliminates it through
    normal bodily processes. On average, a person's BAC will drop by 0.015% per hour.
- id: 37
  category: penalties_and_points
  question: What is the penalty for a first conviction of Driving Under the Influence
    (DUI) for a driver 21 or older?
  choices:
    A: 8 points toward suspension and 2-180 days in jail
    B: 9 months license revocation and 5-365 days in jail
    C: 1 year license revocation and 10-365 days in jail
    D: 2 years license revocation and 60-365 days in jail
  answer: B
  explanation: According to Table 1, a 1st Driving Under the Influence (DUI) conviction
    carries a 9-month revocation, a $600-$1,000 fine, 5-365 days in jail, and 48-96
    hours of public service.
- id: 38
  category: penalties_and_points
  question: What happens if a person younger than 21 is convicted of buying or possessing
    alcohol, even if driving is not a factor?
  choices:
    A: They receive a warning for the first offense.
    B: They must pay a $500 fine but keep their driving privileges.
    C: They are subject to revocation of their driving privilege.
    D: They are required to install an ignition interlock device.
  answer: C
  explanation: 'The manual states: ''Anyone younger than 21 is convicted of buying
    or possessing alcohol is subject to revocation of their driving privilege even
    if driving is not a factor.'''
- id: 39
  category: alcohol_drugs_health
  question: Is the medicinal use of marijuana a valid defense for a DUI or DWAI charge?
  choices:
    A: Yes, if the driver has a valid medical marijuana card.
    B: Yes, but only for a DWAI charge, not a DUI.
    C: No, the fact that marijuana was used for medicinal purposes is not a defense.
    D: No, unless the driver's THC level is below 5 ng/ml.
  answer: C
  explanation: 'The manual explicitly states: ''The fact that marijuana or other drugs
    were used for medicinal purposes is not a defense for DUI or DWAI.'''
- id: 40
  category: alcohol_drugs_health
  question: What is the relationship between THC levels in the blood, breath, or saliva
    and the degree of individual impairment?
  choices:
    A: Higher THC levels always indicate a higher degree of impairment.
    B: There is no correlation between THC levels and the degree of individual impairment.
    C: Impairment is only present if THC levels exceed 5 ng/ml.
    D: THC levels in saliva are the most accurate measure of impairment.
  answer: B
  explanation: The manual notes that unlike with alcohol, 'there is no correlation
    between levels of Delta-9-Tetrahydrocannabinol (THC) in the blood, breath or oral
    fluid (or saliva sample) and the degree of individual impairment.'
- id: 41
  category: alcohol_drugs_health
  question: At what level of THC in the blood is there a permissible inference that
    a driver was DUI?
  choices:
    A: 2 nanograms per milliliter (ng/ml)
    B: 5 nanograms per milliliter (ng/ml)
    C: 8 nanograms per milliliter (ng/ml)
    D: 10 nanograms per milliliter (ng/ml)
  answer: B
  explanation: 'The manual states: ''There is a permissible inference that a driver
    was DUI if the driver''s blood contained 5 nanograms of THC per milliliter (ng/ml)
    of blood.'''
- id: 42
  category: alcohol_drugs_health
  question: What does Colorado data show regarding polydrug impairment compared to
    impairment by a single drug (other than alcohol)?
  choices:
    A: It is less common and less dangerous.
    B: It is more common and more dangerous.
    C: It is equally common but less dangerous.
    D: It rarely occurs in Colorado.
  answer: B
  explanation: According to the manual, 'Colorado's data shows that polydrug impairment
    is more common than impairment by any single drug other than alcohol, and also
    more dangerous.'
- id: 43
  category: driver_responsibility
  question: Under Colorado's Express Consent Law, what do you agree to when operating
    a motor vehicle in the state?
  choices:
    A: To allow law enforcement to search your vehicle without a warrant.
    B: To plead guilty to any alcohol-related driving offense.
    C: To take a chemical test to determine the presence of alcohol and/or drugs in
      your blood.
    D: To install an ignition interlock device if pulled over for speeding.
  answer: C
  explanation: Colorado has an express consent law, which means when you operate a
    motor vehicle in the state, you agree to take a chemical test to determine the
    presence of alcohol and/or drugs in your blood.
- id: 44
  category: penalties_and_points
  question: What is the penalty if you refuse to take a chemical test when suspected
    of impaired driving?
  choices:
    A: A 6-month license suspension and a $500 fine.
    B: A 1-year license revocation and a requirement to install an ignition interlock
      device for two years.
    C: A 2-year license revocation and 60 days in jail.
    D: 8 points added to your driving record and 24 hours of public service.
  answer: B
  explanation: If you refuse to take the test, your driver license will be revoked
    for one year and you will be required to install an ignition interlock device
    on any motor vehicle you drive for two years.
- id: 45
  category: penalties_and_points
  question: Does Colorado law allow a driver to plea bargain out of an alcohol or
    drug-related driving offense?
  choices:
    A: Yes, for a first-time DWAI offense only.
    B: Yes, if the driver's BAC was below 0.08%.
    C: No, Colorado law does not allow you to plea bargain out of an alcohol or drug
      related driving offense.
    D: No, unless the driver agrees to install an ignition interlock device.
  answer: C
  explanation: 'The manual explicitly states: ''Colorado law does not allow you to
    plea bargain out of an alcohol or drug related driving offense.'''
- id: 46
  category: safe_driving_rules
  question: Which of the following is true regarding wearing earphones while driving
    in Colorado?
  choices:
    A: You may wear earphones if the volume is kept low.
    B: You may not operate a motor vehicle while wearing earphones that cover both
      ears.
    C: Earphones are permitted only on highways.
    D: You may wear earphones if they are connected via Bluetooth.
  answer: B
  explanation: You may not operate a motor vehicle while wearing earphones. The definition
    of earphones include any device or headset which covers all or a portion of both
    ears.
- id: 47
  category: defensive_driving
  question: To prevent fatigue while driving, how often should you break up long driving
    periods?
  choices:
    A: Into one-hour segments
    B: Into two-hour segments
    C: Into three-hour segments
    D: Into four-hour segments
  answer: B
  explanation: Break long driving periods into two-hour segments. If you become drowsy,
    pull off the road and rest.
- id: 48
  category: driver_responsibility
  question: What is identified as the leading cause of driver error?
  choices:
    A: Speeding
    B: Driving under the influence
    C: Distractions
    D: Poor weather conditions
  answer: C
  explanation: Distractions are the leading cause of driver error. A distraction is
    anything that takes away your attention, even momentarily, from the task of driving.
- id: 49
  category: vehicle_information
  question: If your vehicle bounces, the steering wheel shakes, or the vehicle pulls
    to one side, what should you have a mechanic check?
  choices:
    A: The exhaust system
    B: The steering system
    C: The suspension system
    D: The tires
  answer: D
  explanation: If the vehicle bounces, the steering wheel shakes, or the vehicle pulls
    to one side, have a mechanic check your tires.
- id: 50
  category: vehicle_information
  question: Why is a leaky exhaust system particularly dangerous?
  choices:
    A: It significantly reduces fuel economy.
    B: It can cause the engine to stall in heavy traffic.
    C: Fumes from a leaky exhaust system can cause death in a very short time.
    D: It causes the vehicle to bounce excessively.
  answer: C
  explanation: Fumes from a leaky exhaust system can cause death in a very short time.
    Never run the motor in your garage or sit in the car with the motor running without
    opening a window.
- id: 51
  category: vehicle_information
  question: How should you position your head to properly adjust the passenger's side
    mirror?
  choices:
    A: Against the left side window
    B: Centered under the inside rearview mirror or just above the center console
    C: Leaning against the passenger seat headrest
    D: Looking directly over your right shoulder
  answer: B
  explanation: To adjust the passenger’s side mirror position your head so that it
    is centered under the inside rearview mirror or just above the center console.
    Set the mirror so you can just see the side of the car in the right side of the
    mirror.
- id: 52
  category: vehicle_information
  question: Why is it important to ensure there are no loose objects on the floor
    of your vehicle?
  choices:
    A: They can roll under the brake pedal or accelerator and interfere with safe
      driving.
    B: They will cause the vehicle to fail an emissions test.
    C: They can cause the suspension system to bounce excessively.
    D: They increase the vehicle's stopping distance.
  answer: A
  explanation: Ensure there are no objects on the floor that could roll under the
    brake pedal or accelerator and interfere with your safe driving.
- id: 53
  category: safe_driving_rules
  question: Regardless of your vehicle's make and model, where should your right foot
    be before starting the engine?
  choices:
    A: On the accelerator pedal
    B: On the floorboard
    C: On the clutch pedal
    D: On the brake pedal
  answer: D
  explanation: No matter your make and model, your right foot should be on the brake
    before starting the vehicle.
- id: 54
  category: safe_driving_rules
  question: When moving in reverse, which direction should you turn the steering wheel?
  choices:
    A: In the opposite direction you want the rear of the vehicle to move
    B: In the direction you want the vehicle to move
    C: Always to the right
    D: Always to the left
  answer: B
  explanation: The steering wheel is always turned in the direction you want the vehicle
    to move, whether moving forward or in reverse.
- id: 55
  category: safe_driving_rules
  question: What are the recommended hand positions on the outside of the steering
    wheel for better vehicle control?
  choices:
    A: 10 and 2 o'clock or 9 and 3 o'clock
    B: 3 and 9 o'clock or 4 and 8 o'clock
    C: 12 and 6 o'clock
    D: 11 and 1 o'clock
  answer: B
  explanation: You have better vehicle control when you place both hands on the outside
    of the steering wheel, on opposite sides, at the 3 and 9 o’clock positions or
    the 4 and 8 o’clock positions.
- id: 56
  category: safe_driving_rules
  question: When backing up your vehicle, where should you place your left hand on
    the steering wheel?
  choices:
    A: At the 3 o'clock position
    B: At the 6 o'clock position
    C: At the 9 o'clock position
    D: At the 12 o'clock position
  answer: D
  explanation: 'To safely back up your vehicle, you should: [...] Grasp the steering
    wheel at the 12 o’clock position with your left hand.'
- id: 57
  category: signs_and_signals
  question: In addition to traffic signals and signs, whose directions must you obey
    for traffic control?
  choices:
    A: Only law enforcement officers
    B: Law enforcement, highway personnel, or school crossing guards
    C: Any pedestrian in a crosswalk
    D: Other drivers signaling with their hands
  answer: B
  explanation: Traffic control also can be provided by law enforcement, highway personnel,
    or school crossing guards. You must obey directions from these persons.
- id: 58
  category: vehicle_information
  question: How should your vehicle's head rests be adjusted?
  choices:
    A: So the head restraint touches the base of your neck
    B: So the head restraint touches the back of your head
    C: So it is at least two inches below the top of your head
    D: So it is angled completely backward
  answer: B
  explanation: 'Head rests: They should be adjusted so the head restraint touches
    the back of your head.'
- id: 59
  category: safe_driving_rules
  question: When moving the vehicle forward, how should you press the accelerator?
  choices:
    A: Gently with the heel of your foot on the pedal
    B: Firmly with the toes of your foot
    C: Gently with the ball of your foot on the pedal and the heel on the floor
    D: With the side of your foot to allow quick braking
  answer: C
  explanation: Signal, and if safe, press the accelerator gently with the ball of
    your foot on the pedal and the heel of your foot on the floor.
- id: 60
  category: signs_and_signals
  question: What should you do if a traffic signal is not operating or is malfunctioning?
  choices:
    A: Proceed with caution without stopping.
    B: Treat the intersection as a four-way stop.
    C: Wait until law enforcement arrives to direct traffic.
    D: Treat the intersection as a yield sign.
  answer: B
  explanation: According to the manual, if the traffic signal is not operating or
    is malfunctioning, you must treat the intersection as a four way stop.
- id: 61
  category: safe_driving_rules
  question: Under what condition may you legally turn left on a steady red light?
  choices:
    A: When turning from a two-way street onto a one-way street.
    B: Whenever there is no oncoming traffic visible.
    C: When turning from a one-way street onto another one-way street, unless prohibited
      by a sign.
    D: You may never turn left on a steady red light.
  answer: C
  explanation: 'The manual states: ''Also, you may turn left on a red light if you
    are turning from a one-way street onto another one-way street, unless prohibited
    by a sign.'''
- id: 62
  category: signs_and_signals
  question: What does a flashing yellow arrow indicate for a driver turning left?
  choices:
    A: The driver has the right-of-way to turn left immediately.
    B: The driver should proceed with caution and must yield to oncoming traffic and
      pedestrians.
    C: The signal is about to turn green.
    D: The driver must come to a complete stop and wait for a green arrow.
  answer: B
  explanation: A flashing yellow arrow means the driver turning left should proceed
    with caution and must yield to oncoming traffic and pedestrians.
- id: 63
  category: signs_and_signals
  question: What is the primary purpose of HAWK signals?
  choices:
    A: To warn drivers of an upcoming railroad crossing.
    B: To indicate a school zone speed limit.
    C: To allow pedestrians to cross the road safely.
    D: To control traffic flow at highway on-ramps.
  answer: C
  explanation: HAWK signals (High Intensity Activated Crosswalk) are traffic signals
    that allow pedestrians to cross the road safely by operating in a yellow red flashing
    sequence.
- id: 64
  category: signs_and_signals
  question: What do regulatory signs look like?
  choices:
    A: Yellow or fluorescent green with black symbols.
    B: Orange background with black letters.
    C: Green background with white letters.
    D: Black or red on a white background.
  answer: D
  explanation: Regulatory signs tell you of laws and regulations that apply at a location.
    They are black or red on a white background.
- id: 65
  category: safe_driving_rules
  question: When crossing railroad tracks, what action should you avoid doing?
  choices:
    A: Turning on your headlights.
    B: Shifting gears.
    C: Looking both ways.
    D: Slowing down.
  answer: B
  explanation: 'The manual explicitly warns: ''Do not shift gears when crossing the
    railroad tracks in case your vehicle stalls.'''
- id: 66
  category: signs_and_signals
  question: What information is provided by a blue Railroad Emergency Notification
    System (ENS) sign?
  choices:
    A: The train schedule for that specific crossing.
    B: A telephone number to report problems and a DOT number identifying the location.
    C: The maximum speed limit for crossing the tracks.
    D: The distance to the next available railroad crossing.
  answer: B
  explanation: ENS signs are blue signs at every highway-rail grade crossing that
    provide a telephone number to report problems or emergencies, along with a DOT
    number that identifies the exact location.
- id: 67
  category: signs_and_signals
  question: What do guide signs with a green background indicate?
  choices:
    A: Recreational, historic, or cultural areas.
    B: Directions to service facilities.
    C: Directional and mileage information to specific destinations.
    D: Work zones and roadway workers.
  answer: C
  explanation: Guide signs have a green background and provide directional and mileage
    information to specific destinations.
- id: 68
  category: sharing_the_road
  question: What does a reflective orange triangle on the rear of a vehicle mean?
  choices:
    A: The vehicle is carrying hazardous materials.
    B: The vehicle is designed to travel at speeds slower than 25 miles per hour.
    C: The vehicle is a school bus making frequent stops.
    D: The vehicle is an emergency responder.
  answer: B
  explanation: A reflective orange triangle on the rear of a vehicle is a slow moving
    vehicle marker, meaning it is designed to travel at speeds slower than 25 miles
    per hour.
- id: 69
  category: penalties_and_points
  question: What is a potential penalty for parking illegally in a designated disabled
    parking spot without a placard or plate?
  choices:
    A: A warning for the first offense.
    B: A $50 fine and a point on your license.
    C: A misdemeanor charge, subject to a $350-$5,000 fine, possible jail time, and
      loss of driving privileges.
    D: Only having your vehicle towed.
  answer: C
  explanation: If you park illegally in a designated disabled parking spot without
    a placard or plate, you could be charged with a misdemeanor, subject to a $350-$5,000
    fine, possible jail time, loss of driving privileges and/or your car being impounded.
- id: 70
  category: sharing_the_road
  question: Under what condition may you cross a solid yellow line or double solid
    yellow lines?
  choices:
    A: To pass a slower-moving motor vehicle if you are in a hurry.
    B: To pass a bicyclist with a minimum of three feet of space when the oncoming
      travel lane is clear.
    C: You may never cross a solid yellow line under any circumstances.
    D: To park on the opposite side of the road.
  answer: B
  explanation: Solid yellow lines and double solid yellow lines prohibit passing,
    unless to pass a bicyclist with a minimum of three feet of space when the oncoming
    travel lane is clear.
- id: 71
  category: signs_and_signals
  question: What do broken white lines on the roadway indicate?
  choices:
    A: They separate traffic moving in opposite directions.
    B: They mark the shoulder of the roadway.
    C: They separate lanes of traffic moving in the same direction, and you may change
      lanes if it is safe.
    D: They indicate a designated area for bicyclists only.
  answer: C
  explanation: White lines separate lanes of traffic moving in the same direction.
    A broken white line means you may change lanes if it is safe.
- id: 72
  category: sharing_the_road
  question: What does green paint on the roadway designate?
  choices:
    A: A lane or area designated for bicyclists to increase their visibility.
    B: A lane exclusively for high-occupancy vehicles (HOV).
    C: A pedestrian crosswalk in a school zone.
    D: A loading zone for commercial vehicles.
  answer: A
  explanation: Green Paint indicates a lane or area on the roadway designated for
    bicyclists, and increases visibility of bicyclists.
- id: 73
  category: signs_and_signals
  question: What does a flashing red light mean?
  choices:
    A: The traffic signal is about to turn green.
    B: It means the same as a STOP sign; stop, then go only after yielding.
    C: Proceed with caution without stopping.
    D: Yield to traffic on the right.
  answer: B
  explanation: A flashing red light means the same as a STOP sign. Stop; then go only
    after yielding to pedestrians and other traffic.
- id: 74
  category: sharing_the_road
  question: What do "sharrows" painted on the street let road users know?
  choices:
    A: The road is closed to bicycle traffic.
    B: The lane may be too narrow for drivers and bicyclists to travel side-by-side.
    C: Bicyclists must ride on the sidewalk.
    D: Vehicles are approaching a sharp curve.
  answer: B
  explanation: Some streets have shared lane markings or "sharrows" painted on them
    letting road users know that the lane may be too narrow for drivers and bicyclists
    to travel side-by-side.
- id: 75
  category: sharing_the_road
  question: What does a 'sharrow' pavement marking indicate?
  choices:
    A: The lane is reserved exclusively for bicycles.
    B: The lane may be too narrow for drivers and bicyclists to travel side-by-side.
    C: Drivers must stop and yield to oncoming traffic.
    D: The lane is a designated conflict zone.
  answer: B
  explanation: The manual states that shared lane markings or 'sharrows' let road
    users know that the lane may be too narrow for drivers and bicyclists to travel
    side-by-side.
- id: 76
  category: safe_driving_rules
  question: If you approach a vehicle from the rear that is stopped at a crosswalk,
    what must you do?
  choices:
    A: Pass the vehicle on the right if there is enough room.
    B: Honk your horn to alert the pedestrians.
    C: You must not pass and must stop behind the vehicle or behind the crosswalk.
    D: Change lanes and proceed through the crosswalk at a slow speed.
  answer: C
  explanation: According to the manual, whenever you approach a vehicle from the rear
    that is stopped at a crosswalk, you must not pass and must stop behind the vehicle
    or behind the crosswalk in the adjacent lane.
- id: 77
  category: safe_driving_rules
  question: Which of the following is true regarding a two-way left-turn lane (center
    turn lane)?
  choices:
    A: It can be used for passing slow-moving vehicles.
    B: It may be used as a regular travel lane during rush hour.
    C: It is for the exclusive use of left-turning vehicles and cannot be used for
      passing.
    D: You may turn left from any other lane if the center turn lane is occupied.
  answer: C
  explanation: The manual specifies that a two-way left-turn lane is for the exclusive
    use of left turning vehicles and shall not be used for passing or travel by a
    driver except to make a left turn.
- id: 78
  category: sharing_the_road
  question: What is the rule regarding bike lanes at intersections?
  choices:
    A: Bike lanes end at the intersection unless painted lines continue through it.
    B: A bike lane extends through an intersection regardless of whether paint connects
      it on either side.
    C: Drivers may park in a bike lane at an intersection if they are turning right.
    D: Bicyclists must dismount and walk their bikes through the intersection.
  answer: B
  explanation: 'The manual states: ''A bike lane extends through an intersection regardless
    of whether paint connects the bike lane on either side.'''
- id: 79
  category: sharing_the_road
  question: According to Colorado law, who must you yield the right-of-way to when
    entering, exiting, or driving in a roundabout?
  choices:
    A: Only pedestrians in the crosswalk.
    B: Any vehicle approaching from your right.
    C: A truck, bus, emergency vehicle, or recreational vehicle.
    D: Vehicles that are entering the roundabout at the same time as you.
  answer: C
  explanation: Before entering the roundabout, Colorado law requires drivers to yield
    the right-of-way to the driver of a truck, bus, emergency vehicle or recreational
    vehicle (large vehicle) when entering, exiting or driving in a roundabout.
- id: 80
  category: safe_driving_rules
  question: What happens if two drivers of large vehicles enter or drive in a roundabout
    at the same time?
  choices:
    A: The driver on the left must yield to the driver on the right.
    B: The driver on the right must yield the right-of-way to the driver on the left.
    C: Both drivers must stop and wait for a traffic signal.
    D: The vehicle traveling at a higher speed has the right-of-way.
  answer: B
  explanation: The law requires that when two drivers of large vehicles enter, exit
    or drive in a roundabout at the same time, the driver on the right must yield
    the right-of-way to the driver on the left.
- id: 81
  category: signs_and_signals
  question: What is a primary feature of a Diverging Diamond Interchange (DDI)?
  choices:
    A: It requires all vehicles to stop at a central traffic circle.
    B: It crosses traffic to the opposite side of the road to allow uninterrupted
      movements onto freeway ramps.
    C: It uses a series of four-way stops to control freeway on-ramp traffic.
    D: It restricts all left-turn movements onto the freeway.
  answer: B
  explanation: A diverging diamond interchange crosses traffic to the opposite side
    of the road across an interchange so vehicles have uninterrupted movements onto
    the freeway ramps, eliminating typical left-turn conflicts.
- id: 82
  category: safe_driving_rules
  question: Which of the following statements about right-of-way is true?
  choices:
    A: A green traffic signal guarantees you the right-of-way.
    B: The law gives the right-of-way to the largest vehicle at an intersection.
    C: The law states who must yield the right-of-way, but it does not give anyone
      the right-of-way.
    D: Pedestrians must always yield the right-of-way to motor vehicles.
  answer: C
  explanation: 'The manual explicitly states: ''The law states who must yield the
    right-of-way, but it does not give anyone the right-of-way, even if your traffic
    signal is green.'''
- id: 83
  category: safe_driving_rules
  question: If two vehicles reach a four-way stop intersection at the same time, who
    must yield?
  choices:
    A: The vehicle on the right must yield to the vehicle on the left.
    B: The vehicle on the left must yield to the vehicle on the right.
    C: The vehicle traveling faster must yield.
    D: The vehicle turning right must yield to the vehicle going straight.
  answer: B
  explanation: When more than one vehicle reaches the intersection at the same time,
    the vehicle on the left must yield the right-of-way and allow the vehicle on the
    right to go first.
- id: 84
  category: defensive_driving
  question: When two vehicles meet on a steep, narrow mountain road that is not wide
    enough for both, who has the right-of-way?
  choices:
    A: The vehicle going downhill must yield by backing up or stopping.
    B: The vehicle going uphill must always back up to a wider place.
    C: The heavier vehicle has the right-of-way.
    D: The vehicle that honks its horn first has the right-of-way.
  answer: A
  explanation: When vehicles meet on a steep, narrow road that is not wide enough
    for two vehicles, the vehicle going downhill must yield the right-of-way by backing
    up to a wider place or by stopping.
- id: 85
  category: safe_driving_rules
  question: What should you do if an emergency vehicle with flashing lights and a
    siren approaches while you are in the middle of an intersection?
  choices:
    A: Stop immediately in the middle of the intersection.
    B: Pull over to the right edge of the intersection and stop.
    C: Drive through the intersection, then pull over to the right edge of the road
      and stop.
    D: Speed up to clear the intersection and continue driving normally.
  answer: C
  explanation: 'The manual instructs: ''If you are in an intersection, drive through
    the intersection, then pull over.'''
- id: 86
  category: safe_driving_rules
  question: If you approach a stopped emergency vehicle on the side of the road and
    cannot change lanes, what speed must you slow down to if the posted speed limit
    is 45 MPH or less?
  choices:
    A: 15 MPH
    B: 20 MPH
    C: 25 MPH
    D: 30 MPH
  answer: C
  explanation: If you cannot change lanes away from a stopped emergency vehicle, you
    must slow down to 25 MPH if the posted speed limit is 45 MPH or less.
- id: 87
  category: safe_driving_rules
  question: If you are unable to change lanes when passing a stopped emergency vehicle,
    and the posted speed limit is 65 MPH, what must you slow your speed down to?
  choices:
    A: 25 MPH
    B: 35 MPH
    C: 45 MPH
    D: 55 MPH
  answer: C
  explanation: If the posted speed limit is above 45 MPH, you must slow down to 20
    MPH under the posted speed limit. (65 MPH - 20 MPH = 45 MPH).
- id: 88
  category: signs_and_signals
  question: What do broken lines in a bike or bus lane indicate?
  choices:
    A: A conflict zone where drivers and bicyclists will be crossing each other's
      path.
    B: An area where parking is permitted on weekends.
    C: A designated passing zone for motor vehicles.
    D: A zone where bicyclists must dismount and walk.
  answer: A
  explanation: Conflict Zones are marked by broken lines in a bike or bus lane that
    alert drivers and bicyclists that they will be crossing each other’s path.
- id: 89
  category: signs_and_signals
  question: How are reversible lanes typically marked?
  choices:
    A: By solid green paint across the entire lane.
    B: By a single solid white line on both sides.
    C: By a barrier or double-broken yellow lines.
    D: By a white diamond painted in the center of the lane.
  answer: C
  explanation: Reversible lanes are separated by a barrier or marked by double-broken
    yellow lines.
- id: 90
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit in any business district
    in Colorado?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 40 mph
  answer: B
  explanation: According to the manual, unless otherwise posted, the Colorado speed
    limit is 25 mph in any business district.
- id: 91
  category: safe_driving_rules
  question: What is the default speed limit on narrow, winding mountain highways and
    blind curves?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 40 mph
  answer: A
  explanation: The manual states that unless otherwise posted, the speed limit is
    20 mph on narrow, winding mountain highways and blind curves.
- id: 92
  category: sharing_the_road
  question: How far back must you stop your vehicle before reaching a school bus that
    is stopped with its red lights flashing?
  choices:
    A: At least 10 feet
    B: At least 15 feet
    C: At least 20 feet
    D: At least 50 feet
  answer: C
  explanation: You must stop your vehicle at least 20 feet before reaching a school
    bus that is stopped with its red lights flashing.
- id: 93
  category: sharing_the_road
  question: Under what condition are you NOT required to stop for a school bus with
    flashing red lights?
  choices:
    A: When you are traveling in the opposite direction on a two-lane road
    B: When there is a median or other physical barrier separating the bus from your
      vehicle
    C: When you are approaching the bus at an intersection
    D: When the bus is stopped on the opposite side of a four-lane road without a
      median
  answer: B
  explanation: The manual specifies that you are not required to stop if there is
    a median or other physical barrier separating the bus from your vehicle.
- id: 94
  category: sharing_the_road
  question: When is it illegal to pass an authorized snow plow?
  choices:
    A: When it is traveling under the speed limit
    B: When it is working in a formation in which the plows are staggered diagonally
    C: When it has its yellow lights flashing
    D: When it is clearing the right shoulder of the road
  answer: B
  explanation: It is illegal to pass an authorized snow plow when it is working in
    a formation in which the plows are staggered diagonally.
- id: 95
  category: penalties_and_points
  question: What is a potential penalty for failing to follow the speed limit in a
    work or construction zone?
  choices:
    A: Immediate license suspension
    B: Mandatory community service
    C: Double fines
    D: Vehicle impoundment
  answer: C
  explanation: The manual states that failure to follow the speed limit in a work/construction
    zone can result in double fines.
- id: 96
  category: safe_driving_rules
  question: In urban areas, how far in advance must you signal continuously before
    making a turn or lane change?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: In urban areas, you must signal continuously for 100 feet before making
    a turn or lane change.
- id: 97
  category: safe_driving_rules
  question: On a four-lane highway where the posted speed limit is faster than 40
    mph, how far in advance must you signal before making a turn or lane change?
  choices:
    A: 100 feet
    B: 150 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: On four lane highways where the posted speed limit is faster than 40
    mph, you must signal for 200 feet before making a turn or lane change.
- id: 98
  category: defensive_driving
  question: Why should you never turn your front wheels to the left while waiting
    to make a left turn?
  choices:
    A: It causes unnecessary wear on your power steering system
    B: It blocks the view of oncoming traffic
    C: If you are rear-ended, you would be pushed into oncoming traffic
    D: It is illegal to turn the steering wheel while completely stopped
  answer: C
  explanation: Never turn the front wheels toward the left while you are waiting to
    turn. If you are rear ended, you would be pushed into oncoming traffic.
- id: 99
  category: safe_driving_rules
  question: According to the National Safety Council, about how many feet does it
    take a lightweight passenger car traveling at 55 mph to stop?
  choices:
    A: 100 feet
    B: 150 feet
    C: 200 feet
    D: 250 feet
  answer: C
  explanation: According to the National Safety Council, a lightweight passenger car
    traveling 55 mph can stop in about 200 feet.
- id: 100
  category: sharing_the_road
  question: When must you yield the right-of-way to a transit bus?
  choices:
    A: Whenever it is stopped at a designated bus stop
    B: When it is signaling to enter a traffic lane and the yield sign on the rear
      of the bus is illuminated
    C: Only when it has its red lights flashing
    D: Whenever it is traveling slower than the posted speed limit
  answer: B
  explanation: You must yield right-of-way to a transit bus if it is signaling to
    enter a traffic lane and the yield sign on the rear of the bus is illuminated.
- id: 101
  category: safe_driving_rules
  question: If your vehicle's turn signals do not work and you must use hand signals,
    when should you end your hand signal?
  choices:
    A: After you have completely finished the turn
    B: Halfway through the turn
    C: Before starting to turn so that you can complete the turn with both hands on
      the wheel
    D: You do not need to end it until you accelerate to the speed limit
  answer: C
  explanation: End your hand signal before starting to turn so that you can complete
    the turn with both hands on the wheel.
- id: 102
  category: safe_driving_rules
  question: On what type of roadway should you use a three-point turnabout?
  choices:
    A: A four-lane highway
    B: A two-lane roadway
    C: A one-way street
    D: An urban interstate
  answer: B
  explanation: The manual states to only use a three-point turnabout on a two-lane
    roadway.
- id: 103
  category: safe_driving_rules
  question: How far must you park from a fire hydrant?
  choices:
    A: At least 10 feet
    B: At least 15 feet
    C: At least 20 feet
    D: At least 30 feet
  answer: B
  explanation: According to the manual, you cannot park a vehicle within 15 feet of
    a fire hydrant.
- id: 104
  category: safe_driving_rules
  question: You may not park your vehicle within how many feet of a traffic signal
    or stop sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: The manual states that you cannot park a vehicle within 30 feet of
    a traffic signal, stop sign, or railroad crossing.
- id: 105
  category: safe_driving_rules
  question: When parallel parking where permitted, your vehicle must be within what
    distance of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: Where parallel parking is permitted, your vehicle must be within 12
    inches of the curb or as close as possible to the outside edge of the shoulder.
- id: 106
  category: safe_driving_rules
  question: Which way should you turn your front wheels when parked headed uphill
    next to a curb?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Straight ahead
    D: To the right
  answer: B
  explanation: When headed uphill where there is a curb, you should turn the front
    wheels away from the curb and let your vehicle roll backwards slowly until the
    rear part of the front wheel rests against the curb.
- id: 107
  category: safe_driving_rules
  question: When parking headed uphill on a road with no curb, which way should you
    turn your front wheels?
  choices:
    A: To the left
    B: To the right
    C: Straight ahead
    D: Away from the edge of the road
  answer: B
  explanation: When headed uphill without a curb, turn your front wheels to the right
    so that if your vehicle moves, it will roll off the highway, not into the roadway.
- id: 108
  category: safe_driving_rules
  question: When entering a freeway from an on-ramp, what should you do to merge safely?
  choices:
    A: Stop at the end of the acceleration lane and wait for a gap
    B: Merge immediately across the solid white line
    C: Try to increase your speed to match freeway traffic
    D: Drive on the shoulder until you reach the speed limit
  answer: C
  explanation: When entering a freeway from an on-ramp, try to increase your speed
    to match freeway traffic. You should not merge until the solid white line has
    ended and should not stop in the acceleration lane unless absolutely necessary.
- id: 109
  category: safe_driving_rules
  question: 'On a freeway, the leftmost lane is primarily reserved for:'
  choices:
    A: Slower traffic
    B: Passing vehicles and left turns
    C: Vehicles exiting the freeway
    D: Emergency vehicles only
  answer: B
  explanation: The passing lane (the leftmost lane) is reserved for passing vehicles
    in non-passing lanes, left turns, and conditions where traffic volume does not
    allow merging into non-passing lanes.
- id: 110
  category: safe_driving_rules
  question: When leaving a freeway, when should you activate your turn signal?
  choices:
    A: 50 feet before the deceleration lane
    B: 100 feet before the deceleration lane
    C: 200 feet before the beginning of the deceleration lane
    D: As soon as you enter the deceleration lane
  answer: C
  explanation: When exiting the freeway, activate your turn signal 200 feet before
    the beginning of the deceleration lane.
- id: 111
  category: safe_driving_rules
  question: When changing lanes, how long should you leave your turn signal active
    before leaving your lane?
  choices:
    A: A minimum of 3 seconds or 200 feet
    B: A minimum of 5 seconds or 300 feet
    C: A minimum of 2 seconds or 100 feet
    D: Until you have completely entered the new lane
  answer: A
  explanation: When changing lanes, you should activate your turn signal and leave
    it active for a minimum of 3 seconds or 200 feet before leaving your lane.
- id: 112
  category: defensive_driving
  question: What is the proper way to check your blind spots when changing lanes?
  choices:
    A: Check your rearview mirror
    B: Check your side view mirrors
    C: Look over your shoulder
    D: Activate your turn signal and wait for honks
  answer: C
  explanation: To check your blind spot, which is the area slightly to the rear and
    side of your vehicle that you cannot see in your mirrors, you must look over your
    shoulder.
- id: 113
  category: safe_driving_rules
  question: When passing another vehicle, when is it safe to change back into your
    previous lane?
  choices:
    A: When you are parallel with the vehicle
    B: When you can see the vehicle's front bumper in your side mirror
    C: When you can see both headlights of the passed vehicle in your rearview mirror
    D: Three seconds after passing the vehicle
  answer: C
  explanation: When you can see both headlights of the vehicle you passed in the rearview
    mirror, change one lane to get back into your previous lane.
- id: 114
  category: sharing_the_road
  question: How much space must you leave between your vehicle and a bicyclist when
    passing them?
  choices:
    A: A minimum of two feet
    B: A minimum of three feet
    C: A minimum of four feet
    D: A minimum of five feet
  answer: B
  explanation: If passing a bicyclist, you must have a minimum of three feet of space
    between the outermost part of your vehicle, including any projections such as
    mirrors or trailers, and the bicyclist.
- id: 115
  category: sharing_the_road
  question: When passing a bicyclist, are you allowed to cross a solid yellow line?
  choices:
    A: No, it is always illegal to cross a solid yellow line
    B: Yes, but only if you honk your horn first
    C: Yes, you can briefly cross it when there is no oncoming traffic and a clear
      view ahead
    D: Yes, but only in designated passing zones
  answer: C
  explanation: If passing a bicyclist, you may briefly cross a solid yellow line when
    there is no oncoming traffic and you have a clear view ahead.
- id: 116
  category: safe_driving_rules
  question: You are NOT allowed to pass another vehicle if you are within how many
    feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Do not pass within 100 feet of an intersection or railroad crossing.
    Passing within 100 feet of these areas is illegal.
- id: 117
  category: safe_driving_rules
  question: When passing, you must be able to safely return to the right-hand side
    before coming within what distance of an oncoming vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Do not pass if you cannot safely return to the right-hand side before
    coming within 200 feet of an oncoming vehicle, including a bicyclist in the oncoming
    lane or shoulder.
- id: 118
  category: safe_driving_rules
  question: According to Colorado law, when is it illegal to pass another vehicle?
  choices:
    A: Within 200 feet of an intersection
    B: Within 100 feet of any intersection
    C: Within 500 feet of a railroad crossing
    D: When driving on a multi-lane highway
  answer: B
  explanation: The manual states that it is illegal to pass within 100 feet of any
    intersection or railroad crossing.
- id: 119
  category: defensive_driving
  question: When driving through a curve, when should you begin to accelerate?
  choices:
    A: Before entering the curve
    B: As soon as you turn the steering wheel
    C: Only after reaching the middle of the curve
    D: After you have completely exited the curve
  answer: C
  explanation: The manual advises to always slow down before entering a curve and
    to begin your acceleration only after reaching the middle of the curve.
- id: 120
  category: safe_driving_rules
  question: 'Colorado law requires you to drive with your headlights on from sunset
    to sunrise or when visibility is less than:'
  choices:
    A: 500 feet
    B: 1,000 feet
    C: 1,500 feet
    D: 2,000 feet
  answer: B
  explanation: Colorado law requires you to drive with your headlights on from sunset
    to sunrise or when visibility is less than 1,000 feet.
- id: 121
  category: safe_driving_rules
  question: 'When following another vehicle at night, you must use your low beam lights
    if you are within:'
  choices:
    A: 100 feet of the vehicle ahead
    B: 200 feet of the vehicle ahead
    C: 300 feet of the vehicle ahead
    D: 500 feet of the vehicle ahead
  answer: B
  explanation: When following another vehicle, you must use your low beam lights,
    with your fog lights off, if you are within 200 feet of the vehicle ahead of you.
- id: 122
  category: defensive_driving
  question: What should you do if an approaching car at night is using its high beam
    headlights?
  choices:
    A: Flash your high beams repeatedly until they dim theirs
    B: Look directly at the headlights to gauge their distance
    C: Drop your sight below the glare and use the painted edge lines to guide your
      vehicle
    D: Pull over to the shoulder and stop immediately
  answer: C
  explanation: 'The manual states: "Never look directly into an approaching car’s
    headlights. As the vehicle draws near, drop your sight below the glare and use
    the painted edge lines to guide your vehicle."'
- id: 123
  category: defensive_driving
  question: What is a recommended action if your vehicle begins to hydroplane?
  choices:
    A: Slam on the brakes to regain traction immediately
    B: Jerk the steering wheel in the opposite direction of the skid
    C: Slowly begin steering in the direction you are hydroplaning
    D: Accelerate to push the tires through the standing water
  answer: C
  explanation: If you hydroplane, you should take your foot off the gas pedal and
    slowly begin steering in the direction you are hydroplaning until you have control.
- id: 124
  category: safe_driving_rules
  question: Which vehicle feature should you NOT use if the highway is wet or icy?
  choices:
    A: Windshield wipers
    B: Low beam headlights
    C: Defrosters
    D: Cruise control
  answer: D
  explanation: 'The manual explicitly states: "If the highway is wet or icy, do not
    use cruise control."'
- id: 125
  category: sharing_the_road
  question: When is it illegal to pass a snowplow in Colorado?
  choices:
    A: Whenever it is traveling under the posted speed limit
    B: When it is driving in tandem with other snow plows with flashing yellow lights
    C: When it is parked on the shoulder with its engine running
    D: Whenever it is snowing heavily and visibility is poor
  answer: B
  explanation: It is illegal to pass a city, county or state-operated snow plow while
    it’s working with its yellow lights flashing and is driving in tandem with one
    or more other snow plows.
- id: 126
  category: vehicle_information
  question: How does having a 4-wheel drive vehicle affect your stopping distance
    in seasonal driving conditions?
  choices:
    A: They can stop much sooner than conventional cars
    B: They cannot stop any sooner than a conventional car
    C: They require twice the stopping distance of a conventional car
    D: They completely prevent skidding when braking
  answer: B
  explanation: The manual notes that while vehicles with 4-wheel drive have increased
    traction, they cannot stop any sooner than a conventional car.
- id: 127
  category: vehicle_information
  question: What braking technique should you use in slippery conditions if your vehicle
    does NOT have anti-lock brakes (ABS)?
  choices:
    A: Pump the brakes as rapidly as possible
    B: Slam on the brakes and hold the pedal down firmly
    C: Use threshold braking by applying pressure just short of locking up the brakes
    D: Apply the parking brake gently to slow down
  answer: C
  explanation: If you don’t have anti-lock brakes, you should use threshold braking
    when skidding or in slippery conditions by applying brake pressure to a point
    just short of locking up the brakes.
- id: 128
  category: safe_driving_rules
  question: When two vehicles meet on a steep mountain road where neither can pass,
    which vehicle has the right-of-way?
  choices:
    A: The vehicle going downhill
    B: The vehicle going uphill
    C: The larger vehicle
    D: The vehicle that is traveling faster
  answer: B
  explanation: According to the mountain driving section, vehicles going uphill have
    the right-of-way over vehicles going downhill.
- id: 129
  category: defensive_driving
  question: What should you do to control your speed when driving down steep hills
    or mountains?
  choices:
    A: Shift into neutral and coast
    B: Ride your brakes continuously
    C: Shift to lower gears
    D: Turn off the engine
  answer: C
  explanation: The manual advises drivers to shift to lower gears to control speeds
    when driving down steep hills or mountains.
- id: 130
  category: defensive_driving
  question: What is "washboarding" on rural roads?
  choices:
    A: A type of heavy rain that washes away the road surface
    B: A series of potholes that can affect steering and vehicle control
    C: A technique used to clean mud off tires before entering a highway
    D: A reflective paint used to mark rural curves
  answer: B
  explanation: Washboarding is defined in the manual as a series of potholes that
    can affect steering and vehicle control, often found on gravel roads.
- id: 131
  category: sharing_the_road
  question: Why is it advised to give bicyclists more than the required three feet
    of passing distance on rural roads?
  choices:
    A: Because bicyclists tend to ride in the middle of the lane on rural roads
    B: Because rural roads are generally wider than city streets
    C: Due to dangerous wind blasts that can cause vehicles to hit bicyclists
    D: Because bicyclists are required to ride on the unpaved shoulder
  answer: C
  explanation: Slower speeds and more than the required three feet of passing distance
    are advised when passing bicyclists on rural roads due to dangerous wind blasts
    that can cause vehicles to hit bicyclists.
- id: 132
  category: safe_driving_rules
  question: When must you dim your high beam headlights for an oncoming vehicle?
  choices:
    A: Within 200 feet
    B: Within 300 feet
    C: Within 500 feet
    D: Within 1,000 feet
  answer: C
  explanation: If you are driving with your high beam lights on, you must dim them
    before coming within 500 feet of any oncoming vehicle so the oncoming driver is
    not blinded by the glare.
- id: 133
  category: penalties_and_points
  question: What happens to traffic fines for violations committed in a work zone?
  choices:
    A: They are reduced by half
    B: They are doubled
    C: They are tripled
    D: They remain the same as normal roads
  answer: B
  explanation: According to the manual, like school zones, fines are doubled in work
    zones to ensure drivers comply with signs and directions.
- id: 134
  category: safe_driving_rules
  question: What is the most common type of crash that occurs in work zones?
  choices:
    A: Head-on collisions
    B: Sideswipe collisions
    C: Rear-end collisions
    D: Rollover crashes
  answer: C
  explanation: The manual states that most work zone crashes are rear-end collisions
    due to an inattentive driver.
- id: 135
  category: safe_driving_rules
  question: Under Colorado law, when is it permissible to use a mobile device for
    text messaging while driving?
  choices:
    A: When stopped at a red light
    B: When driving on a rural highway with no traffic
    C: To contact law enforcement, the fire department, or in an emergency
    D: To read a quick message from a family member
  answer: C
  explanation: Colorado law prohibits the use of mobile devices for text messaging
    while driving unless it is to contact law enforcement, the fire department, or
    it is an emergency.
- id: 136
  category: vehicle_information
  question: What are the most effective hand positions on the steering wheel?
  choices:
    A: 10 o'clock and 2 o'clock
    B: 8 o'clock and 4 o'clock or 9 o'clock and 3 o'clock
    C: 12 o'clock and 6 o'clock
    D: One hand at 12 o'clock
  answer: B
  explanation: The manual states that the most effective hand positions on the steering
    wheel are 8 o'clock and 4 o'clock or 9 o'clock and 3 o'clock.
- id: 137
  category: vehicle_information
  question: Which of the following is an incorrect and potentially dangerous steering
    technique when making a turn?
  choices:
    A: Using the hand-over-hand method
    B: Using the push-pull-slide method
    C: Turning the wheel with the palm of your hand
    D: Keeping both hands on the steering wheel
  answer: C
  explanation: 'The manual specifically warns drivers: ''Do not turn the wheel with
    the palm of your hand or let it slide through your fingers after making a turn.'''
- id: 138
  category: defensive_driving
  question: Where should you look when turning, driving through, or entering an intersection?
  choices:
    A: Look right, then left
    B: Look left, right, and then left again
    C: Look straight ahead only
    D: Look left, then straight
  answer: B
  explanation: To scan properly, you must always look left, right and then left again
    when turning, driving through or entering an intersection.
- id: 139
  category: defensive_driving
  question: How far ahead should you look down the road to avoid last-minute braking
    or abrupt turns?
  choices:
    A: At least 3 seconds ahead
    B: At least 5 seconds ahead
    C: At least 10 seconds ahead
    D: At least 15 seconds ahead
  answer: C
  explanation: In order to avoid last-minute braking or the need to turn abruptly,
    you should look down the road at least 10 seconds ahead of your vehicle.
- id: 140
  category: defensive_driving
  question: How often should you check the traffic behind you in your rear view mirror?
  choices:
    A: Every 2 to 3 seconds
    B: Every 5 to 8 seconds
    C: Every 10 to 15 seconds
    D: Only when you are preparing to change lanes
  answer: B
  explanation: You must check traffic behind you in your rear view mirror every 5
    to 8 seconds to know if someone is following too closely or coming up too quickly.
- id: 141
  category: safe_driving_rules
  question: What rule should you use to gauge how much space to leave between your
    vehicle and the vehicle in front of you under normal conditions?
  choices:
    A: The two-second rule
    B: The three-second rule
    C: The four-second rule
    D: The one car length per 10 mph rule
  answer: B
  explanation: Under normal conditions, use the three-second rule to gauge how much
    space you should leave between your vehicle and the vehicle in front of you.
- id: 142
  category: defensive_driving
  question: Why is driving considerably slower than other vehicles on the road dangerous?
  choices:
    A: It is always the safest way to drive
    B: It saves fuel and reduces wear on the vehicle
    C: It can increase unpredictability and cause back-ups and more passing situations
    D: It prevents rear-end collisions in heavy traffic
  answer: C
  explanation: Driving considerably slower than other vehicles can increase unpredictability
    and compromise safety by causing back-ups and more passing situations.
- id: 143
  category: safe_driving_rules
  question: What is the proper way to execute a Zipper Merge when there is a lane
    closure ahead?
  choices:
    A: Merge as early as possible and wait in the open lane
    B: Drive in both lanes equally and take turns filling the open lane just before
      the point of closure
    C: Speed up to pass all vehicles before the lane closes
    D: Stop in the closing lane until someone lets you in
  answer: B
  explanation: When there is a lane closure ahead, drivers should continue to drive
    in both lanes equally. Just before the lane ends, cars should take turns filling
    in the open lane carefully in a zipper fashion.
- id: 144
  category: safe_driving_rules
  question: Which of the following locations are considered 'Slow Zones' that require
    slower speeds and increased attention?
  choices:
    A: Interstate highways and passing lanes
    B: Open rural roads and expressways
    C: Toll plazas, narrow bridges, and residential streets
    D: Merge points and on-ramps
  answer: C
  explanation: Slow Zones are places where people or traffic gather that require slower
    speeds, including shopping centers, schools, narrow bridges, toll plazas, and
    residential streets.
- id: 145
  category: driver_responsibility
  question: What should you do with your vehicle's lighting if you are pulled over
    by law enforcement at night?
  choices:
    A: Turn off all lights to avoid blinding the officer
    B: Turn on your high beams
    C: Turn on your interior lights to assist with visibility
    D: Flash your hazard lights continuously
  answer: C
  explanation: When pulled over at night, you should turn on your interior lights
    to assist with visibility for the officer.
- id: 146
  category: driver_responsibility
  question: If you have a weapon in the vehicle when pulled over by law enforcement,
    what is the correct protocol?
  choices:
    A: Hand the weapon to the officer immediately
    B: Hide the weapon under the seat before the officer approaches
    C: Let the officer know upon first contact, but do not reach for it or attempt
      to hand it to them
    D: Place the weapon on the dashboard where it is clearly visible
  answer: C
  explanation: You should let the officer know if you have a weapon in the vehicle
    upon first contact, but do not reach for it or attempt to hand it to the officer.
- id: 147
  category: driver_responsibility
  question: When pulled over by an officer, when should you reach for your driver's
    license or vehicle documents?
  choices:
    A: Have them ready in your hand before the officer approaches the window
    B: Reach for them as soon as you pull your vehicle over to save time
    C: Wait for the officer's instructions before reaching for your documents
    D: Step out of the vehicle to retrieve them from the trunk or back seat
  answer: C
  explanation: During a traffic stop, you must wait for the officer's instructions
    before reaching for your driver's license or vehicle documents.
- id: 148
  category: driver_responsibility
  question: During a traffic stop, what may happen if you refuse to sign a traffic
    ticket?
  choices:
    A: Your license will be immediately revoked.
    B: It may result in your arrest.
    C: You legally admit guilt to the offense.
    D: The officer is required to issue a warning instead.
  answer: B
  explanation: According to the manual, your acceptance and signature on a traffic
    ticket is not an admission of guilt; however, the refusal to sign a traffic ticket
    may result in your arrest.
- id: 149
  category: sharing_the_road
  question: Under what condition is a two-wheeled motorcycle allowed to lane filter?
  choices:
    A: At speeds up to 25 mph when traffic is moving slowly.
    B: Only on highways with a posted speed limit over 55 mph.
    C: At a speed no greater than 15 mph when surrounding vehicles are stopped.
    D: When moving through moving traffic in the left lane.
  answer: C
  explanation: A two-wheeled motorcycle can pass other stopped motor vehicles in the
    same lane (lane filtering) if there is enough room to pass safely at a speed no
    greater than 15 miles per hour.
- id: 150
  category: sharing_the_road
  question: When passing a large truck or bus, when is it safe to pull back into the
    lane in front of it?
  choices:
    A: As soon as your rear bumper clears the truck's front bumper.
    B: When you can see the driver in their side mirror.
    C: When you can see both headlights on the front of the vehicle in your rear view
      mirror.
    D: After you have signaled your intention for at least 3 seconds.
  answer: C
  explanation: Because trucks require longer distances to slow down, you should not
    pull in front of a truck or bus until you can see both headlights on the front
    of the vehicle in your rear view mirror.
- id: 151
  category: sharing_the_road
  question: Why is it important to stay behind white-painted stop bars at stop signs
    and traffic lights?
  choices:
    A: To avoid blocking pedestrian crosswalks.
    B: Because they are carefully measured to give trucks the room they need for turns.
    C: To trigger the magnetic traffic light sensors in the road.
    D: Because it is illegal to touch the white line with your front tires.
  answer: B
  explanation: You should stay behind white-painted stop bars because many are carefully
    measured to give trucks the room they need for turns.
- id: 152
  category: sharing_the_road
  question: What is a common sign of a runaway truck or bus?
  choices:
    A: Flashing hazard lights and honking.
    B: The vehicle swerving between multiple lanes.
    C: Smoke coming from the brakes.
    D: The driver waving their arm out the window.
  answer: C
  explanation: The manual states that one sign of a runaway truck or bus is smoke
    coming from the brakes.
- id: 153
  category: sharing_the_road
  question: Who has the right-of-way when a commercial bus is leaving a drop-off location
    and merging into traffic?
  choices:
    A: The vehicles already traveling in the traffic lane.
    B: The bus.
    C: Pedestrians waiting to cross the street.
    D: Whichever vehicle is moving at a faster speed.
  answer: B
  explanation: Buses have the right-of-way when leaving a drop-off location and merging
    into traffic.
- id: 154
  category: safe_driving_rules
  question: How far away must you stop from a school bus that has its red lights flashing
    and stop arm extended?
  choices:
    A: No less than 10 feet from the front or rear bumper.
    B: No less than 15 feet from the front or rear bumper.
    C: No less than 20 feet from the front or rear bumper.
    D: No less than 50 feet from the front or rear bumper.
  answer: C
  explanation: Vehicles must stop no less than 20 feet from the front or rear bumper
    of the school bus when its red lights are flashing.
- id: 155
  category: safe_driving_rules
  question: If you are traveling in the opposite direction of a stopped school bus
    on a divided highway with a median separating traffic, what must you do?
  choices:
    A: Stop until the red lights stop flashing.
    B: Slow down to 10 mph and proceed with caution.
    C: You are not legally required to stop.
    D: Stop, yield to any pedestrians, then proceed.
  answer: C
  explanation: If traveling on a divided highway with four or more lanes and a median,
    only the vehicles traveling in both lanes behind the school bus must stop, not
    the traffic traveling in the opposite direction.
- id: 156
  category: safe_driving_rules
  question: What does it mean when a school bus activates its overhead yellow warning
    lights?
  choices:
    A: The bus is experiencing a mechanical failure.
    B: The bus is about to stop and load or unload children.
    C: The bus is accelerating to merge into heavy traffic.
    D: The bus is preparing to back up.
  answer: B
  explanation: When a school bus is about to stop and load or unload children, the
    bus driver activates amber (yellow) warning lights.
- id: 157
  category: safe_driving_rules
  question: What should you do immediately if your vehicle stalls on a railroad crossing?
  choices:
    A: Stay in the vehicle and call 911.
    B: Try to push the vehicle off the tracks yourself.
    C: Get everyone out and move as far away as possible.
    D: Wait in the vehicle until you see a train approaching, then exit.
  answer: C
  explanation: If your vehicle stalls on a crossing, get everyone out and immediately
    move as far away as possible, even if you do not see a train approaching.
- id: 158
  category: safe_driving_rules
  question: Approximately how long does it take an average freight train traveling
    at 55 mph to stop?
  choices:
    A: About half a mile.
    B: About one mile.
    C: About two miles.
    D: About 500 feet.
  answer: B
  explanation: The average freight train traveling at 55 mph requires about one mile
    to stop.
- id: 159
  category: signs_and_signals
  question: Which of the following is the only round traffic sign?
  choices:
    A: A stop sign.
    B: A yield sign.
    C: A railroad advance warning sign.
    D: A railroad crossbuck sign.
  answer: C
  explanation: The railroad advance warning sign is the only round traffic sign.
- id: 160
  category: signs_and_signals
  question: If there is no painted stop line visible at a railroad crossing, how far
    from the tracks must you stop?
  choices:
    A: At least 5 feet.
    B: At least 10 feet.
    C: At least 15 feet.
    D: At least 20 feet.
  answer: B
  explanation: If no line is visible, you must be at least 10 feet from the tracks,
    as trains overhang the tracks by 3 feet.
- id: 161
  category: signs_and_signals
  question: How should a driver treat a railroad crossbuck sign?
  choices:
    A: The same as a stop sign.
    B: The same as a yield sign.
    C: The same as a speed limit sign.
    D: The same as a warning sign to speed up.
  answer: B
  explanation: Crossbuck signs should be treated the same as a yield sign.
- id: 162
  category: signs_and_signals
  question: What color is the Emergency Notification System (ENS) sign located at
    public highway-rail grade crossings?
  choices:
    A: Red
    B: Yellow
    C: Green
    D: Blue
  answer: D
  explanation: All public highway-rail grade crossings have BLUE colored Emergency
    Notification System (ENS) signs that provide a telephone number to call for emergencies.
- id: 163
  category: sharing_the_road
  question: What information on an Emergency Notification System (ENS) sign helps
    the railroad dispatcher know exactly where a crossing is located?
  choices:
    A: The nearest highway mile marker
    B: The DOT (X-ING) crossing number
    C: The local zip code
    D: The GPS coordinates of the crossing
  answer: B
  explanation: By providing the DOT (X-ING) crossing number located on the sign, the
    railroad dispatcher knows exactly where the crossing is and can quickly notify
    trains.
- id: 164
  category: sharing_the_road
  question: Approximately how much does a Light Rail Vehicle (LRV) weigh?
  choices:
    A: Up to 10 tons
    B: Up to 20 tons
    C: Up to 30 tons
    D: Up to 40 tons
  answer: D
  explanation: The manual states that each light rail car weighs up to 40 tons and
    cannot stop quickly.
- id: 165
  category: vehicle_information
  question: What is the standard height of overhead wires above the center of light
    rail tracks?
  choices:
    A: 15 feet
    B: 16 feet, 6 inches
    C: 18 feet, 6 inches
    D: 20 feet
  answer: C
  explanation: Be aware of your vehicle height. Overhead wires are a standard height
    of 18 feet, 6 inches above the center of the tracks.
- id: 166
  category: sharing_the_road
  question: 'When passing a bicyclist, Colorado law requires motorists to provide
    a minimum passing distance of:'
  choices:
    A: Two feet
    B: Three feet
    C: Four feet
    D: Five feet
  answer: B
  explanation: When passing bicyclists, motorists are required to give a minimum of
    three feet from the outermost part of their vehicle or any attachments.
- id: 167
  category: safe_driving_rules
  question: Is it legal for a motorist to cross a double yellow line to pass a bicyclist?
  choices:
    A: No, it is never legal to cross a double yellow line.
    B: Yes, but only if the bicyclist signals you to pass.
    C: Yes, if there is no oncoming traffic and it is necessary to provide a minimum
      of three feet of passing distance.
    D: No, unless you are driving an authorized emergency vehicle.
  answer: C
  explanation: It is legal to cross a double yellow line with no oncoming traffic
    if necessary to provide a minimum of three feet of passing distance.
- id: 168
  category: sharing_the_road
  question: Under what condition are bicyclists allowed to ride side-by-side on the
    roadway?
  choices:
    A: Only when riding in a designated bike lane
    B: Only in residential neighborhoods
    C: If they are not impeding the normal and reasonable movement of traffic
    D: Bicyclists are never permitted to ride side-by-side
  answer: C
  explanation: Bicyclists may ride side-by-side if they are not impeding the normal
    and reasonable movement of traffic. This can help them be more visible to drivers.
- id: 169
  category: safe_driving_rules
  question: When is a motorist permitted to drive across a designated bicycle lane?
  choices:
    A: Never
    B: When passing a slower motor vehicle
    C: When turning, entering or leaving another road, driveway or alley
    D: Whenever the main travel lane is congested
  answer: C
  explanation: Do not stop, park or drive on a designated bicycle path or lane. However,
    you may cross a bike lane when turning, entering or leaving another road, driveway
    or alley.
- id: 170
  category: sharing_the_road
  question: According to a 2022 Colorado law, how may bicyclists ages 15 and older
    treat stop signs when the intersection is clear?
  choices:
    A: As yield signs
    B: As green lights
    C: They must come to a complete stop for at least 3 seconds
    D: As pedestrian crosswalks
  answer: A
  explanation: A new law passed in 2022 states that when an intersection is clear
    and a bicyclist already has the right-of-way, bicyclists ages 15 and older may
    treat stop signs as yield signs.
- id: 171
  category: defensive_driving
  question: What is the purpose of the behavior commonly known as the 'Dutch Reach'?
  choices:
    A: To safely steer out of a skid on wet roads
    B: To use the hand closest to the center of the vehicle to open a door, helping
      check for bicyclists
    C: To secure cargo on the roof of a vehicle
    D: To signal a turn when a vehicle's indicator lights fail
  answer: B
  explanation: When parked on the street, use your hand closest to the center of the
    vehicle to open your door, a behavior commonly known as the 'Dutch Reach,' to
    check for bicyclists before opening the door.
- id: 172
  category: sharing_the_road
  question: How should a bicyclist use hand signals to indicate a right turn?
  choices:
    A: Extend the left arm directly out to the left
    B: Drop the left arm down at the elbow
    C: Extend the right arm straight out or left arm upward at a right angle
    D: Wave the right hand in a circular motion
  answer: C
  explanation: For a right turn, a bicyclist should extend the right arm straight
    out or left arm upward at a right angle.
- id: 173
  category: sharing_the_road
  question: Why might a bicyclist legally choose to ride in the center of the travel
    lane instead of on the far right?
  choices:
    A: To intentionally slow down motor vehicle traffic
    B: To avoid obstacles such as the door zone of parked cars, broken glass, or drainage
      grates
    C: Because they are prohibited from using designated bike lanes
    D: To prepare for a sudden U-turn in the middle of the block
  answer: B
  explanation: Bicyclists may choose to ride in the center of the travel lane on narrow
    roads or to avoid obstacles such as the door zone of parked cars, broken glass
    or drainage grates.
- id: 174
  category: sharing_the_road
  question: On a multi-lane, one-way street, where is a bicyclist allowed to ride?
  choices:
    A: Only on the right side of the roadway
    B: Only on the left side of the roadway
    C: On either the right or left side of the roadway
    D: Only in the center lane
  answer: C
  explanation: On a multi-lane, one-way street, know that a bicyclist can ride on
    the right or left side of the roadway.
- id: 175
  category: defensive_driving
  question: Why should drivers avoid sounding their horn close to bicyclists unless
    there is an immediate risk of a crash?
  choices:
    A: It is illegal to use a horn within city limits
    B: Using a horn may startle a bicyclist and cause them to crash
    C: It will drain the vehicle's battery unnecessarily
    D: Bicyclists cannot hear horns over the noise of traffic
  answer: B
  explanation: Avoid sounding your horn close to bicyclists unless there is an immediate
    risk of a crash. Using your horn may startle a bicyclist and cause them to crash.
- id: 176
  category: penalties_and_points
  question: Forcing a bicyclist off the road has legal consequences and constitutes
    what offense?
  choices:
    A: Careless driving
    B: Aggressive driving
    C: A minor traffic infraction
    D: Defensive driving
  answer: B
  explanation: Do not force a bicyclist off the road, this constitutes aggressive
    driving and has legal consequences.
- id: 177
  category: sharing_the_road
  question: What hand signal should a bicyclist use to indicate they are slowing or
    stopping?
  choices:
    A: Extend the left arm directly out to the left.
    B: Extend the right arm straight out.
    C: Extend the left arm upward at a right angle.
    D: Drop the left arm down at the elbow.
  answer: D
  explanation: According to the manual, if a bicyclist is slowing or stopping, they
    will drop the left arm down at the elbow.
- id: 178
  category: sharing_the_road
  question: Under Colorado's lane filtering law, what is the maximum speed a two-wheeled
    motorcycle can travel while passing stopped motor vehicles in the same lane?
  choices:
    A: 10 miles per hour
    B: 15 miles per hour
    C: 20 miles per hour
    D: 25 miles per hour
  answer: B
  explanation: The manual states that a two-wheeled motorcycle can pass safely at
    a speed no greater than 15 miles per hour during lane filtering, provided the
    surrounding vehicles are stopped and there is enough room.
- id: 179
  category: sharing_the_road
  question: Why do motorcyclists frequently move around within their lane?
  choices:
    A: To prepare for an illegal passing maneuver.
    B: Because strong winds force them to constantly shift.
    C: So they can see, be seen, and avoid road hazards.
    D: To prevent other vehicles from passing them.
  answer: C
  explanation: The manual explains that motorcyclists frequently move around in their
    lane so they can see, be seen, and avoid road hazards.
- id: 180
  category: defensive_driving
  question: How can a motorist prevent a collision with a bicyclist when exiting a
    parked vehicle?
  choices:
    A: Honk the horn before opening the door.
    B: Always check behind you before opening a door into the roadway.
    C: Open the door quickly to minimize the time it is in the roadway.
    D: Rely solely on the rearview mirror to check for bicycles.
  answer: B
  explanation: To prevent collisions caused by opening a vehicle door, the manual
    advises to always check behind you before opening a door into the roadway.
- id: 181
  category: sharing_the_road
  question: When do pedestrians have the right-of-way at crosswalks?
  choices:
    A: Only when the crosswalk lines are clearly painted.
    B: Only at intersections controlled by a traffic light.
    C: At all intersections and crosswalks, even if the lines are not marked or painted.
    D: Only when a crossing guard is actively directing traffic.
  answer: C
  explanation: The manual states that pedestrians have the right-of-way at all intersections
    and crosswalks, even if the lines are not marked or painted.
- id: 182
  category: safe_driving_rules
  question: Why must you never pass a vehicle that is stopped at a crosswalk?
  choices:
    A: The stopped vehicle might suddenly reverse.
    B: It is illegal to change lanes near any intersection.
    C: The driver may be stopping for pedestrians that you cannot see.
    D: You might block the view of the traffic signal.
  answer: C
  explanation: The manual warns to never pass vehicles stopped at a crosswalk because
    the driver may be stopping for pedestrians that you can’t see.
- id: 183
  category: safe_driving_rules
  question: What must you do regarding pedestrians when turning at a red light?
  choices:
    A: Yield only to pedestrians in the crosswalk you are entering.
    B: Come to a complete stop and check for pedestrians in all directions before
      moving forward.
    C: Slow down and proceed if no other vehicles are approaching.
    D: Honk your horn to warn pedestrians before making the turn.
  answer: B
  explanation: While turning at a red light, you must come to a complete stop and
    check for pedestrians in all directions to make sure your path is clear before
    moving forward.
- id: 184
  category: driver_responsibility
  question: When are drivers allowed to use a mobile electronic device while driving?
  choices:
    A: When stopped at a red light or stop sign.
    B: When driving at speeds under 20 mph.
    C: Only if it is with a hands-free device or in an emergency situation.
    D: Mobile devices are completely banned under all circumstances.
  answer: C
  explanation: Drivers are not allowed to use any mobile electronic device while driving
    unless it is with a hands-free device or in an emergency situation.
- id: 185
  category: penalties_and_points
  question: If convicted of reckless driving in Colorado, up to how many points can
    be assessed against your driving record?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: If a law enforcement officer notes your actions as endangering another
    person or property, you can be charged under Colorado’s reckless driving statute
    and if convicted, up to eight points can be assessed against your driving record.
- id: 186
  category: defensive_driving
  question: How does the manual define aggressive driving?
  choices:
    A: Operating a vehicle in a way that puts people in danger, whether intentional
      or not.
    B: Any behind-the-wheel behavior that places others and/or property in danger
      through willful action without regard to safety.
    C: Driving slightly over the posted speed limit on a rural highway.
    D: Using a hands-free mobile device while navigating heavy traffic.
  answer: B
  explanation: Aggressive driving is defined as any behind-the-wheel behavior that
    places others and/or property in danger through willful action without regard
    to safety.
- id: 187
  category: defensive_driving
  question: What is the recommended way to protect yourself from an aggressive driver?
  choices:
    A: Make direct eye contact to show you are not intimidated.
    B: Match their speed to prevent them from passing you.
    C: Avoid eye contact, back off, and do not attempt to match the aggressive act.
    D: Honk your horn repeatedly to alert other drivers of their behavior.
  answer: C
  explanation: To protect yourself from an aggressive driver, don’t engage with that
    driver. Avoid eye contact and don’t attempt to match an aggressive act. Back off
    and give way.
- id: 188
  category: driver_responsibility
  question: What special cellphone number can motorists and bicyclists dial to report
    aggressive drivers to the Colorado State Patrol?
  choices:
    A: '*911 (*911)'
    B: '*DOT (*368)'
    C: '*CSP (*277)'
    D: '*PAT (*728)'
  answer: C
  explanation: Dial *CSP (*277) to report aggressive drivers. The Colorado State Patrol
    has set aside this special cellphone number for this purpose.
- id: 189
  category: sharing_the_road
  question: Which of the following is a correct hand signal for a bicyclist making
    a right turn?
  choices:
    A: Extending the left arm directly out to the left.
    B: Dropping the left arm down at the elbow.
    C: Extending the right arm straight out or the left arm upward at a right angle.
    D: Waving the right hand in a circular motion.
  answer: C
  explanation: For a right turn, a bicyclist should extend the right arm straight
    out or the left arm upward at a right angle.
- id: 190
  category: penalties_and_points
  question: Which of the following aggressive acts can result in criminal charges
    beyond a reckless driving charge?
  choices:
    A: Honking and yelling at another driver.
    B: Tailgating another driver to get them to speed up.
    C: Passing a vehicle on the shoulder.
    D: Bumping or ramming another vehicle.
  answer: D
  explanation: Some acts, such as displaying a weapon at another motorist, bumping
    or ramming another vehicle or high speed pursuit of a vehicle can result in criminal
    charges beyond a reckless driving charge.
- id: 191
  category: safe_driving_rules
  question: When stopping at an intersection with a crosswalk, where should your vehicle
    be positioned?
  choices:
    A: You may stop in the crosswalk if you are preparing to turn right on red.
    B: Do not stop with any portion of your vehicle covering the crosswalk area.
    C: You can block the crosswalk as long as there are no pedestrians currently visible.
    D: Stop halfway into the crosswalk to get a better view of cross traffic.
  answer: B
  explanation: 'The manual explicitly states: ''Do not stop with any portion of your
    vehicle covering the crosswalk area.'''
- id: 192
  category: defensive_driving
  question: Which of the following is a recommended tip to avoid becoming an aggressive
    driver?
  choices:
    A: Tailgate slow drivers to encourage them to speed up.
    B: Leave early for any trip to allow enough time.
    C: Honk at uncourteous drivers to teach them a lesson.
    D: Transfer your anger from other situations into your driving.
  answer: B
  explanation: The manual suggests leaving early for any trip to allow enough time
    and to avoid transferring anger from other situations into your driving.
- id: 193
  category: defensive_driving
  question: What are the three primary options a driver has to avoid a collision?
  choices:
    A: Slow down or stop, turn, or speed up.
    B: Honk, brake hard, or swerve.
    C: Close your eyes, brake, or brace for impact.
    D: Shift to neutral, turn off the engine, or apply the parking brake.
  answer: A
  explanation: 'According to the manual, to avoid a collision, drivers have three
    options: slow down or stop, turn, or speed up.'
- id: 194
  category: vehicle_information
  question: How should you brake during an emergency if your vehicle is equipped with
    an Anti-lock Braking System (ABS)?
  choices:
    A: Pump the brakes rapidly to avoid skidding.
    B: Apply the brakes with hard, firm pressure and do not let up.
    C: Lightly tap the brake pedal until the vehicle stops.
    D: Apply the parking brake simultaneously with the foot brake.
  answer: B
  explanation: With ABS, you should apply the brakes with hard, firm pressure and
    not let up on the brake pedal, as the system only works with the pedal pushed
    down.
- id: 195
  category: vehicle_information
  question: If your vehicle does NOT have ABS, what is the proper procedure to turn
    quickly to avoid a collision?
  choices:
    A: Turn the steering wheel sharply while holding the brake pedal down to the floor.
    B: Step on the brake pedal, let up, and then turn the steering wheel.
    C: Accelerate while turning the steering wheel to maintain traction.
    D: Shift into neutral and turn the steering wheel without braking.
  answer: B
  explanation: Without ABS, you must step on the brake pedal, but then let up and
    turn the steering wheel. The brake should be released before making an evasive
    turn to avoid locking the front wheels.
- id: 196
  category: safe_driving_rules
  question: When a large animal suddenly runs in front of your vehicle, what might
    be the safest alternative to avoid a more serious crash?
  choices:
    A: Swerving sharply into the oncoming lane.
    B: Slamming on the brakes and locking the steering wheel.
    C: Hitting the animal rather than taking drastic evasive action that causes loss
      of control.
    D: Speeding up to scare the animal out of the way.
  answer: C
  explanation: The manual states that taking drastic evasive action may result in
    losing control of the vehicle and a more serious crash. Regretfully, the safest
    alternative for passengers may be hitting the animal.
- id: 197
  category: vehicle_information
  question: What is the first step you should take if your vehicle experiences brake
    failure?
  choices:
    A: Shift to a higher gear.
    B: Turn off the engine immediately.
    C: Pull on the parking brake handle as hard as possible.
    D: Take your foot off the accelerator and pump the brake pedal several times.
  answer: D
  explanation: If you experience brake failure, you should take your foot off the
    accelerator and pump the brake pedal several times. This will often build up enough
    brake pressure to allow you to stop.
- id: 198
  category: vehicle_information
  question: What should you do if you experience a tire blowout while driving?
  choices:
    A: Slam on the brakes and stop on the road immediately.
    B: Hold the steering wheel tightly, keep the vehicle going straight, and slow
      down gradually.
    C: Accelerate slightly to maintain control of the vehicle.
    D: Turn the steering wheel sharply toward the side of the blowout.
  answer: B
  explanation: During a tire blowout, hold the steering wheel tightly, keep the vehicle
    going straight as you slow down gradually, take your foot off the gas pedal, and
    use the brakes lightly.
- id: 199
  category: vehicle_information
  question: If your gas pedal becomes jammed while driving, what should you do?
  choices:
    A: Quickly shift to neutral, pull off the road, and turn off the engine.
    B: Reach down and try to pull the pedal up with your hand.
    C: Turn off the ignition immediately while still on the roadway.
    D: Apply the parking brake and keep the vehicle in drive.
  answer: A
  explanation: For a jammed gas pedal, keep your eyes on the road, quickly shift to
    neutral, pull off the road when safe to do so, and turn off the engine.
- id: 200
  category: driver_responsibility
  question: What is required of a passenger if the driver is physically incapable
    of reporting a crash?
  choices:
    A: The passenger is allowed to leave the scene immediately.
    B: The passenger must take over driving the vehicle.
    C: The passenger is required to report the crash and remain at the scene if directed
      by law enforcement.
    D: The passenger must move the vehicle off the highway regardless of its condition.
  answer: C
  explanation: If the driver is physically incapable, a passenger is required to report
    the crash and, if directed by law enforcement, remain at the scene until law enforcement
    arrives.
- id: 201
  category: driver_responsibility
  question: Under Accident Alert Status, when are you permitted to exchange information
    and file a report within 24 hours instead of waiting for police at the scene?
  choices:
    A: When there are minor injuries but the vehicles are drivable.
    B: When alcohol is involved but there are no injuries.
    C: When no alcohol/drugs are involved, there are no injuries, and all vehicles
      are drivable.
    D: When one vehicle is totaled but there are no injuries.
  answer: C
  explanation: Under Accident Alert Status, if alcohol and drugs are not involved,
    there are no injuries, and all vehicles are still drivable, you can exchange information
    and must file an accident report within 24 hours.
- id: 202
  category: driver_responsibility
  question: What must you do if you crash into a parked car and cannot find the owner?
  choices:
    A: Wait at the scene for up to one hour, then leave.
    B: Call law enforcement and leave a note in a place where the owner can find it.
    C: Leave the scene immediately if there is no visible damage.
    D: Honk your horn three times and drive away.
  answer: B
  explanation: If a crash involves a parked car and you cannot find the owner, call
    law enforcement and leave a note in a place where the owner of the car can find
    it.
- id: 203
  category: safe_driving_rules
  question: According to the Move It Law, when must motorists move their vehicles
    off a divided highway after a minor crash?
  choices:
    A: When the vehicle is drivable, no drugs/alcohol are involved, and there are
      no injuries.
    B: Only when law enforcement arrives and directs them to do so.
    C: Whenever there is more than $1,000 in property damage.
    D: When the crash involves a commercial vehicle.
  answer: A
  explanation: State law requires moving vehicles off a divided highway after a minor
    crash when the vehicle is drivable, no drugs or alcohol are involved, and there
    are no injuries.
- id: 204
  category: safe_driving_rules
  question: Under Colorado's Move Over Law, what must you do if you cannot safely
    move over one lane for a stationary vehicle with flashing hazard lights?
  choices:
    A: Stop your vehicle completely until the stationary vehicle turns off its hazards.
    B: Maintain your speed but honk your horn to alert the personnel.
    C: Slow down to at least 20 mph below the posted speed limit.
    D: Accelerate to pass the stationary vehicle as quickly as possible.
  answer: C
  explanation: If it is not safe to move over one lane, or you are on a road with
    one lane in each direction, you must slow down to at least 20 mph below the posted
    speed limit.
- id: 205
  category: driver_responsibility
  question: Under Good Samaritan laws, when is it appropriate to move a crash victim?
  choices:
    A: Whenever they complain of neck pain.
    B: Only if the victim's life is in danger.
    C: As soon as you arrive at the scene to clear the roadway.
    D: Only after law enforcement has arrived.
  answer: B
  explanation: A reasonable and prudent person acting under Good Samaritan laws would
    move a victim only if the victim's life is in danger.
- id: 206
  category: vehicle_information
  question: What should you expect if your vehicle experiences a power failure while
    driving?
  choices:
    A: The steering wheel will lock completely and cannot be turned.
    B: The brakes will stop working entirely.
    C: The steering may be difficult to turn and you may have to push very hard on
      the brake pedal.
    D: The vehicle will automatically shift into park.
  answer: C
  explanation: During a power failure, the steering may be difficult to turn but you
    can turn it, and the brakes will still work but you may have to push very hard
    on the brake pedal.
- id: 207
  category: driver_responsibility
  question: What must you do before giving care to a conscious victim at an emergency
    scene?
  choices:
    A: Ask for their permission
    B: Move them to the side of the road
    C: Wait for police to arrive
    D: Check their driver's license
  answer: A
  explanation: The manual states to 'Ask a conscious victim for permission before
    giving care.'
- id: 208
  category: driver_responsibility
  question: Before providing further care to a victim, what is the first thing you
    should check for?
  choices:
    A: Broken bones
    B: Life threatening emergencies
    C: Internal bleeding
    D: Head injuries
  answer: B
  explanation: According to the manual, you must 'Check the victim for life threatening
    emergencies before providing further care.'
- id: 209
  category: driver_responsibility
  question: How long should you continue to provide care to a victim after summoning
    professional help?
  choices:
    A: Until the victim feels better
    B: Until more highly trained personnel arrive
    C: For at least 15 minutes
    D: Until you have given a statement to the police
  answer: B
  explanation: The manual instructs to 'Summon professional help... and continue to
    provide care until more highly trained personnel arrive.'
- id: 210
  category: license_system
  question: What symbol appears on your Colorado driver license, permit, or ID if
    you register as an organ and tissue donor?
  choices:
    A: A green ribbon
    B: A red cross
    C: A heart with a 'Y'
    D: A star with a 'D'
  answer: C
  explanation: 'The manual states: ''If you say Yes, a heart with a “Y” will appear
    on the front of your license, permit or ID.'''
- id: 211
  category: driver_responsibility
  question: How many lives can just one organ donor potentially save?
  choices:
    A: Up to 2 lives
    B: Up to 4 lives
    C: Up to 8 lives
    D: Up to 15 lives
  answer: C
  explanation: According to the manual, 'Just one donor can save up to eight lives
    through organ donation...'
- id: 212
  category: driver_responsibility
  question: How many lives can one donor save and heal through eye and tissue donation?
  choices:
    A: More than 10
    B: More than 25
    C: More than 50
    D: More than 75
  answer: D
  explanation: The manual notes that one donor can 'save and heal more than 75 lives
    through eye and tissue donation.'
- id: 213
  category: driver_responsibility
  question: Will your decision to be an organ donor affect the medical care you receive
    before death?
  choices:
    A: Yes, doctors will prioritize organ preservation over your life.
    B: Yes, you will receive experimental treatments.
    C: No, doctors and nurses caring for you before death are not involved in the
      donation process.
    D: No, but you will be transferred to a different hospital immediately.
  answer: C
  explanation: 'The manual explicitly states: ''Your decision to be a donor will not
    affect medical care. Doctors and nurses caring for you before death are not involved
    in the donation process.'''
- id: 214
  category: license_system
  question: Who manages the Donate Life Colorado Organ and Tissue Donor Registry?
  choices:
    A: The Colorado Department of Transportation
    B: The Division of Motor Vehicles
    C: Donor Alliance
    D: The Federal Government
  answer: C
  explanation: 'The manual states: ''The donor registry is managed by Donor Alliance,
    a non-profit, federally-designated organ and tissue recovery agency...'''
- id: 215
  category: driver_responsibility
  question: Can a person with a chronic condition like diabetes or hepatitis register
    as an organ donor?
  choices:
    A: No, chronic conditions disqualify you from donation.
    B: Yes, anyone can register regardless of age or medical condition.
    C: Yes, but only if they are under the age of 50.
    D: No, unless they have been cured for at least five years.
  answer: B
  explanation: 'The manual confirms: ''Anyone - regardless of age or medical condition
    - can register as a donor. Patients with chronic conditions such as diabetes and
    hepatitis can potentially save and heal lives through donation.'''
- id: 216
  category: license_system
  question: What is the purpose of the Emily Keyes-John W. Buckner Organ and Tissue
    Donation Awareness Fund?
  choices:
    A: To pay for transplant surgeries for uninsured patients
    B: To fund public outreach and education about organ and tissue donation
    C: To compensate the families of organ donors
    D: To build new hospitals in Colorado
  answer: B
  explanation: According to the manual, 'Your contributions to the fund go directly
    to public outreach and education about organ and tissue donation.'
- id: 217
  category: driver_responsibility
  question: Approximately how many people in Colorado are waiting for a lifesaving
    organ transplant?
  choices:
    A: Nearly 500
    B: Nearly 1,000
    C: Nearly 1,500
    D: Nearly 5,000
  answer: C
  explanation: 'The manual states: ''In Colorado, there are nearly 1,500 people waiting
    for a lifesaving organ transplant...'''
- id: 218
  category: license_system
  question: When you sign up as an organ, eye, and tissue donor at the DMV, how long
    does your registration remain in effect?
  choices:
    A: For one year
    B: Until your driver license expires
    C: For five years
    D: It remains in effect unless you change it
  answer: D
  explanation: 'The manual states: ''When you sign up as an organ, eye and tissue
    donor, your registration remains in effect unless you change it.'''
- id: 219
  category: license_system
  question: According to the featured online services in the manual, which of the
    following can you do online?
  choices:
    A: Take your driving skills test
