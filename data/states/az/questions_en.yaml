metadata:
  source: 2025 Arizona Driver's Manual
  total_questions: 217
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Arizona, what is the minimum age an individual must reach to apply
    for an instruction permit?
  choices:
    A: 15 years
    B: 15 years and 6 months
    C: 16 years
    D: 14 years and 9 months
  answer: B
  explanation: According to the Arizona Driver License Manual, an applicant must be
    at least 15 years and 6 months old to be eligible for an instruction permit.
- id: 2
  category: license_system
  question: Under the Arizona Graduated Driver License (Class G) program, for the
    first six months, a driver is restricted from carrying more than how many passengers
    under the age of 18 who are not siblings?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: For the first six months of a Class G license, the driver may not have
    more than one passenger under the age of 18 unless they are siblings or the driver
    is accompanied by a parent/guardian.
- id: 3
  category: license_system
  question: During the first six months of holding an Arizona Class G license, a teen
    driver is prohibited from driving between which hours unless an exception applies?
  choices:
    A: 10:00 PM to 4:00 AM
    B: 11:00 PM to 5:00 AM
    C: Midnight to 5:00 AM
    D: 9:00 PM to 6:00 AM
  answer: C
  explanation: Arizona law restricts Class G license holders from driving between
    midnight and 5:00 AM during the first six months, unless driving to/from school,
    work, a religious event, or an emergency.
- id: 4
  category: license_system
  question: To qualify for an Arizona Class G license, a permit holder must have completed
    at least how many hours of supervised practice driving?
  choices:
    A: 20 hours (5 at night)
    B: 30 hours (10 at night)
    C: 40 hours (15 at night)
    D: 50 hours (10 at night)
  answer: B
  explanation: Applicants for a Class G license must certify that they have completed
    at least 30 hours of practice driving, including at least 10 hours at night.
- id: 5
  category: license_system
  question: What is the minimum vision requirement, with or without corrective lenses,
    to obtain an unrestricted Arizona driver license?
  choices:
    A: 20/20 in both eyes
    B: 20/30 in at least one eye
    C: 20/40 in at least one eye
    D: 20/50 in both eyes
  answer: C
  explanation: Arizona requires a minimum vision of 20/40 in at least one eye for
    an unrestricted license. If you require glasses or contacts to meet this, a restriction
    will be placed on your license.
- id: 6
  category: license_system
  question: An Arizona instruction permit is valid for a period of how many months?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: An Arizona instruction permit is valid for 12 months from the date
    of issuance.
- id: 7
  category: license_system
  question: In Arizona, accumulation of how many points within a 12-month period may
    result in a requirement to attend Traffic Survival School (TSS)?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: If you accumulate 8 or more points on your driving record within a
    12-month period, you may be required to attend Traffic Survival School or face
    license suspension.
- id: 8
  category: license_system
  question: Which of the following is a requirement for a person to accompany an Arizona
    instruction permit holder while they are driving?
  choices:
    A: They must be at least 18 years old
    B: They must be at least 21 years old and hold a valid license
    C: They must be a parent or legal guardian
    D: They must have at least 5 years of driving experience
  answer: B
  explanation: The person accompanying a permit holder must be at least 21 years old,
    hold a valid driver license, and occupy the seat beside the driver.
- id: 9
  category: license_system
  question: What are the minimum liability insurance requirements for a motor vehicle
    in Arizona?
  choices:
    A: $15,000/$30,000/$10,000
    B: $20,000/$40,000/$15,000
    C: $25,000/$50,000/$15,000
    D: $50,000/$100,000/$25,000
  answer: C
  explanation: Arizona law requires minimum liability coverage of $25,000 for bodily
    injury to one person, $50,000 for bodily injury to two or more persons, and $15,000
    for property damage.
- id: 10
  category: license_system
  question: A person under the age of 18 who is convicted of their first moving violation
    in Arizona will face which penalty?
  choices:
    A: Mandatory 30-day suspension
    B: Mandatory attendance at Traffic Survival School
    C: Permanent revocation of license
    D: A fine of $500
  answer: B
  explanation: For drivers under 18, the first conviction of a moving violation requires
    mandatory attendance at Traffic Survival School (TSS).
- id: 11
  category: license_system
  question: What is the primary difference between an Arizona 'Travel ID' and a standard
    Arizona driver license?
  choices:
    A: The Travel ID allows you to drive in other countries
    B: The Travel ID is REAL ID compliant for federal purposes like airport security
    C: The Travel ID is only for people over age 21
    D: The standard license is not valid for driving outside of Arizona
  answer: B
  explanation: The Arizona Travel ID is the state's version of the federal REAL ID,
    which will be required for boarding domestic flights and entering federal buildings
    starting in May 2025.
- id: 12
  category: license_system
  question: In Arizona, a 'Class D' license is considered which type of license?
  choices:
    A: Commercial Driver License
    B: Motorcycle License
    C: Operator License
    D: Graduated License
  answer: C
  explanation: A Class D license is the standard operator license for individuals
    18 years of age or older in Arizona.
- id: 13
  category: license_system
  question: How long must a teen hold an Arizona instruction permit before they can
    apply for a Class G license?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: An applicant must hold an Arizona instruction permit for at least six
    months before they are eligible to apply for a Class G (Graduated) driver license.
- id: 14
  category: license_system
  question: If you are a non-resident, such as a student or a member of the military
    stationed in Arizona, when are you required to obtain an Arizona driver license?
  choices:
    A: After 30 days of residency
    B: Immediately upon entering the state
    C: When you become an Arizona resident or accept employment in the state
    D: Only if your out-of-state license expires
  answer: C
  explanation: You must obtain an Arizona license if you become a resident, which
    includes working in Arizona (other than seasonal agricultural work) or remaining
    in Arizona for 7 months or more in a calendar year.
- id: 15
  category: license_system
  question: In Arizona, a standard Class D driver license is generally valid until
    the driver reaches what age?
  choices:
    A: 50 years of age
    B: 60 years of age
    C: 65 years of age
    D: 70 years of age
  answer: C
  explanation: Arizona is unique in that standard Class D and Class G licenses are
    valid until the driver reaches age 65. However, a new photo and vision test are
    required every 12 years.
- id: 16
  category: license_system
  question: 'Although an Arizona license may not expire until age 65, drivers are
    required to visit an MVD office to update their photo and undergo a vision screening
    every:'
  choices:
    A: 5 years
    B: 8 years
    C: 10 years
    D: 12 years
  answer: D
  explanation: Arizona law requires drivers to update their license photo and have
    a vision screening every 12 years to ensure the identification remains current.
- id: 17
  category: license_system
  question: 'Under Arizona''s Implied Consent law, if you are arrested for DUI and
    refuse to submit to a breath, blood, or urine test, your driving privilege will
    be suspended for at least:'
  choices:
    A: 90 days
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: According to the Arizona Driver License Manual, refusal to submit to
    a chemical test under the Implied Consent law results in a 12-month suspension
    of driving privileges (or 24 months for a second refusal within 84 months).
- id: 18
  category: license_system
  question: How many points are assessed against an Arizona driving record for a conviction
    of 'Aggressive Driving'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: D
  explanation: Aggressive Driving and DUI are both high-point violations in Arizona,
    each resulting in 8 points being added to the driver's record.
- id: 19
  category: license_system
  question: In Arizona, if you are convicted of 'Leaving the scene of an accident,'
    how many points will be added to your driving record?
  choices:
    A: 3 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: Leaving the scene of an accident (Hit and Run) is a serious violation
    that results in 6 points on an Arizona driving record.
- id: 20
  category: license_system
  question: For a standard Arizona license, what is the minimum required amount of
    liability insurance coverage for bodily injury to two or more persons in any one
    accident?
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $75,000
  answer: C
  explanation: Arizona law requires minimum liability limits of $25,000 for bodily
    injury to one person, $50,000 for bodily injury to two or more persons, and $15,000
    for property damage.
- id: 21
  category: license_system
  question: 'Unlike the standard Arizona license that lasts until age 65, the Arizona
    ''Travel ID'' (REAL ID compliant) must be renewed every:'
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 12 years
  answer: C
  explanation: The Arizona Travel ID is valid for a maximum of 8 years, which differs
    from the standard license expiration of age 65.
- id: 22
  category: license_system
  question: In Arizona, a conviction for 'Reckless Driving' results in how many points
    on your driving record?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: D
  explanation: Reckless Driving is considered a major violation in Arizona and carries
    an 8-point penalty.
- id: 23
  category: license_system
  question: If your Arizona driving privilege is suspended, what is the standard fee
    required to 'reinstate' the license (in addition to any application fees)?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: A
  explanation: To reinstate a suspended license in Arizona, the driver must typically
    pay a $10 reinstatement fee plus the appropriate application fee for their age
    group.
- id: 24
  category: license_system
  question: How many points are assessed on an Arizona driving record for failing
    to stop for a school bus with its red lights flashing and stop arm extended?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Failure to stop for a school bus is a serious safety violation in Arizona
    and results in 6 points on the driver's record.
- id: 25
  category: license_system
  question: 'Under Arizona law, if a male applicant is between the ages of 18 and
    26, applying for a driver license automatically:'
  choices:
    A: Enrolls them in the state militia
    B: Registers them for the Selective Service
    C: Registers them as an organ donor
    D: Signs them up for jury duty
  answer: B
  explanation: Arizona law requires that any male citizen or immigrant between 18
    and 26 who applies for a license or ID card be registered with the Selective Service
    System.
- id: 26
  category: license_system
  question: Which symbol is placed on an Arizona driver license to indicate that the
    person is an organ and tissue donor?
  choices:
    A: A red 'D'
    B: A green 'O'
    C: A red heart with the word 'DONOR'
    D: A blue star
  answer: C
  explanation: Arizona licenses use a red heart symbol with the word 'DONOR' to indicate
    the holder has registered as an organ and tissue donor.
- id: 27
  category: license_system
  question: 'When applying for an Arizona driver license, you must provide your Social
    Security number. This is required by:'
  choices:
    A: Arizona State Law only
    B: Federal Law only
    C: Both State and Federal Law
    D: The Arizona Department of Public Safety
  answer: C
  explanation: Both Federal and Arizona State Law require the collection of Social
    Security numbers for driver license applications to verify identity and for child
    support enforcement.
- id: 28
  category: license_system
  question: 'If you are convicted of ''Failure to stop for a traffic signal'' (running
    a red light) in Arizona, and it is your first offense, you will be required to:'
  choices:
    A: Pay a $1,000 fine
    B: Attend Traffic Survival School (TSS)
    C: Forfeit your vehicle
    D: Serve 24 hours in jail
  answer: B
  explanation: In Arizona, a conviction for failing to stop at a traffic signal requires
    the driver to attend and successfully complete Traffic Survival School (TSS).
- id: 29
  category: driver_testing
  question: In Arizona, what is the blood alcohol concentration (BAC) limit for a
    driver under the age of 21?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.02%
    D: 0.00% (Any detectable amount)
  answer: D
  explanation: Arizona has a 'zero tolerance' law for minors. It is illegal for any
    person under 21 to drive or be in physical control of a vehicle with any spirituous
    liquor in their body.
- id: 30
  category: driver_testing
  question: Under Arizona law, a person is guilty of 'Extreme DUI' if their blood
    alcohol concentration (BAC) is at or above what level?
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: In Arizona, an Extreme DUI conviction applies to drivers with a BAC
    of 0.15% or higher.
- id: 31
  category: driver_testing
  question: In Arizona, what is the speed limit in a school zone when the yellow lights
    are flashing or signs are posted?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The speed limit in a marked school zone in Arizona is 15 mph unless
    otherwise posted.
- id: 32
  category: driver_testing
  question: When parking on a public road in Arizona, you may not park within how
    many feet of a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: Arizona law prohibits parking within 15 feet of a fire hydrant.
- id: 33
  category: driver_testing
  question: Arizona's 'Move Over' law requires drivers to do what when approaching
    a stationary emergency vehicle with flashing lights on a multi-lane highway?
  choices:
    A: Stop immediately in the lane of travel
    B: Move to a lane that is not adjacent to the emergency vehicle, if safe to do
      so
    C: Maintain speed but honk to alert the emergency workers
    D: Speed up to pass the scene as quickly as possible
  answer: B
  explanation: The Move Over law requires drivers to move over one lane for stationary
    emergency vehicles. If it is unsafe to change lanes, the driver must slow down
    and proceed with caution.
- id: 34
  category: driver_testing
  question: In Arizona, how many points are added to your driving record for failing
    to stop for a traffic signal (running a red light)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Failure to stop for a traffic signal in Arizona results in 2 points
    on your driving record and usually requires attendance at Traffic Survival School.
- id: 35
  category: driver_testing
  question: You are prohibited from parking within how many feet of a stop sign in
    Arizona?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Arizona law prohibits parking within 30 feet of any flashing beacon,
    stop sign, yield sign, or traffic control signal located at the side of a roadway.
- id: 36
  category: driver_testing
  question: A first-time DUI conviction in Arizona requires the installation of a
    certified ignition interlock device (IID) for at least how long?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: Even for a first-time regular DUI, Arizona law requires the installation
    of a certified ignition interlock device for at least 12 months.
- id: 37
  category: driver_testing
  question: What is the recommended following distance for most driving conditions
    in Arizona to avoid tailgating?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The Arizona Driver License Manual recommends a '3-second rule' to maintain
    a safe following distance under normal conditions.
- id: 38
  category: driver_testing
  question: When using hand signals to indicate a turn or stop, what does it mean
    when the driver's arm is extended downward?
  choices:
    A: Right turn
    B: Left turn
    C: Stop or slow down
    D: U-turn
  answer: C
  explanation: A hand and arm extended downward indicates that the driver is stopping
    or decreasing speed.
- id: 39
  category: driver_testing
  question: 'In Arizona, you may pass another vehicle on the right only when:'
  choices:
    A: The vehicle ahead is making or about to make a left turn and there is a paved
      lane
    B: You are in a hurry and the left lane is moving too slowly
    C: The shoulder of the road is wide enough to fit your car
    D: You are on a two-lane, two-way highway
  answer: A
  explanation: Passing on the right is permitted only if the vehicle ahead is making
    a left turn and there is a paved portion of the road available to pass without
    driving off the pavement.
- id: 40
  category: driver_testing
  question: When driving at night, Arizona law requires you to dim your high-beam
    headlights when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: You must dim your high beams to low beams when an oncoming vehicle
    is within 500 feet.
- id: 41
  category: driver_testing
  question: If you are following another vehicle at night in Arizona, you must dim
    your high-beam headlights when you are within how many feet of the vehicle ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 800 feet
  answer: B
  explanation: Arizona law requires you to dim your high beams when you are following
    another vehicle within 200 feet.
- id: 42
  category: driver_testing
  question: To pass the Arizona written knowledge test, what is the minimum number
    of questions you must answer correctly out of 30?
  choices:
    A: '21'
    B: '24'
    C: '26'
    D: '28'
  answer: B
  explanation: The Arizona knowledge test consists of 30 questions. A passing score
    is 80 percent, which means you must answer at least 24 questions correctly.
- id: 43
  category: driver_testing
  question: In Arizona, it is illegal to park your vehicle within how many feet of
    a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Arizona law prohibits parking within 15 feet of a fire hydrant to ensure
    emergency access.
- id: 44
  category: driver_testing
  question: When parking on a level street in Arizona, your wheels must be parallel
    to the curb and within how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: Arizona law requires that vehicles parked on a roadway must have their
    right-hand wheels parallel to and within 18 inches of the right-hand curb.
- id: 45
  category: driver_testing
  question: Arizona's 'Move Over' law requires drivers to move to a non-adjacent lane
    or slow down when approaching which type of stationary vehicle with flashing lights?
  choices:
    A: Only police and fire vehicles
    B: Only ambulances and tow trucks
    C: Any vehicle with flashing lights, including utility and hazard vehicles
    D: Only school buses
  answer: C
  explanation: Arizona's Move Over law applies to any stationary vehicle with flashing
    lights, including emergency responders, tow trucks, and utility vehicles.
- id: 46
  category: driver_testing
  question: When passing a bicycle traveling in the same direction in Arizona, what
    is the minimum distance a motorist must maintain between the vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Arizona law (ARS 28-735) requires motorists to leave a safe distance
    of no less than three feet when overtaking or passing a bicycle.
- id: 47
  category: driver_testing
  question: 'Under Arizona''s ''Zero Tolerance'' law, a person under the age of 21
    can be convicted of DUI if their BAC is at least:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: Any measurable amount
  answer: D
  explanation: Arizona has a zero-tolerance policy for underage drinking and driving;
    any measurable amount of alcohol in a person under 21 can lead to a DUI charge.
- id: 48
  category: driver_testing
  question: 'In Arizona, a conviction for failing to stop for a red light will result
    in 2 points on your record and a mandatory requirement to:'
  choices:
    A: Pay a $1,000 fine
    B: Attend Traffic Survival School (TSS)
    C: Retake the road test
    D: Surrender your license for 30 days
  answer: B
  explanation: Arizona law requires drivers convicted of a red-light violation to
    attend Traffic Survival School (TSS) in addition to the points assessed.
- id: 49
  category: driver_testing
  question: For a first-time DUI conviction in Arizona, for how long is a driver typically
    required to use a certified ignition interlock device?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: A first-time DUI conviction in Arizona generally requires the installation
    of a certified ignition interlock device for at least 12 months.
- id: 50
  category: driver_testing
  question: 'In Arizona, a ''Super Extreme DUI'' charge applies to drivers with a
    BAC of at least:'
  choices:
    A: 0.15%
    B: 0.18%
    C: 0.20%
    D: 0.25%
  answer: C
  explanation: Arizona law defines a Super Extreme DUI as operating a vehicle with
    a Blood Alcohol Concentration of 0.20% or higher.
- id: 51
  category: driver_testing
  question: When taking the Arizona road test, which of the following must you provide
    for the vehicle you are using?
  choices:
    A: Proof of insurance only
    B: Valid registration only
    C: Both valid registration and proof of insurance
    D: A notarized letter from the vehicle owner
  answer: C
  explanation: To take the road test in Arizona, the vehicle must be in safe working
    condition and you must provide current proof of insurance and valid registration.
- id: 52
  category: driver_testing
  question: Arizona's open container law prohibits the possession of an open container
    of spirituous liquor in which part of the vehicle?
  choices:
    A: The passenger compartment
    B: The trunk
    C: The area behind the last upright seat in a hatchback
    D: A locked glove box
  answer: A
  explanation: Arizona law prohibits the possession of an open container of alcohol
    in the passenger compartment of a motor vehicle on any public highway.
- id: 53
  category: driver_responsibility
  question: 'In Arizona, if you are involved in a motor vehicle accident that results
    in injury or death, you must immediately notify:'
  choices:
    A: The local police department, sheriff, or state highway patrol
    B: Your insurance company only
    C: The MVD within 30 days
    D: The Governor's Office of Highway Safety
  answer: A
  explanation: Arizona law requires drivers to immediately notify the local police,
    county sheriff, or the nearest office of the state highway patrol if an accident
    results in injury or death.
- id: 54
  category: driver_responsibility
  question: When you sell or transfer a vehicle in Arizona, you must submit a 'Sold
    Notice' to the MVD within how many days?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: According to Arizona law, a 'Sold Notice' must be submitted to the
    MVD within 10 days of selling or transferring a vehicle to protect the seller
    from liability for tickets or accidents involving the vehicle after the sale.
- id: 55
  category: driver_responsibility
  question: In Arizona, what is the threshold for an 'Extreme DUI' charge for an adult
    driver?
  choices:
    A: 0.08% BAC
    B: 0.10% BAC
    C: 0.15% BAC
    D: 0.20% BAC
  answer: C
  explanation: In Arizona, a person is guilty of 'Extreme DUI' if their Blood Alcohol
    Concentration (BAC) is 0.15% or higher.
- id: 56
  category: driver_responsibility
  question: 'A ''Super Extreme DUI'' in Arizona is defined as driving with a Blood
    Alcohol Concentration (BAC) of:'
  choices:
    A: 0.15% or higher
    B: 0.20% or higher
    C: 0.25% or higher
    D: 0.30% or higher
  answer: B
  explanation: Arizona law classifies a BAC of 0.20% or higher as a 'Super Extreme
    DUI,' which carries significantly harsher penalties than a standard or Extreme
    DUI.
- id: 57
  category: driver_responsibility
  question: What is the fine for a first-time conviction of failing to provide proof
    of current financial responsibility (insurance) in Arizona?
  choices:
    A: A minimum of $100
    B: A minimum of $250
    C: A minimum of $500
    D: A minimum of $1,000
  answer: C
  explanation: For a first-time offense of failing to provide proof of insurance,
    Arizona law mandates a minimum fine of $500 and a three-month suspension of driving
    privileges and vehicle registration.
- id: 58
  category: driver_responsibility
  question: 'When purchasing a vehicle from a private party in Arizona, the buyer
    must apply for a title transfer within:'
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: Arizona law requires the buyer of a vehicle to apply for a transfer
    of title and registration within 15 days of the purchase.
- id: 59
  category: driver_responsibility
  question: For a first-time standard DUI conviction in Arizona, what is the minimum
    mandatory jail sentence?
  choices:
    A: 24 hours
    B: 48 hours
    C: 10 consecutive days
    D: 30 consecutive days
  answer: C
  explanation: A first-time standard DUI conviction in Arizona carries a minimum of
    10 consecutive days in jail, though 9 days may be waived upon completion of a
    court-ordered alcohol screening and treatment program.
- id: 60
  category: driver_responsibility
  question: 'In Arizona, any person convicted of a DUI is required to equip their
    vehicle with a certified ignition interlock device for at least:'
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: Arizona law requires all drivers convicted of a DUI (including first-time
    standard DUI) to use a certified ignition interlock device for at least 12 months.
- id: 61
  category: driver_responsibility
  question: Arizona's 'Open Container' law prohibits which of the following?
  choices:
    A: Having an open container of alcohol in the trunk of the car
    B: Having an open container of alcohol in the passenger compartment of a motor
      vehicle on a public highway
    C: Transporting unopened alcohol in the back seat
    D: Drinking water while driving
  answer: B
  explanation: Arizona law prohibits the possession of an open container of spirituous
    liquor in the passenger compartment of a motor vehicle while on any public highway.
- id: 62
  category: driver_responsibility
  question: In which Arizona areas is vehicle emissions testing generally required
    for vehicle registration renewal?
  choices:
    A: Statewide in all 15 counties
    B: Only in the city of Flagstaff
    C: The Phoenix (Maricopa County) and Tucson (Pima County) metropolitan areas
    D: Only for commercial vehicles
  answer: C
  explanation: Emissions testing is required for most vehicles kept in the Phoenix
    and Tucson metropolitan areas (specifically parts of Maricopa and Pima counties).
- id: 63
  category: driver_responsibility
  question: Under the 'Motor Voter' law, Arizona residents can do which of the following
    when applying for or renewing a driver license?
  choices:
    A: Pay their property taxes
    B: Register to vote
    C: Apply for a passport
    D: Renew their hunting license
  answer: B
  explanation: The National Voter Registration Act (Motor Voter) allows eligible Arizona
    citizens to register to vote or update their voter registration while applying
    for or renewing a driver license.
- id: 64
  category: driver_responsibility
  question: 'In Arizona, if you have a medical condition that may affect your ability
    to drive safely, you are responsible for:'
  choices:
    A: Reporting it to the MVD only if you get into an accident
    B: Nothing, as medical records are private
    C: Reporting the condition to the MVD Medical Review Program
    D: Stopping driving immediately without notifying anyone
  answer: C
  explanation: Arizona drivers have a legal responsibility to report any physical
    or mental condition that may impair their ability to safely operate a motor vehicle
    to the MVD Medical Review Program.
- id: 65
  category: driver_responsibility
  question: 'A first-time conviction for driving without evidence of current financial
    responsibility (insurance) in Arizona results in a civil penalty of at least:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: For a first offense of failing to maintain or provide proof of financial
    responsibility, Arizona law mandates a minimum fine of $500 and a three-month
    suspension of driving privileges/registration.
- id: 66
  category: driver_responsibility
  question: 'In Arizona, a person is considered to be committed an ''Extreme DUI''
    if their Blood Alcohol Concentration (BAC) is at or above:'
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: Arizona law defines an Extreme DUI as operating a vehicle with a BAC
    of 0.15% or higher.
- id: 67
  category: driver_responsibility
  question: 'If you strike an unattended vehicle in Arizona and cannot locate the
    owner, you must:'
  choices:
    A: Wait for 30 minutes and then leave if no one appears.
    B: Leave a note in a conspicuous place with your name, address, and vehicle registration
      info.
    C: Report it to your insurance company within 48 hours only.
    D: Call a tow truck to remove the other vehicle.
  answer: B
  explanation: Arizona law (ARS 28-664) requires you to either locate the owner or
    leave a written notice with your contact information and the name/address of the
    vehicle owner if it isn't yours.
- id: 68
  category: driver_responsibility
  question: When asked by law enforcement to provide proof of financial responsibility,
    Arizona drivers may provide proof in which format?
  choices:
    A: Only a physical paper ID card issued by the insurer.
    B: Only an original insurance policy document.
    C: Either a physical paper ID card or an electronic device (smartphone) displaying
      the image.
    D: A verbal confirmation of the policy number.
  answer: C
  explanation: Arizona law allows drivers to show proof of insurance in either a physical
    or electronic format, such as on a smartphone.
- id: 69
  category: driver_responsibility
  question: Upon becoming a resident of Arizona, how long do you have to register
    your out-of-state vehicle?
  choices:
    A: Immediately
    B: 30 days
    C: 60 days
    D: 90 days
  answer: A
  explanation: Arizona law requires that you register your vehicle immediately upon
    becoming a resident or at the time you establish residency.
- id: 70
  category: driver_responsibility
  question: If your insurance company cancels your policy and you do not provide the
    MVD with new insurance information, what action will the MVD take?
  choices:
    A: They will increase your vehicle registration fee.
    B: They will suspend your vehicle registration.
    C: They will issue a warrant for your arrest.
    D: They will take no action until your registration expires.
  answer: B
  explanation: If the MVD receives notice that a policy is no longer active, they
    will send a 'de-insured' notice. Failure to provide proof of new insurance will
    result in the suspension of the vehicle's registration.
- id: 71
  category: driver_responsibility
  question: 'In Arizona, the ''Motor Voter'' law allows you to:'
  choices:
    A: Vote for MVD officials.
    B: Apply for or update your voter registration when applying for a driver license.
    C: Use your vehicle registration as a ballot.
    D: Skip jury duty if you have a clean driving record.
  answer: B
  explanation: The National Voter Registration Act (Motor Voter) allows Arizona residents
    to register to vote or update their registration at the same time they apply for
    or renew a driver license.
- id: 72
  category: driver_responsibility
  question: 'Arizona law requires that children must be properly secured in a child
    restraint system (car seat) if they are:'
  choices:
    A: Under 5 years of age.
    B: Under 8 years of age and under 4 feet 9 inches tall.
    C: Under 10 years of age.
    D: Under 60 pounds regardless of age.
  answer: B
  explanation: Arizona law requires children under 8 years old and under 4'9" tall
    to be secured in an appropriate child restraint system.
- id: 73
  category: safe_driving_rules
  question: 'In Arizona, a driver may turn left on a red light only when turning from:'
  choices:
    A: A two-way street onto a one-way street
    B: A one-way street onto a two-way street
    C: A one-way street onto another one-way street
    D: Any street if there is no cross traffic
  answer: C
  explanation: In Arizona, you may turn left on a red light only when turning from
    a one-way street onto another one-way street, after coming to a complete stop
    and yielding to traffic and pedestrians.
- id: 74
  category: safe_driving_rules
  question: 'To maintain a safe following distance in Arizona, the driver manual recommends
    using the:'
  choices:
    A: 1-second rule
    B: 2-second rule
    C: 3-second rule
    D: 5-second rule
  answer: C
  explanation: The Arizona Driver License Manual recommends a 3-second following distance
    under normal driving conditions.
- id: 75
  category: safe_driving_rules
  question: In Arizona, traffic fines are __________ for violations committed in a
    designated work zone when workers are present.
  choices:
    A: Reduced by half
    B: Doubled
    C: Tripled
    D: Waived for first-time offenders
  answer: B
  explanation: Arizona law mandates that fines for traffic violations are doubled
    in work zones when workers are present.
- id: 76
  category: safe_driving_rules
  question: In Arizona, you must signal your intention to turn at least how many feet
    before making the turn?
  choices:
    A: 50 feet
    B: 75 feet
    C: 100 feet
    D: 200 feet
  answer: C
  explanation: The Arizona Driver License Manual states you should signal at least
    100 feet before you turn.
- id: 77
  category: safe_driving_rules
  question: If you are driving on a highway with three or more lanes, which lane is
    typically used for slower traffic in Arizona?
  choices:
    A: The left lane
    B: The center lane
    C: The right lane
    D: The HOV lane
  answer: C
  explanation: In Arizona, the right lane is intended for slower traffic, while the
    left lanes are for passing and faster traffic.
- id: 78
  category: safe_driving_rules
  question: 'In Arizona, it is illegal to follow a fire engine responding to an alarm
    closer than:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Arizona law prohibits following a fire truck responding to an alarm
    closer than 500 feet.
- id: 79
  category: safe_driving_rules
  question: What is the recommended following distance behind the vehicle in front
    of you when driving on Arizona highways under ideal conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The Arizona Driver License Manual recommends maintaining a following
    distance of at least 3 seconds to allow for safe reaction time.
- id: 80
  category: safe_driving_rules
  question: Unless otherwise posted, what is the maximum speed limit in a business
    or residential district in Arizona?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: In Arizona, the default speed limit in residential and business districts
    is 25 mph unless signs indicate otherwise.
- id: 81
  category: safe_driving_rules
  question: Under what condition is it legal to pass another vehicle on the right
    in Arizona?
  choices:
    A: Whenever you are in a hurry
    B: When the vehicle ahead is making a left turn and there is a paved shoulder
      or lane available
    C: Only on the freeway
    D: It is never legal to pass on the right
  answer: B
  explanation: Arizona law allows passing on the right if the vehicle being overtaken
    is making a left turn and there is sufficient width for two or more lines of moving
    vehicles.
- id: 82
  category: safe_driving_rules
  question: In Arizona, traffic fines for speeding are generally doubled when the
    violation occurs in which of the following areas?
  choices:
    A: School zones
    B: Residential neighborhoods
    C: Designated construction or maintenance zones when workers are present
    D: Hospital zones
  answer: C
  explanation: Arizona law mandates that fines for speeding and other traffic violations
    are doubled in work zones when workers are present.
- id: 83
  category: safe_driving_rules
  question: 'Arizona law defines a ''Super Extreme DUI'' as having a Blood Alcohol
    Concentration (BAC) of at least:'
  choices:
    A: 0.15%
    B: 0.18%
    C: 0.20%
    D: 0.25%
  answer: C
  explanation: In Arizona, a 'Super Extreme DUI' charge applies to drivers with a
    BAC of 0.20% or higher.
- id: 84
  category: defensive_driving
  question: If you encounter a severe dust storm while driving in Arizona, what is
    the safest course of action according to the 'Pull Off, Turn Off, Keep Feet Off'
    rule?
  choices:
    A: Slow down and keep your hazard lights on while driving on the shoulder.
    B: Pull entirely off the paved road, turn off all vehicle lights, and take your
      foot off the brake.
    C: Stop in your lane and keep your brake lights on so others can see you.
    D: Speed up to get through the dust cloud as quickly as possible.
  answer: B
  explanation: In Arizona dust storms, you must pull off the road, turn off all lights
    (including hazards), and take your foot off the brake so other drivers don't follow
    your tail lights and crash into you.
- id: 85
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning in Arizona traffic,
    how far ahead should you be scanning the road?
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 25 seconds
    D: 30 to 40 seconds
  answer: B
  explanation: Defensive driving in Arizona requires looking 10 to 15 seconds ahead
    to identify potential hazards early.
- id: 86
  category: defensive_driving
  question: Hydroplaning can occur during Arizona monsoons. At what speed can most
    tires begin to lose all contact with the road in heavy rain?
  choices:
    A: 35 mph
    B: 50 mph
    C: 65 mph
    D: 75 mph
  answer: B
  explanation: While hydroplaning can start at lower speeds, most tires lose all traction
    with the road at speeds around 50 mph during heavy rain.
- id: 87
  category: defensive_driving
  question: When approaching a school crosswalk in Arizona that is marked with a standard
    15 mph sign, when does the speed limit apply?
  choices:
    A: Only when children are present on the sidewalk.
    B: At all times, 24 hours a day.
    C: When the yellow lights are flashing or when signs are placed in the street.
    D: Only during the first hour of the school day.
  answer: C
  explanation: In Arizona, the 15 mph school zone speed limit is active when signs
    are placed in the street or when lights are flashing.
- id: 88
  category: defensive_driving
  question: Why is the road surface most slippery in Arizona during the first few
    minutes of a rainstorm?
  choices:
    A: The rain cools the hot asphalt too quickly.
    B: Oil and grease on the pavement mix with the water.
    C: The tires are still hot from the Arizona sun.
    D: The humidity reduces brake effectiveness.
  answer: B
  explanation: In Arizona, long dry spells allow oil and rubber to build up on roads;
    when it first rains, these mix with water to create a very slippery surface.
- id: 89
  category: defensive_driving
  question: When driving on slippery roads or in poor visibility in Arizona, how should
    you adjust your following distance?
  choices:
    A: Keep it at 3 seconds.
    B: Decrease it to 2 seconds to stay close to the car ahead.
    C: Increase it to 6 seconds or more.
    D: Following distance does not matter if you have ABS brakes.
  answer: C
  explanation: In adverse conditions like rain or dust, Arizona guidelines suggest
    doubling your following distance to 6 seconds or more.
- id: 90
  category: defensive_driving
  question: When parking your vehicle on a downhill grade with a curb in Arizona,
    which way should you turn your front wheels?
  choices:
    A: Toward the curb.
    B: Away from the curb.
    C: Keep them straight.
    D: It depends on if the car is automatic or manual.
  answer: A
  explanation: When parking downhill with a curb, you should turn your wheels toward
    the curb so the vehicle will roll into the curb rather than into traffic if the
    brakes fail.
- id: 91
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, the Arizona
    Driver License Manual suggests scanning the road how far ahead?
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: 60 seconds
  answer: B
  explanation: Scanning 10 to 15 seconds ahead allows you to see hazards early and
    adjust your speed or position safely.
- id: 92
  category: defensive_driving
  question: In Arizona, at what speed can hydroplaning (where tires lose contact with
    the road and ride on a layer of water) begin?
  choices:
    A: At any speed over 15 mph
    B: As low as 35 mph
    C: Only at speeds above 65 mph
    D: Only during heavy monsoon rains
  answer: B
  explanation: Hydroplaning can begin at speeds as low as 35 mph. In a heavy rain,
    your tires can lose all contact with the road at 55 mph.
- id: 93
  category: defensive_driving
  question: In Arizona, a conviction for 'Excessive Speeding' is a Class 3 misdemeanor.
    Which of the following constitutes excessive speeding?
  choices:
    A: Exceeding 35 mph in a school zone.
    B: Exceeding 85 mph on any highway.
    C: Exceeding the posted speed limit by 15 mph in a residential area.
    D: Driving 10 mph over the limit on a rural interstate.
  answer: B
  explanation: ARS 28-701.02 defines excessive speed as exceeding 35 mph in a school
    zone, exceeding 85 mph in any location, or exceeding the posted limit by more
    than 20 mph in other areas.
- id: 94
  category: defensive_driving
  question: In Arizona, if you are convicted of running a red light and it does not
    result in serious injury or death, what is the mandatory penalty in addition to
    a fine?
  choices:
    A: A 30-day jail sentence
    B: Permanent revocation of your license
    C: Attendance at Traffic Survival School (TSS)
    D: A requirement to install an Ignition Interlock Device
  answer: C
  explanation: Under Arizona law, any driver convicted of a red-light violation is
    required to attend and successfully complete Traffic Survival School.
- id: 95
  category: defensive_driving
  question: Arizona's 'Waste of a Finite Resource' law applies to which of the following
    situations?
  choices:
    A: Driving an electric vehicle in the HOV lane.
    B: Speeding between 56 and 65 mph in a 55 mph zone on certain highways.
    C: Leaving your engine idling for more than 10 minutes.
    D: Failing to recycle motor oil.
  answer: B
  explanation: ARS 28-702.01 states that speeding up to 10 mph over the limit in a
    55 mph zone is a 'waste of a finite resource' violation, which carries a small
    fine and no points against the driver license.
- id: 96
  category: defensive_driving
  question: 'In Arizona, if you are under 21 years of age, you can be cited for a
    DUI if your Blood Alcohol Concentration (BAC) is at least:'
  choices:
    A: 0.01% or any detectable amount
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: A
  explanation: Arizona has a 'Zero Tolerance' policy for under-21 drivers; any detectable
    amount of alcohol in their system can lead to a DUI charge.
- id: 97
  category: alcohol_drugs_health
  question: What is the Blood Alcohol Concentration (BAC) threshold for a 'Super Extreme
    DUI' conviction in Arizona?
  choices:
    A: 0.15% or higher
    B: 0.20% or higher
    C: 0.25% or higher
    D: 0.30% or higher
  answer: B
  explanation: A 'Super Extreme DUI' in Arizona applies to drivers with a BAC of 0.20%
    or higher.
- id: 98
  category: alcohol_drugs_health
  question: Which of the following is a mandatory requirement for ALL DUI convictions
    in the state of Arizona?
  choices:
    A: Permanent revocation of the driver license
    B: Installation of a certified ignition interlock device
    C: A minimum of 5 years of probation
    D: Forfeiture of the vehicle used during the offense
  answer: B
  explanation: Arizona law requires anyone convicted of a DUI (including a first offense)
    to install a certified ignition interlock device on any vehicle they operate.
- id: 99
  category: alcohol_drugs_health
  question: 'Under Arizona''s Admin Per Se law, if you operate a motor vehicle and
    the results of your breath or blood test show a BAC of 0.08% or more, your driving
    privilege will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: If a test shows a BAC of 0.08% or more (or 0.04% for commercial vehicles),
    your license will be suspended for 90 consecutive days.
- id: 100
  category: alcohol_drugs_health
  question: 'In Arizona, a DUI is classified as an ''Aggravated DUI'' and charged
    as a felony if the driver:'
  choices:
    A: Is driving with a passenger under the age of 15
    B: Has a BAC of 0.10% or higher
    C: Is driving a vehicle with out-of-state plates
    D: Is driving after 2:00 AM
  answer: A
  explanation: Aggravated DUI (a felony) occurs if you commit a DUI while your license
    is suspended/revoked, commit a third DUI in 84 months, or commit a DUI while a
    person under 15 is in the vehicle.
- id: 101
  category: alcohol_drugs_health
  question: 'If you are taking a prescription drug and it impairs your ability to
    drive safely in Arizona, you:'
  choices:
    A: Cannot be charged with a DUI because the drug was legally prescribed
    B: Can be charged with a DUI
    C: Will only be charged if you also consumed alcohol
    D: Are exempt from DUI laws if you have a doctor's note in the vehicle
  answer: B
  explanation: In Arizona, you can be charged with a DUI for driving under the influence
    of any drug that impairs your ability to drive, including prescription medications
    and over-the-counter drugs.
- id: 102
  category: alcohol_drugs_health
  question: According to Arizona medical standards, a person who has experienced a
    seizure must generally be seizure-free for how long before they can resume driving?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Arizona medical standards require a driver to be seizure-free for a
    period of 90 days before they are eligible to drive, though this can be reviewed
    by the Medical Review Program.
- id: 103
  category: alcohol_drugs_health
  question: 'If you are involved in a crash in Arizona and a law enforcement officer
    has probable cause to believe you were driving under the influence, they can:'
  choices:
    A: Only test you if you are conscious
    B: Require you to submit to a blood, breath, or urine test
    C: Only test you if there was a fatality
    D: Not test you without a warrant signed by a judge in person
  answer: B
  explanation: Under Arizona's Implied Consent law, any person who operates a motor
    vehicle gives consent to a test of their blood, breath, or urine if arrested for
    DUI.
- id: 104
  category: alcohol_drugs_health
  question: 'In Arizona, if you are convicted of a second DUI offense within 84 months,
    your driving privilege will be revoked for at least:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 3 years
  answer: C
  explanation: A second DUI conviction within a period of 84 months results in a minimum
    1-year revocation of the driver license.
- id: 105
  category: alcohol_drugs_health
  question: Which of the following is true regarding marijuana use and driving in
    Arizona?
  choices:
    A: It is legal to drive as long as you have a medical marijuana card
    B: It is legal to drive if you only used marijuana and no alcohol
    C: You can be convicted of a DUI if you are impaired to the slightest degree by
      marijuana
    D: Marijuana does not affect reaction time or coordination
  answer: C
  explanation: Regardless of the legal status of marijuana, Arizona law prohibits
    driving while impaired by any drug. You can be convicted of a DUI if you are impaired
    to the 'slightest degree'.
- id: 106
  category: alcohol_drugs_health
  question: Which of the following scenarios would result in an 'Aggravated DUI' charge
    in Arizona?
  choices:
    A: Driving under the influence with a passenger under 15 years old in the vehicle
    B: Driving under the influence with a BAC of 0.15%
    C: Driving under the influence for the first time
    D: Driving under the influence while raining
  answer: A
  explanation: In Arizona, a DUI is elevated to an Aggravated DUI (a felony) if it
    is committed while a person under the age of 15 is in the vehicle.
- id: 107
  category: alcohol_drugs_health
  question: 'Under Arizona''s Implied Consent law, if you refuse to submit to a chemical
    test and have a prior refusal on your record within the last 84 months, your license
    will be suspended for:'
  choices:
    A: 12 months
    B: 18 months
    C: 24 months
    D: Permanently
  answer: C
  explanation: A second refusal of a chemical test under the Implied Consent law within
    an 84-month (7-year) period results in a 24-month license suspension.
- id: 108
  category: alcohol_drugs_health
  question: In Arizona, can you be convicted of a DUI if you are driving under the
    influence of a legally prescribed medication?
  choices:
    A: No, as long as you have a valid prescription
    B: No, prescriptions are exempt from DUI laws
    C: Yes, if the drug impairs your ability to drive safely
    D: Only if the drug is a narcotic
  answer: C
  explanation: Arizona law states that it is illegal to drive while under the influence
    of any drug, including prescription medications, if they impair your ability to
    operate a vehicle safely.
- id: 109
  category: alcohol_drugs_health
  question: For drivers of commercial motor vehicles in Arizona, what is the maximum
    legal blood alcohol concentration (BAC) limit?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: The legal BAC limit for commercial drivers in Arizona (and federally)
    is 0.04%.
- id: 110
  category: alcohol_drugs_health
  question: 'A person is guilty of Aggravated DUI in Arizona if they commit a DUI
    while:'
  choices:
    A: Their driver license is suspended, canceled, or revoked
    B: They are exceeding the speed limit by 10 mph
    C: They are driving a vehicle with out-of-state plates
    D: They are driving between midnight and 5:00 AM
  answer: A
  explanation: Driving under the influence while your license is suspended, revoked,
    or canceled is one of the criteria for an Aggravated DUI charge in Arizona.
- id: 111
  category: alcohol_drugs_health
  question: In Arizona, how long is the 'look-back' period for prior DUI convictions
    when determining if a current offense is a second or third offense?
  choices:
    A: 3 years
    B: 5 years
    C: 7 years (84 months)
    D: 10 years
  answer: C
  explanation: Arizona uses an 84-month (7-year) look-back period for prior DUI convictions.
- id: 112
  category: alcohol_drugs_health
  question: 'When alcohol is combined with another drug, such as a sedative or antihistamine,
    the effect on driving ability is usually:'
  choices:
    A: Reduced
    B: The same as alcohol alone
    C: Multiplied (Synergistic effect)
    D: Canceled out
  answer: C
  explanation: Combining alcohol with other drugs can multiply the effects of both,
    significantly increasing impairment beyond what either substance would cause alone.
- id: 113
  category: penalties_and_points
  question: Under Arizona law, which of the following constitutes 'Criminal Speeding'?
  choices:
    A: Exceeding 85 miles per hour
    B: Exceeding the posted speed limit by 10 mph in a school zone
    C: Exceeding 65 miles per hour on a highway
    D: Exceeding 55 miles per hour in a construction zone
  answer: A
  explanation: In Arizona, criminal speeding is defined as exceeding 85 mph, exceeding
    the posted limit by 20 mph in business/residential areas, or exceeding 35 mph
    near a school crossing.
- id: 114
  category: penalties_and_points
  question: 'In Arizona, any driver convicted of failing to stop for a red light or
    a stop sign will be required to:'
  choices:
    A: Pay a $1,000 fine only
    B: Surrender their vehicle for 30 days
    C: Attend Traffic Survival School (TSS)
    D: Retake the written knowledge test
  answer: C
  explanation: Arizona law requires drivers convicted of red light or stop sign violations
    to attend Traffic Survival School (TSS) for a first offense.
- id: 115
  category: penalties_and_points
  question: If an Arizona driver fails to provide proof of current insurance when
    requested by law enforcement, their driving privilege may be suspended for how
    long for a first offense?
  choices:
    A: 30 days
    B: 3 months
    C: 6 months
    D: 1 year
  answer: B
  explanation: A first-time conviction for failure to provide proof of financial responsibility
    (insurance) in Arizona results in a 3-month suspension of driving privileges.
- id: 116
  category: penalties_and_points
  question: 'In Arizona, a driver convicted of ''Wrong-Way Driving'' on a controlled-access
    highway is required to:'
  choices:
    A: Pay a $50 fine
    B: Attend Traffic Survival School (TSS)
    C: Install an ignition interlock device for 2 years
    D: Forfeit their vehicle
  answer: B
  explanation: Arizona law requires drivers convicted of wrong-way driving on controlled-access
    highways to attend Traffic Survival School (TSS).
- id: 117
  category: penalties_and_points
  question: If an Arizona driver is convicted of a second DUI within a period of 84
    months, what is the minimum mandatory jail sentence?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: D
  explanation: A second DUI conviction within 84 months (7 years) in Arizona carries
    a minimum mandatory jail sentence of 90 days.
- id: 118
  category: penalties_and_points
  question: In Arizona, how many points are assessed for 'Following too closely' (tailgating)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: A
  explanation: Following too closely is a moving violation in Arizona that results
    in 2 points being added to the driver's record.
- id: 119
  category: penalties_and_points
  question: Under Arizona law, what is the BAC threshold for a 'Super Extreme DUI'?
  choices:
    A: 0.15%
    B: 0.18%
    C: 0.20%
    D: 0.25%
  answer: C
  explanation: A 'Super Extreme DUI' in Arizona applies to drivers with a Blood Alcohol
    Concentration of 0.20% or higher.
- id: 120
  category: penalties_and_points
  question: In Arizona, you can be charged with 'Criminal Speeding' if you exceed
    the posted speed limit by more than how many miles per hour in a business or residential
    district?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: C
  explanation: Under ARS 28-701.02, exceeding the speed limit by more than 20 mph
    in a business or residential district is considered criminal speeding.
- id: 121
  category: penalties_and_points
  question: In Arizona, how many points are assessed for a standard speeding violation
    that is not classified as criminal speeding?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: A standard speeding conviction in Arizona results in 3 points being
    added to the driver's record.
- id: 122
  category: penalties_and_points
  question: 'In Arizona, any person convicted of a ''red light'' violation is required
    by law to:'
  choices:
    A: Pay a minimum $1,000 fine
    B: Attend Traffic Survival School (TSS)
    C: Forfeit their vehicle
    D: Undergo a 1-year license suspension
  answer: B
  explanation: Arizona law requires drivers convicted of failing to stop for a traffic
    signal to attend and successfully complete Traffic Survival School (TSS).
- id: 123
  category: penalties_and_points
  question: For 'all other moving violations' not specifically listed with higher
    point values, how many points does the Arizona MVD assess?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Most general moving violations that do not involve serious offenses
    like DUI or Reckless Driving are assessed 2 points in Arizona.
- id: 124
  category: penalties_and_points
  question: 'In Arizona, littering on a public highway is a violation that can be
    charged as a:'
  choices:
    A: Class 3 Felony
    B: Class 1 Misdemeanor
    C: Civil infraction with no points
    D: Petty offense
  answer: B
  explanation: Littering on Arizona highways is a Class 1 Misdemeanor, which can carry
    fines and potential jail time.
- id: 125
  category: sharing_the_road
  question: Under Arizona law, when a motorist is overtaking and passing a bicycle
    proceeding in the same direction, what is the minimum safe distance the motorist
    must maintain?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Arizona Revised Statutes (ARS 28-735) requires a driver to leave a
    safe distance between the vehicle and the bicycle of not less than three feet
    until the vehicle has safely passed the bicycle.
- id: 126
  category: sharing_the_road
  question: 'In Arizona, you must stop for a school bus with flashing red lights and
    an extended stop arm unless:'
  choices:
    A: You are traveling in the opposite direction on a road with a physical barrier
      or median.
    B: The bus is stopped in a school zone with a 15 mph limit.
    C: You are traveling in the opposite direction on a road with at least four lanes
      and no median.
    D: The bus driver signals you to pass.
  answer: A
  explanation: Per ARS 28-857, you do not have to stop for a school bus if you are
    traveling in the opposite direction on a divided highway with a physical barrier
    or median separating the roadways.
- id: 127
  category: sharing_the_road
  question: 'Under Arizona''s ''Lane Filtering'' law, a motorcyclist may pass between
    two lanes of stopped traffic if the posted speed limit is 45 mph or less and the
    motorcycle does not exceed:'
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: As of 2022, ARS 28-903 allows lane filtering by motorcycles when traffic
    is stopped, the speed limit is 45 mph or less, and the motorcycle is traveling
    at 15 mph or less.
- id: 128
  category: sharing_the_road
  question: In Arizona, what must a driver do when a pedestrian is crossing the street
    guided by a service animal or carrying a white cane?
  choices:
    A: Honk to let them know you are there.
    B: Yield the right-of-way and take precautions to avoid injury.
    C: Drive around them if there is enough room in the lane.
    D: Wait for them to reach the median before proceeding.
  answer: B
  explanation: ARS 28-794 states that drivers must yield the right-of-way to any pedestrian
    who is guided by a service animal or using a white cane, and must take necessary
    precautions to avoid injury.
- id: 129
  category: sharing_the_road
  question: When following a large truck, how can you ensure you are not in the driver's
    'No-Zone' (blind spot)?
  choices:
    A: You can see the truck's front bumper in your rearview mirror.
    B: You can see the truck's side mirrors.
    C: You are at least 10 feet behind the truck.
    D: You can see the truck driver's face in their side-view mirror.
  answer: D
  explanation: A general rule for sharing the road with large trucks is that if you
    cannot see the driver's face in their side-view mirror, they cannot see you.
- id: 130
  category: sharing_the_road
  question: What is the minimum civil penalty for a first-time conviction of illegally
    passing a stopped school bus in Arizona?
  choices:
    A: A fine of $100
    B: A fine of $250
    C: A fine of $500
    D: A fine of $1,000
  answer: B
  explanation: Under ARS 28-857, a person found responsible for a first violation
    of passing a stopped school bus faces a minimum civil penalty of $250.
- id: 131
  category: sharing_the_road
  question: 'According to Arizona law, every bicycle used at nighttime must be equipped
    with a lamp on the front that emits a white light visible from a distance of at
    least:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: ARS 28-817 requires bicycles operated at night to have a front lamp
    emitting white light visible from at least 500 feet and a red rear reflector visible
    from 300 feet.
- id: 132
  category: sharing_the_road
  question: When a funeral procession led by a funeral escort vehicle is proceeding
    through an intersection, what is the rule for other drivers?
  choices:
    A: Other drivers have the right-of-way if their light is green.
    B: Other drivers must yield the right-of-way to the entire procession.
    C: Only the first three vehicles in the procession have the right-of-way.
    D: Processions must stop for all red lights.
  answer: B
  explanation: ARS 28-776 states that a funeral procession led by a funeral escort
    vehicle has the right-of-way at an intersection regardless of traffic control
    devices, and other drivers must yield.
- id: 133
  category: sharing_the_road
  question: In Arizona, which of the following is true regarding motorcycle helmet
    laws?
  choices:
    A: All riders and passengers must wear helmets at all times.
    B: Helmets are only required on interstate highways.
    C: Only operators and passengers under 18 years of age are required to wear a
      helmet.
    D: Helmets are not required for anyone if they have a Class M license.
  answer: C
  explanation: ARS 28-964 requires that an operator or passenger of a motorcycle who
    is under 18 years of age must wear a protective helmet.
- id: 134
  category: sharing_the_road
  question: 'When a pedestrian is in a marked or unmarked crosswalk in your half of
    the roadway, you must:'
  choices:
    A: Stop and wait for the pedestrian to cross past your lane.
    B: Slow down and proceed if the pedestrian is not in your direct path.
    C: Honk to warn the pedestrian of your approach.
    D: Yield the right-of-way and stop if necessary to let them pass.
  answer: D
  explanation: ARS 28-792 requires drivers to yield the right-of-way to a pedestrian
    crossing the roadway within any marked or unmarked crosswalk.
- id: 135
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck:'
  choices:
    A: Will always stay in the far right lane.
    B: May need to swing wide to the left to complete the turn.
    C: Must stop and wait for all traffic to clear before turning.
    D: Is required to turn from the left lane.
  answer: B
  explanation: Large trucks often need to swing wide to the left to make a right turn.
    Drivers should avoid 'squeezing' between the truck and the curb.
- id: 136
  category: sharing_the_road
  question: 'Arizona''s ''Move Over'' law also applies to stationary vehicles with
    flashing amber lights, such as:'
  choices:
    A: Ice cream trucks.
    B: Tow trucks and utility service vehicles.
    C: Slow-moving farm equipment.
    D: School buses loading passengers.
  answer: B
  explanation: ARS 28-775 includes stationary vehicles displaying flashing amber or
    white lights, such as tow trucks, highway maintenance vehicles, and utility service
    vehicles, under the 'Move Over' requirements.
- id: 137
  category: sharing_the_road
  question: In Arizona, you are driving on a highway with a physical median or divider.
    A school bus is stopped on the opposite side of the median with its red lights
    flashing and stop arm extended. What must you do?
  choices:
    A: Stop until the bus moves.
    B: Stop until the signals are turned off.
    C: Slow down and proceed with caution.
    D: You are not required to stop.
  answer: D
  explanation: Per ARS 28-857, the driver of a vehicle on a highway with separate
    roadways (divided by a physical barrier or median) need not stop on meeting or
    passing a school bus that is on a different roadway.
- id: 138
  category: sharing_the_road
  question: 'Under Arizona''s lane filtering law (ARS 28-903), a motorcycle operator
    may overtake and pass another vehicle in the same lane only if the speed limit
    on the road is no more than:'
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: Arizona law allows lane filtering for motorcycles if the speed limit
    is 45 mph or less, the motorcycle is traveling at 15 mph or less, and the other
    vehicles are stopped.
- id: 139
  category: sharing_the_road
  question: 'In Arizona, if you see a pedestrian guided by a service animal or carrying
    a white cane (with or without a red tip), you must:'
  choices:
    A: Honk your horn to let them know you are there.
    B: Yield the right-of-way and take precautions to avoid injury.
    C: Drive around them as long as you don't hit them.
    D: Wait for a police officer to direct traffic.
  answer: B
  explanation: ARS 28-794 states that drivers must yield the right-of-way to any blind
    or visually impaired pedestrian carrying a white cane or using a service animal.
- id: 140
  category: sharing_the_road
  question: 'When following a large truck or commercial vehicle, you should increase
    your following distance because:'
  choices:
    A: Trucks have a much larger 'No-Zone' (blind spot) directly behind them.
    B: Trucks are required to stop at all railroad crossings.
    C: Trucks always travel 10 mph below the speed limit.
    D: Trucks have better brakes and stop faster than cars.
  answer: A
  explanation: Large trucks have significant blind spots, often called 'No-Zones,'
    behind them. If you cannot see the truck driver's side mirrors, the driver cannot
    see you.
- id: 141
  category: sharing_the_road
  question: 'Under Arizona law, a person riding a bicycle on a roadway has:'
  choices:
    A: No rights on the road.
    B: The same rights and duties as the driver of a motor vehicle.
    C: The right-of-way over all motor vehicles at all times.
    D: The requirement to ride only on the sidewalk.
  answer: B
  explanation: ARS 28-812 states that every person riding a bicycle on a roadway is
    granted all of the rights and is subject to all of the duties applicable to the
    driver of a vehicle.
- id: 142
  category: sharing_the_road
  question: 'In Arizona, when a funeral procession is led by a funeral escort vehicle
    with flashing lights, other drivers:'
  choices:
    A: May cut through the procession if there is a gap.
    B: Must yield the right-of-way to all vehicles in the procession.
    C: Should honk to show respect.
    D: Must pull over to the right and stop until it passes.
  answer: B
  explanation: ARS 28-776 states that pedestrians and other vehicles shall yield the
    right-of-way to any vehicle that is part of a funeral procession being led by
    a funeral escort vehicle.
- id: 143
  category: sharing_the_road
  question: In Arizona, a person is required by law to wear a protective helmet while
    operating or riding on a motorcycle if they are under what age?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: All ages must wear helmets.
  answer: B
  explanation: ARS 28-964 requires that an operator or passenger of a motorcycle who
    is under 18 years of age must wear a protective helmet.
- id: 144
  category: sharing_the_road
  question: 'When following a fire apparatus (fire truck) that is responding to an
    emergency, Arizona law prohibits you from following closer than:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: ARS 28-775 states that the driver of a vehicle other than one on official
    business shall not follow any fire apparatus traveling in response to a fire alarm
    closer than 500 feet.
- id: 145
  category: sharing_the_road
  question: 'If a pedestrian is crossing the roadway at a point other than within
    a marked crosswalk or an unmarked crosswalk at an intersection, Arizona law (ARS
    28-793) requires:'
  choices:
    A: The pedestrian to yield the right-of-way to all vehicles.
    B: Vehicles to stop and wait for the pedestrian.
    C: The pedestrian to run across the street.
    D: The driver to speed up to avoid the pedestrian.
  answer: A
  explanation: ARS 28-793 specifies that every pedestrian crossing a roadway at any
    point other than within a marked crosswalk or within an unmarked crosswalk at
    an intersection shall yield the right-of-way to all vehicles on the roadway.
- id: 146
  category: sharing_the_road
  question: 'When you are approaching a school bus that is stopped and has its ''alternating
    flashing amber lights'' activated, you should:'
  choices:
    A: Stop immediately.
    B: Slow down and prepare to stop.
    C: Speed up to pass before the red lights come on.
    D: Ignore the lights as they are only for the bus driver.
  answer: B
  explanation: Amber (yellow) flashing lights on a school bus mean the bus is preparing
    to stop to load or unload children. Drivers should slow down and be prepared to
    stop when the lights turn red.
- id: 147
  category: vehicle_information
  question: When following another vehicle from behind in Arizona, at what distance
    must you dim your high-beam headlights?
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: Arizona law requires drivers to dim high beams when following another
    vehicle within 200 feet.
- id: 148
  category: vehicle_information
  question: Arizona law requires that every motor vehicle must be equipped with a
    rearview mirror that allows the driver to see the highway for at least how many
    feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Per ARS 28-956, vehicles must have a mirror that reflects a view of
    the highway for a distance of at least 200 feet to the rear.
- id: 149
  category: vehicle_information
  question: 'Under Arizona law, a motor vehicle''s horn must be audible under normal
    conditions from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: Arizona Revised Statutes (ARS 28-954) require a horn to be audible
    from a distance of not less than 200 feet.
- id: 150
  category: vehicle_information
  question: 'In Arizona, the rear license plate must be illuminated by a white light
    so that it is clearly legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: ARS 28-925 states that the rear registration plate must be illuminated
    and legible from a distance of 50 feet.
- id: 151
  category: vehicle_information
  question: According to Arizona window tinting laws, the front side windows (to the
    left and right of the driver) must allow at least what percentage of light to
    pass through?
  choices:
    A: 20%
    B: 33%
    C: 50%
    D: 70%
  answer: B
  explanation: Arizona law (ARS 28-959.01) requires that the front side windows have
    a light transmission of at least 33%.
- id: 152
  category: vehicle_information
  question: Arizona law requires every motor vehicle to be equipped with how many
    separate braking systems?
  choices:
    A: One system
    B: Two independent systems (service brake and parking brake)
    C: Three systems (front, rear, and emergency)
    D: Braking systems are only required for vehicles over 6,000 lbs
  answer: B
  explanation: 'Arizona law requires two separate means of applying brakes: a service
    brake and a parking/emergency brake.'
- id: 153
  category: vehicle_information
  question: 'In Arizona, a tire is considered unsafe if the tread is worn down to
    less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: A tire is considered unsafe and illegal if the tread depth is less
    than 2/32 of an inch.
- id: 154
  category: vehicle_information
  question: If a load extends more than how many feet beyond the rear of a vehicle's
    body in Arizona, a red flag or red light must be attached to the end of the load?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: ARS 28-935 requires a red flag (day) or red light (night) if a load
    extends 4 feet or more beyond the rear of the vehicle.
- id: 155
  category: vehicle_information
  question: 'In Arizona, mudguards (fenders) are required for any vehicle or combination
    of vehicles with a GVW (Gross Vehicle Weight) greater than:'
  choices:
    A: 3,000 lbs
    B: 6,000 lbs
    C: 10,000 lbs
    D: 26,000 lbs
  answer: B
  explanation: ARS 28-958.01 requires mudguards for vehicles with a GVW of more than
    6,000 lbs to prevent splashing of mud or rocks.
- id: 156
  category: vehicle_information
  question: Arizona law requires that every motor vehicle (except motorcycles) must
    be equipped with at least how many tail lamps?
  choices:
    A: One tail lamp
    B: Two tail lamps
    C: Three tail lamps
    D: Tail lamps are only required at night
  answer: B
  explanation: ARS 28-925 requires every motor vehicle to have at least two tail lamps
    (except for certain older vehicles or motorcycles).
- id: 157
  category: vehicle_information
  question: Which of the following is true regarding windshield wipers under Arizona
    law?
  choices:
    A: They are only required if the vehicle is driven in the rain
    B: Every motor vehicle with a windshield must be equipped with wipers
    C: Wipers are optional for vehicles registered as 'Classic'
    D: Only the driver's side requires a wiper
  answer: B
  explanation: ARS 28-957 requires that every motor vehicle operated on a highway
    that is equipped with a windshield must also have functional windshield wipers.
- id: 158
  category: vehicle_information
  question: 'In Arizona, a ''Slow-Moving Vehicle'' emblem must be displayed on the
    rear of any vehicle designed to operate at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: ARS 28-959 requires a slow-moving vehicle emblem for vehicles designed
    for speeds of 25 mph or less.
- id: 159
  category: vehicle_information
  question: 'Every motor vehicle in Arizona must be equipped with a horn that can
    be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Under Arizona Revised Statutes, every motor vehicle must have a horn
    in good working order capable of emitting sound audible under normal conditions
    from a distance of not less than 200 feet.
- id: 160
  category: vehicle_information
  question: 'Under Arizona law, it is illegal to drive a vehicle if the windshield
    is:'
  choices:
    A: Covered with any sticker not required by law that obstructs the driver's view
    B: Equipped with wipers that work manually
    C: Tinted at the very top (AS-1 line)
    D: Made of safety glass
  answer: A
  explanation: Arizona law prohibits placing any sign, poster, or other non-transparent
    material on the windshield that obstructs the driver's clear view of the highway.
- id: 161
  category: vehicle_information
  question: Arizona law prohibits the use of which exhaust system modification?
  choices:
    A: Chrome exhaust tips
    B: Dual exhaust systems
    C: Muffler cutouts or bypasses
    D: High-flow catalytic converters
  answer: C
  explanation: Arizona law requires every vehicle to have a muffler in good working
    order to prevent excessive noise; muffler cutouts, bypasses, or similar devices
    are strictly prohibited.
- id: 162
  category: vehicle_information
  question: When using hand-and-arm signals in Arizona, which signal indicates a right
    turn?
  choices:
    A: Arm extended straight out
    B: Arm extended upward
    C: Arm extended downward
    D: Arm moved in a circular motion
  answer: B
  explanation: For a right turn using hand signals, the arm should be extended upward
    at a 90-degree angle.
- id: 163
  category: vehicle_information
  question: 'In Arizona, your vehicle''s turn signal lights must be visible from a
    distance of at least:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Arizona law requires that turn signals be visible from a distance of
    not less than 100 feet in normal sunlight.
- id: 164
  category: signs_and_signals
  question: In Arizona, when using hand signals to indicate a turn, which position
    represents a left turn?
  choices:
    A: Arm extended upward
    B: Arm extended downward
    C: Arm extended horizontally to the left
    D: Arm waved in a circular motion
  answer: C
  explanation: According to the Arizona Driver License Manual, a left turn is signaled
    by extending the left arm horizontally out of the window.
- id: 165
  category: signs_and_signals
  question: When signaling a right turn using hand signals in Arizona, what is the
    correct arm position?
  choices:
    A: Arm extended horizontally
    B: Arm extended upward
    C: Arm extended downward
    D: Arm pointed toward the passenger side
  answer: B
  explanation: The Arizona Driver License Manual states that a right turn is signaled
    by extending the left arm upward at a 90-degree angle.
- id: 166
  category: signs_and_signals
  question: To signal that you are slowing down or stopping using hand signals, how
    should you position your arm?
  choices:
    A: Arm extended upward
    B: Arm extended horizontally
    C: Arm extended downward
    D: Arm held inside the vehicle
  answer: C
  explanation: In Arizona, the hand signal for slowing or stopping is the left arm
    extended downward with the palm facing the rear.
- id: 167
  category: signs_and_signals
  question: In Arizona, what does a flashing yellow arrow at an intersection indicate?
  choices:
    A: Stop and wait for a green arrow
    B: The turn is protected; oncoming traffic is stopped
    C: Yield to oncoming traffic and pedestrians, then turn with caution
    D: Speed up to clear the intersection before the light turns red
  answer: C
  explanation: A flashing yellow arrow means turns are permitted, but you must first
    yield to oncoming traffic and pedestrians and then proceed with caution.
- id: 168
  category: signs_and_signals
  question: What must a driver do when approaching a flashing red light in Arizona?
  choices:
    A: Slow down and proceed with caution
    B: Stop completely and proceed only when it is safe to do so
    C: Stop only if there is cross traffic
    D: Treat it as a yellow light and prepare to stop
  answer: B
  explanation: Under Arizona law, a flashing red light is treated the same as a stop
    sign; you must come to a complete stop and proceed when safe.
- id: 169
  category: signs_and_signals
  question: 'A diamond-shaped symbol painted on a lane in Arizona indicates that the
    lane is reserved for:'
  choices:
    A: Emergency vehicles only
    B: High Occupancy Vehicles (HOV)
    C: Slow-moving farm equipment
    D: Bicycles only
  answer: B
  explanation: The diamond symbol marks HOV lanes, which are reserved during specific
    times for vehicles carrying two or more people (or other qualifying vehicles like
    motorcycles or those with 'Clean Air' plates).
- id: 170
  category: signs_and_signals
  question: What does a solid red curb mean in Arizona?
  choices:
    A: You may stop only long enough to pick up passengers
    B: You may park for up to 15 minutes
    C: No stopping, standing, or parking is allowed
    D: Reserved for emergency vehicles only
  answer: C
  explanation: A red curb indicates that no stopping, standing, or parking is permitted,
    whether the vehicle is attended or unattended.
- id: 171
  category: signs_and_signals
  question: 'In Arizona, a white curb indicates that you may stop only for:'
  choices:
    A: Loading or unloading freight
    B: Emergency repairs
    C: Picking up or dropping off passengers or mail
    D: Parking for less than 30 minutes
  answer: C
  explanation: A white curb is designated for short stops to pick up or drop off passengers
    or to deposit mail in an adjacent mailbox.
- id: 172
  category: signs_and_signals
  question: What is the meaning of a blue curb in Arizona?
  choices:
    A: Parking is permitted for police vehicles only
    B: Parking is permitted only for persons with disabilities
    C: The area is a bus stop
    D: Parking is restricted to 10 minutes
  answer: B
  explanation: Blue curbs indicate parking zones reserved for persons with disabilities
    who have a valid placard or license plate.
- id: 173
  category: signs_and_signals
  question: 'A solid white line painted between lanes of traffic moving in the same
    direction in Arizona means:'
  choices:
    A: Lane changes are prohibited
    B: Lane changes are discouraged
    C: You must turn in the direction of the line
    D: The road is ending
  answer: B
  explanation: A solid white line separates lanes of traffic moving in the same direction
    and indicates that lane changes are discouraged due to potential hazards, though
    not strictly prohibited like a double solid line.
- id: 174
  category: signs_and_signals
  question: What do double solid yellow lines in the center of the road signify in
    Arizona?
  choices:
    A: Passing is allowed from either side
    B: Passing is allowed only on the right
    C: Passing is prohibited in both directions
    D: The road is a one-way street
  answer: C
  explanation: Double solid yellow lines mean that passing is not allowed for vehicles
    traveling in either direction.
- id: 175
  category: signs_and_signals
  question: In Arizona, what shape and color is a standard 'Yield' sign?
  choices:
    A: Octagon, Red and White
    B: Diamond, Yellow and Black
    C: Equilateral triangle pointing down, Red and White
    D: Rectangle, White and Black
  answer: C
  explanation: A yield sign is a downward-pointing equilateral triangle, colored red
    and white with the word 'YIELD' in red.
- id: 176
  category: signs_and_signals
  question: 'If you see ''Wrong Way'' and ''Do Not Enter'' signs while driving in
    Arizona, it means:'
  choices:
    A: You are going the wrong way on an exit ramp or highway
    B: The road is closed for construction
    C: You must yield to oncoming traffic
    D: The speed limit has changed
  answer: A
  explanation: These signs are placed to prevent drivers from entering a highway or
    one-way street in the wrong direction. If you see them, pull over and turn around
    safely as soon as possible.
- id: 177
  category: signs_and_signals
  question: In Arizona, if you are convicted of failing to stop for a red light, how
    many points are assessed against your driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 8 points
  answer: A
  explanation: According to the Arizona Driver License Manual, 'Failure to stop for
    a traffic signal' results in 2 points being added to your driving record. Additionally,
    Arizona law requires drivers convicted of running a red light to attend Traffic
    Survival School (TSS).
- id: 178
  category: signs_and_signals
  question: In the Phoenix metropolitan area, what is the standard minimum number
    of occupants required to use a High Occupancy Vehicle (HOV) lane during restricted
    hours?
  choices:
    A: 1 person (driver only)
    B: 2 or more persons
    C: 3 or more persons
    D: 4 or more persons
  answer: B
  explanation: In Arizona, HOV lanes are reserved for vehicles carrying two or more
    people (including the driver) during the restricted hours of 6:00 AM to 9:00 AM
    and 3:00 PM to 6:00 PM, Monday through Friday.
- id: 179
  category: signs_and_signals
  question: To signal a left turn using hand signals in Arizona, how should you position
    your arm?
  choices:
    A: Extend your left arm and hand straight out the window.
    B: Extend your left arm and hand upward.
    C: Extend your left arm and hand downward.
    D: Extend your right arm and hand straight out the window.
  answer: A
  explanation: The standard hand signal for a left turn is to extend your left arm
    and hand straight out of the driver's side window.
- id: 180
  category: signs_and_signals
  question: In Arizona, what does a 'Pedestrian Hybrid Beacon' (also known as a HAWK
    signal) indicate when the two top lights are solid red?
  choices:
    A: Proceed with caution.
    B: Stop and wait for the lights to turn off.
    C: Stop and remain stopped while pedestrians are in the crosswalk.
    D: Treat it as a four-way stop.
  answer: C
  explanation: When a HAWK signal shows solid red lights, drivers must stop and remain
    stopped to allow pedestrians to cross. Once the lights begin flashing red, drivers
    may proceed after stopping if the crosswalk is clear.
- id: 181
  category: signs_and_signals
  question: If you see a 'Wrong Way' or 'Do Not Enter' sign while driving on an Arizona
    freeway off-ramp, what is the first thing you should do?
  choices:
    A: Continue to the next exit to turn around.
    B: Immediately pull over to the left or right shoulder and stop.
    C: Speed up to clear the ramp quickly.
    D: Back up into the freeway traffic.
  answer: B
  explanation: Arizona safety guidelines state that if you are traveling the wrong
    way, you should immediately pull over to the side of the road and stop. At night,
    turn off your headlights so you don't blind oncoming drivers, and wait for assistance
    or until it is safe to turn around.
- id: 182
  category: signs_and_signals
  question: On Arizona roadways, what do broken white lines signify?
  choices:
    A: Separation of lanes of traffic moving in opposite directions.
    B: Separation of lanes of traffic moving in the same direction.
    C: An area where passing is strictly prohibited.
    D: The edge of the roadway.
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction.
    You may cross these lines when it is safe to change lanes.
- id: 183
  category: signs_and_signals
  question: In Arizona, what is the primary meaning of a diamond-shaped traffic sign?
  choices:
    A: Regulatory (must obey).
    B: Warning (possible hazards ahead).
    C: Guide (directions and distances).
    D: Services (gas, food, lodging).
  answer: B
  explanation: Diamond-shaped signs are used in Arizona and across the US as warning
    signs to alert drivers to existing or possible hazards on the road or adjacent
    areas.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 184
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 185
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 186
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 187
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 188
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 189
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 190
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 191
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 192
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 193
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 194
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 195
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 196
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 197
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 198
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 199
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 200
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 201
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 202
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 203
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 204
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 205
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 206
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 207
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 208
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 209
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 210
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 211
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 212
- image: cross_road.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: A railroad crossing ahead
    B: A crossroad or intersection ahead
    C: A hospital ahead
    D: A pedestrian crossing
  answer: B
  explanation: This sign warns that a crossroad or 4-way intersection is ahead. Watch
    for traffic entering from side roads.
  id: 213
- image: side_road.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A T-intersection ahead
    B: A side road entering from the right
    C: A curve in the road
    D: A dead end
  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles
    entering the highway from the side road.
  id: 214
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Lanes are merging
    B: A lane is ending
    C: A new lane is being added — no merging needed
    D: Right turn required
  answer: C
  explanation: An added lane sign means a new lane is joining the highway without
    requiring merging. Traffic entering from the ramp has its own new lane.
  id: 215
- image: no_parking.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Stopping at any time
    B: Parking in this area
    C: Standing or idling
    D: Loading or unloading
  answer: B
  explanation: A red and white NO PARKING sign means you cannot park your vehicle
    in this area. You may briefly stop to load or unload passengers.
  id: 216
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 217
