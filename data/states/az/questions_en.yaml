metadata:
  source: 2025 Arizona Driver License Manual (apps.azdot.gov)
  total_questions: 295
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_responsibility
  question: By law, how many days do you have to notify the MVD of a change to your
    name or address?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: You are required by law to notify MVD within 10 days of any change
    to your name or address.
- id: 2
  category: penalties_and_points
  question: What is the primary goal of the Traffic Survival School Program?
  choices:
    A: To teach new drivers how to parallel park
    B: To change or modify risky or unsafe driving behavior
    C: To provide behind-the-wheel training for commercial drivers
    D: To waive the fee for a driver license renewal
  answer: B
  explanation: The Traffic Survival School Program is designed for drivers with serious
    violations or point accumulations, and its goal is to change or modify risky or
    unsafe driving behavior.
- id: 3
  category: vehicle_information
  question: Which entity is authorized by the MVD to perform Level I vehicle inspections?
  choices:
    A: The Arizona Department of Education
    B: The National Safety Council
    C: Third Party providers
    D: Local law enforcement agencies
  answer: C
  explanation: According to the manual, Third Party providers are authorized by MVD
    to perform Level I inspections.
- id: 4
  category: license_system
  question: What is the fee for an Identification Card (ID) for an individual who
    is 65 years of age or older?
  choices:
    A: $10
    B: $12
    C: $25
    D: No fee
  answer: D
  explanation: The fee schedule in the manual states that there is 'No fee' for an
    Identification Card for individuals ages 65 and over.
- id: 5
  category: license_system
  question: To avoid waiting in line, you should be aware that most MVD offices are
    closed until noon on which day?
  choices:
    A: The first Monday of each month
    B: The second Wednesday of each month
    C: The last Friday of each month
    D: Every Tuesday
  answer: B
  explanation: The manual advises that most offices are closed until noon on the second
    Wednesday of each month.
- id: 6
  category: driver_testing
  question: 'Bringing your out-of-state driver license to the MVD is helpful because
    it serves as a secondary form of identification and may:'
  choices:
    A: Waive the written and road test
    B: Reduce your registration fees
    C: Allow you to skip the vision screening
    D: Automatically grant you a commercial driver license
  answer: A
  explanation: Bringing your out-of-state driver license will be used as a secondary
    form of identification and may waive the written/road test.
- id: 7
  category: penalties_and_points
  question: What is the standard fee for an abandoned vehicle that is not located
    on federal land?
  choices:
    A: $100
    B: $250
    C: $500
    D: $600
  answer: C
  explanation: The manual lists the Abandoned Vehicle Fee as $500, while the fee for
    an abandoned vehicle on federal land is $600.
- id: 8
  category: safe_driving_rules
  question: Under which Title of the Arizona Revised Statutes can the details of the
    state's motor vehicle laws be found?
  choices:
    A: Title 18 'Vehicles'
    B: Title 28 'Transportation'
    C: Title 36 'Public Health'
    D: Title 42 'Taxation'
  answer: B
  explanation: Details of the motor vehicle laws can be found in Arizona Revised Statutes
    at azleg.gov under Title 28 'Transportation'.
- id: 9
  category: penalties_and_points
  question: Who licenses the traffic survival schools in Arizona?
  choices:
    A: The Arizona Department of Education
    B: The Arizona Chapter of the National Safety Council (NSC)
    C: The Federal Highway Administration
    D: The Motor Vehicle Division (MVD)
  answer: B
  explanation: Traffic survival schools are licensed by the Arizona Chapter of the
    National Safety Council (NSC).
- id: 10
  category: license_system
  question: Which of the following services is available online at AZMVDNow.gov?
  choices:
    A: Level III vehicle inspections
    B: Permit Test @ Home
    C: Behind-the-wheel driver training
    D: Traffic Survival School classes
  answer: B
  explanation: The manual lists 'Permit Test @ Home' as one of the many services available
    at AZMVDNow.gov.
- id: 11
  category: license_system
  question: What is the fee to obtain a Travel Driver License in Arizona?
  choices:
    A: $10
    B: $12
    C: $20
    D: $25
  answer: D
  explanation: According to the fee schedule, the fee for a Travel Driver License
    is $25.
- id: 12
  category: license_system
  question: Which of the following is true regarding MVD Authorized Third Party providers?
  choices:
    A: They only offer services during standard MVD business hours
    B: They are not allowed to process driver license transactions
    C: They often offer extended hours on weekends and evenings
    D: They perform Level III vehicle inspections
  answer: C
  explanation: The manual states that Third party providers often offer convenient
    extended hours on weekends and evenings.
- id: 13
  category: driver_responsibility
  question: 'If you report a change of address online and wish to have your new address
    displayed on your physical driver license, you must:'
  choices:
    A: Print a temporary sticker at home
    B: Apply and purchase a replacement license
    C: Wait for your next renewal cycle
    D: Visit a police station to have it stamped
  answer: B
  explanation: If you wish to have your new address displayed on your credential,
    you may apply and purchase a replacement license.
- id: 14
  category: license_system
  question: What is the fee for an uncertified 39-month Motor Vehicle Record?
  choices:
    A: $2
    B: $3
    C: $5
    D: $7
  answer: B
  explanation: The fee schedule lists the cost of an Uncertified 39-month Motor Vehicle
    Record as $3.
- id: 15
  category: driver_testing
  question: The MVD approves high school driver education programs in collaboration
    with which organization?
  choices:
    A: The National Safety Council
    B: The Arizona Department of Education
    C: The Department of Public Safety
    D: The Federal Motor Carrier Safety Administration
  answer: B
  explanation: MVD, in collaboration with the Arizona Department of Education, also
    approves high school driver education programs.
- id: 16
  category: license_system
  question: How can you report a change of address to the Arizona Motor Vehicle Division?
  choices:
    A: Only by mailing a paper form to the MVD headquarters
    B: Online at AZMVDNow.gov
    C: By calling your local police department
    D: Only in person at an authorized third-party office
  answer: B
  explanation: According to the manual, you may report a change of address online
    at AZMVDNow.gov by providing your full name, new address, driver license number,
    date of birth, and the last four digits of your Social Security Number.
- id: 17
  category: license_system
  question: What documentation is required to complete a name change on your driver
    license?
  choices:
    A: A verbal request over the phone to the MVD
    B: A notarized letter from your employer
    C: Appropriate identification in both your new and previous names
    D: Only your new Social Security card
  answer: C
  explanation: To complete a name change, you must visit an MVD or authorized third-party
    office and present appropriate identification in both your new and previous names.
    All names must be verifiable with Social Security Administration records.
- id: 18
  category: license_system
  question: Upon discharge, military personnel may work in Arizona without obtaining
    an Arizona driver license for up to how many days, provided they meet specific
    requirements?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: Upon discharge, military personnel may work in Arizona for up to 90
    days without obtaining an Arizona driver license if they possess a valid out-of-state
    license, operate a Class D vehicle, and work for an organization operating in
    multiple states.
- id: 19
  category: license_system
  question: Who is eligible to receive a Native American Designation on their Arizona
    driver license or ID card?
  choices:
    A: Anyone who was born in the state of Arizona
    B: Enrolled members of a federally recognized Indian Tribe located in Arizona
    C: Any individual who has lived in Arizona for more than 10 years
    D: Only individuals who currently reside on a reservation
  answer: B
  explanation: A Native American Designation is available to enrolled members of a
    federally recognized Indian Tribe located in Arizona. A new application and photo
    are required.
- id: 20
  category: license_system
  question: According to Arizona law, what must an applicant submit proof of before
    the MVD will issue a driver license or ID card?
  choices:
    A: Proof of full-time employment in Arizona
    B: Proof of a high school diploma or equivalent
    C: Proof that the applicant's presence in the United States is authorized under
      federal law
    D: Proof of active voter registration in the state
  answer: C
  explanation: Arizona Revised Statutes require that the MVD must not issue or renew
    a driver license or ID card for a person who does not submit satisfactory proof
    that their presence in the United States is authorized under federal law.
- id: 21
  category: driver_testing
  question: Before taking the road test, you must demonstrate that you can respond
    to specific driving directions in which language?
  choices:
    A: Spanish
    B: English
    C: Any language of your choice
    D: Both English and Spanish
  answer: B
  explanation: Before you can take the road test, you will have to respond to specific
    directions (such as 'Stop', 'Slow down', 'Change lanes') in English.
- id: 22
  category: vehicle_information
  question: If your vehicle is a model year ____ or newer, it must be equipped with
    properly fastened and adjusted seat belts to be used for the road test.
  choices:
    A: '1968'
    B: '1972'
    C: '1980'
    D: '1995'
  answer: B
  explanation: The manual states that if your vehicle is a 1972 model or newer, it
    must be equipped with seat belts, and these belts must be properly fastened and
    adjusted during the road test.
- id: 23
  category: driver_testing
  question: What is the MVD's policy on using Advanced Driver Assistance Systems (ADAS),
    such as auto-drive or parking assistance, during the road test?
  choices:
    A: They are required for the parallel parking portion of the test
    B: They are permitted only if the examiner gives prior approval
    C: They are strictly prohibited and all maneuvers must be performed manually
    D: They can be used freely if the vehicle is a 2020 model or newer
  answer: C
  explanation: Vehicle Advanced Driver Assistance Systems (ADAS), including auto-drive
    and parking assistance, are prohibited during the road test. All maneuvers must
    be performed manually.
- id: 24
  category: driver_responsibility
  question: What is the minimum level of property damage liability insurance required
    for private passenger vehicles in Arizona?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: B
  explanation: The minimum level of financial responsibility for private passenger
    vehicles includes $15,000 for property damage liability.
- id: 25
  category: driver_responsibility
  question: What is the minimum bodily injury liability insurance requirement for
    one person in Arizona?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: The minimum level of financial responsibility for private passenger
    vehicles includes $25,000 bodily injury liability for one person.
- id: 26
  category: license_system
  question: What happens if you apply for an Arizona driver license and the National
    Driver Register shows you have outstanding or unresolved actions in another state?
  choices:
    A: You will be issued a restricted Arizona license
    B: An Arizona license will not be issued
    C: You must pay a fine to the Arizona MVD to clear the record
    D: You will be issued a temporary 30-day license
  answer: B
  explanation: Arizona checks your information against the National Driver Register.
    If you have outstanding or unresolved actions in another state, an Arizona license
    will not be issued.
- id: 27
  category: license_system
  question: Under Arizona law, you are considered a resident and must obtain an Arizona
    driver license immediately if you remain in the state for a total of how many
    months during any calendar year?
  choices:
    A: Three months
    B: Five months
    C: Seven months
    D: Nine months
  answer: C
  explanation: State law requires you to obtain an Arizona driver license and registration
    immediately if you remain in Arizona for a total of seven months or more during
    any calendar year, regardless of your permanent residence.
- id: 28
  category: license_system
  question: Is an out-of-state student enrolled with seven or more semester hours
    considered an Arizona resident if they are also employed in the state?
  choices:
    A: Yes, because they are employed in Arizona
    B: Yes, because they are enrolled in school
    C: No, they are not considered a resident
    D: Only if they live off-campus
  answer: C
  explanation: The manual specifies that an 'out-of-state student' enrolled with seven
    or more semester hours is not considered a resident, even if employed.
- id: 29
  category: penalties_and_points
  question: What is the penalty for submitting a false voter registration application?
  choices:
    A: A Class 1 misdemeanor
    B: A Class 6 felony
    C: A $500 fine
    D: Suspension of driving privileges for one year
  answer: B
  explanation: According to the voter registration section of the manual, submitting
    a false voter registration is a Class 6 felony.
- id: 30
  category: license_system
  question: 'To register to vote in Arizona, you must meet all of the following requirements
    EXCEPT:'
  choices:
    A: Be a United States citizen
    B: Be a resident of Arizona
    C: Possess a valid Arizona driver license
    D: Be 18 years of age or older on or before the next General Election
  answer: C
  explanation: To register to vote, you must be 18 by the next General Election, a
    US citizen, an AZ resident, not convicted of a felony (unless rights restored),
    and not adjudicated incompetent. Possessing a valid Arizona driver license is
    not a requirement to register to vote.
- id: 31
  category: driver_responsibility
  question: How many days before an election must you be registered to vote in order
    to qualify to vote in that upcoming election?
  choices:
    A: 15 days
    B: 29 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: According to the manual, you must be registered to vote 29 days before
    an election in order to qualify to vote in the upcoming election.
- id: 32
  category: license_system
  question: 'To obtain a medical code on your license for a condition requiring immediate
    attention, you must present a statement signed by a:'
  choices:
    A: Licensed physician or registered nurse practitioner
    B: Pharmacist or medical technician
    C: Parent or legal guardian
    D: Hospital administrator
  answer: A
  explanation: The manual states that you must present a statement about the medical
    condition, signed by a licensed physician or registered nurse practitioner to
    obtain a medical code on your license.
- id: 33
  category: license_system
  question: According to Arizona state and federal laws, why is your Social Security
    number required when applying for a driver license?
  choices:
    A: To be used as your driver license number
    B: To verify your identity and comply with child support laws
    C: To check your credit score for insurance purposes
    D: To register you for the Selective Service System
  answer: B
  explanation: State and federal laws require proof of a valid Social Security number,
    which will be used to verify your identity and to comply with child support laws.
    It will not be used as your driver license number.
- id: 34
  category: license_system
  question: What is the minimum age required to be issued a graduated and/or motorcycle
    instruction permit in Arizona?
  choices:
    A: 15 years old
    B: 15 years and 6 months of age
    C: 16 years old
    D: 18 years of age
  answer: B
  explanation: If you are at least 15 years and 6 months of age you may be issued
    a graduated and/or a motorcycle instruction permit.
- id: 35
  category: license_system
  question: 'When driving with a graduated or operator instruction permit, you must
    be accompanied in the front seat by a licensed driver who is at least:'
  choices:
    A: 18 years of age
    B: 21 years of age
    C: 25 years of age
    D: 50 years of age
  answer: B
  explanation: For a graduated or operator permit, you must be accompanied by a Class
    A, B, C or D licensed driver at least 21 years of age, who occupies the seat beside
    you.
- id: 36
  category: safe_driving_rules
  question: 'A driver with a motorcycle instruction permit is prohibited from operating
    a motorcycle on freeways or interstate highways:'
  choices:
    A: At any time of day
    B: Between sunset and sunrise
    C: During rush hour traffic
    D: When carrying more than one passenger
  answer: B
  explanation: Motorcycle permit holders are prohibited from operating a motorcycle
    on freeways or interstate highways between sunset and sunrise.
- id: 37
  category: license_system
  question: 'For the first 6 months of holding a graduated driver license (Class G),
    a driver shall not drive a motor vehicle between the hours of midnight and 5:00
    a.m. unless:'
  choices:
    A: They are driving on a freeway or interstate highway
    B: They are accompanied by any licensed driver over 18
    C: They are driving directly to or from a sanctioned school-sponsored activity
    D: They have completed a Defensive Driving course
  answer: C
  explanation: For the first 6 months, a driver with a graduated driver license shall
    not drive between midnight and 5:00 a.m. unless accompanied by a parent/guardian
    or driving directly to/from a sanctioned school-sponsored activity, place of employment,
    religious activity, or family emergency.
- id: 38
  category: license_system
  question: 'During the first 6 months of holding a graduated driver license, you
    may not drive with more than one passenger under the age of 18 unless:'
  choices:
    A: The passengers are the teen driver's siblings
    B: The passengers are classmates traveling to school
    C: The driving takes place during daylight hours
    D: The teen driver has held an instruction permit for 12 months
  answer: A
  explanation: For the first 6 months, a driver with a graduated driver license shall
    not drive a motor vehicle containing more than one passenger under the age of
    18, unless the passengers are the teen driver's siblings or accompanied by a parent/guardian.
- id: 39
  category: driver_testing
  question: If an applicant for a graduated license does not complete an approved
    Arizona driver education program, their parent or guardian must certify they have
    completed at least how many hours of supervised driving practice?
  choices:
    A: 20 hours, including 5 hours at night
    B: 30 hours, including at least 10 hours at night
    C: 40 hours, including at least 15 hours at night
    D: 50 hours, including at least 10 hours at night
  answer: B
  explanation: The parent or guardian must certify in writing that the applicant has
    completed at least 30 hours of supervised driving practice, including at least
    10 hours at night (unless they completed a specific 20-hour alternative).
- id: 40
  category: penalties_and_points
  question: What is the penalty for a driver under age 18 with a graduated driver
    license who receives their first conviction for a traffic violation?
  choices:
    A: A 3-month suspension of driving privileges
    B: A 6-month suspension of driving privileges
    C: Mandatory attendance at Traffic Survival School
    D: Immediate cancellation of the driver license
  answer: C
  explanation: For drivers under age 18 with a graduated driver license, the first
    conviction of a traffic violation requires them to attend Traffic Survival School,
    and the violation goes on their driving record.
- id: 41
  category: penalties_and_points
  question: 'If a driver under age 18 with a graduated driver license receives a second
    conviction for a traffic violation, their driving privilege will be suspended
    for:'
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 12 months
  answer: B
  explanation: A second conviction of a traffic violation for a driver under 18 with
    a graduated driver license results in a 3-month suspension of driving privileges.
- id: 42
  category: driver_responsibility
  question: 'When an adult signs the application for an instruction permit or driver
    license for an applicant under 18, the adult:'
  choices:
    A: Must ride in the vehicle at all times
    B: Becomes responsible for any negligence or willful misconduct when the minor
      is driving
    C: Must pay for the minor's vehicle insurance directly to the MVD
    D: Cannot cancel the minor's license once it is issued
  answer: B
  explanation: If you are under 18, your application must be signed by at least one
    adult. The adult will be responsible for any negligence or willful misconduct
    when you are driving.
- id: 43
  category: license_system
  question: 'Arizona law requires that male applicants under 26 years of age consent
    to registration with the Selective Service when submitting an application for:'
  choices:
    A: A duplicate driver license only
    B: An original, renewal, or reinstatement driver license
    C: A commercial driver license only
    D: A voter registration card
  answer: B
  explanation: Arizona law requires that by submitting an application for an original,
    renewal or reinstatement driver license or identification card, male applicants
    under 26 years of age consent to registration with the Selective Service.
- id: 44
  category: license_system
  question: What is the minimum age required to apply for an operator license (Class
    D) in Arizona?
  choices:
    A: 16 years of age
    B: 18 years of age
    C: 21 years of age
    D: 25 years of age
  answer: B
  explanation: An operator license (Class D) allows you to drive any vehicle that
    does not require a motorcycle or commercial license. You must be at least 18 years
    of age to apply for an operator license.
- id: 45
  category: safe_driving_rules
  question: 'A driver with a motorcycle instruction permit is prohibited from operating
    a motorcycle when there is not enough light to clearly see persons or vehicles
    at a distance of:'
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: Motorcycle permit holders are prohibited from operating a motorcycle
    at any time when there is not enough light to clearly see persons or vehicles
    at a distance of 500 feet.
- id: 46
  category: license_system
  question: If you are under 18 years old, how long must you hold an Arizona motorcycle
    instruction permit before applying for a motorcycle license?
  choices:
    A: At least 3 months
    B: At least 6 months
    C: At least 9 months
    D: At least 12 months
  answer: B
  explanation: An applicant for a motorcycle license or endorsement who is under 18
    must have held an Arizona motorcycle instruction permit for at least six months.
- id: 47
  category: license_system
  question: Which of the following vehicles requires a Class C Commercial Driver License
    (CDL)?
  choices:
    A: A single vehicle with a GVWR of 26,001 lbs or more.
    B: A vehicle towing another vehicle in excess of 10,000 lbs.
    C: A vehicle designed to transport 16 or more passengers including the driver.
    D: Any motorcycle or motor-driven cycle.
  answer: C
  explanation: A Class C CDL is required for a vehicle designed to transport 16 or
    more passengers including the driver, or one used in the transportation of hazardous
    materials requiring placarding.
- id: 48
  category: license_system
  question: Which of the following statements is true regarding an Arizona Identification
    (ID) Card?
  choices:
    A: You must be at least 16 years old to obtain one.
    B: You may possess an ID card and a driver license at the same time.
    C: It is free of charge for persons over the age of 65.
    D: It costs $25 for a duplicate card.
  answer: C
  explanation: The manual states that persons over the age of 65 or anyone receiving
    Federal Supplemental Security Income disability checks receive the ID card free
    of charge.
- id: 49
  category: license_system
  question: Until what date will current, non-federally compliant Arizona credentials
    be sufficient to pass through airport security?
  choices:
    A: May 7, 2025
    B: January 1, 2024
    C: October 1, 2026
    D: December 31, 2025
  answer: A
  explanation: Current Arizona credentials will be sufficient to pass through airport
    security to board commercial aircraft until May 7, 2025.
- id: 50
  category: license_system
  question: How are federally compliant Travel IDs visually distinguished from non-compliant
    credentials?
  choices:
    A: They are printed on blue plastic.
    B: They have a yellow star shape insignia near the upper right corner.
    C: They feature a hologram of the state bird.
    D: They have a red border around the photograph.
  answer: B
  explanation: All federally compliant credentials will be printed with a yellow star
    shape insignia near the upper right corner of the credential.
- id: 51
  category: license_system
  question: When applying for a Travel DL/ID, what is required to prove your residency?
  choices:
    A: One document showing your name and mailing address.
    B: Two documents issued from a business, organization, or government agency containing
      your name and physical residential address.
    C: A verbal oath of residency.
    D: A valid U.S. Passport.
  answer: B
  explanation: Proof of Residency requires two documents or mail issued from a business,
    organization or government agency that contain the applicant's name and physical
    residential address.
- id: 52
  category: license_system
  question: Under what circumstance MUST you visit an MVD office to obtain a duplicate
    license instead of getting it online?
  choices:
    A: If your license is more than 12 years old.
    B: If your license was stolen.
    C: If you changed your address.
    D: If you wish to convert an under 21 license to a regular license.
  answer: A
  explanation: If your license is more than 12 years old, you must visit an MVD office
    to obtain the duplicate so that your photo may be updated.
- id: 53
  category: vehicle_information
  question: According to Arizona law, how many days do you have to apply for a title
    after buying or transferring a vehicle?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: When you buy a vehicle, Arizona law requires that you apply for a title
    within 15 days of purchase or transfer.
- id: 54
  category: vehicle_information
  question: Which vehicles are eligible for a 5-year registration option in Arizona?
  choices:
    A: All commercial motor vehicles.
    B: Vehicles that do not require an emissions test during the five years of the
      registration period.
    C: Any vehicle registered by a person over the age of 65.
    D: Vehicles that have been registered in another state previously.
  answer: B
  explanation: A 5-year registration option is offered for vehicles that do not require
    an emissions test during the five years of the registration period.
- id: 55
  category: vehicle_information
  question: Which of the following is NOT explicitly listed in the manual as equipment
    that must be in working order before you drive?
  choices:
    A: Windshield (intact)
    B: Air conditioning
    C: Emergency flashers
    D: Horn
  answer: B
  explanation: The manual lists brakes, speedometer, turn signals, windshield (intact),
    horn, tires, seat belts, driver and front passenger side windows, and emergency
    flashers as equipment that must be in working order. Air conditioning is not listed.
- id: 56
  category: safe_driving_rules
  question: What should you check immediately before putting the vehicle in motion?
  choices:
    A: Your turn signals and brakes to ensure they are in working order.
    B: The engine oil and coolant levels.
    C: The tread depth of all four tires using a penny.
    D: That all passenger windows are rolled down.
  answer: A
  explanation: Before putting the vehicle in motion, check your turn signals and brakes
    to ensure they are in working order.
- id: 57
  category: vehicle_information
  question: How can you check your tire tread depth using the 'penny test'?
  choices:
    A: Drop a penny from waist height onto the tire to check for bounce.
    B: Place Abraham Lincoln’s head into one of the grooves; part of his head should
      be covered.
    C: Slide a penny along the sidewall to check for cracks.
    D: Place a penny on top of the tire valve to check for air leaks.
  answer: B
  explanation: You can check for wear by using the penny test. Place Abraham Lincoln’s
    head into one of the grooves. Part of Lincoln’s head should be covered by the
    tread.
- id: 58
  category: vehicle_information
  question: Where can you typically find the recommended tire pressure (psi) for your
    vehicle?
  choices:
    A: On the steering wheel
    B: On the vehicle's license plate
    C: On the door jamb
    D: On the windshield wiper blade
  answer: C
  explanation: Find the recommended psi (pounds per square inch) for your vehicle,
    typically on the door jamb.
- id: 59
  category: safe_driving_rules
  question: According to Arizona's Safety Belt Law, who is required to have a lap
    and shoulder belt properly adjusted and fastened?
  choices:
    A: Only the driver
    B: Each front seat occupant of a motor vehicle
    C: Only passengers under the age of 18
    D: Only passengers riding in the back seat
  answer: B
  explanation: Each front seat occupant of a motor vehicle per federal and state motor
    vehicle safety standards must either have the lap and shoulder belt properly adjusted
    and fastened.
- id: 60
  category: vehicle_information
  question: How can you use the 'penny test' to check your tires for wear?
  choices:
    A: Place the penny flat against the sidewall of the tire.
    B: Place Abraham Lincoln's head into a tread groove to see if part of it is covered.
    C: Drop the penny from one foot above the tire to check its bounce.
    D: Scratch the tread with the penny to check the rubber hardness.
  answer: B
  explanation: The manual states to select a point on your tire where the tread appears
    lowest and place Abraham Lincoln's head into one of the grooves. Part of his head
    should be covered by the tread.
- id: 61
  category: safe_driving_rules
  question: According to Arizona law, the operator of a motor vehicle must require
    all passengers under what age to buckle up?
  choices:
    A: 12 years of age
    B: 14 years of age
    C: 16 years of age
    D: 18 years of age
  answer: C
  explanation: The manual specifies that the operator of a motor vehicle must require
    all passengers under the age of 16 years to buckle up.
- id: 62
  category: vehicle_information
  question: What is the primary function of the lap belt in a combination lap/shoulder
    belt system?
  choices:
    A: It keeps your head from striking the windshield.
    B: It prevents ejection and protects your lower body.
    C: It automatically adjusts the seat position.
    D: It disables the airbag in a minor collision.
  answer: B
  explanation: According to the manual, the lap belt prevents ejection and protects
    your lower body, while the shoulder belt keeps your head and chest from striking
    the dashboard or windshield.
- id: 63
  category: safe_driving_rules
  question: 'Arizona law requires a child to be properly secured in a child restraint
    system if they are under the age of:'
  choices:
    A: Three
    B: Four
    C: Five
    D: Six
  answer: C
  explanation: Arizona law requires that a person shall not operate a motor vehicle
    when transporting a child who is under five years of age unless that child is
    properly secured in a child restraint system.
- id: 64
  category: safe_driving_rules
  question: Children between five and eight years of age must remain in a child restraint
    system until they reach what minimum height?
  choices:
    A: 4 feet, 5 inches
    B: 4 feet, 9 inches
    C: 5 feet, 0 inches
    D: 5 feet, 2 inches
  answer: B
  explanation: The manual states that children between five and eight years of age
    are required to be in a child restraint system until they are a minimum of four
    feet, nine inches tall.
- id: 65
  category: safe_driving_rules
  question: Children of what age should never ride in the front seat of a car due
    to the danger of air bags?
  choices:
    A: 8 years and under
    B: 10 years and under
    C: 12 years and under
    D: 15 years and under
  answer: C
  explanation: Air bags are unsafe for children under 12 years of age. The manual
    explicitly states that children age 12 years and under should never ride in the
    front seat of a car.
- id: 66
  category: driver_responsibility
  question: What number can you dial any time, day or night, for up-to-the-minute
    reports about traffic conditions and road closures in Arizona?
  choices:
    A: '211'
    B: '311'
    C: '411'
    D: '511'
  answer: D
  explanation: Travelers can dial 511 any time, day or night for up-to-the-minute
    reports about traffic conditions, road closures, transit, and more.
- id: 67
  category: vehicle_information
  question: If your vehicle does not pass an emission inspection at an authorized
    station, how many days are you given to have the problem fixed and get a re-check?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: If the vehicle does not pass the emission inspection, you will be given
    30 days to have the problem fixed and have a follow-up emission test re-check.
- id: 68
  category: safe_driving_rules
  question: 'Arizona law states that a vehicle must be constructed or loaded in a
    manner to prevent its load from:'
  choices:
    A: Exceeding the height of the vehicle's roof
    B: Dropping, sifting, leaking, or otherwise escaping
    C: Shifting weight to the rear axle
    D: Blocking the driver's view of the dashboard
  answer: B
  explanation: According to Arizona law, a person shall not drive or move a vehicle
    unless it is constructed or loaded in a manner to prevent any of its load from
    dropping, sifting, leaking or otherwise escaping.
- id: 69
  category: vehicle_information
  question: What are the brake requirements for cars and trucks in Arizona?
  choices:
    A: They must have an automatic braking system.
    B: They must have both a foot brake and a parking brake.
    C: They only require a foot brake that applies to all four wheels.
    D: They must have a hand brake and an engine brake.
  answer: B
  explanation: The manual states that every motor vehicle must have brakes in good
    working condition, and cars and trucks must have both a foot brake and a parking
    brake.
- id: 70
  category: vehicle_information
  question: 'To properly reduce the chance of whiplash injury, an adjustable seat-back
    head restraint should be positioned to line up with:'
  choices:
    A: The base of the neck
    B: The top of the shoulders
    C: The middle of the ear
    D: The top of the head
  answer: C
  explanation: If head restraints are adjustable, they should be positioned to fit
    against the back of your head and to line up with the middle of the ear.
- id: 71
  category: vehicle_information
  question: Which of the following is true regarding mufflers on motor vehicles?
  choices:
    A: Muffler 'cut-outs' or bypasses are illegal.
    B: Mufflers are only required on vehicles manufactured after 1967.
    C: Mufflers can be removed if the vehicle is driven outside city limits.
    D: A muffler bypass is allowed for emergency vehicles only.
  answer: A
  explanation: Every motor vehicle must have a muffler in good working condition.
    The manual states it is against the law to use a muffler 'cut-out,' bypass or
    similar device.
- id: 72
  category: vehicle_information
  question: If a vehicle is loaded so that the driver's view to the rear is blocked,
    what is required?
  choices:
    A: A passenger to act as a spotter
    B: An outside driver side mirror showing the highway for at least 200 feet to
      the rear
    C: A rearview camera system with a dashboard monitor
    D: Two outside mirrors showing the highway for at least 500 feet to the rear
  answer: B
  explanation: Every vehicle made or loaded so the driver's view to the rear is blocked
    must have at least one outside driver side mirror that shows the view of the highway
    for at least 200 feet to the rear.
- id: 73
  category: safe_driving_rules
  question: When should you activate your hazard warning signal lights (emergency
    flashers)?
  choices:
    A: When driving in heavy rain or fog
    B: Whenever your vehicle is stopped on the roadway or shoulder of the road
    C: When you are driving below the posted speed limit
    D: When you are backing out of a driveway
  answer: B
  explanation: Hazard warning signal lights (emergency flashers) should be activated
    whenever your vehicle is stopped on the roadway or shoulder of the road.
- id: 74
  category: defensive_driving
  question: According to the manual, what are the most important driving attitudes
    you can develop for safe driving?
  choices:
    A: Confidence and speed
    B: Aggressiveness and assertiveness
    C: Courtesy and consideration toward others
    D: Relaxation and casualness
  answer: C
  explanation: The manual states that courtesy and consideration toward others are
    the most important driving attitudes you can develop and are the key to safe driving.
- id: 75
  category: driver_responsibility
  question: Under Arizona law, when is it permissible to use a handheld wireless device
    while driving?
  choices:
    A: When reading a text message at a red light
    B: When reporting an emergency
    C: When tending to children in the back seat
    D: When recording a video of a traffic hazard
  answer: B
  explanation: Arizona law prohibits holding or supporting a wireless device while
    driving, but a wireless device may be used while driving in order to report an
    emergency.
- id: 76
  category: safe_driving_rules
  question: To help stay within your lane of travel when driving in a curve or turn,
    where should you look?
  choices:
    A: Directly at the vehicle in front of you
    B: Generally to the inside of your lane of travel
    C: Generally to the outside of your lane of travel
    D: At your rearview mirror
  answer: C
  explanation: When driving in a curve or turn, if you look generally to the outside
    of your lane of travel while in the curve, you are more likely stay within your
    lane.
- id: 77
  category: defensive_driving
  question: To avoid the need for last-minute decision making, how far ahead should
    you look down the road?
  choices:
    A: About one city block
    B: About three car lengths
    C: About 100 feet
    D: About half a mile
  answer: A
  explanation: Keep your eyes moving and learn to 'read' the road. To avoid the need
    for last minute decision making, look ahead for a distance of about one city block.
- id: 78
  category: safe_driving_rules
  question: What rule should you use to determine if you have enough cushion between
    you and the vehicle you are following?
  choices:
    A: The 1-2 second rule
    B: The 3-6 second rule
    C: The one car length per 10 mph rule
    D: The 100-foot rule
  answer: B
  explanation: You can use the '3-6 second' rule to determine if you have enough cushion
    between you and the vehicle you are following.
- id: 79
  category: defensive_driving
  question: According to the manual, what is the cause of most rear-end crashes?
  choices:
    A: Distracted driving
    B: Speeding in poor weather conditions
    C: Following too closely
    D: Failing to use turn signals
  answer: C
  explanation: If you are following too closely, you may not be able to stop in time.
    Most rear end crashes are caused by following too closely.
- id: 80
  category: sharing_the_road
  question: When sharing a lane with a bicycle, what is the minimum clearance you
    must allow between your vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: When sharing a lane with a bicycle, allow at least 3 feet of clearance
    between you and the bicycle.
- id: 81
  category: defensive_driving
  question: What should you do if another driver is following you too closely (tailgating)?
  choices:
    A: Tap your brakes quickly to warn them
    B: Speed up to increase the distance between you
    C: Gradually slow down to give additional cushion in front of you
    D: Turn on your hazard lights and maintain your speed
  answer: C
  explanation: If another driver is following too closely, gradually slow down and
    give additional cushion between you and the vehicle in front of you. This allows
    you to brake more slowly to accommodate the reaction time and braking of the vehicle
    that is tailgating you.
- id: 82
  category: safe_driving_rules
  question: When waiting to enter a roadway from a side road, what should you do if
    an approaching vehicle has its turn signal on?
  choices:
    A: Proceed immediately since the vehicle is turning
    B: Wait until you see the other driver commit to the turn before entering
    C: Honk your horn to ensure they see you before you pull out
    D: Pull out quickly before they complete their turn
  answer: B
  explanation: Don’t assume that a vehicle or a motorcycle using a turn signal is
    actually going to make a turn, wait until after you see the other driver commit
    to the turn before entering the roadway.
- id: 83
  category: safe_driving_rules
  question: How far in advance must you signal before making a turn?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: The law designates which lanes and positions you must use when turning
    and requires you to signal at least 100 feet before you turn.
- id: 84
  category: safe_driving_rules
  question: If you plan to turn into a driveway that is located just beyond an intersection,
    when should you begin to signal?
  choices:
    A: 100 feet before the intersection
    B: 50 feet before the intersection
    C: Only after you are in the intersection
    D: After you have completely passed the intersection
  answer: C
  explanation: If you plan to turn beyond an intersection, do not signal until you
    are in the intersection (drivers in the intersection may pull into your path).
- id: 85
  category: safe_driving_rules
  question: When passing another vehicle on the left, when is it safe to return to
    the right lane?
  choices:
    A: As soon as your vehicle's rear bumper clears the other vehicle's front bumper
    B: When you can see the entire front or both headlights of the passed vehicle
      in your rearview mirror
    C: When the driver of the passed vehicle flashes their headlights
    D: Three seconds after you have passed the vehicle
  answer: B
  explanation: When you can see the entire front or both headlights of the vehicle
    you passed in your rearview mirror, look over your shoulder to be sure the lane
    is clear, signal that you are changing lanes, then return to the lane on the right.
- id: 86
  category: defensive_driving
  question: Because mirrors alone cannot show you other vehicles in your blind spots,
    what must you do before changing lanes?
  choices:
    A: Honk your horn to alert vehicles in your blind spot
    B: Look over your shoulder to see if the way is clear
    C: Turn on your hazard lights
    D: Accelerate quickly while changing lanes
  answer: B
  explanation: Do not rely on your mirrors alone to see other vehicles or motorcycles.
    Look over your shoulder to see if the way is clear before changing lanes.
- id: 87
  category: safe_driving_rules
  question: Which of the following is true regarding the use of turn signals?
  choices:
    A: Signaling gives you the right-of-way to change lanes
    B: You only need to signal if you see other vehicles on the road
    C: Signaling does not give you the right-of-way
    D: You do not need to signal when pulling away from a curb
  answer: C
  explanation: Signaling lets other drivers know you are going to do something different
    and gives them time to react to your move. Signaling does not give you the right-of-way.
- id: 88
  category: safe_driving_rules
  question: According to the manual, what is the proper hand placement while operating
    a motor vehicle?
  choices:
    A: One hand on the steering wheel and one hand on the gear shift
    B: Both hands should be on the steering wheel
    C: One hand on the steering wheel while the other rests on the window sill
    D: Only one hand is required if driving an automatic transmission
  answer: B
  explanation: While operating a motor vehicle, both hands should be on the steering
    wheel, allowing the driver full control of the vehicle.
- id: 89
  category: defensive_driving
  question: What should you do if you find yourself driving in another vehicle's blind
    spot?
  choices:
    A: Maintain your speed and stay in the blind spot
    B: Honk your horn continuously until they see you
    C: Speed up or drop back to avoid staying in the blind spot for an extended time
    D: Move closer to the vehicle so they can see you in their side mirror
  answer: C
  explanation: Avoid driving in someone else’s blind spot... Speed up or drop back
    but never stay for an extended time in a blind spot area.
- id: 90
  category: safe_driving_rules
  question: Under which condition is passing on the right permitted?
  choices:
    A: When the vehicle ahead is traveling below the posted speed limit.
    B: By driving off the paved portion of the roadway if the shoulder is wide enough.
    C: When the driver of the other vehicle is turning left and it is safe to do so.
    D: When you are approaching within 100 feet of a railroad crossing.
  answer: C
  explanation: Passing on the right is permitted only when safe and the driver of
    the other vehicle is turning left, or on clearly marked multi-lane roads. You
    must never pass on the right by driving off the paved or main portion of the roadway.
- id: 91
  category: safe_driving_rules
  question: You must NOT pass another vehicle when you are approaching within how
    many feet of a street crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: According to the manual, you must not pass when approaching within
    100 feet of a street crossing.
- id: 92
  category: safe_driving_rules
  question: How should you enter a roundabout?
  choices:
    A: To the left of the central island.
    B: To the right of the central island.
    C: From the center lane only.
    D: Without yielding to vehicles already in the roundabout.
  answer: B
  explanation: The manual instructs drivers to always enter a roundabout to the right
    of the central island and to yield to vehicles already in the roundabout.
- id: 93
  category: safe_driving_rules
  question: What is the designed speed for driving in a roundabout?
  choices:
    A: 5-10 mph
    B: 15-20 mph
    C: 25-30 mph
    D: 35-40 mph
  answer: B
  explanation: You should slow down as you approach the intersection, as roundabouts
    are designed for speeds of 15-20 mph.
- id: 94
  category: safe_driving_rules
  question: What is a key feature of a Diverging Diamond Interchange (DDI)?
  choices:
    A: Traffic on a cross street briefly switches to the left side of the roadway.
    B: All traffic must stop at a central island before proceeding.
    C: Left turns are prohibited at all times.
    D: Vehicles must drive off the paved roadway to exit.
  answer: A
  explanation: A DDI includes intersections and traffic signals that allow traffic
    on a cross street to briefly switch to the left side of the roadway to better
    facilitate traffic flow and enhance safety.
- id: 95
  category: driver_responsibility
  question: When is it legal to park in a space marked with the International Symbol
    of Access?
  choices:
    A: Whenever you are driving a vehicle with a disabled license plate, even if you
      are alone and not the registered owner.
    B: Only when the vehicle displays a valid placard or plate AND is transporting
      the person issued the placard or plate.
    C: For less than 5 minutes while dropping off a passenger.
    D: When there are no other parking spaces available in the lot.
  answer: B
  explanation: Parking spaces marked with this symbol are only to be used by a vehicle
    displaying a valid placard or license plate, and only when transporting the person
    who was issued the placard or plate.
- id: 96
  category: safe_driving_rules
  question: What is the recommended procedure for looking behind you when backing
    up your vehicle?
  choices:
    A: Rely entirely on your backup camera.
    B: Use only your side and rearview mirrors.
    C: Turn around so you can look directly through the rear window.
    D: Open your door and look backward while reversing.
  answer: C
  explanation: The manual states that when backing up, you should turn around so that
    you can look directly through the rear window, and do not depend on your mirrors
    or backup cameras.
- id: 97
  category: safe_driving_rules
  question: When preparing to parallel park, how much space should you leave between
    your vehicle and the forward car when you line up your back bumpers?
  choices:
    A: Approximately six inches
    B: Approximately two feet
    C: Approximately four feet
    D: Approximately one car length
  answer: B
  explanation: To parallel park correctly, stop alongside the forward car so your
    back bumpers line up, leaving approximately two feet between you and the forward
    car.
- id: 98
  category: safe_driving_rules
  question: Which way should you turn your steering wheel when parking on an uphill
    grade with a curb?
  choices:
    A: Turn your wheels to the right.
    B: Keep your wheels straight.
    C: Turn your wheels to the left.
    D: Turn your wheels parallel to the center line.
  answer: C
  explanation: If you park on an uphill grade with a curb, turn your wheels to the
    left, let your car roll back until the right front wheel rests against the curb,
    and set your parking brake.
- id: 99
  category: safe_driving_rules
  question: How should you turn your wheels when parking on a hill where there is
    NO curb?
  choices:
    A: Turn the wheels to the left.
    B: Turn the wheels to the right.
    C: Keep the wheels perfectly straight.
    D: It does not matter as long as the parking brake is set.
  answer: B
  explanation: If there is no curb, turn the wheels to the right so that the car will
    roll away from the center of the road in the event the brakes fail.
- id: 100
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: B
  explanation: According to the prohibited parking rules in the manual, it is illegal
    to park within 15 feet of a fire hydrant.
- id: 101
  category: safe_driving_rules
  question: What is the minimum distance you must maintain when parking near a crosswalk
    at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: C
  explanation: It is illegal to park on a crosswalk or within 20 feet of a crosswalk
    at an intersection.
- id: 102
  category: safe_driving_rules
  question: What should you do when entering a freeway?
  choices:
    A: Stop at the end of the on-ramp and wait for a gap in traffic.
    B: Force your way into the right lane because you have the right-of-way.
    C: Drive through the gore area to merge faster.
    D: Yield the right-of-way to traffic already on the freeway and match their speed.
  answer: D
  explanation: Traffic entering a freeway must yield right-of-way to traffic already
    on the freeway. You should match the speed of your vehicle to the speed of traffic
    in the right lane before merging.
- id: 103
  category: safe_driving_rules
  question: If you must leave your manual transmission vehicle parked on a highway
    for an emergency, what should you do after pulling onto the shoulder?
  choices:
    A: Leave the engine running so the battery doesn't die.
    B: Set the parking brake, leave the vehicle in gear, and turn off the engine.
    C: Shift into neutral and leave the parking brake off.
    D: Stand in the middle of the road to wave down help.
  answer: B
  explanation: For emergency parking, you should pull onto the shoulder, set your
    parking brake, shift into park or leave the vehicle in gear (for manual transmission),
    and turn off the engine.
- id: 104
  category: safe_driving_rules
  question: What should you do if you miss your exit on the highway?
  choices:
    A: Stop and carefully back up to the exit.
    B: Make a U-turn through the median.
    C: Get off at the next exit and look for signs to rejoin the road.
    D: Pull over into the gore area and wait for traffic to clear.
  answer: C
  explanation: 'The manual states: ''If you miss your exit, do not stop. Never back
    up on a highway. Get off the highway at the next exit and look for signs showing
    you how to rejoin the road in the other direction.'''
- id: 105
  category: safe_driving_rules
  question: What is a gore area?
  choices:
    A: The far left lane used exclusively for passing.
    B: The space between a through roadway and an entrance or exit ramp.
    C: A designated parking area for disabled vehicles on the freeway.
    D: An intersection with an inoperative traffic signal.
  answer: B
  explanation: According to the manual, 'A gore area is the space between a through
    roadway and an entrance or exit ramp.' It is against the law to drive over or
    park in any part of a gore area.
- id: 106
  category: safe_driving_rules
  question: During posted times Monday through Friday, who is permitted to use the
    High-Occupancy-Vehicle (HOV) lane?
  choices:
    A: Any vehicle traveling faster than the posted speed limit.
    B: Vehicles carrying fewer than two persons.
    C: Car pool vehicles with two or more persons, motorcycles, or buses.
    D: Commercial trucks and oversized vehicles only.
  answer: C
  explanation: The manual specifies that at posted times Monday through Friday, HOV
    lanes are restricted to car pool vehicles (two or more persons), motorcycles,
    or buses.
- id: 107
  category: signs_and_signals
  question: What does a steady yellow traffic light mean?
  choices:
    A: Speed up to beat the red light before it changes.
    B: The light is about to turn red, and you should come to a safe stop if you have
      not entered the intersection.
    C: You have the exclusive right-of-way to turn left.
    D: Stop immediately, even if you are already in the middle of the intersection.
  answer: B
  explanation: A steady yellow light means CAUTION. It is a warning that the light
    is about to turn red. If you have not entered the intersection, you should come
    to a safe stop.
- id: 108
  category: signs_and_signals
  question: 'A flashing red traffic light has the same meaning as a:'
  choices:
    A: Yield sign.
    B: Stop sign.
    C: Flashing yellow light.
    D: Pedestrian crossing sign.
  answer: B
  explanation: 'The manual states: ''A flashing red light has the same meaning as
    a stop sign. You must come to a full stop, then proceed with caution when the
    roadway is clear.'''
- id: 109
  category: safe_driving_rules
  question: How should you treat an intersection with an inoperative traffic control
    signal?
  choices:
    A: Treat it as a yield sign and proceed if clear.
    B: Treat it as you would a 4-way stop.
    C: Proceed without stopping if you are on the larger road.
    D: Wait at the intersection for a police officer to arrive.
  answer: B
  explanation: When approaching an intersection with an inoperative traffic control
    signal, the manual instructs drivers to 'treat it as you would a 4-way stop. Come
    to a complete stop before entering the intersection...'
- id: 110
  category: safe_driving_rules
  question: At a 'T' intersection, who must yield the right-of-way?
  choices:
    A: The driver on the cross street.
    B: The driver on the street which ends.
    C: The driver who arrives last.
    D: The driver making a right turn.
  answer: B
  explanation: 'The manual states: ''At a “T” intersection, the driver on the street
    which ends must yield the right-of-way to vehicles on the cross street.'''
- id: 111
  category: sharing_the_road
  question: 'If another vehicle is stopped for a pedestrian in a crosswalk, you may:'
  choices:
    A: Pass the vehicle if you have a clear lane.
    B: Pass the vehicle if you have a green traffic signal.
    C: Sound your horn to warn the pedestrian and proceed.
    D: Not pass the stopped vehicle.
  answer: D
  explanation: 'The manual explicitly states: ''You may not pass another vehicle that
    is stopped for a pedestrian, even if you have a clear lane or a green traffic
    signal.'''
- id: 112
  category: safe_driving_rules
  question: If you need assistance on the freeway, what is one correct way to signal
    for help?
  choices:
    A: Walk along the freeway to the nearest exit.
    B: Stop your vehicle on a freeway ramp.
    C: Turn on your emergency flashers or raise the hood of the car.
    D: Stand in the gore area and wave your arms.
  answer: C
  explanation: To signal for assistance on the freeway, the manual advises to 'turn
    on your emergency flashers or raise the hood of the car.' It also warns not to
    walk along the freeway or stop near ramps.
- id: 113
  category: signs_and_signals
  question: At a pedestrian crosswalk with electronic signals, what does a solid red
    light indicate?
  choices:
    A: The pedestrian has activated the signal.
    B: Prepare to stop.
    C: Stop, then proceed with caution immediately.
    D: STOP. A pedestrian is in the crosswalk.
  answer: D
  explanation: For pedestrian activated signals, a Solid Red Light means 'STOP. Pedestrian
    is in the crosswalk.'
- id: 114
  category: safe_driving_rules
  question: If two vehicles arrive at an uncontrolled intersection at about the same
    time, who must yield?
  choices:
    A: The driver of the vehicle on the right must yield to the driver on the left.
    B: The driver of the vehicle on the left must yield to the driver on the right.
    C: The larger vehicle always has the right-of-way.
    D: The vehicle traveling faster has the right-of-way.
  answer: B
  explanation: At an uncontrolled intersection, 'If two vehicles arrive at the intersection
    at about the same time, both must stop and the driver of the vehicle on the left
    must yield the right-of-way to the driver on the right.'
- id: 115
  category: signs_and_signals
  question: What does a flashing yellow arrow mean?
  choices:
    A: You may not turn in the direction of the arrow.
    B: You should slow down and turn with caution, yielding to oncoming traffic and
      pedestrians.
    C: You have the exclusive right-of-way to turn.
    D: The light is about to turn red; stop immediately.
  answer: B
  explanation: A flashing yellow arrow means 'you should slow down and turn with caution
    if the roadway is clear. Yield the right-of-way to any oncoming vehicle or pedestrian
    before making your turn.'
- id: 116
  category: safe_driving_rules
  question: 'As you approach and enter a highway travel lane from an on-ramp, you
    should:'
  choices:
    A: Stop at the end of the ramp and wait for a gap in traffic.
    B: Increase your speed to match that of vehicles already on the road.
    C: Drive slowly in the right lane until you are comfortable.
    D: Cross immediately into the far left lane.
  answer: B
  explanation: 'When entering the highway, the manual instructs: ''As you approach
    and enter a highway travel lane, increase your speed to match that of vehicles
    already on the road.'''
- id: 117
  category: safe_driving_rules
  question: On highways with three or more travel lanes in the same direction, what
    is the far left lane primarily used for?
  choices:
    A: Entering and exiting the highway.
    B: Slower-speed through traffic.
    C: Passing other vehicles.
    D: Emergency stopping only.
  answer: C
  explanation: 'The manual states: ''Stay to the right and only use the left lane
    for passing. If you are traveling on a highway with three lanes, treat the far
    right lane as a slower-speed through lane and the far left lane as the passing
    lane.'''
- id: 118
  category: signs_and_signals
  question: 'When facing a steady red light, you may make a right turn:'
  choices:
    A: At any time without stopping, as long as you yield.
    B: Only if you have a green arrow.
    C: After coming to a complete stop, if the intersection is clear and it is not
      prohibited by signs.
    D: Only if there are no pedestrians on the sidewalk.
  answer: C
  explanation: 'Under the RED signal rules, the manual notes: ''Where not prohibited
    by signs, a right turn may be made after coming to a complete stop, when motor
    traffic and pedestrian traffic are clear.'''
- id: 119
  category: signs_and_signals
  question: What should a driver do when encountering a pedestrian crosswalk with
    flashing red lights?
  choices:
    A: Proceed without stopping if no pedestrians are visible.
    B: Stop, then proceed with caution after the pedestrian finishes crossing the
      driver's half of the roadway.
    C: Stop and wait until the lights turn solid green.
    D: Slow down to 15 mph and proceed through the crosswalk.
  answer: B
  explanation: According to the manual, at pedestrian activated signals with flashing
    red lights, you must STOP, then proceed with caution after the pedestrian finishes
    crossing the driver's half of the roadway.
- id: 120
  category: safe_driving_rules
  question: When entering the roadway from an alley or driveway, where must you stop?
  choices:
    A: Before reaching the sidewalk.
    B: In the middle of the crosswalk.
    C: At the edge of the roadway.
    D: You are not required to stop if the road is clear.
  answer: A
  explanation: The manual states that when entering the roadway from an alley or driveway,
    you must stop before reaching the sidewalk and yield the right-of-way to pedestrians
    and approaching vehicles.
- id: 121
  category: penalties_and_points
  question: What is a potential penalty if you run a red light and cause a crash that
    results in life-threatening injuries to another person?
  choices:
    A: A fine of up to $1,000 and a 6-month suspension.
    B: A fine of up to $500 and a 3-month driving privilege suspension.
    C: Mandatory revocation of your license for one year.
    D: A warning and mandatory community service.
  answer: B
  explanation: If you run a red light and cause a crash resulting in life-threatening
    injuries, you may be fined up to $500 and your driving privilege may be suspended
    for three months, plus possible community service.
- id: 122
  category: penalties_and_points
  question: What happens if you fail to complete the mandatory Traffic Survival School
    (TSS) after a red light conviction?
  choices:
    A: You will be fined an additional $500.
    B: You will receive 3 points on your driving record.
    C: Your driving privilege will be indefinitely suspended.
    D: You must retake the written driving test.
  answer: C
  explanation: MVD requires TSS for every red light conviction. The manual states
    that failure to complete the course results in an indefinite suspension of your
    driving privilege.
- id: 123
  category: safe_driving_rules
  question: What is the minimum distance you must maintain when following a police
    vehicle responding to an emergency?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: The manual requires drivers to maintain a distance of at least 300
    feet behind a police vehicle responding to an emergency.
- id: 124
  category: sharing_the_road
  question: Under the Move Over Law, what must you do if you approach a vehicle with
    flashing lights pulled to the side of the road and you cannot safely change lanes?
  choices:
    A: Stop your vehicle until the flashing lights are turned off.
    B: Honk your horn to alert the stopped vehicle and maintain speed.
    C: Slow down and use caution while passing.
    D: Accelerate to pass the vehicle as quickly as possible.
  answer: C
  explanation: The Move Over Law requires moving over one lane. If it's not safe or
    possible to move over, motorists must slow down and use caution.
- id: 125
  category: sharing_the_road
  question: When are you NOT required to stop for a school bus with alternating flashing
    lights and an extended stop-sign arm?
  choices:
    A: When you are traveling in the opposite direction on a divided roadway with
      a physical barrier.
    B: When you are traveling in the opposite direction on a roadway separated only
      by striping.
    C: When you are running late and there are no children visible.
    D: When you are traveling in the same direction as the bus on a multi-lane highway.
  answer: A
  explanation: You are not required to stop for a school bus on a divided roadway
    when traveling in the opposite direction. A divided roadway must be separated
    by physical barriers, not just striping.
- id: 126
  category: safe_driving_rules
  question: What is the speed limit in any business or residential district when no
    limit is posted?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: The manual states that when no limit is posted, the speed limit is
    25 mph in any business or residential district.
- id: 127
  category: safe_driving_rules
  question: When approaching a school crosswalk where no speed limit is posted, what
    is the maximum speed you should observe?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The manual specifies that you must observe a speed limit of 15 mph
    when approaching a school crosswalk if no limit is posted.
- id: 128
  category: signs_and_signals
  question: What do orange speed limit signs with black letters indicate?
  choices:
    A: The absolute maximum speed you can legally travel.
    B: Recommended safe speeds due to road curvature, grade, or special conditions.
    C: Speed limits specifically for construction vehicles.
    D: Minimum speed limits on rural freeways.
  answer: B
  explanation: Orange signs with black letters indicate recommended safe speeds due
    to the curvature or grade of the road or other special conditions at that location.
- id: 129
  category: defensive_driving
  question: When driving in bad weather, how should you adjust your following distance?
  choices:
    A: Keep it the same as in clear weather.
    B: Decrease it to stay closer to the vehicle ahead's taillights.
    C: Double the following distance from the vehicle in front of you.
    D: Triple the following distance and turn on your hazard lights.
  answer: C
  explanation: 'A guideline for adjusting speed to conditions is: When driving in
    bad weather, double the following distance from the vehicle in front of you and
    reduce speed appropriately.'
- id: 130
  category: safe_driving_rules
  question: If you are driving slower than the traffic around you, what should you
    do to avoid impeding traffic?
  choices:
    A: Drive in the left lane and maintain your speed.
    B: Drive in the right lane and allow faster moving vehicles to pass.
    C: Drive in the center lane with your hazard lights on.
    D: Speed up to match the fastest vehicle on the road.
  answer: B
  explanation: To avoid impeding traffic, remember to drive in the right lane and
    allow faster moving vehicles to pass whenever you are driving slower than traffic
    around you.
- id: 131
  category: signs_and_signals
  question: What does a triangle-shaped traffic sign indicate?
  choices:
    A: You must come to a complete stop.
    B: You are entering a school zone.
    C: You must yield the right-of-way to cross traffic or merging traffic.
    D: You are approaching a railroad crossing.
  answer: C
  explanation: According to the manual, a triangle shape requires that you yield the
    right-of-way to cross traffic or to merging traffic.
- id: 132
  category: sharing_the_road
  question: What is your responsibility when encountering a funeral procession led
    by an escort vehicle with flashing red or blue lights?
  choices:
    A: You may pass the procession if you are in a hurry.
    B: You must yield the right-of-way to any vehicle that is part of the procession.
    C: You should honk your horn to show respect.
    D: You must pull over and turn off your engine until the entire procession passes.
  answer: B
  explanation: Drivers must yield the right-of-way to any vehicle that is part of
    a funeral procession being led by a funeral escort vehicle flashing a red or a
    blue light.
- id: 133
  category: safe_driving_rules
  question: What is the maximum speed limit from the first portable sign to past the
    school crossing sign in a school zone?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: A
  explanation: The manual states that the maximum speed from the first portable sign
    to past the school crossing sign is 15 mph.
- id: 134
  category: safe_driving_rules
  question: What is the rule regarding passing another vehicle in a school crossing
    zone?
  choices:
    A: It is allowed if no children are present.
    B: It is allowed if you are driving under 15 mph.
    C: It is prohibited.
    D: It is allowed if there is no crossing guard.
  answer: C
  explanation: 'The manual explicitly states: "Passing another vehicle in a school
    crossing zone is prohibited."'
- id: 135
  category: safe_driving_rules
  question: When you arrive at a railroad crossing with flashing red lights, how far
    from the nearest track must you stop?
  choices:
    A: No closer than 10 feet
    B: No closer than 15 feet
    C: No closer than 20 feet
    D: No closer than 50 feet
  answer: B
  explanation: When you observe flashing red lights at a railroad crossing, you must
    stop no closer than 15 feet from the nearest railroad track.
- id: 136
  category: defensive_driving
  question: What should you do if your vehicle stalls on railroad tracks?
  choices:
    A: Stay in the vehicle and call 911.
    B: Try to restart the engine while waiting for a train.
    C: Put the vehicle in neutral and attempt to push it off the tracks.
    D: Get out of your vehicle.
  answer: D
  explanation: To reduce your chances of becoming a fatality, the manual advises to
    "Get out of your vehicle if it stalls on the tracks."
- id: 137
  category: signs_and_signals
  question: Where are highway mile posts typically located in Arizona?
  choices:
    A: 5 feet off the left shoulder
    B: 2 feet off the right shoulder
    C: In the center median
    D: 10 feet off the right shoulder
  answer: B
  explanation: Mile posts are reference posts set 2 feet off the right shoulder and
    are about 1 mile apart.
- id: 138
  category: penalties_and_points
  question: What happens to fines for speed violations in work zones when signs are
    posted?
  choices:
    A: They remain the same as normal violations.
    B: They are waived if no workers are present.
    C: They are doubled.
    D: They are tripled.
  answer: C
  explanation: When signs are posted in a work zone, fines for a speed violation are
    doubled.
- id: 139
  category: signs_and_signals
  question: What is the basic color for alerting and controlling devices in road construction
    and maintenance work areas?
  choices:
    A: Yellow
    B: Red
    C: Orange
    D: Neon Green
  answer: C
  explanation: Orange is the basic color for warning devices used in road construction
    and maintenance work areas.
- id: 140
  category: safe_driving_rules
  question: What do double solid yellow lines on the roadway mean?
  choices:
    A: Passing is allowed in both directions.
    B: Passing is allowed only on the right.
    C: Passing is not allowed unless you are turning left.
    D: Passing is allowed if the road ahead is clear.
  answer: C
  explanation: Double solid yellow lines mean that passing is not allowed in either
    direction, and you may not cross the lines unless you are turning left.
- id: 141
  category: safe_driving_rules
  question: What does a white painted curb indicate?
  choices:
    A: You may stop only long enough to load or unload freight.
    B: You may stop only long enough to pick up or drop off passengers.
    C: You may not stop, stand, or park at any time.
    D: You may park for up to 15 minutes.
  answer: B
  explanation: A white painted curb means you may stop only long enough to pick up
    or drop off passengers.
- id: 142
  category: safe_driving_rules
  question: What are the rules for stopping at a yellow painted curb?
  choices:
    A: You may stop only long enough to load or unload, and you must stay with your
      car.
    B: You may park for up to 30 minutes if you leave your hazard lights on.
    C: You may stop only to pick up passengers.
    D: You may not stop at any time.
  answer: A
  explanation: A yellow painted curb means you may stop only long enough to load or
    unload, and you must stay with your car.
- id: 143
  category: safe_driving_rules
  question: If you are traveling on a one-way street for several blocks, which lane
    is best to stay in?
  choices:
    A: The left lane
    B: The right lane
    C: The center lane
    D: Any lane that is open
  answer: C
  explanation: If you will be traveling on a one-way street for several blocks, it
    is best to stay in the center lane, as the left and right lanes will be used by
    turning vehicles.
- id: 144
  category: signs_and_signals
  question: What does a broken yellow line alongside a solid yellow line indicate?
  choices:
    A: Passing is permitted in both directions.
    B: Passing is permitted only if the broken line is on your side.
    C: Passing is never permitted.
    D: Passing is permitted only if the solid line is on your side.
  answer: B
  explanation: A broken yellow line alongside a solid yellow line indicates that passing
    is permitted only in one direction. If the broken yellow line is on your side,
    you may pass when the roadway ahead is clear.
- id: 145
  category: signs_and_signals
  question: What do yellow center lines on a roadway indicate?
  choices:
    A: One-way traffic moving in the same direction.
    B: Two-way traffic flowing in both directions.
    C: A pedestrian crosswalk.
    D: The right edge of the roadway.
  answer: B
  explanation: Yellow center lines indicate that there is two-way traffic, flowing
    in both directions.
- id: 146
  category: safe_driving_rules
  question: When is it permissible to cross a solid white line on the right edge of
    the roadway?
  choices:
    A: To pass a slow-moving vehicle
    B: In case of emergency or to avoid a road hazard
    C: When preparing to make a right turn at an intersection
    D: It is never permissible to cross a solid white line
  answer: B
  explanation: According to the manual, you should only cross the solid line on the
    right edge of the roadway in case of emergency or to avoid a road hazard.
- id: 147
  category: signs_and_signals
  question: How are reversible lanes usually marked on the roadway?
  choices:
    A: Double solid yellow lines
    B: Single broken white lines
    C: Double-dashed yellow lines
    D: Solid white lines
  answer: C
  explanation: The manual states that reversible lanes, which carry traffic in one
    direction at certain times and the opposite direction at other times, are usually
    marked by double-dashed yellow lines.
- id: 148
  category: safe_driving_rules
  question: When turning right at a red light, what must you do first?
  choices:
    A: Slow down and yield to oncoming traffic without stopping
    B: Stop completely before reaching the marked or unmarked crosswalk
    C: Honk your horn to warn pedestrians before turning
    D: Move into the intersection to check for cross traffic
  answer: B
  explanation: When turning right at a red light, you must first stop completely before
    reaching the marked or unmarked crosswalk and look for 'No Turn On Red' signs.
- id: 149
  category: safe_driving_rules
  question: In which of the following situations may you make a left turn against
    a red light after stopping and yielding, unless signs prohibit it?
  choices:
    A: Turning from a two-way road to a two-way road
    B: Turning from a one-way road to a two-way road
    C: Turning from a two-way road to a one-way road
    D: Turning from a one-way road to a one-way road
  answer: D
  explanation: A left turn from a one-way road to a one-way road is the only left
    turn situation where you may make the turn against a red light after stopping
    and yielding to traffic and pedestrians, unless signs prohibit it.
- id: 150
  category: signs_and_signals
  question: How is a two-way left turn lane bordered on either side?
  choices:
    A: By two solid white lines
    B: By a solid yellow inner line and a broken yellow outer line
    C: By a broken yellow inner line and a solid yellow outer line
    D: By double-dashed yellow lines
  answer: C
  explanation: A two-way left turn lane is bordered on either side by two yellow lines
    – the inner line is broken, the outer line is solid.
- id: 151
  category: safe_driving_rules
  question: Which of the following is a prohibited use of a two-way left turn lane?
  choices:
    A: Slowing down before making a left turn off the street
    B: Driving into it when turning left from a side street
    C: Accelerating in order to merge with thru traffic
    D: Waiting for oncoming traffic to clear before turning left
  answer: C
  explanation: Drivers should not use the two-way left turn lane for passing, for
    thru traffic, or to accelerate in order to merge with thru traffic.
- id: 152
  category: defensive_driving
  question: How can a driver identify that a METRO light rail train is moving away
    from them?
  choices:
    A: By the white headlights
    B: By the red taillights
    C: By the flashing yellow lights
    D: By the warning bells
  answer: B
  explanation: The ends of a light rail train are identical. White headlights show
    a train approaching, while red taillights show it moving away.
- id: 153
  category: safe_driving_rules
  question: Are U-turns permitted at METRO light rail intersections?
  choices:
    A: No, U-turns are strictly prohibited at all light rail intersections
    B: Yes, but only if there is no train approaching
    C: Yes, they are permitted at almost all light rail intersections and are controlled
      by traffic signals
    D: Yes, but only during daylight hours
  answer: C
  explanation: U-turns are permitted at almost all of the light rail intersections
    in the 20-mile METRO system to allow vehicles to cross the tracks, and they are
    controlled with traffic signals.
- id: 154
  category: sharing_the_road
  question: What is the minimum safe distance motorists must allow when passing a
    bicyclist traveling in the same direction?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: Motorists are required to allow a minimum safe distance of 3 feet when
    passing a bicyclist traveling in the same direction.
- id: 155
  category: sharing_the_road
  question: Why should motorists avoid honking their horn at bicyclists when passing?
  choices:
    A: It is illegal in all residential areas
    B: It may startle them and cause them to crash
    C: It causes unnecessary noise pollution
    D: Bicyclists cannot hear horns due to wind noise
  answer: B
  explanation: The manual states that it is not safe for motorists to honk their horn
    at bicyclists when passing, as this may startle them and cause them to crash.
- id: 156
  category: sharing_the_road
  question: Under what condition is a bicyclist legally allowed to move left from
    the right side of the road?
  choices:
    A: When the lane is too narrow for a bicycle and motor vehicle to travel safely
      side-by-side
    B: When they want to ride side-by-side with three other bicyclists
    C: When they are traveling faster than the posted speed limit
    D: Bicyclists are never allowed to move left
  answer: A
  explanation: Bicyclists can legally move left for several reasons, including if
    the lane is too narrow for a bicycle and motor vehicle to travel safely side-by-side.
- id: 157
  category: sharing_the_road
  question: What lighting equipment is required for a bicycle when riding at night?
  choices:
    A: A red head lamp visible from 300 feet
    B: A white head lamp visible from 500 feet and a rear reflector
    C: Flashing yellow lights on both the front and rear
    D: A white reflector on the front and a red head lamp on the rear
  answer: B
  explanation: When riding at night, bicyclists must have a white head lamp visible
    from 500 feet, and a rear reflector.
- id: 158
  category: sharing_the_road
  question: What is the most common cause of car and motorcycle crashes?
  choices:
    A: A motorcycle speeding through an intersection
    B: A car turning in front of a motorcycle because the driver did not see it
    C: A motorcycle tailgating a car
    D: A car braking too suddenly in front of a motorcycle
  answer: B
  explanation: Most car/motorcycle crashes are the result of a car turning in front
    of a motorcycle, usually because the driver did not see the motorcycle.
- id: 159
  category: signs_and_signals
  question: What does a double solid white line separate?
  choices:
    A: Two lanes of traffic going in the same direction where crossing is prohibited
    B: Two lanes of traffic moving in opposite directions
    C: A carpool lane where crossing is permitted at any time
    D: A reversible lane from standard traffic lanes
  answer: A
  explanation: A double solid white line separates two lanes of traffic going in the
    same direction, and crossing a double solid white line is prohibited.
- id: 160
  category: sharing_the_road
  question: How is the METRO train-only track-way separated from automobile traffic?
  choices:
    A: By a solid double yellow line
    B: By concrete barriers
    C: By six-inch curbs
    D: By a chain-link fence
  answer: C
  explanation: METRO travels in its own track-way, separated from traffic by six-inch
    curbs.
- id: 161
  category: sharing_the_road
  question: Under which of the following conditions is a motorcyclist permitted to
    practice lane filtering?
  choices:
    A: The posted speed limit is 55 miles per hour or higher.
    B: The motorcycle is traveling at 25 miles per hour.
    C: The posted speed limit does not exceed 45 miles per hour.
    D: The street has only one lane traveling in the same direction.
  answer: C
  explanation: Lane filtering is permitted provided that the street is divided into
    at least 2 adjacent lanes in the same direction, the posted speed limit does not
    exceed 45 mph, and the motorcycle does not travel faster than 15 mph.
- id: 162
  category: sharing_the_road
  question: Why might a motorcyclist unexpectedly shift positions within their own
    lane?
  choices:
    A: To allow passenger vehicles to share the same lane.
    B: To avoid oil, potholes, or debris.
    C: To signal an upcoming lane change to the right.
    D: To trigger their automatic turn signals.
  answer: B
  explanation: The manual notes that motorcyclists may shift within their lane to
    avoid oil, potholes, or debris, or to improve visibility.
- id: 163
  category: sharing_the_road
  question: What is the "No-Zone" when sharing the road with large trucks and buses?
  choices:
    A: The designated passing lane for trucks only.
    B: The large blind spots around the front and back sides of the vehicle.
    C: The area directly in front of the truck where it is safe to cut in.
    D: The shoulder of the highway where trucks are prohibited from parking.
  answer: B
  explanation: The manual describes the "No-Zone" as the large blind spots around
    the front and back sides of large trucks and buses.
- id: 164
  category: sharing_the_road
  question: Why should you avoid passing a truck on the right if there is any possibility
    it might make a right turn?
  choices:
    A: Trucks accelerate much faster on the right side.
    B: It is illegal to pass any commercial vehicle on the right.
    C: Trucks make wide right turns and sometimes must leave an open space to the
      right just before the turn.
    D: Trucks have no blind spots on the right side, making them overly sensitive
      to passing cars.
  answer: C
  explanation: Trucks make wide right turns and sometimes must leave an open space
    to the right just before the turn. Passing on the right can lead to a collision.
- id: 165
  category: signs_and_signals
  question: When you see a slow-moving vehicle symbol on the back of a vehicle ahead,
    what does it indicate about the vehicle's maximum speed?
  choices:
    A: The vehicle cannot travel faster than 15 mph.
    B: The vehicle cannot travel faster than 25 mph.
    C: The vehicle cannot travel faster than 35 mph.
    D: The vehicle cannot travel faster than 45 mph.
  answer: B
  explanation: The manual states that when you see this symbol on the back of a vehicle
    ahead, it is a warning to slow down, and the vehicle with the sign cannot travel
    faster than 25 mph.
- id: 166
  category: defensive_driving
  question: What is the average driver perception time (the time it takes to see and
    recognize a dangerous situation)?
  choices:
    A: 0.50 seconds
    B: 0.75 seconds
    C: 1.5 seconds
    D: 3.0 seconds
  answer: B
  explanation: According to the manual, the average driver perception time is 0.75
    seconds.
- id: 167
  category: safe_driving_rules
  question: What is the recommended minimum following distance for most normal driving
    situations?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 6 seconds
  answer: C
  explanation: The manual advises drivers to allow at least a 3-second following distance
    for most driving situations.
- id: 168
  category: safe_driving_rules
  question: How should you adjust your following distance when driving on slippery
    roads?
  choices:
    A: Maintain the standard 3-second following distance.
    B: Reduce it to 2 seconds to keep the vehicle ahead in clear view.
    C: Double your following distance to 6 seconds or more.
    D: Increase it to exactly 4 seconds.
  answer: C
  explanation: When driving on slippery roads, you should double your following distance
    to 6 seconds or more to allow for the extra distance needed to adjust your speed
    or to stop.
- id: 169
  category: defensive_driving
  question: What should you do if you are pulling a trailer and a large truck passes
    you on the left, creating gusts of wind?
  choices:
    A: Move to the left lane to block the wind currents.
    B: Brake hard and come to a complete stop on the shoulder.
    C: Speed up to pass the truck before it fully passes you.
    D: Move as far right as possible, slow down, and then accelerate slowly as it
      passes.
  answer: D
  explanation: 'The manual instructs: "When a truck or bus is passing you on the left,
    move as far as possible to the right of your lane and slow down. As the vehicle
    passes, accelerate slowly to keep the trailer pulling in a straight path."'
- id: 170
  category: defensive_driving
  question: What is the first rule when driving in bad weather that reduces visibility
    and traction?
  choices:
    A: Turn on your high beam headlights.
    B: Slow down to make up for reduced visibility and reaction time.
    C: Pull over to the shoulder immediately and wait for the weather to clear.
    D: Honk your horn periodically to warn other drivers of your presence.
  answer: B
  explanation: The manual states that the first rule when driving in bad weather is
    to slow down to make up for reduced visibility and reaction time.
- id: 171
  category: sharing_the_road
  question: Why might a motorcycle appear to be farther away and traveling slower
    than it actually is?
  choices:
    A: Because motorcycles typically have dimmer headlights than cars.
    B: Because of the motorcycle's smaller size.
    C: Because motorcycles are legally required to travel below the speed limit.
    D: Because riders often wear dark, non-reflective clothing.
  answer: B
  explanation: The smaller size of a motorcycle may make it hard to spot in traffic,
    and it may appear to be farther away and traveling slower than it actually is.
- id: 172
  category: sharing_the_road
  question: How does cutting in front of a large truck affect its ability to stop
    safely?
  choices:
    A: It cuts the truck's available stopping distance in half.
    B: It doubles the truck's stopping distance.
    C: It has no effect on the truck's stopping distance.
    D: It helps the truck stop faster by creating a draft.
  answer: A
  explanation: If you move into the space in front of a truck and have to brake suddenly,
    you cut the truck’s available stopping distance in half, placing you and your
    passengers in danger.
- id: 173
  category: defensive_driving
  question: How does a strong tailwind affect your vehicle while driving?
  choices:
    A: It decreases your speed and requires more acceleration.
    B: It pushes your vehicle sideways into adjacent lanes.
    C: It increases your speed, requiring you to decelerate and begin braking earlier
      to stop.
    D: It causes your vehicle to jackknife immediately.
  answer: C
  explanation: A tailwind will increase your speed, so you will have to decelerate
    and begin braking earlier to stop.
- id: 174
  category: sharing_the_road
  question: How might operators of farm machinery maneuver when preparing to make
    a wide turn?
  choices:
    A: They will always pull completely off the road first.
    B: They may first pull to the left, then turn to the right.
    C: They will speed up to clear the intersection as quickly as possible.
    D: They will only turn from the rightmost edge of the lane.
  answer: B
  explanation: To make a wide turn, operators of farm machinery may first pull to
    the left, then turn to the right.
- id: 175
  category: sharing_the_road
  question: What should you do when a large truck or bus is passing you on the left?
  choices:
    A: Accelerate quickly to stay ahead of the vehicle.
    B: Move as far as possible to the right of your lane and slow down.
    C: Move into the left lane directly behind the passing vehicle.
    D: Maintain your exact speed and lane position.
  answer: B
  explanation: According to the manual, when a truck or bus is passing you on the
    left, you should move as far as possible to the right of your lane and slow down,
    then accelerate slowly as it passes to keep your vehicle pulling straight.
- id: 176
  category: safe_driving_rules
  question: If you encounter a severe dust storm and must pull completely off the
    highway, what should you do with your vehicle's lights?
  choices:
    A: Turn on your hazard lights.
    B: Turn on your high beams.
    C: Leave your low beams on.
    D: Turn off your lights.
  answer: D
  explanation: The manual states that if you encounter a severe dust storm and pull
    off the highway, you should turn off your lights, take your foot off the brake,
    and stay in the vehicle with your seat belts buckled.
- id: 177
  category: defensive_driving
  question: Why should you be extra careful during the first 30 minutes after rain
    begins?
  choices:
    A: Hydroplaning only occurs during the first 30 minutes of a storm.
    B: Grime and oil on the road surface mix with water and make the road slippery.
    C: Your windshield wipers need time to warm up and clear the glass.
    D: Flash floods are most likely to occur immediately after the first drop of rain.
  answer: B
  explanation: The manual advises drivers to be extra careful during the 30 minutes
    after rain begins because grime and oil on the road surface mix with water and
    make the road slippery.
- id: 178
  category: safe_driving_rules
  question: At what speed can your tires lose all contact with the road during heavy
    rain due to hydroplaning?
  choices:
    A: 35 mph
    B: 40 mph
    C: 50 mph
    D: 65 mph
  answer: C
  explanation: In a heavy rain, your tires can ride on a film of water, and at 50
    mph your tires can lose all contact with the road.
- id: 179
  category: defensive_driving
  question: If your car begins to hydroplane, what is the correct action to take?
  choices:
    A: Brake hard immediately to regain traction.
    B: Turn the steering wheel sharply toward the shoulder.
    C: Take your foot off the accelerator and do not brake.
    D: Accelerate slightly to push through the standing water.
  answer: C
  explanation: If your car hydroplanes, the manual instructs you to take your foot
    off the accelerator, do not brake, avoid steering changes if possible, and hold
    the wheel firmly.
- id: 180
  category: safe_driving_rules
  question: Why should two vehicles avoid meeting in deep water when crossing a flooded
    wash?
  choices:
    A: It increases the possibility of stalling caused by waves of water.
    B: The combined weight of the vehicles will damage the submerged road.
    C: It is illegal to pass another vehicle in a wash under any circumstances.
    D: The vehicles may collide due to poor visibility from splashing.
  answer: A
  explanation: The manual states that two vehicles should not meet in deep water;
    one should go entirely through before another starts. This reduces the possibility
    of stalling caused by waves of water.
- id: 181
  category: penalties_and_points
  question: What is the consequence of driving around barricades set up due to flooding
    if your vehicle becomes inoperable?
  choices:
    A: You will automatically lose your license for one year.
    B: You are liable for the expenses of any emergency response required to remove
      you or your passengers.
    C: You will be charged with a felony hit-and-run.
    D: Your vehicle will be impounded by the state for 30 days.
  answer: B
  explanation: A driver who drives around barricades set up due to flooding is liable
    for the expenses of any emergency response required to remove the driver or any
    passenger if the vehicle becomes inoperable.
- id: 182
  category: safe_driving_rules
  question: When driving in fog, which lights should you use?
  choices:
    A: High beams only
    B: Low beams only
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: Fog reflects light and can reflect your own headlights into your eyes.
    When driving in fog, the manual states you must use low beams only.
- id: 183
  category: defensive_driving
  question: During winter driving, where should you be especially watchful for ice
    because it freezes before other road surfaces?
  choices:
    A: In the center lane of highways
    B: On bridges and in shady areas
    C: At intersections with traffic lights
    D: On steep uphill grades
  answer: B
  explanation: The manual advises to watch for ice on bridges and in shady areas,
    noting that bridge surfaces freeze before other road surfaces.
- id: 184
  category: safe_driving_rules
  question: When driving on a highway at night, you should use your high beams when
    no other vehicle is coming toward you within what distance?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: You should use high beams on highways when no other vehicle is coming
    toward you within 500 feet.
- id: 185
  category: safe_driving_rules
  question: 'When following another car at night, you must use your low beams whenever
    you are within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: The manual states that when following another car, you must use low
    beams whenever you are within 200 feet.
- id: 186
  category: defensive_driving
  question: What should you do if an oncoming car does not dim its high beams at night?
  choices:
    A: Flash your high beams repeatedly until they dim theirs.
    B: Look directly at the headlights to gauge their distance.
    C: Glance toward the right side of the road and look ahead to determine their
      position.
    D: Turn on your hazard lights and pull over immediately.
  answer: C
  explanation: If the high beams of an oncoming car are not dimmed, avoid looking
    directly at the bright lights. Glance toward the right side of the road, then
    look ahead to determine the position of the other vehicle.
- id: 187
  category: driver_responsibility
  question: 'To help prevent ''Highway Hypnosis'' during a long trip, the manual recommends
    that you:'
  choices:
    A: Drink caffeine and drive faster to reach your destination sooner.
    B: Keep the windows rolled up and the heater on.
    C: Stop every hour to walk and exercise.
    D: Stare fixedly at the white line on the right side of the road.
  answer: C
  explanation: To ward off highway hypnosis, the manual recommends using the radio
    and fresh air, and stopping every hour to walk and exercise to help keep you alert.
- id: 188
  category: defensive_driving
  question: If you see an overhead sign warning 'ALERT, WRONG-WAY DRIVER AHEAD,' what
    is the recommended action?
  choices:
    A: Move into the left lane to block the wrong-way driver.
    B: Safely move toward the nearest highway exit as soon as possible.
    C: Stop your vehicle in the travel lane and wait for police.
    D: Turn on your high beams to warn the approaching driver.
  answer: B
  explanation: If you see a message warning of a wrong-way driver ahead, you should
    safely move toward the nearest highway exit as soon as possible.
- id: 189
  category: defensive_driving
  question: In which lane are wrong-way drivers usually found on a divided highway?
  choices:
    A: The right lane or shoulder
    B: The center lane
    C: The left or HOV lane
    D: The emergency lane
  answer: C
  explanation: The manual notes that while wrong-way drivers enter highways from the
    right via off-ramps, they are usually found driving in the left or HOV lane.
- id: 190
  category: alcohol_drugs_health
  question: In which of the following vehicles is a passenger exempt from the open
    container law while riding?
  choices:
    A: A standard pickup truck
    B: A taxi
    C: A two-door sedan
    D: A motorcycle
  answer: B
  explanation: According to the manual, passengers riding in a bus, limousine, taxi,
    or the living area of a motor home are exempt from the law prohibiting open containers
    of spirituous liquor.
- id: 191
  category: penalties_and_points
  question: What is the penalty for a driver under the age of 21 who is found to have
    any trace of alcohol or drugs in their system?
  choices:
    A: A 30-day license suspension
    B: A 6-month license suspension
    C: A 1-year license suspension
    D: A 2-year license suspension
  answer: D
  explanation: Arizona has a Zero-Tolerance policy for drivers under 21. Any trace
    of alcohol, marijuana, medications, or illegal drugs that impair your ability
    to drive safely will result in your license being suspended for 2 years.
- id: 192
  category: penalties_and_points
  question: What is the maximum driver license suspension period for a first conviction
    of knowingly providing spirituous liquor to a minor?
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: A
  explanation: Upon a first conviction of knowingly purchasing for or providing spirituous
    liquor to a minor, the court may direct MVD to suspend the person's driver license
    for a period of not more than 30 days.
- id: 193
  category: safe_driving_rules
  question: To be cited for aggressive driving, a driver must present an immediate
    hazard, exceed the posted speed limit, and commit at least how many specific traffic
    violations (such as following too close or passing on the right)?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: You may be cited for aggressive driving if you present an immediate
    hazard, exceed the posted speed limit, and commit two of the listed violations,
    such as unsafe lane changes or following too close.
- id: 194
  category: penalties_and_points
  question: What is the penalty for a first aggressive driving offense?
  choices:
    A: A warning and a fine
    B: Traffic Survival School and a possible 30-day license suspension
    C: A Class 1 misdemeanor and a 12-month suspension
    D: Immediate vehicle impoundment for 6 months
  answer: B
  explanation: For a first aggressive driving offense, you will be required to attend
    a Traffic Survival School course and your license may be suspended for 30 days.
- id: 195
  category: driver_responsibility
  question: 'If you are applying for a driver license, you must report to the MVD
    if you have had a seizure within the past:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: A person who has had a seizure within 90 days of applying for a driver
    license is required to report that medical condition to MVD.
- id: 196
  category: defensive_driving
  question: According to the manual, which of the following is identified as one of
    the five groups of drivers most at risk for crashes due to sleepiness?
  choices:
    A: Shift workers
    B: Elderly drivers
    C: Drivers with passengers
    D: Motorcyclists
  answer: A
  explanation: The five groups of drivers identified as at risk for crashes due to
    sleepiness are shift workers, business travelers, commercial drivers, those with
    sleep disorders, and young people.
- id: 197
  category: penalties_and_points
  question: After a license revocation period has ended and the investigation is completed,
    what is the required reinstatement fee you must pay?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: To reinstate a revoked license after the investigation is completed,
    you will be required to pay the appropriate application fee and a $20 reinstatement
    fee.
- id: 198
  category: penalties_and_points
  question: Which of the following offenses will result in the revocation of your
    driving privilege?
  choices:
    A: A single speeding ticket
    B: Failure to yield the right-of-way
    C: Failure to stop and render aid at the site of a traffic crash
    D: Parking in a handicapped zone without a placard
  answer: C
  explanation: Your driving privilege will be revoked for several serious offenses,
    including failure to stop and render aid at the site if you are involved in a
    traffic crash.
- id: 199
  category: penalties_and_points
  question: Your driving privilege will be suspended if you receive two or more convictions
    for which of the following offenses?
  choices:
    A: Racing on the highways
    B: Driving without a seatbelt
    C: Running a stop sign
    D: Improper parking
  answer: A
  explanation: Your driving privilege will be suspended for two or more convictions
    for reckless driving or racing on the highways.
- id: 200
  category: penalties_and_points
  question: Under which of the following circumstances will a vehicle be impounded
    or immobilized?
  choices:
    A: The driver is caught speeding 10 mph over the limit.
    B: The driver is operating the vehicle with a suspended or revoked driver license.
    C: The driver has an unpaid parking ticket.
    D: The driver fails to use a turn signal.
  answer: B
  explanation: A vehicle shall be impounded or immobilized when the person's driving
    privilege is suspended or revoked for any reason.
- id: 201
  category: alcohol_drugs_health
  question: Which of the following statements is true regarding Blood Alcohol Concentration
    (BAC)?
  choices:
    A: You cannot be arrested for DUI if your BAC is below 0.08.
    B: It is always safe and legal to drive as long as your BAC is below 0.08.
    C: You can still be arrested for driving under the influence even if your BAC
      is below 0.08.
    D: Alcohol only impairs driving ability when your BAC reaches exactly 0.08.
  answer: C
  explanation: Remember, being under the legal limit of 0.08 BAC does not mean that
    it is legal or safe for you to drive and you can still be arrested for driving
    under the influence. Studies prove alcohol impairs ability at levels substantially
    below 0.08.
- id: 202
  category: alcohol_drugs_health
  question: Under the open container law, which area of a vehicle is NOT considered
    part of the passenger compartment?
  choices:
    A: The glove box
    B: The center console
    C: The trunk
    D: Any portable device within reach of the driver
  answer: C
  explanation: The passenger compartment includes any unlocked compartments or portable
    devices within reach of the driver or passenger. It does not include the trunk
    or the area behind the last upright seat of a vehicle not equipped with a trunk.
- id: 203
  category: defensive_driving
  question: According to the manual, what is the emotion that probably occurs most
    often while driving?
  choices:
    A: Sadness
    B: Excitement
    C: Anger
    D: Fear
  answer: C
  explanation: The manual states that anger is the emotion that probably occurs most
    often while driving, especially in heavy traffic. It is best to wait until you
    are calm before driving.
- id: 204
  category: driver_responsibility
  question: If you already have a driver license and experience a seizure or other
    medical condition that affects your ability to drive safely, what must you do?
  choices:
    A: Continue driving but avoid highways.
    B: Cease driving, notify the MVD, and have a medical exam.
    C: Wait 30 days to see if the condition improves before notifying the MVD.
    D: Only drive during daylight hours.
  answer: B
  explanation: A person who already has a driver license and who has a seizure or
    other medical condition is required to cease driving, notify MVD and have a medical
    exam.
- id: 205
  category: penalties_and_points
  question: How many points accumulated within any 12-month period will require you
    to attend Traffic Survival School (TSS) or face license suspension?
  choices:
    A: 6 or more points
    B: 8 or more points
    C: 10 or more points
    D: 12 or more points
  answer: B
  explanation: According to the manual, if you accumulate 8 or more points within
    any 12-month period, you are required to attend Traffic Survival School (TSS),
    or your driving privilege may be suspended.
- id: 206
  category: penalties_and_points
  question: How many violation points are assessed against your driving record for
    leaving the scene of a crash?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: The manual states that leaving the scene of a crash results in 6 violation
    points being assessed against your driving record.
- id: 207
  category: penalties_and_points
  question: Which of the following moving traffic violations results in 8 points being
    assessed against your permanent driving record?
  choices:
    A: Speeding
    B: Wrong-way driving
    C: Reckless Driving
    D: Driving over or parking in a gore area
  answer: C
  explanation: According to the violation points table in the manual, Reckless Driving
    results in 8 points. Speeding is 3 points, Wrong-way driving is 2 points, and
    driving over a gore area is 3 points.
- id: 208
  category: penalties_and_points
  question: If you are convicted of running a red light, what penalty is mandatory
    in addition to paying all court fines and fees?
  choices:
    A: A 30-day vehicle impoundment
    B: A 6-month license suspension
    C: Attending Traffic Survival School (TSS)
    D: Performing 40 hours of community service
  answer: C
  explanation: The manual states that if you have been convicted of running a red
    light (or flashing red light), TSS is mandatory in addition to paying all court
    fines/fees.
- id: 209
  category: alcohol_drugs_health
  question: Under the Implied Consent Law, what is the penalty for your first refusal
    to take or successfully complete a chemical test for alcohol or drugs?
  choices:
    A: A 6-month suspension of your driver license
    B: A 12-month suspension of your driver license
    C: A 24-month suspension of your driver license
    D: Permanent revocation of your driver license
  answer: B
  explanation: The penalty for refusal or unsuccessful completion of a chemical test
    is a 12-month suspension of your driver license, or 2 years for a second or subsequent
    refusal within a 7-year period.
- id: 210
  category: penalties_and_points
  question: 'If you are cited for driving on a revoked or suspended license, your
    vehicle may be impounded by the law enforcement agency for up to:'
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: The manual states that if you are cited for driving on a revoked or
    suspended license, your vehicle may be impounded by the law enforcement agency
    for up to 30 days.
- id: 211
  category: driver_responsibility
  question: What is the penalty for a first violation of failing to produce evidence
    of current financial responsibility (insurance) within the vehicle?
  choices:
    A: A 3-month suspension of the driving license, vehicle registration, and license
      plates
    B: A 6-month suspension of the driving license, vehicle registration, and license
      plates
    C: A 1-year suspension of the driving license, vehicle registration, and license
      plates
    D: A mandatory 30-day jail sentence
  answer: A
  explanation: A person convicted of failing to produce evidence of current financial
    responsibility shall receive a suspension of the driving license, vehicle registration,
    and license plates for 3 months for a first violation.
- id: 212
  category: penalties_and_points
  question: 'If Arizona courts report to MVD that you are delinquent in paying fines
    for civil or criminal traffic violations, MVD is required to:'
  choices:
    A: Revoke your driver license permanently
    B: Prohibit the renewal of any vehicle registrations with you as an owner
    C: Impound your primary vehicle for 30 days
    D: Require you to retake the written and road driving tests
  answer: B
  explanation: MVD is required to update the person's record to prohibit the renewal
    of any vehicle registrations with that person as an owner if they are delinquent
    paying fines or penalties for traffic violations.
- id: 213
  category: alcohol_drugs_health
  question: If you are under 18 and use false identification to obtain a nitrous oxide
    container, your driving privilege will be suspended for how long on your first
    offense?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: B
  explanation: For unlawful use of false identification to obtain nitrous oxide if
    you are under 18, the first offense penalty is a 6-month suspension of your driving
    privilege.
- id: 214
  category: alcohol_drugs_health
  question: You will lose your driving privilege on the spot if you are stopped for
    DUI and a test shows you have an alcohol concentration of at least what percentage
    (in a non-commercial vehicle)?
  choices:
    A: 0.02 percent
    B: 0.04 percent
    C: 0.08 percent
    D: 0.15 percent
  answer: C
  explanation: If you are stopped for driving under the influence and a test shows
    that you have an alcohol concentration of 0.08 percent or more (0.04 in a commercial
    vehicle), you will lose your driving privilege on the spot.
- id: 215
  category: alcohol_drugs_health
  question: 'If you are under 21 years old, your license may be suspended if your
    alcohol concentration is:'
  choices:
    A: 0.02 percent or higher
    B: 0.04 percent or higher
    C: 0.08 percent or higher
    D: Any alcohol concentration
  answer: D
  explanation: 'The manual states: "If you are under 21, your license may be suspended
    if there is any alcohol concentration."'
- id: 216
  category: alcohol_drugs_health
  question: What is the minimum jail time for a first-offense standard DUI?
  choices:
    A: 24 hours
    B: 10 consecutive days
    C: 30 consecutive days
    D: 90 consecutive days
  answer: B
  explanation: For a first offense DUI, you will be jailed for not less than 10 consecutive
    days, your driver license will be suspended for not less than 90 days, and you
    will be assessed a fine of not less than $1,250.
- id: 217
  category: alcohol_drugs_health
  question: 'The "Extreme DUI" category applies to a person with an alcohol concentration
    of at least:'
  choices:
    A: '0.08'
    B: '0.10'
    C: '0.15'
    D: '0.20'
  answer: C
  explanation: The manual defines Extreme DUI as applying to a person with an alcohol
    concentration of 0.15 or higher.
- id: 218
  category: alcohol_drugs_health
  question: 'If you are convicted of a first-offense Extreme DUI and your alcohol
    concentration is 0.20 or higher, you will be jailed for not less than:'
  choices:
    A: 10 days
    B: 30 days
    C: 45 days
    D: 90 days
  answer: C
  explanation: Under first offense Extreme DUI, if the alcohol concentration is 0.20
    or higher, you will be jailed not less than 45 days and will not be eligible for
    a suspended sentence.
- id: 219
  category: penalties_and_points
  question: Which of the following circumstances elevates a standard DUI to an Aggravated
    DUI?
  choices:
    A: Committing a DUI while a person under 15 is in the vehicle.
    B: Committing a first-time DUI with a blood alcohol concentration of 0.08.
    C: Committing a DUI while driving a commercial vehicle.
    D: Committing a second DUI within 10 years.
  answer: A
  explanation: According to the manual, the Aggravated DUI category applies to a person
    who commits a DUI while their driving privilege is suspended or revoked, commits
    a third DUI in 7 years, or commits a DUI while a person under 15 is in the vehicle.
- id: 220
  category: penalties_and_points
  question: What is the maximum prison sentence for an Aggravated DUI conviction?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: For an Aggravated DUI, you will be sent to prison for not more than
    2 years and your license will be revoked for 1 year.
- id: 221
  category: penalties_and_points
  question: How does a Certified Ignition Interlock Device function in a vehicle?
  choices:
    A: It automatically applies the brakes if the driver falls asleep.
    B: It requires the driver to blow into it before turning the ignition and at random
      intervals while driving.
    C: It limits the maximum speed of the vehicle to 45 mph.
    D: It notifies law enforcement immediately if the vehicle exceeds the speed limit.
  answer: B
  explanation: A Certified Ignition Interlock Device is a breath alcohol testing instrument.
    The driver blows into the device before attempting to turn the ignition, and must
    also blow into the device at random intervals while the vehicle is in operation.
- id: 222
  category: defensive_driving
  question: What should you do first if you experience a tire blowout while driving?
  choices:
    A: Slam on the brakes immediately to stop the vehicle.
    B: Hold the steering wheel tightly and keep your vehicle going straight.
    C: Turn the steering wheel sharply toward the shoulder of the road.
    D: Accelerate slightly to maintain control of the vehicle.
  answer: B
  explanation: If a tire blowout occurs, you should hold the steering wheel tightly
    and keep your vehicle going straight, ease off the gas pedal, and do not apply
    the brakes until the vehicle has almost stopped.
- id: 223
  category: safe_driving_rules
  question: What should you NEVER use to put out a vehicle fire if gasoline is burning?
  choices:
    A: An ABC rated dry chemical extinguisher
    B: A heavy blanket
    C: Sand
    D: Water
  answer: D
  explanation: 'The manual states: ''Do not use water if gasoline is burning since
    this will spread the flames.'''
- id: 224
  category: vehicle_information
  question: If steam is coming from under your hood, why should you avoid opening
    the radiator cap?
  choices:
    A: It will cause the engine block to crack.
    B: It will flood the engine with coolant.
    C: Steam may escape and cause severe burns.
    D: It will permanently damage the radiator.
  answer: C
  explanation: If your cooling system has overheated, you should raise the hood but
    do not open the radiator cap because opening it while the engine is hot may allow
    steam to escape and cause severe burns.
- id: 225
  category: defensive_driving
  question: 'If your engine dies as you pull around a corner, causing power steering
    failure, you should:'
  choices:
    A: Let go of the steering wheel and apply the emergency brake.
    B: Firmly grip the steering wheel with both hands to complete the turn.
    C: Shift into reverse to restart the engine.
    D: Pump the gas pedal rapidly.
  answer: B
  explanation: In the event of power steering failure, you should firmly grip the
    steering wheel with both hands to complete the turn and move to the right side
    of the road.
- id: 226
  category: defensive_driving
  question: Which of the following is a recommended first step if your headlights
    fail while driving?
  choices:
    A: Try the high beam/low beam switch.
    B: Close your eyes and brake hard.
    C: Turn off the ignition and coast to a stop.
    D: Steer into the oncoming lane to use their headlights.
  answer: A
  explanation: If you experience headlight failure, the first recommended step is
    to try the high beam/low beam switch, as this may restore normal function.
- id: 227
  category: defensive_driving
  question: If your vehicle does NOT have anti-lock brakes (ABS) and your brakes fail,
    what should you do first?
  choices:
    A: Press and hold the brake pedal to the floor.
    B: Pump the brakes rapidly to build up pressure.
    C: Immediately pull the parking brake as hard as possible.
    D: Shift into the highest gear available.
  answer: B
  explanation: If a vehicle does not have anti-lock brakes and the brakes fail, you
    should pump the brakes rapidly. This may build up enough pressure to stop your
    vehicle.
- id: 228
  category: defensive_driving
  question: If you are stopped at a traffic light and a rear-end crash from an approaching
    vehicle is unavoidable, how can you lessen the impact?
  choices:
    A: Press hard on the brake pedal and lean forward.
    B: Brace yourself between the steering wheel and the back of the seat and release
      your brake an instant before impact.
    C: Unbuckle your seatbelt and lie down across the front seats.
    D: Turn your steering wheel sharply to the left.
  answer: B
  explanation: If a rear-end crash cannot be avoided, brace yourself between the steering
    wheel and the back of the seat and release your brake an instant before impact
    to help lessen the impact.
- id: 229
  category: defensive_driving
  question: If you are in danger of a potential head-on crash, which action is recommended?
  choices:
    A: Speed up to get past the oncoming vehicle quickly.
    B: Head for the shoulder and get off of the road away from the oncoming driver.
    C: Steer into the oncoming lane to avoid the driver.
    D: Turn off your headlights so the other driver isn't blinded.
  answer: B
  explanation: To avoid a potential head-on crash, you should reduce your speed, flash
    your headlights, use your horn, and head for the shoulder to get off of the road
    away from the oncoming driver.
- id: 230
  category: defensive_driving
  question: When driving on a two-lane street with oncoming cars to your left and
    a child riding a bike to your right, what is the correct defensive driving compromise?
  choices:
    A: Move closer to the child to give the oncoming cars more room.
    B: Stop the vehicle completely until the child passes.
    C: Move closer to the center line to create a larger space cushion to the right.
    D: Honk your horn continuously until the child moves off the road.
  answer: C
  explanation: When compromising between risks, give the most room to the greatest
    or most likely danger. The child is most likely to move suddenly, so moving closer
    to the center line provides a larger space cushion to the right.
- id: 231
  category: defensive_driving
  question: What is the correct steering technique to recover from a skid?
  choices:
    A: Keep the steering wheel perfectly straight.
    B: Turn the wheel quickly in the opposite direction of the skid.
    C: Turn the wheel quickly in the direction you want your vehicle to follow.
    D: Lock the steering wheel and apply the parking brake.
  answer: C
  explanation: To recover from a skid, turn the wheel quickly in the direction you
    want your vehicle to follow (in the direction of the skid), and as the car straightens
    out, turn it back the other way.
- id: 232
  category: license_system
  question: What is the primary function of the Executive Hearing Office?
  choices:
    A: To issue new driver licenses to out-of-state residents.
    B: To conduct hearings for individuals or businesses contesting an Order issued
      by MVD.
    C: To inspect vehicles for safety and emissions compliance.
    D: To collect fines for parking violations.
  answer: B
  explanation: The Executive Hearing Office conducts hearings which have been requested
    by individuals or businesses contesting an Order issued by MVD, most often involving
    an appeal to a license suspension or revocation.
- id: 233
  category: defensive_driving
  question: Why can swerving to avoid debris on the roadway be dangerous?
  choices:
    A: It is illegal to change lanes without a turn signal.
    B: It can cause the driver to lose control of the vehicle and leave the roadway.
    C: It will automatically trigger the vehicle's anti-lock braking system.
    D: It causes the tires to overheat and blow out.
  answer: B
  explanation: The manual notes that a common crash related to debris is a driver
    swerving to avoid the hazard, losing control of their vehicle, and leaving the
    roadway. In some cases, driving over the debris is safer.
- id: 234
  category: defensive_driving
  question: What is a common cause of crashes related to debris on the roadway?
  choices:
    A: Driving directly over the debris
    B: Swerving to avoid the hazard and losing control
    C: Honking the horn to warn other drivers
    D: Stopping completely in the middle of the travel lane
  answer: B
  explanation: According to the manual, a common crash related to debris is a driver
    swerving to avoid the hazard, losing control of their vehicle, and leaving the
    roadway.
- id: 235
  category: defensive_driving
  question: What should you do if you see an animal near the road that is not yet
    on the roadway?
  choices:
    A: Sound your horn loudly to scare it away
    B: Flash your high beams repeatedly
    C: Do not sound your horn, as it may startle the animal
    D: Swerve into the opposite lane to give it extra space
  answer: C
  explanation: The manual states that if the animal is not yet on the road, you should
    not sound your horn, as that may startle the animal and cause it to run out in
    front of you.
- id: 236
  category: driver_responsibility
  question: Which of the following pieces of information are you NOT required to exchange
    with other drivers after a crash?
  choices:
    A: Driver License number
    B: Social Security number
    C: Insurance company name and policy number
    D: License plate numbers
  answer: B
  explanation: After a crash, you should provide your Driver License number, name
    and address, insurance information, witness information, and license plate numbers.
    A Social Security number is not required.
- id: 237
  category: driver_responsibility
  question: If you are one of the first people to come upon the scene of a crash,
    what is one of the actions you should take?
  choices:
    A: Stand in the traffic lanes to direct approaching vehicles
    B: Turn off the ignition of the vehicles involved in the crash
    C: Immediately pull injured passengers out of their vehicles
    D: Leave the scene to find a police officer
  answer: B
  explanation: If you are first on the scene, you should pull off the road, turn on
    hazard flashers, turn off the ignition of involved vehicles, call 911, and avoid
    standing in traffic lanes.
- id: 238
  category: safe_driving_rules
  question: Under state law, what must you do if you are involved in a minor crash
    without injuries and your vehicle is safely operable?
  choices:
    A: Leave the vehicle exactly where it is until police arrive
    B: Remove the vehicle from the roadway
    C: Wait for a tow truck to move the vehicle
    D: Drive home and report the crash the next day
  answer: B
  explanation: State law requires a driver involved in a minor crash without injuries
    to remove a vehicle from the roadway if it is operable and can be moved safely.
- id: 239
  category: penalties_and_points
  question: What is the penalty for failing to stop at the scene of a crash involving
    only damage to a vehicle?
  choices:
    A: Driving privilege suspended for 6 months
    B: Driving privilege suspended for 1 year
    C: Driving privilege revoked for 3 years
    D: Driving privilege revoked for 5 years
  answer: B
  explanation: Conviction for failure to stop will result in your driving privilege
    being suspended for 1 year if the crash involves only damage to a vehicle.
- id: 240
  category: penalties_and_points
  question: 'If you fail to stop at the scene of a crash that involves a death, your
    driving privilege will be revoked for:'
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: 10 years, not including time incarcerated
  answer: D
  explanation: Failure to stop at a crash involving a death will result in your driving
    privilege being revoked for 10 years, not including the time you are incarcerated.
- id: 241
  category: safe_driving_rules
  question: When pulled over by law enforcement at night, what should you do to assist
    with visibility?
  choices:
    A: Turn on your high beam headlights
    B: Turn on your interior lights
    C: Turn off all lights on the vehicle
    D: Step out of the vehicle with a flashlight
  answer: B
  explanation: During a traffic stop at night, you should turn on your interior lights
    to assist with visibility.
- id: 242
  category: driver_responsibility
  question: During a traffic stop, when should you reach for your driver's license
    and vehicle documents?
  choices:
    A: As soon as you pull over, before the officer approaches
    B: While the officer is walking up to your window
    C: Only after waiting for the officer's instructions
    D: Only if the officer threatens to arrest you
  answer: C
  explanation: You should wait for the officer's instructions before reaching for
    your driver's license or vehicle documents.
- id: 243
  category: driver_responsibility
  question: What should you do if you have a weapon in the vehicle during a traffic
    stop?
  choices:
    A: Hide it under the seat before the officer approaches
    B: Hand it to the officer immediately
    C: Let the officer know upon first contact
    D: Keep quiet about it unless the officer searches the car
  answer: C
  explanation: When the officer approaches the vehicle, remember to let the officer
    know if you have a weapon in the vehicle upon first contact.
- id: 244
  category: penalties_and_points
  question: What may happen if you refuse to sign a traffic ticket?
  choices:
    A: The ticket will be automatically dismissed
    B: You will be issued a warning instead
    C: It may result in your arrest
    D: Your license will be immediately revoked for 1 year
  answer: C
  explanation: Your acceptance and signature on a traffic ticket is not an admission
    of guilt. However, the refusal to sign a traffic ticket may result in your arrest.
- id: 245
  category: driver_responsibility
  question: If you disagree with a police officer's decision to issue a traffic ticket,
    what is the recommended course of action?
  choices:
    A: Argue with the officer to prolong the contact
    B: Refuse to sign the ticket
    C: Seek to contest the decision in court through established legal channels
    D: Drive away while the officer is writing the ticket
  answer: C
  explanation: If you disagree with the officer's decision, do not prolong the contact
    by arguing. Rather, you may seek to contest the decision in court through established
    legal channels.
- id: 246
  category: safe_driving_rules
  question: 'If you move a motor vehicle from the main traveled portion of the roadway
    before law enforcement arrives after a minor crash, you:'
  choices:
    A: Will be held fully liable for the crash
    B: Shall not be held liable or at fault based solely on the fact the vehicle was
      moved
    C: Will be cited for tampering with evidence
    D: Must pay for the other driver's towing fees
  answer: B
  explanation: Any person who removes a motor vehicle from the main traveled portion
    of the roadway prior to the arrival of law enforcement shall not be held liable
    or at fault for the crash based solely on the fact the vehicle was moved.
- id: 247
  category: penalties_and_points
  question: 'Failing to stop at a crash scene involving an injury (other than death
    or serious physical injury) will result in your driving privilege being:'
  choices:
    A: Suspended for 1 year
    B: Revoked for 3 years
    C: Revoked for 5 years
    D: Revoked for 10 years
  answer: B
  explanation: Conviction for failure to stop will result in your driving privilege
    being revoked for 3 years if involving injury other than death or serious physical
    injury.
- id: 248
  category: vehicle_information
  question: Which of the following is recommended by the manual to be included in
    your vehicle's emergency kit?
  choices:
    A: A spare steering wheel
    B: Jumper cables
    C: A portable television
    D: Extra license plates
  answer: B
  explanation: The manual lists several items to consider packing in an emergency
    kit, including jumper cables, a flashlight, first aid kit, and blankets.
- id: 249
  category: vehicle_information
  question: According to the manual, which of the following items is recommended to
    have in your vehicle?
  choices:
    A: Flares
    B: Traffic cones
    C: A portable generator
    D: A sleeping bag
  answer: A
  explanation: The manual lists "Flares" among the recommended items to carry in your
    vehicle.
- id: 250
  category: vehicle_information
  question: Which of the following is listed as a recommended item for your vehicle?
  choices:
    A: Antifreeze
    B: Jumper cables
    C: Brake fluid
    D: Power steering fluid
  answer: B
  explanation: '"Jumper cables" are explicitly listed in the manual''s recommended
    items.'
- id: 251
  category: vehicle_information
  question: What type of vehicle fluid is specifically listed as a recommended item
    to carry?
  choices:
    A: Transmission fluid
    B: Windshield washer fluid
    C: Motor oil
    D: Coolant
  answer: C
  explanation: The manual specifically lists "Motor oil" as an item to carry.
- id: 252
  category: vehicle_information
  question: Along with a jack and a spare tire, what other tool is specifically grouped
    with them in the manual's list?
  choices:
    A: Tire pressure gauge
    B: Lug wrench
    C: Air compressor
    D: Tire patch kit
  answer: B
  explanation: The manual lists "Jack, lug wrench and spare tire" together.
- id: 253
  category: vehicle_information
  question: Which of the following are listed as examples of hand tools you should
    carry?
  choices:
    A: Hammer, saw, and drill
    B: Mallet, chisel, and file
    C: Socket set, ratchet, and hex keys
    D: Screwdriver, pliers, and wrenches
  answer: D
  explanation: The manual specifies "Hand tools (screwdriver, pliers, wrenches)".
- id: 254
  category: vehicle_information
  question: Which type of cleaning item is recommended to be kept in your vehicle?
  choices:
    A: Paper towels
    B: Absorbent cloths
    C: Sponges
    D: Chamois leather
  answer: B
  explanation: The manual lists "Absorbent cloths" as a recommended item.
- id: 255
  category: vehicle_information
  question: What writing materials are recommended to be kept in your vehicle?
  choices:
    A: Note pad and pencil
    B: Clipboard and pen
    C: Tablet and stylus
    D: Chalkboard and chalk
  answer: A
  explanation: The manual recommends carrying a "Note pad and pencil".
- id: 256
  category: license_system
  question: Which division of the Arizona Department of Transportation published this
    manual?
  choices:
    A: Highway Patrol Division
    B: Motor Vehicle Division
    C: Traffic Safety Division
    D: Driver Services Division
  answer: B
  explanation: The text indicates it is from the "Arizona Department of Transportation
    Motor Vehicle Division".
- id: 257
  category: license_system
  question: What is the official website provided for the Arizona Department of Transportation
    Motor Vehicle Division?
  choices:
    A: azmvd.gov
    B: adot.state.az.us
    C: arizona.gov/mvd
    D: azdot.gov
  answer: D
  explanation: The website listed in the manual text is "azdot.gov".
- id: 258
  category: vehicle_information
  question: The manual lists recommended items for an emergency kit. Which of the
    following is NOT on that list?
  choices:
    A: Flares
    B: Tire pressure gauge
    C: Jumper cables
    D: Fire extinguisher
  answer: B
  explanation: The manual's emergency kit list includes flares, jumper cables, and
    a fire extinguisher, but does not mention a tire pressure gauge. (p. 74)
- id: 259
  category: vehicle_information
  question: Which of the following items is NOT included in the manual's list of recommended
    hand tools?
  choices:
    A: Screwdriver
    B: Pliers
    C: Hammer
    D: Wrenches
  answer: C
  explanation: The manual lists hand tools as "(screwdriver, pliers, wrenches)". A
    hammer is not included.
- id: 260
  category: vehicle_information
  question: What item is necessary to carry alongside a jack and lug wrench to handle
    a flat tire, according to the manual?
  choices:
    A: Tire sealant
    B: Air pump
    C: Spare tire
    D: Tire blocks
  answer: C
  explanation: The manual groups the "Jack, lug wrench and spare tire" together.
- id: 261
  category: vehicle_information
  question: The items listed in this section, such as flares, jumper cables, and a
    jack, are generally recommended for what purpose?
  choices:
    A: Routine vehicle maintenance
    B: Passing a vehicle inspection
    C: Vehicle emergencies and basic repairs
    D: Enhancing vehicle performance
  answer: C
  explanation: Items like flares, jumper cables, a jack, and a spare tire are standard
    components of a vehicle emergency and basic repair kit.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 262
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 263
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 264
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 265
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 266
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 267
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 268
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 269
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A black and white NO PASSING ZONE pennant-shaped sign means you are
    not allowed to pass other vehicles in this area. It marks the beginning of a no-passing
    zone.
  id: 270
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 271
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 272
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 273
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 274
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 275
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 276
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 277
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 278
- image: sharp_turn_right.png
