questions:
- id: 1
  category: license_system
  question: En Arizona, ¿cuál es la edad mínima que debe cumplir una persona para
    solicitar un permiso de instrucción?
  choices:
    A: 15 años
    B: 15 años y 6 meses
    C: 16 años
    D: 14 años y 9 meses
  answer: B
  explanation: De acuerdo con el Manual de Licencia de Conducir de Arizona, un solicitante
    debe tener al menos 15 años y 6 meses de edad para ser elegible para un permiso
    de instrucción.
- id: 2
  category: license_system
  question: Bajo el programa de Licencia de Conducir Graduada (Clase G) de Arizona,
    durante los primeros seis meses, ¿cuántos pasajeros menores de 18 años que no
    sean hermanos tiene restringido llevar un conductor?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Durante los primeros seis meses de una licencia Clase G, el conductor
    no puede llevar a más de un pasajero menor de 18 años, a menos que sean hermanos
    o que el conductor esté acompañado por un padre o tutor legal.
- id: 3
  category: license_system
  question: Durante los primeros seis meses de tener una licencia Clase G de Arizona,
    ¿en qué horario tiene prohibido conducir un conductor adolescente a menos que
    se aplique una excepción?
  choices:
    A: 10:00 PM a 4:00 AM
    B: 11:00 PM a 5:00 AM
    C: Medianoche a 5:00 AM
    D: 9:00 PM a 6:00 AM
  answer: C
  explanation: La ley de Arizona restringe a los titulares de licencias Clase G de
    conducir entre la medianoche y las 5:00 AM durante los primeros seis meses, a
    menos que conduzcan hacia o desde la escuela, el trabajo, un evento religioso
    o una emergencia.
- id: 4
  category: license_system
  question: Si cambia su nombre o dirección, la ley de Arizona le exige notificar
    al MVD (División de Vehículos Motorizados) en un plazo de ¿cuántos días?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: A
  explanation: La ley de Arizona exige que todos los titulares de licencias notifiquen
    a la División de Vehículos Motorizados (MVD) cualquier cambio de nombre o dirección
    en un plazo de 10 días.
- id: 5
  category: license_system
  question: Para calificar para una licencia Clase G de Arizona, ¿cuántas horas de
    práctica de manejo supervisada debe haber completado el titular de un permiso?
  choices:
    A: 20 horas (5 de noche)
    B: 30 horas (10 de noche)
    C: 40 horas (15 de noche)
    D: 50 horas (10 de noche)
  answer: B
  explanation: Los solicitantes de una licencia Clase G deben certificar que han completado
    al menos 30 horas de práctica de manejo, incluyendo al menos 10 horas de noche.
- id: 6
  category: license_system
  question: ¿Cuál es el requisito mínimo de visión, con o sin lentes correctivos,
    para obtener una licencia de conducir de Arizona sin restricciones?
  choices:
    A: 20/20 en ambos ojos
    B: 20/30 en al menos un ojo
    C: 20/40 en al menos un ojo
    D: 20/50 en ambos ojos
  answer: C
  explanation: Arizona requiere una visión mínima de 20/40 en al menos un ojo para
    una licencia sin restricciones. Si necesita anteojos o lentes de contacto para
    lograr esto, se colocará una restricción en su licencia.
- id: 7
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de instrucción de Arizona?
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: B
  explanation: Un permiso de instrucción de Arizona es válido por 12 meses a partir
    de la fecha de emisión.
- id: 8
  category: license_system
  question: En Arizona, ¿la acumulación de cuántos puntos en un período de 12 meses
    puede resultar en el requisito de asistir a la Escuela de Supervivencia de Tráfico
    (TSS)?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: Si acumula 8 o más puntos en su historial de manejo en un período de
    12 meses, es posible que se le requiera asistir a la Escuela de Supervivencia
    de Tráfico (Traffic Survival School) o enfrentar la suspensión de su licencia.
- id: 9
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que una persona acompañe
    al titular de un permiso de instrucción de Arizona mientras conduce?
  choices:
    A: Debe tener al menos 18 años de edad
    B: Debe tener al menos 21 años de edad y poseer una licencia válida
    C: Debe ser el padre o tutor legal
    D: Debe tener al menos 5 años de experiencia de manejo
  answer: B
  explanation: La persona que acompaña al titular de un permiso debe tener al menos
    21 años de edad, poseer una licencia de conducir válida y ocupar el asiento al
    lado del conductor.
- id: 10
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    para un vehículo motorizado en Arizona?
  choices:
    A: $15,000/$30,000/$10,000
    B: $20,000/$40,000/$15,000
    C: $25,000/$50,000/$15,000
    D: $50,000/$100,000/$25,000
  answer: C
  explanation: La ley de Arizona exige una cobertura mínima de responsabilidad civil
    de $25,000 por lesiones corporales a una persona, $50,000 por lesiones corporales
    a dos o más personas y $15,000 por daños a la propiedad.
- id: 11
  category: license_system
  question: ¿Qué sanción enfrentará una persona menor de 18 años que sea condenada
    por su primera infracción de tránsito en Arizona?
  choices:
    A: Suspensión obligatoria de 30 días
    B: Asistencia obligatoria a la Escuela de Supervivencia de Tráfico (Traffic Survival
      School)
    C: Revocación permanente de la licencia
    D: Una multa de $500
  answer: B
  explanation: Para los conductores menores de 18 años, la primera condena por una
    infracción de tránsito requiere la asistencia obligatoria a la Escuela de Supervivencia
    de Tráfico (TSS).
- id: 12
  category: license_system
  question: ¿Cuál es la diferencia principal entre una 'Travel ID' de Arizona y una
    licencia de conducir estándar de Arizona?
  choices:
    A: La Travel ID le permite conducir en otros países
    B: La Travel ID cumple con la ley REAL ID para fines federales, como la seguridad
      en los aeropuertos
    C: La Travel ID es solo para personas mayores de 21 años
    D: La licencia estándar no es válida para conducir fuera de Arizona
  answer: B
  explanation: La Travel ID de Arizona es la versión estatal de la ley federal REAL
    ID, que será necesaria para abordar vuelos nacionales e ingresar a edificios federales
    a partir de mayo de 2025.
- id: 13
  category: license_system
  question: En Arizona, ¿qué tipo de licencia se considera una licencia 'Clase D'?
  choices:
    A: Licencia de conducir comercial (CDL)
    B: Licencia de motocicleta
    C: Licencia de operador
    D: Licencia graduada (GDL)
  answer: C
  explanation: Una licencia Clase D es la licencia de operador estándar para personas
    de 18 años o más en Arizona.
- id: 14
  category: license_system
  question: ¿Cuánto tiempo debe tener un adolescente un permiso de instrucción de
    Arizona antes de poder solicitar una licencia Clase G?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Un solicitante debe tener un permiso de instrucción de Arizona durante
    al menos seis meses antes de ser elegible para solicitar una licencia de conducir
    Clase G (graduada).
- id: 15
  category: license_system
  question: Si usted no es residente, como un estudiante o un miembro de las fuerzas
    armadas estacionado en Arizona, ¿cuándo se le requiere obtener una licencia de
    conducir de Arizona?
  choices:
    A: Después de 30 días de residencia
    B: Inmediatamente al ingresar al estado
    C: Cuando se convierta en residente de Arizona o acepte un empleo en el estado
    D: Solo si su licencia de otro estado expira
  answer: C
  explanation: Debe obtener una licencia de Arizona si se convierte en residente,
    lo que incluye trabajar en Arizona (que no sea trabajo agrícola de temporada)
    o permanecer en Arizona durante 7 meses o más en un año calendario.
- id: 16
  category: license_system
  question: En Arizona, ¿hasta qué edad es generalmente válida una licencia de conducir
    estándar Clase D?
  choices:
    A: 50 años de edad
    B: 60 años de edad
    C: 65 años de edad
    D: 70 años de edad
  answer: C
  explanation: Arizona es único en el sentido de que las licencias estándar Clase
    D y Clase G son válidas hasta que el conductor cumple 65 años. Sin embargo, se
    requiere una nueva fotografía y un examen de la vista cada 12 años.
- id: 17
  category: license_system
  question: 'Aunque una licencia de Arizona puede no expirar hasta los 65 años, los
    conductores deben visitar una oficina del MVD para actualizar su foto y someterse
    a un examen de la vista cada:'
  choices:
    A: 5 años
    B: 8 años
    C: 10 años
    D: 12 años
  answer: D
  explanation: La ley de Arizona exige que los conductores actualicen la foto de su
    licencia y se realicen un examen de la vista cada 12 años para garantizar que
    la identificación se mantenga vigente.
- id: 18
  category: license_system
  question: 'Bajo la ley de Consentimiento Implícito de Arizona, si es arrestado por
    DUI y se niega a someterse a una prueba de aliento, sangre u orina, su privilegio
    de conducir será suspendido por al menos:'
  choices:
    A: 90 días
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: C
  explanation: Según el Manual de Licencia de Conducir de Arizona, la negativa a someterse
    a una prueba química bajo la ley de Consentimiento Implícito resulta en una suspensión
    de 12 meses de los privilegios de conducir (o 24 meses por una segunda negativa
    dentro de un periodo de 84 meses).
- id: 19
  category: license_system
  question: ¿Cuántos puntos se asignan al historial de conducción de Arizona por una
    condena de 'Conducción Agresiva'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: D
  explanation: La conducción agresiva y el DUI son infracciones de alto puntaje en
    Arizona, y cada una resulta en la adición de 8 puntos al historial del conductor.
- id: 20
  category: license_system
  question: En Arizona, si es condenado por 'Abandonar la escena de un accidente',
    ¿cuántos puntos se añadirán a su historial de conducción?
  choices:
    A: 3 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: Abandonar la escena de un accidente (choque y fuga) es una infracción
    grave que resulta en 6 puntos en el historial de conducción de Arizona.
- id: 21
  category: license_system
  question: Para una licencia estándar de Arizona, ¿cuál es el monto mínimo requerido
    de cobertura de seguro de responsabilidad civil por lesiones corporales a dos
    o más personas en cualquier accidente?
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $75,000
  answer: C
  explanation: La ley de Arizona exige límites mínimos de responsabilidad de $25,000
    por lesiones corporales a una persona, $50,000 por lesiones corporales a dos o
    más personas y $15,000 por daños a la propiedad.
- id: 22
  category: license_system
  question: 'A diferencia de la licencia estándar de Arizona que dura hasta los 65
    años, la ''Travel ID'' de Arizona (que cumple con la ley REAL ID) debe renovarse
    cada:'
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 12 años
  answer: C
  explanation: La Travel ID de Arizona es válida por un máximo de 8 años, lo cual
    difiere del vencimiento de la licencia estándar a los 65 años.
- id: 23
  category: license_system
  question: En Arizona, ¿una condena por 'Conducción Temeraria' (Reckless Driving)
    resulta en cuántos puntos en su historial de manejo?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: D
  explanation: La conducción temeraria se considera una infracción mayor en Arizona
    y conlleva una penalización de 8 puntos.
- id: 24
  category: license_system
  question: Si su privilegio de conducir en Arizona es suspendido, ¿cuál es la tarifa
    estándar requerida para 'restablecer' (reinstate) la licencia (además de cualquier
    tarifa de solicitud)?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: A
  explanation: Para restablecer una licencia suspendida en Arizona, el conductor normalmente
    debe pagar una tarifa de restablecimiento de $10 más la tarifa de solicitud correspondiente
    a su grupo de edad.
- id: 25
  category: license_system
  question: ¿Cuántos puntos se asignan en un historial de manejo de Arizona por no
    detenerse ante un autobús escolar que tiene sus luces rojas parpadeando y el brazo
    de parada extendido?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: No detenerse ante un autobús escolar es una infracción de seguridad
    grave en Arizona y resulta en 6 puntos en el historial del conductor.
- id: 26
  category: license_system
  question: 'Según la ley de Arizona, si un solicitante masculino tiene entre 18 y
    26 años, solicitar una licencia de conducir automáticamente:'
  choices:
    A: Lo inscribe en la milicia estatal
    B: Lo registra en el Servicio Selectivo (Selective Service)
    C: Lo registra como donante de órganos
    D: Lo inscribe para el servicio de jurado
  answer: B
  explanation: La ley de Arizona exige que cualquier ciudadano o inmigrante masculino
    de entre 18 y 26 años que solicite una licencia o tarjeta de identificación sea
    registrado en el Sistema del Servicio Selectivo.
- id: 27
  category: license_system
  question: ¿Qué símbolo se coloca en una licencia de conducir de Arizona para indicar
    que la persona es donante de órganos y tejidos?
  choices:
    A: Una 'D' roja
    B: Una 'O' verde
    C: Un corazón rojo con la palabra 'DONOR'
    D: Una estrella azul
  answer: C
  explanation: Las licencias de Arizona utilizan un símbolo de corazón rojo con la
    palabra 'DONOR' para indicar que el titular se ha registrado como donante de órganos
    y tejidos.
- id: 28
  category: license_system
  question: 'Al solicitar una licencia de conducir de Arizona, debe proporcionar su
    número de Seguro Social. Esto es requerido por:'
  choices:
    A: Solo la ley estatal de Arizona
    B: Solo la ley federal
    C: Tanto la ley estatal como la federal
    D: El Departamento de Seguridad Pública de Arizona
  answer: C
  explanation: Tanto la ley federal como la estatal de Arizona exigen la recopilación
    de los números de Seguro Social en las solicitudes de licencia de conducir para
    verificar la identidad y para la ejecución de la manutención infantil.
- id: 29
  category: license_system
  question: 'Si es condenado por ''No detenerse ante una señal de tráfico'' (pasarse
    un semáforo en rojo) en Arizona, y es su primera infracción, se le requerirá:'
  choices:
    A: Pagar una multa de $1,000
    B: Asistir a la Escuela de Supervivencia de Tráfico (TSS)
    C: Entregar su vehículo
    D: Cumplir 24 horas de cárcel
  answer: B
  explanation: En Arizona, una condena por no detenerse ante una señal de tráfico
    requiere que el conductor asista y complete con éxito la Escuela de Supervivencia
    de Tráfico (TSS - Traffic Survival School).
- id: 30
  category: driver_testing
  question: En Arizona, ¿cuál es el límite de concentración de alcohol en sangre (BAC)
    para un conductor menor de 21 años?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.02%
    D: 0.00% (Cualquier cantidad detectable)
  answer: D
  explanation: Arizona tiene una ley de 'tolerancia cero' para menores. Es ilegal
    que cualquier persona menor de 21 años conduzca o tenga el control físico de un
    vehículo con cualquier cantidad de licor espirituoso en su cuerpo.
- id: 31
  category: driver_testing
  question: Según la ley de Arizona, ¿una persona es culpable de 'DUI Extremo' (Extreme
    DUI) si su concentración de alcohol en la sangre (BAC) es igual o superior a qué
    nivel?
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: En Arizona, una condena por DUI Extremo se aplica a los conductores
    con un BAC de 0.15% o superior.
- id: 32
  category: driver_testing
  question: En Arizona, ¿cuál es el límite de velocidad en una zona escolar cuando
    las luces amarillas están parpadeando o hay señales publicadas?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad en una zona escolar marcada en Arizona es de
    15 mph, a menos que se indique lo contrario.
- id: 33
  category: driver_testing
  question: Al estacionar en una vía pública en Arizona, ¿a cuántos pies de un hidrante
    de incendios no se puede estacionar?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: La ley de Arizona prohíbe estacionar a menos de 15 pies de un hidrante
    de incendios.
- id: 34
  category: driver_testing
  question: Al rebasar una bicicleta que viaja en la misma dirección, ¿cuánta distancia
    mínima exige la ley de Arizona que dejen los automovilistas entre el vehículo
    y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La 'Ley de los tres pies' (Three-Foot Law) de Arizona exige que los
    automovilistas dejen al menos tres pies de espacio al rebasar a un ciclista.
- id: 35
  category: driver_testing
  question: ¿Qué exige la ley de 'Hacerse a un lado' (Move Over law) de Arizona que
    hagan los conductores al acercarse a un vehículo de emergencia estacionario con
    luces parpadeantes en una autopista de varios carriles?
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Moverse a un carril que no sea adyacente al vehículo de emergencia, si es seguro
      hacerlo
    C: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    D: Acelerar para pasar la escena lo más rápido posible
  answer: B
  explanation: La ley Move Over exige que los conductores se cambien a otro carril
    al pasar por vehículos de emergencia estacionarios. Si no es seguro cambiar de
    carril, el conductor debe reducir la velocidad y proceder con precaución.
- id: 36
  category: driver_testing
  question: En Arizona, ¿cuántos puntos se añaden a su historial de manejo por no
    detenerse ante una señal de tráfico (pasarse un semáforo en rojo)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: A
  explanation: No detenerse ante una señal de tráfico en Arizona resulta en 2 puntos
    en su historial de manejo y generalmente requiere la asistencia a una Escuela
    de Supervivencia de Tráfico (Traffic Survival School).
- id: 37
  category: driver_testing
  question: ¿A cuántos pies de una señal de alto está prohibido estacionar en Arizona?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Arizona prohíbe estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de alto, señal de ceda el paso o señal de control de
    tráfico ubicada al costado de la carretera.
- id: 38
  category: driver_testing
  question: ¿Por cuánto tiempo mínimo requiere una primera condena por DUI en Arizona
    la instalación de un dispositivo de interbloqueo de encendido (IID) certificado?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: C
  explanation: Incluso para un primer DUI regular, la ley de Arizona exige la instalación
    de un dispositivo de interbloqueo de encendido certificado durante al menos 12
    meses.
- id: 39
  category: driver_testing
  question: ¿Cuál es la distancia de seguimiento recomendada para la mayoría de las
    condiciones de manejo en Arizona para evitar seguir muy de cerca (tailgating)?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de Arizona recomienda la 'regla de los 3 segundos'
    para mantener una distancia de seguimiento segura en condiciones normales.
- id: 40
  category: driver_testing
  question: Al usar señales manuales para indicar un giro o una parada, ¿qué significa
    cuando el brazo del conductor está extendido hacia abajo?
  choices:
    A: Giro a la derecha
    B: Giro a la izquierda
    C: Parar o reducir la velocidad
    D: Giro en U
  answer: C
  explanation: Un brazo y una mano extendidos hacia abajo indican que el conductor
    se está deteniendo o disminuyendo la velocidad.
- id: 41
  category: driver_testing
  question: 'En Arizona, puede rebasar a otro vehículo por la derecha solo cuando:'
  choices:
    A: El vehículo de adelante está girando o está a punto de girar a la izquierda
      y hay un carril pavimentado
    B: Usted tiene prisa y el carril izquierdo se mueve demasiado lento
    C: El acotamiento de la carretera es lo suficientemente ancho para que quepa su
      auto
    D: Se encuentra en una carretera de dos carriles y doble sentido
  answer: A
  explanation: Rebasar por la derecha está permitido solo si el vehículo de adelante
    está girando a la izquierda y hay una parte pavimentada de la carretera disponible
    para rebasar sin salirse del pavimento.
- id: 42
  category: driver_testing
  question: Al conducir de noche, la ley de Arizona exige que atenúe sus luces altas
    cuando se encuentre a cuántos pies de un vehículo que viene en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Debe cambiar de luces altas a luces bajas cuando un vehículo que viene
    en sentido contrario se encuentre a menos de 500 pies.
- id: 43
  category: driver_testing
  question: Si sigue a otro vehículo de noche en Arizona, debe atenuar sus luces altas
    cuando se encuentre a cuántos pies del vehículo de adelante?
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 800 pies
  answer: B
  explanation: La ley de Arizona exige que atenúe sus luces altas cuando siga a otro
    vehículo a una distancia de 200 pies o menos.
- id: 44
  category: driver_testing
  question: Para aprobar el examen escrito de conocimientos de Arizona, ¿cuál es el
    número mínimo de preguntas que debe responder correctamente de un total de 30?
  choices:
    A: '21'
    B: '24'
    C: '26'
    D: '28'
  answer: B
  explanation: El examen de conocimientos de Arizona consta de 30 preguntas. La puntuación
    para aprobar es del 80 por ciento, lo que significa que debe responder correctamente
    al menos 24 preguntas.
- id: 45
  category: driver_testing
  question: En Arizona, ¿es ilegal estacionar su vehículo a menos de cuántos pies
    de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Arizona prohíbe estacionar a menos de 15 pies de un hidrante
    de incendios para garantizar el acceso de emergencia.
- id: 46
  category: driver_testing
  question: Al estacionar en una calle nivelada en Arizona, sus ruedas deben estar
    paralelas al bordillo (curb) y a no más de cuántas pulgadas del mismo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: La ley de Arizona exige que los vehículos estacionados en una calzada
    tengan sus ruedas derechas paralelas y a no más de 18 pulgadas del bordillo derecho.
- id: 47
  category: driver_testing
  question: La ley de Arizona de 'Hacerse a un lado' (Move Over) exige que los conductores
    se muevan a un carril no adyacente o reduzcan la velocidad al acercarse a qué
    tipo de vehículo estacionado con luces intermitentes?
  choices:
    A: Solo vehículos de policía y bomberos
    B: Solo ambulancias y grúas
    C: Cualquier vehículo con luces intermitentes, incluidos los vehículos de servicios
      públicos y de emergencia
    D: Solo autobuses escolares
  answer: C
  explanation: La ley Move Over de Arizona se aplica a cualquier vehículo estacionado
    con luces intermitentes, incluidos los servicios de emergencia, grúas y vehículos
    de servicios públicos.
- id: 48
  category: driver_testing
  question: Al rebasar una bicicleta que viaja en la misma dirección en Arizona, ¿cuál
    es la distancia mínima que un automovilista debe mantener entre el vehículo y
    la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Arizona (ARS 28-735) exige que los automovilistas dejen una
    distancia de seguridad no menor a tres pies al adelantar o rebasar una bicicleta.
- id: 49
  category: driver_testing
  question: 'Bajo la ley de ''Tolerancia Cero'' de Arizona, una persona menor de 21
    años puede ser condenada por DUI si su BAC es de al menos:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: Cualquier cantidad medible
  answer: D
  explanation: Arizona tiene una política de tolerancia cero para el consumo de alcohol
    y la conducción de menores de edad; cualquier cantidad medible de alcohol en una
    persona menor de 21 años puede dar lugar a un cargo de DUI.
- id: 50
  category: driver_testing
  question: 'En Arizona, una condena por no detenerse ante una luz roja resultará
    en 2 puntos en su historial y el requisito obligatorio de:'
  choices:
    A: Pagar una multa de $1,000
    B: Asistir a la Escuela de Supervivencia de Tráfico (TSS)
    C: Volver a tomar el examen de conducir
    D: Entregar su licencia por 30 días
  answer: B
  explanation: La ley de Arizona exige que los conductores condenados por una infracción
    de semáforo en rojo asistan a la Escuela de Supervivencia de Tráfico (TSS), además
    de los puntos evaluados.
- id: 51
  category: driver_testing
  question: Por una primera condena por DUI en Arizona, ¿por cuánto tiempo se requiere
    generalmente que un conductor use un dispositivo de interbloqueo de encendido
    certificado?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: C
  explanation: Una primera condena por DUI en Arizona generalmente requiere la instalación
    de un dispositivo de interbloqueo de encendido certificado durante al menos 12
    meses.
- id: 52
  category: driver_testing
  question: 'En Arizona, un cargo de "DUI Súper Extremo" se aplica a los conductores
    con un BAC de al menos:'
  choices:
    A: 0.15%
    B: 0.18%
    C: 0.20%
    D: 0.25%
  answer: C
  explanation: La ley de Arizona define un DUI Súper Extremo como la operación de
    un vehículo con una concentración de alcohol en sangre (BAC) de 0.20% o superior.
- id: 53
  category: driver_testing
  question: Al realizar el examen de manejo en Arizona, ¿cuál de los siguientes debe
    proporcionar para el vehículo que está utilizando?
  choices:
    A: Solo comprobante de seguro
    B: Solo registro válido
    C: Tanto el registro válido como el comprobante de seguro
    D: Una carta ante notario del propietario del vehículo
  answer: C
  explanation: Para realizar el examen de manejo en Arizona, el vehículo debe estar
    en condiciones seguras de funcionamiento y usted debe proporcionar un comprobante
    de seguro vigente y un registro válido.
- id: 54
  category: driver_testing
  question: ¿La ley de envase abierto de Arizona prohíbe la posesión de un envase
    abierto de licor espirituoso en qué parte del vehículo?
  choices:
    A: El compartimento de pasajeros
    B: El maletero (cajuela)
    C: El área detrás del último asiento vertical en un vehículo con puerta trasera
      (hatchback)
    D: Una guantera con llave
  answer: A
  explanation: La ley de Arizona prohíbe la posesión de un envase abierto de alcohol
    en el compartimento de pasajeros de un vehículo motorizado en cualquier carretera
    pública.
- id: 55
  category: driver_responsibility
  question: 'En Arizona, si usted está involucrado en un accidente de vehículo motorizado
    que resulta en lesiones o muerte, debe notificar inmediatamente a:'
  choices:
    A: El departamento de policía local, el alguacil (sheriff) o la patrulla de caminos
      del estado
    B: Solo a su compañía de seguros
    C: Al MVD dentro de los 30 días
    D: La Oficina del Gobernador para la Seguridad en las Carreteras
  answer: A
  explanation: La ley de Arizona exige que los conductores notifiquen de inmediato
    a la policía local, al alguacil del condado o a la oficina más cercana de la patrulla
    de caminos del estado si un accidente resulta en lesiones o muerte.
- id: 56
  category: driver_responsibility
  question: Cuando vende o transfiere un vehículo en Arizona, ¿dentro de cuántos días
    debe enviar un "Aviso de Venta" (Sold Notice) al MVD?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Según la ley de Arizona, se debe enviar un "Aviso de Venta" (Sold Notice)
    al MVD dentro de los 10 días posteriores a la venta o transferencia de un vehículo
    para proteger al vendedor de la responsabilidad por multas o accidentes que involucren
    al vehículo después de la venta.
- id: 57
  category: driver_responsibility
  question: En Arizona, ¿cuál es el umbral para un cargo de "DUI Extremo" para un
    conductor adulto?
  choices:
    A: 0.08% BAC
    B: 0.10% BAC
    C: 0.15% BAC
    D: 0.20% BAC
  answer: C
  explanation: En Arizona, una persona es culpable de "DUI Extremo" si su concentración
    de alcohol en sangre (BAC) es de 0.15% o superior.
- id: 58
  category: driver_responsibility
  question: 'Un "DUI Súper Extremo" en Arizona se define como conducir con una concentración
    de alcohol en sangre (BAC) de:'
  choices:
    A: 0.15% o superior
    B: 0.20% o superior
    C: 0.25% o superior
    D: 0.30% o superior
  answer: B
  explanation: La ley de Arizona clasifica un BAC de 0.20% o superior como un "DUI
    Súper Extremo", el cual conlleva sanciones significativamente más severas que
    un DUI estándar o Extremo.
- id: 59
  category: driver_responsibility
  question: ¿Cuál es la multa por una primera condena por no proporcionar prueba de
    responsabilidad financiera (seguro) vigente en Arizona?
  choices:
    A: Un mínimo de $100
    B: Un mínimo de $250
    C: Un mínimo de $500
    D: Un mínimo de $1,000
  answer: C
  explanation: Para una primera infracción por no proporcionar comprobante de seguro,
    la ley de Arizona exige una multa mínima de $500 y una suspensión de tres meses
    de los privilegios de conducir y del registro del vehículo.
- id: 60
  category: driver_responsibility
  question: 'Al comprar un vehículo a un particular en Arizona, el comprador debe
    solicitar una transferencia de título dentro de:'
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: B
  explanation: La ley de Arizona exige que el comprador de un vehículo solicite la
    transferencia del título y el registro dentro de los 15 días posteriores a la
    compra.
- id: 61
  category: driver_responsibility
  question: Para una primera condena por DUI estándar en Arizona, ¿cuál es la sentencia
    mínima obligatoria de cárcel?
  choices:
    A: 24 horas
    B: 48 horas
    C: 10 días consecutivos
    D: 30 días consecutivos
  answer: C
  explanation: Una primera condena por DUI (conducir bajo la influencia) estándar
    en Arizona conlleva un mínimo de 10 días consecutivos en la cárcel, aunque se
    pueden eximir 9 días tras completar un programa de evaluación y tratamiento de
    alcohol ordenado por el tribunal.
- id: 62
  category: driver_responsibility
  question: 'En Arizona, cualquier persona condenada por un DUI está obligada a equipar
    su vehículo con un dispositivo de interbloqueo de encendido certificado durante
    al menos:'
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: B
  explanation: La ley de Arizona exige que todos los conductores condenados por un
    DUI (incluyendo el DUI estándar por primera vez) utilicen un dispositivo de interbloqueo
    de encendido certificado durante al menos 12 meses.
- id: 63
  category: driver_responsibility
  question: ¿Qué prohíbe la ley de 'Envase Abierto' (Open Container) de Arizona?
  choices:
    A: Tener un envase de alcohol abierto en el maletero del coche
    B: Tener un envase de alcohol abierto en el compartimento de pasajeros de un vehículo
      motorizado en una vía pública
    C: Transportar alcohol sin abrir en el asiento trasero
    D: Beber agua mientras se conduce
  answer: B
  explanation: La ley de Arizona prohíbe la posesión de un envase abierto de licor
    espirituoso en el compartimento de pasajeros de un vehículo motorizado mientras
    se encuentre en cualquier vía pública.
- id: 64
  category: driver_responsibility
  question: ¿En qué áreas de Arizona se requiere generalmente la prueba de emisiones
    del vehículo para la renovación del registro del vehículo?
  choices:
    A: En todo el estado, en los 15 condados
    B: Solo en la ciudad de Flagstaff
    C: En las áreas metropolitanas de Phoenix (condado de Maricopa) y Tucson (condado
      de Pima)
    D: Solo para vehículos comerciales
  answer: C
  explanation: Se requiere la prueba de emisiones para la mayoría de los vehículos
    que se mantienen en las áreas metropolitanas de Phoenix y Tucson (específicamente
    en partes de los condados de Maricopa y Pima).
- id: 65
  category: driver_responsibility
  question: Bajo la ley 'Motor Voter', ¿qué pueden hacer los residentes de Arizona
    al solicitar o renovar una licencia de conducir?
  choices:
    A: Pagar sus impuestos sobre la propiedad
    B: Registrarse para votar
    C: Solicitar un pasaporte
    D: Renovar su licencia de caza
  answer: B
  explanation: La Ley Nacional de Registro de Votantes (Motor Voter) permite a los
    ciudadanos de Arizona que cumplen con los requisitos registrarse para votar o
    actualizar su registro de votante mientras solicitan o renuevan una licencia de
    conducir.
- id: 66
  category: driver_responsibility
  question: 'En Arizona, si usted tiene una condición médica que pueda afectar su
    capacidad para conducir de manera segura, es responsable de:'
  choices:
    A: Informarlo al MVD solo si tiene un accidente
    B: Nada, ya que los registros médicos son privados
    C: Informar la condición al Programa de Revisión Médica del MVD
    D: Dejar de conducir inmediatamente sin notificar a nadie
  answer: C
  explanation: Los conductores de Arizona tienen la responsabilidad legal de informar
    cualquier condición física o mental que pueda afectar su capacidad para operar
    un vehículo motorizado de manera segura al Programa de Revisión Médica del MVD.
- id: 67
  category: driver_responsibility
  question: 'Una primera condena por conducir sin evidencia de responsabilidad financiera
    vigente (seguro) en Arizona resulta en una sanción civil de al menos:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Para una primera infracción por no mantener o no proporcionar prueba
    de responsabilidad financiera, la ley de Arizona exige una multa mínima de $500
    y una suspensión de tres meses de los privilegios de conducir y del registro.
- id: 68
  category: driver_responsibility
  question: 'En Arizona, se considera que una persona ha cometido un ''DUI Extremo''
    si su concentración de alcohol en sangre (BAC) es igual o superior a:'
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: La ley de Arizona define un DUI Extremo como la operación de un vehículo
    con un BAC (concentración de alcohol en sangre) de 0.15% o superior.
- id: 69
  category: driver_responsibility
  question: 'Si usted choca contra un vehículo desatendido en Arizona y no puede localizar
    al propietario, debe:'
  choices:
    A: Esperar 30 minutos y luego irse si no aparece nadie.
    B: Dejar una nota en un lugar visible con su nombre, dirección e información del
      registro del vehículo.
    C: Informarlo a su compañía de seguros únicamente dentro de las 48 horas.
    D: Llamar a una grúa para que retire el otro vehículo.
  answer: B
  explanation: La ley de Arizona (ARS 28-664) le exige localizar al propietario o
    dejar un aviso por escrito con su información de contacto y el nombre/dirección
    del propietario del vehículo si este no es suyo.
- id: 70
  category: driver_responsibility
  question: Cuando las fuerzas del orden solicitan una prueba de responsabilidad financiera,
    ¿en qué formato pueden proporcionarla los conductores de Arizona?
  choices:
    A: Solo una tarjeta de identificación física en papel emitida por la aseguradora.
    B: Solo un documento original de la póliza de seguro.
    C: Ya sea una tarjeta de identificación física en papel o un dispositivo electrónico
      (teléfono inteligente) que muestre la imagen.
    D: Una confirmación verbal del número de póliza.
  answer: C
  explanation: La ley de Arizona permite a los conductores mostrar el comprobante
    de seguro en formato físico o electrónico, como en un teléfono inteligente.
- id: 71
  category: driver_responsibility
  question: Al convertirse en residente de Arizona, ¿cuánto tiempo tiene para registrar
    su vehículo de otro estado?
  choices:
    A: Inmediatamente
    B: 30 días
    C: 60 días
    D: 90 días
  answer: A
  explanation: La ley de Arizona exige que registre su vehículo inmediatamente al
    convertirse en residente o en el momento en que establezca su residencia.
- id: 72
  category: driver_responsibility
  question: Si su compañía de seguros cancela su póliza y usted no proporciona al
    MVD información sobre un nuevo seguro, ¿qué medida tomará el MVD?
  choices:
    A: Aumentarán la tarifa de registro de su vehículo.
    B: Suspenderán el registro de su vehículo.
    C: Emitirán una orden de arresto en su contra.
    D: No tomarán ninguna medida hasta que expire su registro.
  answer: B
  explanation: Si el MVD recibe un aviso de que una póliza ya no está activa, enviará
    un aviso de "falta de seguro". No proporcionar prueba de un nuevo seguro resultará
    en la suspensión del registro del vehículo.
- id: 73
  category: driver_responsibility
  question: 'En Arizona, la ley "Motor Voter" (Votante Motorizado) le permite:'
  choices:
    A: Votar por los funcionarios del MVD.
    B: Solicitar o actualizar su registro de votante al solicitar una licencia de
      conducir.
    C: Usar el registro de su vehículo como boleta electoral.
    D: Omitir el servicio de jurado si tiene un historial de manejo limpio.
  answer: B
  explanation: La Ley Nacional de Registro de Votantes (Motor Voter) permite a los
    residentes de Arizona registrarse para votar o actualizar su registro al mismo
    tiempo que solicitan o renuevan una licencia de conducir.
- id: 74
  category: driver_responsibility
  question: 'La ley de Arizona exige que los niños deben estar debidamente asegurados
    en un sistema de retención infantil (asiento de seguridad) si tienen:'
  choices:
    A: Menos de 5 años de edad.
    B: Menos de 8 años de edad y miden menos de 4 pies y 9 pulgadas de estatura.
    C: Menos de 10 años de edad.
    D: Menos de 60 libras independientemente de su edad.
  answer: B
  explanation: La ley de Arizona exige que los niños menores de 8 años y que midan
    menos de 4'9" de estatura estén asegurados en un sistema de retención infantil
    adecuado.
- id: 75
  category: safe_driving_rules
  question: 'En Arizona, un conductor puede girar a la izquierda en una luz roja solo
    cuando gira desde:'
  choices:
    A: Una calle de doble sentido hacia una calle de un solo sentido
    B: Una calle de un solo sentido hacia una calle de doble sentido
    C: Una calle de un solo sentido hacia otra calle de un solo sentido
    D: Cualquier calle si no hay tráfico cruzado
  answer: C
  explanation: En Arizona, puede girar a la izquierda en una luz roja solo cuando
    gira desde una calle de un solo sentido hacia otra calle de un solo sentido, después
    de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 76
  category: safe_driving_rules
  question: 'Para mantener una distancia de seguimiento segura en Arizona, el manual
    del conductor recomienda usar la:'
  choices:
    A: Regla de 1 segundo
    B: Regla de 2 segundos
    C: Regla de 3 segundos
    D: Regla de 5 segundos
  answer: C
  explanation: El Manual de Licencia de Conducir de Arizona recomienda una distancia
    de seguimiento de 3 segundos en condiciones normales de manejo.
- id: 77
  category: safe_driving_rules
  question: En Arizona, las multas de tráfico se __________ por infracciones cometidas
    en una zona de obras designada cuando hay trabajadores presentes.
  choices:
    A: Reducen a la mitad
    B: Duplican
    C: Triplican
    D: Eximen para los infractores por primera vez
  answer: B
  explanation: La ley de Arizona exige que las multas por infracciones de tráfico
    se dupliquen en las zonas de obras cuando hay trabajadores presentes.
- id: 78
  category: safe_driving_rules
  question: En Arizona, ¿debe señalizar su intención de girar al menos cuántos pies
    antes de realizar el giro?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 200 pies
  answer: C
  explanation: El Manual de Licencia de Conducir de Arizona establece que debe señalizar
    al menos 100 pies antes de girar.
- id: 79
  category: safe_driving_rules
  question: Si conduce por una carretera con tres o más carriles, ¿qué carril se utiliza
    normalmente para el tráfico más lento en Arizona?
  choices:
    A: El carril izquierdo
    B: El carril central
    C: El carril derecho
    D: El carril HOV (vehículos de alta ocupación)
  answer: C
  explanation: En Arizona, el carril derecho está destinado al tráfico más lento,
    mientras que los carriles izquierdos son para rebasar y para el tráfico más rápido.
- id: 80
  category: safe_driving_rules
  question: 'En Arizona, es ilegal seguir a un camión de bomberos que responde a una
    alarma a una distancia menor de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Arizona prohíbe seguir a un camión de bomberos que responde
    a una alarma a una distancia menor de 500 pies.
- id: 81
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada detrás del vehículo que
    va delante de usted cuando conduce por las autopistas de Arizona en condiciones
    ideales?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de Arizona recomienda mantener una distancia
    de seguimiento de al menos 3 segundos para permitir un tiempo de reacción seguro.
- id: 82
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    en un distrito comercial o residencial en Arizona?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: En Arizona, el límite de velocidad predeterminado en distritos residenciales
    y comerciales es de 25 mph, a menos que las señales indiquen lo contrario.
- id: 83
  category: safe_driving_rules
  question: ¿Bajo qué condición es legal rebasar a otro vehículo por la derecha en
    Arizona?
  choices:
    A: Siempre que tenga prisa
    B: Cuando el vehículo de adelante está girando a la izquierda y hay un acotamiento
      pavimentado o un carril disponible
    C: Solo en la autopista
    D: Nunca es legal rebasar por la derecha
  answer: B
  explanation: La ley de Arizona permite rebasar por la derecha si el vehículo que
    se está adelantando está girando a la izquierda y hay suficiente ancho para dos
    o más líneas de vehículos en movimiento.
- id: 84
  category: safe_driving_rules
  question: En Arizona, las multas de tráfico por exceso de velocidad generalmente
    se duplican cuando la infracción ocurre en ¿cuál de las siguientes áreas?
  choices:
    A: Zonas escolares
    B: Vecindarios residenciales
    C: Zonas de construcción o mantenimiento designadas cuando hay trabajadores presentes
    D: Zonas hospitalarias
  answer: C
  explanation: La ley de Arizona exige que las multas por exceso de velocidad y otras
    infracciones de tráfico se dupliquen en las zonas de trabajo cuando hay trabajadores
    presentes.
- id: 85
  category: safe_driving_rules
  question: En Arizona, ¿qué significa una acera pintada de rojo?
  choices:
    A: Zona de carga solo para pasajeros
    B: Zona de carga solo para mercancías
    C: No detenerse, pararse ni estacionarse
    D: Estacionamiento solo para vehículos de emergencia
  answer: C
  explanation: Una acera roja en Arizona indica que no se permite detenerse, pararse
    ni estacionarse, ya sea que el vehículo esté atendido o no.
- id: 86
  category: safe_driving_rules
  question: 'La ley de Arizona define un "DUI Súper Extremo" como tener una concentración
    de alcohol en sangre (BAC) de al menos:'
  choices:
    A: 0.15%
    B: 0.18%
    C: 0.20%
    D: 0.25%
  answer: C
  explanation: En Arizona, un cargo de "DUI Súper Extremo" se aplica a los conductores
    con un BAC de 0.20% o superior.
- id: 87
  category: defensive_driving
  question: Si se encuentra con una tormenta de polvo severa mientras conduce en Arizona,
    ¿cuál es la acción más segura de acuerdo con la regla "Salirse, Apagar, Quitar
    el pie" (Pull Off, Turn Off, Keep Feet Off)?
  choices:
    A: Reducir la velocidad y mantener las luces de emergencia encendidas mientras
      conduce por el acotamiento.
    B: Salirse completamente de la carretera pavimentada, apagar todas las luces del
      vehículo y quitar el pie del freno.
    C: Detenerse en su carril y mantener las luces de freno encendidas para que otros
      puedan verlo.
    D: Acelerar para atravesar la nube de polvo lo más rápido posible.
  answer: B
  explanation: En las tormentas de polvo de Arizona, debe salirse de la carretera,
    apagar todas las luces (incluidas las de emergencia) y quitar el pie del freno
    para que otros conductores no sigan sus luces traseras y choquen contra usted.
- id: 88
  category: defensive_driving
  question: Para evitar la necesidad de frenar o girar en el último momento en el
    tráfico de Arizona, ¿con cuánta anticipación debe observar el camino?
  choices:
    A: 5 a 8 segundos
    B: 10 a 15 segundos
    C: 20 a 25 segundos
    D: 30 a 40 segundos
  answer: B
  explanation: La conducción defensiva en Arizona requiere mirar de 10 a 15 segundos
    hacia adelante para identificar posibles peligros a tiempo.
- id: 89
  category: defensive_driving
  question: El hidroplaneo puede ocurrir durante los monzones de Arizona. ¿A qué velocidad
    pueden la mayoría de los neumáticos comenzar a perder todo contacto con la carretera
    bajo una lluvia intensa?
  choices:
    A: 35 mph
    B: 50 mph
    C: 65 mph
    D: 75 mph
  answer: B
  explanation: Aunque el hidroplaneo puede comenzar a velocidades más bajas, la mayoría
    de los neumáticos pierden toda tracción con la carretera a velocidades de alrededor
    de 50 mph durante una lluvia intensa.
- id: 90
  category: defensive_driving
  question: Al acercarse a un cruce escolar en Arizona que está marcado con una señal
    estándar de 15 mph, ¿cuándo se aplica el límite de velocidad?
  choices:
    A: Solo cuando hay niños presentes en la acera.
    B: En todo momento, las 24 horas del día.
    C: Cuando las luces amarillas están parpadeando o cuando se colocan señales en
      la calle.
    D: Solo durante la primera hora de la jornada escolar.
  answer: C
  explanation: En Arizona, el límite de velocidad de 15 mph en zonas escolares está
    activo cuando se colocan señales en la calle o cuando las luces están parpadeando.
- id: 91
  category: defensive_driving
  question: ¿Por qué la superficie de la carretera es más resbaladiza en Arizona durante
    los primeros minutos de una tormenta de lluvia?
  choices:
    A: La lluvia enfría el asfalto caliente demasiado rápido.
    B: El aceite y la grasa en el pavimento se mezclan con el agua.
    C: Los neumáticos todavía están calientes por el sol de Arizona.
    D: La humedad reduce la eficacia de los frenos.
  answer: B
  explanation: En Arizona, los largos períodos de sequía permiten que el aceite y
    el caucho se acumulen en las carreteras; cuando llueve por primera vez, estos
    se mezclan con el agua para crear una superficie muy resbaladiza.
- id: 92
  category: defensive_driving
  question: Al conducir por carreteras resbaladizas o con poca visibilidad en Arizona,
    ¿cómo debe ajustar su distancia de seguimiento?
  choices:
    A: Mantenerla en 3 segundos.
    B: Disminuirla a 2 segundos para mantenerse cerca del vehículo de adelante.
    C: Aumentarla a 6 segundos o más.
    D: La distancia de seguimiento no importa si tiene frenos ABS.
  answer: C
  explanation: En condiciones adversas como lluvia o polvo, las pautas de Arizona
    sugieren duplicar la distancia de seguimiento a 6 segundos o más.
- id: 93
  category: defensive_driving
  question: Al estacionar su vehículo en una pendiente cuesta abajo con bordillo (banqueta)
    en Arizona, ¿hacia qué lado debe girar las ruedas delanteras?
  choices:
    A: Hacia el bordillo.
    B: En dirección contraria al bordillo.
    C: Mantenerlas rectas.
    D: Depende de si el vehículo es automático o manual.
  answer: A
  explanation: Al estacionar cuesta abajo con un bordillo, debe girar las ruedas hacia
    el bordillo para que el vehículo ruede hacia este en lugar de hacia el tráfico
    si los frenos fallan.
- id: 94
  category: defensive_driving
  question: Para evitar frenazos de último minuto o la necesidad de girar repentinamente,
    ¿con cuánta anticipación sugiere el Manual de Licencia de Conducir de Arizona
    observar el camino?
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 15 segundos
    C: De 20 a 30 segundos
    D: 60 segundos
  answer: B
  explanation: Observar el camino con 10 a 15 segundos de anticipación le permite
    ver los peligros temprano y ajustar su velocidad o posición de manera segura.
- id: 95
  category: defensive_driving
  question: En Arizona, ¿a qué velocidad puede comenzar el hidroplaneo (donde los
    neumáticos pierden contacto con la carretera y se deslizan sobre una capa de agua)?
  choices:
    A: A cualquier velocidad superior a 15 mph
    B: Tan solo a 35 mph
    C: Solo a velocidades superiores a 65 mph
    D: Solo durante las fuertes lluvias monzónicas
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    En una lluvia intensa, sus neumáticos pueden perder todo contacto con la carretera
    a 55 mph.
- id: 96
  category: defensive_driving
  question: En Arizona, una condena por 'Exceso de Velocidad Excesivo' es un delito
    menor de Clase 3. ¿Cuál de las siguientes situaciones constituye un exceso de
    velocidad excesivo?
  choices:
    A: Exceder las 35 mph en una zona escolar.
    B: Exceder las 85 mph en cualquier carretera.
    C: Exceder el límite de velocidad indicado por 15 mph en una zona residencial.
    D: Conducir 10 mph por encima del límite en una carretera interestatal rural.
  answer: B
  explanation: El estatuto ARS 28-701.02 define la velocidad excesiva como exceder
    las 35 mph en una zona escolar, exceder las 85 mph en cualquier lugar o exceder
    el límite indicado por más de 20 mph en otras áreas.
- id: 97
  category: defensive_driving
  question: En Arizona, si es condenado por pasarse un semáforo en rojo y esto no
    resulta en lesiones graves o muerte, ¿cuál es la sanción obligatoria además de
    una multa?
  choices:
    A: Una sentencia de 30 días de cárcel
    B: Revocación permanente de su licencia
    C: Asistencia a la Escuela de Supervivencia de Tráfico (TSS)
    D: El requisito de instalar un Dispositivo de Interbloqueo de Encendido
  answer: C
  explanation: Según la ley de Arizona, cualquier conductor condenado por una infracción
    de semáforo en rojo debe asistir y completar con éxito la Escuela de Supervivencia
    de Tráfico (TSS).
- id: 98
  category: defensive_driving
  question: La ley de Arizona de 'Desperdicio de un Recurso Finito' se aplica a ¿cuál
    de las siguientes situaciones?
  choices:
    A: Conducir un vehículo eléctrico en el carril HOV.
    B: Exceder la velocidad entre 56 y 65 mph en una zona de 55 mph en ciertas carreteras.
    C: Dejar el motor en ralentí por más de 10 minutos.
    D: No reciclar el aceite de motor.
  answer: B
  explanation: El estatuto ARS 28-702.01 establece que exceder la velocidad hasta
    10 mph sobre el límite en una zona de 55 mph es una infracción de 'desperdicio
    de un recurso finito', la cual conlleva una multa pequeña y no resta puntos a
    la licencia de conducir.
- id: 99
  category: defensive_driving
  question: 'En Arizona, si es menor de 21 años, puede ser citado por un DUI si su
    Concentración de Alcohol en Sangre (BAC) es de al menos:'
  choices:
    A: 0.01% o cualquier cantidad detectable
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: A
  explanation: Arizona tiene una política de 'Tolerancia Cero' para conductores menores
    de 21 años; cualquier cantidad detectable de alcohol en su sistema puede dar lugar
    a un cargo de DUI.
- id: 100
  category: alcohol_drugs_health
  question: ¿Cuál es el umbral de Concentración de Alcohol en Sangre (BAC) para una
    condena de 'DUI Súper Extremo' en Arizona?
  choices:
    A: 0.15% o superior
    B: 0.20% o superior
    C: 0.25% o superior
    D: 0.30% o superior
  answer: B
  explanation: Un 'DUI Súper Extremo' en Arizona se aplica a los conductores con un
    BAC de 0.20% o superior.
- id: 101
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un requisito obligatorio para TODAS las condenas
    por DUI en el estado de Arizona?
  choices:
    A: Revocación permanente de la licencia de conducir
    B: Instalación de un dispositivo de interbloqueo de encendido certificado
    C: Un mínimo de 5 años de libertad condicional
    D: Confiscación del vehículo utilizado durante la infracción
  answer: B
  explanation: La ley de Arizona exige que cualquier persona condenada por un DUI
    (incluida una primera infracción) instale un dispositivo de interbloqueo de encendido
    certificado en cualquier vehículo que opere.
- id: 102
  category: alcohol_drugs_health
  question: 'Bajo la ley Admin Per Se de Arizona, si usted opera un vehículo motorizado
    y los resultados de su prueba de aliento o sangre muestran un BAC de 0.08% o más,
    su privilegio de conducir será suspendido por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Si una prueba muestra un BAC de 0.08% o más (o 0.04% para vehículos
    comerciales), su licencia será suspendida por 90 días consecutivos.
- id: 103
  category: alcohol_drugs_health
  question: 'En Arizona, un DUI se clasifica como un ''DUI Agravado'' y se imputa
    como un delito grave si el conductor:'
  choices:
    A: Conduce con un pasajero menor de 15 años
    B: Tiene un BAC de 0.10% o superior
    C: Conduce un vehículo con placas de otro estado
    D: Conduce después de las 2:00 AM
  answer: A
  explanation: El DUI Agravado (un delito grave) ocurre si usted comete un DUI mientras
    su licencia está suspendida/revocada, comete un tercer DUI en 84 meses, o comete
    un DUI mientras una persona menor de 15 años está en el vehículo.
- id: 104
  category: alcohol_drugs_health
  question: 'Si usted está tomando un medicamento recetado y este afecta su capacidad
    para conducir de manera segura en Arizona, usted:'
  choices:
    A: No puede ser acusado de un DUI porque el medicamento fue recetado legalmente
    B: Puede ser acusado de un DUI
    C: Solo será acusado si también consumió alcohol
    D: Está exento de las leyes de DUI si tiene una nota del médico en el vehículo
  answer: B
  explanation: En Arizona, usted puede ser acusado de un DUI por conducir bajo la
    influencia de cualquier droga que afecte su capacidad para conducir, incluidos
    los medicamentos recetados y los medicamentos de venta libre.
- id: 105
  category: alcohol_drugs_health
  question: De acuerdo con los estándares médicos de Arizona, una persona que ha experimentado
    una convulsión generalmente debe estar libre de convulsiones ¿por cuánto tiempo
    antes de poder reanudar la conducción?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Los estándares médicos de Arizona requieren que un conductor esté libre
    de convulsiones por un período de 90 días antes de ser elegible para conducir,
    aunque esto puede ser revisado por el Programa de Revisión Médica.
- id: 106
  category: alcohol_drugs_health
  question: 'Si usted está involucrado en un choque en Arizona y un oficial de la
    ley tiene causa probable para creer que usted conducía bajo la influencia, ellos
    pueden:'
  choices:
    A: Solo hacerle la prueba si usted está consciente
    B: Requerir que se someta a una prueba de sangre, aliento u orina
    C: Solo hacerle la prueba si hubo una fatalidad
    D: No hacerle la prueba sin una orden firmada por un juez en persona
  answer: B
  explanation: Bajo la ley de Consentimiento Implícito de Arizona, cualquier persona
    que opera un vehículo motorizado otorga su consentimiento para una prueba de sangre,
    aliento u orina si es arrestada por DUI.
- id: 107
  category: alcohol_drugs_health
  question: 'En Arizona, si es condenado por una segunda infracción de DUI dentro
    de un periodo de 84 meses, su privilegio de conducir será revocado por al menos:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 3 años
  answer: C
  explanation: Una segunda condena por DUI dentro de un período de 84 meses resulta
    en una revocación mínima de 1 año de la licencia de conducir.
- id: 108
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de marihuana y la conducción en Arizona?
  choices:
    A: Es legal conducir siempre que tenga una tarjeta de marihuana medicinal
    B: Es legal conducir si solo usó marihuana y nada de alcohol
    C: Puede ser condenado por un DUI si está afectado en el más mínimo grado por
      la marihuana
    D: La marihuana no afecta el tiempo de reacción ni la coordinación
  answer: C
  explanation: Independientemente del estatus legal de la marihuana, la ley de Arizona
    prohíbe conducir mientras se está afectado por cualquier droga. Usted puede ser
    condenado por un DUI si está afectado en el 'más mínimo grado'.
- id: 109
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes escenarios resultaría en un cargo de 'DUI Agravado'
    en Arizona?
  choices:
    A: Conducir bajo la influencia con un pasajero menor de 15 años en el vehículo
    B: Conducir bajo la influencia con un BAC de 0.15%
    C: Conducir bajo la influencia por primera vez
    D: Conducir bajo la influencia mientras llueve
  answer: A
  explanation: En Arizona, un DUI se eleva a un DUI Agravado (un delito grave) si
    se comete mientras una persona menor de 15 años está en el vehículo.
- id: 110
  category: alcohol_drugs_health
  question: 'Bajo la ley de Consentimiento Implícito de Arizona, si se niega a someterse
    a una prueba química y tiene una negativa previa en su historial dentro de los
    últimos 84 meses, su licencia será suspendida por:'
  choices:
    A: 12 meses
    B: 18 meses
    C: 24 meses
    D: Permanentemente
  answer: C
  explanation: Una segunda negativa a una prueba química bajo la ley de Consentimiento
    Implícito dentro de un período de 84 meses (7 años) resulta en una suspensión
    de la licencia por 24 meses.
- id: 111
  category: alcohol_drugs_health
  question: ¿En Arizona, puede ser condenado por un DUI si conduce bajo la influencia
    de un medicamento recetado legalmente?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, las recetas están exentas de las leyes de DUI
    C: Sí, si el medicamento afecta su capacidad para conducir de manera segura
    D: Solo si el medicamento es un narcótico
  answer: C
  explanation: La ley de Arizona establece que es ilegal conducir bajo la influencia
    de cualquier droga, incluidos los medicamentos recetados, si estos afectan su
    capacidad para operar un vehículo de manera segura.
- id: 112
  category: alcohol_drugs_health
  question: Para los conductores de vehículos motorizados comerciales en Arizona,
    ¿cuál es el límite máximo legal de concentración de alcohol en sangre (BAC)?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: El límite legal de BAC para conductores comerciales en Arizona (y a
    nivel federal) es de 0.04%.
- id: 113
  category: alcohol_drugs_health
  question: 'Una persona es culpable de un DUI Agravado en Arizona si comete un DUI
    mientras:'
  choices:
    A: Su licencia de conducir está suspendida, cancelada o revocada
    B: Excede el límite de velocidad por 10 mph
    C: Conduce un vehículo con placas de otro estado
    D: Conduce entre la medianoche y las 5:00 AM
  answer: A
  explanation: Conducir bajo la influencia mientras su licencia está suspendida, revocada
    o cancelada es uno de los criterios para un cargo de DUI Agravado en Arizona.
- id: 114
  category: alcohol_drugs_health
  question: En Arizona, ¿cuánto dura el período de "revisión retrospectiva" (look-back
    period) para condenas previas por DUI al determinar si una infracción actual es
    una segunda o tercera ofensa?
  choices:
    A: 3 años
    B: 5 años
    C: 7 años (84 meses)
    D: 10 años
  answer: C
  explanation: Arizona utiliza un período de revisión retrospectiva de 84 meses (7
    años) para condenas previas por DUI.
- id: 115
  category: alcohol_drugs_health
  question: 'Cuando el alcohol se combina con otra droga, como un sedante o un antihistamínico,
    el efecto sobre la capacidad de conducción suele ser:'
  choices:
    A: Reducido
    B: El mismo que el del alcohol solo
    C: Multiplicado (efecto sinérgico)
    D: Anulado
  answer: C
  explanation: Combinar alcohol con otras drogas puede multiplicar los efectos de
    ambas, aumentando significativamente el deterioro más allá de lo que cualquiera
    de las sustancias causaría por sí sola.
- id: 116
  category: penalties_and_points
  question: Según la ley de Arizona, ¿cuál de las siguientes situaciones constituye
    "Exceso de velocidad criminal" (Criminal Speeding)?
  choices:
    A: Exceder las 85 millas por hora
    B: Exceder el límite de velocidad indicado por 10 mph en una zona escolar
    C: Exceder las 65 millas por hora en una carretera
    D: Exceder las 55 millas por hora en una zona de construcción
  answer: A
  explanation: En Arizona, el exceso de velocidad criminal se define como exceder
    las 85 mph, exceder el límite indicado por 20 mph en áreas comerciales o residenciales,
    o exceder las 35 mph cerca de un cruce escolar.
- id: 117
  category: penalties_and_points
  question: 'En Arizona, cualquier conductor condenado por no detenerse ante una luz
    roja o una señal de alto deberá:'
  choices:
    A: Pagar una multa de $1,000 solamente
    B: Entregar su vehículo por 30 días
    C: Asistir a la Escuela de Supervivencia de Tráfico (TSS)
    D: Volver a tomar el examen de conocimientos escrito
  answer: C
  explanation: La ley de Arizona exige que los conductores condenados por infracciones
    de semáforo en rojo o señal de alto asistan a la Escuela de Supervivencia de Tráfico
    (TSS) por una primera infracción.
- id: 118
  category: penalties_and_points
  question: Si un conductor de Arizona no proporciona un comprobante de seguro vigente
    cuando lo solicita la policía, ¿por cuánto tiempo se puede suspender su privilegio
    de conducir por una primera infracción?
  choices:
    A: 30 días
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Una primera condena por no proporcionar prueba de responsabilidad financiera
    (seguro) en Arizona resulta en una suspensión de 3 meses de los privilegios de
    conducir.
- id: 119
  category: penalties_and_points
  question: 'En Arizona, un conductor condenado por "Conducir en sentido contrario"
    (Wrong-Way Driving) en una carretera de acceso controlado debe:'
  choices:
    A: Pagar una multa de $50
    B: Asistir a la Escuela de Supervivencia de Tráfico (TSS)
    C: Instalar un dispositivo de bloqueo de encendido por 2 años
    D: Perder su vehículo
  answer: B
  explanation: La ley de Arizona exige que los conductores condenados por conducir
    en sentido contrario en carreteras de acceso controlado asistan a la Escuela de
    Supervivencia de Tráfico (TSS).
- id: 120
  category: penalties_and_points
  question: Si un conductor de Arizona es condenado por un segundo DUI dentro de un
    período de 84 meses, ¿cuál es la sentencia mínima obligatoria de cárcel?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: D
  explanation: Una segunda condena por DUI dentro de los 84 meses (7 años) en Arizona
    conlleva una sentencia mínima obligatoria de cárcel de 90 días.
- id: 121
  category: penalties_and_points
  question: ¿En Arizona, cuántos puntos se asignan por 'Seguir demasiado de cerca'
    (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: A
  explanation: Seguir demasiado de cerca es una infracción de tránsito en Arizona
    que resulta en la adición de 2 puntos al historial del conductor.
- id: 122
  category: penalties_and_points
  question: Según la ley de Arizona, ¿cuál es el umbral de BAC para un 'DUI Súper
    Extremo'?
  choices:
    A: 0.15%
    B: 0.18%
    C: 0.20%
    D: 0.25%
  answer: C
  explanation: Un 'DUI Súper Extremo' en Arizona se aplica a los conductores con una
    concentración de alcohol en sangre (BAC) de 0.20% o superior.
- id: 123
  category: penalties_and_points
  question: En Arizona, se le puede acusar de 'Exceso de velocidad criminal' (Criminal
    Speeding) si supera el límite de velocidad indicado por más de ¿cuántas millas
    por hora en un distrito comercial o residencial?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: C
  explanation: Según ARS 28-701.02, exceder el límite de velocidad por más de 20 mph
    en un distrito comercial o residencial se considera exceso de velocidad criminal.
- id: 124
  category: penalties_and_points
  question: ¿En Arizona, cuántos puntos se asignan por una infracción de exceso de
    velocidad estándar que no está clasificada como exceso de velocidad criminal?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: Una condena por exceso de velocidad estándar en Arizona resulta en
    la adición de 3 puntos al historial del conductor.
- id: 125
  category: penalties_and_points
  question: 'En Arizona, cualquier persona condenada por una infracción de ''luz roja''
    está obligada por ley a:'
  choices:
    A: Pagar una multa mínima de $1,000
    B: Asistir a la Escuela de Supervivencia de Tráfico (TSS)
    C: Entregar su vehículo
    D: Someterse a una suspensión de la licencia por 1 año
  answer: B
  explanation: La ley de Arizona exige que los conductores condenados por no detenerse
    ante una señal de tráfico asistan y completen con éxito la Escuela de Supervivencia
    de Tráfico (TSS).
- id: 126
  category: penalties_and_points
  question: Para 'todas las demás infracciones de tránsito' que no figuran específicamente
    con valores de puntos más altos, ¿cuántos puntos asigna el MVD de Arizona?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: A la mayoría de las infracciones de tránsito generales que no implican
    delitos graves como DUI o conducción temeraria se les asignan 2 puntos en Arizona.
- id: 127
  category: penalties_and_points
  question: 'En Arizona, tirar basura en una carretera pública es una infracción que
    puede ser acusada como:'
  choices:
    A: Felonía de Clase 3
    B: Delito Menor de Clase 1
    C: Infracción civil sin puntos
    D: Falta leve
  answer: B
  explanation: Tirar basura en las carreteras de Arizona es un Delito Menor de Clase
    1 (Class 1 Misdemeanor), que puede conllevar multas y posible tiempo en la cárcel.
- id: 128
  category: sharing_the_road
  question: Según la ley de Arizona, cuando un automovilista está alcanzando y rebasando
    a una bicicleta que circula en la misma dirección, ¿cuál es la distancia mínima
    de seguridad que el automovilista debe mantener?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: Los Estatutos Revisados de Arizona (ARS 28-735) exigen que un conductor
    deje una distancia de seguridad entre el vehículo y la bicicleta de no menos de
    tres pies hasta que el vehículo haya rebasado la bicicleta de forma segura.
- id: 129
  category: sharing_the_road
  question: 'En Arizona, debe detenerse ante un autobús escolar con luces rojas intermitentes
    y un brazo de parada extendido, a menos que:'
  choices:
    A: Usted viaje en la dirección opuesta en una carretera con una barrera física
      o mediana.
    B: El autobús esté detenido en una zona escolar con un límite de 15 mph.
    C: Usted viaje en la dirección opuesta en una carretera con al menos cuatro carriles
      y sin mediana.
    D: El conductor del autobús le haga señas para que pase.
  answer: A
  explanation: Según ARS 28-857, no tiene que detenerse ante un autobús escolar si
    viaja en la dirección opuesta en una carretera dividida con una barrera física
    o mediana que separa las calzadas.
- id: 130
  category: sharing_the_road
  question: 'Bajo la ley de ''Filtrado de Carriles'' (Lane Filtering) de Arizona,
    un motociclista puede pasar entre dos carriles de tráfico detenido si el límite
    de velocidad indicado es de 45 mph o menos y la motocicleta no excede las:'
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: A partir de 2022, la ley ARS 28-903 permite el filtrado de carriles
    por parte de motocicletas cuando el tráfico está detenido, el límite de velocidad
    es de 45 mph o menos y la motocicleta circula a 15 mph o menos.
- id: 131
  category: sharing_the_road
  question: En Arizona, ¿qué debe hacer un conductor cuando un peatón cruza la calle
    guiado por un animal de servicio o lleva un bastón blanco?
  choices:
    A: Tocar la bocina para hacerles saber que usted está allí.
    B: Ceder el derecho de paso y tomar precauciones para evitar lesiones.
    C: Rodearlos si hay suficiente espacio en el carril.
    D: Esperar a que lleguen a la mediana antes de continuar.
  answer: B
  explanation: El ARS 28-794 establece que los conductores deben ceder el derecho
    de paso a cualquier peatón que sea guiado por un animal de servicio o que use
    un bastón blanco, y deben tomar las precauciones necesarias para evitar lesiones.
- id: 132
  category: sharing_the_road
  question: Al seguir a un camión grande, ¿cómo puede asegurarse de que no se encuentra
    en la 'No-Zone' (punto ciego) del conductor?
  choices:
    A: Puede ver el parachoques delantero del camión en su espejo retrovisor.
    B: Puede ver los espejos laterales del camión.
    C: Se encuentra al menos a 10 pies detrás del camión.
    D: Puede ver la cara del conductor del camión en su espejo retrovisor lateral.
  answer: D
  explanation: Una regla general para compartir la carretera con camiones grandes
    es que si usted no puede ver la cara del conductor en su espejo lateral, él no
    puede verlo a usted.
- id: 133
  category: sharing_the_road
  question: ¿Cuál es la sanción civil mínima por una primera condena por rebasar ilegalmente
    a un autobús escolar detenido en Arizona?
  choices:
    A: Una multa de $100
    B: Una multa de $250
    C: Una multa de $500
    D: Una multa de $1,000
  answer: B
  explanation: Según el ARS 28-857, una persona declarada responsable de una primera
    infracción por rebasar a un autobús escolar detenido se enfrenta a una sanción
    civil mínima de $250.
- id: 134
  category: sharing_the_road
  question: 'De acuerdo con la ley de Arizona, toda bicicleta utilizada durante la
    noche debe estar equipada con una lámpara en la parte delantera que emita una
    luz blanca visible desde una distancia de al menos:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El ARS 28-817 exige que las bicicletas que circulen de noche tengan
    una lámpara delantera que emita luz blanca visible desde al menos 500 pies y un
    reflector trasero rojo visible desde 300 pies.
- id: 135
  category: sharing_the_road
  question: Cuando un cortejo fúnebre encabezado por un vehículo de escolta funeraria
    avanza por una intersección, ¿cuál es la regla para los demás conductores?
  choices:
    A: Los demás conductores tienen el derecho de paso si su semáforo está en verde.
    B: Los demás conductores deben ceder el derecho de paso a todo el cortejo.
    C: Solo los tres primeros vehículos del cortejo tienen el derecho de paso.
    D: Los cortejos deben detenerse en todos los semáforos en rojo.
  answer: B
  explanation: El ARS 28-776 establece que un cortejo fúnebre encabezado por un vehículo
    de escolta funeraria tiene el derecho de paso en una intersección independientemente
    de los dispositivos de control de tráfico, y los demás conductores deben ceder
    el paso.
- id: 136
  category: sharing_the_road
  question: En Arizona, ¿cuál de las siguientes afirmaciones es verdadera con respecto
    a las leyes sobre el casco de motocicleta?
  choices:
    A: Todos los conductores y pasajeros deben usar casco en todo momento.
    B: Los cascos solo son obligatorios en las autopistas interestatales.
    C: Solo los conductores y pasajeros menores de 18 años están obligados a usar
      casco.
    D: No se requiere casco para nadie si tienen una licencia Clase M.
  answer: C
  explanation: El ARS 28-964 exige que el conductor o pasajero de una motocicleta
    que sea menor de 18 años de edad debe usar un casco protector.
- id: 137
  category: sharing_the_road
  question: 'Cuando un peatón se encuentra en un paso de peatones marcado o no marcado
    en su mitad de la calzada, usted debe:'
  choices:
    A: Detenerse y esperar a que el peatón cruce más allá de su carril.
    B: Reducir la velocidad y continuar si el peatón no está en su trayectoria directa.
    C: Tocar la bocina para advertir al peatón de su acercamiento.
    D: Ceder el derecho de paso y detenerse si es necesario para dejarlo pasar.
  answer: D
  explanation: El ARS 28-792 exige que los conductores cedan el derecho de paso a
    un peatón que cruce la calzada dentro de cualquier paso de peatones marcado o
    no marcado.
- id: 138
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el camión:'
  choices:
    A: Siempre permanecerá en el carril del extremo derecho.
    B: Puede necesitar abrirse ampliamente hacia la izquierda para completar el giro.
    C: Debe detenerse y esperar a que todo el tráfico se despeje antes de girar.
    D: Está obligado a girar desde el carril izquierdo.
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para hacer un giro a la derecha. Los conductores deben evitar 'apretarse' entre
    el camión y la acera.
- id: 139
  category: sharing_the_road
  question: 'La ley de Arizona ''Move Over'' (Hacerse a un lado) también se aplica
    a los vehículos estacionados con luces ámbar intermitentes, tales como:'
  choices:
    A: Camiones de helados.
    B: Grúas y vehículos de servicios públicos.
    C: Maquinaria agrícola de movimiento lento.
    D: Autobuses escolares cargando pasajeros.
  answer: B
  explanation: El ARS 28-775 incluye vehículos estacionados que exhiben luces intermitentes
    ámbar o blancas, como grúas, vehículos de mantenimiento de carreteras y vehículos
    de servicios públicos, bajo los requisitos de 'Move Over'.
- id: 140
  category: sharing_the_road
  question: En Arizona, usted conduce por una autopista con una mediana física o divisor.
    Un autobús escolar está detenido en el lado opuesto de la mediana con sus luces
    rojas intermitentes y el brazo de parada extendido. ¿Qué debe hacer usted?
  choices:
    A: Detenerse hasta que el autobús se mueva.
    B: Detenerse hasta que se apaguen las señales.
    C: Reducir la velocidad y proceder con precaución.
    D: No está obligado a detenerse.
  answer: D
  explanation: Según el ARS 28-857, el conductor de un vehículo en una autopista con
    calzadas separadas (divididas por una barrera física o mediana) no necesita detenerse
    al encontrarse o rebasar a un autobús escolar que se encuentre en una calzada
    diferente.
- id: 141
  category: sharing_the_road
  question: 'Según la ley de filtrado de carriles de Arizona (ARS 28-903), el conductor
    de una motocicleta puede adelantar y rebasar a otro vehículo en el mismo carril
    solo si el límite de velocidad en la carretera no es superior a:'
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: La ley de Arizona permite el filtrado de carriles para motocicletas
    si el límite de velocidad es de 45 mph o menos, la motocicleta circula a 15 mph
    o menos y los demás vehículos están detenidos.
- id: 142
  category: sharing_the_road
  question: 'En Arizona, si ve a un peatón guiado por un animal de servicio o que
    lleva un bastón blanco (con o sin punta roja), usted debe:'
  choices:
    A: Tocar la bocina para hacerles saber que usted está allí.
    B: Ceder el derecho de paso y tomar precauciones para evitar lesiones.
    C: Conducir alrededor de ellos siempre que no los golpee.
    D: Esperar a que un oficial de policía dirija el tráfico.
  answer: B
  explanation: La ley ARS 28-794 establece que los conductores deben ceder el derecho
    de paso a cualquier peatón ciego o con discapacidad visual que lleve un bastón
    blanco o utilice un animal de servicio.
- id: 143
  category: sharing_the_road
  question: 'Al seguir a un camión grande o vehículo comercial, debe aumentar su distancia
    de seguimiento porque:'
  choices:
    A: Los camiones tienen una 'No-Zone' (punto ciego) mucho más grande directamente
      detrás de ellos.
    B: Los camiones están obligados a detenerse en todos los cruces de ferrocarril.
    C: Los camiones siempre viajan a 10 mph por debajo del límite de velocidad.
    D: Los camiones tienen mejores frenos y se detienen más rápido que los autos.
  answer: A
  explanation: Los camiones grandes tienen puntos ciegos significativos, a menudo
    llamados 'No-Zones', detrás de ellos. Si no puede ver los espejos laterales del
    conductor del camión, el conductor no puede verlo a usted.
- id: 144
  category: sharing_the_road
  question: 'Según la ley de Arizona, una persona que monta en bicicleta por una calzada
    tiene:'
  choices:
    A: Ningún derecho en la carretera.
    B: Los mismos derechos y deberes que el conductor de un vehículo motorizado.
    C: El derecho de paso sobre todos los vehículos motorizados en todo momento.
    D: El requisito de circular únicamente por la acera.
  answer: B
  explanation: La ley ARS 28-812 establece que toda persona que circule en bicicleta
    por una calzada goza de todos los derechos y está sujeta a todos los deberes aplicables
    al conductor de un vehículo.
- id: 145
  category: sharing_the_road
  question: 'En Arizona, cuando un cortejo fúnebre es encabezado por un vehículo de
    escolta funeraria con luces intermitentes, los demás conductores:'
  choices:
    A: Pueden atravesar el cortejo si hay un espacio.
    B: Deben ceder el derecho de paso a todos los vehículos del cortejo.
    C: Deben tocar la bocina para mostrar respeto.
    D: Deben detenerse a la derecha y esperar hasta que pase.
  answer: B
  explanation: La ley ARS 28-776 establece que los peatones y otros vehículos deberán
    ceder el derecho de paso a cualquier vehículo que forme parte de un cortejo fúnebre
    encabezado por un vehículo de escolta funeraria.
- id: 146
  category: sharing_the_road
  question: En Arizona, ¿a partir de qué edad la ley exige que una persona use un
    casco protector mientras opera o viaja en una motocicleta?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: Todas las edades deben usar casco.
  answer: B
  explanation: La ley ARS 28-964 exige que el conductor o pasajero de una motocicleta
    que sea menor de 18 años de edad debe usar un casco protector.
- id: 147
  category: sharing_the_road
  question: 'Al seguir a un camión de bomberos (aparato de bomberos) que responde
    a una emergencia, la ley de Arizona prohíbe seguirlo a una distancia menor de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley ARS 28-775 establece que el conductor de un vehículo que no
    esté en servicio oficial no debe seguir a ningún aparato de bomberos que viaje
    en respuesta a una alarma de incendio a menos de 500 pies.
- id: 148
  category: sharing_the_road
  question: 'Si un peatón cruza la calzada en un punto que no sea un paso de peatones
    marcado o un paso de peatones no marcado en una intersección, la ley de Arizona
    (ARS 28-793) exige:'
  choices:
    A: Que el peatón ceda el derecho de paso a todos los vehículos.
    B: Que los vehículos se detengan y esperen al peatón.
    C: Que el peatón cruce la calle corriendo.
    D: Que el conductor acelere para evitar al peatón.
  answer: A
  explanation: La ley ARS 28-793 especifica que todo peatón que cruce una calzada
    en cualquier punto que no sea dentro de un paso de peatones marcado o dentro de
    un paso de peatones no marcado en una intersección deberá ceder el derecho de
    paso a todos los vehículos en la calzada.
- id: 149
  category: sharing_the_road
  question: 'Cuando se acerque a un autobús escolar que está detenido y tiene activadas
    sus ''luces ámbar intermitentes alternadas'', usted debe:'
  choices:
    A: Detenerse inmediatamente.
    B: Reducir la velocidad y prepararse para detenerse.
    C: Acelerar para pasar antes de que se enciendan las luces rojas.
    D: Ignorar las luces, ya que son solo para el conductor del autobús.
  answer: B
  explanation: Las luces ámbar (amarillas) intermitentes en un autobús escolar significan
    que el autobús se está preparando para detenerse para subir o bajar niños. Los
    conductores deben reducir la velocidad y estar preparados para detenerse cuando
    las luces cambien a rojo.
- id: 150
  category: vehicle_information
  question: Según el Manual del Conductor de Arizona, ¿cuándo debe encender los faros
    delanteros?
  choices:
    A: Desde 30 minutos después de la puesta del sol hasta 30 minutos antes de la
      salida del sol
    B: Desde el atardecer hasta el amanecer
    C: Solo cuando esté lloviendo o haya niebla
    D: Desde una hora después de la puesta del sol hasta una hora antes de la salida
      del sol
  answer: B
  explanation: En Arizona, debe encender los faros delanteros desde el atardecer hasta
    el amanecer, o siempre que la visibilidad sea baja debido a las condiciones climáticas.
- id: 151
  category: vehicle_information
  question: ¿A qué distancia debe bajar las luces altas cuando sigue a otro vehículo
    por detrás en Arizona?
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: La ley de Arizona exige que los conductores bajen las luces altas cuando
    sigan a otro vehículo a una distancia de 200 pies o menos.
- id: 152
  category: vehicle_information
  question: La ley de Arizona exige que todo vehículo motorizado esté equipado con
    un espejo retrovisor que permita al conductor ver la carretera hacia atrás por
    al menos ¿cuántos pies?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Según ARS 28-956, los vehículos deben tener un espejo que refleje una
    vista de la carretera por una distancia de al menos 200 pies hacia atrás.
- id: 153
  category: vehicle_information
  question: 'Según la ley de Arizona, la bocina de un vehículo motorizado debe ser
    audible en condiciones normales desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: Los Estatutos Revisados de Arizona (ARS 28-954) requieren que la bocina
    sea audible desde una distancia no menor a 200 pies.
- id: 154
  category: vehicle_information
  question: 'En Arizona, la placa de matrícula trasera debe estar iluminada por una
    luz blanca para que sea claramente legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: ARS 28-925 establece que la placa de registro trasera debe estar iluminada
    y ser legible desde una distancia de 50 pies.
- id: 155
  category: vehicle_information
  question: De acuerdo con las leyes de polarizado de ventanas de Arizona, las ventanas
    laterales delanteras (a la izquierda y derecha del conductor) deben permitir el
    paso de al menos ¿qué porcentaje de luz?
  choices:
    A: 20%
    B: 33%
    C: 50%
    D: 70%
  answer: B
  explanation: La ley de Arizona (ARS 28-959.01) exige que las ventanas laterales
    delanteras tengan una transmisión de luz de al menos el 33%.
- id: 156
  category: vehicle_information
  question: ¿Cuántos sistemas de frenado independientes exige la ley de Arizona que
    tenga cada vehículo motorizado?
  choices:
    A: Un sistema
    B: Dos sistemas independientes (freno de servicio y freno de estacionamiento)
    C: Tres sistemas (delantero, trasero y de emergencia)
    D: Los sistemas de frenado solo son obligatorios para vehículos de más de 6,000
      libras
  answer: B
  explanation: 'La ley de Arizona exige dos medios separados para aplicar los frenos:
    un freno de servicio y un freno de estacionamiento o de emergencia.'
- id: 157
  category: vehicle_information
  question: 'En Arizona, se considera que un neumático no es seguro si la banda de
    rodadura está desgastada a menos de:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Un neumático se considera inseguro e ilegal si la profundidad de la
    banda de rodadura es inferior a 2/32 de pulgada.
- id: 158
  category: vehicle_information
  question: En Arizona, si una carga se extiende más de ¿cuántos pies más allá de
    la parte trasera de la carrocería de un vehículo?, se debe colocar una bandera
    roja o una luz roja al final de la carga.
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: ARS 28-935 requiere una bandera roja (de día) o una luz roja (de noche)
    si una carga se extiende 4 pies o más más allá de la parte trasera del vehículo.
- id: 159
  category: vehicle_information
  question: 'En Arizona, se requieren guardabarros (fenders) para cualquier vehículo
    o combinación de vehículos con un GVW (Peso Bruto del Vehículo) superior a:'
  choices:
    A: 3,000 libras
    B: 6,000 libras
    C: 10,000 libras
    D: 26,000 libras
  answer: B
  explanation: ARS 28-958.01 requiere guardabarros para vehículos con un GVW de más
    de 6,000 libras para evitar salpicaduras de lodo o piedras.
- id: 160
  category: vehicle_information
  question: La ley de Arizona exige que todo vehículo motorizado (excepto las motocicletas)
    esté equipado con al menos ¿cuántas luces traseras?
  choices:
    A: Una luz trasera
    B: Dos luces traseras
    C: Tres luces traseras
    D: Las luces traseras solo son obligatorias por la noche
  answer: B
  explanation: ARS 28-925 exige que todo vehículo motorizado tenga al menos dos luces
    traseras (excepto en el caso de ciertos vehículos antiguos o motocicletas).
- id: 161
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los limpiaparabrisas
    según la ley de Arizona?
  choices:
    A: Solo se requieren si el vehículo se conduce bajo la lluvia
    B: Todo vehículo de motor con parabrisas debe estar equipado con limpiaparabrisas
    C: Los limpiaparabrisas son opcionales para los vehículos registrados como 'Clásicos'
    D: Solo el lado del conductor requiere un limpiaparabrisas
  answer: B
  explanation: ARS 28-957 requiere que todo vehículo de motor operado en una carretera
    que esté equipado con un parabrisas también debe tener limpiaparabrisas funcionales.
- id: 162
  category: vehicle_information
  question: 'En Arizona, se debe exhibir un emblema de ''Vehículo de movimiento lento''
    en la parte trasera de cualquier vehículo diseñado para operar a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: ARS 28-959 requiere un emblema de vehículo de movimiento lento para
    los vehículos diseñados para velocidades de 25 mph o menos.
- id: 163
  category: vehicle_information
  question: 'Todo vehículo de motor en Arizona debe estar equipado con una bocina
    que se pueda escuchar desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Según los Estatutos Revisados de Arizona, todo vehículo de motor debe
    tener una bocina en buen estado de funcionamiento capaz de emitir un sonido audible
    en condiciones normales desde una distancia no menor a 200 pies.
- id: 164
  category: vehicle_information
  question: 'Según la ley de Arizona, es ilegal conducir un vehículo si el parabrisas
    está:'
  choices:
    A: Cubierto con cualquier calcomanía no requerida por la ley que obstruya la visión
      del conductor
    B: Equipado con limpiaparabrisas que funcionan manualmente
    C: Teñido en la parte superior (línea AS-1)
    D: Hecho de vidrio de seguridad
  answer: A
  explanation: La ley de Arizona prohíbe colocar cualquier letrero, póster u otro
    material no transparente en el parabrisas que obstruya la visión clara del conductor
    de la carretera.
- id: 165
  category: vehicle_information
  question: ¿La ley de Arizona prohíbe el uso de qué modificación del sistema de escape?
  choices:
    A: Puntas de escape cromadas
    B: Sistemas de escape doble
    C: Recortes o derivaciones del silenciador (muffler cutouts or bypasses)
    D: Convertidores catalíticos de alto flujo
  answer: C
  explanation: La ley de Arizona exige que todo vehículo tenga un silenciador en buen
    estado de funcionamiento para evitar el ruido excesivo; los recortes de silenciador,
    las derivaciones o dispositivos similares están estrictamente prohibidos.
- id: 166
  category: vehicle_information
  question: Al usar señales manuales y de brazo en Arizona, ¿qué señal indica un giro
    a la derecha?
  choices:
    A: Brazo extendido recto hacia afuera
    B: Brazo extendido hacia arriba
    C: Brazo extendido hacia abajo
    D: Brazo movido en movimiento circular
  answer: B
  explanation: Para un giro a la derecha usando señales manuales, el brazo debe extenderse
    hacia arriba en un ángulo de 90 grados.
- id: 167
  category: vehicle_information
  question: 'En Arizona, las luces direccionales de su vehículo deben ser visibles
    desde una distancia de al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: La ley de Arizona exige que las señales de giro sean visibles desde
    una distancia no menor a 100 pies bajo la luz solar normal.
- id: 168
  category: signs_and_signals
  question: En Arizona, al usar señales manuales para indicar un giro, ¿qué posición
    representa un giro a la izquierda?
  choices:
    A: Brazo extendido hacia arriba
    B: Brazo extendido hacia abajo
    C: Brazo extendido horizontalmente hacia la izquierda
    D: Brazo agitado en movimiento circular
  answer: C
  explanation: Según el Manual de Licencia de Conducir de Arizona, un giro a la izquierda
    se señala extendiendo el brazo izquierdo horizontalmente hacia afuera de la ventana.
- id: 169
  category: signs_and_signals
  question: Al señalar un giro a la derecha usando señales manuales en Arizona, ¿cuál
    es la posición correcta del brazo?
  choices:
    A: Brazo extendido horizontalmente
    B: Brazo extendido hacia arriba
    C: Brazo extendido hacia abajo
    D: Brazo apuntando hacia el lado del pasajero
  answer: B
  explanation: El Manual de Licencia de Conducir de Arizona establece que un giro
    a la derecha se señala extendiendo el brazo izquierdo hacia arriba en un ángulo
    de 90 grados.
- id: 170
  category: signs_and_signals
  question: Para señalar que está disminuyendo la velocidad o deteniéndose usando
    señales manuales, ¿cómo debe posicionar su brazo?
  choices:
    A: Brazo extendido hacia arriba
    B: Brazo extendido horizontalmente
    C: Brazo extendido hacia abajo
    D: Brazo mantenido dentro del vehículo
  answer: C
  explanation: En Arizona, la señal manual para reducir la velocidad o detenerse es
    el brazo izquierdo extendido hacia abajo con la palma hacia atrás.
- id: 171
  category: signs_and_signals
  question: En Arizona, ¿qué indica una flecha amarilla intermitente en una intersección?
  choices:
    A: Deténgase y espere a una flecha verde
    B: El giro está protegido; el tráfico en sentido contrario está detenido
    C: Ceda el paso al tráfico en sentido contrario y a los peatones, luego gire con
      precaución
    D: Acelere para despejar la intersección antes de que la luz cambie a rojo
  answer: C
  explanation: Una flecha amarilla intermitente significa que se permiten los giros,
    pero primero debe ceder el paso al tráfico en sentido contrario y a los peatones,
    y luego proceder con precaución.
- id: 172
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor al acercarse a una luz roja intermitente
    en Arizona?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo y proceder solo cuando sea seguro hacerlo
    C: Detenerse solo si hay tráfico cruzado
    D: Tratarla como una luz amarilla y prepararse para detenerse
  answer: B
  explanation: Según la ley de Arizona, una luz roja intermitente se trata igual que
    una señal de alto; debe detenerse por completo y proceder cuando sea seguro.
- id: 173
  category: signs_and_signals
  question: 'Un símbolo en forma de diamante pintado en un carril en Arizona indica
    que el carril está reservado para:'
  choices:
    A: Solo vehículos de emergencia
    B: Vehículos de alta ocupación (HOV)
    C: Maquinaria agrícola de movimiento lento
    D: Solo bicicletas
  answer: B
  explanation: El símbolo de diamante marca los carriles HOV, que están reservados
    durante horarios específicos para vehículos que transportan a dos o más personas
    (u otros vehículos calificados como motocicletas o aquellos con placas de 'Aire
    Limpio').
- id: 174
  category: signs_and_signals
  question: ¿Qué significa un bordillo de color rojo sólido en Arizona?
  choices:
    A: Puede detenerse solo el tiempo suficiente para recoger pasajeros
    B: Puede estacionarse hasta por 15 minutos
    C: No se permite detenerse, detener la marcha ni estacionarse
    D: Reservado solo para vehículos de emergencia
  answer: C
  explanation: Un bordillo rojo indica que no se permite detenerse, detener la marcha
    ni estacionarse, ya sea que el vehículo esté atendido o no.
- id: 175
  category: signs_and_signals
  question: 'En Arizona, un bordillo blanco indica que puede detenerse solo para:'
  choices:
    A: Cargar o descargar mercancía
    B: Reparaciones de emergencia
    C: Recoger o dejar pasajeros o correo
    D: Estacionarse por menos de 30 minutos
  answer: C
  explanation: Un bordillo blanco está designado para paradas breves para recoger
    o dejar pasajeros o para depositar correo en un buzón adyacente.
- id: 176
  category: signs_and_signals
  question: ¿Cuál es el significado de un bordillo azul en Arizona?
  choices:
    A: El estacionamiento está permitido solo para vehículos policiales
    B: El estacionamiento está permitido solo para personas con discapacidades
    C: El área es una parada de autobús
    D: El estacionamiento está restringido a 10 minutos
  answer: B
  explanation: Los bordillos azules indican zonas de estacionamiento reservadas para
    personas con discapacidades que tengan un cartel (placard) o placa de matrícula
    válida.
- id: 177
  category: signs_and_signals
  question: 'Una línea blanca sólida pintada entre carriles de tráfico que se mueven
    en la misma dirección en Arizona significa:'
  choices:
    A: Los cambios de carril están prohibidos
    B: Se desaconseja realizar cambios de carril
    C: Debe girar en la dirección de la línea
    D: La carretera está terminando
  answer: B
  explanation: Una línea blanca sólida separa los carriles de tráfico que se mueven
    en la misma dirección e indica que se desaconseja cambiar de carril debido a posibles
    peligros, aunque no está estrictamente prohibido como una línea sólida doble.
- id: 178
  category: signs_and_signals
  question: ¿Qué significan las líneas amarillas sólidas dobles en el centro de la
    carretera en Arizona?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: Se prohíbe rebasar en ambas direcciones
    D: La carretera es de un solo sentido
  answer: C
  explanation: Las líneas amarillas sólidas dobles significan que no se permite rebasar
    a los vehículos que viajan en cualquier dirección.
- id: 179
  category: signs_and_signals
  question: En Arizona, ¿qué forma y color tiene una señal estándar de 'Ceda el paso'
    (Yield)?
  choices:
    A: Octágono, rojo y blanco
    B: Diamante, amarillo y negro
    C: Triángulo equilátero apuntando hacia abajo, rojo y blanco
    D: Rectángulo, blanco y negro
  answer: C
  explanation: Una señal de ceda el paso es un triángulo equilátero que apunta hacia
    abajo, de color rojo y blanco con la palabra 'YIELD' en rojo.
- id: 180
  category: signs_and_signals
  question: 'Si ve las señales de ''Wrong Way'' (Sentido contrario) y ''Do Not Enter''
    (No entre) mientras conduce en Arizona, significa que:'
  choices:
    A: Va en sentido contrario por una rampa de salida o autopista
    B: La carretera está cerrada por construcción
    C: Debe ceder el paso al tráfico en sentido contrario
    D: El límite de velocidad ha cambiado
  answer: A
  explanation: Estas señales se colocan para evitar que los conductores entren en
    una autopista o calle de un solo sentido en la dirección equivocada. Si las ve,
    deténgase a un lado y dé la vuelta de manera segura lo antes posible.
- id: 181
  category: signs_and_signals
  question: En Arizona, si es condenado por no detenerse ante una luz roja, ¿cuántos
    puntos se le asignan a su historial de conducción?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 8 puntos
  answer: A
  explanation: Según el Manual de Licencia de Conducir de Arizona, 'No detenerse ante
    una señal de tráfico' resulta en la adición de 2 puntos a su historial de conducción.
    Además, la ley de Arizona exige que los conductores condenados por pasarse un
    semáforo en rojo asistan a la Escuela de Supervivencia de Tráfico (TSS).
- id: 182
  category: signs_and_signals
  question: En el área metropolitana de Phoenix, ¿cuál es el número mínimo estándar
    de ocupantes requeridos para usar un carril para vehículos de alta ocupación (HOV)
    durante las horas restringidas?
  choices:
    A: 1 persona (solo el conductor)
    B: 2 o más personas
    C: 3 o más personas
    D: 4 o más personas
  answer: B
  explanation: En Arizona, los carriles HOV están reservados para vehículos que transportan
    a dos o más personas (incluido el conductor) durante las horas restringidas de
    6:00 AM a 9:00 AM y de 3:00 PM a 6:00 PM, de lunes a viernes.
- id: 183
  category: signs_and_signals
  question: Para indicar un giro a la izquierda usando señales manuales en Arizona,
    ¿cómo debe posicionar su brazo?
  choices:
    A: Extender el brazo izquierdo y la mano rectos hacia afuera de la ventana.
    B: Extender el brazo izquierdo y la mano hacia arriba.
    C: Extender el brazo izquierdo y la mano hacia abajo.
    D: Extender el brazo derecho y la mano rectos hacia afuera de la ventana.
  answer: A
  explanation: La señal manual estándar para un giro a la izquierda es extender el
    brazo izquierdo y la mano rectos hacia afuera de la ventana del lado del conductor.
- id: 184
  category: signs_and_signals
  question: En Arizona, ¿qué indica una 'Baliza Híbrida para Peatones' (también conocida
    como señal HAWK) cuando las dos luces superiores están en rojo fijo?
  choices:
    A: Proceder con precaución.
    B: Detenerse y esperar a que las luces se apaguen.
    C: Detenerse y permanecer detenido mientras haya peatones en el cruce peatonal.
    D: Tratarlo como una parada de cuatro vías.
  answer: C
  explanation: Cuando una señal HAWK muestra luces rojas fijas, los conductores deben
    detenerse y permanecer detenidos para permitir que los peatones crucen. Una vez
    que las luces comiencen a parpadear en rojo, los conductores pueden proceder después
    de detenerse si el cruce peatonal está despejado.
- id: 185
  category: signs_and_signals
  question: Si ve una señal de 'Sentido Contrario' (Wrong Way) o 'No Entrar' (Do Not
    Enter) mientras conduce en una rampa de salida de una autopista en Arizona, ¿qué
    es lo primero que debe hacer?
  choices:
    A: Continuar hasta la siguiente salida para dar la vuelta.
    B: Detenerse inmediatamente en el arcén izquierdo o derecho y parar.
    C: Acelerar para despejar la rampa rápidamente.
    D: Retroceder hacia el tráfico de la autopista.
  answer: B
  explanation: Las pautas de seguridad de Arizona establecen que si viaja en sentido
    contrario, debe detenerse inmediatamente a un lado de la carretera y parar. Por
    la noche, apague los faros para no cegar a los conductores que vienen en sentido
    contrario y espere asistencia o hasta que sea seguro dar la vuelta.
- id: 186
  category: signs_and_signals
  question: En las carreteras de Arizona, ¿qué significan las líneas blancas discontinuas?
  choices:
    A: Separación de carriles de tráfico que se mueven en direcciones opuestas.
    B: Separación de carriles de tráfico que se mueven en la misma dirección.
    C: Un área donde rebasar está estrictamente prohibido.
    D: El borde de la carretera.
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección. Puede cruzar estas líneas cuando sea seguro cambiar
    de carril.
- id: 187
  category: signs_and_signals
  question: En Arizona, ¿cuál es el significado principal de una señal de tráfico
    en forma de diamante?
  choices:
    A: Reglamentaria (debe obedecer).
    B: Advertencia (posibles peligros adelante).
    C: Guía (direcciones y distancias).
    D: Servicios (gasolina, comida, alojamiento).
  answer: B
  explanation: Las señales en forma de diamante se utilizan en Arizona y en todo EE.
    UU. como señales de advertencia para alertar a los conductores sobre peligros
    existentes o posibles en la carretera o áreas adyacentes.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que se aproxima
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octogonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 188
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Proceder sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para dejar pasar a otros de forma segura.
  id: 189
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entrar en esta carretera
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico que viene en sentido contrario.
  id: 190
- image: wrong_way.png
  category: signs_and_signals
  question: ¿Qué debe hacer si ve esta señal?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está circulando en contra del tráfico en una calle de un solo sentido o en
    una rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de forma
    segura.
  id: 191
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda únicamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 192
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 193
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 194
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 195
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona donde está prohibido adelantar.
  id: 196
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha únicamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 197
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 198
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta área
    C: Área de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan frecuentemente la carretera en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 199
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de caminata cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 200
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal de color amarillo verdoso fluorescente en forma de pentágono
    (5 lados) indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté
    atento a los niños.
  id: 201
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 202
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima un
    tren, debe detenerse.
  id: 203
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Se requiere giro a la derecha
    C: Una curva hacia la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 204
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 205
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que el camino curve primero
    hacia un lado y luego hacia el otro.
  id: 206
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 207
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una carretera dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Esté preparado para
    ajustar su velocidad y posición.
  id: 208
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: El camino se estrecha más adelante
    C: El carril termina
    D: La carretera dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que el camino más adelante se vuelve
    más estrecho. Esté preparado para una reducción en el ancho de la carretera y
    ajuste su posición en el carril.
  id: 209
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: El camino termina
    B: Tráfico en ambos sentidos
    C: Comienza una carretera dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que el camino más adelante se convierte en una
    carretera dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 210
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción vial más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Prepárese para el
    tráfico en ambos sentidos.
  id: 211
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico en ambos sentidos más adelante. Es posible
    que esté saliendo de una vía de un solo sentido o de una autopista dividida y
    se encuentre con vehículos que circulan en dirección opuesta.
  id: 212
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 213
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción vial
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 214
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Prepárese para detenerse
    si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde el semáforo
    puede no ser visible desde la distancia.
  id: 215
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 216
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las calles laterales.
  id: 217
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una calle lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la carretera desde la calle lateral.
  id: 218
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: 'Se está añadiendo un nuevo carril: no es necesario incorporarse'
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 219
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer parado o con el motor encendido
    D: Carga o descarga
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 220
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válido
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 221
