questions:
- id: 1
  category: driver_responsibility
  question: ¿Por ley, cuántos días tiene para notificar al MVD sobre un cambio de
    nombre o dirección?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Usted está obligado por ley a notificar al MVD dentro de los 10 días
    posteriores a cualquier cambio en su nombre o dirección.
- id: 2
  category: penalties_and_points
  question: ¿Cuál es el objetivo principal del Programa de la Escuela de Supervivencia
    de Tráfico (Traffic Survival School)?
  choices:
    A: Enseñar a los nuevos conductores cómo estacionarse en paralelo
    B: Cambiar o modificar el comportamiento de conducción riesgoso o inseguro
    C: Proporcionar capacitación práctica al volante para conductores comerciales
    D: Eximir del pago de la tarifa por la renovación de la licencia de conducir
  answer: B
  explanation: El Programa de la Escuela de Supervivencia de Tráfico está diseñado
    para conductores con infracciones graves o acumulación de puntos, y su objetivo
    es cambiar o modificar el comportamiento de conducción riesgoso o inseguro.
- id: 3
  category: vehicle_information
  question: ¿Qué entidad está autorizada por el MVD para realizar inspecciones de
    vehículos de Nivel I?
  choices:
    A: El Departamento de Educación de Arizona
    B: El Consejo Nacional de Seguridad (NSC)
    C: Proveedores externos (Third Party providers)
    D: Agencias locales del orden público
  answer: C
  explanation: Según el manual, los proveedores externos (Third Party providers) están
    autorizados por el MVD para realizar inspecciones de Nivel I.
- id: 4
  category: license_system
  question: ¿Cuál es la tarifa de una tarjeta de identificación (ID) para una persona
    de 65 años de edad o más?
  choices:
    A: $10
    B: $12
    C: $25
    D: Sin tarifa
  answer: D
  explanation: El programa de tarifas en el manual establece que 'No hay tarifa' para
    una tarjeta de identificación para personas de 65 años o más.
- id: 5
  category: license_system
  question: Para evitar esperar en fila, debe tener en cuenta que la mayoría de las
    oficinas del MVD están cerradas hasta el mediodía ¿qué día?
  choices:
    A: El primer lunes de cada mes
    B: El segundo miércoles de cada mes
    C: El último viernes de cada mes
    D: Todos los martes
  answer: B
  explanation: El manual advierte que la mayoría de las oficinas están cerradas hasta
    el mediodía el segundo miércoles de cada mes.
- id: 6
  category: driver_testing
  question: 'Llevar su licencia de conducir de otro estado al MVD es útil porque sirve
    como una forma secundaria de identificación y puede:'
  choices:
    A: Eximirlo del examen escrito y de manejo
    B: Reducir sus tarifas de registro
    C: Permitirle omitir el examen de la vista
    D: Otorgarle automáticamente una licencia de conducir comercial
  answer: A
  explanation: Llevar su licencia de conducir de otro estado se utilizará como una
    forma secundaria de identificación y puede eximirlo del examen escrito y de manejo.
- id: 7
  category: penalties_and_points
  question: ¿Cuál es la tarifa estándar por un vehículo abandonado que no se encuentra
    en terrenos federales?
  choices:
    A: $100
    B: $250
    C: $500
    D: $600
  answer: C
  explanation: El manual indica que la tarifa por vehículo abandonado es de $500,
    mientras que la tarifa por un vehículo abandonado en terrenos federales es de
    $600.
- id: 8
  category: safe_driving_rules
  question: ¿Bajo qué Título de los Estatutos Revisados de Arizona se pueden encontrar
    los detalles de las leyes de vehículos motorizados del estado?
  choices:
    A: Título 18 'Vehículos'
    B: Título 28 'Transporte'
    C: Título 36 'Salud Pública'
    D: Título 42 'Impuestos'
  answer: B
  explanation: Los detalles de las leyes de vehículos motorizados se pueden encontrar
    en los Estatutos Revisados de Arizona en azleg.gov bajo el Título 28 'Transporte'
    (Transportation).
- id: 9
  category: penalties_and_points
  question: ¿Quién otorga las licencias a las escuelas de supervivencia de tráfico
    en Arizona?
  choices:
    A: El Departamento de Educación de Arizona
    B: El Capítulo de Arizona del Consejo Nacional de Seguridad (NSC)
    C: La Administración Federal de Carreteras
    D: La División de Vehículos Motorizados (MVD)
  answer: B
  explanation: Las escuelas de supervivencia de tráfico tienen licencia del Capítulo
    de Arizona del Consejo Nacional de Seguridad (NSC).
- id: 10
  category: license_system
  question: ¿Cuál de los siguientes servicios está disponible en línea en AZMVDNow.gov?
  choices:
    A: Inspecciones de vehículos de Nivel III
    B: Examen de permiso en casa (Permit Test @ Home)
    C: Capacitación de conducción al volante
    D: Clases de la Escuela de Supervivencia de Tráfico
  answer: B
  explanation: El manual enumera el 'Examen de permiso en casa' (Permit Test @ Home)
    como uno de los muchos servicios disponibles en AZMVDNow.gov.
- id: 11
  category: license_system
  question: ¿Cuál es la tarifa para obtener una Licencia de Conducir de Viaje (Travel
    Driver License) en Arizona?
  choices:
    A: $10
    B: $12
    C: $20
    D: $25
  answer: D
  explanation: Según la lista de tarifas, el costo de una Licencia de Conducir de
    Viaje es de $25.
- id: 12
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los proveedores
    externos autorizados por el MVD (Authorized Third Party)?
  choices:
    A: Solo ofrecen servicios durante el horario comercial estándar del MVD
    B: No se les permite procesar trámites de licencias de conducir
    C: A menudo ofrecen horarios extendidos los fines de semana y por las noches
    D: Realizan inspecciones de vehículos de Nivel III
  answer: C
  explanation: El manual establece que los proveedores externos a menudo ofrecen horarios
    extendidos convenientes los fines de semana y por las noches.
- id: 13
  category: driver_responsibility
  question: 'Si informa un cambio de dirección en línea y desea que su nueva dirección
    aparezca en su licencia de conducir física, usted debe:'
  choices:
    A: Imprimir una calcomanía temporal en casa
    B: Solicitar y comprar una licencia de reemplazo
    C: Esperar hasta su próximo ciclo de renovación
    D: Visitar una estación de policía para que la sellen
  answer: B
  explanation: Si desea que su nueva dirección aparezca en su credencial, puede solicitar
    y comprar una licencia de reemplazo.
- id: 14
  category: license_system
  question: ¿Cuál es la tarifa por un Registro de Vehículos Motorizados (Motor Vehicle
    Record) no certificado de 39 meses?
  choices:
    A: $2
    B: $3
    C: $5
    D: $7
  answer: B
  explanation: La lista de tarifas indica que el costo de un Registro de Vehículos
    Motorizados no certificado de 39 meses es de $3.
- id: 15
  category: driver_testing
  question: ¿El MVD aprueba los programas de educación vial de las escuelas secundarias
    en colaboración con qué organización?
  choices:
    A: El Consejo Nacional de Seguridad (National Safety Council)
    B: El Departamento de Educación de Arizona (Arizona Department of Education)
    C: El Departamento de Seguridad Pública (Department of Public Safety)
    D: La Administración Federal de Seguridad de Autotransportes (Federal Motor Carrier
      Safety Administration)
  answer: B
  explanation: El MVD, en colaboración con el Departamento de Educación de Arizona,
    también aprueba los programas de educación vial de las escuelas secundarias.
- id: 16
  category: license_system
  question: ¿Cómo puede informar un cambio de dirección a la División de Vehículos
    Motorizados (MVD) de Arizona?
  choices:
    A: Solo enviando un formulario en papel por correo a la sede del MVD
    B: En línea en AZMVDNow.gov
    C: Llamando a su departamento de policía local
    D: Solo en persona en una oficina externa autorizada
  answer: B
  explanation: Según el manual, puede informar un cambio de dirección en línea en
    AZMVDNow.gov proporcionando su nombre completo, nueva dirección, número de licencia
    de conducir, fecha de nacimiento y los últimos cuatro dígitos de su número de
    Seguro Social.
- id: 17
  category: license_system
  question: ¿Qué documentación se requiere para completar un cambio de nombre en su
    licencia de conducir?
  choices:
    A: Una solicitud verbal por teléfono al MVD
    B: Una carta notariada de su empleador
    C: Identificación apropiada tanto con su nombre nuevo como con el anterior
    D: Solo su nueva tarjeta de Seguro Social
  answer: C
  explanation: Para completar un cambio de nombre, debe visitar una oficina del MVD
    o una oficina externa autorizada y presentar una identificación adecuada tanto
    con su nombre nuevo como con el anterior. Todos los nombres deben ser verificables
    con los registros de la Administración del Seguro Social.
- id: 18
  category: license_system
  question: Tras ser dados de baja, el personal militar puede trabajar en Arizona
    sin obtener una licencia de conducir de Arizona por un máximo de ¿cuántos días?,
    siempre que cumplan con requisitos específicos.
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Tras ser dados de baja, el personal militar puede trabajar en Arizona
    hasta por 90 días sin obtener una licencia de conducir de Arizona si poseen una
    licencia válida de otro estado, operan un vehículo Clase D y trabajan para una
    organización que opera en varios estados.
- id: 19
  category: license_system
  question: ¿Quién es elegible para recibir una Designación de Nativo Americano (Native
    American Designation) en su licencia de conducir o tarjeta de identificación de
    Arizona?
  choices:
    A: Cualquier persona que haya nacido en el estado de Arizona
    B: Miembros inscritos de una tribu indígena reconocida federalmente ubicada en
      Arizona
    C: Cualquier individuo que haya vivido en Arizona por más de 10 años
    D: Solo individuos que residen actualmente en una reservación
  answer: B
  explanation: La Designación de Nativo Americano está disponible para los miembros
    inscritos de una tribu indígena reconocida federalmente ubicada en Arizona. Se
    requiere una nueva solicitud y fotografía.
- id: 20
  category: license_system
  question: De acuerdo con la ley de Arizona, ¿de qué debe presentar pruebas un solicitante
    antes de que el MVD emita una licencia de conducir o tarjeta de identificación?
  choices:
    A: Prueba de empleo a tiempo completo en Arizona
    B: Prueba de un diploma de escuela secundaria o equivalente
    C: Prueba de que la presencia del solicitante en los Estados Unidos está autorizada
      bajo la ley federal
    D: Prueba de registro de votante activo en el estado
  answer: C
  explanation: Los Estatutos Revisados de Arizona requieren que el MVD no emita ni
    renueve una licencia de conducir o tarjeta de identificación a una persona que
    no presente pruebas satisfactorias de que su presencia en los Estados Unidos está
    autorizada bajo la ley federal.
- id: 21
  category: driver_testing
  question: ¿Antes de realizar el examen de conducir, debe demostrar que puede responder
    a instrucciones de manejo específicas en qué idioma?
  choices:
    A: Español
    B: Inglés
    C: Cualquier idioma de su elección
    D: Tanto inglés como español
  answer: B
  explanation: Antes de poder realizar el examen de conducir, deberá responder a instrucciones
    específicas (como 'Pare', 'Reduzca la velocidad', 'Cambie de carril') en inglés.
- id: 22
  category: vehicle_information
  question: Si su vehículo es un modelo del año ____ o más reciente, debe estar equipado
    con cinturones de seguridad debidamente abrochados y ajustados para ser utilizado
    en el examen de conducir.
  choices:
    A: '1968'
    B: '1972'
    C: '1980'
    D: '1995'
  answer: B
  explanation: El manual establece que si su vehículo es un modelo de 1972 o más reciente,
    debe estar equipado con cinturones de seguridad, y estos deben estar debidamente
    abrochados y ajustados durante el examen de conducir.
- id: 23
  category: driver_testing
  question: ¿Cuál es la política del MVD sobre el uso de Sistemas Avanzados de Asistencia
    al Conductor (ADAS), como el manejo automático o la asistencia de estacionamiento,
    durante el examen de conducir?
  choices:
    A: Son obligatorios para la parte de estacionamiento en paralelo del examen
    B: Se permiten solo si el examinador da su aprobación previa
    C: Están estrictamente prohibidos y todas las maniobras deben realizarse manualmente
    D: Se pueden usar libremente si el vehículo es un modelo 2020 o más reciente
  answer: C
  explanation: Los Sistemas Avanzados de Asistencia al Conductor (ADAS) del vehículo,
    incluidos el manejo automático y la asistencia de estacionamiento, están prohibidos
    durante el examen de conducir. Todas las maniobras deben realizarse manualmente.
- id: 24
  category: driver_responsibility
  question: ¿Cuál es el nivel mínimo de seguro de responsabilidad civil por daños
    a la propiedad requerido para vehículos de pasajeros privados en Arizona?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: B
  explanation: El nivel mínimo de responsabilidad financiera para vehículos de pasajeros
    privados incluye $15,000 por responsabilidad por daños a la propiedad.
- id: 25
  category: driver_responsibility
  question: ¿Cuál es el requisito mínimo de seguro de responsabilidad civil por lesiones
    corporales para una persona en Arizona?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: El nivel mínimo de responsabilidad financiera para vehículos de pasajeros
    privados incluye $25,000 de responsabilidad por lesiones corporales para una persona.
- id: 26
  category: license_system
  question: ¿Qué sucede si solicita una licencia de conducir de Arizona y el Registro
    Nacional de Conductores (National Driver Register) muestra que tiene acciones
    pendientes o no resueltas en otro estado?
  choices:
    A: Se le expedirá una licencia restringida de Arizona
    B: No se le expedirá una licencia de Arizona
    C: Debe pagar una multa al MVD de Arizona para limpiar el registro
    D: Se le expedirá una licencia temporal de 30 días
  answer: B
  explanation: Arizona verifica su información con el Registro Nacional de Conductores.
    Si tiene acciones pendientes o no resueltas en otro estado, no se le expedirá
    una licencia de Arizona.
- id: 27
  category: license_system
  question: Según la ley de Arizona, se le considera residente y debe obtener una
    licencia de conducir de Arizona de inmediato si permanece en el estado por un
    total de ¿cuántos meses durante cualquier año calendario?
  choices:
    A: Tres meses
    B: Cinco meses
    C: Siete meses
    D: Nueve meses
  answer: C
  explanation: La ley estatal exige que obtenga una licencia de conducir y el registro
    de Arizona de inmediato si permanece en Arizona por un total de siete meses o
    más durante cualquier año calendario, independientemente de su residencia permanente.
- id: 28
  category: license_system
  question: ¿Se considera residente de Arizona a un estudiante de otro estado inscrito
    con siete o más horas semestrales si también tiene empleo en el estado?
  choices:
    A: Sí, porque tiene empleo en Arizona
    B: Sí, porque está inscrito en la escuela
    C: No, no se le considera residente
    D: Solo si vive fuera del campus
  answer: C
  explanation: El manual especifica que un 'estudiante de otro estado' inscrito con
    siete o más horas semestrales no se considera residente, incluso si tiene empleo.
- id: 29
  category: penalties_and_points
  question: ¿Cuál es la sanción por presentar una solicitud de registro de votante
    falsa?
  choices:
    A: Un delito menor de Clase 1
    B: Un delito grave de Clase 6
    C: Una multa de $500
    D: Suspensión de los privilegios de conducir por un año
  answer: B
  explanation: De acuerdo con la sección de registro de votantes del manual, presentar
    un registro de votante falso es un delito grave de Clase 6.
- id: 30
  category: license_system
  question: 'Para registrarse para votar en Arizona, debe cumplir con todos los siguientes
    requisitos EXCEPTO:'
  choices:
    A: Ser ciudadano de los Estados Unidos
    B: Ser residente de Arizona
    C: Poseer una licencia de conducir de Arizona válida
    D: Tener 18 años de edad o más en o antes de la próxima Elección General
  answer: C
  explanation: Para registrarse para votar, debe tener 18 años para la próxima Elección
    General, ser ciudadano de los EE. UU., ser residente de AZ, no haber sido condenado
    por un delito grave (a menos que se hayan restaurado sus derechos) y no haber
    sido declarado incompetente por un tribunal. Poseer una licencia de conducir de
    Arizona válida no es un requisito para registrarse para votar.
- id: 31
  category: driver_responsibility
  question: ¿Cuántos días antes de una elección debe estar registrado para votar a
    fin de calificar para votar en esa próxima elección?
  choices:
    A: 15 días
    B: 29 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Según el manual, debe estar registrado para votar 29 días antes de
    una elección para calificar para votar en la próxima elección.
- id: 32
  category: license_system
  question: 'Para obtener un código médico en su licencia por una condición que requiera
    atención inmediata, debe presentar una declaración firmada por un:'
  choices:
    A: Médico con licencia o enfermero practicante registrado
    B: Farmacéutico o técnico médico
    C: Padre o tutor legal
    D: Administrador de hospital
  answer: A
  explanation: El manual establece que debe presentar una declaración sobre la condición
    médica, firmada por un médico con licencia o un enfermero practicante registrado
    para obtener un código médico en su licencia.
- id: 33
  category: license_system
  question: Según las leyes estatales de Arizona y las leyes federales, ¿por qué se
    requiere su número de Seguro Social al solicitar una licencia de conducir?
  choices:
    A: Para ser usado como su número de licencia de conducir
    B: Para verificar su identidad y cumplir con las leyes de manutención infantil
    C: Para verificar su puntaje de crédito para fines de seguro
    D: Para registrarlo en el Sistema de Servicio Selectivo
  answer: B
  explanation: Las leyes estatales y federales requieren prueba de un número de Seguro
    Social válido, el cual se utilizará para verificar su identidad y cumplir con
    las leyes de manutención infantil. No se utilizará como su número de licencia
    de conducir.
- id: 34
  category: license_system
  question: ¿Cuál es la edad mínima requerida para que se le otorgue un permiso de
    instrucción graduado y/o de motocicleta en Arizona?
  choices:
    A: 15 años
    B: 15 años y 6 meses de edad
    C: 16 años
    D: 18 años de edad
  answer: B
  explanation: Si tiene al menos 15 años y 6 meses de edad, se le puede otorgar un
    permiso de instrucción graduado y/o de motocicleta.
- id: 35
  category: license_system
  question: 'Al conducir con un permiso de instrucción graduado o de operador, debe
    estar acompañado en el asiento delantero por un conductor con licencia que tenga
    al menos:'
  choices:
    A: 18 años de edad
    B: 21 años de edad
    C: 25 años de edad
    D: 50 años de edad
  answer: B
  explanation: Para un permiso graduado o de operador, debe estar acompañado por un
    conductor con licencia Clase A, B, C o D de al menos 21 años de edad, que ocupe
    el asiento a su lado.
- id: 36
  category: safe_driving_rules
  question: 'Un conductor con un permiso de instrucción de motocicleta tiene prohibido
    operar una motocicleta en autopistas o carreteras interestatales:'
  choices:
    A: En cualquier momento del día
    B: Entre la puesta del sol y el amanecer
    C: Durante el tráfico de las horas pico
    D: Al transportar a más de un pasajero
  answer: B
  explanation: Los titulares de permisos de motocicleta tienen prohibido operar una
    motocicleta en autopistas o carreteras interestatales entre la puesta del sol
    y el amanecer.
- id: 37
  category: license_system
  question: 'Durante los primeros 6 meses de tener una licencia de conducir graduada
    (Clase G), un conductor no deberá conducir un vehículo motorizado entre las horas
    de la medianoche y las 5:00 a.m., a menos que:'
  choices:
    A: Esté conduciendo en una autopista o carretera interestatal
    B: Esté acompañado por cualquier conductor con licencia mayor de 18 años
    C: Esté conduciendo directamente hacia o desde una actividad escolar sancionada
    D: Haya completado un curso de Manejo Defensivo
  answer: C
  explanation: Durante los primeros 6 meses, un conductor con una licencia de conducir
    graduada no deberá conducir entre la medianoche y las 5:00 a.m., a menos que esté
    acompañado por un padre/tutor o conduzca directamente hacia/desde una actividad
    escolar sancionada, lugar de empleo, actividad religiosa o emergencia familiar.
- id: 38
  category: license_system
  question: 'Durante los primeros 6 meses de tener una licencia de conducir graduada,
    no puede conducir con más de un pasajero menor de 18 años a menos que:'
  choices:
    A: Los pasajeros sean hermanos del conductor adolescente
    B: Los pasajeros sean compañeros de clase que viajan a la escuela
    C: La conducción se realice durante las horas del día
    D: El conductor adolescente haya tenido un permiso de instrucción durante 12 meses
  answer: A
  explanation: Durante los primeros 6 meses, un conductor con una licencia de conducir
    graduada no deberá conducir un vehículo motorizado que contenga más de un pasajero
    menor de 18 años, a menos que los pasajeros sean hermanos del conductor adolescente
    o esté acompañado por un padre/tutor.
- id: 39
  category: driver_testing
  question: Si un solicitante de una licencia graduada no completa un programa de
    educación vial aprobado por Arizona, su padre o tutor debe certificar que ha completado
    al menos ¿cuántas horas de práctica de manejo supervisada?
  choices:
    A: 20 horas, incluyendo 5 horas de noche
    B: 30 horas, incluyendo al menos 10 horas de noche
    C: 40 horas, incluyendo al menos 15 horas de noche
    D: 50 horas, incluyendo al menos 10 horas de noche
  answer: B
  explanation: El padre o tutor debe certificar por escrito que el solicitante ha
    completado al menos 30 horas de práctica de manejo supervisada, incluyendo al
    menos 10 horas de noche (a menos que haya completado una alternativa específica
    de 20 horas).
- id: 40
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor menor de 18 años con una licencia
    de conducir graduada que recibe su primera condena por una infracción de tráfico?
  choices:
    A: Una suspensión de 3 meses de los privilegios de conducir
    B: Una suspensión de 6 meses de los privilegios de conducir
    C: Asistencia obligatoria a la Escuela de Supervivencia de Tráfico (Traffic Survival
      School)
    D: Cancelación inmediata de la licencia de conducir
  answer: C
  explanation: Para los conductores menores de 18 años con una licencia de conducir
    graduada, la primera condena por una infracción de tráfico requiere que asistan
    a la Escuela de Supervivencia de Tráfico (Traffic Survival School), y la infracción
    se registra en su historial de manejo.
- id: 41
  category: penalties_and_points
  question: 'Si un conductor menor de 18 años con una licencia de conducir graduada
    (GDL) recibe una segunda condena por una infracción de tráfico, su privilegio
    de conducir será suspendido por:'
  choices:
    A: 1 mes
    B: 3 meses
    C: 6 meses
    D: 12 meses
  answer: B
  explanation: Una segunda condena por una infracción de tráfico para un conductor
    menor de 18 años con una licencia de conducir graduada resulta en una suspensión
    de 3 meses de los privilegios de conducir.
- id: 42
  category: driver_responsibility
  question: 'Cuando un adulto firma la solicitud de un permiso de instrucción o licencia
    de conducir para un solicitante menor de 18 años, el adulto:'
  choices:
    A: Debe viajar en el vehículo en todo momento
    B: Se hace responsable de cualquier negligencia o mala conducta intencional cuando
      el menor esté conduciendo
    C: Debe pagar el seguro del vehículo del menor directamente al MVD
    D: No puede cancelar la licencia del menor una vez emitida
  answer: B
  explanation: Si es menor de 18 años, su solicitud debe estar firmada por al menos
    un adulto. El adulto será responsable de cualquier negligencia o mala conducta
    intencional cuando usted esté conduciendo.
- id: 43
  category: license_system
  question: 'La ley de Arizona exige que los solicitantes varones menores de 26 años
    den su consentimiento para registrarse en el Servicio Selectivo al presentar una
    solicitud para:'
  choices:
    A: Solo un duplicado de la licencia de conducir
    B: Una licencia de conducir original, de renovación o de restablecimiento
    C: Solo una licencia de conducir comercial (CDL)
    D: Una tarjeta de registro de votante
  answer: B
  explanation: La ley de Arizona exige que, al presentar una solicitud para una licencia
    de conducir o tarjeta de identificación original, de renovación o de restablecimiento,
    los solicitantes varones menores de 26 años den su consentimiento para registrarse
    en el Servicio Selectivo.
- id: 44
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar una licencia de operador
    (Clase D) en Arizona?
  choices:
    A: 16 años de edad
    B: 18 años de edad
    C: 21 años de edad
    D: 25 años de edad
  answer: B
  explanation: Una licencia de operador (Clase D) le permite conducir cualquier vehículo
    que no requiera una licencia de motocicleta o comercial. Debe tener al menos 18
    años de edad para solicitar una licencia de operador.
- id: 45
  category: safe_driving_rules
  question: 'A un conductor con un permiso de instrucción de motocicleta se le prohíbe
    operar una motocicleta cuando no hay suficiente luz para ver claramente a personas
    o vehículos a una distancia de:'
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: A los titulares de permisos de motocicleta se les prohíbe operar una
    motocicleta en cualquier momento en que no haya suficiente luz para ver claramente
    a personas o vehículos a una distancia de 500 pies.
- id: 46
  category: license_system
  question: Si es menor de 18 años, ¿cuánto tiempo debe tener un permiso de instrucción
    de motocicleta de Arizona antes de solicitar una licencia de motocicleta?
  choices:
    A: Al menos 3 meses
    B: Al menos 6 meses
    C: Al menos 9 meses
    D: Al menos 12 meses
  answer: B
  explanation: Un solicitante de una licencia o endoso de motocicleta que sea menor
    de 18 años debe haber tenido un permiso de instrucción de motocicleta de Arizona
    durante al menos seis meses.
- id: 47
  category: license_system
  question: ¿Cuál de los siguientes vehículos requiere una Licencia de Conducir Comercial
    (CDL) Clase C?
  choices:
    A: Un solo vehículo con un GVWR de 26,001 libras o más.
    B: Un vehículo que remolca a otro vehículo de más de 10,000 libras.
    C: Un vehículo diseñado para transportar a 16 o más pasajeros, incluido el conductor.
    D: Cualquier motocicleta o ciclo impulsado por motor.
  answer: C
  explanation: Se requiere una CDL Clase C para un vehículo diseñado para transportar
    a 16 o más pasajeros, incluido el conductor, o uno utilizado en el transporte
    de materiales peligrosos que requieran señalización (placarding).
- id: 48
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a una tarjeta
    de identificación (ID) de Arizona?
  choices:
    A: Debe tener al menos 16 años para obtener una.
    B: Puede poseer una tarjeta de identificación y una licencia de conducir al mismo
      tiempo.
    C: Es gratuita para personas mayores de 65 años.
    D: Cuesta $25 por una tarjeta duplicada.
  answer: C
  explanation: El manual establece que las personas mayores de 65 años o cualquier
    persona que reciba cheques de discapacidad del Ingreso de Seguridad Suplementario
    Federal reciben la tarjeta de identificación de forma gratuita.
- id: 49
  category: license_system
  question: ¿Hasta qué fecha serán suficientes las credenciales actuales de Arizona
    que no cumplen con las normas federales para pasar por la seguridad del aeropuerto?
  choices:
    A: 7 de mayo de 2025
    B: 1 de enero de 2024
    C: 1 de octubre de 2026
    D: 31 de diciembre de 2025
  answer: A
  explanation: Las credenciales actuales de Arizona serán suficientes para pasar por
    la seguridad del aeropuerto para abordar aeronaves comerciales hasta el 7 de mayo
    de 2025.
- id: 50
  category: license_system
  question: ¿Cómo se distinguen visualmente las identificaciones de viaje (Travel
    ID) que cumplen con las normas federales de las credenciales que no cumplen?
  choices:
    A: Están impresas en plástico azul.
    B: Tienen una insignia en forma de estrella amarilla cerca de la esquina superior
      derecha.
    C: Presentan un holograma del ave estatal.
    D: Tienen un borde rojo alrededor de la fotografía.
  answer: B
  explanation: Todas las credenciales que cumplen con las normas federales se imprimirán
    con una insignia en forma de estrella amarilla cerca de la esquina superior derecha
    de la credencial.
- id: 51
  category: license_system
  question: ¿Qué se requiere para demostrar su residencia al solicitar una licencia
    de conducir o identificación de viaje (Travel DL/ID)?
  choices:
    A: Un documento que muestre su nombre y dirección postal.
    B: Dos documentos emitidos por una empresa, organización o agencia gubernamental
      que contengan su nombre y dirección residencial física.
    C: Un juramento verbal de residencia.
    D: Un pasaporte estadounidense válido.
  answer: B
  explanation: La prueba de residencia requiere dos documentos o correspondencia emitida
    por una empresa, organización o agencia gubernamental que contenga el nombre del
    solicitante y su dirección residencial física.
- id: 52
  category: license_system
  question: ¿Bajo qué circunstancia DEBE visitar una oficina del MVD para obtener
    un duplicado de la licencia en lugar de obtenerlo en línea?
  choices:
    A: Si su licencia tiene más de 12 años.
    B: Si le robaron la licencia.
    C: Si cambió su dirección.
    D: Si desea convertir una licencia para menores de 21 años en una licencia regular.
  answer: A
  explanation: Si su licencia tiene más de 12 años, debe visitar una oficina del MVD
    para obtener el duplicado y así poder actualizar su fotografía.
- id: 53
  category: vehicle_information
  question: Según la ley de Arizona, ¿cuántos días tiene para solicitar un título
    después de comprar o transferir un vehículo?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: Cuando compra un vehículo, la ley de Arizona exige que solicite un
    título dentro de los 15 días posteriores a la compra o transferencia.
- id: 54
  category: vehicle_information
  question: ¿Qué vehículos son elegibles para una opción de registro de 5 años en
    Arizona?
  choices:
    A: Todos los vehículos motorizados comerciales.
    B: Vehículos que no requieren una prueba de emisiones durante los cinco años del
      período de registro.
    C: Cualquier vehículo registrado por una persona mayor de 65 años.
    D: Vehículos que han sido registrados previamente en otro estado.
  answer: B
  explanation: Se ofrece una opción de registro de 5 años para los vehículos que no
    requieren una prueba de emisiones durante los cinco años del período de registro.
- id: 55
  category: vehicle_information
  question: ¿Cuál de los siguientes NO figura explícitamente en el manual como equipo
    que debe estar en buen estado de funcionamiento antes de conducir?
  choices:
    A: Parabrisas (intacto)
    B: Aire acondicionado
    C: Luces de emergencia
    D: Bocina
  answer: B
  explanation: El manual enumera los frenos, el velocímetro, las señales de giro,
    el parabrisas (intacto), la bocina, los neumáticos, los cinturones de seguridad,
    las ventanas laterales del conductor y del pasajero delantero, y las luces de
    emergencia como equipo que debe estar en buen estado de funcionamiento. El aire
    acondicionado no figura en la lista.
- id: 56
  category: safe_driving_rules
  question: ¿Qué debe revisar inmediatamente antes de poner el vehículo en movimiento?
  choices:
    A: Sus señales de giro y frenos para asegurarse de que funcionen correctamente.
    B: Los niveles de aceite del motor y de refrigerante.
    C: La profundidad de la banda de rodadura de los cuatro neumáticos usando una
      moneda de un centavo.
    D: Que todas las ventanas de los pasajeros estén bajadas.
  answer: A
  explanation: Antes de poner el vehículo en movimiento, revise sus señales de giro
    y frenos para asegurarse de que funcionen correctamente.
- id: 57
  category: vehicle_information
  question: ¿Cómo puede comprobar la profundidad de la banda de rodadura de sus neumáticos
    mediante la 'prueba del centavo'?
  choices:
    A: Deje caer una moneda de un centavo desde la altura de la cintura sobre el neumático
      para ver si rebota.
    B: Coloque la cabeza de Abraham Lincoln en una de las ranuras; parte de su cabeza
      debe quedar cubierta.
    C: Deslice una moneda de un centavo a lo largo de la pared lateral para buscar
      grietas.
    D: Coloque una moneda de un centavo sobre la válvula del neumático para comprobar
      si hay fugas de aire.
  answer: B
  explanation: Puede comprobar el desgaste mediante la prueba del centavo. Coloque
    la cabeza de Abraham Lincoln en una de las ranuras. Parte de la cabeza de Lincoln
    debe quedar cubierta por la banda de rodadura.
- id: 58
  category: vehicle_information
  question: ¿Dónde puede encontrar normalmente la presión recomendada para los neumáticos
    (psi) de su vehículo?
  choices:
    A: En el volante
    B: En la placa de matrícula del vehículo
    C: En el marco de la puerta
    D: En la escobilla del limpiaparabrisas
  answer: C
  explanation: Busque los psi (libras por pulgada cuadrada) recomendados para su vehículo,
    normalmente en el marco de la puerta.
- id: 59
  category: safe_driving_rules
  question: Según la Ley de Cinturones de Seguridad de Arizona, ¿quién debe tener
    un cinturón de regazo y de hombro correctamente ajustado y abrochado?
  choices:
    A: Solo el conductor
    B: Cada ocupante del asiento delantero de un vehículo motorizado
    C: Solo los pasajeros menores de 18 años
    D: Solo los pasajeros que viajan en el asiento trasero
  answer: B
  explanation: Cada ocupante del asiento delantero de un vehículo motorizado, según
    las normas de seguridad de vehículos motorizados federales y estatales, debe tener
    el cinturón de regazo y de hombro correctamente ajustado y abrochado.
- id: 60
  category: vehicle_information
  question: ¿Cómo puede utilizar la 'prueba del centavo' para comprobar el desgaste
    de sus neumáticos?
  choices:
    A: Coloque la moneda de un centavo plana contra la pared lateral del neumático.
    B: Coloque la cabeza de Abraham Lincoln en una ranura de la banda de rodadura
      para ver si parte de ella queda cubierta.
    C: Deje caer la moneda de un centavo desde un pie por encima del neumático para
      comprobar su rebote.
    D: Raye la banda de rodadura con la moneda para comprobar la dureza del caucho.
  answer: B
  explanation: El manual indica que debe seleccionar un punto en el neumático donde
    la banda de rodadura parezca más baja y colocar la cabeza de Abraham Lincoln en
    una de las ranuras. Parte de su cabeza debe quedar cubierta por la banda de rodadura.
- id: 61
  category: safe_driving_rules
  question: Según la ley de Arizona, ¿el operador de un vehículo motorizado debe exigir
    que todos los pasajeros menores de qué edad se abrochen el cinturón?
  choices:
    A: 12 años de edad
    B: 14 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: C
  explanation: El manual especifica que el operador de un vehículo motorizado debe
    exigir que todos los pasajeros menores de 16 años se abrochen el cinturón de seguridad.
- id: 62
  category: vehicle_information
  question: ¿Cuál es la función principal del cinturón de regazo en un sistema combinado
    de cinturón de regazo y hombro?
  choices:
    A: Evita que su cabeza golpee el parabrisas.
    B: Evita la expulsión y protege la parte inferior del cuerpo.
    C: Ajusta automáticamente la posición del asiento.
    D: Desactiva la bolsa de aire (airbag) en una colisión menor.
  answer: B
  explanation: Según el manual, el cinturón de regazo evita la expulsión y protege
    la parte inferior del cuerpo, mientras que el cinturón de hombro evita que la
    cabeza y el pecho golpeen el tablero o el parabrisas.
- id: 63
  category: safe_driving_rules
  question: 'La ley de Arizona exige que un niño esté debidamente asegurado en un
    sistema de retención infantil si es menor de:'
  choices:
    A: Tres años
    B: Cuatro años
    C: Cinco años
    D: Seis años
  answer: C
  explanation: La ley de Arizona establece que una persona no debe operar un vehículo
    motorizado cuando transporte a un niño menor de cinco años, a menos que dicho
    niño esté debidamente asegurado en un sistema de retención infantil.
- id: 64
  category: safe_driving_rules
  question: ¿Hasta qué altura mínima deben permanecer en un sistema de retención infantil
    los niños de entre cinco y ocho años de edad?
  choices:
    A: 4 pies, 5 pulgadas
    B: 4 pies, 9 pulgadas
    C: 5 pies, 0 pulgadas
    D: 5 pies, 2 pulgadas
  answer: B
  explanation: El manual establece que los niños de entre cinco y ocho años de edad
    deben estar en un sistema de retención infantil hasta que alcancen una altura
    mínima de cuatro pies y nueve pulgadas.
- id: 65
  category: safe_driving_rules
  question: ¿Los niños de qué edad nunca deben viajar en el asiento delantero de un
    automóvil debido al peligro de las bolsas de aire (air bags)?
  choices:
    A: 8 años o menos
    B: 10 años o menos
    C: 12 años o menos
    D: 15 años o menos
  answer: C
  explanation: Las bolsas de aire (air bags) no son seguras para niños menores de
    12 años. El manual establece explícitamente que los niños de 12 años o menos nunca
    deben viajar en el asiento delantero de un automóvil.
- id: 66
  category: driver_responsibility
  question: ¿A qué número puede llamar en cualquier momento, de día o de noche, para
    obtener informes actualizados sobre las condiciones del tráfico y el cierre de
    carreteras en Arizona?
  choices:
    A: '211'
    B: '311'
    C: '411'
    D: '511'
  answer: D
  explanation: Los viajeros pueden marcar el 511 en cualquier momento, de día o de
    noche, para obtener informes actualizados sobre las condiciones del tráfico, cierres
    de carreteras, transporte público y más.
- id: 67
  category: vehicle_information
  question: Si su vehículo no pasa una inspección de emisiones en una estación autorizada,
    ¿cuántos días se le otorgan para solucionar el problema y obtener una nueva revisión?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Si el vehículo no pasa la inspección de emisiones, se le darán 30 días
    para que se solucione el problema y se realice una nueva prueba de emisiones de
    seguimiento.
- id: 68
  category: safe_driving_rules
  question: 'La ley de Arizona establece que un vehículo debe estar construido o cargado
    de manera que se evite que su carga:'
  choices:
    A: Exceda la altura del techo del vehículo
    B: Se caiga, se filtre, se derrame o se escape de cualquier otra forma
    C: Desplace el peso hacia el eje trasero
    D: Bloquee la vista del conductor hacia el tablero
  answer: B
  explanation: Según la ley de Arizona, una persona no debe conducir ni mover un vehículo
    a menos que esté construido o cargado de manera que se evite que cualquier parte
    de su carga se caiga, se filtre, se derrame o se escape de cualquier otra forma.
- id: 69
  category: vehicle_information
  question: ¿Cuáles son los requisitos de frenos para automóviles y camiones en Arizona?
  choices:
    A: Deben tener un sistema de frenado automático.
    B: Deben tener tanto un freno de pie como un freno de estacionamiento.
    C: Solo requieren un freno de pie que se aplique a las cuatro ruedas.
    D: Deben tener un freno de mano y un freno de motor.
  answer: B
  explanation: El manual establece que todo vehículo motorizado debe tener frenos
    en buenas condiciones de funcionamiento, y los automóviles y camiones deben tener
    tanto un freno de pie como un freno de estacionamiento.
- id: 70
  category: vehicle_information
  question: 'Para reducir adecuadamente la posibilidad de una lesión por latigazo
    cervical, el reposacabezas ajustable del respaldo del asiento debe colocarse de
    modo que quede alineado con:'
  choices:
    A: La base del cuello
    B: La parte superior de los hombros
    C: La parte media de la oreja
    D: La parte superior de la cabeza
  answer: C
  explanation: Si los reposacabezas son ajustables, deben colocarse de modo que se
    ajusten a la parte posterior de la cabeza y queden alineados con la parte media
    de la oreja.
- id: 71
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los silenciadores
    (mufflers) en los vehículos motorizados?
  choices:
    A: Los 'recortes' (cut-outs) o derivaciones (bypasses) del silenciador son ilegales.
    B: Los silenciadores solo son obligatorios en vehículos fabricados después de
      1967.
    C: Los silenciadores pueden retirarse si el vehículo se conduce fuera de los límites
      de la ciudad.
    D: Se permite una derivación del silenciador solo para vehículos de emergencia.
  answer: A
  explanation: Todo vehículo motorizado debe tener un silenciador en buen estado de
    funcionamiento. El manual establece que es contra la ley usar un 'recorte' (cut-out),
    derivación (bypass) o dispositivo similar en el silenciador.
- id: 72
  category: vehicle_information
  question: Si un vehículo está cargado de manera que la vista del conductor hacia
    atrás esté bloqueada, ¿qué se requiere?
  choices:
    A: Un pasajero que actúe como observador
    B: Un espejo exterior en el lado del conductor que muestre la carretera al menos
      200 pies hacia atrás
    C: Un sistema de cámara de visión trasera con un monitor en el tablero
    D: Dos espejos exteriores que muestren la carretera al menos 500 pies hacia atrás
  answer: B
  explanation: Todo vehículo fabricado o cargado de manera que la vista del conductor
    hacia atrás esté bloqueada debe tener al menos un espejo exterior en el lado del
    conductor que muestre la vista de la carretera al menos 200 pies hacia atrás.
- id: 73
  category: safe_driving_rules
  question: ¿Cuándo debe activar sus luces de advertencia de peligro (luces de emergencia)?
  choices:
    A: Al conducir bajo lluvia intensa o niebla
    B: Siempre que su vehículo esté detenido en la calzada o en el acotamiento (shoulder)
      de la carretera
    C: Cuando conduce por debajo del límite de velocidad indicado
    D: Cuando está saliendo de una entrada privada en reversa
  answer: B
  explanation: Las luces de advertencia de peligro (luces de emergencia) deben activarse
    siempre que su vehículo esté detenido en la calzada o en el acotamiento de la
    carretera.
- id: 74
  category: defensive_driving
  question: Según el manual, ¿cuáles son las actitudes de conducción más importantes
    que puede desarrollar para una conducción segura?
  choices:
    A: Confianza y velocidad
    B: Agresividad y asertividad
    C: Cortesía y consideración hacia los demás
    D: Relajación y despreocupación
  answer: C
  explanation: El manual establece que la cortesía y la consideración hacia los demás
    son las actitudes de conducción más importantes que puede desarrollar y son la
    clave para una conducción segura.
- id: 75
  category: driver_responsibility
  question: Según la ley de Arizona, ¿cuándo es permisible usar un dispositivo inalámbrico
    portátil mientras se conduce?
  choices:
    A: Al leer un mensaje de texto en un semáforo en rojo
    B: Al informar una emergencia
    C: Al atender a los niños en el asiento trasero
    D: Al grabar un video de un peligro de tráfico
  answer: B
  explanation: La ley de Arizona prohíbe sostener o sujetar un dispositivo inalámbrico
    mientras se conduce, pero se puede usar un dispositivo inalámbrico al conducir
    para informar una emergencia.
- id: 76
  category: safe_driving_rules
  question: Para ayudar a mantenerse dentro de su carril de circulación al conducir
    en una curva o giro, ¿hacia dónde debe mirar?
  choices:
    A: Directamente al vehículo que está delante de usted
    B: Generalmente hacia el interior de su carril de circulación
    C: Generalmente hacia el exterior de su carril de circulación
    D: A su espejo retrovisor
  answer: C
  explanation: Al conducir en una curva o giro, si mira generalmente hacia el exterior
    de su carril de circulación mientras está en la curva, es más probable que permanezca
    dentro de su carril.
- id: 77
  category: defensive_driving
  question: Para evitar la necesidad de tomar decisiones de último momento, ¿qué tan
    adelante debe mirar en la carretera?
  choices:
    A: Aproximadamente una cuadra de la ciudad
    B: Aproximadamente la longitud de tres autos
    C: Aproximadamente 100 pies
    D: Aproximadamente media milla
  answer: A
  explanation: Mantenga sus ojos en movimiento y aprenda a 'leer' la carretera. Para
    evitar la necesidad de tomar decisiones de último momento, mire hacia adelante
    a una distancia de aproximadamente una cuadra de la ciudad.
- id: 78
  category: safe_driving_rules
  question: ¿Qué regla debe usar para determinar si tiene suficiente espacio de seguridad
    (cushion) entre usted y el vehículo que sigue?
  choices:
    A: La regla de 1 a 2 segundos
    B: La regla de 3 a 6 segundos
    C: La regla de la longitud de un auto por cada 10 mph
    D: La regla de los 100 pies
  answer: B
  explanation: Puede usar la regla de '3 a 6 segundos' para determinar si tiene suficiente
    espacio de seguridad entre usted y el vehículo que sigue.
- id: 79
  category: defensive_driving
  question: Según el manual, ¿cuál es la causa de la mayoría de los choques por alcance
    (traseros)?
  choices:
    A: Conducción distraída
    B: Exceso de velocidad en malas condiciones climáticas
    C: Seguir a otro vehículo demasiado cerca
    D: No usar las luces direccionales
  answer: C
  explanation: Si sigue a otro vehículo demasiado cerca, es posible que no pueda detenerse
    a tiempo. La mayoría de los choques por alcance son causados por seguir demasiado
    cerca.
- id: 80
  category: sharing_the_road
  question: Al compartir un carril con una bicicleta, ¿cuál es el espacio libre mínimo
    que debe dejar entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: Al compartir un carril con una bicicleta, deje al menos 3 pies de espacio
    libre entre usted y la bicicleta.
- id: 81
  category: defensive_driving
  question: ¿Qué debe hacer si otro conductor lo sigue demasiado de cerca (tailgating)?
  choices:
    A: Tocar los frenos rápidamente para advertirle
    B: Acelerar para aumentar la distancia entre ustedes
    C: Reducir la velocidad gradualmente para dejar un margen adicional delante de
      usted
    D: Encender las luces de emergencia y mantener su velocidad
  answer: C
  explanation: Si otro conductor lo sigue demasiado de cerca, reduzca la velocidad
    gradualmente y deje un margen adicional entre usted y el vehículo de adelante.
    Esto le permite frenar más lentamente para adaptarse al tiempo de reacción y al
    frenado del vehículo que lo sigue de cerca.
- id: 82
  category: safe_driving_rules
  question: Al esperar para entrar en una carretera desde un camino lateral, ¿qué
    debe hacer si un vehículo que se aproxima tiene encendida la luz de giro?
  choices:
    A: Avanzar de inmediato ya que el vehículo va a girar
    B: Esperar hasta ver que el otro conductor inicie el giro antes de entrar
    C: Tocar la bocina para asegurarse de que lo vean antes de salir
    D: Salir rápidamente antes de que completen su giro
  answer: B
  explanation: No asuma que un vehículo o una motocicleta que usa una luz de giro
    realmente va a realizar un giro; espere hasta ver que el otro conductor inicie
    el giro antes de entrar en la carretera.
- id: 83
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe señalizar antes de realizar un giro?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: La ley designa qué carriles y posiciones debe usar al girar y exige
    que señalice al menos 100 pies antes de girar.
- id: 84
  category: safe_driving_rules
  question: Si planea girar hacia una entrada privada que se encuentra justo después
    de una intersección, ¿cuándo debe comenzar a señalizar?
  choices:
    A: 100 pies antes de la intersección
    B: 50 pies antes de la intersección
    C: Solo después de estar en la intersección
    D: Después de haber pasado completamente la intersección
  answer: C
  explanation: Si planea girar después de una intersección, no señalice hasta que
    esté en la intersección (los conductores en la intersección podrían cruzarse en
    su camino).
- id: 85
  category: safe_driving_rules
  question: Al adelantar a otro vehículo por la izquierda, ¿cuándo es seguro regresar
    al carril derecho?
  choices:
    A: Tan pronto como el parachoques trasero de su vehículo pase el parachoques delantero
      del otro vehículo
    B: Cuando pueda ver la parte delantera completa o ambos faros del vehículo adelantado
      en su espejo retrovisor
    C: Cuando el conductor del vehículo adelantado haga parpadear sus faros
    D: Tres segundos después de haber adelantado al vehículo
  answer: B
  explanation: Cuando pueda ver la parte delantera completa o ambos faros del vehículo
    que adelantó en su espejo retrovisor, mire por encima del hombro para asegurarse
    de que el carril esté despejado, señalice que va a cambiar de carril y luego regrese
    al carril de la derecha.
- id: 86
  category: defensive_driving
  question: Debido a que los espejos por sí solos no pueden mostrarle otros vehículos
    en sus puntos ciegos, ¿qué debe hacer antes de cambiar de carril?
  choices:
    A: Tocar la bocina para alertar a los vehículos en su punto ciego
    B: Mirar por encima del hombro para ver si el camino está despejado
    C: Encender las luces de emergencia
    D: Acelerar rápidamente mientras cambia de carril
  answer: B
  explanation: No confíe solo en sus espejos para ver otros vehículos o motocicletas.
    Mire por encima del hombro para ver si el camino está despejado antes de cambiar
    de carril.
- id: 87
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de las luces de giro?
  choices:
    A: Señalizar le otorga el derecho de paso para cambiar de carril
    B: Solo necesita señalizar si ve otros vehículos en la carretera
    C: Señalizar no le otorga el derecho de paso
    D: No necesita señalizar al salir de una acera
  answer: C
  explanation: Señalizar les permite a otros conductores saber que usted va a hacer
    algo diferente y les da tiempo para reaccionar a su movimiento. Señalizar no le
    otorga el derecho de paso.
- id: 88
  category: safe_driving_rules
  question: Según el manual, ¿cuál es la posición adecuada de las manos al operar
    un vehículo motorizado?
  choices:
    A: Una mano en el volante y la otra en la palanca de cambios
    B: Ambas manos deben estar en el volante
    C: Una mano en el volante mientras la otra descansa en el marco de la ventana
    D: Solo se requiere una mano si se conduce una transmisión automática
  answer: B
  explanation: Al operar un vehículo motorizado, ambas manos deben estar en el volante,
    lo que permite al conductor tener el control total del vehículo.
- id: 89
  category: defensive_driving
  question: ¿Qué debe hacer si se encuentra conduciendo en el punto ciego de otro
    vehículo?
  choices:
    A: Mantener su velocidad y permanecer en el punto ciego
    B: Tocar la bocina continuamente hasta que lo vean
    C: Acelerar o retroceder para evitar permanecer en el punto ciego por un tiempo
      prolongado
    D: Acercarse más al vehículo para que puedan verlo en su espejo lateral
  answer: C
  explanation: Evite conducir en el punto ciego de otra persona... Acelere o retroceda,
    pero nunca permanezca por un tiempo prolongado en un área de punto ciego.
- id: 90
  category: safe_driving_rules
  question: ¿Bajo qué condición se permite adelantar por la derecha?
  choices:
    A: Cuando el vehículo de adelante viaja por debajo del límite de velocidad indicado.
    B: Conduciendo fuera de la parte pavimentada de la carretera si el arcén es lo
      suficientemente ancho.
    C: Cuando el conductor del otro vehículo está girando a la izquierda y es seguro
      hacerlo.
    D: Cuando se aproxima a menos de 100 pies de un cruce de ferrocarril.
  answer: C
  explanation: Adelantar por la derecha se permite solo cuando es seguro y el conductor
    del otro vehículo está girando a la izquierda, o en carreteras de carriles múltiples
    claramente marcadas. Nunca debe adelantar por la derecha conduciendo fuera de
    la parte pavimentada o principal de la carretera.
- id: 91
  category: safe_driving_rules
  question: ¿A cuántos pies de un cruce de calles NO debe rebasar a otro vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Según el manual, no debe rebasar cuando se aproxime a menos de 100
    pies de un cruce de calles.
- id: 92
  category: safe_driving_rules
  question: ¿Cómo debe entrar en una rotonda?
  choices:
    A: A la izquierda de la isla central.
    B: A la derecha de la isla central.
    C: Solo desde el carril central.
    D: Sin ceder el paso a los vehículos que ya están en la rotonda.
  answer: B
  explanation: El manual instruye a los conductores a entrar siempre en una rotonda
    por la derecha de la isla central y a ceder el paso a los vehículos que ya se
    encuentran en ella.
- id: 93
  category: safe_driving_rules
  question: ¿Cuál es la velocidad de diseño para conducir en una rotonda?
  choices:
    A: 5-10 mph
    B: 15-20 mph
    C: 25-30 mph
    D: 35-40 mph
  answer: B
  explanation: Debe reducir la velocidad al acercarse a la intersección, ya que las
    rotondas están diseñadas para velocidades de 15-20 mph.
- id: 94
  category: safe_driving_rules
  question: ¿Cuál es una característica clave de un Intercambio de Diamante Divergente
    (DDI)?
  choices:
    A: El tráfico en una calle transversal cambia brevemente al lado izquierdo de
      la calzada.
    B: Todo el tráfico debe detenerse en una isla central antes de continuar.
    C: Los giros a la izquierda están prohibidos en todo momento.
    D: Los vehículos deben salir de la calzada pavimentada para salir.
  answer: A
  explanation: Un DDI incluye intersecciones y señales de tráfico que permiten que
    el tráfico en una calle transversal cambie brevemente al lado izquierdo de la
    calzada para facilitar mejor el flujo de tráfico y mejorar la seguridad.
- id: 95
  category: driver_responsibility
  question: ¿Cuándo es legal estacionarse en un espacio marcado con el Símbolo Internacional
    de Accesibilidad?
  choices:
    A: Siempre que conduzca un vehículo con una placa de discapacidad, incluso si
      está solo y no es el propietario registrado.
    B: Solo cuando el vehículo exhibe un cartel (placard) o placa válida Y está transportando
      a la persona a quien se le emitió el cartel o placa.
    C: Por menos de 5 minutos mientras deja a un pasajero.
    D: Cuando no hay otros espacios de estacionamiento disponibles en el lote.
  answer: B
  explanation: Los espacios de estacionamiento marcados con este símbolo solo deben
    ser utilizados por un vehículo que exhiba un cartel o placa de matrícula válida,
    y solo cuando se transporte a la persona a quien se le emitió el cartel o la placa.
- id: 96
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento recomendado para mirar hacia atrás al retroceder
    su vehículo?
  choices:
    A: Confiar totalmente en su cámara de retroceso.
    B: Usar solo sus espejos laterales y el retrovisor.
    C: Girarse para poder mirar directamente a través de la ventana trasera.
    D: Abrir la puerta y mirar hacia atrás mientras retrocede.
  answer: C
  explanation: El manual establece que al retroceder, debe girarse para poder mirar
    directamente a través de la ventana trasera, y no depender de sus espejos o cámaras
    de retroceso.
- id: 97
  category: safe_driving_rules
  question: Al prepararse para estacionarse en paralelo, ¿cuánto espacio debe dejar
    entre su vehículo y el auto de adelante cuando alinee sus parachoques traseros?
  choices:
    A: Aproximadamente seis pulgadas
    B: Aproximadamente dos pies
    C: Aproximadamente cuatro pies
    D: Aproximadamente el largo de un auto
  answer: B
  explanation: Para estacionarse en paralelo correctamente, deténgase al lado del
    auto de adelante de modo que sus parachoques traseros queden alineados, dejando
    aproximadamente dos pies entre usted y el auto de adelante.
- id: 98
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar el volante cuando se estacione en una pendiente
    ascendente con acera?
  choices:
    A: Gire las ruedas hacia la derecha.
    B: Mantenga las ruedas rectas.
    C: Gire las ruedas hacia la izquierda.
    D: Gire las ruedas paralelas a la línea central.
  answer: C
  explanation: Si se estaciona en una pendiente ascendente con acera, gire las ruedas
    hacia la izquierda, deje que su auto ruede hacia atrás hasta que la rueda delantera
    derecha descanse contra la acera y ponga el freno de mano.
- id: 99
  category: safe_driving_rules
  question: ¿Cómo debe girar las ruedas al estacionarse en una colina donde NO hay
    acera?
  choices:
    A: Gire las ruedas hacia la izquierda.
    B: Gire las ruedas hacia la derecha.
    C: Mantenga las ruedas perfectamente rectas.
    D: No importa siempre que el freno de mano esté puesto.
  answer: B
  explanation: Si no hay acera, gire las ruedas hacia la derecha para que el auto
    ruede lejos del centro de la carretera en caso de que fallen los frenos.
- id: 100
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios es ilegal estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: B
  explanation: Según las reglas de estacionamiento prohibido en el manual, es ilegal
    estacionarse a menos de 15 pies de un hidrante de incendios.
- id: 101
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima que debe mantener al estacionar cerca de
    un paso de peatones en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: C
  explanation: Es ilegal estacionar sobre un paso de peatones o a menos de 20 pies
    de un paso de peatones en una intersección.
- id: 102
  category: safe_driving_rules
  question: ¿Qué debe hacer al entrar en una autopista?
  choices:
    A: Detenerse al final de la rampa de entrada y esperar un espacio en el tráfico.
    B: Forzar su entrada al carril derecho porque usted tiene el derecho de paso.
    C: Conducir a través del área de bifurcación (gore area) para incorporarse más
      rápido.
    D: Ceder el derecho de paso al tráfico que ya está en la autopista y ajustar su
      velocidad a la de ellos.
  answer: D
  explanation: El tráfico que entra en una autopista debe ceder el derecho de paso
    al tráfico que ya circula por ella. Debe ajustar la velocidad de su vehículo a
    la velocidad del tráfico en el carril derecho antes de incorporarse.
- id: 103
  category: safe_driving_rules
  question: Si debe dejar su vehículo de transmisión manual estacionado en una carretera
    por una emergencia, ¿qué debe hacer después de detenerse en el acotamiento?
  choices:
    A: Dejar el motor encendido para que la batería no se agote.
    B: Poner el freno de estacionamiento, dejar el vehículo en marcha y apagar el
      motor.
    C: Poner la palanca en punto muerto (neutral) y dejar el freno de estacionamiento
      suelto.
    D: Pararse en medio de la carretera para pedir ayuda con las manos.
  answer: B
  explanation: Para un estacionamiento de emergencia, debe detenerse en el acotamiento,
    poner el freno de estacionamiento, poner el vehículo en 'park' o dejarlo en marcha
    (para transmisión manual) y apagar el motor.
- id: 104
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida en la autopista?
  choices:
    A: Detenerse y dar marcha atrás con cuidado hasta la salida.
    B: Dar una vuelta en U a través del camellón o mediana.
    C: Salir en la siguiente salida y buscar señales para volver a incorporarse a
      la carretera.
    D: Detenerse en el área de bifurcación (gore area) y esperar a que el tráfico
      se despeje.
  answer: C
  explanation: 'El manual establece: ''Si se pasa de su salida, no se detenga. Nunca
    dé marcha atrás en una autopista. Salga de la autopista en la siguiente salida
    y busque las señales que le indiquen cómo volver a incorporarse a la carretera
    en la otra dirección''.'
- id: 105
  category: safe_driving_rules
  question: ¿Qué es un área de bifurcación (gore area)?
  choices:
    A: El carril del extremo izquierdo utilizado exclusivamente para rebasar.
    B: El espacio entre una carretera principal y una rampa de entrada o salida.
    C: Un área de estacionamiento designada para vehículos averiados en la autopista.
    D: Una intersección con un semáforo que no funciona.
  answer: B
  explanation: Según el manual, 'Un área de bifurcación (gore area) es el espacio
    entre una carretera principal y una rampa de entrada o salida'. Es contra la ley
    conducir o estacionar en cualquier parte de un área de bifurcación.
- id: 106
  category: safe_driving_rules
  question: Durante los horarios establecidos de lunes a viernes, ¿quién tiene permitido
    usar el carril para vehículos de alta ocupación (HOV)?
  choices:
    A: Cualquier vehículo que viaje más rápido que el límite de velocidad establecido.
    B: Vehículos que transporten a menos de dos personas.
    C: Vehículos de viaje compartido con dos o más personas, motocicletas o autobuses.
    D: Únicamente camiones comerciales y vehículos de gran tamaño.
  answer: C
  explanation: El manual especifica que, en los horarios establecidos de lunes a viernes,
    los carriles HOV están restringidos a vehículos de viaje compartido (dos o más
    personas), motocicletas o autobuses.
- id: 107
  category: signs_and_signals
  question: ¿Qué significa una luz amarilla continua en un semáforo?
  choices:
    A: Acelerar para pasar la luz roja antes de que cambie.
    B: La luz está a punto de cambiar a rojo y debe detenerse de forma segura si aún
      no ha entrado en la intersección.
    C: Usted tiene el derecho de paso exclusivo para girar a la izquierda.
    D: Detenerse inmediatamente, incluso si ya se encuentra en medio de la intersección.
  answer: B
  explanation: Una luz amarilla continua significa PRECAUCIÓN. Es una advertencia
    de que la luz está a punto de cambiar a rojo. Si no ha entrado en la intersección,
    debe detenerse de forma segura.
- id: 108
  category: signs_and_signals
  question: 'Una luz roja intermitente en un semáforo tiene el mismo significado que:'
  choices:
    A: Una señal de ceda el paso.
    B: Una señal de alto.
    C: Una luz amarilla intermitente.
    D: Una señal de cruce de peatones.
  answer: B
  explanation: 'El manual establece: ''Una luz roja intermitente tiene el mismo significado
    que una señal de alto. Debe detenerse por completo y luego proceder con precaución
    cuando la vía esté despejada''.'
- id: 109
  category: safe_driving_rules
  question: ¿Cómo debe tratar una intersección con una señal de control de tráfico
    que no funciona?
  choices:
    A: Trátela como una señal de ceda el paso y proceda si está despejado.
    B: Trátela como lo haría con una parada de 4 vías.
    C: Proceda sin detenerse si se encuentra en la carretera más grande.
    D: Espere en la intersección a que llegue un oficial de policía.
  answer: B
  explanation: Al acercarse a una intersección con una señal de control de tráfico
    que no funciona, el manual indica a los conductores que 'deben tratarla como lo
    harían con una parada de 4 vías. Deténgase por completo antes de entrar en la
    intersección...'.
- id: 110
  category: safe_driving_rules
  question: En una intersección en 'T', ¿quién debe ceder el derecho de paso?
  choices:
    A: El conductor que circula por la calle transversal.
    B: El conductor de la calle que termina.
    C: El conductor que llegue al último.
    D: El conductor que realice un giro a la derecha.
  answer: B
  explanation: 'El manual establece: ''En una intersección en “T”, el conductor de
    la calle que termina debe ceder el derecho de paso a los vehículos de la calle
    transversal''.'
- id: 111
  category: sharing_the_road
  question: 'Si otro vehículo se detiene para un peatón en un cruce peatonal, usted
    puede:'
  choices:
    A: Rebasar al vehículo si tiene un carril despejado.
    B: Rebasar al vehículo si tiene un semáforo en verde.
    C: Tocar la bocina para advertir al peatón y continuar.
    D: No rebasar al vehículo detenido.
  answer: D
  explanation: 'El manual establece explícitamente: ''No puede rebasar a otro vehículo
    que esté detenido para un peatón, incluso si tiene un carril despejado o un semáforo
    en verde''.'
- id: 112
  category: safe_driving_rules
  question: Si necesita asistencia en la autopista, ¿cuál es una forma correcta de
    pedir ayuda?
  choices:
    A: Caminar por la autopista hasta la salida más cercana.
    B: Detener su vehículo en una rampa de la autopista.
    C: Encender las luces de emergencia o levantar el capó del automóvil.
    D: Pararse en el área de seguridad (gore area) y agitar los brazos.
  answer: C
  explanation: Para pedir asistencia en la autopista, el manual aconseja 'encender
    las luces de emergencia o levantar el capó del automóvil'. También advierte no
    caminar por la autopista ni detenerse cerca de las rampas.
- id: 113
  category: signs_and_signals
  question: En un cruce peatonal con señales electrónicas, ¿qué indica una luz roja
    fija?
  choices:
    A: El peatón ha activado la señal.
    B: Prepárese para detenerse.
    C: Deténgase, luego continúe con precaución de inmediato.
    D: ALTO. Un peatón está en el cruce peatonal.
  answer: D
  explanation: Para las señales activadas por peatones, una luz roja fija significa
    'ALTO. Un peatón está en el cruce peatonal'.
- id: 114
  category: safe_driving_rules
  question: Si dos vehículos llegan a una intersección no controlada aproximadamente
    al mismo tiempo, ¿quién debe ceder el paso?
  choices:
    A: El conductor del vehículo a la derecha debe ceder el paso al conductor de la
      izquierda.
    B: El conductor del vehículo a la izquierda debe ceder el paso al conductor de
      la derecha.
    C: El vehículo más grande siempre tiene el derecho de paso.
    D: El vehículo que viaja más rápido tiene el derecho de paso.
  answer: B
  explanation: En una intersección no controlada, 'si dos vehículos llegan a la intersección
    aproximadamente al mismo tiempo, ambos deben detenerse y el conductor del vehículo
    a la izquierda debe ceder el derecho de paso al conductor de la derecha'.
- id: 115
  category: signs_and_signals
  question: ¿Qué significa una flecha amarilla intermitente?
  choices:
    A: No puede girar en la dirección de la flecha.
    B: Debe reducir la velocidad y girar con precaución, cediendo el paso al tráfico
      que viene en sentido contrario y a los peatones.
    C: Usted tiene el derecho de paso exclusivo para girar.
    D: La luz está a punto de cambiar a rojo; deténgase inmediatamente.
  answer: B
  explanation: Una flecha amarilla intermitente significa que 'debe reducir la velocidad
    y girar con precaución si la calzada está despejada. Ceda el derecho de paso a
    cualquier vehículo o peatón que venga en sentido contrario antes de realizar el
    giro'.
- id: 116
  category: safe_driving_rules
  question: 'Al acercarse y entrar en un carril de circulación de la autopista desde
    una rampa de entrada, usted debe:'
  choices:
    A: Detenerse al final de la rampa y esperar un espacio en el tráfico.
    B: Aumentar su velocidad para igualar la de los vehículos que ya están en la carretera.
    C: Conducir lentamente en el carril derecho hasta que se sienta cómodo.
    D: Cruzar inmediatamente al carril del extremo izquierdo.
  answer: B
  explanation: 'Al entrar en la autopista, el manual indica: ''Al acercarse y entrar
    en un carril de circulación de la autopista, aumente su velocidad para igualar
    la de los vehículos que ya están en la carretera''.'
- id: 117
  category: safe_driving_rules
  question: En autopistas con tres o más carriles de circulación en la misma dirección,
    ¿para qué se utiliza principalmente el carril del extremo izquierdo?
  choices:
    A: Entrar y salir de la autopista.
    B: Tráfico directo a menor velocidad.
    C: Rebasar a otros vehículos.
    D: Solo para paradas de emergencia.
  answer: C
  explanation: 'El manual establece: ''Manténgase a la derecha y use el carril izquierdo
    solo para rebasar. Si viaja por una autopista de tres carriles, trate el carril
    del extremo derecho como un carril de circulación a menor velocidad y el carril
    del extremo izquierdo como el carril para rebasar''.'
- id: 118
  category: signs_and_signals
  question: 'Cuando se enfrenta a una luz roja fija, puede realizar un giro a la derecha:'
  choices:
    A: En cualquier momento sin detenerse, siempre que ceda el paso.
    B: Solo si tiene una flecha verde.
    C: Después de detenerse por completo, si la intersección está despejada y no está
      prohibido por señales.
    D: Solo si no hay peatones en la acera.
  answer: C
  explanation: 'Bajo las reglas de la señal ROJA, el manual señala: ''Donde no esté
    prohibido por señales, se puede realizar un giro a la derecha después de detenerse
    por completo, cuando el tráfico motorizado y el tráfico de peatones estén despejados''.'
- id: 119
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor al encontrarse con un cruce peatonal con
    luces rojas intermitentes?
  choices:
    A: Continuar sin detenerse si no hay peatones visibles.
    B: Detenerse, luego continuar con precaución después de que el peatón termine
      de cruzar la mitad de la calzada del conductor.
    C: Detenerse y esperar hasta que las luces se vuelvan verdes fijas.
    D: Reducir la velocidad a 15 mph y pasar por el cruce peatonal.
  answer: B
  explanation: Según el manual, en las señales activadas por peatones con luces rojas
    intermitentes, debe detenerse (STOP) y luego continuar con precaución después
    de que el peatón termine de cruzar la mitad de la calzada del conductor.
- id: 120
  category: safe_driving_rules
  question: Al entrar en la calzada desde un callejón o entrada privada, ¿dónde debe
    detenerse?
  choices:
    A: Antes de llegar a la acera.
    B: En medio del cruce peatonal.
    C: En el borde de la calzada.
    D: No es necesario detenerse si la carretera está despejada.
  answer: A
  explanation: El manual establece que al entrar en la calzada desde un callejón o
    entrada privada, debe detenerse antes de llegar a la acera y ceder el derecho
    de paso a los peatones y vehículos que se aproximan.
- id: 121
  category: penalties_and_points
  question: ¿Cuál es una posible sanción si se pasa un semáforo en rojo y causa un
    choque que resulte en lesiones que pongan en peligro la vida de otra persona?
  choices:
    A: Una multa de hasta $1,000 y una suspensión de 6 meses.
    B: Una multa de hasta $500 y una suspensión del privilegio de conducir por 3 meses.
    C: Revocación obligatoria de su licencia por un año.
    D: Una advertencia y servicio comunitario obligatorio.
  answer: B
  explanation: Si se pasa un semáforo en rojo y causa un choque que resulte en lesiones
    que pongan en peligro la vida, se le puede multar con hasta $500 y su privilegio
    de conducir puede ser suspendido por tres meses, además de un posible servicio
    comunitario.
- id: 122
  category: penalties_and_points
  question: ¿Qué sucede si no completa la Escuela de Supervivencia de Tráfico (TSS)
    obligatoria después de una condena por pasarse un semáforo en rojo?
  choices:
    A: Se le multará con $500 adicionales.
    B: Recibirá 3 puntos en su historial de conducción.
    C: Su privilegio de conducir será suspendido indefinidamente.
    D: Debe volver a tomar el examen de conducir escrito.
  answer: C
  explanation: El MVD requiere la TSS por cada condena de semáforo en rojo. El manual
    establece que no completar el curso resulta en una suspensión indefinida de su
    privilegio de conducir.
- id: 123
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima que debe mantener al seguir a un vehículo
    policial que responde a una emergencia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: El manual requiere que los conductores mantengan una distancia de al
    menos 300 pies detrás de un vehículo policial que responde a una emergencia.
- id: 124
  category: sharing_the_road
  question: Según la Ley de Moverse a un Lado (Move Over Law), ¿qué debe hacer si
    se aproxima a un vehículo con luces intermitentes detenido a un lado de la carretera
    y no puede cambiar de carril de manera segura?
  choices:
    A: Detener su vehículo hasta que se apaguen las luces intermitentes.
    B: Tocar la bocina para alertar al vehículo detenido y mantener la velocidad.
    C: Reducir la velocidad y tener precaución al pasar.
    D: Acelerar para pasar el vehículo lo más rápido posible.
  answer: C
  explanation: La Ley de Moverse a un Lado requiere cambiarse a un carril de distancia.
    Si no es seguro o posible cambiarse de carril, los automovilistas deben reducir
    la velocidad y tener precaución.
- id: 125
  category: sharing_the_road
  question: ¿Cuándo NO es obligatorio detenerse ante un autobús escolar con luces
    intermitentes alternas y un brazo de señal de pare extendido?
  choices:
    A: Cuando viaja en la dirección opuesta en una carretera dividida con una barrera
      física.
    B: Cuando viaja en la dirección opuesta en una carretera separada solo por líneas
      pintadas.
    C: Cuando llega tarde y no hay niños visibles.
    D: Cuando viaja en la misma dirección que el autobús en una autopista de varios
      carriles.
  answer: A
  explanation: No es obligatorio detenerse ante un autobús escolar en una carretera
    dividida cuando se viaja en la dirección opuesta. Una carretera dividida debe
    estar separada por barreras físicas, no solo por líneas pintadas.
- id: 126
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en cualquier distrito comercial o residencial
    cuando no hay un límite señalizado?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: El manual establece que cuando no hay un límite señalizado, el límite
    de velocidad es de 25 mph en cualquier distrito comercial o residencial.
- id: 127
  category: safe_driving_rules
  question: Al acercarse a un cruce escolar donde no hay un límite de velocidad señalizado,
    ¿cuál es la velocidad máxima que debe observar?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El manual especifica que debe observar un límite de velocidad de 15
    mph al acercarse a un cruce escolar si no hay un límite señalizado.
- id: 128
  category: signs_and_signals
  question: ¿Qué indican las señales de límite de velocidad de color naranja con letras
    negras?
  choices:
    A: La velocidad máxima absoluta a la que puede viajar legalmente.
    B: Velocidades seguras recomendadas debido a la curvatura de la carretera, la
      pendiente o condiciones especiales.
    C: Límites de velocidad específicos para vehículos de construcción.
    D: Límites de velocidad mínimos en autopistas rurales.
  answer: B
  explanation: Las señales naranjas con letras negras indican velocidades seguras
    recomendadas debido a la curvatura o pendiente de la carretera u otras condiciones
    especiales en ese lugar.
- id: 129
  category: defensive_driving
  question: Al conducir con mal tiempo, ¿cómo debe ajustar su distancia de seguimiento?
  choices:
    A: Mantenerla igual que con buen tiempo.
    B: Disminuirla para estar más cerca de las luces traseras del vehículo de adelante.
    C: Duplicar la distancia de seguimiento con respecto al vehículo que tiene delante.
    D: Triplicar la distancia de seguimiento y encender las luces de emergencia.
  answer: C
  explanation: 'Una pauta para ajustar la velocidad a las condiciones es: al conducir
    con mal tiempo, duplique la distancia de seguimiento con respecto al vehículo
    que tiene delante y reduzca la velocidad adecuadamente.'
- id: 130
  category: safe_driving_rules
  question: Si conduce más lento que el tráfico a su alrededor, ¿qué debe hacer para
    evitar obstruir el tráfico?
  choices:
    A: Conducir en el carril izquierdo y mantener su velocidad.
    B: Conducir en el carril derecho y permitir que los vehículos que se mueven más
      rápido pasen.
    C: Conducir en el carril central con las luces de emergencia encendidas.
    D: Acelerar para igualar al vehículo más rápido en la carretera.
  answer: B
  explanation: Para evitar obstruir el tráfico, recuerde conducir en el carril derecho
    y permitir que los vehículos que se mueven más rápido pasen siempre que conduzca
    más lento que el tráfico a su alrededor.
- id: 131
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico con forma de triángulo?
  choices:
    A: Debe detenerse por completo.
    B: Está entrando en una zona escolar.
    C: Debe ceder el paso al tráfico que cruza o al tráfico que se incorpora.
    D: Se está aproximando a un cruce de ferrocarril.
  answer: C
  explanation: Según el manual, una forma triangular requiere que usted ceda el paso
    al tráfico que cruza o al tráfico que se incorpora.
- id: 132
  category: sharing_the_road
  question: ¿Cuál es su responsabilidad al encontrarse con un cortejo fúnebre encabezado
    por un vehículo de escolta con luces rojas o azules intermitentes?
  choices:
    A: Puede rebasar el cortejo si tiene prisa.
    B: Debe ceder el paso a cualquier vehículo que forme parte del cortejo.
    C: Debe tocar la bocina para mostrar respeto.
    D: Debe hacerse a un lado y apagar el motor hasta que pase todo el cortejo.
  answer: B
  explanation: Los conductores deben ceder el paso a cualquier vehículo que forme
    parte de un cortejo fúnebre que sea guiado por un vehículo de escolta fúnebre
    con luces rojas o azules intermitentes.
- id: 133
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo desde la primera señal portátil
    hasta después de la señal de cruce escolar en una zona escolar?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: A
  explanation: El manual establece que la velocidad máxima desde la primera señal
    portátil hasta después de la señal de cruce escolar es de 15 mph.
- id: 134
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a rebasar a otro vehículo en una zona de
    cruce escolar?
  choices:
    A: Está permitido si no hay niños presentes.
    B: Está permitido si conduce a menos de 15 mph.
    C: Está prohibido.
    D: Está permitido si no hay un guardia de cruce.
  answer: C
  explanation: 'El manual establece explícitamente: "Está prohibido rebasar a otro
    vehículo en una zona de cruce escolar".'
- id: 135
  category: safe_driving_rules
  question: Cuando llega a un cruce de ferrocarril con luces rojas intermitentes,
    ¿a qué distancia de la vía más cercana debe detenerse?
  choices:
    A: A no menos de 10 pies
    B: A no menos de 15 pies
    C: A no menos de 20 pies
    D: A no menos de 50 pies
  answer: B
  explanation: Cuando observe luces rojas intermitentes en un cruce de ferrocarril,
    debe detenerse a no menos de 15 pies de la vía férrea más cercana.
- id: 136
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo se apaga (se detiene) sobre las vías del
    tren?
  choices:
    A: Permanecer en el vehículo y llamar al 911.
    B: Intentar arrancar el motor mientras espera al tren.
    C: Poner el vehículo en punto muerto (neutral) e intentar empujarlo fuera de las
      vías.
    D: Salir de su vehículo.
  answer: D
  explanation: 'Para reducir las posibilidades de sufrir un accidente fatal, el manual
    aconseja: "Salga de su vehículo si se detiene sobre las vías".'
- id: 137
  category: signs_and_signals
  question: ¿Dónde se encuentran normalmente los postes de millaje (mile posts) en
    las carreteras de Arizona?
  choices:
    A: A 5 pies del acotamiento izquierdo
    B: A 2 pies del acotamiento derecho
    C: En la mediana central
    D: A 10 pies del acotamiento derecho
  answer: B
  explanation: Los postes de millaje son postes de referencia colocados a 2 pies del
    acotamiento derecho y están separados por aproximadamente 1 milla.
- id: 138
  category: penalties_and_points
  question: ¿Qué sucede con las multas por infracciones de velocidad en zonas de obras
    cuando hay señales publicadas?
  choices:
    A: Siguen siendo las mismas que las infracciones normales.
    B: Se anulan si no hay trabajadores presentes.
    C: Se duplican.
    D: Se triplican.
  answer: C
  explanation: Cuando hay señales publicadas en una zona de obras, las multas por
    una infracción de velocidad se duplican.
- id: 139
  category: signs_and_signals
  question: ¿Cuál es el color básico para los dispositivos de alerta y control en
    las áreas de construcción y mantenimiento de carreteras?
  choices:
    A: Amarillo
    B: Rojo
    C: Naranja
    D: Verde neón
  answer: C
  explanation: El naranja es el color básico para los dispositivos de advertencia
    utilizados en las áreas de construcción y mantenimiento de carreteras.
- id: 140
  category: safe_driving_rules
  question: ¿Qué significan las líneas amarillas sólidas dobles en la calzada?
  choices:
    A: Se permite rebasar en ambas direcciones.
    B: Se permite rebasar solo por la derecha.
    C: No se permite rebasar a menos que esté girando a la izquierda.
    D: Se permite rebasar si el camino por delante está despejado.
  answer: C
  explanation: Las líneas amarillas sólidas dobles significan que no se permite rebasar
    en ninguna dirección, y no puede cruzar las líneas a menos que esté girando a
    la izquierda.
- id: 141
  category: safe_driving_rules
  question: ¿Qué indica un bordillo pintado de blanco?
  choices:
    A: Puede detenerse solo el tiempo suficiente para cargar o descargar mercancía.
    B: Puede detenerse solo el tiempo suficiente para recoger o dejar pasajeros.
    C: No puede detenerse, pararse ni estacionar en ningún momento.
    D: Puede estacionar por un máximo de 15 minutos.
  answer: B
  explanation: Un bordillo pintado de blanco significa que puede detenerse solo el
    tiempo suficiente para recoger o dejar pasajeros.
- id: 142
  category: safe_driving_rules
  question: ¿Cuáles son las reglas para detenerse en un bordillo pintado de amarillo?
  choices:
    A: Puede detenerse solo el tiempo suficiente para cargar o descargar, y debe permanecer
      con su vehículo.
    B: Puede estacionar hasta por 30 minutos si deja encendidas las luces de emergencia.
    C: Puede detenerse solo para recoger pasajeros.
    D: No puede detenerse en ningún momento.
  answer: A
  explanation: Un bordillo pintado de amarillo significa que puede detenerse solo
    el tiempo suficiente para cargar o descargar, y debe permanecer con su vehículo.
- id: 143
  category: safe_driving_rules
  question: Si viaja por una calle de sentido único durante varias cuadras, ¿en qué
    carril es mejor permanecer?
  choices:
    A: El carril izquierdo
    B: El carril derecho
    C: El carril central
    D: Cualquier carril que esté libre
  answer: C
  explanation: Si va a viajar por una calle de sentido único durante varias cuadras,
    lo mejor es permanecer en el carril central, ya que los carriles izquierdo y derecho
    serán utilizados por los vehículos que giran.
- id: 144
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla discontinua junto a una línea amarilla
    continua?
  choices:
    A: Se permite rebasar en ambas direcciones.
    B: Se permite rebasar solo si la línea discontinua está de su lado.
    C: Nunca se permite rebasar.
    D: Se permite rebasar solo si la línea continua está de su lado.
  answer: B
  explanation: Una línea amarilla discontinua junto a una línea amarilla continua
    indica que se permite rebasar solo en una dirección. Si la línea amarilla discontinua
    está de su lado, puede rebasar cuando la carretera adelante esté despejada.
- id: 145
  category: signs_and_signals
  question: ¿Qué indican las líneas centrales amarillas en una calzada?
  choices:
    A: Tráfico de un solo sentido moviéndose en la misma dirección.
    B: Tráfico de doble sentido fluyendo en ambas direcciones.
    C: Un cruce de peatones.
    D: El borde derecho de la calzada.
  answer: B
  explanation: Las líneas centrales amarillas indican que hay tráfico de doble sentido,
    fluyendo en ambas direcciones.
- id: 146
  category: safe_driving_rules
  question: ¿Cuándo es permisible cruzar una línea blanca continua en el borde derecho
    de la calzada?
  choices:
    A: Para rebasar a un vehículo lento
    B: En caso de emergencia o para evitar un peligro en la carretera
    C: Al prepararse para girar a la derecha en una intersección
    D: Nunca es permisible cruzar una línea blanca continua
  answer: B
  explanation: Según el manual, solo debe cruzar la línea continua en el borde derecho
    de la calzada en caso de emergencia o para evitar un peligro en la carretera.
- id: 147
  category: signs_and_signals
  question: ¿Cómo se marcan habitualmente los carriles reversibles en la calzada?
  choices:
    A: Líneas amarillas continuas dobles
    B: Líneas blancas discontinuas simples
    C: Líneas amarillas discontinuas dobles
    D: Líneas blancas continuas
  answer: C
  explanation: El manual establece que los carriles reversibles, que transportan tráfico
    en una dirección en ciertos momentos y en la dirección opuesta en otros, suelen
    estar marcados por líneas amarillas discontinuas dobles.
- id: 148
  category: safe_driving_rules
  question: Al girar a la derecha con semáforo en rojo, ¿qué debe hacer primero?
  choices:
    A: Reducir la velocidad y ceder el paso al tráfico sin detenerse
    B: Detenerse por completo antes de llegar al paso de peatones marcado o no marcado
    C: Tocar la bocina para advertir a los peatones antes de girar
    D: Avanzar hacia la intersección para verificar el tráfico transversal
  answer: B
  explanation: Al girar a la derecha con semáforo en rojo, primero debe detenerse
    por completo antes de llegar al paso de peatones marcado o no marcado y buscar
    señales de 'No girar en rojo' (No Turn On Red).
- id: 149
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones puede realizar un giro a la izquierda
    con semáforo en rojo después de detenerse y ceder el paso, a menos que las señales
    lo prohíban?
  choices:
    A: Girar de una calle de doble sentido a una de doble sentido
    B: Girar de una calle de sentido único a una de doble sentido
    C: Girar de una calle de doble sentido a una de sentido único
    D: Girar de una calle de sentido único a una de sentido único
  answer: D
  explanation: Un giro a la izquierda de una calle de sentido único a otra de sentido
    único es la única situación de giro a la izquierda en la que puede realizar el
    giro con semáforo en rojo después de detenerse y ceder el paso al tráfico y a
    los peatones, a menos que las señales lo prohíban.
- id: 150
  category: signs_and_signals
  question: ¿Cómo está delimitado a cada lado un carril de giro a la izquierda de
    doble sentido?
  choices:
    A: Por dos líneas blancas continuas
    B: Por una línea amarilla interior continua y una línea amarilla exterior discontinua
    C: Por una línea amarilla interior discontinua y una línea amarilla exterior continua
    D: Por líneas amarillas discontinuas dobles
  answer: C
  explanation: 'Un carril de giro a la izquierda de doble sentido está delimitado
    a cada lado por dos líneas amarillas: la línea interior es discontinua y la línea
    exterior es continua.'
- id: 151
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un uso prohibido de un carril central de giro
    a la izquierda de doble sentido?
  choices:
    A: Reducir la velocidad antes de girar a la izquierda para salir de la calle
    B: Entrar en él al girar a la izquierda desde una calle lateral
    C: Acelerar para incorporarse al tráfico directo
    D: Esperar a que pase el tráfico en sentido contrario antes de girar a la izquierda
  answer: C
  explanation: Los conductores no deben usar el carril de giro a la izquierda de doble
    sentido para rebasar, para el tráfico directo ni para acelerar con el fin de incorporarse
    al tráfico directo.
- id: 152
  category: defensive_driving
  question: ¿Cómo puede un conductor identificar que un tren ligero de METRO se está
    alejando de él?
  choices:
    A: Por las luces delanteras blancas
    B: Por las luces traseras rojas
    C: Por las luces amarillas intermitentes
    D: Por las campanas de advertencia
  answer: B
  explanation: Los extremos de un tren ligero son idénticos. Las luces delanteras
    blancas indican que un tren se aproxima, mientras que las luces traseras rojas
    indican que se está alejando.
- id: 153
  category: safe_driving_rules
  question: ¿Se permiten las vueltas en U en las intersecciones del tren ligero de
    METRO?
  choices:
    A: No, las vueltas en U están estrictamente prohibidas en todas las intersecciones
      de tren ligero
    B: Sí, pero solo si no se aproxima ningún tren
    C: Sí, se permiten en casi todas las intersecciones de tren ligero y están controladas
      por señales de tráfico
    D: Sí, pero solo durante las horas del día
  answer: C
  explanation: Se permiten las vueltas en U en casi todas las intersecciones de tren
    ligero en el sistema METRO de 20 millas para permitir que los vehículos crucen
    las vías, y están controladas por señales de tráfico.
- id: 154
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima de seguridad que los automovilistas deben
    dejar al rebasar a un ciclista que viaja en la misma dirección?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: Se requiere que los automovilistas dejen una distancia mínima de seguridad
    de 3 pies al rebasar a un ciclista que viaja en la misma dirección.
- id: 155
  category: sharing_the_road
  question: ¿Por qué los automovilistas deben evitar tocar la bocina a los ciclistas
    al rebasarlos?
  choices:
    A: Es ilegal en todas las zonas residenciales
    B: Puede asustarlos y provocar que choquen
    C: Causa contaminación acústica innecesaria
    D: Los ciclistas no pueden oír las bocinas debido al ruido del viento
  answer: B
  explanation: El manual establece que no es seguro para los automovilistas tocar
    la bocina a los ciclistas al rebasarlos, ya que esto puede asustarlos y provocar
    que choquen.
- id: 156
  category: sharing_the_road
  question: ¿Bajo qué condición se le permite legalmente a un ciclista moverse hacia
    la izquierda desde el lado derecho de la carretera?
  choices:
    A: Cuando el carril es demasiado estrecho para que una bicicleta y un vehículo
      motorizado circulen con seguridad uno al lado del otro
    B: Cuando quieren circular al lado de otros tres ciclistas
    C: Cuando viajan más rápido que el límite de velocidad establecido
    D: A los ciclistas nunca se les permite moverse a la izquierda
  answer: A
  explanation: Los ciclistas pueden moverse legalmente hacia la izquierda por varias
    razones, incluso si el carril es demasiado estrecho para que una bicicleta y un
    vehículo motorizado circulen con seguridad uno al lado del otro.
- id: 157
  category: sharing_the_road
  question: ¿Qué equipo de iluminación se requiere para una bicicleta cuando se circula
    de noche?
  choices:
    A: Una lámpara delantera roja visible desde 300 pies
    B: Una lámpara delantera blanca visible desde 500 pies y un reflector trasero
    C: Luces amarillas intermitentes tanto en la parte delantera como en la trasera
    D: Un reflector blanco en la parte delantera y una lámpara delantera roja en la
      trasera
  answer: B
  explanation: Al circular de noche, los ciclistas deben tener una lámpara delantera
    blanca visible desde 500 pies y un reflector trasero.
- id: 158
  category: sharing_the_road
  question: ¿Cuál es la causa más común de choques entre automóviles y motocicletas?
  choices:
    A: Una motocicleta que excede el límite de velocidad en una intersección
    B: Un automóvil que gira frente a una motocicleta porque el conductor no la vio
    C: Una motocicleta que sigue muy de cerca a un automóvil
    D: Un automóvil que frena demasiado repentinamente frente a una motocicleta
  answer: B
  explanation: La mayoría de los choques entre automóviles y motocicletas son el resultado
    de un automóvil que gira frente a una motocicleta, generalmente porque el conductor
    no vio la motocicleta.
- id: 159
  category: signs_and_signals
  question: ¿Qué separa una línea blanca continua doble?
  choices:
    A: Dos carriles de tráfico que van en la misma dirección donde está prohibido
      cruzar
    B: Dos carriles de tráfico que se mueven en direcciones opuestas
    C: Un carril para vehículos compartidos (carpool) donde se permite cruzar en cualquier
      momento
    D: Un carril reversible de los carriles de tráfico estándar
  answer: A
  explanation: Una línea blanca continua doble separa dos carriles de tráfico que
    van en la misma dirección, y está prohibido cruzar una línea blanca continua doble.
- id: 160
  category: sharing_the_road
  question: ¿Cómo se separa la vía exclusiva para trenes de METRO del tráfico de automóviles?
  choices:
    A: Por una línea amarilla doble continua
    B: Por barreras de concreto
    C: Por bordillos (curbs) de seis pulgadas
    D: Por una cerca de malla de alambre
  answer: C
  explanation: METRO viaja en su propia vía, separada del tráfico por bordillos de
    seis pulgadas.
- id: 161
  category: sharing_the_road
  question: ¿Bajo cuál de las siguientes condiciones se le permite a un motociclista
    practicar el filtrado de carril (lane filtering)?
  choices:
    A: El límite de velocidad indicado es de 55 millas por hora o superior.
    B: La motocicleta viaja a 25 millas por hora.
    C: El límite de velocidad indicado no excede las 45 millas por hora.
    D: La calle tiene un solo carril que circula en la misma dirección.
  answer: C
  explanation: Se permite el filtrado de carril siempre que la calle esté dividida
    en al menos 2 carriles adyacentes en la misma dirección, el límite de velocidad
    indicado no exceda las 45 mph y la motocicleta no circule a más de 15 mph.
- id: 162
  category: sharing_the_road
  question: ¿Por qué podría un motociclista cambiar de posición inesperadamente dentro
    de su propio carril?
  choices:
    A: Para permitir que los vehículos de pasajeros compartan el mismo carril.
    B: Para evitar aceite, baches o escombros.
    C: Para señalizar un próximo cambio de carril a la derecha.
    D: Para activar sus señales de giro automáticas.
  answer: B
  explanation: El manual señala que los motociclistas pueden desplazarse dentro de
    su carril para evitar aceite, baches o escombros, o para mejorar la visibilidad.
- id: 163
  category: sharing_the_road
  question: ¿Qué es la "Zona No" (No-Zone) al compartir la carretera con camiones
    grandes y autobuses?
  choices:
    A: El carril de adelantamiento designado solo para camiones.
    B: Los grandes puntos ciegos alrededor de la parte delantera, trasera y los costados
      del vehículo.
    C: El área directamente frente al camión donde es seguro incorporarse.
    D: El arcén de la autopista donde los camiones tienen prohibido estacionar.
  answer: B
  explanation: El manual describe la "Zona No" (No-Zone) como los grandes puntos ciegos
    alrededor de la parte delantera, trasera y los costados de los camiones grandes
    y autobuses.
- id: 164
  category: sharing_the_road
  question: ¿Por qué debe evitar adelantar a un camión por la derecha si existe alguna
    posibilidad de que este gire a la derecha?
  choices:
    A: Los camiones aceleran mucho más rápido por el lado derecho.
    B: Es ilegal adelantar a cualquier vehículo comercial por la derecha.
    C: Los camiones realizan giros amplios a la derecha y, a veces, deben dejar un
      espacio abierto a la derecha justo antes del giro.
    D: Los camiones no tienen puntos ciegos en el lado derecho, lo que los hace excesivamente
      sensibles a los autos que los adelantan.
  answer: C
  explanation: Los camiones realizan giros amplios a la derecha y, a veces, deben
    dejar un espacio abierto a la derecha justo antes del giro. Adelantar por la derecha
    puede provocar una colisión.
- id: 165
  category: signs_and_signals
  question: Cuando ve un símbolo de vehículo de movimiento lento en la parte trasera
    de un vehículo que va delante, ¿qué indica sobre la velocidad máxima del vehículo?
  choices:
    A: El vehículo no puede viajar a más de 15 mph.
    B: El vehículo no puede viajar a más de 25 mph.
    C: El vehículo no puede viajar a más de 35 mph.
    D: El vehículo no puede viajar a más de 45 mph.
  answer: B
  explanation: El manual establece que cuando vea este símbolo en la parte trasera
    de un vehículo que va delante, es una advertencia para reducir la velocidad, y
    el vehículo con la señal no puede viajar a más de 25 mph.
- id: 166
  category: defensive_driving
  question: ¿Cuál es el tiempo promedio de percepción del conductor (el tiempo que
    tarda en ver y reconocer una situación peligrosa)?
  choices:
    A: 0.50 segundos
    B: 0.75 segundos
    C: 1.5 segundos
    D: 3.0 segundos
  answer: B
  explanation: Según el manual, el tiempo promedio de percepción del conductor es
    de 0.75 segundos.
- id: 167
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento mínima recomendada para la mayoría
    de las situaciones normales de conducción?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 6 segundos
  answer: C
  explanation: El manual aconseja a los conductores permitir una distancia de seguimiento
    de al menos 3 segundos para la mayoría de las situaciones de conducción.
- id: 168
  category: safe_driving_rules
  question: ¿Cómo debe ajustar su distancia de seguimiento cuando conduce por carreteras
    resbaladizas?
  choices:
    A: Mantener la distancia de seguimiento estándar de 3 segundos.
    B: Reducirla a 2 segundos para mantener el vehículo de adelante a la vista.
    C: Duplicar su distancia de seguimiento a 6 segundos o más.
    D: Aumentarla a exactamente 4 segundos.
  answer: C
  explanation: Al conducir por carreteras resbaladizas, debe duplicar su distancia
    de seguimiento a 6 segundos o más para permitir la distancia adicional necesaria
    para ajustar su velocidad o detenerse.
- id: 169
  category: defensive_driving
  question: ¿Qué debe hacer si está remolcando un tráiler y un camión grande lo adelanta
    por la izquierda, creando ráfagas de viento?
  choices:
    A: Moverse al carril izquierdo para bloquear las corrientes de viento.
    B: Frenar fuerte y detenerse por completo en el arcén.
    C: Acelerar para adelantar al camión antes de que lo pase por completo.
    D: Moverse lo más a la derecha posible, reducir la velocidad y luego acelerar
      lentamente mientras el camión pasa.
  answer: D
  explanation: 'El manual instruye: "Cuando un camión o autobús lo esté adelantando
    por la izquierda, muévase lo más posible a la derecha de su carril y reduzca la
    velocidad. A medida que el vehículo pase, acelere lentamente para mantener el
    remolque tirando en una trayectoria recta".'
- id: 170
  category: defensive_driving
  question: ¿Cuál es la primera regla al conducir en mal tiempo que reduce la visibilidad
    y la tracción?
  choices:
    A: Encender las luces altas de sus faros.
    B: Reducir la velocidad para compensar la reducción de la visibilidad y el tiempo
      de reacción.
    C: Detenerse en el arcén inmediatamente y esperar a que el tiempo mejore.
    D: Tocar la bocina periódicamente para advertir a otros conductores de su presencia.
  answer: B
  explanation: El manual establece que la primera regla al conducir con mal tiempo
    es reducir la velocidad para compensar la reducción de la visibilidad y el tiempo
    de reacción.
- id: 171
  category: sharing_the_road
  question: ¿Por qué una motocicleta podría parecer estar más lejos y viajar más lento
    de lo que realmente está?
  choices:
    A: Porque las motocicletas suelen tener faros más tenues que los automóviles.
    B: Debido al tamaño más pequeño de la motocicleta.
    C: Porque las motocicletas están obligadas por ley a viajar por debajo del límite
      de velocidad.
    D: Porque los conductores a menudo usan ropa oscura y no reflectante.
  answer: B
  explanation: El tamaño más pequeño de una motocicleta puede hacer que sea difícil
    de detectar en el tráfico, y puede parecer que está más lejos y que viaja más
    lento de lo que realmente está.
- id: 172
  category: sharing_the_road
  question: ¿Cómo afecta el meterse delante de un camión grande a su capacidad para
    detenerse de manera segura?
  choices:
    A: Reduce a la mitad la distancia de frenado disponible del camión.
    B: Duplica la distancia de frenado del camión.
    C: No tiene ningún efecto en la distancia de frenado del camión.
    D: Ayuda al camión a detenerse más rápido al crear una corriente de aire.
  answer: A
  explanation: Si usted se mueve al espacio delante de un camión y tiene que frenar
    repentinamente, reduce a la mitad la distancia de frenado disponible del camión,
    poniéndose a usted y a sus pasajeros en peligro.
- id: 173
  category: defensive_driving
  question: ¿Cómo afecta un fuerte viento de cola a su vehículo mientras conduce?
  choices:
    A: Disminuye su velocidad y requiere más aceleración.
    B: Empuja su vehículo lateralmente hacia los carriles adyacentes.
    C: Aumenta su velocidad, lo que requiere que desacelere y comience a frenar antes
      para detenerse.
    D: Hace que su vehículo se pliegue (efecto tijera) inmediatamente.
  answer: C
  explanation: Un viento de cola aumentará su velocidad, por lo que tendrá que desacelerar
    y comenzar a frenar antes para detenerse.
- id: 174
  category: sharing_the_road
  question: ¿Cómo podrían maniobrar los operadores de maquinaria agrícola cuando se
    preparan para hacer un giro amplio?
  choices:
    A: Siempre se saldrán completamente de la carretera primero.
    B: Es posible que primero se desvíen hacia la izquierda y luego giren hacia la
      derecha.
    C: Acelerarán para despejar la intersección lo más rápido posible.
    D: Solo girarán desde el borde más a la derecha del carril.
  answer: B
  explanation: Para hacer un giro amplio, los operadores de maquinaria agrícola pueden
    primero desviarse hacia la izquierda y luego girar hacia la derecha.
- id: 175
  category: sharing_the_road
  question: ¿Qué debe hacer cuando un camión grande o un autobús lo está rebasando
    por la izquierda?
  choices:
    A: Acelerar rápidamente para mantenerse por delante del vehículo.
    B: Moverse lo más posible a la derecha de su carril y reducir la velocidad.
    C: Moverse al carril izquierdo directamente detrás del vehículo que lo rebasa.
    D: Mantener su velocidad exacta y su posición en el carril.
  answer: B
  explanation: Según el manual, cuando un camión o autobús lo esté rebasando por la
    izquierda, debe moverse lo más posible a la derecha de su carril y reducir la
    velocidad, luego acelerar lentamente mientras pasa para mantener su vehículo circulando
    recto.
- id: 176
  category: safe_driving_rules
  question: Si se encuentra con una tormenta de polvo severa y debe salirse completamente
    de la carretera, ¿qué debe hacer con las luces de su vehículo?
  choices:
    A: Encender las luces de emergencia.
    B: Encender las luces altas.
    C: Dejar las luces bajas encendidas.
    D: Apagar las luces.
  answer: D
  explanation: El manual establece que si se encuentra con una tormenta de polvo severa
    y se sale de la carretera, debe apagar las luces, quitar el pie del freno y permanecer
    en el vehículo con los cinturones de seguridad abrochados.
- id: 177
  category: defensive_driving
  question: ¿Por qué debe tener un cuidado especial durante los primeros 30 minutos
    después de que comienza a llover?
  choices:
    A: El hidroplaneo solo ocurre durante los primeros 30 minutos de una tormenta.
    B: La suciedad y el aceite en la superficie de la carretera se mezclan con el
      agua y hacen que la carretera sea resbaladiza.
    C: Los limpiaparabrisas necesitan tiempo para calentarse y limpiar el vidrio.
    D: Es más probable que ocurran inundaciones repentinas inmediatamente después
      de la primera gota de lluvia.
  answer: B
  explanation: El manual aconseja a los conductores tener un cuidado especial durante
    los 30 minutos posteriores al inicio de la lluvia porque la suciedad y el aceite
    en la superficie de la carretera se mezclan con el agua y hacen que la carretera
    sea resbaladiza.
- id: 178
  category: safe_driving_rules
  question: ¿A qué velocidad pueden sus neumáticos perder todo contacto con la carretera
    durante una lluvia intensa debido al hidroplaneo?
  choices:
    A: 35 mph
    B: 40 mph
    C: 50 mph
    D: 65 mph
  answer: C
  explanation: En una lluvia intensa, sus neumáticos pueden deslizarse sobre una capa
    de agua, y a 50 mph sus neumáticos pueden perder todo contacto con la carretera.
- id: 179
  category: defensive_driving
  question: Si su automóvil comienza a hidroplanear, ¿cuál es la acción correcta a
    seguir?
  choices:
    A: Frenar con fuerza inmediatamente para recuperar la tracción.
    B: Girar el volante bruscamente hacia el acotamiento.
    C: Quitar el pie del acelerador y no frenar.
    D: Acelerar ligeramente para atravesar el agua estancada.
  answer: C
  explanation: Si su automóvil hidroplanea, el manual le indica que quite el pie del
    acelerador, no frene, evite cambios de dirección si es posible y sujete el volante
    con firmeza.
- id: 180
  category: safe_driving_rules
  question: ¿Por qué dos vehículos deben evitar encontrarse en aguas profundas al
    cruzar un arroyo inundado?
  choices:
    A: Aumenta la posibilidad de que el motor se apague debido a las olas de agua.
    B: El peso combinado de los vehículos dañará la carretera sumergida.
    C: Es ilegal rebasar a otro vehículo en un arroyo bajo cualquier circunstancia.
    D: Los vehículos pueden chocar debido a la mala visibilidad causada por las salpicaduras.
  answer: A
  explanation: El manual establece que dos vehículos no deben encontrarse en aguas
    profundas; uno debe pasar por completo antes de que otro comience. Esto reduce
    la posibilidad de que el motor se apague debido a las olas de agua.
- id: 181
  category: penalties_and_points
  question: ¿Cuál es la consecuencia de conducir rodeando las barricadas instaladas
    debido a inundaciones si su vehículo queda inoperable?
  choices:
    A: Perderá automáticamente su licencia por un año.
    B: Usted es responsable de los gastos de cualquier respuesta de emergencia requerida
      para rescatarlo a usted o a sus pasajeros.
    C: Se le acusará de un delito grave de atropello y fuga (hit-and-run).
    D: Su vehículo será confiscado por el estado durante 30 días.
  answer: B
  explanation: Un conductor que rodea las barricadas instaladas debido a inundaciones
    es responsable de los gastos de cualquier respuesta de emergencia requerida para
    rescatar al conductor o a cualquier pasajero si el vehículo queda inoperable.
- id: 182
  category: safe_driving_rules
  question: Al conducir con niebla, ¿qué luces debe utilizar?
  choices:
    A: Solo luces altas
    B: Solo luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia (hazard lights)
  answer: B
  explanation: La niebla refleja la luz y puede reflejar sus propios faros hacia sus
    ojos. Al conducir con niebla, el manual establece que debe usar solo las luces
    bajas.
- id: 183
  category: defensive_driving
  question: Durante la conducción en invierno, ¿dónde debe estar especialmente atento
    al hielo porque se congela antes que otras superficies de la carretera?
  choices:
    A: En el carril central de las autopistas
    B: En puentes y en zonas de sombra
    C: En intersecciones con semáforos
    D: En pendientes ascendentes pronunciadas
  answer: B
  explanation: El manual aconseja vigilar el hielo en los puentes y en las zonas de
    sombra, señalando que las superficies de los puentes se congelan antes que otras
    superficies de la carretera.
- id: 184
  category: safe_driving_rules
  question: Al conducir por una autopista de noche, ¿debe usar las luces altas cuando
    no venga ningún otro vehículo hacia usted a qué distancia?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Debe usar las luces altas en las autopistas cuando no venga ningún
    otro vehículo hacia usted a menos de 500 pies.
- id: 185
  category: safe_driving_rules
  question: 'Al seguir a otro automóvil de noche, debe usar las luces bajas siempre
    que se encuentre a menos de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El manual establece que al seguir a otro automóvil, debe usar las luces
    bajas siempre que se encuentre a menos de 200 pies.
- id: 186
  category: defensive_driving
  question: ¿Qué debe hacer si un automóvil que viene en sentido contrario no baja
    sus luces altas por la noche?
  choices:
    A: Parpadee sus luces altas repetidamente hasta que bajen las suyas.
    B: Mire directamente a los faros para calcular su distancia.
    C: Mire hacia el lado derecho de la carretera y observe hacia adelante para determinar
      su posición.
    D: Encienda sus luces de emergencia y deténgase inmediatamente a un lado.
  answer: C
  explanation: Si no se bajan las luces altas de un automóvil que viene en sentido
    contrario, evite mirar directamente a las luces brillantes. Mire hacia el lado
    derecho de la carretera, luego mire hacia adelante para determinar la posición
    del otro vehículo.
- id: 187
  category: driver_responsibility
  question: 'Para ayudar a prevenir la ''hipnosis de carretera'' (Highway Hypnosis)
    durante un viaje largo, el manual recomienda que usted:'
  choices:
    A: Beba cafeína y conduzca más rápido para llegar antes a su destino.
    B: Mantenga las ventanas cerradas y la calefacción encendida.
    C: Se detenga cada hora para caminar y hacer ejercicio.
    D: Mire fijamente la línea blanca del lado derecho de la carretera.
  answer: C
  explanation: Para evitar la hipnosis de carretera, el manual recomienda usar la
    radio y aire fresco, y detenerse cada hora para caminar y hacer ejercicio para
    ayudarle a mantenerse alerta.
- id: 188
  category: defensive_driving
  question: Si ve un letrero elevado que advierte 'ALERTA, CONDUCTOR EN SENTIDO CONTRARIO
    ADELANTE' (ALERT, WRONG-WAY DRIVER AHEAD), ¿cuál es la acción recomendada?
  choices:
    A: Muévase al carril izquierdo para bloquear al conductor que va en sentido contrario.
    B: Diríjase de manera segura hacia la salida de la autopista más cercana lo antes
      posible.
    C: Detenga su vehículo en el carril de circulación y espere a la policía.
    D: Encienda sus luces altas para advertir al conductor que se aproxima.
  answer: B
  explanation: Si ve un mensaje advirtiendo de un conductor en sentido contrario adelante,
    debe dirigirse de manera segura hacia la salida de la autopista más cercana lo
    antes posible.
- id: 189
  category: defensive_driving
  question: ¿En qué carril se encuentran usualmente los conductores en sentido contrario
    en una autopista dividida?
  choices:
    A: El carril derecho o el acotamiento (shoulder)
    B: El carril central
    C: El carril izquierdo o el carril HOV
    D: El carril de emergencia
  answer: C
  explanation: El manual señala que, aunque los conductores en sentido contrario entran
    a las autopistas por la derecha a través de las rampas de salida, generalmente
    se les encuentra conduciendo en el carril izquierdo o en el carril HOV.
- id: 190
  category: alcohol_drugs_health
  question: ¿En cuál de los siguientes vehículos está exento un pasajero de la ley
    de envases abiertos mientras viaja?
  choices:
    A: Una camioneta pickup estándar
    B: Un taxi
    C: Un sedán de dos puertas
    D: Una motocicleta
  answer: B
  explanation: Según el manual, los pasajeros que viajan en un autobús, limusina,
    taxi o en el área de vivienda de una casa rodante están exentos de la ley que
    prohíbe los envases abiertos de bebidas alcohólicas.
- id: 191
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor menor de 21 años a quien se le encuentre
    cualquier rastro de alcohol o drogas en su organismo?
  choices:
    A: Una suspensión de la licencia por 30 días
    B: Una suspensión de la licencia por 6 meses
    C: Una suspensión de la licencia por 1 año
    D: Una suspensión de la licencia por 2 años
  answer: D
  explanation: Arizona tiene una política de Cero Tolerancia (Zero-Tolerance) para
    conductores menores de 21 años. Cualquier rastro de alcohol, marihuana, medicamentos
    o drogas ilegales que afecten su capacidad para conducir de manera segura resultará
    en la suspensión de su licencia por 2 años.
- id: 192
  category: penalties_and_points
  question: ¿Cuál es el periodo máximo de suspensión de la licencia de conducir por
    una primera condena por proporcionar a sabiendas licor espirituoso a un menor?
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: A
  explanation: Tras una primera condena por comprar a sabiendas para un menor o proporcionarle
    licor espirituoso, el tribunal puede ordenar al MVD que suspenda la licencia de
    conducir de la persona por un periodo no mayor a 30 días.
- id: 193
  category: safe_driving_rules
  question: Para ser multado por conducción agresiva, un conductor debe representar
    un peligro inmediato, exceder el límite de velocidad establecido y cometer al
    menos ¿cuántas infracciones de tránsito específicas (como seguir demasiado de
    cerca o rebasar por la derecha)?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Usted puede ser multado por conducción agresiva si representa un peligro
    inmediato, excede el límite de velocidad establecido y comete dos de las infracciones
    enumeradas, como cambios de carril inseguros o seguir demasiado de cerca.
- id: 194
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de conducción agresiva?
  choices:
    A: Una advertencia y una multa
    B: Escuela de Supervivencia de Tráfico (Traffic Survival School) y una posible
      suspensión de la licencia por 30 días
    C: Un delito menor de Clase 1 y una suspensión de 12 meses
    D: Incautación inmediata del vehículo por 6 meses
  answer: B
  explanation: Por una primera infracción de conducción agresiva, se le requerirá
    asistir a un curso de la Escuela de Supervivencia de Tráfico (Traffic Survival
    School) y su licencia puede ser suspendida por 30 días.
- id: 195
  category: driver_responsibility
  question: 'Si está solicitando una licencia de conducir, debe informar al MVD si
    ha tenido una convulsión en los últimos:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Una persona que haya tenido una convulsión dentro de los 90 días previos
    a la solicitud de una licencia de conducir está obligada a informar esa condición
    médica al MVD.
- id: 196
  category: defensive_driving
  question: Según el manual, ¿cuál de los siguientes se identifica como uno de los
    cinco grupos de conductores con mayor riesgo de sufrir choques debido a la somnolencia?
  choices:
    A: Trabajadores por turnos
    B: Conductores de edad avanzada
    C: Conductores con pasajeros
    D: Motociclistas
  answer: A
  explanation: Los cinco grupos de conductores identificados con riesgo de choques
    debido a la somnolencia son los trabajadores por turnos, los viajeros de negocios,
    los conductores comerciales, las personas con trastornos del sueño y los jóvenes.
- id: 197
  category: penalties_and_points
  question: Después de que haya terminado un periodo de revocación de la licencia
    y se haya completado la investigación, ¿cuál es la tarifa de restablecimiento
    requerida que debe pagar?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: Para restablecer una licencia revocada después de que se complete la
    investigación, se le requerirá pagar la tarifa de solicitud correspondiente y
    una tarifa de restablecimiento de $20.
- id: 198
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resultará en la revocación de su
    privilegio de conducir?
  choices:
    A: Una sola multa por exceso de velocidad
    B: No ceder el paso
    C: No detenerse y prestar ayuda en el lugar de un choque de tránsito
    D: Parking en una zona para personas con discapacidad sin un distintivo
  answer: C
  explanation: Su privilegio de conducir será revocado por varias infracciones graves,
    incluyendo el no detenerse y prestar ayuda en el lugar si usted está involucrado
    en un choque de tránsito.
- id: 199
  category: penalties_and_points
  question: ¿Su privilegio de conducir será suspendido si recibe dos o más condenas
    por cuál de las siguientes infracciones?
  choices:
    A: Carreras en las carreteras
    B: Conducir sin cinturón de seguridad
    C: Pasarse una señal de alto
    D: Estacionamiento inadecuado
  answer: A
  explanation: Su privilegio de conducir será suspendido por dos o más condenas por
    conducción temeraria o carreras en las carreteras.
- id: 200
  category: penalties_and_points
  question: ¿Bajo cuál de las siguientes circunstancias se confiscará o inmovilizará
    un vehículo?
  choices:
    A: El conductor es sorprendido a 10 mph por encima del límite de velocidad.
    B: El conductor está operando el vehículo con una licencia de conducir suspendida
      o revocada.
    C: El conductor tiene una multa de estacionamiento sin pagar.
    D: El conductor no utiliza una señal de giro.
  answer: B
  explanation: Un vehículo será confiscado o inmovilizado cuando el privilegio de
    conducir de la persona esté suspendido o revocado por cualquier motivo.
- id: 201
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la concentración
    de alcohol en la sangre (BAC)?
  choices:
    A: No puede ser arrestado por DUI si su BAC es inferior a 0.08.
    B: Siempre es seguro y legal conducir siempre que su BAC sea inferior a 0.08.
    C: Aún puede ser arrestado por conducir bajo la influencia incluso si su BAC es
      inferior a 0.08.
    D: El alcohol solo afecta la capacidad de conducción cuando su BAC alcanza exactamente
      0.08.
  answer: C
  explanation: Recuerde, estar por debajo del límite legal de 0.08 de BAC no significa
    que sea legal o seguro para usted conducir y aún puede ser arrestado por conducir
    bajo la influencia. Los estudios demuestran que el alcohol afecta la capacidad
    en niveles sustancialmente inferiores a 0.08.
- id: 202
  category: alcohol_drugs_health
  question: Bajo la ley de envases abiertos, ¿qué área de un vehículo NO se considera
    parte del compartimiento de pasajeros?
  choices:
    A: La guantera
    B: La consola central
    C: El maletero (cajuela)
    D: Cualquier dispositivo portátil al alcance del conductor
  answer: C
  explanation: El compartimiento de pasajeros incluye cualquier compartimiento sin
    llave o dispositivos portátiles al alcance del conductor o del pasajero. No incluye
    el maletero ni el área detrás del último asiento vertical de un vehículo que no
    esté equipado con maletero.
- id: 203
  category: defensive_driving
  question: Según el manual, ¿cuál es la emoción que probablemente ocurre con más
    frecuencia al conducir?
  choices:
    A: Tristeza
    B: Entusiasmo
    C: Ira
    D: Miedo
  answer: C
  explanation: El manual establece que la ira es la emoción que probablemente ocurre
    con más frecuencia al conducir, especialmente en tráfico pesado. Es mejor esperar
    hasta estar tranquilo antes de conducir.
- id: 204
  category: driver_responsibility
  question: Si ya tiene una licencia de conducir y experimenta una convulsión u otra
    condición médica que afecte su capacidad para conducir de manera segura, ¿qué
    debe hacer?
  choices:
    A: Continuar conduciendo pero evitar las autopistas.
    B: Dejar de conducir, notificar al MVD y realizarse un examen médico.
    C: Esperar 30 días para ver si la condición mejora antes de notificar al MVD.
    D: Solo conducir durante las horas del día.
  answer: B
  explanation: Una persona que ya tiene una licencia de conducir y que tiene una convulsión
    u otra condición médica debe dejar de conducir, notificar al MVD y realizarse
    un examen médico.
- id: 205
  category: penalties_and_points
  question: ¿Cuántos puntos acumulados en cualquier período de 12 meses requerirán
    que asista a la Escuela de Supervivencia de Tráfico (TSS) o enfrente la suspensión
    de la licencia?
  choices:
    A: 6 o más puntos
    B: 8 o más puntos
    C: 10 o más puntos
    D: 12 o más puntos
  answer: B
  explanation: Según el manual, si acumula 8 o más puntos en cualquier período de
    12 meses, debe asistir a la Escuela de Supervivencia de Tráfico (TSS), o su privilegio
    de conducir puede ser suspendido.
- id: 206
  category: penalties_and_points
  question: ¿Cuántos puntos de infracción se asignan a su historial de manejo por
    abandonar la escena de un choque?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: El manual establece que abandonar la escena de un choque resulta en
    la asignación de 6 puntos de infracción en su historial de manejo.
- id: 207
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones de tráfico en movimiento resulta
    en la asignación de 8 puntos en su historial de manejo permanente?
  choices:
    A: Exceso de velocidad
    B: Conducir en sentido contrario
    C: Conducción temeraria (Reckless Driving)
    D: Conducir sobre o estacionarse en un área de seguridad (gore area)
  answer: C
  explanation: Según la tabla de puntos por infracción en el manual, la conducción
    temeraria resulta en 8 puntos. El exceso de velocidad son 3 puntos, conducir en
    sentido contrario son 2 puntos y conducir sobre un área de seguridad (gore area)
    son 3 puntos.
- id: 208
  category: penalties_and_points
  question: Si es declarado culpable de pasarse un semáforo en rojo, ¿qué sanción
    es obligatoria además de pagar todas las multas y cargos judiciales?
  choices:
    A: Un embargo del vehículo por 30 días
    B: Una suspensión de la licencia por 6 meses
    C: Asistir a la Escuela de Supervivencia de Tráfico (TSS)
    D: Realizar 40 horas de servicio comunitario
  answer: C
  explanation: El manual establece que si ha sido condenado por pasarse un semáforo
    en rojo (o un semáforo en rojo intermitente), la TSS es obligatoria además de
    pagar todas las multas/cargos judiciales.
- id: 209
  category: alcohol_drugs_health
  question: Bajo la Ley de Consentimiento Implícito, ¿cuál es la sanción por su primera
    negativa a realizar o completar con éxito una prueba química de alcohol o drogas?
  choices:
    A: Una suspensión de 6 meses de su licencia de conducir
    B: Una suspensión de 12 meses de su licencia de conducir
    C: Una suspensión de 24 meses de su licencia de conducir
    D: Revocación permanente de su licencia de conducir
  answer: B
  explanation: La sanción por negarse o no completar con éxito una prueba química
    es una suspensión de 12 meses de su licencia de conducir, o 2 años por una segunda
    o subsiguiente negativa dentro de un período de 7 años.
- id: 210
  category: penalties_and_points
  question: 'Si es citado por conducir con una licencia revocada o suspendida, su
    vehículo puede ser confiscado por la agencia de aplicación de la ley por hasta:'
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: El manual establece que si es citado por conducir con una licencia
    revocada o suspendida, su vehículo puede ser confiscado por la agencia de aplicación
    de la ley por hasta 30 días.
- id: 211
  category: driver_responsibility
  question: ¿Cuál es la sanción por una primera infracción al no presentar evidencia
    de responsabilidad financiera vigente (seguro) dentro del vehículo?
  choices:
    A: Una suspensión de 3 meses de la licencia de conducir, el registro del vehículo
      y las placas de circulación
    B: Una suspensión de 6 meses de la licencia de conducir, el registro del vehículo
      y las placas de circulación
    C: Una suspensión de 1 año de la licencia de conducir, el registro del vehículo
      y las placas de circulación
    D: Una sentencia obligatoria de 30 días de cárcel
  answer: A
  explanation: Una persona condenada por no presentar evidencia de responsabilidad
    financiera vigente recibirá una suspensión de la licencia de conducir, el registro
    del vehículo y las placas de circulación por 3 meses en caso de una primera infracción.
- id: 212
  category: penalties_and_points
  question: 'Si los tribunales de Arizona informan a la MVD que usted está en mora
    con el pago de multas por infracciones de tránsito civiles o penales, la MVD está
    obligada a:'
  choices:
    A: Revocar su licencia de conducir de forma permanente
    B: Prohibir la renovación de cualquier registro de vehículo en el que usted figure
      como propietario
    C: Incautar su vehículo principal por 30 días
    D: Exigirle que vuelva a tomar los exámenes de conducir escrito y práctico
  answer: B
  explanation: La MVD está obligada a actualizar el registro de la persona para prohibir
    la renovación de cualquier registro de vehículo en el que esa persona figure como
    propietario si tiene multas o sanciones pendientes de pago por infracciones de
    tránsito.
- id: 213
  category: alcohol_drugs_health
  question: Si es menor de 18 años y utiliza una identificación falsa para obtener
    un contenedor de óxido nitroso, ¿por cuánto tiempo se suspenderá su privilegio
    de conducir en su primera infracción?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: B
  explanation: Por el uso ilegal de una identificación falsa para obtener óxido nitroso
    siendo menor de 18 años, la sanción por la primera infracción es una suspensión
    de 6 meses de su privilegio de conducir.
- id: 214
  category: alcohol_drugs_health
  question: Perderá su privilegio de conducir en el acto si lo detienen por DUI y
    una prueba muestra que tiene una concentración de alcohol de al menos ¿qué porcentaje?
    (en un vehículo no comercial).
  choices:
    A: 0.02 por ciento
    B: 0.04 por ciento
    C: 0.08 por ciento
    D: 0.15 por ciento
  answer: C
  explanation: Si lo detienen por conducir bajo la influencia (DUI) y una prueba muestra
    que tiene una concentración de alcohol de 0.08 por ciento o más (0.04 en un vehículo
    comercial), perderá su privilegio de conducir en el acto.
- id: 215
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años, su licencia puede ser suspendida si su concentración
    de alcohol es:'
  choices:
    A: 0.02 por ciento o superior
    B: 0.04 por ciento o superior
    C: 0.08 por ciento o superior
    D: Cualquier concentración de alcohol
  answer: D
  explanation: 'El manual establece: "Si es menor de 21 años, su licencia puede ser
    suspendida si hay cualquier concentración de alcohol".'
- id: 216
  category: alcohol_drugs_health
  question: ¿Cuál es el tiempo mínimo de cárcel por una primera infracción de DUI
    estándar?
  choices:
    A: 24 horas
    B: 10 días consecutivos
    C: 30 días consecutivos
    D: 90 días consecutivos
  answer: B
  explanation: Por una primera infracción de DUI, será encarcelado por no menos de
    10 días consecutivos, su licencia de conducir será suspendida por no menos de
    90 días y se le impondrá una multa de no menos de $1,250.
- id: 217
  category: alcohol_drugs_health
  question: 'La categoría de "DUI Extremo" se aplica a una persona con una concentración
    de alcohol de al menos:'
  choices:
    A: '0.08'
    B: '0.10'
    C: '0.15'
    D: '0.20'
  answer: C
  explanation: El manual define el DUI Extremo como aquel que se aplica a una persona
    con una concentración de alcohol de 0.15 o superior.
- id: 218
  category: alcohol_drugs_health
  question: 'Si es condenado por una primera infracción de DUI Extremo y su concentración
    de alcohol es de 0.20 o superior, será encarcelado por no menos de:'
  choices:
    A: 10 días
    B: 30 días
    C: 45 días
    D: 90 días
  answer: C
  explanation: Bajo una primera infracción de DUI Extremo, si la concentración de
    alcohol es de 0.20 o superior, será encarcelado por no menos de 45 días y no será
    elegible para una sentencia suspendida.
- id: 219
  category: penalties_and_points
  question: ¿Cuál de las siguientes circunstancias eleva un DUI estándar a un DUI
    Agravado?
  choices:
    A: Cometer un DUI mientras una persona menor de 15 años está en el vehículo.
    B: Cometer un DUI por primera vez con una concentración de alcohol en sangre de
      0.08.
    C: Cometer un DUI mientras conduce un vehículo comercial.
    D: Cometer un segundo DUI en un plazo de 10 años.
  answer: A
  explanation: Según el manual, la categoría de DUI Agravado se aplica a una persona
    que comete un DUI mientras su privilegio de conducir está suspendido o revocado,
    comete un tercer DUI en 7 años, o comete un DUI mientras una persona menor de
    15 años está en el vehículo.
- id: 220
  category: penalties_and_points
  question: ¿Cuál es la sentencia máxima de prisión por una condena de DUI Agravado?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: Por un DUI Agravado, será enviado a prisión por no más de 2 años y
    su licencia será revocada por 1 año.
- id: 221
  category: penalties_and_points
  question: ¿Cómo funciona un Dispositivo de Interbloqueo de Encendido Certificado
    en un vehículo?
  choices:
    A: Aplica automáticamente los frenos si el conductor se queda dormido.
    B: Requiere que el conductor sople en él antes de encender el motor y a intervalos
      aleatorios mientras conduce.
    C: Limita la velocidad máxima del vehículo a 45 mph.
    D: Notifica a las autoridades de inmediato si el vehículo excede el límite de
      velocidad.
  answer: B
  explanation: Un Dispositivo de Interbloqueo de Encendido Certificado es un instrumento
    de prueba de alcohol en el aliento. El conductor debe soplar en el dispositivo
    antes de intentar encender el motor, y también debe soplar en él a intervalos
    aleatorios mientras el vehículo está en funcionamiento.
- id: 222
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si experimenta un reventón de neumático
    mientras conduce?
  choices:
    A: Pisar los frenos a fondo inmediatamente para detener el vehículo.
    B: Sujetar el volante con firmeza y mantener el vehículo en línea recta.
    C: Girar el volante bruscamente hacia el acotamiento de la carretera.
    D: Acelerar ligeramente para mantener el control del vehículo.
  answer: B
  explanation: Si ocurre un reventón de neumático, debe sujetar el volante con firmeza
    y mantener el vehículo en línea recta, soltar gradualmente el pedal del acelerador
    y no aplicar los frenos hasta que el vehículo casi se haya detenido.
- id: 223
  category: safe_driving_rules
  question: ¿Qué es lo que NUNCA debe usar para apagar el incendio de un vehículo
    si hay gasolina ardiendo?
  choices:
    A: Un extintor de químicos secos con clasificación ABC
    B: Una manta pesada
    C: Arena
    D: Agua
  answer: D
  explanation: 'El manual establece: ''No use agua si la gasolina se está quemando,
    ya que esto propagará las llamas''.'
- id: 224
  category: vehicle_information
  question: Si sale vapor de debajo del capó, ¿por qué debe evitar abrir el tapón
    del radiador?
  choices:
    A: Hará que el bloque del motor se agriete.
    B: Inundará el motor con refrigerante.
    C: El vapor puede escapar y causar quemaduras graves.
    D: Dañará permanentemente el radiador.
  answer: C
  explanation: Si su sistema de enfriamiento se ha sobrecalentado, debe levantar el
    capó pero no abrir el tapón del radiador, ya que abrirlo mientras el motor está
    caliente puede permitir que el vapor escape y cause quemaduras graves.
- id: 225
  category: defensive_driving
  question: 'Si el motor se apaga mientras gira en una esquina, provocando una falla
    en la dirección asistida, usted debe:'
  choices:
    A: Soltar el volante y aplicar el freno de emergencia.
    B: Sujetar firmemente el volante con ambas manos para completar el giro.
    C: Poner la marcha atrás (reversa) para reiniciar el motor.
    D: Bombear el pedal del acelerador rápidamente.
  answer: B
  explanation: En caso de falla de la dirección asistida, debe sujetar firmemente
    el volante con ambas manos para completar el giro y moverse hacia el lado derecho
    de la carretera.
- id: 226
  category: defensive_driving
  question: ¿Cuál de los siguientes es el primer paso recomendado si sus faros fallan
    mientras conduce?
  choices:
    A: Probar el interruptor de luces altas/bajas.
    B: Cerrar los ojos y frenar con fuerza.
    C: Apagar el motor y dejar que el vehículo se detenga por inercia.
    D: Dirigirse al carril contrario para usar los faros de otros vehículos.
  answer: A
  explanation: Si experimenta una falla en los faros, el primer paso recomendado es
    probar el interruptor de luces altas/bajas, ya que esto podría restaurar el funcionamiento
    normal.
- id: 227
  category: defensive_driving
  question: Si su vehículo NO tiene frenos antibloqueo (ABS) y sus frenos fallan,
    ¿qué debe hacer primero?
  choices:
    A: Presionar y mantener el pedal del freno hasta el fondo.
    B: Bombear los frenos rápidamente para acumular presión.
    C: Tirar inmediatamente del freno de mano con la mayor fuerza posible.
    D: Cambiar a la marcha más alta disponible.
  answer: B
  explanation: Si un vehículo no tiene frenos antibloqueo y los frenos fallan, debe
    bombear los frenos rápidamente. Esto puede acumular suficiente presión para detener
    el vehículo.
- id: 228
  category: defensive_driving
  question: Si está detenido en un semáforo y un choque por alcance de un vehículo
    que se aproxima es inevitable, ¿cómo puede disminuir el impacto?
  choices:
    A: Presione con fuerza el pedal del freno e inclínese hacia adelante.
    B: Apóyese firmemente entre el volante y el respaldo del asiento y suelte el freno
      un instante antes del impacto.
    C: Desabroche su cinturón de seguridad y acuéstese sobre los asientos delanteros.
    D: Gire el volante bruscamente hacia la izquierda.
  answer: B
  explanation: Si un choque por alcance no se puede evitar, apóyese firmemente entre
    el volante y el respaldo del asiento y suelte el freno un instante antes del impacto
    para ayudar a disminuir la fuerza del mismo.
- id: 229
  category: defensive_driving
  question: Si está en peligro de un posible choque frontal, ¿qué acción se recomienda?
  choices:
    A: Aumentar la velocidad para pasar rápidamente al vehículo que viene de frente.
    B: Dirigirse hacia el acotamiento y salir de la carretera lejos del conductor
      que viene de frente.
    C: Girar hacia el carril contrario para evitar al conductor.
    D: Apagar los faros para que el otro conductor no se deslumbre.
  answer: B
  explanation: Para evitar un posible choque frontal, debe reducir la velocidad, hacer
    destellos con los faros, usar la bocina y dirigirse hacia el acotamiento para
    salir de la carretera y alejarse del conductor que viene en sentido contrario.
- id: 230
  category: defensive_driving
  question: Cuando conduce en una calle de dos carriles con autos que vienen de frente
    a su izquierda y un niño en bicicleta a su derecha, ¿cuál es la concesión correcta
    de manejo defensivo?
  choices:
    A: Acercarse más al niño para darles más espacio a los autos que vienen de frente.
    B: Detener el vehículo por completo hasta que el niño pase.
    C: Acercarse más a la línea central para crear un colchón de espacio más grande
      a la derecha.
    D: Tocar la bocina continuamente hasta que el niño se salga de la carretera.
  answer: C
  explanation: Al equilibrar los riesgos, dé el mayor espacio al peligro más grande
    o más probable. Es más probable que el niño se mueva repentinamente, por lo que
    acercarse a la línea central proporciona un colchón de espacio más grande hacia
    la derecha.
- id: 231
  category: defensive_driving
  question: ¿Cuál es la técnica de dirección correcta para recuperarse de un derrape?
  choices:
    A: Mantener el volante perfectamente recto.
    B: Girar el volante rápidamente en la dirección opuesta al derrape.
    C: Girar el volante rápidamente en la dirección que desea que siga su vehículo.
    D: Bloquear el volante y aplicar el freno de estacionamiento.
  answer: C
  explanation: Para recuperarse de un derrape, gire el volante rápidamente en la dirección
    que desea que siga su vehículo (en la dirección del derrape) y, a medida que el
    automóvil se enderece, gírelo hacia el otro lado.
- id: 232
  category: license_system
  question: ¿Cuál es la función principal de la Oficina de Audiencias Ejecutivas (Executive
    Hearing Office)?
  choices:
    A: Emitir nuevas licencias de conducir a residentes de otros estados.
    B: Realizar audiencias para personas o empresas que impugnan una Orden emitida
      por el MVD.
    C: Inspeccionar vehículos para verificar el cumplimiento de seguridad y emisiones.
    D: Cobrar multas por infracciones de estacionamiento.
  answer: B
  explanation: La Oficina de Audiencias Ejecutivas realiza audiencias solicitadas
    por personas o empresas que impugnan una Orden emitida por el MVD, que con mayor
    frecuencia involucran una apelación a la suspensión o revocación de una licencia.
- id: 233
  category: defensive_driving
  question: ¿Por qué puede ser peligroso dar un volantazo para evitar escombros en
    la calzada?
  choices:
    A: Es ilegal cambiar de carril sin usar la señal de giro.
    B: Puede hacer que el conductor pierda el control del vehículo y se salga de la
      calzada.
    C: Activará automáticamente el sistema de frenos antibloqueo del vehículo.
    D: Hace que los neumáticos se sobrecalienten y revienten.
  answer: B
  explanation: El manual señala que un choque común relacionado con escombros ocurre
    cuando un conductor da un volantazo para evitar el peligro, pierde el control
    de su vehículo y se salga de la calzada. En algunos casos, pasar sobre los escombros
    es más seguro.
- id: 234
  category: defensive_driving
  question: ¿Cuál es una causa común de choques relacionados con escombros en la calzada?
  choices:
    A: Conducir directamente sobre los escombros
    B: Dar un volantazo para evitar el peligro y perder el control
    C: Tocar la bocina para advertir a otros conductores
    D: Detenerse por completo en medio del carril de circulación
  answer: B
  explanation: Según el manual, un choque común relacionado con escombros ocurre cuando
    un conductor da un volantazo para evitar el peligro, pierde el control de su vehículo
    y se sale de la calzada.
- id: 235
  category: defensive_driving
  question: ¿Qué debe hacer si ve un animal cerca de la carretera que aún no está
    en la calzada?
  choices:
    A: Tocar la bocina con fuerza para ahuyentarlo
    B: Encender y apagar las luces altas repetidamente
    C: No toque la bocina, ya que podría asustar al animal
    D: Virar hacia el carril opuesto para darle espacio adicional
  answer: C
  explanation: El manual establece que si el animal aún no está en la carretera, no
    debe tocar la bocina, ya que eso podría asustar al animal y hacer que corra frente
    a usted.
- id: 236
  category: driver_responsibility
  question: ¿Cuál de los siguientes datos NO está obligado a intercambiar con otros
    conductores después de un choque?
  choices:
    A: Número de la licencia de conducir
    B: Número de Seguro Social
    C: Nombre de la compañía de seguros y número de póliza
    D: Números de las placas de circulación
  answer: B
  explanation: Después de un choque, debe proporcionar su número de licencia de conducir,
    nombre y dirección, información del seguro, información de testigos y números
    de placa. No se requiere el número de Seguro Social.
- id: 237
  category: driver_responsibility
  question: Si usted es una de las primeras personas en llegar a la escena de un choque,
    ¿cuál es una de las acciones que debe tomar?
  choices:
    A: Pararse en los carriles de tráfico para dirigir a los vehículos que se aproximan
    B: Apagar el motor (ignición) de los vehículos involucrados en el choque
    C: Sacar inmediatamente a los pasajeros heridos de sus vehículos
    D: Abandonar la escena para buscar a un oficial de policía
  answer: B
  explanation: Si es el primero en la escena, debe salir de la carretera, encender
    las luces de emergencia, apagar el motor de los vehículos involucrados, llamar
    al 911 y evitar pararse en los carriles de tráfico.
- id: 238
  category: safe_driving_rules
  question: Según la ley estatal, ¿qué debe hacer si se ve involucrado en un choque
    menor sin heridos y su vehículo puede funcionar de manera segura?
  choices:
    A: Dejar el vehículo exactamente donde está hasta que llegue la policía
    B: Retirar el vehículo de la calzada
    C: Esperar a que una grúa mueva el vehículo
    D: Conducir a casa y reportar el choque al día siguiente
  answer: B
  explanation: La ley estatal exige que un conductor involucrado en un choque menor
    sin heridos retire el vehículo de la calzada si este funciona y puede moverse
    de manera segura.
- id: 239
  category: penalties_and_points
  question: ¿Cuál es la sanción por no detenerse en la escena de un choque que solo
    involucra daños a un vehículo?
  choices:
    A: Suspensión del privilegio de conducir por 6 meses
    B: Suspensión del privilegio de conducir por 1 año
    C: Revocación del privilegio de conducir por 3 años
    D: Revocación del privilegio de conducir por 5 años
  answer: B
  explanation: Una condena por no detenerse resultará en la suspensión de su privilegio
    de conducir por 1 año si el choque solo involucra daños a un vehículo.
- id: 240
  category: penalties_and_points
  question: 'Si no se detiene en la escena de un choque que involucra una muerte,
    su privilegio de conducir será revocado por:'
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: 10 años, sin incluir el tiempo de encarcelamiento
  answer: D
  explanation: No detenerse en un choque que involucre una muerte resultará en la
    revocación de su privilegio de conducir por 10 años, sin incluir el tiempo que
    esté encarcelado.
- id: 241
  category: safe_driving_rules
  question: ¿Qué debe hacer para ayudar con la visibilidad cuando la policía lo detiene
    por la noche?
  choices:
    A: Encender las luces altas
    B: Encender las luces interiores
    C: Apagar todas las luces del vehículo
    D: Salir del vehículo con una linterna
  answer: B
  explanation: Durante una parada de tráfico por la noche, debe encender las luces
    interiores para ayudar con la visibilidad.
- id: 242
  category: driver_responsibility
  question: Durante una parada de tráfico, ¿cuándo debe buscar su licencia de conducir
    y los documentos del vehículo?
  choices:
    A: Tan pronto como se detenga, antes de que el oficial se acerque
    B: Mientras el oficial camina hacia su ventana
    C: Solo después de esperar las instrucciones del oficial
    D: Solo si el oficial amenaza con arrestarlo
  answer: C
  explanation: Debe esperar las instrucciones del oficial antes de buscar su licencia
    de conducir o los documentos del vehículo.
- id: 243
  category: driver_responsibility
  question: ¿Qué debe hacer si tiene un arma en el vehículo durante una parada de
    tráfico?
  choices:
    A: Esconderla debajo del asiento antes de que el oficial se acerque
    B: Entregársela al oficial de inmediato
    C: Informar al oficial en el primer contacto
    D: No decir nada a menos que el oficial registre el auto
  answer: C
  explanation: Cuando el oficial se acerque al vehículo, recuerde informarle si tiene
    un arma en el vehículo en el primer contacto.
- id: 244
  category: penalties_and_points
  question: ¿Qué puede suceder si se niega a firmar una multa de tráfico?
  choices:
    A: La multa será desestimada automáticamente
    B: Se le dará una advertencia en su lugar
    C: Puede resultar en su arresto
    D: Su licencia será revocada inmediatamente por 1 año
  answer: C
  explanation: Su aceptación y firma en una multa de tráfico no es una admisión de
    culpabilidad. Sin embargo, la negativa a firmar una multa de tráfico puede resultar
    en su arresto.
- id: 245
  category: driver_responsibility
  question: Si no está de acuerdo con la decisión de un oficial de policía de emitir
    una multa de tráfico, ¿cuál es el curso de acción recomendado?
  choices:
    A: Discutir con el oficial para prolongar el contacto
    B: Negarse a firmar la multa
    C: Intentar impugnar la decisión en el tribunal a través de los canales legales
      establecidos
    D: Alejarse conduciendo mientras el oficial escribe la multa
  answer: C
  explanation: Si no está de acuerdo con la decisión del oficial, no prolongue el
    contacto discutiendo. En su lugar, puede intentar impugnar la decisión en el tribunal
    a través de los canales legales establecidos.
- id: 246
  category: safe_driving_rules
  question: 'Si mueve un vehículo motorizado de la parte principal transitada de la
    carretera antes de que llegue la policía después de un choque menor, usted:'
  choices:
    A: Será considerado totalmente responsable del choque
    B: No será considerado responsable ni culpable basándose únicamente en el hecho
      de que el vehículo fue movido
    C: Será citado por manipulación de pruebas
    D: Debe pagar los gastos de remolque del otro conductor
  answer: B
  explanation: Cualquier persona que retire un vehículo motorizado de la parte principal
    transitada de la carretera antes de la llegada de la policía no será considerada
    responsable ni culpable del choque basándose únicamente en el hecho de que el
    vehículo fue movido.
- id: 247
  category: penalties_and_points
  question: 'No detenerse en la escena de un choque que involucre una lesión (que
    no sea la muerte o una lesión física grave) resultará en que su privilegio de
    conducir sea:'
  choices:
    A: Suspendido por 1 año
    B: Revocado por 3 años
    C: Revocado por 5 años
    D: Revocado por 10 años
  answer: B
  explanation: Una condena por no detenerse resultará en la revocación de su privilegio
    de conducir por 3 años si involucra una lesión que no sea la muerte o una lesión
    física grave.
- id: 248
  category: vehicle_information
  question: ¿Cuál de los siguientes elementos recomienda el manual incluir en el kit
    de emergencia de su vehículo?
  choices:
    A: Un volante de repuesto
    B: Cables de arranque (jumper cables)
    C: Una televisión portátil
    D: Placas de matrícula adicionales
  answer: B
  explanation: El manual enumera varios artículos para considerar empacar en un kit
    de emergencia, incluyendo cables de arranque, una linterna, un kit de primeros
    auxilios y mantas.
- id: 249
  category: vehicle_information
  question: Según el manual, ¿cuál de los siguientes artículos se recomienda tener
    en su vehículo?
  choices:
    A: Bengalas (flares)
    B: Conos de tráfico
    C: Un generador portátil
    D: Un saco de dormir
  answer: A
  explanation: El manual enumera las "Bengalas" (flares) entre los artículos recomendados
    para llevar en su vehículo.
- id: 250
  category: vehicle_information
  question: ¿Cuál de los siguientes se enumera como un artículo recomendado para su
    vehículo?
  choices:
    A: Anticongelante
    B: Cables de arranque (jumper cables)
    C: Líquido de frenos
    D: Líquido de dirección asistida
  answer: B
  explanation: Los "Cables de arranque" (jumper cables) se enumeran explícitamente
    en los artículos recomendados del manual.
- id: 251
  category: vehicle_information
  question: ¿Qué tipo de fluido para el vehículo se menciona específicamente como
    un artículo recomendado para llevar?
  choices:
    A: Líquido de transmisión
    B: Líquido limpiaparabrisas
    C: Aceite de motor
    D: Refrigerante
  answer: C
  explanation: El manual menciona específicamente el "Aceite de motor" como un artículo
    para llevar.
- id: 252
  category: vehicle_information
  question: Junto con un gato y una llanta de repuesto, ¿qué otra herramienta se agrupa
    específicamente con ellos en la lista del manual?
  choices:
    A: Manómetro de presión de llantas
    B: Llave de tuercas (llave de cruz)
    C: Compresor de aire
    D: Kit de parches para llantas
  answer: B
  explanation: El manual enumera juntos el "Gato, llave de tuercas y llanta de repuesto".
- id: 253
  category: vehicle_information
  question: ¿Cuáles de los siguientes se enumeran como ejemplos de herramientas manuales
    que debería llevar?
  choices:
    A: Martillo, sierra y taladro
    B: Mazo, cincel y lima
    C: Juego de dados, trinquete y llaves hexagonales
    D: Destornillador, alicates y llaves
  answer: D
  explanation: El manual especifica "Herramientas manuales (destornillador, alicates,
    llaves)".
- id: 254
  category: vehicle_information
  question: ¿Qué tipo de artículo de limpieza se recomienda mantener en su vehículo?
  choices:
    A: Toallas de papel
    B: Paños absorbentes
    C: Esponjas
    D: Gamuza
  answer: B
  explanation: El manual enumera los "Paños absorbentes" como un artículo recomendado.
- id: 255
  category: vehicle_information
  question: ¿Qué materiales de escritura se recomienda mantener en su vehículo?
  choices:
    A: Libreta de notas y lápiz
    B: Portapapeles y bolígrafo
    C: Tableta y lápiz óptico
    D: Pizarrón y tiza
  answer: A
  explanation: El manual recomienda llevar una "Libreta de notas y lápiz".
- id: 256
  category: license_system
  question: ¿Qué división del Departamento de Transporte de Arizona publicó este manual?
  choices:
    A: División de Patrulla de Caminos
    B: División de Vehículos Motorizados (MVD)
    C: División de Seguridad Vial
    D: División de Servicios al Conductor
  answer: B
  explanation: El texto indica que es de la "División de Vehículos Motorizados (MVD)
    del Departamento de Transporte de Arizona".
- id: 257
  category: license_system
  question: ¿Cuál es el sitio web oficial proporcionado para la División de Vehículos
    Motorizados del Departamento de Transporte de Arizona?
  choices:
    A: azmvd.gov
    B: adot.state.az.us
    C: arizona.gov/mvd
    D: azdot.gov
  answer: D
  explanation: El sitio web que figura en el texto del manual es "azdot.gov".
- id: 258
  category: vehicle_information
  question: Según la lista proporcionada de artículos recomendados para el vehículo,
    ¿cuál de los siguientes NO se menciona explícitamente?
  choices:
    A: Bengalas
    B: Extintor de incendios
    C: Cables de corriente (cables de puente)
    D: Aceite de motor
  answer: B
  explanation: Si bien se enumeran las bengalas, los cables de corriente y el aceite
    de motor, no se menciona explícitamente un extintor de incendios en este fragmento
    de texto específico.
- id: 259
  category: vehicle_information
  question: ¿Cuál de los siguientes artículos NO está incluido en la lista de herramientas
    manuales recomendadas del manual?
  choices:
    A: Destornillador
    B: Alicates
    C: Martillo
    D: Llaves
  answer: C
  explanation: El manual enumera las herramientas manuales como "(destornillador,
    alicates, llaves)". No se incluye un martillo.
- id: 260
  category: vehicle_information
  question: Según el manual, ¿qué artículo es necesario llevar junto con un gato y
    una llave de tuercas para solucionar una llanta ponchada?
  choices:
    A: Sellador de llantas
    B: Bomba de aire
    C: Llanta de repuesto
    D: Bloques para llantas
  answer: C
  explanation: El manual agrupa el "Gato, llave de tuercas y llanta de repuesto".
- id: 261
  category: vehicle_information
  question: ¿Para qué propósito se recomiendan generalmente los artículos enumerados
    en esta sección, como bengalas, cables de arranque y un gato?
  choices:
    A: Mantenimiento rutinario del vehículo
    B: Aprobar una inspección de vehículos
    C: Emergencias del vehículo y reparaciones básicas
    D: Mejorar el rendimiento del vehículo
  answer: C
  explanation: Artículos como bengalas, cables de arranque, un gato y una llanta de
    repuesto son componentes estándar de un kit de emergencia y reparaciones básicas
    para el vehículo.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 262
- image: yield.png
  category: signs_and_signals
  question: ¿Qué requiere que haga esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 263
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico que viene en sentido contrario.
  id: 264
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda
    de manera segura.
  id: 265
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 266
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 267
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 268
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 269
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 270
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha únicamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isleta
    de tráfico, mediana u obstrucción.
  id: 271
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad indican la velocidad máxima legal para el área
    bajo condiciones ideales.
  id: 272
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 273
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que crucen la calle.
  id: 274
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal de forma pentagonal (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 275
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 276
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces de vías férreas. Significa que debe ceder el paso a los trenes.
    Si se aproxima un tren, debe detenerse.
  id: 277
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Se requiere giro a la derecha
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 278
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos severo
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 279
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera curve primero
    hacia un lado y luego hacia el otro.
  id: 280
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 281
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Esté preparado para
    ajustar su velocidad y posición.
  id: 282
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la carretera y
    ajuste su posición en el carril.
  id: 283
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 284
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
  id: 285
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: Tráfico en ambos sentidos más adelante — el tráfico se mueve en ambas direcciones
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos más adelante. Puede
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 286
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 287
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 288
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 289
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 290
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde los caminos laterales.
  id: 291
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 292
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 293
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer parado o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 294
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 295
