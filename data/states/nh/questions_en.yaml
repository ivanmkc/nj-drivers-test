metadata:
  source: New Hampshire Driver Manual (dmv.nh.gov)
  total_questions: 268
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: safe_driving_rules
  question: What three actions does Governor Kelly A. Ayotte specifically encourage
    drivers to do to improve road safety?
  choices:
    A: Drive the speed limit, use turn signals, and wear a seatbelt.
    B: Slow down, avoid distractions while driving, and look out for your fellow travelers.
    C: Yield to pedestrians, stop at red lights, and check mirrors.
    D: Keep headlights on, avoid driving at night, and maintain tire pressure.
  answer: B
  explanation: In her opening message, Governor Kelly A. Ayotte encourages drivers
    to do their part by slowing down, avoiding distractions while driving, and looking
    out for fellow travelers.
- id: 2
  category: driver_responsibility
  question: According to Director John C. Marasco, the manual provides an overview
    of the dangers and penalties associated with which specific illegal activities?
  choices:
    A: Speeding, running stop signs, and illegal parking.
    B: Texting while driving, tailgating, and road rage.
    C: Impaired driving, failure to yield to emergency vehicles, and improper clearing
      of snow and ice.
    D: Driving without a license, expired registration, and broken taillights.
  answer: C
  explanation: The Director's message states that the manual provides an overview
    of the dangers and penalties associated with illegal activities such as impaired
    driving, failure to yield to emergency vehicles, and laws relating to the proper
    clearing of snow and ice.
- id: 3
  category: safe_driving_rules
  question: What motto does the Director of Motor Vehicles challenge drivers to follow
    each day?
  choices:
    A: Drive Safe, Live Free!
    B: Safety First, Always!
    C: Arrive Alive in New Hampshire!
    D: Be a Leader on the Roadway!
  answer: D
  explanation: Director John C. Marasco challenges drivers to be the best driver they
    can be each day and always - 'Be a Leader on the Roadway!'
- id: 4
  category: driver_responsibility
  question: According to Section 1 of the manual's Table of Contents, what topic is
    covered regarding giving the 'Gift of Life'?
  choices:
    A: Blood Donation
    B: Organ Donation
    C: Defensive Driving
    D: Yielding to Pedestrians
  answer: B
  explanation: 'The Table of Contents lists ''Organ Donation Giving the Gift of LIfe''
    under Section 1: Driving in New Hampshire.'
- id: 5
  category: license_system
  question: Which specific law regarding young drivers is covered in Section 2 of
    the manual?
  choices:
    A: The Junior Operator 'Under 18' Law
    B: The Teen Driver 'Under 21' Law
    C: The Youth Operator 'Under 20' Law
    D: The Graduated License 'Under 19' Law
  answer: C
  explanation: Section 2 of the Table of Contents explicitly lists the 'Youth Operator
    Under 20 Law'.
- id: 6
  category: defensive_driving
  question: Based on the Table of Contents, which of the following is categorized
    under Section 3, 'Dangerous Driving'?
  choices:
    A: Adjusting Vehicle Mirrors
    B: Fatigue
    C: Yielding Right-of-Way
    D: Towing a Trailer
  answer: B
  explanation: 'The Table of Contents lists ''Fatigue'' as a topic under Section 3:
    Dangerous Driving.'
- id: 7
  category: vehicle_information
  question: In Section 4, 'Before Driving,' which of the following topics is discussed
    regarding preparing your vehicle in winter weather?
  choices:
    A: Installing snow tires
    B: Checking antifreeze levels
    C: Snow and Ice Removal
    D: Warming up the engine
  answer: C
  explanation: Section 4 of the Table of Contents includes a subsection dedicated
    to 'Snow and Ice Removal'.
- id: 8
  category: safe_driving_rules
  question: Which of the following is listed as a topic under Section 5, 'Basic Driving'?
  choices:
    A: Air Bags
    B: Communicating and Signaling
    C: Habitual offenders
    D: Driver Distractions
  answer: B
  explanation: 'According to the Table of Contents, ''Communicating and Signaling''
    is a topic covered in Section 5: Basic Driving.'
- id: 9
  category: driver_responsibility
  question: 'The Director of Motor Vehicles notes that the manual offers important
    guidance on what to expect and do if you are:'
  choices:
    A: Involved in a multi-car collision.
    B: Stranded on the side of the highway.
    C: Trying to register an out-of-state vehicle.
    D: Stopped by a police officer while driving.
  answer: D
  explanation: The Director's message states that the manual offers important guidance
    relating to what to expect and what you should do if you are stopped by a police
    officer while driving.
- id: 10
  category: license_system
  question: According to the Table of Contents, information about 'REAL ID' can be
    found in which section?
  choices:
    A: 'Section 1: Driving in New Hampshire'
    B: 'Section 2: Driver''s License and Non-Driver ID Information'
    C: 'Section 3: Dangerous Driving'
    D: 'Section 4: Before Driving'
  answer: B
  explanation: 'The Table of Contents lists ''REAL ID'' under Section 2: Driver''s
    License and Non-Driver ID Information.'
- id: 11
  category: vehicle_information
  question: Which safety equipment requirement is specifically listed in Section 4
    of the Table of Contents?
  choices:
    A: Bicycle Helmet Use
    B: Reflective Vest Use
    C: Motorcycle Helmet Use
    D: Fire Extinguisher Use
  answer: C
  explanation: Section 4 of the Table of Contents includes a subsection titled 'Motorcycle
    Helmet Use'.
- id: 12
  category: defensive_driving
  question: According to Section 3 of the Table of Contents, which of the following
    is considered a factor in 'Dangerous Driving'?
  choices:
    A: Emotions
    B: Steering
    C: Speed Management
    D: Practice Driving
  answer: A
  explanation: 'The Table of Contents lists ''Emotions'' as a topic under Section
    3: Dangerous Driving.'
- id: 13
  category: penalties_and_points
  question: What topic related to the loss of driving privileges is specifically named
    in Section 2 of the Table of Contents?
  choices:
    A: Parking tickets
    B: Toll evasion
    C: Habitual offenders
    D: Noise violations
  answer: C
  explanation: Section 2 of the Table of Contents lists 'Habitual offenders' immediately
    following 'Loss of Driving Privileges'.
- id: 14
  category: defensive_driving
  question: According to the Director's message, what can lead to an unintended tragedy
    on the roadway?
  choices:
    A: Driving a vehicle older than 10 years.
    B: Failing to upgrade to a REAL ID.
    C: Just one moment of inattention, distraction, or dangerous driving.
    D: Driving with out-of-state plates.
  answer: C
  explanation: Director John C. Marasco reminds drivers that 'just one moment of inattention,
    distraction, or dangerous driving can lead to an unintended tragedy.'
- id: 15
  category: safe_driving_rules
  question: Which of the following passenger safety topics is explicitly listed in
    Section 4, 'Before Driving'?
  choices:
    A: Pet Restraint Laws
    B: Child Passenger Safety Laws
    C: Elderly Passenger Safety
    D: School Bus Passenger Rules
  answer: B
  explanation: 'The Table of Contents explicitly lists ''Child Passenger Safety Laws''
    under Section 4: Before Driving.'
- id: 16
  category: license_system
  question: When practicing driving out on the road, a learner must be accompanied
    by a driver education instructor or a licensed, responsible adult who is at least
    what age?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: 30 years old
  answer: C
  explanation: The manual states that learning how to drive should be studied and
    applied in conjunction with training and practice out on the road with a driver
    education instructor or a licensed, responsible adult age 25 years or older.
- id: 17
  category: license_system
  question: Under New Hampshire law, individuals of what age must complete an approved
    driver education program before applying for a driver's license?
  choices:
    A: 15 or 16 years of age
    B: 16 or 17 years of age
    C: 17 or 18 years of age
    D: Under 21 years of age
  answer: B
  explanation: State of New Hampshire law RSA 263:19 requires that all individuals
    16 or 17 years of age wishing to apply for a driver's license have first completed
    an approved driver education program.
- id: 18
  category: license_system
  question: How many hours of classroom instruction with a certified driver education
    instructor are required for an approved driver education program?
  choices:
    A: 10 hours
    B: 20 hours
    C: 30 hours
    D: 40 hours
  answer: C
  explanation: The requirements of Driver Education include 30 hours of classroom
    instruction with a certified driver education instructor.
- id: 19
  category: license_system
  question: According to the requirements of Driver Education, how many hours of practice
    driving are required?
  choices:
    A: 5 hours
    B: 10 hours
    C: 20 hours
    D: 30 hours
  answer: B
  explanation: The manual lists 10 hours of practice driving as a requirement of Driver
    Education.
- id: 20
  category: vehicle_information
  question: Under which Title of the New Hampshire Revised Statutes Annotated (RSAs)
    can the motor vehicle laws be found?
  choices:
    A: Title 10
    B: Title 15
    C: Title 21
    D: Title 25
  answer: C
  explanation: The manual advises reviewing the Revised Statutes Annotated (RSAs)
    sections 259 through 269 under Title 21 (Motor Vehicles).
- id: 21
  category: license_system
  question: Approximately how many students participate in driver education every
    year through State approved driving schools in New Hampshire?
  choices:
    A: Over 5,000
    B: Over 10,000
    C: Over 13,000
    D: Over 20,000
  answer: C
  explanation: The manual states that over 13,000 students participate in driver education
    every year through State approved driving schools.
- id: 22
  category: sharing_the_road
  question: 'According to the Table of Contents, which of the following topics is
    covered under Section 11: ''Sharing the Road''?'
  choices:
    A: Parallel Parking
    B: Interacting with Large Trucks and Commercial Vehicles
    C: Dealing with Skids
    D: Financial Responsibility
  answer: B
  explanation: 'The Table of Contents lists ''Interacting with Large Trucks and Commercial
    Vehicles'' under Section 11: Sharing the Road.'
- id: 23
  category: safe_driving_rules
  question: 'Which of the following is categorized under Section 10: ''Driving Emergencies''
    in the New Hampshire Driver''s Manual?'
  choices:
    A: Uneven Surface Drop-Offs
    B: Multi-lane Roundabouts
    C: Visual Search
    D: Toll Roads
  answer: A
  explanation: 'The Table of Contents lists ''Uneven Surface Drop-Offs'' under Section
    10: Driving Emergencies.'
- id: 24
  category: safe_driving_rules
  question: Where would a driver look in the manual to find rules regarding Multi-lane
    Roundabouts (Traffic Circles)?
  choices:
    A: 'Section 6: Rules of the Road'
    B: 'Section 7: General Driving and Parking'
    C: 'Section 8: Driving Safely'
    D: 'Section 11: Sharing the Road'
  answer: B
  explanation: 'The Table of Contents places ''Multi-lane Roundabouts (Traffic Circles)''
    under Section 7: General Driving and Parking.'
- id: 25
  category: driver_responsibility
  question: The topic of 'Financial Responsibility' is grouped together with which
    other topic in Section 9 of the manual?
  choices:
    A: Vehicle Malfunctions
    B: Accident procedures
    C: Safe Driving Tips
    D: Traffic Control Devices
  answer: B
  explanation: Section 9 of the manual is titled 'ACCIDENTS AND FINANCIAL RESPONSIBILITY'
    and includes 'Accident procedures' and 'Financial Responsibility'.
- id: 26
  category: signs_and_signals
  question: Which section of the manual covers Traffic Control Devices, Warning Signs,
    and Pavement Markings?
  choices:
    A: 'Section 6: Rules of the Road'
    B: 'Section 7: General Driving and Parking'
    C: 'Section 8: Driving Safely'
    D: 'Section 10: Driving Emergencies'
  answer: A
  explanation: 'According to the Table of Contents, Section 6: Rules of the Road includes
    Traffic Control Devices, Warning Signs, and Pavement Markings.'
- id: 27
  category: safe_driving_rules
  question: In addition to assisting a person learning how to drive, what is another
    intended use for the New Hampshire Driver's Manual?
  choices:
    A: To serve as a legal document in court
    B: To replace the need for a certified driver education instructor
    C: To be used as a resource to review everyday driving habits
    D: To provide a comprehensive list of all state laws
  answer: C
  explanation: The manual states, 'This manual may also be used as a resource to review
    everyday driving habits.'
- id: 28
  category: defensive_driving
  question: '''Visual Search'' and ''Space Management'' are subtopics found under
    which main section of the New Hampshire Driver''s Manual?'
  choices:
    A: 'Section 6: Rules of the Road'
    B: 'Section 8: Driving Safely'
    C: 'Section 10: Driving Emergencies'
    D: 'Section 11: Sharing the Road'
  answer: B
  explanation: 'The Table of Contents lists ''Visual Search'' and ''Space Management''
    under Section 8: Driving Safely.'
- id: 29
  category: driver_testing
  question: How many hours of supervised driving time with a parent, guardian, or
    responsible adult are required to fulfill New Hampshire's driver education requirements?
  choices:
    A: 20 hours, including 5 hours at night
    B: 30 hours, including 10 hours at night
    C: 40 hours, including 10 hours at night
    D: 50 hours, including 15 hours at night
  answer: C
  explanation: The requirements of driver education include 40 hours of additional
    supervised driving time with a parent, guardian or other responsible adult, in
    which 10 hours must be completed at night.
- id: 30
  category: license_system
  question: How many days do new residents to New Hampshire have to obtain a driver's
    license after moving into the state?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: According to the manual, new residents to New Hampshire have up to
    60 days to obtain a driver's license after moving into the State.
- id: 31
  category: license_system
  question: If you do not possess a driver's license, at what minimum age does New
    Hampshire law allow you to practice driving when accompanied by a licensed responsible
    adult who is 25 years of age or older?
  choices:
    A: 15 years of age
    B: 15 ½ years of age
    C: 16 years of age
    D: 16 ½ years of age
  answer: B
  explanation: New Hampshire law allows a person at least 15 ½ years of age, who does
    not possess a driver's license, to drive a motor vehicle while being taught to
    drive, when accompanied by a parent, legal guardian, or a responsible adult who
    is 25 years of age or older.
- id: 32
  category: driver_testing
  question: What is the minimum visual acuity required in both eyes to pass the New
    Hampshire vision test for a driver's license?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Applicants must have a visual acuity of 20/40 vision in both eyes.
    If an applicant has sight in only one eye, they must have a visual acuity of 20/30.
- id: 33
  category: driver_testing
  question: During the automated knowledge test, the test will automatically end if
    an applicant answers more than how many questions incorrectly?
  choices:
    A: 5 questions
    B: 6 questions
    C: 8 questions
    D: 10 questions
  answer: C
  explanation: The knowledge test consists of 40 multiple choice questions. If more
    than 8 questions are answered incorrectly, the test will automatically end.
- id: 34
  category: driver_testing
  question: Who is allowed to be present in the vehicle during the road test?
  choices:
    A: Only the applicant and the Licensing Examiner
    B: The applicant, the Examiner, and a parent or guardian
    C: The applicant, the Examiner, and a licensed driver over 25
    D: The applicant, the Examiner, and a driver education instructor
  answer: A
  explanation: The manual specifies that no person except the applicant and the authorized
    Division of Motor Vehicles Licensing Examiner may be present in the vehicle during
    the road test.
- id: 35
  category: driver_testing
  question: If an applicant fails the knowledge test or road test, how soon can they
    be provided an appointment to retest?
  choices:
    A: The next business day
    B: Not sooner than 5 days from the failed test
    C: Not sooner than 10 days from the failed test
    D: Not sooner than 14 days from the failed test
  answer: C
  explanation: If either the knowledge test or road test is not successfully completed,
    the applicant will be provided with an appointment to retest not sooner than ten
    days from the failed test.
- id: 36
  category: license_system
  question: Which class of license allows a driver to operate a vehicle with a gross
    vehicle weight of 26,000 pounds or less, provided they are not towing a trailer
    over 10,000 pounds, transporting hazardous materials, or driving a vehicle designed
    to seat 16 or more persons?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class D
  answer: D
  explanation: A Class D license allows a driver to drive a vehicle with a gross vehicle
    weight of 26,000 pounds or less if not towing a trailer of over 10,000 pounds,
    transport hazardous materials, or is designed to seat more than 16 or more persons,
    including the driver.
- id: 37
  category: license_system
  question: When does a New Hampshire Youth Operator license expire?
  choices:
    A: On the holder's 18th birthday
    B: On the holder's 21st birthday
    C: Five years from the date of issuance
    D: Upon graduating high school
  answer: B
  explanation: Youth Operator's licenses are printed vertically, and they expire on
    the holder's 21st birthday.
- id: 38
  category: license_system
  question: What does a 'B' restriction on a New Hampshire driver's license indicate?
  choices:
    A: Automatic Transmission
    B: Outside Mirror
    C: Corrective Lenses
    D: Daylight Only
  answer: C
  explanation: If the applicant is required to wear glasses or contact lenses to pass
    the vision test, the 'B' restriction for corrective lenses will be placed on the
    applicant's license.
- id: 39
  category: license_system
  question: Under the 'One License Concept,' what must new residents do when applying
    for a New Hampshire driver's license?
  choices:
    A: Surrender all valid driver licenses issued by any other jurisdiction
    B: Keep their out-of-state license as a secondary form of ID
    C: Pay a dual-licensing fee to maintain both licenses
    D: Take a mandatory 10-hour driving course
  answer: A
  explanation: State of New Hampshire law, RSA 263:4 requires that new residents to
    NH surrender all valid driver licenses issued by any other jurisdiction when applying
    for a New Hampshire driver's license.
- id: 40
  category: license_system
  question: Under what condition is a driver NOT required to have a specific moped
    license to operate a moped?
  choices:
    A: If they are over 21 years of age
    B: If they only drive the moped during daylight hours
    C: If they already possess a Class A, B, C, D, or motorcycle license
    D: If the moped has less than 2 brake horsepower
  answer: C
  explanation: Drivers do not need a moped license if they already possess a Class
    A, B, C, D or motorcycle license.
- id: 41
  category: driver_testing
  question: When arriving for a driver's license test, what is required regarding
    the licensed driver who brings the test vehicle?
  choices:
    A: They must sit in the back seat during the road test
    B: They must remain at the test site until the road test is completed
    C: They must be a certified driver education instructor
    D: They must leave the premises and return after 45 minutes
  answer: B
  explanation: A licensed driver is required to drive the test vehicle to and from
    the testing site. That person is required to remain at the test site until the
    road test has been completed.
- id: 42
  category: license_system
  question: 'New Hampshire law requires written permission from a parent, guardian,
    or responsible adult for a driver''s license applicant under age 18, UNLESS the
    applicant:'
  choices:
    A: Has completed 50 hours of supervised driving
    B: Is emancipated by marriage
    C: Owns their own vehicle
    D: Has held a license in another state
  answer: B
  explanation: No person under the age of 18 years shall be issued a driver's license
    unless a parent or guardian gives written permission, insurance coverage is presented,
    or the person under 18 is emancipated by marriage.
- id: 43
  category: driver_testing
  question: What will an applicant receive immediately upon passing the required driver's
    license tests?
  choices:
    A: A permanent plastic driver's license
    B: A 30-day digital license
    C: A 60-day paper temporary driver's license
    D: A Youth Operator permit
  answer: C
  explanation: Applicants will be issued a 60-day paper temporary driver's license
    upon passing. The permanent license will be mailed within 45-days.
- id: 44
  category: safe_driving_rules
  question: A Youth Operator under 18 years of age is prohibited from operating a
    motor vehicle between which hours?
  choices:
    A: 10:00 pm and 2:00 am
    B: 11:00 pm and 5:00 am
    C: 12:00 am and 6:00 am
    D: 1:00 am and 4:00 am
  answer: D
  explanation: The holder of a Youth Operator License who is under 18 years of age
    shall not operate a motor vehicle between the hours of 1:00 am and 4:00 am.
- id: 45
  category: safe_driving_rules
  question: Under what circumstance may a driver under 18 years of age use a cellular
    phone while driving?
  choices:
    A: When using a hands-free device
    B: When temporarily stopped in traffic
    C: To report an emergency to 911
    D: When talking to a parent or guardian
  answer: C
  explanation: Drivers under 18 shall not use a cellular device, whether hands-free
    or not, while driving or temporarily stopped, except to report an emergency to
    the enhanced 911 system or a public safety agency.
- id: 46
  category: license_system
  question: What is the minimum age required to obtain a Non-Driver Identification
    Card in New Hampshire?
  choices:
    A: 10 years old
    B: 12 years old
    C: 15 years old
    D: 16 years old
  answer: B
  explanation: Non-Driver Identification Cards may be issued to New Hampshire residents
    who do not hold a valid driver's license and who are at least 12 years of age.
- id: 47
  category: driver_testing
  question: If you move to New Hampshire and hold a valid out-of-state driver's license,
    which test(s) are you required to pass?
  choices:
    A: Only a vision test
    B: Vision and knowledge tests
    C: Knowledge and road tests
    D: Vision, knowledge, and road tests
  answer: A
  explanation: Only a vision test is required for drivers new to New Hampshire holding
    a valid out-of-state driver's license.
- id: 48
  category: driver_testing
  question: If an applicant's out-of-state driver's license has been expired for more
    than one year, what must they do to get a New Hampshire license?
  choices:
    A: Pass only a vision test
    B: Pass a vision and knowledge test
    C: Pass a vision, knowledge, and road test
    D: Pay a late fee and pass a road test
  answer: C
  explanation: If the out-of-state driver's license has been expired for more than
    one year, the applicant will be required to successfully pass the vision, knowledge,
    and road tests.
- id: 49
  category: license_system
  question: How often do New Hampshire driver's licenses expire?
  choices:
    A: Every 3 years on the driver's birthday
    B: Every 4 years on the driver's birthday
    C: Every 5 years on the driver's birthday
    D: Every 10 years on the driver's birthday
  answer: C
  explanation: NH Driver's licenses expire on the applicant's birthday every 5 years.
- id: 50
  category: license_system
  question: Which group is entitled to a New Hampshire driver's license renewal at
    no cost?
  choices:
    A: All residents over the age of 65
    B: Members of the armed forces who meet specific active duty and residency requirements
    C: Any resident who has not received a traffic ticket in 10 years
    D: State government employees
  answer: B
  explanation: Any person who is a member of the armed forces for two or more years,
    and was a NH resident and valid license holder at the time of induction/enlistment,
    is entitled to renewal at no cost.
- id: 51
  category: penalties_and_points
  question: Under the Youth Operator 'Under 20' Law, what is the suspension period
    for a first motor vehicle offense?
  choices:
    A: 10 to 20 days
    B: 20 to 40 days
    C: 45 to 90 days
    D: 90 to 180 days
  answer: B
  explanation: For a first offense under the Youth Operator 'Under 20' Law, the period
    of suspension or revocation is a minimum of 20 days, but not more than 40 days.
- id: 52
  category: penalties_and_points
  question: For a third or subsequent offense under the Youth Operator 'Under 20'
    Law, what is a required condition for license reinstatement?
  choices:
    A: Paying a $500 fine
    B: Retaking the road test
    C: Completing an approved in-person driver attitude program
    D: Performing 50 hours of community service
  answer: C
  explanation: For a third or subsequent offense, a condition of license reinstatement
    will also be to complete an approved in-person driver attitude program.
- id: 53
  category: alcohol_drugs_health
  question: In New Hampshire, a driver under 21 years old is considered legally intoxicated
    if their blood alcohol concentration (BAC) is at or above what level?
  choices:
    A: .02%
    B: .04%
    C: .08%
    D: .10%
  answer: A
  explanation: It is considered legally intoxicated if a driver's blood alcohol concentration
    is .08% or higher, or .02% or higher if the driver is under 21 years old.
- id: 54
  category: alcohol_drugs_health
  question: What does New Hampshire's 'Implied Consent' law mean?
  choices:
    A: You consent to a vehicle search if stopped for speeding
    B: You consent to having your blood, breath, or urine tested if arrested for an
      alcohol or drug offense
    C: You consent to paying all traffic fines within 30 days
    D: You consent to organ donation upon receiving a license
  answer: B
  explanation: Implied Consent means any person who operates a motor vehicle in NH
    is considered to have given consent to having their blood, breath, urine, or any
    combination tested if arrested for an alcohol or drug offense.
- id: 55
  category: penalties_and_points
  question: If the Director of Motor Vehicles deems a person to be a Habitual Offender,
    their driving privileges will be revoked for how long?
  choices:
    A: 6 months to 1 year
    B: 1 to 4 years
    C: 5 to 10 years
    D: Permanently
  answer: B
  explanation: If after a hearing a person is deemed to be a Habitual Offender, the
    Director shall revoke the person's driving privileges for 1 to 4 years.
- id: 56
  category: penalties_and_points
  question: What is the penalty for being convicted of driving after being declared
    a Habitual Offender?
  choices:
    A: A fine of up to $1,000
    B: Imprisonment for not less than one year and up to five years
    C: Mandatory community service for one year
    D: Permanent confiscation of the vehicle
  answer: B
  explanation: If a driver is convicted of driving after being declared a Habitual
    Offender, that person may be subject to imprisonment for not less than one year,
    and up to five (5) years.
- id: 57
  category: safe_driving_rules
  question: 'During the first six months of holding a license, a Youth Operator under
    18 may NOT drive with more than one passenger under age 25 who is not family,
    UNLESS:'
  choices:
    A: The passengers are wearing seatbelts
    B: They are driving to or from school
    C: Accompanied by a licensed, responsible adult who is at least 25 years of age
    D: They have written permission from a parent or guardian
  answer: C
  explanation: A Youth Operator under 18 cannot drive with more than one non-family
    passenger under 25 during the first six months unless accompanied by a licensed,
    responsible adult who is at least 25 years of age.
- id: 58
  category: safe_driving_rules
  question: If a driver is required to wear corrective lenses, what should they avoid
    doing at night?
  choices:
    A: Driving on unlit roads
    B: Using dark or tinted corrective lenses
    C: Looking directly at oncoming headlights
    D: Driving for more than two hours
  answer: B
  explanation: The manual states that if a driver is required to wear corrective lenses,
    they should avoid using dark or tinted corrective lenses at night.
- id: 59
  category: alcohol_drugs_health
  question: 'A driver who has been awake for a continuous 21 hours will typically
    exhibit performance levels similar to a person with a Blood Alcohol Concentration
    (BAC) of:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: According to the manual, after 21 hours without sleep, a driver's performance
    mimics a BAC of 0.08%.
- id: 60
  category: safe_driving_rules
  question: To avoid fatigue on long trips, how often should a driver plan to stop
    to stretch or get a beverage?
  choices:
    A: At least every 2 hours
    B: At least every 4 hours
    C: Only when they feel their eyes closing
    D: Every 100 miles
  answer: A
  explanation: The manual recommends planning to stop at least every 2 hours to stretch
    or get a cup of coffee or soft drink during long trips.
- id: 61
  category: safe_driving_rules
  question: Under New Hampshire law, what is the presumption if a driver holds a cellular
    telephone in the immediate proximity of their ear while the vehicle is in motion?
  choices:
    A: They are listening to music
    B: They are engaging in a call
    C: They are using a navigation system
    D: They are turning off the device
  answer: B
  explanation: An operator of a motor vehicle who holds a cellular telephone in the
    immediate proximity of his or her ear while the vehicle is in motion is presumed
    to be engaging in a call.
- id: 62
  category: safe_driving_rules
  question: For drivers under the age of 18, when is it legal to use a mobile electronic
    device while driving?
  choices:
    A: When using a hands-free Bluetooth device
    B: When stopped at a red light
    C: Only to report an emergency to 911 or a public safety agency
    D: When communicating with a parent or legal guardian
  answer: C
  explanation: Drivers under 18 shall not use a mobile device, whether hands-free
    or not, except to report an emergency to the enhanced 911 system or any public
    safety agency.
- id: 63
  category: safe_driving_rules
  question: Which of the following is a driver over the age of 18 permitted to do
    while driving?
  choices:
    A: Manually type an address into a GPS device
    B: Read a text message while temporarily halted in traffic
    C: Use one hand to transmit messages on a non-cellular 2-way radio
    D: Hold a phone to their ear to answer a quick call
  answer: C
  explanation: Drivers over the age of 18 may use one hand to transmit or receive
    messages on any non-cellular 2-way radio.
- id: 64
  category: defensive_driving
  question: Which of the following behaviors is typically associated with aggressive
    driving?
  choices:
    A: Yielding the right-of-way
    B: Following too closely
    C: Stopping at a yellow traffic signal
    D: Driving below the speed limit
  answer: B
  explanation: Behaviors typically associated with aggressive driving include speeding,
    following too closely, unsafe lane changes, improperly signaling, and failing
    to obey traffic control devices.
- id: 65
  category: alcohol_drugs_health
  question: At what Blood Alcohol Concentration (BAC) level is a driver's vision first
    impacted?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: A
  explanation: The manual states that vision is impacted at a .02 BAC for all drivers.
- id: 66
  category: alcohol_drugs_health
  question: Under what condition may a driver under the age of 21 transport liquor
    or alcoholic beverages in a vehicle?
  choices:
    A: If the beverages are in the trunk
    B: If they are accompanied by a parent, legal guardian, or legal age spouse
    C: If the containers are unopened and sealed
    D: Under no circumstances
  answer: B
  explanation: No driver under 21 shall transport any liquor or alcoholic beverage
    except when accompanied by a parent, legal guardian or legal age spouse.
- id: 67
  category: alcohol_drugs_health
  question: What is the only thing that will reduce the effects of alcohol after drinking?
  choices:
    A: Drinking black coffee
    B: Eating a heavy meal
    C: Taking a cold shower
    D: Time
  answer: D
  explanation: After drinking, there is nothing that will reduce the effects of alcohol
    except TIME. Coffee, food, fresh air, or cold showers will not counter the effects.
- id: 68
  category: alcohol_drugs_health
  question: Approximately how long does it take for one ounce of alcohol to go through
    the body?
  choices:
    A: 30 minutes
    B: One hour
    C: Two hours
    D: Four hours
  answer: B
  explanation: Each ounce of alcohol consumed takes about an hour to go through the
    body.
- id: 69
  category: penalties_and_points
  question: What is the minimum fine for a first offense of Driving Under the Influence
    of Drugs or Liquor?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $1,500
  answer: B
  explanation: A first offense conviction for Driving Under the Influence results
    in being guilty of a Class B misdemeanor and fined not less than $500.
- id: 70
  category: penalties_and_points
  question: For a first offense DUI conviction, a driver may face a loss of driving
    privileges for what period of time?
  choices:
    A: 30 to 90 days
    B: 3 to 6 months
    C: 9 months to 2 years
    D: 1 to 5 years
  answer: C
  explanation: A person convicted of a first offense DUI may face a loss of driving
    privileges for a period of 9 months to 2 years.
- id: 71
  category: alcohol_drugs_health
  question: How can over-the-counter drugs, such as those taken for colds or allergies,
    affect a person's ability to drive?
  choices:
    A: They improve reaction time
    B: They can make a driver drowsy
    C: They increase night vision
    D: They lower blood alcohol concentration
  answer: B
  explanation: Over-the-counter drugs taken for headaches, colds, hay fever or other
    allergies or those to calm nerves can make a driver drowsy and affect a person’s
    ability to drive.
- id: 72
  category: safe_driving_rules
  question: According to the manual, how many hours of sleep does the average person
    need to maintain proper alertness during the day?
  choices:
    A: 5 to 6 hours
    B: 6 to 8 hours
    C: 7 to 9 hours
    D: 8 to 10 hours
  answer: C
  explanation: The average person needs 7 to 9 hours of sleep to maintain proper alertness
    during the day.
- id: 73
  category: alcohol_drugs_health
  question: What should a driver do if they are unsure whether it is safe to take
    a prescription drug and drive?
  choices:
    A: Test drive in an empty parking lot to check their reflexes.
    B: Ask their doctor or pharmacist about any side effects.
    C: Only take half the prescribed dose before driving.
    D: Drink coffee to counteract any potential drowsiness.
  answer: B
  explanation: According to the manual, if a driver is unsure whether it is safe to
    take a drug and drive, they should ask their doctor or pharmacist about any side
    effects.
- id: 74
  category: alcohol_drugs_health
  question: What is a potential consequence of combining alcohol with other impairing
    drugs?
  choices:
    A: The drugs will neutralize the impairing effects of the alcohol.
    B: The driver's alertness will temporarily increase.
    C: It could multiply the effects of alcohol or have additional severe effects.
    D: The alcohol will process through the body at a faster rate.
  answer: C
  explanation: The manual warns that a driver should never drink alcohol while taking
    other drugs because they could multiply the effects of alcohol or have additional
    effects of their own, severely impacting the ability to drive safely.
- id: 75
  category: driver_responsibility
  question: Which of the following is a recommended way to deal with strong emotions
    before driving?
  choices:
    A: Listen to loud music to distract yourself from the emotion.
    B: Drive faster to reach your destination sooner and reduce stress.
    C: Take a short walk or nap prior to getting behind the wheel.
    D: Roll down the windows for fresh air while driving.
  answer: C
  explanation: The manual suggests taking time to calm down before getting behind
    the wheel, noting that taking a short walk or nap prior to driving may help.
- id: 76
  category: vehicle_information
  question: 'To help prevent the dangerous situation of leaving a child in a hot vehicle,
    the NHTSA recommends:'
  choices:
    A: Leaving the windows cracked open slightly when parking in the sun.
    B: Placing a personal item like a purse or briefcase in the back seat.
    C: Parking in a shaded area whenever running errands.
    D: Leaving the air conditioning running while you step away from the car.
  answer: B
  explanation: The NHTSA recommends placing a personal item like a purse or briefcase
    in the back seat as another reminder to look before you lock.
- id: 77
  category: vehicle_information
  question: How often is it recommended that drivers have their vehicle's tire pressure
    checked?
  choices:
    A: Once a week
    B: Once a month
    C: Every six months
    D: Once a year
  answer: B
  explanation: The manual states that it is recommended that drivers have the tire
    pressure checked once a month to prevent safety issues on the road.
- id: 78
  category: safe_driving_rules
  question: When adjusting the driver's seat, what is the proper distance that should
    be maintained between the driver's chest and the steering wheel?
  choices:
    A: 5 inches
    B: 10 inches
    C: 12 inches
    D: 15 inches
  answer: B
  explanation: Proper seat positioning includes ensuring there are 10 inches between
    the driver's chest and the steering wheel.
- id: 79
  category: safe_driving_rules
  question: How should a vehicle's head restraints (head rests) be properly adjusted?
  choices:
    A: So they come in contact with the back of the driver's head, but not below the
      ears.
    B: So they rest comfortably against the base of the driver's neck.
    C: So they are positioned at least two inches above the top of the driver's head.
    D: So they support the upper portion of the driver's shoulders.
  answer: A
  explanation: Head rests should be adjusted so they come in contact with the back
    of the driver's head, but not below the ears, to prevent whiplash in the event
    of an accident.
- id: 80
  category: defensive_driving
  question: 'Even with properly adjusted mirrors, a driver must still:'
  choices:
    A: Rely solely on the rearview mirror when backing up.
    B: Incorporate proper head checks whenever possible.
    C: Install aftermarket blind spot mirrors on both sides.
    D: Keep the day/night mirror set to the night setting at all times.
  answer: B
  explanation: The manual notes that even properly adjusted mirrors will not eliminate
    all blind spots, so proper head checks should be incorporated whenever possible.
- id: 81
  category: safe_driving_rules
  question: 'In New Hampshire, safety restraints are required by law for anyone under
    the age of:'
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: In New Hampshire, safety restraints are required for anyone under the
    age of 18, though it is highly recommended for all ages.
- id: 82
  category: safe_driving_rules
  question: How should the lap belt portion of a safety belt be worn?
  choices:
    A: Loosely across the stomach
    B: Snug and high across the waist
    C: Snug and low across the hips
    D: Tucked under the driver's legs
  answer: C
  explanation: The lap belt should be adjusted so that it is snug and lies low across
    the driver's hips after fastening to prevent sliding out during a collision.
- id: 83
  category: safe_driving_rules
  question: 'Under New Hampshire law, a child must be secured in a child passenger
    restraint if they are:'
  choices:
    A: Less than 7 years old and less than 57 inches in height.
    B: Less than 8 years old and less than 60 inches in height.
    C: Less than 6 years old and less than 50 inches in height.
    D: Less than 5 years old regardless of height.
  answer: A
  explanation: A child less than 7 years old and less than 57 inches in height must
    be properly fastened and secured in a child passenger restraint.
- id: 84
  category: safe_driving_rules
  question: New Hampshire law requires motorcycle helmets approved by the US DOT for
    all riders and passengers under what age?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: There is no age requirement for helmets in New Hampshire.
  answer: B
  explanation: New Hampshire law requires all riders and passengers under the age
    of 18 to wear helmets approved by the United States Department of Transportation.
- id: 85
  category: vehicle_information
  question: Why is it extremely important to wear safety belts even in vehicles equipped
    with air bags?
  choices:
    A: Air bags will not deploy if the safety belt is unbuckled.
    B: Safety belts help properly position a person's body to maximize the air bag's
      benefits.
    C: Air bags only protect the lower half of the body during a collision.
    D: Safety belts prevent the air bags from deploying too quickly.
  answer: B
  explanation: Safety belts help to properly position a person's body to maximize
    the air bag's benefits and help restrain a person during the initial and any following
    collisions.
- id: 86
  category: driver_responsibility
  question: When is a load considered securely fastened on a vehicle?
  choices:
    A: When it is tied down with at least two bungee cords.
    B: When the driver can see the load clearly in the rearview mirror.
    C: When nothing can slide, shift, fall, sift onto the roadway, or become airborne.
    D: When the load weighs less than 500 pounds.
  answer: C
  explanation: A load must be securely fastened and is only considered secure when
    nothing can slide, shift, fall or sift onto the roadway, or become airborne.
- id: 87
  category: penalties_and_points
  question: Under Jessica's Law, what is the penalty for a first offense of failing
    to clear snow and ice from a vehicle, resulting in negligent driving?
  choices:
    A: $50.00 to $100.00
    B: $100.00 to $250.00
    C: $250.00 to $500.00
    D: $500.00 to $1,000.00
  answer: C
  explanation: Pursuant to RSA 265:79-b, if a vehicle endangers person or property
    due to uncleared snow and ice, penalties for this offense can be $250.00 to $500.00
    for the first offense.
- id: 88
  category: penalties_and_points
  question: What is the potential fine for a first offense of Negligent Driving in
    New Hampshire?
  choices:
    A: $100.00 to $250.00
    B: $250.00 to $500.00
    C: $500.00 to $1,000.00
    D: $1,000.00 to $2,000.00
  answer: B
  explanation: According to the manual, penalties for a first offense of Negligent
    Driving can be $250.00 to $500.00.
- id: 89
  category: safe_driving_rules
  question: What are the recommended hand positions on the steering wheel?
  choices:
    A: 10 o'clock and 2 o'clock, or 9 o'clock and 3 o'clock
    B: 11 o'clock and 1 o'clock, or 8 o'clock and 4 o'clock
    C: 9 o'clock and 3 o'clock, or 8 o'clock and 4 o'clock
    D: 10 o'clock and 2 o'clock, or 7 o'clock and 5 o'clock
  answer: C
  explanation: The manual states that drivers' hands should be in the 9 o'clock and
    3 o'clock, or the 8 o'clock and 4 o'clock positions.
- id: 90
  category: safe_driving_rules
  question: When two vehicles approach an uncontrolled intersection at the same time,
    who must yield the right-of-way?
  choices:
    A: The vehicle on the right must yield to the vehicle on the left.
    B: The vehicle on the left must yield to the vehicle on the right.
    C: The larger vehicle always has the right-of-way.
    D: The vehicle traveling at a faster speed has the right-of-way.
  answer: B
  explanation: NH law states that the driver of a vehicle approaching or entering
    an intersection on the left shall yield the right of way to the vehicle on the
    right.
- id: 91
  category: sharing_the_road
  question: What must a driver do when approached by an emergency vehicle sounding
    a siren or operating flashing lights?
  choices:
    A: Stop immediately wherever the vehicle is located, even in an intersection.
    B: Speed up to clear the road for the emergency vehicle.
    C: Drive immediately to the right side of the road and stop until the emergency
      vehicle has passed.
    D: Pull to the left side of the road and slow down.
  answer: C
  explanation: Drivers should drive immediately to the right side of the road and
    stop the vehicle until the emergency has passed, avoiding blocking an intersection.
- id: 92
  category: safe_driving_rules
  question: What is the maximum speed limit in any business or urban residence district
    in New Hampshire?
  choices:
    A: 25 miles per hour
    B: 30 miles per hour
    C: 35 miles per hour
    D: 45 miles per hour
  answer: B
  explanation: The maximum speed limit is 30 miles per hour in any business or urban
    residence district.
- id: 93
  category: safe_driving_rules
  question: Unless road and weather conditions make it unsafe, what is the minimum
    speed you may drive on an interstate highway?
  choices:
    A: 40 mph
    B: 45 mph
    C: 50 mph
    D: 55 mph
  answer: B
  explanation: The minimum speed you may drive on an interstate highway is 45 mph,
    unless road and weather conditions are so bad that this speed is unsafe.
- id: 94
  category: safe_driving_rules
  question: What is the speed limit in a posted school zone during the specified school
    hours?
  choices:
    A: 15 mph
    B: 20 mph
    C: 10 mph below the usual posted speed limit
    D: 15 mph below the usual posted speed limit
  answer: C
  explanation: In a Posted School Zone, the speed limit is 10 miles per hour (mph)
    below the usual posted speed limit from 45 minutes before school opening until
    opening, and from closing until 45 minutes after closing.
- id: 95
  category: safe_driving_rules
  question: How far in advance should a driver signal before changing lanes or exiting
    a highway?
  choices:
    A: At least 100 feet
    B: At least 200 feet
    C: At least 300 feet
    D: At least 500 feet
  answer: D
  explanation: On the highway, drivers should signal at least 500 feet before changing
    lanes or exiting the roadway.
- id: 96
  category: safe_driving_rules
  question: By law, during what time period must every motor vehicle display lighted
    lamps (headlights)?
  choices:
    A: From sunset to sunrise
    B: From 1/2 hour after sunset to 1/2 hour before sunrise
    C: From 1 hour after sunset to 1 hour before sunrise
    D: Only when it is completely dark outside
  answer: B
  explanation: New Hampshire law requires every motor vehicle driven during the period
    from 1/2 hour after sunset to 1/2 hour before sunrise to display lighted lamps.
- id: 97
  category: safe_driving_rules
  question: 'Headlights must be turned on when rain, snow, or fog prevents you from
    clearly seeing persons and vehicles at a distance of:'
  choices:
    A: 500 feet ahead
    B: 1000 feet ahead
    C: 1500 feet ahead
    D: 2000 feet ahead
  answer: B
  explanation: Headlights are required whenever rain, snow, or fog interferes with
    the proper view of the road so that persons and vehicles are not clearly discernible
    at a distance of 1000 feet ahead.
- id: 98
  category: sharing_the_road
  question: In which of the following situations should a driver AVOID using their
    vehicle's horn?
  choices:
    A: When a bicyclist begins to move into the driver's lane
    B: When another driver crosses the center line into the driver's lane
    C: When near blind pedestrians or when approaching a horse
    D: When a driver backing up is unaware a vehicle is approaching
  answer: C
  explanation: Drivers should not use the horn when near blind pedestrians or when
    approaching or near a horse as this may frighten the horse and cause a crash.
- id: 99
  category: defensive_driving
  question: How does doubling the speed of a vehicle affect its stopping distance?
  choices:
    A: The stopping distance doubles.
    B: The stopping distance triples.
    C: The stopping distance increases 4 times.
    D: The stopping distance remains the same.
  answer: C
  explanation: The manual states that the stopping distance of a vehicle increases
    4 times when the speed of the vehicle is doubled.
- id: 100
  category: defensive_driving
  question: What is the average perception time for an alert driver to recognize they
    must stop?
  choices:
    A: 1/4 to 1/2 second
    B: 1/2 to 3/4 second
    C: 3/4 second to 1 second
    D: 1 to 2 seconds
  answer: C
  explanation: The average perception time for an alert driver is 3/4 second to 1
    second.
- id: 101
  category: defensive_driving
  question: 'To avoid tailgating, drivers should maintain a minimum following distance
    of at least:'
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Five seconds
  answer: C
  explanation: For safety reasons, drivers should avoid travelling closer to a vehicle
    with less than a four-second following distance.
- id: 102
  category: sharing_the_road
  question: How should a driver interact with a funeral procession?
  choices:
    A: Pass the vehicles individually as quickly as possible.
    B: Honk the horn to let the procession know they are passing.
    C: Yield only to the hearse and then proceed through the procession.
    D: Allow vehicles that have their headlights on while following a hearse to pass
      as a group.
  answer: D
  explanation: Drivers should allow vehicles that have their headlights on while following
    a hearse to pass as a group.
- id: 103
  category: safe_driving_rules
  question: When passing another vehicle, when is it safe to return to your lane?
  choices:
    A: As soon as you are ahead of the vehicle's front bumper
    B: When you can see the complete front of the passed vehicle in your rearview
      mirror
    C: When you are one car length ahead of the passed vehicle
    D: When the driver of the passed vehicle flashes their headlights
  answer: B
  explanation: The manual states that when passing, you should continue to pass until
    the complete front of the passed vehicle is visible in the rearview mirror before
    signaling and returning to the lane.
- id: 104
  category: sharing_the_road
  question: What is the proper procedure when another vehicle is passing you?
  choices:
    A: Increase your speed to get out of their way
    B: Move onto the shoulder to give them more room
    C: Maintain a constant speed and stay in your lane
    D: Brake hard to let them pass quickly
  answer: C
  explanation: When being passed, drivers should stay in the lane they are travelling,
    maintain a constant speed to allow the driver to pass, and never increase speed
    to prevent someone from passing.
- id: 105
  category: vehicle_information
  question: According to the manual, how should back-up cameras be used when reversing?
  choices:
    A: As the primary tool for backing safely
    B: In conjunction with mirrors and proper head checks
    C: Only when backing up at night
    D: Instead of looking over your shoulder
  answer: B
  explanation: The manual notes that back-up cameras can help drivers back up safely
    when used in conjunction with mirrors and proper head checks, but should never
    be used as the primary tool for backing safely.
- id: 106
  category: safe_driving_rules
  question: When navigating a curve in the road, when should you reduce your speed?
  choices:
    A: Prior to entering the curve
    B: While in the middle of the curve
    C: Only if you start to lose traction
    D: Just as you are exiting the curve
  answer: A
  explanation: Drivers should always reduce speed prior to entering the curve to a
    safe speed. Hard braking after entry to a curve could cause the vehicle tires
    to lose traction.
- id: 107
  category: defensive_driving
  question: What is the best way to avoid traction loss from hydroplaning?
  choices:
    A: Steer sharply from side to side
    B: Apply the brakes firmly and quickly
    C: Accelerate to push through the water
    D: Slow down in the rain or when the road is wet
  answer: D
  explanation: The best way to avoid traction loss from hydroplaning is to slow down
    in the rain or when the road is wet with pooled water or water puddles.
- id: 108
  category: safe_driving_rules
  question: Who generally has the right-of-way at a narrow or single lane bridge?
  choices:
    A: The larger vehicle
    B: The vehicle traveling at a higher speed
    C: The first driver to arrive at the bridge
    D: The vehicle traveling uphill
  answer: C
  explanation: When approaching narrow and single lane bridges, drivers should take
    turns crossing; generally, the first driver to the bridge has the right-of-way.
- id: 109
  category: defensive_driving
  question: How should a driver handle driving over open bridge gratings or steel
    bridges?
  choices:
    A: Increase speed to cross as quickly as possible
    B: Reduce speed, increase following distance, and maintain a firm grip on the
      steering wheel
    C: Swerve gently to maintain tire traction
    D: Apply the brakes continuously while crossing
  answer: B
  explanation: Open bridge gratings or steel bridges can reduce traction. Drivers
    should reduce speed, increase the following distance, and maintain a firm grip
    on the steering wheel.
- id: 110
  category: defensive_driving
  question: What should you do if an oncoming vehicle is traveling with their high
    beams on?
  choices:
    A: Flash your high beams continuously until they dim theirs
    B: Look directly at their headlights to judge their distance
    C: Look toward the right side of the road
    D: Close one eye to preserve your night vision
  answer: C
  explanation: If a vehicle coming from the opposite direction is travelling with
    their high beams on, look toward the right side of the road (such as the fog line
    or edge of the roadway) to keep from being distracted or momentarily blinded.
- id: 111
  category: safe_driving_rules
  question: Which headlights should you use when driving in fog, rain, or snow?
  choices:
    A: High beams to cut through the weather
    B: Low beams, because high beams may cause glare
    C: Parking lights only
    D: Hazard lights combined with high beams
  answer: B
  explanation: In fog, rain, or snow, use the low beams. Light from the high beams
    may cause glare and make it more difficult to see ahead.
- id: 112
  category: defensive_driving
  question: How much should you increase your following distance when driving on unfamiliar
    roadways at night?
  choices:
    A: By at least one additional second
    B: By at least two additional seconds
    C: By at least three additional seconds
    D: By at least four additional seconds
  answer: B
  explanation: Drivers should increase their following distance by adding at least
    one additional second for night driving conditions and at least two additional
    seconds for driving on unfamiliar roadways at night.
- id: 113
  category: vehicle_information
  question: What does it mean that most vehicle warning systems are "passive"?
  choices:
    A: They automatically apply the brakes to prevent a collision
    B: They take control of the steering wheel during an emergency
    C: They warn the driver of a potential issue but do not automatically prevent
      a problem
    D: They only work when the vehicle is traveling under 30 mph
  answer: C
  explanation: Most of these technologies are passive, meaning they warn the driver
    of a potential issue, but do not automatically prevent a problem or collision.
    The driver may need to make changes to the operation of the vehicle.
- id: 114
  category: safe_driving_rules
  question: In which of the following situations is passing another vehicle prohibited?
  choices:
    A: On a multi-lane highway
    B: When the vehicle ahead is traveling below the speed limit
    C: Before a highway-railroad crossing or bridge
    D: When you have a clear view of the road ahead
  answer: C
  explanation: Do not attempt to pass when an oncoming vehicle is approaching, when
    the view is blocked by a curve or a hill, at intersections, or before a highway-railroad
    crossing or bridge.
- id: 115
  category: defensive_driving
  question: How should you approach an uncontrolled intersection on a rural road?
  choices:
    A: Maintain your speed since you have the right-of-way
    B: Accelerate to clear the intersection quickly
    C: Sound your horn and proceed without stopping
    D: Slow down and be prepared to stop for crossing or oncoming traffic
  answer: D
  explanation: When approaching an uncontrolled rural intersection, slow down and
    be prepared to stop for crossing or oncoming traffic, as these intersections can
    be very dangerous.
- id: 116
  category: safe_driving_rules
  question: What headlights should you use when following another vehicle at night?
  choices:
    A: High beams
    B: Low beams
    C: Fog lights only
    D: Daytime running lights
  answer: B
  explanation: The manual explicitly states to use the low beams when following another
    vehicle at night.
- id: 117
  category: vehicle_information
  question: What is a limitation of a forward collision warning system?
  choices:
    A: It will not automatically brake for the driver
    B: It only works when the vehicle is in reverse
    C: It cannot detect stationary objects
    D: It replaces the need to look out the windshield
  answer: A
  explanation: A forward collision warning system alerts drivers of an impending collision,
    but the warning alone will not automatically brake for the driver.
- id: 118
  category: safe_driving_rules
  question: If you approach an intersection with a red traffic light, but a police
    officer is directing you to proceed, what should you do?
  choices:
    A: Stop and wait for the light to turn green.
    B: Treat the intersection as a four-way stop.
    C: Obey the police officer and proceed.
    D: Yield to the traffic light first, then follow the officer's directions.
  answer: C
  explanation: 'The manual states: ''A police officer directing traffic overrules
    any traffic light or sign and must be obeyed.'''
- id: 119
  category: signs_and_signals
  question: Under what condition is a driver permitted to make a right turn on a solid
    red traffic light?
  choices:
    A: Only when a green arrow is also illuminated.
    B: Anytime, without coming to a complete stop first.
    C: Only if there is no sign prohibiting a right turn on red.
    D: Right turns on red are never permitted.
  answer: C
  explanation: 'The manual notes an exception for solid red lights: ''Drivers may
    make a right turn on a red signal ONLY IF there is no sign prohibiting a right
    turn on red.'''
- id: 120
  category: signs_and_signals
  question: What action must a driver take when approaching a flashing red traffic
    light?
  choices:
    A: Slow down and proceed with caution.
    B: Come to a complete stop before proceeding and yield any right-of-way.
    C: Stop only if there are pedestrians in the crosswalk.
    D: Treat the light as a yield sign and proceed without stopping if clear.
  answer: B
  explanation: 'For a flashing red traffic light, the manual states: ''Drivers must
    come to a complete stop behind a stop line, crosswalk, or intersection before
    proceeding though the intersection, yielding any right-of-way.'''
- id: 121
  category: signs_and_signals
  question: What type of information is indicated by a brown traffic sign?
  choices:
    A: Driver services
    B: General warning
    C: Tourist and recreation guidance
    D: Incident management
  answer: C
  explanation: According to the standard colors section of the manual, brown signs
    are used for 'Tourist and recreation guidance'.
- id: 122
  category: signs_and_signals
  question: What does a pennant-shaped (sideways triangle) sign warn a driver about?
  choices:
    A: A school zone and school crossing
    B: No passing zones ahead
    C: An upcoming yield sign
    D: Advance warning of a railroad crossing
  answer: B
  explanation: The manual states that a pennant (sideways triangle) sign is found
    on the left side of the road and 'gives the driver warning of no passing zones
    ahead.'
- id: 123
  category: signs_and_signals
  question: Which sign color is specifically used for incident management?
  choices:
    A: Orange
    B: Purple
    C: Pink
    D: Blue
  answer: C
  explanation: The manual's list of standard colors specifies that Pink is used for
    'Incident management'.
- id: 124
  category: signs_and_signals
  question: 'A pentagon-shaped (5 sides) road sign is used to indicate:'
  choices:
    A: A stop sign
    B: A railroad crossing
    C: A school zone and school crossing
    D: Traffic regulations or directions
  answer: C
  explanation: According to the standard shapes section, a pentagon (5 sides) indicates
    a 'School zone and school crossing'.
- id: 125
  category: safe_driving_rules
  question: When a train is approaching a railroad crossing, where must a driver stop
    their vehicle?
  choices:
    A: Not less than 10 feet, nor more than 30 feet from the nearest rail.
    B: Not less than 15 feet, nor more than 50 feet from the nearest rail.
    C: Exactly 25 feet from the nearest rail.
    D: Not less than 5 feet, nor more than 20 feet from the nearest rail.
  answer: B
  explanation: 'The manual states: ''When a train or railroad vehicle is approaching
    the intersection, a driver must stop behind the stop line or not less than 15
    feet, nor more than 50 feet from the nearest rail of the track.'''
- id: 126
  category: sharing_the_road
  question: Which of the following vehicles are required by law to stop before ANY
    railroad crossing, even if there is no sign of a train coming?
  choices:
    A: Passenger cars and motorcycles
    B: Tow trucks and emergency vehicles
    C: Buses that carry passengers and trucks carrying flammable or hazardous material
    D: Any vehicle towing a trailer or boat
  answer: C
  explanation: 'The manual specifies: ''The law requires buses that carry passengers
    and trucks carrying flammable or hazardous material to stop before any railroad
    crossing, even if there is no sign of a train coming.'''
- id: 127
  category: signs_and_signals
  question: What does a three-numbered interstate route with an even first number
    indicate?
  choices:
    A: The route goes into a city.
    B: The route goes through or around a city.
    C: The route is a north/south route.
    D: The route is a state route, not an interstate.
  answer: B
  explanation: According to the route number signs section, 'Three numbered routes
    with an even first number go through or around a city.'
- id: 128
  category: signs_and_signals
  question: What do black and white speed limit signs indicate?
  choices:
    A: The minimum speed allowed on the roadway.
    B: The recommended speed during inclement weather.
    C: The maximum legal speed allowed in ideal conditions.
    D: The speed limit for commercial vehicles only.
  answer: C
  explanation: The manual states that Speed Limit Signs are black and white signs
    that 'indicate the maximum legal speed allowed in ideal conditions.'
- id: 129
  category: signs_and_signals
  question: What is the proper use of a shared center lane?
  choices:
    A: It is reserved for passing slower vehicles.
    B: It is used for through traffic during rush hour.
    C: It is reserved for left turning vehicles from either direction.
    D: It is a designated lane for emergency vehicles only.
  answer: C
  explanation: The manual explains that a Shared Center Lane Left Turn Only sign 'tells
    a driver where a lane is reserved for the use of left turning vehicles from either
    direction and is not to be used for through traffic or passing other vehicles.'
- id: 130
  category: safe_driving_rules
  question: Once an intersection is clear at a railroad crossing, how should a driver
    proceed across the tracks?
  choices:
    A: Look both ways and cross the tracks quickly, without stopping.
    B: Stop halfway across to check for trains again.
    C: Shift gears while crossing the tracks to maintain speed.
    D: Cross slowly to avoid damaging the vehicle's suspension.
  answer: A
  explanation: 'The manual instructs: ''When the intersection is clear, drivers should
    look both ways and cross the tracks quickly, without stopping.'''
- id: 131
  category: signs_and_signals
  question: What are the typical shape and color characteristics of work zone signs?
  choices:
    A: Round shape, yellow with black letters.
    B: Diamond or rectangular shaped, orange with black letters or symbols.
    C: Octagon shape, red with white letters.
    D: Square shape, blue with white symbols.
  answer: B
  explanation: The manual states that work zone signs 'are generally diamond or rectangular
    shaped and orange with black letters or symbols.'
- id: 132
  category: penalties_and_points
  question: What can happen to traffic fines in a work zone?
  choices:
    A: They are waived if no workers are present.
    B: They are reduced by half.
    C: They may be doubled if clearly marked.
    D: They remain the same as normal roads.
  answer: C
  explanation: According to the manual, fines may be doubled in a work zone; however,
    this will be clearly marked before entering the work zone.
- id: 133
  category: signs_and_signals
  question: What do single, broken (dotted) white lines on the roadway indicate?
  choices:
    A: Traffic is moving in opposite directions.
    B: Lanes of traffic are moving in the same direction and passing is allowed.
    C: The lane is a shared center turn lane.
    D: Passing is strictly prohibited.
  answer: B
  explanation: White lines mean lanes of traffic are moving in the same direction,
    and drivers may pass other vehicles over broken (dotted) lines when it is safe
    to do so.
- id: 134
  category: signs_and_signals
  question: What color is the edge marking line on the left edge of a one-way road?
  choices:
    A: White
    B: Red
    C: Yellow
    D: Green
  answer: C
  explanation: The manual states that the edge marking line is yellow on the left
    edges of one-way roads.
- id: 135
  category: safe_driving_rules
  question: Where must a driver stop at an intersection if there is no white stop
    line but a crosswalk is present?
  choices:
    A: Prior to entering the intersection
    B: In the middle of the crosswalk
    C: Before the crosswalk
    D: After the crosswalk
  answer: C
  explanation: If there is no white stop line but only a crosswalk present, then drivers
    must stop before the crosswalk.
- id: 136
  category: sharing_the_road
  question: When are drivers required to yield to pedestrians crossing the road?
  choices:
    A: Only when a crossing guard is present
    B: Only in marked crosswalks
    C: In marked crosswalks or at intersections even if no crosswalk lines exist
    D: Only if the pedestrian has a walk signal
  answer: C
  explanation: Drivers are required to yield to pedestrians crossing the road in marked
    crosswalks or at intersections even if no crosswalk lines exist at the intersection.
- id: 137
  category: safe_driving_rules
  question: What is a shared center turn lane reserved for?
  choices:
    A: Passing slower vehicles
    B: Left turning vehicles from either direction
    C: Through traffic
    D: Emergency vehicles only
  answer: B
  explanation: Shared center lanes are for left turns only. This lane is reserved
    for the use of left turning vehicles from either direction and is not to be used
    for through traffic or passing.
- id: 138
  category: safe_driving_rules
  question: What is an important safety rule for drivers using E-ZPass Toll Lanes?
  choices:
    A: Come to a complete stop before proceeding
    B: Obey posted speed limits, but do not come to a stop
    C: Back up if the transponder does not read
    D: Get out of the vehicle to check the transponder
  answer: B
  explanation: Important safety information for E-ZPass Toll Lanes states drivers
    should obey posted speed limits in the toll lanes, but do not come to a stop.
- id: 139
  category: safe_driving_rules
  question: 'When making a right turn, a driver should:'
  choices:
    A: Swing wide to the left before making the turn
    B: Turn from the left-most portion of the lane
    C: Avoid swinging wide to the left before making the turn
    D: Accelerate rapidly through the intersection
  answer: C
  explanation: Before making a right turn, drivers should avoid swinging wide to the
    left before making the turn and always turn right from the right-most portion
    of the lane.
- id: 140
  category: safe_driving_rules
  question: What should a driver do if they miss an exit on a divided highway?
  choices:
    A: Stop and back up on the shoulder
    B: Make a U-turn through the median
    C: Put on hazard lights and reverse in the right lane
    D: Drive to the next exit to reverse direction
  answer: D
  explanation: If a driver misses an exit on a divided highway, they should drive
    to the next exit to reverse direction. Drivers should never stop, back up or try
    to turn around.
- id: 141
  category: safe_driving_rules
  question: When is it appropriate to use a three-point turn?
  choices:
    A: On a divided highway when you miss an exit
    B: Only when the road or street is too narrow to make a U-turn on a two-lane roadway
    C: In a shared center turn lane
    D: At a busy four-way intersection
  answer: B
  explanation: Drivers should use a three-point turn only when the road or street
    is too narrow to make a U-turn. This type of turn should only be used on a two-lane
    roadway.
- id: 142
  category: defensive_driving
  question: Before moving after stopping at an intersection, in which direction is
    it recommended that drivers look?
  choices:
    A: Right, then left
    B: Left, then right and left again
    C: Straight ahead only
    D: Left only
  answer: B
  explanation: It is recommended that drivers look left, then right and left again
    before entering the intersection.
- id: 143
  category: defensive_driving
  question: Why should a driver NOT turn into a lane in front of another vehicle just
    because that vehicle has an active turn signal?
  choices:
    A: The turn signal might be broken and flashing rapidly
    B: The driver may plan to turn after passing the intersection or forgot to turn
      the signal off
    C: The vehicle might be an unmarked police car
    D: Turn signals do not apply at intersections
  answer: B
  explanation: The driver with an active turn signal may plan to turn after they go
    past the intersection a driver is at or may have forgotten to turn the signal
    off from a prior turn.
- id: 144
  category: signs_and_signals
  question: What does a solid white line between lanes of traffic indicate?
  choices:
    A: Drivers may pass if it is safe to do so
    B: Drivers are prohibited from changing lanes or passing another vehicle
    C: The lane is reserved for left turns only
    D: Traffic is moving in opposite directions
  answer: B
  explanation: 'Solid White Lines: Drivers are prohibited from changing lanes or to
    pass another vehicle.'
- id: 145
  category: safe_driving_rules
  question: Which of the following is a safety rule for Cash Only Toll Lanes?
  choices:
    A: Do not come to a complete stop
    B: Never back up or reverse direction at a toll plaza
    C: Exit your vehicle to hand the toll to the attendant
    D: Speed limits do not apply within the toll plaza
  answer: B
  explanation: Important safety information for Cash Only Toll Lanes states drivers
    should never back up or reverse direction at a toll plaza, come to a complete
    stop, and do not get out of the vehicle.
- id: 146
  category: vehicle_information
  question: When executing a reverse two-point turn using a driveway, which direction
    should the driver steer while backing slowly?
  choices:
    A: Rapidly all the way to the left
    B: Rapidly all the way to the right
    C: Keep the steering wheel perfectly straight
    D: Steer left, then right
  answer: B
  explanation: During a reverse two-point turn, while backing slowly, the driver should
    steer rapidly all the way to the right.
- id: 147
  category: safe_driving_rules
  question: What should you do if you are inside a roundabout and an emergency vehicle
    approaches?
  choices:
    A: Stop immediately inside the roundabout to let them pass.
    B: Move through and exit the roundabout, then pull over to the right.
    C: Pull over to the left side of the roundabout.
    D: Speed up and continue circling until the emergency vehicle passes.
  answer: B
  explanation: 'The manual states: ''Never stop while inside the roundabout. Instead,
    move through and exit the roundabout, pull over to the right and allow emergency
    vehicles to pass.'''
- id: 148
  category: sharing_the_road
  question: Why should you avoid passing large trucks and trailers within a multi-lane
    roundabout?
  choices:
    A: They are required to yield to all passing vehicles.
    B: They may need to straddle both lanes to navigate the roundabout.
    C: They are not allowed to use multi-lane roundabouts.
    D: They travel at much higher speeds than passenger vehicles.
  answer: B
  explanation: According to the manual, you should not attempt to overtake or pass
    vehicles in a roundabout because 'Large trucks and trailers within the roundabout
    may need to straddle both lanes.'
- id: 149
  category: safe_driving_rules
  question: How far away must a driver stop for a school bus with its red lights flashing
    and/or stop arm extended?
  choices:
    A: At least 10 feet in any direction
    B: At least 15 feet in any direction
    C: At least 25 feet in any direction
    D: At least 50 feet in any direction
  answer: C
  explanation: The manual requires that 'Drivers must stop at least 25-feet in any
    direction for a school bus that is stopped with its red lights flashing and/or
    the stop arm extended at all times...'
- id: 150
  category: safe_driving_rules
  question: Under what condition is a driver NOT required to stop for a school bus
    with flashing red lights?
  choices:
    A: When the bus is on the opposite side of a two-lane road.
    B: When the roadway is separated by a physical barrier.
    C: When the driver is traveling in the same direction as the bus.
    D: When the bus is stopped at an intersection.
  answer: B
  explanation: Drivers must stop for a school bus with flashing red lights 'unless
    the roadway is separated by a physical barrier.'
- id: 151
  category: safe_driving_rules
  question: If you must park along a rural highway and cannot pull completely off
    the road, what is the minimum clear view distance required in each direction?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: If it is impossible to pull completely off the road, drivers should
    pull off as much as they can 'as long as there is a clear view for a distance
    of 200 feet in each direction and if there is enough space for other vehicles
    to pass.'
- id: 152
  category: driver_responsibility
  question: When leaving a vehicle unattended, what does the law require drivers to
    do to secure the vehicle?
  choices:
    A: Leave the engine running if returning within 5 minutes.
    B: Turn off the engine and remove the key.
    C: Leave the keys in the ignition for emergency responders.
    D: Turn on the hazard lights and leave the doors unlocked.
  answer: B
  explanation: 'The manual states: ''The law requires drivers to turn off the engine
    and remove the key when leaving a vehicle unattended.'''
- id: 153
  category: safe_driving_rules
  question: How should you secure your vehicle when parked on a hill?
  choices:
    A: Leave the vehicle in neutral and apply the parking brake.
    B: Set the parking brake and turn the wheels away from the curb.
    C: Set the parking brake and turn the wheels into the curb.
    D: Turn the wheels straight and rely only on the transmission.
  answer: C
  explanation: To make sure the vehicle cannot move, drivers should 'Set the parking
    brake and turn the wheels into the curb if the vehicle is parked on a hill.'
- id: 154
  category: driver_responsibility
  question: What is the purpose of the crosshatched access aisle adjacent to an accessible
    parking space?
  choices:
    A: To provide a designated area for shopping carts.
    B: To allow extra space for motorcycles to park.
    C: To provide space for individuals with walking disabilities to safely maneuver
      and use lifts/ramps.
    D: To serve as a pedestrian walkway for all store customers.
  answer: C
  explanation: The access aisle is 'the space needed by individuals with walking disabilities
    to be able to fully open the door to their vehicle and safely maneuver in and
    out of their vehicle' and to use a lift or ramp.
- id: 155
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: Although not marked, it is illegal to park 'Within 15 feet of a fire
    hydrant.'
- id: 156
  category: signs_and_signals
  question: You must not park your vehicle within how many feet of a stop sign, yield
    sign, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: It is illegal to park 'Within 30 feet of a stop sign, yield sign or
    traffic control signal.'
- id: 157
  category: safe_driving_rules
  question: What is the minimum parking distance required from the nearest rail of
    a railroad crossing?
  choices:
    A: 20 feet
    B: 30 feet
    C: 50 feet
    D: 75 feet
  answer: C
  explanation: It is illegal to park 'Within 50 feet of the nearest rail of a railroad
    crossing.'
- id: 158
  category: defensive_driving
  question: Why should you avoid turning into a lane in front of an approaching vehicle
    that has its turn signal active?
  choices:
    A: The driver may be planning to turn after they pass your intersection or forgot
      to turn the signal off.
    B: The law requires you to wait until the vehicle comes to a complete stop.
    C: Active turn signals always indicate the vehicle is accelerating.
    D: The approaching vehicle has the right-of-way to change lanes in the intersection.
  answer: A
  explanation: 'The manual warns: ''The driver with an active turn signal may plan
    to turn after they go past the intersection a driver is at or may have forgotten
    to turn the signal off from a prior turn.'''
- id: 159
  category: defensive_driving
  question: What is a key rule drivers should remember regarding visual search before
    making a turn?
  choices:
    A: Turn the wheel before you turn your head.
    B: Turn your head before you turn the wheel.
    C: Rely strictly on your rearview mirror.
    D: Keep your eyes fixed straight ahead.
  answer: B
  explanation: 'Under Visual Search, the manual states: ''Something for drivers to
    remember: turn your head before you turn the wheel.'''
- id: 160
  category: defensive_driving
  question: When should a driver continually check their mirrors to be aware of traffic
    behind their vehicle?
  choices:
    A: Only when driving on a multi-lane highway.
    B: Before slowing down, stopping, turning, or changing lanes.
    C: Only when parallel parking.
    D: After completing a turn or lane change.
  answer: B
  explanation: 'The manual advises: ''Drivers should check their mirrors continually
    before slowing down, stopping, turning or changing lanes.'''
- id: 161
  category: safe_driving_rules
  question: What is the minimum recommended following distance you should maintain
    between your car and the vehicle in front of you?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Five seconds
  answer: C
  explanation: Drivers should always try to keep a minimum following distance of at
    least four seconds between their car and the vehicle in front.
- id: 162
  category: defensive_driving
  question: Why should you avoid driving next to other vehicles for long periods of
    time?
  choices:
    A: It decreases your vehicle's fuel efficiency.
    B: It is illegal on multi-lane highways.
    C: You may be in their blind-spot, which reduces the space needed to avoid a collision.
    D: It causes the other driver to speed up.
  answer: C
  explanation: Drivers should avoid driving next to other vehicles for long periods
    of time because the vehicle may be in their blind-spot, and it reduces the space
    needed to avoid a collision.
- id: 163
  category: driver_responsibility
  question: If you are involved in a crash with injuries, what is the proper procedure
    regarding the injured people?
  choices:
    A: Move them to the side of the road immediately.
    B: Transport them to the nearest hospital in your vehicle.
    C: Wait in your vehicle until the ambulance arrives without interacting with them.
    D: Give aid to any injured people, but do not move them unless it is necessary.
  answer: D
  explanation: If a crash occurs, drivers should give aid to any injured people, but
    do not move them unless it is necessary, and be sure an ambulance has been called.
- id: 164
  category: driver_responsibility
  question: How many days do you have to file an accident report with the Division
    of Motor Vehicles if it is required?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: New Hampshire law requires that an accident report be filed with the
    Division of Motor Vehicles within fifteen (15) days if there is a fatality, injuries,
    or combined property damage over $1,000.
- id: 165
  category: driver_responsibility
  question: 'Under New Hampshire law, an accident report must be filed with the DMV
    if the combined property damage totals more than:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: An accident report must be filed with the DMV if there is a fatality,
    injuries, or if the combined property damage totals more than $1,000.
- id: 166
  category: driver_responsibility
  question: If a crash is investigated by a police officer, are you required to file
    a separate accident report to the DMV?
  choices:
    A: Yes, within 15 days of the crash.
    B: Yes, but only if there is a fatality.
    C: No, the report filed by the police officer satisfies the reporting requirement.
    D: No, unless the combined property damage is over $2,000.
  answer: C
  explanation: If the crash is investigated by a police officer, drivers are not required
    to file a separate report to the Division of Motor Vehicles. The police report
    satisfies the requirement.
- id: 167
  category: penalties_and_points
  question: What happens if you are uninsured, involved in a crash, and unable to
    pay for the damages and medical bills you are responsible for?
  choices:
    A: Your vehicle will be permanently confiscated by the state.
    B: You will be sentenced to a minimum of 30 days in jail.
    C: The state of New Hampshire will pay for the damages.
    D: The DMV will suspend your driving privileges until a settlement has been reached.
  answer: D
  explanation: If a driver is unable to pay for these damages and medical bills, New
    Hampshire law requires the Division of Motor Vehicles to suspend the driver's
    driving privileges until a settlement has been reached.
- id: 168
  category: penalties_and_points
  question: Which of the following convictions would require a driver to show proof
    of insurance (SR-22) to reinstate their driving privileges?
  choices:
    A: First offense speeding
    B: Driving under the influence of alcohol or drugs
    C: Parking in a handicapped zone
    D: Running a red light
  answer: B
  explanation: Motor vehicle convictions that require a driver to show proof of insurance
    (SR-22) include driving under the influence of alcohol or drugs, failing to stop
    and report a crash, homicide by motor vehicle, and second offense reckless driving.
- id: 169
  category: vehicle_information
  question: If your vehicle is equipped with an Anti-lock Braking System (ABS), how
    should you brake in an emergency?
  choices:
    A: Pump the brakes rapidly to avoid skidding.
    B: Press on the brake pedal and keep applying pressure.
    C: Lightly tap the brakes until the vehicle comes to a stop.
    D: Apply the parking brake while pressing the foot brake.
  answer: B
  explanation: For vehicles equipped with ABS, drivers should press on the brake pedal
    and keep applying pressure. ABS will work only if the driver keeps the pressure
    on the brake pedal.
- id: 170
  category: defensive_driving
  question: 'When swerving to avoid a sudden problem approaching from the opposite
    direction, you should:'
  choices:
    A: Always swerve to the left.
    B: Never swerve to the left to avoid a crash.
    C: Let go of the steering wheel and brake hard.
    D: Swerve directly into oncoming traffic.
  answer: B
  explanation: If a vehicle suddenly approaches from the opposite direction, drivers
    should steer in the direction they want to go, but try to avoid other traffic
    – never swerve to the left to avoid a crash.
- id: 171
  category: safe_driving_rules
  question: If your vehicle begins to skid, what is the first thing you should do?
  choices:
    A: Slam on the brakes.
    B: Ease up on the accelerator.
    C: Steer sharply in the opposite direction of the skid.
    D: Pull the emergency parking brake.
  answer: B
  explanation: If the vehicle begins to skid, drivers should ease up on the accelerator
    and steer in the direction that the rear of the vehicle is sliding.
- id: 172
  category: safe_driving_rules
  question: In which direction should you steer if the rear of your vehicle starts
    sliding during a skid?
  choices:
    A: In the opposite direction that the rear is sliding.
    B: In the direction that the rear of the vehicle is sliding.
    C: Keep the steering wheel perfectly straight.
    D: Towards the right shoulder of the road regardless of the skid.
  answer: B
  explanation: If the vehicle begins to skid, drivers should steer in the direction
    that the rear of the vehicle is sliding. This will allow the vehicle to go straight
    instead of sideways.
- id: 173
  category: defensive_driving
  question: 'To help maintain a safe distance from vehicles following behind you,
    you should:'
  choices:
    A: Tap your brakes repeatedly to warn them to back off.
    B: Speed up to increase the distance between vehicles.
    C: Drive at a steady speed, signal in advance, and increase your following distance
      in front.
    D: Swerve slightly within your lane to get their attention.
  answer: C
  explanation: To help maintain a safe distance from the vehicles following, drivers
    should drive at a steady speed, signal in advance and increase the following distance
    in front to allow for a safe stopping distance.
- id: 174
  category: driver_responsibility
  question: If you are involved in a crash, what should you do regarding your vehicle's
    position?
  choices:
    A: Leave it exactly where it is until the police arrive, even if it blocks traffic.
    B: If possible, move the vehicle off the road so that traffic is not blocked.
    C: Drive it home immediately and call the police from there.
    D: Push it into the nearest ditch to completely clear the area.
  answer: B
  explanation: If a crash occurs, drivers should stop and, if possible, move the vehicle
    off the road so that traffic is not blocked from passing the site of the crash.
- id: 175
  category: safe_driving_rules
  question: What should a driver do first if their vehicle begins to skid?
  choices:
    A: Brake firmly to stop the vehicle quickly.
    B: Steer in the opposite direction that the rear is sliding.
    C: Ease up on the accelerator.
    D: Shift the vehicle into neutral.
  answer: C
  explanation: If the vehicle begins to skid, drivers should ease up on the accelerator
    and steer in the direction that the rear of the vehicle is sliding.
- id: 176
  category: defensive_driving
  question: If your vehicle leaves the paved road surface due to an uneven surface
    drop-off, what is the recommended action?
  choices:
    A: Panic steer back onto the pavement immediately.
    B: Brake hard and come to a complete stop on the shoulder.
    C: Accelerate to regain traction before turning back.
    D: Slow down gradually and turn back onto the pavement when it is safe to do so.
  answer: D
  explanation: If the vehicle leaves the paved road surface, drivers should avoid
    panic steering, slow down gradually, and turn back onto the pavement when it is
    safe to do so.
- id: 177
  category: vehicle_information
  question: How should you apply the parking brake if your main brakes fail while
    driving?
  choices:
    A: Pull or push it quickly to lock the rear wheels.
    B: Pull or push it slowly to avoid locking the rear wheels and causing a skid.
    C: Pump the parking brake rapidly until the vehicle stops.
    D: Do not use the parking brake while the vehicle is in motion.
  answer: B
  explanation: In the event of brake failure, drivers should pull or push the parking
    brake slowly to avoid locking the rear wheels and causing a skid.
- id: 178
  category: defensive_driving
  question: How does a vehicle typically react if a front tire blows out?
  choices:
    A: The vehicle will pull sharply in the direction of the blowout.
    B: The vehicle will wobble and pull slightly in the opposite direction.
    C: The vehicle will lose all braking power instantly.
    D: The vehicle will accelerate uncontrollably.
  answer: A
  explanation: If a front tire blows out, the vehicle will pull sharply in the direction
    of the blowout. (If a rear tire blows out, it will wobble, shake and pull some).
- id: 179
  category: vehicle_information
  question: If the engine shuts off while the vehicle is in motion, what should you
    expect regarding the steering wheel?
  choices:
    A: It will lock completely and cannot be turned.
    B: It will spin freely without any resistance.
    C: It may be difficult to turn, requiring a strong grip.
    D: It will automatically steer the vehicle to the right shoulder.
  answer: C
  explanation: If the engine shuts off (power failure), drivers should keep a strong
    grip on the steering wheel and be aware that the steering wheel may be difficult
    to turn.
- id: 180
  category: safe_driving_rules
  question: What is the correct sequence of actions if your vehicle's accelerator
    becomes stuck?
  choices:
    A: Turn off the engine, shift to park, and brake firmly.
    B: Shift into neutral, brake firmly, and pull off the road when safe.
    C: Pump the accelerator, shift to reverse, and steer off the road.
    D: Apply the parking brake slowly and turn on the emergency flashers.
  answer: B
  explanation: If the accelerator becomes stuck, drivers should keep their eyes on
    the road, shift the vehicle into neutral, brake firmly to counteract the acceleration,
    and pull off the road when safe.
- id: 181
  category: defensive_driving
  question: If your vehicle breaks down and you do not have a cell phone, how can
    you alert other drivers that you need help?
  choices:
    A: Stand in the middle of the lane and wave your arms.
    B: Sound your horn continuously in a pattern of three.
    C: Raise the hood and tie a white cloth to the door handle or antenna.
    D: Flash your headlights on and off rapidly.
  answer: C
  explanation: If no cell phone or device is available, raise the hood of the vehicle
    and tie a white cloth (red in a snowstorm) to the driver's door handle or the
    vehicle's antenna to alert drivers that help is needed.
- id: 182
  category: defensive_driving
  question: At what distance should you place emergency flares or reflectors if your
    vehicle breaks down?
  choices:
    A: 50 feet in front of and behind the vehicle.
    B: 100 feet in front of and behind the vehicle.
    C: 200 feet in front of and behind the vehicle.
    D: 500 feet behind the vehicle only.
  answer: C
  explanation: Drivers should try to give other drivers time to change lanes by placing
    emergency flares or reflectors 200 feet in front of and behind the vehicle.
- id: 183
  category: sharing_the_road
  question: Where must pedestrians walk if they are walking on the side of a road
    where there is no sidewalk?
  choices:
    A: On the right side of the roadway with the flow of traffic.
    B: On the left side of the roadway facing oncoming traffic.
    C: In the center of the roadway.
    D: On the shoulder closest to the nearest intersection.
  answer: B
  explanation: Pedestrians must walk on the left side of the roadway facing oncoming
    traffic when walking on the side of the road where there is no sidewalk.
- id: 184
  category: sharing_the_road
  question: What must a driver do when approaching a visually impaired person carrying
    a white cane attempting to cross the roadway?
  choices:
    A: Honk the horn to let them know a vehicle is approaching.
    B: Slow down and yield only if they are in a marked crosswalk.
    C: Come to a complete stop and use extra caution when proceeding.
    D: Swerve into the opposite lane to give them plenty of room.
  answer: C
  explanation: New Hampshire law requires drivers to come to a complete stop whenever
    a person carrying a white cane or using a guide dog is attempting to cross a roadway,
    and drivers should NEVER honk at them.
- id: 185
  category: sharing_the_road
  question: What is the minimum presumed reasonable clearance distance a driver must
    leave when passing a bicyclist at 30 mph or less?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: The distance shall be presumed to be reasonable and prudent if it is
    at least 3 feet when the vehicle is traveling at 30 miles per hour or less.
- id: 186
  category: sharing_the_road
  question: If you are passing a bicyclist while traveling at 50 mph, what is the
    minimum required clearance distance you must provide?
  choices:
    A: 3 feet
    B: 4 feet
    C: 5 feet
    D: 6 feet
  answer: C
  explanation: The law requires at least 3 feet at 30 mph or less, with one additional
    foot of clearance required for every 10 miles per hour above 30 mph. At 50 mph
    (20 mph over 30), this requires 3 feet + 2 feet = 5 feet of clearance.
- id: 187
  category: sharing_the_road
  question: Why should a driver avoid sounding their horn close to a bicyclist unless
    there is a chance of a crash?
  choices:
    A: It is illegal to use a horn in residential areas.
    B: The horn may startle the bicyclist and cause them to steer into the vehicle's
      path.
    C: Bicyclists cannot hear vehicle horns over the wind.
    D: It will cause the bicyclist to stop abruptly in the lane.
  answer: B
  explanation: Sounding your horn to alert your presence may startle bicyclists and
    cause them to steer into your path and crash.
- id: 188
  category: sharing_the_road
  question: Why might a bicyclist be unable to use hand signals when turning or stopping?
  choices:
    A: Hand signals are not legally required for bicyclists.
    B: They may be traveling too fast to signal safely.
    C: Road or traffic conditions may require them to keep both hands on the handlebars.
    D: Bicycles are equipped with electronic turn signals instead.
  answer: C
  explanation: Bicyclists may be unable to signal if road or traffic conditions require
    them to keep both hands on the handlebars.
- id: 189
  category: defensive_driving
  question: If your vehicle breaks down during a snowstorm and you do not have a cell
    phone, what color cloth should you tie to the door handle or antenna?
  choices:
    A: White
    B: Red
    C: Yellow
    D: Orange
  answer: B
  explanation: If no cell phone is available, raise the hood and tie a white cloth
    (red in a snowstorm) to the driver's door handle or antenna to alert drivers that
    help is needed.
- id: 190
  category: safe_driving_rules
  question: What is the minimum recommended following distance when driving behind
    a motorcycle?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Six seconds
  answer: C
  explanation: The manual states that drivers should be sure to allow at least a four-second
    following distance when behind a motorcycle.
- id: 191
  category: vehicle_information
  question: What should a driver be aware of regarding a motorcycle's turn signals?
  choices:
    A: They are usually brighter than car signals.
    B: They do not have an automatic cancel feature.
    C: They are not legally required to be used.
    D: They always flash red instead of amber.
  answer: B
  explanation: The manual notes that drivers should be aware that most motorcycles
    do not have an automatic cancel for turn signals, so you should ensure the rider
    is actually turning before proceeding.
- id: 192
  category: sharing_the_road
  question: When is it permissible for a car to share a lane with a motorcycle?
  choices:
    A: When traffic is completely stopped.
    B: When the motorcycle is traveling below the speed limit.
    C: When the lane is wide enough for both vehicles.
    D: Never, as motorcycles are entitled to a full lane width.
  answer: D
  explanation: 'The manual explicitly states: "Never attempt to share a lane with
    a motorcycle. Motorcycles are entitled to the same full lane width as all other
    vehicles."'
- id: 193
  category: signs_and_signals
  question: What does a fluorescent or reflective orange and red triangle displayed
    on the rear of a vehicle indicate?
  choices:
    A: The vehicle is carrying hazardous materials.
    B: The vehicle is traveling less than 25 mph.
    C: The vehicle is making frequent stops.
    D: The vehicle is an emergency responder.
  answer: B
  explanation: A fluorescent or reflective orange and red triangle displayed on the
    rear of vehicles means the vehicle is a slow-moving vehicle traveling less than
    25 mph.
- id: 194
  category: sharing_the_road
  question: What should you NEVER do when approaching a horseback rider on the road?
  choices:
    A: Reduce your speed.
    B: Pass with caution.
    C: Assess the situation.
    D: Use your horn or rev your engine.
  answer: D
  explanation: When approaching a horse, drivers should reduce speed, assess the situation,
    pass with caution, and "never use the horn or 'rev' the engine" to prevent frightening
    the animal.
- id: 195
  category: sharing_the_road
  question: How can you tell if you are driving in a large truck's side blind spot?
  choices:
    A: You cannot see the truck's turn signals.
    B: You cannot see the truck driver's face in their side view mirror.
    C: You are driving at the exact same speed as the truck.
    D: You are within 50 feet of the truck's rear bumper.
  answer: B
  explanation: The manual explains that if a driver cannot see the truck driver’s
    face in the side view mirror, then the truck driver cannot see the other vehicle,
    indicating you are in their blind spot.
- id: 196
  category: safe_driving_rules
  question: Under ideal conditions, what is the minimum stopping distance for a loaded
    truck traveling at 55 mph?
  choices:
    A: 150 feet
    B: 200 feet
    C: 335 feet
    D: 500 feet
  answer: C
  explanation: A loaded truck with good tires and properly adjusted brakes under ideal
    conditions at 55 mph requires a minimum of 335 feet before coming to a complete
    stop.
- id: 197
  category: sharing_the_road
  question: How far can the blind spot directly behind a large commercial vehicle
    extend?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 200 feet
    D: Up to 335 feet
  answer: C
  explanation: Unlike cars, large vehicles have huge blind spots directly behind them
    that extend up to 200 feet.
- id: 198
  category: safe_driving_rules
  question: What should you do before pulling back into the lane in front of a large
    truck you have just passed?
  choices:
    A: Wait until you are at least 500 feet ahead of the truck.
    B: Look for the whole front of the truck in your rear-view mirror.
    C: Flash your headlights to signal your intent.
    D: Tap your brakes to ensure the truck driver sees you.
  answer: B
  explanation: When passing a large vehicle, you should look for the whole front of
    the vehicle in the rear-view mirror before pulling in front and maintaining speed.
- id: 199
  category: sharing_the_road
  question: Why might a large truck swing wide to the left before making a right turn?
  choices:
    A: To allow cars to pass on the right.
    B: To clear the corner of a curb or other obstruction.
    C: To build up speed for the turn.
    D: To check their right-side blind spot.
  answer: B
  explanation: When a truck or bus needs to make a right turn, they may need to swing
    wide to the left in order to safely turn right and clear the corner of a curb
    or other obstruction.
- id: 200
  category: signs_and_signals
  question: What is one primary reason intersections are marked with stop lines?
  choices:
    A: To indicate where pedestrians are allowed to cross.
    B: To give larger vehicles more turning space by setting other vehicles farther
      back.
    C: To mark the boundary of a school zone.
    D: To trigger the traffic light sensors.
  answer: B
  explanation: Stop lines help to set a vehicle farther back at an intersection to
    give larger vehicles more turning space.
- id: 201
  category: safe_driving_rules
  question: What is the minimum distance you must maintain when following a fire truck
    that is sounding a siren or operating flashing lights?
  choices:
    A: 100 feet
    B: 200 feet
    C: 335 feet
    D: 500 feet
  answer: D
  explanation: Drivers must not follow a fire truck closer than 500 feet when it is
    sounding a siren or operating flashing lights.
- id: 202
  category: safe_driving_rules
  question: What should you do when an emergency vehicle approaches from any direction
    with its siren and flashing lights on?
  choices:
    A: Speed up to clear the road ahead of the emergency vehicle.
    B: Stop immediately in your current lane.
    C: Drive immediately to the right side of the road and stop, avoiding intersections.
    D: Move to the left lane and slow down.
  answer: C
  explanation: Drivers should drive immediately to the right side of the road and
    stop the vehicle until the emergency has passed, and avoid blocking an intersection
    when stopping.
- id: 203
  category: defensive_driving
  question: Under New Hampshire's "Sherrill's Law," what must a driver do when approaching
    a stopped vehicle with flashing hazard lights on the side of the highway?
  choices:
    A: Stop and offer assistance to the stopped vehicle.
    B: Maintain a reduced speed and give a wide berth or change lanes if safe.
    C: Honk the horn to alert the stopped driver of your presence.
    D: Accelerate to pass the hazard as quickly as possible.
  answer: B
  explanation: Sherrill's Law requires drivers to maintain a reduced speed and, if
    practical, give a wide berth or change into a non-adjacent lane when approaching
    stopped vehicles displaying hazard warning lights.
- id: 204
  category: sharing_the_road
  question: Why might a motorcyclist change direction or slow down when traveling
    over a metal or grated bridge?
  choices:
    A: The metal interferes with the motorcycle's electronics.
    B: The rider may experience a wobbling sensation.
    C: The speed limit is always lower on grated bridges.
    D: The motorcycle's tires can easily get stuck in the grates.
  answer: B
  explanation: The manual states that motorcyclists may experience a wobbling sensation
    when traveling over metal or grated bridges, which may cause them to slow down
    or change direction.
- id: 205
  category: safe_driving_rules
  question: What must a driver do when approaching a stationary vehicle displaying
    blue, red, or amber emergency lights?
  choices:
    A: Maintain speed and stay in the current lane
    B: Maintain a reduced speed and give a wide berth without endangering oncoming
      traffic
    C: Stop immediately in the travel lane
    D: Honk the horn to alert the emergency workers
  answer: B
  explanation: The manual states drivers shall maintain a reduced speed and if practical
    give a wide berth, without endangering oncoming traffic, to vehicles displaying
    blue, red, or amber emergency warning lights.
- id: 206
  category: penalties_and_points
  question: What is the penalty for a first offense of violating the law regarding
    approaching emergency or stopped vehicles?
  choices:
    A: A warning and mandatory driving class
    B: A 30-day license suspension
    C: A fine plus penalty assessment
    D: Up to 6 months in jail
  answer: C
  explanation: Any person violating this law shall be fined plus penalty assessment
    for a first offense.
- id: 207
  category: penalties_and_points
  question: An increased fine and penalty assessment is applied if a driver commits
    a subsequent offense of the emergency vehicle "move over" law within what time
    period?
  choices:
    A: 6 months
    B: 12 months
    C: 24 months
    D: 36 months
  answer: B
  explanation: The manual specifies an increased fine plus penalty assessment for
    a subsequent offense in a 12-month period.
- id: 208
  category: safe_driving_rules
  question: When pulling off to the side of the road for a police vehicle with lights
    and/or sirens engaged, what is the first thing you should do once stopped?
  choices:
    A: Exit the vehicle to speak with the officer
    B: Come to a complete stop and place the vehicle in park
    C: Reach into the glove box for your registration
    D: Turn off all interior and exterior lights
  answer: B
  explanation: During a traffic stop, a driver must come to a complete stop and place
    the vehicle in park.
- id: 209
  category: safe_driving_rules
  question: If you are pulled over by law enforcement at night, what should you do
    to help the officer see inside your vehicle?
  choices:
    A: Turn on your high beams
    B: Turn off your hazard flashers
    C: Turn on the interior lights
    D: Roll down all the windows and turn off the headlights
  answer: C
  explanation: If pulled over at night, you should turn on the interior lights to
    help the officer see that everything is in order inside the vehicle.
- id: 210
  category: driver_responsibility
  question: Where should you place your hands while waiting for the police officer
    to approach your vehicle during a traffic stop?
  choices:
    A: In your lap
    B: On the steering wheel
    C: Out the window
    D: On the dashboard
  answer: B
  explanation: During a police stop, you should remain calm, keep the safety belt
    fastened, place hands on the steering wheel, and limit movements.
- id: 211
  category: driver_responsibility
  question: How should you retrieve your driver's license and vehicle registration
    when requested by a police officer?
  choices:
    A: Quickly grab them before the officer reaches the window
    B: Tell the officer where they are located and reach for them slowly with one
      hand on the wheel
    C: Ask the passenger to unbuckle and reach into the back seat for them
    D: Step out of the vehicle to retrieve them from the trunk
  answer: B
  explanation: If the officer asks for these documents, tell the officer where they
    are located and reach for them slowly with one hand on the wheel.
- id: 212
  category: defensive_driving
  question: What should you do if you are pulled over by a plainclothes police officer
    in an unmarked vehicle?
  choices:
    A: Refuse to roll down your window or speak to them
    B: Drive away immediately
    C: Ask for identification such as a badge or department identification card
    D: Demand they call a uniformed officer before you stop
  answer: C
  explanation: If the police officer is in plain clothes (no uniform), ask for identification
    such as a badge or department identification card.
- id: 213
  category: signs_and_signals
  question: What colors are used for work zone signs?
  choices:
    A: Yellow background with black letters
    B: Orange background with black letters or symbols
    C: White background with red letters
    D: Green background with white symbols
  answer: B
  explanation: Work zone signs have an orange background and black letters or symbols.
- id: 214
  category: safe_driving_rules
  question: What should you do regarding your speed when driving through a work zone?
  choices:
    A: Maintain the posted highway speed limit unless workers are visible
    B: Always reduce speed, even if there are no signs indicating a change in speed
      limit
    C: Increase speed to clear the work zone quickly
    D: Stop completely before entering the work zone
  answer: B
  explanation: Always reduce speed in a work zone, even if there are no signs indicating
    a change in speed limit within the work zone.
- id: 215
  category: defensive_driving
  question: 'When driving through a work zone at night, drivers should:'
  choices:
    A: Use extreme caution whether workers are present or not
    B: Use high beams to blind oncoming traffic
    C: Assume no workers are present and maintain normal speed
    D: Drive on the shoulder to avoid rough pavement
  answer: A
  explanation: Drivers should use extreme caution when driving through a work zone
    at night whether workers are present or not.
- id: 216
  category: safe_driving_rules
  question: When is it safe to resume normal speed after driving through a work zone?
  choices:
    A: As soon as you pass the construction equipment
    B: When you no longer see any workers
    C: When the "End Road Work" sign is visible
    D: After driving exactly one mile past the work zone
  answer: C
  explanation: Observe the posted work zone signs and do not resume normal speed until
    the "End Road Work" sign is visible.
- id: 217
  category: defensive_driving
  question: Why is it important to reduce speed in a work zone even if no speed limit
    change is posted?
  choices:
    A: To read the construction company's advertisements
    B: Narrower lanes and rough pavement can create hazardous conditions
    C: To avoid getting a parking ticket
    D: Because construction vehicles always have the right-of-way
  answer: B
  explanation: Always reduce speed in a work zone... The narrower lanes and rough
    pavement can create hazardous conditions.
- id: 218
  category: safe_driving_rules
  question: When pulled over by a police vehicle, what should you do with your vehicle's
    engine and hazard flashers?
  choices:
    A: Leave the engine running and turn off all flashers
    B: Turn off the engine and turn on the hazard flashers
    C: Rev the engine to indicate you are stopped
    D: Turn off the engine and activate the high beams
  answer: B
  explanation: A driver must turn off the engine and turn on the hazard flashers during
    a police stop.
- id: 219
  category: safe_driving_rules
  question: While driving in a work zone, how should you adjust your following distance?
  choices:
    A: Decrease it to prevent other cars from merging
    B: Maintain your normal following distance
    C: Increase the following distance
    D: Tailgate the vehicle in front of you to move through faster
  answer: C
  explanation: While driving in a work zone, drivers should reduce speed, increase
    the following distance; watch the traffic around the vehicle and be prepared to
    stop.
- id: 220
  category: safe_driving_rules
  question: 'A youth operator may not drive a vehicle with more passengers than there
    are:'
  choices:
    A: Doors on the vehicle
    B: Seat belts in the vehicle
    C: Years of driving experience they have
    D: Adult supervisors present
  answer: B
  explanation: Youth operators must not drive a vehicle with more people than there
    are seat belts available.
- id: 221
  category: safe_driving_rules
  question: When approaching a roundabout, what must a driver do?
  choices:
    A: Speed up to merge smoothly
    B: Yield to traffic already traveling in the roundabout
    C: Stop and wait for a green light
    D: Sound their horn before entering
  answer: B
  explanation: Drivers should yield to traffic already traveling in a roundabout.
- id: 222
  category: alcohol_drugs_health
  question: What does the acronym BAC stand for?
  choices:
    A: Basic Auto Control
    B: Blood Alcohol Concentration
    C: Breath Alcohol Content
    D: Body Alcohol Capacity
  answer: B
  explanation: BAC stands for Blood Alcohol Concentration.
- id: 223
  category: signs_and_signals
  question: What does a pennant-shaped sign located on the left-hand side of the road
    indicate?
  choices:
    A: A school zone
    B: A railroad crossing
    C: The beginning of a no passing zone
    D: A sharp left curve
  answer: C
  explanation: A pennant-shaped sign located on the left-hand side of the road points
    to the beginning of a no passing zone.
- id: 224
