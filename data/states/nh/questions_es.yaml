questions:
- id: 1
  category: safe_driving_rules
  question: ¿Qué tres acciones fomenta específicamente la gobernadora Kelly A. Ayotte
    para que los conductores mejoren la seguridad vial?
  choices:
    A: Conducir al límite de velocidad, usar las señales de giro y abrocharse el cinturón
      de seguridad.
    B: Reducir la velocidad, evitar distracciones al conducir y estar atento a los
      demás viajeros.
    C: Ceder el paso a los peatones, detenerse en los semáforos en rojo y revisar
      los espejos.
    D: Mantener los faros encendidos, evitar conducir de noche y mantener la presión
      de los neumáticos.
  answer: B
  explanation: En su mensaje de apertura, la gobernadora Kelly A. Ayotte alienta a
    los conductores a poner de su parte reduciendo la velocidad, evitando distracciones
    al conducir y estando atentos a los demás viajeros.
- id: 2
  category: driver_responsibility
  question: Según el director John C. Marasco, ¿el manual ofrece una visión general
    de los peligros y las sanciones asociados con qué actividades ilegales específicas?
  choices:
    A: Exceso de velocidad, pasarse señales de alto y estacionamiento ilegal.
    B: Enviar mensajes de texto al conducir, seguir de cerca al vehículo de adelante
      y la ira al volante.
    C: Conducir bajo los efectos del alcohol o drogas (impaired driving), no ceder
      el paso a vehículos de emergencia y la limpieza inadecuada de nieve y hielo.
    D: Conducir sin licencia, registro vencido y luces traseras rotas.
  answer: C
  explanation: El mensaje del director establece que el manual proporciona una visión
    general de los peligros y las sanciones asociados con actividades ilegales como
    conducir bajo los efectos del alcohol o drogas, no ceder el paso a vehículos de
    emergencia y las leyes relativas a la limpieza adecuada de nieve y hielo.
- id: 3
  category: safe_driving_rules
  question: ¿Qué lema desafía el Director de Vehículos Motorizados a los conductores
    a seguir cada día?
  choices:
    A: ¡Conduzca seguro, viva libre!
    B: ¡La seguridad es lo primero, siempre!
    C: ¡Llegue vivo a New Hampshire!
    D: ¡Sea un líder en la carretera! (Be a Leader on the Roadway!)
  answer: D
  explanation: 'El director John C. Marasco desafía a los conductores a ser el mejor
    conductor posible cada día y siempre: ''¡Sea un líder en la carretera!''.'
- id: 4
  category: driver_responsibility
  question: Según la Sección 1 del Índice del manual, ¿qué tema se trata con respecto
    a dar el 'Regalo de la Vida'?
  choices:
    A: Donación de sangre
    B: Donación de órganos
    C: Conducción defensiva
    D: Ceder el paso a los peatones
  answer: B
  explanation: 'El Índice enumera ''Donación de órganos: dar el regalo de la vida''
    en la Sección 1: Conducir en New Hampshire.'
- id: 5
  category: license_system
  question: ¿Qué ley específica sobre conductores jóvenes se trata en la Sección 2
    del manual?
  choices:
    A: La Ley de Operador Junior 'Menor de 18 años'
    B: La Ley de Conductor Adolescente 'Menor de 21 años'
    C: La Ley de Operador Juvenil 'Menor de 20 años'
    D: La Ley de Licencia Graduada 'Menor de 19 años'
  answer: C
  explanation: La Sección 2 del Índice enumera explícitamente la 'Ley de Operador
    Juvenil menor de 20 años'.
- id: 6
  category: defensive_driving
  question: Según el Índice, ¿cuál de los siguientes temas se clasifica en la Sección
    3, 'Conducción Peligrosa'?
  choices:
    A: Ajuste de los espejos del vehículo
    B: Fatiga
    C: Ceder el derecho de paso
    D: Remolcar un tráiler
  answer: B
  explanation: 'El Índice enumera la ''Fatiga'' como un tema bajo la Sección 3: Conducción
    Peligrosa.'
- id: 7
  category: vehicle_information
  question: En la Sección 4, 'Antes de conducir', ¿cuál de los siguientes temas se
    analiza con respecto a la preparación de su vehículo en climas invernales?
  choices:
    A: Instalación de neumáticos para nieve
    B: Comprobación de los niveles de anticongelante
    C: Remoción de nieve e hielo
    D: Calentamiento del motor
  answer: C
  explanation: La Sección 4 del Índice incluye una subsección dedicada a la 'Remoción
    de nieve e hielo'.
- id: 8
  category: safe_driving_rules
  question: ¿Cuál de los siguientes se enumera como un tema bajo la Sección 5, 'Conducción
    Básica'?
  choices:
    A: Bolsas de aire (Air Bags)
    B: Comunicación y señalización
    C: Infractores habituales
    D: Distracciones del conductor
  answer: B
  explanation: 'Según el Índice, ''Comunicación y señalización'' es un tema cubierto
    en la Sección 5: Conducción Básica.'
- id: 9
  category: driver_responsibility
  question: 'El Director de Vehículos Motorizados señala que el manual ofrece una
    guía importante sobre qué esperar y qué hacer si usted es:'
  choices:
    A: Involucrado en una colisión de varios autos.
    B: Varado a un lado de la carretera.
    C: Intentando registrar un vehículo de otro estado.
    D: Detenido por un oficial de policía mientras conduce.
  answer: D
  explanation: El mensaje del director establece que el manual ofrece una guía importante
    relacionada con qué esperar y qué debe hacer si un oficial de policía lo detiene
    mientras conduce.
- id: 10
  category: license_system
  question: Según el Índice, ¿en qué sección se puede encontrar información sobre
    'REAL ID'?
  choices:
    A: 'Sección 1: Conducir en New Hampshire'
    B: 'Sección 2: Información sobre la licencia de conducir y la identificación para
      no conductores'
    C: 'Sección 3: Conducción Peligrosa'
    D: 'Sección 4: Antes de conducir'
  answer: B
  explanation: 'El Índice enumera ''REAL ID'' bajo la Sección 2: Información sobre
    la licencia de conducir y la identificación para no conductores.'
- id: 11
  category: vehicle_information
  question: ¿Qué requisito de equipo de seguridad se menciona específicamente en la
    Sección 4 del Índice?
  choices:
    A: Uso de casco para bicicletas
    B: Uso de chaleco reflectante
    C: Uso de casco para motocicletas
    D: Uso de extintor de incendios
  answer: C
  explanation: La Sección 4 del Índice incluye una subsección titulada "Uso de casco
    para motocicletas".
- id: 12
  category: defensive_driving
  question: Según la Sección 3 del Índice, ¿cuál de los siguientes se considera un
    factor en la "Conducción peligrosa"?
  choices:
    A: Emociones
    B: Dirección
    C: Gestión de la velocidad
    D: Práctica de conducción
  answer: A
  explanation: 'El Índice enumera las "Emociones" como un tema bajo la Sección 3:
    Conducción peligrosa.'
- id: 13
  category: penalties_and_points
  question: ¿Qué tema relacionado con la pérdida de los privilegios de conducir se
    menciona específicamente en la Sección 2 del Índice?
  choices:
    A: Multas de estacionamiento
    B: Evasión de peajes
    C: Infractores habituales
    D: Violaciones por ruido
  answer: C
  explanation: La Sección 2 del Índice enumera a los "Infractores habituales" inmediatamente
    después de "Pérdida de los privilegios de conducir".
- id: 14
  category: defensive_driving
  question: Según el mensaje del Director, ¿qué puede provocar una tragedia involuntaria
    en la carretera?
  choices:
    A: Conducir un vehículo de más de 10 años.
    B: No actualizar a una identificación REAL ID.
    C: Solo un momento de falta de atención, distracción o conducción peligrosa.
    D: Conducir con placas de otro estado.
  answer: C
  explanation: El director John C. Marasco recuerda a los conductores que "solo un
    momento de falta de atención, distracción o conducción peligrosa puede provocar
    una tragedia involuntaria".
- id: 15
  category: safe_driving_rules
  question: ¿Cuál de los siguientes temas de seguridad de los pasajeros se enumera
    explícitamente en la Sección 4, "Antes de conducir"?
  choices:
    A: Leyes de sujeción de mascotas
    B: Leyes de seguridad para niños pasajeros
    C: Seguridad de los pasajeros de edad avanzada
    D: Reglas para pasajeros de autobuses escolares
  answer: B
  explanation: 'El Índice enumera explícitamente las "Leyes de seguridad para niños
    pasajeros" en la Sección 4: Antes de conducir.'
- id: 16
  category: license_system
  question: Al practicar la conducción en la carretera, un estudiante debe estar acompañado
    por un instructor de educación vial o un adulto responsable con licencia que tenga
    al menos ¿qué edad?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: 30 años
  answer: C
  explanation: El manual establece que el aprendizaje de la conducción debe estudiarse
    y aplicarse junto con el entrenamiento y la práctica en la carretera con un instructor
    de educación vial o un adulto responsable con licencia de 25 años o más.
- id: 17
  category: license_system
  question: Según la ley de New Hampshire, ¿las personas de qué edad deben completar
    un programa de educación vial aprobado antes de solicitar una licencia de conducir?
  choices:
    A: 15 o 16 años de edad
    B: 16 o 17 años de edad
    C: 17 o 18 años de edad
    D: Menores de 21 años de edad
  answer: B
  explanation: La ley RSA 263:19 del estado de New Hampshire exige que todas las personas
    de 16 o 17 años que deseen solicitar una licencia de conducir hayan completado
    primero un programa de educación vial aprobado.
- id: 18
  category: license_system
  question: ¿Cuántas horas de instrucción en el aula con un instructor de educación
    vial certificado se requieren para un programa de educación vial aprobado?
  choices:
    A: 10 horas
    B: 20 horas
    C: 30 horas
    D: 40 horas
  answer: C
  explanation: Los requisitos de Educación Vial incluyen 30 horas de instrucción en
    el aula con un instructor de educación vial certificado.
- id: 19
  category: license_system
  question: Según los requisitos de Educación Vial, ¿cuántas horas de práctica de
    conducción se requieren?
  choices:
    A: 5 horas
    B: 10 horas
    C: 20 horas
    D: 30 horas
  answer: B
  explanation: El manual enumera 10 horas de práctica de conducción como requisito
    de Educación Vial.
- id: 20
  category: vehicle_information
  question: ¿Bajo qué Título de los Estatutos Revisados Anotados de New Hampshire
    (RSA) se pueden encontrar las leyes de vehículos motorizados?
  choices:
    A: Título 10
    B: Título 15
    C: Título 21
    D: Título 25
  answer: C
  explanation: El manual aconseja revisar las secciones 259 a 269 de los Estatutos
    Revisados Anotados (RSA) bajo el Título 21 (Vehículos Motorizados).
- id: 21
  category: license_system
  question: ¿Aproximadamente cuántos estudiantes participan en educación vial cada
    año a través de escuelas de manejo aprobadas por el estado en New Hampshire?
  choices:
    A: Más de 5,000
    B: Más de 10,000
    C: Más de 13,000
    D: Más de 20,000
  answer: C
  explanation: El manual establece que más de 13,000 estudiantes participan en educación
    vial cada año a través de escuelas de manejo aprobadas por el estado.
- id: 22
  category: sharing_the_road
  question: 'Según el índice, ¿cuál de los siguientes temas se trata en la Sección
    11: ''Compartir la carretera''?'
  choices:
    A: Estacionamiento en paralelo
    B: Interacción con camiones grandes y vehículos comerciales
    C: Cómo lidiar con derrapes
    D: Responsabilidad financiera
  answer: B
  explanation: 'El índice enumera ''Interacción con camiones grandes y vehículos comerciales''
    en la Sección 11: Compartir la carretera.'
- id: 23
  category: safe_driving_rules
  question: '¿Cuál de los siguientes se clasifica en la Sección 10: ''Emergencias
    al conducir'' en el Manual del Conductor de New Hampshire?'
  choices:
    A: Desniveles en superficies irregulares
    B: Rotondas de carriles múltiples
    C: Búsqueda visual
    D: Carreteras de peaje
  answer: A
  explanation: 'El índice enumera ''Desniveles en superficies irregulares'' en la
    Sección 10: Emergencias al conducir.'
- id: 24
  category: safe_driving_rules
  question: ¿Dónde buscaría un conductor en el manual para encontrar las reglas relativas
    a las rotondas de carriles múltiples (círculos de tráfico)?
  choices:
    A: 'Sección 6: Reglas de la carretera'
    B: 'Sección 7: Conducción general y estacionamiento'
    C: 'Sección 8: Conducción segura'
    D: 'Sección 11: Compartir la carretera'
  answer: B
  explanation: 'El índice ubica ''Rotondas de carriles múltiples (círculos de tráfico)''
    en la Sección 7: Conducción general y estacionamiento.'
- id: 25
  category: driver_responsibility
  question: ¿El tema de 'Responsabilidad financiera' está agrupado con qué otro tema
    en la Sección 9 del manual?
  choices:
    A: Fallas del vehículo
    B: Procedimientos en caso de accidente
    C: Consejos para una conducción segura
    D: Dispositivos de control de tráfico
  answer: B
  explanation: La Sección 9 del manual se titula 'ACCIDENTES Y RESPONSABILIDAD FINANCIERA'
    e incluye 'Procedimientos en caso de accidente' y 'Responsabilidad financiera'.
- id: 26
  category: signs_and_signals
  question: ¿Qué sección del manual cubre los dispositivos de control de tráfico,
    las señales de advertencia y las marcas en el pavimento?
  choices:
    A: 'Sección 6: Reglas de la carretera'
    B: 'Sección 7: Conducción general y estacionamiento'
    C: 'Sección 8: Conducción segura'
    D: 'Sección 10: Emergencias al conducir'
  answer: A
  explanation: 'Según el índice, la Sección 6: Reglas de la carretera incluye dispositivos
    de control de tráfico, señales de advertencia y marcas en el pavimento.'
- id: 27
  category: safe_driving_rules
  question: Además de ayudar a una persona que está aprendiendo a conducir, ¿cuál
    es otro uso previsto para el Manual del Conductor de New Hampshire?
  choices:
    A: Servir como documento legal en la corte
    B: Reemplazar la necesidad de un instructor de educación vial certificado
    C: Ser utilizado como un recurso para revisar los hábitos de conducción diarios
    D: Proporcionar una lista completa de todas las leyes estatales
  answer: C
  explanation: 'El manual establece: ''Este manual también puede utilizarse como recurso
    para revisar los hábitos de conducción diarios''.'
- id: 28
  category: defensive_driving
  question: ¿'Búsqueda visual' y 'Gestión del espacio' son subtemas que se encuentran
    bajo qué sección principal del Manual del Conductor de New Hampshire?
  choices:
    A: 'Sección 6: Reglas de la carretera'
    B: 'Sección 8: Conducción segura'
    C: 'Sección 10: Emergencias al conducir'
    D: 'Sección 11: Compartir la carretera'
  answer: B
  explanation: 'El índice enumera ''Búsqueda visual'' y ''Gestión del espacio'' en
    la Sección 8: Conducción segura.'
- id: 29
  category: driver_testing
  question: ¿Cuántas horas de tiempo de conducción supervisada con un padre, tutor
    o adulto responsable se requieren para cumplir con los requisitos de educación
    vial de New Hampshire?
  choices:
    A: 20 horas, incluyendo 5 horas por la noche
    B: 30 horas, incluyendo 10 horas por la noche
    C: 40 horas, incluyendo 10 horas por la noche
    D: 50 horas, incluyendo 15 horas por la noche
  answer: C
  explanation: Los requisitos de educación vial incluyen 40 horas de tiempo de conducción
    supervisada adicional con un padre, tutor u otro adulto responsable, de las cuales
    10 horas deben completarse por la noche.
- id: 30
  category: license_system
  question: ¿Cuántos días tienen los nuevos residentes de New Hampshire para obtener
    una licencia de conducir después de mudarse al estado?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Según el manual, los nuevos residentes de New Hampshire tienen hasta
    60 días para obtener una licencia de conducir después de mudarse al estado.
- id: 31
  category: license_system
  question: ¿Si no posee una licencia de conducir, a qué edad mínima permite la ley
    de New Hampshire que usted practique la conducción cuando esté acompañado por
    un adulto responsable con licencia que tenga 25 años de edad o más?
  choices:
    A: 15 años de edad
    B: 15 años y medio de edad
    C: 16 años de edad
    D: 16 años y medio de edad
  answer: B
  explanation: La ley de New Hampshire permite que una persona de al menos 15 años
    y medio de edad, que no posea una licencia de conducir, conduzca un vehículo motorizado
    mientras aprende a conducir, siempre que esté acompañada por un padre, tutor legal
    o un adulto responsable que tenga 25 años de edad o más.
- id: 32
  category: driver_testing
  question: ¿Cuál es la agudeza visual mínima requerida en ambos ojos para aprobar
    el examen de la vista de New Hampshire para una licencia de conducir?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Los solicitantes deben tener una agudeza visual de 20/40 en ambos ojos.
    Si un solicitante tiene visión en un solo ojo, debe tener una agudeza visual de
    20/30.
- id: 33
  category: driver_testing
  question: Durante el examen de conocimientos automatizado, ¿el examen terminará
    automáticamente si el solicitante responde incorrectamente a más de cuántas preguntas?
  choices:
    A: 5 preguntas
    B: 6 preguntas
    C: 8 preguntas
    D: 10 preguntas
  answer: C
  explanation: El examen de conocimientos consta de 40 preguntas de opción múltiple.
    Si se responden incorrectamente más de 8 preguntas, el examen terminará automáticamente.
- id: 34
  category: driver_testing
  question: ¿Quién tiene permitido estar presente en el vehículo durante el examen
    de conducción (road test)?
  choices:
    A: Solo el solicitante y el examinador de licencias
    B: El solicitante, el examinador y un padre o tutor
    C: El solicitante, el examinador y un conductor con licencia mayor de 25 años
    D: El solicitante, el examinador y un instructor de educación vial
  answer: A
  explanation: El manual especifica que ninguna persona, excepto el solicitante y
    el examinador de licencias autorizado de la División de Vehículos Motorizados
    (DMV), puede estar presente en el vehículo durante el examen de conducción.
- id: 35
  category: driver_testing
  question: Si un solicitante reprueba el examen de conocimientos o el examen de conducción,
    ¿qué tan pronto se le puede programar una cita para volver a tomar el examen?
  choices:
    A: Al siguiente día hábil
    B: No antes de 5 días a partir del examen reprobado
    C: No antes de 10 días a partir del examen reprobado
    D: No antes de 14 días a partir del examen reprobado
  answer: C
  explanation: Si no se completa con éxito el examen de conocimientos o el examen
    de conducción, se le asignará al solicitante una cita para volver a tomar el examen
    no antes de diez días a partir de la fecha del examen reprobado.
- id: 36
  category: license_system
  question: ¿Qué clase de licencia permite a un conductor operar un vehículo con un
    peso bruto vehicular de 26,000 libras o menos, siempre que no remolque un tráiler
    de más de 10,000 libras, no transporte materiales peligrosos ni conduzca un vehículo
    diseñado para transportar a 16 o más personas?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase D
  answer: D
  explanation: Una licencia Clase D permite a un conductor manejar un vehículo con
    un peso bruto vehicular de 26,000 libras o menos si no remolca un tráiler de más
    de 10,000 libras, no transporta materiales peligrosos o no está diseñado para
    transportar a 16 o más personas, incluyendo al conductor.
- id: 37
  category: license_system
  question: ¿Cuándo vence una licencia de Operador Juvenil (Youth Operator) de New
    Hampshire?
  choices:
    A: Al cumplir el titular 18 años
    B: Al cumplir el titular 21 años
    C: Cinco años después de la fecha de emisión
    D: Al graduarse de la escuela secundaria
  answer: B
  explanation: Las licencias de Operador Juvenil se imprimen verticalmente y vencen
    al cumplir el titular los 21 años de edad.
- id: 38
  category: license_system
  question: ¿Qué indica una restricción 'B' en una licencia de conducir de New Hampshire?
  choices:
    A: Transmisión automática
    B: Espejo exterior
    C: Lentes correctivos
    D: Solo de día
  answer: C
  explanation: Si el solicitante requiere usar anteojos o lentes de contacto para
    aprobar el examen de la vista, se colocará la restricción 'B' de lentes correctivos
    en la licencia del solicitante.
- id: 39
  category: license_system
  question: Bajo el 'Concepto de Licencia Única' (One License Concept), ¿qué deben
    hacer los nuevos residentes al solicitar una licencia de conducir de New Hampshire?
  choices:
    A: Entregar todas las licencias de conducir válidas emitidas por cualquier otra
      jurisdicción
    B: Conservar su licencia de otro estado como forma secundaria de identificación
    C: Pagar una tarifa de licencia doble para mantener ambas licencias
    D: Tomar un curso de conducción obligatorio de 10 horas
  answer: A
  explanation: La ley del estado de New Hampshire, RSA 263:4, exige que los nuevos
    residentes de NH entreguen todas las licencias de conducir válidas emitidas por
    cualquier otra jurisdicción al solicitar una licencia de conducir de New Hampshire.
- id: 40
  category: license_system
  question: ¿Bajo qué condición NO se requiere que un conductor tenga una licencia
    específica de ciclomotor (moped) para operar uno?
  choices:
    A: Si tiene más de 21 años de edad
    B: Si solo conduce el ciclomotor durante las horas del día
    C: Si ya posee una licencia Clase A, B, C, D o de motocicleta
    D: Si el ciclomotor tiene menos de 2 caballos de fuerza de frenado
  answer: C
  explanation: Los conductores no necesitan una licencia de ciclomotor si ya poseen
    una licencia Clase A, B, C, D o de motocicleta.
- id: 41
  category: driver_testing
  question: ¿Al llegar para un examen de licencia de conducir, qué se requiere con
    respecto al conductor con licencia que trae el vehículo para la prueba?
  choices:
    A: Deben sentarse en el asiento trasero durante la prueba de carretera
    B: Deben permanecer en el lugar del examen hasta que se complete la prueba de
      carretera
    C: Deben ser instructores certificados de educación vial
    D: Deben abandonar las instalaciones y regresar después de 45 minutos
  answer: B
  explanation: Se requiere que un conductor con licencia conduzca el vehículo de prueba
    hacia y desde el lugar del examen. Esa persona debe permanecer en el lugar del
    examen hasta que se haya completado la prueba de carretera.
- id: 42
  category: license_system
  question: 'La ley de New Hampshire requiere el permiso por escrito de un padre,
    tutor o adulto responsable para un solicitante de licencia de conducir menor de
    18 años, A MENOS que el solicitante:'
  choices:
    A: Haya completado 50 horas de conducción supervisada
    B: Esté emancipado por matrimonio
    C: Sea dueño de su propio vehículo
    D: Haya tenido una licencia en otro estado
  answer: B
  explanation: A ninguna persona menor de 18 años se le otorgará una licencia de conducir
    a menos que un padre o tutor dé su permiso por escrito, se presente una cobertura
    de seguro o la persona menor de 18 años esté emancipada por matrimonio.
- id: 43
  category: driver_testing
  question: ¿Qué recibirá un solicitante inmediatamente después de aprobar los exámenes
    de licencia de conducir requeridos?
  choices:
    A: Una licencia de conducir de plástico permanente
    B: Una licencia digital de 30 días
    C: Una licencia de conducir temporal de papel por 60 días
    D: Un permiso de Operador Juvenil (Youth Operator)
  answer: C
  explanation: A los solicitantes se les otorgará una licencia de conducir temporal
    de papel por 60 días al aprobar. La licencia permanente se enviará por correo
    en un plazo de 45 días.
- id: 44
  category: safe_driving_rules
  question: ¿Entre qué horas tiene prohibido operar un vehículo motorizado un Operador
    Juvenil (Youth Operator) menor de 18 años?
  choices:
    A: 10:00 pm y 2:00 am
    B: 11:00 pm y 5:00 am
    C: 12:00 am y 6:00 am
    D: 1:00 am y 4:00 am
  answer: D
  explanation: El titular de una Licencia de Operador Juvenil (Youth Operator License)
    que sea menor de 18 años no podrá operar un vehículo motorizado entre las horas
    de 1:00 am y 4:00 am.
- id: 45
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia puede un conductor menor de 18 años usar un teléfono
    celular mientras conduce?
  choices:
    A: Cuando usa un dispositivo de manos libres
    B: Cuando está detenido temporalmente en el tráfico
    C: Para reportar una emergencia al 911
    D: Cuando habla con un padre o tutor
  answer: C
  explanation: Los conductores menores de 18 años no deben usar un dispositivo celular,
    ya sea de manos libres o no, mientras conducen o están detenidos temporalmente,
    excepto para reportar una emergencia al sistema 911 mejorado o a una agencia de
    seguridad pública.
- id: 46
  category: license_system
  question: ¿Cuál es la edad mínima requerida para obtener una Tarjeta de Identificación
    para No Conductores en New Hampshire?
  choices:
    A: 10 años
    B: 12 años
    C: 15 años
    D: 16 años
  answer: B
  explanation: Las Tarjetas de Identificación para No Conductores pueden emitirse
    a residentes de New Hampshire que no posean una licencia de conducir válida y
    que tengan al menos 12 años de edad.
- id: 47
  category: driver_testing
  question: Si se muda a New Hampshire y posee una licencia de conducir válida de
    otro estado, ¿qué examen(es) debe aprobar?
  choices:
    A: Solo un examen de la vista
    B: Exámenes de la vista y de conocimientos
    C: Exámenes de conocimientos y de carretera
    D: Exámenes de la vista, de conocimientos y de carretera
  answer: A
  explanation: Solo se requiere un examen de la vista para los conductores nuevos
    en New Hampshire que posean una licencia de conducir válida de otro estado.
- id: 48
  category: driver_testing
  question: Si la licencia de conducir de otro estado de un solicitante ha estado
    vencida por más de un año, ¿qué debe hacer para obtener una licencia de New Hampshire?
  choices:
    A: Aprobar solo un examen de la vista
    B: Aprobar un examen de la vista y uno de conocimientos
    C: Aprobar un examen de la vista, uno de conocimientos y uno de carretera
    D: Pagar un cargo por demora y aprobar un examen de carretera
  answer: C
  explanation: Si la licencia de conducir de otro estado ha estado vencida por más
    de un año, el solicitante deberá aprobar con éxito los exámenes de la vista, de
    conocimientos y de carretera.
- id: 49
  category: license_system
  question: ¿Cada cuánto tiempo vencen las licencias de conducir de New Hampshire?
  choices:
    A: Cada 3 años en el cumpleaños del conductor
    B: Cada 4 años en el cumpleaños del conductor
    C: Cada 5 años en el cumpleaños del conductor
    D: Cada 10 años en el cumpleaños del conductor
  answer: C
  explanation: Las licencias de conducir de NH vencen en el cumpleaños del solicitante
    cada 5 años.
- id: 50
  category: license_system
  question: ¿Qué grupo tiene derecho a la renovación de la licencia de conducir de
    New Hampshire sin costo alguno?
  choices:
    A: Todos los residentes mayores de 65 años
    B: Miembros de las fuerzas armadas que cumplan con requisitos específicos de servicio
      activo y residencia
    C: Cualquier residente que no haya recibido una multa de tráfico en 10 años
    D: Empleados del gobierno estatal
  answer: B
  explanation: Cualquier persona que sea miembro de las fuerzas armadas por dos o
    más años, y que fuera residente de NH y titular de una licencia válida al momento
    de su inducción/alistamiento, tiene derecho a la renovación sin costo.
- id: 51
  category: penalties_and_points
  question: ¿Bajo la Ley de Operador Juvenil 'Menor de 20' años, cuál es el período
    de suspensión por una primera infracción de vehículo motorizado?
  choices:
    A: 10 a 20 días
    B: 20 a 40 días
    C: 45 a 90 días
    D: 90 a 180 días
  answer: B
  explanation: Por una primera infracción bajo la Ley de Operador Juvenil 'Menor de
    20' años, el período de suspensión o revocación es de un mínimo de 20 días, pero
    no más de 40 días.
- id: 52
  category: penalties_and_points
  question: Para una tercera infracción o subsiguiente bajo la Ley de Operador Juvenil
    'Menor de 20' años, ¿cuál es una condición obligatoria para la restitución de
    la licencia?
  choices:
    A: Pagar una multa de $500
    B: Volver a tomar el examen de conducir
    C: Completar un programa presencial aprobado sobre la actitud del conductor
    D: Realizar 50 horas de servicio comunitario
  answer: C
  explanation: Para una tercera infracción o subsiguiente, una condición para la restitución
    de la licencia también será completar un programa presencial aprobado sobre la
    actitud del conductor.
- id: 53
  category: alcohol_drugs_health
  question: En New Hampshire, se considera que un conductor menor de 21 años está
    legalmente intoxicado si su concentración de alcohol en sangre (BAC) es igual
    o superior a ¿qué nivel?
  choices:
    A: .02%
    B: .04%
    C: .08%
    D: .10%
  answer: A
  explanation: Se considera legalmente intoxicado si la concentración de alcohol en
    sangre de un conductor es de .08% o superior, o de .02% o superior si el conductor
    es menor de 21 años.
- id: 54
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de 'Consentimiento Implícito' de New Hampshire?
  choices:
    A: Usted consiente el registro del vehículo si lo detienen por exceso de velocidad
    B: Usted consiente que se le realicen pruebas de sangre, aliento u orina si es
      arrestado por una infracción relacionada con el alcohol o las drogas
    C: Usted consiente pagar todas las multas de tráfico en un plazo de 30 días
    D: Usted consiente la donación de órganos al recibir la licencia
  answer: B
  explanation: El Consentimiento Implícito significa que se considera que cualquier
    persona que opera un vehículo motorizado en NH ha dado su consentimiento para
    que se le realicen pruebas de sangre, aliento, orina o cualquier combinación de
    estas si es arrestada por una infracción relacionada con el alcohol o las drogas.
- id: 55
  category: penalties_and_points
  question: Si el Director de Vehículos Motorizados considera que una persona es un
    Infractor Habitual, ¿por cuánto tiempo se le revocarán sus privilegios de conducir?
  choices:
    A: 6 meses a 1 año
    B: 1 a 4 años
    C: 5 a 10 años
    D: Permanentemente
  answer: B
  explanation: Si después de una audiencia se considera que una persona es un Infractor
    Habitual, el Director revocará los privilegios de conducir de la persona por un
    período de 1 a 4 años.
- id: 56
  category: penalties_and_points
  question: ¿Cuál es la sanción por ser condenado por conducir después de haber sido
    declarado Infractor Habitual?
  choices:
    A: Una multa de hasta $1,000
    B: Prisión por no menos de un año y hasta cinco años
    C: Servicio comunitario obligatorio por un año
    D: Confiscación permanente del vehículo
  answer: B
  explanation: Si un conductor es condenado por conducir después de haber sido declarado
    Infractor Habitual, esa persona puede estar sujeta a una pena de prisión de no
    menos de un año y hasta cinco (5) años.
- id: 57
  category: safe_driving_rules
  question: 'Durante los primeros seis meses de tener la licencia, un Operador Juvenil
    menor de 18 años NO puede conducir con más de un pasajero menor de 25 años que
    no sea familiar, A MENOS QUE:'
  choices:
    A: Los pasajeros lleven puestos los cinturones de seguridad
    B: Estén conduciendo hacia o desde la escuela
    C: Esté acompañado por un adulto responsable con licencia que tenga al menos 25
      años de edad
    D: Tenga permiso por escrito de un padre o tutor
  answer: C
  explanation: Un Operador Juvenil menor de 18 años no puede conducir con más de un
    pasajero que no sea familiar menor de 25 años durante los primeros seis meses,
    a menos que esté acompañado por un adulto responsable con licencia que tenga al
    menos 25 años de edad.
- id: 58
  category: safe_driving_rules
  question: Si un conductor está obligado a usar lentes correctivos, ¿qué debe evitar
    hacer por la noche?
  choices:
    A: Conducir por carreteras sin iluminación
    B: Usar lentes correctivos oscuros o teñidos
    C: Mirar directamente a los faros que vienen de frente
    D: Conducir por más de dos horas
  answer: B
  explanation: El manual establece que si un conductor está obligado a usar lentes
    correctivos, debe evitar el uso de lentes correctivos oscuros o teñidos por la
    noche.
- id: 59
  category: alcohol_drugs_health
  question: 'Un conductor que ha estado despierto durante 21 horas continuas normalmente
    mostrará niveles de rendimiento similares a los de una persona con una Concentración
    de Alcohol en Sangre (BAC) de:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Según el manual, después de 21 horas sin dormir, el rendimiento de
    un conductor imita un BAC de 0.08%.
- id: 60
  category: safe_driving_rules
  question: Para evitar la fatiga en viajes largos, ¿con qué frecuencia debe un conductor
    planear detenerse para estirarse o tomar una bebida?
  choices:
    A: Al menos cada 2 horas
    B: Al menos cada 4 horas
    C: Solo cuando sientan que se les cierran los ojos
    D: Cada 100 millas
  answer: A
  explanation: El manual recomienda planear detenerse al menos cada 2 horas para estirarse
    o tomar una taza de café o un refresco durante los viajes largos.
- id: 61
  category: safe_driving_rules
  question: ¿Según la ley de New Hampshire, cuál es la presunción si un conductor
    sostiene un teléfono celular en la proximidad inmediata de su oído mientras el
    vehículo está en movimiento?
  choices:
    A: Está escuchando música
    B: Está participando en una llamada
    C: Está usando un sistema de navegación
    D: Está apagando el dispositivo
  answer: B
  explanation: Se presume que un operador de un vehículo motorizado que sostiene un
    teléfono celular en la proximidad inmediata de su oído mientras el vehículo está
    en movimiento está participando en una llamada.
- id: 62
  category: safe_driving_rules
  question: Para los conductores menores de 18 años, ¿cuándo es legal usar un dispositivo
    electrónico móvil mientras conducen?
  choices:
    A: Al usar un dispositivo Bluetooth de manos libres
    B: Cuando están detenidos en un semáforo en rojo
    C: Solo para informar una emergencia al 911 o a una agencia de seguridad pública
    D: Al comunicarse con un padre o tutor legal
  answer: C
  explanation: Los conductores menores de 18 años no deben usar un dispositivo móvil,
    ya sea de manos libres o no, excepto para informar una emergencia al sistema 911
    mejorado o a cualquier agencia de seguridad pública.
- id: 63
  category: safe_driving_rules
  question: ¿Cuál de las siguientes acciones se le permite realizar a un conductor
    mayor de 18 años mientras conduce?
  choices:
    A: Escribir manualmente una dirección en un dispositivo GPS
    B: Leer un mensaje de texto mientras está detenido temporalmente en el tráfico
    C: Usar una mano para transmitir mensajes en un radio de 2 vías no celular
    D: Sostener un teléfono en su oído para responder una llamada rápida
  answer: C
  explanation: Los conductores mayores de 18 años pueden usar una mano para transmitir
    o recibir mensajes en cualquier radio de 2 vías no celular.
- id: 64
  category: defensive_driving
  question: ¿Cuál de los siguientes comportamientos se asocia típicamente con la conducción
    agresiva?
  choices:
    A: Ceder el derecho de paso
    B: Seguir a otro vehículo demasiado de cerca
    C: Detenerse en un semáforo en amarillo
    D: Conducir por debajo del límite de velocidad
  answer: B
  explanation: Los comportamientos típicamente asociados con la conducción agresiva
    incluyen el exceso de velocidad, seguir demasiado de cerca, cambios de carril
    inseguros, señalización inadecuada y no obedecer los dispositivos de control de
    tráfico.
- id: 65
  category: alcohol_drugs_health
  question: ¿A qué nivel de concentración de alcohol en sangre (BAC) se ve afectada
    por primera vez la visión de un conductor?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: A
  explanation: El manual establece que la visión se ve afectada a un .02 de BAC para
    todos los conductores.
- id: 66
  category: alcohol_drugs_health
  question: ¿Bajo qué condición puede un conductor menor de 21 años transportar licores
    o bebidas alcohólicas en un vehículo?
  choices:
    A: Si las bebidas están en el maletero
    B: Si están acompañados por un padre, tutor legal o cónyuge de edad legal
    C: Si los recipientes están cerrados y sellados
    D: Bajo ninguna circunstancia
  answer: B
  explanation: Ningún conductor menor de 21 años transportará ningún licor o bebida
    alcohólica, excepto cuando esté acompañado por un padre, tutor legal o cónyuge
    de edad legal.
- id: 67
  category: alcohol_drugs_health
  question: ¿Qué es lo único que reducirá los efectos del alcohol después de beber?
  choices:
    A: Beber café solo
    B: Comer una comida pesada
    C: Tomar una ducha fría
    D: El tiempo
  answer: D
  explanation: Después de beber, no hay nada que reduzca los efectos del alcohol excepto
    el TIEMPO. El café, la comida, el aire fresco o las duchas frías no contrarrestarán
    los efectos.
- id: 68
  category: alcohol_drugs_health
  question: ¿Aproximadamente cuánto tiempo tarda una onza de alcohol en pasar por
    el cuerpo?
  choices:
    A: 30 minutos
    B: Una hora
    C: Dos horas
    D: Four horas
  answer: B
  explanation: Cada onza de alcohol consumida tarda aproximadamente una hora en pasar
    por el cuerpo.
- id: 69
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por una primera infracción de conducir bajo la
    influencia (DUI) de drogas o alcohol?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $1,500
  answer: B
  explanation: Una condena por primera infracción por conducir bajo la influencia
    resulta en ser culpable de un delito menor de Clase B y una multa no inferior
    a $500.
- id: 70
  category: penalties_and_points
  question: Por una condena de DUI por primera vez, ¿un conductor puede enfrentar
    la pérdida de los privilegios de conducir por qué período de tiempo?
  choices:
    A: 30 a 90 días
    B: 3 a 6 meses
    C: 9 meses a 2 años
    D: 1 a 5 años
  answer: C
  explanation: Una persona condenada por una primera infracción de DUI puede enfrentar
    la pérdida de los privilegios de conducir por un período de 9 meses a 2 años.
- id: 71
  category: alcohol_drugs_health
  question: ¿Cómo pueden los medicamentos de venta libre, como los que se toman para
    el resfriado o las alergias, afectar la capacidad de una persona para conducir?
  choices:
    A: Mejoran el tiempo de reacción
    B: Pueden adormecer al conductor
    C: Aumentan la visión nocturna
    D: Disminuyen la concentración de alcohol en sangre (BAC)
  answer: B
  explanation: Los medicamentos de venta libre tomados para dolores de cabeza, resfriados,
    fiebre del heno u otras alergias, o aquellos para calmar los nervios, pueden adormecer
    al conductor y afectar la capacidad de una persona para conducir.
- id: 72
  category: safe_driving_rules
  question: Según el manual, ¿cuántas horas de sueño necesita la persona promedio
    para mantener un estado de alerta adecuado durante el día?
  choices:
    A: 5 a 6 horas
    B: 6 a 8 horas
    C: 7 a 9 horas
    D: 8 a 10 horas
  answer: C
  explanation: La persona promedio necesita de 7 a 9 horas de sueño para mantener
    un estado de alerta adecuado durante el día.
- id: 73
  category: alcohol_drugs_health
  question: ¿Qué debe hacer un conductor si no está seguro de si es seguro tomar un
    medicamento recetado y conducir?
  choices:
    A: Realizar una prueba de manejo en un estacionamiento vacío para comprobar sus
      reflejos.
    B: Consultar a su médico o farmacéutico sobre cualquier efecto secundario.
    C: Tomar solo la mitad de la dosis recetada antes de conducir.
    D: Beber café para contrarrestar cualquier posible somnolencia.
  answer: B
  explanation: Según el manual, si un conductor no está seguro de si es seguro tomar
    un medicamento y conducir, debe consultar a su médico o farmacéutico sobre cualquier
    efecto secundario.
- id: 74
  category: alcohol_drugs_health
  question: ¿Cuál es una consecuencia potencial de combinar alcohol con otras drogas
    que alteran la capacidad de conducción?
  choices:
    A: Las drogas neutralizarán los efectos de alteración del alcohol.
    B: El estado de alerta del conductor aumentará temporalmente.
    C: Podría multiplicar los efectos del alcohol o tener efectos graves adicionales.
    D: El alcohol se procesará a través del cuerpo a un ritmo más rápido.
  answer: C
  explanation: El manual advierte que un conductor nunca debe beber alcohol mientras
    toma otros medicamentos porque podrían multiplicar los efectos del alcohol o tener
    efectos propios adicionales, afectando gravemente la capacidad de conducir de
    manera segura.
- id: 75
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una forma recomendada de lidiar con emociones
    fuertes antes de conducir?
  choices:
    A: Escuchar música a alto volumen para distraerse de la emoción.
    B: Conducir más rápido para llegar antes a su destino y reducir el estrés.
    C: Dar un breve paseo o tomar una siesta antes de ponerse al volante.
    D: Bajar las ventanillas para que entre aire fresco mientras conduce.
  answer: C
  explanation: El manual sugiere tomarse un tiempo para calmarse antes de ponerse
    al volante, señalando que dar un breve paseo o tomar una siesta antes de conducir
    puede ayudar.
- id: 76
  category: vehicle_information
  question: 'Para ayudar a prevenir la peligrosa situación de dejar a un niño en un
    vehículo caliente, la NHTSA recomienda:'
  choices:
    A: Dejar las ventanillas ligeramente abiertas al estacionar bajo el sol.
    B: Colocar un objeto personal como un bolso o maletín en el asiento trasero.
    C: Estacionar en una zona sombreada siempre que se hagan recados.
    D: Dejar el aire acondicionado encendido mientras se aleja del automóvil.
  answer: B
  explanation: La NHTSA recomienda colocar un objeto personal como un bolso o maletín
    en el asiento trasero como otro recordatorio de mirar antes de cerrar con llave.
- id: 77
  category: vehicle_information
  question: ¿Con qué frecuencia se recomienda que los conductores revisen la presión
    de los neumáticos de su vehículo?
  choices:
    A: Una vez a la semana
    B: Una vez al mes
    C: Cada seis meses
    D: Una vez al año
  answer: B
  explanation: El manual establece que se recomienda que los conductores revisen la
    presión de los neumáticos una vez al mes para prevenir problemas de seguridad
    en la carretera.
- id: 78
  category: safe_driving_rules
  question: Al ajustar el asiento del conductor, ¿cuál es la distancia adecuada que
    debe mantenerse entre el pecho del conductor y el volante?
  choices:
    A: 5 pulgadas
    B: 10 pulgadas
    C: 12 pulgadas
    D: 15 pulgadas
  answer: B
  explanation: El posicionamiento adecuado del asiento incluye asegurar que haya 10
    pulgadas entre el pecho del conductor y el volante.
- id: 79
  category: safe_driving_rules
  question: ¿Cómo deben ajustarse correctamente los reposacabezas (apoyacabezas) de
    un vehículo?
  choices:
    A: De modo que entren en contacto con la parte posterior de la cabeza del conductor,
      pero no por debajo de las orejas.
    B: De modo que descansen cómodamente contra la base del cuello del conductor.
    C: De modo que se sitúen al menos dos pulgadas por encima de la parte superior
      de la cabeza del conductor.
    D: De modo que sostengan la parte superior de los hombros del conductor.
  answer: A
  explanation: Los reposacabezas deben ajustarse de modo que entren en contacto con
    la parte posterior de la cabeza del conductor, pero no por debajo de las orejas,
    para evitar el latigazo cervical en caso de accidente.
- id: 80
  category: defensive_driving
  question: 'Incluso con los espejos ajustados correctamente, un conductor aún debe:'
  choices:
    A: Confiar únicamente en el espejo retrovisor al dar marcha atrás.
    B: Realizar las comprobaciones visuales girando la cabeza (head checks) siempre
      que sea posible.
    C: Instalar espejos de punto ciego adicionales en ambos lados.
    D: Mantener el espejo de día/noche en la posición nocturna en todo momento.
  answer: B
  explanation: El manual señala que incluso los espejos ajustados correctamente no
    eliminarán todos los puntos ciegos, por lo que se deben realizar comprobaciones
    visuales girando la cabeza siempre que sea posible.
- id: 81
  category: safe_driving_rules
  question: 'En New Hampshire, la ley exige el uso de cinturones de seguridad para
    cualquier persona menor de:'
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: En New Hampshire, se requieren cinturones de seguridad para cualquier
    persona menor de 18 años, aunque se recomienda encarecidamente para todas las
    edades.
- id: 82
  category: safe_driving_rules
  question: ¿Cómo debe usarse la parte del cinturón de seguridad que cruza el regazo?
  choices:
    A: Holgado sobre el estómago
    B: Ajustado y alto sobre la cintura
    C: Ajustado y bajo sobre las caderas
    D: Metido debajo de las piernas del conductor
  answer: C
  explanation: El cinturón de regazo debe ajustarse de modo que quede ceñido y bajo
    a través de las caderas del conductor después de abrocharlo para evitar que se
    deslice durante una colisión.
- id: 83
  category: safe_driving_rules
  question: 'Según la ley de New Hampshire, un niño debe estar asegurado en un sistema
    de retención infantil si tiene:'
  choices:
    A: Menos de 7 años y menos de 57 pulgadas de altura.
    B: Menos de 8 años y menos de 60 pulgadas de altura.
    C: Menos de 6 años y menos de 50 pulgadas de altura.
    D: Menos de 5 años independientemente de la altura.
  answer: A
  explanation: Un niño menor de 7 años y de menos de 57 pulgadas de altura debe estar
    debidamente sujeto y asegurado en un sistema de retención infantil.
- id: 84
  category: safe_driving_rules
  question: ¿La ley de New Hampshire exige cascos de motocicleta aprobados por el
    DOT de los EE. UU. para todos los conductores y pasajeros menores de qué edad?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: No hay requisito de edad para los cascos en New Hampshire.
  answer: B
  explanation: La ley de New Hampshire exige que todos los conductores y pasajeros
    menores de 18 años usen cascos aprobados por el Departamento de Transporte de
    los Estados Unidos (DOT).
- id: 85
  category: vehicle_information
  question: ¿Por qué es sumamente importante usar el cinturón de seguridad incluso
    en vehículos equipados con bolsas de aire (air bags)?
  choices:
    A: Las bolsas de aire no se desplegarán si el cinturón de seguridad no está abrochado.
    B: Los cinturones de seguridad ayudan a posicionar correctamente el cuerpo de
      una persona para maximizar los beneficios de la bolsa de aire.
    C: Las bolsas de aire solo protegen la mitad inferior del cuerpo durante una colisión.
    D: Los cinturones de seguridad evitan que las bolsas de aire se desplieguen demasiado
      rápido.
  answer: B
  explanation: Los cinturones de seguridad ayudan a posicionar correctamente el cuerpo
    de una persona para maximizar los beneficios de la bolsa de aire y ayudan a sujetar
    a la persona durante la colisión inicial y cualquier colisión posterior.
- id: 86
  category: driver_responsibility
  question: ¿Cuándo se considera que una carga está bien sujeta en un vehículo?
  choices:
    A: Cuando está atada con al menos dos cuerdas elásticas (bungee cords).
    B: Cuando el conductor puede ver la carga claramente en el espejo retrovisor.
    C: Cuando nada puede deslizarse, desplazarse, caerse, filtrarse hacia la calzada
      o salir volando.
    D: Cuando la carga pesa menos de 500 libras.
  answer: C
  explanation: Una carga debe estar bien sujeta y solo se considera segura cuando
    nada puede deslizarse, desplazarse, caerse o filtrarse hacia la calzada, ni salir
    volando.
- id: 87
  category: penalties_and_points
  question: Según la Ley de Jessica (Jessica's Law), ¿cuál es la multa por una primera
    infracción por no limpiar la nieve y el hielo de un vehículo, lo que resulta en
    una conducción negligente?
  choices:
    A: $50.00 a $100.00
    B: $100.00 a $250.00
    C: $250.00 a $500.00
    D: $500.00 a $1,000.00
  answer: C
  explanation: De conformidad con RSA 265:79-b, si un vehículo pone en peligro a personas
    o propiedades debido a la nieve y el hielo no retirados, las multas por esta infracción
    pueden ser de $250.00 a $500.00 por la primera infracción.
- id: 88
  category: penalties_and_points
  question: ¿Cuál es la multa potencial por una primera infracción de conducción negligente
    en New Hampshire?
  choices:
    A: $100.00 a $250.00
    B: $250.00 a $500.00
    C: $500.00 a $1,000.00
    D: $1,000.00 a $2,000.00
  answer: B
  explanation: Según el manual, las multas por una primera infracción de conducción
    negligente pueden ser de $250.00 a $500.00.
- id: 89
  category: safe_driving_rules
  question: ¿Cuáles son las posiciones recomendadas de las manos en el volante?
  choices:
    A: Las 10 y las 2, o las 9 y las 3
    B: Las 11 y la 1, o las 8 y las 4
    C: Las 9 y las 3, o las 8 y las 4
    D: Las 10 y las 2, o las 7 y las 5
  answer: C
  explanation: El manual establece que las manos de los conductores deben estar en
    las posiciones de las 9 y las 3, o de las 8 y las 4.
- id: 90
  category: safe_driving_rules
  question: Cuando dos vehículos se aproximan a una intersección no controlada al
    mismo tiempo, ¿quién debe ceder el paso?
  choices:
    A: El vehículo de la derecha debe ceder el paso al vehículo de la izquierda.
    B: El vehículo de la izquierda debe ceder el paso al vehículo de la derecha.
    C: El vehículo más grande siempre tiene el derecho de paso.
    D: El vehículo que viaja a una velocidad más rápida tiene el derecho de paso.
  answer: B
  explanation: La ley de NH establece que el conductor de un vehículo que se aproxima
    o entra en una intersección por la izquierda debe ceder el paso al vehículo de
    la derecha.
- id: 91
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor cuando se le aproxima un vehículo de emergencia
    que hace sonar una sirena o tiene luces intermitentes encendidas?
  choices:
    A: Detenerse inmediatamente donde se encuentre el vehículo, incluso en una intersección.
    B: Acelerar para despejar el camino al vehículo de emergencia.
    C: Dirigirse inmediatamente al lado derecho de la carretera y detenerse hasta
      que el vehículo de emergencia haya pasado.
    D: Detenerse en el lado izquierdo de la carretera y reducir la velocidad.
  answer: C
  explanation: Los conductores deben dirigirse inmediatamente al lado derecho de la
    carretera y detener el vehículo hasta que la emergencia haya pasado, evitando
    bloquear una intersección.
- id: 92
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en cualquier distrito comercial
    o de residencia urbana en New Hampshire?
  choices:
    A: 25 millas por hora
    B: 30 millas por hora
    C: 35 millas por hora
    D: 45 millas por hora
  answer: B
  explanation: El límite de velocidad máximo es de 30 millas por hora en cualquier
    distrito comercial o de residencia urbana.
- id: 93
  category: safe_driving_rules
  question: A menos que las condiciones de la carretera y el clima lo hagan inseguro,
    ¿cuál es la velocidad mínima a la que puede conducir en una autopista interestatal?
  choices:
    A: 40 mph
    B: 45 mph
    C: 50 mph
    D: 55 mph
  answer: B
  explanation: La velocidad mínima a la que puede conducir en una autopista interestatal
    es de 45 mph, a menos que las condiciones de la carretera y el clima sean tan
    malas que esta velocidad sea insegura.
- id: 94
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en una zona escolar señalizada durante
    las horas escolares especificadas?
  choices:
    A: 15 mph
    B: 20 mph
    C: 10 mph por debajo del límite de velocidad habitual señalizado
    D: 15 mph por debajo del límite de velocidad habitual señalizado
  answer: C
  explanation: En una zona escolar señalizada, el límite de velocidad es de 10 millas
    por hora (mph) por debajo del límite de velocidad habitual señalizado desde 45
    minutos antes de la apertura de la escuela hasta la apertura, y desde el cierre
    hasta 45 minutos después del cierre.
- id: 95
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe un conductor hacer la señal antes de cambiar
    de carril o salir de una autopista?
  choices:
    A: Al menos 100 pies
    B: Al menos 200 pies
    C: Al menos 300 pies
    D: Al menos 500 pies
  answer: D
  explanation: En la autopista, los conductores deben hacer la señal al menos 500
    pies antes de cambiar de carril o salir de la calzada.
- id: 96
  category: safe_driving_rules
  question: Por ley, ¿durante qué período de tiempo debe cada vehículo motorizado
    mostrar luces encendidas (faros delanteros)?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Desde 1/2 hora después del atardecer hasta 1/2 hora antes del amanecer
    C: Desde 1 hora después del atardecer hasta 1 hora antes del amanecer
    D: Solo cuando está completamente oscuro afuera
  answer: B
  explanation: La ley de New Hampshire exige que todo vehículo motorizado conducido
    durante el período comprendido entre 1/2 hora después del atardecer y 1/2 hora
    antes del amanecer muestre luces encendidas.
- id: 97
  category: safe_driving_rules
  question: 'Los faros delanteros deben encenderse cuando la lluvia, la nieve o la
    niebla impiden ver claramente a personas y vehículos a una distancia de:'
  choices:
    A: 500 pies adelante
    B: 1000 pies adelante
    C: 1500 pies adelante
    D: 2000 pies adelante
  answer: B
  explanation: Se requieren faros delanteros siempre que la lluvia, la nieve o la
    niebla interfieran con la visión adecuada de la carretera, de modo que las personas
    y los vehículos no sean claramente visibles a una distancia de 1000 pies adelante.
- id: 98
  category: sharing_the_road
  question: ¿En cuál de las siguientes situaciones debe un conductor EVITAR el uso
    de la bocina de su vehículo?
  choices:
    A: Cuando un ciclista comienza a moverse hacia el carril del conductor
    B: Cuando otro conductor cruza la línea central hacia el carril del conductor
    C: Cuando esté cerca de peatones ciegos o al acercarse a un caballo
    D: Cuando un conductor que retrocede no se da cuenta de que se aproxima un vehículo
  answer: C
  explanation: Los conductores no deben usar la bocina cuando estén cerca de peatones
    ciegos o cuando se acerquen o estén cerca de un caballo, ya que esto puede asustar
    al caballo y causar un choque.
- id: 99
  category: defensive_driving
  question: ¿Cómo afecta el duplicar la velocidad de un vehículo a su distancia de
    frenado?
  choices:
    A: La distancia de frenado se duplica.
    B: La distancia de frenado se triplica.
    C: La distancia de frenado aumenta 4 veces.
    D: La distancia de frenado permanece igual.
  answer: C
  explanation: El manual establece que la distancia de frenado de un vehículo aumenta
    4 veces cuando se duplica la velocidad del vehículo.
- id: 100
  category: defensive_driving
  question: ¿Cuál es el tiempo de percepción promedio para que un conductor alerta
    reconozca que debe detenerse?
  choices:
    A: 1/4 a 1/2 segundo
    B: 1/2 a 3/4 segundo
    C: 3/4 segundo a 1 segundo
    D: 1 a 2 segundos
  answer: C
  explanation: El tiempo de percepción promedio para un conductor alerta es de 3/4
    de segundo a 1 segundo.
- id: 101
  category: defensive_driving
  question: 'Para evitar seguir a otro vehículo demasiado cerca (tailgating), los
    conductores deben mantener una distancia de seguimiento mínima de al menos:'
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: C
  explanation: Por razones de seguridad, los conductores deben evitar circular más
    cerca de un vehículo con una distancia de seguimiento inferior a cuatro segundos.
- id: 102
  category: sharing_the_road
  question: ¿Cómo debe interactuar un conductor con un cortejo fúnebre?
  choices:
    A: Rebasar los vehículos individualmente lo más rápido posible.
    B: Tocar la bocina para avisar al cortejo que está pasando.
    C: Ceder el paso solo al coche fúnebre y luego avanzar a través del cortejo.
    D: Permitir que los vehículos que llevan las luces delanteras encendidas mientras
      siguen a un coche fúnebre pasen como grupo.
  answer: D
  explanation: Los conductores deben permitir que los vehículos que llevan las luces
    delanteras encendidas mientras siguen a un coche fúnebre pasen como grupo.
- id: 103
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿cuándo es seguro regresar a su carril?
  choices:
    A: Tan pronto como esté por delante del parachoques delantero del vehículo
    B: Cuando pueda ver la parte delantera completa del vehículo rebasado en su espejo
      retrovisor
    C: Cuando esté a una distancia de un automóvil por delante del vehículo rebasado
    D: Cuando el conductor del vehículo rebasado haga parpadear sus luces delanteras
  answer: B
  explanation: El manual establece que al rebasar, debe continuar hasta que la parte
    delantera completa del vehículo rebasado sea visible en el espejo retrovisor antes
    de señalizar y regresar al carril.
- id: 104
  category: sharing_the_road
  question: ¿Cuál es el procedimiento adecuado cuando otro vehículo lo está rebasando?
  choices:
    A: Aumentar su velocidad para quitarse de su camino
    B: Moverse al acotamiento para darles más espacio
    C: Mantener una velocidad constante y permanecer en su carril
    D: Frenar bruscamente para dejar que pasen rápido
  answer: C
  explanation: Cuando lo estén rebasando, los conductores deben permanecer en el carril
    por el que circulan, mantener una velocidad constante para permitir que el conductor
    pase y nunca aumentar la velocidad para evitar que alguien lo rebase.
- id: 105
  category: vehicle_information
  question: Según el manual, ¿cómo deben usarse las cámaras de reversa al retroceder?
  choices:
    A: Como la herramienta principal para retroceder de manera segura
    B: En conjunto con los espejos y las verificaciones visuales adecuadas girando
      la cabeza
    C: Solo al retroceder de noche
    D: En lugar de mirar por encima del hombro
  answer: B
  explanation: El manual señala que las cámaras de reversa pueden ayudar a los conductores
    a retroceder de manera segura cuando se usan en conjunto con los espejos y las
    verificaciones visuales adecuadas, pero nunca deben usarse como la herramienta
    principal para retroceder con seguridad.
- id: 106
  category: safe_driving_rules
  question: Al tomar una curva en la carretera, ¿cuándo debe reducir su velocidad?
  choices:
    A: Antes de entrar en la curva
    B: Mientras está en medio de la curva
    C: Solo si comienza a perder tracción
    D: Justo al salir de la curva
  answer: A
  explanation: Los conductores siempre deben reducir la velocidad a un nivel seguro
    antes de entrar en la curva. Frenar bruscamente después de entrar en una curva
    podría causar que los neumáticos del vehículo pierdan tracción.
- id: 107
  category: defensive_driving
  question: ¿Cuál es la mejor manera de evitar la pérdida de tracción por hidroplaneo
    (hydroplaning)?
  choices:
    A: Girar el volante bruscamente de un lado a otro
    B: Aplicar los frenos con firmeza y rapidez
    C: Acelerar para atravesar el agua
    D: Reducir la velocidad bajo la lluvia o cuando la carretera esté mojada
  answer: D
  explanation: La mejor manera de evitar la pérdida de tracción por hidroplaneo es
    reducir la velocidad bajo la lluvia o cuando la carretera esté mojada con agua
    estancada o charcos.
- id: 108
  category: safe_driving_rules
  question: ¿Quién tiene generalmente el derecho de paso en un puente estrecho o de
    un solo carril?
  choices:
    A: El vehículo más grande
    B: El vehículo que viaja a una velocidad mayor
    C: El primer conductor en llegar al puente
    D: El vehículo que viaja cuesta arriba
  answer: C
  explanation: Al acercarse a puentes estrechos y de un solo carril, los conductores
    deben turnarse para cruzar; generalmente, el primer conductor que llega al puente
    tiene el derecho de paso.
- id: 109
  category: defensive_driving
  question: ¿Cómo debe actuar un conductor al circular sobre rejillas abiertas de
    puentes o puentes de acero?
  choices:
    A: Aumentar la velocidad para cruzar lo más rápido posible
    B: Reducir la velocidad, aumentar la distancia de seguimiento y mantener el volante
      sujeto con firmeza
    C: Virar suavemente para mantener la tracción de los neumáticos
    D: Aplicar los frenos continuamente mientras cruza
  answer: B
  explanation: Las rejillas abiertas de los puentes o los puentes de acero pueden
    reducir la tracción. Los conductores deben reducir la velocidad, aumentar la distancia
    de seguimiento y mantener el volante sujeto con firmeza.
- id: 110
  category: defensive_driving
  question: ¿Qué debe hacer si un vehículo que viene en sentido contrario circula
    con las luces altas encendidas?
  choices:
    A: Hacer parpadear sus luces altas continuamente hasta que ellos bajen las suyas
    B: Mirar directamente a sus luces delanteras para juzgar su distancia
    C: Mirar hacia el lado derecho de la carretera
    D: Cerrar un ojo para preservar su visión nocturna
  answer: C
  explanation: Si un vehículo que viene en dirección opuesta circula con las luces
    altas encendidas, mire hacia el lado derecho de la carretera (como la línea de
    niebla o el borde de la calzada) para evitar distraerse o quedar momentáneamente
    cegado.
- id: 111
  category: safe_driving_rules
  question: ¿Qué luces delanteras debe usar al conducir con niebla, lluvia o nieve?
  choices:
    A: Luces altas para atravesar las condiciones climáticas
    B: Luces bajas, porque las luces altas pueden causar deslumbramiento
    C: Solo las luces de estacionamiento
    D: Luces de emergencia combinadas con luces altas
  answer: B
  explanation: En condiciones de niebla, lluvia o nieve, use las luces bajas. La luz
    de las luces altas puede causar deslumbramiento y dificultar la visión hacia adelante.
- id: 112
  category: defensive_driving
  question: ¿Cuánto debe aumentar su distancia de seguimiento al conducir por carreteras
    desconocidas por la noche?
  choices:
    A: Por al menos un segundo adicional
    B: Por al menos dos segundos adicionales
    C: Por al menos tres segundos adicionales
    D: Por al menos cuatro segundos adicionales
  answer: B
  explanation: Los conductores deben aumentar su distancia de seguimiento agregando
    al menos un segundo adicional para las condiciones de conducción nocturna y al
    menos dos segundos adicionales para conducir en carreteras desconocidas por la
    noche.
- id: 113
  category: vehicle_information
  question: ¿Qué significa que la mayoría de los sistemas de advertencia de los vehículos
    sean "pasivos"?
  choices:
    A: Aplican automáticamente los frenos para evitar una colisión
    B: Toman el control del volante durante una emergencia
    C: Advierten al conductor sobre un problema potencial pero no previenen automáticamente
      el problema
    D: Solo funcionan cuando el vehículo viaja a menos de 30 mph
  answer: C
  explanation: La mayoría de estas tecnologías son pasivas, lo que significa que advierten
    al conductor sobre un problema potencial, pero no previenen automáticamente un
    problema o colisión. Es posible que el conductor deba realizar cambios en la operación
    del vehículo.
- id: 114
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones está prohibido rebasar a otro vehículo?
  choices:
    A: En una carretera de varios carriles
    B: Cuando el vehículo de adelante viaja por debajo del límite de velocidad
    C: Antes de un cruce de carretera y ferrocarril o un puente
    D: Cuando tiene una vista despejada del camino por delante
  answer: C
  explanation: No intente rebasar cuando se acerque un vehículo en sentido contrario,
    cuando la vista esté bloqueada por una curva o una colina, en intersecciones,
    o antes de un cruce de carretera y ferrocarril o un puente.
- id: 115
  category: defensive_driving
  question: ¿Cómo debe acercarse a una intersección no controlada en un camino rural?
  choices:
    A: Mantenga su velocidad ya que usted tiene el derecho de paso
    B: Acelere para despejar la intersección rápidamente
    C: Toque la bocina y avance sin detenerse
    D: Reduzca la velocidad y esté preparado para detenerse ante el tráfico que cruza
      o que viene en sentido contrario
  answer: D
  explanation: Al acercarse a una intersección rural no controlada, reduzca la velocidad
    y esté preparado para detenerse ante el tráfico que cruza o que viene en sentido
    contrario, ya que estas intersecciones pueden ser muy peligrosas.
- id: 116
  category: safe_driving_rules
  question: ¿Qué luces delanteras debe usar cuando sigue a otro vehículo por la noche?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces antiniebla
    D: Luces de circulación diurna
  answer: B
  explanation: El manual establece explícitamente que se deben usar las luces bajas
    al seguir a otro vehículo por la noche.
- id: 117
  category: vehicle_information
  question: ¿Cuál es una limitación de un sistema de advertencia de colisión frontal?
  choices:
    A: No frenará automáticamente por el conductor
    B: Solo funciona cuando el vehículo está en reversa
    C: No puede detectar objetos estacionarios
    D: Reemplaza la necesidad de mirar a través del parabrisas
  answer: A
  explanation: Un sistema de advertencia de colisión frontal alerta a los conductores
    sobre una colisión inminente, pero la advertencia por sí sola no frenará automáticamente
    por el conductor.
- id: 118
  category: safe_driving_rules
  question: Si se acerca a una intersección con un semáforo en rojo, pero un oficial
    de policía le indica que avance, ¿qué debe hacer?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde.
    B: Tratar la intersección como una parada de cuatro vías.
    C: Obedecer al oficial de policía y avanzar.
    D: Ceder el paso al semáforo primero y luego seguir las instrucciones del oficial.
  answer: C
  explanation: 'El manual establece: ''Un oficial de policía que dirige el tráfico
    prevalece sobre cualquier semáforo o señal de tráfico y debe ser obedecido''.'
- id: 119
  category: signs_and_signals
  question: ¿Bajo qué condición se le permite a un conductor dar vuelta a la derecha
    con un semáforo en rojo continuo?
  choices:
    A: Solo cuando también está iluminada una flecha verde.
    B: En cualquier momento, sin tener que detenerse por completo primero.
    C: Solo si no hay una señal que prohíba la vuelta a la derecha en rojo.
    D: Las vueltas a la derecha en rojo nunca están permitidas.
  answer: C
  explanation: 'El manual señala una excepción para las luces rojas continuas: ''Los
    conductores pueden dar vuelta a la derecha con una señal roja SOLO SI no hay una
    señal que prohíba la vuelta a la derecha en rojo''.'
- id: 120
  category: signs_and_signals
  question: ¿Qué acción debe tomar un conductor al acercarse a una luz roja intermitente?
  choices:
    A: Reducir la velocidad y avanzar con precaución.
    B: Detenerse por completo antes de avanzar y ceder cualquier derecho de paso.
    C: Detenerse solo si hay peatones en el cruce peatonal.
    D: Tratar la luz como una señal de ceder el paso y avanzar sin detenerse si el
      camino está despejado.
  answer: B
  explanation: 'Para una luz roja intermitente, el manual establece: ''Los conductores
    deben detenerse por completo detrás de una línea de parada, cruce peatonal o intersección
    antes de avanzar a través de la intersección, cediendo cualquier derecho de paso''.'
- id: 121
  category: signs_and_signals
  question: ¿Qué tipo de información indica una señal de tráfico de color marrón?
  choices:
    A: Servicios para el conductor
    B: Advertencia general
    C: Guía turística y recreativa
    D: Gestión de incidentes
  answer: C
  explanation: Según la sección de colores estándar del manual, las señales marrones
    se utilizan para 'Guía turística y recreativa'.
- id: 122
  category: signs_and_signals
  question: ¿De qué advierte al conductor una señal en forma de banderín (triángulo
    lateral)?
  choices:
    A: Una zona escolar y cruce escolar
    B: Zonas de no rebasar más adelante
    C: Una señal de ceder el paso próxima
    D: Advertencia anticipada de un cruce de ferrocarril
  answer: B
  explanation: El manual establece que una señal de banderín (triángulo lateral) se
    encuentra en el lado izquierdo de la carretera y 'advierte al conductor sobre
    zonas de no rebasar más adelante'.
- id: 123
  category: signs_and_signals
  question: ¿Qué color de señal se utiliza específicamente para la gestión de incidentes?
  choices:
    A: Naranja
    B: Púrpura
    C: Rosa
    D: Azul
  answer: C
  explanation: La lista de colores estándar del manual especifica que el Rosa se utiliza
    para la 'Gestión de incidentes'.
- id: 124
  category: signs_and_signals
  question: 'Una señal de carretera en forma de pentágono (5 lados) se utiliza para
    indicar:'
  choices:
    A: Una señal de alto
    B: Un cruce de ferrocarril
    C: Una zona escolar y cruce escolar
    D: Regulaciones o direcciones de tráfico
  answer: C
  explanation: Según la sección de formas estándar, un pentágono (5 lados) indica
    una 'Zona escolar y cruce escolar'.
- id: 125
  category: safe_driving_rules
  question: Cuando un tren se aproxima a un cruce de ferrocarril, ¿dónde debe detener
    su vehículo el conductor?
  choices:
    A: No a menos de 10 pies, ni a más de 30 pies del riel más cercano.
    B: No a menos de 15 pies, ni a más de 50 pies del riel más cercano.
    C: Exactamente a 25 pies del riel más cercano.
    D: No a menos de 5 pies, ni a más de 20 pies del riel más cercano.
  answer: B
  explanation: 'El manual establece: ''Cuando un tren o vehículo ferroviario se aproxima
    a la intersección, el conductor debe detenerse detrás de la línea de parada o
    a no menos de 15 pies, ni a más de 50 pies del riel más cercano de la vía''.'
- id: 126
  category: sharing_the_road
  question: ¿Cuáles de los siguientes vehículos están obligados por ley a detenerse
    antes de CUALQUIER cruce de ferrocarril, incluso si no hay señales de que se acerque
    un tren?
  choices:
    A: Automóviles de pasajeros y motocicletas
    B: Grúas y vehículos de emergencia
    C: Autobuses que transportan pasajeros y camiones que transportan material inflamable
      o peligroso
    D: Cualquier vehículo que remolque un tráiler o bote
  answer: C
  explanation: 'El manual especifica: ''La ley exige que los autobuses que transportan
    pasajeros y los camiones que transportan material inflamable o peligroso se detengan
    antes de cualquier cruce de ferrocarril, incluso si no hay señales de que se acerque
    un tren''.'
- id: 127
  category: signs_and_signals
  question: ¿Qué indica una ruta interestatal de tres números con un primer número
    par?
  choices:
    A: La ruta entra en una ciudad.
    B: La ruta atraviesa o rodea una ciudad.
    C: La ruta es de norte a sur.
    D: La ruta es una ruta estatal, no una interestatal.
  answer: B
  explanation: Según la sección de señales de número de ruta, 'Las rutas de tres números
    con un primer número par atraviesan o rodean una ciudad'.
- id: 128
  category: signs_and_signals
  question: ¿Qué indican las señales de límite de velocidad en blanco y negro?
  choices:
    A: La velocidad mínima permitida en la calzada.
    B: La velocidad recomendada durante el mal tiempo.
    C: La velocidad legal máxima permitida en condiciones ideales.
    D: El límite de velocidad solo para vehículos comerciales.
  answer: C
  explanation: El manual establece que las señales de límite de velocidad son señales
    en blanco y negro que 'indican la velocidad legal máxima permitida en condiciones
    ideales'.
- id: 129
  category: signs_and_signals
  question: ¿Cuál es el uso adecuado de un carril central compartido?
  choices:
    A: Está reservado para rebasar vehículos más lentos.
    B: Se utiliza para el tráfico directo durante la hora pico.
    C: Está reservado para vehículos que giran a la izquierda desde cualquier dirección.
    D: Es un carril designado solo para vehículos de emergencia.
  answer: C
  explanation: El manual explica que una señal de Carril Central Compartido Solo para
    Girar a la Izquierda 'le indica al conductor dónde un carril está reservado para
    el uso de vehículos que giran a la izquierda desde cualquier dirección y no debe
    usarse para el tráfico directo o para rebasar a otros vehículos'.
- id: 130
  category: safe_driving_rules
  question: Una vez que la intersección esté despejada en un cruce de ferrocarril,
    ¿cómo debe proceder el conductor a través de las vías?
  choices:
    A: Mirar a ambos lados y cruzar las vías rápidamente, sin detenerse.
    B: Detenerse a mitad del camino para revisar si vienen trenes nuevamente.
    C: Cambiar de marcha mientras cruza las vías para mantener la velocidad.
    D: Cruzar lentamente para evitar dañar la suspensión del vehículo.
  answer: A
  explanation: 'El manual instruye: ''Cuando la intersección esté despejada, los conductores
    deben mirar a ambos lados y cruzar las vías rápidamente, sin detenerse''.'
- id: 131
  category: signs_and_signals
  question: ¿Cuáles son las características típicas de forma y color de las señales
    de zona de obras?
  choices:
    A: Forma redonda, amarilla con letras negras.
    B: Forma de diamante o rectangular, naranja con letras o símbolos negros.
    C: Forma de octágono, roja con letras blancas.
    D: Forma cuadrada, azul con símbolos blancos.
  answer: B
  explanation: El manual establece que las señales de zona de obras "generalmente
    tienen forma de diamante o rectangular y son de color naranja con letras o símbolos
    negros".
- id: 132
  category: penalties_and_points
  question: ¿Qué puede suceder con las multas de tráfico en una zona de obras?
  choices:
    A: Se exoneran si no hay trabajadores presentes.
    B: Se reducen a la mitad.
    C: Pueden duplicarse si está claramente señalizado.
    D: Siguen siendo las mismas que en las carreteras normales.
  answer: C
  explanation: Según el manual, las multas pueden duplicarse en una zona de obras;
    sin embargo, esto estará claramente señalizado antes de entrar en la zona de obras.
- id: 133
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas simples y discontinuas (punteadas) en
    la calzada?
  choices:
    A: El tráfico se mueve en direcciones opuestas.
    B: Los carriles de tráfico se mueven en la misma dirección y se permite rebasar.
    C: El carril es un carril central compartido para girar.
    D: Rebasar está estrictamente prohibido.
  answer: B
  explanation: Las líneas blancas significan que los carriles de tráfico se mueven
    en la misma dirección, y los conductores pueden rebasar a otros vehículos sobre
    las líneas discontinuas (punteadas) cuando sea seguro hacerlo.
- id: 134
  category: signs_and_signals
  question: ¿De qué color es la línea de marcación del borde en el lado izquierdo
    de una carretera de un solo sentido?
  choices:
    A: Blanco
    B: Rojo
    C: Amarillo
    D: Verde
  answer: C
  explanation: El manual establece que la línea de marcación del borde es amarilla
    en los bordes izquierdos de las carreteras de un solo sentido.
- id: 135
  category: safe_driving_rules
  question: ¿Dónde debe detenerse un conductor en una intersección si no hay una línea
    de parada blanca pero hay un paso de peatones presente?
  choices:
    A: Antes de entrar en la intersección
    B: En medio del paso de peatones
    C: Antes del paso de peatones
    D: Después del paso de peatones
  answer: C
  explanation: Si no hay una línea de parada blanca pero solo hay un paso de peatones
    presente, los conductores deben detenerse antes del paso de peatones.
- id: 136
  category: sharing_the_road
  question: ¿Cuándo están obligados los conductores a ceder el paso a los peatones
    que cruzan la carretera?
  choices:
    A: Solo cuando hay un guardia de cruce presente
    B: Solo en pasos de peatones marcados
    C: En pasos de peatones marcados o en intersecciones incluso si no existen líneas
      de paso de peatones
    D: Solo si el peatón tiene una señal de caminar
  answer: C
  explanation: Los conductores están obligados a ceder el paso a los peatones que
    cruzan la carretera en pasos de peatones marcados o en intersecciones, incluso
    si no existen líneas de paso de peatones en la intersección.
- id: 137
  category: safe_driving_rules
  question: ¿Para qué está reservado un carril central compartido para girar?
  choices:
    A: Rebasar vehículos más lentos
    B: Vehículos que giran a la izquierda desde cualquier dirección
    C: Tráfico directo
    D: Solo vehículos de emergencia
  answer: B
  explanation: Los carriles centrales compartidos son solo para giros a la izquierda.
    Este carril está reservado para el uso de vehículos que giran a la izquierda desde
    cualquier dirección y no debe usarse para el tráfico directo o para rebasar.
- id: 138
  category: safe_driving_rules
  question: ¿Cuál es una regla de seguridad importante para los conductores que utilizan
    los carriles de peaje E-ZPass?
  choices:
    A: Detenerse por completo antes de continuar
    B: Obedecer los límites de velocidad publicados, pero no detenerse
    C: Retroceder si el transpondedor no realiza la lectura
    D: Salir del vehículo para revisar el transpondedor
  answer: B
  explanation: La información de seguridad importante para los carriles de peaje E-ZPass
    establece que los conductores deben obedecer los límites de velocidad publicados
    en los carriles de peaje, pero no deben detenerse.
- id: 139
  category: safe_driving_rules
  question: 'Al realizar un giro a la derecha, un conductor debe:'
  choices:
    A: Abrirse hacia la izquierda antes de realizar el giro
    B: Girar desde la parte más a la izquierda del carril
    C: Evitar abrirse hacia la izquierda antes de realizar el giro
    D: Acelerar rápidamente a través de la intersección
  answer: C
  explanation: Antes de realizar un giro a la derecha, los conductores deben evitar
    abrirse hacia la izquierda antes de realizar el giro y siempre girar a la derecha
    desde la parte más a la derecha del carril.
- id: 140
  category: safe_driving_rules
  question: ¿Qué debe hacer un conductor si se pasa de una salida en una carretera
    dividida?
  choices:
    A: Detenerse y retroceder en el arcén
    B: Hacer un giro en U a través de la mediana
    C: Encender las luces de emergencia y retroceder en el carril derecho
    D: Conducir hasta la siguiente salida para cambiar de dirección
  answer: D
  explanation: Si un conductor se pasa de una salida en una carretera dividida, debe
    conducir hasta la siguiente salida para cambiar de dirección. Los conductores
    nunca deben detenerse, retroceder ni intentar dar la vuelta.
- id: 141
  category: safe_driving_rules
  question: ¿Cuándo es apropiado realizar un giro de tres puntos?
  choices:
    A: En una autopista dividida cuando se pasa de largo una salida
    B: Solo cuando el camino o la calle es demasiado estrecho para hacer un giro en
      U en una calzada de dos carriles
    C: En un carril central compartido para girar
    D: En una intersección de cuatro vías muy transitada
  answer: B
  explanation: Los conductores deben usar un giro de tres puntos solo cuando el camino
    o la calle es demasiado estrecho para hacer un giro en U. Este tipo de giro solo
    debe usarse en una calzada de dos carriles.
- id: 142
  category: defensive_driving
  question: Antes de avanzar después de detenerse en una intersección, ¿en qué dirección
    se recomienda que miren los conductores?
  choices:
    A: Derecha, luego izquierda
    B: Izquierda, luego derecha y otra vez a la izquierda
    C: Solo hacia adelante
    D: Solo a la izquierda
  answer: B
  explanation: Se recomienda que los conductores miren a la izquierda, luego a la
    derecha y otra vez a la izquierda antes de entrar en la intersección.
- id: 143
  category: defensive_driving
  question: ¿Por qué un conductor NO debe girar hacia un carril delante de otro vehículo
    solo porque ese vehículo tiene una señal de giro activa?
  choices:
    A: La señal de giro podría estar rota y parpadear rápidamente
    B: El conductor puede planear girar después de pasar la intersección o haber olvidado
      apagar la señal
    C: El vehículo podría ser un auto de policía encubierto
    D: Las señales de giro no se aplican en las intersecciones
  answer: B
  explanation: El conductor con una señal de giro activa puede planear girar después
    de pasar la intersección en la que se encuentra el otro conductor, o puede haber
    olvidado apagar la señal de un giro anterior.
- id: 144
  category: signs_and_signals
  question: ¿Qué indica una línea blanca continua entre los carriles de tráfico?
  choices:
    A: Los conductores pueden rebasar si es seguro hacerlo
    B: Se prohíbe a los conductores cambiar de carril o rebasar a otro vehículo
    C: El carril está reservado solo para giros a la izquierda
    D: El tráfico se mueve en direcciones opuestas
  answer: B
  explanation: 'Líneas blancas continuas: Se prohíbe a los conductores cambiar de
    carril o rebasar a otro vehículo.'
- id: 145
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una regla de seguridad para los carriles de
    peaje de solo efectivo?
  choices:
    A: No se detenga por completo
    B: Nunca retroceda ni invierta la dirección en una plaza de peaje
    C: Salga de su vehículo para entregar el peaje al asistente
    D: Los límites de velocidad no se aplican dentro de la plaza de peaje
  answer: B
  explanation: La información de seguridad importante para los carriles de peaje de
    solo efectivo establece que los conductores nunca deben retroceder ni invertir
    la dirección en una plaza de peaje, deben detenerse por completo y no deben salir
    del vehículo.
- id: 146
  category: vehicle_information
  question: Al realizar un giro de dos puntos en reversa usando una entrada para autos
    (driveway), ¿hacia qué dirección debe girar el volante el conductor mientras retrocede
    lentamente?
  choices:
    A: Rápidamente todo hacia la izquierda
    B: Rápidamente todo hacia la derecha
    C: Mantener el volante perfectamente recto
    D: Girar a la izquierda, luego a la derecha
  answer: B
  explanation: Durante un giro de dos puntos en reversa, mientras retrocede lentamente,
    el conductor debe girar el volante rápidamente todo hacia la derecha.
- id: 147
  category: safe_driving_rules
  question: ¿Qué debe hacer si se encuentra dentro de una rotonda y se aproxima un
    vehículo de emergencia?
  choices:
    A: Detenerse inmediatamente dentro de la rotonda para dejarlo pasar.
    B: Avanzar y salir de la rotonda, luego hacerse a un lado a la derecha.
    C: Hacerse a un lado a la izquierda de la rotonda.
    D: Acelerar y continuar circulando hasta que pase el vehículo de emergencia.
  answer: B
  explanation: 'El manual establece: ''Nunca se detenga mientras esté dentro de la
    rotonda. En su lugar, avance y salga de la rotonda, hágase a un lado a la derecha
    y permita que pasen los vehículos de emergencia''.'
- id: 148
  category: sharing_the_road
  question: ¿Por qué debe evitar rebasar camiones grandes y remolques dentro de una
    rotonda de varios carriles?
  choices:
    A: Están obligados a ceder el paso a todos los vehículos que los rebasen.
    B: Es posible que necesiten ocupar ambos carriles para navegar por la rotonda.
    C: No se les permite usar rotondas de varios carriles.
    D: Viajan a velocidades mucho más altas que los vehículos de pasajeros.
  answer: B
  explanation: Según el manual, no debe intentar adelantar o rebasar vehículos en
    una rotonda porque 'los camiones grandes y los remolques dentro de la rotonda
    pueden necesitar ocupar ambos carriles'.
- id: 149
  category: safe_driving_rules
  question: ¿A qué distancia debe detenerse un conductor ante un autobús escolar que
    tiene sus luces rojas parpadeando y/o el brazo de parada extendido?
  choices:
    A: Al menos 10 pies en cualquier dirección
    B: Al menos 15 pies en cualquier dirección
    C: Al menos 25 pies en cualquier dirección
    D: Al menos 50 pies en cualquier dirección
  answer: C
  explanation: El manual exige que 'los conductores deben detenerse al menos a 25
    pies en cualquier dirección ante un autobús escolar que esté detenido con sus
    luces rojas parpadeando y/o el brazo de parada extendido en todo momento...'
- id: 150
  category: safe_driving_rules
  question: ¿Bajo qué condición NO se requiere que un conductor se detenga ante un
    autobús escolar con luces rojas parpadeantes?
  choices:
    A: Cuando el autobús está en el lado opuesto de una carretera de dos carriles.
    B: Cuando la calzada está separada por una barrera física.
    C: Cuando el conductor viaja en la misma dirección que el autobús.
    D: Cuando el autobús está detenido en una intersección.
  answer: B
  explanation: Los conductores deben detenerse ante un autobús escolar con luces rojas
    parpadeantes 'a menos que la calzada esté separada por una barrera física'.
- id: 151
  category: safe_driving_rules
  question: Si debe estacionarse a lo largo de una carretera rural y no puede salirse
    completamente de la calzada, ¿cuál es la distancia mínima de visibilidad despejada
    requerida en cada dirección?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Si es imposible salirse completamente de la carretera, los conductores
    deben salirse tanto como puedan 'siempre que haya una vista despejada a una distancia
    de 200 pies en cada dirección y si hay suficiente espacio para que pasen otros
    vehículos'.
- id: 152
  category: driver_responsibility
  question: Al dejar un vehículo desatendido, ¿qué exige la ley que hagan los conductores
    para asegurar el vehículo?
  choices:
    A: Dejar el motor en marcha si regresa en menos de 5 minutos.
    B: Apagar el motor y quitar la llave.
    C: Dejar las llaves en el encendido para los servicios de emergencia.
    D: Encender las luces de emergencia y dejar las puertas sin seguro.
  answer: B
  explanation: 'El manual establece: ''La ley exige que los conductores apaguen el
    motor y quiten la llave al dejar un vehículo desatendido''.'
- id: 153
  category: safe_driving_rules
  question: ¿Cómo debe asegurar su vehículo cuando esté estacionado en una colina?
  choices:
    A: Dejar el vehículo en punto muerto (neutral) y aplicar el freno de estacionamiento.
    B: Poner el freno de estacionamiento y girar las ruedas en dirección contraria
      al bordillo.
    C: Poner el freno de estacionamiento y girar las ruedas hacia el bordillo.
    D: Dejar las ruedas rectas y confiar únicamente en la transmisión.
  answer: C
  explanation: Para asegurarse de que el vehículo no pueda moverse, los conductores
    deben 'poner el freno de estacionamiento y girar las ruedas hacia el bordillo
    si el vehículo está estacionado en una colina'.
- id: 154
  category: driver_responsibility
  question: ¿Cuál es el propósito del pasillo de acceso con líneas diagonales (crosshatched)
    adyacente a un espacio de estacionamiento accesible?
  choices:
    A: Proporcionar un área designada para carritos de compras.
    B: Permitir espacio adicional para que se estacionen motocicletas.
    C: Proporcionar espacio para que las personas con discapacidades para caminar
      puedan maniobrar de manera segura y usar elevadores o rampas.
    D: Servir como pasarela peatonal para todos los clientes de la tienda.
  answer: C
  explanation: El pasillo de acceso es 'el espacio que necesitan las personas con
    discapacidades para caminar para poder abrir completamente la puerta de su vehículo
    y maniobrar con seguridad al entrar y salir de su vehículo' y para usar un elevador
    o rampa.
- id: 155
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios es ilegal estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: Aunque no esté marcado, es ilegal estacionarse 'a menos de 15 pies
    de un hidrante de incendios'.
- id: 156
  category: signs_and_signals
  question: ¿A cuántos pies de una señal de pare (stop), una señal de ceda el paso
    (yield) o una señal de control de tráfico no debe estacionar su vehículo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Es ilegal estacionarse 'a menos de 30 pies de una señal de pare, señal
    de ceda el paso o señal de control de tráfico'.
- id: 157
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima de estacionamiento requerida desde el riel
    más cercano de un cruce de ferrocarril?
  choices:
    A: 20 pies
    B: 30 pies
    C: 50 pies
    D: 75 pies
  answer: C
  explanation: Es ilegal estacionarse 'a menos de 50 pies del riel más cercano de
    un cruce de ferrocarril'.
- id: 158
  category: defensive_driving
  question: ¿Por qué debe evitar girar hacia un carril frente a un vehículo que se
    aproxima y tiene activa su señal de giro?
  choices:
    A: El conductor puede estar planeando girar después de pasar su intersección o
      puede haber olvidado apagar la señal.
    B: La ley exige que espere hasta que el vehículo se detenga por completo.
    C: Las señales de giro activas siempre indican que el vehículo está acelerando.
    D: El vehículo que se aproxima tiene el derecho de paso para cambiar de carril
      en la intersección.
  answer: A
  explanation: 'El manual advierte: ''El conductor con una señal de giro activa puede
    planear girar después de pasar la intersección en la que se encuentra un conductor
    o puede haber olvidado apagar la señal de un giro anterior''.'
- id: 159
  category: defensive_driving
  question: ¿Cuál es una regla clave que los conductores deben recordar con respecto
    a la búsqueda visual antes de realizar un giro?
  choices:
    A: Girar el volante antes de girar la cabeza.
    B: Girar la cabeza antes de girar el volante.
    C: Confiar estrictamente en su espejo retrovisor.
    D: Mantener la vista fija hacia adelante.
  answer: B
  explanation: 'En la sección de Búsqueda Visual, el manual establece: ''Algo que
    los conductores deben recordar: gire la cabeza antes de girar el volante''.'
- id: 160
  category: defensive_driving
  question: ¿Cuándo debe un conductor revisar continuamente sus espejos para estar
    al tanto del tráfico detrás de su vehículo?
  choices:
    A: Solo cuando conduce en una carretera de varios carriles.
    B: Antes de reducir la velocidad, detenerse, girar o cambiar de carril.
    C: Solo al estacionarse en paralelo.
    D: Después de completar un giro o un cambio de carril.
  answer: B
  explanation: 'El manual aconseja: ''Los conductores deben revisar sus espejos continuamente
    antes de reducir la velocidad, detenerse, girar o cambiar de carril''.'
- id: 161
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento mínima recomendada que debe mantener
    entre su automóvil y el vehículo que tiene delante?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: C
  explanation: Los conductores siempre deben intentar mantener una distancia de seguimiento
    mínima de al menos cuatro segundos entre su automóvil y el vehículo que va delante.
- id: 162
  category: defensive_driving
  question: ¿Por qué debe evitar conducir al lado de otros vehículos durante largos
    períodos de tiempo?
  choices:
    A: Disminuye la eficiencia de combustible de su vehículo.
    B: Es ilegal en autopistas de varios carriles.
    C: Es posible que se encuentre en su punto ciego, lo que reduce el espacio necesario
      para evitar una colisión.
    D: Hace que el otro conductor acelere.
  answer: C
  explanation: Los conductores deben evitar conducir al lado de otros vehículos durante
    largos períodos de tiempo porque el vehículo puede estar en su punto ciego y esto
    reduce el espacio necesario para evitar una colisión.
- id: 163
  category: driver_responsibility
  question: Si se ve involucrado en un choque con heridos, ¿cuál es el procedimiento
    adecuado con respecto a las personas heridas?
  choices:
    A: Moverlas al costado de la carretera inmediatamente.
    B: Transportarlas al hospital más cercano en su vehículo.
    C: Esperar en su vehículo hasta que llegue la ambulancia sin interactuar con ellas.
    D: Prestar ayuda a las personas heridas, pero no moverlas a menos que sea necesario.
  answer: D
  explanation: Si ocurre un choque, los conductores deben prestar ayuda a las personas
    heridas, pero no moverlas a menos que sea necesario, y asegurarse de que se haya
    llamado a una ambulancia.
- id: 164
  category: driver_responsibility
  question: ¿Cuántos días tiene para presentar un informe de accidente ante la División
    de Vehículos Motorizados (DMV) si es necesario?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: La ley de New Hampshire exige que se presente un informe de accidente
    ante la División de Vehículos Motorizados (DMV) dentro de los quince (15) días
    si hay una víctima mortal, heridos o daños a la propiedad combinados por más de
    $1,000.
- id: 165
  category: driver_responsibility
  question: 'Según la ley de New Hampshire, se debe presentar un informe de accidente
    ante el DMV si el daño a la propiedad combinado suma más de:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: Se debe presentar un informe de accidente ante el DMV si hay una víctima
    mortal, heridos o si el daño a la propiedad combinado suma más de $1,000.
- id: 166
  category: driver_responsibility
  question: Si un oficial de policía investiga un choque, ¿está obligado a presentar
    un informe de accidente por separado al DMV?
  choices:
    A: Sí, dentro de los 15 días posteriores al choque.
    B: Sí, pero solo si hay una víctima mortal.
    C: No, el informe presentado por el oficial de policía cumple con el requisito
      de notificación.
    D: No, a menos que el daño a la propiedad combinado sea superior a $2,000.
  answer: C
  explanation: Si el choque es investigado por un oficial de policía, los conductores
    no están obligados a presentar un informe por separado a la División de Vehículos
    Motorizados (DMV). El informe policial cumple con el requisito.
- id: 167
  category: penalties_and_points
  question: ¿Qué sucede si no tiene seguro, se ve involucrado en un choque y no puede
    pagar los daños y las facturas médicas de las que es responsable?
  choices:
    A: Su vehículo será confiscado permanentemente por el estado.
    B: Será sentenciado a un mínimo de 30 días de cárcel.
    C: El estado de New Hampshire pagará los daños.
    D: El DMV suspenderá sus privilegios de conducción hasta que se haya llegado a
      un acuerdo.
  answer: D
  explanation: Si un conductor no puede pagar estos daños y facturas médicas, la ley
    de New Hampshire exige que la División de Vehículos Motorizados (DMV) suspenda
    los privilegios de conducción del conductor hasta que se haya llegado a un acuerdo.
- id: 168
  category: penalties_and_points
  question: ¿Cuál de las siguientes condenas requeriría que un conductor presente
    una prueba de seguro (SR-22) para restablecer sus privilegios de conducción?
  choices:
    A: Primera infracción por exceso de velocidad
    B: Conducir bajo la influencia (DUI) de alcohol o drogas
    C: Estacionarse en una zona para personas con discapacidad
    D: Pasarse un semáforo en rojo
  answer: B
  explanation: Las condenas por vehículos motorizados que requieren que un conductor
    presente una prueba de seguro (SR-22) incluyen conducir bajo la influencia (DUI)
    de alcohol o drogas, no detenerse y reportar un choque, homicidio por vehículo
    motorizado y una segunda infracción por conducción temeraria.
- id: 169
  category: vehicle_information
  question: Si su vehículo está equipado con un Sistema de Frenos Antibloqueo (ABS),
    ¿cómo debe frenar en una emergencia?
  choices:
    A: Bombee los frenos rápidamente para evitar derrapar.
    B: Presione el pedal del freno y mantenga la presión.
    C: Toque ligeramente los frenos hasta que el vehículo se detenga.
    D: Aplique el freno de mano mientras presiona el freno de pie.
  answer: B
  explanation: Para los vehículos equipados con ABS, los conductores deben presionar
    el pedal del freno y mantener la presión. El ABS funcionará solo si el conductor
    mantiene la presión en el pedal del freno.
- id: 170
  category: defensive_driving
  question: 'Al dar un volantazo para evitar un problema repentino que se aproxima
    en la dirección opuesta, usted debe:'
  choices:
    A: Dar siempre el volantazo hacia la izquierda.
    B: Nunca dar un volantazo hacia la izquierda para evitar un choque.
    C: Soltar el volante y frenar a fondo.
    D: Girar directamente hacia el tráfico que viene en sentido contrario.
  answer: B
  explanation: Si un vehículo se aproxima repentinamente desde la dirección opuesta,
    los conductores deben maniobrar en la dirección a la que quieren ir, pero tratando
    de evitar el resto del tráfico; nunca dé un volantazo hacia la izquierda para
    evitar un choque.
- id: 171
  category: safe_driving_rules
  question: Si su vehículo comienza a derrapar, ¿qué es lo primero que debe hacer?
  choices:
    A: Pisar los frenos a fondo.
    B: Soltar gradualmente el acelerador.
    C: Girar bruscamente el volante en la dirección opuesta al derrape.
    D: Tirar del freno de estacionamiento de emergencia.
  answer: B
  explanation: Si el vehículo comienza a derrapar, los conductores deben soltar el
    acelerador y girar el volante en la dirección en la que se desliza la parte trasera
    del vehículo.
- id: 172
  category: safe_driving_rules
  question: ¿En qué dirección debe girar el volante si la parte trasera de su vehículo
    comienza a deslizarse durante un derrape?
  choices:
    A: En la dirección opuesta a la que se desliza la parte trasera.
    B: En la dirección en la que se desliza la parte trasera del vehículo.
    C: Mantener el volante perfectamente recto.
    D: Hacia el acotamiento derecho de la carretera, independientemente del derrape.
  answer: B
  explanation: Si el vehículo comienza a derrapar, los conductores deben girar el
    volante en la dirección en la que se desliza la parte trasera del vehículo. Esto
    permitirá que el vehículo siga recto en lugar de ir de lado.
- id: 173
  category: defensive_driving
  question: 'Para ayudar a mantener una distancia segura con los vehículos que le
    siguen, usted debe:'
  choices:
    A: Tocar los frenos repetidamente para advertirles que se alejen.
    B: Aumentar la velocidad para incrementar la distancia entre los vehículos.
    C: Conducir a una velocidad constante, señalizar con anticipación y aumentar su
      distancia de seguimiento con el vehículo de adelante.
    D: Virar ligeramente dentro de su carril para llamar su atención.
  answer: C
  explanation: Para ayudar a mantener una distancia segura con los vehículos que le
    siguen, los conductores deben conducir a una velocidad constante, señalizar con
    anticipación y aumentar la distancia de seguimiento con el vehículo de adelante
    para permitir una distancia de frenado segura.
- id: 174
  category: driver_responsibility
  question: Si usted se ve involucrado en un choque, ¿qué debe hacer con respecto
    a la posición de su vehículo?
  choices:
    A: Dejarlo exactamente donde está hasta que llegue la policía, incluso si bloquea
      el tráfico.
    B: Si es posible, mover el vehículo fuera de la carretera para que no se bloquee
      el tráfico.
    C: Conducirlo a casa de inmediato y llamar a la policía desde allí.
    D: Empujarlo a la zanja más cercana para despejar completamente el área.
  answer: B
  explanation: Si ocurre un choque, los conductores deben detenerse y, si es posible,
    mover el vehículo fuera de la carretera para que el tráfico no se vea impedido
    de pasar por el lugar del accidente.
- id: 175
  category: safe_driving_rules
  question: ¿Qué es lo primero que debe hacer un conductor si su vehículo comienza
    a derrapar?
  choices:
    A: Frenar firmemente para detener el vehículo rápidamente.
    B: Girar el volante en la dirección opuesta a la que se desliza la parte trasera.
    C: Soltar gradualmente el acelerador.
    D: Poner el vehículo en punto muerto (neutral).
  answer: C
  explanation: Si el vehículo comienza a derrapar, los conductores deben soltar el
    acelerador y girar el volante en la dirección en la que se desliza la parte trasera
    del vehículo.
- id: 176
  category: defensive_driving
  question: Si su vehículo se sale de la superficie pavimentada de la carretera debido
    a un desnivel en la superficie, ¿cuál es la acción recomendada?
  choices:
    A: Girar el volante bruscamente por pánico para volver al pavimento de inmediato.
    B: Frenar con fuerza y detenerse por completo en el acotamiento.
    C: Acelerar para recuperar la tracción antes de volver a entrar.
    D: Reducir la velocidad gradualmente y volver al pavimento cuando sea seguro hacerlo.
  answer: D
  explanation: Si el vehículo se sale de la superficie pavimentada, los conductores
    deben evitar girar el volante bruscamente por pánico, reducir la velocidad gradualmente
    y volver al pavimento cuando sea seguro hacerlo.
- id: 177
  category: vehicle_information
  question: ¿Cómo debe aplicar el freno de estacionamiento si sus frenos principales
    fallan mientras conduce?
  choices:
    A: Tirar de él o presionarlo rápidamente para bloquear las ruedas traseras.
    B: Tirar de él o presionarlo lentamente para evitar bloquear las ruedas traseras
      y provocar un derrape.
    C: Bombear el freno de estacionamiento rápidamente hasta que el vehículo se detenga.
    D: No utilizar el freno de estacionamiento mientras el vehículo esté en movimiento.
  answer: B
  explanation: En caso de falla de los frenos, los conductores deben tirar del freno
    de estacionamiento o presionarlo lentamente para evitar bloquear las ruedas traseras
    y provocar un derrape.
- id: 178
  category: defensive_driving
  question: ¿Cómo reacciona normalmente un vehículo si se revienta un neumático delantero?
  choices:
    A: El vehículo tirará con fuerza en la dirección del reventón.
    B: El vehículo se tambaleará y tirará ligeramente en la dirección opuesta.
    C: El vehículo perderá toda la potencia de frenado al instante.
    D: El vehículo acelerará de forma incontrolada.
  answer: A
  explanation: Si se revienta un neumático delantero, el vehículo tirará con fuerza
    en la dirección del reventón. (Si se revienta un neumático trasero, el vehículo
    se tambaleará, vibrará y tirará un poco).
- id: 179
  category: vehicle_information
  question: Si el motor se apaga mientras el vehículo está en movimiento, ¿qué debe
    esperar con respecto al volante?
  choices:
    A: Se bloqueará por completo y no se podrá girar.
    B: Girará libremente sin ninguna resistencia.
    C: Puede ser difícil de girar, requiriendo un agarre firme.
    D: Dirigirá automáticamente el vehículo hacia el acotamiento derecho.
  answer: C
  explanation: Si el motor se apaga (falla de energía), los conductores deben sujetar
    el volante con firmeza y ser conscientes de que el volante puede ser difícil de
    girar.
- id: 180
  category: safe_driving_rules
  question: ¿Cuál es la secuencia correcta de acciones si el acelerador de su vehículo
    se queda atascado?
  choices:
    A: Apagar el motor, poner el vehículo en estacionamiento (P) y frenar firmemente.
    B: Poner el vehículo en punto muerto (neutral), frenar firmemente y salir de la
      carretera cuando sea seguro.
    C: Bombear el acelerador, poner el vehículo en reversa y dirigirse fuera de la
      carretera.
    D: Aplicar el freno de estacionamiento lentamente y encender las luces de emergencia.
  answer: B
  explanation: Si el acelerador se queda atascado, los conductores deben mantener
    la vista en la carretera, poner el vehículo en punto muerto (neutral), frenar
    firmemente para contrarrestar la aceleración y salir de la carretera cuando sea
    seguro.
- id: 181
  category: defensive_driving
  question: ¿Si su vehículo se avería y no tiene un teléfono celular, cómo puede alertar
    a otros conductores de que necesita ayuda?
  choices:
    A: Pararse en medio del carril y agitar los brazos.
    B: Tocar la bocina continuamente en un patrón de tres.
    C: Levantar el capó y atar un paño blanco a la manija de la puerta o a la antena.
    D: Encender y apagar las luces delanteras rápidamente.
  answer: C
  explanation: Si no se dispone de un teléfono celular o dispositivo, levante el capó
    del vehículo y ate un paño blanco (rojo en una tormenta de nieve) a la manija
    de la puerta del conductor o a la antena del vehículo para alertar a los conductores
    de que se necesita ayuda.
- id: 182
  category: defensive_driving
  question: ¿A qué distancia debe colocar bengalas de emergencia o reflectores si
    su vehículo se avería?
  choices:
    A: 50 pies por delante y por detrás del vehículo.
    B: 100 pies por delante y por detrás del vehículo.
    C: 200 pies por delante y por detrás del vehículo.
    D: 500 pies detrás del vehículo únicamente.
  answer: C
  explanation: Los conductores deben intentar dar tiempo a otros conductores para
    cambiar de carril colocando bengalas de emergencia o reflectores a 200 pies por
    delante y por detrás del vehículo.
- id: 183
  category: sharing_the_road
  question: ¿Por dónde deben caminar los peatones si caminan por el lado de una carretera
    donde no hay acera?
  choices:
    A: En el lado derecho de la calzada con el flujo del tráfico.
    B: En el lado izquierdo de la calzada de frente al tráfico que viene en sentido
      contrario.
    C: En el centro de la calzada.
    D: En el arcén más cercano a la intersección más próxima.
  answer: B
  explanation: Los peatones deben caminar por el lado izquierdo de la calzada de frente
    al tráfico que viene en sentido contrario cuando caminen por el lado de la carretera
    donde no haya acera.
- id: 184
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor al acercarse a una persona con discapacidad
    visual que lleva un bastón blanco e intenta cruzar la calzada?
  choices:
    A: Tocar la bocina para avisarle que se acerca un vehículo.
    B: Reducir la velocidad y ceder el paso solo si se encuentra en un cruce de peatones
      marcado.
    C: Detenerse por completo y tener precaución adicional al avanzar.
    D: Virar hacia el carril opuesto para darle mucho espacio.
  answer: C
  explanation: La ley de New Hampshire exige que los conductores se detengan por completo
    siempre que una persona que lleve un bastón blanco o use un perro guía intente
    cruzar una calzada, y los conductores NUNCA deben tocarles la bocina.
- id: 185
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima de separación razonable que un conductor
    debe dejar al adelantar a un ciclista a 30 mph o menos?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: Se presumirá que la distancia es razonable y prudente si es de al menos
    3 pies cuando el vehículo viaja a 30 millas por hora (mph) o menos.
- id: 186
  category: sharing_the_road
  question: Si está adelantando a un ciclista mientras viaja a 50 mph, ¿cuál es la
    distancia mínima de separación requerida que debe proporcionar?
  choices:
    A: 3 pies
    B: 4 pies
    C: 5 pies
    D: 6 pies
  answer: C
  explanation: La ley exige al menos 3 pies a 30 mph o menos, con un pie adicional
    de separación requerido por cada 10 millas por hora por encima de 30 mph. A 50
    mph (20 mph por encima de 30), esto requiere 3 pies + 2 pies = 5 pies de separación.
- id: 187
  category: sharing_the_road
  question: ¿Por qué un conductor debe evitar tocar la bocina cerca de un ciclista
    a menos que haya posibilidad de un choque?
  choices:
    A: Es ilegal usar la bocina en áreas residenciales.
    B: La bocina puede asustar al ciclista y hacer que se dirija hacia la trayectoria
      del vehículo.
    C: Los ciclistas no pueden oír las bocinas de los vehículos debido al viento.
    D: Hará que el ciclista se detenga abruptamente en el carril.
  answer: B
  explanation: Tocar la bocina para alertar de su presencia puede asustar a los ciclistas
    y hacer que se dirijan hacia su trayectoria y choquen.
- id: 188
  category: sharing_the_road
  question: ¿Por qué un ciclista podría no poder usar señales manuales al girar o
    detenerse?
  choices:
    A: Las señales manuales no son obligatorias por ley para los ciclistas.
    B: Pueden estar viajando demasiado rápido para hacer señales de forma segura.
    C: Las condiciones de la carretera o del tráfico pueden requerir que mantengan
      ambas manos en el manubrio.
    D: Las bicicletas están equipadas con señales de giro electrónicas en su lugar.
  answer: C
  explanation: Es posible que los ciclistas no puedan hacer señales si las condiciones
    de la carretera o del tráfico requieren que mantengan ambas manos en el manubrio.
- id: 189
  category: defensive_driving
  question: Si su vehículo se avería durante una tormenta de nieve y no tiene un teléfono
    celular, ¿de qué color debe ser el paño que ate a la manija de la puerta o a la
    antena?
  choices:
    A: Blanco
    B: Rojo
    C: Amarillo
    D: Naranja
  answer: B
  explanation: Si no hay un teléfono celular disponible, levante el capó y ate un
    paño blanco (rojo en una tormenta de nieve) a la manija de la puerta del conductor
    o a la antena para alertar a los conductores de que se necesita ayuda.
- id: 190
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento mínima recomendada al conducir detrás
    de una motocicleta?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: C
  explanation: El manual establece que los conductores deben asegurarse de permitir
    una distancia de seguimiento de al menos cuatro segundos cuando estén detrás de
    una motocicleta.
- id: 191
  category: vehicle_information
  question: ¿Qué debe tener en cuenta un conductor con respecto a las señales de giro
    de una motocicleta?
  choices:
    A: Suelen ser más brillantes que las señales de los automóviles.
    B: No tienen una función de cancelación automática.
    C: No es obligatorio por ley utilizarlas.
    D: Siempre parpadean en rojo en lugar de ámbar.
  answer: B
  explanation: El manual señala que los conductores deben ser conscientes de que la
    mayoría de las motocicletas no tienen cancelación automática para las señales
    de giro, por lo que debe asegurarse de que el motociclista realmente esté girando
    antes de proceder.
- id: 192
  category: sharing_the_road
  question: ¿Cuándo se le permite a un automóvil compartir un carril con una motocicleta?
  choices:
    A: Cuando el tráfico está completamente detenido.
    B: Cuando la motocicleta viaja por debajo del límite de velocidad.
    C: Cuando el carril es lo suficientemente ancho para ambos vehículos.
    D: Nunca, ya que las motocicletas tienen derecho al ancho total de un carril.
  answer: D
  explanation: 'El manual establece explícitamente: "Nunca intente compartir un carril
    con una motocicleta. Las motocicletas tienen derecho al mismo ancho total de carril
    que todos los demás vehículos".'
- id: 193
  category: signs_and_signals
  question: ¿Qué indica un triángulo naranja y rojo fluorescente o reflectante que
    se muestra en la parte trasera de un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos.
    B: El vehículo viaja a menos de 25 mph.
    C: El vehículo realiza paradas frecuentes.
    D: El vehículo es de respuesta a emergencias.
  answer: B
  explanation: Un triángulo naranja y rojo fluorescente o reflectante que se muestra
    en la parte trasera de los vehículos significa que el vehículo es un vehículo
    de movimiento lento que viaja a menos de 25 mph.
- id: 194
  category: sharing_the_road
  question: ¿Qué NO debe hacer nunca al acercarse a un jinete en la carretera?
  choices:
    A: Reducir su velocidad.
    B: Rebasar con precaución.
    C: Evaluar la situación.
    D: Usar la bocina o acelerar el motor.
  answer: D
  explanation: Al acercarse a un caballo, los conductores deben reducir la velocidad,
    evaluar la situación, pasar con precaución y "nunca usar la bocina ni 'acelerar'
    el motor" para evitar asustar al animal.
- id: 195
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego lateral de un
    camión grande?
  choices:
    A: No puede ver las señales de giro del camión.
    B: No puede ver la cara del conductor del camión en su espejo retrovisor lateral.
    C: Está conduciendo exactamente a la misma velocidad que el camión.
    D: Se encuentra a menos de 50 pies del parachoques trasero del camión.
  answer: B
  explanation: El manual explica que si un conductor no puede ver la cara del conductor
    del camión en el espejo retrovisor lateral, entonces el conductor del camión no
    puede ver al otro vehículo, lo que indica que usted está en su punto ciego.
- id: 196
  category: safe_driving_rules
  question: Bajo condiciones ideales, ¿cuál es la distancia mínima de frenado para
    un camión cargado que viaja a 55 mph?
  choices:
    A: 150 pies
    B: 200 pies
    C: 335 pies
    D: 500 pies
  answer: C
  explanation: Un camión cargado con buenos neumáticos y frenos ajustados correctamente
    bajo condiciones ideales a 55 mph requiere un mínimo de 335 pies antes de detenerse
    por completo.
- id: 197
  category: sharing_the_road
  question: ¿Hasta qué distancia puede extenderse el punto ciego directamente detrás
    de un vehículo comercial grande?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 200 pies
    D: Hasta 335 pies
  answer: C
  explanation: A diferencia de los automóviles, los vehículos grandes tienen puntos
    ciegos enormes directamente detrás de ellos que se extienden hasta 200 pies.
- id: 198
  category: safe_driving_rules
  question: ¿Qué debe hacer antes de volver al carril frente a un camión grande que
    acaba de rebasar?
  choices:
    A: Esperar hasta estar al menos a 500 pies por delante del camión.
    B: Ver toda la parte delantera del camión en su espejo retrovisor.
    C: Hacer parpadear sus faros para señalar su intención.
    D: Tocar sus frenos para asegurarse de que el conductor del camión lo vea.
  answer: B
  explanation: Al rebasar un vehículo grande, debe ver toda la parte delantera del
    vehículo en el espejo retrovisor antes de colocarse delante y mantener la velocidad.
- id: 199
  category: sharing_the_road
  question: ¿Por qué un camión grande podría abrirse hacia la izquierda antes de realizar
    un giro a la derecha?
  choices:
    A: Para permitir que los autos pasen por la derecha.
    B: Para librar la esquina de un bordillo u otra obstrucción.
    C: Para aumentar la velocidad para el giro.
    D: Para revisar su punto ciego del lado derecho.
  answer: B
  explanation: Cuando un camión o autobús necesita hacer un giro a la derecha, es
    posible que deba abrirse hacia la izquierda para poder girar a la derecha de manera
    segura y librar la esquina de un bordillo u otra obstrucción.
- id: 200
  category: signs_and_signals
  question: ¿Cuál es una de las razones principales por las que las intersecciones
    están marcadas con líneas de parada?
  choices:
    A: Para indicar dónde se permite el cruce de peatones.
    B: Para dar a los vehículos más grandes más espacio de giro al situar a los otros
      vehículos más atrás.
    C: Para marcar el límite de una zona escolar.
    D: Para activar los sensores del semáforo.
  answer: B
  explanation: Las líneas de parada ayudan a situar un vehículo más atrás en una intersección
    para dar a los vehículos más grandes más espacio para girar.
- id: 201
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima que debe mantener al seguir a un camión de
    bomberos que tiene activada la sirena o las luces intermitentes?
  choices:
    A: 100 pies
    B: 200 pies
    C: 335 pies
    D: 500 pies
  answer: D
  explanation: Los conductores no deben seguir a un camión de bomberos a una distancia
    menor de 500 pies cuando este tenga activada la sirena o las luces intermitentes.
- id: 202
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando un vehículo de emergencia se aproxima desde cualquier
    dirección con la sirena y las luces intermitentes encendidas?
  choices:
    A: Aumentar la velocidad para despejar el camino delante del vehículo de emergencia.
    B: Detenerse inmediatamente en su carril actual.
    C: Dirigirse inmediatamente al lado derecho de la carretera y detenerse, evitando
      las intersecciones.
    D: Moverse al carril izquierdo y reducir la velocidad.
  answer: C
  explanation: Los conductores deben dirigirse inmediatamente al lado derecho de la
    carretera y detener el vehículo hasta que haya pasado la emergencia, y evitar
    bloquear una intersección al detenerse.
- id: 203
  category: defensive_driving
  question: Bajo la "Ley Sherrill" de New Hampshire, ¿qué debe hacer un conductor
    al acercarse a un vehículo detenido con las luces de emergencia intermitentes
    a un lado de la autopista?
  choices:
    A: Detenerse y ofrecer asistencia al vehículo detenido.
    B: Mantener una velocidad reducida y dejar un espacio amplio o cambiar de carril
      si es seguro.
    C: Tocar la bocina para alertar al conductor detenido de su presencia.
    D: Acelerar para pasar el peligro lo más rápido posible.
  answer: B
  explanation: La Ley Sherrill exige que los conductores mantengan una velocidad reducida
    y, si es factible, dejen un espacio amplio o se cambien a un carril no adyacente
    al acercarse a vehículos detenidos que muestren luces de advertencia de peligro.
- id: 204
  category: sharing_the_road
  question: ¿Por qué un motociclista podría cambiar de dirección o reducir la velocidad
    al circular sobre un puente de metal o de rejilla?
  choices:
    A: El metal interfiere con la electrónica de la motocicleta.
    B: El conductor puede experimentar una sensación de tambaleo.
    C: El límite de velocidad siempre es más bajo en los puentes de rejilla.
    D: Los neumáticos de la motocicleta pueden quedar atrapados fácilmente en las
      rejillas.
  answer: B
  explanation: El manual establece que los motociclistas pueden experimentar una sensación
    de tambaleo al circular sobre puentes de metal o de rejilla, lo que puede hacer
    que reduzcan la velocidad o cambien de dirección.
- id: 205
  category: safe_driving_rules
  question: ¿Qué debe hacer un conductor al acercarse a un vehículo estacionario que
    muestra luces de emergencia azules, rojas o ámbar?
  choices:
    A: Mantener la velocidad y permanecer en el carril actual
    B: Mantener una velocidad reducida y dejar un espacio amplio sin poner en peligro
      el tráfico que viene en sentido contrario
    C: Detenerse inmediatamente en el carril de circulación
    D: Tocar la bocina para alertar a los trabajadores de emergencia
  answer: B
  explanation: El manual establece que los conductores deben mantener una velocidad
    reducida y, si es factible, dejar un espacio amplio, sin poner en peligro el tráfico
    que viene en sentido contrario, ante los vehículos que muestren luces de advertencia
    de emergencia azules, rojas o ámbar.
- id: 206
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de la ley relativa al acercamiento
    a vehículos de emergencia o detenidos?
  choices:
    A: Una advertencia y una clase de conducción obligatoria
    B: Una suspensión de la licencia por 30 días
    C: Una multa más una evaluación de penalización
    D: Hasta 6 meses de cárcel
  answer: C
  explanation: Cualquier persona que infrinja esta ley será multada más una evaluación
    de penalización por una primera infracción.
- id: 207
  category: penalties_and_points
  question: ¿En qué período de tiempo debe un conductor cometer una infracción posterior
    de la ley de "hacerse a un lado" (move over) para que se aplique un aumento en
    la multa y en la evaluación de penalización?
  choices:
    A: 6 meses
    B: 12 meses
    C: 24 meses
    D: 36 meses
  answer: B
  explanation: El manual especifica un aumento en la multa más una evaluación de penalización
    por una infracción posterior en un período de 12 meses.
- id: 208
  category: safe_driving_rules
  question: Al orillarse a un lado de la carretera ante un vehículo policial con las
    luces y/o sirenas activadas, ¿qué es lo primero que debe hacer una vez detenido?
  choices:
    A: Salir del vehículo para hablar con el oficial
    B: Detenerse por completo y poner el vehículo en posición de estacionamiento (park)
    C: Buscar en la guantera su registro
    D: Apagar todas las luces interiores y exteriores
  answer: B
  explanation: Durante una parada de tráfico, el conductor debe detenerse por completo
    y poner el vehículo en posición de estacionamiento (park).
- id: 209
  category: safe_driving_rules
  question: Si la policía lo detiene por la noche, ¿qué debe hacer para ayudar al
    oficial a ver el interior de su vehículo?
  choices:
    A: Encender las luces altas
    B: Apagar las luces intermitentes de emergencia
    C: Encender las luces interiores
    D: Bajar todas las ventanillas y apagar los faros
  answer: C
  explanation: Si lo detienen por la noche, debe encender las luces interiores para
    ayudar al oficial a ver que todo está en orden dentro del vehículo.
- id: 210
  category: driver_responsibility
  question: ¿Dónde debe colocar las manos mientras espera a que el oficial de policía
    se acerque a su vehículo durante una parada de tráfico?
  choices:
    A: En su regazo
    B: En el volante
    C: Fuera de la ventana
    D: En el tablero
  answer: B
  explanation: Durante una parada policial, debe mantener la calma, mantener abrochado
    el cinturón de seguridad, colocar las manos en el volante y limitar los movimientos.
- id: 211
  category: driver_responsibility
  question: ¿Cómo debe recuperar su licencia de conducir y el registro del vehículo
    cuando se lo solicite un oficial de policía?
  choices:
    A: Agarrarlos rápidamente antes de que el oficial llegue a la ventana
    B: Decirle al oficial dónde se encuentran y alcanzarlos lentamente con una mano
      en el volante
    C: Pedirle al pasajero que se desabroche el cinturón y los busque en el asiento
      trasero
    D: Salir del vehículo para recuperarlos del maletero
  answer: B
  explanation: Si el oficial solicita estos documentos, dígale dónde se encuentran
    y alcáncelos lentamente con una mano en el volante.
- id: 212
  category: defensive_driving
  question: ¿Qué debe hacer si lo detiene un oficial de policía vestido de civil en
    un vehículo sin distintivos?
  choices:
    A: Negarse a bajar la ventana o hablar con ellos
    B: Alejarse conduciendo de inmediato
    C: Solicitar identificación, como una placa o una tarjeta de identificación del
      departamento
    D: Exigir que llamen a un oficial uniformado antes de detenerse
  answer: C
  explanation: Si el oficial de policía está vestido de civil (sin uniforme), solicite
    identificación, como una placa o una tarjeta de identificación del departamento.
- id: 213
  category: signs_and_signals
  question: ¿Qué colores se utilizan para las señales de zona de obras?
  choices:
    A: Fondo amarillo con letras negras
    B: Fondo naranja con letras o símbolos negros
    C: Fondo blanco con letras rojas
    D: Fondo verde con símbolos blancos
  answer: B
  explanation: Las señales de zona de obras tienen un fondo naranja y letras o símbolos
    negros.
- id: 214
  category: safe_driving_rules
  question: ¿Qué debe hacer con respecto a su velocidad al conducir por una zona de
    obras?
  choices:
    A: Mantener el límite de velocidad indicado para la autopista a menos que los
      trabajadores sean visibles
    B: Reducir siempre la velocidad, incluso si no hay señales que indiquen un cambio
      en el límite de velocidad
    C: Aumentar la velocidad para salir rápidamente de la zona de obras
    D: Detenerse por completo antes de entrar en la zona de obras
  answer: B
  explanation: Reduzca siempre la velocidad en una zona de obras, incluso si no hay
    señales que indiquen un cambio en el límite de velocidad dentro de la zona.
- id: 215
  category: defensive_driving
  question: 'Al conducir por una zona de obras por la noche, los conductores deben:'
  choices:
    A: Tener extrema precaución, estén presentes los trabajadores o no
    B: Usar las luces altas para cegar al tráfico que viene en sentido contrario
    C: Asumir que no hay trabajadores presentes y mantener la velocidad normal
    D: Conducir por el arcén para evitar el pavimento irregular
  answer: A
  explanation: Los conductores deben tener extrema precaución al conducir por una
    zona de obras por la noche, estén presentes los trabajadores o no.
- id: 216
  category: safe_driving_rules
  question: ¿Cuándo es seguro reanudar la velocidad normal después de conducir por
    una zona de obras?
  choices:
    A: Tan pronto como pase el equipo de construcción
    B: Cuando ya no vea a ningún trabajador
    C: Cuando la señal de "Fin de obras viales" (End Road Work) sea visible
    D: Después de conducir exactamente una milla después de la zona de obras
  answer: C
  explanation: Observe las señales de zona de obras publicadas y no reanude la velocidad
    normal hasta que la señal de "Fin de obras viales" (End Road Work) sea visible.
- id: 217
  category: defensive_driving
  question: ¿Por qué es importante reducir la velocidad en una zona de obras incluso
    si no hay un cambio de límite de velocidad publicado?
  choices:
    A: Para leer los anuncios de la empresa de construcción
    B: Los carriles más estrechos y el pavimento irregular pueden crear condiciones
      peligrosas
    C: Para evitar recibir una multa de estacionamiento
    D: Porque los vehículos de construcción siempre tienen el derecho de paso
  answer: B
  explanation: Reduzca siempre la velocidad en una zona de obras... Los carriles más
    estrechos y el pavimento irregular pueden crear condiciones peligrosas.
- id: 218
  category: safe_driving_rules
  question: Cuando un vehículo policial lo detenga, ¿qué debe hacer con el motor de
    su vehículo y las luces de emergencia?
  choices:
    A: Dejar el motor en marcha y apagar todas las luces intermitentes
    B: Apagar el motor y encender las luces de emergencia
    C: Acelerar el motor para indicar que está detenido
    D: Apagar el motor y activar las luces altas
  answer: B
  explanation: Un conductor debe apagar el motor y encender las luces de emergencia
    durante una parada policial.
- id: 219
  category: safe_driving_rules
  question: Mientras conduce en una zona de obras, ¿cómo debe ajustar su distancia
    de seguimiento?
  choices:
    A: Disminuirla para evitar que otros autos se incorporen
    B: Mantener su distancia de seguimiento normal
    C: Aumentar la distancia de seguimiento
    D: Seguir muy de cerca al vehículo de adelante para avanzar más rápido
  answer: C
  explanation: Al conducir en una zona de obras, los conductores deben reducir la
    velocidad, aumentar la distancia de seguimiento, vigilar el tráfico alrededor
    del vehículo y estar preparados para detenerse.
- id: 220
  category: safe_driving_rules
  question: 'Un conductor joven (youth operator) no puede conducir un vehículo con
    más pasajeros de los que hay:'
  choices:
    A: Puertas en el vehículo
    B: Cinturones de seguridad en el vehículo
    C: Años de experiencia de conducción que tenga
    D: Supervisores adultos presentes
  answer: B
  explanation: Los conductores jóvenes no deben conducir un vehículo con más personas
    de las que hay cinturones de seguridad disponibles.
- id: 221
  category: safe_driving_rules
  question: ¿Qué debe hacer un conductor al acercarse a una rotonda?
  choices:
    A: Acelerar para incorporarse suavemente
    B: Ceder el paso al tráfico que ya circula por la rotonda
    C: Detenerse y esperar una luz verde
    D: Tocar la bocina antes de entrar
  answer: B
  explanation: Los conductores deben ceder el paso al tráfico que ya circula por una
    rotonda.
- id: 222
  category: alcohol_drugs_health
  question: ¿Qué significan las siglas BAC?
  choices:
    A: Control Básico de Automóvil (Basic Auto Control)
    B: Concentración de Alcohol en Sangre (Blood Alcohol Concentration)
    C: Contenido de Alcohol en el Aliento (Breath Alcohol Content)
    D: Capacidad de Alcohol en el Cuerpo (Body Alcohol Capacity)
  answer: B
  explanation: BAC significa Concentración de Alcohol en Sangre (Blood Alcohol Concentration).
- id: 223
  category: signs_and_signals
  question: ¿Qué indica una señal en forma de banderín situada en el lado izquierdo
    de la carretera?
  choices:
    A: Una zona escolar
    B: Un cruce de ferrocarril
    C: El inicio de una zona de no adelantar
    D: Una curva cerrada a la izquierda
  answer: C
  explanation: Una señal en forma de banderín situada en el lado izquierdo de la carretera
    señala el inicio de una zona de no adelantar.
- id: 224
  category: sharing_the_road
  question: ¿Cómo se llama el área alrededor de camiones grandes o autobuses donde
    los vehículos desaparecen en los puntos ciegos?
  choices:
    A: La Zona Muerta (The Dead Zone)
    B: La No-Zona (The No-Zone)
    C: El Área Ciega (The Blind Area)
    D: La Zona de Peligro (The Danger Zone)
  answer: B
  explanation: La "No-Zona" (No-Zone) es el área alrededor de camiones grandes o autobuses
    donde los vehículos desaparecen de la vista del conductor comercial en los puntos
    ciegos.
- id: 225
  category: license_system
  question: ¿Entre qué horas tienen prohibido conducir un vehículo los operadores
    jóvenes antes de cumplir 18 años?
  choices:
    A: 10:00 PM y 5:00 AM
    B: 11:00 PM y 6:00 AM
    C: 12:00 AM y 5:00 AM
    D: 1:00 AM y 4:00 AM
  answer: D
  explanation: Los operadores jóvenes no pueden conducir un vehículo entre las 1:00
    am y las 4:00 am antes de cumplir 18 años.
- id: 226
  category: safe_driving_rules
  question: ¿Cómo se llama la distancia que recorre desde el momento en que ve el
    peligro hasta que pisa el pedal del freno?
  choices:
    A: Distancia de frenado
    B: Distancia de parada
    C: Distancia de reacción
    D: Distancia de percepción
  answer: C
  explanation: La distancia que recorre desde que ve el peligro hasta que pisa el
    pedal del freno se llama distancia de reacción.
- id: 227
  category: signs_and_signals
  question: ¿Qué indica una señal de aspa (crossbuck)?
  choices:
    A: Una intersección de cuatro vías
    B: Un cruce de peatones
    C: Una zona hospitalaria
    D: Un cruce de ferrocarril
  answer: D
  explanation: Una señal de aspa (crossbuck) significa un cruce de ferrocarril.
- id: 228
  category: safe_driving_rules
  question: ¿Cuál es la distancia que recorre su vehículo mientras acciona los frenos
    para detenerlo?
  choices:
    A: Distancia de reacción
    B: Distancia de frenado
    C: Distancia total de parada
    D: Distancia de seguimiento
  answer: B
  explanation: La distancia que recorre mientras acciona los frenos para detener su
    vehículo se llama distancia de frenado.
- id: 229
  category: sharing_the_road
  question: ¿Están los ciclistas sujetos a las mismas leyes y normas que los conductores
    de automóviles?
  choices:
    A: Sí, deben seguir las mismas normas de circulación.
    B: No, se consideran peatones.
    C: Sí, pero solo cuando circulan por las aceras.
    D: No, solo tienen que seguir las ordenanzas locales del pueblo.
  answer: A
  explanation: Los ciclistas están sujetos a las mismas leyes y normas que los conductores
    de automóviles.
- id: 230
  category: safe_driving_rules
  question: Según la ley de New Hampshire, ¿hasta qué edad debe una persona usar el
    cinturón de seguridad o estar sujeta en un asiento de seguridad?
  choices:
    A: 12 años de edad
    B: 16 años de edad
    C: 18 años de edad
    D: 21 años de edad
  answer: C
  explanation: La ley de New Hampshire exige que las personas usen el cinturón de
    seguridad o estén sujetas en un asiento de seguridad hasta los 18 años de edad.
- id: 231
  category: signs_and_signals
  question: ¿Las indicaciones de quién prevalecen sobre cualquier semáforo o señal
    y deben ser obedecidas?
  choices:
    A: Un guardia de cruce escolar
    B: Un oficial de policía dirigiendo el tráfico
    C: Un trabajador de construcción de carreteras
    D: Un conductor de grúa
  answer: B
  explanation: Un oficial de policía que dirige el tráfico prevalece sobre cualquier
    semáforo o señal y debe ser obedecido.
- id: 232
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso sobre todos los vehículos en intersecciones
    y cruces peatonales?
  choices:
    A: Ciclistas
    B: Vehículos de emergencia
    C: Peatones
    D: Autobuses de transporte público
  answer: C
  explanation: Un peatón tiene el derecho de paso sobre todos los vehículos en intersecciones
    y cruces peatonales.
- id: 233
  category: safe_driving_rules
  question: Al realizar un giro en una intersección, ¿en qué carril debe entrar?
  choices:
    A: El carril más alejado de usted
    B: El carril central
    C: El carril más cercano a usted
    D: Cualquier carril disponible
  answer: C
  explanation: Al realizar un giro en una intersección, debe entrar en el carril que
    esté más cercano a usted.
- id: 234
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente en un semáforo?
  choices:
    A: Ceder el paso al tráfico que viene en sentido contrario
    B: Detenerse
    C: Proceder con precaución
    D: El semáforo está averiado
  answer: B
  explanation: Una luz roja intermitente significa que debe detenerse por completo,
    tal como lo haría ante una señal de alto (STOP).
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 235
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 236
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entrar en esta calzada
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico que viene en sentido contrario.
  id: 237
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda
    de manera segura.
  id: 238
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Mantenerse a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 239
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Adelantar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 240
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 241
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 242
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín blanco y negro de "NO PASSING ZONE"
    (zona de no rebasar) significa que no se le permite rebasar a otros vehículos
    en esta área. Marca el comienzo de una zona de no rebasar.
  id: 243
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Gire a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "KEEP RIGHT" (manténgase a la derecha)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 244
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 245
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan la carretera con frecuencia en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 246
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 247
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 248
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 249
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de trenes. Significa que debe ceder el paso a los trenes. Si se
    acerca un tren, debe detenerse.
  id: 250
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    sobre una curva en el camino más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 251
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 252
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta (rotonda) más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que el camino gire
    primero en un sentido y luego en el otro.
  id: 253
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que debe esperar esta señal?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte sobre una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 254
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 255
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Fin de la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción en el ancho de la vía y ajuste su posición
    en el carril.
  id: 256
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 257
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 258
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una vía de sentido único o de una autopista dividida y se
    encuentre con vehículos que viajan en la dirección opuesta.
  id: 259
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Camino sinuoso más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 260
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en el camino
    B: Una superficie de carretera irregular
    C: Una colina empinada o pendiente más adelante
    D: Construcción en la carretera
  answer: C
  explanation: Esta señal advierte sobre una colina empinada o pendiente más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 261
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca
    donde el semáforo puede no ser visible desde la distancia.
  id: 262
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (yield)
    B: Un semáforo
    C: Una señal de alto (stop) donde debe detenerse
    D: Un reductor de velocidad (bache)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (stop) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 263
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las carreteras
    laterales.
  id: 264
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la autopista desde el camino lateral.
  id: 265
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin requerir que los vehículos se incorporen. El tráfico que entra
    desde la rampa tiene su propio carril nuevo.
  id: 266
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer de pie o al ralentí (idling)
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 267
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que muestren un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 268
