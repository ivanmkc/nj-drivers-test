questions:
- id: 1
  category: license_system
  question: ¿En New Hampshire, a qué edad mínima se le permite a un residente comenzar
    a practicar la conducción acompañado por un adulto con licencia?
  choices:
    A: 15 años
    B: 15.5 años
    C: 16 años
    D: 14.5 años
  answer: B
  explanation: De acuerdo con la ley RSA 263:25 de New Hampshire, una persona a la
    que no se le ha emitido una licencia de conducir puede practicar la conducción
    a la edad de 15.5 años, siempre que esté acompañada por un adulto con licencia
    de 25 años de edad o más.
- id: 2
  category: license_system
  question: 'Una licencia de Operador Juvenil (Youth Operator) de New Hampshire se
    expide a cualquier persona que tenga al menos 16 años de edad pero sea menor de:'
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: En New Hampshire, a cualquier persona de 16 años de edad o más, pero
    menor de 21 años, se le expedirá una licencia de Operador Juvenil.
- id: 3
  category: license_system
  question: 'Bajo la ley de New Hampshire, un Operador Juvenil menor de 18 años tiene
    restringido conducir entre las horas de:'
  choices:
    A: 11:00 PM y 5:00 AM
    B: 12:00 AM y 6:00 AM
    C: 1:00 AM y 4:00 AM
    D: 10:00 PM y 4:00 AM
  answer: C
  explanation: Los titulares de una licencia de Operador Juvenil que sean menores
    de 18 años no deberán operar un vehículo motorizado entre las 1:00 AM y las 4:00
    AM.
- id: 4
  category: license_system
  question: Durante los primeros seis meses de tener una licencia de Operador Juvenil,
    ¿cuántos pasajeros que no sean familiares y sean menores de 25 años puede tener
    el conductor en el vehículo?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Durante los primeros seis meses después de la expedición de una licencia
    de Operador Juvenil, el titular no debe operar un vehículo motorizado con más
    de un pasajero menor de 25 años que no sea miembro de la familia del titular,
    a menos que esté acompañado por un adulto con licencia de al menos 25 años de
    edad.
- id: 5
  category: license_system
  question: Si se muda a New Hampshire y cambia su residencia permanente, ¿dentro
    de cuántos días debe notificar al DMV por escrito?
  choices:
    A: 10 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: B
  explanation: La ley de New Hampshire exige que notifique al DMV por escrito cualquier
    cambio de residencia o nombre dentro de los 30 días posteriores al cambio.
- id: 6
  category: license_system
  question: ¿Cuál es la agudeza visual mínima requerida en ambos ojos para aprobar
    el examen de la vista de New Hampshire para una licencia de conducir estándar?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Para aprobar el examen de la vista de New Hampshire, debe ser capaz
    de leer la línea de visión 20/40 con ambos ojos.
- id: 7
  category: license_system
  question: ¿Por cuántos días se puede suspender la licencia de un Operador Juvenil
    por una primera infracción de exceso de velocidad u otra infracción de tránsito?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Bajo la ley RSA 263:14, el Director de Vehículos Motorizados está autorizado
    a suspender la licencia de un Operador Juvenil por 20 días por una primera infracción
    de ciertas violaciones de vehículos motorizados.
- id: 8
  category: license_system
  question: ¿En New Hampshire, cuál es el límite legal de concentración de alcohol
    en sangre (BAC) para un conductor menor de 21 años?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.02%
    D: 0.00%
  answer: C
  explanation: Para los conductores menores de 21 años, es ilegal operar un vehículo
    con un BAC de 0.02% o superior.
- id: 9
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es obligatorio tener en el vehículo
    mientras se practica la conducción en New Hampshire?
  choices:
    A: Comprobante de seguro
    B: Registro del vehículo
    C: Un certificado de nacimiento o tarjeta de seguro social válidos
    D: La licencia de conducir válida del supervisor
  answer: C
  explanation: Mientras se practica la conducción, el vehículo debe estar registrado
    y el supervisor debe tener una licencia válida. Aunque se recomienda el comprobante
    de seguro, New Hampshire no lo exige estrictamente para todos los vehículos. Sin
    embargo, el certificado de nacimiento o la tarjeta de seguro social son para el
    proceso de solicitud del DMV, no para llevarlos durante la práctica de conducción.
- id: 10
  category: license_system
  question: 'En New Hampshire, generalmente se requiere un certificado de título para
    todos los vehículos motorizados, excepto aquellos con un año de modelo anterior
    a:'
  choices:
    A: 15 años
    B: 20 años
    C: Año 2000
    D: Año 1995
  answer: C
  explanation: La ley de New Hampshire requiere un título para los vehículos con un
    año de modelo 2000 o más reciente. Los vehículos con un año de modelo 1999 o anterior
    están exentos de título.
- id: 11
  category: license_system
  question: ¿Cuántos puntos de demérito se asignan por la infracción de 'Operar después
    de una Revocación o Suspensión' en New Hampshire?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: D
  explanation: Operar después de una revocación o suspensión es una infracción grave
    de vehículos motorizados y conlleva 6 puntos de demérito en New Hampshire.
- id: 12
  category: license_system
  question: 'Si usted está involucrado en un accidente de vehículo motorizado que
    cause la muerte, lesiones personales o daños totales superiores a $1,000, debe
    presentar un informe por escrito al DMV en un plazo de:'
  choices:
    A: 24 horas
    B: 5 días
    C: 10 días
    D: 15 días
  answer: D
  explanation: De acuerdo con NH RSA 264:25, si los daños a la propiedad son superiores
    a $1,000, debe presentar un informe oficial de accidente (DSMV 400) ante el DMV
    en un plazo de 15 días.
- id: 13
  category: license_system
  question: ¿Por cuántos años es válida una licencia de conducir estándar de New Hampshire
    antes de que expire?
  choices:
    A: 4 años
    B: 5 años
    C: 6 años
    D: 8 años
  answer: B
  explanation: Las licencias de conducir de New Hampshire son generalmente válidas
    por 5 años y expiran en el cumpleaños del solicitante.
- id: 14
  category: license_system
  question: En New Hampshire, ¿quién está obligado por ley a usar el cinturón de seguridad
    o estar asegurado en un sistema de retención infantil?
  choices:
    A: Solo el conductor
    B: Solo los pasajeros del asiento delantero
    C: Todos en el vehículo
    D: Cualquier persona menor de 18 años
  answer: D
  explanation: La ley de New Hampshire exige que cualquier persona menor de 18 años
    debe estar debidamente sujeta por un cinturón de seguridad o un asiento de retención
    infantil. NH es el único estado sin una ley obligatoria de cinturón de seguridad
    para adultos.
- id: 15
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una Licencia de Conducir Comercial
    (CDL) en New Hampshire para la conducción intraestatal (solo dentro de NH)?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: Los solicitantes deben tener al menos 18 años de edad para solicitar
    una CDL para uso intraestatal, y al menos 21 años de edad para uso interestatal
    o para transportar materiales peligrosos.
- id: 16
  category: license_system
  question: 'Un conductor de New Hampshire al que se le ha emitido una licencia de
    operador estándar Clase D está autorizado para conducir un vehículo con una Clasificación
    de Peso Bruto Vehicular (GVWR) de no más de:'
  choices:
    A: 10,000 lbs.
    B: 18,000 lbs.
    C: 26,000 lbs.
    D: 32,000 lbs.
  answer: C
  explanation: Según el Manual del Conductor de NH, una licencia de Operador Clase
    D le permite conducir un vehículo con un GVWR de 26,000 lbs. o menos, siempre
    que no esté remolcando un tráiler de más de 10,000 lbs.
- id: 17
  category: license_system
  question: 'Las licencias de conducir de New Hampshire generalmente expiran en el
    cumpleaños del solicitante cada:'
  choices:
    A: 4 años
    B: 5 años
    C: 6 años
    D: 8 años
  answer: B
  explanation: En New Hampshire, una licencia de conducir es válida por cinco años
    y expira en el cumpleaños del titular de la licencia.
- id: 18
  category: license_system
  question: Si usted es un nuevo residente de New Hampshire y posee una licencia de
    conducir válida de otro estado, ¿dentro de cuántos días después de establecer
    su residencia debe obtener una licencia de NH?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Los nuevos residentes tienen 60 días para obtener una licencia de conducir
    de New Hampshire después de mudarse al estado.
- id: 19
  category: license_system
  question: Para un conductor de 21 años o más, ¿el DMV de New Hampshire suspenderá
    la licencia por acumular cuántos puntos en un solo año calendario?
  choices:
    A: 8 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: C
  explanation: Un conductor adulto (21+) enfrentará una suspensión de licencia si
    acumula 12 puntos en un año calendario.
- id: 20
  category: license_system
  question: ¿A un conductor de entre 18 y 20 años se le suspenderá la licencia si
    acumula cuántos puntos dentro de un solo año calendario?
  choices:
    A: 6 puntos
    B: 9 puntos
    C: 12 puntos
    D: 15 puntos
  answer: B
  explanation: Los conductores de 18, 19 o 20 años están sujetos a suspensión si acumulan
    9 puntos en un año calendario.
- id: 21
  category: license_system
  question: Si un conductor de New Hampshire tiene una discapacidad física que limita
    su visión a un solo ojo, ¿cuál es la agudeza visual mínima requerida en ese ojo
    para aprobar el examen de la vista?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: B
  explanation: Si bien 20/40 es el estándar para ambos ojos, si una persona tiene
    visión en un solo ojo, debe tener al menos una visión de 20/30 en ese ojo para
    aprobar.
- id: 22
  category: license_system
  question: Bajo la ley de 'Infractor Habitual' (Habitual Offender) de New Hampshire,
    la licencia de una persona puede ser revocada de 1 a 4 años si es condenada por
    ¿cuántas infracciones de tráfico 'graves' dentro de un período de 5 años?
  choices:
    A: '2'
    B: '3'
    C: '4'
    D: '5'
  answer: B
  explanation: La ley de Infractor Habitual se aplica a los conductores que acumulan
    3 condenas por infracciones de tráfico graves (como conducir bajo los efectos
    del alcohol [DWI] o conducción temeraria) en un período de 5 años.
- id: 23
  category: license_system
  question: 'En New Hampshire, si cambia su nombre legal debido a matrimonio u orden
    judicial, debe notificar al DMV y solicitar una licencia de reemplazo dentro de:'
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley de New Hampshire exige que los conductores notifiquen al DMV
    un cambio de nombre en un plazo de 30 días.
- id: 24
  category: license_system
  question: Para calificar para una licencia de conducir de New Hampshire, un solicitante
    menor de 18 años debe completar un programa de educación vial que consista en
    al menos ¿cuántas horas de instrucción en el aula?
  choices:
    A: 20 horas
    B: 30 horas
    C: 40 horas
    D: 50 horas
  answer: B
  explanation: El programa de educación vial aprobado por el estado requiere un mínimo
    de 30 horas de instrucción en el aula.
- id: 25
  category: license_system
  question: Además del tiempo en el aula y al volante, ¿cuántas horas de 'observación'
    (ver a otro estudiante conducir) se requieren en un curso de educación vial de
    New Hampshire?
  choices:
    A: 4 horas
    B: 6 horas
    C: 8 horas
    D: 10 horas
  answer: B
  explanation: La educación vial de New Hampshire requiere 6 horas de tiempo de observación
    en el vehículo.
- id: 26
  category: license_system
  question: Antes de solicitar una licencia, una persona menor de 18 años debe registrar
    ¿cuántas horas totales de práctica de conducción supervisada (excluyendo el tiempo
    de educación vial)?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: B
  explanation: La ley de NH requiere 40 horas de práctica de conducción supervisada,
    10 de las cuales deben ser de noche, además de las horas dedicadas a un curso
    de educación vial.
- id: 27
  category: license_system
  question: ¿Cuál es la edad mínima en la que un residente de New Hampshire puede
    solicitar una tarjeta de identificación para no conductores?
  choices:
    A: 10 años
    B: 12 años
    C: 14 años
    D: 16 años
  answer: B
  explanation: Cualquier residente de New Hampshire de 12 años de edad o más puede
    solicitar una tarjeta de identificación con foto para no conductores.
- id: 28
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para obtener una licencia de ciclomotor
    (Moped) de New Hampshire?
  choices:
    A: Debe tener al menos 15 años de edad
    B: Debe tener al menos 16 años de edad
    C: Debe completar un curso de seguridad de 20 horas
    D: Debe poseer primero una licencia válida de Clase D
  answer: B
  explanation: Para operar un ciclomotor en NH, debe tener al menos 16 años y poseer
    una licencia de conducir válida o una licencia especial para ciclomotores.
- id: 29
  category: license_system
  question: ¿Cuántos puntos de demérito se asignan al historial de un conductor de
    New Hampshire por 'No ceder el paso'?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: No ceder el paso es una infracción de 4 puntos en el sistema de puntos
    de demérito de New Hampshire.
- id: 30
  category: license_system
  question: Si es menor de 18 años y solicita una licencia de conducir de New Hampshire,
    ¿quién debe firmar el 'Certificado de Autorización Parental'?
  choices:
    A: Un instructor de educación vial
    B: El director de una escuela
    C: Un padre, tutor o adulto responsable
    D: Solo un notario público
  answer: C
  explanation: Los solicitantes menores de 18 años deben contar con la firma de un
    padre, tutor legal u otro adulto responsable en el formulario de autorización
    para solicitar una licencia.
- id: 31
  category: driver_testing
  question: ¿En cuántas preguntas de opción múltiple consiste el examen de conocimientos
    del DMV de New Hampshire?
  choices:
    A: '25'
    B: '30'
    C: '40'
    D: '50'
  answer: C
  explanation: El examen de conocimientos de New Hampshire es una prueba automatizada
    en pantalla táctil que consta de 40 preguntas de opción múltiple.
- id: 32
  category: driver_testing
  question: 'Bajo la ley de Consentimiento Implícito (Implied Consent) de New Hampshire,
    si usted se niega a someterse a una prueba química de sangre, aliento u orina,
    su licencia será suspendida por al menos:'
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 2 años
  answer: B
  explanation: La ley de Consentimiento Implícito de New Hampshire establece que se
    considera que cualquier persona que opera un vehículo motorizado en el estado
    ha dado su consentimiento para realizar pruebas químicas. La negativa resulta
    en una suspensión de la licencia de 180 días por la primera infracción.
- id: 33
  category: driver_testing
  question: En una zona escolar de New Hampshire, ¿cuántas millas por hora por debajo
    del límite de velocidad habitual señalizado es el límite de velocidad durante
    los 45 minutos antes y después de la escuela?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: B
  explanation: La ley de New Hampshire exige que los conductores mantengan una velocidad
    de 10 mph por debajo del límite habitual señalizado en las zonas escolares durante
    los 45 minutos antes y después de la apertura y el cierre de la escuela.
- id: 34
  category: driver_testing
  question: 'Para mantener una distancia de seguimiento segura en condiciones normales
    de conducción, el Manual del Conductor de New Hampshire recomienda seguir al vehículo
    de adelante por al menos:'
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: New Hampshire recomienda la "regla de los cuatro segundos" para mantener
    una distancia de seguimiento segura entre su vehículo y el que está delante.
- id: 35
  category: driver_testing
  question: Al conducir en una autopista en New Hampshire, ¿con cuántos pies de antelación
    debe señalizar su intención de girar o cambiar de carril?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: En New Hampshire, debe señalizar al menos 100 pies antes de un giro
    en áreas urbanas o rurales, pero en una autopista, debe señalizar al menos 500
    pies antes de girar o cambiar de carril.
- id: 36
  category: driver_testing
  question: Al adelantar a otro vehículo en una carretera de dos carriles, ¿a cuántos
    pies de distancia de cualquier vehículo que venga en sentido contrario debe ser
    capaz de regresar a su carril?
  choices:
    A: 100 pies
    B: 150 pies
    C: 200 pies
    D: 300 pies
  answer: C
  explanation: La ley de New Hampshire exige que regrese a su carril de circulación
    después de adelantar antes de llegar a 200 pies de cualquier vehículo que se aproxime
    en dirección opuesta.
- id: 37
  category: driver_testing
  question: En New Hampshire, ¿es ilegal estacionar a menos de cuántos pies de un
    hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: De acuerdo con las regulaciones de estacionamiento de New Hampshire,
    no puede estacionar un vehículo a menos de 15 pies de un hidrante de incendios.
- id: 38
  category: driver_testing
  question: ¿A menos de cuántos pies de una señal de pare (stop), una señal de ceda
    el paso (yield) o una señal de control de tráfico no puede estacionar su vehículo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de New Hampshire prohíbe estacionar un vehículo a menos de 30
    pies de cualquier señal de pare, señal de ceda el paso o señal de control de tráfico.
- id: 39
  category: driver_testing
  question: Al conducir de noche, ¿a cuántos pies de distancia debe bajar sus luces
    altas cuando se aproxima un vehículo en sentido contrario?
  choices:
    A: 150 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de New Hampshire exige que los conductores cambien de luces
    altas a luces bajas cuando un vehículo que viene en sentido contrario se encuentra
    a menos de 500 pies.
- id: 40
  category: driver_testing
  question: 'Para pasar la inspección de vehículos de New Hampshire, los neumáticos
    deben tener una profundidad mínima de la banda de rodadura de:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 3/32 de pulgada
    D: 4/32 de pulgada
  answer: B
  explanation: La ley de New Hampshire exige que los neumáticos tengan al menos 2/32
    de pulgada de profundidad de la banda de rodadura en todas las áreas del neumático
    para pasar la inspección de seguridad.
- id: 41
  category: driver_testing
  question: ¿A cuántos pies de distancia, como mínimo, deben detenerse los conductores
    cuando un autobús escolar está detenido con las luces rojas parpadeando y el brazo
    de parada extendido?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: D
  explanation: En New Hampshire, los conductores que se aproximen a un autobús escolar
    desde cualquier dirección deben detenerse al menos a 25 pies de distancia cuando
    el autobús tiene sus luces rojas parpadeando.
- id: 42
  category: driver_testing
  question: Al rebasar una bicicleta en New Hampshire, un conductor debe mantener
    una distancia de 3 pies cuando viaja a 30 mph. Por cada 10 mph adicionales de
    velocidad, ¿cuánta distancia extra se debe añadir?
  choices:
    A: 6 pulgadas
    B: 1 pie
    C: 2 pies
    D: 3 pies
  answer: B
  explanation: La ley NH RSA 265:143-a exige 3 pies de distancia a 30 mph, y 1 pie
    adicional de distancia por cada 10 mph por encima de las 30 mph.
- id: 43
  category: driver_testing
  question: 'Para un propietario individual, el registro de un vehículo en New Hampshire
    vence anualmente el:'
  choices:
    A: 31 de diciembre
    B: El último día del mes de nacimiento del propietario
    C: Un año después de la fecha de compra
    D: 1 de enero
  answer: B
  explanation: En New Hampshire, los registros de vehículos para individuos vencen
    el último día del mes de nacimiento del propietario.
- id: 44
  category: driver_testing
  question: 'En New Hampshire, se considera que una persona de 21 años o más está
    legalmente intoxicada si su concentración de alcohol en sangre (BAC) es de:'
  choices:
    A: 0.02% o superior
    B: 0.05% o superior
    C: 0.08% o superior
    D: 0.10% o superior
  answer: C
  explanation: Para los conductores de 21 años o más, el límite legal de concentración
    de alcohol en sangre (BAC) en New Hampshire es de 0.08%.
- id: 45
  category: driver_testing
  question: Según el Manual del Conductor de New Hampshire, ¿cuál es el requisito
    mínimo de visión para un solicitante que tiene vista en un solo ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    emergency: 20/50
  answer: B
  explanation: En New Hampshire, si un solicitante tiene vista en un solo ojo, debe
    tener una agudeza visual de al menos 20/30 para aprobar el examen de la vista.
- id: 46
  category: driver_testing
  question: 'Durante el examen de conducción de New Hampshire, el vehículo proporcionado
    por el solicitante debe tener un freno de estacionamiento que esté:'
  choices:
    A: Solo electrónico
    B: Ubicado en el piso a la izquierda del conductor
    C: Accesible para el examinador entre los asientos delanteros
    D: Enganchado automáticamente cuando el coche está en Park (estacionamiento)
  answer: C
  explanation: La ley de New Hampshire exige que el vehículo utilizado para el examen
    de conducción tenga un freno de estacionamiento ubicado de tal manera que el examinador
    pueda ayudar a detener el vehículo si es necesario.
- id: 47
  category: driver_testing
  question: El examen de conocimientos automatizado (escrito) de New Hampshire consta
    de 40 preguntas de opción múltiple. ¿Cuánto tiempo se asigna para completar este
    examen?
  choices:
    A: 20 minutos
    B: 30 minutos
    C: 40 minutos
    D: 60 minutos
  answer: C
  explanation: Los solicitantes disponen de 40 minutos para completar el examen de
    conocimientos automatizado de 40 preguntas en el DMV.
- id: 48
  category: driver_testing
  question: Si un solicitante reprueba cualquier parte del examen de conducir de New
    Hampshire (visión, conocimientos o conducción), ¿cuánto tiempo debe esperar antes
    de ser elegible para volver a tomarlo?
  choices:
    A: 24 horas
    B: 3 días
    C: 7 días
    D: 10 días
  answer: D
  explanation: La política del DMV de New Hampshire exige un período de espera de
    10 días antes de que un solicitante pueda volver a tomar una parte reprobada del
    examen de conducir.
- id: 49
  category: driver_testing
  question: En New Hampshire, los vehículos motorizados deben ser inspeccionados una
    vez al año. ¿En qué mes debe realizarse la inspección?
  choices:
    A: Enero
    B: El mes de nacimiento del propietario
    C: El mes en que se compró el vehículo
    D: Diciembre
  answer: B
  explanation: La ley de New Hampshire exige que las inspecciones anuales de los vehículos
    se completen durante el mes de nacimiento del propietario.
- id: 50
  category: driver_testing
  question: Bajo la ley de dispositivos electrónicos de manos libres de New Hampshire,
    ¿cuál es la multa por una primera infracción por usar un dispositivo móvil portátil
    mientras se conduce?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: La multa por una primera infracción de violación de la ley de manos
    libres (RSA 265:79-c) es de $100, más una evaluación de penalización.
- id: 51
  category: driver_testing
  question: La ley de 'Hacerse a un lado' (Move Over) de New Hampshire exige que los
    conductores dejen libre el carril contiguo a un vehículo de emergencia estacionado.
    ¿Cuál es la multa mínima por una primera infracción de esta ley?
  choices:
    A: $50
    B: $75
    C: $150
    D: $200
  answer: B
  explanation: La multa por una primera infracción por no ceder el paso o no moverse
    de carril ante un vehículo de emergencia con luces intermitentes es de $75 más
    la evaluación de la penalización.
- id: 52
  category: driver_testing
  question: Una persona puede ser declarada 'Infractor Habitual' (Habitual Offender)
    en New Hampshire y perder sus privilegios de conducción hasta por 4 años si acumula
    ¿cuántas condenas de tráfico 'graves' en un periodo de 5 años?
  choices:
    A: '2'
    B: '3'
    C: '5'
    D: '10'
  answer: B
  explanation: Según la ley RSA 259:39, una persona que acumula 3 condenas de tráfico
    graves (como DUI o conducción temeraria) en un plazo de 5 años es clasificada
    como Infractor Habitual.
- id: 53
  category: driver_testing
  question: 'Para una primera condena por DUI (conducir bajo la influencia) en New
    Hampshire, el tribunal revocará la licencia del conductor por un periodo mínimo
    de:'
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 1 año
  answer: C
  explanation: Una primera condena por DUI en New Hampshire conlleva una revocación
    obligatoria de la licencia por un periodo mínimo de 9 meses.
- id: 54
  category: driver_testing
  question: El Manual del Conductor de New Hampshire recomienda que los conductores
    sujeten el volante en qué posiciones del reloj para reducir el riesgo de lesiones
    por una bolsa de aire (airbag)?
  choices:
    A: 10 y 2
    B: 9 y 3 u 8 y 4
    C: 12 y 6
    D: 7 y 5
  answer: B
  explanation: El Manual del Conductor de NH recomienda las posiciones 9 y 3 u 8 y
    4 para mantener las manos alejadas de la parte superior del volante, que es donde
    se despliega la bolsa de aire.
- id: 55
  category: driver_testing
  question: Bajo condiciones normales de conducción en New Hampshire, ¿cuál es la
    distancia de seguimiento recomendada detrás del vehículo que va delante de usted?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: La longitud de 1 vehículo por cada 10 mph
  answer: C
  explanation: El Manual del Conductor de New Hampshire recomienda una distancia de
    seguimiento mínima de 4 segundos en condiciones normales.
- id: 56
  category: driver_responsibility
  question: En New Hampshire, si se le requiere presentar una prueba de responsabilidad
    financiera (seguro SR-22) después de una condena o accidente, ¿durante cuántos
    años debe mantener generalmente esta prueba?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Según la ley de New Hampshire, cuando se requiere que un conductor
    proporcione una prueba de responsabilidad financiera (SR-22), esta debe mantenerse
    generalmente por un periodo de 3 años.
- id: 57
  category: driver_responsibility
  question: Al registrar un vehículo motorizado en New Hampshire, ¿cuál es el primer
    paso que debe dar un residente?
  choices:
    A: Visitar directamente la oficina estatal del DMV
    B: Visitar al Secretario Municipal o de la Ciudad (Town or City Clerk) para pagar
      las tarifas de permisos locales
    C: Hacer que inspeccionen el vehículo en una gasolinera
    D: Enviar por correo una copia del título a la oficina del Gobernador
  answer: B
  explanation: New Hampshire es un estado de registro de dos pasos. Los residentes
    deben acudir primero a su Secretario Municipal o de la Ciudad local para pagar
    las tarifas de permisos locales antes de completar el registro en el DMV estatal.
- id: 58
  category: driver_responsibility
  question: Según la ley de New Hampshire, ¿en qué mes debe inspeccionarse anualmente
    un vehículo de propiedad privada?
  choices:
    A: Enero
    B: El mes de nacimiento del propietario
    C: El mes en que se compró el vehículo
    D: Diciembre
  answer: B
  explanation: New Hampshire requiere inspecciones anuales de seguridad y emisiones
    de los vehículos, las cuales deben completarse antes de que finalice el mes de
    nacimiento del propietario.
- id: 59
  category: driver_responsibility
  question: Bajo la ley de 'Consentimiento Implícito' (Implied Consent) de New Hampshire,
    ¿cuál es la sanción por negarse por primera vez a someterse a una prueba de aliento,
    sangre u orina cuando lo solicita un oficial de la ley?
  choices:
    A: Una suspensión de la licencia por 90 días
    B: Una suspensión de la licencia por 180 días
    C: Una sentencia obligatoria de 2 días de cárcel
    D: Solo una multa de $1,000
  answer: B
  explanation: Al conducir en las carreteras de New Hampshire, usted ha dado su 'consentimiento
    implícito' para realizarse pruebas. La negativa a someterse a una prueba resulta
    en una suspensión administrativa de la licencia de 180 días por la primera infracción.
- id: 60
  category: driver_responsibility
  question: La ley de New Hampshire prohíbe el transporte de un contenedor abierto
    de alcohol en ¿qué parte del vehículo?
  choices:
    A: El maletero (cajuela)
    B: El área de pasajeros
    C: Una guantera cerrada con llave
    D: Detrás del último asiento vertical de un vehículo con puerta trasera (hatchback)
  answer: B
  explanation: Es ilegal tener un contenedor abierto de alcohol en el área de pasajeros
    de un vehículo. Debe guardarse en el maletero o, en vehículos sin maletero, en
    el área menos accesible para el conductor.
- id: 61
  category: driver_responsibility
  question: Si a un conductor de New Hampshire se le exige tener un seguro de responsabilidad
    civil, ¿cuáles son los límites mínimos de cobertura exigidos por la ley?
  choices:
    A: 10/20/10 ($10k/$20k/$10k)
    B: 15/30/15 ($15k/$30k/$15k)
    C: 25/50/25 ($25k/$50k/$25k)
    D: 50/100/50 ($50k/$100k/$50k)
  answer: C
  explanation: En New Hampshire, los límites legales mínimos para el seguro de responsabilidad
    civil de vehículos motorizados son $25,000 por lesiones corporales a una persona,
    $50,000 por lesiones corporales a dos o más personas y $25,000 por daños a la
    propiedad.
- id: 62
  category: driver_responsibility
  question: 'En New Hampshire, un conductor puede ser acusado de ''DWI agravado''
    si conduce con una concentración de alcohol en sangre (BAC) de:'
  choices:
    A: 0.08% o superior
    B: 0.10% o superior
    C: 0.12% o superior
    D: 0.16% o superior
  answer: D
  explanation: Una persona puede ser acusada de DWI agravado en New Hampshire si su
    BAC es de 0.16% o superior, o si excede el límite de velocidad o se ve involucrada
    en un accidente mientras está intoxicada.
- id: 63
  category: driver_responsibility
  question: ¿Cuál es la multa mínima para una persona declarada culpable de arrojar
    basura desde un vehículo motorizado en las carreteras de New Hampshire?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: La ley RSA 265:102 de New Hampshire establece que cualquier persona
    que viole la ley sobre arrojar basura será culpable de una infracción y podrá
    ser multada con un mínimo de $250.
- id: 64
  category: driver_responsibility
  question: En New Hampshire, ¿cuál es la multa mínima por una primera infracción
    de estacionarse en un espacio designado para personas con discapacidades sin la
    placa o el cartel (placard) adecuado?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: Según la RSA 265:74, la multa mínima por estacionamiento no autorizado
    en un espacio reservado para personas con discapacidades es de $250.
- id: 65
  category: driver_responsibility
  question: 'Si un conductor menor de 21 años es condenado por transportar alcohol
    en un vehículo motorizado (y no está acompañado por un padre, tutor o cónyuge
    de edad legal), su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: La ley de New Hampshire (RSA 265-A:45) exige una suspensión de la licencia
    de 60 días para cualquier persona menor de 21 años condenada por transportar alcohol.
- id: 66
  category: driver_responsibility
  question: Cuando un residente de New Hampshire compra un vehículo a un particular,
    puede obtener un registro temporal (placa de 20 días) del DMV. ¿Por cuánto tiempo
    es válida esta placa?
  choices:
    A: 10 días
    B: 15 días
    C: 20 días
    D: 30 días
  answer: C
  explanation: New Hampshire proporciona una placa de registro temporal de 20 días
    para permitir que los residentes operen un vehículo recién comprado mientras completan
    el proceso de registro permanente.
- id: 67
  category: driver_responsibility
  question: ¿Cuántos puntos de demérito se asignan por una condena por exceso de velocidad
    de 25 mph o más sobre el límite de velocidad señalizado en New Hampshire?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Conducir a 25 mph o más por encima del límite resulta en 4 puntos de
    demérito en el historial de conducción de New Hampshire. Conducir de 1 a 24 mph
    por encima del límite resulta en 3 puntos.
- id: 68
  category: driver_responsibility
  question: Aunque New Hampshire no exige que todos los conductores tengan seguro
    de auto, ¿qué sucede si un conductor sin seguro es culpable de un accidente y
    no puede pagar los daños?
  choices:
    A: El estado paga los daños por ellos
    B: La licencia y el registro del conductor serán suspendidos
    C: El conductor debe realizar 100 horas de servicio comunitario
    D: Nada, ya que el seguro no es obligatorio
  answer: B
  explanation: New Hampshire sigue una ley de 'Responsabilidad Financiera'. Si un
    conductor sin seguro es culpable de un accidente y no paga los daños, el DMV suspenderá
    su licencia y registro hasta que liquide la reclamación y presente una prueba
    de responsabilidad financiera futura (SR-22).
- id: 69
  category: driver_responsibility
  question: Aunque New Hampshire no exige que todos los conductores tengan seguro
    de auto, si se le requiere presentar una prueba de responsabilidad financiera
    después de un accidente, ¿cómo se llama el certificado que su compañía de seguros
    debe presentar ante el DMV?
  choices:
    A: Formulario 10-40
    B: SR-22
    C: NH-Accident Proof
    D: Certificado de Responsabilidad
  answer: B
  explanation: En New Hampshire, un certificado SR-22 es una forma de prueba de responsabilidad
    financiera que debe ser presentada por una compañía de seguros para las personas
    a las que la ley les exige demostrar que tienen el seguro de responsabilidad civil
    mínimo requerido.
- id: 70
  category: driver_responsibility
  question: En New Hampshire, ¿en qué mes debe inspeccionarse anualmente un vehículo
    motorizado de propiedad privada?
  choices:
    A: Enero
    B: El mes en que se compró el vehículo
    C: El mes de nacimiento del propietario
    D: Diciembre
  answer: C
  explanation: La ley de New Hampshire exige que los vehículos motorizados sean inspeccionados
    anualmente durante el mes de nacimiento del propietario.
- id: 71
  category: driver_responsibility
  question: ¿Al registrar un vehículo motorizado en New Hampshire, a dónde debe acudir
    primero un residente típicamente para pagar la tarifa del permiso local?
  choices:
    A: La Casa del Estado (State House)
    B: La sede del DMV en Concord
    C: La oficina del secretario municipal (Town or City Clerk)
    D: La estación de policía local
  answer: C
  explanation: Los residentes de New Hampshire deben acudir primero a su secretario
    municipal (Town or City Clerk) para pagar el impuesto del permiso local antes
    de completar el proceso de registro con el DMV.
- id: 72
  category: driver_responsibility
  question: 'Bajo la ley de ''Consentimiento Implícito'' (Implied Consent) de New
    Hampshire, al conducir un vehículo en el estado, usted ha dado su consentimiento
    para:'
  choices:
    A: Un registro de su vehículo en cualquier momento
    B: Que su vehículo sea confiscado por cualquier infracción de tráfico
    C: Realizar pruebas de sangre, aliento u orina para detectar alcohol o drogas
      si es arrestado por DWI
    D: Permitir que los pasajeros consuman alcohol en su vehículo
  answer: C
  explanation: La ley de Consentimiento Implícito significa que se considera que cualquier
    persona que opera un vehículo motorizado en NH ha dado su consentimiento para
    realizar pruebas químicas si es arrestada por una infracción derivada de actos
    presuntamente cometidos mientras conducía bajo la influencia (DWI).
- id: 73
  category: driver_responsibility
  question: Si un conductor de New Hampshire se niega a someterse a una prueba química
    de sangre, aliento u orina al ser arrestado por DWI, ¿por cuántos días se suspenderá
    su licencia por una primera infracción?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 365 días
  answer: C
  explanation: Bajo la ley de Consentimiento Implícito, la primera negativa a someterse
    a una prueba química resulta en una suspensión administrativa de la licencia por
    180 días.
- id: 74
  category: driver_responsibility
  question: Para un conductor de 21 años o más, ¿cuál es el límite legal de concentración
    de alcohol en sangre (BAC) en el que se considera que conduce bajo la influencia
    en New Hampshire?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En New Hampshire, es ilegal que cualquier persona de 21 años o más
    opere un vehículo con una concentración de alcohol en sangre (BAC) de 0.08% o
    superior.
- id: 75
  category: driver_responsibility
  question: Si un conductor de New Hampshire decide comprar un seguro de responsabilidad
    civil, ¿cuáles son los límites mínimos requeridos para lesiones corporales de
    una persona y para daños a la propiedad?
  choices:
    A: $10,000 / $5,000
    B: $25,000 / $25,000
    C: $50,000 / $10,000
    D: $100,000 / $50,000
  answer: B
  explanation: Los límites mínimos de responsabilidad financiera en NH son $25,000
    por lesiones corporales a una persona, $50,000 por lesiones corporales a dos o
    más personas y $25,000 por daños a la propiedad (25/50/25).
- id: 76
  category: driver_responsibility
  question: ¿Un nuevo residente de New Hampshire debe registrar su vehículo motorizado
    dentro de cuántos días después de establecer su residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Los nuevos residentes tienen un período de gracia de 60 días para registrar
    sus vehículos después de mudarse a New Hampshire.
- id: 77
  category: driver_responsibility
  question: ¿Cuál es la tarifa por un duplicado del certificado de título en New Hampshire
    si el original se pierde, es robado o se destruye?
  choices:
    A: $10
    B: $15
    C: $25
    D: $50
  answer: C
  explanation: New Hampshire cobra una tarifa de $25 por la emisión de un duplicado
    del certificado de título.
- id: 78
  category: driver_responsibility
  question: ¿Por cuánto tiempo permanecen en el historial del conductor los puntos
    de demérito asignados contra una licencia de conducir de New Hampshire por una
    condena de tráfico, a partir de la fecha del fallo?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Los puntos asignados por una condena de vehículo motorizado en New
    Hampshire se eliminan de su historial tres años después de la fecha del fallo.
- id: 79
  category: driver_responsibility
  question: Según la ley de New Hampshire, ¿dónde debe guardarse el certificado de
    registro de un vehículo motorizado?
  choices:
    A: En la residencia del propietario
    B: En la guantera del vehículo o con el conductor
    C: En el maletero del vehículo
    D: En la oficina del secretario municipal
  answer: B
  explanation: La ley de New Hampshire exige que el certificado de registro se lleve
    en el vehículo o con el conductor mientras se opera el vehículo.
- id: 80
  category: driver_responsibility
  question: Si a un conductor de New Hampshire se le requiere presentar un SR-22 como
    prueba de responsabilidad financiera, ¿por cuántos años debe mantener típicamente
    este registro?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 10 años
  answer: C
  explanation: Generalmente se requiere mantener la prueba de responsabilidad financiera
    (SR-22) por un período de tres años en New Hampshire.
- id: 81
  category: driver_responsibility
  question: ¿Cuántos días tiene un residente de New Hampshire desde la fecha de registro
    para que su vehículo sea inspeccionado cuando lo registra por primera vez?
  choices:
    A: 5 días
    B: 10 días
    C: 20 días
    D: 30 días
  answer: B
  explanation: Un vehículo debe ser inspeccionado dentro de los 10 días posteriores
    a su registro en New Hampshire.
- id: 82
  category: safe_driving_rules
  question: En New Hampshire, ¿cuál es el límite de velocidad en una zona escolar
    durante el periodo de 45 minutos antes y 45 minutos después de las sesiones escolares?
  choices:
    A: 15 mph
    B: 20 mph
    C: 10 mph por debajo del límite habitual señalizado
    D: 25 mph
  answer: C
  explanation: Según la ley NH RSA 265:60, el límite de velocidad en una zona escolar
    es 10 mph por debajo del límite habitual señalizado desde 45 minutos antes hasta
    45 minutos después de que las sesiones escolares comiencen y terminen.
- id: 83
  category: safe_driving_rules
  question: ¿A cuántos pies de un paso de peatones en una intersección está prohibido
    estacionar su vehículo en New Hampshire?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: Bajo la ley de New Hampshire, se prohíbe estacionar a menos de 20 pies
    de un paso de peatones en una intersección.
- id: 84
  category: safe_driving_rules
  question: Al estacionar cerca de una señal de pare (stop), una baliza intermitente
    o una señal de control de tráfico en New Hampshire, ¿cuál es la distancia mínima
    requerida que debe mantener?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley NH RSA 265:69 establece que no se puede estacionar a menos de
    30 pies de cualquier baliza intermitente, señal de pare o señal de control de
    tráfico ubicada al costado de la calzada.
- id: 85
  category: safe_driving_rules
  question: En New Hampshire, ¿se le prohíbe adelantar a otro vehículo cuando se encuentra
    a cuántos pies de un puente, viaducto o túnel?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley NH RSA 265:19 prohíbe conducir por el lado izquierdo de la calzada
    (adelantar) al acercarse a menos de 100 pies de cualquier puente, viaducto o túnel.
- id: 86
  category: safe_driving_rules
  question: ¿En qué periodo de tiempo exige la ley de New Hampshire que los conductores
    enciendan sus faros delanteros?
  choices:
    A: Desde la puesta del sol hasta la salida del sol
    B: Desde 1/2 hora después de la puesta del sol hasta 1/2 hora antes de la salida
      del sol
    C: Desde 1 hora después de la puesta del sol hasta 1 hora antes de la salida del
      sol
    D: Solo cuando la visibilidad es inferior a 1,000 pies
  answer: B
  explanation: Según la ley NH RSA 266:31, los faros delanteros deben estar encendidos
    desde media hora (1/2 hora) después de la puesta del sol hasta media hora (1/2
    hora) antes de la salida del sol.
- id: 87
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    un distrito comercial o de residencia urbana en New Hampshire?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: Bajo la ley NH RSA 265:60, el límite de velocidad predeterminado en
    cualquier distrito comercial o de residencia urbana es de 30 mph.
- id: 88
  category: safe_driving_rules
  question: En New Hampshire, ¿a cuántos pies de un vehículo que viene en sentido
    contrario debe bajar sus luces altas?
  choices:
    A: 150 pies
    B: 250 pies
    C: 350 pies
    D: 500 pies
  answer: A
  explanation: La ley de New Hampshire exige que los conductores cambien a luces bajas
    cuando un vehículo que viene en sentido contrario está a menos de 150 pies o cuando
    siguen a otro vehículo a menos de 150 pies.
- id: 89
  category: safe_driving_rules
  question: ¿Cuál es la multa mínima por exceso de velocidad en una zona de obras
    viales en New Hampshire?
  choices:
    A: $100
    B: $200
    C: $250
    D: $500
  answer: C
  explanation: Según la ley NH RSA 265:79-c, cualquier persona condenada por exceso
    de velocidad en una zona de obras viales será multada con no menos de $250 ni
    más de $500.
- id: 90
  category: safe_driving_rules
  question: Al acercarse a una zona escolar en New Hampshire, el límite de velocidad
    es 10 mph inferior al límite de velocidad habitual señalizado durante horarios
    específicos. ¿Cuándo se aplica esta regla?
  choices:
    A: Solo de 8:00 AM a 4:00 PM
    B: Solo cuando hay niños visibles en la acera
    C: 45 minutos antes y después de la apertura y el cierre de la escuela
    D: Desde 30 minutos antes de que comiencen las clases hasta 30 minutos después
      de que terminen
  answer: D
  explanation: 'La ley de New Hampshire establece que el límite de velocidad en una
    zona escolar es 10 mph por debajo del límite habitual señalizado desde 45 minutos
    antes de que abra la escuela hasta que comiencen las clases, y desde el momento
    en que terminan las clases hasta 45 minutos después. (Nota: El manual cita específicamente
    el intervalo de 45 minutos para el límite reducido).'
- id: 91
  category: safe_driving_rules
  question: ¿A cuántos pies de distancia, como mínimo, exige la ley de New Hampshire
    que se señalice antes de realizar un giro en una ciudad o pueblo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: En New Hampshire, debe dar una señal de giro continua durante al menos
    100 pies antes de girar. En una autopista, esta distancia aumenta a 500 pies.
- id: 92
  category: safe_driving_rules
  question: En New Hampshire, ¿a cuántos pies de distancia como mínimo debe detenerse
    de un autobús escolar que tiene sus luces rojas intermitentes encendidas y el
    brazo de parada extendido?
  choices:
    A: 15 pies
    B: 20 pies
    C: 25 pies
    D: 50 pies
  answer: C
  explanation: Los conductores en New Hampshire deben detenerse al menos a 25 pies
    de un autobús escolar que esté recogiendo o dejando pasajeros con sus luces rojas
    intermitentes encendidas.
- id: 93
  category: safe_driving_rules
  question: 'El Manual del Conductor de New Hampshire recomienda seguir al vehículo
    que va delante a una distancia de al menos:'
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: Aunque muchos estados utilizan una regla de 2 o 3 segundos, el Manual
    del Conductor de New Hampshire recomienda específicamente una distancia de seguimiento
    de 4 segundos en condiciones normales.
- id: 94
  category: safe_driving_rules
  question: Según la ley de New Hampshire, ¿cuándo debe encender los faros delanteros
    de su vehículo?
  choices:
    A: Desde la puesta del sol hasta el amanecer
    B: Desde una hora después de la puesta del sol hasta una hora antes del amanecer
    C: Desde 30 minutos después de la puesta del sol hasta 30 minutos antes del amanecer
    D: Solo cuando la visibilidad sea inferior a 1,000 pies
  answer: C
  explanation: La ley de New Hampshire exige que los faros estén encendidos desde
    30 minutos después de la puesta del sol hasta 30 minutos antes del amanecer, y
    en cualquier momento en que no pueda ver claramente a 1,000 pies.
- id: 95
  category: safe_driving_rules
  question: En New Hampshire, ¿está prohibido estacionar a menos de cuántos pies de
    una señal de pare (stop), una baliza intermitente o una señal de ceda el paso
    (yield)?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de New Hampshire prohíbe estacionar a menos de 30 pies de cualquier
    señal de pare, señal de ceda el paso o señal de control de tráfico.
- id: 96
  category: safe_driving_rules
  question: En New Hampshire, ¿a cuántos pies de la entrada de la entrada de cualquier
    estación de bomberos no debe estacionar?
  choices:
    A: 20 pies en el mismo lado de la calle
    B: 50 pies en el mismo lado de la calle
    C: 100 pies en el lado opuesto de la calle
    D: 15 pies en cualquier lado
  answer: A
  explanation: La ley de New Hampshire establece que no se puede estacionar a menos
    de 20 pies de la entrada de una estación de bomberos en el mismo lado de la calle,
    ni a menos de 75 pies en el lado opuesto de la calle.
- id: 97
  category: defensive_driving
  question: Según el Manual del Conductor de New Hampshire, ¿cuál es la distancia
    de seguimiento recomendada detrás del vehículo que va delante en condiciones ideales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de New Hampshire recomienda utilizar la 'regla
    de los cuatro segundos' para mantener una distancia de seguimiento segura en condiciones
    de conducción ideales.
- id: 98
  category: defensive_driving
  question: Para observar la carretera adecuadamente y evitar frenazos o giros de
    último momento, las leyes y pautas de seguridad de New Hampshire sugieren mirar
    con cuántos segundos de antelación?
  choices:
    A: 5 segundos
    B: 10 segundos
    C: 15 segundos
    D: 30 segundos
  answer: C
  explanation: Los conductores deben mirar unos 15 segundos por delante de su vehículo
    para identificar posibles peligros a tiempo, lo que equivale aproximadamente a
    una cuadra de la ciudad o un cuarto de milla en la autopista.
- id: 99
  category: defensive_driving
  question: 'El hidroplaneo (hydroplaning), donde los neumáticos pierden contacto
    con la superficie de la carretera y se deslizan sobre una capa de agua, puede
    comenzar a velocidades tan bajas como:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: En los manuales de seguridad de New Hampshire, se señala que el hidroplaneo
    puede comenzar a velocidades tan bajas como 35 mph, y los neumáticos pueden perder
    todo contacto con la carretera a 55 mph.
- id: 100
  category: defensive_driving
  question: Según la 'Ley de Jessica' de New Hampshire (RSA 265:79-b), un conductor
    puede ser multado por no limpiar la nieve o el hielo de su vehículo si esto representa
    una amenaza para los demás. ¿Cuál es la multa mínima por una primera infracción?
  choices:
    A: ' $50'
    B: ' $100'
    C: ' $250'
    D: ' $500'
  answer: C
  explanation: La Ley de Jessica exige que los conductores limpien la nieve y el hielo
    de sus vehículos. Una primera infracción conlleva una multa no inferior a $250
    ni superior a $500.
- id: 101
  category: defensive_driving
  question: Al conducir con niebla densa en New Hampshire, ¿qué ajuste de los faros
    debe utilizar para mantener la mejor visibilidad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Sin luces
  answer: B
  explanation: Se deben usar las luces bajas en la niebla. Las luces altas se reflejan
    en las partículas de niebla y causan deslumbramiento, lo que dificulta la visión
    del conductor.
- id: 102
  category: defensive_driving
  question: Si conduce a 55 mph, ¿aproximadamente cuántos pies recorrerá su vehículo
    en el tiempo que le toma a un conductor promedio reaccionar ante un peligro y
    aplicar los frenos?
  choices:
    A: 20 pies
    B: 60 pies
    C: 120 pies
    D: 200 pies
  answer: B
  explanation: A 55 mph, la distancia de reacción (la distancia recorrida antes de
    aplicar los frenos) es de aproximadamente 60 pies.
- id: 103
  category: defensive_driving
  question: 'Para revisar su "punto ciego" (blind spot) antes de cambiar de carril
    en New Hampshire, usted debe:'
  choices:
    A: Revisar su espejo retrovisor
    B: Revisar su espejo lateral
    C: Girar la cabeza y mirar por encima del hombro
    D: Tocar la bocina para advertir a los demás
  answer: C
  explanation: Los espejos no lo muestran todo. Para revisar correctamente un punto
    ciego, debe girar la cabeza y mirar por encima del hombro en la dirección en la
    que planea moverse.
- id: 104
  category: defensive_driving
  question: ¿Qué exige la ley "Move Over" de New Hampshire a los conductores cuando
    se aproximan a vehículos de emergencia detenidos con luces intermitentes?
  choices:
    A: Mantener la velocidad pero moverse al carril izquierdo
    B: Detenerse inmediatamente en la calzada
    C: Desocupar el carril tan pronto como sea seguro y reducir la velocidad
    D: Acelerar para rebasar el vehículo rápidamente
  answer: C
  explanation: La ley RSA 265:37-a exige que los conductores se muevan a un carril
    que no sea adyacente al vehículo de emergencia si es posible, y que reduzcan la
    velocidad a un nivel que sea seguro para las condiciones.
- id: 105
  category: defensive_driving
  question: 'En New Hampshire, si ve a un peatón que utiliza un perro guía o lleva
    un bastón blanco (con o sin punta roja), usted debe:'
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Ceder el paso y tomar precauciones para evitar lesiones
    C: Esperar a que le hagan una señal para pasar
    D: Solo detenerse si están en un cruce de peatones marcado
  answer: B
  explanation: Según la ley RSA 265:41, los conductores deben ceder el paso a cualquier
    peatón total o parcialmente ciego que lleve un bastón o utilice un perro guía,
    independientemente de por dónde esté cruzando.
- id: 106
  category: defensive_driving
  question: 'Si su vehículo comienza a derrapar en una carretera resbaladiza de New
    Hampshire, la respuesta correcta de conducción defensiva es:'
  choices:
    A: Frenar a fondo inmediatamente
    B: Girar el volante en la dirección en la que se desliza la parte trasera del
      vehículo
    C: Girar el volante en la dirección opuesta al deslizamiento
    D: Poner el coche en punto muerto (neutral)
  answer: B
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar el volante en la dirección en la que se desliza la parte trasera del vehículo.
- id: 107
  category: defensive_driving
  question: Al acercarse a un cruce de ferrocarril con luces intermitentes o una barrera
    que baja, la ley de New Hampshire exige que detenga su vehículo a qué distancia
    del riel más cercano?
  choices:
    A: Entre 5 y 10 pies
    B: Entre 15 y 50 pies
    C: Exactamente 25 pies
    D: Al menos 100 pies
  answer: B
  explanation: La ley RSA 265:48 exige que los conductores se detengan a no menos
    de 15 pies y no más de 50 pies del riel más cercano de un cruce de ferrocarril
    cuando las señales indican que se acerca un tren.
- id: 108
  category: defensive_driving
  question: Los conductores de New Hampshire que completen con éxito un Curso de Mejora
    para Conductores aprobado pueden ser elegibles para una reducción de ¿cuántos
    puntos de su historial de conducción?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: El DMV de New Hampshire permite una reducción de 3 puntos para los
    conductores que completen voluntariamente un curso aprobado de conducción defensiva
    o mejora para conductores.
- id: 109
  category: defensive_driving
  question: Para evitar la necesidad de frenar o girar en el último minuto en New
    Hampshire, debe mirar hacia adelante en la carretera al menos ¿cuántos segundos?
  choices:
    A: 5 segundos
    B: 10 segundos
    C: 15 segundos
    D: 30 segundos
  answer: C
  explanation: El Manual del Conductor de New Hampshire establece que los conductores
    seguros intentan mirar al menos 15 segundos hacia adelante para anticipar peligros.
- id: 110
  category: defensive_driving
  question: Bajo la "Ley de Jessica" de New Hampshire, ¿qué debe hacer un conductor
    antes de operar un vehículo durante condiciones invernales?
  choices:
    A: Calentar el motor durante al menos 10 minutos
    B: Limpiar toda la nieve y el hielo de todo el vehículo
    C: Solo limpiar el parabrisas y las ventanas laterales delanteras
    D: Encender las luces de emergencia mientras conduce en la nieve
  answer: B
  explanation: La Ley de Jessica (RSA 265:79-b) exige que los conductores limpien
    toda la nieve y el hielo de todo el vehículo para que no represente un peligro
    para los demás; no hacerlo puede resultar en multas significativas.
- id: 111
  category: defensive_driving
  question: 'El Manual del Conductor de New Hampshire establece que el tiempo promedio
    de percepción-reacción para que un conductor vea un peligro y aplique los frenos
    es de:'
  choices:
    A: 1/4 de segundo
    B: 1/2 segundo
    C: 3/4 de segundo
    D: 1 segundo completo
  answer: C
  explanation: El manual utiliza 3/4 de segundo como el tiempo de reacción promedio
    estándar para los cálculos relacionados con las distancias de frenado.
- id: 112
  category: defensive_driving
  question: 'Al adelantar a otro vehículo en New Hampshire, no debe regresar al carril
    derecho hasta que:'
  choices:
    A: Haya pasado el vehículo por 10 pies
    B: Pueda ver los faros delanteros del vehículo que adelantó en su espejo retrovisor
    C: El otro conductor le haga señales con las luces
    D: Haya recorrido al menos 100 pies
  answer: B
  explanation: El Manual del Conductor de NH instruye a los conductores a esperar
    hasta que puedan ver los faros delanteros del vehículo adelantado en su espejo
    retrovisor antes de regresar al carril.
- id: 113
  category: defensive_driving
  question: 'En New Hampshire, los neumáticos de un vehículo se consideran inseguros
    si la profundidad de la banda de rodadura es inferior a:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de New Hampshire (RSA 266:51) exige que los neumáticos tengan
    al menos 2/32 de pulgada de profundidad de banda de rodadura en todas las ranuras
    principales.
- id: 114
  category: defensive_driving
  question: Al estacionar su vehículo en una vía pública en New Hampshire, ¿a cuántas
    pulgadas del bordillo (curb) como máximo deben estar las ruedas?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: La ley de New Hampshire exige que los vehículos se estacionen en paralelo
    al bordillo y a una distancia no mayor de 12 pulgadas de este.
- id: 115
  category: alcohol_drugs_health
  question: 'En New Hampshire, una persona es culpable de DWI Agravado si conduce
    con una concentración de alcohol en sangre (BAC) de al menos:'
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.16%
    D: 0.20%
  answer: C
  explanation: Si bien el límite legal es 0.08%, la norma NH RSA 265-A:3 define el
    DWI Agravado como la operación de un vehículo con un BAC de 0.16% o superior.
- id: 116
  category: alcohol_drugs_health
  question: Según la ley de New Hampshire, si un vehículo no tiene maletero, ¿dónde
    debe guardarse un recipiente abierto de una bebida alcohólica?
  choices:
    A: En la guantera
    B: Debajo del asiento del conductor
    C: Detrás del último asiento vertical
    D: En un portavasos, siempre que el conductor no esté bebiendo de él
  answer: C
  explanation: La norma NH RSA 265-A:44 establece que si un vehículo no tiene maletero,
    los recipientes abiertos deben mantenerse detrás del último asiento vertical o
    en un área que no esté ocupada normalmente por el conductor o los pasajeros.
- id: 117
  category: alcohol_drugs_health
  question: 'A una persona condenada por una primera ofensa de DWI en New Hampshire
    se le revocará la licencia de conducir por un período de al menos:'
  choices:
    A: 60 días
    B: 90 días
    C: 6 meses
    D: 9 meses
  answer: D
  explanation: La norma NH RSA 265-A:18 exige una revocación de la licencia de no
    menos de 9 meses y hasta 2 años por una condena de DWI por primera vez.
- id: 118
  category: alcohol_drugs_health
  question: 'En New Hampshire, un conductor puede ser acusado de DWI Agravado si conduce
    bajo los efectos del alcohol o drogas y transporta a un pasajero menor de:'
  choices:
    A: 12 años
    B: 16 años
    C: 18 años
    D: 21 años
  answer: B
  explanation: La norma NH RSA 265-A:3 establece que una persona es culpable de DWI
    Agravado si conduce bajo los efectos del alcohol o drogas y transporta a una persona
    menor de 16 años.
- id: 119
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la marihuana
    y la conducción en New Hampshire?
  choices:
    A: Es legal conducir bajo la influencia de la marihuana si tiene una tarjeta médica
    B: La marihuana solo afecta la conducción si se combina con alcohol
    C: Conducir bajo la influencia de la marihuana es una ofensa de DWI
    D: La marihuana no afecta el tiempo de reacción
  answer: C
  explanation: En New Hampshire, las leyes de DWI se aplican tanto al alcohol como
    a las drogas controladas, incluida la marihuana, independientemente de si se usa
    con fines medicinales o recreativos.
- id: 120
  category: alcohol_drugs_health
  question: 'Cuando el alcohol se combina con otras drogas, el efecto en el cuerpo
    suele ser:'
  choices:
    A: Reducido
    B: Anulado
    C: Mayor que la suma de los dos (sinérgico)
    D: Exactamente el mismo que el del alcohol solo
  answer: C
  explanation: El 'efecto sinérgico' significa que la combinación de alcohol y drogas
    puede multiplicar los efectos del deterioro, lo que lo hace mucho más peligroso
    que usar cualquiera de las sustancias por separado.
- id: 121
  category: alcohol_drugs_health
  question: 'Si un conductor mayor de 21 años se somete a una prueba química y los
    resultados muestran un BAC de 0.08% o superior, el DMV emitirá una Suspensión
    Administrativa de la Licencia (ALS) por:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: La ley NH RSA 265-A:30 estipula que no pasar una prueba química por
    primera vez (0.08% o superior) resulta en una suspensión administrativa de 6 meses.
- id: 122
  category: alcohol_drugs_health
  question: Además del nivel de BAC, ¿cuál de las siguientes acciones puede resultar
    en un cargo de DWI Agravado en New Hampshire?
  choices:
    A: Conducir a 10 mph sobre el límite de velocidad
    B: Conducir a 30 mph o más sobre el límite de velocidad
    C: Conducir con una luz trasera rota
    D: Conducir sin un registro válido
  answer: B
  explanation: La ley NH RSA 265-A:3 incluye conducir a 30 mph o más sobre el límite
    de velocidad prima facie mientras se está bajo los efectos del alcohol como criterio
    para un DWI Agravado.
- id: 123
  category: alcohol_drugs_health
  question: 'Bajo la ley de New Hampshire, una persona menor de 21 años que sea sorprendida
    transportando alcohol en un vehículo motorizado (y no esté acompañada por un padre/tutor
    legal o sea mayor de edad) se enfrenta a una suspensión de la licencia de:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: La ley NH RSA 265-A:45 establece que a una persona menor de 21 años
    que transporte alcohol se le suspenderá la licencia por 60 días por una primera
    infracción.
- id: 124
  category: alcohol_drugs_health
  question: Para que se le restituya la licencia después de una condena por DWI en
    New Hampshire, ¿qué programa debe completar el conductor?
  choices:
    A: El Curso de Manejo Defensivo del Consejo Nacional de Seguridad
    B: El Programa de Intervención para Conductores Bajo los Efectos del Alcohol (IDIP)
    C: Un curso estándar de educación vial de 30 horas
    D: Un programa de servicio comunitario de 100 horas
  answer: B
  explanation: La ley de NH exige que los condenados por DWI completen un Programa
    de Intervención para Conductores Bajo los Efectos del Alcohol (IDIP) o un programa
    equivalente antes de que se les pueda restituir la licencia.
- id: 125
  category: alcohol_drugs_health
  question: ¿Puede un conductor en New Hampshire ser condenado por DWI por conducir
    bajo la influencia de medicamentos recetados?
  choices:
    A: No, siempre que el medicamento haya sido recetado por un médico
    B: No, el DWI solo se aplica a drogas ilegales y alcohol
    C: Sí, si el medicamento afecta la capacidad de la persona para conducir de manera
      segura
    D: Solo si el medicamento es un narcótico
  answer: C
  explanation: La ley NH RSA 265-A:2 se aplica a cualquier droga controlada, medicamento
    recetado o medicamento de venta libre que afecte la capacidad de una persona para
    operar un vehículo motorizado.
- id: 126
  category: alcohol_drugs_health
  question: 'Si una persona es condenada por una segunda infracción de DWI en New
    Hampshire dentro de un período de 10 años, la revocación mínima de la licencia
    es de:'
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Según la ley NH RSA 265-A:18, una segunda condena por DWI dentro de
    10 años resulta en una revocación de la licencia de no menos de 3 años.
- id: 127
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes condiciones daría lugar a un cargo de 'DWI Agravado'
    en el estado de New Hampshire?
  choices:
    A: Conducir con un BAC de 0.16% o superior
    B: Conducir con un BAC de 0.08%
    C: Conducir con auriculares puestos
    D: Conducir con un registro vencido mientras se está intoxicado
  answer: A
  explanation: Bajo la ley de NH, el DWI Agravado incluye conducir con un BAC de 0.16%
    o más, o conducir a más de 30 mph sobre el límite de velocidad mientras se está
    intoxicado, entre otros factores.
- id: 128
  category: alcohol_drugs_health
  question: 'Si se descubre que un conductor de New Hampshire tiene una droga controlada
    en su posesión mientras opera un vehículo motorizado, su licencia será revocada
    por un período de:'
  choices:
    A: 30 días a 90 días
    B: 60 días a 2 años
    C: Exactamente 1 año
    D: De por vida
  answer: B
  explanation: Según la ley NH RSA 265-A:43, cualquier persona que opere un vehículo
    motorizado mientras tenga en su posesión cualquier droga controlada verá su licencia
    revocada por un período de no menos de 60 días y no más de 2 años.
- id: 129
  category: alcohol_drugs_health
  question: 'La ley de ''Contenedor Abierto'' de New Hampshire prohíbe la posesión
    de un contenedor abierto de alcohol en el área de pasajeros de un vehículo por
    parte de:'
  choices:
    A: Solo el conductor
    B: Solo los pasajeros
    C: Tanto el conductor como los pasajeros
    D: Solo conductores menores de 21 años
  answer: C
  explanation: La ley NH RSA 265-A:44 establece que ningún conductor o pasajero podrá
    poseer un contenedor abierto de alcohol en el área de pasajeros de un vehículo
    motorizado mientras se encuentre en una vía pública.
- id: 130
  category: alcohol_drugs_health
  question: ¿Cuál es la multa mínima por una condena de DWI (Conducir Bajo los Efectos
    del Alcohol) por primera vez en New Hampshire?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,000
  answer: B
  explanation: Según la ley NH RSA 265-A:18, una condena por DWI por primera vez conlleva
    una multa mínima de $500.
- id: 131
  category: alcohol_drugs_health
  question: 'En New Hampshire, si tiene una negativa previa o una condena previa por
    DWI en su registro dentro de los últimos 10 años, una negativa posterior a someterse
    a una prueba química resultará en una suspensión de:'
  choices:
    A: 180 días
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: Según NH RSA 265-A:14, si hay una negativa previa o una condena relacionada
    con el alcohol en el registro del conductor, la suspensión por una negativa posterior
    es de 2 años.
- id: 132
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de mezclar alcohol con otras drogas, como medicamentos
    recetados o de venta libre?
  choices:
    A: Los efectos de cada uno se cancelan
    B: No hay cambios en el efecto sobre la conducción
    C: Puede multiplicar los efectos de ambos, aumentando significativamente el deterioro
    D: Solo afecta al conductor si las drogas son ilegales
  answer: C
  explanation: Combinar alcohol con otras drogas crea un efecto sinérgico, lo que
    significa que el deterioro combinado es mucho mayor que la suma de los efectos
    individuales.
- id: 133
  category: alcohol_drugs_health
  question: 'Una persona es culpable de DWI Agravado en New Hampshire si conduce intoxicada
    y tiene un pasajero menor de:'
  choices:
    A: '12'
    B: '16'
    C: '18'
    D: '21'
  answer: B
  explanation: La ley de New Hampshire clasifica un DWI como 'Agravado' si el conductor
    está intoxicado y transporta a una persona menor de 16 años.
- id: 134
  category: alcohol_drugs_health
  question: Cuando se consume alcohol, ¿cuál de las siguientes es la primera capacidad
    en verse afectada?
  choices:
    A: La visión
    B: La coordinación muscular
    C: El juicio y el razonamiento
    D: La audición
  answer: C
  explanation: El alcohol afecta primero las funciones superiores del cerebro, lo
    que significa que el juicio y la capacidad de razonar se deterioran antes que
    la coordinación física o la visión.
- id: 135
  category: alcohol_drugs_health
  question: En New Hampshire, ¿cuánto tiempo debe tener instalada una persona condenada
    por DWI Agravado o por un segundo DWI un Dispositivo de Interbloqueo de Encendido
    (IID) en su vehículo después del restablecimiento de la licencia?
  choices:
    A: Al menos 6 meses
    B: No menos de 12 meses ni más de 2 años
    C: Exactamente 5 años
    D: Por el resto de su vida
  answer: B
  explanation: Según NH RSA 265-A:36-a, el tribunal exigirá un Dispositivo de Interbloqueo
    de Encendido (IID) por no menos de 12 meses ni más de 2 años para casos de DWI
    Agravado o infractores reincidentes.
- id: 136
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma de reducir la Concentración
    de Alcohol en Sangre (BAC) en su cuerpo?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Hacer ejercicio vigoroso
    D: El tiempo
  answer: D
  explanation: Solo el tiempo permite que el cuerpo metabolice (oxide) el alcohol.
    El café, las duchas y el ejercicio no aceleran el proceso de reducción del BAC.
- id: 137
  category: alcohol_drugs_health
  question: 'Según la ley de New Hampshire, un conductor menor de 21 años que sea
    sorprendido transportando alcohol en cualquier parte de un vehículo puede tener
    su licencia suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: NH RSA 265-A:45 establece que una persona menor de 21 años que transporte
    alcohol (a menos que esté acompañada por un padre, tutor legal o cónyuge mayor
    de 21 años) se enfrenta a una suspensión obligatoria de la licencia de 60 días.
- id: 138
  category: alcohol_drugs_health
  question: 'Si es condenado por un DWI en New Hampshire, se le requerirá presentar
    una ''Prueba de Responsabilidad Financiera'' por un período determinado. Esto
    se conoce comúnmente como:'
  choices:
    A: Un certificado SR-22
    B: Una fianza del Título 21
    C: Una exención de responsabilidad
    D: Un comprobante de seguro del DMV
  answer: A
  explanation: Los conductores condenados por delitos relacionados con el alcohol
    en New Hampshire deben hacer que su compañía de seguros presente un certificado
    SR-22 ante el DMV para demostrar que cuentan con el seguro de responsabilidad
    civil requerido.
- id: 139
  category: penalties_and_points
  question: 'En New Hampshire, una primera condena por no detenerse ante un autobús
    escolar que tiene sus luces rojas parpadeando resulta en una suspensión obligatoria
    de la licencia de:'
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Según RSA 265:54, una primera infracción por rebasar un autobús escolar
    detenido con luces rojas parpadeantes resulta en una multa y una suspensión obligatoria
    de la licencia de 30 días.
- id: 140
  category: penalties_and_points
  question: 'Para una primera condena por DWI (Conducir Bajo la Influencia) en New
    Hampshire, el período mínimo de revocación de la licencia es de:'
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 1 año
  answer: C
  explanation: Una condena por un primer delito de DWI en New Hampshire conlleva un
    período mínimo de revocación de la licencia de 9 meses, el cual a veces puede
    reducirse tras completar un programa de intervención para conductores con facultades
    disminuidas.
- id: 141
  category: penalties_and_points
  question: ¿Si un Operador Joven (Youth Operator) menor de 21 años es condenado por
    una segunda infracción de tránsito, su licencia será suspendida por cuántos días?
  choices:
    A: 20 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: D
  explanation: 'De acuerdo con RSA 263:14, los períodos de suspensión para Operadores
    Jóvenes son: 30 días por la 1.ª infracción, 60 días por la 2.ª infracción y 90
    días por la 3.ª infracción.'
- id: 142
  category: penalties_and_points
  question: ¿Cuántos puntos de demérito se asignan por 'Desobedecer a un Oficial de
    Policía' en New Hampshire?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: D
  explanation: Desobedecer a un oficial de policía se considera una infracción mayor
    en New Hampshire y conlleva 6 puntos de demérito.
- id: 143
  category: penalties_and_points
  question: 'En New Hampshire, un conductor condenado por tener un recipiente abierto
    de alcohol en el área de pasajeros de un vehículo enfrenta una suspensión obligatoria
    de la licencia de:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: Bajo la norma RSA 265-A:44, un conductor condenado por una infracción
    de recipiente abierto enfrenta una suspensión obligatoria de la licencia de 60
    días.
- id: 144
  category: penalties_and_points
  question: Bajo la 'Ley de Jessica' (Jessica's Law) en New Hampshire, un conductor
    que no limpie la nieve o el hielo de su vehículo puede enfrentar una multa mínima
    de ¿cuánto por una primera infracción?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: La Ley de Jessica (RSA 265:79-b) conlleva una multa de $250 a $500
    por una primera infracción de Conducción Negligente relacionada con no limpiar
    la nieve o el hielo que ponga en peligro a otros.
- id: 145
  category: penalties_and_points
  question: ¿Cuántos puntos de demérito se asignan por una condena de 'Conducta Después
    de un Accidente' (Chocar y Huir o Hit and Run) en New Hampshire?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: La Conducta Después de un Accidente se considera una infracción mayor
    en New Hampshire y resulta en 6 puntos de demérito.
- id: 146
  category: penalties_and_points
  question: 'Si un conductor es condenado por una infracción de ''Recipiente Abierto''
    (llevar una bebida alcohólica sin sellar) por primera vez, su licencia será suspendida
    por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: Según RSA 265-A:44, una primera condena por una infracción de recipiente
    abierto resulta en una suspensión de la licencia de 60 días.
- id: 147
  category: penalties_and_points
  question: 'Una persona declarada como Infractor Habitual (Habitual Offender) en
    New Hampshire enfrenta una revocación obligatoria de la licencia por un período
    de:'
  choices:
    A: 6 meses a 1 año
    B: 1 a 4 años
    C: 5 años
    D: Permanentemente
  answer: B
  explanation: Una vez que una persona es declarada Infractor Habitual, su licencia
    es revocada por un mínimo de 1 año y un máximo de 4 años.
- id: 148
  category: penalties_and_points
  question: 'Si es condenado por una segunda infracción de la ley de manos libres
    dentro de un período de 24 meses en New Hampshire, la multa es de:'
  choices:
    A: $150
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: La multa por una segunda infracción de manos libres dentro de 24 meses
    es de $250 más la evaluación de la penalidad.
- id: 149
  category: sharing_the_road
  question: Bajo la ley de 'Hacerse a un Lado' (Move Over) de New Hampshire, ¿qué
    debe hacer un conductor al acercarse a un vehículo de emergencia estacionado con
    luces intermitentes en una carretera con al menos dos carriles de tráfico en la
    misma dirección?
  choices:
    A: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    B: Detenerse completamente en el carril de circulación
    C: Desocupar el carril tan pronto como sea seguro hacerlo
    D: Aumentar la velocidad para rebasar el vehículo rápidamente
  answer: C
  explanation: La norma NH RSA 265:37-a requiere que los conductores desocupen el
    carril más cercano a un vehículo de emergencia estacionado con luces intermitentes
    si es seguro hacerlo. Si no es seguro, el conductor debe reducir la velocidad
    y proceder con precaución.
- id: 150
  category: sharing_the_road
  question: Al rebasar una bicicleta en New Hampshire, ¿cuál es la distancia mínima
    que un automovilista debe mantener entre su vehículo y la bicicleta cuando viaja
    a 30 mph?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: La norma NH RSA 265:143-a requiere que los automovilistas dejen una
    distancia razonable y prudente al rebasar una bicicleta, que es de al menos 3
    pies cuando el vehículo viaja a 30 mph o menos.
- id: 151
  category: sharing_the_road
  question: En New Hampshire, por cada 10 mph de velocidad por encima de las 30 mph,
    ¿cuánta distancia adicional debe añadir un conductor al requisito mínimo de 3
    pies de distancia para adelantar bicicletas?
  choices:
    A: 6 pulgadas
    B: 1 pie
    C: 2 pies
    D: 3 pies
  answer: B
  explanation: La ley NH RSA 265:143-a establece que por cada 10 mph por encima de
    las 30 mph, el conductor deberá permitir 1 pie adicional de distancia al adelantar
    a una bicicleta.
- id: 152
  category: sharing_the_road
  question: Según la ley de New Hampshire, ¿cuál es la multa máxima por una primera
    infracción por no detenerse ante un autobús escolar con luces rojas intermitentes?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: La ley NH RSA 265:60 estipula que cualquier persona que viole la ley
    con respecto a detenerse ante un autobús escolar será multada con no menos de
    $150 ni más de $1,000 por una primera infracción.
- id: 153
  category: sharing_the_road
  question: En New Hampshire, ¿a qué edad un operador o pasajero de motocicleta ya
    no está legalmente obligado a usar un casco protector?
  choices:
    A: 16 años de edad
    B: 18 años de edad
    C: 21 años de edad
    D: Los cascos siempre son obligatorios independientemente de la edad
  answer: B
  explanation: La ley NH RSA 265:122 requiere que cualquier persona menor de 18 años
    que opere o viaje en una motocicleta use equipo de protección para la cabeza.
    Aquellos de 18 años o más no están legalmente obligados a usar casco en New Hampshire.
- id: 154
  category: sharing_the_road
  question: 'Cuando un peatón cruza una calzada dentro de un paso de peatones y no
    hay señales de control de tráfico, la ley de New Hampshire exige que el conductor:'
  choices:
    A: Reduzca la velocidad y toque la bocina
    B: Ceda el paso reduciendo la velocidad o deteniéndose
    C: Mantenga la velocidad si el peatón está en el otro carril
    D: Solo se detenga si el peatón usa un bastón blanco
  answer: B
  explanation: La ley NH RSA 265:35 requiere que los conductores cedan el paso, reduciendo
    la velocidad o deteniéndose si es necesario, a un peatón que cruza la calzada
    dentro de un paso de peatones cuando no hay señales de control de tráfico presentes.
- id: 155
  category: sharing_the_road
  question: 'En New Hampshire, el ''lane splitting'' (una motocicleta que circula
    entre dos carriles de tráfico o comparte un carril con un automóvil) es:'
  choices:
    A: Legal a velocidades inferiores a 30 mph
    B: Legal solo durante las horas pico
    C: Ilegal
    D: Legal si el conductor del automóvil le hace una señal al motociclista para
      que pase
  answer: C
  explanation: La ley NH RSA 265:121 establece que las motocicletas tienen derecho
    al uso total de un carril y ningún vehículo de motor debe conducirse de tal manera
    que prive a cualquier motocicleta del uso total de un carril. El 'lane splitting'
    está prohibido.
- id: 156
  category: sharing_the_road
  question: ¿Si está caminando por una carretera de New Hampshire donde no hay aceras,
    en qué lado de la carretera debe caminar?
  choices:
    A: El lado derecho, con el flujo del tráfico
    B: El lado izquierdo, de frente al tráfico que viene en sentido contrario
    C: El lado con el arcén más ancho
    D: Cualquier lado es aceptable siempre que use ropa brillante
  answer: B
  explanation: La ley NH RSA 265:38 requiere que los peatones, donde no haya aceras,
    caminen por el lado izquierdo de la calzada o su arcén de frente al tráfico que
    pueda aproximarse desde la dirección opuesta.
- id: 157
  category: sharing_the_road
  question: 'Una persona que monta una bicicleta en una carretera de New Hampshire
    tiene:'
  choices:
    A: Ningún derecho en la carretera y debe permanecer en la acera
    B: Los mismos derechos y deberes que el conductor de un vehículo de motor
    C: El derecho de paso sobre todos los vehículos de motor en todo momento
    D: El deber de circular en contra del flujo del tráfico
  answer: B
  explanation: La ley NH RSA 265:143 establece que a toda persona que monte una bicicleta
    en una calzada se le otorgarán todos los derechos y estará sujeta a todos los
    deberes aplicables al conductor de un vehículo.
- id: 158
  category: sharing_the_road
  question: 'Al seguir a un camión grande en New Hampshire, si no puede ver los espejos
    laterales del conductor del camión, usted está:'
  choices:
    A: En la 'Zona No' (punto ciego) del camión
    B: En una posición segura de succión (drafting)
    C: Siguiendo a una distancia legal y segura
    D: Listo para adelantar por la derecha
  answer: A
  explanation: Los camiones grandes tienen puntos ciegos significativos llamados 'Zonas
    No' (No-Zones). Si no puede ver la cara del conductor en su espejo lateral, el
    conductor no puede verlo a usted, lo que lo convierte en una posición peligrosa.
- id: 159
  category: sharing_the_road
  question: 'En New Hampshire, un conductor debe ceder el paso a cualquier peatón
    total o parcialmente ciego que lleve un bastón que sea predominantemente:'
  choices:
    A: Rojo
    B: Amarillo
    C: Blanco (o blanco con punta roja)
    D: Plateado reflectante
  answer: C
  explanation: La ley NH RSA 265:39 requiere que los conductores tomen las precauciones
    necesarias y cedan el paso a cualquier peatón que lleve un bastón total o parcialmente
    blanco (o blanco con punta roja) o que utilice un animal de servicio.
- id: 160
  category: sharing_the_road
  question: 'Cuando un autobús escolar se detiene en una carretera con calzadas separadas
    (divididas por una mediana física o barrera), un conductor en la calzada opuesta:'
  choices:
    A: Aún debe detenerse a 25 pies de distancia
    B: Debe reducir la velocidad a 10 mph
    C: No necesita detenerse
    D: Must stop only if there are more than 3 lanes
  answer: C
  explanation: La ley NH RSA 265:60 establece que el conductor de un vehículo en una
    carretera dividida con calzadas separadas no necesita detenerse al encontrarse
    o pasar a un autobús escolar que se encuentra en una calzada diferente.
- id: 161
  category: sharing_the_road
  question: ¿En New Hampshire, qué color de luces intermitentes utilizan específicamente
    los vehículos de emergencia, como las patrullas de policía, para indicar a un
    conductor que se detenga a un lado del camino?
  choices:
    A: Ámbar y blanco
    B: Azul y/o rojo
    C: Verde y ámbar
    D: Púrpura y blanco
  answer: B
  explanation: Las normas NH RSA 266:78-a y 266:78-b especifican que los vehículos
    policiales usan luces intermitentes azules y/o rojas, y los vehículos de bomberos/emergencia
    usan luces intermitentes rojas. Los conductores deben ceder el paso a estos vehículos.
- id: 162
  category: sharing_the_road
  question: 'Según la ley de New Hampshire, un ciclista que circule de noche debe
    estar equipado con una lámpara en la parte delantera que emita una luz blanca
    visible desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: La norma NH RSA 265:144 exige que toda bicicleta operada durante la
    oscuridad esté equipada con una lámpara en la parte delantera que emita una luz
    blanca visible desde una distancia de al menos 500 pies.
- id: 163
  category: sharing_the_road
  question: 'En New Hampshire, es ilegal seguir a un camión de bomberos o vehículo
    de emergencia que responda a una alarma a una distancia menor de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La norma NH RSA 265:100 prohíbe seguir a los aparatos de bomberos que
    responden a una alarma a una distancia menor de 500 pies o conducir o estacionar
    dentro de la cuadra donde el aparato de bomberos se ha detenido en respuesta a
    una alarma de incendio.
- id: 164
  category: sharing_the_road
  question: Según la ley de New Hampshire, ¿qué motociclistas están obligados a usar
    un casco de seguridad?
  choices:
    A: Todos los motociclistas independientemente de su edad
    B: Solo el operador, no el pasajero
    C: Solo los motociclistas menores de 18 años
    D: Solo los motociclistas con menos de 2 años de experiencia
  answer: C
  explanation: La norma NH RSA 265:122 establece que ninguna persona menor de 18 años
    de edad puede operar o viajar en una motocicleta a menos que use protección para
    la cabeza (casco).
- id: 165
  category: sharing_the_road
  question: 'En New Hampshire, el ''lane splitting'' (operar una motocicleta entre
    filas de vehículos detenidos o en movimiento en el mismo carril) es:'
  choices:
    A: Legal a velocidades inferiores a 15 mph
    B: Legal solo en autopistas
    C: Ilegal
    D: Legal si la motocicleta tiene las luces de emergencia encendidas
  answer: C
  explanation: La norma NH RSA 265:121 prohíbe explícitamente que las motocicletas
    operen entre carriles de tráfico o entre líneas o filas adyacentes de vehículos.
- id: 166
  category: sharing_the_road
  question: 'Cuando un peatón cruza la calle guiado por un perro o lleva un bastón
    blanco (con o sin punta roja), la ley de New Hampshire le exige:'
  choices:
    A: Tocar la bocina para avisarles que usted está allí
    B: Tomar el derecho de paso si tiene luz verde
    C: Ceder el derecho de paso y tomar las precauciones necesarias para evitar lesiones
    D: Conducir alrededor de ellos lentamente
  answer: C
  explanation: La norma NH RSA 265:41 exige que los conductores cedan el derecho de
    paso a cualquier peatón ciego que lleve un bastón blanco o utilice un animal de
    servicio, independientemente de las señales de tráfico.
- id: 167
  category: sharing_the_road
  question: 'Los camiones grandes tienen ''No-Zones''. Estas son áreas donde:'
  choices:
    A: No se permite que los camiones circulen
    B: El conductor del camión no puede verlo en sus espejos
    C: No se permite que los autos rebasen
    D: El estacionamiento está estrictamente prohibido
  answer: B
  explanation: Las 'No-Zones' son los grandes puntos ciegos alrededor de la parte
    delantera, trasera y laterales de un camión donde el conductor no puede ver a
    otros vehículos. Si no puede ver la cara del conductor del camión en su espejo
    lateral, él no puede verlo a usted.
- id: 168
  category: sharing_the_road
  question: Según la ley de New Hampshire, los ciclistas que circulan por una calzada
    no deben circular más de cuántos a la par?
  choices:
    A: Solo en fila india
    B: Dos a la par
    C: Tres a la par
    D: Cuatro a la par
  answer: B
  explanation: La norma NH RSA 265:144 establece que las personas que montan bicicletas
    en una calzada no deben circular más de 2 a la par y no deben impedir el movimiento
    normal y razonable del tráfico.
- id: 169
  category: sharing_the_road
  question: 'Cuando un peatón se encuentra en un cruce peatonal en su mitad de la
    calzada en New Hampshire, usted debe:'
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Ceder el derecho de paso y detenerse si es necesario
    C: Tocar la bocina para advertir al peatón que se mueva más rápido
    D: Solo detenerse si hay una señal de 'Pare' (Stop)
  answer: B
  explanation: La norma NH RSA 265:35 exige que el conductor de un vehículo ceda el
    derecho de paso, reduciendo la velocidad o deteniéndose si es necesario para ceder
    el paso, a un peatón que cruza la calzada dentro de un cruce peatonal.
- id: 170
  category: sharing_the_road
  question: Cuando viaja a 55 mph, ¿cuánto más puede tardar en detenerse un camión
    con remolque (tractor-trailer) totalmente cargado en comparación con un automóvil
    de pasajeros?
  choices:
    A: La misma distancia
    B: El doble de la distancia
    C: El triple de la distancia
    D: El cuádruple de la distancia
  answer: C
  explanation: Debido a su peso y sistemas de frenado, los camiones grandes tardan
    mucho más en detenerse. A 55 mph, un camión puede tardar más de 400 pies en detenerse,
    lo que es aproximadamente el triple de la distancia de un automóvil.
- id: 171
  category: sharing_the_road
  question: 'En New Hampshire, NO es necesario detenerse ante un autobús escolar con
    luces rojas intermitentes si:'
  choices:
    A: Viaja en la dirección opuesta en una calzada separada por una barrera física
      o mediana
    B: Hay al menos tres carriles de circulación
    C: El autobús se encuentra en una zona designada como "No Stop" (Sin parada)
    D: Viaja a al menos 15 mph por encima del límite de velocidad
  answer: A
  explanation: La norma NH RSA 265:60, IV establece que el conductor de un vehículo
    en una carretera dividida con calzadas separadas no necesita detenerse al encontrarse
    o rebasar un autobús escolar que se encuentre en una calzada diferente.
- id: 172
  category: vehicle_information
  question: ¿Según la ley de New Hampshire, cuándo debe inspeccionarse un vehículo
    motorizado de propiedad privada?
  choices:
    A: Cada dos años durante el mes de nacimiento del propietario
    B: Anualmente durante el mes de nacimiento del propietario
    C: Cada seis meses en una estación certificada
    D: Solo cuando el vehículo se vende o se transfiere
  answer: B
  explanation: En New Hampshire, todos los vehículos registrados deben inspeccionarse
    anualmente. Para los vehículos de propiedad privada, esta inspección debe realizarse
    durante el mes de nacimiento del propietario.
- id: 173
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    requerida para que un vehículo pase la inspección en New Hampshire?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de New Hampshire exige que los neumáticos tengan al menos 2/32
    de pulgada de profundidad de la banda de rodadura en todas las áreas del neumático
    que estén en contacto con la carretera.
- id: 174
  category: vehicle_information
  question: En New Hampshire, ¿el freno de pie debe ser capaz de detener el vehículo
    en cuántos pies cuando se viaja a 20 mph?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 45 pies
  answer: C
  explanation: Según el Manual del Conductor de New Hampshire, el freno de pie debe
    poder detener el vehículo en un tramo de 30 pies cuando el vehículo circula a
    20 mph.
- id: 175
  category: vehicle_information
  question: 'Todo vehículo motorizado que circule en New Hampshire debe tener una
    bocina que pueda oírse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las normas de seguridad de New Hampshire exigen que la bocina de un
    vehículo sea audible desde una distancia no inferior a 200 pies.
- id: 176
  category: vehicle_information
  question: Con respecto al polarizado de ventanas, la ley de New Hampshire generalmente
    prohíbe el polarizado no original (aftermarket) en qué ventanas de un vehículo
    (a menos que se obtenga una exención médica)?
  choices:
    A: Solo en la ventana trasera
    B: Solo en las ventanas laterales traseras
    C: En el parabrisas y en las ventanas a la izquierda y derecha del conductor
    D: En todas las ventanas, incluido el techo solar
  answer: C
  explanation: La norma RSA 266:58-a de New Hampshire prohíbe el polarizado no original
    en el parabrisas y en las ventanas laterales delanteras (a la izquierda y derecha
    del conductor), a menos que el conductor tenga una necesidad médica certificada.
- id: 177
  category: vehicle_information
  question: En New Hampshire, ¿con qué frecuencia debe renovarse el registro (matrícula)
    de un vehículo?
  choices:
    A: Cada año durante el mes de nacimiento del propietario
    B: Cada dos años en la fecha de compra
    C: Cada año el 1 de enero
    D: Cada cinco años
  answer: A
  explanation: Los registros de vehículos en New Hampshire vencen anualmente el último
    día del mes de nacimiento del propietario y deben renovarse en ese momento.
- id: 178
  category: vehicle_information
  question: Al remolcar un tráiler en New Hampshire, ¿qué equipo se requiere para
    evitar que el tráiler se desenganche si falla el enganche?
  choices:
    A: Solo un pasador de bloqueo secundario
    B: Cadenas o cables de seguridad
    C: Un enganche de distribución de peso
    D: Control electrónico de balanceo
  answer: B
  explanation: La ley de New Hampshire exige que cualquier remolque que sea remolcado
    debe estar equipado con cadenas o cables de seguridad para evitar que el remolque
    se separe del vehículo remolcador en caso de que falle el enganche.
- id: 179
  category: vehicle_information
  question: 'La ley de New Hampshire exige que todo vehículo motorizado esté equipado
    con un silenciador que esté en buen estado de funcionamiento para evitar:'
  choices:
    A: Cualquier humo visible por el tubo de escape
    B: Ruido excesivo o inusual
    C: La liberación de dióxido de carbono
    D: El sobrecalentamiento del motor
  answer: B
  explanation: La norma RSA 266:54 exige que todo vehículo motorizado tenga un silenciador
    para evitar "ruidos excesivos o inusuales". Los cortes o derivaciones (bypasses)
    son ilegales.
- id: 180
  category: vehicle_information
  question: 'El espejo retrovisor de un vehículo registrado en New Hampshire debe
    estar ajustado de modo que el conductor pueda ver la carretera hacia atrás a una
    distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las normas de seguridad de New Hampshire exigen que los espejos retrovisores
    proporcionen una visión de la carretera hacia atrás de al menos 200 pies.
- id: 181
  category: vehicle_information
  question: 'La ley de New Hampshire exige que la placa de matrícula trasera esté
    iluminada por una luz blanca de modo que sea visible desde una distancia de al
    menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 150 pies
  answer: B
  explanation: La norma RSA 266:31 exige que la luz trasera o una lámpara independiente
    ilumine la placa de matrícula trasera con una luz blanca para que sea visible
    desde 50 pies hacia atrás.
- id: 182
  category: vehicle_information
  question: 'En New Hampshire, las luces traseras deben ser de color rojo y visibles
    desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La norma RSA 266:31 de New Hampshire exige que todo vehículo de motor
    tenga al menos una luz trasera (dos si fue fabricado después de 1952) que emita
    una luz roja visible desde una distancia de 500 pies hacia atrás.
- id: 183
  category: vehicle_information
  question: 'Para que un vehículo apruebe la inspección de seguridad de New Hampshire,
    el freno de estacionamiento debe ser capaz de sujetar el vehículo en:'
  choices:
    A: Cualquier colina
    B: Una pendiente del 10%
    C: Una pendiente del 20%
    D: Solo en una superficie plana
  answer: A
  explanation: Las reglas de inspección de New Hampshire establecen que el freno de
    estacionamiento debe ser adecuado para sujetar el vehículo en cualquier pendiente
    (colina) en la que se opere.
- id: 184
  category: vehicle_information
  question: Según la ley de New Hampshire, ¿cuál es la profundidad mínima legal de
    la banda de rodadura de los neumáticos?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 1/16 de pulgada
  answer: B
  explanation: En New Hampshire, los neumáticos se consideran inseguros si están desgastados
    hasta un punto en el que queda menos de 2/32 de pulgada del diseño de la banda
    de rodadura.
- id: 185
  category: vehicle_information
  question: 'En New Hampshire, la bocina de un vehículo debe ser lo suficientemente
    fuerte como para ser escuchada desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 150 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Según el Manual del Conductor de New Hampshire, la bocina debe ser
    audible desde una distancia de 200 pies.
- id: 186
  category: vehicle_information
  question: ¿Cuál es la ley de New Hampshire con respecto al polarizado no original
    (aftermarket) en el parabrisas y las ventanas laterales delanteras?
  choices:
    A: Está permitido si permite el paso de al menos el 35% de la luz
    B: Está permitido si permite el paso de al menos el 70% de la luz
    C: Está estrictamente prohibido en el parabrisas y las ventanas laterales delanteras
    D: Está permitido solo en las 6 pulgadas superiores del parabrisas
  answer: C
  explanation: La ley de New Hampshire prohíbe el polarizado no original en el parabrisas
    y en las ventanas a la izquierda y derecha del conductor.
- id: 187
  category: vehicle_information
  question: ¿Entre qué fechas se permite el uso de neumáticos para nieve con clavos
    en las carreteras de New Hampshire?
  choices:
    A: Del 1 de noviembre al 1 de abril
    B: Del 15 de noviembre al 15 de abril
    C: Del 1 de diciembre al 31 de marzo
    D: Del 15 de octubre al 15 de mayo
  answer: B
  explanation: En New Hampshire, los neumáticos con clavos están legalmente permitidos
    para su uso entre el 15 de noviembre y el 15 de abril.
- id: 188
  category: vehicle_information
  question: En New Hampshire, si una carga se extiende más de cuántos pies más allá
    de la parte trasera de un vehículo, ¿se debe colocar una bandera o luz roja al
    final de la carga?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: Siempre que una carga se extienda 4 pies o más más allá de la parte
    trasera de la plataforma o carrocería de un vehículo, se debe mostrar una bandera
    roja (durante el día) o una luz roja (durante la noche).
- id: 189
  category: vehicle_information
  question: ¿Qué vehículos en New Hampshire deben someterse a una prueba de emisiones
    de Diagnóstico a Bordo (OBD) durante su inspección anual?
  choices:
    A: Todos los vehículos independientemente de su antigüedad
    B: Vehículos que tienen 15 años de antigüedad o menos
    C: Vehículos que tienen 20 años de antigüedad o menos
    D: Solo vehículos comerciales
  answer: C
  explanation: New Hampshire requiere una prueba de emisiones (OBD II) para la mayoría
    de los vehículos que tienen un año de modelo de 20 años o menos.
- id: 190
  category: vehicle_information
  question: 'Según los estándares de equipamiento de New Hampshire, el freno de estacionamiento
    debe ser lo suficientemente fuerte como para sujetar el vehículo:'
  choices:
    A: En una pendiente del 10%
    B: En cualquier colina
    C: Solo en superficies planas
    D: Cuando el motor está en marcha
  answer: B
  explanation: La ley de New Hampshire exige que el freno de estacionamiento sea adecuado
    para sujetar el vehículo en cualquier pendiente (colina) en la que se opere.
- id: 191
  category: signs_and_signals
  question: ¿En New Hampshire, cuál es el límite de velocidad no señalizado en un
    distrito residencial rural?
  choices:
    A: 30 mph
    B: 35 mph
    C: 40 mph
    D: 45 mph
  answer: B
  explanation: La ley de New Hampshire establece el límite de velocidad predeterminado
    en distritos residenciales rurales en 35 mph cuando no hay otro límite señalizado.
- id: 192
  category: signs_and_signals
  question: Al usar señales manuales en New Hampshire, ¿cómo debe indicar un conductor
    que está disminuyendo la velocidad o deteniéndose?
  choices:
    A: Extender el brazo izquierdo hacia afuera y hacia arriba
    B: Extender el brazo izquierdo recto hacia afuera
    C: Extender el brazo izquierdo hacia afuera y hacia abajo
    D: Mover el brazo izquierdo en un movimiento circular
  answer: C
  explanation: Para señalar una parada o una disminución de velocidad mediante señales
    manuales, el conductor debe extender el brazo izquierdo por la ventana y apuntarlo
    hacia abajo.
- id: 193
  category: signs_and_signals
  question: ¿En New Hampshire, qué significa una luz amarilla intermitente en una
    intersección?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: La luz está a punto de cambiar a rojo
    C: Proceder con precaución
    D: Ceder el paso a todo el tráfico que venga únicamente por la derecha
  answer: C
  explanation: Una luz amarilla intermitente significa que debe proceder con precaución
    y estar preparado para detenerse si es necesario, pero no necesita detenerse por
    completo si el camino está despejado.
- id: 194
  category: signs_and_signals
  question: 'Una señal en forma de banderín (pennant) situada en el lado izquierdo
    de la carretera en New Hampshire indica:'
  choices:
    A: Una zona escolar
    B: Un cruce de ferrocarril
    C: Una zona de no adelantar
    D: Una calle de un solo sentido
  answer: C
  explanation: La señal en forma de banderín es única porque se coloca en el lado
    izquierdo de la carretera para marcar el inicio de una zona donde está prohibido
    adelantar.
- id: 195
  category: signs_and_signals
  question: ¿En New Hampshire, qué significa una línea amarilla doble continua en
    el centro de la calzada?
  choices:
    A: Se permite adelantar solo durante las horas del día
    B: Se permite adelantar si el camino está despejado
    C: Se prohíbe adelantar en ambas direcciones
    D: Se permite adelantar solo para motocicletas
  answer: C
  explanation: Las líneas amarillas dobles continuas indican que está prohibido adelantar
    para el tráfico que circula en ambas direcciones.
- id: 196
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de aspa (crossbuck) en un cruce de
    ferrocarril en New Hampshire?
  choices:
    A: Es una advertencia de que definitivamente viene un tren
    B: Marca la ubicación de las vías y debe tratarse como una señal de ceder el paso
    C: Significa que debe detenerse por completo independientemente de si viene un
      tren
    D: Indica un cruce exclusivo para peatones
  answer: B
  explanation: Una señal de aspa (crossbuck) marca la ubicación de las vías del ferrocarril.
    Los conductores deben ceder el paso a cualquier tren que se aproxime.
- id: 197
  category: signs_and_signals
  question: 'Una luz roja intermitente en una intersección en New Hampshire significa:'
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Lo mismo que una señal de alto (STOP)
    C: Ceder el paso a todo el tráfico que venga por la izquierda
    D: La señal está averiada; ignórela
  answer: B
  explanation: Una luz roja intermitente requiere que el conductor se detenga por
    completo y proceda solo cuando sea seguro hacerlo, exactamente igual que una señal
    de alto.
- id: 198
  category: signs_and_signals
  question: 'Al usar señales manuales para indicar un giro a la derecha en New Hampshire,
    el conductor debe:'
  choices:
    A: Extender el brazo izquierdo recto hacia afuera
    B: Extender el brazo izquierdo hacia afuera y hacia arriba
    C: Extender el brazo izquierdo hacia afuera y hacia abajo
    D: Extender el brazo derecho recto hacia afuera
  answer: B
  explanation: Para señalar un giro a la derecha, el conductor debe extender el brazo
    izquierdo por la ventana y doblarlo hacia arriba a la altura del codo.
- id: 199
  category: signs_and_signals
  question: ¿En New Hampshire, qué representan las líneas blancas pintadas a través
    del pavimento en una intersección?
  choices:
    A: Espacios de estacionamiento
    B: Líneas de parada o pasos de peatones
    C: Carriles para vehículos de alta ocupación (HOV)
    D: Zonas exclusivas para bicicletas
  answer: B
  explanation: Las líneas blancas a través del pavimento indican dónde debe detenerse
    un conductor ante una señal de alto o un semáforo, o delimitan un paso de peatones.
- id: 200
  category: signs_and_signals
  question: ¿Qué significa una señal naranja en forma de diamante en New Hampshire?
  choices:
    A: Advertencia general
    B: Zona escolar
    C: Zona de obras o construcción
    D: Área de recreación pública
  answer: C
  explanation: Las señales naranjas en forma de diamante se utilizan específicamente
    para advertir a los conductores sobre zonas de obras de construcción o mantenimiento.
- id: 201
  category: signs_and_signals
  question: En New Hampshire, ¿qué significa una flecha amarilla fija?
  choices:
    A: Tiene el derecho de paso para girar
    B: El período de giro protegido está terminando
    C: Debe detenerse inmediatamente
    D: Hay peatones cruzando
  answer: B
  explanation: Una flecha amarilla fija indica que el tiempo de giro 'protegido' está
    terminando y la señal está a punto de cambiar a rojo.
- id: 202
  category: signs_and_signals
  question: ¿Cuál de las siguientes opciones describe una señal de 'Ceder el paso'
    (Yield) en New Hampshire?
  choices:
    A: Octágono rojo y blanco
    B: Diamante amarillo y negro
    C: Triángulo rojo y blanco que apunta hacia abajo
    D: Rectángulo blanco y negro
  answer: C
  explanation: Una señal de ceder el paso es un triángulo equilátero con un vértice
    apuntando hacia abajo, de color rojo y blanco.
- id: 203
  category: signs_and_signals
  question: 'Una línea amarilla continua en su lado de la línea central en New Hampshire
    indica:'
  choices:
    A: Puede adelantar si el camino está despejado
    B: Se encuentra en una zona de sentido único
    C: No se le permite adelantar
    D: Debe reducir su velocidad en 10 mph
  answer: C
  explanation: En New Hampshire, una línea amarilla continua en su lado de la carretera
    significa que está prohibido adelantar.
- id: 204
  category: signs_and_signals
  question: Según la ley de New Hampshire, ¿cuándo se permite un giro a la derecha
    en rojo?
  choices:
    A: Solo si hay una flecha verde
    B: Después de una parada completa y de ceder el paso al tráfico y a los peatones,
      a menos que una señal lo prohíba
    C: En cualquier momento, siempre que no cause un accidente
    D: Solo entre las 9:00 PM y las 6:00 AM
  answer: B
  explanation: La ley de New Hampshire permite girar a la derecha con semáforo en
    rojo después de hacer una parada completa, siempre que no haya una señal que lo
    prohíba y el conductor ceda el paso a los peatones y al resto del tráfico.
- id: 205
  category: signs_and_signals
  question: En New Hampshire, ¿qué indica una señal con forma de pentágono (cinco
    lados)?
  choices:
    A: Una zona de construcción
    B: Un cruce de ferrocarril
    C: Una zona escolar o cruce escolar
    D: Un requisito de ceder el paso
  answer: C
  explanation: Una señal de cinco lados (pentágono) se utiliza exclusivamente para
    advertir a los conductores que están entrando en una zona escolar o que se aproximan
    a un cruce escolar.
- id: 206
  category: signs_and_signals
  question: ¿Cuál es el significado de un semáforo en rojo intermitente en New Hampshire?
  choices:
    A: El semáforo está averiado; trátelo como una parada de cuatro vías
    B: Reduzca la velocidad y proceda con precaución
    C: Deténgase por completo y proceda solo cuando sea seguro hacerlo
    D: Ceda el paso al tráfico que viene en sentido contrario pero no se detenga
  answer: C
  explanation: Una luz roja intermitente significa lo mismo que una señal de alto
    (STOP). Debe detenerse por completo y avanzar solo cuando el camino esté despejado.
- id: 207
  category: signs_and_signals
  question: 'Cuando vea una señal de ''Move Over'' (Hacerse a un lado) o un vehículo
    de emergencia con luces intermitentes en una autopista de carriles múltiples de
    New Hampshire, usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Mantener la velocidad pero moverse al carril izquierdo
    C: Desocupar el carril tan pronto como sea seguro y posible, o reducir la velocidad
      si el cambio de carril es imposible
    D: Aumentar la velocidad para pasar el vehículo de emergencia rápidamente
  answer: C
  explanation: La ley 'Move Over' de New Hampshire (RSA 265:37-a) exige que los conductores
    desocupen el carril contiguo a un vehículo de emergencia estacionado con luces
    intermitentes o que reduzcan la velocidad y procedan con precaución si cambiar
    de carril no es seguro.
- id: 208
  category: signs_and_signals
  question: En New Hampshire, ¿de qué color son las señales que se utilizan para proporcionar
    guía e información sobre destinos o salidas?
  choices:
    A: Azul
    B: Verde
    C: Marrón
    D: Amarillo
  answer: B
  explanation: Las señales verdes se utilizan para orientación direccional, mostrando
    destinos, distancias e información de salida en las carreteras de New Hampshire.
- id: 209
  category: signs_and_signals
  question: ¿Qué indica una señal circular amarilla con una 'X' negra y las letras
    'RR' en New Hampshire?
  choices:
    A: Una curva cerrada más adelante
    B: Una calzada restringida
    C: Un cruce de ferrocarril más adelante
    D: Una carretera que termina en una intersección en 'T'
  answer: C
  explanation: La señal circular amarilla con una 'X' negra y 'RR' es la señal de
    advertencia anticipada de un cruce de ferrocarril.
- id: 210
  category: signs_and_signals
  question: 'Cuando un semáforo de New Hampshire muestra una luz roja fija y una flecha
    verde fija, usted puede:'
  choices:
    A: No moverse hasta que la luz roja cambie a verde
    B: Girar solo en la dirección de la flecha después de ceder el paso a los peatones
    C: Seguir recto o girar en la dirección de la flecha
    D: Girar en cualquier dirección después de detenerse
  answer: B
  explanation: Una flecha verde significa que puede avanzar en la dirección de la
    flecha, incluso si el semáforo principal está en rojo, siempre que ceda el paso
    a los peatones y a otros vehículos que ya se encuentren en la intersección.
- id: 211
  category: signs_and_signals
  question: ¿En New Hampshire, qué indican las marcas blancas en el pavimento (líneas)?
  choices:
    A: Tráfico moviéndose en direcciones opuestas
    B: Solo el borde de la carretera
    C: Tráfico moviéndose en la misma dirección
    D: Una zona de no estacionar
  answer: C
  explanation: Las líneas blancas se utilizan para separar los carriles de tráfico
    que se mueven en la misma dirección y para marcar el borde derecho de la calzada.
- id: 212
  category: signs_and_signals
  question: Según la ley de New Hampshire, ¿cuál es la señal manual para un giro a
    la derecha?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido hacia afuera
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido por la ventana y doblado hacia arriba en el codo.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Hacer una parada completa
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Parar solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 213
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Hacer una parada completa
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar pasar a otros de forma segura.
  id: 214
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 215
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 216
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 217
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Adelantar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 218
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 219
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite adelantar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 220
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín de color blanco y negro que dice "NO
    PASSING ZONE" (zona de no rebasar) significa que no se le permite rebasar a otros
    vehículos en esta área. Marca el comienzo de una zona de no rebasar.
  id: 221
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "KEEP RIGHT" (manténgase a la derecha)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 222
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 223
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan frecuentemente la carretera en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 224
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que crucen la calle.
  id: 225
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 226
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras "R" es la
    señal de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca
    la velocidad, mire y escuche si vienen trenes.
  id: 227
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) se coloca en los cruces de ferrocarril.
    Significa que debe ceder el paso a los trenes. Si se aproxima un tren, debe detenerse.
  id: 228
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 229
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa giro a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 230
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que la carretera
    gire primero en un sentido y luego en el otro.
  id: 231
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 232
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 233
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción en el ancho de la vía y ajuste su posición
    en el carril.
  id: 234
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 235
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 236
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una carretera de un solo sentido o de una autopista
    dividida y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 237
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 238
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 239
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de pare (stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un puesto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Prepárese para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 240
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 241
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 242
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 243
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 244
