  answer: B
  explanation: If you are driving without insurance and are in a crash (even if it isn't your fault), your license will be taken away by the Commissioner of Motor Vehicles until you get insurance, and you will have to prove you have insurance for a full 3 years.
- id: 245
  category: vehicle_information
