  category: vehicle_information
  question: For which of the following vehicles is a VIN verification required?
  choices:
    A: A brand new vehicle purchased in Vermont
    B: A vehicle with a registration from a foreign country, including Canada
    C: A vehicle transferring plates from an old vehicle
    D: A trailer with an empty weight of 1,000 pounds
  answer: B
  explanation: VIN Verification is required for vehicles with Salvage Documentation, vehicles titled under bond, and vehicles with registrations from any foreign country, including Canada.
- id: 240
  category: vehicle_information
  question: If you borrow money from a bank to buy a vehicle, who holds the title until the loan is paid back?
  choices:
    A: The buyer
    B: The Department of Motor Vehicles
    C: The lien holder
    D: The dealership
  answer: C
  explanation: The title to your vehicle, when issued, will be sent to the lien holder and will not be given to you until you pay back the money you borrowed.
- id: 241
  category: safe_driving_rules
  question: What is the minimum required liability insurance coverage for property damage in Vermont?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: A
  explanation: The amount of coverage MUST be at least $25,000 for death or injury of one person; $50,000 for death or injury of 2 or more persons; $10,000 for property damage.
- id: 242
  category: penalties_and_points
  question: What is the penalty if a police officer stops you and you do not have insurance on your vehicle?
  choices:
    A: A warning and 1 point on your driving record
    B: A fine and 2 points on your driving record
    C: Immediate vehicle impoundment and 4 points
    D: A 30-day license suspension and 5 points
  answer: B
  explanation: If a police officer stops you and asks to see proof of your insurance and you do not have insurance, the officer will give you a ticket. You will be fined and assessed two points on your driving record.
- id: 243
  category: driver_responsibility
  question: If you have insurance but cannot show the card to a police officer when stopped, how many days do you have to produce it?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: If you have insurance on your vehicle and a police officer stops you, and you cannot show the card to the officer, you have 15 days to do so.
- id: 244
  category: penalties_and_points
  question: If you are driving without insurance and are involved in a crash, what will happen to your license?
  choices:
    A: It will be suspended for 30 days.
    B: It will be taken away until you get insurance and prove you have it for a full 3 years.
    C: It will be revoked permanently.
