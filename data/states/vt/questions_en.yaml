    B: Pump the brake pedal
    C: Expect noise and vibration
    D: Keep your foot firmly on the pedal
  answer: B
  explanation: The manual states, "Don't pump the brake or take your foot off the brake pedal because it will disengage the anti-lock system."
- id: 176
  category: vehicle_information
  question: What does it mean if your vehicle's ABS warning light stays on after you begin to drive?
  choices:
    A: Your vehicle has no braking ability at all.
    B: The ABS system is working perfectly.
    C: The ABS system is not working, but the vehicle still has normal brakes.
    D: Your parking brake is engaged.
  answer: C
  explanation: According to the manual, "If your ABS light stays on after you begin to drive, your vehicle's ABS system is not working. However, the vehicle does still have brakes."
- id: 177
  category: safe_driving_rules
  question: According to studies, driving with low beam headlights on during the daytime reduces the risk of head-on collisions by more than what percentage?
  choices:
    A: 10%
    B: 20%
    C: 30%
    D: 50%
  answer: B
  explanation: Studies have shown that driving with low beam headlights on during the daytime reduces the risk of head-on collisions by more than 20%.
- id: 178
  category: safe_driving_rules
  question: When does the law require you to turn on your vehicle's headlights?
  choices:
    A: From sunset to sunrise
    B: A half hour after sunset to a half hour before sunrise
    C: An hour after sunset to an hour before sunrise
    D: Only when visibility is less than 500 feet
  answer: B
  explanation: The law requires headlights on vehicles to be turned on a half hour after sunset to a half hour before sunrise.
- id: 179
  category: defensive_driving
  question: Where should you look to avoid being temporarily blinded by the headlights of an oncoming vehicle?
  choices:
    A: Directly at the oncoming headlights
    B: At the center line of the road
    C: Towards the right edge of the highway
    D: At your rearview mirror
  answer: C
  explanation: To avoid being temporarily blinded, you should look ahead towards the right edge of the highway until the bright lights have gone by and your vision has returned to normal.
- id: 180
  category: safe_driving_rules
  question: When entering an interstate from an entrance ramp, who has the right-of-way?
  choices:
    A: The entering driver
    B: Drivers already on the interstate
    C: Whichever vehicle is traveling faster
    D: Commercial trucks only
  answer: B
  explanation: The manual states that the entering driver must yield to drivers already on the interstate.
- id: 181
  category: safe_driving_rules
  question: What should you do if you must stop for an emergency on the interstate?
  choices:
    A: Stop in the right traffic lane and turn on hazard lights.
    B: Move into the breakdown lane, raise the hood, tie a white cloth on the vehicle, and stay inside.
    C: Stop in the median and stand outside your vehicle to wave for help.
    D: Use the emergency turnaround to go back to the nearest exit.
  answer: B
  explanation: If you must stop for an emergency, move into the breakdown lane and as far to the right as possible. Raise the hood of your vehicle, tie a white cloth on the vehicle, and stay in your vehicle.
- id: 182
  category: safe_driving_rules
  question: What is the correct action to take if you miss your exit ramp on the interstate?
  choices:
    A: Stop and back up carefully on the shoulder.
    B: Use the emergency turnaround crossover.
    C: Go on to the next exit.
    D: Slow down and make a U-turn in the median.
  answer: C
  explanation: If you miss your exit ramp, never stop and back up and never use the emergency turnaround. Go on to the next exit.
- id: 183
  category: sharing_the_road
  question: If you approach an emergency vehicle with flashing lights on the side of the road and are unable to safely change lanes away from it, what must you do?
  choices:
    A: Maintain your speed and honk your horn.
    B: Stop completely until the emergency vehicle leaves.
    C: Slow down to 20 mph below the speed limit.
    D: Speed up to pass the vehicle as quickly as possible.
  answer: C
  explanation: If you are unable to change lanes away from the emergency vehicle, the law says you must slow down to 20 mph below the speed limit in order to go by the stopped vehicles.
- id: 184
  category: signs_and_signals
  question: What does it indicate if the edge of the divided highway to your right is painted yellow?
  choices:
    A: You are approaching a construction zone.
    B: You are going the WRONG WAY.
    C: You are in a passing zone.
    D: The lane is ending soon.
  answer: B
  explanation: If the edge of the highway to your right is painted yellow, you are going the WRONG WAY on a divided highway or Interstate. On a divided highway the line to your right should be white.
- id: 185
  category: sharing_the_road
  question: When passing a vehicle or bicycle, what is the minimum amount of clearance you must leave between your vehicle and the one you are passing?
  choices:
    A: Two feet
    B: Three feet
    C: Four feet
    D: Six feet
  answer: C
  explanation: The manual instructs drivers to leave at least four feet of clearance between your vehicle and any vehicle or bicycle you are passing.
- id: 186
  category: safe_driving_rules
  question: When is it safe to return to the right side of the road after passing another vehicle?
  choices:
    A: When you are parallel with the other vehicle
    B: When you can see the entire front of the passed vehicle in your inside rearview mirror
    C: As soon as you activate your right turn signal
    D: When the passed vehicle flashes its high beams
  answer: B
  explanation: You should go far enough beyond the motor vehicle or bicycle you are passing so that you are able to see the entire front of the motor vehicle or the bicyclist in your inside rearview mirror before returning to the right side.
- id: 187
  category: safe_driving_rules
  question: Under which condition is it permissible to pass a vehicle on the right on a road that is NOT multilane?
  choices:
    A: When the vehicle ahead is driving below the speed limit
    B: When the vehicle ahead is turning or preparing to turn left, if there is room to go by safely
    C: When you can safely drive off the pavement to get around them
    D: It is never permissible to pass on the right on a two-lane road
  answer: B
  explanation: On roads that are not multilane, a driver may pass on the right of a vehicle or bicycle turning or preparing to turn left, if there is room to go by safely.
- id: 188
  category: defensive_driving
  question: In which of the following conditions should you NEVER use cruise control?
  choices:
    A: On a clear, sunny day
    B: On a straight, dry interstate
    C: In rain, fog, snow, or ice
    D: When driving long distances
  answer: C
  explanation: 'The manual explicitly states: "Never use cruise control in driving conditions such as rain, fog, snow, ice, etc."'
- id: 189
  category: alcohol_drugs_health
  question: Which of the following can seriously affect your ability to drive safely and cause impairment?
  choices:
    A: Alcohol only
    B: Illegal drugs only
    C: Alcohol, prescription drugs, over-the-counter drugs, and drowsiness
    D: Only substances that require a prescription
  answer: C
  explanation: The manual notes that drinking is not the only way a driver can be impaired. Drugs, even prescription and over-the-counter drugs, as well as driving while drowsy, can seriously affect your ability to drive safely.
- id: 190
  category: alcohol_drugs_health
  question: What is the blood alcohol concentration (BAC) limit at which a driver is legally considered 'under the influence' or 'impaired' in Vermont?
  choices:
    A: '.05'
    B: '.08'
    C: '.10'
    D: '.02'
  answer: B
  explanation: Vermont law states that when a person's blood alcohol concentration (BAC) is .08 or above, he/she is 'under the influence' or 'impaired'.
- id: 191
  category: alcohol_drugs_health
  question: What is the penalty for a person under the age of 21 who operates a vehicle with an alcohol concentration of .02 or more?
  choices:
    A: They will receive a warning and a mandatory court appearance.
    B: Their vehicle will be impounded for 30 days.
    C: They receive a civil traffic violation, license suspension, and must complete an alcohol education program.
    D: They must retake the driving test immediately.
  answer: C
  explanation: People under the age of 21 who operate a vehicle with an alcohol concentration of .02 or more can receive a civil traffic violation. The Driver's License will be suspended and the driver must complete an alcohol and driving education program at their own expense.
- id: 192
  category: alcohol_drugs_health
  question: Which of the following is the only effective way to reduce the effects of alcohol in your body?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Time
  answer: D
  explanation: Time is the only way to reduce the effects of alcohol. Drinking coffee, taking a shower, exercising, etc., cannot reduce your BAC or the effects of alcohol.
- id: 193
  category: alcohol_drugs_health
  question: How does alcohol affect your feelings and senses while driving?
  choices:
    A: It heightens your sense of speed.
    B: It suppresses your feelings, so you may not realize you are speeding.
    C: It improves your reaction time to sudden hazards.
    D: It makes you more aware of the risks you are taking.
  answer: B
  explanation: Alcohol suppresses your feelings; you don't feel speed so you won't realize that you could be speeding.
- id: 194
  category: penalties_and_points
  question: Under Vermont's 'Implied Consent' Law, what is the penalty for refusing to take a test to determine the amount of alcohol or drugs in your body?
  choices:
    A: A mandatory $500 fine
    B: Loss of your Driver's License for at least six months
    C: An immediate 30-day jail sentence
    D: Five points added to your driving record
  answer: B
  explanation: If a police officer asks a driver to take the test and the driver refuses, they will lose their Driver's License for at least six (6) months under the Implied Consent Law.
- id: 195
  category: penalties_and_points
  question: Which statement is true regarding license suspension for DUI in Vermont?
  choices:
    A: You can only lose your license after a criminal DUI conviction.
    B: You can lose your license through a civil process before a criminal DUI conviction.
    C: Your license is only suspended if you cause a traffic crash.
    D: First-time offenders cannot have their license suspended.
  answer: B
  explanation: Vermont has an administrative suspension process, which means that you can lose your license through a civil process before a criminal DUI conviction.
- id: 196
  category: safe_driving_rules
  question: Which of the following is a common sign of drowsy driving?
  choices:
    A: Checking your mirrors frequently
    B: Remembering the last few miles you drove clearly
    C: Drifting out of the travel lane
    D: Driving slightly below the speed limit
  answer: C
  explanation: 'Some signs of drowsy driving are: having problems focusing, yawning repeatedly, not remembering the last few miles you drove, drifting out of the travel lane, and missing traffic signs.'
- id: 197
  category: safe_driving_rules
  question: What should you do if you become drowsy while on the road?
  choices:
    A: Open your window to get fresh air.
    B: Turn up the radio volume.
    C: Drink a caffeinated beverage and keep driving.
    D: Find a safe place to pull over and stop.
  answer: D
  explanation: If you become drowsy while you're on the road, find a safe place to pull over and stop. Opening your window and turning up your radio will not keep you awake.
- id: 198
  category: sharing_the_road
  question: What are the most common driver contributing actions in pedestrian and bicycle motor vehicle crashes in Vermont?
  choices:
    A: Speeding and tailgating
    B: Inattention and failure to yield
    C: Drunk driving and running red lights
    D: Driving without headlights and improper passing
  answer: B
  explanation: Inattention and failure to yield are the most common driver contributing actions in pedestrian and bicycle motor vehicle crashes in Vermont.
- id: 199
  category: safe_driving_rules
  question: Which of the following is a recommended strategy to deal with distractions while driving?
  choices:
    A: Do your personal grooming in the vehicle while stopped at red lights.
    B: Keep pets in your lap so they stay calm.
    C: Pre-program your favorite radio stations for easy access.
    D: Map out your destination on your phone while driving.
  answer: C
  explanation: To deal with distractions, you should pre-program your favorite radio stations for easy access. Grooming should be done at home, pets should be in a carrier, and destinations should be mapped out in advance.
- id: 200
  category: penalties_and_points
  question: What is the fine for a first violation of using a portable electronic device while operating a motor vehicle on a public highway in Vermont?
  choices:
    A: Not less than $50 and not more than $100
    B: Not less than $100 and not more than $200
    C: Not less than $250 and not more than $500
    D: Not less than $500 and not more than $1000
  answer: B
  explanation: A person who violates this law shall be subject to a fine of not less than $100.00 and not more than $200.00 for a first violation.
- id: 201
  category: penalties_and_points
  question: How many points are assessed against your driving record for a first conviction of using a portable electronic device in a properly designated work zone with personnel present?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: B
  explanation: A person convicted of violating this section while operating within a properly designated work zone in which construction, maintenance, or utility personnel are present shall have two points assessed against his or her driving record for a first conviction.
- id: 202
  category: signs_and_signals
  question: What does a sign installed by the Vermont Emergency Nurses Association (ENCARE) indicate?
  choices:
    A: A hospital emergency room is nearby.
    B: A designated safe pull-over area for drowsy drivers.
    C: Someone died at that location because of a drunk driver.
    D: A police checkpoint for DUI testing is ahead.
  answer: C
  explanation: The Vermont Emergency Nurses Association (ENCARE) sponsors the installation of signs at the site of alcohol related fatal crashes. When you see one of these signs, it means someone died at that location because of a drunk driver.
- id: 203
  category: safe_driving_rules
  question: If you are overly worried, excited, afraid, angry, or depressed, what is a recommended strategy before driving?
  choices:
    A: Drive faster to reach your destination sooner.
    B: Listen to loud music to distract yourself.
    C: Give yourself time to cool off and calm down by taking a walk.
    D: Drink a cup of coffee to improve your focus.
  answer: C
  explanation: Emotions affect safe driving. You may not be able to drive well if you are overly worried, excited, afraid, angry or depressed. Give yourself time to cool off and calm down. Taking a walk is a good way to do this.
- id: 204
  category: safe_driving_rules
  question: Is it legal to use a portable electronic device while your vehicle is stationary on a public highway in Vermont?
  choices:
    A: Yes, as long as the vehicle is not moving.
    B: Yes, but only to send text messages.
    C: No, it is against the law even while the vehicle is stationary.
    D: No, unless you are checking a GPS application.
  answer: C
  explanation: It is against the law for drivers to use a portable electronic device while operating a motor vehicle on a public highway in Vermont, including while the vehicle is stationary.
- id: 205
  category: safe_driving_rules
  question: What should you do with your cell phone while driving to prevent it from becoming a hazard in a crash?
  choices:
    A: Keep it in your lap
    B: Secure it in the vehicle
    C: Place it on the passenger seat
    D: Hold it in your non-steering hand
  answer: B
  explanation: You should secure your phone in the vehicle so that it does not become a projectile in a crash.
- id: 206
  category: safe_driving_rules
  question: When preparing to pull out from a parked position on the right side of a hill, which directional signal should you use before driving into traffic?
  choices:
    A: Right signal
    B: Left signal
    C: Four-way flashers
    D: No signal is needed
  answer: B
  explanation: Before driving up the hill from a stop on the right side of the road, you must put the vehicle in gear and signal left to tell others what you are doing.
- id: 207
  category: defensive_driving
  question: When driving downhill, what action should you avoid?
  choices:
    A: Using your brakes lightly
    B: Downshifting to a lower gear
    C: Coasting with the gearshift in neutral
    D: Keeping both hands on the steering wheel
  answer: C
  explanation: When driving downhill, you should not coast with the clutch to the floor or the gearshift in neutral.
- id: 208
  category: safe_driving_rules
  question: When performing a turnaround using a side street on your right, how far from the curb or edge of the road should you stop before backing?
  choices:
    A: About 6 inches
    B: About 12 inches
    C: About 18 inches
    D: About 24 inches
  answer: C
  explanation: When turning around using a side street, you should drive just past the street and stop about 18 inches from the curb or edge of the road before backing.
- id: 209
  category: defensive_driving
  question: According to the manual, what is the safest option for turning your vehicle around?
  choices:
    A: Making a U-turn in the middle of the street
    B: Backing across an intersection
    C: Using a three-point turn on a busy road
    D: Going around the block or using a parking lot
  answer: D
  explanation: There are several options for turning your vehicle around, but going around the block or using a parking lot is the safest option.
- id: 210
  category: safe_driving_rules
  question: When approaching a parallel parking space, how far away should you stop alongside the front vehicle?
  choices:
    A: One to two feet
    B: Two to three feet
    C: Three to four feet
    D: Four to five feet
  answer: B
  explanation: When approaching the parking space, check your rearview mirror, signal right, and stop alongside the front vehicle, two to three feet away.
- id: 211
  category: driver_responsibility
  question: What is the first thing you should do if you are involved in a crash and there are no serious injuries?
  choices:
    A: Wait for the police in the middle of the road
    B: Move the involved vehicles out of the traveled lanes and onto the shoulder
    C: Immediately call your insurance company
    D: Leave the scene to find a tow truck
  answer: B
  explanation: If possible, move the involved vehicles out of the traveled lanes and onto the shoulder. This will reduce the chance of someone else crashing into the involved vehicles.
- id: 212
  category: driver_responsibility
  question: If someone is injured in a crash, what should you do while waiting for help?
  choices:
    A: Move the person to the side of the road
    B: Offer the person food and water
    C: Leave the injured person where they are and keep them warm and calm
    D: Transport the person to the hospital in your own vehicle
  answer: C
  explanation: If someone is injured, call 911. Leave the injured person where they are, as moving them the wrong way may injure them more. Keep the person warm and calm.
- id: 213
  category: driver_responsibility
  question: What must you do if you hit a parked vehicle, cause damage, and cannot find the owner?
  choices:
    A: Wait by the vehicle until the owner returns
    B: Leave a written note with your name, address, and phone number on the vehicle
    C: Report it to the DMV within 30 days
    D: Drive away if the damage appears minor
  answer: B
  explanation: If you hit a parked vehicle and cause damage, and you can't find the owner, you must write your name, address and phone number and leave it in, or on the vehicle.
- id: 214
  category: driver_responsibility
  question: You must make a written report to the Department of Motor Vehicles within 72 hours if a crash results in an injury or if property damage exceeds what amount?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $3,000
  answer: D
  explanation: If any person has been injured, or if the damage is over $3,000, you must make a written report to the Department of Motor Vehicles within 72 hours.
- id: 215
  category: driver_responsibility
  question: If a Vermont driver is involved in a crash in another state, where must the crash be reported?
  choices:
    A: Only to the Vermont DMV
    B: In the state where the crash happened
    C: To the driver's insurance company only
    D: To the federal highway administration
  answer: B
  explanation: If a Vermont driver has a crash in another state, it must be reported in the state where the crash happened.
- id: 216
  category: vehicle_information
  question: How often must your vehicle be inspected in Vermont?
  choices:
    A: Once every six months
    B: Once a year
    C: Once every two years
    D: Only when the vehicle is sold
  answer: B
  explanation: Your vehicle must be inspected once a year to make sure that it is checked and running properly.
- id: 217
  category: vehicle_information
  question: Unless it already bears a valid Vermont inspection sticker, a motor vehicle must be inspected within how many days of registration?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: All motor vehicles have to be inspected within 15 days of registration, unless bearing a valid Vermont inspection sticker.
- id: 218
  category: vehicle_information
  question: What is the most common cause of bad brakes that results in a vehicle swerving when the brakes are applied suddenly?
  choices:
    A: The brake fluid is completely empty
    B: The brakes do not operate together properly
    C: The brake pedal is too high
    D: The parking brake is engaged
  answer: B
  explanation: The most common cause of bad brakes is that they do not operate together properly. When applying the brakes suddenly, one takes hold before the other and causes your vehicle to swerve.
- id: 219
  category: vehicle_information
  question: What is the minimum legal tread depth for tires in Vermont?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 3/32 of an inch
    D: 4/32 of an inch
  answer: B
  explanation: Tires must have at least 2/32" of tread depth. It is not safe or legal to use tires after the tread is worn off or worn down to the wear bars.
- id: 220
  category: vehicle_information
  question: The back license plate of your vehicle must be lighted so it can be seen and read from at least what distance?
  choices:
    A: 25 feet
    B: 50 feet
    C: 100 feet
    D: 150 feet
  answer: B
  explanation: The back license plate must be lighted so it can be seen and read at least 50 feet from the back of the vehicle.
- id: 221
  category: alcohol_drugs_health
  question: Which of the following is a symptom that could indicate carbon monoxide poisoning from a leaking exhaust system?
  choices:
    A: A strong smell of exhaust fumes in the cabin
    B: Becoming drowsy or nauseous
    C: A sudden increase in engine temperature
    D: The steering wheel moving too loosely
  answer: B
  explanation: You cannot smell carbon monoxide gas. If you become drowsy or nauseous, it could indicate carbon monoxide poisoning.
- id: 222
  category: vehicle_information
  question: What does Vermont law state regarding objects hanging from the rearview mirror or sun visors?
  choices:
    A: They are allowed if they are smaller than 3 inches.
    B: They are permitted only on the passenger side sun visor.
    C: There shall not be anything hanging from the rearview mirror or sun visors.
    D: They are allowed as long as they do not block the driver's view of the speedometer.
  answer: C
  explanation: The law states there shall not be anything hanging from the rearview mirror or sun visors.
- id: 223
  category: safe_driving_rules
  question: According to Vermont law, how must a child under two years of age be secured in a vehicle?
  choices:
    A: In a forward-facing car seat with a harness
    B: In a booster seat in the back seat
    C: In a federally approved rear-facing child car seat with a harness
    D: With a standard lap and shoulder belt
  answer: C
  explanation: A child under two years of age must be properly secured in a federally approved rear-facing child car seat with a harness.
- id: 224
  category: safe_driving_rules
  question: Where should a child under 13 years of age ride in a vehicle, if practical?
  choices:
    A: In the front passenger seat
    B: In the back seat
    C: In a rear-facing car seat
    D: In the middle front seat
  answer: B
  explanation: A child under 13 years of age must, if practical, ride in the back seat.
- id: 225
  category: safe_driving_rules
  question: What is the proper way to wear a vehicle's safety belt?
  choices:
    A: The lap belt should fit snugly over the stomach.
    B: The shoulder belt should be tucked under your arm.
    C: The shoulder belt should be tucked behind your back.
    D: The lap belt should fit snugly across the hips and the shoulder belt across the center of the chest.
  answer: D
  explanation: Lap belts should fit snugly across the hips, not over the stomach. Shoulder belts go over the shoulder and across the center of the chest.
- id: 226
  category: penalties_and_points
  question: Under the Vermont Point System, how many points must a driver receive before they are sent a letter notifying them that their driving privilege is to be suspended?
  choices:
    A: 5 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: C
  explanation: When a driver receives a total of 10 points, a letter will be sent notifying the driver that their privilege to drive is to be suspended.
- id: 227
  category: penalties_and_points
  question: How many points are put on your driving record for texting while driving?
  choices:
    A: 2 points
    B: 2 to 5 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: According to the Vermont Point System, texting while driving results in 2 - 5 points.
- id: 228
  category: penalties_and_points
  question: How many points will a driver receive for failing to stop for a school bus that has stopped with its red warning lights flashing?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: D
  explanation: Failure to stop for a school bus that has stopped with the red warning lights flashing results in 5 points.
- id: 229
  category: penalties_and_points
  question: Which of the following violations will NOT result in points being assessed to your driving record?
  choices:
    A: Driving without a license
    B: Failure to yield to a pedestrian in a crosswalk
    C: Parking or defective equipment violations
    D: Failure to obey a police officer
  answer: C
  explanation: Points are not assessed for parking or defective equipment violations.
- id: 230
  category: vehicle_information
  question: What might wavy marks on your front tires indicate?
  choices:
    A: The tires are overinflated.
    B: The wheels are out of alignment.
    C: The brake fluid is leaking.
    D: The steering wheel is too loose.
  answer: B
  explanation: Wavy marks on your front tires may mean that the wheels are out of alignment.
- id: 231
  category: vehicle_information
  question: During the annual vehicle inspection, what happens if your vehicle is supposed to have a catalytic converter but it is missing or fails?
  choices:
    A: You will receive 2 points on your license.
    B: You must pay a fine but can continue driving.
    C: It must be replaced.
    D: The mechanic will issue a waiver.
  answer: C
  explanation: If your vehicle is supposed to have a catalytic converter and it is not present or if the catalytic converter fails, it must be replaced.
- id: 232
  category: safe_driving_rules
  question: Where must you NEVER place a rear-facing child safety seat?
  choices:
    A: In the back seat behind the driver
    B: In the back seat behind the passenger
    C: In the middle of the back seat
    D: In front of an active airbag
  answer: D
  explanation: 'A child in a rear-facing car seat must not ride in front of an active airbag. The manual explicitly notes: "Never place a child’s safety seat in front of an air bag!"'
- id: 233
  category: penalties_and_points
  question: How many points accumulated on your driving record will result in a letter notifying you that your driving privilege is to be suspended?
  choices:
    A: 5 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: B
  explanation: According to the manual, accumulating a total of 10 points will result in a letter being sent to notify the driver that their privilege to drive is to be suspended.
- id: 234
  category: vehicle_information
  question: If you move to Vermont from another state, how many days do you have to register your vehicle?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
