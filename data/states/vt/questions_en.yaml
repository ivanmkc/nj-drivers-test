  answer: A
  explanation: The manual states that the rear plate must be lighted so that it can be read from at least 50 feet away.
- id: 236
  category: vehicle_information
  question: When selling a vehicle model year 2011 or newer, what specific document must be signed by both the seller and the buyer?
