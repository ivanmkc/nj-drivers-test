  explanation: The Purchase and Use Tax is 6% of the price you paid for the non-leased vehicle or the current fair market value, whichever is greater.
- id: 238
  category: vehicle_information
  question: Which of the following vehicles is exempt from needing a Vermont Motor vehicle title?
  choices:
    A: A motorcycle with 500 cc's of engine displacement
    B: A trailer with an empty weight of 1,500 pounds or less
    C: A leased vehicle under 3,000 pounds
    D: A rebuilt salvage vehicle
  answer: B
  explanation: Exceptions to the Vermont Motor vehicle title requirement include a motorcycle with less than 300 cc's of engine displacement and a trailer with empty weight of 1,500 pounds or less.
