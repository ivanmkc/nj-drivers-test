metadata:
  source: 2025 Vermont Driver's Manual
  total_questions: 259
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: What is the minimum age to apply for a Vermont Learner's Permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 15 and a half years old
  answer: B
  explanation: According to the Vermont Department of Motor Vehicles, an individual
    must be at least 15 years old to apply for a Learner's Permit.
- id: 2
  category: license_system
  question: How long must a Vermont teen hold a Learner's Permit before they are eligible
    to apply for a Junior Driver's License?
  choices:
    A: 6 months
    B: 9 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Vermont law requires that a person hold a Learner's Permit for at least
    one year (12 months) before they can take the road test for a Junior Driver's
    License.
- id: 3
  category: license_system
  question: During the first three months of holding a Vermont Junior Driver's License,
    who is allowed in the vehicle while the license holder is driving?
  choices:
    A: Any friends under the age of 18
    B: Immediate family members only
    C: Only a licensed driving instructor or a person at least 25 years of age
    D: No passengers are allowed under any circumstances
  answer: C
  explanation: For the first three months of operation under a Junior Driver's License,
    the driver may only transport a licensed driving instructor or a person at least
    25 years of age.
- id: 4
  category: license_system
  question: During the second three months of holding a Vermont Junior Driver's License,
    which passengers are permitted in the vehicle?
  choices:
    A: Any number of friends
    B: Only immediate family members
    C: Only one friend under 18
    D: No passengers are allowed
  answer: B
  explanation: During the second three months of holding a Junior Driver's License,
    the driver may transport immediate family members in addition to a licensed instructor
    or a person 25 or older.
- id: 5
  category: license_system
  question: To qualify for a Vermont Junior Driver's License, how many hours of practice
    driving must be certified by a parent or guardian?
  choices:
    A: 30 hours, with 5 hours at night
    B: 40 hours, with 10 hours at night
    C: 50 hours, with 10 hours at night
    D: 60 hours, with 15 hours at night
  answer: B
  explanation: Vermont requires 40 hours of practice driving, and at least 10 of those
    hours must be completed at night.
- id: 6
  category: license_system
  question: In Vermont, a Junior Driver's License will automatically become a Senior
    Operator's License when the driver reaches what age?
  choices:
    A: 17 years old
    B: 18 years old
    C: 19 years old
    D: 21 years old
  answer: B
  explanation: A Junior Driver's License is issued to 16 and 17-year-olds. It automatically
    converts to a Senior Operator's License on the driver's 18th birthday, provided
    they have no pending suspensions.
- id: 7
  category: license_system
  question: A Vermont Learner's Permit is valid for how long from the date of issuance?
  choices:
    A: 1 year
    B: 2 years
    C: 4 years
    D: Until the holder turns 18
  answer: B
  explanation: A Vermont Learner's Permit is valid for a period of two years.
- id: 8
  category: license_system
  question: To take the road test in Vermont, a person under 18 must have had no tickets
    or accidents for how many months prior to the test?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Vermont law requires that an applicant for a Junior Driver's License
    must have maintained a clean driving record (no tickets or accidents for which
    they were at fault) for the six months preceding the road test.
- id: 9
  category: license_system
  question: Under Vermont law, what is the Blood Alcohol Content (BAC) limit for a
    driver under the age of 21?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Vermont has a 'Zero Tolerance' law for minors. If you are under 21,
    you can be charged with a violation if your BAC is 0.02% or higher.
- id: 10
  category: license_system
  question: How many points accumulated on a Vermont driving record within a two-year
    period will result in a license suspension?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: B
  explanation: In Vermont, if you accumulate 10 or more points within a two-year period,
    your driving privileges will be suspended.
- id: 11
  category: license_system
  question: When moving to Vermont from another state, how many days do you have to
    obtain a Vermont driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: New residents of Vermont must obtain a Vermont driver's license within
    60 days of establishing residency.
- id: 12
  category: license_system
  question: What are the minimum insurance requirements for property damage in the
    state of Vermont?
  choices:
    A: $5,000
    B: $10,000
    C: $20,000
    D: $25,000
  answer: B
  explanation: Vermont law requires minimum liability coverage of $25,000 for one
    person injured, $50,000 for two or more people injured, and $10,000 for property
    damage.
- id: 13
  category: license_system
  question: Which of the following is a requirement for a Vermont Driver's Education
    course for students under 18?
  choices:
    A: 20 hours of classroom and 5 hours of driving
    B: 30 hours of classroom, 6 hours of driving, and 6 hours of observation
    C: 40 hours of classroom and 10 hours of driving
    D: 15 hours of classroom and 15 hours of driving
  answer: B
  explanation: A state-approved driver education course in Vermont must include 30
    hours of classroom instruction, 6 hours of behind-the-wheel instruction, and 6
    hours of observation.
- id: 14
  category: license_system
  question: In Vermont, if you refuse to take a breathalyzer test when requested by
    a law enforcement officer, what is the immediate consequence under 'Implied Consent'?
  choices:
    A: A $500 fine only
    B: Mandatory 24-hour jail stay
    C: Your license will be suspended
    D: Nothing, as long as you weren't actually drunk
  answer: C
  explanation: Under Vermont's Implied Consent law, by driving on Vermont roads, you
    agree to submit to a chemical test. Refusal results in an automatic license suspension.
- id: 15
  category: license_system
  question: Which document is NOT acceptable as proof of identity for a Vermont Real
    ID or Standard License?
  choices:
    A: A valid, unexpired U.S. Passport
    B: A certified copy of a U.S. Birth Certificate
    C: A Social Security Card
    D: A library card
  answer: D
  explanation: A library card is not a government-issued document that proves identity
    or legal presence. Passports, birth certificates, and Social Security cards are
    standard required documents.
- id: 16
  category: license_system
  question: If you change your name or address, you must notify the Vermont DMV within
    how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: According to the Vermont Driver's Manual, any change of name or address
    must be reported to the DMV within 30 days.
- id: 17
  category: license_system
  question: When moving to Vermont, how many days do you have to register your vehicle
    with the Vermont DMV?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: New residents must register their vehicles in Vermont within 60 days
    of moving to the state.
- id: 18
  category: license_system
  question: What is the minimum amount of liability insurance coverage required in
    Vermont for bodily injury to or death of two or more persons in any one accident?
  choices:
    A: $25,000
    B: $50,000
    C: $100,000
    D: $10,000
  answer: B
  explanation: Vermont law requires minimum liability coverage of $50,000 for bodily
    injury to or death of two or more persons in any one accident.
- id: 19
  category: license_system
  question: A Vermont Junior Operator's License will be suspended if the driver accumulates
    how many points on their driving record?
  choices:
    A: 3 points
    B: 6 points
    C: 10 points
    D: 12 points
  answer: A
  explanation: While adult drivers are suspended at 10 points, a Junior Operator's
    license is suspended when the driver reaches 3 points.
- id: 20
  category: license_system
  question: Of the 40 hours of required practice driving for a Vermont Junior License,
    how many hours must be completed at night?
  choices:
    A: 5 hours
    B: 10 hours
    C: 15 hours
    D: 20 hours
  answer: B
  explanation: Vermont requires 40 hours of practice driving, and at least 10 of those
    hours must be completed during nighttime.
- id: 21
  category: license_system
  question: What is the standard Vermont driver's license class for operating a regular
    passenger vehicle?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class D
  answer: D
  explanation: A Class D license is the standard operator's license for passenger
    cars and small trucks in Vermont.
- id: 22
  category: license_system
  question: In Vermont, for a first offense of using a portable electronic device
    (texting) while driving, how many points are assessed against your license?
  choices:
    A: 1 point
    B: 2 points
    C: 5 points
    D: 0 points (fine only)
  answer: B
  explanation: A first offense for using a portable electronic device while driving
    in Vermont results in 2 points on the driving record.
- id: 23
  category: license_system
  question: For how many years is a standard Vermont driver's license typically valid
    before it must be renewed?
  choices:
    A: 1 or 2 years
    B: 2 or 4 years
    C: 5 years
    D: 8 years
  answer: B
  explanation: Vermont residents generally have the choice of a 2-year or a 4-year
    renewal period for their driver's license.
- id: 24
  category: license_system
  question: What is the Blood Alcohol Content (BAC) limit for a person operating a
    Commercial Motor Vehicle (CMV) in Vermont?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: The BAC limit for commercial drivers in Vermont is 0.04%, which is
    stricter than the 0.08% limit for standard operators.
- id: 25
  category: license_system
  question: If you are under 18 and applying for a Vermont Junior Operator's License,
    who must sign the certification of driving practice?
  choices:
    A: A police officer
    B: A school principal
    C: A parent, guardian, or licensed driving instructor
    D: Any licensed driver over the age of 21
  answer: C
  explanation: The 40-hour practice log must be certified by a parent, guardian, or
    a licensed driving instructor.
- id: 26
  category: license_system
  question: Which of the following is a requirement for a person to accompany a Vermont
    Learner's Permit holder while they are driving?
  choices:
    A: They must be at least 21 years old
    B: They must be at least 25 years old and licensed
    C: They must have at least 10 years of driving experience
    D: They must be seated in the back seat
  answer: B
  explanation: A permit holder must be accompanied by a licensed parent/guardian,
    a licensed driver ed instructor, or a licensed individual who is at least 25 years
    of age.
- id: 27
  category: license_system
  question: In Vermont, if your license is suspended, what must you do to get it back
    after the suspension period ends?
  choices:
    A: Retake the road test only
    B: Pay a reinstatement fee and meet any other legal requirements
    C: Wait 1 year after the suspension ends
    D: Nothing, it is mailed back automatically
  answer: B
  explanation: To reinstate a suspended license in Vermont, you must pay a reinstatement
    fee and satisfy all conditions of the suspension.
- id: 28
  category: license_system
  question: What is the minimum liability insurance requirement for property damage
    in a single accident in Vermont?
  choices:
    A: $5,000
    B: $10,000
    C: $20,000
    D: $25,000
  answer: B
  explanation: Vermont law requires a minimum of $10,000 in coverage for property
    damage in any one accident.
- id: 29
  category: license_system
  question: If a Vermont driver is convicted of 'Operating After Suspension' (OAS),
    what is a potential penalty for a first offense?
  choices:
    A: Mandatory 5-year prison sentence
    B: A fine and an additional period of suspension
    C: Permanent loss of license
    D: There is no penalty for the first offense
  answer: B
  explanation: Operating after suspension is a serious offense in Vermont that carries
    fines and extends the period of license suspension.
- id: 30
  category: license_system
  question: In Vermont, how many points are added to your driving record for a conviction
    of 'Failure to yield to an emergency vehicle'?
  choices:
    A: 2 points
    B: 5 points
    C: 8 points
    D: 10 points
  answer: B
  explanation: Failure to yield to an emergency vehicle is a major violation in Vermont
    and results in 5 points being added to the driver's record.
- id: 31
  category: driver_testing
  question: To meet the vision requirements for a Vermont driver's license, an applicant
    must have at least what visual acuity in at least one eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to the Vermont Driver's Manual, an applicant must have 20/40
    vision or better in at least one eye, with or without corrective lenses.
- id: 32
  category: driver_testing
  question: When taking the Vermont road test, if the vehicle has a center console,
    what is a requirement for the emergency brake?
  choices:
    A: It must be electronic.
    B: It must be accessible to the examiner.
    C: It must be foot-operated only.
    D: The examiner does not need access to the brake.
  answer: B
  explanation: For the Vermont road test, the vehicle's emergency brake must be located
    such that the examiner can reach it in case of an emergency.
- id: 33
  category: driver_testing
  question: In Vermont, how many points are assessed against your driving record for
    a conviction of speeding 11 to 20 miles per hour over the speed limit?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 8 points
  answer: B
  explanation: Vermont's point system assigns 3 points for speeding 11-20 mph over
    the limit. Speeding 1-10 mph over is 2 points.
- id: 34
  category: driver_testing
  question: Under Vermont law, what is the fine range for a first offense of using
    a portable electronic device (texting) while driving?
  choices:
    A: Between $50 and $100
    B: Between $100 and $200
    C: Between $250 and $500
    D: A flat $500 fine
  answer: B
  explanation: Under 23 V.S.A. § 1099, the fine for a first offense of using a portable
    electronic device while driving in Vermont is between $100 and $200.
- id: 35
  category: driver_testing
  question: Vermont's 'Move Over' law requires drivers to change lanes or slow down
    when approaching which of the following stationary vehicles with flashing lights?
  choices:
    A: Police and Fire vehicles only
    B: Ambulances and Tow trucks only
    C: Maintenance and Utility vehicles only
    D: Any vehicle with flashing lights, including emergency and maintenance vehicles
  answer: D
  explanation: Vermont law requires drivers to move over or slow down for all stationary
    vehicles with flashing lights, including emergency, towing, and highway maintenance
    vehicles.
- id: 36
  category: driver_testing
  question: In Vermont, how many points are added to your driving record for illegally
    passing a stopped school bus with its red lights flashing?
  choices:
    A: 2 points
    B: 4 points
    C: 5 points
    D: 10 points
  answer: C
  explanation: Passing a stopped school bus with red lights flashing is a serious
    violation in Vermont and results in 5 points being added to the driver's record.
- id: 37
  category: driver_testing
  question: Vermont law requires you to turn on your headlights whenever you are using
    your windshield wipers in what mode?
  choices:
    A: Intermittent mode only
    B: High speed mode only
    C: Continuous mode
    D: Headlights are never required with wipers
  answer: C
  explanation: Vermont law requires that headlights be turned on whenever windshield
    wipers are in continuous use due to precipitation or poor visibility.
- id: 38
  category: driver_testing
  question: When passing a bicycle in Vermont, what is the minimum distance a motorist
    must maintain between their vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: Vermont law (23 V.S.A. § 1139) requires motorists to exercise due care
    and maintain at least 4 feet of clearance when passing a person operating a bicycle.
- id: 39
  category: driver_testing
  question: In Vermont, it is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: According to Vermont's rules of the road (23 V.S.A. § 1104), parking
    within 15 feet of a fire hydrant is prohibited.
- id: 40
  category: driver_testing
  question: Vermont registered vehicles must undergo a safety and emissions inspection
    how often?
  choices:
    A: Every 6 months
    B: Once a year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: All vehicles registered in Vermont must be inspected once a year at
    an official inspection station.
- id: 41
  category: driver_testing
  question: If you are convicted of speeding in a Vermont highway work zone when workers
    are present, what happens to the fine?
  choices:
    A: The fine is waived for a first offense
    B: The fine is doubled
    C: The fine is tripled
    D: The fine remains the same but points are doubled
  answer: B
  explanation: Vermont law stipulates that fines for speeding in a designated work
    zone are doubled when workers are present.
- id: 42
  category: driver_testing
  question: The Vermont Driver's Manual recommends using which rule to maintain a
    safe following distance behind the vehicle in front of you?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The four-second rule
    D: The six-second rule
  answer: C
  explanation: The Vermont Driver's Manual recommends a four-second following distance
    to allow enough time to react to hazards.
- id: 43
  category: driver_testing
  question: In Vermont, you must dim your high beam headlights when you are within
    how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Vermont law (23 V.S.A. § 1246) requires drivers to switch to low beams
    when an oncoming vehicle is within 500 feet.
- id: 44
  category: driver_testing
  question: If you fail the Vermont road test, how long must you wait before you are
    eligible to take the test again for the first time?
  choices:
    A: 24 hours
    B: 3 days
    C: 1 week
    D: 1 month
  answer: C
  explanation: In Vermont, if you fail the road test, you must wait at least one week
    before you can schedule and take the test again.
- id: 45
  category: driver_testing
  question: The Vermont written knowledge test consists of 20 multiple-choice questions.
    How many questions must you answer correctly to pass?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: C
  explanation: A passing score on the Vermont knowledge test is 80%, which requires
    answering at least 16 out of 20 questions correctly.
- id: 46
  category: driver_testing
  question: Which of the following is a requirement for the vehicle used during a
    Vermont road test?
  choices:
    A: It must be a mid-sized sedan
    B: It must have a valid Vermont inspection sticker
    C: It must be owned by the applicant
    D: It must have a manual transmission
  answer: B
  explanation: The vehicle used for the road test must be in good mechanical condition,
    properly registered, insured, and must display a valid inspection sticker.
- id: 47
  category: driver_testing
  question: If a Vermont driver is convicted of failing to stop for a school bus that
    has its red lights flashing, how many points will be added to their driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 10 points
  answer: C
  explanation: Passing a stopped school bus with red lights flashing is a serious
    violation in Vermont and carries a penalty of 5 points.
- id: 48
  category: driver_testing
  question: Vermont's 'Move Over' law requires drivers to do what when approaching
    a stationary emergency vehicle with flashing lights on a multi-lane highway?
  choices:
    A: Stop completely until signaled to proceed
    B: Maintain speed but honk to alert the emergency workers
    C: Slow down and, if safe to do so, move into a lane not adjacent to the vehicle
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Vermont law requires drivers to proceed with caution and, if safe and
    possible, make a lane change into a lane not adjacent to the stationary emergency
    or maintenance vehicle.
- id: 49
  category: driver_testing
  question: Under Vermont law, when are you required to turn on your vehicle's headlights?
  choices:
    A: Only between sunset and sunrise
    B: Whenever you are driving on a dirt road
    C: Whenever you use your windshield wipers due to precipitation
    D: Only when visibility is less than 100 feet
  answer: C
  explanation: Vermont law requires that headlights be turned on whenever the vehicle's
    windshield wipers are in use due to rain, snow, or other precipitation.
- id: 50
  category: driver_testing
  question: For drivers of commercial motor vehicles in Vermont, what is the Blood
    Alcohol Content (BAC) limit that constitutes a legal violation?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: While the standard limit for adult non-commercial drivers is 0.08%,
    the BAC limit for commercial drivers in Vermont is 0.04%.
- id: 51
  category: driver_testing
  question: Before turning or changing lanes in Vermont, you must signal your intention
    at least how many feet in advance?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Vermont law requires drivers to signal at least 100 feet before making
    a turn or changing lanes.
- id: 52
  category: driver_testing
  question: Vermont law prohibits the idling of a motor vehicle for more than how
    many minutes in any 60-minute period?
  choices:
    A: 2 minutes
    B: 5 minutes
    C: 10 minutes
    D: 15 minutes
  answer: B
  explanation: To reduce air pollution, Vermont law generally prohibits idling a vehicle
    for more than 5 minutes in any 60-minute period, with some exceptions for extreme
    temperatures.
- id: 53
  category: driver_responsibility
  question: In Vermont, you must file an official accident report with the Commissioner
    of Motor Vehicles if the property damage to all vehicles and property combined
    exceeds what amount?
  choices:
    A: $1,000
    B: $2,000
    C: $3,000
    D: $5,000
  answer: C
  explanation: According to the Vermont Driver's Manual, a written report must be
    filed with the DMV within 72 hours if any person is injured or killed, or if the
    total damage to all property is $3,000 or more.
- id: 54
  category: driver_responsibility
  question: How many hours do you have to file a written accident report with the
    Vermont DMV if an accident results in injury, death, or significant property damage?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 96 hours
  answer: C
  explanation: Vermont law requires that a written accident report be submitted to
    the Commissioner of Motor Vehicles within 72 hours of the occurrence.
- id: 55
  category: driver_responsibility
  question: After registering a vehicle in Vermont, within how many days must the
    vehicle undergo a safety inspection?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: All motor vehicles registered in Vermont must be inspected once each
    year. If you register a vehicle for the first time, you have 15 days to get it
    inspected.
- id: 56
  category: driver_responsibility
  question: If a Vermont driver is convicted of a DUI, how long are they typically
    required to maintain an SR-22 (Financial Responsibility Insurance) certificate?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: Permanently
  answer: B
  explanation: Drivers who have had their license suspended for certain violations,
    such as a DUI, are required to file and maintain proof of financial responsibility
    (SR-22) for 3 years.
- id: 57
  category: driver_responsibility
  question: If a Vermont driver is under 18 years of age and is caught using a portable
    electronic device while driving, what is the mandatory suspension period for a
    first offense?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: For Junior Operators (under 18), a first offense of using a portable
    electronic device while driving results in a 30-day license suspension.
- id: 58
  category: driver_responsibility
  question: How many points are assessed for 'Leaving the Scene of an Accident' (Property
    Damage) in Vermont?
  choices:
    A: 2 points
    B: 5 points
    C: 10 points
    D: 12 points
  answer: B
  explanation: Leaving the scene of an accident involving property damage results
    in 5 points on a Vermont driving record.
- id: 59
  category: driver_responsibility
  question: In Vermont, for which of the following vehicles is a Certificate of Title
    NOT required?
  choices:
    A: A vehicle that is more than 15 years old
    B: A vehicle purchased from a private seller
    C: A vehicle with a diesel engine
    D: A vehicle used for commercial purposes
  answer: A
  explanation: Vermont does not issue titles for vehicles that are more than 15 years
    old.
- id: 60
  category: driver_responsibility
  question: If you are a Vermont resident and your license is suspended in another
    state, what is the status of your Vermont license?
  choices:
    A: It remains valid in Vermont only
    B: It is valid for 30 days while you appeal
    C: It will be suspended in Vermont as well
    D: It is unaffected unless the violation occurred in New England
  answer: C
  explanation: Vermont is a member of the Driver License Compact; if your driving
    privilege is suspended in another state, it will also be suspended in Vermont.
- id: 61
  category: driver_responsibility
  question: Which of the following is a mandatory insurance coverage in Vermont that
    protects you if you are hit by a driver who does not have insurance?
  choices:
    A: Collision Coverage
    B: Comprehensive Coverage
    C: Uninsured Motorist Coverage
    D: Medical Payments Coverage
  answer: C
  explanation: Vermont law requires all motorists to carry Uninsured/Underinsured
    Motorist (UM/UIM) coverage to protect against drivers without adequate insurance.
- id: 62
  category: driver_responsibility
  question: In Vermont, what is the point value for 'Failure to Yield to an Emergency
    Vehicle'?
  choices:
    A: 2 points
    B: 5 points
    C: 8 points
    D: 10 points
  answer: B
  explanation: Failure to yield to an emergency vehicle is a serious violation in
    Vermont and carries a penalty of 5 points.
- id: 63
  category: driver_responsibility
  question: A Vermont driver's license can be suspended for which of the following
    non-driving reasons?
  choices:
    A: Failure to pay Vermont income tax
    B: Failure to pay child support
    C: Failure to register for the Selective Service
    D: Both A and B
  answer: D
  explanation: Vermont law allows for the suspension of a driver's license for failure
    to pay child support or failure to pay state income taxes.
- id: 64
  category: driver_responsibility
  question: If you are involved in a reportable accident in Vermont, how many hours
    do you have to file a written report with the Commissioner of Motor Vehicles?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 96 hours
  answer: C
  explanation: Vermont law requires that a written accident report be filed with the
    DMV within 72 hours of the occurrence.
- id: 65
  category: driver_responsibility
  question: How many points are added to a Vermont driving record for the first offense
    of illegally passing a stopped school bus?
  choices:
    A: 2 points
    B: 4 points
    C: 5 points
    D: 10 points
  answer: C
  explanation: Illegally passing a stopped school bus is a serious violation in Vermont
    and results in 5 points being added to the driver's record.
- id: 66
  category: driver_responsibility
  question: In Vermont, if you are convicted of a DUI or certain other serious offenses,
    you may be required to maintain 'Financial Responsibility Insurance' (SR-22) for
    how long?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: Permanently
  answer: B
  explanation: Drivers required to show proof of financial responsibility (SR-22)
    must generally maintain this insurance for a period of 3 years.
- id: 67
  category: driver_responsibility
  question: Which of the following is true regarding headlight use in Vermont?
  choices:
    A: Headlights are only required between sunset and sunrise.
    B: Headlights must be turned on whenever you use your windshield wipers.
    C: Headlights are only required when visibility is less than 100 feet.
    D: Headlights must be turned on only on highways.
  answer: B
  explanation: Vermont law requires that headlights be turned on whenever the vehicle's
    windshield wipers are in use due to precipitation or poor weather conditions.
- id: 68
  category: driver_responsibility
  question: How many points are assessed for a conviction of 'Reckless Driving' in
    Vermont?
  choices:
    A: 5 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: C
  explanation: Reckless driving is a major violation in Vermont and results in 10
    points, which triggers an immediate license suspension.
- id: 69
  category: driver_responsibility
  question: 'In Vermont, a child must be secured in a rear-facing child safety seat
    until they are at least:'
  choices:
    A: 6 months old
    B: 1 year old and 20 pounds
    C: 2 years old
    D: 4 years old
  answer: B
  explanation: Vermont law requires children to be in a rear-facing child safety seat
    until they are at least one year of age AND weigh at least 20 pounds.
- id: 70
  category: driver_responsibility
  question: In Vermont, if you are convicted of 'Eluding a Law Enforcement Officer,'
    how many points are added to your driving record?
  choices:
    A: 5 points
    B: 8 points
    C: 10 points
    D: 15 points
  answer: C
  explanation: Eluding a law enforcement officer is a major violation in Vermont and
    carries a penalty of 10 points.
- id: 71
  category: driver_responsibility
  question: In Vermont, how many points are assessed for speeding in a designated
    school zone?
  choices:
    A: Double the standard points for the speed
    B: A flat 5 points
    C: A flat 8 points
    D: Points are not assessed for school zone violations
  answer: A
  explanation: In Vermont, the points for speeding in a designated school zone are
    doubled (e.g., 1-10 mph over becomes 4 points instead of 2).
- id: 72
  category: safe_driving_rules
  question: In Vermont, what is the unposted speed limit on state highways?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: According to the Vermont Driver's Manual, the speed limit on state
    highways is 50 mph unless otherwise posted.
- id: 73
  category: safe_driving_rules
  question: When you intend to turn, you must signal your intent at least how many
    feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Vermont law requires drivers to signal their intention to turn at least
    100 feet before making the turn.
- id: 74
  category: safe_driving_rules
  question: When parking near an intersection, what is the minimum distance you must
    maintain from a stop sign or flashing beacon?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Vermont law prohibits parking within 30 feet of any flashing beacon,
    stop sign, or traffic-control signal located at the side of a highway.
- id: 75
  category: safe_driving_rules
  question: 'Vermont law requires drivers to turn on headlights whenever they are
    using their windshield wipers due to precipitation. This is known as the:'
  choices:
    A: Wipers On, Lights On law
    B: Rainy Day Rule
    C: Visibility Act
    D: Clear Sight Regulation
  answer: A
  explanation: Vermont law (23 V.S.A. § 1243) requires that headlights be lighted
    whenever the vehicle's windshield wipers are in use due to precipitation or any
    other condition that causes poor visibility.
- id: 76
  category: safe_driving_rules
  question: When a school bus is stopped with its red lights flashing on a highway
    with separate roadways (divided by a median), which drivers must stop?
  choices:
    A: Drivers in all lanes must stop
    B: Only drivers following the bus must stop
    C: Only drivers on the same roadway as the bus must stop
    D: No one is required to stop if there is a median
  answer: C
  explanation: In Vermont, if a school bus is stopped on a divided highway with a
    median or barrier, only traffic traveling in the same direction as the bus is
    required to stop.
- id: 77
  category: safe_driving_rules
  question: 'The Vermont Driver''s Manual recommends maintaining a following distance
    of at least:'
  explanation: The Vermont Driver's Manual recommends a following distance of at least
    four seconds to allow enough time to react to hazards.
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: C
- id: 78
  category: safe_driving_rules
  question: At a four-way stop, if two vehicles arrive at the same time, who has the
    right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling at a higher speed
    D: The vehicle that signals first
  answer: B
  explanation: At intersections where all directions have stop signs, the driver on
    the left must yield the right-of-way to the driver on the right.
- id: 79
  category: safe_driving_rules
  question: Under Vermont law, when is it permissible to pass another vehicle on the
    right?
  choices:
    A: When the vehicle ahead is making or about to make a left turn
    B: Whenever you are on a two-lane road
    C: When the vehicle ahead is driving below the speed limit
    D: It is never legal to pass on the right in Vermont
  answer: A
  explanation: Passing on the right is permitted in Vermont when the vehicle being
    overtaken is making or about to make a left turn, provided there is sufficient
    pavement width.
- id: 80
  category: safe_driving_rules
  question: What is the penalty for speeding in a Vermont highway work zone when workers
    are present?
  choices:
    A: A flat $500 fine
    B: The fine is doubled
    C: Automatic license suspension for 30 days
    D: The fine is tripled
  answer: B
  explanation: In Vermont, fines for speeding are doubled in marked work zones when
    workers are present.
- id: 81
  category: safe_driving_rules
  question: 'When turning left at an intersection, you must yield the right-of-way
    to:'
  choices:
    A: No one, as long as you have a green light
    B: Only pedestrians
    C: Only vehicles coming from the right
    D: Any vehicle approaching from the opposite direction
  answer: D
  explanation: Vermont law states that a driver turning left within an intersection
    shall yield the right-of-way to any vehicle approaching from the opposite direction
    which is within the intersection or so close as to constitute an immediate hazard.
- id: 82
  category: safe_driving_rules
  question: 'When passing a bicycle traveling in the same direction in Vermont, a
    motorist must leave a safe distance of at least:'
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: Vermont law (23 V.S.A. § 1033) requires motorists to pass vulnerable
    users (including bicyclists) with at least 4 feet of clearance.
- id: 83
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit in a Vermont city, town,
    or village?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: D
  explanation: In Vermont, the default speed limit in any city, town, or village is
    35 mph unless a different limit is posted.
- id: 84
  category: safe_driving_rules
  question: In Vermont, how far in advance must you signal before making a turn or
    changing lanes?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: B
  explanation: Vermont law requires drivers to signal their intention to turn or change
    lanes at least 100 feet before the maneuver.
- id: 85
  category: safe_driving_rules
  question: Under Vermont law, you are prohibited from parking within how many feet
    of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: It is illegal to park a vehicle within 15 feet of a fire hydrant in
    Vermont.
- id: 86
  category: safe_driving_rules
  question: In Vermont, you may not park your vehicle within how many feet of a crosswalk
    at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Vermont regulations state that you cannot park within 20 feet of a
    crosswalk at an intersection.
- id: 87
  category: safe_driving_rules
  question: When parking near a railroad crossing in Vermont, what is the minimum
    distance you must maintain from the nearest rail?
  choices:
    A: 15 feet
    B: 25 feet
    C: 50 feet
    D: 100 feet
  answer: C
  explanation: Drivers in Vermont must not park within 50 feet of the nearest rail
    of a railroad crossing.
- id: 88
  category: safe_driving_rules
  question: 'When meeting an oncoming vehicle at night in Vermont, you must dim your
    high beams when the vehicle is within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Vermont law requires you to switch to low beams when an oncoming vehicle
    is within 500 feet to avoid blinding the other driver.
- id: 89
  category: safe_driving_rules
  question: 'In Vermont, when following another vehicle from behind at night, you
    must dim your high beams when you are within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: You must switch to low beams when following another vehicle within
    300 feet to prevent glare in the lead driver's mirrors.
- id: 90
  category: safe_driving_rules
  question: 'To maintain a safe following distance under normal driving conditions,
    the Vermont Driver''s Manual recommends using the:'
  choices:
    A: Two-second rule
    B: Three-second rule
    C: Four-second rule
    D: Five-second rule
  answer: C
  explanation: The Vermont Driver's Manual recommends a four-second following distance
    to allow enough time to react to hazards.
- id: 91
  category: safe_driving_rules
  question: 'In Vermont, you must stop for a school bus with flashing red lights unless:'
  choices:
    A: You are traveling in the opposite direction on a divided highway with a median
      or barrier
    B: You are in a rush and the bus has been stopped for more than two minutes
    C: The bus is stopped on a road with four or more lanes and no median
    D: You are traveling at the speed limit and cannot stop safely
  answer: A
  explanation: Drivers do not need to stop for a school bus with flashing red lights
    if they are traveling in the opposite direction on a divided highway where the
    roadways are separated by a physical barrier or unpaved median.
- id: 92
  category: safe_driving_rules
  question: When entering a roundabout in Vermont, to whom must you yield the right-of-way?
  choices:
    A: Traffic entering from the right
    B: Traffic already in the roundabout
    C: No one; you have the right of way when entering
    D: Only emergency vehicles
  answer: B
  explanation: Drivers entering a roundabout must yield to the traffic already circulating
    within the roundabout.
- id: 93
  category: defensive_driving
  question: According to the Vermont Driver's Manual, what is the recommended following
    distance behind the vehicle in front of you under ideal conditions?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Five seconds
  answer: C
  explanation: The Vermont Driver's Manual recommends using the 'four-second rule'
    to maintain a safe following distance under ideal driving conditions.
- id: 94
  category: defensive_driving
  question: In Vermont, when are you legally required to turn on your headlights in
    relation to weather conditions?
  choices:
    A: Only when it is dark outside
    B: Whenever you are using your windshield wipers due to precipitation
    C: Only during heavy snowfall
    D: Only when visibility is less than 100 feet
  answer: B
  explanation: Vermont law requires drivers to turn on their headlights whenever windshield
    wipers are in use due to rain, snow, or other precipitation.
- id: 95
  category: defensive_driving
  question: At what speed can hydroplaning (tires losing contact with the road due
    to water) begin to occur on wet Vermont roads?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Only during hurricane-force rain
    D: At any speed above 15 mph
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph. At 50 mph, tires
    may lose all contact with the road surface if there is enough water.
- id: 96
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn, how far ahead should
    you scan the road while driving in Vermont?
  choices:
    A: 2 to 5 seconds
    B: 5 to 8 seconds
    C: 10 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: The Vermont Driver's Manual suggests scanning the road 10 to 15 seconds
    ahead to identify potential hazards early.
- id: 97
  category: defensive_driving
  question: Under Vermont law, what is the minimum distance a motorist must maintain
    when passing a vulnerable user, such as a bicyclist or pedestrian?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: Vermont law (23 V.S.A. § 1033) requires motorists to pass vulnerable
    users, including bicyclists, with a minimum of 4 feet of clearance.
- id: 98
  category: defensive_driving
  question: In Vermont, what is the safest way to handle a skid on an icy road?
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Shift the car into neutral and turn off the engine
    D: Take your foot off the gas and steer in the direction you want the front of
      the vehicle to go
  answer: D
  explanation: To recover from a skid, you should stay off the brakes, ease off the
    gas, and steer in the direction you want the vehicle to go.
- id: 99
  category: defensive_driving
  question: When driving in heavy fog in Vermont, which headlight setting should you
    use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights, to reduce glare
  answer: B
  explanation: Low beams should be used in fog. High beams reflect off the fog and
    cause glare, making it harder to see.
- id: 100
  category: defensive_driving
  question: 'In Vermont, you are required by law to use your headlights whenever visibility
    is reduced to less than:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 700 feet
    D: 1,000 feet
  answer: B
  explanation: Vermont law states that headlights must be used when visibility is
    less than 500 feet due to insufficient light or unfavorable atmospheric conditions.
- id: 101
  category: defensive_driving
  question: When approaching a railroad crossing in Vermont, you must stop your vehicle
    within how many feet of the nearest rail?
  choices:
    A: 5 to 20 feet
    B: 10 to 25 feet
    C: 15 to 50 feet
    D: 25 to 75 feet
  answer: C
  explanation: Vermont law requires drivers to stop between 15 and 50 feet from the
    nearest rail at a railroad crossing when signals are flashing or a train is approaching.
- id: 102
  category: defensive_driving
  question: How many points are assessed against your Vermont driving record for a
    conviction of 'Following too closely' (tailgating)?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: B
  explanation: In Vermont, 'Following too closely' is a moving violation that results
    in 2 points being added to your driving record.
- id: 103
  category: defensive_driving
  question: 'When driving behind a large truck or bus in Vermont, you should increase
    your following distance because:'
  choices:
    A: They have larger blind spots (No-Zones)
    B: They require more room to stop
    C: They may spray debris or water onto your windshield
    D: All of the above
  answer: D
  explanation: Defensive driving in Vermont involves giving large vehicles extra space
    due to their limited visibility, longer stopping distances, and the potential
    for road spray.
- id: 104
  category: defensive_driving
  question: If you are driving in Vermont and your brakes stop working, what is the
    first defensive action you should take?
  choices:
    A: Turn off the engine immediately
    B: Shift to a lower gear and pump the brake pedal several times
    C: Jump out of the car
    D: Shift into reverse
  answer: B
  explanation: If your brakes fail, you should shift to a lower gear to use engine
    braking and pump the brake pedal rapidly to build up enough hydraulic pressure
    to stop.
- id: 105
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, Vermont law
    and safety guidelines suggest you should look how far down the road?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: As far as the next intersection
  answer: B
  explanation: Vermont defensive driving guidelines state that you should look 10
    to 15 seconds ahead of your vehicle to anticipate hazards.
- id: 106
  category: defensive_driving
  question: Under Vermont's 'Vulnerable User' law, how much space must a driver leave
    when passing a person riding a bicycle or walking on the shoulder?
  choices:
    A: At least 2 feet
    B: At least 3 feet
    C: At least 4 feet
    D: At least 6 feet
  answer: C
  explanation: Vermont law (23 V.S.A. § 1033) requires motorists to provide at least
    4 feet of clearance when passing a vulnerable user, such as a cyclist or pedestrian.
- id: 107
  category: defensive_driving
  question: In Vermont, if your vehicle's wipers are in use due to rain, snow, or
    sleet, what else must be turned on by law?
  choices:
    A: Hazard lights
    B: Interior lights
    C: Fog lights
    D: Headlights
  answer: D
  explanation: Vermont law requires headlights to be on whenever the vehicle's windshield
    wipers are in use due to precipitation or when visibility is less than 500 feet.
- id: 108
  category: defensive_driving
  question: When driving on a Vermont highway with two or more lanes in the same direction,
    what must you do when approaching a stationary emergency vehicle with flashing
    lights?
  choices:
    A: Maintain speed but move to the left lane
    B: Slow down and, if safe, move to a lane not adjacent to the emergency vehicle
    C: Stop immediately in the roadway
    D: Speed up to pass the area quickly
  answer: B
  explanation: Vermont's 'Move Over' law requires drivers to slow down and change
    lanes (if safe) to provide a buffer for emergency and maintenance vehicles stopped
    on the side of the road.
- id: 109
  category: defensive_driving
  question: At what speed can hydroplaning begin in heavy rain, where tires lose contact
    with the road surface?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Only above 65 mph
    D: At any speed over 15 mph
  answer: A
  explanation: The Vermont Driver's Manual warns that hydroplaning can start at speeds
    as low as 35 mph, and tires may lose all contact with the road at 55 mph.
- id: 110
  category: defensive_driving
  question: Vermont law (23 V.S.A. § 1129) requires drivers to do what regarding snow
    and ice on their vehicles?
  choices:
    A: Only clear the driver's side windshield
    B: Clear only the front and rear windows
    C: Remove all accumulated ice or snow that might pose a threat to others
    D: Nothing; it is not a legal requirement
  answer: C
  explanation: Vermont law requires drivers to clear snow and ice from their vehicle
    so it does not obstruct their view or blow off and endanger other motorists.
- id: 111
  category: defensive_driving
  question: When entering a roundabout in Vermont, which of the following is a correct
    defensive driving practice?
  choices:
    A: Always yield to traffic entering from the right
    B: Yield to traffic already in the circle
    C: Stop before entering even if no traffic is present
    D: Speed up to merge into the flow of traffic
  answer: B
  explanation: In Vermont roundabouts, entering traffic must always yield the right-of-way
    to traffic already circulating in the roundabout.
- id: 112
  category: defensive_driving
  question: If you are driving in Vermont and encounter heavy fog, which light setting
    should you use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights
  answer: B
  explanation: Low beams are required in fog because high beams reflect off the moisture
    in the air, causing glare and making it harder to see.
- id: 113
  category: defensive_driving
  question: When a school bus is stopped with its red lights flashing and stop arm
    extended on a Vermont road, when are you allowed to pass?
  choices:
    A: If you are on the opposite side of a divided highway
    B: If the bus driver waves you through
    C: Never; you must stop from either direction until the lights stop flashing
    D: Only if there are at least two lanes between you and the bus
  answer: C
  explanation: In Vermont, you must stop for a school bus with flashing red lights
    regardless of which direction you are traveling, even on divided highways.
- id: 114
  category: defensive_driving
  question: 'To prevent ''highway hypnosis'' during long trips on Vermont interstates,
    the manual recommends:'
  choices:
    A: Drinking coffee every hour
    B: Resting your eyes by looking at the floorboards occasionally
    C: Shifting your eyes and looking at different objects
    D: Turning the radio to maximum volume
  answer: C
  explanation: Defensive driving involves keeping your eyes moving. Shifting your
    focus to different distances and objects helps prevent the trance-like state known
    as highway hypnosis.
- id: 115
  category: alcohol_drugs_health
  question: 'Under Vermont law, a first-offense DUI conviction can result in a maximum
    term of imprisonment of up to:'
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: D
  explanation: In Vermont, a first-offense DUI is a misdemeanor that carries a potential
    criminal penalty of up to two years in prison.
- id: 116
  category: alcohol_drugs_health
  question: Vermont's 'Open Container Law' prohibits the possession of an open container
    of alcohol in the passenger area of a motor vehicle. Where is it legal to carry
    an open container?
  choices:
    A: In the glove compartment
    B: In the center console
    C: In the trunk
    D: Under the driver's seat
  answer: C
  explanation: Open containers of alcohol must be stored in an area not normally occupied
    by the driver or passengers, such as the trunk or behind the last upright seat
    in a vehicle without a trunk.
- id: 117
  category: alcohol_drugs_health
  question: 'If a Vermont driver is suspected of driving under the influence of drugs,
    a specially trained officer may be called to perform a clinical evaluation. This
    officer is known as a:'
  choices:
    A: Narcotics Enforcement Agent
    B: Drug Recognition Expert (DRE)
    C: Chemical Impairment Specialist
    D: Field Sobriety Technician
  answer: B
  explanation: Vermont utilizes Drug Recognition Experts (DREs) who are trained to
    identify impairment from specific categories of drugs other than alcohol.
- id: 118
  category: alcohol_drugs_health
  question: 'In Vermont, if you have a prior DUI conviction and you refuse to submit
    to an evidentiary breath test upon a second arrest, you can be charged with:'
  choices:
    A: A civil traffic violation only
    B: Criminal Refusal
    C: Obstruction of Justice
    D: Reckless Endangerment
  answer: B
  explanation: While a first refusal is generally a civil matter leading to license
    suspension, refusing a test when you have a prior DUI conviction is a criminal
    offense in Vermont.
- id: 119
  category: alcohol_drugs_health
  question: What is the maximum fine for a first-offense DUI conviction in the state
    of Vermont (excluding court costs and fees)?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,500
  answer: B
  explanation: Under 23 V.S.A. § 1210, a person convicted of a first-offense DUI in
    Vermont may be fined not more than $750.00.
- id: 120
  category: alcohol_drugs_health
  question: 'A driver under the age of 21 who is found to have a BAC of 0.02% or higher
    for the first time will have their Vermont driving privileges suspended for:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Vermont's 'Zero Tolerance' law mandates a 6-month license suspension
    for a first-time 0.02% BAC violation by a minor.
- id: 121
  category: alcohol_drugs_health
  question: To regain driving privileges after a DUI suspension in Vermont, a driver
    may be required to install an Ignition Interlock Device (IID). Who is responsible
    for the costs of installation and maintenance?
  choices:
    A: The Vermont DMV
    B: The local police department
    C: The driver
    D: The driver's insurance company
  answer: C
  explanation: The driver is solely responsible for all costs associated with the
    installation, leasing, and maintenance of an Ignition Interlock Device.
- id: 122
  category: alcohol_drugs_health
  question: 'If a Vermont driver has a medical condition (such as epilepsy or diabetes)
    that could impair their ability to drive safely, they are required by law to:'
  choices:
    A: Only drive during daylight hours
    B: Report the condition to the DMV
    C: Carry a doctor's note at all times
    D: Surrender their license immediately
  answer: B
  explanation: Vermont law requires drivers to notify the DMV of any physical or mental
    condition that may affect their ability to operate a motor vehicle safely.
- id: 123
  category: alcohol_drugs_health
  question: 'When alcohol is combined with other drugs, such as tranquilizers or cold
    medicines, the effect on driving ability is:'
  choices:
    A: Reduced because they cancel each other out
    B: The same as if only alcohol was consumed
    C: Multiplied (synergistic effect)
    D: Unpredictable but generally safer
  answer: C
  explanation: Combining alcohol with other drugs can multiply the effects of both,
    leading to severe impairment even if small amounts are consumed.
- id: 124
  category: alcohol_drugs_health
  question: 'In Vermont, a DUI conviction that results in the death of another person
    can lead to a prison sentence of up to:'
  choices:
    A: 5 years
    B: 10 years
    C: 15 years
    D: 25 years
  answer: C
  explanation: DUI resulting in death is a serious felony in Vermont, punishable by
    up to 15 years in prison.
- id: 125
  category: alcohol_drugs_health
  question: How does alcohol consumption specifically affect a driver's vision?
  choices:
    A: It improves night vision
    B: It increases peripheral (side) vision
    C: It reduces the ability to judge distances and speeds
    D: It makes colors appear more vivid
  answer: C
  explanation: Alcohol impairs the eye muscles, reducing the ability to focus and
    significantly degrading depth perception and the ability to judge the speed of
    other vehicles.
- id: 126
  category: alcohol_drugs_health
  question: 'If you are taking a prescription drug and a doctor has not warned you
    about driving, but the drug makes you feel drowsy, you should:'
  choices:
    A: Drive only on familiar roads
    B: Drink coffee before driving to stay awake
    C: Not drive until the effects wear off
    D: Drive faster to reach your destination sooner
  answer: C
  explanation: Regardless of whether a doctor provided a warning, it is the driver's
    legal responsibility to ensure they are not impaired. If a drug causes drowsiness,
    you must not drive.
- id: 127
  category: alcohol_drugs_health
  question: Which of the following is the only effective way to lower your Blood Alcohol
    Concentration (BAC) before driving?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Waiting for time to pass
  answer: D
  explanation: Only time can sober a person up. The body oxidizes alcohol at a constant
    rate, and coffee, showers, or exercise do not speed up this process.
- id: 128
  category: alcohol_drugs_health
  question: 'Following a DUI conviction in Vermont, a driver must maintain ''Proof
    of Financial Responsibility'' (SR-22 insurance) for a minimum of:'
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: Permanently
  answer: B
  explanation: Vermont typically requires drivers to file and maintain an SR-22 certificate
    for three years following a DUI-related license suspension.
- id: 129
  category: alcohol_drugs_health
  question: In Vermont, what is the maximum fine for a first-offense conviction of
    Driving Under the Influence (DUI)?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $1,500
  answer: B
  explanation: According to the Vermont Driver's Manual, a person convicted of a first-offense
    DUI may be fined up to $750, plus court surcharges.
- id: 130
  category: alcohol_drugs_health
  question: Vermont's 'Open Container Law' prohibits the possession of an open container
    of alcohol in which part of the vehicle?
  choices:
    A: Only the driver's seat
    B: The trunk only
    C: The passenger area of any motor vehicle on a public highway
    D: Only if the engine is running
  answer: C
  explanation: Vermont law prohibits the possession of an open container of alcoholic
    beverage in the passenger area of any motor vehicle located upon a public highway.
- id: 131
  category: alcohol_drugs_health
  question: A second DUI conviction in Vermont will result in a driver's license suspension
    of at least how many months?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: C
  explanation: A second DUI conviction in Vermont carries a mandatory license suspension
    of 18 months.
- id: 132
  category: alcohol_drugs_health
  question: What is the maximum term of imprisonment for a first-offense DUI conviction
    in Vermont?
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: D
  explanation: In Vermont, a first-offense DUI conviction can result in a prison term
    of up to 2 years.
- id: 133
  category: alcohol_drugs_health
  question: If a Vermont driver's license is suspended for DUI, they may be eligible
    to drive early if they participate in which program?
  choices:
    A: The Defensive Driving Program
    B: The Ignition Interlock Device (IID) Program
    C: The Community Service Program
    D: The Driver Rehabilitation School
  answer: B
  explanation: Vermont allows drivers with suspended licenses due to DUI to apply
    for a Restricted Driver's License (RDL) if they install an Ignition Interlock
    Device.
- id: 134
  category: alcohol_drugs_health
  question: Can a driver in Vermont be charged with DUI if they are driving under
    the influence of a legally prescribed medication?
  choices:
    A: No, as long as they have a valid prescription
    B: No, DUI only applies to alcohol and illegal drugs
    C: Yes, if the medication impairs their ability to drive safely
    D: Yes, but only if they also have alcohol in their system
  answer: C
  explanation: Vermont's DUI laws apply to any substance that impairs a person's ability
    to drive safely, including prescription and over-the-counter medications.
- id: 135
  category: alcohol_drugs_health
  question: A Vermont driver is considered to be 'Aggravated DUI' if their Blood Alcohol
    Content (BAC) is at or above what level?
  choices:
    A: 0.10%
    B: 0.12%
    C: 0.16%
    D: 0.20%
  answer: C
  explanation: Vermont law defines an 'Aggravated DUI' as operating a vehicle with
    a BAC of 0.16% or higher, which carries enhanced penalties.
- id: 136
  category: alcohol_drugs_health
  question: How long does it typically take the human body to process and eliminate
    the alcohol from one standard drink (12 oz beer, 5 oz wine, or 1.5 oz shot)?
  choices:
    A: 30 minutes
    B: 1 hour
    C: 2 hours
    D: 4 hours
  answer: B
  explanation: On average, it takes the body about one hour to process the alcohol
    in one standard drink. Only time can sober a person up.
- id: 137
  category: alcohol_drugs_health
  question: 'If you have a physical or mental condition that may affect your ability
    to drive safely, you must notify the Vermont DMV within:'
  choices:
    A: 10 days
    B: 30 days
    C: 6 months
    D: Your next license renewal
  answer: B
  explanation: Vermont law requires drivers to report any physical or mental condition
    that may affect their ability to drive safely to the DMV within 30 days of the
    condition's onset or change.
- id: 138
  category: alcohol_drugs_health
  question: Under Vermont law, what is the legal status of driving while impaired
    by marijuana?
  choices:
    A: It is legal because marijuana is legal in Vermont
    B: It is only illegal if the driver is under 21
    C: It is illegal and treated as a DUI
    D: It is only a civil fine, not a criminal offense
  answer: C
  explanation: Even though recreational marijuana is legal in Vermont, driving while
    impaired by THC is illegal and prosecuted under the state's DUI laws.
- id: 139
  category: penalties_and_points
  question: If a Vermont driver is convicted of speeding more than 30 miles per hour
    over the limit, how many points will be added to their record?
  choices:
    A: 5 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: B
  explanation: Speeding 31 mph or more over the posted speed limit is a major violation
    in Vermont and carries an 8-point penalty.
- id: 140
  category: penalties_and_points
  question: What is the point penalty for a first-offense conviction of using a handheld
    portable electronic device while driving in Vermont?
  choices:
    A: 0 points
    B: 2 points
    C: 5 points
    D: 10 points
  answer: B
  explanation: A first offense for using a handheld electronic device while driving
    in Vermont results in 2 points. Subsequent offenses result in 5 points.
- id: 141
  category: penalties_and_points
  question: A conviction for 'Careless and Negligent Operation' of a motor vehicle
    in Vermont results in how many points?
  choices:
    A: 5 points
    B: 8 points
    C: 10 points
    D: 15 points
  answer: C
  explanation: Careless and Negligent Operation is considered a major violation in
    Vermont and results in the maximum single-offense penalty of 10 points.
- id: 142
  category: penalties_and_points
  question: When a Vermont driver reaches the 10-point threshold for the first time
    within a two-year period, for how long is their license suspended?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: A
  explanation: In Vermont, the first time you accumulate 10 points within a two-year
    period, your license is suspended for 10 days.
- id: 143
  category: penalties_and_points
  question: If a Vermont driver accumulates 20 points on their record within a two-year
    period, what is the duration of the license suspension?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Under Vermont law, accumulating 20 points within a two-year period
    results in a 90-day license suspension.
- id: 144
  category: penalties_and_points
  question: In Vermont, how many points are assessed for 'Operating after suspension'
    of a driver's license?
  choices:
    A: 5 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: C
  explanation: Operating a vehicle while your license is already suspended is a major
    violation and carries a 10-point penalty.
- id: 145
  category: penalties_and_points
  question: Under Vermont's 'Move Over' law, what is the maximum fine for failing
    to slow down or change lanes when approaching a stationary emergency vehicle with
    flashing lights?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Vermont's 'Move Over' law (23 V.S.A. § 1033) carries a fine of up to
    $250 for failing to move over or slow down for emergency vehicles.
- id: 146
  category: penalties_and_points
  question: How many points are assessed on a Vermont record for failing to yield
    to a pedestrian in a crosswalk?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: Failing to yield to a pedestrian in a marked or unmarked crosswalk
    results in 4 points on a Vermont driving record.
- id: 147
  category: penalties_and_points
  question: In Vermont, if you are convicted of passing another vehicle on a hill
    or a curve where visibility is obstructed, how many points are added to your record?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 10 points
  answer: B
  explanation: Improper passing on a hill or curve is a 4-point violation according
    to the Vermont DMV point schedule.
- id: 148
  category: penalties_and_points
  question: In Vermont, a conviction for speeding more than 30 miles per hour over
    the posted speed limit results in how many points?
  choices:
    A: 5 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: B
  explanation: Speeding more than 30 mph over the limit is a major violation in Vermont
    and carries a penalty of 8 points.
- id: 149
  category: penalties_and_points
  question: Under Vermont's 'Move Over' law, how many points are assessed for failing
    to yield to a stationary emergency vehicle with sirens or flashing lights?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 8 points
  answer: A
  explanation: Failing to move over or slow down for a stationary emergency vehicle
    results in 2 points on your Vermont driving record.
- id: 150
  category: penalties_and_points
  question: For a first DUI conviction in Vermont, for how long will an operator's
    license be suspended?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: A first DUI conviction in Vermont results in a mandatory license suspension
    of 90 days.
- id: 151
  category: penalties_and_points
  question: Which of the following is true regarding Vermont's seatbelt law for adult
    drivers (age 18 and older)?
  choices:
    A: It is a primary enforcement law; you can be pulled over solely for not wearing
      a belt.
    B: It is a secondary enforcement law; you can only be cited if stopped for another
      violation.
    C: Seatbelts are optional for drivers over the age of 21.
    D: Seatbelts are only required on interstate highways.
  answer: B
  explanation: In Vermont, the seatbelt law is secondary for adults (18+), meaning
    an officer can only issue a ticket if the vehicle was stopped for another suspected
    violation.
- id: 152
  category: penalties_and_points
  question: In Vermont, the fine for using a handheld portable electronic device while
    driving is ________ if the violation occurs in a work zone.
  choices:
    A: Waived for a first offense
    B: Reduced by half
    C: Doubled
    D: Tripled
  answer: C
  explanation: Fines for using a handheld device while driving are doubled if the
    offense occurs in a marked work zone or school zone.
- id: 153
  category: penalties_and_points
  question: In Vermont, a conviction for 'Attempting to Elude a Police Officer' results
    in how many points?
  choices:
    A: 5 points
    B: 8 points
    C: 10 points
    D: 15 points
  answer: C
  explanation: Attempting to elude a police officer is a major violation that carries
    10 points, which is the threshold for immediate suspension.
- id: 154
  category: penalties_and_points
  question: How long do points remain on a Vermont driving record from the date of
    the conviction?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: Points stay on a Vermont driving record for a period of two years from
    the date of conviction.
- id: 155
  category: penalties_and_points
  question: What is the maximum fine for a first offense of littering from a motor
    vehicle on a Vermont highway?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Under Vermont law, littering is illegal and can result in a fine of
    up to $500 and/or community service.
- id: 156
  category: penalties_and_points
  question: Vermont's 'Open Container' law states that it is illegal to possess an
    open container of alcohol in the passenger area of a motor vehicle. Who is primarily
    responsible for this violation?
  choices:
    A: Only the passengers
    B: The driver of the vehicle
    C: The owner of the vehicle, even if not present
    D: Only the person holding the container
  answer: B
  explanation: In Vermont, the driver is responsible for ensuring there are no open
    containers of alcohol in the passenger area of the vehicle while on a public highway.
- id: 157
  category: sharing_the_road
  question: In Vermont, when a school bus is stopped with its red lights flashing
    and stop arm extended, which of the following is true?
  choices:
    A: You only need to stop if you are traveling in the same direction as the bus.
    B: You must stop from either direction, unless the road is divided by a median
      or physical barrier.
    C: You may pass the bus at a speed of no more than 10 mph.
    D: You only need to stop if there are children currently crossing the street.
  answer: B
  explanation: According to the Vermont Driver's Manual and 23 V.S.A. § 1075, drivers
    must stop for a school bus with flashing red lights regardless of the direction
    they are traveling, unless the highway is divided by a median or other physical
    barrier.
- id: 158
  category: sharing_the_road
  question: 'Under Vermont law, when passing a ''vulnerable user'' (such as a bicyclist
    or pedestrian) on a road with a double yellow line, a motorist may:'
  choices:
    A: Never cross the double yellow line to pass.
    B: Cross the double yellow line only if the bicyclist signals them to do so.
    C: Cross the double yellow line to pass if it can be done safely and there is
      no oncoming traffic.
    D: Only pass if there is a designated passing zone.
  answer: C
  explanation: Vermont law (23 V.S.A. § 1033) allows motorists to cross a double yellow
    line in a no-passing zone to pass a vulnerable user, provided it can be done safely
    and with a clear view of oncoming traffic.
- id: 159
  category: sharing_the_road
  question: In Vermont, if a pedestrian is in an unmarked crosswalk at an intersection,
    what must a driver do?
  choices:
    A: The driver has the right of way because the crosswalk is not marked.
    B: The driver must yield the right of way to the pedestrian.
    C: The driver should honk to warn the pedestrian to wait.
    D: The driver only yields if the speed limit is under 35 mph.
  answer: B
  explanation: Vermont law requires drivers to yield the right of way to pedestrians
    in both marked and unmarked crosswalks at intersections.
- id: 160
  category: sharing_the_road
  question: What is the Vermont law regarding 'lane splitting' (motorcycles driving
    between rows of stopped or moving cars)?
  choices:
    A: It is legal if the cars are moving slower than 20 mph.
    B: It is legal only on multi-lane highways.
    C: It is illegal in Vermont.
    D: It is legal for motorcycles but not for mopeds.
  answer: C
  explanation: In Vermont, motorcycles are entitled to the full use of a lane, and
    lane splitting (operating between lanes of traffic) is prohibited.
- id: 161
  category: sharing_the_road
  question: 'When following a large truck in Vermont, if you cannot see the truck
    driver''s face in their side-view mirrors, you are:'
  choices:
    A: In the truck's blind spot (No-Zone).
    B: At a safe following distance.
    C: In the truck's 'Clear Zone'.
    D: Ready to pass the truck.
  answer: A
  explanation: If you cannot see the truck driver's face in their side-view mirror,
    the driver cannot see you. You are in one of the truck's 'No-Zones' or blind spots.
- id: 162
  category: sharing_the_road
  question: 'When an emergency vehicle with a siren and flashing lights is approaching
    from behind, Vermont law requires you to:'
  choices:
    A: Stop exactly where you are.
    B: Speed up to get out of the way.
    C: Pull to the right edge of the road and stop.
    D: Pull to the left edge of the road and stop.
  answer: C
  explanation: Vermont law requires drivers to pull as far to the right as possible
    and stop until the emergency vehicle has passed.
- id: 163
  category: sharing_the_road
  question: Which of the following is true regarding bicyclists' rights on Vermont
    roads?
  choices:
    A: Bicyclists must always ride on the sidewalk.
    B: Bicyclists have the same rights and responsibilities as motor vehicle operators.
    C: Bicyclists must always ride against the flow of traffic.
    D: Bicyclists are not allowed on state highways.
  answer: B
  explanation: In Vermont, bicyclists are considered vehicles when on the road and
    have the same rights and responsibilities as motorists, including obeying traffic
    signals and signs.
- id: 164
  category: sharing_the_road
  question: 'Under Vermont law, you do NOT have to stop for a school bus with flashing
    red lights if:'
  choices:
    A: You are on the opposite side of a divided highway separated by a median.
    B: The bus is in a 50 mph speed zone.
    C: The bus is stopped in a parking lot.
    D: There are more than four lanes of traffic.
  answer: A
  explanation: Drivers are not required to stop for a school bus with flashing red
    lights if they are traveling in the opposite direction on a divided highway where
    the lanes are separated by a median or physical barrier.
- id: 165
  category: sharing_the_road
  question: In Vermont, the definition of a 'vulnerable user' includes which of the
    following?
  choices:
    A: Pedestrians and bicyclists only.
    B: Motorcyclists and truck drivers.
    C: Pedestrians, bicyclists, persons on horses, and highway workers.
    D: Only children and the elderly.
  answer: C
  explanation: Vermont law (23 V.S.A. § 4) defines 'vulnerable users' broadly to include
    pedestrians, bicyclists, people riding horses, highway workers, and people operating
    farm tractors or wheelchairs.
- id: 166
  category: sharing_the_road
  question: What is the Vermont requirement for motorcycle helmets?
  choices:
    A: Only riders under 18 must wear a helmet.
    B: Helmets are optional if the rider has 2 years of experience.
    C: All operators and passengers must wear a DOT-approved helmet.
    D: Helmets are only required on interstate highways.
  answer: C
  explanation: Vermont law (23 V.S.A. § 1256) requires all motorcycle operators and
    passengers to wear a helmet that meets federal safety standards.
- id: 167
  category: sharing_the_road
  question: When riding a bicycle at night in Vermont, what equipment is legally required?
  choices:
    A: A white front light and a red rear light or reflector.
    B: A yellow front light and a white rear light.
    C: No lights are required if the rider wears reflective clothing.
    D: A bell and a white rear reflector.
  answer: A
  explanation: Vermont law requires bicycles used at night to be equipped with a lamp
    on the front that emits a white light and a red reflector or lamp on the rear.
- id: 168
  category: sharing_the_road
  question: In Vermont, how far must you remain behind a fire apparatus that is traveling
    in response to a fire alarm?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: According to 23 V.S.A. § 1102, it is illegal to follow any fire apparatus
    traveling in response to a fire alarm closer than 500 feet.
- id: 169
  category: sharing_the_road
  question: 'When you see a pedestrian carrying a white cane or using a guide dog
    at an intersection, you must:'
  choices:
    A: Honk to let them know you are there.
    B: Yield the right of way and stop, even if you have a green light.
    C: Drive around them if there is room.
    D: Wait for them to signal you to pass.
  answer: B
  explanation: Vermont law requires drivers to take extra precautions and yield the
    right of way to blind or visually impaired pedestrians using a white cane or guide
    dog.
- id: 170
  category: sharing_the_road
  question: 'When passing a person riding a horse or a horse-drawn vehicle in Vermont,
    a driver should:'
  choices:
    A: Honk the horn to warn the horse of their presence.
    B: Speed up to pass as quickly as possible.
    C: Reduce speed and proceed with caution to avoid frightening the animal.
    D: Turn on high beams to see the horse better.
  answer: C
  explanation: Vermont law (23 V.S.A. § 1127) requires motorists to reduce speed and
    use caution when approaching or passing animals to prevent them from becoming
    frightened.
- id: 171
  category: sharing_the_road
  question: According to Vermont law, when passing a 'vulnerable user' such as a cyclist
    or pedestrian on the highway, what is the minimum distance you must maintain between
    your vehicle and the individual?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: Vermont Title 23, Section 1033 requires operators to pass vulnerable
    users (cyclists, pedestrians, etc.) at a safe distance, which is defined as at
    least four feet.
- id: 172
  category: sharing_the_road
  question: When following a motorcycle in Vermont, why should you maintain a greater
    following distance than you would for a car?
  choices:
    A: Motorcycles are required to stop at all intersections.
    B: Motorcycles can stop much faster than other vehicles.
    C: Motorcycles are legally allowed to drift backward.
    D: Motorcycles have a higher top speed.
  answer: B
  explanation: Because motorcycles are light and have high-performance braking systems,
    they can stop much more quickly than cars; a 3 to 4-second following distance
    is recommended.
- id: 173
  category: sharing_the_road
  question: In Vermont, if you are turning left at an intersection and a bicyclist
    is approaching from the opposite direction, who has the right-of-way?
  choices:
    A: The motor vehicle, because it is larger.
    B: The bicyclist, because they are traveling straight through.
    C: Whoever reaches the intersection first.
    D: The motor vehicle, because bicycles must yield to all turns.
  answer: B
  explanation: Bicyclists have the same rights and responsibilities as motor vehicle
    operators. A driver turning left must yield to oncoming traffic, including bicycles,
    that are going straight.
- id: 174
  category: sharing_the_road
  question: 'When a large truck is turning right onto a narrow Vermont street, it
    may need to:'
  choices:
    A: Stay close to the right curb throughout the turn.
    B: Swing wide to the left before or during the turn.
    C: Stop and back up to make the turn.
    D: Turn from the left-most lane.
  answer: B
  explanation: Large trucks have a wide turning radius and often need to swing wide
    to the left to clear the curb on a right turn. Drivers should never try to squeeze
    between the truck and the curb.
- id: 175
  category: sharing_the_road
  question: What does a 'No-Zone' refer to regarding large trucks in Vermont?
  choices:
    A: A restricted area where trucks cannot drive.
    B: The speed-governed limit of the truck.
    C: The blind spots around the front, back, and sides of the truck.
    D: The weight limit for Vermont bridges.
  answer: C
  explanation: The 'No-Zone' refers to the large blind spots around a truck where
    the truck driver cannot see other vehicles. If you cannot see the truck driver's
    face in their side mirror, they cannot see you.
- id: 176
  category: sharing_the_road
  question: 'In Vermont, you are required to yield the right-of-way to any blind pedestrian
    carrying a white cane or accompanied by a guide dog:'
  choices:
    A: Only if they are in a marked crosswalk.
    B: Only if the pedestrian signals you to stop.
    C: At all times, regardless of whether they are in a crosswalk.
    D: Only during daylight hours.
  answer: C
  explanation: Vermont law requires drivers to take all necessary precautions to avoid
    injury to blind pedestrians. You must yield the right-of-way even if they are
    not in a formal crosswalk.
- id: 177
  category: sharing_the_road
  question: Is 'lane splitting' (a motorcycle driving between two lanes of stopped
    or moving traffic) legal in Vermont?
  choices:
    A: Yes, it is legal at speeds under 30 mph.
    B: Yes, but only on interstate highways.
    C: No, it is illegal in Vermont.
    D: Yes, if the motorcycle is air-cooled.
  answer: C
  explanation: In Vermont, motorcycles are entitled to the full use of a lane, and
    lane splitting (operating between lanes of traffic) is prohibited.
- id: 178
  category: sharing_the_road
  question: When a school bus is stopped on a Vermont roadway with its yellow (amber)
    lights flashing, what does it indicate?
  choices:
    A: The bus is about to stop and will soon activate red flashing lights.
    B: The bus is loading students and you may pass with caution.
    C: The bus is experiencing mechanical failure.
    D: The bus is traveling at a speed 10 mph below the limit.
  answer: A
  explanation: Amber flashing lights on a school bus are a warning to drivers that
    the bus is preparing to stop to load or unload children. Drivers should prepare
    to stop.
- id: 179
  category: sharing_the_road
  question: 'Under Vermont law, bicyclists are required to ride:'
  choices:
    A: On the sidewalk whenever possible.
    B: Against the flow of traffic so they can see cars.
    C: With the flow of traffic, as far to the right as is safe and practical.
    D: In the exact center of the lane at all times.
  answer: C
  explanation: Bicyclists must ride with the flow of traffic and generally stay to
    the right, though they may move left to avoid hazards, turn left, or pass other
    vehicles.
- id: 180
  category: sharing_the_road
  question: 'When passing a large truck, you should not pull back into the lane in
    front of the truck until:'
  choices:
    A: You can see the truck's headlights in your rearview mirror.
    B: You are at least 10 feet ahead of the truck.
    C: The truck driver flashes their high beams at you.
    D: You have reached the speed limit.
  answer: A
  explanation: Because trucks have long braking distances, you should ensure you have
    plenty of space before cutting back in. Seeing the truck's headlights in your
    rearview mirror ensures a safe distance.
- id: 181
  category: vehicle_information
  question: According to Vermont law, how often must a registered motor vehicle undergo
    a safety inspection at an official inspection station?
  choices:
    A: Every six months
    B: Once every year
    C: Every two years
    D: Only when the vehicle is sold
  answer: B
  explanation: In Vermont, all motor vehicles registered in the state must be inspected
    once each year at an official inspection station to ensure they meet safety standards.
- id: 182
  category: vehicle_information
  question: In Vermont, what is the minimum legal tread depth for tires on a passenger
    vehicle?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Vermont safety inspection standards require that tires have at least
    2/32 of an inch of tread depth in the major grooves.
- id: 183
  category: vehicle_information
  question: Regarding window tinting, what is the Vermont law for the windshield and
    the front side windows (driver and passenger)?
  choices:
    A: Any tint is allowed as long as it is less than 50%
    B: Aftermarket tinting is prohibited on the windshield and front side windows
    C: Tinting is allowed only on the top 4 inches of the front side windows
    D: Only 35% tint is allowed on the front side windows
  answer: B
  explanation: Vermont law prohibits the application of aftermarket tinting to the
    windshield or the windows to the left and right of the driver, unless a medical
    waiver is obtained.
- id: 184
  category: vehicle_information
  question: Vermont's 'Ice and Snow' law requires drivers to do what before operating
    their vehicle on a public highway?
  choices:
    A: Warm the engine for at least 10 minutes
    B: Apply anti-freeze to the door locks
    C: Clear all snow and ice from the entire vehicle so it does not pose a hazard
    D: Only clear the driver's side of the windshield
  answer: C
  explanation: Vermont law (Title 23, Section 1129) requires drivers to remove accumulated
    ice and snow from the vehicle so it does not blow off and endanger other motorists
    or pedestrians.
- id: 185
  category: vehicle_information
  question: To pass a Vermont safety inspection, a vehicle must be equipped with at
    least how many rearview mirrors?
  choices:
    A: One interior mirror only
    B: One exterior mirror on the driver's side only
    C: At least two mirrors, one of which must be on the exterior left side
    D: 'Three mirrors: one interior and two exterior'
  answer: C
  explanation: Vermont requires at least two mirrors. One must be an interior mirror
    (unless obstructed) and one must be an exterior mirror on the driver's side.
- id: 186
  category: vehicle_information
  question: 'In Vermont, a motor vehicle must be equipped with two separate braking
    systems. These are the service (foot) brake and the:'
  choices:
    A: Emergency engine brake
    B: Parking/Emergency brake
    C: Hydraulic backup system
    D: Anti-lock braking system (ABS)
  answer: B
  explanation: Vermont law requires all motor vehicles to have a service brake and
    a parking/emergency brake, both of which must be in good working order.
- id: 187
  category: vehicle_information
  question: Under Vermont's idling law, what is the maximum amount of time a person
    may cause a motor vehicle to idle while parked?
  choices:
    A: 3 minutes in any 60-minute period
    B: 5 minutes in any 60-minute period
    C: 10 minutes in any 60-minute period
    D: There is no limit if the temperature is below freezing
  answer: B
  explanation: Vermont law generally prohibits idling a vehicle for more than 5 minutes
    in any 60-minute period, with certain exceptions for extreme temperatures or emergency
    vehicles.
- id: 188
  category: vehicle_information
  question: According to Vermont's child restraint law, a child must be secured in
    a rear-facing child safety seat until they reach what age?
  choices:
    A: 1 year old
    B: 2 years old
    C: 4 years old
    D: 6 years old
  answer: B
  explanation: Vermont law requires children to be properly secured in a rear-facing
    child restraint system until they are at least 2 years of age.
- id: 189
  category: vehicle_information
  question: In Vermont, children who have outgrown their forward-facing car seat must
    use a booster seat until they reach what age?
  choices:
    A: 5 years old
    B: 8 years old
    C: 10 years old
    D: 12 years old
  answer: B
  explanation: Vermont law requires children to use a child restraint system (like
    a booster seat) until they are 8 years old.
- id: 190
  category: vehicle_information
  question: Which vehicles in Vermont are required to undergo an On-Board Diagnostic
    (OBD) emissions test as part of their annual inspection?
  choices:
    A: All vehicles regardless of age
    B: Only diesel vehicles
    C: Most 1996 and newer models with a gross vehicle weight rating of 8,500 lbs
      or less
    D: Only vehicles registered in Burlington or Montpelier
  answer: C
  explanation: Vermont requires an OBD emissions test for most 1996 and newer passenger
    vehicles and light-duty trucks (8,500 lbs GVWR or less) during the annual safety
    inspection.
- id: 191
  category: vehicle_information
  question: In Vermont, if your vehicle's turn signals are not working, you must use
    hand signals. What is the correct hand signal for a slow or stop?
  choices:
    A: Left arm extended straight out
    B: Left arm bent upward at a 90-degree angle
    C: Left arm bent downward at a 90-degree angle
    D: Right arm extended straight out
  answer: C
  explanation: The standard hand signal for slowing or stopping is the left arm extended
    out the window and bent downward at a 90-degree angle.
- id: 192
  category: vehicle_information
  question: In Vermont, how often must a registered motor vehicle undergo a safety
    and emissions inspection?
  choices:
    A: Every six months
    B: Once every year
    C: Every two years
    D: Only when the vehicle is sold
  answer: B
  explanation: According to Vermont law, all motor vehicles registered in the state
    must be inspected once each year at an official inspection station.
- id: 193
  category: vehicle_information
  question: Under Vermont law, when are drivers required to turn on their headlights
    in relation to windshield wiper use?
  choices:
    A: Only during heavy thunderstorms
    B: Only if the wipers are on high speed
    C: Whenever the windshield wipers are in use
    D: Headlights are not required to be linked to wiper use
  answer: C
  explanation: Vermont law requires that headlights be turned on whenever the vehicle's
    windshield wipers are in use due to precipitation or poor visibility.
- id: 194
  category: vehicle_information
  question: Between which dates are studded snow tires legally permitted on Vermont
    roads?
  choices:
    A: November 1 to April 1
    B: October 1 to May 31
    C: October 15 to May 1
    D: November 15 to April 15
  answer: C
  explanation: In Vermont, studded snow tires are permitted for use on vehicles between
    October 15 and May 1.
- id: 195
  category: vehicle_information
  question: To pass a Vermont safety inspection, the foot brake must be able to stop
    the vehicle within how many feet when traveling at 20 mph?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: The Vermont Periodic Inspection Manual states that the service (foot)
    brake must be able to stop the vehicle within 30 feet at a speed of 20 mph.
- id: 196
  category: vehicle_information
  question: 'In Vermont, a motor vehicle must be equipped with a mirror that allows
    the driver to see the highway to the rear for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Vermont equipment regulations require a mirror that reflects a view
    of the highway for a distance of at least 200 feet to the rear.
- id: 197
  category: vehicle_information
  question: 'Vermont law requires every motor vehicle to be equipped with a muffler
    that prevents:'
  choices:
    A: All carbon dioxide emissions
    B: Excessive or unusual noise
    C: The engine from overheating
    D: Visible steam from the tailpipe
  answer: B
  explanation: Vermont law (23 V.S.A. § 1221) requires vehicles to have a muffler
    in good working order to prevent excessive or unusual noise and annoying smoke.
- id: 198
  category: vehicle_information
  question: 'A motor vehicle''s horn in Vermont must be capable of emitting sound
    audible under normal conditions from a distance of at least:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: Vermont safety standards require that a vehicle's horn be audible from
    a distance of 200 feet.
- id: 199
  category: vehicle_information
  question: Mechanical turn signals on a vehicle in Vermont must be visible from a
    distance of at least how many feet to the front and rear?
  choices:
    A: 50 feet
    B: 100 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Turn signals must be visible from a distance of 100 feet to both the
    front and the rear of the vehicle.
- id: 200
  category: vehicle_information
  question: 'The rear license plate on a vehicle in Vermont must be illuminated so
    that it is legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Vermont law requires a white light to illuminate the rear license plate
    so that it is clearly legible from a distance of 50 feet to the rear.
- id: 201
  category: signs_and_signals
  question: What does a flashing red traffic light mean under Vermont law?
  choices:
    A: Slow down and proceed with caution
    B: Stop, then proceed when the way is safe
    C: The signal is broken; ignore it
    D: Yield to oncoming traffic but do not stop
  answer: B
  explanation: A flashing red light in Vermont has the same meaning as a stop sign.
    You must come to a complete stop and proceed only when it is safe to do so.
- id: 202
  category: signs_and_signals
  question: 'A pennant-shaped sign (isoceles triangle pointing right) found on the
    left side of the road in Vermont indicates:'
  choices:
    A: A school zone
    B: A yield requirement
    C: A no passing zone
    D: A railroad crossing
  answer: C
  explanation: The pennant-shaped sign is placed on the left side of the road at the
    beginning of a no-passing zone.
- id: 203
  category: signs_and_signals
  question: In Vermont, what do double solid yellow lines in the center of the roadway
    signify?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on the right
    C: Passing is prohibited in both directions
    D: One-way traffic only
  answer: C
  explanation: Double solid yellow lines indicate that passing is not allowed for
    vehicles traveling in either direction.
- id: 204
  category: signs_and_signals
  question: When approaching a roundabout in Vermont, what does a 'Yield' sign and
    dashed white lines on the pavement require you to do?
  choices:
    A: Stop completely before entering the circle
    B: Yield the right-of-way to traffic already in the circle
    C: Speed up to merge with traffic
    D: Yield only to traffic entering from the right
  answer: B
  explanation: Vermont law requires drivers entering a roundabout to yield the right-of-way
    to traffic already circulating within the intersection.
- id: 205
  category: signs_and_signals
  question: What is the meaning of a steady yellow traffic light in Vermont?
  choices:
    A: Speed up to clear the intersection
    B: The light is about to change to red; prepare to stop
    C: Stop immediately, even if in the intersection
    D: You have the right of way to turn left
  answer: B
  explanation: A steady yellow light means the signal is changing to red. Drivers
    should stop if they can do so safely; otherwise, they should clear the intersection.
- id: 206
  category: signs_and_signals
  question: 'In Vermont, a white diamond symbol painted on the pavement indicates:'
  choices:
    A: A pedestrian crosswalk
    B: A high-occupancy vehicle (HOV) or restricted lane
    C: A railroad crossing ahead
    D: A parking zone for emergency vehicles
  answer: B
  explanation: The diamond symbol marks lanes reserved for specific vehicles, such
    as buses, bicycles, or carpools (HOV).
- id: 207
  category: signs_and_signals
  question: What does a flashing yellow traffic signal indicate to a Vermont driver?
  choices:
    A: Stop and wait for a green light
    B: The light is broken; treat it as a four-way stop
    C: Proceed with caution
    D: Yield to all pedestrians, then stop
  answer: C
  explanation: A flashing yellow light warns drivers to slow down and proceed with
    caution through the intersection.
- id: 208
  category: signs_and_signals
  question: In Vermont, if you see a 'Work Zone' sign with a orange background, what
    must you be prepared for?
  choices:
    A: Increased speed limits
    B: Fines for traffic violations are often doubled
    C: No turns allowed
    D: Mandatory use of high-beam headlights
  answer: B
  explanation: Vermont law often imposes higher penalties for traffic violations committed
    in designated work zones when workers are present.
- id: 209
  category: signs_and_signals
  question: What does a solid white line on the right edge of the highway signify
    in Vermont?
  choices:
    A: A lane for passing only
    B: The edge of the travel lane (fog line)
    C: A bicycle-only lane
    D: A zone where parking is permitted
  answer: B
  explanation: The solid white line on the right side of the road, often called a
    fog line, marks the edge of the travel lane and helps drivers stay on the road
    during poor visibility.
- id: 210
  category: signs_and_signals
  question: In Vermont, what hand signal should you use to indicate you are slowing
    down or stopping?
  choices:
    A: Left arm extended upward
    B: Left arm extended horizontally
    C: Left arm extended downward, palm facing back
    D: Right arm extended horizontally
  answer: C
  explanation: To signal a stop or decrease in speed using hand signals, the driver
    extends the left arm downward with the palm facing the rear.
- id: 211
  category: signs_and_signals
  question: 'A Vermont traffic sign that is shaped like a shield and is green and
    white typically identifies:'
  choices:
    A: An Interstate Highway
    B: A U.S. Route
    C: A Vermont State Route
    D: A County Road
  answer: C
  explanation: Vermont State Route markers are characterized by a green and white
    shield shape with the word 'Vermont' at the top.
- id: 212
  category: signs_and_signals
  question: What must you do when you see a steady red arrow signal in the direction
    you intend to turn?
  choices:
    A: Stop, then turn if no traffic is coming
    B: Treat it as a stop sign
    C: You may not turn in the direction of the arrow
    D: Yield to pedestrians and then proceed
  answer: C
  explanation: A steady red arrow means you cannot make a movement in the direction
    of the arrow until the signal changes to green.
- id: 213
  category: signs_and_signals
  question: In Vermont, what do 'sharrows' (a bicycle symbol with two chevrons above
    it) painted on the road mean?
  choices:
    A: The lane is for bicycles only; cars are prohibited
    B: Bicycles must stay on the shoulder
    C: The lane is shared; motorists should expect bicycles in the travel lane
    D: Bicycles are not allowed on this road
  answer: C
  explanation: Shared Lane Markings (sharrows) are used to alert motorists that bicyclists
    may occupy the travel lane and to help bicyclists position themselves safely.
- id: 214
  category: signs_and_signals
  question: What does a broken white line between two lanes of traffic mean in Vermont?
  choices:
    A: Traffic is moving in opposite directions
    B: Traffic is moving in the same direction, and lane changes are permitted
    C: No passing is allowed
    D: The lane is reserved for emergency vehicles
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction.
    Crossing the line to change lanes is permitted when safe.
- id: 215
  category: signs_and_signals
  question: In Vermont, what does a fluorescent yellow-green colored sign indicate?
  choices:
    A: Construction and maintenance zones
    B: Pedestrian, bicycle, or school crossings
    C: General warning of hazards ahead
    D: Directional guidance to state parks
  answer: B
  explanation: According to the Vermont Driver's Manual, fluorescent yellow-green
    signs are used specifically for pedestrian, bicycle, and school crossings to increase
    visibility.
- id: 216
  category: signs_and_signals
  question: When you encounter a flashing red light at an intersection in Vermont,
    what must you do?
  choices:
    A: Slow down and proceed with caution
    B: Stop only if there is cross traffic
    C: Come to a complete stop and yield the right-of-way as you would at a stop sign
    D: Yield to traffic on the right, then proceed without stopping
  answer: C
  explanation: A flashing red signal light means the same thing as a stop sign. You
    must come to a complete stop and proceed only when it is safe to do so.
- id: 217
  category: signs_and_signals
  question: In Vermont, what do double solid white lines painted on the pavement indicate?
  choices:
    A: You may cross them to turn into a driveway
    B: They separate traffic moving in opposite directions
    C: Crossing the lines is prohibited
    D: They mark the edge of the breakdown lane
  answer: C
  explanation: Double solid white lines indicate that lane changes are prohibited.
    You must stay within your lane.
- id: 218
  category: signs_and_signals
  question: When using hand signals in Vermont, how do you signal that you are slowing
    down or stopping?
  choices:
    A: Extend left arm out and point it upward
    B: Extend left arm straight out
    C: Extend left arm out and point it downward
    D: Wave your hand back and forth
  answer: C
  explanation: To signal a stop or decrease in speed using hand signals, the driver
    should extend their left arm out the window and point it downward.
- id: 219
  category: signs_and_signals
  question: 'In Vermont, a ''Shared Lane Marking'' (sharrow) consisting of a bicycle
    symbol with two chevrons above it means:'
  choices:
    A: Bicycles must stay on the shoulder
    B: Motorists must yield to bicycles in the adjacent bike lane
    C: Bicyclists may occupy the entire travel lane and motorists should expect them
    D: The road is closed to motor vehicles
  answer: C
  explanation: Sharrows are used to alert motorists that bicyclists may occupy the
    lane and to help bicyclists position themselves safely away from parked cars.
- id: 220
  category: signs_and_signals
  question: What is the Vermont point penalty for failing to stop for a school bus
    with its red lights flashing?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 8 points
  answer: C
  explanation: Failing to stop for a school bus with flashing red lights is a serious
    violation in Vermont and carries a 5-point penalty on your driving record.
- id: 221
  category: signs_and_signals
  question: 'A steady yellow X signal over a traffic lane in Vermont indicates:'
  choices:
    A: The lane is about to be closed to traffic in your direction
    B: The lane is reserved for high-occupancy vehicles
    C: You may use the lane to turn left
    D: The lane is for emergency vehicles only
  answer: A
  explanation: A steady yellow X means that the lane control signal is about to change
    to a red X, and you should prepare to move safely out of that lane.
- id: 222
  category: signs_and_signals
  question: In Vermont, what does a circular sign with a large 'X' and the letters
    'RR' indicate?
  choices:
    A: A road intersection ahead
    B: A railroad crossing ahead
    C: A restricted roadway
    D: A rural route marker
  answer: B
  explanation: The round yellow sign with a black 'X' and 'RR' is a railroad advance
    warning sign, indicating you are approaching a crossing.
- id: 223
  category: signs_and_signals
  question: What does a solid yellow line on your side of the center dash line mean
    in Vermont?
  choices:
    A: You are in a passing zone
    B: You may pass only during daylight hours
    C: You are in a no-passing zone
    D: The road ahead is under construction
  answer: C
  explanation: A solid yellow line on your side of the center line indicates that
    you are in a no-passing zone and cannot legally pass other vehicles.
- id: 224
  category: signs_and_signals
  question: In Vermont, what is the meaning of a 'crossbuck' sign at a railroad crossing?
  choices:
    A: It is the same as a Yield sign; you must yield to any approaching trains
    B: It means all vehicles must come to a full stop
    C: It indicates a pedestrian crossing
    D: It marks a historical site
  answer: A
  explanation: The crossbuck sign is a regulatory sign that means you must yield the
    right-of-way to any approaching trains.
- id: 225
  category: signs_and_signals
  question: If you are facing a steady green arrow signal in Vermont, what does it
    mean?
  choices:
    A: You must stop and wait for a solid green light
    B: You may turn in the direction of the arrow after yielding to pedestrians
    C: You have the right-of-way to turn, but you must still yield to pedestrians
      in the crosswalk
    D: The arrow is only for emergency vehicles
  answer: C
  explanation: A green arrow means you may proceed in the direction of the arrow,
    but Vermont law requires you to yield to pedestrians and other traffic already
    in the intersection.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 226
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 227
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 228
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 229
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 230
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 231
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 232
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 233
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 234
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 235
