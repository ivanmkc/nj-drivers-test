metadata:
  source: Vermont Driver's License Manual (dmv.vermont.gov)
  total_questions: 305
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_responsibility
  question: Is there a cost to the donor or their family for organ donation to take place?
  choices:
    A: Yes, a flat fee is charged to the family.
    B: Yes, the donor's insurance must cover the cost.
    C: No, there is no cost to the donor or their family.
    D: Yes, but only for tissue donation.
  answer: C
  explanation: The manual states as a fact that there is no cost to the donor or their family for donation to take place.
- id: 2
  category: driver_responsibility
  question: How does saying 'Yes' to organ donation affect your medical care?
  choices:
    A: You will receive lower priority care in an emergency.
    B: It will not affect your medical care.
    C: You will receive free medical care for life.
    D: Doctors will not try as hard to save your life.
  answer: B
  explanation: The manual explicitly states that saying 'Yes' to donation will not affect your medical care.
- id: 3
  category: driver_testing
  question: What is the name of the web tutorial provided by Vermont to help you study for your Learner's Permit test?
  choices:
    A: VermontDrive
    B: SafeDriveVT
    C: DriveVermont
    D: VTLearner
  answer: C
  explanation: The manual recommends studying for your Learner's Permit test and learning to drive safely using their web tutorial, DriveVermont.
- id: 4
  category: driver_testing
  question: Where is the Vermont learner permit test taken?
  choices:
    A: Only at the Montpelier Main Office.
    B: In-person at any local high school.
    C: In-person at any DMV office.
    D: It is an online test available on mydmv.vermont.gov.
  answer: D
  explanation: The manual states that the learner permit test is no longer taken in their office; it is an online test available on their website, mydmv.vermont.gov.
- id: 5
  category: driver_responsibility
  question: If you feel the Department of Motor Vehicles has not provided a reasonable accommodation for your disability, where can you file a complaint?
  choices:
    A: The Vermont Supreme Court
    B: The Vermont Human Rights Commission
    C: The Department of Transportation
    D: The Governor's Office
  answer: B
  explanation: If you feel the DMV has not provided a reasonable accommodation, you can file a complaint with the Vermont Human Rights Commission by calling 800.416.2010.
- id: 6
  category: safe_driving_rules
  question: According to the Commissioner's safety message, what is the leading cause of hospitalization and death from injuries?
  choices:
    A: Workplace accidents
    B: Vehicle collisions
    C: Heart disease
    D: Sports injuries
  answer: B
  explanation: The Commissioner's message notes that vehicle collisions are the leading cause of hospitalization and death from injuries.
- id: 7
  category: license_system
  question: 'According to the Vermont driver''s manual, having a driver''s license is considered:'
  choices:
    A: A constitutional right
    B: An unconditional guarantee
    C: A privilege
    D: A requirement for all adults
  answer: C
  explanation: The manual states that having a license is a privilege; one that is earned by demonstrating your driving skills in a manner that shows you are a proficient and safe driver.
- id: 8
  category: driver_responsibility
  question: 'When obtaining a Learner''s Permit or Driver''s License, you are committing to all of the following EXCEPT:'
  choices:
    A: Carrying liability insurance
    B: Maintaining a safe operating vehicle that meets emissions standards
    C: Driving a vehicle manufactured within the last 10 years
    D: Adopting habits that eliminate driving distractions
  answer: C
  explanation: The manual lists commitments such as maintaining a safe vehicle meeting emissions standards, carrying liability insurance, obeying rules of the road, and eliminating distractions. It does not require driving a vehicle manufactured in the last 10 years.
- id: 9
  category: license_system
  question: If a Vermont state holiday falls on a Saturday, when is it observed by the DMV?
  choices:
    A: The preceding Friday
    B: The following Monday
    C: The following Tuesday
    D: It is not observed
  answer: A
  explanation: The manual states that a holiday which falls on a Saturday shall be observed on the preceding Friday.
- id: 10
  category: license_system
  question: On what date is Bennington Battle Day observed in Vermont?
  choices:
    A: July 4th
    B: August 16th
    C: November 11th
    D: The 1st Tuesday in March
  answer: B
  explanation: According to the Vermont State Holidays list in the manual, Bennington Battle Day is observed on August 16th.
- id: 11
  category: license_system
  question: What is the policy for visiting a Vermont DMV office location?
  choices:
    A: Walk-ins are accepted at all times.
    B: Walk-ins are only accepted on Tuesdays and Thursdays.
    C: All office visits are by appointment only.
    D: Appointments are only required for road tests.
  answer: C
  explanation: The manual explicitly states under the Office Locations section that 'All office visits are by appointment only.'
- id: 12
  category: alcohol_drugs_health
  question: If a minor is caught and ticketed for misrepresenting their age, procuring, possessing, or consuming liquors, what program must they contact?
  choices:
    A: The Highway Safety Diversion Program
    B: The Vermont State Police Youth Program
    C: Mothers Against Drunk Driving (MADD)
    D: The Teen Alcohol Safety Program (TASP)
  answer: D
  explanation: Minors ticketed for these offenses are required to contact the Teen Alcohol Safety Program (TASP) of Vermont Court Diversion.
- id: 13
  category: penalties_and_points
  question: How many days does a minor have to contact the diversion board after being ticketed for an alcohol violation before the case is referred to the judicial bureau?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: The manual states that failure to contact the diversion board within 15 days will result in the case being referred to the judicial bureau.
- id: 14
  category: penalties_and_points
  question: If a minor fails to contact the diversion board for an alcohol violation and is found liable by the judicial bureau, what is the penalty?
  choices:
    A: A $100 fine and a 30-day license suspension
    B: A $300 penalty and a 90-day suspension of their Driver's License
    C: A $500 penalty and a 6-month license suspension
    D: A $1,000 penalty and a 1-year license suspension
  answer: B
  explanation: If found liable by the judicial bureau, the person will be subject to a penalty of $300.00 and a 90-day suspension of their Driver's License.
- id: 15
  category: penalties_and_points
  question: What happens if a minor fails to complete the Teen Alcohol Safety Program (TASP) or other Diversion requirements?
  choices:
    A: They must pay an additional $50 fine.
    B: They must retake the written driving test.
    C: Their license or privilege to drive will be suspended.
    D: They will be assigned 100 hours of community service.
  answer: C
  explanation: The manual warns that if you fail to complete TASP or other Diversion requirements, your license or privilege to drive will be SUSPENDED.
- id: 16
  category: penalties_and_points
  question: What is the consequence of failing to complete TASP or other Diversion requirements?
  choices:
    A: You will be required to retake the driving test.
    B: Your license or privilege to drive will be suspended.
    C: You will receive a warning letter from the DMV.
    D: Your vehicle registration will be permanently revoked.
  answer: B
  explanation: According to the manual, if you fail to complete TASP or other Diversion requirements, your license or privilege to drive will be SUSPENDED.
- id: 17
  category: penalties_and_points
  question: What is the maximum penalty for obtaining a Learner's Permit or Driver's License by false representation?
  choices:
    A: A $500 fine and a 30-day suspension.
    B: A $1,000 fine, up to two years in prison, or both, plus a 90-day suspension.
    C: A $2,000 fine and permanent revocation of driving privileges.
    D: A $300 fine and a requirement to attend alcohol abuse evaluation.
  answer: B
  explanation: The manual states that obtaining a license or permit by false representation can result in being fined not more than $1,000 or imprisoned not more than two years, or both, and having the privilege to operate suspended for 90 days.
- id: 18
  category: license_system
  question: What is the purpose of the national Problem Driver Pointer System (PDPS) inquiry when you apply for a license?
  choices:
    A: To check if you have unpaid parking tickets in your home town.
    B: To verify your credit score and insurance history.
    C: To determine if your license is suspended, revoked, denied, or canceled in another state.
    D: To confirm you have completed an approved driver education course.
  answer: C
  explanation: An inquiry is made to the PDPS to see if you are suspended, revoked, denied, or canceled in another state. If so, you will be denied a Vermont license until cleared.
- id: 19
  category: license_system
  question: Which of the following is a rule regarding the documents you must submit for proof of identity?
  choices:
    A: Faxed copies are acceptable if they are notarized.
    B: Photocopies are accepted for Social Security cards only.
    C: Documents must be original, or copies certified by the issuing agency.
    D: You only need to provide documents from two of the four required categories.
  answer: C
  explanation: 'The manual explicitly notes: "Documents must be original, or copies certified by the issuing agency. Faxed or photocopied documents will NOT be accepted."'
- id: 20
  category: license_system
  question: In addition to proof of Identity, SSN, and Vermont Residency, what specific documentation does an Enhanced Driver’s License (EDL) require?
  choices:
    A: Proof of US Citizenship
    B: A valid passport from any country
    C: A letter from your current employer
    D: Proof of a clean driving record for 5 years
  answer: A
  explanation: 'The manual states: "An EDL requires proof of US Citizenship in addition to proof of Identity, SSN and Vermont Residency."'
- id: 21
  category: license_system
  question: If your Social Security card is not available, which of the following documents may be used in its place?
  choices:
    A: A certified birth certificate
    B: A W-2 form
    C: A utility bill
    D: A credit card statement
  answer: B
  explanation: If your Social Security card is not available, acceptable alternative forms include a W-2 form, SSA-1099 form, or a pay stub showing your name and SSN.
- id: 22
  category: license_system
  question: If you need to correct or update your name on your Driver's License, what must you do before visiting the DMV?
  choices:
    A: Publish your name change in a local newspaper.
    B: Obtain a new passport with your updated name.
    C: Update your information at the Social Security Administration.
    D: Notify your auto insurance company of the change.
  answer: C
  explanation: 'Your name must verify with the Social Security Administration. The manual states: "If you need to correct or update information at the Social Security Administration, do so before you visit DMV."'
- id: 23
  category: license_system
  question: The Vermont DMV will NOT issue a Driver's License or ID to a foreign national if they have less than how many days of Lawful Presence remaining?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: 'The manual specifies: "The Vermont DMV will not issue a Driver''s License or ID if you have less than 30 days of Lawful Presence remaining."'
- id: 24
  category: license_system
  question: When providing proof of Vermont residency, which of the following is true about your residential address?
  choices:
    A: It can be a post office box if you live in a rural area.
    B: It must be a street or highway address.
    C: It is not required if you have a valid US passport.
    D: It can be an out-of-state address if you are a college student.
  answer: B
  explanation: 'The manual states: "The residential address you supply must be a street or highway address. It may not be a post office box."'
- id: 25
  category: license_system
  question: If you receive mail at your street address, how many pieces of mail with your current name and street address are required to prove Vermont residency?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: If mail is received at the street address, you must provide "Two pieces of mail with current name and street address."
- id: 26
  category: license_system
  question: If you do not receive mail at your street address, which of the following can be used as one of the two required documents to show your street address?
  choices:
    A: A handwritten letter from a neighbor
    B: A local library card
    C: A utility bill listing the service address
    D: A magazine subscription label
  answer: C
  explanation: If mail is not received at the street address, acceptable documents include a "Utility bill (must list service address)."
- id: 27
  category: license_system
  question: How can active duty U.S. Military personnel residing out-of-state prove Vermont residency?
  choices:
    A: By providing a military ID and proof Vermont is their residence in military records, such as a Leave and Earnings Statement.
    B: By showing a valid out-of-state driver's license and a military ID.
    C: By passing a Vermont written knowledge test and submitting a utility bill.
    D: By providing a letter from their commanding officer stating they are stationed nearby.
  answer: A
  explanation: For active duty military residing out-of-state, they must provide a "military ID and proof Vermont is their residence in military records, such as Leave and Earnings Statement or orders."
- id: 28
  category: license_system
  question: What documentation must a minor provide to prove Vermont residency?
  choices:
    A: Two pieces of mail addressed directly to the minor.
    B: A high school transcript and a student ID.
    C: A Vermont Residency Certification, one parent residency document, and evidence of relationship.
    D: A W-2 form and a Social Security card.
  answer: C
  explanation: Minors must provide a "Vermont Residency Certification and one (1) parent residency document" as well as "Parent/Guardian evidence of relationship to applicant."
- id: 29
  category: license_system
  question: Under what condition may a non-Vermont resident obtain a Vermont Learner’s Permit?
  choices:
    A: To drive to and from work in Vermont.
    B: To participate in a driver education and training course.
    C: To operate a commercial vehicle across state lines.
    D: To visit family members who reside in the state.
  answer: B
  explanation: 'The manual states: "If the applicant is not a Vermont resident, he/she may only obtain a Vermont Learner’s Permit for the purpose of participating in a driver education and training course."'
- id: 30
  category: license_system
  question: What specific documentation must a non-resident applicant provide to obtain a Vermont Learner's Permit?
  choices:
    A: A letter from a school Guidance Counselor stating the student is to be enrolled in a driver education course.
    B: A utility bill from their home state.
    C: A valid driver's license from their home state.
    D: Proof of vehicle insurance in Vermont.
  answer: A
  explanation: A non-resident applying for a permit to take driver education must provide "A letter from a school Guidance Counselor stating the student/applicant is to be enrolled in a driver education course..."
- id: 31
  category: license_system
  question: How many days does a new Vermont resident have to obtain a Vermont driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: According to the manual, a person who has moved into the state from another jurisdiction with a valid license must obtain a Vermont license within 60 days of moving into the state.
- id: 32
  category: license_system
  question: How many days does a person holding a commercial driver's license (CDL) from another state have to transfer it after establishing residency in Vermont?
  choices:
    A: 14 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: The manual states that any person holding a commercial driver's license from another state must transfer their CDL within 30 days of establishing residency in Vermont.
- id: 33
  category: driver_testing
  question: What is the minimum age required to take the test for a Vermont Learner's Permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 17 years old
  answer: B
  explanation: The manual explicitly states, "You must be at least 15 years old to take the test" for a Learner's Permit.
- id: 34
  category: safe_driving_rules
  question: Who is permitted to ride in the front seat and supervise a driver with a valid Learner's Permit?
  choices:
    A: Any licensed driver 18 or older
    B: A licensed and unimpaired individual 25 years of age or older
    C: Any licensed driver with at least 1 year of driving experience
    D: A licensed sibling who is at least 21 years old
  answer: B
  explanation: A driver with a Learner's Permit may drive if accompanied in the front seat by a licensed and unimpaired parent/guardian, a licensed/certified unimpaired driver education instructor, or a licensed and unimpaired individual 25 years of age or older.
- id: 35
  category: license_system
  question: Under what condition can a non-resident obtain a Vermont Learner's Permit?
  choices:
    A: If they own property in Vermont
    B: If they are participating in a Vermont driver education and training course
    C: If they have a valid out-of-state driver's license
    D: Non-residents cannot obtain a Vermont Learner's Permit under any circumstances
  answer: B
  explanation: If the applicant is not a Vermont resident, they may only obtain a Vermont Learner's Permit for the purpose of participating in a driver education and training course.
- id: 36
  category: license_system
  question: Which of the following is true regarding the Vermont Driver Privilege Card (DPC)?
  choices:
    A: It is a Real ID compliant document
    B: It requires proof of US citizenship
    C: It does not require proof of legal presence or US citizenship
    D: It is available to non-residents of Vermont
  answer: C
  explanation: The manual states that the Driver Privilege Card is NOT Real ID compliant and issuance of the DPC does not require proof of legal presence or US citizenship.
- id: 37
  category: license_system
  question: For a Vermont Driver's License, which of the following is a self-designated descriptor that does NOT require confirming documentation?
  choices:
    A: Date of birth
    B: Legal name
    C: Eye color
    D: Social Security Number
  answer: C
  explanation: Height, weight, eye color, and gender are self-designated descriptors. Applicants are not required to present documentation that confirms the information they submit for these entries.
- id: 38
  category: driver_responsibility
  question: To apply for a Learner's Permit, an individual under the age of 18 must have maintained a 'clean' driving record for how long?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: C
  explanation: To apply for a Learner's Permit, an individual under the age of 18 must have maintained a 'clean' driving record in the previous two (2) years.
- id: 39
  category: license_system
  question: How long must an individual possess a Learner's Permit before obtaining a Junior Driver's License?
  choices:
    A: 6 months
    B: 1 year
    C: 18 months
    D: 2 years
  answer: B
  explanation: An individual must possess a Learner's Permit for at least one (1) year prior to obtaining a Junior Driver's License.
- id: 40
  category: driver_testing
  question: In addition to driver education, how many hours of driving practice must a 16- or 17-year-old complete before getting a Junior Driver's License?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: B
  explanation: In addition to the driver education hours, you must complete 40 hours of driving practice, with at least 10 hours being nighttime driving.
- id: 41
  category: safe_driving_rules
  question: For the purposes of logging driving practice for a Junior Driver's License, how is "nighttime driving" defined?
  choices:
    A: From sunset to sunrise
    B: From 30 minutes after sunset to 30 minutes before sunrise
    C: From 8:00 PM to 6:00 AM
    D: From 1 hour after sunset to 1 hour before sunrise
  answer: B
  explanation: Nighttime driving is considered driving during the period of 30 minutes after sunset, to 30 minutes before sunrise.
- id: 42
  category: driver_testing
  question: If your Learner's Permit has been expired for more than 3 years, what must you do before a road test can be given?
  choices:
    A: Retake the driver education course
    B: Complete an additional 40 hours of practice driving
    C: Take a written exam
    D: Wait 6 months before reapplying
  answer: C
  explanation: If a Learner's Permit has been expired more than 3 years, a written exam would be required before the road test can be given.
- id: 43
  category: license_system
  question: If a foreign exchange student wants to get a Learner's Permit, who must sign the Foreign Exchange Parental Authorization Form (VL-036)?
  choices:
    A: The host parent
    B: The school guidance counselor
    C: A parent or legal guardian
    D: The driver education instructor
  answer: C
  explanation: If you are a foreign exchange student, you may obtain a Foreign Exchange Parental Authorization Form to be signed by a parent or legal guardian. A host parent cannot sign.
- id: 44
  category: driver_testing
  question: When arriving for a road test appointment, what specific vehicle equipment is explicitly mentioned in the manual as needing to be in proper working order?
  choices:
    A: The air conditioning system
    B: The emergency/parking brake
    C: The radio and sound system
    D: The interior dome light
  answer: B
  explanation: 'The manual states to have a vehicle that is clean, in good mechanical condition, legal, and with a valid inspection sticker, and specifically notes: "Be sure the emergency/parking brake is working properly."'
- id: 45
  category: license_system
  question: If you are transferring an out-of-state Junior Driver's License to Vermont, you are subject to Vermont's Graduated License provisions UNLESS you have held the out-of-state Junior License for at least how long?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: You will be subject to Vermont's Graduated License provisions unless you have held the Junior Driver's License in the other state for a period of at least six months.
- id: 46
  category: license_system
  question: Under what condition is a new Vermont resident exempt from Vermont's Graduated License provisions for a Junior Driver’s License?
  choices:
    A: If they are at least 16 years old
    B: If they have held a Junior Driver’s License in another state for at least six months
    C: If they pass a high school driver education course
    D: If they have a clean driving record for one year
  answer: B
  explanation: The manual states you will be subject to Vermont's Graduated License provisions unless you have held the Junior Driver’s License in another state for a period of at least six months.
- id: 47
  category: driver_testing
  question: What document is issued to a student who passes a road test given by a certified high school driver education instructor?
  choices:
    A: A provisional Junior Driver's License
    B: A Vermont Learner's Permit
    C: A Driver Education Examination Certificate
    D: A Graduated License Waiver
  answer: C
  explanation: According to the manual, a student who passes the road test given by the high school driver education instructor will be issued a Driver Education Examination Certificate.
- id: 48
  category: license_system
  question: How long must an individual hold a Junior Driver’s License before they can operate a vehicle in the course of their employment, such as delivering pizzas?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year or until they reach age 18
    D: 2 years or until they reach age 21
  answer: C
  explanation: The manual states that while holding a Junior Driver’s License, you cannot operate a vehicle in the course of your employment for one year following its issuance, or until reaching the age of 18, whichever comes first.
- id: 49
  category: safe_driving_rules
  question: During the first three months of operating under a Junior Driver’s License, when are you allowed to carry passengers?
  choices:
    A: Only when transporting family members
    B: Only if accompanied by a licensed and unimpaired individual 25 years of age or older in the front seat
    C: Only during daylight hours
    D: Under no circumstances
  answer: B
  explanation: During the first three months, the individual is restricted to driving alone unless accompanied by a licensed and unimpaired parent/guardian, driver ed instructor, or an individual 25 years of age or older riding in the front seat.
- id: 50
  category: safe_driving_rules
  question: What new passenger privilege is granted during the second three months of operation under a Junior Driver’s License?
  choices:
    A: The driver may transport any friends without an adult present.
    B: The driver may begin transporting family members.
    C: The driver may carry passengers for hire.
    D: The driver may transport up to three non-family members.
  answer: B
  explanation: The manual specifies that during the second three months of operation under a Junior Driver’s License, the individual may begin transporting family members.
- id: 51
  category: safe_driving_rules
  question: Which of the following is true regarding the use of portable electronic devices while operating a motor vehicle?
  choices:
    A: You may read text messages but not send them.
    B: You may use a tablet if it is mounted to the dashboard.
    C: A person shall not use any portable electronic device while operating a motor vehicle.
    D: You may send emails only when stopped at a red light.
  answer: C
  explanation: The manual explicitly states, 'A person shall not use any portable electronic device while operating a motor vehicle,' which includes reading, composing, or sending electronic communications.
- id: 52
  category: driver_testing
  question: When bringing a vehicle for a Driver's License road test, what specific mechanical component must be working properly?
  choices:
    A: The air conditioning system
    B: The emergency/parking brake
    C: The cruise control
    D: The GPS navigation system
  answer: B
  explanation: 'The manual requires that the vehicle be clean, in good mechanical condition with a valid inspection sticker, and specifically notes: ''Be sure the emergency/parking brake is working properly.'''
- id: 53
  category: license_system
  question: If you are a new Vermont resident with an out-of-state license that has been expired for more than three years, what tests must you take?
  choices:
    A: Only a vision test
    B: Only a written test
    C: Only a road test
    D: The vision, written, and road tests
  answer: D
  explanation: The manual states that if your out-of-state license has been expired for more than three years, you will have to take the vision, written, and road tests.
- id: 54
  category: driver_responsibility
  question: Under what circumstance will a person NOT be issued a new Vermont driver's license?
  choices:
    A: If they have a valid out-of-state license
    B: If they are 18 years of age or older
    C: If their driving privilege is currently suspended in another state
    D: If they wear corrective lenses
  answer: C
  explanation: A person whose privilege to operate a motor vehicle in any state has been suspended, revoked, or refused cannot be issued a license until it has been terminated and officially reinstated in writing.
- id: 55
  category: license_system
  question: What type of endorsement is required to transport school children in a school bus rated by the manufacturer for fewer than 16 passengers?
  choices:
    A: A Commercial Driver's License with a hazardous materials endorsement
    B: A Type II school bus endorsement
    C: A motorcycle endorsement
    D: A Class A passenger endorsement
  answer: B
  explanation: The manual states, 'If you transport school children in school buses rated by the manufacturer for fewer than 16 passengers, you are required to obtain a Type II school bus endorsement on your driver’s license.'
- id: 56
  category: license_system
  question: What is the minimum age required for a person with a license to get a motorcycle endorsement or permit by passing a test?
  choices:
    A: 15 years old
    B: 16 years old
    C: 18 years old
    D: 21 years old
  answer: B
  explanation: According to the manual, 'Any person 16 years old or older who has a license may get a motorcycle endorsement or a motorcycle permit by passing a test.'
- id: 57
  category: driver_testing
  question: What is a benefit of successfully completing the Basic Rider Course through the Vermont Rider Education Program (VREP)?
  choices:
    A: You receive a free motorcycle.
    B: You are exempt from taking the state written and skill exams required for a motorcycle endorsement.
    C: You do not need to wear a helmet while riding.
    D: You are automatically issued a Commercial Driver's License.
  answer: B
