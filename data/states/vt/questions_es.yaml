questions:
- id: 1
  category: driver_responsibility
  question: ¿Tiene algún costo para el donante o su familia que se lleve a cabo la
    donación de órganos?
  choices:
    A: Sí, se cobra una tarifa fija a la familia.
    B: Sí, el seguro del donante debe cubrir el costo.
    C: No, no tiene costo para el donante ni para su familia.
    D: Sí, pero solo para la donación de tejidos.
  answer: C
  explanation: El manual establece como un hecho que no hay costo para el donante
    o su familia para que se realice la donación.
- id: 2
  category: driver_responsibility
  question: ¿Cómo afecta el decir "Sí" a la donación de órganos a su atención médica?
  choices:
    A: Recibirá atención de menor prioridad en una emergencia.
    B: No afectará su atención médica.
    C: Recibirá atención médica gratuita de por vida.
    D: Los médicos no se esforzarán tanto por salvar su vida.
  answer: B
  explanation: El manual establece explícitamente que decir "Sí" a la donación no
    afectará su atención médica.
- id: 3
  category: driver_testing
  question: ¿Cuál es el nombre del tutorial web proporcionado por Vermont para ayudarle
    a estudiar para su examen de Permiso de Aprendiz (Learner's Permit)?
  choices:
    A: VermontDrive
    B: SafeDriveVT
    C: DriveVermont
    D: VTLearner
  answer: C
  explanation: El manual recomienda estudiar para el examen de Permiso de Aprendiz
    y aprender a conducir de manera segura utilizando su tutorial web, DriveVermont.
- id: 4
  category: driver_testing
  question: ¿Dónde se realiza el examen de permiso de aprendiz de Vermont?
  choices:
    A: Solo en la oficina principal de Montpelier.
    B: En persona en cualquier escuela secundaria local.
    C: En persona en cualquier oficina del DMV.
    D: Es un examen en línea disponible en mydmv.vermont.gov.
  answer: D
  explanation: El manual establece que el examen de permiso de aprendiz ya no se realiza
    en sus oficinas; es un examen en línea disponible en su sitio web, mydmv.vermont.gov.
- id: 5
  category: driver_responsibility
  question: Si considera que el Departamento de Vehículos Motorizados (DMV) no le
    ha proporcionado una adaptación razonable para su discapacidad, ¿dónde puede presentar
    una queja?
  choices:
    A: La Corte Suprema de Vermont
    B: La Comisión de Derechos Humanos de Vermont
    C: El Departamento de Transporte
    D: La Oficina del Gobernador
  answer: B
  explanation: Si considera que el DMV no le ha proporcionado una adaptación razonable,
    puede presentar una queja ante la Comisión de Derechos Humanos de Vermont llamando
    al 800.416.2010.
- id: 6
  category: safe_driving_rules
  question: Según el mensaje de seguridad del Comisionado, ¿cuál es la principal causa
    de hospitalización y muerte por lesiones?
  choices:
    A: Accidentes laborales
    B: Colisiones de vehículos
    C: Enfermedades cardíacas
    D: Lesiones deportivas
  answer: B
  explanation: El mensaje del Comisionado señala que las colisiones de vehículos son
    la principal causa de hospitalización y muerte por lesiones.
- id: 7
  category: license_system
  question: 'Según el manual del conductor de Vermont, tener una licencia de conducir
    se considera:'
  choices:
    A: Un derecho constitucional
    B: Una garantía incondicional
    C: Un privilegio
    D: Un requisito para todos los adultos
  answer: C
  explanation: El manual establece que tener una licencia es un privilegio; uno que
    se gana demostrando sus habilidades de conducción de una manera que demuestre
    que es un conductor competente y seguro.
- id: 8
  category: driver_responsibility
  question: 'Al obtener un Permiso de Aprendiz o una Licencia de Conducir, usted se
    compromete a todo lo siguiente, EXCEPTO:'
  choices:
    A: Contar con un seguro de responsabilidad civil
    B: Mantener un vehículo operativo seguro que cumpla con los estándares de emisiones
    C: Conducir un vehículo fabricado en los últimos 10 años
    D: Adoptar hábitos que eliminen las distracciones al conducir
  answer: C
  explanation: El manual enumera compromisos como mantener un vehículo seguro que
    cumpla con los estándares de emisiones, contar con seguro de responsabilidad civil,
    obedecer las reglas de la carretera y eliminar las distracciones. No requiere
    conducir un vehículo fabricado en los últimos 10 años.
- id: 9
  category: license_system
  question: Si un día festivo del estado de Vermont cae en sábado, ¿cuándo lo observa
    el DMV?
  choices:
    A: El viernes anterior
    B: El lunes siguiente
    C: El martes siguiente
    D: No se observa
  answer: A
  explanation: El manual establece que un día festivo que caiga en sábado se observará
    el viernes anterior.
- id: 10
  category: license_system
  question: ¿En qué fecha se observa el Día de la Batalla de Bennington (Bennington
    Battle Day) en Vermont?
  choices:
    A: 4 de julio
    B: 16 de agosto
    C: 11 de noviembre
    D: El primer martes de marzo
  answer: B
  explanation: Según la lista de días festivos del estado de Vermont en el manual,
    el Día de la Batalla de Bennington se observa el 16 de agosto.
- id: 11
  category: license_system
  question: ¿Cuál es la política para visitar una oficina del DMV de Vermont?
  choices:
    A: Se aceptan visitas sin cita previa en todo momento.
    B: Solo se aceptan visitas sin cita previa los martes y jueves.
    C: Todas las visitas a la oficina son solo con cita previa.
    D: Solo se requieren citas para las pruebas de manejo.
  answer: C
  explanation: El manual establece explícitamente en la sección de Ubicaciones de
    Oficinas que "Todas las visitas a la oficina son solo con cita previa".
- id: 12
  category: alcohol_drugs_health
  question: Si un menor es sorprendido y multado por falsear su edad, obtener, poseer
    o consumir licores, ¿con qué programa debe comunicarse?
  choices:
    A: El Programa de Desvío de Seguridad Vial
    B: El Programa Juvenil de la Policía Estatal de Vermont
    C: Madres Contra la Conducción Bajo los Efectos del Alcohol (MADD)
    D: El Programa de Seguridad sobre el Alcohol para Adolescentes (TASP)
  answer: D
  explanation: Los menores multados por estas infracciones deben comunicarse con el
    Programa de Seguridad sobre el Alcohol para Adolescentes (TASP, por sus siglas
    en inglés) de la Desviación Judicial de Vermont.
- id: 13
  category: penalties_and_points
  question: ¿Cuántos días tiene un menor para comunicarse con la junta de desvío después
    de ser multado por una infracción de alcohol antes de que el caso sea remitido
    a la oficina judicial?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: El manual establece que si no se comunica con la junta de desvío dentro
    de los 15 días, el caso será remitido a la oficina judicial.
- id: 14
  category: penalties_and_points
  question: Si un menor no se comunica con la junta de desvío por una infracción de
    alcohol y la oficina judicial lo encuentra responsable, ¿cuál es la sanción?
  choices:
    A: Una multa de $100 y una suspensión de la licencia por 30 días
    B: Una multa de $300 y una suspensión de 90 días de su licencia de conducir
    C: Una multa de $500 y una suspensión de la licencia por 6 meses
    D: Una multa de $1,000 y una suspensión de la licencia por 1 año
  answer: B
  explanation: Si la oficina judicial lo encuentra responsable, la persona estará
    sujeta a una multa de $300.00 y una suspensión de 90 días de su licencia de conducir.
- id: 15
  category: penalties_and_points
  question: ¿Qué sucede si un menor no completa el Programa de Seguridad sobre el
    Alcohol para Adolescentes (TASP) u otros requisitos de Desvío?
  choices:
    A: Debe pagar una multa adicional de $50.
    B: Debe volver a tomar el examen de conducir escrito.
    C: Su licencia o privilegio para conducir será suspendido.
    D: Se le asignarán 100 horas de servicio comunitario.
  answer: C
  explanation: El manual advierte que si no completa el TASP u otros requisitos de
    Desvío, su licencia o privilegio para conducir será SUSPENDIDO.
- id: 16
  category: penalties_and_points
  question: ¿Cuál es la consecuencia de no completar el TASP u otros requisitos de
    Desvío?
  choices:
    A: Se le requerirá volver a tomar el examen de conducir.
    B: Su licencia o privilegio para conducir será suspendido.
    C: Recibirá una carta de advertencia del DMV.
    D: El registro de su vehículo será revocado permanentemente.
  answer: B
  explanation: Según el manual, si no completa el TASP u otros requisitos de Desvío,
    su licencia o privilegio para conducir será SUSPENDIDO.
- id: 17
  category: penalties_and_points
  question: ¿Cuál es la sanción máxima por obtener un Permiso de Aprendiz o una Licencia
    de Conducir mediante representación falsa?
  choices:
    A: Una multa de $500 y una suspensión de 30 días.
    B: Una multa de $1,000, hasta dos años de prisión, o ambos, más una suspensión
      de 90 días.
    C: Una multa de $2,000 y la revocación permanente de los privilegios de conducir.
    D: Una multa de $300 y el requisito de asistir a una evaluación de abuso de alcohol.
  answer: B
  explanation: El manual establece que obtener una licencia o permiso mediante representación
    falsa puede resultar en una multa de no más de $1,000 o prisión de no más de dos
    años, o ambos, y la suspensión del privilegio de operar por 90 días.
- id: 18
  category: license_system
  question: ¿Cuál es el propósito de la consulta al Sistema Nacional de Indicadores
    de Conductores con Problemas (PDPS) cuando solicita una licencia?
  choices:
    A: Verificar si tiene multas de estacionamiento sin pagar en su ciudad de origen.
    B: Verificar su puntaje de crédito e historial de seguros.
    C: Determinar si su licencia está suspendida, revocada, denegada o cancelada en
      otro estado.
    D: Confirmar que ha completado un curso de educación vial aprobado.
  answer: C
  explanation: Se realiza una consulta al PDPS para ver si su licencia está suspendida,
    revocada, denegada o cancelada en otro estado. De ser así, se le denegará la licencia
    de Vermont hasta que se aclare su situación.
- id: 19
  category: license_system
  question: ¿Cuál de las siguientes es una regla con respecto a los documentos que
    debe presentar como prueba de identidad?
  choices:
    A: Se aceptan copias enviadas por fax si están notarizadas.
    B: Se aceptan fotocopias solo para las tarjetas de Seguro Social.
    C: Los documentos deben ser originales o copias certificadas por la agencia emisora.
    D: Solo necesita proporcionar documentos de dos de las cuatro categorías requeridas.
  answer: C
  explanation: 'El manual señala explícitamente: "Los documentos deben ser originales
    o copias certificadas por la agencia emisora. NO se aceptarán documentos enviados
    por fax o fotocopiados".'
- id: 20
  category: license_system
  question: Además de la prueba de identidad, el SSN y la residencia en Vermont, ¿qué
    documentación específica requiere una Licencia de Conducir Mejorada (EDL)?
  choices:
    A: Prueba de ciudadanía estadounidense
    B: Un pasaporte válido de cualquier país
    C: Una carta de su empleador actual
    D: Prueba de un historial de manejo limpio durante 5 años
  answer: A
  explanation: 'El manual establece: "Una EDL requiere prueba de ciudadanía estadounidense
    además de la prueba de identidad, el SSN y la residencia en Vermont".'
- id: 21
  category: license_system
  question: Si su tarjeta de Seguro Social no está disponible, ¿cuál de los siguientes
    documentos puede utilizarse en su lugar?
  choices:
    A: Un acta de nacimiento certificada
    B: Un formulario W-2
    C: Una factura de servicios públicos
    D: Un estado de cuenta de tarjeta de crédito
  answer: B
  explanation: Si su tarjeta de Seguro Social no está disponible, las formas alternativas
    aceptables incluyen un formulario W-2, un formulario SSA-1099 o un talón de pago
    que muestre su nombre y su número de Seguro Social (SSN).
- id: 22
  category: license_system
  question: Si necesita corregir o actualizar su nombre en su licencia de conducir,
    ¿qué debe hacer antes de visitar el DMV?
  choices:
    A: Publicar su cambio de nombre en un periódico local.
    B: Obtener un nuevo pasaporte con su nombre actualizado.
    C: Actualizar su información en la Administración del Seguro Social.
    D: Notificar el cambio a su compañía de seguros de automóviles.
  answer: C
  explanation: 'Su nombre debe ser verificado con la Administración del Seguro Social.
    El manual establece: "Si necesita corregir o actualizar información en la Administración
    del Seguro Social, hágalo antes de visitar el DMV".'
- id: 23
  category: license_system
  question: El DMV de Vermont NO emitirá una licencia de conducir o identificación
    a un ciudadano extranjero si le quedan menos de ¿cuántos días de presencia legal?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: 'El manual especifica: "El DMV de Vermont no emitirá una licencia de
    conducir o identificación si le quedan menos de 30 días de presencia legal (Lawful
    Presence)".'
- id: 24
  category: license_system
  question: Al proporcionar una prueba de residencia en Vermont, ¿cuál de las siguientes
    afirmaciones es verdadera sobre su dirección residencial?
  choices:
    A: Puede ser un apartado postal si vive en una zona rural.
    B: Debe ser una dirección de calle o carretera.
    C: No es necesaria si tiene un pasaporte estadounidense válido.
    D: Puede ser una dirección fuera del estado si es un estudiante universitario.
  answer: B
  explanation: 'El manual establece: "La dirección residencial que proporcione debe
    ser una dirección de calle o carretera. No puede ser un apartado postal (P.O.
    Box)".'
- id: 25
  category: license_system
  question: Si recibe correspondencia en su dirección de calle, ¿cuántas piezas de
    correspondencia con su nombre actual y dirección de calle se requieren para demostrar
    la residencia en Vermont?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Si se recibe correspondencia en la dirección de la calle, debe proporcionar
    "Dos piezas de correspondencia con el nombre actual y la dirección de la calle".
- id: 26
  category: license_system
  question: Si no recibe correspondencia en su dirección de calle, ¿cuál de los siguientes
    puede utilizarse como uno de los dos documentos requeridos para mostrar su dirección
    de calle?
  choices:
    A: Una carta escrita a mano por un vecino
    B: Una tarjeta de la biblioteca local
    C: Una factura de servicios públicos que indique la dirección del servicio
    D: Una etiqueta de suscripción a una revista
  answer: C
  explanation: Si no se recibe correspondencia en la dirección de la calle, los documentos
    aceptables incluyen una "Factura de servicios públicos (debe indicar la dirección
    del servicio)".
- id: 27
  category: license_system
  question: ¿Cómo puede el personal militar de los EE. UU. en servicio activo que
    reside fuera del estado demostrar su residencia en Vermont?
  choices:
    A: Proporcionando una identificación militar y prueba de que Vermont es su residencia
      en los registros militares, como una Declaración de Licencia e Ingresos (Leave
      and Earnings Statement).
    B: Mostrando una licencia de conducir válida de otro estado y una identificación
      militar.
    C: Aprobando un examen escrito de conocimientos de Vermont y presentando una factura
      de servicios públicos.
    D: Proporcionando una carta de su oficial al mando indicando que están destacados
      cerca.
  answer: A
  explanation: Para el personal militar en servicio activo que reside fuera del estado,
    debe proporcionar una "identificación militar y prueba de que Vermont es su residencia
    en los registros militares, como una Declaración de Licencia e Ingresos (Leave
    and Earnings Statement) u órdenes".
- id: 28
  category: license_system
  question: ¿Qué documentación debe proporcionar un menor de edad para demostrar la
    residencia en Vermont?
  choices:
    A: Dos piezas de correspondencia dirigidas directamente al menor.
    B: Un expediente académico de la escuela secundaria y una identificación de estudiante.
    C: Una Certificación de Residencia de Vermont, un documento de residencia de uno
      de los padres y evidencia de parentesco.
    D: Un formulario W-2 y una tarjeta de Seguro Social.
  answer: C
  explanation: Los menores deben proporcionar una "Certificación de Residencia de
    Vermont y un (1) documento de residencia de los padres", así como "evidencia de
    parentesco del padre/tutor con el solicitante".
- id: 29
  category: license_system
  question: ¿Bajo qué condición puede un no residente de Vermont obtener un permiso
    de aprendizaje (Learner’s Permit) de Vermont?
  choices:
    A: Para conducir hacia y desde el trabajo en Vermont.
    B: Para participar en un curso de educación y capacitación vial.
    C: Para operar un vehículo comercial a través de las fronteras estatales.
    D: Para visitar a familiares que residen en el estado.
  answer: B
  explanation: 'El manual establece: "Si el solicitante no es residente de Vermont,
    solo puede obtener un permiso de aprendizaje de Vermont con el fin de participar
    en un curso de educación y capacitación vial".'
- id: 30
  category: license_system
  question: ¿Qué documentación específica debe proporcionar un solicitante no residente
    para obtener un permiso de aprendizaje de Vermont?
  choices:
    A: Una carta de un consejero escolar que indique que el estudiante se inscribirá
      en un curso de educación vial.
    B: Una factura de servicios públicos de su estado de origen.
    C: Una licencia de conducir válida de su estado de origen.
    D: Prueba de seguro del vehículo en Vermont.
  answer: A
  explanation: Un no residente que solicita un permiso para tomar educación vial debe
    proporcionar "Una carta de un consejero escolar que indique que el estudiante/solicitante
    se inscribirá en un curso de educación vial..."
- id: 31
  category: license_system
  question: ¿Cuántos días tiene un nuevo residente de Vermont para obtener una licencia
    de conducir de Vermont?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Según el manual, una persona que se ha mudado al estado desde otra
    jurisdicción con una licencia válida debe obtener una licencia de Vermont dentro
    de los 60 días posteriores a su mudanza al estado.
- id: 32
  category: license_system
  question: ¿Cuántos días tiene una persona que posee una licencia de conducir comercial
    (CDL) de otro estado para transferirla después de establecer su residencia en
    Vermont?
  choices:
    A: 14 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: El manual establece que cualquier persona que posea una licencia de
    conducir comercial de otro estado debe transferir su CDL dentro de los 30 días
    posteriores a establecer su residencia en Vermont.
- id: 33
  category: driver_testing
  question: ¿Cuál es la edad mínima requerida para realizar el examen para un Permiso
    de Aprendizaje de Vermont?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 17 años
  answer: B
  explanation: 'El manual establece explícitamente: "Debe tener al menos 15 años para
    realizar el examen" para un Permiso de Aprendizaje.'
- id: 34
  category: safe_driving_rules
  question: ¿Quién tiene permitido viajar en el asiento delantero y supervisar a un
    conductor con un Permiso de Aprendizaje válido?
  choices:
    A: Cualquier conductor con licencia de 18 años o más
    B: Una persona con licencia y sin impedimentos de 25 años de edad o más
    C: Cualquier conductor con licencia con al menos 1 año de experiencia de conducción
    D: Un hermano con licencia que tenga al menos 21 años
  answer: B
  explanation: Un conductor con un Permiso de Aprendizaje puede conducir si está acompañado
    en el asiento delantero por un padre/tutor con licencia y sin impedimentos, un
    instructor de educación vial con licencia/certificado y sin impedimentos, o una
    persona con licencia y sin impedimentos de 25 años de edad o más.
- id: 35
  category: license_system
  question: ¿Bajo qué condición puede un no residente obtener un Permiso de Aprendizaje
    de Vermont?
  choices:
    A: Si posee una propiedad en Vermont
    B: Si está participando en un curso de educación y capacitación vial de Vermont
    C: Si tiene una licencia de conducir válida de otro estado
    D: Los no residentes no pueden obtener un Permiso de Aprendizaje de Vermont bajo
      ninguna circunstancia
  answer: B
  explanation: Si el solicitante no es residente de Vermont, solo puede obtener un
    Permiso de Aprendizaje de Vermont con el fin de participar en un curso de educación
    y capacitación vial.
- id: 36
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la Tarjeta
    de Privilegio de Conducir (DPC) de Vermont?
  choices:
    A: Es un documento que cumple con Real ID
    B: Requiere prueba de ciudadanía estadounidense
    C: No requiere prueba de presencia legal o ciudadanía estadounidense
    D: Está disponible para no residentes de Vermont
  answer: C
  explanation: El manual establece que la Tarjeta de Privilegio de Conducir NO cumple
    con Real ID y la emisión de la DPC no requiere prueba de presencia legal o ciudadanía
    estadounidense.
- id: 37
  category: license_system
  question: Para una licencia de conducir de Vermont, ¿cuál de los siguientes es un
    descriptor autodesignado que NO requiere documentación de confirmación?
  choices:
    A: Fecha de nacimiento
    B: Nombre legal
    C: Color de ojos
    D: Número de Seguro Social
  answer: C
  explanation: La estatura, el peso, el color de ojos y el género son descriptores
    autodesignados. Los solicitantes no están obligados a presentar documentación
    que confirme la información que envían para estas entradas.
- id: 38
  category: driver_responsibility
  question: Para solicitar un Permiso de Aprendizaje, ¿durante cuánto tiempo debe
    haber mantenido un historial de conducción 'limpio' una persona menor de 18 años?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: C
  explanation: Para solicitar un Permiso de Aprendizaje, una persona menor de 18 años
    debe haber mantenido un historial de conducción 'limpio' en los dos (2) años anteriores.
- id: 39
  category: license_system
  question: ¿Cuánto tiempo debe poseer una persona un Permiso de Aprendizaje antes
    de obtener una Licencia de Conducir Juvenil (Junior Driver's License)?
  choices:
    A: 6 meses
    B: 1 año
    C: 18 meses
    D: 2 años
  answer: B
  explanation: Una persona debe poseer un Permiso de Aprendizaje durante al menos
    un (1) año antes de obtener una Licencia de Conducir Juvenil.
- id: 40
  category: driver_testing
  question: Además de la educación vial, ¿cuántas horas de práctica de conducción
    debe completar un joven de 16 o 17 años antes de obtener una Licencia de Conducir
    Juvenil?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: B
  explanation: Además de las horas de educación vial, debe completar 40 horas de práctica
    de conducción, siendo al menos 10 horas de conducción nocturna.
- id: 41
  category: safe_driving_rules
  question: ¿Para efectos del registro de la práctica de conducción para una Licencia
    de Conducir Juvenil, cómo se define la "conducción nocturna"?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Desde 30 minutos después del atardecer hasta 30 minutos antes del amanecer
    C: De 8:00 PM a 6:00 AM
    D: Desde 1 hora después del atardecer hasta 1 hora antes del amanecer
  answer: B
  explanation: La conducción nocturna se considera conducir durante el período de
    30 minutos después del atardecer hasta 30 minutos antes del amanecer.
- id: 42
  category: driver_testing
  question: Si su Permiso de Aprendizaje ha estado vencido por más de 3 años, ¿qué
    debe hacer antes de que se le pueda realizar un examen de conducción?
  choices:
    A: Volver a tomar el curso de educación vial
    B: Completar 40 horas adicionales de práctica de conducción
    C: Tomar un examen escrito
    D: Esperar 6 meses antes de volver a solicitarlo
  answer: C
  explanation: Si un Permiso de Aprendizaje ha estado vencido por más de 3 años, se
    requerirá un examen escrito antes de que se pueda realizar el examen de conducción.
- id: 43
  category: license_system
  question: Si un estudiante de intercambio extranjero desea obtener un Permiso de
    Aprendizaje, ¿quién debe firmar el Formulario de Autorización Parental para Intercambio
    Extranjero (VL-036)?
  choices:
    A: El padre anfitrión
    B: El consejero escolar
    C: Un padre o tutor legal
    D: El instructor de educación vial
  answer: C
  explanation: Si usted es un estudiante de intercambio extranjero, puede obtener
    un Formulario de Autorización Parental para Intercambio Extranjero para que sea
    firmado por un padre o tutor legal. Un padre anfitrión no puede firmar.
- id: 44
  category: driver_testing
  question: Al llegar a una cita para el examen de conducción, ¿qué equipo específico
    del vehículo se menciona explícitamente en el manual que debe estar en buen estado
    de funcionamiento?
  choices:
    A: El sistema de aire acondicionado
    B: El freno de emergencia/estacionamiento
    C: El radio y el sistema de sonido
    D: La luz interior del techo
  answer: B
  explanation: 'El manual establece que debe tener un vehículo que esté limpio, en
    buenas condiciones mecánicas, legal y con una calcomanía de inspección válida,
    y señala específicamente: "Asegúrese de que el freno de emergencia/estacionamiento
    funcione correctamente".'
- id: 45
  category: license_system
  question: Si está transfiriendo una Licencia de Conducir Juvenil de otro estado
    a Vermont, está sujeto a las disposiciones de la Licencia Graduada de Vermont
    A MENOS que haya tenido la Licencia Juvenil de otro estado durante al menos ¿cuánto
    tiempo?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Estará sujeto a las disposiciones de la Licencia Graduada de Vermont
    a menos que haya tenido la Licencia de Conducir Juvenil en el otro estado por
    un período de al menos seis meses.
- id: 46
  category: license_system
  question: ¿Bajo qué condición un nuevo residente de Vermont está exento de las disposiciones
    de la Licencia Graduada de Vermont para una Licencia de Conducir Juvenil?
  choices:
    A: Si tiene al menos 16 años de edad
    B: Si ha tenido una Licencia de Conducir Juvenil en otro estado durante al menos
      seis meses
    C: Si aprueba un curso de educación vial de la escuela secundaria
    D: Si tiene un historial de conducción limpio durante un año
  answer: B
  explanation: El manual establece que usted estará sujeto a las disposiciones de
    la Licencia Graduada de Vermont a menos que haya tenido la Licencia de Conducir
    Juvenil en otro estado por un período de al menos seis meses.
- id: 47
  category: driver_testing
  question: ¿Qué documento se le entrega a un estudiante que aprueba un examen de
    conducción realizado por un instructor certificado de educación vial de la escuela
    secundaria?
  choices:
    A: Una Licencia de Conducir Juvenil provisional
    B: Un Permiso de Aprendizaje de Vermont
    C: Un Certificado de Examen de Educación Vial
    D: Una Exención de Licencia Graduada
  answer: C
  explanation: Según el manual, a un estudiante que apruebe el examen de conducción
    realizado por el instructor de educación vial de la escuela secundaria se le entregará
    un Certificado de Examen de Educación Vial.
- id: 48
  category: license_system
  question: ¿Cuánto tiempo debe una persona tener una Licencia de Conducir Juvenil
    antes de poder operar un vehículo en el curso de su empleo, como repartir pizzas?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año o hasta que cumpla 18 años
    D: 2 años o hasta que cumpla 21 años
  answer: C
  explanation: El manual establece que mientras tenga una Licencia de Conducir Juvenil,
    no puede operar un vehículo en el curso de su empleo durante un año después de
    su emisión, o hasta cumplir los 18 años, lo que ocurra primero.
- id: 49
  category: safe_driving_rules
  question: Durante los primeros tres meses de operar bajo una Licencia de Conducir
    Juvenil, ¿cuándo se le permite llevar pasajeros?
  choices:
    A: Solo cuando transporte a miembros de la familia
    B: Solo si va acompañado por una persona con licencia y sin impedimentos de 25
      años de edad o más en el asiento delantero
    C: Solo durante las horas del día
    D: Bajo ninguna circunstancia
  answer: B
  explanation: Durante los primeros tres meses, la persona está restringida a conducir
    sola a menos que esté acompañada por un padre/tutor con licencia y sin impedimentos,
    un instructor de educación vial o una persona de 25 años de edad o más que viaje
    en el asiento delantero.
- id: 50
  category: safe_driving_rules
  question: ¿Qué nuevo privilegio de pasajeros se otorga durante los segundos tres
    meses de operación bajo una Licencia de Conducir Juvenil?
  choices:
    A: El conductor puede transportar a cualquier amigo sin la presencia de un adulto.
    B: El conductor puede comenzar a transportar a miembros de la familia.
    C: El conductor puede llevar pasajeros por contrato.
    D: El conductor puede transportar hasta tres personas que no sean miembros de
      la familia.
  answer: B
  explanation: El manual especifica que durante los segundos tres meses de operación
    bajo una Licencia de Conducir Juvenil, la persona puede comenzar a transportar
    a miembros de la familia.
- id: 51
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de dispositivos electrónicos portátiles mientras se opera un vehículo motorizado?
  choices:
    A: Puede leer mensajes de texto pero no enviarlos.
    B: Puede usar una tableta si está montada en el tablero.
    C: Ninguna persona debe usar ningún dispositivo electrónico portátil mientras
      opera un vehículo motorizado.
    D: Puede enviar correos electrónicos solo cuando esté detenido en una luz roja.
  answer: C
  explanation: 'El manual establece explícitamente: ''Ninguna persona debe usar ningún
    dispositivo electrónico portátil mientras opera un vehículo motorizado'', lo que
    incluye leer, redactar o enviar comunicaciones electrónicas.'
- id: 52
  category: driver_testing
  question: Al traer un vehículo para un examen de conducir en carretera para la licencia
    de conducir, ¿qué componente mecánico específico debe funcionar correctamente?
  choices:
    A: El sistema de aire acondicionado
    B: El freno de emergencia/estacionamiento
    C: El control de crucero
    D: El sistema de navegación GPS
  answer: B
  explanation: 'El manual requiere que el vehículo esté limpio, en buenas condiciones
    mecánicas con una calcomanía de inspección válida, y señala específicamente: ''Asegúrese
    de que el freno de emergencia/estacionamiento funcione correctamente''.'
- id: 53
  category: license_system
  question: Si usted es un nuevo residente de Vermont con una licencia de otro estado
    que ha estado vencida por más de tres años, ¿qué exámenes debe tomar?
  choices:
    A: Solo un examen de la vista
    B: Solo un examen escrito
    C: Solo un examen de carretera
    D: Los exámenes de la vista, escrito y de carretera
  answer: D
  explanation: El manual establece que si su licencia de otro estado ha estado vencida
    por más de tres años, tendrá que tomar los exámenes de la vista, escrito y de
    carretera.
- id: 54
  category: driver_responsibility
  question: ¿Bajo qué circunstancia NO se le expedirá a una persona una nueva licencia
    de conducir de Vermont?
  choices:
    A: Si tiene una licencia válida de otro estado
    B: Si tiene 18 años de edad o más
    C: Si su privilegio de conducir está actualmente suspendido en otro estado
    D: Si usa lentes correctivos
  answer: C
  explanation: A una persona cuyo privilegio para operar un vehículo motorizado en
    cualquier estado haya sido suspendido, revocado o denegado, no se le puede expedir
    una licencia hasta que dicha sanción haya terminado y haya sido reinstalada oficialmente
    por escrito.
- id: 55
  category: license_system
  question: ¿Qué tipo de endoso se requiere para transportar niños en un autobús escolar
    clasificado por el fabricante para menos de 16 pasajeros?
  choices:
    A: Una Licencia de Conducir Comercial (CDL) con un endoso de materiales peligrosos
    B: Un endoso de autobús escolar Tipo II
    C: Un endoso de motocicleta
    D: Un endoso de pasajero Clase A
  answer: B
  explanation: 'El manual establece: ''Si transporta niños en autobuses escolares
    clasificados por el fabricante para menos de 16 pasajeros, se requiere que obtenga
    un endoso de autobús escolar Tipo II en su licencia de conducir''.'
- id: 56
  category: license_system
  question: ¿Cuál es la edad mínima requerida para que una persona con licencia obtenga
    un endoso o permiso de motocicleta al aprobar un examen?
  choices:
    A: 15 años
    B: 16 años
    C: 18 años
    D: 21 años
  answer: B
  explanation: 'Según el manual: ''Cualquier persona de 16 años o más que tenga una
    licencia puede obtener un endoso de motocicleta o un permiso de motocicleta al
    aprobar un examen''.'
- id: 57
  category: driver_testing
  question: ¿Cuál es un beneficio de completar con éxito el Curso Básico para Motociclistas
    a través del Programa de Educación para Motociclistas de Vermont (VREP)?
  choices:
    A: Recibe una motocicleta gratis.
    B: Está exento de tomar los exámenes estatales escrito y de habilidades requeridos
      para un endoso de motocicleta.
    C: No necesita usar casco mientras conduce.
    D: Se le expide automáticamente una Licencia de Conducir Comercial (CDL).
  answer: B
  explanation: El manual establece que los estudiantes que completan con éxito el
    Curso Básico para Motociclistas están exentos de tomar los exámenes estatales
    escrito y de habilidades requeridos para obtener un endoso de motocicleta.
- id: 58
  category: driver_testing
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a las visitas
    al Departamento de Vehículos Motorizados (DMV)?
  choices:
    A: Se aceptan visitas sin cita previa las mañanas de los días laborables.
    B: Solo se requieren citas para los exámenes de carretera.
    C: Todas las visitas al DMV son solo con cita previa.
    D: Las citas solo pueden hacerse llamando directamente al DMV.
  answer: C
  explanation: 'El manual establece explícitamente: ''Todas las visitas al DMV son
    solo con cita previa''.'
- id: 59
  category: driver_testing
  question: ¿Cuál es el estándar de visión requerido para aprobar la evaluación de
    la vista del DMV sin ser remitido a un médico de la vista?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: 'El manual establece: ''Si los resultados de la evaluación determinan
    que su visión no cumple con los estándares requeridos de 20/40, será remitido
    a un médico de la vista...'''
- id: 60
  category: safe_driving_rules
  question: Después de tener una Licencia de Conducir Juvenil durante seis meses,
    ¿cuál es la restricción sobre el número de pasajeros que puede transportar?
  choices:
    A: Solo puede transportar hasta tres pasajeros.
    B: No se le permite transportar más pasajeros de los que haya cinturones de seguridad.
    C: Puede transportar tantos pasajeros como quepan en el vehículo.
    D: Solo puede transportar pasajeros si un adulto está en el asiento delantero.
  answer: B
  explanation: El manual establece que después de seis meses, no hay restricción en
    el número de pasajeros, 'Sin embargo, el conductor no tiene permitido transportar
    más pasajeros de los que haya cinturones de seguridad'.
- id: 61
  category: driver_testing
  question: ¿Cuántas preguntas debe responder correctamente para aprobar el examen
    de conocimientos en línea?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: C
  explanation: El examen de conocimientos tiene 20 preguntas y debe responder correctamente
    al menos 16 preguntas para aprobar el examen.
- id: 62
  category: driver_testing
  question: Si reprueba el examen de manejo tres veces, ¿cuál es el período de espera
    mínimo requerido antes de poder realizar otro examen?
  choices:
    A: Un día
    B: Una semana
    C: Dos semanas
    D: Un mes
  answer: D
  explanation: Según el manual, si reprueba un examen de manejo tres veces, se requiere
    un período de espera mínimo de un mes.
- id: 63
  category: vehicle_information
  question: ¿Cuál de los siguientes tipos de placas de matrícula NO es aceptable en
    un vehículo utilizado para un examen de manejo?
  choices:
    A: Placas de otro estado
    B: Placas de vehículos antiguos
    C: Placas estatales estándar
    D: Placas personalizadas (vanity plates)
  answer: B
  explanation: No se realizará ningún examen de manejo en un vehículo que exhiba placas
    agrícolas, de vehículos antiguos o de exhibición porque estas placas, por ley,
    tienen un uso restringido.
- id: 64
  category: vehicle_information
  question: ¿En qué año de fabricación o posterior se requieren cinturones de seguridad
    y desempañadores para el examen de manejo?
  choices:
    A: '1955'
    B: '1964'
    C: '1970'
    D: '1985'
  answer: B
  explanation: Se requieren cinturones de seguridad y desempañadores en los modelos
    de 1964 y posteriores. No se realizará ningún examen de manejo en un vehículo
    que no tenga cinturones de seguridad.
- id: 65
  category: license_system
  question: Una persona con un Permiso de Aprendizaje (Learner's Permit) puede operar
    un vehículo motorizado si está acompañada por una persona con licencia y sin impedimentos
    que tenga al menos ¿cuántos años?
  choices:
    A: 18 años de edad
    B: 21 años de edad
    C: 25 años de edad
    D: 30 años de edad
  answer: C
  explanation: El titular de un Permiso de Aprendizaje debe estar acompañado por un
    padre o tutor con licencia y sin impedimentos, un instructor de educación vial
    o una persona con licencia y sin impedimentos de al menos 25 años de edad.
- id: 66
  category: license_system
  question: Antes de obtener una Licencia de Conducir Juvenil (Junior Driver's License),
    ¿cuántas horas adicionales de práctica al volante debe completar una persona?
  choices:
    A: 20 horas
    B: 30 horas
    C: 40 horas
    D: 50 horas
  answer: C
  explanation: Una persona debe completar 40 horas adicionales de práctica al volante,
    de las cuales al menos 10 horas deben ser de conducción nocturna, antes de obtener
    una Licencia de Conducir Juvenil.
- id: 67
  category: safe_driving_rules
  question: Para los fines del programa de Licencia de Conducir Graduada (GDL), ¿cómo
    se define la "conducción nocturna"?
  choices:
    A: De 6:00 PM a 6:00 AM
    B: 30 minutos después de la puesta del sol hasta 30 minutos antes de la salida
      del sol
    C: 1 hora después de la puesta del sol hasta 1 hora antes de la salida del sol
    D: De 8:00 PM a 5:00 AM
  answer: B
  explanation: 'El manual señala: La "conducción nocturna" se define como la conducción
    durante el período de treinta (30) minutos después de la puesta del sol hasta
    treinta (30) minutos antes de la salida del sol.'
- id: 68
  category: license_system
  question: Durante los primeros tres meses de operación con una Licencia de Conducir
    Juvenil, ¿a quién se le permite transportar al conductor si conduce sin un adulto
    acompañante aprobado?
  choices:
    A: A nadie (debe conducir solo)
    B: Solo a miembros de la familia inmediata
    C: Un pasajero de su misma edad (peer passenger)
    D: Solo hermanos
  answer: A
  explanation: Durante los primeros tres (3) meses de operación con una Licencia de
    Conducir Juvenil, la persona está restringida a conducir sola. Se permiten pasajeros
    solo si hay un padre/tutor, instructor o persona de 25 años o más con licencia
    y sin impedimentos viajando en el asiento delantero.
- id: 69
  category: penalties_and_points
  question: ¿Cuál es la sanción por una infracción de envío de mensajes de texto para
    un Operador Juvenil (JRT)?
  choices:
    A: Una revocación (recall) de 30 días
    B: Una revocación (recall) de 60 días
    C: Una revocación (recall) de 90 días
    D: Una revocación (recall) de 6 meses
  answer: A
  explanation: Una infracción de envío de mensajes de texto para un Operador Juvenil
    (JRT) resulta en una revocación de 30 días, que también incluye multas de al menos
    $100 y al menos dos puntos en su historial de conducción.
- id: 70
  category: penalties_and_points
  question: ¿Por cuántos días se revocará una Licencia de Conducir Juvenil si el operador
    acumula cuántos puntos en total?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: D
  explanation: Una Revocación por Acumulación de Puntos para Operadores Juveniles
    (JRP) resulta en una revocación de 90 días por una sola infracción de exceso de
    velocidad de 3 puntos o un total de 6 puntos.
- id: 71
  category: driver_testing
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al examen
    de conducción?
  choices:
    A: Se le puede pedir que realice una maniobra ilegal para poner a prueba su atención.
    B: Se permiten animales en el vehículo si están debidamente sujetos.
    C: Debe esperar al menos una semana antes de volver a tomar el examen si reprueba.
    D: No es necesario presentar un comprobante de seguro para el vehículo del examen.
  answer: C
  explanation: Si reprueba el examen de conducción por cualquier motivo, debe esperar
    al menos una semana antes de realizar otro examen. El manual también establece
    explícitamente que no se le pedirá realizar actos ilegales, no se permiten animales
    y se requiere un comprobante de seguro.
- id: 72
  category: driver_responsibility
  question: Según el manual, ¿cuál de las siguientes causas provoca más muertes entre
    los adolescentes de EE. UU. al conducir?
  choices:
    A: Beber y conducir
    B: Enviar mensajes de texto mientras se conduce
    C: Exceso de velocidad en zonas escolares
    D: Conducir con demasiados pasajeros
  answer: B
  explanation: 'El manual establece explícitamente: ''Mueren más adolescentes en EE.
    UU. por enviar mensajes de texto mientras conducen que por beber''.'
- id: 73
  category: safe_driving_rules
  question: Según el manual, ¿cuál es la principal causa de muerte de los adolescentes
    en EE. UU. al conducir?
  choices:
    A: Beber y conducir
    B: Enviar mensajes de texto mientras se conduce
    C: Exceso de velocidad
    D: Conducir de noche
  answer: B
  explanation: El manual establece que mueren más adolescentes en EE. UU. por enviar
    mensajes de texto mientras conducen que por beber.
- id: 74
  category: license_system
  question: ¿Cuál es el costo de la tarifa para reemplazar un permiso de aprendizaje
    o una licencia de conducir extraviados?
  choices:
    A: $15.00
    B: $24.00
    C: $36.00
    D: $62.00
  answer: B
  explanation: La tarifa por el reemplazo de un permiso de aprendizaje o licencia
    extraviado o corregido (por cambio de nombre o dirección) es de $24.00.
- id: 75
  category: license_system
  question: ¿Por cuánto tiempo es válida la foto de una licencia de conducir de Vermont?
  choices:
    A: 4 años
    B: 6 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: Según el manual, la foto de la licencia es válida por 8 años y se actualizará
    cada vez que realice una renovación en persona.
- id: 76
  category: license_system
  question: ¿Cuál es el estado de una licencia de conducir de Vermont que ha estado
    vencida por más de 14 días?
  choices:
    A: Es válida solo para conducir durante el día.
    B: Es válida por un período de gracia adicional de 30 días.
    C: No es una licencia válida y no puede conducir con ella.
    D: Es válida, pero debe pagar un recargo por retraso al renovarla.
  answer: C
  explanation: Una licencia de Vermont que ha vencido por más de 14 días no es una
    licencia válida y no puede conducir con ella.
- id: 77
  category: driver_responsibility
  question: ¿Cuántos días tiene para informar un cambio de nombre o dirección al Departamento
    de Vehículos Motorizados (DMV)?
  choices:
    A: 10 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Si ha cambiado su nombre o dirección, debe informar el cambio al Departamento
    de Vehículos Motorizados dentro de los 30 días.
- id: 78
  category: sharing_the_road
  question: Si conduce más lento que el resto del tráfico y los vehículos se están
    acumulando detrás de usted, ¿qué se le exige por ley que haga?
  choices:
    A: Aumentar la velocidad para igualar el flujo del tráfico.
    B: Encender las luces de emergencia y mantener su velocidad.
    C: Orillarse a un lado de la carretera cuando sea seguro hacerlo y permitir que
      los vehículos pasen.
    D: Hacer señas a los vehículos a su alrededor para que puedan pasar de forma segura.
  answer: C
  explanation: Si el tráfico se está acumulando detrás de usted porque conduce lentamente,
    la ley le exige que se orille a un lado de la carretera, cuando sea seguro hacerlo,
    y permita que los vehículos que le siguen pasen.
- id: 79
  category: vehicle_information
  question: ¿Cuál es la posición recomendada de las manos en el volante?
  choices:
    A: A las 10 y a las 2 (según las agujas del reloj)
    B: A las 9 y 3 o a las 8 y 4
    C: A las 11 y a la 1
    D: A las 7 y a las 5
  answer: B
  explanation: Si observa el volante como la esfera de un reloj, se recomienda una
    posición de 9 y 3 o de 8 y 4.
- id: 80
  category: safe_driving_rules
  question: ¿Cuál es el tiempo de reacción promedio de un conductor desde que ve el
    peligro hasta que aplica los frenos?
  choices:
    A: 1/4 de segundo
    B: 1/2 segundo
    C: 3/4 de segundo
    D: 1.5 segundos
  answer: C
  explanation: Después de ver el peligro, el conductor promedio tarda unos 3/4 de
    segundo en aplicar los frenos.
- id: 81
  category: safe_driving_rules
  question: ¿Cuál es la definición de 'distancia de frenado'?
  choices:
    A: La distancia recorrida desde que se ve el peligro hasta que se pisa el freno.
    B: La distancia que recorre su vehículo desde el momento en que se aplican los
      frenos hasta que se detiene.
    C: La distancia total desde que se ve un peligro hasta que se detiene por completo.
    D: La distancia mínima de seguridad para seguir a otro vehículo.
  answer: B
  explanation: La distancia que recorre su vehículo desde el momento en que se aplican
    los frenos hasta que el vehículo se detiene por completo se denomina distancia
    de frenado.
- id: 82
  category: safe_driving_rules
  question: Por ley, ¿cuál es la distancia mínima antes de un giro o cambio de carril
    en la que debe usar la luz direccional?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: La ley establece que un conductor debe usar la luz direccional no menos
    de 100 pies antes de realizar un giro o cambiar de carril.
- id: 83
  category: defensive_driving
  question: Al esperar para realizar un giro a la izquierda en una intersección, ¿cómo
    debe posicionar las ruedas de su vehículo?
  choices:
    A: Giradas ligeramente hacia la izquierda
    B: Giradas ligeramente hacia la derecha
    C: Mantener las ruedas rectas
    D: No importa, siempre y cuando esté completamente detenido
  answer: C
  explanation: Mantenga las ruedas rectas hasta que esté listo para girar; de esa
    manera, no será empujado hacia el tráfico en sentido contrario si lo golpean por
    detrás.
- id: 84
  category: safe_driving_rules
  question: Al prepararse para realizar un giro a la izquierda, ¿qué tan cerca de
    la línea central debe posicionar su vehículo si es seguro hacerlo?
  choices:
    A: A menos de un pie
    B: A menos de tres pies
    C: Directamente sobre la línea central
    D: Lo más a la derecha posible
  answer: A
  explanation: Cuando llegue a su giro, espere hasta que no haya vehículos en sentido
    contrario antes de girar. Posicione su vehículo a menos de un pie de la línea
    central, si es seguro hacerlo.
- id: 85
  category: safe_driving_rules
  question: Al acercarse a un giro a la derecha, ¿a qué distancia aproximada debe
    estar su vehículo del lado derecho de la carretera?
  choices:
    A: Un pie
    B: Tres pies
    C: Cinco pies
    D: Siete pies
  answer: B
  explanation: Al acercarse a un giro a la derecha, el vehículo debe estar a unos
    tres pies del lado derecho de la carretera.
- id: 86
  category: safe_driving_rules
  question: ¿Con cuántos segundos de antelación debe señalizar antes de realizar un
    giro o cambiar de carril para asegurarse de cumplir con el requisito de distancia
    legal?
  choices:
    A: De 1 a 2 segundos
    B: De 3 a 5 segundos
    C: De 6 a 8 segundos
    D: 10 segundos
  answer: B
  explanation: Señalizar de tres a cinco segundos antes de cualquiera de estas acciones
    cubre el requisito de señalizar no menos de 100 pies antes de realizar un giro
    o cambiar de carril.
- id: 87
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe señalizar antes de realizar un giro?
  choices:
    A: De 1 a 2 segundos
    B: De 3 a 5 segundos
    C: De 5 a 7 segundos
    D: 10 segundos
  answer: B
  explanation: El manual establece que debe señalizar de 3 a 5 segundos antes de un
    giro y comenzar a reducir la velocidad.
- id: 88
  category: defensive_driving
  question: En condiciones normales de conducción, ¿cuál es el método recomendado
    para mantener una distancia de seguimiento segura?
  choices:
    A: El método de los 2 segundos
    B: El método de los 3 segundos
    C: El método de los 4 segundos
    D: El método de la longitud de un automóvil por cada 10 mph
  answer: C
  explanation: El manual recomienda utilizar el método de los 4 segundos para asegurarse
    de tener suficiente espacio entre su vehículo y el vehículo que tiene delante.
- id: 89
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    en una autopista interestatal en Vermont?
  choices:
    A: 50 millas por hora
    B: 55 millas por hora
    C: 65 millas por hora
    D: 70 millas por hora
  answer: C
  explanation: La velocidad máxima para cualquier vehículo en una autopista interestatal
    en Vermont es de 65 millas por hora o según lo señalizado.
- id: 90
  category: safe_driving_rules
  question: Si dos vehículos llegan a una intersección con parada de cuatro vías aproximadamente
    al mismo tiempo desde diferentes direcciones, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El vehículo que viaja más rápido
    D: El vehículo que gira a la izquierda
  answer: B
  explanation: Cuando dos vehículos se acercan a una parada de cuatro vías aproximadamente
    al mismo tiempo, el conductor de la izquierda debe ceder el derecho de paso al
    conductor de la derecha.
- id: 91
  category: safe_driving_rules
  question: ¿Qué debe hacer si se está preparando para realizar un giro a la izquierda
    en una intersección?
  choices:
    A: Ceder el paso a todo el tráfico que viene en sentido contrario.
    B: Avanzar inmediatamente si tiene la luz verde.
    C: Tocar la bocina para advertir al tráfico que viene en sentido contrario.
    D: Ceder el paso solo a los vehículos que giran a la derecha.
  answer: A
  explanation: Si va a girar a la izquierda, debe ceder el paso a todo el tráfico
    que viene en sentido contrario. Cualquier vehículo que se acerque hacia usted
    tiene la prioridad de paso.
- id: 92
  category: safe_driving_rules
  question: Al estacionar en una carretera de 2 carriles, ¿a qué distancia deben estar
    las ruedas derechas del lado derecho de la carretera o del bordillo (curb)?
  choices:
    A: A menos de 6 pulgadas
    B: A menos de 12 pulgadas
    C: A menos de 18 pulgadas
    D: A menos de 24 pulgadas
  answer: B
  explanation: Un vehículo estacionado en una carretera de 2 carriles debe tener las
    ruedas derechas a una distancia máxima de 12 pulgadas del lado derecho de la carretera
    o del bordillo.
- id: 93
  category: safe_driving_rules
  question: ¿Es ilegal estacionar su vehículo a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 6 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: A
  explanation: El manual incluye 'A menos de 6 pies de un hidrante de incendios' en
    la sección de 'Dónde no se puede estacionar'.
- id: 94
  category: safe_driving_rules
  question: ¿A qué distancia del riel más cercano de un cruce de ferrocarril no se
    permite estacionar su vehículo?
  choices:
    A: 15 pies
    B: 25 pies
    C: 50 pies
    D: 100 pies
  answer: C
  explanation: No puede estacionar sobre ninguna vía férrea, ni a menos de 50 pies
    del riel más cercano de un cruce de ferrocarril.
- id: 95
  category: safe_driving_rules
  question: ¿En qué dirección circula el tráfico en una glorieta (roundabout)?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En línea recta
    D: En cualquier dirección que sea más corta hacia la salida
  answer: B
  explanation: Una glorieta es una característica de control de intersecciones donde
    el tráfico entra y sale solo mediante giros a la derecha y circula en sentido
    contrario a las agujas del reloj.
- id: 96
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a los cambios de carril mientras se conduce
    dentro de una glorieta de varios carriles?
  choices:
    A: Puede cambiar de carril si usa su señal de giro.
    B: Puede cambiar de carril solo para rebasar a un vehículo más lento.
    C: No puede cambiar de carril una vez que esté dentro de la glorieta.
    D: Debe cambiarse al carril derecho antes de salir.
  answer: C
  explanation: El manual establece explícitamente que los conductores no pueden cambiar
    de carril una vez que se encuentran dentro de la glorieta.
- id: 97
  category: sharing_the_road
  question: ¿Qué debe hacer si se aproxima un vehículo de emergencia mientras usted
    ya está conduciendo dentro de una glorieta?
  choices:
    A: Detenerse inmediatamente dentro de la glorieta.
    B: Detenerse en la isla interior de la glorieta.
    C: Acelerar para salir de la glorieta lo más rápido posible.
    D: Detenerse a un lado una vez que haya salido de la glorieta de manera segura.
  answer: D
  explanation: Si ya se encuentra en la glorieta, debe hacerse a un lado cuando haya
    salido de ella de forma segura para permitir el paso de los vehículos de emergencia.
- id: 98
  category: driver_responsibility
  question: Si la policía le detiene en una zona con poca iluminación, ¿qué debe hacer
    antes de que el oficial se acerque?
  choices:
    A: Apagar sus faros delanteros.
    B: Encender las luces interiores de su vehículo.
    C: Salir del vehículo con las manos en alto.
    D: Hacer destellos con las luces altas.
  answer: B
  explanation: Durante una parada policial en una zona con poca luz, debe encender
    las luces interiores del vehículo después de detenerse y antes de que el oficial
    se acerque.
- id: 99
  category: driver_responsibility
  question: Durante una parada de tráfico policial, ¿cuándo es apropiado desabrocharse
    el cinturón de seguridad?
  choices:
    A: Tan pronto como se detenga a un lado.
    B: Solo después de que el oficial lo haya visto usándolo.
    C: Cuando necesite alcanzar su registro en la guantera.
    D: Nunca debe desabrocharlo durante una parada de tráfico.
  answer: B
  explanation: El manual aconseja mantener el cinturón de seguridad abrochado hasta
    que el oficial lo haya visto puesto.
- id: 100
  category: safe_driving_rules
  question: Al estacionar en una carretera rural, ¿debe asegurarse de que su vehículo
    pueda verse desde al menos qué distancia en cualquier dirección?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: C
  explanation: Debe tener cuidado de no detenerse en una colina, curva o donde su
    vehículo no pueda ser visto desde al menos 150 pies en cualquier dirección.
- id: 101
  category: safe_driving_rules
  question: ¿Cuál es la regla básica para conducir en una carretera de varios carriles?
  choices:
    A: Conduzca por el carril central para obtener la máxima visibilidad.
    B: Conduzca por la derecha a menos que esté rebasando o girando.
    C: Conduzca por el carril izquierdo para evitar el tráfico que se incorpora.
    D: Zigzaguee entre carriles para mantener el límite de velocidad.
  answer: B
  explanation: La regla básica para conducir en una carretera de varios carriles es
    conducir por la derecha a menos que esté rebasando o girando.
- id: 102
  category: safe_driving_rules
  question: ¿Qué debe hacer si un vehículo de emergencia con luces azules o rojas
    intermitentes se aproxima desde cualquier dirección?
  choices:
    A: Acelere para apartarse del camino antes de que lo alcancen.
    B: Hágase a un lado a la derecha de la carretera y deténgase.
    C: Hágase a un lado a la izquierda de la carretera y reduzca la velocidad.
    D: Continúe a la misma velocidad pero muévase al carril derecho.
  answer: B
  explanation: De acuerdo con la Ley de Ceder el Paso (Move Over Law), si ve o escucha
    que se aproxima un vehículo con luces de señalización azules o rojas intermitentes,
    debe hacerse a un lado a la derecha de la carretera y detenerse.
- id: 103
  category: sharing_the_road
  question: Al acercarse a un vehículo policial detenido con luces azules intermitentes
    en una carretera de cuatro carriles, ¿qué exige la ley que haga si se puede realizar
    de forma segura?
  choices:
    A: Deténgase inmediatamente en su carril actual.
    B: Cambie de carril alejándose del vehículo detenido.
    C: Toque la bocina para alertar al oficial de su presencia.
    D: Acelere para pasar por la escena lo más rápido posible.
  answer: B
  explanation: El manual establece que si se encuentra en una carretera de cuatro
    carriles y se acerca a un vehículo policial detenido con luces azules intermitentes,
    la ley le exige que cambie de carril si puede hacerlo de manera segura.
- id: 104
  category: signs_and_signals
  question: ¿Cómo debe tratar una intersección si el semáforo está apagado debido
    a una falla de energía?
  choices:
    A: Trátela como una señal de ceder el paso.
    B: Continúe sin detenerse si el camino está despejado.
    C: Deténgase como si hubiera señales de alto (pare) en todas las direcciones.
    D: Espere hasta que llegue un oficial de policía para dirigir el tráfico.
  answer: C
  explanation: 'El manual indica: ''Si un semáforo está apagado, como en un corte
    de energía, deténgase como si hubiera señales de alto en todas las direcciones''.'
- id: 105
  category: signs_and_signals
  question: ¿Cuándo se le permite girar a la derecha con un semáforo en rojo circular?
  choices:
    A: En cualquier momento, sin detenerse, si la calle transversal está despejada.
    B: Solo después de detenerse por completo, observar el entorno y ceder el paso,
      a menos que una señal lo prohíba.
    C: Solo cuando también esté iluminada una flecha verde.
    D: Nunca se permiten los giros a la derecha en rojo.
  answer: B
  explanation: Los giros a la derecha en semáforos rojos circulares generalmente están
    permitidos, pero solo después de que el conductor se haya detenido por completo,
    haya observado la intersección y haya cedido el paso, siempre que no haya señales
    que lo prohíban.
- id: 106
  category: signs_and_signals
  question: ¿Qué significa una luz roja circular intermitente?
  choices:
    A: Significa lo mismo que una señal de ceder el paso.
    B: Advierte que la luz está a punto de cambiar a verde.
    C: Es como una señal de alto; debe detenerse y ceder el paso antes de continuar.
    D: Debe reducir la velocidad y continuar con precaución sin detenerse.
  answer: C
  explanation: 'El manual establece: ''La luz roja circular intermitente es como una
    señal de alto. Deténgase y continúe después de ceder el paso a todos los peatones,
    ciclistas y vehículos''.'
- id: 107
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor cuando se enfrenta a una flecha amarilla
    intermitente y tiene la intención de girar a la izquierda?
  choices:
    A: Gire inmediatamente porque el tráfico que viene en sentido contrario tiene
      luz roja.
    B: Deténgase y espere a una flecha verde fija.
    C: Ceda el paso al tráfico que viene en sentido contrario y a los peatones antes
      de girar, ya que el tráfico que viene en sentido contrario tiene luz verde.
    D: En su lugar, continúe recto a través de la intersección.
  answer: C
  explanation: Una flecha amarilla intermitente significa que los conductores pueden
    girar a la izquierda después de ceder el paso a todo el tráfico y peatones que
    vienen en sentido contrario, porque el tráfico que viene en sentido contrario
    tiene luz verde.
- id: 108
  category: signs_and_signals
  question: ¿Cuál es la forma de una señal de ceder el paso (Yield)?
  choices:
    A: Un octágono de 8 lados.
    B: Un círculo con una X grande.
    C: Un rombo (diamante).
    D: Un triángulo invertido.
  answer: D
  explanation: 'El manual establece explícitamente: ''Las señales de ceder el paso
    tienen la forma de un triángulo invertido...'''
- id: 109
  category: signs_and_signals
  question: ¿Qué indica una señal con forma de triángulo con las puntas cortadas?
  choices:
    A: Hay una zona escolar más adelante.
    B: El vehículo en el que se muestra viaja a velocidades lentas.
    C: Hay una señal de ceder el paso más adelante.
    D: Se está acercando a un cruce de ferrocarril.
  answer: B
  explanation: Una señal con forma de triángulo con las puntas cortadas se muestra
    en vehículos que viajan a velocidades lentas, como los vehículos agrícolas.
- id: 110
  category: signs_and_signals
  question: ¿Qué tipo de señal muestra los límites de velocidad y las leyes de giro
    para indicar lo que un conductor debe o no debe hacer?
  choices:
    A: Señales de advertencia.
    B: Señales reglamentarias.
    C: Señales de información.
    D: Señales de guía.
  answer: B
  explanation: Las señales reglamentarias son rectangulares con fondo blanco e indican
    las cosas que un conductor debe o no debe hacer, como los límites de velocidad
    y las leyes de giro.
- id: 111
  category: safe_driving_rules
  question: ¿Qué significa si hay una línea amarilla continua junto a una línea amarilla
    discontinua, y la línea discontinua está de su lado del carril?
  choices:
    A: Puede adelantar si el camino está despejado adelante.
    B: No se le permite adelantar bajo ninguna circunstancia.
    C: Solo los vehículos en el carril opuesto pueden adelantar.
    D: Se está aproximando a un carril continuo de giro a la izquierda en ambos sentidos.
  answer: A
  explanation: 'El manual establece: ''Si hay una línea continua pero una línea discontinua
    en su carril, puede adelantar si el camino está despejado adelante''.'
- id: 112
  category: safe_driving_rules
  question: ¿Cómo debe usar un conductor un carril continuo de giro a la izquierda
    en ambos sentidos?
  choices:
    A: Úselo como un carril de circulación normal para adelantar al tráfico más lento.
    B: Entre en el carril una corta distancia antes de realizar un giro a la izquierda.
    C: Estacione en el carril si no hay otros lugares disponibles.
    D: Úselo para realizar un giro a la derecha a través del tráfico.
  answer: B
  explanation: Los carriles continuos de giro a la izquierda en ambos sentidos no
    están diseñados para ser usados como carriles de circulación. Una corta distancia
    antes de su giro a la izquierda, debe señalizar y entrar con cuidado en el carril
    de giro.
- id: 113
  category: signs_and_signals
  question: ¿Cómo es una línea de ceda el paso pintada en la carretera?
  choices:
    A: Una línea blanca continua a través de toda la intersección.
    B: Dos líneas amarillas continuas dobles.
    C: Una serie de triángulos blancos que apuntan hacia los autos que se aproximan.
    D: Una X blanca grande pintada en el centro del carril.
  answer: C
  explanation: Una línea de ceda el paso pintada en la carretera es una serie de triángulos
    blancos, que apuntan hacia los autos que se aproximan, mostrando a los conductores
    dónde deben detenerse si se les requiere ceder el paso.
- id: 114
  category: safe_driving_rules
  question: Al girar desde una carretera hacia una carretera de varios carriles, ¿en
    qué carril debe entrar un conductor que gira a la derecha?
  choices:
    A: Cualquier carril que esté abierto en ese momento.
    B: El carril central.
    C: El carril izquierdo.
    D: El carril derecho.
  answer: D
  explanation: 'El manual especifica: ''Al conducir desde una carretera hacia una
    carretera de varios carriles donde hay una opción de carriles, los conductores
    que giran a la derecha deben girar hacia el carril derecho''.'
- id: 115
  category: safe_driving_rules
  question: Al realizar un giro en una carretera de varios carriles, ¿cuándo es legal
    cambiar de carril?
  choices:
    A: Mientras se encuentra en medio de la intersección.
    B: Inmediatamente antes de comenzar el giro.
    C: Después de que se haya completado el giro.
    D: Siempre que no haya tráfico en sentido contrario.
  answer: C
  explanation: 'El manual establece: ''Los cambios de carril pueden realizarse después
    de que se haya completado el giro. Evite cambiar de carril mientras gira''.'
- id: 116
  category: defensive_driving
  question: ¿Cuál es el tipo de choque más común que ocurre en las zonas de obras?
  choices:
    A: Colisiones frontales
    B: Choques por alcance (traseros)
    C: Raspaduras laterales (choques de costado)
    D: Volcamientos
  answer: B
  explanation: Según el manual, 'La mayoría de los choques en zonas de obras son choques
    por alcance causados por conducir demasiado rápido para las condiciones y no mantener
    una distancia de seguimiento segura'.
- id: 117
  category: safe_driving_rules
  question: ¿Qué distancia de seguimiento debe mantener al conducir a través de una
    zona de obras?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: C
  explanation: 'El manual aconseja a los conductores: ''Mantenga una distancia de
    seguimiento de 4 segundos'' en zonas de obras.'
- id: 118
  category: penalties_and_points
  question: ¿Cuál es la sanción por exceso de velocidad en una zona de obras en Vermont?
  choices:
    A: Su licencia es suspendida inmediatamente.
    B: Las multas se duplican.
    C: Recibe 5 puntos en su licencia.
    D: Debe asistir a una escuela de tráfico.
  answer: B
  explanation: 'El manual establece explícitamente: ''LAS MULTAS SE DUPLICAN POR EXCESO
    DE VELOCIDAD EN UNA ZONA DE OBRAS''.'
- id: 119
  category: signs_and_signals
  question: ¿De qué color y forma son las señales de zona de obras?
  choices:
    A: Amarillas y circulares
    B: Naranjas y con forma de diamante o rectangulares
    C: Rojas y octogonales
    D: Blancas y rectangulares
  answer: B
  explanation: 'El manual establece: ''Las señales de zona de obras son naranjas y
    con forma de diamante o rectangulares''.'
- id: 120
  category: signs_and_signals
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los banderilleros
    en una zona de obras?
  choices:
    A: Sus instrucciones son solo recomendaciones.
    B: Solo operan durante la construcción nocturna.
    C: Tienen la autoridad legal para controlar el tráfico y deben ser obedecidos.
    D: Puede ignorarlos si no ve a ningún trabajador de la construcción.
  answer: C
  explanation: 'El manual establece: ''Un banderillero tiene la autoridad legal para
    controlar el tráfico y debe ser obedecido''.'
- id: 121
  category: defensive_driving
  question: ¿Qué debe hacer si sus ruedas se salen del pavimento hacia un arcén (hombro)
    bajo?
  choices:
    A: Frenar bruscamente y girar con fuerza hacia el pavimento.
    B: Acelerar para volver a la carretera rápidamente.
    C: Reducir la velocidad sin frenar y volver al pavimento con cuidado a una velocidad
      lenta.
    D: Detenerse por completo en el arcén y esperar a una grúa.
  answer: C
  explanation: 'El manual indica: ''Si sus ruedas se salen del pavimento hacia un
    arcén bajo, reduzca la velocidad sin frenar y vuelva al pavimento con mucho cuidado
    a una velocidad lenta''.'
- id: 122
  category: safe_driving_rules
  question: Por ley, ¿a qué distancia del riel más cercano debe detenerse cuando se
    aproxima un tren?
  choices:
    A: No menos de 10 pies
    B: No menos de 15 pies
    C: No menos de 20 pies
    D: No menos de 50 pies
  answer: B
  explanation: Por ley, los conductores deben DETENERSE 'a no menos de 15 pies del
    riel más cercano' cuando las luces intermitentes, las barreras bajadas o un banderillero
    señalan la llegada de un tren.
- id: 123
  category: safe_driving_rules
  question: ¿Cuál de las siguientes acciones es ilegal en un cruce de ferrocarril?
  choices:
    A: Rebasar a otro vehículo en el cruce.
    B: Detenerse a 20 pies de distancia del riel más cercano.
    C: Cruzar las vías después de que haya pasado un tren y las barreras se levanten.
    D: Conducir a una velocidad reducida al acercarse al cruce.
  answer: A
  explanation: 'El manual establece: ''También es contra la ley rebasar a otro vehículo
    en un cruce de ferrocarril''.'
- id: 124
  category: sharing_the_road
  question: ¿Qué debe hacer si un vehículo delante de usted se detiene para ceder
    el paso a un peatón?
  choices:
    A: Tocar la bocina para advertir al peatón.
    B: Rebasar al vehículo detenido por la derecha.
    C: Rebasar al vehículo detenido por la izquierda si hay un carril abierto.
    D: No rebasar al vehículo detenido.
  answer: D
  explanation: 'El manual establece: ''Cuando un vehículo delante de usted se detiene
    para ceder el paso a un peatón, no rebase al vehículo detenido, incluso si hay
    dos carriles disponibles. Esta es una causa frecuente de muerte para los peatones''.'
- id: 125
  category: sharing_the_road
  question: ¿Cómo debe reaccionar si un peatón cruza la calle descuidadamente contra
    un semáforo en rojo?
  choices:
    A: Tocar la bocina y continuar sin detenerse.
    B: Virar bruscamente hacia el carril contrario para evitarlo.
    C: El conductor debe ceder el paso al peatón.
    D: Mantener su velocidad ya que usted tiene el derecho de paso.
  answer: C
  explanation: 'El manual establece: ''Incluso cuando los peatones cruzan la calle
    descuidadamente, el conductor debe ceder el paso''.'
- id: 126
  category: sharing_the_road
  question: ¿Cuál es el procedimiento adecuado cuando se encuentra con un peatón ciego
    con un bastón blanco esperando para cruzar la calle?
  choices:
    A: Tocar la bocina para que sepa que usted está allí.
    B: Detenerse y ceder el derecho de paso.
    C: Reducir la velocidad y rodearlo con cuidado.
    D: Gritar por la ventana para decirle que es seguro cruzar.
  answer: B
  explanation: 'El manual establece: ''Cuando un peatón que tiene un bastón blanco
    o es guiado por un perro guía está cruzando o esperando para cruzar la calle delante
    de usted, debe detenerse y ceder el derecho de paso''.'
- id: 127
  category: safe_driving_rules
  question: ¿Qué dice el manual sobre girar a la derecha con una flecha roja?
  choices:
    A: Puede girar a la derecha con una flecha roja después de detenerse por completo.
    B: Puede girar a la derecha con una flecha roja si no hay peatones presentes.
    C: NUNCA debe girar a la derecha con una flecha roja.
    D: Puede girar a la derecha con una flecha roja solo si una señal lo permite.
  answer: C
  explanation: 'El manual establece explícitamente: ''Recuerde: NO gire a la derecha
    con una flecha roja''.'
- id: 128
  category: sharing_the_road
  question: ¿Cuándo es probable que haya niños presentes en las escuelas?
  choices:
    A: Solo durante el horario escolar regular.
    B: Solo cuando el guardia de cruce está presente.
    C: Solo cuando las luces amarillas están parpadeando.
    D: Durante el horario escolar regular, después de la escuela y durante las actividades
      de fin de semana.
  answer: D
  explanation: 'El manual señala: ''Tenga en cuenta que el horario escolar regular
    no es el único momento en que hay niños presentes en las escuelas. A menudo se
    realizan actividades después de la escuela y los fines de semana en las escuelas''.'
- id: 129
  category: signs_and_signals
  question: ¿Qué significa cuando un panel de flecha intermitente en una zona de obras
    está en modo de 'precaución' con luces parpadeantes en las 4 esquinas?
  choices:
    A: La carretera está completamente cerrada más adelante.
    B: Los conductores deben acelerar para despejar la zona de obras rápidamente.
    C: Los conductores deben reducir la velocidad.
    D: Los conductores deben cambiar de carril inmediatamente.
  answer: C
  explanation: El manual establece que cuando los paneles están en modo de 'precaución'
    (línea recta o 4 esquinas), 'Los conductores deben reducir la velocidad cuando
    vean los paneles en modo de precaución'.
- id: 130
  category: sharing_the_road
  question: ¿Qué debe hacer si ya ha comenzado a cruzar la calle y la señal para peatones
    comienza a parpadear 'Don't Walk' (No cruce)?
  choices:
    A: Detenerse inmediatamente en medio de la calle.
    B: Correr de regreso a la acera de donde partió.
    C: Completar su cruce de manera segura.
    D: Wait in the crosswalk for the next 'Walk' signal.
  answer: C
  explanation: Según el manual, si ya ha comenzado a cruzar durante la señal de 'walk'
    (cruce), tendrá tiempo para completar su cruce de manera segura durante el parpadeo
    de 'Don't Walk' (no cruce).
- id: 131
  category: safe_driving_rules
  question: Si no hay aceras a lo largo de una calle o carretera, ¿por dónde deben
    caminar los peatones?
  choices:
    A: En el lado derecho de la carretera de espaldas al tráfico.
    B: Lo más lejos posible al lado izquierdo de la carretera de frente al tráfico
      que se aproxima.
    C: En el centro de la carretera.
    D: En el lado derecho de la carretera de frente al tráfico.
  answer: B
  explanation: El manual establece que a lo largo de calles o carreteras sin aceras,
    los peatones nunca deben caminar por el lado derecho de espaldas al tráfico, sino
    caminar por el lado izquierdo de frente al tráfico que se aproxima.
- id: 132
  category: sharing_the_road
  question: Cuando un autobús escolar está en la carretera y activa sus luces amarillas
    intermitentes alternas, ¿qué indica esto?
  choices:
    A: El autobús está averiado y necesita asistencia.
    B: El autobús está acelerando para incorporarse al tráfico.
    C: El autobús se está preparando para detenerse para recoger o dejar estudiantes.
    D: El autobús está señalizando para que otros vehículos lo adelanten.
  answer: C
  explanation: El manual explica que cuando un autobús escolar activa las luces amarillas
    intermitentes alternas y comienza a reducir la velocidad, está a punto de recoger
    o dejar estudiantes y usted debe prepararse para detenerse.
- id: 133
  category: safe_driving_rules
  question: ¿Bajo qué condición NO se requiere que usted se detenga ante un autobús
    escolar que tiene activadas sus luces rojas de advertencia?
  choices:
    A: Cuando está conduciendo en el patio de una escuela.
    B: Cuando viaja en la dirección opuesta en una carretera dividida.
    C: Cuando llega tarde al trabajo.
    D: Cuando el autobús está detenido en una intersección con luz verde.
  answer: B
  explanation: No tiene que detenerse en una carretera dividida si el autobús escolar
    viaja en la dirección opuesta, o si una barrera de concreto separa el tráfico
    del autobús.
- id: 134
  category: penalties_and_points
  question: ¿Cuál es la sanción en Vermont por adelantar a un autobús escolar detenido
    con sus luces de advertencia encendidas?
  choices:
    A: Una advertencia y reentrenamiento obligatorio para el conductor.
    B: Una multa sustancial y dos puntos en su licencia.
    C: Una multa sustancial y cinco puntos en su licencia de conducir.
    D: Suspensión inmediata de la licencia por 30 días.
  answer: C
  explanation: En Vermont, si se le encuentra culpable de adelantar a un autobús escolar
    detenido con sus luces de advertencia encendidas, estará sujeto a una multa sustancial
    y cinco puntos en su licencia de conducir.
- id: 135
  category: sharing_the_road
  question: ¿Cuánto espacio de adelantamiento debe dejar un conductor entre el lado
    derecho de su vehículo y un ciclista?
  choices:
    A: Al menos dos pies.
    B: Al menos tres pies.
    C: Al menos cuatro pies.
    D: Al menos seis pies.
  answer: C
  explanation: El manual requiere que los conductores dejen al menos cuatro pies de
    espacio de adelantamiento entre el lado derecho de su vehículo y un ciclista.
- id: 136
  category: sharing_the_road
  question: ¿Por qué un ciclista podría legalmente "tomar el carril" circulando hacia
    el centro del carril de circulación?
  choices:
    A: Para evitar que los vehículos motorizados los adelanten.
    B: Para evitar peligros en la calzada que no son visibles para los automovilistas.
    C: Para circular al lado de otros tres ciclistas.
    D: Para prepararse para un giro a la derecha en la siguiente intersección.
  answer: B
  explanation: Un ciclista puede circular hacia el centro del carril por razones tales
    como peligros en la calzada no visibles para los automovilistas, o para posicionarse
    correctamente en el carril de circulación adecuado.
- id: 137
  category: sharing_the_road
  question: ¿Se permite que dos ciclistas circulen uno al lado del otro en la carretera?
  choices:
    A: Sí, pueden circular legalmente uno al lado del otro siempre que no impidan
      el flujo normal del tráfico.
    B: Sí, pero solo en carriles para bicicletas designados.
    C: No, los ciclistas siempre deben circular en fila india.
    D: No, a menos que estén adelantando a un ciclista más lento.
  answer: A
  explanation: El manual establece que dos ciclistas pueden circular legalmente uno
    al lado del otro (en paralelo) siempre que no impidan el flujo normal y razonable
    del tráfico.
- id: 138
  category: defensive_driving
  question: ¿Cuál de los siguientes se menciona como un error común que causa colisiones
    de vehículos motorizados con bicicletas?
  choices:
    A: Detenerse demasiado rápido en una señal de pare.
    B: Abrir la puerta de un vehículo en la trayectoria de un ciclista.
    C: Tocar la bocina a un ciclista para advertirle de un peligro.
    D: Dejar más de cuatro pies de espacio al adelantar.
  answer: B
  explanation: Abrir la puerta de un vehículo en la trayectoria de un ciclista se
    menciona como uno de los cuatro errores comunes que podrían causar que un conductor
    golpee a un ciclista.
- id: 139
  category: sharing_the_road
  question: Cuando un ciclista va a realizar un giro a la izquierda, ¿cuál es la maniobra
    adecuada que debe hacer?
  choices:
    A: Señalizar y moverse al lado derecho del carril.
    B: Detenerse en medio de la intersección y esperar a que el tráfico se despeje.
    C: Señalizar y moverse al lado izquierdo del carril o al carril de giro.
    D: Bajarse y llevar la bicicleta caminando por el cruce peatonal.
  answer: C
  explanation: Cuando un ciclista realiza un giro a la izquierda, el ciclista debe
    señalizar y moverse al lado izquierdo del carril o al carril de giro.
- id: 140
  category: defensive_driving
  question: ¿Por qué debería dejar más de 4 segundos de distancia de seguimiento al
    conducir detrás de una motocicleta?
  choices:
    A: Porque las motocicletas son más pesadas y tardan más en detenerse.
    B: Porque los motociclistas a menudo reducen la velocidad bajando de marcha sin
      activar la luz de freno.
    C: Porque se requiere que las motocicletas circulen más lento que el resto del
      tráfico.
    D: Porque los motociclistas frecuentemente zigzaguean entre los carriles.
  answer: B
  explanation: Los motociclistas a menudo reducen la velocidad bajando de marcha o
    simplemente soltando el acelerador, por lo que no activan la luz de freno, razón
    por la cual los conductores deben dejar más de 4 segundos de distancia de seguimiento.
- id: 141
  category: vehicle_information
  question: ¿Qué debe tener en cuenta sobre las luces direccionales de una motocicleta?
  choices:
    A: Siempre se cancelan automáticamente.
    B: Por lo general, no se cancelan automáticamente, por lo que los conductores
      pueden olvidar apagarlas.
    C: La ley no las exige en las motocicletas.
    D: Parpadean en rojo en lugar de amarillo.
  answer: B
  explanation: Las luces direccionales de una motocicleta generalmente no se cancelan
    automáticamente, por lo que algunos conductores a veces olvidan apagarlas después
    de un giro o un cambio de carril.
- id: 142
  category: safe_driving_rules
  question: ¿Qué deben hacer los peatones al caminar al atardecer o por la noche?
  choices:
    A: Caminar por el lado derecho de la carretera con el tráfico.
    B: Usar ropa oscura para evitar distraer a los conductores.
    C: Usar ropa de colores claros o reflectante y llevar una luz.
    D: Caminar en el centro del carril donde las luces de la calle son más brillantes.
  answer: C
  explanation: Al caminar al atardecer o por la noche, los peatones deben usar ropa
    de colores claros o reflectante y llevar una luz o linterna.
- id: 143
  category: sharing_the_road
  question: ¿Cómo debe reaccionar un conductor al acercarse a un ciclista en la carretera?
  choices:
    A: Tocar la bocina repetidamente para avisar al ciclista que se está acercando.
    B: Acelerar para rebasar al ciclista lo más rápido posible.
    C: Estar atento, reducir la velocidad y darles suficiente espacio al rebasar.
    D: Seguir muy de cerca al ciclista hasta que se mueva al acotamiento.
  answer: C
  explanation: Como automovilista, cuando se acerque a un ciclista, debe estar atento,
    reducir la velocidad, darles suficiente espacio al rebasar y estar preparado para
    detenerse repentinamente.
- id: 144
  category: signs_and_signals
  question: ¿Qué significa cuando una señal de límite de velocidad tiene las palabras
    'cuando parpadee' (when flashing) o 'cuando haya niños presentes' (when children
    are present)?
  choices:
    A: El límite de velocidad solo se aplica durante el horario escolar regular.
    B: El límite de velocidad está vigente en esos momentos específicos, que pueden
      incluir actividades después de la escuela y de fin de semana.
    C: El límite de velocidad se aplica solo a los autobuses escolares.
    D: Los conductores deben detenerse y esperar a que los niños crucen antes de continuar.
  answer: B
  explanation: El manual señala que estas palabras le permiten saber cuándo está vigente
    el límite de velocidad, y que los niños están presentes no solo durante el horario
    escolar regular, sino también durante las actividades extracurriculares y de fin
    de semana.
- id: 145
  category: sharing_the_road
  question: ¿Por qué podría permanecer encendida la luz direccional de una motocicleta
    después de que el conductor haya completado un giro o un cambio de carril?
  choices:
    A: El conductor está legalmente obligado a señalizar durante 100 pies después
      de girar.
    B: Las luces direccionales de las motocicletas generalmente no se cancelan automáticamente.
    C: El sistema eléctrico de la motocicleta está funcionando mal.
    D: El conductor está señalizando un segundo giro de inmediato.
  answer: B
  explanation: Según el manual, las luces direccionales de las motocicletas generalmente
    no se cancelan automáticamente, por lo que los conductores a veces olvidan apagarlas
    después de un giro o un cambio de carril.
- id: 146
  category: sharing_the_road
  question: ¿Cómo afecta el tamaño pequeño de una motocicleta a la percepción que
    tiene un conductor de ella?
  choices:
    A: Hace que la motocicleta parezca más lenta y más cercana de lo que realmente
      está.
    B: Hace que la motocicleta parezca viajar exactamente a la misma velocidad que
      los autos circundantes.
    C: Hace que la motocicleta parezca más grande cuando se ve a través de un espejo
      retrovisor.
    D: Hace que la motocicleta parezca moverse más rápido y verse más lejos de lo
      que realmente está.
  answer: D
  explanation: Debido a su pequeño tamaño, una motocicleta parece moverse más rápido
    de lo que realmente lo hace y puede parecer que está más lejos de lo que realmente
    está.
- id: 147
  category: safe_driving_rules
  question: ¿Cuál es el margen de espacio mínimo recomendado que debe mantener al
    seguir a un motociclista?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: C
  explanation: El manual establece que se debe mantener un margen de espacio de al
    menos cuatro segundos al seguir a un motociclista.
- id: 148
  category: sharing_the_road
  question: 'Al rebasar una motocicleta en la carretera, usted debe:'
  choices:
    A: Compartir el carril con la motocicleta ya que es pequeña.
    B: Cambiar de carril por completo para rebasar.
    C: Tocar la bocina para avisarles que está rebasando en el mismo carril.
    D: Pasar lo más cerca posible para minimizar el tiempo que pasa en el carril contrario.
  answer: B
  explanation: Las motocicletas tienen derecho a un carril completo. Al rebasar una
    motocicleta, debe cambiar de carril por completo y nunca cerrarse demasiado pronto.
- id: 149
  category: defensive_driving
  question: Según el manual, ¿quién causa la mayoría de los choques fatales que involucran
    automóviles y camiones grandes?
  choices:
    A: El conductor del camión
    B: El conductor del otro vehículo
    C: Los peatones
    D: Las malas condiciones climáticas
  answer: B
  explanation: En más del 70% de los choques fatales que involucran automóviles y
    camiones, fue el conductor del otro vehículo, no el conductor del camión, quien
    causó el choque.
- id: 150
  category: sharing_the_road
  question: ¿Cuál es una buena regla general para determinar si está conduciendo en
    el punto ciego de un camión grande?
  choices:
    A: Si no puede ver la placa trasera del camión, el conductor no puede verlo a
      usted.
    B: Si no puede ver los espejos retrovisores laterales del camión, el conductor
      del camión no puede verlo a usted.
    C: Si se encuentra a menos de 50 pies de la parte trasera del camión, está en
      un punto ciego.
    D: Si puede ver el tubo de escape del camión, el conductor puede verlo a usted.
  answer: B
  explanation: El manual aconseja que si no puede ver los espejos retrovisores traseros
    (laterales) del camión, entonces el conductor del camión no puede verlo a usted.
- id: 151
  category: safe_driving_rules
  question: ¿Cuándo es seguro volver al carril derecho después de adelantar a un camión
    grande?
  choices:
    A: Tan pronto como el parachoques trasero de su vehículo pase la parte delantera
      del camión.
    B: Cuando el conductor del camión le haga señales con las luces delanteras.
    C: Cuando pueda ver la cabina del camión en su espejo retrovisor interior.
    D: Inmediatamente después de pasar los neumáticos delanteros del camión.
  answer: C
  explanation: Debe asegurarse de poder ver la cabina del camión en su espejo retrovisor
    interior antes de regresar al carril derecho.
- id: 152
  category: sharing_the_road
  question: ¿Por qué nunca debe meterse entre un camión grande y el bordillo a la
    derecha en una intersección?
  choices:
    A: El camión puede estar preparándose para abrirse hacia la izquierda para realizar
      un giro a la derecha.
    B: El conductor del camión acelerará rápidamente para bloquearlo.
    C: Es ilegal adelantar a cualquier vehículo por el lado derecho.
    D: El escape del camión se expulsa por el lado derecho y obstruirá su visión.
  answer: A
  explanation: Los conductores de camiones a menudo necesitan abrirse hacia la izquierda
    para poder realizar un giro a la derecha. Meterse entre el camión y el bordillo
    aumenta la posibilidad de un choque.
- id: 153
  category: signs_and_signals
  question: ¿Cómo se identifica oficialmente en la carretera a un vehículo de movimiento
    lento, como un tractor?
  choices:
    A: Por una luz amarilla intermitente en el techo.
    B: Por una señal blanca cuadrada con letras negras.
    C: Por una señal triangular naranja y roja montada en la parte trasera.
    D: Por una señal en forma de diamante roja y blanca en el parachoques.
  answer: C
  explanation: Un vehículo de movimiento lento se identifica por una señal triangular
    naranja y roja montada en la parte trasera del vehículo.
- id: 154
  category: defensive_driving
  question: ¿Cuál es la respuesta recomendada si un conductor agresivo se le cruza
    en el camino?
  choices:
    A: Toque la bocina para alertarlo de su error.
    B: Acelere para adelantarlo y recuperar su posición.
    C: Haga señales con sus luces delanteras para mostrar su frustración.
    D: Mantenga la calma, apártese de su camino y no lo desafíe.
  answer: D
  explanation: Si un conductor agresivo se le cruza, debe mantener la calma, apartarse
    del camino del conductor y no desafiarlo ni intentar desquitarse.
- id: 155
  category: sharing_the_road
  question: ¿Qué derechos tiene una persona que monta un animal o conduce un vehículo
    de tracción animal en una carretera pública?
  choices:
    A: Deben ceder el paso a todos los vehículos motorizados.
    B: Se les otorgan todos los derechos de un conductor de un vehículo motorizado.
    C: Solo se les permite usar el arcén (hombro) de la carretera.
    D: Tienen los mismos derechos que los peatones, pero no que los vehículos motorizados.
  answer: B
  explanation: Cuando se encuentra en una carretera pública, a una persona que monta
    un animal o conduce un vehículo de tracción animal se le otorgan todos los derechos
    de un conductor de un vehículo motorizado.
- id: 156
  category: sharing_the_road
  question: 'Al acercarse o adelantar a una persona que monta a caballo en la carretera,
    el operador de un vehículo motorizado NUNCA debe:'
  choices:
    A: Reducir su velocidad.
    B: Detener su vehículo por completo.
    C: Tocar la bocina o acelerar el motor.
    D: Usar todo el carril de tráfico para adelantar.
  answer: C
  explanation: El operador de un vehículo motorizado nunca debe tocar la bocina ni
    acelerar el motor para no asustar al animal al encontrarlo, seguirlo o adelantarlo.
- id: 157
  category: defensive_driving
  question: ¿Durante qué horas es más probable que haya alces y venados en las carreteras?
  choices:
    A: A media mañana y temprano en la tarde.
    B: A última hora de la tarde, durante la noche y temprano en la mañana.
    C: Solo durante las horas más oscuras, de medianoche a 3 AM.
    D: Durante las partes más calurosas de la tarde.
  answer: B
  explanation: Es más probable que la presencia de alces y venados en las carreteras
    ocurra durante las últimas horas de la tarde, la noche y las primeras horas de
    la mañana.
- id: 158
  category: vehicle_information
  question: ¿Cómo afecta el llevar a un pasajero al rendimiento de una motocicleta?
  choices:
    A: Mejora el equilibrio y la estabilidad de la motocicleta.
    B: Disminuye la distancia de frenado de la motocicleta.
    C: Aumenta la distancia de frenado y reduce la maniobrabilidad.
    D: No tiene ningún efecto en la maniobrabilidad de la motocicleta.
  answer: C
  explanation: 'Llevar a un pasajero complica la tarea del motociclista: el equilibrio
    es más difícil, la distancia de frenado aumenta y la maniobrabilidad se reduce.'
- id: 159
  category: defensive_driving
  question: ¿Bajo qué condiciones ocurren la mayoría de los choques que involucran
    automóviles y camiones grandes?
  choices:
    A: Por la noche en carreteras rurales sin iluminación.
    B: Durante fuertes tormentas de lluvia o nieve.
    C: A la luz del día en pavimento recto y seco bajo buenas condiciones climáticas.
    D: En carreteras de montaña sinuosas con poca visibilidad.
  answer: C
  explanation: La mayoría de los choques que involucran automóviles y camiones ocurren
    a la luz del día en pavimento recto y seco bajo buenas condiciones climáticas.
- id: 160
  category: safe_driving_rules
  question: ¿Durante qué horas es más probable que ocurra la presencia de alces y
    venados en las carreteras?
  choices:
    A: Al mediodía y temprano en la tarde.
    B: A última hora de la tarde, durante la noche y temprano en la mañana.
    C: Solo durante las horas más oscuras de la noche.
    D: A última hora de la mañana y al mediodía.
  answer: B
  explanation: 'El manual establece: ''Es más probable que la presencia de alces y
    venados en las carreteras ocurra durante las últimas horas de la tarde, la noche
    y las primeras horas de la mañana''.'
- id: 161
  category: defensive_driving
  question: ¿Por qué las colisiones con alces suelen ser más mortales para los automovilistas
    que las colisiones con ciervos?
  choices:
    A: Los alces viajan en manadas mucho más grandes que los ciervos.
    B: Los alces son más rápidos y embestirán a los vehículos.
    C: Los alces son más altos y pueden caer sobre el vehículo con una fuerza aplastante.
    D: Los alces se sienten atraídos por el sonido de las bocinas de los autos.
  answer: C
  explanation: Según el manual, los alces son mucho más altos que los ciervos y, en
    una colisión, pueden caer sobre el vehículo y sus ocupantes con una fuerza aplastante.
- id: 162
  category: safe_driving_rules
  question: ¿Cuál es la acción más segura a tomar si su vehículo se apaga en un área
    inundada?
  choices:
    A: Permanecer en el vehículo y esperar a que el agua baje.
    B: Abandonar el vehículo lo antes posible.
    C: Intentar arrancar el motor repetidamente hasta que funcione.
    D: Subir las ventanillas para que el vehículo flote.
  answer: B
  explanation: 'El manual aconseja: ''Si su vehículo se apaga en un área inundada,
    abandónelo lo antes posible. Las aguas de inundación pueden subir rápidamente
    y arrastrar un automóvil y a sus ocupantes''.'
- id: 163
  category: safe_driving_rules
  question: Al abandonar un vehículo en un área inundada, ¿cuál es la profundidad
    mínima de agua corriente que puede dificultar el caminar y ocultar peligros?
  choices:
    A: 2 pulgadas
    B: 4 pulgadas
    C: 8 pulgadas
    D: 12 pulgadas
  answer: B
  explanation: El manual advierte que se deben respetar las fuerzas del agua corriente,
    ya que 'tan solo 4 pulgadas de agua pueden dificultar el caminar y pueden ocultar
    peligros a la vista'.
- id: 164
  category: safe_driving_rules
  question: Por ley, ¿cuándo deben los conductores encender sus faros debido a la
    mala visibilidad?
  choices:
    A: Cuando no puedan ver claramente a personas o vehículos a 200 pies de distancia.
    B: Cuando no puedan ver claramente a personas o vehículos a 500 pies de distancia.
    C: Cuando no puedan ver claramente a personas o vehículos a 1000 pies de distancia.
    D: Solo cuando esté nevando o lloviendo activamente.
  answer: B
  explanation: La ley exige que los conductores enciendan los faros si no pueden ver
    claramente a personas o vehículos a 500 pies de distancia.
- id: 165
  category: safe_driving_rules
  question: ¿Qué áreas de la calzada es probable que se congelen primero cuando comienza
    a caer aguanieve, lluvia gélida o nieve?
  choices:
    A: Intersecciones y pasos de peatones
    B: Túneles y pasos subterráneos
    C: Puentes, rampas y pasos elevados
    D: Caminos de tierra y grava
  answer: C
  explanation: El manual establece que cuando comienza a caer aguanieve, lluvia gélida
    o nieve, 'es probable que los puentes, las rampas y los pasos elevados se congelen
    primero'.
- id: 166
  category: safe_driving_rules
  question: ¿Cuál debe ser su distancia de seguimiento al conducir en condiciones
    invernales o tormentas?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: Exactamente 4 segundos
    D: Más de 4 segundos
  answer: D
  explanation: En condiciones de conducción peligrosas y clima invernal, el manual
    instruye a los conductores a 'mantener más de cuatro segundos de espacio entre
    usted y el vehículo motorizado que tiene delante'.
- id: 167
  category: vehicle_information
  question: ¿Cuál de las siguientes es una regla para el uso de neumáticos para nieve
    en su vehículo?
  choices:
    A: Solo debe poner neumáticos para nieve en las ruedas delanteras.
    B: Solo debe poner neumáticos para nieve en las ruedas traseras.
    C: Nunca combine diferentes tipos de neumáticos en el mismo vehículo.
    D: Los neumáticos para nieve deben estar ligeramente desinflados para una mejor
      tracción.
  answer: C
  explanation: El manual aconseja asegurarse de tener buenos neumáticos para nieve
    en las cuatro ruedas y 'nunca combinar diferentes tipos de neumáticos en el mismo
    vehículo'.
- id: 168
  category: safe_driving_rules
  question: Si queda atrapado en una tormenta de nieve, ¿con qué frecuencia debe encender
    el motor y la calefacción para mantenerse caliente?
  choices:
    A: Continuamente hasta que se quede sin gasolina.
    B: Aproximadamente 10 minutos cada hora.
    C: Aproximadamente 30 minutos cada hora.
    D: Solo una vez cada tres horas.
  answer: B
  explanation: Si queda atrapado en una tormenta de nieve o varado, debe 'encender
    el motor y la calefacción unos 10 minutos cada hora para mantenerse caliente'.
- id: 169
  category: safe_driving_rules
  question: ¿Por qué es importante mantener el tubo de escape libre de nieve si mantiene
    el motor encendido mientras está atrapado en una tormenta de nieve?
  choices:
    A: Para evitar que el motor se sobrecaliente.
    B: Para evitar que la batería se agote.
    C: Para ayudar a protegerse de una posible intoxicación por monóxido de carbono.
    D: Para asegurar que la calefacción sople aire caliente.
  answer: C
  explanation: 'El manual establece: ''Para ayudar a protegerse de una posible intoxicación
    por monóxido de carbono, mantenga el tubo de escape libre de nieve''.'
- id: 170
  category: alcohol_drugs_health
  question: ¿Qué debe evitar beber si se encuentra atrapado en un vehículo durante
    un frío extremo?
  choices:
    A: Agua
    B: Jugo de frutas
    C: Nieve derretida
    D: Alcohol
  answer: D
  explanation: 'El manual aconseja: ''Beba líquidos para evitar la deshidratación.
    Sin embargo, no beba alcohol''.'
- id: 171
  category: defensive_driving
  question: ¿Cuál es la causa más común de que un vehículo patine?
  choices:
    A: Neumáticos desgastados
    B: La falta de reacción del conductor a tiempo para ajustar la velocidad a las
      condiciones de la carretera y del tráfico.
    C: Mal funcionamiento de los frenos antibloqueo.
    D: Conducir un vehículo de tracción trasera.
  answer: B
  explanation: Según el manual, 'La mayoría de los derrapes son causados por la falta
    de reacción del conductor a tiempo para ajustar la velocidad del vehículo a las
    condiciones de la carretera y del tráfico'.
- id: 172
  category: defensive_driving
  question: ¿Cuál es la mejor manera de recuperarse de un derrape?
  choices:
    A: Pisar los frenos a fondo y mantener el volante recto.
    B: Bombear los frenos rápidamente y girar el volante en la dirección opuesta al
      derrape.
    C: No pise los frenos y gire el volante en la dirección en la que desea que vaya
      el vehículo.
    D: Acelerar ligeramente para recuperar la tracción.
  answer: C
  explanation: 'Para controlar un vehículo en un derrape, el manual indica: ''No pise
    los frenos, solo empeorará el derrape. Gire el volante en la dirección en la que
    desea que vaya el vehículo''.'
- id: 173
  category: vehicle_information
  question: Si su vehículo está equipado con frenos antibloqueo (ABS), ¿cómo debe
    frenar en una carretera resbaladiza?
  choices:
    A: Bombear los frenos rápidamente.
    B: Use una presión de frenado constante y no bombee los frenos.
    C: Presionar ligeramente los frenos varias veces.
    D: Aplicar el freno de emergencia mientras gira el volante.
  answer: B
  explanation: 'El manual establece: ''Si su vehículo está equipado con frenos antibloqueo,
    use una presión de frenado constante, ¡no bombee los frenos!''.'
- id: 174
  category: safe_driving_rules
  question: ¿Qué función del vehículo NO debe usar al conducir en condiciones peligrosas
    como nieve, hielo o lluvia intensa?
  choices:
    A: Luces bajas
    B: Desempañador del parabrisas
    C: Control de crucero (cruise control)
    D: Limpiaparabrisas
  answer: C
  explanation: 'Al tratar sobre condiciones de conducción peligrosas y derrapes, el
    manual establece explícitamente: ''No use el control de crucero''.'
- id: 175
  category: vehicle_information
  question: ¿Qué NO debe hacer al frenar con un sistema de frenos antibloqueo (ABS)?
  choices:
    A: Girar el volante mientras frena
    B: Bombear el pedal del freno
    C: Esperar ruido y vibración
    D: Mantener el pie firmemente en el pedal
  answer: B
  explanation: 'El manual establece: ''No bombee el freno ni quite el pie del pedal
    del freno porque esto desactivará el sistema antibloqueo''.'
- id: 176
  category: vehicle_information
  question: ¿Qué significa si la luz de advertencia del ABS de su vehículo permanece
    encendida después de comenzar a conducir?
  choices:
    A: Su vehículo no tiene ninguna capacidad de frenado.
    B: El sistema ABS funciona perfectamente.
    C: El sistema ABS no funciona, pero el vehículo todavía tiene frenos normales.
    D: El freno de estacionamiento está puesto.
  answer: C
  explanation: Según el manual, 'Si la luz del ABS permanece encendida después de
    comenzar a conducir, el sistema ABS de su vehículo no está funcionando. Sin embargo,
    el vehículo todavía tiene frenos'.
- id: 177
  category: safe_driving_rules
  question: Según los estudios, conducir con las luces bajas encendidas durante el
    día reduce el riesgo de colisiones frontales en más de ¿qué porcentaje?
  choices:
    A: 10%
    B: 20%
    C: 30%
    D: 50%
  answer: B
  explanation: Los estudios han demostrado que conducir con las luces bajas encendidas
    durante el día reduce el riesgo de colisiones frontales en más del 20%.
- id: 178
  category: safe_driving_rules
  question: ¿Cuándo exige la ley que se enciendan los faros del vehículo?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Media hora después del atardecer hasta media hora antes del amanecer
    C: Una hora después del atardecer hasta una hora antes del amanecer
    D: Solo cuando la visibilidad es inferior a 500 pies
  answer: B
  explanation: La ley exige que los faros de los vehículos se enciendan media hora
    después del atardecer hasta media hora antes del amanecer.
- id: 179
  category: defensive_driving
  question: ¿Hacia dónde debe mirar para evitar quedar temporalmente cegado por los
    faros de un vehículo que viene en sentido contrario?
  choices:
    A: Directamente a los faros que se aproximan
    B: A la línea central de la carretera
    C: Hacia el borde derecho de la carretera
    D: A su espejo retrovisor
  answer: C
  explanation: Para evitar quedar cegado temporalmente, debe mirar hacia adelante,
    hacia el borde derecho de la carretera, hasta que las luces brillantes hayan pasado
    y su visión haya vuelto a la normalidad.
- id: 180
  category: safe_driving_rules
  question: Al entrar en una autopista interestatal desde una rampa de entrada, ¿quién
    tiene el derecho de paso?
  choices:
    A: El conductor que entra
    B: Los conductores que ya están en la interestatal
    C: Cualquier vehículo que viaje más rápido
    D: Solo camiones comerciales
  answer: B
  explanation: El manual establece que el conductor que entra debe ceder el paso a
    los conductores que ya están en la interestatal.
- id: 181
  category: safe_driving_rules
  question: ¿Qué debe hacer si debe detenerse por una emergencia en la autopista interestatal?
  choices:
    A: Detenerse en el carril de tráfico derecho y encender las luces de emergencia.
    B: Moverse al carril de emergencia (breakdown lane), levantar el capó, amarrar
      un paño blanco al vehículo y permanecer adentro.
    C: Detenerse en la mediana y pararse fuera de su vehículo para pedir ayuda con
      señas.
    D: Usar el retorno de emergencia para regresar a la salida más cercana.
  answer: B
  explanation: Si debe detenerse por una emergencia, muévase al carril de emergencia
    y lo más a la derecha posible. Levante el capó de su vehículo, amarre un paño
    blanco al vehículo y permanezca en su vehículo.
- id: 182
  category: safe_driving_rules
  question: ¿Cuál es la acción correcta a tomar si se pasa de su rampa de salida en
    la autopista interestatal?
  choices:
    A: Detenerse y retroceder con cuidado por el arcén.
    B: Usar el cruce de retorno de emergencia.
    C: Continuar hasta la siguiente salida.
    D: Reducir la velocidad y dar una vuelta en U en la mediana.
  answer: C
  explanation: Si se pasa de su rampa de salida, nunca se detenga ni retroceda, y
    nunca use el retorno de emergencia. Continúe hasta la siguiente salida.
- id: 183
  category: sharing_the_road
  question: Si se aproxima a un vehículo de emergencia con luces intermitentes a un
    lado de la carretera y no puede cambiar de carril de forma segura para alejarse
    de él, ¿qué debe hacer?
  choices:
    A: Mantener su velocidad y tocar la bocina.
    B: Detenerse por completo hasta que el vehículo de emergencia se retire.
    C: Reducir la velocidad a 20 mph por debajo del límite de velocidad.
    D: Aumentar la velocidad para rebasar el vehículo lo más rápido posible.
  answer: C
  explanation: Si no puede cambiar de carril para alejarse del vehículo de emergencia,
    la ley establece que debe reducir la velocidad a 20 mph por debajo del límite
    de velocidad para pasar junto a los vehículos detenidos.
- id: 184
  category: signs_and_signals
  question: ¿Qué indica si el borde de la carretera dividida a su derecha está pintado
    de amarillo?
  choices:
    A: Se está aproximando a una zona de construcción.
    B: Va en SENTIDO CONTRARIO (WRONG WAY).
    C: Se encuentra en una zona de adelantamiento.
    D: El carril terminará pronto.
  answer: B
  explanation: Si el borde de la carretera a su derecha está pintado de amarillo,
    va en SENTIDO CONTRARIO en una carretera dividida o interestatal. En una carretera
    dividida, la línea a su derecha debe ser blanca.
- id: 185
  category: sharing_the_road
  question: Al rebasar un vehículo o una bicicleta, ¿cuál es el espacio mínimo de
    separación que debe dejar entre su vehículo y el que está rebasando?
  choices:
    A: Dos pies
    B: Tres pies
    C: Cuatro pies
    D: Seis pies
  answer: C
  explanation: El manual instruye a los conductores a dejar al menos cuatro pies de
    separación entre su vehículo y cualquier vehículo o bicicleta que esté rebasando.
- id: 186
  category: safe_driving_rules
  question: ¿Cuándo es seguro regresar al lado derecho de la carretera después de
    rebasar a otro vehículo?
  choices:
    A: Cuando esté en paralelo con el otro vehículo
    B: Cuando pueda ver toda la parte delantera del vehículo rebasado en su espejo
      retrovisor interior
    C: Tan pronto como active su luz direccional derecha
    D: Cuando el vehículo rebasado haga cambio de luces altas
  answer: B
  explanation: Debe avanzar lo suficientemente lejos del vehículo motorizado o bicicleta
    que está rebasando para poder ver toda la parte delantera del vehículo o al ciclista
    en su espejo retrovisor interior antes de regresar al lado derecho.
- id: 187
  category: safe_driving_rules
  question: ¿Bajo qué condición se permite rebasar a un vehículo por la derecha en
    una carretera que NO es de varios carriles?
  choices:
    A: Cuando el vehículo de adelante circula por debajo del límite de velocidad
    B: Cuando el vehículo de adelante está girando o preparándose para girar a la
      izquierda, si hay espacio para pasar de forma segura
    C: Cuando puede conducir de forma segura fuera del pavimento para rodearlos
    D: Nunca se permite rebasar por la derecha en una carretera de dos carriles
  answer: B
  explanation: En carreteras que no son de varios carriles, un conductor puede rebasar
    por la derecha a un vehículo o bicicleta que esté girando o preparándose para
    girar a la izquierda, si hay espacio para pasar de forma segura.
- id: 188
  category: defensive_driving
  question: ¿En cuál de las siguientes condiciones NUNCA debe usar el control de crucero
    (cruise control)?
  choices:
    A: En un día despejado y soleado
    B: En una autopista interestatal recta y seca
    C: Con lluvia, niebla, nieve o hielo
    D: Al conducir largas distancias
  answer: C
  explanation: 'El manual establece explícitamente: "Nunca use el control de crucero
    en condiciones de conducción como lluvia, niebla, nieve, hielo, etc."'
- id: 189
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes puede afectar seriamente su capacidad para conducir
    de manera segura y causar una disminución de sus facultades (impairment)?
  choices:
    A: Solo el alcohol
    B: Solo las drogas ilegales
    C: Alcohol, medicamentos recetados, medicamentos de venta libre y somnolencia
    D: Solo las sustancias que requieren receta médica
  answer: C
  explanation: El manual señala que beber no es la única forma en que un conductor
    puede ver disminuidas sus facultades. Las drogas, incluso los medicamentos recetados
    y de venta libre, así como conducir con sueño, pueden afectar seriamente su capacidad
    para conducir de manera segura.
- id: 190
  category: alcohol_drugs_health
  question: ¿Cuál es el límite de concentración de alcohol en sangre (BAC) al cual
    un conductor se considera legalmente 'bajo la influencia' o 'con facultades disminuidas'
    en Vermont?
  choices:
    A: '.05'
    B: '.08'
    C: '.10'
    D: '.02'
  answer: B
  explanation: La ley de Vermont establece que cuando la concentración de alcohol
    en sangre (BAC) de una persona es de .08 o superior, se considera que está 'bajo
    la influencia' o 'con facultades disminuidas'.
- id: 191
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción para una persona menor de 21 años que opera un vehículo
    con una concentración de alcohol de .02 o más?
  choices:
    A: Recibirán una advertencia y una comparecencia obligatoria ante el tribunal.
    B: Su vehículo será confiscado por 30 días.
    C: Reciben una infracción de tráfico civil, la suspensión de la licencia y deben
      completar un programa de educación sobre el alcohol.
    D: Deben volver a realizar el examen de conducir de inmediato.
  answer: C
  explanation: Las personas menores de 21 años que operan un vehículo con una concentración
    de alcohol de .02 o más pueden recibir una infracción de tráfico civil. La licencia
    de conducir será suspendida y el conductor debe completar un programa de educación
    sobre el alcohol y la conducción por su propia cuenta.
- id: 192
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma efectiva de reducir los efectos
    del alcohol en su cuerpo?
  choices:
    A: Beber café solo (negro)
    B: Tomar una ducha fría
    C: Hacer ejercicio vigorosamente
    D: El tiempo
  answer: D
  explanation: El tiempo es la única forma de reducir los efectos del alcohol. Beber
    café, ducharse, hacer ejercicio, etc., no pueden reducir su BAC (concentración
    de alcohol en sangre) ni los efectos del alcohol.
- id: 193
  category: alcohol_drugs_health
  question: ¿Cómo afecta el alcohol sus sentimientos y sentidos al conducir?
  choices:
    A: Aumenta su sentido de la velocidad.
    B: Suprime sus sentimientos, por lo que es posible que no se dé cuenta de que
      está excediendo el límite de velocidad.
    C: Mejora su tiempo de reacción ante peligros repentinos.
    D: Lo hace más consciente de los riesgos que está tomando.
  answer: B
  explanation: El alcohol suprime sus sentimientos; usted no siente la velocidad,
    por lo que no se dará cuenta de que podría estar excediendo el límite de velocidad.
- id: 194
  category: penalties_and_points
  question: Bajo la Ley de "Consentimiento Implícito" (Implied Consent) de Vermont,
    ¿cuál es la sanción por negarse a realizar una prueba para determinar la cantidad
    de alcohol o drogas en su cuerpo?
  choices:
    A: Una multa obligatoria de $500
    B: Pérdida de su licencia de conducir por al menos seis meses
    C: Una sentencia de cárcel inmediata de 30 días
    D: Cinco puntos añadidos a su historial de conducción
  answer: B
  explanation: Si un oficial de policía le pide a un conductor que se realice la prueba
    y el conductor se niega, perderá su licencia de conducir por al menos seis (6)
    meses bajo la Ley de Consentimiento Implícito.
- id: 195
  category: penalties_and_points
  question: ¿Qué afirmación es verdadera con respecto a la suspensión de la licencia
    por DUI en Vermont?
  choices:
    A: Solo puede perder su licencia después de una condena penal por DUI.
    B: Puede perder su licencia a través de un proceso civil antes de una condena
      penal por DUI.
    C: Su licencia solo se suspende si causa un accidente de tráfico.
    D: A los infractores por primera vez no se les puede suspender la licencia.
  answer: B
  explanation: Vermont tiene un proceso de suspensión administrativa, lo que significa
    que puede perder su licencia a través de un proceso civil antes de una condena
    penal por DUI.
- id: 196
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un signo común de conducción con somnolencia?
  choices:
    A: Revisar sus espejos con frecuencia
    B: Recordar claramente las últimas millas que condujo
    C: Salirse del carril de circulación
    D: Conducir ligeramente por debajo del límite de velocidad
  answer: C
  explanation: 'Algunos signos de conducción con somnolencia son: tener problemas
    para concentrarse, bostezar repetidamente, no recordar las últimas millas que
    condujo, salirse del carril de circulación y no ver las señales de tráfico.'
- id: 197
  category: safe_driving_rules
  question: ¿Qué debe hacer si siente somnolencia mientras está en la carretera?
  choices:
    A: Abrir la ventana para que entre aire fresco.
    B: Subir el volumen de la radio.
    C: Beber una bebida con cafeína y seguir conduciendo.
    D: Buscar un lugar seguro para orillarse y detenerse.
  answer: D
  explanation: Si siente somnolencia mientras está en la carretera, busque un lugar
    seguro para orillarse y detenerse. Abrir la ventana y subir el volumen de la radio
    no lo mantendrá despierto.
- id: 198
  category: sharing_the_road
  question: ¿Cuáles son las acciones de los conductores que más contribuyen a los
    accidentes de vehículos motorizados con peatones y ciclistas en Vermont?
  choices:
    A: Exceso de velocidad y seguir de cerca al vehículo de adelante (tailgating)
    B: Falta de atención y no ceder el paso
    C: Conducir ebrio y pasarse los semáforos en rojo
    D: Conducir sin faros y rebasar de manera inadecuada
  answer: B
  explanation: La falta de atención y no ceder el paso son las acciones de los conductores
    que más contribuyen a los accidentes de vehículos motorizados con peatones y ciclistas
    en Vermont.
- id: 199
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una estrategia recomendada para lidiar con
    las distracciones al conducir?
  choices:
    A: Realizar su aseo personal en el vehículo mientras está detenido en los semáforos
      en rojo.
    B: Mantener a las mascotas en su regazo para que se queden tranquilas.
    C: Preprogramar sus estaciones de radio favoritas para un fácil acceso.
    D: Trazar su destino en su teléfono mientras conduce.
  answer: C
  explanation: Para lidiar con las distracciones, debe preprogramar sus estaciones
    de radio favoritas para un fácil acceso. El aseo personal debe hacerse en casa,
    las mascotas deben estar en un transportador y los destinos deben trazarse con
    anticipación.
- id: 200
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción por usar un dispositivo electrónico
    portátil mientras se opera un vehículo motorizado en una carretera pública en
    Vermont?
  choices:
    A: No menos de $50 y no más de $100
    B: No menos de $100 y no más de $200
    C: No menos de $250 y no más de $500
    D: No menos de $500 y no más de $1000
  answer: B
  explanation: Una persona que viole esta ley estará sujeta a una multa de no menos
    de $100.00 y no más de $200.00 por una primera infracción.
- id: 201
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a su historial de conducción por una primera
    condena por usar un dispositivo electrónico portátil en una zona de obras debidamente
    designada con personal presente?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: B
  explanation: Una persona condenada por violar esta sección mientras opera dentro
    de una zona de obras debidamente designada en la que haya personal de construcción,
    mantenimiento o servicios públicos presentes, recibirá dos puntos en su historial
    de conducción por una primera condena.
- id: 202
  category: signs_and_signals
  question: ¿Qué indica una señal instalada por la Asociación de Enfermeros de Emergencias
    de Vermont (ENCARE)?
  choices:
    A: Una sala de emergencias de un hospital está cerca.
    B: Un área designada de parada segura para conductores somnolientos.
    C: Alguien murió en ese lugar debido a un conductor ebrio.
    D: Un punto de control policial para pruebas de DUI (conducir bajo la influencia)
      está más adelante.
  answer: C
  explanation: La Asociación de Enfermeros de Emergencias de Vermont (ENCARE) patrocina
    la instalación de señales en el lugar de choques fatales relacionados con el alcohol.
    Cuando vea una de estas señales, significa que alguien murió en ese lugar debido
    a un conductor ebrio.
- id: 203
  category: safe_driving_rules
  question: Si está excesivamente preocupado, emocionado, asustado, enojado o deprimido,
    ¿cuál es una estrategia recomendada antes de conducir?
  choices:
    A: Conducir más rápido para llegar antes a su destino.
    B: Escuchar música a todo volumen para distraerse.
    C: Darse tiempo para calmarse y tranquilizarse dando un paseo.
    D: Beber una taza de café para mejorar su concentración.
  answer: C
  explanation: Las emociones afectan la conducción segura. Es posible que no pueda
    conducir bien si está excesivamente preocupado, emocionado, asustado, enojado
    o deprimido. Dese tiempo para calmarse y tranquilizarse. Dar un paseo es una buena
    manera de hacerlo.
- id: 204
  category: safe_driving_rules
  question: ¿Es legal usar un dispositivo electrónico portátil mientras su vehículo
    está detenido en una carretera pública en Vermont?
  choices:
    A: Sí, siempre que el vehículo no esté en movimiento.
    B: Sí, pero solo para enviar mensajes de texto.
    C: No, es contra la ley incluso mientras el vehículo está detenido.
    D: No, a menos que esté consultando una aplicación de GPS.
  answer: C
  explanation: Es contra la ley que los conductores usen un dispositivo electrónico
    portátil mientras operan un vehículo motorizado en una carretera pública en Vermont,
    incluyendo cuando el vehículo está detenido.
- id: 205
  category: safe_driving_rules
  question: ¿Qué debe hacer con su teléfono celular mientras conduce para evitar que
    se convierta en un peligro en un choque?
  choices:
    A: Mantenerlo en su regazo
    B: Asegurarlo en el vehículo
    C: Colocarlo en el asiento del pasajero
    D: Sostenerlo con la mano que no usa para el volante
  answer: B
  explanation: Debe asegurar su teléfono en el vehículo para que no se convierta en
    un proyectil en caso de choque.
- id: 206
  category: safe_driving_rules
  question: Al prepararse para salir de una posición estacionada en el lado derecho
    de una colina, ¿qué señal direccional debe usar antes de incorporarse al tráfico?
  choices:
    A: Señal derecha
    B: Señal izquierda
    C: Luces de emergencia (intermitentes de cuatro vías)
    D: No se necesita señal
  answer: B
  explanation: Antes de subir la colina desde una parada en el lado derecho de la
    carretera, debe poner el vehículo en marcha y señalizar a la izquierda para indicar
    a los demás lo que está haciendo.
- id: 207
  category: defensive_driving
  question: Al conducir cuesta abajo, ¿qué acción debe evitar?
  choices:
    A: Usar los frenos ligeramente
    B: Cambiar a una marcha más baja
    C: Bajar por inercia (coasting) con la palanca de cambios en punto muerto
    D: Mantener ambas manos en el volante
  answer: C
  explanation: Al conducir cuesta abajo, no debe bajar por inercia con el embrague
    presionado a fondo o con la palanca de cambios en punto muerto.
- id: 208
  category: safe_driving_rules
  question: Al realizar un giro en U usando una calle lateral a su derecha, ¿a qué
    distancia del bordillo o borde de la carretera debe detenerse antes de retroceder?
  choices:
    A: Aproximadamente 6 pulgadas
    B: Aproximadamente 12 pulgadas
    C: Aproximadamente 18 pulgadas
    D: Aproximadamente 24 pulgadas
  answer: C
  explanation: Al dar la vuelta usando una calle lateral, debe pasar justo después
    de la calle y detenerse a unas 18 pulgadas del bordillo o borde de la carretera
    antes de retroceder.
- id: 209
  category: defensive_driving
  question: Según el manual, ¿cuál es la opción más segura para dar la vuelta con
    su vehículo?
  choices:
    A: Hacer un giro en U en medio de la calle
    B: Retroceder a través de una intersección
    C: Hacer un giro de tres puntos en una carretera concurrida
    D: Dar la vuelta a la manzana o usar un estacionamiento
  answer: D
  explanation: Hay varias opciones para dar la vuelta con su vehículo, pero dar la
    vuelta a la manzana o usar un estacionamiento es la opción más segura.
- id: 210
  category: safe_driving_rules
  question: Al acercarse a un espacio de estacionamiento en paralelo, ¿a qué distancia
    debe detenerse junto al vehículo delantero?
  choices:
    A: De uno a dos pies
    B: De dos a tres pies
    C: De tres a cuatro pies
    D: De cuatro a cinco pies
  answer: B
  explanation: Al acercarse al espacio de estacionamiento, revise su espejo retrovisor,
    señalice a la derecha y deténgase junto al vehículo delantero, a una distancia
    de dos a tres pies.
- id: 211
  category: driver_responsibility
  question: ¿Qué es lo primero que debe hacer si se ve involucrado en un choque y
    no hay lesiones graves?
  choices:
    A: Esperar a la policía en medio de la carretera
    B: Mover los vehículos involucrados fuera de los carriles de circulación y hacia
      el acotamiento (shoulder)
    C: Llamar inmediatamente a su compañía de seguros
    D: Abandonar la escena para buscar una grúa
  answer: B
  explanation: Si es posible, mueva los vehículos involucrados fuera de los carriles
    de circulación y hacia el acotamiento. Esto reducirá la posibilidad de que alguien
    más choque contra los vehículos involucrados.
- id: 212
  category: driver_responsibility
  question: Si alguien resulta herido en un choque, ¿qué debe hacer mientras espera
    ayuda?
  choices:
    A: Mover a la persona al lado de la carretera
    B: Ofrecerle a la persona comida y agua
    C: Dejar a la persona herida donde está y mantenerla abrigada y tranquila
    D: Transportar a la persona al hospital en su propio vehículo
  answer: C
  explanation: Si alguien resulta herido, llame al 911. Deje a la persona herida donde
    está, ya que moverla de forma incorrecta puede lesionarla más. Mantenga a la persona
    abrigada y tranquila.
- id: 213
  category: driver_responsibility
  question: ¿Qué debe hacer si choca contra un vehículo estacionado, causa daños y
    no puede encontrar al dueño?
  choices:
    A: Esperar junto al vehículo hasta que el dueño regrese
    B: Dejar una nota escrita con su nombre, dirección y número de teléfono en el
      vehículo
    C: Informarlo al DMV en un plazo de 30 días
    D: Irse si el daño parece menor
  answer: B
  explanation: Si choca contra un vehículo estacionado y causa daños, y no puede encontrar
    al dueño, debe escribir su nombre, dirección y número de teléfono y dejarlo en
    el vehículo.
- id: 214
  category: driver_responsibility
  question: Debe presentar un informe por escrito al Departamento de Vehículos Motorizados
    (DMV) en un plazo de 72 horas si un choque resulta en lesiones o si los daños
    a la propiedad superan ¿qué cantidad?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $3,000
  answer: D
  explanation: Si alguna persona ha resultado herida, o si el daño es superior a $3,000,
    debe presentar un informe por escrito al Departamento de Vehículos Motorizados
    en un plazo de 72 horas.
- id: 215
  category: driver_responsibility
  question: Si un conductor de Vermont se ve involucrado en un choque en otro estado,
    ¿dónde debe reportarse el choque?
  choices:
    A: Solo al DMV de Vermont
    B: En el estado donde ocurrió el choque
    C: Solo a la compañía de seguros del conductor
    D: A la administración federal de carreteras
  answer: B
  explanation: Si un conductor de Vermont tiene un choque en otro estado, debe reportarse
    en el estado donde ocurrió el choque.
- id: 216
  category: vehicle_information
  question: ¿Con qué frecuencia debe ser inspeccionado su vehículo en Vermont?
  choices:
    A: Una vez cada seis meses
    B: Una vez al año
    C: Una vez cada dos años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Su vehículo debe ser inspeccionado una vez al año para asegurarse de
    que sea revisado y funcione correctamente.
- id: 217
  category: vehicle_information
  question: A menos que ya tenga una calcomanía de inspección de Vermont válida, ¿dentro
    de cuántos días después del registro debe ser inspeccionado un vehículo motorizado?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Todos los vehículos motorizados deben ser inspeccionados dentro de
    los 15 días posteriores al registro, a menos que tengan una calcomanía de inspección
    de Vermont válida.
- id: 218
  category: vehicle_information
  question: ¿Cuál es la causa más común de frenos en mal estado que hace que un vehículo
    se desvíe cuando se aplican los frenos repentinamente?
  choices:
    A: El líquido de frenos está completamente vacío
    B: Los frenos no funcionan juntos correctamente
    C: El pedal del freno está demasiado alto
    D: El freno de mano está puesto
  answer: B
  explanation: La causa más común de frenos en mal estado es que no funcionan juntos
    correctamente. Al aplicar los frenos repentinamente, uno se agarra antes que el
    otro y hace que su vehículo se desvíe.
- id: 219
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    en Vermont?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 3/32 de pulgada
    D: 4/32 de pulgada
  answer: B
  explanation: Los neumáticos deben tener al menos 2/32" de profundidad de banda de
    rodadura. No es seguro ni legal usar neumáticos después de que la banda de rodadura
    se haya desgastado o se haya desgastado hasta las barras de desgaste.
- id: 220
  category: vehicle_information
  question: La placa de matrícula trasera de su vehículo debe estar iluminada para
    que pueda verse y leerse desde al menos ¿qué distancia?
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 150 pies
  answer: B
  explanation: La placa de matrícula trasera debe estar iluminada para que pueda verse
    y leerse al menos a 50 pies de la parte trasera del vehículo.
- id: 221
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma que podría indicar una intoxicación
    por monóxido de carbono debido a un sistema de escape con fugas?
  choices:
    A: Un fuerte olor a gases de escape en la cabina
    B: Sentir somnolencia o náuseas
    C: Un aumento repentino de la temperatura del motor
    D: El volante se mueve con demasiada holgura
  answer: B
  explanation: No se puede oler el gas de monóxido de carbono. Si siente somnolencia
    o náuseas, esto podría indicar una intoxicación por monóxido de carbono.
- id: 222
  category: vehicle_information
  question: ¿Qué establece la ley de Vermont con respecto a los objetos que cuelgan
    del espejo retrovisor o de los parasoles?
  choices:
    A: Se permiten si miden menos de 3 pulgadas.
    B: Se permiten solo en el parasol del lado del pasajero.
    C: No debe haber nada colgando del espejo retrovisor ni de los parasoles.
    D: Se permiten siempre que no bloqueen la vista del velocímetro por parte del
      conductor.
  answer: C
  explanation: La ley establece que no debe haber nada colgando del espejo retrovisor
    ni de los parasoles.
- id: 223
  category: safe_driving_rules
  question: Según la ley de Vermont, ¿cómo debe estar asegurado un niño menor de dos
    años en un vehículo?
  choices:
    A: En un asiento de seguridad orientado hacia adelante con un arnés
    B: En un asiento elevado (booster seat) en el asiento trasero
    C: En un asiento de seguridad para niños orientado hacia atrás, aprobado por el
      gobierno federal, con un arnés
    D: Con un cinturón de seguridad estándar de regazo y hombro
  answer: C
  explanation: Un niño menor de dos años debe estar debidamente asegurado en un asiento
    de seguridad para niños orientado hacia atrás, aprobado por el gobierno federal,
    con un arnés.
- id: 224
  category: safe_driving_rules
  question: ¿Dónde debe viajar un niño menor de 13 años en un vehículo, si es posible?
  choices:
    A: En el asiento del pasajero delantero
    B: En el asiento trasero
    C: En un asiento de seguridad orientado hacia atrás
    D: En el asiento delantero central
  answer: B
  explanation: Un niño menor de 13 años debe, si es posible, viajar en el asiento
    trasero.
- id: 225
  category: safe_driving_rules
  question: ¿Cuál es la forma correcta de usar el cinturón de seguridad de un vehículo?
  choices:
    A: El cinturón de regazo debe quedar ajustado sobre el estómago.
    B: El cinturón de hombro debe colocarse debajo del brazo.
    C: El cinturón de hombro debe colocarse detrás de la espalda.
    D: El cinturón de regazo debe quedar ajustado a través de las caderas y el cinturón
      de hombro a través del centro del pecho.
  answer: D
  explanation: Los cinturones de regazo deben quedar ajustados a través de las caderas,
    no sobre el estómago. Los cinturones de hombro pasan sobre el hombro y a través
    del centro del pecho.
- id: 226
  category: penalties_and_points
  question: Bajo el Sistema de Puntos de Vermont, ¿cuántos puntos debe recibir un
    conductor antes de que se le envíe una carta notificándole que su privilegio de
    conducir será suspendido?
  choices:
    A: 5 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: C
  explanation: Cuando un conductor recibe un total de 10 puntos, se le enviará una
    carta notificándole que su privilegio para conducir será suspendido.
- id: 227
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a su historial de conducción por enviar mensajes
    de texto mientras conduce?
  choices:
    A: 2 puntos
    B: De 2 a 5 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: Según el Sistema de Puntos de Vermont, enviar mensajes de texto mientras
    se conduce resulta en 2 a 5 puntos.
- id: 228
  category: penalties_and_points
  question: ¿Cuántos puntos recibirá un conductor por no detenerse ante un autobús
    escolar que se ha detenido con sus luces rojas de advertencia intermitentes?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: D
  explanation: No detenerse ante un autobús escolar que se ha detenido con las luces
    rojas de advertencia intermitentes resulta en 5 puntos.
- id: 229
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones NO resultará en la asignación de
    puntos a su historial de conducción?
  choices:
    A: Conducir sin licencia
    B: No ceder el paso a un peatón en un cruce de peatones
    C: Infracciones de estacionamiento o de equipo defectuoso
    D: No obedecer a un oficial de policía
  answer: C
  explanation: No se asignan puntos por infracciones de estacionamiento o de equipo
    defectuoso.
- id: 230
  category: vehicle_information
  question: ¿Qué podrían indicar las marcas onduladas en sus neumáticos delanteros?
  choices:
    A: Los neumáticos están demasiado inflados.
    B: Las ruedas están desalineadas.
    C: El líquido de frenos tiene una fuga.
    D: El volante está demasiado flojo.
  answer: B
  explanation: Las marcas onduladas en los neumáticos delanteros pueden significar
    que las ruedas están desalineadas.
- id: 231
  category: vehicle_information
  question: ¿Durante la inspección anual del vehículo, qué sucede si se supone que
    su vehículo debe tener un convertidor catalítico pero este falta o falla?
  choices:
    A: Recibirá 2 puntos en su licencia.
    B: Debe pagar una multa pero puede seguir conduciendo.
    C: Debe ser reemplazado.
    D: El mecánico emitirá una exención.
  answer: C
  explanation: Si se supone que su vehículo debe tener un convertidor catalítico y
    este no está presente o si el convertidor catalítico falla, debe ser reemplazado.
- id: 232
  category: safe_driving_rules
  question: ¿Dónde NUNCA debe colocar un asiento de seguridad para niños orientado
    hacia atrás?
  choices:
    A: En el asiento trasero detrás del conductor
    B: En el asiento trasero detrás del pasajero
    C: En el medio del asiento trasero
    D: Frente a una bolsa de aire (airbag) activa
  answer: D
  explanation: 'Un niño en un asiento de seguridad orientado hacia atrás no debe viajar
    frente a una bolsa de aire (airbag) activa. El manual señala explícitamente: "¡Nunca
    coloque un asiento de seguridad para niños frente a una bolsa de aire!".'
- id: 233
  category: penalties_and_points
  question: ¿Cuántos puntos acumulados en su historial de conducción resultarán en
    una carta notificándole que su privilegio de conducir será suspendido?
  choices:
    A: 5 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: B
  explanation: Según el manual, acumular un total de 10 puntos resultará en el envío
    de una carta para notificar al conductor que su privilegio de conducir será suspendido.
- id: 234
  category: vehicle_information
  question: Si se muda a Vermont desde otro estado, ¿cuántos días tiene para registrar
    su vehículo?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Si se muda a Vermont desde otro estado, debe registrar su vehículo
    dentro de los 60 días posteriores a su mudanza al estado.
- id: 235
  category: vehicle_information
  question: ¿Cuál es el requisito para la placa de matrícula trasera de un vehículo
    en Vermont?
  choices:
    A: Debe estar iluminada para que pueda leerse desde al menos 50 pies de distancia.
    B: Debe estar iluminada para que pueda leerse desde al menos 100 pies de distancia.
    C: Debe estar cubierta por un protector de plástico transparente para mantenerla
      limpia.
    D: Debe colocarse dentro de la ventana trasera.
  answer: A
  explanation: El manual establece que la placa trasera debe estar iluminada de modo
    que pueda leerse desde al menos 50 pies de distancia.
- id: 236
  category: vehicle_information
  question: Al vender un vehículo de año de modelo 2011 o más reciente, ¿qué documento
    específico debe ser firmado tanto por el vendedor como por el comprador?
  choices:
    A: Una exención de responsabilidad
    B: Una declaración del odómetro
    C: Un informe de inspección del vehículo
    D: Un formulario de liberación de gravamen
  answer: B
  explanation: Se requiere que tanto el vendedor como el comprador firmen una declaración
    del odómetro en todas las ventas de vehículos de año de modelo 2011 o más reciente.
- id: 237
  category: vehicle_information
  question: ¿Cuál es la tasa del Impuesto de Compra y Uso para un vehículo no arrendado
    en Vermont?
  choices:
    A: 4% del precio pagado
    B: 5% del valor justo de mercado
    C: 6% del precio pagado o del valor justo de mercado actual, lo que sea mayor
    D: 8% del precio pagado o del valor justo de mercado actual, lo que sea menor
  answer: C
  explanation: El Impuesto de Compra y Uso es el 6% del precio que pagó por el vehículo
    no arrendado o el valor justo de mercado actual, lo que sea mayor.
- id: 238
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos está exento de necesitar un título de
    vehículo motorizado de Vermont?
  choices:
    A: Una motocicleta con 500 cc de cilindrada
    B: Un remolque con un peso vacío de 1,500 libras o menos
    C: Un vehículo arrendado de menos de 3,000 libras
    D: Un vehículo de salvamento reconstruido
  answer: B
  explanation: Las excepciones al requisito del título de vehículo motorizado de Vermont
    incluyen una motocicleta con menos de 300 cc de cilindrada y un remolque con un
    peso vacío de 1,500 libras o menos.
- id: 239
  category: vehicle_information
  question: ¿Para cuál de los siguientes vehículos se requiere una verificación del
    VIN?
  choices:
    A: Un vehículo nuevo comprado en Vermont
    B: Un vehículo con un registro de un país extranjero, incluido Canadá
    C: Un vehículo que transfiere placas de un vehículo viejo
    D: Un remolque con un peso vacío de 1,000 libras
  answer: B
  explanation: La verificación del VIN es necesaria para vehículos con documentación
    de salvamento, vehículos titulados bajo fianza y vehículos con registros de cualquier
    país extranjero, incluido Canadá.
- id: 240
  category: vehicle_information
  question: Si pide dinero prestado a un banco para comprar un vehículo, ¿quién conserva
    el título hasta que se devuelva el préstamo?
  choices:
    A: El comprador
    B: El Departamento de Vehículos Motorizados (DMV)
    C: El titular del gravamen (acreedor prendario)
    D: El concesionario
  answer: C
  explanation: El título de su vehículo, cuando se emita, se enviará al titular del
    gravamen y no se le entregará a usted hasta que devuelva el dinero que pidió prestado.
- id: 241
  category: safe_driving_rules
  question: ¿Cuál es la cobertura mínima requerida de seguro de responsabilidad civil
    para daños a la propiedad en Vermont?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: A
  explanation: El monto de la cobertura DEBE ser de al menos $25,000 por muerte o
    lesiones de una persona; $50,000 por muerte o lesiones de 2 o más personas; y
    $10,000 por daños a la propiedad.
- id: 242
  category: penalties_and_points
  question: ¿Cuál es la sanción si un oficial de policía lo detiene y usted no tiene
    seguro en su vehículo?
  choices:
    A: Una advertencia y 1 punto en su historial de conducción
    B: Una multa y 2 puntos en su historial de conducción
    C: Incautación inmediata del vehículo y 4 puntos
    D: Una suspensión de la licencia por 30 días y 5 puntos
  answer: B
  explanation: Si un oficial de policía lo detiene y le pide ver el comprobante de
    su seguro y usted no tiene seguro, el oficial le dará una multa. Se le multará
    y se le asignarán dos puntos en su historial de conducción.
- id: 243
  category: driver_responsibility
  question: Si tiene seguro pero no puede mostrar la tarjeta a un oficial de policía
    cuando lo detienen, ¿cuántos días tiene para presentarla?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: Si tiene seguro en su vehículo y un oficial de policía lo detiene,
    y no puede mostrarle la tarjeta al oficial, tiene 15 días para hacerlo.
- id: 244
  category: penalties_and_points
  question: Si conduce sin seguro y se ve involucrado en un choque, ¿qué pasará con
    su licencia?
  choices:
    A: Será suspendida por 30 días.
    B: Se le retirará hasta que obtenga un seguro y demuestre que lo tiene por un
      período completo de 3 años.
    C: Será revocada permanentemente.
    D: Recibirá una carta de advertencia y 5 puntos.
  answer: B
  explanation: Si conduce sin seguro y tiene un choque (incluso si no es su culpa),
    el Comisionado de Vehículos Motorizados le retirará la licencia hasta que obtenga
    un seguro, y tendrá que demostrar que tiene seguro durante 3 años completos.
- id: 245
  category: vehicle_information
  question: Después de registrar un vehículo motorizado en Vermont, ¿cuántos días
    tiene para que sea inspeccionado si aún no tiene una calcomanía de inspección
    válida de Vermont?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Todos los vehículos motorizados deben ser inspeccionados dentro de
    los 15 días posteriores al registro, a menos que tengan una calcomanía de inspección
    válida de Vermont.
- id: 246
  category: safe_driving_rules
  question: Según los consejos de "Conducción Ecológica" (Green Driving), ¿cuál es
    la velocidad máxima a la que debe conducir con las ventanas abiertas para evitar
    disminuir la economía de combustible?
  choices:
    A: 30 mph
    B: 40 mph
    C: 50 mph
    D: 60 mph
  answer: C
  explanation: El manual aconseja no conducir con las ventanas abiertas a menos que
    mantenga su velocidad por debajo de 50 mph, ya que hacerlo a velocidades de autopista
    aumenta la resistencia aerodinámica y disminuye la economía de combustible.
- id: 247
  category: safe_driving_rules
  question: Si está estacionado en la ciudad, ¿dejar el motor encendido (ralentí)
    por más de cuántos segundos consume más combustible que apagar y volver a encender
    el motor?
  choices:
    A: 10 segundos
    B: 30 segundos
    C: 60 segundos
    D: 120 segundos
  answer: A
  explanation: Si está estacionado en la ciudad, dejar el motor encendido por más
    de 10 segundos consume más combustible que apagarlo y volverlo a encender.
- id: 248
  category: vehicle_information
  question: ¿Dónde puede encontrar normalmente la presión recomendada de los neumáticos
    para su vehículo?
  choices:
    A: Solo en el flanco del neumático
    B: En la placa en el marco de la puerta del lado del conductor y en el manual
      del propietario
    C: En el certificado de registro del vehículo
    D: En la calcomanía de inspección estatal
  answer: B
  explanation: La presión recomendada de los neumáticos se puede encontrar en la placa
    en el marco de la puerta del lado del conductor del vehículo y en el manual del
    propietario del vehículo.
- id: 249
  category: license_system
  question: Se requiere una Licencia de Conducir Comercial (CDL) para los operadores
    de vehículos con una clasificación de peso superior a ¿cuántas libras?
  choices:
    A: 10,000 libras
    B: 16,000 libras
    C: 26,000 libras
    D: 30,000 libras
  answer: C
  explanation: Se requiere una Licencia de Conducir Comercial (CDL) para los operadores
    de vehículos con una clasificación de peso superior a 26,000 libras.
- id: 250
  category: license_system
  question: ¿Qué clase de Licencia de Conducir Comercial (CDL) se requiere para un
    solo vehículo con un GVWR de 26,001 libras o más, siempre que cualquier vehículo
    remolcado tenga un GVWR de 10,000 libras o menos?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase D
  answer: B
  explanation: Una CDL Clase B es para vehículos sencillos con un GVWR de 26,001 libras
    o más, siempre que cualquier vehículo remolcado tenga un GVWR de 10,000 libras
    o menos.
- id: 251
  category: driver_testing
  question: ¿Si tiene una condición médica como epilepsia o diabetes que requiere
    insulina, qué debe hacer antes de programar una cita para un examen de conducir?
  choices:
    A: Aprobar un examen escrito especial sobre su condición
    B: Notificar al Departamento de Vehículos Motorizados, Sección de Mejora del Conductor
      (Driver Improvement Section)
    C: Llevar a un enfermero registrado al examen
    D: Pagar una tarifa adicional por evaluación médica
  answer: B
  explanation: Debe notificar al Departamento de Vehículos Motorizados, Sección de
    Mejora del Conductor (Driver Improvement Section) antes de programar una cita
    para un examen si tiene un problema médico como epilepsia o diabetes que requiere
    insulina.
- id: 252
  category: driver_responsibility
  question: ¿Qué privilegio se le otorga a una persona con un Cartel de Estacionamiento
    para Discapacitados con respecto a los espacios de estacionamiento con límite
    de tiempo?
  choices:
    A: Pueden estacionarse allí indefinidamente sin pagar una tarifa
    B: Pueden estacionarse sin pagar una tarifa por hasta 10 días
    C: Pueden estacionarse sin pagar una tarifa por hasta 24 horas
    D: Deben pagar la tarifa pero pueden estacionarse por 10 días
  answer: B
  explanation: Una persona que tiene dificultades para caminar puede estacionarse
    sin pagar una tarifa, durante 10 días, en un lugar de estacionamiento donde otros
    conductores solo pueden estacionarse por un tiempo determinado.
- id: 253
  category: penalties_and_points
  question: ¿Qué puede suceder si una persona con discapacidad permite que personas
    que no tienen una discapacidad abusen de los privilegios de su Cartel de Estacionamiento
    para Discapacitados?
  choices:
    A: La persona con discapacidad será multada con $500
    B: Se suspenderá la licencia de la persona sin discapacidad
    C: Las placas o el cartel para discapacitados pueden ser revocados
    D: El vehículo será confiscado permanentemente
  answer: C
  explanation: Las placas o el cartel para discapacitados de una persona con discapacidad
    pueden ser revocados si la persona con discapacidad permite que personas sin discapacidad
    abusen de los privilegios de sus placas o cartel de estacionamiento para discapacitados.
- id: 254
  category: driver_responsibility
  question: Por ley, ¿qué servicio deben proporcionar las estaciones de gasolina de
    autoservicio a un operador de vehículo motorizado que posee una placa o cartel
    de estacionamiento para discapacitados?
  choices:
    A: Lavado de parabrisas y revisión de presión de neumáticos gratuitos
    B: Un descuento del 10% en todas las compras de gasolina
    C: Un asistente para despachar la gasolina al costo de autoservicio
    D: Acceso prioritario a las bombas de combustible antes que otros conductores
  answer: C
  explanation: Las estaciones de gasolina de autoservicio, cuando lo solicite un operador
    de vehículo motorizado que posea una placa o cartel de estacionamiento para discapacitados,
    deberán requerir que un asistente despache la gasolina al costo de autoservicio.
- id: 255
  category: vehicle_information
  question: ¿Bajo qué condición podría un conductor con discapacidad estar exento
    de pagar el impuesto de compra y uso de vehículos?
  choices:
    A: Si compran un vehículo que rinde más de 40 millas por galón
    B: Si los controles del vehículo se alteran para permitirles operarlo
    C: Si han tenido una licencia de conducir de Vermont durante al menos 10 años
    D: Si el vehículo se utiliza exclusivamente para citas médicas
  answer: B
  explanation: Para ser elegible para la exención del pago del impuesto de compra
    y uso, los controles del vehículo deben estar alterados de manera que le permitan
    operar el vehículo, o debe tener un dispositivo de elevación mecánica.
- id: 256
  category: safe_driving_rules
  question: De acuerdo con la ley de vehículos motorizados desatendidos de Vermont,
    ¿qué debe hacer si deja su vehículo en un lugar público?
  choices:
    A: Dejar las luces de emergencia parpadeando
    B: Apagar el motor
    C: Cerrar las puertas con llave mientras el motor está en ralentí
    D: Dejar una nota en el tablero
  answer: B
  explanation: Permitir que un vehículo esté en ralentí mientras está desatendido
    en un lugar público infringe la ley de vehículos motorizados desatendidos de Vermont;
    si deja su vehículo, debe apagarlo.
- id: 257
  category: safe_driving_rules
  question: ¿Cómo puede afectar a su vehículo el disminuir el uso del aire acondicionado
    cuando las temperaturas superan los 80 grados?
  choices:
    A: Puede ahorrar entre un 10 y un 15 por ciento de combustible
    B: Aumenta la resistencia aerodinámica
    C: Hace que el motor se sobrecaliente
    D: Reduce la resistencia a la rodadura
  answer: A
  explanation: Disminuir el uso del aire acondicionado cuando las temperaturas superan
    los 80 grados puede ayudarle a ahorrar entre un 10 y un 15 por ciento de combustible.
- id: 258
  category: license_system
  question: ¿Cuántos registros activos que involucren una exención del impuesto de
    compra y uso pueden tener usted y cualquier propietario o registrante titular
    a la vez?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ilimitados
  answer: A
  explanation: Según el manual, usted y cualquier propietario o registrante titular
    pueden tener solo un registro activo que involucre una exención del impuesto de
    compra y uso a la vez.
- id: 259
  category: license_system
  question: 'Si solicita una exención de impuestos debido a la instalación de controles
    de vehículo alterados, su licencia de conducir debe estar:'
  choices:
    A: Renovada cada año
    B: Restringida a la operación con controles alterados
    C: Actualizada a una Licencia de Conducir Comercial (CDL)
    D: Suspendida por 30 días
  answer: B
  explanation: Su licencia de conducir debe estar restringida a la operación con controles
    alterados si solicita una exención debido a la instalación de controles alterados.
- id: 260
  category: license_system
  question: ¿Qué formulario debe estar firmado por un médico al solicitar una exención
    por controles de vehículo alterados?
  choices:
    A: Formulario VT-014
    B: Formulario DMV-100
    C: Formulario MED-01
    D: Formulario GDL-12
  answer: A
  explanation: El manual establece que se requiere el Formulario VT-014 firmado por
    un médico.
- id: 261
  category: driver_testing
  question: ¿Cuántas horas de práctica de conducción supervisada se requieren para
    los adolescentes, las cuales se recomienda a los padres superar?
  choices:
    A: 20 horas
    B: 30 horas
    C: 40 horas
    D: 50 horas
  answer: C
  explanation: Los padres deben asegurarse de que su hijo adolescente tenga muchas
    oportunidades para practicar la conducción supervisada, incluso más de las 40
    horas requeridas.
- id: 262
  category: safe_driving_rules
  question: Al establecer reglas familiares para conductores adolescentes, ¿después
    de qué hora se considera la conducción nocturna como un factor de riesgo conocido?
  choices:
    A: 8 pm
    B: 9 pm
    C: 10 pm
    D: 11 pm
  answer: B
  explanation: La conducción nocturna (después de las 9 p. m.) figura como un factor
    de riesgo conocido para los conductores adolescentes.
- id: 263
  category: license_system
  question: ¿Cuáles de las siguientes licencias se consideran "provisionales" y pueden
    ser revocadas?
  choices:
    A: Licencia de Conducir Comercial y Licencia de Conducir Mejorada
    B: Permiso de Aprendizaje (Learner's Permit) y Licencia de Conducir Juvenil (Junior
      Driver's License)
    C: Tarjeta de Privilegio de Conducir y Licencia para Extranjeros
    D: Licencia para Ciudadanos Mayores y Permiso de Motocicleta
  answer: B
  explanation: Tanto el Permiso de Aprendizaje como la Licencia de Conducir Juvenil
    son "provisionales" y pueden ser revocadas.
- id: 264
  category: penalties_and_points
  question: ¿Cómo puede un padre o tutor suspender la licencia provisional de su hijo?
  choices:
    A: Llamando al departamento de policía local
    B: Confiscando la tarjeta de la licencia física
    C: Escribiendo al Comisionado del Departamento de Vehículos Motorizados (DMV)
    D: Enviando una solicitud a través del sitio web del IIHS
  answer: C
  explanation: Como padre o tutor, usted puede suspender la licencia provisional de
    su hijo escribiendo al Comisionado del Departamento de Vehículos Motorizados (DMV).
- id: 265
  category: penalties_and_points
  question: ¿Una recomendación de una Junta de Desvío/Reparación (Diversion/Reparative
    Board) puede resultar en la revocación de una licencia provisional por cuántos
    días?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Una recomendación de una Junta de Desvío/Reparación puede resultar
    en una revocación de 30 días.
- id: 266
  category: vehicle_information
  question: ¿Qué sitio web sugiere visitar el manual para consultar las calificaciones
    de choque de los vehículos e información sobre cómo elegir vehículos seguros para
    adolescentes?
  choices:
    A: www.dmv.vermont.gov
    B: www.nhtsa.gov
    C: www.iihs.org/ratings
    D: www.safecar.gov
  answer: C
  explanation: El manual sugiere visitar www.iihs.org/ratings para ver las calificaciones
    de choque de los vehículos y otra información sobre la elección de vehículos seguros
    para adolescentes.
- id: 267
  category: driver_responsibility
  question: ¿Cuál de los siguientes se menciona explícitamente en el manual como un
    factor de riesgo conocido para los conductores adolescentes?
  choices:
    A: Conducir vehículos de transmisión manual
    B: Tener múltiples pasajeros adolescentes
    C: Escuchar la radio
    D: Conducir en autopistas interestatales
  answer: B
  explanation: Tener múltiples pasajeros adolescentes figura entre los factores de
    riesgo conocidos para los conductores adolescentes, junto con el exceso de velocidad,
    la conducción con somnolencia y la conducción bajo los efectos del alcohol o drogas.
- id: 268
  category: vehicle_information
  question: Para calificar para una exención de impuestos específica, ¿un vehículo
    debe tener controles alterados para permitir su operación o qué debe tener instalado?
  choices:
    A: Un dispositivo de elevación mecánica para permitir la entrada y salida
    B: Un sistema de doble freno para un instructor
    C: Un dispositivo de bloqueo de encendido con alcoholímetro
    D: Un sistema de seguimiento GPS
  answer: A
  explanation: Los controles del vehículo deben estar alterados para que le permitan
    operar el vehículo, o debe tener un dispositivo de elevación mecánica para permitir
    la entrada y salida del vehículo.
- id: 269
  category: license_system
  question: 'Seguir las restricciones de la Licencia de Conducir Juvenil ayuda a todos
    los adolescentes a mantenerse seguros y dentro de la:'
  choices:
    A: Ley de Moverse a un Lado (Move Over Law)
    B: Ley de Consentimiento Implícito
    C: Ley GDL (Licencia de Conducir Graduada)
    D: Regulaciones del Sistema de Control de Emisiones
  answer: C
  explanation: Seguir las restricciones de la Licencia de Conducir Juvenil ayudará
    a todos los adolescentes a mantenerse seguros y dentro de la ley GDL (Graduated
    Driver's License).
- id: 270
  category: defensive_driving
  question: ¿Qué deben animar los padres a sus hijos adolescentes a hacer cuando viajan
    con otros conductores?
  choices:
    A: Tomar el control de la conducción si el conductor está cansado
    B: Hablar a favor de la seguridad (speak up for safety)
    C: Navegar usando un teléfono celular
    D: Evitar usar el cinturón de seguridad para salir rápido en una emergencia
  answer: B
  explanation: Los padres deben animar a sus hijos adolescentes a hablar a favor de
    la seguridad cuando viajen con otros conductores.
- id: 271
  category: license_system
  question: ¿Según el texto proporcionado, en qué ciudad se encuentra el Departamento
    de Vehículos Motorizados de Vermont?
  choices:
    A: Burlington
    B: Rutland
    C: Montpelier
    D: Stowe
  answer: C
  explanation: El Departamento de Vehículos Motorizados se encuentra en 120 State
    Street, Montpelier, Vermont 05603-0001.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y continuar con precaución
    B: Hacer un alto total
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) roja y octagonal significa que debe hacer
    un alto total en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 272
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Hacer un alto total
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 273
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entrar en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 274
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 275
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 276
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 277
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 278
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 279
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 280
- image: keep_right.png
  category: signs_and_signals
  id: 281
  question: ¿Qué indica esta señal que deben hacer los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha únicamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
- image: speed_limit_25.png
  category: signs_and_signals
  id: 282
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
- image: deer_crossing.png
  category: signs_and_signals
  id: 283
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
- image: pedestrian_crossing.png
  category: signs_and_signals
  id: 284
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que crucen la calle.
- image: school_zone.png
  category: signs_and_signals
  id: 285
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal pentagonal (de 5 lados) de color amarillo verdoso fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
- image: railroad_crossing.png
  category: signs_and_signals
  id: 286
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
- image: railroad_crossbuck.png
  category: signs_and_signals
  id: 287
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los pasos a nivel. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
- image: curve_right.png
  category: signs_and_signals
  id: 288
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
- image: sharp_turn_right.png
  category: signs_and_signals
  id: 289
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
- image: reverse_curve.png
  category: signs_and_signals
  id: 290
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 291
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 292
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la carretera y
    ajuste su posición en el carril.
  id: 293
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 294
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
  id: 295
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: Tráfico en ambos sentidos más adelante — el tráfico se mueve en ambas direcciones
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos más adelante. Es
    posible que esté saliendo de una carretera de un solo sentido o de una autopista
    dividida y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 296
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 297
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 298
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca
    donde el semáforo puede no ser visible desde la distancia.
  id: 299
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 300
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde los caminos laterales.
  id: 301
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 302
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 303
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse o permanecer con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 304
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 305
