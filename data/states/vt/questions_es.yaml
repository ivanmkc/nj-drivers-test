questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un Permiso de Aprendizaje (Learner's
    Permit) de Vermont?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 15 años y medio
  answer: B
  explanation: Según el Departamento de Vehículos Motorizados (DMV) de Vermont, una
    persona debe tener al menos 15 años para solicitar un Permiso de Aprendizaje.
- id: 2
  category: license_system
  question: ¿Cuánto tiempo debe tener un adolescente de Vermont un Permiso de Aprendizaje
    antes de ser elegible para solicitar una Licencia de Conducir Juvenil (Junior
    Driver's License)?
  choices:
    A: 6 meses
    B: 9 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: La ley de Vermont exige que una persona tenga un Permiso de Aprendizaje
    durante al menos un año (12 meses) antes de poder realizar el examen de conducción
    para obtener una Licencia de Conducir Juvenil.
- id: 3
  category: license_system
  question: Durante los primeros tres meses de tener una Licencia de Conducir Juvenil
    de Vermont, ¿quién tiene permitido estar en el vehículo mientras el titular de
    la licencia conduce?
  choices:
    A: Cualquier amigo menor de 18 años
    B: Solo miembros de la familia inmediata
    C: Solo un instructor de manejo con licencia o una persona de al menos 25 años
      de edad
    D: No se permiten pasajeros bajo ninguna circunstancia
  answer: C
  explanation: Durante los primeros tres meses de operación con una Licencia de Conducir
    Juvenil, el conductor solo puede transportar a un instructor de manejo con licencia
    o a una persona de al menos 25 años de edad.
- id: 4
  category: license_system
  question: Durante los segundos tres meses de tener una Licencia de Conducir Juvenil
    de Vermont, ¿qué pasajeros están permitidos en el vehículo?
  choices:
    A: Cualquier número de amigos
    B: Solo miembros de la familia inmediata
    C: Solo un amigo menor de 18 años
    D: No se permiten pasajeros
  answer: B
  explanation: Durante los segundos tres meses de tener una Licencia de Conducir Juvenil,
    el conductor puede transportar a miembros de su familia inmediata, además de un
    instructor con licencia o una persona de 25 años o más.
- id: 5
  category: license_system
  question: Para calificar para una Licencia de Conducir Juvenil de Vermont, ¿cuántas
    horas de práctica de manejo deben ser certificadas por un padre o tutor?
  choices:
    A: 30 horas, con 5 horas de noche
    B: 40 horas, con 10 horas de noche
    C: 50 horas, con 10 horas de noche
    D: 60 horas, con 15 horas de noche
  answer: B
  explanation: Vermont requiere 40 horas de práctica de manejo, y al menos 10 de esas
    horas deben completarse por la noche.
- id: 6
  category: license_system
  question: En Vermont, ¿a qué edad se convierte automáticamente una Licencia de Conducir
    Juvenil en una Licencia de Operador Senior (Senior Operator's License)?
  choices:
    A: 17 años
    B: 18 años
    C: 19 años
    D: 21 años
  answer: B
  explanation: Una Licencia de Conducir Juvenil se emite a jóvenes de 16 y 17 años.
    Se convierte automáticamente en una Licencia de Operador Senior al cumplir el
    conductor 18 años, siempre que no tenga suspensiones pendientes.
- id: 7
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Aprendizaje de Vermont a partir
    de la fecha de emisión?
  choices:
    A: 1 año
    B: 2 años
    C: 4 años
    D: Hasta que el titular cumpla 18 años
  answer: B
  explanation: Un Permiso de Aprendizaje de Vermont es válido por un período de dos
    años.
- id: 8
  category: license_system
  question: Para realizar el examen de conducción en Vermont, ¿durante cuántos meses
    antes del examen debe una persona menor de 18 años no haber tenido multas ni accidentes?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: La ley de Vermont exige que el solicitante de una Licencia de Conducir
    Juvenil haya mantenido un historial de manejo limpio (sin multas ni accidentes
    de los que haya sido responsable) durante los seis meses anteriores al examen
    de conducción.
- id: 9
  category: license_system
  question: Según la ley de Vermont, ¿cuál es el límite de contenido de alcohol en
    sangre (BAC) para un conductor menor de 21 años?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Vermont tiene una ley de 'Tolerancia Cero' para menores. Si es menor
    de 21 años, puede ser acusado de una infracción si su BAC es de 0.02% o superior.
- id: 10
  category: license_system
  question: ¿Cuántos puntos acumulados en un historial de manejo de Vermont dentro
    de un período de dos años resultarán en la suspensión de la licencia?
  choices:
    A: 8 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: B
  explanation: En Vermont, si acumula 10 o más puntos en un período de dos años, sus
    privilegios de conducir serán suspendidos.
- id: 11
  category: license_system
  question: ¿Al mudarse a Vermont desde otro estado, cuántos días tiene para obtener
    una licencia de conducir de Vermont?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Los nuevos residentes de Vermont deben obtener una licencia de conducir
    de Vermont dentro de los 60 días posteriores a establecer la residencia.
- id: 12
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de seguro para daños a la propiedad
    en el estado de Vermont?
  choices:
    A: $5,000
    B: $10,000
    C: $20,000
    D: $25,000
  answer: B
  explanation: La ley de Vermont exige una cobertura mínima de responsabilidad civil
    de $25,000 por una persona lesionada, $50,000 por dos o más personas lesionadas
    y $10,000 por daños a la propiedad.
- id: 13
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para un curso de Educación Vial
    de Vermont para estudiantes menores de 18 años?
  choices:
    A: 20 horas de aula y 5 horas de conducción
    B: 30 horas de aula, 6 horas de conducción y 6 horas de observación
    C: 40 horas de aula y 10 horas de conducción
    D: 15 horas de aula y 15 horas de conducción
  answer: B
  explanation: Un curso de educación vial aprobado por el estado en Vermont debe incluir
    30 horas de instrucción en el aula, 6 horas de instrucción al volante y 6 horas
    de observación.
- id: 14
  category: license_system
  question: En Vermont, si se niega a realizar una prueba de alcoholemia (breathalyzer)
    cuando lo solicita un oficial de la ley, ¿cuál es la consecuencia inmediata bajo
    el 'Consentimiento Implícito' (Implied Consent)?
  choices:
    A: Solo una multa de $500
    B: Estancia obligatoria de 24 horas en la cárcel
    C: Su licencia será suspendida
    D: Nada, siempre y cuando no estuviera realmente ebrio
  answer: C
  explanation: Bajo la ley de Consentimiento Implícito (Implied Consent) de Vermont,
    al conducir por las carreteras de Vermont, usted acepta someterse a una prueba
    química. La negación resulta en una suspensión automática de la licencia.
- id: 15
  category: license_system
  question: ¿Qué documento NO es aceptable como prueba de identidad para una identificación
    Real ID de Vermont o una Licencia Estándar?
  choices:
    A: Un pasaporte de los EE. UU. válido y no vencido
    B: Una copia certificada de un certificado de nacimiento de los EE. UU.
    C: Una tarjeta de Seguro Social
    D: Una tarjeta de biblioteca
  answer: D
  explanation: Una tarjeta de biblioteca no es un documento emitido por el gobierno
    que pruebe la identidad o la presencia legal. Los pasaportes, certificados de
    nacimiento y tarjetas de Seguro Social son documentos estándar requeridos.
- id: 16
  category: license_system
  question: Si cambia su nombre o dirección, ¿dentro de cuántos días debe notificar
    al DMV de Vermont?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Según el Manual del Conductor de Vermont, cualquier cambio de nombre
    o dirección debe informarse al DMV dentro de los 30 días.
- id: 17
  category: license_system
  question: Al mudarse a Vermont, ¿cuántos días tiene para registrar su vehículo en
    el DMV de Vermont?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Los nuevos residentes deben registrar sus vehículos en Vermont dentro
    de los 60 días posteriores a mudarse al estado.
- id: 18
  category: license_system
  question: ¿Cuál es el monto mínimo de cobertura de seguro de responsabilidad civil
    requerido en Vermont por lesiones corporales o muerte de dos o más personas en
    un solo accidente?
  choices:
    A: $25,000
    B: $50,000
    C: $100,000
    D: $10,000
  answer: B
  explanation: La ley de Vermont exige una cobertura mínima de responsabilidad civil
    de $50,000 por lesiones corporales o muerte de dos o más personas en un solo accidente.
- id: 19
  category: license_system
  question: ¿Se suspenderá una Licencia de Operador Junior de Vermont si el conductor
    acumula cuántos puntos en su historial de conducción?
  choices:
    A: 3 puntos
    B: 6 puntos
    C: 10 puntos
    D: 12 puntos
  answer: A
  explanation: Mientras que a los conductores adultos se les suspende la licencia
    a los 10 puntos, una licencia de Operador Junior se suspende cuando el conductor
    alcanza los 3 puntos.
- id: 20
  category: license_system
  question: De las 40 horas de práctica de conducción requeridas para una Licencia
    Junior de Vermont, ¿cuántas horas deben completarse por la noche?
  choices:
    A: 5 horas
    B: 10 horas
    C: 15 horas
    D: 20 horas
  answer: B
  explanation: Vermont requiere 40 horas de práctica de conducción, y al menos 10
    de esas horas deben completarse durante la noche.
- id: 21
  category: license_system
  question: ¿Cuál es la clase de licencia de conducir estándar de Vermont para operar
    un vehículo de pasajeros regular?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase D
  answer: D
  explanation: Una licencia de Clase D es la licencia de operador estándar para automóviles
    de pasajeros y camiones pequeños en Vermont.
- id: 22
  category: license_system
  question: En Vermont, por una primera infracción por el uso de un dispositivo electrónico
    portátil (enviar mensajes de texto) mientras conduce, ¿cuántos puntos se asignan
    contra su licencia?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 5 puntos
    D: 0 puntos (solo multa)
  answer: B
  explanation: Una primera infracción por usar un dispositivo electrónico portátil
    mientras se conduce en Vermont resulta en 2 puntos en el registro de conducción.
- id: 23
  category: license_system
  question: ¿Por cuántos años es típicamente válida una licencia de conducir estándar
    de Vermont antes de que deba ser renovada?
  choices:
    A: 1 o 2 años
    B: 2 o 4 años
    C: 5 años
    D: 8 años
  answer: B
  explanation: Los residentes de Vermont generalmente tienen la opción de un período
    de renovación de 2 o 4 años para su licencia de conducir.
- id: 24
  category: license_system
  question: ¿Cuál es el límite de contenido de alcohol en sangre (BAC) para una persona
    que opera un vehículo motorizado comercial (CMV) en Vermont?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: El límite de BAC para conductores comerciales en Vermont es de 0.04%,
    el cual es más estricto que el límite de 0.08% para operadores estándar.
- id: 25
  category: license_system
  question: Si es menor de 18 años y solicita una Licencia de Operador Juvenil de
    Vermont, ¿quién debe firmar la certificación de práctica de conducción?
  choices:
    A: Un oficial de policía
    B: Un director de escuela
    C: Un padre, tutor o instructor de conducción con licencia
    D: Cualquier conductor con licencia mayor de 21 años
  answer: C
  explanation: El registro de 40 horas de práctica debe ser certificado por un padre,
    tutor o un instructor de conducción con licencia.
- id: 26
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que una persona acompañe
    al titular de un Permiso de Aprendiz de Vermont mientras conduce?
  choices:
    A: Debe tener al menos 21 años de edad
    B: Debe tener al menos 25 años de edad y poseer licencia
    C: Debe tener al menos 10 años de experiencia de conducción
    D: Debe estar sentado en el asiento trasero
  answer: B
  explanation: El titular de un permiso debe estar acompañado por un padre/tutor con
    licencia, un instructor de educación vial con licencia o una persona con licencia
    que tenga al menos 25 años de edad.
- id: 27
  category: license_system
  question: En Vermont, si su licencia es suspendida, ¿qué debe hacer para recuperarla
    después de que termine el período de suspensión?
  choices:
    A: Volver a tomar el examen de carretera únicamente
    B: Pagar una tarifa de restablecimiento y cumplir con cualquier otro requisito
      legal
    C: Esperar 1 año después de que termine la suspensión
    D: Nada, se envía de vuelta por correo automáticamente
  answer: B
  explanation: Para restablecer una licencia suspendida en Vermont, debe pagar una
    tarifa de restablecimiento y cumplir con todas las condiciones de la suspensión.
- id: 28
  category: license_system
  question: ¿Cuál es el requisito mínimo de seguro de responsabilidad civil por daños
    a la propiedad en un solo accidente en Vermont?
  choices:
    A: $5,000
    B: $10,000
    C: $20,000
    D: $25,000
  answer: B
  explanation: La ley de Vermont requiere un mínimo de $10,000 en cobertura por daños
    a la propiedad en cualquier accidente.
- id: 29
  category: license_system
  question: Si un conductor de Vermont es condenado por 'Operar después de la suspensión'
    (OAS), ¿cuál es una posible sanción por una primera infracción?
  choices:
    A: Sentencia de prisión obligatoria de 5 años
    B: Una multa y un período adicional de suspensión
    C: Pérdida permanente de la licencia
    D: No hay sanción por la primera infracción
  answer: B
  explanation: Operar después de la suspensión es una infracción grave en Vermont
    que conlleva multas y extiende el período de suspensión de la licencia.
- id: 30
  category: license_system
  question: En Vermont, ¿cuántos puntos se agregan a su registro de conducción por
    una condena de 'No ceder el paso a un vehículo de emergencia'?
  choices:
    A: 2 puntos
    B: 5 puntos
    C: 8 puntos
    D: 10 puntos
  answer: B
  explanation: No ceder el paso a un vehículo de emergencia es una infracción mayor
    en Vermont y resulta en la adición de 5 puntos al registro del conductor.
- id: 31
  category: driver_testing
  question: Para cumplir con los requisitos de visión para una licencia de conducir
    de Vermont, ¿qué agudeza visual mínima debe tener el solicitante en al menos un
    ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Según el Manual del Conductor de Vermont, un solicitante debe tener
    una visión de 20/40 o mejor en al menos un ojo, con o sin lentes correctivos.
- id: 32
  category: driver_testing
  question: Al realizar el examen de conducción de Vermont, si el vehículo tiene una
    consola central, ¿cuál es un requisito para el freno de emergencia?
  choices:
    A: Debe ser electrónico.
    B: Debe estar accesible para el examinador.
    C: Debe ser operado únicamente con el pie.
    D: El examinador no necesita tener acceso al freno.
  answer: B
  explanation: Para el examen de conducción de Vermont, el freno de emergencia del
    vehículo debe estar ubicado de tal manera que el examinador pueda alcanzarlo en
    caso de una emergencia.
- id: 33
  category: driver_testing
  question: En Vermont, ¿cuántos puntos se asignan a su historial de conducción por
    una condena de exceso de velocidad de 11 a 20 millas por hora sobre el límite
    de velocidad?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 8 puntos
  answer: B
  explanation: El sistema de puntos de Vermont asigna 3 puntos por exceso de velocidad
    de 11-20 mph sobre el límite. El exceso de velocidad de 1-10 mph sobre el límite
    es de 2 puntos.
- id: 34
  category: driver_testing
  question: Según la ley de Vermont, ¿cuál es el rango de la multa por una primera
    infracción por usar un dispositivo electrónico portátil (enviar mensajes de texto)
    mientras se conduce?
  choices:
    A: Entre $50 y $100
    B: Entre $100 y $200
    C: Entre $250 y $500
    D: Una multa fija de $500
  answer: B
  explanation: Bajo la norma 23 V.S.A. § 1099, la multa por una primera infracción
    por usar un dispositivo electrónico portátil mientras se conduce en Vermont es
    de entre $100 y $200.
- id: 35
  category: driver_testing
  question: La ley de "Hacerse a un lado" (Move Over) de Vermont requiere que los
    conductores cambien de carril o reduzcan la velocidad al acercarse a ¿cuál de
    los siguientes vehículos estacionarios con luces intermitentes?
  choices:
    A: Solo vehículos de la policía y de bomberos
    B: Solo ambulancias y grúas
    C: Solo vehículos de mantenimiento y servicios públicos
    D: Cualquier vehículo con luces intermitentes, incluidos los vehículos de emergencia
      y de mantenimiento
  answer: D
  explanation: La ley de Vermont exige que los conductores se muevan de carril o reduzcan
    la velocidad ante todos los vehículos estacionarios con luces intermitentes, incluidos
    los vehículos de emergencia, de remolque y de mantenimiento de carreteras.
- id: 36
  category: driver_testing
  question: En Vermont, ¿cuántos puntos se añaden a su historial de conducción por
    rebasar ilegalmente a un autobús escolar detenido con sus luces rojas intermitentes?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 5 puntos
    D: 10 puntos
  answer: C
  explanation: Rebasar a un autobús escolar detenido con las luces rojas intermitentes
    es una infracción grave en Vermont y resulta en la adición de 5 puntos al historial
    del conductor.
- id: 37
  category: driver_testing
  question: La ley de Vermont exige que encienda los faros delanteros siempre que
    utilice los limpiaparabrisas en ¿qué modo?
  choices:
    A: Solo en modo intermitente
    B: Solo en modo de alta velocidad
    C: Modo continuo
    D: Nunca se requieren faros con los limpiaparabrisas
  answer: C
  explanation: La ley de Vermont exige que los faros delanteros se enciendan siempre
    que los limpiaparabrisas estén en uso continuo debido a la precipitación o la
    mala visibilidad.
- id: 38
  category: driver_testing
  question: Al rebasar una bicicleta en Vermont, ¿cuál es la distancia mínima que
    un automovilista debe mantener entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: La ley de Vermont (23 V.S.A. § 1139) exige que los automovilistas ejerzan
    el debido cuidado y mantengan al menos 4 pies de distancia al rebasar a una person
    que opera una bicicleta.
- id: 39
  category: driver_testing
  question: En Vermont, ¿es ilegal estacionarse a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: De acuerdo con las reglas de la carretera de Vermont (23 V.S.A. § 1104),
    está prohibido estacionarse a menos de 15 pies de un hidrante de incendios.
- id: 40
  category: driver_testing
  question: ¿Con qué frecuencia deben someterse los vehículos registrados en Vermont
    a una inspección de seguridad y emisiones?
  choices:
    A: Cada 6 meses
    B: Una vez al año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Todos los vehículos registrados en Vermont deben ser inspeccionados
    una vez al año en una estación de inspección oficial.
- id: 41
  category: driver_testing
  question: Si se le condena por exceso de velocidad en una zona de obras en una carretera
    de Vermont cuando hay trabajadores presentes, ¿qué sucede con la multa?
  choices:
    A: La multa se exonera por una primera infracción
    B: La multa se duplica
    C: La multa se triplica
    D: La multa sigue siendo la misma pero los puntos se duplican
  answer: B
  explanation: La ley de Vermont estipula que las multas por exceso de velocidad en
    una zona de obras designada se duplican cuando hay trabajadores presentes.
- id: 42
  category: driver_testing
  question: ¿Qué regla recomienda el Manual del Conductor de Vermont para mantener
    una distancia de seguimiento segura detrás del vehículo que está delante de usted?
  choices:
    A: La regla de la longitud de un automóvil
    B: La regla de los dos segundos
    C: La regla de los cuatro segundos
    D: La regla de los seis segundos
  answer: C
  explanation: El Manual del Conductor de Vermont recomienda una distancia de seguimiento
    de cuatro segundos para permitir suficiente tiempo para reaccionar ante posibles
    peligros.
- id: 43
  category: driver_testing
  question: En Vermont, ¿a cuántos pies de distancia de un vehículo que viene en sentido
    contrario debe atenuar las luces altas de sus faros?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Vermont (23 V.S.A. § 1246) exige que los conductores cambien
    a luces bajas cuando un vehículo que viene en sentido contrario se encuentra a
    menos de 500 pies.
- id: 44
  category: driver_testing
  question: Si reprueba el examen de conducción de Vermont, ¿cuánto tiempo debe esperar
    antes de ser elegible para realizar el examen nuevamente por primera vez?
  choices:
    A: 24 horas
    B: 3 días
    C: 1 semana
    D: 1 mes
  answer: C
  explanation: En Vermont, si reprueba el examen de conducción, debe esperar al menos
    una semana antes de poder programar y realizar el examen nuevamente.
- id: 45
  category: driver_testing
  question: El examen escrito de conocimientos de Vermont consta de 20 preguntas de
    opción múltiple. ¿Cuántas preguntas debe responder correctamente para aprobar?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: C
  explanation: Una puntuación aprobatoria en el examen de conocimientos de Vermont
    es del 80%, lo que requiere responder correctamente al menos 16 de las 20 preguntas.
- id: 46
  category: driver_testing
  question: ¿Cuál de los siguientes es un requisito para el vehículo utilizado durante
    un examen de conducción en Vermont?
  choices:
    A: Debe ser un sedán de tamaño mediano
    B: Debe tener una calcomanía de inspección de Vermont válida
    C: Debe ser propiedad del solicitante
    D: Debe tener transmisión manual
  answer: B
  explanation: El vehículo utilizado para el examen de conducción debe estar en buenas
    condiciones mecánicas, debidamente registrado, asegurado y debe mostrar una calcomanía
    de inspección válida.
- id: 47
  category: driver_testing
  question: Si un conductor de Vermont es condenado por no detenerse ante un autobús
    escolar que tiene sus luces rojas intermitentes, ¿cuántos puntos se agregarán
    a su historial de conducción?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 10 puntos
  answer: C
  explanation: Rebasar un autobús escolar detenido con las luces rojas intermitentes
    es una infracción grave en Vermont y conlleva una penalización de 5 puntos.
- id: 48
  category: driver_testing
  question: ¿Qué exige la ley 'Move Over' (hacerse a un lado) de Vermont que hagan
    los conductores al acercarse a un vehículo de emergencia estacionado con luces
    intermitentes en una carretera de carriles múltiples?
  choices:
    A: Detenerse por completo hasta que se le indique que avance
    B: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    C: Reducir la velocidad y, si es seguro hacerlo, cambiarse a un carril que no
      sea adyacente al vehículo
    D: Aumentar la velocidad para rebasar el vehículo lo más rápido posible
  answer: C
  explanation: La ley de Vermont exige que los conductores procedan con precaución
    y, si es seguro y posible, realicen un cambio de carril a un carril que no sea
    adyacente al vehículo de emergencia o de mantenimiento estacionado.
- id: 49
  category: driver_testing
  question: Según la ley de Vermont, ¿cuándo se requiere que encienda los faros de
    su vehículo?
  choices:
    A: Solo entre la puesta del sol y la salida del sol
    B: Siempre que conduzca por un camino de tierra
    C: Siempre que use los limpiaparabrisas debido a la precipitación
    D: Solo cuando la visibilidad sea inferior a 100 pies
  answer: C
  explanation: La ley de Vermont exige que los faros se enciendan siempre que los
    limpiaparabrisas del vehículo estén en uso debido a la lluvia, la nieve u otra
    precipitación.
- id: 50
  category: driver_testing
  question: Para los conductores de vehículos motorizados comerciales en Vermont,
    ¿cuál es el límite de contenido de alcohol en sangre (BAC) que constituye una
    infracción legal?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Si bien el límite estándar para conductores adultos no comerciales
    es de 0.08%, el límite de contenido de alcohol en sangre (BAC) para conductores
    comerciales en Vermont es de 0.04%.
- id: 51
  category: driver_testing
  question: ¿Con cuántos pies de antelación, como mínimo, debe señalizar su intención
    antes de girar o cambiar de carril en Vermont?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: La ley de Vermont exige que los conductores señalicen al menos 100
    pies antes de realizar un giro o cambiar de carril.
- id: 52
  category: driver_testing
  question: La ley de Vermont prohíbe que un vehículo de motor permanezca en ralentí
    (marcha en vacío) por más de ¿cuántos minutos en cualquier período de 60 minutos?
  choices:
    A: 2 minutos
    B: 5 minutos
    C: 10 minutos
    D: 15 minutos
  answer: B
  explanation: Para reducir la contaminación del aire, la ley de Vermont generalmente
    prohíbe dejar un vehículo en ralentí por más de 5 minutos en cualquier período
    de 60 minutos, con algunas excepciones por temperaturas extremas.
- id: 53
  category: driver_responsibility
  question: En Vermont, debe presentar un informe oficial de accidente ante el Comisionado
    de Vehículos Motorizados si los daños a la propiedad de todos los vehículos y
    bienes combinados superan ¿qué cantidad?
  choices:
    A: $1,000
    B: $2,000
    C: $3,000
    D: $5,000
  answer: C
  explanation: Según el Manual del Conductor de Vermont, se debe presentar un informe
    por escrito al DMV en un plazo de 72 horas si alguna persona resulta herida o
    fallece, o si el daño total a toda la propiedad es de $3,000 o más.
- id: 54
  category: driver_responsibility
  question: ¿De cuántas horas dispone para presentar un informe de accidente por escrito
    ante el DMV de Vermont si un accidente resulta en lesiones, muerte o daños materiales
    significativos?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 96 horas
  answer: C
  explanation: La ley de Vermont exige que se envíe un informe de accidente por escrito
    al Comisionado de Vehículos Motorizados dentro de las 72 horas posteriores al
    suceso.
- id: 55
  category: driver_responsibility
  question: Después de registrar un vehículo en Vermont, ¿dentro de cuántos días debe
    el vehículo someterse a una inspección de seguridad?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Todos los vehículos de motor registrados en Vermont deben ser inspeccionados
    una vez al año. Si registra un vehículo por primera vez, tiene 15 días para que
    sea inspeccionado.
- id: 56
  category: driver_responsibility
  question: Si un conductor de Vermont es condenado por un DUI (conducir bajo los
    efectos del alcohol o drogas), ¿por cuánto tiempo se le exige normalmente mantener
    un certificado SR-22 (Seguro de Responsabilidad Financiera)?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: Permanentemente
  answer: B
  explanation: Los conductores a los que se les ha suspendido la licencia por ciertas
    infracciones, como un DUI, deben presentar y mantener una prueba de responsabilidad
    financiera (SR-22) durante 3 años.
- id: 57
  category: driver_responsibility
  question: Si un conductor de Vermont es menor de 18 años y es sorprendido usando
    un dispositivo electrónico portátil mientras conduce, ¿cuál es el período de suspensión
    obligatorio por una primera infracción?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Para los Operadores Junior (menores de 18 años), una primera infracción
    por el uso de un dispositivo electrónico portátil mientras conducen resulta en
    una suspensión de la licencia de 30 días.
- id: 58
  category: driver_responsibility
  question: ¿Cuántos puntos se asignan por 'Abandonar la escena de un accidente' (daños
    a la propiedad) en Vermont?
  choices:
    A: 2 puntos
    B: 5 puntos
    C: 10 puntos
    D: 12 puntos
  answer: B
  explanation: Abandonar la escena de un accidente que involucre daños a la propiedad
    resulta en 5 puntos en el historial de conducción de Vermont.
- id: 59
  category: driver_responsibility
  question: En Vermont, ¿para cuál de los siguientes vehículos NO se requiere un Certificado
    de Título?
  choices:
    A: Un vehículo que tenga más de 15 años de antigüedad
    B: Un vehículo comprado a un vendedor privado
    C: Un vehículo con motor diésel
    D: Un vehículo utilizado para fines comerciales
  answer: A
  explanation: Vermont no emite títulos para vehículos que tengan más de 15 años de
    antigüedad.
- id: 60
  category: driver_responsibility
  question: Si usted es residente de Vermont y su licencia es suspendida en otro estado,
    ¿cuál es el estado de su licencia de Vermont?
  choices:
    A: Sigue siendo válida únicamente en Vermont
    B: Es válida por 30 días mientras usted apela
    C: También será suspendida en Vermont
    D: No se ve afectada a menos que la infracción haya ocurrido en Nueva Inglaterra
  answer: C
  explanation: Vermont es miembro del Pacto de Licencias de Conducir (Driver License
    Compact); si su privilegio de conducir es suspendido en otro estado, también será
    suspendido en Vermont.
- id: 61
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una cobertura de seguro obligatoria en Vermont
    que le protege si es golpeado por un conductor que no tiene seguro?
  choices:
    A: Cobertura de colisión
    B: Cobertura a todo riesgo (Comprehensive)
    C: Cobertura de conductor no asegurado
    D: Cobertura de pagos médicos
  answer: C
  explanation: La ley de Vermont exige que todos los automovilistas tengan cobertura
    de conductor no asegurado o con seguro insuficiente (UM/UIM) para protegerse contra
    conductores que no tienen el seguro adecuado.
- id: 62
  category: driver_responsibility
  question: En Vermont, ¿cuál es el valor en puntos por 'No ceder el paso a un vehículo
    de emergencia'?
  choices:
    A: 2 puntos
    B: 5 puntos
    C: 8 puntos
    D: 10 puntos
  answer: B
  explanation: No ceder el paso a un vehículo de emergencia es una infracción grave
    en Vermont y conlleva una penalización de 5 puntos.
- id: 63
  category: driver_responsibility
  question: La licencia de conducir de Vermont puede ser suspendida por ¿cuál de los
    siguientes motivos no relacionados con la conducción?
  choices:
    A: Falta de pago del impuesto sobre la renta de Vermont
    B: Falta de pago de la manutención infantil
    C: No registrarse en el Servicio Selectivo
    D: Tanto A como B
  answer: D
  explanation: La ley de Vermont permite la suspensión de la licencia de conducir
    por no pagar la manutención infantil o por no pagar los impuestos estatales sobre
    la renta.
- id: 64
  category: driver_responsibility
  question: Si se ve involucrado en un accidente reportable en Vermont, ¿cuántas horas
    tiene para presentar un informe por escrito ante el Comisionado de Vehículos Motorizados?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 96 horas
  answer: C
  explanation: La ley de Vermont exige que se presente un informe de accidente por
    escrito ante el DMV dentro de las 72 horas posteriores al suceso.
- id: 65
  category: driver_responsibility
  question: ¿Cuántos puntos se añaden al registro de conducción de Vermont por la
    primera infracción de rebasar ilegalmente a un autobús escolar detenido?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 5 puntos
    D: 10 puntos
  answer: C
  explanation: Rebasar ilegalmente a un autobús escolar detenido es una infracción
    grave en Vermont y resulta en la adición de 5 puntos al registro del conductor.
- id: 66
  category: driver_responsibility
  question: En Vermont, si es declarado culpable de un DUI (conducir bajo la influencia)
    u otras infracciones graves, ¿por cuánto tiempo se le puede exigir que mantenga
    un 'Seguro de Responsabilidad Financiera' (SR-22)?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: Permanentemente
  answer: B
  explanation: Los conductores a los que se les exige presentar una prueba de responsabilidad
    financiera (SR-22) generalmente deben mantener este seguro por un período de 3
    años.
- id: 67
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de los faros delanteros en Vermont?
  choices:
    A: Los faros solo son obligatorios entre la puesta del sol y la salida del sol.
    B: Los faros deben encenderse siempre que se utilicen los limpiaparabrisas.
    C: Los faros solo son obligatorios cuando la visibilidad es inferior a 100 pies.
    D: Los faros deben encenderse únicamente en las autopistas.
  answer: B
  explanation: La ley de Vermont exige que los faros delanteros se enciendan siempre
    que los limpiaparabrisas del vehículo estén en uso debido a la precipitación o
    a las malas condiciones climáticas.
- id: 68
  category: driver_responsibility
  question: ¿Cuántos puntos se asignan por una condena de 'Conducción Temeraria' (Reckless
    Driving) en Vermont?
  choices:
    A: 5 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: C
  explanation: La conducción temeraria es una infracción mayor en Vermont y resulta
    en 10 puntos, lo que provoca la suspensión inmediata de la licencia.
- id: 69
  category: driver_responsibility
  question: 'En Vermont, un niño debe estar asegurado en un asiento de seguridad para
    niños orientado hacia atrás hasta que tenga al menos:'
  choices:
    A: 6 meses de edad
    B: 1 año de edad y 20 libras
    C: 2 años de edad
    D: 4 años de edad
  answer: B
  explanation: La ley de Vermont exige que los niños utilicen un asiento de seguridad
    orientado hacia atrás hasta que tengan al menos un año de edad Y pesen al menos
    20 libras.
- id: 70
  category: driver_responsibility
  question: En Vermont, si es declarado culpable de 'Eludir a un oficial de la ley',
    ¿cuántos puntos se añaden a su registro de conducción?
  choices:
    A: 5 puntos
    B: 8 puntos
    C: 10 puntos
    D: 15 puntos
  answer: C
  explanation: Eludir a un oficial de la ley es una infracción mayor en Vermont y
    conlleva una penalización de 10 puntos.
- id: 71
  category: driver_responsibility
  question: ¿En Vermont, cuántos puntos se asignan por exceso de velocidad en una
    zona escolar designada?
  choices:
    A: El doble de los puntos estándar para esa velocidad
    B: Un total fijo de 5 puntos
    C: Un total fijo de 8 puntos
    D: No se asignan puntos por infracciones en zonas escolares
  answer: A
  explanation: En Vermont, los puntos por exceso de velocidad en una zona escolar
    designada se duplican (por ejemplo, de 1 a 10 mph por encima del límite se convierten
    en 4 puntos en lugar de 2).
- id: 72
  category: safe_driving_rules
  question: ¿En Vermont, cuál es el límite de velocidad no señalizado en las carreteras
    estatales?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: Según el Manual del Conductor de Vermont, el límite de velocidad en
    las carreteras estatales es de 50 mph, a menos que se indique lo contrario.
- id: 73
  category: safe_driving_rules
  question: Cuando tenga la intención de girar, ¿con cuántos pies de antelación debe
    señalizar su intención antes del giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Vermont exige que los conductores señalicen su intención
    de girar al menos 100 pies antes de realizar el giro.
- id: 74
  category: safe_driving_rules
  question: Al estacionar cerca de una intersección, ¿cuál es la distancia mínima
    que debe mantener con respecto a una señal de alto (stop sign) o una baliza intermitente?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Vermont prohíbe estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de alto o señal de control de tráfico situada al lado
    de una carretera.
- id: 75
  category: safe_driving_rules
  question: 'La ley de Vermont exige que los conductores enciendan los faros delanteros
    siempre que utilicen los limpiaparabrisas debido a la precipitación. Esto se conoce
    como la ley de:'
  choices:
    A: Limpiaparabrisas encendidos, luces encendidas (Wipers On, Lights On)
    B: Regla del día lluvioso
    C: Ley de visibilidad
    D: Regulación de vista despejada
  answer: A
  explanation: La ley de Vermont (23 V.S.A. § 1243) exige que los faros delanteros
    estén encendidos siempre que los limpiaparabrisas del vehículo estén en uso debido
    a la precipitación o cualquier otra condición que cause poca visibilidad.
- id: 76
  category: safe_driving_rules
  question: Cuando un autobús escolar se detiene con sus luces rojas intermitentes
    en una carretera con calzadas separadas (divididas por una mediana), ¿qué conductores
    deben detenerse?
  choices:
    A: Los conductores en todos los carriles deben detenerse
    B: Solo los conductores que siguen al autobús deben detenerse
    C: Solo los conductores en la misma calzada que el autobús deben detenerse
    D: Nadie está obligado a detenerse si hay una mediana
  answer: C
  explanation: En Vermont, si un autobús escolar se detiene en una carretera dividida
    con una mediana o barrera, solo el tráfico que circula en la misma dirección que
    el autobús está obligado a detenerse.
- id: 77
  category: safe_driving_rules
  question: 'El Manual del Conductor de Vermont recomienda mantener una distancia
    de seguimiento de al menos:'
  explanation: El Manual del Conductor de Vermont recomienda una distancia de seguimiento
    de al menos cuatro segundos para permitir suficiente tiempo para reaccionar ante
    los peligros.
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: C
- id: 78
  category: safe_driving_rules
  question: En una parada de cuatro vías (four-way stop), si dos vehículos llegan
    al mismo tiempo, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo de la izquierda
    B: El vehículo de la derecha
    C: El vehículo que circula a mayor velocidad
    D: El vehículo que señaliza primero
  answer: B
  explanation: En las intersecciones donde todas las direcciones tienen señales de
    alto, el conductor de la izquierda debe ceder el derecho de paso al conductor
    de la derecha.
- id: 79
  category: safe_driving_rules
  question: Según la ley de Vermont, ¿cuándo está permitido adelantar a otro vehículo
    por la derecha?
  choices:
    A: Cuando el vehículo de adelante está girando o está a punto de girar a la izquierda
    B: Siempre que se encuentre en una carretera de dos carriles
    C: Cuando el vehículo de adelante circula por debajo del límite de velocidad
    D: Nunca es legal adelantar por la derecha en Vermont
  answer: A
  explanation: Adelantar por la derecha está permitido en Vermont cuando el vehículo
    que se adelanta está girando o está a punto de girar a la izquierda, siempre que
    haya suficiente anchura de pavimento.
- id: 80
  category: safe_driving_rules
  question: ¿Cuál es la sanción por exceso de velocidad en una zona de obras en una
    carretera de Vermont cuando hay trabajadores presentes?
  choices:
    A: Una multa fija de $500
    B: La multa se duplica
    C: Suspensión automática de la licencia por 30 días
    D: La multa se triplica
  answer: B
  explanation: En Vermont, las multas por exceso de velocidad se duplican en las zonas
    de obras señalizadas cuando hay trabajadores presentes.
- id: 81
  category: safe_driving_rules
  question: 'Al girar a la izquierda en una intersección, debe ceder el derecho de
    paso a:'
  choices:
    A: Nadie, siempre que tenga la luz verde
    B: Solo a los peatones
    C: Solo a los vehículos que vienen por la derecha
    D: Cualquier vehículo que se aproxime desde la dirección opuesta
  answer: D
  explanation: La ley de Vermont establece que un conductor que gira a la izquierda
    dentro de una intersección debe ceder el derecho de paso a cualquier vehículo
    que se aproxime desde la dirección opuesta que esté dentro de la intersección
    o tan cerca que constituya un peligro inmediato.
- id: 82
  category: safe_driving_rules
  question: 'Al rebasar una bicicleta que viaja en la misma dirección en Vermont,
    un automovilista debe dejar una distancia de seguridad de al menos:'
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: La ley de Vermont (23 V.S.A. § 1033) exige que los automovilistas rebasen
    a los usuarios vulnerables (incluidos los ciclistas) con al menos 4 pies de distancia.
- id: 83
  category: safe_driving_rules
  question: ¿A menos que se indique lo contrario, cuál es el límite de velocidad en
    una ciudad, pueblo o villa de Vermont?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: D
  explanation: En Vermont, el límite de velocidad predeterminado en cualquier ciudad,
    pueblo o villa es de 35 mph, a menos que se indique un límite diferente.
- id: 84
  category: safe_driving_rules
  question: En Vermont, ¿con cuánta antelación debe señalizar antes de realizar un
    giro o cambiar de carril?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: La ley de Vermont exige que los conductores señalicen su intención
    de girar o cambiar de carril al menos 100 pies antes de realizar la maniobra.
- id: 85
  category: safe_driving_rules
  question: Bajo la ley de Vermont, ¿está prohibido estacionar a menos de cuántos
    pies de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: Es ilegal estacionar un vehículo a menos de 15 pies de un hidrante
    de incendios en Vermont.
- id: 86
  category: safe_driving_rules
  question: En Vermont, ¿no puede estacionar su vehículo a menos de cuántos pies de
    un cruce peatonal en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: Las regulaciones de Vermont establecen que no se puede estacionar a
    menos de 20 pies de un cruce peatonal en una intersección.
- id: 87
  category: safe_driving_rules
  question: Al estacionar cerca de un cruce de ferrocarril en Vermont, ¿cuál es la
    distancia mínima que debe mantener con respecto al riel más cercano?
  choices:
    A: 15 pies
    B: 25 pies
    C: 50 pies
    D: 100 pies
  answer: C
  explanation: Los conductores en Vermont no deben estacionar a menos de 50 pies del
    riel más cercano de un cruce de ferrocarril.
- id: 88
  category: safe_driving_rules
  question: 'Al encontrarse con un vehículo que viene en dirección opuesta por la
    noche en Vermont, debe bajar sus luces altas cuando el vehículo esté a menos de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Vermont exige que cambie a luces bajas cuando un vehículo
    que viene en dirección opuesta esté a menos de 500 pies para evitar cegar al otro
    conductor.
- id: 89
  category: safe_driving_rules
  question: 'En Vermont, al seguir a otro vehículo desde atrás por la noche, debe
    bajar sus luces altas cuando se encuentre a menos de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Debe cambiar a luces bajas cuando siga a otro vehículo a menos de 300
    pies para evitar el deslumbramiento en los espejos del conductor que va adelante.
- id: 90
  category: safe_driving_rules
  question: 'Para mantener una distancia de seguimiento segura bajo condiciones normales
    de conducción, el Manual del Conductor de Vermont recomienda utilizar la:'
  choices:
    A: Regla de los dos segundos
    B: Regla de los tres segundos
    C: Regla de los cuatro segundos
    D: Regla de los cinco segundos
  answer: C
  explanation: El Manual del Conductor de Vermont recomienda una distancia de seguimiento
    de cuatro segundos para permitir suficiente tiempo para reaccionar ante los peligros.
- id: 91
  category: safe_driving_rules
  question: 'En Vermont, debe detenerse ante un autobús escolar con luces rojas intermitentes
    a menos que:'
  choices:
    A: Esté viajando en la dirección opuesta en una carretera dividida con una mediana
      o barrera
    B: Tenga prisa y el autobús haya estado detenido por más de dos minutos
    C: El autobús esté detenido en una carretera de cuatro o más carriles sin mediana
    D: Esté viajando al límite de velocidad y no pueda detenerse de manera segura
  answer: A
  explanation: Los conductores no necesitan detenerse ante un autobús escolar con
    luces rojas intermitentes si viajan en la dirección opuesta en una carretera dividida
    donde las calzadas están separadas por una barrera física o una mediana sin pavimentar.
- id: 92
  category: safe_driving_rules
  question: Al entrar en una rotonda en Vermont, ¿a quién debe ceder el derecho de
    paso?
  choices:
    A: Al tráfico que entra por la derecha
    B: Al tráfico que ya se encuentra en la rotonda
    C: A nadie; usted tiene el derecho de paso al entrar
    D: Solo a los vehículos de emergencia
  answer: B
  explanation: Los conductores que entran en una rotonda deben ceder el paso al tráfico
    que ya está circulando dentro de la misma.
- id: 93
  category: defensive_driving
  question: Según el Manual del Conductor de Vermont, ¿cuál es la distancia de seguimiento
    recomendada detrás del vehículo que va delante de usted en condiciones ideales?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: C
  explanation: El Manual del Conductor de Vermont recomienda usar la 'regla de los
    cuatro segundos' para mantener una distancia de seguimiento segura en condiciones
    de conducción ideales.
- id: 94
  category: defensive_driving
  question: En Vermont, ¿cuándo está legalmente obligado a encender los faros delanteros
    en relación con las condiciones climáticas?
  choices:
    A: Solo cuando está oscuro afuera
    B: Siempre que esté usando los limpiaparabrisas debido a la precipitación
    C: Solo durante una nevada intensa
    D: Solo cuando la visibilidad es inferior a 100 pies
  answer: B
  explanation: La ley de Vermont exige que los conductores enciendan los faros delanteros
    siempre que los limpiaparabrisas estén en uso debido a la lluvia, la nieve u otra
    precipitación.
- id: 95
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar a ocurrir el hidroplaneo (los neumáticos
    pierden contacto con la carretera debido al agua) en las carreteras mojadas de
    Vermont?
  choices:
    A: Tan solo a 35 mph
    B: Solo por encima de 55 mph
    C: Solo durante una lluvia con fuerza de huracán
    D: A cualquier velocidad superior a 15 mph
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    A 50 mph, los neumáticos pueden perder todo contacto con la superficie de la carretera
    si hay suficiente agua.
- id: 96
  category: defensive_driving
  question: Para evitar frenar a último momento o la necesidad de girar, ¿con cuánta
    anticipación debe escanear el camino mientras conduce en Vermont?
  choices:
    A: De 2 a 5 segundos
    B: De 5 a 8 segundos
    C: De 10 a 15 segundos
    D: De 20 a 30 segundos
  answer: C
  explanation: El Manual del Conductor de Vermont sugiere escanear el camino con 10
    a 15 segundos de anticipación para identificar posibles peligros a tiempo.
- id: 97
  category: defensive_driving
  question: Bajo la ley de Vermont, ¿cuál es la distancia mínima que un automovilista
    debe mantener al rebasar a un usuario vulnerable, como un ciclista o un peatón?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: La ley de Vermont (23 V.S.A. § 1033) exige que los automovilistas rebasen
    a los usuarios vulnerables, incluidos los ciclistas, con un espacio libre mínimo
    de 4 pies.
- id: 98
  category: defensive_driving
  question: En Vermont, ¿cuál es la forma más segura de manejar un derrape en una
    carretera helada?
  choices:
    A: Pisar los frenos a fondo inmediatamente
    B: Girar el volante en la dirección opuesta al derrape
    C: Poner el coche en punto muerto (neutral) y apagar el motor
    D: Quitar el pie del acelerador y girar el volante en la dirección en la que desea
      que vaya la parte delantera del vehículo
  answer: D
  explanation: Para recuperarse de un derrape, debe evitar frenar, soltar el acelerador
    y girar en la dirección en la que desea que vaya el vehículo.
- id: 99
  category: defensive_driving
  question: Al conducir con niebla densa en Vermont, ¿qué ajuste de faros debe utilizar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Ninguna luz, para reducir el resplandor
  answer: B
  explanation: Se deben usar las luces bajas en condiciones de niebla. Las luces altas
    se reflejan en la niebla y causan resplandor, lo que dificulta la visión.
- id: 100
  category: defensive_driving
  question: 'En Vermont, la ley le exige usar los faros delanteros siempre que la
    visibilidad se reduzca a menos de:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 700 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Vermont establece que los faros delanteros deben usarse cuando
    la visibilidad es inferior a 500 pies debido a luz insuficiente o condiciones
    atmosféricas desfavorables.
- id: 101
  category: defensive_driving
  question: Al acercarse a un cruce de ferrocarril en Vermont, ¿a cuántos pies del
    riel más cercano debe detener su vehículo?
  choices:
    A: De 5 a 20 pies
    B: De 10 a 25 pies
    C: De 15 a 50 pies
    D: De 25 a 75 pies
  answer: C
  explanation: La ley de Vermont exige que los conductores se detengan entre 15 y
    50 pies del riel más cercano en un cruce de ferrocarril cuando las señales están
    parpadeando o se aproxima un tren.
- id: 102
  category: defensive_driving
  question: ¿Cuántos puntos se asignan a su historial de conducción de Vermont por
    una condena de 'Seguir demasiado de cerca' (tailgating)?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: B
  explanation: En Vermont, 'Seguir demasiado de cerca' es una infracción de tránsito
    que resulta en la adición de 2 puntos a su historial de conducción.
- id: 103
  category: defensive_driving
  question: 'Al conducir detrás de un camión grande o autobús en Vermont, debe aumentar
    su distancia de seguimiento porque:'
  choices:
    A: Tienen puntos ciegos más grandes (No-Zones)
    B: Requieren más espacio para detenerse
    C: Pueden rociar escombros o agua sobre su parabrisas
    D: Todas las anteriores
  answer: D
  explanation: La conducción defensiva en Vermont implica dar espacio adicional a
    los vehículos grandes debido a su visibilidad limitada, distancias de frenado
    más largas y la posibilidad de salpicaduras en la carretera.
- id: 104
  category: defensive_driving
  question: Si está conduciendo en Vermont y sus frenos dejan de funcionar, ¿cuál
    es la primera acción defensiva que debe tomar?
  choices:
    A: Apagar el motor inmediatamente
    B: Cambiar a una marcha más baja y bombear el pedal del freno varias veces
    C: Saltar del coche
    D: Cambiar a reversa
  answer: B
  explanation: Si sus frenos fallan, debe cambiar a una marcha más baja para usar
    el frenado del motor y bombear el pedal del freno rápidamente para generar suficiente
    presión hidráulica para detenerse.
- id: 105
  category: defensive_driving
  question: Para evitar frenar a último momento o la necesidad de girar repentinamente,
    ¿qué tan adelante en la carretera sugieren la ley y las pautas de seguridad de
    Vermont que debe mirar?
  choices:
    A: De 5 a 10 segundos
    B: De 10 a 15 segundos
    C: De 20 a 30 segundos
    D: Tan lejos como la siguiente intersección
  answer: B
  explanation: Las pautas de conducción defensiva de Vermont establecen que debe mirar
    de 10 a 15 segundos por delante de su vehículo para anticipar peligros.
- id: 106
  category: defensive_driving
  question: Bajo la ley de 'Usuario Vulnerable' de Vermont, ¿cuánto espacio debe dejar
    un conductor al rebasar a una persona que va en bicicleta o camina por el arcén
    (shoulder)?
  choices:
    A: Al menos 2 pies
    B: Al menos 3 pies
    C: Al menos 4 pies
    D: Al menos 6 pies
  answer: C
  explanation: La ley de Vermont (23 V.S.A. § 1033) exige que los automovilistas dejen
    al menos 4 pies de espacio libre al rebasar a un usuario vulnerable, como un ciclista
    o un peatón.
- id: 107
  category: defensive_driving
  question: En Vermont, si los limpiaparabrisas de su vehículo están en uso debido
    a la lluvia, nieve o aguanieve, ¿qué más debe estar encendido por ley?
  choices:
    A: Luces de emergencia
    B: Luces interiores
    C: Luces antiniebla
    D: Luces delanteras (headlights)
  answer: D
  explanation: La ley de Vermont exige que las luces delanteras estén encendidas siempre
    que los limpiaparabrisas del vehículo estén en uso debido a la precipitación o
    cuando la visibilidad sea inferior a 500 pies.
- id: 108
  category: defensive_driving
  question: Al conducir en una carretera de Vermont con dos o más carriles en la misma
    dirección, ¿qué debe hacer al acercarse a un vehículo de emergencia estacionado
    con luces intermitentes?
  choices:
    A: Mantener la velocidad pero moverse al carril izquierdo
    B: Reducir la velocidad y, si es seguro, moverse a un carril que no sea adyacente
      al vehículo de emergencia
    C: Detenerse inmediatamente en la calzada
    D: Acelerar para pasar el área rápidamente
  answer: B
  explanation: La ley de 'Hacerse a un lado' (Move Over) de Vermont exige que los
    conductores reduzcan la velocidad y cambien de carril (si es seguro) para proporcionar
    un margen de seguridad a los vehículos de emergencia y de mantenimiento detenidos
    a un lado de la carretera.
- id: 109
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (hydroplaning) en lluvia
    intensa, donde los neumáticos pierden contacto con la superficie de la carretera?
  choices:
    A: Tan bajo como 35 mph
    B: Solo por encima de 55 mph
    C: Solo por encima de 65 mph
    D: A cualquier velocidad superior a 15 mph
  answer: A
  explanation: El Manual del Conductor de Vermont advierte que el hidroplaneo puede
    comenzar a velocidades tan bajas como 35 mph, y los neumáticos pueden perder todo
    contacto con la carretera a 55 mph.
- id: 110
  category: defensive_driving
  question: ¿Qué exige la ley de Vermont (23 V.S.A. § 1129) que hagan los conductores
    con respecto a la nieve y el hielo en sus vehículos?
  choices:
    A: Solo limpiar el parabrisas del lado del conductor
    B: Limpiar solo las ventanas delanteras y traseras
    C: Retirar todo el hielo o la nieve acumulada que pueda representar una amenaza
      para los demás
    D: Nada; no es un requisito legal
  answer: C
  explanation: La ley de Vermont exige que los conductores limpien la nieve y el hielo
    de su vehículo para que no obstruya su visión ni se desprenda y ponga en peligro
    a otros automovilistas.
- id: 111
  category: defensive_driving
  question: Al entrar en una glorieta en Vermont, ¿cuál de las siguientes es una práctica
    correcta de conducción defensiva?
  choices:
    A: Siempre ceder el paso al tráfico que entra por la derecha
    B: Ceder el paso al tráfico que ya está en el círculo
    C: Detenerse antes de entrar incluso si no hay tráfico presente
    D: Acelerar para incorporarse al flujo de tráfico
  answer: B
  explanation: En las glorietas de Vermont, el tráfico que entra debe ceder siempre
    el derecho de paso al tráfico que ya está circulando en la glorieta.
- id: 112
  category: defensive_driving
  question: Si está conduciendo en Vermont y se encuentra con niebla densa, ¿qué ajuste
    de luces debe utilizar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Sin luces
  answer: B
  explanation: Se requieren luces bajas en la niebla porque las luces altas se reflejan
    en la humedad del aire, lo que provoca deslumbramiento y dificulta la visión.
- id: 113
  category: defensive_driving
  question: Cuando un autobús escolar se detiene con sus luces rojas parpadeando y
    el brazo de parada extendido en una carretera de Vermont, ¿cuándo se le permite
    pasar?
  choices:
    A: Si se encuentra en el lado opuesto de una autopista dividida
    B: Si el conductor del autobús le indica que pase
    C: Nunca; debe detenerse desde cualquier dirección hasta que las luces dejen de
      parpadear
    D: Solo si hay al menos dos carriles entre usted y el autobús
  answer: C
  explanation: En Vermont, debe detenerse ante un autobús escolar con luces rojas
    parpadeantes independientemente de la dirección en la que viaje, incluso en autopistas
    divididas.
- id: 114
  category: defensive_driving
  question: 'Para prevenir la ''hipnosis de carretera'' durante viajes largos en las
    autopistas interestatales de Vermont, el manual recomienda:'
  choices:
    A: Beber café cada hora
    B: Descansar los ojos mirando el piso del vehículo ocasionalmente
    C: Mover los ojos y mirar diferentes objetos
    D: Poner la radio al volumen máximo
  answer: C
  explanation: La conducción defensiva implica mantener los ojos en movimiento. Cambiar
    el enfoque a diferentes distancias y objetos ayuda a prevenir el estado de trance
    conocido como hipnosis de carretera.
- id: 115
  category: alcohol_drugs_health
  question: 'Según la ley de Vermont, una condena por DUI (conducir bajo la influencia)
    por primera vez puede resultar en una pena máxima de prisión de hasta:'
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: D
  explanation: En Vermont, un DUI por primera vez es un delito menor que conlleva
    una posible sanción penal de hasta dos años de prisión.
- id: 116
  category: alcohol_drugs_health
  question: La 'Ley de Contenedor Abierto' de Vermont prohíbe la posesión de un contenedor
    abierto de alcohol en el área de pasajeros de un vehículo motorizado. ¿Dónde es
    legal llevar un contenedor abierto?
  choices:
    A: En la guantera
    B: En la consola central
    C: En el maletero
    D: Debajo del asiento del conductor
  answer: C
  explanation: Los contenedores abiertos de alcohol deben guardarse en un área que
    no esté ocupada normalmente por el conductor o los pasajeros, como el maletero
    o detrás del último asiento vertical en un vehículo sin maletero.
- id: 117
  category: alcohol_drugs_health
  question: 'Si se sospecha que un conductor de Vermont conduce bajo la influencia
    de drogas, se puede llamar a un oficial especialmente capacitado para realizar
    una evaluación clínica. Este oficial es conocido como:'
  choices:
    A: Agente de Control de Narcóticos
    B: Experto en Reconocimiento de Drogas (DRE)
    C: Especialista en Deterioro Químico
    D: Técnico de Sobriedad de Campo
  answer: B
  explanation: Vermont utiliza Expertos en Reconocimiento de Drogas (DRE, por sus
    siglas en inglés) que están capacitados para identificar el deterioro causado
    por categorías específicas de drogas distintas al alcohol.
- id: 118
  category: alcohol_drugs_health
  question: 'En Vermont, si tiene una condena previa por DUI y se niega a someterse
    a una prueba de aliento probatoria tras un segundo arresto, puede ser acusado
    de:'
  choices:
    A: Solo una infracción de tráfico civil
    B: Negativa Criminal
    C: Obstrucción de la Justicia
    D: Peligro Temerario
  answer: B
  explanation: Si bien una primera negativa es generalmente un asunto civil que conlleva
    la suspensión de la licencia, negarse a una prueba cuando se tiene una condena
    previa por DUI es un delito penal en Vermont.
- id: 119
  category: alcohol_drugs_health
  question: ¿Cuál es la multa máxima por una condena de DUI por primera vez en el
    estado de Vermont (excluyendo costas y cargos judiciales)?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,500
  answer: B
  explanation: Según 23 V.S.A. § 1210, una persona condenada por un DUI por primera
    vez en Vermont puede ser multada con no más de $750.00.
- id: 120
  category: alcohol_drugs_health
  question: 'Un conductor menor de 21 años que se encuentre con un BAC (concentración
    de alcohol en sangre) de 0.02% o superior por primera vez tendrá sus privilegios
    de conducir en Vermont suspendidos por:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: La ley de 'Tolerancia Cero' de Vermont exige una suspensión de la licencia
    de 6 meses por una primera infracción de 0.02% de BAC por parte de un menor.
- id: 121
  category: alcohol_drugs_health
  question: Para recuperar los privilegios de conducción tras una suspensión por DUI
    en Vermont, es posible que se le exija al conductor instalar un Dispositivo de
    Bloqueo de Encendido (IID). ¿Quién es responsable de los costos de instalación
    y mantenimiento?
  choices:
    A: El DMV de Vermont
    B: El departamento de policía local
    C: El conductor
    D: La compañía de seguros del conductor
  answer: C
  explanation: El conductor es el único responsable de todos los costos asociados
    con la instalación, el arrendamiento y el mantenimiento de un Dispositivo de Bloqueo
    de Encendido.
- id: 122
  category: alcohol_drugs_health
  question: 'Si un conductor de Vermont tiene una condición médica (como epilepsia
    o diabetes) que podría afectar su capacidad para conducir de manera segura, la
    ley le exige:'
  choices:
    A: Conducir solo durante las horas del día
    B: Informar la condición al DMV
    C: Llevar una nota del médico en todo momento
    D: Entregar su licencia de inmediato
  answer: B
  explanation: La ley de Vermont exige que los conductores notifiquen al DMV sobre
    cualquier condición física o mental que pueda afectar su capacidad para operar
    un vehículo motorizado de manera segura.
- id: 123
  category: alcohol_drugs_health
  question: 'Cuando el alcohol se combina con otras drogas, como tranquilizantes o
    medicamentos para el resfriado, el efecto sobre la capacidad de conducción es:'
  choices:
    A: Reducido porque se anulan entre sí
    B: El mismo que si solo se hubiera consumido alcohol
    C: Multiplicado (efecto sinérgico)
    D: Impredecible pero generalmente más seguro
  answer: C
  explanation: Combinar alcohol con otras drogas puede multiplicar los efectos de
    ambos, lo que provoca un deterioro grave incluso si se consumen cantidades pequeñas.
- id: 124
  category: alcohol_drugs_health
  question: 'En Vermont, una condena por DUI que resulte en la muerte de otra persona
    puede conllevar una pena de prisión de hasta:'
  choices:
    A: 5 años
    B: 10 años
    C: 15 años
    D: 25 años
  answer: C
  explanation: El DUI con resultado de muerte es un delito grave en Vermont, castigado
    con hasta 15 años de prisión.
- id: 125
  category: alcohol_drugs_health
  question: ¿Cómo afecta específicamente el consumo de alcohol a la visión de un conductor?
  choices:
    A: Mejora la visión nocturna
    B: Aumenta la visión periférica (lateral)
    C: Reduce la capacidad de juzgar distancias y velocidades
    D: Hace que los colores parezcan más vivos
  answer: C
  explanation: El alcohol afecta los músculos oculares, reduciendo la capacidad de
    enfoque y degradando significativamente la percepción de profundidad y la capacidad
    de juzgar la velocidad de otros vehículos.
- id: 126
  category: alcohol_drugs_health
  question: 'Si está tomando un medicamento recetado y un médico no le ha advertido
    sobre la conducción, pero el medicamento le provoca somnolencia, usted debe:'
  choices:
    A: Conducir solo por carreteras conocidas
    B: Beber café antes de conducir para mantenerse despierto
    C: No conducir hasta que los efectos desaparezcan
    D: Conducir más rápido para llegar antes a su destino
  answer: C
  explanation: Independientemente de si un médico dio una advertencia, es responsabilidad
    legal del conductor asegurarse de no estar incapacitado. Si un medicamento causa
    somnolencia, no debe conducir.
- id: 127
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma efectiva de reducir su concentración
    de alcohol en sangre (BAC) antes de conducir?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Hacer ejercicio vigoroso
    D: Esperar a que pase el tiempo
  answer: D
  explanation: Solo el tiempo puede hacer que una persona recupere la sobriedad. El
    cuerpo oxida el alcohol a un ritmo constante, y el café, las duchas o el ejercicio
    no aceleran este proceso.
- id: 128
  category: alcohol_drugs_health
  question: 'Tras una condena por DUI en Vermont, un conductor debe mantener una ''Prueba
    de Responsabilidad Financiera'' (seguro SR-22) durante un mínimo de:'
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: Permanentemente
  answer: B
  explanation: Vermont generalmente requiere que los conductores presenten y mantengan
    un certificado SR-22 durante tres años después de una suspensión de licencia relacionada
    con un DUI.
- id: 129
  category: alcohol_drugs_health
  question: En Vermont, ¿cuál es la multa máxima por una condena de primera ofensa
    por conducir bajo la influencia (DUI)?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $1,500
  answer: B
  explanation: Según el Manual del Conductor de Vermont, una persona condenada por
    un primer DUI puede ser multada con hasta $750, más recargos judiciales.
- id: 130
  category: alcohol_drugs_health
  question: La 'Ley de Contenedor Abierto' de Vermont prohíbe la posesión de un recipiente
    abierto de alcohol en qué parte del vehículo?
  choices:
    A: Solo en el asiento del conductor
    B: Solo en el maletero
    C: El área de pasajeros de cualquier vehículo motorizado en una vía pública
    D: Solo si el motor está en marcha
  answer: C
  explanation: La ley de Vermont prohíbe la posesión de un recipiente abierto de bebida
    alcohólica en el área de pasajeros de cualquier vehículo motorizado ubicado en
    una vía pública.
- id: 131
  category: alcohol_drugs_health
  question: ¿Una segunda condena por DUI en Vermont resultará en una suspensión de
    la licencia de conducir de al menos cuántos meses?
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: C
  explanation: Una segunda condena por DUI en Vermont conlleva una suspensión obligatoria
    de la licencia de 18 meses.
- id: 132
  category: alcohol_drugs_health
  question: ¿Cuál es la pena máxima de prisión por una primera condena por DUI en
    Vermont?
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: D
  explanation: En Vermont, una primera condena por DUI puede resultar en una pena
    de prisión de hasta 2 años.
- id: 133
  category: alcohol_drugs_health
  question: Si se suspende la licencia de conducir de Vermont por DUI, ¿el conductor
    puede ser elegible para conducir antes si participa en qué programa?
  choices:
    A: El Programa de Conducción Defensiva
    B: El Programa del Dispositivo de Interbloqueo de Encendido (IID)
    C: El Programa de Servicio Comunitario
    D: La Escuela de Rehabilitación de Conductores
  answer: B
  explanation: Vermont permite que los conductores con licencias suspendidas debido
    a un DUI soliciten una Licencia de Conducir Restringida (RDL) si instalan un Dispositivo
    de Interbloqueo de Encendido (IID).
- id: 134
  category: alcohol_drugs_health
  question: ¿Puede un conductor en Vermont ser acusado de DUI si conduce bajo la influencia
    de un medicamento recetado legalmente?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, el DUI solo se aplica al alcohol y las drogas ilegales
    C: Sí, si el medicamento afecta su capacidad para conducir de manera segura
    D: Sí, pero solo si también tiene alcohol en su sistema
  answer: C
  explanation: Las leyes de DUI de Vermont se aplican a cualquier sustancia que afecte
    la capacidad de una persona para conducir de manera segura, incluidos los medicamentos
    recetados y de venta libre.
- id: 135
  category: alcohol_drugs_health
  question: ¿Se considera que un conductor de Vermont tiene un "DUI Agravado" si su
    Contenido de Alcohol en Sangre (BAC) es igual o superior a qué nivel?
  choices:
    A: 0.10%
    B: 0.12%
    C: 0.16%
    D: 0.20%
  answer: C
  explanation: La ley de Vermont define un "DUI Agravado" como la operación de un
    vehículo con un BAC de 0.16% o superior, lo que conlleva sanciones mayores.
- id: 136
  category: alcohol_drugs_health
  question: ¿Cuánto tiempo le toma normalmente al cuerpo humano procesar y eliminar
    el alcohol de una bebida estándar (12 oz de cerveza, 5 oz de vino o 1.5 oz de
    licor)?
  choices:
    A: 30 minutos
    B: 1 hora
    C: 2 horas
    D: 4 horas
  answer: B
  explanation: En promedio, el cuerpo tarda aproximadamente una hora en procesar el
    alcohol de una bebida estándar. Solo el tiempo puede hacer que una persona recupere
    la sobriedad.
- id: 137
  category: alcohol_drugs_health
  question: 'Si tiene una condición física o mental que pueda afectar su capacidad
    para conducir de manera segura, debe notificar al DMV de Vermont dentro de:'
  choices:
    A: 10 días
    B: 30 días
    C: 6 meses
    D: Su próxima renovación de licencia
  answer: B
  explanation: La ley de Vermont exige que los conductores informen al DMV sobre cualquier
    condición física o mental que pueda afectar su capacidad para conducir de manera
    segura dentro de los 30 días posteriores al inicio o cambio de la condición.
- id: 138
  category: alcohol_drugs_health
  question: Según la ley de Vermont, ¿cuál es el estatus legal de conducir bajo los
    efectos de la marihuana?
  choices:
    A: Es legal porque la marihuana es legal en Vermont
    B: Es solo ilegal si el conductor es menor de 21 años
    C: Es ilegal y se trata como un DUI
    D: Es solo una multa civil, no un delito penal
  answer: C
  explanation: Aunque la marihuana recreativa es legal en Vermont, conducir bajo los
    efectos del THC es ilegal y se procesa bajo las leyes de DUI del estado.
- id: 139
  category: penalties_and_points
  question: Si un conductor de Vermont es condenado por exceso de velocidad a más
    de 30 millas por hora sobre el límite, ¿cuántos puntos se agregarán a su registro?
  choices:
    A: 5 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: B
  explanation: Conducir a 31 mph o más sobre el límite de velocidad establecido es
    una infracción grave en Vermont y conlleva una penalización de 8 puntos.
- id: 140
  category: penalties_and_points
  question: ¿Cuál es la penalización de puntos por una primera condena por usar un
    dispositivo electrónico portátil de mano mientras se conduce en Vermont?
  choices:
    A: 0 puntos
    B: 2 puntos
    C: 5 puntos
    D: 10 puntos
  answer: B
  explanation: Una primera infracción por usar un dispositivo electrónico de mano
    mientras se conduce en Vermont resulta en 2 puntos. Las infracciones posteriores
    resultan en 5 puntos.
- id: 141
  category: penalties_and_points
  question: ¿Una condena por 'Operación descuidada y negligente' de un vehículo motorizado
    en Vermont resulta en cuántos puntos?
  choices:
    A: 5 puntos
    B: 8 puntos
    C: 10 puntos
    D: 15 puntos
  answer: C
  explanation: La operación descuidada y negligente se considera una infracción mayor
    en Vermont y resulta en la sanción máxima de 10 puntos por una sola infracción.
- id: 142
  category: penalties_and_points
  question: Cuando un conductor de Vermont alcanza el umbral de 10 puntos por primera
    vez dentro de un período de dos años, ¿por cuánto tiempo se suspende su licencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: A
  explanation: En Vermont, la primera vez que acumula 10 puntos dentro de un período
    de dos años, su licencia se suspende por 10 días.
- id: 143
  category: penalties_and_points
  question: Si un conductor de Vermont acumula 20 puntos en su registro dentro de
    un período de dos años, ¿cuál es la duración de la suspensión de la licencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Según la ley de Vermont, acumular 20 puntos dentro de un período de
    dos años resulta en una suspensión de la licencia de 90 días.
- id: 144
  category: penalties_and_points
  question: En Vermont, ¿cuántos puntos se asignan por 'Operar después de la suspensión'
    de una licencia de conducir?
  choices:
    A: 5 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: C
  explanation: Operar un vehículo mientras su licencia ya está suspendida es una infracción
    mayor y conlleva una sanción de 10 puntos.
- id: 145
  category: penalties_and_points
  question: Bajo la ley 'Move Over' (Hacerse a un lado) de Vermont, ¿cuál es la multa
    máxima por no reducir la velocidad o cambiar de carril al acercarse a un vehículo
    de emergencia estacionado con luces intermitentes?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: La ley 'Move Over' de Vermont (23 V.S.A. § 1033) conlleva una multa
    de hasta $250 por no hacerse a un lado o no reducir la velocidad ante vehículos
    de emergencia.
- id: 146
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan en un registro de Vermont por no ceder el paso
    a un peatón en un cruce peatonal?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: C
  explanation: No ceder el paso a un peatón en un cruce peatonal marcado o no marcado
    resulta en 4 puntos en un registro de conducir de Vermont.
- id: 147
  category: penalties_and_points
  question: En Vermont, si se le condena por adelantar a otro vehículo en una colina
    o curva donde la visibilidad está obstruida, ¿cuántos puntos se añaden a su registro?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 10 puntos
  answer: B
  explanation: Adelantar incorrectamente en una colina o curva es una infracción de
    4 puntos según el programa de puntos del DMV de Vermont.
- id: 148
  category: penalties_and_points
  question: En Vermont, ¿una condena por exceso de velocidad de más de 30 millas por
    hora sobre el límite de velocidad indicado resulta en cuántos puntos?
  choices:
    A: 5 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: B
  explanation: Exceder el límite de velocidad por más de 30 mph es una infracción
    mayor en Vermont y conlleva una sanción de 8 puntos.
- id: 149
  category: penalties_and_points
  question: Bajo la ley 'Move Over' de Vermont, ¿cuántos puntos se asignan por no
    ceder el paso a un vehículo de emergencia estacionado con sirenas o luces intermitentes?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 8 puntos
  answer: A
  explanation: No hacerse a un lado o no reducir la velocidad ante un vehículo de
    emergencia estacionado resulta en 2 puntos en su registro de conducir de Vermont.
- id: 150
  category: penalties_and_points
  question: Para una primera condena por DUI (conducir bajo la influencia) en Vermont,
    ¿por cuánto tiempo se suspenderá la licencia de un operador?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Una primera condena por DUI en Vermont resulta en una suspensión obligatoria
    de la licencia de 90 días.
- id: 151
  category: penalties_and_points
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la ley
    de cinturones de seguridad de Vermont para conductores adultos (18 años o más)?
  choices:
    A: Es una ley de aplicación primaria; pueden detenerlo únicamente por no usar
      el cinturón.
    B: Es una ley de aplicación secundaria; solo pueden multarlo si lo detienen por
      otra infracción.
    C: Los cinturones de seguridad son opcionales para conductores mayores de 21 años.
    D: Los cinturones de seguridad solo son obligatorios en las autopistas interestatales.
  answer: B
  explanation: En Vermont, la ley de cinturones de seguridad es secundaria para adultos
    (18+), lo que significa que un oficial solo puede emitir una multa si el vehículo
    fue detenido por otra presunta infracción.
- id: 152
  category: penalties_and_points
  question: En Vermont, la multa por usar un dispositivo electrónico portátil de mano
    mientras se conduce es ________ si la infracción ocurre en una zona de obras.
  choices:
    A: Exonerada por una primera infracción
    B: Reducida a la mitad
    C: Duplicada
    D: Triplicada
  answer: C
  explanation: Las multas por usar un dispositivo de mano mientras se conduce se duplican
    si la infracción ocurre en una zona de obras señalizada o en una zona escolar.
- id: 153
  category: penalties_and_points
  question: En Vermont, ¿cuántos puntos resultan de una condena por 'Intentar eludir
    a un oficial de policía'?
  choices:
    A: 5 puntos
    B: 8 puntos
    C: 10 puntos
    D: 15 puntos
  answer: C
  explanation: Intentar eludir a un oficial de policía es una infracción grave que
    conlleva 10 puntos, que es el umbral para la suspensión inmediata.
- id: 154
  category: penalties_and_points
  question: ¿Cuánto tiempo permanecen los puntos en un historial de conducción de
    Vermont a partir de la fecha de la condena?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: B
  explanation: Los puntos permanecen en el historial de conducción de Vermont por
    un período de dos años a partir de la fecha de la condena.
- id: 155
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una primera infracción de arrojar basura
    desde un vehículo motorizado en una carretera de Vermont?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Según la ley de Vermont, arrojar basura es ilegal y puede resultar
    en una multa de hasta $500 y/o servicio comunitario.
- id: 156
  category: penalties_and_points
  question: La ley de 'Contenedor Abierto' de Vermont establece que es ilegal poseer
    un recipiente abierto de alcohol en el área de pasajeros de un vehículo motorizado.
    ¿Quién es el principal responsable de esta infracción?
  choices:
    A: Solo los pasajeros
    B: El conductor del vehículo
    C: El propietario del vehículo, incluso si no está presente
    D: Solo la persona que sostiene el recipiente
  answer: B
  explanation: En Vermont, el conductor es responsable de asegurar que no haya recipientes
    abiertos de alcohol en el área de pasajeros del vehículo mientras se encuentre
    en una vía pública.
- id: 157
  category: sharing_the_road
  question: En Vermont, cuando un autobús escolar se detiene con sus luces rojas intermitentes
    y el brazo de parada extendido, ¿cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Solo necesita detenerse si viaja en la misma dirección que el autobús.
    B: Debe detenerse desde cualquier dirección, a menos que la carretera esté dividida
      por una mediana o barrera física.
    C: Puede rebasar al autobús a una velocidad no mayor a 10 mph.
    D: Solo necesita detenerse si hay niños cruzando la calle en ese momento.
  answer: B
  explanation: De acuerdo con el Manual del Conductor de Vermont y 23 V.S.A. § 1075,
    los conductores deben detenerse ante un autobús escolar con luces rojas intermitentes
    independientemente de la dirección en la que viajen, a menos que la carretera
    esté dividida por una mediana u otra barrera física.
- id: 158
  category: sharing_the_road
  question: 'Según la ley de Vermont, al rebasar a un ''usuario vulnerable'' (como
    un ciclista o peatón) en una carretera con doble línea amarilla, un automovilista
    puede:'
  choices:
    A: Nunca cruzar la doble línea amarilla para rebasar.
    B: Cruzar la doble línea amarilla solo si el ciclista le hace una señal para hacerlo.
    C: Cruzar la doble línea amarilla para rebasar si se puede hacer de manera segura
      y no hay tráfico en sentido contrario.
    D: Solo rebasar si hay una zona de rebase designada.
  answer: C
  explanation: La ley de Vermont (23 V.S.A. § 1033) permite a los automovilistas cruzar
    una doble línea amarilla en una zona de no rebasar para adelantar a un usuario
    vulnerable, siempre que se pueda hacer de manera segura y con una visión clara
    del tráfico que viene en sentido contrario.
- id: 159
  category: sharing_the_road
  question: En Vermont, si un peatón se encuentra en un cruce de peatones no marcado
    en una intersección, ¿qué debe hacer el conductor?
  choices:
    A: El conductor tiene el derecho de paso porque el cruce no está marcado.
    B: El conductor debe ceder el derecho de paso al peatón.
    C: El conductor debe tocar la bocina para advertir al peatón que espere.
    D: El conductor solo cede el paso si el límite de velocidad es inferior a 35 mph.
  answer: B
  explanation: La ley de Vermont exige que los conductores cedan el derecho de paso
    a los peatones tanto en los cruces marcados como en los no marcados en las intersecciones.
- id: 160
  category: sharing_the_road
  question: ¿Cuál es la ley de Vermont con respecto a la 'división de carril' (motocicletas
    que conducen entre filas de autos detenidos o en movimiento)?
  choices:
    A: Es legal si los autos se mueven a menos de 20 mph.
    B: Es legal solo en autopistas de carriles múltiples.
    C: Es ilegal en Vermont.
    D: Es legal para motocicletas pero no para ciclomotores.
  answer: C
  explanation: En Vermont, las motocicletas tienen derecho al uso total de un carril,
    y la división de carril (operar entre carriles de tráfico) está prohibida.
- id: 161
  category: sharing_the_road
  question: 'Al seguir a un camión grande en Vermont, si no puede ver la cara del
    conductor del camión en sus espejos laterales, usted se encuentra:'
  choices:
    A: En el punto ciego del camión (No-Zone).
    B: A una distancia de seguimiento segura.
    C: En la 'Zona Despejada' del camión.
    D: Listo para rebasar al camión.
  answer: A
  explanation: Si no puede ver la cara del conductor del camión en su espejo lateral,
    el conductor no puede verlo a usted. Se encuentra en una de las 'No-Zones' o puntos
    ciegos del camión.
- id: 162
  category: sharing_the_road
  question: 'Cuando un vehículo de emergencia con sirena y luces intermitentes se
    aproxima por detrás, la ley de Vermont le exige:'
  choices:
    A: Detenerse exactamente donde está.
    B: Aumentar la velocidad para apartarse del camino.
    C: Moverse hacia el borde derecho de la carretera y detenerse.
    D: Moverse hacia el borde izquierdo de la carretera y detenerse.
  answer: C
  explanation: La ley de Vermont exige que los conductores se muevan lo más a la derecha
    posible y se detengan hasta que el vehículo de emergencia haya pasado.
- id: 163
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los derechos
    de los ciclistas en las carreteras de Vermont?
  choices:
    A: Los ciclistas siempre deben circular por la acera.
    B: Los ciclistas tienen los mismos derechos y responsabilidades que los operadores
      de vehículos motorizados.
    C: Los ciclistas siempre deben circular en sentido contrario al flujo del tráfico.
    D: No se permiten ciclistas en las carreteras estatales.
  answer: B
  explanation: En Vermont, los ciclistas se consideran vehículos cuando están en la
    carretera y tienen los mismos derechos y responsabilidades que los automovilistas,
    incluyendo obedecer las señales y letreros de tráfico.
- id: 164
  category: sharing_the_road
  question: 'Según la ley de Vermont, usted NO tiene que detenerse ante un autobús
    escolar con luces rojas intermitentes si:'
  choices:
    A: Se encuentra en el lado opuesto de una carretera dividida separada por una
      mediana.
    B: El autobús está en una zona de velocidad de 50 mph.
    C: El autobús está detenido en un estacionamiento.
    D: Hay más de cuatro carriles de tráfico.
  answer: A
  explanation: Los conductores no están obligados a detenerse ante un autobús escolar
    con luces rojas intermitentes si viajan en la dirección opuesta en una carretera
    dividida donde los carriles están separados por una mediana o barrera física.
- id: 165
  category: sharing_the_road
  question: En Vermont, ¿la definición de 'usuario vulnerable' incluye cuál de los
    siguientes?
  choices:
    A: Peatones y ciclistas solamente.
    B: Motociclistas y conductores de camiones.
    C: Peatones, ciclistas, personas a caballo y trabajadores de la carretera.
    D: Solo niños y ancianos.
  answer: C
  explanation: La ley de Vermont (23 V.S.A. § 4) define a los 'usuarios vulnerables'
    de manera amplia para incluir a peatones, ciclistas, personas que montan a caballo,
    trabajadores de la carretera y personas que operan tractores agrícolas o sillas
    de ruedas.
- id: 166
  category: sharing_the_road
  question: ¿Cuál es el requisito de Vermont para los cascos de motocicleta?
  choices:
    A: Solo los conductores menores de 18 años deben usar casco.
    B: Los cascos son opcionales si el conductor tiene 2 años de experiencia.
    C: Todos los operadores y pasajeros deben usar un casco aprobado por el DOT.
    D: Los cascos solo son obligatorios en las autopistas interestatales.
  answer: C
  explanation: La ley de Vermont (23 V.S.A. § 1256) exige que todos los operadores
    y pasajeros de motocicletas usen un casco que cumpla con los estándares federales
    de seguridad.
- id: 167
  category: sharing_the_road
  question: Al andar en bicicleta de noche en Vermont, ¿qué equipo se requiere legalmente?
  choices:
    A: Una luz delantera blanca y una luz o reflector trasero rojo.
    B: Una luz delantera amarilla y una luz trasera blanca.
    C: No se requieren luces si el ciclista usa ropa reflectante.
    D: Un timbre y un reflector trasero blanco.
  answer: A
  explanation: La ley de Vermont exige que las bicicletas utilizadas de noche estén
    equipadas con una lámpara en la parte delantera que emita una luz blanca y un
    reflector o lámpara roja en la parte trasera.
- id: 168
  category: sharing_the_road
  question: En Vermont, ¿a qué distancia debe permanecer detrás de un camión de bomberos
    que viaja en respuesta a una alarma de incendio?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: De acuerdo con 23 V.S.A. § 1102, es ilegal seguir a cualquier camión
    de bomberos que viaje en respuesta a una alarma de incendio a menos de 500 pies.
- id: 169
  category: sharing_the_road
  question: 'Cuando vea a un peatón que lleva un bastón blanco o usa un perro guía
    en una intersección, usted debe:'
  choices:
    A: Tocar la bocina para avisarles que usted está allí.
    B: Ceder el derecho de paso y detenerse, incluso si tiene la luz verde.
    C: Conducir alrededor de ellos si hay espacio.
    D: Esperar a que le hagan una señal para pasar.
  answer: B
  explanation: La ley de Vermont exige que los conductores tomen precauciones adicionales
    y cedan el derecho de paso a los peatones ciegos o con discapacidad visual que
    utilicen un bastón blanco o un perro guía.
- id: 170
  category: sharing_the_road
  question: 'Al rebasar a una persona que monta a caballo o un vehículo tirado por
    caballos en Vermont, un conductor debe:'
  choices:
    A: Tocar la bocina para advertir al caballo de su presencia.
    B: Aumentar la velocidad para pasar lo más rápido posible.
    C: Reducir la velocidad y proceder con precaución para evitar asustar al animal.
    D: Encender las luces altas para ver mejor al caballo.
  answer: C
  explanation: La ley de Vermont (23 V.S.A. § 1127) exige que los automovilistas reduzcan
    la velocidad y tengan precaución al acercarse o rebasar animales para evitar que
    se asusten.
- id: 171
  category: sharing_the_road
  question: De acuerdo con la ley de Vermont, al rebasar a un 'usuario vulnerable'
    como un ciclista o peatón en la carretera, ¿cuál es la distancia mínima que debe
    mantener entre su vehículo y la persona?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: El Título 23 de Vermont, Sección 1033, exige que los conductores rebasen
    a los usuarios vulnerables (ciclistas, peatones, etc.) a una distancia segura,
    la cual se define como al menos cuatro pies.
- id: 172
  category: sharing_the_road
  question: Al seguir a una motocicleta en Vermont, ¿por qué debería mantener una
    distancia de seguimiento mayor que la que mantendría con un automóvil?
  choices:
    A: Las motocicletas deben detenerse en todas las intersecciones.
    B: Las motocicletas pueden detenerse mucho más rápido que otros vehículos.
    C: Las motocicletas tienen permitido legalmente retroceder por inercia.
    D: Las motocicletas tienen una velocidad máxima más alta.
  answer: B
  explanation: Debido a que las motocicletas son ligeras y tienen sistemas de frenado
    de alto rendimiento, pueden detenerse mucho más rápido que los automóviles; se
    recomienda una distancia de seguimiento de 3 a 4 segundos.
- id: 173
  category: sharing_the_road
  question: En Vermont, si usted está girando a la izquierda en una intersección y
    un ciclista se aproxima desde la dirección opuesta, ¿quién tiene el derecho de
    paso?
  choices:
    A: El vehículo motorizado, porque es más grande.
    B: El ciclista, porque viaja en línea recta.
    C: Quien llegue primero a la intersección.
    D: El vehículo motorizado, porque las bicicletas deben ceder el paso en todos
      los giros.
  answer: B
  explanation: Los ciclistas tienen los mismos derechos y responsabilidades que los
    conductores de vehículos motorizados. Un conductor que gira a la izquierda debe
    ceder el paso al tráfico que viene en sentido contrario, incluyendo las bicicletas,
    que siguen recto.
- id: 174
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle estrecha de Vermont,
    es posible que necesite:'
  choices:
    A: Mantenerse cerca del bordillo derecho durante todo el giro.
    B: Abrirse hacia la izquierda antes o durante el giro.
    C: Detenerse y retroceder para realizar el giro.
    D: Girar desde el carril situado más a la izquierda.
  answer: B
  explanation: Los camiones grandes tienen un radio de giro amplio y a menudo necesitan
    abrirse hacia la izquierda para no chocar con el bordillo en un giro a la derecha.
    Los conductores nunca deben intentar meterse entre el camión y el bordillo.
- id: 175
  category: sharing_the_road
  question: ¿A qué se refiere una 'No-Zone' (Zona Prohibida) con respecto a los camiones
    grandes en Vermont?
  choices:
    A: Un área restringida donde los camiones no pueden circular.
    B: El límite de velocidad regulado del camión.
    C: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión.
    D: El límite de peso para los puentes de Vermont.
  answer: C
  explanation: La 'No-Zone' se refiere a los grandes puntos ciegos alrededor de un
    camión donde el conductor del camión no puede ver a otros vehículos. Si usted
    no puede ver la cara del conductor del camión en su espejo lateral, él no puede
    verlo a usted.
- id: 176
  category: sharing_the_road
  question: 'En Vermont, se le exige ceder el derecho de paso a cualquier peatón ciego
    que lleve un bastón blanco o esté acompañado por un perro guía:'
  choices:
    A: Solo si se encuentran en un cruce de peatones marcado.
    B: Solo si el peatón le hace una señal para que se detenga.
    C: En todo momento, independientemente de si se encuentran en un cruce de peatones.
    D: Solo durante las horas del día.
  answer: C
  explanation: La ley de Vermont exige que los conductores tomen todas las precauciones
    necesarias para evitar lesiones a los peatones ciegos. Debe ceder el derecho de
    paso incluso si no se encuentran en un cruce de peatones formal.
- id: 177
  category: sharing_the_road
  question: ¿Es legal en Vermont el 'lane splitting' (una motocicleta que circula
    entre dos carriles de tráfico detenido o en movimiento)?
  choices:
    A: Sí, es legal a velocidades inferiores a 30 mph.
    B: Sí, pero solo en autopistas interestatales.
    C: No, es ilegal en Vermont.
    D: Sí, si la motocicleta está refrigerada por aire.
  answer: C
  explanation: En Vermont, las motocicletas tienen derecho al uso completo de un carril,
    y el 'lane splitting' (circular entre carriles de tráfico) está prohibido.
- id: 178
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene en una carretera de Vermont con sus
    luces amarillas (ámbar) parpadeando, ¿qué indica?
  choices:
    A: El autobús está a punto de detenerse y pronto activará las luces rojas parpadeantes.
    B: El autobús está cargando estudiantes y usted puede pasar con precaución.
    C: El autobús está sufriendo una falla mecánica.
    D: El autobús viaja a una velocidad de 10 mph por debajo del límite.
  answer: A
  explanation: Las luces ámbar parpadeantes en un autobús escolar son una advertencia
    para los conductores de que el autobús se está preparando para detenerse a cargar
    o descargar niños. Los conductores deben prepararse para detenerse.
- id: 179
  category: sharing_the_road
  question: 'Según la ley de Vermont, los ciclistas deben circular:'
  choices:
    A: Por la acera siempre que sea posible.
    B: En sentido contrario al tráfico para que puedan ver los coches.
    C: A favor del flujo del tráfico, tan a la derecha como sea seguro y práctico.
    D: En el centro exacto del carril en todo momento.
  answer: C
  explanation: Los ciclistas deben circular a favor del flujo del tráfico y, por lo
    general, mantenerse a la derecha, aunque pueden desplazarse a la izquierda para
    evitar peligros, girar a la izquierda o rebasar a otros vehículos.
- id: 180
  category: sharing_the_road
  question: 'Al rebasar a un camión grande, no debe volver al carril delante del camión
    hasta que:'
  choices:
    A: Pueda ver los faros del camión en su espejo retrovisor.
    B: Esté al menos a 10 pies por delante del camión.
    C: El conductor del camión le haga señales con las luces altas.
    D: Haya alcanzado el límite de velocidad.
  answer: A
  explanation: Debido a que los camiones tienen distancias de frenado largas, debe
    asegurarse de tener suficiente espacio antes de volver al carril. Ver los faros
    del camión en su espejo retrovisor garantiza una distancia segura.
- id: 181
  category: vehicle_information
  question: ¿De acuerdo con la ley de Vermont, con qué frecuencia debe un vehículo
    motorizado registrado someterse a una inspección de seguridad en una estación
    de inspección oficial?
  choices:
    A: Cada seis meses
    B: Una vez al año
    C: Cada dos años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: En Vermont, todos los vehículos motorizados registrados en el estado
    deben ser inspeccionados una vez al año en una estación de inspección oficial
    para garantizar que cumplan con los estándares de seguridad.
- id: 182
  category: vehicle_information
  question: En Vermont, ¿cuál es la profundidad mínima legal de la banda de rodadura
    para los neumáticos de un vehículo de pasajeros?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los estándares de inspección de seguridad de Vermont requieren que
    los neumáticos tengan al menos 2/32 de pulgada de profundidad de la banda de rodadura
    en las ranuras principales.
- id: 183
  category: vehicle_information
  question: Con respecto al polarizado de las ventanas, ¿cuál es la ley de Vermont
    para el parabrisas y las ventanas laterales delanteras (conductor y pasajero)?
  choices:
    A: Se permite cualquier polarizado siempre que sea inferior al 50%
    B: El polarizado de mercado secundario (aftermarket) está prohibido en el parabrisas
      y las ventanas laterales delanteras
    C: El polarizado solo se permite en las 4 pulgadas superiores de las ventanas
      laterales delanteras
    D: Solo se permite un 35% de polarizado en las ventanas laterales delanteras
  answer: B
  explanation: La ley de Vermont prohíbe la aplicación de polarizado de mercado secundario
    (aftermarket) en el parabrisas o en las ventanas a la izquierda y derecha del
    conductor, a menos que se obtenga una exención médica.
- id: 184
  category: vehicle_information
  question: ¿Qué exige la ley de 'Hielo y Nieve' de Vermont que hagan los conductores
    antes de operar su vehículo en una carretera pública?
  choices:
    A: Calentar el motor durante al menos 10 minutos
    B: Aplicar anticongelante a las cerraduras de las puertas
    C: Limpiar toda la nieve y el hielo de todo el vehículo para que no represente
      un peligro
    D: Solo limpiar el lado del conductor del parabrisas
  answer: C
  explanation: La ley de Vermont (Título 23, Sección 1129) exige que los conductores
    eliminen el hielo y la nieve acumulados del vehículo para que no salgan volando
    y pongan en peligro a otros automovilistas o peatones.
- id: 185
  category: vehicle_information
  question: Para pasar una inspección de seguridad de Vermont, ¿con cuántos espejos
    retrovisores debe estar equipado un vehículo como mínimo?
  choices:
    A: Solo un espejo interior
    B: Solo un espejo exterior en el lado del conductor
    C: Al menos dos espejos, uno de los cuales debe estar en el lado exterior izquierdo
    D: 'Tres espejos: uno interior y dos exteriores'
  answer: C
  explanation: Vermont requiere al menos dos espejos. Uno debe ser un espejo interior
    (a menos que esté obstruido) y uno debe ser un espejo exterior en el lado del
    conductor.
- id: 186
  category: vehicle_information
  question: 'En Vermont, un vehículo motorizado debe estar equipado con dos sistemas
    de frenado independientes. Estos son el freno de servicio (pedal) y el:'
  choices:
    A: Freno de motor de emergencia
    B: Freno de estacionamiento/emergencia
    C: Sistema hidráulico de respaldo
    D: Sistema de frenos antibloqueo (ABS)
  answer: B
  explanation: La ley de Vermont exige que todos los vehículos motorizados tengan
    un freno de servicio y un freno de estacionamiento/emergencia, y ambos deben estar
    en buen estado de funcionamiento.
- id: 187
  category: vehicle_information
  question: Según la ley de ralentí (idling) de Vermont, ¿cuál es el tiempo máximo
    que una persona puede dejar un vehículo motorizado en ralentí mientras está estacionado?
  choices:
    A: 3 minutos en cualquier período de 60 minutos
    B: 5 minutos en cualquier período de 60 minutos
    C: 10 minutos en cualquier período de 60 minutos
    D: No hay límite si la temperatura es bajo cero
  answer: B
  explanation: La ley de Vermont generalmente prohíbe dejar un vehículo en ralentí
    por más de 5 minutos en cualquier período de 60 minutos, con ciertas excepciones
    para temperaturas extremas o vehículos de emergencia.
- id: 188
  category: vehicle_information
  question: De acuerdo con la ley de retención infantil de Vermont, ¿hasta qué edad
    debe un niño estar asegurado en un asiento de seguridad para niños orientado hacia
    atrás?
  choices:
    A: 1 año de edad
    B: 2 años de edad
    C: 4 años de edad
    D: 6 años de edad
  answer: B
  explanation: La ley de Vermont exige que los niños estén debidamente asegurados
    en un sistema de retención infantil orientado hacia atrás hasta que tengan al
    menos 2 años de edad.
- id: 189
  category: vehicle_information
  question: En Vermont, los niños que han superado el tamaño de su asiento de seguridad
    orientado hacia adelante deben usar un asiento elevado (booster seat) hasta que
    alcancen ¿qué edad?
  choices:
    A: 5 años de edad
    B: 8 años de edad
    C: 10 años de edad
    D: 12 años de edad
  answer: B
  explanation: La ley de Vermont exige que los niños usen un sistema de retención
    infantil (como un asiento elevado o booster seat) hasta que cumplan 8 años.
- id: 190
  category: vehicle_information
  question: ¿Qué vehículos en Vermont deben someterse a una prueba de emisiones de
    Diagnóstico a Bordo (OBD) como parte de su inspección anual?
  choices:
    A: Todos los vehículos independientemente de su antigüedad
    B: Solo vehículos diésel
    C: La mayoría de los modelos de 1996 y más nuevos con una clasificación de peso
      bruto vehicular de 8,500 libras o menos
    D: Solo vehículos registrados en Burlington o Montpelier
  answer: C
  explanation: Vermont requiere una prueba de emisiones OBD para la mayoría de los
    vehículos de pasajeros y camiones ligeros de 1996 y más nuevos (8,500 libras de
    GVWR o menos) durante la inspección de seguridad anual.
- id: 191
  category: vehicle_information
  question: En Vermont, si las luces direccionales de su vehículo no funcionan, debe
    usar señales manuales. ¿Cuál es la señal manual correcta para disminuir la velocidad
    o detenerse?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo doblado hacia arriba en un ángulo de 90 grados
    C: Brazo izquierdo doblado hacia abajo en un ángulo de 90 grados
    D: Brazo derecho extendido hacia afuera
  answer: C
  explanation: La señal manual estándar para disminuir la velocidad o detenerse es
    el brazo izquierdo extendido por la ventana y doblado hacia abajo en un ángulo
    de 90 grados.
- id: 192
  category: vehicle_information
  question: ¿Con qué frecuencia debe someterse un vehículo motorizado registrado en
    Vermont a una inspección de seguridad y emisiones?
  choices:
    A: Cada seis meses
    B: Una vez al año
    C: Cada dos años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: De acuerdo con la ley de Vermont, todos los vehículos motorizados registrados
    en el estado deben ser inspeccionados una vez al año en una estación de inspección
    oficial.
- id: 193
  category: vehicle_information
  question: Según la ley de Vermont, ¿cuándo deben los conductores encender sus faros
    delanteros en relación con el uso de los limpiaparabrisas?
  choices:
    A: Solo durante tormentas eléctricas fuertes
    B: Solo si los limpiaparabrisas están en velocidad alta
    C: Siempre que los limpiaparabrisas estén en uso
    D: No es obligatorio que los faros estén vinculados al uso de los limpiaparabrisas
  answer: C
  explanation: La ley de Vermont exige que los faros delanteros se enciendan siempre
    que los limpiaparabrisas del vehículo estén en uso debido a la precipitación o
    la mala visibilidad.
- id: 194
  category: vehicle_information
  question: ¿Entre qué fechas están legalmente permitidos los neumáticos para nieve
    con clavos en las carreteras de Vermont?
  choices:
    A: Del 1 de noviembre al 1 de abril
    B: Del 1 de octubre al 31 de mayo
    C: Del 15 de octubre al 1 de mayo
    D: Del 15 de noviembre al 15 de abril
  answer: C
  explanation: En Vermont, se permite el uso de neumáticos para nieve con clavos en
    los vehículos entre el 15 de octubre y el 1 de mayo.
- id: 195
  category: vehicle_information
  question: Para pasar una inspección de seguridad de Vermont, el freno de pie debe
    ser capaz de detener el vehículo en cuántos pies cuando se viaja a 20 mph?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: El Manual de Inspección Periódica de Vermont establece que el freno
    de servicio (de pie) debe ser capaz de detener el vehículo en un máximo de 30
    pies a una velocidad de 20 mph.
- id: 196
  category: vehicle_information
  question: 'En Vermont, un vehículo motorizado debe estar equipado con un espejo
    que permita al conductor ver la carretera hacia atrás a una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las regulaciones de equipamiento de Vermont exigen un espejo que refleje
    una vista de la carretera por una distancia de al menos 200 pies hacia atrás.
- id: 197
  category: vehicle_information
  question: 'La ley de Vermont exige que todo vehículo motorizado esté equipado con
    un silenciador (muffler) que evite:'
  choices:
    A: Todas las emisiones de dióxido de carbono
    B: Ruido excesivo o inusual
    C: Que el motor se sobrecaliente
    D: Vapor visible por el tubo de escape
  answer: B
  explanation: La ley de Vermont (23 V.S.A. § 1221) exige que los vehículos tengan
    un silenciador en buen estado de funcionamiento para evitar ruidos excesivos o
    inusuales y humo molesto.
- id: 198
  category: vehicle_information
  question: 'La bocina de un vehículo motorizado en Vermont debe ser capaz de emitir
    un sonido audible en condiciones normales desde una distancia de al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Los estándares de seguridad de Vermont exigen que la bocina de un vehículo
    sea audible desde una distancia de 200 pies.
- id: 199
  category: vehicle_information
  question: Las señales de giro mecánicas en un vehículo en Vermont deben ser visibles
    desde una distancia de al menos cuántos pies hacia adelante y hacia atrás?
  choices:
    A: 50 pies
    B: 100 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las señales de giro deben ser visibles desde una distancia de 100 pies
    tanto hacia la parte delantera como hacia la trasera del vehículo.
- id: 200
  category: vehicle_information
  question: 'La placa de matrícula trasera de un vehículo en Vermont debe estar iluminada
    de modo que sea legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Vermont exige una luz blanca para iluminar la placa de matrícula
    trasera de modo que sea claramente legible desde una distancia de 50 pies hacia
    atrás.
- id: 201
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente según la ley de Vermont?
  choices:
    A: Reduzca la velocidad y continúe con precaución
    B: Deténgase, luego continúe cuando el camino sea seguro
    C: La señal está averiada; ignórela
    D: Ceda el paso al tráfico que viene en sentido contrario pero no se detenga
  answer: B
  explanation: Una luz roja intermitente en Vermont tiene el mismo significado que
    una señal de alto (stop). Debe detenerse por completo y continuar solo cuando
    sea seguro hacerlo.
- id: 202
  category: signs_and_signals
  question: 'Una señal en forma de banderín (triángulo isósceles que apunta a la derecha)
    situada en el lado izquierdo de la carretera en Vermont indica:'
  choices:
    A: Una zona escolar
    B: Un requisito de ceder el paso
    C: Una zona de no rebasar
    D: Un cruce de ferrocarril
  answer: C
  explanation: La señal en forma de banderín se coloca en el lado izquierdo de la
    carretera al comienzo de una zona donde está prohibido rebasar.
- id: 203
  category: signs_and_signals
  question: En Vermont, ¿qué significan las líneas amarillas dobles continuas en el
    centro de la calzada?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: Está prohibido rebasar en ambas direcciones
    D: Tráfico en un solo sentido únicamente
  answer: C
  explanation: Las líneas amarillas dobles continuas indican que no se permite rebasar
    a los vehículos que viajan en ninguna de las dos direcciones.
- id: 204
  category: signs_and_signals
  question: Al acercarse a una rotonda en Vermont, ¿qué le exigen hacer una señal
    de 'Ceda el paso' (Yield) y las líneas blancas discontinuas en el pavimento?
  choices:
    A: Detenerse por completo antes de entrar al círculo
    B: Ceder el derecho de paso al tráfico que ya está en el círculo
    C: Aumentar la velocidad para incorporarse al tráfico
    D: Ceder el paso solo al tráfico que entra por la derecha
  answer: B
  explanation: La ley de Vermont exige que los conductores que entran en una rotonda
    cedan el derecho de paso al tráfico que ya está circulando dentro de la intersección.
- id: 205
  category: signs_and_signals
  question: ¿Cuál es el significado de una luz de semáforo amarilla fija en Vermont?
  choices:
    A: Aumentar la velocidad para despejar la intersección
    B: La luz está a punto de cambiar a rojo; prepárese para detenerse
    C: Detenerse inmediatamente, incluso si está en la intersección
    D: Usted tiene el derecho de paso para girar a la izquierda
  answer: B
  explanation: Una luz amarilla fija significa que la señal está cambiando a rojo.
    Los conductores deben detenerse si pueden hacerlo de manera segura; de lo contrario,
    deben despejar la intersección.
- id: 206
  category: signs_and_signals
  question: 'En Vermont, un símbolo de diamante blanco pintado en el pavimento indica:'
  choices:
    A: Un cruce de peatones
    B: Un carril para vehículos de alta ocupación (HOV) o carril restringido
    C: Un cruce de ferrocarril más adelante
    D: Una zona de estacionamiento para vehículos de emergencia
  answer: B
  explanation: El símbolo del diamante marca los carriles reservados para vehículos
    específicos, como autobuses, bicicletas o vehículos compartidos (HOV).
- id: 207
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico amarilla intermitente a un conductor
    de Vermont?
  choices:
    A: Detenerse y esperar la luz verde
    B: El semáforo está averiado; trátelo como una parada de cuatro vías
    C: Proceder con precaución
    D: Ceder el paso a todos los peatones, luego detenerse
  answer: C
  explanation: Una luz amarilla intermitente advierte a los conductores que reduzcan
    la velocidad y procedan con precaución a través de la intersección.
- id: 208
  category: signs_and_signals
  question: En Vermont, si ve una señal de 'Zona de obras' (Work Zone) con fondo naranja,
    ¿para qué debe estar preparado?
  choices:
    A: Límites de velocidad aumentados
    B: Las multas por infracciones de tráfico suelen duplicarse
    C: No se permiten giros
    D: Mandatory use of high-beam headlights
  answer: B
  explanation: La ley de Vermont a menudo impone sanciones más altas por infracciones
    de tráfico cometidas en zonas de obras designadas cuando hay trabajadores presentes.
- id: 209
  category: signs_and_signals
  question: ¿Qué significa una línea blanca continua en el borde derecho de la carretera
    en Vermont?
  choices:
    A: Un carril solo para rebasar
    B: El borde del carril de circulación (línea de niebla)
    C: Un carril exclusivo para bicicletas
    D: Una zona donde se permite estacionar
  answer: B
  explanation: La línea blanca continua en el lado derecho de la carretera, a menudo
    llamada línea de niebla (fog line), marca el borde del carril de circulación y
    ayuda a los conductores a mantenerse en la carretera durante condiciones de poca
    visibilidad.
- id: 210
  category: signs_and_signals
  question: En Vermont, ¿qué señal manual debe usar para indicar que está disminuyendo
    la velocidad o deteniéndose?
  choices:
    A: Brazo izquierdo extendido hacia arriba
    B: Brazo izquierdo extendido horizontalmente
    C: Brazo izquierdo extendido hacia abajo, con la palma hacia atrás
    D: Brazo derecho extendido horizontalmente
  answer: C
  explanation: Para señalar una parada o una disminución de la velocidad mediante
    señales manuales, el conductor extiende el brazo izquierdo hacia abajo con la
    palma de la mano hacia atrás.
- id: 211
  category: signs_and_signals
  question: 'Una señal de tráfico de Vermont que tiene forma de escudo y es de color
    verde y blanco normalmente identifica:'
  choices:
    A: Una autopista interestatal
    B: Una ruta de los EE. UU.
    C: Una ruta estatal de Vermont
    D: Una carretera del condado
  answer: C
  explanation: Los marcadores de rutas estatales de Vermont se caracterizan por tener
    una forma de escudo verde y blanco con la palabra 'Vermont' en la parte superior.
- id: 212
  category: signs_and_signals
  question: ¿Qué debe hacer cuando ve una señal de flecha roja fija en la dirección
    en la que pretende girar?
  choices:
    A: Detenerse, luego girar si no viene tráfico
    B: Tratarla como una señal de alto (stop)
    C: No puede girar en la dirección de la flecha
    D: Ceder el paso a los peatones y luego continuar
  answer: C
  explanation: Una flecha roja fija significa que no puede realizar un movimiento
    en la dirección de la flecha hasta que la señal cambie a verde.
- id: 213
  category: signs_and_signals
  question: En Vermont, ¿qué significan los 'sharrows' (un símbolo de bicicleta con
    dos galones o chevrones encima) pintados en la carretera?
  choices:
    A: El carril es solo para bicicletas; los autos están prohibidos
    B: Las bicicletas deben permanecer en el arcén (shoulder)
    C: El carril es compartido; los automovilistas deben esperar bicicletas en el
      carril de circulación
    D: No se permiten bicicletas en esta carretera
  answer: C
  explanation: Las marcas de carril compartido (sharrows) se utilizan para alertar
    a los automovilistas de que los ciclistas pueden ocupar el carril de circulación
    y para ayudar a los ciclistas a posicionarse de forma segura.
- id: 214
  category: signs_and_signals
  question: ¿Qué significa una línea blanca discontinua entre dos carriles de tráfico
    en Vermont?
  choices:
    A: El tráfico se mueve en direcciones opuestas
    B: El tráfico se mueve en la misma dirección y se permiten los cambios de carril
    C: No se permite adelantar
    D: El carril está reservado para vehículos de emergencia
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección. Se permite cruzar la línea para cambiar de carril
    cuando sea seguro.
- id: 215
  category: signs_and_signals
  question: En Vermont, ¿qué indica una señal de color verde-amarillo fluorescente?
  choices:
    A: Zonas de construcción y mantenimiento
    B: Cruces de peatones, bicicletas o escolares
    C: Advertencia general de peligros adelante
    D: Guía direccional hacia parques estatales
  answer: B
  explanation: Según el Manual del Conductor de Vermont, las señales de color verde-amarillo
    fluorescente se utilizan específicamente para cruces de peatones, bicicletas y
    escolares para aumentar la visibilidad.
- id: 216
  category: signs_and_signals
  question: Cuando se encuentra con una luz roja intermitente en una intersección
    en Vermont, ¿qué debe hacer?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse solo si hay tráfico cruzado
    C: Detenerse por completo y ceder el paso como lo haría ante una señal de alto
      (stop)
    D: Ceder el paso al tráfico de la derecha y luego continuar sin detenerse
  answer: C
  explanation: Una luz de señal roja intermitente significa lo mismo que una señal
    de alto (stop). Debe detenerse por completo y continuar solo cuando sea seguro
    hacerlo.
- id: 217
  category: signs_and_signals
  question: En Vermont, ¿qué indican las líneas blancas sólidas dobles pintadas en
    el pavimento?
  choices:
    A: Puede cruzarlas para entrar en una entrada privada (driveway)
    B: Separan el tráfico que se mueve en direcciones opuestas
    C: Está prohibido cruzar las líneas
    D: Marcan el borde del carril de avería (breakdown lane)
  answer: C
  explanation: Las líneas blancas sólidas dobles indican que los cambios de carril
    están prohibidos. Debe permanecer dentro de su carril.
- id: 218
  category: signs_and_signals
  question: Al usar señales manuales en Vermont, ¿cómo indica que está reduciendo
    la velocidad o deteniéndose?
  choices:
    A: Extender el brazo izquierdo hacia afuera y apuntar hacia arriba
    B: Extender el brazo izquierdo recto hacia afuera
    C: Extender el brazo izquierdo hacia afuera y apuntar hacia abajo
    D: Mover la mano de un lado a otro
  answer: C
  explanation: Para señalar una parada o una disminución de la velocidad mediante
    señales manuales, el conductor debe extender su brazo izquierdo por la ventana
    y apuntar hacia abajo.
- id: 219
  category: signs_and_signals
  question: 'En Vermont, una ''marca de carril compartido'' (sharrow) que consiste
    en un símbolo de bicicleta con dos galones o chevrones encima significa:'
  choices:
    A: Las bicicletas deben permanecer en el arcén (shoulder)
    B: Los automovilistas deben ceder el paso a las bicicletas en el carril de bicicletas
      adyacente
    C: Los ciclistas pueden ocupar todo el carril de circulación y los automovilistas
      deben esperarlos
    D: La carretera está cerrada a los vehículos motorizados
  answer: C
  explanation: Los sharrows se utilizan para alertar a los automovilistas de que los
    ciclistas pueden ocupar el carril y para ayudar a los ciclistas a posicionarse
    de forma segura lejos de los autos estacionados.
- id: 220
  category: signs_and_signals
  question: ¿Cuál es la penalización de puntos en Vermont por no detenerse ante un
    autobús escolar con sus luces rojas intermitentes?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 8 puntos
  answer: C
  explanation: No detenerse ante un autobús escolar con luces rojas intermitentes
    es una infracción grave en Vermont y conlleva una penalización de 5 puntos en
    su historial de conducción.
- id: 221
  category: signs_and_signals
  question: 'Una señal de X amarilla fija sobre un carril de tráfico en Vermont indica:'
  choices:
    A: El carril está a punto de cerrarse al tráfico en su dirección
    B: El carril está reservado para vehículos de alta ocupación (HOV)
    C: Puede usar el carril para girar a la izquierda
    D: El carril es solo para vehículos de emergencia
  answer: A
  explanation: Una X amarilla fija significa que la señal de control de carril está
    a punto de cambiar a una X roja, y usted debe prepararse para salir de ese carril
    de manera segura.
- id: 222
  category: signs_and_signals
  question: En Vermont, ¿qué indica una señal circular con una 'X' grande y las letras
    'RR'?
  choices:
    A: Una intersección de caminos más adelante
    B: Un cruce de ferrocarril más adelante
    C: Una calzada restringida
    D: Un marcador de ruta rural
  answer: B
  explanation: La señal amarilla redonda con una 'X' negra y 'RR' es una señal de
    advertencia anticipada de ferrocarril, que indica que se está acercando a un cruce.
- id: 223
  category: signs_and_signals
  question: ¿Qué significa una línea amarilla continua en su lado de la línea central
    discontinua en Vermont?
  choices:
    A: Se encuentra en una zona de adelantamiento
    B: Puede adelantar solo durante las horas del día
    C: Se encuentra en una zona de no adelantar
    D: El camino más adelante está en construcción
  answer: C
  explanation: Una línea amarilla continua en su lado de la línea central indica que
    se encuentra en una zona de no adelantar y no puede adelantar legalmente a otros
    vehículos.
- id: 224
  category: signs_and_signals
  question: En Vermont, ¿cuál es el significado de una señal de 'aspa' (crossbuck)
    en un cruce de ferrocarril?
  choices:
    A: Es lo mismo que una señal de Ceda el paso (Yield); debe ceder el paso a cualquier
      tren que se aproxime
    B: Significa que todos los vehículos deben detenerse por completo
    C: Indica un cruce de peatones
    D: Marca un sitio histórico
  answer: A
  explanation: La señal de aspa (crossbuck) es una señal reguladora que significa
    que debe ceder el derecho de paso a cualquier tren que se aproxime.
- id: 225
  category: signs_and_signals
  question: Si se encuentra frente a una señal de flecha verde fija en Vermont, ¿qué
    significa?
  choices:
    A: Debe detenerse y esperar a una luz verde circular
    B: Puede girar en la dirección de la flecha después de ceder el paso a los peatones
    C: Tiene el derecho de paso para girar, pero aún debe ceder el paso a los peatones
      en el cruce peatonal
    D: La flecha es solo para vehículos de emergencia
  answer: C
  explanation: Una flecha verde significa que puede avanzar en la dirección de la
    flecha, pero la ley de Vermont exige que ceda el paso a los peatones y a otro
    tráfico que ya se encuentre en la intersección.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y avance con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 226
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Deténgase por completo
    B: Aumente la velocidad para incorporarse al tráfico
    C: Reduzca la velocidad y ceda el derecho de paso al tráfico y a los peatones
    D: Avance sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 227
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Road closed ahead
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico que viene en sentido contrario.
  id: 228
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Haga un giro en U
    B: Continúe conduciendo con cuidado
    C: Deténgase y retroceda o dé la vuelta; va en sentido contrario
    D: Aumente la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 229
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda únicamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección hacia
    la que apunta la flecha.'
  id: 230
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Vueltas a la derecha
    B: Vueltas a la izquierda
    C: Vueltas en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de vuelta en U tachada
    significa que las vueltas en U están prohibidas en este lugar.
  id: 231
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer una vuelta en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 232
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite la vuelta en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 233
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal amarilla en forma de banderín con letras negras que dice
    'NO PASSING ZONE' significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona de no rebasar.
  id: 234
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Gire a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de 'KEEP RIGHT' (Manténgase a la derecha)
    con una flecha significa que debe mantenerse al lado derecho de una isla de tráfico,
    mediana u obstrucción.
  id: 235
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 236
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan la carretera con frecuencia en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 237
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 238
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 239
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 240
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima un
    tren, debe detenerse.
  id: 241
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 242
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 243
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera curve primero
    en un sentido y luego en el otro.
  id: 244
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 245
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una carretera dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 246
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Fin de la carretera dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 247
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una carretera dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    carretera dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 248
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: La carretera dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Obras en la carretera más adelante
  answer: B
  explanation: Esta señal advierte que la carretera dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico en ambos
    sentidos.
  id: 249
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico en ambos sentidos más adelante. Es posible
    que esté saliendo de una vía de sentido único o de una carretera dividida y se
    encuentre con vehículos que circulan en sentido contrario.
  id: 250
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 251
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 252
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo
    donde el semáforo puede no ser visible desde la distancia.
  id: 253
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 254
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las calles laterales.
  id: 255
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 256
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 257
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Carga o descarga
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 258
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    vigente pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 259
