metadata:
  source: 2025 Pennsylvania Driver's Manual (PUB 95)
  total_questions: 523
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: sharing_the_road
  question: What rights and responsibilities do motorcyclists have on the roadway?
  choices:
    A: Fewer rights than passenger vehicles.
    B: The same rights and responsibilities as drivers of other vehicles.
    C: Only the right to ride in designated motorcycle lanes.
    D: Special privileges that exempt them from traffic signals.
  answer: B
  explanation: According to the manual, the motorcyclist has the same rights and responsibilities
    on the roadway as drivers of other vehicles.
- id: 2
  category: sharing_the_road
  question: According to the manual, who causes almost two-thirds of crashes involving
    a motorcycle and another type of vehicle?
  choices:
    A: The motorcyclist.
    B: The driver of the other vehicle.
    C: Pedestrians crossing the street.
    D: Unpredictable weather conditions.
  answer: B
  explanation: The manual states that almost two-thirds of these crashes are caused
    not by the motorcyclist but by the driver of the other vehicle.
- id: 3
  category: safe_driving_rules
  question: How much following distance should you leave when following a motorcycle?
  choices:
    A: One to two seconds.
    B: Three or four seconds.
    C: Five to six seconds.
    D: At least ten seconds.
  answer: B
  explanation: The manual instructs drivers to leave three or four seconds when following
    a motorcycle, so the motorcyclist has enough time to maneuver or stop in an emergency.
- id: 4
  category: defensive_driving
  question: Why is it important to leave extra following distance behind a motorcycle
    in dry conditions?
  choices:
    A: Motorcycles take longer to stop than cars.
    B: Motorcycles can stop more quickly than a vehicle.
    C: Motorcycles frequently stall in dry weather.
    D: The rider's vision is impaired by dry dust.
  answer: B
  explanation: The manual notes that in dry conditions, motorcycles can stop more
    quickly than a vehicle, requiring a greater following distance to avoid rear-end
    collisions.
- id: 5
  category: defensive_driving
  question: What should you do if you see a flashing turn signal on an approaching
    motorcycle?
  choices:
    A: Proceed immediately because the motorcycle is definitely turning.
    B: Honk your horn to remind the rider to turn.
    C: Wait to be sure the motorcycle is going to turn before you proceed.
    D: Turn on your high beams to increase visibility.
  answer: C
  explanation: Motorcycle signals usually are not self-canceling and riders sometimes
    forget to turn them off. The manual advises to wait to be sure the motorcycle
    is going to turn before you proceed.
- id: 6
  category: sharing_the_road
  question: 'When driving in the same lane as a motorcycle, you should:'
  choices:
    A: Share the lane to allow more vehicles to pass.
    B: Drive closely beside the motorcycle to protect it from wind.
    C: Allow the motorcyclist a full lane width and not share the lane.
    D: Pass the motorcycle within the same lane if there is enough room.
  answer: C
  explanation: The manual states to allow a motorcyclist a full lane width and explicitly
    says, "Do not share the lane."
- id: 7
  category: sharing_the_road
  question: 'A significant percentage of motorcycle crashes involving another vehicle
    are caused by:'
  choices:
    A: The other vehicle turning left in front of the motorcyclist.
    B: The motorcycle rear-ending the other vehicle.
    C: The other vehicle turning right on a red light.
    D: The motorcycle passing on the right shoulder.
  answer: A
  explanation: The manual states that nearly 40 percent of motorcycle crashes involving
    another motor vehicle were caused by the other vehicle turning left in front of
    the motorcyclist.
- id: 8
  category: defensive_driving
  question: How might a motorcyclist react to hazardous road conditions such as potholes
    or railroad crossings?
  choices:
    A: By maintaining a constant speed and straight line.
    B: By suddenly changing speed or adjusting their position within the lane.
    C: By stopping completely in the middle of the road.
    D: By signaling for a turn and exiting the roadway.
  answer: B
  explanation: Motorcyclists may change speed or adjust their position within a lane
    suddenly in reaction to road and traffic conditions such as potholes, gravel,
    and railroad crossings.
- id: 9
  category: sharing_the_road
  question: What effect can strong winds or wind gusts from large trucks have on a
    motorcycle?
  choices:
    A: They improve the motorcycle's fuel efficiency.
    B: They can move a motorcycle across an entire lane.
    C: They force the motorcycle to speed up.
    D: They have no significant effect on a motorcycle's path.
  answer: B
  explanation: The manual warns that a strong gust of wind can move a motorcycle across
    an entire lane if the rider is not prepared for it.
- id: 10
  category: safe_driving_rules
  question: According to Pennsylvania law, the rules of the road apply to which three
    types of vehicles?
  choices:
    A: Motor vehicles, boats, and airplanes.
    B: Bicycles, horse-drawn vehicles, and motor vehicles.
    C: Motor vehicles, ATVs, and snowmobiles.
    D: Passenger cars, commercial trucks, and motorcycles only.
  answer: B
  explanation: 'The manual states that the rules of the road apply to three types
    of vehicles recognized by Pennsylvania law: bicycles, horse-drawn vehicles, and
    motor vehicles.'
- id: 11
  category: safe_driving_rules
  question: How do traffic lights apply to bicyclists in Pennsylvania?
  choices:
    A: Bicyclists may treat red lights as yield signs.
    B: Bicyclists are exempt from stopping at red lights.
    C: Bicyclists, just like motorists, are required to stop at red lights.
    D: Bicyclists must dismount and walk their bikes through all intersections.
  answer: C
  explanation: The manual explicitly states, "For example, all bicyclists, just like
    motorists, are required to stop at red lights."
- id: 12
  category: driver_responsibility
  question: Which of the following statements about driving in Pennsylvania is true?
  choices:
    A: Driving is a constitutional right for all citizens.
    B: Driving is a privilege and not a right.
    C: Driving is a right only for those over the age of 18.
    D: Driving is a right that cannot be revoked.
  answer: B
  explanation: The manual clearly states in the introduction that "Driving is a privilege
    and not a right."
- id: 13
  category: license_system
  question: What additional form must be completed before taking the Knowledge Test
    if you are under the age of 18?
  choices:
    A: The Commercial Driver's License Application.
    B: The Vehicle Registration Form.
    C: The Parent or Guardian Consent Form (DL-180TD).
    D: The Organ Donor Designation Form.
  answer: C
  explanation: The manual states that if you are under the age of 18, your parent
    or guardian must complete the Parent or Guardian Consent Form (DL-180TD).
- id: 14
  category: alcohol_drugs_health
  question: According to the manual, what is a very important responsibility regarding
    alcohol and driving?
  choices:
    A: You should only drink if you are driving a short distance.
    B: You must never mix drinking and driving.
    C: You may drink and drive if you stay under the speed limit.
    D: You can drink and drive as long as you have a licensed passenger.
  answer: B
  explanation: The manual emphasizes that "One very important responsibility is that
    you never mix drinking and driving."
- id: 15
  category: sharing_the_road
  question: Why can it be difficult to judge the speed and distance of an approaching
    motorcycle?
  choices:
    A: Motorcycles typically travel much faster than the speed limit.
    B: Motorcycles have a much smaller profile than other vehicles.
    C: Motorcycles do not have headlights.
    D: Motorcycles blend in with the color of the pavement.
  answer: B
  explanation: The manual explains that motorcycles have a much smaller profile than
    other vehicles, which can make it more difficult to judge the speed and distance
    of an approaching motorcycle.
- id: 16
  category: license_system
  question: How old must you be to apply for a non-commercial learner's permit in
    Pennsylvania?
  choices:
    A: 15 years old
    B: 15 and a half years old
    C: 16 years old
    D: 18 years old
  answer: C
  explanation: According to the manual, you cannot apply for your permit before your
    16th birthday.
- id: 17
  category: license_system
  question: How early can your health care provider complete the physical examination
    for your learner's permit application?
  choices:
    A: No earlier than 3 months prior to your 16th birthday
    B: No earlier than 6 months prior to your 16th birthday
    C: No earlier than 1 year prior to your 16th birthday
    D: Only on or after your 16th birthday
  answer: B
  explanation: The physical examination date may not be more than six (6) months prior
    to your 16th birthday.
- id: 18
  category: driver_testing
  question: Which three tests must you pass to obtain your driver's license?
  choices:
    A: Vision, Knowledge, and Road Tests
    B: Hearing, Knowledge, and Road Tests
    C: Vision, Reflex, and Road Tests
    D: Knowledge, Road, and Highway Tests
  answer: A
  explanation: You will need to take and pass the Vision, Knowledge and Road Tests
    to get your driver's license.
- id: 19
  category: license_system
  question: If you are under 18 and your parent or guardian cannot accompany you to
    the Driver License Center, what must be done with the Consent Form (DL-180TD)?
  choices:
    A: It must be signed by a school principal.
    B: It must be mailed directly to PennDOT.
    C: It must be signed in the presence of a notary.
    D: It must be signed by a licensed driver over 21.
  answer: C
  explanation: If the parent or guardian cannot accompany the applicant, the DL-180TD
    must be signed in the presence of a notary.
- id: 20
  category: license_system
  question: If you are over 18 years of age applying for a permit, how many proofs
    of residency must you present?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: If you are over 18 years of age, you must present two (2) proofs of
    residency.
- id: 21
  category: license_system
  question: When bringing proof of date of birth and identification to the Driver
    License Center, which of the following is true?
  choices:
    A: High-quality photocopies are preferred.
    B: Digital copies on a smartphone are acceptable.
    C: Documents must be originals and photocopies will not be accepted.
    D: A school ID can replace a birth certificate.
  answer: C
  explanation: The manual states that proof of date of birth and identification documents
    must be originals (photocopies will not be accepted).
- id: 22
  category: license_system
  question: Once issued, how long is a Pennsylvania non-commercial learner's permit
    valid?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 4 years
  answer: B
  explanation: After passing the Knowledge Test, the examiner will give you a learner's
    permit, which is valid for one (1) year.
- id: 23
  category: driver_testing
  question: If you are under 18, how many hours of behind-the-wheel skill-building
    must you complete before taking your Road Test?
  choices:
    A: 40 hours
    B: 50 hours
    C: 65 hours
    D: 100 hours
  answer: C
  explanation: If you are under the age of 18, you are required to complete at least
    65 hours of behind-the-wheel skill-building before taking your Road Test.
- id: 24
  category: driver_testing
  question: For drivers under 18, the mandatory behind-the-wheel skill-building must
    include specific hours for certain conditions. What are they?
  choices:
    A: 10 hours of nighttime driving and 5 hours of bad weather driving
    B: 5 hours of nighttime driving and 10 hours of bad weather driving
    C: 15 hours of nighttime driving and 5 hours of highway driving
    D: 10 hours of highway driving and 10 hours of bad weather driving
  answer: A
  explanation: The 65 hours of skill-building must include no less than 10 hours of
    nighttime driving and five (5) hours of bad weather driving.
- id: 25
  category: driver_responsibility
  question: Who is permitted to ride in the front seat with a driver who holds a learner's
    permit?
  choices:
    A: Any licensed driver who is at least 18 years old.
    B: A licensed driver who is at least 21, or a licensed parent/guardian/spouse
      who is 18 or older.
    C: Any passenger over the age of 21, regardless of license status.
    D: A licensed driving instructor only.
  answer: B
  explanation: A licensed driver who is at least 21 years of age or a parent, guardian,
    person in loco parentis, or spouse who is 18 years of age or older and holds a
    driver's license must ride with you in the front seat.
- id: 26
  category: safe_driving_rules
  question: What is the passenger limit for drivers under the age of 18?
  choices:
    A: Only one non-family member is allowed.
    B: No passengers are allowed other than the supervising driver.
    C: They cannot have more passengers in the vehicle than the number of seat belts.
    D: Up to three passengers under the age of 18.
  answer: C
  explanation: Drivers under the age of 18 cannot have more passengers in the vehicle
    than the number of seat belts.
- id: 27
  category: driver_testing
  question: How long is the mandatory waiting period from the permit issue date before
    a driver under 18 can take the Road Test?
  choices:
    A: 30 days
    B: 3 months
    C: 6 months
    D: 1 year
  answer: C
  explanation: You must wait the mandatory six (6) months from your permit issue date
    before you may take your Road Test.
- id: 28
  category: driver_testing
  question: What happens if you do not pass your road test after three (3) tries?
  choices:
    A: You must wait one year before testing again.
    B: You may obtain a DL-31 form to Add/Extend/Replace/Change/Correct your permit.
    C: Your learner's permit is permanently revoked.
    D: You must retake the Knowledge Test immediately.
  answer: B
  explanation: If your learner's permit expires or if you do not pass your road test
    after three (3) tries, you may obtain a Non-Commercial Learner's Permit Application
    to Add/Extend/Replace/Change/Correct (DL-31).
- id: 29
  category: driver_testing
  question: If you fail the Knowledge Test, how soon can you take it again?
  choices:
    A: You can take it a second time on the same day if you go to a different location.
    B: You must wait at least 7 days.
    C: You may take the Knowledge Test only one time on any day.
    D: You must wait 30 days before retaking the test.
  answer: C
  explanation: You may take the Knowledge Test only one time on any day regardless
    of test location.
- id: 30
  category: driver_responsibility
  question: If you plan to use your Pennsylvania learner's permit to drive in another
    state, what should you do?
  choices:
    A: Assume it is valid nationwide.
    B: Apply for an international driving permit.
    C: Check with your insurance company and the other state's Department of Transportation.
    D: Only drive during daylight hours in the other state.
  answer: C
  explanation: If you are using your learner's permit for driving outside PA, check
    with your insurance company and the other state's Department of Transportation
    to make sure your permit is considered valid.
- id: 31
  category: driver_testing
  question: How many times per day are you permitted to take the Knowledge Test?
  choices:
    A: As many times as needed until you pass
    B: Two times
    C: One time
    D: Three times
  answer: C
  explanation: According to the manual, you may take the Knowledge Test only one time
    on any day regardless of test location.
- id: 32
  category: license_system
  question: If you are under 18 years of age, what is required to obtain an 'ORGAN
    DONOR' designation on your driver's license?
  choices:
    A: A medical examination certificate
    B: Written consent from a parent, guardian, person in loco parentis, or spouse
      who is 18 or older
    C: A mandatory $10 donation to the Organ Donation Awareness Trust Fund
    D: A notarized affidavit from your primary care physician
  answer: B
  explanation: Applicants under 18 years of age may request the organ donor designation,
    but they must have written consent from a parent, guardian, person in loco parentis,
    or spouse who is 18 years of age or older.
- id: 33
  category: license_system
  question: Will your Social Security number be printed on your learner's permit or
    driver's license?
  choices:
    A: Yes, it is printed on all permits and licenses for identification.
    B: Yes, but only on the learner's permit.
    C: No, it will not be printed on your learner's permit or driver's license.
    D: Yes, unless you specifically request to have it removed.
  answer: C
  explanation: 'The manual states: ''Your Social Security number will not be printed
    on your learner’s permit or driver’s license.'''
- id: 34
  category: driver_testing
  question: What happens if your vision fails to meet the Pennsylvania vision standards
    during testing?
  choices:
    A: You are permanently disqualified from obtaining a driver's license.
    B: You will be given a Report of Eye Examination Form (DL-102) to be completed
      by an eye doctor or physician.
    C: You must immediately take a specialized road test.
    D: You will automatically receive a daylight-only driving restriction without
      further testing.
  answer: B
  explanation: If your vision fails to meet the standards, the examiner will give
    you a Report of Eye Examination Form (DL-102) to be completed by an optometrist,
    ophthalmologist, or family physician.
- id: 35
  category: license_system
  question: If you move to Pennsylvania and hold a valid driver's license from another
    state, how long do you have to get a Pennsylvania driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: People who just moved into Pennsylvania holding a valid driver's license
    from another state or Canada must get a Pennsylvania driver's license within 60
    days after moving.
- id: 36
  category: license_system
  question: How long are individuals with a valid foreign driver's license authorized
    to drive in Pennsylvania?
  choices:
    A: Up to 30 days from their date of entry into the United States
    B: Up to 6 months from their date of entry into the United States
    C: Up to one year from their date of entry into the United States, or upon expiration
      of their foreign license, whichever comes first
    D: Indefinitely, as long as they carry an International Driving Permit
  answer: C
  explanation: Individuals who possess a valid foreign driver's license are authorized
    to drive in Pennsylvania for up to one year from their date of entry into the
    United States, or upon expiration of their foreign license, whichever comes first.
- id: 37
  category: license_system
  question: Who is authorized to supervise a driver under 18 years of age who holds
    a Junior Learner's Permit?
  choices:
    A: Any licensed driver who is at least 18 years old
    B: A licensed driver who is at least 21 years old, or a parent, guardian, person
      in loco parentis, or spouse who is 18 or older
    C: Any licensed driver with at least one year of driving experience
    D: Only a state-certified driving instructor
  answer: B
  explanation: You may only drive under the supervision of a licensed driver who is
    at least 21 years of age or a parent, guardian, person in loco parentis, or spouse
    who is 18 years of age or older and holds a driver's license.
- id: 38
  category: safe_driving_rules
  question: When driving with a Junior Learner's Permit or Junior Driver's License,
    what is the rule regarding the number of passengers?
  choices:
    A: You may not carry any passengers other than your supervising driver.
    B: You may carry up to 5 passengers regardless of the number of seat belts.
    C: You may not carry more passengers than seat belts available in the vehicle
      you are driving.
    D: You may only carry immediate family members.
  answer: C
  explanation: 'For both the Junior Learner''s Permit and Junior Driver''s License,
    the manual states: ''You may not carry more passengers than seat belts available
    in the vehicle you are driving.'''
- id: 39
  category: license_system
  question: What are the restricted driving hours for a Junior Driver's License unless
    accompanied by a parent, guardian, or spouse who is 18 or older?
  choices:
    A: 9 p.m. to 6 a.m.
    B: 10 p.m. to 5 a.m.
    C: 11 p.m. to 5 a.m.
    D: Midnight to 6 a.m.
  answer: C
  explanation: With a junior driver's license, you may not drive between the hours
    of 11 p.m. and 5 a.m., unless your parent, guardian, person in loco parentis,
    or spouse who is 18 years of age or older is with you.
- id: 40
  category: license_system
  question: Which of the following allows a junior driver to legally drive between
    11 p.m. and 5 a.m. without a parent or guardian present?
  choices:
    A: Returning home from a school sporting event
    B: Being involved in public or charitable service, a volunteer fire company, or
      employment
    C: Driving to a friend's house for a study group
    D: Having a clean driving record for at least 3 months
  answer: B
  explanation: You may drive between 11 p.m. and 5 a.m. if you are involved in public
    or charitable service, a member of a volunteer fire company or employed during
    those hours, provided you carry a notarized affidavit.
- id: 41
  category: safe_driving_rules
  question: During the first six months of driving on a Junior Driver's License, how
    many passengers under age 18 (who are not immediate family members) may you carry
    without a parent or guardian present?
  choices:
    A: None
    B: One
    C: Two
    D: Three
  answer: B
  explanation: You may not carry more than one (1) passenger under the age of 18 who
    is not an immediate family member unless a parent, guardian, person in loco parentis,
    or spouse who is 18 years of age or older is in the vehicle with you.
- id: 42
  category: penalties_and_points
  question: A junior driver will receive a mandatory 90-day suspension if they are
    convicted of driving how many miles per hour over the posted speed limit?
  choices:
    A: 10 mph or more
    B: 15 mph or more
    C: 20 mph or more
    D: 26 mph or more
  answer: D
  explanation: You will receive a mandatory 90-day suspension if you accumulate six
    (6) or more points or are convicted of driving 26 miles per hour (mph) or more
    over the posted speed limit.
- id: 43
  category: license_system
  question: At what age does a Junior Driver's License automatically become a regular
    driver's license?
  choices:
    A: 17 years of age
    B: 18 years of age
    C: 19 years of age
    D: 21 years of age
  answer: B
  explanation: 'The manual states: ''Your junior driver’s license will automatically
    become a regular driver’s license when you turn 18 years of age.'''
- id: 44
  category: license_system
  question: Which class of Pennsylvania driver's license covers regular passenger
    vehicles, pick-up trucks, and vans?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class M
  answer: C
  explanation: The manual is designed to provide information for a non-commercial
    Class C driver's license, which is the class that covers regular passenger vehicles,
    pick-up trucks, or vans.
- id: 45
  category: license_system
  question: What is the minimum age required to obtain a Class A driver's license
    in Pennsylvania?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: Under 'CLASSES OF DRIVER’S LICENSES', the manual lists 'CLASS A (minimum
    age 18)'.
- id: 46
  category: license_system
  question: Under what condition can a Class C license holder operate a fire or emergency
    vehicle?
  choices:
    A: If they have a Class M endorsement
    B: If the vehicle weighs less than 26,000 pounds
    C: If they have a certificate of authorization from a fire chief or head of the
      rescue squad
    D: If they are at least 21 years old
  answer: C
  explanation: A firefighter or rescue squad member with a Class C license can operate
    emergency vehicles if they have a certificate of authorization from a fire chief
    or head of the rescue or emergency squad.
- id: 47
  category: license_system
  question: What does an '8' restriction on a Class M driver's license indicate?
  choices:
    A: The driver must wear corrective lenses
    B: The driver is prohibited from operating a two-wheeled motorcycle
    C: The driver is prohibited from operating a motorcycle and may only operate a
      motor-driven cycle
    D: The driver can only operate a motorcycle during daylight hours
  answer: C
  explanation: If you test on a motor-driven cycle, an '8' restriction will appear
    on your license, which prohibits you from operating a motorcycle.
- id: 48
  category: driver_testing
  question: How many questions must you answer correctly to pass the Knowledge Test?
  choices:
    A: 12 out of 15
    B: 15 out of 18
    C: 16 out of 20
    D: 18 out of 18
  answer: B
  explanation: The Knowledge Test consists of 18 multiple choice questions, and you
    must answer 15 questions correctly to pass the test.
- id: 49
  category: driver_testing
  question: If you fail the Knowledge Test, when are you permitted to retake it?
  choices:
    A: After 7 days
    B: The following business day
    C: After 30 days
    D: Immediately on the same day
  answer: B
  explanation: If you fail the Knowledge Test, you will be permitted to retake the
    test the following business day.
- id: 50
  category: driver_testing
  question: Who may accompany you to the Driver License Center for your Road Test
    if they are 18 years of age or older?
  choices:
    A: Any licensed driver
    B: A friend who has had their license for one year
    C: A parent, guardian, person in loco parentis, or spouse with a valid driver's
      license
    D: A sibling with a learner's permit
  answer: C
  explanation: You must be accompanied by a person who is at least 21 years of age,
    or a parent, guardian, person in loco parentis, or spouse who is 18 years of age
    or older with a valid driver's license.
- id: 51
  category: vehicle_information
  question: Which of the following will cause you to not be allowed to take the Road
    Test?
  choices:
    A: Bringing a vehicle with a manual transmission
    B: Failing to bring a copy of your documents instead of the originals
    C: A vehicle part being determined unsafe or not meeting state inspection requirements
    D: Having a self-parking feature installed in your vehicle
  answer: C
  explanation: If it is determined any part of your vehicle is unsafe or does not
    meet state inspection requirements, you will not be allowed to take the Road Test.
- id: 52
  category: driver_testing
  question: What are the dimensions of the space you must parallel park your vehicle
    in during the Road Test?
  choices:
    A: 20 feet long and 6 feet wide
    B: 24 feet long and 8 feet wide
    C: 25 feet long and 10 feet wide
    D: 30 feet long and 8 feet wide
  answer: B
  explanation: You must park your vehicle midway between two uprights in a space that
    is 24 feet long and eight (8) feet wide.
- id: 53
  category: driver_testing
  question: How many attempts and adjustments are you allowed to successfully parallel
    park during the Road Test?
  choices:
    A: Two attempts using no more than five adjustments
    B: One attempt using no more than three adjustments
    C: Three attempts using no more than three adjustments
    D: One attempt using no more than five adjustments
  answer: B
  explanation: You have one (1) attempt to successfully park your vehicle using no
    more than three (3) adjustments.
- id: 54
  category: driver_testing
  question: What is the rule regarding vehicles equipped with Advanced Parking Guidance
    Systems (self-parking vehicles) during the Road Test?
  choices:
    A: They cannot be used for the Road Test under any circumstances
    B: The self-parking feature can be used only for the parallel parking portion
    C: They can be used, but the self-parking feature must be turned off and not activated
    D: The examiner will activate the feature to test its functionality
  answer: C
  explanation: Vehicles equipped with Advanced Parking Guidance Systems can be used
    for testing; however, the self-parking feature must be turned off and is not permitted
    to be activated during the Road Test.
- id: 55
  category: driver_testing
  question: If you are under the age of 18 and fail the Road Test, how long must you
    wait before you can retake it?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 14 days
  answer: C
  explanation: If you are under the age of 18 and fail the Road Test, Pennsylvania
    law requires you to wait seven (7) days before you can retake the Road Test.
- id: 56
  category: driver_testing
  question: How many chances do you have to pass the Road Test with each learner's
    permit?
  choices:
    A: One
    B: Two
    C: Three
    D: Unlimited before the expiration date
  answer: C
  explanation: You have three (3) chances with each learner’s permit to pass the Road
    Test before the expiration date of the learner’s permit.
- id: 57
  category: license_system
  question: What must you do if you have not successfully completed the Road Test
    within three years of your physical examination date?
  choices:
    A: Pay a late fee to extend the permit
    B: Start over with another Non-Commercial Learner's Permit Application and retake
      the Knowledge Test
    C: Take an approved driver's education course
    D: Wait six months before reapplying
  answer: B
  explanation: If you have not taken or successfully completed the Road Test within
    three (3) years of your physical examination date, you must start over with another
    Non-Commercial Learner’s Permit Application (DL-180) and retake the Knowledge
    Test.
- id: 58
  category: license_system
  question: A Class B driver's license is required to operate which of the following?
  choices:
    A: Any single vehicle rated in excess of 26,000 pounds
    B: Any combination of vehicles with a gross weight rating of 26,001 pounds or
      more
    C: A motorcycle with more than two wheels
    D: A motor-driven cycle with an automatic transmission
  answer: A
  explanation: A Class B license is required to operate any single vehicle rated in
    excess of 26,000 pounds, such as motor homes rated at 26,001 pounds or more.
- id: 59
  category: driver_testing
  question: What will happen if you fail to properly operate any of the vehicle controls
    (such as wipers, parking brake, or hazard lights) prior to the Road Test?
  choices:
    A: You will lose points but can still pass the test
    B: The examiner will show you how to use them and continue the test
    C: It will result in a failure of the Road Test
    D: You will be restricted to daylight driving only
  answer: C
  explanation: Failure to properly operate any of the vehicle controls will result
    in a failure of the Road Test.
- id: 60
  category: signs_and_signals
  question: How are traffic lights arranged when they are in a horizontal line?
  choices:
    A: Red is always on the left and green on the right
    B: Green is always on the left and red on the right
    C: Yellow is always on the left and red on the right
    D: Red is always on the top and green on the bottom
  answer: A
  explanation: The manual states, 'When they are arranged horizontally, red is always
    on the left and green on the right.'
- id: 61
  category: safe_driving_rules
  question: Under what condition are you permitted to make a left turn on a steady
    red light?
  choices:
    A: When turning from a two-way street onto a one-way street
    B: When there is no oncoming traffic on any street
    C: When turning from a one-way street onto another one-way street
    D: You may never turn left on a steady red light
  answer: C
  explanation: The manual states you may turn left after stopping at a red light if
    you are in the left lane and turning left from a one-way street onto another one-way
    street, unless a sign tells you not to turn.
- id: 62
  category: signs_and_signals
  question: What does a flashing red traffic light mean?
  choices:
    A: Slow down and proceed with caution
    B: It has the same meaning as a STOP sign
    C: The traffic light is broken and you have the right-of-way
    D: Stop only if there is cross traffic approaching
  answer: B
  explanation: According to the manual, 'A flashing red light has the same meaning
    as a STOP sign. You must come to a complete stop. Then, look both ways, and proceed
    only after the intersection is clear.'
- id: 63
  category: signs_and_signals
  question: How should you treat an intersection with non-functioning traffic lights?
  choices:
    A: Yield to the vehicle on your right and proceed without stopping
    B: Wait for a police officer to direct traffic
    C: Proceed through the intersection at your normal speed
    D: Treat it as though it were a four-way STOP sign
  answer: D
  explanation: The manual explicitly states, 'A non-functioning traffic signal should
    be treated as though it were a four-way STOP sign.'
- id: 64
  category: signs_and_signals
  question: What does a steady yellow 'X' over a traffic lane indicate?
  choices:
    A: You are not allowed to use the traffic lane at all
    B: You must change lanes because the direction of travel for that lane is about
      to be reversed
    C: You may use the lane but must slow down for a toll booth
    D: You may only turn left from that specific lane
  answer: B
  explanation: The manual explains that a steady yellow 'X' over a traffic lane means
    'you must change lanes because the direction of travel for that lane is about
    to be reversed. Get ready to leave the lane safely.'
- id: 65
  category: sharing_the_road
  question: What should a pedestrian do if the flashing DON'T WALK or flashing upraised
    hand begins while they are already in the street?
  choices:
    A: Stop immediately and wait in the middle of the street
    B: Turn around and go back to the starting curb
    C: Finish crossing the street
    D: Run as fast as possible to the nearest curb
  answer: C
  explanation: The manual instructs pedestrians that when the flashing DON'T WALK
    or flashing upraised hand begins, they should 'Finish crossing, if you are in
    the street.'
- id: 66
  category: sharing_the_road
  question: What must you do when driving near a blind pedestrian carrying a white
    cane or walking with a guide dog?
  choices:
    A: Honk your horn to let them know you are approaching
    B: Maintain your speed but steer carefully around them
    C: Stop and verbally tell them it is safe to cross
    D: Slow down, always yield the right-of-way, and proceed with caution
  answer: D
  explanation: 'The manual states: ''When driving near a blind pedestrian who is carrying
    a white cane or walking with a guide dog, you must slow down, always yield the
    right-of-way and then proceed with caution.'''
- id: 67
  category: safe_driving_rules
  question: What is the maximum speed limit in a school zone when the yellow signals
    are flashing?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: A
  explanation: The manual states, 'You must travel no faster than 15 mph when the
    yellow signals are flashing or during the time periods indicated on the sign.'
- id: 68
  category: penalties_and_points
  question: What is the penalty for exceeding the speed limit in a school zone?
  choices:
    A: A warning for the first offense
    B: One point on your driving record and a fine
    C: Three points on your driving record and a fine
    D: Immediate license suspension for 30 days
  answer: C
  explanation: According to the manual, 'Exceeding the speed limit in a school zone
    will result in three (3) points on your driving record, and you will also be fined.'
- id: 69
  category: safe_driving_rules
  question: What should you do if you are approaching a railroad crossing and the
    crossing gate is lowered?
  choices:
    A: Slow down and drive around the gate if no train is visible
    B: Stop and wait until the gate is raised and all signals are completed
    C: Stop, look both ways, and proceed around the gate carefully
    D: Honk your horn and proceed without stopping
  answer: B
  explanation: 'The manual states you are required to stop at lowered crossing gates
    and warns: ''Do not move forward or attempt to go around any gate or ignore any
    signal of an approaching train. Proceed with caution only after all signals are
    completed...'''
- id: 70
  category: signs_and_signals
  question: What does a steady green arrow mean?
  choices:
    A: You may turn, but you must yield to oncoming traffic
    B: You must stop before turning in the direction of the arrow
    C: The lane you are in is about to close
    D: You may turn the way the arrow points, and your turn is protected
  answer: D
  explanation: The manual states, 'A STEADY GREEN ARROW means you may turn the way
    the arrow points. When you turn during the green arrow phase, your turn is "protected"
    because oncoming traffic is stopped by a red light.'
- id: 71
  category: signs_and_signals
  question: What does a flashing yellow arrow indicate?
  choices:
    A: You have a protected turn in the direction of the arrow
    B: You must come to a complete stop before turning
    C: You may turn with caution, but must yield to oncoming traffic and pedestrians
    D: The traffic light is broken and you should treat it as a stop sign
  answer: C
  explanation: The manual states, 'A FLASHING YELLOW ARROW means you may turn in the
    direction of the arrow with caution, however, you must first yield to oncoming
    traffic and pedestrians. When you turn during the flashing yellow arrow phase,
    your turn is NOT protected...'
- id: 72
  category: safe_driving_rules
  question: How many cars may enter the highway each time the ramp-metering light
    turns green on a single-lane ramp?
  choices:
    A: One car
    B: Two cars
    C: Three cars
    D: As many cars as can safely pass before it turns red
  answer: A
  explanation: 'The manual specifies regarding ramp-metering signals: ''On single-lane
    ramps, only one (1) car may enter the highway each time the light turns green.'''
- id: 73
  category: safe_driving_rules
  question: What should you do if traffic is backed up and you need to cross a railroad
    track?
  choices:
    A: Stop on the tracks and wait for traffic to move
    B: Stop your vehicle in a location entirely clear of the railroad tracks
    C: Proceed slowly over the tracks, keeping as close to the car ahead as possible
    D: Honk your horn to make the cars ahead move faster
  answer: B
  explanation: The manual states, 'If traffic is backed up because of a traffic signal,
    stop sign or for any other reason, make sure you stop your vehicle in a location
    where it will be entirely clear of any railroad tracks.'
- id: 74
  category: signs_and_signals
  question: What are the three basic categories of traffic signs?
  choices:
    A: Regulatory, Warning, and Guide signs.
    B: Informational, Directional, and Warning signs.
    C: Speed, Stop, and Yield signs.
    D: Mandatory, Advisory, and Construction signs.
  answer: A
  explanation: 'The manual states that signs are divided into three basic categories:
    Regulatory, Warning and Guide signs.'
- id: 75
  category: penalties_and_points
  question: What is a possible consequence of disobeying the messages on regulatory
    signs?
  choices:
    A: You will be required to retake your driving test.
    B: You could be fined and receive points on your driving record.
    C: Your vehicle will be immediately impounded.
    D: You will receive a warning for the first three offenses.
  answer: B
  explanation: If you do not obey the messages on regulatory signs, you could be fined
    and receive points on your driving record because you are breaking the law.
- id: 76
  category: safe_driving_rules
  question: When approaching a STOP sign with a painted crosswalk or stop line, where
    must you stop your vehicle?
  choices:
    A: Just past the first painted line.
    B: Before the front of your vehicle reaches the first painted line.
    C: In the middle of the crosswalk to see better.
    D: Parallel to the STOP sign itself.
  answer: B
  explanation: When you see a crosswalk or a stop line (white top bar), you must stop
    before the front of your vehicle reaches the first painted line.
- id: 77
  category: safe_driving_rules
  question: If two vehicles reach a FOUR-WAY STOP intersection at the same time, who
    must yield the right-of-way?
  choices:
    A: The driver on the left yields to the driver on the right.
    B: The driver on the right yields to the driver on the left.
    C: The vehicle traveling at a faster speed yields.
    D: The vehicle that flashes its headlights first has the right-of-way.
  answer: A
  explanation: At a FOUR-WAY STOP, if two vehicles reach the intersection at the same
    time, the driver on the left yields to the driver on the right.
- id: 78
  category: signs_and_signals
  question: What is the shape of a YIELD sign?
  choices:
    A: Octagon (8-sided)
    B: Pennant
    C: Triangle (3-sided)
    D: Vertical rectangle
  answer: C
  explanation: The manual explicitly states that YIELD signs are triangular (3-sided)
    in shape.
- id: 79
  category: safe_driving_rules
  question: How should a driver treat a RAILROAD CROSSBUCK sign?
  choices:
    A: As a mandatory STOP sign.
    B: As a YIELD sign.
    C: As a DO NOT ENTER sign.
    D: As a SPEED LIMIT sign.
  answer: B
  explanation: You should treat the crossbuck sign as a YIELD sign; slow down and
    prepare to stop, if you see or hear a train approaching.
- id: 80
  category: safe_driving_rules
  question: When turning onto a divided highway at an intersection, what turns are
    permitted at the first and second roadways?
  choices:
    A: Left turn only at the first roadway, right turn only at the second.
    B: Right turn only at the first roadway, left turn only at the second.
    C: Right turns are permitted at both roadways.
    D: Left turns are permitted at both roadways.
  answer: B
  explanation: 'At a divided highway, the manual states: ''At the first roadway, you
    can only turn right, and at the second roadway, you can only turn left.'''
- id: 81
  category: signs_and_signals
  question: What is the purpose of a CENTER LANE LEFT TURN ONLY sign?
  choices:
    A: To provide a lane for passing slow-moving vehicles.
    B: To reserve a lane exclusively for left-turning vehicles in either direction.
    C: To indicate a lane where through traffic has the right-of-way.
    D: To designate a lane for emergency vehicles only.
  answer: B
  explanation: This sign indicates where a lane is reserved for the exclusive use
    of left-turning vehicles in either direction and is not to be used for through
    traffic or passing.
- id: 82
  category: safe_driving_rules
  question: What does a SPEED LIMIT sign indicate?
  choices:
    A: The minimum speed you must travel under all conditions.
    B: The recommended speed for poor weather conditions.
    C: The maximum legal speed under ideal conditions.
    D: The speed at which you should drive during heavy traffic.
  answer: C
  explanation: A SPEED LIMIT sign indicates the maximum legal speed under ideal conditions
    for the stretch of highway where it is posted.
- id: 83
  category: defensive_driving
  question: According to the manual, what is the number one reason 16- and 17-year-old
    drivers are involved in crashes?
  choices:
    A: Driving under the influence of alcohol.
    B: Texting while driving.
    C: Failing to yield the right-of-way.
    D: Driving too fast for conditions.
  answer: D
  explanation: 'The Teen Crash Fact section states: ''Driving too fast for conditions''
    is the No. 1 reason 16 and 17-year-old drivers are involved in crashes.'
- id: 84
  category: safe_driving_rules
  question: If you accidentally find yourself in a lane controlled by a sign with
    a turn arrow and the word 'ONLY,' what must you do?
  choices:
    A: Stop and wait for traffic to clear before changing lanes.
    B: Make the turn indicated by the arrow.
    C: Proceed straight through the intersection cautiously.
    D: Put your vehicle in reverse and back out of the lane.
  answer: B
  explanation: If you are in a lane controlled by a sign with a turn arrow and the
    word 'ONLY,' when you reach the intersection, you must make the turn, even if
    you are in the turn-only lane in error.
- id: 85
  category: signs_and_signals
  question: What does a LEFT TURN YIELD ON GREEN sign mean?
  choices:
    A: Left turns are protected and oncoming traffic must stop.
    B: Left turns are prohibited when the light is green.
    C: A left turn is permitted, but you must yield to oncoming traffic.
    D: You must wait for a green arrow to make a left turn.
  answer: C
  explanation: The LEFT TURN YIELD ON GREEN sign indicates a left turn is permitted,
    but you must yield to oncoming traffic.
- id: 86
  category: penalties_and_points
  question: What is the penalty for unauthorized vehicles parking in spaces reserved
    for disabled persons or severely disabled veterans?
  choices:
    A: A warning sticker placed on the windshield.
    B: A fine and towing costs.
    C: Immediate suspension of the driver's license.
    D: Points added to the driving record.
  answer: B
  explanation: Unauthorized vehicles parked in these reserved spaces are subject to
    a fine and towing costs.
- id: 87
  category: signs_and_signals
  question: What does the sign 'OPPOSING TRAFFIC HAS EXTENDED GREEN' indicate?
  choices:
    A: You have the right-of-way to turn left.
    B: Opposing traffic must yield to you.
    C: Opposing traffic may continue to move after your signal has turned red.
    D: The traffic signal is broken and you should treat it as a four-way stop.
  answer: C
  explanation: This sign is posted where opposing traffic may continue to move after
    your signal has turned red.
- id: 88
  category: signs_and_signals
  question: Which warning sign is the only one that is pennant-shaped?
  choices:
    A: Stop Sign Ahead
    B: Yield
    C: No Passing Zone
    D: Narrow Bridge
  answer: C
  explanation: The manual states that the No Passing Zone sign is the only pennant-shaped
    warning sign, and it is placed on the left side of the road facing the driver.
- id: 89
  category: signs_and_signals
  question: What does a 'Left Turn Yield on Flashing Yellow Arrow' sign indicate?
  choices:
    A: Left turns are protected and oncoming traffic must stop.
    B: A left turn is permitted, but you must yield to oncoming traffic.
    C: Left turns are strictly prohibited at this intersection.
    D: You must come to a complete stop before making a right turn.
  answer: B
  explanation: This sign indicates a left turn is permitted when the yellow arrow
    is flashing, but you must yield to oncoming traffic because the turn is not protected.
- id: 90
  category: signs_and_signals
  question: A 'Winding Road' sign indicates that there are how many curves in a row
    on the road ahead?
  choices:
    A: Exactly two curves
    B: Three or more curves
    C: One sharp curve followed by a straightaway
    D: Four or more sharp turns
  answer: B
  explanation: The Winding Road (Series of Curves) sign indicates there are three
    (3) or more curves in a row on the road ahead.
- id: 91
  category: sharing_the_road
  question: What does an 'Added Lane' sign mean for drivers entering a roadway?
  choices:
    A: Merging is not necessary because entering traffic uses a new lane.
    B: Entering traffic must yield to traffic already on the major roadway.
    C: The lane ahead will end and drivers must merge left.
    D: Traffic is exiting and crossing your path.
  answer: A
  explanation: The Added Lane sign means merging is not necessary because the entering
    traffic uses a new lane that has been added to the roadway.
- id: 92
  category: signs_and_signals
  question: Where is a 'Two Direction Large Arrow' sign typically placed?
  choices:
    A: At the beginning of a divided highway
    B: Before a narrow bridge or underpass
    C: At the far side of a T-intersection
    D: On the left side of a no passing zone
  answer: C
  explanation: The Two Direction Large Arrow sign is placed at the far side of a T-intersection
    to tell you that you can only go left or right.
- id: 93
  category: safe_driving_rules
  question: What should you do when driving in wet weather in an area marked with
    a 'Slippery When Wet' sign?
  choices:
    A: Accelerate quickly to pass the slippery area.
    B: Brake sharply before making any turns.
    C: Reduce your speed and increase your following distance.
    D: Maintain your normal speed but stay in the center lane.
  answer: C
  explanation: In wet weather, you should reduce your speed and increase your following
    distance. You should not accelerate or brake quickly.
- id: 94
  category: defensive_driving
  question: If your vehicle strays off the roadway and one wheel drops onto a low
    or soft shoulder, what should you NOT do?
  choices:
    A: Take your foot off the gas pedal.
    B: Slam on the brakes or steer sharply to get back on the road.
    C: Keep a firm grip on the steering wheel.
    D: Gradually slow down before attempting to return to the road.
  answer: B
  explanation: The manual warns that if one wheel drops off onto a low or soft shoulder,
    you should not slam on the brakes or steer sharply to try to get back onto the
    roadway, as you can easily lose control of your vehicle.
- id: 95
  category: vehicle_information
  question: When approaching a steep hill or downgrade, what action should you be
    ready to take?
  choices:
    A: Shift to a higher gear to increase momentum.
    B: Shift to a lower gear to control your speed and save your brakes.
    C: Ride your brakes all the way down the hill.
    D: Put your vehicle in neutral to save fuel.
  answer: B
  explanation: When a Hill/Downgrade sign is present, you should slow down and be
    ready to shift to a lower gear to control your speed and to save wear and tear
    on your brakes.
- id: 96
  category: signs_and_signals
  question: What background colors can a 'Bicycle Crossing Ahead' sign have?
  choices:
    A: White or silver
    B: Red or orange
    C: Yellow or fluorescent yellow-green
    D: Green or blue
  answer: C
  explanation: The manual states that the Bicycle Crossing Ahead sign may have either
    a yellow background or a fluorescent yellow-green background.
- id: 97
  category: signs_and_signals
  question: What is the difference in required driver response between a 'Set of Curves'
    sign and a 'Right and Left Sharp Turns' sign?
  choices:
    A: A set of curves involves three or more curves, while sharp turns involve only
      two.
    B: A set of curves requires you to stop, while sharp turns only require yielding.
    C: Sharp turns require you to slow down substantially, while a set of curves requires
      you to slow down and prepare to navigate.
    D: There is no difference; they are used interchangeably.
  answer: C
  explanation: For a 'Set of Curves', you must slow down and prepare to navigate.
    For 'Right and Left Sharp Turns', the road turns sharply, requiring you to 'slow
    down substantially' and prepare to navigate.
- id: 98
  category: safe_driving_rules
  question: What should you do when you see a 'Divided Highway Ends' sign?
  choices:
    A: Keep to the right of the centerline and watch for oncoming traffic.
    B: Prepare to merge into a single lane of one-way traffic.
    C: Keep to the left of the median.
    D: Accelerate to merge safely with highway traffic.
  answer: A
  explanation: The 'Divided Highway Ends' sign means you will be on a roadway with
    two-way traffic. You must keep to the right of the centerline and watch for oncoming
    traffic.
- id: 99
  category: safe_driving_rules
  question: How should you react when approaching a 'One Direction Large Arrow' sign?
  choices:
    A: Maintain your speed and stay in the left lane.
    B: Slow down as much as you would to make a turn at an intersection.
    C: Come to a complete stop before proceeding.
    D: Accelerate to navigate the extreme angle safely.
  answer: B
  explanation: The 'One Direction Large Arrow' indicates the road changes direction
    at an extreme angle. You should slow down as much as you would to make a turn
    at an intersection.
- id: 100
  category: signs_and_signals
  question: What does a 'Weave Area' warning sign indicate?
  choices:
    A: The road surface is uneven and weaving is required to avoid potholes.
    B: You will be merging with another roadway as some traffic is exiting and crossing
      your path.
    C: The lane ahead ends and you must weave into the adjacent lane.
    D: Bicycles and pedestrians frequently cross the road ahead.
  answer: B
  explanation: The 'Weave Area' sign is used to warn that you will be merging with
    another roadway as some traffic is exiting and crossing your path.
- id: 101
  category: defensive_driving
  question: Why must you approach an intersection with extra caution when you see
    a 'Road Entering Curve' sign?
  choices:
    A: The side road has the right-of-way over the main road.
    B: Traffic entering from the side road must merge into a new added lane.
    C: A driver entering the main road may not be able to see you approaching from
      around the curve.
    D: The curve is too sharp for vehicles traveling over 15 mph.
  answer: C
  explanation: The manual states to approach with extra caution because a driver preparing
    to enter the main road may not be able to see you approaching from around the
    curve and may pull out in front of you.
- id: 102
  category: signs_and_signals
  question: Which of the following signs is the only pentagon-shaped sign used on
    the roadway?
  choices:
    A: Stop sign
    B: Railroad crossing sign
    C: School zone sign
    D: No passing zone sign
  answer: C
  explanation: The manual states that the school sign is the only pentagon-shaped
    sign used on the roadway, indicating you are approaching a school zone.
- id: 103
  category: safe_driving_rules
  question: When traveling through a posted work zone, when are you required to turn
    on your headlights?
  choices:
    A: Only at night
    B: Only when workers are actively present
    C: No matter what time of day
    D: Only if it is raining or foggy
  answer: C
  explanation: The manual states you must turn on your headlights when traveling through
    a work zone, no matter what time of day, and it is the law for all posted work
    zones.
- id: 104
  category: penalties_and_points
  question: What is the additional fine if you are pulled over for a traffic violation
    in a work zone and your vehicle's headlights are not turned on?
  choices:
    A: $15
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: If you are pulled over by police for a traffic violation in a work
    zone and your vehicle's headlights are not turned on, you will be fined an additional
    $25.
- id: 105
  category: signs_and_signals
  question: What colors are normally used for Work Zone signs?
  choices:
    A: Yellow with black lettering
    B: Orange with black lettering
    C: Green with white lettering
    D: Red with white lettering
  answer: B
  explanation: Work Zone Signs are normally diamond shaped, like warning signs, but
    they are orange with black lettering instead of yellow with black lettering.
- id: 106
  category: sharing_the_road
  question: What does a "Bicycle/Motor Vehicle Share the Road" sign indicate when
    placed at a roadway pinch point?
  choices:
    A: Bicycles are not allowed on this section of the road.
    B: Motorists must provide adequate space for bicyclists because there is no shoulder
      or the lanes are narrow.
    C: Bicyclists must yield the right-of-way to motor vehicles at all times.
    D: There is a designated, separate bicycle lane ahead.
  answer: B
  explanation: This sign is used at roadway pinch points (no shoulder, narrow lanes,
    etc.) to warn motorists to provide adequate space for bicyclists to share the
    roadway.
- id: 107
  category: signs_and_signals
  question: When approaching a marker for an object adjacent to the roadway, what
    do the downward-angled stripes indicate?
  choices:
    A: The direction of the nearest highway exit.
    B: The direction you need to move to avoid the hazard.
    C: That you must come to a complete stop.
    D: That the road is closed ahead due to flooding.
  answer: B
  explanation: Roadside objects and conditions are indicated by markers where the
    stripes are angled down in the direction you need to move to avoid the hazard.
- id: 108
  category: signs_and_signals
  question: How does the manual define an "active" work zone?
  choices:
    A: Any area where orange diamond-shaped signs are posted.
    B: The portion of a work zone where workers are on the roadway or shoulder next
      to an open travel lane.
    C: A construction area where the speed limit is reduced to 25 mph.
    D: An area where heavy machinery is parked overnight.
  answer: B
  explanation: An active work zone is the portion of a work zone where construction,
    maintenance or utility workers are on the roadway, or on the shoulder of the highway
    next to an open travel lane.
- id: 109
  category: signs_and_signals
  question: On Pennsylvania highways, what do the exit numbers correspond with?
  choices:
    A: The year the exit was built.
    B: The speed limit of the exit ramp.
    C: The mile markers.
    D: The number of intersecting roads.
  answer: C
  explanation: Exit numbers correspond with the mile markers. This change allows motorists
    to quickly calculate distances between exits.
- id: 110
  category: signs_and_signals
  question: What does a yellow panel with the message "EXIT ONLY" on a highway sign
    indicate?
  choices:
    A: Only emergency vehicles may use the exit.
    B: The lane below the sign will not continue through the interchange and will
      form a ramp.
    C: The exit is closed for construction.
    D: You must increase your speed to exit safely.
  answer: B
  explanation: If a yellow panel with the message EXIT ONLY is on a highway sign,
    the lane below the sign will not continue through the interchange; instead, the
    lane will go off of the road to form a ramp.
- id: 111
  category: signs_and_signals
  question: In the Interstate Numbering System, what do one- or two-digit even-numbered
    interstates generally indicate?
  choices:
    A: North-south routes.
    B: East-west routes.
    C: Routes that connect directly to a city center.
    D: Routes that are currently under construction.
  answer: B
  explanation: One or two-digit, even-numbered interstates are generally east-west
    routes.
- id: 112
  category: signs_and_signals
  question: What does a three-digit interstate highway number starting with an even
    number (such as I-276) usually signify?
  choices:
    A: It is a spur route connecting at only one end.
    B: It is a route that travels exclusively north and south.
    C: It connects to interstate highways at both ends, often known as a loop or beltway.
    D: It is a toll road.
  answer: C
  explanation: If the first of the three digits is an even number, the highway usually
    connects to interstate highways at both ends. Many times such routes are known
    as "loops" or "beltways."
- id: 113
  category: signs_and_signals
  question: How can you tell if an upcoming highway exit will be on the left side
    of the road?
  choices:
    A: The exit sign will be painted entirely yellow.
    B: The small green exit number sign will be on the left side of the main rectangular
      sign.
    C: The exit number will be an odd number.
    D: There will be a flashing red light above the sign.
  answer: B
  explanation: The small green EXIT number sign on top of the green rectangular sign
    will be on the left side of the sign, if the exit is on the left side of the highway.
- id: 114
  category: signs_and_signals
  question: What does it mean if an electric arrow panel in a work zone displays a
    "caution" message rather than a directional arrow?
  choices:
    A: The road is completely closed ahead.
    B: You must immediately pull over to the shoulder.
    C: There is a work area ahead next to the travel lane.
    D: You are approaching a railroad crossing.
  answer: C
  explanation: An arrow panel displaying a caution message indicates there is a work
    area ahead next to the travel lane. Drive with extra caution.
- id: 115
  category: signs_and_signals
  question: What color are most highway and expressway guide signs?
  choices:
    A: Red with white letters
    B: Yellow with black letters
    C: Green with white letters
    D: Blue with white letters
  answer: C
  explanation: The manual states that highway and expressway guide signs are green
    with white letters.
- id: 116
  category: signs_and_signals
  question: Which of the following are used in work zones to guide you through changing
    traffic patterns and keep you away from hazards?
  choices:
    A: Electric arrow panels
    B: Pentagon-shaped signs
    C: Barrels, tubes, cones, and vertical panels
    D: Red, white, and blue shields
  answer: C
  explanation: Barrels, tubes, cones and vertical panels are all channeling devices
    used in work zones to guide you through changing traffic patterns and keep you
    away from hazards associated with road work.
- id: 117
  category: signs_and_signals
  question: On east-west roadways in Pennsylvania, where do the mile marker numbers
    start at zero?
  choices:
    A: In the eastern part of the state
    B: In the western part of the state
    C: In the center of the state
    D: At the largest city on the route
  answer: B
  explanation: According to the manual, mile marker numbers start at zero in the western
    part of the state for east-west roadways and increase as you travel east.
- id: 118
  category: safe_driving_rules
  question: What is a practical benefit of knowing how to read mile markers on the
    highway?
  choices:
    A: They tell you the current speed limit of the highway.
    B: They indicate the exact distance to the next rest stop.
    C: They help you give an approximate location if you need to call for roadside
      assistance.
    D: They show the number of miles remaining to the next state border.
  answer: C
  explanation: The manual states that knowing how to read mile markers can help you
    know exactly where you are and give an approximate location if you have to call
    for roadside assistance.
- id: 119
  category: signs_and_signals
  question: What color are service signs that show the location of hospitals, food,
    and lodging at the next exit?
  choices:
    A: Green with white letters
    B: Blue with white letters or symbols
    C: Brown with white letters
    D: Yellow with black letters
  answer: B
  explanation: Service signs are square or rectangular, are blue with white letters
    or symbols, and show the location of various services located at the next exit.
- id: 120
  category: signs_and_signals
  question: Which colors are typically used for tourist-oriented directional signs
    that direct motorists to museums or state parks?
  choices:
    A: Red or orange with black lettering
    B: Green or yellow with black lettering
    C: Blue or brown with white lettering
    D: Black or white with red lettering
  answer: C
  explanation: Tourist-oriented directional signs are square or rectangular and may
    be blue or brown with white lettering.
- id: 121
  category: signs_and_signals
  question: What is the primary purpose of yellow pavement lines?
  choices:
    A: To divide lanes of traffic traveling in the same direction
    B: To mark the right edge of the road
    C: To divide traffic traveling in opposite directions
    D: To indicate a lane reserved for bicycles
  answer: C
  explanation: The manual states that yellow lines divide traffic traveling in opposite
    directions, and are used to mark the center of two-lane roads.
- id: 122
  category: signs_and_signals
  question: Which pavement markings are used to divide lanes of traffic traveling
    in the same direction and to mark the right edge of the road?
  choices:
    A: Solid white lines
    B: Broken yellow lines
    C: Solid yellow lines
    D: Double yellow lines
  answer: A
  explanation: Solid white lines divide lanes of traffic traveling in the same direction
    and are also used to mark the right edge of the road.
- id: 123
  category: safe_driving_rules
  question: What does a double, solid yellow centerline indicate on a two-way road?
  choices:
    A: Passing is permitted for traffic in both directions.
    B: Passing is not allowed by traffic traveling in either direction.
    C: Only traffic on the right side may pass.
    D: The lane is reserved for left turns only.
  answer: B
  explanation: A double, solid yellow centerline shows the center of a two-way road
    where passing by traffic traveling in either direction is not allowed.
- id: 124
  category: safe_driving_rules
  question: When driving on a two-way roadway with a combination of a solid yellow
    and a broken yellow centerline, when are you permitted to pass?
  choices:
    A: Only when the solid yellow line is on your side of the road
    B: Only when the broken yellow line is on your side of the road
    C: Whenever there is no oncoming traffic, regardless of the lines
    D: Passing is never permitted on this type of road
  answer: B
  explanation: You may pass if the broken line is on your side of the road and safe
    conditions exist, but you may not pass when a solid yellow line is on your side.
- id: 125
  category: safe_driving_rules
  question: On a three-lane or five-lane highway, what is the purpose of a center
    lane marked by inside broken yellow and outside solid yellow lines?
  choices:
    A: It is a regular travel lane for passing slower vehicles.
    B: It is reserved exclusively for emergency vehicles.
    C: Vehicles traveling in either direction may use it only to make left turns.
    D: It is a reversible lane for rush hour traffic.
  answer: C
  explanation: The inside, broken yellow and solid yellow centerlines show vehicles
    traveling in either direction may use the center lane only to make left turns.
- id: 126
  category: signs_and_signals
  question: On a limited access highway with a median, how are the left and right
    edges of the roadway marked?
  choices:
    A: Both edges are marked with solid white lines.
    B: Both edges are marked with solid yellow lines.
    C: The right edge is a solid yellow line and the left edge is a solid white line.
    D: The right edge is a solid white line and the left edge is a solid yellow line.
  answer: D
  explanation: On limited access highways with medians, the right edge of the road
    is marked with a solid white line, and the left edge of each side is marked by
    a solid yellow line.
- id: 127
  category: safe_driving_rules
  question: If you approach a railroad crossing that has no signals, what is the safest
    course of action?
  choices:
    A: Proceed as quickly as possible over the tracks
    B: Slow down and prepare to stop if you see or hear a train approaching
    C: Stop completely regardless of whether a train is coming
    D: Proceed through the crossing at a normal rate of speed
  answer: B
  explanation: If there are no signals at a railroad crossing, you should slow down
    and prepare to stop if you see or hear a train approaching.
- id: 128
  category: safe_driving_rules
  question: Under what circumstances may you drive around the closed gates at a railroad
    crossing?
  choices:
    A: When you can clearly see the train has passed
    B: When the red lights have stopped flashing but the gate is stuck
    C: When other drivers are driving around the gates
    D: Never
  answer: D
  explanation: The manual's review section explicitly states that you may 'Never'
    drive around the gates at a railroad crossing.
- id: 129
  category: signs_and_signals
  question: What is the general meaning of a yellow and black diamond-shaped sign?
  choices:
    A: It helps direct you to cities and towns ahead
    B: It tells you about traffic laws and regulations
    C: It warns you about conditions on or near the road
    D: It marks a school zone
  answer: C
  explanation: A yellow and black diamond-shaped sign is a warning sign that warns
    you about conditions on or near the road.
- id: 130
  category: signs_and_signals
  question: What does a yellow and black diamond-shaped sign indicate?
  choices:
    A: It helps direct you to cities and towns ahead
    B: It warns you about conditions on or near the road
    C: It tells you about traffic laws and regulations
    D: It tells you about road construction ahead
  answer: B
  explanation: A yellow and black diamond-shaped sign warns you about conditions on
    or near the road.
- id: 131
  category: signs_and_signals
  question: What is the proper order for traffic lights from top to bottom?
  choices:
    A: Red, yellow, green
    B: Red, green, yellow
    C: Green, red, yellow
    D: Green, yellow, red
  answer: A
  explanation: From top to bottom, the proper order for traffic lights is red, yellow,
    and green.
- id: 132
  category: signs_and_signals
  question: If a green arrow turns into a solid green light, what should you do?
  choices:
    A: You may no longer turn and must proceed straight
    B: You still have the exclusive right-of-way to turn
    C: You must stop and wait for the next green arrow
    D: You may still turn but you must yield to oncoming traffic
  answer: D
  explanation: If a green arrow turns into a green light, you may still turn but you
    must yield to oncoming traffic.
- id: 133
  category: signs_and_signals
  question: What does a steady yellow light at an intersection mean?
  choices:
    A: Go
    B: Yield to other cars
    C: Slow down and prepare to stop
    D: Stop immediately
  answer: C
  explanation: A steady yellow light at an intersection means you should slow down
    and prepare to stop.
- id: 134
  category: signs_and_signals
  question: What should you do when you encounter a flashing yellow light?
  choices:
    A: Slow down and proceed with care
    B: Continue through at your normal speed if the way is clear
    C: Stop and proceed when a green light appears
    D: Stop and proceed when the way is clear
  answer: A
  explanation: A flashing yellow light means that you should slow down and proceed
    with care.
- id: 135
  category: signs_and_signals
  question: Which of the following signals requires you to come to a complete stop?
  choices:
    A: A flashing red light
    B: A steady yellow light
    C: A yellow arrow
    D: A flashing yellow light
  answer: A
  explanation: You must stop when you see a flashing red light.
- id: 136
  category: safe_driving_rules
  question: Under what condition may you continue carefully through a yellow light?
  choices:
    A: If there is an emergency vehicle crossing your lane
    B: If there are no pedestrians crossing
    C: If you are turning right
    D: If you are already within the intersection
  answer: D
  explanation: You may continue carefully through a yellow light if you are within
    the intersection.
- id: 137
  category: safe_driving_rules
  question: What should you do if you approach an intersection where the traffic light
    is broken or not functioning?
  choices:
    A: Stop and wait for it to be repaired
    B: Stop and wait for a police officer to arrive
    C: Continue as if it were a four-way stop sign
    D: Continue as you normally would
  answer: C
  explanation: If a traffic light is broken or not functioning, you should continue
    as if it were a four-way stop sign.
- id: 138
  category: safe_driving_rules
  question: What must you do before making a right turn on a red light?
  choices:
    A: Stop first and check for traffic and pedestrians
    B: Ensure you have a right turn red arrow
    C: Move into the left lane
    D: Slow down first without coming to a complete stop
  answer: A
  explanation: You may turn right on red if you stop first and check for traffic and
    pedestrians.
- id: 139
  category: signs_and_signals
  question: What color lines divide lanes of traffic moving in the same direction?
  choices:
    A: Yellow
    B: White
    C: Red
    D: Black
  answer: B
  explanation: Lanes of traffic moving in the same direction are divided by white
    lines.
- id: 140
  category: safe_driving_rules
  question: On which type of centerline are you NOT allowed to pass another car on
    either side?
  choices:
    A: Combination solid and broken yellow
    B: Single broken yellow
    C: Double solid yellow
    D: Single broken white
  answer: C
  explanation: You may not pass another car on either side of a double solid yellow
    centerline.
- id: 141
  category: safe_driving_rules
  question: If you cannot get a good view of cross-street traffic when stopped behind
    the white top bar painted on the pavement at a stop sign, what should you do?
  choices:
    A: Sound your horn before proceeding
    B: Wait 5 seconds, then proceed
    C: Pull forward slowly, check for traffic and pedestrians, and proceed when clear
    D: Put down your windows, listen for traffic, and then proceed
  answer: C
  explanation: According to the manual, if you cannot get a good view of cross-street
    traffic when you stop behind the white top bar, you should pull forward slowly,
    check for traffic and pedestrians, and proceed when clear.
- id: 142
  category: signs_and_signals
  question: What do posted speed limits indicate?
  choices:
    A: The minimum legal speed limit
    B: The maximum safe speed under ideal road and weather conditions
    C: The exact speed at which you must travel to avoid a ticket
    D: The maximum safe speed under all road conditions
  answer: B
  explanation: The posted speed limits show the maximum safe speed under ideal road
    and weather conditions.
- id: 143
  category: safe_driving_rules
  question: What maneuver can you legally perform from the center lane?
  choices:
    A: Make left turns
    B: Make U-turns
    C: Pass slower-moving traffic
    D: Park your vehicle
  answer: A
  explanation: Based on the manual's test section, making left turns is the correct
    maneuver you can perform from the center lane.
- id: 144
  category: vehicle_information
  question: When is the best time to check your vehicle's tire pressure?
  choices:
    A: Immediately after driving on the highway
    B: When the tires are 'cold,' before you have driven or at least three hours after
      driving
    C: While the vehicle is running
    D: Only during the summer months
  answer: B
  explanation: The manual states to check your tires 'cold' - before you've driven
    or at least three hours after you've driven.
- id: 145
  category: vehicle_information
  question: When using the penny test to check tire wear, what indicates that you
    are driving with a safe amount of tread?
  choices:
    A: You can see all of Abraham Lincoln's head
    B: The penny falls over when placed in the groove
    C: Any part of Abraham Lincoln's head is covered by the tread
    D: The tread is completely smooth
  answer: C
  explanation: If any part of Lincoln's head is covered by the tread during the penny
    test, you're driving with the safe amount of tread.
- id: 146
  category: safe_driving_rules
  question: Why is it dangerous to leave loose items in the passenger compartment
    of your vehicle?
  choices:
    A: They can cause the vehicle to lose tire pressure
    B: They become projectiles in a crash that continue to travel at the vehicle's
      pre-impact speed
    C: They increase the vehicle's fuel consumption
    D: They can cause carbon monoxide poisoning
  answer: B
  explanation: In a crash, loose items in your vehicle become projectiles that continue
    to travel the same speed your vehicle was moving before the impact.
- id: 147
  category: vehicle_information
  question: When adjusting your side mirrors to remove blind spots, how should they
    be set?
  choices:
    A: So you can see the traffic directly behind your vehicle
    B: So you can see the entire side of your vehicle without leaning
    C: So when you lean left or right you can just barely see the side of your vehicle
    D: So they point directly at the ground
  answer: C
  explanation: The side mirror(s) should be set so when you lean left/right you can
    just barely see the side of your vehicle.
- id: 148
  category: penalties_and_points
  question: What is the Pennsylvania law regarding hanging objects from the rearview
    mirror?
  choices:
    A: It is legal as long as the object is smaller than 3 inches
    B: It is against the law to have any object hanging from the rearview mirror while
      moving
    C: Only parking permits are allowed to hang while driving
    D: Hanging objects are required for identifying new drivers
  answer: B
  explanation: It is against the law to have any object or material hanging from the
    rearview mirror while moving. Tags, permits and placards may only be attached
    when the vehicle is parked.
- id: 149
  category: alcohol_drugs_health
  question: Maintaining a constant supply of fresh air in your vehicle helps you stay
    alert and guards against what danger?
  choices:
    A: Carbon monoxide (exhaust gas) poisoning
    B: Nitrogen dioxide poisoning
    C: Dehydration
    D: Motion sickness
  answer: A
  explanation: Maintaining a constant supply of fresh air in your vehicle helps you
    stay alert and guards against carbon monoxide (exhaust gas) poisoning when you
    drive.
- id: 150
  category: vehicle_information
  question: How should you properly adjust your vehicle's head restraint?
  choices:
    A: So the bottom of the restraint rests on your shoulders
    B: So the top of the head restraint is at least as high as the top of your ears
    C: So it is positioned directly behind your neck
    D: So it is completely removed for better visibility
  answer: B
  explanation: Adjust your head restraint so the top of the head restraint is at least
    as high as the top of your ears to prevent or reduce the severity of neck injuries
    in a crash.
- id: 151
  category: safe_driving_rules
  question: According to the manual, being thrown from a vehicle during a crash increases
    your chances of death by what percentage?
  choices:
    A: 25 percent
    B: 50 percent
    C: 75 percent
    D: 90 percent
  answer: C
  explanation: Being thrown from a vehicle increases your chances of death by 75 percent.
    Locking your doors and wearing your seat belt helps ensure you will not be thrown
    from your vehicle.
- id: 152
  category: safe_driving_rules
  question: What is the rule regarding the use of headphones or ear pieces while driving?
  choices:
    A: They can be used in both ears if listening to a GPS
    B: They can only be used in one ear for communication purposes
    C: They are completely illegal to wear at any time
    D: They can be used in both ears for listening to music
  answer: B
  explanation: 'NOTE: headphones/ear pieces can only be used in one ear for communication
    purposes.'
- id: 153
  category: driver_responsibility
  question: 'Statistics show that a teen driver is more likely to have a crash if
    they are driving:'
  choices:
    A: Alone
    B: With adult passengers
    C: With other teens as passengers
    D: During the morning hours
  answer: C
  explanation: If you are a teen driver with other teens as passengers, statistics
    show you are more likely to have a crash than if you are driving alone or are
    driving with adult passengers.
- id: 154
  category: defensive_driving
  question: Driver distraction and inattention to road and traffic conditions are
    responsible for what percentage of police-reported traffic crashes?
  choices:
    A: 10 to 15 percent
    B: 25 to 30 percent
    C: 45 to 50 percent
    D: 75 to 80 percent
  answer: B
  explanation: Driver distraction and inattention to road and traffic conditions are
    responsible for 25 to 30 percent of police-reported traffic crashes.
- id: 155
  category: defensive_driving
  question: According to research, how often does a teenager dialing a cell phone
    miss an important road event?
  choices:
    A: 3 percent of the time
    B: 13 percent of the time
    C: 25 percent of the time
    D: 53 percent of the time
  answer: D
  explanation: Research has found a normal, undistracted driver fails to notice an
    important road event 3 percent of the time, an adult dialing a cell phone misses
    it 13 percent of the time, and a teenager dialing a cell phone misses it 53 percent
    of the time.
- id: 156
  category: alcohol_drugs_health
  question: 'Being awake for 18 hours impairs your driving about as much as having
    a blood alcohol level of:'
  choices:
    A: .02 percent
    B: .05 percent
    C: .08 percent
    D: .10 percent
  answer: B
  explanation: The manual states that being awake for 18 hours impairs your driving
    about as much as a blood alcohol level of .05 percent.
- id: 157
  category: safe_driving_rules
  question: What is the best thing to do if you begin to feel tired while driving?
  choices:
    A: Drink coffee or a caffeinated beverage
    B: Open the windows for fresh air
    C: Stop driving
    D: Turn up the radio volume
  answer: C
  explanation: The manual explicitly states that the best thing to do if you begin
    to feel tired while driving is to stop driving.
- id: 158
  category: alcohol_drugs_health
  question: How often should you have your vision checked to ensure safe driving?
  choices:
    A: Every six months
    B: Every one or two years
    C: Every three to five years
    D: Only when renewing your license
  answer: B
  explanation: The manual recommends having your vision checked every one or two years
    because peripheral vision, distance judgment, and low light vision can deteriorate
    over time.
- id: 159
  category: alcohol_drugs_health
  question: In Pennsylvania, what are physicians required to do if they diagnose a
    patient with a condition that could impair safe driving?
  choices:
    A: Confiscate the patient's driver's license
    B: Report the individual to PennDOT
    C: Prescribe medication before allowing them to drive
    D: Notify the patient's insurance company
  answer: B
  explanation: In Pennsylvania, physicians must report to PennDOT individuals whom
    they have diagnosed as having a condition that could impair their ability to drive
    safely.
- id: 160
  category: alcohol_drugs_health
  question: 'If you are under age 21, you are considered to be driving under the influence
    (DUI) if your blood alcohol concentration (BAC) is at or above:'
  choices:
    A: .00 percent
    B: .02 percent
    C: .04 percent
    D: .08 percent
  answer: B
  explanation: If you are a driver under age 21 and your blood alcohol concentration
    (BAC) is .02 percent or more, you are considered to be driving under the influence
    (DUI).
- id: 161
  category: alcohol_drugs_health
  question: Which of the following is considered to be equivalent to one standard
    drink?
  choices:
    A: 8 oz. of regular beer
    B: 5 oz. of wine
    C: 2 oz. of 80 proof liquor
    D: 16 oz. of light beer
  answer: B
  explanation: You should consider one drink to be 1.5 oz. of 80 proof liquor, 12
    oz. of regular beer, or 5 oz. of wine.
- id: 162
  category: alcohol_drugs_health
  question: What is the only effective way to reduce your blood alcohol concentration
    (BAC) level?
  choices:
    A: Drinking coffee
    B: Taking a cold shower
    C: Eating a heavy meal
    D: Allowing time to pass
  answer: D
  explanation: The manual states that only time will "sober you up." You cannot reduce
    your BAC by drinking coffee, caffeinated beverages, or taking a cold shower.
- id: 163
  category: alcohol_drugs_health
  question: Even if your blood alcohol level is .04 percent, how much more likely
    are you to be involved in a crash compared to a driver with no alcohol in their
    blood?
  choices:
    A: Two to seven times more likely
    B: Ten times more likely
    C: Twenty times more likely
    D: Fifty times more likely
  answer: A
  explanation: Drivers whose blood alcohol level is .04 are between two and seven
    times more likely to be involved in a crash than drivers who have no alcohol in
    their blood.
- id: 164
  category: alcohol_drugs_health
  question: How can marijuana affect your ability to drive safely?
  choices:
    A: It causes aggressive and reckless driving
    B: It improves distance judgment
    C: It slows reaction time and impairs judgment of time and distance
    D: It increases coordination and alertness
  answer: C
  explanation: Marijuana can slow reaction time, impair judgment of time and distance,
    and decrease coordination.
- id: 165
  category: alcohol_drugs_health
  question: When a medication warning label states "Don't operate heavy machinery,"
    what does this mean for a driver?
  choices:
    A: You may drive a standard car, but not a commercial truck
    B: Your vehicle is considered heavy machinery, so you should not drive
    C: You can drive as long as you feel alert
    D: You must drive below the speed limit
  answer: B
  explanation: 'The manual reminds drivers: "When the warning label states - Don''t
    operate heavy machinery - Your vehicle is considered heavy machinery!"'
- id: 166
  category: driver_responsibility
  question: Drivers with less than how many years of experience are most likely to
    make errors that lead to crashes?
  choices:
    A: One year
    B: Three years
    C: Five years
    D: Ten years
  answer: C
  explanation: Drivers with less than five (5) years of experience are most likely
    to make errors that lead to crashes.
- id: 167
  category: safe_driving_rules
  question: What is the number one major type of crash in which new drivers (16- and
    17-year-olds) in Pennsylvania are involved?
  choices:
    A: Rear-ending another vehicle
    B: Hitting a stationary object
    C: Head-on collisions
    D: Sideswiping a vehicle while passing
  answer: B
  explanation: 'The major types of crashes in which new drivers (16 and 17-year olds)
    in Pennsylvania are involved include: 1) Hitting a stationary object.'
- id: 168
  category: alcohol_drugs_health
  question: According to a NHTSA survey, what percentage of drivers killed in crashes
    tested positive for drugs?
  choices:
    A: 20%
    B: 30%
    C: 37%
    D: 43%
  answer: D
  explanation: According to the NHTSA 2013-2014 Roadside Survey mentioned in the manual,
    43% of drivers killed in crashes tested positive for drugs.
- id: 169
  category: safe_driving_rules
  question: What is the recommended safe following distance under normal, dry conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: C
  explanation: A 4-second following distance will allow you to steer or brake to avoid
    a hazard safely on the highway, if the pavement is dry.
- id: 170
  category: defensive_driving
  question: What should you do if another driver is following you too closely (tailgating)?
  choices:
    A: Speed up to increase the distance between you.
    B: Move over to the right lane if possible.
    C: Slam on your brakes to warn them.
    D: Move into the left lane and maintain your speed.
  answer: B
  explanation: If you see someone following you too closely (tailgating), move over
    to the right lane, if possible. You can also tap your brakes gently to slowly
    reduce your speed to encourage them to pass.
- id: 171
  category: safe_driving_rules
  question: How far ahead should you look to identify problem situations early?
  choices:
    A: 3 to 5 seconds ahead
    B: 6 to 8 seconds ahead
    C: 12 to 15 seconds ahead
    D: 20 to 30 seconds ahead
  answer: C
  explanation: You should be able to identify problem situations 12 to 15 seconds
    ahead — about one block in the city, or a quarter of a mile at highway speeds.
- id: 172
  category: defensive_driving
  question: When coming to an intersection, why should you look to the left first?
  choices:
    A: Vehicles coming from the left are closer to you.
    B: Vehicles coming from the left have the right-of-way.
    C: It is easier to see vehicles on the left.
    D: Vehicles on the left are usually traveling faster.
  answer: A
  explanation: 'When you come to an intersection, follow the "left-right-left" rule:
    Look to the left first, because vehicles coming from the left are closer to you.'
- id: 173
  category: safe_driving_rules
  question: What is the best way to check the blind spots in the left-rear and right-rear
    areas of your vehicle?
  choices:
    A: Look in your rearview mirror.
    B: Look in your side mirrors.
    C: Turn your head before changing lanes.
    D: Rely on your vehicle's backup camera.
  answer: C
  explanation: The left-rear and right-rear areas are blind spots; always check them
    by turning your head before changing lanes.
- id: 174
  category: defensive_driving
  question: If you are driving on a road with parked vehicles on your right and oncoming
    vehicles on your left, what is the best course of action?
  choices:
    A: Drive closer to the parked vehicles to avoid oncoming traffic.
    B: Drive closer to the oncoming vehicles to avoid opening doors.
    C: Speed up to get past the danger quickly.
    D: Slow down and steer a middle course between the oncoming and parked vehicles.
  answer: D
  explanation: If there are parked vehicles to your right and oncoming vehicles to
    your left, the best thing to do is to slow down and "split the difference" by
    steering a middle course between them.
- id: 175
  category: driver_responsibility
  question: Which of the following is one of the four major types of crashes involving
    16- and 17-year-old drivers in Pennsylvania?
  choices:
    A: Sideswipe collisions
    B: Hitting a stationary object
    C: Backing into parked cars
    D: Rollover crashes
  answer: B
  explanation: 'The major types of crashes for new drivers include: 1) Hitting a stationary
    object; 2) Crashes where roads intersect; 3) Rear-end collisions; and 4) Head-on
    collisions.'
- id: 176
  category: safe_driving_rules
  question: Under which of the following conditions should you allow a longer following
    distance than usual?
  choices:
    A: When driving on a newly paved road.
    B: When following a motorcycle.
    C: When driving downhill.
    D: When driving in the left lane.
  answer: C
  explanation: You should allow a longer following distance when driving downhill
    because it is harder for your brakes to slow your vehicle, especially at high
    speeds.
- id: 177
  category: defensive_driving
  question: If you do not have at least eight feet of space on at least one side of
    your vehicle for an escape path, what should you do?
  choices:
    A: Move into the left lane immediately.
    B: Allow more space to the front by increasing your following distance.
    C: Honk your horn to warn other drivers.
    D: Accelerate to get out of the restricted area.
  answer: B
  explanation: If you do not have at least eight (8) feet of space on at least one
    side of your vehicle to use as an escape path, you will need to allow more space
    to the front by increasing your following distance.
- id: 178
  category: sharing_the_road
  question: Why do you need extra room ahead when following a large vehicle that blocks
    your view?
  choices:
    A: To avoid the exhaust fumes from the large vehicle.
    B: To give yourself extra room to see around the vehicle.
    C: Because large vehicles travel faster than passenger cars.
    D: Because large vehicles have brighter brake lights.
  answer: B
  explanation: You should allow a longer following distance when following a large
    vehicle blocking your view ahead because you need extra room to see around the
    vehicle.
- id: 179
  category: defensive_driving
  question: What should you do if your view of the cross street at an intersection
    is blocked by buildings, shrubs, or parked vehicles?
  choices:
    A: Sound your horn and proceed at your normal speed.
    B: Wait for another vehicle to pull out and follow them.
    C: Move forward slowly until you can see clearly.
    D: Turn right instead of going straight.
  answer: C
  explanation: If your view of the cross street is blocked by buildings, shrubs or
    parked vehicles, move forward slowly until you can see clearly.
- id: 180
  category: safe_driving_rules
  question: What is a good rule to help you avoid driving in another driver's blind
    spot?
  choices:
    A: Drive slightly to the rear of the other vehicle for a long time.
    B: Stay in the blind spot so the other driver knows you are there.
    C: Either speed up or drop back to move out of the driver's blind spot.
    D: Flash your high beams continuously while in the blind spot.
  answer: C
  explanation: Avoid driving on either side and slightly to the rear of another vehicle
    for a long time. Either speed up or drop back to move out of the driver’s blind
    spot.
- id: 181
  category: safe_driving_rules
  question: How can you determine if you are maintaining a safe following distance?
  choices:
    A: Estimate the distance in car lengths.
    B: Watch the vehicle ahead pass a roadside object and count the seconds until
      you reach it.
    C: Look at your speedometer and divide your speed by two.
    D: Wait until the vehicle ahead brakes and see how long it takes you to react.
  answer: B
  explanation: To determine your following distance, watch the rear bumper of the
    vehicle ahead pass a roadside object, then start counting how many seconds it
    takes you to reach the same spot.
- id: 182
  category: sharing_the_road
  question: Why should you increase your following distance when behind school buses,
    taxis, or trucks transporting hazardous substances?
  choices:
    A: They are required to travel at lower speed limits.
    B: They make unexpected stops, such as at railroad crossings.
    C: They have larger blind spots than other vehicles.
    D: They are more likely to roll backward on hills.
  answer: B
  explanation: You should allow a longer following distance because these vehicles
    must stop at railroad crossings and make other, unexpected stops.
- id: 183
  category: defensive_driving
  question: When passing another vehicle, why should you get past their blind spot
    as quickly and safely as possible?
  choices:
    A: To prevent the other driver from speeding up.
    B: Because it is illegal to drive in a blind spot for more than 5 seconds.
    C: The longer you stay in the blind spot, the longer you both are in danger.
    D: To avoid getting caught in the other vehicle's slipstream.
  answer: C
  explanation: When passing another vehicle, get past the other driver’s blind spot
    as quickly and as safely as you can. The longer you stay in the blind spot, the
    longer you both are in danger.
- id: 184
  category: defensive_driving
  question: When changing lanes, how should you check your vehicle's blind spots?
  choices:
    A: Rely entirely on your rearview mirror.
    B: Look over your left and right shoulders.
    C: Depend on your vehicle's backup sensors.
    D: Check your side mirrors for at least five seconds.
  answer: B
  explanation: 'The manual states: ''Do not depend on mirrors or sensors alone, look
    over your left and right shoulders to make sure no one is in your vehicle’s blind
    spots.'''
- id: 185
  category: safe_driving_rules
  question: What is the first thing you should do when preparing to back up your vehicle?
  choices:
    A: Turn on your hazard lights.
    B: Honk your horn twice.
    C: Check behind your vehicle before getting in.
    D: Adjust your rearview mirror to point downwards.
  answer: C
  explanation: According to the manual, 'When backing up, always check behind your
    vehicle — do it before you get in your vehicle. Children or small objects are
    hard to see from the driver’s seat.'
- id: 186
  category: safe_driving_rules
  question: What is the maximum speed limit in Pennsylvania?
  choices:
    A: 55 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: 'The manual explicitly states: ''The maximum speed limit in Pennsylvania
    is 70.'''
- id: 187
  category: vehicle_information
  question: How does driving above 60 mph affect your vehicle's fuel consumption?
  choices:
    A: It decreases fuel consumption by 10%.
    B: It increases fuel consumption by about 5% for every 5 mph over 60 mph.
    C: It has no effect on fuel consumption.
    D: It increases fuel consumption by 20% for every 10 mph over 60 mph.
  answer: B
  explanation: 'Under the Eco-Driving section, the manual explains: ''Fuel consumption
    increases about 5% for every five miles per hour driven above 60 mph.'''
- id: 188
  category: vehicle_information
  question: To improve fuel efficiency, when does the manual recommend using your
    car's air conditioner?
  choices:
    A: Only when driving in stop-and-go traffic.
    B: When driving more than 40 mph.
    C: When driving below 30 mph.
    D: Only during the hottest parts of the day.
  answer: B
  explanation: The Eco-Driving tips suggest to 'Stay cool. Use your car's air conditioner
    when driving more than 40 mph.'
- id: 189
  category: defensive_driving
  question: How do traffic fatality rates at night compare to daylight hours?
  choices:
    A: They are about the same.
    B: They are twice as high.
    C: They are three to four times higher.
    D: They are slightly lower due to less traffic.
  answer: C
  explanation: 'The manual states: ''Overall, traffic fatality rates are three (3)
    to four (4) times higher at night than in daylight.'''
- id: 190
  category: safe_driving_rules
  question: 'Pennsylvania state law requires you to use your headlights anytime:'
  choices:
    A: You are driving on an interstate highway.
    B: Your vehicle's wipers are in continuous or intermittent use due to weather.
    C: You are driving over 55 mph.
    D: You are within 10 miles of a school zone.
  answer: B
  explanation: State law requires drivers to use their headlights 'Anytime your vehicle’s
    wipers are in continuous or intermittent use due to weather conditions.'
- id: 191
  category: safe_driving_rules
  question: Which headlights should you use when driving in bad weather conditions
    such as fog, snow, or heavy rain?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Daytime running lights only
  answer: B
  explanation: 'The manual advises: ''In bad weather, use only low beams. High beams
    actually reduce visibility under these conditions.'''
- id: 192
  category: safe_driving_rules
  question: 'You must use your headlights when you cannot see pedestrians or vehicles
    on the highway for a distance of at least:'
  choices:
    A: 250 feet ahead.
    B: 500 feet ahead.
    C: 1,000 feet ahead.
    D: 1,500 feet ahead.
  answer: C
  explanation: State law requires drivers to use their headlights 'When they cannot
    see pedestrians or vehicles on the highway for a distance of 1,000 feet ahead
    of the vehicle they are operating.'
- id: 193
  category: safe_driving_rules
  question: When must you switch from high beams to low beams according to Pennsylvania
    law?
  choices:
    A: Within 1,000 feet of an oncoming vehicle and 500 feet of a vehicle you are
      following.
    B: Within 500 feet of an oncoming vehicle and 300 feet of a vehicle you are following.
    C: Within 300 feet of an oncoming vehicle and 100 feet of a vehicle you are following.
    D: Only when the other driver flashes their headlights at you.
  answer: B
  explanation: 'The manual states: ''Pennsylvania law requires you use low beams whenever
    you are within 500 feet of an oncoming vehicle and when you are following a vehicle
    within 300 feet.'''
- id: 194
  category: defensive_driving
  question: What should you do if an oncoming vehicle fails to dim their high beam
    headlights?
  choices:
    A: Turn on your high beams to punish the other driver.
    B: Look toward the right side of the road.
    C: Stare directly at the oncoming headlights to judge their distance.
    D: Close your eyes briefly until the vehicle passes.
  answer: B
  explanation: 'The manual advises: ''If the driver does not dim their lights, look
    toward the right side of the road. This will keep you from being “blinded” by
    the other vehicle’s headlights...'''
- id: 195
  category: defensive_driving
  question: 'To avoid ''overdriving your headlights'' on a dark road at night using
    low beams, you should not drive faster than:'
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: The manual explains that low beam headlights shine only about 250 feet
    ahead, and 'To avoid overdriving your headlights on a dark road at night, you
    should not drive faster than 45 mph.'
- id: 196
  category: defensive_driving
  question: When do pavements typically become the most slippery during a rain storm?
  choices:
    A: After it has been raining continuously for an hour.
    B: In the first 10 to 15 minutes of a rain storm.
    C: Only when the rain stops and the road begins to dry.
    D: When driving at speeds above 60 mph.
  answer: B
  explanation: According to the Road Conditions section, 'Pavements can become very
    slippery in the first 10 to 15 minutes of a rain storm.'
- id: 197
  category: defensive_driving
  question: In cold, wet weather, why should you be extra careful driving on sections
    of the road shaded by trees or buildings?
  choices:
    A: They attract more wildlife to the roadway
    B: They are more prone to deep water accumulation
    C: These areas freeze more quickly and dry last
    D: They cause oil to rise to the surface faster
  answer: C
  explanation: The manual states that in cold, wet weather, you should be extra careful
    driving on sections of road shaded by trees or buildings because these areas freeze
    more quickly and dry last.
- id: 198
  category: safe_driving_rules
  question: At what speed can your vehicle begin to hydroplane when water is only
    1/10 of an inch deep?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The manual notes that you can hydroplane at speeds as low as 35 mph,
    when water is only 1/10 of an inch deep.
- id: 199
  category: defensive_driving
  question: What is the first thing you should do if you find yourself hydroplaning?
  choices:
    A: Slam on the brakes immediately to stop the vehicle
    B: Turn the steering wheel sharply to regain traction
    C: Keep both hands on the steering wheel and slowly take your foot off the gas
      pedal
    D: Shift your vehicle into neutral and coast until traction returns
  answer: C
  explanation: If you find yourself hydroplaning, the manual instructs you to keep
    both hands on the steering wheel and slowly take your foot off of the gas pedal
    to let your vehicle slow down.
- id: 200
  category: safe_driving_rules
  question: Why is it extremely dangerous to drive when the temperature is near 32°
    Fahrenheit?
  choices:
    A: Black ice forms exclusively at this temperature
    B: Precipitation turns to rain or sleet, creating a thin layer of water on top
      of ice that is more slippery than ice alone
    C: Your vehicle's anti-lock brakes will not function properly
    D: Windshield washer fluid is most likely to freeze on contact
  answer: B
  explanation: The manual states it is extremely dangerous near 32° (Fahrenheit),
    when precipitation turns to rain or sleet, because a thin layer of water on top
    of ice is more slippery than ice alone.
- id: 201
  category: defensive_driving
  question: How can you identify the potential presence of "black ice" on the roadway?
  choices:
    A: The road looks wet but no spray is coming from the tires of other vehicles
    B: The road surface appears unusually white and textured
    C: You hear a loud crunching sound from your tires
    D: Puddles begin to form rapidly on the shoulder of the road
  answer: A
  explanation: According to the manual, when the road looks wet but no spray is coming
    from the tires of other vehicles, "black ice" may be present.
- id: 202
  category: penalties_and_points
  question: What is the penalty if snow or ice falls from your moving vehicle and
    causes death or serious bodily injury to another person?
  choices:
    A: A fine of $50 to $100
    B: A fine of $200 to $1,000 for each offense
    C: Immediate license suspension for one year
    D: A mandatory 30-day jail sentence
  answer: B
  explanation: Under a law effective July 10, 2006, the operator of the vehicle from
    which the snow or ice came is subject to a fine of $200 to $1,000 for each offense
    if it causes death or serious bodily injury.
- id: 203
  category: safe_driving_rules
  question: How should you adjust your following distance when driving on wet roads?
  choices:
    A: Maintain the standard three-second following distance
    B: Increase your following distance to five or six seconds
    C: Leave about 10 times more space than normal
    D: Decrease your following distance to stay in the tracks of the vehicle ahead
  answer: B
  explanation: When roads get slick, the manual advises to reduce your speed by 5
    to 10 mph on wet roads and increase your following distance to five (5) or six
    (6) seconds.
- id: 204
  category: vehicle_information
  question: Why should you avoid using cruise control when driving on slippery roads?
  choices:
    A: It drains the vehicle's battery faster in cold weather
    B: It disables the anti-lock braking system
    C: It will continue to apply power if your wheels start spinning, keeping you
      from regaining control
    D: It causes the engine to overheat when traction is low
  answer: C
  explanation: The manual warns not to use cruise control on slippery roads because
    if wheel-spin occurs, an activated cruise control system will continue to apply
    power, keeping your wheels spinning and preventing you from regaining control.
- id: 205
  category: defensive_driving
  question: What is a recommended technique for approaching an intersection on icy
    or snow-packed roads?
  choices:
    A: Accelerate quickly to pass through the intersection before the light changes
    B: Pump your brakes rapidly as you approach the stop line
    C: Shift into neutral and apply the emergency brake
    D: Time your arrival by letting your vehicle coast until the light turns green
      and vehicles ahead begin to move
  answer: D
  explanation: On icy or snow-packed roads, the manual recommends trying to time your
    arrival at an intersection by letting your vehicle coast until the light turns
    green and vehicles ahead of you have begun to move, so you do not have to brake
    to stop and then accelerate.
- id: 206
  category: safe_driving_rules
  question: What should you do if you get caught in dense fog and cannot see?
  choices:
    A: Turn on your high beams and continue driving slowly
    B: Pull completely off the road, turn on hazard lights, and keep your seat belt
      fastened
    C: Stop in the middle of your lane and wait for the fog to clear
    D: Follow closely behind a large truck to use its taillights as a guide
  answer: B
  explanation: If caught in dense fog, the manual states it is best to pull completely
    off of the road (preferably into a parking lot), turn your hazard lights on, and
    keep your seat belt fastened.
- id: 207
  category: vehicle_information
  question: Why should you NOT use your high beam headlights when driving in fog?
  choices:
    A: They will drain your vehicle's battery excessively
    B: They direct light up into the fog, which bounces back into your eyes and creates
      glare
    C: They are illegal to use during daylight hours
    D: They automatically disable your windshield wipers
  answer: B
  explanation: The manual explicitly states not to use high beams in fog because they
    direct their light up and into the fog, which bounces the light back into your
    eyes, creating glare and making it harder to see.
- id: 208
  category: safe_driving_rules
  question: How much can a dirty headlight reduce its light output?
  choices:
    A: By 10 percent
    B: By 25 percent
    C: By more than 50 percent
    D: By up to 75 percent
  answer: C
  explanation: When discussing clearing your vehicle for snowy conditions, the manual
    notes that a dirty headlight reduces light output by more than 50 percent.
- id: 209
  category: safe_driving_rules
  question: When driving in snowy conditions during the daytime, why should you turn
    on your low beams?
  choices:
    A: To melt snow falling on the headlights
    B: To increase your visibility to other drivers
    C: To activate your vehicle's defroster system
    D: To prevent your battery from freezing
  answer: B
  explanation: The manual advises turning on your low beams, even during the daytime
    in snowy conditions, because this increases your visibility to other drivers.
- id: 210
  category: defensive_driving
  question: If you encounter a snow squall while driving, what action should you take?
  choices:
    A: Slam on your brakes immediately to stop
    B: Accelerate to get out of the squall as quickly as possible
    C: Exercise extreme caution by gradually slowing and activating your hazard lights
    D: Turn on your high beams to cut through the heavy snow
  answer: C
  explanation: The manual advises that if you encounter a snow squall, you should
    exercise extreme caution by gradually slowing and activating your hazard lights
    for increased visibility, and specifically warns not to slam on your brakes.
- id: 211
  category: penalties_and_points
  question: What is the approximate total penalty, including fees, for failing to
    turn on your headlights when your wipers are in continuous or intermittent use?
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: C
  explanation: According to the manual, motorists who do not comply with the headlight/windshield
    wiper law face a fine of $25, but with fees and other associated costs, the penalty
    approaches $100.
- id: 212
  category: safe_driving_rules
  question: When driving in weather conditions that require continuous or intermittent
    use of your windshield wipers, what else must you do?
  choices:
    A: Turn on your high beams.
    B: Turn on your headlights and tail lights.
    C: Rely only on your daytime running lights.
    D: Turn on your hazard flashers.
  answer: B
  explanation: The law requires motorists to turn on their headlights anytime their
    wipers are in use due to weather. Daytime running lights are not enough, and tail
    lights must be illuminated as well.
- id: 213
  category: safe_driving_rules
  question: 'If you are approaching an emergency scene or a tow truck picking up a
    disabled vehicle and cannot move into a nonadjacent lane, you must:'
  choices:
    A: Stop your vehicle immediately.
    B: Reduce your speed to at least 20 mph below the posted speed limit.
    C: Maintain your speed but turn on your hazard lights.
    D: Honk your horn to alert the emergency workers.
  answer: B
  explanation: When approaching an emergency scene, police stop, or tow truck, you
    must move into a nonadjacent lane. If you cannot move over, you must reduce your
    speed to at least 20 miles per hour below the posted speed limit.
- id: 214
  category: defensive_driving
  question: How should you handle a situation where you are approaching a bicyclist
    on your right and an oncoming vehicle at the same time?
  choices:
    A: Speed up to pass the bicyclist before the vehicle reaches you.
    B: Move to the left lane and force the oncoming vehicle to slow down.
    C: Honk your horn so the bicyclist moves off the road.
    D: Slow down to let the oncoming vehicle pass, then move left to pass the bicyclist.
  answer: D
  explanation: You should handle this situation by facing only one traffic condition
    at a time. Slow down to let the oncoming vehicle pass and then move left to pass
    the cyclist, leaving a sufficient amount of space.
- id: 215
  category: signs_and_signals
  question: What does an orange triangle displayed on the back of a vehicle indicate?
  choices:
    A: The vehicle is carrying hazardous materials.
    B: The vehicle is designed to operate at 25 mph or less.
    C: The vehicle is broken down and waiting for a tow.
    D: The vehicle is a wide load.
  answer: B
  explanation: In rural areas, an orange triangle is displayed on the back of farm
    tractors and horse-drawn vehicles designed to operate at 25 mph or less.
- id: 216
  category: defensive_driving
  question: What should you do to communicate to drivers behind you that you are going
    to brake where they may not expect it?
  choices:
    A: Turn on your hazard flashers.
    B: Use a hand signal for slowing down.
    C: Quickly tap your brake pedal three or four times.
    D: Honk your horn twice.
  answer: C
  explanation: If you are going to brake where other drivers may not expect it, the
    manual advises to quickly tap your brake pedal three or four times to warn them.
- id: 217
  category: safe_driving_rules
  question: When must you use your hazard (four-way) flashers on a limited access
    highway?
  choices:
    A: When you are driving below 40 mph.
    B: When you are driving in the left lane.
    C: When you are passing a large truck.
    D: When you are approaching a toll booth.
  answer: A
  explanation: If you must drive below 40 mph on a limited access highway, you must
    use your hazard (four-way) flashers to warn the drivers behind you.
- id: 218
  category: safe_driving_rules
  question: Under Pennsylvania law, how far in advance must you use your turn signal
    if you are driving 35 mph or more?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: D
  explanation: If you are driving 35 mph or more, Pennsylvania law requires you to
    signal at least 300 feet before turning.
- id: 219
  category: safe_driving_rules
  question: If you are driving less than 35 mph, how far before a turn must you use
    your turn signals?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: Under Pennsylvania law, you must always use your turn signals at least
    100 feet before turning if you are driving less than 35 mph.
- id: 220
  category: defensive_driving
  question: If your vehicle breaks down on the highway and you have pulled off the
    road and turned on your hazard flashers, what else should you do to let other
    drivers know your vehicle is disabled?
  choices:
    A: Stand in the roadway and wave your arms.
    B: Lift your hood.
    C: Honk your horn continuously.
    D: Place an orange triangle on your roof.
  answer: B
  explanation: If your vehicle breaks down, you should pull off the road, put on your
    hazard flashers, and lift your hood to let other drivers know your vehicle is
    disabled.
- id: 221
  category: safe_driving_rules
  question: According to the manual, what is probably the most important factor to
    concentrate on when making a turn?
  choices:
    A: The size of your vehicle
    B: Speed
    C: The type of road surface
    D: The time of day
  answer: B
  explanation: 'The manual states: "Speed is probably the most important factor. When
    turning, reduce to a speed that allows you to maintain control of your vehicle..."'
- id: 222
  category: safe_driving_rules
  question: When turning onto a highway that has more than one lane traveling in the
    direction you wish to go, which lane should you turn into?
  choices:
    A: The center lane.
    B: The lane furthest from you.
    C: The closest lane going in that direction.
    D: Any lane that is currently empty.
  answer: C
  explanation: If you are turning onto a highway which has more than one lane in the
    direction you wish to travel, turn into the closest lane going in that direction.
- id: 223
  category: signs_and_signals
  question: 'A lane in the middle of a two-way street marked on both sides by a solid
    outer line and a broken inner line may only be used for:'
  choices:
    A: Passing slow-moving vehicles.
    B: Left turns.
    C: Right turns.
    D: Emergency parking.
  answer: B
  explanation: A lane in the middle of a two-way street marked on both sides by two
    lines (one solid outer line and one broken inner line) means this lane may only
    be used for left turns.
- id: 224
  category: safe_driving_rules
  question: Which of the following is a correct guideline for safely using a center
    turn lane?
  choices:
    A: Enter the lane as early as possible to secure your spot.
    B: Leave the back end of your vehicle in the travel lane to block traffic.
    C: Enter the lane completely so you do not block traffic.
    D: Put on your right turn signal before entering.
  answer: C
  explanation: When you enter the center turn lane, you must enter it completely.
    Do not leave the back end of your vehicle sticking into the normal travel lane,
    blocking traffic.
- id: 225
  category: defensive_driving
  question: How long do dangerous snow squalls typically last for a specific roadway
    when a 'Snow Squall Warning' is issued?
  choices:
    A: Less than 45 minutes
    B: 1 to 2 hours
    C: 3 to 4 hours
    D: An entire day
  answer: A
  explanation: The National Weather Service issues Snow Squall Warnings for specific
    roadways where squalls are likely to cause great impact, typically lasting less
    than 45 minutes for a roadway.
- id: 226
  category: safe_driving_rules
  question: How far in advance should you use your turn signal before making a turn?
  choices:
    A: 1 to 2 seconds
    B: 3 to 4 seconds
    C: 5 to 6 seconds
    D: 10 seconds
  answer: B
  explanation: To complete a turn safely, the manual states you must signal three
    (3) to four (4) seconds before your turn.
- id: 227
  category: safe_driving_rules
  question: When choosing a place to make a U-turn, how far away must drivers coming
    from all directions be so they can see you clearly?
  choices:
    A: At least 100 feet
    B: At least 250 feet
    C: At least 500 feet
    D: At least 1,000 feet
  answer: C
  explanation: In choosing a place to make a U-turn, you must make sure drivers coming
    from all directions are at least 500 feet away from you and can see you clearly.
- id: 228
  category: defensive_driving
  question: When crossing traffic, when is it considered safe to stop halfway across
    a street?
  choices:
    A: When there is a stop sign in the middle of the intersection
    B: When cross traffic is moving at a slow speed
    C: When there is a center median turning lane large enough to hold your entire
      vehicle
    D: Whenever you have a green light but traffic is backed up
  answer: C
  explanation: Stopping halfway across a street is safe only when there is a turning
    lane provided in the center median large enough to hold your entire vehicle.
- id: 229
  category: defensive_driving
  question: If you are waiting to cross a street and an approaching vehicle has its
    turn signal on, what is the safest action?
  choices:
    A: Pull out immediately because the vehicle will definitely turn
    B: Wait until the other driver actually starts to turn before you go
    C: Honk your horn to let them know you are crossing
    D: Accelerate quickly to cross before they reach the intersection
  answer: B
  explanation: Do not pull out in front of an approaching vehicle with its turn signal
    on. The driver may have changed their mind or forgotten to turn off the signal.
    Wait until the other driver actually starts to turn before you go.
- id: 230
  category: safe_driving_rules
  question: Which of the following actions is illegal when using an acceleration lane
    to merge onto a highway?
  choices:
    A: Accelerating to the speed of traffic
    B: Looking for an opening in traffic
    C: Passing a vehicle ahead of you in the acceleration lane
    D: Using your turn signal before merging
  answer: C
  explanation: Entrance ramps for highways often have acceleration lanes. The manual
    explicitly states that it is illegal to pass a vehicle ahead of you in an acceleration
    lane.
- id: 231
  category: safe_driving_rules
  question: When passing on a two-lane road at 45 mph, how much clear roadway do you
    need to safely pass a slower vehicle?
  choices:
    A: 1/8 mile
    B: 1/4 mile
    C: 1/2 mile
    D: 1 mile
  answer: B
  explanation: Passing on a two-lane road requires good judgment. At 45 mph, this
    translates into 1/4 mile of clear roadway you need to safely pass a slower vehicle.
- id: 232
  category: safe_driving_rules
  question: Approximately how much faster than the vehicle you are passing do you
    need to be traveling to pass safely?
  choices:
    A: 5 mph faster
    B: 10 mph faster
    C: 15 mph faster
    D: 20 mph faster
  answer: B
  explanation: According to the manual, you need to be going about 10 mph faster than
    the vehicle(s) you are passing.
- id: 233
  category: safe_driving_rules
  question: Under which of the following conditions are you permitted to pass another
    vehicle on the right?
  choices:
    A: When the vehicle ahead is traveling below the posted speed limit
    B: When the driver you are passing is making or signaling a left turn
    C: When you are within 100 feet of an intersection
    D: When you are on a single-lane road and the vehicle ahead stops
  answer: B
  explanation: You may pass another vehicle on the right when the driver you are passing
    is making or signaling a left turn, provided you stay on the berm or shoulder.
- id: 234
  category: safe_driving_rules
  question: You may NOT pass another vehicle if you are within how many feet of an
    intersection or railroad grade crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: You may not pass if you are within 100 feet of or are crossing any
    intersection or railroad grade crossing, unless an official traffic control device
    says you may.
- id: 235
  category: safe_driving_rules
  question: After passing a vehicle, how do you know it is safe to move back into
    your original lane?
  choices:
    A: When you are one car length ahead of the passed vehicle
    B: When the driver you passed flashes their headlights
    C: When you can see both headlights of the passed vehicle in your rearview mirror
    D: When three seconds have passed since you overtook the vehicle
  answer: C
  explanation: Before you move back into the lane, make sure you can see both headlights
    on the front of the vehicle you passed in your rearview mirror.
- id: 236
  category: safe_driving_rules
  question: Who must yield the right-of-way at a circular intersection (or roundabout)?
  choices:
    A: Drivers already in the circle must yield to drivers entering.
    B: Drivers entering the circle must yield to drivers already in the circle.
    C: Drivers entering from the right must yield to drivers entering from the left.
    D: All drivers must stop and yield to the right.
  answer: B
  explanation: Drivers entering a circular intersection (or roundabout) must yield
    the right-of-way to drivers already in the circle.
- id: 237
  category: safe_driving_rules
  question: What must you do if you accidentally end up in a lane marked for turns
    only, but you want to go straight?
  choices:
    A: Stop and wait for traffic to clear before merging into the through lane.
    B: Proceed straight through the intersection cautiously.
    C: You must make the turn.
    D: Reverse your vehicle to change lanes.
  answer: C
  explanation: If you end up in a lane marked for turns only when you want to go straight
    through the intersection, you must make the turn.
- id: 238
  category: safe_driving_rules
  question: When turning left from a dual left turn lane, why is it important not
    to change lanes during the turn?
  choices:
    A: It will cause you to crash into the driver turning next to you.
    B: It is illegal to use your turn signal in an intersection.
    C: You will be forced to enter a jughandle.
    D: You will lose your right-of-way to oncoming traffic.
  answer: A
  explanation: The manual states that you must not change lanes during a turn from
    a dual left turn lane, as this will cause you to crash into the driver turning
    next to you.
- id: 239
  category: driver_responsibility
  question: In over one-third of crashes involving 16-year-old drivers in Pennsylvania,
    the teen driver was doing what?
  choices:
    A: Speeding on a left-bending curve.
    B: Pulling out from a stop sign or turning left across traffic.
    C: Failing to yield at a roundabout.
    D: Overtaking a bicyclist in an intersection.
  answer: B
  explanation: Intersections are places where teenage drivers have a high percentage
    of crashes. In over one-third of these crashes, the teen driver was pulling out
    from a stop sign or turning left across traffic.
- id: 240
  category: safe_driving_rules
  question: What is the correct procedure for turning left onto a divided highway?
  choices:
    A: Cross both roadways at once without stopping in the middle.
    B: Turn left onto the first roadway you encounter.
    C: Cross the first roadway when safe, then turn left on the other side of the
      barrier when there is a safe gap in the second roadway.
    D: Enter the jughandle on the left side of the road.
  answer: C
  explanation: To correctly turn left onto a divided highway, you need to cross the
    first roadway when there is a safe gap, and then turn left on the other side of
    the barrier when there is a safe gap in traffic on the second roadway.
- id: 241
  category: defensive_driving
  question: About how much of a gap in traffic do you need in both directions to travel
    across an intersection with a two-way stop sign on a 30 mph street?
  choices:
    A: A 3-second gap.
    B: A 6-second gap.
    C: A 9-second gap.
    D: A 12-second gap.
  answer: B
  explanation: To travel across an intersection with a two-way stop sign, you need
    about a 6-second gap in both directions to cross a 30 mph street.
- id: 242
  category: defensive_driving
  question: When making a right turn, approximately how large of a gap should you
    allow between you and any vehicle approaching from the left?
  choices:
    A: 4 seconds
    B: 6 seconds
    C: 8 seconds
    D: 10 seconds
  answer: C
  explanation: When turning right, you should allow a gap of about eight (8) seconds
    between you and any vehicle approaching from the left.
- id: 243
  category: safe_driving_rules
  question: How can you avoid a 'tangle turn' with another left-turning driver coming
    from the opposite direction?
  choices:
    A: By turning after you pass the center of the intersection.
    B: By turning before you reach the imaginary 'X' at the center of the intersection.
    C: By turning into the lane furthest from the centerline.
    D: By waiting until the other driver completes their turn first.
  answer: B
  explanation: You can avoid a 'tangle turn' with another left-turning driver by imagining
    an 'X' at the center of the intersection and turning before you reach the 'X'.
- id: 244
  category: safe_driving_rules
  question: Who has the right-of-way when you are pulling up to the yield line of
    a roundabout?
  choices:
    A: The vehicle entering the roundabout.
    B: Circulating traffic within the roundabout.
    C: Vehicles approaching from the right.
    D: Vehicles exiting the roundabout.
  answer: B
  explanation: When pulling up to the yield line of a roundabout, you must look to
    the left and check for approaching traffic, because circulating traffic has the
    right-of-way.
- id: 245
  category: signs_and_signals
  question: Which signal should you use as you approach your exit in a roundabout?
  choices:
    A: Left turn signal
    B: Right turn signal
    C: Hazard lights
    D: No signal is required
  answer: B
  explanation: As you approach your exit in a roundabout, you must use your RIGHT
    TURN SIGNAL.
- id: 246
  category: sharing_the_road
  question: What should you do if an emergency vehicle approaches while you are driving
    inside a roundabout?
  choices:
    A: Stop immediately inside the roundabout to let them pass.
    B: Speed up to exit the roundabout before the emergency vehicle enters.
    C: Immediately exit the roundabout and pull to the side.
    D: Pull over to the center island of the roundabout.
  answer: C
  explanation: If you are in a roundabout when an emergency vehicle approaches, you
    must immediately exit the roundabout and pull to the side. You should NEVER STOP
    IN THE ROUNDABOUT.
- id: 247
  category: sharing_the_road
  question: What is the rule regarding bicyclists who are functioning as vehicles
    in a roundabout?
  choices:
    A: You should honk to warn them to move to the pedestrian crosswalk.
    B: You may pass them if there is enough room on the left.
    C: You must never overtake a bicyclist acting as a vehicle in a roundabout.
    D: Bicyclists are not allowed to function as vehicles in a roundabout.
  answer: C
  explanation: Bicyclists have the option to function as a vehicle in a roundabout.
    Motorists must NEVER OVERTAKE A BICYCLIST ACTING AS A VEHICLE IN A ROUNDABOUT.
- id: 248
  category: safe_driving_rules
  question: What is the purpose of a jughandle on a busy commercial road?
  choices:
    A: To allow vehicles to make a left turn by using a right turn lane curving back
      to intersect the major road.
    B: To provide a safe place for vehicles to make a U-turn across the physical barrier.
    C: To allow emergency vehicles to bypass heavy traffic at an intersection.
    D: To create a designated lane for bicyclists and pedestrians.
  answer: A
  explanation: In a jughandle design, instead of making a left turn directly across
    oncoming traffic, you use a right turn lane curving back to intersect the major
    road at a traffic light to turn left.
- id: 249
  category: defensive_driving
  question: When is the best time to slow down to maintain control on a curve?
  choices:
    A: Just after you enter the curve.
    B: At the apex (middle) of the curve.
    C: Before you enter the curve.
    D: As you are exiting the curve.
  answer: C
  explanation: To maintain control on curves, you must slow down, and you should do
    it BEFORE you enter the curve.
- id: 250
  category: defensive_driving
  question: Where should you position your vehicle when safely driving through a right
    curve?
  choices:
    A: In the middle of your lane.
    B: Slightly to the right of the lane center.
    C: Slightly to the left of the lane center.
    D: On the shoulder of the road.
  answer: B
  explanation: To safely drive through curves, you should keep slightly to the right
    of the lane center on right curves and in the middle of your lane on left curves.
- id: 251
  category: driver_responsibility
  question: What is the most frequent crash type for 16-year-old drivers in Pennsylvania?
  choices:
    A: Rear-end collisions at stop lights.
    B: Head-on collisions on divided highways.
    C: Single-vehicle, run-off-the-road crashes.
    D: Tangle turns at intersections.
  answer: C
  explanation: According to the manual's Teen Crash Fact, the most frequent crash
    type for 16-year-old drivers in Pennsylvania is a single-vehicle, run-off-the-road
    crash.
- id: 252
  category: safe_driving_rules
  question: When traffic entering and exiting a highway must share a short 'weaving
    lane', who must yield the right-of-way?
  choices:
    A: The driver exiting the highway
    B: The driver entering the highway
    C: The driver traveling at a higher speed
    D: The driver traveling at a lower speed
  answer: B
  explanation: The manual states that if you are the driver entering the highway,
    you must yield to the exiting driver when sharing a weaving lane.
- id: 253
  category: safe_driving_rules
  question: What should you do if you miss your exit on a highway?
  choices:
    A: Stop and carefully back up on the shoulder
    B: Cross over the median to turn around
    C: Swerve across lanes to make the exit at the last second
    D: Take the next exit
  answer: D
  explanation: If you miss your exit, take the next one. Do not stop, back up, swerve
    across lanes, or cross over the median, as these maneuvers are illegal and hazardous.
- id: 254
  category: safe_driving_rules
  question: When exiting a highway, when is the proper time to slow down?
  choices:
    A: One mile before the exit ramp
    B: While still in the main traffic lane before changing lanes
    C: After you have moved into the exit lane
    D: As soon as you see the exit sign
  answer: C
  explanation: The manual instructs drivers to get in the proper lane for exiting
    well in advance and to not slow down until after moving into the exit lane.
- id: 255
  category: defensive_driving
  question: What causes 'highway hypnosis'?
  choices:
    A: Driving under the influence of prescription medications
    B: Staring straight ahead at the roadway for long periods of time and zoning out
    C: Driving at speeds exceeding 65 mph for more than an hour
    D: Looking back and forth rapidly between your mirrors and the road
  answer: B
  explanation: Highway hypnosis happens when you stare straight ahead at the roadway
    for long periods of time and stop actively scanning ahead, behind, and around
    your vehicle.
- id: 256
  category: safe_driving_rules
  question: When parking on a street with a curb, what is the maximum distance your
    vehicle can be from the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: If the street you are on has a curb, you must park as close to it as
    possible, but no more than 12 inches away.
- id: 257
  category: safe_driving_rules
  question: When you must park on the roadway, your vehicle must be visible for at
    least how far in both directions?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: When you must park on the roadway, use your four-way flashers and make
    sure your vehicle can be seen at least 500 feet in both directions.
- id: 258
  category: safe_driving_rules
  question: How should you position your steering wheel when parking your vehicle
    on a downhill grade, with or without a curb?
  choices:
    A: Turn your wheels completely to the left
    B: Turn your wheels completely to the right
    C: Keep your wheels pointed straight ahead
    D: Turn your wheels parallel to the roadway
  answer: B
  explanation: When parking your vehicle on a downhill with or without a curb, you
    should turn your steering wheel so your wheels are completely to the right.
- id: 259
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: You may never stop, stand, or park your vehicle within 15 feet of a
    fire hydrant.
- id: 260
  category: safe_driving_rules
  question: You must not park within how many feet of any flashing signal, stop sign,
    yield sign, or traffic control device located at the side of a roadway?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: It is illegal to park within 30 feet of any flashing signal, stop sign,
    yield sign, or traffic control device located at the side of a roadway.
- id: 261
  category: safe_driving_rules
  question: How far away must you park from the nearest rail at a railroad crossing?
  choices:
    A: At least 15 feet
    B: At least 20 feet
    C: At least 30 feet
    D: At least 50 feet
  answer: D
  explanation: You must never stop, stand, or park your vehicle within 50 feet of
    the nearest rail at a railroad crossing.
- id: 262
  category: safe_driving_rules
  question: What must you turn on when driving through an active work zone?
  choices:
    A: Your four-way flashers
    B: Your high beam headlights
    C: Your vehicle's headlights, not just daytime running lights
    D: Your interior dome light
  answer: C
  explanation: By law, you must turn on your vehicle's headlights, not just the daytime
    running lights, when driving through active work zones.
- id: 263
  category: penalties_and_points
  question: What is the penalty for certain violations, such as speeding, in an active
    work zone?
  choices:
    A: Fines are doubled
    B: Fines are tripled
    C: Your vehicle is immediately impounded
    D: You must retake the driving test
  answer: A
  explanation: Fines are doubled for certain violations in active work zones, including
    speeding.
- id: 264
  category: signs_and_signals
  question: How far in advance may warning signs, advance warning vehicles, or variable
    message boards be placed approaching a work zone?
  choices:
    A: A minimum of 50 feet
    B: A minimum of 100 feet
    C: A minimum of 200 feet
    D: A minimum of 500 feet
  answer: C
  explanation: Warning signs, advance warning vehicles, or variable message boards
    may be placed a minimum of 200 feet approaching a work zone.
- id: 265
  category: signs_and_signals
  question: How can you confirm you are headed in the right direction when entering
    a highway ramp?
  choices:
    A: You see a yellow line on your right and a white line on your left
    B: You see a white line on your right and a yellow line on your left
    C: You see solid double yellow lines on both sides of the ramp
    D: You see broken white lines on both sides of the ramp
  answer: B
  explanation: If you see a white line on your right and a yellow line on the left,
    you are headed in the right direction on a highway entrance ramp.
- id: 266
  category: safe_driving_rules
  question: What should you do regarding your following distance when driving in a
    work zone?
  choices:
    A: Maintain your normal following distance
    B: Double your following distance
    C: Triple your following distance
    D: Reduce your following distance by half
  answer: B
  explanation: The manual states to double your following distance in work zones,
    as the most common crash type in work zones is the rear-end collision.
- id: 267
  category: signs_and_signals
  question: Whose authority overrides conventional traffic control devices in a work
    zone?
  choices:
    A: Flaggers
    B: Construction workers
    C: Escort vehicles
    D: Electronic message boards
  answer: A
  explanation: You must obey flaggers in a work zone, as their authority overrides
    conventional traffic control devices.
- id: 268
  category: defensive_driving
  question: In which direction should you look as you approach a railroad crossing?
  choices:
    A: Right, left, and then right again
    B: Straight ahead only
    C: Left, right, and then left again
    D: Left and right simultaneously
  answer: C
  explanation: The manual advises to always look left, right, and then left again
    as you approach a railroad crossing, even if the signals are not flashing.
- id: 269
  category: defensive_driving
  question: What should you do if your vehicle gets trapped on a railroad crossing
    and a train is approaching?
  choices:
    A: Stay in the vehicle and brace for impact
    B: Quickly leave the vehicle and move as far away from the track as possible
    C: Try to restart the vehicle until the train is 100 feet away
    D: Honk your horn to warn the train engineer
  answer: B
  explanation: If you make the mistake of getting trapped on a railroad crossing and
    a train is approaching, you must quickly leave the vehicle and move as far away
    from the track as you can.
- id: 270
  category: sharing_the_road
  question: When is it safe to wave a pedestrian into the line of traffic?
  choices:
    A: Only at marked crosswalks
    B: When you have come to a complete stop
    C: Only if there are no other vehicles approaching
    D: It is never safe to wave a pedestrian into the line of traffic
  answer: D
  explanation: The manual explicitly states that it is never safe to wave a pedestrian
    into the line of traffic at any time, especially at unmarked or mid-block locations.
- id: 271
  category: sharing_the_road
  question: What should you do when approaching a stopped vehicle from behind?
  choices:
    A: Honk your horn and pass quickly on the left
    B: Slow down and do not pass until you are sure no pedestrians are crossing in
      front of it
    C: Pass on the right shoulder if there is enough room
    D: Flash your high beams to warn the driver you are passing
  answer: B
  explanation: When approaching a stopped vehicle from behind, you should slow down
    and do not pass until you are sure there are no pedestrians crossing in front
    of it.
- id: 272
  category: sharing_the_road
  question: When passing a truck, when is it safe to move back into the truck's lane?
  choices:
    A: As soon as your rear bumper clears the truck's front bumper
    B: When you can see the truck's headlights or front grill in your rearview mirror
    C: When the truck driver flashes their headlights
    D: After you have maintained your speed for 5 seconds
  answer: B
  explanation: After passing a truck, you should change lanes only when you can see
    the truck's headlights or front grill in your rearview mirror.
- id: 273
  category: sharing_the_road
  question: Why might you need to increase your speed when passing a truck on a downgrade?
  choices:
    A: Because the truck's momentum will cause it to go faster
    B: Because the truck will intentionally speed up to prevent you from passing
    C: Because it is illegal to pass a truck slowly on a hill
    D: Because the wind turbulence is stronger on a downgrade
  answer: A
  explanation: On a downgrade, a truck's momentum will cause it to go faster, so you
    may need to increase your speed to pass it safely.
- id: 274
  category: sharing_the_road
  question: Why should you avoid slowing down or stopping quickly immediately after
    passing a bicyclist?
  choices:
    A: It will cause the bicyclist to lose their balance
    B: The bicyclist may crash into your vehicle
    C: It is illegal to brake in front of a non-motorized vehicle
    D: It creates excessive wind turbulence
  answer: B
  explanation: After you have passed a bicyclist, do not slow down or stop quickly
    because a quick stop could lead to the bicyclist crashing into your vehicle.
- id: 275
  category: sharing_the_road
  question: How much lane space must you allow a motorcyclist or moped driver to use?
  choices:
    A: Half of a lane
    B: One complete lane
    C: Only the right side of the lane
    D: As much space as they need up to the center line
  answer: B
  explanation: According to the law, you must allow the motorcyclist or moped driver
    to use one complete lane.
- id: 276
  category: sharing_the_road
  question: Why should you not assume a motorcycle is turning just because its turn
    signal is flashing?
  choices:
    A: Motorcyclists often use turn signals to indicate they are slowing down
    B: The turn signals may not turn off automatically like a car's
    C: Flashing signals indicate the motorcycle has the right-of-way
    D: Motorcyclists use turn signals to test their battery
  answer: B
  explanation: You should not assume a motorcycle or moped is turning when its signal
    is flashing because their turn signals may not turn off automatically like a vehicle's.
- id: 277
  category: sharing_the_road
  question: What should you do when a large truck is passing your vehicle?
  choices:
    A: Increase your speed to get out of the way
    B: Reduce your speed slightly and keep it steady
    C: Brake hard to let the truck pass quickly
    D: Move into the truck's blind spot
  answer: B
  explanation: When a truck passes your vehicle, you will make it easier for the truck
    driver if you reduce your speed slightly and then keep your speed steady. Do not
    increase your speed.
- id: 278
  category: safe_driving_rules
  question: Which of the following is a safety rule you must follow when driving through
    a work zone?
  choices:
    A: Always use your cruise control to maintain a steady speed
    B: Do not use your cruise control
    C: Stop to ask directions from workers if you are lost
    D: Cross solid white lines to avoid construction equipment
  answer: B
  explanation: The manual lists several safety rules for work zones, including 'Do
    not use your cruise control in work zones.'
- id: 279
  category: defensive_driving
  question: How much more likely are you to die in a crash involving a train compared
    to a crash with another vehicle?
  choices:
    A: 10 times more likely
    B: 20 times more likely
    C: 30 times more likely
    D: 40 times more likely
  answer: D
  explanation: According to the manual, you are 40 times more likely to die in a crash
    involving a train than you are in a crash with another vehicle.
- id: 280
  category: sharing_the_road
  question: What is the recommended minimum following distance you should allow when
    driving behind a motorcycle?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: You should allow the same 4-second following distance or more that
    you would allow for other vehicles when following a motorcycle or moped.
- id: 281
  category: sharing_the_road
  question: How does wind turbulence between your vehicle and an oncoming truck affect
    the vehicles?
  choices:
    A: It pulls the vehicles together.
    B: It pushes the vehicles apart.
    C: It causes the truck to brake suddenly.
    D: It has no effect on passenger vehicles.
  answer: B
  explanation: The manual states, "Remember, the wind turbulence pushes vehicles apart.
    It does not pull them together."
- id: 282
  category: sharing_the_road
  question: How can you ensure a truck driver can see your vehicle when you are following
    them?
  choices:
    A: Turn your high beams on so you are visible.
    B: Honk your horn every few minutes.
    C: Position your vehicle so you can see the truck's side mirrors.
    D: Tailgate the truck closely to stay in their direct line of sight.
  answer: C
  explanation: The manual states, "When following a truck or bus, if you cannot see
    the side mirrors of the vehicle in front of you, the driver of the large vehicle
    cannot see you."
- id: 283
  category: defensive_driving
  question: Why should you leave plenty of room between your vehicle and a truck when
    coming to a stop on a hill?
  choices:
    A: The truck's exhaust will damage your windshield.
    B: Trucks may roll back as the driver takes their foot off the brake.
    C: The truck needs extra room to make a wide turn.
    D: The truck's air brakes will release a loud noise.
  answer: B
  explanation: The manual states, "Leave plenty of room between you and the truck
    when coming to a stop on a hill. Trucks may roll back as a driver takes their
    foot off of the brake."
- id: 284
  category: safe_driving_rules
  question: What is the recommended minimum following distance to keep you out of
    a truck's rear blind spot?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Five seconds
  answer: C
  explanation: The manual states, "At least four (4) seconds are needed to keep you
    out of the truck’s rear blind spot..."
- id: 285
  category: sharing_the_road
  question: 'When a truck is making a wide right turn, it may sometimes look like
    it is:'
  choices:
    A: Going straight or turning left
    B: Preparing to back up
    C: Experiencing brake failure
    D: Speeding up to pass another vehicle
  answer: A
  explanation: The manual states, "It may look like trucks are going straight or turning
    left when they are actually making a right turn."
- id: 286
  category: vehicle_information
  question: Under clear, dry conditions at 65 mph, what is the minimum stopping distance
    required for a loaded truck with good tires and properly adjusted brakes?
  choices:
    A: 200 feet
    B: 400 feet
    C: 600 feet
    D: 800 feet
  answer: C
  explanation: The manual states that a loaded truck traveling at 65 mph on a clear,
    dry roadway requires a minimum of 600 feet to come to a complete stop.
- id: 287
  category: safe_driving_rules
  question: What is the purpose of escape ramps on long downgrades?
  choices:
    A: For passenger vehicles to take a rest break.
    B: For police to monitor speeding vehicles.
    C: For large vehicles that are out of control or have brake failure.
    D: For oversized loads to allow traffic to pass.
  answer: C
  explanation: The manual states, "These ramps are to be used only by large vehicles
    that are out of control or cannot stop because of brake failure."
- id: 288
  category: safe_driving_rules
  question: When a school bus stops with its red lights flashing and stop arm extended,
    how far away must you stop?
  choices:
    A: At least 10 feet away
    B: At least 15 feet away
    C: At least 20 feet away
    D: At least 50 feet away
  answer: A
  explanation: The manual states, "you must stop at least 10 feet away from the bus
    whether you are behind it or coming toward it on the same roadway..."
- id: 289
  category: safe_driving_rules
  question: Under what condition are you NOT required to stop for a school bus with
    flashing red lights and an extended stop arm?
  choices:
    A: When you are traveling in the same direction as the bus.
    B: When you are approaching an intersection where the bus is stopped.
    C: When you are driving on the opposite side of a divided highway.
    D: When you are driving in a designated school zone.
  answer: C
  explanation: The manual states, "If you are approaching a school bus... and you
    are driving on the opposite side of a divided highway... you do not have to stop."
- id: 290
  category: penalties_and_points
  question: What is the penalty for failing to stop for a school bus with a flashing
    red light and extended stop arm?
  choices:
    A: A 30-day suspension, 3 points, and a fine
    B: A 60-day suspension, 5 points, and a fine
    C: A 90-day suspension, 2 points, and a fine
    D: A 6-month suspension, 6 points, and a fine
  answer: B
  explanation: The manual states, "Failure to stop for a school bus with a flashing
    red light and extended stop arm will result in a 60-day suspension of your driver’s
    license, five (5) points on your driving record and a fine."
- id: 291
  category: safe_driving_rules
  question: According to the Move Over law, what must you do if you cannot move into
    a lane that is not adjacent to an emergency response area?
  choices:
    A: Stop your vehicle immediately until the emergency is cleared.
    B: Maintain your speed but turn on your hazard lights.
    C: Reduce your speed to at least 20 miles per hour below the posted speed limit.
    D: Honk your horn to alert emergency workers of your presence.
  answer: C
  explanation: The manual states, "If drivers cannot move over because of traffic
    or other conditions, they must reduce their speed to at least 20 miles per hour
    below the posted speed limit."
- id: 292
  category: penalties_and_points
  question: How many points are assessed to your driving record if you are convicted
    of violating the Move Over law?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: A
  explanation: The manual states, "Any person convicted of a violation of this law
    will have 2 points assessed to their driving record."
- id: 293
  category: penalties_and_points
  question: What happens to the fines for traffic violations, including Move Over
    law violations, that occur in work zone areas?
  choices:
    A: They are waived if no workers are present.
    B: They are reduced by half.
    C: They remain the same as on normal roadways.
    D: They are doubled.
  answer: D
  explanation: The manual states, "In addition, fines will be doubled for traffic
    violations occurring in work zone areas."
- id: 294
  category: sharing_the_road
  question: Why should you always dim your headlights when following a truck at night?
  choices:
    A: Bright lights will drain your vehicle's battery faster.
    B: Bright lights will blind the truck driver when they reflect off the large side
      mirrors.
    C: Truck drivers use their mirrors to signal other drivers.
    D: Dimming your lights helps you see the truck's brake lights better.
  answer: B
  explanation: The manual states, "Bright lights from a vehicle behind will blind
    the truck driver when they reflect off of the truck’s large side mirrors."
- id: 295
  category: sharing_the_road
  question: What should you expect when encountering an oversized load on the road?
  choices:
    A: They will always pull over to let you pass.
    B: They travel much faster than normal tractor trailers.
    C: They are accompanied by pilot vehicles and may cross the yellow or white line.
    D: They are only allowed to travel at night.
  answer: C
  explanation: The manual states, "Oversized loads are accompanied by pilot vehicles...
    due to their excessive width, obstacles on the berm could cause them to cross
    the yellow or white line."
- id: 296
  category: sharing_the_road
  question: Why should you leave plenty of room when stopped behind a horse-drawn
    vehicle?
  choices:
    A: They often roll backward after stopping.
    B: The horses might kick your vehicle.
    C: They require a 50-foot clearance by law.
    D: The driver needs room to dismount safely.
  answer: A
  explanation: According to the manual, after stopping, horse-drawn vehicles often
    roll backward, and following too close limits the driver's ability to see you.
- id: 297
  category: sharing_the_road
  question: What should you avoid doing when passing a horse-drawn vehicle or horseback
    rider?
  choices:
    A: Using your turn signals.
    B: Driving too fast or blowing your horn.
    C: Passing on the left side.
    D: Leaving space before pulling back into the right lane.
  answer: B
  explanation: When you pass a horse-drawn vehicle or horseback rider, do not drive
    too fast or blow your horn, as this may spook the horse.
- id: 298
  category: safe_driving_rules
  question: What is the maximum speed limit for an open-bed pickup truck if a person
    is occupying the bed of the truck?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: An open-bed pickup truck or open flatbed truck may not be driven at
    a speed of more than 35 mph if any person is occupying the bed of the truck.
- id: 299
  category: safe_driving_rules
  question: Under which of the following conditions is a child under 18 legally permitted
    to ride in the bed of an open-bed truck?
  choices:
    A: When traveling to a school event.
    B: When participating in an officially sanctioned parade.
    C: When the truck is traveling under 15 mph.
    D: When accompanied by an adult in the truck bed.
  answer: B
  explanation: Exceptions to the law prohibiting children under 18 from riding in
    an open truck bed include a child who is a participant in an officially sanctioned
    parade.
- id: 300
  category: sharing_the_road
  question: After an emergency vehicle passes you, what is the minimum distance you
    must keep away from it?
  choices:
    A: 100 feet
    B: 250 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: The manual instructs drivers to start driving again after the emergency
    vehicle passes, keeping at least 500 feet away from it.
- id: 301
  category: sharing_the_road
  question: Why is it dangerous to attempt to pass a snow plow?
  choices:
    A: They travel at speeds exceeding the posted limit.
    B: They may have wing plows that stick out several feet on either side.
    C: Passing a snow plow is an automatic license suspension.
    D: They frequently stop to pick up stranded motorists.
  answer: B
  explanation: Snow plows may have wing plows that stick out several feet on either
    side, which are difficult to see and have been involved in multiple side-swipe
    accidents. Therefore, you should not attempt to pass a plow.
- id: 302
  category: defensive_driving
  question: If an aggressive driver pursues you, what is the safest course of action?
  choices:
    A: Drive to your home and lock the doors.
    B: Speed up to lose the aggressive driver.
    C: Drive to a police station or convenience store.
    D: Stop your vehicle and confront the driver.
  answer: C
  explanation: If an aggressive driver pursues you, do not go home. Instead, drive
    to a police station, convenience store, or other location where you can get help
    and there will be witnesses.
- id: 303
  category: defensive_driving
  question: According to the manual, approximately what percentage of highway deaths
    in Pennsylvania each year are attributed to aggressive driving?
  choices:
    A: 20 percent
    B: 37 percent
    C: 60 percent
    D: 85 percent
  answer: C
  explanation: Of the approximate 1,500 highway deaths in PA each year, about 60 percent
    (around 900) are attributed to aggressive driving.
- id: 304
  category: defensive_driving
  question: When avoiding a collision at speeds above 25 mph, why is it usually better
    to steer to avoid the hazard than to brake?
  choices:
    A: Braking at high speeds always causes a vehicle to roll over.
    B: Your reaction time to swerve is faster than your reaction time to brake.
    C: Anti-lock brakes do not function above 25 mph.
    D: Steering requires less physical effort than braking.
  answer: B
  explanation: It is usually better to steer to avoid a hazard than to brake at speeds
    above 25 mph because your reaction time to swerve is faster than your reaction
    time to brake.
- id: 305
  category: vehicle_information
  question: Where should your hands be positioned on the steering wheel to minimize
    the risk of injury if the air bag deploys?
  choices:
    A: 10 and 2 o'clock
    B: 12 and 6 o'clock
    C: 9 and 3 o'clock or 8 and 4 o'clock
    D: One hand at 12 o'clock
  answer: C
  explanation: The manual recommends holding the wheel at the 9 and 3 o'clock or 8
    and 4 o'clock positions. A 10 and 2 o'clock position puts you at risk of injury
    if the air bag deploys.
- id: 306
  category: vehicle_information
  question: How should you position your thumbs when holding the steering wheel?
  choices:
    A: Gripping tightly inside the rim of the wheel.
    B: Resting on the center horn pad.
    C: Pointing directly toward your body.
    D: Along the face of the steering wheel.
  answer: D
  explanation: You should keep your thumbs along the face of the steering wheel instead
    of gripping the inside of the rim.
- id: 307
  category: safe_driving_rules
  question: To help prevent injury in a crash, what is the minimum recommended distance
    you should be positioned away from your air bag?
  choices:
    A: 5 inches
    B: 10 inches
    C: 15 inches
    D: 20 inches
  answer: B
  explanation: Injury prevention in a crash depends mostly on wearing your seat belt
    properly, having head restraints adjusted, and being positioned at least ten (10)
    inches away from your air bag.
- id: 308
  category: defensive_driving
  question: How should you apply the brakes in an emergency if your vehicle does NOT
    have an anti-lock braking system (ABS)?
  choices:
    A: Maintain firm and continuous pressure.
    B: Slam on the brakes and hold them down.
    C: Press and release the brakes repeatedly.
    D: Apply the parking brake immediately.
  answer: C
  explanation: Without ABS, you should press and release the brakes repeatedly (pumping
    the brakes) to slow your vehicle and keep it under control. Slamming the brakes
    can lock your wheels.
- id: 309
  category: defensive_driving
  question: What is the correct braking technique during an emergency if your vehicle
    is equipped with anti-lock brakes (ABS)?
  choices:
    A: Pump the brake pedal rapidly.
    B: Maintain firm and continuous pressure on the brake.
    C: Press the brake lightly and steer sharply.
    D: Slam the brakes and immediately release them.
  answer: B
  explanation: With ABS, you should maintain firm and continuous pressure on the brake.
    Do not pump the brake pedal.
- id: 310
  category: defensive_driving
  question: What should you do if the rear of your vehicle starts to skid to the right
    on an icy road?
  choices:
    A: Turn the steering wheel to the left.
    B: Turn the steering wheel to the right.
    C: Slam on the brakes immediately.
    D: Shift into neutral and coast.
  answer: B
  explanation: If your vehicle starts to skid, look and steer in the direction you
    want to go. If the rear of your vehicle is skidding to the right, turn the wheel
    to the right. You should not use your brakes.
- id: 311
  category: defensive_driving
  question: What should you do if your vehicle begins to skid?
  choices:
    A: Slam on the brakes immediately
    B: Steer in the opposite direction the rear is skidding
    C: Steer in the direction the rear of your vehicle is skidding
    D: Shift into neutral and apply the parking brake
  answer: C
  explanation: To stop a skid, you should steer in the direction the rear of your
    vehicle is skidding. It may take a few corrections to regain control.
- id: 312
  category: defensive_driving
  question: Why should you avoid using your brakes when your vehicle is skidding?
  choices:
    A: It will cause the engine to stall
    B: You risk locking your wheels and losing all steering control
    C: It will cause the accelerator to stick
    D: It will damage your transmission
  answer: B
  explanation: When skidding, do not use your brakes. If you hit the brakes, the skid
    will be worse and you risk locking your wheels and losing all steering control.
- id: 313
  category: safe_driving_rules
  question: How much moving water does it take to float many cars?
  choices:
    A: Two inches
    B: Six inches
    C: Twelve inches
    D: Two feet
  answer: C
  explanation: According to the manual, twelve inches of moving water can float many
    cars.
- id: 314
  category: safe_driving_rules
  question: How much moving water is generally required to carry away most sport utility
    vehicles (SUVs) and pick-up trucks?
  choices:
    A: Six inches
    B: Twelve inches
    C: Eighteen inches
    D: Two feet
  answer: D
  explanation: Two feet of moving water can move most SUVs and pick-up trucks, and
    will carry away most vehicles.
- id: 315
  category: defensive_driving
  question: If your vehicle's accelerator (gas pedal) sticks, what is the first thing
    you should do with your vehicle's transmission?
  choices:
    A: Shift to neutral immediately
    B: Shift into the lowest gear
    C: Shift into park
    D: Shift into reverse
  answer: A
  explanation: If the accelerator sticks and tapping it does not work, you should
    shift to neutral immediately and use the brakes.
- id: 316
  category: vehicle_information
  question: If you need to slow or stop quickly because your accelerator is stuck,
    why should you avoid turning your ignition to the 'LOCK' position?
  choices:
    A: It will cause the engine to catch fire
    B: You will lose your steering ability
    C: Your brakes will immediately lock up
    D: It will deploy the airbags
  answer: B
  explanation: If you need to slow or stop quickly, turn your ignition to 'OFF.' Do
    not turn it to 'LOCK' because you will lose steering ability.
- id: 317
  category: vehicle_information
  question: If the brake system warning light comes on in a newer vehicle, what should
    you expect when pressing the brake pedal?
  choices:
    A: The pedal will feel unusually stiff and hard to press
    B: The pedal will go down farther than usual and you will need to push harder
    C: The vehicle will immediately lock all four wheels
    D: The pedal will vibrate violently
  answer: B
  explanation: In newer vehicles with a split braking system, if the warning light
    comes on, you will feel the brake pedal go down farther than usual before the
    vehicle begins to slow, and you will need to push harder.
- id: 318
  category: vehicle_information
  question: When changing a flat tire, at what point should you loosen the lug nuts?
  choices:
    A: After the vehicle is raised 6 inches off the ground
    B: While the vehicle is still on the ground
    C: After completely removing the hubcap and jacking the car up 12 inches
    D: Only after the spare tire is installed
  answer: B
  explanation: While the vehicle is on the ground, loosen the lug nuts by using the
    end of the lug wrench. Do not fully remove them until the vehicle is raised.
- id: 319
  category: defensive_driving
  question: What is a common indication that a front tire has blown out?
  choices:
    A: The rear of the vehicle will wobble back and forth
    B: Your steering wheel will vibrate and the vehicle will suddenly pull to one
      side
    C: The engine will suddenly race
    D: The brake pedal will drop to the floor
  answer: B
  explanation: When a front tire blows out, your steering wheel will vibrate, and
    you will feel the vehicle suddenly pull to one side.
- id: 320
  category: defensive_driving
  question: What is the most important thing to avoid doing immediately after a tire
    blowout?
  choices:
    A: Holding the steering wheel tightly
    B: Taking your foot off the gas pedal
    C: Braking
    D: Steering smoothly
  answer: C
  explanation: If a tire blows out, stay off of your brake! Braking after a blowout
    will cause you to skid and lose control of your vehicle.
- id: 321
  category: defensive_driving
  question: If your brakes suddenly fail in an older vehicle, what should you try
    doing to build up brake pressure?
  choices:
    A: Shift into neutral and turn the engine off
    B: Pump the brake pedal quickly several times
    C: Pull the parking brake up as fast and hard as possible
    D: Press and hold the brake pedal firmly to the floor
  answer: B
  explanation: If brakes fail in an older vehicle, pump the brake pedal quickly several
    times. This will often build up enough brake pressure to stop the vehicle.
- id: 322
  category: defensive_driving
  question: If another vehicle is approaching you head-on in your lane, which direction
    should you try to escape if possible?
  choices:
    A: To the left
    B: To the right
    C: Straight ahead while braking hard
    D: Into the oncoming traffic lane
  answer: B
  explanation: If another vehicle is approaching head-on, honk your horn to attract
    attention and try to escape to the right, if possible. Swerving left could result
    in a crash if the other driver corrects.
- id: 323
  category: sharing_the_road
  question: What must you do if you encounter a funeral procession at an intersection?
  choices:
    A: Proceed if you have a green light, cutting through the procession
    B: Yield to vehicles in the procession until they have all passed
    C: Honk your horn to let them know you are waiting
    D: Merge into the procession to get through the intersection faster
  answer: B
  explanation: Once the lead vehicle has cleared an intersection, the rest of the
    procession may proceed through the intersection, and other traffic must yield.
    Allow the procession to pass and do not cut in and out.
- id: 324
  category: sharing_the_road
  question: How can you identify vehicles that are part of a funeral procession?
  choices:
    A: They will have their high beam headlights on
    B: They will have their headlights and emergency flashers turned on and bear a
      flag or insignia
    C: They will be driving at least 15 mph under the speed limit
    D: They will have a yellow flashing light on the roof
  answer: B
  explanation: All vehicles in a funeral procession must have their headlights and
    emergency flashers turned on and bear a flag or other insignia designating them
    as part of the procession.
- id: 325
  category: safe_driving_rules
  question: What is your best option if you get stuck in floodwaters?
  choices:
    A: Stay in your vehicle and wait for emergency services
    B: Quickly get out of your vehicle and move to higher ground
    C: Roll up your windows and turn on the air conditioning
    D: Try to restart the engine and reverse out of the water
  answer: B
  explanation: If you do get stuck in floodwaters, quickly get out of your vehicle
    and move to higher ground.
- id: 326
  category: sharing_the_road
  question: What must all vehicles in a funeral procession have turned on?
  choices:
    A: High beam headlights
    B: Headlights and emergency flashers
    C: Only emergency flashers
    D: Interior dome lights
  answer: B
  explanation: According to the manual, all vehicles in a funeral procession must
    have their headlights and emergency flashers turned on and bear a flag or other
    insignia.
- id: 327
  category: sharing_the_road
  question: If the lead vehicle of a funeral procession enters an intersection on
    a green light, what may the following vehicles in the procession do?
  choices:
    A: They must stop if the light turns red.
    B: They must yield to all cross traffic before proceeding.
    C: They may proceed through a red light.
    D: They must wait for the next green light.
  answer: C
  explanation: Drivers in funeral processions may proceed through a red light or stop
    sign, if the lead vehicle starts through the intersection while the light was
    green.
- id: 328
  category: defensive_driving
  question: What is the first thing you should do if your vehicle's right wheels drift
    off the pavement onto the shoulder?
  choices:
    A: Brake hard immediately.
    B: Steer sharply to the left.
    C: Ease off of the gas pedal to slow down.
    D: Turn on your hazard lights.
  answer: C
  explanation: If you drift off the pavement, the first step is to ease off of the
    gas pedal to slow down. You should not brake suddenly.
- id: 329
  category: defensive_driving
  question: Why is it dangerous to turn the steering wheel sharply to get back onto
    the road after drifting onto a soft shoulder?
  choices:
    A: It will damage your front tires.
    B: It can cause the vehicle to whip sideways and cross into oncoming traffic.
    C: It will cause your engine to stall.
    D: It will lock your steering wheel.
  answer: B
  explanation: The manual warns that if you turn the wheel sharply to get back onto
    the road, it can cause the vehicle to whip sideways and cross into oncoming traffic.
- id: 330
  category: safe_driving_rules
  question: Before attempting to steer back onto the pavement after drifting off,
    you should continue to slow gradually until you are traveling at what speed?
  choices:
    A: Less than 25 mph
    B: Less than 35 mph
    C: Less than 45 mph
    D: Less than 55 mph
  answer: A
  explanation: You should continue to slow gradually until you are traveling very
    slowly - less than 25 mph and preferably closer to 10 mph - before steering back
    onto the pavement.
- id: 331
  category: driver_responsibility
  question: 'Teenage drivers are more likely to be involved in a crash when:'
  choices:
    A: They are driving with adult passengers
    B: They are driving with teenage passengers
    C: They are driving without any passengers
    D: They are driving with their pet as a passenger
  answer: B
  explanation: According to the manual's review questions, teenage drivers are more
    likely to be involved in a crash when they are driving with teenage passengers.
- id: 332
  category: sharing_the_road
  question: 'When traveling behind a motorcycle, you should allow a following distance
    of at least:'
  choices:
    A: 2 car lengths
    B: 2 seconds
    C: 4 seconds
    D: 4 motorcycle lengths
  answer: C
  explanation: When traveling behind a motorcycle, you must allow at least 4 seconds
    of following distance.
- id: 333
  category: sharing_the_road
  question: Who must yield when a driver is turning and a pedestrian is crossing without
    a traffic light?
  choices:
    A: The pedestrian
    B: The driver
    C: Whoever started last
    D: Whoever is slower
  answer: B
  explanation: The driver must yield when turning if a pedestrian is crossing, even
    without a traffic light.
- id: 334
  category: sharing_the_road
  question: 'When sharing the road with a truck, it is important to remember that,
    in general, trucks:'
  choices:
    A: Take longer distances than cars to stop
    B: Require less time to pass on a downgrade than cars
    C: Require less turning radius than cars
    D: Require less time to pass on an incline than cars
  answer: A
  explanation: In general, trucks take longer distances than cars to stop.
- id: 335
  category: sharing_the_road
  question: 'If you are following a truck that swings left before making a right turn
    at an intersection, it is very dangerous to:'
  choices:
    A: Apply your brakes until the truck has completed the turn
    B: Try to squeeze between the truck and curb to make a right turn
    C: Violate the 4-second following distance rule
    D: Honk your horn at the truck driver
  answer: B
  explanation: It is very dangerous to try to squeeze between the truck and the curb
    to make a right turn when a truck swings left to prepare for the turn.
- id: 336
  category: sharing_the_road
  question: 'The only time you do not have to stop for a school bus whose red lights
    are flashing and stop arm is extended is when you:'
  choices:
    A: Are driving on the opposite side of a divided highway
    B: Are behind the bus
    C: See no children present
    D: Can safely pass on the left
  answer: A
  explanation: You do not have to stop for a school bus with flashing red lights if
    you are driving on the opposite side of a divided highway.
- id: 337
  category: safe_driving_rules
  question: 'If you stop at a railroad crossing with more than one track, you should:'
  choices:
    A: Stop on the railroad track and watch for another train
    B: Go through as soon as the train passes
    C: Go through when one of the tracks is free
    D: Wait until you have a clear view of both tracks
  answer: D
  explanation: At a railroad crossing with more than one track, you must wait until
    you have a clear view of both tracks before proceeding.
- id: 338
  category: safe_driving_rules
  question: 'When you are planning to make a turn, you should activate your turn signals:'
  choices:
    A: Only if there are other drivers following you
    B: Just as the front of your car reaches the intersection
    C: 3 to 4 seconds before you reach the intersection
    D: 2 car lengths before reaching the intersection
  answer: C
  explanation: You should activate your turn signals 3 to 4 seconds before you reach
    the intersection.
- id: 339
  category: defensive_driving
  question: What is meant by a driver's "blind spot"?
  choices:
    A: The area of the road you cannot see without moving your head
    B: The area directly behind your vehicle
    C: The area you see in your rearview mirror
    D: The area you see in your side mirror
  answer: A
  explanation: Your blind spot is the area of the road that you cannot see without
    moving your head to look over your shoulder.
- id: 340
  category: safe_driving_rules
  question: What is the proper procedure to follow before backing up your vehicle?
  choices:
    A: Rely solely on your mirrors to see if it is clear
    B: Flash your lights to warn others
    C: Open your door to look behind you
    D: Turn your head and look through the rear window
  answer: D
  explanation: Before backing up, you should turn your head and look through the rear
    window to ensure the path is clear to proceed.
- id: 341
  category: vehicle_information
  question: What should you do to indicate you are turning if your vehicle's turn
    signals fail?
  choices:
    A: Honk your horn
    B: Flash your headlights
    C: Use hand signals
    D: Turn on your emergency flashers
  answer: C
  explanation: If your turn signals fail, you should use proper hand signals to indicate
    to other drivers that you are turning.
- id: 342
  category: safe_driving_rules
  question: You must use your headlights when other vehicles are not visible from
    what distance?
  choices:
    A: 500 feet away
    B: 1000 feet away
    C: 1200 feet away
    D: 1500 feet away
  answer: B
  explanation: You must use your headlights when other vehicles are not visible from
    1000 feet away.
- id: 343
  category: defensive_driving
  question: Where should you look if a vehicle using high beams is coming toward you?
  choices:
    A: Towards the center of the road
    B: Towards the left side of the road
    C: Towards the right side of the road
    D: Directly at the oncoming vehicle's headlights
  answer: C
  explanation: If a vehicle using high beams comes toward you, you should look towards
    the right side of the road to avoid being blinded by the glare.
- id: 344
  category: alcohol_drugs_health
  question: 'The effect that a lack of sleep has on your safe driving ability is the
    same as:'
  choices:
    A: The effect that alcohol has
    B: The effect that amphetamines have
    C: The effect that anger has
    D: The effect of driving with teenage passengers
  answer: A
  explanation: The effect that lack of sleep has on your safe driving ability is the
    same as the effect that alcohol has.
- id: 345
  category: alcohol_drugs_health
  question: To avoid the risk of drowsy driving crashes, teenagers should try to get
    at least how much sleep each night?
  choices:
    A: 6 hours
    B: 7 hours
    C: 8 hours
    D: 9 hours
  answer: C
  explanation: Teenagers should try to get at least 8 hours of sleep each night to
    avoid the risk of drowsy driving crashes.
- id: 346
  category: alcohol_drugs_health
  question: For an average person, how many minutes does the body need to process
    the alcohol in one drink?
  choices:
    A: 15 minutes
    B: 30 minutes
    C: 60 minutes
    D: 90 minutes
  answer: C
  explanation: For an average person, the body needs 60 minutes to process the alcohol
    in one drink.
- id: 347
  category: alcohol_drugs_health
  question: What is the effect of taking drugs along with alcohol before driving?
  choices:
    A: It lessens the effect of alcohol on your ability to drive
    B: It increases the risk of causing a crash
    C: It has no effect on your general driving ability
    D: It is no more dangerous than alcohol by itself
  answer: B
  explanation: Taking drugs along with alcohol increases the risk of causing a crash.
- id: 348
  category: defensive_driving
  question: What is the proper response if you experience a tire blowout while driving?
  choices:
    A: Brake hard to stop the car immediately
    B: Allow the steering wheel to move freely
    C: Continue driving until you reach a garage
    D: Let the car slow to a stop
  answer: D
  explanation: If you have a tire blowout, you should let the car slow to a stop rather
    than braking hard.
- id: 349
  category: sharing_the_road
  question: What must you do when you see an emergency vehicle with flashing lights
    approaching?
  choices:
    A: Slow down and keep moving in your lane
    B: Keep driving in your lane at the same speed
    C: Pull to the curb and stop
    D: Stop exactly where you are in the middle of the road
  answer: C
  explanation: When you see an emergency vehicle with flashing lights, you must pull
    to the curb and stop to let it pass safely.
- id: 350
  category: sharing_the_road
  question: After an emergency vehicle passes you with its siren on, you must avoid
    driving closer than what distance behind it?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: After an emergency vehicle passes you with its siren on, you must avoid
    driving closer than 500 feet behind the emergency vehicle.
- id: 351
  category: safe_driving_rules
  question: What are the most common causes of crashes in work zones?
  choices:
    A: Tire blow-outs
    B: Hydroplaning because of water sprayed on the roadway
    C: Loss of steering control after driving over wet paint
    D: Carelessness and speeding
  answer: D
  explanation: Crashes in work zones are most commonly the result of carelessness
    and speeding.
- id: 352
  category: safe_driving_rules
  question: When driving through a work zone, what is a good safety practice regarding
    your following distance?
  choices:
    A: Drive close to the vehicle in front of you to keep traffic flowing freely
    B: Shorten your usual following distance by about half
    C: Turn on your cruise control
    D: Lengthen your usual following distance by double
  answer: D
  explanation: When driving through a work zone, it is a good safety practice to lengthen
    your usual following distance by double.
- id: 353
  category: safe_driving_rules
  question: Where should you position your vehicle to start a left turn on a two-lane,
    two-way street?
  choices:
    A: Close to the outside line
    B: Close to the center line
    C: In the center of the lane
    D: Anywhere in the lane
  answer: B
  explanation: On two-lane, two-way streets or highways, you should start left turns
    close to the center line.
- id: 354
  category: safe_driving_rules
  question: Under what condition may you pass another vehicle on the right on a two-lane
    road?
  choices:
    A: When driving on a single lane entrance ramp
    B: When the driver you are passing is travelling slower than the posted speed
      limit
    C: When the driver you are passing is making a left turn
    D: You may never pass on the right on a two-lane road
  answer: C
  explanation: On a two-lane road, you may pass another vehicle on the right when
    the driver you are passing is making a left turn.
- id: 355
  category: defensive_driving
  question: What is the most important thing to remember about speed management when
    approaching a curve?
  choices:
    A: Slow down before you enter the curve
    B: Accelerate gently before you enter the curve
    C: Drive at the posted speed limit throughout the curve
    D: Slow down only at the sharpest part of the curve
  answer: A
  explanation: The most important thing to remember about speed management and curves
    is to slow down before you enter the curve.
- id: 356
  category: sharing_the_road
  question: What must drivers do when entering a roundabout or traffic circle?
  choices:
    A: Stop completely before entering
    B: Yield to drivers in the roundabout or traffic circle
    C: Take the right of way if they arrive first
    D: Accelerate to merge quickly
  answer: B
  explanation: Drivers entering a roundabout or traffic circle must yield to drivers
    already in the roundabout or traffic circle.
- id: 357
  category: safe_driving_rules
  question: Who does the law give the right of way to at intersections?
  choices:
    A: Drivers turning left
    B: Drivers going straight
    C: Drivers turning right
    D: No one
  answer: D
  explanation: The law gives no one the right of way at intersections; it only states
    who must yield.
- id: 358
  category: safe_driving_rules
  question: When stopped at an intersection with a stop sign, where should you look
    before proceeding?
  choices:
    A: Look right first, then left, then right again
    B: Look left first, then right, then left again
    C: Check your rearview mirror only
    D: Look straight ahead and proceed
  answer: B
  explanation: At an intersection with a stop sign, you should stop and look left
    first, then right, then left again.
- id: 359
  category: safe_driving_rules
  question: How should you generally enter a highway from an entrance ramp?
  choices:
    A: Enter slowly to avoid other vehicles
    B: Stop first, then slowly enter traffic
    C: Accelerate to the speed of traffic
    D: Enter above the speed of traffic to get ahead
  answer: C
  explanation: When entering a highway from an entrance ramp, you should generally
    accelerate to the speed of traffic.
- id: 360
  category: safe_driving_rules
  question: What should you do if you want to get off a freeway but miss your exit?
  choices:
    A: Make a U-turn through the median
    B: Pull onto the shoulder and back your car to the exit
    C: Go to the next exit, and get off of the freeway there
    D: Stop and wait for a gap in traffic to reverse
  answer: C
  explanation: If you want to get off of a freeway, but you missed your exit, you
    should go to the next exit, and get off of the freeway there.
- id: 361
  category: safe_driving_rules
  question: At an intersection with no signs, signals, or police, what does the law
    state regarding yielding?
  choices:
    A: Drivers going straight must yield to drivers turning left
    B: Drivers turning left must yield to drivers going straight through the intersection
    C: Drivers on the right must yield to drivers on the left
    D: There are no laws stating who must yield
  answer: B
  explanation: When no signs, signals, or police tell you what to do at an intersection,
    the law states that drivers turning left must yield to drivers going straight
    through the intersection.
- id: 362
  category: driver_responsibility
  question: What causes the driver condition known as 'highway hypnosis'?
  choices:
    A: Frequent rest stops
    B: Too much sleep the night before a trip
    C: Short trips on expressways
    D: Staring at the roadway for long periods of time
  answer: D
  explanation: '''Highway hypnosis'' is a driver condition that can result from staring
    at the roadway for long periods of time.'
- id: 363
  category: defensive_driving
  question: Where is it best to keep a space cushion around your vehicle?
  choices:
    A: Only in back of your vehicle
    B: Only on the left and right side of your vehicle
    C: On all sides of the vehicle
    D: Only in front of the vehicle
  answer: C
  explanation: It is best to keep a space cushion on all sides of the vehicle.
- id: 364
  category: defensive_driving
  question: What is considered a safe following distance at highway speeds on a dry
    road?
  choices:
    A: 2 seconds of following distance from the car ahead of you
    B: 3 seconds of following distance from the car ahead of you
    C: 4 seconds of following distance from the car ahead of you
    D: 2 car lengths of following distance from the car ahead of you
  answer: C
  explanation: At highway speeds, on a dry road, a safe following distance is at least
    4 seconds of following distance from the car ahead of you.
- id: 365
  category: defensive_driving
  question: What is the best way to avoid the need to make emergency or 'panic' stops
    in traffic?
  choices:
    A: Honk your horn to make others aware of your presence
    B: Drive in the right lane only
    C: Drive slower than the flow of traffic
    D: Look ahead and maintain a safe following distance
  answer: D
  explanation: To avoid the need to make emergency stops while driving in traffic,
    you should look ahead and maintain a safe following distance.
- id: 366
  category: sharing_the_road
  question: If you are faced with an oncoming car to your left and a bicyclist to
    your right, what should you do?
  choices:
    A: Pull onto the shoulder
    B: Split the difference
    C: Let the car pass and then pass the bike
    D: Pass the bike quickly
  answer: C
  explanation: When faced with an oncoming car to the left and a bicyclist to the
    right, you should let the car pass and then pass the bike to ensure safety.
- id: 367
  category: defensive_driving
  question: What should you do if an oncoming driver is heading toward you in your
    lane?
  choices:
    A: Steer right, blow your horn, and accelerate
    B: Steer left, blow your horn, and brake
    C: Steer right, blow your horn, and brake
    D: Stay in the center of your lane, blow your horn, and brake
  answer: C
  explanation: If an oncoming driver is heading toward you in your lane, you should
    steer right, blow your horn, and brake to avoid a head-on collision.
- id: 368
  category: vehicle_information
  question: 'If the rear of your vehicle starts to skid to the left, you should:'
  choices:
    A: Steer left
    B: Hit your brakes
    C: Accelerate
    D: Steer right
  answer: A
  explanation: If the rear of your vehicle starts to skid left, you should steer left
    to regain control of the vehicle.
- id: 369
  category: safe_driving_rules
  question: During a rainstorm, when do roads become the most slippery?
  choices:
    A: When it has been raining for an hour or more
    B: The day after it rains
    C: For the first 10 to 15 minutes of a rain storm
    D: Right after the rain has stopped
  answer: C
  explanation: Roads become very slippery for the first 10 to 15 minutes of a rain
    storm because the water mixes with oil and dirt on the road surface.
- id: 370
  category: safe_driving_rules
  question: Which lights should you use when driving in fog?
  choices:
    A: Low beam headlights
    B: High beam headlights
    C: Parking lights
    D: Hazard flashers
  answer: A
  explanation: When driving in fog, you should use your low beam headlights to improve
    visibility without causing glare.
- id: 371
  category: penalties_and_points
  question: At what point threshold does PennDOT begin to take corrective action against
    a driver's record?
  choices:
    A: 3 or more points
    B: 6 or more points
    C: 9 or more points
    D: 12 or more points
  answer: B
  explanation: PennDOT begins to take corrective action when a driving record reaches
    six (6) or more points.
- id: 372
  category: penalties_and_points
  question: What happens the first time a driving record reaches six (6) or more points?
  choices:
    A: The driver's license is immediately suspended for 30 days
    B: The driver must attend a Departmental hearing
    C: The driver will receive a written notice to take a written special point examination
    D: The driver must pay a $500 fine
  answer: C
  explanation: When a driving record reaches six (6) or more points for the first
    time, the driver will receive a written notice to take a written special point
    examination.
- id: 373
  category: penalties_and_points
  question: If a driver under the age of 18 accumulates six or more points, how long
    will their driving privilege be suspended for the first occurrence?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: The driving privilege of a person under the age of 18 will be suspended
    if they accumulate six or more points. The first suspension will be for a period
    of 90 days.
- id: 374
  category: penalties_and_points
  question: How many points are removed from a driving record for every 12 consecutive
    months a person drives without a violation or suspension?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: All points
  answer: C
  explanation: Three (3) points are removed from a driving record for every 12 consecutive
    months in which a person is not under suspension or revocation and has not committed
    any violation.
- id: 375
  category: safe_driving_rules
  question: 'When you are in a line of traffic crossing a railroad track that has
    no signals or gates, you should:'
  choices:
    A: Assume you have the right of way and do not need to check for trains
    B: Pass slower drivers while crossing the track
    C: Make sure there is space to get all the way across the tracks without stopping
      before you start to cross
    D: Stop on the tracks to check for oncoming trains
  answer: C
  explanation: When crossing a railroad track with no signals or gates, you need to
    make sure there is space to get all the way across the tracks without stopping
    before you start to cross.
- id: 376
  category: penalties_and_points
  question: Which of the following violations will result in the suspension or revocation
    of your driving privilege?
  choices:
    A: Driving 5 mph over the speed limit
    B: Parking in a loading zone
    C: Failure to comply with a railroad crossing gate or barrier
    D: Driving with a broken taillight
  answer: C
  explanation: Your driving privilege will be suspended or revoked if you are convicted
    of failure to comply with a railroad crossing gate or barrier, which carries a
    30-day suspension.
- id: 377
  category: penalties_and_points
  question: Failure to comply with a railroad crossing gate or barrier will result
    in what penalty?
  choices:
    A: A 15-day suspension
    B: A 30-day suspension
    C: A 60-day suspension
    D: A 6-month suspension
  answer: B
  explanation: The manual states that failure to comply with a railroad crossing gate
    or barrier results in a 30-day suspension.
- id: 378
  category: safe_driving_rules
  question: What should you do immediately if you are stopped by a police officer
    at nighttime?
  choices:
    A: Step out of the vehicle to greet the officer
    B: Turn on your vehicle's interior light as soon as you stop
    C: Reach into your glove compartment for your registration
    D: Hand the officer your entire wallet
  answer: B
  explanation: If stopped by police at nighttime, you should turn on your vehicle's
    interior light as soon as you stop and before the officer approaches.
- id: 379
  category: driver_responsibility
  question: When stopped by a police officer, when should you retrieve your driver's
    license, registration, and insurance cards?
  choices:
    A: As soon as you see the police lights behind you
    B: While the officer is walking toward your vehicle
    C: Wait until the officer asks you to retrieve them
    D: Only after you have stepped out of the vehicle
  answer: C
  explanation: You should wait until the officer asks you to retrieve your driver's
    license, registration, and insurance cards, and limit your movements before then.
- id: 380
  category: penalties_and_points
  question: After your driving privilege is restored following a suspension, how many
    points will generally show on your driving record?
  choices:
    A: Zero points
    B: Three points
    C: Five points
    D: Six points
  answer: C
  explanation: After your driving privilege is restored, your driving record will
    show five (5) points, regardless of the number of points that appeared before
    the suspension (with a few exceptions).
- id: 381
  category: penalties_and_points
  question: What is the penalty if PennDOT finds your vehicle was not covered by insurance
    for a period of 31 days or longer?
  choices:
    A: Your registration will be suspended for three months
    B: Your vehicle will be impounded for 30 days
    C: You will receive a 60-day license suspension
    D: You will be required to retake your driving test
  answer: A
  explanation: If PennDOT finds your vehicle was not covered by insurance for 31 days
    or longer, your registration will be suspended for three (3) months.
- id: 382
  category: signs_and_signals
  question: If a vehicle behind you is flashing only blue lights, what does this indicate?
  choices:
    A: It is an unmarked police vehicle
    B: It is a state trooper
    C: It is not a police officer
    D: It is an emergency medical vehicle
  answer: C
  explanation: The manual states, 'If the vehicle is flashing only blue lights, then
    it is not a police officer.'
- id: 383
  category: defensive_driving
  question: What should you do if you are being pulled over by flashing red lights
    but are not certain the person is actually a police officer?
  choices:
    A: Speed up to get away from the vehicle
    B: Stop immediately and lock all your doors
    C: Drive to the nearest well-lit, populated area at a reduced speed with your
      flashers on
    D: Ignore the lights until you see a marked police car
  answer: C
  explanation: If you are not certain the person pulling you over is a police officer,
    you may drive to the nearest well-lit, populated area, turn on your flashers,
    and drive at a reduced speed to acknowledge the request to stop.
- id: 384
  category: driver_responsibility
  question: What must you do if you are involved in a crash with a parked vehicle
    and cannot find the owner?
  choices:
    A: Leave the scene and wait for the police to contact you
    B: Leave a note with your contact information and call the police
    C: Wait at the scene for up to one hour before leaving
    D: Report the crash to your insurance company within 30 days
  answer: B
  explanation: If the crash involves a parked vehicle and you cannot find the owner,
    leave a note in a place where it can be seen containing the date, time, your name,
    and phone number, and call the police.
- id: 385
  category: driver_responsibility
  question: If the police do not investigate a crash that resulted in an injury, death,
    or a towed vehicle, how many days do you have to send a Driver's Accident Report
    Form to PennDOT?
  choices:
    A: 3 days
    B: 5 days
    C: 10 days
    D: 15 days
  answer: B
  explanation: If the police do not investigate a crash and someone has died or been
    injured, or a vehicle must be towed, you must send a Driver's Accident Report
    Form (AA-600) within five (5) days.
- id: 386
  category: penalties_and_points
  question: What is the penalty for a driver convicted of fleeing or attempting to
    elude police?
  choices:
    A: A 6-month suspension and a $250 fine
    B: A 1-year suspension and a $500 fine
    C: A 3-month suspension and a $1,000 fine
    D: A 2-year suspension and a $5,000 fine
  answer: B
  explanation: If a driver is convicted of fleeing or attempting to elude police,
    the penalty is a one-year suspension of the driving privilege, a fine of $500,
    plus court costs and other fees.
- id: 387
  category: alcohol_drugs_health
  question: What does Pennsylvania's Implied Consent law mean for drivers?
  choices:
    A: You agree to allow police to search your vehicle at any time
    B: You agree to take a chemical test for alcohol or drugs just by being licensed
      to drive
    C: You agree to plead guilty to any traffic citations you receive
    D: You agree to carry liability insurance on your vehicle
  answer: B
  explanation: The Implied Consent law says you have agreed to take a chemical test
    of breath or blood just by being licensed to drive in Pennsylvania.
- id: 388
  category: penalties_and_points
  question: What happens if you are arrested for driving under the influence and refuse
    to take a chemical test of your breath or blood?
  choices:
    A: You will be given a warning and released
    B: Your driving privilege will be automatically suspended for one year
    C: You will be fined $500 but keep your license
    D: Your vehicle will be permanently confiscated
  answer: B
  explanation: If you refuse to take one or more chemical tests of breath or blood,
    your driving privilege will be automatically suspended for one (1) year, even
    if you are found not guilty of DUI.
- id: 389
  category: penalties_and_points
  question: If you are found not guilty of driving under the influence but refused
    to take a breath or blood test for the first time, what will happen to your driving
    privilege?
  choices:
    A: It will be suspended for 6 months.
    B: It will be suspended for 1 year.
    C: It will not be suspended.
    D: It will be suspended for 90 days.
  answer: B
  explanation: Even if you are found not guilty of driving while under the influence,
    your driving privilege will be suspended for one (1) year for a first-time refusal
    to take a breath or blood test.
- id: 390
  category: penalties_and_points
  question: What is the chemical test refusal restoration fee for a first offense?
  choices:
    A: $300
    B: $500
    C: $1,000
    D: $2,000
  answer: B
  explanation: Drivers who refuse to submit to a chemical test will be required to
    pay a chemical test refusal restoration fee. First offense is $500.
- id: 391
  category: alcohol_drugs_health
  question: Under Pennsylvania's Zero Tolerance law, what is the Blood Alcohol Content
    (BAC) limit for minors (under 21) charged with Driving Under the Influence?
  choices:
    A: '.00'
    B: '.02'
    C: '.04'
    D: '.08'
  answer: B
  explanation: The Zero Tolerance law reduced the Blood Alcohol Content (BAC) from
    .08 to .02 for minors (under 21) charged with Driving Under the Influence.
- id: 392
  category: penalties_and_points
  question: If you are involved in a crash resulting in bodily injury or property
    damage while driving with a BAC of .08 to .099, which penalties are you subject
    to?
  choices:
    A: General Impairment penalties
    B: High Rate penalties
    C: Highest Rate penalties
    D: No penalties if it is your first offense
  answer: B
  explanation: If you are involved in a crash resulting in bodily injury, death or
    property damage, you are subject to the penalties listed in Table 2, “High Rate,”
    even if your BAC is lower than the levels listed in Table 2.
- id: 393
  category: penalties_and_points
  question: Drivers who refuse a chemical test or drive under the influence of controlled
    substances are subject to which level of penalties?
  choices:
    A: General Impairment
    B: High Rate
    C: Highest Rate
    D: Zero Tolerance
  answer: C
  explanation: Anyone who drives under the influence of controlled substances and
    drivers who refuse a chemical test are subject to the penalties listed in Table
    3, “Highest Rate.”
- id: 394
  category: alcohol_drugs_health
  question: If you are accepted into the Accelerated Rehabilitative Disposition (ARD)
    program for a DUI, how many hours of Alcohol Highway Safety School must you participate
    in?
  choices:
    A: 10 hours
    B: 12 1/2 hours
    C: 15 hours
    D: 20 hours
  answer: B
  explanation: If you are accepted into the ARD program you will... Participate in
    12 1/2 hours of Alcohol Highway Safety School.
- id: 395
  category: penalties_and_points
  question: If your DUI crime is charged as an ungraded misdemeanor, what does this
    mean if you contest the case?
  choices:
    A: You are not entitled to a jury trial.
    B: You will automatically lose your license for 5 years.
    C: You must pay a mandatory $10,000 fine.
    D: You will be tried in federal court.
  answer: A
  explanation: The charge of ungraded misdemeanor means if you contest the case, you
    are not entitled to a jury trial.
- id: 396
  category: penalties_and_points
  question: What is the license penalty for a first offense of "General Impairment"
    (BAC .08 to .099) for a driver of legal drinking age?
  choices:
    A: 6-month suspension
    B: 12-month suspension
    C: 18-month suspension
    D: No action
  answer: D
  explanation: According to Table 1 - General Impairment, the license penalty for
    a first offense is "No action."
- id: 397
  category: alcohol_drugs_health
  question: If you are under age 21 and detained for blood, breath, or urine testing,
    what is the policy regarding parental consent?
  choices:
    A: Parental consent is required before any test can be administered.
    B: Parental consent is not required, but police will notify your parents.
    C: You must be allowed to call a parent before deciding to take the test.
    D: Parents must be present during the testing procedure.
  answer: B
  explanation: If you are underage and are arrested and detained for blood, breath
    and/or urine testing, parental consent to conduct these tests is not required,
    but the police will notify your parents of the arrest.
- id: 398
  category: penalties_and_points
  question: What is the minimum fine for an adult convicted of knowingly and intentionally
    supplying minors with alcohol for the first offense?
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: Adults, even parents, who are convicted of knowingly and intentionally
    supplying minors with alcohol are subject to a fine of at least $1,000 for the
    first offense.
- id: 399
  category: license_system
  question: What does the "one driver’s license" concept of the Driver’s License Compact
    (DLC) require?
  choices:
    A: Drivers must carry their license at all times.
    B: Drivers must surrender an out-of-state license when applying for a license
      in another state.
    C: Drivers can hold licenses from up to two member states.
    D: Drivers must renew their license every year.
  answer: B
  explanation: The "one driver’s license" concept requires the surrender of an out-of-state
    driver's license when application for a driver’s license in another state is made.
- id: 400
  category: penalties_and_points
  question: Which of the following drivers is required to have an Ignition Interlock
    system installed in their vehicle?
  choices:
    A: A driver with a first offense of General Impairment (BAC .08 to .099).
    B: A driver who receives an operating privilege suspension for a chemical test
      refusal.
    C: Any driver caught speeding more than 20 mph over the limit.
    D: A driver convicted of underage drinking without driving.
  answer: B
  explanation: First-time and repeat DUI offenders with high blood alcohol levels
    and individuals who receive an operating privilege suspension as a result of a
    chemical test refusal violation will be required to have an Ignition Interlock
    system installed.
- id: 401
  category: penalties_and_points
  question: If you are under 21 and convicted of DUI for the first time, what is the
    fine range you will have to pay?
  choices:
    A: $100 to $300
    B: $300 to $1,000
    C: $500 to $5,000
    D: $1,000 to $10,000
  answer: C
  explanation: If you are under 21 and are convicted of DUI for the first time, you
    will go to jail... your license will be suspended for a full year, and you will
    pay a fine of $500 to $5,000.
- id: 402
  category: penalties_and_points
  question: How must a chemical test refusal restoration fee be paid?
  choices:
    A: By cash or personal check
    B: By credit card only
    C: By certified check or money order
    D: Through an online payment portal
  answer: C
  explanation: A chemical test refusal restoration fee must be paid by certified check
    or money order.
- id: 403
  category: alcohol_drugs_health
  question: 'The "High Rate" penalties (Table 2) apply to commercial vehicle drivers
    with a BAC of at least:'
  choices:
    A: '.02'
    B: '.04'
    C: '.08'
    D: '.10'
  answer: B
  explanation: Table 2 - High Rate notes that this table also applies to commercial
    vehicle drivers with a BAC of .04 or more.
- id: 404
  category: penalties_and_points
  question: What will happen if you do not respond to an out-of-state traffic citation?
  choices:
    A: You will be fined $500.
    B: Your Pennsylvania driving privilege will be indefinitely suspended.
    C: You will receive points on your driving record.
    D: Your vehicle will be impounded.
  answer: B
  explanation: According to the manual, not responding to an out-of-state citation
    will result in the indefinite suspension of your Pennsylvania driving privilege
    until a response is made.
- id: 405
  category: license_system
  question: How many days do you have to notify PennDOT if you change your name or
    address?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: In accordance with Section 1515 of the Pennsylvania Vehicle Code, if
    your name or address is changed, you must notify PennDOT within 15 days of that
    change even if moving out of state.
- id: 406
  category: safe_driving_rules
  question: According to Pennsylvania law, who is required to wear a seat belt in
    the front seat of a vehicle, light truck, or motor home?
  choices:
    A: Only the driver
    B: Only passengers under 18
    C: All drivers and front seat passengers
    D: Only passengers without airbags
  answer: C
  explanation: The manual states that all drivers and front seat passengers in vehicles,
    light trucks, and motor homes must wear seat belts.
- id: 407
  category: safe_driving_rules
  question: Where must passengers who are age 8 or older, but less than age 18, wear
    a seat belt?
  choices:
    A: Only in the front seat
    B: Only in the back seat
    C: No matter where they are riding in the vehicle
    D: Only if the vehicle lacks airbags
  answer: C
  explanation: If you are transporting passengers age eight (8) or older but less
    than age 18, they must wear seat belts, no matter where they are riding in the
    vehicle.
- id: 408
  category: safe_driving_rules
  question: If you are a driver under the age of 18, what is the maximum number of
    passengers you may transport?
  choices:
    A: One passenger per vehicle
    B: Up to three passengers
    C: The number of passengers may not exceed the number of seat belts in the vehicle
    D: As many passengers as can fit safely in the back seat
  answer: C
  explanation: If you are a driver under the age of 18, the number of passengers may
    not exceed the number of seat belts in the vehicle.
- id: 409
  category: defensive_driving
  question: Hitting the instrument panel or windshield in a crash at 30 mph is comparable
    to what?
  choices:
    A: Hitting the ground from the top of a three-story building
    B: Falling off a bicycle at 15 mph
    C: Hitting the ground from a one-story building
    D: Being tackled by a professional football player
  answer: A
  explanation: The manual explains that hitting the vehicle's interior surfaces at
    30 mph is like hitting the ground from the top of a three-story building.
- id: 410
  category: defensive_driving
  question: How much greater are your chances of being killed if you are thrown from
    your vehicle during a crash?
  choices:
    A: 5 times greater
    B: 10 times greater
    C: 25 times greater
    D: 50 times greater
  answer: C
  explanation: Your chances of being killed are almost 25 times greater if you are
    thrown from your vehicle.
- id: 411
  category: penalties_and_points
  question: What is the penalty for a person under 16 years of age who uses a false
    identification card to buy alcohol?
  choices:
    A: A $500 fine and immediate impoundment of their vehicle
    B: A driving suspension that starts on their 16th birthday
    C: They will not be able to take the driver's exam until their 21st birthday
    D: Mandatory attendance at an alcohol safety education class
  answer: B
  explanation: People under 16 years of age who use a false identification card to
    buy alcohol will receive a driving suspension that starts on their 16th birthday.
- id: 412
  category: alcohol_drugs_health
  question: What is the penalty for a first offense if a person under 21 years old
    consumes alcohol, but is not driving a motor vehicle?
  choices:
    A: A 90-day driver license suspension and up to a $500 fine
    B: A 6-month probation
    C: Sentence to a corrections institution
    D: Points on the driving record
  answer: A
  explanation: If a person under 21 years old consumes alcohol, but is not driving
    a motor vehicle, the penalty for a first offense is a 90-day driver license suspension
    and up to a $500 fine.
- id: 413
  category: alcohol_drugs_health
  question: Is parental consent required for police to conduct breath, blood, and
    urine tests on a minor?
  choices:
    A: Yes, from both parents
    B: Yes, from at least one parent
    C: Yes, for people under 16 years old
    D: No, it is not required
  answer: D
  explanation: Parental consent to conduct breath, blood, and urine tests is not required.
- id: 414
  category: penalties_and_points
  question: If you are under age 21 and are convicted of driving under the influence
    of alcohol for the first time, how long will your license be suspended?
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: If you are under age 21 and are convicted of driving under the influence
    of alcohol, you will receive a 1-year license suspension for a first offense.
- id: 415
  category: penalties_and_points
  question: Which of the following out-of-state offenses will be treated as though
    it occurred in Pennsylvania and result in appropriate sanctions?
  choices:
    A: A minor parking violation
    B: Driving 5 mph over the speed limit
    C: Failure to stop and render aid in an accident resulting in death or injury
    D: Driving with an expired inspection sticker
  answer: C
  explanation: Failure to stop and render aid in the event of a vehicle accident resulting
    in the death or personal injury of another is an offense that, if committed in
    a member state, is treated as though it occurred in Pennsylvania.
- id: 416
  category: safe_driving_rules
  question: Under Pennsylvania law, how must children younger than age 2 be secured
    in a vehicle?
  choices:
    A: In a forward-facing car seat in the front seat
    B: In a rear-facing car seat until they outgrow the manufacturer's limits
    C: In a booster seat with a lap and shoulder belt
    D: With a standard seat belt in the back seat
  answer: B
  explanation: Children younger than age 2 must be secured in a rear-facing car seat
    until the child outgrows the maximum weight and height limits of the car seat
    as designated by the manufacturer.
- id: 417
  category: vehicle_information
  question: Why should you never install a rear-facing child safety seat in the front
    seat if an air bag is present?
  choices:
    A: The air bag will hit the back of the child seat with tremendous force, causing
      severe injury or death.
    B: It blocks the driver's view of the right side mirror.
    C: The child will be distracted by the dashboard lights.
    D: The seat belt in the front seat is not long enough to secure the child seat.
  answer: A
  explanation: In a crash, the air bag will hit the back of the child seat with tremendous
    force, which will be transmitted to the infant's head causing severe injury or
    death.
- id: 418
  category: safe_driving_rules
  question: If the outside temperature is in the low 80s Fahrenheit, how quickly can
    the temperature inside a vehicle reach deadly levels?
  choices:
    A: 10 minutes
    B: 30 minutes
    C: 45 minutes
    D: 1 hour
  answer: A
  explanation: Even with a window rolled down two inches, if the outside temperature
    is in the low 80s Fahrenheit, the temperature inside a vehicle can reach deadly
    levels in only 10 minutes.
- id: 419
  category: defensive_driving
  question: Which of the following is a recommended tip to avoid tragically leaving
    a child in a hot vehicle?
  choices:
    A: Roll the windows down at least two inches before leaving the vehicle.
    B: Place your purse, briefcase, or cell phone in the back seat.
    C: Leave the air conditioning running while you run errands.
    D: Keep a stuffed animal in the front seat at all times.
  answer: B
  explanation: The manual recommends placing your purse, briefcase, cell phone, or
    something you will need in the back seat so you will be sure to see a child left
    in the vehicle.
- id: 420
  category: safe_driving_rules
  question: How can thick winter coats affect the safety of a child's car seat?
  choices:
    A: They make the child too warm, causing drowsiness.
    B: They prevent the seat belt from locking during a sudden stop.
    C: They can compress in a crash, creating significant slack in the harness.
    D: They interfere with the vehicle's LATCH system.
  answer: C
  explanation: Thicker winter coats can compress enough in a crash to create significant
    slack in the harness, which must be snug on the child's body to provide the best
    protection.
- id: 421
  category: safe_driving_rules
  question: 'According to the Child Passenger Protection Act 229, children under the
    age of four must be:'
  choices:
    A: Buckled into a federally-approved child passenger restraint system.
    B: Secured in a booster seat with lap and shoulder belts.
    C: Placed in the front seat with the air bag disabled.
    D: Secured using only the vehicle's standard lap belt.
  answer: A
  explanation: Children under the age of four (4) must be buckled into a federally-approved
    child passenger restraint system (child safety seat), no matter where they ride
    in the vehicle.
- id: 422
  category: safe_driving_rules
  question: What type of restraint is required for children ages four and older, but
    under the age of eight?
  choices:
    A: A rear-facing infant seat.
    B: A federally-approved child booster seat used with lap and shoulder belts.
    C: A standard lap belt without a shoulder strap.
    D: No special restraint is required if they sit in the back seat.
  answer: B
  explanation: Children ages four (4) and older, but under the age of eight (8) must
    be buckled into a federally-approved child booster seat, which must be used in
    conjunction with lap and shoulder belts.
- id: 423
  category: driver_responsibility
  question: Who is responsible for ensuring that children under age 18 are properly
    buckled up in a vehicle?
  choices:
    A: The children themselves
    B: The vehicle owner
    C: The driver
    D: The parents of the children, regardless of who is driving
  answer: C
  explanation: Drivers are responsible for securing children into an approved child
    passenger restraint system and ensuring children under age 18 are buckled up.
- id: 424
  category: vehicle_information
  question: To be safe in case the air bag deploys, how far away from the steering
    wheel should the driver sit?
  choices:
    A: At least 5 inches
    B: At least 10 inches
    C: At least 15 inches
    D: At least 20 inches
  answer: B
  explanation: To be safe, in case the air bag deploys, you should be at least 10
    inches away from the steering wheel.
- id: 425
  category: safe_driving_rules
  question: What is the recommended position for holding the steering wheel to prevent
    injury if the air bag deploys?
  choices:
    A: 10 and 2 o'clock
    B: 9 and 3 o'clock or 8 and 4 o'clock
    C: 12 and 6 o'clock
    D: One hand at 12 o'clock
  answer: B
  explanation: Hold the steering wheel at the 9 and 3 o'clock or 8 and 4 o'clock positions.
    This will keep your wrists and arms from being injured or broken or forcibly hitting
    you in the face, if the air bag deploys.
- id: 426
  category: safe_driving_rules
  question: It is recommended that all children of what age ride in the rear seat
    of a vehicle?
  choices:
    A: Ages 8 and under
    B: Ages 10 and under
    C: Ages 12 and under
    D: Ages 15 and under
  answer: C
  explanation: It is recommended that all children ages 12 and under ride in the rear
    seat because most collisions are frontal collisions, and children tend to fidget
    and may get too close to the air bag compartment.
- id: 427
  category: driver_testing
  question: If you need a sign language interpreter for the Knowledge or Road Test,
    how far in advance should you contact PennDOT?
  choices:
    A: At least 24 hours prior
    B: At least 3 days prior
    C: At least 1 week prior
    D: At least 2 weeks prior
  answer: D
  explanation: Make your initial contact with PennDOT at least two (2) weeks prior
    to the time you want to take the test, and PennDOT will do its best to secure
    a person who signs in your preference.
- id: 428
  category: driver_testing
  question: What alternative testing method is offered at all Driver License Centers
    for people who have trouble reading the Knowledge Test?
  choices:
    A: Take-home tests
    B: Open-book tests
    C: Voice tests
    D: Group testing
  answer: C
  explanation: Upon request, voice tests are offered at all Driver License Centers
    across the commonwealth for people who may have trouble reading.
- id: 429
  category: penalties_and_points
  question: What is the penalty for unlawfully parking in a designated parking area
    for persons with disabilities?
  choices:
    A: A warning for the first offense.
    B: A fine between $50 and $200 and the vehicle may be towed.
    C: A fine of $300 and a 30-day license suspension.
    D: 3 points added to your driving record.
  answer: B
  explanation: Any vehicle unlawfully parked in a parking area for disabled persons
    may be removed from that area by towing... Individuals convicted of this offense
    will be fined between $50 and $200.
- id: 430
  category: penalties_and_points
  question: Under Pennsylvania's anti-littering law, what is the maximum fine upon
    conviction for dropping waste from a vehicle?
  choices:
    A: $50
    B: $100
    C: $200
    D: $300
  answer: D
  explanation: A violation of this law, including any violation resulting from the
    conduct of any other persons present within any vehicle of which you are the driver,
    may result in a fine of up to $300 upon conviction.
- id: 431
  category: penalties_and_points
  question: What is the maximum fine for a littering conviction, including violations
    resulting from the conduct of passengers in your vehicle?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: A violation of the littering law, including conduct of any other persons
    present within the vehicle, may result in a fine of up to $300 upon conviction.
- id: 432
  category: vehicle_information
  question: How often must your vehicle undergo a safety inspection at an authorized
    inspection station?
  choices:
    A: Every 6 months
    B: Every 12 months
    C: Every 2 years
    D: Every 3 years
  answer: B
  explanation: Your vehicle must have a safety inspection at an authorized inspection
    station every 12 months.
- id: 433
  category: vehicle_information
  question: If a police officer notices faulty equipment on your vehicle, how many
    days do you have to fix it to avoid a citation?
  choices:
    A: 3 days
    B: 5 days
    C: 10 days
    D: 15 days
  answer: B
  explanation: If a police officer notices faulty equipment on your vehicle, you may
    be required to fix it within five (5) days to avoid a citation.
- id: 434
  category: sharing_the_road
  question: When passing a bicyclist, what is the minimum distance you must allow
    between your vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: When passing, you must allow at least four (4) feet between your vehicle
    and a bicycle in order to pass safely.
- id: 435
  category: sharing_the_road
  question: Are you permitted to cross a center double yellow line to pass a bicyclist?
  choices:
    A: No, it is always illegal to cross a double yellow line.
    B: Yes, but only if the bicyclist signals you to pass.
    C: Yes, if necessary and you can do it safely to maintain four feet of clearance.
    D: No, unless you are driving an emergency vehicle.
  answer: C
  explanation: If necessary and if you can do it safely, you are permitted to cross
    the center double yellow line so you can maintain the four (4) feet of clearance
    between your vehicle and the bicycle.
- id: 436
  category: sharing_the_road
  question: Can a bicyclist be cited for traveling at less than the posted minimum
    speed limit?
  choices:
    A: Yes, they must maintain the minimum speed limit.
    B: Yes, if they are impeding traffic.
    C: No, they may travel at less than the posted minimum speed and may not be cited
      for impeding traffic.
    D: No, but they must ride on the shoulder if they are traveling below the speed
      limit.
  answer: C
  explanation: Bicyclists are considered to be vehicle operators and are expected
    to obey all traffic laws; however, they may travel at less than the posted minimum
    speed and may not be cited for impeding traffic.
- id: 437
  category: penalties_and_points
  question: What is the fine for a conviction under Pennsylvania's Anti-Texting Law?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: A
  explanation: Violating the Anti-Texting law is a primary, summary offense with convictions
    carrying a $50 fine.
- id: 438
  category: safe_driving_rules
  question: Under the Anti-Texting Law, which of the following actions is a police
    officer authorized to take?
  choices:
    A: Seize the driver's mobile device as evidence.
    B: Issue a citation for using a physically integrated GPS device.
    C: Issue a citation for texting, but they cannot seize the interactive wireless
      device.
    D: Enforce local ordinances that restrict device use more strictly than state
      law.
  answer: C
  explanation: The law does not authorize the seizure of an Interactive Wireless Communication
    Device (IWCD). It also exempts GPS devices and preempts local ordinances.
- id: 439
  category: penalties_and_points
  question: What is the penalty for driving around signs closing a road due to hazardous
    conditions if emergency responders are called out because of your actions?
  choices:
    A: A $250 fine and 2 points on your record.
    B: A fine up to $500 and liability for emergency response costs.
    C: A $50 fine and a 30-day license suspension.
    D: A $300 fine and 4 points on your record.
  answer: B
  explanation: If emergency responders are called out because of your actions, the
    fine is increased to up to $500 and you will be held liable for repaying the emergency
    response costs.
- id: 440
  category: sharing_the_road
  question: What is the "Dutch Reach" method designed to prevent?
  choices:
    A: Carbon monoxide poisoning in enclosed garages.
    B: Hitting an approaching bicyclist with an opening vehicle door.
    C: Skidding on flooded roadways.
    D: Texting while driving.
  answer: B
  explanation: The "Dutch Reach" method involves opening the door with your far hand.
    It forces your body to turn, which will better allow you to see approaching bicyclists
    and prevents the door from opening too fast.
- id: 441
  category: sharing_the_road
  question: How far should bicyclists ride from parked cars to avoid getting hit by
    opening vehicle doors?
  choices:
    A: At least one foot
    B: At least two feet
    C: At least three feet
    D: At least four feet
  answer: C
  explanation: Bicyclists should ride at least three feet from parked cars to avoid
    doors, both on streets with and without bike lanes.
- id: 442
  category: driver_testing
  question: If you are under 18 years of age, how long must you wait after receiving
    your learner's permit before you can take your Road Test?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: If you are under 18 years of age, you may not take your Road Test for
    six (6) months after you have received your learner’s permit.
- id: 443
  category: safe_driving_rules
  question: What is the recommended way to use the 511PA information service while
    traveling?
  choices:
    A: Call 511 while driving on the interstate.
