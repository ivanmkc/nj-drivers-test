questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar un permiso de aprendizaje
    en Pensilvania?
  choices:
    A: 15 años
    B: 15 años y 6 meses
    C: 16 años
    D: 17 años
  answer: C
  explanation: Según el Manual del Conductor de Pensilvania, una persona debe tener
    al menos 16 años de edad para solicitar un permiso de aprendizaje.
- id: 2
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de aprendizaje de Pensilvania
    a partir de la fecha de emisión?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 4 años
  answer: B
  explanation: Un permiso de aprendizaje de Pensilvania es válido por un año. Si vence
    antes de aprobar el examen de conducir, el solicitante debe pedir una extensión.
- id: 3
  category: license_system
  question: Bajo las leyes del sistema de licencia graduada (GDL) de Pensilvania,
    ¿cuántas horas de práctica de habilidades al volante debe completar el titular
    de un permiso menor de 18 años antes de realizar el examen de conducir?
  choices:
    A: 40 horas
    B: 50 horas
    C: 65 horas
    D: 75 horas
  answer: C
  explanation: Pensilvania requiere 65 horas de experiencia supervisada al volante,
    las cuales deben incluir 10 horas de conducción nocturna y 5 horas de conducción
    en condiciones climáticas adversas.
- id: 4
  category: license_system
  question: Por lo general, ¿a un titular de una Licencia Junior de Pensilvania no
    se le permite conducir entre qué horas?
  choices:
    A: 9:00 PM a 5:00 AM
    B: 10:00 PM a 6:00 AM
    C: 11:00 PM a 5:00 AM
    D: Medianoche a 6:00 AM
  answer: C
  explanation: Los titulares de una Licencia Junior no pueden conducir entre las 11:00
    PM y las 5:00 AM, a menos que participen en un servicio público o caritativo,
    o viajen por motivos de empleo o deberes de una compañía de bomberos voluntarios.
- id: 5
  category: license_system
  question: Si se muda a una nueva dirección dentro de Pensilvania, ¿dentro de cuántos
    días debe notificar a PennDOT sobre su cambio de domicilio?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: B
  explanation: La ley de Pensilvania exige que los conductores notifiquen a PennDOT
    sobre un cambio de nombre o dirección dentro de un plazo de 15 días.
- id: 6
  category: license_system
  question: Durante los primeros seis meses de tener una Licencia Junior, ¿cuántos
    pasajeros menores de 18 años (que no sean familiares directos) se permiten en
    el vehículo?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Durante los primeros seis meses de tener una Licencia Junior, un conductor
    no puede llevar a más de un pasajero menor de 18 años que no sea un familiar directo,
    a menos que esté acompañado por un padre o tutor.
- id: 7
  category: license_system
  question: En Pensilvania, una Licencia Junior será suspendida por 90 días si el
    conductor acumula ¿cuántos puntos?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: PennDOT suspenderá una Licencia Junior por 90 días si el conductor
    acumula seis o más puntos o es condenado por conducir a 26 mph o más por encima
    del límite de velocidad establecido.
- id: 8
  category: license_system
  question: Si el titular de un permiso menor de 18 años reprueba el examen de conducir,
    ¿cuánto tiempo debe esperar antes de poder realizar el examen nuevamente?
  choices:
    A: 2 días
    B: 7 días
    C: 14 días
    D: 30 días
  answer: B
  explanation: Los conductores menores de 18 años que reprueban el examen de conducir
    deben esperar siete días antes de poder volver a realizarlo. Esto permite tiempo
    para práctica adicional.
- id: 9
  category: license_system
  question: Al conducir con un permiso de aprendizaje, ¿qué edad mínima debe tener
    el supervisor en el asiento delantero (si no es el cónyuge o tutor)?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: 30 años
  answer: B
  explanation: La persona que acompaña al titular de un permiso debe tener al menos
    21 años de edad, o al menos 18 años de edad si es el cónyuge, tutor o padre del
    titular del permiso.
- id: 10
  category: license_system
  question: 'Un titular de una Licencia Junior de Pensilvania puede solicitar una
    Licencia Senior regular antes de los 18 años si ha tenido la Licencia Junior por
    un año, no tiene accidentes ni condenas, y:'
  choices:
    A: Tiene al menos 16 años y medio
    B: Tiene al menos 17 años
    C: Ha completado un curso de educación vial aprobado por el estado
    D: Ha completado 100 horas de conducción
  answer: C
  explanation: Un titular de una Licencia Junior puede solicitar una Licencia Senior
    a los 17 años y medio si ha aprobado un curso de capacitación para conductores
    aprobado y no ha estado involucrado en un choque reportable ni ha sido condenado
    por una infracción durante un año.
- id: 11
  category: license_system
  question: De las 65 horas de práctica requeridas para un permiso de aprendizaje
    de Pensilvania, ¿cuántas deben dedicarse específicamente a conducir en condiciones
    climáticas adversas?
  choices:
    A: 2 horas
    B: 5 horas
    C: 10 horas
    D: 15 horas
  answer: B
  explanation: La ley de Pensilvania exige que al menos 5 de las 65 horas de práctica
    supervisada se realicen en condiciones climáticas adversas.
- id: 12
  category: license_system
  question: 'Después de tener una Licencia Junior durante seis meses, el límite de
    pasajeros menores de 18 años que no sean familiares aumenta a:'
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Ilimitado
  answer: B
  explanation: Después de los primeros seis meses de tener una Licencia Junior, el
    límite aumenta a tres pasajeros menores de 18 años que no sean familiares directos,
    siempre que el conductor no haya estado involucrado en un accidente ni haya sido
    condenado por una infracción.
- id: 13
  category: license_system
  question: ¿Qué formulario debe completar un profesional médico antes de que se pueda
    emitir un permiso de aprendizaje de Pensilvania?
  choices:
    A: DL-180
    B: DL-80
    C: MV-1
    D: DL-102
  answer: A
  explanation: El formulario DL-180 (Solicitud de Permiso de Aprendizaje No Comercial)
    incluye una sección de calificación médica que debe ser completada por un médico,
    un asistente médico o un enfermero practicante certificado.
- id: 14
  category: license_system
  question: En Pensilvania, ¿cuál es la agudeza visual requerida (con o sin lentes
    correctivos) para obtener una licencia de conducir sin restricciones?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Pensilvania requiere una agudeza visual de al menos 20/40 en el mejor
    ojo para una licencia sin restricciones.
- id: 15
  category: license_system
  question: Los nuevos residentes que se mudan a Pensilvania y poseen una licencia
    de conducir válida de otro estado deben solicitar una licencia de PA dentro de
    ¿cuántos días después de establecer su residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Según el Manual del Conductor de Pensilvania, los nuevos residentes
    deben solicitar una licencia de conducir de Pensilvania dentro de los 60 días
    posteriores a establecer su residencia en el estado.
- id: 16
  category: license_system
  question: 'En Pensilvania, los conductores de 65 años o más tienen la opción de
    renovar su licencia de conducir cada:'
  choices:
    A: Año
    B: Dos años
    C: Cinco años
    D: Seis años
  answer: B
  explanation: Si bien el período de renovación estándar es de cuatro años, la ley
    de Pensilvania permite que los conductores de 65 años o más elijan un ciclo de
    renovación de licencia de dos años.
- id: 17
  category: license_system
  question: Bajo el sistema de puntos de Pensilvania, ¿cuántos puntos se eliminan
    de un historial de conducción por cada 12 meses consecutivos que una persona conduce
    sin una infracción?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: PennDOT elimina tres puntos del historial de un conductor por cada
    12 meses consecutivos en los que el conductor no esté bajo suspensión o revocación
    y no haya cometido ninguna infracción.
- id: 18
  category: license_system
  question: Un conductor de Pensilvania cuya licencia esté suspendida puede ser elegible
    para una Licencia Ocupacional Limitada (OLL). ¿Para cuál de las siguientes actividades
    NO es válida una OLL?
  choices:
    A: Conducir hacia y desde el trabajo
    B: Conducir a una cita médica
    C: Conducir a una tienda de comestibles o evento social
    D: Conducir a un programa acreditado de educación superior
  answer: C
  explanation: Una OLL está restringida a la conducción para el trabajo, la escuela
    o el tratamiento médico. No se puede utilizar para actividades recreativas o recados
    personales generales.
- id: 19
  category: license_system
  question: ¿Cuál de las siguientes actividades tiene prohibida el titular de un permiso
    de aprendizaje de motocicleta en Pensilvania?
  choices:
    A: Conducir entre la puesta del sol y el amanecer
    B: Conducir en una autopista
    C: Conducir una motocicleta de más de 500cc
    D: Conducir sin casco
  answer: A
  explanation: Los titulares de permisos de motocicleta de Pensilvania tienen restringido
    operar una motocicleta entre la puesta del sol y el amanecer y no se les permite
    llevar pasajeros, excepto un instructor con licencia.
- id: 20
  category: license_system
  question: Si un conductor de Pensilvania es condenado por no detenerse ante un autobús
    escolar con sus luces rojas intermitentes encendidas y el brazo de parada extendido,
    ¿cuántos puntos se agregan a su historial de conducción?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: C
  explanation: No detenerse ante un autobús escolar con sus luces rojas intermitentes
    encendidas y el brazo de parada extendido resulta en una suspensión de 60 días
    y 5 puntos en el historial de conducción.
- id: 21
  category: license_system
  question: 'Cuando un conductor de Pensilvania alcanza 6 o más puntos por primera
    vez, recibirá un aviso para:'
  choices:
    A: Entregar su licencia inmediatamente
    B: Tomar un examen escrito especial sobre puntos
    C: Asistir a una audiencia judicial obligatoria
    D: Pagar un recargo de $500
  answer: B
  explanation: Cuando un historial de conducción alcanza 6 o más puntos por primera
    vez, el conductor debe tomar un examen escrito especial sobre prácticas de conducción
    segura y el sistema de puntos.
- id: 22
  category: license_system
  question: Si cambia su nombre debido a un matrimonio o una orden judicial, ¿dentro
    de cuántos días debe notificar a PennDOT y solicitar una licencia corregida?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: B
  explanation: La ley de Pensilvania exige que los conductores informen un cambio
    de nombre a PennDOT dentro de los 15 días posteriores al cambio.
- id: 23
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que un residente de Pensilvania
    solicite una Licencia de Conducir Comercial (CDL) para operar un vehículo en el
    comercio 'interestatal'?
  choices:
    A: Debe tener al menos 16 años
    B: Debe tener al menos 18 años
    C: Debe tener al menos 21 años
    D: Debe haber tenido una licencia Clase C durante 5 años
  answer: C
  explanation: Las regulaciones federales y de Pensilvania requieren que un conductor
    tenga al menos 21 años para operar un vehículo comercial a través de las fronteras
    estatales (comercio interestatal).
- id: 24
  category: license_system
  question: 'En Pensilvania, el padre, tutor o cónyuge (de 18 años o más) que firmó
    el formulario de consentimiento para el permiso de aprendizaje de un menor tiene
    derecho a:'
  choices:
    A: Retirar el consentimiento en cualquier momento hasta que el menor cumpla 18
      años
    B: Retirar el consentimiento solo si el menor recibe una multa
    C: Solo retirar el consentimiento dentro de los primeros 30 días
    D: No puede retirar el consentimiento una vez que se emite el permiso
  answer: A
  explanation: La persona que firmó el formulario de consentimiento para un menor
    (menor de 18 años) puede retirar ese consentimiento presentando el formulario
    DL-180C, lo que resultará en la suspensión del privilegio de conducir del menor
    hasta que cumpla 18 años.
- id: 25
  category: license_system
  question: ¿Para qué grupo de personas está diseñada específicamente la 'Licencia
    de Prueba' (PL) de Pensilvania?
  choices:
    A: Conductores menores de 18 años
    B: Conductores con antecedentes de DUI únicamente
    C: Conductores con suspensiones de licencia a largo plazo que han cumplido una
      parte de su suspensión
    D: Nuevos residentes con licencias de fuera del país
  answer: C
  explanation: Una Licencia de Prueba (PL) es una licencia de clase C emitida a personas
    cuyo privilegio de conducir ha sido suspendido o revocado por 5 años o más, siempre
    que cumplan con requisitos de elegibilidad específicos.
- id: 26
  category: license_system
  question: Para ser elegible para una Licencia de Adulto (Clase C) de Pensilvania
    antes de los 18 años, ¿durante cuánto tiempo debe un conductor haber tenido una
    Licencia Junior por un año y no haber estado involucrado en un accidente en el
    que fuera parcial o totalmente culpable?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Todo el tiempo que tuvo la Licencia Junior
  answer: B
  explanation: Para graduarse a una Licencia de Adulto antes de los 18 años, el conductor
    no debe tener accidentes (donde haya sido parcial o totalmente culpable) ni condenas
    por ninguna infracción del Código de Vehículos durante un año.
- id: 27
  category: license_system
  question: 'En Pensilvania, si un conductor es condenado por conducir a 31 mph o
    más sobre el límite de velocidad indicado, debe asistir a una audiencia departamental.
    No asistir a esta audiencia resulta en:'
  choices:
    A: Una multa de $1,000
    B: Una suspensión inmediata de la licencia por 60 días
    C: Una marca permanente en el historial de conducción
    D: El embargo del vehículo
  answer: B
  explanation: En caso de exceso de velocidad extremo (31+ mph por encima del límite),
    no asistir a la audiencia departamental obligatoria resulta en una suspensión
    inmediata de la licencia por 60 días.
- id: 28
  category: license_system
  question: 'Al solicitar un permiso de aprendizaje en Pensilvania, los solicitantes
    masculinos de entre 18 y 25 años:'
  choices:
    A: Están obligados a presentar un comprobante de empleo
    B: Son registrados automáticamente en el Servicio Selectivo si dan su consentimiento
    C: Están obligados a pagar una tarifa de solicitud más alta
    D: Están exentos del examen de la vista
  answer: B
  explanation: En cumplimiento con la ley estatal, PennDOT prevé el registro automático
    de los solicitantes masculinos de 18 a 25 años en el Sistema del Servicio Selectivo
    cuando solicitan una licencia o permiso.
- id: 29
  category: license_system
  question: Si una licencia de conducir de Pensilvania se pierde o es robada, el conductor
    debe solicitar un duplicado. ¿Cuál de las siguientes afirmaciones es verdadera
    con respecto a conducir mientras se espera el duplicado?
  choices:
    A: Pueden conducir siempre que tengan el recibo del duplicado
    B: Pueden conducir durante 48 horas sin licencia
    C: No se les permite conducir hasta que tengan la licencia duplicada en su poder
    D: Solo pueden conducir durante las horas del día
  answer: C
  explanation: La ley de Pensilvania exige que los conductores tengan su licencia
    válida en su poder mientras operan un vehículo motorizado. Conducir sin la licencia
    física, incluso si se ha solicitado una, es una infracción.
- id: 30
  category: driver_testing
  question: En Pensilvania, ¿cuál es el campo de visión horizontal combinado mínimo
    requerido para aprobar el examen de la vista para una licencia sin restricciones?
  choices:
    A: 90 grados
    B: 100 grados
    C: 120 grados
    D: 140 grados
  answer: C
  explanation: Según el Manual del Conductor de Pensilvania, un solicitante debe tener
    un campo de visión combinado de al menos 120 grados para aprobar el examen de
    la vista.
- id: 31
  category: driver_testing
  question: Al presentarse para el examen de conducción de Pennsylvania, ¿cuál de
    los siguientes documentos debe presentarse para el vehículo que se utilizará?
  choices:
    A: El título del vehículo
    B: Una tarjeta de registro válida y un comprobante de seguro
    C: El registro de mantenimiento del vehículo
    D: Una factura de venta
  answer: B
  explanation: Para realizar el examen de conducción, debe proporcionar la tarjeta
    de registro válida y el comprobante de seguro del vehículo que conducirá.
- id: 32
  category: driver_testing
  question: ¿Cuántos intentos se le permiten para estacionar el vehículo en paralelo
    con éxito durante el examen de conducción de Pennsylvania?
  choices:
    A: Un intento
    B: Dos intentos
    C: Tres intentos
    D: Cuatro intentos
  answer: C
  explanation: El Manual del Conductor de Pennsylvania establece que los solicitantes
    tienen tres intentos para estacionar el vehículo con éxito durante la parte de
    estacionamiento en paralelo del examen de conducción.
- id: 33
  category: driver_testing
  question: Según la ley de Pennsylvania, ¿qué sucede la primera vez que un conductor
    acumula seis o más puntos en su historial de conducción?
  choices:
    A: Su licencia se suspende automáticamente por 30 días
    B: Se le requiere asistir a una audiencia departamental
    C: Debe realizar un examen escrito especial sobre prácticas de conducción segura
    D: Debe volver a realizar el examen de conducción
  answer: C
  explanation: Cuando un historial de conducción alcanza seis o más puntos por primera
    vez, el conductor recibirá una notificación para realizar un examen escrito especial
    sobre el sistema de puntos.
- id: 34
  category: driver_testing
  question: 'En Pennsylvania, si se le condena por no detenerse ante un autobús escolar
    que tiene sus luces rojas intermitentes encendidas y el brazo de parada extendido,
    su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: La condena por no detenerse ante un autobús escolar resulta en una
    suspensión de 60 días, una multa y cinco puntos en su historial de conducción.
- id: 35
  category: driver_testing
  question: ¿Cuál es el monto mínimo de seguro de responsabilidad civil por daños
    a la propiedad requerido para un vehículo registrado en Pennsylvania?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: A
  explanation: La ley de Pennsylvania exige un mínimo de $5,000 en cobertura de seguro
    de responsabilidad civil por daños a la propiedad.
- id: 36
  category: driver_testing
  question: 'Bajo la ley de ''Tolerancia Cero'' de Pennsylvania, se considera que
    un conductor menor de 21 años conduce bajo la influencia si su contenido de alcohol
    en sangre (BAC) es de:'
  choices:
    A: 0.01% o superior
    B: 0.02% o superior
    C: 0.05% o superior
    D: 0.08% o superior
  answer: B
  explanation: Para conductores menores de 21 años, la ley de Tolerancia Cero de Pennsylvania
    establece el límite legal en 0.02% de BAC.
- id: 37
  category: driver_testing
  question: 'Bajo la ley de Consentimiento Implícito de Pennsylvania, si se niega
    a someterse a una prueba química (aliento, sangre u orina) después de ser arrestado
    por conducir bajo la influencia (DUI), su licencia será suspendida por al menos:'
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: B
  explanation: Si se niega a una prueba química en Pennsylvania, su privilegio de
    conducir será suspendido por al menos 12 meses por una primera infracción.
- id: 38
  category: driver_testing
  question: ¿Cuál de las siguientes situaciones constituye una reprobación automática
    durante el examen de conducción de Pennsylvania?
  choices:
    A: Ajustar los espejos antes de arrancar
    B: Usar la luz de giro demasiado pronto
    C: Violar cualquier ley de tránsito
    D: Detenerse por completo en una señal de pare
  answer: C
  explanation: Violar cualquier ley de tránsito, como no detenerse ante una luz roja
    o una señal de pare, resulta en la reprobación automática del examen de conducción.
- id: 39
  category: driver_testing
  question: 'En Pennsylvania, si se le condena por conducir a 11 millas por hora o
    más por encima del límite de velocidad en una zona de obras activa, la sanción
    incluye:'
  choices:
    A: Una suspensión de la licencia por 15 días
    B: Una suspensión de la licencia por 30 días
    C: Una estancia obligatoria de 24 horas en la cárcel
    D: La revocación permanente de la licencia
  answer: A
  explanation: La ley de Pennsylvania exige una suspensión de la licencia por 15 días
    si se le condena por exceso de velocidad de 11 mph o más sobre el límite en una
    zona de obras activa.
- id: 40
  category: driver_testing
  question: ¿Cuántos puntos se añaden a un historial de conducción de Pennsylvania
    por 'No detenerse ante una luz roja'?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: De acuerdo con el Sistema de Puntos de Pennsylvania, no detenerse ante
    una luz roja resulta en la adición de 3 puntos al historial del conductor.
- id: 41
  category: driver_testing
  question: Antes de que comience el examen de conducir, el examinador revisará la
    seguridad del vehículo. ¿Cuál de las siguientes situaciones causaría que el examen
    se posponga?
  choices:
    A: La falta de radio
    B: Luces de giro que no funcionan
    C: Un parabrisas sucio
    D: Nivel bajo de combustible
  answer: B
  explanation: El vehículo debe estar en condiciones seguras de funcionamiento. Las
    luces de giro que no funcionan, las luces de freno o la falta de un espejo retrovisor
    son motivos para posponer el examen.
- id: 42
  category: driver_testing
  question: En Pensilvania, ¿cuántos puntos se asignan por 'Abandonar la escena de
    un accidente que solo causa daños a la propiedad'?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Abandonar la escena de un accidente que involucra daños a la propiedad
    resulta en 4 puntos en su historial de conducción de Pensilvania.
- id: 43
  category: driver_testing
  question: Si es menor de 18 años y solicita una licencia de conducir de Pensilvania,
    ¿qué formulario debe firmar su padre o tutor en el Centro de Licencias de Conducir
    para certificar que completó sus 65 horas de práctica?
  choices:
    A: DL-180
    B: DL-180TD
    C: DL-180C
    D: DL-714
  answer: C
  explanation: El Formulario de Certificación del Padre o Tutor (DL-180C) debe completarse
    y firmarse para verificar las 65 horas de capacitación al volante.
- id: 44
  category: driver_testing
  question: Además de la agudeza visual, ¿qué visión periférica horizontal combinada
    mínima requiere Pensilvania para calificar para una licencia sin restricciones?
  choices:
    A: 90 grados
    B: 100 grados
    C: 120 grados
    D: 140 grados
  answer: C
  explanation: Pensilvania requiere un campo de visión combinado de al menos 120 grados
    en el meridiano horizontal para aprobar el examen de la vista para una licencia
    de conducir estándar.
- id: 45
  category: driver_testing
  question: Si un conductor de Pensilvania no mantiene la responsabilidad financiera
    (seguro) de su vehículo por más de 31 días, ¿por cuánto tiempo se suspenderá su
    registro?
  choices:
    A: 30 días
    B: 60 días
    C: 3 meses
    D: 6 meses
  answer: C
  explanation: Si una interrupción en la cobertura del seguro dura más de 31 días,
    el PennDOT suspenderá el registro del vehículo por tres meses.
- id: 46
  category: driver_testing
  question: 'De acuerdo con la ley de ''Consentimiento Implícito'' (Implied Consent)
    de Pensilvania, si se niega a someterse a una prueba química de sangre, aliento
    u orina, su privilegio de conducir se suspenderá automáticamente por al menos:'
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 2 años
  answer: B
  explanation: Bajo el Consentimiento Implícito, negarse a realizar una prueba química
    resulta en una suspensión automática de la licencia por 12 meses por una primera
    infracción, independientemente de cualquier sanción judicial por DUI.
- id: 47
  category: driver_testing
  question: La ley de Pensilvania exige que los conductores enciendan sus faros delanteros
    siempre que utilicen sus limpiaparabrisas en qué configuración?
  choices:
    A: Solo intermitente
    B: Continuo o intermitente
    C: Solo alta velocidad
    D: No se requieren faros para los limpiaparabrisas
  answer: B
  explanation: La ley de Pensilvania exige que los faros delanteros estén encendidos
    cuando los limpiaparabrisas estén en uso continuo o intermitente debido a la lluvia,
    la nieve o el aguanieve.
- id: 48
  category: driver_testing
  question: Según la ley de Pensilvania, ¿en qué rango de edad deben los niños estar
    sujetos en un asiento elevador (booster seat) apropiado?
  choices:
    A: Desde el nacimiento hasta los 2 años
    B: De 2 a 4 años
    C: De 4 a 8 años
    D: De 8 a 12 años
  answer: C
  explanation: La ley de Pensilvania exige que los niños de 4 a 8 años estén sujetos
    en un sistema que incluya un asiento elevador (booster seat).
- id: 49
  category: driver_testing
  question: 'La ley de ''Hacerse a un lado'' (Move Over) de Pensilvania exige que
    los conductores se muevan a un carril que no sea adyacente a un área de respuesta
    a emergencias. Si no pueden moverse, deben:'
  choices:
    A: Detenerse por completo hasta que termine la emergencia
    B: Mantener la velocidad pero tocar la bocina
    C: Reducir la velocidad a no más de 20 mph por debajo del límite indicado
    D: Pasar a una velocidad que no supere las 10 mph
  answer: C
  explanation: Si un conductor no puede cambiarse de carril de manera segura, debe
    reducir su velocidad a una velocidad que sea al menos 20 mph menor que el límite
    de velocidad indicado.
- id: 50
  category: driver_testing
  question: En Pensilvania, se suspenderá la licencia de un conductor por 15 días
    si es condenado por exceso de velocidad por cuánto en una zona de obras activa?
  choices:
    A: 5 mph o más
    B: 11 mph o más
    C: 15 mph o más
    D: 20 mph o más
  answer: B
  explanation: Una condena por exceso de velocidad de 11 mph o más sobre el límite
    en una zona de obras activa resulta en una suspensión de la licencia de 15 días
    en Pensilvania.
- id: 51
  category: driver_testing
  question: ¿En Pensilvania, cuándo se le permite girar a la izquierda con el semáforo
    en rojo?
  choices:
    A: Nunca
    B: Solo cuando gira desde una calle de un solo sentido hacia otra calle de un
      solo sentido
    C: Solo cuando gira desde una calle de doble sentido hacia una calle de un solo
      sentido
    D: Siempre que no haya tráfico en sentido contrario
  answer: B
  explanation: En Pensilvania, puede girar a la izquierda en rojo solo cuando gira
    desde una calle de un solo sentido hacia otra calle de un solo sentido, después
    de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 52
  category: driver_testing
  question: Según el Manual del Conductor de Pensilvania, ¿a cuántos pies de un hidrante
    de incendios no se permite estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: B
  explanation: La ley de Pensilvania prohíbe estacionar a menos de 15 pies de un hidrante
    de incendios.
- id: 53
  category: driver_testing
  question: ¿Qué regla recomienda el Manual del Conductor de Pensilvania para mantener
    una distancia de seguimiento segura detrás del vehículo que va delante de usted?
  choices:
    A: La regla de los 2 segundos
    B: La regla de los 3 segundos
    C: La regla de los 4 segundos
    D: La regla de 1 largo de vehículo
  answer: C
  explanation: Aunque muchos estados usan una regla de 2 o 3 segundos, el Manual del
    Conductor de Pensilvania recomienda específicamente una distancia de seguimiento
    de 4 segundos por seguridad.
- id: 54
  category: driver_testing
  question: 'En Pensilvania, se requiere un dispositivo de bloqueo de encendido (Ignition
    Interlock) durante al menos un año por una primera infracción de DUI si el nivel
    de alcohol en sangre (BAC) del conductor era de al menos:'
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.16%
    D: Cualquier nivel de BAC
  answer: B
  explanation: Pensilvania requiere un bloqueo de encendido para los infractores por
    primera vez en la categoría de 'Tasa Alta' de alcohol (0.10% a 0.159%) y en la
    categoría de 'Tasa Más Alta' (0.16% en adelante).
- id: 55
  category: driver_responsibility
  question: 'En Pensilvania, si usted se ve involucrado en un choque que no es investigado
    por la policía y que resulta en lesiones, muerte o daños a un vehículo que requieran
    que sea remolcado, debe presentar un informe a PennDOT en un plazo de:'
  choices:
    A: 24 horas
    B: 48 horas
    C: 5 días
    D: 10 días
  answer: C
  explanation: Según el Manual del Conductor de PA, si un oficial de policía no investiga
    un choque que involucre muerte, lesiones o daños graves al vehículo (que requiera
    remolque), debe presentar un Informe de Accidente del Conductor (Formulario AA-600)
    en un plazo de 5 días.
- id: 56
  category: driver_responsibility
  question: La ley de Pensilvania exige que todos los vehículos motorizados registrados
    tengan un seguro de responsabilidad civil. ¿Cuál es la cobertura mínima requerida
    por lesiones corporales a una persona en un solo accidente?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $30,000
  answer: C
  explanation: La ley de responsabilidad financiera de Pensilvania exige un mínimo
    de $15,000 por lesiones corporales a una persona.
- id: 57
  category: driver_responsibility
  question: ¿Cuál es el monto mínimo de cobertura que los conductores de Pensilvania
    deben tener por daños a la propiedad en un solo accidente?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: A
  explanation: El límite mínimo de responsabilidad por daños a la propiedad en Pensilvania
    es de $5,000.
- id: 58
  category: driver_responsibility
  question: 'Si PennDOT determina que usted estaba conduciendo sin el seguro requerido,
    el registro de su vehículo y su licencia de conducir serán suspendidos por:'
  choices:
    A: 30 días
    B: 60 días
    C: 3 meses
    D: 6 meses
  answer: C
  explanation: Si lo sorprenden conduciendo sin seguro, la ley de Pensilvania exige
    una suspensión de tres meses tanto del registro de su vehículo como de su licencia
    de conducir.
- id: 59
  category: driver_responsibility
  question: En Pensilvania, ¿con qué frecuencia deben someterse la mayoría de los
    vehículos a una inspección de seguridad?
  choices:
    A: Cada 6 meses
    B: Una vez al año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Pensilvania requiere una inspección de seguridad anual para la mayoría
    de los vehículos para garantizar que sean seguros para operar en las vías públicas.
- id: 60
  category: driver_responsibility
  question: Para los conductores menores de 21 años en Pensilvania, ¿cuál es el límite
    máximo de contenido de alcohol en sangre (BAC) antes de que se considere que están
    conduciendo bajo la influencia?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Pensilvania tiene una política de 'Tolerancia Cero' para menores; un
    BAC de 0.02% o superior para un conductor menor de 21 años se considera DUI.
- id: 61
  category: driver_responsibility
  question: ¿En Pensilvania, cuál es el límite legal de concentración de alcohol en
    sangre (BAC) para un conductor adulto que opera un vehículo motorizado comercial?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: Para los conductores comerciales en PA, el límite legal de BAC es del
    0.04%, el cual es más estricto que el límite del 0.08% para conductores adultos
    no comerciales.
- id: 62
  category: driver_responsibility
  question: 'Si se ve involucrado en un choque con un vehículo estacionado y no puede
    encontrar al propietario, usted debe:'
  choices:
    A: Esperar en la escena durante al menos 2 horas
    B: Retirarse si no hay daños visibles
    C: Dejar una nota con su información de contacto y los detalles del seguro
    D: Informar solo si el daño supera los $1,000
  answer: C
  explanation: La ley de PA exige que se detenga e intente localizar al propietario.
    Si no se puede encontrar, debe dejar una nota por escrito con su nombre, dirección
    e información del seguro en un lugar visible del vehículo.
- id: 63
  category: driver_responsibility
  question: Al vender un vehículo en Pensilvania, ¿qué debe hacer el vendedor con
    la placa de matrícula?
  choices:
    A: Dejarla en el auto para el nuevo propietario
    B: Retirarla y devolverla a PennDOT o transferirla a otro vehículo
    C: Tirarla a la basura
    D: Entregarla al departamento de policía local
  answer: B
  explanation: En PA, la placa de matrícula pertenece al vendedor, no al vehículo.
    Debe retirarse al momento de la venta y transferirse a otro vehículo o devolverse
    a PennDOT.
- id: 64
  category: driver_responsibility
  question: 'Una primera condena por conducir bajo los efectos del alcohol (DUI) en
    Pensilvania por la ''Tasa Alta de Alcohol'' (BAC de 0.10% a 0.159%) resulta en
    una suspensión obligatoria de la licencia de:'
  choices:
    A: Sin suspensión
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: C
  explanation: Para el nivel de 'Tasa Alta' de DUI en PA, incluso una primera infracción
    conlleva una suspensión obligatoria de la licencia de 12 meses.
- id: 65
  category: driver_responsibility
  question: 'En Pensilvania, arrojar basura desde un vehículo es ilegal. Una condena
    por arrojar basura puede resultar en una multa de hasta:'
  choices:
    A: $50
    B: $100
    C: $300
    D: $1,000
  answer: C
  explanation: Según la Sección 3709 del Código de Vehículos de PA, arrojar basura
    es una infracción sumaria sancionable con una multa de hasta $300.
- id: 66
  category: driver_responsibility
  question: 'Si su licencia de conducir de Pensilvania es suspendida, debe pagar una
    ''tarifa de restauración'' a PennDOT antes de que se le pueda devolver la licencia.
    Esta tarifa es generalmente de al menos:'
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: Según las regulaciones actuales de PA, la tarifa de restauración estándar
    para una licencia de conducir no comercial es de aproximadamente $100 (sujeto
    a cambios por legislación).
- id: 67
  category: driver_responsibility
  question: ¿En Pensilvania, cuáles son los límites mínimos de cobertura de seguro
    de responsabilidad civil requeridos por la ley?
  choices:
    A: $10,000 por lesiones corporales / $20,000 por accidente / $5,000 por daños
      a la propiedad
    B: $15,000 por lesiones corporales / $30,000 por accidente / $5,000 por daños
      a la propiedad
    C: $25,000 por lesiones corporales / $50,000 por accidente / $10,000 por daños
      a la propiedad
    D: $20,000 por lesiones corporales / $40,000 por accidente / $15,000 por daños
      a la propiedad
  answer: B
  explanation: La ley de Pensilvania exige una cobertura mínima de responsabilidad
    civil de $15,000 por lesiones corporales a una persona, $30,000 por lesiones corporales
    a más de una persona en un accidente y $5,000 por daños a la propiedad.
- id: 68
  category: driver_responsibility
  question: Si PennDOT determina que un conductor ha operado un vehículo sin la responsabilidad
    financiera requerida (seguro), ¿cuál es el período de suspensión obligatoria para
    el registro del vehículo y la licencia de conducir?
  choices:
    A: 30 días
    B: 60 días
    C: 3 meses
    D: 6 meses
  answer: C
  explanation: Según la Sección 1786 del Código de Vehículos de PA, si una persona
    no mantiene la responsabilidad financiera, PennDOT suspenderá el registro del
    vehículo y el privilegio de conducir de la persona por tres meses.
- id: 69
  category: driver_responsibility
  question: Si se ve involucrado en un accidente que requiere que se presente un informe
    ante PennDOT, ¿cuántos días tiene para enviar el informe por escrito?
  choices:
    A: 2 días
    B: 5 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: De acuerdo con el Manual del Conductor de Pensilvania, si la policía
    no investiga un accidente que involucre lesiones o daños graves al vehículo, usted
    debe enviar un informe por escrito a PennDOT en un plazo de 5 días.
- id: 70
  category: driver_responsibility
  question: Bajo la ley de 'Tolerancia Cero' de Pensilvania, ¿cuál es el límite de
    concentración de alcohol en sangre (BAC) para conductores menores de 21 años?
  choices:
    A: 0.00%
    B: 0.01%
    C: 0.02%
    D: 0.08%
  answer: C
  explanation: La ley de Tolerancia Cero de Pensilvania establece el límite de BAC
    para menores (menores de 21 años) en 0.02%. Este es un umbral muy bajo destinado
    a tener en cuenta el consumo incidental de alcohol, mientras prohíbe estrictamente
    beber y conducir.
- id: 71
  category: driver_responsibility
  question: En Pensilvania, ¿se considera que un conductor está legalmente intoxicado
    si su Contenido de Alcohol en Sangre (BAC) está en o por encima de qué nivel?
  choices:
    A: 0.05%
    B: 0.07%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Para conductores de 21 años o más en Pensilvania, el límite legal de
    BAC es 0.08%.
- id: 72
  category: driver_responsibility
  question: Según la ley de Pensilvania, si se le condena por huir o intentar eludir
    a un oficial de policía, ¿cuál es la sanción con respecto a su privilegio de conducir?
  choices:
    A: 3 puntos en su registro
    B: Una suspensión de 6 meses
    C: Una suspensión de 1 año
    D: Una revocación obligatoria de 5 años
  answer: C
  explanation: Huir o intentar eludir a un oficial de policía es una ofensa grave
    en PA y conlleva una suspensión obligatoria de 1 año de su privilegio de conducir.
- id: 73
  category: driver_responsibility
  question: ¿Cuál de las siguientes NO es una forma aceptable de prueba de responsabilidad
    financiera (seguro) en Pensilvania?
  choices:
    A: Una tarjeta de identificación de seguro válida emitida por una compañía de
      seguros
    B: Una copia de la página de declaraciones de una póliza de seguro
    C: Una nota escrita a mano de un agente de seguros
    D: Una copia de una cobertura provisional (binder) de seguro válida
  answer: C
  explanation: Las pruebas aceptables incluyen la tarjeta de identificación oficial,
    la página de declaraciones, una cobertura provisional (binder) válida o una solicitud
    para el Plan de Riesgo Asignado de PA. Una nota escrita a mano no es una forma
    legal de prueba.
- id: 74
  category: driver_responsibility
  question: Si un conductor de Pensilvania es condenado por un DUI por primera vez,
    ¿por qué período de tiempo se le podría exigir el uso de un Dispositivo de Interbloqueo
    de Encendido (IID)?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: Permanentemente
  answer: C
  explanation: Para muchas ofensas de DUI en Pensilvania, incluyendo ofensas de tasa
    alta por primera vez o ofensas subsiguientes, se requiere un Dispositivo de Interbloqueo
    de Encendido por un período de 12 meses antes de que se restablezcan por completo
    los privilegios de conducir.
- id: 75
  category: driver_responsibility
  question: ¿Cuál es la sanción para un conductor de Pensilvania que es condenado
    por conducir mientras su licencia está suspendida debido a una ofensa relacionada
    con un DUI?
  choices:
    A: Solo una multa de $100
    B: Una multa de $500 y de 60 a 90 días de cárcel
    C: Una advertencia y 2 puntos
    D: Ninguna sanción adicional si es la primera vez
  answer: B
  explanation: Conducir mientras la licencia está suspendida por una ofensa relacionada
    con un DUI conlleva una multa obligatoria de $500 y una pena de prisión obligatoria
    de 60 a 90 días.
- id: 76
  category: safe_driving_rules
  question: En Pensilvania, ¿cuál es el límite de velocidad en una zona escolar durante
    las horas restringidas cuando las luces están parpadeando?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Según el Manual del Conductor de Pensilvania, el límite de velocidad
    en una zona escolar es de 15 mph cuando las luces están parpadeando o durante
    los períodos de tiempo indicados en la señal.
- id: 77
  category: safe_driving_rules
  question: Según la ley de Pensilvania, ¿con cuántos pies de antelación debe usar
    sus señales de giro antes de girar si viaja a menos de 35 mph?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Pensilvania exige que los conductores señalen al menos 100
    pies antes de un giro cuando viajan a menos de 35 mph. Si viaja a 35 mph o más,
    debe señalar con al menos 300 pies de antelación.
- id: 78
  category: safe_driving_rules
  question: En Pensilvania, ¿es ilegal estacionar su vehículo a menos de cuántos pies
    de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Pensilvania prohíbe estacionar a menos de 15 pies de un hidrante
    de incendios.
- id: 79
  category: safe_driving_rules
  question: Al estacionar cerca de una intersección en Pensilvania, ¿a cuántos pies
    de distancia mínima debe estar de una señal de alto, una baliza intermitente o
    una señal de ceder el paso?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: En Pensilvania, se prohíbe a los conductores estacionar a menos de
    30 pies de cualquier baliza intermitente, señal de alto, señal de ceder el paso
    o señal de control de tráfico ubicada al costado de una carretera.
- id: 80
  category: safe_driving_rules
  question: Según la ley de Pensilvania de "limpiaparabrisas encendidos, faros encendidos",
    ¿cuándo deben encenderse los faros?
  choices:
    A: Solo durante aguaceros fuertes
    B: Solo entre el atardecer y el amanecer
    C: Siempre que los limpiaparabrisas estén en uso continuo o intermitente debido
      a la precipitación
    D: Solo cuando la visibilidad sea inferior a 1,000 pies
  answer: C
  explanation: La ley de Pensilvania exige que los automovilistas enciendan sus faros
    siempre que los limpiaparabrisas del vehículo estén en uso continuo o intermitente
    debido a la lluvia, nieve, aguanieve o neblina.
- id: 81
  category: safe_driving_rules
  question: Al acercarse a un autobús escolar con sus luces rojas intermitentes y
    el brazo de parada extendido en una carretera que NO está separada por una barrera
    física, ¿a cuántos pies de distancia como mínimo debe detenerse?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: En Pensilvania, debe detenerse al menos a 10 pies de distancia de un
    autobús escolar cuando sus luces rojas parpadean y el brazo de parada está extendido,
    independientemente de la dirección en la que viaje, a menos que sea en una carretera
    dividida.
- id: 82
  category: safe_driving_rules
  question: ¿Cuál es la sanción por una primera condena por violar la ley de detención
    ante un autobús escolar de Pensilvania?
  choices:
    A: Una multa de $100 y 2 puntos
    B: Una multa de $250, 5 puntos y una suspensión de la licencia por 60 días
    C: Una multa de $500 y 3 puntos
    D: Una multa de $1,000 y una suspensión de la licencia por 1 año
  answer: B
  explanation: Violar la ley de detención ante un autobús escolar de Pensilvania resulta
    en una multa de $250, cinco puntos en su historial de manejo y una suspensión
    obligatoria de 60 días de su privilegio de conducir.
- id: 83
  category: safe_driving_rules
  question: Bajo la ley 'Steer Clear' (Moverse de carril) de Pensilvania, ¿qué debe
    hacer al acercarse a una escena de emergencia o a un vehículo de respuesta estacionario
    con luces intermitentes?
  choices:
    A: Mantener la velocidad pero moverse al carril izquierdo
    B: Detenerse inmediatamente
    C: Moverse a un carril que no esté adyacente a la escena o reducir la velocidad
      a una que sea razonable y prudente
    D: Tocar la bocina para alertar a los trabajadores
  answer: C
  explanation: La ley 'Steer Clear' (Ley de Moverse de Carril) exige que los conductores
    se muevan a un carril que no esté adyacente al área de respuesta a emergencias.
    Si no pueden cambiarse de carril, deben reducir la velocidad a una que sea segura
    para las condiciones.
- id: 84
  category: safe_driving_rules
  question: En Pensilvania, ¿a cuántos pies de un vehículo que viene en sentido contrario
    debe cambiar las luces altas por las luces bajas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Pensilvania exige que los conductores cambien a luces bajas
    cuando un vehículo que viene en sentido contrario se encuentra a menos de 500
    pies.
- id: 85
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en las autopistas interestatales
    de Pensilvania, donde esté señalizado?
  choices:
    A: 55 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: El límite de velocidad máximo en ciertas secciones de las autopistas
    interestatales de Pensilvania es de 70 mph, según lo indican las señales publicadas.
- id: 86
  category: safe_driving_rules
  question: En Pensilvania, si se ve involucrado en un choque que requiere un informe
    policial, ¿dentro de cuántos días debe presentar un 'Informe de Accidente del
    Conductor' (Formulario AA-600) si la policía no investiga el choque?
  choices:
    A: 2 días
    B: 5 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: Si la policía no investiga un choque que involucre muerte, lesiones
    o daños graves a cualquier vehículo, debe presentar un informe ante PennDOT en
    un plazo de 5 días.
- id: 87
  category: safe_driving_rules
  question: Si conduce en una zona de obras activa en Pensilvania y no enciende los
    faros delanteros, ¿cuál es la sanción?
  choices:
    A: Una multa de $25
    B: Una multa de $100
    C: 2 puntos en su licencia
    D: Una suspensión de la licencia por 15 días
  answer: A
  explanation: En Pensilvania, es obligatorio encender los faros delanteros en zonas
    de obras activas. No hacerlo resulta en una multa de $25.
- id: 88
  category: safe_driving_rules
  question: Si es condenado por violar la ley de detención ante un autobús escolar
    de Pensilvania, ¿cuáles son las sanciones por una primera infracción?
  choices:
    A: 3 puntos y una multa de $100
    B: 2 puntos y una suspensión de 30 días
    C: 5 puntos, una multa de $250 y una suspensión de la licencia por 60 días
    D: 6 puntos y una suspensión de la licencia por 90 días
  answer: C
  explanation: En Pensilvania, la sanción por no detenerse ante un autobús escolar
    incluye una suspensión de 60 días de su privilegio de conducir, cinco puntos en
    su historial de manejo y una multa de $250.
- id: 89
  category: safe_driving_rules
  question: En Pensilvania, si conduce a una velocidad de 35 mph o más, ¿con cuántos
    pies de antelación debe señalizar su intención de girar antes del giro?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: La ley de Pensilvania exige que los conductores señalicen al menos
    100 pies antes de girar si viajan a menos de 35 mph, y al menos 300 pies antes
    de girar si viajan a 35 mph o más rápido.
- id: 90
  category: safe_driving_rules
  question: En Pensilvania, ¿no puede estacionar su vehículo a menos de cuántos pies
    de una señal de pare, una baliza intermitente o una señal de ceda el paso?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Pensilvania establece que no se puede estacionar a menos
    de 30 pies de cualquier señal intermitente, señal de pare, señal de ceda el paso
    o señal de control de tráfico ubicada al costado de una carretera.
- id: 91
  category: safe_driving_rules
  question: En Pensilvania, si lo sorprenden conduciendo a 11 mph o más por encima
    del límite en una zona de obras activa, ¿cuál es la sanción obligatoria?
  choices:
    A: Una multa de $500
    B: Una suspensión de la licencia por 15 días
    C: Una suspensión de la licencia por 30 días
    D: El doble de puntos en su historial
  answer: B
  explanation: La ley de Pensilvania exige una suspensión de la licencia de 15 días
    si se le condena por conducir a 11 mph o más por encima del límite de velocidad
    establecido en una zona de obras activa.
- id: 92
  category: safe_driving_rules
  question: De acuerdo con la ley de Pensilvania, ¿cuándo debe encender sus faros
    delanteros?
  choices:
    A: Solo entre el atardecer y el amanecer
    B: Siempre que no pueda ver con claridad a 500 pies
    C: Siempre que sus limpiaparabrisas estén en uso continuo o intermitente debido
      al clima
    D: Tanto B como C
  answer: D
  explanation: En Pensilvania, los faros deben estar encendidos entre el atardecer
    y el amanecer, en cualquier área donde no pueda ver a 1,000 pies de distancia,
    y siempre que sus limpiaparabrisas estén en uso debido a la lluvia, nieve o aguanieve.
- id: 93
  category: safe_driving_rules
  question: En Pensilvania, ¿se le permite rebasar a un vehículo por la derecha solo
    bajo cuál de las siguientes condiciones?
  choices:
    A: Cuando el vehículo de adelante está girando o a punto de girar a la izquierda
    B: Cuando se encuentra en una carretera con dos o más carriles de tráfico que
      se mueven en la misma dirección
    C: Cuando tiene prisa y el carril izquierdo está bloqueado
    D: Tanto A como B
  answer: D
  explanation: La ley de Pensilvania permite rebasar por la derecha cuando el vehículo
    que se está adelantando está girando a la izquierda, o en una calzada con pavimento
    sin obstrucciones y de ancho suficiente para dos o más líneas de vehículos que
    se mueven en la misma dirección.
- id: 94
  category: safe_driving_rules
  question: Al estacionar un vehículo en una colina en Pensilvania, ¿hacia qué lado
    debe girar las ruedas delanteras si está estacionado cuesta arriba con bordillo
    (curb)?
  choices:
    A: Hacia el bordillo
    B: En dirección opuesta al bordillo
    C: Paralelas al bordillo
    D: No importa
  answer: B
  explanation: Al estacionar cuesta arriba con bordillo, gire las ruedas en dirección
    opuesta al bordillo para que, si el vehículo rueda, la parte trasera de la llanta
    delantera golpee el bordillo y detenga el auto.
- id: 95
  category: safe_driving_rules
  question: En Pensilvania, ¿qué sucede cuando el historial de un conductor alcanza
    6 o más puntos por primera vez?
  choices:
    A: Suspensión automática de 30 días
    B: El conductor debe asistir a una audiencia departamental
    C: El conductor debe realizar un examen escrito especial sobre el sistema de puntos
    D: El conductor debe volver a realizar el examen de conducir
  answer: C
  explanation: Cuando el historial de conducción de cualquier persona alcanza 6 o
    más puntos por primera vez, recibirá una notificación para realizar un examen
    escrito especial. Tiene 30 días para aprobarlo o su licencia será suspendida.
- id: 96
  category: defensive_driving
  question: Según el Manual del Conductor de Pensilvania, ¿cuál es la distancia de
    seguimiento recomendada detrás del vehículo que va delante de usted en condiciones
    ideales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: C
  explanation: El manual oficial de Pensilvania recomienda una distancia de seguimiento
    de cuatro segundos para permitir suficiente tiempo para reaccionar ante peligros
    o paradas repentinas.
- id: 97
  category: defensive_driving
  question: 'En Pensilvania, la ley exige encender los faros delanteros siempre que
    se utilicen los limpiaparabrisas debido a la lluvia, nieve o aguanieve. Esto se
    conoce como:'
  choices:
    A: La Ley de Visibilidad
    B: La ley de 'Limpiaparabrisas encendidos, luces encendidas'
    C: La Ley de Seguridad para Todo Clima
    D: El Mandato de Vista Despejada
  answer: B
  explanation: La ley de Pensilvania (Ley 159) exige que los automovilistas enciendan
    sus faros siempre que los limpiaparabrisas de su vehículo estén en uso continuo
    o intermitente debido a las condiciones climáticas.
- id: 98
  category: defensive_driving
  question: Bajo la ley 'Move Over' (Hacerse a un lado) de Pensilvania, ¿qué debe
    hacer al acercarse a un área de respuesta a emergencias en una carretera de varios
    carriles?
  choices:
    A: Detenerse por completo hasta que se le indique pasar
    B: Cambiarse a un carril que no sea adyacente al área de respuesta a emergencias
    C: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    D: Acelerar para despejar el área lo más rápido posible
  answer: B
  explanation: La ley de Pensilvania exige que los conductores se muevan a un carril
    que no sea adyacente a un área de respuesta a emergencias. Si no pueden cambiarse
    de carril de manera segura, deben reducir la velocidad a no más de 20 mph menos
    que el límite de velocidad indicado.
- id: 99
  category: defensive_driving
  question: En Pensilvania, ¿cuántos puntos se agregan a su historial de conducción
    por 'Seguir demasiado de cerca' (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: Bajo el sistema de puntos del Departamento de Transporte de Pensilvania
    (PennDOT), seguir demasiado de cerca es una infracción de 3 puntos.
- id: 100
  category: defensive_driving
  question: Según el Manual del Conductor de PA, ¿a qué velocidad puede comenzar el
    hidroplaneo (hydroplaning) a medida que el agua se acumula entre las llantas y
    la superficie de la carretera?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph,
    y las llantas pueden perder todo contacto con la carretera a 50 mph durante una
    lluvia intensa.
- id: 101
  category: defensive_driving
  question: 'En Pennsylvania, si está conduciendo a través de una zona de obras activa,
    la ley le exige:'
  choices:
    A: Encender las luces de emergencia
    B: Encender las luces delanteras (faros)
    C: Tocar la bocina cada 100 pies
    D: Conducir exactamente a 15 mph independientemente del límite señalizado
  answer: B
  explanation: La ley de Pennsylvania exige que los automovilistas enciendan sus luces
    delanteras en todas las zonas de obras activas para aumentar la visibilidad.
- id: 102
  category: defensive_driving
  question: Al escanear el camino adelante para evitar peligros, ¿qué tan lejos recomienda
    mirar el Manual del Conductor de Pennsylvania?
  choices:
    A: De 5 a 8 segundos
    B: De 12 a 15 segundos
    C: De 20 a 30 segundos
    D: Solo al vehículo que está directamente frente a usted
  answer: B
  explanation: Los conductores deben escanear el camino de 12 a 15 segundos hacia
    adelante para anticipar posibles problemas y tener suficiente tiempo para reaccionar.
- id: 103
  category: defensive_driving
  question: 'Bajo la "Ley de Christine" (Christine''s Law) de Pennsylvania, los conductores
    pueden ser multados si no retiran ¿qué cosa? de su vehículo dentro de las 24 horas
    posteriores a una tormenta:'
  choices:
    A: Lodo y suciedad
    B: Hojas caídas
    C: Hielo y nieve
    D: Empañamiento de las ventanas
  answer: C
  explanation: La Ley 90 (Ley de Christine) exige que los conductores retiren el hielo
    o la nieve acumulados de su vehículo dentro de las 24 horas posteriores a una
    tormenta para evitar que salgan volando y causen lesiones o daños a la propiedad.
- id: 104
  category: defensive_driving
  question: Al conducir con niebla densa en Pennsylvania, ¿qué luces debe utilizar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque la luz de las luces
    altas se refleja en la niebla y regresa a los ojos del conductor, reduciendo la
    visibilidad.
- id: 105
  category: defensive_driving
  question: Si está conduciendo en una carretera con un autobús escolar que tiene
    sus luces rojas intermitentes y el brazo de parada extendido, la ley de Pennsylvania
    le exige detenerse al menos a ¿cuántos pies de distancia?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La ley de Pennsylvania exige que los automovilistas se detengan al
    menos a 10 pies de distancia de un autobús escolar cuando sus luces rojas parpadean
    y el brazo de parada está extendido.
- id: 106
  category: defensive_driving
  question: 'Si su vehículo está equipado con un Sistema de Frenos Antibloqueo (ABS)
    y necesita detenerse rápidamente en una emergencia, usted debe:'
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y constante al pedal del freno
    C: Tocar ligeramente los frenos para evitar que se bloqueen
    D: Cambiar a neutral y usar el freno de emergencia
  answer: B
  explanation: Con el ABS, debe aplicar una presión firme y constante. Bombear los
    frenos es para vehículos antiguos sin ABS y, de hecho, desactivará los beneficios
    del sistema ABS.
- id: 107
  category: defensive_driving
  question: 'Al aproximarse a una curva, la práctica de conducción defensiva más segura
    es:'
  choices:
    A: Frenar bruscamente mientras está en medio de la curva
    B: Acelerar para mantener la tracción
    C: Reducir la velocidad antes de entrar en la curva
    D: Cambiar a neutral
  answer: C
  explanation: El Manual del Conductor de PA establece que debe reducir la velocidad
    antes de entrar en una curva para que pueda acelerar ligeramente al salir, lo
    que ayuda a mantener la estabilidad del vehículo.
- id: 108
  category: defensive_driving
  question: 'Al entrar en una intersección, el Manual del Conductor de Pennsylvania
    recomienda mirar en qué orden:'
  choices:
    A: Derecha, Izquierda, Derecha
    B: Izquierda, Derecha, Izquierda
    C: Recto, Izquierda, Derecha
    D: Solo en la dirección en la que va a girar
  answer: B
  explanation: Los conductores deben mirar a la izquierda, luego a la derecha y luego
    a la izquierda nuevamente antes de entrar en una intersección, ya que el tráfico
    que viene de la izquierda está más cerca de usted.
- id: 109
  category: defensive_driving
  question: Para evitar el frenado de último minuto o la necesidad de girar repentinamente,
    el Manual del Conductor de Pennsylvania sugiere escanear el camino adelante al
    menos ¿cuántos segundos?
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 12 segundos
    C: De 12 a 15 segundos
    D: De 20 a 30 segundos
  answer: C
  explanation: Escanear de 12 a 15 segundos hacia adelante le permite ver los peligros
    a tiempo y planificar su trayectoria de manera segura.
- id: 110
  category: defensive_driving
  question: Al seguir a otro vehículo por la noche en Pennsylvania, debe cambiar a
    luces bajas cuando se encuentre a menos de ¿cuántos pies del vehículo de adelante?
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: B
  explanation: La ley de Pennsylvania exige que los conductores cambien a luces bajas
    cuando sigan a otro vehículo a una distancia de 300 pies o menos.
- id: 111
  category: defensive_driving
  question: 'Según la ley de Pensilvania, si cae nieve o hielo de su vehículo en movimiento
    y causa la muerte o lesiones corporales graves a otra persona, usted podría enfrentar
    una multa de hasta:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $5,000
  answer: C
  explanation: La ley de Pensilvania (Ley 89) permite a la policía citar a los conductores
    si cae nieve o hielo de un vehículo y causa lesiones o la muerte, con multas que
    oscilan entre $200 y $1,500.
- id: 112
  category: defensive_driving
  question: El hidroplaneo (hydroplaning) puede ocurrir a velocidades tan bajas como
    ____ mph cuando hay lluvia intensa o agua estancada en una carretera de Pensilvania.
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Bajo lluvia intensa, sus neumáticos pueden perder todo contacto con
    la carretera (hidroplaneo) a velocidades tan bajas como 35 mph.
- id: 113
  category: defensive_driving
  question: Al conducir a través de una niebla densa en Pensilvania, ¿qué luces debe
    utilizar para garantizar la mejor visibilidad?
  choices:
    A: Luces altas (high beam)
    B: Luces bajas (low beam)
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia (hazard lights)
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque la luz de las luces
    altas se refleja en la humedad del aire, lo que dificulta la visión.
- id: 114
  category: defensive_driving
  question: 'En Pensilvania, se requiere que encienda sus faros delanteros al conducir
    a través de:'
  choices:
    A: Cualquier calle residencial
    B: Zonas de trabajo activas
    C: Zonas escolares durante las horas de llegada
    D: Garajes de estacionamiento
  answer: B
  explanation: La ley de Pensilvania exige que los faros estén encendidos en todas
    las zonas de trabajo activas, independientemente de la hora del día.
- id: 115
  category: defensive_driving
  question: 'Si sus ruedas traseras comienzan a derrapar en una carretera helada de
    Pensilvania, usted debe:'
  choices:
    A: Girar el volante en la dirección opuesta al derrape
    B: Girar el volante en la dirección en la que la parte trasera del vehículo está
      derrapando
    C: Frenar fuerte inmediatamente
    D: Acelerar para recuperar la tracción
  answer: B
  explanation: Para recuperarse de un derrape, retire el pie del acelerador y gire
    el volante en la dirección en la que se desliza la parte trasera del automóvil.
- id: 116
  category: defensive_driving
  question: 'Al compartir la carretera con camiones grandes, la "Zona No" (The No-Zone)
    se refiere a:'
  choices:
    A: El área de carga del camión
    B: Los carriles con límite de velocidad en la autopista de peaje de PA (PA Turnpike)
    C: Los puntos ciegos alrededor del camión donde su automóvil no puede ser visto
    D: El área donde los camiones tienen prohibido circular
  answer: C
  explanation: La "Zona No" representa los grandes puntos ciegos alrededor de un camión
    (delante, detrás y a los lados) donde el conductor del camión no puede ver su
    vehículo.
- id: 117
  category: defensive_driving
  question: Pensilvania es un estado de alto riesgo de colisiones entre ciervos y
    vehículos. Según el manual, ¿cuándo están más activos los ciervos?
  choices:
    A: Al mediodía (12 PM - 2 PM)
    B: A última hora de la mañana (9 AM - 11 AM)
    C: Al anochecer y al amanecer
    D: A altas horas de la noche (2 AM - 4 AM)
  answer: C
  explanation: Los ciervos están más activos durante el anochecer y el amanecer, que
    también son momentos en los que la visibilidad se reduce para los conductores.
- id: 118
  category: defensive_driving
  question: En Pensilvania, ¿a cuántos pies de distancia como mínimo debe detenerse
    de un autobús escolar que tiene sus luces rojas intermitentes y el brazo de parada
    extendido?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La ley de Pensilvania exige que los automovilistas se detengan al menos
    a 10 pies de distancia de un autobús escolar con sus luces rojas intermitentes
    y el brazo de parada extendido.
- id: 119
  category: alcohol_drugs_health
  question: Bajo la ley de Consentimiento Implícito (Implied Consent) de Pensilvania,
    ¿cuál es la sanción por negarse por primera vez a someterse a una prueba química
    (sangre, aliento u orina)?
  choices:
    A: Una suspensión de la licencia por 6 meses
    B: Una suspensión de la licencia por 12 meses
    C: Solo una multa de $100
    D: Ninguna sanción si se le declara no culpable de DUI
  answer: B
  explanation: Si se niega a realizarse una prueba química en PA, su privilegio de
    conducir será suspendido automáticamente por 12 meses por una primera infracción,
    independientemente de si es condenado por DUI.
- id: 120
  category: alcohol_drugs_health
  question: Las leyes de DUI de Pensilvania se clasifican en tres niveles según el
    BAC (concentración de alcohol en sangre). ¿Qué rango define el nivel de "Tasa
    Alta de Alcohol" (High Rate of Alcohol)?
  choices:
    A: 0.05% a 0.079%
    B: 0.08% a 0.099%
    C: 0.10% a 0.159%
    D: 0.16% o superior
  answer: C
  explanation: En PA, el nivel de "Tasa Alta" se aplica a los conductores con un BAC
    de 0.10% a 0.159%. El nivel de "Deterioro General" es de 0.08% a 0.099%, y la
    "Tasa Más Alta" es de 0.16% o superior.
- id: 121
  category: alcohol_drugs_health
  question: Si un conductor es condenado por un DUI que involucra una sustancia controlada
    (drogas) en Pennsylvania, ¿a qué nivel de sanciones está sujeto?
  choices:
    A: Deterioro General (Nivel más bajo)
    B: Tasa Alta (Nivel medio)
    C: Tasa Más Alta (Nivel superior)
    D: Un nivel separado solo para drogas sin suspensión de licencia
  answer: C
  explanation: En Pennsylvania, conducir bajo la influencia de una sustancia controlada
    (drogas ilegales o medicamentos recetados sin receta) conlleva las mismas sanciones
    que el nivel de BAC de 'Tasa Más Alta' (0.16% o superior).
- id: 122
  category: alcohol_drugs_health
  question: ¿Cuál es el límite máximo de BAC para el titular de una Licencia de Conducir
    Comercial (CDL) que opera un vehículo comercial en Pennsylvania?
  choices:
    A: 0.08%
    B: 0.04%
    C: 0.02%
    D: 0.01%
  answer: B
  explanation: Para los conductores comerciales en Pennsylvania, el límite legal de
    BAC es 0.04%. Si el BAC de un titular de CDL es de 0.04% o superior mientras conduce
    un vehículo comercial, está sujeto a sanciones por DUI.
- id: 123
  category: alcohol_drugs_health
  question: 'En Pennsylvania, una condena por DUI por primera vez en la ''Tasa Más
    Alta'' (BAC 0.16%+) conlleva una sentencia mínima obligatoria de cárcel de:'
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 10 días
  answer: C
  explanation: Una condena por DUI por primera vez en el nivel de Tasa Más Alta (0.16%
    o superior) en PA requiere un mínimo obligatorio de 72 horas en la cárcel, junto
    con una suspensión de la licencia de 12 meses y una multa de $1,000 a $5,000.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la Ley
    de Envase Abierto de Pennsylvania?
  choices:
    A: Los pasajeros pueden beber alcohol siempre que el conductor esté sobrio.
    B: Es ilegal tener un envase de bebida alcohólica abierto en el área de pasajeros
      de un vehículo en una carretera.
    C: Se permiten envases abiertos si se colocan en la guantera.
    D: La ley solo se aplica al conductor, no a los pasajeros.
  answer: B
  explanation: La ley de Pennsylvania prohíbe la posesión de un envase de bebida alcohólica
    abierto en el área de pasajeros de un vehículo motorizado mientras se encuentra
    en una carretera. Esto se aplica tanto a conductores como a pasajeros.
- id: 125
  category: alcohol_drugs_health
  question: Si es condenado por una segunda infracción de DUI en Pennsylvania, ¿por
    cuánto tiempo se le requerirá tener instalado un sistema de Interbloqueo de Encendido
    (Ignition Interlock) en su vehículo?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Permanentemente
  answer: B
  explanation: En Pennsylvania, los infractores reincidentes de DUI (y ciertos infractores
    por primera vez en niveles altos) deben instalar un sistema de Interbloqueo de
    Encendido por un período de un año antes de poder recuperar todos los privilegios
    de conducción.
- id: 126
  category: alcohol_drugs_health
  question: Según la ley de Pennsylvania, si tiene una condición médica como la epilepsia,
    ¿cuánto tiempo debe estar libre de convulsiones antes de poder conducir legalmente?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Pennsylvania requiere que las personas con un trastorno convulsivo
    estén libres de convulsiones durante al menos seis meses, con o sin medicamentos,
    antes de que se les permita conducir.
- id: 127
  category: alcohol_drugs_health
  question: ¿Qué efecto tiene combinar alcohol con otra droga (como un medicamento
    para el resfriado o una receta médica) en su capacidad para conducir?
  choices:
    A: Los efectos de la droga y el alcohol se anulan entre sí.
    B: El alcohol evita que la droga funcione.
    C: La combinación aumenta los efectos de ambos, a menudo deteriorando drásticamente
      al conductor.
    D: No hay un efecto combinado a menos que la droga sea ilegal.
  answer: C
  explanation: Combinar alcohol con otras drogas (efecto sinérgico) puede multiplicar
    el deterioro, haciéndolo mucho más peligroso que usar cualquiera de las sustancias
    por separado.
- id: 128
  category: alcohol_drugs_health
  question: En Pennsylvania, ¿qué es el programa de 'Disposición Rehabilitadora Acelerada'
    (ARD)?
  choices:
    A: Un programa para infractores reincidentes de DUI para evitar la cárcel.
    B: Un programa para infractores de DUI por primera vez que puede llevar a que
      se desestimen los cargos y se borre el antecedente.
    C: Una escuela de manejo obligatoria para personas con demasiados puntos.
    D: Una evaluación médica para conductores de edad avanzada.
  answer: B
  explanation: El ARD es un programa que a menudo se ofrece a quienes cometen un DUI
    por primera vez en PA. La finalización exitosa de los requisitos del programa
    (libertad condicional, servicio comunitario, etc.) permite al infractor que se
    desestimen sus cargos y se elimine su antecedente penal.
- id: 129
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años y es condenado por comprar, consumir o poseer
    alcohol (incluso si no está conduciendo), la ley de Pennsylvania ordena:'
  choices:
    A: Solo una multa de $50.
    B: Una suspensión obligatoria de 90 días de su privilegio de conducir por una
      primera infracción.
    C: Ninguna suspensión de licencia a menos que estuviera en un automóvil.
    D: Inscripción obligatoria en el ejército.
  answer: B
  explanation: Pennsylvania impone una suspensión de los privilegios de conducir a
    los menores condenados por delitos relacionados con el alcohol (consumo de alcohol
    por menores de edad), incluso si no hubo un vehículo involucrado. Una primera
    infracción resulta en una suspensión de 90 días.
- id: 130
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma de la 'Hipnosis de Carretera'?
  choices:
    A: Aumento del estado de alerta y la concentración.
    B: Un estado similar al trance causado por mirar la carretera durante largos períodos.
    C: Dolor físico extremo en las piernas.
    D: Impulsos repentinos de acelerar.
  answer: B
  explanation: La hipnosis de carretera es un estado de falta de conciencia o una
    condición similar al trance causada por largos períodos de conducción monótona,
    lo cual puede ser tan peligroso como conducir cansado o bajo los efectos de sustancias.
- id: 131
  category: alcohol_drugs_health
  question: ¿De qué manera afecta primero el alcohol la capacidad de un conductor?
  choices:
    A: Mejora el tiempo de reacción.
    B: Afecta el juicio y el autocontrol.
    C: Agudiza la visión periférica.
    D: No tiene efecto hasta que el BAC alcanza el 0.08%.
  answer: B
  explanation: El alcohol afecta el juicio y el autocontrol mucho antes de afectar
    la coordinación física o el tiempo de reacción. Por esta razón, los conductores
    a menudo sienten que son capaces de conducir cuando en realidad sus facultades
    están disminuidas.
- id: 132
  category: alcohol_drugs_health
  question: 'En Pensilvania, si se ve involucrado en un choque mientras su BAC está
    por encima del límite legal, es posible que se le exija:'
  choices:
    A: Pagar todos los daños de su propio bolsillo, independientemente del seguro.
    B: Someterse a una evaluación clínica completa por adicción al alcohol o a las
      drogas.
    C: Entregar su vehículo al estado de inmediato.
    D: Pagar solo un pequeño recargo en su registro.
  answer: B
  explanation: La ley de Pensilvania exige que los infractores por DUI se sometan
    a una evaluación de la CRN (Red de Informes Judiciales) y, según los resultados
    y el nivel de la infracción, es posible que se requiera una evaluación clínica
    completa de drogas y alcohol.
- id: 133
  category: alcohol_drugs_health
  question: Según la ley de "Consentimiento Implícito" (Implied Consent) de Pensilvania,
    ¿qué sucede si se niega a realizarse una prueba química (sangre, aliento u orina)
    cuando lo solicita un oficial?
  choices:
    A: Su licencia será suspendida por al menos 12 meses.
    B: Se le multará con $50 y se le permitirá conducir a casa.
    C: Su licencia será suspendida por 30 días.
    D: Nada, siempre que sea su primera infracción.
  answer: A
  explanation: Al conducir en Pensilvania, usted otorga su consentimiento implícito
    para las pruebas químicas. La negativa resulta en una suspensión automática de
    la licencia por 12 meses para una primera infracción, independientemente de si
    luego es condenado por DUI.
- id: 134
  category: alcohol_drugs_health
  question: Pensilvania utiliza un sistema de sanciones por DUI de tres niveles. ¿Qué
    rango de BAC se clasifica como el nivel de "Tasa más alta de alcohol" (Highest
    Rate of Alcohol)?
  choices:
    A: 0.08% a 0.099%
    B: 0.10% a 0.159%
    C: 0.16% o más
    D: 0.02% a 0.079%
  answer: C
  explanation: Pensilvania clasifica un BAC de 0.16% o más como la "Tasa más alta
    de alcohol", la cual conlleva las sanciones más severas.
- id: 135
  category: alcohol_drugs_health
  question: 'En Pensilvania, se considera que un conductor comercial (titular de una
    CDL) conduce bajo los efectos del alcohol (DUI) si su BAC es igual o superior
    a:'
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: Los conductores comerciales en Pensilvania están sujetos a un estándar
    más estricto y se considera que cometen un DUI con un BAC de 0.04% o más mientras
    operan un vehículo comercial.
- id: 136
  category: alcohol_drugs_health
  question: La ley de Pensilvania exige que los médicos informen al PennDOT sobre
    cualquier paciente de 15 años o más que haya sido diagnosticado con una afección
    que pueda afectar su capacidad para conducir, ¿dentro de cuántos días?
  choices:
    A: 5 días
    B: 10 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Los médicos deben informar al PennDOT sobre los pacientes con afecciones
    que podrían afectar la conducción (como epilepsia o diabetes inestable) dentro
    de los 10 días posteriores al diagnóstico.
- id: 137
  category: alcohol_drugs_health
  question: Si es condenado por una primera infracción de DUI en el nivel de "Tasa
    alta" (BAC de 0.10% a 0.159%), ¿por cuánto tiempo se suspenderá su licencia de
    conducir de Pensilvania?
  choices:
    A: Sin suspensión, solo una multa
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: C
  explanation: Una primera infracción de DUI en la "Tasa alta" (0.10% - 0.159%) resulta
    en una suspensión obligatoria de la licencia por 12 meses.
- id: 138
  category: alcohol_drugs_health
  question: ¿Qué prohíbe la "Ley de envases abiertos" (Open Container Law) de Pensilvania?
  choices:
    A: Solo que el conductor beba alcohol mientras conduce.
    B: Solo que el conductor tenga una bebida alcohólica abierta en el área de pasajeros.
    C: Que tanto el conductor como los pasajeros tengan una bebida alcohólica abierta
      en el área de pasajeros.
    D: Poseer cualquier tipo de alcohol en el automóvil, incluso si está sellado.
  answer: C
  explanation: La ley de Pensilvania prohíbe que tanto el conductor como todos los
    pasajeros posean un envase de bebida alcohólica abierto en el área de pasajeros
    de un vehículo en una vía pública.
- id: 139
  category: alcohol_drugs_health
  question: ¿Cuál es el tiempo mínimo de cárcel por una condena de DUI por primera
    vez en el nivel de "Tasa más alta" (BAC de 0.16% o más) en Pensilvania?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 10 días
  answer: C
  explanation: Una primera infracción de DUI en el nivel de "Tasa más alta" conlleva
    un mínimo obligatorio de 72 horas consecutivas en la cárcel.
- id: 140
  category: alcohol_drugs_health
  question: Si un conductor de Pensilvania tiene una afección médica que causa una
    pérdida del conocimiento (como una convulsión), ¿por cuánto tiempo debe estar
    generalmente libre de convulsiones antes de poder volver a conducir?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Las regulaciones del PennDOT generalmente requieren que una persona
    con una afección que cause pérdida del conocimiento esté libre de convulsiones
    durante al menos 6 meses antes de que se le restituyan los privilegios de conducir.
- id: 141
  category: alcohol_drugs_health
  question: En Pennsylvania, el programa 'ARD' suele estar disponible para quienes
    cometen una infracción por DUI por primera vez. ¿Qué significan las siglas ARD?
  choices:
    A: Alcohol Rehabilitation Department (Departamento de Rehabilitación de Alcohol)
    B: Automated Roadway Detection (Detección Automatizada de Carreteras)
    C: Accelerated Rehabilitative Disposition (Disposición Rehabilitadora Acelerada)
    D: Advanced Roadside Discipline (Disciplina Avanzada en Carretera)
  answer: C
  explanation: ARD significa Accelerated Rehabilitative Disposition (Disposición Rehabilitadora
    Acelerada). Es un programa para infractores primerizos no violentos que puede
    llevar a la desestimación de los cargos tras completarlo con éxito.
- id: 142
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los medicamentos
    recetados o de venta libre y la conducción en Pennsylvania?
  choices:
    A: Siempre es legal usarlos mientras se conduce porque no son 'drogas callejeras'.
    B: Solo se le puede acusar de DUI si toma más de la dosis recomendada.
    C: Si un medicamento afecta su capacidad para conducir de manera segura, puede
      ser acusado de DUI.
    D: Solo los medicamentos con una etiqueta de 'advertencia' pueden dar lugar a
      un DUI.
  answer: C
  explanation: En Pennsylvania, usted puede ser condenado por DUI si cualquier droga
    o medicamento (legal o ilegal) afecta su capacidad para operar un vehículo motorizado
    de manera segura.
- id: 143
  category: alcohol_drugs_health
  question: Si un conductor menor de 21 años es condenado por DUI por primera vez
    en Pennsylvania, ¿cuál es el período de suspensión obligatoria de la licencia?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 18 meses
  answer: C
  explanation: Una primera condena por DUI para un menor (menor de 21 años) en Pennsylvania
    resulta en una suspensión obligatoria de la licencia de 12 meses.
- id: 144
  category: penalties_and_points
  question: Según la ley de Pennsylvania, ¿cuál es el período de suspensión obligatoria
    de la licencia por negarse por primera vez a someterse a una prueba química (aliento,
    sangre u orina) por DUI?
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: B
  explanation: Bajo la ley de Consentimiento Implícito de Pennsylvania, si usted se
    niega a realizarse una prueba química, su privilegio de conducir será suspendido
    por al menos 12 meses.
- id: 145
  category: penalties_and_points
  question: Cuando el registro de un conductor de Pennsylvania alcanza los 6 puntos
    por primera vez, ¿qué acción requiere el PennDOT?
  choices:
    A: Una suspensión automática de la licencia por 15 días
    B: Una audiencia departamental obligatoria
    C: El conductor debe realizar un examen escrito especial sobre puntos
    D: El conductor debe completar un curso de conducción segura de 4 horas
  answer: C
  explanation: Cuando el registro de cualquier persona muestra por primera vez un
    total de 6 puntos, recibirá una notificación para realizar un examen escrito especial
    sobre puntos. Tienen 30 días para aprobarlo o se les suspenderá la licencia.
- id: 146
  category: penalties_and_points
  question: En Pennsylvania, si se le condena por exceso de velocidad de 11 a 15 millas
    por hora sobre el límite de velocidad establecido, ¿cuántos puntos se añadirán
    a su registro?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: Exceder el límite de velocidad de 11 a 15 mph resulta en 3 puntos.
    Excederlo de 6 a 10 mph resulta en 2 puntos, y de 16 a 25 mph resulta en 4 puntos.
- id: 147
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor de Pennsylvania que es condenado
    por exceso de velocidad de 11 mph o más sobre el límite en una zona de obras activa?
  choices:
    A: Solo una multa de $500
    B: Una suspensión de la licencia de 15 días
    C: Una suspensión de la licencia de 30 de días
    D: El vehículo es confiscado por 48 horas
  answer: B
  explanation: En Pennsylvania, si se le condena por exceso de velocidad de 11 mph
    o más sobre el límite en una zona de obras activa, su privilegio de conducir será
    suspendido por 15 días.
- id: 148
  category: penalties_and_points
  question: Si el registro de un conductor de Pennsylvania alcanza los 11 puntos o
    más, ¿cuál es la consecuencia?
  choices:
    A: Una audiencia departamental obligatoria
    B: Una multa de $1,000
    C: Suspensión automática de la licencia
    D: El conductor debe volver a realizar el examen de conducir
  answer: C
  explanation: Cuando cualquier registro de conducción alcanza los 11 puntos o más,
    la licencia del conductor será suspendida automáticamente. La duración de la suspensión
    depende de cuántas veces haya sido suspendida anteriormente.
- id: 149
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a un conductor de Pennsylvania condenado por
    'Seguir demasiado de cerca' (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: Una condena por 'Seguir demasiado de cerca' resulta en la adición de
    3 puntos al registro de conducción de Pennsylvania.
- id: 150
  category: penalties_and_points
  question: En Pennsylvania, si no mantiene la responsabilidad financiera (seguro)
    de su vehículo por más de 31 días, ¿cuál es la sanción?
  choices:
    A: Solo una multa de $100
    B: Una suspensión de 3 meses del registro de su vehículo y de su licencia de conducir
    C: Una suspensión de 6 meses únicamente de su licencia de conducir
    D: Revocación permanente de su licencia
  answer: B
  explanation: Si el PennDOT determina que usted ha operado su vehículo sin seguro
    por más de 31 días, el registro de su vehículo y su licencia de conducir serán
    suspendidos por 3 meses.
- id: 151
  category: penalties_and_points
  question: ¿Si un conductor de Pennsylvania es condenado por 'Rebase indebido en
    una colina', cuántos puntos se añaden a su historial?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: C
  explanation: El rebase indebido en una colina se considera una infracción de seguridad
    grave y resulta en 4 puntos en el historial de conducción.
- id: 152
  category: penalties_and_points
  question: Además de los puntos y la suspensión, ¿cuál es la multa obligatoria por
    no detenerse ante un autobús escolar con las luces rojas intermitentes en Pennsylvania?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: La ley exige una multa obligatoria de $250 por no detenerse ante un
    autobús escolar con sus luces rojas intermitentes y el brazo de parada extendido.
- id: 153
  category: penalties_and_points
  question: Un conductor de Pennsylvania condenado por 'Huir o intentar eludir a un
    oficial de policía' se enfrenta a ¿cuál de las siguientes sanciones de licencia?
  choices:
    A: Suspensión de 6 meses
    B: Suspensión de 1 año
    C: Suspensión de 2 años
    D: 5 puntos y ninguna suspensión
  answer: B
  explanation: Huir o intentar eludir a un oficial de policía es una infracción grave
    que resulta en una suspensión de 1 año de los privilegios de conducir.
- id: 154
  category: penalties_and_points
  question: En Pennsylvania, ¿cuántos puntos se asignan por 'No ceder el paso a un
    vehículo de emergencia'?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: No ceder el paso a un vehículo de emergencia (como una ambulancia o
    un camión de bomberos) resulta en 3 puntos en su historial de conducción de Pennsylvania.
- id: 155
  category: penalties_and_points
  question: Si el historial de un conductor de Pennsylvania alcanza los 6 puntos por
    segunda vez, se le requerirá asistir a una audiencia departamental. ¿Qué puede
    suceder si no asiste a esta audiencia?
  choices:
    A: Su licencia será suspendida por 60 días
    B: Su licencia será suspendida hasta que asista a la audiencia
    C: Se le multará con $1,000
    D: Sus puntos se duplicarán automáticamente
  answer: B
  explanation: Si un conductor no asiste a una audiencia departamental requerida por
    acumulación de puntos, su privilegio de conducir será suspendido hasta que asista
    a la audiencia.
- id: 156
  category: penalties_and_points
  question: Según la ley de Pennsylvania, ¿cuál es el límite de contenido de alcohol
    en sangre (BAC) para que una persona menor de 21 años sea acusada de conducir
    bajo los efectos del alcohol (DUI)?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Pennsylvania tiene una política de 'Tolerancia Cero' para menores.
    Se considera que un conductor menor de 21 años conduce bajo los efectos del alcohol
    (DUI) si su BAC es de 0.02% o superior.
- id: 157
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por 'Rebase indebido' en un historial de conducción
    de Pennsylvania?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: El rebase indebido es una infracción de 3 puntos en el sistema de puntos
    de Pennsylvania.
- id: 158
  category: penalties_and_points
  question: ¿La licencia de conducir de Pennsylvania se suspende automáticamente si
    el conductor acumula un total de cuántos puntos?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 11 puntos
    D: 15 puntos
  answer: C
  explanation: Cuando el historial de conducción de cualquier persona alcanza los
    11 puntos o más, su licencia será suspendida automáticamente.
- id: 159
  category: sharing_the_road
  question: La ley 'Move Over' de Pennsylvania (Ley Steer Clear) requiere que los
    conductores hagan ¿qué al acercarse a un área de respuesta de emergencia?
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Aumentar la velocidad para pasar el área rápidamente
    C: Cambiarse a un carril que no esté adyacente al área de respuesta de emergencia,
      si es posible
    D: Encender las luces de emergencia y mantener la velocidad
  answer: C
  explanation: La Ley Steer Clear requiere que los conductores se muevan a un carril
    que no esté al lado de un área de respuesta de emergencia. Si no pueden cambiarse
    de carril de manera segura, deben reducir la velocidad a una que sea segura y
    prudente.
- id: 160
  category: sharing_the_road
  question: Al rebasar a un ciclista en Pennsylvania, ¿cuál es la cantidad mínima
    de espacio de 'amortiguación' (buffer) que debe dejar entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: La ley de Pennsylvania exige que los automovilistas dejen al menos
    cuatro pies de espacio de 'amortiguación' (buffer) al rebasar una bicicleta a
    una velocidad cuidadosa y reducida.
- id: 161
  category: sharing_the_road
  question: 'Según la ley de Pennsylvania, usted NO tiene que detenerse ante un autobús
    escolar con luces rojas intermitentes si:'
  choices:
    A: El autobús está en el lado opuesto de una carretera separada por una barrera
      física, como una franja divisoria (mediana)
    B: El autobús está detenido en una zona residencial
    C: Usted viaja en la misma dirección pero hay cuatro carriles de circulación
    D: El conductor del autobús le hace señas para que pase
  answer: A
  explanation: Los conductores no necesitan detenerse ante un autobús escolar si se
    encuentran en el lado opuesto de una carretera dividida donde los carriles están
    separados por una barrera física, como un muro de hormigón o una mediana de césped.
- id: 162
  category: sharing_the_road
  question: En Pennsylvania, los operadores de motocicletas deben usar casco A MENOS
    QUE cumplan con ¿cuál de los siguientes criterios?
  choices:
    A: Tienen más de 18 años y cuentan con 1 año de experiencia
    B: Tienen al menos 21 años y han tenido la licencia durante al menos 2 años completos
      o han completado un curso de seguridad
    C: Están conduciendo en una carretera con un límite de velocidad inferior a 35
      mph
    D: Solo llevan a un pasajero
  answer: B
  explanation: La ley de Pennsylvania permite que los operadores de motocicletas de
    21 años o más conduzcan sin casco si han tenido la licencia durante al menos dos
    años o si han completado un curso de seguridad para motociclistas aprobado por
    PennDOT.
- id: 163
  category: sharing_the_road
  question: 'Cuando sigue a un camión grande, si no puede ver los espejos laterales
    del conductor del camión, usted está:'
  choices:
    A: En una buena posición para rebasar
    B: En la 'No-Zone' (punto ciego) del camión
    C: Seguro porque el conductor del camión puede verlo en el espejo retrovisor
    D: Siguiendo a una distancia segura
  answer: B
  explanation: Los camiones grandes tienen puntos ciegos significativos conocidos
    como 'No-Zones'. Si no puede ver la cara del conductor en sus espejos laterales,
    él no puede verlo a usted.
- id: 164
  category: sharing_the_road
  question: En Pennsylvania, ¿cuál es la distancia mínima que debe mantener al seguir
    a un vehículo de emergencia con sus luces y sirenas activas?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Es ilegal en Pennsylvania seguir a un vehículo de emergencia (como
    un camión de bomberos o una ambulancia) a menos de 500 pies cuando este responde
    a una emergencia.
- id: 165
  category: sharing_the_road
  question: 'Cuando vea a un peatón con un bastón blanco o un perro guía en una intersección,
    usted debe:'
  choices:
    A: Tocar la bocina para avisarle que usted está allí
    B: Reducir la velocidad y proceder con precaución
    C: Detenerse y ceder el paso
    D: Rodearlo si hay suficiente espacio
  answer: C
  explanation: La ley de Pennsylvania exige que los conductores se detengan por completo
    y cedan el paso a cualquier peatón ciego que lleve un bastón blanco o utilice
    un perro guía.
- id: 166
  category: sharing_the_road
  question: 'Al acercarse a un vehículo de tracción animal en el ''país Amish'' o
    en zonas rurales de Pennsylvania, usted debe:'
  choices:
    A: Tocar la bocina para advertir al conductor que va a pasar
    B: Reducir la velocidad y rebasar solo cuando sea seguro, evitando ruidos repentinos
    C: Encender las luces altas para señalar su presencia
    D: Pasar lo más rápido posible para no estorbar
  answer: B
  explanation: Los conductores deben ser cautelosos cerca de los vehículos tirados
    por caballos. Los caballos pueden asustarse con ruidos fuertes como las bocinas
    o los vehículos que se mueven rápido; reduzca la velocidad y dales suficiente
    espacio.
- id: 167
  category: sharing_the_road
  question: En Pennsylvania, ¿cuántas motocicletas pueden circular legalmente una
    al lado de la otra en un solo carril?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Ninguna; deben circular de forma escalonada
  answer: B
  explanation: La ley de Pennsylvania permite que dos motocicletas circulen una al
    lado de la otra (en paralelo) en un solo carril de circulación.
- id: 168
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el camión puede:'
  choices:
    A: Permanecer completamente en el carril derecho
    B: Necesitar abrirse hacia la izquierda para no subir al bordillo (acera)
    C: Detenerse y esperar a que todo el tráfico se despeje antes de girar
    D: Girar solo desde el carril izquierdo
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para hacer un giro a la derecha sin golpear el bordillo u otros objetos. Los conductores
    nunca deben intentar meterse entre un camión que gira y el bordillo.
- id: 169
  category: sharing_the_road
  question: En una intersección donde no hay pasos de peatones marcados, ¿cuál es
    la regla con respecto a los peatones?
  choices:
    A: Los peatones deben ceder el paso a todos los vehículos
    B: Los vehículos tienen el derecho de paso porque no hay un camino marcado
    C: Cada intersección se considera un paso de peatones 'legal' y los conductores
      deben ceder el paso a los peatones
    D: A los peatones solo se les permite cruzar en los semáforos
  answer: C
  explanation: En Pennsylvania, los peatones tienen el derecho de paso en todas las
    intersecciones, ya sea que los pasos de peatones estén marcados o no.
- id: 170
  category: sharing_the_road
  question: 'Si conduce detrás de una motocicleta, debe dejar:'
  choices:
    A: Menos distancia de seguimiento que a un automóvil porque se detienen más rápido
    B: La misma distancia de seguimiento que a un automóvil
    C: Al menos una distancia de seguimiento de 4 segundos
    D: Una distancia de seguimiento de 1 segundo
  answer: C
  explanation: El manual del conductor de Pennsylvania recomienda una distancia de
    seguimiento de al menos cuatro segundos cuando se circula detrás de una motocicleta
    para tener en cuenta su capacidad de detenerse rápidamente y los peligros de la
    carretera que podrían afectarlas de manera diferente.
- id: 171
  category: sharing_the_road
  question: 'Según la ley de Pensilvania, un ciclista en la calzada es:'
  choices:
    A: Obligado a circular por la acera
    B: Considerado un operador de vehículo y debe obedecer todas las leyes de tránsito
    C: No se le permite circular en carreteras con límites de velocidad superiores
      a 25 mph
    D: Obligado a circular en sentido contrario al flujo del tráfico
  answer: B
  explanation: En Pensilvania, las bicicletas se consideran vehículos. Los ciclistas
    tienen los mismos derechos y deben obedecer las mismas reglas de la carretera
    que los conductores de vehículos motorizados, lo que incluye detenerse ante los
    semáforos en rojo y las señales de alto.
- id: 172
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene en el lado opuesto de una autopista
    separada por una barrera física (como una mediana de concreto o un guardarraíl),
    ¿qué debe hacer un conductor de Pensilvania?
  choices:
    A: Detenerse al menos a 10 pies de distancia del autobús.
    B: Detenerse solo si hay niños cruzando en ese momento.
    C: Reducir la velocidad a 15 mph y proceder con precaución.
    D: No es obligatorio detenerse.
  answer: D
  explanation: En Pensilvania, no es necesario detenerse ante un autobús escolar si
    se encuentra en el lado opuesto de una autopista que está separada por una barrera
    física, como una franja mediana o un guardarraíl.
- id: 173
  category: sharing_the_road
  question: Según la ley 'Steer Clear' (Moverse a un lado) de Pensilvania, ¿qué debe
    hacer al acercarse a un vehículo de emergencia con sus luces intermitentes encendidas
    que está detenido a un lado de la carretera?
  choices:
    A: Mantener la velocidad pero cambiarse al carril izquierdo.
    B: Moverse a un carril que no sea adyacente al vehículo de emergencia, si es posible.
    C: Detenerse inmediatamente en su carril de circulación.
    D: Tocar la bocina para alertar a los trabajadores de emergencia de su presencia.
  answer: B
  explanation: La ley Steer Clear de Pensilvania exige que los conductores se muevan
    a un carril que no sea adyacente al área de respuesta de emergencia. Si no pueden
    cambiarse de carril de manera segura, deben reducir la velocidad a una que sea
    segura y menor que el límite establecido.
- id: 174
  category: sharing_the_road
  question: En Pensilvania, si usted sigue a una motocicleta, ¿cuál es la distancia
    de seguimiento recomendada para garantizar la seguridad?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: El Manual del Conductor de Pensilvania recomienda una distancia de
    seguimiento de al menos cuatro segundos cuando se sigue a una motocicleta para
    permitir paradas repentinas o cambios en las condiciones de la carretera.
- id: 175
  category: sharing_the_road
  question: Según la ley de Pensilvania, ¿cuál de las siguientes afirmaciones es verdadera
    con respecto a la responsabilidad de un conductor hacia un peatón ciego que lleva
    un bastón blanco o utiliza un perro guía?
  choices:
    A: Debe ceder el paso solo si se encuentran en un cruce de peatones marcado.
    B: Debe ceder el derecho de paso, incluso si no están en un cruce de peatones.
    C: Debe tocar la bocina para avisarles que está pasando.
    D: Ellos deben ceder el paso a los vehículos motorizados entre intersecciones.
  answer: B
  explanation: La ley de Pensilvania exige que los conductores cedan el derecho de
    paso a cualquier peatón total o parcialmente ciego que lleve un bastón blanco
    o utilice un perro guía, independientemente de por dónde esté cruzando.
- id: 176
  category: sharing_the_road
  question: Los camiones grandes tienen 'Zonas Prohibidas' (No-Zones) donde el conductor
    no puede ver su vehículo. ¿Dónde se encuentra la 'Zona Prohibida' más grande en
    un camión con remolque?
  choices:
    A: Directamente detrás del remolque.
    B: Directamente delante de la cabina.
    C: En el lado izquierdo de la cabina.
    D: En el lado derecho del camión.
  answer: D
  explanation: Aunque los camiones tienen puntos ciegos en todos los lados, el punto
    ciego del lado derecho es el más grande y peligroso, y se extiende a través de
    varios carriles.
- id: 177
  category: sharing_the_road
  question: En Pensilvania, ¿cuál es la multa máxima por una primera infracción de
    la ley 'Steer Clear' si no se produjeron lesiones?
  choices:
    A: Hasta $100
    B: Hasta $250
    C: Hasta $500
    D: Hasta $1,000
  answer: C
  explanation: Una primera infracción de la ley Steer Clear de Pensilvania (Ley de
    Moverse a un Lado) puede resultar en una multa de hasta $500.
- id: 178
  category: sharing_the_road
  question: 'En Pensilvania, generalmente se requiere que los ciclistas:'
  choices:
    A: Circulen por la acera en todo momento.
    B: Circulen en sentido contrario al flujo del tráfico.
    C: Circulen en la misma dirección que los vehículos motorizados.
    D: Cedan el paso a todos los vehículos motorizados en todas las intersecciones.
  answer: C
  explanation: En Pensilvania, las bicicletas se consideran vehículos y deben operarse
    en la misma dirección que el tráfico de vehículos motorizados.
- id: 179
  category: sharing_the_road
  question: 'Si se detiene detrás de un camión en una intersección en una pendiente
    ascendente, usted debe:'
  choices:
    A: Detenerse muy cerca del camión para ahorrar espacio.
    B: Dejar espacio en caso de que el camión retroceda ligeramente al arrancar.
    C: Mantener las luces altas encendidas para que el conductor del camión pueda
      verlo.
    D: Tocar la bocina cuando el semáforo cambie a verde.
  answer: B
  explanation: Los vehículos grandes pueden rodar ligeramente hacia atrás cuando el
    conductor quita el pie del freno para accionar el embrague o el acelerador en
    una colina.
- id: 180
  category: sharing_the_road
  question: 'Cuando un vehículo de emergencia que utiliza sirenas y/o luces intermitentes
    se le acerca por detrás en una carretera estándar de dos carriles, usted debe:'
  choices:
    A: Detenerse exactamente donde está.
    B: Aumentar la velocidad para apartarse del camino.
    C: Orillarse al borde derecho de la carretera y detenerse.
    D: Orillarse al borde izquierdo de la carretera y detenerse.
  answer: C
  explanation: La ley de Pensilvania exige que los conductores se orillen hacia el
    borde derecho o la acera de la carretera, despejando cualquier intersección, y
    se detengan hasta que el vehículo de emergencia haya pasado.
- id: 181
  category: sharing_the_road
  question: 'En Pensilvania, puede adelantar a una bicicleta en una ''zona de no adelantar''
    si:'
  choices:
    A: El ciclista le indica con la mano que pase.
    B: Es seguro hacerlo y mantiene la distancia de seguridad de 4 pies.
    C: Usted viaja al menos 20 mph más rápido que la bicicleta.
    D: Adelantar a una bicicleta en una zona de no adelantar nunca es legal.
  answer: B
  explanation: La ley de Pensilvania permite a los automovilistas adelantar a una
    bicicleta en una zona de no adelantar si se puede hacer de manera segura y manteniendo
    la distancia requerida de 4 pies.
- id: 182
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una causa común de accidentes que involucran
    motocicletas en las intersecciones?
  choices:
    A: Motocicletas que se detienen demasiado rápido.
    B: Motocicletas que tienen mejor tracción que los autos.
    C: Un conductor que gira a la izquierda frente a una motocicleta que se aproxima.
    D: Motocicletas que no pueden usar las señales de giro.
  answer: C
  explanation: La causa más común de accidentes entre autos y motocicletas es un conductor
    que gira a la izquierda frente a una motocicleta que se aproxima porque no vio
    el vehículo más pequeño o calculó mal su velocidad.
- id: 183
  category: vehicle_information
  question: Según la ley de Pensilvania, ¿cuándo deben encenderse las luces delanteras
    de su vehículo en relación con los limpiaparabrisas?
  choices:
    A: Solo si está oscuro afuera
    B: Solo cuando se usan los limpiaparabrisas en la configuración 'alta'
    C: Siempre que los limpiaparabrisas estén en uso continuo o intermitente debido
      a la precipitación
    D: Solo cuando se conduce por la autopista de peaje de Pensilvania (Pennsylvania
      Turnpike)
  answer: C
  explanation: La ley de Pensilvania exige que los automovilistas enciendan sus luces
    delanteras siempre que sus limpiaparabrisas estén en uso continuo o intermitente
    debido a la lluvia, nieve o aguanieve.
- id: 184
  category: vehicle_information
  question: 'En Pensilvania, un neumático se considera inseguro si la banda de rodadura
    está cortada o desgastada a una profundidad de menos de:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Las normas de inspección de seguridad de Pensilvania establecen que
    un neumático es inseguro si tiene una profundidad de banda de rodadura de menos
    de 2/32 de pulgada.
- id: 185
  category: vehicle_information
  question: Según la 'Ley de Christine' (Acta 90) de Pensilvania, ¿qué debe hacer
    un conductor antes de operar un vehículo después de una nevada?
  choices:
    A: Encender las luces de emergencia durante las primeras 5 millas
    B: Esperar al menos 24 horas para que la nieve se derrita
    C: Hacer esfuerzos razonables para quitar el hielo o la nieve acumulados del capó,
      el maletero y el techo
    D: Solo limpiar el lado del conductor del parabrisas
  answer: C
  explanation: El Acta 90 exige que los conductores retiren el hielo o la nieve acumulados
    de sus vehículos dentro de las 24 horas posteriores a una tormenta, o antes de
    conducir si la acumulación representa una amenaza para los demás.
- id: 186
  category: vehicle_information
  question: La ley de Pensilvania exige que los niños menores de qué edad estén asegurados
    en un sistema de retención infantil orientado hacia atrás.
  choices:
    A: Menores de 1 año de edad
    B: Menores de 2 años de edad
    C: Menores de 4 años de edad
    D: Menores de 5 años de edad
  answer: B
  explanation: La ley de Pensilvania se actualizó para exigir que los niños permanezcan
    en un asiento de auto orientado hacia atrás hasta que tengan 2 años de edad o
    hasta que alcancen el límite máximo de peso o altura del asiento.
- id: 187
  category: vehicle_information
  question: Para la mayoría de los autos de pasajeros en Pensilvania, ¿cuál es el
    límite legal de transmitancia de luz del polarizado de las ventanas laterales?
  choices:
    A: Debe pasar al menos el 25% de la luz
    B: Debe pasar al menos el 35% de la luz
    C: Debe pasar al menos el 50% de la luz
    D: Debe pasar al menos el 70% de la luz
  answer: D
  explanation: Las regulaciones de Pensilvania generalmente requieren que el polarizado
    de las ventanas en los autos de pasajeros permita que pase al menos el 70% de
    la luz (70% de transmitancia de luz).
- id: 188
  category: vehicle_information
  question: 'En Pensilvania, la bocina de su vehículo debe ser audible desde una distancia
    de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: Las normas de equipamiento de vehículos de Pensilvania exigen que se
    escuche una bocina a una distancia no inferior a 200 pies.
- id: 189
  category: vehicle_information
  question: En Pensilvania, si la carga de su vehículo se extiende más de ____ más
    allá de la parte trasera de la carrocería, se debe mostrar una bandera o tela
    roja durante el día.
  choices:
    A: 2 pies
    B: 4 pies
    C: 6 pies
    D: 8 pies
  answer: B
  explanation: Según el Manual del Conductor de PA, si una carga se extiende más de
    cuatro pies más allá de la parte trasera del vehículo, se debe colocar una bandera
    o tela roja cuadrada de 12 pulgadas al final de la carga.
- id: 190
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos NO es obligatorio para que un vehículo
    pase una inspección de seguridad en Pensilvania?
  choices:
    A: Limpiaparabrisas que funcionen
    B: Freno de estacionamiento funcional
    C: Sistema de aire acondicionado
    D: Velocímetro funcional
  answer: C
  explanation: Si bien los limpiaparabrisas, los frenos de estacionamiento y los velocímetros
    son elementos críticos de seguridad que se revisan durante la inspección, el sistema
    de aire acondicionado no es un requisito de seguridad.
- id: 191
  category: vehicle_information
  question: ¿En Pensilvania, cuándo se le permite usar las luces de emergencia mientras
    conduce por una autopista?
  choices:
    A: Siempre que tenga prisa
    B: Cuando su vehículo viaje a una velocidad inferior a 25 mph
    C: Para indicar que va a girar a la izquierda
    D: Cuando esté lloviendo ligeramente
  answer: B
  explanation: La ley de Pensilvania permite el uso de luces de emergencia cuando
    un vehículo viaja a una velocidad inferior a 25 mph, o cuando el vehículo forma
    parte de un cortejo fúnebre.
- id: 192
  category: vehicle_information
  question: 'Según la ley de Pensilvania, la placa de matrícula trasera debe estar
    iluminada para que sea visible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Pensilvania exige que la placa de matrícula trasera esté
    iluminada por una luz blanca para que sea claramente legible desde una distancia
    de 50 pies hacia atrás.
- id: 193
  category: vehicle_information
  question: ¿En Pensilvania, cuál es la multa máxima para un conductor que no quita
    la nieve o el hielo de su vehículo que posteriormente cae y causa lesiones graves
    o la muerte a otra persona?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $5,000
  answer: C
  explanation: Bajo la Ley 90 (Ley de Christine), si la nieve o el hielo caen de un
    vehículo en movimiento y golpean a otro vehículo o peatón causando lesiones corporales
    graves o la muerte, el conductor puede ser multado con hasta $1,500.
- id: 194
  category: vehicle_information
  question: 'Según la ley de Pensilvania, debe encender los faros delanteros siempre
    que utilice los limpiaparabrisas de forma continua o intermitente debido al clima.
    Esto se conoce como la:'
  choices:
    A: Ley de Limpiaparabrisas y Luces (Wiper-Light Law)
    B: Ley de Visibilidad
    C: Regla de Vista Segura
    D: Mandato de Clima Inclemente
  answer: A
  explanation: La 'Ley de Limpiaparabrisas y Luces' (Wiper-Light Law) de Pensilvania
    exige que los automovilistas enciendan sus faros delanteros siempre que sus limpiaparabrisas
    estén en uso debido a la lluvia, nieve o aguanieve.
- id: 195
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para que un vehículo de pasajeros pase la inspección en Pensilvania?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: En Pensilvania, los neumáticos se consideran inseguros y no pasarán
    la inspección si la profundidad de la banda de rodadura es inferior a 2/32 de
    pulgada.
- id: 196
  category: vehicle_information
  question: Según la 'Ley de Christine' (Ley 90) de Pensilvania, ¿cuáles son las posibles
    consecuencias si la nieve o el hielo caen de su vehículo y causan lesiones graves
    o la muerte a otra persona?
  choices:
    A: Solo una advertencia verbal
    B: Una multa de $50
    C: Una multa que oscila entre $200 y $1,500
    D: Revocación obligatoria de la licencia por 5 años
  answer: C
  explanation: La Ley 90 permite a la policía multar a los conductores con montos
    de $200 a $1,500 si la nieve o el hielo caen de su vehículo y causan lesiones
    corporales graves o la muerte a otra persona.
- id: 197
  category: vehicle_information
  question: ¿En Pensilvania, el tintado de ventanas en el parabrisas y las ventanas
    laterales delanteras de un automóvil de pasajeros debe permitir que pase al menos
    qué porcentaje de luz?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: 90%
  answer: C
  explanation: La ley de Pensilvania generalmente exige que el tintado de ventanas
    en el parabrisas y las ventanas laterales delanteras de los automóviles de pasajeros
    permita al menos un 70% de transmisión de luz.
- id: 198
  category: vehicle_information
  question: ¿En Pensilvania, se requiere una inspección de emisiones para los vehículos
    registrados en cuántos de los 67 condados del estado?
  choices:
    A: Los 67 condados
    B: Solo 5 condados
    C: 25 condados
    D: 42 condados
  answer: C
  explanation: Pensilvania requiere inspecciones de emisiones para los vehículos registrados
    en 25 condados específicos, principalmente aquellos en regiones más urbanas o
    de alto tráfico.
- id: 199
  category: vehicle_information
  question: 'Si la visión hacia atrás de su vehículo está obstruida por un remolque
    o la carga que transporta, la ley de Pensilvania exige que tenga:'
  choices:
    A: Un pasajero que actúe como observador
    B: Solo un sistema de cámaras
    C: Espejos laterales dobles (izquierdo y derecho)
    D: Un espejo interior de gran angular
  answer: C
  explanation: Si el espejo retrovisor interior está obstruido, la ley de Pensilvania
    exige que el vehículo esté equipado con un espejo retrovisor exterior tanto a
    la izquierda como a la derecha.
- id: 200
  category: vehicle_information
  question: 'La ley de Pensilvania exige que todo vehículo motorizado esté equipado
    con una bocina que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: El Código de Vehículos de Pensilvania exige que la bocina de un vehículo
    debe ser audible en condiciones normales desde una distancia no menor a 200 pies.
- id: 201
  category: vehicle_information
  question: ¿Cuál de las siguientes es una modificación de equipo ilegal en Pensilvania?
  choices:
    A: Instalar un enganche de remolque
    B: Usar un recorte de silenciador (muffler cutout) o una derivación (bypass)
    C: Reemplazar un volante estándar por uno del mercado de accesorios (con bolsa
      de aire)
    D: Añadir un portaequipajes de techo
  answer: B
  explanation: La ley de Pensilvania prohíbe el uso de recortes de silenciador, derivaciones
    o dispositivos similares que aumenten el ruido o permitan que los gases de escape
    eviten el silenciador.
- id: 202
  category: vehicle_information
  question: 'En Pensilvania, el freno de estacionamiento debe ser capaz de mantener
    el vehículo inmóvil en:'
  choices:
    A: Solo superficies planas
    B: Una pendiente del 10%
    C: Cualquier pendiente (colina) en la que se opere
    D: Solo cuando el motor está en marcha
  answer: C
  explanation: Los estándares de inspección de seguridad de Pensilvania requieren
    que el freno de estacionamiento pueda sostener el vehículo en cualquier pendiente
    en la que se conduzca.
- id: 203
  category: signs_and_signals
  question: Cuando se encuentra con una luz roja intermitente en una intersección
    en Pensilvania, ¿cómo debe responder?
  choices:
    A: Reducir la velocidad y continuar con precaución sin detenerse
    B: Detenerse solo si se aproxima tráfico transversal
    C: Detenerse por completo y continuar solo cuando sea seguro hacerlo
    D: Tratarla como una señal de ceda el paso y reducir la velocidad a 5 mph
  answer: C
  explanation: Una luz roja intermitente tiene el mismo significado que una señal
    de alto (stop). Debe detenerse por completo, mirar a ambos lados y continuar solo
    cuando el camino esté despejado.
- id: 204
  category: signs_and_signals
  question: 'La ley de Pensilvania exige que los conductores enciendan sus faros delanteros
    en las zonas de obras cuando:'
  choices:
    A: Solo cuando está lloviendo o nevando
    B: El sol se ha puesto
    C: Hay señales colocadas que indican 'Los faros deben estar encendidos' (Headlights
      Must Be On)
    D: Están conduciendo a través de cualquier zona de obras activa, independientemente
      de la hora del día
  answer: C
  explanation: En Pensilvania, debe encender los faros delanteros en cualquier zona
    de obras donde haya señales que lo requieran. Esto aumenta la visibilidad para
    los trabajadores y otros conductores.
- id: 205
  category: signs_and_signals
  question: Si las señales de giro de su vehículo no funcionan, ¿cuál es la señal
    manual correcta para indicar un giro a la derecha en Pensilvania?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia arriba en un ángulo de 90 grados
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás
    D: Brazo derecho saludando por la ventana del pasajero
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo y la
    mano izquierdos doblados hacia arriba en un ángulo de 90 grados.
- id: 206
  category: signs_and_signals
  question: ¿Qué indican las líneas amarillas sólidas dobles pintadas en el centro
    de una carretera de Pensilvania?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por el lado derecho
    C: Está prohibido rebasar en ambas direcciones
    D: La carretera es de un solo sentido
  answer: C
  explanation: Las líneas amarillas sólidas dobles significan que no se permite rebasar
    a los vehículos que viajan en cualquier dirección.
- id: 207
  category: signs_and_signals
  question: 'En Pensilvania, una señal de ''Zona de no rebasar'' (No Passing Zone)
    tiene una forma única de banderín (triángulo lateral) y se coloca:'
  choices:
    A: En el lado derecho de la carretera al comienzo de la zona
    B: En el lado izquierdo de la carretera al comienzo de la zona
    C: Por encima del carril central
    D: Cada 500 pies a lo largo de la zona
  answer: B
  explanation: La señal de 'Zona de no rebasar' en forma de banderín se coloca en
    el lado izquierdo de la carretera para proporcionar una advertencia adicional
    a los conductores de que no pueden rebasar.
- id: 208
  category: signs_and_signals
  question: 'Una luz de semáforo amarilla fija en una intersección significa:'
  choices:
    A: Acelerar para despejar la intersección antes de la luz roja
    B: La señal está a punto de cambiar a verde
    C: La señal está a punto de cambiar a roja y debe detenerse si es seguro hacerlo
    D: Usted tiene el derecho de paso sobre el tráfico que gira
  answer: C
  explanation: Una luz amarilla fija advierte que la señal está a punto de cambiar
    a roja. Debe detenerse si puede hacerlo de manera segura; si ya se encuentra en
    la intersección, debe continuar con precaución.
- id: 209
  category: signs_and_signals
  question: ¿Qué forma de señal se utiliza exclusivamente para la advertencia anticipada
    de cruce de ferrocarril en Pensilvania?
  choices:
    A: Diamante
    B: Octágono
    C: Redonda
    D: Pentágono
  answer: C
  explanation: Una señal amarilla redonda con una 'X' negra y las letras 'RR' se utiliza
    como señal de advertencia anticipada para un cruce de ferrocarril.
- id: 210
  category: signs_and_signals
  question: 'Al conducir en una zona escolar de Pensilvania donde las luces están
    parpadeando, el límite de velocidad suele ser:'
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: En Pensilvania, el límite de velocidad en una zona escolar es de 15
    mph cuando las luces parpadean o durante los períodos de tiempo indicados en la
    señal.
- id: 211
  category: signs_and_signals
  question: ¿Qué significa una línea blanca continua pintada en el pavimento entre
    carriles de tráfico que se mueven en la misma dirección?
  choices:
    A: Se requiere que cambie de carril inmediatamente
    B: Se desaconseja el cambio de carril por razones de seguridad
    C: Usted se encuentra en una calle de un solo sentido
    D: El carril está reservado exclusivamente para bicicletas
  answer: B
  explanation: Una línea blanca continua indica que se desaconseja el cambio de carril.
    Los conductores deben permanecer en su carril a menos que sea necesario moverse.
- id: 212
  category: signs_and_signals
  question: En Pensilvania, ¿cuál es el significado de una señal de tráfico con fondo
    rosa fluorescente?
  choices:
    A: Recreación pública y guía escénica
    B: Advertencia de cruce de peatones
    C: Gestión de incidentes (por ejemplo, accidentes de tráfico o inundaciones)
    D: Advertencia de zona escolar
  answer: C
  explanation: Las señales de color rosa fluorescente se utilizan para la gestión
    de incidentes para advertir a los conductores sobre situaciones de emergencia
    temporales, como choques o desastres naturales.
- id: 213
  category: signs_and_signals
  question: 'Para indicar que está disminuyendo la velocidad o deteniéndose mediante
    señales manuales, usted debe:'
  choices:
    A: Extender el brazo izquierdo recto hacia afuera
    B: Extender el brazo izquierdo hacia arriba
    C: Extender el brazo izquierdo hacia abajo con la palma hacia atrás
    D: Mover la mano en movimiento circular
  answer: C
  explanation: La señal manual para reducir la velocidad o detenerse es el brazo izquierdo
    extendido hacia abajo con la palma de la mano hacia atrás.
- id: 214
  category: signs_and_signals
  question: ¿Qué indica una flecha amarilla fija en un semáforo de Pensilvania?
  choices:
    A: Puede girar en la dirección de la flecha después de ceder el paso
    B: El movimiento permitido por la flecha verde está a punto de terminar
    C: Debe detenerse y esperar a un círculo verde
    D: Vehículos de emergencia se aproximan desde esa dirección
  answer: B
  explanation: Una flecha amarilla fija significa que el tiempo de giro 'protegido'
    está terminando. Debe prepararse para detenerse o completar su giro si ya se encuentra
    dentro de la intersección.
- id: 215
  category: signs_and_signals
  question: 'Una señal de cinco lados (pentágono) con forma de casa se utiliza en
    Pensilvania para advertir sobre:'
  choices:
    A: Áreas residenciales
    B: Zonas hospitalarias
    C: Zonas escolares o cruces escolares
    D: Parques públicos
  answer: C
  explanation: La forma de pentágono se reserva exclusivamente para las señales de
    zonas escolares y cruces escolares.
- id: 216
  category: signs_and_signals
  question: 'En Pensilvania, una señal en forma de banderín (pennant) situada en el
    lado izquierdo de la carretera indica:'
  choices:
    A: Una zona escolar
    B: Un cruce de ferrocarril más adelante
    C: Una zona de no rebasar (no pasar)
    D: Un requisito de ceder el paso
  answer: C
  explanation: Según el Manual del Conductor de PennDOT, una señal en forma de banderín
    se coloca en el lado izquierdo de la carretera para marcar el inicio de una zona
    de no rebasar.
- id: 217
  category: signs_and_signals
  question: Cuando ve una señal de 'X' amarilla fija sobre un carril de tráfico en
    Pensilvania, ¿qué significa?
  choices:
    A: El carril es solo para girar
    B: Debe salir de este carril tan pronto como sea seguro hacerlo
    C: El carril está cerrado a todo el tráfico
    D: Puede usar el carril con precaución
  answer: B
  explanation: Una 'X' amarilla fija sobre un carril significa que la dirección del
    carril está a punto de cambiar y usted debe prepararse para abandonar el carril
    de manera segura.
- id: 218
  category: signs_and_signals
  question: Según la ley de Pensilvania, ¿qué debe hacer al acercarse a un semáforo
    en rojo intermitente?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse solo si hay tráfico transversal
    C: Detenerse por completo y proceder solo cuando sea seguro
    D: Ceder el paso al tráfico de la derecha pero no detenerse
  answer: C
  explanation: Una luz roja intermitente tiene el mismo significado que una señal
    de alto (pare). Debe detenerse por completo y proceder solo cuando sea seguro
    hacerlo.
- id: 219
  category: signs_and_signals
  question: 'En Pensilvania, puede girar a la izquierda con luz roja ÚNICAMENTE si
    está girando desde:'
  choices:
    A: Una calle de doble sentido hacia una calle de un solo sentido
    B: Una calle de un solo sentido hacia otra calle de un solo sentido
    C: Una calle de un solo sentido hacia una calle de doble sentido
    D: Cualquier calle, siempre que no haya una señal de 'No girar en rojo'
  answer: B
  explanation: La ley de Pensilvania permite girar a la izquierda en rojo solo cuando
    se gira de una calle de un solo sentido a otra calle de un solo sentido, después
    de detenerse por completo y ceder el paso a los peatones y al resto del tráfico.
- id: 220
  category: signs_and_signals
  question: ¿Qué significa una flecha verde fija que se muestra junto con una luz
    roja en Pensilvania?
  choices:
    A: Debe esperar a que la luz roja cambie a verde antes de girar
    B: Puede proceder en la dirección de la flecha, pero debe ceder el paso a los
      peatones
    C: Tiene un giro 'protegido' y puede proceder en la dirección de la flecha
    D: La flecha verde es una advertencia de que la luz está a punto de ponerse roja
  answer: C
  explanation: Una flecha verde fija significa que puede proceder en la dirección
    que indica la flecha. Este es un giro 'protegido', lo que significa que el tráfico
    que viene en sentido contrario está detenido por una luz roja.
- id: 221
  category: signs_and_signals
  question: ¿Cuál es el color y la forma estándar de una señal de "Advertencia" (Warning)
    en Pensilvania?
  choices:
    A: Octágono rojo y blanco
    B: Diamante amarillo y negro
    C: Rectángulo blanco y negro
    D: Rectángulo verde y blanco
  answer: B
  explanation: Las señales de advertencia en Pensilvania suelen tener forma de diamante
    con fondo amarillo y símbolos o letras en negro.
- id: 222
  category: signs_and_signals
  question: 'En Pensilvania, las líneas amarillas continuas dobles pintadas en el
    centro de la carretera significan:'
  choices:
    A: Se permite adelantar desde cualquier lado
    B: Se permite adelantar solo por la derecha
    C: No se permite adelantar desde ningún lado
    D: Se permite adelantar si la carretera está despejada
  answer: C
  explanation: Las líneas amarillas continuas dobles indican que está prohibido adelantar
    para los vehículos que circulan en cualquier dirección.
- id: 223
  category: signs_and_signals
  question: 'Una línea blanca discontinua en una autopista de varios carriles en Pensilvania
    indica:'
  choices:
    A: El tráfico se mueve en direcciones opuestas
    B: El tráfico se mueve en la misma dirección y se permiten los cambios de carril
    C: El borde de la calzada
    D: Un carril restringido para vehículos de alta ocupación (HOV)
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección. Los conductores pueden cruzar estas líneas para
    cambiar de carril cuando sea seguro hacerlo.
- id: 224
  category: signs_and_signals
  question: 'Al acercarse a una señal de cruce ferroviario (crossbuck) en Pensilvania
    que no tiene señal luminosa, usted debe:'
  choices:
    A: Detenerse por completo siempre
    B: Aumentar la velocidad para cruzar las vías rápidamente
    C: Tratarla como una señal de ceder el paso; reducir la velocidad y prepararse
      para detenerse si se acerca un tren
    D: Ignorarla si no ve un tren
  answer: C
  explanation: Una señal de cruce ferroviario debe tratarse como una señal de ceder
    el paso. Los conductores deben reducir la velocidad, mirar y escuchar si viene
    un tren, y estar preparados para detenerse si se aproxima uno.
- id: 225
  category: signs_and_signals
  question: En Pensilvania, ¿de qué color son las señales que se utilizan para proporcionar
    información sobre zonas de obras y proyectos de mantenimiento?
  choices:
    A: Amarillo
    B: Rosa fluorescente
    C: Naranja
    D: Azul
  answer: C
  explanation: El naranja es el color de fondo estándar para las señales de zonas
    de obras en Pensilvania, indicando áreas de construcción o mantenimiento más adelante.
- id: 226
  category: signs_and_signals
  question: ¿Qué significa un símbolo de diamante blanco pintado en el pavimento de
    un carril en Pensilvania?
  choices:
    A: El carril está reservado para vehículos de alta ocupación (HOV)
    B: El carril es solo para vehículos de emergencia
    C: El carril está terminando
    D: El carril es exclusivamente para bicicletas
  answer: A
  explanation: El símbolo de diamante en el pavimento indica un carril restringido,
    como un carril HOV para autobuses o vehículos compartidos.
- id: 227
  category: signs_and_signals
  question: 'Un carril central marcado en ambos lados por una línea amarilla continua
    y una línea amarilla discontinua se utiliza para:'
  choices:
    A: Adelantar al tráfico más lento
    B: Estacionamiento de emergencia solamente
    C: Giros a la izquierda solamente
    D: Viajes a alta velocidad
  answer: C
  explanation: Esta marca indica un "Carril central para girar", el cual está reservado
    para vehículos que realizan giros a la izquierda desde cualquier dirección. No
    debe usarse para adelantar ni para circular de forma continua.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que se aproxima
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de detención, el cruce peatonal o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 228
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDER EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 229
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entrar en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico que viene en sentido contrario.
  id: 230
- image: wrong_way.png
  category: signs_and_signals
  id: 231
  question: ¿Qué debe hacer si ve esta señal?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está circulando en contra del tráfico en una calle de un solo sentido o en
    una rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de forma
    segura.
- image: one_way_left.png
  category: signs_and_signals
  id: 232
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
- image: no_u_turn.png
  category: signs_and_signals
  id: 233
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
- image: no_left_turn.png
  category: signs_and_signals
  id: 234
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
- image: no_right_turn.png
  category: signs_and_signals
  id: 235
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
- image: no_passing.png
  category: signs_and_signals
  id: 236
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro en forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona donde está prohibido adelantar.
- image: keep_right.png
  category: signs_and_signals
  id: 237
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
- image: speed_limit_25.png
  category: signs_and_signals
  id: 238
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
- image: deer_crossing.png
  category: signs_and_signals
  id: 239
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
- image: pedestrian_crossing.png
  category: signs_and_signals
  id: 240
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o un cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal fluorescente de color amarillo verdoso en forma de pentágono
    (5 lados) indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté
    atento a los niños.
  id: 241
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta (roundabout) más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 242
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima un
    tren, debe detenerse.
  id: 243
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 244
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más brusco que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 245
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta (roundabout) más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera curve primero
    hacia un lado y luego hacia el otro.
  id: 246
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 247
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación (merge) en forma de diamante advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 248
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 249
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 250
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción vial más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Prepárese para el
    tráfico en ambos sentidos.
  id: 251
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico en ambos sentidos más adelante. Es posible
    que esté saliendo de una vía de un solo sentido o de una autopista dividida y
    se encuentre con vehículos que circulan en dirección opuesta.
  id: 252
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 253
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción vial
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 254
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte que se prepare esta señal?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Prepárese para detenerse
    si la luz está en rojo o amarillo. Esta señal suele colocarse donde el semáforo
    puede no ser visible desde la distancia.
  id: 255
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 256
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 257
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 258
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: 'Se está añadiendo un nuevo carril: no es necesario incorporarse'
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 259
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer estacionado o con el motor encendido
    D: Carga o descarga
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 260
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo ciudadanos de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 261
