questions:
- id: 1
  category: sharing_the_road
  question: ¿Qué derechos y responsabilidades tienen los motociclistas en la vía pública?
  choices:
    A: Menos derechos que los vehículos de pasajeros.
    B: Los mismos derechos y responsabilidades que los conductores de otros vehículos.
    C: Solo el derecho a circular en carriles designados para motocicletas.
    D: Privilegios especiales que los eximen de las señales de tráfico.
  answer: B
  explanation: Según el manual, el motociclista tiene los mismos derechos y responsabilidades
    en la vía pública que los conductores de otros vehículos.
- id: 2
  category: sharing_the_road
  question: Según el manual, ¿quién causa casi dos tercios de los choques que involucran
    a una motocicleta y otro tipo de vehículo?
  choices:
    A: El motociclista.
    B: El conductor del otro vehículo.
    C: Los peatones que cruzan la calle.
    D: Condiciones climáticas impredecibles.
  answer: B
  explanation: El manual establece que casi dos tercios de estos choques no son causados
    por el motociclista, sino por el conductor del otro vehículo.
- id: 3
  category: safe_driving_rules
  question: ¿Cuánta distancia de seguimiento debe dejar al seguir a una motocicleta?
  choices:
    A: Uno a dos segundos.
    B: Tres o cuatro segundos.
    C: Cinco a seis segundos.
    D: Al menos diez segundos.
  answer: B
  explanation: El manual instruye a los conductores a dejar tres o cuatro segundos
    al seguir a una motocicleta, para que el motociclista tenga suficiente tiempo
    para maniobrar o detenerse en una emergencia.
- id: 4
  category: defensive_driving
  question: ¿Por qué es importante dejar una distancia de seguimiento adicional detrás
    de una motocicleta en condiciones secas?
  choices:
    A: Las motocicletas tardan más en detenerse que los autos.
    B: Las motocicletas pueden detenerse más rápido que un vehículo.
    C: Las motocicletas se apagan con frecuencia en clima seco.
    D: La visión del conductor se ve afectada por el polvo seco.
  answer: B
  explanation: El manual señala que, en condiciones secas, las motocicletas pueden
    detenerse más rápido que un vehículo, lo que requiere una mayor distancia de seguimiento
    para evitar colisiones por alcance.
- id: 5
  category: defensive_driving
  question: ¿Qué debe hacer si ve una luz de giro intermitente en una motocicleta
    que se aproxima?
  choices:
    A: Avanzar de inmediato porque la motocicleta definitivamente va a girar.
    B: Tocar la bocina para recordarle al conductor que gire.
    C: Esperar para estar seguro de que la motocicleta va a girar antes de avanzar.
    D: Encender las luces altas para aumentar la visibilidad.
  answer: C
  explanation: Las señales de las motocicletas generalmente no se cancelan automáticamente
    y los conductores a veces olvidan apagarlas. El manual aconseja esperar para estar
    seguro de que la motocicleta va a girar antes de avanzar.
- id: 6
  category: sharing_the_road
  question: 'Al conducir en el mismo carril que una motocicleta, usted debe:'
  choices:
    A: Compartir el carril para permitir que pasen más vehículos.
    B: Conducir cerca de la motocicleta para protegerla del viento.
    C: Permitir al motociclista el ancho total del carril y no compartir el carril.
    D: Rebasar a la motocicleta dentro del mismo carril si hay suficiente espacio.
  answer: C
  explanation: 'El manual establece que se debe permitir al motociclista el ancho
    total del carril y dice explícitamente: "No comparta el carril".'
- id: 7
  category: sharing_the_road
  question: 'Un porcentaje significativo de los choques de motocicletas que involucran
    a otro vehículo son causados por:'
  choices:
    A: El otro vehículo girando a la izquierda frente al motociclista.
    B: La motocicleta chocando por detrás al otro vehículo.
    C: El otro vehículo girando a la derecha con luz roja.
    D: La motocicleta rebasando por el arcén derecho.
  answer: A
  explanation: El manual establece que casi el 40 por ciento de los choques de motocicletas
    que involucran a otro vehículo motorizado fueron causados por el otro vehículo
    girando a la izquierda frente al motociclista.
- id: 8
  category: defensive_driving
  question: ¿Cómo podría reaccionar un motociclista ante condiciones peligrosas en
    la carretera, como baches o cruces de ferrocarril?
  choices:
    A: Manteniendo una velocidad constante y una línea recta.
    B: Cambiando repentinamente de velocidad o ajustando su posición dentro del carril.
    C: Deteniéndose por completo en medio de la carretera.
    D: Señalizando un giro y saliendo de la vía pública.
  answer: B
  explanation: Los motociclistas pueden cambiar de velocidad o ajustar su posición
    dentro de un carril repentinamente en reacción a las condiciones de la carretera
    y del tráfico, como baches, grava y cruces de ferrocarril.
- id: 9
  category: sharing_the_road
  question: ¿Qué efecto pueden tener los vientos fuertes o las ráfagas de viento de
    los camiones grandes en una motocicleta?
  choices:
    A: Mejoran la eficiencia de combustible de la motocicleta.
    B: Pueden desplazar a una motocicleta a través de un carril completo.
    C: Obligan a la motocicleta a acelerar.
    D: No tienen un efecto significativo en la trayectoria de una motocicleta.
  answer: B
  explanation: El manual advierte que una ráfaga de viento fuerte puede desplazar
    a una motocicleta a través de un carril completo si el conductor no está preparado
    para ello.
- id: 10
  category: safe_driving_rules
  question: Según la ley de Pensilvania, ¿a qué tres tipos de vehículos se aplican
    las reglas de la carretera?
  choices:
    A: Vehículos motorizados, barcos y aviones.
    B: Bicicletas, vehículos de tracción animal y vehículos motorizados.
    C: Vehículos motorizados, vehículos todo terreno (ATV) y motos de nieve.
    D: Automóviles de pasajeros, camiones comerciales y motocicletas solamente.
  answer: B
  explanation: 'El manual establece que las reglas de la carretera se aplican a tres
    tipos de vehículos reconocidos por la ley de Pensilvania: bicicletas, vehículos
    de tracción animal y vehículos motorizados.'
- id: 11
  category: safe_driving_rules
  question: ¿Cómo se aplican los semáforos a los ciclistas en Pensilvania?
  choices:
    A: Los ciclistas pueden tratar las luces rojas como señales de ceder el paso.
    B: Los ciclistas están exentos de detenerse ante las luces rojas.
    C: Los ciclistas, al igual que los automovilistas, están obligados a detenerse
      ante las luces rojas.
    D: Los ciclistas deben bajarse de la bicicleta y caminar con ella por todas las
      intersecciones.
  answer: C
  explanation: 'El manual establece explícitamente: "Por ejemplo, todos los ciclistas,
    al igual que los automovilistas, están obligados a detenerse ante las luces rojas".'
- id: 12
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones sobre conducir en Pensilvania es
    verdadera?
  choices:
    A: Conducir es un derecho constitucional para todos los ciudadanos.
    B: Conducir es un privilegio y no un derecho.
    C: Conducir es un derecho solo para los mayores de 18 años.
    D: Conducir es un derecho que no puede ser revocado.
  answer: B
  explanation: El manual establece claramente en la introducción que "Conducir es
    un privilegio y no un derecho".
- id: 13
  category: license_system
  question: ¿Qué formulario adicional debe completarse antes de realizar el Examen
    de Conocimientos si es menor de 18 años?
  choices:
    A: La Solicitud de Licencia de Conducir Comercial.
    B: El Formulario de Registro de Vehículos.
    C: El Formulario de Consentimiento del Padre, Madre o Tutor (DL-180TD).
    D: El Formulario de Designación de Donante de Órganos.
  answer: C
  explanation: El manual establece que si usted es menor de 18 años, su padre, madre
    o tutor debe completar el Formulario de Consentimiento del Padre, Madre o Tutor
    (DL-180TD).
- id: 14
  category: alcohol_drugs_health
  question: Según el manual, ¿cuál es una responsabilidad muy importante con respecto
    al alcohol y la conducción?
  choices:
    A: Solo debe beber si conduce una distancia corta.
    B: Nunca debe mezclar el consumo de alcohol con la conducción.
    C: Puede beber y conducir si se mantiene por debajo del límite de velocidad.
    D: Puede beber y conducir siempre que tenga un pasajero con licencia.
  answer: B
  explanation: El manual enfatiza que "Una responsabilidad muy importante es que nunca
    mezcle el consumo de alcohol con la conducción".
- id: 15
  category: sharing_the_road
  question: ¿Por qué puede ser difícil juzgar la velocidad y la distancia de una motocicleta
    que se aproxima?
  choices:
    A: Las motocicletas suelen viajar mucho más rápido que el límite de velocidad.
    B: Las motocicletas tienen un perfil mucho más pequeño que otros vehículos.
    C: Las motocicletas no tienen faros delanteros.
    D: Las motocicletas se confunden con el color del pavimento.
  answer: B
  explanation: El manual explica que las motocicletas tienen un perfil mucho más pequeño
    que otros vehículos, lo que puede dificultar el juicio de la velocidad y la distancia
    de una motocicleta que se aproxima.
- id: 16
  category: license_system
  question: ¿Qué edad debe tener para solicitar un permiso de aprendizaje no comercial
    en Pensilvania?
  choices:
    A: 15 años
    B: 15 años y medio
    C: 16 años
    D: 18 años
  answer: C
  explanation: Según el manual, no puede solicitar su permiso antes de cumplir los
    16 años.
- id: 17
  category: license_system
  question: ¿Con cuánta antelación puede su proveedor de atención médica completar
    el examen físico para su solicitud de permiso de aprendizaje?
  choices:
    A: No antes de 3 meses antes de cumplir los 16 años
    B: No antes de 6 meses antes de cumplir los 16 años
    C: No antes de 1 año antes de cumplir los 16 años
    D: Solo al cumplir los 16 años o después
  answer: B
  explanation: La fecha del examen físico no puede ser superior a seis (6) meses antes
    de cumplir los 16 años.
- id: 18
  category: driver_testing
  question: ¿Qué tres exámenes debe aprobar para obtener su licencia de conducir?
  choices:
    A: Exámenes de visión, conocimientos y de conducción (Road Test)
    B: Exámenes de audición, conocimientos y de conducción
    C: Exámenes de visión, reflejos y de conducción
    D: Exámenes de conocimientos, de conducción y de carretera
  answer: A
  explanation: Deberá realizar y aprobar los exámenes de visión, conocimientos y de
    conducción para obtener su licencia de conducir.
- id: 19
  category: license_system
  question: Si es menor de 18 años y su padre, madre o tutor no puede acompañarlo
    al Centro de Licencias de Conducir, ¿qué se debe hacer con el Formulario de Consentimiento
    (DL-180TD)?
  choices:
    A: Debe estar firmado por el director de una escuela.
    B: Debe enviarse por correo directamente a PennDOT.
    C: Debe firmarse ante un notario.
    D: Debe estar firmado por un conductor con licencia mayor de 21 años.
  answer: C
  explanation: Si el padre, madre o tutor no puede acompañar al solicitante, el formulario
    DL-180TD debe firmarse ante un notario.
- id: 20
  category: license_system
  question: Si es mayor de 18 años y solicita un permiso, ¿cuántos comprobantes de
    residencia debe presentar?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Si es mayor de 18 años, debe presentar dos (2) comprobantes de residencia.
- id: 21
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera al presentar el comprobante
    de fecha de nacimiento e identificación en el Centro de Licencias de Conducir?
  choices:
    A: Se prefieren las fotocopias de alta calidad.
    B: Se aceptan copias digitales en un teléfono inteligente.
    C: Los documentos deben ser originales y no se aceptarán fotocopias.
    D: Una identificación escolar puede reemplazar un certificado de nacimiento.
  answer: C
  explanation: El manual establece que los documentos de comprobante de fecha de nacimiento
    e identificación deben ser originales (no se aceptarán fotocopias).
- id: 22
  category: license_system
  question: Una vez emitido, ¿por cuánto tiempo es válido un permiso de aprendizaje
    no comercial de Pennsylvania?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 4 años
  answer: B
  explanation: Después de aprobar el Examen de Conocimientos, el examinador le entregará
    un permiso de aprendizaje, el cual es válido por un (1) año.
- id: 23
  category: driver_testing
  question: Si es menor de 18 años, ¿cuántas horas de práctica de habilidades al volante
    debe completar antes de realizar su examen de manejo (Road Test)?
  choices:
    A: 40 horas
    B: 50 horas
    C: 65 horas
    D: 100 horas
  answer: C
  explanation: Si es menor de 18 años, se requiere que complete al menos 65 horas
    de práctica de habilidades al volante antes de realizar su examen de manejo.
- id: 24
  category: driver_testing
  question: Para los conductores menores de 18 años, la práctica obligatoria de habilidades
    al volante debe incluir horas específicas para ciertas condiciones. ¿Cuáles son?
  choices:
    A: 10 horas de conducción nocturna y 5 horas de conducción en mal tiempo
    B: 5 horas de conducción nocturna y 10 horas de conducción en mal tiempo
    C: 15 horas de conducción nocturna y 5 horas de conducción en autopista
    D: 10 horas de conducción en autopista y 10 horas de conducción en mal tiempo
  answer: A
  explanation: Las 65 horas de práctica de habilidades deben incluir no menos de 10
    horas de conducción nocturna y cinco (5) horas de conducción en condiciones climáticas
    adversas.
- id: 25
  category: driver_responsibility
  question: ¿Quién tiene permitido viajar en el asiento delantero con un conductor
    que tiene un permiso de aprendizaje?
  choices:
    A: Cualquier conductor con licencia que tenga al menos 18 años.
    B: Un conductor con licencia que tenga al menos 21 años, o un padre/tutor/cónyuge
      con licencia que tenga 18 años o más.
    C: Cualquier pasajero mayor de 21 años, independientemente de su estado de licencia.
    D: Únicamente un instructor de manejo con licencia.
  answer: B
  explanation: Un conductor con licencia que tenga al menos 21 años de edad o un padre,
    tutor, persona in loco parentis o cónyuge que tenga 18 años de edad o más y posea
    una licencia de conducir debe viajar con usted en el asiento delantero.
- id: 26
  category: safe_driving_rules
  question: ¿Cuál es el límite de pasajeros para conductores menores de 18 años?
  choices:
    A: Solo se permite un miembro que no sea de la familia.
    B: No se permiten pasajeros aparte del conductor supervisor.
    C: No pueden tener más pasajeros en el vehículo que el número de cinturones de
      seguridad.
    D: Hasta tres pasajeros menores de 18 años.
  answer: C
  explanation: Los conductores menores de 18 años no pueden tener más pasajeros en
    el vehículo que el número de cinturones de seguridad disponibles.
- id: 27
  category: driver_testing
  question: ¿De cuánto tiempo es el período de espera obligatorio desde la fecha de
    emisión del permiso antes de que un conductor menor de 18 años pueda realizar
    el examen de manejo?
  choices:
    A: 30 días
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Debe esperar el período obligatorio de seis (6) meses a partir de la
    fecha de emisión de su permiso antes de poder realizar su examen de manejo.
- id: 28
  category: driver_testing
  question: ¿Qué sucede si no aprueba su examen de manejo después de tres (3) intentos?
  choices:
    A: Debe esperar un año antes de volver a examinarse.
    B: Puede obtener un formulario DL-31 para Agregar/Extender/Reemplazar/Cambiar/Corregir
      su permiso.
    C: Su permiso de aprendizaje es revocado permanentemente.
    D: Debe volver a tomar el Examen de Conocimientos de inmediato.
  answer: B
  explanation: Si su permiso de aprendizaje vence o si no aprueba su examen de manejo
    después de tres (3) intentos, puede obtener una Solicitud de Permiso de Aprendizaje
    No Comercial para Agregar/Extender/Reemplazar/Cambiar/Corregir (DL-31).
- id: 29
  category: driver_testing
  question: Si reprueba el Examen de Conocimientos, ¿qué tan pronto puede volver a
    tomarlo?
  choices:
    A: Puede tomarlo por segunda vez el mismo día si va a una ubicación diferente.
    B: Debe esperar al menos 7 días.
    C: Puede tomar el Examen de Conocimientos solo una vez al día.
    D: Debe esperar 30 días antes de volver a tomar el examen.
  answer: C
  explanation: Puede tomar el Examen de Conocimientos solo una vez al día, independientemente
    de la ubicación del examen.
- id: 30
  category: driver_responsibility
  question: Si planea usar su permiso de aprendizaje de Pennsylvania para conducir
    en otro estado, ¿qué debe hacer?
  choices:
    A: Asumir que es válido en todo el país.
    B: Solicitar un permiso de conducir internacional.
    C: Consultar con su compañía de seguros y con el Departamento de Transporte del
      otro estado.
    D: Conducir solo durante las horas del día en el otro estado.
  answer: C
  explanation: Si está utilizando su permiso de aprendizaje para conducir fuera de
    PA, consulte con su compañía de seguros y con el Departamento de Transporte del
    otro estado para asegurarse de que su permiso sea considerado válido.
- id: 31
  category: driver_testing
  question: ¿Cuántas veces al día se le permite realizar el Examen de Conocimientos?
  choices:
    A: Tantas veces como sea necesario hasta aprobar
    B: Dos veces
    C: Una vez
    D: Tres veces
  answer: C
  explanation: Según el manual, puede realizar el Examen de Conocimientos solo una
    vez al día, independientemente del lugar del examen.
- id: 32
  category: license_system
  question: Si es menor de 18 años de edad, ¿qué se requiere para obtener la designación
    de "DONANTE DE ÓRGANOS" en su licencia de conducir?
  choices:
    A: Un certificado de examen médico
    B: Consentimiento por escrito de un padre, tutor, persona in loco parentis o cónyuge
      que tenga 18 años o más
    C: Una donación obligatoria de $10 al Fondo Fiduciario de Concientización sobre
      la Donación de Órganos
    D: Una declaración jurada ante notario de su médico de cabecera
  answer: B
  explanation: Los solicitantes menores de 18 años de edad pueden solicitar la designación
    de donante de órganos, pero deben contar con el consentimiento por escrito de
    un padre, tutor, persona in loco parentis o cónyuge que tenga 18 años de edad
    o más.
- id: 33
  category: license_system
  question: ¿Se imprimirá su número de Seguro Social en su permiso de aprendizaje
    o licencia de conducir?
  choices:
    A: Sí, se imprime en todos los permisos y licencias para identificación.
    B: Sí, pero solo en el permiso de aprendizaje.
    C: No, no se imprimirá en su permiso de aprendizaje ni en su licencia de conducir.
    D: Sí, a menos que solicite específicamente que se elimine.
  answer: C
  explanation: 'El manual establece: "Su número de Seguro Social no se imprimirá en
    su permiso de aprendizaje ni en su licencia de conducir".'
- id: 34
  category: driver_testing
  question: ¿Qué sucede si su visión no cumple con los estándares de visión de Pennsylvania
    durante las pruebas?
  choices:
    A: Queda descalificado permanentemente para obtener una licencia de conducir.
    B: Se le entregará un Formulario de Informe de Examen de la Vista (DL-102) para
      que lo complete un oculista o médico.
    C: Debe realizar inmediatamente un examen de manejo especializado.
    D: Recibirá automáticamente una restricción de conducción solo durante el día
      sin más pruebas.
  answer: B
  explanation: Si su visión no cumple con los estándares, el examinador le entregará
    un Formulario de Informe de Examen de la Vista (DL-102) para que lo complete un
    optometrista, oftalmólogo o médico de cabecera.
- id: 35
  category: license_system
  question: Si se muda a Pennsylvania y tiene una licencia de conducir válida de otro
    estado, ¿cuánto tiempo tiene para obtener una licencia de conducir de Pennsylvania?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: Las personas que acaban de mudarse a Pennsylvania y poseen una licencia
    de conducir válida de otro estado o de Canadá deben obtener una licencia de conducir
    de Pennsylvania dentro de los 60 días posteriores a la mudanza.
- id: 36
  category: license_system
  question: ¿Durante cuánto tiempo están autorizadas a conducir en Pennsylvania las
    personas con una licencia de conducir extranjera válida?
  choices:
    A: Hasta 30 días a partir de su fecha de entrada a los Estados Unidos
    B: Hasta 6 meses a partir de su fecha de entrada a los Estados Unidos
    C: Hasta un año a partir de su fecha de entrada a los Estados Unidos, o al vencimiento
      de su licencia extranjera, lo que ocurra primero
    D: Indefinidamente, siempre que lleven un Permiso Internacional de Conducir
  answer: C
  explanation: Las personas que poseen una licencia de conducir extranjera válida
    están autorizadas a conducir en Pennsylvania hasta por un año a partir de su fecha
    de entrada a los Estados Unidos, o al vencimiento de su licencia extranjera, lo
    que ocurra primero.
- id: 37
  category: license_system
  question: ¿Quién está autorizado para supervisar a un conductor menor de 18 años
    de edad que posee un Permiso de Aprendizaje Junior?
  choices:
    A: Cualquier conductor con licencia que tenga al menos 18 años
    B: Un conductor con licencia que tenga al menos 21 años, o un padre, tutor, persona
      in loco parentis o cónyuge que tenga 18 años o más
    C: Cualquier conductor con licencia con al menos un año de experiencia al volante
    D: Solo un instructor de manejo certificado por el estado
  answer: B
  explanation: Solo puede conducir bajo la supervisión de un conductor con licencia
    que tenga al menos 21 años de edad o un padre, tutor, persona in loco parentis
    o cónyuge que tenga 18 años de edad o más y posea una licencia de conducir.
- id: 38
  category: safe_driving_rules
  question: Al conducir con un Permiso de Aprendizaje Junior o una Licencia de Conducir
    Junior, ¿cuál es la regla con respecto al número de pasajeros?
  choices:
    A: No puede llevar a ningún pasajero que no sea su conductor supervisor.
    B: Puede llevar hasta 5 pasajeros independientemente del número de cinturones
      de seguridad.
    C: No puede llevar más pasajeros que los cinturones de seguridad disponibles en
      el vehículo que conduce.
    D: Solo puede llevar a familiares directos.
  answer: C
  explanation: 'Tanto para el Permiso de Aprendizaje Junior como para la Licencia
    de Conducir Junior, el manual establece: "No puede llevar más pasajeros que los
    cinturones de seguridad disponibles en el vehículo que conduce".'
- id: 39
  category: license_system
  question: ¿Cuáles son las horas de conducción restringidas para una Licencia de
    Conducir Junior a menos que esté acompañado por un padre, tutor o cónyuge de 18
    años o más?
  choices:
    A: 9 p.m. a 6 a.m.
    B: 10 p.m. a 5 a.m.
    C: 11 p.m. a 5 a.m.
    D: Medianoche a 6 a.m.
  answer: C
  explanation: Con una licencia de conducir junior, no puede conducir entre las 11
    p.m. y las 5 a.m., a menos que su padre, tutor, persona in loco parentis o cónyuge
    que tenga 18 años de edad o más esté con usted.
- id: 40
  category: license_system
  question: ¿Cuál de las siguientes opciones permite a un conductor junior conducir
    legalmente entre las 11 p.m. y las 5 a.m. sin la presencia de un padre o tutor?
  choices:
    A: Regresar a casa de un evento deportivo escolar
    B: Estar involucrado en un servicio público o caritativo, una compañía de bomberos
      voluntarios o un empleo
    C: Conducir a la casa de un amigo para un grupo de estudio
    D: Tener un historial de conducción limpio durante al menos 3 meses
  answer: B
  explanation: Puede conducir entre las 11 p.m. y las 5 a.m. si está involucrado en
    un servicio público o caritativo, es miembro de una compañía de bomberos voluntarios
    o tiene un empleo durante esas horas, siempre que lleve una declaración jurada
    ante notario.
- id: 41
  category: safe_driving_rules
  question: ¿Durante los primeros seis meses de conducir con una Licencia de Conducir
    para Menores (Junior Driver's License), cuántos pasajeros menores de 18 años (que
    no sean miembros de la familia inmediata) puede llevar sin la presencia de un
    padre o tutor?
  choices:
    A: Ninguno
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: No puede llevar a más de un (1) pasajero menor de 18 años que no sea
    un miembro de la familia inmediata, a menos que un padre, tutor, persona en lugar
    de los padres (in loco parentis) o cónyuge que tenga 18 años de edad o más se
    encuentre en el vehículo con usted.
- id: 42
  category: penalties_and_points
  question: ¿Un conductor menor recibirá una suspensión obligatoria de 90 días si
    es condenado por conducir a cuántas millas por hora por encima del límite de velocidad
    establecido?
  choices:
    A: 10 mph o más
    B: 15 mph o más
    C: 20 mph o más
    D: 26 mph o más
  answer: D
  explanation: Recibirá una suspensión obligatoria de 90 días si acumula seis (6)
    o más puntos o si es condenado por conducir a 26 millas por hora (mph) o más por
    encima del límite de velocidad establecido.
- id: 43
  category: license_system
  question: ¿A qué edad una Licencia de Conducir para Menores (Junior Driver's License)
    se convierte automáticamente en una licencia de conducir regular?
  choices:
    A: 17 años de edad
    B: 18 años de edad
    C: 19 años de edad
    D: 21 años de edad
  answer: B
  explanation: 'El manual establece: ''Su licencia de conducir para menores se convertirá
    automáticamente en una licencia de conducir regular cuando cumpla 18 años de edad''.'
- id: 44
  category: license_system
  question: ¿Qué clase de licencia de conducir de Pennsylvania cubre vehículos de
    pasajeros regulares, camionetas pick-up y furgonetas (vans)?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase M
  answer: C
  explanation: El manual está diseñado para proporcionar información para una licencia
    de conducir Clase C no comercial, que es la clase que cubre vehículos de pasajeros
    regulares, camionetas pick-up o furgonetas (vans).
- id: 45
  category: license_system
  question: ¿Cuál es la edad mínima requerida para obtener una licencia de conducir
    Clase A en Pennsylvania?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: Bajo 'CLASES DE LICENCIAS DE CONDUCIR', el manual enumera 'CLASE A
    (edad mínima 18)'.
- id: 46
  category: license_system
  question: ¿Bajo qué condición puede el titular de una licencia Clase C operar un
    vehículo de bomberos o de emergencia?
  choices:
    A: Si tiene un endoso de Clase M
    B: Si el vehículo pesa menos de 26,000 libras
    C: Si tiene un certificado de autorización de un jefe de bomberos o del jefe del
      escuadrón de rescate
    D: Si tiene al menos 21 años de edad
  answer: C
  explanation: Un bombero o miembro de un escuadrón de rescate con una licencia Clase
    C puede operar vehículos de emergencia si tiene un certificado de autorización
    de un jefe de bomberos o del jefe del escuadrón de rescate o de emergencias.
- id: 47
  category: license_system
  question: ¿Qué indica una restricción '8' en una licencia de conducir Clase M?
  choices:
    A: El conductor debe usar lentes correctivos
    B: El conductor tiene prohibido operar una motocicleta de dos ruedas
    C: El conductor tiene prohibido operar una motocicleta y solo puede operar un
      ciclo impulsado por motor
    D: El conductor solo puede operar una motocicleta durante las horas del día
  answer: C
  explanation: Si realiza el examen en un ciclo impulsado por motor, aparecerá una
    restricción '8' en su licencia, la cual le prohíbe operar una motocicleta.
- id: 48
  category: driver_testing
  question: ¿Cuántas preguntas debe responder correctamente para aprobar el Examen
    de Conocimientos (Knowledge Test)?
  choices:
    A: 12 de 15
    B: 15 de 18
    C: 16 de 20
    D: 18 de 18
  answer: B
  explanation: El Examen de Conocimientos consiste en 18 preguntas de opción múltiple,
    y debe responder 15 preguntas correctamente para aprobar el examen.
- id: 49
  category: driver_testing
  question: Si reprueba el Examen de Conocimientos (Knowledge Test), ¿cuándo se le
    permite volver a tomarlo?
  choices:
    A: Después de 7 días
    B: El siguiente día hábil
    C: Después de 30 días
    D: Inmediatamente el mismo día
  answer: B
  explanation: Si reprueba el Examen de Conocimientos, se le permitirá volver a tomar
    el examen el siguiente día hábil.
- id: 50
  category: driver_testing
  question: ¿Quién puede acompañarlo al Centro de Licencias de Conducir para su Examen
    de Manejo (Road Test) si tiene 18 años de edad o más?
  choices:
    A: Cualquier conductor con licencia
    B: Un amigo que haya tenido su licencia por un año
    C: Un padre, tutor, persona en lugar de los padres (in loco parentis) o cónyuge
      con una licencia de conducir válida
    D: Un hermano con un permiso de aprendizaje
  answer: C
  explanation: Debe estar acompañado por una persona que tenga al menos 21 años de
    edad, o un padre, tutor, persona en lugar de los padres (in loco parentis) o cónyuge
    que tenga 18 años de edad o más con una licencia de conducir válida.
- id: 51
  category: vehicle_information
  question: ¿Cuál de las siguientes situaciones impedirá que se le permita realizar
    el examen de conducir (Road Test)?
  choices:
    A: Traer un vehículo con transmisión manual
    B: No traer una copia de sus documentos en lugar de los originales
    C: Que se determine que una parte del vehículo no es segura o no cumple con los
      requisitos de inspección estatal
    D: Tener una función de estacionamiento automático instalada en su vehículo
  answer: C
  explanation: Si se determina que alguna parte de su vehículo no es segura o no cumple
    con los requisitos de inspección estatal, no se le permitirá realizar el examen
    de conducir (Road Test).
- id: 52
  category: driver_testing
  question: ¿Cuáles son las dimensiones del espacio en el que debe estacionar su vehículo
    en paralelo durante el examen de conducir (Road Test)?
  choices:
    A: 20 pies de largo y 6 pies de ancho
    B: 24 pies de largo y 8 pies de ancho
    C: 25 pies de largo y 10 pies de ancho
    D: 30 pies de largo y 8 pies de ancho
  answer: B
  explanation: Debe estacionar su vehículo a mitad de camino entre dos postes verticales
    en un espacio que tiene 24 pies de largo y ocho (8) pies de ancho.
- id: 53
  category: driver_testing
  question: ¿Cuántos intentos y ajustes se le permiten para estacionar en paralelo
    con éxito durante el examen de conducir (Road Test)?
  choices:
    A: Dos intentos usando no más de cinco ajustes
    B: Un intento usando no más de tres ajustes
    C: Tres intentos usando no más de tres ajustes
    D: Un intento usando no más de cinco ajustes
  answer: B
  explanation: Tiene un (1) intento para estacionar su vehículo con éxito usando no
    más de tres (3) ajustes.
- id: 54
  category: driver_testing
  question: ¿Cuál es la regla con respecto a los vehículos equipados con Sistemas
    Avanzados de Guía de Estacionamiento (vehículos que se estacionan solos) durante
    el examen de conducir (Road Test)?
  choices:
    A: No pueden usarse para el examen de conducir bajo ninguna circunstancia
    B: La función de estacionamiento automático puede usarse solo para la parte de
      estacionamiento en paralelo
    C: Pueden usarse, pero la función de estacionamiento automático debe estar apagada
      y no debe activarse
    D: El examinador activará la función para probar su funcionalidad
  answer: C
  explanation: Los vehículos equipados con Sistemas Avanzados de Guía de Estacionamiento
    pueden usarse para el examen; sin embargo, la función de estacionamiento automático
    debe estar apagada y no se permite su activación durante el examen de conducir
    (Road Test).
- id: 55
  category: driver_testing
  question: Si es menor de 18 años y reprueba el examen de conducir (Road Test), ¿cuánto
    tiempo debe esperar antes de poder volver a tomarlo?
  choices:
    A: 24 horas
    B: 3 días
    C: 7 días
    D: 14 días
  answer: C
  explanation: Si es menor de 18 años y reprueba el examen de conducir (Road Test),
    la ley de Pensilvania exige que espere siete (7) días antes de poder volver a
    realizar el examen.
- id: 56
  category: driver_testing
  question: ¿Cuántas oportunidades tiene para aprobar el examen de conducir (Road
    Test) con cada permiso de aprendizaje?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Ilimitadas antes de la fecha de vencimiento
  answer: C
  explanation: Tiene tres (3) oportunidades con cada permiso de aprendizaje para aprobar
    el examen de conducir (Road Test) antes de la fecha de vencimiento del permiso
    de aprendizaje.
- id: 57
  category: license_system
  question: ¿Qué debe hacer si no ha completado con éxito el examen de conducir (Road
    Test) dentro de los tres años posteriores a la fecha de su examen físico?
  choices:
    A: Pagar un cargo por retraso para extender el permiso
    B: Comenzar de nuevo con otra Solicitud de Permiso de Aprendizaje No Comercial
      y volver a tomar el examen de conocimientos
    C: Tomar un curso de educación vial aprobado
    D: Esperar seis meses antes de volver a solicitarlo
  answer: B
  explanation: Si no ha tomado o completado con éxito el examen de conducir (Road
    Test) dentro de los tres (3) años posteriores a la fecha de su examen físico,
    debe comenzar de nuevo con otra Solicitud de Permiso de Aprendizaje No Comercial
    (DL-180) y volver a tomar el examen de conocimientos.
- id: 58
  category: license_system
  question: ¿Se requiere una licencia de conducir Clase B para operar cuál de los
    siguientes?
  choices:
    A: Cualquier vehículo individual con una clasificación de peso superior a 26,000
      libras
    B: Cualquier combinación de vehículos con una clasificación de peso bruto de 26,001
      libras o más
    C: Una motocicleta con más de dos ruedas
    D: Un ciclo impulsado por motor con transmisión automática
  answer: A
  explanation: Se requiere una licencia Clase B para operar cualquier vehículo individual
    con una clasificación superior a 26,000 libras, como casas rodantes clasificadas
    en 26,001 libras o más.
- id: 59
  category: driver_testing
  question: ¿Qué sucederá si no opera correctamente alguno de los controles del vehículo
    (como los limpiaparabrisas, el freno de mano o las luces de emergencia) antes
    del examen de conducir (Road Test)?
  choices:
    A: Perderá puntos pero aún podrá aprobar el examen
    B: El examinador le mostrará cómo usarlos y continuará con el examen
    C: Resultará en la reprobación del examen de conducir (Road Test)
    D: Se le restringirá a conducir únicamente durante el día
  answer: C
  explanation: No operar correctamente cualquiera de los controles del vehículo resultará
    en la reprobación del examen de conducir (Road Test).
- id: 60
  category: signs_and_signals
  question: ¿Cómo están dispuestos los semáforos cuando están en una línea horizontal?
  choices:
    A: El rojo siempre está a la izquierda y el verde a la derecha
    B: El verde siempre está a la izquierda y el rojo a la derecha
    C: El amarillo siempre está a la izquierda y el rojo a la derecha
    D: El rojo siempre está arriba y el verde abajo
  answer: A
  explanation: 'El manual establece: ''Cuando están dispuestos horizontalmente, el
    rojo siempre está a la izquierda y el verde a la derecha''.'
- id: 61
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite realizar un giro a la izquierda con
    una luz roja fija?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de un solo sentido
    B: Cuando no hay tráfico aproximándose en ninguna calle
    C: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido
    D: Nunca se puede girar a la izquierda con una luz roja fija
  answer: C
  explanation: El manual establece que usted puede girar a la izquierda después de
    detenerse ante una luz roja si se encuentra en el carril izquierdo y gira desde
    una calle de un solo sentido hacia otra calle de un solo sentido, a menos que
    una señal le indique que no gire.
- id: 62
  category: signs_and_signals
  question: ¿Qué significa una luz de tráfico roja intermitente?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Tiene el mismo significado que una señal de PARE (STOP)
    C: El semáforo está averiado y usted tiene el derecho de paso
    D: Detenerse solo si se aproxima tráfico transversal
  answer: B
  explanation: Según el manual, 'Una luz roja intermitente tiene el mismo significado
    que una señal de PARE (STOP). Debe detenerse por completo. Luego, mire hacia ambos
    lados y proceda solo después de que la intersección esté despejada'.
- id: 63
  category: signs_and_signals
  question: ¿Cómo debe tratar una intersección con semáforos que no funcionan?
  choices:
    A: Ceder el paso al vehículo a su derecha y proceder sin detenerse
    B: Esperar a que un oficial de policía dirija el tráfico
    C: Atravesar la intersección a su velocidad normal
    D: Tratarla como si fuera una señal de PARE (STOP) de cuatro vías
  answer: D
  explanation: 'El manual establece explícitamente: ''Una señal de tráfico que no
    funciona debe tratarse como si fuera una señal de PARE (STOP) de cuatro vías''.'
- id: 64
  category: signs_and_signals
  question: ¿Qué indica una 'X' amarilla fija sobre un carril de tráfico?
  choices:
    A: No se le permite utilizar el carril de tráfico en absoluto
    B: Debe cambiar de carril porque la dirección de circulación de ese carril está
      a punto de invertirse
    C: Puede usar el carril pero debe reducir la velocidad para una cabina de peaje
    D: Solo puede girar a la izquierda desde ese carril específico
  answer: B
  explanation: El manual explica que una 'X' amarilla fija sobre un carril de tráfico
    significa que 'debe cambiar de carril porque la dirección de circulación de ese
    carril está a punto de invertirse. Prepárese para abandonar el carril de manera
    segura'.
- id: 65
  category: sharing_the_road
  question: ¿Qué debe hacer un peatón si la señal intermitente de NO CRUCE (DON'T
    WALK) o la mano levantada intermitente comienza mientras ya está en la calle?
  choices:
    A: Detenerse inmediatamente y esperar en medio de la calle
    B: Dar la vuelta y regresar a la acera de inicio
    C: Terminar de cruzar la calle
    D: Correr lo más rápido posible hacia la acera más cercana
  answer: C
  explanation: El manual instruye a los peatones que cuando comienza la señal intermitente
    de NO CRUCE (DON'T WALK) o la mano levantada intermitente, deben 'Terminar de
    cruzar, si ya se encuentran en la calle'.
- id: 66
  category: sharing_the_road
  question: ¿Qué debe hacer al conducir cerca de un peatón ciego que lleva un bastón
    blanco o camina con un perro guía?
  choices:
    A: Tocar la bocina para avisarle que usted se aproxima
    B: Mantener su velocidad pero maniobrar con cuidado a su alrededor
    C: Detenerse y decirle verbalmente que es seguro cruzar
    D: Reducir la velocidad, ceder siempre el derecho de paso y proceder con precaución
  answer: D
  explanation: 'El manual establece: ''Al conducir cerca de un peatón ciego que lleva
    un bastón blanco o camina con un perro guía, debe reducir la velocidad, ceder
    siempre el derecho de paso y luego proceder con precaución''.'
- id: 67
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en una zona escolar cuando las
    señales amarillas están parpadeando?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: A
  explanation: 'El manual establece: ''No debe viajar a más de 15 mph cuando las señales
    amarillas estén parpadeando o durante los períodos de tiempo indicados en la señal''.'
- id: 68
  category: penalties_and_points
  question: ¿Cuál es la sanción por exceder el límite de velocidad en una zona escolar?
  choices:
    A: Una advertencia por la primera infracción
    B: Un punto en su historial de conducción y una multa
    C: Tres puntos en su historial de conducción y una multa
    D: Suspensión inmediata de la licencia por 30 días
  answer: C
  explanation: Según el manual, 'Exceder el límite de velocidad en una zona escolar
    resultará en tres (3) puntos en su historial de conducción, y también será multado'.
- id: 69
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima a un cruce de ferrocarril y la barrera
    de cruce está bajada?
  choices:
    A: Reducir la velocidad y rodear la barrera si no se ve ningún tren
    B: Detenerse y esperar hasta que se levante la barrera y todas las señales hayan
      finalizado
    C: Detenerse, mirar a ambos lados y rodear la barrera con cuidado
    D: Tocar la bocina y proceder sin detenerse
  answer: B
  explanation: 'El manual establece que es obligatorio detenerse ante las barreras
    de cruce bajadas y advierte: ''No avance ni intente rodear ninguna barrera ni
    ignore ninguna señal de un tren que se aproxima. Proceda con precaución solo después
    de que todas las señales hayan finalizado...'''
- id: 70
  category: signs_and_signals
  question: ¿Qué significa una flecha verde fija?
  choices:
    A: Puede girar, pero debe ceder el paso al tráfico que viene en sentido contrario
    B: Debe detenerse antes de girar en la dirección de la flecha
    C: El carril en el que se encuentra está a punto de cerrarse
    D: Puede girar en la dirección que apunta la flecha y su giro está protegido
  answer: D
  explanation: 'El manual establece: ''Una FLECHA VERDE FIJA significa que puede girar
    en la dirección que apunta la flecha. Cuando gira durante la fase de flecha verde,
    su giro está "protegido" porque el tráfico que viene en sentido contrario está
    detenido por una luz roja''.'
- id: 71
  category: signs_and_signals
  question: ¿Qué indica una flecha amarilla intermitente?
  choices:
    A: Usted tiene un giro protegido en la dirección de la flecha
    B: Debe detenerse por completo antes de girar
    C: Puede girar con precaución, pero debe ceder el paso al tráfico en sentido contrario
      y a los peatones
    D: El semáforo está averiado y debe tratarlo como una señal de alto (STOP)
  answer: C
  explanation: 'El manual establece: ''Una FLECHA AMARILLA INTERMITENTE significa
    que puede girar en la dirección de la flecha con precaución; sin embargo, primero
    debe ceder el paso al tráfico en sentido contrario y a los peatones. Cuando gira
    durante la fase de flecha amarilla intermitente, su giro NO está protegido...'''
- id: 72
  category: safe_driving_rules
  question: ¿Cuántos autos pueden entrar a la autopista cada vez que la luz del semáforo
    de regulación de rampa (ramp-metering) se pone en verde en una rampa de un solo
    carril?
  choices:
    A: Un auto
    B: Dos autos
    C: Tres autos
    D: Tantos autos como puedan pasar de forma segura antes de que cambie a rojo
  answer: A
  explanation: 'El manual especifica con respecto a las señales de regulación de rampa:
    ''En las rampas de un solo carril, solo un (1) auto puede entrar a la autopista
    cada vez que la luz se pone en verde''.'
- id: 73
  category: safe_driving_rules
  question: ¿Qué debe hacer si el tráfico está congestionado y necesita cruzar una
    vía de ferrocarril?
  choices:
    A: Detenerse sobre las vías y esperar a que el tráfico avance
    B: Detener su vehículo en un lugar que esté completamente fuera de las vías del
      ferrocarril
    C: Avanzar lentamente sobre las vías, manteniéndose lo más cerca posible del auto
      de adelante
    D: Tocar la bocina para que los autos de adelante se muevan más rápido
  answer: B
  explanation: 'El manual establece: ''Si el tráfico está congestionado debido a un
    semáforo, una señal de alto o por cualquier otra razón, asegúrese de detener su
    vehículo en un lugar donde esté completamente fuera de cualquier vía de ferrocarril''.'
- id: 74
  category: signs_and_signals
  question: ¿Cuáles son las tres categorías básicas de señales de tráfico?
  choices:
    A: Señales reglamentarias, de advertencia y de guía.
    B: Señales informativas, direccionales y de advertencia.
    C: Señales de velocidad, de alto y de ceda el paso.
    D: Señales obligatorias, de asesoramiento y de construcción.
  answer: A
  explanation: 'El manual establece que las señales se dividen en tres categorías
    básicas: señales reglamentarias, de advertencia y de guía.'
- id: 75
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia de desobedecer los mensajes de las señales
    reglamentarias?
  choices:
    A: Se le pedirá que vuelva a tomar su examen de conducir.
    B: Podría ser multado y recibir puntos en su historial de conducción.
    C: Su vehículo será confiscado de inmediato.
    D: Recibirá una advertencia por las primeras tres infracciones.
  answer: B
  explanation: Si no obedece los mensajes de las señales reglamentarias, podría ser
    multado y recibir puntos en su historial de conducción porque está infringiendo
    la ley.
- id: 76
  category: safe_driving_rules
  question: Al acercarse a una señal de ALTO (STOP) con un paso de peatones pintado
    o una línea de parada, ¿dónde debe detener su vehículo?
  choices:
    A: Justo después de la primera línea pintada.
    B: Antes de que la parte delantera de su vehículo llegue a la primera línea pintada.
    C: En medio del paso de peatones para ver mejor.
    D: Paralelo a la propia señal de ALTO (STOP).
  answer: B
  explanation: Cuando vea un paso de peatones o una línea de parada (barra superior
    blanca), debe detenerse antes de que la parte delantera de su vehículo llegue
    a la primera línea pintada.
- id: 77
  category: safe_driving_rules
  question: Si dos vehículos llegan a una intersección de parada de CUATRO VÍAS (FOUR-WAY
    STOP) al mismo tiempo, ¿quién debe ceder el paso?
  choices:
    A: El conductor de la izquierda cede el paso al conductor de la derecha.
    B: El conductor de la derecha cede el paso al conductor de la izquierda.
    C: El vehículo que viaja a una velocidad más rápida cede el paso.
    D: El vehículo que parpadea sus faros primero tiene el derecho de paso.
  answer: A
  explanation: En una parada de CUATRO VÍAS, si dos vehículos llegan a la intersección
    al mismo tiempo, el conductor de la izquierda cede el paso al conductor de la
    derecha.
- id: 78
  category: signs_and_signals
  question: ¿Cuál es la forma de una señal de CEDA EL PASO (YIELD)?
  choices:
    A: Octágono (8 lados)
    B: Banderín
    C: Triángulo (3 lados)
    D: Rectángulo vertical
  answer: C
  explanation: El manual establece explícitamente que las señales de CEDA EL PASO
    (YIELD) tienen forma triangular (3 lados).
- id: 79
  category: safe_driving_rules
  question: ¿Cómo debe tratar un conductor una señal de CRUCE DE FERROCARRIL (RAILROAD
    CROSSBUCK)?
  choices:
    A: Como una señal de ALTO (STOP) obligatoria.
    B: Como una señal de CEDA EL PASO (YIELD).
    C: Como una señal de PROHIBIDO EL PASO (DO NOT ENTER).
    D: Como una señal de LÍMITE DE VELOCIDAD.
  answer: B
  explanation: Debe tratar la señal de cruce de ferrocarril (crossbuck) como una señal
    de CEDA EL PASO (YIELD); reduzca la velocidad y prepárese para detenerse si ve
    o escucha que se acerca un tren.
- id: 80
  category: safe_driving_rules
  question: Al girar hacia una carretera dividida en una intersección, ¿qué giros
    están permitidos en la primera y segunda calzada?
  choices:
    A: Giro a la izquierda únicamente en la primera calzada, giro a la derecha únicamente
      en la segunda.
    B: Giro a la derecha únicamente en la primera calzada, giro a la izquierda únicamente
      en la segunda.
    C: Se permiten giros a la derecha en ambas calzadas.
    D: Se permiten giros a la izquierda en ambas calzadas.
  answer: B
  explanation: 'En una carretera dividida, el manual establece: ''En la primera calzada,
    solo puede girar a la derecha, y en la segunda calzada, solo puede girar a la
    izquierda''.'
- id: 81
  category: signs_and_signals
  question: ¿Cuál es el propósito de la señal "CARRIL CENTRAL SOLO PARA GIRAR A LA
    IZQUIERDA" (CENTER LANE LEFT TURN ONLY)?
  choices:
    A: Proporcionar un carril para rebasar vehículos que circulan despacio.
    B: Reservar un carril exclusivamente para vehículos que giran a la izquierda en
      cualquier dirección.
    C: Indicar un carril donde el tráfico directo tiene el derecho de paso.
    D: Designar un carril solo para vehículos de emergencia.
  answer: B
  explanation: Esta señal indica dónde un carril está reservado para el uso exclusivo
    de vehículos que giran a la izquierda en cualquier dirección y no debe usarse
    para tráfico directo o para rebasar.
- id: 82
  category: safe_driving_rules
  question: ¿Qué indica una señal de LÍMITE DE VELOCIDAD (SPEED LIMIT)?
  choices:
    A: La velocidad mínima a la que debe viajar en todas las condiciones.
    B: La velocidad recomendada para condiciones climáticas adversas.
    C: La velocidad máxima legal bajo condiciones ideales.
    D: La velocidad a la que debe conducir durante tráfico pesado.
  answer: C
  explanation: Una señal de LÍMITE DE VELOCIDAD indica la velocidad máxima legal bajo
    condiciones ideales para el tramo de carretera donde está colocada.
- id: 83
  category: defensive_driving
  question: Según el manual, ¿cuál es la razón número uno por la que los conductores
    de 16 y 17 años se ven involucrados en choques?
  choices:
    A: Conducir bajo la influencia del alcohol.
    B: Enviar mensajes de texto mientras conducen.
    C: No ceder el derecho de paso.
    D: Conducir demasiado rápido para las condiciones.
  answer: D
  explanation: 'La sección de Datos de Choques de Adolescentes establece: "Conducir
    demasiado rápido para las condiciones" es la razón número 1 por la que los conductores
    de 16 y 17 años se ven involucrados en choques.'
- id: 84
  category: safe_driving_rules
  question: Si accidentalmente se encuentra en un carril controlado por una señal
    con una flecha de giro y la palabra "ONLY" (SOLO), ¿qué debe hacer?
  choices:
    A: Detenerse y esperar a que el tráfico se despeje antes de cambiar de carril.
    B: Realizar el giro indicado por la flecha.
    C: Continuar recto a través de la intersección con precaución.
    D: Poner su vehículo en reversa y salir del carril.
  answer: B
  explanation: Si se encuentra en un carril controlado por una señal con una flecha
    de giro y la palabra "ONLY", al llegar a la intersección, debe realizar el giro,
    incluso si entró en el carril de giro obligatorio por error.
- id: 85
  category: signs_and_signals
  question: ¿Qué significa la señal "GIRO A LA IZQUIERDA CEDER EL PASO CON LUZ VERDE"
    (LEFT TURN YIELD ON GREEN)?
  choices:
    A: Los giros a la izquierda están protegidos y el tráfico en sentido contrario
      debe detenerse.
    B: Los giros a la izquierda están prohibidos cuando la luz está en verde.
    C: Se permite un giro a la izquierda, pero debe ceder el paso al tráfico en sentido
      contrario.
    D: Debe esperar a una flecha verde para realizar un giro a la izquierda.
  answer: C
  explanation: La señal de GIRO A LA IZQUIERDA CEDER EL PASO CON LUZ VERDE indica
    que se permite un giro a la izquierda, pero debe ceder el paso al tráfico que
    viene en sentido contrario.
- id: 86
  category: penalties_and_points
  question: ¿Cuál es la sanción para los vehículos no autorizados que se estacionan
    en espacios reservados para personas con discapacidad o veteranos con discapacidades
    severas?
  choices:
    A: Una calcomanía de advertencia colocada en el parabrisas.
    B: Una multa y costos de remolque.
    C: Suspensión inmediata de la licencia de conducir.
    D: Puntos añadidos al historial de conducción.
  answer: B
  explanation: Los vehículos no autorizados estacionados en estos espacios reservados
    están sujetos a una multa y costos de remolque.
- id: 87
  category: signs_and_signals
  question: ¿Qué indica la señal "EL TRÁFICO EN SENTIDO CONTRARIO TIENE LUZ VERDE
    EXTENDIDA" (OPPOSING TRAFFIC HAS EXTENDED GREEN)?
  choices:
    A: Usted tiene el derecho de paso para girar a la izquierda.
    B: El tráfico en sentido contrario debe cederle el paso.
    C: El tráfico en sentido contrario puede continuar moviéndose después de que su
      señal haya cambiado a rojo.
    D: El semáforo está descompuesto y debe tratarlo como una parada de cuatro vías.
  answer: C
  explanation: Esta señal se coloca donde el tráfico en sentido contrario puede continuar
    moviéndose después de que su señal haya cambiado a rojo.
- id: 88
  category: signs_and_signals
  question: ¿Cuál es la única señal de advertencia que tiene forma de banderín (triangular
    horizontal)?
  choices:
    A: Señal de Pare Adelante (Stop Sign Ahead)
    B: Ceda el Paso (Yield)
    C: Zona de No Rebasar (No Passing Zone)
    D: Puente Angosto (Narrow Bridge)
  answer: C
  explanation: El manual establece que la señal de Zona de No Rebasar es la única
    señal de advertencia con forma de banderín, y se coloca en el lado izquierdo de
    la carretera de frente al conductor.
- id: 89
  category: signs_and_signals
  question: ¿Qué indica la señal "Giro a la izquierda ceder el paso con flecha amarilla
    intermitente" (Left Turn Yield on Flashing Yellow Arrow)?
  choices:
    A: Los giros a la izquierda están protegidos y el tráfico en sentido contrario
      debe detenerse.
    B: Se permite un giro a la izquierda, pero debe ceder el paso al tráfico en sentido
      contrario.
    C: Los giros a la izquierda están estrictamente prohibidos en esta intersección.
    D: Debe detenerse por completo antes de realizar un giro a la derecha.
  answer: B
  explanation: Esta señal indica que se permite un giro a la izquierda cuando la flecha
    amarilla está parpadeando, pero debe ceder el paso al tráfico en sentido contrario
    porque el giro no está protegido.
- id: 90
  category: signs_and_signals
  question: Una señal de "Camino Sinuoso" (Winding Road) indica que hay ¿cuántas curvas
    seguidas en el camino más adelante?
  choices:
    A: Exactamente dos curvas
    B: Tres o más curvas
    C: Una curva cerrada seguida de una recta
    D: Cuatro o más giros cerrados
  answer: B
  explanation: La señal de Camino Sinuoso (Serie de Curvas) indica que hay tres (3)
    o más curvas seguidas en el camino más adelante.
- id: 91
  category: sharing_the_road
  question: ¿Qué significa una señal de 'Carril Adicional' (Added Lane) para los conductores
    que entran en una carretera?
  choices:
    A: No es necesario incorporarse porque el tráfico que entra utiliza un carril
      nuevo.
    B: El tráfico que entra debe ceder el paso al tráfico que ya está en la carretera
      principal.
    C: El carril de adelante terminará y los conductores deben incorporarse a la izquierda.
    D: El tráfico está saliendo y cruzando su camino.
  answer: A
  explanation: La señal de Carril Adicional significa que no es necesario incorporarse
    porque el tráfico que entra utiliza un carril nuevo que se ha añadido a la carretera.
- id: 92
  category: signs_and_signals
  question: ¿Dónde se coloca normalmente una señal de 'Flecha Grande de Dos Direcciones'
    (Two Direction Large Arrow)?
  choices:
    A: Al principio de una autopista dividida
    B: Antes de un puente estrecho o paso inferior
    C: En el lado opuesto de una intersección en T
    D: En el lado izquierdo de una zona de no rebasar
  answer: C
  explanation: La señal de Flecha Grande de Dos Direcciones se coloca en el lado opuesto
    de una intersección en T para indicarle que solo puede ir a la izquierda o a la
    derecha.
- id: 93
  category: safe_driving_rules
  question: ¿Qué debe hacer al conducir en clima húmedo en un área marcada con una
    señal de 'Resbaladizo cuando está mojado' (Slippery When Wet)?
  choices:
    A: Acelerar rápidamente para pasar el área resbaladiza.
    B: Frenar bruscamente antes de realizar cualquier giro.
    C: Reducir su velocidad y aumentar su distancia de seguimiento.
    D: Mantener su velocidad normal pero permanecer en el carril central.
  answer: C
  explanation: En clima húmedo, debe reducir su velocidad y aumentar su distancia
    de seguimiento. No debe acelerar ni frenar rápidamente.
- id: 94
  category: defensive_driving
  question: Si su vehículo se sale de la calzada y una rueda cae en un arcén bajo
    o blando, ¿qué NO debe hacer?
  choices:
    A: Quitar el pie del pedal del acelerador.
    B: Frenar de golpe o girar bruscamente para volver a la carretera.
    C: Mantener el volante sujeto con firmeza.
    D: Reducir la velocidad gradualmente antes de intentar volver a la carretera.
  answer: B
  explanation: El manual advierte que si una rueda cae en un arcén bajo o blando,
    no debe frenar de golpe ni girar bruscamente para intentar volver a la calzada,
    ya que podría perder fácilmente el control de su vehículo.
- id: 95
  category: vehicle_information
  question: Al acercarse a una colina empinada o una pendiente descendente, ¿qué acción
    debe estar preparado para tomar?
  choices:
    A: Cambiar a una marcha superior para aumentar el impulso.
    B: Cambiar a una marcha inferior para controlar su velocidad y proteger sus frenos.
    C: Mantener presionados los frenos durante todo el descenso.
    D: Poner su vehículo en punto muerto para ahorrar combustible.
  answer: B
  explanation: Cuando hay una señal de Colina/Pendiente (Hill/Downgrade), debe reducir
    la velocidad y estar preparado para cambiar a una marcha inferior para controlar
    su velocidad y evitar el desgaste de sus frenos.
- id: 96
  category: signs_and_signals
  question: ¿Qué colores de fondo puede tener una señal de 'Cruce de bicicletas más
    adelante' (Bicycle Crossing Ahead)?
  choices:
    A: Blanco o plateado
    B: Rojo o naranja
    C: Amarillo o amarillo-verde fluorescente
    D: Verde o azul
  answer: C
  explanation: El manual establece que la señal de Cruce de bicicletas más adelante
    puede tener un fondo amarillo o un fondo amarillo-verde fluorescente.
- id: 97
  category: signs_and_signals
  question: ¿Cuál es la diferencia en la respuesta requerida del conductor entre una
    señal de 'Serie de curvas' (Set of Curves) y una señal de 'Giros bruscos a la
    derecha e izquierda' (Right and Left Sharp Turns)?
  choices:
    A: Una serie de curvas implica tres o más curvas, mientras que los giros bruscos
      implican solo dos.
    B: Una serie de curvas requiere que se detenga, mientras que los giros bruscos
      solo requieren ceder el paso.
    C: Los giros bruscos requieren que reduzca la velocidad sustancialmente, mientras
      que una serie de curvas requiere que reduzca la velocidad y se prepare para
      navegar.
    D: No hay diferencia; se utilizan indistintamente.
  answer: C
  explanation: Para una 'Serie de curvas', debe reducir la velocidad y prepararse
    para navegar. Para 'Giros bruscos a la derecha e izquierda', la carretera gira
    bruscamente, lo que requiere que 'reduzca la velocidad sustancialmente' y se prepare
    para navegar.
- id: 98
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando vea una señal de 'Fin de autopista dividida' (Divided
    Highway Ends)?
  choices:
    A: Mantenerse a la derecha de la línea central y estar atento al tráfico que viene
      en sentido contrario.
    B: Prepararse para incorporarse a un solo carril de tráfico de un solo sentido.
    C: Mantenerse a la izquierda de la mediana.
    D: Acelerar para incorporarse de forma segura al tráfico de la autopista.
  answer: A
  explanation: La señal de 'Fin de autopista dividida' significa que estará en una
    carretera con tráfico de doble sentido. Debe mantenerse a la derecha de la línea
    central y estar atento al tráfico que viene en sentido contrario.
- id: 99
  category: safe_driving_rules
  question: ¿Cómo debe reaccionar al acercarse a una señal de 'Flecha Grande de Una
    Dirección' (One Direction Large Arrow)?
  choices:
    A: Mantener su velocidad y permanecer en el carril izquierdo.
    B: Reducir la velocidad tanto como lo haría para realizar un giro en una intersección.
    C: Detenerse por completo antes de continuar.
    D: Acelerar para navegar el ángulo extremo de forma segura.
  answer: B
  explanation: La 'Flecha Grande de Una Dirección' indica que la carretera cambia
    de dirección en un ángulo extremo. Debe reducir la velocidad tanto como lo haría
    para realizar un giro en una intersección.
- id: 100
  category: signs_and_signals
  question: ¿Qué indica una señal de advertencia de 'Área de entrelazamiento' (Weave
    Area)?
  choices:
    A: La superficie de la carretera es irregular y se requiere zigzaguear para evitar
      baches.
    B: Se incorporará a otra carretera mientras parte del tráfico sale y cruza su
      camino.
    C: El carril de adelante termina y debe entrelazarse en el carril adyacente.
    D: Bicicletas y peatones cruzan frecuentemente la carretera más adelante.
  answer: B
  explanation: La señal de 'Área de entrelazamiento' se utiliza para advertir que
    se incorporará a otra carretera mientras parte del tráfico sale y cruza su camino.
- id: 101
  category: defensive_driving
  question: ¿Por qué debe acercarse a una intersección con precaución adicional cuando
    vea una señal de "Camino entrando en curva"?
  choices:
    A: El camino lateral tiene el derecho de paso sobre el camino principal.
    B: El tráfico que entra desde el camino lateral debe incorporarse a un nuevo carril
      adicional.
    C: Es posible que un conductor que entra al camino principal no pueda verlo acercarse
      desde la curva.
    D: La curva es demasiado cerrada para vehículos que viajan a más de 15 mph.
  answer: C
  explanation: El manual indica que debe acercarse con precaución adicional porque
    un conductor que se prepara para entrar al camino principal podría no verlo acercarse
    desde la curva y podría salir delante de usted.
- id: 102
  category: signs_and_signals
  question: ¿Cuál de las siguientes señales es la única con forma de pentágono que
    se utiliza en la carretera?
  choices:
    A: Señal de Pare (Stop)
    B: Señal de cruce de ferrocarril
    C: Señal de zona escolar
    D: Señal de zona de no rebasar
  answer: C
  explanation: El manual establece que la señal escolar es la única señal con forma
    de pentágono utilizada en la carretera, lo que indica que se está acercando a
    una zona escolar.
- id: 103
  category: safe_driving_rules
  question: Al viajar a través de una zona de obras señalizada, ¿cuándo es obligatorio
    encender las luces delanteras?
  choices:
    A: Solo por la noche
    B: Solo cuando los trabajadores están presentes activamente
    C: Sin importar la hora del día
    D: Solo si está lloviendo o hay niebla
  answer: C
  explanation: El manual establece que debe encender las luces delanteras al viajar
    por una zona de obras, sin importar la hora del día, y es la ley para todas las
    zonas de obras señalizadas.
- id: 104
  category: penalties_and_points
  question: ¿Cuál es la multa adicional si lo detienen por una infracción de tráfico
    en una zona de obras y las luces delanteras de su vehículo no están encendidas?
  choices:
    A: $15
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: Si la policía lo detiene por una infracción de tráfico en una zona
    de obras y las luces delanteras de su vehículo no están encendidas, se le multará
    con $25 adicionales.
- id: 105
  category: signs_and_signals
  question: ¿Qué colores se utilizan normalmente para las señales de zona de obras?
  choices:
    A: Amarillo con letras negras
    B: Naranja con letras negras
    C: Verde con letras blancas
    D: Rojo con letras blancas
  answer: B
  explanation: Las señales de zona de obras normalmente tienen forma de diamante,
    como las señales de advertencia, pero son naranjas con letras negras en lugar
    de amarillas con letras negras.
- id: 106
  category: sharing_the_road
  question: ¿Qué indica una señal de "Bicicletas/Vehículos motorizados comparten el
    camino" cuando se coloca en un punto de estrechamiento de la vía?
  choices:
    A: No se permiten bicicletas en esta sección de la carretera.
    B: Los automovilistas deben proporcionar espacio adecuado para los ciclistas porque
      no hay arcén (hombro) o los carriles son estrechos.
    C: Los ciclistas deben ceder el derecho de paso a los vehículos motorizados en
      todo momento.
    D: Hay un carril para bicicletas separado y designado más adelante.
  answer: B
  explanation: Esta señal se utiliza en puntos de estrechamiento de la vía (sin arcén,
    carriles estrechos, etc.) para advertir a los automovilistas que deben proporcionar
    un espacio adecuado para que los ciclistas compartan la calzada.
- id: 107
  category: signs_and_signals
  question: Al acercarse a un marcador de un objeto adyacente a la carretera, ¿qué
    indican las franjas inclinadas hacia abajo?
  choices:
    A: La dirección de la salida de la autopista más cercana.
    B: La dirección en la que debe moverse para evitar el peligro.
    C: Que debe detenerse por completo.
    D: Que la carretera está cerrada más adelante debido a inundaciones.
  answer: B
  explanation: Los objetos y condiciones al borde de la carretera se indican mediante
    marcadores donde las franjas están inclinadas hacia abajo en la dirección en la
    que debe moverse para evitar el peligro.
- id: 108
  category: signs_and_signals
  question: ¿Cómo define el manual una zona de obras "activa"?
  choices:
    A: Cualquier área donde se coloquen señales naranjas en forma de diamante.
    B: La parte de una zona de obras donde los trabajadores están en la calzada o
      en el arcén (hombro) junto a un carril de circulación abierto.
    C: Un área de construcción donde el límite de velocidad se reduce a 25 mph.
    D: Un área donde se estaciona maquinaria pesada durante la noche.
  answer: B
  explanation: Una zona de obras activa es la parte de una zona de obras donde los
    trabajadores de construcción, mantenimiento o servicios públicos están en la calzada,
    o en el arcén de la carretera junto a un carril de circulación abierto.
- id: 109
  category: signs_and_signals
  question: En las autopistas de Pensilvania, ¿con qué se corresponden los números
    de salida?
  choices:
    A: El año en que se construyó la salida.
    B: El límite de velocidad de la rampa de salida.
    C: Los marcadores de milla.
    D: El número de carreteras que se cruzan.
  answer: C
  explanation: Los números de salida corresponden con los marcadores de milla. Este
    cambio permite a los automovilistas calcular rápidamente las distancias entre
    las salidas.
- id: 110
  category: signs_and_signals
  question: ¿Qué indica un panel amarillo con el mensaje "EXIT ONLY" (Solo salida)
    en una señal de autopista?
  choices:
    A: Solo los vehículos de emergencia pueden usar la salida.
    B: El carril debajo de la señal no continuará a través del intercambio vial y
      formará una rampa.
    C: La salida está cerrada por construcción.
    D: Debe aumentar su velocidad para salir de manera segura.
  answer: B
  explanation: Si hay un panel amarillo con el mensaje EXIT ONLY en una señal de autopista,
    el carril debajo de la señal no continuará a través del intercambio; en su lugar,
    el carril saldrá de la carretera para formar una rampa.
- id: 111
  category: signs_and_signals
  question: ¿En el Sistema de Numeración de Interestatales, qué indican generalmente
    las carreteras interestatales de uno o dos dígitos con números pares?
  choices:
    A: Rutas de norte a sur.
    B: Rutas de este a oeste.
    C: Rutas que conectan directamente con el centro de una ciudad.
    D: Rutas que están actualmente en construcción.
  answer: B
  explanation: Las carreteras interestatales de uno o dos dígitos con números pares
    son generalmente rutas de este a oeste.
- id: 112
  category: signs_and_signals
  question: ¿Qué significa usualmente un número de carretera interestatal de tres
    dígitos que comienza con un número par (como la I-276)?
  choices:
    A: Es una ruta de ramal que conecta solo en un extremo.
    B: Es una ruta que viaja exclusivamente de norte a sur.
    C: Se conecta con carreteras interestatales en ambos extremos, a menudo conocida
      como un bucle o circunvalación (beltway).
    D: Es una carretera de peaje.
  answer: C
  explanation: Si el primero de los tres dígitos es un número par, la carretera suele
    conectar con carreteras interestatales en ambos extremos. Muchas veces, estas
    rutas se conocen como "bucles" o "circunvalaciones" (beltways).
- id: 113
  category: signs_and_signals
  question: ¿Cómo puede saber si una próxima salida de la autopista estará en el lado
    izquierdo de la carretera?
  choices:
    A: La señal de salida estará pintada completamente de amarillo.
    B: El pequeño letrero verde con el número de salida estará en el lado izquierdo
      de la señal rectangular principal.
    C: El número de salida será un número impar.
    D: Habrá una luz roja intermitente sobre la señal.
  answer: B
  explanation: El pequeño letrero verde con el número de SALIDA (EXIT) en la parte
    superior de la señal rectangular verde estará en el lado izquierdo de la señal
    si la salida se encuentra en el lado izquierdo de la autopista.
- id: 114
  category: signs_and_signals
  question: ¿Qué significa si un panel de flecha eléctrica en una zona de obras muestra
    un mensaje de "precaución" en lugar de una flecha direccional?
  choices:
    A: La carretera está completamente cerrada más adelante.
    B: Debe detenerse inmediatamente en el arcén (shoulder).
    C: Hay un área de trabajo más adelante junto al carril de circulación.
    D: Se está aproximando a un cruce de ferrocarril.
  answer: C
  explanation: Un panel de flecha que muestra un mensaje de precaución indica que
    hay un área de trabajo más adelante junto al carril de circulación. Conduzca con
    precaución adicional.
- id: 115
  category: signs_and_signals
  question: ¿De qué color son la mayoría de las señales de guía en autopistas y autovías?
  choices:
    A: Rojas con letras blancas
    B: Amarillas con letras negras
    C: Verdes con letras blancas
    D: Azules con letras blancas
  answer: C
  explanation: El manual establece que las señales de guía en autopistas y autovías
    son verdes con letras blancas.
- id: 116
  category: signs_and_signals
  question: ¿Cuáles de los siguientes se utilizan en las zonas de obras para guiarlo
    a través de cambios en los patrones de tráfico y mantenerlo alejado de los peligros?
  choices:
    A: Paneles de flechas eléctricas
    B: Señales en forma de pentágono
    C: Barriles, tubos, conos y paneles verticales
    D: Escudos rojos, blancos y azules
  answer: C
  explanation: Los barriles, tubos, conos y paneles verticales son todos dispositivos
    de canalización utilizados en zonas de obras para guiarlo a través de cambios
    en los patrones de tráfico y mantenerlo alejado de los peligros asociados con
    el trabajo en la carretera.
- id: 117
  category: signs_and_signals
  question: En las carreteras de este a oeste en Pensilvania, ¿dónde comienzan en
    cero los números de los marcadores de milla?
  choices:
    A: En la parte este del estado
    B: En la parte oeste del estado
    C: En el centro del estado
    D: En la ciudad más grande de la ruta
  answer: B
  explanation: Según el manual, los números de los marcadores de milla comienzan en
    cero en la parte oeste del estado para las carreteras de este a oeste y aumentan
    a medida que se viaja hacia el este.
- id: 118
  category: safe_driving_rules
  question: ¿Cuál es un beneficio práctico de saber leer los marcadores de milla en
    la autopista?
  choices:
    A: Le indican el límite de velocidad actual de la autopista.
    B: Indican la distancia exacta hasta la próxima parada de descanso.
    C: Le ayudan a dar una ubicación aproximada si necesita llamar para solicitar
      asistencia en carretera.
    D: Muestran el número de millas que faltan para la próxima frontera estatal.
  answer: C
  explanation: El manual establece que saber leer los marcadores de milla puede ayudarle
    a saber exactamente dónde se encuentra y dar una ubicación aproximada si tiene
    que llamar para solicitar asistencia en carretera.
- id: 119
  category: signs_and_signals
  question: ¿De qué color son las señales de servicio que muestran la ubicación de
    hospitales, comida y alojamiento en la próxima salida?
  choices:
    A: Verdes con letras blancas
    B: Azules con letras o símbolos blancos
    C: Marrones con letras blancas
    D: Amarillas con letras negras
  answer: B
  explanation: Las señales de servicio son cuadradas o rectangulares, son azules con
    letras o símbolos blancos, y muestran la ubicación de varios servicios situados
    en la próxima salida.
- id: 120
  category: signs_and_signals
  question: ¿Qué colores se utilizan típicamente para las señales de orientación turística
    que dirigen a los automovilistas hacia museos o parques estatales?
  choices:
    A: Rojo o naranja con letras negras
    B: Verde o amarillo con letras negras
    C: Azul o marrón con letras blancas
    D: Negro o blanco con letras rojas
  answer: C
  explanation: Las señales de orientación turística son cuadradas o rectangulares
    y pueden ser azules o marrones con letras blancas.
- id: 121
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de las líneas amarillas en el pavimento?
  choices:
    A: Dividir los carriles de tráfico que viajan en la misma dirección
    B: Marcar el borde derecho de la carretera
    C: Dividir el tráfico que viaja en direcciones opuestas
    D: Indicar un carril reservado para bicicletas
  answer: C
  explanation: El manual establece que las líneas amarillas dividen el tráfico que
    viaja en direcciones opuestas y se utilizan para marcar el centro de las carreteras
    de dos carriles.
- id: 122
  category: signs_and_signals
  question: ¿Qué marcas en el pavimento se utilizan para dividir los carriles de tráfico
    que viajan en la misma dirección y para marcar el borde derecho de la carretera?
  choices:
    A: Líneas blancas continuas
    B: Líneas amarillas discontinuas
    C: Líneas amarillas continuas
    D: Líneas amarillas dobles
  answer: A
  explanation: Las líneas blancas continuas dividen los carriles de tráfico que viajan
    en la misma dirección y también se utilizan para marcar el borde derecho de la
    carretera.
- id: 123
  category: safe_driving_rules
  question: ¿Qué indica una línea central amarilla doble y continua en una carretera
    de doble sentido?
  choices:
    A: Se permite rebasar para el tráfico en ambas direcciones.
    B: No se permite rebasar al tráfico que viaja en ninguna de las dos direcciones.
    C: Solo el tráfico del lado derecho puede rebasar.
    D: El carril está reservado solo para giros a la izquierda.
  answer: B
  explanation: Una línea central amarilla doble y continua muestra el centro de una
    carretera de doble sentido donde no se permite rebasar al tráfico que viaja en
    ninguna de las dos direcciones.
- id: 124
  category: safe_driving_rules
  question: Al conducir en una carretera de doble sentido con una combinación de una
    línea central amarilla continua y una discontinua, ¿cuándo se le permite rebasar?
  choices:
    A: Solo cuando la línea amarilla continua está de su lado de la carretera
    B: Solo cuando la línea amarilla discontinua está de su lado de la carretera
    C: Siempre que no haya tráfico en sentido contrario, independientemente de las
      líneas
    D: Nunca se permite rebasar en este tipo de carretera
  answer: B
  explanation: Puede rebasar si la línea discontinua está de su lado de la carretera
    y existen condiciones seguras, pero no puede rebasar cuando una línea amarilla
    continua está de su lado.
- id: 125
  category: safe_driving_rules
  question: En una carretera de tres o cinco carriles, ¿cuál es el propósito de un
    carril central marcado por líneas amarillas discontinuas en el interior y líneas
    amarillas continuas en el exterior?
  choices:
    A: Es un carril de circulación normal para rebasar vehículos más lentos.
    B: Está reservado exclusivamente para vehículos de emergencia.
    C: Los vehículos que viajan en cualquier dirección pueden usarlo solo para hacer
      giros a la izquierda.
    D: Es un carril reversible para el tráfico en horas pico.
  answer: C
  explanation: Las líneas centrales amarillas discontinuas interiores y amarillas
    continuas exteriores indican que los vehículos que viajan en cualquier dirección
    pueden usar el carril central solo para realizar giros a la izquierda.
- id: 126
  category: signs_and_signals
  question: En una carretera de acceso limitado con una mediana, ¿cómo se marcan los
    bordes izquierdo y derecho de la calzada?
  choices:
    A: Ambos bordes están marcados con líneas blancas continuas.
    B: Ambos bordes están marcados con líneas amarillas continuas.
    C: El borde derecho es una línea amarilla continua y el borde izquierdo es una
      línea blanca continua.
    D: El borde derecho es una línea blanca continua y el borde izquierdo es una línea
      amarilla continua.
  answer: D
  explanation: En las carreteras de acceso limitado con medianas, el borde derecho
    de la carretera está marcado con una línea blanca continua, y el borde izquierdo
    de cada lado está marcado por una línea amarilla continua.
- id: 127
  category: safe_driving_rules
  question: Si se aproxima a un cruce de ferrocarril que no tiene señales, ¿cuál es
    la acción más segura?
  choices:
    A: Proceder lo más rápido posible sobre las vías
    B: Reducir la velocidad y prepararse para detenerse si ve o escucha que se acerca
      un tren
    C: Detenerse por completo independientemente de si viene un tren
    D: Cruzar el cruce a una velocidad normal
  answer: B
  explanation: Si no hay señales en un cruce de ferrocarril, debe reducir la velocidad
    y prepararse para detenerse si ve o escucha que se acerca un tren.
- id: 128
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias puede conducir rodeando las barreras cerradas
    en un cruce de ferrocarril?
  choices:
    A: Cuando pueda ver claramente que el tren ha pasado
    B: Cuando las luces rojas hayan dejado de parpadear pero la barrera esté atascada
    C: Cuando otros conductores estén rodeando las barreras
    D: Nunca
  answer: D
  explanation: La sección de revisión del manual establece explícitamente que nunca
    debe conducir rodeando las barreras en un cruce de ferrocarril.
- id: 129
  category: signs_and_signals
  question: ¿Cuál es el significado general de una señal amarilla y negra en forma
    de diamante?
  choices:
    A: Ayuda a dirigirlo hacia ciudades y pueblos más adelante
    B: Le informa sobre las leyes y regulaciones de tránsito
    C: Le advierte sobre condiciones en la carretera o cerca de ella
    D: Marca una zona escolar
  answer: C
  explanation: Una señal amarilla y negra en forma de diamante es una señal de advertencia
    que le avisa sobre condiciones en la carretera o cerca de ella.
- id: 130
  category: signs_and_signals
  question: ¿Qué indica una señal amarilla y negra en forma de diamante?
  choices:
    A: Ayuda a dirigirlo hacia ciudades y pueblos más adelante
    B: Le advierte sobre condiciones en la carretera o cerca de ella
    C: Le informa sobre las leyes y regulaciones de tránsito
    D: Le informa sobre obras viales más adelante
  answer: B
  explanation: Una señal amarilla y negra en forma de diamante le advierte sobre condiciones
    en la carretera o cerca de ella.
- id: 131
  category: signs_and_signals
  question: ¿Cuál es el orden correcto de las luces del semáforo de arriba hacia abajo?
  choices:
    A: Rojo, amarillo, verde
    B: Rojo, verde, amarillo
    C: Verde, rojo, amarillo
    D: Verde, amarillo, rojo
  answer: A
  explanation: De arriba hacia abajo, el orden correcto de las luces del semáforo
    es rojo, amarillo y verde.
- id: 132
  category: signs_and_signals
  question: Si una flecha verde se convierte en una luz verde fija, ¿qué debe hacer?
  choices:
    A: Ya no puede girar y debe seguir recto
    B: Todavía tiene el derecho de paso exclusivo para girar
    C: Debe detenerse y esperar a la siguiente flecha verde
    D: Aún puede girar, pero debe ceder el paso al tráfico que viene en sentido contrario
  answer: D
  explanation: Si una flecha verde se convierte en una luz verde, aún puede girar,
    pero debe ceder el paso al tráfico que viene en sentido contrario.
- id: 133
  category: signs_and_signals
  question: ¿Qué significa una luz amarilla fija en una intersección?
  choices:
    A: Avanzar
    B: Ceder el paso a otros autos
    C: Reducir la velocidad y prepararse para detenerse
    D: Detenerse inmediatamente
  answer: C
  explanation: Una luz amarilla fija en una intersección significa que debe reducir
    la velocidad y prepararse para detenerse.
- id: 134
  category: signs_and_signals
  question: ¿Qué debe hacer cuando se encuentra con una luz amarilla intermitente?
  choices:
    A: Reducir la velocidad y proceder con cuidado
    B: Continuar a su velocidad normal si el camino está despejado
    C: Detenerse y proceder cuando aparezca una luz verde
    D: Detenerse y proceder cuando el camino esté despejado
  answer: A
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y proceder con cuidado.
- id: 135
  category: signs_and_signals
  question: ¿Cuál de las siguientes señales requiere que se detenga por completo?
  choices:
    A: Una luz roja intermitente
    B: Una luz amarilla fija
    C: Una flecha amarilla
    D: Una luz amarilla intermitente
  answer: A
  explanation: Debe detenerse cuando vea una luz roja intermitente.
- id: 136
  category: safe_driving_rules
  question: ¿Bajo qué condición puede continuar con cuidado a través de una luz amarilla?
  choices:
    A: Si hay un vehículo de emergencia cruzando su carril
    B: Si no hay peatones cruzando
    C: Si está girando a la derecha
    D: Si ya se encuentra dentro de la intersección
  answer: D
  explanation: Puede continuar con cuidado a través de una luz amarilla si se encuentra
    dentro de la intersección.
- id: 137
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima a una intersección donde el semáforo está
    roto o no funciona?
  choices:
    A: Detenerse y esperar a que sea reparado
    B: Detenerse y esperar a que llegue un oficial de policía
    C: Continuar como si fuera una señal de alto de cuatro vías (four-way stop)
    D: Continuar como lo haría normalmente
  answer: C
  explanation: Si un semáforo está roto o no funciona, debe continuar como si fuera
    una señal de alto de cuatro vías.
- id: 138
  category: safe_driving_rules
  question: ¿Qué debe hacer antes de girar a la derecha con luz roja?
  choices:
    A: Detenerse primero y verificar el tráfico y los peatones
    B: Asegurarse de tener una flecha roja de giro a la derecha
    C: Moverse al carril izquierdo
    D: Reducir la velocidad primero sin detenerse por completo
  answer: A
  explanation: Puede girar a la derecha en rojo si se detiene primero y verifica el
    tráfico y los peatones.
- id: 139
  category: signs_and_signals
  question: ¿De qué color son las líneas que dividen los carriles de tráfico que se
    mueven en la misma dirección?
  choices:
    A: Amarillo
    B: Blanco
    C: Rojo
    D: Negro
  answer: B
  explanation: Los carriles de tráfico que se mueven en la misma dirección están divididos
    por líneas blancas.
- id: 140
  category: safe_driving_rules
  question: ¿En qué tipo de línea central NO se le permite rebasar a otro auto por
    ningún lado?
  choices:
    A: Combinación de línea amarilla continua y discontinua
    B: Línea amarilla discontinua simple
    C: Doble línea amarilla continua
    D: Línea blanca discontinua simple
  answer: C
  explanation: No puede rebasar a otro auto por ningún lado de una doble línea amarilla
    continua central.
- id: 141
  category: safe_driving_rules
  question: ¿Qué debe hacer si no puede ver bien el tráfico de la calle transversal
    cuando se detiene detrás de la línea blanca superior pintada en el pavimento en
    una señal de alto?
  choices:
    A: Tocar la bocina antes de avanzar
    B: Esperar 5 segundos y luego avanzar
    C: Avanzar lentamente, verificar el tráfico y los peatones, y proceder cuando
      esté despejado
    D: Bajar las ventanillas, escuchar el tráfico y luego avanzar
  answer: C
  explanation: Según el manual, si no puede ver bien el tráfico de la calle transversal
    cuando se detiene detrás de la línea blanca superior, debe avanzar lentamente,
    verificar el tráfico y los peatones, y proceder cuando esté despejado.
- id: 142
  category: signs_and_signals
  question: ¿Qué indican los límites de velocidad publicados?
  choices:
    A: El límite de velocidad legal mínimo
    B: La velocidad máxima segura bajo condiciones ideales de la carretera y el clima
    C: La velocidad exacta a la que debe viajar para evitar una multa
    D: La velocidad máxima segura bajo todas las condiciones de la carretera
  answer: B
  explanation: Los límites de velocidad publicados muestran la velocidad máxima segura
    bajo condiciones ideales de la carretera y el clima.
- id: 143
  category: safe_driving_rules
  question: ¿Qué maniobra puede realizar legalmente desde el carril central?
  choices:
    A: Girar a la izquierda
    B: Hacer giros en U
    C: Rebasar el tráfico que se mueve más lento
    D: Estacionar su vehículo
  answer: A
  explanation: Según la sección de prueba del manual, girar a la izquierda es la maniobra
    correcta que puede realizar desde el carril central.
- id: 144
  category: vehicle_information
  question: ¿Cuál es el mejor momento para revisar la presión de los neumáticos de
    su vehículo?
  choices:
    A: Inmediatamente después de conducir por la autopista
    B: Cuando los neumáticos están 'fríos', antes de haber conducido o al menos tres
      horas después de conducir
    C: Mientras el vehículo está en marcha
    D: Solo durante los meses de verano
  answer: B
  explanation: El manual indica revisar los neumáticos 'fríos', es decir, antes de
    haber conducido o al menos tres horas después de haber conducido.
- id: 145
  category: vehicle_information
  question: Al usar la prueba de la moneda de un centavo para revisar el desgaste
    de los neumáticos, ¿qué indica que está conduciendo con una cantidad segura de
    banda de rodadura?
  choices:
    A: Puede ver toda la cabeza de Abraham Lincoln
    B: La moneda se cae cuando se coloca en la ranura
    C: Cualquier parte de la cabeza de Abraham Lincoln está cubierta por la banda
      de rodadura
    D: La banda de rodadura está completamente lisa
  answer: C
  explanation: Si cualquier parte de la cabeza de Lincoln está cubierta por la banda
    de rodadura durante la prueba de la moneda, está conduciendo con la cantidad segura
    de banda de rodadura.
- id: 146
  category: safe_driving_rules
  question: ¿Por qué es peligroso dejar objetos sueltos en el compartimento de pasajeros
    de su vehículo?
  choices:
    A: Pueden causar que el vehículo pierda presión en los neumáticos
    B: Se convierten en proyectiles en un choque que continúan viajando a la velocidad
      del vehículo previa al impacto
    C: Aumentan el consumo de combustible del vehículo
    D: Pueden causar envenenamiento por monóxido de carbono
  answer: B
  explanation: En un choque, los objetos sueltos en su vehículo se convierten en proyectiles
    que continúan viajando a la misma velocidad a la que se movía su vehículo antes
    del impacto.
- id: 147
  category: vehicle_information
  question: Al ajustar los espejos laterales para eliminar los puntos ciegos, ¿cómo
    deben configurarse?
  choices:
    A: Para que pueda ver el tráfico directamente detrás de su vehículo
    B: Para que pueda ver todo el costado de su vehículo sin inclinarse
    C: Para que cuando se incline hacia la izquierda o hacia la derecha apenas pueda
      ver el costado de su vehículo
    D: Para que apunten directamente al suelo
  answer: C
  explanation: Los espejos laterales deben ajustarse de modo que, al inclinarse hacia
    la izquierda o hacia la derecha, apenas pueda ver el costado de su vehículo.
- id: 148
  category: penalties_and_points
  question: ¿Cuál es la ley de Pensilvania con respecto a colgar objetos del espejo
    retrovisor?
  choices:
    A: Es legal siempre que el objeto sea menor de 3 pulgadas
    B: Es contra la ley tener cualquier objeto colgando del espejo retrovisor mientras
      el vehículo está en movimiento
    C: Solo se permite colgar permisos de estacionamiento mientras se conduce
    D: Se requieren objetos colgantes para identificar a los conductores nuevos
  answer: B
  explanation: Es contra la ley tener cualquier objeto o material colgando del espejo
    retrovisor mientras el vehículo está en movimiento. Las etiquetas, permisos y
    carteles solo pueden colocarse cuando el vehículo está estacionado.
- id: 149
  category: alcohol_drugs_health
  question: Mantener un suministro constante de aire fresco en su vehículo le ayuda
    a mantenerse alerta y le protege contra ¿qué peligro?
  choices:
    A: Envenenamiento por monóxido de carbono (gas de escape)
    B: Envenenamiento por dióxido de nitrógeno
    C: Deshidratación
    D: Mareo por movimiento
  answer: A
  explanation: Mantener un suministro constante de aire fresco en su vehículo le ayuda
    a mantenerse alerta y le protege contra el envenenamiento por monóxido de carbono
    (gas de escape) cuando conduce.
- id: 150
  category: vehicle_information
  question: ¿Cómo debe ajustar correctamente el reposacabezas de su vehículo?
  choices:
    A: Para que la parte inferior del reposacabezas descanse sobre sus hombros
    B: Para que la parte superior del reposacabezas esté al menos tan alta como la
      parte superior de sus orejas
    C: Para que se coloque directamente detrás de su cuello
    D: Para que se retire por completo para una mejor visibilidad
  answer: B
  explanation: Ajuste su reposacabezas de modo que la parte superior del mismo esté
    al menos tan alta como la parte superior de sus orejas para prevenir o reducir
    la gravedad de las lesiones en el cuello en un choque.
- id: 151
  category: safe_driving_rules
  question: Según el manual, ¿en qué porcentaje aumenta sus probabilidades de morir
    el ser expulsado de un vehículo durante un choque?
  choices:
    A: 25 por ciento
    B: 50 por ciento
    C: 75 por ciento
    D: 90 por ciento
  answer: C
  explanation: Ser expulsado de un vehículo aumenta sus probabilidades de morir en
    un 75 por ciento. Cerrar sus puertas con llave y usar el cinturón de seguridad
    ayuda a asegurar que no sea expulsado de su vehículo.
- id: 152
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto al uso de auriculares o audífonos mientras
    se conduce?
  choices:
    A: Se pueden usar en ambos oídos si se está escuchando un GPS
    B: Solo se pueden usar en un oído para fines de comunicación
    C: Es completamente ilegal usarlos en cualquier momento
    D: Se pueden usar en ambos oídos para escuchar música
  answer: B
  explanation: 'NOTA: los auriculares/audífonos solo pueden usarse en un oído para
    fines de comunicación.'
- id: 153
  category: driver_responsibility
  question: 'Las estadísticas muestran que un conductor adolescente tiene más probabilidades
    de tener un choque si conduce:'
  choices:
    A: Solo
    B: Con pasajeros adultos
    C: Con otros adolescentes como pasajeros
    D: Durante las horas de la mañana
  answer: C
  explanation: Si usted es un conductor adolescente con otros adolescentes como pasajeros,
    las estadísticas muestran que tiene más probabilidades de tener un choque que
    si conduce solo o con pasajeros adultos.
- id: 154
  category: defensive_driving
  question: ¿La distracción del conductor y la falta de atención a las condiciones
    de la carretera y del tráfico son responsables de qué porcentaje de los choques
    de tráfico reportados por la policía?
  choices:
    A: 10 al 15 por ciento
    B: 25 al 30 por ciento
    C: 45 al 50 por ciento
    D: 75 al 80 por ciento
  answer: B
  explanation: La distracción del conductor y la falta de atención a las condiciones
    de la carretera y del tráfico son responsables del 25 al 30 por ciento de los
    choques de tráfico reportados por la policía.
- id: 155
  category: defensive_driving
  question: Según las investigaciones, ¿con qué frecuencia un adolescente que marca
    un número en un teléfono celular se pierde un evento importante en la carretera?
  choices:
    A: 3 por ciento de las veces
    B: 13 por ciento de las veces
    C: 25 por ciento de las veces
    D: 53 por ciento de las veces
  answer: D
  explanation: Las investigaciones han encontrado que un conductor normal y sin distracciones
    no nota un evento importante en la carretera el 3 por ciento de las veces, un
    adulto que marca un número en un teléfono celular se lo pierde el 13 por ciento
    de las veces, y un adolescente que marca un número en un teléfono celular se lo
    pierde el 53 por ciento de las veces.
- id: 156
  category: alcohol_drugs_health
  question: 'Estar despierto durante 18 horas afecta su conducción casi tanto como
    tener un nivel de alcohol en sangre de:'
  choices:
    A: .02 por ciento
    B: .05 por ciento
    C: .08 por ciento
    D: .10 por ciento
  answer: B
  explanation: El manual establece que estar despierto durante 18 horas afecta su
    conducción casi tanto como un nivel de alcohol en sangre del .05 por ciento.
- id: 157
  category: safe_driving_rules
  question: ¿Qué es lo mejor que puede hacer si comienza a sentirse cansado mientras
    conduce?
  choices:
    A: Beber café o una bebida con cafeína
    B: Abrir las ventanas para que entre aire fresco
    C: Dejar de conducir
    D: Subir el volumen de la radio
  answer: C
  explanation: El manual establece explícitamente que lo mejor que puede hacer si
    comienza a sentirse cansado mientras conduce es dejar de conducir.
- id: 158
  category: alcohol_drugs_health
  question: ¿Con qué frecuencia debe revisarse la vista para garantizar una conducción
    segura?
  choices:
    A: Cada seis meses
    B: Cada uno o dos años
    C: Cada tres a cinco años
    D: Solo al renovar su licencia
  answer: B
  explanation: El manual recomienda revisarse la vista cada uno o dos años porque
    la visión periférica, el juicio de la distancia y la visión con poca luz pueden
    deteriorarse con el tiempo.
- id: 159
  category: alcohol_drugs_health
  question: En Pensilvania, ¿qué deben hacer los médicos si diagnostican a un paciente
    con una afección que podría afectar la conducción segura?
  choices:
    A: Confiscar la licencia de conducir del paciente
    B: Informar a la persona a PennDOT
    C: Recetar medicamentos antes de permitirle conducir
    D: Notificar a la compañía de seguros del paciente
  answer: B
  explanation: En Pensilvania, los médicos deben informar a PennDOT sobre las personas
    a las que han diagnosticado una afección que podría afectar su capacidad para
    conducir de manera segura.
- id: 160
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años, se considera que conduce bajo la influencia (DUI)
    si su concentración de alcohol en sangre (BAC) es igual o superior a:'
  choices:
    A: .00 por ciento
    B: .02 por ciento
    C: .04 por ciento
    D: .08 por ciento
  answer: B
  explanation: Si usted es un conductor menor de 21 años y su concentración de alcohol
    en sangre (BAC) es de .02 por ciento o más, se considera que está conduciendo
    bajo la influencia (DUI).
- id: 161
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes se considera equivalente a una bebida estándar?
  choices:
    A: 8 oz de cerveza regular
    B: 5 oz de vino
    C: 2 oz de licor de 80 grados (80 proof)
    D: 16 oz de cerveza ligera
  answer: B
  explanation: Debe considerar que una bebida equivale a 1.5 oz de licor de 80 grados
    (80 proof), 12 oz de cerveza regular o 5 oz de vino.
- id: 162
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de reducir su nivel de concentración
    de alcohol en sangre (BAC)?
  choices:
    A: Beber café
    B: Tomar una ducha fría
    C: Comer una comida pesada
    D: Dejar que pase el tiempo
  answer: D
  explanation: El manual establece que solo el tiempo lo "sobriará". No puede reducir
    su BAC bebiendo café, bebidas con cafeína o tomando una ducha fría.
- id: 163
  category: alcohol_drugs_health
  question: Incluso si su nivel de alcohol en sangre es de .04 por ciento, ¿qué tan
    probable es que se vea involucrado en un choque en comparación con un conductor
    que no tiene alcohol en la sangre?
  choices:
    A: De dos a siete veces más probable
    B: Diez veces más probable
    C: Veinte veces más probable
    D: Cincuenta veces más probable
  answer: A
  explanation: Los conductores cuyo nivel de alcohol en sangre es de .04 tienen entre
    dos y siete veces más probabilidades de verse involucrados en un choque que los
    conductores que no tienen alcohol en la sangre.
- id: 164
  category: alcohol_drugs_health
  question: ¿Cómo puede afectar la marihuana su capacidad para conducir de manera
    segura?
  choices:
    A: Causa una conducción agresiva y temeraria
    B: Mejora el juicio de la distancia
    C: Retrasa el tiempo de reacción y afecta el juicio del tiempo y la distancia
    D: Aumenta la coordinación y el estado de alerta
  answer: C
  explanation: La marihuana puede retrasar el tiempo de reacción, afectar el juicio
    del tiempo y la distancia, y disminuir la coordinación.
- id: 165
  category: alcohol_drugs_health
  question: Cuando la etiqueta de advertencia de un medicamento indica "No operar
    maquinaria pesada", ¿qué significa esto para un conductor?
  choices:
    A: Puede conducir un automóvil estándar, pero no un camión comercial
    B: Su vehículo se considera maquinaria pesada, por lo que no debe conducir
    C: Puede conducir siempre que se sienta alerta
    D: Debe conducir por debajo del límite de velocidad
  answer: B
  explanation: 'El manual recuerda a los conductores: "Cuando la etiqueta de advertencia
    dice: No opere maquinaria pesada, ¡su vehículo se considera maquinaria pesada!".'
- id: 166
  category: driver_responsibility
  question: ¿Los conductores con menos de cuántos años de experiencia tienen más probabilidades
    de cometer errores que provoquen choques?
  choices:
    A: Un año
    B: Tres años
    C: Cinco años
    D: Diez años
  answer: C
  explanation: Los conductores con menos de cinco (5) años de experiencia tienen más
    probabilidades de cometer errores que provoquen choques.
- id: 167
  category: safe_driving_rules
  question: ¿Cuál es el tipo principal de choque número uno en el que se ven involucrados
    los nuevos conductores (de 16 y 17 años) en Pensilvania?
  choices:
    A: Chocar por detrás a otro vehículo
    B: Chocar contra un objeto fijo
    C: Colisiones frontales
    D: Rozar lateralmente a un vehículo al rebasar
  answer: B
  explanation: 'Los principales tipos de choques en los que se ven involucrados los
    nuevos conductores (de 16 y 17 años) en Pensilvania incluyen: 1) Chocar contra
    un objeto fijo.'
- id: 168
  category: alcohol_drugs_health
  question: Según una encuesta de la NHTSA, ¿qué porcentaje de conductores que murieron
    en choques dieron positivo en la prueba de drogas?
  choices:
    A: 20%
    B: 30%
    C: 37%
    D: 43%
  answer: D
  explanation: Según la Encuesta de Carretera 2013-2014 de la NHTSA mencionada en
    el manual, el 43% de los conductores que murieron en choques dieron positivo en
    la prueba de drogas.
- id: 169
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento segura recomendada en condiciones
    normales y secas?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: C
  explanation: Una distancia de seguimiento de 4 segundos le permitirá maniobrar o
    frenar para evitar un peligro de manera segura en la carretera, si el pavimento
    está seco.
- id: 170
  category: defensive_driving
  question: ¿Qué debe hacer si otro conductor lo sigue demasiado de cerca (siguiéndolo
    muy de cerca o "tailgating")?
  choices:
    A: Acelerar para aumentar la distancia entre ustedes.
    B: Cambiarse al carril derecho si es posible.
    C: Frenar bruscamente para advertirles.
    D: Cambiarse al carril izquierdo y mantener su velocidad.
  answer: B
  explanation: Si ve que alguien lo sigue demasiado de cerca (tailgating), cámbiese
    al carril derecho, si es posible. También puede tocar los frenos suavemente para
    reducir la velocidad poco a poco y animarlos a rebasar.
- id: 171
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe mirar hacia adelante para identificar situaciones
    problemáticas a tiempo?
  choices:
    A: De 3 a 5 segundos de anticipación
    B: De 6 a 8 segundos de anticipación
    C: De 12 a 15 segundos de anticipación
    D: De 20 a 30 segundos de anticipación
  answer: C
  explanation: Debe ser capaz de identificar situaciones problemáticas con una anticipación
    de 12 a 15 segundos; aproximadamente una cuadra en la ciudad o un cuarto de milla
    a velocidades de autopista.
- id: 172
  category: defensive_driving
  question: Al llegar a una intersección, ¿por qué debe mirar primero hacia la izquierda?
  choices:
    A: Los vehículos que vienen de la izquierda están más cerca de usted.
    B: Los vehículos que vienen de la izquierda tienen el derecho de paso.
    C: Es más fácil ver los vehículos a la izquierda.
    D: Los vehículos a la izquierda suelen viajar más rápido.
  answer: A
  explanation: 'Cuando llegue a una intersección, siga la regla de "izquierda-derecha-izquierda":
    mire primero a la izquierda, porque los vehículos que vienen de la izquierda están
    más cerca de usted.'
- id: 173
  category: safe_driving_rules
  question: ¿Cuál es la mejor manera de revisar los puntos ciegos en las áreas trasera
    izquierda y trasera derecha de su vehículo?
  choices:
    A: Mirar por el espejo retrovisor.
    B: Mirar por los espejos laterales.
    C: Girar la cabeza antes de cambiar de carril.
    D: Confiar en la cámara de reversa de su vehículo.
  answer: C
  explanation: Las áreas trasera izquierda y trasera derecha son puntos ciegos; revíselas
    siempre girando la cabeza antes de cambiar de carril.
- id: 174
  category: defensive_driving
  question: Si conduce por una carretera con vehículos estacionados a su derecha y
    vehículos que vienen en sentido contrario a su izquierda, ¿cuál es la mejor acción
    a seguir?
  choices:
    A: Conducir más cerca de los vehículos estacionados para evitar el tráfico en
      sentido contrario.
    B: Conducir más cerca de los vehículos en sentido contrario para evitar que se
      abran puertas.
    C: Aumentar la velocidad para pasar el peligro rápidamente.
    D: Reducir la velocidad y mantener un curso intermedio entre los vehículos que
      vienen en sentido contrario y los estacionados.
  answer: D
  explanation: Si hay vehículos estacionados a su derecha y vehículos que vienen en
    sentido contrario a su izquierda, lo mejor es reducir la velocidad y "dividir
    la diferencia" manteniendo un curso intermedio entre ellos.
- id: 175
  category: driver_responsibility
  question: ¿Cuál de los siguientes es uno de los cuatro tipos principales de choques
    que involucran a conductores de 16 y 17 años en Pensilvania?
  choices:
    A: Colisiones por raspado lateral (sideswipe)
    B: Chocar contra un objeto fijo
    C: Chocar en reversa contra autos estacionados
    D: Choques con volcadura
  answer: B
  explanation: 'Los principales tipos de choques para conductores nuevos incluyen:
    1) Chocar contra un objeto fijo; 2) Choques en intersecciones de caminos; 3) Colisiones
    por alcance (traseras); y 4) Colisiones frontales.'
- id: 176
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes condiciones debe permitir una distancia de
    seguimiento mayor a la habitual?
  choices:
    A: Al conducir por una carretera recién pavimentada.
    B: Al seguir a una motocicleta.
    C: Al conducir cuesta abajo.
    D: Al conducir por el carril izquierdo.
  answer: C
  explanation: Debe permitir una distancia de seguimiento mayor cuando conduzca cuesta
    abajo porque es más difícil que los frenos reduzcan la velocidad de su vehículo,
    especialmente a altas velocidades.
- id: 177
  category: defensive_driving
  question: Si no tiene al menos ocho pies de espacio en al menos un lado de su vehículo
    para una ruta de escape, ¿qué debe hacer?
  choices:
    A: Moverse al carril izquierdo inmediatamente.
    B: Dejar más espacio hacia adelante aumentando su distancia de seguimiento.
    C: Tocar la bocina para advertir a otros conductores.
    D: Acelerar para salir del área restringida.
  answer: B
  explanation: Si no tiene al menos ocho (8) pies de espacio en al menos un lado de
    su vehículo para usar como ruta de escape, deberá dejar más espacio hacia adelante
    aumentando su distancia de seguimiento.
- id: 178
  category: sharing_the_road
  question: ¿Por qué necesita espacio adicional adelante cuando sigue a un vehículo
    grande que bloquea su visión?
  choices:
    A: Para evitar los gases de escape del vehículo grande.
    B: Para tener espacio adicional para ver alrededor del vehículo.
    C: Porque los vehículos grandes viajan más rápido que los automóviles de pasajeros.
    D: Porque los vehículos grandes tienen luces de freno más brillantes.
  answer: B
  explanation: Debe permitir una distancia de seguimiento mayor cuando siga a un vehículo
    grande que bloquee su visión del camino porque necesita espacio adicional para
    ver alrededor del vehículo.
- id: 179
  category: defensive_driving
  question: ¿Qué debe hacer si su visión de la calle transversal en una intersección
    está bloqueada por edificios, arbustos o vehículos estacionados?
  choices:
    A: Tocar la bocina y avanzar a su velocidad normal.
    B: Esperar a que otro vehículo salga y seguirlo.
    C: Avanzar lentamente hasta que pueda ver con claridad.
    D: Girar a la derecha en lugar de seguir recto.
  answer: C
  explanation: Si su visión de la calle transversal está bloqueada por edificios,
    arbustos o vehículos estacionados, avance lentamente hasta que pueda ver con claridad.
- id: 180
  category: safe_driving_rules
  question: ¿Cuál es una buena regla para ayudarle a evitar conducir en el punto ciego
    de otro conductor?
  choices:
    A: Conducir ligeramente detrás del otro vehículo durante mucho tiempo.
    B: Permanecer en el punto ciego para que el otro conductor sepa que usted está
      allí.
    C: Aumentar la velocidad o retroceder para salir del punto ciego del conductor.
    D: Usar las luces altas continuamente mientras esté en el punto ciego.
  answer: C
  explanation: Evite conducir a cualquiera de los lados y ligeramente detrás de otro
    vehículo durante mucho tiempo. Aumente la velocidad o retroceda para salir del
    punto ciego del conductor.
- id: 181
  category: safe_driving_rules
  question: ¿Cómo puede determinar si está manteniendo una distancia de seguimiento
    segura?
  choices:
    A: Estimar la distancia en largos de vehículos.
    B: Observar cuando el vehículo de adelante pase un objeto al costado del camino
      y contar los segundos hasta que usted llegue a él.
    C: Mirar su velocímetro y dividir su velocidad por dos.
    D: Esperar hasta que el vehículo de adelante frene y ver cuánto tiempo le toma
      reaccionar.
  answer: B
  explanation: Para determinar su distancia de seguimiento, observe cuando el parachoques
    trasero del vehículo de adelante pase un objeto al costado del camino, luego comience
    a contar cuántos segundos le toma llegar al mismo lugar.
- id: 182
  category: sharing_the_road
  question: ¿Por qué debe aumentar su distancia de seguimiento cuando circula detrás
    de autobuses escolares, taxis o camiones que transportan sustancias peligrosas?
  choices:
    A: Se les exige circular a límites de velocidad más bajos.
    B: Realizan paradas inesperadas, como en los cruces de ferrocarril.
    C: Tienen puntos ciegos más grandes que otros vehículos.
    D: Es más probable que retrocedan en las colinas.
  answer: B
  explanation: Debe permitir una distancia de seguimiento mayor porque estos vehículos
    deben detenerse en los cruces de ferrocarril y realizar otras paradas inesperadas.
- id: 183
  category: defensive_driving
  question: Al adelantar a otro vehículo, ¿por qué debe rebasar su punto ciego lo
    más rápida y seguramente posible?
  choices:
    A: Para evitar que el otro conductor acelere.
    B: Porque es ilegal conducir en un punto ciego por más de 5 segundos.
    C: Cuanto más tiempo permanezca en el punto ciego, más tiempo estarán ambos en
      peligro.
    D: Para evitar quedar atrapado en la estela de succión del otro vehículo.
  answer: C
  explanation: Al adelantar a otro vehículo, rebase el punto ciego del otro conductor
    lo más rápida y seguramente posible. Cuanto más tiempo permanezca en el punto
    ciego, más tiempo estarán ambos en peligro.
- id: 184
  category: defensive_driving
  question: Al cambiar de carril, ¿cómo debe revisar los puntos ciegos de su vehículo?
  choices:
    A: Confiar totalmente en su espejo retrovisor.
    B: Mirar sobre sus hombros izquierdo y derecho.
    C: Depender de los sensores de reversa de su vehículo.
    D: Revisar sus espejos laterales durante al menos cinco segundos.
  answer: B
  explanation: 'El manual establece: ''No dependa únicamente de los espejos o sensores,
    mire sobre sus hombros izquierdo y derecho para asegurarse de que no haya nadie
    en los puntos ciegos de su vehículo''.'
- id: 185
  category: safe_driving_rules
  question: ¿Qué es lo primero que debe hacer al prepararse para dar marcha atrás
    con su vehículo?
  choices:
    A: Encender las luces de emergencia.
    B: Tocar la bocina dos veces.
    C: Revisar detrás de su vehículo antes de subirse.
    D: Ajustar su espejo retrovisor para que apunte hacia abajo.
  answer: C
  explanation: Según el manual, 'Al dar marcha atrás, siempre revise detrás de su
    vehículo; hágalo antes de subirse a su vehículo. Los niños u objetos pequeños
    son difíciles de ver desde el asiento del conductor'.
- id: 186
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en Pensilvania?
  choices:
    A: 55 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: 'El manual establece explícitamente: ''El límite de velocidad máximo
    en Pensilvania es 70''.'
- id: 187
  category: vehicle_information
  question: ¿Cómo afecta el conducir a más de 60 mph el consumo de combustible de
    su vehículo?
  choices:
    A: Disminuye el consumo de combustible en un 10%.
    B: Aumenta el consumo de combustible aproximadamente un 5% por cada 5 mph por
      encima de las 60 mph.
    C: No tiene ningún efecto en el consumo de combustible.
    D: Aumenta el consumo de combustible en un 20% por cada 10 mph por encima de las
      60 mph.
  answer: B
  explanation: 'En la sección de Conducción Ecológica (Eco-Driving), el manual explica:
    ''El consumo de combustible aumenta aproximadamente un 5% por cada cinco millas
    por hora conducidas por encima de las 60 mph''.'
- id: 188
  category: vehicle_information
  question: Para mejorar la eficiencia del combustible, ¿cuándo recomienda el manual
    usar el aire acondicionado de su automóvil?
  choices:
    A: Solo cuando conduzca en tráfico intermitente (parar y seguir).
    B: Cuando conduzca a más de 40 mph.
    C: Cuando conduzca a menos de 30 mph.
    D: Solo durante las horas más calurosas del día.
  answer: B
  explanation: 'Los consejos de Conducción Ecológica (Eco-Driving) sugieren: ''Manténgase
    fresco. Use el aire acondicionado de su automóvil cuando conduzca a más de 40
    mph''.'
- id: 189
  category: defensive_driving
  question: ¿Cómo se comparan las tasas de mortalidad por accidentes de tráfico durante
    la noche con las de las horas del día?
  choices:
    A: Son aproximadamente iguales.
    B: Son el doble de altas.
    C: Son de tres a cuatro veces más altas.
    D: Son ligeramente más bajas debido al menor tráfico.
  answer: C
  explanation: 'El manual establece: ''En general, las tasas de mortalidad por accidentes
    de tráfico son de tres (3) a cuatro (4) veces más altas por la noche que durante
    el día''.'
- id: 190
  category: safe_driving_rules
  question: 'La ley estatal de Pensilvania exige que use sus faros delanteros siempre
    que:'
  choices:
    A: Esté conduciendo en una autopista interestatal.
    B: Los limpiaparabrisas de su vehículo estén en uso continuo o intermitente debido
      al clima.
    C: Esté conduciendo a más de 55 mph.
    D: Se encuentre a menos de 10 millas de una zona escolar.
  answer: B
  explanation: La ley estatal exige que los conductores usen sus faros delanteros
    'siempre que los limpiaparabrisas de su vehículo estén en uso continuo o intermitente
    debido a las condiciones climáticas'.
- id: 191
  category: safe_driving_rules
  question: ¿Qué luces delanteras debe usar al conducir en condiciones climáticas
    adversas como niebla, nieve o lluvia intensa?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de conducción diurna
  answer: B
  explanation: 'El manual aconseja: ''En condiciones climáticas adversas, use solo
    las luces bajas. Las luces altas en realidad reducen la visibilidad en estas condiciones''.'
- id: 192
  category: safe_driving_rules
  question: 'Debe usar sus luces delanteras cuando no pueda ver a peatones o vehículos
    en la carretera a una distancia de al menos:'
  choices:
    A: 250 pies adelante.
    B: 500 pies adelante.
    C: 1,000 pies adelante.
    D: 1,500 pies adelante.
  answer: C
  explanation: La ley estatal exige que los conductores utilicen sus luces delanteras
    'cuando no puedan ver a peatones o vehículos en la carretera a una distancia de
    1,000 pies por delante del vehículo que están operando'.
- id: 193
  category: safe_driving_rules
  question: ¿Cuándo debe cambiar de luces altas a luces bajas según la ley de Pensilvania?
  choices:
    A: A menos de 1,000 pies de un vehículo que viene en sentido contrario y a 500
      pies de un vehículo al que está siguiendo.
    B: A menos de 500 pies de un vehículo que viene en sentido contrario y a 300 pies
      de un vehículo al que está siguiendo.
    C: A menos de 300 pies de un vehículo que viene en sentido contrario y a 100 pies
      de un vehículo al que está siguiendo.
    D: Solo cuando el otro conductor le haga señales con sus luces delanteras.
  answer: B
  explanation: 'El manual establece: ''La ley de Pensilvania exige que use las luces
    bajas siempre que esté a menos de 500 pies de un vehículo que viene en sentido
    contrario y cuando siga a un vehículo a menos de 300 pies''.'
- id: 194
  category: defensive_driving
  question: ¿Qué debe hacer si un vehículo que viene en sentido contrario no baja
    sus luces altas?
  choices:
    A: Encienda sus luces altas para castigar al otro conductor.
    B: Mire hacia el lado derecho de la carretera.
    C: Mire directamente a las luces delanteras que se aproximan para juzgar su distancia.
    D: Cierre los ojos brevemente hasta que el vehículo pase.
  answer: B
  explanation: 'El manual aconseja: ''Si el conductor no baja sus luces, mire hacia
    el lado derecho de la carretera. Esto evitará que quede “cegado” por las luces
    delanteras del otro vehículo...'''
- id: 195
  category: defensive_driving
  question: 'Para evitar ''superar el alcance de sus luces delanteras'' (overdriving
    your headlights) en una carretera oscura por la noche usando luces bajas, no debe
    conducir a más de:'
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: El manual explica que las luces bajas iluminan solo unos 250 pies adelante,
    y 'Para evitar superar el alcance de sus luces delanteras en una carretera oscura
    por la noche, no debe conducir a más de 45 mph'.
- id: 196
  category: defensive_driving
  question: ¿Cuándo suelen volverse más resbaladizos los pavimentos durante una tormenta
    de lluvia?
  choices:
    A: Después de que ha estado lloviendo continuamente durante una hora.
    B: En los primeros 10 a 15 minutos de una tormenta de lluvia.
    C: Solo cuando la lluvia se detiene y la carretera comienza a secarse.
    D: Al conducir a velocidades superiores a 60 mph.
  answer: B
  explanation: Según la sección de Condiciones de la Carretera, 'Los pavimentos pueden
    volverse muy resbaladizos en los primeros 10 a 15 minutos de una tormenta de lluvia'.
- id: 197
  category: defensive_driving
  question: En clima frío y húmedo, ¿por qué debe tener un cuidado especial al conducir
    en tramos de la carretera sombreados por árboles o edificios?
  choices:
    A: Atraen más vida silvestre a la calzada
    B: Son más propensos a la acumulación de agua profunda
    C: Estas áreas se congelan más rápido y se secan al último
    D: Hacen que el aceite suba a la superficie más rápido
  answer: C
  explanation: El manual establece que, en clima frío y húmedo, se debe tener un cuidado
    especial al conducir en tramos de carretera sombreados por árboles o edificios
    porque estas áreas se congelan más rápido y se secan al último.
- id: 198
  category: safe_driving_rules
  question: ¿A qué velocidad puede su vehículo comenzar a hidroplanear (hydroplane)
    cuando el agua tiene solo 1/10 de pulgada de profundidad?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El manual señala que se puede hidroplanear a velocidades tan bajas
    como 35 mph, cuando el agua tiene solo 1/10 de pulgada de profundidad.
- id: 199
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si se encuentra hidroplaneando?
  choices:
    A: Frenar bruscamente de inmediato para detener el vehículo
    B: Girar el volante bruscamente para recuperar la tracción
    C: Mantener ambas manos en el volante y retirar lentamente el pie del acelerador
    D: Poner el vehículo en punto muerto (neutral) y avanzar por inercia hasta que
      vuelva la tracción
  answer: C
  explanation: Si se encuentra hidroplaneando, el manual le indica que mantenga ambas
    manos en el volante y retire lentamente el pie del acelerador para permitir que
    su vehículo disminuya la velocidad.
- id: 200
  category: safe_driving_rules
  question: ¿Por qué es extremadamente peligroso conducir cuando la temperatura está
    cerca de los 32° Fahrenheit?
  choices:
    A: El hielo negro (black ice) se forma exclusivamente a esta temperatura
    B: La precipitación se convierte en lluvia o aguanieve, creando una fina capa
      de agua sobre el hielo que es más resbaladiza que el hielo solo
    C: Los frenos antibloqueo de su vehículo no funcionarán correctamente
    D: Es muy probable que el líquido limpiaparabrisas se congele al contacto
  answer: B
  explanation: El manual establece que es extremadamente peligroso cerca de los 32°
    (Fahrenheit), cuando la precipitación se convierte en lluvia o aguanieve, porque
    una fina capa de agua sobre el hielo es más resbaladiza que el hielo solo.
- id: 201
  category: defensive_driving
  question: ¿Cómo puede identificar la posible presencia de "hielo negro" (black ice)
    en la calzada?
  choices:
    A: La carretera parece mojada pero no sale rocío de los neumáticos de otros vehículos
    B: La superficie de la carretera parece inusualmente blanca y con textura
    C: Escucha un fuerte crujido proveniente de sus neumáticos
    D: Comienzan a formarse charcos rápidamente en el arcén de la carretera
  answer: A
  explanation: Según el manual, cuando la carretera parece mojada pero no sale rocío
    de los neumáticos de otros vehículos, puede haber "hielo negro" presente.
- id: 202
  category: penalties_and_points
  question: ¿Cuál es la sanción si cae nieve o hielo de su vehículo en movimiento
    y causa la muerte o lesiones corporales graves a otra persona?
  choices:
    A: Una multa de $50 a $100
    B: Una multa de $200 a $1,000 por cada infracción
    C: Suspensión inmediata de la licencia por un año
    D: Una sentencia obligatoria de 30 días de cárcel
  answer: B
  explanation: Bajo una ley vigente desde el 10 de julio de 2006, el operador del
    vehículo del cual provino la nieve o el hielo está sujeto a una multa de $200
    a $1,000 por cada infracción si causa la muerte o lesiones corporales graves.
- id: 203
  category: safe_driving_rules
  question: ¿Cómo debe ajustar su distancia de seguimiento al conducir en carreteras
    mojadas?
  choices:
    A: Mantener la distancia de seguimiento estándar de tres segundos
    B: Aumentar su distancia de seguimiento a cinco o seis segundos
    C: Dejar aproximadamente 10 veces más espacio de lo normal
    D: Disminuir su distancia de seguimiento para mantenerse en las huellas del vehículo
      de adelante
  answer: B
  explanation: Cuando las carreteras se vuelven resbaladizas, el manual aconseja reducir
    la velocidad entre 5 y 10 mph en carreteras mojadas y aumentar la distancia de
    seguimiento a cinco (5) o seis (6) segundos.
- id: 204
  category: vehicle_information
  question: ¿Por qué debe evitar el uso del control de crucero (cruise control) al
    conducir en carreteras resbaladizas?
  choices:
    A: Agota la batería del vehículo más rápido en climas fríos
    B: Desactiva el sistema de frenos antibloqueo (ABS)
    C: Continuará aplicando potencia si sus ruedas comienzan a patinar, impidiéndole
      recuperar el control
    D: Hace que el motor se sobrecaliente cuando la tracción es baja
  answer: C
  explanation: El manual advierte no usar el control de crucero en carreteras resbaladizas
    porque, si las ruedas patinan, un sistema de control de crucero activado continuará
    aplicando potencia, manteniendo las ruedas girando y evitando que usted recupere
    el control.
- id: 205
  category: defensive_driving
  question: ¿Cuál es una técnica recomendada para acercarse a una intersección en
    carreteras con hielo o nieve compacta?
  choices:
    A: Acelerar rápidamente para pasar por la intersección antes de que cambie la
      luz
    B: Bombear sus frenos rápidamente a medida que se acerca a la línea de parada
    C: Poner el vehículo en punto muerto y aplicar el freno de emergencia
    D: Calcular su llegada dejando que el vehículo avance por inercia hasta que la
      luz cambie a verde y los vehículos de adelante comiencen a moverse
  answer: D
  explanation: En carreteras con hielo o nieve compacta, el manual recomienda intentar
    calcular su llegada a una intersección dejando que el vehículo avance por inercia
    hasta que el semáforo se ponga en verde y los vehículos delante de usted hayan
    comenzado a moverse, para no tener que frenar para detenerse y luego acelerar.
- id: 206
  category: safe_driving_rules
  question: ¿Qué debe hacer si se encuentra atrapado en una niebla densa y no puede
    ver?
  choices:
    A: Encender las luces altas y continuar conduciendo lentamente
    B: Salir completamente de la carretera, encender las luces de emergencia y mantener
      abrochado el cinturón de seguridad
    C: Detenerse en medio de su carril y esperar a que la niebla se disipe
    D: Seguir de cerca a un camión grande para usar sus luces traseras como guía
  answer: B
  explanation: Si queda atrapado en una niebla densa, el manual establece que lo mejor
    es salir completamente de la carretera (preferiblemente a un estacionamiento),
    encender las luces de emergencia (hazard lights) y mantener abrochado el cinturón
    de seguridad.
- id: 207
  category: vehicle_information
  question: ¿Por qué NO debe usar las luces altas (high beams) al conducir en la niebla?
  choices:
    A: Agotarán excesivamente la batería de su vehículo
    B: Dirigen la luz hacia la niebla, la cual rebota hacia sus ojos y crea un deslumbramiento
    C: Es ilegal usarlas durante las horas del día
    D: Desactivan automáticamente los limpiaparabrisas
  answer: B
  explanation: El manual establece explícitamente no usar luces altas en la niebla
    porque dirigen su luz hacia arriba y hacia la niebla, lo que hace que la luz rebote
    hacia sus ojos, creando un deslumbramiento y dificultando la visión.
- id: 208
  category: safe_driving_rules
  question: ¿Cuánto puede reducir la salida de luz un faro sucio?
  choices:
    A: En un 10 por ciento
    B: En un 25 por ciento
    C: En más del 50 por ciento
    D: Hasta en un 75 por ciento
  answer: C
  explanation: Al tratar sobre la limpieza de su vehículo para condiciones de nieve,
    el manual señala que un faro sucio reduce la salida de luz en más del 50 por ciento.
- id: 209
  category: safe_driving_rules
  question: Al conducir en condiciones de nieve durante el día, ¿por qué debería encender
    las luces bajas (low beams)?
  choices:
    A: Para derretir la nieve que cae sobre los faros
    B: Para aumentar su visibilidad ante otros conductores
    C: Para activar el sistema de descongelación de su vehículo
    D: Para evitar que su batería se congele
  answer: B
  explanation: El manual aconseja encender las luces bajas, incluso durante el día
    en condiciones de nieve, porque esto aumenta su visibilidad ante otros conductores.
- id: 210
  category: defensive_driving
  question: Si se encuentra con una ráfaga de nieve (snow squall) mientras conduce,
    ¿qué acción debe tomar?
  choices:
    A: Frenar bruscamente de inmediato para detenerse
    B: Acelerar para salir de la ráfaga lo más rápido posible
    C: Tener extrema precaución disminuyendo la velocidad gradualmente y activando
      las luces de emergencia
    D: Encender las luces altas para atravesar la nieve pesada
  answer: C
  explanation: El manual aconseja que si se encuentra con una ráfaga de nieve, debe
    tener extrema precaución disminuyendo la velocidad gradualmente y activando las
    luces de emergencia para aumentar la visibilidad, y advierte específicamente no
    frenar bruscamente.
- id: 211
  category: penalties_and_points
  question: ¿Cuál es la multa total aproximada, incluyendo cargos, por no encender
    los faros delanteros cuando los limpiaparabrisas están en uso continuo o intermitente?
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: C
  explanation: Según el manual, los automovilistas que no cumplan con la ley de faros
    delanteros/limpiaparabrisas enfrentan una multa de $25, pero con los cargos y
    otros costos asociados, la penalización se aproxima a los $100.
- id: 212
  category: safe_driving_rules
  question: Al conducir en condiciones climáticas que requieren el uso continuo o
    intermitente de los limpiaparabrisas, ¿qué más debe hacer?
  choices:
    A: Encender las luces altas.
    B: Encender los faros delanteros y las luces traseras.
    C: Confiar solo en sus luces de circulación diurna.
    D: Encender las luces intermitentes de emergencia.
  answer: B
  explanation: La ley exige que los automovilistas enciendan sus faros delanteros
    siempre que sus limpiaparabrisas estén en uso debido al clima. Las luces de circulación
    diurna no son suficientes, y las luces traseras también deben estar iluminadas.
- id: 213
  category: safe_driving_rules
  question: 'Si se aproxima a una escena de emergencia o a una grúa que está recogiendo
    un vehículo averiado y no puede cambiarse a un carril no adyacente, usted debe:'
  choices:
    A: Detener su vehículo inmediatamente.
    B: Reducir su velocidad a al menos 20 mph por debajo del límite de velocidad indicado.
    C: Mantener su velocidad pero encender sus luces de emergencia.
    D: Tocar la bocina para alertar a los trabajadores de emergencia.
  answer: B
  explanation: Al acercarse a una escena de emergencia, una parada policial o una
    grúa, debe cambiarse a un carril no adyacente. Si no puede cambiarse de carril,
    debe reducir su velocidad a al menos 20 millas por hora por debajo del límite
    de velocidad indicado.
- id: 214
  category: defensive_driving
  question: ¿Cómo debe manejar una situación en la que se aproxima a un ciclista a
    su derecha y a un vehículo en sentido contrario al mismo tiempo?
  choices:
    A: Acelerar para pasar al ciclista antes de que el vehículo llegue a usted.
    B: Moverse al carril izquierdo y obligar al vehículo que viene en sentido contrario
      a reducir la velocidad.
    C: Tocar la bocina para que el ciclista se salga de la carretera.
    D: Reducir la velocidad para dejar pasar al vehículo que viene en sentido contrario,
      luego moverse a la izquierda para pasar al ciclista.
  answer: D
  explanation: Debe manejar esta situación enfrentando solo una condición de tráfico
    a la vez. Reduzca la velocidad para dejar pasar al vehículo que viene en sentido
    contrario y luego muévase a la izquierda para pasar al ciclista, dejando una cantidad
    de espacio suficiente.
- id: 215
  category: signs_and_signals
  question: ¿Qué indica un triángulo naranja que se muestra en la parte trasera de
    un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos.
    B: El vehículo está diseñado para operar a 25 mph o menos.
    C: El vehículo está averiado y esperando una grúa.
    D: El vehículo es una carga ancha.
  answer: B
  explanation: En áreas rurales, se muestra un triángulo naranja en la parte trasera
    de los tractores agrícolas y vehículos tirados por caballos diseñados para operar
    a 25 mph o menos.
- id: 216
  category: defensive_driving
  question: ¿Qué debe hacer para comunicar a los conductores detrás de usted que va
    a frenar en un lugar donde quizás no lo esperen?
  choices:
    A: Encender las luces intermitentes de emergencia.
    B: Usar una señal manual para reducir la velocidad.
    C: Presionar rápidamente el pedal del freno tres o cuatro veces.
    D: Tocar la bocina dos veces.
  answer: C
  explanation: Si va a frenar donde otros conductores no lo esperan, el manual aconseja
    presionar rápidamente el pedal del freno tres o cuatro veces para advertirles.
- id: 217
  category: safe_driving_rules
  question: ¿Cuándo debe usar sus luces intermitentes de emergencia (four-way flashers)
    en una autopista de acceso limitado?
  choices:
    A: Cuando conduce a menos de 40 mph.
    B: Cuando conduce en el carril izquierdo.
    C: Cuando está pasando a un camión grande.
    D: Cuando se aproxima a una cabina de peaje.
  answer: A
  explanation: Si debe conducir a menos de 40 mph en una autopista de acceso limitado,
    debe usar sus luces intermitentes de emergencia para advertir a los conductores
    detrás de usted.
- id: 218
  category: safe_driving_rules
  question: Según la ley de Pensilvania, ¿con cuánta anticipación debe usar su señal
    de giro si conduce a 35 mph o más?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: D
  explanation: Si conduce a 35 mph o más, la ley de Pensilvania exige que haga la
    señal al menos 300 pies antes de girar.
- id: 219
  category: safe_driving_rules
  question: Si conduce a menos de 35 mph, ¿con cuánta anticipación antes de un giro
    debe usar sus señales de giro?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: Según la ley de Pensilvania, siempre debe usar sus señales de giro
    al menos 100 pies antes de girar si conduce a menos de 35 mph.
- id: 220
  category: defensive_driving
  question: Si su vehículo se avería en la autopista y se ha salido de la carretera
    y ha encendido las luces intermitentes de emergencia, ¿qué más debe hacer para
    que otros conductores sepan que su vehículo está inhabilitado?
  choices:
    A: Pararse en la calzada y agitar los brazos.
    B: Levantar el capó.
    C: Tocar la bocina continuamente.
    D: Colocar un triángulo naranja en el techo.
  answer: B
  explanation: Si su vehículo se avería, debe salirse de la carretera, encender las
    luces de emergencia y levantar el capó para que otros conductores sepan que su
    vehículo está inhabilitado.
- id: 221
  category: safe_driving_rules
  question: ¿Según el manual, cuál es probablemente el factor más importante en el
    que hay que concentrarse al realizar un giro?
  choices:
    A: El tamaño de su vehículo
    B: La velocidad
    C: El tipo de superficie de la carretera
    D: La hora del día
  answer: B
  explanation: 'El manual establece: "La velocidad es probablemente el factor más
    importante. Al girar, reduzca a una velocidad que le permita mantener el control
    de su vehículo..."'
- id: 222
  category: safe_driving_rules
  question: Al girar hacia una carretera que tiene más de un carril circulando en
    la dirección a la que desea ir, ¿en qué carril debe entrar?
  choices:
    A: El carril central.
    B: El carril más alejado de usted.
    C: El carril más cercano que vaya en esa dirección.
    D: Cualquier carril que esté vacío en ese momento.
  answer: C
  explanation: Si va a girar hacia una carretera que tiene más de un carril en la
    dirección en la que desea viajar, gire hacia el carril más cercano que vaya en
    esa dirección.
- id: 223
  category: signs_and_signals
  question: 'Un carril en medio de una calle de doble sentido marcado a ambos lados
    por una línea exterior continua y una línea interior discontinua solo puede utilizarse
    para:'
  choices:
    A: Rebasar vehículos que circulan despacio.
    B: Giros a la izquierda.
    C: Giros a la derecha.
    D: Estacionamiento de emergencia.
  answer: B
  explanation: Un carril en medio de una calle de doble sentido marcado a ambos lados
    por dos líneas (una línea exterior continua y una línea interior discontinua)
    significa que este carril solo puede utilizarse para giros a la izquierda.
- id: 224
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una pauta correcta para utilizar con seguridad
    un carril central de giro?
  choices:
    A: Entre en el carril lo antes posible para asegurar su lugar.
    B: Deje la parte trasera de su vehículo en el carril de circulación para bloquear
      el tráfico.
    C: Entre completamente en el carril para no bloquear el tráfico.
    D: Ponga la señal de giro a la derecha antes de entrar.
  answer: C
  explanation: Cuando entre en el carril central de giro, debe entrar completamente.
    No deje la parte trasera de su vehículo sobresaliendo en el carril de circulación
    normal, bloqueando el tráfico.
- id: 225
  category: defensive_driving
  question: ¿Cuánto tiempo suelen durar los chubascos de nieve peligrosos en una carretera
    específica cuando se emite una 'Advertencia de chubascos de nieve' (Snow Squall
    Warning)?
  choices:
    A: Menos de 45 minutos
    B: De 1 a 2 horas
    C: De 3 a 4 horas
    D: Un día entero
  answer: A
  explanation: El Servicio Meteorológico Nacional emite Advertencias de Chubascos
    de Nieve (Snow Squall Warnings) para carreteras específicas donde es probable
    que los chubascos causen un gran impacto, durando típicamente menos de 45 minutos
    para una carretera.
- id: 226
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe utilizar la señal de giro antes de realizar
    un giro?
  choices:
    A: De 1 a 2 segundos
    B: De 3 a 4 segundos
    C: De 5 a 6 segundos
    D: 10 segundos
  answer: B
  explanation: Para completar un giro de forma segura, el manual establece que debe
    señalizar de tres (3) a cuatro (4) segundos antes de su giro.
- id: 227
  category: safe_driving_rules
  question: Al elegir un lugar para hacer un giro en U, ¿a qué distancia deben estar
    los conductores que vienen de todas las direcciones para que puedan verle con
    claridad?
  choices:
    A: Al menos 100 pies
    B: Al menos 250 pies
    C: Al menos 500 pies
    D: Al menos 1,000 pies
  answer: C
  explanation: Al elegir un lugar para hacer un giro en U, debe asegurarse de que
    los conductores que vienen de todas las direcciones estén al menos a 500 pies
    de distancia de usted y puedan verle con claridad.
- id: 228
  category: defensive_driving
  question: Al cruzar el tráfico, ¿cuándo se considera seguro detenerse a mitad de
    una calle?
  choices:
    A: Cuando hay una señal de alto en medio de la intersección
    B: Cuando el tráfico transversal se mueve a baja velocidad
    C: Cuando hay un carril de giro en la mediana central lo suficientemente grande
      como para que quepa todo su vehículo
    D: Siempre que tenga el semáforo en verde pero el tráfico esté congestionado
  answer: C
  explanation: Detenerse a mitad de una calle solo es seguro cuando hay un carril
    de giro en la mediana central lo suficientemente grande como para que quepa todo
    su vehículo.
- id: 229
  category: defensive_driving
  question: Si está esperando para cruzar una calle y un vehículo que se aproxima
    tiene encendida la señal de giro, ¿cuál es la acción más segura?
  choices:
    A: Salir inmediatamente porque el vehículo definitivamente girará
    B: Esperar hasta que el otro conductor empiece realmente a girar antes de avanzar
    C: Tocar la bocina para avisarles de que está cruzando
    D: Acelerar rápidamente para cruzar antes de que lleguen a la intersección
  answer: B
  explanation: No salga delante de un vehículo que se aproxima con la señal de giro
    encendida. El conductor puede haber cambiado de opinión o haber olvidado apagar
    la señal. Espere hasta que el otro conductor empiece realmente a girar antes de
    avanzar.
- id: 230
  category: safe_driving_rules
  question: ¿Cuál de las siguientes acciones es ilegal al utilizar un carril de aceleración
    para incorporarse a una autopista?
  choices:
    A: Acelerar a la velocidad del tráfico
    B: Buscar un hueco en el tráfico
    C: Rebasar a un vehículo que va delante de usted en el carril de aceleración
    D: Utilizar la señal de giro antes de incorporarse
  answer: C
  explanation: Las rampas de entrada a las autopistas suelen tener carriles de aceleración.
    El manual establece explícitamente que es ilegal rebasar a un vehículo que va
    delante de usted en un carril de aceleración.
- id: 231
  category: safe_driving_rules
  question: ¿Al rebasar en una carretera de dos carriles a 45 mph, cuánto espacio
    libre en la vía necesita para rebasar de forma segura a un vehículo más lento?
  choices:
    A: 1/8 de milla
    B: 1/4 de milla
    C: 1/2 milla
    D: 1 milla
  answer: B
  explanation: Rebasar en una carretera de dos carriles requiere buen juicio. A 45
    mph, esto se traduce en 1/4 de milla de vía despejada que necesita para rebasar
    de forma segura a un vehículo más lento.
- id: 232
  category: safe_driving_rules
  question: ¿Aproximadamente qué tan rápido debe viajar en comparación con el vehículo
    que está rebasando para hacerlo de forma segura?
  choices:
    A: 5 mph más rápido
    B: 10 mph más rápido
    C: 15 mph más rápido
    D: 20 mph más rápido
  answer: B
  explanation: Según el manual, debe ir aproximadamente 10 mph más rápido que el vehículo
    o vehículos que está rebasando.
- id: 233
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes condiciones se le permite rebasar a otro
    vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante viaja por debajo del límite de velocidad indicado
    B: Cuando el conductor al que está rebasando está realizando o señalizando un
      giro a la izquierda
    C: Cuando se encuentra a menos de 100 pies de una intersección
    D: Cuando se encuentra en una carretera de un solo carril y el vehículo de adelante
      se detiene
  answer: B
  explanation: Puede rebasar a otro vehículo por la derecha cuando el conductor al
    que está rebasando está realizando o señalizando un giro a la izquierda, siempre
    que usted permanezca en el acotamiento o banquina (shoulder).
- id: 234
  category: safe_driving_rules
  question: ¿A cuántos pies de una intersección o un cruce de ferrocarril a nivel
    NO se le permite rebasar a otro vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: No puede rebasar si se encuentra a menos de 100 pies de una intersección
    o cruce de ferrocarril a nivel, o si los está cruzando, a menos que un dispositivo
    de control de tráfico oficial indique que puede hacerlo.
- id: 235
  category: safe_driving_rules
  question: Después de rebasar a un vehículo, ¿cómo sabe que es seguro volver a su
    carril original?
  choices:
    A: Cuando está a una distancia de un vehículo por delante del vehículo rebasado
    B: Cuando el conductor al que rebasó hace destellos con sus luces delanteras
    C: Cuando puede ver ambos faros delanteros del vehículo rebasado en su espejo
      retrovisor
    D: Cuando han pasado tres segundos desde que adelantó al vehículo
  answer: C
  explanation: Antes de volver al carril, asegúrese de que puede ver ambos faros delanteros
    del vehículo que rebasó en su espejo retrovisor.
- id: 236
  category: safe_driving_rules
  question: ¿Quién debe ceder el paso en una intersección circular (o glorieta)?
  choices:
    A: Los conductores que ya están en el círculo deben ceder el paso a los conductores
      que entran.
    B: Los conductores que entran al círculo deben ceder el paso a los conductores
      que ya están en él.
    C: Los conductores que entran por la derecha deben ceder el paso a los conductores
      que entran por la izquierda.
    D: Todos los conductores deben detenerse y ceder el paso a la derecha.
  answer: B
  explanation: Los conductores que entran en una intersección circular (o glorieta)
    deben ceder el derecho de paso a los conductores que ya se encuentran en el círculo.
- id: 237
  category: safe_driving_rules
  question: ¿Qué debe hacer si accidentalmente termina en un carril marcado solo para
    giros, pero desea seguir recto?
  choices:
    A: Detenerse y esperar a que el tráfico se despeje antes de incorporarse al carril
      de paso.
    B: Continuar recto a través de la intersección con precaución.
    C: Debe realizar el giro.
    D: Dar marcha atrás con su vehículo para cambiar de carril.
  answer: C
  explanation: Si termina en un carril marcado solo para giros cuando desea seguir
    recto a través de la intersección, debe realizar el giro.
- id: 238
  category: safe_driving_rules
  question: Al girar a la izquierda desde un carril de giro a la izquierda doble,
    ¿por qué es importante no cambiar de carril durante el giro?
  choices:
    A: Causará que choque con el conductor que está girando a su lado.
    B: Es ilegal usar la señal de giro en una intersección.
    C: Se verá obligado a entrar en un 'jughandle' (rampa de salida tipo asa).
    D: Perderá su derecho de paso frente al tráfico que viene en sentido contrario.
  answer: A
  explanation: El manual establece que no debe cambiar de carril durante un giro desde
    un carril de giro a la izquierda doble, ya que esto causará que choque con el
    conductor que gira a su lado.
- id: 239
  category: driver_responsibility
  question: En más de un tercio de los choques que involucran a conductores de 16
    años en Pensilvania, ¿qué estaba haciendo el conductor adolescente?
  choices:
    A: Exceder la velocidad en una curva hacia la izquierda.
    B: Salir de una señal de alto o girar a la izquierda cruzando el tráfico.
    C: No ceder el paso en una glorieta.
    D: Adelantar a un ciclista en una intersección.
  answer: B
  explanation: Las intersecciones son lugares donde los conductores adolescentes tienen
    un alto porcentaje de choques. En más de un tercio de estos choques, el conductor
    adolescente estaba saliendo de una señal de alto o girando a la izquierda cruzando
    el tráfico.
- id: 240
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento correcto para girar a la izquierda en una carretera
    dividida?
  choices:
    A: Cruzar ambas calzadas a la vez sin detenerse en el medio.
    B: Girar a la izquierda en la primera calzada que encuentre.
    C: Cruzar la primera calzada cuando sea seguro, luego girar a la izquierda al
      otro lado de la barrera cuando haya un espacio seguro en la segunda calzada.
    D: Entrar en el 'jughandle' (rampa de salida tipo asa) en el lado izquierdo de
      la carretera.
  answer: C
  explanation: Para girar correctamente a la izquierda en una carretera dividida,
    debe cruzar la primera calzada cuando haya un espacio seguro y luego girar a la
    izquierda al otro lado de la barrera cuando haya un espacio seguro en el tráfico
    de la segunda calzada.
- id: 241
  category: defensive_driving
  question: ¿Aproximadamente qué espacio en el tráfico necesita en ambas direcciones
    para cruzar una intersección con una señal de alto en dos direcciones en una calle
    de 30 mph?
  choices:
    A: Un espacio de 3 segundos.
    B: Un espacio de 6 segundos.
    C: Un espacio de 9 segundos.
    D: Un espacio de 12 segundos.
  answer: B
  explanation: Para cruzar una intersección con una señal de alto en dos direcciones,
    necesita un espacio de aproximadamente 6 segundos en ambas direcciones para cruzar
    una calle de 30 mph.
- id: 242
  category: defensive_driving
  question: Al realizar un giro a la derecha, ¿aproximadamente qué tamaño de espacio
    debe dejar entre usted y cualquier vehículo que se aproxime por la izquierda?
  choices:
    A: 4 segundos
    B: 6 segundos
    C: 8 segundos
    D: 10 segundos
  answer: C
  explanation: Al girar a la derecha, debe dejar un espacio de aproximadamente ocho
    (8) segundos entre usted y cualquier vehículo que se aproxime por la izquierda.
- id: 243
  category: safe_driving_rules
  question: ¿Cómo puede evitar un 'giro enredado' (tangle turn) con otro conductor
    que gira a la izquierda y viene en dirección opuesta?
  choices:
    A: Girando después de pasar el centro de la intersección.
    B: Girando antes de llegar a la 'X' imaginaria en el centro de la intersección.
    C: Girando en el carril más alejado de la línea central.
    D: Esperando hasta que el otro conductor complete su giro primero.
  answer: B
  explanation: Puede evitar un 'giro enredado' con otro conductor que gira a la izquierda
    imaginando una 'X' en el centro de la intersección y girando antes de llegar a
    la 'X'.
- id: 244
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso cuando usted se detiene ante la línea
    de ceda el paso de una rotonda?
  choices:
    A: El vehículo que entra a la rotonda.
    B: El tráfico que circula dentro de la rotonda.
    C: Los vehículos que se aproximan por la derecha.
    D: Los vehículos que salen de la rotonda.
  answer: B
  explanation: Al acercarse a la línea de ceda el paso de una rotonda, debe mirar
    a la izquierda y verificar el tráfico que se aproxima, ya que el tráfico que circula
    tiene el derecho de paso.
- id: 245
  category: signs_and_signals
  question: ¿Qué señal debe usar al acercarse a su salida en una rotonda?
  choices:
    A: Señal de giro a la izquierda
    B: Señal de giro a la derecha
    C: Luces de emergencia
    D: No se requiere ninguna señal
  answer: B
  explanation: Al acercarse a su salida en una rotonda, debe usar su SEÑAL DE GIRO
    A LA DERECHA.
- id: 246
  category: sharing_the_road
  question: ¿Qué debe hacer si se aproxima un vehículo de emergencia mientras conduce
    dentro de una rotonda?
  choices:
    A: Detenerse inmediatamente dentro de la rotonda para dejarlo pasar.
    B: Acelerar para salir de la rotonda antes de que entre el vehículo de emergencia.
    C: Salir inmediatamente de la rotonda y hacerse a un lado.
    D: Detenerse junto a la isla central de la rotonda.
  answer: C
  explanation: Si se encuentra en una rotonda cuando se aproxima un vehículo de emergencia,
    debe salir inmediatamente de la rotonda y hacerse a un lado. NUNCA DEBE DETENERSE
    DENTRO DE LA ROTONDA.
- id: 247
  category: sharing_the_road
  question: ¿Cuál es la regla con respecto a los ciclistas que funcionan como vehículos
    en una rotonda?
  choices:
    A: Debe tocar la bocina para advertirles que se muevan al cruce peatonal.
    B: Puede rebasarlos si hay suficiente espacio a la izquierda.
    C: Nunca debe adelantar a un ciclista que actúa como un vehículo en una rotonda.
    D: A los ciclistas no se les permite funcionar como vehículos en una rotonda.
  answer: C
  explanation: Los ciclistas tienen la opción de funcionar como un vehículo en una
    rotonda. Los automovilistas NUNCA DEBEN ADELANTAR A UN CICLISTA QUE ACTÚA COMO
    UN VEHÍCULO EN UNA ROTONDA.
- id: 248
  category: safe_driving_rules
  question: ¿Cuál es el propósito de una intersección tipo 'jughandle' en una carretera
    comercial concurrida?
  choices:
    A: Permitir que los vehículos giren a la izquierda utilizando un carril de giro
      a la derecha que se curva hacia atrás para cruzarse con la carretera principal.
    B: Proporcionar un lugar seguro para que los vehículos realicen un giro en U a
      través de la barrera física.
    C: Permitir que los vehículos de emergencia eviten el tráfico pesado en una intersección.
    D: Crear un carril designado para ciclistas y peatones.
  answer: A
  explanation: En un diseño de jughandle, en lugar de girar a la izquierda directamente
    a través del tráfico que viene en sentido contrario, se utiliza un carril de giro
    a la derecha que se curva hacia atrás para cruzarse con la carretera principal
    en un semáforo para girar a la izquierda.
- id: 249
  category: defensive_driving
  question: ¿Cuándo es el mejor momento para reducir la velocidad para mantener el
    control en una curva?
  choices:
    A: Justo después de entrar en la curva.
    B: En el ápice (punto medio) de la curva.
    C: Antes de entrar en la curva.
    D: Mientras está saliendo de la curva.
  answer: C
  explanation: Para mantener el control en las curvas, debe reducir la velocidad,
    y debe hacerlo ANTES de entrar en la curva.
- id: 250
  category: defensive_driving
  question: ¿Dónde debe posicionar su vehículo al conducir de manera segura a través
    de una curva a la derecha?
  choices:
    A: En el medio de su carril.
    B: Ligeramente a la derecha del centro del carril.
    C: Ligeramente a la izquierda del centro del carril.
    D: En el acotamiento de la carretera.
  answer: B
  explanation: Para conducir de manera segura a través de las curvas, debe mantenerse
    ligeramente a la derecha del centro del carril en las curvas a la derecha y en
    el medio de su carril en las curvas a la izquierda.
- id: 251
  category: driver_responsibility
  question: ¿Cuál es el tipo de choque más frecuente para los conductores de 16 años
    en Pensilvania?
  choices:
    A: Colisiones por alcance en semáforos.
    B: Colisiones frontales en autopistas divididas.
    C: Choques de un solo vehículo con salida de la carretera.
    D: Giros complicados en intersecciones.
  answer: C
  explanation: Según el dato de Choques de Adolescentes del manual, el tipo de choque
    más frecuente para los conductores de 16 años en Pensilvania es el choque de un
    solo vehículo con salida de la carretera.
- id: 252
  category: safe_driving_rules
  question: Cuando el tráfico que entra y sale de una autopista debe compartir un
    "carril de entrelazado" (weaving lane) corto, ¿quién debe ceder el paso?
  choices:
    A: El conductor que sale de la autopista
    B: El conductor que entra a la autopista
    C: El conductor que viaja a una velocidad mayor
    D: El conductor que viaja a una velocidad menor
  answer: B
  explanation: El manual establece que si usted es el conductor que entra a la autopista,
    debe ceder el paso al conductor que sale cuando comparten un carril de entrelazado.
- id: 253
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida en una autopista?
  choices:
    A: Detenerse y retroceder con cuidado por el arcén
    B: Cruzar la mediana para dar la vuelta
    C: Virar bruscamente a través de los carriles para tomar la salida en el último
      segundo
    D: Tomar la siguiente salida
  answer: D
  explanation: Si se pasa de su salida, tome la siguiente. No se detenga, no retroceda,
    no vire bruscamente a través de los carriles ni cruce la mediana, ya que estas
    maniobras son ilegales y peligrosas.
- id: 254
  category: safe_driving_rules
  question: Al salir de una autopista, ¿cuál es el momento adecuado para reducir la
    velocidad?
  choices:
    A: Una milla antes de la rampa de salida
    B: Mientras todavía está en el carril de tráfico principal antes de cambiar de
      carril
    C: Después de haber entrado en el carril de salida
    D: Tan pronto como vea la señal de salida
  answer: C
  explanation: El manual instruye a los conductores a colocarse en el carril adecuado
    para salir con suficiente antelación y a no reducir la velocidad hasta después
    de haberse movido al carril de salida.
- id: 255
  category: defensive_driving
  question: ¿Qué causa la "hipnosis de autopista" (highway hypnosis)?
  choices:
    A: Conducir bajo la influencia de medicamentos recetados
    B: Mirar fijamente hacia adelante a la carretera durante largos períodos de tiempo
      y perder la concentración
    C: Conducir a velocidades superiores a 65 mph durante más de una hora
    D: Mirar rápidamente de un lado a otro entre los espejos y la carretera
  answer: B
  explanation: La hipnosis de autopista ocurre cuando se mira fijamente hacia adelante
    a la carretera durante largos períodos de tiempo y se deja de observar activamente
    lo que hay adelante, atrás y alrededor de su vehículo.
- id: 256
  category: safe_driving_rules
  question: Al estacionar en una calle con bordillo, ¿cuál es la distancia máxima
    a la que puede estar su vehículo del bordillo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Si la calle en la que se encuentra tiene bordillo, debe estacionar
    lo más cerca posible de él, pero a no más de 12 pulgadas de distancia.
- id: 257
  category: safe_driving_rules
  question: Cuando deba estacionar en la calzada, ¿su vehículo debe ser visible desde
    al menos qué distancia en ambas direcciones?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Cuando deba estacionar en la calzada, use sus luces intermitentes de
    emergencia y asegúrese de que su vehículo pueda verse al menos a 500 pies en ambas
    direcciones.
- id: 258
  category: safe_driving_rules
  question: ¿Cómo debe posicionar el volante al estacionar su vehículo en una pendiente
    hacia abajo, con o sin bordillo?
  choices:
    A: Gire las ruedas completamente hacia la izquierda
    B: Gire las ruedas completamente hacia la derecha
    C: Mantenga las ruedas apuntando hacia adelante
    D: Gire las ruedas de forma paralela a la calzada
  answer: B
  explanation: Al estacionar su vehículo en una pendiente hacia abajo con o sin bordillo,
    debe girar el volante para que las ruedas queden completamente hacia la derecha.
- id: 259
  category: safe_driving_rules
  question: ¿Es ilegal estacionar a menos de cuántos pies de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: Nunca debe detenerse, detener la marcha o estacionar su vehículo a
    menos de 15 pies de un hidrante de incendios.
- id: 260
  category: safe_driving_rules
  question: ¿No debe estacionar a menos de cuántos pies de cualquier señal intermitente,
    señal de pare (stop), señal de ceda el paso (yield) o dispositivo de control de
    tráfico ubicado al costado de una calzada?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Es ilegal estacionar a menos de 30 pies de cualquier señal intermitente,
    señal de pare, señal de ceda el paso o dispositivo de control de tráfico ubicado
    al costado de una calzada.
- id: 261
  category: safe_driving_rules
  question: ¿A qué distancia mínima debe estacionar del riel más cercano en un cruce
    de ferrocarril?
  choices:
    A: Al menos 15 pies
    B: Al menos 20 pies
    C: Al menos 30 pies
    D: Al menos 50 pies
  answer: D
  explanation: Nunca debe detenerse, pararse ni estacionar su vehículo a menos de
    50 pies del riel más cercano en un cruce de ferrocarril.
- id: 262
  category: safe_driving_rules
  question: ¿Qué debe encender al conducir a través de una zona de obras activa?
  choices:
    A: Sus luces intermitentes de advertencia (luces de emergencia)
    B: Sus luces altas
    C: Los faros delanteros de su vehículo, no solo las luces de circulación diurna
    D: La luz interior del techo
  answer: C
  explanation: Por ley, debe encender los faros delanteros de su vehículo, no solo
    las luces de circulación diurna, cuando conduzca a través de zonas de obras activas.
- id: 263
  category: penalties_and_points
  question: ¿Cuál es la sanción por ciertas infracciones, como el exceso de velocidad,
    en una zona de obras activa?
  choices:
    A: Las multas se duplican
    B: Las multas se triplican
    C: Su vehículo es confiscado de inmediato
    D: Debe volver a realizar el examen de conducir
  answer: A
  explanation: Las multas se duplican por ciertas infracciones en zonas de obras activas,
    incluido el exceso de velocidad.
- id: 264
  category: signs_and_signals
  question: ¿Con qué antelación se pueden colocar las señales de advertencia, los
    vehículos de advertencia anticipada o los tableros de mensajes variables al acercarse
    a una zona de obras?
  choices:
    A: Un mínimo de 50 pies
    B: Un mínimo de 100 pies
    C: Un mínimo de 200 pies
    D: Un mínimo de 500 pies
  answer: C
  explanation: Las señales de advertencia, los vehículos de advertencia anticipada
    o los tableros de mensajes variables pueden colocarse a un mínimo de 200 pies
    antes de llegar a una zona de obras.
- id: 265
  category: signs_and_signals
  question: ¿Cómo puede confirmar que se dirige en la dirección correcta al entrar
    en una rampa de autopista?
  choices:
    A: Ve una línea amarilla a su derecha y una línea blanca a su izquierda
    B: Ve una línea blanca a su derecha y una línea amarilla a su izquierda
    C: Ve líneas amarillas dobles continuas a ambos lados de la rampa
    D: Ve líneas blancas discontinuas a ambos lados de la rampa
  answer: B
  explanation: Si ve una línea blanca a su derecha y una línea amarilla a la izquierda,
    se dirige en la dirección correcta en una rampa de entrada a la autopista.
- id: 266
  category: safe_driving_rules
  question: ¿Qué debe hacer con respecto a su distancia de seguimiento al conducir
    en una zona de obras?
  choices:
    A: Mantener su distancia de seguimiento normal
    B: Duplicar su distancia de seguimiento
    C: Triplicar su distancia de seguimiento
    D: Reducir su distancia de seguimiento a la mitad
  answer: B
  explanation: El manual indica que se debe duplicar la distancia de seguimiento en
    las zonas de obras, ya que el tipo de choque más común en estas zonas es la colisión
    por alcance (choque por detrás).
- id: 267
  category: signs_and_signals
  question: ¿La autoridad de quién prevalece sobre los dispositivos convencionales
    de control de tráfico en una zona de obras?
  choices:
    A: Los banderilleros (personal de señalización)
    B: Los trabajadores de la construcción
    C: Los vehículos de escolta
    D: Los tableros de mensajes electrónicos
  answer: A
  explanation: Debe obedecer a los banderilleros en una zona de obras, ya que su autoridad
    prevalece sobre los dispositivos convencionales de control de tráfico.
- id: 268
  category: defensive_driving
  question: ¿Hacia qué dirección debe mirar al acercarse a un cruce de ferrocarril?
  choices:
    A: A la derecha, a la izquierda y luego a la derecha otra vez
    B: Solo hacia adelante
    C: A la izquierda, a la derecha y luego a la izquierda otra vez
    D: A la izquierda y a la derecha simultáneamente
  answer: C
  explanation: El manual aconseja mirar siempre a la izquierda, a la derecha y luego
    a la izquierda otra vez al acercarse a un cruce de ferrocarril, incluso si las
    señales no están parpadeando.
- id: 269
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo queda atrapado en un cruce de ferrocarril
    y se acerca un tren?
  choices:
    A: Permanecer en el vehículo y prepararse para el impacto
    B: Salir rápidamente del vehículo y alejarse lo más posible de la vía
    C: Intentar arrancar el vehículo hasta que el tren esté a 100 pies de distancia
    D: Tocar la bocina para advertir al maquinista del tren
  answer: B
  explanation: Si comete el error de quedar atrapado en un cruce de ferrocarril y
    se acerca un tren, debe salir rápidamente del vehículo y alejarse de la vía lo
    más que pueda.
- id: 270
  category: sharing_the_road
  question: ¿Cuándo es seguro indicarle con la mano a un peatón que entre en la línea
    de tráfico?
  choices:
    A: Solo en los pasos de peatones marcados
    B: Cuando se haya detenido por completo
    C: Solo si no se acercan otros vehículos
    D: Nunca es seguro indicarle con la mano a un peatón que entre en la línea de
      tráfico
  answer: D
  explanation: El manual establece explícitamente que nunca es seguro indicarle con
    la mano a un peatón que entre en la línea de tráfico en ningún momento, especialmente
    en lugares no marcados o a mitad de cuadra.
- id: 271
  category: sharing_the_road
  question: ¿Qué debe hacer al acercarse a un vehículo detenido por detrás?
  choices:
    A: Tocar la bocina y rebasar rápidamente por la izquierda
    B: Reducir la velocidad y no rebasar hasta estar seguro de que no hay peatones
      cruzando delante de él
    C: Rebasar por el arcén derecho si hay suficiente espacio
    D: Usar las luces altas para advertir al conductor que está rebasando
  answer: B
  explanation: Al acercarse a un vehículo detenido por detrás, debe reducir la velocidad
    y no rebasar hasta estar seguro de que no hay peatones cruzando delante de él.
- id: 272
  category: sharing_the_road
  question: Al rebasar un camión, ¿cuándo es seguro volver al carril del camión?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del camión
    B: Cuando pueda ver los faros o la parrilla delantera del camión en su espejo
      retrovisor
    C: Cuando el conductor del camión parpadee sus luces
    D: Después de haber mantenido su velocidad durante 5 segundos
  answer: B
  explanation: Después de rebasar un camión, debe cambiar de carril solo cuando pueda
    ver los faros o la parrilla delantera del camión en su espejo retrovisor.
- id: 273
  category: sharing_the_road
  question: ¿Por qué podría necesitar aumentar su velocidad al rebasar un camión en
    una pendiente descendente?
  choices:
    A: Porque el impulso del camión hará que vaya más rápido
    B: Porque el camión acelerará intencionalmente para evitar que usted lo rebase
    C: Porque es ilegal rebasar un camión lentamente en una colina
    D: Porque la turbulencia del viento es más fuerte en una pendiente descendente
  answer: A
  explanation: En una pendiente descendente, el impulso de un camión hará que vaya
    más rápido, por lo que es posible que deba aumentar su velocidad para rebasarlo
    de manera segura.
- id: 274
  category: sharing_the_road
  question: ¿Por qué debe evitar reducir la velocidad o detenerse rápidamente inmediatamente
    después de rebasar a un ciclista?
  choices:
    A: Hará que el ciclista pierda el equilibrio
    B: El ciclista podría chocar contra su vehículo
    C: Es ilegal frenar delante de un vehículo no motorizado
    D: Crea una turbulencia de viento excesiva
  answer: B
  explanation: Después de haber rebasado a un ciclista, no reduzca la velocidad ni
    se detenga rápidamente porque una parada repentina podría provocar que el ciclista
    choque contra su vehículo.
- id: 275
  category: sharing_the_road
  question: ¿Cuánto espacio de carril debe permitir que use un motociclista o conductor
    de ciclomotor?
  choices:
    A: La mitad de un carril
    B: Un carril completo
    C: Solo el lado derecho del carril
    D: Tanto espacio como necesiten hasta la línea central
  answer: B
  explanation: Según la ley, debe permitir que el motociclista o el conductor de ciclomotor
    utilice un carril completo.
- id: 276
  category: sharing_the_road
  question: ¿Por qué no debe asumir que una motocicleta está girando solo porque su
    luz direccional está parpadeando?
  choices:
    A: Los motociclistas a menudo usan las luces direccionales para indicar que están
      reduciendo la velocidad
    B: Es posible que las luces direccionales no se apaguen automáticamente como las
      de un automóvil
    C: Las señales intermitentes indican que la motocicleta tiene el derecho de paso
    D: Los motociclistas usan las luces direccionales para probar su batería
  answer: B
  explanation: No debe asumir que una motocicleta o ciclomotor está girando cuando
    su señal parpadea porque sus luces direccionales pueden no apagarse automáticamente
    como las de un vehículo.
- id: 277
  category: sharing_the_road
  question: ¿Qué debe hacer cuando un camión grande está rebasando su vehículo?
  choices:
    A: Aumentar su velocidad para apartarse del camino
    B: Reducir su velocidad ligeramente y mantenerla constante
    C: Frenar bruscamente para dejar que el camión pase rápidamente
    D: Moverse hacia el punto ciego del camión
  answer: B
  explanation: Cuando un camión rebase su vehículo, le facilitará las cosas al conductor
    del camión si reduce su velocidad ligeramente y luego la mantiene constante. No
    aumente su velocidad.
- id: 278
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una regla de seguridad que debe seguir al conducir
    a través de una zona de obras?
  choices:
    A: Usar siempre el control de crucero para mantener una velocidad constante
    B: No usar el control de crucero
    C: Detenerse para pedir direcciones a los trabajadores si está perdido
    D: Cruzar líneas blancas continuas para evitar el equipo de construcción
  answer: B
  explanation: El manual enumera varias reglas de seguridad para las zonas de obras,
    incluyendo 'No use su control de crucero en zonas de obras'.
- id: 279
  category: defensive_driving
  question: ¿Qué tan probable es que muera en un choque que involucre a un tren en
    comparación con un choque con otro vehículo?
  choices:
    A: 10 veces más probable
    B: 20 veces más probable
    C: 30 veces más probable
    D: 40 veces más probable
  answer: D
  explanation: Según el manual, usted tiene 40 veces más probabilidades de morir en
    un choque que involucre a un tren que en un choque con otro vehículo.
- id: 280
  category: sharing_the_road
  question: ¿Cuál es la distancia de seguimiento mínima recomendada que debe dejar
    al conducir detrás de una motocicleta?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: Debe permitir la misma distancia de seguimiento de 4 segundos o más
    que permitiría para otros vehículos al seguir a una motocicleta o ciclomotor.
- id: 281
  category: sharing_the_road
  question: ¿Cómo afecta a los vehículos la turbulencia del viento entre su vehículo
    y un camión que viene en sentido contrario?
  choices:
    A: Atrae a los vehículos entre sí.
    B: Empuja a los vehículos para alejarlos.
    C: Hace que el camión frene repentinamente.
    D: No tiene ningún efecto en los vehículos de pasajeros.
  answer: B
  explanation: 'El manual establece: "Recuerde, la turbulencia del viento empuja a
    los vehículos para alejarlos. No los atrae entre sí".'
- id: 282
  category: sharing_the_road
  question: ¿Cómo puede asegurarse de que el conductor de un camión pueda ver su vehículo
    cuando lo sigue?
  choices:
    A: Encienda las luces altas para ser visible.
    B: Toque la bocina cada pocos minutos.
    C: Posicione su vehículo de modo que pueda ver los espejos laterales del camión.
    D: Siga al camión muy de cerca para permanecer en su línea de visión directa.
  answer: C
  explanation: 'El manual establece: "Al seguir a un camión o autobús, si no puede
    ver los espejos laterales del vehículo que está delante de usted, el conductor
    del vehículo grande no puede verlo".'
- id: 283
  category: defensive_driving
  question: ¿Por qué debe dejar mucho espacio entre su vehículo y un camión al detenerse
    en una colina?
  choices:
    A: El escape del camión dañará su parabrisas.
    B: Los camiones pueden rodar hacia atrás cuando el conductor quita el pie del
      freno.
    C: El camión necesita espacio adicional para hacer un giro amplio.
    D: Los frenos de aire del camión emitirán un ruido fuerte.
  answer: B
  explanation: 'El manual establece: "Deje mucho espacio entre usted y el camión al
    detenerse en una colina. Los camiones pueden rodar hacia atrás cuando el conductor
    quita el pie del freno".'
- id: 284
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento mínima recomendada para mantenerse
    fuera del punto ciego trasero de un camión?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: C
  explanation: 'El manual establece: "Se necesitan al menos cuatro (4) segundos para
    mantenerse fuera del punto ciego trasero del camión..."'
- id: 285
  category: sharing_the_road
  question: 'Cuando un camión está haciendo un giro amplio a la derecha, a veces puede
    parecer que está:'
  choices:
    A: Yendo recto o girando a la izquierda
    B: Preparándose para retroceder
    C: Experimentando una falla en los frenos
    D: Acelerando para rebasar a otro vehículo
  answer: A
  explanation: 'El manual establece: "Puede parecer que los camiones van recto o giran
    a la izquierda cuando en realidad están haciendo un giro a la derecha".'
- id: 286
  category: vehicle_information
  question: En condiciones despejadas y secas a 65 mph, ¿cuál es la distancia mínima
    de frenado requerida para un camión cargado con buenos neumáticos y frenos ajustados
    correctamente?
  choices:
    A: 200 pies
    B: 400 pies
    C: 600 pies
    D: 800 pies
  answer: C
  explanation: El manual establece que un camión cargado que viaja a 65 mph en una
    carretera despejada y seca requiere un mínimo de 600 pies para detenerse por completo.
- id: 287
  category: safe_driving_rules
  question: ¿Cuál es el propósito de las rampas de escape en pendientes largas?
  choices:
    A: Para que los vehículos de pasajeros tomen un descanso.
    B: Para que la policía controle los vehículos que exceden la velocidad.
    C: Para vehículos grandes que están fuera de control o tienen fallas en los frenos.
    D: Para que las cargas de gran tamaño permitan el paso del tráfico.
  answer: C
  explanation: 'El manual establece: "Estas rampas deben ser utilizadas únicamente
    por vehículos grandes que estén fuera de control o que no puedan detenerse debido
    a una falla en los frenos".'
- id: 288
  category: safe_driving_rules
  question: Cuando un autobús escolar se detiene con sus luces rojas intermitentes
    y el brazo de parada extendido, ¿a qué distancia debe detenerse?
  choices:
    A: Al menos a 10 pies de distancia
    B: Al menos a 15 pies de distancia
    C: Al menos a 20 pies de distancia
    D: Al menos a 50 pies de distancia
  answer: A
  explanation: 'El manual establece: "debe detenerse al menos a 10 pies de distancia
    del autobús, ya sea que esté detrás de él o que venga hacia él en la misma calzada..."'
- id: 289
  category: safe_driving_rules
  question: ¿Bajo qué condición NO se requiere que se detenga ante un autobús escolar
    con luces rojas intermitentes y un brazo de parada extendido?
  choices:
    A: Cuando viaja en la misma dirección que el autobús.
    B: Cuando se aproxima a una intersección donde el autobús está detenido.
    C: Cuando conduce en el lado opuesto de una carretera dividida.
    D: Cuando conduce en una zona escolar designada.
  answer: C
  explanation: 'El manual establece: "Si se aproxima a un autobús escolar... y conduce
    en el lado opuesto de una carretera dividida... no tiene que detenerse".'
- id: 290
  category: penalties_and_points
  question: ¿Cuál es la sanción por no detenerse ante un autobús escolar con una luz
    roja intermitente y el brazo de parada extendido?
  choices:
    A: Una suspensión de 30 días, 3 puntos y una multa
    B: Una suspensión de 60 días, 5 puntos y una multa
    C: Una suspensión de 90 días, 2 puntos y una multa
    D: Una suspensión de 6 meses, 6 puntos y una multa
  answer: B
  explanation: 'El manual establece: "No detenerse ante un autobús escolar con una
    luz roja intermitente y el brazo de parada extendido resultará en una suspensión
    de 60 días de su licencia de conducir, cinco (5) puntos en su historial de manejo
    y una multa".'
- id: 291
  category: safe_driving_rules
  question: Según la ley Move Over, ¿qué debe hacer si no puede cambiarse a un carril
    que no sea adyacente a un área de respuesta a emergencias?
  choices:
    A: Detener su vehículo inmediatamente hasta que se despeje la emergencia.
    B: Mantener su velocidad pero encender las luces de emergencia (luces intermitentes).
    C: Reducir su velocidad a por lo menos 20 millas por hora por debajo del límite
      de velocidad indicado.
    D: Tocar la bocina para alertar a los trabajadores de emergencia de su presencia.
  answer: C
  explanation: 'El manual establece: "Si los conductores no pueden cambiarse de carril
    debido al tráfico u otras condiciones, deben reducir su velocidad a por lo menos
    20 millas por hora por debajo del límite de velocidad indicado".'
- id: 292
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a su historial de conducción si es condenado
    por violar la ley Move Over?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: A
  explanation: 'El manual establece: "Cualquier persona condenada por una violación
    de esta ley tendrá 2 puntos asignados a su historial de conducción".'
- id: 293
  category: penalties_and_points
  question: ¿Qué sucede con las multas por infracciones de tránsito, incluidas las
    violaciones de la ley Move Over, que ocurren en zonas de obras?
  choices:
    A: Se anulan si no hay trabajadores presentes.
    B: Se reducen a la mitad.
    C: Siguen siendo las mismas que en las carreteras normales.
    D: Se duplican.
  answer: D
  explanation: 'El manual establece: "Además, las multas se duplicarán por las infracciones
    de tránsito que ocurran en áreas de zonas de obras".'
- id: 294
  category: sharing_the_road
  question: ¿Por qué debe siempre bajar las luces (usar luces cortas) cuando sigue
    a un camión por la noche?
  choices:
    A: Las luces altas agotarán la batería de su vehículo más rápido.
    B: Las luces altas cegarán al conductor del camión cuando se reflejen en los grandes
      espejos laterales.
    C: Los conductores de camiones usan sus espejos para hacer señales a otros conductores.
    D: Bajar las luces le ayuda a ver mejor las luces de freno del camión.
  answer: B
  explanation: 'El manual establece: "Las luces brillantes de un vehículo que viene
    detrás cegarán al conductor del camión cuando se reflejen en los grandes espejos
    laterales del camión".'
- id: 295
  category: sharing_the_road
  question: ¿Qué debe esperar al encontrarse con una carga de dimensiones excesivas
    (oversized load) en la carretera?
  choices:
    A: Siempre se detendrán a un lado para dejarle pasar.
    B: Viajan mucho más rápido que los camiones de remolque normales.
    C: Están acompañados por vehículos guía y pueden cruzar la línea amarilla o blanca.
    D: Solo se les permite viajar de noche.
  answer: C
  explanation: 'El manual establece: "Las cargas de dimensiones excesivas están acompañadas
    por vehículos guía... debido a su ancho excesivo, los obstáculos en el arcén podrían
    hacer que crucen la línea amarilla o blanca".'
- id: 296
  category: sharing_the_road
  question: ¿Por qué debe dejar suficiente espacio cuando se detiene detrás de un
    vehículo tirado por caballos?
  choices:
    A: A menudo ruedan hacia atrás después de detenerse.
    B: Los caballos podrían patear su vehículo.
    C: Requieren un espacio libre de 50 pies por ley.
    D: El conductor necesita espacio para desmontar de forma segura.
  answer: A
  explanation: Según el manual, después de detenerse, los vehículos tirados por caballos
    a menudo ruedan hacia atrás, y seguirlos demasiado de cerca limita la capacidad
    del conductor para verlo a usted.
- id: 297
  category: sharing_the_road
  question: ¿Qué debe evitar hacer al adelantar a un vehículo tirado por caballos
    o a un jinete?
  choices:
    A: Usar sus señales de giro.
    B: Conducir demasiado rápido o tocar la bocina.
    C: Adelantar por el lado izquierdo.
    D: Dejar espacio antes de volver al carril derecho.
  answer: B
  explanation: Cuando adelante a un vehículo tirado por caballos o a un jinete, no
    conduzca demasiado rápido ni toque la bocina, ya que esto puede asustar al caballo.
- id: 298
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo para una camioneta de caja abierta
    si una persona está ocupando la caja de la camioneta?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Una camioneta de caja abierta o un camión de plataforma abierta no
    puede conducirse a una velocidad de más de 35 mph si alguna persona está ocupando
    la caja o plataforma del camión.
- id: 299
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes condiciones se le permite legalmente a un
    menor de 18 años viajar en la caja de una camioneta abierta?
  choices:
    A: Cuando viaja a un evento escolar.
    B: Cuando participa en un desfile oficialmente autorizado.
    C: Cuando la camioneta viaja a menos de 15 mph.
    D: Cuando está acompañado por un adulto en la caja de la camioneta.
  answer: B
  explanation: Las excepciones a la ley que prohíbe a los menores de 18 años viajar
    en la caja de una camioneta abierta incluyen a un menor que participa en un desfile
    oficialmente autorizado.
- id: 300
  category: sharing_the_road
  question: Después de que un vehículo de emergencia lo adelanta, ¿cuál es la distancia
    mínima que debe mantener con respecto a este?
  choices:
    A: 100 pies
    B: 250 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: El manual instruye a los conductores a comenzar a conducir nuevamente
    después de que el vehículo de emergencia pase, manteniéndose al menos a 500 pies
    de distancia de este.
- id: 301
  category: sharing_the_road
  question: ¿Por qué es peligroso intentar rebasar a un quitanieves?
  choices:
    A: Viajan a velocidades que superan el límite establecido.
    B: Pueden tener palas laterales (wing plows) que sobresalen varios pies a cada
      lado.
    C: Rebasar a un quitanieves conlleva una suspensión automática de la licencia.
    D: Se detienen con frecuencia para recoger a automovilistas varados.
  answer: B
  explanation: Los quitanieves pueden tener palas laterales que sobresalen varios
    pies a cada lado, las cuales son difíciles de ver y han estado involucradas en
    múltiples accidentes de raspado lateral. Por lo tanto, no debe intentar rebasar
    a un quitanieves.
- id: 302
  category: defensive_driving
  question: Si un conductor agresivo lo persigue, ¿cuál es la acción más segura?
  choices:
    A: Conducir a su casa y cerrar las puertas con llave.
    B: Aumentar la velocidad para perder al conductor agresivo.
    C: Conducir a una estación de policía o a una tienda de conveniencia.
    D: Detener su vehículo y confrontar al conductor.
  answer: C
  explanation: Si un conductor agresivo lo persigue, no vaya a su casa. En su lugar,
    conduzca a una estación de policía, tienda de conveniencia u otro lugar donde
    pueda obtener ayuda y haya testigos.
- id: 303
  category: defensive_driving
  question: Según el manual, ¿qué porcentaje aproximado de las muertes en las carreteras
    de Pensilvania cada año se atribuyen a la conducción agresiva?
  choices:
    A: 20 por ciento
    B: 37 por ciento
    C: 60 por ciento
    D: 85 por ciento
  answer: C
  explanation: De las aproximadamente 1,500 muertes en carreteras en PA cada año,
    alrededor del 60 por ciento (unas 900) se atribuyen a la conducción agresiva.
- id: 304
  category: defensive_driving
  question: Al evitar una colisión a velocidades superiores a 25 mph, ¿por qué suele
    ser mejor maniobrar el volante para evitar el peligro que frenar?
  choices:
    A: Frenar a altas velocidades siempre hace que el vehículo vuelque.
    B: Su tiempo de reacción para dar un volantazo es más rápido que su tiempo de
      reacción para frenar.
    C: Los frenos antibloqueo no funcionan por encima de las 25 mph.
    D: Maniobrar el volante requiere menos esfuerzo físico que frenar.
  answer: B
  explanation: Por lo general, es mejor maniobrar el volante para evitar un peligro
    que frenar a velocidades superiores a 25 mph, porque su tiempo de reacción para
    dar un volantazo es más rápido que su tiempo de reacción para frenar.
- id: 305
  category: vehicle_information
  question: ¿Dónde deben colocarse las manos en el volante para minimizar el riesgo
    de lesiones si se despliega la bolsa de aire (air bag)?
  choices:
    A: Las 10 y las 2 en punto
    B: Las 12 y las 6 en punto
    C: Las 9 y las 3 en punto o las 8 y las 4 en punto
    D: Una mano a las 12 en punto
  answer: C
  explanation: El manual recomienda sujetar el volante en las posiciones de las 9
    y las 3 en punto o las 8 y las 4 en punto. Una posición de las 10 y las 2 en punto
    lo pone en riesgo de sufrir lesiones si se despliega la bolsa de aire.
- id: 306
  category: vehicle_information
  question: ¿Cómo debe colocar los pulgares al sujetar el volante?
  choices:
    A: Agarrando con fuerza el interior del aro del volante.
    B: Descansando sobre la almohadilla central de la bocina.
    C: Apuntando directamente hacia su cuerpo.
    D: A lo largo de la cara del volante.
  answer: D
  explanation: Debe mantener los pulgares a lo largo de la cara del volante en lugar
    de agarrar el interior del aro.
- id: 307
  category: safe_driving_rules
  question: Para ayudar a prevenir lesiones en un choque, ¿cuál es la distancia mínima
    recomendada a la que debe estar posicionado con respecto a su bolsa de aire?
  choices:
    A: 5 pulgadas
    B: 10 pulgadas
    C: 15 pulgadas
    D: 20 pulgadas
  answer: B
  explanation: La prevención de lesiones en un choque depende principalmente de usar
    el cinturón de seguridad correctamente, tener los reposacabezas ajustados y estar
    posicionado al menos a diez (10) pulgadas de distancia de su bolsa de aire.
- id: 308
  category: defensive_driving
  question: ¿Cómo debe aplicar los frenos en una emergencia si su vehículo NO tiene
    un sistema de frenos antibloqueo (ABS)?
  choices:
    A: Mantener una presión firme y continua.
    B: Pisar los frenos a fondo y mantenerlos presionados.
    C: Presionar y soltar los frenos repetidamente.
    D: Aplicar el freno de estacionamiento inmediatamente.
  answer: C
  explanation: Sin ABS, debe presionar y soltar los frenos repetidamente (bombear
    los frenos) para reducir la velocidad de su vehículo y mantenerlo bajo control.
    Pisar los frenos a fondo puede bloquear las ruedas.
- id: 309
  category: defensive_driving
  question: ¿Cuál es la técnica de frenado correcta durante una emergencia si su vehículo
    está equipado con frenos antibloqueo (ABS)?
  choices:
    A: Bombear el pedal del freno rápidamente.
    B: Mantener una presión firme y continua en el freno.
    C: Presionar el freno ligeramente y maniobrar el volante bruscamente.
    D: Pisar los frenos a fondo y soltarlos inmediatamente.
  answer: B
  explanation: Con ABS, debe mantener una presión firme y continua en el freno. No
    bombee el pedal del freno.
- id: 310
  category: defensive_driving
  question: ¿Qué debe hacer si la parte trasera de su vehículo comienza a derrapar
    hacia la derecha en una carretera con hielo?
  choices:
    A: Girar el volante hacia la izquierda.
    B: Girar el volante hacia la derecha.
    C: Pisar los frenos a fondo inmediatamente.
    D: Cambiar a punto muerto (neutral) y avanzar por inercia.
  answer: B
  explanation: Si su vehículo comienza a derrapar, mire y gire el volante en la dirección
    a la que desea ir. Si la parte trasera de su vehículo derrapa hacia la derecha,
    gire el volante hacia la derecha. No debe usar los frenos.
- id: 311
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo comienza a derrapar?
  choices:
    A: Frenar en seco inmediatamente
    B: Girar el volante en la dirección opuesta a la que derrapa la parte trasera
    C: Girar el volante en la dirección en la que derrapa la parte trasera de su vehículo
    D: Poner el vehículo en punto muerto (neutral) y aplicar el freno de estacionamiento
  answer: C
  explanation: Para detener un derrape, debe girar el volante en la dirección en la
    que derrapa la parte trasera de su vehículo. Puede que necesite hacer algunas
    correcciones para recuperar el control.
- id: 312
  category: defensive_driving
  question: ¿Por qué debe evitar usar los frenos cuando su vehículo está derrapando?
  choices:
    A: Hará que el motor se apague
    B: Corre el riesgo de bloquear las ruedas y perder todo el control de la dirección
    C: Hará que el acelerador se atasque
    D: Dañará su transmisión
  answer: B
  explanation: Al derrapar, no use los frenos. Si pisa los frenos, el derrape empeorará
    y correrá el riesgo de bloquear las ruedas y perder todo el control de la dirección.
- id: 313
  category: safe_driving_rules
  question: ¿Cuánta agua en movimiento se necesita para que muchos autos floten?
  choices:
    A: Dos pulgadas
    B: Seis pulgadas
    C: Doce pulgadas
    D: Dos pies
  answer: C
  explanation: Según el manual, doce pulgadas de agua en movimiento pueden hacer flotar
    a muchos autos.
- id: 314
  category: safe_driving_rules
  question: ¿Cuánta agua en movimiento se requiere generalmente para arrastrar a la
    mayoría de los vehículos utilitarios deportivos (SUV) y camionetas (pick-up)?
  choices:
    A: Seis pulgadas
    B: Doce pulgadas
    C: Dieciocho pulgadas
    D: Dos pies
  answer: D
  explanation: Dos pies de agua en movimiento pueden mover a la mayoría de los SUV
    y camionetas, y arrastrarán a la mayoría de los vehículos.
- id: 315
  category: defensive_driving
  question: Si el acelerador (pedal del gas) de su vehículo se atasca, ¿qué es lo
    primero que debe hacer con la transmisión de su vehículo?
  choices:
    A: Cambiar a punto muerto (neutral) inmediatamente
    B: Cambiar a la marcha más baja
    C: Poner el vehículo en park (estacionamiento)
    D: Poner el vehículo en reversa
  answer: A
  explanation: Si el acelerador se atasca y darle unos toques no funciona, debe cambiar
    a punto muerto (neutral) inmediatamente y usar los frenos.
- id: 316
  category: vehicle_information
  question: Si necesita reducir la velocidad o detenerse rápidamente porque su acelerador
    está atascado, ¿por qué debe evitar girar el encendido a la posición 'LOCK' (bloqueo)?
  choices:
    A: Hará que el motor se incendie
    B: Perderá la capacidad de dirección
    C: Sus frenos se bloquearán inmediatamente
    D: Se desplegarán las bolsas de aire
  answer: B
  explanation: Si necesita reducir la velocidad o detenerse rápidamente, gire el encendido
    a 'OFF' (apagado). No lo gire a 'LOCK' porque perderá la capacidad de dirección.
- id: 317
  category: vehicle_information
  question: Si se enciende la luz de advertencia del sistema de frenos en un vehículo
    más nuevo, ¿qué debe esperar al presionar el pedal del freno?
  choices:
    A: El pedal se sentirá inusualmente rígido y difícil de presionar
    B: El pedal bajará más de lo habitual y tendrá que presionar con más fuerza
    C: El vehículo bloqueará inmediatamente las cuatro ruedas
    D: El pedal vibrará violentamente
  answer: B
  explanation: En los vehículos más nuevos con un sistema de frenos dividido, si se
    enciende la luz de advertencia, sentirá que el pedal del freno baja más de lo
    habitual antes de que el vehículo comience a reducir la velocidad, y tendrá que
    presionar con más fuerza.
- id: 318
  category: vehicle_information
  question: Al cambiar una llanta desinflada, ¿en qué momento debe aflojar las tuercas
    de la rueda?
  choices:
    A: Después de que el vehículo se haya elevado 6 pulgadas del suelo
    B: Mientras el vehículo todavía está en el suelo
    C: Después de quitar completamente el tapacubos y levantar el auto 12 pulgadas
      con el gato
    D: Solo después de instalar la llanta de repuesto
  answer: B
  explanation: Mientras el vehículo está en el suelo, afloje las tuercas de la rueda
    usando el extremo de la llave de tuercas. No las quite por completo hasta que
    el vehículo esté elevado.
- id: 319
  category: defensive_driving
  question: ¿Cuál es una indicación común de que una llanta delantera se ha reventado?
  choices:
    A: La parte trasera del vehículo se tambaleará de un lado a otro
    B: El volante vibrará y el vehículo tirará repentinamente hacia un lado
    C: El motor se acelerará repentinamente
    D: El pedal del freno caerá hasta el piso
  answer: B
  explanation: Cuando una llanta delantera se revienta, el volante vibrará y sentirá
    que el vehículo tira repentinamente hacia un lado.
- id: 320
  category: defensive_driving
  question: ¿Qué es lo más importante que debe evitar hacer inmediatamente después
    de que se reviente una llanta?
  choices:
    A: Sujetar el volante con fuerza
    B: Quitar el pie del pedal del acelerador
    C: Frenar
    D: Girar el volante suavemente
  answer: C
  explanation: Si se revienta una llanta, ¡no use el freno! Frenar después de un reventón
    hará que derrape y pierda el control de su vehículo.
- id: 321
  category: defensive_driving
  question: Si los frenos fallan repentinamente en un vehículo antiguo, ¿qué debería
    intentar hacer para aumentar la presión de los frenos?
  choices:
    A: Cambiar a punto muerto (neutral) y apagar el motor
    B: Bombear el pedal del freno rápidamente varias veces
    C: Tirar del freno de estacionamiento tan rápido y fuerte como sea posible
    D: Presionar y mantener el pedal del freno firmemente contra el piso
  answer: B
  explanation: Si los frenos fallan en un vehículo antiguo, bombee el pedal del freno
    rápidamente varias veces. Esto a menudo generará suficiente presión de frenado
    para detener el vehículo.
- id: 322
  category: defensive_driving
  question: Si otro vehículo se le aproxima de frente en su carril, ¿hacia qué dirección
    debería intentar escapar si es posible?
  choices:
    A: Hacia la izquierda
    B: Hacia la derecha
    C: Hacia adelante mientras frena con fuerza
    D: Hacia el carril de tráfico en sentido contrario
  answer: B
  explanation: Si otro vehículo se aproxima de frente, toque la bocina para llamar
    la atención e intente escapar hacia la derecha, si es posible. Virar hacia la
    izquierda podría resultar en un choque si el otro conductor corrige su trayectoria.
- id: 323
  category: sharing_the_road
  question: ¿Qué debe hacer si se encuentra con un cortejo fúnebre en una intersección?
  choices:
    A: Continuar si tiene la luz verde, atravesando el cortejo
    B: Ceder el paso a los vehículos del cortejo hasta que todos hayan pasado
    C: Tocar la bocina para avisarles que está esperando
    D: Incorporarse al cortejo para cruzar la intersección más rápido
  answer: B
  explanation: Una vez que el vehículo guía ha despejado una intersección, el resto
    del cortejo puede continuar a través de la intersección y el resto del tráfico
    debe ceder el paso. Permita que el cortejo pase y no se cruce entre los vehículos.
- id: 324
  category: sharing_the_road
  question: ¿Cómo puede identificar los vehículos que forman parte de un cortejo fúnebre?
  choices:
    A: Tendrán encendidas las luces altas
    B: Tendrán encendidas sus luces delanteras y las luces de emergencia (intermitentes)
      y llevarán una bandera o insignia
    C: Conducirán al menos a 15 mph por debajo del límite de velocidad
    D: Tendrán una luz amarilla intermitente en el techo
  answer: B
  explanation: Todos los vehículos en un cortejo fúnebre deben tener encendidas sus
    luces delanteras y las luces de emergencia (intermitentes) y llevar una bandera
    u otra insignia que los identifique como parte del cortejo.
- id: 325
  category: safe_driving_rules
  question: ¿Cuál es su mejor opción si se queda atrapado en aguas de inundación?
  choices:
    A: Permanecer en su vehículo y esperar a los servicios de emergencia
    B: Salir rápidamente de su vehículo y dirigirse a un terreno más alto
    C: Subir las ventanillas y encender el aire acondicionado
    D: Intentar reiniciar el motor y salir del agua en reversa
  answer: B
  explanation: Si se queda atrapado en aguas de inundación, salga rápidamente de su
    vehículo y diríjase a un terreno más alto.
- id: 326
  category: sharing_the_road
  question: ¿Qué deben tener encendido todos los vehículos en un cortejo fúnebre?
  choices:
    A: Luces altas
    B: Luces delanteras y luces de emergencia (intermitentes)
    C: Solo las luces de emergencia (intermitentes)
    D: Luces interiores del techo
  answer: B
  explanation: Según el manual, todos los vehículos en un cortejo fúnebre deben tener
    encendidas sus luces delanteras y las luces de emergencia (intermitentes) y llevar
    una bandera u otra insignia.
- id: 327
  category: sharing_the_road
  question: Si el vehículo guía de un cortejo fúnebre entra en una intersección con
    luz verde, ¿qué pueden hacer los vehículos que le siguen en el cortejo?
  choices:
    A: Deben detenerse si la luz cambia a rojo.
    B: Deben ceder el paso a todo el tráfico transversal antes de continuar.
    C: Pueden continuar a través de una luz roja.
    D: Deben esperar a la siguiente luz verde.
  answer: C
  explanation: Los conductores en cortejos fúnebres pueden continuar a través de una
    luz roja o una señal de alto si el vehículo guía comenzó a cruzar la intersección
    mientras la luz estaba en verde.
- id: 328
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si las ruedas derechas de su vehículo
    se salen del pavimento hacia el arcén (hombro)?
  choices:
    A: Frenar con fuerza inmediatamente.
    B: Girar bruscamente hacia la izquierda.
    C: Dejar de presionar el pedal del acelerador para reducir la velocidad.
    D: Encender las luces de emergencia.
  answer: C
  explanation: Si se sale del pavimento, el primer paso es dejar de presionar el pedal
    del acelerador para reducir la velocidad. No debe frenar repentinamente.
- id: 329
  category: defensive_driving
  question: ¿Por qué es peligroso girar el volante bruscamente para volver a la carretera
    después de salirse hacia un arcén (hombro) blando?
  choices:
    A: Dañará sus neumáticos delanteros.
    B: Puede hacer que el vehículo dé un latigazo lateral y cruce hacia el tráfico
      en sentido contrario.
    C: Hará que su motor se apague.
    D: Bloqueará su volante.
  answer: B
  explanation: El manual advierte que si gira el volante bruscamente para volver a
    la carretera, esto puede causar que el vehículo dé un latigazo lateral y cruce
    hacia el tráfico en sentido contrario.
- id: 330
  category: safe_driving_rules
  question: Antes de intentar girar para volver al pavimento después de salirse, ¿debe
    continuar reduciendo la velocidad gradualmente hasta que viaje a qué velocidad?
  choices:
    A: Menos de 25 mph
    B: Menos de 35 mph
    C: Menos de 45 mph
    D: Menos de 55 mph
  answer: A
  explanation: Debe continuar reduciendo la velocidad gradualmente hasta que viaje
    muy lentamente (a menos de 25 mph y preferiblemente cerca de 10 mph) antes de
    girar para volver al pavimento.
- id: 331
  category: driver_responsibility
  question: 'Los conductores adolescentes tienen más probabilidades de verse involucrados
    en un choque cuando:'
  choices:
    A: Conducen con pasajeros adultos
    B: Conducen con pasajeros adolescentes
    C: Conducen sin ningún pasajero
    D: Conducen con su mascota como pasajero
  answer: B
  explanation: Según las preguntas de repaso del manual, los conductores adolescentes
    tienen más probabilidades de verse involucrados en un choque cuando conducen con
    pasajeros adolescentes.
- id: 332
  category: sharing_the_road
  question: 'Al viajar detrás de una motocicleta, debe permitir una distancia de seguimiento
    de al menos:'
  choices:
    A: 2 largos de automóvil
    B: 2 segundos
    C: 4 segundos
    D: 4 largos de motocicleta
  answer: C
  explanation: Al viajar detrás de una motocicleta, debe permitir al menos 4 segundos
    de distancia de seguimiento.
- id: 333
  category: sharing_the_road
  question: ¿Quién debe ceder el paso cuando un conductor está girando y un peatón
    está cruzando sin un semáforo?
  choices:
    A: El peatón
    B: El conductor
    C: Quien haya comenzado al último
    D: Quien sea más lento
  answer: B
  explanation: El conductor debe ceder el paso al girar si un peatón está cruzando,
    incluso sin un semáforo.
- id: 334
  category: sharing_the_road
  question: 'Al compartir la carretera con un camión, es importante recordar que,
    en general, los camiones:'
  choices:
    A: Toman distancias más largas que los automóviles para detenerse
    B: Requieren menos tiempo para rebasar en una pendiente descendente que los automóviles
    C: Requieren menos radio de giro que los automóviles
    D: Requieren menos tiempo para rebasar en una pendiente ascendente que los automóviles
  answer: A
  explanation: En general, los camiones requieren distancias más largas que los automóviles
    para detenerse.
- id: 335
  category: sharing_the_road
  question: 'Si usted sigue a un camión que se abre hacia la izquierda antes de dar
    una vuelta a la derecha en una intersección, es muy peligroso:'
  choices:
    A: Aplicar los frenos hasta que el camión haya completado el giro
    B: Intentar meterse entre el camión y la acera para dar una vuelta a la derecha
    C: Violar la regla de los 4 segundos de distancia de seguimiento
    D: Tocar la bocina al conductor del camión
  answer: B
  explanation: Es muy peligroso intentar meterse entre el camión y la acera para dar
    una vuelta a la derecha cuando un camión se abre hacia la izquierda para prepararse
    para el giro.
- id: 336
  category: sharing_the_road
  question: 'El único momento en que no tiene que detenerse ante un autobús escolar
    cuyas luces rojas parpadean y el brazo de parada está extendido es cuando usted:'
  choices:
    A: Conduce en el lado opuesto de una carretera dividida
    B: Está detrás del autobús
    C: No ve niños presentes
    D: Puede rebasar de forma segura por la izquierda
  answer: A
  explanation: No tiene que detenerse ante un autobús escolar con luces rojas parpadeantes
    si conduce en el lado opuesto de una carretera dividida.
- id: 337
  category: safe_driving_rules
  question: 'Si se detiene en un cruce de ferrocarril con más de una vía, debe:'
  choices:
    A: Detenerse sobre la vía del tren y vigilar si viene otro tren
    B: Cruzar tan pronto como pase el tren
    C: Cruzar cuando una de las vías esté libre
    D: Esperar hasta tener una vista despejada de ambas vías
  answer: D
  explanation: En un cruce de ferrocarril con más de una vía, debe esperar hasta tener
    una vista despejada de ambas vías antes de continuar.
- id: 338
  category: safe_driving_rules
  question: 'Cuando planee dar una vuelta, debe activar sus señales de giro:'
  choices:
    A: Solo si hay otros conductores siguiéndole
    B: Justo cuando la parte delantera de su automóvil llegue a la intersección
    C: De 3 a 4 segundos antes de llegar a la intersección
    D: 2 largos de automóvil antes de llegar a la intersección
  answer: C
  explanation: Debe activar sus señales de giro de 3 a 4 segundos antes de llegar
    a la intersección.
- id: 339
  category: defensive_driving
  question: ¿A qué se refiere el "punto ciego" de un conductor?
  choices:
    A: El área de la carretera que no puede ver sin mover la cabeza
    B: El área directamente detrás de su vehículo
    C: El área que ve en su espejo retrovisor
    D: El área que ve en su espejo lateral
  answer: A
  explanation: Su punto ciego es el área de la carretera que no puede ver sin mover
    la cabeza para mirar por encima del hombro.
- id: 340
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado a seguir antes de retroceder con su
    vehículo?
  choices:
    A: Confiar únicamente en sus espejos para ver si el camino está despejado
    B: Encender y apagar sus luces para advertir a los demás
    C: Abrir la puerta para mirar hacia atrás
    D: Girar la cabeza y mirar a través de la ventana trasera
  answer: D
  explanation: Antes de retroceder, debe girar la cabeza y mirar a través de la ventana
    trasera para asegurarse de que el camino esté despejado para continuar.
- id: 341
  category: vehicle_information
  question: ¿Qué debe hacer para indicar que va a girar si las luces direccionales
    de su vehículo fallan?
  choices:
    A: Tocar la bocina
    B: Hacer destellos con los faros
    C: Usar señales manuales
    D: Encender las luces de emergencia
  answer: C
  explanation: Si sus luces direccionales fallan, debe usar las señales manuales adecuadas
    para indicar a otros conductores que va a girar.
- id: 342
  category: safe_driving_rules
  question: ¿A partir de qué distancia debe usar sus faros si otros vehículos no son
    visibles?
  choices:
    A: 500 pies de distancia
    B: 1000 pies de distancia
    C: 1200 pies de distancia
    D: 1500 pies de distancia
  answer: B
  explanation: Debe usar sus faros cuando otros vehículos no sean visibles desde una
    distancia de 1000 pies.
- id: 343
  category: defensive_driving
  question: ¿Hacia dónde debe mirar si un vehículo que usa luces altas viene hacia
    usted?
  choices:
    A: Hacia el centro de la carretera
    B: Hacia el lado izquierdo de la carretera
    C: Hacia el lado derecho de la carretera
    D: Directamente a los faros del vehículo que se aproxima
  answer: C
  explanation: Si un vehículo que usa luces altas viene hacia usted, debe mirar hacia
    el lado derecho de la carretera para evitar ser cegado por el resplandor.
- id: 344
  category: alcohol_drugs_health
  question: 'El efecto que la falta de sueño tiene en su capacidad para conducir de
    manera segura es el mismo que:'
  choices:
    A: El efecto que tiene el alcohol
    B: El efecto que tienen las anfetaminas
    C: El efecto que tiene la ira
    D: El efecto de conducir con pasajeros adolescentes
  answer: A
  explanation: El efecto que la falta de sueño tiene en su capacidad para conducir
    de manera segura es el mismo que el efecto que tiene el alcohol.
- id: 345
  category: alcohol_drugs_health
  question: Para evitar el riesgo de choques por conducir con somnolencia, ¿cuántas
    horas de sueño como mínimo deberían intentar dormir los adolescentes cada noche?
  choices:
    A: 6 horas
    B: 7 horas
    C: 8 horas
    D: 9 horas
  answer: C
  explanation: Los adolescentes deben intentar dormir al menos 8 horas cada noche
    para evitar el riesgo de choques por conducir con somnolencia.
- id: 346
  category: alcohol_drugs_health
  question: Para una persona promedio, ¿cuántos minutos necesita el cuerpo para procesar
    el alcohol de una bebida?
  choices:
    A: 15 minutos
    B: 30 minutos
    C: 60 minutos
    D: 90 minutos
  answer: C
  explanation: Para una persona promedio, el cuerpo necesita 60 minutos para procesar
    el alcohol de una bebida.
- id: 347
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de consumir drogas junto con alcohol antes de conducir?
  choices:
    A: Disminuye el efecto del alcohol en su capacidad para conducir
    B: Aumenta el riesgo de causar un choque
    C: No tiene ningún efecto en su capacidad general de conducción
    D: No es más peligroso que el alcohol por sí solo
  answer: B
  explanation: Consumir drogas junto con el alcohol aumenta el riesgo de causar un
    choque.
- id: 348
  category: defensive_driving
  question: ¿Cuál es la respuesta adecuada si experimenta el reventón de un neumático
    mientras conduce?
  choices:
    A: Frenar bruscamente para detener el auto de inmediato
    B: Permitir que el volante se mueva libremente
    C: Continuar conduciendo hasta llegar a un taller
    D: Dejar que el auto disminuya la velocidad hasta detenerse
  answer: D
  explanation: Si tiene un reventón de neumático, debe dejar que el auto disminuya
    la velocidad hasta detenerse en lugar de frenar bruscamente.
- id: 349
  category: sharing_the_road
  question: ¿Qué debe hacer cuando ve que se aproxima un vehículo de emergencia con
    luces intermitentes?
  choices:
    A: Reducir la velocidad y seguir avanzando en su carril
    B: Seguir conduciendo en su carril a la misma velocidad
    C: Acercarse a la acera y detenerse
    D: Detenerse exactamente donde está en medio de la carretera
  answer: C
  explanation: Cuando vea un vehículo de emergencia con luces intermitentes, debe
    acercarse a la acera y detenerse para dejarlo pasar de manera segura.
- id: 350
  category: sharing_the_road
  question: Después de que un vehículo de emergencia lo pase con la sirena encendida,
    ¿a qué distancia mínima debe evitar conducir detrás de él?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Después de que un vehículo de emergencia lo pase con la sirena encendida,
    debe evitar conducir a menos de 500 pies de distancia detrás del vehículo de emergencia.
- id: 351
  category: safe_driving_rules
  question: ¿Cuáles son las causas más comunes de choques en zonas de obras?
  choices:
    A: Reventones de neumáticos
    B: Hidroplaneo debido al agua rociada en la calzada
    C: Pérdida del control de la dirección tras conducir sobre pintura fresca
    D: Descuido y exceso de velocidad
  answer: D
  explanation: Los choques en zonas de obras son más comúnmente el resultado del descuido
    y el exceso de velocidad.
- id: 352
  category: safe_driving_rules
  question: Al conducir por una zona de obras, ¿cuál es una buena práctica de seguridad
    con respecto a su distancia de seguimiento?
  choices:
    A: Conducir cerca del vehículo que tiene delante para mantener la fluidez del
      tráfico
    B: Acortar su distancia de seguimiento habitual a la mitad aproximadamente
    C: Activar el control de crucero (cruise control)
    D: Aumentar al doble su distancia de seguimiento habitual
  answer: D
  explanation: Al conducir por una zona de obras, es una buena práctica de seguridad
    aumentar al doble su distancia de seguimiento habitual.
- id: 353
  category: safe_driving_rules
  question: ¿Dónde debe posicionar su vehículo para comenzar un giro a la izquierda
    en una calle de dos carriles y doble sentido?
  choices:
    A: Cerca de la línea exterior
    B: Cerca de la línea central
    C: En el centro del carril
    D: En cualquier lugar del carril
  answer: B
  explanation: En calles o carreteras de dos carriles y doble sentido, debe comenzar
    los giros a la izquierda cerca de la línea central.
- id: 354
  category: safe_driving_rules
  question: ¿Bajo qué condición puede adelantar a otro vehículo por la derecha en
    una carretera de dos carriles?
  choices:
    A: Al conducir en una rampa de entrada de un solo carril
    B: Cuando el conductor al que está adelantando viaja más lento que el límite de
      velocidad indicado
    C: Cuando el conductor al que está adelantando está realizando un giro a la izquierda
    D: Nunca se puede adelantar por la derecha en una carretera de dos carriles
  answer: C
  explanation: En una carretera de dos carriles, puede adelantar a otro vehículo por
    la derecha cuando el conductor al que está adelantando está realizando un giro
    a la izquierda.
- id: 355
  category: defensive_driving
  question: ¿Qué es lo más importante que debe recordar sobre el manejo de la velocidad
    al acercarse a una curva?
  choices:
    A: Reducir la velocidad antes de entrar en la curva
    B: Acelerar suavemente antes de entrar en la curva
    C: Conducir al límite de velocidad indicado durante toda la curva
    D: Reducir la velocidad solo en la parte más cerrada de la curva
  answer: A
  explanation: Lo más importante que debe recordar sobre el manejo de la velocidad
    y las curvas es reducir la velocidad antes de entrar en la curva.
- id: 356
  category: sharing_the_road
  question: ¿Qué deben hacer los conductores al entrar en una rotonda o glorieta?
  choices:
    A: Detenerse por completo antes de entrar
    B: Ceder el paso a los conductores que ya están en la rotonda o glorieta
    C: Tomar el derecho de paso si llegan primero
    D: Acelerar para incorporarse rápidamente
  answer: B
  explanation: Los conductores que entran en una rotonda o glorieta deben ceder el
    paso a los conductores que ya se encuentran dentro de ella.
- id: 357
  category: safe_driving_rules
  question: ¿A quién le otorga la ley el derecho de paso en las intersecciones?
  choices:
    A: A los conductores que giran a la izquierda
    B: A los conductores que siguen recto
    C: A los conductores que giran a la derecha
    D: A nadie
  answer: D
  explanation: La ley no otorga a nadie el derecho de paso en las intersecciones;
    solo establece quién debe cederlo.
- id: 358
  category: safe_driving_rules
  question: Al detenerse en una intersección con una señal de alto (stop), ¿hacia
    dónde debe mirar antes de continuar?
  choices:
    A: Mirar a la derecha primero, luego a la izquierda, luego a la derecha otra vez
    B: Mirar a la izquierda primero, luego a la derecha, luego a la izquierda otra
      vez
    C: Revisar solo el espejo retrovisor
    D: Mirar hacia adelante y continuar
  answer: B
  explanation: En una intersección con una señal de alto, debe detenerse y mirar primero
    a la izquierda, luego a la derecha y otra vez a la izquierda.
- id: 359
  category: safe_driving_rules
  question: ¿Cómo debe entrar generalmente a una autopista desde una rampa de entrada?
  choices:
    A: Entrar lentamente para evitar otros vehículos
    B: Detenerse primero, luego entrar lentamente al tráfico
    C: Acelerar hasta alcanzar la velocidad del tráfico
    D: Entrar por encima de la velocidad del tráfico para adelantarse
  answer: C
  explanation: Al entrar a una autopista desde una rampa de entrada, generalmente
    debe acelerar hasta alcanzar la velocidad del tráfico.
- id: 360
  category: safe_driving_rules
  question: ¿Qué debe hacer si desea salir de una autopista pero se pasa de su salida?
  choices:
    A: Hacer un giro en U a través de la mediana
    B: Detenerse en el arcén y retroceder su vehículo hasta la salida
    C: Ir a la siguiente salida y salir de la autopista allí
    D: Detenerse y esperar un hueco en el tráfico para dar marcha atrás
  answer: C
  explanation: Si desea salir de una autopista pero se pasa de su salida, debe dirigirse
    a la siguiente salida y salir de la autopista allí.
- id: 361
  category: safe_driving_rules
  question: ¿Qué establece la ley con respecto a ceder el paso en una intersección
    sin señales, semáforos ni policía?
  choices:
    A: Los conductores que van recto deben ceder el paso a los conductores que giran
      a la izquierda
    B: Los conductores que giran a la izquierda deben ceder el paso a los conductores
      que atraviesan la intersección en línea recta
    C: Los conductores a la derecha deben ceder el paso a los conductores a la izquierda
    D: No existen leyes que establezcan quién debe ceder el paso
  answer: B
  explanation: Cuando no hay señales, semáforos ni policía que le indiquen qué hacer
    en una intersección, la ley establece que los conductores que giran a la izquierda
    deben ceder el paso a los conductores que atraviesan la intersección en línea
    recta.
- id: 362
  category: driver_responsibility
  question: ¿Qué causa la condición del conductor conocida como 'hipnosis de carretera'
    (highway hypnosis)?
  choices:
    A: Paradas de descanso frecuentes
    B: Dormir demasiado la noche anterior a un viaje
    C: Viajes cortos en autopistas
    D: Mirar fijamente la carretera durante largos períodos de tiempo
  answer: D
  explanation: La 'hipnosis de carretera' es una condición del conductor que puede
    resultar de mirar fijamente la carretera durante largos períodos de tiempo.
- id: 363
  category: defensive_driving
  question: ¿Dónde es mejor mantener un espacio de seguridad (cojín de espacio) alrededor
    de su vehículo?
  choices:
    A: Solo en la parte trasera de su vehículo
    B: Solo en los lados izquierdo y derecho de su vehículo
    C: En todos los lados del vehículo
    D: Solo en la parte delantera del vehículo
  answer: C
  explanation: Lo mejor es mantener un espacio de seguridad en todos los lados del
    vehículo.
- id: 364
  category: defensive_driving
  question: ¿Qué se considera una distancia de seguimiento segura a velocidades de
    autopista en una carretera seca?
  choices:
    A: 2 segundos de distancia de seguimiento con respecto al vehículo de adelante
    B: 3 segundos de distancia de seguimiento con respecto al vehículo de adelante
    C: 4 segundos de distancia de seguimiento con respecto al vehículo de adelante
    D: 2 largos de vehículo de distancia de seguimiento con respecto al vehículo de
      adelante
  answer: C
  explanation: A velocidades de autopista, en una carretera seca, una distancia de
    seguimiento segura es de al menos 4 segundos con respecto al vehículo que va delante
    de usted.
- id: 365
  category: defensive_driving
  question: ¿Cuál es la mejor manera de evitar la necesidad de realizar paradas de
    emergencia o de 'pánico' en el tráfico?
  choices:
    A: Tocar la bocina para que los demás se den cuenta de su presencia
    B: Conducir únicamente por el carril derecho
    C: Conducir más lento que el flujo del tráfico
    D: Mirar hacia adelante y mantener una distancia de seguimiento segura
  answer: D
  explanation: Para evitar la necesidad de realizar paradas de emergencia mientras
    conduce en el tráfico, debe mirar hacia adelante y mantener una distancia de seguimiento
    segura.
- id: 366
  category: sharing_the_road
  question: Si se encuentra con un automóvil que viene en sentido contrario a su izquierda
    y un ciclista a su derecha, ¿qué debe hacer?
  choices:
    A: Salirse al arcén
    B: Dividir la diferencia
    C: Dejar pasar al automóvil y luego adelantar a la bicicleta
    D: Adelantar a la bicicleta rápidamente
  answer: C
  explanation: Cuando se enfrenta a un automóvil que viene en sentido contrario por
    la izquierda y a un ciclista por la derecha, debe dejar pasar al automóvil y luego
    adelantar a la bicicleta para garantizar la seguridad.
- id: 367
  category: defensive_driving
  question: ¿Qué debe hacer si un conductor que viene en sentido contrario se dirige
    hacia usted en su carril?
  choices:
    A: Girar a la derecha, tocar la bocina y acelerar
    B: Girar a la izquierda, tocar la bocina y frenar
    C: Girar a la derecha, tocar la bocina y frenar
    D: Permanecer en el centro de su carril, tocar la bocina y frenar
  answer: C
  explanation: Si un conductor que viene en sentido contrario se dirige hacia usted
    en su carril, debe girar a la derecha, tocar la bocina y frenar para evitar una
    colisión frontal.
- id: 368
  category: vehicle_information
  question: 'Si la parte trasera de su vehículo comienza a derrapar hacia la izquierda,
    usted debe:'
  choices:
    A: Girar hacia la izquierda
    B: Pisar los frenos
    C: Acelerar
    D: Girar hacia la derecha
  answer: A
  explanation: Si la parte trasera de su vehículo comienza a derrapar hacia la izquierda,
    debe girar hacia la izquierda para recuperar el control del vehículo.
- id: 369
  category: safe_driving_rules
  question: Durante una tormenta de lluvia, ¿cuándo se vuelven más resbaladizas las
    carreteras?
  choices:
    A: Cuando ha estado lloviendo durante una hora o más
    B: El día después de que llueve
    C: Durante los primeros 10 a 15 minutos de una tormenta de lluvia
    D: Justo después de que la lluvia ha parado
  answer: C
  explanation: Las carreteras se vuelven muy resbaladizas durante los primeros 10
    a 15 minutos de una tormenta de lluvia porque el agua se mezcla con el aceite
    y la suciedad en la superficie de la carretera.
- id: 370
  category: safe_driving_rules
  question: ¿Qué luces debe utilizar al conducir con niebla?
  choices:
    A: Luces delanteras de cruce (bajas)
    B: Luces delanteras de carretera (altas)
    C: Luces de estacionamiento
    D: Luces intermitentes de emergencia
  answer: A
  explanation: Al conducir con niebla, debe usar las luces delanteras de cruce (bajas)
    para mejorar la visibilidad sin causar deslumbramiento.
- id: 371
  category: penalties_and_points
  question: ¿A partir de qué umbral de puntos comienza PennDOT a tomar medidas correctivas
    contra el historial de un conductor?
  choices:
    A: 3 puntos o más
    B: 6 puntos o más
    C: 9 puntos o más
    D: 12 puntos o más
  answer: B
  explanation: PennDOT comienza a tomar medidas correctivas cuando un historial de
    conducción alcanza seis (6) puntos o más.
- id: 372
  category: penalties_and_points
  question: ¿Qué sucede la primera vez que un historial de conducción alcanza seis
    (6) puntos o más?
  choices:
    A: La licencia del conductor se suspende inmediatamente por 30 días
    B: El conductor debe asistir a una audiencia departamental
    C: El conductor recibirá una notificación por escrito para realizar un examen
      escrito especial de puntos
    D: El conductor debe pagar una multa de $500
  answer: C
  explanation: Cuando un historial de conducción alcanza seis (6) puntos o más por
    primera vez, el conductor recibirá una notificación por escrito para realizar
    un examen escrito especial de puntos.
- id: 373
  category: penalties_and_points
  question: Si un conductor menor de 18 años acumula seis o más puntos, ¿por cuánto
    tiempo se suspenderá su privilegio de conducir en la primera ocasión?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: El privilegio de conducir de una persona menor de 18 años será suspendido
    si acumula seis o más puntos. La primera suspensión será por un período de 90
    días.
- id: 374
  category: penalties_and_points
  question: ¿Cuántos puntos se eliminan de un historial de conducción por cada 12
    meses consecutivos que una persona conduce sin una infracción o suspensión?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: Todos los puntos
  answer: C
  explanation: Se eliminan tres (3) puntos de un historial de conducción por cada
    12 meses consecutivos en los que una persona no esté bajo suspensión o revocación
    y no haya cometido ninguna infracción.
- id: 375
  category: safe_driving_rules
  question: 'Cuando se encuentra en una fila de tráfico cruzando una vía de ferrocarril
    que no tiene señales ni barreras, usted debe:'
  choices:
    A: Asumir que tiene el derecho de paso y no necesita verificar si vienen trenes
    B: Rebasar a los conductores más lentos mientras cruza la vía
    C: Asegurarse de que haya espacio para cruzar completamente las vías sin detenerse
      antes de comenzar a cruzar
    D: Detenerse en las vías para verificar si vienen trenes
  answer: C
  explanation: Al cruzar una vía de ferrocarril sin señales ni barreras, debe asegurarse
    de que haya espacio para cruzar completamente las vías sin detenerse antes de
    comenzar a cruzar.
- id: 376
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resultará en la suspensión o revocación
    de su privilegio de conducir?
  choices:
    A: Conducir a 5 mph por encima del límite de velocidad
    B: Estacionarse en una zona de carga
    C: No cumplir con una barrera o puerta de cruce de ferrocarril
    D: Conducir con una luz trasera rota
  answer: C
  explanation: Su privilegio de conducir será suspendido o revocado si es declarado
    culpable de no cumplir con una barrera o puerta de cruce de ferrocarril, lo cual
    conlleva una suspensión de 30 días.
- id: 377
  category: penalties_and_points
  question: ¿Qué sanción resultará del incumplimiento de una barrera o puerta de cruce
    de ferrocarril?
  choices:
    A: Una suspensión de 15 días
    B: Una suspensión de 30 días
    C: Una suspensión de 60 días
    D: Una suspensión de 6 meses
  answer: B
  explanation: El manual establece que el incumplimiento de una barrera o puerta de
    cruce de ferrocarril resulta en una suspensión de 30 días.
- id: 378
  category: safe_driving_rules
  question: ¿Qué debe hacer inmediatamente si un oficial de policía lo detiene por
    la noche?
  choices:
    A: Salir del vehículo para saludar al oficial
    B: Encender la luz interior de su vehículo tan pronto como se detenga
    C: Buscar en su guantera el registro del vehículo
    D: Entregar al oficial su billetera completa
  answer: B
  explanation: Si la policía lo detiene por la noche, debe encender la luz interior
    de su vehículo tan pronto como se detenga y antes de que el oficial se acerque.
- id: 379
  category: driver_responsibility
  question: Cuando un oficial de policía lo detiene, ¿cuándo debe sacar su licencia
    de conducir, el registro y las tarjetas de seguro?
  choices:
    A: Tan pronto como vea las luces de la policía detrás de usted
    B: Mientras el oficial camina hacia su vehículo
    C: Esperar hasta que el oficial le pida que los saque
    D: Solo después de haber salido del vehículo
  answer: C
  explanation: Debe esperar hasta que el oficial le pida que saque su licencia de
    conducir, el registro y las tarjetas de seguro, y limitar sus movimientos antes
    de ese momento.
- id: 380
  category: penalties_and_points
  question: Después de que se restaure su privilegio de conducir tras una suspensión,
    ¿cuántos puntos aparecerán generalmente en su historial de conducción?
  choices:
    A: Cero puntos
    B: Tres puntos
    C: Cinco puntos
    D: Seis puntos
  answer: C
  explanation: Después de que se restaure su privilegio de conducir, su historial
    de conducción mostrará cinco (5) puntos, independientemente de la cantidad de
    puntos que aparecieran antes de la suspensión (con algunas excepciones).
- id: 381
  category: penalties_and_points
  question: ¿Cuál es la sanción si PennDOT determina que su vehículo no estuvo cubierto
    por un seguro durante un período de 31 días o más?
  choices:
    A: Su registro será suspendido por tres meses
    B: Su vehículo será confiscado por 30 días
    C: Recibirá una suspensión de la licencia de 60 días
    D: Se le pedirá que vuelva a tomar su examen de conducir
  answer: A
  explanation: Si PennDOT determina que su vehículo no estuvo cubierto por un seguro
    durante 31 días o más, su registro será suspendido por tres (3) meses.
- id: 382
  category: signs_and_signals
  question: Si un vehículo detrás de usted tiene solo luces azules intermitentes,
    ¿qué indica esto?
  choices:
    A: Es un vehículo policial encubierto
    B: Es un patrullero estatal
    C: No es un oficial de policía
    D: Es un vehículo de emergencias médicas
  answer: C
  explanation: 'El manual establece: ''Si el vehículo tiene solo luces azules intermitentes,
    entonces no es un oficial de policía''.'
- id: 383
  category: defensive_driving
  question: ¿Qué debe hacer si lo detienen con luces rojas intermitentes pero no está
    seguro de que la persona sea realmente un oficial de policía?
  choices:
    A: Acelerar para alejarse del vehículo
    B: Detenerse de inmediato y cerrar todas sus puertas con llave
    C: Conducir a la zona poblada y bien iluminada más cercana a velocidad reducida
      con las luces de emergencia encendidas
    D: Ignorar las luces hasta que vea una patrulla policial identificada
  answer: C
  explanation: Si no está seguro de que la persona que lo detiene sea un oficial de
    policía, puede conducir hasta la zona poblada y bien iluminada más cercana, encender
    sus luces de emergencia y conducir a una velocidad reducida para reconocer la
    solicitud de detenerse.
- id: 384
  category: driver_responsibility
  question: ¿Qué debe hacer si se ve involucrado en un choque con un vehículo estacionado
    y no puede encontrar al propietario?
  choices:
    A: Abandonar la escena y esperar a que la policía lo contacte
    B: Dejar una nota con su información de contacto y llamar a la policía
    C: Esperar en la escena hasta una hora antes de irse
    D: Reportar el choque a su compañía de seguros dentro de los 30 días
  answer: B
  explanation: Si el choque involucra a un vehículo estacionado y no puede encontrar
    al propietario, deje una nota en un lugar donde se pueda ver que contenga la fecha,
    la hora, su nombre y número de teléfono, y llame a la policía.
- id: 385
  category: driver_responsibility
  question: Si la policía no investiga un choque que resultó en lesiones, muerte o
    un vehículo remolcado, ¿cuántos días tiene para enviar un Formulario de Informe
    de Accidente del Conductor a PennDOT?
  choices:
    A: 3 días
    B: 5 días
    C: 10 días
    D: 15 días
  answer: B
  explanation: Si la policía no investiga un choque y alguien ha muerto o resultado
    herido, o un vehículo debe ser remolcado, debe enviar un Formulario de Informe
    de Accidente del Conductor (AA-600) dentro de los cinco (5) días.
- id: 386
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor condenado por huir o intentar eludir
    a la policía?
  choices:
    A: Una suspensión de 6 meses y una multa de $250
    B: Una suspensión de 1 año y una multa de $500
    C: Una suspensión de 3 meses y una multa de $1,000
    D: Una suspensión de 2 años y una multa de $5,000
  answer: B
  explanation: Si un conductor es condenado por huir o intentar eludir a la policía,
    la sanción es una suspensión de un año del privilegio de conducir, una multa de
    $500, más las costas judiciales y otros cargos.
- id: 387
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de Consentimiento Implícito de Pennsylvania para
    los conductores?
  choices:
    A: Usted acepta permitir que la policía registre su vehículo en cualquier momento
    B: Usted acepta someterse a una prueba química de alcohol o drogas por el solo
      hecho de tener licencia para conducir
    C: Usted acepta declararse culpable de cualquier citación de tráfico que reciba
    D: Usted acepta tener un seguro de responsabilidad civil para su vehículo
  answer: B
  explanation: La ley de Consentimiento Implícito establece que usted ha aceptado
    someterse a una prueba química de aliento o sangre por el solo hecho de tener
    licencia para conducir en Pennsylvania.
- id: 388
  category: penalties_and_points
  question: ¿Qué sucede si es arrestado por conducir bajo la influencia (DUI) y se
    niega a someterse a una prueba química de aliento o sangre?
  choices:
    A: Se le dará una advertencia y será liberado
    B: Su privilegio de conducir será suspendido automáticamente por un año
    C: Se le multará con $500 pero conservará su licencia
    D: Su vehículo será confiscado permanentemente
  answer: B
  explanation: Si se niega a someterse a una o más pruebas químicas de aliento o sangre,
    su privilegio de conducir será suspendido automáticamente por un (1) año, incluso
    si se le declara no culpable de DUI.
- id: 389
  category: penalties_and_points
  question: Si se le declara no culpable de conducir bajo la influencia (DUI) pero
    se negó a someterse a una prueba de aliento o sangre por primera vez, ¿qué pasará
    con su privilegio de conducir?
  choices:
    A: Será suspendido por 6 meses.
    B: Será suspendido por 1 año.
    C: No será suspendido.
    D: Será suspendido por 90 días.
  answer: B
  explanation: Incluso si se le declara no culpable de conducir bajo la influencia,
    su privilegio de conducir será suspendido por un (1) año por negarse por primera
    vez a someterse a una prueba de aliento o sangre.
- id: 390
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restauración por negarse a una prueba química por
    primera infracción?
  choices:
    A: $300
    B: $500
    C: $1,000
    D: $2,000
  answer: B
  explanation: Los conductores que se nieguen a someterse a una prueba química deberán
    pagar una tarifa de restauración por negarse a la prueba química. La primera infracción
    es de $500.
- id: 391
  category: alcohol_drugs_health
  question: Bajo la ley de Tolerancia Cero de Pensilvania, ¿cuál es el límite de contenido
    de alcohol en sangre (BAC) para menores (menores de 21 años) acusados de conducir
    bajo la influencia (DUI)?
  choices:
    A: '.00'
    B: '.02'
    C: '.04'
    D: '.08'
  answer: B
  explanation: La ley de Tolerancia Cero redujo el contenido de alcohol en sangre
    (BAC) de .08 a .02 para los menores (menores de 21 años) acusados de conducir
    bajo la influencia (DUI).
- id: 392
  category: penalties_and_points
  question: Si usted se ve involucrado en un choque que resulte en lesiones corporales
    o daños a la propiedad mientras conduce con un BAC de .08 a .099, ¿a qué sanciones
    está sujeto?
  choices:
    A: Sanciones por Deterioro General (General Impairment)
    B: Sanciones de Tasa Alta (High Rate)
    C: Sanciones de Tasa Más Alta (Highest Rate)
    D: Sin sanciones si es su primera infracción
  answer: B
  explanation: Si usted se ve involucrado en un choque que resulte en lesiones corporales,
    muerte o daños a la propiedad, está sujeto a las sanciones enumeradas en la Tabla
    2, "Tasa Alta" (High Rate), incluso si su BAC es inferior a los niveles enumerados
    en la Tabla 2.
- id: 393
  category: penalties_and_points
  question: ¿A qué nivel de sanciones están sujetos los conductores que se niegan
    a una prueba química o conducen bajo la influencia de sustancias controladas?
  choices:
    A: Deterioro General (General Impairment)
    B: Tasa Alta (High Rate)
    C: Tasa Más Alta (Highest Rate)
    D: Tolerancia Cero (Zero Tolerance)
  answer: C
  explanation: Cualquier persona que conduzca bajo la influencia de sustancias controladas
    y los conductores que se nieguen a una prueba química están sujetos a las sanciones
    enumeradas en la Tabla 3, "Tasa Más Alta" (Highest Rate).
- id: 394
  category: alcohol_drugs_health
  question: Si es aceptado en el programa de Disposición de Rehabilitación Acelerada
    (ARD) por un DUI, ¿en cuántas horas de la Escuela de Seguridad Vial sobre el Alcohol
    debe participar?
  choices:
    A: 10 horas
    B: 12 1/2 horas
    C: 15 horas
    D: 20 horas
  answer: B
  explanation: Si es aceptado en el programa ARD, usted deberá... participar en 12
    1/2 horas de la Escuela de Seguridad Vial sobre el Alcohol.
- id: 395
  category: penalties_and_points
  question: Si su delito de DUI se imputa como un delito menor no clasificado (ungraded
    misdemeanor), ¿qué significa esto si usted impugna el caso?
  choices:
    A: No tiene derecho a un juicio por jurado.
    B: Perderá automáticamente su licencia por 5 años.
    C: Debe pagar una multa obligatoria de $10,000.
    D: Será juzgado en un tribunal federal.
  answer: A
  explanation: El cargo de delito menor no clasificado significa que, si impugna el
    caso, no tiene derecho a un juicio por jurado.
- id: 396
  category: penalties_and_points
  question: ¿Cuál es la sanción de la licencia por una primera infracción de "Deterioro
    General" (BAC de .08 a .099) para un conductor con edad legal para beber?
  choices:
    A: Suspensión de 6 meses
    B: Suspensión de 12 meses
    C: Suspensión de 18 meses
    D: Ninguna acción
  answer: D
  explanation: Según la Tabla 1 - Deterioro General (General Impairment), la sanción
    de la licencia para una primera infracción es "Ninguna acción".
- id: 397
  category: alcohol_drugs_health
  question: Si es menor de 21 años y es detenido para realizar pruebas de sangre,
    aliento u orina, ¿cuál es la política con respecto al consentimiento de los padres?
  choices:
    A: Se requiere el consentimiento de los padres antes de que se pueda administrar
      cualquier prueba.
    B: No se requiere el consentimiento de los padres, pero la policía notificará
      a sus padres.
    C: Se le debe permitir llamar a un padre antes de decidir realizar la prueba.
    D: Los padres deben estar presentes durante el procedimiento de la prueba.
  answer: B
  explanation: Si es menor de edad y es arrestado y detenido para realizar pruebas
    de sangre, aliento y/u orina, no se requiere el consentimiento de los padres para
    realizar estas pruebas, pero la policía notificará a sus padres sobre el arresto.
- id: 398
  category: penalties_and_points
  question: ¿Cuál es la multa mínima para un adulto condenado por suministrar alcohol
    a menores a sabiendas e intencionalmente por primera vez?
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: Los adultos, incluso los padres, que sean condenados por suministrar
    alcohol a menores a sabiendas e intencionalmente están sujetos a una multa de
    al menos $1,000 por la primera infracción.
- id: 399
  category: license_system
  question: ¿Qué requiere el concepto de "una sola licencia de conducir" del Pacto
    de Licencias de Conducir (DLC)?
  choices:
    A: Los conductores deben llevar su licencia en todo momento.
    B: Los conductores deben entregar una licencia de otro estado al solicitar una
      licencia en otro estado.
    C: Los conductores pueden tener licencias de hasta dos estados miembros.
    D: Los conductores deben renovar su licencia cada año.
  answer: B
  explanation: El concepto de "una sola licencia de conducir" requiere la entrega
    de la licencia de conducir de otro estado cuando se realiza la solicitud de una
    licencia de conducir en otro estado.
- id: 400
  category: penalties_and_points
  question: ¿Cuál de los siguientes conductores está obligado a tener instalado un
    sistema de interbloqueo de encendido (Ignition Interlock) en su vehículo?
  choices:
    A: Un conductor con una primera infracción de Deterioro General (BAC .08 a .099).
    B: Un conductor que recibe una suspensión del privilegio de conducir por negarse
      a una prueba química.
    C: Cualquier conductor sorprendido a más de 20 mph sobre el límite de velocidad.
    D: Un conductor condenado por consumo de alcohol siendo menor de edad sin conducir.
  answer: B
  explanation: Los infractores de DUI por primera vez y reincidentes con niveles altos
    de alcohol en sangre, y las personas que reciban una suspensión del privilegio
    de conducir como resultado de una violación por negarse a una prueba química,
    deberán tener instalado un sistema de interbloqueo de encendido (Ignition Interlock).
- id: 401
  category: penalties_and_points
  question: ¿Si es menor de 21 años y es condenado por conducir bajo los efectos del
    alcohol o drogas (DUI) por primera vez, cuál es el rango de la multa que tendrá
    que pagar?
  choices:
    A: $100 a $300
    B: $300 a $1,000
    C: $500 a $5,000
    D: $1,000 a $10,000
  answer: C
  explanation: Si es menor de 21 años y es condenado por DUI por primera vez, irá
    a la cárcel... su licencia será suspendida por un año completo y pagará una multa
    de $500 a $5,000.
- id: 402
  category: penalties_and_points
  question: ¿Cómo se debe pagar la tarifa de restauración por negarse a una prueba
    química?
  choices:
    A: En efectivo o cheque personal
    B: Solo con tarjeta de crédito
    C: Mediante cheque certificado o giro postal (money order)
    D: A través de un portal de pagos en línea
  answer: C
  explanation: La tarifa de restauración por negarse a una prueba química debe pagarse
    mediante cheque certificado o giro postal (money order).
- id: 403
  category: alcohol_drugs_health
  question: 'Las sanciones de "Tasa Alta" (Tabla 2) se aplican a los conductores de
    vehículos comerciales con un contenido de alcohol en sangre (BAC) de al menos:'
  choices:
    A: '.02'
    B: '.04'
    C: '.08'
    D: '.10'
  answer: B
  explanation: La Tabla 2 - Tasa Alta señala que esta tabla también se aplica a los
    conductores de vehículos comerciales con un BAC de .04 o más.
- id: 404
  category: penalties_and_points
  question: ¿Qué sucederá si no responde a una citación de tráfico de otro estado?
  choices:
    A: Se le multará con $500.
    B: Su privilegio de conducir en Pennsylvania será suspendido indefinidamente.
    C: Recibirá puntos en su historial de conducción.
    D: Su vehículo será confiscado.
  answer: B
  explanation: Según el manual, no responder a una citación de otro estado resultará
    en la suspensión indefinida de su privilegio de conducir en Pennsylvania hasta
    que se dé una respuesta.
- id: 405
  category: license_system
  question: ¿Cuántos días tiene para notificar a PennDOT si cambia su nombre o dirección?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: De acuerdo con la Sección 1515 del Código de Vehículos de Pennsylvania,
    si cambia su nombre o dirección, debe notificar a PennDOT dentro de los 15 días
    posteriores a ese cambio, incluso si se muda fuera del estado.
- id: 406
  category: safe_driving_rules
  question: De acuerdo con la ley de Pennsylvania, ¿quién está obligado a usar el
    cinturón de seguridad en el asiento delantero de un vehículo, camión ligero o
    casa rodante?
  choices:
    A: Solo el conductor
    B: Solo los pasajeros menores de 18 años
    C: Todos los conductores y pasajeros del asiento delantero
    D: Solo los pasajeros en vehículos sin bolsas de aire
  answer: C
  explanation: El manual establece que todos los conductores y pasajeros del asiento
    delantero en vehículos, camiones ligeros y casas rodantes deben usar cinturones
    de seguridad.
- id: 407
  category: safe_driving_rules
  question: ¿Dónde deben usar el cinturón de seguridad los pasajeros que tienen 8
    años o más, pero menos de 18 años?
  choices:
    A: Solo en el asiento delantero
    B: Solo en el asiento trasero
    C: Sin importar en qué parte del vehículo viajen
    D: Solo si el vehículo no tiene bolsas de aire
  answer: C
  explanation: Si transporta pasajeros de ocho (8) años o más pero menores de 18 años,
    deben usar cinturones de seguridad, sin importar en qué parte del vehículo viajen.
- id: 408
  category: safe_driving_rules
  question: Si es un conductor menor de 18 años, ¿cuál es el número máximo de pasajeros
    que puede transportar?
  choices:
    A: Un pasajero por vehículo
    B: Hasta tres pasajeros
    C: El número de pasajeros no puede exceder el número de cinturones de seguridad
      en el vehículo
    D: Tantos pasajeros como quepan de forma segura en el asiento trasero
  answer: C
  explanation: Si es un conductor menor de 18 años, el número de pasajeros no puede
    exceder el número de cinturones de seguridad en el vehículo.
- id: 409
  category: defensive_driving
  question: Chocar contra el panel de instrumentos o el parabrisas en un accidente
    a 30 mph es comparable a ¿qué?
  choices:
    A: Caer al suelo desde lo alto de un edificio de tres pisos
    B: Caerse de una bicicleta a 15 mph
    C: Caer al suelo desde un edificio de un piso
    D: Ser tacleado por un jugador de fútbol americano profesional
  answer: A
  explanation: El manual explica que golpear las superficies interiores del vehículo
    a 30 mph es como caer al suelo desde lo alto de un edificio de tres pisos.
- id: 410
  category: defensive_driving
  question: ¿Qué tanto aumentan sus probabilidades de morir si sale despedido de su
    vehículo durante un choque?
  choices:
    A: 5 veces más
    B: 10 veces más
    C: 25 veces más
    D: 50 veces más
  answer: C
  explanation: Sus probabilidades de morir son casi 25 veces mayores si sale despedido
    de su vehículo.
- id: 411
  category: penalties_and_points
  question: ¿Cuál es la sanción para una persona menor de 16 años que utiliza una
    tarjeta de identificación falsa para comprar alcohol?
  choices:
    A: Una multa de $500 e incautación inmediata de su vehículo
    B: Una suspensión de la licencia de conducir que comienza en su cumpleaños número
      16
    C: No podrá realizar el examen de conducir hasta que cumpla 21 años
    D: Asistencia obligatoria a una clase de educación sobre seguridad con el alcohol
  answer: B
  explanation: Las personas menores de 16 años que utilicen una tarjeta de identificación
    falsa para comprar alcohol recibirán una suspensión de la licencia de conducir
    que comenzará en su cumpleaños número 16.
- id: 412
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción por una primera infracción si una persona menor de
    21 años consume alcohol, pero no está conduciendo un vehículo motorizado?
  choices:
    A: Una suspensión de la licencia de conducir de 90 días y una multa de hasta $500
    B: Una libertad condicional de 6 meses
    C: Sentencia a una institución correccional
    D: Puntos en el historial de conducción
  answer: A
  explanation: Si una persona menor de 21 años consume alcohol, pero no está conduciendo
    un vehículo motorizado, la sanción por una primera infracción es una suspensión
    de la licencia de conducir de 90 días y una multa de hasta $500.
- id: 413
  category: alcohol_drugs_health
  question: ¿Se requiere el consentimiento de los padres para que la policía realice
    pruebas de aliento, sangre y orina a un menor?
  choices:
    A: Sí, de ambos padres
    B: Sí, de al menos uno de los padres
    C: Sí, para personas menores de 16 años
    D: No, no es necesario
  answer: D
  explanation: No se requiere el consentimiento de los padres para realizar pruebas
    de aliento, sangre y orina.
- id: 414
  category: penalties_and_points
  question: Si usted es menor de 21 años y es condenado por conducir bajo la influencia
    del alcohol (DUI) por primera vez, ¿por cuánto tiempo se suspenderá su licencia?
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Si usted es menor de 21 años y es condenado por conducir bajo la influencia
    del alcohol, recibirá una suspensión de la licencia de 1 año por una primera infracción.
- id: 415
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones cometidas fuera del estado será tratada
    como si hubiera ocurrido en Pensilvania y resultará en las sanciones correspondientes?
  choices:
    A: Una infracción de estacionamiento menor
    B: Conducir a 5 mph por encima del límite de velocidad
    C: No detenerse y prestar ayuda en un accidente que resulte en muerte o lesiones
    D: Conducir con una calcomanía de inspección vencida
  answer: C
  explanation: No detenerse y prestar ayuda en caso de un accidente de vehículo que
    resulte en la muerte o lesiones personales de otra persona es una infracción que,
    si se comete en un estado miembro, se trata como si hubiera ocurrido en Pensilvania.
- id: 416
  category: safe_driving_rules
  question: Según la ley de Pensilvania, ¿cómo deben estar asegurados los niños menores
    de 2 años en un vehículo?
  choices:
    A: En un asiento de seguridad orientado hacia adelante en el asiento delantero
    B: En un asiento de seguridad orientado hacia atrás hasta que superen los límites
      del fabricante
    C: En un asiento elevado (booster seat) con cinturón de regazo y hombro
    D: Con un cinturón de seguridad estándar en el asiento trasero
  answer: B
  explanation: Los niños menores de 2 años deben estar asegurados en un asiento de
    seguridad orientado hacia atrás hasta que el niño supere los límites máximos de
    peso y altura del asiento de seguridad según lo designado por el fabricante.
- id: 417
  category: vehicle_information
  question: ¿Por qué nunca debe instalar un asiento de seguridad para niños orientado
    hacia atrás en el asiento delantero si hay una bolsa de aire (airbag) presente?
  choices:
    A: La bolsa de aire golpeará la parte trasera del asiento para niños con una fuerza
      tremenda, causando lesiones graves o la muerte.
    B: Bloquea la vista del conductor del espejo lateral derecho.
    C: El niño se distraerá con las luces del tablero.
    D: El cinturón de seguridad en el asiento delantero no es lo suficientemente largo
      para asegurar el asiento para niños.
  answer: A
  explanation: En un choque, la bolsa de aire golpeará la parte trasera del asiento
    para niños con una fuerza tremenda, que se transmitirá a la cabeza del bebé causando
    lesiones graves o la muerte.
- id: 418
  category: safe_driving_rules
  question: Si la temperatura exterior está en los bajos 80 grados Fahrenheit, ¿qué
    tan rápido puede la temperatura dentro de un vehículo alcanzar niveles mortales?
  choices:
    A: 10 minutos
    B: 30 minutos
    C: 45 minutos
    D: 1 hora
  answer: A
  explanation: Incluso con una ventana bajada dos pulgadas, si la temperatura exterior
    está en los bajos 80 grados Fahrenheit, la temperatura dentro de un vehículo puede
    alcanzar niveles mortales en solo 10 minutos.
- id: 419
  category: defensive_driving
  question: ¿Cuál de los siguientes es un consejo recomendado para evitar dejar trágicamente
    a un niño en un vehículo caliente?
  choices:
    A: Bajar las ventanas al menos dos pulgadas antes de salir del vehículo.
    B: Colocar su bolso, maletín o teléfono celular en el asiento trasero.
    C: Dejar el aire acondicionado encendido mientras hace mandados.
    D: Mantener un animal de peluche en el asiento delantero en todo momento.
  answer: B
  explanation: El manual recomienda colocar su bolso, maletín, teléfono celular o
    algo que necesite en el asiento trasero para asegurarse de ver a un niño que se
    haya quedado en el vehículo.
- id: 420
  category: safe_driving_rules
  question: ¿Cómo pueden los abrigos de invierno gruesos afectar la seguridad del
    asiento de seguridad de un niño?
  choices:
    A: Hacen que el niño tenga demasiado calor, provocando somnolencia.
    B: Evitan que el cinturón de seguridad se bloquee durante una parada repentina.
    C: Pueden comprimirse en un choque, creando una holgura significativa en el arnés.
    D: Interfieren con el sistema LATCH del vehículo.
  answer: C
  explanation: Los abrigos de invierno más gruesos pueden comprimirse lo suficiente
    en un choque como para crear una holgura significativa en el arnés, el cual debe
    estar ajustado al cuerpo del niño para brindar la mejor protección.
- id: 421
  category: safe_driving_rules
  question: 'De acuerdo con la Ley 229 de Protección de Niños Pasajeros, los niños
    menores de cuatro años deben estar:'
  choices:
    A: Sujetos a un sistema de retención infantil aprobado por el gobierno federal.
    B: Asegurados en un asiento elevador (booster seat) con cinturones de regazo y
      hombro.
    C: Colocados en el asiento delantero con la bolsa de aire desactivada.
    D: Asegurados usando solo el cinturón de regazo estándar del vehículo.
  answer: A
  explanation: Los niños menores de cuatro (4) años deben estar sujetos a un sistema
    de retención infantil (asiento de seguridad para niños) aprobado por el gobierno
    federal, sin importar en qué parte del vehículo viajen.
- id: 422
  category: safe_driving_rules
  question: ¿Qué tipo de retención se requiere para niños de cuatro años o más, pero
    menores de ocho años?
  choices:
    A: Un asiento para bebés orientado hacia atrás.
    B: Un asiento elevador (booster seat) aprobado por el gobierno federal utilizado
      con cinturones de regazo y hombro.
    C: Un cinturón de regazo estándar sin correa para el hombro.
    D: No se requiere ninguna retención especial si se sientan en el asiento trasero.
  answer: B
  explanation: Los niños de cuatro (4) años o más, pero menores de ocho (8) años,
    deben estar sujetos a un asiento elevador (booster seat) aprobado por el gobierno
    federal, el cual debe usarse junto con los cinturones de regazo y hombro.
- id: 423
  category: driver_responsibility
  question: ¿Quién es responsable de asegurar que los niños menores de 18 años estén
    debidamente abrochados en un vehículo?
  choices:
    A: Los propios niños
    B: El dueño del vehículo
    C: El conductor
    D: Los padres de los niños, independientemente de quién esté conduciendo
  answer: C
  explanation: Los conductores son responsables de asegurar a los niños en un sistema
    de retención infantil aprobado y de garantizar que los niños menores de 18 años
    estén abrochados.
- id: 424
  category: vehicle_information
  question: Para estar seguro en caso de que se despliegue la bolsa de aire, ¿a qué
    distancia del volante debe sentarse el conductor?
  choices:
    A: Al menos 5 pulgadas
    B: Al menos 10 pulgadas
    C: Al menos 15 pulgadas
    D: Al menos 20 pulgadas
  answer: B
  explanation: Para estar seguro, en caso de que se despliegue la bolsa de aire, debe
    estar al menos a 10 pulgadas de distancia del volante.
- id: 425
  category: safe_driving_rules
  question: ¿Cuál es la posición recomendada para sujetar el volante para evitar lesiones
    si se despliega la bolsa de aire?
  choices:
    A: Las 10 y las 2 en punto
    B: Las 9 y las 3 en punto o las 8 y las 4 en punto
    C: Las 12 y las 6 en punto
    D: Una mano a las 12 en punto
  answer: B
  explanation: Sujete el volante en las posiciones de las 9 y las 3 en punto o las
    8 y las 4 en punto. Esto evitará que sus muñecas y brazos se lesionen o se rompan,
    o que le golpeen la cara con fuerza si se despliega la bolsa de aire.
- id: 426
  category: safe_driving_rules
  question: ¿Se recomienda que todos los niños de qué edad viajen en el asiento trasero
    de un vehículo?
  choices:
    A: 8 años o menos
    B: 10 años o menos
    C: 12 años o menos
    D: 15 años o menos
  answer: C
  explanation: Se recomienda que todos los niños de 12 años o menos viajen en el asiento
    trasero porque la mayoría de las colisiones son frontales, y los niños tienden
    a inquietarse y pueden acercarse demasiado al compartimento de la bolsa de aire.
- id: 427
  category: driver_testing
  question: Si necesita un intérprete de lenguaje de señas para el examen de conocimientos
    o de conducción, ¿con cuánta anticipación debe comunicarse con PennDOT?
  choices:
    A: Al menos 24 horas antes
    B: Al menos 3 días antes
    C: Al menos 1 semana antes
    D: Al menos 2 semanas antes
  answer: D
  explanation: Realice su contacto inicial con PennDOT al menos dos (2) semanas antes
    de la fecha en que desee realizar el examen, y PennDOT hará todo lo posible para
    conseguir a una persona que use el lenguaje de señas de su preferencia.
- id: 428
  category: driver_testing
  question: ¿Qué método de examen alternativo se ofrece en todos los Centros de Licencias
    de Conducir para las personas que tienen dificultades para leer el examen de conocimientos?
  choices:
    A: Exámenes para llevar a casa
    B: Exámenes a libro abierto
    C: Exámenes por voz
    D: Exámenes grupales
  answer: C
  explanation: A petición, se ofrecen exámenes por voz en todos los Centros de Licencias
    de Conducir de todo el estado para las personas que puedan tener dificultades
    para leer.
- id: 429
  category: penalties_and_points
  question: ¿Cuál es la sanción por estacionarse ilegalmente en un área de estacionamiento
    designada para personas con discapacidades?
  choices:
    A: Una advertencia por la primera infracción.
    B: Una multa de entre $50 y $200 y el vehículo puede ser remolcado.
    C: Una multa de $300 y una suspensión de la licencia por 30 días.
    D: 3 puntos añadidos a su historial de conducción.
  answer: B
  explanation: Cualquier vehículo estacionado ilegalmente en un área de estacionamiento
    para personas con discapacidades puede ser retirado de esa área mediante remolque...
    Las personas condenadas por esta infracción serán multadas con entre $50 y $200.
- id: 430
  category: penalties_and_points
  question: Según la ley contra arrojar basura de Pensilvania, ¿cuál es la multa máxima
    al ser condenado por arrojar desechos desde un vehículo?
  choices:
    A: $50
    B: $100
    C: $200
    D: $300
  answer: D
  explanation: Una violación de esta ley, incluyendo cualquier violación resultante
    de la conducta de cualquier otra persona presente dentro de cualquier vehículo
    del cual usted sea el conductor, puede resultar en una multa de hasta $300 al
    ser condenado.
- id: 431
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una condena por arrojar basura, incluyendo
    las infracciones resultantes de la conducta de los pasajeros en su vehículo?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: Una infracción de la ley contra el arrojo de basura, incluyendo la
    conducta de cualquier otra persona presente dentro del vehículo, puede resultar
    en una multa de hasta $300 tras la condena.
- id: 432
  category: vehicle_information
  question: ¿Con qué frecuencia debe su vehículo someterse a una inspección de seguridad
    en una estación de inspección autorizada?
  choices:
    A: Cada 6 meses
    B: Cada 12 meses
    C: Cada 2 años
    D: Cada 3 años
  answer: B
  explanation: Su vehículo debe someterse a una inspección de seguridad en una estación
    de inspección autorizada cada 12 meses.
- id: 433
  category: vehicle_information
  question: Si un oficial de policía nota equipo defectuoso en su vehículo, ¿cuántos
    días tiene para repararlo y evitar una citación?
  choices:
    A: 3 días
    B: 5 días
    C: 10 días
    D: 15 días
  answer: B
  explanation: Si un oficial de policía nota equipo defectuoso en su vehículo, es
    posible que se le requiera repararlo en un plazo de cinco (5) días para evitar
    una citación.
- id: 434
  category: sharing_the_road
  question: Al rebasar a un ciclista, ¿cuál es la distancia mínima que debe dejar
    entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: Al rebasar, debe dejar al menos cuatro (4) pies entre su vehículo y
    una bicicleta para poder pasar de manera segura.
- id: 435
  category: sharing_the_road
  question: ¿Se le permite cruzar una línea doble amarilla central para rebasar a
    un ciclista?
  choices:
    A: No, siempre es ilegal cruzar una línea doble amarilla.
    B: Sí, pero solo si el ciclista le indica que pase.
    C: Sí, si es necesario y puede hacerlo de manera segura para mantener cuatro pies
      de distancia.
    D: No, a menos que esté conduciendo un vehículo de emergencia.
  answer: C
  explanation: Si es necesario y si puede hacerlo de manera segura, se le permite
    cruzar la línea doble amarilla central para poder mantener los cuatro (4) pies
    de distancia entre su vehículo y la bicicleta.
- id: 436
  category: sharing_the_road
  question: ¿Puede un ciclista ser citado por circular a una velocidad inferior al
    límite de velocidad mínimo establecido?
  choices:
    A: Sí, deben mantener el límite de velocidad mínimo.
    B: Sí, si están obstruyendo el tráfico.
    C: No, pueden circular a una velocidad inferior al mínimo establecido y no pueden
      ser citados por obstruir el tráfico.
    D: No, pero deben circular por el arcén si viajan por debajo del límite de velocidad.
  answer: C
  explanation: Los ciclistas son considerados operadores de vehículos y se espera
    que obedezcan todas las leyes de tránsito; sin embargo, pueden circular a una
    velocidad inferior al mínimo establecido y no pueden ser citados por obstruir
    el tráfico.
- id: 437
  category: penalties_and_points
  question: ¿Cuál es la multa por una condena bajo la Ley Anti-Mensajes de Texto de
    Pensilvania?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: A
  explanation: Violar la ley Anti-Mensajes de Texto es una infracción primaria y sumaria,
    y las condenas conllevan una multa de $50.
- id: 438
  category: safe_driving_rules
  question: Bajo la Ley Anti-Mensajes de Texto, ¿cuál de las siguientes acciones está
    autorizado a realizar un oficial de policía?
  choices:
    A: Incautar el dispositivo móvil del conductor como evidencia.
    B: Emitir una citación por usar un dispositivo GPS físicamente integrado.
    C: Emitir una citación por enviar mensajes de texto, pero no pueden incautar el
      dispositivo inalámbrico interactivo.
    D: Hacer cumplir las ordenanzas locales que restringen el uso de dispositivos
      de manera más estricta que la ley estatal.
  answer: C
  explanation: La ley no autoriza la incautación de un Dispositivo de Comunicación
    Inalámbrica Interactivo (IWCD). También exime a los dispositivos GPS y prevalece
    sobre las ordenanzas locales.
- id: 439
  category: penalties_and_points
  question: ¿Cuál es la sanción por conducir rodeando las señales que cierran una
    carretera debido a condiciones peligrosas si se llama a los servicios de emergencia
    debido a sus acciones?
  choices:
    A: Una multa de $250 y 2 puntos en su registro.
    B: Una multa de hasta $500 y responsabilidad por los costos de respuesta de emergencia.
    C: Una multa de $50 y una suspensión de la licencia por 30 días.
    D: Una multa de $300 y 4 puntos en su registro.
  answer: B
  explanation: Si se llama a los servicios de emergencia debido a sus acciones, la
    multa se incrementa hasta $500 y usted será responsable de reembolsar los costos
    de la respuesta de emergencia.
- id: 440
  category: sharing_the_road
  question: ¿Para qué está diseñado el método "Dutch Reach" (alcance holandés)?
  choices:
    A: Envenenamiento por monóxido de carbono en garajes cerrados.
    B: Golpear a un ciclista que se aproxima con la puerta de un vehículo al abrirla.
    C: Derrapar en carreteras inundadas.
    D: Enviar mensajes de texto mientras se conduce.
  answer: B
  explanation: El método "Dutch Reach" consiste en abrir la puerta con la mano más
    alejada. Esto obliga a su cuerpo a girar, lo que le permitirá ver mejor a los
    ciclistas que se aproximan y evita que la puerta se abra demasiado rápido.
- id: 441
  category: sharing_the_road
  question: ¿A qué distancia deben circular los ciclistas de los autos estacionados
    para evitar ser golpeados por la apertura de las puertas de los vehículos?
  choices:
    A: Al menos un pie
    B: Al menos dos pies
    C: Al menos tres pies
    D: Al menos cuatro pies
  answer: C
  explanation: Los ciclistas deben circular al menos a tres pies de los autos estacionados
    para evitar las puertas, tanto en calles con carriles para bicicletas como en
    las que no los tienen.
- id: 442
  category: driver_testing
  question: Si es menor de 18 años, ¿cuánto tiempo debe esperar después de recibir
    su permiso de aprendizaje antes de poder realizar su examen de conducir (Road
    Test)?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Si es menor de 18 años, no puede realizar su examen de conducir durante
    los seis (6) meses posteriores a la obtención de su permiso de aprendizaje.
- id: 443
  category: safe_driving_rules
  question: ¿Cuál es la forma recomendada de utilizar el servicio de información 511PA
    mientras viaja?
  choices:
    A: Llamar al 511 mientras conduce por la interestatal.
    B: Enviar un mensaje de texto al 511 mientras está detenido en un semáforo en
      rojo.
    C: Salirse de la carretera de forma segura para llamar al sistema o consultar
      antes de salir.
    D: Usar un dispositivo de manos libres para navegar por el sitio web de 511PA
      mientras conduce.
  answer: C
  explanation: PennDOT recomienda a los automovilistas no llamar al 511PA mientras
    conducen. Los conductores deben salirse de la carretera de forma segura para llamar
    al sistema o consultar los retrasos en los viajes antes de salir.
- id: 444
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma de exposición al monóxido de carbono?
  choices:
    A: Hambre extrema
    B: Náuseas y/o vómitos
    C: Mejora de la visión nocturna
    D: Disminución del ritmo cardíaco
  answer: B
  explanation: Los síntomas de la exposición al monóxido de carbono incluyen fatiga,
    mareos, dolor de cabeza, náuseas y/o vómitos, ritmo cardíaco acelerado, respiración
    irregular, confusión, tos y dolor en el pecho.
- id: 445
  category: alcohol_drugs_health
  question: ¿Qué debe hacer para prevenir la intoxicación por monóxido de carbono
    en días de nieve?
  choices:
    A: Calentar su vehículo en el garaje con la puerta cerrada.
    B: Inspeccionar el tubo de escape y eliminar cualquier rastro de nieve o hielo
      que lo obstruya.
    C: Mantener todas las ventanas completamente cerradas mientras el motor está en
      ralentí en el tráfico.
    D: Encender el sistema de aire acondicionado de su vehículo en el ajuste máximo.
  answer: B
  explanation: En días de nieve, inspeccione siempre el tubo de escape y elimine cualquier
    rastro de nieve o hielo que pueda estar obstruyéndolo para prevenir la intoxicación
    por monóxido de carbono.
- id: 446
  category: safe_driving_rules
  question: ¿Qué debe hacer para ayudar a prevenir la intoxicación por monóxido de
    carbono si está atrapado en el tráfico en un vehículo con el motor en ralentí?
  choices:
    A: Encender la calefacción del vehículo en el ajuste más alto
    B: Abrir parcialmente una ventana
    C: Mantener todas las ventanas completamente cerradas
    D: Encender la luz interior del techo
  answer: B
  explanation: El manual establece que si está atrapado en el tráfico o sentado en
    un vehículo con el motor en ralentí, debe asegurarse de abrir parcialmente una
    ventana para prevenir la intoxicación por monóxido de carbono.
- id: 447
  category: vehicle_information
  question: ¿Cuándo recomienda el manual revisar o reemplazar las baterías del detector
    de monóxido de carbono de su vehículo?
  choices:
    A: Cada vez que realice un cambio de aceite
    B: Una vez al mes durante el invierno
    C: Al cambiar la hora en los relojes en primavera y otoño
    D: Cada 5,000 millas
  answer: C
  explanation: El manual recomienda considerar la instalación de un detector de monóxido
    de carbono que funcione con baterías y revisar o reemplazar las baterías al cambiar
    la hora en los relojes en primavera y otoño de cada año.
- id: 448
  category: alcohol_drugs_health
  question: ¿Qué es lo primero que debe hacer si sospecha de una intoxicación por
    monóxido de carbono en su vehículo?
  choices:
    A: Conducir al hospital más cercano de inmediato
    B: Apagar el motor y esperar dentro del vehículo
    C: Bajar las ventanas y continuar conduciendo
    D: Salir del vehículo inmediatamente y tomar aire fresco
  answer: D
  explanation: Si sospecha de una intoxicación por monóxido de carbono en su vehículo,
    el manual le indica que salga del vehículo inmediatamente, tome aire fresco y
    busque atención médica de emergencia de inmediato.
- id: 449
  category: vehicle_information
  question: 'Para evitar que entren gases de escape peligrosos en su vehículo, debe
    asegurarse de que no haya obstrucciones en su:'
  choices:
    A: Rejillas de aire acondicionado
    B: Tubo de escape
    C: Rejilla del radiador
    D: Guantera
  answer: B
  explanation: El manual advierte a los conductores que estén atentos a cualquier
    cosa que pueda estar obstruyendo el tubo de escape del vehículo, lo que puede
    provocar una intoxicación por monóxido de carbono.
- id: 450
  category: alcohol_drugs_health
  question: 'Según el manual, la ley de Consentimiento Implícito (Implied Consent)
    se refiere a:'
  choices:
    A: Pruebas químicas de alcohol o drogas
    B: Aceptar las inspecciones de seguridad del vehículo
    C: Permitir que la policía registre su vehículo
    D: Donación de órganos al recibir una licencia
  answer: A
  explanation: El índice del manual enumera explícitamente la ley de Consentimiento
    Implícito como relativa a las "Pruebas químicas de alcohol o drogas".
- id: 451
  category: safe_driving_rules
  question: El manual del conductor de Pensilvania incluye una ley específica que
    vincula el uso obligatorio de los faros delanteros con ¿qué otra característica
    del vehículo?
  choices:
    A: Señales de giro
    B: Limpiaparabrisas
    C: Luces de emergencia
    D: Desempañadores
  answer: B
  explanation: El índice del manual enumera una "Ley de Faros/Limpiaparabrisas" específica
    en la sección de Leyes.
- id: 452
  category: driver_responsibility
  question: ¿Cuál de los siguientes se enumera en el manual como un 'Factor del Conductor'
    que puede afectar negativamente su conducción?
  choices:
    A: Falta de sueño
    B: Alta presión de los neumáticos
    C: Consumo excesivo de combustible
    D: Sobrecalentamiento del motor
  answer: A
  explanation: En la sección "Factores del Conductor" del índice, se enumera la "Falta
    de sueño" junto con otros factores como el alcohol, las drogas y la falta de atención.
- id: 453
  category: defensive_driving
  question: ¿Cuál de los siguientes está categorizado como una 'Emergencia de Conducción'
    en el manual del conductor?
  choices:
    A: Una luz trasera fundida
    B: Un acelerador que se queda trabado
    C: Un depósito de líquido limpiaparabrisas vacío
    D: Una radio que no funciona bien
  answer: B
  explanation: El índice enumera "Acelerador trabado" bajo la sección titulada "Emergencias
    de conducción, cómo manejarlas".
- id: 454
  category: safe_driving_rules
  question: El manual del conductor de Pensilvania describe leyes específicas con
    respecto a los pasajeros que viajan en ¿qué parte de un vehículo?
  choices:
    A: El asiento del pasajero delantero
    B: Un asiento de la tercera fila
    C: Una camioneta de caja abierta
    D: Un vehículo con techo corredizo
  answer: C
  explanation: El índice incluye una entrada específica en la sección de Leyes para
    "Pasajeros en una camioneta de caja abierta".
- id: 455
  category: driver_testing
  question: 'Para las pruebas y servicios del conductor, el manual indica que hay
    intérpretes disponibles para personas que son:'
  choices:
    A: Discapacitadas visuales
    B: Sordas o con problemas de audición
    C: Discapacitadas físicamente
    D: No hablantes de inglés
  answer: B
  explanation: El índice del manual incluye una entrada para "Intérpretes para personas
    sordas o con problemas de audición".
- id: 456
  category: penalties_and_points
  question: 'La ley de ''Tolerancia Cero'' que figura en el manual del conductor de
    Pensilvania se aplica a:'
  choices:
    A: Exceso de velocidad en una zona escolar
    B: Enviar mensajes de texto mientras se conduce
    C: DUI (Conducir bajo la influencia) para menores de 21 años
    D: Conducir sin seguro
  answer: C
  explanation: El índice enumera explícitamente la "Tolerancia Cero" como aplicable
    a "(DUI para menores de 21 años)".
- id: 457
  category: safe_driving_rules
  question: El manual proporciona leyes y pautas específicas con respecto a la eliminación
    de ¿qué elemento de su vehículo?
  choices:
    A: Calcomanías en el parachoques
    B: Nieve y hielo
    C: Tinte de ventanas no original
    D: Portaequipajes de techo
  answer: B
  explanation: El índice enumera una ley específica sobre la "Eliminación de nieve/hielo"
    en la sección de Leyes.
- id: 458
  category: defensive_driving
  question: ¿A qué regla se hace referencia en el manual para ayudar a los conductores
    a mantener una distancia de seguimiento segura?
  choices:
    A: La "Regla de los dos segundos"
    B: La "Regla de los tres segundos"
    C: La "Regla de los cuatro segundos"
    D: La "Regla de los diez segundos"
  answer: C
  explanation: El índice enumera específicamente la "Regla de los cuatro segundos"
    como un tema cubierto en el manual.
- id: 459
  category: license_system
  question: 'Según la sección de leyes del manual, los conductores deben notificar
    un cambio en:'
  choices:
    A: El color del vehículo
    B: El estado laboral
    C: El nombre o la dirección
    D: El proveedor de seguros
  answer: C
  explanation: El índice enumera una ley para la "Notificación obligatoria por cambio
    de nombre o dirección".
- id: 460
  category: alcohol_drugs_health
  question: ¿Cómo se llama la política de DUI de Pensilvania para conductores menores
    de 21 años?
  choices:
    A: Límite absoluto
    B: Tolerancia cero
    C: Restricción de DUI para menores
    D: Sanción por minoría de edad
  answer: B
  explanation: El manual incluye una sección específica sobre "Tolerancia Cero (DUI
    para menores de 21 años)" para el consumo de alcohol y la conducción por parte
    de menores de edad.
- id: 461
  category: safe_driving_rules
  question: ¿Qué regla recomienda el manual para mantener un margen de espacio adecuado
    delante de su vehículo?
  choices:
    A: La regla de los dos segundos
    B: La regla de los tres segundos
    C: La regla de los cuatro segundos
    D: La regla de la longitud de un vehículo
  answer: C
  explanation: El manual se refiere a la "regla de los cuatro segundos" para gestionar
    el margen de espacio delante de su vehículo.
- id: 462
  category: sharing_the_road
  question: ¿Qué característica específica de la carretera se aborda en el manual
    para camiones que experimentan emergencias?
  choices:
    A: Rampas de escape
    B: Estaciones de pesaje
    C: Áreas de descanso para camiones
    D: Carriles de emergencia
  answer: A
  explanation: El manual incluye una sección que detalla específicamente las "rampas
    de escape" para camiones.
- id: 463
  category: penalties_and_points
  question: Bajo el sistema de puntos de Pensilvania, ¿qué es posible si mantiene
    un historial de conducción segura?
  choices:
    A: Eliminación de puntos
    B: Mejora de la licencia
    C: Descuentos en el seguro
    D: Exención de la cuota de registro
  answer: A
  explanation: El manual describe un proceso para la "eliminación de puntos por conducción
    segura" bajo el sistema de puntos de Pensilvania.
- id: 464
  category: safe_driving_rules
  question: ¿Cuál de las siguientes maniobras de giro en un semáforo está explícitamente
    cubierta en el manual?
  choices:
    A: Girar a la izquierda en rojo
    B: Girar a la derecha en una luz roja
    C: Giros en U en rojo
    D: Retroceder en una luz roja
  answer: B
  explanation: El manual contiene una sección específica que detalla las reglas para
    "girar a la derecha en una luz roja".
- id: 465
  category: driver_testing
  question: Si un examen de conocimientos estándar no es adecuado para un solicitante,
    ¿qué establece el manual que está disponible?
  choices:
    A: Una exención del examen
    B: Un método de examen alternativo
    C: Una licencia provisional
    D: Un examen a libro abierto
  answer: B
  explanation: El manual proporciona información sobre un "método de examen alternativo"
    para la prueba de conocimientos.
- id: 466
  category: signs_and_signals
  question: ¿Qué tipo de dispositivo de advertencia se enumera en el manual para ayudar
    a canalizar el tráfico, a menudo utilizado en zonas de obras?
  choices:
    A: Paneles de flechas electrónicas
    B: Señales de pare de neón
    C: Proyecciones holográficas
    D: Detectores de velocidad láser
  answer: A
  explanation: El manual enumera los "paneles de flechas electrónicas" en la sección
    de señales de advertencia y dispositivos de canalización.
- id: 467
  category: license_system
  question: ¿Qué designación especial pueden añadir el personal militar y los veteranos
    a su licencia de conducir?
  choices:
    A: Insignia de servicio activo
    B: Designación de veterano
    C: Exención militar
    D: Sello de las fuerzas armadas
  answer: B
  explanation: El manual incluye una sección sobre cómo solicitar una "designación
    de veterano" en la licencia de conducir.
- id: 468
  category: signs_and_signals
  question: ¿Qué tipo de señal de tráfico se utiliza para controlar el flujo de vehículos
    que entran en una autopista?
  choices:
    A: Regulación de rampas (Ramp Metering)
    B: Flechas amarillas intermitentes
    C: Señales peatonales
    D: Control de uso de carril
  answer: A
  explanation: El manual cubre la "regulación de rampas" (Ramp Metering) en la sección
    de señales de tráfico para gestionar la entrada a la autopista.
- id: 469
  category: safe_driving_rules
  question: Pensilvania tiene una ley específica que exige la obediencia a los dispositivos
    de control de tráfico que advierten sobre ¿qué?
  choices:
    A: Radares de velocidad
    B: Condiciones peligrosas
    C: Atracciones turísticas
    D: Estaciones de pesaje
  answer: B
  explanation: El manual detalla la "Ley de obediencia a los dispositivos de control
    de tráfico que advierten sobre condiciones peligrosas".
- id: 470
  category: safe_driving_rules
  question: ¿Cuál de los siguientes eventos meteorológicos invernales repentinos se
    aborda específicamente en la sección de condiciones de visibilidad del manual?
  choices:
    A: Tormenta de granizo
    B: Chubasco de nieve (Snow squall)
    C: Lluvia helada
    D: Hielo negro
  answer: B
  explanation: El manual aborda específicamente la conducción en un "chubasco de nieve"
    (Snow squall) en la sección de condiciones de visibilidad.
- id: 471
  category: signs_and_signals
  question: ¿El manual proporciona instrucciones específicas para circular en intersecciones
    con qué tipo de semáforos?
  choices:
    A: Semáforos que no funcionan
    B: Luces excesivamente brillantes
    C: Luces con sensor de movimiento
    D: Luces activadas por sonido
  answer: A
  explanation: El manual incluye una sección sobre cómo manejar en intersecciones
    con "Semáforos que no funcionan".
- id: 472
  category: signs_and_signals
  question: En la sección de Señales de Guía, ¿qué tipo de señales están diseñadas
    para ayudar a los conductores a encontrar atracciones locales?
  choices:
    A: Marcadores de ruta
    B: Direccionales orientadas al turismo
    C: Marcadores de milla
    D: Señales de rutas interestatales
  answer: B
  explanation: El manual enumera las señales "Direccionales orientadas al turismo"
    como un tipo específico de señal de guía.
- id: 473
  category: license_system
  question: Al obtener una licencia, ¿a cuál de los siguientes fondos pueden los conductores
    informarse o contribuir?
  choices:
    A: Fondo de Mantenimiento de Carreteras
    B: Fondo Fiduciario de Concientización sobre la Donación de Órganos
    C: Fondo de Becas para Conductores Seguros
    D: Fondo de Pensiones de la Policía Estatal
  answer: B
  explanation: El manual incluye información sobre el "Fondo Fiduciario de Concientización
    sobre la Donación de Órganos" y la Designación de Donante de Órganos.
- id: 474
  category: license_system
  question: ¿Qué dato personal específico se requiere explícitamente y se analiza
    en el manual para la obtención de la licencia?
  choices:
    A: Número de pasaporte
    B: Número de Seguro Social
    C: Número de registro de votante
    D: Número de identificación fiscal
  answer: B
  explanation: El manual contiene una sección dedicada a la "Información del Número
    de Seguro Social" para los solicitantes.
- id: 475
  category: driver_responsibility
  question: ¿Cuántas vidas puede salvar un solo donante de órganos y tejidos?
  choices:
    A: Hasta 3 vidas
    B: Hasta 5 vidas
    C: Hasta 8 vidas
    D: Hasta 12 vidas
  answer: C
  explanation: Según el manual, un donante de órganos y tejidos puede salvar hasta
    8 vidas y ayudar a más de 75 personas.
- id: 476
  category: driver_responsibility
  question: Además de salvar vidas, ¿a cuántas personas puede ayudar un solo donante
    de órganos y tejidos?
  choices:
    A: A más de 25 personas
    B: A más de 50 personas
    C: A más de 75 personas
    D: A más de 100 personas
  answer: C
  explanation: El manual establece que un donante de órganos y tejidos puede ayudar
    a más de 75 personas.
- id: 477
  category: driver_responsibility
  question: ¿Quién es elegible para inscribirse como donante de órganos y tejidos?
  choices:
    A: Solo personas entre 18 y 65 años
    B: Cualquier persona, independientemente de su edad o historial médico
    C: Solo personas sin antecedentes médicos previos
    D: Solo adultos mayores de 21 años
  answer: B
  explanation: El manual establece explícitamente que cualquier persona, independientemente
    de su edad o historial médico, puede inscribirse para ser donante.
- id: 478
  category: driver_responsibility
  question: ¿Cuál es el costo para los donantes o sus familias por la donación de
    órganos o tejidos?
  choices:
    A: Una tarifa fija de $500
    B: Depende del procedimiento médico requerido
    C: No hay costo para los donantes ni para sus familias
    D: La familia paga solo por la donación de tejidos
  answer: C
  explanation: No hay costo para los donantes ni para sus familias por la donación
    de órganos o tejidos.
- id: 479
  category: driver_responsibility
  question: ¿Cómo ven generalmente las principales religiones de los Estados Unidos
    la donación de órganos y tejidos?
  choices:
    A: Lo prohíben estrictamente
    B: Lo apoyan y lo consideran un acto final de amor y generosidad
    C: Solo apoyan la donación de tejidos, no la de órganos
    D: Requieren una exención religiosa especial para participar
  answer: B
  explanation: Todas las religiones principales en los Estados Unidos apoyan la donación
    de órganos y tejidos y la consideran un acto final de amor y generosidad hacia
    los demás.
- id: 480
  category: penalties_and_points
  question: ¿Cuál es el tiempo máximo de cárcel que enfrenta un adulto por dar o vender
    alcohol a una persona menor de 21 años?
  choices:
    A: Hasta 30 días
    B: Hasta 6 meses
    C: Hasta 1 año
    D: Hasta 5 años
  answer: C
  explanation: La ley establece que cualquier adulto que dé o venda alcohol a una
    persona menor de 21 años se enfrenta a hasta un año de cárcel.
- id: 481
  category: penalties_and_points
  question: ¿Cuál es la multa mínima para un adulto que sirve alcohol a un menor por
    el primer menor atendido?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $2,500
  answer: B
  explanation: Un adulto se enfrenta a una multa mínima de $1,000 por el primer menor
    al que se le sirva alcohol.
- id: 482
  category: penalties_and_points
  question: Si un adulto proporciona alcohol a varios menores, ¿cuál es la multa mínima
    por cada menor adicional después del primero?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: D
  explanation: La ley impone una multa mínima de $2,500 por cada menor adicional después
    del primero al que se le sirva alcohol.
- id: 483
  category: alcohol_drugs_health
  question: ¿Es legal que un padre le dé a su propio hijo o hija una bebida alcohólica
    si es menor de 21 años?
  choices:
    A: Sí, si es en su propia casa
    B: Sí, si es una ocasión especial
    C: No, dar una bebida a su propio hijo o hija es ilegal
    D: Sí, siempre y cuando no conduzcan después
  answer: C
  explanation: El manual establece claramente que dar una bebida alcohólica a su propio
    hijo o hija también es ilegal.
- id: 484
  category: license_system
  question: ¿Qué deben hacer las personas si deciden convertirse en donantes de órganos
    y tejidos?
  choices:
    A: Mantenerlo en secreto hasta una emergencia médica
    B: Colocar la designación de donante en su licencia, firmar una tarjeta de donante
      y compartir su deseo con la familia
    C: Notificar únicamente a su médico de cabecera
    D: Pagar una cuota de inscripción al Departamento de Salud
  answer: B
  explanation: Las personas deben colocar la designación de donante en la licencia,
    firmar una tarjeta de donante y compartir el deseo de donar con familiares y amigos.
- id: 485
  category: driver_responsibility
  question: Según el manual, ¿cómo puede el tejido donado ayudar específicamente a
    las víctimas de quemaduras?
  choices:
    A: Proporcionando medicamentos para el alivio del dolor
    B: Ayudándoles a sanar más rápidamente con piel donada
    C: Reemplazando órganos dañados
    D: Tratando reacciones alérgicas graves
  answer: B
  explanation: El tejido donado puede ayudar a otros a sanar de las quemaduras más
    rápidamente mediante el uso de piel donada.
- id: 486
  category: driver_responsibility
  question: ¿El hueso donado puede ayudar a las personas a realizar cuál de las siguientes
    acciones?
  choices:
    A: Caminar sin dolor
    B: Recuperar la audición
    C: Mejorar su salud cardiovascular
    D: Recuperarse del asma
  answer: A
  explanation: Los trasplantes de tejido pueden ayudar a otras personas a caminar
    sin dolor mediante el uso de hueso trasplantado.
- id: 487
  category: driver_responsibility
  question: ¿Cómo puede la donación de órganos y tejidos ayudar a alguien a recuperar
    la vista?
  choices:
    A: A través de una cirugía de desprendimiento de retina
    B: A través de trasplantes de córnea
    C: A través de cirugía ocular con láser
    D: A través de la regeneración del nervio óptico
  answer: B
  explanation: Los trasplantes de órganos y tejidos podrían ayudar a otros a recuperar
    la vista mediante trasplantes de córnea.
- id: 488
  category: alcohol_drugs_health
  question: ¿Cómo se llama el folleto gratuito que ofrece la Junta de Control de Bebidas
    Alcohólicas de Pensilvania sobre el consumo de alcohol en menores de edad?
  choices:
    A: The Safe Driver
    B: Zero Tolerance Guide
    C: The Responsible Parent
    D: Underage Drinking Facts
  answer: C
  explanation: La Junta de Control de Bebidas Alcohólicas de Pensilvania ofrece un
    folleto gratuito titulado "The Responsible Parent" (El padre responsable).
- id: 489
  category: driver_responsibility
  question: ¿Qué organización se encarga de la recuperación de órganos y la educación
    en el oeste de Pensilvania?
  choices:
    A: Gift of Life Donor Program
    B: Center for Organ Recovery & Education (CORE)
    C: Pennsylvania Liquor Control Board
    D: American Academy of Pediatrics
  answer: B
  explanation: En el oeste de Pensilvania, las personas pueden comunicarse con el
    Centro de Recuperación y Educación de Órganos (CORE, por sus siglas en inglés)
    para obtener una tarjeta de donante de órganos y tejidos.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que se aproxima
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de detención, en el cruce de peatones o antes de entrar
    en la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 490
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 491
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico en sentido contrario.
  id: 492
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una calle de un solo sentido o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 493
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal en blanco y negro de UNA VÍA (ONE WAY) con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección hacia
    la que apunta la flecha.'
  id: 494
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 495
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 496
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 497
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro en forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 498
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Gire a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 499
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 500
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 501
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que crucen la calle.
  id: 502
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o un cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 503
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 504
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de tren. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 505
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 506
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 507
