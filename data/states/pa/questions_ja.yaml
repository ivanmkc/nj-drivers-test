    B: 10代の同乗者を乗せて運転しているとき
    C: 同乗者なしで運転しているとき
    D: ペットを同乗させて運転しているとき
  answer: B
  explanation: マニュアルの復習問題によると、10代のドライバーは、10代の同乗者を乗せて運転しているときに衝突事故を起こす可能性が高くなります。
- id: 332
  category: sharing_the_road
  question: オートバイの後方を走行する場合、少なくともどれくらいの車間距離を空けるべきですか？
  choices:
    A: 車2台分
    B: 2秒
    C: 4秒
    D: オートバイ4台分
  answer: C
  explanation: オートバイの後方を走行するときは、少なくとも4秒の車間距離を空けなければなりません。
- id: 333
  category: sharing_the_road
  question: ドライバーが右左折しようとしており、信号機のない場所で歩行者が横断している場合、どちらが道を譲らなければなりませんか？
  choices:
    A: 歩行者
    B: ドライバー
    C: 後から動き出した方
    D: 速度が遅い方
  answer: B
  explanation: 信号機がない場所であっても、歩行者が横断している場合は、右左折するドライバーが道を譲らなければなりません。
- id: 334
