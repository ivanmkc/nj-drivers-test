  explanation: 学科試験は18問の多肢選択式問題で構成されており、合格するには15問に正解する必要があります。
- id: 49
  category: driver_testing
  question: 学科試験（Knowledge Test）に不合格となった場合、いつから再受験が可能ですか？
  choices:
    A: 7日後
    B: 翌営業日
    C: 30日後
    D: 当日すぐ
  answer: B
  explanation: 学科試験に不合格となった場合、翌営業日から再受験が認められます。
- id: 50
  category: driver_testing
  question: 路上試験（Road Test）のために運転免許センターへ同行できる、18歳以上の人は誰ですか？
  choices:
    A: 免許を持っているすべての運転者
    B: 免許取得から1年が経過している友人
    C: 有効な運転免許証を持つ親、保護者、親代わりの人、または配偶者
