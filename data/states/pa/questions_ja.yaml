    C: 右折する運転者
    D: 誰にも与えていない
  answer: D
  explanation: 法律は交差点において誰にも優先権を与えていません。法律は、誰が譲らなければならないかを規定しているだけです。
- id: 358
  category: safe_driving_rules
  question: 一時停止標識のある交差点で停止した後、進む前にどこを確認すべきですか？
  choices:
    A: まず右、次に左、そしてもう一度右を確認する
