- id: 46
  category: license_system
  question: クラスC免許の保持者が消防車や緊急車両を運転できるのは、どのような条件の場合ですか？
  choices:
    A: クラスMの裏書き（エンドースメント）がある場合
    B: 車両重量が26,000ポンド未満の場合
