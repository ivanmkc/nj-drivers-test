    B: クラクションを2回鳴らす。
    C: 車に乗り込む前に、車両の後方を確認する。
    D: バックミラーを下向きに調整する。
  answer: C
  explanation: マニュアルによると、「後退するときは、常に車両の後方を確認してください。車に乗り込む前に行ってください。運転席からは子供や小さな物体は見えにくいものです」とされています。
- id: 186
  category: safe_driving_rules
  question: ペンシルベニア州における最高速度制限は何マイル（mph）ですか？
  choices:
    A: 55 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: マニュアルには「ペンシルベニア州の最高速度制限は70マイルである」と明記されています。
- id: 187
  category: vehicle_information
  question: 60 mph以上で走行すると、車両の燃料消費にどのような影響がありますか？
  choices:
