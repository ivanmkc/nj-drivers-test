    A: 24時間
    B: 3日間
    C: 7日間
    D: 14日間
  answer: C
  explanation: 18歳未満で路上試験に不合格となった場合、ペンシルベニア州法により、再受験まで7日間待機することが義務付けられています。
- id: 56
  category: driver_testing
  question: 各仮免許証（ラーナーズパーミット）で路上試験に合格するチャンスは何回ありますか？
  choices:
    A: 1回
    B: 2回
    C: 3回
    D: 有効期限内であれば無制限
  answer: C
  explanation: 仮免許証の有効期限が切れる前に、各仮免許証で路上試験に合格するチャンスは3回あります。
- id: 57
  category: license_system
  question: 健康診断の日から3年以内に路上試験を正常に完了しなかった場合、どうしなければなりませんか？
  choices:
    A: 遅延損害金を支払って許可証を延長する
    B: 新たに非商用仮免許申請書を提出し、知識試験を再受験して最初からやり直す
