- id: 58
  category: license_system
  question: クラスB運転免許証は、以下のうちどれを運転するために必要ですか？
  choices:
    A: 定格26,000ポンドを超える単一車両
    B: 総重量定格が26,001ポンド以上の車両の組み合わせ
    C: 3輪以上のオートバイ
    D: オートマチックトランスミッション付きの原動機付自転車
  answer: A
  explanation: クラスB免許は、26,001ポンド以上のモーターホームなど、定格26,000ポンドを超える単一車両を運転するために必要です。
- id: 59
  category: driver_testing
  question: 路上試験の前に、車両の操作装置（ワイパー、パーキングブレーキ、ハザードランプなど）を正しく操作できなかった場合、どうなりますか？
  choices:
    A: 減点されるが、試験に合格することは可能である
    B: 試験官が使い方を教えた上で試験を継続する
    C: 路上試験の不合格となる
    D: 日中の運転のみに制限される
  answer: C
  explanation: 車両の操作装置のいずれかを正しく操作できない場合は、路上試験の不合格となります。
- id: 60
  category: signs_and_signals
  question: 信号機が水平に並んでいる場合、どのように配置されていますか？
  choices:
    A: 赤は常に左側、緑は右側にある
    B: 緑は常に左側、赤は右側にある
    C: 黄色は常に左側、赤は右側にある
    D: 赤は常に上側、緑は下側にある
  answer: A
  explanation: マニュアルには、「水平に配置されている場合、赤は常に左側、緑は右側にあります」と記載されています。
- id: 61
  category: safe_driving_rules
  question: 赤信号で左折が許可されるのはどのような条件のときですか？
  choices:
    A: 2方向通行の道路から一方通行の道路へ曲がるとき
    B: どの道路にも対向車がいないとき
    C: 一方通行の道路から別の一方通行の道路へ曲がるとき
    D: 赤信号で左折することは決してできない
  answer: C
  explanation: マニュアルによると、左車線にいて一方通行の道路から別の一方通行の道路へ左折する場合、標識で禁止されていない限り、赤信号で停止した後に左折することができます。
- id: 62
  category: signs_and_signals
  question: 赤色の点滅信号は何を意味しますか？
  choices:
    A: 徐行して注意深く進む
    B: 一時停止（STOP）標識と同じ意味
    C: 信号機が故障しており、自分に優先権がある
    D: 交差する車両が近づいている場合のみ停止する
  answer: B
  explanation: マニュアルによると、「赤色の点滅信号は一時停止（STOP）標識と同じ意味です。完全に停止しなければなりません。その後、両方向を確認し、交差点の安全が確認された後にのみ進んでください。」
- id: 63
  category: signs_and_signals
  question: 信号機が作動していない交差点ではどのように対処すべきですか？
  choices:
    A: 右側の車両に道を譲り、停止せずに進む
    B: 警察官が交通整理を行うのを待つ
    C: 通常の速度で交差点を通過する
    D: 4方向一時停止（four-way STOP）標識があるものとして扱う
  answer: D
  explanation: マニュアルには、「作動していない信号機は、4方向一時停止（four-way STOP）標識があるものとして扱う必要があります」と明記されています。
- id: 64
  category: signs_and_signals
  question: 車線上の黄色の「X」の点灯は何を示していますか？
  choices:
    A: その車線を使用することは一切禁止されている
    B: その車線の走行方向が間もなく逆転するため、車線を変更しなければならない
    C: 車線を使用できるが、料金所のために減速しなければならない
    D: その特定の車線からは左折のみが可能である
  answer: B
  explanation: マニュアルでは、車線上の黄色の「X」の点灯は「その車線の走行方向が間もなく逆転するため、車線を変更しなければならないことを意味します。安全に車線を離れる準備をしてください」と説明されています。
- id: 65
  category: sharing_the_road
  question: 歩行者がすでに路上にいるときに、「横断禁止（DON'T WALK）」または「挙手」の合図が点滅し始めた場合、どうすべきですか？
  choices:
    A: 直ちに停止し、道路の真ん中で待つ
    B: 引き返して出発地点の歩道に戻る
    C: 横断を完了させる
    D: 最寄りの歩道までできるだけ速く走る
  answer: C
  explanation: マニュアルは歩行者に対し、「横断禁止（DON'T WALK）」または「挙手」の合図が点滅し始めたとき、「すでに路上にいる場合は、横断を完了させる」よう指示しています。
- id: 66
  category: sharing_the_road
  question: 白い杖を持っている、または盲導犬を連れている視覚障害のある歩行者の近くを運転する場合、どうしなければなりませんか？
  choices:
    A: クラクションを鳴らして、自分が近づいていることを知らせる
    B: 速度を維持するが、相手を避けるように慎重にハンドルを切る
    C: 停止して、渡っても安全であることを口頭で伝える
    D: 減速し、常に優先権を譲り、注意して進む
  answer: D
  explanation: マニュアルには次のように記載されています。「白い杖を持っている、または盲導犬を連れている視覚障害のある歩行者の近くを運転するときは、減速し、常に優先権を譲り、注意して進まなければなりません。」
- id: 67
  category: safe_driving_rules
  question: 黄色の信号が点滅しているスクールゾーンでの最高速度制限は何ですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: A
  explanation: マニュアルには、「黄色の信号が点滅している間、または標識に示された時間帯は、15 mphを超えて走行してはなりません」と記載されています。
- id: 68
  category: penalties_and_points
  question: スクールゾーンで速度制限を超過した場合の罰則は何ですか？
  choices:
    A: 初回違反の場合は警告
    B: 運転記録に1ポイントの加点と罰金
    C: 運転記録に3ポイントの加点と罰金
    D: 30日間の即時免許停止
  answer: C
  explanation: マニュアルによると、「スクールゾーンでの速度制限超過は、運転記録に3ポイント加算され、罰金も科せられます。」
- id: 69
  category: safe_driving_rules
  question: 踏切に近づいた際、遮断機が下りている場合はどうすべきですか？
  choices:
    A: 減速し、列車が見えない場合は遮断機を避けて進む
    B: 停止し、遮断機が上がり、すべての信号が終了するまで待つ
    C: 停止して両方向を確認し、慎重に遮断機を避けて進む
    D: クラクションを鳴らし、停止せずに進む
  answer: B
  explanation: マニュアルでは、下りている遮断機で停止することが義務付けられており、「前進したり、遮断機を回り込もうとしたり、接近する列車の信号を無視したりしないでください。すべての信号が終了した後、注意して進んでください...」と警告しています。
- id: 70
  category: signs_and_signals
  question: 緑色の矢印信号の点灯は何を意味しますか？
  choices:
    A: 曲がることはできるが、対向車に道を譲らなければならない
    B: 矢印の方向に曲がる前に停止しなければならない
    C: 走行中の車線が間もなく閉鎖される
    D: 矢印が指す方向に曲がることができ、その右左折は保護されている
  answer: D
  explanation: マニュアルには、「緑色の矢印信号の点灯は、矢印が指す方向に曲がることができることを意味します。緑色の矢印が出ている間に曲がる場合、対向車は赤信号で停止しているため、その右左折は『保護（優先）』されています」と記載されています。
- id: 71
  category: signs_and_signals
  question: 黄色の矢印の点滅は何を示していますか？
  choices:
    A: 矢印の方向への通行が保護されている（優先権がある）ことを示している
    B: 曲がる前に必ず一時停止しなければならない
    C: 注意して曲がることができるが、対向車や歩行者に道を譲らなければならない
    D: 信号機が故障しており、一時停止標識として扱う必要がある
  answer: C
  explanation: マニュアルには、「黄色の矢印の点滅（FLASHING YELLOW ARROW）は、注意して矢印の方向に進むことができることを意味しますが、まず対向車や歩行者に道を譲らなければなりません。黄色の矢印の点滅中に曲がる場合、その通行は保護されていません（優先権はありません）...」と記載されています。
- id: 72
  category: safe_driving_rules
  question: 単一車線のランプ（接続路）で、ランプメータリングの信号が青になるたびに、何台の車が高速道路に入ることができますか？
  choices:
    A: 1台
    B: 2台
    C: 3台
    D: 赤になるまでに安全に通過できる台数すべて
  answer: A
  explanation: マニュアルには、ランプメータリング信号について次のように規定されています。「単一車線のランプでは、信号が青になるたびに1台（1）の車だけが高速道路に入ることができます。」
- id: 73
  category: safe_driving_rules
  question: 渋滞が発生しており、線路を横断する必要がある場合、どうすべきですか？
  choices:
    A: 線路内で停止して、交通が動き出すのを待つ
    B: 線路から完全に離れた場所で車両を停止させる
    C: 前の車にできるだけ密着して、線路の上をゆっくり進む
    D: 前の車を早く動かすためにクラクションを鳴らす
  answer: B
  explanation: マニュアルには、「信号機や一時停止標識、あるいはその他の理由で渋滞している場合は、車両が線路から完全に離れた場所に停車するようにしてください」と記載されています。
- id: 74
  category: signs_and_signals
  question: 交通標識の3つの基本的なカテゴリーは何ですか？
  choices:
    A: 規制標識（Regulatory）、警戒標識（Warning）、案内標識（Guide）
    B: 情報標識、方向標識、警戒標識
    C: 速度標識、停止標識、譲れ標識
    D: 義務標識、勧告標識、工事標識
  answer: A
  explanation: マニュアルには、標識は「規制標識（Regulatory）」、「警戒標識（Warning）」、「案内標識（Guide）」の3つの基本的なカテゴリーに分けられると記載されています。
- id: 75
  category: penalties_and_points
  question: 規制標識の指示に従わなかった場合に起こりうる結果は何ですか？
  choices:
    A: 運転免許試験の再受験が求められる
    B: 罰金が科せられ、運転記録に点数が加算される可能性がある
    C: 車両が直ちに押収される
    D: 最初の3回の違反までは警告を受ける
  answer: B
  explanation: 規制標識の指示に従わない場合、法律違反となるため、罰金が科せられたり、運転記録に点数が加算されたりする可能性があります。
- id: 76
  category: safe_driving_rules
  question: 横断歩道や停止線が描かれている一時停止（STOP）標識に近づく際、車両のどこで停止しなければなりませんか？
  choices:
    A: 最初の描かれた線を越えた直後
    B: 車両の先端が最初の描かれた線に達する前
    C: 視界を確保するために横断歩道の中央
    D: 一時停止標識そのものと並行する位置
  answer: B
  explanation: 横断歩道や停止線（白い停止線）がある場合は、車両の先端が最初の線に達する前に停止しなければなりません。
- id: 77
  category: safe_driving_rules
  question: 4方向一時停止（FOUR-WAY STOP）の交差点に2台の車両が同時に到着した場合、どちらが優先権を譲らなければなりませんか？
  choices:
    A: 左側のドライバーが右側のドライバーに譲る
    B: 右側のドライバーが左側のドライバーに譲る
    C: より速い速度で走行している車両が譲る
    D: 最初にヘッドライトを点滅させた車両が優先権を持つ
  answer: A
  explanation: 4方向一時停止において、2台の車両が同時に交差点に到着した場合、左側のドライバーは右側のドライバーに道を譲らなければなりません。
- id: 78
  category: signs_and_signals
  question: 「譲れ（YIELD）」標識の形は何ですか？
  choices:
    A: 八角形（8辺）
    B: ペナント型
    C: 三角形（3辺）
    D: 縦長の長方形
  answer: C
  explanation: マニュアルには、「譲れ（YIELD）」標識は三角形（3辺）であると明記されています。
- id: 79
  category: safe_driving_rules
  question: ドライバーは「踏切（RAILROAD CROSSBUCK）」標識をどのように扱うべきですか？
  choices:
    A: 義務的な一時停止（STOP）標識として扱う
    B: 「譲れ（YIELD）」標識として扱う
    C: 「進入禁止（DO NOT ENTER）」標識として扱う
    D: 「速度制限（SPEED LIMIT）」標識として扱う
  answer: B
  explanation: クロスバック標識（X字型の踏切標識）は「譲れ（YIELD）」標識として扱う必要があります。列車の接近が見えたり聞こえたりした場合は、速度を落とし、停止の準備をしてください。
- id: 80
  category: safe_driving_rules
  question: 交差点で中央分離帯のある道路（divided highway）に曲がる際、1番目と2番目の車道で許可されている右左折は何ですか？
  choices:
    A: 1番目の車道では左折のみ、2番目の車道では右折のみ
    B: 1番目の車道では右折のみ、2番目の車道では左折のみ
    C: 両方の車道で右折が許可されている
    D: 両方の車道で左折が許可されている
  answer: B
  explanation: 中央分離帯のある道路について、マニュアルには「1番目の車道では右折のみが可能で、2番目の車道では左折のみが可能である」と記載されています。
- id: 81
  category: signs_and_signals
  question: 「中央車線左折専用 (CENTER LANE LEFT TURN ONLY)」標識の目的は何ですか？
  choices:
    A: 低速車両を追い越すための車線を提供するため。
    B: いずれの方向からの左折車両に対しても、専用の車線を確保するため。
    C: 直進車に優先権がある車線であることを示すため。
    D: 緊急車両専用の車線を指定するため。
  answer: B
  explanation: この標識は、いずれの方向からの左折車両に対しても専用の車線が確保されており、直進や追い越しに使用してはならないことを示しています。
- id: 82
  category: safe_driving_rules
  question: 「制限速度 (SPEED LIMIT)」標識は何を示していますか？
  choices:
    A: あらゆる条件下で走行しなければならない最低速度。
    B: 悪天候時に推奨される速度。
    C: 理想的な条件下での法定最高速度。
    D: 交通渋滞時に走行すべき速度。
  answer: C
  explanation: 「制限速度 (SPEED LIMIT)」標識は、その標識が設置されている道路の区間において、理想的な条件下での法定最高速度を示しています。
- id: 83
  category: defensive_driving
  question: マニュアルによると、16歳と17歳のドライバーが衝突事故を起こす一番の原因は何ですか？
  choices:
    A: アルコール影響下での運転。
    B: 運転中のテキストメッセージ送信。
    C: 優先権の譲り合いの失敗。
    D: 状況に対して速すぎる速度での運転。
  answer: D
  explanation: 「ティーンの衝突事故に関する事実」のセクションには、「状況に対して速すぎる速度での運転」が、16歳と17歳のドライバーが衝突事故を起こす一番の原因であると記載されています。
- id: 84
  category: safe_driving_rules
  question: 曲がる矢印と「ONLY（専用）」という文字が書かれた標識で制御されている車線に誤って入ってしまった場合、どうしなければなりませんか？
  choices:
    A: 停車し、交通が途切れるのを待ってから車線を変更する。
    B: 矢印で示された方向に曲がる。
    C: 交差点を注意深く直進する。
    D: 車をバックさせて車線から出る。
  answer: B
  explanation: 曲がる矢印と「ONLY」という文字が書かれた標識で制御されている車線にいる場合、たとえ誤ってその車線に入ったとしても、交差点に達したときはその矢印の方向に曲がらなければなりません。
- id: 85
  category: signs_and_signals
  question: 「青信号での左折は譲れ (LEFT TURN YIELD ON GREEN)」標識はどういう意味ですか？
  choices:
    A: 左折は保護されており、対向車は停止しなければならない。
    B: 信号が青のとき、左折は禁止されている。
    C: 左折は許可されているが、対向車に道を譲らなければならない。
    D: 左折するには青の矢印信号を待たなければならない。
  answer: C
  explanation: 「青信号での左折は譲れ (LEFT TURN YIELD ON GREEN)」標識は、左折は許可されているが、対向車に道を譲らなければならないことを示しています。
- id: 86
  category: penalties_and_points
  question: 障害者または重度障害を持つ退役軍人のための専用スペースに、許可のない車両が駐車した場合の罰則は何ですか？
  choices:
    A: フロントガラスに警告ステッカーが貼られる。
    B: 罰金およびレッカー移動費用。
    C: 運転免許の即時停止。
    D: 運転記録への点数の加算。
  answer: B
  explanation: これらの専用スペースに駐車した許可のない車両には、罰金およびレッカー移動費用が科せられます。
- id: 87
  category: signs_and_signals
  question: 「対向車線の青信号延長中 (OPPOSING TRAFFIC HAS EXTENDED GREEN)」という標識は何を示していますか？
  choices:
    A: あなたに左折の優先権がある。
    B: 対向車があなたに道を譲らなければならない。
    C: あなた側の信号が赤になった後も、対向車は進行を続ける可能性がある。
    D: 信号機が故障しており、4方向一時停止として扱う必要がある。
  answer: C
  explanation: この標識は、あなた側の信号が赤になった後も、対向車が進行を続ける可能性がある場所に設置されています。
- id: 88
  category: signs_and_signals
  question: ペナント型（三角形の旗のような形）をした唯一の警戒標識はどれですか？
  choices:
    A: この先一時停止 (Stop Sign Ahead)
    B: 譲れ (Yield)
    C: 追い越し禁止区間 (No Passing Zone)
    D: 幅の狭い橋 (Narrow Bridge)
  answer: C
  explanation: マニュアルには、「追い越し禁止区間 (No Passing Zone)」標識が唯一のペナント型の警戒標識であり、道路の左側にドライバーに向けて設置されると記載されています。
- id: 89
  category: signs_and_signals
  question: 「黄色の矢印点滅時は左折譲れ (Left Turn Yield on Flashing Yellow Arrow)」標識は何を示していますか？
  choices:
    A: 左折は保護されており、対向車は停止しなければならない。
    B: 左折は許可されているが、対向車に道を譲らなければならない。
    C: この交差点での左折は厳格に禁止されている。
    D: 右折する前に完全に停止しなければならない。
  answer: B
  explanation: この標識は、黄色の矢印が点滅しているときに左折が許可されていることを示していますが、その左折は保護されていない（優先ではない）ため、対向車に道を譲らなければなりません。
- id: 90
  category: signs_and_signals
  question: 「曲がりくねった道 (Winding Road)」の標識は、この先の道路にいくつのカーブが連続していることを示していますか？
  choices:
    A: 正確に2つのカーブ
    B: 3つ以上のカーブ
    C: 1つの急カーブの後に直線が続く
    D: 4つ以上の急カーブ
  answer: B
  explanation: 「曲がりくねった道（連続するカーブ）」の標識は、この先の道路に3つ以上のカーブが連続していることを示しています。
- id: 91
  category: sharing_the_road
  question: 道路に進入するドライバーにとって、「付加車線 (Added Lane)」の標識は何を意味しますか？
  choices:
    A: 進入する車両には新しい車線が割り当てられるため、合流の必要はありません。
    B: 進入する車両は、すでに主要道路を走行している車両に道を譲らなければなりません。
    C: この先の車線がなくなるため、左側に合流しなければなりません。
    D: 車両が流出し、あなたの進路を横切っています。
  answer: A
  explanation: 「付加車線 (Added Lane)」の標識は、道路に新しい車線が追加され、進入する交通がその車線を使用するため、合流の必要がないことを意味します。
- id: 92
  category: signs_and_signals
  question: 「二方向大矢印 (Two Direction Large Arrow)」の標識は、通常どこに設置されますか？
  choices:
    A: 中央分離帯のある高速道路の起点
    B: 狭い橋や地下道の直前
    C: T字路の突き当たり
    D: 追い越し禁止区間の左側
  answer: C
  explanation: 「二方向大矢印」の標識はT字路の突き当たりに設置され、左折または右折しかできないことを示します。
- id: 93
  category: safe_driving_rules
  question: 「濡れている時スリップ注意 (Slippery When Wet)」の標識がある場所で、雨天時に運転する場合はどうすべきですか？
  choices:
    A: 滑りやすいエリアを通過するために素早く加速する。
    B: 曲がる前に急ブレーキをかける。
    C: 速度を落とし、車間距離を長く取る。
    D: 通常の速度を維持するが、中央の車線を走行する。
  answer: C
  explanation: 雨天時は速度を落とし、車間距離を長く取る必要があります。急加速や急ブレーキは避けてください。
- id: 94
  category: defensive_driving
  question: 車両が道路から外れ、片輪が低い路肩や柔らかい路肩に落ちてしまった場合、やってはいけないことは何ですか？
  choices:
    A: アクセルペダルから足を離す。
    B: 道路に戻ろうとして、急ブレーキをかけたり急ハンドルを切ったりする。
    C: ハンドルをしっかりと握り続ける。
    D: 道路に戻ろうとする前に、徐々に減速する。
  answer: B
  explanation: マニュアルでは、片輪が低い路肩や柔らかい路肩に落ちた場合、車両のコントロールを失いやすいため、急ブレーキをかけたり、道路に戻ろうとして急ハンドルを切ったりしないよう警告しています。
- id: 95
  category: vehicle_information
  question: 急な坂道や下り坂に差し掛かる際、どのような行動をとる準備をしておくべきですか？
  choices:
    A: 勢いをつけるために、より高いギアにシフトアップする。
    B: 速度を制御し、ブレーキを保護するために、低いギアにシフトダウンする。
    C: 坂を下りきるまでずっとブレーキを踏み続ける。
    D: 燃料を節約するために、ギアをニュートラルにする。
  answer: B
  explanation: 「坂道/下り坂 (Hill/Downgrade)」の標識がある場合は、速度を落とし、速度制御とブレーキの摩耗を防ぐために低いギアにシフトダウンする準備をしてください。
- id: 96
  category: signs_and_signals
  question: 「この先自転車横断あり (Bicycle Crossing Ahead)」の標識の背景色は何色ですか？
  choices:
    A: 白または銀色
    B: 赤またはオレンジ色
    C: 黄色または蛍光黄緑色
    D: 緑または青色
  answer: C
  explanation: マニュアルによると、「この先自転車横断あり」の標識は、黄色の背景または蛍光黄緑色の背景のいずれかを使用します。
- id: 97
  category: signs_and_signals
  question: 「連続するカーブ (Set of Curves)」の標識と「左右の急カーブ (Right and Left Sharp Turns)」の標識で、ドライバーに求められる対応の違いは何ですか？
  choices:
    A: 連続するカーブは3つ以上のカーブがあることを示し、急カーブは2つだけであることを示す。
    B: 連続するカーブでは停止が必要だが、急カーブでは譲るだけでよい。
    C: 急カーブでは大幅な減速が必要だが、連続するカーブでは減速して走行の準備をすることが求められる。
    D: 違いはなく、これらは入れ替えて使用される。
  answer: C
  explanation: 「連続するカーブ」では、減速して走行の準備をする必要があります。「左右の急カーブ」では、道路が急角度で曲がっているため、「大幅に減速」して走行の準備をする必要があります。
- id: 98
  category: safe_driving_rules
  question: 「分離道路終了 (Divided Highway Ends)」の標識を見たら、どうすべきですか？
  choices:
    A: センターラインの右側を走行し、対向車に注意する。
    B: 一方通行の1車線に合流する準備をする。
    C: 中央分離帯の左側を走行し続ける。
    D: 高速道路の交通と安全に合流するために加速する。
  answer: A
  explanation: 「分離道路終了」の標識は、この先が対面通行の道路になることを意味します。センターラインの右側（米国ルール）を走行し、対向車に注意しなければなりません。
- id: 99
  category: safe_driving_rules
  question: 「一方向大矢印 (One Direction Large Arrow)」の標識に近づく際、どのように対応すべきですか？
  choices:
    A: 速度を維持し、左車線にとどまる。
    B: 交差点で曲がる時と同じくらい減速する。
    C: 進む前に完全に停止する。
    D: 急な角度を安全に通過するために加速する。
  answer: B
  explanation: 「一方向大矢印」は、道路が急な角度で方向を変えていることを示します。交差点で曲がる時と同じくらい減速する必要があります。
- id: 100
  category: signs_and_signals
  question: 「ウィーブエリア (Weave Area)」の警戒標識は何を示していますか？
  choices:
    A: 路面が平らではなく、ポットホールを避けるために蛇行運転が必要であること。
    B: 一部の車両が流出のために進路を横切るため、別の道路と合流すること。
    C: この先の車線が終了するため、隣の車線に割り込まなければならないこと。
    D: この先、自転車や歩行者が頻繁に道路を横断すること。
  answer: B
  explanation: 「ウィーブエリア」の標識は、一部の車両が流出のために進路を横切る状況で、別の道路と合流することを警告するために使用されます。
- id: 101
  category: defensive_driving
  question: 「カーブの先に交差道路あり」の標識を見た際、なぜ特に注意して交差点に近づかなければならないのですか？
  choices:
    A: 脇道が本道よりも優先権を持っているため。
    B: 脇道から進入する車両は、新しく追加された車線に合流しなければならないため。
    C: 本道に入ろうとしているドライバーが、カーブの向こうから近づいてくるあなたを確認できない可能性があるため。
    D: そのカーブは時速15マイル（15 mph）以上で走行する車両にとって急すぎるため。
  answer: C
  explanation: マニュアルには、本道に入ろうとしているドライバーがカーブの向こうから近づいてくるあなたを確認できず、あなたの前に飛び出してくる可能性があるため、細心の注意を払って接近するようにと記載されています。
- id: 102
  category: signs_and_signals
  question: 道路で使用される標識の中で、唯一の五角形の標識は次のうちどれですか？
  choices:
    A: 一時停止（Stop）の標識
    B: 踏切の標識
    C: 学校区域（School zone）の標識
    D: 追い越し禁止区域の標識
  answer: C
  explanation: マニュアルには、学校区域の標識が道路で使用される唯一の五角形の標識であり、学校区域に近づいていることを示すと記載されています。
- id: 103
  category: safe_driving_rules
  question: 掲示された作業区域（ワークゾーン）を走行する際、いつヘッドライトを点灯させる必要がありますか？
  choices:
    A: 夜間のみ
    B: 作業員が実際に現場にいる時のみ
    C: 時間帯に関わらず常に
    D: 雨や霧の時のみ
  answer: C
  explanation: マニュアルによると、作業区域を走行する際は時間帯に関わらずヘッドライトを点灯させなければならず、これはすべての掲示された作業区域において法律で定められています。
- id: 104
  category: penalties_and_points
  question: 作業区域内で交通違反により停車させられた際、車両のヘッドライトが点灯していなかった場合、追加の罰金はいくらですか？
  choices:
    A: $15
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: 作業区域内での交通違反で警察に停車させられた際、車両のヘッドライトが点灯していなかった場合、25ドルの追加罰金が科せられます。
- id: 105
  category: signs_and_signals
  question: 作業区域（ワークゾーン）の標識には通常何色が使用されますか？
  choices:
    A: 黄色に黒文字
    B: オレンジ色に黒文字
    C: 緑色に白文字
    D: 赤色に白文字
  answer: B
  explanation: 作業区域の標識は通常、警戒標識と同様に菱形をしていますが、黄色に黒文字ではなく、オレンジ色に黒文字で表示されます。
- id: 106
  category: sharing_the_road
  question: 道路の幅員減少地点（ピンチポイント）に設置された「自転車と自動車の道路共有（Bicycle/Motor Vehicle Share the
    Road）」の標識は何を示していますか？
  choices:
    A: この区間の道路では自転車の通行は許可されていない。
    B: 路肩がないか車線が狭いため、自動車の運転者は自転車のために十分なスペースを確保しなければならない。
    C: 自転車は常に自動車に優先権を譲らなければならない。
    D: この先に指定された独立した自転車専用車線がある。
  answer: B
  explanation: この標識は、道路の幅員減少地点（路肩がない、車線が狭いなど）で使用され、自動車の運転者に対し、自転車が道路を共有できるよう十分なスペースを確保するよう警告するものです。
- id: 107
  category: signs_and_signals
  question: 道路に隣接する障害物のマーカーに近づく際、下向きに傾斜したストライプは何を示していますか？
  choices:
    A: 最寄りの高速道路出口の方向。
    B: 危険を避けるために移動すべき方向。
    C: 完全停止しなければならないこと。
    D: 冠水によりこの先の道路が閉鎖されていること。
  answer: B
  explanation: 路傍の物体や状況はマーカーによって示され、ストライプが下向きに傾斜している方向が、危険を避けるために移動すべき方向を示しています。
- id: 108
  category: signs_and_signals
  question: マニュアルでは「アクティブ（稼働中）」な作業区域をどのように定義していますか？
  choices:
    A: オレンジ色の菱形標識が掲示されているすべてのエリア。
    B: 建設、保守、または公共事業の作業員が、開放されている走行車線に隣接する路上または路肩にいる作業区域の部分。
    C: 制限速度が時速25マイル（25 mph）に引き下げられている建設エリア。
    D: 重機が夜間駐車されているエリア。
  answer: B
  explanation: アクティブな作業区域とは、建設、保守、または公共事業の作業員が、道路上、または開放されている走行車線に隣接する高速道路の路肩にいる作業区域の部分を指します。
- id: 109
  category: signs_and_signals
  question: ペンシルベニア州の高速道路において、出口番号は何に対応していますか？
  choices:
    A: 出口が建設された年。
    B: 出口ランプの制限速度。
    C: マイルマーカー（距離標）。
    D: 交差する道路の数。
  answer: C
  explanation: 出口番号はマイルマーカーに対応しています。この変更により、運転者は出口間の距離を素早く計算できるようになります。
- id: 110
  category: signs_and_signals
  question: 高速道路の標識にある「EXIT ONLY（出口専用）」と書かれた黄色のパネルは何を示していますか？
  choices:
    A: 緊急車両のみがその出口を使用できる。
    B: 標識の下の車線はジャンクションを直進せず、出口ランプになる。
    C: その出口は建設のため閉鎖されている。
    D: 安全に出るために速度を上げなければならない。
  answer: B
  explanation: 高速道路の標識に「EXIT ONLY」というメッセージが書かれた黄色のパネルがある場合、その標識の下の車線はジャンクションを直進せず、道路から外れて出口ランプになります。
- id: 111
  category: signs_and_signals
  question: 州間高速道路番号体系（Interstate Numbering System）において、1桁または2桁の偶数番号の州間高速道路は、一般的に何を示していますか？
  choices:
    A: 南北に走るルート
    B: 東西に走るルート
    C: 市街地中心部に直接つながるルート
    D: 現在建設中のルート
  answer: B
  explanation: 1桁または2桁の偶数番号の州間高速道路は、一般的に東西に走るルートです。
- id: 112
  category: signs_and_signals
  question: 偶数で始まる3桁の州間高速道路番号（I-276など）は、通常何を意味しますか？
  choices:
    A: 一端のみで接続する支線（スパー・ルート）である
    B: 南北のみを走行するルートである
    C: 両端で州間高速道路に接続しており、多くの場合「ループ」や「ベルトウェイ（環状道路）」として知られている
    D: 有料道路である
  answer: C
  explanation: 3桁の数字の最初の数字が偶数の場合、その高速道路は通常、両端で州間高速道路に接続しています。多くの場合、このようなルートは「ループ」または「ベルトウェイ（環状道路）」と呼ばれます。
- id: 113
  category: signs_and_signals
  question: 前方の高速道路の出口が道路の左側にあるかどうかは、どのようにして分かりますか？
  choices:
    A: 出口標識が全体的に黄色で塗られている
    B: メインの長方形の標識の上にある、小さな緑色の出口番号標識が左側に配置されている
    C: 出口番号が奇数である
    D: 標識の上に赤い点滅灯がある
  answer: B
  explanation: 高速道路の出口が左側にある場合、緑色の長方形の標識の上にある小さな緑色の「EXIT」番号標識が、標識の左側に配置されます。
- id: 114
  category: signs_and_signals
  question: 工事区域の電光矢印板が、方向を示す矢印ではなく「注意（caution）」メッセージを表示している場合、それは何を意味しますか？
  choices:
    A: この先の道路が完全に閉鎖されている
    B: 直ちに路肩に車を寄せなければならない
    C: 走行車線の隣に工事区域がある
    D: 踏切に近づいている
  answer: C
  explanation: 矢印パネルに注意メッセージが表示されている場合は、走行車線の隣に工事区域があることを示しています。細心の注意を払って運転してください。
- id: 115
  category: signs_and_signals
  question: ほとんどの高速道路や自動車専用道路の案内標識は何色ですか？
  choices:
    A: 赤地に白文字
    B: 黄地に黒文字
    C: 緑地に白文字
    D: 青地に白文字
  answer: C
  explanation: マニュアルによると、高速道路や自動車専用道路の案内標識は緑地に白文字です。
- id: 116
  category: signs_and_signals
  question: 工事区域において、変化する交通パターンを案内し、危険から遠ざけるために使用されるものは次のうちどれですか？
  choices:
    A: 電光矢印板
    B: 五角形の標識
    C: バレル（ドラム缶型）、チューブ、コーン、および垂直パネル
    D: 赤・白・青のシールド（盾型標識）
  answer: C
  explanation: バレル、チューブ、コーン、垂直パネルはすべて、工事区域で使用されるチャネリング（導流）デバイスであり、変化する交通パターンを案内し、道路工事に伴う危険から遠ざけるために使用されます。
- id: 117
  category: signs_and_signals
  question: ペンシルベニア州の東西に走る道路において、マイルマーカーの番号はどこでゼロから始まりますか？
  choices:
    A: 州の東部
    B: 州の西部
    C: 州の中央部
    D: ルート上の最大の都市
  answer: B
  explanation: マニュアルによると、東西に走る道路のマイルマーカーの番号は州の西部でゼロから始まり、東へ進むにつれて数字が大きくなります。
- id: 118
  category: safe_driving_rules
  question: 高速道路のマイルマーカーの読み方を知ることの実用的な利点は何ですか？
  choices:
    A: 高速道路の現在の制限速度がわかる
    B: 次の休憩所までの正確な距離がわかる
    C: ロードサービスを呼ぶ必要がある場合に、おおよその現在地を伝えるのに役立つ
    D: 次の州境までの残りマイル数がわかる
  answer: C
  explanation: マニュアルには、マイルマーカーの読み方を知ることで、自分の正確な位置を把握でき、ロードサービスを呼ぶ際におおよその場所を伝えるのに役立つと記載されています。
- id: 119
  category: signs_and_signals
  question: 次の出口にある病院、食事、宿泊施設の場所を示すサービス標識は何色ですか？
  choices:
    A: 緑地に白文字
    B: 青地に白文字またはシンボル
    C: 茶地に白文字
    D: 黄地に黒文字
  answer: B
  explanation: サービス標識は正方形または長方形で、青地に白文字またはシンボルで表示され、次の出口にある様々なサービスの場所を示します。
- id: 120
  category: signs_and_signals
  question: 博物館や州立公園へドライバーを案内する観光案内標識には、通常どの色が使用されますか？
  choices:
    A: 赤またはオレンジ地に黒文字
    B: 緑または黄地に黒文字
    C: 青または茶地に白文字
    D: 黒または白地に赤文字
  answer: C
  explanation: 観光案内標識は正方形または長方形で、青または茶地に白文字で表示されます。
- id: 121
  category: signs_and_signals
  question: 黄色の路面標示の主な目的は何ですか？
  choices:
    A: 同じ方向に進む交通の車線を分けるため
    B: 道路の右端を示すため
    C: 反対方向に進む交通を分けるため
    D: 自転車専用レーンを示すため
  answer: C
  explanation: マニュアルによると、黄色の線は反対方向に進む交通を分けるものであり、2車線道路の中央を示すために使用されます。
- id: 122
  category: signs_and_signals
  question: 同じ方向に進む交通の車線を分け、道路の右端を示すために使用される路面標示はどれですか？
  choices:
    A: 白の実線
    B: 黄色の破線
    C: 黄色の実線
    D: 黄色の二重線
  answer: A
  explanation: 白の実線は、同じ方向に進む交通の車線を分けるほか、道路の右端を示すためにも使用されます。
- id: 123
  category: safe_driving_rules
  question: 対面通行の道路にある黄色の二重実線の中央線は何を示していますか？
  choices:
    A: 両方向の交通において追い越しが許可されている。
    B: どちらの方向の交通においても追い越しは禁止されている。
    C: 右側の交通のみ追い越しができる。
    D: その車線は左折専用である。
  answer: B
  explanation: 黄色の二重実線の中央線は、どちらの方向の交通においても追い越しが禁止されている対面通行道路の中央を示します。
- id: 124
  category: safe_driving_rules
  question: 黄色の実線と黄色の破線が組み合わされた中央線がある対面通行の道路で、追い越しが許可されるのはどのような時ですか？
  choices:
    A: 黄色の実線が自分の車線側にある時のみ
    B: 黄色の破線が自分の車線側にある時のみ
    C: 線の種類に関わらず、対向車がいない時はいつでも
    D: このような道路では追い越しは一切許可されない
  answer: B
  explanation: 自分の車線側に破線があり、安全な状況であれば追い越しができますが、自分の車線側に黄色の実線がある場合は追い越しをしてはいけません。
- id: 125
  category: safe_driving_rules
  question: 3車線または5車線の道路で、内側が黄色の破線、外側が黄色の実線で標示された中央レーンの目的は何ですか？
  choices:
    A: 低速車を追い越すための通常の走行車線である。
    B: 緊急車両専用に予約されている。
    C: どちらの方向から進む車両も、左折するためだけに利用できる。
    D: ラッシュアワー用のリバーシブルレーンである。
  answer: C
  explanation: 内側の黄色い破線と外側の黄色い実線の中央線は、どちらの方向から進む車両も、中央レーンを左折のためだけに利用できることを示しています。
- id: 126
  category: signs_and_signals
  question: 中央分離帯のある自動車専用道路において、路面の左端と右端はどのように標示されていますか？
  choices:
    A: 両端とも白の実線で標示されている。
    B: 両端とも黄色の実線で標示されている。
    C: 右端は黄色の実線、左端は白の実線である。
    D: 右端は白の実線、左端は黄色の実線である。
  answer: D
  explanation: 中央分離帯のある自動車専用道路では、道路の右端は白の実線で標示され、各車線側の左端は黄色の実線で標示されます。
- id: 127
  category: safe_driving_rules
  question: 信号機のない踏切に近づく際、最も安全な行動は何ですか？
  choices:
    A: できるだけ速やかに線路を通過する
    B: 減速し、列車が近づいているのが見えたり聞こえたりした場合は停止できるよう準備する
    C: 列車の有無に関わらず完全に停止する
    D: 通常の速度で踏切を通過する
  answer: B
  explanation: 踏切に信号機がない場合は、減速し、列車が近づいているのが見えたり聞こえたりした場合には停止できるように準備する必要があります。
- id: 128
  category: safe_driving_rules
  question: 踏切の遮断機が閉じている際、その脇を通り抜けて運転してもよいのはどのような場合ですか？
  choices:
    A: 列車が通過したのがはっきりと見える時
    B: 赤信号の点滅は止まったが、遮断機が故障で動かない時
    C: 他のドライバーが遮断機の脇を通り抜けている時
    D: いかなる場合も認められない
  answer: D
  explanation: マニュアルの復習セクションには、踏切の遮断機の脇を通り抜けて運転することは「いかなる場合も認められない（Never）」と明記されています。
- id: 129
  category: signs_and_signals
  question: 黄色と黒のひし形の標識の一般的な意味は何ですか？
  choices:
    A: 前方の都市や町への案内に役立つ
    B: 交通法規や規制について知らせる
    C: 道路上または道路付近の状況について警告する
    D: スクールゾーンを示す
  answer: C
  explanation: 黄色と黒のひし形の標識は警告標識であり、道路上または道路付近の状況について警告するものです。
- id: 130
  category: signs_and_signals
  question: 黄色と黒のひし形の標識は何を示していますか？
  choices:
    A: 前方の都市や町への案内に役立つ
    B: 道路上または道路付近の状況について警告する
    C: 交通法規や規制について知らせる
    D: 前方の道路工事について知らせる
  answer: B
  explanation: 黄色と黒のひし形の標識は、道路上または道路付近の状況について警告するものです。
- id: 131
  category: signs_and_signals
  question: 信号機の色の正しい順番は、上から順にどうなっていますか？
  choices:
    A: 赤、黄、緑
    B: 赤、緑、黄
    C: 緑、赤、黄
    D: 緑、黄、赤
  answer: A
  explanation: 上から順に、信号機の正しい順番は赤、黄、緑です。
- id: 132
  category: signs_and_signals
  question: 青色の矢印信号が通常の青信号に変わった場合、どうすべきですか？
  choices:
    A: 曲がることができなくなり、直進しなければならない
    B: 引き続き優先的に曲がる権利がある
    C: 停止して次の青色の矢印を待たなければならない
    D: 引き続き曲がることはできるが、対向車に道を譲らなければならない
  answer: D
  explanation: 青色の矢印信号が青信号に変わった場合、引き続き曲がることはできますが、対向車に道を譲る（譲歩する）必要があります。
- id: 133
  category: signs_and_signals
  question: 交差点での黄色の点灯信号は何を意味しますか？
  choices:
    A: 進め
    B: 他の車に道を譲れ
    C: 減速して停止の準備をせよ
    D: 直ちに停止せよ
  answer: C
  explanation: 交差点での黄色の点灯信号は、減速して停止の準備をすべきであることを意味します。
- id: 134
  category: signs_and_signals
  question: 黄色の点滅信号に遭遇したとき、どうすべきですか？
  choices:
    A: 徐行し、注意して進む
    B: 道が空いていれば通常の速度で進み続ける
    C: 停止し、青信号になるまで待つ
    D: 停止し、安全が確認できたら進む
  answer: A
  explanation: 黄色の点滅信号は、徐行して注意深く進むべきであることを意味します。
- id: 135
  category: signs_and_signals
  question: 次の信号のうち、完全な一時停止が必要なものはどれですか？
  choices:
    A: 赤色の点滅信号
    B: 黄色の点灯信号
    C: 黄色の矢印信号
    D: 黄色の点滅信号
  answer: A
  explanation: 赤色の点滅信号を見たときは、一時停止しなければなりません。
- id: 136
  category: safe_driving_rules
  question: どのような条件下で、黄信号を注意してそのまま進むことができますか？
  choices:
    A: 緊急車両が自分の車線を横切っている場合
    B: 歩行者が横断していない場合
    C: 右折する場合
    D: すでに交差点内に入っている場合
  answer: D
  explanation: すでに交差点内に入っている場合は、注意しながら黄信号を進み続けることができます。
- id: 137
  category: safe_driving_rules
  question: 信号機が故障している、または機能していない交差点に近づいた場合、どうすべきですか？
  choices:
    A: 停止して修理されるのを待つ
    B: 停止して警察官が到着するのを待つ
    C: 全方向一時停止（4-way stop）の標識があるものとして進む
    D: 通常通り進む
  answer: C
  explanation: 信号機が故障している、または機能していない場合は、全方向一時停止（4-way stop）の交差点であるかのように進む必要があります。
- id: 138
  category: safe_driving_rules
  question: 赤信号で右折する前に、何をしなければなりませんか？
  choices:
    A: まず停止し、交通状況と歩行者を確認する
    B: 右折の赤色矢印信号があることを確認する
    C: 左車線に移動する
    D: 完全に停止せずに、まず減速する
  answer: A
  explanation: 赤信号での右折が許可されている場所では、まず一時停止し、交通状況と歩行者を確認すれば曲がることができます。
- id: 139
  category: signs_and_signals
  question: 同じ方向に進む車線を区切る線の色は何色ですか？
  choices:
    A: 黄色
    B: 白色
    C: 赤色
    D: 黒色
  answer: B
  explanation: 同じ方向に進む車線は、白い線で区切られています。
- id: 140
  category: safe_driving_rules
  question: どのような種類の中央線（センターライン）において、両側とも他車を追い越すことが禁止されていますか？
  choices:
    A: 実線と破線の黄色の組み合わせ
    B: 1本の黄色の破線
    C: 2本の黄色の実線
    D: 1本の白色の破線
  answer: C
  explanation: 2本の黄色の実線の中央線では、どちら側からも他車を追い越すことはできません。
- id: 141
  category: safe_driving_rules
  question: 一時停止標識の路面に描かれた白い停止線の手前で停止した際、交差する道路の交通状況がよく見えない場合、どうすべきですか？
  choices:
    A: 進む前にクラクションを鳴らす
    B: 5秒間待ってから進む
    C: ゆっくりと前進し、車両や歩行者がいないか確認し、安全であれば進む
    D: 窓を開け、交通の音を聞いてから進む
  answer: C
  explanation: マニュアルによると、停止線の手前で停止した際に交差する道路の交通状況がよく見えない場合は、ゆっくりと前進して車両や歩行者を確認し、安全が確認できてから進む必要があります。
- id: 142
  category: signs_and_signals
  question: 掲示されている制限速度は何を示していますか？
  choices:
    A: 法定最低速度
    B: 道路や天候が理想的な条件下での安全な最高速度
    C: 違反切符を切られないために走行しなければならない正確な速度
    D: あらゆる道路条件下での安全な最高速度
  answer: B
  explanation: 掲示されている制限速度は、道路や天候が理想的な条件下での安全な最高速度を示しています。
- id: 143
  category: safe_driving_rules
  question: 中央車線（センターレーン）から合法的に行える操作は何ですか？
  choices:
    A: 左折する
    B: Uターンする
    C: 低速車両を追い越す
    D: 車両を駐車する
  answer: A
  explanation: マニュアルのテスト項目に基づくと、中央車線から行える正しい操作は左折です。
- id: 144
  category: vehicle_information
  question: 車のタイヤの空気圧をチェックするのに最適な時期はいつですか？
  choices:
    A: 高速道路を走行した直後
    B: タイヤが「冷えている」とき（走行前、または走行後少なくとも3時間経過してから）
    C: エンジンがかかっている間
    D: 夏季のみ
  answer: B
  explanation: マニュアルには、タイヤが「冷えている」状態、つまり走行前または走行後少なくとも3時間経過してからチェックするように記載されています。
- id: 145
  category: vehicle_information
  question: ペニーテストでタイヤの摩耗をチェックする際、安全な溝の深さで走行していることを示すのはどれですか？
  choices:
    A: エイブラハム・リンカーンの頭がすべて見える
    B: 溝に置いたときにペニーが倒れる
    C: エイブラハム・リンカーンの頭の一部が溝（トレッド）に隠れている
    D: 溝が完全に平らである
  answer: C
  explanation: ペニーテスト中にリンカーンの頭の一部が溝に隠れていれば、安全な溝の深さで走行していることになります。
- id: 146
  category: safe_driving_rules
  question: 車内の客室に固定されていない荷物を置いておくのが危険なのはなぜですか？
  choices:
    A: タイヤの空気圧が下がる原因になるため
    B: 衝突時に、衝突前の速度で飛び続ける「飛び出し物」となるため
    C: 車両の燃料消費量が増えるため
    D: 一酸化炭素中毒の原因になるため
  answer: B
  explanation: 衝突時、車内の固定されていない荷物は、衝突前に車両が走行していた速度と同じ速度で飛び続ける「飛び出し物」となり、危険です。
- id: 147
  category: vehicle_information
  question: 死角をなくすためにサイドミラーを調整する場合、どのように設定すべきですか？
  choices:
    A: 自車の真後ろの交通状況が見えるように設定する
    B: 体を傾けずに自車の側面全体が見えるように設定する
    C: 左右に体を傾けたときに、自車の側面がわずかに見えるように設定する
    D: 地面を直接指すように設定する
  answer: C
  explanation: サイドミラーは、左右に体を傾けたときに自車の側面がわずかに見えるように設定する必要があります。
- id: 148
  category: penalties_and_points
  question: バックミラーに物を吊るすことに関するペンシルベニア州の法律は何ですか？
  choices:
    A: 物が3インチ（約7.6cm）未満であれば合法である
    B: 走行中にバックミラーに物を吊るすことは法律違反である
    C: 走行中に吊るすことが許可されているのは駐車許可証のみである
    D: 初心者ドライバーを識別するために物を吊るすことが義務付けられている
  answer: B
  explanation: 走行中にバックミラーに物や資料を吊るすことは法律違反です。タグ、許可証、プラカードなどは、車両が駐車しているときにのみ取り付けることができます。
- id: 149
  category: alcohol_drugs_health
  question: 車内に常に新鮮な空気を取り入れることは、注意力を維持するだけでなく、どのような危険を防ぐのに役立ちますか？
  choices:
    A: 一酸化炭素（排気ガス）中毒
    B: 二酸化窒素中毒
    C: 脱水症状
    D: 乗り物酔い
  answer: A
  explanation: 車内に常に新鮮な空気を取り入れることは、注意力を維持し、運転中の一酸化炭素（排気ガス）中毒を防ぐのに役立ちます。
- id: 150
  category: vehicle_information
  question: 車のヘッドレスト（頭部後傾抑止装置）はどのように適切に調整すべきですか？
  choices:
    A: ヘッドレストの下部が肩に乗るように調整する
    B: ヘッドレストの上部が少なくとも耳の上端と同じ高さになるように調整する
    C: 首の真後ろに位置するように調整する
    D: 視界を良くするために完全に取り外す
  answer: B
  explanation: 衝突時の首の怪我を防いだり程度を軽減したりするために、ヘッドレストの上部が少なくとも耳の上端と同じ高さになるように調整してください。
- id: 151
  category: safe_driving_rules
  question: マニュアルによると、衝突時に車外に放り出された場合、死亡する確率は何パーセント増加しますか？
  choices:
    A: 25パーセント
    B: 50パーセント
    C: 75パーセント
    D: 90パーセント
  answer: C
  explanation: 車外に放り出されると、死亡する確率が75パーセント増加します。ドアをロックし、シートベルトを着用することで、車外に放り出されないようにすることができます。
- id: 152
  category: safe_driving_rules
  question: 運転中のヘッドホンやイヤホンの使用に関する規則は何ですか？
  choices:
    A: GPSを聞くためであれば、両耳に使用できる
    B: 通信目的の場合に限り、片耳のみで使用できる
    C: いかなる時も着用は完全に違法である
    D: 音楽を聴くためであれば、両耳に使用できる
  answer: B
  explanation: 注意：ヘッドホンやイヤホンは、通信目的の場合に限り、片耳のみで使用できます。
- id: 153
  category: driver_responsibility
  question: 統計によると、ティーンエイジャーのドライバーが事故を起こす可能性が高くなるのは、どのような状況で運転している時ですか？
  choices:
    A: 一人で運転している時
    B: 大人の同乗者がいる時
    C: 他のティーンエイジャーを同乗させている時
    D: 午前中の時間帯
  answer: C
  explanation: ティーンエイジャーのドライバーが他のティーンエイジャーを乗せて運転している場合、一人で運転している場合や大人を乗せて運転している場合よりも、事故を起こす可能性が高いことが統計で示されています。
- id: 154
  category: defensive_driving
  question: 警察に報告された交通事故のうち、ドライバーの注意散漫や道路・交通状況への不注意が原因であるものは何パーセントを占めますか？
  choices:
    A: 10〜15パーセント
    B: 25〜30パーセント
    C: 45〜50パーセント
    D: 75〜80パーセント
  answer: B
  explanation: 警察に報告された交通事故の25〜30パーセントは、ドライバーの注意散漫や道路・交通状況への不注意が原因です。
- id: 155
  category: defensive_driving
  question: 調査によると、携帯電話でダイヤル操作をしているティーンエイジャーは、どのくらいの頻度で道路上の重要な出来事を見逃しますか？
  choices:
    A: 3パーセントの確率
    B: 13パーセントの確率
    C: 25パーセントの確率
    D: 53パーセントの確率
  answer: D
  explanation: 調査によると、注意を逸らしていない通常のドライバーが道路上の重要な出来事を見逃す割合は3パーセントですが、携帯電話でダイヤル操作をしている大人は13パーセント、携帯電話でダイヤル操作をしているティーンエイジャーは53パーセントの割合で見逃すことがわかっています。
- id: 156
  category: alcohol_drugs_health
  question: 18時間起き続けている状態での運転能力の低下は、血中アルコール濃度（BAC）がどの程度である場合とほぼ同じですか？
  choices:
    A: .02パーセント
    B: .05パーセント
    C: .08パーセント
    D: .10パーセント
  answer: B
  explanation: マニュアルには、18時間起き続けている状態は、血中アルコール濃度（BAC）が.05パーセントである場合とほぼ同程度に運転能力を損なうと記載されています。
- id: 157
  category: safe_driving_rules
  question: 運転中に疲れを感じ始めた場合、最も適切な対処法は何ですか？
  choices:
    A: コーヒーやカフェイン飲料を飲む
    B: 窓を開けて外気を入れる
    C: 運転を止める
    D: ラジオの音量を上げる
  answer: C
  explanation: マニュアルには、運転中に疲れを感じ始めた場合の最善の策は、運転を止めることであると明記されています。
- id: 158
  category: alcohol_drugs_health
  question: 安全な運転を確保するために、どのくらいの頻度で視力検査を受けるべきですか？
  choices:
    A: 6ヶ月ごと
    B: 1〜2年ごと
    C: 3〜5年ごと
    D: 免許更新時のみ
  answer: B
  explanation: 周辺視野、距離感、低照度下での視力は時間の経過とともに低下する可能性があるため、マニュアルでは1〜2年ごとに視力検査を受けることを推奨しています。
- id: 159
  category: alcohol_drugs_health
  question: ペンシルベニア州では、医師が患者に対して安全な運転を損なう可能性のある疾患があると診断した場合、何をすることが義務付けられていますか？
  choices:
    A: 患者の運転免許証を没収する
    B: その人物をPennDOT（州運輸局）に報告する
    C: 運転を許可する前に薬を処方する
    D: 患者の保険会社に通知する
  answer: B
  explanation: ペンシルベニア州では、医師は安全に運転する能力を損なう可能性のある疾患があると診断した人物を、PennDOT（ペンシルベニア州運輸局）に報告しなければなりません。
- id: 160
  category: alcohol_drugs_health
  question: 21歳未満の場合、血中アルコール濃度（BAC）がいくつ以上であれば、酒気帯び運転（DUI）とみなされますか？
  choices:
    A: .00パーセント
    B: .02パーセント
    C: .04パーセント
    D: .08パーセント
  answer: B
  explanation: 21歳未満のドライバーで、血中アルコール濃度（BAC）が.02パーセント以上の場合、酒気帯び運転（DUI）とみなされます。
- id: 161
  category: alcohol_drugs_health
  question: 次のうち、標準的なアルコール飲料1杯分に相当するとみなされるのはどれですか？
  choices:
    A: 8オンスのレギュラービール
    B: 5オンスのワイン
    C: 2オンスのアルコール度数40度（80プルーフ）の蒸留酒
    D: 16オンスのライトビール
  answer: B
  explanation: アルコール飲料1杯分は、アルコール度数40度（80プルーフ）の蒸留酒1.5オンス、レギュラービール12オンス、またはワイン5オンスに相当すると考えるべきです。
- id: 162
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）を下げるための唯一の効果的な方法は何ですか？
  choices:
    A: コーヒーを飲む
    B: 冷たいシャワーを浴びる
    C: 重い食事を摂る
    D: 時間が経過するのを待つ
  answer: D
  explanation: マニュアルには、時間だけが「酔いを覚ます」と記載されています。コーヒーやカフェイン入りの飲料を飲んだり、冷たいシャワーを浴びたりしても、BACを下げることはできません。
- id: 163
  category: alcohol_drugs_health
  question: 血中アルコール濃度が0.04パーセントであっても、アルコールを全く摂取していないドライバーと比較して、衝突事故に巻き込まれる可能性はどのくらい高くなりますか？
  choices:
    A: 2倍から7倍高くなる
    B: 10倍高くなる
    C: 20倍高くなる
    D: 50倍高くなる
  answer: A
  explanation: 血中アルコール濃度が0.04のドライバーは、血中にアルコールがないドライバーよりも衝突事故に巻き込まれる可能性が2倍から7倍高くなります。
- id: 164
  category: alcohol_drugs_health
  question: 大麻（マリファナ）は安全運転能力にどのような影響を与えますか？
  choices:
    A: 攻撃的で無謀な運転を引き起こす
    B: 距離の判断力を向上させる
    C: 反応時間を遅らせ、時間と距離の判断力を損なう
    D: 協調性と注意力が高まる
  answer: C
  explanation: 大麻は反応時間を遅らせ、時間と距離の判断力を損ない、運動の協調性を低下させる可能性があります。
- id: 165
  category: alcohol_drugs_health
  question: 薬の警告ラベルに「重機の操作をしないでください」と記載されている場合、ドライバーにとってそれは何を意味しますか？
  choices:
    A: 普通乗用車は運転してもよいが、商用トラックは運転してはいけない
    B: 自分の車両も重機とみなされるため、運転すべきではない
    C: 注意力があると感じる限り、運転してもよい
    D: 制限速度以下で運転しなければならない
  answer: B
  explanation: マニュアルではドライバーに次のように注意を促しています。「警告ラベルに『重機の操作をしないでください』と記載されている場合、あなたの車両も重機とみなされます！」
- id: 166
  category: driver_responsibility
  question: 運転経験が何年未満のドライバーが、衝突事故につながるミスを犯す可能性が最も高いですか？
  choices:
    A: 1年
    B: 3年
    C: 5年
    D: 10年
  answer: C
  explanation: 運転経験が5年未満のドライバーは、衝突事故につながるミスを犯す可能性が最も高いです。
- id: 167
  category: safe_driving_rules
  question: ペンシルベニア州の新しいドライバー（16歳および17歳）が関与する衝突事故の中で、最も多い主な種類は何ですか？
  choices:
    A: 他の車両への追突
    B: 静止物への衝突
    C: 正面衝突
    D: 追い越し時の車両への側面接触
  answer: B
  explanation: ペンシルベニア州の新しいドライバー（16歳および17歳）が関与する主な衝突事故の種類には、1) 静止物への衝突が含まれます。
- id: 168
  category: alcohol_drugs_health
  question: NHTSAの調査によると、衝突事故で死亡したドライバーの何パーセントから薬物の陽性反応が出ましたか？
  choices:
    A: 20%
    B: 30%
    C: 37%
    D: 43%
  answer: D
  explanation: マニュアルに記載されているNHTSA（全米ハイウェイ交通安全局）の2013-2014年路上調査によると、衝突事故で死亡したドライバーの43%から薬物の陽性反応が出ました。
- id: 169
  category: safe_driving_rules
  question: 通常の乾燥した路面状況において、推奨される安全な車間距離はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: C
  explanation: 路面が乾燥している場合、4秒の車間距離があれば、高速道路で危険を回避するために安全にハンドル操作やブレーキ操作を行うことができます。
- id: 170
  category: defensive_driving
  question: 他のドライバーが車間距離を極端に詰めて（あおり運転）走行している場合、どうすべきですか？
  choices:
    A: 距離を広げるためにスピードを上げる
    B: 可能であれば右側の車線に移動する
    C: 警告するために急ブレーキをかける
    D: 左側の車線に移動し、速度を維持する
  answer: B
  explanation: 後ろの車が車間距離を詰めすぎている（あおり運転）のに気づいたら、可能であれば右側の車線に移動してください。また、ブレーキを軽く叩いてゆっくりと速度を落とし、相手に追い越しを促すこともできます。
- id: 171
  category: safe_driving_rules
  question: 問題となる状況を早期に特定するために、どのくらい先を見るべきですか？
  choices:
    A: 3〜5秒先
    B: 6〜8秒先
    C: 12〜15秒先
    D: 20〜30秒先
  answer: C
  explanation: 問題となる状況を12〜15秒先（市街地では約1ブロック先、高速道路の速度では約4分の1マイル先）で特定できる必要があります。
- id: 172
  category: defensive_driving
  question: 交差点に差し掛かった際、なぜ最初に左側を確認すべきなのですか？
  choices:
    A: 左から来る車両の方が自分に近いからです。
    B: 左から来る車両に優先権があるからです。
    C: 左側の車両の方が視認しやすいからです。
    D: 左側の車両は通常、より速い速度で走行しているからです。
  answer: A
  explanation: 交差点に差し掛かったら、「左・右・左」のルールに従ってください。左から来る車両の方が自分に近いため、まず左側を確認します。
- id: 173
  category: safe_driving_rules
  question: 車両の左後方および右後方の死角を確認する最善の方法は何ですか？
  choices:
    A: ルームミラーを確認する。
    B: サイドミラーを確認する。
    C: 車線変更の前に首を振って目視する。
    D: 車両のバックカメラに頼る。
  answer: C
  explanation: 左後方と右後方のエリアは死角です。車線変更の前には必ず首を振って目視で確認してください。
- id: 174
  category: defensive_driving
  question: 右側に駐車車両があり、左側に対向車がいる道路を走行している場合、最善の行動は何ですか？
  choices:
    A: 対向車を避けるため、駐車車両に近づいて走行する。
    B: ドアが開くのを避けるため、対向車に近づいて走行する。
    C: 危険を早く通り過ぎるために加速する。
    D: 減速し、対向車と駐車車両の中間を通るように運転する。
  answer: D
  explanation: 右側に駐車車両があり、左側に対向車がある場合は、減速して両者の間の中間コースを取る「差を分ける（split the difference）」のが最善の方法です。
- id: 175
  category: driver_responsibility
  question: ペンシルベニア州における16歳および17歳のドライバーが関与する4つの主な事故類型のうち、次のどれが該当しますか？
  choices:
    A: 側面接触事故（サイドスワイプ）
    B: 静止物への衝突
    C: 駐車車両への後退時の衝突
    D: 横転事故
  answer: B
  explanation: 初心者ドライバーの主な事故類型には、1) 静止物への衝突、2) 交差点での事故、3) 追突事故、4) 正面衝突事故の4つがあります。
- id: 176
  category: safe_driving_rules
  question: 次の条件のうち、通常よりも長い車間距離を空けるべきなのはどれですか？
  choices:
    A: 舗装したての道路を走行しているとき。
    B: オートバイの後ろを走行しているとき。
    C: 下り坂を走行しているとき。
    D: 左車線を走行しているとき。
  answer: C
  explanation: 下り坂を走行しているときは、特に高速走行時にブレーキで車両を減速させることが難しくなるため、通常よりも長い車間距離を空ける必要があります。
- id: 177
  category: defensive_driving
  question: 回避経路として車両の少なくとも片側に最低8フィート（約2.4メートル）のスペースがない場合、どうすべきですか？
  choices:
    A: すぐに左車線に移動する。
    B: 車間距離を伸ばして、前方により多くのスペースを確保する。
    C: 他のドライバーに警告するためにクラクションを鳴らす。
    D: 制限されたエリアから抜け出すために加速する。
  answer: B
  explanation: 回避経路として車両の少なくとも片側に最低8フィートのスペースがない場合は、車間距離を伸ばして前方により多くのスペースを確保する必要があります。
- id: 178
  category: sharing_the_road
  question: 視界を遮る大型車両の後ろを走行する際、なぜ前方に余分なスペースが必要なのですか？
  choices:
    A: 大型車両からの排気ガスを避けるため。
    B: 車両の周囲を見渡すための余分なスペースを確保するため。
    C: 大型車両は乗用車よりも速く走行するため。
    D: 大型車両のブレーキランプの方が明るいため。
  answer: B
  explanation: 前方の視界を遮る大型車両の後ろを走行する際は、その車両の周囲を見渡すための余分なスペースが必要なため、車間距離を長く取る必要があります。
- id: 179
  category: defensive_driving
  question: 交差点で交差する道路の視界が建物、低木、または駐車車両によって遮られている場合、どうすべきですか？
  choices:
    A: クラクションを鳴らし、通常の速度で進む。
    B: 他の車両が動き出すのを待ち、その後をついていく。
    C: はっきりと見えるようになるまでゆっくりと前進する。
    D: 直進せずに右折する。
  answer: C
  explanation: 交差する道路の視界が建物、低木、または駐車車両によって遮られている場合は、はっきりと見えるようになるまでゆっくりと前進してください。
- id: 180
  category: safe_driving_rules
  question: 他のドライバーの死角を走行しないようにするための良いルールは何ですか？
  choices:
    A: 他の車両の斜め後ろを長時間走行する。
    B: 他のドライバーに自分の存在を知らせるため、死角にとどまる。
    C: 加速するか減速して、そのドライバーの死角から外れる。
    D: 死角にいる間、ハイビームを連続して点滅させる。
  answer: C
  explanation: 他の車両の左右の斜め後ろを長時間走行することは避けてください。加速するか減速して、相手のドライバーの死角から外れるようにしましょう。
- id: 181
  category: safe_driving_rules
  question: 安全な車間距離を保っているかを確認するにはどうすればよいですか？
  choices:
    A: 車の長さで距離を推定する。
    B: 前方の車両が道路脇の目印を通過するのを確認し、自分がそこに到達するまでの秒数を数える。
    C: スピードメーターを見て、速度を2で割る。
    D: 前方の車両がブレーキをかけるのを待ち、自分が反応するまでにかかる時間を確認する。
  answer: B
  explanation: 車間距離を確認するには、前方の車両のリアバンパーが道路脇の目印を通過するのを確認し、自分が同じ地点に到達するまでに何秒かかるか数え始めてください。
- id: 182
  category: sharing_the_road
  question: スクールバス、タクシー、または危険物を輸送するトラックの後ろを走る際、車間距離を長く取るべきなのはなぜですか？
  choices:
    A: それらの車両は低い制限速度で走行することが義務付けられているため。
    B: 踏切などで予期せぬ停止をすることがあるため。
    C: 他の車両よりも死角が大きいため。
    D: 坂道で後退する可能性が高いため。
  answer: B
  explanation: これらの車両は踏切で停止しなければならず、またその他の予期せぬ停止をする可能性があるため、車間距離を長く取る必要があります。
- id: 183
  category: defensive_driving
  question: 他の車両を追い越す際、できるだけ素早く安全に相手の死角を通り過ぎるべきなのはなぜですか？
  choices:
    A: 相手のドライバーが加速するのを防ぐため。
    B: 死角内を5秒以上走行することは違法であるため。
    C: 死角に留まる時間が長いほど、両者が危険にさらされる時間が長くなるため。
    D: 他の車両のスリップストリームに巻き込まれるのを避けるため。
  answer: C
  explanation: 他の車両を追い越す際は、できるだけ素早く安全に相手の死角を通り過ぎてください。死角に留まる時間が長いほど、両者が危険にさらされる時間が長くなります。
- id: 184
  category: defensive_driving
  question: 車線を変更する際、自車の死角をどのように確認すべきですか？
  choices:
    A: バックミラー（ルームミラー）だけに頼る。
    B: 左肩と右肩越しに目視で確認する。
    C: 車両の後退用センサーに頼る。
    D: サイドミラーを少なくとも5秒間確認する。
  answer: B
  explanation: マニュアルには次のように記載されています。「ミラーやセンサーだけに頼らず、左肩と右肩越しに目視して、自車の死角に誰もいないことを確認してください。」
- id: 185
  category: safe_driving_rules
  question: 車を後退（バック）させる準備をする際、最初にすべきことは何ですか？
  choices:
    A: 非常点滅表示灯（ハザードランプ）をつける。
    B: クラクションを2回鳴らす。
    C: 車に乗り込む前に、車両の後方を確認する。
    D: バックミラーを下向きに調整する。
  answer: C
  explanation: マニュアルによると、「後退する際は、常に車両の後方を確認してください。車に乗り込む前に行ってください。運転席からは子供や小さな物体は見えにくいものです。」
- id: 186
  category: safe_driving_rules
  question: ペンシルベニア州における最高速度制限は何マイル（mph）ですか？
  choices:
    A: 55 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: マニュアルには「ペンシルベニア州の最高速度制限は70マイルである」と明記されています。
- id: 187
  category: vehicle_information
  question: 時速60マイル（mph）以上での走行は、車両の燃料消費にどのような影響を与えますか？
  choices:
    A: 燃料消費が10%減少する。
    B: 時速60マイルを超えて5マイル加速するごとに、燃料消費が約5%増加する。
    C: 燃料消費に影響はない。
    D: 時速60マイルを超えて10マイル加速するごとに、燃料消費が20%増加する。
  answer: B
  explanation: エコドライブのセクションで、マニュアルは次のように説明しています。「時速60マイルを超えて5マイル走行するごとに、燃料消費は約5%増加します。」
- id: 188
  category: vehicle_information
  question: 燃費を向上させるために、マニュアルでは車のエアコンをいつ使用することを推奨していますか？
  choices:
    A: 渋滞の中を走行している時のみ。
    B: 時速40マイル（mph）以上で走行している時。
    C: 時速30マイル（mph）未満で走行している時。
    D: 一日の中で最も暑い時間帯のみ。
  answer: B
  explanation: エコドライブのヒントでは、「涼しさを保つこと。時速40マイル以上で走行する際は、車のエアコンを使用してください」と推奨されています。
- id: 189
  category: defensive_driving
  question: 夜間の交通事故死亡率は、日中と比較してどうなっていますか？
  choices:
    A: ほぼ同じである。
    B: 2倍高い。
    C: 3倍から4倍高い。
    D: 交通量が少ないため、わずかに低い。
  answer: C
  explanation: マニュアルには次のように記載されています。「全体として、夜間の交通事故死亡率は日中の3倍から4倍高くなっています。」
- id: 190
  category: safe_driving_rules
  question: ペンシルベニア州法で、ヘッドライトの使用が義務付けられているのはどのような時ですか？
  choices:
    A: 州間高速道路を走行している時。
    B: 天候により、ワイパーを継続的または断続的に使用している時。
    C: 時速55マイル（mph）以上で走行している時。
    D: スクールゾーンから10マイル以内にいる時。
  answer: B
  explanation: 州法では、ドライバーに対し「天候状況により車両のワイパーを継続的または断続的に使用している時はいつでも」ヘッドライトを使用することを義務付けています。
- id: 191
  category: safe_driving_rules
  question: 霧、雪、大雨などの悪天候時に走行する場合、どのヘッドライトを使用すべきですか？
  choices:
    A: ハイビーム
    B: ロービーム
    C: パーキングライト（駐停車灯）のみ
    D: デイタイム・ランニング・ライト（昼間点灯灯）のみ
  answer: B
  explanation: マニュアルには次のように記載されています。「悪天候時にはロービームのみを使用してください。このような状況下では、ハイビームはかえって視界を悪くします。」
- id: 192
  category: safe_driving_rules
  question: ハイウェイで歩行者や車両を少なくとも何フィート先まで確認できない場合、ヘッドライトを点灯しなければなりませんか？
  choices:
    A: 250フィート先
    B: 500フィート先
    C: 1,000フィート先
    D: 1,500フィート先
  answer: C
  explanation: 州法では、運転者が「操作している車両の1,000フィート前方にある歩行者や車両を確認できない場合」にヘッドライトを使用することを義務付けています。
- id: 193
  category: safe_driving_rules
  question: ペンシルベニア州法に従い、ハイビームからロービームに切り替えなければならないのはいつですか？
  choices:
    A: 対向車から1,000フィート以内、および前走車から500フィート以内に近づいたとき。
    B: 対向車から500フィート以内、および前走車から300フィート以内に近づいたとき。
    C: 対向車から300フィート以内、および前走車から100フィート以内に近づいたとき。
    D: 相手のドライバーがヘッドライトを点滅させて合図してきたときのみ。
  answer: B
  explanation: マニュアルには次のように記載されています。「ペンシルベニア州法では、対向車から500フィート以内、および前走車の後方300フィート以内を走行する場合は、常にロービームを使用することが義務付けられています。」
- id: 194
  category: defensive_driving
  question: 対向車がハイビームをロービームに切り替えない場合、どうすべきですか？
  choices:
    A: 相手のドライバーを懲らしめるために、自分のハイビームを点灯する。
    B: 道路の右側を見る。
    C: 距離を判断するために、対向車のヘッドライトを直視する。
    D: 車両が通り過ぎるまで、一時的に目を閉じる。
  answer: B
  explanation: マニュアルでは次のようにアドバイスしています。「相手のドライバーがライトを減光しない場合は、道路の右側を見てください。これにより、対向車のヘッドライトで目がくらむ（幻惑される）のを防ぐことができます。」
- id: 195
  category: defensive_driving
  question: 夜間の暗い道路でロービームを使用する際、「ヘッドライトの照射距離を超えた速度での走行（overdriving your headlights）」を避けるためには、時速何マイル以上で運転すべきではありませんか？
  choices:
    A: 時速35マイル
    B: 時速45マイル
    C: 時速55マイル
    D: 時速65マイル
  answer: B
  explanation: マニュアルでは、ロービームの照射距離は約250フィート先までであり、「夜間の暗い道路でヘッドライトの照射距離を超えた速度での走行を避けるためには、時速45マイル（45
    mph）以上で運転すべきではない」と説明されています。
- id: 196
  category: defensive_driving
  question: 雨天時、路面が最も滑りやすくなるのは通常いつですか？
  choices:
    A: 1時間以上雨が降り続いた後。
    B: 雨が降り始めてからの最初の10〜15分間。
    C: 雨が止んで路面が乾き始めたときのみ。
    D: 時速60マイル以上の速度で走行しているとき。
  answer: B
  explanation: 路面状況のセクションによると、「路面は雨が降り始めてからの最初の10〜15分間で非常に滑りやすくなることがあります。」
- id: 197
  category: defensive_driving
  question: 寒冷で湿った天候の際、木や建物の日陰になっている道路区間の走行に特に注意が必要なのはなぜですか？
  choices:
    A: 野生動物が道路に集まりやすいため。
    B: 深い水たまりができやすいため。
    C: これらの場所は凍結しやすく、最後まで乾かないため。
    D: オイルが路面に浮き上がりやすくなるため。
  answer: C
  explanation: マニュアルには、寒冷で湿った天候では、木や建物の日陰になっている道路区間は凍結しやすく、乾くのが最も遅いため、走行には細心の注意を払う必要があると記載されています。
- id: 198
  category: safe_driving_rules
  question: 水深がわずか1/10インチの場合、車両がハイドロプレーニング現象を起こし始める可能性がある速度はどれくらいですか？
  choices:
    A: 時速25マイル
    B: 時速35マイル
    C: 時速45マイル
    D: 時速55マイル
  answer: B
  explanation: マニュアルには、水深がわずか1/10インチであっても、時速35マイル（35 mph）という低速でハイドロプレーニング現象が発生する可能性があると記されています。
- id: 199
  category: defensive_driving
  question: ハイドロプレーニング現象が起きたことに気づいたとき、まず最初にすべきことは何ですか？
  choices:
    A: 車両を止めるために、すぐに急ブレーキを踏む。
    B: トラクションを回復させるために、ハンドルを急に切る。
    C: 両手でハンドルを握り、ゆっくりとアクセルペダルから足を離す。
    D: ギアをニュートラルに入れ、トラクションが戻るまで惰性で走行する。
  answer: C
  explanation: ハイドロプレーニング現象が起きた場合、マニュアルでは、両手でハンドルをしっかりと握り、ゆっくりとアクセルペダルから足を離して減速するように指示しています。
- id: 200
  category: safe_driving_rules
  question: 気温が華氏32度（32°F）付近のときに運転するのが非常に危険なのはなぜですか？
  choices:
    A: ブラックアイスはこの温度でしか形成されないため。
    B: 降水が雨やみぞれに変わり、氷の上に薄い水の層ができることで、氷単体よりも滑りやすくなるため。
    C: 車両のアンチロック・ブレーキ（ABS）が正常に機能しなくなるため。
    D: フロントガラスの洗浄液が接触した瞬間に凍結する可能性が高いため。
  answer: B
  explanation: マニュアルには、華氏32度（約摂氏0度）付近で降水が雨やみぞれに変わる際、氷の上に薄い水の層ができると氷単体よりも滑りやすくなるため、非常に危険であると記載されています。
- id: 201
  category: defensive_driving
  question: 路面上の「ブラックアイス」の存在をどのように特定できますか？
  choices:
    A: 道路が濡れているように見えるが、他の車両のタイヤから水しぶきが上がっていない
    B: 路面が異常に白く、質感があるように見える
    C: タイヤから大きなバリバリという音が聞こえる
    D: 路肩に急速に水たまりができ始める
  answer: A
  explanation: マニュアルによると、道路が濡れているように見えるのに他の車両のタイヤから水しぶきが上がっていない場合、「ブラックアイス」が発生している可能性があります。
- id: 202
  category: penalties_and_points
  question: 走行中の車両から雪や氷が落下し、他人に死亡または重傷を負わせた場合の罰則は何ですか？
  choices:
    A: 50ドルから100ドルの罰金
    B: 違反1回につき200ドルから1,000ドルの罰金
    C: 直ちに1年間の免許停止
    D: 30日間の義務的な禁錮刑
  answer: B
  explanation: 2006年7月10日に施行された法律に基づき、雪や氷が落下した車両の運転者は、それが原因で死亡または重傷を負わせた場合、違反1回につき200ドルから1,000ドルの罰金が科せられます。
- id: 203
  category: safe_driving_rules
  question: 濡れた路面を走行する際、車間距離をどのように調整すべきですか？
  choices:
    A: 標準的な3秒の車間距離を維持する
    B: 車間距離を5秒または6秒に広げる
    C: 通常よりも約10倍のスペースを空ける
    D: 前方車両の走行跡を走るために車間距離を詰める
  answer: B
  explanation: 路面が滑りやすくなっている場合、マニュアルでは濡れた路面では速度を時速5〜10マイル（mph）落とし、車間距離を5秒または6秒に広げることを推奨しています。
- id: 204
  category: vehicle_information
  question: 滑りやすい路面を走行する際、なぜクルーズコントロールの使用を避けるべきなのですか？
  choices:
    A: 寒い時期には車両のバッテリーの消耗が早くなるため
    B: アンチロック・ブレーキ・システム（ABS）が無効になるため
    C: 車輪が空転し始めた場合でも動力を供給し続け、コントロールの回復を妨げるため
    D: トラクションが低いときにエンジンがオーバーヒートする原因となるため
  answer: C
  explanation: マニュアルでは、滑りやすい路面でクルーズコントロールを使用しないよう警告しています。車輪の空転が発生した場合、作動中のクルーズコントロールシステムは動力を供給し続けるため、車輪が空転し続け、コントロールを回復できなくなるからです。
- id: 205
  category: defensive_driving
  question: 凍結した路面や積雪路で交差点に近づく際の推奨されるテクニックは何ですか？
  choices:
    A: 信号が変わる前に交差点を通過できるよう素早く加速する
    B: 停止線に近づく際にブレーキを素早くポンピングする
    C: ニュートラルに入れ、非常ブレーキをかける
    D: 信号が青になり前方の車両が動き出すまで、車両を惰性で走らせて到着時間を調整する
  answer: D
  explanation: 凍結した路面や積雪路では、停止して再発進（加速）する必要がないよう、信号が青になり前方の車両が動き出すまで車両を惰性で走らせて、交差点への到着時間を調整することがマニュアルで推奨されています。
- id: 206
  category: safe_driving_rules
  question: 濃霧に巻き込まれ、視界が効かなくなった場合はどうすべきですか？
  choices:
    A: ハイビームを点灯し、ゆっくり走行を続ける
    B: 道路から完全に外れた場所に停車し、ハザードランプを点灯させ、シートベルトを締めたままにする
    C: 車線の中央で停止し、霧が晴れるのを待つ
    D: 大型トラックのすぐ後ろを走り、そのテールランプをガイドにする
  answer: B
  explanation: 濃霧に巻き込まれた場合、マニュアルでは道路から完全に外れた場所（できれば駐車場など）に停車し、ハザードランプを点灯させ、シートベルトを締めたままにすることが最善であると述べられています。
- id: 207
  category: vehicle_information
  question: 霧の中を走行する際、なぜハイビームを使用してはいけないのですか？
  choices:
    A: 車両のバッテリーを過度に消耗させるため
    B: 光が霧の中に上向きに照射され、それが反射して目に入り、眩しさを引き起こすため
    C: 日中の使用が法律で禁止されているため
    D: ワイパーが自動的に停止してしまうため
  answer: B
  explanation: マニュアルでは、霧の中でハイビームを使用しないよう明記されています。ハイビームは光を上方の霧の中に照射するため、その光が反射して目に戻り、眩しさを生じさせて視界を悪くするからです。
- id: 208
  category: safe_driving_rules
  question: 汚れたヘッドライトは、光量をどの程度低下させる可能性がありますか？
  choices:
    A: 10パーセント
    B: 25パーセント
    C: 50パーセント以上
    D: 最大75パーセント
  answer: C
  explanation: 積雪時の車両の除雪について説明する際、マニュアルでは汚れたヘッドライトは光量を50パーセント以上低下させると指摘しています。
- id: 209
  category: safe_driving_rules
  question: 降雪時の日中に走行する場合、なぜロービームを点灯すべきなのですか？
  choices:
    A: ヘッドライトに付着した雪を溶かすため
    B: 他のドライバーからの視認性を高めるため
    C: 車両のデフロスターシステムを作動させるため
    D: バッテリーの凍結を防ぐため
  answer: B
  explanation: マニュアルでは、降雪時の日中であってもロービームを点灯することを推奨しています。これにより、他のドライバーからの視認性が高まるためです。
- id: 210
  category: defensive_driving
  question: 走行中にスノー・スコール（局地的な激しい雪）に遭遇した場合、どのような行動をとるべきですか？
  choices:
    A: 直ちにブレーキを強く踏んで停止する
    B: できるだけ早くスコールを抜けるために加速する
    C: 徐々に減速し、ハザードランプを点灯させて細心の注意を払う
    D: 激しい雪を突き抜けるためにハイビームを点灯する
  answer: C
  explanation: マニュアルでは、スノー・スコールに遭遇した場合は、徐々に減速し、視認性を高めるためにハザードランプを点灯させて細心の注意を払うよう助言しており、特に急ブレーキをかけないよう警告しています。
- id: 211
  category: penalties_and_points
  question: ワイパーを連続的または断続的に使用している際に、ヘッドライトを点灯しなかった場合の、手数料を含むおおよその罰金総額はいくらですか？
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: C
  explanation: マニュアルによると、ヘッドライト/ワイパー法に従わない運転者は25ドルの罰金が科せられますが、手数料やその他の関連費用を含めると、罰金総額は100ドル近くになります。
- id: 212
  category: safe_driving_rules
  question: フロントガラスのワイパーを連続的または断続的に使用する必要がある天候下で運転する場合、他に何をしなければなりませんか？
  choices:
    A: ハイビームを点灯する。
    B: ヘッドライトとテールランプを点灯する。
    C: デイタイム・ランニング・ライト（昼間走行灯）のみに頼る。
    D: ハザードランプを点灯する。
  answer: B
  explanation: 法律により、天候のためにワイパーを使用しているときは常にヘッドライトを点灯することが義務付けられています。デイタイム・ランニング・ライト（昼間走行灯）だけでは不十分であり、テールランプも点灯させる必要があります。
- id: 213
  category: safe_driving_rules
  question: 緊急現場や故障車を回収中のレッカー車に接近しており、隣接していない車線に移動できない場合は、どうしなければなりませんか？
  choices:
    A: 直ちに車両を停止させる。
    B: 掲示されている制限速度より少なくとも時速20マイル（20 mph）減速する。
    C: 速度を維持したままハザードランプを点灯する。
    D: クラクションを鳴らして緊急作業員に知らせる。
  answer: B
  explanation: 緊急現場、警察の停車車両、またはレッカー車に接近する際は、隣接していない車線に移動しなければなりません。移動できない場合は、掲示されている制限速度より少なくとも時速20マイル（20
    mph）減速する必要があります。
- id: 214
  category: defensive_driving
  question: 右側に自転車、同時に前方から対向車が接近している状況では、どのように対処すべきですか？
  choices:
    A: 対向車が来る前に自転車を追い越すために加速する。
    B: 左車線に移動し、対向車を強制的に減速させる。
    C: 自転車が道路から外れるようにクラクションを鳴らす。
    D: 減速して対向車を通過させ、その後左に寄って自転車を追い越す。
  answer: D
  explanation: このような状況では、一度に一つの交通状況にのみ対処するようにすべきです。減速して対向車を通過させ、その後、十分なスペースを空けて左側に移動し、自転車を追い越します。
- id: 215
  category: signs_and_signals
  question: 車両の後部に表示されているオレンジ色の三角形は何を示していますか？
  choices:
    A: その車両が危険物を運搬していること。
    B: その車両が時速25マイル（25 mph）以下で走行するように設計されていること。
    C: その車両が故障しており、レッカー車を待っていること。
    D: その車両が幅広の積載物を運んでいること。
  answer: B
  explanation: 農村地域では、時速25マイル（25 mph）以下で走行するように設計された農用トラクターや馬車などの後部にオレンジ色の三角形が表示されます。
- id: 216
  category: defensive_driving
  question: 後続車が予想しない場所でブレーキをかけることを伝えるには、どうすればよいですか？
  choices:
    A: ハザードランプを点灯する。
    B: 減速の手信号を使う。
    C: ブレーキペダルを素早く3、4回軽く踏む。
    D: クラクションを2回鳴らす。
  answer: C
  explanation: 他のドライバーが予想しない場所でブレーキをかける場合は、マニュアルに従い、ブレーキペダルを素早く3、4回軽く踏んで警告することが推奨されています。
- id: 217
  category: safe_driving_rules
  question: アクセス制限のある高速道路（自動車専用道路）で、ハザードランプを使用しなければならないのはどのような時ですか？
  choices:
    A: 時速40マイル（40 mph）未満で走行している時。
    B: 左車線を走行している時。
    C: 大型トラックを追い越している時。
    D: 料金所に接近している時。
  answer: A
  explanation: アクセス制限のある高速道路で時速40マイル（40 mph）未満で走行しなければならない場合は、後続車に警告するためにハザードランプを使用しなければなりません。
- id: 218
  category: safe_driving_rules
  question: ペンシルベニア州法では、時速35マイル（35 mph）以上で走行している場合、曲がる何フィート前までに方向指示器（ウィンカー）を出さなければなりませんか？
  choices:
    A: 少なくとも50フィート前
    B: 少なくとも100フィート前
    C: 少なくとも200フィート前
    D: 少なくとも300フィート前
  answer: D
  explanation: 時速35マイル（35 mph）以上で走行している場合、ペンシルベニア州法では曲がる少なくとも300フィート前に合図を出すことが義務付けられています。
- id: 219
  category: safe_driving_rules
  question: 時速35マイル（35 mph）未満で走行している場合、曲がる何フィート前に方向指示器（ウィンカー）を出さなければなりませんか？
  choices:
    A: 少なくとも50フィート前
    B: 少なくとも100フィート前
    C: 少なくとも200フィート前
    D: 少なくとも300フィート前
  answer: B
  explanation: ペンシルベニア州法では、時速35マイル（35 mph）未満で走行している場合、曲がる少なくとも100フィート前に必ず方向指示器（ウィンカー）を使用しなければなりません。
- id: 220
  category: defensive_driving
  question: 高速道路で車両が故障し、路肩に寄せてハザードランプを点灯させた後、車両が故障していることを他のドライバーに知らせるために、他に何をすべきですか？
  choices:
    A: 車道に立って腕を振る。
    B: ボンネットを上げる。
    C: クラクションを鳴らし続ける。
    D: 屋根の上にオレンジ色の三角形を置く。
  answer: B
  explanation: 車両が故障した場合は、路肩に寄せ、ハザードランプを点灯させ、ボンネットを上げて、他のドライバーに車両が故障していることを知らせる必要があります。
- id: 221
  category: safe_driving_rules
  question: マニュアルによると、右左折をする際に集中すべき最も重要な要素はおそらく何ですか？
  choices:
    A: 車両の大きさ
    B: 速度
    C: 路面の種類
    D: 時間帯
  answer: B
  explanation: マニュアルには次のように記載されています。「速度はおそらく最も重要な要素です。右左折するときは、車両の制御を維持できる速度まで減速してください...」
- id: 222
  category: safe_driving_rules
  question: 進みたい方向に複数の車線があるハイウェイに右左折して入る場合、どの車線に入るべきですか？
  choices:
    A: 中央の車線
    B: 最も遠い車線
    C: その方向に進む車線のうち、最も近い車線
    D: その時点で空いている任意の車線
  answer: C
  explanation: 進みたい方向に複数の車線があるハイウェイに右左折して入る場合は、その方向に進む車線のうち、最も近い車線に入ってください。
- id: 223
  category: signs_and_signals
  question: 両側が外側の実線と内側の破線でマークされた、双方向道路の中央にある車線は何のためにのみ使用できますか？
  choices:
    A: 低速車両の追い越し
    B: 左折
    C: 右折
    D: 緊急停車
  answer: B
  explanation: 両側が2本の線（外側の実線1本と内側の破線1本）でマークされた双方向道路の中央にある車線は、左折（米国では対向車線を横切る左折）のためにのみ使用できることを意味します。
- id: 224
  category: safe_driving_rules
  question: 中央左折車線を安全に使用するための正しいガイドラインは次のうちどれですか？
  choices:
    A: 場所を確保するために、できるだけ早く車線に入る。
    B: 交通を遮断するために、車両の後部を走行車線に残しておく。
    C: 交通を妨げないよう、完全に車線に入る。
    D: 入る前に右方向指示器を出す。
  answer: C
  explanation: 中央左折車線に入るときは、完全に中に入らなければなりません。車両の後部が通常の走行車線にはみ出して、交通を妨げないようにしてください。
- id: 225
  category: defensive_driving
  question: 「雪のスコール警報（Snow Squall Warning）」が発令された場合、特定の道路における危険な雪のスコールは通常どのくらい続きますか？
  choices:
    A: 45分未満
    B: 1〜2時間
    C: 3〜4時間
    D: 丸一日
  answer: A
  explanation: 国立気象局（National Weather Service）は、スコールが大きな影響を及ぼす可能性のある特定の道路に対して雪のスコール警報を発令しますが、通常、1つの道路につき45分未満続きます。
- id: 226
  category: safe_driving_rules
  question: 右左折をする何秒前に方向指示器（ウィンカー）を出すべきですか？
  choices:
    A: 1〜2秒前
    B: 3〜4秒前
    C: 5〜6秒前
    D: 10秒前
  answer: B
  explanation: 安全に右左折を完了するために、マニュアルでは右左折の3〜4秒前に合図を出さなければならないとされています。
- id: 227
  category: safe_driving_rules
  question: Uターンをする場所を選ぶ際、全方向から来るドライバーがあなたをはっきりと確認できるように、どのくらいの距離が離れている必要がありますか？
  choices:
    A: 少なくとも100フィート
    B: 少なくとも250フィート
    C: 少なくとも500フィート
    D: 少なくとも1,000フィート
  answer: C
  explanation: Uターンをする場所を選ぶ際は、全方向から来るドライバーがあなたから少なくとも500フィート離れており、あなたの姿をはっきりと確認できることを確認する必要があります。
- id: 228
  category: defensive_driving
  question: 道路を横断する際、道路の途中で停車しても安全だとみなされるのはどのような場合ですか？
  choices:
    A: 交差点の中央に一時停止の標識がある場合
    B: 交差する交通が低速で動いている場合
    C: 車両全体を収容できる十分な大きさの中央分離帯の右左折車線がある場合
    D: 信号は青だが交通が渋滞している場合はいつでも
  answer: C
  explanation: 道路の途中で停車するのが安全なのは、車両全体を収容できる十分な大きさの右左折車線が中央分離帯に設けられている場合に限られます。
- id: 229
  category: defensive_driving
  question: 道路を横断しようと待っているときに、近づいてくる車両が方向指示器を出している場合、最も安全な行動は何ですか？
  choices:
    A: 車両は確実に曲がるので、すぐに発進する。
    B: 相手のドライバーが実際に曲がり始めるまで待ってから進む。
    C: 横断することを知らせるためにクラクションを鳴らす。
    D: 交差点に到達する前に横断できるよう、素早く加速する。
  answer: B
  explanation: 方向指示器を出して近づいてくる車両の前には飛び出さないでください。ドライバーが考えを変えたか、合図を消し忘れている可能性があります。相手のドライバーが実際に曲がり始めるまで待ってから進んでください。
- id: 230
  category: safe_driving_rules
  question: ハイウェイに合流するために加速車線を使用する際、次の行為のうち違法となるのはどれですか？
  choices:
    A: 交通の流れの速度まで加速すること
    B: 交通の切れ目を探すこと
    C: 加速車線で前方の車両を追い越すこと
    D: 合流前に方向指示器を使用すること
  answer: C
  explanation: ハイウェイの入り口ランプには加速車線があることがよくあります。マニュアルには、加速車線で前方の車両を追い越すことは違法であると明記されています。
- id: 231
  category: safe_driving_rules
  question: 45 mphで2車線道路を走行中に、遅い車両を安全に追い越すためには、前方どのくらいの距離に車両がいない状態である必要がありますか？
  choices:
    A: 1/8マイル
    B: 1/4マイル
    C: 1/2マイル
    D: 1マイル
  answer: B
  explanation: 2車線道路での追い越しには的確な判断が必要です。45 mphの場合、遅い車両を安全に追い越すには、1/4マイルの前方視界（車両がいない状態）が必要です。
- id: 232
  category: safe_driving_rules
  question: 安全に追い越しを行うためには、追い越す車両よりもおよそ時速何マイル速く走行する必要がありますか？
  choices:
    A: 時速5マイル（5 mph）速く
    B: 時速10マイル（10 mph）速く
    C: 時速15マイル（15 mph）速く
    D: 時速20マイル（20 mph）速く
  answer: B
  explanation: マニュアルによると、追い越す車両よりも時速約10マイル（10 mph）速い速度で走行する必要があります。
- id: 233
  category: safe_driving_rules
  question: 次の条件のうち、他の車両を右側から追い越すことが許可されるのはどれですか？
  choices:
    A: 前方の車両が制限速度以下で走行しているとき
    B: 追い越そうとしている車両の運転手が左折中、または左折の合図を出しているとき
    C: 交差点から100フィート以内のとき
    D: 1車線道路で前方の車両が停止したとき
  answer: B
  explanation: 追い越そうとしている車両の運転手が左折中、または左折の合図を出している場合、路肩（berm or shoulder）からはみ出さない範囲で、その車両を右側から追い越すことができます。
- id: 234
  category: safe_driving_rules
  question: 交差点や踏切から何フィート以内の場所では、他の車両を追い越してはいけませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: B
  explanation: 公式の交通管制装置による指示がない限り、交差点や踏切の100フィート以内、またはそれらを通過中に追い越しをすることは禁止されています。
- id: 235
  category: safe_driving_rules
  question: 車両を追い越した後、元の車線に戻っても安全であるとどのように判断しますか？
  choices:
    A: 追い越した車両の1台分前方に達したとき
    B: 追い越された車両の運転手がヘッドライトを点滅させたとき
    C: 追い越した車両の両方のヘッドライトがバックミラー越しに見えたとき
    D: 追い越しから3秒が経過したとき
  answer: C
  explanation: 車線に戻る前に、追い越した車両の前面にある両方のヘッドライトが、自分の車のバックミラー（ルームミラー）で見えることを確認してください。
- id: 236
  category: safe_driving_rules
  question: 円形交差点（ラウンドアバウト）では、誰が優先権を譲らなければなりませんか？
  choices:
    A: すでに円内にいる運転手が、進入してくる運転手に譲る。
    B: 円内に進入する運転手が、すでに円内にいる運転手に譲る。
    C: 右側から進入する運転手が、左側から進入する運転手に譲る。
    D: すべての運転手が停止し、右側の車両に譲る。
  answer: B
  explanation: 円形交差点（ラウンドアバウト）に進入する運転手は、すでに円内を走行している運転手に優先権を譲らなければなりません。
- id: 237
  category: safe_driving_rules
  question: 直進したいのに、誤って右左折専用車線に入ってしまった場合、どうしなければなりませんか？
  choices:
    A: 停止し、交通が途切れるのを待ってから直進車線に合流する。
    B: 注意深くそのまま交差点を直進する。
    C: そのまま右左折しなければならない。
    D: 車をバックさせて車線変更する。
  answer: C
  explanation: 直進したい場合でも、誤って右左折専用車線に入ってしまったときは、その車線の指示通りに曲がらなければなりません。
- id: 238
  category: safe_driving_rules
  question: 二重左折車線から左折する場合、曲がっている最中に車線変更をしてはいけないのはなぜですか？
  choices:
    A: 隣で曲がっている車両と衝突する原因になるため。
    B: 交差点内で方向指示器を使用することは違法であるため。
    C: ジャグハンドル（jughandle）への進入を強制されるため。
    D: 対向車に対する優先権を失うため。
  answer: A
  explanation: マニュアルには、二重左折車線から左折する際に車線変更をしてはならないと記されています。これは、隣で同時に曲がっている車両と衝突する危険があるためです。
- id: 239
  category: driver_responsibility
  question: ペンシルベニア州における16歳の運転手が関与する事故の3分の1以上において、その10代の運転手は何をしていましたか？
  choices:
    A: 左カーブでスピードを出しすぎていた。
    B: 一時停止標識から発進した、または対向車線を横切って左折した。
    C: ラウンドアバウトで優先権を譲らなかった。
    D: 交差点で自転車を追い越した。
  answer: B
  explanation: 交差点は、10代の運転手の事故発生率が高い場所です。これらの事故の3分の1以上において、10代の運転手は一時停止標識からの発進、または対向車線を横切る左折を行っていました。
- id: 240
  category: safe_driving_rules
  question: 中央分離帯のある幹線道路（分割ハイウェイ）へ左折して進入する際の正しい手順は何ですか？
  choices:
    A: 中央で止まらずに、両方の車線を一度に横切る。
    B: 最初に差し掛かった車線へ左折して入る。
    C: 最初の車線を安全なときに横切り、分離帯の反対側で2番目の車線の交通に安全な隙間ができるのを待ってから左折する。
    D: 道路の左側にあるジャグハンドル（jughandle）に入る。
  answer: C
  explanation: 中央分離帯のある幹線道路へ正しく左折するには、まず最初の車線に安全な隙間があるときにそこを横切り、次に分離帯の反対側で、2番目の車線の交通に安全な隙間ができるのを待ってから左折します。
- id: 241
  category: defensive_driving
  question: 30 mphの道路で、2方向一時停止標識（two-way stop sign）のある交差点を横断するには、両方向にどれくらいの車間距離（ギャップ）が必要ですか？
  choices:
    A: 3秒のギャップ
    B: 6秒のギャップ
    C: 9秒のギャップ
    D: 12秒のギャップ
  answer: B
  explanation: 2方向一時停止標識のある交差点を横断する場合、30 mphの道路を横切るには両方向に約6秒のギャップが必要です。
- id: 242
  category: defensive_driving
  question: 右折する際、左から接近してくる車両との間に、およそどれくらいのギャップを空けるべきですか？
  choices:
    A: 4秒
    B: 6秒
    C: 8秒
    D: 10秒
  answer: C
  explanation: 右折する際は、左から接近してくる車両との間に約8秒のギャップを空ける必要があります。
- id: 243
  category: safe_driving_rules
  question: 反対方向から来る左折車との「タングルターン（tangle turn：もつれ旋回）」を避けるにはどうすればよいですか？
  choices:
    A: 交差点の中心を過ぎてから曲がる。
    B: 交差点の中心にある仮想の「X」印に到達する前に曲がる。
    C: 中央線から最も遠い車線に曲がる。
    D: 他のドライバーが先に曲がり終えるまで待つ。
  answer: B
  explanation: 反対方向からの左折車との「タングルターン」を避けるには、交差点の中心に「X」印を想定し、その「X」に到達する前に曲がります。
- id: 244
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）の譲れ線（yield line）に差し掛かったとき、誰に優先権がありますか？
  choices:
    A: ラウンドアバウトに進入しようとしている車両
    B: ラウンドアバウト内を走行中の車両
    C: 右側から接近してくる車両
    D: ラウンドアバウトを出ようとしている車両
  answer: B
  explanation: ラウンドアバウトの譲れ線に差し掛かったときは、左側を見て接近してくる車両を確認しなければなりません。これは、ラウンドアバウト内を走行中の車両に優先権があるためです。
- id: 245
  category: signs_and_signals
  question: ラウンドアバウトの出口に近づく際、どの合図を出すべきですか？
  choices:
    A: 左折合図
    B: 右折合図
    C: ハザードランプ
    D: 合図は不要
  answer: B
  explanation: ラウンドアバウトの出口に近づく際は、右折合図（RIGHT TURN SIGNAL）を出さなければなりません。
- id: 246
  category: sharing_the_road
  question: ラウンドアバウト内を走行中に緊急車両が接近してきた場合、どうすべきですか？
  choices:
    A: 通過させるため、直ちにラウンドアバウト内で停止する。
    B: 緊急車両が進入する前にラウンドアバウトを出るため、加速する。
    C: 直ちにラウンドアバウトを出て、路肩に寄せる。
    D: ラウンドアバウトの中央島（センターアイランド）に寄せる。
  answer: C
  explanation: ラウンドアバウト内にいるときに緊急車両が接近してきた場合は、直ちにラウンドアバウトを出てから路肩に寄せてください。ラウンドアバウト内では決して停止してはいけません。
- id: 247
  category: sharing_the_road
  question: ラウンドアバウト内で車両として走行している自転車に関するルールは何ですか？
  choices:
    A: 歩行者用横断歩道に移動するよう、クラクションを鳴らして警告すべきである。
    B: 左側に十分なスペースがあれば、追い越してもよい。
    C: ラウンドアバウト内で車両として走行している自転車を追い越してはならない。
    D: 自転車がラウンドアバウト内で車両として走行することは禁止されている。
  answer: C
  explanation: 自転車には、ラウンドアバウト内で車両として走行する選択肢があります。自動車の運転者は、ラウンドアバウト内で車両として走行している自転車を追い越してはなりません。
- id: 248
  category: safe_driving_rules
  question: 交通量の多い商業道路にある「ジャグハンドル（jughandle）」の目的は何ですか？
  choices:
    A: 対向車線を横切らずに、主要道路と交差するようにカーブした右折車線を利用して左折できるようにするため。
    B: 物理的な障壁を越えて車両が安全にUターンできる場所を提供するため。
    C: 交差点での激しい渋滞を緊急車両が回避できるようにするため。
    D: 自転車と歩行者のための専用車線を作るため。
  answer: A
  explanation: ジャグハンドルの設計では、対向車線を直接横切って左折する代わりに、主要道路と信号機で交差するようにカーブした右折車線を利用して左折します。
- id: 249
  category: defensive_driving
  question: カーブでコントロールを維持するために減速する最適なタイミングはいつですか？
  choices:
    A: カーブに入った直後。
    B: カーブの頂点（中間地点）。
    C: カーブに入る前。
    D: カーブを出るとき。
  answer: C
  explanation: カーブでコントロールを維持するには減速が必要であり、それはカーブに入る前に行うべきです。
- id: 250
  category: defensive_driving
  question: 右カーブを安全に走行する際、車両をどこに位置させるべきですか？
  choices:
    A: 車線の中央。
    B: 車線中央よりもわずかに右側。
    C: 車線中央よりもわずかに左側。
    D: 路肩。
  answer: B
  explanation: カーブを安全に走行するためには、右カーブでは車線中央よりもわずかに右側を、左カーブでは車線の中央を走行するようにします。
- id: 251
  category: driver_responsibility
  question: ペンシルベニア州の16歳のドライバーにおいて、最も頻繁に発生する事故のタイプは何ですか？
  choices:
    A: 信号待ちでの追突事故。
    B: 分離ハイウェイでの正面衝突事故。
    C: 単独車両による道路逸脱事故。
    D: 交差点での右左折時の接触事故。
  answer: C
  explanation: マニュアルの「ティーンの事故実態（Teen Crash Fact）」によると、ペンシルベニア州の16歳のドライバーで最も多い事故のタイプは、単独車両による道路逸脱事故です。
- id: 252
  category: safe_driving_rules
  question: ハイウェイに進入する車両と退出する車両が短い「ウィービングレーン（weaving lane）」を共有しなければならない場合、どちらが優先権を譲らなければなりませんか？
  choices:
    A: ハイウェイから退出するドライバー
    B: ハイウェイに進入するドライバー
    C: より速い速度で走行しているドライバー
    D: より遅い速度で走行しているドライバー
  answer: B
  explanation: マニュアルには、ウィービングレーンを共有する場合、ハイウェイに進入する側のドライバーは、退出する側のドライバーに道を譲らなければならないと記載されています。
- id: 253
  category: safe_driving_rules
  question: ハイウェイで出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 停車し、路肩を慎重にバックする
    B: 中央分離帯を越えて方向転換する
    C: 出口に間に合わせるために、直前で車線を急変更する
    D: 次の出口まで行く
  answer: D
  explanation: 出口を通り過ぎてしまった場合は、次の出口を利用してください。停車、バック、急な車線変更、中央分離帯の横断は違法であり危険ですので、絶対に行わないでください。
- id: 254
  category: safe_driving_rules
  question: ハイウェイから退出する際、減速する適切なタイミングはいつですか？
  choices:
    A: 出口ランプの1マイル手前
    B: 車線変更をする前、まだ本線車道を走行している間
    C: 出口車線（減速車線）に入った後
    D: 出口の標識が見えたらすぐ
  answer: C
  explanation: マニュアルでは、余裕を持って適切な出口車線に入り、出口車線に移動するまでは減速しないよう指示されています。
- id: 255
  category: defensive_driving
  question: 「ハイウェイ・ヒプノシス（高速道路催眠現象）」の原因は何ですか？
  choices:
    A: 処方薬の影響下での運転
    B: 長時間、前方の道路を一点に見つめ続け、ぼんやりすること
    C: 時速65マイルを超える速度で1時間以上運転すること
    D: ミラーと道路の間を素早く交互に見ること
  answer: B
  explanation: ハイウェイ・ヒプノシスは、長時間前方の道路を一点に見つめ続け、車両の前方、後方、周囲の積極的な確認を止めてしまったときに起こります。
- id: 256
  category: safe_driving_rules
  question: 縁石のある通りで駐車する場合、車両と縁石の間の最大距離はどれくらいですか？
  choices:
    A: 6インチ
    B: 12インチ
    C: 18インチ
    D: 24インチ
  answer: B
  explanation: 縁石のある通りでは、できるだけ縁石に近づけて駐車しなければなりませんが、縁石からの距離は12インチ以内に収める必要があります。
- id: 257
  category: safe_driving_rules
  question: 車道上に駐車しなければならない場合、両方向から少なくとも何フィート先から車両が見える状態でなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: 車道上に駐車しなければならない場合は、非常点滅表示灯（ハザードランプ）を使用し、両方向から少なくとも500フィート先から車両が確認できることを確実にしてください。
- id: 258
  category: safe_driving_rules
  question: 縁石の有無にかかわらず、下り坂で駐車する場合、ハンドルをどのように切るべきですか？
  choices:
    A: 車輪を完全に左に切る
    B: 車輪を完全に右に切る
    C: 車輪を直進方向に向けたままにする
    D: 車輪を道路と平行にする
  answer: B
  explanation: 縁石の有無にかかわらず、下り坂で駐車する場合は、車輪が完全に右側を向くようにハンドルを切る必要があります。
- id: 259
  category: safe_driving_rules
  question: 消火栓から何フィート以内に駐車することは違法ですか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 30フィート
  answer: B
  explanation: 消火栓から15フィート以内の場所に車両を停車、停止、または駐車することは禁止されています。
- id: 260
  category: safe_driving_rules
  question: 道路脇にある点滅信号、一時停止標識、譲れ標識、または交通管制装置から何フィート以内に駐車してはいけませんか？
  choices:
    A: 15フィート
    B: 20フィート
    C: 30フィート
    D: 50フィート
  answer: C
  explanation: 道路脇にある点滅信号、一時停止標識、譲れ標識、または交通管制装置から30フィート以内に駐車することは違法です。
- id: 261
  category: safe_driving_rules
  question: 踏切の最も近い線路から、少なくとも何フィート離して駐車しなければなりませんか？
  choices:
    A: 少なくとも15フィート
    B: 少なくとも20フィート
    C: 少なくとも30フィート
    D: 少なくとも50フィート
  answer: D
  explanation: 踏切の最も近い線路から50フィート以内の場所に車両を停車、静止、または駐車してはいけません。
- id: 262
  category: safe_driving_rules
  question: 工事実施中の区間（アクティブ・ワークゾーン）を走行する際、何を点灯させなければなりませんか？
  choices:
    A: 非常点滅表示灯（ハザードランプ）
    B: ハイビーム（走行用前照灯）
    C: デイタイムランニングライトだけでなく、車両のヘッドライト
    D: 車内のルームランプ
  answer: C
  explanation: 法律により、工事実施中の区間を走行する際は、デイタイムランニングライトだけでなく、車両のヘッドライトを点灯させなければなりません。
- id: 263
  category: penalties_and_points
  question: 工事実施中の区間におけるスピード違反などの特定の違反に対する罰則は何ですか？
  choices:
    A: 罰金が2倍になる
    B: 罰金が3倍になる
    C: 車両が直ちに押収される
    D: 運転免許試験を再受験しなければならない
  answer: A
  explanation: 工事実施中の区間におけるスピード違反を含む特定の違反については、罰金が2倍になります。
- id: 264
  category: signs_and_signals
  question: 工事区間に接近する際、警告標識、先行警告車両、または可変情報板は、最低でもどのくらい手前に設置されることがありますか？
  choices:
    A: 最低50フィート
    B: 最低100フィート
    C: 最低200フィート
    D: 最低500フィート
  answer: C
  explanation: 警告標識、先行警告車両、または可変情報板は、工事区間の手前最低200フィートの場所に設置されることがあります。
- id: 265
  category: signs_and_signals
  question: 高速道路の入口ランプに入る際、正しい方向に進んでいることをどのように確認できますか？
  choices:
    A: 右側に黄色の線、左側に白色の線が見える
    B: 右側に白色の線、左側に黄色の線が見える
    C: ランプの両側に黄色の実線の二重線が見える
    D: ランプの両側に白色の破線が見える
  answer: B
  explanation: 高速道路の入口ランプで、右側に白色の線、左側に黄色の線が見えていれば、正しい方向に進んでいます。
- id: 266
  category: safe_driving_rules
  question: 工事区間を走行する際、車間距離についてどのようにすべきですか？
  choices:
    A: 通常の車間距離を維持する
    B: 車間距離を2倍にする
    C: 車間距離を3倍にする
    D: 車間距離を半分に縮める
  answer: B
  explanation: マニュアルでは、工事区間での最も一般的な事故は追突事故であるため、車間距離を2倍にするよう定めています。
- id: 267
  category: signs_and_signals
  question: 工事区間において、従来の交通規制装置よりも優先される権限を持つのは誰ですか？
  choices:
    A: 交通誘導員（フラッガー）
    B: 建設作業員
    C: 先導車（エスコート車両）
    D: 電光掲示板
  answer: A
  explanation: 工事区間では交通誘導員（フラッガー）に従わなければなりません。彼らの権限は、従来の信号機や標識などの交通規制装置よりも優先されます。
- id: 268
  category: defensive_driving
  question: 踏切に接近する際、どの方向に視線を向けるべきですか？
  choices:
    A: 右、左、そしてもう一度右
    B: 前方のみ
    C: 左、右、そしてもう一度左
    D: 左と右を同時に
  answer: C
  explanation: マニュアルでは、踏切の信号が点滅していなくても、接近する際は常に左、右、そしてもう一度左を確認するようアドバイスしています。
- id: 269
  category: defensive_driving
  question: 踏切内で車両が動けなくなり、列車が接近している場合、どうすべきですか？
  choices:
    A: 車内にとどまり、衝撃に備える
    B: 速やかに車を離れ、線路からできるだけ遠くへ避難する
    C: 列車が100フィートの距離に来るまで、エンジンの再始動を試みる
    D: 列車の運転士に警告するためにクラクションを鳴らす
  answer: B
  explanation: 万が一、踏切内で立ち往生し、列車が接近している場合は、直ちに車を降りて、線路からできるだけ遠くへ離れなければなりません。
- id: 270
  category: sharing_the_road
  question: 歩行者に対して、走行車線に入るよう手招き（合図）をしても安全なのはいつですか？
  choices:
    A: 横断歩道がある場所のみ
    B: 完全に停車しているとき
    C: 他に接近してくる車両がない場合のみ
    D: 歩行者を走行車線へ手招きすることは、いかなる時も安全ではない
  answer: D
  explanation: マニュアルには、特に横断歩道のない場所やブロックの中間地点などで、歩行者に走行車線へ入るよう手招きすることは、いかなる時も決して安全ではないと明記されています。
- id: 271
  category: sharing_the_road
  question: 停車中の車両に後ろから近づく際、どうすべきですか？
  choices:
    A: クラクションを鳴らし、左側から素早く追い越す
    B: 減速し、車両の前を横断している歩行者がいないことを確認するまで追い越さない
    C: 十分なスペースがある場合は、右側の路肩から追い越す
    D: ハイビームを点滅させて、追い越すことを運転者に知らせる信号を送る
  answer: B
  explanation: 停車中の車両に後ろから近づく際は、減速し、その車両の前を横断している歩行者がいないことを確認できるまで追い越してはいけません。
- id: 272
  category: sharing_the_road
  question: トラックを追い越した後、トラックの車線に戻っても安全なのはいつですか？
  choices:
    A: 自車のリアバンパーがトラックのフロントバンパーを通過してすぐ
    B: バックミラーにトラックのヘッドライトまたはフロントグリルが見えたとき
    C: トラックの運転手がヘッドライトを点滅させたとき
    D: 追い越し後の速度を5秒間維持した後
  answer: B
  explanation: トラックを追い越した後、車線変更をするのは、バックミラーにトラックのヘッドライトまたはフロントグリルが見えるようになってからにしてください。
- id: 273
  category: sharing_the_road
  question: 下り坂でトラックを追い越す際、速度を上げる必要があるかもしれないのはなぜですか？
  choices:
    A: トラックの慣性（勢い）によって、トラックの速度が上がるため
    B: トラックが追い越しを妨げるために、意図的に加速することがあるため
    C: 坂道でトラックをゆっくり追い越すことは違法であるため
    D: 下り坂では風の乱気流が強くなるため
  answer: A
  explanation: 下り坂では、トラックの慣性によって速度が上がるため、安全に追い越すために速度を上げる必要がある場合があります。
- id: 274
  category: sharing_the_road
  question: 自転車を追い越した直後に、急な減速や停止を避けるべきなのはなぜですか？
  choices:
    A: 自転車利用者がバランスを崩す原因になるため
    B: 自転車が自車に追突する可能性があるため
    C: 非電動車両の前でブレーキをかけることは違法であるため
    D: 過度な風の乱気流が発生するため
  answer: B
  explanation: 自転車を追い越した後は、急に減速したり停止したりしないでください。急停車すると、自転車が自車に衝突する恐れがあります。
- id: 275
  category: sharing_the_road
  question: オートバイやモペッド（原動機付自転車）の運転者に対して、車線内のスペースをどの程度空ける必要がありますか？
  choices:
    A: 車線の半分
    B: 車線1つ分すべて
    C: 車線の右側のみ
    D: センターラインまでの範囲で、彼らが必要とするだけのスペース
  answer: B
  explanation: 法律により、オートバイやモペッドの運転者には、車線1つ分を完全に使用することを認めなければなりません。
- id: 276
  category: sharing_the_road
  question: オートバイの方向指示器が点滅しているからといって、曲がると決めつけてはいけないのはなぜですか？
  choices:
    A: オートバイの運転者は、減速を示すために方向指示器を使うことが多いため
    B: 乗用車のように方向指示器が自動的に消えない場合があるため
    C: 点滅する信号は、オートバイに優先権があることを示しているため
    D: オートバイの運転者は、バッテリーのテストのために方向指示器を使用するため
  answer: B
  explanation: オートバイやモペッドの方向指示器は、乗用車のように自動的に消えないことがあるため、点滅しているからといって必ず曲がるとは限りません。
- id: 277
  category: sharing_the_road
  question: 大型トラックが自車を追い越しているとき、どうすべきですか？
  choices:
    A: 邪魔にならないように速度を上げる
    B: 速度を少し落とし、一定の速度を保つ
    C: トラックが早く追い越せるように急ブレーキをかける
    D: トラックの死角に移動する
  answer: B
  explanation: トラックが自車を追い越すときは、速度を少し落として一定の速度を保つようにすると、トラックの運転手が追い越しやすくなります。速度を上げてはいけません。
- id: 278
  category: safe_driving_rules
  question: 工事区間（ワークゾーン）を走行する際に守らなければならない安全規則は、次のうちどれですか？
  choices:
    A: 一定の速度を保つために、常にクルーズコントロールを使用する
    B: クルーズコントロールを使用しない
    C: 道に迷った場合は、作業員に道を尋ねるために停車する
    D: 建設機械を避けるために、実線の白線を越える
  answer: B
  explanation: マニュアルには工事区間での安全規則がいくつか記載されており、その中に「工事区間ではクルーズコントロールを使用しないこと」が含まれています。
- id: 279
  category: defensive_driving
  question: 列車との衝突事故で死亡する確率は、他の車両との事故と比較して何倍高いですか？
  choices:
    A: 10倍
    B: 20倍
    C: 30倍
    D: 40倍
  answer: D
  explanation: マニュアルによると、列車が関与する事故で死亡する確率は、他の車両との事故で死亡する確率よりも40倍高くなります。
- id: 280
  category: sharing_the_road
  question: オートバイの後ろを走行する際、推奨される最小の車間距離はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 6秒
  answer: C
  explanation: オートバイやモペッドの後ろを走る際は、他の車両と同様に4秒以上の車間距離を空ける必要があります。
- id: 281
  category: sharing_the_road
  question: 自車と対向車のトラックの間に発生する乱気流は、車両にどのような影響を与えますか？
  choices:
    A: 車両同士を引き寄せます。
    B: 車両同士を押し離します。
    C: トラックを急ブレーキさせます。
    D: 乗用車には影響を与えません。
  answer: B
  explanation: マニュアルには、「乱気流は車両を押し離すものであり、引き寄せるものではないことを覚えておいてください」と記載されています。
- id: 282
  category: sharing_the_road
  question: トラックの後方を走行している際、トラックの運転手に自車を確実に認識してもらうにはどうすればよいですか？
  choices:
    A: 自車を目立たせるためにハイビームを点灯させます。
    B: 数分おきにクラクションを鳴らします。
    C: トラックのサイドミラーが見える位置に自車を配置します。
    D: 運転手の視界に直接入るよう、トラックのすぐ後ろにぴったりとつきます（車間距離を詰める）。
  answer: C
  explanation: マニュアルには、「トラックやバスの後方を走行中、前方の車両のサイドミラーが見えない場合、その大型車両の運転手からもあなたの姿は見えていません」と記載されています。
- id: 283
  category: defensive_driving
  question: 坂道で停車する際、トラックとの間に十分な距離を空けるべきなのはなぜですか？
  choices:
    A: トラックの排気ガスがフロントガラスを傷める可能性があるため。
    B: 運転手がブレーキから足を離した際に、トラックが後退する可能性があるため。
    C: トラックが大きく回転するために余分なスペースが必要なため。
    D: トラックのエアブレーキが大きな音を出すため。
  answer: B
  explanation: マニュアルには、「坂道で停車する際は、トラックとの間に十分な距離を空けてください。運転手がブレーキから足を離した際に、トラックが後退する可能性があります」と記載されています。
- id: 284
  category: safe_driving_rules
  question: トラックの後方の死角に入らないようにするために推奨される最小の車間距離はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: C
  explanation: マニュアルには、「トラックの後方の死角に入らないようにするためには、少なくとも4秒間の車間距離が必要です...」と記載されています。
- id: 285
  category: sharing_the_road
  question: トラックが大きく右折しようとしているとき、時としてどのように見えることがありますか？
  choices:
    A: 直進または左折しようとしているように見える
    B: バックしようとしているように見える
    C: ブレーキが故障しているように見える
    D: 他の車両を追い越すために加速しているように見える
  answer: A
  explanation: マニュアルには、「トラックが実際に右折しようとしているとき、直進または左折しようとしているように見えることがあります」と記載されています。
- id: 286
  category: vehicle_information
  question: 晴天で乾燥した路面状況において、時速65マイル（約105km/h）で走行中の、良好なタイヤと適切に調整されたブレーキを備えた積載状態のトラックに必要な最小停止距離はどれくらいですか？
  choices:
    A: 200フィート
    B: 400フィート
    C: 600フィート
    D: 800フィート
  answer: C
  explanation: マニュアルには、晴天で乾燥した道路を時速65マイルで走行する積載状態のトラックが完全に停止するには、最低600フィートが必要であると記載されています。
- id: 287
  category: safe_driving_rules
  question: 長い下り坂にある緊急避難所（エスケープランプ）の目的は何ですか？
  choices:
    A: 乗用車が休憩を取るため。
    B: 警察がスピード違反車両を監視するため。
    C: 制御不能になった、またはブレーキが故障した大型車両のため。
    D: 特大貨物が後続車を通過させるため。
  answer: C
  explanation: マニュアルには、「これらのランプは、制御不能になった大型車両や、ブレーキ故障のために停止できない大型車両のみが使用するためのものです」と記載されています。
- id: 288
  category: safe_driving_rules
  question: スクールバスが赤色灯を点滅させ、停止標識（ストップアーム）を出して停車している場合、どれくらい離れた場所で停止しなければなりませんか？
  choices:
    A: 少なくとも10フィート離れた場所
    B: 少なくとも15フィート離れた場所
    C: 少なくとも20フィート離れた場所
    D: 少なくとも50フィート離れた場所
  answer: A
  explanation: マニュアルには、「スクールバスの後方にいる場合でも、同じ道路を対向してくる場合でも、バスから少なくとも10フィート離れた場所で停止しなければなりません...」と記載されています。
- id: 289
  category: safe_driving_rules
  question: 赤色灯を点滅させ、停止標識（ストップアーム）を出しているスクールバスに対して、停止する必要が「ない」のはどのような状況ですか？
  choices:
    A: バスと同じ方向に走行しているとき。
    B: バスが停車している交差点に近づいているとき。
    C: 中央分離帯のあるハイウェイの反対側を走行しているとき。
    D: 指定されたスクールゾーンを走行しているとき。
  answer: C
  explanation: マニュアルには、「スクールバスに近づいており、中央分離帯のあるハイウェイの反対側を走行している場合は、停止する必要はありません」と記載されています。
- id: 290
  category: penalties_and_points
  question: 赤色灯を点滅させ、停止標識（ストップアーム）を出しているスクールバスに対して停止しなかった場合の罰則は何ですか？
  choices:
    A: 30日間の免許停止、3点、および罰金
    B: 60日間の免許停止、5点、および罰金
    C: 90日間の免許停止、2点、および罰金
    D: 6ヶ月の免許停止、6点、および罰金
  answer: B
  explanation: マニュアルには、「赤色灯を点滅させ、停止標識（ストップアーム）を出しているスクールバスに対して停止しなかった場合、60日間の運転免許停止、運転記録への5点の加点、および罰金が科せられます」と記載されています。
- id: 291
  category: safe_driving_rules
  question: ムーブ・オーバー法（Move Over law）に基づき、緊急車両の活動エリアに隣接していない車線に移動できない場合、どうしなければなりませんか？
  choices:
    A: 緊急事態が解消されるまで、直ちに車両を停止させる。
    B: 速度を維持したまま、ハザードランプを点灯させる。
    C: 掲示されている制限速度より少なくとも時速20マイル（20 mph）低い速度まで減速する。
    D: クラクションを鳴らして、緊急作業員に自分の存在を知らせる。
  answer: C
  explanation: マニュアルには、「交通状況やその他の条件により車線を移動できない場合、運転者は掲示されている制限速度より少なくとも時速20マイル低い速度まで減速しなければならない」と記載されています。
- id: 292
  category: penalties_and_points
  question: ムーブ・オーバー法違反で有罪となった場合、運転記録に何点が加算されますか？
  choices:
    A: 2点
    B: 3点
    C: 4点
    D: 5点
  answer: A
  explanation: マニュアルには、「この法律の違反で有罪判決を受けた者は、運転記録に2点が加算される」と記載されています。
- id: 293
  category: penalties_and_points
  question: 工事区域（ワークゾーン）内で発生したムーブ・オーバー法違反を含む交通違反の罰金はどうなりますか？
  choices:
    A: 作業員がいない場合は免除される。
    B: 半分に減額される。
    C: 通常の道路と同じままである。
    D: 2倍になる。
  answer: D
  explanation: マニュアルには、「さらに、工事区域内で発生した交通違反については、罰金が2倍になる」と記載されています。
- id: 294
  category: sharing_the_road
  question: 夜間にトラックの後ろを走行する際、なぜ常にヘッドライトを減光（ロービームに）しなければならないのですか？
  choices:
    A: 明るい光は車両のバッテリーをより早く消耗させるため。
    B: 明るい光がトラックの大きなサイドミラーに反射し、トラックの運転手の目がくらんでしまうため。
    C: トラックの運転手はミラーを使って他の運転手に合図を送るため。
    D: ライトを減光することで、トラックのブレーキランプが見えやすくなるため。
  answer: B
  explanation: マニュアルには、「後続車両からの明るい光は、トラックの大きなサイドミラーに反射してトラックの運転手の目をくらませる」と記載されています。
- id: 295
  category: sharing_the_road
  question: 道路上で規格外の積載物（oversized load）を運ぶ車両に遭遇した際、どのようなことを想定すべきですか？
  choices:
    A: 彼らは常に道を譲るために路肩に寄る。
    B: 通常のトレーラーよりもはるかに速く走行する。
    C: 先導車を伴っており、黄色または白の線を越えて走行する場合がある。
    D: 夜間の走行のみが許可されている。
  answer: C
  explanation: マニュアルには、「規格外の積載車両は先導車を伴っている。その過度な幅のため、路肩の障害物によって黄色または白の線を越える可能性がある」と記載されています。
- id: 296
  category: sharing_the_road
  question: 馬車の後ろで停車する際、なぜ十分な車間距離を空ける必要があるのですか？
  choices:
    A: 停車後に後退することが多いため。
    B: 馬が車両を蹴る可能性があるため。
    C: 法律で50フィートのクリアランスが必要とされているため。
    D: 御者が安全に降りるためのスペースが必要なため。
  answer: A
  explanation: マニュアルによると、馬車は停車後に後退することが多く、車間距離が近すぎると馬車の運転手が後方の車両を確認しにくくなります。
- id: 297
  category: sharing_the_road
  question: 馬車や乗馬中の人を追い越す際、避けるべきことは何ですか？
  choices:
    A: 方向指示器を使用すること。
    B: スピードを出しすぎたり、クラクションを鳴らしたりすること。
    C: 左側から追い越すこと。
    D: 右車線に戻る前にスペースを空けること。
  answer: B
  explanation: 馬車や乗馬中の人を追い越す際は、馬を驚かせる可能性があるため、スピードを出しすぎたりクラクションを鳴らしたりしてはいけません。
- id: 298
  category: safe_driving_rules
  question: 荷台に人が乗っている場合、荷台の開いたピックアップトラックの最高速度制限は何マイルですか？
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: 荷台の開いたピックアップトラックやフラットベッドトラックは、荷台に人が乗っている場合、時速35マイル（35 mph）を超える速度で運転することはできません。
- id: 299
  category: safe_driving_rules
  question: 18歳未満の子供が荷台の開いたトラックの荷台に乗ることが法的に許可されるのは、次のうちどの条件ですか？
  choices:
    A: 学校の行事に向かうとき。
    B: 公式に承認されたパレードに参加しているとき。
    C: トラックが時速15マイル未満で走行しているとき。
    D: 荷台に大人が同伴しているとき。
  answer: B
  explanation: 18歳未満の子供が荷台の開いたトラックに乗ることを禁止する法律の例外には、公式に承認されたパレードの参加者である場合が含まれます。
- id: 300
  category: sharing_the_road
  question: 緊急車両が通過した後、その車両から最低限維持しなければならない距離はどれくらいですか？
  choices:
    A: 100フィート
    B: 250フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: マニュアルでは、緊急車両が通過した後に運転を再開する際、その車両から少なくとも500フィートの距離を保つよう指示しています。
- id: 301
  category: sharing_the_road
  question: 除雪車を追い越そうとすることが危険なのはなぜですか？
  choices:
    A: 制限速度を超えた速度で走行しているため。
    B: 両側に数フィート突き出たウィングプラウ（側方除雪板）を装備している場合があるため。
    C: 除雪車の追い越しは、自動的に免許停止の対象となるため。
    D: 立ち往生しているドライバーを救助するために頻繁に停車するため。
  answer: B
  explanation: 除雪車には、両側に数フィート突き出たウィングプラウが装備されていることがあり、これらは視認しにくく、多くの側面衝突事故の原因となっています。そのため、除雪車を追い越そうとしてはいけません。
- id: 302
  category: defensive_driving
  question: 攻撃的なドライバー（あおり運転など）に追跡された場合、最も安全な行動は何ですか？
  choices:
    A: 自宅に帰り、ドアをロックする。
    B: 速度を上げて、相手を振り切る。
    C: 警察署やコンビニエンスストアへ向かう。
    D: 車を止めて、相手のドライバーと対峙する。
  answer: C
  explanation: 攻撃的なドライバーに追跡された場合は、自宅へ向かってはいけません。代わりに、警察署やコンビニエンスストアなど、助けを求めることができ、目撃者がいる場所へ向かってください。
- id: 303
  category: defensive_driving
  question: マニュアルによると、ペンシルベニア州で毎年発生する高速道路での死亡事故の約何パーセントが、攻撃的な運転（あおり運転等）に起因していますか？
  choices:
    A: 20パーセント
    B: 37パーセント
    C: 60パーセント
    D: 85パーセント
  answer: C
  explanation: ペンシルベニア州で毎年発生する約1,500件の高速道路死亡事故のうち、約60パーセント（約900件）が攻撃的な運転に起因しています。
- id: 304
  category: defensive_driving
  question: 時速25マイル（約40km/h）以上の速度で衝突を回避する場合、ブレーキをかけるよりもハンドル操作で危険を回避する方が通常良いとされるのはなぜですか？
  choices:
    A: 高速走行中のブレーキは、常に車両の横転を引き起こすため。
    B: ハンドルを切る反応時間の方が、ブレーキをかける反応時間よりも早いため。
    C: アンチロック・ブレーキ（ABS）は時速25マイル以上では機能しないため。
    D: ハンドル操作はブレーキ操作よりも身体的な労力を必要としないため。
  answer: B
  explanation: 時速25マイル以上の速度では、ブレーキをかける反応時間よりもハンドルを切って回避する反応時間の方が早いため、通常はブレーキよりもハンドル操作で危険を避ける方が有効です。
- id: 305
  category: vehicle_information
  question: エアバッグが作動した際の負傷のリスクを最小限にするために、ハンドル上の手の位置はどこにあるべきですか？
  choices:
    A: 時計の10時と2時の位置
    B: 時計の12時と6時の位置
    C: 時計の9時と3時の位置、または8時と4時の位置
    D: 片手を12時の位置
  answer: C
  explanation: マニュアルでは、ハンドルを9時と3時、または8時と4時の位置で保持することを推奨しています。10時と2時の位置は、エアバッグが作動した際に負傷するリスクがあります。
- id: 306
  category: vehicle_information
  question: ハンドルを握る際、親指はどのように配置すべきですか？
  choices:
    A: ハンドルのリムの内側をしっかりと握る。
    B: 中央のホーンパッドの上に置く。
    C: 自分の体の方へ直接向ける。
    D: ハンドルの表面に沿わせる。
  answer: D
  explanation: 親指はハンドルのリムの内側を握り込むのではなく、ハンドルの表面に沿わせて置くようにしてください。
- id: 307
  category: safe_driving_rules
  question: 衝突時の負傷を防ぐために、エアバッグから離れるべき推奨される最短距離はどれくらいですか？
  choices:
    A: 5インチ（約13cm）
    B: 10インチ（約25cm）
    C: 15インチ（約38cm）
    D: 20インチ（約51cm）
  answer: B
  explanation: 衝突時の負傷防止は、主にシートベルトを正しく着用すること、ヘッドレストを調整すること、そしてエアバッグから少なくとも10インチ（約25cm）離れた位置に座ることに依存します。
- id: 308
  category: defensive_driving
  question: 車両にアンチロック・ブレーキ・システム（ABS）が装備されていない場合、緊急時にどのようにブレーキをかけるべきですか？
  choices:
    A: 強く一定の圧力をかけ続ける。
    B: ブレーキを強く踏み込み、そのまま保持する。
    C: ブレーキを繰り返し踏んだり離したりする（ポンピングブレーキ）。
    D: 直ちにパーキングブレーキをかける。
  answer: C
  explanation: ABSがない場合は、ブレーキを繰り返し踏んだり離したり（ポンピング）することで、車輪のロックを防ぎ、車両をコントロールしながら減速させる必要があります。急ブレーキをかけると車輪がロックする恐れがあります。
- id: 309
  category: defensive_driving
  question: 車両にアンチロック・ブレーキ（ABS）が装備されている場合、緊急時の正しいブレーキ操作は何ですか？
  choices:
    A: ブレーキペダルを素早くポンピングする。
    B: ブレーキに強く一定の圧力をかけ続ける。
    C: ブレーキを軽く踏み、ハンドルを鋭く切る。
    D: ブレーキを強く踏み、すぐに離す。
  answer: B
  explanation: ABS装備車では、ブレーキを強く一定の圧力で踏み続けてください。ブレーキペダルをポンピングしてはいけません。
- id: 310
  category: defensive_driving
  question: 凍結した道路で車両の後部が右側にスリップし始めた場合、どうすべきですか？
  choices:
    A: ハンドルを左に切る。
    B: ハンドルを右に切る。
    C: 直ちに急ブレーキをかける。
    D: ギアをニュートラルに入れ、惰性で進む。
  answer: B
  explanation: 車両がスリップし始めたら、行きたい方向を見て、その方向にハンドルを切ります。車両の後部が右にスリップしている場合は、ハンドルを右に切ってください。この際、ブレーキは使用しないでください。
- id: 311
  category: defensive_driving
  question: 車両がスリップし始めたらどうすべきですか？
  choices:
    A: すぐにブレーキを強く踏む
    B: 後輪がスリップしている方向とは逆の方向にハンドルを切る
    C: 車両の後部がスリップしている方向にハンドルを切る
    D: ニュートラルに入れ、パーキングブレーキをかける
  answer: C
  explanation: スリップを止めるには、車両の後部がスリップしている方向にハンドルを切る必要があります。コントロールを取り戻すまでに、数回の修正が必要になる場合があります。
- id: 312
  category: defensive_driving
  question: 車両がスリップしているときにブレーキの使用を避けるべきなのはなぜですか？
  choices:
    A: エンジンがストール（停止）する原因になるため
    B: 車輪がロックされ、ステアリング操作が完全に効かなくなる恐れがあるため
    C: アクセルが戻らなくなる原因になるため
    D: トランスミッションを損傷するため
  answer: B
  explanation: スリップ中はブレーキを使用しないでください。ブレーキを踏むとスリップが悪化し、車輪がロックされてステアリング操作が完全に効かなくなる危険があります。
- id: 313
  category: safe_driving_rules
  question: 多くの車が浮いてしまうのに必要な流水の深さはどれくらいですか？
  choices:
    A: 2インチ
    B: 6インチ
    C: 12インチ
    D: 2フィート
  answer: C
  explanation: マニュアルによると、12インチの流水で多くの車が浮く可能性があります。
- id: 314
  category: safe_driving_rules
  question: ほとんどのスポーツ用多目的車（SUV）やピックアップトラックを押し流すのに、一般的にどれくらいの流水が必要ですか？
  choices:
    A: 6インチ
    B: 12インチ
    C: 18インチ
    D: 2フィート
  answer: D
  explanation: 2フィートの流水は、ほとんどのSUVやピックアップトラックを動かすことができ、大半の車両を押し流してしまいます。
- id: 315
  category: defensive_driving
  question: 車両のアクセル（アクセルペダル）が戻らなくなった場合、車両のトランスミッションに対して最初に行うべきことは何ですか？
  choices:
    A: すぐにニュートラルに入れる
    B: 最も低いギアに入れる
    C: パーキング（P）に入れる
    D: リバース（R）に入れる
  answer: A
  explanation: アクセルが戻らなくなり、軽く叩いても直らない場合は、すぐにニュートラルにシフトし、ブレーキを使用してください。
- id: 316
  category: vehicle_information
  question: アクセルが戻らなくなったために急減速または急停車する必要がある場合、イグニッションを「LOCK」の位置に回すのを避けるべきなのはなぜですか？
  choices:
    A: エンジンから出火する原因になるため
    B: ステアリング操作ができなくなるため
    C: ブレーキが即座にロックされるため
    D: エアバッグが作動するため
  answer: B
  explanation: 急減速または急停車が必要な場合は、イグニッションを「OFF」にします。「LOCK」にはしないでください。ステアリング操作ができなくなるからです。
- id: 317
  category: vehicle_information
  question: 比較的新しい車両でブレーキシステムの警告灯が点灯した場合、ブレーキペダルを踏んだときにどのようなことが予想されますか？
  choices:
    A: ペダルが異常に重く、踏みにくく感じる
    B: ペダルが通常よりも深く沈み込み、より強く踏み込む必要がある
    C: 車両の4輪すべてが即座にロックされる
    D: ペダルが激しく振動する
  answer: B
  explanation: 分割ブレーキシステムを採用している新しい車両では、警告灯が点灯すると、車両が減速し始める前にブレーキペダルが通常よりも深く沈み込むように感じられ、より強く踏み込む必要があります。
- id: 318
  category: vehicle_information
  question: パンクしたタイヤを交換する際、どの時点でラグナット（ホイールナット）を緩めるべきですか？
  choices:
    A: 車両が地面から6インチ持ち上がった後
    B: 車両がまだ地面に接地している間
    C: ハブキャップを完全に取り外し、車を12インチジャッキアップした後
    D: スペアタイヤを取り付けた後のみ
  answer: B
  explanation: 車両が接地している間に、ラグレンチの端を使ってラグナットを緩めます。車両を持ち上げるまでは、完全に取り外さないでください。
- id: 319
  category: defensive_driving
  question: 前輪がパンク（バースト）した際の一般的な兆候は何ですか？
  choices:
    A: 車両の後部が左右に揺れる
    B: ハンドルが振動し、車両が突然片側に引っ張られる
    C: エンジンの回転数が突然上がる
    D: ブレーキペダルが床まで落ちる
  answer: B
  explanation: 前輪がバーストすると、ハンドルが振動し、車両が突然片側に引っ張られるのを感じます。
- id: 320
  category: defensive_driving
  question: タイヤがバーストした直後に、最も避けるべきことは何ですか？
  choices:
    A: ハンドルをしっかりと握ること
    B: アクセルペダルから足を離すこと
    C: ブレーキをかけること
    D: スムーズにハンドル操作をすること
  answer: C
  explanation: タイヤがバーストした場合は、ブレーキを踏まないでください！バースト後にブレーキをかけると、スリップを引き起こし、車両のコントロールを失う原因になります。
- id: 321
  category: defensive_driving
  question: 旧式の車両でブレーキが突然故障した場合、ブレーキ圧を高めるために何をすべきですか？
  choices:
    A: ニュートラルに入れ、エンジンを切る
    B: ブレーキペダルを素早く数回踏み込む
    C: パーキングブレーキをできるだけ速く、強く引く
    D: ブレーキペダルを床まで強く踏み込み続ける
  answer: B
  explanation: 旧式の車両でブレーキが故障した場合は、ブレーキペダルを素早く数回踏み込んでください。これにより、多くの場合、車両を停止させるのに十分なブレーキ圧が得られます。
- id: 322
  category: defensive_driving
  question: 自分の車線で別の車両が正面から近づいてきた場合、可能であればどちらの方向に回避すべきですか？
  choices:
    A: 左側
    B: 右側
    C: 急ブレーキをかけながら直進する
    D: 対向車線
  answer: B
  explanation: 別の車両が正面から近づいてきた場合は、クラクションを鳴らして注意を引き、可能であれば右側に回避してください。左側にハンドルを切ると、相手のドライバーが修正した場合に衝突する恐れがあります。
- id: 323
  category: sharing_the_road
  question: 交差点で葬列に遭遇した場合、どうしなければなりませんか？
  choices:
    A: 信号が青であれば、葬列を横切って進む
    B: 葬列の車両がすべて通過するまで道を譲る
    C: クラクションを鳴らして、待っていることを知らせる
    D: 交差点を早く通過するために葬列に合流する
  answer: B
  explanation: 先頭車両が交差点を通過した後は、葬列の残りの車両も交差点を通過することができ、他の交通は道を譲らなければなりません。葬列を通過させ、割り込んだり出たりしないでください。
- id: 324
  category: sharing_the_road
  question: 葬列の一部である車両をどのように識別できますか？
  choices:
    A: ハイビームを点灯している
    B: ヘッドライトと非常点滅表示灯（ハザードランプ）を点灯し、旗や記章をつけている
    C: 制限速度より少なくとも時速15マイル（15 mph）以上遅く走行している
    D: 屋根に黄色い回転灯をつけている
  answer: B
  explanation: 葬列に参加するすべての車両は、ヘッドライトと非常点滅表示灯（ハザードランプ）を点灯し、葬列の一部であることを示す旗やその他の記章をつけていなければなりません。
- id: 325
  category: safe_driving_rules
  question: 冠水した道路で動けなくなった場合、最善の選択肢は何ですか？
  choices:
    A: 車内にとどまり、救急サービスの到着を待つ
    B: すぐに車から出て、高台へ移動する
    C: 窓を閉め、エアコンをつける
    D: エンジンを再始動し、バックで水から出ようとする
  answer: B
  explanation: 冠水した道路で動けなくなった場合は、すぐに車から出て高台へ移動してください。
- id: 326
  category: sharing_the_road
  question: 葬列のすべての車両は何を点灯させていなければなりませんか？
  choices:
    A: ハイビーム
    B: ヘッドライトと非常点滅表示灯（ハザードランプ）
    C: 非常点滅表示灯（ハザードランプ）のみ
    D: 車内灯
  answer: B
  explanation: マニュアルによると、葬列に参加するすべての車両は、ヘッドライトと非常点滅表示灯（ハザードランプ）を点灯し、旗やその他の記章をつけていなければなりません。
- id: 327
  category: sharing_the_road
  question: 葬列の先頭車両が青信号で交差点に入った場合、それに続く葬列の車両はどうすることができますか？
  choices:
    A: 信号が赤になったら停止しなければならない
    B: 進む前に、交差するすべての交通に道を譲らなければならない
    C: 赤信号でもそのまま進むことができる
    D: 次の青信号を待たなければならない
  answer: C
  explanation: 葬列のドライバーは、先頭車両が青信号の時に交差点に入り始めた場合、赤信号や一時停止標識があってもそのまま進むことができます。
- id: 328
  category: defensive_driving
  question: 車の右輪が舗装路から外れて路肩にはみ出した場合、最初にすべきことは何ですか？
  choices:
    A: すぐに急ブレーキをかける
    B: 左に急ハンドルを切る
    C: アクセルを緩めて減速する
    D: ハザードランプをつける
  answer: C
  explanation: 舗装路から外れた場合、最初のステップはアクセルを緩めて減速することです。急ブレーキをかけてはいけません。
- id: 329
  category: defensive_driving
  question: 柔らかい路肩にはみ出した後、道路に戻るためにハンドルを急に切るのが危険なのはなぜですか？
  choices:
    A: 前輪にダメージを与えるため
    B: 車両が横方向に振られ、対向車線に飛び出す可能性があるため
    C: エンジンが停止（エンスト）するため
    D: ハンドルがロックされるため
  answer: B
  explanation: マニュアルでは、道路に戻るためにハンドルを急に切ると、車両が横方向に振られ、対向車線に飛び出す可能性があると警告しています。
- id: 330
  category: safe_driving_rules
  question: 路外に逸脱した後、舗装路に戻ろうとする前に、時速何マイルまで徐々に減速すべきですか？
  choices:
    A: 時速25マイル（25 mph）未満
    B: 時速35マイル（35 mph）未満
    C: 時速45マイル（45 mph）未満
    D: 時速55マイル（55 mph）未満
  answer: A
  explanation: 舗装路に戻る前に、時速25マイル（25 mph）未満、できれば時速10マイル（10 mph）近くまで、非常にゆっくりとした速度になるまで徐々に減速し続ける必要があります。
- id: 331
