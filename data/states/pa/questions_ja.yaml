    B: このエリアではシカが頻繁に道路を横断する
    C: この先に狩猟エリアがある
    D: 近くに野生動物保護区がある
  answer: B
  explanation: シカのシルエットが描かれた黄色のひし形の標識は、このエリアでシカが頻繁に道路を横断することを警告しています。減速し、特に夜明けや夕暮れ時は動物に注意してください。
  id: 498
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: 学校区域または通学路の横断歩道
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、学校区域（スクールゾーン）または通学路の横断歩道を示しています。減速し、子供に注意してください。
  id: 499
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: 通常、この標識はどこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型のクロスバック（踏切警標）は踏切に設置されます。これは列車に道を譲らなければならないことを意味します。列車が接近している場合は、停止しなければなりません。
  id: 500
- image: sharp_turn_right.png
  category: signs_and_signals
  id: 501
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角であることを示している
    B: 大幅な減速が必要な急カーブを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（矢印の角度が急なもの）は、通常のカーブ標識よりも急な曲がり角であることを示しています。このカーブの手前では、より大幅に速度を落とす必要があります。
- image: reverse_curve.png
  category: signs_and_signals
  id: 502
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道
    B: この先に1つのカーブがある
    C: 反対方向への2つの連続するカーブ
    D: この先にラウンドアバウト（環状交差点）がある
  answer: C
  explanation: 背向（はいこう）カーブの標識は、この先に反対方向への2つのカーブがあることを警告しています。速度を落とし、道路が最初に一方へ、次に反対方向へ曲がることに備えてください。
- image: winding_road.png
  category: signs_and_signals
  id: 503
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 1つの急カーブ
    B: 滑りやすい路面
    C: この先に連続するカーブまたは曲がり角
    D: この先に坂道がある
  answer: C
  explanation: 「屈曲あり（ワインディングロード）」の標識は、この先に連続するカーブや曲がり角があることを警告しています。速度を落とし、変化する道路状況に注意してください。
- image: merge.png
  category: signs_and_signals
  id: 504
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の終了
    B: 他の道路からの交通の合流
    C: 中央分離帯のある道路の始まり
    D: 道路が1車線に狭まること
  answer: B
  explanation: 黄色のひし形の合流標識は、他の道路からの交通が自分の車線に合流してくることを警告しています。速度や位置を調整する準備をしてください。
- image: divided_highway.png
  category: signs_and_signals
  id: 505
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 中央分離帯のある道路の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって反対車線と仕切られた分離道路になることを警告しています。右側を通行してください（※右側通行の地域の場合）。
- image: stop_ahead.png
  category: signs_and_signals
  id: 506
  question: この標識はこの先に何を予測するよう伝えていますか？
  choices:
    A: 「譲れ」の標識
    B: 信号機
    C: 一時停止が必要な「止まれ」の標識
    D: スピードバンプ（段差）
  answer: C
  explanation: この標識はこの先に一時停止の標識があることを警告しています。減速を開始し、一時停止の標識で完全に停止できるよう準備してください。
- image: handicap_parking.png
  category: signs_and_signals
  id: 507
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車標章またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転手
  answer: C
  explanation: 車椅子マークの付いた青い標識は、障害者のために予約された駐車スペースを示しています。有効な障害者用駐車標章またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反には高額な罰金が科せられます。
