    C: 燃料消費量に影響はない。
    D: 60 mphを超えて10 mph速くなるごとに、燃料消費量は20%増加する。
  answer: B
  explanation: エコドライブのセクションにおいて、マニュアルは「60 mphを超えて時速5マイル走行速度が上がるごとに、燃料消費量は約5%増加する」と説明しています。
- id: 188
  category: vehicle_information
  question: 燃費を向上させるために、マニュアルでは車のエアコンをいつ使用することを推奨していますか？
  choices:
    A: 渋滞（ストップ・アンド・ゴー）の中を走行しているときのみ。
    B: 40 mph以上で走行しているとき。
    C: 30 mph未満で走行しているとき。
    D: 一日のうちで最も暑い時間帯のみ。
  answer: B
  explanation: エコドライブのヒントでは、「涼しさを保つために、40 mph以上で走行しているときは車のエアコンを使用してください」と推奨されています。
- id: 189
  category: defensive_driving
  question: 夜間の交通事故死亡率は、日中と比較してどうなっていますか？
  choices:
    A: ほぼ同じである。
    B: 2倍高い。
    C: 3倍から4倍高い。
    D: 交通量が少ないため、わずかに低い。
  answer: C
  explanation: マニュアルには「全体として、夜間の交通事故死亡率は日中の3倍から4倍高い」と記載されています。
- id: 190
  category: safe_driving_rules
  question: ペンシルベニア州法で、ヘッドライトの使用が義務付けられているのはどのような時ですか？
  choices:
    A: 州間高速道路を走行しているとき。
    B: 天候により、ワイパーを連続的または断続的に使用しているとき。
