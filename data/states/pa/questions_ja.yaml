- id: 51
  category: vehicle_information
  question: 路上試験を受けることができなくなる原因はどれですか？
  choices:
    A: マニュアル車を持ち込むこと
    B: 原本ではなく書類のコピーを持参すること
    C: 車両の一部が安全でない、または州の検査基準を満たしていないと判断されること
