  answer: C
  explanation: 赤と白の三角形の「譲れ（YIELD）」の標識は、減速して車両や歩行者に道を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 491
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターンする
    B: 注意深く運転を続ける
    C: 停止して後退するか向きを変える — 逆走しています
    D: そのエリアを素早く離れるために加速する
  answer: C
  explanation: 赤と白の「進入禁止（WRONG WAY）」の標識は、一方通行の道路や高速道路のランプで逆走していることを意味します。直ちに停止し、安全に向きを変えるか後退してください。
  id: 492
