    A: 他車を避けるためにゆっくり入る
    B: まず停止し、それからゆっくりと交通の流れに入る
    C: 交通の流れと同じ速度まで加速する
    D: 前へ出るために交通の流れ以上の速度で入る
  answer: C
  explanation: 入口ランプから高速道路に入る際は、通常、交通の流れと同じ速度まで加速して合流すべきです。
- id: 360
  category: safe_driving_rules
  question: 高速道路を降りたいのに出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 中央分離帯を横切ってUターンする
    B: 路肩に寄せて出口までバックする
    C: 次の出口まで行き、そこで高速道路を降りる
    D: 停止して交通が途切れるのを待ち、バックする
  answer: C
  explanation: 高速道路で出口を通り過ぎてしまった場合は、次の出口まで走行し、そこで高速道路を降りるようにしてください。
- id: 361
  category: safe_driving_rules
  question: 標識、信号、または警察官がいない交差点において、優先権の譲渡に関して法律は何と定めていますか？
  choices:
    A: 直進するドライバーは、左折するドライバーに譲らなければならない
    B: 左折するドライバーは、交差点を直進するドライバーに譲らなければならない
    C: 右側のドライバーは、左側のドライバーに譲らなければならない
    D: 誰が譲るべきかを定めた法律はない
  answer: B
  explanation: 交差点で標識、信号、または警察官の指示がない場合、法律では、左折するドライバーは交差点を直進するドライバーに優先権を譲らなければならないと定められています。
- id: 362
  category: driver_responsibility
  question: 「ハイウェイ・ヒプノーシス（高速道路催眠現象）」と呼ばれる運転者の状態は何によって引き起こされますか？
  choices:
    A: 頻繁な休憩
    B: 旅行前夜の十分すぎる睡眠
    C: 高速道路での短距離走行
    D: 長時間にわたって路面を凝視すること
  answer: D
  explanation: 「ハイウェイ・ヒプノーシス」は、長時間にわたって路面を凝視し続けることによって起こる可能性のある運転者の状態です。
- id: 363
  category: defensive_driving
  question: 車両の周囲に「スペース・クッション（安全な空間）」を保つのに最適な場所はどこですか？
  choices:
    A: 車両の後方のみ
    B: 車両の左右両側のみ
    C: 車両の全周囲
    D: 車両の前方のみ
  answer: C
  explanation: 車両の全周囲にスペース・クッションを保つのが最善です。
- id: 364
  category: defensive_driving
  question: 乾燥した路面を高速で走行している際、安全な車間距離とされるのはどれですか？
  choices:
    A: 前方の車両から2秒間の車間距離
    B: 前方の車両から3秒間の車間距離
    C: 前方の車両から4秒間の車間距離
    D: 前方の車両から車2台分の車間距離
  answer: C
  explanation: 乾燥した路面を高速で走行する場合、安全な車間距離は、前方の車両から少なくとも4秒間の距離です。
- id: 365
  category: defensive_driving
  question: 交通の流れの中で、緊急停止や「パニック」ブレーキを避けるための最善の方法は何ですか？
  choices:
    A: クラクションを鳴らして周囲に自分の存在を知らせる
    B: 右側の車線のみを走行する
    C: 交通の流れよりも遅く走る
    D: 前方を注視し、安全な車間距離を保つ
  answer: D
  explanation: 交通の流れの中での緊急停止を避けるためには、前方を注視し、安全な車間距離を保つ必要があります。
- id: 366
  category: sharing_the_road
  question: 左側に対向車、右側に自転車がいる状況に直面した場合、どうすべきですか？
  choices:
    A: 路肩に寄せる
    B: 両者の中間を通る
    C: 対向車を通過させてから、自転車を追い越す
    D: 素早く自転車を追い越す
  answer: C
  explanation: 左側に対向車、右側に自転車がいる場合は、安全を確保するために、まず対向車を通過させてから自転車を追い越すべきです。
- id: 367
  category: defensive_driving
  question: 対向車が自分の車線に向かって走ってきた場合、どうすべきですか？
  choices:
    A: 右にハンドルを切り、クラクションを鳴らし、加速する
    B: 左にハンドルを切り、クラクションを鳴らし、ブレーキをかける
    C: 右にハンドルを切り、クラクションを鳴らし、ブレーキをかける
    D: 車線の中央にとどまり、クラクションを鳴らし、ブレーキをかける
  answer: C
  explanation: 対向車が自分の車線に向かって走ってきた場合は、正面衝突を避けるために、右にハンドルを切り、クラクションを鳴らし、ブレーキをかけるべきです。
- id: 368
  category: vehicle_information
  question: 車両の後部が左にスリップし始めた場合、どうすべきですか？
  choices:
    A: 左にハンドルを切る
    B: ブレーキを踏む
    C: 加速する
    D: 右にハンドルを切る
  answer: A
  explanation: 車両の後部が左にスリップし始めた場合は、車両の制御を取り戻すために左にハンドルを切るべきです。
- id: 369
  category: safe_driving_rules
  question: 雨天時、路面が最も滑りやすくなるのはいつですか？
  choices:
    A: 雨が降り始めてから1時間以上経過したとき
    B: 雨が降った翌日
    C: 雨が降り始めてからの最初の10分から15分間
    D: 雨が止んだ直後
  answer: C
  explanation: 雨が降り始めてからの最初の10分から15分間は、水が路面上のオイルや汚れと混ざり合うため、路面が非常に滑りやすくなります。
- id: 370
  category: safe_driving_rules
  question: 霧の中を運転する際は、どのライトを使用すべきですか？
  choices:
    A: ロービーム（下向き灯）
    B: ハイビーム（上向き灯）
    C: 駐停車灯（パーキングライト）
    D: 非常点滅表示灯（ハザードランプ）
  answer: A
  explanation: 霧の中を運転する際は、眩しさを抑えつつ視認性を高めるために、ロービーム（下向き灯）を使用すべきです。
- id: 371
  category: penalties_and_points
  question: PennDOT（ペンシルベニア州運輸局）が運転者の記録に対して是正措置を開始するのは、何ポイントに達した時ですか？
  choices:
    A: 3ポイント以上
    B: 6ポイント以上
    C: 9ポイント以上
    D: 12ポイント以上
  answer: B
  explanation: PennDOTは、運転記録が6ポイント以上に達した時点で是正措置を開始します。
- id: 372
  category: penalties_and_points
  question: 運転記録が初めて6ポイント以上に達した場合、どうなりますか？
  choices:
    A: 運転免許が直ちに30日間停止される
    B: 局の聴聞会に出席しなければならない
    C: 特別ポイント筆記試験を受けるよう書面で通知される
    D: 500ドルの罰金を支払わなければならない
  answer: C
  explanation: 運転記録が初めて6ポイント以上に達した場合、運転者は特別ポイント筆記試験を受けるよう書面で通知を受けます。
- id: 373
  category: penalties_and_points
  question: 18歳未満の運転者が6ポイント以上を累積した場合、初回の違反で運転資格はどのくらいの期間停止されますか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 120日間
  answer: C
  explanation: 18歳未満の者が6ポイント以上を累積した場合、運転資格が停止されます。初回の停止期間は90日間です。
- id: 374
  category: penalties_and_points
  question: 違反や停止処分を受けずに12ヶ月連続で運転した場合、運転記録から何ポイント削除されますか？
  choices:
    A: 1ポイント
    B: 2ポイント
    C: 3ポイント
    D: すべてのポイント
  answer: C
  explanation: 停止や取り消しの処分を受けておらず、かつ違反を犯していない期間が連続して12ヶ月経過するごとに、運転記録から3ポイントが削除されます。
- id: 375
  category: safe_driving_rules
  question: 信号機や遮断機のない踏切を通過する車列の中にいるとき、どのようにすべきですか？
  choices:
    A: 自分に優先権があると考え、列車の確認をする必要はない
    B: 踏切を渡っている間に、遅い車を追い越す
    C: 渡り始める前に、踏切内で停止することなく完全に渡りきれるスペースがあることを確認する
    D: 踏切内で停止して、近づいてくる列車がないか確認する
  answer: C
  explanation: 信号機や遮断機のない踏切を渡る際は、渡り始める前に、途中で止まることなく線路を完全に越えられるだけの十分なスペースがあることを確認する必要があります。
- id: 376
  category: penalties_and_points
  question: 次の違反のうち、運転資格の停止または取り消しにつながるものはどれですか？
  choices:
    A: 制限速度を時速5マイル超えて走行する
    B: 荷物積み下ろし専用区域に駐車する
    C: 踏切の遮断機や障壁に従わない
    D: テールランプが壊れた状態で運転する
  answer: C
  explanation: 踏切の遮断機や障壁に従わなかったことで有罪判決を受けた場合、運転資格が停止または取り消されます。これには30日間の停止処分が伴います。
- id: 377
  category: penalties_and_points
  question: 踏切の遮断機や障壁に従わなかった場合、どのような罰則が科せられますか？
  choices:
    A: 15日間の停止
    B: 30日間の停止
    C: 60日間の停止
    D: 6ヶ月の停止
  answer: B
  explanation: マニュアルによると、踏切の遮断機や障壁に従わなかった場合は30日間の停止処分となります。
- id: 378
  category: safe_driving_rules
  question: 夜間に警察官に車を止められた場合、直ちに何をすべきですか？
  choices:
    A: 車から降りて警察官に挨拶する
    B: 停車後すぐに車内の照明（ルームライト）をつける
    C: グローブボックスに手を入れて登録証を探す
    D: 財布ごと警察官に渡す
  answer: B
  explanation: 夜間に警察に止められた場合は、停車後、警察官が近づいてくる前に車内の照明をつけるようにしてください。
- id: 379
  category: driver_responsibility
  question: 警察官に止められた際、運転免許証、車両登録証、保険証はいつ取り出すべきですか？
  choices:
    A: 後方にパトランプが見えたらすぐに
    B: 警察官が車両に向かって歩いてきている間に
    C: 警察官から提示を求められるまで待つ
    D: 車から降りた後でのみ
  answer: C
  explanation: 警察官から運転免許証、車両登録証、保険証の提示を求められるまで待ち、それまでは不用意な動きを控えるべきです。
- id: 380
  category: penalties_and_points
  question: 停止処分の後、運転資格が回復した際、通常、運転記録には何ポイントが表示されますか？
  choices:
    A: 0ポイント
    B: 3ポイント
    C: 5ポイント
    D: 6ポイント
  answer: C
  explanation: 運転資格が回復した後、停止前のポイント数に関わらず、運転記録には5ポイントが表示されます（いくつかの例外を除く）。
- id: 381
  category: penalties_and_points
  question: PennDOTが、あなたの車両が31日以上にわたり保険に加入していなかったと判断した場合、どのような罰則がありますか？
  choices:
    A: 車両登録が3ヶ月間停止される
    B: 車両が30日間押収される
    C: 60日間の免許停止処分を受ける
    D: 運転免許試験の再受験が求められる
  answer: A
  explanation: PennDOTが、車両が31日以上にわたり保険に加入していなかったと判断した場合、車両登録は3（三）ヶ月間停止されます。
- id: 382
  category: signs_and_signals
  question: 後方の車両が青色のライトのみを点滅させている場合、それは何を示していますか？
  choices:
    A: 覆面パトカーである
    B: 州警察官（ステート・トルーパー）である
    C: 警察官ではない
    D: 救急医療車両である
  answer: C
  explanation: マニュアルには、「車両が青色のライトのみを点滅させている場合、それは警察官ではありません」と記載されています。
- id: 383
  category: defensive_driving
  question: 赤色のライトを点滅させて停車を求められたが、その人物が本当に警察官であるか確信が持てない場合、どうすべきですか？
  choices:
    A: 車両から逃げるために加速する
    B: 直ちに停車し、すべてのドアをロックする
    C: ハザードランプを点灯させ、速度を落として、最も近い明るく人が多い場所まで運転する
    D: 標識のあるパトカーが見えるまでライトを無視する
  answer: C
  explanation: 停車を求めている人物が警察官であるか確信が持てない場合は、ハザードランプを点灯させ、停車要求を認識していることを示すために減速して走行し、最も近い明るく人が多い場所まで移動することができます。
- id: 384
  category: driver_responsibility
  question: 駐車中の車両と衝突事故を起こし、所有者が見つからない場合はどうしなければなりませんか？
  choices:
    A: 現場を離れ、警察からの連絡を待つ
    B: 連絡先を記載したメモを残し、警察に通報する
    C: 現場を離れる前に、最大1時間現場で待機する
    D: 30日以内に保険会社に事故を報告する
  answer: B
  explanation: 駐車中の車両との事故で所有者が見つからない場合は、日付、時間、氏名、電話番号を記載したメモを目につきやすい場所に残し、警察に通報してください。
- id: 385
  category: driver_responsibility
  question: 負傷、死亡、または車両の牽引が必要となった事故について警察が調査を行わない場合、PennDOTに運転者事故報告書（Driver's Accident
    Report Form）を送付するまでに何日間の猶予がありますか？
  choices:
    A: 3日
    B: 5日
    C: 10日
    D: 15日
  answer: B
  explanation: 警察が事故の調査を行わず、死亡者や負傷者が出た場合、または車両の牽引が必要な場合は、5日以内に運転者事故報告書（AA-600）を送付しなければなりません。
- id: 386
  category: penalties_and_points
  question: 警察からの逃走または逃避の罪で有罪判決を受けた運転者に対する罰則は何ですか？
  choices:
    A: 6ヶ月間の免許停止と250ドルの罰金
    B: 1年間の免許停止と500ドルの罰金
    C: 3ヶ月間の免許停止と1,000ドルの罰金
    D: 2年間の免許停止と5,000ドルの罰金
  answer: B
  explanation: 警察からの逃走または逃避の罪で有罪判決を受けた場合、罰則は1年間の運転免許停止、500ドルの罰金に加え、裁判費用およびその他の手数料が科されます。
- id: 387
  category: alcohol_drugs_health
  question: ペンシルベニア州の「黙示の同意（Implied Consent）」法は、運転者にとって何を意味しますか？
  choices:
    A: 警察がいつでも車両を捜索することを許可することに同意する
    B: 運転免許を保有しているだけで、アルコールや薬物の化学検査を受けることに同意しているとみなされる
    C: 受け取った交通違反切符に対して有罪を認めることに同意する
    D: 車両に賠償責任保険をかけることに同意する
  answer: B
  explanation: 黙示の同意（Implied Consent）法は、ペンシルベニア州で運転免許を保有しているだけで、呼気または血液の化学検査を受けることに同意したとみなされることを定めています。
- id: 388
  category: penalties_and_points
  question: 酒気帯び・薬物影響下運転（DUI）で逮捕され、呼気または血液の化学検査を拒否した場合、どうなりますか？
  choices:
    A: 警告を受けて釈放される
    B: 運転免許が自動的に1年間停止される
    C: 500ドルの罰金が科されるが、免許は維持できる
    D: 車両が永久に没収される
  answer: B
  explanation: 呼気または血液の1つ以上の化学検査を拒否した場合、DUIで無罪となった場合でも、運転免許は自動的に1（一）年間停止されます。
- id: 389
  category: penalties_and_points
  question: 酒気帯び・薬物影響下運転（DUI）で無罪となったものの、初めて呼気または血液検査を拒否した場合、運転免許はどうなりますか？
  choices:
    A: 6ヶ月間停止される
    B: 1年間停止される
    C: 停止されない
    D: 90日間停止される
  answer: B
  explanation: 酒気帯び・薬物影響下運転（DUI）で無罪となった場合でも、呼気または血液検査の初回拒否に対しては、運転免許が1（一）年間停止されます。
- id: 390
  category: penalties_and_points
  question: 化学検査拒否による免許再交付手数料（復帰手数料）は、初犯の場合いくらですか？
  choices:
    A: $300
    B: $500
    C: $1,000
    D: $2,000
  answer: B
  explanation: 化学検査の受検を拒否した運転者は、化学検査拒否復帰手数料を支払う必要があります。初犯の場合は500ドルです。
- id: 391
  category: alcohol_drugs_health
  question: ペンシルベニア州のゼロ・トレランス法（Zero Tolerance law）に基づき、酒気帯び運転（DUI）で起訴された未成年者（21歳未満）の血中アルコール濃度（BAC）の制限値はいくらですか？
  choices:
    A: '.00'
    B: '.02'
    C: '.04'
    D: '.08'
  answer: B
  explanation: ゼロ・トレランス法により、酒気帯び運転（DUI）で起訴された未成年者（21歳未満）の血中アルコール濃度（BAC）の制限値は、.08から.02に引き下げられました。
- id: 392
  category: penalties_and_points
  question: BACが.08から.099の状態で運転中に、身体傷害または物的損害を伴う事故を起こした場合、どのような罰則の対象となりますか？
  choices:
    A: 一般的障害（General Impairment）の罰則
    B: 高比率（High Rate）の罰則
    C: 最高比率（Highest Rate）の罰則
    D: 初犯であれば罰則なし
  answer: B
  explanation: 身体傷害、死亡、または物的損害を伴う事故に関与した場合、たとえBACが表2に記載されているレベルより低くても、表2の「高比率（High
    Rate）」に記載されている罰則の対象となります。
- id: 393
  category: penalties_and_points
  question: 化学検査を拒否した運転者、または規制薬物の影響下で運転した運転者は、どのレベルの罰則の対象となりますか？
  choices:
    A: 一般的障害（General Impairment）
    B: 高比率（High Rate）
    C: 最高比率（Highest Rate）
    D: ゼロ・トレランス（Zero Tolerance）
  answer: C
  explanation: 規制薬物の影響下で運転した者、および化学検査を拒否した運転者はすべて、表3の「最高比率（Highest Rate）」に記載されている罰則の対象となります。
- id: 394
  category: alcohol_drugs_health
  question: DUIのために加速的更生処分（ARD）プログラムへの参加が認められた場合、アルコール交通安全学校（Alcohol Highway Safety
    School）に何時間参加する必要がありますか？
  choices:
    A: 10時間
    B: 12.5時間
    C: 15時間
    D: 20時間
  answer: B
  explanation: ARDプログラムへの参加が認められた場合、12.5時間のアルコール交通安全学校に参加することになります。
- id: 395
  category: penalties_and_points
  question: DUIの罪が「等級のない軽罪（ungraded misdemeanor）」として起訴された場合、そのケースを争う（起訴内容を否認する）とどうなりますか？
  choices:
    A: 陪審裁判を受ける権利がありません。
    B: 自動的に5年間の免許停止となります。
    C: 10,000ドルの法定罰金を支払わなければなりません。
    D: 連邦裁判所で裁判を受けます。
  answer: A
  explanation: 等級のない軽罪という罪状は、そのケースを争う場合でも、陪審裁判を受ける権利がないことを意味します。
- id: 396
  category: penalties_and_points
  question: 法定飲酒年齢に達している運転者の「一般的障害（General Impairment）」（BAC .08から.099）の初犯に対する免許の罰則は何ですか？
  choices:
    A: 6ヶ月の停止
    B: 12ヶ月の停止
    C: 18ヶ月の停止
    D: 処分なし
  answer: D
  explanation: 表1（一般的障害）によると、初犯に対する免許の罰則は「処分なし（No action）」です。
- id: 397
  category: alcohol_drugs_health
  question: 21歳未満で、血液、呼気、または尿検査のために拘束された場合、親の同意に関する方針はどうなっていますか？
  choices:
    A: 検査を実施する前に親の同意が必要です。
    B: 親の同意は必要ありませんが、警察は親に通知します。
    C: 検査を受けるかどうかを決める前に、親に電話することが許可されなければなりません。
    D: 検査の手順の間、親が立ち会わなければなりません。
  answer: B
  explanation: 未成年者が逮捕され、血液、呼気、および/または尿検査のために拘束された場合、これらの検査を実施するための親の同意は必要ありませんが、警察は逮捕について親に通知します。
- id: 398
  category: penalties_and_points
  question: 未成年者に故意かつ意図的にアルコールを提供したとして有罪判決を受けた成人の、初犯に対する最低罰金額はいくらですか？
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: 未成年者に故意かつ意図的にアルコールを提供したとして有罪判決を受けた成人は、親であっても、初犯で少なくとも1,000ドルの罰金の対象となります。
- id: 399
  category: license_system
  question: 運転免許協定（DLC）の「1人1免許」という概念は何を規定していますか？
  choices:
    A: 運転者は常に免許証を携帯しなければならない。
    B: 他の州で免許を申請する際、州外の免許証を返納しなければならない。
    C: 運転者は最大2つの加盟州の免許を保持できる。
    D: 運転者は毎年免許を更新しなければならない。
  answer: B
  explanation: 「1人1免許」の概念は、別の州で運転免許の申請が行われる際に、州外の運転免許証を返納することを求めています。
- id: 400
  category: penalties_and_points
  question: 次の運転者のうち、車両にイグニッション・インターロック装置（Ignition Interlock system）を設置する必要があるのは誰ですか？
  choices:
    A: 一般的障害（BAC .08から.099）の初犯の運転者。
    B: 化学検査拒否により運転資格の停止処分を受けた運転者。
    C: 制限速度を20マイル以上超えてスピード違反で捕まったすべての運転者。
    D: 運転を伴わない未成年者の飲酒で有罪判決を受けた運転者。
  answer: B
  explanation: 高い血中アルコール濃度での初犯および再犯のDUI違反者、ならびに化学検査拒否違反の結果として運転資格の停止処分を受けた個人は、イグニッション・インターロック装置の設置が義務付けられます。
- id: 401
  category: penalties_and_points
  question: 21歳未満で初めて酒気帯び運転（DUI）の有罪判決を受けた場合、支払わなければならない罰金の範囲はどれくらいですか？
  choices:
    A: 100ドルから300ドル
    B: 300ドルから1,000ドル
    C: 500ドルから5,000ドル
    D: 1,000ドルから10,000ドル
  answer: C
  explanation: 21歳未満で初めてDUIの有罪判決を受けた場合、禁錮刑に処される可能性があり、免許は1年間停止され、500ドルから5,000ドルの罰金を支払うことになります。
- id: 402
  category: penalties_and_points
  question: 薬物・アルコール検査（化学検査）拒否による免許再交付手数料は、どのように支払わなければなりませんか？
  choices:
    A: 現金または個人の小切手
    B: クレジットカードのみ
    C: 公認小切手（Certified check）または郵便為替（Money order）
    D: オンライン決済ポータル
  answer: C
  explanation: 薬物・アルコール検査拒否による免許再交付手数料は、公認小切手または郵便為替で支払わなければなりません。
- id: 403
  category: alcohol_drugs_health
  question: 「高率（High Rate）」の罰則（表2）は、血中アルコール濃度（BAC）が少なくともいくら以上の商用車運転者に適用されますか？
  choices:
    A: '.02'
    B: '.04'
    C: '.08'
    D: '.10'
  answer: B
  explanation: 表2の「高率（High Rate）」の注記によると、この表はBACが0.04以上の商用車運転者にも適用されます。
- id: 404
  category: penalties_and_points
  question: 州外での交通違反切符（召喚状）に応答しなかった場合、どうなりますか？
  choices:
    A: 500ドルの罰金が科せられる。
    B: ペンシルベニア州での運転資格が無期限に停止される。
    C: 運転記録に違反点数が加算される。
    D: 車両が押収される。
  answer: B
  explanation: マニュアルによると、州外の違反切符に応答しない場合、応答がなされるまでペンシルベニア州での運転資格が無期限に停止されます。
- id: 405
  category: license_system
  question: 氏名や住所を変更した場合、何日以内にPennDOT（ペンシルベニア州運輸局）に通知しなければなりませんか？
  choices:
    A: 10日
    B: 15日
    C: 30日
    D: 60日
  answer: B
  explanation: ペンシルベニア州車両法第1515条に基づき、氏名や住所を変更した場合は、州外に転居する場合であっても、変更から15日以内にPennDOTに通知しなければなりません。
- id: 406
  category: safe_driving_rules
  question: ペンシルベニア州法によると、乗用車、軽トラック、またはモーターホームの前部座席でシートベルトの着用が義務付けられているのは誰ですか？
  choices:
    A: 運転者のみ
    B: 18歳未満の同乗者のみ
    C: すべての運転者および前部座席の同乗者
    D: エアバッグのない車両の同乗者のみ
  answer: C
  explanation: マニュアルには、乗用車、軽トラック、およびモーターホームのすべての運転者および前部座席の同乗者はシートベルトを着用しなければならないと記載されています。
- id: 407
  category: safe_driving_rules
  question: 8歳以上18歳未満の同乗者は、車内のどこでシートベルトを着用しなければなりませんか？
  choices:
    A: 前部座席のみ
    B: 後部座席のみ
    C: 車内のどこに乗っているかに関わらず
    D: 車両にエアバッグがない場合のみ
  answer: C
  explanation: 8歳以上18歳未満の同乗者を乗せる場合は、車内のどこに乗っているかに関わらず、シートベルトを着用させなければなりません。
- id: 408
  category: safe_driving_rules
  question: 18歳未満の運転者の場合、同乗させることができる最大人数は何人ですか？
  choices:
    A: 車両1台につき同乗者1名
    B: 同乗者3名まで
    C: 同乗者の数は車両のシートベルトの数を超えてはならない
    D: 後部座席に安全に座れるだけの人数
  answer: C
  explanation: 18歳未満の運転者の場合、同乗者の数は車両に備え付けられているシートベルトの数を超えてはなりません。
- id: 409
  category: defensive_driving
  question: 時速30マイル（約48km/h）での衝突時に計器パネルやフロントガラスにぶつかることは、何に相当しますか？
  choices:
    A: 3階建ての建物の屋上から地面に叩きつけられること
    B: 時速15マイルで自転車から転落すること
    C: 1階建ての建物から地面に落ちること
    D: プロのアメフト選手にタックルされること
  answer: A
  explanation: マニュアルでは、時速30マイルで車内の表面に衝突することは、3階建ての建物の屋上から地面に叩きつけられるのと同じであると説明されています。
- id: 410
  category: defensive_driving
  question: 衝突時に車外に放り出された場合、死亡する確率は何倍高くなりますか？
  choices:
    A: 5倍
    B: 10倍
    C: 25倍
    D: 50倍
  answer: C
  explanation: 車外に放り出された場合、死亡する確率は約25倍高くなります。
- id: 411
  category: penalties_and_points
  question: 16歳未満の者が、アルコールを購入するために偽造身分証明書を使用した場合の罰則は何ですか？
  choices:
    A: 500ドルの罰金と車両の即時押収
    B: 16歳の誕生日から開始される運転免許停止
    C: 21歳の誕生日まで運転免許試験を受けることができない
    D: アルコール安全教育クラスへの強制出席
  answer: B
  explanation: 16歳未満でアルコール購入のために偽造身分証明書を使用した者は、16歳の誕生日から開始される運転免許停止処分を受けます。
- id: 412
  category: alcohol_drugs_health
  question: 21歳未満の者が、自動車を運転していない状態で飲酒した場合、初犯の罰則は何ですか？
  choices:
    A: 90日間の運転免許停止および最大500ドルの罰金
    B: 6ヶ月の保護観察
    C: 矯正施設への収容
    D: 運転記録への違反点数の加算
  answer: A
  explanation: 21歳未満の者が自動車を運転していない状態で飲酒した場合、初犯の罰則は90日間の運転免許停止および最大500ドルの罰金です。
- id: 413
  category: alcohol_drugs_health
  question: 警察が未成年者に対して呼気、血液、尿検査を行う際、保護者の同意は必要ですか？
  choices:
    A: はい、両親からの同意が必要です
    B: はい、少なくとも片方の親からの同意が必要です
    C: はい、16歳未満の者の場合は必要です
    D: いいえ、必要ありません
  answer: D
  explanation: 呼気、血液、尿検査を行うための保護者の同意は必要ありません。
- id: 414
  category: penalties_and_points
  question: 21歳未満で、初めて飲酒運転（DUI）の有罪判決を受けた場合、免許停止期間はどのくらいですか？
  choices:
    A: 30日間
    B: 60日間
    C: 6ヶ月
    D: 1年間
  answer: D
  explanation: 21歳未満で飲酒運転の有罪判決を受けた場合、初犯で1年間の免許停止処分を受けます。
- id: 415
  category: penalties_and_points
  question: 次の州外での違反のうち、ペンシルベニア州で発生したものとして扱われ、適切な処分が下されるのはどれですか？
  choices:
    A: 軽微な駐車違反
    B: 制限速度を時速5マイル超える速度超過
    C: 死亡または負傷者が出た事故における、停車および救護の怠り
    D: 期限切れの検査ステッカーを貼った状態での運転
  answer: C
  explanation: 他人の死亡または負傷を伴う車両事故において、停車および救護を怠ることは、加盟州で行われた場合、ペンシルベニア州で発生したものとして扱われる違反です。
- id: 416
  category: safe_driving_rules
  question: ペンシルベニア州の法律では、2歳未満の子供を車内でどのように固定しなければなりませんか？
  choices:
    A: 助手席の前向きチャイルドシートに固定する
    B: 製造メーカーが指定する制限を超えるまで、後ろ向きのチャイルドシートに固定する
    C: 腰ベルトと肩ベルトを備えたブースターシートに固定する
    D: 後部座席で標準のシートベルトを使用する
  answer: B
  explanation: 2歳未満の子供は、製造メーカーが指定するチャイルドシートの最大体重および身長の制限を超えるまで、後ろ向きのチャイルドシートに固定しなければなりません。
- id: 417
  category: vehicle_information
  question: エアバッグが装備されている助手席に、後ろ向きのチャイルドシートを設置してはいけないのはなぜですか？
  choices:
    A: エアバッグがチャイルドシートの背面に凄まじい衝撃で衝突し、重大な負傷や死亡の原因となるため。
    B: 運転者の右側サイドミラーの視界を遮るため。
    C: 子供がダッシュボードのライトに気を取られるため。
    D: 助手席のシートベルトがチャイルドシートを固定するのに十分な長さではないため。
  answer: A
  explanation: 衝突時、エアバッグがチャイルドシートの背面に凄まじい衝撃で衝突し、その衝撃が乳児の頭部に伝わり、重大な負傷や死亡の原因となります。
- id: 418
  category: safe_driving_rules
  question: 外気温が華氏80度台前半（約27〜28度）の場合、車内の温度はどのくらいの速さで致死レベルに達する可能性がありますか？
  choices:
    A: 10分
    B: 30分
    C: 45分
    D: 1時間
  answer: A
  explanation: 窓を2インチ（約5センチ）開けていたとしても、外気温が華氏80度台前半であれば、車内の温度はわずか10分で致死レベルに達することがあります。
- id: 419
  category: defensive_driving
  question: 子供を高温の車内に置き去りにするという悲劇を防ぐために推奨される方法はどれですか？
  choices:
    A: 車を離れる前に、窓を少なくとも2インチ開ける。
    B: 財布、ブリーフケース、または携帯電話を後部座席に置く。
    C: 用事を済ませている間、エアコンをかけたままにする。
    D: 常に助手席にぬいぐるみを置いておく。
  answer: B
  explanation: マニュアルでは、財布、ブリーフケース、携帯電話、または自分が必要とするものを後部座席に置くことを推奨しています。そうすることで、車内に残された子供に必ず気づくようになります。
- id: 420
  category: safe_driving_rules
  question: 厚手の冬用コートは、チャイルドシートの安全性にどのような影響を与える可能性がありますか？
  choices:
    A: 子供が暑くなりすぎて、眠気を誘発する。
    B: 急停車時にシートベルトがロックされるのを妨げる。
    C: 衝突時にコートが圧縮され、ハーネスに大きな緩みが生じる可能性がある。
    D: 車両のLATCHシステム（チャイルドシート固定装置）に干渉する。
  answer: C
  explanation: 厚手の冬用コートは、衝突時にハーネスに大きな緩みが生じるほど圧縮される可能性があります。ハーネスは、最善の保護を提供するために子供の体に密着していなければなりません。
- id: 421
  category: safe_driving_rules
  question: 児童乗客保護法229条によると、4歳未満の子供は以下のどの状態でなければなりませんか？
  choices:
    A: 連邦政府承認のチャイルドシート（乳幼児用補助装置）を着用する。
    B: 腰ベルトと肩ベルトを備えたブースターシートで固定する。
    C: エアバッグを無効にして助手席に乗せる。
    D: 車両の標準的な腰ベルトのみを使用して固定する。
  answer: A
  explanation: 4歳未満の子供は、車内のどこに乗るかに関わらず、連邦政府承認のチャイルドシート（乳幼児用補助装置）を着用しなければなりません。
- id: 422
  category: safe_driving_rules
  question: 4歳以上8歳未満の子供には、どのような補助装置が必要ですか？
  choices:
    A: 後ろ向きの乳児用シート。
    B: 腰ベルトと肩ベルトを併用する連邦政府承認のブースターシート。
    C: 肩ベルトのない標準的な腰ベルト。
    D: 後部座席に座る場合は、特別な補助装置は必要ない。
  answer: B
  explanation: 4歳以上8歳未満の子供は、連邦政府承認のブースターシートを着用しなければならず、それは腰ベルトおよび肩ベルトと併用する必要があります。
- id: 423
  category: driver_responsibility
  question: 18歳未満の子供が車内で適切にシートベルトを着用していることを確認する責任は誰にありますか？
  choices:
    A: 子供自身
    B: 車両の所有者
    C: 運転者
    D: 誰が運転しているかに関わらず、子供の両親
  answer: C
  explanation: 運転者は、子供を承認されたチャイルドシートに固定し、18歳未満の子供がシートベルトを着用していることを確認する責任があります。
- id: 424
  category: vehicle_information
  question: エアバッグが作動した場合に安全であるために、運転者はステアリングホイール（ハンドル）からどのくらい離れて座るべきですか？
  choices:
    A: 少なくとも5インチ
    B: 少なくとも10インチ
    C: 少なくとも15インチ
    D: 少なくとも20インチ
  answer: B
  explanation: エアバッグが作動した場合に安全であるために、ステアリングホイールから少なくとも10インチ（約25cm）離れる必要があります。
- id: 425
  category: safe_driving_rules
  question: エアバッグが作動した際の怪我を防ぐために推奨される、ステアリングホイールの保持位置はどこですか？
  choices:
    A: 10時と2時の位置
    B: 9時と3時の位置、または8時と4時の位置
    C: 12時と6時の位置
    D: 片手で12時の位置
  answer: B
  explanation: ステアリングホイールは9時と3時の位置、または8時と4時の位置で保持してください。これにより、エアバッグが作動した際に、手首や腕が負傷したり骨折したり、あるいは顔に強く当たったりするのを防ぐことができます。
- id: 426
  category: safe_driving_rules
  question: 何歳までのすべての子供が車両の後部座席に乗ることが推奨されていますか？
  choices:
    A: 8歳以下
    B: 10歳以下
    C: 12歳以下
    D: 15歳以下
  answer: C
  explanation: ほとんどの衝突事故は正面衝突であり、また子供は落ち着きがなくエアバッグの収納部に近づきすぎる可能性があるため、12歳以下のすべての子供は後部座席に乗ることが推奨されています。
- id: 427
  category: driver_testing
  question: 知識試験（学科試験）または路上試験で手話通訳者が必要な場合、どのくらい前にPennDOTに連絡する必要がありますか？
  choices:
    A: 少なくとも24時間前
    B: 少なくとも3日前
    C: 少なくとも1週間前
    D: 少なくとも2週間前
  answer: D
  explanation: 試験を受けたい時期の少なくとも2週間前にPennDOTに最初の連絡を行ってください。PennDOTは、あなたの希望する手話ができる人を確保できるよう最善を尽くします。
- id: 428
  category: driver_testing
  question: 知識試験の読み取りが困難な人のために、すべての運転免許センターで提供されている代替の試験方法は何ですか？
  choices:
    A: 持ち帰り試験
    B: 教科書持ち込み試験
    C: 音声試験
    D: グループ試験
  answer: C
  explanation: 読み取りが困難な方のために、リクエストに応じて、州内のすべての運転免許センターで音声試験が提供されています。
- id: 429
  category: penalties_and_points
  question: 障害者用の指定駐車区域に不法に駐車した場合の罰則は何ですか？
  choices:
    A: 初回違反は警告。
    B: 50ドルから200ドルの罰金、および車両がレッカー移動される可能性がある。
    C: 300ドルの罰金と30日間の免許停止。
    D: 運転記録に3ポイント加算。
  answer: B
  explanation: 障害者用駐車区域に不法に駐車された車両は、レッカー移動によって撤去される場合があります。この違反で有罪判決を受けた個人には、50ドルから200ドルの罰金が科せられます。
- id: 430
  category: penalties_and_points
  question: ペンシルベニア州のポイ捨て禁止法に基づき、車両から廃棄物を捨てて有罪となった場合の最大罰金額はいくらですか？
  choices:
    A: $50
    B: $100
    C: $200
    D: $300
  answer: D
  explanation: この法律への違反（あなたが運転者である車両内に同乗している他の人物の行為による違反を含む）は、有罪判決を受けた場合、最大300ドルの罰金が科せられる可能性があります。
- id: 431
  category: penalties_and_points
  question: あなたの車両の同乗者による行為を含め、ポイ捨てで有罪判決を受けた場合の最大罰金額はいくらですか？
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: 車内にいる他の人物の行為を含むポイ捨て禁止法違反は、有罪判決を受けると最大300ドルの罰金が科せられる場合があります。
- id: 432
  category: vehicle_information
  question: 公認の検査場で車両の安全点検を受ける頻度はどのくらいですか？
  choices:
    A: 6ヶ月ごと
    B: 12ヶ月ごと
    C: 2年ごと
    D: 3年ごと
  answer: B
  explanation: 車両は12ヶ月ごとに、公認の検査場で安全点検を受けなければなりません。
- id: 433
  category: vehicle_information
  question: 警察官に車両の整備不良を指摘された場合、交通違反切符を避けるために何日以内に修理する必要がありますか？
  choices:
    A: 3日
    B: 5日
    C: 10日
    D: 15日
  answer: B
  explanation: 警察官に車両の整備不良を指摘された場合、交通違反切符を避けるために5日以内に修理を求められることがあります。
- id: 434
  category: sharing_the_road
  question: 自転車を追い越す際、車両と自転車の間に空けなければならない最小距離はどれくらいですか？
  choices:
    A: 2フィート
    B: 3フィート
    C: 4フィート
    D: 6フィート
  answer: C
  explanation: 追い越す際は、安全に通過するために、車両と自転車の間に少なくとも4フィートの距離を空けなければなりません。
- id: 435
  category: sharing_the_road
  question: 自転車を追い越すために、中央の二重黄線を越えることは許可されていますか？
  choices:
    A: いいえ、二重黄線を越えることは常に違法です。
    B: はい、ただし自転車側が追い越すよう合図した場合に限ります。
    C: はい、必要であり、かつ4フィートの間隔を維持するために安全に行える場合に限ります。
    D: いいえ、緊急車両を運転している場合を除きます。
  answer: C
  explanation: 必要であり、かつ安全に行える場合に限り、自転車との間に4フィートの間隔を維持するために中央の二重黄線を越えることが許可されています。
- id: 436
  category: sharing_the_road
  question: 自転車が掲示された最低速度制限未満で走行している場合、交通違反として摘発されることがありますか？
  choices:
    A: はい、最低速度制限を維持しなければなりません。
    B: はい、交通を妨げている場合に限ります。
    C: いいえ、掲示された最低速度未満で走行することができ、交通妨害で摘発されることはありません。
    D: いいえ、ただし速度制限を下回って走行する場合は路肩を走らなければなりません。
  answer: C
  explanation: 自転車の運転者は車両の運転者とみなされ、すべての交通法規を遵守することが期待されますが、掲示された最低速度未満で走行することができ、交通妨害で摘発されることはありません。
- id: 437
  category: penalties_and_points
  question: ペンシルベニア州のテキストメッセージ送信禁止法（Anti-Texting Law）で有罪となった場合の罰金はいくらですか？
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: A
  explanation: テキストメッセージ送信禁止法違反は主要な略式罪（summary offense）であり、有罪判決には50ドルの罰金が科せられます。
- id: 438
  category: safe_driving_rules
  question: テキストメッセージ送信禁止法に基づき、警察官が行うことを許可されている行動は次のうちどれですか？
  choices:
    A: 証拠として運転者のモバイル機器を没収する。
    B: 物理的に組み込まれたGPS機器の使用に対して違反切符を発行する。
    C: テキスト送信に対して違反切符を発行するが、対話型ワイヤレス通信機器を没収することはできない。
    D: 州法よりも厳しく機器の使用を制限する地方条例を執行する。
  answer: C
  explanation: この法律は、対話型ワイヤレス通信機器（IWCD）の没収を許可していません。また、GPS機器は対象外であり、地方条例よりも州法が優先されます。
- id: 439
  category: penalties_and_points
  question: 危険な状況により閉鎖されている道路の標識を無視して走行し、その行動のために緊急対応要員が出動した場合の罰則は何ですか？
  choices:
    A: 250ドルの罰金と記録への2ポイント加算。
    B: 最大500ドルの罰金と緊急対応費用の支払い責任。
    C: 50ドルの罰金と30日間の免許停止。
    D: 300ドルの罰金と記録への4ポイント加算。
  answer: B
  explanation: あなたの行動によって緊急対応要員が出動した場合、罰金は最大500ドルに引き上げられ、緊急対応費用の払い戻し責任を負うことになります。
- id: 440
  category: sharing_the_road
  question: 「ダッチ・リーチ（Dutch Reach）」法は何を防ぐために考案されたものですか？
  choices:
    A: 密閉されたガレージ内での一酸化炭素中毒。
    B: 開いた車両のドアが接近中の自転車に衝突すること。
    C: 冠水した道路でのスリップ。
    D: 運転中のテキストメッセージ送信。
  answer: B
  explanation: 「ダッチ・リーチ」法は、ドアから遠い方の手でドアを開ける方法です。これにより体が自然に回転するため、接近してくる自転車を確認しやすくなり、ドアが勢いよく開くのを防ぐことができます。
- id: 441
  category: sharing_the_road
  question: 自転車は、開いた車のドアに衝突するのを避けるため、駐車中の車からどのくらい離れて走行すべきですか？
  choices:
    A: 少なくとも1フィート
    B: 少なくとも2フィート
    C: 少なくとも3フィート
    D: 少なくとも4フィート
  answer: C
  explanation: 自転車は、自転車専用レーンの有無にかかわらず、ドアとの接触を避けるために駐車中の車から少なくとも3フィート離れて走行する必要があります。
- id: 442
  category: driver_testing
  question: 18歳未満の場合、仮免許（learner's permit）を取得してから路上試験（Road Test）を受けるまでに、どのくらいの期間待つ必要がありますか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 9ヶ月
    D: 12ヶ月
  answer: B
  explanation: 18歳未満の場合、仮免許を取得してから6ヶ月間は路上試験を受けることができません。
- id: 443
  category: safe_driving_rules
  question: 旅行中に511PA情報サービスを利用する際、推奨される方法は何ですか？
  choices:
    A: 州間高速道路を走行中に511に電話する。
    B: 赤信号で停車中に511にテキストを送信する。
    C: 安全に道路脇に停車してシステムに電話するか、出発前に確認する。
    D: 運転中にハンズフリー機器を使用して511PAのウェブサイトを閲覧する。
  answer: C
  explanation: PennDOTは、運転中に511PAに電話しないようドライバーに促しています。システムに電話する場合は安全に道路脇に停車するか、出発前に交通遅延を確認してください。
- id: 444
  category: alcohol_drugs_health
  question: 一酸化炭素にさらされた場合の症状は、次のうちどれですか？
  choices:
    A: 極度の空腹
    B: 吐き気および／または嘔吐
    C: 夜間視力の向上
    D: 心拍数の低下
  answer: B
  explanation: 一酸化炭素にさらされた場合の症状には、疲労、めまい、頭痛、吐き気および／または嘔吐、心拍数の上昇、不規則な呼吸、混乱、咳、胸の痛みなどがあります。
- id: 445
  category: alcohol_drugs_health
  question: 雪の日に一酸化炭素中毒を防ぐために、何をすべきですか？
  choices:
    A: ガレージのドアを閉めたまま車を暖機運転する。
    B: 排気管（テールパイプ）を点検し、詰まっている雪や氷を取り除く。
    C: 渋滞でアイドリング中に、すべての窓を完全に閉めておく。
    D: 車のエアコンを最大設定にする。
  answer: B
  explanation: 雪の日は、一酸化炭素中毒を防ぐために、常に排気管を点検し、排気を妨げている可能性のある雪や氷を取り除いてください。
- id: 446
  category: safe_driving_rules
  question: 渋滞などでアイドリング中の車内にいる場合、一酸化炭素中毒を防ぐために何をすべきですか？
  choices:
    A: 車のヒーターを最高設定にする
    B: 窓を少し開ける
    C: すべての窓を完全に閉めておく
    D: 車内灯をつける
  answer: B
  explanation: マニュアルによると、渋滞に巻き込まれたり、アイドリング中の車内に座っていたりする場合は、一酸化炭素中毒を防ぐために必ず窓を少し開ける必要があります。
- id: 447
  category: vehicle_information
  question: マニュアルでは、車の一酸化炭素検知器の電池をいつ点検または交換することを推奨していますか？
  choices:
    A: オイル交換のたびに
    B: 冬の間、月に一度
    C: 春と秋の時計の時刻合わせの際
    D: 5,000マイル走行ごと
  answer: C
  explanation: マニュアルでは、電池式の一酸化炭素検知器の設置を検討し、毎年春と秋の時計の時刻合わせの際に電池を点検または交換することを推奨しています。
- id: 448
  category: alcohol_drugs_health
  question: 車内で一酸化炭素中毒の疑いがある場合、まず最初にすべきことは何ですか？
  choices:
    A: すぐに最寄りの病院まで運転する
    B: エンジンを切り、車内で待機する
    C: 窓を開けて運転を続ける
    D: すぐに車から出て、新鮮な空気を吸う
  answer: D
  explanation: 車内で一酸化炭素中毒の疑いがある場合、マニュアルは、直ちに車から出て新鮮な空気を吸い、すぐに救急医療を受けるよう指示しています。
- id: 449
  category: vehicle_information
  question: 危険な排気ガスが車内に入るのを防ぐために、どこに障害物がないことを確認すべきですか？
  choices:
    A: エアコンの吹き出し口
    B: 排気管（テールパイプ）
    C: ラジエーターグリル
    D: グローブボックス
  answer: B
  explanation: マニュアルは、一酸化炭素中毒につながる可能性があるため、車の排気管を塞いでいるものがないか注意するようドライバーに警告しています。
- id: 450
  category: alcohol_drugs_health
  question: マニュアルによると、「黙示の同意（Implied Consent）」法は何に関連していますか？
  choices:
    A: アルコールまたは薬物の化学検査
    B: 車両安全点検への同意
    C: 警察による車両捜索の許可
    D: 免許取得時の臓器提供
  answer: A
  explanation: マニュアルの索引には、黙示の同意法が「アルコールまたは薬物の化学検査」に関連するものとして明記されています。
- id: 451
  category: safe_driving_rules
  question: ペンシルベニア州の運転者用マニュアルには、ヘッドライトの使用義務と他のどの車両機能の使用を組み合わせた特定の法律が含まれていますか？
  choices:
    A: 方向指示器
    B: ワイパー
    C: 非常点滅表示灯（ハザードランプ）
    D: デフロスター（除霜装置）
  answer: B
  explanation: マニュアルの索引の法律セクションには、特定の「ヘッドライト/ワイパー法（Headlight/Windshield Wiper Law）」が記載されています。
- id: 452
  category: driver_responsibility
  question: マニュアルの中で、運転に悪影響を及ぼす可能性がある「運転者要因（Driver Factor）」として挙げられているのはどれですか？
  choices:
    A: 睡眠不足
    B: 高いタイヤ空気圧
    C: 過度な燃料消費
    D: エンジンのオーバーヒート
  answer: A
  explanation: 索引の「運転者要因（Driver Factors）」セクションでは、アルコール、薬物、不注意などと並んで「睡眠不足」が挙げられています。
- id: 453
  category: defensive_driving
  question: 運転者用マニュアルで「運転中の緊急事態（Driving Emergency）」に分類されているのはどれですか？
  choices:
    A: テールランプの球切れ
    B: アクセルペダルの戻りが悪い（固着）
    C: ウィンドウォッシャー液の不足
    D: ラジオの故障
  answer: B
  explanation: 索引の「運転中の緊急事態への対処（Driving Emergencies, Dealing With）」というセクションに「アクセルの固着（Accelerator
    Sticks）」が記載されています。
- id: 454
  category: safe_driving_rules
  question: ペンシルベニア州の運転者用マニュアルには、車両のどの部分に乗る乗客に関する特定の法律が概説されていますか？
  choices:
    A: 助手席
    B: 3列目シート
    C: 荷台が開放されたトラック（オープンベッド・トラック）
    D: サンルーフ付きの車両
  answer: C
  explanation: 索引の法律セクションには、「荷台が開放されたトラックの乗客（Passengers in an Open-Bed Truck）」に関する特定の項目が含まれています。
- id: 455
  category: driver_testing
  question: 運転免許試験およびサービスにおいて、マニュアルはどのような人を対象に通訳が利用可能であると示していますか？
  choices:
    A: 視覚障害者
    B: 聴覚障害者
    C: 身体障害者
    D: 英語を話さない人
  answer: B
  explanation: マニュアルの索引には、「聴覚障害者のための通訳（Interpreters for the Deaf/Hearing Impaired）」という項目が記載されています。
- id: 456
  category: penalties_and_points
  question: ペンシルベニア州の運転者用マニュアルに記載されている「ゼロ・トレランス（Zero Tolerance）」法は、何に適用されますか？
  choices:
    A: 学校区域での速度超過
    B: 運転中のテキストメッセージ送信
    C: 21歳未満のDUI（飲酒または薬物影響下の運転）
    D: 無保険運転
  answer: C
  explanation: 索引には、「ゼロ・トレランス（Zero Tolerance）」が「（21歳未満のDUI）」に適用されることが明記されています。
- id: 457
  category: safe_driving_rules
  question: マニュアルには、車両から何を除去することに関する特定の法律とガイドラインが記載されていますか？
  choices:
    A: バンパーステッカー
    B: 雪と氷
    C: 社外品のウィンドウフィルム（ティント）
    D: ルーフラック
  answer: B
  explanation: 索引の法律セクションには、「雪/氷の除去（Snow/Ice Removal）」に関する特定の法律が記載されています。
- id: 458
  category: defensive_driving
  question: 運転者が安全な車間距離を保つのに役立つルールとして、マニュアルで参照されているのはどれですか？
  choices:
    A: 「2秒ルール」
    B: 「3秒ルール」
    C: 「4秒ルール」
    D: 「10秒ルール」
  answer: C
  explanation: 索引には、マニュアルで扱われているトピックとして「4秒ルール（The Four-Second Rule）」が具体的に記載されています。
- id: 459
  category: license_system
  question: マニュアルの法律セクションによると、運転者は何の変更について通知を行う必要がありますか？
  choices:
    A: 車の色
    B: 雇用形態
    C: 氏名または住所
    D: 保険会社
  answer: C
