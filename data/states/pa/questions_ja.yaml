  explanation: 州法では、運転者が「車両の前方1,000フィートの距離にいる道路上の歩行者や車両を確認できない場合」にヘッドライトを使用することを義務付けています。
- id: 193
  category: safe_driving_rules
  question: ペンシルベニア州の法律に従い、ハイビームからロービームに切り替えなければならないのはどのような場合ですか？
  choices:
    A: 対向車から1,000フィート以内、および後続する車両から500フィート以内に近づいたとき。
    B: 対向車から500フィート以内、および後続する車両から300フィート以内に近づいたとき。
    C: 対向車から300フィート以内、および後続する車両から100フィート以内に近づいたとき。
    D: 相手のドライバーがヘッドライトを点滅させて合図してきたときのみ。
  answer: B
  explanation: マニュアルには次のように記載されています。「ペンシルベニア州法では、対向車から500フィート以内に近づいたとき、および前方車両を300フィート以内で追従しているときは、常にロービームを使用することが義務付けられています。」
- id: 194
  category: defensive_driving
  question: 対向車がハイビームをロービームに切り替えない場合、どうすべきですか？
  choices:
    A: 相手のドライバーを罰するために、自分のハイビームを点灯させる。
    B: 道路の右側の方を見る。
    C: 距離を判断するために、対向車のヘッドライトを直視する。
    D: 車両が通り過ぎるまで、一時的に目を閉じる。
  answer: B
  explanation: マニュアルでは次のようにアドバイスしています。「相手のドライバーがライトを下げない場合は、道路の右側の方を見てください。これにより、相手車両のヘッドライトで『目がくらむ』のを防ぐことができます。」
- id: 195
  category: defensive_driving
  question: 夜間の暗い道路でロービームを使用している際、「ヘッドライトの照射範囲を超えた運転（overdriving your headlights）」を避けるためには、時速何マイル以上で運転すべきではありませんか？
  choices:
    A: 時速35マイル
    B: 時速45マイル
    C: 時速55マイル
    D: 時速65マイル
  answer: B
  explanation: マニュアルでは、ロービームの照射範囲は約250フィート先までであると説明されており、「夜間の暗い道路でヘッドライトの照射範囲を超えた運転を避けるためには、時速45マイル以上で運転すべきではありません」とされています。
- id: 196
  category: defensive_driving
  question: 降雨時、路面が最も滑りやすくなるのは通常いつですか？
  choices:
    A: 1時間連続して雨が降った後。
    B: 雨が降り始めてからの最初の10分から15分間。
    C: 雨が止んで路面が乾き始めたときのみ。
    D: 時速60マイル以上の速度で運転しているとき。
  answer: B
  explanation: 道路状況のセクションによると、「路面は雨が降り始めてからの最初の10分から15分間で非常に滑りやすくなることがあります。」
- id: 197
  category: defensive_driving
  question: 寒冷で湿った天候の際、木や建物で日陰になっている道路区間を運転する際に特に注意が必要なのはなぜですか？
  choices:
    A: 野生動物が道路に集まりやすいため。
    B: 深い水たまりができやすいため。
    C: これらの場所は凍結しやすく、乾くのが最も遅いため。
    D: オイルが表面に浮き上がりやすくなるため。
  answer: C
  explanation: マニュアルには、寒冷で湿った天候の際、木や建物で日陰になっている道路区間は凍結しやすく、乾くのが最も遅いため、特に注意して運転する必要があると記載されています。
- id: 198
  category: safe_driving_rules
  question: 水深がわずか1/10インチの場合、車両がハイドロプレーニング現象を起こし始める可能性がある速度はどれくらいですか？
  choices:
    A: 時速25マイル
    B: 時速35マイル
    C: 時速45マイル
    D: 時速55マイル
  answer: B
  explanation: マニュアルには、水深がわずか1/10インチであっても、時速35マイルという低速でハイドロプレーニング現象が発生する可能性があると記されています。
- id: 199
  category: defensive_driving
  question: ハイドロプレーニング現象が起きたことに気づいた際、まず最初に行うべきことは何ですか？
  choices:
    A: 車両を止めるために、すぐにブレーキを強く踏む。
    B: トラクションを回復させるために、ハンドルを急に切る。
    C: 両手でハンドルを保持し、ゆっくりとアクセルペダルから足を離す。
    D: ギアをニュートラルに入れ、トラクションが戻るまで惰性で走行する。
  answer: C
  explanation: ハイドロプレーニング現象が起きた場合、マニュアルでは、両手でハンドルを保持し、ゆっくりとアクセルペダルから足を離して減速するように指示しています。
- id: 200
  category: safe_driving_rules
  question: 気温が華氏32度（摂氏0度）に近いときに運転するのが非常に危険なのはなぜですか？
  choices:
    A: ブラックアイスはこの温度でしか形成されないため。
    B: 降水が雨やみぞれに変わり、氷の上に薄い水の層ができることで、氷単独の場合よりも滑りやすくなるため。
    C: 車両のアンチロック・ブレーキ（ABS）が正常に機能しなくなるため。
    D: フロントガラスの洗浄液が接触した瞬間に凍結する可能性が最も高いため。
  answer: B
  explanation: マニュアルには、華氏32度付近で降水が雨やみぞれに変わる際、氷の上にできる薄い水の層は氷単独よりも滑りやすいため、非常に危険であると記載されています。
- id: 201
  category: defensive_driving
  question: 路面上の「ブラックアイス (black ice)」の存在をどのように特定できますか？
  choices:
    A: 路面は濡れているように見えるが、他の車両のタイヤから水しぶきが上がっていない
    B: 路面が異常に白く、質感があるように見える
    C: タイヤから大きなバリバリという音が聞こえる
    D: 路肩に急速に水たまりができ始める
  answer: A
  explanation: マニュアルによると、路面が濡れているように見えるのに他の車両のタイヤから水しぶきが上がっていない場合、「ブラックアイス」が存在する可能性があります。
- id: 202
  category: penalties_and_points
  question: 走行中の車両から雪や氷が落下し、他人に死亡または重傷を負わせた場合の罰則は何ですか？
  choices:
    A: 50ドルから100ドルの罰金
    B: 違反1回につき200ドルから1,000ドルの罰金
    C: 直ちに1年間の免許停止
    D: 30日間の義務的な禁錮刑
  answer: B
  explanation: 2006年7月10日に施行された法律に基づき、雪や氷が落下した車両の運転者は、それによって死亡または重傷を負わせた場合、違反1回につき200ドルから1,000ドルの罰金が科せられます。
- id: 203
  category: safe_driving_rules
  question: 濡れた路面を走行する際、車間距離をどのように調整すべきですか？
  choices:
    A: 標準的な3秒の車間距離を維持する
    B: 車間距離を5秒または6秒に延ばす
    C: 通常よりも約10倍のスペースを空ける
    D: 前走車の走行跡にとどまるために車間距離を詰める
  answer: B
  explanation: 路面が滑りやすくなっている場合、マニュアルでは濡れた路面では速度を時速5〜10マイル（mph）落とし、車間距離を5秒または6秒に延ばすことを推奨しています。
- id: 204
  category: vehicle_information
  question: 滑りやすい路面を走行する際、なぜクルーズコントロールの使用を避けるべきなのですか？
  choices:
    A: 寒い時期に車両のバッテリーの消耗を早めるため
    B: アンチロック・ブレーキ・システム（ABS）が無効になるため
    C: 車輪が空転し始めた場合でも出力を維持し続けるため、制御の回復を妨げるから
    D: トラクションが低いときにエンジンがオーバーヒートする原因となるため
  answer: C
  explanation: マニュアルでは、滑りやすい路面でクルーズコントロールを使用しないよう警告しています。これは、ホイールスピン（タイヤの空転）が発生した場合、作動中のクルーズコントロールシステムが出力を維持し続け、車輪が空転し続けることで制御の回復ができなくなるためです。
- id: 205
  category: defensive_driving
  question: 凍結路面や積雪路面で交差点に近づく際の推奨されるテクニックは何ですか？
  choices:
    A: 信号が変わる前に交差点を通過できるよう、素早く加速する
    B: 停止線に近づく際、ブレーキを細かく何度も踏む（ポンピングブレーキ）
    C: ギアをニュートラルに入れ、非常用ブレーキをかける
    D: 信号が青になり前方の車両が動き出すまで車両を惰性で走らせ、到着時間を調整する
  answer: D
  explanation: 凍結路面や積雪路面では、信号が青になり前方の車両が動き出すまで車両を惰性で走らせることで、交差点への到着時間を調整することが推奨されています。これにより、停止のためのブレーキやその後の加速を避けることができます。
- id: 206
  category: safe_driving_rules
  question: 濃霧に巻き込まれ、視界が効かない場合はどうすべきですか？
  choices:
    A: ハイビームを点灯し、ゆっくり走行を続ける
    B: 道路から完全に外れて停車し、ハザードランプを点灯させ、シートベルトを締めたままにする
    C: 車線の中央で停止し、霧が晴れるのを待つ
    D: 大型トラックのすぐ後ろを走り、そのテールランプをガイドとして利用する
  answer: B
  explanation: 濃霧に巻き込まれた場合、マニュアルでは道路から完全に外れ（できれば駐車場など）、ハザードランプを点灯させ、シートベルトを締めたままにすることが最善であると述べています。
- id: 207
  category: vehicle_information
  question: 霧の中を走行する際、なぜハイビーム（遠目）を使用してはいけないのですか？
  choices:
    A: 車両のバッテリーを過度に消耗させるため
    B: 光が霧の中で上方に向けられ、それが反射して目に入り、眩しさを生じさせるから
    C: 日中の使用は法律で禁止されているため
    D: ワイパーが自動的に停止してしまうため
  answer: B
  explanation: マニュアルには、霧の中でハイビームを使用しないよう明記されています。ハイビームは光を上方および霧の中に直接向けるため、その光が反射して自分の目に戻り、眩しさ（グレア）が生じて視界がさらに悪くなるためです。
- id: 208
  category: safe_driving_rules
  question: 汚れたヘッドライトは、光量をどの程度減少させますか？
  choices:
    A: 10パーセント
    B: 25パーセント
    C: 50パーセント以上
    D: 最大75パーセント
  answer: C
  explanation: 降雪条件に備えて車両を清掃することに関する説明の中で、マニュアルは汚れたヘッドライトが光量を50パーセント以上減少させると指摘しています。
- id: 209
  category: safe_driving_rules
  question: 日中の降雪時に走行する場合、なぜロービームを点灯させるべきなのですか？
  choices:
    A: ヘッドライトに付着した雪を溶かすため
    B: 他のドライバーからの視認性を高めるため
    C: 車両のデフロスターシステムを作動させるため
    D: バッテリーの凍結を防ぐため
  answer: B
  explanation: マニュアルでは、降雪時には日中であってもロービームを点灯することを推奨しています。これは、他のドライバーから自分の車が見えやすくなる（視認性が高まる）ためです。
- id: 210
  category: defensive_driving
  question: 走行中にスノースコール（局地的な激しい降雪）に遭遇した場合、どのような行動をとるべきですか？
  choices:
    A: 直ちに急ブレーキをかけて停止する
    B: できるだけ早くスコールを抜けるために加速する
    C: 徐々に減速し、ハザードランプを点灯させて細心の注意を払う
    D: 激しい雪を突き抜けるためにハイビームを点灯する
  answer: C
  explanation: マニュアルでは、スノースコールに遭遇した場合は、徐々に減速し、視認性を高めるためにハザードランプを点灯させて細心の注意を払うようアドバイスしています。また、急ブレーキをかけないよう特に警告しています。
- id: 211
  category: penalties_and_points
  question: ワイパーを連続的または断続的に使用している際に、ヘッドライトを点灯しなかった場合の、手数料等を含むおおよその罰金総額はいくらですか？
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: C
  explanation: マニュアルによると、ヘッドライトとワイパーの使用に関する法律に従わない運転者は25ドルの罰金が科せられますが、手数料やその他の関連費用を含めると、罰金総額は100ドル近くになります。
- id: 212
  category: safe_driving_rules
  question: フロントガラスのワイパーを連続的または断続的に使用する必要がある天候下で運転する場合、他に何をしなければなりませんか？
  choices:
    A: ハイビームを点灯する。
    B: ヘッドライトとテールランプを点灯する。
    C: デイタイム・ランニング・ライト（昼間点灯灯）のみに頼る。
    D: ハザードランプを点灯する。
  answer: B
  explanation: 法律により、天候のためにワイパーを使用する場合は常にヘッドライトを点灯することが義務付けられています。デイタイム・ランニング・ライトだけでは不十分であり、テールランプも点灯させる必要があります。
- id: 213
  category: safe_driving_rules
  question: 緊急現場や故障車を回収中のレッカー車に接近しており、隣接していない車線に移動できない場合は、どうしなければなりませんか？
  choices:
    A: 直ちに車両を停止させる。
    B: 掲示されている制限速度より少なくとも時速20マイル（20 mph）以上減速する。
    C: 速度を維持したままハザードランプを点灯する。
    D: クラクションを鳴らして緊急作業員に警告する。
  answer: B
  explanation: 緊急現場、警察の停車車両、またはレッカー車に接近する際は、隣接していない車線に移動しなければなりません。車線を移動できない場合は、掲示されている制限速度より少なくとも時速20マイル（20
    mph）以上減速しなければなりません。
- id: 214
  category: defensive_driving
  question: 右側に自転車、同時に前方から対向車が接近している状況では、どのように対処すべきですか？
  choices:
    A: 対向車が来る前に自転車を追い越せるよう加速する。
    B: 左車線に移動し、対向車を強制的に減速させる。
    C: 自転車が道路から外れるようクラクションを鳴らす。
    D: 減速して対向車を通過させ、その後、左側に移動して自転車を追い越す。
  answer: D
  explanation: このような状況では、一度に一つの交通状況にのみ対処するようにしてください。減速して対向車を通過させ、その後、十分なスペースを空けて左側に移動し、自転車を追い越します。
- id: 215
  category: signs_and_signals
  question: 車両の後部に表示されているオレンジ色の三角形は何を示していますか？
  choices:
    A: その車両が危険物を運搬していること。
    B: その車両が時速25マイル（25 mph）以下で走行するように設計されていること。
    C: その車両が故障しており、レッカー車を待っていること。
    D: その車両が幅広荷物（ワイドロード）であること。
  answer: B
  explanation: 農村地域では、時速25マイル（25 mph）以下で走行するように設計された農用トラクターや馬車などの後部に、オレンジ色の三角形が表示されます。
- id: 216
  category: defensive_driving
  question: 後続車が予想しないような場所でブレーキをかけることを伝えるには、どうすればよいですか？
  choices:
    A: ハザードランプを点灯する。
    B: 減速の手信号を使う。
    C: ブレーキペダルを素早く3、4回軽く踏む。
    D: クラクションを2回鳴らす。
  answer: C
  explanation: 他のドライバーが予想しない場所でブレーキをかける場合は、マニュアルに従い、ブレーキペダルを素早く3、4回軽く踏んで警告してください。
- id: 217
  category: safe_driving_rules
  question: アクセス制限のある高速道路（limited access highway）で、ハザードランプを使用しなければならないのはどのような時ですか？
  choices:
    A: 時速40マイル（40 mph）未満で走行している時。
    B: 左車線を走行している時。
    C: 大型トラックを追い越している時。
    D: 料金所に接近している時。
  answer: A
  explanation: アクセス制限のある高速道路で時速40マイル（40 mph）未満で走行しなければならない場合は、後続のドライバーに警告するためにハザードランプを使用しなければなりません。
- id: 218
  category: safe_driving_rules
  question: ペンシルベニア州の法律では、時速35マイル（35 mph）以上で走行している場合、曲がる何フィート前までに方向指示器を出さなければなりませんか？
  choices:
    A: 少なくとも50フィート前
    B: 少なくとも100フィート前
    C: 少なくとも200フィート前
    D: 少なくとも300フィート前
  answer: D
  explanation: 時速35マイル（35 mph）以上で走行している場合、ペンシルベニア州の法律では、曲がる少なくとも300フィート前までに合図を出すことが義務付けられています。
- id: 219
  category: safe_driving_rules
  question: 時速35マイル（35 mph）未満で走行している場合、曲がる何フィート前までに方向指示器を出さなければなりませんか？
  choices:
    A: 少なくとも50フィート前
    B: 少なくとも100フィート前
    C: 少なくとも200フィート前
    D: 少なくとも300フィート前
  answer: B
  explanation: ペンシルベニア州の法律では、時速35マイル（35 mph）未満で走行している場合、曲がる少なくとも100フィート前までに必ず方向指示器を使用しなければなりません。
- id: 220
  category: defensive_driving
  question: 高速道路で車両が故障し、路肩に寄せてハザードランプを点灯させた後、車両が故障していることを他のドライバーに知らせるために、他に何をすべきですか？
  choices:
    A: 車道に立ち、腕を振る。
    B: ボンネットを上げる。
    C: クラクションを鳴らし続ける。
    D: 屋根の上にオレンジ色の三角形を置く。
  answer: B
  explanation: 車両が故障した場合は、道路脇に寄せ、ハザードランプを点灯させ、ボンネットを上げて、他のドライバーに車両が故障していることを知らせる必要があります。
- id: 221
  category: safe_driving_rules
  question: マニュアルによると、右左折をする際に集中すべき最も重要な要素はおそらく何ですか？
  choices:
    A: 車両の大きさ
    B: 速度
    C: 路面の状況
    D: 時間帯
  answer: B
  explanation: マニュアルには次のように記載されています。「速度はおそらく最も重要な要素です。右左折する際は、車両の制御を維持できる速度まで減速してください...」
- id: 222
  category: safe_driving_rules
  question: 進みたい方向に複数の車線があるハイウェイに右左折して入る場合、どの車線に入るべきですか？
  choices:
    A: 中央の車線
    B: 自分から最も遠い車線
    C: その方向に進む車線のうち、最も近い車線
    D: その時点で空いている任意の車線
  answer: C
  explanation: 進みたい方向に複数の車線があるハイウェイに右左折して入る場合は、その方向に進む車線のうち、最も近い車線に入ってください。
- id: 223
  category: signs_and_signals
  question: 両側を外側の実線と内側の破線で区切られた、対面通行の道路の中央にある車線は、何のためにのみ使用できますか？
  choices:
    A: 低速車両の追い越し
    B: 左折
    C: 右折
    D: 緊急停車
  answer: B
  explanation: 両側を2本の線（外側の実線と内側の破線）で区切られた対面通行の道路の中央にある車線は、左折のためにのみ使用できることを意味します。
- id: 224
  category: safe_driving_rules
  question: 中央左折車線（センターターンレーン）を安全に使用するための正しいガイドラインは次のうちどれですか？
  choices:
    A: 場所を確保するために、できるだけ早く車線に入る
    B: 交通を遮断するために、車両の後部を走行車線に残しておく
    C: 交通を妨げないよう、完全に車線に入る
    D: 入る前に右折合図を出す
  answer: C
  explanation: 中央左折車線に入る際は、完全に車線内に入らなければなりません。車両の後部が通常の走行車線にはみ出し、交通を妨げることがないようにしてください。
- id: 225
  category: defensive_driving
  question: 「雪のスコール警報（Snow Squall Warning）」が発令された場合、特定の道路における危険な雪のスコールは通常どのくらい持続しますか？
  choices:
    A: 45分未満
    B: 1〜2時間
    C: 3〜4時間
    D: 丸一日
  answer: A
  explanation: 国立気象局（NWS）は、スコールが大きな影響を及ぼす可能性のある特定の道路に対して「雪のスコール警報」を発令します。通常、一つの道路における持続時間は45分未満です。
- id: 226
  category: safe_driving_rules
  question: 右左折をする際、どのくらい前から方向指示器（ウィンカー）を出すべきですか？
  choices:
    A: 1〜2秒前
    B: 3〜4秒前
    C: 5〜6秒前
    D: 10秒前
  answer: B
  explanation: 安全に右左折を完了するために、マニュアルでは右左折の3〜4秒前に合図を出さなければならないと規定されています。
- id: 227
  category: safe_driving_rules
  question: Uターンをする場所を選ぶ際、あらゆる方向から来るドライバーがあなたをはっきりと確認できるように、どのくらい離れている必要がありますか？
  choices:
    A: 少なくとも100フィート
    B: 少なくとも250フィート
    C: 少なくとも500フィート
    D: 少なくとも1,000フィート
  answer: C
  explanation: Uターンをする場所を選ぶ際は、あらゆる方向から来るドライバーが少なくとも500フィート離れており、あなたの姿をはっきりと確認できることを確認しなければなりません。
- id: 228
  category: defensive_driving
  question: 道路を横断する際、道路の途中で停車しても安全だとみなされるのはどのような場合ですか？
  choices:
    A: 交差点の中央に一時停止標識がある場合
    B: 横断する交通が低速で移動している場合
    C: 中央分離帯に車両全体が収まる大きさの右左折用車線がある場合
    D: 信号は青だが交通が渋滞している場合はいつでも
  answer: C
  explanation: 道路の途中で停車するのが安全なのは、中央分離帯に車両全体を収容できる大きさの右左折用車線が設けられている場合に限られます。
- id: 229
  category: defensive_driving
  question: 道路を横断しようと待っているときに、接近してくる車両が方向指示器を出している場合、最も安全な行動は何ですか？
  choices:
    A: 車両は確実に曲がるので、すぐに発進する
    B: 相手のドライバーが実際に曲がり始めるまで待ってから進む
    C: クラクションを鳴らして、自分が横断することを知らせる
    D: 相手が交差点に到達する前に横断できるよう、素早く加速する
  answer: B
  explanation: 方向指示器を出して接近してくる車両の前には飛び出さないでください。ドライバーが考えを変えたか、合図を消し忘れている可能性があります。相手のドライバーが実際に曲がり始めるまで待ってから進んでください。
- id: 230
  category: safe_driving_rules
  question: ハイウェイに合流するために加速車線を使用する際、次のうち違法となる行為はどれですか？
  choices:
    A: 交通の流れに合わせた速度まで加速すること
    B: 交通の切れ目を探すこと
    C: 加速車線で前方の車両を追い越すこと
    D: 合流前に方向指示器を使用すること
  answer: C
  explanation: ハイウェイの入り口ランプには加速車線があることがよくあります。マニュアルには、加速車線で前方の車両を追い越すことは違法であると明記されています。
- id: 231
  category: safe_driving_rules
  question: 45 mphで2車線道路を走行中に、遅い車両を安全に追い越すためには、前方にどれくらいの距離の空きが必要ですか？
  choices:
    A: 1/8マイル
    B: 1/4マイル
    C: 1/2マイル
    D: 1マイル
  answer: B
  explanation: 2車線道路での追い越しには的確な判断が必要です。45 mphの場合、遅い車両を安全に追い越すには1/4マイルの空き道路が必要です。
- id: 232
  category: safe_driving_rules
  question: 安全に追い越すためには、追い越す車両よりもおよそ時速何マイル（mph）速く走行する必要がありますか？
  choices:
    A: 5 mph速く
    B: 10 mph速く
    C: 15 mph速く
    D: 20 mph速く
  answer: B
  explanation: マニュアルによると、追い越す車両よりもおよそ10 mph速い速度で走行する必要があります。
- id: 233
  category: safe_driving_rules
  question: 次の条件のうち、他の車両を右側から追い越すことが許可されるのはどれですか？
  choices:
    A: 前方の車両が制限速度以下で走行しているとき
    B: 追い越そうとしているドライバーが左折中、または左折の合図を出しているとき
    C: 交差点から100フィート以内にいるとき
    D: 1車線道路で前方の車両が停止したとき
  answer: B
  explanation: 追い越そうとしているドライバーが左折中、または左折の合図を出している場合、路肩（berm/shoulder）からはみ出さない範囲で、右側から追い越すことができます。
- id: 234
  category: safe_driving_rules
  question: 交差点または鉄道踏切から何フィート以内の場所では、他の車両を追い越してはいけませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: B
  explanation: 公式な交通規制装置による許可がない限り、交差点や鉄道踏切の100フィート以内、またはそれらを通過中は追い越しをしてはいけません。
- id: 235
  category: safe_driving_rules
  question: 車両を追い越した後、元の車線に戻っても安全であるとどのように判断しますか？
  choices:
    A: 追い越した車両の1台分前方に達したとき
    B: 追い越したドライバーがヘッドライトを点滅させたとき
    C: バックミラー越しに、追い越した車両の両方のヘッドライトが見えたとき
    D: 追い越してから3秒が経過したとき
  answer: C
  explanation: 車線に戻る前に、追い越した車両のフロント部分にある両方のヘッドライトがバックミラーで見えることを確認してください。
- id: 236
  category: safe_driving_rules
  question: 円形交差点（またはラウンドアバウト）において、誰が優先権を譲らなければなりませんか？
  choices:
    A: すでに円内にいるドライバーが、進入してくるドライバーに譲る。
    B: 円内に進入するドライバーが、すでに円内にいるドライバーに譲る。
    C: 右側から進入するドライバーが、左側から進入するドライバーに譲る。
    D: すべてのドライバーが停止し、右側の車両に譲る。
  answer: B
  explanation: 円形交差点（またはラウンドアバウト）に進入するドライバーは、すでに円内にいるドライバーに優先権を譲らなければなりません。
- id: 237
  category: safe_driving_rules
  question: 直進したいのに、誤って右左折専用車線に入ってしまった場合、どうしなければなりませんか？
  choices:
    A: 停止し、交通が途切れるのを待ってから直進車線に合流する。
    B: 注意深く交差点を直進する。
    C: そのまま右左折しなければならない。
    D: 車両を後退させて車線変更する。
  answer: C
  explanation: 交差点を直進したい場合に、誤って右左折専用車線に入ってしまったときは、その車線の指示通りに曲がらなければなりません。
- id: 238
  category: safe_driving_rules
  question: 2車線の左折専用車線から左折する場合、旋回中に車線変更をしないことが重要なのはなぜですか？
  choices:
    A: 隣で旋回しているドライバーと衝突する原因になるため。
    B: 交差点内で方向指示器を使用することは違法であるため。
    C: ジャグハンドル（jughandle）への進入を余儀なくされるため。
    D: 対向車に対する優先権を失うため。
  answer: A
  explanation: マニュアルには、2車線の左折専用車線から左折する際、旋回中に車線変更をしてはならないと記されています。これは、隣で旋回しているドライバーと衝突する原因になるためです。
- id: 239
  category: driver_responsibility
  question: ペンシルベニア州における16歳のドライバーが関与する事故の3分の1以上において、ティーンエイジャーのドライバーは何をしていましたか？
  choices:
    A: 左カーブでスピードを出しすぎていた。
    B: 一時停止標識から発進した、または対向車線を横切って左折した。
    C: ラウンドアバウトで優先権を譲らなかった。
    D: 交差点内で自転車を追い越した。
  answer: B
  explanation: 交差点は、ティーンエイジャーのドライバーの事故発生率が高い場所です。これらの事故の3分の1以上において、ティーンエイジャーのドライバーは一時停止標識から発進したか、あるいは対向車線を横切って左折していました。
- id: 240
  category: safe_driving_rules
  question: 分離ハイウェイ（中央分離帯のある道路）へ左折して進入する際の正しい手順は何ですか？
  choices:
    A: 中央で止まらずに、両方の車線を一度に横切る。
    B: 最初に差し掛かった車線へ左折する。
    C: 最初の車線を安全なタイミングで横切り、中央分離帯の反対側で2番目の車線の交通に安全な隙間ができるのを待ってから左折する。
    D: 道路の左側にあるジャグハンドル（jughandle）に進入する。
  answer: C
  explanation: 分離ハイウェイへ正しく左折するには、まず最初の車線に安全な隙間があるときに横切り、次に中央分離帯の反対側で2番目の車線の交通に安全な隙間ができたときに左折する必要があります。
- id: 241
  category: defensive_driving
  question: 時速30マイルの道路で、二方向一時停止標識のある交差点を横断する場合、両方向にどの程度の車間（ギャップ）が必要ですか？
  choices:
    A: 3秒の間隔
    B: 6秒の間隔
    C: 9秒の間隔
    D: 12秒の間隔
  answer: B
  explanation: 二方向一時停止標識のある交差点を横断する場合、時速30マイルの道路を横切るには、両方向に約6秒の間隔が必要です。
- id: 242
  category: defensive_driving
  question: 右折する際、左から接近してくる車両との間に、およそどのくらいの車間を空けるべきですか？
  choices:
    A: 4秒
    B: 6秒
    C: 8秒
    D: 10秒
  answer: C
  explanation: 右折する際は、左から接近してくる車両との間に約8秒の間隔を空ける必要があります。
- id: 243
  category: safe_driving_rules
  question: 反対方向から来る別の左折車との「タングルターン（もつれ右折）」を避けるにはどうすればよいですか？
  choices:
    A: 交差点の中心を過ぎてから曲がる。
    B: 交差点の中心にある仮想の「X」印に達する前に曲がる。
    C: 中心線から最も遠い車線に入る。
    D: 相手のドライバーが先に曲がり終えるまで待つ。
  answer: B
  explanation: 交差点の中心に「X」印を想定し、その「X」に達する前に曲がることで、別の左折車との「タングルターン」を避けることができます。
- id: 244
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）の譲れ線（イールドライン）まで進んだとき、誰に優先権がありますか？
  choices:
    A: ラウンドアバウトに進入しようとしている車両
    B: ラウンドアバウト内を走行中の車両
    C: 右側から接近してくる車両
    D: ラウンドアバウトから出ようとしている車両
  answer: B
  explanation: ラウンドアバウトの譲れ線まで進んだときは、左側を見て接近してくる交通を確認しなければなりません。これは、環状内を走行中の車両に優先権があるためです。
- id: 245
  category: signs_and_signals
  question: ラウンドアバウトの出口に近づく際、どの合図を出すべきですか？
  choices:
    A: 左折合図
    B: 右折合図
    C: ハザードランプ
    D: 合図は不要
  answer: B
  explanation: ラウンドアバウトの出口に近づく際は、右折合図（右ウィンカー）を出さなければなりません。
- id: 246
  category: sharing_the_road
  question: ラウンドアバウト内を走行中に緊急車両が接近してきた場合、どうすべきですか？
  choices:
    A: 通過させるために、直ちにラウンドアバウト内で停止する。
    B: 緊急車両が進入する前にラウンドアバウトを出るために加速する。
    C: 直ちにラウンドアバウトを出てから、脇に寄せる。
    D: ラウンドアバウトの中央島に寄せる。
  answer: C
  explanation: ラウンドアバウト内にいるときに緊急車両が接近してきた場合は、直ちにラウンドアバウトを出てから脇に寄せなければなりません。ラウンドアバウト内では決して停止しないでください。
- id: 247
  category: sharing_the_road
  question: ラウンドアバウト内を車両として走行している自転車利用者に関するルールは何ですか？
  choices:
    A: 歩行者用横断歩道に移動するよう、クラクションを鳴らして警告すべきである。
    B: 左側に十分なスペースがあれば、追い越してもよい。
    C: 車両として走行している自転車利用者を決して追い越してはならない。
    D: 自転車利用者がラウンドアバウト内を車両として走行することは許可されていない。
  answer: C
  explanation: 自転車利用者は、ラウンドアバウト内を車両として走行することを選択できます。運転者は、ラウンドアバウト内を車両として走行している自転車利用者を決して追い越してはなりません。
- id: 248
  category: safe_driving_rules
  question: 交通量の多い商業道路にある「ジャグハンドル（jughandle）」の目的は何ですか？
  choices:
    A: 主要道路に交差するように戻る右折車線を使用して、車両が左折できるようにするため。
    B: 車両が物理的な障壁を越えて安全にUターンできる場所を提供するため。
    C: 交差点での激しい渋滞を緊急車両が回避できるようにするため。
    D: 自転車利用者と歩行者のための専用車線を作るため。
  answer: A
  explanation: ジャグハンドルの設計では、対向車線を横切って直接左折する代わりに、主要道路に信号機で交差するように戻る右折車線を使用して左折します。
- id: 249
  category: defensive_driving
  question: カーブで制御を維持するために減速するのに最適なタイミングはいつですか？
  choices:
    A: カーブに入った直後。
    B: カーブの頂点（中間点）。
    C: カーブに入る前。
    D: カーブを出るとき。
  answer: C
  explanation: カーブで制御を維持するには減速が必要であり、それはカーブに入る前に行うべきです。
- id: 250
  category: defensive_driving
  question: 右カーブを安全に走行する際、車両をどこに位置させるべきですか？
  choices:
    A: 車線の中央。
    B: 車線中央からやや右寄り。
    C: 車線中央からやや左寄り。
    D: 路肩。
  answer: B
  explanation: カーブを安全に走行するためには、右カーブでは車線中央からやや右寄りを走行し、左カーブでは車線の中央を走行すべきです。
- id: 251
  category: driver_responsibility
  question: ペンシルベニア州の16歳のドライバーにおいて、最も頻度の高い事故の種類は何ですか？
  choices:
    A: 停止信号での追突事故。
    B: 分離ハイウェイでの正面衝突事故。
    C: 単独車両による道路逸脱事故。
    D: 交差点での右左折時の接触事故。
  answer: C
  explanation: マニュアルの「10代の事故に関する事実」によると、ペンシルベニア州の16歳のドライバーで最も頻度の高い事故の種類は、単独車両による道路逸脱事故です。
- id: 252
  category: safe_driving_rules
  question: ハイウェイに進入する車両と退出する車両が短い「織り込み車線（weaving lane）」を共有しなければならない場合、どちらが優先権を譲らなければなりませんか？
  choices:
    A: ハイウェイから退出するドライバー
    B: ハイウェイに進入するドライバー
    C: より速い速度で走行しているドライバー
    D: より遅い速度で走行しているドライバー
  answer: B
  explanation: マニュアルには、織り込み車線を共有する場合、ハイウェイに進入する側のドライバーは、退出する側のドライバーに道を譲らなければならないと記載されています。
- id: 253
  category: safe_driving_rules
  question: ハイウェイで出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 停車し、路肩を慎重にバックする
    B: 中央分離帯を越えてUターンする
    C: 出口に間に合わせるために、直前で車線を横切る
    D: 次の出口まで進む
  answer: D
  explanation: 出口を通り過ぎてしまった場合は、次の出口を利用してください。停車、バック、急な車線変更、中央分離帯の横断などは違法であり危険なため、絶対に行わないでください。
- id: 254
  category: safe_driving_rules
  question: ハイウェイを降りる際、減速する適切なタイミングはいつですか？
  choices:
    A: 出口ランプの1マイル手前
    B: 車線変更をする前、まだ本線車線にいる間
    C: 出口車線に入った後
    D: 出口の標識が見えたらすぐ
  answer: C
  explanation: マニュアルでは、余裕を持って適切な出口車線に入り、出口車線に移動し終えるまでは減速しないよう指示しています。
- id: 255
  category: defensive_driving
  question: 「高速道路催眠現象（highway hypnosis）」の原因は何ですか？
  choices:
    A: 処方薬の影響下での運転
    B: 長時間、前方の道路をじっと見続け、ぼんやりすること
    C: 時速65マイルを超える速度で1時間以上運転すること
    D: ミラーと道路の間を素早く何度も見ること
  answer: B
  explanation: 高速道路催眠現象は、長時間前方の道路をじっと見続け、車両の前方、後方、周囲を積極的に確認しなくなったときに起こります。
- id: 256
  category: safe_driving_rules
  question: 縁石のある道路に駐車する場合、車両と縁石の間の最大距離はどれくらいですか？
  choices:
    A: 6インチ
    B: 12インチ
    C: 18インチ
    D: 24インチ
  answer: B
  explanation: 縁石のある道路では、できるだけ縁石に近づけて駐車しなければなりませんが、その距離は12インチ以内に収める必要があります。
- id: 257
  category: safe_driving_rules
  question: 車道上に駐車しなければならない場合、両方向から少なくとも何フィート先から車両が見える状態でなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: 車道上に駐車しなければならない場合は、非常点滅表示灯（ハザードランプ）を使用し、両方向から少なくとも500フィート先から車両が確認できることを確実にしてください。
- id: 258
  category: safe_driving_rules
  question: 縁石の有無にかかわらず、下り坂で車両を駐車する場合、ハンドルをどのように切るべきですか？
  choices:
    A: 車輪を完全に左に切る
    B: 車輪を完全に右に切る
    C: 車輪をまっすぐ前方に向けたままにする
    D: 車輪を道路と平行にする
  answer: B
  explanation: 縁石の有無にかかわらず、下り坂に駐車する場合は、車輪が完全に右を向くようにハンドルを切る必要があります。
- id: 259
  category: safe_driving_rules
  question: 消火栓から何フィート以内に駐車することは違法ですか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 30フィート
  answer: B
  explanation: 消火栓から15フィート以内での停車、停車維持、または駐車は禁止されています。
- id: 260
  category: safe_driving_rules
  question: 道路脇にある点滅信号、一時停止標識、譲れ標識、または交通規制装置から何フィート以内に駐車してはいけませんか？
  choices:
    A: 15フィート
    B: 20フィート
    C: 30フィート
    D: 50フィート
  answer: C
  explanation: 道路脇にある点滅信号、一時停止標識、譲れ標識、または交通規制装置から30フィート以内に駐車することは違法です。
- id: 261
  category: safe_driving_rules
  question: 踏切の最も近いレールから、少なくとも何フィート離して駐車しなければなりませんか？
  choices:
    A: 少なくとも15フィート
    B: 少なくとも20フィート
    C: 少なくとも30フィート
    D: 少なくとも50フィート
  answer: D
  explanation: 踏切の最も近いレールから50フィート以内では、車両を停車、停止、または駐車してはいけません。
- id: 262
  category: safe_driving_rules
  question: 稼働中の工事区間を走行する際、何を点灯させなければなりませんか？
  choices:
    A: 非常点滅表示灯（ハザードランプ）
    B: ハイビーム（走行用前照灯）
    C: デイタイム・ランニング・ライトだけでなく、車両のヘッドライト
    D: 車内のルームランプ
  answer: C
  explanation: 法律により、稼働中の工事区間を走行する際は、デイタイム・ランニング・ライトだけでなく、車両のヘッドライトを点灯させなければなりません。
- id: 263
  category: penalties_and_points
  question: 稼働中の工事区間内での速度超過などの特定の違反に対する罰則は何ですか？
  choices:
    A: 罰金が2倍になる
    B: 罰金が3倍になる
    C: 車両が直ちに押収される
    D: 運転免許試験を再受験しなければならない
  answer: A
  explanation: 速度超過を含む稼働中の工事区間内での特定の違反に対しては、罰金が2倍になります。
- id: 264
  category: signs_and_signals
  question: 工事区間に接近する際、警告標識、前方警告車両、または可変情報板は、最低でもどのくらい手前に設置されることがありますか？
  choices:
    A: 最低50フィート
    B: 最低100フィート
    C: 最低200フィート
    D: 最低500フィート
  answer: C
  explanation: 工事区間に接近する際、警告標識、前方警告車両、または可変情報板は、最低200フィート手前に設置されることがあります。
- id: 265
  category: signs_and_signals
  question: 高速道路のランプに進入する際、正しい方向に進んでいることをどのように確認できますか？
  choices:
    A: 右側に黄色の線、左側に白色の線が見える
    B: 右側に白色の線、左側に黄色の線が見える
    C: ランプの両側に黄色の実線の二重線が見える
    D: ランプの両側に白色の破線が見える
  answer: B
  explanation: 高速道路の進入ランプで、右側に白色の線、左側に黄色の線が見える場合は、正しい方向に進んでいます。
- id: 266
  category: safe_driving_rules
  question: 工事区間を走行する際、車間距離についてどのようにすべきですか？
  choices:
    A: 通常の車間距離を維持する
    B: 車間距離を2倍にする
    C: 車間距離を3倍にする
    D: 車間距離を半分に減らす
  answer: B
  explanation: マニュアルには、工事区間では車間距離を2倍にするよう記載されています。これは、工事区間で最も多い事故のタイプが追突事故であるためです。
- id: 267
  category: signs_and_signals
  question: 工事区間において、従来の交通規制装置よりも優先される権限を持つのは誰ですか？
  choices:
    A: 交通誘導員（フラッガー）
    B: 建設作業員
    C: 先導車（エスコート車両）
    D: 電光掲示板
  answer: A
  explanation: 工事区間では交通誘導員（フラッガー）に従わなければなりません。彼らの権限は、従来の交通規制装置よりも優先されます。
- id: 268
  category: defensive_driving
  question: 踏切に接近する際、どの方向を見るべきですか？
  choices:
    A: 右、左、そしてもう一度右
    B: 前方のみ
    C: 左、右、そしてもう一度左
    D: 左と右を同時に
  answer: C
  explanation: マニュアルでは、信号が点滅していなくても、踏切に接近する際は常に左、右、そしてもう一度左を見るようアドバイスしています。
- id: 269
  category: defensive_driving
  question: 踏切内で車両が動けなくなり、列車が接近している場合、どうすべきですか？
  choices:
    A: 車内にとどまり、衝撃に備える
    B: 速やかに車を離れ、線路からできるだけ遠くに避難する
    C: 列車が100フィートの距離に来るまで、車両の再始動を試みる
    D: クラクションを鳴らして列車の運転士に警告する
  answer: B
  explanation: 誤って踏切内で立ち往生し、列車が接近している場合は、速やかに車を離れ、線路からできるだけ遠くに避難しなければなりません。
- id: 270
  category: sharing_the_road
  question: 歩行者に対して、走行車線に入るよう手招きしても安全なのはいつですか？
  choices:
    A: 標識のある横断歩道のみ
    B: 完全に停止したとき
    C: 他に接近してくる車両がない場合のみ
    D: 歩行者を走行車線に手招きすることが安全な状況はない
  answer: D
  explanation: マニュアルには、いかなる時も、特に横断歩道のない場所やブロックの途中などで、歩行者を走行車線に手招きすることは決して安全ではないと明記されています。
- id: 271
  category: sharing_the_road
  question: 停止している車両に後方から近づく際、どうすべきですか？
  choices:
    A: クラクションを鳴らし、左側から素早く追い越す
    B: 減速し、車両の前を歩行者が横断していないことを確認するまで追い越さない
    C: 十分なスペースがあれば、右側の路肩から追い越す
    D: ハイビームを点滅させ、追い越すことを運転者に知らせる
  answer: B
  explanation: 停止している車両に後方から近づく際は、減速し、その車両の前を歩行者が横断していないことを確認するまで追い越してはいけません。
- id: 272
  category: sharing_the_road
  question: トラックを追い越した後、安全にトラックの車線に戻れるのはいつですか？
  choices:
    A: 自分の車のリアバンパーがトラックのフロントバンパーを通過したらすぐ
    B: バックミラー（ルームミラー）にトラックのヘッドライトまたはフロントグリルが見えたとき
    C: トラックの運転手がヘッドライトを点滅させたとき
    D: 5秒間速度を維持した後
  answer: B
  explanation: トラックを追い越した後は、バックミラーにトラックのヘッドライトまたはフロントグリルが見えるようになってから車線変更をしてください。
- id: 273
  category: sharing_the_road
  question: 下り坂でトラックを追い越す際、速度を上げる必要があるのはなぜですか？
  choices:
    A: トラックの慣性により、トラックの速度が上がるため
    B: トラックが追い越しを妨げるために意図的に加速するため
    C: 坂道でトラックをゆっくり追い越すことは違法であるため
    D: 下り坂では乱気流が強くなるため
  answer: A
  explanation: 下り坂では、トラックの慣性によって速度が上がるため、安全に追い越すために速度を上げる必要がある場合があります。
- id: 274
  category: sharing_the_road
  question: 自転車を追い越した直後に、急減速や急停車を避けるべきなのはなぜですか？
  choices:
    A: 自転車がバランスを崩す原因になるため
    B: 自転車が自車に追突する可能性があるため
    C: 非動力車両の前でブレーキをかけることは違法であるため
    D: 過度な乱気流が発生するため
  answer: B
  explanation: 自転車を追い越した後は、急減速や急停車をしないでください。急停車すると、自転車が自車に追突する恐れがあります。
- id: 275
  category: sharing_the_road
  question: オートバイやモペッド（原動機付自転車）の運転者に対して、車線のスペースをどの程度空ける必要がありますか？
  choices:
    A: 車線の半分
    B: 車線1つ分すべて
    C: 車線の右側のみ
    D: センターラインまでの必要なだけのスペース
  answer: B
  explanation: 法律により、オートバイやモペッドの運転者には車線1つ分すべてを使用することを認めなければなりません。
- id: 276
  category: sharing_the_road
  question: オートバイの方向指示器（ウィンカー）が点滅しているからといって、曲がると決めつけてはいけないのはなぜですか？
  choices:
    A: オートバイの運転者は減速を示すために方向指示器をよく使うため
    B: 乗用車のように方向指示器が自動的に消えない場合があるため
    C: 点滅する信号はオートバイに優先権があることを示しているため
    D: オートバイの運転者はバッテリーのテストに方向指示器を使用するため
  answer: B
  explanation: オートバイやモペッドの方向指示器は、一般の車両のように自動的に消えないことがあるため、点滅しているからといって曲がると決めつけてはいけません。
- id: 277
  category: sharing_the_road
  question: 大型トラックが自車を追い越しているとき、どうすべきですか？
  choices:
    A: 邪魔にならないように速度を上げる
    B: 速度を少し落とし、一定の速度を保つ
    C: トラックが素早く追い越せるように急ブレーキをかける
    D: トラックの死角に入る
  answer: B
  explanation: トラックが自車を追い越すときは、速度を少し落として一定の速度を保つようにすると、トラックの運転手にとって追い越しやすくなります。加速してはいけません。
- id: 278
  category: safe_driving_rules
  question: 工事区間を走行する際に守らなければならない安全規則は次のうちどれですか？
  choices:
    A: 一定の速度を保つために、常にクルーズコントロールを使用する
    B: クルーズコントロールを使用しない
    C: 道に迷った場合は、作業員に道を尋ねるために停車する
    D: 工事用機材を避けるために実線の白線を越える
  answer: B
  explanation: マニュアルには工事区間におけるいくつかの安全規則が記載されており、その中には「工事区間ではクルーズコントロールを使用しないこと」が含まれています。
- id: 279
  category: defensive_driving
  question: 列車との衝突事故で死亡する確率は、他の車両との衝突事故と比較して何倍高いですか？
  choices:
    A: 10倍
    B: 20倍
    C: 30倍
    D: 40倍
  answer: D
  explanation: マニュアルによると、列車との衝突事故で死亡する確率は、他の車両との衝突事故よりも40倍高くなります。
- id: 280
  category: sharing_the_road
  question: オートバイの後方を走行する際、推奨される最小の車間距離はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 6秒
  answer: C
  explanation: オートバイやモペッドの後方を走行する際は、他の車両と同様に4秒以上の車間距離を空ける必要があります。
- id: 281
  category: sharing_the_road
  question: 自車と対向車のトラックとの間に発生する乱気流は、車両にどのような影響を与えますか？
  choices:
    A: 車両同士を引き寄せる。
    B: 車両同士を押し離す。
    C: トラックに急ブレーキをかけさせる。
    D: 乗用車には影響を与えない。
  answer: B
  explanation: マニュアルには、「乱気流は車両を押し離すものであり、引き寄せるものではないことを覚えておいてください」と記載されています。
- id: 282
  category: sharing_the_road
  question: トラックの後方を走行している際、トラックの運転手に自車を確実に認識してもらうにはどうすればよいですか？
  choices:
    A: ハイビームを点灯して目立つようにする。
    B: 数分おきにクラクションを鳴らす。
    C: トラックのサイドミラーが見える位置に自車を配置する。
    D: 運転手の視界に直接入るよう、トラックに密着して追従（テールゲート）する。
  answer: C
  explanation: マニュアルには、「トラックやバスの後方を走行中、前方の車両のサイドミラーが見えない場合、その大型車両の運転手からもあなたの姿は見えていません」と記載されています。
- id: 283
  category: defensive_driving
  question: 坂道で停車する際、自車とトラックの間に十分な距離を空けるべきなのはなぜですか？
  choices:
    A: トラックの排気ガスがフロントガラスを傷める可能性があるため。
    B: 運転手がブレーキから足を離した際に、トラックが後退する可能性があるため。
    C: トラックが大きく回転するために余分なスペースが必要なため。
    D: トラックのエアブレーキが大きな音を出すため。
  answer: B
  explanation: マニュアルには、「坂道で停車する際は、トラックとの間に十分な距離を空けてください。運転手がブレーキから足を離した際に、トラックが後退する可能性があるためです」と記載されています。
- id: 284
  category: safe_driving_rules
  question: トラックの後方の死角に入らないために推奨される最小の車間距離（時間）はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: C
  explanation: マニュアルには、「トラックの後方の死角に入らないようにするためには、少なくとも4秒間の車間距離が必要です...」と記載されています。
- id: 285
  category: sharing_the_road
  question: トラックが大きく右折しようとしているとき、時としてどのように見えることがありますか？
  choices:
    A: 直進または左折しようとしているように見える
    B: バックする準備をしているように見える
    C: ブレーキ故障を起こしているように見える
    D: 他の車両を追い越すために加速しているように見える
  answer: A
  explanation: マニュアルには、「トラックが実際に右折しようとしているときでも、直進または左折しようとしているように見えることがあります」と記載されています。
- id: 286
  category: vehicle_information
  question: 晴天の乾燥した路面を時速65マイル（65 mph）で走行中、タイヤの状態が良くブレーキが適切に調整された積載状態のトラックが停止するために必要な最小停止距離はどれくらいですか？
  choices:
    A: 200フィート
    B: 400フィート
    C: 600フィート
    D: 800フィート
  answer: C
  explanation: マニュアルには、時速65マイルで晴天の乾燥した道路を走行している積載状態のトラックが完全に停止するには、最低600フィートが必要であると記載されています。
- id: 287
  category: safe_driving_rules
  question: 長い下り坂にある緊急避難所（エスケープランプ）の目的は何ですか？
  choices:
    A: 乗用車が休憩を取るため。
    B: 警察がスピード違反車両を監視するため。
    C: 制御不能になった大型車両や、ブレーキ故障を起こした大型車両のため。
    D: 特殊大型荷物を積んだ車両が、後続車を追い越させるため。
  answer: C
  explanation: マニュアルには、「これらのランプは、制御不能になった大型車両や、ブレーキの故障により停止できなくなった大型車両のみが使用するためのものです」と記載されています。
- id: 288
  category: safe_driving_rules
  question: スクールバスが赤色灯を点滅させ、ストップアームを出して停車している場合、どれくらい離れて停車しなければなりませんか？
  choices:
    A: 少なくとも10フィート離れる
    B: 少なくとも15フィート離れる
    C: 少なくとも20フィート離れる
    D: 少なくとも50フィート離れる
  answer: A
  explanation: マニュアルには、「バスの後方にいるか、同じ道路をバスに向かって進んでいるかにかかわらず、バスから少なくとも10フィート離れて停車しなければなりません...」と記載されています。
- id: 289
  category: safe_driving_rules
  question: スクールバスが赤色灯を点滅させ、ストップアームを出して停車している場合でも、停車する必要が「ない」のはどのような条件のときですか？
  choices:
    A: バスと同じ方向に走行しているとき。
    B: バスが停車している交差点に近づいているとき。
    C: 中央分離帯のあるハイウェイの反対側を走行しているとき。
    D: 指定されたスクールゾーン内を走行しているとき。
  answer: C
  explanation: マニュアルには、「スクールバスに近づいており...中央分離帯のあるハイウェイの反対側を走行している場合は...停車する必要はありません」と記載されています。
- id: 290
  category: penalties_and_points
  question: 赤色灯を点滅させ、ストップアームを出しているスクールバスに対して停車しなかった場合の罰則は何ですか？
  choices:
    A: 30日間の免許停止、3ポイントの加算、および罰金
    B: 60日間の免許停止、5ポイントの加算、および罰金
    C: 90日間の免許停止、2ポイントの加算、および罰金
    D: 6ヶ月の免許停止、6ポイントの加算、および罰金
  answer: B
  explanation: マニュアルには、「赤色灯を点滅させ、ストップアームを出しているスクールバスに対して停車しなかった場合、60日間の運転免許停止、運転記録への5ポイントの加算、および罰金が科せられます」と記載されています。
- id: 291
  category: safe_driving_rules
  question: ムーブ・オーバー法（Move Over law）に基づき、緊急車両の活動エリアに隣接していない車線に移動できない場合、どうしなければなりませんか？
  choices:
    A: 緊急事態が解消されるまで、直ちに車両を停止させる。
    B: 速度を維持したまま、非常点滅表示灯（ハザードランプ）を点灯させる。
    C: 掲示されている制限速度より少なくとも時速20マイル（20 mph）以上減速する。
    D: クラクションを鳴らして、緊急作業員に自分の存在を知らせる。
  answer: C
  explanation: マニュアルには、「交通状況やその他の条件により車線を移動できない場合、運転者は掲示されている制限速度より少なくとも時速20マイル以上減速しなければならない」と記載されています。
- id: 292
  category: penalties_and_points
  question: ムーブ・オーバー法違反で有罪となった場合、運転記録に何点が加算されますか？
  choices:
    A: 2点
    B: 3点
    C: 4点
    D: 5点
  answer: A
  explanation: マニュアルには、「この法律の違反で有罪となった者は、運転記録に2点が加算される」と記載されています。
- id: 293
  category: penalties_and_points
  question: 工事区間内で発生したムーブ・オーバー法違反を含む交通違反の罰金はどうなりますか？
  choices:
    A: 作業員がいない場合は免除される。
    B: 半分に減額される。
    C: 通常の道路と同じままである。
    D: 2倍になる。
  answer: D
  explanation: マニュアルには、「さらに、工事区間内で発生した交通違反については、罰金が2倍になる」と記載されています。
- id: 294
  category: sharing_the_road
  question: 夜間にトラックの後方を走行する際、常にヘッドライトをロービームにすべきなのはなぜですか？
  choices:
    A: ハイビームは車両のバッテリーをより早く消耗させるため。
    B: ハイビームの光がトラックの大きなサイドミラーに反射し、トラック運転手の目がくらんでしまうため。
    C: トラック運転手はミラーを使って他の運転手に合図を送るため。
    D: ライトを暗くすることで、トラックのブレーキランプが見えやすくなるため。
  answer: B
  explanation: マニュアルには、「後方の車両からの強い光は、トラックの大きなサイドミラーに反射してトラック運転手の目をくらませる」と記載されています。
- id: 295
  category: sharing_the_road
  question: 道路上で特大の積載物（oversized load）を運ぶ車両に遭遇した際、どのようなことを想定すべきですか？
  choices:
    A: それらの車両は常に道を譲るために路肩に寄る。
    B: 通常のトレーラーよりもはるかに速く走行する。
    C: 先導車を伴っており、幅が非常に広いため、黄色または白の線を越えて走行する場合がある。
    D: 夜間の走行のみが許可されている。
  answer: C
  explanation: マニュアルには、「特大の積載物を運ぶ車両は先導車を伴っている。その過度な幅のため、路肩の障害物によって黄色または白の線を越える可能性がある」と記載されています。
- id: 296
  category: sharing_the_road
  question: 馬車の後ろで停車する際、十分な車間距離を空けるべきなのはなぜですか？
  choices:
    A: 停車後に後退することが多いため。
    B: 馬が車両を蹴る可能性があるため。
    C: 法律で50フィートの距離を空けることが義務付けられているため。
    D: 御者が安全に降りるためのスペースが必要なため。
  answer: A
  explanation: マニュアルによると、馬車は停車後に後退することが多く、車間距離が近すぎると馬車の運転者が後方の車両を確認できなくなります。
- id: 297
  category: sharing_the_road
  question: 馬車や乗馬中の人の横を通過する際、避けるべきことは何ですか？
  choices:
    A: 方向指示器（ウィンカー）を使用すること。
    B: スピードを出しすぎたり、クラクションを鳴らしたりすること。
    C: 左側から追い越すこと。
    D: 右車線に戻る前にスペースを空けること。
  answer: B
  explanation: 馬車や乗馬中の人の横を通過する際は、馬を驚かせる可能性があるため、スピードを出しすぎたりクラクションを鳴らしたりしてはいけません。
- id: 298
  category: safe_driving_rules
  question: 荷台に人が乗っている場合、荷台の開いたピックアップトラックの最高速度制限は何マイルですか？
  choices:
    A: 時速25マイル（25 mph）
    B: 時速35マイル（35 mph）
    C: 時速45マイル（45 mph）
    D: 時速55マイル（55 mph）
  answer: B
  explanation: 荷台の開いたピックアップトラックやフラットベッドトラックは、荷台に人が乗っている場合、時速35マイルを超える速度で運転してはなりません。
- id: 299
  category: safe_driving_rules
  question: 18歳未満の子供が荷台の開いたトラックの荷台に乗ることが法的に許可されるのは、次のうちどの条件ですか？
  choices:
    A: 学校の行事に向かうとき。
    B: 公式に承認されたパレードに参加しているとき。
    C: トラックが時速15マイル未満で走行しているとき。
    D: 荷台に大人が同乗しているとき。
  answer: B
  explanation: 18歳未満の子供がトラックの荷台に乗ることを禁止する法律の例外には、公式に承認されたパレードの参加者である場合が含まれます。
- id: 300
  category: sharing_the_road
  question: 緊急車両が通過した後、その車両から最低限維持しなければならない距離はどれくらいですか？
  choices:
    A: 100フィート
    B: 250フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: マニュアルでは、緊急車両が通過した後に運転を再開する際、その車両から少なくとも500フィートの距離を保つよう指示しています。
- id: 301
  category: sharing_the_road
  question: 除雪車を追い越そうとするのが危険なのはなぜですか？
  choices:
    A: 制限速度を超えた速度で走行しているため。
    B: 両側に数フィート突き出たウィングプラウ（側方除雪翼）が付いている場合があるため。
    C: 除雪車の追い越しは、自動的に免許停止の対象となるため。
    D: 立ち往生しているドライバーを救助するために頻繁に停車するため。
  answer: B
  explanation: 除雪車には、両側に数フィート突き出たウィングプラウ（側方除雪翼）が付いていることがあり、これらは視認しにくく、多くの側面衝突事故の原因となっています。そのため、除雪車を追い越そうとしてはいけません。
- id: 302
  category: defensive_driving
  question: 攻撃的なドライバー（あおり運転）に追いかけられた場合、最も安全な行動は何ですか？
  choices:
    A: 自宅まで運転し、ドアをロックする。
    B: 速度を上げて、攻撃的なドライバーを振り切る。
    C: 警察署やコンビニエンスストアに向かう。
    D: 車両を停止させ、相手のドライバーと対峙する。
  answer: C
  explanation: 攻撃的なドライバーに追いかけられた場合、自宅へ向かってはいけません。代わりに、警察署やコンビニエンスストアなど、助けを求めることができ、目撃者がいる場所へ向かってください。
- id: 303
  category: defensive_driving
  question: マニュアルによると、ペンシルベニア州で毎年発生する高速道路での死亡事故のうち、攻撃的な運転が原因とされるのは約何パーセントですか？
  choices:
    A: 20パーセント
    B: 37パーセント
    C: 60パーセント
    D: 85パーセント
  answer: C
  explanation: ペンシルベニア州で毎年発生する約1,500件の高速道路死亡事故のうち、約60パーセント（約900件）が攻撃的な運転に起因しています。
- id: 304
  category: defensive_driving
  question: 時速25マイル以上の速度で衝突を回避する場合、ブレーキをかけるよりもハンドル操作で危険を避ける方が通常良いとされるのはなぜですか？
  choices:
    A: 高速走行時のブレーキングは、常に車両の横転を引き起こすため。
    B: 回避のためにハンドルを切る反応時間は、ブレーキをかける反応時間よりも短いため。
    C: アンチロック・ブレーキ（ABS）は時速25マイル以上では機能しないため。
    D: ハンドル操作はブレーキ操作よりも身体的な労力を必要としないため。
  answer: B
  explanation: 時速25マイル以上の速度では、障害物を避けるためにハンドルを切る反応時間の方が、ブレーキをかける反応時間よりも短いため、通常はハンドル操作で危険を回避する方が有効です。
- id: 305
  category: vehicle_information
  question: エアバッグが作動した際の負傷のリスクを最小限にするために、ハンドル上の手の位置はどこにあるべきですか？
  choices:
    A: 10時と2時の位置
    B: 12時と6時の位置
    C: 9時と3時の位置、または8時と4時の位置
    D: 片手を12時の位置に置く
  answer: C
  explanation: マニュアルでは、ハンドルを9時と3時の位置、または8時と4時の位置で保持することを推奨しています。10時と2時の位置では、エアバッグが作動した際に負傷する恐れがあります。
- id: 306
  category: vehicle_information
  question: ハンドルを握る際、親指はどのように配置すべきですか？
  choices:
    A: ハンドルのリムの内側をしっかりと握る。
    B: 中央のホーンパッドの上に置く。
    C: 自分の体の方を直接指すようにする。
    D: ハンドルの表面に沿わせる。
  answer: D
  explanation: 親指はハンドルのリムの内側を握り込むのではなく、ハンドルの表面に沿わせて置くようにしてください。
- id: 307
  category: safe_driving_rules
  question: 衝突時の負傷を防ぐために、エアバッグから離れるべき推奨される最小距離はどれくらいですか？
  choices:
    A: 5インチ
    B: 10インチ
    C: 15インチ
    D: 20インチ
  answer: B
  explanation: 衝突時の負傷防止は、主にシートベルトを正しく着用すること、ヘッドレストを調整すること、そしてエアバッグから少なくとも10インチ（約25cm）離れた位置に座ることに依存します。
- id: 308
  category: defensive_driving
  question: アンチロック・ブレーキ・システム（ABS）が装備されていない車両で、緊急時にどのようにブレーキをかけるべきですか？
  choices:
    A: 強く一定の圧力をかけ続ける。
    B: ブレーキを思い切り踏み込み、そのまま保持する。
    C: ブレーキを繰り返し踏んだり離したりする。
    D: 直ちにパーキングブレーキをかける。
  answer: C
  explanation: ABSがない場合は、ブレーキを繰り返し踏んだり離したり（ポンピングブレーキ）して、車両を減速させ、制御を維持する必要があります。ブレーキを急激に踏み込むと、車輪がロックする可能性があります。
- id: 309
  category: defensive_driving
  question: アンチロック・ブレーキ（ABS）が装備されている車両で、緊急時の正しいブレーキ操作は何ですか？
  choices:
    A: ブレーキペダルを素早くポンピングする。
    B: ブレーキを強く一定の圧力で踏み続ける。
    C: ブレーキを軽く踏み、ハンドルを急に切る。
    D: ブレーキを思い切り踏み、すぐに離す。
  answer: B
  explanation: ABSが装備されている場合は、ブレーキを強く一定の圧力で踏み続けてください。ブレーキペダルをポンピングしてはいけません。
- id: 310
  category: defensive_driving
  question: 凍結した道路で車両の後部が右に横滑りし始めた場合、どうすべきですか？
  choices:
    A: ハンドルを左に切る。
    B: ハンドルを右に切る。
    C: 直ちにブレーキを思い切り踏む。
    D: ニュートラルにシフトして惰性で進む。
  answer: B
  explanation: 車両が横滑り（スリップ）し始めたら、行きたい方向を見て、その方向にハンドルを切ってください。車両の後部が右に滑っている場合は、ハンドルを右に切ります。ブレーキは使用しないでください。
- id: 311
  category: defensive_driving
  question: 車両がスリップし始めたらどうすべきですか？
  choices:
    A: すぐに急ブレーキをかける
    B: 後輪が滑っている方向とは逆にハンドルを切る
    C: 車両の後輪が滑っている方向にハンドルを切る
    D: ニュートラルに入れ、パーキングブレーキをかける
  answer: C
  explanation: スリップを止めるには、車両の後輪が滑っている方向にハンドルを切る必要があります。コントロールを取り戻すまでに、数回の修正が必要になる場合があります。
- id: 312
  category: defensive_driving
  question: 車両がスリップしているときにブレーキの使用を避けるべきなのはなぜですか？
  choices:
    A: エンジンが停止（エンスト）するため
    B: 車輪がロックされ、すべてのステアリング操作ができなくなる恐れがあるため
    C: アクセルが戻らなくなるため
    D: トランスミッションを損傷するため
  answer: B
  explanation: スリップ中はブレーキを使用しないでください。ブレーキをかけるとスリップが悪化し、車輪がロックされてステアリング操作が一切できなくなる危険があります。
- id: 313
  category: safe_driving_rules
  question: 多くの車を浮かせるのに、流れる水はどのくらいの深さが必要ですか？
  choices:
    A: 2インチ
    B: 6インチ
    C: 12インチ
    D: 2フィート
  answer: C
  explanation: マニュアルによると、12インチ（約30センチ）の流れる水で多くの車が浮き上がります。
- id: 314
  category: safe_driving_rules
  question: ほとんどのスポーツ用多目的車（SUV）やピックアップトラックを押し流すのに、一般的にどのくらいの流れる水が必要ですか？
  choices:
    A: 6インチ
    B: 12インチ
    C: 18インチ
    D: 2フィート
  answer: D
  explanation: 2フィート（約60センチ）の流れる水は、ほとんどのSUVやピックアップトラックを動かすことができ、大半の車両を押し流してしまいます。
- id: 315
  category: defensive_driving
  question: 車両のアクセル（ガス・ペダル）が戻らなくなった場合、車両のトランスミッションに対してまず最初に行うべきことは何ですか？
  choices:
    A: すぐにニュートラルに入れる
    B: 最も低いギアに入れる
    C: パーキングに入れる
    D: リバースに入れる
  answer: A
  explanation: アクセルが戻らなくなり、軽く叩いても効果がない場合は、すぐにニュートラルにシフトしてブレーキを使用してください。
- id: 316
  category: vehicle_information
  question: アクセルが戻らなくなったために急いで減速または停止する必要がある場合、イグニッションを「LOCK」の位置に回してはいけないのはなぜですか？
  choices:
    A: エンジンから出火する原因になるため
    B: ハンドル操作ができなくなるため
    C: ブレーキが即座にロックされるため
    D: エアバッグが作動するため
  answer: B
  explanation: 急いで減速または停止する必要がある場合は、イグニッションを「OFF」にします。「LOCK」に回すとハンドル操作ができなくなるため、絶対に避けてください。
- id: 317
  category: vehicle_information
  question: 比較的新しい車両でブレーキシステムの警告灯が点灯した場合、ブレーキペダルを踏んだときにどのようなことが予想されますか？
  choices:
    A: ペダルが異常に重く、踏み込みにくく感じる
    B: ペダルが通常よりも深く沈み込み、より強く踏み込む必要がある
    C: 車両の4輪すべてが即座にロックされる
    D: ペダルが激しく振動する
  answer: B
  explanation: 分割ブレーキシステムを搭載した新しい車両では、警告灯が点灯すると、車両が減速し始める前にブレーキペダルが通常よりも深く沈み込むように感じられ、より強く踏み込む必要があります。
- id: 318
  category: vehicle_information
  question: パンクしたタイヤを交換する際、どの時点でラグナット（ホイールナット）を緩めるべきですか？
  choices:
    A: 車両を地面から6インチ持ち上げた後
    B: 車両がまだ地面に接地している間
    C: ハブキャップを完全に取り外し、車を12インチジャッキアップした後
    D: スペアタイヤを取り付けた後のみ
  answer: B
  explanation: 車両が接地している間に、ラグレンチの端を使ってラグナットを緩めます。車両を持ち上げるまでは、完全に取り外さないでください。
- id: 319
  category: defensive_driving
  question: 前輪がパンク（バースト）した際の一般的な兆候は何ですか？
  choices:
    A: 車両の後部が左右に揺れる
    B: ハンドルが振動し、車両が突然片側に取られる
    C: エンジンが突然空吹かし状態になる
    D: ブレーキペダルが床まで落ち込む
  answer: B
  explanation: 前輪がバーストすると、ハンドルが振動し、車両が突然片側に引っ張られるのを感じます。
- id: 320
  category: defensive_driving
  question: タイヤがバーストした直後に、最も避けるべきことは何ですか？
  choices:
    A: ハンドルをしっかりと握ること
    B: アクセルペダルから足を離すこと
    C: ブレーキをかけること
    D: スムーズにハンドル操作をすること
  answer: C
  explanation: タイヤがバーストしたときは、ブレーキを踏まないでください！バースト後にブレーキをかけると、スリップを引き起こし、車両のコントロールを失う原因となります。
- id: 321
  category: defensive_driving
  question: 旧式の車両でブレーキが突然故障した場合、ブレーキ圧を高めるために何をすべきですか？
  choices:
    A: ニュートラルに入れ、エンジンを切る
    B: ブレーキペダルを素早く数回踏む（ポンピング）
    C: パーキングブレーキをできるだけ速く強く引く
    D: ブレーキペダルを床まで強く踏み続ける
  answer: B
  explanation: 旧式の車両でブレーキが故障した場合は、ブレーキペダルを素早く数回踏んでください。これにより、車両を停止させるのに十分なブレーキ圧が得られることがよくあります。
- id: 322
  category: defensive_driving
  question: 自分の車線に別の車両が正面から近づいてきた場合、可能であればどちらの方向に回避すべきですか？
  choices:
    A: 左側
    B: 右側
    C: 強くブレーキをかけながら直進する
    D: 対向車線の中へ
  answer: B
  explanation: 別の車両が正面から近づいてきた場合は、クラクションを鳴らして注意を促し、可能であれば右側に回避してください。左側に急ハンドルを切ると、相手のドライバーが軌道修正した場合に衝突する恐れがあります。
- id: 323
  category: sharing_the_road
  question: 交差点で葬列（葬儀の車列）に遭遇した場合、どうしなければなりませんか？
  choices:
    A: 信号が青であれば、列を横切って進む
    B: 列の車両がすべて通過するまで道を譲る
    C: クラクションを鳴らして待っていることを知らせる
    D: 交差点を早く通過するために列に割り込む
  answer: B
  explanation: 先頭車両が交差点を通過した後は、葬列の残りの車両も交差点を進むことができ、他の交通は道を譲らなければなりません。列を通過させ、割り込んだり出入りしたりしないでください。
- id: 324
  category: sharing_the_road
  question: 葬列の一部である車両をどのように識別できますか？
  choices:
    A: ハイビームを点灯させている
    B: ヘッドライトと非常点滅表示灯（ハザードランプ）を点灯させ、旗や記章をつけている
    C: 制限速度より少なくとも15 mph以上低速で走行している
    D: 屋根に黄色の回転灯がついている
  answer: B
  explanation: 葬列に加わるすべての車両は、ヘッドライトと非常点滅表示灯（ハザードランプ）を点灯させ、葬列の一部であることを示す旗やその他の記章をつけていなければなりません。
- id: 325
  category: safe_driving_rules
  question: 洪水で動けなくなった場合、最善の選択肢は何ですか？
  choices:
    A: 車内にとどまり、救急サービスの到着を待つ
    B: すばやく車から出て、高い場所へ移動する
    C: 窓を閉め、エアコンをつける
    D: エンジンを再始動し、バックして水から出ようとする
  answer: B
  explanation: 洪水で動けなくなった場合は、すぐに車から出て高い場所へ移動してください。
- id: 326
  category: sharing_the_road
  question: 葬列のすべての車両は何を点灯させていなければなりませんか？
  choices:
    A: ハイビーム
    B: ヘッドライトと非常点滅表示灯（ハザードランプ）
    C: 非常点滅表示灯（ハザードランプ）のみ
    D: 車内灯
  answer: B
  explanation: マニュアルによると、葬列のすべての車両はヘッドライトと非常点滅表示灯（ハザードランプ）を点灯させ、旗やその他の記章をつけていなければなりません。
- id: 327
  category: sharing_the_road
  question: 葬列の先頭車両が青信号で交差点に入った場合、列に続く車両はどうすることができますか？
  choices:
    A: 信号が赤になったら停止しなければならない
    B: 進む前にすべての交差する交通に道を譲らなければならない
    C: 赤信号でもそのまま進むことができる
    D: 次の青信号を待たなければならない
  answer: C
  explanation: 葬列のドライバーは、先頭車両が青信号の間に交差点に入り始めた場合、赤信号や一時停止標識をそのまま通過することができます。
- id: 328
  category: defensive_driving
  question: 車両の右輪が舗装路から路肩に外れてしまった場合、最初にすべきことは何ですか？
  choices:
    A: すぐに強くブレーキをかける
    B: 左に急ハンドルを切る
    C: アクセルペダルを緩めて減速する
    D: ハザードランプをつける
  answer: C
  explanation: 舗装路から外れてしまった場合、最初のステップはアクセルペダルを緩めて減速することです。急ブレーキをかけてはいけません。
- id: 329
  category: defensive_driving
  question: 柔らかい路肩に外れた後、道路に戻るためにハンドルを急に切るのが危険なのはなぜですか？
  choices:
    A: 前輪のタイヤを傷めるから
    B: 車両が横向きに振られ、対向車線に飛び出す可能性があるから
    C: エンジンがストール（エンスト）する原因になるから
    D: ハンドルがロックされるから
  answer: B
  explanation: マニュアルでは、道路に戻るためにハンドルを急に切ると、車両が横向きに振られ、対向車線に飛び出す可能性があると警告しています。
- id: 330
  category: safe_driving_rules
  question: 路肩に外れた後、舗装路に戻るためのハンドル操作を試みる前に、時速何マイル（mph）以下になるまで徐々に減速すべきですか？
  choices:
    A: 25 mph未満
    B: 35 mph未満
    C: 45 mph未満
    D: 55 mph未満
  answer: A
  explanation: 舗装路に戻る前に、非常に低速（25 mph未満、できれば10 mph近く）になるまで徐々に減速を続ける必要があります。
- id: 331
  category: driver_responsibility
  question: 10代のドライバーが事故に遭う可能性がより高くなるのはどのような時ですか？
  choices:
    A: 大人の同乗者がいる時
    B: 10代の同乗者がいる時
    C: 同乗者がいない時
    D: ペットを同乗させている時
  answer: B
  explanation: マニュアルの復習問題によると、10代のドライバーは、10代の同乗者を乗せて運転している時に事故に遭う可能性が高くなります。
- id: 332
  category: sharing_the_road
  question: オートバイの後方を走行する際、少なくともどのくらいの車間距離を空けるべきですか？
  choices:
    A: 車2台分
    B: 2秒間
    C: 4秒間
    D: オートバイ4台分
  answer: C
  explanation: オートバイの後方を走行する際は、少なくとも4秒間の車間距離を空けなければなりません。
- id: 333
  category: sharing_the_road
  question: 信号機のない場所で、ドライバーが右左折しようとしており、歩行者が横断している場合、どちらが譲らなければなりませんか？
  choices:
    A: 歩行者
    B: ドライバー
    C: 後から動き出した方
    D: 速度が遅い方
  answer: B
  explanation: 信号機がない場所であっても、歩行者が横断している場合に右左折するドライバーは、歩行者に道を譲らなければなりません。
- id: 334
  category: sharing_the_road
  question: トラックと道路を共有する際、一般的にトラックについて覚えておくべき重要なことは何ですか？
  choices:
    A: 乗用車よりも停止するのに長い距離を必要とする
    B: 下り坂で追い越す際、乗用車よりも短い時間で済む
    C: 乗用車よりも最小回転半径が小さい
    D: 上り坂で追い越す際、乗用車よりも短い時間で済む
  answer: A
  explanation: 一般的に、トラックは乗用車よりも停止するまでに長い距離を必要とします。
- id: 335
  category: sharing_the_road
  question: 交差点で右折する前に左に大きく膨らんで走行しているトラックの後ろを走っている場合、何をするのが非常に危険ですか？
  choices:
    A: トラックが右折を完了するまでブレーキをかける
    B: トラックと縁石の間に割り込んで右折しようとする
    C: 4秒間の車間距離ルールを破る
    D: トラックの運転手に向かってクラクションを鳴らす
  answer: B
  explanation: トラックが右折の準備のために左に膨らんだ際、トラックと縁石の間に割り込んで右折しようとすることは非常に危険です。
- id: 336
  category: sharing_the_road
  question: 赤いライトが点滅し、ストップアーム（停止表示板）が出ているスクールバスに対して、停止しなくてもよい唯一のケースはどのような時ですか？
  choices:
    A: 中央分離帯のある道路の反対側を走行している時
    B: バスを追従している時
    C: 子供が一人もいないのが見える時
    D: 左側から安全に追い越せる時
  answer: A
  explanation: 中央分離帯のある道路の反対側を走行している場合は、赤いライトが点滅しているスクールバスに対して停止する必要はありません。
- id: 337
  category: safe_driving_rules
  question: 複数の線路がある踏切で停止した場合、どのようにすべきですか？
  choices:
    A: 線路の上で停止し、別の列車が来ないか確認する
    B: 列車が通過したらすぐに進む
    C: 線路のうち1つが空いたら進む
    D: 両方の線路がはっきりと見えるようになるまで待つ
  answer: D
  explanation: 複数の線路がある踏切では、進む前に両方の線路の安全がはっきりと確認できるまで待たなければなりません。
- id: 338
  category: safe_driving_rules
  question: 右左折を予定している場合、いつ方向指示器（ウィンカー）を出すべきですか？
  choices:
    A: 後続車がいる場合のみ
    B: 車の先端が交差点に差し掛かった瞬間
    C: 交差点に到達する3〜4秒前
    D: 交差点に到達する車2台分前
  answer: C
  explanation: 交差点に到達する3〜4秒前に方向指示器を出す必要があります。
- id: 339
  category: defensive_driving
  question: ドライバーの「死角（ブラインドスポット）」とは何を指しますか？
  choices:
    A: 頭を動かさなければ確認できない道路上の範囲
    B: 車両の真後ろの範囲
    C: ルームミラー（バックミラー）で見える範囲
    D: サイドミラーで見える範囲
  answer: A
  explanation: 死角とは、肩越しに振り向いて頭を動かさない限り確認することができない道路上の範囲のことです。
- id: 340
  category: safe_driving_rules
  question: 車を後退（バック）させる前に従うべき適切な手順は何ですか？
  choices:
    A: ミラーだけを頼りに安全を確認する
    B: ライトを点滅させて周囲に警告する
    C: ドアを開けて後方を確認する
    D: 顔を後ろに向け、リアウィンドウ越しに目視する
  answer: D
  explanation: 後退する前には、進行方向の安全を確保するために、顔を後ろに向けてリアウィンドウから直接目視する必要があります。
- id: 341
  category: vehicle_information
  question: 車両の方向指示器（ウィンカー）が故障している場合、右左折を知らせるために何をすべきですか？
  choices:
    A: クラクションを鳴らす
    B: ヘッドライトを点滅させる
    C: 手信号を使う
    D: 非常点滅表示灯（ハザードランプ）を点灯させる
  answer: C
  explanation: 方向指示器が故障した場合は、適切な手信号を使用して他のドライバーに右左折の意思を伝える必要があります。
- id: 342
  category: safe_driving_rules
  question: 他の車両がどのくらいの距離から視認できない場合に、ヘッドライトを使用しなければなりませんか？
  choices:
    A: 500フィート（約150メートル）先
    B: 1000フィート（約300メートル）先
    C: 1200フィート（約360メートル）先
    D: 1500フィート（約450メートル）先
  answer: B
  explanation: 他の車両が1000フィート先から視認できない場合は、ヘッドライトを使用しなければなりません。
- id: 343
  category: defensive_driving
  question: ハイビームを使用した車両が前方から近づいてきた場合、どこを見るべきですか？
  choices:
    A: 道路の中央付近
    B: 道路の左側付近
    C: 道路の右側付近
    D: 対向車のヘッドライトを直視する
  answer: C
  explanation: ハイビームを使用した車両が近づいてきた場合は、眩しさで目がくらむのを避けるため、道路の右側（路肩側）を見るようにしてください。
- id: 344
  category: alcohol_drugs_health
  question: 睡眠不足が安全運転能力に与える影響は、次のどれと同じですか？
  choices:
    A: アルコールが与える影響
    B: アンフェタミン（興奮剤）が与える影響
    C: 怒りが与える影響
    D: 10代の同乗者を乗せて運転する影響
  answer: A
  explanation: 睡眠不足が安全運転能力に与える影響は、アルコールを摂取した際の影響と同等です。
- id: 345
  category: alcohol_drugs_health
  question: 居眠り運転による事故のリスクを避けるために、ティーンエイジャーは毎晩少なくとも何時間の睡眠をとるべきですか？
  choices:
    A: 6時間
    B: 7時間
    C: 8時間
    D: 9時間
  answer: C
  explanation: 居眠り運転による事故のリスクを避けるために、ティーンエイジャーは毎晩少なくとも8時間の睡眠をとるように努めるべきです。
- id: 346
  category: alcohol_drugs_health
  question: 平均的な人の場合、1杯のお酒に含まれるアルコールを処理するのに体は何分必要ですか？
  choices:
    A: 15分
    B: 30分
    C: 60分
    D: 90分
  answer: C
  explanation: 平均的な人の場合、体内で1杯のお酒のアルコールを処理するのに約60分かかります。
- id: 347
  category: alcohol_drugs_health
  question: 運転前にアルコールと一緒に薬物を摂取すると、どのような影響がありますか？
  choices:
    A: 運転能力に対するアルコールの影響を軽減する
    B: 衝突事故を起こすリスクを高める
    C: 一般的な運転能力に影響はない
    D: アルコール単独の場合と危険性は変わらない
  answer: B
  explanation: アルコールと一緒に薬物を摂取すると、相乗効果により衝突事故を起こすリスクが大幅に高まります。
- id: 348
  category: defensive_driving
  question: 走行中にタイヤがパンク（バースト）した場合、どのように対処するのが適切ですか？
  choices:
    A: 急ブレーキをかけてすぐに車を止める
    B: ハンドルを自由に動くままにする
    C: 修理工場に着くまで運転を続ける
    D: 自然に減速して停止させる
  answer: D
  explanation: タイヤがパンクした場合は、急ブレーキをかけるのではなく、ハンドルをしっかり保持し、自然に減速させてから安全な場所に停止させるべきです。
- id: 349
  category: sharing_the_road
  question: 点滅ライトをつけた緊急車両が近づいてくるのが見えたら、どうしなければなりませんか？
  choices:
    A: 減速し、そのままの車線で走行を続ける
    B: 同じ速度でそのままの車線で走行を続ける
    C: 路肩に寄せて停止する
    D: 道路の真ん中の現在位置で停止する
  answer: C
  explanation: 点滅ライトをつけた緊急車両を見かけたら、車両を路肩に寄せて停止し、緊急車両を安全に通過させなければなりません。
- id: 350
  category: sharing_the_road
  question: サイレンを鳴らした緊急車両が通過した後、その車両の後方どのくらいの距離以内に近づいて運転してはいけませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: サイレンを鳴らした緊急車両が通過した後は、その緊急車両の後方500フィート（約150メートル）以内に近づいて運転してはいけません。
- id: 351
  category: safe_driving_rules
  question: 工事区間（ワークゾーン）での事故の最も一般的な原因は何ですか？
  choices:
    A: タイヤのパンク
    B: 路面に撒かれた水によるハイドロプレーニング現象
    C: 塗りたての塗料の上を走行したことによるステアリング操作不能
    D: 不注意とスピードの出し過ぎ
  answer: D
  explanation: 工事区間での事故は、不注意とスピードの出し過ぎが最も一般的な原因です。
- id: 352
  category: safe_driving_rules
  question: 工事区間を走行する際、車間距離に関する適切な安全策は何ですか？
  choices:
    A: 交通の流れを妨げないよう、前走車に接近して走行する
    B: 通常の車間距離を約半分に短縮する
    C: クルーズコントロールをオンにする
    D: 通常の車間距離を2倍に伸ばす
  answer: D
  explanation: 工事区間を走行する際は、通常の車間距離を2倍に伸ばすことが適切な安全策です。
- id: 353
  category: safe_driving_rules
  question: 片側一車線の対面通行の道路で左折を開始する場合、車両をどこに配置すべきですか？
  choices:
    A: 外側の線の近く
    B: センターライン（中央線）の近く
    C: 車線の中央
    D: 車線内のどこでもよい
  answer: B
  explanation: 片側一車線の対面通行の道路やハイウェイでは、センターラインの近くから左折を開始する必要があります。
- id: 354
  category: safe_driving_rules
  question: 片側一車線の道路で、右側から他車を追い越すことができるのはどのような条件の時ですか？
  choices:
    A: 一車線の進入ランプを走行しているとき
    B: 追い越そうとしている車両が制限速度よりも遅く走行しているとき
    C: 追い越そうとしている車両が左折しようとしているとき
    D: 片側一車線の道路で右側から追い越すことは決してできない
  answer: C
  explanation: 片側一車線の道路では、追い越そうとしている車両が左折しようとしている場合に、その車両を右側から追い越すことができます。
- id: 355
  category: defensive_driving
  question: カーブに近づく際のスピード管理について、最も重要なことは何ですか？
  choices:
    A: カーブに入る前に減速する
    B: カーブに入る前に緩やかに加速する
    C: カーブの間中、標識の制限速度で走行する
    D: カーブの最も急な部分でのみ減速する
  answer: A
  explanation: スピード管理とカーブに関して最も重要なことは、カーブに入る前に減速することです。
- id: 356
  category: sharing_the_road
  question: ラウンドアバウト（環状交差点）に進入する際、運転者は何をしなければなりませんか？
  choices:
    A: 進入する前に完全に停止する
    B: ラウンドアバウト内を走行中の車両に道を譲る
    C: 先に到着した場合は優先権を得る
    D: 素早く合流するために加速する
  answer: B
  explanation: ラウンドアバウトに進入する運転者は、すでにラウンドアバウト内を走行している車両に道を譲らなければなりません。
- id: 357
  category: safe_driving_rules
  question: 法律は、交差点において誰に優先権（Right of way）を与えていますか？
  choices:
    A: 左折する運転者
    B: 直進する運転者
    C: 右折する運転者
    D: 誰にも与えていない
  answer: D
  explanation: 法律は交差点において誰にも優先権を与えていません。誰が譲らなければならないかを規定しているだけです。
- id: 358
  category: safe_driving_rules
  question: 一時停止標識のある交差点で停止した後、進む前にどこを確認すべきですか？
  choices:
    A: まず右、次に左、そしてもう一度右を見る
    B: まず左、次に右、そしてもう一度左を見る
    C: バックミラーのみを確認する
    D: まっすぐ前を見て進む
  answer: B
  explanation: 一時停止標識のある交差点では、停止してまず左、次に右、そしてもう一度左を確認する必要があります。
- id: 359
  category: safe_driving_rules
  question: 通常、進入ランプからハイウェイに進入するにはどうすればよいですか？
  choices:
    A: 他の車両を避けるため、ゆっくり進入する
    B: まず停止し、それからゆっくりと交通の流れに入る
    C: 交通の流れと同じ速度まで加速する
    D: 前に出るために交通の流れ以上の速度で進入する
  answer: C
  explanation: 進入ランプからハイウェイに入る際は、通常、交通の流れと同じ速度まで加速する必要があります。
- id: 360
  category: safe_driving_rules
  question: フリーウェイ（高速道路）を降りたいのに出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 中央分離帯を通ってUターンする
    B: 路肩に寄せて、出口までバックする
    C: 次の出口まで行き、そこでフリーウェイを降りる
    D: 停止して、交通が途切れるのを待ってからバックする
  answer: C
  explanation: フリーウェイを降りようとして出口を通り過ぎてしまった場合は、次の出口まで行き、そこで降りるようにしてください。
- id: 361
  category: safe_driving_rules
  question: 標識、信号、警察官による指示がない交差点において、譲り合いに関して法律は何と定めていますか？
  choices:
    A: 直進車は左折車に譲らなければならない
    B: 左折車は交差点を直進する車両に譲らなければならない
    C: 右側のドライバーは左側のドライバーに譲らなければならない
    D: 誰が譲るべきかを定めた法律はない
  answer: B
  explanation: 交差点で標識、信号、警察官の指示がない場合、法律では左折車は交差点を直進する車両に道を譲らなければならないと定められています。
- id: 362
  category: driver_responsibility
  question: 「高速道路催眠現象（ハイウェイ・ヒプノーシス）」と呼ばれる運転状態の原因は何ですか？
  choices:
    A: 頻繁な休憩
    B: 旅行前夜の過度な睡眠
    C: 高速道路での短距離走行
    D: 長時間にわたって路面を凝視すること
  answer: D
  explanation: 「高速道路催眠現象（ハイウェイ・ヒプノーシス）」は、長時間にわたって路面を凝視し続けることによって引き起こされる運転状態です。
- id: 363
  category: defensive_driving
  question: 車両の周囲にスペース・クッション（安全な空間）を保つのに最適な場所はどこですか？
  choices:
    A: 車両の後方のみ
    B: 車両の左右のみ
    C: 車両の四方すべて
    D: 車両の前方のみ
  answer: C
  explanation: 車両の四方すべてにスペース・クッションを保つのが最善です。
- id: 364
  category: defensive_driving
  question: 乾いた路面を高速道路の速度で走行中、安全な車間距離とされるのはどれですか？
  choices:
    A: 前方の車から2秒間の車間距離
    B: 前方の車から3秒間の車間距離
    C: 前方の車から4秒間の車間距離
    D: 前方の車から車2台分の車間距離
  answer: C
  explanation: 乾いた路面を高速道路の速度で走行する場合、安全な車間距離は前方の車から少なくとも4秒間です。
- id: 365
  category: defensive_driving
  question: 交通の流れの中で、緊急停止や「パニック」ブレーキを避けるための最善の方法は何ですか？
  choices:
    A: クラクションを鳴らして自分の存在を周囲に知らせる
    B: 右側の車線のみを走行する
    C: 交通の流れよりも遅く走る
    D: 前方を注視し、安全な車間距離を保つ
  answer: D
  explanation: 交通の中を走行中に緊急停止を避けるためには、前方を注視し、安全な車間距離を維持する必要があります。
- id: 366
  category: sharing_the_road
  question: 左側に対向車、右側に自転車がいる状況に直面した場合、どうすべきですか？
  choices:
    A: 路肩に寄せる
    B: 中間を通る
    C: 対向車を通過させてから、自転車を追い越す
    D: 素早く自転車を追い越す
  answer: C
  explanation: 左側に対向車、右側に自転車がいる状況では、安全を確保するために、まず対向車を通過させてから自転車を追い越すべきです。
- id: 367
  category: defensive_driving
  question: 対向車が自分の車線に向かって走ってきた場合、どうすべきですか？
  choices:
    A: 右にハンドルを切り、クラクションを鳴らして加速する
    B: 左にハンドルを切り、クラクションを鳴らしてブレーキをかける
    C: 右にハンドルを切り、クラクションを鳴らしてブレーキをかける
    D: 車線の中央にとどまり、クラクションを鳴らしてブレーキをかける
  answer: C
  explanation: 対向車が自分の車線に向かってきた場合は、正面衝突を避けるために右にハンドルを切り、クラクションを鳴らし、ブレーキをかけるべきです。
- id: 368
  category: vehicle_information
  question: 車両の後部が左に横滑り（スリップ）し始めた場合、どうすべきですか？
  choices:
    A: 左にハンドルを切る
    B: ブレーキを踏む
    C: 加速する
    D: 右にハンドルを切る
  answer: A
  explanation: 車両の後部が左に横滑りし始めた場合は、コントロールを取り戻すために左にハンドルを切る必要があります。
- id: 369
  category: safe_driving_rules
  question: 雨が降っている際、路面が最も滑りやすくなるのはいつですか？
  choices:
    A: 雨が1時間以上降り続いたとき
    B: 雨が降った翌日
    C: 雨が降り始めてからの最初の10〜15分間
    D: 雨が止んだ直後
  answer: C
  explanation: 雨が降り始めてからの最初の10〜15分間は、水が路面のオイルや汚れと混ざり合うため、路面が非常に滑りやすくなります。
- id: 370
  category: safe_driving_rules
  question: 霧の中を運転するときは、どのライトを使用すべきですか？
  choices:
    A: ロービーム（下向き灯）
    B: ハイビーム（上向き灯）
    C: 駐車灯
    D: 非常点滅表示灯（ハザードランプ）
  answer: A
  explanation: 霧の中を走行する際は、眩惑を防ぎつつ視認性を高めるために、ロービームを使用すべきです。
- id: 371
  category: penalties_and_points
  question: ペンシルベニア州運輸局（PennDOT）は、運転記録が何点に達した時点で是正措置を開始しますか？
  choices:
    A: 3点以上
    B: 6点以上
    C: 9点以上
    D: 12点以上
  answer: B
  explanation: 運転記録が6点以上に達したとき、PennDOTは是正措置を開始します。
- id: 372
  category: penalties_and_points
  question: 運転記録が初めて6点以上に達した場合、どうなりますか？
  choices:
    A: 運転免許が直ちに30日間停止される
    B: 局の公聴会に出席しなければならない
    C: 特別点数筆記試験を受けるよう書面で通知が届く
    D: 500ドルの罰金を支払わなければならない
  answer: C
  explanation: 運転記録が初めて6点以上に達した場合、ドライバーには特別点数筆記試験を受けるよう書面で通知が届きます。
- id: 373
  category: penalties_and_points
  question: 18歳未満のドライバーが6点以上の累積点数に達した場合、初回は何日間の運転免許停止処分となりますか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 120日間
  answer: C
  explanation: 18歳未満の者が6点以上の累積点数に達した場合、運転免許は停止されます。初回の停止期間は90日間です。
- id: 374
  category: penalties_and_points
  question: 違反や免許停止処分を受けずに12ヶ月間連続で運転した場合、運転記録から何点が減点されますか？
  choices:
    A: 1点
    B: 2点
    C: 3点
    D: すべての点数
  answer: C
  explanation: 免許停止や取り消しの処分を受けておらず、かつ違反を犯していない期間が12ヶ月連続するごとに、運転記録から3点が減点されます。
- id: 375
  category: safe_driving_rules
  question: 信号機や遮断機のない踏切を通過する車列の中にいるとき、どうすべきですか？
  choices:
    A: 優先権があると考え、列車の確認をする必要はない
    B: 踏切を渡っている間に、より遅い車を追い越す
    C: 踏切を渡り始める前に、停止することなく線路を完全に渡りきれるスペースがあることを確認する
    D: 線路の上で停止して、近づいてくる列車を確認する
  answer: C
  explanation: 信号機や遮断機のない踏切を渡る際は、渡り始める前に、停止することなく線路を完全に渡りきれるだけの十分なスペースがあることを確認する必要があります。
- id: 376
  category: penalties_and_points
  question: 次の違反のうち、運転免許の停止または取り消しにつながるものはどれですか？
  choices:
    A: 制限速度を時速5マイル（5 mph）超えて運転する
    B: 積載区域（ローディングゾーン）に駐車する
    C: 踏切の遮断機や障壁に従わない
    D: テールランプが故障した状態で運転する
  answer: C
  explanation: 踏切の遮断機や障壁に従わなかった罪で有罪判決を受けた場合、運転免許は停止または取り消されます。これには30日間の免許停止が伴います。
- id: 377
  category: penalties_and_points
  question: 踏切の遮断機や障壁に従わなかった場合、どのような罰則が科されますか？
  choices:
    A: 15日間の免許停止
    B: 30日間の免許停止
    C: 60日間の免許停止
    D: 6ヶ月間の免許停止
  answer: B
  explanation: マニュアルによると、踏切の遮断機や障壁に従わなかった場合は30日間の免許停止となります。
- id: 378
  category: safe_driving_rules
  question: 夜間に警察官に車を止められた場合、直ちに何をすべきですか？
  choices:
    A: 車から降りて警察官に挨拶する
    B: 停車したらすぐに車内の照明をつける
    C: グローブボックスに手を入れて登録証を取り出す
    D: 財布ごと警察官に渡す
  answer: B
  explanation: 夜間に警察に止められた場合は、停車後、警察官が近づいてくる前にすぐに車内の照明をつける必要があります。
- id: 379
  category: driver_responsibility
  question: 警察官に止められた際、運転免許証、車両登録証、および保険証はいつ取り出すべきですか？
  choices:
    A: 後ろでパトランプが見えたらすぐに
    B: 警察官が車に向かって歩いてきている間に
    C: 警察官から提示を求められるまで待つ
    D: 車の外に出た後でのみ
  answer: C
  explanation: 警察官から提示を求められるまで、運転免許証、登録証、保険証を取り出すのを待ち、それまでは不用意な動きを控えるべきです。
- id: 380
  category: penalties_and_points
  question: 免許停止期間が終了し、運転資格が回復した後、通常、運転記録には何点が表示されますか？
  choices:
    A: 0点
    B: 3点
    C: 5点
    D: 6点
  answer: C
  explanation: 運転資格が回復した後、停止前の点数に関わらず（いくつかの例外を除き）、運転記録には5点が表示されます。
- id: 381
  category: penalties_and_points
  question: ペンシルベニア州運輸局（PennDOT）が、あなたの車両に31日以上の期間、保険がかけられていなかったと判断した場合、どのような罰則がありますか？
  choices:
    A: 車両登録が3ヶ月間停止される
    B: 車両が30日間押収される
    C: 免許が60日間停止される
    D: 運転免許試験の再受験が求められる
  answer: A
  explanation: PennDOTが、車両に31日以上の期間、保険がかけられていなかったと判断した場合、車両登録は3ヶ月間停止されます。
- id: 382
  category: signs_and_signals
  question: 後方の車両が青色のライトのみを点滅させている場合、それは何を示していますか？
  choices:
    A: 覆面パトカーである
    B: 州警察官である
    C: 警察官ではない
    D: 救急医療車両である
  answer: C
  explanation: マニュアルには、「車両が青色のライトのみを点滅させている場合、それは警察官ではない」と記載されています。
- id: 383
  category: defensive_driving
  question: 赤色の点滅灯によって停車を求められたが、その人物が本当に警察官であるか確信が持てない場合、どうすべきですか？
  choices:
    A: その車両から逃げるためにスピードを上げる
    B: 直ちに停車し、すべてのドアをロックする
    C: ハザードランプを点灯させ、速度を落として走行しながら、近くの明るく人が多い場所まで移動する
    D: マークの付いたパトカーが見えるまでライトを無視する
  answer: C
  explanation: 停車を求めている人物が警察官であるか確信が持てない場合は、近くの明るく人が多い場所まで走行し、ハザードランプを点灯させ、速度を落として走行することで、停車要請に応じる意思を示してください。
- id: 384
  category: driver_responsibility
  question: 駐車中の車両と衝突事故を起こし、所有者が見つからない場合はどうしなければなりませんか？
  choices:
    A: 現場を離れ、警察から連絡が来るのを待つ
    B: 連絡先を記載したメモを残し、警察に電話する
    C: 現場を離れる前に、最大1時間現場で待機する
    D: 30日以内に保険会社に事故を報告する
  answer: B
  explanation: 駐車中の車両との事故で所有者が見つからない場合は、日付、時間、氏名、電話番号を記載したメモを目に付く場所に残し、警察に電話してください。
- id: 385
  category: driver_responsibility
  question: 負傷者、死亡者、または車両の牽引が必要な事故が発生し、警察が調査を行わなかった場合、PennDOTに運転者事故報告書（Driver's Accident
    Report Form）を送付するまでに何日間の猶予がありますか？
  choices:
    A: 3日
    B: 5日
    C: 10日
    D: 15日
  answer: B
  explanation: 警察が事故の調査を行わず、死亡者や負傷者が出た場合、または車両の牽引が必要な場合は、5日以内に運転者事故報告書（AA-600）を送付しなければなりません。
- id: 386
  category: penalties_and_points
  question: 警察から逃走、または逃走を試みた罪で有罪判決を受けた運転者に対する罰則は何ですか？
  choices:
    A: 6ヶ月間の免許停止と250ドルの罰金
    B: 1年間の免許停止と500ドルの罰金
    C: 3ヶ月間の免許停止と1,000ドルの罰金
    D: 2年間の免許停止と5,000ドルの罰金
  answer: B
  explanation: 警察から逃走、または逃走を試みた罪で有罪判決を受けた場合、罰則は1年間の運転免許停止、500ドルの罰金、および裁判費用やその他の手数料となります。
- id: 387
  category: alcohol_drugs_health
  question: ペンシルベニア州の「黙示の同意法（Implied Consent law）」は、運転者にとって何を意味しますか？
  choices:
    A: 警察がいつでも車両を捜索することを許可することに同意する
    B: 運転免許を保有しているだけで、アルコールや薬物の化学検査を受けることに同意しているとみなされる
    C: 受け取ったいかなる交通違反切符に対しても有罪を認めることに同意する
    D: 車両に賠償責任保険をかけることに同意する
  answer: B
  explanation: 黙示の同意法とは、ペンシルベニア州で運転免許を保有しているだけで、呼気または血液の化学検査を受けることに同意したとみなされる法律です。
- id: 388
  category: penalties_and_points
  question: 飲酒・薬物影響下運転（DUI）で逮捕され、呼気または血液の化学検査を拒否した場合、どうなりますか？
  choices:
    A: 警告を受けて釈放される
    B: 運転免許が自動的に1年間停止される
    C: 500ドルの罰金が科せられるが、免許は維持できる
    D: 車両が永久に没収される
  answer: B
  explanation: 呼気または血液の化学検査を1回以上拒否した場合、DUIで無罪となった場合でも、運転免許は自動的に1年間停止されます。
- id: 389
  category: penalties_and_points
  question: 飲酒・薬物影響下運転（DUI）で無罪となったが、初めて呼気または血液検査を拒否した場合、運転免許はどうなりますか？
  choices:
    A: 6ヶ月間停止される
    B: 1年間停止される
    C: 停止されない
    D: 90日間停止される
  answer: B
  explanation: 飲酒運転で無罪となった場合でも、初めて呼気または血液検査を拒否した場合は、運転免許が1年間停止されます。
- id: 390
  category: penalties_and_points
  question: 化学検査拒否による、初回違反時の免許復帰手数料（restoration fee）はいくらですか？
  choices:
    A: $300
    B: $500
    C: $1,000
    D: $2,000
  answer: B
  explanation: 化学検査を拒否した運転者は、化学検査拒否復帰手数料を支払う必要があります。初回違反は500ドルです。
- id: 391
  category: alcohol_drugs_health
  question: ペンシルベニア州のゼロ・トレランス法（不寛容法）に基づき、酒気帯び運転（DUI）で起訴された未成年者（21歳未満）の血中アルコール濃度（BAC）の制限値はいくらですか？
  choices:
    A: '.00'
    B: '.02'
    C: '.04'
    D: '.08'
  answer: B
  explanation: ゼロ・トレランス法により、酒気帯び運転（DUI）で起訴された未成年者（21歳未満）の血中アルコール濃度（BAC）の制限値は、.08から.02に引き下げられました。
- id: 392
  category: penalties_and_points
  question: BACが.08から.099の状態で運転中に、身体傷害または物損を伴う事故を起こした場合、どのような罰則の対象となりますか？
  choices:
    A: 一般的障害（General Impairment）の罰則
    B: 高比率（High Rate）の罰則
    C: 最高比率（Highest Rate）の罰則
    D: 初犯であれば罰則なし
  answer: B
  explanation: 身体傷害、死亡、または物損を伴う事故を起こした場合、たとえBACが表2に記載されている数値より低くても、表2の「高比率（High Rate）」に記載されている罰則の対象となります。
- id: 393
  category: penalties_and_points
  question: 化学検査を拒否した運転者、または規制薬物の影響下で運転した運転者は、どのレベルの罰則の対象となりますか？
  choices:
    A: 一般的障害（General Impairment）
    B: 高比率（High Rate）
    C: 最高比率（Highest Rate）
    D: ゼロ・トレランス（Zero Tolerance）
  answer: C
  explanation: 規制薬物の影響下で運転した者、および化学検査を拒否した運転者は、表3の「最高比率（Highest Rate）」に記載されている罰則の対象となります。
- id: 394
  category: alcohol_drugs_health
  question: DUIで加速的更生処分（ARD）プログラムへの参加が認められた場合、何時間のアルコール・ハイウェイ・セーフティ・スクールを受講しなければなりませんか？
  choices:
    A: 10時間
    B: 12.5時間
    C: 15時間
    D: 20時間
  answer: B
  explanation: ARDプログラムへの参加が認められた場合、12.5時間のアルコール・ハイウェイ・セーフティ・スクールを受講する必要があります。
- id: 395
  category: penalties_and_points
  question: DUIの罪が「等級のない軽罪（ungraded misdemeanor）」として起訴された場合、その訴訟を争う（異議を申し立てる）とどうなりますか？
  choices:
    A: 陪審裁判を受ける権利がありません。
    B: 自動的に5年間の免許停止となります。
    C: 10,000ドルの法定罰金を支払わなければなりません。
    D: 連邦裁判所で裁判を受けます。
  answer: A
  explanation: 等級のない軽罪（ungraded misdemeanor）の容疑では、訴訟を争う場合でも陪審裁判を受ける権利はありません。
- id: 396
  category: penalties_and_points
  question: 法定飲酒年齢に達している運転者が、初めて「一般的障害（General Impairment）」（BAC .08から.099）で違反を犯した場合の免許に関する罰則は何ですか？
  choices:
    A: 6ヶ月の免許停止
    B: 12ヶ月の免許停止
    C: 18ヶ月の免許停止
    D: 処分なし
  answer: D
  explanation: 表1の「一般的障害（General Impairment）」によると、初犯に対する免許の罰則は「処分なし（No action）」となっています。
- id: 397
  category: alcohol_drugs_health
  question: 21歳未満で、血液、呼気、または尿の検査のために拘束された場合、親の同意に関する方針はどうなっていますか？
  choices:
    A: 検査を実施する前に親の同意が必要です。
    B: 親の同意は必要ありませんが、警察は親に逮捕を通知します。
    C: 検査を受けるかどうかを決める前に、親に電話をかけることが許可されなければなりません。
    D: 検査の手順の間、親が立ち会わなければなりません。
  answer: B
  explanation: 未成年者が逮捕され、血液、呼気、または尿の検査のために拘束された場合、これらの検査を実施するための親の同意は必要ありませんが、警察は親に逮捕の事実を通知します。
- id: 398
  category: penalties_and_points
  question: 未成年者に故意かつ意図的にアルコールを提供したとして有罪判決を受けた成人の、初犯に対する最低罰金額はいくらですか？
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: 未成年者に故意かつ意図的にアルコールを提供したとして有罪判決を受けた成人は、たとえ親であっても、初犯で少なくとも1,000ドルの罰金が科せられます。
- id: 399
  category: license_system
  question: 運転免許協定（DLC）の「1人1免許」の概念では、何が義務付けられていますか？
  choices:
    A: 運転者は常に免許証を携帯しなければならない。
    B: 他州で免許を申請する際、州外の免許証を返納しなければならない。
    C: 運転者は最大2つの加盟州の免許を保持できる。
    D: 運転者は毎年免許を更新しなければならない。
  answer: B
  explanation: 「1人1免許」の概念では、別の州で運転免許を申請する際に、現在持っている州外の運転免許証を返納することが義務付けられています。
- id: 400
  category: penalties_and_points
  question: 次の運転者のうち、車両にイグニッション・インターロック装置（エンジン始動阻止装置）を設置する必要があるのは誰ですか？
  choices:
    A: 一般的障害（BAC .08から.099）の初犯の運転者。
    B: 化学検査拒否により運転資格停止処分を受けた運転者。
    C: 制限速度を20マイル以上超えてスピード違反で捕まったすべての運転者。
    D: 運転を伴わない未成年飲酒で有罪判決を受けた運転者。
  answer: B
  explanation: 高い血中アルコール濃度でのDUI初犯および再犯者、ならびに化学検査拒否違反の結果として運転資格停止処分を受けた個人は、イグニッション・インターロック装置の設置が義務付けられます。
- id: 401
  category: penalties_and_points
  question: 21歳未満で初めてDUI（飲酒・薬物影響下運転）で有罪判決を受けた場合、支払わなければならない罰金の範囲はいくらですか？
  choices:
    A: 100ドルから300ドル
    B: 300ドルから1,000ドル
    C: 500ドルから5,000ドル
    D: 1,000ドルから10,000ドル
  answer: C
  explanation: 21歳未満で初めてDUIで有罪判決を受けた場合、収監され、免許は1年間停止され、500ドルから5,000ドルの罰金を支払うことになります。
- id: 402
  category: penalties_and_points
  question: 化学検査拒否の復帰手数料はどのように支払う必要がありますか？
  choices:
    A: 現金または個人小切手
    B: クレジットカードのみ
    C: 公認小切手（certified check）または郵便為替（money order）
    D: オンライン支払いポータル経由
  answer: C
  explanation: 化学検査拒否の復帰手数料は、公認小切手（certified check）または郵便為替（money order）で支払う必要があります。
- id: 403
  category: alcohol_drugs_health
  question: 「高率（High Rate）」罰則（表2）は、BAC（血中アルコール濃度）が少なくともいくつの商用車運転手に適用されますか？
  choices:
    A: '.02'
    B: '.04'
    C: '.08'
    D: '.10'
  answer: B
  explanation: 表2（高率）には、この表がBAC .04以上の商用車運転手にも適用されることが記されています。
- id: 404
  category: penalties_and_points
  question: 州外での交通違反切符に対応しなかった場合、どうなりますか？
  choices:
    A: 500ドルの罰金が科せられる。
    B: ペンシルベニア州での運転資格が無期限に停止される。
    C: 運転記録に違反点数が加算される。
    D: 車両が押収される。
  answer: B
  explanation: マニュアルによると、州外での違反切符に対応しない場合、対応がなされるまでペンシルベニア州での運転資格が無期限に停止されます。
- id: 405
  category: license_system
  question: 氏名や住所を変更した場合、何日以内にPennDOTに通知する必要がありますか？
  choices:
    A: 10日
    B: 15日
    C: 30日
    D: 60日
  answer: B
  explanation: ペンシルベニア州車両法第1515条に基づき、氏名または住所を変更した場合は、州外に転居する場合であっても、変更から15日以内にPennDOTに通知しなければなりません。
- id: 406
  category: safe_driving_rules
  question: ペンシルベニア州の法律によると、乗用車、軽トラック、またはキャンピングカーの助手席でシートベルトの着用が義務付けられているのは誰ですか？
  choices:
    A: 運転手のみ
    B: 18歳未満の同乗者のみ
    C: すべての運転手および助手席の同乗者
    D: エアバッグのない車両の同乗者のみ
  answer: C
  explanation: マニュアルには、乗用車、軽トラック、キャンピングカーのすべての運転手および助手席の同乗者はシートベルトを着用しなければならないと記載されています。
- id: 407
  category: safe_driving_rules
  question: 8歳以上18歳未満の同乗者は、どこでシートベルトを着用しなければなりませんか？
  choices:
    A: 助手席のみ
    B: 後部座席のみ
    C: 車内のどこに乗っているかに関わらず
    D: 車両にエアバッグがない場合のみ
  answer: C
  explanation: 8歳以上18歳未満の同乗者を乗せる場合は、車内のどこに座っているかに関わらず、シートベルトを着用させなければなりません。
- id: 408
  category: safe_driving_rules
  question: 18歳未満の運転者の場合、同乗させることができる最大人数は何人ですか？
  choices:
    A: 1台につき同乗者1名
    B: 最大3名まで
    C: 同乗者の数は車内のシートベルトの数を超えてはならない
    D: 後部座席に安全に座れるだけの人数
  answer: C
  explanation: 18歳未満の運転者の場合、同乗者の数は車内のシートベルトの数を超えてはなりません。
- id: 409
  category: defensive_driving
  question: 時速30マイルでの衝突時に計器パネルやフロントガラスに衝突することは、何に匹敵しますか？
  choices:
    A: 3階建てのビルの屋上から地面に叩きつけられること
    B: 時速15マイルで自転車から転落すること
    C: 1階建ての建物から地面に叩きつけられること
    D: プロのアメフト選手にタックルされること
  answer: A
  explanation: マニュアルでは、時速30マイルで車内の内装面に衝突することは、3階建てのビルの屋上から地面に叩きつけられるようなものだと説明されています。
- id: 410
  category: defensive_driving
  question: 衝突時に車外に放り出された場合、死亡する確率は何倍高くなりますか？
  choices:
    A: 5倍
    B: 10倍
    C: 25倍
    D: 50倍
  answer: C
  explanation: 車外に放り出された場合、死亡する確率はほぼ25倍高くなります。
- id: 411
  category: penalties_and_points
  question: 16歳未満の者がアルコールを購入するために偽造身分証明書を使用した場合の罰則は何ですか？
  choices:
    A: 500ドルの罰金と車両の即時押収
    B: 16歳の誕生日から開始される運転免許停止
    C: 21歳の誕生日まで運転免許試験を受けることができない
    D: アルコール安全教育クラスへの強制出席
  answer: B
  explanation: 16歳未満の者がアルコールを購入するために偽造身分証明書を使用した場合、16歳の誕生日から開始される運転免許停止処分を受けます。
- id: 412
  category: alcohol_drugs_health
  question: 21歳未満の者が自動車を運転していない状態で飲酒した場合、初犯の罰則は何ですか？
  choices:
    A: 90日間の運転免許停止と最大500ドルの罰金
    B: 6ヶ月の保護観察
    C: 矯正施設への収容
    D: 運転記録への違反点数の加算
  answer: A
  explanation: 21歳未満の者が自動車を運転していない状態で飲酒した場合、初犯の罰則は90日間の運転免許停止と最大500ドルの罰金です。
- id: 413
  category: alcohol_drugs_health
  question: 警察が未成年者に対して呼気、血液、尿検査を行う際、親の同意は必要ですか？
  choices:
    A: はい、両親からの同意が必要です
    B: はい、少なくとも片方の親からの同意が必要です
    C: はい、16歳未満の者の場合は必要です
    D: いいえ、必要ありません
  answer: D
  explanation: 呼気、血液、尿検査を行うための親の同意は必要ありません。
- id: 414
  category: penalties_and_points
  question: 21歳未満で初めて飲酒運転（DUI）の有罪判決を受けた場合、免許はどのくらいの期間停止されますか？
  choices:
    A: 30日間
    B: 60日間
    C: 6ヶ月間
    D: 1年間
  answer: D
  explanation: 21歳未満で飲酒運転の有罪判決を受けた場合、初犯で1年間の免許停止処分を受けます。
- id: 415
  category: penalties_and_points
  question: 次の州外での違反のうち、ペンシルベニア州内で発生したものとして扱われ、適切な処分が下されるのはどれですか？
  choices:
    A: 軽微な駐車違反
    B: 制限速度を5マイル超える速度超過
    C: 死亡または負傷者が出た事故における救護義務違反
    D: 期限切れの検査ステッカーを貼った状態での運転
  answer: C
  explanation: 他人の死亡または負傷を伴う車両事故において、停車して救護活動を行わなかった場合（救護義務違反）は、加盟州で犯されたものであっても、ペンシルベニア州で発生したものとして扱われます。
- id: 416
  category: safe_driving_rules
  question: ペンシルベニア州の法律では、2歳未満の子供は車内でどのように固定しなければなりませんか？
  choices:
    A: 助手席で前向きのチャイルドシートを使用する
    B: 製造メーカーが指定する制限を超えるまで、後ろ向きのチャイルドシートを使用する
    C: 腰ベルトと肩ベルトを備えたブースターシートを使用する
    D: 後部座席で標準のシートベルトを使用する
  answer: B
  explanation: 2歳未満の子供は、製造メーカーが指定するチャイルドシートの最大体重および身長の制限を超えるまで、後ろ向きのチャイルドシートで固定しなければなりません。
- id: 417
  category: vehicle_information
  question: エアバッグがある助手席に、後ろ向きのチャイルドシートを設置してはいけないのはなぜですか？
  choices:
    A: エアバッグがチャイルドシートの背面に凄まじい衝撃で衝突し、重大な負傷や死亡の原因となるため。
    B: 運転者の右側サイドミラーの視界を遮るため。
    C: 子供がダッシュボードのライトに気を取られるため。
    D: 助手席のシートベルトがチャイルドシートを固定するのに十分な長さではないため。
  answer: A
  explanation: 衝突時、エアバッグがチャイルドシートの背面に凄まじい衝撃で衝突し、その衝撃が乳児の頭部に伝わり、重大な負傷や死亡の原因となります。
- id: 418
  category: safe_driving_rules
  question: 外気温が華氏80度台（約27度以上）の場合、車内の温度はどのくらいの速さで致死レベルに達する可能性がありますか？
  choices:
    A: 10分
    B: 30分
    C: 45分
    D: 1時間
  answer: A
  explanation: 窓を2インチ（約5センチ）開けていたとしても、外気温が華氏80度台であれば、車内の温度はわずか10分で致死レベルに達することがあります。
- id: 419
  category: defensive_driving
  question: 子供を高温の車内に置き去りにするという悲劇を避けるために推奨されるヒントはどれですか？
  choices:
    A: 車を離れる前に、窓を少なくとも2インチ開ける。
    B: 財布、ブリーフケース、または携帯電話を後部座席に置く。
    C: 用事を済ませている間、エアコンをかけたままにする。
    D: 常にぬいぐるみを助手席に置いておく。
  answer: B
  explanation: マニュアルでは、財布、ブリーフケース、携帯電話、または必要なものを後部座席に置くことを推奨しています。そうすることで、車内に残された子供に必ず気づくようになります。
- id: 420
  category: safe_driving_rules
  question: 厚手の冬用コートは、子供用チャイルドシートの安全性にどのような影響を与える可能性がありますか？
  choices:
    A: 子供が暑くなりすぎて、眠気を誘発する。
    B: 急停車時にシートベルトがロックされるのを妨げる。
    C: 衝突時にコートが圧縮され、ハーネスに大きな緩みが生じる可能性がある。
    D: 車両のLATCHシステム（チャイルドシート固定装置）に干渉する。
  answer: C
  explanation: 厚手の冬用コートは、衝突時に圧縮されてハーネスに大きな緩みを生じさせる可能性があります。ハーネスは、最善の保護を提供するために子供の体に密着していなければなりません。
- id: 421
  category: safe_driving_rules
  question: 児童旅客保護法（Child Passenger Protection Act）229条によると、4歳未満の子供はどのようにしなければなりませんか？
  choices:
    A: 連邦政府承認の児童旅客拘束装置（チャイルドシート）に固定する。
    B: 腰ベルトと肩ベルトを備えたブースターシートで固定する。
    C: エアバッグを無効にした状態で助手席に乗せる。
    D: 車両の標準的な腰ベルトのみを使用して固定する。
  answer: A
  explanation: 4歳未満の子供は、車内のどこに乗るかに関わらず、連邦政府承認の児童旅客拘束装置（チャイルドシート）に固定されなければなりません。
- id: 422
  category: safe_driving_rules
  question: 4歳以上8歳未満の子供には、どのような拘束装置が必要ですか？
  choices:
    A: 後ろ向きの乳児用シート。
    B: 腰ベルトと肩ベルトを併用する、連邦政府承認の児童用ブースターシート。
    C: 肩ベルトのない標準的な腰ベルト。
    D: 後部座席に座る場合は、特別な拘束装置は必要ない。
  answer: B
  explanation: 4歳以上8歳未満の子供は、連邦政府承認の児童用ブースターシートに固定される必要があり、これは腰ベルトおよび肩ベルトと併用しなければなりません。
- id: 423
  category: driver_responsibility
  question: 18歳未満の子供が車内で適切にシートベルトを着用していることを確認する責任は誰にありますか？
  choices:
    A: 子供本人
    B: 車両の所有者
    C: 運転者
    D: 誰が運転しているかに関わらず、その子供の親
  answer: C
  explanation: 運転者は、子供を承認された児童旅客拘束装置に固定し、18歳未満の子供がシートベルトを着用していることを確認する責任があります。
- id: 424
  category: vehicle_information
  question: エアバッグが作動した場合に安全を確保するため、運転者はハンドルからどのくらい離れて座るべきですか？
  choices:
    A: 少なくとも5インチ
    B: 少なくとも10インチ
    C: 少なくとも15インチ
    D: 少なくとも20インチ
  answer: B
  explanation: エアバッグが作動した際の安全を確保するため、ハンドルから少なくとも10インチ（約25cm）離れて座る必要があります。
- id: 425
  category: safe_driving_rules
  question: エアバッグが作動した際の怪我を防ぐために推奨されるハンドルの握り方はどれですか？
  choices:
    A: 10時と2時の位置
    B: 9時と3時の位置、または8時と4時の位置
    C: 12時と6時の位置
    D: 片手を12時の位置に置く
  answer: B
  explanation: ハンドルは9時と3時の位置、または8時と4時の位置で保持してください。これにより、エアバッグが作動した際に、手首や腕が負傷したり骨折したり、あるいは腕が顔に強く当たったりするのを防ぐことができます。
- id: 426
  category: safe_driving_rules
  question: 何歳までの子供が車の後部座席に乗ることが推奨されていますか？
  choices:
    A: 8歳以下
    B: 10歳以下
    C: 12歳以下
    D: 15歳以下
  answer: C
  explanation: ほとんどの衝突事故は前方衝突であり、また子供はじっとしていられずエアバッグの収納部に近づきすぎる傾向があるため、12歳以下のすべての子供は後部座席に乗ることが推奨されています。
- id: 427
  category: driver_testing
  question: 知識試験または路上試験で手話通訳者が必要な場合、どのくらい前にPennDOT（ペンシルベニア州運輸局）に連絡する必要がありますか？
  choices:
    A: 少なくとも24時間前
    B: 少なくとも3日前
    C: 少なくとも1週間前
    D: 少なくとも2週間前
  answer: D
  explanation: 試験を受けたい時期の少なくとも2週間前までにPennDOTに最初の連絡を行ってください。PennDOTは、希望する手話方式に対応できる通訳者を確保できるよう最善を尽くします。
- id: 428
  category: driver_testing
  question: 知識試験の読み取りが困難な人のために、すべての運転免許センターで提供されている代替の試験方法は何ですか？
  choices:
    A: 持ち帰り試験
    B: 教科書持ち込み試験
    C: 音声試験
    D: グループ試験
  answer: C
  explanation: リクエストに応じて、読み取りに困難がある方のために、州内のすべての運転免許センターで音声試験が提供されています。
- id: 429
  category: penalties_and_points
  question: 障害者専用の駐車スペースに不法に駐車した場合の罰則は何ですか？
  choices:
    A: 初犯の場合は警告。
    B: 50ドルから200ドルの罰金、および車両がレッカー移動される可能性がある。
    C: 300ドルの罰金と30日間の免許停止。
    D: 運転記録に3ポイント加算。
  answer: B
  explanation: 障害者用駐車スペースに不法に駐車された車両は、レッカー移動によって撤去される場合があります。この違反で有罪となった個人には、50ドルから200ドルの罰金が科せられます。
- id: 430
  category: penalties_and_points
  question: ペンシルベニア州のポイ捨て禁止法に基づき、車両から廃棄物を捨てた場合の有罪判決時の最大罰金額はいくらですか？
  choices:
    A: $50
    B: $100
    C: $200
    D: $300
  answer: D
  explanation: この法律への違反（あなたが運転する車両に同乗している他の人物の行為による違反を含む）は、有罪判決時に最大300ドルの罰金が科せられる可能性があります。
- id: 431
  category: penalties_and_points
  question: 車内の同乗者の行為による違反を含め、ポイ捨てで有罪判決を受けた場合の最大罰金額はいくらですか？
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: 車内にいる他の人物の行為を含むポイ捨て禁止法違反は、有罪判決を受けると最大300ドルの罰金が科せられる場合があります。
- id: 432
  category: vehicle_information
  question: 公認の検査場での車両の安全点検は、どのくらいの頻度で受ける必要がありますか？
  choices:
    A: 6ヶ月ごと
    B: 12ヶ月ごと
    C: 2年ごと
    D: 3年ごと
  answer: B
  explanation: 車両は12ヶ月ごとに公認の検査場で安全点検を受ける必要があります。
- id: 433
  category: vehicle_information
  question: 警察官が車両の整備不良に気づいた場合、交通違反切符を避けるために何日以内に修理する必要がありますか？
  choices:
    A: 3日
    B: 5日
    C: 10日
    D: 15日
  answer: B
  explanation: 警察官が車両の整備不良に気づいた場合、交通違反切符を避けるために5日以内に修理を求められることがあります。
- id: 434
  category: sharing_the_road
  question: 自転車を追い越す際、自車と自転車の間に最低限空けなければならない距離はどれくらいですか？
  choices:
    A: 2フィート
    B: 3フィート
    C: 4フィート
    D: 6フィート
  answer: C
  explanation: 追い越す際は、安全に通過するために、自車と自転車の間に少なくとも4フィートの距離を空けなければなりません。
- id: 435
  category: sharing_the_road
  question: 自転車を追い越すために、中央の二重黄線を越えることは許可されていますか？
  choices:
    A: いいえ、二重黄線を越えることは常に違法です。
    B: はい、ただし自転車利用者が追い越しの合図を送った場合に限ります。
    C: はい、必要であり、かつ4フィートの間隔を維持するために安全に行える場合に限ります。
    D: いいえ、緊急車両を運転している場合を除きます。
  answer: C
  explanation: 必要であり、かつ安全に行える場合は、自車と自転車の間に4フィートの間隔を維持するために、中央の二重黄線を越えることが許可されています。
- id: 436
  category: sharing_the_road
  question: 自転車利用者は、掲示されている最低速度制限未満で走行したことで摘発されることがありますか？
  choices:
    A: はい、最低速度制限を維持しなければなりません。
    B: はい、交通を妨げている場合は摘発されます。
    C: いいえ、掲示されている最低速度未満で走行することができ、交通を妨げたとして摘発されることはありません。
    D: いいえ、ただし速度制限を下回って走行する場合は路肩を走らなければなりません。
  answer: C
  explanation: 自転車利用者は車両の運転者とみなされ、すべての交通法規を遵守することが期待されています。しかし、掲示されている最低速度未満で走行することができ、交通を妨げたとして摘発されることはありません。
- id: 437
  category: penalties_and_points
  question: ペンシルベニア州のテキストメッセージ送信禁止法（Anti-Texting Law）に基づく有罪判決の罰金はいくらですか？
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: A
  explanation: テキストメッセージ送信禁止法違反は、第一義的な略式違反（primary, summary offense）であり、有罪判決には50ドルの罰金が科せられます。
- id: 438
  category: safe_driving_rules
  question: テキストメッセージ送信禁止法に基づき、警察官に許可されている行動は次のうちどれですか？
  choices:
    A: 証拠として運転者のモバイル機器を差し押さえる。
    B: 物理的に組み込まれたGPS機器の使用に対して違反切符を発行する。
    C: テキストメッセージ送信に対して違反切符を発行するが、対話型ワイヤレス通信機器を差し押さえることはできない。
    D: 州法よりも厳しく機器の使用を制限する地方条例を執行する。
  answer: C
  explanation: この法律は、対話型ワイヤレス通信機器（IWCD）の差し押さえを許可していません。また、GPS機器は対象外であり、地方条例に優先します。
- id: 439
  category: penalties_and_points
  question: 危険な状況により閉鎖された道路の標識を無視して走行し、その行動のために緊急対応要員が出動することになった場合の罰則は何ですか？
  choices:
    A: 250ドルの罰金と記録への2ポイント加算。
    B: 最大500ドルの罰金と緊急対応費用の支払い責任。
    C: 50ドルの罰金と30日間の免許停止。
    D: 300ドルの罰金と記録への4ポイント加算。
  answer: B
  explanation: あなたの行動によって緊急対応要員が出動した場合、罰金は最大500ドルに引き上げられ、緊急対応費用の払い戻し責任を問われます。
- id: 440
  category: sharing_the_road
  question: 「ダッチ・リーチ（Dutch Reach）」法は何を防ぐために考案されたものですか？
  choices:
    A: 密閉されたガレージ内での一酸化炭素中毒。
    B: 車のドアを開けた際に、接近してくる自転車利用者にぶつかること。
    C: 冠水した道路でのスリップ。
    D: 運転中のテキストメッセージ送信。
  answer: B
  explanation: 「ダッチ・リーチ」法は、ドアから遠い方の手でドアを開ける方法です。これにより体が回転するため、接近してくる自転車利用者が確認しやすくなり、ドアが勢いよく開くのを防ぐことができます。
- id: 441
  category: sharing_the_road
  question: 自転車は、開いた車のドアに衝突するのを避けるため、駐車中の車からどのくらい離れて走行すべきですか？
  choices:
    A: 少なくとも1フィート
    B: 少なくとも2フィート
    C: 少なくとも3フィート
    D: 少なくとも4フィート
  answer: C
  explanation: 自転車専用レーンの有無にかかわらず、ドアを避けるために駐車中の車から少なくとも3フィート離れて走行する必要があります。
- id: 442
  category: driver_testing
  question: 18歳未満の場合、仮免許（learner's permit）を取得してから路上試験（Road Test）を受けるまで、どのくらいの期間待つ必要がありますか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 9ヶ月
    D: 12ヶ月
  answer: B
  explanation: 18歳未満の場合、仮免許を取得してから6ヶ月間は路上試験を受けることができません。
- id: 443
  category: safe_driving_rules
  question: 旅行中に511PA情報サービスを利用する際、推奨される方法は何ですか？
  choices:
    A: 州間高速道路を走行中に511に電話する。
    B: 赤信号で停車中に511にテキストを送信する。
    C: 安全に道路脇に停車して電話をかけるか、出発前に確認する。
    D: 運転中にハンズフリー機器を使用して511PAのウェブサイトを閲覧する。
  answer: C
  explanation: PennDOTは、運転中に511PAに電話しないようドライバーに促しています。安全に道路脇に停車してシステムに電話するか、出発前に交通の遅延を確認してください。
- id: 444
  category: alcohol_drugs_health
  question: 次のうち、一酸化炭素中毒の症状はどれですか？
  choices:
    A: 極度の空腹
    B: 吐き気および／または嘔吐
    C: 夜間視力の向上
    D: 心拍数の低下
  answer: B
  explanation: 一酸化炭素中毒の症状には、疲労、めまい、頭痛、吐き気および／または嘔吐、心拍数の上昇、不規則な呼吸、混乱、咳、胸の痛みなどがあります。
- id: 445
  category: alcohol_drugs_health
  question: 雪の日に一酸化炭素中毒を防ぐために何をすべきですか？
  choices:
    A: ガレージのドアを閉めたまま車を暖機する。
    B: 排気管（テールパイプ）を点検し、詰まっている雪や氷を取り除く。
    C: 渋滞でアイドリング中、すべての窓を完全に閉めておく。
    D: 車のエアコンを最大設定にする。
  answer: B
  explanation: 雪の日は、一酸化炭素中毒を防ぐため、常に排気管を点検し、排気を妨げている可能性のある雪や氷を取り除いてください。
- id: 446
  category: safe_driving_rules
  question: 渋滞などでアイドリング中の車内にいる場合、一酸化炭素中毒を防ぐために何をすべきですか？
  choices:
    A: 車のヒーターを最高設定にする
    B: 窓を少し開ける
    C: すべての窓を完全に閉めておく
    D: 車内のルームライトをつける
  answer: B
  explanation: マニュアルによると、渋滞に巻き込まれたり、アイドリング中の車内に座っていたりする場合は、一酸化炭素中毒を防ぐために窓を少し開けるようにしてください。
- id: 447
  category: vehicle_information
  question: マニュアルでは、車の一酸化炭素検知器の電池の点検や交換をいつ行うよう推奨していますか？
  choices:
    A: オイル交換のたびに
    B: 冬の間、月に一度
    C: 春と秋の時刻合わせ（サマータイムの開始・終了）の時期に
    D: 5,000マイル走行するごとに
  answer: C
  explanation: マニュアルでは、電池式の一酸化炭素検知器の設置を検討し、毎年春と秋の時刻合わせの際に電池の点検または交換を行うことを推奨しています。
- id: 448
  category: alcohol_drugs_health
  question: 車内で一酸化炭素中毒の疑いがある場合、まず最初にすべきことは何ですか？
  choices:
    A: すぐに最寄りの病院まで運転する
    B: エンジンを切り、車内で待機する
    C: 窓を下ろして運転を続ける
    D: すぐに車から出て新鮮な空気を吸う
  answer: D
  explanation: 車内で一酸化炭素中毒の疑いがある場合、マニュアルでは、すぐに車から出て新鮮な空気を吸い、直ちに緊急医療機関を受診するよう指示しています。
- id: 449
  category: vehicle_information
  question: 危険な排気ガスが車内に入るのを防ぐために、どこに障害物がないことを確認すべきですか？
  choices:
    A: エアコンの吹き出し口
    B: 排気管（テールパイプ）
    C: ラジエーターグリル
    D: グローブボックス
  answer: B
  explanation: マニュアルは、一酸化炭素中毒につながる可能性があるため、車の排気管を塞いでいるものがないか注意するようドライバーに警告しています。
- id: 450
  category: alcohol_drugs_health
  question: マニュアルによると、黙示の同意（Implied Consent）法は何に関連していますか？
  choices:
    A: アルコールまたは薬物の化学検査
    B: 車両安全点検への同意
    C: 警察による車両捜索の許可
    D: 免許取得時の臓器提供
  answer: A
  explanation: マニュアルの索引には、黙示の同意法が「アルコールまたは薬物の化学検査」に関するものであると明記されています。
- id: 451
  category: safe_driving_rules
  question: ペンシルベニア州の運転マニュアルには、ヘッドライトの使用義務と、車両のどの機能を連動させるべきかについての特定の法律が含まれていますか？
  choices:
    A: 方向指示器
    B: ワイパー
    C: ハザードランプ
    D: デフロスター
  answer: B
  explanation: マニュアルの索引の法律セクションには、特定の「ヘッドライト/ワイパー法（Headlight/Windshield Wiper Law）」が記載されています。
- id: 452
  category: driver_responsibility
  question: マニュアルの中で、運転に悪影響を及ぼす可能性のある「ドライバー要因（Driver Factor）」として挙げられているのはどれですか？
  choices:
    A: 睡眠不足
    B: 高いタイヤ圧
    C: 過剰な燃料消費
    D: エンジンのオーバーヒート
  answer: A
  explanation: 索引の「ドライバー要因（Driver Factors）」セクションでは、アルコール、薬物、不注意などと並んで「睡眠不足（Lack of
    Sleep）」が挙げられています。
- id: 453
  category: defensive_driving
  question: 運転マニュアルにおいて「運転中の緊急事態（Driving Emergency）」に分類されているのはどれですか？
  choices:
    A: テールランプの球切れ
    B: アクセルペダルが戻らなくなった場合
    C: ウォッシャー液の不足
    D: ラジオの故障
  answer: B
  explanation: 索引の「運転中の緊急事態への対処（Driving Emergencies, Dealing With）」というセクションに、「アクセルの固着（Accelerator
    Sticks）」が記載されています。
- id: 454
  category: safe_driving_rules
  question: ペンシルベニア州の運転マニュアルでは、車両のどの部分に同乗者が乗ることに関する特定の法律が概説されていますか？
  choices:
    A: 助手席
    B: 3列目シート
    C: 荷台が開放されたトラック
    D: サンルーフ付きの車両
  answer: C
  explanation: 索引の法律セクションには、「荷台が開放されたトラックの同乗者（Passengers in an Open-Bed Truck）」に関する特定の項目があります。
- id: 455
  category: driver_testing
  question: 運転免許試験およびサービスにおいて、マニュアルではどのような人に対して通訳が利用可能であると示されていますか？
  choices:
    A: 視覚障害者
    B: 聴覚障害者
    C: 身体障害者
    D: 英語を話さない人
  answer: B
  explanation: マニュアルの索引には、「聴覚障害者のための通訳（Interpreters for the Deaf/Hearing Impaired）」という項目があります。
- id: 456
  category: penalties_and_points
  question: ペンシルベニア州の運転マニュアルに記載されている「ゼロ・トレランス（Zero Tolerance）」法は、何に適用されますか？
  choices:
    A: スクールゾーンでの速度超過
    B: 運転中のテキストメッセージ送信
    C: 21歳未満の飲酒・薬物影響下運転（DUI）
    D: 無保険運転
  answer: C
  explanation: 索引には、「ゼロ・トレランス（Zero Tolerance）」が「（21歳未満のDUI）」に適用されることが明記されています。
- id: 457
  category: safe_driving_rules
  question: マニュアルには、車両から何を除去することに関する特定の法律とガイドラインが記載されていますか？
  choices:
    A: バンパーステッカー
    B: 雪と氷
    C: 社外品のウィンドウフィルム
    D: ルーフラック
  answer: B
  explanation: 索引の法律セクションには、「雪/氷の除去（Snow/Ice Removal）」に関する特定の法律が記載されています。
- id: 458
  category: defensive_driving
  question: ドライバーが安全な車間距離を保つために、マニュアルで参照されているルールは何ですか？
  choices:
    A: 「2秒ルール」
    B: 「3秒ルール」
    C: 「4秒ルール」
    D: 「10秒ルール」
  answer: C
  explanation: 索引には、マニュアルで扱われているトピックとして「4秒ルール（The Four-Second Rule）」が具体的に記載されています。
- id: 459
  category: license_system
  question: マニュアルの法律セクションによると、ドライバーは何の変更について通知を行う義務がありますか？
  choices:
    A: 車両の色
    B: 雇用形態
    C: 氏名または住所
    D: 保険会社
  answer: C
  explanation: 索引には、「氏名または住所の変更に関する義務的通知（Required Notification for Change in Name
    or Address）」という法律が記載されています。
- id: 460
