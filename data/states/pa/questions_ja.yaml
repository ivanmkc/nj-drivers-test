  question: カーブに近づく際の速度管理について、最も重要なことは何ですか？
  choices:
    A: カーブに入る前に減速する
    B: カーブに入る前に緩やかに加速する
    C: カーブの間中、制限速度で走行する
    D: カーブの最も急な部分でのみ減速する
  answer: A
  explanation: カーブにおける速度管理で最も重要なことは、カーブに入る前に減速することです。
- id: 356
