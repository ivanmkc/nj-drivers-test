  question: サイレンを鳴らした緊急車両が通過した後、その車両の後方どのくらいの距離以内に近づいて運転してはいけませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: サイレンを鳴らした緊急車両が通過した後は、その緊急車両の後方500フィート以内に近づいて運転してはいけません。
- id: 351
