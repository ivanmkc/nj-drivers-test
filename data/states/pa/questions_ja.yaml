    D: 21歳以上である場合
  answer: C
  explanation: クラスC免許を持つ消防士または救助隊員は、消防署長または救助・緊急隊の責任者からの許可証があれば、緊急車両を運転することができます。
- id: 47
  category: license_system
  question: クラスM運転免許における「8」の制限事項は何を示していますか？
  choices:
    A: 運転時に矯正レンズ（眼鏡・コンタクト）を使用しなければならない
    B: 二輪のオートバイの運転が禁止されている
    C: オートバイの運転が禁止されており、原動機付自転車（motor-driven cycle）のみ運転できる
