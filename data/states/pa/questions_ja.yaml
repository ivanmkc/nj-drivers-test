questions:
- id: 1
  category: sharing_the_road
  question: 道路上で、オートバイの運転者はどのような権利と責任を持っていますか？
  choices:
    A: 乗用車よりも権利が少ない。
    B: 他の車両の運転者と同じ権利と責任。
    C: 指定されたオートバイ専用レーンを走行する権利のみ。
    D: 交通信号を免除される特別な特権。
  answer: B
  explanation: マニュアルによると、オートバイの運転者は、道路上で他の車両の運転者と同じ権利と責任を持っています。
- id: 2
  category: sharing_the_road
  question: マニュアルによると、オートバイと他の種類の車両が関与する衝突事故の約3分の2は誰が原因ですか？
  choices:
    A: オートバイの運転者。
    B: 相手側の車両の運転者。
    C: 道路を横断している歩行者。
    D: 予測不可能な天候。
  answer: B
  explanation: マニュアルには、これらの衝突事故の約3分の2は、オートバイの運転者ではなく、相手側の車両の運転者によって引き起こされていると記載されています。
- id: 3
  category: safe_driving_rules
  question: オートバイの後ろを走行する場合、どのくらいの車間距離を空けるべきですか？
  choices:
    A: 1〜2秒。
    B: 3〜4秒。
    C: 5〜6秒。
    D: 少なくとも10秒。
  answer: B
  explanation: マニュアルでは、緊急時にオートバイの運転者が操縦や停止を行うための十分な時間を確保できるよう、オートバイの後ろを走行する際は3〜4秒の車間距離を空けるよう指示しています。
- id: 4
  category: defensive_driving
  question: 乾燥した路面状況において、オートバイの後ろに余分な車間距離を空けることが重要なのはなぜですか？
  choices:
    A: オートバイは車よりも停止に時間がかかるため。
    B: オートバイは他の車両よりも素早く停止できるため。
    C: オートバイは乾燥した天候で頻繁にエンストするため。
    D: 乾燥した砂埃によって運転者の視界が遮られるため。
  answer: B
  explanation: マニュアルには、乾燥した状況ではオートバイは他の車両よりも素早く停止できるため、追突事故を避けるためにより長い車間距離が必要であると記されています。
- id: 5
  category: defensive_driving
  question: 対向するオートバイの方向指示器が点滅しているのを見かけたら、どうすべきですか？
  choices:
    A: オートバイが確実に曲がるので、すぐに進む。
    B: 運転者に曲がることを思い出させるためにクラクションを鳴らす。
    C: 進む前に、オートバイが本当に曲がるかどうかを確認するために待つ。
    D: 視認性を高めるためにハイビームを点灯する。
  answer: C
  explanation: オートバイの方向指示器は通常、自動的に消えないため、運転者が消し忘れることがあります。マニュアルでは、進む前にオートバイが確実に曲がることを確認するために待つようアドバイスしています。
- id: 6
  category: sharing_the_road
  question: オートバイと同じ車線を走行する場合、どうすべきですか？
  choices:
    A: より多くの車両が通行できるように、車線を共有する。
    B: 風から守るために、オートバイのすぐ横を走行する。
    C: オートバイの運転者に車線全体の幅を譲り、車線を共有しない。
    D: 十分なスペースがあれば、同じ車線内でオートバイを追い越す。
  answer: C
  explanation: マニュアルには、オートバイの運転者に車線全体の幅を譲るべきであると記されており、明確に「車線を共有してはならない」と述べられています。
- id: 7
  category: sharing_the_road
  question: 他の車両が関与するオートバイ事故の大部分は、何によって引き起こされますか？
  choices:
    A: 他の車両がオートバイの直前で左折すること。
    B: オートバイが他の車両に追突すること。
    C: 他の車両が赤信号で右折すること。
    D: オートバイが右側の路肩から追い越すこと。
  answer: A
  explanation: マニュアルによると、他の車両が関与するオートバイ事故の約40パーセントは、他の車両がオートバイの直前で左折したことによって引き起こされています。
- id: 8
  category: defensive_driving
  question: オートバイの運転者は、ポットホール（路面のくぼみ）や踏切などの危険な道路状況に対して、どのような反応を示す可能性がありますか？
  choices:
    A: 一定の速度と直進を維持する。
    B: 突然速度を変えたり、車線内での位置を調整したりする。
    C: 道路の真ん中で完全に停止する。
    D: 右左折の合図を出し、道路から出る。
  answer: B
  explanation: オートバイの運転者は、ポットホール、砂利、踏切などの道路や交通状況に反応して、突然速度を変えたり、車線内での位置を調整したりすることがあります。
- id: 9
  category: sharing_the_road
  question: 強風や大型トラックからの突風は、オートバイにどのような影響を与える可能性がありますか？
  choices:
    A: オートバイの燃費が向上する。
    B: オートバイを車線全体にわたって押し流す可能性がある。
    C: オートバイを強制的に加速させる。
    D: オートバイの進路に大きな影響はない。
  answer: B
  explanation: マニュアルでは、運転者が備えていない場合、強い突風によってオートバイが車線全体を横切るほど移動させられる可能性があると警告しています。
- id: 10
  category: safe_driving_rules
  question: ペンシルベニア州法によると、道路交通法が適用されるのはどの3種類の車両ですか？
  choices:
    A: 自動車、ボート、飛行機。
    B: 自転車、馬車、自動車。
    C: 自動車、ATV（全地形対応車）、スノーモービル。
    D: 乗用車、商用トラック、オートバイのみ。
  answer: B
  explanation: マニュアルには、道路交通法はペンシルベニア州法で認められている3種類の車両（自転車、馬車、自動車）に適用されると記載されています。
- id: 11
  category: safe_driving_rules
  question: ペンシルベニア州において、交通信号機は自転車利用者にどのように適用されますか？
  choices:
    A: 自転車利用者は、赤信号を一時停止標識（譲れ）として扱うことができる。
    B: 自転車利用者は、赤信号での停止を免除されている。
    C: 自転車利用者は、自動車運転者と同様に、赤信号で停止することが義務付けられている。
    D: 自転車利用者は、すべての交差点で自転車を降りて歩かなければならない。
  answer: C
  explanation: マニュアルには「例えば、すべての自転車利用者は、自動車運転者と同様に、赤信号で停止することが義務付けられています」と明記されています。
- id: 12
  category: driver_responsibility
  question: ペンシルベニア州での運転に関する記述のうち、正しいものはどれですか？
  choices:
    A: 運転はすべての市民にとっての憲法上の権利である。
    B: 運転は権利ではなく特権である。
    C: 運転は18歳以上の者のみに与えられた権利である。
    D: 運転は取り消すことのできない権利である。
  answer: B
  explanation: マニュアルの導入部には「運転は権利ではなく特権である」とはっきりと記載されています。
- id: 13
  category: license_system
  question: 18歳未満の場合、知識試験（Knowledge Test）を受ける前にどの追加書類を完成させる必要がありますか？
  choices:
    A: 商業運転免許申請書
    B: 車両登録用紙
    C: 親または保護者の同意書 (DL-180TD)
    D: 臓器提供者指定用紙
  answer: C
  explanation: マニュアルには、18歳未満の場合、親または保護者が「親または保護者の同意書 (DL-180TD)」を記入しなければならないと記載されています。
- id: 14
  category: alcohol_drugs_health
  question: マニュアルによると、アルコールと運転に関する非常に重要な責任は何ですか？
  choices:
    A: 短距離を運転する場合のみ飲酒してもよい。
    B: 飲酒と運転を絶対に一緒にしてはいけない（飲酒運転をしない）。
    C: 速度制限を守っていれば、飲酒運転をしてもよい。
    D: 免許を持っている同乗者がいれば、飲酒運転をしてもよい。
  answer: B
  explanation: マニュアルでは「非常に重要な責任の一つは、飲酒と運転を絶対に一緒にしないことです」と強調されています。
- id: 15
  category: sharing_the_road
  question: 接近してくるモーターサイクルの速度や距離を判断するのが難しいのはなぜですか？
  choices:
    A: モーターサイクルは通常、制限速度を大幅に超えて走行するため。
    B: モーターサイクルは他の車両よりも輪郭（プロファイル）がはるかに小さいため。
    C: モーターサイクルにはヘッドライトがないため。
    D: モーターサイクルは路面の色に溶け込んでしまうため。
  answer: B
  explanation: マニュアルでは、モーターサイクルは他の車両よりも輪郭がはるかに小さいため、接近してくるモーターサイクルの速度や距離を判断するのが難しくなる場合があると説明されています。
- id: 16
  category: license_system
  question: ペンシルベニア州で非商用学習許可証（ラーナーズパーミット）を申請するには、何歳である必要がありますか？
  choices:
    A: 15歳
    B: 15歳半
    C: 16歳
    D: 18歳
  answer: C
  explanation: マニュアルによると、16歳の誕生日より前に許可証を申請することはできません。
- id: 17
  category: license_system
  question: 学習許可証の申請のための身体検査は、いつから受けることができますか？
  choices:
    A: 16歳の誕生日の3ヶ月前以降
    B: 16歳の誕生日の6ヶ月前以降
    C: 16歳の誕生日の1年前以降
    D: 16歳の誕生日当日以降のみ
  answer: B
  explanation: 身体検査の実施日は、16歳の誕生日の6ヶ月前以内でなければなりません。
- id: 18
  category: driver_testing
  question: 運転免許証を取得するために合格しなければならない3つの試験は何ですか？
  choices:
    A: 視力試験、知識試験、路上試験
    B: 聴力試験、知識試験、路上試験
    C: 視力試験、反射神経試験、路上試験
    D: 知識試験、路上試験、高速道路試験
  answer: A
  explanation: 運転免許証を取得するには、視力試験、知識試験、および路上試験を受けて合格する必要があります。
- id: 19
  category: license_system
  question: 18歳未満で、親または保護者が運転免許センターに同行できない場合、同意書 (DL-180TD) はどう処理される必要がありますか？
  choices:
    A: 校長の署名が必要である。
    B: PennDOTに直接郵送しなければならない。
    C: 公証人（Notary）の面前で署名されなければならない。
    D: 21歳以上の免許保持者の署名が必要である。
  answer: C
  explanation: 親または保護者が申請者に同行できない場合、DL-180TDは公証人の面前で署名されなければなりません。
- id: 20
  category: license_system
  question: 18歳以上で許可証を申請する場合、何通の居住証明を提示する必要がありますか？
  choices:
    A: 1通
    B: 2通
    C: 3通
    D: 4通
  answer: B
  explanation: 18歳以上の場合は、2通の居住証明を提示する必要があります。
- id: 21
  category: license_system
  question: 運転免許センターに生年月日を証明するものと身分証明書を持参する際、次のうち正しいものはどれですか？
  choices:
    A: 高画質のコピーが望ましい。
    B: スマートフォンのデジタルコピーでも受け付けられる。
    C: 書類は原本である必要があり、コピーは受け付けられない。
    D: 学生証は出生証明書の代わりになる。
  answer: C
  explanation: マニュアルには、生年月日を証明するものおよび身分証明書は原本でなければならない（コピーは不可）と記載されています。
- id: 22
  category: license_system
  question: 発行後、ペンシルベニア州の非商用学習許可証（ラーナーズパーミット）はどのくらいの期間有効ですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 4年
  answer: B
  explanation: 知識試験（学科試験）に合格すると、試験官から学習許可証が交付されます。これは1年間有効です。
- id: 23
  category: driver_testing
  question: 18歳未満の場合、路上試験を受ける前に何時間の実地訓練（運転技能習得）を完了させる必要がありますか？
  choices:
    A: 40時間
    B: 50時間
    C: 65時間
    D: 100時間
  answer: C
  explanation: 18歳未満の場合、路上試験を受ける前に、少なくとも65時間の実地訓練を完了させる必要があります。
- id: 24
  category: driver_testing
  question: 18歳未満の運転者の場合、義務付けられている実地訓練には特定の条件下での走行時間が含まれている必要があります。それは何ですか？
  choices:
    A: 夜間走行10時間、悪天候時の走行5時間
    B: 夜間走行5時間、悪天候時の走行10時間
    C: 夜間走行15時間、高速道路の走行5時間
    D: 高速道路の走行10時間、悪天候時の走行10時間
  answer: A
  explanation: 65時間の実地訓練には、少なくとも10時間の夜間走行と5時間の悪天候時の走行が含まれていなければなりません。
- id: 25
  category: driver_responsibility
  question: 学習許可証を保持している運転者の助手席に同乗することが許可されているのは誰ですか？
  choices:
    A: 18歳以上の免許を保有する運転者。
    B: 21歳以上の免許を保有する運転者、または18歳以上の免許を保有する親、保護者、配偶者。
    C: 免許の有無にかかわらず、21歳以上のすべての乗客。
    D: 免許を持つ教習指導員のみ。
  answer: B
  explanation: 21歳以上の免許を保有する運転者、または18歳以上で免許を保有する親、保護者、親代わりの人（loco parentis）、もしくは配偶者が助手席に同乗しなければなりません。
- id: 26
  category: safe_driving_rules
  question: 18歳未満の運転者の同乗者制限は何ですか？
  choices:
    A: 家族以外の同乗者は1名のみ。
    B: 指導員以外の同乗者は認められない。
    C: 車内のシートベルトの数を超える同乗者を乗せることはできない。
    D: 18歳未満の同乗者は3名まで。
  answer: C
  explanation: 18歳未満の運転者は、車内のシートベルトの数を超える同乗者を乗せることはできません。
- id: 27
  category: driver_testing
  question: 18歳未満の運転者が路上試験を受けることができるようになるまで、許可証の発行日から数えて義務付けられている待機期間はどのくらいですか？
  choices:
    A: 30日
    B: 3ヶ月
    C: 6ヶ月
    D: 1年
  answer: C
  explanation: 路上試験を受けるには、許可証の発行日から義務付けられている6ヶ月間を待つ必要があります。
- id: 28
  category: driver_testing
  question: 路上試験に3回不合格になった場合、どうなりますか？
  choices:
    A: 再試験まで1年間待たなければならない。
    B: 許可証の追加/延長/再発行/変更/訂正を行うためのDL-31フォームを入手することができる。
    C: 学習許可証が永久に失効する。
    D: 直ちに知識試験を再受験しなければならない。
  answer: B
  explanation: 学習許可証の期限が切れた場合、または路上試験に3回不合格になった場合は、非商用学習許可証の追加/延長/再発行/変更/訂正のための申請書（DL-31）を入手することができます。
- id: 29
  category: driver_testing
  question: 知識試験に不合格になった場合、最短でいつ再受験できますか？
  choices:
    A: 別の場所に行けば、同じ日に2回目を受けることができる。
    B: 少なくとも7日間待たなければならない。
    C: 知識試験は、場所にかかわらず1日に1回しか受けることができない。
    D: 再受験まで30日間待たなければならない。
  answer: C
  explanation: 知識試験は、試験会場にかかわらず、1日に1回しか受けることができません。
- id: 30
  category: driver_responsibility
  question: ペンシルベニア州の学習許可証を使用して他州で運転する予定がある場合、どうすべきですか？
  choices:
    A: 全米で有効であると見なす。
    B: 国際運転免許証を申請する。
    C: 自身の保険会社および他州の運輸局（DOT）に確認する。
    D: 他州では日中のみ運転する。
  answer: C
  explanation: ペンシルベニア州外での運転に学習許可証を使用する場合は、その許可証が有効と見なされるかどうか、自身の保険会社およびその州の運輸局に確認してください。
- id: 31
  category: driver_testing
  question: 知識テスト（筆記試験）は1日に何回受けることができますか？
  choices:
    A: 合格するまで何度でも
    B: 2回
    C: 1回
    D: 3回
  answer: C
  explanation: マニュアルによると、試験会場に関わらず、知識テストは1日に1回しか受けることができません。
- id: 32
  category: license_system
  question: 18歳未満の場合、運転免許証に「臓器提供者（ORGAN DONOR）」の指定を受けるには何が必要ですか？
  choices:
    A: 健康診断証明書
    B: 親、保護者、親代わりの人、または18歳以上の配偶者からの書面による同意
    C: 臓器提供啓発信託基金への10ドルの義務的な寄付
    D: 主治医による公証済みの供述書
  answer: B
  explanation: 18歳未満の申請者も臓器提供者の指定を希望できますが、親、保護者、親代わりの人、または18歳以上の配偶者からの書面による同意が必要です。
- id: 33
  category: license_system
  question: 社会保障番号（Social Security number）は、仮免許証や運転免許証に記載されますか？
  choices:
    A: はい、本人確認のためにすべての許可証や免許証に記載されます。
    B: はい、ただし仮免許証のみに記載されます。
    C: いいえ、仮免許証や運転免許証には記載されません。
    D: はい、特に削除を依頼しない限り記載されます。
  answer: C
  explanation: マニュアルには「社会保障番号は、仮免許証や運転免許証には記載されません」と記されています。
- id: 34
  category: driver_testing
  question: 試験中に視力がペンシルベニア州の視力基準に達しなかった場合、どうなりますか？
  choices:
    A: 運転免許の取得資格を永久に失います。
    B: 眼科医または医師が記入するための視力検査報告書（DL-102）が渡されます。
    C: 直ちに特殊な路上試験を受けなければなりません。
    D: 追加の試験なしに、自動的に日中のみの運転制限が課されます。
  answer: B
  explanation: 視力が基準に達しない場合、試験官は眼科医、検眼士、またはかかりつけの医師が記入するための視力検査報告書（DL-102）を渡します。
- id: 35
  category: license_system
  question: 他の州の有効な運転免許証を持ってペンシルベニア州に転入した場合、ペンシルベニア州の運転免許証を取得するまでにどのくらいの期間がありますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 6ヶ月
  answer: B
  explanation: 他の州またはカナダの有効な運転免許証を持ってペンシルベニア州に転入した人は、転居後60日以内にペンシルベニア州の運転免許証を取得しなければなりません。
- id: 36
  category: license_system
  question: 有効な外国の運転免許証を持っている人は、ペンシルベニア州でどのくらいの期間運転することが認められていますか？
  choices:
    A: 米国入国日から最長30日間
    B: 米国入国日から最長6ヶ月間
    C: 米国入国日から最長1年間、または外国免許証の有効期限が切れるまでのいずれか早い方
    D: 国際運転免許証を携帯している限り、無期限
  answer: C
  explanation: 有効な外国の運転免許証を所持している人は、米国入国日から最長1年間、または外国免許証の有効期限が切れるまでのいずれか早い方の期間、ペンシルベニア州で運転することが認められています。
- id: 37
  category: license_system
  question: ジュニア仮免許（Junior Learner's Permit）を持つ18歳未満の運転者を監督する資格があるのは誰ですか？
  choices:
    A: 18歳以上のすべての免許保有運転者
    B: 21歳以上の免許保有運転者、または18歳以上の親、保護者、親代わりの人、もしくは配偶者
    C: 少なくとも1年の運転経験があるすべての免許保有運転者
    D: 州認定のドライビングインストラクターのみ
  answer: B
  explanation: 21歳以上の免許保有運転者、または18歳以上で免許を保有している親、保護者、親代わりの人、もしくは配偶者の監督下でのみ運転することができます。
- id: 38
  category: safe_driving_rules
  question: ジュニア仮免許またはジュニア運転免許で運転する場合、同乗者の人数に関する規則は何ですか？
  choices:
    A: 監督する運転者以外の同乗者を乗せることはできません。
    B: シートベルトの数に関わらず、5人まで同乗させることができます。
    C: 運転している車両で利用可能なシートベルトの数を超える同乗者を乗せることはできません。
    D: 同居の家族のみを乗せることができます。
  answer: C
  explanation: ジュニア仮免許とジュニア運転免許の両方について、マニュアルには「運転している車両で利用可能なシートベルトの数を超える同乗者を乗せることはできません」と記されています。
- id: 39
  category: license_system
  question: 18歳以上の親、保護者、または配偶者が同伴しない場合、ジュニア運転免許の運転制限時間はいつですか？
  choices:
    A: 午後9時から午前6時
    B: 午後10時から午前5時
    C: 午後11時から午前5時
    D: 午前0時から午前6時
  answer: C
  explanation: ジュニア運転免許では、親、保護者、親代わりの人、または18歳以上の配偶者が同伴しない限り、午後11時から午前5時の間は運転できません。
- id: 40
  category: license_system
  question: ジュニアドライバーが、親や保護者の同伴なしに午後11時から午前5時の間に合法的に運転できるのは、次のうちどれですか？
  choices:
    A: 学校のスポーツイベントから帰宅する場合
    B: 公共サービスや慈善活動、ボランティア消防隊、または仕事に従事している場合
    C: 勉強会のために友人の家へ運転する場合
    D: 少なくとも3ヶ月間、無事故無違反の記録がある場合
  answer: B
  explanation: 公証済みの供述書を携帯している場合に限り、公共サービスや慈善活動に従事している、ボランティア消防隊のメンバーである、またはその時間帯に雇用されている場合は、午後11時から午前5時の間でも運転することができます。
- id: 41
  category: safe_driving_rules
  question: ジュニア免許（Junior Driver's License）での運転開始から最初の6か月間、親または保護者が同乗していない場合、18歳未満の同乗者（近親者を除く）は何人まで乗せることができますか？
  choices:
    A: なし
    B: 1人
    C: 2人
    D: 3人
  answer: B
  explanation: 親、保護者、親代わりの人、または18歳以上の配偶者が同乗していない限り、近親者ではない18歳未満の同乗者を1名を超えて乗せることはできません。
- id: 42
  category: penalties_and_points
  question: ジュニアドライバーが、掲示された制限速度を時速何マイル（mph）超えて運転し有罪判決を受けた場合、義務的な90日間の免許停止処分を受けますか？
  choices:
    A: 10 mph以上
    B: 15 mph以上
    C: 20 mph以上
    D: 26 mph以上
  answer: D
  explanation: 累積点数が6点以上に達した場合、または掲示された制限速度を時速26マイル（mph）以上超えて運転し有罪判決を受けた場合、義務的な90日間の免許停止処分を受けます。
- id: 43
  category: license_system
  question: ジュニア免許（Junior Driver's License）は何歳になると自動的に普通運転免許に切り替わりますか？
  choices:
    A: 17歳
    B: 18歳
    C: 19歳
    D: 21歳
  answer: B
  explanation: マニュアルには「ジュニア免許は、18歳になると自動的に普通運転免許になります」と記載されています。
- id: 44
  category: license_system
  question: ペンシルベニア州の運転免許区分のうち、一般的な乗用車、ピックアップトラック、およびバンを対象としているのはどのクラスですか？
  choices:
    A: クラスA
    B: クラスB
    C: クラスC
    D: クラスM
  answer: C
