    D: この先に回り道がある
  answer: C
  explanation: 曲がった矢印が描かれた黄色のひし形の標識は、この先の道路にカーブがあることを警告しています。カーブに入る前に速度を落としてください。
  id: 506
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角を示している
    B: 大幅な減速が必要な急カーブを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角を示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
