  answer: B
  explanation: マニュアルには「ミラーやセンサーだけに頼らず、左右の肩越しに目視して、自車の死角に誰もいないことを確認してください」と記載されています。
- id: 185
  category: safe_driving_rules
  question: 車両を後退（バック）させる準備をする際、最初にすべきことは何ですか？
