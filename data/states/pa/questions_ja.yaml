  question: 霧、雪、大雨などの悪天候時に運転する場合、どのヘッドライトを使用すべきですか？
  choices:
    A: ハイビーム
    B: ロービーム
    C: パーキングライト（駐停車灯）のみ
    D: デイタイム・ランニング・ライト（昼間点灯灯）のみ
  answer: B
  explanation: マニュアルには次のように記載されています。「悪天候時にはロービームのみを使用してください。ハイビームは、このような条件下では実際には視界を悪化させます。」
- id: 192
