- id: 339
  category: defensive_driving
  question: ドライバーの「死角（ブラインドスポット）」とは何を意味しますか？
  choices:
    A: 頭を動かさなければ確認できない道路上の範囲
    B: 車両の真後ろの範囲
    C: ルームミラーで見える範囲
    D: サイドミラーで見える範囲
  answer: A
  explanation: 死角とは、肩越しに振り向いて確認しなければ見ることができない道路上の範囲のことです。
- id: 340
  category: safe_driving_rules
  question: 車両を後退（バック）させる前に従うべき適切な手順は何ですか？
  choices:
    A: ミラーだけで安全を確認する
    B: ライトを点滅させて周囲に警告する
    C: ドアを開けて後方を確認する
    D: 頭を向けてリアウィンドウ越しに確認する
