- id: 165
  category: alcohol_drugs_health
  question: 薬の警告ラベルに「重機の操作を控えてください（Don't operate heavy machinery）」と記載されている場合、ドライバーにとってそれは何を意味しますか？
  choices:
    A: 普通乗用車は運転してもよいが、商用トラックは運転してはいけない
    B: 自分の車両も重機と見なされるため、運転すべきではない
    C: 意識がはっきりしていると感じる限り、運転してもよい
    D: 制限速度以下で運転しなければならない
  answer: B
  explanation: マニュアルではドライバーに対し、「警告ラベルに『重機の操作を控えてください』とある場合、あなたの車両も重機と見なされます！」と注意を促しています。
- id: 166
  category: driver_responsibility
  question: 運転経験が何年未満のドライバーが、事故につながるミスを犯す可能性が最も高いですか？
  choices:
    A: 1年
    B: 3年
    C: 5年
    D: 10年
  answer: C
