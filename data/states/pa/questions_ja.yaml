questions:
- id: 1
  category: sharing_the_road
  question: オートバイの運転者は、道路上でどのような権利と責任を持っていますか？
  choices:
    A: 乗用車よりも権利が少ない。
    B: 他の車両の運転者と同じ権利と責任。
    C: 指定されたオートバイ専用レーンを走行する権利のみ。
    D: 交通信号を免除される特別な特権。
  answer: B
  explanation: マニュアルによると、オートバイの運転者は道路上で他の車両の運転者と同じ権利と責任を持っています。
- id: 2
  category: sharing_the_road
  question: マニュアルによると、オートバイと他の種類の車両が関与する衝突事故の約3分の2は、誰が原因ですか？
  choices:
    A: オートバイの運転者。
    B: 他の車両の運転者。
    C: 道路を横断している歩行者。
    D: 予測不可能な天候。
  answer: B
  explanation: マニュアルには、これらの衝突事故の約3分の2はオートバイの運転者ではなく、相手側の車両の運転者によって引き起こされていると記載されています。
- id: 3
  category: safe_driving_rules
  question: オートバイの後ろを走行する場合、どのくらいの車間距離を空けるべきですか？
  choices:
    A: 1〜2秒。
    B: 3〜4秒。
    C: 5〜6秒。
    D: 少なくとも10秒。
  answer: B
  explanation: マニュアルでは、緊急時にオートバイが操縦や停止を行うための十分な時間を確保できるよう、オートバイの後ろを走行する際は3〜4秒の車間距離を空けるよう指示しています。
- id: 4
  category: defensive_driving
  question: 乾燥した路面状況で、オートバイの後ろに余分な車間距離を空けることが重要なのはなぜですか？
  choices:
    A: オートバイは車よりも停止に時間がかかるため。
    B: オートバイは他の車両よりも素早く停止できるため。
    C: オートバイは乾燥した天候で頻繁にエンストするため。
    D: 乾燥した砂埃によって運転者の視界が遮られるため。
  answer: B
  explanation: マニュアルには、乾燥した路面ではオートバイは他の車両よりも素早く停止できるため、追突事故を避けるために大きな車間距離が必要であると記されています。
- id: 5
  category: defensive_driving
  question: 対向してくるオートバイの方向指示器（ウィンカー）が点滅しているのを見たら、どうすべきですか？
  choices:
    A: オートバイは確実に曲がるので、すぐに進む。
    B: 運転者に曲がることを思い出させるためにクラクションを鳴らす。
    C: オートバイが本当に曲がることを確認できるまで待ってから進む。
    D: 視認性を高めるためにハイビームを点灯する。
  answer: C
  explanation: オートバイの方向指示器は通常、自動的に消えないため、運転者が消し忘れることがあります。マニュアルでは、進む前にオートバイが本当に曲がるかどうかを確認するために待つことを推奨しています。
- id: 6
  category: sharing_the_road
  question: オートバイと同じ車線を走行する場合、どうすべきですか？
  choices:
    A: より多くの車両が通行できるように車線を共有する。
    B: 風から守るためにオートバイのすぐ横を走行する。
    C: オートバイに車線全体の幅を譲り、車線を共有しない。
    D: 十分なスペースがあれば、同じ車線内でオートバイを追い越す。
  answer: C
  explanation: マニュアルには、オートバイの運転者に車線全体の幅を譲るべきであると記されており、「車線を共有してはならない」と明記されています。
- id: 7
  category: sharing_the_road
  question: 他の車両が関与するオートバイ事故の大部分は、何によって引き起こされますか？
  choices:
    A: 他の車両がオートバイの前で左折すること。
    B: オートバイが他の車両に追突すること。
    C: 他の車両が赤信号で右折すること。
    D: オートバイが右側の路肩から追い越すこと。
  answer: A
  explanation: マニュアルによると、他の車両が関与するオートバイ事故の約40パーセントは、他の車両がオートバイの直前で左折したことによって引き起こされています。
- id: 8
  category: defensive_driving
  question: オートバイの運転者は、ポットホール（路面のくぼみ）や踏切などの危険な路面状況に対して、どのような反応をすることがありますか？
  choices:
    A: 一定の速度と直進を維持する。
    B: 突然速度を変えたり、車線内での位置を調整したりする。
    C: 道路の真ん中で完全に停止する。
    D: 右左折の合図を出して道路から出る。
  answer: B
  explanation: オートバイの運転者は、ポットホール、砂利、踏切などの路面や交通状況に反応して、突然速度を変えたり、車線内での位置を調整したりすることがあります。
- id: 9
  category: sharing_the_road
  question: 強風や大型トラックからの突風は、オートバイにどのような影響を与える可能性がありますか？
  choices:
    A: オートバイの燃費を向上させる。
    B: オートバイを車線全体にわたって横に移動させてしまう可能性がある。
    C: オートバイを強制的に加速させる。
    D: オートバイの進路に大きな影響は与えない。
  answer: B
  explanation: マニュアルでは、運転者が備えていない場合、強い突風によってオートバイが車線全体を横切るほど流される可能性があると警告しています。
- id: 10
  category: safe_driving_rules
  question: ペンシルベニア州法によると、道路交通法（rules of the road）が適用される3つの車両タイプは何ですか？
  choices:
    A: 自動車、ボート、飛行機。
    B: 自転車、馬車、自動車。
    C: 自動車、ATV（全地形対応車）、スノーモービル。
    D: 乗用車、商用トラック、オートバイのみ。
  answer: B
  explanation: マニュアルには、道路交通法はペンシルベニア州法で認められている3種類の車両（自転車、馬車、自動車）に適用されると記載されています。
- id: 11
  category: safe_driving_rules
  question: ペンシルベニア州では、自転車に対して交通信号はどのように適用されますか？
  choices:
    A: 自転車利用者は、赤信号を一時停止標識として扱ってもよい。
    B: 自転車利用者は、赤信号での停止を免除されている。
    C: 自転車利用者は、自動車運転者と同様に、赤信号で停止することが義務付けられている。
    D: 自転車利用者は、すべての交差点で自転車を降りて歩かなければならない。
  answer: C
  explanation: マニュアルには「例えば、すべての自転車利用者は、自動車運転者と同様に、赤信号で停止することが義務付けられています」と明記されています。
- id: 12
  category: driver_responsibility
  question: ペンシルベニア州での運転に関する次の記述のうち、正しいものはどれですか？
  choices:
    A: 運転はすべての市民にとっての憲法上の権利である。
    B: 運転は特権（privilege）であり、権利（right）ではない。
    C: 運転は18歳以上の者にのみ与えられる権利である。
    D: 運転は取り消すことのできない権利である。
  answer: B
  explanation: マニュアルの冒頭には「運転は特権であり、権利ではありません」とはっきりと記されています。
- id: 13
  category: license_system
  question: 18歳未満の場合、知識試験（Knowledge Test）を受ける前にどの追加書類を完成させる必要がありますか？
  choices:
    A: 商業運転免許申請書
    B: 車両登録用紙
    C: 親または保護者の同意書 (DL-180TD)
    D: 臓器提供者指定用紙
  answer: C
  explanation: マニュアルには、18歳未満の場合、親または保護者が「親または保護者の同意書 (DL-180TD)」を記入しなければならないと記載されています。
- id: 14
  category: alcohol_drugs_health
  question: マニュアルによると、アルコールと運転に関する非常に重要な責任は何ですか？
  choices:
    A: 短距離を運転する場合に限り、飲酒してもよい。
    B: 飲酒と運転を絶対に混ぜてはならない（飲酒運転をしない）。
    C: 速度制限を守っていれば、飲酒して運転してもよい。
    D: 免許を持っている同乗者がいれば、飲酒して運転してもよい。
  answer: B
  explanation: マニュアルでは「非常に重要な責任の一つは、飲酒と運転を絶対に混ぜないことです」と強調されています。
- id: 15
  category: sharing_the_road
  question: 接近してくるモーターサイクルの速度や距離を判断するのが難しいのはなぜですか？
  choices:
    A: モーターサイクルは通常、制限速度を大幅に超えて走行するため。
    B: モーターサイクルは他の車両よりも輪郭（プロファイル）がはるかに小さいため。
    C: モーターサイクルにはヘッドライトがないため。
    D: モーターサイクルは路面の色に溶け込んでしまうため。
  answer: B
  explanation: マニュアルでは、モーターサイクルは他の車両よりも輪郭がはるかに小さいため、接近してくるモーターサイクルの速度や距離を判断するのが難しくなる場合があると説明されています。
- id: 16
  category: license_system
  question: ペンシルベニア州で非営利学習許可証（learner's permit）を申請するには、何歳である必要がありますか？
  choices:
    A: 15歳
    B: 15歳半
    C: 16歳
    D: 18歳
  answer: C
  explanation: マニュアルによると、16歳の誕生日より前に許可証を申請することはできません。
- id: 17
  category: license_system
  question: 学習許可証の申請のための健康診断は、医療提供者によっていつから受けることができますか？
  choices:
    A: 16歳の誕生日の3ヶ月前以降
    B: 16歳の誕生日の6ヶ月前以降
    C: 16歳の誕生日の1年前以降
    D: 16歳の誕生日当日以降
  answer: B
  explanation: 健康診断の実施日は、16歳の誕生日の6ヶ月前より前であってはなりません。
- id: 18
  category: driver_testing
  question: 運転免許を取得するために合格しなければならない3つの試験は何ですか？
  choices:
    A: 視力検査、知識試験、路上試験
    B: 聴力検査、知識試験、路上試験
    C: 視力検査、反射神経試験、路上試験
    D: 知識試験、路上試験、高速道路試験
  answer: A
  explanation: 運転免許を取得するには、視力検査（Vision Test）、知識試験（Knowledge Test）、路上試験（Road Test）を受けて合格する必要があります。
- id: 19
  category: license_system
  question: 18歳未満で、親または保護者が運転免許センターに同行できない場合、同意書（DL-180TD）はどうしなければなりませんか？
  choices:
    A: 校長の署名が必要である。
    B: PennDOTに直接郵送しなければならない。
    C: 公証人（notary）の面前で署名しなければならない。
    D: 21歳以上の免許保持者の署名が必要である。
  answer: C
  explanation: 親または保護者が申請者に同行できない場合、DL-180TDは公証人の面前で署名される必要があります。
- id: 20
  category: license_system
  question: 18歳以上で許可証を申請する場合、居住証明書類を何通提示する必要がありますか？
  choices:
    A: 1通
    B: 2通
    C: 3通
    D: 4通
  answer: B
  explanation: 18歳以上の場合は、2通の居住証明書類を提示する必要があります。
- id: 21
  category: license_system
  question: 運転免許センターに生年月日を証明する書類と身分証明書を持参する際、次のうち正しいものはどれですか？
  choices:
    A: 高画質のコピーが望ましい。
    B: スマートフォンのデジタルコピーも認められる。
    C: 書類は原本である必要があり、コピーは認められない。
    D: 学生証は出生証明書の代わりになる。
  answer: C
  explanation: マニュアルには、生年月日を証明する書類および身分証明書は原本でなければならない（コピーは認められない）と記載されています。
- id: 22
  category: license_system
  question: ペンシルベニア州の非商用学習許可証（ラーナーズパーミット）は、発行後どのくらいの期間有効ですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 4年
  answer: B
  explanation: 知識試験（学科試験）に合格すると、試験官から1年間有効な学習許可証が交付されます。
- id: 23
  category: driver_testing
  question: 18歳未満の場合、路上試験を受ける前に何時間の実地運転習熟訓練を完了させる必要がありますか？
  choices:
    A: 40時間
    B: 50時間
    C: 65時間
    D: 100時間
  answer: C
  explanation: 18歳未満の場合、路上試験を受ける前に少なくとも65時間の実地運転習熟訓練を完了させる必要があります。
- id: 24
  category: driver_testing
  question: 18歳未満の運転者の場合、義務付けられている実地運転習熟訓練には特定の条件下での時間が含まれている必要があります。それは何ですか？
  choices:
    A: 夜間運転10時間、悪天候時の運転5時間
    B: 夜間運転5時間、悪天候時の運転10時間
    C: 夜間運転15時間、高速道路での運転5時間
    D: 高速道路での運転10時間、悪天候時の運転10時間
  answer: A
  explanation: 65時間の習熟訓練には、少なくとも10時間の夜間運転と5時間の悪天候時の運転が含まれていなければなりません。
- id: 25
  category: driver_responsibility
  question: 学習許可証（ラーナーズパーミット）を持つ運転者の助手席に同乗することが許可されているのは誰ですか？
  choices:
    A: 18歳以上の免許保有者であれば誰でも。
    B: 21歳以上の免許保有者、または18歳以上で免許を保有している親、保護者、配偶者。
    C: 免許の有無にかかわらず、21歳以上のすべての乗客。
    D: 免許を持つ教習指導員のみ。
  answer: B
  explanation: 21歳以上の免許保有者、または18歳以上で免許を保有している親、保護者、親代わりの人、もしくは配偶者が助手席に同乗しなければなりません。
- id: 26
  category: safe_driving_rules
  question: 18歳未満の運転者の同乗者制限は何ですか？
  choices:
    A: 家族以外の同乗者は1名のみ。
    B: 指導員以外の同乗者は認められない。
    C: 車内のシートベルトの数を超える同乗者を乗せることはできない。
    D: 18歳未満の同乗者は3名まで。
  answer: C
  explanation: 18歳未満の運転者は、車内のシートベルトの数を超える同乗者を乗せることはできません。
- id: 27
  category: driver_testing
  question: 18歳未満の運転者が路上試験を受けることができるようになるまで、許可証の発行日から数えて義務付けられている待機期間はどのくらいですか？
  choices:
    A: 30日
    B: 3ヶ月
    C: 6ヶ月
    D: 1年
  answer: C
  explanation: 路上試験を受けるには、許可証の発行日から義務付けられている6ヶ月間を待つ必要があります。
- id: 28
  category: driver_testing
  question: 路上試験に3回不合格になった場合、どうなりますか？
  choices:
    A: 再試験まで1年間待たなければならない。
    B: 許可証の追加・延長・再発行・変更・訂正のためのDL-31フォームを入手することができる。
    C: 学習許可証が永久に失効する。
    D: 直ちに知識試験を再受験しなければならない。
  answer: B
  explanation: 学習許可証の期限が切れた場合、または路上試験に3回不合格になった場合は、非商用学習許可証の追加・延長・再発行・変更・訂正のための申請書（DL-31）を入手することができます。
- id: 29
  category: driver_testing
  question: 知識試験に不合格になった場合、最短でいつ再受験できますか？
  choices:
    A: 別の場所に行けば、同じ日に2回目を受けることができる。
    B: 少なくとも7日間待たなければならない。
    C: 知識試験は、場所にかかわらず1日に1回しか受けることができない。
    D: 再受験まで30日間待たなければならない。
  answer: C
  explanation: 試験会場にかかわらず、知識試験は1日に1回しか受けることができません。
- id: 30
  category: driver_responsibility
  question: ペンシルベニア州の学習許可証を使用して他州で運転する予定がある場合、どうすべきですか？
  choices:
    A: 全米で有効であると見なしてよい。
    B: 国際運転免許証を申請する。
    C: 自身の保険会社および他州の運輸局（DOT）に確認する。
    D: 他州では日中のみ運転する。
  answer: C
  explanation: ペンシルベニア州外で学習許可証を使用して運転する場合は、その許可証が有効と見なされるかどうか、自身の保険会社および他州の運輸局に確認してください。
- id: 31
  category: driver_testing
  question: 知識テスト（筆記試験）は1日に何回受けることができますか？
  choices:
    A: 合格するまで何度でも
    B: 2回
    C: 1回
    D: 3回
  answer: C
  explanation: マニュアルによると、試験会場に関わらず、知識テストは1日に1回しか受けることができません。
- id: 32
  category: license_system
  question: 18歳未満の場合、運転免許証に「臓器提供者（ORGAN DONOR）」の指定を受けるには何が必要ですか？
  choices:
    A: 健康診断証明書
    B: 親、保護者、親代わりの人、または18歳以上の配偶者からの書面による同意
    C: 臓器提供啓発信託基金への10ドルの義務的な寄付
    D: かかりつけ医による公証済みの供述書
  answer: B
  explanation: 18歳未満の申請者も臓器提供者の指定をリクエストできますが、親、保護者、親代わりの人、または18歳以上の配偶者からの書面による同意が必要です。
- id: 33
  category: license_system
  question: 社会保障番号（Social Security number）は、仮免許証や運転免許証に記載されますか？
  choices:
    A: はい、本人確認のためにすべての許可証と免許証に記載されます。
    B: はい、ただし仮免許証のみに記載されます。
    C: いいえ、仮免許証や運転免許証には記載されません。
    D: はい、特に削除を依頼しない限り記載されます。
  answer: C
  explanation: マニュアルには「社会保障番号は、仮免許証や運転免許証には記載されません」と記されています。
- id: 34
  category: driver_testing
  question: 試験中に視力がペンシルベニア州の視力基準に達しなかった場合、どうなりますか？
  choices:
    A: 運転免許の取得資格を永久に失います。
    B: 眼科医または医師が記入するための視力検査報告書（DL-102）が渡されます。
    C: 直ちに専門的な路上試験を受けなければなりません。
    D: 追加の試験なしに、自動的に日中のみの運転制限が課されます。
  answer: B
  explanation: 視力が基準に達しない場合、試験官から眼科医、検眼医、またはかかりつけ医が記入するための視力検査報告書（DL-102）が渡されます。
- id: 35
  category: license_system
  question: 他州の有効な運転免許証を所持してペンシルベニア州に転入した場合、ペンシルベニア州の運転免許証を取得するまでにどのくらいの期間がありますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 6ヶ月
  answer: B
  explanation: 他州またはカナダの有効な運転免許証を所持してペンシルベニア州に転入した人は、転居後60日以内にペンシルベニア州の運転免許証を取得しなければなりません。
- id: 36
  category: license_system
  question: 有効な外国の運転免許証を所持している人は、ペンシルベニア州でいつまで運転が認められますか？
  choices:
    A: 米国入国日から最大30日間
    B: 米国入国日から最大6ヶ月間
    C: 米国入国日から最大1年間、または外国免許証の有効期限のいずれか早い方まで
    D: 国際運転免許証を携帯している限り、無期限に
  answer: C
  explanation: 有効な外国の運転免許証を所持している人は、米国入国日から最大1年間、または外国免許証の有効期限のいずれか早い方まで、ペンシルベニア州で運転することが認められています。
- id: 37
  category: license_system
  question: ジュニア仮免許（Junior Learner's Permit）を所持する18歳未満の運転者を監督する資格があるのは誰ですか？
  choices:
    A: 18歳以上のすべての免許保持者
    B: 21歳以上の免許保持者、または18歳以上の親、保護者、親代わりの人、もしくは配偶者
    C: 少なくとも1年の運転経験があるすべての免許保持者
    D: 州認定の教習指導員のみ
  answer: B
  explanation: 21歳以上の免許保持者、または18歳以上で免許を所持している親、保護者、親代わりの人、もしくは配偶者の監督下でのみ運転することができます。
- id: 38
  category: safe_driving_rules
  question: ジュニア仮免許またはジュニア運転免許で運転する場合、同乗者の人数に関する規則は何ですか？
  choices:
    A: 監督する運転者以外の同乗者を乗せることはできません。
    B: シートベルトの数に関わらず、5人まで同乗させることができます。
    C: 運転している車両で利用可能なシートベルトの数を超える同乗者を乗せることはできません。
    D: 同居している家族のみを同乗させることができます。
  answer: C
  explanation: ジュニア仮免許とジュニア運転免許の両方について、マニュアルには「運転している車両で利用可能なシートベルトの数を超える同乗者を乗せることはできません」と記されています。
- id: 39
  category: license_system
  question: 18歳以上の親、保護者、または配偶者が同伴しない場合、ジュニア運転免許の運転制限時間はいつですか？
  choices:
    A: 午後9時から午前6時
    B: 午後10時から午前5時
    C: 午後11時から午前5時
    D: 午前0時から午前6時
  answer: C
  explanation: ジュニア運転免許では、親、保護者、親代わりの人、または18歳以上の配偶者が同伴しない限り、午後11時から午前5時の間は運転できません。
- id: 40
  category: license_system
  question: ジュニアドライバーが、親や保護者の同伴なしに午後11時から午前5時の間に合法的に運転できるのは、次のうちどれですか？
  choices:
    A: 学校のスポーツイベントから帰宅する場合
    B: 公共サービスや慈善活動、ボランティア消防隊、または仕事に従事している場合
    C: 勉強会のために友人の家へ運転する場合
    D: 少なくとも3ヶ月間、無事故無違反の記録がある場合
  answer: B
  explanation: 公共サービスや慈善活動に従事している場合、ボランティア消防隊のメンバーである場合、またはその時間帯に雇用されている場合は、公証済みの供述書を携帯していれば、午後11時から午前5時の間に運転することができます。
- id: 41
  category: safe_driving_rules
  question: ジュニア免許（Junior Driver's License）を取得して最初の6か月間、親または保護者が同乗していない場合、18歳未満の同乗者（近親者を除く）を何人まで乗せることができますか？
  choices:
    A: なし
    B: 1人
    C: 2人
    D: 3人
  answer: B
  explanation: 親、保護者、親代わりの人、または18歳以上の配偶者が同乗していない限り、近親者ではない18歳未満の同乗者を1名を超えて乗せることはできません。
- id: 42
  category: penalties_and_points
  question: ジュニアドライバーが掲示された制限速度を時速何マイル（mph）超えて走行し、違反が確定した場合、90日間の義務的な免許停止処分を受けますか？
  choices:
    A: 10 mph以上
    B: 15 mph以上
    C: 20 mph以上
    D: 26 mph以上
  answer: D
  explanation: 累積点数が6点以上に達するか、掲示された制限速度を時速26マイル（mph）以上超えて走行し違反が確定した場合、90日間の義務的な免許停止処分を受けます。
- id: 43
  category: license_system
  question: ジュニア免許（Junior Driver's License）は、何歳になると自動的に通常の運転免許証に切り替わりますか？
  choices:
    A: 17歳
    B: 18歳
    C: 19歳
    D: 21歳
  answer: B
  explanation: マニュアルには「ジュニア免許は、18歳になると自動的に通常の運転免許証に切り替わります」と記載されています。
- id: 44
  category: license_system
  question: ペンシルベニア州の運転免許区分のうち、通常の乗用車、ピックアップトラック、およびバンを対象としているのはどのクラスですか？
  choices:
    A: クラスA
    B: クラスB
    C: クラスC
    D: クラスM
  answer: C
  explanation: このマニュアルは、通常の乗用車、ピックアップトラック、またはバンを対象とする非商用クラスC（Class C）運転免許に関する情報を提供するために作成されています。
- id: 45
  category: license_system
  question: ペンシルベニア州でクラスA（Class A）の運転免許を取得するために必要な最低年齢は何歳ですか？
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: 「運転免許のクラス」の項目において、マニュアルには「クラスA（最低年齢18歳）」と記載されています。
- id: 46
  category: license_system
  question: クラスC免許の保持者が、消防車や緊急車両を運転できるのはどのような条件の場合ですか？
  choices:
    A: クラスMの裏書き（エンドースメント）がある場合
    B: 車両重量が26,000ポンド未満の場合
    C: 消防署長または救助隊の責任者からの許可証（certificate of authorization）を所持している場合
    D: 21歳以上である場合
  answer: C
  explanation: クラスC免許を持つ消防士または救助隊員は、消防署長または救助・緊急隊の責任者からの許可証を所持している場合に限り、緊急車両を運転することができます。
- id: 47
  category: license_system
  question: クラスM運転免許証に記載される「8」の制限事項は何を意味しますか？
  choices:
    A: 運転時に矯正レンズを着用しなければならない
    B: 二輪のオートバイの運転が禁止されている
    C: オートバイの運転が禁止されており、原動機付自転車（motor-driven cycle）のみ運転できる
    D: 日中のみオートバイを運転できる
  answer: C
  explanation: 原動機付自転車（motor-driven cycle）で試験を受けた場合、免許証に「8」の制限事項が記載され、オートバイ（motorcycle）の運転が禁止されます。
- id: 48
  category: driver_testing
  question: 知識試験（Knowledge Test）に合格するには、何問正解する必要がありますか？
  choices:
    A: 12問中12問
    B: 18問中15問
    C: 20問中16問
    D: 18問中18問
  answer: B
  explanation: 知識試験は18問の多肢選択式問題で構成されており、合格するには15問に正解する必要があります。
- id: 49
  category: driver_testing
  question: 知識試験（Knowledge Test）に不合格となった場合、いつから再受験が可能ですか？
  choices:
    A: 7日後
    B: 翌営業日
    C: 30日後
    D: 当日すぐ
  answer: B
  explanation: 知識試験に不合格となった場合、翌営業日から再受験が許可されます。
- id: 50
  category: driver_testing
  question: 路上試験（Road Test）のために運転免許センターへ同行できる、18歳以上の人は誰ですか？
  choices:
    A: 免許を所持しているすべての人
    B: 免許取得から1年が経過している友人
    C: 有効な運転免許証を所持している親、保護者、親代わりの人、または配偶者
    D: 仮免許（learner's permit）を所持している兄弟姉妹
  answer: C
  explanation: 21歳以上の人、または有効な運転免許証を所持している18歳以上の親、保護者、親代わりの人、もしくは配偶者が同伴しなければなりません。
- id: 51
  category: vehicle_information
  question: 路上試験（Road Test）を受けられなくなる原因は、次のうちどれですか？
  choices:
    A: マニュアル車（manual transmission）を持ち込むこと
    B: 書類の原本ではなく、コピーを持参すること
    C: 車両の一部が安全でない、または州の検査基準を満たしていないと判断されること
    D: 車両に自動駐車機能が搭載されていること
  answer: C
  explanation: 車両のいずれかの部品が安全でない、または州の検査基準を満たしていないと判断された場合、路上試験を受けることはできません。
- id: 52
  category: driver_testing
  question: 路上試験で縦列駐車を行うスペースの寸法はどれくらいですか？
  choices:
    A: 長さ20フィート、幅6フィート
    B: 長さ24フィート、幅8フィート
    C: 長さ25フィート、幅10フィート
    D: 長さ30フィート、幅8フィート
  answer: B
  explanation: 長さ24フィート、幅8フィートのスペースにある2本のポールの間に、車両を駐車させる必要があります。
- id: 53
  category: driver_testing
  question: 路上試験の縦列駐車において、何回の試行と切り返しが認められていますか？
  choices:
    A: 2回の試行、5回以内の切り返し
    B: 1回の試行、3回以内の切り返し
    C: 3回の試行、3回以内の切り返し
    D: 1回の試行、5回以内の切り返し
  answer: B
  explanation: 1回の試行で、3回以内の切り返し（調整）を行って駐車を完了させる必要があります。
- id: 54
  category: driver_testing
  question: 路上試験における高度駐車支援システム（自動駐車機能）搭載車両に関する規則は何ですか？
  choices:
    A: いかなる状況においても路上試験に使用することはできない
    B: 自動駐車機能は縦列駐車のセクションでのみ使用できる
    C: 使用可能だが、自動駐車機能はオフにし、作動させてはならない
    D: 試験官が機能をテストするために作動させる
  answer: C
  explanation: 高度駐車支援システムを搭載した車両を試験に使用することは可能ですが、自動駐車機能はオフにする必要があり、路上試験中に作動させることは許可されていません。
- id: 55
  category: driver_testing
  question: 18歳未満で路上試験に不合格となった場合、再受験までどのくらい待つ必要がありますか？
  choices:
    A: 24時間
    B: 3日間
    C: 7日間
    D: 14日間
  answer: C
  explanation: 18歳未満で路上試験に不合格となった場合、ペンシルベニア州の法律により、再受験まで7日間待機することが義務付けられています。
- id: 56
  category: driver_testing
  question: 1枚の仮免許（learner's permit）で、路上試験に合格するチャンスは何回ありますか？
  choices:
    A: 1回
    B: 2回
    C: 3回
    D: 有効期限内であれば無制限
  answer: C
  explanation: 仮免許の有効期限が切れるまでに、1枚の仮免許につき3回まで路上試験を受けることができます。
- id: 57
  category: license_system
  question: 健康診断の日から3年以内に路上試験に合格しなかった場合、どうしなければなりませんか？
  choices:
    A: 遅延手数料を支払って仮免許を延長する
    B: 新たに非商用仮免許申請書（DL-180）を提出し、知識試験を再受験する
    C: 認定された運転教育コースを受講する
    D: 再申請まで6か月間待つ
  answer: B
  explanation: 健康診断の日から3年以内に路上試験を受験または合格しなかった場合は、新たに非商用仮免許申請書（DL-180）を提出して最初から手続きをやり直し、知識試験（Knowledge
    Test）を再受験する必要があります。
- id: 58
  category: license_system
  question: クラスB運転免許証は、以下のどれを運転するために必要ですか？
  choices:
    A: 車両総重量定格が26,000ポンドを超える単一車両
    B: 総重量定格が26,001ポンド以上の連結車両
    C: 3輪以上のモーターサイクル
    D: オートマチックトランスミッションの原動機付自転車
  answer: A
  explanation: クラスB免許は、26,001ポンド以上のモーターホームなど、車両総重量定格が26,000ポンドを超える単一車両を運転するために必要です。
- id: 59
  category: driver_testing
  question: 路上試験の前に、車両の操作装置（ワイパー、駐車ブレーキ、ハザードランプなど）を正しく操作できなかった場合はどうなりますか？
  choices:
    A: 減点されるが、試験を続けることはできる
    B: 試験官が使い方を教えた上で試験を継続する
    C: 路上試験は不合格となる
    D: 日中の運転のみに制限される
  answer: C
  explanation: 車両の操作装置のいずれかを正しく操作できない場合は、路上試験不合格となります。
- id: 60
  category: signs_and_signals
  question: 信号機が横一列に並んでいる場合、どのように配置されていますか？
  choices:
    A: 赤が常に左、緑が右
    B: 緑が常に左、赤が右
    C: 黄が常に左、赤が右
    D: 赤が常に上、緑が下
  answer: A
  explanation: マニュアルには、「横に並んでいる場合、赤は常に左、緑は常に右にある」と記載されています。
- id: 61
  category: safe_driving_rules
  question: 赤信号で左折が許可されるのはどのような条件の時ですか？
  choices:
    A: 2車線道路から一方通行路へ曲がる時
    B: どの道路にも対向車がいない時
    C: 一方通行路から別の一方通行路へ曲がる時
    D: 赤信号での左折は決して許可されない
  answer: C
  explanation: マニュアルによると、左車線にいて一方通行路から別の一方通行路へ左折する場合、標識で禁止されていない限り、赤信号で停止した後に左折することができます。
- id: 62
  category: signs_and_signals
  question: 赤色の点滅信号は何を意味しますか？
  choices:
    A: 徐行して注意深く進む
    B: 一時停止（STOP）標識と同じ意味
    C: 信号機が故障しており、自分に優先権がある
    D: 交差する車両が近づいている場合のみ停止する
  answer: B
  explanation: マニュアルによると、「赤色の点滅信号は一時停止（STOP）標識と同じ意味です。完全に停止しなければなりません。その後、両方向を確認し、交差点が安全になってから進んでください。」
- id: 63
  category: signs_and_signals
  question: 信号機が作動していない交差点ではどのように対処すべきですか？
  choices:
    A: 右側の車両に道を譲り、停止せずに進む
    B: 警察官が交通整理を行うのを待つ
    C: 通常の速度で交差点を通過する
    D: 全方向一時停止（4-way STOP）標識があるものとして扱う
  answer: D
  explanation: マニュアルには、「作動していない信号機は、全方向一時停止（4-way STOP）標識があるものとして扱う必要があります」と明記されています。
- id: 64
  category: signs_and_signals
  question: 車線上の黄色い「X」の点灯は何を示していますか？
  choices:
    A: その車線の使用は一切禁止されている
    B: その車線の進行方向が逆転しようとしているため、車線変更をしなければならない
    C: 車線を使用できるが、料金所のために減速しなければならない
    D: その特定の車線からは左折のみが可能である
  answer: B
  explanation: マニュアルでは、車線上の黄色い「X」の点灯は「その車線の進行方向が逆転しようとしているため、車線変更をしなければならないことを意味します。安全に車線を離れる準備をしてください」と説明されています。
- id: 65
  category: sharing_the_road
  question: すでに路上にいる時に「歩行禁止（DON'T WALK）」や「挙手」の合図が点滅し始めた場合、歩行者はどうすべきですか？
  choices:
    A: 直ちに停止し、道路の真ん中で待つ
    B: 引き返して、出発した歩道に戻る
    C: 横断を完了させる
    D: 最寄りの歩道までできるだけ速く走る
  answer: C
  explanation: マニュアルは歩行者に対し、「歩行禁止（DON'T WALK）」や「挙手」の合図が点滅し始めた時にすでに路上にいる場合は、「横断を完了させる」よう指示しています。
- id: 66
  category: sharing_the_road
  question: 白い杖を持っている、または盲導犬を連れている視覚障害のある歩行者の近くを運転する際、何をしなければなりませんか？
  choices:
    A: クラクションを鳴らして、接近を知らせる
    B: 速度を維持しつつ、注意深く避けて通る
    C: 停止して、横断しても安全であることを口頭で伝える
    D: 減速し、常に歩行者に優先権を譲り、注意して進む
  answer: D
  explanation: マニュアルには次のように記載されています。「白い杖を持っている、または盲導犬を連れている視覚障害のある歩行者の近くを運転する際は、減速し、常に優先権を譲り、注意して進まなければなりません。」
- id: 67
  category: safe_driving_rules
  question: 黄色の信号が点滅している時のスクールゾーン内での最高速度制限は何マイルですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: A
  explanation: マニュアルには、「黄色の信号が点滅している間、または標識に示された時間帯は、15 mph（時速15マイル）を超えて走行してはなりません」と記載されています。
- id: 68
  category: penalties_and_points
  question: スクールゾーンで速度制限を超過した場合の罰則は何ですか？
  choices:
    A: 初回違反は警告のみ
    B: 運転記録に1ポイントの加点と罰金
    C: 運転記録に3ポイントの加点と罰金
    D: 30日間の即時免許停止
  answer: C
  explanation: マニュアルによると、「スクールゾーンでの速度制限超過は、運転記録に3ポイントが加算され、罰金も科せられます。」
- id: 69
  category: safe_driving_rules
  question: 踏切に近づいた際、遮断機が下りていた場合、どうすべきですか？
  choices:
    A: 減速し、列車が見えなければ遮断機を避けて進む
    B: 停止し、遮断機が上がり、すべての信号が終了するまで待つ
    C: 停止し、両方向を確認してから、注意深く遮断機を避けて進む
    D: クラクションを鳴らし、停止せずに進む
  answer: B
  explanation: マニュアルには、下りている遮断機で停止することが義務付けられており、「前進したり、遮断機を避けようとしたり、接近する列車の信号を無視したりしてはいけません。すべての信号が終了した後にのみ、注意して進んでください...」と警告されています。
- id: 70
  category: signs_and_signals
  question: 緑色の矢印信号の点灯は何を意味しますか？
  choices:
    A: 曲がることはできるが、対向車に道を譲らなければならない
    B: 矢印の方向に曲がる前に停止しなければならない
    C: 走行中の車線が間もなく閉鎖される
    D: 矢印が指す方向に曲がることができ、その右左折は保護されている
  answer: D
  explanation: マニュアルには、「緑色の矢印信号の点灯は、矢印が指す方向に曲がることができることを意味します。緑色の矢印が出ている間に曲がる場合、対向車は赤信号で停止しているため、その右左折は『保護（優先）』されています」と記載されています。
- id: 71
  category: signs_and_signals
  question: 黄色の矢印の点滅は何を示していますか？
  choices:
    A: 矢印の方向に保護された右左折（優先的な通行）ができる
    B: 曲がる前に完全に停止しなければならない
    C: 注意して曲がることができるが、対向車や歩行者に道を譲らなければならない
    D: 信号機が故障しているため、一時停止標識として扱う必要がある
  answer: C
  explanation: マニュアルには、「黄色の矢印の点滅は、注意して矢印の方向に曲がることができることを意味しますが、まず対向車や歩行者に道を譲らなければなりません。黄色の矢印の点滅中に曲がる場合、その右左折は保護されていません（優先ではありません）」と記載されています。
- id: 72
  category: safe_driving_rules
  question: 単車線のランプ（進入路）で、ランプメーター（合流制御信号）が青になるごとに、何台の車が高速道路に進入できますか？
  choices:
    A: 1台
    B: 2台
    C: 3台
    D: 赤信号になる前に安全に通過できるだけの台数
  answer: A
  explanation: マニュアルのランプメーター信号に関する規定では、「単車線のランプでは、信号が青になるごとに1台の車のみが高速道路に進入できます」と明記されています。
- id: 73
  category: safe_driving_rules
  question: 交通が渋滞しており、踏切を渡る必要がある場合はどうすべきですか？
  choices:
    A: 線路の上で停止し、交通が動き出すのを待つ
    B: 線路から完全に離れた場所で車両を停止させる
    C: 前の車との距離をできるだけ詰めながら、線路の上をゆっくり進む
    D: 前の車を早く動かすためにクラクションを鳴らす
  answer: B
  explanation: マニュアルには、「信号機や一時停止標識、あるいはその他の理由で交通が渋滞している場合は、車両が線路から完全に離れた場所に停止するようにしてください」と記載されています。
- id: 74
  category: signs_and_signals
  question: 交通標識の3つの基本的なカテゴリーは何ですか？
  choices:
    A: 規制標識、警戒標識、案内標識
    B: 情報標識、方向標識、警戒標識
    C: 速度標識、一時停止標識、譲れ標識
    D: 義務標識、勧告標識、工事標識
  answer: A
  explanation: マニュアルでは、標識は「規制標識（Regulatory）」、「警戒標識（Warning）」、「案内標識（Guide）」の3つの基本的なカテゴリーに分けられると述べられています。
- id: 75
  category: penalties_and_points
  question: 規制標識の指示に従わなかった場合に考えられる結果は何ですか？
  choices:
    A: 運転免許試験の再受験を求められる
    B: 罰金を科され、運転記録に違反点数が加算される可能性がある
    C: 車両が直ちに押収される
    D: 最初の3回の違反までは警告を受ける
  answer: B
  explanation: 規制標識の指示に従わないことは法律違反となるため、罰金を科されたり、運転記録に違反点数が加算されたりする可能性があります。
- id: 76
  category: safe_driving_rules
  question: 横断歩道や停止線が描かれている一時停止（STOP）標識に近づく際、車両のどこで停止しなければなりませんか？
  choices:
    A: 最初の描かれた線を少し越えたところ
    B: 車両の先端が最初の描かれた線に到達する前
    C: 視界を良くするために横断歩道の真ん中
    D: 一時停止標識の真横
  answer: B
  explanation: 横断歩道や停止線（白い停止線）がある場合は、車両の先端が最初の描かれた線に到達する前に停止しなければなりません。
- id: 77
  category: safe_driving_rules
  question: 2台の車両が同時に4方向一時停止（FOUR-WAY STOP）の交差点に到着した場合、どちらが優先権を譲らなければなりませんか？
  choices:
    A: 左側の運転者が右側の運転者に譲る
    B: 右側の運転者が左側の運転者に譲る
    C: より速い速度で走行している車両が譲る
    D: 最初にヘッドライトを点滅させた車両に優先権がある
  answer: A
  explanation: 4方向一時停止の交差点で2台の車両が同時に到着した場合、左側の運転者が右側の運転者に優先権を譲ります。
- id: 78
  category: signs_and_signals
  question: 「譲れ（YIELD）」標識の形は何ですか？
  choices:
    A: 八角形
    B: ペナント型（三角旗型）
    C: 三角形（逆三角形）
    D: 縦長の長方形
  answer: C
  explanation: マニュアルには、「譲れ（YIELD）」標識は三角形（3辺）であると明記されています。
- id: 79
  category: safe_driving_rules
  question: 運転者は踏切標識（クロスカット標識）をどのように扱うべきですか？
  choices:
    A: 義務的な一時停止（STOP）標識として扱う
    B: 「譲れ（YIELD）」標識として扱う
    C: 「進入禁止（DO NOT ENTER）」標識として扱う
    D: 「制限速度（SPEED LIMIT）」標識として扱う
  answer: B
  explanation: 踏切標識（クロスカット標識）は「譲れ（YIELD）」標識として扱う必要があります。速度を落とし、列車の接近が見えたり聞こえたりした場合は停止する準備をしてください。
- id: 80
  category: safe_driving_rules
  question: 交差点で中央分離帯のある幹線道路（divided highway）に曲がる際、1番目と2番目の車道ではどのような右左折が許可されていますか？
  choices:
    A: 1番目の車道では左折のみ、2番目の車道では右折のみ
    B: 1番目の車道では右折のみ、2番目の車道では左折のみ
    C: 両方の車道で右折が許可されている
    D: 両方の車道で左折が許可されている
  answer: B
  explanation: 中央分離帯のある道路では、マニュアルに「1番目の車道では右折のみが可能で、2番目の車道では左折のみが可能です」と記載されています（※右側通行のルールに基づく）。
- id: 81
  category: signs_and_signals
  question: 「CENTER LANE LEFT TURN ONLY（中央車線左折専用）」標識の目的は何ですか？
  choices:
    A: 低速車両を追い越すための車線を提供するため。
    B: いずれの方向からの左折車両に対しても、専用の車線を確保するため。
    C: 直進車が優先権を持つ車線であることを示すため。
    D: 緊急車両専用の車線を指定するため。
  answer: B
  explanation: この標識は、いずれの方向からの左折車両に対しても専用の車線が確保されていることを示し、直進や追い越しには使用してはならないことを意味します。
- id: 82
  category: safe_driving_rules
  question: 「SPEED LIMIT（制限速度）」標識は何を示していますか？
  choices:
    A: あらゆる条件下で走行しなければならない最低速度。
    B: 悪天候時に推奨される速度。
    C: 理想的な条件下における法定最高速度。
    D: 渋滞時に走行すべき速度。
  answer: C
  explanation: 「SPEED LIMIT」標識は、その標識が掲示されている道路区間において、理想的な条件下での法定最高速度を示しています。
- id: 83
  category: defensive_driving
  question: マニュアルによると、16歳と17歳のドライバーが衝突事故に巻き込まれる最大の理由は何ですか？
  choices:
    A: アルコールの影響下での運転（飲酒運転）。
    B: 運転中のテキストメッセージ送信（ながら運転）。
    C: 優先権の譲渡違反。
    D: 道路状況に対して速度を出しすぎたこと。
  answer: D
  explanation: 「10代の衝突事故に関する事実」のセクションには、「道路状況に対して速度を出しすぎたこと」が、16歳と17歳のドライバーが衝突事故に巻き込まれる最大の理由であると記載されています。
- id: 84
  category: safe_driving_rules
  question: 右左折の矢印と「ONLY（専用）」という言葉が書かれた標識によって規制されている車線に誤って入ってしまった場合、どうしなければなりませんか？
  choices:
    A: 停車し、交通が途切れるのを待ってから車線を変更する。
    B: 矢印で示された方向に曲がる。
    C: 交差点を慎重に直進する。
    D: 車をバックさせて車線から出る。
  answer: B
  explanation: 右左折の矢印と「ONLY」という言葉が書かれた標識で規制されている車線にいる場合、たとえ誤ってその車線に入ったとしても、交差点に到達した際にはその指示通りに曲がらなければなりません。
- id: 85
  category: signs_and_signals
  question: 「LEFT TURN YIELD ON GREEN（青信号での左折は譲れ）」という標識はどういう意味ですか？
  choices:
    A: 左折は保護されており、対向車は停止しなければならない。
    B: 信号が青のとき、左折は禁止されている。
    C: 左折は許可されているが、対向車に道を譲らなければならない。
    D: 左折するには青の矢印信号を待たなければならない。
  answer: C
  explanation: 「LEFT TURN YIELD ON GREEN」の標識は、左折は許可されているが、対向車に道を譲らなければならないことを示しています。
- id: 86
  category: penalties_and_points
  question: 障害者または重度障害を持つ退役軍人のために予約されたスペースに、許可のない車両が駐車した場合の罰則は何ですか？
  choices:
    A: フロントガラスに警告ステッカーが貼られる。
    B: 罰金およびレッカー移動の費用。
    C: 直ちに運転免許が停止される。
    D: 運転記録に点数が加算される。
  answer: B
  explanation: これらの予約スペースに駐車した許可のない車両は、罰金およびレッカー移動費用の対象となります。
- id: 87
  category: signs_and_signals
  question: 「OPPOSING TRAFFIC HAS EXTENDED GREEN（対向車線の青信号延長中）」という標識は何を示していますか？
  choices:
    A: あなたに左折の優先権がある。
    B: 対向車があなたに道を譲らなければならない。
    C: 自分の側の信号が赤になった後も、対向車は走行を続ける可能性がある。
    D: 信号機が故障しているため、4方向一時停止として扱うべきである。
  answer: C
  explanation: この標識は、自分の側の信号が赤になった後も、対向車が走行を続ける可能性がある場所に設置されています。
- id: 88
  category: signs_and_signals
  question: 警告標識の中で、唯一ペナント型（三角旗型）をしているのはどれですか？
  choices:
    A: 前方に一時停止標識あり (Stop Sign Ahead)
    B: 譲れ (Yield)
    C: 追い越し禁止区間 (No Passing Zone)
    D: 狭い橋 (Narrow Bridge)
  answer: C
  explanation: マニュアルには、「No Passing Zone（追い越し禁止区間）」の標識が唯一のペナント型の警告標識であり、道路の左側にドライバーに向けて設置されると記載されています。
- id: 89
  category: signs_and_signals
  question: 「Left Turn Yield on Flashing Yellow Arrow（黄色の矢印点滅時は左折譲れ）」という標識は何を示していますか？
  choices:
    A: 左折は保護されており、対向車は停止しなければならない。
    B: 左折は許可されているが、対向車に道を譲らなければならない。
    C: この交差点では左折は厳禁である。
    D: 右折する前に完全に停止しなければならない。
  answer: B
  explanation: この標識は、黄色の矢印が点滅しているときに左折が許可されていることを示しますが、その左折は保護されていないため、対向車に道を譲らなければなりません。
- id: 90
  category: signs_and_signals
  question: 「Winding Road（曲がりくねった道）」の標識は、この先の道路にいくつのカーブが連続していることを示していますか？
  choices:
    A: ちょうど2つのカーブ
    B: 3つ以上のカーブ
    C: 急カーブの後に直線
    D: 4つ以上の急カーブ
  answer: B
  explanation: 「Winding Road（一連のカーブ）」の標識は、この先の道路に3つ以上のカーブが連続していることを示しています。
- id: 91
  category: sharing_the_road
  question: 道路に進入するドライバーにとって、「付加車線あり（Added Lane）」の標識は何を意味しますか？
  choices:
    A: 進入する車両は新しく設けられた車線を通るため、合流の必要はありません。
    B: 進入する車両は、すでに本線を走行している車両に道を譲らなければなりません。
    C: この先の車線がなくなるため、左側に合流しなければなりません。
    D: 車両が退出しており、あなたの進路を横切っています。
  answer: A
  explanation: 「付加車線あり」の標識は、進入する車両のために新しい車線が道路に追加されているため、合流（マージ）の必要がないことを意味します。
- id: 92
  category: signs_and_signals
  question: 「二方向大矢印（Two Direction Large Arrow）」の標識は、通常どこに設置されますか？
  choices:
    A: 中央分離帯のある道路の始まり
    B: 狭い橋や地下道の直前
    C: T字路の突き当たり（向かい側）
    D: 追い越し禁止区間の左側
  answer: C
  explanation: 「二方向大矢印」の標識は、T字路の突き当たりに設置され、左折または右折しかできないことを示します。
- id: 93
  category: safe_driving_rules
  question: 「濡れている時スリップ注意（Slippery When Wet）」の標識がある場所を雨天時に走行する場合、どうすべきですか？
  choices:
    A: 滑りやすいエリアを通過するために素早く加速する。
    B: 曲がる前に急ブレーキをかける。
    C: 速度を落とし、車間距離を長く取る。
    D: 通常の速度を維持するが、中央の車線を走行する。
  answer: C
  explanation: 雨天時には、速度を落とし、車間距離を十分に取る必要があります。急加速や急ブレーキは避けてください。
- id: 94
  category: defensive_driving
  question: 車両が道路から外れ、片方の車輪が低い路肩や柔らかい路肩に落ちてしまった場合、やってはいけないことは何ですか？
  choices:
    A: アクセルペダルから足を離す。
    B: 急ブレーキを踏んだり、道路に戻ろうとして急ハンドルを切ったりする。
    C: ハンドルをしっかりと握り続ける。
    D: 道路に戻ろうとする前に、徐々に減速する。
  answer: B
  explanation: マニュアルでは、片輪が低い路肩や柔らかい路肩に落ちた場合、急ブレーキをかけたり、無理に道路に戻ろうとして急ハンドルを切ったりしないよう警告しています。これを行うと、車両のコントロールを失いやすくなります。
- id: 95
  category: vehicle_information
  question: 急な坂道や下り坂に差し掛かる際、どのような行動をとる準備をしておくべきですか？
  choices:
    A: 勢いをつけるために、より高いギアにシフトアップする。
    B: 速度を制御し、ブレーキの摩耗を防ぐために、低いギアにシフトダウンする。
    C: 坂を下りきるまでずっとブレーキを踏み続ける。
    D: 燃料を節約するために、ギアをニュートラルに入れる。
  answer: B
  explanation: 「坂道/下り坂」の標識がある場合は、速度を落とし、速度制御とブレーキの保護のために低いギアにシフトダウンする準備をしてください。
- id: 96
  category: signs_and_signals
  question: 「この先自転車横断あり（Bicycle Crossing Ahead）」の標識の背景色には、どのような色が使われますか？
  choices:
    A: 白または銀色
    B: 赤またはオレンジ色
    C: 黄色または蛍光黄緑色
    D: 緑または青色
  answer: C
  explanation: マニュアルによると、「この先自転車横断あり」の標識は、黄色の背景または蛍光黄緑色の背景のいずれかを使用します。
- id: 97
  category: signs_and_signals
  question: 「連続カーブ（Set of Curves）」の標識と「左右急カーブ（Right and Left Sharp Turns）」の標識で、ドライバーに求められる対応の違いは何ですか？
  choices:
    A: 連続カーブは3つ以上のカーブがあるが、急カーブは2つだけである。
    B: 連続カーブでは停止が必要だが、急カーブでは道を譲るだけでよい。
    C: 急カーブでは大幅な減速が必要だが、連続カーブでは減速して走行の準備をすることが求められる。
    D: 違いはなく、これらは同じ意味で使われる。
  answer: C
  explanation: 「連続カーブ」では、減速して走行の準備をする必要があります。「左右急カーブ」では、道路が急角度で曲がっているため、「大幅に減速」して走行の準備をする必要があります。
- id: 98
  category: safe_driving_rules
  question: 「中央分離帯終了（Divided Highway Ends）」の標識を見たとき、どうすべきですか？
  choices:
    A: センターラインの右側を走行し、対向車に注意する。
    B: 一方通行の1車線に合流する準備をする。
    C: 中央分離帯の左側を走行し続ける。
    D: 高速道路の交通に安全に合流するために加速する。
  answer: A
  explanation: 「中央分離帯終了」の標識は、この先が対面通行の道路になることを意味します。センターラインの右側（日本とは逆の右側通行の場合）を維持し、対向車に注意しなければなりません。
- id: 99
  category: safe_driving_rules
  question: 「一方向大矢印（One Direction Large Arrow）」の標識に近づく際、どのように対応すべきですか？
  choices:
    A: 速度を維持し、左車線にとどまる。
    B: 交差点で右左折する時と同じくらいまで速度を落とす。
    C: 進む前に完全に停止する。
    D: 急な角度を安全に曲がるために加速する。
  answer: B
  explanation: 「一方向大矢印」は、道路が急な角度で方向を変えていることを示します。交差点で曲がる時と同じくらいまで速度を落とすべきです。
- id: 100
  category: signs_and_signals
  question: 「織り込み区間（Weave Area）」の警戒標識は何を示していますか？
  choices:
    A: 路面が平らではなく、ポットホールを避けるために蛇行運転が必要であること。
    B: 一部の車両が退出してあなたの進路を横切るため、別の道路と合流すること。
    C: この先の車線が終了するため、隣の車線に割り込まなければならないこと。
    D: この先、自転車や歩行者が頻繁に道路を横断すること。
  answer: B
  explanation: 「織り込み区間（ウィーブエリア）」の標識は、一部の車両が退出して進路を横切る一方で、別の道路からの車両が合流してくる区間であることを警告するために使用されます。
- id: 101
  category: defensive_driving
  question: 「カーブに差し掛かる道路（Road Entering Curve）」の標識がある交差点に、特に注意して近づかなければならないのはなぜですか？
  choices:
    A: 側道が本線よりも優先権を持っているため。
    B: 側道から進入する車両は、新しく増設された車線に合流しなければならないため。
    C: 本線に進入しようとしているドライバーが、カーブの先から近づいてくるあなたを確認できない可能性があるため。
    D: そのカーブは、時速15マイル（15 mph）以上で走行する車両にとっては急すぎるため。
  answer: C
  explanation: マニュアルには、本線に入ろうとしているドライバーがカーブの先から近づいてくるあなたに気づかず、目の前に飛び出してくる可能性があるため、特に注意して近づくようにと記載されています。
- id: 102
  category: signs_and_signals
  question: 道路で使用される標識の中で、唯一の五角形の標識は次のうちどれですか？
  choices:
    A: 一時停止（Stop）の標識
    B: 踏切（Railroad crossing）の標識
    C: 学校区域（School zone）の標識
    D: 追い越し禁止区間（No passing zone）の標識
  answer: C
  explanation: マニュアルには、学校の標識が道路で使用される唯一の五角形の標識であり、学校区域に近づいていることを示すと記載されています。
- id: 103
  category: safe_driving_rules
  question: 掲示された工事区間（ワークゾーン）を走行する際、いつヘッドライトを点灯させる必要がありますか？
  choices:
    A: 夜間のみ
    B: 作業員が実際に現場にいる時のみ
    C: 時間帯に関わらず常に
    D: 雨や霧が出ている時のみ
  answer: C
  explanation: マニュアルによると、工事区間を走行する際は時間帯に関わらずヘッドライトを点灯させなければならず、これはすべての掲示された工事区間において法律で義務付けられています。
- id: 104
  category: penalties_and_points
  question: 工事区間（ワークゾーン）で交通違反により停車させられた際、車両のヘッドライトが点灯していなかった場合の追加の罰金はいくらですか？
  choices:
    A: $15
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: 工事区間で交通違反により警察に停車させられた際、車両のヘッドライトが点灯していなかった場合、25ドルの追加罰金が科せられます。
- id: 105
  category: signs_and_signals
  question: 工事区間（ワークゾーン）の標識には通常何色が使われますか？
  choices:
    A: 黄色地に黒の文字
    B: オレンジ色地に黒の文字
    C: 緑地に白の文字
    D: 赤地に白の文字
  answer: B
  explanation: 工事区間の標識は、通常、警戒標識のようにひし形をしていますが、黄色地に黒の文字ではなく、オレンジ色地に黒の文字が使われています。
- id: 106
  category: sharing_the_road
  question: 道路の道幅が狭くなっている場所（ピンチポイント）に設置された「自転車と自動車の道路共有（Bicycle/Motor Vehicle Share
    the Road）」の標識は何を示していますか？
  choices:
    A: この区間の道路では自転車の通行は禁止されている。
    B: 路肩がないか車線が狭いため、運転者は自転車のために十分なスペースを確保しなければならない。
    C: 自転車は常に自動車に道を譲らなければならない。
    D: この先に、指定された独立した自転車専用レーンがある。
  answer: B
  explanation: この標識は、道路の道幅が狭くなっている場所（路肩がない、車線が狭いなど）で使用され、自動車の運転者に対し、自転車が道路を共有できるよう十分なスペースを確保するよう警告するものです。
- id: 107
  category: signs_and_signals
  question: 道路に隣接する障害物を示すマーカーに近づく際、下向きに斜めの縞模様は何を示していますか？
  choices:
    A: 最寄りの高速道路出口の方向。
    B: 危険を避けるために進むべき方向。
    C: 完全停止しなければならないこと。
    D: この先の道路が冠水のため閉鎖されていること。
  answer: B
  explanation: 路側の障害物や状況はマーカーによって示され、縞模様が下向きに傾いている方向が、危険を避けるために進むべき方向を示しています。
- id: 108
  category: signs_and_signals
  question: マニュアルでは「稼働中（active）」の工事区間をどのように定義していますか？
  choices:
    A: オレンジ色のひし形標識が掲示されているすべてのエリア。
    B: 開放されている走行車線に隣接する車道上、または路肩に作業員がいる工事区間の部分。
    C: 制限速度が時速25マイル（25 mph）に引き下げられている建設エリア。
    D: 重機が夜間駐車されているエリア。
  answer: B
  explanation: 稼働中の工事区間とは、建設、保守、または公共事業の作業員が車道上、あるいは開放されている走行車線に隣接する高速道路の路肩にいる区間のことを指します。
- id: 109
  category: signs_and_signals
  question: ペンシルベニア州の高速道路において、出口番号は何に対応していますか？
  choices:
    A: その出口が建設された年。
    B: 出口ランプの制限速度。
    C: マイルマーカー（距離標）。
    D: 交差する道路の数。
  answer: C
  explanation: 出口番号はマイルマーカーに対応しています。この仕組みにより、運転者は出口間の距離を素早く計算できるようになります。
- id: 110
  category: signs_and_signals
  question: 高速道路の標識にある「EXIT ONLY（出口専用）」と書かれた黄色のパネルは何を示していますか？
  choices:
    A: 緊急車両のみがその出口を使用できる。
    B: 標識の下の車線はインターチェンジを直進せず、出口ランプ（接続路）になる。
    C: その出口は工事のため閉鎖されている。
    D: 安全に出口を出るために速度を上げなければならない。
  answer: B
  explanation: 高速道路の標識に「EXIT ONLY」という黄色のパネルがある場合、その標識の下の車線はインターチェンジを通過して直進することはできず、道路から外れてランプ（接続路）になります。
- id: 111
  category: signs_and_signals
  question: 州間高速道路番号システム（Interstate Numbering System）において、1桁または2桁の偶数番号の州間高速道路は、一般的に何を示していますか？
  choices:
    A: 南北に走る路線。
    B: 東西に走る路線。
    C: 市街地中心部に直接つながる路線。
    D: 現在建設中の路線。
  answer: B
  explanation: 1桁または2桁の偶数番号の州間高速道路は、一般的に東西に走る路線です。
- id: 112
  category: signs_and_signals
  question: 偶数で始まる3桁の州間高速道路番号（I-276など）は、通常何を意味しますか？
  choices:
    A: 一端のみで接続する支線（spur route）である。
    B: 南北のみを走行する路線である。
    C: 両端で州間高速道路に接続しており、多くの場合、環状道路（loop）またはベルトウェイ（beltway）として知られている。
    D: 有料道路である。
  answer: C
  explanation: 3桁の数字の最初の数字が偶数の場合、その高速道路は通常、両端で州間高速道路に接続しています。多くの場合、このような路線は「環状道路（loop）」または「ベルトウェイ（beltway）」と呼ばれます。
- id: 113
  category: signs_and_signals
  question: これから先の高速道路の出口が道路の左側にあることは、どうすればわかりますか？
  choices:
    A: 出口標識が全体的に黄色で塗られている。
    B: メインの長方形の標識の上にある小さな緑色の出口番号標識が、標識の左側に配置されている。
    C: 出口番号が奇数である。
    D: 標識の上に赤い点滅灯がある。
  answer: B
  explanation: 高速道路の出口が左側にある場合、緑色の長方形の標識の上にある小さな緑色の「EXIT（出口）」番号標識は、標識の左側に配置されます。
- id: 114
  category: signs_and_signals
  question: 工事区域の電光矢印板に、方向を示す矢印ではなく「注意（caution）」のメッセージが表示されている場合、それは何を意味しますか？
  choices:
    A: この先の道路は完全に閉鎖されている。
    B: 直ちに路肩に車を寄せなければならない。
    C: 走行車線の隣に工事区域がある。
    D: 踏切に近づいている。
  answer: C
  explanation: 注意メッセージを表示している矢印パネルは、走行車線の隣に工事区域があることを示しています。細心の注意を払って運転してください。
- id: 115
  category: signs_and_signals
  question: ほとんどの幹線道路や高速道路の案内標識は何色ですか？
  choices:
    A: 赤地に白文字
    B: 黄地に黒文字
    C: 緑地に白文字
    D: 青地に白文字
  answer: C
  explanation: マニュアルによると、幹線道路および高速道路の案内標識は緑地に白文字です。
- id: 116
  category: signs_and_signals
  question: 工事区域において、変化する交通パターンを誘導し、危険から遠ざけるために使用されるものは次のうちどれですか？
  choices:
    A: 電光矢印板
    B: 五角形の標識
    C: バレル（ドラム）、チューブ、コーン、および垂直パネル
    D: 赤、白、青のシールド（盾形標識）
  answer: C
  explanation: バレル、チューブ、コーン、および垂直パネルはすべて、道路工事に伴う危険から遠ざけ、変化する交通パターンを誘導するために工事区域で使用される規制材（チャネリングデバイス）です。
- id: 117
  category: signs_and_signals
  question: ペンシルベニア州の東西に走る道路において、マイルマーカーの番号が0から始まるのはどこですか？
  choices:
    A: 州の東部
    B: 州の西部
    C: 州の中央部
    D: ルート上の最大の都市
  answer: B
  explanation: マニュアルによると、東西に走る道路のマイルマーカーの番号は州の西部で0から始まり、東に進むにつれて増加します。
- id: 118
  category: safe_driving_rules
  question: 高速道路のマイルマーカーの読み方を知っていることの実用的な利点は何ですか？
  choices:
    A: 高速道路の現在の制限速度がわかる。
    B: 次の休憩所までの正確な距離がわかる。
    C: ロードサービスを呼ぶ必要がある場合に、おおよその位置を伝えるのに役立つ。
    D: 次の州境までの残りマイル数がわかる。
  answer: C
  explanation: マニュアルには、マイルマーカーの読み方を知ることで、自分の現在地を正確に把握でき、ロードサービスを呼ぶ必要がある場合におおよその位置を伝えるのに役立つと記載されています。
- id: 119
  category: signs_and_signals
  question: 次の出口にある病院、食事、宿泊施設の場所を示すサービス標識は何色ですか？
  choices:
    A: 緑地に白文字
    B: 青地に白の文字または記号
    C: 茶色地に白文字
    D: 黄地に黒文字
  answer: B
  explanation: サービス標識は正方形または長方形で、青地に白の文字または記号で、次の出口にあるさまざまなサービスの場所を示します。
- id: 120
  category: signs_and_signals
  question: 博物館や州立公園へドライバーを誘導する観光案内標識には、通常どの色が使用されますか？
  choices:
    A: 赤またはオレンジに黒の文字
    B: 緑または黄色に黒の文字
    C: 青または茶色に白の文字
    D: 黒または白に赤の文字
  answer: C
  explanation: 観光案内標識は正方形または長方形で、青または茶色に白の文字で表示されることがあります。
- id: 121
  category: signs_and_signals
  question: 黄色の路面標示の主な目的は何ですか？
  choices:
    A: 同じ方向に進む交通の車線を分けるため
    B: 道路の右端を示すため
    C: 反対方向に進む交通を分けるため
    D: 自転車専用車線を示すため
  answer: C
  explanation: マニュアルによると、黄色の線は反対方向に進む交通を分けるものであり、2車線道路のセンターライン（中央線）をマークするために使用されます。
- id: 122
  category: signs_and_signals
  question: 同じ方向に進む交通の車線を分け、道路の右端を示すために使用される路面標示はどれですか？
  choices:
    A: 実線の白線
    B: 破線の黄線
    C: 実線の黄線
    D: 二重の黄線
  answer: A
  explanation: 実線の白線は、同じ方向に進む交通の車線を分けるほか、道路の右端を示すためにも使用されます。
- id: 123
  category: safe_driving_rules
  question: 対面通行の道路において、二重の実線の黄色いセンターラインは何を示していますか？
  choices:
    A: 両方向の交通に対して追い越しが許可されている。
    B: どちらの方向の交通も追い越しは禁止されている。
    C: 右側の交通のみ追い越しができる。
    D: その車線は左折専用である。
  answer: B
  explanation: 二重の実線の黄色いセンターラインは、どちらの方向の交通も追い越しが禁止されている対面通行道路の中央を示します。
- id: 124
  category: safe_driving_rules
  question: 実線の黄線と破線の黄線が組み合わされたセンターラインがある対面通行の道路で、追い越しが許可されるのはどのような時ですか？
  choices:
    A: 実線の黄線が自分の走行車線側にある時のみ
    B: 破線の黄線が自分の走行車線側にある時のみ
    C: 対向車がいない場合は、線の種類に関係なくいつでも
    D: このような道路では追い越しは一切許可されない
  answer: B
  explanation: 破線の黄線が自分の走行車線側にあり、安全な状況であれば追い越しができますが、実線の黄線が自分の側にある場合は追い越しをしてはいけません。
- id: 125
  category: safe_driving_rules
  question: 3車線または5車線の道路において、内側が破線の黄線、外側が実線の黄線で示された中央車線の目的は何ですか？
  choices:
    A: 低速車両を追い越すための通常の走行車線である。
    B: 緊急車両専用の車線である。
    C: どちらの方向から進む車両も、左折するためにのみ使用できる。
    D: ラッシュアワー用のリバーシブル車線である。
  answer: C
  explanation: 内側が破線、外側が実線の黄色いセンターラインは、どちらの方向から進む車両も、その中央車線を左折（左折専用）のためにのみ使用できることを示しています。
- id: 126
  category: signs_and_signals
  question: 中央分離帯のある自動車専用道路において、道路の左端と右端はどのように標示されていますか？
  choices:
    A: 両端とも実線の白線で標示されている。
    B: 両端とも実線の黄線で標示されている。
    C: 右端は実線の黄線、左端は実線の白線である。
    D: 右端は実線の白線、左端は実線の黄線である。
  answer: D
  explanation: 中央分離帯のある自動車専用道路では、道路の右端は実線の白線で、各側の左端は実線の黄線で標示されています。
- id: 127
  category: safe_driving_rules
  question: 信号機のない踏切に近づいた場合、最も安全な行動は何ですか？
  choices:
    A: できるだけ速やかに線路を通過する
    B: 速度を落とし、列車が近づいているのが見えたり聞こえたりした場合は停止できるよう準備する
    C: 列車の有無にかかわらず、完全に停止する
    D: 通常の速度で踏切を通過する
  answer: B
  explanation: 踏切に信号機がない場合は、速度を落とし、列車が近づいているのが見えたり聞こえたりした場合には停止できるように準備する必要があります。
- id: 128
  category: safe_driving_rules
  question: 踏切の遮断機が閉じているとき、どのような状況であれば遮断機を避けて走行してもよいですか？
  choices:
    A: 列車が通過したのがはっきりと見える時
    B: 赤信号の点滅は止まったが、遮断機が故障して動かない時
    C: 他のドライバーが遮断機を避けて走行している時
    D: いかなる場合も不可（決してない）
  answer: D
  explanation: マニュアルの復習セクションには、踏切の遮断機を避けて走行することは「いかなる場合も不可（Never）」であると明記されています。
- id: 129
  category: signs_and_signals
  question: 黄色と黒のひし形の標識の一般的な意味は何ですか？
  choices:
    A: 前方の都市や町への案内を助ける
    B: 交通法規や規制を伝える
    C: 道路上または道路付近の状況について警告する
    D: スクールゾーン（通学路）を示す
  answer: C
  explanation: 黄色と黒のひし形の標識は警戒標識であり、道路上または道路付近の状況について警告するものです。
- id: 130
  category: signs_and_signals
  question: 黄色と黒のひし形の標識は何を示していますか？
  choices:
    A: 前方の都市や町への案内を助ける
    B: 道路上または道路付近の状況について警告する
    C: 交通法規や規制を伝える
    D: 前方の道路工事について伝える
  answer: B
  explanation: 黄色と黒のひし形の標識は、道路上または道路付近の状況について警告するものです。
- id: 131
  category: signs_and_signals
  question: 信号機の色の並び順として、上から下への正しい順番はどれですか？
  choices:
    A: 赤、黄、緑
    B: 赤、緑、黄
    C: 緑、赤、黄
    D: 緑、黄、赤
  answer: A
  explanation: 信号機の色の正しい順番は、上から下へ、赤、黄、緑の順です。
- id: 132
  category: signs_and_signals
  question: 青の矢印信号が通常の青信号（点灯）に変わった場合、どうすべきですか？
  choices:
    A: もはや曲がることはできず、直進しなければならない
    B: 依然として、曲がるための排他的な優先権がある
    C: 停止して、次の青の矢印信号を待たなければならない
    D: 曲がることはできるが、対向車に道を譲らなければならない
  answer: D
  explanation: 青の矢印信号が通常の青信号に変わった場合、曲がることは可能ですが、対向車に対して進路を譲る（イールド）必要があります。
- id: 133
  category: signs_and_signals
  question: 交差点での黄色の点灯信号は何を意味しますか？
  choices:
    A: 進め
    B: 他の車に道を譲れ
    C: 減速し、停止の準備をせよ
    D: 直ちに停止せよ
  answer: C
  explanation: 交差点での黄色の点灯信号は、減速して停止の準備をすべきであることを意味します。
- id: 134
  category: signs_and_signals
  question: 黄色の点滅信号に遭遇したとき、どうすべきですか？
  choices:
    A: 減速し、注意して進む
    B: 道が空いていれば、通常の速度で通過する
    C: 停止し、青信号になるまで待つ
    D: 停止し、道が空いたら進む
  answer: A
  explanation: 黄色の点滅信号は、減速して注意深く進むべきであることを意味します。
- id: 135
  category: signs_and_signals
  question: 次の信号のうち、完全な一時停止が必要なものはどれですか？
  choices:
    A: 赤色の点滅信号
    B: 黄色の点灯信号
    C: 黄色の矢印信号
    D: 黄色の点滅信号
  answer: A
  explanation: 赤色の点滅信号を見たときは、必ず一時停止しなければなりません。
- id: 136
  category: safe_driving_rules
  question: どのような条件下で、黄信号を注意してそのまま通過することができますか？
  choices:
    A: 緊急車両が自分の車線を横切っている場合
    B: 横断中の歩行者がいない場合
    C: 右折する場合
    D: すでに交差点内に入っている場合
  answer: D
  explanation: すでに交差点内に入っている場合は、注意しながら黄信号のまま進み続けることができます。
- id: 137
  category: safe_driving_rules
  question: 信号機が故障している、または機能していない交差点に近づいた場合、どうすべきですか？
  choices:
    A: 停止して、修理されるのを待つ
    B: 停止して、警察官が到着するのを待つ
    C: 4方向一時停止（オールウェイ・ストップ）の標識があるものとして進む
    D: 通常通りに進む
  answer: C
  explanation: 信号機が故障している、または機能していない場合は、4方向一時停止の交差点と同じルールに従って進む必要があります。
- id: 138
  category: safe_driving_rules
  question: 赤信号で右折（許可されている場合）をする前に、何をしなければなりませんか？
  choices:
    A: まず一時停止し、交通状況と歩行者を確認する
    B: 右折用の赤の矢印信号があることを確認する
    C: 左車線に移動する
    D: 完全には止まらずに、まず減速する
  answer: A
  explanation: 赤信号での右折は、まず一時停止し、他の車両や歩行者の安全を確認した上で行うことができます。
- id: 139
  category: signs_and_signals
  question: 同じ方向に進む車線を区切る線の色は何色ですか？
  choices:
    A: 黄色
    B: 白色
    C: 赤色
    D: 黒色
  answer: B
  explanation: 同じ方向に進む交通の車線は、白い線で区切られています。
- id: 140
  category: safe_driving_rules
  question: どの中央線の種類において、両側からの追い越しが禁止されていますか？
  choices:
    A: 実線と破線の組み合わさった黄色の中央線
    B: 1本の破線の黄色の中央線
    C: 2本の実線の黄色の中央線
    D: 1本の破線の白色の中央線
  answer: C
  explanation: 2本の実線の黄色の中央線がある場所では、どちらの側からも他車を追い越すことはできません。
- id: 141
  category: safe_driving_rules
  question: 一時停止標識の路面に描かれた白い停止線の手前で停止した際、交差する道路の交通状況が十分に確認できない場合、どうすべきですか？
  choices:
    A: 進行する前にクラクションを鳴らす
    B: 5秒間待ってから進行する
    C: ゆっくりと前進し、車両や歩行者を確認し、安全が確保されたら進行する
    D: 窓を下げ、交通の音を聞いてから進行する
  answer: C
  explanation: マニュアルによると、白い停止線の手前で停止した際に交差する道路の交通状況が十分に確認できない場合は、ゆっくりと前進し、車両や歩行者を確認し、安全が確保されたら進行すべきです。
- id: 142
  category: signs_and_signals
  question: 掲示されている制限速度は何を示していますか？
  choices:
    A: 法定最低速度
    B: 道路や天候が理想的な条件下での安全な最高速度
    C: 違反切符を切られないために走行しなければならない正確な速度
    D: あらゆる道路条件下での安全な最高速度
  answer: B
  explanation: 掲示されている制限速度は、道路や天候が理想的な条件下での安全な最高速度を示しています。
- id: 143
  category: safe_driving_rules
  question: 中央車線（センターレーン）から合法的に行える操作は何ですか？
  choices:
    A: 左折する
    B: Uターン（転回）する
    C: 低速車両を追い越す
    D: 車両を駐車する
  answer: A
  explanation: マニュアルのテスト項目に基づくと、中央車線から行える正しい操作は左折です。
- id: 144
  category: vehicle_information
  question: 車のタイヤの空気圧をチェックするのに最適な時期はいつですか？
  choices:
    A: 高速道路を走行した直後
    B: タイヤが「冷えている」とき（走行前、または走行後少なくとも3時間経過してから）
    C: エンジンがかかっている間
    D: 夏季の間のみ
  answer: B
  explanation: マニュアルには、タイヤが「冷えている」状態、つまり走行前、または走行後少なくとも3時間経過してからチェックするように記載されています。
- id: 145
  category: vehicle_information
  question: ペニー硬貨を使ってタイヤの摩耗をチェックする際（ペニーテスト）、安全な溝の深さで走行していることを示すのはどれですか？
  choices:
    A: エイブラハム・リンカーンの頭がすべて見える
    B: 溝に置いたときに硬貨が倒れる
    C: エイブラハム・リンカーンの頭の一部が溝に隠れている
    D: 溝が完全に平らである
  answer: C
  explanation: ペニーテスト中にリンカーンの頭の一部が溝に隠れていれば、安全な溝の深さで走行していることになります。
- id: 146
  category: safe_driving_rules
  question: 車内の客室に固定されていない荷物を置いておくのが危険なのはなぜですか？
  choices:
    A: タイヤの空気圧が下がる原因になるため
    B: 衝突時に、衝突前の車両の速度で飛び続ける「飛び出し物」となるため
    C: 車両の燃料消費量が増えるため
    D: 一酸化炭素中毒の原因になるため
  answer: B
  explanation: 衝突時、車内の固定されていない荷物は、衝突前に車両が走行していた速度と同じ速度で飛び続ける「飛び出し物」となります。
- id: 147
  category: vehicle_information
  question: 死角をなくすためにサイドミラーを調整する場合、どのように設定すべきですか？
  choices:
    A: 車両の真後ろの交通状況が見えるように設定する
    B: 体を傾けずに自車の側面全体が見えるように設定する
    C: 左右に体を傾けたときに、自車の側面が辛うじて見えるように設定する
    D: 地面を直接指すように設定する
  answer: C
  explanation: サイドミラーは、左右に体を傾けたときに自車の側面が辛うじて見えるように設定する必要があります。
- id: 148
  category: penalties_and_points
  question: ルームミラー（バックミラー）に物を吊り下げることに関するペンシルベニア州の法律は何ですか？
  choices:
    A: 物が3インチ（約7.6cm）未満であれば合法である
    B: 走行中にルームミラーに物を吊り下げることは法律違反である
    C: 走行中は駐車許可証のみ吊り下げることが許可されている
    D: 初心者ドライバーを識別するために吊り下げ物が義務付けられている
  answer: B
  explanation: 走行中にルームミラーに物や資料を吊り下げることは法律違反です。タグ、許可証、プラカードなどは、車両が駐車しているときにのみ取り付けることができます。
- id: 149
  category: alcohol_drugs_health
  question: 車内に常に新鮮な空気を取り入れることは、注意力を維持するだけでなく、どのような危険を防ぐのに役立ちますか？
  choices:
    A: 一酸化炭素（排気ガス）中毒
    B: 二酸化窒素中毒
    C: 脱水症状
    D: 乗り物酔い
  answer: A
  explanation: 車内に常に新鮮な空気を取り入れることは、運転中の注意力を維持し、一酸化炭素（排気ガス）中毒を防ぐのに役立ちます。
- id: 150
  category: vehicle_information
  question: 車のヘッドレスト（頭部後傾抑止装置）はどのように適切に調整すべきですか？
  choices:
    A: ヘッドレストの下部が肩に乗るように調整する
    B: ヘッドレストの上部が少なくとも耳の上端と同じ高さになるように調整する
    C: 首の真後ろに位置するように調整する
    D: 視界を良くするために完全に取り外す
  answer: B
  explanation: 衝突時の首の怪我を防いだり、程度を軽減したりするために、ヘッドレストの上部が少なくとも耳の上端と同じ高さになるように調整してください。
- id: 151
  category: safe_driving_rules
  question: マニュアルによると、衝突時に車外に放り出された場合、死亡する確率は何パーセント増加しますか？
  choices:
    A: 25パーセント
    B: 50パーセント
    C: 75パーセント
    D: 90パーセント
  answer: C
  explanation: 車外に放り出されると、死亡する確率が75パーセント増加します。ドアをロックし、シートベルトを着用することで、車外に放り出されないようにすることができます。
- id: 152
  category: safe_driving_rules
  question: 運転中のヘッドホンやイヤホンの使用に関する規則は何ですか？
  choices:
    A: GPSを聞くためであれば、両耳で使用できる
    B: 通信目的の場合に限り、片耳のみで使用できる
    C: いかなる時も着用は完全に違法である
    D: 音楽を聴くためであれば、両耳で使用できる
  answer: B
  explanation: 注意：ヘッドホンやイヤホンは、通信目的の場合に限り、片耳のみで使用することができます。
- id: 153
  category: driver_responsibility
  question: 統計によると、10代のドライバーが事故を起こす可能性がより高くなるのは、どのような状況で運転している時ですか？
  choices:
    A: 一人で運転している時
    B: 大人の同乗者がいる時
    C: 他の10代の若者を同乗させている時
    D: 午前中の時間帯
  answer: C
  explanation: 統計によると、10代のドライバーが他の10代の若者を同乗させて運転している場合、一人で運転している時や大人の同乗者がいる時よりも事故を起こす可能性が高くなります。
- id: 154
  category: defensive_driving
  question: 警察に報告された交通事故のうち、ドライバーの注意散漫や道路・交通状況への不注意が原因であるものは何パーセントを占めますか？
  choices:
    A: 10〜15パーセント
    B: 25〜30パーセント
    C: 45〜50パーセント
    D: 75〜80パーセント
  answer: B
  explanation: 警察に報告された交通事故の25〜30パーセントは、ドライバーの注意散漫や道路・交通状況への不注意が原因です。
- id: 155
  category: defensive_driving
  question: 調査によると、10代の若者が携帯電話でダイヤル操作をしている際、重要な道路状況を見落とす頻度はどのくらいですか？
  choices:
    A: 3パーセントの確率
    B: 13パーセントの確率
    C: 25パーセントの確率
    D: 53パーセントの確率
  answer: D
  explanation: 調査によると、注意を逸らしていない通常のドライバーが重要な道路状況に気づかない割合は3パーセント、携帯電話を操作している大人は13パーセント、そして携帯電話を操作している10代の若者は53パーセントの割合で見落とすことがわかっています。
- id: 156
  category: alcohol_drugs_health
  question: 18時間起き続けている状態での運転能力の低下は、血中アルコール濃度（BAC）がどの程度の時とほぼ同じですか？
  choices:
    A: .02パーセント
    B: .05パーセント
    C: .08パーセント
    D: .10パーセント
  answer: B
  explanation: マニュアルには、18時間起き続けている状態は、血中アルコール濃度（BAC）が.05パーセントの時とほぼ同程度、運転に支障をきたすと記載されています。
- id: 157
  category: safe_driving_rules
  question: 運転中に疲れを感じ始めた場合、最も適切な対処法は何ですか？
  choices:
    A: コーヒーやカフェイン飲料を飲む
    B: 窓を開けて新鮮な空気を入れる
    C: 運転を止める
    D: ラジオの音量を上げる
  answer: C
  explanation: マニュアルには、運転中に疲れを感じ始めた場合の最善の策は、運転を止めることであると明記されています。
- id: 158
  category: alcohol_drugs_health
  question: 安全な運転を確保するために、どのくらいの頻度で視力検査を受けるべきですか？
  choices:
    A: 6ヶ月ごと
    B: 1〜2年ごと
    C: 3〜5年ごと
    D: 免許更新時のみ
  answer: B
  explanation: 周辺視野、距離感、低照度下での視力は時間の経過とともに低下する可能性があるため、マニュアルでは1〜2年ごとに視力検査を受けることを推奨しています。
- id: 159
  category: alcohol_drugs_health
  question: ペンシルベニア州では、医師が患者に対して安全な運転に支障をきたす可能性のある疾患があると診断した場合、何をすることが義務付けられていますか？
  choices:
    A: 患者の運転免許証を没収する
    B: その人物をPennDOT（州運輸局）に報告する
    C: 運転を許可する前に薬を処方する
    D: 患者の保険会社に通知する
  answer: B
  explanation: ペンシルベニア州では、医師は安全に運転する能力を損なう可能性のある疾患があると診断した人物を、PennDOT（ペンシルベニア州運輸局）に報告しなければなりません。
- id: 160
  category: alcohol_drugs_health
  question: 21歳未満の場合、血中アルコール濃度（BAC）がいくつ以上であれば、酒気帯び運転（DUI）とみなされますか？
  choices:
    A: .00パーセント
    B: .02パーセント
    C: .04パーセント
    D: .08パーセント
  answer: B
  explanation: 21歳未満のドライバーで、血中アルコール濃度（BAC）が.02パーセント以上の場合、酒気帯び運転（DUI）とみなされます。
- id: 161
  category: alcohol_drugs_health
  question: 次のうち、標準的なアルコール飲料1杯分に相当すると見なされるのはどれですか？
  choices:
    A: 8オンスのレギュラービール
    B: 5オンスのワイン
    C: 2オンスのアルコール度数40度（80プルーフ）の蒸留酒
    D: 16オンスのライトビール
  answer: B
  explanation: アルコール1杯分は、アルコール度数40度（80プルーフ）の蒸留酒1.5オンス、レギュラービール12オンス、またはワイン5オンスに相当すると考えるべきです。
- id: 162
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）を下げる唯一の効果的な方法は何ですか？
  choices:
    A: コーヒーを飲む
    B: 冷たいシャワーを浴びる
    C: ボリュームのある食事を摂る
    D: 時間の経過を待つ
  answer: D
  explanation: マニュアルには、時間を置くことだけが「酔いを覚ます」唯一の方法であると記載されています。コーヒーやカフェイン飲料を飲んだり、冷たいシャワーを浴びたりしても、BACを下げることはできません。
- id: 163
  category: alcohol_drugs_health
  question: 血中アルコール濃度が0.04%であっても、アルコールを摂取していないドライバーと比較して、事故に遭う確率は何倍高くなりますか？
  choices:
    A: 2倍から7倍
    B: 10倍
    C: 20倍
    D: 50倍
  answer: A
  explanation: 血中アルコール濃度が0.04%のドライバーは、アルコールを摂取していないドライバーに比べて、事故に遭う確率が2倍から7倍高くなります。
- id: 164
  category: alcohol_drugs_health
  question: マリファナは安全運転能力にどのような影響を及ぼしますか？
  choices:
    A: 攻撃的で無謀な運転を引き起こす
    B: 距離の判断力を向上させる
    C: 反応時間を遅らせ、時間と距離の判断力を損なう
    D: 協調性と注意力を高める
  answer: C
