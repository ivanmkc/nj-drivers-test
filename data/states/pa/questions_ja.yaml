    A: いかなる状況下でも路上試験に使用することはできない
    B: 自動駐車機能は縦列駐車のセクションでのみ使用できる
    C: 使用は可能だが、自動駐車機能はオフにし、作動させてはならない
    D: 試験官が機能をテストするために作動させる
