  answer: B
  explanation: ペンシルベニア州の新人ドライバー（16歳および17歳）が関与する主な事故の種類には、1）固定物への衝突が含まれます。
- id: 168
  category: alcohol_drugs_health
  question: NHTSA（全米高速道路交通安全局）の調査によると、交通事故で死亡したドライバーの何パーセントから薬物の陽性反応が出ましたか？
  choices:
    A: 20%
    B: 30%
    C: 37%
    D: 43%
  answer: D
  explanation: マニュアルに記載されているNHTSAの2013-2014年路上調査によると、交通事故で死亡したドライバーの43%から薬物の陽性反応が出ました。
- id: 169
  category: safe_driving_rules
  question: 通常の乾燥した路面状況において、推奨される安全な車間距離はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: C
  explanation: 路面が乾燥していれば、4秒の車間距離を保つことで、高速道路上の危険を回避するために安全にハンドル操作やブレーキ操作を行うことができます。
- id: 170
  category: defensive_driving
  question: 他のドライバーが車間距離を極端に詰めて（テールゲーティング）走行している場合、どうすべきですか？
  choices:
    A: 速度を上げて車間距離を広げる
    B: 可能であれば右側の車線に移動する
    C: 警告のために急ブレーキをかける
    D: 左側の車線に移動し、速度を維持する
  answer: B
  explanation: 後ろの車が車間距離を極端に詰めてきている（テールゲーティング）のに気づいたら、可能であれば右側の車線に移動してください。また、軽くブレーキを叩いて（ポンピングブレーキ）徐々に速度を落とし、相手に追い越しを促すこともできます。
- id: 171
  category: safe_driving_rules
  question: 問題となる状況を早期に特定するために、どのくらい先まで見て運転すべきですか？
  choices:
    A: 3〜5秒先
    B: 6〜8秒先
    C: 12〜15秒先
    D: 20〜30秒先
  answer: C
  explanation: 問題となる状況を12〜15秒先（市街地では約1ブロック先、高速道路では約1/4マイル先）で特定できるようにしておく必要があります。
- id: 172
  category: defensive_driving
  question: 交差点に差し掛かった際、なぜ最初に左側を確認すべきなのですか？
  choices:
    A: 左側から来る車両の方が自分に近いからです。
    B: 左側から来る車両に優先権があるからです。
    C: 左側の車両の方が視認しやすいからです。
    D: 左側の車両は通常、より速い速度で走行しているからです。
  answer: A
  explanation: 交差点に差し掛かったら、「左・右・左」のルールに従ってください。左側から来る車両の方が自分に近いため、最初に左を確認します。
- id: 173
  category: safe_driving_rules
  question: 車両の左後方および右後方の死角を確認する最善の方法は何ですか？
  choices:
    A: ルームミラーを確認する。
    B: サイドミラーを確認する。
    C: 車線変更の前に首を振って目視で確認する。
    D: バックカメラを頼りにする。
  answer: C
  explanation: 左後方と右後方のエリアは死角になります。車線変更の前には、必ず首を振って目視でこれらのエリアを確認してください。
- id: 174
  category: defensive_driving
  question: 右側に駐車車両があり、左側に前方から来る対向車がいる道路を走行している場合、最善の行動は何ですか？
  choices:
    A: 対向車を避けるため、駐車車両に近づいて走行する。
    B: ドアが開くのを避けるため、対向車に近づいて走行する。
    C: 危険な場所を素早く通り過ぎるために加速する。
    D: 速度を落とし、対向車と駐車車両の中間を走行する。
  answer: D
  explanation: 右側に駐車車両、左側に対向車がある場合は、速度を落とし、両者のちょうど中間を走行して「リスクを分散させる」のが最善です。
- id: 175
  category: driver_responsibility
  question: ペンシルベニア州における16歳および17歳のドライバーが関与する4つの主な事故類型のうち、当てはまるものはどれですか？
  choices:
    A: 側面接触事故（サイドスワイプ）
    B: 固定物への衝突
    C: 駐車車両への後退時の衝突
    D: 横転事故
  answer: B
  explanation: 初心者ドライバーの主な事故類型には、1) 固定物への衝突、2) 交差点での衝突、3) 追突事故、4) 正面衝突の4つがあります。
- id: 176
  category: safe_driving_rules
  question: 次のような条件のうち、通常よりも長い車間距離を保つべきなのはどれですか？
  choices:
    A: 舗装したての道路を走行しているとき。
    B: オートバイの後ろを走行しているとき。
    C: 下り坂を走行しているとき。
    D: 左側車線を走行しているとき。
  answer: C
  explanation: 下り坂では、特に高速走行時にブレーキで車両を減速させることが難しくなるため、通常よりも長い車間距離を保つ必要があります。
- id: 177
  category: defensive_driving
  question: 退避経路として車両の少なくとも片側に最低8フィート（約2.4メートル）のスペースがない場合、どうすべきですか？
  choices:
    A: すぐに左車線に移動する。
    B: 車間距離を広げて、前方のスペースを確保する。
    C: 他のドライバーに警告するためにクラクションを鳴らす。
    D: 制限されたエリアから抜け出すために加速する。
  answer: B
  explanation: 退避経路として車両の片側に少なくとも8フィートのスペースを確保できない場合は、車間距離を長くして前方のスペースをより多く確保する必要があります。
- id: 178
  category: sharing_the_road
  question: 視界を遮る大型車両の後ろを走行する際、なぜ前方に余分なスペースが必要なのですか？
  choices:
    A: 大型車両からの排気ガスを避けるため。
    B: 車両の周囲を見渡すための余分な視界を確保するため。
    C: 大型車両は乗用車よりも速く走行するため。
    D: 大型車両のブレーキランプの方が明るいため。
  answer: B
  explanation: 前方の視界を遮る大型車両の後ろを走行するときは、その車両の周囲を見通すためのスペースが必要なため、車間距離を長く取る必要があります。
- id: 179
  category: defensive_driving
  question: 交差点で、建物や低木、駐車車両によって交差する道路の視界が遮られている場合、どうすべきですか？
  choices:
    A: クラクションを鳴らし、通常の速度で進む。
    B: 他の車両が動き出すのを待ち、その後をついていく。
    C: はっきりと見えるようになるまで、ゆっくりと前進する。
    D: 直進せずに右折する。
  answer: C
  explanation: 建物、低木、駐車車両などで交差する道路の視界が遮られている場合は、安全が確認できる位置までゆっくりと前進してください。
- id: 180
  category: safe_driving_rules
  question: 他のドライバーの死角を走行し続けないようにするための良いルールは何ですか？
  choices:
    A: 他の車両の斜め後方を長時間走行する。
    B: 相手に自分の存在を知らせるために、死角にとどまる。
    C: 加速するか速度を落として、相手の死角から外れる。
    D: 死角にいる間、継続的にハイビームを点滅させる。
  answer: C
  explanation: 他の車両の左右の斜め後方を長時間走行することは避けてください。加速するか、あるいは速度を落として、相手の死角から速やかに外れるようにしましょう。
- id: 181
  category: safe_driving_rules
  question: 安全な車間距離を保っているかどうかを判断するには、どうすればよいですか？
  choices:
    A: 車何台分かを基準に距離を推定する。
    B: 前方の車両が道路脇の目印を通過してから、自分がそこに到達するまでの秒数を数える。
    C: 速度計を見て、速度を2で割る。
    D: 前方の車両がブレーキをかけるまで待ち、自分の反応時間を計る。
  answer: B
  explanation: 車間距離を判断するには、前方の車両のリアバンパーが道路脇の目印（標識や電柱など）を通過したのを確認し、自分が同じ地点に到達するまでに何秒かかるかを数え始めてください。
- id: 182
  category: sharing_the_road
  question: スクールバス、タクシー、または危険物を輸送するトラックの後ろを走行する際、車間距離を長く取るべきなのはなぜですか？
  choices:
    A: これらの車両は、より低い制限速度で走行することが義務付けられているため。
    B: 踏切などで予期せぬ停止をすることがあるため。
    C: 他の車両よりも死角が大きいため。
    D: 坂道で後退する可能性が高いため。
  answer: B
  explanation: これらの車両は踏切で停止しなければならなかったり、その他の予期せぬ停止をしたりすることがあるため、車間距離を長めに取る必要があります。
- id: 183
  category: defensive_driving
  question: 他車を追い越す際、相手の死角をできるだけ素早く安全に通り過ぎるべきなのはなぜですか？
  choices:
    A: 相手のドライバーが加速するのを防ぐため。
    B: 死角を5秒以上走行することは違法であるため。
    C: 死角に留まる時間が長いほど、双方の危険な状態が長く続くため。
    D: 他車のスリップストリームに巻き込まれるのを避けるため。
  answer: C
  explanation: 他車を追い越すときは、相手のドライバーの死角をできるだけ素早く、かつ安全に通り過ぎてください。死角に留まる時間が長いほど、双方にとって危険な時間が長くなります。
- id: 184
  category: defensive_driving
  question: 車線変更をする際、自車の死角をどのように確認すべきですか？
  choices:
    A: バックミラー（ルームミラー）だけに頼る。
    B: 左右の肩越しに目視で確認する。
    C: 車両の後退用センサーに頼る。
