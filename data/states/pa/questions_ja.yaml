  question: ペンシルベニア州西部において、臓器の回収と教育を担当している組織はどこですか？
  choices:
    A: Gift of Life Donor Program
    B: Center for Organ Recovery & Education (CORE)
    C: Pennsylvania Liquor Control Board
    D: American Academy of Pediatrics
  answer: B
  explanation: ペンシルベニア州西部では、Center for Organ Recovery & Education (CORE) に連絡して、臓器および組織ドナーカードを入手することができます。
- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 徐行して注意深く進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「一時停止（STOP）」標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に交通状況と歩行者を確認してください。
  id: 490
- image: yield.png
  category: signs_and_signals
  question: この標識は何を求めていますか？
  choices:
    A: 完全停止する
    B: 加速して交通流に合流する
    C: 減速し、他の車両や歩行者に道を譲る（優先権を与える）
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「譲れ（YIELD）」の標識は、減速して他の車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 491
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路に進入してはならない
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「進入禁止（DO NOT ENTER）」の標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや、進入すると対向車の進路に入ってしまう一方通行の道路で見られます。
  id: 492
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: 転回（Uターン）する
    B: 注意深く運転を続ける
    C: 停止して後退するか向きを変える。あなたは逆走しています。
    D: 素早くそのエリアを離れるために加速する
  answer: C
  explanation: 赤と白の「逆走（WRONG WAY）」の標識は、一方通行の道路や高速道路のランプを逆方向に進んでいることを意味します。直ちに停止し、安全に向きを変えるか後退してください。
  id: 493
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方通行（左方向）である
    C: 中央分離帯の左側を走行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「一方通行（ONE WAY）」の標識は、その通りの交通が矢印の指す一方向にのみ進むことを示しています。
  id: 494
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、その場所での転回（Uターン）が禁止されていることを意味します。
  id: 495
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が許可されていないことを意味します。
  id: 496
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 転回（Uターン）禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、その場所での右折が禁止されていることを意味します。
  id: 497
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先車線減少（道幅が狭くなる）
    B: この区間では他車を追い越してはならない
    C: この先対面通行
    D: 右側通行
  answer: B
  explanation: 白黒のペナント型（三角形）の「追い越し禁止（NO PASSING ZONE）」標識は、そのエリアで他車を追い越すことが許可されていないことを意味します。これは追い越し禁止区間の始まりを示します。
  id: 498
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転者に何を指示していますか？
  choices:
    A: 右側に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先右車線終了
  answer: C
  explanation: 矢印が描かれた白い規制標識「右側通行（KEEP RIGHT）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 499
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。速度制限の標識は、理想的な条件下におけるそのエリアの法定最高速度を示しています。
  id: 500
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色のひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園またはアニマルパークがある
    B: この地域では鹿が頻繁に道路を横断する
    C: この先に狩猟区域がある
    D: 近くに野生動物保護区がある
  answer: B
  explanation: 鹿のシルエットが描かれた黄色のひし形の標識は、この地域で鹿が頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 501
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先にスクールゾーンがある
    B: この先に歩行者用横断歩道がある
    C: 近くにハイキングコースがある
    D: この先にバス停がある
  answer: B
  explanation: 歩行者の姿が描かれた黄色のひし形の標識は、この先に歩行者用横断歩道があることを警告しています。道路を横断する歩行者のために停止できるよう準備してください。
  id: 502
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形状は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは通学路の横断歩道
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路の横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 503
- image: railroad_crossing.png
  category: signs_and_signals
  question: この円形の黄色の標識は何を警告していますか？
  choices:
    A: この先にラウンドアバウト（環状交差点）がある
    B: 病院区域
    C: この先に踏切がある
    D: 追い越し禁止区間
  answer: C
  explanation: 黒いXと2つのRが描かれた円形の黄色の標識は、この先に踏切があることを知らせる事前警告標識です。速度を落とし、列車の音や姿を確認してください。
  id: 504
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型のクロスパッチ（踏切警標）は踏切に設置されます。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  id: 505
- image: curve_right.png
  category: signs_and_signals
  question: この黄色のひし形の標識は何を示していますか？
  choices:
