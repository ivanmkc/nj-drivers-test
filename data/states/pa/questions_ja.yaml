    D: 上り坂で追い越すのに乗用車より時間がかからない
  answer: A
  explanation: 一般的に、トラックは乗用車よりも停止するのに長い距離を必要とします。
- id: 335
  category: sharing_the_road
  question: 交差点で右折する前に左に大きく膨らんで走行しているトラックの後方を走行している場合、どのような行為が非常に危険ですか？
  choices:
    A: トラックが右折を完了するまでブレーキをかける
    B: トラックと縁石の間に割り込んで右折しようとする
    C: 4秒の車間距離ルールに違反する
    D: トラックの運転手に向かってクラクションを鳴らす
  answer: B
  explanation: トラックが右折の準備のために左に膨らむ際、トラックと縁石の間に割り込んで右折しようとすることは非常に危険です。
- id: 336
  category: sharing_the_road
  question: 赤色のライトが点滅し、ストップアームが出ているスクールバスに対して、停止しなくてもよい唯一の状況はどれですか？
