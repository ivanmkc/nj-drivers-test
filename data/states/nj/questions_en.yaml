  answer: D
  explanation: Your turn signals should always be used when you make any movement
    to the left or right. You should use your signal when pulling into traffic from
    a curbside parking space, moving into a new lane, or passing another vehicle.
- id: 202
  category: safe_driving_rules
  question: 'When driving on major highways:'
  choices:
    A: Stay alert.
    B: Keep your eyes moving.
    C: Be ready to react to road hazards.
    D: All of the above.
  answer: D
  explanation: It is important to stay alert on highways and be ready to react to
    unexpected hazards. To avoid "highway hypnosis," you should avoid looking at any
    one thing for more than a few seconds.
- id: 203
  category: sharing_the_road
  question: 'You are driving up a hill and are approaching a heavy truck from the
    rear. You should know that:'
  choices:
    A: The truck may be traveling at a speed slower than the posted speed limit.
    B: You may not be able to safely pass the truck.
    C: You may not be able to legally pass the truck.
    D: All of the above.
  answer: D
  explanation: Drivers must be aware that large vehicles often travel at a speed slower
    than the posted speed limit, especially when driving on an incline, and should
    use caution when approaching a large vehicle from the rear. When on a hill with
    limited visibility, it is unlawful to pass another vehicle.
- id: 204
  category: defensive_driving
  question: 'When you see other drivers around you acting or reacting in anger:'
  choices:
    A: Don’t make eye contact.
    B: Don't react with hand gestures.
    C: Distance yourself from the situation.
    D: All of these.
  answer: D
  explanation: When other drivers are behaving angrily, you should take action to
    physically and mentally distance yourself from the situation. Avoid making eye
    contact with them, or making body movements or gestures that could provoke them.
    Slow down, move over, or do whatever you safely can to put yourself out of danger.
- id: 205
  category: safe_driving_rules
  question: 'A person walking with a white cane or guide dog is likely to be:'
  choices:
    A: A deaf person.
    B: A person involved with a traffic study.
    C: A blind person.
    D: None of the above.
  answer: C
  explanation: Drivers must always yield the right-of-way to a pedestrian when the
    pedestrian is a blind person who is using a white cane or guide dog.
- id: 206
  category: safe_driving_rules
  question: 'On a freeway, you realize you missed your turn or exit. You should:'
  choices:
    A: Make the turn quickly from your lane of travel.
    B: Stop and back up.
    C: Continue driving until you reach the next turn, exit, or other location where
      you can safely turn around.
    D: Signal other drivers to stop so you can turn.
  answer: C
  explanation: If you miss your turn or exit, do not back up, but go on to the next
    turn or exit where you can safely turn around. It is illegal to back up on a shoulder
    or a freeway.
- id: 207
  category: safe_driving_rules
  question: 'When turning or changing lanes, you must:'
  choices:
    A: Always signal your intentions, even when no visible traffic is present.
    B: Signal only if there is visible traffic.
    C: Signal only when driving at night.
    D: Signal only when driving in heavy traffic at night.
  answer: A
  explanation: Always signal your intentions when changing lanes, turning, or pulling
    away from a curb. Do not allow yourself to become lazy and form the bad habit
    of not following this law.
- id: 208
  category: alcohol_drugs_health
  question: 'Taking drugs along with alcohol:'
  choices:
    A: Increases the risk of causing a crash.
    B: Is no more dangerous than consuming alcohol by itself.
    C: Lessens the effect of alcohol on your ability to drive.
    D: Has no effect on your general driving ability.
  answer: A
  explanation: Drugs (including illegal, prescription, and over-the-counter medications)
    can affect your brain function and impair your ability to drive safely. Combining
    alcohol with other drugs will increase the risk of a crash.
- id: 209
  category: signs_and_signals
  question: 'When driving on wet pavement, it''s important to remember:'
  choices:
    A: That pavement is especially slippery right after it starts to rain.
    B: That wet roads can cause hydroplaning.
    C: To give yourself additional space when coming to a stop.
    D: All of the above.
  answer: D
  explanation: Wet roadway surfaces can be dangerously slick, especially immediately
    following a rainfall. When you are driving on wet roads, your vehicle is traveling
    on a thin layer of oil, dirt, and water. Slow down when there is heavy rain, standing
    water, or slush on the road to reduce the risk of your wheels losing traction
    on the slick surface.
- id: 210
  category: signs_and_signals
  question: 'A diamond-shaped yellow sign with a curved arrow pointing right indicates:'
  choices:
    A: One-way road.
    B: No right turn.
    C: Exit.
    D: Sharp right turn in the road ahead.
  answer: D
  explanation: Diamond-shaped yellow warning signs with curve arrows warn drivers
    of upcoming sharp turns in the road.
- id: 211
  category: safe_driving_rules
  question: 'A steady green light at an intersection means that you:'
  choices:
    A: Must slow down and prepare to stop.
    B: Must stop and check for oncoming traffic before proceeding.
    C: May drive through the intersection if the road is clear.
    D: May not turn right.
  answer: C
  explanation: A steady green light means you may drive through the intersection if
    the road is clear. You may also turn right or left on a steady green light unless
    a sign prohibits the turn. When turning, you must yield to other vehicles and
    pedestrians within the intersection.
- id: 212
  category: vehicle_information
  question: 'A seat belt should be adjusted so that it:'
  choices:
    A: Is loose.
    B: Is buckled snugly across your hip bones and lower abdomen.
    C: Is hidden beneath the seat.
    D: Keeps the seat belt buzzer or light from operating.
  answer: B
  explanation: Lap belts should fit snugly across your hip bones and the lower part
    of your abdomen. Shoulder belts should sit comfortably so that you can insert
    your fist between the belt and your chest.
- id: 213
  category: safe_driving_rules
  question: 'If you stop along the road at night: '
  choices:
    A: Turn off all your lights.
    B: Use your parking lights only.
    C: Use your headlights only.
    D: Turn on your emergency flashers and leave your low beams turned on.
  answer: D
  explanation: If you stop along the road at night, turn on your emergency flashers
    and leave your low beam headlights turned on. Be sure that other road users will
    be able to clearly see your vehicle.
- id: 214
  category: safe_driving_rules
  question: 'You cannot pass safely on a two-way, two-lane street unless:'
  choices:
    A: You are able to clearly see the road ahead.
    B: You can return to your lane before meeting oncoming traffic.
    C: Your vehicle is capable of the speed necessary to pass.
    D: All of the above.
  answer: D
  explanation: You cannot pass safely when driving on a two-way, two-lane street unless
    you can clearly see the road ahead, you can return to your lane before meeting
    oncoming traffic, and your vehicle is capable of the speed necessary to pass.
    Do not pass where it is illegal and unsafe to do so.
- id: 215
  category: signs_and_signals
  question: 'Two solid yellow lines on the pavement mean:'
  choices:
    A: Passing is allowed for drivers from both directions.
    B: Passing is not allowed.
    C: Passing is allowed if you are at the top a hill.
    D: Passing is allowed during daylight only.
  answer: B
  explanation: Yellow lines tell you that the traffic on the other side of the lines
    is moving in the opposite direction. You should never cross two solid yellow lines
    to pass from either direction.
- id: 216
  category: safe_driving_rules
  question: 'A driver can legally pass on the right side of another vehicle:'
  choices:
    A: If the vehicle is waiting to turn left and there is an available passing lane.
    B: Even if it means driving off the pavement.
    C: On a narrow bridge.
    D: At any time.
  answer: A
  explanation: If there is an available passing lane, you may pass on the right of
    a vehicle or bicycle that is turning left or waiting to turn left. It is also
    legal to pass on the right when driving on a multilane road with two or more lanes
    traveling in the same direction. You may never drive off the pavement or main-traveled
    portion of the road to pass another vehicle.
- id: 217
  category: sharing_the_road
  question: 'If a crossing guard is directing traffic in a school zone, you must:'
  choices:
    A: Follow the directions given by the crossing guard.
    B: Copy what surrounding traffic is doing, despite the crossing guard's instructions.
    C: Assume the guard is not supposed to be directing traffic.
    D: 'Follow rules that would be in place if no children were present. '
  answer: A
  explanation: Be prepared to reduce your speed and use caution when directed to do
    so by a sign, crossing guard, or law enforcement officer. Always drive with extra
    caution in a school zone.
- id: 218
  category: safe_driving_rules
  question: 'Signaling your intentions before turning, changing lanes, or driving
    away from a curb:'
  choices:
    A: Is necessary only if other traffic is present.
    B: Is a good driving habit and is required by law.
    C: Is necessary only during the maneuver, not before.
    D: Is not necessary if the maneuver is done slowly.
  answer: B
  explanation: When changing lanes or turning, signal your intentions well in advance.
    The law requires that you signal for at least 100 feet before you move your vehicle
    to the right or left. Before pulling away from a curb, always signal to inform
    passing drivers of your intentions.
- id: 219
  category: signs_and_signals
  question: 'If an emergency vehicle with flashing lights is traveling in the area
    where you are driving, you should:'
  choices:
    A: Speed up to avoid the emergency vehicle.
    B: Stop your vehicle immediately and prevent them from passing.
    C: Make every effort to give the emergency vehicle a clear path of travel.
    D: Signal to the emergency vehicle when it is clear for them to pass you.
  answer: C
  explanation: If an emergency vehicle with flashing lights is traveling in the area
    where you are driving, you must make every effort to give them a clear path of
    travel. If it is safe to do so, pull your vehicle to the side of the road to give
    the emergency vehicle an open pathway.
- id: 220
  category: safe_driving_rules
  question: 'If you want to get off the freeway but you have missed your exit, you
    should:'
  choices:
    A: Go to the next exit.
    B: Make a U-turn through the median.
    C: Pull onto the shoulder and back your car to the exit.
    D: Flag down a police officer for an escort back to your exit.
  answer: A
  explanation: If you miss your exit, you should take the next exit. Do not stop or
    back up on the highway, swerve across multiple lanes to try to make the exit at
    the last second, or cross over the median to turn around. All of these maneuvers
    are illegal and extremely dangerous.
- id: 221
  category: safe_driving_rules
  question: Which of the following statements is true?
  choices:
    A: Signal at least 100 feet before changing lanes to pass and ensure there is
      no oncoming traffic.
    B: Use your mirrors and look over your left shoulder to check your blind spot
      when passing to the left.
    C: When passing, wait until you can see both headlights of the passed car in your
      rearview mirror before returning to your original lane.
    D: All of the above.
  answer: D
  explanation: When passing, you must always signal at least 100 feet in advance of
    your lane change. Always check behind you in your mirrors and look over your shoulder
    to check your blind spot. Wait until you can see both headlights of the passed
    car in your rearview mirror before returning to your original lane.
- id: 222
  category: safe_driving_rules
  question: At a four-way stop intersection in New Jersey, who has the right-of-way?
  choices:
    A: The driver to arrive first has the right-of-way.
    B: The driver to arrive last has the right-of-way.
    C: One driver should continue driving without stopping.
    D: One driver should wave the other drivers ahead.
  answer: A
  explanation: At four-way stops, traffic from all four directions must stop. The
    first vehicle to reach the intersection should move forward first. If two vehicles
    reach the intersection at the same time, the driver on the left yields to the
    driver on the right.
- id: 223
  category: safe_driving_rules
  question: 'You may drink alcoholic beverages in a vehicle on a public highway:'
  choices:
    A: As long as you aren't driving.
    B: If you are riding in the back seat.
    C: If you are riding in the back of a pick-up truck.
    D: Under no circumstances.
  answer: D
  explanation: It is against the law to consume or possess any alcoholic beverage
    while on a public road or sidewalk. Additionally, storing an open alcoholic beverage
    container in an area of a motor vehicle normally occupied by the driver or passenger
    is prohibited on any public road.
- id: 224
  category: safe_driving_rules
  question: 'When making a right turn on a green light, you must:'
  choices:
    A: Maintain your normal driving speed.
    B: Stop and look for nearby police cars.
    C: Yield to pedestrians.
    D: Increase your normal driving speed.
  answer: C
  explanation: Unless a posted sign prohibits it, you may turn right or left at a
    steady green light. When turning, you must yield to other vehicles and pedestrians
    within the intersection.
- id: 225
  category: vehicle_information
  question: 'Hydroplaning is usually caused by:'
  choices:
    A: Excessive stops.
    B: Sudden stops.
    C: Sudden turns.
    D: Excessive speed.
  answer: D
  explanation: Your tires become less effective at clearing water from the road as
    you increase your speed. If you drive too fast, they may lose their grip entirely,
    leaving the vehicle sliding on a film of water. This is known as "hydroplaning."
- id: 226
  category: signs_and_signals
  question: 'Traffic signs and pavement markings:'
  choices:
    A: Must always be obeyed.
    B: Are merely suggestions.
    C: Must be followed only when there is other traffic.
    D: Must be followed only when a police officer is present.
  answer: A
  explanation: Traffic flow is controlled by pavement markings, traffic islands, signals,
    and signs. These devices inform drivers of conditions on the roadway and help
    guide drivers safely to their destinations. You must always obey traffic signs,
    signals, and pavement markings.
- id: 227
  category: signs_and_signals
  question: What do crossbuck signs indicate?
  choices:
    A: Railroad crossings.
    B: School zones.
    C: No passing zones.
    D: Hospitals.
  answer: A
  explanation: Crossbuck signs tell drivers to yield to trains at a railroad crossing.
    Drivers should not try to outdrive a train.
- id: 228
  category: defensive_driving
  question: 'When driving on slippery roads, you should:'
  choices:
    A: Use alternate routes.
    B: Drive as you would on dry roads.
    C: Increase your following distance.
    D: Avoid crossing bridges or intersections.
  answer: C
  explanation: On slippery roads, you should increase your following distance. It
    may take more time to stop your vehicle than it would under normal conditions.
- id: 229
  category: safe_driving_rules
  question: Who must yield when a driver is turning and a pedestrian is crossing without
    a traffic light?
  choices:
    A: Whoever started moving last
    B: The driver
    C: Whoever is slower
    D: The pedestrian
  answer: B
  explanation: Drivers must yield to pedestrians when they are crossing at any intersection
    without a traffic light, whether or not there is a crosswalk.
- id: 230
  category: alcohol_drugs_health
  question: What kinds of drugs can affect your driving ability?
  choices:
    A: Allergy medicine
    B: Marijuana
    C: 'Cold remedies '
    D: All of these choices
  answer: D
  explanation: Many kinds of drugs can impair your ability to drive. This includes
    illegal drugs and legal prescription or over-the-counter medications. It can be
    a criminal offense to drive while impaired by any drug.
- id: 231
  category: vehicle_information
  question: 'Your blind spot is the area of the road:'
  choices:
    A: You cannot see without moving your head.
    B: Directly behind your vehicle.
    C: You see in your rearview mirror.
    D: You see in your side mirror.
  answer: A
  explanation: Blind spots are areas that a driver cannot see without moving their
    head. They can be located to the sides of and behind a vehicle.
- id: 232
  category: safe_driving_rules
  question: 'You come to an intersection that is blocked by other traffic. You should:'
  choices:
    A: Go slowly until the traffic ahead moves.
    B: Get as close as possible to the car in front of you.
    C: Stay out of the intersection until you can pass through.
    D: Sound your horn to make the cars move up.
  answer: C
  explanation: You cannot enter an intersection if traffic is backed up on the other
    side and you cannot get completely through the intersection. Wait until traffic
    ahead clears so you do not block the intersection.
- id: 233
  category: signs_and_signals
  question: 'A yellow diamond-shaped sign showing a traffic light symbol indicates:'
  choices:
    A: Continue at your current speed.
    B: You must stop ahead.
    C: Speeding is not allowed.
    D: There is a traffic signal ahead.
  answer: D
  explanation: A yellow warning sign with a traffic signal symbol alerts drivers that
    there is a traffic signal ahead. Be prepared to stop.
- id: 234
  category: defensive_driving
  question: 'Your first response to reduced visibility should be:'
  choices:
    A: Turning on your headlights.
    B: Reducing your speed.
    C: Turning on your windshield wipers.
    D: Looking for road edge markings to guide you.
  answer: B
  explanation: Reducing your speed should be your first response to decreased visibility
    and dangerous road conditions.
- id: 235
  category: safe_driving_rules
  question: 'Two solid white lines painted across a traffic lane show the boundaries
    of a crosswalk. As a driver, you should know that:'
  choices:
    A: Motor vehicles have the right-of-way over pedestrians in crosswalks.
    B: When pedestrians are in crosswalks, they should be given the right-of-way.
    C: No one has the right-of-way in a crosswalk.
    D: Pedestrians are responsible to stay out of the way of all traffic.
  answer: B
  explanation: Crosswalk lines show pedestrians where to safely cross a road or street.
    Crosswalks may be marked by horizontal lines, vertical lines, or a combination
    of the two. You must always stop for pedestrians who are in a crosswalk.
- id: 236
  category: safe_driving_rules
  question: 'You must yield to other drivers:'
  choices:
    A: When entering a street from a garage or alley.
    B: When they are on a road to your left and you have reached an unmarked intersection
      at the same time.
    C: When your traffic signal is a green arrow.
    D: All of the above.
  answer: A
  explanation: You must yield to other drivers when entering a street from an alley,
    driveway, or garage. You must also yield to pedestrians who are on an intersecting
    sidewalk.
- id: 237
  category: safe_driving_rules
  question: 'You must yield for emergency vehicles:'
  choices:
    A: 'Under no circumstances. '
    B: When you see a flashing red or blue light or hear a siren.
    C: Only when other vehicles yield.
    D: None of the above.
  answer: B
  explanation: You must yield the right-of-way to any emergency vehicle that is using
    its siren or flashing lights.
- id: 238
  category: safe_driving_rules
  question: 'A driver entering public traffic from a driveway or private road:'
  choices:
    A: Has the right-of-way.
    B: Should yield to drivers already on the public road.
    C: May force their way into traffic.
    D: Can assume that other drivers will change lanes to make room.
  answer: B
  explanation: If you are entering traffic from a driveway or private road, you should
    yield to drivers already on the public road. Merge safely into traffic when you
    are able to do so.
- id: 239
  category: safe_driving_rules
  question: You have the right-of-way when turning left on which of the following
    traffic signals?
  choices:
    A: A solid green light
    B: A flashing yellow light
    C: A green arrow pointing left
    D: A flashing red light
  answer: C
  explanation: A green steady arrow means you may pass through the intersection in
    the direction that the arrow is pointing. Oncoming traffic is required to stop
    for turning traffic.
- id: 240
  category: safe_driving_rules
  question: Which is not a factor in determining the distance that it takes to stop
    your vehicle?
  choices:
    A: Steering ability
    B: Braking distance
    C: Reaction distance
    D: Perception time
  answer: A
  explanation: The distance required to stop your vehicle depends on perception time,
    reaction distance, and braking distance. This changes with speed and road conditions.
- id: 241
  category: safe_driving_rules
  question: What does a speed restriction sign show?
  choices:
    A: May be ignored in rainy, snowy, or icy conditions.
    B: Has a triangular shape.
    C: Is blue with black lettering.
    D: Shows a recommended speed for a curve or turn.
  answer: D
  explanation: Curve and turn warning signs often have attached advisory speed signs
    that show a recommended driving speed for drivers in the curves and turns. Although
    a driver may feel comfortable driving at a higher speed in fair weather, they
    should never do so under rainy, snowy, or icy conditions.
- id: 242
  category: safe_driving_rules
  question: 'The amount of space you need to cross traffic depends on the:'
  choices:
    A: Road conditions, weather conditions, and oncoming traffic.
    B: Presence of a stop sign.
    C: Use of your turn signals.
    D: Cars behind you.
  answer: A
  explanation: The amount of space you need to cross traffic depends on the road conditions,
    weather conditions, and oncoming traffic.
- id: 243
  category: safe_driving_rules
  question: Under New Jersey law, in which situations are you prohibited from passing
    another vehicle?
  choices:
    A: On a hill or curve.
    B: When school bus lights are flashing.
    C: When approaching an intersection.
    D: All of the above.
  answer: D
  explanation: You should never pass if there is an oncoming vehicle in the passing
    lane, if your view is blocked by a curve or hill, at an intersection, before or
    on a railroad crossing or bridge, or in any other no passing zone. Unless you
    are on the opposite side of a multilane roadway with a median or shared center
    turn lane, you may not pass a stopped school bus that has its flashing red lights
    activated.
- id: 244
  category: safe_driving_rules
  question: 'If a flagger is directing traffic in a construction zone, you must:'
  choices:
    A: Follow the directions given by the flagger.
    B: Copy what surrounding traffic is doing, despite the flagger's instructions.
    C: Assume the flagger is not supposed to be directing traffic.
    D: 'Follow the laws that would be in place if the area was not under construction. '
  answer: A
  explanation: Be prepared to reduce your speed and use caution when directed to do
    so by a sign, flagger, or law enforcement officer. Failure to do so is illegal
    and is dangerous to those working in construction zones.
- id: 245
  category: sharing_the_road
  question: 'When you see or hear an emergency vehicle coming, you should:'
  choices:
    A: Stop immediately and let the vehicle pass.
    B: Drive as far toward the right side of the road as is safe and stop.
    C: Proceed slowly and permit the vehicle to pass.
    D: Keep moving slowly, staying to the right side of the road.
  answer: B
  explanation: When driving on a two-lane roadway or undivided highway, you must yield
    to an emergency vehicle using its lights and/or siren, regardless of the direction
    from which it is approaching. Immediately drive as near as possible to the right
    side of the road and stop, taking care not to stop within an intersection.
- id: 246
  category: safe_driving_rules
  question: 'You are coming to an intersection and have a green light. Pedestrians
    are crossing against the red. You should:'
  choices:
    A: Honk your horn.
    B: Speed up and pass in front of the pedestrians.
    C: Stop to let the pedestrians cross safely.
    D: Drive close to the pedestrians and frighten them so they’ll think twice before
      crossing against a red light.
  answer: C
  explanation: Yield to pedestrians and cars that may be caught in an intersection
    when you have a green light. Be careful around pedestrians under every circumstance.
- id: 247
  category: safe_driving_rules
  question: What is the correct procedure to enter a freeway in New Jersey?
  choices:
    A: Signal, yield to existing traffic, and enter at the same speed that traffic
      is moving.
    B: Signal and enter the freeway. Freeway traffic must yield.
    C: Drive slowly so you can check traffic.
    D: Always come to a complete stop first.
  answer: A
  explanation: When merging into traffic, you should signal and enter at the same
    speed that traffic is moving. Always yield to other traffic when entering a roadway.
- id: 248
  category: defensive_driving
  question: 'Driving at night requires increased caution because:'
  choices:
    A: Traffic moves faster at night.
    B: There is a larger volume of traffic at night.
    C: Drivers cannot see as well at night.
    D: Accidents occur more frequently at night.
  answer: C
  explanation: Because it is dark, drivers cannot see as well at night as they can
    during the day. From one half hour after sunset until one half hour before sunrise,
    or at any other time when persons or vehicles are not visible for 500 feet, drivers
    must use their headlights.
- id: 249
  category: penalties_and_points
  question: 'Failing to adhere to restrictions placed on a Graduated Driver License:'
  choices:
    A: Is not a big deal.
    B: Will result only in points against the driver's license.
    C: Will result in no negative consequences.
    D: May result in a fine and license suspension.
  answer: D
  explanation: A first-time driver with a Graduated Driver License (GDL) must adhere
    to strict driving restrictions. Failing to follow these restrictions may result
    in a fine of $100 and suspension of the GDL.
- id: 250
  category: safe_driving_rules
  question: When two vehicles enter an intersection from different highways at the
    same time, which vehicle must yield the right-of-way?
  choices:
    A: Either one
    B: The vehicle on the left
    C: The vehicle on the right
    D: Neither
  answer: B
  explanation: At intersections that are controlled by signs or signals and at intersections
    that are uncontrolled, the driver on the left must yield the right-of-way to the
    driver on the right when two vehicles arrive to the intersection at the same time.
- id: 251
  category: safe_driving_rules
  question: 'Traffic signals sometimes display arrows to control turns from specific
    lanes. A green arrow:'
  choices:
    A: Is used only on one-way streets.
    B: Has the same meaning as a circular green traffic light, but traffic must turn
      in the direction indicated by the arrow.
    C: Means that you may proceed, but only if the green arrow is accompanied by a
      circular green light.
    D: Points the way to an airport.
  answer: B
  explanation: A green arrow has the same meaning as a circular green traffic light,
    but traffic in the indicated lane must turn in the direction shown by the arrow.
- id: 252
  category: safe_driving_rules
  question: Lanes of traffic moving in opposite directions are divided by ____ lines.
  choices:
    A: White
    B: Red
    C: Black
    D: Yellow
  answer: D
  explanation: Yellow lines are used to divide traffic moving in opposite directions.
- id: 253
  category: defensive_driving
  question: How can you lower the risk of hydroplaning?
  choices:
    A: Do not speed when the roads are wet.
    B: Use tires with proper air pressure.
    C: Replace tires with bad tread.
    D: All of the above.
  answer: D
  explanation: Hydroplaning happens when a vehicle glides on top of a thin layer of
    water between its tires and the road. Tires with low air pressure or bad tread
    can increase the risk of hydroplaning. Speeding also increases the risk.
- id: 254
  category: signs_and_signals
  question: 'To reduce the effects of headlight glare at night, you should look:'
  choices:
    A: Straight ahead.
    B: Over your shoulder.
    C: At the center of the road
    D: To the right edge of the road.
  answer: D
  explanation: If oncoming drivers do not dim their headlights for you, keep your
    eyes on the right side of the road ahead. Do not look directly at the oncoming
    headlights because the glare may blind you for several seconds.
- id: 255
  category: safe_driving_rules
  question: 'You must stop at an intersection when you see a:'
  choices:
    A: Flashing red light.
    B: Steady yellow light.
    C: Yellow arrow.
    D: Flashing yellow light.
  answer: A
  explanation: A flashing red traffic signal has the same meaning as a stop sign.
    At an intersection with a flashing red light, you must come to a complete stop,
    look both ways, and proceed only after the intersection is clear.
- id: 256
  category: alcohol_drugs_health
  question: 'The effect that alcohol has on your reflexes and judgment:'
  choices:
    A: Is less pronounced when consuming beer instead of wine.
    B: Is less pronounced when consuming wine instead of beer.
    C: Is most pronounced when consuming hard ciders and mixed drinks.
    D: Depends on the amount of alcohol in your bloodstream.
  answer: D
  explanation: Consuming any type of alcohol can have negative effects on your reflexes
    and judgment. It does not matter which type of alcohol is consumed, only how much
    alcohol has entered a person's bloodstream.
- id: 257
  category: vehicle_information
  question: To register a vehicle in New Jersey, you must be age ____ or older.
  choices:
    A: '17'
    B: '25'
    C: '18'
    D: '21'
  answer: A
  explanation: To register a motor vehicle in New Jersey, you must be at least 17
    years old. You must have proof of identity and proof of vehicle ownership.
- id: 258
  category: vehicle_information
  question: 'Your tire blows out while you are driving. You should:'
  choices:
    A: Slam on your brakes.
    B: Hold your steering wheel tightly and slow to a stop.
    C: Keep driving normally.
    D: Turn on your emergency flashers and continue driving.
  answer: B
  explanation: If you experience a tire blowout, do not immediately apply the brakes.
    Grip the steering wheel firmly and steer to remain in your traffic lane. Reduce
    your speed gradually by releasing the accelerator and staying off the brakes.
    Once you are moving very slowly, apply the brakes lightly and pull off the road
    into a safe area.
- id: 259
  category: defensive_driving
  question: 'Increase your following distance when:'
  choices:
    A: Driving behind a large vehicle that blocks your vision.
    B: Exiting an expressway.
    C: Following a motorcycle.
    D: All of the above.
  answer: D
  explanation: You should increase your following distance when you are behind a large
    vehicle that blocks your vision, when driving in bad weather or heavy traffic,
    when exiting an expressway, when behind a motorcycle or bicycle, and if someone
    is tailgating you.
- id: 260
  category: safe_driving_rules
  question: 'The driver''s left arm and hand are extended downward. This hand signal
    means that the driver plans to:'
  choices:
    A: Turn left.
    B: Turn right.
    C: Stop.
    D: Start up.
  answer: C
  explanation: If a driver's left arm and hand are extended downward, they are indicating
    that they intend to stop. Adjust your driving accordingly if following a driver
    who is using this hand signal.
- id: 261
  category: signs_and_signals
  question: 'You may not cross a single broken white or yellow line:'
  choices:
    A: When doing so would interfere with traffic.
    B: When turning left into a driveway.
    C: When the car in front of you is disabled.
    D: When passing to the right on a one-way street.
  answer: A
  explanation: You may cross a single broken line to pass or change lanes as long
    as you can do so safely and without interfering with traffic.
- id: 262
  category: safe_driving_rules
  question: 'To ensure that your physical condition does not cause you to drive in
    an unsafe manner, you should:'
  choices:
    A: Keep physically fit and have regular physical examinations.
    B: Know the effect of any medicine on your driving ability.
    C: Drive within your physical limitations.
    D: All of the above.
  answer: D
  explanation: Your physical condition has an important bearing on your ability to
    drive safely. Drivers should be aware of their physical limitations and only drive
    if it is safe to do so.
- id: 263
  category: signs_and_signals
  question: 'Signs that are colored orange are:'
  choices:
    A: Work zone signs.
    B: Regulatory signs.
    C: School zone signs.
    D: Guide signs.
  answer: A
  explanation: Highway work zones are established according to the type of work underway
    along the roadway. Signs in work areas are typically diamond-shaped, orange, have
    black letters or symbols, and serve as a warning that people are working on or
    near the highway.
- id: 264
  category: vehicle_information
  question: 'When riding in a vehicle, small children:'
  choices:
    A: May be safely held by a strong adult.
    B: Will be safe if they are standing on the floor in the back of the vehicle.
    C: Will not be hurt in an accident because they are small.
    D: Must never be allowed to ride while standing in the vehicle.
  answer: D
  explanation: Special child seats are available for children who are too small to
    wear regular safety belts. No person is strong enough to safely hold onto a child
    of any size during an accident or sudden stop. Never allow a child to ride in
    a vehicle unless they are properly fastened into a seat.
- id: 265
  category: vehicle_information
  question: 'Allowing a space cushion between your vehicle and its surroundings is
    important because it:'
  choices:
    A: Prevents distractions from other vehicles.
    B: Allows you time to react to unexpected situations.
    C: Keeps traffic flowing at a safe pace.
    D: Keeps other drivers alert.
  answer: B
  explanation: The only way to be sure you will have enough time to react to mistakes
    made by other drivers is to leave plenty of space between you and the vehicles
    around you.
- id: 266
  category: safe_driving_rules
  question: 'You must pull over to the edge of the road and allow an emergency vehicle
    to pass:'
  choices:
    A: Regardless of your direction.
    B: Only if it is following you.
    C: Only if it is approaching you from the opposite direction.
    D: None of the above.
  answer: A
  explanation: You must pull over to the right edge of the road and stop for an emergency
    vehicle with flashing lights, regardless of whether it is approaching you from
    behind or from the opposite direction.
- id: 267
  category: alcohol_drugs_health
  question: 'To avoid carbon monoxide poisoning, drivers should:'
  choices:
    A: Have their exhaust system checked regularly to be sure it does not leak.
    B: Keep their engine turned off when the car is in an enclosed garage.
    C: Close vents when following closely behind another car.
    D: All of the above.
  answer: D
  explanation: Carbon monoxide fumes are odorless and deadly. Symptoms of carbon monoxide
    poisoning are sudden weariness, yawning, dizziness, and nausea. The only cure
    is an adequate supply of fresh air.
- id: 268
  category: safe_driving_rules
  question: 'The driver''s left arm and hand are extended upward. This hand signal
    means that the driver plans to:'
  choices:
    A: Turn left.
    B: Turn right.
    C: Come to a stop.
    D: Go straight ahead.
  answer: B
  explanation: If a driver's left arm and hand are extended upward, they are indicating
    that they intend to turn right. Adjust your driving accordingly if following a
    driver who is using this hand signal.
- id: 269
  category: safe_driving_rules
  question: 'When changing lanes you should not:'
  choices:
    A: Check your side and rearview mirrors.
    B: Give a turn signal to signal your intentions.
    C: Check for other drivers who may be moving into the same lane as you.
    D: Use your cell phone to contact the police to determine if the road ahead is
      clear.
  answer: D
  explanation: Before changing lanes, check your side and rearview mirrors for traffic
    approaching you from behind. Use your turn signal to let other drivers know you
    plan to change lanes. Check for other drivers who also may be moving into the
    same lane.
- id: 270
  category: sharing_the_road
  question: 'A slow-moving vehicle emblem is:'
  choices:
    A: A rectangular red sign.
    B: A circular green sign.
    C: A diamond-shaped yellow sign.
    D: A triangular orange sign.
  answer: D
  explanation: The slow-moving vehicle symbol is a reflective orange triangle. Expect
    vehicles using this emblem to be driving at speeds of 25 mph or slower.
- id: 271
  category: vehicle_information
  question: If a vehicle using high beams comes toward you, you should look toward
    ____ of the road.
  choices:
    A: Either side
    B: The center
    C: The right side
    D: The left side
  answer: C
  explanation: If a vehicle approaching you is using its high beams and fails to dim
    them, you should glance toward the right side of the road. This will keep you
    from being blinded by the other vehicle’s headlights and will allow you to see
    well enough to stay on your course until the vehicle passes.
- id: 272
  category: safe_driving_rules
  question: 'The correct way to use a freeway exit ramp is to:'
  choices:
    A: Slow down before entering the exit ramp.
    B: Slow down once moving onto the exit ramp.
    C: Keep your speed constant once in the exit ramp.
    D: Pass slower traffic in the exit ramp.
  answer: B
  explanation: When using a freeway exit ramp, do not slow down until you move onto
    the exit ramp.
- id: 273
  category: vehicle_information
  question: 'Snow and ice on a vehicle should be removed from:'
  choices:
    A: The vehicle's windows.
    B: The vehicle's hood.
    C: The top of the vehicle.
    D: All of the above.
  answer: D
  explanation: State law requires motorists to remove all snow and ice from their
    vehicle before driving it. Fines may apply to drivers who do not follow this law.
- id: 274
  category: safe_driving_rules
  question: 'You may continue carefully through an intersection with a yellow light
    if:'
  choices:
    A: There is an emergency vehicle crossing your lane.
    B: There are pedestrians crossing.
    C: You are turning right.
    D: You are already within the intersection when the light changes to yellow.
  answer: D
  explanation: If a steady yellow light appears when you are already within an intersection,
    you should continue through the intersection carefully.
- id: 275
  category: safe_driving_rules
  question: 'You are approaching an intersection when the traffic light changes from
    green to solid yellow. You should:'
  choices:
    A: Consider it the same as a caution sign and continue through the intersection.
    B: Stop immediately.
    C: Stop before entering the intersection, unless you are too close to stop safely.
    D: Speed up to get through the intersection before the red light appears.
  answer: C
  explanation: When approaching an intersection with a solid yellow traffic light,
    slow to a stop before entering the intersection, if it is safe to do so. If you
    can't stop safely, drive carefully through the intersection.
- id: 276
  category: signs_and_signals
  question: 'You may cross solid yellow lines:'
  choices:
    A: To pass traffic moving in the same direction.
    B: During daylight hours only.
    C: At any time.
    D: When making turns.
  answer: D
  explanation: As a general rule, broken traffic lines may be crossed but solid lines
    may not. Solid yellow lines may be crossed only when the driver is making a turn.
- id: 277
  category: defensive_driving
  question: 'When driving in rain, you must:'
  choices:
    A: Use low beam headlights.
    B: Use high beam headlights.
    C: Use parking lights.
    D: Use no lights.
  answer: A
  explanation: In rainy conditions, you should use your low beam headlights.
- id: 278
  category: vehicle_information
  question: Who is required to wear a seat belt in a moving motor vehicle?
  choices:
    A: Just the driver
    B: Just adult passengers
    C: Just child passengers
    D: All occupants of the motor vehicle
  answer: D
  explanation: Under state law, the driver and all passengers of a passenger vehicle
    must wear a seat belt. The failure of a driver, front seat passenger, or child
    under age 18 to wear a seat belt is a primary offense. The driver is responsible
    for all passengers under age 18. Under a secondary law, all unbuckled back seat
    occupants 18 years of age and older may be issued a summons if the vehicle has
    been stopped for a different reason.
- id: 279
  category: alcohol_drugs_health
  question: 'If you are driving so slowly that traffic is backing up behind you, you
    should:'
  choices:
    A: Decrease your speed.
    B: Pull off the right side of the road and let traffic pass.
    C: Not let the other cars pass your vehicle.
    D: Use your four-way flashers.
  answer: B
  explanation: Driving more slowly than the flow of traffic can be hazardous. If you
    are on a two-lane, two-way road and driving so slowly that traffic is backing
    up behind you, you are required to pull off the road and let the other vehicles
    pass. Only drive significantly under the speed limit when conditions require it.
- id: 280
  category: alcohol_drugs_health
  question: What is a potential danger of a leaking exhaust system?
  choices:
    A: Cause excessive oil use.
    B: Require your vehicle to have a tune-up sooner than normal.
    C: Make you drowsy while driving.
    D: Set grass fires on country roads.
  answer: C
  explanation: The exhaust system helps remove toxic gases, reduce the noise, and
    cool the hot gases coming from a running engine. Fumes from a leaky exhaust system
    can cause death in a very short time. They can also make you drowsy while driving.
- id: 281
  category: safe_driving_rules
  question: A tractor-trailer could take up to ____ percent longer to stop under poor
    weather conditions than under ideal driving conditions.
  choices:
    A: '10'
    B: '25'
    C: '40'
    D: '55'
  answer: B
  explanation: When driving near a tractor-trailer, be aware of how its size will
    affect the way it is driven. Under poor weather conditions, the larger vehicle
    may take up to 25 percent longer to come to a complete stop than it would if being
    driven under ideal conditions.
- id: 282
  category: safe_driving_rules
  question: 'When driving near heavy trucks, other drivers and highway users must
    make allowances for:'
  choices:
    A: The increased stopping distance required by large vehicles.
    B: The decreased stopping distance required by large vehicles.
    C: The decreased noise of larger vehicles.
    D: The increased speed of larger vehicles.
  answer: A
  explanation: When driving near heavy trucks, other drivers and highway users must
    make allowances for the increased stopping distance required by the large vehicles.
    Drivers of smaller vehicles should remain in locations where they can be seen
    by the driver of the large vehicle and where their view of traffic is not blocked
    by the vehicle.
- id: 283
  category: safe_driving_rules
  question: 'Vehicle stopping distances never depend on:'
  choices:
    A: Your own reaction time.
    B: The time of day.
    C: The condition of your vehicle's brakes.
    D: The condition and type of your vehicle's tires.
  answer: B
  explanation: The distance that a vehicle needs to stop depends on the motorist's
    reaction time, weather and visibility conditions, the vehicle's weight, the conditions
    of the vehicle's brakes, the condition and type of the vehicle's tires, roadway
    conditions, and speed.
- id: 284
  category: sharing_the_road
  question: 'A bicyclist who doesn’t obey traffic laws:'
  choices:
    A: Is in the right because bicyclists don’t have to obey traffic laws.
    B: Can be ticketed.
    C: Will always receive a warning from law enforcement.
    D: Will have their bicycle impounded.
  answer: B
  explanation: All bicyclists have the same rights, duties, and responsibilities as
    drivers of motor vehicles. Motorists and bicyclists who do not obey traffic laws
    can be ticketed.
- id: 285
  category: safe_driving_rules
  question: What color are pavement markings that separate traffic lanes moving in
    opposite direction?
  choices:
    A: Yellow
    B: White
    C: Yellow and white
    D: Yellow, white, and black
  answer: A
  explanation: Yellow lines are used in the center of the road to separate lanes of
    traffic moving in opposite directions.
- id: 286
  category: signs_and_signals
  question: 'Downward-facing triangular signs:'
  choices:
    A: Indicate school zones.
    B: Tell drivers to yield.
    C: Indicate construction zones.
    D: Indicate railroad crossings.
  answer: B
  explanation: Downward-facing triangular signs usually indicate that drivers should
    yield. Once the road is clear of traffic or pedestrians and it is safe to do so,
    drivers may proceed.
- id: 287
  category: vehicle_information
  question: 'To avoid collisions with vehicles in your blind spots, you should:'
  choices:
    A: Quickly turn your head to see if your blind spot is clear before changing lanes.
    B: Adjust your rearview mirrors every few minutes.
    C: Honk your horn right before turning or changing lanes.
    D: None of the above.
  answer: A
  explanation: Before turning or changing lanes, turn your head and glance over your
    shoulder in the direction of your move to see if your blind spot is clear. Never
    rely on your mirrors alone.
- id: 288
  category: safe_driving_rules
  question: 'When you are in a line of traffic that is crossing a railroad track that
    has no signals or gates:'
  choices:
    A: You have the right-of-way and do not need to check for trains.
    B: You may pass slower drivers while crossing the track.
    C: You need to make sure there is space for your vehicle to get all the way across
      the tracks without stopping.
    D: All of the above
  answer: C
  explanation: If you are following another vehicle at a railroad crossing, check
    to make sure you have enough room to get all the way across before you drive onto
    the tracks. You should never try to pass another vehicle as you approach or cross
    a railroad crossing. Always check for trains before crossing any railroad tracks.
- id: 289
  category: signs_and_signals
  question: 'When you see a red octagonal (eight-sided) sign, you must:'
  choices:
    A: Stop completely and check for pedestrians and cross traffic.
    B: Slow down without coming to a complete stop.
    C: Stop completely and wait for a green light.
    D: Slow down and check for traffic.
  answer: A
  explanation: Any eight-sided (octagonal) sign is a stop sign. At an intersection
    with a stop sign, you must stop completely and check for pedestrians and cross
    traffic in the intersection. Wait for the intersection to clear before proceeding.
- id: 290
  category: safe_driving_rules
  question: 'To turn left from multilane, one-way streets and highways, you should
    start from:'
  choices:
    A: The middle of the intersection.
    B: The right lane.
    C: The left lane.
    D: Any lane.
  answer: C
  explanation: To turn left from multilane streets and highways, start from the left
    lane.
- id: 291
  category: safe_driving_rules
  question: What is true about a work zone in New Jersey?
  choices:
    A: May be moving or stationary.
    B: Is marked with black and white signs.
    C: Does not require a driver to slow down and pay extra attention.
    D: All of the above.
  answer: A
  explanation: Work zones are often stationary, but they may also be present in the
    form of moving vehicles striping lines, mowing, or removing snow. Work zones are
    marked by orange signs with black lettering or symbols. Slow down and pay extra
    attention when approaching or driving through a work zone.
- id: 292
  category: safe_driving_rules
  question: 'When approaching a traffic signal displaying a flashing yellow arrow,
    drivers:'
  choices:
    A: Should merge into a lane in the direction of the arrow.
    B: Should come to a complete stop.
    C: May turn left after yielding to oncoming traffic and pedestrians.
    D: Have the right-of-way and may expect oncoming traffic to stop for them.
  answer: C
  explanation: A flashing yellow arrow indicates that left turns are allowed in the
    direction of the arrow. However, the oncoming traffic has a green light and you
    must yield to oncoming traffic and pedestrians.
- id: 293
  category: safe_driving_rules
  question: 'If two vehicles arrive to an uncontrolled intersection at the same time:'
  choices:
    A: The largest vehicle has the right-of-way.
    B: The car on the left has the right-of-way.
    C: The car on the left shall yield to the car on the right.
    D: The car on the right shall yield to the car on the left.
  answer: C
  explanation: If two vehicles arrive at the same time to an uncontrolled intersection,
    the driver on the left must yield to the driver on the right. The driver on the
    left may then proceed when it is safe to do so.
- id: 294
  category: signs_and_signals
  question: Guide signs are ____ signs that provide directional and mileage information
    to drivers.
  choices:
    A: Yellow
    B: Red
    C: Green
    D: White
  answer: C
  explanation: Guide signs, sometimes known as destination signs, have a green background
    and provide directional and mileage information to specific destinations. They
    can be a helpful resource when driving in unfamiliar locations.
- id: 295
  category: safe_driving_rules
  question: Is it legal cross a double solid yellow centerline to pass?
  choices:
    A: Yes.
    B: No.
    C: If there is no oncoming traffic.
    D: If the vehicle ahead of you is driving under the speed limit.
  answer: B
  explanation: Two solid yellow lines down the center of a two-way road mean that
    neither lane of traffic may cross the lines, unless they are turning off of the
    roadway. A driver can cross double yellow lines when turning into or out of a
    driveway or entrance to a business. No passing is allowed over a solid yellow
    line.
- id: 296
  category: safe_driving_rules
  question: 'As you drive, you''re required to stop your vehicle:'
  choices:
    A: At an intersection with a stop sign.
    B: Where there is a red light.
    C: When a traffic officer orders you to stop.
    D: All of the above.
  answer: D
  explanation: Situations where motorists are required to stop include approaching
    intersections with stop signs, approaching intersections where a red light is
    either flashing or illuminated, or any time when a traffic officer orders your
    vehicle to stop.
- id: 297
  category: penalties_and_points
  question: 'MVC may terminate your road test before it begins if:'
  choices:
    A: 'You brought an unsafe testing vehicle. '
    B: A center console or other equipment in your vehicle obstructs their access
      to the brake pedal.
    C: Your vehicle is missing seat belts.
    D: 'All of the above. '
  answer: D
  explanation: A road test may be denied before it begins if the examiner considers
    your prospective testing vehicle unsafe or unsuitable. The vehicle may be considered
    unsafe if it is missing seat belts and if the examiner cannot access the foot
    brake or parking brake.
- id: 298
  category: defensive_driving
  question: 'If someone is driving aggressively behind you, you should:'
  choices:
    A: Try to get out of the aggressive driver’s way.
    B: Stare at the driver as he or she is passing you.
    C: Speed up as he or she is passing you.
    D: Block the passing lane.
  answer: A
  explanation: If you encounter an aggressive driver, you should make every attempt
    to get out of their way. You should avoid making eye contact with a hostile driver.
    Challenging a hostile driver by speeding up may only make them angrier, thereby
    increasing their danger.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 299
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 300
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 301
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 302
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 303
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 304
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 305
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 306
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 307
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 308
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 309
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 310
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 311
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 312
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 313
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 314
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 315
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 316
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 317
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 318
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 319
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 320
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 321
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 322
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 323
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 324
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 325
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 326
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 327
- image: cross_road.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: A railroad crossing ahead
    B: A crossroad or intersection ahead
    C: A hospital ahead
    D: A pedestrian crossing
  answer: B
  explanation: This sign warns that a crossroad or 4-way intersection is ahead. Watch
    for traffic entering from side roads.
  id: 328
- image: side_road.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A T-intersection ahead
    B: A side road entering from the right
    C: A curve in the road
    D: A dead end
  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles
    entering the highway from the side road.
  id: 329
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Lanes are merging
    B: A lane is ending
    C: A new lane is being added — no merging needed
    D: Right turn required
  answer: C
  explanation: An added lane sign means a new lane is joining the highway without
    requiring merging. Traffic entering from the ramp has its own new lane.
  id: 330
- image: no_parking.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Stopping at any time
    B: Parking in this area
    C: Standing or idling
    D: Loading or unloading
  answer: B
  explanation: A red and white NO PARKING sign means you cannot park your vehicle
    in this area. You may briefly stop to load or unload passengers.
  id: 331
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 332
