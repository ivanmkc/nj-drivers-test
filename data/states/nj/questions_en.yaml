metadata:
  source: 2025 New Jersey Driver Manual (www.njmvc.gov)
  total_questions: 332
  passing_score: 80% (40 out of 50 on the actual MVC test)
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: What must a New Jersey motorist carry while operating a motor vehicle?
  choices:
    A: Only a valid driver license
    B: A valid driver license, valid insurance, and vehicle registration cards
    C: A valid driver license and vehicle registration only
    D: A valid driver license and proof of address
  answer: B
  explanation: A motorist must carry a valid driver license (or permit), valid insurance,
    and vehicle registration cards. (N.J.S.A. 39:3-29)
- id: 2
  category: license_system
  question: How soon must a motorist report a change of address to the MVC?
  choices:
    A: Within 30 days
    B: Within two weeks
    C: Within one week
    D: Within 60 days
  answer: C
  explanation: A motorist who changes addresses must report the change to the MVC
    within one week after moving. (N.J.S.A. 39:3-36)
- id: 3
  category: license_system
  question: How soon must a motorist report a legal name change to the MVC?
  choices:
    A: Within one week
    B: Within two weeks
    C: Within 30 days
    D: Within 60 days
  answer: B
  explanation: A motorist who legally changes his/her name must report the change
    to the MVC within two weeks. (N.J.S.A. 39:3-9a)
- id: 4
  category: license_system
  question: 'A motorist with a valid out-of-state license who moves to NJ must apply
    for a NJ license within:'
  choices:
    A: 30 days
    B: 90 days
    C: 60 days or before the current license expires, whichever is sooner
    D: One year
  answer: C
  explanation: Out-of-state drivers must apply within 60 days or before their current
    license expires, whichever is sooner. CDL holders have 30 days. (N.J.S.A. 39:3-17.1)
- id: 5
  category: license_system
  question: How long is a New Jersey driver license valid?
  choices:
    A: Two years
    B: Four years
    C: Five years
    D: Six years
  answer: B
  explanation: NJ driver licenses are valid for four years.
- id: 6
  category: license_system
  question: What is the minimum age to obtain a Special Learner Permit in New Jersey?
  choices:
    A: '15'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: A Special Learner Permit can be obtained at age 16 under GDL Option
    A.
- id: 7
  category: license_system
  question: Under the GDL program, how many practice driving hours are required before
    a road test?
  choices:
    A: 25 hours, including 5 at night
    B: 30 hours, including 10 at night
    C: 50 hours, including 10 during darkness
    D: 40 hours, including 15 at night
  answer: C
  explanation: GDL permit holders must complete a minimum of 50 practice driving hours,
    including 10 hours during darkness.
- id: 8
  category: license_system
  question: What are the driving hour restrictions for GDL permit and probationary
    license holders under 21?
  choices:
    A: No driving between 10:00 pm and 6:00 am
    B: No driving between 11:01 pm and 5:00 am
    C: No driving between midnight and 5:00 am
    D: No driving between 9:00 pm and 6:00 am
  answer: B
  explanation: GDL permit and probationary license holders under 21 may not drive
    between 11:01 pm and 5:00 am.
- id: 9
  category: license_system
  question: What is required of GDL drivers under age 21 regarding cell phones?
  choices:
    A: They may use hands-free devices only
    B: They may not use hand-held or hands-free cell phones or any other electronic
      devices
    C: They may use cell phones only for emergencies
    D: They may text at red lights only
  answer: B
  explanation: GDL holders may not use hand-held or hands-free cell phones or any
    other electronic devices while driving.
- id: 10
  category: license_system
  question: How many GDL decals must be displayed, and where?
  choices:
    A: One decal on the rear license plate
    B: Two decals, one on each side of the vehicle
    C: Two decals, one on the top left of the front plate and one on the top left
      of the rear plate
    D: Two decals on the rear window
  answer: C
  explanation: Two visible red reflective decals must be displayed - one on the top
    left corner of the front plate and one on the top left corner of the rear plate.
- id: 11
  category: license_system
  question: What is the minimum age to supervise a GDL permit holder as a passenger?
  choices:
    A: 18 years old with a valid NJ license
    B: 21 years old with a valid NJ license and minimum 3 years driving experience
    C: 25 years old with a valid NJ license
    D: Any licensed NJ driver
  answer: B
  explanation: The supervising driver must be at least 21 years old, possess a valid
    NJ license, and have a minimum of three years' driving experience.
- id: 12
  category: license_system
  question: How long is the probationary license period before a basic license can
    be obtained?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 18 months
  answer: B
  explanation: Probationary license holders must practice unsupervised driving for
    at least one year before obtaining a basic license.
- id: 13
  category: license_system
  question: How many points of ID verification are required for a New Jersey driver
    license?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: All applicants must provide 6 points of ID verification.
- id: 14
  category: license_system
  question: 'A motorist with a valid license from another country may drive in NJ
    for up to:'
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: A motorist with a valid license from another country may drive with
    that license for up to a year. (N.J.A.C. 13:21-8.2(f))
- id: 15
  category: license_system
  question: What is the penalty for altering a driver license or presenting an altered
    license?
  choices:
    A: A warning
    B: A $100 fine
    C: Loss of driving privilege, fine up to $1,000, and/or imprisonment
    D: Community service only
  answer: C
  explanation: Altering a driver license or presenting an altered one may result in
    loss of driving privilege, a fine up to $1,000, and/or imprisonment.
- id: 16
  category: license_system
  question: For GDL Option C (Adult Road), what is the minimum age and supervised
    practice period?
  choices:
    A: Age 18, 6 months supervised driving
    B: Age 21, 3 months supervised driving
    C: Age 21, 6 months supervised driving
    D: Age 25, 1 month supervised driving
  answer: B
  explanation: GDL Option C requires minimum age 21 and at least 3 months of supervised
    practice driving.
- id: 17
  category: driver_testing
  question: What score is needed to pass the NJ MVC knowledge test?
  choices:
    A: 70% (35 out of 50)
    B: 75% (37 out of 50)
    C: 80% (40 out of 50)
    D: 90% (45 out of 50)
  answer: C
  explanation: 80 percent, or 40 of the 50 questions, must have correct answers.
- id: 18
  category: driver_testing
  question: What is the minimum vision requirement for a basic license applicant?
  choices:
    A: 20/20 vision
    B: 20/40 vision
    C: 20/50 vision with or without corrective lenses
    D: 20/70 vision
  answer: C
  explanation: Basic license applicants need 20/50 vision with or without corrective
    lenses.
- id: 19
  category: driver_testing
  question: What is the minimum vision requirement for a CDL applicant?
  choices:
    A: 20/50 in both eyes
    B: 20/40 in both eyes with or without corrective lenses
    C: 20/20 in both eyes
    D: 20/30 in one eye
  answer: B
  explanation: CDL applicants need 20/40 vision with or without corrective lenses
    in both eyes, plus the ability to distinguish red, green, and amber lights.
- id: 20
  category: driver_testing
  question: How many questions are on the NJ MVC knowledge test?
  choices:
    A: '25'
    B: '40'
    C: 50 plus a survey question about organ donation
    D: '100'
  answer: C
  explanation: The knowledge test consists of 50 questions plus a survey question
    about organ donation.
- id: 21
  category: driver_responsibility
  question: Under NJ's seat belt law, who is responsible for passengers under age
    18 wearing seat belts?
  choices:
    A: The passengers themselves
    B: The driver
    C: The parent, even if not in the vehicle
    D: No one; it is optional for minors
  answer: B
  explanation: The driver is responsible for all passengers under age 18 wearing seat
    belts.
- id: 22
  category: driver_responsibility
  question: Seat belts improve a motorist's chance of surviving a crash by what percentage?
  choices:
    A: 30 percent
    B: 45 percent
    C: 60 percent
    D: 80 percent
  answer: C
  explanation: Seat belts can improve a motorist's chances of surviving a crash by
    60 percent.
- id: 23
  category: driver_responsibility
  question: Children under what age must ride in a rear seat?
  choices:
    A: '5'
    B: '6'
    C: '8'
    D: '10'
  answer: C
  explanation: All children under age 8 must be seated in a rear seat.
- id: 24
  category: driver_responsibility
  question: 'Children under age 2 or weighing less than 30 pounds must ride in:'
  choices:
    A: A forward-facing car seat
    B: A booster seat
    C: A rear-facing child restraint system with a five-point harness
    D: A regular seat belt
  answer: C
  explanation: Children under age 2 and those who weigh less than 30 pounds must ride
    in a federally approved rear-facing child restraint system with a five-point harness.
- id: 25
  category: driver_responsibility
  question: What is the proper hand position on the steering wheel?
  choices:
    A: 10 and 2 o'clock
    B: 9 and 3 o'clock
    C: 8 and 4 o'clock
    D: 12 o'clock with one hand
  answer: B
  explanation: A motorist should grip the steering wheel at the 9 and 3 o'clock positions,
    keeping thumbs along the face of the wheel.
- id: 26
  category: driver_responsibility
  question: A motorist should be able to stop within what distance at 20 mph?
  choices:
    A: 15 feet
    B: 25 feet
    C: 35 feet
    D: 50 feet
  answer: B
  explanation: A motorist should be able to stop within 25 feet at 20 mph.
- id: 27
  category: driver_responsibility
  question: How far in advance must a turn signal be activated before making a turn?
  choices:
    A: 50 feet
    B: 75 feet
    C: 100 feet
    D: 200 feet
  answer: C
  explanation: A motorist should put on the turn signal at least 100 feet before turning.
    (N.J.S.A. 39:4-126)
- id: 28
  category: driver_responsibility
  question: What is the correct hand signal for a right turn?
  choices:
    A: Hand and arm straight out
    B: Hand and arm upward
    C: Hand and arm downward
    D: Waving motion
  answer: B
  explanation: 'Right turn: hand and arm upward. Left turn: hand and arm straight
    out. Stop: hand and arm downward.'
- id: 29
  category: driver_responsibility
  question: When parking uphill on a street with a curb, which way should the wheels
    be turned?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Straight ahead
    D: It doesn't matter
  answer: B
  explanation: When parking uphill, the wheels should be turned away from the curb.
- id: 30
  category: driver_responsibility
  question: When parking downhill on a street with a curb, which way should the wheels
    be turned?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Straight ahead
    D: It doesn't matter
  answer: A
  explanation: When parking downhill, the wheels should be turned toward the curb.
- id: 31
  category: driver_responsibility
  question: What is the maximum vehicle tire distance from the curb when parallel
    parked?
  choices:
    A: 12 inches
    B: 6 inches
    C: 18 inches
    D: 3 inches
  answer: B
  explanation: A vehicle's tires should be no more than six inches from the curb when
    parallel parked.
- id: 32
  category: driver_responsibility
  question: 'NJ law limits vehicle idling to:'
  choices:
    A: 1 minute
    B: 3 minutes
    C: 5 minutes
    D: 10 minutes
  answer: B
  explanation: NJ law requires all motorists to restrict vehicle idling to three minutes
    or less. (N.J.A.C. 7:27-15.8)
- id: 33
  category: driver_responsibility
  question: What is the fine for failing to remove snow or ice from a vehicle before
    driving?
  choices:
    A: $10 to $25
    B: $25 to $75
    C: $100 to $500
    D: $500 to $1,000
  answer: B
  explanation: Fines of $25 to $75 apply regardless of whether snow or ice dislodges.
    If dislodged snow/ice causes injury or property damage, fines up to $1,500 may
    be assessed.
- id: 34
  category: driver_responsibility
  question: At what speed does hitting a dashboard or windshield compare to falling
    from a three-story building?
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: Hitting the dashboard or windshield at 30 mph is like falling from
    the top of a three-story building.
- id: 35
  category: driver_responsibility
  question: 'Air bags inflate at speeds of up to:'
  choices:
    A: 50 mph
    B: 100 mph
    C: 150 mph
    D: 200 mph
  answer: D
  explanation: Air bags inflate at speeds of up to 200 mph.
- id: 36
  category: driver_responsibility
  question: At what minimum distance should a driver sit from the steering wheel?
  choices:
    A: 6 inches
    B: 10 inches from center of wheel to center of breastbone
    C: 12 inches
    D: 18 inches
  answer: B
  explanation: Individuals should keep at least 10 inches between the center of the
    steering wheel and the center of the breastbone.
- id: 37
  category: driver_responsibility
  question: What speed should a vehicle travel when driving in reverse?
  choices:
    A: 5 to 10 mph
    B: Walking speed (2 to 4 mph)
    C: 10 to 15 mph
    D: Under 20 mph
  answer: B
  explanation: A vehicle should be driven slowly in reverse - typically walking speed
    (2 to 4 mph).
- id: 38
  category: driver_responsibility
  question: How far back must a motorist be able to drive in reverse during the road
    test?
  choices:
    A: 50 feet
    B: 75 feet
    C: 100 feet
    D: 200 feet
  answer: C
  explanation: A motorist will be asked to back the vehicle about 100 feet in a straight
    line during the road test.
- id: 39
  category: driver_responsibility
  question: 'The minimum tread depth for safe tires is:'
  choices:
    A: 1/8 inch
    B: 1/16 inch
    C: 1/4 inch
    D: 1/32 inch
  answer: B
  explanation: A vehicle should not be driven with tires that have less than 1/16
    inch of tread (about the edge of a penny).
- id: 40
  category: driver_responsibility
  question: 'Under normal conditions, a horn should be able to be heard for at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Under normal conditions, the horn should be able to be heard for at
    least 200 feet. (N.J.S.A. 39:3-69)
- id: 41
  category: safe_driving_rules
  question: What is the speed limit in school zones, business, or residential districts?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: 25 mph in school zones, business, or residential districts.
- id: 42
  category: safe_driving_rules
  question: What is the speed limit in suburban business and residential districts?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 40 mph
  answer: C
  explanation: 35 mph in suburban business and residential districts.
- id: 43
  category: safe_driving_rules
  question: What is the speed limit on non-posted rural roadways?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 55 mph
  answer: C
  explanation: 50 mph on non-posted rural roadways.
- id: 44
  category: safe_driving_rules
  question: What happens to fines for exceeding the 65 mph limit by 10 mph or more?
  choices:
    A: They are tripled
    B: They are doubled
    C: An additional $100 is added
    D: Nothing special
  answer: B
  explanation: Motorists pay double fines for exceeding the 65 mph limit by 10 mph
    or more. (N.J.S.A. 39:4-98.6)
- id: 45
  category: safe_driving_rules
  question: When is passing on the right allowed?
  choices:
    A: Never
    B: Only on roads with more than one lane in the same direction, or when a vehicle
      ahead is making a left turn and there is room
    C: Anytime on a highway
    D: Only on the shoulder
  answer: B
  explanation: Passing on the right is allowed only on roads with more than one lane
    in the same direction, or when the vehicle ahead is making a left turn and there
    is room. Never pass on the right shoulder.
- id: 46
  category: safe_driving_rules
  question: What does a double solid center line mean?
  choices:
    A: Passing is allowed with caution
    B: Passing is allowed on either side
    C: No passing allowed from either direction
    D: Only trucks may pass
  answer: C
  explanation: 'Both center lines are solid: No passing allowed.'
- id: 47
  category: safe_driving_rules
  question: At a multi-way stop, who has the right-of-way when two motorists arrive
    at the same time?
  choices:
    A: The motorist on the left
    B: The motorist on the right
    C: The motorist going straight
    D: The motorist turning right
  answer: B
  explanation: At a multi-way stop, a motorist must yield to the motorist on the right
    if both arrive at the same time.
- id: 48
  category: safe_driving_rules
  question: 'When a traffic signal is not working due to a power failure, it should
    be treated as:'
  choices:
    A: A yield sign
    B: A caution signal
    C: A 4-way stop
    D: If the light were green
  answer: C
  explanation: When a traffic signal is not illuminated because of a power failure,
    it is observed as a 4-way stop signal. (N.J.S.A. 39:4-81)
- id: 49
  category: safe_driving_rules
  question: Is it legal to make a right turn on red in New Jersey?
  choices:
    A: No, never
    B: Yes, after a full stop and checking for traffic, unless a No Turn on Red sign
      is posted
    C: Yes, without stopping if the way is clear
    D: Only on highways
  answer: B
  explanation: NJ law authorizes a right turn on red after a full stop and checking
    for traffic, unless a No Turn on Red sign is posted. (N.J.S.A. 39:4-115)
- id: 50
  category: safe_driving_rules
  question: What must a motorist do when approaching a school bus with flashing red
    lights?
  choices:
    A: Slow to 25 mph and proceed with caution
    B: Stop at least 25 feet away
    C: Stop at least 15 feet away
    D: Slow to 10 mph and proceed
  answer: B
  explanation: State law requires a motorist to stop at least 25 feet away from a
    school bus with flashing red lights. (N.J.S.A. 39:4-128.1)
- id: 51
  category: safe_driving_rules
  question: 'When a school bus stops directly in front of a school, a motorist may
    pass at no more than:'
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 25 mph
  answer: B
  explanation: If a school bus has stopped directly in front of a school, a motorist
    may pass from either direction at a speed of no more than 10 mph.
- id: 52
  category: safe_driving_rules
  question: How far must a motorist stop from railroad tracks when warning signals
    are active?
  choices:
    A: 10 feet
    B: 15 feet
    C: 25 feet
    D: 50 feet
  answer: B
  explanation: A motorist must stop at least 15 feet from a railroad crossing when
    there are flashing red lights, ringing bells, descending or lowered gates. (N.J.S.A.
    39:4-127.1)
- id: 53
  category: safe_driving_rules
  question: How far behind an emergency vehicle must a motorist stay?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: A motorist should keep at least 300 feet behind a signaling emergency
    vehicle. (N.J.S.A. 39:4-92)
- id: 54
  category: safe_driving_rules
  question: When must headlights be used?
  choices:
    A: Only after sunset
    B: Between one-half hour after sunset and one-half hour before sunrise, when visibility
      is 500 feet or less, or when using windshield wipers
    C: Only when it is completely dark
    D: Only in rain
  answer: B
  explanation: Headlights must be used between one-half hour after sunset and one-half
    hour before sunrise, when visibility is 500 feet or less, and when using windshield
    wipers. (N.J.S.A. 39:3-46)
- id: 55
  category: safe_driving_rules
  question: How far from a fire hydrant is parking prohibited?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 25 feet
  answer: B
  explanation: Parking is prohibited within 10 feet of a fire hydrant. (N.J.S.A. 39:4-138)
- id: 56
  category: safe_driving_rules
  question: How far from a crosswalk at an intersection is parking prohibited?
  choices:
    A: 10 feet
    B: 15 feet
    C: 25 feet
    D: 50 feet
  answer: C
  explanation: Parking is prohibited within 25 feet of a crosswalk at an intersection.
    (N.J.S.A. 39:4-138)
- id: 57
  category: safe_driving_rules
  question: How far from a stop sign is parking prohibited?
  choices:
    A: 25 feet
    B: 35 feet
    C: 50 feet
    D: 75 feet
  answer: C
  explanation: Parking is prohibited within 50 feet of a stop sign. (N.J.S.A. 39:4-138)
- id: 58
  category: safe_driving_rules
  question: How far from a railroad crossing is parking prohibited?
  choices:
    A: 25 feet
    B: 35 feet
    C: 50 feet
    D: 75 feet
  answer: C
  explanation: Parking is prohibited within 50 feet of a railroad crossing. (N.J.S.A.
    39:4-138)
- id: 59
  category: safe_driving_rules
  question: How far from a fire station driveway is parking prohibited?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: C
  explanation: Parking is prohibited within 20 feet of the driveway entrance to any
    fire station, and within 75 feet on the street opposite a fire station entrance.
- id: 60
  category: safe_driving_rules
  question: It is illegal for a vehicle to be parked more than how many inches from
    the curb?
  choices:
    A: 3 inches
    B: 6 inches
    C: 12 inches
    D: 18 inches
  answer: B
  explanation: It is illegal for a vehicle to be parked more than six inches from
    the curb. (N.J.S.A. 39:4-135)
- id: 61
  category: safe_driving_rules
  question: What is the fine for a first offense of using a handheld cell phone while
    driving?
  choices:
    A: $100-$200
    B: $200-$400
    C: $400-$600
    D: $600-$800
  answer: B
  explanation: 'The fine for a first offense is $200-$400. Second offense: $400-$600.
    Third offense: $600-$800. (N.J.S.A. 39:4-97.3)'
- id: 62
  category: safe_driving_rules
  question: What does the Move Over law require?
  choices:
    A: Moving over for all vehicles
    B: Changing lanes away from stationary emergency vehicles, tow trucks, or disabled
      vehicles, or slowing down if lane change is impossible
    C: Moving to the right lane at all times
    D: Yielding to merging traffic
  answer: B
  explanation: 'The Move Over law requires motorists to change lanes away from stationary
    emergency vehicles, or reduce speed if a lane change is impossible. Fine: $100-$500.
    (N.J.S.A. 39:4-92.2)'
- id: 63
  category: safe_driving_rules
  question: How far from a fire department vehicle in service must you avoid parking?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: A motorist should never park within 200 feet of a fire department vehicle
    in service.
- id: 64
  category: safe_driving_rules
  question: 'When approaching a frozen dessert truck with flashing red lights, a motorist
    must:'
  choices:
    A: Slow to 25 mph
    B: Stop, then drive past at no more than 15 mph
    C: Stop, then drive past at no more than 10 mph
    D: Just yield to pedestrians
  answer: B
  explanation: A motorist must stop, yield to persons crossing, watch for children,
    and drive past at no more than 15 mph. (N.J.S.A. 39:4-128.4)
- id: 65
  category: safe_driving_rules
  question: What is the penalty for not stopping for a pedestrian in a crosswalk?
  choices:
    A: Fine up to $200 and 2 points
    B: Fine up to $500, up to 25 days jail, community service, up to 6-month license
      suspension, and 2 points
    C: Fine of $100 only
    D: Warning only
  answer: B
  explanation: Failure to stop carries a fine up to $500, up to 25 days in jail, community
    service, license suspension up to 6 months, and 2 points. (N.J.S.A. 39:4-36)
- id: 66
  category: safe_driving_rules
  question: 'Driving on private property to avoid a traffic signal or sign is:'
  choices:
    A: Legal if done safely
    B: A motor vehicle violation
    C: Only illegal in residential areas
    D: Permitted in emergencies
  answer: B
  explanation: Driving on private property to avoid a traffic signal or sign is a
    motor vehicle violation. (N.J.S.A. 39:4-66.2)
- id: 67
  category: safe_driving_rules
  question: NJ law prohibits add-on tinting on which vehicle windows?
  choices:
    A: Rear window only
    B: All windows
    C: Windshields and front side windows
    D: Driver's side window only
  answer: C
  explanation: NJ law prohibits add-on tinting on windshields and front side windows.
    (N.J.S.A. 39:3-74)
- id: 68
  category: safe_driving_rules
  question: 'When a school bus is on the other side of a dual-lane highway with a
    safety island, a motorist should:'
  choices:
    A: Stop completely
    B: Slow to 10 mph
    C: Continue at the speed limit
    D: Slow to 25 mph
  answer: B
  explanation: When traveling on a dual-lane highway, a motorist should slow to 10
    mph if on the other side of a safety island or raised median.
- id: 69
  category: safe_driving_rules
  question: What must a motorist stop for when approaching an intersection?
  choices:
    A: Within 10 feet of the nearest crosswalk
    B: Within 5 feet of the nearest crosswalk or stop line
    C: At least 15 feet from the intersection
    D: At the stop line or 25 feet before the intersection
  answer: B
  explanation: A motorist must bring the vehicle to a complete stop within five feet
    of the nearest crosswalk or stop line.
- id: 70
  category: defensive_driving
  question: What is the three-second-plus rule?
  choices:
    A: Look three seconds ahead before changing lanes
    B: Wait three seconds after a light turns green before proceeding
    C: Maintain at least three seconds of following distance behind the vehicle ahead
    D: Signal three seconds before turning
  answer: C
  explanation: Choose a fixed object ahead. If it takes at least three seconds before
    your vehicle passes the same object after the vehicle in front, you have enough
    distance for a sudden stop.
- id: 71
  category: defensive_driving
  question: 'In bad weather, the three-second following rule should be increased to:'
  choices:
    A: Three seconds
    B: Four or more seconds
    C: Two seconds
    D: Six seconds exactly
  answer: B
  explanation: During bad weather, the time interval should be increased to four or
    more seconds.
- id: 72
  category: defensive_driving
  question: 'The rule of thumb for following distance is:'
  choices:
    A: Two car lengths per 10 mph
    B: One car length (about 20 feet) per 10 mph of speed
    C: One car length per 20 mph
    D: Three car lengths at all speeds
  answer: B
  explanation: The rule of thumb most often used is to keep one car length back (about
    20 feet) for each 10 miles per hour of speed.
- id: 73
  category: defensive_driving
  question: What is the total stopping distance at 60 mph under normal daytime conditions?
  choices:
    A: 247 feet
    B: 302 feet
    C: 343 feet
    D: 409 feet
  answer: C
  explanation: 'At 60 mph: reaction distance (66 ft) + braking distance (277 ft) =
    343 ft total stopping distance.'
- id: 74
  category: defensive_driving
  question: A vehicle travels how many feet per second at 60 mph?
  choices:
    A: 44 feet
    B: 66 feet
    C: 88 feet
    D: 110 feet
  answer: C
  explanation: A vehicle travels 88 feet per second at 60 mph.
- id: 75
  category: defensive_driving
  question: At what speed can hydroplaning begin?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Wet road surfaces can cause tires to hydroplane starting at about 35
    mph. After 55 mph, tires may totally leave the road surface.
- id: 76
  category: defensive_driving
  question: 'When skidding, a motorist should:'
  choices:
    A: Slam on the brakes
    B: Turn the steering wheel away from the direction of the skid
    C: Turn in the direction the rear of the vehicle is skidding, without over-steering
    D: Accelerate
  answer: C
  explanation: To avoid a spin, the motorist should turn in the direction the rear
    of the vehicle is skidding, without over-steering. Look in the direction you want
    to go.
- id: 77
  category: defensive_driving
  question: What causes highway hypnosis?
  choices:
    A: Driving too fast
    B: Looking at any one thing for more than a few seconds during long drives
    C: Driving with the windows up
    D: Loud music
  answer: B
  explanation: Highway hypnosis can be avoided by not looking at any one thing for
    more than a few seconds. Rest every two hours.
- id: 78
  category: defensive_driving
  question: What is Maggie's Law?
  choices:
    A: A cell phone law
    B: A law making driving while fatigued recklessness under the vehicular homicide
      statute
    C: A seat belt law
    D: A speed limit law
  answer: B
  explanation: Maggie's Law makes it illegal to knowingly drive while impaired by
    lack of sleep and establishes driving while fatigued as recklessness under the
    vehicular homicide statute. (N.J.S.A. 2C:11-5)
- id: 79
  category: defensive_driving
  question: If a vehicle's wheels drift onto the shoulder, what should a motorist
    do?
  choices:
    A: Turn back onto the pavement immediately
    B: Stay on the shoulder, ease up on gas, slow to 25 mph or less, then turn one-quarter
      turn back onto the road
    C: Slam on the brakes
    D: Accelerate to get back on the road
  answer: B
  explanation: Stay on the shoulder and ease up on gas. After slowing to 25 mph or
    less, turn the steering wheel one-quarter turn toward the roadway.
- id: 80
  category: defensive_driving
  question: 'In foggy conditions, headlights should be on:'
  choices:
    A: High beam
    B: Low beam
    C: Parking lights only
    D: 'Off'
  answer: B
  explanation: In fog, headlights should be kept on low beam and fog lights turned
    on if the vehicle has them.
- id: 81
  category: defensive_driving
  question: What is the recommended following distance on snow-covered roads?
  choices:
    A: Three seconds
    B: Four seconds
    C: Six seconds or more
    D: Eight seconds
  answer: C
  explanation: A good rule on snow-covered roads is to maintain a following distance
    of six seconds or more.
- id: 82
  category: defensive_driving
  question: 'If a gas pedal sticks, a motorist should:'
  choices:
    A: Turn off the engine immediately
    B: Pump the gas pedal
    C: Keep eyes on road, quickly shift to neutral, steer to safety, turn off engine
    D: Pull the parking brake
  answer: C
  explanation: If a gas pedal sticks, keep eyes on the road, quickly shift to neutral,
    steer to a safe area off the roadway, turn off engine, and call for help.
- id: 83
  category: defensive_driving
  question: 'When a vehicle stalls on railroad tracks, a motorist should:'
  choices:
    A: Try to restart the engine
    B: Wait in the car for help
    C: Get out and move far away, running at a 45-degree angle in the direction of
      the train
    D: Push the car off the tracks
  answer: C
  explanation: Get out and move far away. If a train is approaching, run at a 45-degree
    angle away from the tracks but in the direction of the train to avoid flying debris.
- id: 84
  category: defensive_driving
  question: What is the standard crash-prevention formula?
  choices:
    A: Stop, Look, Listen
    B: Be alert, Be prepared, Act in time
    C: Slow down, Move over, Stay alert
    D: Scan, Identify, Predict
  answer: B
  explanation: 'The crash-prevention formula is: Be alert (never think others won''t
    make mistakes), Be prepared (learn what to do), Act in time (don''t panic).'
- id: 85
  category: defensive_driving
  question: How long can a vehicle with closed windows and doors float after plunging
    into water?
  choices:
    A: 30 seconds to 1 minute
    B: 1 to 3 minutes
    C: 3 to 10 minutes
    D: 15 to 20 minutes
  answer: C
  explanation: A vehicle with windows and doors closed will float for about three
    to ten minutes.
- id: 86
  category: defensive_driving
  question: 'If brakes fail, a motorist should first:'
  choices:
    A: Turn off the engine
    B: Shift to a lower gear and pump the brake pedal fast and hard
    C: Steer into a ditch
    D: Open the door and jump out
  answer: B
  explanation: Shift to a lower gear and pump the brake pedal fast and hard. If that
    doesn't work, use the parking brake while holding the brake release.
- id: 87
  category: defensive_driving
  question: 'During a tire blowout, a motorist should:'
  choices:
    A: Slam on the brakes
    B: Hold the wheel firmly, keep straight, take foot off gas, and coast to a safe
      stop
    C: Accelerate to maintain control
    D: Turn the wheel sharply
  answer: B
  explanation: Hold the steering wheel firmly, keep the vehicle straight, remove foot
    from gas but don't brake. Coast to a stop and pull to a safe area.
- id: 88
  category: defensive_driving
  question: 'Fines in construction/work zones are:'
  choices:
    A: The same as normal zones
    B: Doubled
    C: Tripled
    D: Increased by $100
  answer: B
  explanation: Traffic fines are doubled for motor vehicle violations committed in
    roadway construction zones. (N.J.S.A. 39:4-203.5)
- id: 89
  category: defensive_driving
  question: 'When stopping at night at 60 mph using low beams, the total stopping
    distance is approximately:'
  choices:
    A: 302 feet
    B: 343 feet
    C: 409 feet
    D: 530 feet
  answer: C
  explanation: 'At 60 mph at night (1.5 second reaction time): reaction distance 132
    ft + braking distance 277 ft = 409 ft.'
- id: 90
  category: defensive_driving
  question: How far ahead should a motorist look while driving in a city at 25 mph?
  choices:
    A: About half a block
    B: About a block ahead (12 seconds)
    C: At least a quarter mile
    D: Just the car ahead
  answer: B
  explanation: A motorist should look at least 12 seconds ahead. While driving at
    25 mph in a city, this means about a block ahead.
- id: 91
  category: defensive_driving
  question: 'When studded snow tires may be used in New Jersey:'
  choices:
    A: October 1 to March 31
    B: November 15 to April 1
    C: December 1 to March 15
    D: All year round
  answer: B
  explanation: In NJ, motorists may use studded snow tires between November 15 and
    April 1.
- id: 92
  category: defensive_driving
  question: How far back should a warning device be placed during an emergency highway
    stop?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet (about 120 paces)
    D: 500 feet
  answer: C
  explanation: Put a warning device at least 300 feet back (about 120 paces).
- id: 93
  category: alcohol_drugs_health
  question: What is the legal BAC limit for drivers age 21 and older in New Jersey?
  choices:
    A: 0.05%
    B: 0.08%
    C: 0.10%
    D: 0.04%
  answer: B
  explanation: In NJ, it is illegal to drive with a BAC of 0.08% or higher. (N.J.S.A.
    39:4-50)
- id: 94
  category: alcohol_drugs_health
  question: What is the legal BAC limit for drivers under age 21?
  choices:
    A: 0.00%
    B: 0.01%
    C: 0.02%
    D: 0.05%
  answer: B
  explanation: For individuals under 21, it is illegal to drive with a BAC of 0.01%
    or higher. (N.J.S.A. 39:4-50.14)
- id: 95
  category: alcohol_drugs_health
  question: What is the only thing that can make a person sober?
  choices:
    A: Coffee
    B: A cold shower
    C: Fresh air
    D: Time
  answer: D
  explanation: The only thing that can make a person sober is time. Alcohol is removed
    slowly by the body.
- id: 96
  category: alcohol_drugs_health
  question: 'How much alcohol is in each of these: 12 oz beer, 5 oz wine, 1.5 oz 86-proof
    liquor?'
  choices:
    A: Different amounts in each
    B: About the same - approximately 1/2 ounce of alcohol
    C: Beer has the most
    D: Wine has the least
  answer: B
  explanation: Every drink contains about a 1/2 ounce of alcohol. It's not what you
    drink but how many drinks you have.
- id: 97
  category: alcohol_drugs_health
  question: 'At a BAC slightly above 0.05%, the risk of causing a crash:'
  choices:
    A: Stays the same
    B: Doubles
    C: Triples
    D: Quadruples
  answer: B
  explanation: At a BAC slightly above 0.05%, the risk doubles. At 0.10% it's 6 times
    as great. At 0.15% it's 25 times as great.
- id: 98
  category: alcohol_drugs_health
  question: What is New Jersey's implied consent law?
  choices:
    A: Consent to a vehicle search
    B: By using NJ roadways, motorists agree to submit to a breath test after arrest
      for DUI
    C: Consent to a field sobriety test
    D: Consent to a blood draw at any time
  answer: B
  explanation: NJ's implied consent law means motorists have agreed to submit to a
    breath test given by law enforcement after an arrest for DUI. (N.J.S.A. 39:4-50.4a)
- id: 99
  category: alcohol_drugs_health
  question: What is the penalty for refusing a breath test in New Jersey?
  choices:
    A: A warning
    B: Loss of driving privileges, surcharge of $1,000/year for 3 years, and ignition
      interlock
    C: A $100 fine
    D: 30-day suspension only
  answer: B
  explanation: Refusal results in loss of driving privileges, a violation surcharge
    of $1,000/year for three years, and an ignition interlock device.
- id: 100
  category: alcohol_drugs_health
  question: After alcohol, what is the drug most often found with drivers involved
    in crashes?
  choices:
    A: Cocaine
    B: Prescription painkillers
    C: Marijuana
    D: Methamphetamine
  answer: C
  explanation: After alcohol, marijuana is the drug most often found with drivers
    involved in crashes.
- id: 101
  category: alcohol_drugs_health
  question: 'Four factors that determine BAC are:'
  choices:
    A: Type of alcohol, gender, time of day, mood
    B: Quantity of alcohol consumed, body weight, how quickly drinks are consumed,
      food eaten
    C: Type of alcohol, height, exercise level, sleep
    D: Gender, medications, temperature, altitude
  answer: B
  explanation: 'BAC is determined by: quantity consumed, body weight, how quickly
    drinks are consumed, and food eaten.'
- id: 102
  category: alcohol_drugs_health
  question: What percentage of alcohol is eliminated through breath, urine, and sweat?
  choices:
    A: 5%
    B: 10%
    C: 20%
    D: 50%
  answer: B
  explanation: 90% of alcohol is oxidized by the liver. The other 10% is eliminated
    in breath, urine, and sweat.
- id: 103
  category: penalties_and_points
  question: What is the fine for a first DUI offense with BAC of 0.08% to less than
    0.10%?
  choices:
    A: $100-$200
    B: $250-$400
    C: $500-$1,000
    D: $1,000-$2,000
  answer: B
  explanation: 'First DUI offense with BAC 0.08% to <0.10%: $250-$400 fine, plus various
    surcharges and fees.'
- id: 104
  category: penalties_and_points
  question: What is the annual surcharge for a DUI conviction?
  choices:
    A: $250 per year for 2 years
    B: $500 per year for 3 years
    C: $1,000 per year for 3 years
    D: $1,500 per year for 5 years
  answer: C
  explanation: $1,000 annual surcharge for three years for first and second DUI offenses.
    (N.J.S.A. 17:29A-35)
- id: 105
  category: penalties_and_points
  question: What is the penalty for driving without insurance (first offense)?
  choices:
    A: $100 fine
    B: $300-$1,000 fine, 1-year license suspension, community service
    C: Warning only
    D: $50 fine and 2 points
  answer: B
  explanation: 'First offense: $300-$1,000 fine, 1-year license suspension, $250/year
    surcharge for 3 years, and community service.'
- id: 106
  category: penalties_and_points
  question: How many points are assessed for speeding 1-14 mph over the limit?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: 'Exceeding maximum speed 1-14 mph over the limit: 2 points.'
- id: 107
  category: penalties_and_points
  question: How many points are assessed for speeding 15-29 mph over the limit?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: 'Exceeding maximum speed 15-29 mph over the limit: 4 points.'
- id: 108
  category: penalties_and_points
  question: How many points are assessed for speeding 30 mph or more over the limit?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 8 points
  answer: C
  explanation: 'Exceeding maximum speed 30 mph or more over the limit: 5 points.'
- id: 109
  category: penalties_and_points
  question: How many points are assessed for reckless driving?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: D
  explanation: 'Reckless driving: 5 points. (N.J.S.A. 39:4-96)'
- id: 110
  category: penalties_and_points
  question: How many points are assessed for tailgating?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: D
  explanation: 'Tailgating: 5 points. (N.J.S.A. 39:4-89)'
- id: 111
  category: penalties_and_points
  question: How many points are assessed for improper passing of a school bus?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: D
  explanation: 'Improper passing of a school bus: 5 points. (N.J.S.A. 39:4-128.1)'
- id: 112
  category: penalties_and_points
  question: How many points are assessed for leaving the scene of a crash with personal
    injury?
  choices:
    A: 2 points
    B: 4 points
    C: 5 points
    D: 8 points
  answer: D
  explanation: 'Leaving the scene of a crash with personal injury: 8 points. Without
    injury: 2 points. (N.J.S.A. 39:4-129)'
- id: 113
  category: penalties_and_points
  question: How many points are subtracted each year a motorist goes without a violation?
  choices:
    A: 1 point
    B: 2 points
    C: Up to 3 points
    D: 5 points
  answer: C
  explanation: Up to three points will be subtracted every year that a motorist goes
    without a violation or suspension. (N.J.S.A. 39:5-30.9)
- id: 114
  category: penalties_and_points
  question: At how many accumulated points does a motorist face a surcharge?
  choices:
    A: 4 or more
    B: 6 or more
    C: 8 or more
    D: 12 or more
  answer: B
  explanation: Motorists who accumulate six or more points within three years are
