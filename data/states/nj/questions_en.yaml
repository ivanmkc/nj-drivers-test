- id: 115
  category: penalties_and_points
  question: How many points are assessed for careless driving?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: A
  explanation: 'Careless driving: 2 points. (N.J.S.A. 39:4-97)'
- id: 116
  category: penalties_and_points
  question: How many points are assessed for racing on a highway?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: D
  explanation: 'Racing on highway: 5 points. (N.J.S.A. 39:4-52)'
- id: 117
  category: penalties_and_points
  question: A habitual offender is a motorist whose license has been suspended how
