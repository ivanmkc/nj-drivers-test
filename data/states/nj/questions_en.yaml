  choices:
    A: Two times in two years
    B: Three times in three years
    C: Four times in five years
    D: Five times in ten years
  answer: B
  explanation: A habitual offender is a motorist whose driver license has been suspended
    three times in three years.
- id: 118
  category: penalties_and_points
  question: What is the penalty for a hit-and-run involving bodily injury (first offense)?
  choices:
    A: $500 fine and 30 days jail
    B: $2,500-$5,000 fine, up to 180 days jail, and 1-year license loss
    C: $1,000 fine and 6-month suspension
    D: $5,000 fine and permanent license loss
  answer: B
  explanation: 'Hit-and-run with bodily injury: $2,500-$5,000 fine, up to 180 days
    jail, and 1-year license loss for first offense. Subsequent offense: permanent
    license loss.'
- id: 119
  category: penalties_and_points
  question: How many points are removed by completing a Defensive Driving Course?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Two points will be removed from accumulated points upon completion
    of a defensive driving course. (N.J.S.A. 39:5-30.9)
- id: 120
  category: penalties_and_points
  question: How many points are removed by completing the Driver Improvement Program?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: A motorist who completes a Driver Improvement Program will have three
    points removed.
- id: 121
  category: penalties_and_points
  question: How often can the MVC recognize a defensive driving course for point reduction?
  choices:
    A: Once every 2 years
    B: Once every 3 years
    C: Once every 5 years
    D: Only once
  answer: C
  explanation: The MVC will only recognize a defensive driving course once every five
    years for point reduction. (N.J.S.A. 39:5-30.9)
- id: 122
  category: penalties_and_points
  question: What is the fine for the first offense of driving while suspended?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: B
  explanation: 'First offense of driving while suspended: $500 fine and up to six
    months additional suspension.'
- id: 123
  category: penalties_and_points
  question: A crash report must be sent to the MVC within how many days if no police
    report is filed?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: A written report must be sent to the MVC within 10 days if no police
    report is filed.
- id: 124
  category: penalties_and_points
  question: 'Crashes must be reported to police when damage exceeds:'
  choices:
    A: $200
    B: $500
    C: Any amount if there is personal injury
    D: Both B and C
  answer: D
  explanation: NJ law requires motorists to notify police of crashes involving injury,
    death, or vehicle/property damage over $500.
- id: 125
  category: penalties_and_points
  question: 'Points from out-of-state violations added to NJ record:'
  choices:
    A: 1 point
    B: 2 points
    C: Same as the violation's NJ equivalent
    D: None
  answer: B
  explanation: Two points will be added to a driving record for traffic violations
    committed in other states.
- id: 126
  category: sharing_the_road
  question: The Safe Passing Law requires drivers to allow at least how much space
    when passing a cyclist on a single-lane road?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: On a single-lane road, drivers must allow at least a 4-foot safety
    zone when passing vulnerable road users. (N.J.S.A. 39:4-92.4)
- id: 127
  category: sharing_the_road
  question: If 4 feet of passing space is not possible, what must a driver do?
  choices:
    A: Honk and pass quickly
    B: Slow to 25 mph and be prepared to stop until safe to pass
    C: Stop completely until the cyclist moves
    D: Drive on the shoulder
  answer: B
  explanation: If 4 feet is not possible, drivers must slow to 25 mph and be prepared
    to stop until they can pass safely.
- id: 128
  category: sharing_the_road
  question: Which vehicles must always yield the right-of-way to when they re-enter
    traffic?
  choices:
    A: Police cars only
    B: Buses and postal vehicles
    C: Taxis and ride-share vehicles
    D: Trucks only
  answer: B
  explanation: Motorists must yield to buses and postal vehicles when they re-enter
    the flow of traffic.
- id: 129
  category: sharing_the_road
  question: What is the most common cause of motorcycle crashes?
  choices:
    A: Excessive speed by motorcyclists
    B: Poor road conditions
    C: A motorist's failure to detect and recognize motorcycles in traffic
    D: Mechanical failure
  answer: C
  explanation: A motorist's failure to detect and recognize motorcycles in traffic
    is the most common cause of motorcycle crashes.
- id: 130
  category: sharing_the_road
  question: Trucks in bad weather can take how much longer to stop?
  choices:
    A: 10 percent longer
    B: 25 percent longer
    C: 50 percent longer
    D: 75 percent longer
  answer: B
  explanation: During bad weather, a truck, tractor-trailer, or bus can take as much
    as 25 percent longer to stop.
- id: 131
  category: sharing_the_road
  question: How far is the rear no-zone (blind spot) behind a large truck?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: C
  explanation: The rear no-zone behind a truck can extend up to 200 feet.
- id: 132
  category: sharing_the_road
  question: 'A motorist must stop when approaching a person using a white or metallic
    cane because:'
  choices:
    A: It is courtesy
    B: The person is visually challenged and the law requires it
    C: The person is elderly
    D: It is recommended but not required
  answer: B
  explanation: The law requires all motorists to stop for blind persons using a white
    or metallic cane, or accompanied by a guide dog. (N.J.S.A. 39:4-37.1)
- id: 133
  category: sharing_the_road
