questions:
- id: 1
  category: license_system
  question: ¿Qué debe llevar consigo un automovilista de Nueva Jersey mientras opera
    un vehículo motorizado?
  choices:
    A: Solo una licencia de conducir válida
    B: Una licencia de conducir válida, un seguro válido y las tarjetas de registro
      del vehículo
    C: Solo una licencia de conducir válida y el registro del vehículo
    D: Una licencia de conducir válida y un comprobante de domicilio
  answer: B
  explanation: Un automovilista debe llevar una licencia de conducir válida (o permiso),
    un seguro válido y las tarjetas de registro del vehículo. (N.J.S.A. 39:3-29)
- id: 2
  category: license_system
  question: ¿Con qué rapidez debe un automovilista informar un cambio de dirección
    a la MVC?
  choices:
    A: Dentro de los 30 días
    B: Dentro de dos semanas
    C: Dentro de una semana
    D: Dentro de los 60 días
  answer: C
  explanation: Un automovilista que cambia de dirección debe informar el cambio a
    la MVC dentro de una semana después de mudarse. (N.J.S.A. 39:3-36)
- id: 3
  category: license_system
  question: 'Un automovilista con una licencia válida de otro estado que se muda a
    NJ debe solicitar una licencia de NJ dentro de:'
  choices:
    A: 30 días
    B: 90 días
    C: 60 días o antes de que expire la licencia actual, lo que ocurra primero
    D: Un año
  answer: C
  explanation: Los conductores de otros estados deben presentar su solicitud dentro
    de los 60 días o antes de que expire su licencia actual, lo que ocurra primero.
    Los titulares de licencias comerciales (CDL) tienen 30 días. (N.J.S.A. 39:3-17.1)
- id: 4
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir de Nueva Jersey?
  choices:
    A: Dos años
    B: Cuatro años
    C: Cinco años
    D: Seis años
  answer: B
  explanation: Las licencias de conducir de NJ son válidas por cuatro años.
- id: 5
  category: license_system
  question: ¿Cuál es la edad mínima para obtener un Permiso Especial de Aprendiz (Special
    Learner Permit) en Nueva Jersey?
  choices:
    A: '15'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: Se puede obtener un Permiso Especial de Aprendiz a los 16 años bajo
    la Opción A del programa de Licencia Graduada de Conducir (GDL).
- id: 6
  category: license_system
  question: Bajo el programa GDL, ¿cuántas horas de práctica de manejo se requieren
    antes de un examen de carretera?
  choices:
    A: 25 horas, incluyendo 5 por la noche
    B: 30 horas, incluyendo 10 por la noche
    C: 50 horas, incluyendo 10 durante la oscuridad
    D: 40 horas, incluyendo 15 por la noche
  answer: C
  explanation: Los titulares de permisos GDL deben completar un mínimo de 50 horas
    de práctica de manejo, incluyendo 10 horas durante la oscuridad.
- id: 7
  category: license_system
  question: ¿Cuáles son las restricciones de horario de manejo para los titulares
    de permisos GDL y licencias probatorias menores de 21 años?
  choices:
    A: No conducir entre las 10:00 pm y las 6:00 am
    B: No conducir entre las 11:01 pm y las 5:00 am
    C: No conducir entre la medianoche y las 5:00 am
    D: No conducir entre las 9:00 pm y las 6:00 am
  answer: B
  explanation: Los titulares de permisos GDL y licencias probatorias menores de 21
    años no pueden conducir entre las 11:01 pm y las 5:00 am.
- id: 8
  category: license_system
  question: ¿Qué se les exige a los conductores de GDL menores de 21 años con respecto
    a los teléfonos celulares?
  choices:
    A: Pueden usar solo dispositivos de manos libres
    B: No pueden usar teléfonos celulares portátiles ni de manos libres, ni ningún
      otro dispositivo electrónico
    C: Pueden usar teléfonos celulares solo para emergencias
    D: Pueden enviar mensajes de texto solo en los semáforos en rojo
  answer: B
  explanation: Los titulares de GDL no pueden usar teléfonos celulares portátiles
    ni de manos libres, ni ningún otro dispositivo electrónico mientras conducen.
- id: 9
  category: license_system
  question: ¿Cuántas calcomanías GDL deben exhibirse y dónde?
  choices:
    A: Una calcomanía en la placa trasera
    B: Dos calcomanías, una a cada lado del vehículo
    C: Dos calcomanías, una en la parte superior izquierda de la placa delantera y
      otra en la parte superior izquierda de la placa trasera
    D: Dos calcomanías en la ventana trasera
  answer: C
  explanation: 'Se deben exhibir dos calcomanías rojas reflectantes visibles: una
    en la esquina superior izquierda de la placa delantera y otra en la esquina superior
    izquierda de la placa trasera.'
- id: 10
  category: license_system
  question: ¿Cuál es la edad mínima para supervisar a un titular de un permiso GDL
    como pasajero?
  choices:
    A: 18 años con una licencia válida de NJ
    B: 21 años con una licencia válida de NJ y un mínimo de 3 años de experiencia
      de manejo
    C: 25 años con una licencia válida de NJ
    D: Cualquier conductor con licencia de NJ
  answer: B
  explanation: El conductor supervisor debe tener al menos 21 años, poseer una licencia
    válida de NJ y tener un mínimo de tres años de experiencia de manejo.
- id: 11
  category: license_system
  question: ¿Cuánto tiempo dura el periodo de la licencia de prueba (probationary
    license) antes de que se pueda obtener una licencia básica?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 18 meses
  answer: B
  explanation: Los titulares de una licencia de prueba deben practicar la conducción
    sin supervisión durante al menos un año antes de obtener una licencia básica.
- id: 12
  category: license_system
  question: ¿Cuántos puntos de verificación de identidad se requieren para una licencia
    de conducir de Nueva Jersey?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Todos los solicitantes deben proporcionar 6 puntos de verificación
    de identidad.
- id: 13
  category: license_system
  question: 'Un automovilista con una licencia válida de otro país puede conducir
    en NJ por hasta:'
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Un automovilista con una licencia válida de otro país puede conducir
    con esa licencia por hasta un año. (N.J.A.C. 13:21-8.2(f))
- id: 14
  category: license_system
  question: ¿Cuál es la sanción por alterar una licencia de conducir o presentar una
    licencia alterada?
  choices:
    A: Una advertencia
    B: Una multa de $100
    C: Pérdida del privilegio de conducir, multa de hasta $1,000 y/o encarcelamiento
    D: Solo servicio comunitario
  answer: C
  explanation: Alterar una licencia de conducir o presentar una licencia alterada
    puede resultar en la pérdida del privilegio de conducir, una multa de hasta $1,000
    y/o encarcelamiento.
- id: 15
  category: license_system
  question: Para la Opción C del GDL (Ruta de Adultos), ¿cuál es la edad mínima y
    el periodo de práctica supervisada?
  choices:
    A: 18 años de edad, 6 meses de conducción supervisada
    B: 21 años de edad, 3 meses de conducción supervisada
    C: 21 años de edad, 6 meses de conducción supervisada
    D: 25 años de edad, 1 mes de conducción supervisada
  answer: B
  explanation: La Opción C del GDL (Graduated Driver License) requiere una edad mínima
    de 21 años y al menos 3 meses de práctica de conducción supervisada.
- id: 16
  category: driver_testing
  question: ¿Qué puntuación se necesita para aprobar el examen de conocimientos de
    la MVC de NJ?
  choices:
    A: 70% (35 de 50)
    B: 75% (37 de 50)
    C: 80% (40 de 50)
    D: 90% (45 de 50)
  answer: C
  explanation: El 80 por ciento, o 40 de las 50 preguntas, deben tener respuestas
    correctas.
- id: 17
  category: driver_testing
  question: ¿Cuál es el requisito mínimo de visión para un solicitante de licencia
    básica?
  choices:
    A: Visión 20/20
    B: Visión 20/40
    C: Visión 20/50 con o sin lentes correctivos
    D: Visión 20/70
  answer: C
  explanation: Los solicitantes de licencia básica necesitan una visión de 20/50 con
    o sin lentes correctivos.
- id: 18
  category: driver_testing
  question: ¿Cuántas preguntas tiene el examen de conocimientos de la MVC de NJ?
  choices:
    A: '25'
    B: '40'
    C: 50 más una pregunta de encuesta sobre la donación de órganos
    D: '100'
  answer: C
  explanation: El examen de conocimientos consta de 50 preguntas más una pregunta
    de encuesta sobre la donación de órganos.
- id: 19
  category: driver_responsibility
  question: Según la ley de cinturones de seguridad de NJ, ¿quién es responsable de
    que los pasajeros menores de 18 años usen el cinturón de seguridad?
  choices:
    A: Los propios pasajeros
    B: El conductor
    C: El padre o madre, incluso si no está en el vehículo
    D: Nadie; es opcional para los menores
  answer: B
  explanation: El conductor es responsable de que todos los pasajeros menores de 18
    años usen el cinturón de seguridad.
- id: 20
  category: driver_responsibility
  question: ¿En qué porcentaje mejoran los cinturones de seguridad las posibilidades
    de un automovilista de sobrevivir a un choque?
  choices:
    A: 30 por ciento
    B: 45 por ciento
    C: 60 por ciento
    D: 80 por ciento
  answer: C
  explanation: Los cinturones de seguridad pueden mejorar las posibilidades de un
    automovilista de sobrevivir a un choque en un 60 por ciento.
- id: 21
  category: driver_responsibility
  question: ¿Los niños menores de qué edad deben viajar en un asiento trasero?
  choices:
    A: '5'
    B: '6'
    C: '8'
    D: '10'
  answer: C
  explanation: Todos los niños menores de 8 años deben estar sentados en un asiento
    trasero.
- id: 22
  category: driver_responsibility
  question: 'Los niños menores de 2 años o que pesen menos de 30 libras deben viajar
    en:'
  choices:
    A: Un asiento de seguridad para el automóvil orientado hacia adelante
    B: Un asiento elevado (booster seat)
    C: Un sistema de sujeción infantil orientado hacia atrás con un arnés de cinco
      puntos
    D: Un cinturón de seguridad normal
  answer: C
  explanation: Los niños menores de 2 años y aquellos que pesen menos de 30 libras
    deben viajar en un sistema de sujeción infantil orientado hacia atrás aprobado
    por el gobierno federal con un arnés de cinco puntos.
- id: 23
  category: driver_responsibility
  question: ¿Cuál es la posición correcta de las manos en el volante?
  choices:
    A: Las 10 y las 2 (según las agujas del reloj)
    B: Las 9 y las 3 (según las agujas del reloj)
    C: Las 8 y las 4 (según las agujas del reloj)
    D: Las 12 con una sola mano
  answer: B
  explanation: Un conductor debe sujetar el volante en las posiciones de las 9 y las
    3, manteniendo los pulgares a lo largo de la cara del volante.
- id: 24
  category: driver_responsibility
  question: ¿En qué distancia debería ser capaz de detenerse un conductor a 20 mph?
  choices:
    A: 15 pies
    B: 25 pies
    C: 35 pies
    D: 50 pies
  answer: B
  explanation: Un conductor debería ser capaz de detenerse en un tramo de 25 pies
    a 20 mph.
- id: 25
  category: driver_responsibility
  question: ¿Con cuánta anticipación se debe activar la señal de giro antes de realizar
    un giro?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 200 pies
  answer: C
  explanation: Un conductor debe poner la señal de giro al menos 100 pies antes de
    girar. (N.J.S.A. 39:4-126)
- id: 26
  category: driver_responsibility
  question: ¿Cuál es la señal manual correcta para un giro a la derecha?
  choices:
    A: Mano y brazo extendidos hacia afuera
    B: Mano y brazo hacia arriba
    C: Mano y brazo hacia abajo
    D: Movimiento de saludo
  answer: B
  explanation: 'Giro a la derecha: mano y brazo hacia arriba. Giro a la izquierda:
    mano y brazo extendidos hacia afuera. Parada: mano y brazo hacia abajo.'
- id: 27
  category: driver_responsibility
  question: Al estacionar cuesta arriba en una calle con bordillo (acera), ¿hacia
    qué lado se deben girar las ruedas?
  choices:
    A: Hacia el bordillo
    B: En dirección opuesta al bordillo
    C: Hacia adelante
    D: No importa
  answer: B
  explanation: Al estacionar cuesta arriba, las ruedas deben girarse en dirección
    opuesta al bordillo.
- id: 28
  category: driver_responsibility
  question: ¿Cuál es la distancia máxima permitida entre los neumáticos del vehículo
    y el bordillo al estacionar en paralelo?
  choices:
    A: 12 pulgadas
    B: 6 pulgadas
    C: 18 pulgadas
    D: 3 pulgadas
  answer: B
  explanation: Los neumáticos de un vehículo no deben estar a más de seis pulgadas
    del bordillo cuando se estaciona en paralelo.
- id: 29
  category: driver_responsibility
  question: 'La ley de NJ limita el tiempo de ralentí (motor encendido sin movimiento)
    del vehículo a:'
  choices:
    A: 1 minuto
    B: 3 minutos
    C: 5 minutos
    D: 10 minutos
  answer: B
  explanation: La ley de NJ exige que todos los conductores restrinjan el ralentí
    del vehículo a tres minutos o menos. (N.J.A.C. 7:27-15.8)
- id: 30
  category: driver_responsibility
  question: ¿Cuál es la multa por no quitar la nieve o el hielo de un vehículo antes
    de conducir?
  choices:
    A: $10 a $25
    B: $25 a $75
    C: $100 a $500
    D: $500 a $1,000
  answer: B
  explanation: Se aplican multas de $25 a $75 independientemente de si la nieve o
    el hielo se desprenden. Si la nieve o el hielo desprendidos causan lesiones o
    daños a la propiedad, se pueden imponer multas de hasta $1,500.
- id: 31
  category: driver_responsibility
  question: ¿A qué velocidad el impacto contra un tablero o parabrisas se compara
    con caer desde un edificio de tres pisos?
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: Chocar contra el tablero o el parabrisas a 30 mph es como caer desde
    la parte superior de un edificio de tres pisos.
- id: 32
  category: driver_responsibility
  question: 'Las bolsas de aire (air bags) se inflan a velocidades de hasta:'
  choices:
    A: 50 mph
    B: 100 mph
    C: 150 mph
    D: 200 mph
  answer: D
  explanation: Las bolsas de aire se inflan a velocidades de hasta 200 mph.
- id: 33
  category: driver_responsibility
  question: ¿A qué distancia mínima debe sentarse un conductor del volante?
  choices:
    A: 6 pulgadas
    B: 10 pulgadas desde el centro del volante hasta el centro del esternón
    C: 12 pulgadas
    D: 18 pulgadas
  answer: B
  explanation: Las personas deben mantener al menos 10 pulgadas entre el centro del
    volante y el centro del esternón.
- id: 34
  category: driver_responsibility
  question: ¿A qué velocidad debe circular un vehículo cuando conduce en reversa?
  choices:
    A: 5 a 10 mph
    B: Velocidad de caminata (2 a 4 mph)
    C: 10 a 15 mph
    D: Menos de 20 mph
  answer: B
  explanation: Un vehículo debe conducirse lentamente en reversa, generalmente a velocidad
    de caminata (2 a 4 mph).
- id: 35
  category: driver_responsibility
  question: ¿Qué distancia debe ser capaz de conducir en reversa un automovilista
    durante el examen de manejo?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 200 pies
  answer: C
  explanation: Se le pedirá al automovilista que retroceda el vehículo unos 100 pies
    en línea recta durante el examen de manejo.
- id: 36
  category: driver_responsibility
  question: 'La profundidad mínima de la banda de rodadura para neumáticos seguros
    es:'
  choices:
    A: 1/8 de pulgada
    B: 1/16 de pulgada
    C: 1/4 de pulgada
    D: 1/32 de pulgada
  answer: B
  explanation: Un vehículo no debe conducirse con neumáticos que tengan menos de 1/16
    de pulgada de banda de rodadura (aproximadamente el borde de una moneda de un
    centavo).
- id: 37
  category: driver_responsibility
  question: 'En condiciones normales, una bocina debe poder escucharse desde al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: En condiciones normales, la bocina debe poder escucharse desde al menos
    200 pies. (N.J.S.A. 39:3-69)
- id: 38
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en zonas escolares, distritos comerciales
    o residenciales?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: 25 mph en zonas escolares, distritos comerciales o residenciales.
- id: 39
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en distritos comerciales y residenciales
    suburbanos?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 40 mph
  answer: C
  explanation: 35 mph en distritos comerciales y residenciales suburbanos.
- id: 40
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en carreteras rurales no señalizadas?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 55 mph
  answer: C
  explanation: 50 mph en carreteras rurales no señalizadas.
- id: 41
  category: safe_driving_rules
  question: ¿Qué sucede con las multas por exceder el límite de 65 mph en 10 mph o
    más?
  choices:
    A: Se triplican
    B: Se duplican
    C: Se añade un cargo adicional de $100
    D: Nada especial
  answer: B
  explanation: Los automovilistas pagan multas dobles por exceder el límite de 65
    mph en 10 mph o más. (N.J.S.A. 39:4-98.6)
- id: 42
  category: safe_driving_rules
  question: ¿Cuándo se permite rebasar por la derecha?
  choices:
    A: Nunca
    B: Solo en carreteras con más de un carril en la misma dirección, o cuando un
      vehículo adelante está girando a la izquierda y hay espacio suficiente
    C: En cualquier momento en una autopista
    D: Solo por el acotamiento (hombro)
  answer: B
  explanation: Se permite rebasar por la derecha solo en carreteras con más de un
    carril en la misma dirección, o cuando el vehículo de adelante está girando a
    la izquierda y hay espacio. Nunca rebase por el acotamiento (hombro) derecho.
- id: 43
  category: safe_driving_rules
  question: ¿Qué significa una línea central doble continua?
  choices:
    A: Se permite rebasar con precaución
    B: Se permite rebasar en ambos lados
    C: No se permite rebasar desde ninguna dirección
    D: Solo los camiones pueden rebasar
  answer: C
  explanation: 'Ambas líneas centrales son continuas: No se permite rebasar.'
- id: 44
  category: safe_driving_rules
  question: En una parada de múltiples vías, ¿quién tiene el derecho de paso cuando
    dos automovilistas llegan al mismo tiempo?
  choices:
    A: El automovilista de la izquierda
    B: El automovilista de la derecha
    C: El automovilista que va derecho
    D: El automovilista que gira a la derecha
  answer: B
  explanation: En una parada de múltiples vías, un automovilista debe ceder el paso
    al automovilista de la derecha si ambos llegan al mismo tiempo.
- id: 45
  category: safe_driving_rules
  question: 'Cuando un semáforo no funciona debido a una falla de energía, debe tratarse
    como:'
  choices:
    A: Una señal de ceder el paso
    B: Una señal de precaución
    C: Una parada de 4 vías
    D: Como si la luz estuviera en verde
  answer: C
  explanation: Cuando un semáforo no está iluminado debido a una falla de energía,
    se debe observar como una señal de parada de 4 vías. (N.J.S.A. 39:4-81)
- id: 46
  category: safe_driving_rules
  question: ¿Es legal girar a la derecha en rojo en Nueva Jersey?
  choices:
    A: No, nunca
    B: Sí, después de hacer una parada completa y verificar el tráfico, a menos que
      haya una señal de "No girar en rojo" (No Turn on Red)
    C: Sí, sin detenerse si el camino está despejado
    D: Solo en autopistas
  answer: B
  explanation: La ley de NJ autoriza el giro a la derecha en rojo después de una parada
    completa y de verificar el tráfico, a menos que haya una señal de "No girar en
    rojo" (No Turn on Red). (N.J.S.A. 39:4-115)
- id: 47
  category: safe_driving_rules
  question: ¿Qué debe hacer un automovilista al acercarse a un autobús escolar con
    luces rojas intermitentes?
  choices:
    A: Reducir la velocidad a 25 mph y proceder con precaución
    B: Detenerse al menos a 25 pies de distancia
    C: Detenerse al menos a 15 pies de distancia
    D: Reducir la velocidad a 10 mph y proceder
  answer: B
  explanation: La ley estatal requiere que un automovilista se detenga al menos a
    25 pies de distancia de un autobús escolar con luces rojas intermitentes. (N.J.S.A.
    39:4-128.1)
- id: 48
  category: safe_driving_rules
  question: 'Cuando un autobús escolar se detiene directamente frente a una escuela,
    un automovilista puede rebasarlo a no más de:'
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 25 mph
  answer: B
  explanation: Si un autobús escolar se ha detenido directamente frente a una escuela,
    un automovilista puede rebasarlo desde cualquier dirección a una velocidad de
    no más de 10 mph.
- id: 49
  category: safe_driving_rules
  question: ¿A qué distancia debe detenerse un automovilista de las vías del tren
    cuando las señales de advertencia están activas?
  choices:
    A: 10 pies
    B: 15 pies
    C: 25 pies
    D: 50 pies
  answer: B
  explanation: Un automovilista debe detenerse al menos a 15 pies de un cruce ferroviario
    cuando hay luces rojas intermitentes, campanas sonando, o barreras bajando o bajadas.
    (N.J.S.A. 39:4-127.1)
- id: 50
  category: safe_driving_rules
  question: ¿A qué distancia detrás de un vehículo de emergencia debe mantenerse un
    automovilista?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Un automovilista debe mantenerse al menos a 300 pies detrás de un vehículo
    de emergencia que esté emitiendo señales. (N.J.S.A. 39:4-92)
- id: 51
  category: safe_driving_rules
  question: ¿Cuándo deben utilizarse las luces delanteras?
  choices:
    A: Solo después de la puesta del sol
    B: Entre media hora después de la puesta del sol y media hora antes de la salida
      del sol, cuando la visibilidad es de 500 pies o menos, o cuando se utilicen
      los limpiaparabrisas
    C: Solo cuando está completamente oscuro
    D: Solo cuando llueve
  answer: B
  explanation: Las luces delanteras deben utilizarse entre media hora después de la
    puesta del sol y media hora antes de la salida del sol, cuando la visibilidad
    es de 500 pies o menos, y cuando se utilicen los limpiaparabrisas. (N.J.S.A. 39:3-46)
- id: 52
  category: safe_driving_rules
  question: ¿A qué distancia de un hidrante de incendios está prohibido estacionarse?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 25 pies
  answer: B
  explanation: Está prohibido estacionarse a menos de 10 pies de un hidrante de incendios.
    (N.J.S.A. 39:4-138)
- id: 53
  category: safe_driving_rules
  question: ¿A qué distancia de un cruce peatonal en una intersección está prohibido
    estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 25 pies
    D: 50 pies
  answer: C
  explanation: Está prohibido estacionarse a menos de 25 pies de un cruce peatonal
    en una intersección. (N.J.S.A. 39:4-138)
- id: 54
  category: safe_driving_rules
  question: ¿A qué distancia de una señal de alto (stop) está prohibido estacionarse?
  choices:
    A: 25 pies
    B: 35 pies
    C: 50 pies
    D: 75 pies
  answer: C
  explanation: Está prohibido estacionarse a menos de 50 pies de una señal de alto.
    (N.J.S.A. 39:4-138)
- id: 55
  category: safe_driving_rules
  question: ¿A qué distancia de un cruce de ferrocarril está prohibido estacionarse?
  choices:
    A: 25 pies
    B: 35 pies
    C: 50 pies
    D: 75 pies
  answer: C
  explanation: Está prohibido estacionarse a menos de 50 pies de un cruce de ferrocarril.
    (N.J.S.A. 39:4-138)
- id: 56
  category: safe_driving_rules
  question: ¿Es ilegal que un vehículo esté estacionado a más de cuántas pulgadas
    del bordillo (acera)?
  choices:
    A: 3 pulgadas
    B: 6 pulgadas
    C: 12 pulgadas
    D: 18 pulgadas
  answer: B
  explanation: Es ilegal que un vehículo esté estacionado a más de seis pulgadas del
    bordillo. (N.J.S.A. 39:4-135)
- id: 57
  category: safe_driving_rules
  question: ¿Cuál es la multa por una primera infracción por el uso de un teléfono
    celular portátil mientras se conduce?
  choices:
    A: $100-$200
    B: $200-$400
    C: $400-$600
    D: $600-$800
  answer: B
  explanation: 'La multa por una primera infracción es de $200-$400. Segunda infracción:
    $400-$600. Tercera infracción: $600-$800. (N.J.S.A. 39:4-97.3)'
- id: 58
  category: safe_driving_rules
  question: ¿Qué exige la ley "Move Over" (hacerse a un lado)?
  choices:
    A: Moverse a un lado para todos los vehículos
    B: Cambiar de carril alejándose de vehículos de emergencia estacionarios, grúas
      o vehículos averiados, o reducir la velocidad si el cambio de carril es imposible
    C: Moverse al carril derecho en todo momento
    D: Ceder el paso al tráfico que se incorpora
  answer: B
  explanation: 'La ley "Move Over" exige que los conductores cambien de carril alejándose
    de los vehículos de emergencia estacionarios, o reduzcan la velocidad si no es
    posible cambiar de carril. Multa: $100-$500. (N.J.S.A. 39:4-92.2)'
- id: 59
  category: safe_driving_rules
  question: ¿A qué distancia de un vehículo del departamento de bomberos en servicio
    debe evitar estacionarse?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Un conductor nunca debe estacionarse a menos de 200 pies de un vehículo
    del departamento de bomberos en servicio.
- id: 60
  category: safe_driving_rules
  question: 'Al acercarse a un camión de postres helados con luces rojas intermitentes,
    un conductor debe:'
  choices:
    A: Reducir la velocidad a 25 mph
    B: Detenerse, luego pasar a no más de 15 mph
    C: Detenerse, luego pasar a no más de 10 mph
    D: Solo ceder el paso a los peatones
  answer: B
  explanation: Un conductor debe detenerse, ceder el paso a las personas que cruzan,
    estar atento a los niños y pasar a no más de 15 mph. (N.J.S.A. 39:4-128.4)
- id: 61
  category: safe_driving_rules
  question: ¿Cuál es la sanción por no detenerse ante un peatón en un cruce peatonal?
  choices:
    A: Multa de hasta $200 y 2 puntos
    B: Multa de hasta $500, hasta 25 días de cárcel, servicio comunitario, suspensión
      de la licencia de hasta 6 meses y 2 puntos
    C: Multa de solo $100
    D: Solo una advertencia
  answer: B
  explanation: No detenerse conlleva una multa de hasta $500, hasta 25 días de cárcel,
    servicio comunitario, suspensión de la licencia de hasta 6 meses y 2 puntos. (N.J.S.A.
    39:4-36)
- id: 62
  category: safe_driving_rules
  question: 'Conducir por propiedad privada para evitar una señal o semáforo de tráfico
    es:'
  choices:
    A: Legal si se hace de manera segura
    B: Una infracción de tránsito
    C: Solo es ilegal en zonas residenciales
    D: Permitido en emergencias
  answer: B
  explanation: Conducir por propiedad privada para evitar una señal o semáforo de
    tráfico es una infracción de tránsito. (N.J.S.A. 39:4-66.2)
- id: 63
  category: safe_driving_rules
  question: ¿La ley de NJ prohíbe el tintado adicional en qué ventanas del vehículo?
  choices:
    A: Solo en la ventana trasera
    B: En todas las ventanas
    C: En el parabrisas y las ventanas laterales delanteras
    D: Solo en la ventana del lado del conductor
  answer: C
  explanation: La ley de NJ prohíbe el tintado adicional en el parabrisas y las ventanas
    laterales delanteras. (N.J.S.A. 39:3-74)
- id: 64
  category: safe_driving_rules
  question: 'Cuando un autobús escolar está al otro lado de una carretera de doble
    carril con una isleta de seguridad, el conductor debe:'
  choices:
    A: Detenerse por completo
    B: Reducir la velocidad a 10 mph
    C: Continuar al límite de velocidad
    D: Reducir la velocidad a 25 mph
  answer: B
  explanation: Al viajar por una carretera de doble carril, el conductor debe reducir
    la velocidad a 10 mph si se encuentra al otro lado de una isleta de seguridad
    o una mediana elevada.
- id: 65
  category: safe_driving_rules
  question: ¿A qué distancia debe detenerse un conductor al acercarse a una intersección?
  choices:
    A: A menos de 10 pies del cruce peatonal más cercano
    B: A menos de 5 pies del cruce peatonal o línea de parada más cercana
    C: Al menos a 15 pies de la intersección
    D: En la línea de parada o 25 pies antes de la intersección
  answer: B
  explanation: Un conductor debe detener el vehículo por completo a menos de cinco
    pies del cruce peatonal o la línea de parada más cercana.
- id: 66
  category: defensive_driving
  question: ¿Qué es la regla de los tres segundos o más?
  choices:
    A: Mirar tres segundos hacia adelante antes de cambiar de carril
    B: Esperar tres segundos después de que el semáforo cambie a verde antes de avanzar
    C: Mantener al menos tres segundos de distancia de seguimiento detrás del vehículo
      de adelante
    D: Señalizar tres segundos antes de girar
  answer: C
  explanation: Elija un objeto fijo adelante. Si pasan al menos tres segundos antes
    de que su vehículo pase por el mismo objeto después del vehículo de adelante,
    tiene suficiente distancia para una parada repentina.
- id: 67
  category: defensive_driving
  question: 'En condiciones climáticas adversas, la regla de seguimiento de los tres
    segundos debe aumentarse a:'
  choices:
    A: Tres segundos
    B: Cuatro o más segundos
    C: Dos segundos
    D: Seis segundos exactamente
  answer: B
  explanation: Durante el mal tiempo, el intervalo de tiempo debe aumentarse a cuatro
    o más segundos.
- id: 68
  category: defensive_driving
  question: 'La regla general para la distancia de seguimiento es:'
  choices:
    A: La longitud de dos vehículos por cada 10 mph
    B: La longitud de un vehículo (unos 20 pies) por cada 10 mph de velocidad
    C: La longitud de un vehículo por cada 20 mph
    D: La longitud de tres vehículos a todas las velocidades
  answer: B
  explanation: La regla general más utilizada es mantener la longitud de un vehículo
    de distancia (unos 20 pies) por cada 10 millas por hora de velocidad.
- id: 69
  category: defensive_driving
  question: ¿Cuál es la distancia total de parada a 60 mph en condiciones diurnas
    normales?
  choices:
    A: 247 pies
    B: 302 pies
    C: 343 pies
    D: 409 pies
  answer: C
  explanation: 'A 60 mph: distancia de reacción (66 pies) + distancia de frenado (277
    pies) = 343 pies de distancia total de parada.'
- id: 70
  category: defensive_driving
  question: ¿Cuántos pies por segundo recorre un vehículo a 60 mph?
  choices:
    A: 44 pies
    B: 66 pies
    C: 88 pies
    D: 110 pies
  answer: C
  explanation: Un vehículo recorre 88 pies por segundo a 60 mph.
- id: 71
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (hydroplaning)?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Las superficies mojadas de las carreteras pueden causar que los neumáticos
    hidroplaneen a partir de unas 35 mph. Después de las 55 mph, los neumáticos pueden
    perder totalmente el contacto con la superficie de la carretera.
- id: 72
  category: defensive_driving
  question: 'Al derrapar, un automovilista debe:'
  choices:
    A: Frenar bruscamente
    B: Girar el volante en dirección opuesta al derrape
    C: Girar en la misma dirección en la que derrapa la parte trasera del vehículo,
      sin girar el volante en exceso
    D: Acelerar
  answer: C
  explanation: Para evitar un trompo, el automovilista debe girar en la dirección
    en la que derrapa la parte trasera del vehículo, sin girar el volante en exceso.
    Mire en la dirección a la que desea ir.
- id: 73
  category: defensive_driving
  question: ¿Qué causa la hipnosis de carretera (highway hypnosis)?
  choices:
    A: Conducir demasiado rápido
    B: Mirar cualquier objeto fijo durante más de unos pocos segundos en viajes largos
    C: Conducir con las ventanillas cerradas
    D: Música a alto volumen
  answer: B
  explanation: La hipnosis de carretera se puede evitar no mirando ningún objeto fijo
    durante más de unos pocos segundos. Descanse cada dos horas.
- id: 74
  category: defensive_driving
  question: ¿Qué es la Ley de Maggie (Maggie's Law)?
  choices:
    A: Una ley sobre el uso de teléfonos celulares
    B: Una ley que establece que conducir estando fatigado se considera imprudencia
      bajo el estatuto de homicidio vehicular
    C: Una ley sobre el cinturón de seguridad
    D: Una ley sobre el límite de velocidad
  answer: B
  explanation: La Ley de Maggie declara ilegal conducir a sabiendas estando afectado
    por la falta de sueño y establece que conducir fatigado se considera imprudencia
    bajo el estatuto de homicidio vehicular. (N.J.S.A. 2C:11-5)
- id: 75
  category: defensive_driving
  question: Si las ruedas de un vehículo se desvían hacia el arcén (shoulder), ¿qué
    debe hacer el automovilista?
  choices:
    A: Regresar al pavimento de inmediato
    B: Permanecer en el arcén, soltar el acelerador, reducir la velocidad a 25 mph
      o menos y luego girar un cuarto de vuelta para regresar a la carretera
    C: Frenar bruscamente
    D: Acelerar para volver a la carretera
  answer: B
  explanation: Permanezca en el arcén y suelte el acelerador. Después de reducir la
    velocidad a 25 mph o menos, gire el volante un cuarto de vuelta hacia la calzada.
- id: 76
  category: defensive_driving
  question: 'En condiciones de niebla, las luces delanteras deben estar en:'
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Apagadas
  answer: B
  explanation: En la niebla, las luces delanteras deben mantenerse en luces bajas
    y deben encenderse las luces antiniebla si el vehículo las tiene.
- id: 77
  category: defensive_driving
  question: ¿Cuál es la distancia de seguimiento recomendada en carreteras cubiertas
    de nieve?
  choices:
    A: Tres segundos
    B: Cuatro segundos
    C: Seis segundos o más
    D: Ocho segundos
  answer: C
  explanation: Una buena regla en carreteras cubiertas de nieve es mantener una distancia
    de seguimiento de seis segundos o más.
- id: 78
  category: defensive_driving
  question: 'Si el pedal del acelerador se queda pegado, el automovilista debe:'
  choices:
    A: Apagar el motor de inmediato
    B: Bombear el pedal del acelerador
    C: Mantener la vista en la carretera, cambiar rápidamente a punto muerto (neutral),
      dirigirse a un lugar seguro y apagar el motor
    D: Poner el freno de mano
  answer: C
  explanation: Si el pedal del acelerador se queda pegado, mantenga la vista en la
    carretera, cambie rápidamente a punto muerto (neutral), diríjase a una zona segura
    fuera de la calzada, apague el motor y pida ayuda.
- id: 79
  category: defensive_driving
  question: 'Cuando un vehículo se apaga en las vías del tren, el automovilista debe:'
  choices:
    A: Intentar arrancar el motor de nuevo
    B: Esperar en el coche a que llegue ayuda
    C: Salir y alejarse, corriendo en un ángulo de 45 grados en la dirección de donde
      viene el tren
    D: Empujar el coche fuera de las vías
  answer: C
  explanation: Salga y aléjese. Si se acerca un tren, corra en un ángulo de 45 grados
    alejándose de las vías pero en la dirección de donde viene el tren para evitar
    los escombros que salgan volando.
- id: 80
  category: defensive_driving
  question: ¿Cuál es la fórmula estándar para la prevención de choques?
  choices:
    A: Parar, Mirar, Escuchar
    B: Estar alerta, Estar preparado, Actuar a tiempo
    C: Reducir la velocidad, Moverse a un lado, Mantenerse alerta
    D: Escanear, Identificar, Predecir
  answer: B
  explanation: 'La fórmula para la prevención de choques es: Estar alerta (nunca piense
    que los demás no cometerán errores), Estar preparado (aprenda qué hacer), Actuar
    a tiempo (no entre en pánico).'
- id: 81
  category: defensive_driving
  question: ¿Cuánto tiempo puede flotar un vehículo con las ventanas y puertas cerradas
    después de caer al agua?
  choices:
    A: 30 segundos a 1 minuto
    B: 1 a 3 minutos
    C: 3 a 10 minutos
    D: 15 a 20 minutos
  answer: C
  explanation: Un vehículo con las ventanas y puertas cerradas flotará durante aproximadamente
    tres a diez minutos.
- id: 82
  category: defensive_driving
  question: 'Si los frenos fallan, un conductor debe primero:'
  choices:
    A: Apagar el motor
    B: Cambiar a una marcha más baja y bombear el pedal del freno rápida y fuertemente
    C: Dirigirse hacia una zanja
    D: Abrir la puerta y saltar
  answer: B
  explanation: Cambie a una marcha más baja y bombee el pedal del freno rápida y fuertemente.
    Si eso no funciona, use el freno de estacionamiento mientras mantiene presionado
    el liberador del freno.
- id: 83
  category: defensive_driving
  question: 'Durante el reventón de un neumático, un conductor debe:'
  choices:
    A: Frenar bruscamente
    B: Sujetar el volante con firmeza, mantener el vehículo recto, quitar el pie del
      acelerador y avanzar por inercia hasta detenerse de forma segura
    C: Acelerar para mantener el control
    D: Girar el volante bruscamente
  answer: B
  explanation: Sujete el volante con firmeza, mantenga el vehículo recto, retire el
    pie del acelerador pero no frene. Avance por inercia hasta detenerse y diríjase
    a una zona segura.
- id: 84
  category: defensive_driving
  question: 'Las multas en zonas de construcción o de obras son:'
  choices:
    A: Las mismas que en zonas normales
    B: El doble
    C: El triple
    D: Aumentadas por $100
  answer: B
  explanation: Las multas de tráfico se duplican por infracciones de vehículos motorizados
    cometidas en zonas de construcción de carreteras. (N.J.S.A. 39:4-203.5)
- id: 85
  category: defensive_driving
  question: 'Al detenerse por la noche a 60 mph usando las luces bajas, la distancia
    total de parada es aproximadamente:'
  choices:
    A: 302 pies
    B: 343 pies
    C: 409 pies
    D: 530 pies
  answer: C
  explanation: 'A 60 mph por la noche (tiempo de reacción de 1.5 segundos): distancia
    de reacción 132 pies + distancia de frenado 277 pies = 409 pies.'
- id: 86
  category: defensive_driving
  question: ¿Qué tan adelante debe mirar un conductor mientras conduce en una ciudad
    a 25 mph?
  choices:
    A: Aproximadamente media cuadra
    B: Aproximadamente una cuadra adelante (12 segundos)
    C: Al menos un cuarto de milla
    D: Solo al auto de adelante
  answer: B
  explanation: Un conductor debe mirar al menos 12 segundos hacia adelante. Al conducir
    a 25 mph en una ciudad, esto significa aproximadamente una cuadra adelante.
- id: 87
  category: defensive_driving
  question: 'Cuándo se pueden usar neumáticos para nieve con clavos en New Jersey:'
  choices:
    A: Del 1 de octubre al 31 de marzo
    B: Del 15 de noviembre al 1 de abril
    C: Del 1 de diciembre al 15 de marzo
    D: Todo el año
  answer: B
  explanation: En NJ, los conductores pueden usar neumáticos para nieve con clavos
    entre el 15 de noviembre y el 1 de abril.
- id: 88
  category: defensive_driving
  question: ¿A qué distancia hacia atrás se debe colocar un dispositivo de advertencia
    durante una parada de emergencia en la carretera?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies (aproximadamente 120 pasos)
    D: 500 pies
  answer: C
  explanation: Coloque un dispositivo de advertencia al menos a 300 pies de distancia
    (aproximadamente 120 pasos).
- id: 89
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de BAC para conductores de 21 años o más en New
    Jersey?
  choices:
    A: 0.05%
    B: 0.08%
    C: 0.10%
    D: 0.04%
  answer: B
  explanation: En NJ, es ilegal conducir con un BAC de 0.08% o superior. (N.J.S.A.
    39:4-50)
- id: 90
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de BAC para conductores menores de 21 años?
  choices:
    A: 0.00%
    B: 0.01%
    C: 0.02%
    D: 0.05%
  answer: B
  explanation: Para personas menores de 21 años, es ilegal conducir con un BAC de
    0.01% o superior. (N.J.S.A. 39:4-50.14)
- id: 91
  category: alcohol_drugs_health
  question: ¿Qué es lo único que puede hacer que una persona recupere la sobriedad?
  choices:
    A: Café
    B: Una ducha fría
    C: Aire fresco
    D: Tiempo
  answer: D
  explanation: Lo único que puede hacer que una persona recupere la sobriedad es el
    tiempo. El cuerpo elimina el alcohol lentamente.
- id: 92
  category: alcohol_drugs_health
  question: '¿Cuánto alcohol hay en cada uno de estos: 12 oz de cerveza, 5 oz de vino,
    1.5 oz de licor de 86 grados (86-proof)?'
  choices:
    A: Cantidades diferentes en cada uno
    B: Aproximadamente lo mismo - cerca de 1/2 onza de alcohol
    C: La cerveza tiene la mayor cantidad
    D: El vino tiene la menor cantidad
  answer: B
  explanation: Cada bebida contiene aproximadamente 1/2 onza de alcohol. No es lo
    que usted bebe, sino cuántas bebidas consume.
- id: 93
  category: alcohol_drugs_health
  question: 'Con un nivel de alcohol en sangre (BAC) ligeramente superior al 0.05%,
    el riesgo de causar un choque:'
  choices:
    A: Se mantiene igual
    B: Se duplica
    C: Se triplica
    D: Se cuadruplica
  answer: B
  explanation: Con un BAC ligeramente superior al 0.05%, el riesgo se duplica. Al
    0.10% es 6 veces mayor. Al 0.15% es 25 veces mayor.
- id: 94
  category: alcohol_drugs_health
  question: ¿Qué es la ley de consentimiento implícito de Nueva Jersey?
  choices:
    A: Consentimiento para el registro de un vehículo
    B: Al usar las carreteras de NJ, los automovilistas aceptan someterse a una prueba
      de aliento después de ser arrestados por DUI
    C: Consentimiento para una prueba de sobriedad en el campo
    D: Consentimiento para una extracción de sangre en cualquier momento
  answer: B
  explanation: La ley de consentimiento implícito de NJ significa que los automovilistas
    han aceptado someterse a una prueba de aliento realizada por las autoridades después
    de un arresto por DUI. (N.J.S.A. 39:4-50.4a)
- id: 95
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción por negarse a una prueba de aliento en Nueva Jersey?
  choices:
    A: Una advertencia
    B: Pérdida de los privilegios de conducir, recargo de $1,000 anuales por 3 años
      e instalación de un dispositivo de interbloqueo de encendido
    C: Una multa de $100
    D: Solo una suspensión de 30 días
  answer: B
  explanation: La negativa resulta en la pérdida de los privilegios de conducir, un
    recargo por infracción de $1,000 anuales durante tres años y un dispositivo de
    interbloqueo de encendido.
- id: 96
  category: alcohol_drugs_health
  question: Después del alcohol, ¿cuál es la droga que se encuentra con más frecuencia
    en conductores involucrados en choques?
  choices:
    A: Cocaína
    B: Analgésicos recetados
    C: Marihuana
    D: Metanfetamina
  answer: C
  explanation: Después del alcohol, la marihuana es la droga que se encuentra con
    más frecuencia en conductores involucrados en choques.
- id: 97
  category: alcohol_drugs_health
  question: 'Los cuatro factores que determinan el nivel de alcohol en sangre (BAC)
    son:'
  choices:
    A: Tipo de alcohol, género, hora del día, estado de ánimo
    B: Cantidad de alcohol consumido, peso corporal, rapidez con la que se consumen
      las bebidas, comida ingerida
    C: Tipo de alcohol, altura, nivel de ejercicio, sueño
    D: Género, medicamentos, temperatura, altitud
  answer: B
  explanation: 'El BAC se determina por: la cantidad consumida, el peso corporal,
    la rapidez con la que se consumen las bebidas y la comida ingerida.'
- id: 98
  category: alcohol_drugs_health
  question: ¿Qué porcentaje de alcohol se elimina a través del aliento, la orina y
    el sudor?
  choices:
    A: 5%
    B: 10%
    C: 20%
    D: 50%
  answer: B
  explanation: El 90% del alcohol es oxidado por el hígado. El otro 10% se elimina
    en el aliento, la orina y el sudor.
- id: 99
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción de DUI con un BAC de 0.08%
    a menos de 0.10%?
  choices:
    A: $100-$200
    B: $250-$400
    C: $500-$1,000
    D: $1,000-$2,000
  answer: B
  explanation: 'Primera infracción de DUI con BAC de 0.08% a <0.10%: multa de $250-$400,
    más varios recargos y tarifas.'
- id: 100
  category: penalties_and_points
  question: ¿Cuál es el recargo anual por una condena de DUI?
  choices:
    A: $250 anuales por 2 años
    B: $500 anuales por 3 años
    C: $1,000 anuales por 3 años
    D: $1,500 anuales por 5 años
  answer: C
  explanation: Recargo anual de $1,000 durante tres años por la primera y segunda
    infracción de DUI. (N.J.S.A. 17:29A-35)
- id: 101
  category: penalties_and_points
  question: ¿Cuál es la sanción por conducir sin seguro (primera infracción)?
  choices:
    A: Multa de $100
    B: Multa de $300-$1,000, suspensión de la licencia por 1 año y servicio comunitario
    C: Solo una advertencia
    D: Multa de $50 y 2 puntos
  answer: B
  explanation: 'Primera infracción: multa de $300-$1,000, suspensión de la licencia
    por 1 año, recargo de $250 anuales durante 3 años y servicio comunitario.'
- id: 102
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por exceder el límite de velocidad entre 1
    y 14 mph?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: 'Exceder la velocidad máxima entre 1 y 14 mph por encima del límite:
    2 puntos.'
- id: 103
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por conducción temeraria?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: D
  explanation: 'Conducción temeraria: 5 puntos. (N.J.S.A. 39:4-96)'
- id: 104
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por seguir a otro vehículo demasiado cerca
    (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: D
  explanation: 'Seguir demasiado cerca (tailgating): 5 puntos. (N.J.S.A. 39:4-89)'
- id: 105
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por rebasar incorrectamente a un autobús escolar?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: D
  explanation: 'Rebasar incorrectamente a un autobús escolar: 5 puntos. (N.J.S.A.
    39:4-128.1)'
- id: 106
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por abandonar la escena de un accidente con
    lesiones personales?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 5 puntos
    D: 8 puntos
  answer: D
  explanation: 'Abandonar la escena de un accidente con lesiones personales: 8 puntos.
    Sin lesiones: 2 puntos. (N.J.S.A. 39:4-129)'
- id: 107
  category: penalties_and_points
  question: ¿Cuántos puntos se restan cada año que un automovilista pasa sin cometer
    una infracción?
  choices:
    A: 1 punto
    B: 2 puntos
    C: Hasta 3 puntos
    D: 5 puntos
  answer: C
  explanation: Se restarán hasta tres puntos cada año que un automovilista pase sin
    cometer una infracción ni recibir una suspensión. (N.J.S.A. 39:5-30.9)
- id: 108
  category: penalties_and_points
  question: ¿A partir de cuántos puntos acumulados se le aplica un recargo a un automovilista?
  choices:
    A: 4 o más
    B: 6 o más
    C: 8 o más
    D: 12 o más
  answer: B
  explanation: Los automovilistas que acumulen seis o más puntos en un plazo de tres
    años están sujetos a un recargo de $150 por los seis puntos y $25 por cada punto
    adicional.
- id: 109
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por participar en carreras en una carretera?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: D
  explanation: 'Carreras en carretera: 5 puntos. (N.J.S.A. 39:4-52)'
- id: 110
  category: penalties_and_points
  question: Un infractor habitual es un automovilista cuya licencia ha sido suspendida
    ¿cuántas veces en cuántos años?
  choices:
    A: Dos veces en dos años
    B: Tres veces en tres años
    C: Cuatro veces en cinco años
    D: Cinco veces en diez años
  answer: B
  explanation: Un infractor habitual es un automovilista cuya licencia de conducir
    ha sido suspendida tres veces en tres años.
- id: 111
  category: penalties_and_points
  question: ¿Cuál es la sanción por darse a la fuga tras un accidente que involucre
    lesiones corporales (primera infracción)?
  choices:
    A: Multa de $500 y 30 días de cárcel
    B: Multa de $2,500-$5,000, hasta 180 días de cárcel y pérdida de la licencia por
      1 año
    C: Multa de $1,000 y suspensión de 6 meses
    D: Multa de $5,000 y pérdida permanente de la licencia
  answer: B
  explanation: 'Darse a la fuga tras un accidente con lesiones corporales: multa de
    $2,500-$5,000, hasta 180 días de cárcel y pérdida de la licencia por 1 año para
    la primera infracción. Infracción posterior: pérdida permanente de la licencia.'
- id: 112
  category: penalties_and_points
  question: ¿Cuántos puntos se eliminan al completar un Curso de Manejo Defensivo?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Se eliminarán dos puntos de los puntos acumulados al completar un curso
    de manejo defensivo. (N.J.S.A. 39:5-30.9)
- id: 113
  category: penalties_and_points
  question: ¿Cuántos puntos se eliminan al completar el Programa de Mejora del Conductor?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: A un automovilista que complete un Programa de Mejora del Conductor
    se le eliminarán tres puntos.
- id: 114
  category: penalties_and_points
  question: ¿Con qué frecuencia puede la MVC reconocer un curso de manejo defensivo
    para la reducción de puntos?
  choices:
    A: Una vez cada 2 años
    B: Una vez cada 3 años
    C: Una vez cada 5 años
    D: Solo una vez
  answer: C
  explanation: La MVC solo reconocerá un curso de manejo defensivo una vez cada cinco
    años para la reducción de puntos. (N.J.S.A. 39:5-30.9)
- id: 115
  category: penalties_and_points
  question: ¿Cuál es la multa por la primera infracción de conducir con la licencia
    suspendida?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: B
  explanation: 'Primera infracción por conducir con la licencia suspendida: multa
    de $500 y hasta seis meses adicionales de suspensión.'
- id: 116
  category: penalties_and_points
  question: ¿En cuántos días se debe enviar un informe de accidente a la MVC si no
    se presenta un informe policial?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Se debe enviar un informe por escrito a la MVC dentro de los 10 días
    si no se presenta un informe policial.
- id: 117
  category: penalties_and_points
  question: 'Los accidentes deben reportarse a la policía cuando los daños superan:'
  choices:
    A: $200
    B: $500
    C: Cualquier cantidad si hay lesiones personales
    D: Tanto B como C
  answer: D
  explanation: La ley de NJ exige que los automovilistas notifiquen a la policía sobre
    accidentes que involucren lesiones, muerte o daños al vehículo o propiedad superiores
    a $500.
- id: 118
  category: penalties_and_points
  question: 'Puntos por infracciones fuera del estado añadidos al registro de NJ:'
  choices:
    A: 1 punto
    B: 2 puntos
    C: Los mismos que el equivalente de la infracción en NJ
    D: Ninguno
  answer: B
  explanation: Se añadirán dos puntos al registro de conducir por infracciones de
    tráfico cometidas en otros estados.
- id: 119
  category: sharing_the_road
  question: La Ley de Adelantamiento Seguro requiere que los conductores dejen al
    menos ¿cuánto espacio al adelantar a un ciclista en una carretera de un solo carril?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: En una carretera de un solo carril, los conductores deben permitir
    una zona de seguridad de al menos 4 pies al adelantar a usuarios vulnerables de
    la vía. (N.J.S.A. 39:4-92.4)
- id: 120
  category: sharing_the_road
  question: Si no es posible dejar 4 pies de espacio para adelantar, ¿qué debe hacer
    un conductor?
  choices:
    A: Tocar la bocina y adelantar rápidamente
    B: Reducir la velocidad a 25 mph y estar preparado para detenerse hasta que sea
      seguro adelantar
    C: Detenerse por completo hasta que el ciclista se mueva
    D: Conducir por el acotamiento (arcén)
  answer: B
  explanation: Si no es posible dejar 4 pies, los conductores deben reducir la velocidad
    a 25 mph y estar preparados para detenerse hasta que puedan adelantar de manera
    segura.
- id: 121
  category: sharing_the_road
  question: ¿A qué vehículos se les debe ceder siempre el derecho de paso cuando se
    reincorporan al tráfico?
  choices:
    A: Solo patrullas de policía
    B: Autobuses y vehículos postales
    C: Taxis y vehículos de transporte compartido
    D: Solo camiones
  answer: B
  explanation: Los automovilistas deben ceder el paso a los autobuses y vehículos
    postales cuando se reincorporan al flujo del tráfico.
- id: 122
  category: sharing_the_road
  question: ¿Cuál es la causa más común de los choques de motocicletas?
  choices:
    A: Velocidad excesiva de los motociclistas
    B: Malas condiciones de la carretera
    C: La falta de un automovilista para detectar y reconocer motocicletas en el tráfico
    D: Falla mecánica
  answer: C
  explanation: La falta de un automovilista para detectar y reconocer motocicletas
    en el tráfico es la causa más común de los choques de motocicletas.
- id: 123
  category: sharing_the_road
  question: ¿Cuánto tiempo más pueden tardar en detenerse los camiones en condiciones
    climáticas adversas?
  choices:
    A: 10 por ciento más
    B: 25 por ciento más
    C: 50 por ciento más
    D: 75 por ciento más
  answer: B
  explanation: Durante el mal tiempo, un camión, un remolque de tractor o un autobús
    puede tardar hasta un 25 por ciento más en detenerse.
- id: 124
  category: sharing_the_road
  question: ¿A qué distancia se encuentra la zona prohibida trasera (punto ciego)
    detrás de un camión grande?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: C
  explanation: La zona prohibida trasera (no-zone) detrás de un camión puede extenderse
    hasta 200 pies.
- id: 125
  category: sharing_the_road
  question: 'Un automovilista debe detenerse al acercarse a una persona que usa un
    bastón blanco o metálico porque:'
  choices:
    A: Es una cortesía
    B: La persona tiene una discapacidad visual y la ley lo exige
    C: La persona es anciana
    D: Se recomienda pero no es obligatorio
  answer: B
  explanation: La ley exige que todos los automovilistas se detengan ante personas
    ciegas que utilicen un bastón blanco o metálico, o que vayan acompañadas de un
    perro guía. (N.J.S.A. 39:4-37.1)
- id: 126
  category: sharing_the_road
  question: ¿La tasa de mortalidad de peatones salta del 5% al 85% cuando un vehículo
    pasa de qué velocidad a qué velocidad?
  choices:
    A: 15 mph a 35 mph
    B: 20 mph a 40 mph
    C: 25 mph a 45 mph
    D: 30 mph a 50 mph
  answer: B
  explanation: Los choques entre vehículos y peatones tienen una tasa de mortalidad
    del 5% a 20 mph, pero la tasa salta al 85% a 40 mph.
- id: 127
  category: sharing_the_road
  question: Al detenerse ante un cruce de peatones en una carretera de varios carriles,
    ¿a qué distancia aproximada antes del cruce debe detenerse?
  choices:
    A: 10 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Deténgase aproximadamente 30 pies antes de un cruce de peatones en
    una carretera de varios carriles para evitar bloquear la visibilidad de los automovilistas
    en el segundo carril.
- id: 128
  category: sharing_the_road
  question: 'Al acercarse a un jinete a caballo, un automovilista debe reducir la
    velocidad a:'
  choices:
    A: 10 mph o menos
    B: 15 mph o menos
    C: 25 mph o menos
    D: 35 mph o menos
  answer: C
  explanation: Al acercarse o pasar a un jinete a caballo o un vehículo tirado por
    caballos, los automovilistas deben reducir la velocidad a 25 mph o menos. (N.J.S.A.
    39:4-72)
- id: 129
  category: sharing_the_road
  question: ¿Cuánto puede tardar en detenerse un tren de carga que viaja a 55 mph?
  choices:
    A: 500 pies
    B: Media milla
    C: Una milla o más
    D: Dos millas
  answer: C
  explanation: Un tren de carga que viaja a 55 mph puede tardar una milla o más en
    detenerse.
- id: 130
  category: sharing_the_road
  question: ¿A qué distancia de un cruce de ferrocarril no se debe rebasar a otros
    vehículos?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: No rebase a otros vehículos a menos de 100 pies de un cruce de ferrocarril.
- id: 131
  category: sharing_the_road
  question: ¿Qué estatus tienen los ciclistas, patinadores y patinadores en línea
    bajo la ley de Nueva Jersey (NJ)?
  choices:
    A: Tienen derechos limitados en las carreteras
    B: Los mismos derechos y responsabilidades que los vehículos motorizados
    C: Siempre deben ceder el paso a los vehículos motorizados
    D: Solo pueden usar carriles para bicicletas
  answer: B
  explanation: Según la ley de NJ, los ciclistas, patinadores y patinadores en línea
    tienen los mismos derechos y responsabilidades que los vehículos motorizados.
- id: 132
  category: sharing_the_road
  question: ¿Cuál es el límite de velocidad para los ciclomotores (mopeds) en Nueva
    Jersey?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: Los conductores de ciclomotores no pueden exceder las 25 mph.
- id: 133
  category: sharing_the_road
  question: ¿Qué es un cruce de peatones no marcado?
  choices:
    A: Un cruce de peatones con pintura descolorida
    B: Un cruce de peatones en cada intersección, incluso si no está marcado con líneas
      pintadas
    C: Una zona para cruzar la calle imprudentemente (jaywalking)
    D: Un cruce de peatones en propiedad privada
  answer: B
  explanation: Hay un cruce de peatones en cada intersección, incluso si no está marcado.
    Esto se conoce como un cruce de peatones no marcado.
- id: 134
  category: vehicle_information
  question: 'El seguro de responsabilidad civil para vehículos motorizados es:'
  choices:
    A: Opcional en Nueva Jersey
    B: Obligatorio en Nueva Jersey
    C: Solo requerido para vehículos nuevos
    D: Solo requerido para vehículos comerciales
  answer: B
  explanation: El seguro de responsabilidad civil para vehículos motorizados es obligatorio
    en Nueva Jersey. Todo vehículo registrado debe tenerlo. (N.J.S.A. 39:6B-1)
- id: 135
  category: vehicle_information
  question: ¿Cuánto tiempo después de mudarse a NJ debe titularse y registrarse un
    vehículo?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: Si un automovilista se muda a NJ, el vehículo debe titularse y registrarse
    dentro de los 60 días o antes si el registro de fuera del estado vence primero.
- id: 136
  category: vehicle_information
  question: ¿Con qué frecuencia deben pasar la inspección estatal los vehículos de
    pasajeros (de 5 o más años de antigüedad)?
  choices:
    A: Cada año
    B: Cada dos años
    C: Cada tres años
    D: Cada cinco años
  answer: B
  explanation: Los vehículos de pasajeros con más de cinco años de antigüedad deben
    pasar las inspecciones estatales cada dos años.
- id: 137
  category: vehicle_information
  question: 'Los vehículos de pasajeros nuevos con menos de cinco años de antigüedad
    reciben una calcomanía del concesionario que vence:'
  choices:
    A: Un año después del registro
    B: Dos años después del registro
    C: Cinco años después del registro inicial
    D: Tres años después del registro
  answer: C
  explanation: Los vehículos de pasajeros nuevos con menos de cinco años de antigüedad
    reciben una calcomanía que vence cinco años después del registro inicial.
- id: 138
  category: vehicle_information
  question: ¿Qué tan pronto debe inspeccionarse un vehículo después de registrarlo
    al mudarse a NJ (si tiene 5 o más años de antigüedad)?
  choices:
    A: 7 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Un vehículo de cinco años de antigüedad o más debe ser inspeccionado
    dentro de los 14 días posteriores a su registro en NJ.
- id: 139
  category: vehicle_information
  question: Las placas de matrícula deben ser visibles desde 50 pies por la noche.
    ¿A qué altura deben estar montadas?
  choices:
    A: Al menos 6 pulgadas pero menos de 36 pulgadas
    B: Al menos 12 pulgadas pero menos de 48 pulgadas sobre el suelo
    C: Al menos 18 pulgadas pero menos de 60 pulgadas
    D: A cualquier altura
  answer: B
  explanation: Las placas deben estar a al menos 12 pulgadas pero a menos de 48 pulgadas
    sobre el suelo. (N.J.S.A. 39:3-33)
- id: 140
  category: vehicle_information
  question: Si un automovilista cancela el seguro del vehículo, ¿qué debe hacerse
    con las placas?
  choices:
    A: Guardarlas para el próximo vehículo
    B: Devolverlas a la MVC
    C: Destruirlas
    D: Nada
  answer: B
  explanation: Si un automovilista cancela el seguro del vehículo, las placas deben
    devolverse a la Comisión de Vehículos Motorizados (MVC).
- id: 141
  category: vehicle_information
  question: ¿Cuál es la multa por usar cubiertas de matrícula que oscurezcan las letras?
  choices:
    A: Hasta $50
    B: Hasta $100
    C: Hasta $200
    D: Hasta $500
  answer: B
  explanation: El uso de cubiertas o soportes de matrícula que oscurezcan o oculten
    las letras es una infracción con una multa de hasta $100.
- id: 142
  category: signs_and_signals
  question: ¿Qué significa una luz amarilla del semáforo?
  choices:
    A: Acelerar para pasar
    B: Detenerse antes de entrar en la intersección a menos que esté demasiado cerca
      para detenerse de manera segura
    C: Proceder con precaución
    D: Ceder el paso al tráfico que viene en sentido contrario
  answer: B
  explanation: Cuando una luz amarilla sigue a la verde, el conductor debe detenerse
    antes de entrar en la intersección a menos que esté demasiado cerca para detenerse
    de manera segura.
- id: 143
  category: signs_and_signals
  question: En Nueva Jersey, ¿qué significa una luz roja intermitente del semáforo?
  choices:
    A: Ceder el paso y proceder
    B: Detenerse, luego proceder cuando sea seguro
    C: Reducir la velocidad
    D: Vehículos de emergencia acercándose
  answer: B
  explanation: Una luz roja intermitente requiere una parada completa antes de proceder
    cuando sea seguro.
- id: 144
  category: signs_and_signals
  question: ¿Qué significa una 'luz verde vieja' (stale green light)?
  choices:
    A: Una señal de tráfico averiada
    B: Una luz que ha estado en verde durante algún tiempo y puede cambiar pronto
    C: Una flecha verde
    D: Una luz verde por la noche
  answer: B
  explanation: Una luz verde vieja es aquella que ha estado en verde durante algún
    tiempo. Esté preparado para que cambie a amarillo y luego a rojo.
- id: 145
  category: signs_and_signals
  question: En Nueva Jersey, ¿qué indica una línea central discontinua en la carretera?
  choices:
    A: Prohibido adelantar
    B: Se permite adelantar en el lado con la línea discontinua
    C: La carretera está en construcción
    D: Tráfico en un solo sentido
  answer: B
  explanation: Una línea central discontinua indica que se permite adelantar solo
    en el lado con la línea discontinua.
- id: 146
  category: signs_and_signals
  question: ¿De qué color es una señal de advertencia en Nueva Jersey?
  choices:
    A: Rojo
    B: Verde
    C: Amarillo (en forma de rombo)
    D: Azul
  answer: C
  explanation: Las señales de advertencia son amarillas y tienen forma de rombo.
- id: 147
  category: signs_and_signals
  question: ¿De qué color es una señal reglamentaria (como la de pare o límite de
    velocidad)?
  choices:
    A: Amarillo
    B: Blanca con letras negras (o roja para pare/ceda el paso)
    C: Verde
    D: Azul
  answer: B
  explanation: Las señales reglamentarias suelen ser blancas con letras negras. Las
    señales de pare (stop) son rojas. Las señales de ceda el paso (yield) son rojas
    y blancas.
- id: 148
  category: signs_and_signals
  question: ¿Qué forma tiene una señal de pare (stop)?
  choices:
    A: Círculo
    B: Cuadrado
    C: Rombo
    D: Octágono (8 lados)
  answer: D
  explanation: Una señal de pare es un octágono (de 8 lados) y es la única señal con
    esta forma.
- id: 149
  category: signs_and_signals
  question: ¿De qué color son las señales de guía/información en las autopistas?
  choices:
    A: Amarillo
    B: Blanco
    C: Verde
    D: Naranja
  answer: C
  explanation: Las señales verdes son señales de guía/información que se encuentran
    en las autopistas y muestran direcciones y distancias.
- id: 150
  category: signs_and_signals
  question: ¿De qué color son las señales de zona de construcción?
  choices:
    A: Amarillo
    B: Rojo
    C: Naranja
    D: Verde
  answer: C
  explanation: Las señales de advertencia de zona de construcción son de color naranja.
- id: 151
  category: signs_and_signals
  question: 'Una sola línea blanca continua a través de la carretera en una intersección
    significa:'
  choices:
    A: Incorporarse al tráfico
    B: Detenerse detrás de la línea ante una señal o semáforo
    C: Aumentar la velocidad
    D: Zona de construcción más adelante
  answer: B
  explanation: Una sola línea blanca continua a través de una carretera en una intersección
    significa que el conductor debe detenerse detrás de la línea ante una señal o
    semáforo.
- id: 152
  category: signs_and_signals
  question: ¿Qué indican las señales azules de la autopista?
  choices:
    A: Advertencias
    B: Regulaciones
    C: Servicios (gasolina, comida, hospital)
    D: Construcción
  answer: C
  explanation: Las señales azules indican los servicios disponibles cerca de la autopista,
    como gasolineras, comida y hospitales.
- id: 153
  category: safe_driving_rules
  question: 'Tirar basura desde un vehículo en movimiento puede resultar en:'
  choices:
    A: Una advertencia
    B: Multas de hasta $1,000 y posible pérdida de la licencia
    C: Una multa de $50
    D: Solo servicio comunitario
  answer: B
  explanation: Multas de hasta $1,000 por arrojar objetos peligrosos. Si se arrojan
    desde un vehículo en movimiento, el conductor puede perder su licencia. (N.J.S.A.
    39:4-63)
- id: 154
  category: driver_responsibility
  question: ¿Qué es el monóxido de carbono (CO) y por qué es peligroso para los conductores?
  choices:
    A: Un gas visible del escape
    B: Un gas inodoro e incoloro presente en el escape del vehículo
    C: Un subproducto inofensivo de los motores
    D: Un gas que huele a huevos podridos
  answer: B
  explanation: El monóxido de carbono es un gas inodoro e incoloro presente en el
    escape de un vehículo que puede ser fatal.
- id: 155
  category: defensive_driving
  question: 'En un choque, debe elegir golpear:'
  choices:
    A: Algo que venga de frente
    B: Algo que no se mueva en lugar de algo que venga hacia usted; algo que ceda
      en lugar de algo duro
    C: El objeto más grande disponible
    D: Nada; siempre desviarse fuera de la carretera
  answer: B
  explanation: Elija algo que se mueva en la misma dirección, luego algo que no se
    mueva, antes que algo que venga de frente. Elija objetos que cedan (arbustos)
    en lugar de objetos duros.
- id: 156
  category: safe_driving_rules
  question: En una glorieta (traffic circle) sin señales, ¿quién tiene el derecho
    de paso?
  choices:
    A: El vehículo que entra a la glorieta
    B: El vehículo que se aproxima por la derecha
    C: El vehículo que ya está en la glorieta
    D: El vehículo más grande
  answer: B
  explanation: 'La regla básica para intersecciones o glorietas no controladas: el
    vehículo a la izquierda cede el paso al vehículo que se aproxima por la derecha.'
- id: 157
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida en una autopista?
  choices:
    A: Retroceder en la rampa de salida
    B: Detenerse y dar marcha atrás en la autopista
    C: Ir a la siguiente salida
    D: Hacer un giro en U
  answer: C
  explanation: Si un conductor se pasa de una salida, debe ir a la siguiente. Nunca
    retroceda en una rampa de salida ni en la autopista.
- id: 158
  category: penalties_and_points
  question: ¿Cuál es la edad mínima para comprar o consumir alcohol legalmente en
    Nueva Jersey?
  choices:
    A: '18'
    B: '19'
    C: '20'
    D: '21'
  answer: D
  explanation: En NJ, una persona debe tener 21 años o más para comprar, poseer o
    consumir alcohol.
- id: 159
  category: alcohol_drugs_health
  question: 'La Ley de Kulesh, Kubert y Bolis establece que el uso ilegal del teléfono
    celular mientras se conduce constituye:'
  choices:
    A: Una infracción de tráfico menor
    B: Imprudencia bajo los estatutos de homicidio vehicular y agresión por automóvil
    C: Un delito menor
    D: Una infracción de estacionamiento
  answer: B
  explanation: Esta ley establece el uso ilegal del teléfono celular mientras se conduce
    como imprudencia bajo los estatutos de homicidio vehicular y agresión por automóvil.
- id: 160
  category: sharing_the_road
  question: ¿Qué significa 'no-zone' (zona prohibida) con respecto a los camiones?
  choices:
    A: Zonas de no estacionar cerca de camiones
    B: Puntos ciegos donde el conductor del camión no puede ver a otros vehículos
    C: Zonas de velocidad restringida
    D: Zonas de no rebasar en las autopistas
  answer: B
  explanation: Las 'no-zones' son puntos ciegos alrededor de los camiones donde el
    conductor del camión no puede ver a otros vehículos.
- id: 161
  category: sharing_the_road
  question: 'La multa por violar la Ley de Rebase Seguro (Safe Passing Law) y causar
    lesiones corporales es:'
  choices:
    A: $100
    B: $250
    C: $500 y 2 puntos de penalización en la licencia de conducir
    D: $1,000
  answer: C
  explanation: 'Si resultan lesiones corporales: multa de $500 y 2 puntos. Si no hay
    lesiones: multa de $100 y sin puntos. (N.J.S.A. 39:4-92.4)'
- id: 162
  category: defensive_driving
  question: ¿Qué debe hacer un automovilista con respecto a un sistema de frenado
    ABS?
  choices:
    A: Bombear los frenos en una emergencia
    B: Aplicar presión constante; nunca bombee los frenos ABS ni dé volantazos bruscos
    C: Usarlos solo bajo la lluvia
    D: Tocarlos ligeramente
  answer: B
  explanation: Con el ABS, aplique presión constante al pedal del freno. Nunca bombee
    los frenos ABS ni dé volantazos bruscos al frenar.
- id: 163
  category: driver_responsibility
  question: 'La multa por no cumplir con la ley de seguridad de pasajeros infantiles
    es:'
  choices:
    A: No menos de $25 ni más de $50
    B: No menos de $50 ni más de $75, más cargos y costos judiciales
    C: No menos de $100 ni más de $200
    D: $500
  answer: B
  explanation: El incumplimiento de la ley de seguridad de pasajeros infantiles conlleva
    una multa de no menos de $50 ni más de $75, más cargos y costos judiciales.
- id: 164
  category: safe_driving_rules
  question: 'Cuando un automóvil que viene en sentido contrario usa las luces altas
    (bright beams), el automovilista debe:'
  choices:
    A: Devolverles el destello con las luces altas
    B: Mirar hacia la derecha de la carretera hasta que el vehículo pase
    C: Cerrar un ojo
    D: Acelerar para pasar rápido
  answer: B
  explanation: Mire hacia la derecha de la carretera hasta que el vehículo pase. Nunca
    devuelva el destello de las luces altas a un automovilista que se aproxima.
- id: 165
  category: defensive_driving
  question: ¿Cuánto tiempo se tarda en recuperarse del resplandor de las luces altas
    que se aproximan?
  choices:
    A: De 1 a 2 segundos
    B: De 3 a 5 segundos
    C: De 7 a 10 segundos
    D: 15 segundos
  answer: B
  explanation: Puede tomar de tres a cinco segundos recuperarse del resplandor de
    los faros de luces altas que se aproximan.
- id: 166
  category: penalties_and_points
  question: ¿Cuál es el recargo por DUI/Negarse a realizar una prueba de aliento?
  choices:
    A: $500 por año durante 3 años
    B: $750 por año durante 3 años
    C: $1,000 por año durante 3 años
    D: $1,500 por año durante 5 años
  answer: C
  explanation: El recargo por la infracción de DUI/Negativa es de $1,000 por año durante
    tres años.
- id: 167
  category: penalties_and_points
  question: 'Un dispositivo de bloqueo de encendido (ignition interlock device) evita
    que un vehículo arranque si el BAC del conductor excede:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: Un dispositivo de bloqueo de encendido evita que el vehículo arranque
    si el BAC del automovilista excede el 0.05%.
- id: 168
  category: safe_driving_rules
  question: 'El conductor de un autobús escolar puede usar un teléfono celular solo
    cuando:'
  choices:
    A: En modo manos libres en cualquier momento
    B: En una emergencia o cuando el autobús esté estacionado de manera segura fuera
      de una autopista
    C: Cuando no hay estudiantes en el autobús
    D: Nunca
  answer: B
  explanation: El conductor de un autobús escolar no puede usar un teléfono celular
    excepto en una emergencia o cuando el autobús esté estacionado en un área segura
    fuera de una autopista. (N.J.S.A. 39:3B-25)
- id: 169
  category: sharing_the_road
  question: ¿A qué sanción se enfrentan los peatones menores de 17 años por violar
    las leyes de peatones?
  choices:
    A: Multa de $10
    B: Multa de $22
    C: Multa de $54
    D: Solo una advertencia
  answer: B
  explanation: Los peatones menores de 17 años que violan las leyes de peatones se
    enfrentan a una multa de $22. Los adultos se enfrentan a una multa de $54.
- id: 170
  category: driver_responsibility
  question: 'La multa por infracción de ralentí (idling) oscila entre:'
  choices:
    A: $50 a $250
    B: $100 a $500
    C: $250 a $1,000
    D: $500 a $2,000
  answer: C
  explanation: Los propietarios de vehículos y propiedades se enfrentan a multas de
    $250 a $1,000 por cada infracción de ralentí (idling). (N.J.S.A. 39:3-70.2)
- id: 171
  category: penalties_and_points
  question: 'Llevar recipientes de bebidas alcohólicas abiertos o sin sellar en un
    vehículo resulta en una multa de:'
  choices:
    A: $100 por la primera infracción
    B: $200 por la primera infracción
    C: $300 por la primera infracción
    D: $500 por la primera infracción
  answer: B
  explanation: $200 por la primera infracción y $250 o 10 días de servicio comunitario
    por infracciones posteriores. (N.J.S.A. 39:4-51a)
- id: 172
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una licencia de ciclomotor (moped)?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '17'
  answer: B
  explanation: La edad mínima para una licencia de ciclomotor es de 15 años.
- id: 173
  category: defensive_driving
  question: 'En pavimento mojado a 30 mph, la distancia mínima de seguimiento segura
    es:'
  choices:
    A: 3 largos de vehículo
    B: 4 largos de vehículo
    C: 6 largos de vehículo
    D: 9 largos de vehículo
  answer: C
  explanation: En pavimento mojado a 30 mph, la distancia mínima de seguimiento segura
    es de 6 largos de vehículo.
- id: 174
  category: defensive_driving
  question: 'Sobre hielo a 20 mph, la distancia mínima de seguimiento segura es:'
  choices:
    A: 4 largos de vehículo
    B: 6 largos de vehículo
    C: 10 largos de vehículo
    D: 12 largos de vehículo
  answer: D
  explanation: Sobre hielo a 20 mph, la distancia mínima de seguimiento segura es
    de 12 largos de vehículo.
- id: 175
  category: safe_driving_rules
  question: 'Al entrar en una autopista desde un carril de aceleración, un conductor
    debe:'
  choices:
    A: Detenerse y esperar una apertura
    B: Aumentar la velocidad para igualar el flujo del tráfico, ceder el paso al tráfico
      y entrar en el carril derecho
    C: Entrar a cualquier velocidad
    D: Entrar en el carril izquierdo para una incorporación más rápida
  answer: B
  explanation: Aumente la velocidad al flujo del tráfico al salir del carril de aceleración,
    ceda el paso al tráfico que ya está en la autopista y entre en el carril de la
    derecha cuando sea seguro.
- id: 176
  category: driver_responsibility
  question: ¿Cuál es la técnica de frenado correcta con frenos convencionales (sin
    ABS) al derrapar?
  choices:
    A: Pisar fuerte el freno
    B: Soltar y volver a aplicar con menos presión hasta que el vehículo esté bajo
      control
    C: Bombear el freno rápidamente
    D: Usar el freno de estacionamiento
  answer: B
  explanation: Si los frenos se bloquean, suelte el pedal y vuelva a aplicarlo con
    un poco menos de presión. Repita con menos presión hasta que el vehículo esté
    bajo control.
- id: 177
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción por DUI por una tercera infracción que ocurre dentro
    de los 10 años posteriores a la segunda (para infracciones a partir del 1/12/19)?
  choices:
    A: Suspensión de la licencia por 2 años
    B: Suspensión de la licencia por 5 años
    C: Suspensión de la licencia por 8 años
    D: Revocación permanente de la licencia
  answer: C
  explanation: 'Tercera infracción por DUI a partir del 1/12/19: suspensión de la
    licencia por 8 años, multa de $1,000, recargo de $1,500 al año durante 3 años.'
- id: 178
  category: safe_driving_rules
  question: ¿Qué son los Corredores Seguros (Safe Corridors) en Nueva Jersey?
  choices:
    A: Autopistas con límites de velocidad reducidos
    B: Autopistas donde las multas se duplican según las estadísticas de alta tasa
      de accidentes
    C: Áreas de zonas escolares
    D: Zonas de construcción
  answer: B
  explanation: Los Corredores Seguros duplican las multas en varias autopistas estatales.
    Se designan en función de tasas de accidentes un 50% superiores a la tasa estatal
    y más de 1,000 accidentes en 3 años.
- id: 179
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por no ceder el paso a un peatón en un cruce
    de peatones?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: 'No ceder el paso a un peatón en un cruce de peatones: 2 puntos. (N.J.S.A.
    39:4-35)'
- id: 180
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por un giro en U (U-turn) incorrecto?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: 'Giro en U incorrecto: 3 puntos. (N.J.S.A. 39:4-125)'
- id: 181
  category: penalties_and_points
  question: ¿Cuántos puntos se evalúan por no pasar a la derecha de un vehículo que
    circula en dirección opuesta?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: D
  explanation: 'No pasar a la derecha de un vehículo que circula en dirección opuesta:
    5 puntos. (N.J.S.A. 39:4-84)'
- id: 182
  category: safe_driving_rules
  question: ¿Cómo debe un automovilista acercarse a una curva?
  choices:
    A: Mantener la velocidad durante la curva
    B: Reducir la velocidad antes de entrar en la curva y evitar desviarse hacia otro
      carril
    C: Acelerar durante la curva
    D: Frenar bruscamente durante la curva
  answer: B
  explanation: Reduzca la velocidad antes de entrar en una curva y evite desviarse
    hacia otro carril.
- id: 183
  category: sharing_the_road
  question: 'Cuando un jinete hace una señal levantando la mano, el automovilista
    debe:'
  choices:
    A: Reducir la velocidad a 25 mph y pasar
    B: Detenerse y permanecer inmóvil hasta que el caballo pase
    C: Tocar la bocina para advertir al caballo
    D: Cambiar de carril y pasar
  answer: B
  explanation: Ante la señal de un jinete, el automovilista debe detenerse y permanecer
    inmóvil hasta que el caballo pase. (N.J.S.A. 39:4-72)
- id: 184
  category: defensive_driving
  question: ¿Cuál es la causa más común de incendios en automóviles?
  choices:
    A: Sobrecalentamiento del motor
    B: Fugas de combustible
    C: Cortocircuitos en el sistema eléctrico
    D: Fumar cigarrillos
  answer: C
  explanation: La mayoría de los incendios de automóviles son causados por cortocircuitos
    en el sistema eléctrico.
- id: 185
  category: driver_responsibility
  question: ¿Qué tipo de luces prohíbe la ley de NJ que estén encendidas mientras
    un vehículo avanza hacia adelante?
  choices:
    A: Luces antiniebla
    B: Luces de estacionamiento
    C: Luces de marcha atrás (backup lights)
    D: Luces del tablero
  answer: C
  explanation: Va en contra de la ley de NJ tener las luces de marcha atrás (backup
    lights) encendidas mientras un vehículo avanza hacia adelante. (N.J.S.A. 39:3-52)
- id: 186
  category: safe_driving_rules
  question: 'El Compromiso de Seguridad de la Ley de Nikhil requiere que los automovilistas
    se comprometan a:'
  choices:
    A: Nunca exceder el límite de velocidad
    B: Detenerse por completo en las señales de alto, mantenerse alerta, usar teléfonos
      manos libres y planificar con anticipación
    C: Usar siempre el cinturón de seguridad
    D: Nunca beber y conducir
  answer: B
  explanation: 'El compromiso de la Ley de Nikhil incluye: Detenerse por completo,
    Mantenerse alerta, Hablar con seguridad (manos libres) y Planificar con anticipación.'
- id: 187
  category: vehicle_information
  question: ¿Cuál es la tarifa anual de registro de motocicletas en NJ?
  choices:
    A: $24
    B: $35
    C: $50
    D: $65
  answer: D
  explanation: La tarifa anual de registro de motocicletas en NJ es de $65.
- id: 188
  category: penalties_and_points
  question: ¿Cuántos puntos se evalúan por rebasar incorrectamente a un camión de
    postres helados?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: C
  explanation: 'Rebasar incorrectamente a un camión de postres helados: 4 puntos.
    (N.J.S.A. 39:4-128.4)'
- id: 189
  category: penalties_and_points
  question: 'Un automovilista que acumule de 12 a 14 puntos o más recibirá:'
  choices:
    A: Una carta de advertencia
    B: Un Aviso de Suspensión Programada (Notice of Scheduled Suspension)
    C: Una suspensión automática
    D: Una comparecencia obligatoria ante el tribunal
  answer: B
  explanation: Los automovilistas que acumulan de 12 a 14 puntos o más en un período
    de 24 meses reciben un Aviso de Suspensión Programada.
- id: 190
  category: safe_driving_rules
  question: 'La fecha límite para el registro de votantes antes de una elección es:'
  choices:
    A: 7 días
    B: 14 días
    C: 21 días
    D: 30 días
  answer: C
  explanation: La fecha límite para el registro de votantes es 21 días antes de una
    elección.
- id: 191
  category: penalties_and_points
  question: ¿Cuál es la sanción por conducir mientras la licencia está suspendida
    por una infracción relacionada con DUI?
  choices:
    A: Multa de $200
    B: Multa de $500, suspensión adicional de 1 a 2 años, posible encarcelamiento
      de 10 a 90 días
    C: Multa de $100 y suspensión de 30 días
    D: Solo una advertencia
  answer: B
  explanation: 'Conducir mientras la licencia está suspendida por DUI/rechazo: multa
    de $500, suspensión adicional de 1 a 2 años y posible encarcelamiento de 10 a
    90 días.'
- id: 192
  category: alcohol_drugs_health
  question: 'Un conductor menor de edad (menor de 21 años) con un BAC de 0.01% o más
    se enfrenta a:'
  choices:
    A: Una advertencia
    B: Suspensión de la licencia de 30 a 90 días, 15 a 30 días de servicio comunitario
      y participación en el IDRC
    C: Solo una multa de $100
    D: Las mismas sanciones que los adultos
  answer: B
  explanation: 'Primera infracción de un menor de edad con un BAC de 0.01% a 0.08%:
    suspensión de 30 a 90 días, 15 a 30 días de servicio comunitario y participación
    en el IDRC (Centro de Recursos para Conductores Intoxicados) o programa de educación
    sobre el alcohol.'
- id: 193
  category: safe_driving_rules
  question: En Nueva Jersey, ¿cuándo es obligatorio usar las luces direccionales?
  choices:
    A: Al cambiar de carril.
    B: Al entrar o salir de un espacio de estacionamiento.
    C: Al incorporarse al tráfico desde un área de estacionamiento o callejón.
    D: Todas las anteriores.
  answer: D
  explanation: Las luces direccionales siempre deben usarse al realizar cualquier
    movimiento hacia la izquierda o hacia la derecha. Debe usar la señal al incorporarse
    al tráfico desde un espacio de estacionamiento junto a la acera, al cambiarse
    a un carril nuevo o al rebasar a otro vehículo.
- id: 194
  category: safe_driving_rules
  question: 'Al conducir en autopistas principales:'
  choices:
    A: Manténgase alerta.
    B: Mantenga los ojos en movimiento.
    C: Esté preparado para reaccionar ante los peligros de la carretera.
    D: Todas las anteriores.
  answer: D
  explanation: Es importante mantenerse alerta en las autopistas y estar preparado
    para reaccionar ante peligros inesperados. Para evitar la "hipnosis de autopista",
    debe evitar mirar cualquier cosa por más de unos pocos segundos.
- id: 195
  category: sharing_the_road
  question: 'Usted está subiendo una colina y se aproxima a un camión pesado por detrás.
    Debe saber que:'
  choices:
    A: El camión puede estar viajando a una velocidad menor que el límite de velocidad
      indicado.
    B: Es posible que no pueda rebasar el camión de manera segura.
    C: Es posible que no pueda rebasar el camión legalmente.
    D: Todas las anteriores.
  answer: D
  explanation: Los conductores deben ser conscientes de que los vehículos grandes
    a menudo viajan a una velocidad menor que el límite de velocidad indicado, especialmente
    cuando conducen en una pendiente, y deben tener precaución al acercarse a un vehículo
    grande por detrás. En una colina con visibilidad limitada, es ilegal rebasar a
    otro vehículo.
- id: 196
  category: defensive_driving
  question: 'Cuando vea a otros conductores a su alrededor actuando o reaccionando
    con ira:'
  choices:
    A: No haga contacto visual.
    B: No reaccione con gestos de las manos.
    C: Distánciese de la situación.
    D: Todas estas.
  answer: D
  explanation: Cuando otros conductores se comportan con ira, debe tomar medidas para
    distanciarse física y mentalmente de la situación. Evite hacer contacto visual
    con ellos o realizar movimientos corporales o gestos que puedan provocarlos. Reduzca
    la velocidad, muévase a otro carril o haga lo que sea necesario de manera segura
    para ponerse fuera de peligro.
- id: 197
  category: safe_driving_rules
  question: 'Una persona que camina con un bastón blanco o un perro guía es probable
    que sea:'
  choices:
    A: Una persona sorda.
    B: Una persona involucrada en un estudio de tráfico.
    C: Una persona ciega.
    D: Ninguna de las anteriores.
  answer: C
  explanation: Los conductores siempre deben ceder el paso a un peatón cuando el peatón
    es una persona ciega que utiliza un bastón blanco o un perro guía.
- id: 198
  category: safe_driving_rules
  question: 'En una autopista, se da cuenta de que se pasó su giro o salida. Usted
    debe:'
  choices:
    A: Hacer el giro rápidamente desde su carril de circulación.
    B: Detenerse y retroceder.
    C: Continuar conduciendo hasta llegar al siguiente giro, salida u otro lugar donde
      pueda dar la vuelta de manera segura.
    D: Hacer señales a otros conductores para que se detengan y usted pueda girar.
  answer: C
  explanation: Si se pasa su giro o salida, no retroceda; continúe hasta el siguiente
    giro o salida donde pueda dar la vuelta de manera segura. Es ilegal retroceder
    en el arcén o en una autopista.
- id: 199
  category: safe_driving_rules
  question: 'Al girar o cambiar de carril, usted debe:'
  choices:
    A: Señalizar siempre sus intenciones, incluso cuando no haya tráfico visible.
    B: Señalizar solo si hay tráfico visible.
    C: Señalizar solo cuando conduzca de noche.
    D: Señalizar solo cuando conduzca en tráfico pesado de noche.
  answer: A
  explanation: Siempre señalice sus intenciones al cambiar de carril, girar o salir
    de la acera. No se permita volverse perezoso y formar el mal hábito de no seguir
    esta ley.
- id: 200
  category: alcohol_drugs_health
  question: 'Consumir drogas junto con alcohol:'
  choices:
    A: Aumenta el riesgo de causar un choque.
    B: No es más peligroso que consumir alcohol por sí solo.
    C: Disminuye el efecto del alcohol en su capacidad para conducir.
    D: No tiene ningún efecto en su capacidad general de conducción.
  answer: A
  explanation: Las drogas (incluidos los medicamentos ilegales, recetados y de venta
    libre) pueden afectar su función cerebral y perjudicar su capacidad para conducir
    de manera segura. Combinar alcohol con otras drogas aumentará el riesgo de un
    choque.
- id: 201
  category: signs_and_signals
  question: 'Al conducir sobre pavimento mojado, es importante recordar:'
  choices:
    A: Que el pavimento es especialmente resbaladizo justo después de que empieza
      a llover.
    B: Que las carreteras mojadas pueden causar hidroplaneo (hydroplaning).
    C: Darse espacio adicional al detenerse.
    D: Todas las anteriores.
  answer: D
  explanation: Las superficies de las carreteras mojadas pueden ser peligrosamente
    resbaladizas, especialmente inmediatamente después de una lluvia. Al conducir
    por carreteras mojadas, su vehículo se desplaza sobre una fina capa de aceite,
    suciedad y agua. Reduzca la velocidad cuando haya lluvia intensa, agua estancada
    o aguanieve en la carretera para reducir el riesgo de que las ruedas pierdan tracción
    en la superficie resbaladiza.
- id: 202
  category: signs_and_signals
  question: 'Una señal amarilla en forma de diamante con una flecha curva apuntando
    a la derecha indica:'
  choices:
    A: Camino de una sola vía.
    B: No girar a la derecha.
    C: Salida.
    D: Curva cerrada a la derecha en el camino más adelante.
  answer: D
  explanation: Las señales de advertencia amarillas en forma de diamante con flechas
    curvas advierten a los conductores sobre curvas cerradas próximas en el camino.
- id: 203
  category: safe_driving_rules
  question: 'Una luz verde fija en una intersección significa que usted:'
  choices:
    A: Debe reducir la velocidad y prepararse para detenerse.
    B: Debe detenerse y verificar el tráfico que viene en sentido contrario antes
      de continuar.
    C: Puede cruzar la intersección si el camino está despejado.
    D: No puede girar a la derecha.
  answer: C
  explanation: Una luz verde fija significa que puede cruzar la intersección si el
    camino está despejado. También puede girar a la derecha o a la izquierda con una
    luz verde fija, a menos que una señal prohíba el giro. Al girar, debe ceder el
    paso a otros vehículos y peatones dentro de la intersección.
- id: 204
  category: vehicle_information
  question: 'Un cinturón de seguridad debe ajustarse de modo que:'
  choices:
    A: Esté flojo.
    B: Esté abrochado firmemente sobre los huesos de la cadera y la parte baja del
      abdomen.
    C: Esté oculto debajo del asiento.
    D: Evite que el zumbador o la luz del cinturón de seguridad funcionen.
  answer: B
  explanation: Los cinturones de regazo deben ajustarse firmemente sobre los huesos
    de la cadera y la parte inferior del abdomen. Los cinturones de hombro deben quedar
    cómodos de modo que pueda insertar el puño entre el cinturón y el pecho.
- id: 205
  category: safe_driving_rules
  question: 'Si se detiene a lo largo del camino por la noche:'
  choices:
    A: Apague todas sus luces.
    B: Use solo sus luces de estacionamiento.
    C: Use solo sus faros delanteros.
    D: Encienda sus luces intermitentes de emergencia y deje encendidas las luces
      bajas.
  answer: D
  explanation: Si se detiene a lo largo del camino por la noche, encienda sus luces
    intermitentes de emergencia y deje encendidas las luces bajas. Asegúrese de que
    los demás usuarios de la vía puedan ver claramente su vehículo.
- id: 206
  category: safe_driving_rules
  question: 'No puede rebasar de forma segura en una calle de dos carriles y doble
    sentido a menos que:'
  choices:
    A: Pueda ver claramente el camino por delante.
    B: Pueda regresar a su carril antes de encontrarse con el tráfico que viene en
      sentido contrario.
    C: Su vehículo sea capaz de alcanzar la velocidad necesaria para rebasar.
    D: Todas las anteriores.
  answer: D
  explanation: No puede rebasar de forma segura cuando conduce en una calle de dos
    carriles y doble sentido a menos que pueda ver claramente el camino por delante,
    pueda regresar a su carril antes de encontrarse con el tráfico que viene en sentido
    contrario y su vehículo sea capaz de alcanzar la velocidad necesaria para rebasar.
    No rebase donde sea ilegal o inseguro hacerlo.
- id: 207
  category: signs_and_signals
  question: 'Dos líneas amarillas continuas en el pavimento significan:'
  choices:
    A: Se permite rebasar a los conductores de ambas direcciones.
    B: No se permite rebasar.
    C: Se permite rebasar si se encuentra en la cima de una colina.
    D: Se permite rebasar solo durante el día.
  answer: B
  explanation: Las líneas amarillas le indican que el tráfico al otro lado de las
    líneas se mueve en la dirección opuesta. Nunca debe cruzar dos líneas amarillas
    continuas para rebasar desde ninguna dirección.
- id: 208
  category: safe_driving_rules
  question: 'Un conductor puede rebasar legalmente por el lado derecho de otro vehículo:'
  choices:
    A: Si el vehículo está esperando para girar a la izquierda y hay un carril de
      rebase disponible.
    B: Incluso si eso significa conducir fuera del pavimento.
    C: En un puente estrecho.
    D: En cualquier momento.
  answer: A
  explanation: Si hay un carril de rebase disponible, puede rebasar por la derecha
    a un vehículo o bicicleta que esté girando a la izquierda o esperando para girar
    a la izquierda. También es legal rebasar por la derecha cuando se conduce en una
    carretera de varios carriles con dos o más carriles que circulan en la misma dirección.
    Nunca debe conducir fuera del pavimento o de la parte principal de la carretera
    para rebasar a otro vehículo.
- id: 209
  category: sharing_the_road
  question: 'Si un guardia de cruce escolar está dirigiendo el tráfico en una zona
    escolar, usted debe:'
  choices:
    A: Seguir las instrucciones dadas por el guardia de cruce.
    B: Copiar lo que hace el tráfico circundante, a pesar de las instrucciones del
      guardia de cruce.
    C: Asumir que se supone que el guardia no debe dirigir el tráfico.
    D: Seguir las reglas que estarían vigentes si no hubiera niños presentes.
  answer: A
  explanation: Esté preparado para reducir su velocidad y tener precaución cuando
    se lo indique una señal, un guardia de cruce o un oficial de la ley. Siempre conduzca
    con precaución adicional en una zona escolar.
- id: 210
  category: safe_driving_rules
  question: 'Señalizar sus intenciones antes de girar, cambiar de carril o alejarse
    de la acera:'
  choices:
    A: Es necesario solo si hay otro tráfico presente.
    B: Es un buen hábito de conducción y es requerido por la ley.
    C: Es necesario solo durante la maniobra, no antes.
    D: No es necesario si la maniobra se realiza lentamente.
  answer: B
  explanation: Al cambiar de carril o girar, señalice sus intenciones con suficiente
    antelación. La ley exige que señalice al menos 100 pies antes de mover su vehículo
    hacia la derecha o hacia la izquierda. Antes de alejarse de una acera, siempre
    señalice para informar a los conductores que pasan sobre sus intenciones.
- id: 211
  category: signs_and_signals
  question: 'Si un vehículo de emergencia con luces intermitentes circula por el área
    donde usted está conduciendo, usted debe:'
  choices:
    A: Aumentar la velocidad para evitar al vehículo de emergencia.
    B: Detener su vehículo inmediatamente e impedir que pase.
    C: Hacer todo lo posible para darle al vehículo de emergencia un camino despejado
      para circular.
    D: Hacer una señal al vehículo de emergencia cuando el camino esté despejado para
      que lo pase.
  answer: C
  explanation: Si un vehículo de emergencia con luces intermitentes circula por el
    área donde usted conduce, debe hacer todo lo posible para darle un camino despejado.
    Si es seguro hacerlo, mueva su vehículo hacia el lado de la carretera para dejar
    una vía abierta al vehículo de emergencia.
- id: 212
  category: safe_driving_rules
  question: 'Si desea salir de la autopista pero se ha pasado su salida, usted debe:'
  choices:
    A: Ir a la siguiente salida.
    B: Hacer un giro en U a través de la mediana.
    C: Detenerse en el acotamiento y retroceder su auto hasta la salida.
    D: Hacer señas a un oficial de policía para que lo escolte de regreso a su salida.
  answer: A
  explanation: Si se pasa su salida, debe tomar la siguiente salida. No se detenga
    ni retroceda en la autopista, no cruce bruscamente varios carriles para intentar
    tomar la salida en el último segundo, ni cruce la mediana para dar la vuelta.
    Todas estas maniobras son ilegales y extremadamente peligrosas.
- id: 213
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Señalizar al menos 100 pies antes de cambiar de carril para rebasar y asegurarse
      de que no haya tráfico en sentido contrario.
    B: Usar sus espejos y mirar sobre su hombro izquierdo para revisar su punto ciego
      al rebasar por la izquierda.
    C: Al rebasar, esperar hasta que pueda ver ambos faros delanteros del auto rebasado
      en su espejo retrovisor antes de regresar a su carril original.
    D: Todas las anteriores.
  answer: D
  explanation: Al rebasar, siempre debe señalizar al menos 100 pies antes de su cambio
    de carril. Siempre revise detrás de usted en sus espejos y mire sobre su hombro
    para verificar su punto ciego. Espere hasta que pueda ver ambos faros delanteros
    del auto rebasado en su espejo retrovisor antes de regresar a su carril original.
- id: 214
  category: safe_driving_rules
  question: En una intersección con parada de cuatro vías en Nueva Jersey, ¿quién
    tiene el derecho de paso?
  choices:
    A: El conductor que llegue primero tiene el derecho de paso.
    B: El conductor que llegue al último tiene el derecho de paso.
    C: Un conductor debe continuar conduciendo sin detenerse.
    D: Un conductor debe hacer señas a los otros conductores para que avancen.
  answer: A
  explanation: En las paradas de cuatro vías, el tráfico de las cuatro direcciones
    debe detenerse. El primer vehículo en llegar a la intersección debe avanzar primero.
    Si dos vehículos llegan a la intersección al mismo tiempo, el conductor de la
    izquierda cede el paso al conductor de la derecha.
- id: 215
  category: safe_driving_rules
  question: 'Usted puede beber bebidas alcohólicas en un vehículo en una carretera
    pública:'
  choices:
    A: Siempre y cuando no esté conduciendo.
    B: Si viaja en el asiento trasero.
    C: Si viaja en la parte trasera de una camioneta (pick-up).
    D: Bajo ninguna circunstancia.
  answer: D
  explanation: Es contra la ley consumir o poseer cualquier bebida alcohólica mientras
    se está en una vía pública o acera. Además, está prohibido guardar un recipiente
    de bebida alcohólica abierto en un área de un vehículo motorizado normalmente
    ocupada por el conductor o el pasajero en cualquier vía pública.
- id: 216
  category: safe_driving_rules
  question: 'Al girar a la derecha con luz verde, usted debe:'
  choices:
    A: Mantener su velocidad normal de conducción.
    B: Detenerse y buscar patrullas de policía cercanas.
    C: Ceder el paso a los peatones.
    D: Aumentar su velocidad normal de conducción.
  answer: C
  explanation: A menos que una señal colocada lo prohíba, puede girar a la derecha
    o a la izquierda con una luz verde fija. Al girar, debe ceder el paso a otros
    vehículos y peatones dentro de la intersección.
- id: 217
  category: vehicle_information
  question: 'El hidroplaneo (hydroplaning) es causado generalmente por:'
  choices:
    A: Paradas excesivas.
    B: Paradas repentinas.
    C: Giros repentinos.
    D: Velocidad excesiva.
  answer: D
  explanation: Sus neumáticos se vuelven menos efectivos para evacuar el agua de la
    carretera a medida que aumenta su velocidad. Si conduce demasiado rápido, pueden
    perder el agarre por completo, dejando al vehículo deslizándose sobre una capa
    de agua. Esto se conoce como "hidroplaneo".
- id: 218
  category: signs_and_signals
  question: 'Las señales de tráfico y las marcas en el pavimento:'
  choices:
    A: Deben obedecerse siempre.
    B: Son meramente sugerencias.
    C: Deben seguirse solo cuando hay otro tráfico.
    D: Deben seguirse solo cuando hay un oficial de policía presente.
  answer: A
  explanation: El flujo de tráfico está controlado por marcas en el pavimento, islas
    de tráfico, semáforos y señales. Estos dispositivos informan a los conductores
    sobre las condiciones de la carretera y ayudan a guiarlos de manera segura a sus
    destinos. Siempre debe obedecer las señales de tráfico, los semáforos y las marcas
    en el pavimento.
- id: 219
  category: signs_and_signals
  question: ¿Qué indican las señales de cruce de ferrocarril (crossbuck)?
  choices:
    A: Cruces de ferrocarril.
    B: Zonas escolares.
    C: Zonas de no rebasar.
    D: Hospitales.
  answer: A
  explanation: Las señales de cruce de ferrocarril (crossbuck) indican a los conductores
    que deben ceder el paso a los trenes en un cruce ferroviario. Los conductores
    no deben intentar ganarle el paso a un tren.
- id: 220
  category: defensive_driving
  question: 'Al conducir en carreteras resbaladizas, usted debe:'
  choices:
    A: Usar rutas alternas.
    B: Conducir como lo haría en carreteras secas.
    C: Aumentar su distancia de seguimiento.
    D: Evitar cruzar puentes o intersecciones.
  answer: C
  explanation: En carreteras resbaladizas, debe aumentar su distancia de seguimiento.
    Puede tomar más tiempo detener su vehículo de lo que tomaría en condiciones normales.
- id: 221
  category: safe_driving_rules
  question: ¿Quién debe ceder el paso cuando un conductor está girando y un peatón
    está cruzando sin un semáforo?
  choices:
    A: Quien haya empezado a moverse al último
    B: El conductor
    C: Quien sea más lento
    D: El peatón
  answer: B
  explanation: Los conductores deben ceder el paso a los peatones cuando estos cruzan
    en cualquier intersección sin semáforo, haya o no un cruce peatonal marcado.
- id: 222
  category: alcohol_drugs_health
  question: ¿Qué tipos de drogas pueden afectar su capacidad para conducir?
  choices:
    A: Medicamentos para la alergia
    B: Marihuana
    C: Remedios para el resfriado
    D: Todas estas opciones
  answer: D
  explanation: Muchos tipos de drogas pueden perjudicar su capacidad para conducir.
    Esto incluye drogas ilegales y medicamentos legales con receta o de venta libre.
    Puede ser un delito penal conducir bajo los efectos de cualquier droga.
- id: 223
  category: vehicle_information
  question: 'Su punto ciego es el área de la carretera:'
  choices:
    A: Que no puede ver sin mover la cabeza.
    B: Directamente detrás de su vehículo.
    C: Que ve en su espejo retrovisor.
    D: Que ve en su espejo lateral.
  answer: A
  explanation: Los puntos ciegos son áreas que un conductor no puede ver sin mover
    la cabeza. Pueden estar ubicados a los lados y detrás de un vehículo.
- id: 224
  category: safe_driving_rules
  question: 'Usted llega a una intersección que está bloqueada por otro tráfico. Usted
    debe:'
  choices:
    A: Ir despacio hasta que el tráfico de adelante se mueva.
    B: Acercarse lo más posible al auto que tiene delante.
    C: Permanecer fuera de la intersección hasta que pueda pasar.
    D: Tocar la bocina para que los autos avancen.
  answer: C
  explanation: No puede entrar en una intersección si el tráfico está acumulado en
    el otro lado y no puede atravesar la intersección por completo. Espere hasta que
    el tráfico de adelante se despeje para no bloquear la intersección.
- id: 225
  category: signs_and_signals
  question: 'Una señal amarilla en forma de diamante que muestra el símbolo de un
    semáforo indica:'
  choices:
    A: Continuar a su velocidad actual.
    B: Debe detenerse más adelante.
    C: No se permite el exceso de velocidad.
    D: Hay un semáforo más adelante.
  answer: D
  explanation: Una señal de advertencia amarilla con el símbolo de un semáforo alerta
    a los conductores de que hay un semáforo más adelante. Esté preparado para detenerse.
- id: 226
  category: defensive_driving
  question: 'Su primera respuesta ante la visibilidad reducida debe ser:'
  choices:
    A: Encender las luces delanteras.
    B: Reducir su velocidad.
    C: Encender los limpiaparabrisas.
    D: Buscar las marcas en el borde de la carretera para guiarse.
  answer: B
  explanation: Reducir su velocidad debe ser su primera respuesta ante la disminución
    de la visibilidad y las condiciones peligrosas de la carretera.
- id: 227
  category: safe_driving_rules
  question: 'Dos líneas blancas continuas pintadas a través de un carril de tráfico
    muestran los límites de un cruce peatonal. Como conductor, debe saber que:'
  choices:
    A: Los vehículos motorizados tienen el derecho de paso sobre los peatones en los
      cruces peatonales.
    B: Cuando los peatones están en los cruces peatonales, se les debe dar el derecho
      de paso.
    C: Nadie tiene el derecho de paso en un cruce peatonal.
    D: Los peatones son responsables de mantenerse fuera del camino de todo el tráfico.
  answer: B
  explanation: Las líneas de los cruces peatonales muestran a los peatones dónde cruzar
    una carretera o calle de forma segura. Los cruces peatonales pueden estar marcados
    por líneas horizontales, líneas verticales o una combinación de ambas. Siempre
    debe detenerse ante los peatones que se encuentren en un cruce peatonal.
- id: 228
  category: safe_driving_rules
  question: 'Debe ceder el paso a otros conductores:'
  choices:
    A: Al entrar en una calle desde un garaje o callejón.
    B: Cuando están en una carretera a su izquierda y han llegado a una intersección
      no señalizada al mismo tiempo.
    C: Cuando su señal de tráfico es una flecha verde.
    D: Todas las anteriores.
  answer: A
  explanation: Debe ceder el paso a otros conductores al entrar en una calle desde
    un callejón, entrada privada o garaje. También debe ceder el paso a los peatones
    que se encuentren en una acera que se cruce.
- id: 229
  category: safe_driving_rules
  question: 'Debe ceder el paso a los vehículos de emergencia:'
  choices:
    A: Bajo ninguna circunstancia.
    B: Cuando vea una luz roja o azul intermitente o escuche una sirena.
    C: Solo cuando otros vehículos cedan el paso.
    D: Ninguna de las anteriores.
  answer: B
  explanation: Debe ceder el derecho de paso a cualquier vehículo de emergencia que
    esté utilizando su sirena o luces intermitentes.
- id: 230
  category: safe_driving_rules
  question: 'Un conductor que entra al tráfico público desde una entrada privada o
    camino privado:'
  choices:
    A: Tiene el derecho de paso.
    B: Debe ceder el paso a los conductores que ya están en la vía pública.
    C: Puede forzar su entrada al tráfico.
    D: Puede asumir que otros conductores cambiarán de carril para dejar espacio.
  answer: B
  explanation: Si está entrando al tráfico desde una entrada privada o un camino privado,
    debe ceder el paso a los conductores que ya están en la vía pública. Incorpórese
    de manera segura al tráfico cuando pueda hacerlo.
- id: 231
  category: safe_driving_rules
  question: ¿En cuál de las siguientes señales de tráfico tiene usted el derecho de
    paso al girar a la izquierda?
  choices:
    A: Una luz verde fija
    B: Una luz amarilla intermitente
    C: Una flecha verde apuntando a la izquierda
    D: Una luz roja intermitente
  answer: C
  explanation: Una flecha verde fija significa que puede pasar por la intersección
    en la dirección que apunta la flecha. El tráfico en sentido contrario debe detenerse
    para permitir el paso del tráfico que gira.
- id: 232
  category: safe_driving_rules
  question: ¿Cuál no es un factor para determinar la distancia que tarda su vehículo
    en detenerse?
  choices:
    A: Capacidad de dirección
    B: Distancia de frenado
    C: Distancia de reacción
    D: Tiempo de percepción
  answer: A
  explanation: La distancia necesaria para detener su vehículo depende del tiempo
    de percepción, la distancia de reacción y la distancia de frenado. Esto cambia
    según la velocidad y las condiciones de la carretera.
- id: 233
  category: safe_driving_rules
  question: ¿Qué indica una señal de restricción de velocidad?
  choices:
    A: Puede ignorarse en condiciones de lluvia, nieve o hielo.
    B: Tiene forma triangular.
    C: Es azul con letras negras.
    D: Muestra una velocidad recomendada para una curva o giro.
  answer: D
  explanation: Las señales de advertencia de curvas y giros a menudo tienen señales
    de velocidad recomendada adjuntas que muestran la velocidad de conducción sugerida
    para los conductores en dichas curvas y giros. Aunque un conductor se sienta cómodo
    conduciendo a una velocidad mayor con buen tiempo, nunca debe hacerlo en condiciones
    de lluvia, nieve o hielo.
- id: 234
  category: safe_driving_rules
  question: 'La cantidad de espacio que necesita para cruzar el tráfico depende de:'
  choices:
    A: Las condiciones de la carretera, las condiciones climáticas y el tráfico en
      sentido contrario.
    B: La presencia de una señal de alto (STOP).
    C: El uso de sus señales de giro.
    D: Los autos detrás de usted.
  answer: A
  explanation: La cantidad de espacio que necesita para cruzar el tráfico depende
    de las condiciones de la carretera, las condiciones climáticas y el tráfico en
    sentido contrario.
- id: 235
  category: safe_driving_rules
  question: Según la ley de Nueva Jersey, ¿en qué situaciones se le prohíbe rebasar
    a otro vehículo?
  choices:
    A: En una colina o curva.
    B: Cuando las luces del autobús escolar están parpadeando.
    C: Al acercarse a una intersección.
    D: Todas las anteriores.
  answer: D
  explanation: Nunca debe rebasar si hay un vehículo en sentido contrario en el carril
    de rebase, si su vista está bloqueada por una curva o colina, en una intersección,
    antes o sobre un cruce de ferrocarril o puente, o en cualquier otra zona donde
    esté prohibido rebasar. A menos que se encuentre en el lado opuesto de una carretera
    de varios carriles con una mediana o un carril central compartido para girar,
    no puede rebasar a un autobús escolar detenido que tenga activadas sus luces rojas
    intermitentes.
- id: 236
  category: safe_driving_rules
  question: 'Si un señalizador (flagger) está dirigiendo el tráfico en una zona de
    construcción, usted debe:'
  choices:
    A: Seguir las instrucciones dadas por el señalizador.
    B: Copiar lo que hace el tráfico circundante, a pesar de las instrucciones del
      señalizador.
    C: Asumir que el señalizador no debería estar dirigiendo el tráfico.
    D: Seguir las leyes que estarían vigentes si el área no estuviera en construcción.
  answer: A
  explanation: Esté preparado para reducir su velocidad y actuar con precaución cuando
    se lo indique una señal, un señalizador o un oficial de la ley. No hacerlo es
    ilegal y peligroso para quienes trabajan en las zonas de construcción.
- id: 237
  category: sharing_the_road
  question: 'Cuando vea o escuche que se acerca un vehículo de emergencia, debe:'
  choices:
    A: Detenerse inmediatamente y dejar pasar al vehículo.
    B: Conducir lo más a la derecha posible de la carretera de forma segura y detenerse.
    C: Proceder lentamente y permitir que el vehículo pase.
    D: Seguir moviéndose lentamente, manteniéndose en el lado derecho de la carretera.
  answer: B
  explanation: Al conducir en una carretera de dos carriles o en una autopista sin
    división, debe ceder el paso a un vehículo de emergencia que use sus luces y/o
    sirena, independientemente de la dirección desde la que se acerque. Conduzca inmediatamente
    lo más cerca posible del lado derecho de la carretera y deténgase, teniendo cuidado
    de no detenerse dentro de una intersección.
- id: 238
  category: safe_driving_rules
  question: 'Usted llega a una intersección y tiene luz verde. Los peatones están
    cruzando en rojo. Usted debe:'
  choices:
    A: Tocar la bocina.
    B: Acelerar y pasar por delante de los peatones.
    C: Detenerse para dejar que los peatones crucen de forma segura.
    D: Conducir cerca de los peatones y asustarlos para que lo piensen dos veces antes
      de cruzar en rojo.
  answer: C
  explanation: Ceda el paso a los peatones y autos que puedan quedar atrapados en
    una intersección cuando usted tenga luz verde. Tenga cuidado con los peatones
    en cualquier circunstancia.
- id: 239
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento correcto para entrar en una autopista (freeway)
    en Nueva Jersey?
  choices:
    A: Señalizar, ceder el paso al tráfico existente y entrar a la misma velocidad
      a la que se mueve el tráfico.
    B: Señalizar y entrar en la autopista. El tráfico de la autopista debe ceder el
      paso.
    C: Conducir despacio para poder comprobar el tráfico.
    D: Hacer siempre una parada completa primero.
  answer: A
  explanation: Al incorporarse al tráfico, debe señalizar y entrar a la misma velocidad
    a la que se mueve el tráfico. Siempre ceda el paso a otros vehículos al entrar
    en una carretera.
- id: 240
  category: defensive_driving
  question: 'Conducir de noche requiere mayor precaución porque:'
  choices:
    A: El tráfico se mueve más rápido por la noche.
    B: Hay un mayor volumen de tráfico por la noche.
    C: Los conductores no pueden ver tan bien por la noche.
    D: Los accidentes ocurren con más frecuencia por la noche.
  answer: C
  explanation: Debido a la oscuridad, los conductores no pueden ver tan bien de noche
    como durante el día. Desde media hora después de la puesta del sol hasta media
    hora antes de la salida del sol, o en cualquier otro momento en que las personas
    o los vehículos no sean visibles a 500 pies, los conductores deben usar sus faros
    delanteros.
- id: 241
  category: penalties_and_points
  question: 'No cumplir con las restricciones impuestas a una Licencia de Conducir
    Graduada (GDL):'
  choices:
    A: No es un gran problema.
    B: Resultará únicamente en puntos contra la licencia de conducir.
    C: No tendrá consecuencias negativas.
    D: Puede resultar en una multa y la suspensión de la licencia.
  answer: D
  explanation: Un conductor principiante con una Licencia de Conducir Graduada (GDL)
    debe cumplir con restricciones de conducción estrictas. El incumplimiento de estas
    restricciones puede resultar en una multa de $100 y la suspensión de la GDL.
- id: 242
  category: safe_driving_rules
  question: Cuando dos vehículos entran en una intersección desde diferentes carreteras
    al mismo tiempo, ¿qué vehículo debe ceder el paso?
  choices:
    A: Cualquiera de los dos
    B: El vehículo a la izquierda
    C: El vehículo a la derecha
    D: Ninguno
  answer: B
  explanation: En las intersecciones controladas por señales o semáforos y en las
    intersecciones no controladas, el conductor de la izquierda debe ceder el paso
    al conductor de la derecha cuando dos vehículos llegan a la intersección al mismo
    tiempo.
- id: 243
  category: safe_driving_rules
  question: 'Las señales de tráfico a veces muestran flechas para controlar los giros
    desde carriles específicos. Una flecha verde:'
  choices:
    A: Se utiliza únicamente en calles de sentido único.
    B: Tiene el mismo significado que un semáforo verde circular, pero el tráfico
      debe girar en la dirección indicada por la flecha.
    C: Significa que puede avanzar, pero solo si la flecha verde va acompañada de
      una luz verde circular.
    D: Indica el camino hacia un aeropuerto.
  answer: B
  explanation: Una flecha verde tiene el mismo significado que un semáforo verde circular,
    pero el tráfico en el carril indicado debe girar en la dirección mostrada por
    la flecha.
- id: 244
  category: safe_driving_rules
  question: Los carriles de tráfico que se mueven en direcciones opuestas están divididos
    por líneas ____.
  choices:
    A: Blancas
    B: Rojas
    C: Negras
    D: Amarillas
  answer: D
  explanation: Las líneas amarillas se utilizan para dividir el tráfico que se mueve
    en direcciones opuestas.
- id: 245
  category: defensive_driving
  question: ¿Cómo puede reducir el riesgo de hidroplaneo (hydroplaning)?
  choices:
    A: No exceda la velocidad cuando las carreteras estén mojadas.
    B: Use neumáticos con la presión de aire adecuada.
    C: Reemplace los neumáticos con la banda de rodadura desgastada.
    D: Todas las anteriores.
  answer: D
  explanation: El hidroplaneo ocurre cuando un vehículo se desliza sobre una capa
    delgada de agua entre sus neumáticos y la carretera. Los neumáticos con baja presión
    de aire o banda de rodadura desgastada pueden aumentar el riesgo de hidroplaneo.
    El exceso de velocidad también aumenta el riesgo.
- id: 246
  category: signs_and_signals
  question: 'Para reducir los efectos del resplandor de los faros por la noche, debe
    mirar:'
  choices:
    A: Directamente hacia adelante.
    B: Por encima de su hombro.
    C: Al centro de la carretera.
    D: Hacia el borde derecho de la carretera.
  answer: D
  explanation: Si los conductores que vienen en sentido contrario no bajan sus luces
    delanteras, mantenga la vista en el lado derecho de la carretera adelante. No
    mire directamente a los faros que vienen en sentido contrario porque el resplandor
    puede cegarlo durante varios segundos.
- id: 247
  category: safe_driving_rules
  question: 'Debe detenerse en una intersección cuando vea una:'
  choices:
    A: Luz roja intermitente.
    B: Luz amarilla fija.
    C: Flecha amarilla.
    D: Luz amarilla intermitente.
  answer: A
  explanation: Una señal de tráfico roja intermitente tiene el mismo significado que
    una señal de alto (pare). En una intersección con una luz roja intermitente, debe
    detenerse por completo, mirar a ambos lados y avanzar solo después de que la intersección
    esté despejada.
- id: 248
  category: alcohol_drugs_health
  question: 'El efecto que el alcohol tiene sobre sus reflejos y juicio:'
  choices:
    A: Es menos pronunciado cuando se consume cerveza en lugar de vino.
    B: Es menos pronunciado cuando se consume vino en lugar de cerveza.
    C: Es más pronunciado cuando se consumen sidras fuertes y bebidas mixtas.
    D: Depende de la cantidad de alcohol en su torrente sanguíneo.
  answer: D
  explanation: El consumo de cualquier tipo de alcohol puede tener efectos negativos
    en sus reflejos y juicio. No importa qué tipo de alcohol se consuma, sino cuánto
    alcohol ha entrado en el torrente sanguíneo de una persona.
- id: 249
  category: vehicle_information
  question: Para registrar un vehículo en Nueva Jersey, debe tener ____ años de edad
    o más.
  choices:
    A: '17'
    B: '25'
    C: '18'
    D: '21'
  answer: A
  explanation: Para registrar un vehículo motorizado en Nueva Jersey, debe tener al
    menos 17 años de edad. Debe tener prueba de identidad y prueba de propiedad del
    vehículo.
- id: 250
  category: vehicle_information
  question: 'Se le revienta un neumático mientras conduce. Usted debe:'
  choices:
    A: Frenar bruscamente.
    B: Sujetar el volante con firmeza y reducir la velocidad hasta detenerse.
    C: Seguir conduciendo normalmente.
    D: Encender las luces de emergencia y continuar conduciendo.
  answer: B
  explanation: Si experimenta un reventón de neumático, no aplique los frenos de inmediato.
    Sujete el volante con firmeza y maniobre para permanecer en su carril de tráfico.
    Reduzca su velocidad gradualmente soltando el acelerador y manteniéndose alejado
    de los frenos. Una vez que se mueva muy lentamente, aplique los frenos ligeramente
    y salga de la carretera hacia un área segura.
- id: 251
  category: defensive_driving
  question: 'Aumente su distancia de seguimiento cuando:'
  choices:
    A: Conduzca detrás de un vehículo grande que bloquee su visión.
    B: Salga de una autopista.
    C: Siga a una motocicleta.
    D: Todas las anteriores.
  answer: D
  explanation: Debe aumentar su distancia de seguimiento cuando esté detrás de un
    vehículo grande que bloquee su visión, al conducir con mal tiempo o tráfico pesado,
    al salir de una autopista, al ir detrás de una motocicleta o bicicleta, y si alguien
    lo sigue demasiado cerca (tailgating).
- id: 252
  category: safe_driving_rules
  question: 'El brazo y la mano izquierda del conductor están extendidos hacia abajo.
    Esta señal manual significa que el conductor planea:'
  choices:
    A: Girar a la izquierda.
    B: Girar a la derecha.
    C: Detenerse.
    D: Arrancar.
  answer: C
  explanation: Si el brazo y la mano izquierda de un conductor están extendidos hacia
    abajo, están indicando que tienen la intención de detenerse. Ajuste su conducción
    en consecuencia si sigue a un conductor que está usando esta señal manual.
- id: 253
  category: signs_and_signals
  question: 'No puede cruzar una sola línea blanca o amarilla discontinua:'
  choices:
    A: Cuando al hacerlo interfiera con el tráfico.
    B: Al girar a la izquierda hacia una entrada privada.
    C: Cuando el automóvil delante de usted esté averiado.
    D: Al rebasar por la derecha en una calle de sentido único.
  answer: A
  explanation: Puede cruzar una sola línea discontinua para rebasar o cambiar de carril,
    siempre que pueda hacerlo de manera segura y sin interferir con el tráfico.
- id: 254
  category: safe_driving_rules
  question: 'Para asegurarse de que su condición física no le haga conducir de manera
    insegura, usted debe:'
  choices:
    A: Mantenerse en buena forma física y realizarse exámenes físicos regulares.
    B: Conocer el efecto de cualquier medicamento en su capacidad para conducir.
    C: Conducir dentro de sus limitaciones físicas.
    D: Todas las anteriores.
  answer: D
  explanation: Su condición física tiene una influencia importante en su capacidad
    para conducir de manera segura. Los conductores deben ser conscientes de sus limitaciones
    físicas y solo conducir si es seguro hacerlo.
- id: 255
  category: signs_and_signals
  question: 'Las señales que son de color naranja son:'
  choices:
    A: Señales de zona de obras.
    B: Señales reglamentarias.
    C: Señales de zona escolar.
    D: Señales de guía.
  answer: A
  explanation: Las zonas de obras en las carreteras se establecen según el tipo de
    trabajo que se esté realizando a lo largo de la calzada. Las señales en las áreas
    de trabajo suelen tener forma de diamante, son de color naranja, tienen letras
    o símbolos negros y sirven como advertencia de que hay personas trabajando en
    la carretera o cerca de ella.
- id: 256
  category: vehicle_information
  question: 'Al viajar en un vehículo, los niños pequeños:'
  choices:
    A: Pueden ser sostenidos de manera segura por un adulto fuerte.
    B: Estarán seguros si están de pie en el suelo en la parte trasera del vehículo.
    C: No resultarán heridos en un accidente porque son pequeños.
    D: Nunca se les debe permitir viajar mientras están de pie en el vehículo.
  answer: D
  explanation: Existen asientos especiales para niños que son demasiado pequeños para
    usar cinturones de seguridad normales. Ninguna persona es lo suficientemente fuerte
    como para sujetar con seguridad a un niño de cualquier tamaño durante un accidente
    o una parada repentina. Nunca permita que un niño viaje en un vehículo a menos
    que esté debidamente sujeto a un asiento.
- id: 257
  category: vehicle_information
  question: 'Dejar un margen de espacio entre su vehículo y su entorno es importante
    porque:'
  choices:
    A: Evita distracciones de otros vehículos.
    B: Le da tiempo para reaccionar ante situaciones inesperadas.
    C: Mantiene el flujo del tráfico a un ritmo seguro.
    D: Mantiene alerta a otros conductores.
  answer: B
  explanation: La única manera de estar seguro de que tendrá suficiente tiempo para
    reaccionar ante los errores cometidos por otros conductores es dejar mucho espacio
    entre usted y los vehículos que lo rodean.
- id: 258
  category: safe_driving_rules
  question: 'Debe orillarse al borde de la carretera y permitir que pase un vehículo
    de emergencia:'
  choices:
    A: Independientemente de su dirección.
    B: Solo si lo está siguiendo.
    C: Solo si se le acerca desde la dirección opuesta.
    D: Ninguna de las anteriores.
  answer: A
  explanation: Debe orillarse al borde derecho de la carretera y detenerse ante un
    vehículo de emergencia con luces intermitentes, independientemente de si se aproxima
    por detrás o desde la dirección opuesta.
- id: 259
  category: alcohol_drugs_health
  question: 'Para evitar el envenenamiento por monóxido de carbono, los conductores
    deben:'
  choices:
    A: Hacer revisar su sistema de escape regularmente para asegurarse de que no tenga
      fugas.
    B: Mantener el motor apagado cuando el automóvil esté en un garaje cerrado.
    C: Cerrar las rejillas de ventilación cuando sigan de cerca a otro automóvil.
    D: Todas las anteriores.
  answer: D
  explanation: Los vapores de monóxido de carbono son inodoros y mortales. Los síntomas
    del envenenamiento por monóxido de carbono son cansancio repentino, bostezos,
    mareos y náuseas. La única cura es un suministro adecuado de aire fresco.
- id: 260
  category: safe_driving_rules
  question: 'Al cambiar de carril, no debe:'
  choices:
    A: Revisar sus espejos laterales y el retrovisor.
    B: Poner la luz de giro para señalar sus intenciones.
    C: Revisar si hay otros conductores que puedan estar moviéndose al mismo carril
      que usted.
    D: Usar su teléfono celular para contactar a la policía para determinar si el
      camino por delante está despejado.
  answer: D
  explanation: Antes de cambiar de carril, revise sus espejos laterales y el retrovisor
    para ver si hay tráfico que se aproxima por detrás. Use su señal de giro para
    que otros conductores sepan que planea cambiar de carril. Revise si hay otros
    conductores que también puedan estar moviéndose al mismo carril.
- id: 261
  category: sharing_the_road
  question: 'El emblema de un vehículo de movimiento lento es:'
  choices:
    A: Una señal roja rectangular.
    B: Una señal verde circular.
    C: Una señal amarilla en forma de diamante.
    D: Una señal naranja triangular.
  answer: D
  explanation: El símbolo de vehículo de movimiento lento es un triángulo naranja
    reflectante. Espere que los vehículos que usan este emblema circulen a velocidades
    de 25 mph o menos.
- id: 262
  category: vehicle_information
  question: Si un vehículo que usa luces altas viene hacia usted, debe mirar hacia
    ____ de la carretera.
  choices:
    A: Cualquier lado
    B: El centro
    C: El lado derecho
    D: El lado izquierdo
  answer: C
  explanation: Si un vehículo que se aproxima utiliza las luces altas y no las baja,
    debe mirar hacia el lado derecho de la carretera. Esto evitará que los faros del
    otro vehículo lo deslubren y le permitirá ver lo suficiente para mantenerse en
    su carril hasta que el vehículo pase.
- id: 263
  category: safe_driving_rules
  question: 'La forma correcta de usar una rampa de salida de la autopista es:'
  choices:
    A: Reducir la velocidad antes de entrar en la rampa de salida.
    B: Reducir la velocidad una vez que se haya incorporado a la rampa de salida.
    C: Mantener la velocidad constante una vez en la rampa de salida.
    D: Rebasar al tráfico más lento en la rampa de salida.
  answer: B
  explanation: Al usar una rampa de salida de la autopista, no reduzca la velocidad
    hasta que se haya incorporado a la rampa de salida.
- id: 264
  category: vehicle_information
  question: 'La nieve y el hielo de un vehículo deben eliminarse de:'
  choices:
    A: Las ventanas del vehículo.
    B: El capó del vehículo.
    C: La parte superior del vehículo.
    D: Todas las anteriores.
  answer: D
  explanation: La ley estatal exige que los automovilistas eliminen toda la nieve
    y el hielo de su vehículo antes de conducirlo. Se pueden aplicar multas a los
    conductores que no cumplan con esta ley.
- id: 265
  category: safe_driving_rules
  question: 'Puede continuar con cuidado a través de una intersección con luz amarilla
    si:'
  choices:
    A: Hay un vehículo de emergencia cruzando su carril.
    B: Hay peatones cruzando.
    C: Está girando a la derecha.
    D: Ya se encuentra dentro de la intersección cuando la luz cambia a amarillo.
  answer: D
  explanation: Si aparece una luz amarilla fija cuando ya se encuentra dentro de una
    intersección, debe continuar a través de la intersección con cuidado.
- id: 266
  category: safe_driving_rules
  question: 'Se aproxima a una intersección cuando el semáforo cambia de verde a amarillo
    fijo. Usted debe:'
  choices:
    A: Considerarlo igual que una señal de precaución y continuar a través de la intersección.
    B: Detenerse inmediatamente.
    C: Detenerse antes de entrar en la intersección, a menos que esté demasiado cerca
      para detenerse de forma segura.
    D: Acelerar para cruzar la intersección antes de que aparezca la luz roja.
  answer: C
  explanation: Al acercarse a una intersección con un semáforo en amarillo fijo, reduzca
    la velocidad hasta detenerse antes de entrar en la intersección, si es seguro
    hacerlo. Si no puede detenerse de forma segura, conduzca con cuidado a través
    de la intersección.
- id: 267
  category: signs_and_signals
  question: 'Puede cruzar líneas amarillas continuas:'
  choices:
    A: Para rebasar al tráfico que se mueve en la misma dirección.
    B: Solo durante las horas del día.
    C: En cualquier momento.
    D: Al realizar giros.
  answer: D
  explanation: Como regla general, las líneas de tráfico discontinuas se pueden cruzar,
    pero las líneas continuas no. Las líneas amarillas continuas solo se pueden cruzar
    cuando el conductor está realizando un giro.
- id: 268
  category: defensive_driving
  question: 'Al conducir bajo la lluvia, debe:'
  choices:
    A: Usar las luces bajas.
    B: Usar las luces altas.
    C: Usar las luces de estacionamiento.
    D: No usar luces.
  answer: A
  explanation: En condiciones de lluvia, debe usar las luces bajas.
- id: 269
  category: vehicle_information
  question: ¿Quién está obligado a usar el cinturón de seguridad en un vehículo motorizado
    en movimiento?
  choices:
    A: Solo el conductor
    B: Solo los pasajeros adultos
    C: Solo los pasajeros niños
    D: Todos los ocupantes del vehículo motorizado
  answer: D
  explanation: Según la ley estatal, el conductor y todos los pasajeros de un vehículo
    de pasajeros deben usar el cinturón de seguridad. El hecho de que un conductor,
    un pasajero del asiento delantero o un niño menor de 18 años no use el cinturón
    de seguridad es una infracción primaria. El conductor es responsable de todos
    los pasajeros menores de 18 años. Según una ley secundaria, a todos los ocupantes
    del asiento trasero de 18 años o más que no lleven puesto el cinturón se les puede
    emitir una citación si el vehículo ha sido detenido por un motivo diferente.
- id: 270
  category: alcohol_drugs_health
  question: 'Si conduce tan despacio que el tráfico se está acumulando detrás de usted,
    debe:'
  choices:
    A: Disminuir su velocidad.
    B: Hacerse a un lado a la derecha de la carretera y dejar pasar el tráfico.
    C: No dejar que los otros autos rebasen su vehículo.
    D: Usar las luces intermitentes de emergencia.
  answer: B
  explanation: Conducir más despacio que el flujo del tráfico puede ser peligroso.
    Si se encuentra en una carretera de dos carriles y dos sentidos y conduce tan
    despacio que el tráfico se está acumulando detrás de usted, debe salirse de la
    carretera y dejar pasar a los otros vehículos. Solo conduzca significativamente
    por debajo del límite de velocidad cuando las condiciones lo requieran.
- id: 271
  category: alcohol_drugs_health
  question: ¿Cuál es un peligro potencial de un sistema de escape con fugas?
  choices:
    A: Causar un uso excesivo de aceite.
    B: Requerir que su vehículo tenga una puesta a punto antes de lo normal.
    C: Hacer que le dé sueño mientras conduce.
    D: Provocar incendios de pasto en caminos rurales.
  answer: C
  explanation: El sistema de escape ayuda a eliminar los gases tóxicos, reducir el
    ruido y enfriar los gases calientes que provienen de un motor en funcionamiento.
    Los vapores de un sistema de escape con fugas pueden causar la muerte en muy poco
    tiempo. También pueden hacer que le dé sueño mientras conduce.
- id: 272
  category: safe_driving_rules
  question: Un camión con remolque (tractor-trailer) podría tardar hasta un ____ por
    ciento más en detenerse en condiciones climáticas adversas que en condiciones
    de conducción ideales.
  choices:
    A: '10'
    B: '25'
    C: '40'
    D: '55'
  answer: B
  explanation: Al conducir cerca de un camión con remolque, tenga en cuenta cómo su
    tamaño afectará la forma en que se conduce. En condiciones climáticas adversas,
    el vehículo más grande puede tardar hasta un 25 por ciento más en detenerse por
    completo de lo que tardaría si se condujera en condiciones ideales.
- id: 273
  category: safe_driving_rules
  question: 'Al conducir cerca de camiones pesados, otros conductores y usuarios de
    la carretera deben tener en cuenta:'
  choices:
    A: La mayor distancia de frenado requerida por los vehículos grandes.
    B: La menor distancia de frenado requerida por los vehículos grandes.
    C: El menor ruido de los vehículos más grandes.
    D: La mayor velocidad de los vehículos más grandes.
  answer: A
  explanation: Al conducir cerca de camiones pesados, otros conductores y usuarios
    de la carretera deben tener en cuenta la mayor distancia de frenado requerida
    por los vehículos grandes. Los conductores de vehículos más pequeños deben permanecer
    en lugares donde puedan ser vistos por el conductor del vehículo grande y donde
    su visión del tráfico no sea bloqueada por el vehículo.
- id: 274
  category: safe_driving_rules
  question: 'Las distancias de frenado de un vehículo nunca dependen de:'
  choices:
    A: Su propio tiempo de reacción.
    B: La hora del día.
    C: El estado de los frenos de su vehículo.
    D: El estado y el tipo de neumáticos de su vehículo.
  answer: B
  explanation: La distancia que un vehículo necesita para detenerse depende del tiempo
    de reacción del conductor, las condiciones climáticas y de visibilidad, el peso
    del vehículo, el estado de los frenos del vehículo, el estado y tipo de los neumáticos
    del vehículo, las condiciones de la carretera y la velocidad.
- id: 275
  category: sharing_the_road
  question: 'Un ciclista que no obedece las leyes de tránsito:'
  choices:
    A: Está en lo correcto porque los ciclistas no tienen que obedecer las leyes de
      tránsito.
    B: Puede ser multado.
    C: Siempre recibirá una advertencia de las autoridades.
    D: Se le confiscará la bicicleta.
  answer: B
  explanation: Todos los ciclistas tienen los mismos derechos, deberes y responsabilidades
    que los conductores de vehículos motorizados. Los automovilistas y ciclistas que
    no obedecen las leyes de tránsito pueden ser multados.
- id: 276
  category: safe_driving_rules
  question: ¿De qué color son las marcas en el pavimento que separan los carriles
    de tráfico que se mueven en direcciones opuestas?
  choices:
    A: Amarillo
    B: Blanco
    C: Amarillo y blanco
    D: Amarillo, blanco y negro
  answer: A
  explanation: Las líneas amarillas se utilizan en el centro de la carretera para
    separar los carriles de tráfico que se mueven en direcciones opuestas.
- id: 277
  category: signs_and_signals
  question: 'Las señales triangulares que apuntan hacia abajo:'
  choices:
    A: Indican zonas escolares.
    B: Indican a los conductores que cedan el paso.
    C: Indican zonas de construcción.
    D: Indican cruces de ferrocarril.
  answer: B
  explanation: Las señales triangulares que apuntan hacia abajo generalmente indican
    que los conductores deben ceder el paso. Una vez que la carretera esté libre de
    tráfico o peatones y sea seguro hacerlo, los conductores pueden continuar.
- id: 278
  category: vehicle_information
  question: 'Para evitar colisiones con vehículos en sus puntos ciegos, usted debe:'
  choices:
    A: Girar rápidamente la cabeza para ver si su punto ciego está despejado antes
      de cambiar de carril.
    B: Ajustar sus espejos retrovisores cada pocos minutos.
    C: Tocar la bocina justo antes de girar o cambiar de carril.
    D: Ninguna de las anteriores.
  answer: A
  explanation: Antes de girar o cambiar de carril, gire la cabeza y mire por encima
    del hombro en la dirección de su movimiento para ver si su punto ciego está despejado.
    Nunca confíe únicamente en sus espejos.
- id: 279
  category: safe_driving_rules
  question: 'Cuando se encuentra en una fila de tráfico que cruza una vía de ferrocarril
    que no tiene señales ni barreras:'
  choices:
    A: Usted tiene el derecho de paso y no necesita verificar si vienen trenes.
    B: Puede rebasar a los conductores más lentos mientras cruza la vía.
    C: Debe asegurarse de que haya espacio para que su vehículo cruce completamente
      las vías sin detenerse.
    D: Todas las anteriores
  answer: C
  explanation: Si sigue a otro vehículo en un cruce de ferrocarril, verifique que
    tenga suficiente espacio para cruzar completamente antes de entrar en las vías.
    Nunca debe intentar rebasar a otro vehículo al acercarse o cruzar un paso a nivel.
    Siempre verifique si vienen trenes antes de cruzar cualquier vía de ferrocarril.
- id: 280
  category: signs_and_signals
  question: 'Cuando vea una señal roja octagonal (de ocho lados), debe:'
  choices:
    A: Detenerse por completo y verificar si hay peatones y tráfico transversal.
    B: Reducir la velocidad sin detenerse por completo.
    C: Detenerse por completo y esperar una luz verde.
    D: Reducir la velocidad y verificar el tráfico.
  answer: A
  explanation: Cualquier señal de ocho lados (octagonal) es una señal de alto. En
    una intersección con una señal de alto, debe detenerse por completo y verificar
    si hay peatones y tráfico transversal en la intersección. Espere a que la intersección
    esté despejada antes de continuar.
- id: 281
  category: safe_driving_rules
  question: 'Para girar a la izquierda desde calles y autopistas de varios carriles
    y de un solo sentido, debe comenzar desde:'
  choices:
    A: El centro de la intersección.
    B: El carril derecho.
    C: El carril izquierdo.
    D: Cualquier carril.
  answer: C
  explanation: Para girar a la izquierda desde calles y autopistas de varios carriles,
    comience desde el carril izquierdo.
- id: 282
  category: safe_driving_rules
  question: ¿Qué es cierto sobre una zona de obras en Nueva Jersey?
  choices:
    A: Puede ser móvil o estacionaria.
    B: Está marcada con señales blancas y negras.
    C: No requiere que el conductor reduzca la velocidad y preste atención adicional.
    D: Todas las anteriores.
  answer: A
  explanation: Las zonas de obras suelen ser estacionarias, pero también pueden estar
    presentes en forma de vehículos en movimiento pintando líneas, cortando el césped
    o quitando nieve. Las zonas de obras están marcadas con señales naranjas con letras
    o símbolos negros. Reduzca la velocidad y preste atención adicional al acercarse
    o conducir a través de una zona de obras.
- id: 283
  category: safe_driving_rules
  question: 'Al acercarse a un semáforo que muestra una flecha amarilla intermitente,
    los conductores:'
  choices:
    A: Deben incorporarse a un carril en la dirección de la flecha.
    B: Deben detenerse por completo.
    C: Pueden girar a la izquierda después de ceder el paso al tráfico y peatones
      que vienen en sentido contrario.
    D: Tienen el derecho de paso y pueden esperar que el tráfico en sentido contrario
      se detenga por ellos.
  answer: C
  explanation: Una flecha amarilla intermitente indica que se permite girar a la izquierda
    en la dirección de la flecha. Sin embargo, el tráfico que viene en sentido contrario
    tiene luz verde y usted debe ceder el paso al tráfico y a los peatones que se
    aproximan.
- id: 284
  category: safe_driving_rules
  question: 'Si dos vehículos llegan a una intersección no controlada al mismo tiempo:'
  choices:
    A: El vehículo más grande tiene el derecho de paso.
    B: El automóvil de la izquierda tiene el derecho de paso.
    C: El automóvil de la izquierda debe ceder el paso al automóvil de la derecha.
    D: El automóvil de la derecha debe ceder el paso al automóvil de la izquierda.
  answer: C
  explanation: Si dos vehículos llegan al mismo tiempo a una intersección no controlada,
    el conductor de la izquierda debe ceder el paso al conductor de la derecha. El
    conductor de la izquierda puede entonces proceder cuando sea seguro hacerlo.
- id: 285
  category: signs_and_signals
  question: Las señales de guía son señales ____ que proporcionan información de dirección
    y kilometraje a los conductores.
  choices:
    A: Amarillas
    B: Rojas
    C: Verdes
    D: Blancas
  answer: C
  explanation: Las señales de guía, a veces conocidas como señales de destino, tienen
    un fondo verde y proporcionan información de dirección y kilometraje hacia destinos
    específicos. Pueden ser un recurso útil cuando se conduce en lugares desconocidos.
- id: 286
  category: safe_driving_rules
  question: ¿Es legal cruzar una línea central amarilla doble continua para rebasar?
  choices:
    A: Sí.
    B: No.
    C: Si no hay tráfico en sentido contrario.
    D: Si el vehículo delante de usted conduce por debajo del límite de velocidad.
  answer: B
  explanation: Dos líneas amarillas continuas en el centro de una carretera de doble
    sentido significan que ningún carril de tráfico puede cruzar las líneas, a menos
    que estén saliendo de la calzada. Un conductor puede cruzar líneas amarillas dobles
    al entrar o salir de una entrada privada o de un negocio. No se permite rebasar
    sobre una línea amarilla continua.
- id: 287
  category: safe_driving_rules
  question: 'Mientras conduce, se le requiere detener su vehículo:'
  choices:
    A: En una intersección con una señal de alto (STOP).
    B: Donde haya una luz roja.
    C: Cuando un oficial de tránsito le ordene detenerse.
    D: Todas las anteriores.
  answer: D
  explanation: Las situaciones en las que se requiere que los automovilistas se detengan
    incluyen acercarse a intersecciones con señales de alto, acercarse a intersecciones
    donde una luz roja está intermitente o iluminada, o en cualquier momento en que
    un oficial de tránsito ordene que su vehículo se detenga.
- id: 288
  category: penalties_and_points
  question: 'La MVC puede dar por terminado su examen práctico antes de que comience
    si:'
  choices:
    A: Trajo un vehículo de prueba inseguro.
    B: Una consola central u otro equipo en su vehículo obstruye el acceso de ellos
      al pedal del freno.
    C: A su vehículo le faltan los cinturones de seguridad.
    D: Todas las anteriores.
  answer: D
  explanation: Un examen práctico puede ser denegado antes de que comience si el examinador
    considera que su vehículo de prueba es inseguro o inadecuado. El vehículo puede
    considerarse inseguro si le faltan cinturones de seguridad y si el examinador
    no puede acceder al freno de pie o al freno de estacionamiento.
- id: 289
  category: defensive_driving
  question: 'Si alguien conduce de forma agresiva detrás de usted, debe:'
  choices:
    A: Intentar apartarse del camino del conductor agresivo.
    B: Mirar fijamente al conductor mientras lo rebasa.
    C: Acelerar mientras lo rebasa.
    D: Bloquear el carril de rebase.
  answer: A
  explanation: Si se encuentra con un conductor agresivo, debe hacer todo lo posible
    por apartarse de su camino. Debe evitar hacer contacto visual con un conductor
    hostil. Desafiar a un conductor hostil acelerando solo puede enfurecerlo más,
    aumentando así el peligro.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 290
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 291
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está circulando en contra del tráfico en una calle de un solo sentido o en
    una rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de
    forma segura.
  id: 292
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 293
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 294
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 295
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 296
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 297
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 298
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal de forma pentagonal (5 lados) de color amarillo verdoso fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 299
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces ferroviarios. Significa que debe ceder el paso a los trenes.
    Si se acerca un tren, debe detenerse.
  id: 300
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte sobre un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 301
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que la carretera
    gire primero en un sentido y luego en el otro.
  id: 302
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 303
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 304
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: Fin de la carretera
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 305
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (stop) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (stop) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 306
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    vigente pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 307
