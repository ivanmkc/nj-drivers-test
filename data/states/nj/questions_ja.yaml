    C: 自転車が移動するまで完全に停止する
    D: 路肩を走行する
  answer: B
  explanation: 4フィートの距離を保つことが不可能な場合、運転者は時速25マイルまで減速し、安全に追い越せるようになるまで、必要に応じて停止できる準備をしなければなりません。
- id: 121
  category: sharing_the_road
  question: 交通の流れに再合流する際、常に優先権を譲らなければならない車両はどれですか？
  choices:
    A: 警察車両のみ
    B: バスおよび郵便車両
    C: タクシーおよびライドシェア車両
    D: トラックのみ
  answer: B
  explanation: 自動車の運転者は、バスや郵便車両が交通の流れに再合流する際、道を譲らなければなりません。
- id: 122
  category: sharing_the_road
  question: 二輪車（モーターサイクル）事故の最も一般的な原因は何ですか？
  choices:
    A: 二輪車運転者による過度なスピード出しすぎ
    B: 劣悪な道路状況
    C: 自動車の運転者が交通の中で二輪車を検知・認識できないこと
    D: 整備不良（メカニカルトラブル）
  answer: C
  explanation: 自動車の運転者が交通の中で二輪車を検知・認識できないことが、二輪車事故の最も一般的な原因です。
- id: 123
  category: sharing_the_road
  question: 悪天候時、トラックが停止するまでに通常よりどれくらい長く時間がかかることがありますか？
  choices:
    A: 10パーセント長くかかる
    B: 25パーセント長くかかる
    C: 50パーセント長くかかる
    D: 75パーセント長くかかる
  answer: B
  explanation: 悪天候時、トラック、トレーラー、またはバスは、停止するまでに最大で25パーセント長く時間がかかることがあります。
- id: 124
  category: sharing_the_road
  question: 大型トラックの後方の「ノーゾーン（死角）」は、どれくらいの距離まで及びますか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 300フィート
  answer: C
  explanation: トラックの後方のノーゾーン（死角）は、最大200フィート（約60メートル）まで及ぶことがあります。
- id: 125
  category: sharing_the_road
  question: 白い杖や金属製の杖を使用している人に近づく際、運転者が停止しなければならないのはなぜですか？
  choices:
    A: それがマナーだから
    B: その人は視覚障害があり、法律で停止が義務付けられているから
    C: その人が高齢者だから
    D: 推奨されているが、義務ではないから
  answer: B
  explanation: 法律により、すべての運転者は、白い杖や金属製の杖を使用している、または盲導犬を連れている視覚障害者のために停止することが義務付けられています。(N.J.S.A.
    39:4-37.1)
- id: 126
  category: sharing_the_road
  question: 車両の速度が何マイルから何マイルに上がると、歩行者の死亡率は5%から85%に急上昇しますか？
  choices:
    A: 時速15マイルから35マイル
    B: 時速20マイルから40マイル
    C: 時速25マイルから45マイル
    D: 時速30マイルから50マイル
  answer: B
  explanation: 車両と歩行者の衝突事故における死亡率は、時速20マイル（20 mph）では5%ですが、時速40マイル（40 mph）では85%に急上昇します。
- id: 127
  category: sharing_the_road
  question: 複数車線の道路で横断歩道の手前で停止する場合、横断歩道の約何フィート手前で停止すべきですか？
  choices:
    A: 10フィート
    B: 20フィート
    C: 30フィート
    D: 50フィート
  answer: C
  explanation: 複数車線の道路では、隣の車線の運転者の視界を妨げないよう、横断歩道の約30フィート（約9メートル）手前で停止してください。
- id: 128
  category: sharing_the_road
  question: 乗馬している人に近づく際、運転者は速度を何マイル以下に落とさなければなりませんか？
  choices:
    A: 時速10マイル以下
    B: 時速15マイル以下
    C: 時速25マイル以下
    D: 時速35マイル以下
  answer: C
  explanation: 乗馬している人や馬車に接近または追い越す際、運転者は速度を時速25マイル（25 mph）以下に落とさなければなりません。(N.J.S.A.
    39:4-72)
- id: 129
  category: sharing_the_road
  question: 時速55マイルで走行している貨物列車が停止するまでに、どれくらいの距離が必要ですか？
  choices:
    A: 500フィート
    B: 0.5マイル（約800メートル）
    C: 1マイル（約1.6キロメートル）以上
    D: 2マイル
  answer: C
  explanation: 時速55マイルで走行している貨物列車が停止するには、1マイル（約1.6キロメートル）以上の距離が必要になることがあります。
- id: 130
  category: sharing_the_road
  question: 踏切から何フィート以内の場所で、他の車両を追い越してはいけませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 300フィート
  answer: B
  explanation: 踏切から100フィート（約30メートル）以内の場所では、他の車両を追い越してはいけません。
- id: 131
  category: sharing_the_road
  question: ニュージャージー州法において、自転車利用者、スケートボーダー、インラインスケーターはどのような地位にありますか？
  choices:
    A: 道路上での権利が制限されている
    B: 自動車と同じ権利と責任を持つ
    C: 常に自動車に道を譲らなければならない
    D: 自転車専用レーンのみを使用できる
  answer: B
  explanation: ニュージャージー州法では、自転車利用者、スケートボーダー、インラインスケーターは、自動車と同じ権利と責任を有します。
- id: 132
  category: sharing_the_road
  question: ニュージャージー州におけるモペッド（原動機付自転車）の制限速度は何マイルですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: モペッドの運転者は時速25マイル（25 mph）を超えてはなりません。
- id: 133
  category: sharing_the_road
  question: 「標示のない横断歩道（unmarked crosswalk）」とは何ですか？
  choices:
    A: ペイントが薄くなった横断歩道
    B: ペイントされた線がなくても、すべての交差点にある横断歩道
    C: 無断横断（ジェイウォーク）エリア
    D: 私有地内の横断歩道
  answer: B
  explanation: すべての交差点には、たとえ標示がなくても横断歩道が存在します。これは「標示のない横断歩道」として知られています。
- id: 134
  category: vehicle_information
  question: 自動車賠償責任保険は：
  choices:
    A: ニュージャージー州では任意である
    B: ニュージャージー州では義務である
    C: 新車のみに義務付けられている
    D: 商用車のみに義務付けられている
  answer: B
  explanation: ニュージャージー州では自動車賠償責任保険への加入が義務付けられています。登録されているすべての車両が加入していなければなりません。(N.J.S.A.
    39:6B-1)
- id: 135
  category: vehicle_information
  question: ニュージャージー州に転入後、車両の所有権登録（タイトル）と車両登録はいつまでに行う必要がありますか？
  choices:
    A: 30日以内
    B: 60日以内
    C: 90日以内
    D: 1年以内
  answer: B
  explanation: ニュージャージー州に転入した場合、車両の所有権登録と車両登録は60日以内、または他州の登録が先に切れる場合はそれまでに行わなければなりません。
- id: 136
  category: vehicle_information
  question: 製造から5年以上経過した乗用車は、どのくらいの頻度で州の車検に合格する必要がありますか？
  choices:
    A: 毎年
    B: 2年ごと
    C: 3年ごと
    D: 5年ごと
  answer: B
  explanation: 製造から5年以上経過した乗用車は、2年ごとに州の車検に合格する必要があります。
- id: 137
  category: vehicle_information
  question: 製造から5年未満の新車（乗用車）には、いつ期限が切れるディーラーステッカーが交付されますか？
  choices:
    A: 登録から1年後
    B: 登録から2年後
    C: 初回登録から5年後
    D: 登録から3年後
  answer: C
  explanation: 製造から5年未満の新車（乗用車）には、初回登録から5年後に期限が切れるステッカーが交付されます。
- id: 138
  category: vehicle_information
  question: ニュージャージー州に転入して車両登録を行った後、製造から5年以上経過した車両はいつまでに車検を受ける必要がありますか？
  choices:
    A: 7日以内
    B: 14日以内
    C: 30日以内
    D: 60日以内
  answer: B
  explanation: 製造から5年以上経過した車両は、ニュージャージー州で登録してから14日以内に車検を受ける必要があります。
- id: 139
  category: vehicle_information
  question: ナンバープレートは夜間に50フィート離れた場所から見える必要があります。地上からどのくらいの高さに取り付ける必要がありますか？
  choices:
    A: 少なくとも6インチ以上36インチ未満
    B: 地上から少なくとも12インチ以上48インチ未満
    C: 少なくとも18インチ以上60インチ未満
    D: 任意の高さ
  answer: B
  explanation: ナンバープレートは、地上から少なくとも12インチ以上48インチ未満の高さに取り付ける必要があります。(N.J.S.A. 39:3-33)
- id: 140
  category: vehicle_information
  question: 自動車保険を解約した場合、ナンバープレートはどうしなければなりませんか？
  choices:
    A: 次の車両のために保管する
    B: MVC（車両委員会）に返却する
    C: 破棄する
    D: 何もしなくてよい
  answer: B
  explanation: 自動車保険を解約した場合、ナンバープレートはMVCに返却しなければなりません。
- id: 141
  category: vehicle_information
  question: ナンバープレートの文字を隠すようなカバーを使用した場合の罰金はいくらですか？
  choices:
    A: 最大50ドル
    B: 最大100ドル
    C: 最大200ドル
    D: 最大500ドル
  answer: B
  explanation: 文字を不鮮明にしたり隠したりするナンバープレートカバーやホルダーの使用は違反であり、最大100ドルの罰金が科せられます。
- id: 142
  category: signs_and_signals
  question: 黄色の信号は何を意味しますか？
  choices:
    A: 通過するために加速する
    B: 安全に停止できないほど近い場合を除き、交差点に入る前に停止する
    C: 注意して進む
    D: 対向車に道を譲る
  answer: B
  explanation: 青信号の次に黄色信号になった場合、安全に停止できないほど交差点に近い場合を除き、ドライバーは交差点に入る前に停止しなければなりません。
- id: 143
  category: signs_and_signals
  question: ニュージャージー州において、赤の点滅信号は何を意味しますか？
  choices:
    A: 譲ってから進む
    B: 停止し、安全を確認してから進む
    C: 徐行する
    D: 緊急車両が接近している
  answer: B
  explanation: 赤の点滅信号では、完全に停止し、安全を確認してから進む必要があります。
- id: 144
  category: signs_and_signals
  question: 「ステール・グリーンライト（時間が経過した青信号）」とは何を意味しますか？
  choices:
    A: 故障した信号機
    B: しばらく青のままで、もうすぐ変わる可能性のある信号
    C: 青の矢印信号
    D: 夜間の青信号
  answer: B
  explanation: ステール・グリーンライトとは、しばらくの間青の状態が続いている信号のことです。黄色、そして赤に変わることに備えてください。
- id: 145
  category: signs_and_signals
  question: ニュージャージー州において、道路の破線のセンターラインは何を示していますか？
  choices:
    A: 追い越し禁止
    B: 破線がある側の車線で追い越しが可能
    C: 道路が工事中である
    D: 一方通行
  answer: B
  explanation: センターラインが一本の破線の場合、その破線がある側の車線でのみ追い越しが許可されます。
- id: 146
  category: signs_and_signals
  question: ニュージャージー州の警戒標識は何色ですか？
  choices:
    A: 赤
    B: 緑
    C: 黄色（ひし形）
    D: 青
  answer: C
  explanation: 警戒標識は黄色でひし形をしています。
- id: 147
  category: signs_and_signals
  question: 規制標識（一時停止や速度制限など）は何色ですか？
  choices:
    A: 黄色
    B: 白地に黒の文字（または一時停止/譲れは赤）
    C: 緑
    D: 青
  answer: B
  explanation: 規制標識は通常、白地に黒の文字で書かれています。一時停止の標識は赤色、譲れ（Yield）の標識は赤と白です。
- id: 148
  category: signs_and_signals
  question: 一時停止標識はどのような形をしていますか？
  choices:
    A: 円形
    B: 正方形
    C: ひし形
    D: 八角形（8つの辺）
  answer: D
  explanation: 一時停止標識は八角形（8つの辺）であり、この形をした標識は他にありません。
- id: 149
  category: signs_and_signals
  question: 高速道路にある案内標識は何色ですか？
  choices:
    A: 黄色
    B: 白
    C: 緑
    D: オレンジ
  answer: C
  explanation: 緑色の標識は高速道路にある案内標識で、方向や距離を示しています。
- id: 150
  category: signs_and_signals
  question: 工事区域の標識は何色ですか？
  choices:
    A: 黄色
    B: 赤
    C: オレンジ
    D: 緑
  answer: C
  explanation: 工事区域の警戒標識はオレンジ色です。
- id: 151
  category: signs_and_signals
  question: 交差点で道路を横切る1本の太い実線の白線は何を意味しますか？
  choices:
    A: 合流
    B: 信号や標識のために線の手前で停止する
    C: 加速する
    D: この先に工事区間がある
  answer: B
  explanation: 交差点で道路を横切る1本の太い実線の白線は、運転者が信号や標識のためにその線の手前で停止しなければならないことを意味します。
- id: 152
  category: signs_and_signals
  question: 青色の高速道路標識は何を示していますか？
  choices:
    A: 警告
    B: 規制
    C: サービス（ガソリン、食事、病院）
    D: 工事
  answer: C
  explanation: 青色の標識は、ガソリンスタンド、食事、病院など、高速道路付近で利用可能なサービスを示しています。
- id: 153
  category: safe_driving_rules
  question: 走行中の車両からのポイ捨て（ゴミの投げ捨て）は、どのような結果を招く可能性がありますか？
  choices:
    A: 警告
    B: 最大1,000ドルの罰金および免許停止の可能性
    C: 50ドルの罰金
    D: 社会奉仕活動のみ
  answer: B
  explanation: 危険な物品を投げ捨てた場合、最大1,000ドルの罰金が科せられます。走行中の車両から投げ捨てた場合、運転者は免許を失う可能性があります。(N.J.S.A.
    39:4-63)
- id: 154
  category: driver_responsibility
  question: 一酸化炭素 (CO) とは何ですか？また、なぜ運転者にとって危険なのですか？
  choices:
    A: 排気ガスから出る目に見えるガス
    B: 車の排気ガスに含まれる、無臭・無色のガス
    C: エンジンから出る無害な副産物
    D: 腐った卵のような臭いがするガス
  answer: B
  explanation: 一酸化炭素は、車の排気ガスに含まれる無臭・無色のガスで、死に至る可能性があります。
- id: 155
  category: defensive_driving
  question: 衝突が避けられない場合、何にぶつかることを選ぶべきですか？
  choices:
    A: 正面から向かってくるもの
    B: 向かってくるものよりも動いていないもの、硬いものよりも衝撃を吸収するもの
    C: 利用可能な最も大きな物体
    D: 何も選ばない。常に道路外へ急ハンドルを切る
  answer: B
  explanation: 正面衝突を避けるため、同じ方向に動いているもの、次に動いていないものを選んでください。硬い物体よりも、衝撃を吸収するもの（茂みなど）を選んでください。
- id: 156
  category: safe_driving_rules
  question: 標識のないラウンドアバウト（環状交差点）では、誰に優先権がありますか？
  choices:
    A: 交差点に進入する車両
    B: 右側から接近してくる車両
    C: すでに交差点内にいる車両
    D: 最も大きな車両
  answer: B
  explanation: 標識のない交差点やラウンドアバウトの基本ルールは、左側の車両が右側から接近する車両に道を譲るというものです。
- id: 157
  category: safe_driving_rules
  question: 高速道路で出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 出口ランプをバックで戻る
    B: 高速道路上で停止し、逆走する
    C: 次の出口まで行く
    D: Uターンする
  answer: C
  explanation: 出口を通り過ぎてしまった場合は、次の出口まで進んでください。出口ランプや高速道路上で決してバックしてはいけません。
- id: 158
  category: penalties_and_points
  question: ニュージャージー州でアルコールを合法的に購入または摂取できる最低年齢は何歳ですか？
  choices:
    A: '18'
    B: '19'
    C: '20'
    D: '21'
  answer: D
  explanation: ニュージャージー州では、アルコールの購入、所持、または摂取は21歳以上でなければなりません。
- id: 159
  category: alcohol_drugs_health
  question: 「Kulesh's, Kuberts' and Bolis' Law」は、運転中の違法な携帯電話の使用を何と定めていますか？
  choices:
    A: 軽微な交通違反
    B: 自動車による致死傷罪の法令における無謀運転
    C: 軽罪
    D: 駐車違反
  answer: B
  explanation: この法律は、運転中の違法な携帯電話の使用を、自動車による致死傷罪の法令における無謀運転（recklessness）と定めています。
- id: 160
  category: sharing_the_road
  question: トラックに関する「ノーゾーン (no-zone)」とは何を意味しますか？
  choices:
    A: トラック付近の駐車禁止区域
    B: トラックの運転手が他の車両を確認できない死角
    C: 速度制限区域
    D: 高速道路の追い越し禁止区間
  answer: B
  explanation: ノーゾーンとは、トラックの運転手が他の車両を確認できない、トラック周囲の死角のことです。
- id: 161
  category: sharing_the_road
  question: 安全追越し法（Safe Passing Law）に違反し、身体的傷害を負わせた場合の罰金はいくらですか？
  choices:
    A: $100
    B: $250
    C: $500および違反点数2点
    D: $1,000
  answer: C
  explanation: 身体的傷害が生じた場合：500ドルの罰金と違反点数2点。傷害がない場合：100ドルの罰金で違反点数はなし。(N.J.S.A. 39:4-92.4)
- id: 162
  category: defensive_driving
  question: 運転者はABS（アンチロック・ブレーキ・システム）をどのように操作すべきですか？
  choices:
    A: 緊急時にポンピングブレーキ（ブレーキを数回に分けて踏むこと）を行う
    B: 一定の力で踏み続ける。絶対にポンピングブレーキをしたり、ハンドルを急激に切ったりしない
    C: 雨の日のみ使用する
    D: 軽く叩くように踏む
  answer: B
  explanation: ABS装着車では、ブレーキペダルを一定の力で踏み続けてください。ABSを作動させている間は、絶対にポンピングブレーキをしたり、ハンドルを急激に切ったりしないでください。
- id: 163
  category: driver_responsibility
  question: チャイルドシート安全法（child passenger safety law）に従わなかった場合の罰金はいくらですか？
  choices:
    A: $25以上$50以下
    B: $50以上$75以下、および手数料と裁判費用
    C: $100以上$200以下
    D: $500
  answer: B
  explanation: チャイルドシート安全法に従わなかった場合、50ドル以上75ドル以下の罰金に加え、手数料および裁判費用が科されます。
- id: 164
  category: safe_driving_rules
  question: 対向車がハイビーム（明るいライト）を使用しているとき、運転者はどうすべきですか？
  choices:
    A: 相手に対してハイビームを点滅させて知らせる
    B: 対向車が通り過ぎるまで、道路の右側を見る
    C: 片目を閉じる
    D: 素早く通り過ぎるために加速する
  answer: B
  explanation: 対向車が通り過ぎるまで、道路の右側を見てください。対向車の運転手に対してハイビームを点滅させてはいけません。
- id: 165
  category: defensive_driving
  question: 対向車のハイビームの眩しさから視力が回復するまでに、どのくらいの時間がかかりますか？
  choices:
    A: 1〜2秒
    B: 3〜5秒
    C: 7〜10秒
    D: 15秒
  answer: B
  explanation: 対向車のハイビームの眩しさから回復するには、3秒から5秒かかることがあります。
- id: 166
  category: penalties_and_points
  question: DUI（飲酒・薬物影響下運転）または呼気検査拒否に対する付加金（surcharge）はいくらですか？
  choices:
    A: 年間$500を3年間
    B: 年間$750を3年間
    C: 年間$1,000を3年間
    D: 年間$1,500を5年間
  answer: C
  explanation: DUIまたは呼気検査拒否に対する違反付加金は、3年間にわたり毎年1,000ドルです。
- id: 167
  category: penalties_and_points
  question: イグニッション・インターロック装置（エンジン始動阻止装置）は、運転者の血中アルコール濃度（BAC）がいくつを超えるとエンジンの始動を阻止しますか？
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: イグニッション・インターロック装置は、運転者のBACが0.05%を超えると車両の始動を阻止します。
- id: 168
  category: safe_driving_rules
  question: スクールバスの運転手が携帯電話を使用できるのはどのような時ですか？
  choices:
    A: ハンズフリーであればいつでも可能
    B: 緊急時、またはバスを幹線道路外の安全な場所に停車させている時
    C: 生徒がバスに乗っていない時
    D: いかなる場合も不可
  answer: B
  explanation: スクールバスの運転手は、緊急時、またはバスを幹線道路外の安全な場所に停車させている場合を除き、携帯電話を使用してはいけません。(N.J.S.A.
    39:3B-25)
- id: 169
  category: sharing_the_road
  question: 17歳未満の歩行者が歩行者関連の法律に違反した場合、どのような罰則が科されますか？
  choices:
    A: $10の罰金
    B: $22の罰金
    C: $54の罰金
    D: 警告のみ
  answer: B
  explanation: 歩行者関連の法律に違反した17歳未満の歩行者には、22ドルの罰金が科されます。成人の場合は54ドルの罰金となります。
- id: 170
  category: driver_responsibility
  question: アイドリング違反の罰金の範囲はいくらですか？
  choices:
    A: $50から$250
    B: $100から$500
    C: $250から$1,000
    D: $500から$2,000
  answer: C
  explanation: 車両および物件の所有者は、アイドリング違反1回につき250ドルから1,000ドルの罰金が科されます。(N.J.S.A. 39:3-70.2)
- id: 171
  category: penalties_and_points
  question: 車内に開封済みまたは封の開いたアルコール飲料の容器を持ち込むと、以下の罰金が科せられます。
  choices:
    A: 初回違反で100ドル
    B: 初回違反で200ドル
    C: 初回違反で300ドル
    D: 初回違反で500ドル
  answer: B
  explanation: 初回違反は200ドル、それ以降の違反は250ドルまたは10日間の社会奉仕活動が科せられます。(N.J.S.A. 39:4-51a)
- id: 172
  category: license_system
  question: モペッド（原動機付自転車）免許を取得できる最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 17歳
  answer: B
  explanation: モペッド免許を取得できる最低年齢は15歳です。
- id: 173
  category: defensive_driving
  question: 濡れた路面を時速30マイル（30 mph）で走行する場合、安全な最小車間距離はどれくらいですか？
  choices:
    A: 車3台分
    B: 車4台分
    C: 車6台分
    D: 車9台分
  answer: C
  explanation: 濡れた路面を時速30マイルで走行する場合、安全な最小車間距離は車6台分です。
- id: 174
  category: defensive_driving
  question: 凍結した路面を時速20マイル（20 mph）で走行する場合、安全な最小車間距離はどれくらいですか？
  choices:
    A: 車4台分
    B: 車6台分
    C: 車10台分
    D: 車12台分
  answer: D
  explanation: 凍結した路面を時速20マイルで走行する場合、安全な最小車間距離は車12台分です。
- id: 175
  category: safe_driving_rules
  question: 加速車線から高速道路に進入する際、運転者はどうすべきですか？
  choices:
    A: 停止して、入れる隙間ができるのを待つ
    B: 交通の流れに合わせて加速し、他の車両に道を譲りながら右側車線に入る
    C: 任意の速度で進入する
    D: より早く合流するために左側車線に入る
  answer: B
  explanation: 加速車線を出る際に交通の流れに合わせて加速し、すでに高速道路を走行している車両に道を譲り、安全を確認した上で右側の車線に進入してください。
- id: 176
  category: driver_responsibility
  question: スリップしている際、従来のブレーキ（ABS非搭載）での正しいブレーキ操作は何ですか？
  choices:
    A: ブレーキを強く踏み込む
    B: ペダルを離し、車両が制御できるまで少し弱い力で踏み直す
    C: ブレーキを素早くポンピングする
    D: パーキングブレーキを使用する
  answer: B
  explanation: ブレーキがロックした場合は、ペダルを離し、少し弱い力で踏み直してください。車両が制御できるようになるまで、圧力を弱めながらこれを繰り返します。
- id: 177
  category: alcohol_drugs_health
  question: 2回目の違反から10年以内に発生した3回目のDUI（飲酒・薬物影響下運転）の罰則は何ですか？（2019年12月1日以降の違反の場合）
  choices:
    A: 2年間の免許停止
    B: 5年間の免許停止
    C: 8年間の免許停止
    D: 永久的な免許取り消し
  answer: C
  explanation: 2019年12月1日以降の3回目のDUI違反：8年間の免許停止、1,000ドルの罰金、3年間にわたり毎年1,500ドルの付加金が科せられます。
- id: 178
  category: safe_driving_rules
  question: ニュージャージー州における「セーフ・コリドー（Safe Corridors）」とは何ですか？
  choices:
    A: 制限速度が引き下げられた高速道路
    B: 高い事故率の統計に基づき、罰金が2倍になる高速道路
    C: スクールゾーン（学校周辺）の区域
    D: 工事区間
  answer: B
  explanation: セーフ・コリドーは、さまざまな州道において罰金が2倍になる区域です。これらは、事故率が州平均を50%上回り、3年間で1,000件以上の事故が発生した場所に基づいて指定されます。
- id: 179
  category: penalties_and_points
  question: 横断歩道で歩行者に道を譲らなかった場合、何ポイントの違反点数が科せられますか？
  choices:
    A: 1ポイント
    B: 2ポイント
    C: 3ポイント
    D: 4ポイント
  answer: B
  explanation: 横断歩道での歩行者優先不履行：2ポイント。(N.J.S.A. 39:4-35)
- id: 180
  category: penalties_and_points
  question: 不適切なUターン（転回）をした場合、何ポイントの違反点数が科せられますか？
  choices:
    A: 2ポイント
    B: 3ポイント
    C: 4ポイント
    D: 5ポイント
  answer: B
  explanation: 不適切なUターン：3ポイント。(N.J.S.A. 39:4-125)
- id: 181
  category: penalties_and_points
  question: 対向車とすれ違う際に右側を通行しなかった場合、何ポイントが科せられますか？
  choices:
    A: 2ポイント
    B: 3ポイント
    C: 4ポイント
    D: 5ポイント
  answer: D
  explanation: 対向車とすれ違う際に右側を通行しなかった場合：5ポイント。（N.J.S.A. 39:4-84）
- id: 182
  category: safe_driving_rules
  question: 運転者はカーブにどのように接近すべきですか？
  choices:
    A: カーブの間、速度を維持する
    B: カーブに入る前に減速し、他の車線にはみ出さないようにする
    C: カーブの間、加速する
    D: カーブの途中で急ブレーキをかける
  answer: B
  explanation: カーブに入る前に減速し、他の車線にはみ出さないように注意してください。
- id: 183
  category: sharing_the_road
  question: 乗馬している人が手を挙げて合図を送った場合、運転者はどうしなければなりませんか？
  choices:
    A: 時速25マイル（25 mph）まで減速して通過する
    B: 停車し、馬が通り過ぎるまで静止したままでいる
    C: 馬に警告するためにクラクションを鳴らす
    D: 車線を変更して通過する
  answer: B
  explanation: 乗馬している人の合図があった場合、運転者は停車し、馬が通り過ぎるまで静止していなければなりません。（N.J.S.A. 39:4-72）
- id: 184
  category: defensive_driving
  question: 車両火災の最も一般的な原因は何ですか？
  choices:
    A: エンジンのオーバーヒート
    B: 燃料漏れ
    C: 電気系統の短絡（ショート）
    D: タバコの喫煙
  answer: C
  explanation: ほとんどの車両火災は、電気系統の短絡（ショート）によって引き起こされます。
- id: 185
  category: driver_responsibility
  question: ニュージャージー州の法律で、車両が前進している間に点灯させてはならないライトはどれですか？
  choices:
    A: フォグランプ
    B: パーキングライト（駐停車灯）
    C: バックアップライト（後退灯）
    D: ダッシュボードのライト
  answer: C
  explanation: 車両が前進している間にバックアップライト（後退灯）を点灯させることは、ニュージャージー州の法律で禁止されています。（N.J.S.A.
    39:3-52）
- id: 186
  category: safe_driving_rules
  question: 「ニキル法（Nikhil's Law）」の安全誓約において、運転者が誓うべきことは何ですか？
  choices:
    A: 決してスピードを出さないこと
    B: 一時停止標識で完全に停止し、注意を怠らず、ハンズフリー電話を使用し、余裕を持って計画すること
    C: 常にシートベルトを着用すること
    D: 決して飲酒運転をしないこと
  answer: B
  explanation: ニキル法の誓約には、「完全に停止する（Stop Completely）」、「注意を怠らない（Stay Alert）」、「安全に話す（Talk
    Safe - ハンズフリー）」、「余裕を持って計画する（Plan Ahead）」が含まれます。
- id: 187
  category: vehicle_information
  question: ニュージャージー州におけるオートバイの年間登録料はいくらですか？
  choices:
    A: $24
    B: $35
    C: $50
    D: $65
  answer: D
  explanation: ニュージャージー州のオートバイの年間登録料は65ドルです。
- id: 188
  category: penalties_and_points
  question: 冷凍デザート販売車（アイスクリームトラック等）を不適切に追い越した場合、何ポイントが科せられますか？
  choices:
    A: 2ポイント
    B: 3ポイント
    C: 4ポイント
    D: 5ポイント
  answer: C
  explanation: 冷凍デザート販売車の不適切な追い越し：4ポイント。（N.J.S.A. 39:4-128.4）
- id: 189
  category: penalties_and_points
  question: 12〜14ポイント以上を累積した運転者は、何を受け取りますか？
  choices:
    A: 警告書
    B: 停止予定通知書（Notice of Scheduled Suspension）
    C: 自動的な免許停止
    D: 強制的な出廷命令
  answer: B
  explanation: 24ヶ月以内に12〜14ポイント以上を累積した運転者は、「停止予定通知書（Notice of Scheduled Suspension）」を受け取ります。
- id: 190
  category: safe_driving_rules
  question: 選挙前の有権者登録の締め切りはいつですか？
  choices:
    A: 7日前
    B: 14日前
    C: 21日前
    D: 30日前
  answer: C
  explanation: 有権者登録の締め切りは、選挙の21日前です。
- id: 191
  category: penalties_and_points
  question: DUI（飲酒・薬物運転）関連の違反で免許停止中に運転した場合の罰則は何ですか？
  choices:
    A: 200ドルの罰金
    B: 500ドルの罰金、1〜2年の免許停止期間延長、および10〜90日の禁錮の可能性
    C: 100ドルの罰金と30日間の免許停止
    D: 警告のみ
  answer: B
  explanation: DUIまたは検査拒否による免許停止中の運転：500ドルの罰金、1〜2年の免許停止期間延長、および10〜90日の禁錮が科される可能性があります。
- id: 192
  category: alcohol_drugs_health
  question: 21歳未満の運転者が0.01%以上の血中アルコール濃度（BAC）で運転した場合、どのような罰則を受けますか？
  choices:
    A: 警告
    B: 30〜90日の免許停止、15〜30日の社会奉仕活動、およびIDRC（飲酒運転者評価センター）への参加
    C: 100ドルの罰金のみ
    D: 成人と同じ罰則
  answer: B
  explanation: 21歳未満の初犯でBACが0.01%〜0.08%の場合：30〜90日の免許停止、15〜30日の社会奉仕活動、およびIDRCまたはアルコール教育プログラムへの参加が義務付けられています。
- id: 193
  category: safe_driving_rules
  question: ニュージャージー州では、いつ方向指示器（ウィンカー）を使用する必要がありますか？
  choices:
    A: 車線を変更するとき。
    B: 駐車スペースに車を入れる、または出すとき。
    C: 駐車エリアや路地から交通の流れに入るとき。
    D: 上記のすべて。
  answer: D
  explanation: 左右に移動する場合は、常に方向指示器を使用する必要があります。路肩の駐車スペースから交通の流れに入るとき、新しい車線に移動するとき、または他の車両を追い越すときには、必ず合図を出さなければなりません。
- id: 194
  category: safe_driving_rules
  question: 主要な高速道路を走行する際：
  choices:
    A: 常に注意を怠らないこと。
    B: 視線を動かし続けること。
    C: 道路上の危険に反応できる準備をしておくこと。
    D: 上記のすべて。
  answer: D
  explanation: 高速道路では常に注意を払い、予期せぬ危険に反応できる準備をしておくことが重要です。「ハイウェイ・ヒプノーシス（高速道路催眠現象）」を避けるため、一つのものを数秒以上見続けないようにしてください。
- id: 195
  category: sharing_the_road
  question: 坂道を上っている際、前方の大型トラックに後方から接近しています。以下のうち、知っておくべきことはどれですか？
  choices:
    A: トラックは掲示されている制限速度よりも遅い速度で走行している可能性がある。
    B: 安全にトラックを追い越すことができない可能性がある。
    C: 法的にトラックを追い越すことができない可能性がある。
    D: 上記のすべて。
  answer: D
  explanation: 大型車両は、特に上り坂では制限速度よりも遅い速度で走行することが多いため、後方から接近する際は注意が必要です。視界が限られている坂道で他車を追い越すことは法律で禁止されています。
- id: 196
  category: defensive_driving
  question: 周囲の運転者が怒りを感じて行動したり反応したりしているのを見かけた場合：
  choices:
    A: 目を合わせないようにする。
    B: 手まね（ジェスチャー）で反応しない。
    C: その状況から距離を置く。
    D: これらすべて。
  answer: D
  explanation: 他の運転者が怒りをあらわにしている場合は、物理的・精神的にその状況から距離を置くようにしてください。目を合わせたり、相手を刺激するような体の動きやジェスチャーをしたりするのは避けましょう。速度を落とす、車線を譲るなど、安全に危険を回避するための行動をとってください。
- id: 197
  category: safe_driving_rules
  question: 白い杖を持っている、または盲導犬を連れて歩いている人は、どのような人である可能性が高いですか？
  choices:
    A: 耳が不自由な人。
    B: 交通調査に関わっている人。
    C: 目が不自由な人。
    D: 上記のどれでもない。
  answer: C
  explanation: 歩行者が白い杖を使用している、または盲導犬を連れている視覚障害者である場合、運転者は常にその歩行者に道を譲らなければなりません。
- id: 198
  category: safe_driving_rules
  question: フリーウェイ（高速道路）で、曲がる場所や出口を通り過ぎてしまったことに気づきました。どうすべきですか？
  choices:
    A: 走行車線から素早く曲がる。
    B: 停車してバックする。
    C: 次の曲がり角、出口、または安全に転回できる場所まで走行を続ける。
    D: 他の車に止まるよう合図を送り、曲がれるようにする。
  answer: C
  explanation: 曲がる場所や出口を通り過ぎてしまった場合は、バックせず、安全に転回できる次の出口まで進んでください。路肩や高速道路でバックすることは違法です。
- id: 199
  category: safe_driving_rules
  question: 右左折や車線変更をする際は、以下のことを行わなければなりません：
  choices:
    A: 周囲に車両が見当たらない場合でも、常に合図を出す。
    B: 車両が見える場合のみ合図を出す。
    C: 夜間に運転している場合のみ合図を出す。
    D: 夜間の交通量が多いときのみ合図を出す。
  answer: A
  explanation: 車線変更、右左折、または縁石から発進するときは、常に合図を出してください。怠慢にならず、この法律を守る習慣を身につけることが大切です。
- id: 200
  category: alcohol_drugs_health
  question: アルコールと一緒に薬物を摂取すると：
  choices:
    A: 衝突事故を起こすリスクが高まる。
    B: アルコールのみを摂取する場合と危険性は変わらない。
    C: 運転能力に対するアルコールの影響を軽減する。
    D: 一般的な運転能力には影響しない。
  answer: A
  explanation: 薬物（違法薬物、処方薬、市販薬を含む）は脳の機能に影響を与え、安全な運転能力を損なう可能性があります。アルコールと他の薬物を併用すると、衝突事故のリスクがさらに高まります。
- id: 201
  category: signs_and_signals
  question: 濡れた路面を走行する際、覚えておくべき重要なことは何ですか？
  choices:
    A: 雨が降り始めた直後は、路面が特に滑りやすくなること。
    B: 濡れた道路ではハイドロプレーニング現象が起こる可能性があること。
    C: 停車する際に、十分な車間距離（停止距離）を確保すること。
    D: 上記のすべて。
  answer: D
  explanation: 濡れた路面は非常に滑りやすく危険です。特に降り始めは注意が必要です。濡れた道路を走行中、車両はオイル、泥、水が混ざった薄い層の上を走っている状態になります。大雨、冠水、またはシャーベット状の雪がある場合は、スリップのリスクを減らすために減速してください。
- id: 202
  category: signs_and_signals
  question: 右向きの曲がった矢印が描かれた、黄色いひし形の標識は何を示していますか？
  choices:
    A: 一方通行。
    B: 右折禁止。
    C: 出口。
    D: この先の道に急な右カーブがあること。
  answer: D
  explanation: 曲がった矢印が描かれた黄色いひし形の警戒標識は、前方に急なカーブがあることをドライバーに警告しています。
- id: 203
  category: safe_driving_rules
  question: 交差点の青信号（点灯）は、何を意味しますか？
  choices:
    A: 減速して停止の準備をしなければならない。
    B: 停止して対向車を確認してから進まなければならない。
    C: 安全が確認できれば、交差点を通過してよい。
    D: 右折してはならない。
  answer: C
  explanation: 青信号は、安全が確認できれば交差点を通過できることを意味します。標識で禁止されていない限り、青信号で右左折することも可能です。曲がる際は、交差点内の他の車両や歩行者に道を譲らなければなりません。
- id: 204
  category: vehicle_information
  question: シートベルトはどのように調整すべきですか？
  choices:
    A: 緩めに締める。
    B: 腰骨と下腹部にぴったりとフィットするように締める。
    C: 座席の下に隠す。
    D: シートベルトの警告音や警告灯が作動しないようにする。
  answer: B
  explanation: 腰ベルトは腰骨と下腹部にぴったりとフィットさせる必要があります。肩ベルトは、ベルトと胸の間に拳が入る程度の余裕を持って、快適に装着してください。
- id: 205
  category: safe_driving_rules
  question: 夜間に道路脇に停車する場合：
  choices:
    A: すべてのライトを消す。
    B: 駐車灯（パーキングライト）のみを使用する。
    C: ヘッドライトのみを使用する。
    D: 非常点滅表示灯（ハザードランプ）を点け、ロービームを点灯させたままにする。
  answer: D
  explanation: 夜間に道路脇に停車する場合は、非常点滅表示灯（ハザードランプ）を点け、ロービームを点灯させたままにしてください。他の道路利用者があなたの車をはっきりと確認できるようにすることが重要です。
- id: 206
  category: safe_driving_rules
  question: 片側一車線の対面通行の道路で、安全に追い越しができるのはどのような場合ですか？
  choices:
    A: 前方の道路がはっきりと確認できる場合。
    B: 対向車が来る前に自分の車線に戻れる場合。
    C: 追い越しに必要な速度を出す能力が車両にある場合。
    D: 上記のすべて。
  answer: D
  explanation: 片側一車線の対面通行の道路では、前方の道路がはっきりと見え、対向車が来る前に元の車線に戻ることができ、かつ追い越しに必要な速度を出せる場合でなければ、安全に追い越すことはできません。違法な場所や安全でない場所での追い越しは避けてください。
- id: 207
  category: signs_and_signals
  question: 路面の2本の黄色い実線は何を意味しますか？
  choices:
    A: 両方向からの追い越しが許可されている。
    B: 追い越し禁止。
    C: 丘の頂上にいる場合は追い越しが許可されている。
    D: 日中のみ追い越しが許可されている。
  answer: B
  explanation: 黄色の線は、反対側の交通が逆方向に進んでいることを示します。どちらの方向からも、2本の黄色い実線を越えて追い越しをしてはいけません。
- id: 208
  category: safe_driving_rules
  question: 他の車両の右側から合法的に追い越すことができるのはどのような場合ですか？
  choices:
    A: 前方の車両が左折待ちをしており、追い越し車線が利用可能な場合。
    B: 路面から外れて走行することになってもよい。
    C: 狭い橋の上。
    D: いかなる時でも。
  answer: A
  explanation: 追い越し車線がある場合、左折中または左折待ちの車両や自転車の右側を通過することができます。また、同じ方向に2車線以上ある多車線道路を走行している場合も、右側からの追い越しは合法です。追い越しの際、路肩や未舗装部分を走行してはいけません。
- id: 209
  category: sharing_the_road
  question: スクールゾーンで交通整理員が交通誘導を行っている場合、どうしなければなりませんか？
  choices:
    A: 交通整理員の指示に従う。
    B: 交通整理員の指示にかかわらず、周囲の車の動きに合わせる。
    C: 整理員には交通誘導の権限がないと判断する。
    D: 子供がいない場合に適用されるルールに従う。
  answer: A
  explanation: 標識、交通整理員、または警察官から指示があった場合は、減速し、注意を払う準備をしてください。スクールゾーンでは常に細心の注意を払って運転してください。
- id: 210
  category: safe_driving_rules
  question: 右左折、車線変更、または縁石から発進する前に合図（ウィンカー）を出すことは：
  choices:
    A: 他の車がいる場合のみ必要である。
    B: 良い運転習慣であり、法律で義務付けられている。
    C: 操作の直前ではなく、操作中のみ必要である。
    D: ゆっくり操作を行う場合は必要ない。
  answer: B
  explanation: 車線変更や右左折をする際は、十分余裕を持って合図を出してください。法律では、右または左に移動する少なくとも100フィート（約30メートル）手前から合図を出すことが義務付けられています。縁石から発進する前も、通過するドライバーに自分の意図を知らせるために必ず合図を出してください。
- id: 211
  category: signs_and_signals
  question: 運転している場所の周辺で、赤色灯を点滅させた緊急車両が走行している場合、どうすべきですか？
  choices:
    A: 緊急車両を避けるためにスピードを上げる。
    B: 直ちに車両を停止させ、通過を妨げる。
    C: 緊急車両がスムーズに通行できるよう、進路を譲るためにあらゆる努力を払う。
    D: 緊急車両に対し、追い越しても安全なタイミングで合図を送る。
  answer: C
  explanation: 赤色灯を点滅させた緊急車両が付近を走行している場合は、その車両がスムーズに通行できるよう、進路を譲るためにあらゆる努力を払わなければなりません。安全であれば、車両を路肩に寄せて緊急車両に道を譲ってください。
- id: 212
  category: safe_driving_rules
  question: 高速道路を降りようとしたが、目的の出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 次の出口まで進む。
    B: 中央分離帯を越えてUターンする。
    C: 路肩に停車し、出口までバックする。
    D: 警察官に合図を送り、出口まで先導してもらう。
  answer: A
  explanation: 出口を通り過ぎてしまった場合は、次の出口まで進んでください。高速道路上で停車したりバックしたり、出口に間に合わせようと直前に複数の車線を横切ったり、中央分離帯を越えて方向転換したりしてはいけません。これらの行為はすべて違法であり、非常に危険です。
- id: 213
  category: safe_driving_rules
  question: 次の記述のうち、正しいものはどれですか？
  choices:
    A: 追い越しのための車線変更を行う少なくとも100フィート手前で合図を出し、対向車がいないことを確認する。
    B: 左側から追い越す際は、ミラーを使用し、左肩越しに目視して死角を確認する。
    C: 追い越し後、元の車線に戻る際は、バックミラーに追い越した車の両方のヘッドライトが見えるまで待つ。
    D: 上記のすべて。
  answer: D
  explanation: 追い越しを行う際は、車線変更の少なくとも100フィート手前で常に合図を出さなければなりません。常にミラーで後方を確認し、肩越しに目視して死角を確認してください。元の車線に戻る前に、バックミラーに追い越した車の両方のヘッドライトが見えるまで待ってください。
- id: 214
  category: safe_driving_rules
  question: ニュージャージー州の4方向一時停止（4-way stop）交差点では、誰に優先権がありますか？
  choices:
    A: 最初に到着したドライバーに優先権がある。
    B: 最後に到着したドライバーに優先権がある。
    C: 一人のドライバーが停止せずに走行を続けるべきである。
    D: 一人のドライバーが他のドライバーに先に行くよう手で合図すべきである。
  answer: A
  explanation: 4方向一時停止では、全4方向からの交通が停止しなければなりません。交差点に最初に到達した車両が最初に進むべきです。2台の車両が同時に交差点に到達した場合は、左側のドライバーが右側のドライバーに道を譲ります。
- id: 215
  category: safe_driving_rules
  question: 公道上の車両内でアルコール飲料を飲むことができるのはどのような場合ですか？
  choices:
    A: 運転していない限り可能。
    B: 後部座席に乗っている場合。
    C: ピックアップトラックの荷台に乗っている場合。
    D: いかなる状況でも認められない。
  answer: D
  explanation: 公道や歩道においてアルコール飲料を摂取したり所持したりすることは法律で禁じられています。さらに、公道において、運転者や同乗者が通常占める車内の場所に、蓋の開いたアルコール飲料の容器を保管することも禁止されています。
- id: 216
  category: safe_driving_rules
  question: 青信号で右折する場合、どうしなければなりませんか？
  choices:
    A: 通常の走行速度を維持する。
    B: 停止して、近くにパトカーがいないか確認する。
    C: 歩行者に道を譲る。
    D: 通常の走行速度を上げる。
  answer: C
  explanation: 標識で禁止されていない限り、青信号で右折または左折することができます。曲がる際は、交差点内の他の車両や歩行者に道を譲らなければなりません。
- id: 217
  category: vehicle_information
  question: ハイドロプレーニング現象の主な原因は何ですか？
  choices:
    A: 過度な停車。
    B: 急停車。
    C: 急旋回。
    D: スピードの出し過ぎ。
  answer: D
  explanation: 速度が上がると、タイヤが路面の水を排出する効果が低下します。スピードを出しすぎると、タイヤが完全にグリップを失い、車両が水の膜の上を滑る状態になります。これは「ハイドロプレーニング現象」と呼ばれます。
- id: 218
  category: signs_and_signals
  question: 道路標識と路面標示について：
  choices:
    A: 常に従わなければならない。
    B: 単なる提案に過ぎない。
    C: 他に交通がある場合のみ従えばよい。
    D: 警察官がいる場合のみ従えばよい。
  answer: A
  explanation: 交通の流れは、路面標示、交通島、信号、標識によって制御されています。これらの装置は、道路状況をドライバーに知らせ、目的地まで安全に誘導する役割を果たします。道路標識、信号、路面標示には常に従わなければなりません。
- id: 219
  category: signs_and_signals
  question: クロスバック（X型）標識は何を示していますか？
  choices:
    A: 踏切。
    B: スクールゾーン。
    C: 追い越し禁止区域。
    D: 病院。
  answer: A
  explanation: クロスバック標識は、踏切で列車に道を譲るようドライバーに促すものです。ドライバーは列車を追い越そうとしてはいけません。
- id: 220
  category: defensive_driving
  question: 滑りやすい道路を走行する際は、どうすべきですか？
  choices:
    A: 迂回路を利用する。
    B: 乾燥した道路と同じように運転する。
    C: 車間距離を長く取る。
    D: 橋や交差点を渡るのを避ける。
  answer: C
  explanation: 滑りやすい道路では、車間距離を長く取る必要があります。通常の状態よりも車両が停止するまでに時間がかかる可能性があるためです。
- id: 221
  category: safe_driving_rules
  question: 運転者が右左折しており、歩行者が信号機のない場所を横断している場合、どちらが道を譲らなければなりませんか？
  choices:
    A: 最後に動き出した方
    B: 運転者
    C: 速度が遅い方
    D: 歩行者
  answer: B
  explanation: 運転者は、横断歩道の有無にかかわらず、信号機のない交差点を歩行者が横断している場合は、歩行者に道を譲らなければなりません。
- id: 222
  category: alcohol_drugs_health
  question: どのような種類の薬が運転能力に影響を与える可能性がありますか？
  choices:
    A: アレルギー薬
    B: マリファナ
    C: 風邪薬
    D: これらすべて
  answer: D
  explanation: 多くの種類の薬が運転能力を損なう可能性があります。これには違法薬物だけでなく、合法的な処方薬や市販薬も含まれます。いかなる薬物であれ、影響を受けた状態で運転することは刑事罰の対象となる可能性があります。
- id: 223
  category: vehicle_information
  question: 死角（ブラインドスポット）とは、道路のどの範囲のことですか？
  choices:
    A: 頭を動かさないと見ることができない範囲
    B: 車両の真後ろの範囲
    C: バックミラーで見える範囲
    D: サイドミラーで見える範囲
  answer: A
  explanation: 死角とは、運転者が頭を動かさずに確認することができない範囲のことです。これらは車両の側面や後方に位置します。
- id: 224
  category: safe_driving_rules
  question: 他の交通によって塞がれている交差点に来ました。どうすべきですか？
  choices:
    A: 前方の交通が動くまでゆっくり進む
    B: 前の車にできるだけ近づく
    C: 通り抜けられるようになるまで交差点内に入らない
    D: 前の車を動かすためにクラクションを鳴らす
  answer: C
  explanation: 交差点の先が渋滞しており、交差点を完全に通り抜けることができない場合は、交差点に進入してはいけません。交差点を塞がないよう、前方の交通が解消されるまで待機してください。
- id: 225
  category: signs_and_signals
  question: 信号機のシンボルが描かれた黄色のひし形の標識は何を示していますか？
  choices:
    A: 現在の速度で走行を続ける
    B: この先で停止しなければならない
    C: スピード違反は禁止されている
    D: この先に信号機がある
  answer: D
  explanation: 信号機のシンボルが描かれた黄色の警戒標識は、この先に信号機があることを運転者に警告しています。停止する準備をしてください。
- id: 226
  category: defensive_driving
  question: 視界が悪くなった際、最初に行うべき対応は何ですか？
  choices:
    A: ヘッドライトを点灯する
    B: 速度を落とす
    C: ワイパーを作動させる
    D: 道路端の標示を探してガイドにする
  answer: B
  explanation: 視界の低下や危険な路面状況に対して、最初に行うべき対応は速度を落とすことです。
- id: 227
  category: safe_driving_rules
  question: 車線を横切って引かれた2本の白い実線は、横断歩道の境界を示しています。運転者として知っておくべきことは何ですか？
  choices:
    A: 横断歩道では、自動車が歩行者より優先される
    B: 歩行者が横断歩道にいるときは、歩行者に優先権（通行権）を与えなければならない
    C: 横断歩道では誰にも優先権はない
    D: 歩行者はすべての交通の邪魔にならないようにする責任がある
  answer: B
  explanation: 横断歩道の線は、歩行者が安全に道路を横断できる場所を示しています。横断歩道は、水平線、垂直線、またはその組み合わせでマークされることがあります。横断歩道内に歩行者がいる場合は、必ず停止しなければなりません。
- id: 228
  category: safe_driving_rules
  question: 他の運転者に道を譲らなければならないのはどのような時ですか？
  choices:
    A: ガレージや路地から通りに入る時
    B: 標識のない交差点に同時に到着し、相手が左側の道路にいる時
    C: 信号が青の矢印の時
    D: 上記のすべて
  answer: A
  explanation: 路地、ドライブウェイ、またはガレージから通りに入る時は、他の運転者に道を譲らなければなりません。また、交差する歩道を歩いている歩行者にも道を譲る必要があります。
- id: 229
  category: safe_driving_rules
  question: 緊急車両に道を譲らなければならないのはどのような時ですか？
  choices:
    A: いかなる状況でも譲る必要はない
    B: 赤または青の点滅灯が見えるか、サイレンが聞こえる時
    C: 他の車両が譲っている時のみ
    D: 上記のどれでもない
  answer: B
  explanation: サイレンを鳴らしている、またはライトを点滅させている緊急車両には、必ず優先権（通行権）を譲らなければなりません。
- id: 230
  category: safe_driving_rules
  question: ドライブウェイ（私道）や私有道路から公道の交通に入る運転者は：
  choices:
    A: 優先権（通行権）がある
    B: すでに公道にいる運転者に道を譲るべきである
    C: 無理やり交通に割り込んでもよい
    D: 他の運転者が車線変更して場所を空けてくれると思い込んでよい
  answer: B
  explanation: ドライブウェイや私道から交通に入る場合は、すでに公道にいる運転者に道を譲らなければなりません。安全に合流できるタイミングで合流してください。
- id: 231
  category: safe_driving_rules
  question: 次の信号のうち、左折時に優先権（Right-of-way）があるのはどれですか？
  choices:
    A: 緑色の点灯信号
    B: 黄色の点滅信号
    C: 左向きの緑色の矢印信号
    D: 赤色の点滅信号
  answer: C
  explanation: 緑色の矢印信号は、矢印が指している方向に交差点を通過できることを意味します。このとき、対向車は左折車両のために停止しなければなりません。
- id: 232
  category: safe_driving_rules
  question: 車両が停止するまでに必要な距離（停止距離）を決定する要因ではないものはどれですか？
  choices:
    A: ステアリング（操舵）能力
    B: 制動距離
    C: 反応距離
    D: 知覚時間
  answer: A
  explanation: 車両を停止させるために必要な距離は、知覚時間、反応距離、および制動距離によって決まります。これらは速度や路面状況によって変化します。
- id: 233
  category: safe_driving_rules
  question: 速度制限標識（推奨速度標識）は何を示していますか？
  choices:
    A: 雨、雪、または凍結した条件下では無視してもよい。
    B: 三角形の形をしている。
    C: 青地に黒の文字で書かれている。
    D: カーブや曲がり角での推奨速度を示している。
  answer: D
  explanation: カーブや曲がり角の警戒標識には、ドライバーに推奨される走行速度を示す推奨速度標識が併設されていることがよくあります。晴天時にはそれ以上の速度で走行しても快適に感じるかもしれませんが、雨、雪、または凍結した条件下では決して推奨速度を超えてはいけません。
- id: 234
  category: safe_driving_rules
  question: 交通を横断するために必要なスペース（車間距離）の大きさは何に依存しますか？
  choices:
    A: 道路状況、天候、および対向車
    B: 一時停止標識の有無
    C: 方向指示器（ウィンカー）の使用
    D: 後続車
  answer: A
  explanation: 交通を横断するために必要なスペースの大きさは、道路状況、天候、および対向車の状況によって決まります。
- id: 235
  category: safe_driving_rules
  question: ニュージャージー州法において、他車を追い越すことが禁止されている状況はどれですか？
  choices:
    A: 丘やカーブの上
    B: スクールバスのライトが点滅しているとき
    C: 交差点に近づいているとき
    D: 上記のすべて
  answer: D
  explanation: 追い越し車線に対向車がいる場合、カーブや丘で視界が遮られている場合、交差点、踏切や橋の手前またはその上、その他追い越し禁止ゾーンでは、決して追い越しをしてはいけません。中央分離帯や共有のセンターターンレーンがある多車線道路の反対側にいない限り、赤いライトを点滅させて停車しているスクールバスを追い越すことはできません。
- id: 236
  category: safe_driving_rules
  question: 工事現場で交通整理員（フラッガー）が交通誘導を行っている場合、どうしなければなりませんか？
  choices:
    A: 交通整理員の指示に従う。
    B: 交通整理員の指示にかかわらず、周囲の車の動きを真似る。
    C: 交通整理員が交通誘導を行うべきではないと判断する。
    D: そのエリアが工事中でなかった場合に適用される法律に従う。
  answer: A
  explanation: 標識、交通整理員、または警察官から指示された場合は、速度を落とし、注意を払う準備をしてください。指示に従わないことは違法であり、工事現場で働く人々にとって危険です。
- id: 237
  category: sharing_the_road
  question: 緊急車両が近づいてくるのを見たり聞いたりしたとき、どうすべきですか？
  choices:
    A: 直ちに停止し、車両を通過させる。
    B: 安全な範囲でできるだけ道路の右側に寄り、停車する。
    C: ゆっくりと進み、車両を通過させる。
    D: 道路の右側に寄りながら、ゆっくりと動き続ける。
  answer: B
  explanation: 2車線道路または中央分離帯のない道路を走行している場合、接近してくる方向に関係なく、ライトやサイレンを使用している緊急車両に道を譲らなければなりません。直ちにできるだけ道路の右側に寄せて停車してください。その際、交差点内で停車しないよう注意してください。
- id: 238
  category: safe_driving_rules
  question: 交差点に差し掛かり、信号は緑ですが、歩行者が赤信号を無視して横断しています。どうすべきですか？
  choices:
    A: クラクションを鳴らす。
    B: 加速して歩行者の前を通過する。
    C: 歩行者が安全に渡れるように停車する。
    D: 歩行者の近くまで運転して威嚇し、二度と赤信号で渡らないように思わせる。
  answer: C
  explanation: 自分の信号が緑であっても、交差点内に残っている歩行者や車両には道を譲ってください。どのような状況においても、歩行者の周囲では注意を払ってください。
- id: 239
  category: safe_driving_rules
  question: ニュージャージー州でフリーウェイ（高速道路）に進入する際の正しい手順は何ですか？
  choices:
    A: 合図を出し、走行中の車両に道を譲り、周囲の交通と同じ速度で進入する。
    B: 合図を出して進入する。フリーウェイを走行中の車両が道を譲らなければならない。
    C: 交通状況を確認できるよう、ゆっくりと走行する。
    D: 常に最初に完全停止する。
  answer: A
  explanation: 交通の流れに合流するときは、合図を出し、周囲の交通と同じ速度で進入する必要があります。道路に進入する際は、常に他の車両に道を譲ってください。
- id: 240
  category: defensive_driving
  question: 夜間の運転に細心の注意が必要な理由は何ですか？
  choices:
    A: 夜間は交通の流れが速くなるため。
    B: 夜間は交通量が多いため。
    C: ドライバーの視界が昼間ほど良くないため。
    D: 夜間は事故がより頻繁に発生するため。
  answer: C
  explanation: 暗いため、ドライバーは昼間ほど視界が良くありません。日没の30分後から日の出の30分前まで、または500フィート（約150メートル）先の人や車両が見えないときは、ヘッドライトを使用しなければなりません。
- id: 241
  category: penalties_and_points
  question: 段階的運転免許制度（GDL）に定められた制限事項に従わなかった場合：
  choices:
    A: 大きな問題ではない。
    B: 運転免許の減点（ポイント）のみが課される。
    C: 否定的な結果は生じない。
    D: 罰金および免許停止処分を受ける可能性がある。
  answer: D
  explanation: 段階的運転免許制度（GDL）を保持している初めての運転者は、厳格な運転制限に従わなければなりません。これらの制限に従わなかった場合、100ドルの罰金およびGDLの停止処分を受ける可能性があります。
- id: 242
  category: safe_driving_rules
  question: 2台の車両が異なる道路から同時に交差点に進入した場合、どちらの車両が優先権を譲らなければなりませんか？
  choices:
    A: どちらの車両でもよい
    B: 左側の車両
    C: 右側の車両
    D: どちらも譲る必要はない
  answer: B
  explanation: 標識や信号で制御されている交差点、および制御されていない交差点のいずれにおいても、2台の車両が同時に交差点に到着した場合は、左側の運転者が右側の運転者に優先権を譲らなければなりません。
- id: 243
  category: safe_driving_rules
  question: 交通信号には、特定の車線からの右左折を制御するために矢印が表示されることがあります。青色の矢印信号は：
  choices:
    A: 一方通行の道路でのみ使用される。
    B: 円形の青信号と同じ意味を持つが、車両は矢印で示された方向に進まなければならない。
    C: 進むことができるが、青色の矢印と同時に円形の青信号が点灯している場合に限る。
    D: 空港への道を示している。
  answer: B
  explanation: 青色の矢印信号は円形の青信号と同じ意味を持ちますが、その車線の車両は矢印が示す方向に進まなければなりません。
- id: 244
  category: safe_driving_rules
  question: 対向方向に進む車線は、____ の線で区切られています。
  choices:
    A: 白
    B: 赤
    C: 黒
    D: 黄色
  answer: D
  explanation: 黄色の線は、対向方向に進む交通を区切るために使用されます。
- id: 245
  category: defensive_driving
  question: ハイドロプレーニング現象のリスクを低減するにはどうすればよいですか？
  choices:
    A: 路面が濡れているときはスピードを出さない。
    B: 適切な空気圧のタイヤを使用する。
    C: 溝がすり減ったタイヤを交換する。
    D: 上記のすべて。
  answer: D
  explanation: ハイドロプレーニング現象は、タイヤと路面の間の薄い水膜の上に車両が滑ることで起こります。タイヤの空気圧不足や溝の摩耗は、ハイドロプレーニングのリスクを高めます。また、スピードを出すこともリスクを増大させます。
- id: 246
  category: signs_and_signals
  question: 夜間にヘッドライトの眩しさ（グレア）の影響を軽減するためには、どこを見るべきですか？
  choices:
    A: 真っ直ぐ前方。
    B: 肩越しに後ろ。
    C: 道路の中央。
    D: 道路の右端。
  answer: D
  explanation: 対向車がヘッドライトをロービームに切り替えない場合は、前方の道路の右側を見るようにしてください。対向車のヘッドライトを直視しないでください。眩しさで数秒間視界が遮られる可能性があるためです。
- id: 247
  category: safe_driving_rules
  question: 交差点で以下のどれを見た場合、必ず停止しなければなりませんか？
  choices:
    A: 赤色の点滅信号。
    B: 黄色の点灯信号。
    C: 黄色の矢印信号。
    D: 黄色の点滅信号。
  answer: A
  explanation: 赤色の点滅信号は、一時停止標識と同じ意味を持ちます。赤色の点滅信号がある交差点では、完全に停止し、両方向を確認し、交差点の安全が確認された後にのみ進むことができます。
- id: 248
  category: alcohol_drugs_health
  question: アルコールが反射神経や判断力に及ぼす影響について：
  choices:
    A: ワインの代わりにビールを飲んだ場合は、影響が少ない。
    B: ビールの代わりにワインを飲んだ場合は、影響が少ない。
    C: ハードサイダーやミックスドリンクを飲んだ場合に最も顕著に現れる。
    D: 血中のアルコール量によって決まる。
  answer: D
  explanation: いかなる種類のアルコールを摂取しても、反射神経や判断力に悪影響を及ぼす可能性があります。摂取したアルコールの種類は関係なく、どれだけの量のアルコールが血中に入ったかが重要です。
- id: 249
  category: vehicle_information
  question: ニュージャージー州で車両を登録するには、____ 歳以上である必要があります。
  choices:
    A: '17'
    B: '25'
    C: '18'
    D: '21'
  answer: A
  explanation: ニュージャージー州で自動車を登録するには、少なくとも17歳である必要があります。また、身分証明書と車両所有権の証明が必要です。
- id: 250
  category: vehicle_information
  question: 走行中にタイヤがバースト（破裂）した場合、どうすべきですか？
  choices:
    A: 急ブレーキをかける。
    B: ハンドルをしっかりと握り、徐々に減速して停止する。
    C: そのまま通常通り運転を続ける。
    D: 非常点滅表示灯（ハザードランプ）を点けて運転を続ける。
  answer: B
  explanation: タイヤがバーストした場合は、すぐにブレーキをかけないでください。ハンドルをしっかりと握り、車線を維持するように操縦します。アクセルから足を離して徐々に速度を落とし、ブレーキは踏まないようにします。非常に低速になったら、軽くブレーキをかけて道路脇の安全な場所に停車してください。
- id: 251
  category: defensive_driving
  question: 次のような場合は、車間距離を長く取ってください：
  choices:
    A: 視界を遮る大型車両の後ろを走行しているとき。
    B: 高速道路（エクスプレスウェイ）から出るとき。
    C: オートバイの後ろを走行しているとき。
    D: 上記のすべて。
  answer: D
  explanation: 視界を遮る大型車両の後ろを走行しているとき、悪天候や交通渋滞のとき、高速道路から出るとき、オートバイや自転車の後ろを走行しているとき、および後続車に車間距離を詰められている（あおられている）ときは、車間距離を長く取る必要があります。
- id: 252
  category: safe_driving_rules
  question: 運転者が左腕と手を下向きに伸ばしています。この手信号は、運転者が何を計画していることを意味しますか？
  choices:
    A: 左折。
    B: 右折。
    C: 停止。
    D: 発進。
  answer: C
  explanation: 運転者が左腕と手を下向きに伸ばしている場合、それは停止する意思があることを示しています。この手信号を出している車両の後ろを走行している場合は、それに応じて運転を調整してください。
- id: 253
  category: signs_and_signals
  question: 次のような場合、1本の白い破線または黄色の破線を越えてはなりません：
  choices:
    A: 線を越えることが交通の妨げになる場合。
    B: 左折して私道に入るとき。
    C: 前方の車が故障しているとき。
    D: 一方通行の道路で右側から追い越すとき。
  answer: A
  explanation: 安全に、かつ交通の妨げにならずに行える限り、追い越しや車線変更のために1本の破線を越えることができます。
- id: 254
  category: safe_driving_rules
  question: 自身の身体的コンディションによって不安全な運転をしないようにするために、すべきことは何ですか？
  choices:
    A: 身体の健康を維持し、定期的に健康診断を受ける。
    B: 服用している薬が運転能力に与える影響を把握しておく。
    C: 自分の身体的な限界の範囲内で運転する。
    D: 上記のすべて。
  answer: D
  explanation: 身体的コンディションは、安全に運転する能力に重要な影響を及ぼします。運転者は自身の身体的な限界を認識し、安全である場合にのみ運転すべきです。
- id: 255
  category: signs_and_signals
  question: オレンジ色の標識はどのような標識ですか？
  choices:
    A: 道路工事区域の標識。
    B: 規制標識。
    C: 学校区域の標識。
    D: 案内標識。
  answer: A
  explanation: 道路工事区域は、道路沿いで行われている作業の種類に応じて設定されます。工事区域の標識は通常、ひし形でオレンジ色、黒の文字や記号が使われており、道路上または道路付近で人が作業していることを警告する役割を果たします。
- id: 256
  category: vehicle_information
  question: 車両に乗車している小さな子供について、正しいものはどれですか？
  choices:
    A: 力の強い大人が抱いていれば安全である。
    B: 車両の後部座席の床に立っていれば安全である。
    C: 体が小さいため、事故に遭っても怪我をすることはない。
    D: 車内で立たせたまま乗車させてはならない。
  answer: D
  explanation: 通常のシートベルトを着用するには小さすぎる子供のために、専用のチャイルドシートが用意されています。事故や急停止の際、どんなに力の強い人であっても、子供を安全に抱きかかえ続けることは不可能です。子供を車に乗せる際は、必ず適切に固定された状態で乗車させてください。
- id: 257
  category: vehicle_information
  question: 自車と周囲の間にスペースクッション（安全な空間）を保つことが重要なのはなぜですか？
  choices:
    A: 他の車両からの注意散漫を防ぐため。
    B: 予期せぬ事態に反応するための時間を作るため。
    C: 交通の流れを安全なペースに保つため。
    D: 他の運転者の注意を喚起するため。
  answer: B
  explanation: 他の運転者のミスに対して反応するための十分な時間を確保する唯一の方法は、自車と周囲の車両との間に十分なスペースを空けておくことです。
- id: 258
  category: safe_driving_rules
  question: 緊急車両を通過させるために、道路の端に寄らなければならないのはどのような場合ですか？
  choices:
    A: 進行方向に関係なく、常に。
    B: 緊急車両が自車の後ろを走っている場合のみ。
    C: 緊急車両が対向車線から近づいてくる場合のみ。
    D: 上記のどれでもない。
  answer: A
  explanation: 赤色灯を点灯させた緊急車両に対しては、後方から近づいてくるか対向車線から近づいてくるかにかかわらず、道路の右端（※米国等の右側通行の場合。日本の場合は左端）に寄って停止しなければなりません。
- id: 259
  category: alcohol_drugs_health
  question: 一酸化炭素中毒を避けるために、運転者がすべきことは何ですか？
  choices:
    A: 排気システムに漏れがないか定期的に点検を受ける。
    B: 密閉されたガレージ内ではエンジンを切っておく。
    C: 他車のすぐ後ろを走行するときは、通気口（ベント）を閉じる。
    D: 上記のすべて。
  answer: D
  explanation: 一酸化炭素は無臭で致命的です。一酸化炭素中毒の症状には、突然の疲労感、あくび、めまい、吐き気などがあります。唯一の治療法は、十分な新鮮な空気を供給することです。
- id: 260
  category: safe_driving_rules
  question: 車線変更をするときに、すべきではないことはどれですか？
  choices:
    A: サイドミラーとバックミラーを確認すること。
    B: 意思表示のために方向指示器（ターンシグナル）を出すこと。
    C: 自分と同じ車線に移動しようとしている他の運転者がいないか確認すること。
    D: 前方の道路が空いているか確認するために、携帯電話で警察に連絡すること。
  answer: D
  explanation: 車線変更をする前に、サイドミラーとバックミラーで後方から近づいてくる車両を確認してください。方向指示器を使用して、車線変更の計画を他の運転者に知らせます。また、同じ車線に移動しようとしている他の運転者がいないかも確認してください。
- id: 261
  category: sharing_the_road
  question: 低速車両マーク（低速車マーク）とはどのようなものですか？
  choices:
    A: 長方形の赤い標識
    B: 円形の緑色の標識
    C: ひし形の黄色の標識
    D: 三角形のオレンジ色の標識
  answer: D
  explanation: 低速車両マークは、反射材を使用したオレンジ色の三角形です。このマークを付けている車両は、時速25マイル（約40km/h）以下の速度で走行していることが予想されます。
- id: 262
  category: vehicle_information
  question: ハイビームを使用した車両が前方から来た場合、道路の____を見るべきです。
  choices:
    A: どちら側でもよい
    B: 中央
    C: 右側
    D: 左側
  answer: C
  explanation: 対向車がハイビームを使用しており、ライトを下げない場合は、道路の右側（路肩側）に目を向けてください。これにより、相手車両のヘッドライトで目がくらむのを防ぎ、車両が通過するまで自分の進路を維持できる程度の視界を確保することができます。
- id: 263
  category: safe_driving_rules
  question: 高速道路の出口ランプの正しい使い方は次のうちどれですか？
  choices:
    A: 出口ランプに入る前に減速する。
    B: 出口ランプに入ってから減速する。
    C: 出口ランプに入っても速度を一定に保つ。
    D: 出口ランプで低速の車両を追い越す。
  answer: B
  explanation: 高速道路の出口ランプを使用する際は、出口ランプに入るまで減速してはいけません。
- id: 264
  category: vehicle_information
  question: 車両に付着した雪や氷は、どこから取り除くべきですか？
  choices:
    A: 車両の窓
    B: 車両のボンネット
    C: 車両の屋根（ルーフ）
    D: 上記のすべて
  answer: D
  explanation: 州法により、運転者は運転前に車両からすべての雪と氷を取り除くことが義務付けられています。この法律に従わない運転者には罰金が科せられる場合があります。
- id: 265
  category: safe_driving_rules
  question: 黄信号の交差点を注意してそのまま通過できるのは、どのような場合ですか？
  choices:
    A: 緊急車両が自分の車線を横切っている場合
    B: 歩行者が横断している場合
    C: 右折する場合
    D: 信号が黄色に変わったとき、すでに交差点内にいる場合
  answer: D
  explanation: すでに交差点内にいるときに黄信号が点灯した場合は、注意してそのまま交差点を通過してください。
- id: 266
  category: safe_driving_rules
  question: 交差点に近づいた際、信号が青から黄色の点灯に変わりました。どうすべきですか？
  choices:
    A: 注意標識と同じだと考え、そのまま交差点を通過する。
    B: 直ちに停止する。
    C: 安全に停止できないほど近くにいない限り、交差点に入る前に停止する。
    D: 赤信号になる前に交差点を通過できるよう加速する。
  answer: C
  explanation: 黄信号の点灯している交差点に近づく際は、安全に停止できるのであれば、交差点に入る前に減速して停止してください。安全に停止できない場合は、注意して交差点を通過してください。
- id: 267
  category: signs_and_signals
  question: 黄色の実線を越えてもよいのはどのような時ですか？
  choices:
    A: 同じ方向に進んでいる車両を追い越すとき
    B: 日中の時間帯のみ
    C: いつでもよい
    D: 右左折をするとき
  answer: D
  explanation: 原則として、破線の区画線は越えることができますが、実線は越えることができません。黄色の実線を越えてよいのは、運転者が右左折をする場合のみです。
- id: 268
  category: defensive_driving
  question: 雨天時の運転では、次のようにしなければなりません。
  choices:
    A: ロービーム（すれ違い用前照灯）を使用する。
    B: ハイビーム（走行用前照灯）を使用する。
    C: 駐停車灯（パーキングライト）を使用する。
    D: ライトを使用しない。
  answer: A
  explanation: 雨天時には、ロービームを使用する必要があります。
- id: 269
  category: vehicle_information
  question: 走行中の自動車内でシートベルトの着用が義務付けられているのは誰ですか？
  choices:
    A: 運転者のみ
    B: 成人の同乗者のみ
    C: 子供の同乗者のみ
    D: 車内のすべての乗員
  answer: D
  explanation: 州法に基づき、乗用車の運転者およびすべての同乗者はシートベルトを着用しなければなりません。運転者、助手席の同乗者、または18歳未満の子供がシートベルトを着用していない場合は、第一次的違反（それだけで取り締まり対象となる違反）となります。運転者は18歳未満のすべての同乗者に対して責任を負います。第二次的法律（他の理由で停車させた場合に適用される法律）に基づき、18歳以上の後部座席の乗員がシートベルトを着用していない場合、車両が別の理由で停止させられた際に召喚状（切符）が発行されることがあります。
- id: 270
  category: alcohol_drugs_health
  question: 後方に渋滞ができるほど低速で走行している場合は、どうすべきですか？
  choices:
    A: さらに速度を落とす。
    B: 道路の右側に寄せて停車し、後続車を先に行かせる。
    C: 他の車を追い越させないようにする。
    D: ハザードランプを使用する。
  answer: B
  explanation: 交通の流れよりも著しく遅く走ることは危険を伴う場合があります。片側一車線の対面通行の道路で、後方に渋滞ができるほど低速で走行している場合は、道路脇に寄せて他の車両を先に行かせることが義務付けられています。制限速度を大幅に下回る速度での走行は、状況により必要な場合にのみ行ってください。
- id: 271
  category: alcohol_drugs_health
  question: 排気システムの漏れによって起こりうる危険は何ですか？
  choices:
    A: オイルの過剰な消費を引き起こす。
    B: 通常よりも早く車両のチューンアップが必要になる。
    C: 運転中に眠気を引き起こす。
    D: 田舎道で草火災を引き起こす。
  answer: C
  explanation: 排気システムは、有毒ガスの除去、騒音の低減、および稼働中のエンジンから出る高温ガスの冷却を助けます。漏れのある排気システムからの煙は、短時間で死に至る可能性があります。また、運転中に眠気を引き起こすこともあります。
- id: 272
  category: safe_driving_rules
  question: セミトレーラーが、悪天候下で完全に停止するまでに要する距離は、理想的な運転条件下と比較して最大で何パーセント長くなる可能性がありますか？
  choices:
    A: '10'
    B: '25'
    C: '40'
    D: '55'
  answer: B
  explanation: セミトレーラーの近くを運転する際は、その大きさが運転にどのような影響を与えるかを認識しておく必要があります。悪天候下では、大型車両が完全に停止するまでに、理想的な条件下で運転されている場合よりも最大で25パーセント長くかかることがあります。
- id: 273
  category: safe_driving_rules
  question: 大型トラックの近くを運転する場合、他の運転者や道路利用者は以下のどの点を考慮しなければなりませんか？
  choices:
    A: 大型車両が必要とする停止距離の増加。
    B: 大型車両が必要とする停止距離の減少。
    C: 大型車両の騒音の減少。
    D: 大型車両の速度の増加。
  answer: A
  explanation: 大型トラックの近くを運転する場合、他の運転者や道路利用者は、大型車両が必要とする停止距離が長くなることを考慮しなければなりません。小型車両の運転者は、大型車両の運転者から見える位置に留まり、交通の視界がその車両によって遮られないようにする必要があります。
- id: 274
  category: safe_driving_rules
  question: 車両の停止距離が、決して依存しない要素はどれですか？
  choices:
    A: あなた自身の反応時間。
    B: 時刻（一日のうちの時間）。
    C: 車両のブレーキの状態。
    D: 車両のタイヤの状態と種類。
  answer: B
  explanation: 車両が停止するために必要な距離は、運転者の反応時間、天候と視界の状態、車両の重量、ブレーキの状態、タイヤの状態と種類、路面状況、および速度に依存します。
- id: 275
  category: sharing_the_road
  question: 交通法規に従わない自転車利用者は：
  choices:
    A: 自転車利用者は交通法規に従う必要がないため、正しいとされる。
    B: 違反切符を切られる可能性がある。
    C: 常に法執行機関から警告を受けるだけで済む。
    D: 自転車を押収される。
  answer: B
  explanation: すべての自転車利用者は、自動車の運転者と同じ権利、義務、および責任を負います。交通法規に従わない自動車運転者および自転車利用者は、違反切符を切られる可能性があります。
- id: 276
  category: safe_driving_rules
  question: 反対方向に進む車線を分ける路面標示の色は何色ですか？
  choices:
    A: 黄色
    B: 白色
    C: 黄色と白色
    D: 黄色、白色、および黒色
  answer: A
  explanation: 黄色の線は、反対方向に進む交通車線を分けるために道路の中央で使用されます。
- id: 277
  category: signs_and_signals
  question: 下向きの三角形の標識は：
  choices:
    A: スクールゾーン（通学路）を示す。
    B: 運転者に「譲れ（Yield）」と指示する。
    C: 工事区域を示す。
    D: 踏切を示す。
  answer: B
  explanation: 下向きの三角形の標識は、通常、運転者が道を譲るべきであることを示します。道路に車両や歩行者がおらず、安全が確認できれば、運転者は進むことができます。
- id: 278
  category: vehicle_information
  question: 死角にいる車両との衝突を避けるためには、どうすべきですか？
  choices:
    A: 車線変更をする前に、素早く頭を動かして死角に車両がいないか目視で確認する。
    B: 数分おきにバックミラーを調整する。
    C: 曲がる直前や車線変更の直前にクラクションを鳴らす。
    D: 上記のどれでもない。
  answer: A
  explanation: 曲がったり車線変更をしたりする前に、進む方向に頭を向けて肩越しに視線を送り、死角に車両がいないか確認してください。ミラーだけに頼ってはいけません。
- id: 279
  category: safe_driving_rules
  question: 信号機や遮断機のない踏切を通過する車列の中にいる場合：
  choices:
    A: あなたに優先権があり、列車を確認する必要はない。
    B: 踏切を渡っている間に、遅い車を追い越してもよい。
    C: 停車することなく線路を完全に渡りきるためのスペースが、自車分あることを確認する必要がある。
    D: 上記のすべて
  answer: C
  explanation: 踏切で他の車両に続いている場合は、線路に入る前に、完全に渡りきるための十分なスペースがあるか確認してください。踏切に近づいたり渡ったりする際に、他の車両を追い越そうとしてはいけません。線路を渡る前には、必ず列車の有無を確認してください。
- id: 280
  category: signs_and_signals
  question: 赤色の八角形の標識を見たら、どうしなければなりませんか？
  choices:
    A: 完全に停止し、歩行者や交差する交通を確認する。
    B: 完全に停止することなく、速度を落とす。
    C: 完全に停止し、青信号になるのを待つ。
    D: 速度を落とし、交通状況を確認する。
  answer: A
  explanation: 八角形の標識はすべて一時停止標識（Stop Sign）です。一時停止標識のある交差点では、完全に停止し、交差点内の歩行者や交差する交通を確認しなければなりません。交差点がクリアになるのを待ってから進んでください。
- id: 281
  category: safe_driving_rules
  question: 複数車線のある一方通行の道路やハイウェイから左折する場合、どこから開始すべきですか？
  choices:
    A: 交差点の中央。
    B: 右車線。
    C: 左車線。
    D: どの車線からでもよい。
  answer: C
  explanation: 複数車線のある道路やハイウェイから左折する場合は、左車線から開始してください。
- id: 282
  category: safe_driving_rules
  question: ニュージャージー州の工事区域（work zone）について正しいものはどれですか？
  choices:
    A: 移動式の場合もあれば、固定式の場合もある。
    B: 白黒の標識で示される。
    C: 運転者が減速したり細心の注意を払ったりする必要はない。
    D: 上記のすべて。
  answer: A
  explanation: 工事区域は固定されていることが多いですが、ライン引き、草刈り、除雪などを行う移動車両の形をとることもあります。工事区域は、オレンジ色の背景に黒の文字や記号が書かれた標識で示されます。工事区域に接近したり通過したりする際は、減速して細心の注意を払ってください。
- id: 283
  category: safe_driving_rules
  question: 黄色の矢印が点滅している信号機に接近する場合、運転者は：
  choices:
    A: 矢印の方向の車線に合流しなければならない。
    B: 一時停止しなければならない。
    C: 対向車や歩行者に道を譲った後、左折することができる。
    D: 優先権があり、対向車が停止することを期待できる。
  answer: C
  explanation: 黄色の矢印の点滅は、矢印の方向への左折が可能であることを示しています。ただし、対向車線は青信号であるため、対向車や歩行者に道を譲らなければなりません。
- id: 284
  category: safe_driving_rules
  question: 標識や信号のない交差点（uncontrolled intersection）に2台の車両が同時に到着した場合：
  choices:
    A: 最も大きい車両に優先権がある。
    B: 左側の車に優先権がある。
    C: 左側の車は右側の車に道を譲らなければならない。
    D: 右側の車は左側の車に道を譲らなければならない。
  answer: C
  explanation: 標識や信号のない交差点に2台の車両が同時に到着した場合、左側の運転者は右側の運転者に道を譲らなければなりません。左側の運転者は、安全が確認された後に進行することができます。
- id: 285
  category: signs_and_signals
  question: 案内標識（Guide signs）は、運転者に方向や距離の情報を提供する____色の標識です。
  choices:
    A: 黄色
    B: 赤色
    C: 緑色
    D: 白色
  answer: C
  explanation: 案内標識（目的地標識とも呼ばれます）は背景が緑色で、特定の目的地への方向や距離の情報を提供します。慣れない場所を運転する際に役立つリソースとなります。
- id: 286
  category: safe_driving_rules
  question: 追い越しのために2本の黄色の実線のセンターラインを越えることは合法ですか？
  choices:
    A: はい。
    B: いいえ。
    C: 対向車がいない場合。
    D: 前方の車両が制限速度以下で走行している場合。
  answer: B
  explanation: 対面通行の道路の中央にある2本の黄色の実線は、道路外に出るために曲がる場合を除き、どちらの車線からも線を越えてはならないことを意味します。私道や事業所の入り口に出入りするために曲がる場合は、2本の黄色の実線を越えることができます。黄色の実線を越えての追い越しは禁止されています。
- id: 287
  category: safe_driving_rules
  question: 運転中、車両を停止させなければならないのはどのような場合ですか？
  choices:
    A: 一時停止標識のある交差点。
    B: 赤信号の場所。
    C: 交通警察官から停止を命じられたとき。
    D: 上記のすべて。
  answer: D
  explanation: 運転者が停止を義務付けられる状況には、一時停止標識のある交差点への接近、赤信号が点滅または点灯している交差点への接近、または交通警察官から車両の停止を命じられた場合などが含まれます。
- id: 288
  category: penalties_and_points
  question: MVC（車両委員会）が路上試験を開始前に中止する可能性があるのはどのような場合ですか？
  choices:
    A: 安全でない試験車両を持ち込んだ場合。
    B: センターコンソールやその他の装備が、試験官のブレーキペダルへのアクセスを妨げている場合。
    C: 車両にシートベルトがない場合。
    D: 上記のすべて。
  answer: D
  explanation: 試験官が試験に使用する車両を安全でない、または不適切であると判断した場合、路上試験は開始前に拒否されることがあります。シートベルトがない場合や、試験官がフットブレーキやパーキングブレーキを操作できない場合、車両は安全でないとみなされる可能性があります。
- id: 289
  category: defensive_driving
  question: 後ろで誰かが攻撃的な運転（あおり運転など）をしている場合、どうすべきですか？
  choices:
    A: その攻撃的な運転者の邪魔にならないよう道を譲る。
    B: 追い越されるときにその運転者を凝視する。
    C: 追い越されるときにスピードを上げる。
    D: 追い越し車線を塞ぐ。
  answer: A
  explanation: 攻撃的な運転者に遭遇した場合は、その進路から外れるようあらゆる努力を払うべきです。敵対的な運転者と目を合わせることは避けてください。スピードを上げて対抗することは、相手をさらに怒らせるだけであり、危険を増大させます。
- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 徐行して注意深く進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（一時停止）」標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進行する前に、交通状況と歩行者を確認してください。
  id: 290
- image: yield.png
  category: signs_and_signals
  question: この標識は何をすることを求めていますか？
  choices:
    A: 完全停止する
    B: 交通流に合流するために加速する
    C: 徐行し、他の車両や歩行者に道を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「前方優先道路（YIELD）」標識は、徐行して他の車両や歩行者に道を譲らなければならないことを意味します。他の交通が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 291
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターン（転回）する
    B: 注意深く運転を続ける
    C: 停止して後退するか向きを変える — あなたは逆走しています
    D: そのエリアを早く抜けるために加速する
  answer: C
  explanation: 赤と白の「進入禁止（WRONG WAY）」標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に向きを変えるか後退してください。
  id: 292
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方通行（左方向）である
    C: 中央分離帯の左側を通行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「一方通行（ONE WAY）」標識は、その道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 293
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、その場所でのUターン（転回）が禁止されていることを意味します。
  id: 294
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている動作は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が許可されていないことを意味します。
  id: 295
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転者に何を指示していますか？
  choices:
    A: 右側に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線が減少する
  answer: C
  explanation: 矢印が描かれた白い規制標識「右側通行（KEEP RIGHT）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 296
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。最高速度制限の標識は、理想的な条件下においてその区域で法的に許容される最高速度を示します。
  id: 297
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色のひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園やアニマルパークがある
    B: この区域ではシカが頻繁に道路を横断する
    C: この先は狩猟区域である
    D: 近くに野生動物保護区がある
  answer: B
  explanation: シカのシルエットが描かれた黄色のひし形の標識は、この区域でシカが頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 298
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区域
    C: 学校区域または通学路の横断歩道
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、学校区域または通学路の横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 299
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型の「クロバック（Crossbuck）」標識は踏切に設置されます。これは列車に道を譲らなければならないことを意味します。列車が接近している場合は、停止しなければなりません。
  id: 300
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角であることを示している
    B: より大幅な減速が必要な急カーブを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（矢印の角度が急なもの）は、通常のカーブ標識よりも急な曲がり角であることを示しています。このカーブの手前では、より大幅に速度を落とす必要があります。
  id: 301
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道
    B: この先にカーブが1つある
    C: 反対方向への2つの連続するカーブ
    D: この先にラウンドアバウトがある
  answer: C
  explanation: 背向（はいこう）カーブの標識は、この先に反対方向への2つのカーブがあることを警告しています。速度を落とし、道路がまず一方に曲がり、次に反対側に曲がることに備えてください。
  id: 302
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 1つの急カーブ
    B: 滑りやすい路面
    C: この先に連続するカーブや曲がり角
    D: この先に坂道がある
  answer: C
  explanation: 「屈曲あり（つづら折り）」の標識は、この先に連続するカーブや曲がり角があることを警告しています。速度を落とし、道路状況の変化に注意してください。
  id: 303
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の減少
    B: 他の道路からの合流車両
    C: 中央分離帯のある道路の始まり
    D: 1車線への幅員減少
  answer: B
  explanation: 黄色のひし形の合流標識は、他の道路からの交通が自分の車線に合流してくることを警告しています。速度や位置を調整する準備をしてください。
  id: 304
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 中央分離帯のある道路の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって反対車線と仕切られた「中央分離帯のある道路」になることを警告しています。右側を通行してください。
  id: 305
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識はこの先に何があることを伝えていますか？
  choices:
    A: 「譲れ」の標識
    B: 信号機
    C: 一時停止が必要な「止まれ」の標識
    D: スピードバンプ
  answer: C
  explanation: この標識はこの先に一時停止の標識があることを警告しています。減速を開始し、一時停止の標識で完全に停止できるよう準備してください。
  id: 306
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分以内であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転手
  answer: C
  explanation: 車椅子のシンボルが描かれた青色の標識は、障害者のために予約された駐車スペースであることを示しています。有効な障害者用駐車許可証またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反した場合は高額な罰金が科せられます。
  id: 307
