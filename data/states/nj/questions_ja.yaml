questions:
- id: 1
  category: license_system
  question: ニュージャージー州の運転者が自動車を運転する際、何を携帯しなければなりませんか？
  choices:
    A: 有効な運転免許証のみ
    B: 有効な運転免許証、有効な保険証、および車両登録証
    C: 有効な運転免許証と車両登録証のみ
    D: 有効な運転免許証と住所証明書
  answer: B
  explanation: 運転者は、有効な運転免許証（または許可証）、有効な保険証、および車両登録証を携帯しなければなりません。(N.J.S.A. 39:3-29)
- id: 2
  category: license_system
  question: 運転者が住所を変更した場合、いつまでにMVC（車両委員会）に報告しなければなりませんか？
  choices:
    A: 30日以内
    B: 2週間以内
    C: 1週間以内
    D: 60日以内
  answer: C
  explanation: 住所を変更した運転者は、転居後1週間以内にその変更をMVCに報告しなければなりません。(N.J.S.A. 39:3-36)
- id: 3
  category: license_system
  question: 他州の有効な免許証を所持している運転者がニュージャージー州に転入した場合、いつまでに同州の免許証を申請しなければなりませんか？
  choices:
    A: 30日以内
    B: 90日以内
    C: 60日以内、または現在の免許証の有効期限が切れる前のいずれか早い方
    D: 1年以内
  answer: C
  explanation: 他州からの運転者は、60日以内、または現在の免許証の有効期限が切れる前のいずれか早い方までに申請しなければなりません。商用免許（CDL）保持者は30日以内です。(N.J.S.A.
    39:3-17.1)
- id: 4
  category: license_system
  question: ニュージャージー州の運転免許証の有効期間はどのくらいですか？
  choices:
    A: 2年
    B: 4年
    C: 5年
    D: 6年
  answer: B
  explanation: ニュージャージー州の運転免許証の有効期間は4年間です。
- id: 5
  category: license_system
  question: ニュージャージー州で特別学習許可証（Special Learner Permit）を取得できる最低年齢は何歳ですか？
  choices:
    A: '15'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: 特別学習許可証は、段階的運転免許制度（GDL）のオプションAに基づき、16歳で取得できます。
- id: 6
  category: license_system
  question: 段階的運転免許制度（GDL）プログラムにおいて、路上試験を受ける前に必要な運転練習時間は何時間ですか？
  choices:
    A: 25時間（うち夜間5時間を含む）
    B: 30時間（うち夜間10時間を含む）
    C: 50時間（うち夜間10時間を含む）
    D: 40時間（うち夜間15時間を含む）
  answer: C
  explanation: GDL許可証保持者は、夜間の10時間を含む、最低50時間の運転練習を完了しなければなりません。
- id: 7
  category: license_system
  question: 21歳未満のGDL許可証および仮免許（Probationary License）保持者に対する運転時間の制限は何ですか？
  choices:
    A: 午後10時から午前6時の間は運転禁止
    B: 午後11時1分から午前5時の間は運転禁止
    C: 午前0時から午前5時の間は運転禁止
    D: 午後9時から午前6時の間は運転禁止
  answer: B
  explanation: 21歳未満のGDL許可証および仮免許保持者は、午後11時1分から午前5時の間は運転できません。
- id: 8
  category: license_system
  question: 21歳未満のGDL運転者の携帯電話の使用に関して、何が義務付けられていますか？
  choices:
    A: ハンズフリー機器のみ使用できる
    B: 手持ち式・ハンズフリーを問わず携帯電話、およびその他の電子機器を使用してはならない
    C: 緊急時のみ携帯電話を使用できる
    D: 赤信号の時のみテキストメッセージを送信できる
  answer: B
  explanation: GDL保持者は、運転中に手持ち式またはハンズフリーの携帯電話、あるいはその他の電子機器を使用してはなりません。
- id: 9
  category: license_system
  question: GDLデカール（ステッカー）は何枚、どこに表示しなければなりませんか？
  choices:
    A: 後部ナンバープレートに1枚
    B: 車両の両側に1枚ずつ、計2枚
    C: 前部プレートの左上隅に1枚、後部プレートの左上隅に1枚の計2枚
    D: 後部窓に2枚
  answer: C
  explanation: 視認性の高い赤色の反射デカール2枚を表示しなければなりません。1枚は前部プレートの左上隅、もう1枚は後部プレートの左上隅です。
- id: 10
  category: license_system
  question: GDL許可証保持者に同乗して指導する運転者の最低年齢は何歳ですか？
  choices:
    A: 有効なニュージャージー州免許を持つ18歳
    B: 有効なニュージャージー州免許を持ち、最低3年の運転経験がある21歳
    C: 有効なニュージャージー州免許を持つ25歳
    D: 免許を持つすべてのニュージャージー州の運転者
  answer: B
  explanation: 指導する運転者は、21歳以上であり、有効なニュージャージー州の免許を所持し、かつ最低3年の運転経験がなければなりません。
- id: 11
  category: license_system
  question: 普通免許（basic license）を取得する前に、試用免許（probationary license）の期間はどのくらい必要ですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 18ヶ月
  answer: B
  explanation: 試用免許の保持者は、普通免許を取得する前に、少なくとも1年間の監督なしの運転練習を行う必要があります。
- id: 12
  category: license_system
  question: ニュージャージー州の運転免許証を取得するには、何ポイントの本人確認書類が必要ですか？
  choices:
    A: 4ポイント
    B: 5ポイント
    C: 6ポイント
    D: 8ポイント
  answer: C
  explanation: すべての申請者は、6ポイントの本人確認書類を提示する必要があります。
- id: 13
  category: license_system
  question: 他国の有効な免許証を所持している運転者は、ニュージャージー州で最大どのくらいの期間運転できますか？
  choices:
    A: 30日
    B: 60日
    C: 6ヶ月
    D: 1年
  answer: D
  explanation: 他国の有効な免許証を所持している運転者は、その免許証で最大1年間運転することができます。（N.J.A.C. 13:21-8.2(f)）
- id: 14
  category: license_system
  question: 運転免許証を改ざんしたり、改ざんされた免許証を提示したりした場合の罰則は何ですか？
  choices:
    A: 警告
    B: 100ドルの罰金
    C: 運転資格の喪失、最大1,000ドルの罰金、および/または禁錮
    D: 社会奉仕活動のみ
  answer: C
  explanation: 運転免許証を改ざんしたり、改ざんされたものを提示したりすると、運転資格の喪失、最大1,000ドルの罰金、および/または禁錮に処される可能性があります。
- id: 15
  category: license_system
  question: GDL（段階的免許制度）のオプションC（成人ロード）において、最低年齢と監督下での練習期間はどれくらいですか？
  choices:
    A: 18歳、6ヶ月の監督下での運転
    B: 21歳、3ヶ月の監督下での運転
    C: 21歳、6ヶ月の監督下での運転
    D: 25歳、1ヶ月の監督下での運転
  answer: B
  explanation: GDLオプションCでは、最低21歳であることと、少なくとも3ヶ月の監督下での運転練習が必要です。
- id: 16
  category: driver_testing
  question: ニュージャージー州MVCの知識テストに合格するには、何点必要ですか？
  choices:
    A: 70%（50問中35問）
    B: 75%（50問中37問）
    C: 80%（50問中40問）
    D: 90%（50問中45問）
  answer: C
  explanation: 80パーセント、つまり50問中40問に正解する必要があります。
- id: 17
  category: driver_testing
  question: 普通免許の申請者に求められる最低限の視力要件は何ですか？
  choices:
    A: 視力20/20
    B: 視力20/40
    C: 矯正レンズの使用の有無にかかわらず視力20/50
    D: 視力20/70
  answer: C
  explanation: 普通免許の申請者は、矯正レンズの使用の有無にかかわらず、20/50の視力が必要です。
- id: 18
  category: driver_testing
  question: ニュージャージー州MVCの知識テストは何問ありますか？
  choices:
    A: 25問
    B: 40問
    C: 50問と臓器提供に関するアンケート1問
    D: 100問
  answer: C
  explanation: 知識テストは50問の質問と、臓器提供に関するアンケート1問で構成されています。
- id: 19
  category: driver_responsibility
  question: ニュージャージー州のシートベルト法に基づき、18歳未満の同乗者にシートベルトを着用させる責任は誰にありますか？
  choices:
    A: 同乗者本人
    B: 運転者
    C: 車内にいなくても親
    D: 誰にもない（未成年者は任意）
  answer: B
  explanation: 18歳未満のすべての同乗者にシートベルトを着用させる責任は、運転者にあります。
- id: 20
  category: driver_responsibility
  question: シートベルトを着用することで、衝突事故での生存率は何パーセント向上しますか？
  choices:
    A: 30パーセント
    B: 45パーセント
    C: 60パーセント
    D: 80パーセント
  answer: C
  explanation: シートベルトを着用することで、衝突事故での生存率を60パーセント向上させることができます。
- id: 21
  category: driver_responsibility
  question: 何歳未満の子供は後部座席に乗らなければなりませんか？
  choices:
    A: '5'
    B: '6'
    C: '8'
    D: '10'
  answer: C
  explanation: 8歳未満のすべての子供は後部座席に座らなければなりません。
- id: 22
  category: driver_responsibility
  question: 2歳未満または体重30ポンド（約13.6kg）未満の子供は、何に乗らなければなりませんか？
  choices:
    A: 前向きのチャイルドシート
    B: ブースターシート
    C: 5点式ハーネス付きの後ろ向きチャイルドシート
    D: 通常のシートベルト
  answer: C
  explanation: 2歳未満および体重30ポンド未満の子供は、連邦政府の承認を受けた5点式ハーネス付きの後ろ向きチャイルドシート（チャイルド・レストレイント・システム）に乗らなければなりません。
- id: 23
  category: driver_responsibility
  question: ハンドルの正しい持ち手の位置はどこですか？
  choices:
    A: 10時と2時の位置
    B: 9時と3時の位置
    C: 8時と4時の位置
    D: 片手で12時の位置
  answer: B
  explanation: 運転者は、ハンドルの9時と3時の位置を握り、親指をハンドルの面に沿わせるようにします。
- id: 24
  category: driver_responsibility
  question: 時速20マイル（約32km/h）で走行中、運転者は何フィート以内で停止できる必要がありますか？
  choices:
    A: 15フィート
    B: 25フィート
    C: 35フィート
    D: 50フィート
  answer: B
  explanation: 運転者は、時速20マイルで走行中、25フィート（約7.6m）以内で停止できる必要があります。
- id: 25
  category: driver_responsibility
  question: 曲がる前に、どれくらい手前で方向指示器（ウィンカー）を作動させなければなりませんか？
  choices:
    A: 50フィート
    B: 75フィート
    C: 100フィート
    D: 200フィート
  answer: C
  explanation: 運転者は、曲がる少なくとも100フィート（約30m）手前で方向指示器を出さなければなりません。(N.J.S.A. 39:4-126)
- id: 26
  category: driver_responsibility
  question: 右折の正しい手信号は何ですか？
  choices:
    A: 手と腕を水平に伸ばす
    B: 手と腕を上に向ける
    C: 手と腕を下に向ける
    D: 手を振る動作
  answer: B
  explanation: 右折：手と腕を上に向けます。左折：手と腕を水平に伸ばします。停止または徐行：手と腕を下に向けます。
- id: 27
  category: driver_responsibility
  question: 縁石のある道路で上り坂に駐車する場合、車輪はどちらの方向に向けるべきですか？
  choices:
    A: 縁石の方に向ける
    B: 縁石とは反対の方に向ける
    C: まっすぐ向ける
    D: どちらでもよい
  answer: B
  explanation: 上り坂に駐車する場合、車輪は縁石とは反対の方向に向ける必要があります。
- id: 28
  category: driver_responsibility
  question: 縦列駐車をする際、車両のタイヤと縁石の間の最大距離はどれくらいですか？
  choices:
    A: 12インチ
    B: 6インチ
    C: 18インチ
    D: 3インチ
  answer: B
  explanation: 縦列駐車をする際、車両のタイヤは縁石から6インチ（約15cm）以内でなければなりません。
- id: 29
  category: driver_responsibility
  question: ニュージャージー州法では、車両のアイドリング制限時間は何分ですか？
  choices:
    A: 1分
    B: 3分
    C: 5分
    D: 10分
  answer: B
  explanation: ニュージャージー州法では、すべての運転者に対し、車両のアイドリングを3分以内に制限することを義務付けています。(N.J.A.C. 7:27-15.8)
- id: 30
  category: driver_responsibility
  question: 運転前に車両から雪や氷を取り除かなかった場合の罰金はいくらですか？
  choices:
    A: $10から$25
    B: $25から$75
    C: $100から$500
    D: $500から$1,000
  answer: B
  explanation: 雪や氷が実際に剥がれ落ちたかどうかにかかわらず、25ドルから75ドルの罰金が科せられます。剥がれ落ちた雪や氷が負傷や物的損害を引き起こした場合、最大1,500ドルの罰金が科せられることがあります。
- id: 31
  category: driver_responsibility
  question: ダッシュボードやフロントガラスに衝突した際、3階建てのビルから転落するのと同等の衝撃となる速度はどれくらいですか？
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: 時速30マイル (30 mph) でダッシュボードやフロントガラスに衝突することは、3階建てのビルの屋上から転落することに相当します。
- id: 32
  category: driver_responsibility
  question: エアバッグが膨らむ速度は最大で時速何マイルですか？
  choices:
    A: 50 mph
    B: 100 mph
    C: 150 mph
    D: 200 mph
  answer: D
  explanation: エアバッグは最大で時速200マイル (200 mph) の速度で膨らみます。
- id: 33
  category: driver_responsibility
  question: 運転者はハンドルから最低でもどのくらいの距離を離して座るべきですか？
  choices:
    A: 6インチ
    B: ハンドルの中心から胸骨の中心まで10インチ
    C: 12インチ
    D: 18インチ
  answer: B
  explanation: ハンドルの中心から胸骨の中心までの間隔は、少なくとも10インチ (10 inches) 空ける必要があります。
- id: 34
  category: driver_responsibility
  question: 車を後退（バック）させるときの速度はどのくらいにするべきですか？
  choices:
    A: 時速5〜10マイル
    B: 歩行速度（時速2〜4マイル）
    C: 時速10〜15マイル
    D: 時速20マイル未満
  answer: B
  explanation: 車を後退させるときは、ゆっくりと運転する必要があります。通常は歩行速度（時速2〜4マイル）です。
- id: 35
  category: driver_responsibility
  question: 実技試験（ロードテスト）において、運転者は後退（バック）でどのくらいの距離を走行できなければなりませんか？
  choices:
    A: 50フィート
    B: 75フィート
    C: 100フィート
    D: 200フィート
  answer: C
  explanation: 実技試験では、直進で約100フィート (100 feet) 車を後退させることが求められます。
- id: 36
  category: driver_responsibility
  question: 安全なタイヤの最小溝深さはどれくらいですか？
  choices:
    A: 1/8インチ
    B: 1/16インチ
    C: 1/4インチ
    D: 1/32インチ
  answer: B
  explanation: タイヤの溝が1/16インチ (1/16 inch) 未満（ペニー硬貨の端程度）の車両を運転してはいけません。
- id: 37
  category: driver_responsibility
  question: 通常の条件下で、クラクション（警音器）は少なくともどのくらいの距離まで聞こえる必要がありますか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 通常の条件下では、クラクションは少なくとも200フィート (200 feet) 先まで聞こえる必要があります。(N.J.S.A. 39:3-69)
- id: 38
  category: safe_driving_rules
  question: 学校周辺（スクールゾーン）、商業地区、または住宅地区の制限速度はどれくらいですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: 学校周辺、商業地区、または住宅地区では時速25マイル (25 mph) です。
- id: 39
  category: safe_driving_rules
  question: 郊外の商業地区および住宅地区の制限速度はどれくらいですか？
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 40 mph
  answer: C
  explanation: 郊外の商業地区および住宅地区では時速35マイル (35 mph) です。
- id: 40
  category: safe_driving_rules
  question: 標識のない田舎の道路の制限速度はどれくらいですか？
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 55 mph
  answer: C
  explanation: 標識のない田舎の道路では時速50マイル (50 mph) です。
- id: 41
  category: safe_driving_rules
  question: 65 mphの制限速度を10 mph以上超過した場合、罰金はどうなりますか？
  choices:
    A: 3倍になる
    B: 2倍になる
    C: 100ドルが追加される
    D: 特に変わらない
  answer: B
  explanation: 65 mphの制限速度を10 mph以上超過した場合、運転者は2倍の罰金を支払うことになります。(N.J.S.A. 39:4-98.6)
- id: 42
  category: safe_driving_rules
  question: 右側からの追い越しが許可されるのはどのような時ですか？
  choices:
    A: いかなる場合も許可されない
    B: 同じ方向に2車線以上ある道路、または前方の車両が左折しようとしており十分なスペースがある場合のみ
    C: 高速道路であればいつでも
    D: 路肩（ショルダー）を通行する場合のみ
  answer: B
  explanation: 右側からの追い越しは、同じ方向に2車線以上ある道路、または前方の車両が左折しようとしており十分なスペースがある場合にのみ許可されます。右側の路肩を通行して追い越してはいけません。
- id: 43
  category: safe_driving_rules
  question: 2本の黄色の実線のセンターラインは何を意味しますか？
  choices:
    A: 注意して追い越すことができる
    B: どちらの側からも追い越しができる
    C: どちらの方向からも追い越し禁止
    D: トラックのみ追い越しができる
  answer: C
  explanation: センターラインが2本とも実線の場合、どちらの方向からも追い越しは禁止されています。
- id: 44
  category: safe_driving_rules
  question: 全方向一時停止（マルチウェイ・ストップ）の交差点で、2台の車が同時に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側の運転者
    B: 右側の運転者
    C: 直進する運転者
    D: 右折する運転者
  answer: B
  explanation: 全方向一時停止の交差点で2台の車両が同時に到着した場合、運転者は右側の運転者に道を譲らなければなりません。
- id: 45
  category: safe_driving_rules
  question: 停電により信号機が作動していない場合、どのように扱うべきですか？
  choices:
    A: 「譲れ（Yield）」の標識として扱う
    B: 注意信号として扱う
    C: 4方向一時停止（4-way stop）として扱う
    D: 信号が青であるかのように扱う
  answer: C
  explanation: 停電により信号機が点灯していない場合は、4方向一時停止の信号として遵守しなければなりません。(N.J.S.A. 39:4-81)
- id: 46
  category: safe_driving_rules
  question: ニュージャージー州では、赤信号での右折は合法ですか？
  choices:
    A: いいえ、いかなる場合も禁止です
    B: はい。完全に停止し交通状況を確認した後であれば可能です（「赤信号での右折禁止（No Turn on Red）」の標識がある場合を除く）
    C: はい。道が空いていれば停止せずに可能です
    D: 高速道路でのみ可能です
  answer: B
  explanation: ニュージャージー州の法律では、「赤信号での右折禁止」の標識がない限り、完全に停止して交通状況を確認した後の赤信号での右折を認めています。(N.J.S.A.
    39:4-115)
- id: 47
  category: safe_driving_rules
  question: 赤いライトを点滅させているスクールバスに近づく際、運転者はどうしなければなりませんか？
  choices:
    A: 25 mphまで減速し、注意して進む
    B: 少なくとも25フィート離れた場所で停止する
    C: 少なくとも15フィート離れた場所で停止する
    D: 10 mphまで減速して進む
  answer: B
  explanation: 州法により、運転者は赤いライトを点滅させているスクールバスから少なくとも25フィート離れた場所で停止することが義務付けられています。(N.J.S.A.
    39:4-128.1)
- id: 48
  category: safe_driving_rules
  question: スクールバスが学校の真ん前に停車している場合、運転者は時速何マイル以下で追い越すことができますか？
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 25 mph
  answer: B
  explanation: スクールバスが学校の真ん前に停車している場合、運転者はどちらの方向からでも10 mph以下の速度で追い越すことができます。
- id: 49
  category: safe_driving_rules
  question: 警告信号が作動している際、運転者は鉄道の線路からどのくらい離れて停止しなければなりませんか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 25フィート
    D: 50フィート
  answer: B
  explanation: 赤いライトの点滅、ベルの音、または遮断機が降りている（あるいは降り始めている）踏切では、運転者は少なくとも15フィート手前で停止しなければなりません。(N.J.S.A.
    39:4-127.1)
- id: 50
  category: safe_driving_rules
  question: 緊急車両の後方を走行する場合、運転者はどのくらいの距離を保たなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: C
  explanation: 運転者は、サイレンやライトを作動させている緊急車両の後方から少なくとも300フィートの距離を保つ必要があります。(N.J.S.A. 39:4-92)
- id: 51
  category: safe_driving_rules
  question: ヘッドライトはいつ使用しなければなりませんか？
  choices:
    A: 日没後のみ
    B: 日没の30分後から日の出の30分前まで、視界が500フィート（約152メートル）以下の場合、またはワイパーを使用している時
    C: 完全に暗い時のみ
    D: 雨の時のみ
  answer: B
  explanation: ヘッドライトは、日没の30分後から日の出の30分前まで、視界が500フィート以下の場合、およびワイパーを使用している時に使用しなければなりません。(N.J.S.A.
    39:3-46)
- id: 52
  category: safe_driving_rules
  question: 消火栓から何フィート以内の駐車が禁止されていますか？
  choices:
    A: 5フィート
    B: 10フィート
    C: 15フィート
    D: 25フィート
  answer: B
  explanation: 消火栓から10フィート以内の駐車は禁止されています。(N.J.S.A. 39:4-138)
- id: 53
  category: safe_driving_rules
  question: 交差点の横断歩道から何フィート以内の駐車が禁止されていますか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 25フィート
    D: 50フィート
  answer: C
  explanation: 交差点の横断歩道から25フィート以内の駐車は禁止されています。(N.J.S.A. 39:4-138)
- id: 54
  category: safe_driving_rules
  question: 一時停止標識（ストップサイン）から何フィート以内の駐車が禁止されていますか？
  choices:
    A: 25フィート
    B: 35フィート
    C: 50フィート
    D: 75フィート
  answer: C
  explanation: 一時停止標識から50フィート以内の駐車は禁止されています。(N.J.S.A. 39:4-138)
- id: 55
  category: safe_driving_rules
  question: 踏切から何フィート以内の駐車が禁止されていますか？
  choices:
    A: 25フィート
    B: 35フィート
    C: 50フィート
    D: 75フィート
  answer: C
  explanation: 踏切から50フィート以内の駐車は禁止されています。(N.J.S.A. 39:4-138)
- id: 56
  category: safe_driving_rules
  question: 車両を縁石から何インチ以上離して駐車することは違法ですか？
  choices:
    A: 3インチ
    B: 6インチ
    C: 12インチ
    D: 18インチ
  answer: B
  explanation: 車両を縁石から6インチ以上離して駐車することは違法です。(N.J.S.A. 39:4-135)
- id: 57
  category: safe_driving_rules
  question: 運転中に手持ちの携帯電話を使用した際の、初犯の罰金はいくらですか？
  choices:
    A: $100-$200
    B: $200-$400
    C: $400-$600
    D: $600-$800
  answer: B
  explanation: 初犯の罰金は200ドル〜400ドルです。2回目は400ドル〜600ドル、3回目は600ドル〜800ドルとなります。(N.J.S.A.
    39:4-97.3)
- id: 58
  category: safe_driving_rules
  question: 「ムーブ・オーバー法（Move Over law）」は何を義務付けていますか？
  choices:
    A: すべての車両に対して車線を譲ること
    B: 停車中の緊急車両、レッカー車、または故障車から離れるように車線を変更すること。車線変更が不可能な場合は減速すること。
    C: 常に右車線に移動すること
    D: 合流車両に道を譲ること
  answer: B
  explanation: ムーブ・オーバー法は、運転者が停車中の緊急車両から離れるように車線を変更するか、車線変更が不可能な場合は減速することを義務付けています。罰金は100ドル〜500ドルです。(N.J.S.A.
    39:4-92.2)
- id: 59
  category: safe_driving_rules
  question: 出動中の消防署車両から何フィート以内の駐車を避けなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 運転者は、出動中の消防署車両から200フィート以内に駐車してはいけません。
- id: 60
  category: safe_driving_rules
  question: 赤いライトを点滅させているアイスクリーム販売車（frozen dessert truck）に近づく際、運転者はどうしなければなりませんか？
  choices:
    A: 時速25マイルまで減速する
    B: 停止し、その後、時速15マイル以下で通り過ぎる
    C: 停止し、その後、時速10マイル以下で通り過ぎる
    D: 歩行者に道を譲るだけでよい
  answer: B
  explanation: 運転者は停止し、横断者に道を譲り、子供に注意を払いながら、時速15マイル以下で通り過ぎなければなりません。(N.J.S.A. 39:4-128.4)
- id: 61
  category: safe_driving_rules
  question: 横断歩道で歩行者のために停止しなかった場合の罰則は何ですか？
  choices:
    A: 200ドル以下の罰金と違反点数2点
    B: 500ドル以下の罰金、25日以内の禁錮、社会奉仕活動、最長6ヶ月の免許停止、および違反点数2点
    C: 100ドルの罰金のみ
    D: 警告のみ
  answer: B
  explanation: 歩行者のために停止しなかった場合、500ドル以下の罰金、25日以内の禁錮、社会奉仕活動、最長6ヶ月の免許停止、および違反点数2点が科されます。(N.J.S.A.
    39:4-36)
- id: 62
  category: safe_driving_rules
  question: 信号機や標識を避けるために私有地を走行することは：
  choices:
    A: 安全に行われるのであれば合法である
    B: 交通違反である
    C: 住宅街でのみ違法である
    D: 緊急時には許可される
  answer: B
  explanation: 信号機や標識を避けるために私有地を走行することは交通違反となります。(N.J.S.A. 39:4-66.2)
- id: 63
  category: safe_driving_rules
  question: ニュージャージー州法では、車両のどの窓への後付けのスモークフィルム（ティンティング）を禁止していますか？
  choices:
    A: 後部窓のみ
    B: すべての窓
    C: フロントガラスと前部座席のサイドガラス
    D: 運転席側の窓のみ
  answer: C
  explanation: ニュージャージー州法では、フロントガラスおよび前部座席のサイドガラスへの後付けのスモークフィルム（ティンティング）を禁止しています。(N.J.S.A.
    39:3-74)
- id: 64
  category: safe_driving_rules
  question: 安全地帯（セーフティアイランド）のある片側2車線以上の道路で、反対側にスクールバスが停車している場合、運転者はどうすべきですか？
  choices:
    A: 完全に停止する
    B: 時速10マイル（10 mph）まで減速する
    C: 制限速度で走行を続ける
    D: 時速25マイル（25 mph）まで減速する
  answer: B
  explanation: 片側2車線以上の道路を走行中、安全地帯や隆起した中央分離帯を挟んだ反対側にスクールバスが停車している場合、運転者は時速10マイルまで減速しなければなりません。
- id: 65
  category: safe_driving_rules
  question: 交差点に接近する際、運転者はどこで停止しなければなりませんか？
  choices:
    A: 最も近い横断歩道から10フィート以内
    B: 最も近い横断歩道または停止線から5フィート以内
    C: 交差点から少なくとも15フィート手前
    D: 停止線、または交差点の25フィート手前
  answer: B
  explanation: 運転者は、最も近い横断歩道または停止線から5フィート（約1.5メートル）以内で車両を完全に停止させなければなりません。
- id: 66
  category: defensive_driving
  question: 「3秒プラス・ルール（three-second-plus rule）」とは何ですか？
  choices:
    A: 車線変更をする前に3秒間前方を確認すること
    B: 信号が青に変わってから3秒待って発進すること
    C: 前方車両との間に少なくとも3秒間の車間距離を保つこと
    D: 右左折の3秒前に合図を出すこと
  answer: C
  explanation: 前方の固定物を選びます。前方車両がその物体を通過してから、自分の車両が同じ物体を通過するまでに少なくとも3秒かかれば、急停止に対応できる十分な車間距離が保たれていることになります。
- id: 67
  category: defensive_driving
  question: 悪天候の場合、3秒の車間距離ルールは何秒に増やすべきですか？
  choices:
    A: 3秒
    B: 4秒以上
    C: 2秒
    D: 正確に6秒
  answer: B
  explanation: 悪天候の間は、車間距離の時間間隔を4秒以上に増やす必要があります。
- id: 68
  category: defensive_driving
  question: 車間距離の目安（経験則）はどれくらいですか？
  choices:
    A: 時速10マイルごとに車2台分の長さ
    B: 時速10マイル（10 mph）ごとに車1台分（約20フィート）の長さ
    C: 時速20マイルごとに車1台分の長さ
    D: すべての速度において車3台分の長さ
  answer: B
  explanation: 最も一般的に使用される目安は、時速10マイルごとに車1台分（約20フィート）の車間距離を空けることです。
- id: 69
  category: defensive_driving
  question: 通常の日中の条件下で、時速60マイル走行時の総停止距離はどれくらいですか？
  choices:
    A: 247フィート
    B: 302フィート
    C: 343フィート
    D: 409フィート
  answer: C
  explanation: 時速60マイルの場合：反応距離（66フィート）＋ 制動距離（277フィート）＝ 総停止距離343フィートとなります。
- id: 70
  category: defensive_driving
  question: 時速60マイルで走行している車両は、1秒間に何フィート進みますか？
  choices:
    A: 44フィート
    B: 66フィート
    C: 88フィート
    D: 110フィート
  answer: C
  explanation: 時速60マイルで走行している車両は、1秒間に88フィート進みます。
- id: 71
  category: defensive_driving
  question: ハイドロプレーニング現象は何マイルから始まる可能性がありますか？
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: 濡れた路面では、時速約35マイル（35 mph）からタイヤがハイドロプレーニング現象を起こし始めることがあります。時速55マイル（55
    mph）を超えると、タイヤが完全に路面から離れてしまう可能性があります。
- id: 72
  category: defensive_driving
  question: スリップした際、運転者はどうすべきですか？
  choices:
    A: ブレーキを強く踏む
    B: スリップしている方向とは逆方向にハンドルを切る
    C: ハンドルを切りすぎないように注意しながら、車両の後輪が滑っている方向にハンドルを切る
    D: 加速する
  answer: C
  explanation: スピンを避けるために、運転者はハンドルを切りすぎないように注意しながら、車両の後輪が滑っている方向にハンドルを切る必要があります。進みたい方向を見るようにしてください。
- id: 73
  category: defensive_driving
  question: ハイウェイ・ヒプノーシス（高速道路催眠現象）の原因は何ですか？
  choices:
    A: スピードの出しすぎ
    B: 長時間の運転中に、特定のものを数秒以上見続けること
    C: 窓を閉め切って運転すること
    D: 大音量の音楽
  answer: B
  explanation: 特定のものを数秒以上見続けないようにすることで、ハイウェイ・ヒプノーシスを防ぐことができます。2時間ごとに休憩を取るようにしましょう。
- id: 74
  category: defensive_driving
  question: マギーズ・ロー（Maggie's Law）とは何ですか？
  choices:
    A: 携帯電話の使用に関する法律
    B: 過労状態での運転を、自動車過失致死罪における「無謀運転」とみなす法律
    C: シートベルトに関する法律
    D: 速度制限に関する法律
  answer: B
  explanation: マギーズ・ローは、睡眠不足で正常な運転ができないことを自覚しながら運転することを違法とし、過労運転を自動車過失致死罪における無謀運転として規定しています。（N.J.S.A.
    2C:11-5）
- id: 75
  category: defensive_driving
  question: 車両の車輪が路肩にはみ出してしまった場合、運転者はどうすべきですか？
  choices:
    A: すぐに舗装路に戻るようにハンドルを切る
    B: 路肩にとどまり、アクセルを緩めて時速25マイル以下まで減速してから、道路側にハンドルを4分の1回転切って戻る
    C: ブレーキを強く踏む
    D: 道路に戻るために加速する
  answer: B
  explanation: 路肩にとどまったままアクセルを緩めます。時速25マイル（25 mph）以下に減速した後、ハンドルを道路の方向に4分の1回転切って戻ります。
- id: 76
  category: defensive_driving
  question: 霧の中では、ヘッドライトをどの状態にすべきですか？
  choices:
    A: ハイビーム（上向き）
    B: ロービーム（下向き）
    C: パーキングライト（車幅灯）のみ
    D: 消灯
  answer: B
  explanation: 霧の中では、ヘッドライトをロービームにし、車両にフォグランプが装備されている場合はそれを使用してください。
- id: 77
  category: defensive_driving
  question: 積雪のある道路で推奨される車間距離はどれくらいですか？
  choices:
    A: 3秒
    B: 4秒
    C: 6秒以上
    D: 8秒
  answer: C
  explanation: 積雪のある道路では、6秒以上の車間距離を保つことが適切なルールとされています。
- id: 78
  category: defensive_driving
  question: アクセルペダルが戻らなくなった場合、運転者はどうすべきですか？
  choices:
    A: すぐにエンジンを切る
    B: アクセルペダルを何度も踏む
    C: 前方に注意を払いながら、素早くギアをニュートラルに入れ、安全な場所に誘導してからエンジンを切る
    D: パーキングブレーキを引く
  answer: C
  explanation: アクセルペダルが固まった場合は、道路から目を離さず、素早くギアをニュートラル（N）に入れ、路外の安全な場所まで操縦して停車させてから、エンジンを切り、助けを呼んでください。
- id: 79
  category: defensive_driving
  question: 踏切内で車両が動かなくなった場合、運転者はどうすべきですか？
  choices:
    A: エンジンの再始動を試みる
    B: 車内で助けを待つ
    C: 車から降りて線路から遠ざかり、列車の進行方向に向かって45度の角度で走る
    D: 車を線路の外へ押し出す
  answer: C
  explanation: すぐに車から降りて遠くへ離れてください。列車が近づいている場合は、飛散物を避けるため、線路から離れる方向に、かつ列車が来る方向に向かって45度の角度で走ってください。
