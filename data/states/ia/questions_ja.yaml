questions:
- id: 1
  category: safe_driving_rules
  question: マニュアルの基本安全規則によると、車内では誰がシートベルトを着用する必要がありますか？
  choices:
    A: 運転者と助手席の同乗者のみ
    B: 18歳未満の子供のみ
    C: 車内の座席位置に関わらず、全員
    D: 後部座席の同乗者のみ
  answer: C
  explanation: マニュアルには基本安全規則として、「車内のどこに座っていても、シートベルトを着用すること」と記載されています。
- id: 2
  category: safe_driving_rules
  question: 安全運転を始めるための基本安全規則として、次のうちどれが挙げられていますか？
  choices:
    A: 制限速度より時速5マイル（5 mph）遅く運転する
    B: 運転という作業に全神経を集中させる
    C: 運転中はハンズフリー機器のみを使用する
    D: 常にヘッドライトを点灯させておく
  answer: B
  explanation: マニュアルには、「運転という作業に全神経を集中させる」ことが基本安全規則の一つとして明記されています。
- id: 3
  category: license_system
  question: アイオワ州の運転免許サービス窓口を訪れる際、どの場所に行く必要がありますか？
  choices:
    A: 自宅から最も近い場所に行かなければならない
    B: デモインにあるDOT（運輸局）本部に必ず行かなければならない
    C: アイオワ州内のどのDOTサービスセンターまたは郡財務官事務所（County Treasurer's Office）でも訪れることができる
    D: 新規居住者の場合のみ、郡財務官事務所を訪れることができる
  answer: C
  explanation: マニュアルには、州内のアイオワ州DOTサービスセンターおよび郡財務官事務所にサービス窓口があり、「どの場所でも訪れることができます。自宅から最も近い場所である必要はありません」と記載されています。
- id: 4
  category: license_system
  question: アイオワ州の運転免許証をオンラインで更新できる可能性があるのは、何歳からですか？
  choices:
    A: 16歳以上
    B: 18歳以上
    C: 21歳以上
    D: 25歳以上
  answer: B
  explanation: マニュアルによると、18歳以上で他の要件を満たしている場合、免許更新などの一部のサービスをオンラインで利用できます。
- id: 5
  category: license_system
  question: オンラインの運転免許サービスに関して、マニュアルは何を警告していますか？
  choices:
    A: オンラインサービスは通常の営業時間内のみ利用可能である
    B: DOTが無料で提供している情報を販売しているウェブサイトがある
    C: オンラインで更新するには追加の手数料を支払う必要がある
    D: オンライン更新は商用ドライバーのみが利用できる
  answer: B
  explanation: マニュアルでは、「私たちが無料で提供している情報を販売しているウェブサイトがいくつか存在します。それらは新しい運転免許証を取得できるかのように思わせますが、実際には取得できません」と警告しています。
- id: 6
  category: license_system
  question: アイオワ州において、公道で次のうちどれを運転する場合、許可証（パーミット）または免許証が必要ですか？
  choices:
    A: 自動車、オートバイ、またはモペッド（原動機付自転車）
    B: 自転車または電動スクーター
    C: 電動車椅子
    D: 農用トラクターのみ
  answer: A
  explanation: マニュアルには次のように記載されています。「アイオワ州では、公道で自動車、オートバイ、またはモペッドを運転する人は誰でも、許可証または免許証を所持している必要があります。」
- id: 7
  category: license_system
  question: 運転免許取得の目的において、アイオワ州に継続して何日間居住すると、アイオワ州居住者とみなされますか？
  choices:
    A: 14日間
    B: 30日間
    C: 60日間
    D: 90日間
  answer: B
  explanation: 「アイオワ州に継続して30日間居住している」場合、アイオワ州居住者とみなされます。
- id: 8
  category: license_system
  question: 運転免許取得の目的において、次の行為のうちどれがアイオワ州居住者であることを示しますか？
  choices:
    A: アイオワ州のホテルに2週間滞在する
    B: 子供をアイオワ州の公立学校に入学させる
    C: 夏の間、アイオワ州の親戚を訪ねる
    D: 大陸横断のロードトリップでアイオワ州を通過する
  answer: B
  explanation: 免許取得の目的でアイオワ州居住者とみなされる基準の一つに、「子供をアイオワ州の公立学校に入学させた」場合があります。
- id: 9
  category: license_system
  question: 運転免許取得の目的において、アイオワ州の居住権を確立する基準は次のうちどれですか？
  choices:
    A: この州で有権者登録（選挙人登録）をする
    B: アイオワ州で2週間の短期の仕事に就く
    C: アイオワ州でレンタカーを借りる
    D: アイオワ州で開催される週末の会議に出席する
  answer: A
  explanation: マニュアルには、運転免許取得の目的でアイオワ州居住者となる条件の一つとして、「この州で有権者登録をしている」ことが挙げられています。
- id: 10
  category: license_system
  question: 軍用車両を運転する際、どのような条件下であればアイオワ州の運転免許証は必要ありませんか？
  choices:
    A: 米軍の退役軍人である場合
    B: 米軍の任務中に軍用車両を運転している場合
    C: パレードのために軍用車両を運転している場合
    D: 軍事基地で働く民間請負業者である場合
  answer: B
  explanation: マニュアルには、「米軍の任務中に軍用車両を運転している」場合は、運転免許証は必要ないと記載されています。
- id: 11
  category: license_system
  question: 自宅の農場と近隣の農地の間で農機具を運転する場合、何マイル以内の距離であればアイオワ州の運転免許証は必要ありませんか？
  choices:
    A: 2マイル
    B: 5マイル
    C: 10マイル
    D: 15マイル
  answer: A
  explanation: マニュアルには、「自宅の農場と、2マイル以内にある近隣の農地または農業施設との間で農機具を運転する場合」は免許証を必要としないと記載されています。
- id: 12
  category: license_system
  question: アイオワ州の訪問者または学生である場合、運転するためにアイオワ州の運転免許証が必要ですか？
  choices:
    A: はい、30日以内にアイオワ州の免許を取得しなければなりません
    B: はい、滞在期間が1週間未満である場合を除き必要です
    C: いいえ、出身州または出身国の有効な免許証で運転している限り必要ありません
    D: いいえ、ただし一時的な訪問者用運転許可証を取得する必要があります
  answer: C
  explanation: 「訪問者または学生としてアイオワ州に滞在している間、出身州または出身国の有効な免許証で運転している場合」は、アイオワ州の運転免許証は必要ありません。
- id: 13
  category: alcohol_drugs_health
  question: アルコールと運転に関するマニュアルの基本的な安全規則の中で、明示的に記載されているものはどれですか？
  choices:
    A: しらふで運転する（Drive sober）
    B: 血中アルコール濃度（BAC）を0.08%未満にしなければならない
    C: 運転前4時間以内は飲酒してはならない
    D: 飲酒が1杯以下の場合のみ運転する
  answer: A
  explanation: 「運転者への重要なメッセージ」のセクションでは、基本的な安全規則の一つとして「しらふで運転する（Drive sober）」が挙げられています。
- id: 14
  category: license_system
  question: どのような種類の援助を受けている場合、運転免許制度上のアイオワ州居住者とみなされますか？
  choices:
    A: 連邦学生ローン
    B: アイオワ州からの公的扶助
    C: 社会保障給付
    D: メディケア（高齢者医療保険）給付
  answer: B
  explanation: 「アイオワ州から公的扶助を受けている」場合、運転免許の目的においてアイオワ州居住者とみなされます。
- id: 15
  category: license_system
  question: アイオワ州の運転免許証を所持する必要がない条件はどれですか？
  choices:
    A: 地元の企業のために商用配送トラックを運転している場合
    B: 自宅の農場と2マイル以内にある農地の間で農機具を運転している場合
    C: 公道でモペッド（原動機付自転車）を運転している場合
    D: 高校へ通学するために自家用車を運転している場合
  answer: B
  explanation: マニュアルによると、自宅の農場と2マイル以内にある近隣の農地または農業施設との間で農機具を運転している場合は、運転免許証は必要ありません。
- id: 16
  category: driver_responsibility
  question: アイオワ州で車両を運転する際、運転者はどのような書類を携帯しなければなりませんか？
  choices:
    A: 免許証、出生証明書、および車両所有権証（タイトル）
    B: 社会保障カード、免許証、および登録証明書
    C: 免許証または許可証、最新の登録証明書、および保険証
    D: 保険証、車両所有権証（タイトル）、およびパスポート
  answer: C
  explanation: アイオワ州の車両運転者は、賠償責任保険の証明として、免許証または許可証、最新の登録証明書、および保険証（印刷物または電子データ）を携帯しなければなりません。
- id: 17
  category: penalties_and_points
  question: 運転中に免許証、登録証明書、および保険証を携帯していなかった場合に起こりうる結果は何ですか？
  choices:
    A: 直ちに1年間の免許取り消し
    B: 罰金および車両の押収の可能性
    C: 義務的な安全運転講習の受講
    D: 社会奉仕活動および書面による警告
  answer: B
  explanation: 免許証、最新の登録証明書、および保険証を携帯していない場合、罰金が科されたり、車両が押収されたりする可能性があります。
- id: 18
  category: driver_testing
  question: アイオワ州の運転免許を申請する際、義務付けられている健康診断はどれですか？
  choices:
    A: 聴力検査
    B: 体力測定
    C: 視力検査
    D: 医師による健康診断書
  answer: C
  explanation: 免許を申請する際、視力検査を受けることが義務付けられています。
- id: 19
  category: signs_and_signals
  question: 青色の交通標識はどのような情報を提供しますか？
  choices:
    A: 道路上の危険に関する一般的な警告
    B: 史跡や公園への案内
    C: 休憩所、病院、宿泊施設などの旅行者向けサービス
    D: 施行されている法律や条例に関する情報
  answer: C
  explanation: 青色の標識は旅行者向けのサービスを示し、休憩所、観光地、病院、宿泊施設、ガソリンスタンド、レストランなどの場所を案内します。
- id: 20
  category: signs_and_signals
  question: 蛍光ピンクの交通標識は何を示していますか？
  choices:
    A: 歩行者および学校に関する警告
    B: 事故処理や破片の撤去などの事案管理
    C: 道路工事および一時的な交通規制
    D: レクリエーションおよび文化的な名所
  answer: B
  explanation: 蛍光ピンクの標識は、事故処理、破片の撤去、交通規制などの事案管理（インシデント・マネジメント）のための警告および案内標識です。
- id: 21
  category: signs_and_signals
  question: 道路の左側に設置されているペナント型（横向きの三角形）の交通標識は、ドライバーに何を警告していますか？
  choices:
    A: この先に踏切があること。
    B: スクールゾーンであること。
    C: 追い越し禁止区間であること。
    D: 譲れ（徐行）の義務があること。
  answer: C
  explanation: ペナント型の標識は道路の左側に設置され、追い越し禁止区間であることを警告します。
- id: 22
  category: safe_driving_rules
  question: 速度制限標識に表示されている最高速度制限は、どのような状況を想定していますか？
  choices:
    A: 理想的な運転条件。
    B: 濡れた路面や滑りやすい路面状況。
    C: 交通渋滞時。
    D: 夜間の運転のみ。
  answer: A
  explanation: 最高速度制限は、理想的な運転条件を想定したものです。路面が滑りやすい場合や視界が悪い場合など、状況に応じて速度を落とさなければなりません。
- id: 23
  category: signs_and_signals
  question: 赤い円と赤い斜線がシンボルの上に描かれた規制標識は何を意味していますか？
  choices:
    A: シンボルに示された車両に道を譲らなければならない。
    B: シンボルで示された行為をしてはいけない。
    C: シンボルに関連する危険に近づいている。
    D: この先通行止めである。
  answer: B
  explanation: 一部の規制標識には、赤い円と赤い斜線がシンボルの上に描かれています。これらは、左折禁止、右折禁止、Uターン禁止など、何かをしてはいけないことを示しています。
- id: 24
  category: safe_driving_rules
  question: 一時停止標識（STOP sign）に近づいた際、停止線がある場合はどうしなければなりませんか？
  choices:
    A: 減速し、交差点に車がいなければ停止線を越えて進む。
    B: 進む前に、停止線で完全に停止する。
    C: 交差する交通がある場合のみ停止する。
    D: 交通状況をよく確認するために、停止線を越えて停止する。
  answer: B
  explanation: 一時停止標識は、完全に停止しなければならないことを意味します。停止線がある場合はその位置で停止し、安全が確認できたら必要に応じて前進します。
- id: 25
  category: safe_driving_rules
  question: この先に坂道があることを示すひし形の警戒標識を見たとき、どうすべきですか？
  choices:
    A: 坂を下る速度を維持するために加速する。
    B: ギアをニュートラルに入れる。
    C: 坂を下り始める前にブレーキを点検する。
    D: 路肩に寄せて、大型車が通り過ぎるのを待つ。
  answer: C
  explanation: 坂道の標識は、この先の道が下り坂であることを警告しています。マニュアルでは、坂を下り始める前にブレーキを点検すべきであるとされています。
- id: 26
  category: sharing_the_road
  question: 馬車や農耕器具の警戒標識を見たとき、どのように対応すべきですか？
  choices:
    A: 自分の存在を知らせるためにクラクションを鳴らす。
    B: 速度を維持して素早く追い越す。
    C: 速度を落とし、ゆっくりと追い越す。
    D: 車を停止させ、相手が路肩に寄るのを待つ。
  answer: C
  explanation: 馬車や農耕器具の標識を見たときは、路上を走る低速車両に注意し、速度を落としてゆっくりと追い越さなければなりません。
- id: 27
  category: sharing_the_road
  question: 2024年のアイオワ州交通法改正によると、次のうち「歩行者用輸送用具（pedestrian conveyance）」とみなされるものはどれですか？
  choices:
    A: 馬車。
    B: 農用トラクター。
    C: 低速モーターサイクル。
    D: 車椅子、ベビーカー、自転車などの人力の装置。
  answer: D
  explanation: 歩行者用輸送用具は、車椅子、ベビーカー、自転車、スケートボード、スクーター、電動パーソナル移動補助装置など、歩行者が移動するためのあらゆる人力装置と定義されています。
- id: 28
  category: sharing_the_road
  question: 横断歩道でスケートボード、スクーター、または電動パーソナル移動補助装置を使用している人に対し、ドライバーはどのように接しなければなりませんか？
  choices:
    A: ドライバーはこれらの装置に対して優先権を持つ。
    B: 徒歩の歩行者と同様に、彼らに道を譲らなければならない。
    C: その人が18歳未満の場合のみ道を譲ればよい。
    D: 横断歩道からどくようにクラクションを鳴らして警告すべきである。
  answer: B
  explanation: 2024年の法律では、車両は徒歩の歩行者および「歩行者用輸送用具」（スケートボード、スクーターなどを含む）を使用している者に対して、優先権を譲らなければならないと定められています。
- id: 29
  category: signs_and_signals
  question: 車両の後部にある反射材のオレンジ色の三角形は何を示していますか？
  choices:
    A: 車両が危険物を運搬していること。
    B: 車両が時速35マイル（約56km/h）以下で走行していること。
    C: 車両が緊急車両であること。
    D: 車両が故障して動けないこと。
  answer: B
  explanation: 車両後部の反射材のオレンジ色の三角形は、時速35マイル以下で走行する低速車両であることを意味します。道路維持装置や農耕車両によく見られます。
- id: 30
  category: signs_and_signals
  question: 州間高速道路（Interstate）のマイルマーカーは、具体的にどのような情報を提供していますか？
  choices:
    A: 現在の区間の制限速度。
    B: 次の休憩所までのマイル数。
    C: その州間高速道路のルートが州に入った地点からのマイル数。
    D: 最寄りの病院までの距離。
  answer: C
  explanation: マイルマーカーは、走行中の州にその州間高速道路のルートが入った地点からの距離（マイル）を示しており、緊急時に正確な現在地を伝えるために使用できます。
- id: 31
  category: signs_and_signals
  question: 赤の点滅信号に対して、ドライバーはどのように対応すべきですか？
  choices:
    A: 対向車に道を譲り、停止せずに進む
    B: 一時停止標識と同じように扱う
    C: 停止し、信号が青になるのを待つ
    D: 停止せずに注意して進む
  answer: B
  explanation: マニュアルによると、赤の点滅信号に遭遇した場合は、一時停止標識と同じように扱わなければなりません。
- id: 32
  category: signs_and_signals
  question: 左折するドライバーにとって、黄色の矢印の点滅は何を意味しますか？
  choices:
    A: 対向車が停止しなければならないため、自分に優先権がある
    B: 完全に停止し、青の矢印信号を待たなければならない
    C: 対向車や歩行者に道を譲り、注意して左折する
    D: 信号が故障しているため、4方向一時停止（four-way stop）として扱わなければならない
  answer: C
  explanation: 黄色の矢印の点滅は、対向車が青信号であるため、対向車や歩行者に道を譲り、その後注意して左折しなければならないことを意味します。
- id: 33
  category: signs_and_signals
  question: 黄色の点灯信号に近づいた際の適切な行動は何ですか？
  choices:
    A: 赤になる前に交差点を通過できるよう加速する
    B: 交差点の途中にいても、直ちに停止する
    C: 安全に停止できる場合は、交差点に進入しない
    D: 譲れ（yield）の標識として扱い、進む
  answer: C
  explanation: 黄色の点灯信号のルールは、安全に停止できる場合は交差点に進入しないというものです。安全に停止できない場合は、注意して交差点を通過してください。
- id: 34
  category: safe_driving_rules
  question: 線路を横断する前に、線路から15〜50フィート（約4.5〜15メートル）以内で停止しなければならない車両は次のうちどれですか？
  choices:
    A: ボートを牽引している乗用車
    B: UberやLyftなど、報酬を得て乗客を運んでいるドライバー
    C: オートバイ
    D: 危険物ではない荷物を運んでいる配送バン
  answer: B
  explanation: すべてのスクールバス、チャーターバス、報酬を得て乗客を運ぶドライバー（UberやLyftなど）、および危険物の表示（プラカード）がある車両は、横断前に線路から15〜50フィート以内で停止しなければなりません。
- id: 35
  category: safe_driving_rules
  question: 線路内で車両がエンスト（ストール）した場合、まず何をすべきですか？
  choices:
    A: 車内にとどまり、エンジンの再始動を試みる
    B: ギアを入れ、車両を線路外へ押し出そうとする
    C: 電車が見えなくても、直ちに全員を車外に出し、遠くへ避難させる
    D: 地元のレッカー会社に電話する
  answer: C
  explanation: 踏切で車両が動かなくなったりエンストしたりした場合は、電車が見えなくても、直ちに全員を車外に出し、遠くへ避難させなければなりません。
- id: 36
  category: signs_and_signals
  question: 踏切で車両が動かなくなった際に連絡すべき緊急電話番号は、どこに記載されていますか？
  choices:
    A: 反射材付きのオレンジ色の三角表示板
    B: 青と白の緊急通知システム（ENS）の標識
    C: クロスバック（十字型）標識の裏側
    D: 最寄りのマイルマーカー
  answer: B
  explanation: 青と白の緊急通知システム（ENS）の標識には、車両が線路上で動かなくなったりエンストしたりした場合に最初にかけるべき電話番号と、踏切のID番号が記載されています。
- id: 37
  category: signs_and_signals
  question: 受動的保護（passively protected）がなされている踏切は、どのように標示されていますか？
  choices:
    A: 赤の点滅信号と遮断機
    B: クロスバック（十字型）標識と、一時停止または譲れ（yield）の標識
    C: 赤の点灯信号
    D: 青と白のENS標識のみ
  answer: B
  explanation: 受動的保護がなされている踏切には、信号機や遮断機がありません。これらはクロスバック標識と、一時停止または譲れ（yield）の標識のみで標示されます。
- id: 38
  category: safe_driving_rules
  question: 踏切で停止する際、車両と最も近いレールとの間に空けるべき最小距離はどれくらいですか？
  choices:
    A: 5フィート
    B: 10フィート
    C: 15フィート
    D: 50フィート
  answer: C
  explanation: 踏切で停止する際は、車両の前後と最も近いレールの間に、少なくとも15フィートの距離を空けなければなりません。
- id: 39
  category: safe_driving_rules
  question: 複数の線路を横断する際に注意すべき特定の危険は何ですか？
  choices:
    A: 複数の線路がある場所では制限速度が下がる
    B: 複数の線路がある場合、複数の電車が来る可能性がある
    C: 複数の線路を横断している最中にギアチェンジをしなければならない
    D: 各線路ごとに停止することが義務付けられている
  answer: B
  explanation: 複数の線路がある場合は、複数の電車が来る可能性があります。進む前に、両方向の線路の先がはっきりと見えることを確認しなければなりません。
- id: 40
  category: signs_and_signals
  question: ドライバーは、走行中の道路の種類（州間高速道路や郡道など）をどのように識別できますか？
  choices:
    A: マイルマーカーの色
    B: 路線標識（ルートサイン）の形
    C: サービス標識の有無
    D: 掲示されている制限速度
  answer: B
  explanation: 路線標識の形は、それが州間高速道路（interstate）、国道（U.S. highway）、アイオワ州道（Iowa route）、郡道（county
    road）など、どの種類の道路であるかを示しています。
- id: 41
  category: signs_and_signals
  question: 点灯している緑色の矢印信号は何を示していますか？
  choices:
    A: 交差点を直進してもよい
    B: 曲がる前に対向車に道を譲らなければならない
    C: ドライバーは右左折を進めることができ、対向車は停止しなければならない
    D: 信号がまもなく赤に変わる
  answer: C
  explanation: 点灯している緑色の矢印は、ドライバーが左折または右折を進めることができ、対向車は停止しなければならないことを意味します。矢印の方向にのみ進む必要があります。
- id: 42
  category: safe_driving_rules
  question: 通常、踏切での一時停止が義務付けられている車両が、停止せずに進むことができるのはどのような場合ですか？
  choices:
    A: 踏切に「EXEMPT（免除）」の標識がある場合
    B: ドライバーが遅刻しそうな場合
    C: 踏切が受動的に保護されている（遮断機などがない）場合
    D: 列車は見えているが、ゆっくり動いている場合
  answer: A
  explanation: 通常停止が義務付けられている車両でも、警察官や道路交通信号が進行を指示している場合、または踏切に「EXEMPT（免除）」の標識がある場合は、停止する必要はありません。
- id: 43
  category: signs_and_signals
  question: 道路工事区域（ワークゾーン）で使用される標識や警告装置の基本色は何色ですか？
  choices:
    A: 赤
    B: オレンジ
    C: 黄色
    D: 蛍光グリーン
  answer: B
  explanation: オレンジ色は、工事区域における標識や警告装置の基本色です。
- id: 44
  category: penalties_and_points
  question: 道路工事区域（ワークゾーン）で違反を犯した場合、交通違反の罰金はどうなる可能性がありますか？
  choices:
    A: 初犯の場合は免除される
    B: 通常の区域と同じままである
    C: 2倍になる可能性がある
    D: 作業員がいない場合は減額される
  answer: C
  explanation: マニュアルには、工事区域内では罰金が2倍になる可能性があるため、注意を怠らず慎重に運転するように記載されています。
- id: 45
  category: signs_and_signals
  question: 路面に描かれた白線は何を示していますか？
  choices:
    A: 反対方向に進む交通を区分している
    B: 同じ方向に進む交通を区分している
    C: 追い越し禁止区間を示している
    D: 共有左折車線を示している
  answer: B
  explanation: 白線は同じ方向に進む交通を区分します。黄色の線は反対方向に進む交通を区分します。
- id: 46
  category: signs_and_signals
  question: 路面の譲れ（Yield）ラインはどのように表示されていますか？
  choices:
    A: 接近する車両に向かって尖っている、一列の白い塗りつぶされた三角形
    B: 車線を横切る2本の黄色い実線
    C: 交差点を横切る1本の太い白線
    D: 一連の白い破線の四角形
  answer: A
  explanation: 譲れ（Yield）ラインは、車両がどこで道を譲るべきかを示すために、接近する車両に向かって尖っている一列の白い塗りつぶされた三角形で構成されています。
- id: 47
  category: signs_and_signals
  question: リバーシブルレーン（時間帯により通行方向が変わる車線）を走行中、黄色の「X」の点滅は何を意味しますか？
  choices:
    A: その車線を使用してはいけない
    B: 車線の運用が変更されるため、車線から出なければならない
    C: その車線は左折専用である
    D: 追い越しのためにのみその車線を使用できる
  answer: C
  explanation: リバーシブルレーンにおいて、黄色の「X」の点滅は、その車線が左折専用であることを意味します。
- id: 48
  category: signs_and_signals
  question: リバーシブルレーンの上にある、点灯している黄色の「X」は何を示していますか？
  choices:
    A: その車線は通常の走行のために開放されている
    B: その車線は高乗車人数車両（HOV）専用である
    C: その車線は左折専用である
    D: 車線の運用が変更されるため、安全に車線から出なければならない
  answer: D
  explanation: 点灯している黄色の「X」は、車線の運用が変更されることを意味しており、安全が確認でき次第、速やかにその車線から出なければなりません。
- id: 49
  category: safe_driving_rules
  question: 共有左折車線（Shared left-turn lanes）に関して、次のうち正しいものはどれですか？
  choices:
    A: 遅い車両を追い越すために使用できる
    B: どちらの方向からの左折にも使用される
    C: 2本の白い実線でマークされている
    D: 高乗車人数車両（HOV）のみが使用できる
  answer: B
  explanation: 共有左折車線は、どちらの方向からでも左折を行う車両のために予約されており、追い越しに使用することはできません。
- id: 50
  category: defensive_driving
  question: 同じ方向に3車線以上ある道路で、合流してくる交通量が多い場合、どの車線を使用するのが最適ですか？
  choices:
    A: 一番左の車線
    B: 中央の車線
    C: 一番右の車線
    D: 路肩
  answer: B
  explanation: 3車線以上ある道路で、合流してくる交通量が多い場合は、中央の車線を使用するのが最適です。
- id: 51
  category: safe_driving_rules
  question: 路肩を通行して車両を追い越すことが許可されるのはどのような時ですか？
  choices:
    A: 前の車が左折するとき。
    B: 路肩が舗装されているとき。
    C: 路肩が舗装されているかどうかにかかわらず、決してない。
    D: 渋滞が1マイル以上続いているとき。
  answer: C
  explanation: 路肩が舗装されているかどうかにかかわらず、決して路肩で追い越しをしてはいけません。他のドライバーはあなたがそこにいることを想定しておらず、確認せずに道路から外れる可能性があるからです。
- id: 52
  category: sharing_the_road
  question: 運転者が指定された自転車専用レーンを走行できるのはどのような時ですか？
  choices:
    A: 低速車両を追い越すとき。
    B: 右左折の動作を行うとき。
    C: 隣接する車線が塞がっているとき。
    D: 運転者が自転車専用レーンに入ることは決して許可されない。
  answer: B
  explanation: 運転者が自転車専用レーンを走行できるのは、右左折の動作を行うときのみであり、自車の横や後ろに自転車がいないか注意深く確認しなければなりません。
- id: 53
  category: sharing_the_road
  question: 緑色に塗装された自転車専用レーンに遭遇した際、運転者はどうすべきですか？
  choices:
    A: 緑色の路面で停止し、自転車がいないか確認する。
    B: 緑色の路面を共有の右左折車線として使用する。
    C: 横断する前に自転車がいないか確認し、緑色の路面の上で停止しない。
    D: 交差点内に現在自転車がいる場合にのみ譲る。
  answer: C
  explanation: 自転車専用レーンは緑色に塗装されている場合があり、運転者は細心の注意を払い、緑色の路面を横断する前に自転車がいないか確認する必要があります。また、運転者は緑色の路面の上で停止してはいけません。
- id: 54
  category: sharing_the_road
  question: 「シャロウズ（sharrows）」としても知られる共有車線路面標示の目的は何ですか？
  choices:
    A: 道路の一部を自転車専用として指定するため。
    B: 運転者に自転車の存在を知らせ、安全な追い越しを促すため。
    C: 自転車が歩行者のために停止しなければならない場所を示すため。
    D: 高乗車人数車（HOV）専用の車線をマークするため。
  answer: B
  explanation: 共有車線路面標示（シャロウズ）は、運転者に自転車の存在を知らせ、安全な追い越しを促し、自転車の逆走を減らすためのものです。自転車専用レーンとは異なり、自転車の独占使用を指定するものではありません。
- id: 55
  category: signs_and_signals
  question: 歩行者用ハイブリッドビーコン（Pedestrian Hybrid Beacon）に接近した際、上部の2つの赤色灯が点灯（ソリッド）に変わったら、運転者はどうしなければなりませんか？
  choices:
    A: 注意して進む。
    B: 減速して停止の準備をする。
    C: 歩行者のために停止する。
    D: 停止した後、歩行者がいてもすぐに進む。
  answer: C
  explanation: 歩行者用ハイブリッドビーコンの上部2つの赤色灯が点灯した場合、運転者は歩行者のために停止しなければなりません。
- id: 56
  category: sharing_the_road
  question: 運転者は、視覚障害のある歩行者をどのように識別できますか？
  choices:
    A: 蛍光イエローのベストを着用している。
    B: 白い杖、または先端が赤色の白い杖を持って歩いている。
    C: 赤い旗を持っている。
    D: 指定されたバイシクル・ボックス内を歩いている。
  answer: B
  explanation: ハーネスを装着した補助犬に導かれているか、白い杖、または先端が赤色の白い杖を持って歩いている人は、視覚障害がある可能性が高いです。
- id: 57
  category: signs_and_signals
  question: 高乗車人数車（HOV）などの特殊車両用の専用車線は、通常どのようにマークされていますか？
  choices:
    A: 道路の脇に掲示された、および/または路面に描かれた白いひし形。
    B: 車線を横切って描かれた緑色の実線。
    C: 車線の上に設置された黄色の点滅する「X」。
    D: 接近する車両に向かって並んでいる白い実線の三角形。
  answer: A
  explanation: 専用車線は、その車線が特殊な用途のために予約されていることを示す標識によってマークされており、多くの場合、道路の脇に掲示された、および/または路面に描かれた白いひし形（ホワイト・ダイヤモンド）があります。
- id: 58
  category: safe_driving_rules
  question: アイオワ州の運転教本によると、優先権（通行権）に関して正しいものは次のうちどれですか？
  choices:
    A: 法律は、より大きな車両に優先権を与えている。
    B: 法律は、誰が優先権を譲らなければならないかを定めているが、誰にも優先権を与えてはいない。
    C: 法律は、最も速く走行している車両に優先権を与えている。
    D: 法律は、歩行者が緊急車両よりも常に優先権を持つと定めている。
  answer: B
  explanation: 教本には、「法律は誰が優先権を譲らなければならないかを定めていますが、誰かに優先権を与えるものではありません」と記されています。
- id: 59
  category: safe_driving_rules
  question: アイオワ州における交通関連の死亡事故の最大の原因は何ですか？
  choices:
    A: 酒気帯び運転（DUI）
    B: スピード違反
    C: 優先権（通行権）の譲歩不履行
    D: 脇見運転（不注意運転）
  answer: C
  explanation: 教本によると、優先権（通行権）の譲歩不履行がアイオワ州における交通関連の死亡事故の第1の原因です。
- id: 60
  category: safe_driving_rules
  question: 2台の車両が全く同時に全方向一時停止（all-way stop）の交差点に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側の車両が先に進むことができる。
    B: 右側の車両が先に進むことができる。
    C: 直進する車両が先に進むことができる。
    D: 右折する車両が先に進むことができる。
  answer: B
  explanation: 全方向一時停止において、複数の車両が同時に到着した場合、右側の車両が先に進むことができます。
- id: 61
  category: safe_driving_rules
  question: 交差点内で緊急車両が接近しているのを見たり聞いたりした場合、どうすべきですか？
  choices:
    A: 交差点の真ん中ですぐに停止する。
    B: 交差点の右端に寄せて停止する。
    C: 交差点を通り抜けてから、右側に寄せる。
    D: 加速して交差点を抜け、通常通り運転を続ける。
  answer: C
  explanation: 交差点（ラウンドアバウトを含む）内にいる場合は、緊急車両のために路肩に寄せる前に、まず交差点を通り抜けなければなりません。
- id: 62
  category: safe_driving_rules
  question: 赤色灯とサイレンを使用している緊急車両の背後を走行する場合、最低でもどれくらいの距離を保たなければなりませんか？
  choices:
    A: 最低100フィート
    B: 最低250フィート
    C: 最低300フィート
    D: 最低500フィート
  answer: D
  explanation: マニュアルでは、赤色灯とサイレンを使用している緊急車両の背後を走行する際、最低500フィートの距離を保つことが義務付けられています。
- id: 63
  category: safe_driving_rules
  question: 2車線の道路で前方から来るスクールバスに遭遇し、黄色の警告灯が点滅しているのを見た場合、どうすべきですか？
  choices:
    A: 速度を維持し、注意深く追い越す。
    B: 時速20マイル（20 mph）以下に減速し、停車の準備をする。
    C: ストップアーム（停止表示板）に関わらず、すぐに停止する。
    D: 路肩に寄せてエンジンを切る。
  answer: B
  explanation: 2車線または3車線の道路で前方から来るバスに遭遇し、黄色の警告灯が点滅しているのを見た場合は、時速20マイル以下に減速し、停車の準備をしなければなりません。
- id: 64
  category: safe_driving_rules
  question: 4車線以上の道路を走行中、反対方向から来たスクールバスが赤色灯を点滅させ、ストップアームを出して停車している場合、どうすべきですか？
  choices:
    A: 停止し、ストップアームが格納されるまで待たなければならない。
    B: 時速15マイルまで減速しなければならない。
    C: 停止する必要はない。
    D: 停止した後、注意して進まなければならない。
  answer: C
  explanation: 4車線以上の道路で、反対側の2車線（またはそれ以上）のいずれかを走行中にバスと遭遇した場合、バスが赤色灯を点滅させストップアームを出して停車していても、停止する必要はありません。
- id: 65
  category: penalties_and_points
  question: アイオワ州でスクールバスの停止義務違反をした場合の罰則は何ですか？
  choices:
    A: 初回違反は警告のみ。
    B: 免許が最大180日間停止される可能性がある。
    C: 免許が永久に取消される。
    D: 30日間の強制的な禁錮刑。
  answer: B
  explanation: スクールバスの停止義務違反は、免許が最大180日間停止される結果を招く可能性があります。
- id: 66
  category: safe_driving_rules
  question: 縁石のある道路で駐車する場合、縁石からどのくらいの距離以内に駐車しなければなりませんか？
  choices:
    A: 6インチ以内
    B: 12インチ以内
    C: 18インチ以内
    D: 24インチ以内
  answer: C
  explanation: 縁石がある場合、車両を縁石から18インチ以内に駐車しなければなりません。
- id: 67
  category: safe_driving_rules
  question: 消火栓からどのくらいの距離まで駐車が許可されていますか？
  choices:
    A: 5フィートより近くに駐車してはならない。
    B: 10フィートより近くに駐車してはならない。
    C: 15フィートより近くに駐車してはならない。
    D: 20フィートより近くに駐車してはならない。
  answer: A
  explanation: 消火栓から5フィート以内、または指定された消火栓レッドゾーンに駐車することはできません。
- id: 68
  category: safe_driving_rules
  question: アイオワ州の「車線変更または減速法（Move Over or Slow Down Law）」に基づき、ハザードランプを点灯させて停車している乗用車に接近し、安全に車線変更ができない場合はどうすべきですか？
  choices:
    A: 走行車線ですぐに停止する。
    B: 速度を維持するが、クラクションを鳴らす。
    C: 減速し、停車の準備をする。
    D: 加速して素早く車両を追い越す。
  answer: C
  explanation: 点滅灯をつけた停車車両に接近する際、車線変更が不可能、法律で禁止されている、または安全でない場合は、減速して停車の準備をしなければなりません。
- id: 69
  category: penalties_and_points
  question: アイオワ州の「車線変更または減速法（Move Over or Slow Down Law）」に違反した場合の最大免許停止期間はどれくらいですか？
  choices:
    A: 30日間
    B: 90日間
    C: 180日間
    D: 1年間
  answer: D
  explanation: アイオワ州の「車線変更または減速法」に違反すると、免許が最大1年間停止される可能性があります。
- id: 70
  category: safe_driving_rules
  question: 「ステア・イット・クリア・イット（Steer It-Clear It）」法によると、負傷者のいない事故に遭い、車両が走行可能な場合、何をすることが義務付けられていますか？
  choices:
    A: 警察が到着するまで、車両をそのままの場所に置いておく。
    B: 車両を走行車線から外へ移動させる。
    C: レッカー車が車両を移動させるのを待つ。
    D: 車両を移動させる前に保険情報を交換する。
  answer: B
  explanation: 負傷者のいない事故に遭った場合、車両が走行可能で安全に移動できるのであれば、車両を走行車線から外へ移動させることがアイオワ州法で義務付けられています。
- id: 71
  category: vehicle_information
  question: 乗用車やトラックには、いくつの独立したブレーキシステムが必要ですか？
  choices:
    A: 1つ
    B: 2つ
    C: 3つ
    D: 4つ
  answer: B
  explanation: 乗用車、トラック、およびATV/UTVには、フットブレーキとパーキングブレーキの2つの独立したブレーキシステムが必要です。
- id: 72
  category: sharing_the_road
  question: 自転車との道路の共有に関して、正しいものはどれですか？
  choices:
    A: 自転車は常に自動車に優先権を譲らなければならない。
    B: 運転者は、たとえ自転車側が譲るべき場面であっても、優先権を譲る準備をしておくべきである。
    C: 自転車は衝突事故において脆弱とはみなされない。
    D: 自転車には、自動車の運転者と同じ権利や責任はない。
  answer: B
  explanation: マニュアルでは、自転車は車両に対して身を守る手段を持たないため、「たとえ自転車があなたに道を譲るべき時であっても、優先権を譲る準備をしておくこと」とアドバイスしています。
- id: 73
  category: vehicle_information
  question: 車両後部の赤色灯は、どのくらい離れた場所から見える必要がありますか？
  choices:
    A: 少なくとも100フィート
    B: 少なくとも200フィート
    C: 少なくとも300フィート
    D: 少なくとも500フィート
  answer: D
  explanation: 車両の後部には少なくとも1つの赤色灯が必要であり、それは少なくとも500フィート離れた場所から見える必要があります。
- id: 74
  category: vehicle_information
  question: 車両のライトのレンズに付着した汚れは、その効果を最大で何パーセント低下させる可能性がありますか？
  choices:
    A: 10パーセント
    B: 25パーセント
    C: 50パーセント
    D: 75パーセント
  answer: C
  explanation: マニュアルによると、レンズの汚れはライトの効果を50パーセント低下させる可能性があります。
- id: 75
  category: vehicle_information
  question: アイオワ州の法律において、着色されたフロントガラスおよび前部サイドウィンドウは、最低何パーセントの光を透過させる必要がありますか？
  choices:
    A: 30パーセント
    B: 50パーセント
    C: 70パーセント
    D: 90パーセント
  answer: C
  explanation: アイオワ州の法律では、フロントガラスおよび運転席のすぐ右側または左側の窓は、少なくとも70パーセントの光を透過させることが義務付けられています。
- id: 76
  category: vehicle_information
  question: タイヤの空気圧をチェックするのに最適な時期はいつですか？
  choices:
    A: 長距離運転の直後
    B: タイヤが冷えているとき
    C: タイヤが温まっているとき
    D: エンジンがかかっている間
  answer: B
  explanation: マニュアルでは、タイヤが冷えているときに空気圧計を使用してタイヤの空気圧をチェックすることを推奨しています。
- id: 77
  category: safe_driving_rules
  question: 閉め切ったガレージでエンジンをかけたままにすることが危険なのはなぜですか？
  choices:
    A: 車両のバッテリーが消耗するため
    B: エンジンがすぐにオーバーヒートする可能性があるため
    C: 排気漏れによるガスが、非常に短時間で死に至らしめる可能性があるため
    D: サスペンションシステムが故障する原因となるため
  answer: C
  explanation: マニュアルでは、排気漏れによるガスが非常に短時間で死に至らしめる可能性があると警告しており、ガレージ内でエンジンをかけたままにしてはいけません。
- id: 78
  category: vehicle_information
  question: バックミラーを使用して、車両の後方どのくらいまで見える必要がありますか？
  choices:
    A: 少なくとも50フィート
    B: 少なくとも100フィート
    C: 少なくとも200フィート
    D: 少なくとも500フィート
  answer: C
  explanation: バックミラーで後方少なくとも200フィートが見える必要があります。
- id: 79
  category: safe_driving_rules
  question: 胸とステアリングホイール（ハンドル）の間の推奨される最小距離はどれくらいですか？
  choices:
    A: 5インチ
    B: 10インチ
    C: 15インチ
    D: 20インチ
  answer: B
  explanation: 座席を調整する際、ステアリングホイールと胸の間には少なくとも10インチの距離を空け、エアバッグが胸を向くようにする必要があります。
- id: 80
  category: safe_driving_rules
  question: ヘッドレスト（頭部後傾抑止装置）は、運転者に対してどの位置に配置すべきですか？
  choices:
    A: 首の付け根の位置
    B: 運転者の頭の中心の位置
    C: 運転者の頭の頂点より上の位置
    D: 運転者の肩に触れる位置
  answer: B
  explanation: マニュアルには、ヘッドレストは運転者の頭の中心に位置させるべきであると記載されています。
- id: 81
  category: defensive_driving
  question: 左側のサイドミラーを正しく調整するために、どのような姿勢をとるべきですか？
  choices:
    A: 運転席にまっすぐ座る
    B: 車のセンターコンソールの上に身を乗り出して右に傾く
    C: 頭を左側の窓の方へ傾ける
    D: 後方の窓から外を見るために頭を回す
  answer: C
  explanation: 左側のサイドミラーを調整するには、頭を左側の窓の方へ傾け、車の側面がわずかに見える程度にミラーをセットします。
- id: 82
  category: driver_testing
  question: 運転免許試験中に使用が許可されて「いない」先進運転支援システム（ADAS）は次のうちどれですか？
  choices:
    A: バック警告（後退時警告）
    B: ブラインドスポットモニター（死角監視）
    C: 車線維持支援（レーンキーピングアシスト）
    D: アダプティブ・クルーズ・コントロール（適応型巡航制御）
  answer: D
  explanation: 運転免許試験中、アダプティブ・クルーズ・コントロールのような車両の利便性を高める技術による支援を受けることはできません。これは許可されている支援システムの一覧で「不可」とされています。
- id: 83
  category: driver_testing
  question: 運転免許試験中に禁止されている車両利便技術は次のうちどれですか？
  choices:
    A: 自動縦列駐車
    B: 自動緊急ブレーキ
    C: 前方衝突警告
    D: 後退時車両検知警告（リア・クロス・トラフィック・アラート）
  answer: A
  explanation: 自動縦列駐車は、試験で許可されている支援システムの一覧で「不可」とされています。
- id: 84
  category: safe_driving_rules
  question: マニュアルによると、車両のクラクションの正しい使い方は何ですか？
  choices:
    A: 他のドライバーに挨拶するため
    B: 渋滞中の不満を表現するため
    C: 他者への警告としてのみ使用する
    D: 歩行者に道を渡るよう合図するため
  answer: C
  explanation: クラクションは重要な安全装置には見えないかもしれませんが、警告として使用することで命を救う可能性があります。他者への警告としてのみ使用すべきです。
- id: 85
  category: vehicle_information
  question: マニュアルでは、タイヤの溝の深さを確認するためにどの硬貨を使用することを推奨していますか？
  choices:
    A: 25セント硬貨（クォーター）
    B: 10セント硬貨（ダイム）
    C: 5セント硬貨（ニッケル）
    D: 1セント硬貨（ペニー）
  answer: D
  explanation: マニュアルでは、1セント硬貨（ペニー）を使ってタイヤの溝を確認することを推奨しています。溝がリンカーンの頭のてっぺんまで届かない場合は、そのタイヤは安全ではありません。
- id: 86
  category: defensive_driving
  question: 車両にバック警告システムが装備されている場合でも、後退する際に必ず行わなければならないことは何ですか？
  choices:
    A: 警告音だけに完全に頼る
    B: ミラーを確認し、肩越しに目視する
    C: 警告システムをオフにする
    D: 継続的にクラクションを鳴らす
  answer: B
  explanation: バック警告システムを使用する場合でも、サイドミラー、バックミラー、および肩越しの目視（ヘッドチェック）を含め、安全に監視および操作するために必要なすべての動作を行う必要があります。
- id: 87
  category: vehicle_information
  question: 車両のリアカメラは通常いつ作動しますか？
  choices:
    A: 車両の速度が時速10マイル（約16km/h）に達したとき
    B: ドライバーがギアをリバース（後退）に入れたとき
    C: 方向指示器（ウィンカー）が作動したとき
    D: 車両が駐車され、エンジンが切られたとき
  answer: B
  explanation: マニュアルによると、ドライバーがギアをリバースに入れると、車両後方のエリアを表示するためにリアカメラが作動します。
- id: 88
  category: vehicle_information
  question: サイドビューカメラは通常どのように作動させますか？
  choices:
    A: 車両のギアをリバースに入れる
    B: ブレーキペダルを強く踏む
    C: 方向指示器を使用するか、手動ボタンを押す
    D: 制限速度を超過する
  answer: C
  explanation: マニュアルには、方向指示器を使用するか、通常は方向指示器のレバーにあるボタンを操作することで、サイドビューカメラ機能を起動できると記載されています。
- id: 89
  category: vehicle_information
  question: サラウンドビューまたはアラウンドビューモニターシステムは、どのようにして車両の仮想的な俯瞰図（バードアイビュー）を作成しますか？
  choices:
    A: 衛星からのライブ映像を使用する
    B: 4つの広角カメラからの映像を処理する
    C: 屋根に取り付けられたレーダーセンサーを使用する
    D: 車両の上空に小型ドローンを飛ばす
  answer: B
  explanation: アラウンドビューモニターは、前方、後方、左側、右側にある4つの広角カメラからの映像を処理し、合成映像を1つの俯瞰図として表示します。
- id: 90
  category: vehicle_information
  question: 自転車、歩行者、および障害物の検知システムは、一般的にどの程度の速度で作動しますか？
  choices:
    A: 時速55マイル（約88km/h）以上の高速道路の速度
    B: 一般的に時速25マイル（約40km/h）程度の低速
    C: 車両が完全に停止しているときのみ
    D: 時速40マイルから60マイル（約64〜96km/h）の間
  answer: B
  explanation: これらの検知システムは、低速（一般的に時速25マイル程度）で走行中に障害物が検知されたときに警告を発します。
- id: 91
  category: defensive_driving
  question: 障害物検知システムを使用している際、警告音が連続音に変わった場合は何を意味しますか？
  choices:
    A: システムがオンになり、正常に機能している
    B: センサーの清掃が必要である
    C: 衝突が差し迫っている
    D: 障害物が安全な場所に移動した
  answer: C
  explanation: マニュアルによると、車両が障害物に近づくにつれてビープ音が速くなり、連続音になった場合は衝突が差し迫っていることを示します。
- id: 92
  category: vehicle_information
  question: カーブ速度警告システムは、車両の速度と位置を追跡するためにどのような技術を使用していますか？
  choices:
    A: 路面標示
    B: GPS
    C: 4つの広角カメラ
    D: 後方レーダーセンサー
  answer: B
  explanation: カーブ速度警告システムは、GPSを介して車両の速度と位置を追跡し、カーブや出口に近づく際に減速するよう警告します。
- id: 93
  category: vehicle_information
  question: 前方衝突警告システムは、運転者に代わって自動的にブレーキをかけますか？
  choices:
    A: はい、衝突を防ぐために常に自動でブレーキをかけます
    B: はい、ただし時速50マイル（約80km/h）以上の場合に限ります
    C: いいえ、警告だけでは自動的にブレーキはかかりません
    D: いいえ、障害物を避けるために車両の操舵のみを行います
  answer: C
  explanation: マニュアルには、前方衝突警告だけでは運転者に代わって自動的にブレーキがかかることはなく、衝突の危険を知らせるのみであると明記されています。
- id: 94
  category: vehicle_information
  question: 前方衝突警告システムは、前方の交通状況をどの程度の距離までスキャンしますか？
  choices:
    A: 最大100フィート（約30メートル）
    B: 最大250フィート（約76メートル）
    C: 最大500フィート（約152メートル）
    D: 最大1,000フィート（約305メートル）
  answer: C
  explanation: 前方衝突警告システムは、前方の交通状況を1秒間に20回、車両の前方最大500フィートまでスキャンします。
- id: 95
  category: safe_driving_rules
  question: 車両の高速アラートが鳴った場合、推奨される行動は何ですか？
  choices:
    A: すぐに急ブレーキをかけて減速する
    B: アクセルを離すか軽くブレーキをかけて、慎重に減速する
    C: インフォテインメントセンターの電源を切ってアラームを消す
    D: 路肩に寄せて停車する
  answer: B
  explanation: 警告音が鳴った場合は、アクセルを離すか軽くブレーキをかけて、掲示されている適切な制限速度まで慎重に減速する必要があります。急ブレーキをかけてはいけません。
- id: 96
  category: vehicle_information
  question: 車線逸脱警告装置が正しく作動するために依存しているものは何ですか？
  choices:
    A: GPS追跡
    B: 路面標示
    C: 車両の方向指示器
    D: リアバンパーのレーダーセンサー
  answer: B
  explanation: マニュアルによると、車線逸脱警告機能は路面標示を頼りに作動し、車が車線から外れそうになった場合に警告を発します。
- id: 97
  category: defensive_driving
  question: パーキングセンサーが検知できない可能性があるものは次のうちどれですか？
  choices:
    A: 近くに駐車している大型車両
    B: 地面に平らに置かれている物やバンパーより低い位置にある物
    C: 車両の真ん前にある壁
    D: 隣の車線を走行中の車両
  answer: B
  explanation: パーキングセンサーだけに頼るべきではありません。地面に平らに置かれている物、バンパーより低い位置にある物、車両に近すぎる物、または遠すぎる物は検知できない場合があるからです。
- id: 98
  category: vehicle_information
  question: 後退時車両検知警報システム（RCTA）の主な機能は何ですか？
  choices:
    A: 左右から後退経路に入ろうとする車両を警告する
    B: 自動で縦列駐車を行う
    C: 車両の前を横切る歩行者を運転者に知らせる
    D: 高速走行中に死角を監視する
  answer: A
  explanation: 後退時車両検知警報は、1台以上の車両が後退経路に入ろうとしている場合に警告を発します。後方のセンサーが左右から接近する車両を検知します。
- id: 99
  category: vehicle_information
  question: 前方の危険に対してブレーキをかけなかった場合、自動緊急ブレーキシステム（AEB）はどのように反応しますか？
  choices:
    A: ブレーキをかけるまで継続的にクラクションを鳴らす
    B: 自律的に車両を急減速させるか停止させる
    C: 自動的に隣の車線へハンドルを切る
    D: 危険を早く回避するために車両の速度を上げる
  answer: B
  explanation: 前方の危険を避けるためのブレーキ操作やハンドル操作が行われない場合、自動緊急ブレーキシステムは衝突を避けるために自律的に車両を急減速させるか停止させます。
- id: 100
  category: defensive_driving
  question: 車両に先進カメラや死角モニターが装備されている場合でも、運転者が継続して行わなければならないことは何ですか？
  choices:
    A: 車線変更の際、ダッシュボードの表示のみを信頼する
    B: 後退中、ハンドルから手を離しておく
    C: 頻繁にミラーを確認し、肩越しに目視（ヘッドチェック）を行う
    D: 交通量の多い場所ではシステムを無効にする
  answer: C
  explanation: マニュアルでは、これらの技術に依存しすぎず、サイドミラー、バックミラー、および肩越しの目視（ヘッドチェック）を継続して行う必要があることが繰り返し強調されています。
- id: 101
  category: vehicle_information
  question: 車両検知センサーが正常に機能するために必要なメンテナンスは何ですか？
  choices:
    A: 清潔に保つ必要がある
    B: 毎年交換する必要がある
    C: 車両の色に合わせて塗装する必要がある
    D: 走行前に毎回手動で起動する必要がある
  answer: A
  explanation: マニュアルには「センサーが正常に機能するためには、清潔に保つ必要があります」と明記されています。
- id: 102
  category: vehicle_information
  question: 車両に後退時自動ブレーキシステムが装備されている場合でも、何をすべきですか？
  choices:
    A: 車両を停止させるために、システムに完全に頼る。
    B: ミラーの確認、目視（肩越し）での確認、およびリアカメラの使用を継続する。
    C: 手動での制御を維持するために、後退する前にシステムを無効にする。
    D: システムのセンサーを無効にするために、素早く加速する。
  answer: B
  explanation: マニュアルには次のように記載されています。「後退時自動ブレーキ技術に依存しないでください。ミラーの確認、目視（肩越し）での確認、および装備されている場合はリアカメラの使用を継続してください。」
- id: 103
  category: vehicle_information
  question: 車線維持支援機能（レーンキーピングアシスト）が正常に機能しない可能性が高いのは、どのような状況ですか？
  choices:
    A: 夜間に運転しているとき。
    B: 車線が薄い、または雪や泥で覆われているとき。
    C: 複数車線の高速道路を走行しているとき。
    D: 時速30マイル（約48km/h）未満で走行しているとき。
  answer: B
  explanation: マニュアルによると、車線維持支援機能は「車線が薄い、または雪や泥で覆われているときには機能しません」。
- id: 104
  category: driver_testing
  question: アダプティブ・クルーズ・コントロール（ACC）などの利便性のための技術は、運転免許試験中に使用することが許可されていますか？
  choices:
    A: 車両に装備されている場合は許可される。
    B: 縦列駐車の場合のみ許可される。
    C: いいえ、運転免許試験のプロセス中には許可されません。
    D: 試験官が特に使用を求めた場合を除き、許可されない。
  answer: C
  explanation: マニュアルには「利便性のための技術は、運転免許試験のプロセス中には使用が許可されません」と明記されています。
- id: 105
  category: safe_driving_rules
  question: アダプティブ・クルーズ・コントロール（ACC）を含むすべてのクルーズコントロールを使用しないことが推奨されるのはいつですか？
  choices:
    A: 州間高速道路を走行しているとき。
    B: 悪天候やその他の安全でない運転条件のとき。
    C: 長距離を運転しているとき。
    D: 大型トラックの後ろを走行しているとき。
  answer: B
  explanation: マニュアルでは「悪天候やその他の安全でない運転条件では、ACCを含むいかなるクルーズコントロールも使用しないことが推奨されます」とアドバイスされています。
- id: 106
  category: vehicle_information
  question: 自動縦列駐車システムを使用している際、ドライバーには依然としてどのような責任がありますか？
  choices:
    A: スペースに合わせてハンドルを操作すること。
    B: ブレーキ操作と周囲の監視を行うこと。
    C: 駐車後に方向指示器を作動させること。
    D: 駐車スペースを手動で測定すること。
  answer: B
  explanation: マニュアルには、自動縦列駐車について「ドライバーには依然としてブレーキ操作と周囲の監視を行う責任があります」と記されています。
- id: 107
  category: sharing_the_road
  question: トラックやバスなどの大型車両の真横に留まってはいけないのはなぜですか？
  choices:
    A: 乗用車よりもはるかに高速で走行するため。
    B: 大きな死角があり、相手からこちらの姿が見えにくいため。
    C: タイヤの破裂（バースト）が起こりやすいため。
    D: 合図を出さずに頻繁に急な車線変更を行うため。
  answer: B
  explanation: マニュアルでは「トラックやバスなどの大型車両の真横に留まってはいけません。これらの車両には大きな死角があり、相手からこちらの姿が見えにくいからです」と警告しています。
- id: 108
  category: defensive_driving
  question: まぶしい反射光を生じさせることで、車両の死角を増やす可能性があるのは次のうちどれですか？
  choices:
    A: 窓を開けて運転すること。
    B: 窓の表面、特にフロントガラスに反射する太陽光。
    C: 車両のサンバイザーを使用すること。
    D: 偏光サングラスを着用すること。
  answer: B
  explanation: マニュアルには「太陽光は、窓の表面に反射して死角を作ることがあります。フロントガラスは、まぶしい反射や死角が最も発生しやすい場所です」と記載されています。
- id: 109
  category: safe_driving_rules
  question: 妊娠中の女性はどのようにシートベルトを着用すべきですか？
  choices:
    A: 腹部を横切るように、できるだけ高い位置で着用する。
    B: 腰ベルトは使用せず、肩ベルトのみを使用する。
    C: 骨盤を横切るように、腹部の下のほうでできるだけ低い位置で着用する。
    D: 妊娠中の女性はシートベルトの着用を免除されている。
  answer: C
  explanation: マニュアルには「妊娠している場合は、骨盤を横切るように、腹部の下のほうでできるだけ低い位置にベルトを着用することで、安全に着用できます」と指示されています。
- id: 110
  category: penalties_and_points
  question: アイオワ州において、18歳未満の同乗者のシートベルト着用義務違反に対する最大罰金額はいくらですか？
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: D
  explanation: シートベルト法の違反は、同乗者1人につき最大50ドルの罰金、および「18歳未満の同乗者1人につき100ドル」の罰金が科せられます。
- id: 111
  category: safe_driving_rules
  question: 1歳未満で体重20ポンド（約9kg）未満の子供を乗せる際の要件は何ですか？
  choices:
    A: 前向きのジュニアシート（ブースターシート）で固定しなければならない。
    B: 後向きの乳幼児用補助乗車装置（チャイルドシート）で固定しなければならない。
    C: 後部座席で標準のシートベルトを使用して固定することができる。
    D: 大人が抱いていれば、助手席に乗ることができる。
  answer: B
  explanation: アイオワ州の法律によると、「1歳未満で体重20ポンド未満の子供は、後向きの乳幼児用補助乗車装置（チャイルドシート）で固定しなければならない」と定められています。
- id: 112
  category: safe_driving_rules
  question: アイオワ州の法律によると、6歳未満の子供は車内でどのように保護されなければなりませんか？
  choices:
    A: 安全シートやジュニアシートなどの乳幼児用補助乗車装置を使用する。
    B: 助手席で標準的な大人用シートベルトを使用する。
    C: 後部座席で標準的な大人用シートベルトを使用する。
    D: 体重に関係なく、後向きのチャイルドシートを使用する。
  answer: A
  explanation: マニュアルには次のように記載されています。「6歳未満の子供は、乳幼児用補助乗車装置（シートベルトではなく、安全シートまたはジュニアシート）で固定しなければならない。」
- id: 113
  category: safe_driving_rules
  question: アイオワ州の法律の下で、走行中のピックアップトラックの荷台に乗ることが禁止されているのは誰ですか？
  choices:
    A: 21歳未満のすべての人。
    B: 18歳未満のすべての人。
    C: 6歳未満の子供のみ。
    D: 年齢を問わずすべての乗客。
  answer: B
  explanation: マニュアルには明確に次のように記載されています。「18歳未満の子供は、走行中のピックアップトラックの荷台に乗ることはできない。」
- id: 114
  category: defensive_driving
  question: シートベルトは長距離ドライブの時だけ必要だというのが迷信であるのはなぜですか？
  choices:
    A: シートベルトは時速60マイル以上の速度でしか効果がないため。
    B: 全交通事故死の半分以上が、自宅から25マイル（約40km）以内で発生しているため。
    C: 短距離の移動は通常、高速道路の走行を伴うため。
    D: エアバッグは短距離の移動では作動しないため。
  answer: B
  explanation: シートベルトは長距離ドライブのためだけにあるという迷信に対し、マニュアルでは次のように説明しています。「全交通事故死の半分以上が自宅から25マイル以内で発生している。その多くは制限速度が時速45マイル以下の道路で起きている。」
- id: 115
  category: driver_responsibility
  question: 車内の固定されていない荷物を固定することが重要なのはなぜですか？
  choices:
    A: 急停車の際にブレーキペダルの下に転がったり、誰かに怪我をさせたりする可能性があるため。
    B: 車両の最大重量制限を超えさせる可能性があるため。
    C: 車両の自動緊急ブレーキセンサーを妨害するため。
    D: 車両の燃料消費量を増加させるため。
  answer: A
  explanation: マニュアルには、「急停車や衝突の際に誰かに怪我をさせる可能性のある」固定されていない物体がないこと、また床の上に「ブレーキペダルの下に転がり込み、ブレーキをかけるのを困難または不可能にする可能性のある」物体がないことを確認すべきであると記載されています。
- id: 116
  category: sharing_the_road
  question: 他車の死角（ブラインドスポット）を走行していることに気づいた場合、どうすべきですか？
  choices:
    A: 相手が移動するまで継続的にクラクションを鳴らす。
    B: ハイビームを点滅させて相手に知らせる。
    C: 加速または減速して、相手のドライバーから自分の車が見えるようにする。
    D: 優先権を確立するために、速度と位置を維持する。
  answer: C
  explanation: マニュアルでは他車の死角について次のようにアドバイスしています。「他車の死角を走行してはいけない。加速または減速して、相手のドライバーから自分の車が見えるようにしなさい。」
- id: 117
  category: safe_driving_rules
  question: 時速55マイルで走行中、急停車や衝突が起きた場合、車内の20ポンド（約9kg）の固定されていない物体は、どのくらいの衝撃力で衝突しますか？
  choices:
    A: 100ポンド
    B: 500ポンド
    C: 1,000ポンド
    D: 2,000ポンド
  answer: C
  explanation: マニュアルによると、時速55マイルでは、20ポンドの物体は1,000ポンド（約450kg）の衝撃力で衝突します。
- id: 118
  category: defensive_driving
  question: 会話をするなど、運転者の意識を逸らしたり、他へ集中させたりする注意散漫の種類はどれですか？
  choices:
    A: 視覚的注意散漫（Visual distraction）
    B: 操作的注意散漫（Manual distraction）
    C: 認知的注意散漫（Cognitive distraction）
    D: 聴覚的注意散漫（Auditory distraction）
  answer: C
  explanation: マニュアルでは、音楽を聴いたり会話をしたりするなど、運転者の意識を逸らしたり他へ集中させたりすることを「認知的注意散漫（Cognitive
    distraction）」と定義しています。
- id: 119
  category: safe_driving_rules
  question: アイオワ州の法律の下で、学習許可証（instruction permit）または中級免許（intermediate license）を持つ18歳未満の運転者が電話をかけたり受けたりすることが許可されるのはいつですか？
  choices:
    A: ハンズフリー機器を使用している場合のみ
    B: 時速30マイル以下で走行している場合のみ
    C: 車両が車道（走行車線）外で完全に停止している場合のみ
    D: いかなる状況においても電話の使用は一切許可されない
  answer: C
  explanation: 学習許可証、中級免許、または特定の未成年者限定免許を持つ18歳未満の運転者は、車両が車道（走行車線）外で完全に停止していない限り、電話をかけたり受けたりすることが禁止されています。
- id: 120
  category: safe_driving_rules
  question: アイオワ州のハンズフリー法によると、運転中に許可されている行為は次のうちどれですか？
  choices:
    A: GPSに手動で住所を入力する
    B: 音声起動（ボイスアクティベーション）を使用して電話をかける
    C: テキストメッセージを見るために携帯電話を手に持つ
    D: 音声コマンドを使用して動画をストリーミング再生する
  answer: B
  explanation: アイオワ州のハンズフリー法では、ハンズフリーまたは音声起動を使用しない限り、通話、メール送信、ダイヤル操作はできないと定められています。携帯電話を手に持つこと、GPSの住所入力、動画のストリーミング再生は明示的に禁止されています。
- id: 121
  category: alcohol_drugs_health
  question: アイオワ州において、「酒気帯び運転（OWI）」の正式な違反は、血中アルコール濃度（BAC）が最低でも以下の数値である場合と定義されています。
  choices:
    A: '.02'
    B: '.04'
    C: '.06'
    D: '.08'
  answer: D
  explanation: 酒気帯び運転（OWI）は、血中アルコール濃度（BAC）が0.08以上であるか、体内に何らかの規制薬物がある状態で運転することと定義されています。
- id: 122
  category: alcohol_drugs_health
  question: アイオワ州の「黙示の同意（Implied Consent）」法は、アイオワ州の運転免許証を保持している個人にとって何を意味しますか？
  choices:
    A: 交通検問での車両捜索に同意すること。
    B: 法執行機関からの要求があった場合、現場での飲酒検知テストに同意することを契約上合意すること。
    C: 30日以内にすべての交通罰金を支払うことに同意すること。
    D: 雇用主によるランダムな薬物検査に同意すること。
  answer: B
  explanation: アイオワ州の運転免許証保持者は、「検査への黙示の同意」法に基づき、法執行機関からの要求があった場合に現場での飲酒検知テストを受けることに契約上合意しています。
- id: 123
  category: penalties_and_points
  question: アイオワ州で呼気検査（アルコール検知テスト）を拒否した場合の最低罰則は何ですか？
  choices:
    A: 180日間の免許取消と500ドルの罰金
    B: 1年間の免許取消と最低1,250ドルの罰金
    C: 60日間の免許取消と義務的な社会奉仕活動
    D: 30日間の免許停止と200ドルの罰金
  answer: B
  explanation: 呼気検査を拒否した場合の罰則には、自動的な1年間の免許取消と、最低1,250ドルの罰金が含まれます。
- id: 124
  category: alcohol_drugs_health
  question: アイオワ州では、21歳未満の未成年の運転者は、血中アルコール濃度（BAC）が以下の数値以上の場合、酒気帯び運転とみなされます。
  choices:
    A: '.00'
    B: '.02'
    C: '.04'
    D: '.08'
  answer: B
  explanation: 未成年の運転者は、BACが0.02以上の場合、酒気帯び運転とみなされます。
- id: 125
  category: alcohol_drugs_health
  question: 自動車内で、開封された（封が解かれた）アルコール容器を運搬することが合法な場所はどこですか？
  choices:
    A: グローブボックスの中
    B: 助手席の下
    C: 車のトランクの中
    D: 後部座席のカップホルダー
  answer: C
  explanation: 開封容器法（Open Container Law）によれば、開封されたアルコール飲料の容器は車両のトランクに入れて運搬することができます。
- id: 126
  category: alcohol_drugs_health
  question: 18時間連続で起きていることは、血中アルコール濃度（BAC）が以下のどの数値である場合と同等の能力低下を招くとみなされますか？
  choices:
    A: 0.02パーセント
    B: 0.04パーセント
    C: 0.08パーセント
    D: 0.10パーセント
  answer: C
  explanation: 18時間連続で起きていることは、血中アルコール濃度（BAC）0.08パーセント（法的に酔っ払っている状態）と同等の能力低下を招きます。
- id: 127
  category: safe_driving_rules
  question: アイオワ州のハイウェイや州間高速道路における、悪天候や道路工事などの最新の交通状況を提供しているリソースはどれですか？
  choices:
    A: Iowa 311
    B: Iowa 411
    C: Iowa 511
    D: Iowa 911
  answer: C
  explanation: 運転者は www.511ia.org にアクセスするか、無料のモバイルアプリ（Iowa 511）をダウンロードすることで、最新の交通状況を確認できます。
- id: 128
  category: vehicle_information
  question: オートマチック車を運転する際、ギアセレクターの「N」は何を意味しますか？
  choices:
    A: Normal（ノーマル）
    B: Neutral（ニュートラル）
    C: Night（ナイト）
    D: Navigate（ナビゲート）
  answer: B
  explanation: オートマチック車のギアセレクターにおいて、Nはエンジンをアイドリング状態にするための「Neutral（ニュートラル）」を意味します。
- id: 129
  category: vehicle_information
  question: マニュアル車において、「クラッチ」と呼ばれる3番目のペダルを踏むために使用するのはどちらの足ですか？
  choices:
    A: 右足
    B: 左足
    C: どちらの足でもよい
    D: 両足同時に
  answer: B
  explanation: マニュアル車でギアを変えるためのステップ1は、「左足でクラッチを踏む」ことです。
- id: 130
  category: safe_driving_rules
  question: 車両の総停止距離を構成する2つの要素は何ですか？
  choices:
    A: 空走距離（反応距離）と制動距離
    B: 速度距離と重量距離
    C: 加速距離と制動距離
    D: 視覚距離と手動距離
  answer: A
  explanation: マニュアルにある停止距離の公式によれば、空走距離（反応距離） ＋ 制動距離 ＝ 停止距離となります。
- id: 131
  category: safe_driving_rules
  question: 携帯型電子機器の使用を禁止するアイオワ州のわき見運転禁止法（Distracted Driving Law）において、例外として認められているのは次のうちどれですか？
  choices:
    A: 音楽のプレイリストを変更している運転者
    B: 気象警報などの安全に関する情報を受信している人
    C: 赤信号で停車中に地図アプリを確認している運転者
    D: 家族からのテキストメッセージを読んでいる運転者
  answer: B
  explanation: わき見運転禁止法の例外には、緊急事態、交通情報、気象警報などの安全に関する情報を受信している場合が含まれます。
- id: 132
  category: safe_driving_rules
  question: 通常の運転条件下で、初心者運転者が維持すべき最小限の車間距離はどれくらいですか？
  choices:
    A: 2秒分
    B: 3秒分
    C: 4秒分
    D: 6秒分
  answer: B
  explanation: 初心者運転者は、通常の運転条件下では少なくとも3秒分の車間距離を維持する必要があります。
- id: 133
  category: defensive_driving
  question: 路面が滑りやすい場合や、前方の車両によって視界が遮られている場合に推奨される車間距離はどれくらいですか？
  choices:
    A: 2秒分
    B: 3〜4秒分
    C: 4〜5秒分
    D: 6秒以上
  answer: D
  explanation: 路面が滑りやすい場合や、前方の車両が大きいために視界が遮られている場合は、6秒以上の車間距離をとることが推奨されます。
- id: 134
  category: vehicle_information
  question: 車両にアンチロック・ブレーキ・システム（ABS）が装備されており、急停車する必要がある場合は、どのようにすべきですか？
  choices:
    A: 横滑りを避けるために、ブレーキを素早く何度も踏む（ポンピングブレーキ）。
    B: ブレーキペダルをできるだけ強く踏み込み、そのまま踏み続ける。
    C: ブレーキペダルを軽く踏み、徐々に力を強めていく。
    D: ブレーキペダルからの押し返しを感じたら、足を緩める。
  answer: B
  explanation: ABSが装備されている車両で急停車が必要な場合は、ブレーキペダルを力いっぱい踏み込み、そのまま踏み続けてください。ペダルが押し戻されるような感触があっても、足を緩めてはいけません。
- id: 135
  category: defensive_driving
  question: 車間距離を極端に詰めてくる後続車の運転者に対して、ブレーキランプを使って意思を伝えるにはどうすればよいですか？
  choices:
    A: ハザードランプを点滅させる。
    B: ブレーキペダルを強く踏み、そのまま保持する。
    C: ブレーキペダルを素早く3、4回軽く踏む。
    D: 1ブロックの間、ブレーキペダルを軽く踏んだまま走行する。
  answer: C
  explanation: 後続車が車間距離を詰めすぎている場合は、ブレーキペダルを素早く3、4回軽く踏んでください。これにより、これから減速することを後続車に知らせることができます。
- id: 136
  category: sharing_the_road
  question: 次のような杖を持っている視覚障害者が前方を歩いている場合、必ず一時停止しなければなりません：
  choices:
    A: 黄色または先端が黒色の杖
    B: 白色または先端が赤色の杖
    C: 反射材の付いたオレンジ色の標識
    D: 青色または先端が緑色の杖
  answer: B
  explanation: 杖（多くの場合、白または先端が赤色）を持っている視覚障害者や盲導犬を連れた人が、自分の前方や危険が及ぶ可能性のある距離を歩いている場合は、必ず停止しなければなりません。
- id: 137
  category: safe_driving_rules
  question: 速度制限の標識がない場合、住宅街や学校周辺地域での一般的な制限速度はどれくらいですか？
  choices:
    A: 時速15マイル (15 mph)
    B: 時速20マイル (20 mph)
    C: 時速25マイル (25 mph)
    D: 時速35マイル (35 mph)
  answer: C
  explanation: 速度制限の標識が掲示されていない場合、住宅街や学校周辺地域での一般的な制限速度は時速25マイルです。
- id: 138
  category: safe_driving_rules
  question: 通常の条件下で、州間高速道路（インターステート）において許容される最低速度はどれくらいですか？
  choices:
    A: 時速40マイル (40 mph)
    B: 時速45マイル (45 mph)
    C: 時速50マイル (50 mph)
    D: 時速55マイル (55 mph)
  answer: A
  explanation: 州間高速道路では、最低速度が時速40マイルと定められています。通常の条件下でこの速度を出せない車両は、州間高速道路を走行することはできません。
- id: 139
  category: vehicle_information
  question: フロントエアバッグによる怪我のリスクを減らし、車両のコントロールを維持するために、ハンドル（ステアリングホイール）のどこに手を置くべきですか？
  choices:
    A: 10時と2時の位置
    B: 9時と3時の位置、またはそれより少し低い7時と5時の位置
    C: 8時と4時の位置、またはそれより少し高い11時と1時の位置
    D: 片手を12時の位置
  answer: B
  explanation: フロントエアバッグによる怪我のリスクを軽減し、最適なコントロールを維持するために、ハンドルの反対側の9時と3時の位置、またはそれより少し低い7時と5時の位置に手を置く必要があります。
- id: 140
  category: safe_driving_rules
  question: 車両を後退（バック）させる際の適切な技術は、次のうちどれですか？
  choices:
    A: バックカメラとミラーだけに頼る。
    B: 車を動かしたい方向とは逆の方向にハンドルを切る。
    C: 腰をひねって振り向き、リアウィンドウ越しに右肩越しに後方を確認する。
    D: 操作を素早く完了させるために、アクセルを強く踏む。
  answer: C
  explanation: バックする際は、腰をひねって振り向き、車両の後方をしっかり確認してください。右腕を助手席の背もたれにかけ、左手でハンドルの上部を握り、リアウィンドウ越しに右肩越しに後方を見ます。
- id: 141
  category: safe_driving_rules
  question: アイオワ州の法律によると、制限速度が時速45マイル（45 mph）を超える場合、右左折の何フィート手前で合図を出さなければなりませんか？
  choices:
    A: 少なくとも50フィート
    B: 少なくとも100フィート
    C: 少なくとも200フィート
    D: 少なくとも300フィート
  answer: D
  explanation: アイオワ州の法律では、制限速度が時速45マイル以下の場合は右左折の少なくとも100フィート手前で、制限速度が時速45マイルを超える場合は少なくとも300フィート手前で合図を出すことが義務付けられています。
- id: 142
  category: defensive_driving
  question: 曲がりたい場所との間に別の通りや私道がある場合、いつ方向指示器（ウィンカー）を使用すべきですか？
  choices:
    A: 目的地が見えたらすぐに。
    B: 交差点に関係なく、曲がる少なくとも500フィート手前で。
    C: 他の通りや私道を通り過ぎるまで待ってから合図を出す。
    D: 早めに合図を出し、他のドライバーに交差点を先に通るよう手で合図する。
  answer: C
  explanation: 合図を出すのが早すぎないよう注意してください。曲がりたい場所との間に別の通り、私道、入り口がある場合は、それらを通り過ぎるまで待ってから合図を出してください。
- id: 143
  category: safe_driving_rules
  question: どのような条件下で、赤信号での左折が許可されますか？
  choices:
    A: 対面交通の道路（two-way street）から一方通行の道路（one-way street）へ曲がる時。
    B: 一方通行の道路の左車線から、別の一方通行の道路へ曲がる時。
    C: 一方通行の道路から対面交通の道路へ曲がる時。
    D: アイオワ州では赤信号での左折は一切禁止されている。
  answer: B
  explanation: 一方通行の道路の左車線から別の一方通行の道路へ曲がる場合に限り、赤信号での左折が可能です。
- id: 144
  category: safe_driving_rules
  question: 車線変更の前に死角を確認するために頭を向ける際、重要な安全上の注意点は何ですか？
  choices:
    A: ハンドルをまっすぐに保つようにする。
    B: 見ている方向にハンドルをわずかに切る。
    C: ブレーキを軽く踏んで他のドライバーに知らせる。
    D: 見る前に大幅に減速する。
  answer: A
  explanation: 死角を確認するために頭を向けるときは、ハンドルをまっすぐに保つようにしてください。人は頭を向けた方向に腕も一緒に動かしてしまう自然な傾向があります。
- id: 145
  category: defensive_driving
  question: 時速30マイルで走行している車両と比較して、時速60マイルで走行している車両が停止するまでに進む距離はどれくらい長くなりますか？
  choices:
    A: 2倍
    B: 3倍
    C: 4倍
    D: 5倍
  answer: B
  explanation: 車両の速度が速ければ速いほど、曲がったり、減速したり、停止したりするのに必要な距離は長くなります。例えば、時速60マイルで走行している車両は、時速30マイルで走行している車両よりも、停止するまでに3倍長い距離を走行します。
- id: 146
  category: safe_driving_rules
  question: マニュアルには3点方向転換（three-point turn）についてどのように記載されていますか？
  choices:
    A: 交通量の多い通りで方向転換する最も安全な方法である。
    B: すべての行き止まりの道路で行うべきである。
    C: 一般的に安全な操作ではなく、衝突のリスクを高める可能性がある。
    D: 運転免許試験に合格するために必須である。
  answer: C
  explanation: 3点方向転換は一般的に安全な操作ではなく、リスクを高め、衝突にさらされる可能性があります。最寄りの交差点まで進む方が良いでしょう。
- id: 147
  category: safe_driving_rules
  question: 死角を確認するために頭を向ける際、ハンドルはどうすべきですか？
  choices:
    A: 見ている方向にわずかに切る。
    B: まっすぐに保つ。
    C: 見ている方向とは逆にわずかに切る。
    D: 一瞬ハンドルから手を離す。
  answer: B
  explanation: 死角を確認するために頭を向けるときは、ハンドルをまっすぐに保つようにしてください。人は頭を向けた方向に腕も一緒に動かしてしまう自然な傾向があります。
- id: 148
  category: safe_driving_rules
  question: 他の車両を追い越した後、元の車線に戻っても安全なのはいつですか？
  choices:
    A: 追い越した車両のフロントバンパーを通り過ぎたらすぐに。
    B: バックミラーで追い越した車の前方（フロント部分）が見えた時。
    C: 3秒間加速した後。
    D: 追い越された車両がヘッドライトを点滅させた時。
  answer: B
  explanation: バックミラーに追い越した車の前方が見え、自車が十分に離れたら、合図を出して、緩やかにゆっくりと元の車線に戻ります。
- id: 149
  category: signs_and_signals
  question: 路面の黄色の線は何を示していますか？
  choices:
    A: 同じ方向に進む交通を区分している。
    B: この先にスクールゾーンがあることを示している。
    C: 異なる方向に進む交通（対向車線）を区分している。
    D: 道路の右端を示している。
  answer: C
  explanation: 路面標示の規則によると、黄色の線は異なる方向に進む交通を区分し、白の線は同じ方向に進む交通を区分します。
- id: 150
  category: safe_driving_rules
  question: 次の状況のうち、追い越しが違法とされるのはどれですか？
  choices:
    A: 踏切から100フィート以内の場所。
    B: 白の破線がある道路。
    C: 前方の車両が制限速度以下で走行している時。
    D: 自分の側の車線に黄色の破線がある時。
  answer: A
  explanation: 踏切、交差点、または狭い橋やトンネルから100フィート以内など、いくつかの状況では追い越しは違法です。
- id: 151
  category: defensive_driving
  question: マニュアルによると、重大な事故の何パーセントが、運転中の危険な選択やミスによるものですか？
  choices:
    A: 50パーセント
    B: 75パーセント
    C: 82パーセント
    D: 94パーセント
  answer: D
  explanation: マニュアルには、重大な事故の94パーセントは、運転中の危険な選択やミスが原因であると記載されています。
- id: 152
  category: defensive_driving
  question: 周囲の状況を把握し続けるために、どのくらい先まで道路状況をスキャン（確認）すべきですか？
  choices:
    A: 5〜10秒先
    B: 10〜15秒先
    C: 20〜30秒先
    D: 30〜45秒先
  answer: C
  explanation: 防衛運転（ディフェンシブ・ドライビング）の一環として、頻繁にミラーを確認し、前方の状況を20〜30秒先までスキャンする必要があります。
- id: 153
  category: defensive_driving
  question: 運転中に「脱出ルートを確保する」とはどういう意味ですか？
  choices:
    A: 目的地までの最短ルートを知っておくこと。
    B: 緊急時に備えて窓を開けておくこと。
    C: 現在の進路が突然塞がれた場合に備えて、逃げ道や代替の走行経路を残しておくこと。
    D: すべての高速道路の出口の場所を暗記しておくこと。
  answer: C
  explanation: 脱出ルートを確保するとは、現在の進路が突然塞がれた場合に車両を移動させる場所、つまり「逃げ道」を確保しておくことを意味します。
- id: 154
  category: safe_driving_rules
  question: マニュアルによると、道路が最も安全なのはどのような時ですか？
  choices:
    A: すべての車両が最高速度制限で走行している時。
    B: すべての車両が制限速度を超えずに同じ速度で走行している時。
    C: 低速の車両が厳格に右車線を走行している時。
    D: 高速で走る車両と低速で走る車両が混在している時。
  answer: B
  explanation: 最も安全な道路状況とは、すべての車両が制限速度を超えずに同じ速度で走行している状態です。
- id: 155
  category: sharing_the_road
  question: 農用トラクターや馬車のような低速走行車両の背面に表示されているのは、どのような標識ですか？
  choices:
    A: 赤色の八角形
    B: 黄色のひし形
    C: オレンジ色の三角形
    D: 白色の長方形
  answer: C
  explanation: 低速走行車両には、背面に低速走行車両標識（オレンジ色の三角形または点滅灯）が付いている場合があります。
- id: 156
  category: defensive_driving
  question: 後続車に車間距離を詰められた（あおられた）場合、どうすべきですか？
  choices:
    A: 急ブレーキをかけて後続車に警告する。
    B: 速度を上げて車間距離を広げる。
    C: 少し右側に寄り、減速して後続車に追い越しを促す。
    D: ハザードランプを点灯させ、車線内で停止する。
  answer: C
  explanation: 車間距離を詰められた場合は、少し右側に寄って後続車に前方の視界を確保させます。また、減速して後続車に追い越しを促すようにしてください。
- id: 157
  category: safe_driving_rules
  question: アイオワ州の法律では、いつヘッドライトの使用が義務付けられていますか？
  choices:
    A: 日没から日の出まで、または視界が500フィート以下の時。
    B: 午後8時から午前6時までの間のみ。
    C: 高速道路を走行している時はいつでも。
    D: 視界が100フィート未満の時のみ。
  answer: A
  explanation: アイオワ州の法律では、日没から日の出まで、または（霧、豪雨、雪などで）視界が500フィート以下の時には、両方のヘッドライトを点灯することが義務付けられています。
- id: 158
  category: vehicle_information
  question: 悪天候時のヘッドライト使用に関する良い目安は何ですか？
  choices:
    A: ワイパーを作動させたら、常にヘッドライトも点灯させる。
    B: 大雪の時だけハイビームを使用する。
    C: デイタイム・ランニング・ライト（DRL）が付いている場合は、ヘッドライトを消灯する。
    D: 雨の日はヘッドライトの代わりにハザードランプを使用する。
  answer: A
  explanation: 良い目安として、フロントガラスのワイパーを使用する時はいつでもヘッドライトを点灯するようにしましょう。
- id: 159
  category: safe_driving_rules
  question: 次の状況のうち、クラクションを使用すべきなのはどれですか？
  choices:
    A: 歩道を歩いている友人に挨拶する時。
    B: 割り込んできたドライバーに対して怒りを表現する時。
    C: 狭い路地から出る際など、前方の状況が見えない場所を通る時。
    D: 遅い車にスピードを上げるよう促す時。
  answer: C
  explanation: 狭い路地から出る時など、前方の状況が確認できない場所に差し掛かった時には、クラクションを使用すべきです。
- id: 160
  category: defensive_driving
  question: 走行車線内で車両が故障し、動かせなくなった場合、運転者と同乗者はどうすべきですか？
  choices:
    A: シートベルトを締めたまま車内にとどまる。
    B: 速やかに車外に出て、走行中の車両から離れた安全な場所に立つ。
    C: 車両の真後ろに立ち、後続車に合図を送る。
    D: 交通が流れている間に車両を押して動かそうとする。
  answer: B
  explanation: 走行車線内で動けなくなった場合は、運転者と同乗者は速やかに車外に出て、可能であれば路肩から離れ、走行中の車両から遠く離れた安全な場所に避難してください。
- id: 161
  category: safe_driving_rules
  question: 交差点に進入する際、接近してくる車両や歩行者をどの順番で確認すべきですか？
  choices:
    A: 右、左、そしてもう一度右
    B: 左、右、そしてもう一度左
    C: 直前、そして後方
    D: 左、そして直前
  answer: B
  explanation: 交差点を通過する前に、接近してくる車両や歩行者がいないか、左、右、そしてもう一度左を確認する必要があります。
- id: 162
  category: defensive_driving
  question: 接近してくる車両の「誤った」方向指示器（ウィンカー）に注意しなければならないのはなぜですか？
  choices:
    A: ドライバーがあなたの先の地点で曲がる予定であるか、指示器を消し忘れている可能性があるため。
    B: 新しい車両では、方向指示器の配線が間違っていることが多いため。
    C: ドライバーがあなたに先に進むよう合図を送っているため。
    D: その車両が急停車しようとしていることを示しているため。
  answer: A
  explanation: 接近してくる車両が方向指示器を出しているからといって、すぐに曲がってはいけません。ドライバーがあなたの通過した後の地点で曲がる予定であったり、前の交差点で曲がった後に指示器を消し忘れていたりする可能性があります。
- id: 163
  category: safe_driving_rules
  question: 郊外の4車線道路を横断、または左折して進入する場合、最も安全な方法は何ですか？
  choices:
    A: 両方向の交通を一度に横断するために、素早く加速する。
    B: 中央分離帯まで進んで一旦停止し、右側を確認して、安全な時に横断する。
    C: 少なくとも1マイル先まで両方向に車両がいなくなるまで待つ。
    D: まず右車線に合流し、その後にUターンする。
  answer: B
  explanation: 両方向の交通を一度に横断しようとしてはいけません。一時停止標識で止まり、左側を確認して安全であれば中央分離帯まで進みます。中央分離帯で停止したまま右側を確認し、安全な時に横断または左折を行います。
- id: 164
  category: safe_driving_rules
  question: 州間高速道路（インターステート）のオンランプにある加速・合流車線の目的は何ですか？
  choices:
    A: 完全に停止して、交通の切れ間を待つため。
    B: 車両を交通の流れと同じ速度まで加速させ、安全な時に合流するため。
    C: 路面をスキャンし、どの程度のスペースがあるかを確認するため。
    D: 高速道路の交通が安全に流出できるようにするため。
  answer: B
  explanation: 加速・合流車線を使用して、車両を交通の流れと同じ速度まで加速させ、安全な時に合流してください。絶対に必要な場合を除き、ランプ内で完全に停止してはいけません。
- id: 165
  category: safe_driving_rules
  question: 衝突軽減交差点（reduced-conflict intersection）において、脇道のドライバーはどのようにして4車線ハイウェイを左折または横断しますか？
  choices:
    A: 両方向の交通に同時に切れ間ができるのを待つ。
    B: 従来の信号機を使用して、直接横断する。
    C: ハイウェイへ右折して進入し、左車線へ合流した後、指定された開口部でUターンする。
    D: 元の方向に戻る前に、一時的に道路の反対側を走行する。
  answer: C
  explanation: 衝突軽減交差点では、左折や横断を希望する脇道のドライバーは、まずハイウェイへ右折して進入し、左車線に合流してから、指定された中央分離帯の開口部でUターン（転回）を行います。
- id: 166
  category: safe_driving_rules
  question: ダイバージング・ダイヤモンド・インターチェンジ（DDI）のユニークな特徴は何ですか？
  choices:
    A: 中央の島の周りを反時計回りに誘導する。
    B: 道路の後半分を横断する前に、中央分離帯で停止することを要求する。
    C: 元の方向に戻る前に、一時的に道路の反対側を走行するようにドライバーを誘導する。
    D: 信号機を一切使わず、譲れ（Yield）の標識のみを使用する。
  answer: C
  explanation: ダイバージング・ダイヤモンド・インターチェンジは、元の正しい方向に戻る前に、一時的に道路の反対側を走行するようにドライバーを誘導するユニークな設計になっています。
- id: 167
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）では、交通はどの方向に進みますか？
  choices:
    A: 時計回り
    B: 反時計回り
    C: 「8の字」のパターン
    D: 中央の島を直進で通り抜ける
  answer: B
  explanation: ラウンドアバウトは、中央の島の周りを反時計回りに交通を誘導する交差点です。
- id: 168
  category: signs_and_signals
  question: ラウンドアバウトに設置されていない交通制御装置は次のうちどれですか？
  choices:
    A: 譲れ（Yield）の標識
    B: 方向指示標識
    C: 路面標示
    D: 一時停止標識と交通信号機
  answer: D
  explanation: ラウンドアバウトには一時停止標識や交通信号機はありません。譲れ（Yield）の標識、方向指示標識、および路面標示によって交差点内の交通が誘導されます。
- id: 169
  category: safe_driving_rules
  question: 1車線のラウンドアバウトから出る際、ドライバーはどのようにすべきですか？
  choices:
    A: 完全に停止してから、右折する。
    B: 合図を出し、横断歩道にいる人に譲りながら、右側に流出する。
    C: 交通の流れを維持するため、合図を出さずに加速して出る。
    D: 出る前に左車線に変更する。
  answer: B
  explanation: 1車線のラウンドアバウトから出る際は、合図を出し、右側に流出します。その際、横断歩道にいる歩行者などに道を譲らなければなりません。
- id: 170
  category: sharing_the_road
  question: 経験豊富な自転車利用者が、自動車と同じようにラウンドアバウトを走行する場合、どのように通行すべきですか？
  choices:
    A: 車両の邪魔にならないよう、縁石に沿って走る。
    B: 車両に追い越されないよう、車線の中央を走行する。
    C: トラックエプロン（中央の島の外周）の上を走る。
    D: 交通の流れに逆らって走る。
  answer: B
  explanation: 自動車と同じようにラウンドアバウトを走行する経験豊富なサイクリストは、縁石に寄って走るべきではありません。車両による危険な追い越しを防ぐため、車線の中央を走行する必要があります。
- id: 171
  category: safe_driving_rules
  question: 複数車線の環状交差点（ラウンドアバウト）を走行する際のルールとして正しいものはどれですか？
  choices:
    A: 出口に到達するために、交差点内で車線変更を行う。
    B: 死角を避けるため、トラックやバスを素早く追い越す。
    C: 交差点内では車線変更をしてはいけない。
    D: 出口に関わらず、常に外側の車線を走行する。
  answer: C
  explanation: 複数車線の環状交差点（ラウンドアバウト）を走行する際は、交差点内で車線変更を行ってはいけません。
- id: 172
  category: sharing_the_road
  question: 複数車線の環状交差点で、トラックやバスを追い越したり、その横を走行したりすることを避けるべきなのはなぜですか？
  choices:
    A: それらの車両は乗用車よりもはるかに速く走ることが義務付けられているから。
    B: それらの車両は車線をまたいで走行したり、こちらの車両が見えていなかったりする場合があるから。
    C: それらの車両は環状交差点への進入が許可されておらず、予測不能な動きをする可能性があるから。
    D: それらの車両は右左折時に必ず中央島（センターアイランド）を利用しなければならないから。
  answer: B
  explanation: 環状交差点内では、トラックやバスを追い越したり横を走行したりしてはいけません。これらの大型車両は車線をまたいで走行する場合や、死角のためにあなたの車を認識できない場合があるためです。
- id: 173
  category: defensive_driving
  question: 舗装路と比較して、砂利道を走行する際はどのように運転を調整すべきですか？
  choices:
    A: 砂利の上で勢いを維持するために、より速く走行する。
    B: 横滑りを避けるために、急ハンドルを切る。
    C: 停止する際は、強く素早くブレーキをかける。
    D: 速度を落とし、急ハンドルを避け、車間距離を長く取る。
  answer: D
  explanation: 砂利道での走行はタイヤの摩擦力（トラクション）を低下させます。速度を落とし、急ハンドルを避け、緩やかに加減速を行い、車間距離を十分に取ってください。
- id: 174
  category: safe_driving_rules
  question: 砂利道によく見られる「信号や標識のない交差点（無制御交差点）」について、正しい記述はどれですか？
  choices:
    A: 信号機によって制御されているが、標識はない。
    B: 「譲れ（Yield）」や「一時停止（Stop）」の標識によって制御されていない。
    C: 常に右側のドライバーが停止することを義務付けている。
    D: 都市部にのみ存在する。
  answer: B
  explanation: 信号や標識のない交差点は砂利道でより一般的です。これらは「譲れ」や「一時停止」の標識で制御されていないため、すべてのドライバーは注意を払い、停止できる準備をしておく必要があります。
- id: 175
  category: safe_driving_rules
  question: 信号や標識のない交差点では、どの車両が優先権（Right-of-way）を譲るべきですか？
  choices:
    A: 右側から来た車両
    B: 左側から来た車両
    C: より大きな車両
    D: より速く走行している車両
  answer: B
  explanation: 信号や標識のない交差点では、左側の車両が優先権を譲らなければなりません。交差点に車両がいない、あるいは相手の車両が止まってくれると決して思い込まないでください。
- id: 176
  category: safe_driving_rules
  question: 田舎道で極端に埃っぽい状況のとき、自分の車を他者から見えやすくするために何をすべきですか？
  choices:
    A: ハイビーム（走行用前照灯）を使用する。
    B: ハザードランプを点灯させる。
    C: ロービーム（すれ違い用前照灯）を使用する。
    D: 定期的にクラクションを鳴らす。
  answer: C
  explanation: マニュアルでは、極端に埃っぽい状況で他者からの視認性を高めるために、ロービームを使用することを推奨しています。
- id: 177
  category: defensive_driving
  question: 夜間、対向車のヘッドライトで目がくらんだ場合、どこを見るべきですか？
  choices:
    A: 対向車のヘッドライトを直視する。
    B: 道路の中央線を見る。
    C: 路肩の右端にある白線を見る。
    D: バックミラーを見る。
  answer: C
  explanation: 他の車両のヘッドライトで目がくらんだ場合は、速度を落とし、まぶしさが消えるまで路肩の右端にある白線を見てください。
- id: 178
  category: defensive_driving
  question: 道路上に動物が現れ、停止する時間がない場合に推奨される行動は何ですか？
  choices:
    A: 左に急ハンドルを切る。
    B: 右に急ハンドルを切る。
    C: クラクションを鳴らして加速する。
    D: 急ハンドルを切ったり進路を変えたりしない。
  answer: D
  explanation: 動物に遭遇し、停止する時間がない場合は、急ハンドルを切ったり進路を変えたりしないでください。そうすることで、より深刻な衝突事故につながる可能性が高くなるためです。
- id: 179
  category: sharing_the_road
  question: 大型トラックの死角、いわゆる「ノーゾーン（no-zone）」を走行しているかどうかをどうやって判断しますか？
  choices:
    A: 制限速度ちょうどで走行しているとき。
    B: トラックのサイドミラーにトラックの運転手の姿が見えないとき。
    C: トラックの後ろを車3台分以上の距離を空けて走行しているとき。
    D: トラックのウィンカーが点滅しているとき。
  answer: B
  explanation: 大型トラックには「ノーゾーン」と呼ばれる死角があります。トラックのミラーに運転手の姿が見えない場合、トラックの運転手からもあなたの姿は見えていません。
- id: 180
  category: sharing_the_road
  question: 交差点で大型トラックと縁石の間に割り込むのを避けるべきなのはなぜですか？
  choices:
    A: トラックは右折を安全に行うために、左側に大きく膨らんで曲がることが多いため。
    B: トラックは乗用車よりも速く加速する可能性があるため。
    C: いかなる状況でもトラックを右側から追い越すことは違法であるため。
    D: トラックの排気ガスで視界が遮られるため。
  answer: A
  explanation: トラックの運転手は、安全に右折するために左側に大きく膨らんでハンドルを切る必要がある場合があります。トラックと縁石の間に割り込むと、衝突事故の可能性が高まります。
- id: 181
  category: sharing_the_road
  question: 自動車と二輪車の衝突事故が最も発生しやすい場所はどこですか？
  choices:
    A: 州間高速道路上
    B: 交差点
    C: 田舎の砂利道
    D: 駐車場
  answer: B
  explanation: 交差点は、自動車と二輪車の衝突事故が最も発生しやすい場所です。右左折する前に、二輪車の存在を確認し、その速度を把握するようにしてください。
- id: 182
  category: sharing_the_road
  question: 通常の条件下で二輪車の後ろを走行する場合、推奨される最小の車間距離はどれくらいですか？
  choices:
    A: 1〜2秒
    B: 3〜4秒
    C: 5〜6秒
    D: 7〜8秒
  answer: B
  explanation: 二輪車の後ろを走行するときは、少なくとも3〜4秒の車間距離を空けてください。これにより、二輪車が緊急時に回避行動をとったり停止したりするための十分なスペースを確保できます。
- id: 183
  category: sharing_the_road
  question: 道路上で自転車を追い越す際の適切な手順は何ですか？
  choices:
    A: クラクションを鳴らし、同じ車線内を接近して通過する
    B: 隣の車線に半分はみ出して追い越す
    C: 完全に車線を変更し、他の車両と同様に自転車に車線全体を譲る
    D: 加速して、同じ車線内をできるだけ早く通過する
  answer: C
  explanation: 自転車を追い越すときは、他の車両を追い越すときと同じように、完全に車線を変更して自転車に車線全体を譲らなければなりません。
- id: 184
  category: safe_driving_rules
  question: 歩行者のために停止または減速している他の車両を、決して追い越してはいけないのはなぜですか？
  choices:
    A: その車両がUターンの準備をしている可能性があるため。
    B: 交差点付近での車線変更は違法であるため。
    C: 停止車両に近づいたときに、歩行者が見えない可能性があるため。
    D: 停止している車両が突然加速する可能性があるため。
  answer: C
  explanation: 歩行者のために停止または減速している車両を追い越してはいけません。停止車両の陰にいる歩行者が、近づくまで見えない可能性があるからです。
- id: 185
  category: driver_responsibility
  question: アイオワ州では、閉め切られた暑い車内に人や動物が閉じ込められており、救護が必要な場合、どのような行動が法律で認められていますか？
  choices:
    A: 車両の窓を割ってもよい。
    B: 車両を日陰まで牽引してもよい。
    C: いかなる行動をとる前にも、警察の到着を待たなければならない。
    D: 鍵を開けてもよいが、車両を損傷させてはならない。
  answer: A
  explanation: アイオワ州では、車内に閉じ込められた人や動物に救護を提供するために、車両の窓を割ることは法律で認められています。
- id: 186
  category: safe_driving_rules
  question: 悪天候時に使用してはいけない車両の機能はどれですか？
  choices:
    A: ロービーム（すれ違い用前照灯）
    B: ワイパー
    C: デフロスター（除霜装置）
    D: クルーズコントロール
  answer: D
  explanation: 悪天候の中で運転しなければならない場合は、速度を落とし、車間距離を長く取ってください。悪天候時にはクルーズコントロールを使用してはいけません。
- id: 187
  category: safe_driving_rules
  question: 田舎道の踏切に共通する特徴は何ですか？
  choices:
    A: 常に遮断機が設置されている。
    B: 通常、赤い点滅灯、警報ベル、遮断機が設置されていない。
    C: 常に明るいネオンの路面標示がある。
    D: 路面よりも高い位置にある。
  answer: B
  explanation: 主要道路の多くの踏切とは異なり、田舎道の踏切には通常、赤い点滅灯、警報ベル、遮断機、または路面標示がありません。
- id: 188
  category: defensive_driving
  question: アイオワ州でシカとの衝突事故が最も多く発生するのは何月ですか？
  choices:
    A: 1月、2月、3月
    B: 6月、7月、8月
    C: 10月、11月、5月
    D: 12月、4月、9月
  answer: C
  explanation: 10月、11月、5月はシカとの衝突事故のピーク月ですが、事故は一年中いつでも発生する可能性があります。
- id: 189
  category: sharing_the_road
  question: 二輪車の方向指示器（ウィンカー）に特に注意しなければならないのはなぜですか？
  choices:
    A: 日中は暗すぎて見えないことが多いため。
    B: 自動的に消えないため、ライダーが消し忘れることがあるため。
    C: 自動車の方向指示器よりも点滅が早いため。
    D: 二輪車には方向指示器の装備が義務付けられていないため。
  answer: B
  explanation: 二輪車の方向指示器は自動的に消えないため、ライダーが曲がり終わった後に消し忘れることがあります。ライダーの進路に入る前に、ライダーが何をしようとしているのかを必ず確認してください。
- id: 190
  category: safe_driving_rules
  question: 濡れた路面や滑りやすい路面を走行する場合、車間距離をどのようにすべきですか？
  choices:
    A: 2秒に短縮する
    B: 3秒を維持する
    C: 5〜6秒に延ばす
    D: 10秒に延ばす
  answer: C
  explanation: マニュアルによると、濡れた路面や滑りやすい路面では、通常よりもゆっくり運転し、車間距離を5〜6秒に延ばす必要があります。
- id: 191
  category: safe_driving_rules
  question: 悪天候時に運転する際、決して使用してはいけない車両の機能はどれですか？
  choices:
    A: デフロスター
    B: ロービーム・ヘッドライト
    C: ワイパー
    D: クルーズコントロール (Cruise control)
  answer: D
  explanation: マニュアルには「悪天候時にはクルーズコントロールを使用しないでください」と明記されており、濡れた路面、滑りやすい路面、凍結路面、または積雪路面についてもこの警告が繰り返されています。
- id: 192
  category: defensive_driving
  question: SUVやピックアップトラックを含む車両を押し流すのに、流れる水はどのくらいの深さが必要ですか？
  choices:
    A: 6インチ
    B: 12インチ
    C: 18インチ
    D: 24インチ
  answer: A
  explanation: マニュアルによると、流れる水は非常に強力であり、わずか6インチ（約15cm）の水深でも、SUVやピックアップトラックを含む車両を押し流す可能性があります。
- id: 193
  category: defensive_driving
  question: 車が水に流され水没した場合、推奨される脱出方法はどれですか？
  choices:
    A: すぐにフロントガラスを蹴り破る
    B: ドアを開けやすくするため、車内に水が満たされるのを待つ
    C: 水がドアハンドルに達する前に窓を下ろす
    D: 水圧に抗ってすぐにドアを開ける
  answer: B
  explanation: マニュアルでは、車が水没した場合は落ち着いて車内に水が満たされるのを待つようアドバイスしています。車内が水で満たされると、水圧の差がなくなりドアが開きやすくなるためです。
- id: 194
  category: safe_driving_rules
  question: 霧の中を運転する際、ハイビームの使用を避けるべきなのはなぜですか？
  choices:
    A: 車のバッテリーの消耗が早すぎるため
    B: 霧に反射して眩しさを引き起こし、視界が悪くなるため
    C: 道路の白線が見えにくくなるため
    D: ヘッドライトの部品が過熱する可能性があるため
  answer: B
  explanation: マニュアルには、ハイビームは霧に反射して眩しさを引き起こし、視界を悪化させるため、ロービームまたはフォグランプを使用すべきであると記載されています。
- id: 195
  category: defensive_driving
  question: 運転中に竜巻警報が発令され、シェルターに避難できない場合、車内に留まるならどうすべきですか？
  choices:
    A: 橋や高架の下に駐車する
    B: 高速で運転して竜巻から逃げようとする
    C: 車を停め、窓より低い位置に身をかがめ、シートベルトを締めたまま頭を覆う
    D: 車から出て、保護のために車の横に立つ
  answer: C
  explanation: シェルターに避難できない場合、マニュアルでは、車を路肩に寄せて停め、窓より低い位置に身を伏せ、シートベルトを締めたまま、手や物で頭を覆うようアドバイスしています。
- id: 196
  category: safe_driving_rules
  question: 橋や高架道路が特にブラックアイス（薄い氷の膜）が発生しやすいのはなぜですか？
  choices:
    A: 通常、コンクリートではなく金属で作られているため
    B: 路面の上と下の両方を空気が循環するため、水分がすぐに凍結するから
    C: 除雪車が通常の道路ほど頻繁に橋を除雪しないため
    D: 氷点下の空気に近い高い場所にあるため
  answer: B
  explanation: 橋や高架道路では、路面の上と下の両方を空気が循環し、水分が急速に凍結するため、ブラックアイスが発生しやすくなります。
- id: 197
  category: safe_driving_rules
  question: 氷雪路を運転する場合、通常の路面状況と比較して停止距離は最大で何倍になりますか？
  choices:
    A: 2倍
    B: 5倍
    C: 10倍
    D: 20倍
  answer: C
  explanation: マニュアルでは、氷や雪の上では停止距離が10倍長くなる可能性があるため、停止を予測するかなり前から減速を開始すべきであると警告しています。
- id: 198
  category: sharing_the_road
  question: 除雪車の一般的な作業速度はどれくらいですか？
  choices:
    A: 時速15〜25マイル
    B: 時速25〜35マイル
    C: 時速35〜45マイル
    D: 時速45〜55マイル
  answer: B
  explanation: マニュアルによると、除雪車は通常、時速25〜35マイルで作業しています。多くのドライバーがこれに気づかず、後ろから追突する事故が発生しています。
- id: 199
  category: sharing_the_road
  question: 除雪車と同じ道路を走行している際、決して追い越しを試みてはいけない場所はどこですか？
  choices:
    A: 左側
    B: 多車線道路
    C: 路肩側
    D: 追い越し車線
  answer: C
  explanation: マニュアルには「除雪車の路肩側を追い越してはいけません。除雪車は雪を路肩側に押し出します」と明記されています。
- id: 200
  category: vehicle_information
  question: 走行中にエンジンの回転が止まった（エンストした）場合、どのようなことが予想されますか？
  choices:
    A: ハンドルが完全にロックされる
    B: ブレーキが全く効かなくなる
    C: ハンドルの操作が重くなり、ブレーキペダルを非常に強く踏み込む必要が生じる
    D: 車両が直ちに急停車する
  answer: C
  explanation: エンジンが停止した場合、マニュアルには、ハンドル操作は困難になりますが回すことは可能であり、ブレーキも作動しますが、ブレーキペダルを非常に強く踏み込む必要があると記されています。
- id: 201
  category: vehicle_information
  question: ブレーキが効かなくなった場合、最初にとるべき行動は何ですか？
  choices:
    A: すぐにニュートラルにシフトする
    B: ブレーキペダルを数回ポンピングする（繰り返し踏む）
    C: できるだけ速く、強くパーキングブレーキをかける
    D: エンジンを切る
  answer: B
  explanation: ブレーキが効かなくなった場合、最初のステップはブレーキペダルを数回ポンピングすることです。これにより、多くの場合、停止するのに十分なブレーキ圧を回復させることができます。
- id: 202
  category: vehicle_information
  question: 走行中にアクセルペダルが戻らなくなった場合、どうすべきですか？
  choices:
    A: 走行中にすぐエンジンを切る
    B: 素早くニュートラルにシフトし、路肩に寄せて停車する
    C: ブレーキペダルを素早くポンピングする
    D: 低いギアにシフトし、溝に向かってハンドルを切る
  answer: B
  explanation: アクセルペダルが固まった場合、マニュアルでは、道路から目を離さず、素早くニュートラルにシフトし、安全な場所で路肩に寄せて停車した後、エンジンを切るよう指示しています。
- id: 203
  category: driver_responsibility
  question: 州法に基づき、負傷、死亡、または1,500ドルを超える物損を伴う事故が発生した場合、運転免許の停止を避けるために何時間以内に報告しなければなりませんか？
  choices:
    A: 24時間以内
    B: 48時間以内
    C: 72時間以内
    D: 96時間以内
  answer: C
  explanation: このような事故を警察に報告することは州法で定められています。事故発生から72時間以内に報告しなかった場合、運転免許の停止やさらなる罰則の対象となります。
- id: 204
  category: vehicle_information
  question: 車両が走行中にイグニッションからキーを抜くとどうなりますか？
  choices:
    A: エンジンは停止するが、ステアリング操作は通常通り行える
    B: ハンドルがロックされ、制御不能になる可能性がある
    C: ブレーキが自動的にかかる
    D: 車両は安全に惰性走行して停止する
  answer: B
  explanation: マニュアルでは、走行中にキーを抜かないよう警告しています。ハンドルがロックされ、車両の制御ができなくなり、衝突事故につながる恐れがあるためです。
- id: 205
  category: driver_responsibility
  question: 事故後に警察官とやり取りする際、提示できるように準備しておくべき書類はどれですか？
  choices:
    A: 自動車保険証、車両登録証、および運転免許証
    B: 出生証明書と社会保障カード（SSN）
    C: 車両所有権証（タイトル）と購入証明書
    D: 医療記録と運転免許証
  answer: A
  explanation: マニュアルには、警察官に対して自動車保険の情報、車両登録証、および運転免許証を提示できる準備をしておかなければならないと記載されています。
- id: 206
  category: driver_responsibility
  question: マニュアルによると、他のドライバーが関与する事故で自分に過失があるとみなされた場合、何をしなければなりませんか？
  choices:
    A: 現場で直ちに相手のドライバーに現金で支払う
    B: 相手に対して負担すべき費用について、保険会社と話し合う
    C: 相手のドライバーに運転免許証を預ける
    D: 警察が到着する前に現場を離れる
  answer: B
  explanation: マニュアルには、「他のドライバーが関与する事故で自分に過失があるとみなされた場合、相手に対してどのような費用をカバーする必要があるかについても話し合う必要があります」と記載されています。
- id: 207
  category: safe_driving_rules
  question: 警察官と接する際の一般的なルールは何ですか？
  choices:
    A: 直ちに自分の正当性を主張する
    B: 冷静さを保ち、指示に従う
    C: 車から降りて警察官に挨拶する
    D: 弁護士が来るまで話すことを拒否する
  answer: B
  explanation: マニュアルでは、警察官と接する際は冷静さを保ち、指示に従うようアドバイスしています。
- id: 208
  category: license_system
  question: 自閉症、または聴覚障害や難聴がある場合、運転免許証やIDカードに対してどのようなオプションが利用可能ですか？
  choices:
    A: 免許証やIDに識別表示を追加することを選択できる
    B: 常に医師の診断書を携帯することが義務付けられている
    C: 制限付き運転免許証を申請しなければならない
    D: 法的に自動車を運転することはできない
  answer: A
  explanation: マニュアルには、「自閉症、および/または聴覚障害や難聴がある場合は、免許証やIDに識別表示を追加することを選択できます」と記されています。
- id: 209
  category: license_system
  question: 自閉症や聴覚障害・難聴の表示は、警察官にとってどこで確認可能ですか？
  choices:
    A: 物理的な運転免許証またはIDカード上のみ
    B: 警察のデータベース内のみ
    C: 免許証/IDに印刷されており、かつ警察がドライバー情報を照会するデータベースでも確認できる
    D: 車両のフロントガラスに貼られた特別なステッカー
  answer: C
  explanation: マニュアルによると、この種の表示は免許証/IDに印刷されるほか、警察官がドライバーの情報を検索するために使用するデータベースでも確認できるようになっています。
- id: 210
  category: driver_responsibility
  question: 免許証に自閉症や聴覚障害・難聴の表示を追加する主な目的は何ですか？
  choices:
    A: ドライバーの交通違反金の支払いを免除するため
    B: ドライバーが障害者用駐車場を利用できるようにするため
    C: 交通取り締まりの際、警察官が適切な対応をとれるようにするため
    D: 救急隊に血液型を知らせるため
  answer: C
  explanation: マニュアルによると、警察官が表示を確認できるようにしておくことは、「警察官があなたと接する際により適切な準備を整えるのに役立ちます」。
- id: 211
  category: safe_driving_rules
  question: 交通量の多い通りや高速道路で、法執行機関の車両（パトカーなど）から停止の合図を受けた場合、車を寄せて停止するのに最も安全な場所はどこですか？
  choices:
    A: 中央分離帯
    B: 駐車場や交通量の少ない脇道
    C: 高速道路の左側の路肩
    D: 走行車線内
  answer: B
  explanation: マニュアルでは、交通量の多い通りや高速道路では、駐車場や交通量の少ない脇道に車を寄せるのが最も安全である場合があると助言しています。
- id: 212
  category: safe_driving_rules
  question: 法執行機関に車を止められる際、絶対に車を停止させてはいけない場所はどこですか？
  choices:
    A: 駐車場
    B: 交通量の少ない脇道
    C: 開けた場所
    D: 走行車線内
  answer: D
  explanation: マニュアルには、法執行機関の車両から停止の合図を受けた際、「走行車線内（travel lane）で停止してはならない」と明記されています。
- id: 213
  category: safe_driving_rules
  question: 交通取り締まりのために安全に車を寄せた後、車両をどのようにすべきですか？
  choices:
    A: 移動が必要な場合に備えてエンジンをかけたままにする
    B: 車のエンジンを切る
    C: ギアをニュートラルに入れ、パーキングブレーキのみをかける
    D: ハザードランプを点灯させ、エンジンをかけたままにする
  answer: B
  explanation: 交通取り締まりの際、マニュアルは運転者に対し、「車のエンジンを切り、手を見える位置に置き、冷静さを保ち、警察官の指示に従うこと」と指示しています。
- id: 214
  category: safe_driving_rules
  question: 交通取り締まりの間、手はどこに置いておくことが推奨されますか？
  choices:
    A: ポケットの中
    B: グローブボックス内の登録証を取ろうとする
    C: 見える位置（ハンドルの上が推奨される）
    D: 運転席側の窓の外
  answer: C
  explanation: マニュアルでは、交通取り締まりの間、「手を見える位置に置くこと（ハンドルの上が推奨される）」と運転者に助言しています。
- id: 215
  category: driver_responsibility
  question: アイオワ州の運転者用マニュアルは一般的な情報提供を目的としており、以下の代わりになるものではありません：
  choices:
    A: 運転教育コース
    B: 法的助言
    C: 有効な運転免許証
    D: 自動車保険
  answer: B
  explanation: マニュアルには、「本出版物は一般的な情報提供を目的としており、法的助言（legal advice）の代わりになるものではありません」という免責事項が含まれています。
- id: 216
  category: driver_testing
  question: 本試験の予約をする前に、知識試験の練習問題はどこで受けることができますか？
  choices:
    A: 地元の警察署のみ
    B: アイオワ州DOT（運輸局）のウェブサイト上
    C: アイオワ州DOTの公民権事務所に電話する
    D: 認可された自動車販売店
  answer: B
  explanation: マニュアルには、「iowadot.gov/mvd/driverslicense/manuals-and-practice-tests
    でオンラインの練習用知識試験を受けることができます」と記載されています。
- id: 217
  category: driver_responsibility
  question: 法執行官に提示できるよう準備しておかなければならない書類として、リストに含まれていないものはどれですか？
  choices:
    A: 自動車保険の情報
    B: 車両登録証
    C: 運転免許証
    D: 車両点検の証明書
  answer: D
  explanation: マニュアルには、提示すべき書類として自動車保険の情報、車両登録証、運転免許証が挙げられています。車両点検の証明書については言及されていません。
- id: 218
  category: driver_responsibility
  question: 英語能力が限られている人が特別な支援を必要とする場合、マニュアルによると誰に連絡すべきですか？
  choices:
    A: 地元のハイウェイパトロール
    B: アイオワ州DOT公民権局（Civil Rights）
    C: 保険会社
    D: 州議会
  answer: B
  explanation: マニュアルには、「障害のある方や英語能力が限られている方で、詳細な情報や特別な支援が必要な場合は、アイオワ州DOT公民権局（515-239-1111）までご連絡ください」と記載されています。
- id: 219
  category: driver_responsibility
  question: 事故の後、なぜ賠償責任保険（liability coverage）の補償内容を確認する必要があるのですか？
  choices:
    A: どの費用を支払う必要があり、何を受け取る資格があるかを評価するため
    B: 法的に車両を運転して帰宅できるかどうかを判断するため
    C: 警察に事故を報告する必要があるかどうかを確認するため
    D: 免許に追加される違反点数を計算するため
  answer: A
  explanation: 「ステップ4：保険会社への報告」において、マニュアルは「賠償責任保険の補償内容を参照し、どの費用を支払う必要があり、何を受け取る資格があるかを評価してください」と指示しています。
- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 減速し、注意して進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（一時停止）」標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に交通状況と歩行者を確認してください。
  id: 220
- image: yield.png
  category: signs_and_signals
  question: この標識は何をすることを求めていますか？
  choices:
    A: 完全停止する
    B: 加速して交通流に合流する
    C: 減速し、他の車両や歩行者に道を譲る（優先権を与える）
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「譲れ（YIELD）」の標識は、減速して他の車両や歩行者に道を譲らなければならないことを意味します。他の交通が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 221
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路に進入してはならない
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「進入禁止（DO NOT ENTER）」の標識は、この標識が設置されている道路やランプ（接続路）に進入してはならないことを意味します。通常、高速道路の出口ランプや一方通行の道路で見られ、進入すると対向車の進路に入ることになります。
  id: 222
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターン（転回）する
    B: 注意深く運転を続ける
    C: 停止して後退するか向きを変える。あなたは逆走しています。
    D: そのエリアを早く抜けるために加速する
  answer: C
  explanation: 赤と白の「逆走（WRONG WAY）」の標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に向きを変えるか後退してください。
  id: 223
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方通行（左方向）である
    C: 中央分離帯の左側を走行せよ
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「一方通行（ONE WAY）」の標識は、その通りの交通が矢印の指す一方向にのみ進むことを示しています。
  id: 224
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、その場所でのUターン（転回）が禁止されていることを意味します。
  id: 225
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が許可されていないことを意味します。
  id: 226
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: Uターン禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、その場所での右折が禁止されていることを意味します。
  id: 227
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先道幅が狭くなる
    B: この区間では他の車両を追い越してはならない
    C: この先対面通行
    D: 右側通行を維持せよ
  answer: B
  explanation: ペナント型（三角形）の白黒の「追い越し禁止区間（NO PASSING ZONE）」の標識は、そのエリアで他の車両を追い越すことが許可されていないことを意味します。これは追い越し禁止区間の始まりを示します。
  id: 228
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転者に何を指示していますか？
  choices:
    A: 右側に合流せよ
    B: 右折専用
    C: 分離帯や障害物の右側を通行せよ
    D: この先右車線終了
  answer: C
  explanation: 矢印が描かれた白い規制標識「右側通行（KEEP RIGHT）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 229
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 白い長方形に黒い文字の標識は規制標識です。速度制限の標識は、理想的な条件下でのそのエリアの法定最高速度を示しています。
  id: 230
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園またはサファリパークがある
    B: この地域では鹿が頻繁に道路を横断する
    C: この先に狩猟区域がある
    D: 近くに野生動物保護区がある
  answer: B
  explanation: 鹿のシルエットが描かれた黄色いひし形の標識は、この地域で鹿が頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 231
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先にスクールゾーンがある
    B: この先に歩行者横断路がある
    C: 近くにハイキングコースがある
    D: この先にバス停がある
  answer: B
  explanation: 歩行者の姿が描かれた黄色いひし形の標識は、この先に歩行者横断路があることを警告しています。道路を横断する歩行者のために停止できるよう準備してください。
  id: 232
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは通学路の横断歩道
    D: 病院周辺区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路の横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 233
- image: railroad_crossing.png
  category: signs_and_signals
  question: この円形の黄色い標識は何を警告していますか？
  choices:
    A: この先にラウンドアバウト（環状交差点）がある
    B: 病院周辺区域
    C: この先に踏切がある
    D: 追い越し禁止区間
  answer: C
  explanation: 黒いXと2つのRが描かれた円形の黄色い標識は、この先に踏切があることを知らせる事前警告標識です。速度を落とし、列車の音や姿を確認してください。
  id: 234
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型のクロスバック標識は踏切に設置されます。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  id: 235
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: この先で行き止まり
    B: 右折が必要
    C: この先に右カーブがある
    D: この先に回り道がある
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、この先にカーブがあることを警告しています。カーブに入る前に速度を落としてください。
  id: 236
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角を示している
    B: 大幅な減速が必要な急カーブを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 237
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道
    B: この先に1つのカーブがある
    C: 反対方向に続く2つの連続したカーブ
    D: この先にラウンドアバウトがある
  answer: C
  explanation: 背向（はいこう）カーブの標識は、この先に反対方向への2つのカーブがあることを警告しています。速度を落とし、道路が最初に一方へ、次に反対方向へ曲がることに備えてください。
  id: 238
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 1つの急カーブ
    B: 滑りやすい路面
    C: この先に連続するカーブや曲がり角がある
    D: この先に坂道がある
  answer: C
  explanation: 屈曲あり（ワインディング・ロード）の標識は、この先に連続するカーブや曲がり角があることを警告しています。速度を落とし、道路状況の変化に注意してください。
  id: 239
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の減少
    B: 他の道路からの交通の合流
    C: 分離高速道路の始まり
    D: 道路が1車線に狭まる
  answer: B
  explanation: 黄色いひし形の合流標識は、他の道路からの交通が自分の車線に合流してくることを警告しています。速度や位置を調整できるよう準備してください。
  id: 240
- image: road_narrows.png
  category: signs_and_signals
  id: 241
  question: この標識は何を警告していますか？
  choices:
    A: この先に橋がある
    B: この先で道幅が狭くなる
    C: 車線が終了する
    D: 中央分離帯のある道路が終了する
  answer: B
  explanation: この警戒標識は、この先の道幅が狭くなることを示しています。道幅が狭くなることに備え、車線内の走行位置を調整してください。
- image: divided_highway.png
  category: signs_and_signals
  id: 242
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 中央分離帯のある道路（Divided highway）の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先が中央分離帯や障壁によって対向車線が分離された道路（Divided highway）になることを警告しています。右側を通行してください。
- image: divided_highway_ends.png
  category: signs_and_signals
  id: 243
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある道路の始まり
    B: 中央分離帯のある道路が終了し、対面通行に戻る
    C: この先に合流地点がある
    D: この先で道路工事が行われている
  answer: B
  explanation: この標識は、中央分離帯のある道路が終了することを警告しています。対向車線が中央分離帯で分離されなくなります。対面通行に備えてください。
- image: two_way_traffic.png
  category: signs_and_signals
  id: 244
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある道路の始まり
    B: この先に追い越し区間がある
    C: この先に対面通行がある（車両が双方向に通行する）
    D: この先で車線移動がある
  answer: C
  explanation: この標識はこの先に対面通行があることを警告しています。一方通行の道路や中央分離帯のある道路から、対向車が来る道路に変わる可能性があります。
- image: slippery_when_wet.png
  category: signs_and_signals
  id: 245
  question: この標識はどのような路面状況を警告していますか？
  choices:
    A: 路面凍結のおそれ
    B: 濡れている時に滑りやすくなる
    C: この先に曲がりくねった道がある
    D: 路面に凹凸がある
  answer: B
  explanation: 「スリップ注意（Slippery when wet）」の標識は、雨などで路面が濡れている時に非常に滑りやすくなることを警告しています。速度を落とし、急ブレーキや急ハンドルを避けてください。
- image: hill.png
  category: signs_and_signals
  id: 246
  question: この標識は何を警告していますか？
  choices:
    A: 路面の隆起
    B: 路面の凹凸
    C: この先に急な坂道または勾配がある
    D: 道路工事
  answer: C
  explanation: この標識はこの先に急な坂道や勾配があることを警告しています。特にトラックや牽引中の場合は、速度を調整し、低いギアにシフトダウンする必要があるかもしれません。
- image: signal_ahead.png
  category: signs_and_signals
  id: 247
  question: この標識は何に備えるよう警告していますか？
  choices:
    A: この先に一時停止標識がある
    B: この先に信号機がある
    C: 学校付近の横断歩道がある
    D: 警察の検問所がある
  answer: B
  explanation: この標識はこの先に信号機があることを警告しています。赤信号や黄信号の場合に停止できるよう準備してください。この標識は、遠くから信号機が見えにくい場所に設置されることが多いです。
- image: stop_ahead.png
  category: signs_and_signals
  id: 248
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 譲れ（Yield）の標識
    B: 信号機
    C: 一時停止しなければならない停止標識
    D: スピードバンプ
  answer: C
  explanation: この標識はこの先に一時停止標識があることを警告しています。減速を開始し、停止標識の場所で完全に停止できるよう準備してください。
- image: cross_road.png
  category: signs_and_signals
  id: 249
  question: この標識は何を警告していますか？
  choices:
    A: この先に踏切がある
    B: この先に十字路または交差点がある
    C: この先に病院がある
    D: 歩行者横断路がある
  answer: B
  explanation: この標識は、この先に十字路または四差路の交差点があることを警告しています。脇道から進入してくる車両に注意してください。
- image: side_road.png
  category: signs_and_signals
  id: 250
  question: この標識は何を警告していますか？
  choices:
    A: この先に丁字路（T字路）がある
    B: 右側から合流する脇道がある
    C: 道路のカーブがある
    D: 行き止まり
  answer: B
  explanation: この標識は、右側から脇道が合流していることを警告しています。脇道から幹線道路に進入してくる車両に注意してください。
- image: added_lane.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 車線が合流している
    B: 車線が終了する
    C: 新しい車線が追加される（合流の必要なし）
    D: 右折必須
  answer: C
  explanation: 付加車線の標識は、合流を必要とせずに新しい車線が高速道路に加わることを意味します。ランプ（接続路）から進入する車両には、専用の新しい車線が用意されています。
  id: 251
- image: no_parking.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: いかなる時の停車
    B: この区域での駐車
    C: 停車またはアイドリング
    D: 荷物の積み下ろし
  answer: B
  explanation: 赤と白の「駐車禁止（NO PARKING）」の標識は、その区域に車両を駐車できないことを意味します。乗客の乗り降りのために短時間停車することは可能です。
  id: 252
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転者
  answer: C
  explanation: 車椅子のシンボルが描かれた青い標識は、障害者のために予約された駐車スペースを示しています。有効な障害者用駐車許可証またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反には高額な罰金が科せられます。
  id: 253
