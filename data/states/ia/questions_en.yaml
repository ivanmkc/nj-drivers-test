metadata:
  source: 2025 Iowa Driver's Manual (iowadot.gov)
  total_questions: 253
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: safe_driving_rules
  question: According to the basic safety rules in the manual, who is required to
    buckle up in the vehicle?
  choices:
    A: Only the driver and front-seat passengers
    B: Only children under the age of 18
    C: Everyone, no matter where they are sitting in the vehicle
    D: Only passengers in the back seat
  answer: C
  explanation: The manual states as a basic safety rule to 'Buckle up, no matter where
    you're sitting in the vehicle.'
- id: 2
  category: safe_driving_rules
  question: Which of the following is listed as a basic safety rule to get you started
    as a safe driver?
  choices:
    A: Drive 5 mph under the speed limit
    B: Give your full attention to the task of driving
    C: Only use hands-free devices while driving
    D: Keep your headlights on at all times
  answer: B
  explanation: The manual explicitly lists 'Give your full attention to the task of
    driving' as one of the basic safety rules.
- id: 3
  category: license_system
  question: When visiting a driver's license service location in Iowa, which location
    must you visit?
  choices:
    A: You must visit the location closest to where you live
    B: You must visit the main DOT headquarters in Des Moines
    C: You can visit any Iowa DOT Service Center or County Treasurer's Office
    D: You can only visit a County Treasurer's Office if you are a new resident
  answer: C
  explanation: The manual states that there are service locations throughout the state
    at Iowa DOT Service Centers and County Treasurer's Offices, and 'You can visit
    any location; It doesn't have to be the one closest to where you live.'
- id: 4
  category: license_system
  question: At what age are you potentially eligible to renew your Iowa driver's license
    online?
  choices:
    A: 16 or older
    B: 18 or older
    C: 21 or older
    D: 25 or older
  answer: B
  explanation: According to the manual, some services, such as license renewal, are
    available online if you are age 18 or older and meet other requirements.
- id: 5
  category: license_system
  question: What does the manual warn about regarding online driver's license services?
  choices:
    A: Online services are only available during regular business hours
    B: There are websites that sell information the DOT provides for free
    C: You must pay an extra convenience fee to renew online
    D: Online renewal is only available for commercial drivers
  answer: B
  explanation: The manual warns that 'There are several websites out there selling
    information that we provide for free. They make you think you're getting a new
    driver's license, but you're not.'
- id: 6
  category: license_system
  question: In Iowa, you are required to have a permit or license if you operate which
    of the following on public roads?
  choices:
    A: A motor vehicle, motorcycle, or moped
    B: A bicycle or electric scooter
    C: A motorized wheelchair
    D: A farm tractor only
  answer: A
  explanation: 'The manual states: ''In Iowa, anyone operating a motor vehicle, motorcycle,
    or moped on public roads is required to have a permit or license.'''
- id: 7
  category: license_system
  question: You are considered an Iowa resident for driver's licensing purposes if
    you have lived in Iowa continuously for how many days?
  choices:
    A: 14 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: You are considered an Iowa resident if you have 'Lived in Iowa continuously
    for 30 days.'
- id: 8
  category: license_system
  question: Which of the following actions makes you an Iowa resident for the purposes
    of driver's licensing?
  choices:
    A: Staying in a hotel in Iowa for two weeks
    B: Enrolling your child in an Iowa public school
    C: Visiting family in Iowa for the summer
    D: Driving through Iowa on a cross-country road trip
  answer: B
  explanation: One of the criteria for being considered an Iowa resident for licensing
    purposes is if you have 'Enrolled your child in an Iowa public school.'
- id: 9
  category: license_system
  question: Which of these criteria establishes Iowa residency for driver's licensing
    purposes?
  choices:
    A: Registering to vote in this state
    B: Accepting a temporary, two-week job in Iowa
    C: Renting a car in Iowa
    D: Attending a weekend conference in Iowa
  answer: A
  explanation: The manual lists 'Registered to vote in this state' as one of the conditions
    that makes you an Iowa resident for driver's licensing purposes.
- id: 10
  category: license_system
  question: Under what condition do you NOT need an Iowa driver's license while driving
    a military vehicle?
  choices:
    A: If you are a veteran of the U.S. Armed Forces
    B: If you are driving a military vehicle while on duty with the U.S. Armed Forces
    C: If you are driving a military vehicle to a parade
    D: If you are a civilian contractor working on a military base
  answer: B
  explanation: The manual states you do NOT need a driver's license if you are 'Driving
    a military vehicle while on duty with the U.S. Armed Forces.'
- id: 11
  category: license_system
  question: You do NOT need an Iowa driver's license if you are driving farm equipment
    between the home farm and nearby farmland within what distance?
  choices:
    A: 2 miles
    B: 5 miles
    C: 10 miles
    D: 15 miles
  answer: A
  explanation: You do not need a license if you are 'Driving farm equipment between
    the home farm and any nearby farmland or farm operation within two miles.'
- id: 12
  category: license_system
  question: If you are a visitor or student in Iowa, do you need an Iowa driver's
    license to drive?
  choices:
    A: Yes, you must obtain an Iowa license within 30 days
    B: Yes, unless you are only staying for less than a week
    C: No, as long as you are driving with a current license from your home state
      or country
    D: No, but you must obtain a temporary visitor's driving permit
  answer: C
  explanation: You do NOT need an Iowa driver's license if you are 'Driving with a
    current license from your home state or country while in Iowa as a visitor or
    student.'
- id: 13
  category: alcohol_drugs_health
  question: Which of the following is explicitly listed in the manual's basic safety
    rules regarding alcohol and driving?
  choices:
    A: Drive sober
    B: Your blood alcohol concentration must be below 0.08%
    C: Do not drink within 4 hours of driving
    D: Only drive if you have had one drink or less
  answer: A
  explanation: The 'Important Message to Drivers' section lists 'Drive sober' as one
    of the basic safety rules.
- id: 14
  category: license_system
  question: Receiving what type of assistance makes you an Iowa resident for driver's
    licensing purposes?
  choices:
    A: Federal student loans
    B: Public assistance from the state of Iowa
    C: Social Security benefits
    D: Medicare benefits
  answer: B
  explanation: You are considered an Iowa resident for purposes of driver's licensing
    if you 'Receive public assistance from the state of Iowa.'
- id: 15
  category: license_system
  question: Under which condition are you NOT required to have an Iowa driver's license?
  choices:
    A: Driving a commercial delivery truck for a local business.
    B: Driving farm equipment between the home farm and farmland within two miles.
    C: Driving a moped on a public highway.
    D: Driving a personal vehicle to a high school.
  answer: B
  explanation: According to the manual, you do not need a driver's license if you
    are driving farm equipment between the home farm and any nearby farmland or farm
    operation within two miles.
- id: 16
  category: driver_responsibility
  question: What documents must drivers of vehicles in Iowa carry with them while
    driving?
  choices:
    A: License, birth certificate, and vehicle title.
    B: Social Security card, license, and proof of registration.
    C: License or permit, current proof of registration, and an insurance card.
    D: Insurance card, vehicle title, and a passport.
  answer: C
  explanation: Drivers of vehicles in Iowa must carry their license or permit, current
    proof of registration, and an insurance card (printed or electronic) to verify
    proof of liability insurance.
- id: 17
  category: penalties_and_points
  question: What is a possible consequence of failing to carry your license, proof
    of registration, and insurance card while driving?
  choices:
    A: Immediate license revocation for one year.
    B: Fines and possible impoundment of the vehicle.
    C: A mandatory defensive driving course.
    D: Community service and a written warning.
  answer: B
  explanation: Failure to carry your license, current proof of registration, and an
    insurance card could result in fines and possible impoundment of the vehicle.
- id: 18
  category: driver_testing
  question: Which of the following is a mandatory health screening when applying for
    an Iowa driver's license?
  choices:
    A: A hearing test.
    B: A physical endurance test.
    C: A vision screening.
    D: A medical clearance form from a doctor.
  answer: C
  explanation: When you apply for your license, you will be required to complete a
    vision screening.
- id: 19
  category: signs_and_signals
  question: What type of information does a blue traffic sign provide?
  choices:
    A: General warnings about road hazards.
    B: Direction to historical sites and parks.
    C: Services for travelers such as rest areas, hospitals, and lodging.
    D: Information regarding enforceable laws and ordinances.
  answer: C
  explanation: Blue signs indicate services for travelers and direct you to places
    such as rest areas, tourist sites, hospitals, lodging, fuel stations, and restaurants.
- id: 20
  category: signs_and_signals
  question: What does a fluorescent pink traffic sign indicate?
  choices:
    A: Pedestrian and school warnings.
    B: Incident management such as crash clean up or debris removal.
    C: Road work and temporary traffic control.
    D: Recreation and cultural points of interest.
  answer: B
  explanation: Fluorescent pink signs are warning and guide signs for incident management
    such as crash clean up, debris removal, traffic, etc.
- id: 21
  category: signs_and_signals
  question: 'A pennant-shaped traffic sign is found on the left side of the road and
    warns drivers of:'
  choices:
    A: A railroad crossing ahead.
    B: A school zone.
    C: A no passing zone.
    D: A yield requirement.
  answer: C
  explanation: A pennant-shaped sign will be on the left side of the road and warns
    you of a no passing zone.
- id: 22
  category: safe_driving_rules
  question: 'Maximum speed limits shown on speed limit signs are intended for:'
  choices:
    A: Ideal driving conditions.
    B: Wet or slippery road conditions.
    C: Heavy traffic conditions.
    D: Nighttime driving only.
  answer: A
  explanation: Maximum speed limits are for ideal driving conditions. You must reduce
    your speed when conditions require it, such as when the roadway is slippery or
    it is difficult to see.
- id: 23
  category: signs_and_signals
  question: What does a regulatory sign with a red circle and a red slash over a symbol
    mean?
  choices:
    A: You must yield to the vehicle shown in the symbol.
    B: You cannot do the action shown by the symbol.
    C: You are approaching a hazard related to the symbol.
    D: The road is closed ahead.
  answer: B
  explanation: Some regulatory signs have a red circle with a red slash over a symbol.
    These indicate you cannot do something; for example, no left turn, no right turn,
    or no U-turn.
- id: 24
  category: safe_driving_rules
  question: When approaching a stop sign, what must you do if there is a stop line
    present?
  choices:
    A: Slow down and roll past the line if the intersection is clear.
    B: Stop completely at the stop line before proceeding.
    C: Stop only if cross traffic is approaching.
    D: Stop past the stop line to get a better view of traffic.
  answer: B
  explanation: A stop sign means you must come to a full stop. You must stop at the
    stop line if one is present, and then pull forward if necessary when it is safe
    to do so.
- id: 25
  category: safe_driving_rules
  question: What should you do when you see a diamond-shaped warning sign indicating
    a hill ahead?
  choices:
    A: Accelerate to maintain your speed down the hill.
    B: Shift your vehicle into neutral.
    C: Check your brakes before going down the hill.
    D: Pull over and wait for larger vehicles to pass.
  answer: C
  explanation: The hill sign is a warning that the road ahead goes down a hill. The
    manual states you should check your brakes before going down the hill.
- id: 26
  category: sharing_the_road
  question: How should you react when you see a warning sign for horse-drawn vehicles
    or farm machinery?
  choices:
    A: Honk your horn to alert them of your presence.
    B: Maintain your speed and pass quickly.
    C: Reduce your speed and pass slowly.
    D: Stop your vehicle and wait for them to pull over.
  answer: C
  explanation: When you see signs for horse-drawn vehicles or farm machinery, you
    must be alert for slow-moving vehicles on the roadways, reduce your speed, and
    pass slowly.
- id: 27
  category: sharing_the_road
  question: According to the 2024 Iowa traffic code update, which of the following
    is considered a 'pedestrian conveyance'?
  choices:
    A: A horse-drawn carriage.
    B: A farm tractor.
    C: A low-speed motorcycle.
    D: A human-powered device like a wheelchair, stroller, or bicycle.
  answer: D
  explanation: Pedestrian conveyances are defined as any human-powered device by which
    a pedestrian may move, including wheelchairs, strollers, bicycles, skateboards,
    scooters, and electric personal assistive mobility devices.
- id: 28
  category: sharing_the_road
  question: How must drivers treat individuals using skateboards, scooters, or electric
    personal assistive mobility devices in crosswalks?
  choices:
    A: Drivers have the right of way over these devices.
    B: Drivers must yield the right of way to them, just as they would for pedestrians
      on foot.
    C: Drivers only need to yield if the person is under 18 years old.
    D: Drivers should honk to warn them to clear the crosswalk.
  answer: B
  explanation: The 2024 law states that vehicles must yield the right of way to pedestrians
    on foot and those using any human-powered device, known as a pedestrian conveyance
    (which includes skateboards, scooters, etc.).
- id: 29
  category: signs_and_signals
  question: What does a reflective orange triangle on the rear of a vehicle indicate?
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is traveling 35 mph or less
    C: The vehicle is an emergency responder
    D: The vehicle is broken down and cannot move
  answer: B
  explanation: A reflective orange triangle on the rear of a vehicle means it is a
    slow-moving vehicle traveling 35 mph or less, often seen on road maintenance equipment
    or farm vehicles.
- id: 30
  category: signs_and_signals
  question: What specific information do mile markers provide on an Interstate?
  choices:
    A: The speed limit for the current stretch of highway
    B: The number of miles to the next rest area
    C: The number of miles from where the Interstate route entered the state
    D: The distance to the nearest hospital
  answer: C
  explanation: Mile markers show the number of miles from where the Interstate route
    entered the state you are traveling in, and can be used to give your exact location
    in an emergency.
- id: 31
  category: signs_and_signals
  question: How should a driver respond to a flashing red traffic signal?
  choices:
    A: Yield to oncoming traffic and proceed without stopping
    B: Treat it the same as a stop sign
    C: Stop and wait for the light to turn green
    D: Proceed with caution without stopping
  answer: B
  explanation: The manual states that when encountering a flashing red traffic signal,
    you must treat it the same as a stop sign.
- id: 32
  category: signs_and_signals
  question: What does a flashing yellow arrow indicate for a driver turning left?
  choices:
    A: Oncoming traffic must stop, so you have the right-of-way
    B: You must come to a complete stop and wait for a green arrow
    C: Yield to oncoming traffic and pedestrians, then turn left proceeding with caution
    D: The signal is broken and you must treat it as a four-way stop
  answer: C
  explanation: A flashing yellow arrow means you must yield to oncoming traffic and
    pedestrians, then turn left proceeding with caution, because oncoming traffic
    has a green light.
- id: 33
  category: signs_and_signals
  question: What is the proper action when approaching a solid yellow traffic light?
  choices:
    A: Speed up to clear the intersection before it turns red
    B: Stop immediately, even if you are in the middle of the intersection
    C: Do not enter the intersection if you can stop safely
    D: Treat it as a yield sign and proceed
  answer: C
  explanation: 'For a solid yellow light, the rule is: Do not enter the intersection
    if you can stop safely. If you cannot stop safely, proceed through the intersection
    with caution.'
- id: 34
  category: safe_driving_rules
  question: Which of the following vehicles is required to stop within 15 to 50 feet
    of railroad tracks before crossing?
  choices:
    A: A passenger vehicle towing a boat
    B: A driver carrying passengers for hire, such as an Uber or Lyft
    C: A motorcycle
    D: A delivery van carrying non-hazardous packages
  answer: B
  explanation: All school buses, charter buses, drivers carrying passengers for hire
    (such as Uber or Lyft), and vehicles placarded for hazardous materials must stop
    within 15 to 50 feet of railroad tracks before crossing.
- id: 35
  category: safe_driving_rules
  question: What should you do first if your vehicle stalls on railroad tracks?
  choices:
    A: Stay in the vehicle and try to restart the engine
    B: Shift gears to try and push the vehicle off the tracks
    C: Get everyone out and far away immediately, even if you do not see a train
    D: Call a local tow truck company
  answer: C
  explanation: If your vehicle gets stuck or stalls at a crossing, you must get everyone
    out and far away immediately, even if you do not see a train.
- id: 36
  category: signs_and_signals
  question: Where can you find the emergency phone number to call if your vehicle
    is stuck on a railroad crossing?
  choices:
    A: On the reflective orange triangle
    B: On the blue and white Emergency Notification System (ENS) sign
    C: On the back of the crossbuck sign
    D: On the nearest mile marker
  answer: B
  explanation: The blue and white Emergency Notification System (ENS) sign contains
    the first phone number to call if a vehicle is stuck or stalls on the tracks,
    along with a crossing ID number.
- id: 37
  category: signs_and_signals
  question: How are passively protected railroad crossings marked?
  choices:
    A: With flashing red lights and lowering gates
    B: With a crossbuck and a stop or yield sign
    C: With a solid red traffic signal
    D: With a blue and white ENS sign only
  answer: B
  explanation: Passively protected railroad crossings do not have lights or gates.
    They will only be marked with a crossbuck and a stop or yield sign.
- id: 38
  category: safe_driving_rules
  question: When stopped at a railroad crossing, what is the minimum distance you
    should leave between your vehicle and the nearest rail?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 50 feet
  answer: C
  explanation: When stopped at a railroad crossing, you must leave at least 15 feet
    between the front and rear of your vehicle and the nearest rail.
- id: 39
  category: safe_driving_rules
  question: What is a specific danger to be aware of when crossing multiple railroad
    tracks?
  choices:
    A: Multiple tracks mean the speed limit is reduced
    B: Multiple tracks may mean multiple trains could be present
    C: You must shift gears while crossing multiple tracks
    D: You are required to stop at each individual track
  answer: B
  explanation: Multiple tracks may mean multiple trains. You must ensure you can clearly
    see down the tracks in both directions before proceeding.
- id: 40
  category: signs_and_signals
  question: How can a driver identify the type of roadway they are traveling on, such
    as an interstate or county road?
  choices:
    A: By the color of the mile markers
    B: By the shape of the route sign
    C: By the presence of service signs
    D: By the speed limit posted
  answer: B
  explanation: The shape of a route sign indicates the type of roadway it is - interstate,
    U.S. highway, Iowa route, county road, etc.
- id: 41
  category: signs_and_signals
  question: What does a steady green arrow indicate?
  choices:
    A: You may proceed straight through the intersection
    B: You must yield to oncoming traffic before turning
    C: Drivers can proceed with the turn and oncoming traffic must stop
    D: The signal is about to turn red
  answer: C
  explanation: A steady green arrow means drivers can proceed with the left or right
    turn, and oncoming traffic must stop. You must drive only in the direction of
    the arrow.
- id: 42
  category: safe_driving_rules
  question: When is a vehicle that is normally required to stop at railroad crossings
    allowed to proceed without stopping?
  choices:
    A: When the crossing is marked with an 'EXEMPT' sign
    B: When the driver is running late
    C: When the crossing is passively protected
    D: When the train is visible but moving slowly
  answer: A
  explanation: Vehicles normally required to stop do not have to stop if a police
    officer or highway traffic signal directs traffic to proceed, or if the crossing
    is marked with an 'EXEMPT' sign.
- id: 43
  category: signs_and_signals
  question: What is the basic color of signs and warning devices used in work zones?
  choices:
    A: Red
    B: Orange
    C: Yellow
    D: Fluorescent green
  answer: B
  explanation: Orange is the basic color of signs and warning devices in work areas.
- id: 44
  category: penalties_and_points
  question: What may happen to traffic fines if you commit a violation in a work area
    zone?
  choices:
    A: They are waived for first-time offenders.
    B: They remain the same as in normal zones.
    C: They may double.
    D: They are reduced if workers are not present.
  answer: C
  explanation: The manual states to stay alert and drive cautiously as fines may double
    in work area zones.
- id: 45
  category: signs_and_signals
  question: What do white lines painted on the pavement indicate?
  choices:
    A: They separate traffic moving in opposite directions.
    B: They separate traffic moving in the same direction.
    C: They indicate a no-passing zone.
    D: They mark a shared left-turn lane.
  answer: B
  explanation: White lines separate traffic moving in the same direction. Yellow lines
    separate traffic moving in opposite directions.
- id: 46
  category: signs_and_signals
  question: How are yield lines marked on the pavement?
  choices:
    A: A row of solid white triangles pointing toward approaching vehicles.
    B: Double solid yellow lines across the lane.
    C: A single thick white line across the intersection.
    D: A series of dashed white squares.
  answer: A
  explanation: Yield lines consist of a row of solid white triangles pointing toward
    approaching vehicles to indicate where vehicles should yield.
- id: 47
  category: signs_and_signals
  question: When driving in a reversible lane, what does a flashing yellow 'X' mean?
  choices:
    A: You may not use the lane.
    B: The use of the lane is changing and you should move out.
    C: The lane is only for turning.
    D: You can use the lane for passing only.
  answer: C
  explanation: In a reversible lane, a flashing yellow 'X' means the lane is only
    for turning.
- id: 48
  category: signs_and_signals
  question: What does a steady yellow 'X' above a reversible lane indicate?
  choices:
    A: The lane is open for normal travel.
    B: The lane is reserved for high-occupancy vehicles.
    C: The lane is only for turning.
    D: The use of the lane is changing and you should move out safely.
  answer: D
  explanation: A steady yellow 'X' means that the use of the lane is changing and
    you should move out of it as soon as it is safe to do so.
- id: 49
  category: safe_driving_rules
  question: Which of the following is true regarding shared left-turn lanes?
  choices:
    A: They can be used for passing slower vehicles.
    B: They are reserved for left turns from either direction.
    C: They are marked by double solid white lines.
    D: Only high-occupancy vehicles may use them.
  answer: B
  explanation: Shared left-turn lanes are reserved for vehicles making left turns
    from either direction and cannot be used for passing.
- id: 50
  category: defensive_driving
  question: On a road with three or more lanes traveling in the same direction, which
    lane is best to use if there is a lot of entering traffic?
  choices:
    A: The far left lane
    B: The center lane
    C: The far right lane
    D: The shoulder
  answer: B
  explanation: On a road with three or more lanes, if there is a lot of entering traffic,
    it’s best to use the center lane.
- id: 51
  category: safe_driving_rules
  question: When is it permissible to pass a vehicle on the shoulder of the road?
  choices:
    A: When the vehicle ahead is turning left.
    B: When the shoulder is paved.
    C: Never, whether the shoulder is paved or not.
    D: When traffic is backed up for more than a mile.
  answer: C
  explanation: Never pass on the shoulder, whether it is paved or not. Other drivers
    will not expect you to be there and may pull off the road without looking.
- id: 52
  category: sharing_the_road
  question: When may a motorist drive in a designated bicycle lane?
  choices:
    A: When passing a slow-moving vehicle.
    B: When making turning movements.
    C: When the adjacent traffic lane is blocked.
    D: Motorists are never allowed in a bicycle lane.
  answer: B
  explanation: Motorists may only drive in bicycle lanes when making turning movements
    and must look carefully beside and behind their vehicle for bicyclists.
- id: 53
  category: sharing_the_road
  question: What should a motorist do when encountering a bicycle lane filled with
    green paint?
  choices:
    A: Stop on the green pavement to check for bicycles.
    B: Use the green pavement as a shared turning lane.
    C: Look for bicyclists before crossing and do not stop on the green pavement.
    D: Yield only if a bicycle is currently in the intersection.
  answer: C
  explanation: Bicycle lanes may be filled with green paint and motorists should pay
    close attention and look for bicyclists before crossing green pavement. Motorists
    should not stop on green pavement.
- id: 54
  category: sharing_the_road
  question: What is the purpose of shared lane pavement markings, also known as 'sharrows'?
  choices:
    A: To designate a portion of the roadway for the exclusive use of bicycles.
    B: To alert motorists of the presence of bicyclists and encourage safe passing.
    C: To indicate where bicyclists must stop for pedestrians.
    D: To mark a lane exclusively for high-occupancy vehicles.
  answer: B
  explanation: Shared lane pavement markings (sharrows) alert motorists of the presence
    of bicyclists, encourage safe passing, and reduce wrong-way bicycling. Unlike
    bike lanes, they do not designate exclusive use for bicycles.
- id: 55
  category: signs_and_signals
  question: When approaching a Pedestrian Hybrid Beacon, what must a motorist do when
    the top two red lights become solid?
  choices:
    A: Proceed with caution.
    B: Slow down and prepare to stop.
    C: Stop for pedestrians.
    D: Stop, then proceed immediately even if pedestrians are present.
  answer: C
  explanation: When the top two red lights become solid on a Pedestrian Hybrid Beacon,
    motorists must stop for pedestrians.
- id: 56
  category: sharing_the_road
  question: How can a driver identify a visually impaired pedestrian?
  choices:
    A: They will be wearing a fluorescent yellow vest.
    B: They will be walking with a cane that is white or white with a red tip.
    C: They will be carrying a red flag.
    D: They will be walking in a designated bicycle box.
  answer: B
  explanation: A person is likely visually impaired if they are being led by a harnessed
    service animal or walking with a cane that is white or white with a red tip.
- id: 57
  category: signs_and_signals
  question: How are reserved lanes for special vehicles, such as high-occupancy vehicles
    (HOV), typically marked?
  choices:
    A: With a white diamond posted at the side of the road and/or painted on the road
      surface.
    B: With a solid green line painted across the lane.
    C: With a flashing yellow 'X' above the lane.
    D: With a row of solid white triangles pointing toward approaching vehicles.
  answer: A
  explanation: Reserved lanes are marked by signs stating the lane is reserved for
    special use, and often have a white diamond posted at the side of the road and/or
    painted on the road surface.
- id: 58
  category: safe_driving_rules
  question: According to the Iowa driver's manual, which of the following is true
    regarding the right-of-way?
  choices:
    A: The law gives the right-of-way to the larger vehicle.
    B: The law says who must yield the right-of-way, but does not give anyone the
      right-of-way.
    C: The law gives the right-of-way to the vehicle traveling the fastest.
    D: The law states that pedestrians always have the right-of-way over emergency
      vehicles.
  answer: B
  explanation: 'The manual states: ''The law says who must yield the right-of-way;
    it does not give anyone the right-of-way.'''
- id: 59
  category: safe_driving_rules
  question: What is the number one cause of traffic-related fatalities in Iowa?
  choices:
    A: Driving under the influence
    B: Speeding
    C: Failure to yield the right-of-way
    D: Distracted driving
  answer: C
  explanation: 'According to the manual, failure to yield the right-of-way is the
    #1 cause of traffic-related fatalities in Iowa.'
- id: 60
  category: safe_driving_rules
  question: If two vehicles arrive at an all-way stop at the exact same time, who
    has the right-of-way?
  choices:
    A: The vehicle on the left gets to go first.
    B: The vehicle on the right gets to go first.
    C: The vehicle traveling straight gets to go first.
    D: The vehicle making a right turn gets to go first.
  answer: B
  explanation: At an all-way stop, for vehicles arriving at the same time, the vehicle
    to the right gets to go first.
- id: 61
  category: safe_driving_rules
  question: What should you do if you are in an intersection when you see or hear
    an emergency vehicle approaching?
  choices:
    A: Stop immediately in the middle of the intersection.
    B: Pull over to the right edge of the intersection and stop.
    C: Drive through the intersection before you pull over to the right.
    D: Speed up to clear the intersection and continue driving normally.
  answer: C
  explanation: If you are in an intersection (including roundabouts), you must drive
    through the intersection before you pull over for an emergency vehicle.
- id: 62
  category: safe_driving_rules
  question: How far behind an emergency vehicle using lights and sirens must you stay?
  choices:
    A: At least 100 feet
    B: At least 250 feet
    C: At least 300 feet
    D: At least 500 feet
  answer: D
  explanation: The manual requires drivers to stay at least 500 feet behind any emergency
    vehicle using lights and sirens.
- id: 63
  category: safe_driving_rules
  question: When meeting a school bus from the front on a two-lane road and you see
    its amber warning lights flashing, what must you do?
  choices:
    A: Maintain your speed and pass cautiously.
    B: Slow your vehicle to no more than 20 mph and be prepared to stop.
    C: Stop immediately, regardless of the stop arm.
    D: Pull over to the shoulder and turn off your engine.
  answer: B
  explanation: When meeting a bus from the front on a two- or three-lane road and
    you see amber warning lights flashing, you must slow your vehicle to no more than
    20 mph and be prepared to stop.
- id: 64
  category: safe_driving_rules
  question: When driving on a road with four or more lanes, what should you do if
    you meet a stopped school bus from the opposite direction with its lights flashing
    and stop arm out?
  choices:
    A: You must stop and wait for the stop arm to retract.
    B: You must slow down to 15 mph.
    C: You do not need to stop.
    D: You must stop, then proceed with caution.
  answer: C
  explanation: When meeting the bus in one of the opposite two lanes (or more) on
    a road with four or more lanes, you do not need to stop, even if the bus has stopped
    with lights flashing and stop arm out.
- id: 65
  category: penalties_and_points
  question: What is the potential penalty for violating the school bus stopping law
    in Iowa?
  choices:
    A: A warning for the first offense.
    B: Your license may be suspended for up to 180 days.
    C: Your license will be permanently revoked.
    D: A mandatory 30-day jail sentence.
  answer: B
  explanation: Violating the school bus stopping law may result in your license being
    suspended for up to 180 days.
- id: 66
  category: safe_driving_rules
  question: When parking on a roadway with a curb, how close must you park to the
    curb?
  choices:
    A: Within 6 inches
    B: Within 12 inches
    C: Within 18 inches
    D: Within 24 inches
  answer: C
  explanation: If there is a curb, you must park your vehicle within 18 inches of
    the curb or closer.
- id: 67
  category: safe_driving_rules
  question: How close to a fire hydrant are you legally allowed to park?
  choices:
    A: You cannot park closer than 5 feet.
    B: You cannot park closer than 10 feet.
    C: You cannot park closer than 15 feet.
    D: You cannot park closer than 20 feet.
  answer: A
  explanation: You may not park closer than five feet from a fire hydrant or in a
    designated hydrant red zone.
- id: 68
  category: safe_driving_rules
  question: Under Iowa's Move Over or Slow Down Law, what must you do if you approach
    a stopped passenger vehicle displaying hazard lights and you cannot safely change
    lanes?
  choices:
    A: Stop immediately in your lane.
    B: Maintain your speed but honk your horn.
    C: Slow down and be prepared to stop.
    D: Accelerate to pass the vehicle quickly.
  answer: C
  explanation: If a lane change is not possible, prohibited by law, or unsafe when
    approaching a stopped vehicle with flashing lights, you must slow down and be
    prepared to stop.
- id: 69
  category: penalties_and_points
  question: What is the maximum license suspension period for violating Iowa's Move
    Over or Slow Down Law?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: One year
  answer: D
  explanation: Violating Iowa's Move Over or Slow Down Law may result in your license
    being suspended for up to one year.
- id: 70
  category: safe_driving_rules
  question: According to the 'Steer It-Clear It' law, what are you required to do
    if you are involved in a crash with no injuries and your vehicle is operable?
  choices:
    A: Leave the vehicle exactly where it is until police arrive.
    B: Move your vehicle out of the driving lanes of traffic.
    C: Wait for a tow truck to move the vehicle.
    D: Exchange insurance information before moving the vehicle.
  answer: B
  explanation: If you are involved in a crash with no injuries, Iowa law requires
    that you move your vehicle out of the driving lanes of traffic if the vehicle
    is operable and can be safely moved.
- id: 71
  category: vehicle_information
  question: How many separate braking systems are required for cars and trucks?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Cars, trucks, and ATVs/UTVs need two separate braking systems, a foot
    brake and a parking brake.
- id: 72
  category: sharing_the_road
  question: Which of the following is true regarding sharing the road with bicyclists?
  choices:
    A: Bicyclists must always yield the right-of-way to motor vehicles.
    B: Motorists should be ready to yield the right-of-way, even at times the bicyclist
      should yield.
    C: Bicycles are not considered vulnerable in crashes.
    D: Bicyclists do not share the same rights and responsibilities as motorists.
  answer: B
  explanation: The manual advises drivers to 'Be ready to yield the right-of-way,
    even at times the bicyclists should yield to you' because they have no defense
    against a vehicle.
- id: 73
  category: vehicle_information
  question: How far away must the red light on the back of your vehicle be visible?
  choices:
    A: At least 100 feet
    B: At least 200 feet
    C: At least 300 feet
    D: At least 500 feet
  answer: D
  explanation: You need at least one red light on the back of the vehicle, and it
    should be visible for at least 500 feet.
- id: 74
  category: vehicle_information
  question: Dirt on your vehicle's light lenses can reduce their effectiveness by
    up to what percentage?
  choices:
    A: 10 percent
    B: 25 percent
    C: 50 percent
    D: 75 percent
  answer: C
  explanation: The manual states that dirt on the lenses can cut the light's effectiveness
    by 50 percent.
- id: 75
  category: vehicle_information
  question: What is the minimum percentage of light that tinted windshields and front
    side windows must allow through under Iowa law?
  choices:
    A: 30 percent
    B: 50 percent
    C: 70 percent
    D: 90 percent
  answer: C
  explanation: Iowa law requires tinted windshields and windows to the immediate right
    or left of the driver to allow at least 70 percent of the light through.
- id: 76
  category: vehicle_information
  question: When is the best time to check your tire air pressure?
  choices:
    A: Immediately after a long drive
    B: When the tires are cold
    C: When the tires are warm
    D: While the engine is running
  answer: B
  explanation: The manual advises to check tire air pressure with an air pressure
    gauge when the tires are cold.
- id: 77
  category: safe_driving_rules
  question: Why is it dangerous to leave your engine running in a closed garage?
  choices:
    A: It will drain the vehicle's battery
    B: It can cause the engine to overheat quickly
    C: Fumes from a leaky exhaust can cause death in a very short time
    D: It will cause the suspension system to fail
  answer: C
  explanation: The manual warns that fumes from a leaky exhaust can cause death in
    a very short time, and you should never leave your engine running in the garage.
- id: 78
  category: vehicle_information
  question: How far behind your vehicle must you be able to see using your rearview
    mirror?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: C
  explanation: You must be able to see at least 200 feet behind you in your rearview
    mirror.
- id: 79
  category: safe_driving_rules
  question: What is the minimum recommended distance between your chest and the steering
    wheel?
  choices:
    A: 5 inches
    B: 10 inches
    C: 15 inches
    D: 20 inches
  answer: B
  explanation: When adjusting your seat, there should be at least 10 inches between
    the steering wheel and your chest, with the air bag pointing at your chest.
- id: 80
  category: safe_driving_rules
  question: Where should the head restraint be positioned in relation to the driver?
  choices:
    A: At the base of the neck
    B: At the center of the driver's head
    C: Above the top of the driver's head
    D: Touching the driver's shoulders
  answer: B
  explanation: The manual states that the head restraint should be at the center of
    the driver's head.
- id: 81
  category: defensive_driving
  question: How should you position yourself to properly adjust your left-side mirror?
  choices:
    A: Sit perfectly straight in the driver's seat
    B: Lean to the right over the car's center console
    C: Lean your head toward the left-side window
    D: Turn your head to look out the rear window
  answer: C
  explanation: To adjust the left-side mirror, lean your head toward the left-side
    window, and set the left mirror so you can barely see the side of the car.
- id: 82
  category: driver_testing
  question: Which of the following advanced driver-assistance systems (ADAS) is NOT
    permitted to be used during a driving test?
  choices:
    A: Back-up warning
    B: Blind spot monitor
    C: Lane keeping assist
    D: Adaptive cruise control
  answer: D
  explanation: During a driving test, you should not be assisted by vehicle convenience
    technologies like adaptive cruise control. It is listed as 'No' under permitted
    assist systems.
- id: 83
  category: driver_testing
  question: During a driving test, which of the following vehicle convenience technologies
    is prohibited?
  choices:
    A: Automatic parallel parking
    B: Automatic emergency braking
    C: Forward collision warning
    D: Rear cross-traffic alert
  answer: A
  explanation: Automatic parallel parking is listed as 'No' under assist systems permitted
    for testing.
- id: 84
  category: safe_driving_rules
  question: According to the manual, what is the proper use of a vehicle's horn?
  choices:
    A: To greet other drivers
    B: To express frustration in traffic
    C: Only to be used as a warning to others
    D: To signal pedestrians to cross the street
  answer: C
  explanation: A horn may not seem like an important safety device, but as a warning,
    it could save your life. It should only be used as a warning to others.
- id: 85
  category: vehicle_information
  question: What coin does the manual recommend using to check your tire tread depth?
  choices:
    A: A quarter
    B: A dime
    C: A nickel
    D: A penny
  answer: D
  explanation: The manual recommends checking tire tread with a penny. If the tread
    does not come at least to the top of Lincoln's head, the tire is unsafe.
- id: 86
  category: defensive_driving
  question: Even if your vehicle is equipped with a back-up warning system, what must
    you still do when backing up?
  choices:
    A: Rely entirely on the warning sound
    B: Check mirrors and over your shoulders
    C: Turn off the warning system
    D: Honk your horn continuously
  answer: B
  explanation: When using a back-up warning system, you should still demonstrate all
    necessary behaviors for safely monitoring and maneuvering, including checking
    side mirrors, rear-view mirror, and over the shoulders (head checks).
- id: 87
  category: vehicle_information
  question: When does a vehicle's rear camera typically activate?
  choices:
    A: When the vehicle reaches a speed of 10 mph
    B: When the driver shifts into reverse
    C: When the turn signal is activated
    D: When the vehicle is parked and turned off
  answer: B
  explanation: According to the manual, when the driver shifts into reverse, the rear
    camera activates to show the area behind the vehicle.
- id: 88
  category: vehicle_information
  question: How is a sideview camera usually activated?
  choices:
    A: By shifting the vehicle into reverse
    B: By pressing the brake pedal firmly
    C: By using the turn signal or a manual button
    D: By exceeding the posted speed limit
  answer: C
  explanation: The manual states that you can use the turn signal or activate the
    sideview camera feature through a button usually located on the turn signal lever.
- id: 89
  category: vehicle_information
  question: How does a surround-view or around-view monitor system create a virtual
    bird's-eye view of the vehicle?
  choices:
    A: By using a live satellite feed
    B: By processing video from four wide-angle cameras
    C: By using radar sensors mounted on the roof
    D: By deploying a small drone above the vehicle
  answer: B
  explanation: The around-view monitor processes video from four wide-angle cameras
    on the front, back, left, and right to display composite footage as a single birds-eye
    view.
- id: 90
  category: vehicle_information
  question: At what speeds do bicycle, pedestrian, and obstacle detection systems
    generally operate?
  choices:
    A: Highway speeds above 55 mph
    B: Low speeds, generally around 25 mph
    C: Only when the vehicle is completely stopped
    D: Speeds between 40 and 60 mph
  answer: B
  explanation: These detection systems alert you when an obstacle has been detected
    when driving at low speeds, generally around 25 mph.
- id: 91
  category: defensive_driving
  question: When using an obstacle detection system, what does it mean when the warning
    beeps become continuous?
  choices:
    A: The system is turned on and functioning properly
    B: The sensors need to be cleaned
    C: A crash is imminent
    D: The obstacle has safely moved out of the way
  answer: C
  explanation: The manual notes that the beeps become faster as the vehicle moves
    closer to the obstacle, and a crash is imminent when the beeps become continuous.
- id: 92
  category: vehicle_information
  question: What technology does the curve speed warning system use to track the vehicle's
    speed and location?
  choices:
    A: Roadway markings
    B: GPS
    C: Four wide-angle cameras
    D: Rear radar sensors
  answer: B
  explanation: The curve speed warning system tracks the vehicle’s speed and location
    via GPS and warns you to slow down when approaching curves and exits.
- id: 93
  category: vehicle_information
  question: Does a forward collision warning system automatically brake for the driver?
  choices:
    A: Yes, it always applies the brakes automatically to prevent a crash
    B: Yes, but only at speeds above 50 mph
    C: No, the warning alone will not automatically brake for the driver
    D: No, it only steers the vehicle away from the object
  answer: C
  explanation: The manual explicitly states that the forward collision warning alone
    will not automatically brake for the driver; it only alerts you of an impending
    collision.
- id: 94
  category: vehicle_information
  question: How far ahead does the forward collision warning system scan the traffic?
  choices:
    A: Up to 100 feet
    B: Up to 250 feet
    C: Up to 500 feet
    D: Up to 1,000 feet
  answer: C
  explanation: The forward collision warning system scans the traffic ahead 20 times
    per second up to 500 feet in front of your vehicle.
- id: 95
  category: safe_driving_rules
  question: What is the recommended action if your vehicle's high-speed alert sounds?
  choices:
    A: Slam on the brakes immediately to reduce speed
    B: Carefully slow the car by releasing the accelerator or lightly braking
    C: Turn off the infotainment center to silence the alarm
    D: Steer to the shoulder of the road and stop
  answer: B
  explanation: If a warning sounds, you should carefully slow the car to the appropriate
    posted speed limit by releasing the accelerator or lightly braking. You should
    not slam the brakes.
- id: 96
  category: vehicle_information
  question: What does a lane departure warning device rely on to operate properly?
  choices:
    A: GPS tracking
    B: Roadway markings
    C: The vehicle's turn signals
    D: Radar sensors on the rear bumper
  answer: B
  explanation: The manual states that the lane departure warning feature relies on
    roadway markings to operate and alert you if the car begins to drift out of a
    lane.
- id: 97
  category: defensive_driving
  question: Which of the following might parking sensors fail to detect?
  choices:
    A: Large vehicles parked nearby
    B: Objects that are flat on the ground or below the bumper
    C: Walls directly in front of the vehicle
    D: Moving vehicles in the adjacent lane
  answer: B
  explanation: Drivers should not rely solely on parking sensors because they may
    not detect objects that are flat on the ground, below the bumper, too close to
    the vehicle, or too far from it.
- id: 98
  category: vehicle_information
  question: What is the primary function of a rear cross-traffic alert system?
  choices:
    A: To warn if vehicles are about to enter the backing path from the left or right
    B: To automatically parallel park the vehicle
    C: To alert the driver of pedestrians crossing in front of the vehicle
    D: To monitor the blind spots while driving at highway speeds
  answer: A
  explanation: Rear cross-traffic alert warns you if one or more vehicles are about
    to enter the backing path. Sensors around the rear detect vehicles approaching
    from the left and right.
- id: 99
  category: vehicle_information
  question: How does an automatic emergency braking system respond if you fail to
    brake for a hazard ahead?
  choices:
    A: It sounds a continuous horn until you apply the brakes
    B: It rapidly slows down or stops the vehicle on its own
    C: It automatically steers the vehicle into the next lane
    D: It increases the vehicle's speed to pass the hazard quickly
  answer: B
  explanation: If you fail to brake or steer to avoid a hazard ahead, the automatic
    emergency braking system will slow down rapidly or stop the vehicle on its own
    to avoid a crash.
- id: 100
  category: defensive_driving
  question: Even when a vehicle is equipped with advanced cameras and blind spot monitors,
    what must a driver continue to do?
  choices:
    A: Rely entirely on the dashboard display for lane changes
    B: Keep their hands off the steering wheel while backing up
    C: Frequently scan mirrors and perform head checks over the shoulders
    D: Disable the systems when driving in heavy traffic
  answer: C
  explanation: The manual repeatedly emphasizes that drivers should not become dependent
    on these technologies and must continue to check side mirrors, rear-view mirrors,
    and over the shoulders (head checks).
- id: 101
  category: vehicle_information
  question: What maintenance is required for vehicle detection sensors to function
    properly?
  choices:
    A: They must be kept clean
    B: They must be replaced every year
    C: They must be painted to match the vehicle
    D: They must be manually activated before every trip
  answer: A
  explanation: 'A specific note in the manual states: ''Sensors need to be kept clean
    in order for them to function properly.'''
- id: 102
  category: vehicle_information
  question: What should you do even if your vehicle is equipped with automatic reverse
    braking?
  choices:
    A: Rely entirely on the system to stop the vehicle.
    B: Continue to check mirrors, check over your shoulder, and use rear cameras.
    C: Disable the system before backing up to maintain manual control.
    D: Accelerate quickly to override the system's sensors.
  answer: B
  explanation: 'The manual states: "Do not depend on the automatic reverse braking
    technology. Continue to check mirrors, check over the shoulder (head checks),
    and use rear cameras if equipped."'
- id: 103
  category: vehicle_information
  question: Under which condition is a lane keeping assist feature likely to NOT work
    properly?
  choices:
    A: When driving at night.
    B: When the lane lines are faint or covered with snow or dirt.
    C: When driving on a multi-lane highway.
    D: When the vehicle is traveling below 30 mph.
  answer: B
  explanation: According to the manual, the lane keeping assist feature "will not
    work when lane lines are faint or covered with snow or dirt."
- id: 104
  category: driver_testing
  question: Are convenience technologies like adaptive cruise control permitted for
    use during the driving test?
  choices:
    A: Yes, if the vehicle is equipped with them.
    B: Yes, but only for parallel parking.
    C: No, they are not permitted during the driving test process.
    D: No, unless the examiner specifically requests their use.
  answer: C
  explanation: 'The manual explicitly states: "Convenience technologies are not permitted
    for use during the driving test process."'
- id: 105
  category: safe_driving_rules
  question: When is it advised NOT to use any cruise control, including adaptive cruise
    control (ACC)?
  choices:
    A: On interstate highways.
    B: In bad weather and other unsafe driving conditions.
    C: When driving long distances.
    D: When following large trucks.
  answer: B
  explanation: The manual advises that "In bad weather and other unsafe driving conditions,
    it is advised not to use any cruise control, including ACC."
- id: 106
  category: vehicle_information
  question: When using an automatic parallel parking system, what is the driver still
    responsible for doing?
  choices:
    A: Steering the wheel into the space.
    B: Braking and monitoring the environment.
    C: Activating the turn signal after parking.
    D: Measuring the parking space manually.
  answer: B
  explanation: The manual notes that with automatic parallel parking, "You are still
    responsible for braking and monitoring the environment."
- id: 107
  category: sharing_the_road
  question: Why should you never stay alongside a large vehicle such as a truck or
    bus?
  choices:
    A: They travel at much higher speeds than passenger cars.
    B: They have large blind spots and it is hard for them to see you.
    C: They are more likely to have tire blowouts.
    D: They frequently make sudden lane changes without signaling.
  answer: B
  explanation: The manual warns to "Never stay alongside a large vehicle such as a
    truck or bus. These vehicles have large blind spots and it is hard for them to
    see you."
- id: 108
  category: defensive_driving
  question: Which of the following can increase your vehicle's blind spots by creating
    glaring reflections?
  choices:
    A: Driving with the windows down.
    B: The sun reflecting off window surfaces, especially the front windshield.
    C: Using the vehicle's sun visors.
    D: Wearing polarized sunglasses.
  answer: B
  explanation: The manual states that "The sun can create blind spots with reflections
    off any of your window surfaces. The front windshield is the most common place
    for glaring reflections and blind spots."
- id: 109
  category: safe_driving_rules
  question: How should a pregnant woman wear a seat belt?
  choices:
    A: Across the abdomen as high as possible.
    B: Only using the shoulder strap and not the lap belt.
    C: Across the pelvis, as low under the abdomen as possible.
    D: Pregnant women are exempt from wearing seat belts.
  answer: C
  explanation: 'The manual instructs: "If you are pregnant, you can safely wear the
    belt across the pelvis, as low under your abdomen as possible."'
- id: 110
  category: penalties_and_points
  question: In Iowa, what is the maximum fine for a seat belt violation for a passenger
    under 18?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: D
  explanation: The violation of the seat belt law is punishable with up to a $50 fine
    per passenger and "$100 per passenger under 18."
- id: 111
  category: safe_driving_rules
  question: What is the requirement for securing a child who is under one year old
    and weighs less than 20 pounds?
  choices:
    A: They must be secured in a forward-facing booster seat.
    B: They must be secured in a rear-facing child restraint system.
    C: They can be secured with a standard seat belt in the back seat.
    D: They can ride in the front seat if held by an adult.
  answer: B
  explanation: According to Iowa law, "A child under one year old and weighing less
    than 20 pounds must be secured in a rear-facing child restraint system."
- id: 112
  category: safe_driving_rules
  question: According to Iowa law, how must a child under six years old be secured
    in a vehicle?
  choices:
    A: In a child restraint system, such as a safety seat or booster seat.
    B: With a standard adult seat belt in the front seat.
    C: With a standard adult seat belt in the back seat.
    D: In a rear-facing car seat regardless of weight.
  answer: A
  explanation: 'The manual states: "A child under six years old must be secured in
    a child restraint system (a safety seat or booster seat, not a seat belt)."'
- id: 113
  category: safe_driving_rules
  question: Under Iowa law, who is prohibited from riding in the rear of a moving
    pickup truck?
  choices:
    A: Anyone under the age of 21.
    B: Anyone under the age of 18.
    C: Only children under the age of 6.
    D: Passengers of any age.
  answer: B
  explanation: 'The manual explicitly states: "A child under the age of 18 cannot
    ride in the rear of a moving pickup truck."'
- id: 114
  category: defensive_driving
  question: Why is it a myth that seat belts are only needed on long trips?
  choices:
    A: Because seat belts are only effective at speeds over 60 mph.
    B: Because over half of all traffic deaths happen within 25 miles of home.
    C: Because short trips usually involve highway driving.
    D: Because airbags do not deploy on short trips.
  answer: B
  explanation: 'Addressing the myth that seat belts are only for long trips, the manual
    explains: "Over half of all traffic deaths happen within 25 miles of home. Many
    occur on roads with speed limits of less than 45 mph."'
- id: 115
  category: driver_responsibility
  question: Why is it important to secure loose objects in your vehicle?
  choices:
    A: They can roll under the brake pedal or injure someone in a sudden stop.
    B: They can cause the vehicle to exceed its maximum weight limit.
    C: They interfere with the vehicle's automatic emergency braking sensors.
    D: They increase the vehicle's fuel consumption.
  answer: A
  explanation: The manual states you should make sure there are no loose objects "that
    could injure someone in the event of a sudden stop or crash" and no objects on
    the floor "that could roll under the brake pedal making it difficult or impossible
    to apply the brakes."
- id: 116
  category: sharing_the_road
  question: What should you do if you find yourself driving in another driver's blind
    spot?
  choices:
    A: Honk your horn continuously until they move.
    B: Flash your high beams to alert them.
    C: Either speed up or slow down so the other driver can see your vehicle.
    D: Maintain your speed and position to establish right-of-way.
  answer: C
  explanation: 'The manual advises regarding other drivers'' blind spots: "Do not
    drive in another driver’s blind spot. Either speed up or slow down so the other
    driver can see your vehicle."'
- id: 117
  category: safe_driving_rules
  question: At 55 miles per hour, a 20-pound loose object in your vehicle hits with
    how much force in the event of a sudden stop or crash?
  choices:
    A: 100 pounds
    B: 500 pounds
    C: 1,000 pounds
    D: 2,000 pounds
  answer: C
  explanation: According to the manual, at 55 miles per hour, a 20-pound object hits
    with 1,000 pounds of force.
- id: 118
  category: defensive_driving
  question: Which type of distraction involves doing something that causes the driver's
    mind to wander or focus elsewhere, such as having a conversation?
  choices:
    A: Visual distraction
    B: Manual distraction
    C: Cognitive distraction
    D: Auditory distraction
  answer: C
  explanation: The manual defines a cognitive distraction as doing something that
    causes the driver's mind to wander or focus elsewhere, such as listening to music
    or having a conversation.
- id: 119
  category: safe_driving_rules
  question: Under Iowa law, when are drivers under the age of 18 with an instruction
    permit or intermediate license allowed to make or receive phone calls?
  choices:
    A: Only when using a hands-free device
    B: Only when traveling under 30 mph
    C: Only when the vehicle is at a complete stop off the traveled portion of the
      roadway
    D: They are never allowed to use a phone under any circumstances
  answer: C
  explanation: Drivers under the age of 18 with an instruction permit, intermediate
    license, or special minor restricted license are prohibited from making and receiving
    calls unless their vehicle is at a complete stop off the traveled portion of the
    roadway.
- id: 120
  category: safe_driving_rules
  question: According to Iowa's hands-free law, which of the following actions is
    permitted while driving?
  choices:
    A: Manually entering an address into a GPS
    B: Making a call using voice activation
    C: Holding the phone to view a text message
    D: Streaming a video using voice commands
  answer: B
  explanation: Iowa's hands-free law states you can't call, text, or dial unless using
    hands-free or voice activation. Holding the phone, entering GPS addresses, and
    streaming videos are explicitly prohibited.
- id: 121
  category: alcohol_drugs_health
  question: 'In Iowa, the official offense of "Operating While Intoxicated" (OWI)
    is defined as having a blood alcohol concentration (BAC) of at least:'
  choices:
    A: '.02'
    B: '.04'
    C: '.06'
    D: '.08'
  answer: D
  explanation: Operating While Intoxicated is defined as having a blood alcohol concentration
    (BAC) of .08 or higher or operating with any amount of controlled substance in
    your system.
- id: 122
  category: alcohol_drugs_health
  question: What does Iowa's Implied Consent law mean for individuals holding an Iowa
    driver's license?
  choices:
    A: You agree to have your vehicle searched at any traffic stop.
    B: You contractually agree to consent to a field sobriety test upon demand by
      law enforcement.
    C: You agree to pay all traffic fines within 30 days.
    D: You consent to random drug testing by your employer.
  answer: B
  explanation: As a holder of an Iowa driver's license, you are contractually agreeing
    to consent to a field sobriety test upon demand by law enforcement under the Implied
    Consent to Testing law.
- id: 123
  category: penalties_and_points
  question: What is the minimum penalty for refusing a breathalyzer test in Iowa?
  choices:
    A: A 180-day license revocation and a $500 fine
    B: A one-year license revocation and a minimum $1,250 fine
    C: A 60-day license revocation and mandatory community service
    D: A 30-day license suspension and a $200 fine
  answer: B
  explanation: The consequences for refusing a breathalyzer test include an automatic
    one-year revocation of your license and a minimum $1,250 fine.
- id: 124
  category: alcohol_drugs_health
  question: 'An underage driver (under 21) is considered to be operating while intoxicated
    in Iowa if their blood alcohol concentration (BAC) is at or above:'
  choices:
    A: '.00'
    B: '.02'
    C: '.04'
    D: '.08'
  answer: B
  explanation: An underage driver is considered to be operating while intoxicated
    with a BAC of .02 or more.
- id: 125
  category: alcohol_drugs_health
  question: Where is it legal to transport an open, unsealed container of alcohol
    in a motor vehicle?
  choices:
    A: In the glove compartment
    B: Under the passenger seat
    C: In the trunk of the vehicle
    D: In the back seat cup holder
  answer: C
  explanation: The Open Container Law states that open containers of alcoholic beverages
    may be transported in the trunk of a vehicle.
- id: 126
  category: alcohol_drugs_health
  question: 'Being awake for 18 hours straight is considered as impairing as having
    a blood alcohol concentration (BAC) of:'
  choices:
    A: 0.02 percent
    B: 0.04 percent
    C: 0.08 percent
    D: 0.10 percent
  answer: C
  explanation: Being awake for 18 hours straight is as impairing as a blood alcohol
    concentration (BAC) of 0.08 percent, which is legally drunk.
- id: 127
  category: safe_driving_rules
  question: Which resource provides the latest travel conditions, such as adverse
    weather and road construction, for Iowa highways and interstates?
  choices:
    A: Iowa 311
    B: Iowa 411
    C: Iowa 511
    D: Iowa 911
  answer: C
  explanation: Drivers can visit www.511ia.org or download the free mobile app (Iowa
    511) to stay up to date on the latest travel conditions.
- id: 128
  category: vehicle_information
  question: When driving a vehicle with an automatic transmission, what does the "N"
    on the gear selector stand for?
  choices:
    A: Normal
    B: Neutral
    C: Night
    D: Navigate
  answer: B
  explanation: On an automatic transmission gear selector, N stands for "Neutral"
    to leave the engine idle.
- id: 129
  category: vehicle_information
  question: In a vehicle with a manual transmission, which foot is used to depress
    the third pedal called the "clutch"?
  choices:
    A: The right foot
    B: The left foot
    C: Either foot can be used
    D: Both feet simultaneously
  answer: B
  explanation: Step 1 for shifting gears in a manual transmission vehicle is to "Depress
    the clutch with your left foot."
- id: 130
  category: safe_driving_rules
  question: Which two factors make up a vehicle's total stopping distance?
  choices:
    A: Reaction distance and braking distance
    B: Speed distance and weight distance
    C: Acceleration distance and braking distance
    D: Visual distance and manual distance
  answer: A
  explanation: According to the stopping distance formula in the manual, Reaction
    Distance + Braking Distance = Stopping Distance.
- id: 131
  category: safe_driving_rules
  question: Which of the following is an exception to Iowa's distracted driving law
    prohibiting the use of hand-held electronic devices?
  choices:
    A: A driver changing a music playlist
    B: A person receiving safety-related information such as weather alerts
    C: A driver checking a map app while stopped at a red light
    D: A driver reading a text message from a family member
  answer: B
  explanation: Exceptions to the distracted driving law include a person receiving
    safety-related information including emergency, traffic, and weather alerts.
- id: 132
  category: safe_driving_rules
  question: Under normal driving conditions, what is the minimum following distance
    an inexperienced or beginning driver should maintain?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Six seconds
  answer: B
  explanation: An inexperienced or beginning driver should maintain at least a three-second
    following distance under normal driving conditions.
- id: 133
  category: defensive_driving
  question: What following distance is recommended when road conditions are slippery
    or the vehicle in front of you blocks your view?
  choices:
    A: Two seconds
    B: Three to four seconds
    C: Four to five seconds
    D: Six or more seconds
  answer: D
  explanation: When road conditions are slippery or the vehicle in front of you blocks
    your view, a following distance of six or more seconds is recommended.
- id: 134
  category: vehicle_information
  question: 'If your vehicle has an antilock braking system (ABS) and you need to
    stop quickly, you should:'
  choices:
    A: Pump the brakes rapidly to avoid skidding.
    B: Press on the brake pedal as hard as you can and keep pressing.
    C: Apply light pressure to the brake pedal and gradually increase it.
    D: Let up on the brake pedal if you feel it pushing back.
  answer: B
  explanation: If your vehicle has ABS and you need to stop quickly, press on the
    brake pedal as hard as you can and keep pressing. Do not let up on the brake pedal
    even if you feel it pushing back.
- id: 135
  category: defensive_driving
  question: How can you use your brake lights to communicate with a driver behind
    you who is following too closely?
  choices:
    A: Turn your hazard lights on and off.
    B: Press the brake pedal firmly and hold it.
    C: Tap your brake pedal three or four times quickly.
    D: Lightly ride the brake pedal for a full block.
  answer: C
  explanation: If the vehicle behind you is following too closely, tap your brake
    pedal three or four times quickly. This will let those behind you know you are
    about to slow down.
- id: 136
  category: sharing_the_road
  question: 'You must always come to a complete stop when approaching a visually impaired
    person walking in front of you who is carrying a:'
  choices:
    A: Yellow or black-tipped cane.
    B: White or red-tipped cane.
    C: Reflective orange sign.
    D: Blue or green-tipped cane.
  answer: B
  explanation: You must always stop when a visually impaired person with a cane (often
    white or red-tipped) or guide dog is walking in front of you or close enough to
    you that the person could be in danger.
- id: 137
  category: safe_driving_rules
  question: In the event the speed limit is not posted, what is the general speed
    limit in a residential or school district?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: In the event the speed limit is not posted, the general limit is 25
    mph in a residential district or school district.
- id: 138
  category: safe_driving_rules
  question: What is the minimum speed allowed on the interstate system under normal
    conditions?
  choices:
    A: 40 mph
    B: 45 mph
    C: 50 mph
    D: 55 mph
  answer: A
  explanation: On the interstate system there is a minimum speed of 40 mph. Vehicles
    that cannot go at least that fast under normal conditions are not allowed on the
    interstate.
- id: 139
  category: vehicle_information
  question: To reduce the risk of injury from front airbags and maintain control of
    your vehicle, where should your hands be placed on the steering wheel?
  choices:
    A: 10 and 2 o'clock
    B: 9 and 3 o'clock or slightly lower at 7 and 5 o'clock
    C: 8 and 4 o'clock or slightly higher at 11 and 1 o'clock
    D: One hand at 12 o'clock
  answer: B
  explanation: Your hands should be placed on opposite sides of the steering wheel
    at 9 and 3 o’clock or slightly lower at 7 and 5 o’clock to reduce the risk of
    injury from front airbags and best maintain control.
- id: 140
  category: safe_driving_rules
  question: Which of the following is a proper technique when backing up your vehicle?
  choices:
    A: Depend entirely on your backup camera and mirrors.
    B: Turn your wheel in the opposite direction you want the car to travel.
    C: Shift your hips, turn around, and look over your right shoulder through the
      rear window.
    D: Use the accelerator heavily to complete the maneuver quickly.
  answer: C
  explanation: When backing up, shift your hips and turn around to get a good view
    behind the vehicle. Drape your right arm over the back of the seat, grasp the
    top of the steering wheel with your left hand, and look over your right shoulder
    through the rear window.
- id: 141
  category: safe_driving_rules
  question: According to Iowa law, if the speed limit is faster than 45 mph, how far
    in advance must you signal before making a turn?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: D
  explanation: Iowa law requires you to signal at least 100 feet before a turn if
    the speed limit is 45 mph or less, and if the speed limit is faster than 45 mph,
    you must signal at least 300 feet before you turn.
- id: 142
  category: defensive_driving
  question: If there are streets or driveways between you and where you want to turn,
    when should you use your turn signal?
  choices:
    A: As soon as you see your destination.
    B: At least 500 feet before the turn, regardless of intersections.
    C: Wait until you have passed the other streets or driveways to signal.
    D: Signal early and wave other drivers through the intersection.
  answer: C
  explanation: Be careful that you do not signal too early. If there are streets,
    driveways, or entrances between you and where you want to turn, wait until you
    have passed them to signal.
- id: 143
  category: safe_driving_rules
  question: Under what condition may you make a left turn at a red light?
  choices:
    A: When turning from a two-way street onto a one-way street.
    B: When turning from the left lane of a one-way street onto another one-way street.
    C: When turning from a one-way street onto a two-way street.
    D: Left turns on red are never permitted in Iowa.
  answer: B
  explanation: You may make a left turn at a red light if you are turning from the
    left lane of a one-way street onto another one-way street.
- id: 144
  category: safe_driving_rules
  question: When turning your head to check your blind spots before changing lanes,
    what is an important safety precaution?
  choices:
    A: Make sure you keep the steering wheel straight.
    B: Slightly turn the steering wheel in the direction you are looking.
    C: Tap your brakes to alert other drivers.
    D: Slow down significantly before looking.
  answer: A
  explanation: When you turn your head to check the blind spots, make sure you keep
    the steering wheel straight; people have a natural tendency to turn their arms
    in the same direction as their head.
- id: 145
  category: defensive_driving
  question: Compared to a vehicle traveling 30 mph, how much further will a vehicle
    traveling 60 mph travel before coming to a stop?
  choices:
    A: 2 times further
    B: 3 times further
    C: 4 times further
    D: 5 times further
  answer: B
  explanation: The faster your vehicle is going, the more distance it will take to
    turn, slow, or stop. For example, a vehicle traveling 60 mph will travel 3 times
    further than a vehicle traveling 30 mph before coming to a stop.
- id: 146
  category: safe_driving_rules
  question: What does the manual state regarding three-point turns?
  choices:
    A: They are the safest way to turn around on a busy street.
    B: They should be performed at every dead-end road.
    C: They are generally not a safe maneuver and can increase your risk of collisions.
    D: They are required to pass the driving test.
  answer: C
  explanation: Three-point turns are generally not a safe maneuver and can increase
    your risk and exposure to collisions. It is better to proceed to the nearest intersection.
- id: 147
  category: safe_driving_rules
  question: What should you do with the steering wheel when turning your head to check
    your blind spots?
  choices:
    A: Turn it slightly in the direction you are looking.
    B: Keep it straight.
    C: Turn it slightly away from the direction you are looking.
    D: Let go of the wheel momentarily.
  answer: B
  explanation: When you turn your head to check the blind spots, make sure you keep
    the steering wheel straight; people have a natural tendency to turn their arms
    in the same direction as their head.
- id: 148
  category: safe_driving_rules
  question: When passing another vehicle, when is it safe to return to your original
    lane?
  choices:
    A: As soon as you are past the other vehicle's front bumper.
    B: When you can see the front of the passed car in your rearview mirror.
    C: After you have accelerated for three seconds.
    D: When the passed vehicle flashes its headlights.
  answer: B
  explanation: When you see the front of the passed car in the rearview mirror and
    your vehicle is well clear, signal intent, gently and slowly move back to the
    original lane.
- id: 149
  category: signs_and_signals
  question: What do yellow pavement lines indicate on a roadway?
  choices:
    A: They separate traffic traveling in the same direction.
    B: They indicate a school zone ahead.
    C: They separate traffic traveling in different directions.
    D: They mark the right edge of the roadway.
  answer: C
  explanation: According to the pavement markings rules, yellow lines separate traffic
    traveling in different directions, while white lines separate traffic traveling
    in the same direction.
- id: 150
  category: safe_driving_rules
  question: In which of the following situations is passing considered illegal?
  choices:
    A: Within 100 feet of a railroad crossing.
    B: On a road with broken white lines.
    C: When the vehicle ahead is traveling below the speed limit.
    D: When you have a broken yellow line on your side of the road.
  answer: A
  explanation: Passing is illegal in several situations, including within 100 feet
    of a railroad crossing, intersection, or narrow bridge/tunnel.
- id: 151
  category: defensive_driving
  question: According to the manual, what percentage of serious crashes are due to
    dangerous choices or errors people make behind the wheel?
  choices:
    A: 50 percent
    B: 75 percent
    C: 82 percent
    D: 94 percent
  answer: D
  explanation: The manual states that 94 percent of serious crashes are due to dangerous
    choices or errors people make behind the wheel.
- id: 152
  category: defensive_driving
  question: How far ahead should you scan road conditions to maintain awareness of
    your surroundings?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: 30 to 45 seconds
  answer: C
  explanation: As part of defensive driving, you should check your mirrors frequently
    and scan conditions 20 to 30 seconds ahead of you.
- id: 153
  category: defensive_driving
  question: What does it mean to 'have an escape route' while driving?
  choices:
    A: Knowing the quickest way to your destination.
    B: Keeping your windows rolled down in case of an emergency.
    C: Leaving yourself an out or alternate path of travel if your immediate path
      is blocked.
    D: Memorizing the locations of all highway exits.
  answer: C
  explanation: Having an escape route means leaving yourself an out—a place to move
    your vehicle if your immediate path of travel is suddenly blocked.
- id: 154
  category: safe_driving_rules
  question: According to the manual, when are roadways the safest?
  choices:
    A: When all vehicles travel at the maximum speed limit.
    B: When all vehicles travel the same speed but do not exceed the speed limit.
    C: When slower traffic stays strictly in the right lane.
    D: When there is a mix of fast and slow-moving vehicles.
  answer: B
  explanation: The safest roadways are when all vehicles travel the same speed but
    do not exceed the speed limit.
- id: 155
  category: sharing_the_road
  question: What type of sign might you see on the back of a slow-moving vehicle like
    a farm tractor or horse-drawn vehicle?
  choices:
    A: A red octagon
    B: A yellow diamond
    C: An orange triangle
    D: A white rectangle
  answer: C
  explanation: Slow-moving vehicles may have a slow-moving vehicle sign (an orange
    triangle or flashing lights) on the back.
- id: 156
  category: defensive_driving
  question: What should you do if you are being tailgated by another vehicle?
  choices:
    A: Brake suddenly to warn the driver.
    B: Speed up to increase the distance between you.
    C: Move slightly to the right and try slowing down to encourage them to pass.
    D: Turn on your hazard lights and stop in your lane.
  answer: C
  explanation: If you are being tailgated, move slightly to the right and give the
    tailgater a better view of what is ahead... Try slowing down and encouraging the
    driver behind you to pass.
- id: 157
  category: safe_driving_rules
  question: Under Iowa law, when are you required to use your headlights?
  choices:
    A: From sunset to sunrise or whenever visibility is 500 feet or less.
    B: From 8 PM to 6 AM only.
    C: Whenever you are driving on a highway.
    D: Only when visibility is less than 100 feet.
  answer: A
  explanation: Iowa law requires the use of both headlights from sunset to sunrise
    or whenever visibility is 500 feet or less, (fog, heavy rain, snow, etc.).
- id: 158
  category: vehicle_information
  question: What is a good rule of thumb regarding headlight use during inclement
    weather?
  choices:
    A: Turn your headlights on whenever you turn your windshield wipers on.
    B: Only use high beams in heavy snow.
    C: Turn your headlights off if your vehicle has daytime running lights.
    D: Use hazard lights instead of headlights in the rain.
  answer: A
  explanation: A good rule of thumb is to turn your headlights on whenever you turn
    your windshield wipers on.
- id: 159
  category: safe_driving_rules
  question: In which of the following situations should you use your horn?
  choices:
    A: To greet a friend walking on the sidewalk.
    B: To express anger at a driver who cut you off.
    C: When you are exiting a narrow alley and cannot see what is ahead.
    D: To encourage a slow driver to speed up.
  answer: C
  explanation: You should use your horn when you are coming to a place where you cannot
    see what is ahead, such as exiting a narrow alley.
- id: 160
  category: defensive_driving
  question: What should you and your passengers do if your vehicle stalls in a traveled
    lane and cannot be moved?
  choices:
    A: Stay inside the vehicle with your seatbelts fastened.
    B: Exit the vehicle quickly and stand in a safe area away from moving vehicles.
    C: Stand directly behind the vehicle to wave traffic around.
    D: Attempt to push the vehicle while traffic is moving.
  answer: B
  explanation: If you are stalled in a traveled lane, you and your passengers should
    exit the vehicle quickly and stand in a safe area; when possible, away from the
    shoulder of the road and far from moving vehicles.
- id: 161
  category: safe_driving_rules
  question: When preparing to enter an intersection, in which order should you look
    for approaching vehicles and pedestrians?
  choices:
    A: Right, left, and right again
    B: Left, right, and left again
    C: Straight ahead, then behind you
    D: Left, then straight ahead
  answer: B
  explanation: Before proceeding through an intersection, you should look left, right,
    and left again for approaching vehicles and pedestrians.
- id: 162
  category: defensive_driving
  question: Why should you beware of a "false" turn signal from an approaching vehicle?
  choices:
    A: The driver may plan to turn beyond you or forgot to turn the signal off.
    B: Turn signals are often wired incorrectly on newer vehicles.
    C: The driver is signaling to tell you to proceed first.
    D: It indicates the vehicle is about to stop suddenly.
  answer: A
  explanation: Do not turn just because an approaching vehicle has a turn signal on.
    The driver may plan to turn beyond you or has forgotten to turn the signal off
    from a prior turn.
- id: 163
  category: safe_driving_rules
  question: When crossing or turning left onto a rural four-lane road, what is the
    safest method?
  choices:
    A: Accelerate quickly to cross both directions of traffic at once.
    B: Proceed into the median, remain stopped, look right, and cross when safe.
    C: Wait until there is no traffic in either direction for at least a mile.
    D: Merge into the right lane first, then make a U-turn.
  answer: B
  explanation: Do not try to cross both directions of traffic at one time. Stop at
    the stop sign, look left and proceed into the median when safe. Remain stopped
    in the median, look right, and cross or turn left when safe.
- id: 164
  category: safe_driving_rules
  question: What is the purpose of the acceleration and merge area of an interstate
    on-ramp?
  choices:
    A: To completely stop and wait for a gap in traffic.
    B: To bring your vehicle up to the speed of traffic and merge when safe.
    C: To scan the roadway and evaluate how much space you have.
    D: To allow interstate traffic to exit the highway safely.
  answer: B
  explanation: Use the acceleration and merge area to bring your vehicle up to the
    speed of traffic and merge when safe to do so. Do not completely stop on the ramp
    unless absolutely necessary.
- id: 165
  category: safe_driving_rules
  question: How do drivers on a side road turn left or cross a four-lane highway at
    a reduced-conflict intersection?
  choices:
    A: By waiting for a gap in both directions of traffic simultaneously.
    B: By using a traditional traffic light to cross directly over.
    C: By turning right onto the highway, merging left, and making a U-turn at a designated
      opening.
    D: By driving on the opposite side of the road briefly before diverging back.
  answer: C
  explanation: At reduced-conflict intersections, drivers on the side road wanting
    to turn left or cross the four-lane highway will turn right onto the highway,
    merge into the left lane and then make a U-turn at a designated median opening.
- id: 166
  category: safe_driving_rules
  question: What is a unique feature of a diverging diamond interchange?
  choices:
    A: It directs traffic in a counterclockwise direction around a center island.
    B: It requires drivers to stop in the median before crossing the second half of
      the road.
    C: It directs drivers on the opposite side of the road briefly before diverging
      back into the correct direction.
    D: It uses only yield signs and no traffic lights.
  answer: C
  explanation: A diverging diamond interchange has a unique design that directs drivers
    on the opposite side of the road briefly before diverging back into the correct
    direction.
- id: 167
  category: safe_driving_rules
  question: In which direction does traffic move in a roundabout?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: In a figure-eight pattern
    D: Straight through the center island
  answer: B
  explanation: Roundabouts are intersections that direct traffic in a counterclockwise
    direction around a center island.
- id: 168
  category: signs_and_signals
  question: Which of the following traffic control devices are NOT found at a roundabout?
  choices:
    A: Yield signs
    B: Directional signs
    C: Pavement markings
    D: Stop signs and traffic signals
  answer: D
  explanation: Roundabouts have no stop signs or traffic signals. Yield signs, directional
    signs, and pavement markings guide traffic through the intersection.
- id: 169
  category: safe_driving_rules
  question: How should a motorist exit a single-lane roundabout?
  choices:
    A: Stop completely, then turn right.
    B: Signal, then exit the roundabout to your right, yielding to anyone in the crosswalk.
    C: Accelerate and exit without signaling to maintain traffic flow.
    D: Change to the left lane before exiting.
  answer: B
  explanation: When exiting a single-lane roundabout, you should signal, then exit
    the roundabout to your right, and yield to anyone in the crosswalk.
- id: 170
  category: sharing_the_road
  question: How should an experienced bicyclist navigate a roundabout if they choose
    to ride through it like a motorist?
  choices:
    A: Hug the curb to stay out of the way of vehicles.
    B: Ride in the middle of the lane to prevent vehicles from passing.
    C: Ride on the truck apron.
    D: Ride against the flow of traffic.
  answer: B
  explanation: Experienced cyclists navigating roundabouts like motorists should not
    hug the curb. They should ride in the middle of the lane to prevent vehicles from
    passing.
- id: 171
  category: safe_driving_rules
  question: Which of the following is a rule for driving in a multi-lane roundabout?
  choices:
    A: Change lanes while inside the roundabout to reach your exit.
    B: Pass trucks and buses quickly to avoid their blind spots.
    C: Do not change lanes in the roundabout.
    D: Always drive in the outside lane, regardless of your exit.
  answer: C
  explanation: When driving in a multi-lane roundabout, you must not change lanes
    in the roundabout.
- id: 172
  category: sharing_the_road
  question: Why should you avoid passing or driving beside trucks or buses in a multi-lane
    roundabout?
  choices:
    A: They are required to drive much faster than cars.
    B: They may straddle lanes or may not see you.
    C: They are not allowed in roundabouts and might behave unpredictably.
    D: They must always use the center island to turn.
  answer: B
  explanation: You should not pass or drive beside trucks or buses in a roundabout
    because they may straddle lanes or may not see you.
- id: 173
  category: defensive_driving
  question: How should you adjust your driving when traveling on loose gravel compared
    to pavement?
  choices:
    A: Drive faster to maintain momentum over the gravel.
    B: Make sudden turns to avoid sliding.
    C: Brake firmly and quickly when stopping.
    D: Slow down, avoid sudden turning, and increase your following distance.
  answer: D
  explanation: Driving on loose gravel reduces traction. You should slow down, avoid
    sudden turning, accelerate and brake slowly, and increase your following distance.
- id: 174
  category: safe_driving_rules
  question: What is true about uncontrolled intersections, which are common on gravel
    roads?
  choices:
    A: They are controlled by traffic lights but no signs.
    B: They are not controlled by yield or stop signs.
    C: They always require the driver on the right to stop.
    D: They are only found in urban areas.
  answer: B
  explanation: Uncontrolled intersections are more common on gravel roads. They are
    not controlled by yield or stop signs, so all drivers should use caution and be
    prepared to stop.
- id: 175
  category: safe_driving_rules
  question: Which vehicle should yield the right-of-way at an uncontrolled intersection?
  choices:
    A: The vehicle on the right
    B: The vehicle on the left
    C: The larger vehicle
    D: The vehicle traveling faster
  answer: B
  explanation: At an uncontrolled intersection, the vehicle on the left should yield.
    You should never assume the intersection is clear or that the other vehicle will
    stop.
- id: 176
  category: safe_driving_rules
  question: What should you do to make your vehicle more visible to others during
    extremely dusty conditions on rural roads?
  choices:
    A: Use high beam headlights
    B: Turn on your hazard lights
    C: Use low beam headlights
    D: Honk your horn periodically
  answer: C
  explanation: The manual states to use low beam headlights to make your vehicle more
    visible to others during extremely dusty conditions.
- id: 177
  category: defensive_driving
  question: If you are blinded by an oncoming vehicle's headlights at night, where
    should you look?
  choices:
    A: Directly at the oncoming headlights
    B: At the center line of the road
    C: At the white stripe at the right edge of the pavement
    D: At your rearview mirror
  answer: C
  explanation: If you are blinded by another vehicle’s headlights, slow down and watch
    the white stripe at the right edge of the pavement until the feeling disappears.
- id: 178
  category: defensive_driving
  question: What is the recommended action if you encounter an animal on the road
    and do not have time to stop?
  choices:
    A: Swerve sharply to the left
    B: Swerve sharply to the right
    C: Honk your horn and accelerate
    D: Do not swerve or veer
  answer: D
  explanation: If an animal is encountered, and there isn’t time to stop, don’t swerve
    or veer as this will likely result in a more severe crash.
- id: 179
  category: sharing_the_road
  question: How can you tell if you are driving in a large truck's blind spot or "no-zone"?
  choices:
    A: You are driving exactly the speed limit
    B: You cannot see the truck driver in the truck's mirror
    C: You are more than three car lengths behind the truck
    D: The truck's turn signals are flashing
  answer: B
  explanation: Large trucks have blind spots, or "no-zones." If you can’t see the
    truck driver in the truck’s mirror, the truck driver can’t see you.
- id: 180
  category: sharing_the_road
  question: Why should you avoid cutting in between a large truck and the curb at
    an intersection?
  choices:
    A: Trucks often swing widely to the left to safely negotiate a right turn.
    B: The truck may accelerate faster than your car.
    C: It is illegal to pass a truck on the right under any circumstances.
    D: The truck's exhaust will obscure your vision.
  answer: A
  explanation: Truck drivers sometimes need to swing widely to the left in order to
    safely negotiate a right turn. Cutting in between the truck and the curb increases
    the possibility of a crash.
- id: 181
  category: sharing_the_road
  question: Where are car and motorcycle collisions most likely to occur?
  choices:
    A: On interstate highways
    B: At intersections
    C: On rural gravel roads
    D: In parking lots
  answer: B
  explanation: Intersections are the most likely places for car/motorcycle collisions
    to occur. Make sure you see the motorcycle and know its speed before turning.
- id: 182
  category: sharing_the_road
  question: What is the minimum recommended following distance when driving behind
    a motorcycle under normal conditions?
  choices:
    A: 1-2 seconds
    B: 3-4 seconds
    C: 5-6 seconds
    D: 7-8 seconds
  answer: B
  explanation: When driving behind a motorcycle, allow at least a 3-4 second following
    distance. This provides the cyclist enough room to maneuver or stop in an emergency.
- id: 183
  category: sharing_the_road
  question: What is the proper procedure for passing a bicyclist on the road?
  choices:
    A: Honk your horn and pass closely in the same lane
    B: Move halfway into the next lane to pass
    C: Completely change lanes, giving the bicyclist the entire lane
    D: Speed up and pass as quickly as possible in the same lane
  answer: C
  explanation: When passing bicyclists, you must completely change lanes, giving the
    bicyclist the entire lane like you would with any other vehicle.
- id: 184
  category: safe_driving_rules
  question: Why must you never pass another vehicle that has stopped or is slowing
    down for a pedestrian?
  choices:
    A: The vehicle may be preparing to make a U-turn.
    B: It is illegal to change lanes near an intersection.
    C: You might not be able to see the pedestrian when you approach.
    D: The stopped vehicle might suddenly accelerate.
  answer: C
  explanation: Never pass another vehicle that has stopped or is slowing down for
    a pedestrian because you might not be able to see the pedestrian when you approach
    the stopped vehicle.
- id: 185
  category: driver_responsibility
  question: In Iowa, what action is legally permissible if you see a person or animal
    trapped inside a hot, enclosed vehicle and needing medical attention?
  choices:
    A: You may break the vehicle's window.
    B: You may tow the vehicle to a shaded area.
    C: You must wait for law enforcement to arrive before taking any action.
    D: You may pick the lock but cannot damage the vehicle.
  answer: A
  explanation: In Iowa it is legal for you to break a vehicle’s window in order to
    provide medical attention to a person or animal trapped inside.
- id: 186
  category: safe_driving_rules
  question: Which feature of your vehicle should you NOT use during inclement weather?
  choices:
    A: Low beam headlights
    B: Windshield wipers
    C: Defroster
    D: Cruise control
  answer: D
  explanation: If you must drive in inclement weather, slow down and increase your
    following distance. DO NOT use cruise control during inclement weather.
- id: 187
  category: safe_driving_rules
  question: What is a common characteristic of railroad crossings on rural roads?
  choices:
    A: They always have crossing gates.
    B: They typically have no red flashing lights, warning bells, or crossing gates.
    C: They are always marked with bright neon pavement markings.
    D: They are elevated above the roadway.
  answer: B
  explanation: Unlike most railroad crossings on major roads, there are typically
    no red flashing lights, warning bells, crossing gates or pavement markings at
    rural road railroad crossings.
- id: 188
  category: defensive_driving
  question: During which months do peak deer collisions typically occur in Iowa?
  choices:
    A: January, February, and March
    B: June, July, and August
    C: October, November, and May
    D: December, April, and September
  answer: C
  explanation: October, November and May are the peak months for deer collisions;
    however, they can occur at any time of the year.
- id: 189
  category: sharing_the_road
  question: Why should you be extra cautious of a motorcycle's turn signals?
  choices:
    A: They are often too dim to see during the day.
    B: They do not automatically shut off and riders may forget to cancel them.
    C: They flash faster than a car's turn signals.
    D: Motorcycles are not required to have turn signals.
  answer: B
  explanation: Turn signals do not automatically shut off on a motorcycle and riders
    occasionally forget to cancel them after a turn is completed. Make sure you know
    what the rider is going to do BEFORE you move into their path.
- id: 190
  category: safe_driving_rules
  question: What should you do with your following distance when driving on wet or
    slippery roads?
  choices:
    A: Decrease it to two seconds
    B: Keep it at three seconds
    C: Increase it to five or six seconds
    D: Increase it to ten seconds
  answer: C
  explanation: The manual states that on wet or slippery roads, you should drive slower
    than normal and increase your following distance to five or six seconds.
- id: 191
  category: safe_driving_rules
  question: When driving in inclement weather, which vehicle feature should you NEVER
    use?
  choices:
    A: Defroster
    B: Low-beam headlights
    C: Windshield wipers
    D: Cruise control
  answer: D
  explanation: 'The manual explicitly warns: "DO NOT USE CRUISE CONTROL DURING INCLEMENT
    WEATHER" and repeats this warning for wet, slippery, icy, or snowy conditions.'
- id: 192
  category: defensive_driving
  question: How much moving water does it take to sweep away a vehicle, including
    SUVs and pickups?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: A
  explanation: According to the manual, moving water is extremely powerful, and as
    little as 6 inches of water may sweep away a vehicle, including SUVs and pickups.
- id: 193
  category: defensive_driving
  question: If your car is swept into water and becomes submerged, what is the recommended
    way to escape?
  choices:
    A: Immediately kick out the windshield
    B: Wait for the vehicle to fill with water so the doors are easier to open
    C: Roll down the windows before the water reaches the door handle
    D: Open the door immediately against the water pressure
  answer: B
  explanation: The manual advises that if your car is submerged, you should remain
    calm and wait for the vehicle to fill with water, because once the vehicle is
    full, the doors are easier to open.
- id: 194
  category: safe_driving_rules
  question: Why should you avoid using high-beam headlights when driving in fog?
  choices:
    A: They drain the vehicle's battery too quickly
    B: They reflect off the fog, causing glare and reduced visibility
    C: They make it difficult to see the lines on the road
    D: They can overheat the headlight assembly
  answer: B
  explanation: The manual states you should use low-beam lights or fog lights because
    high beams reflect off the fog, causing glare and reduced visibility.
- id: 195
  category: defensive_driving
  question: If you are driving and a tornado warning is issued, but you cannot make
    it to a shelter, what should you do if you remain in your vehicle?
  choices:
    A: Park under a bridge or overpass
    B: Try to outrun the tornado by driving at a high speed
    C: Pull over, duck below the windows, keep your seat belt fastened, and cover
      your head
    D: Exit the vehicle and stand next to it for protection
  answer: C
  explanation: If unable to make it to a shelter, the manual advises to pull over,
    duck down below the windows, keep your seat belt fastened, and cover your head
    with your hands or an object.
- id: 196
  category: safe_driving_rules
  question: Why are bridges and overpasses particularly prone to black ice?
  choices:
    A: They are usually made of metal instead of concrete
    B: Moisture freezes quickly due to circulating air both above and below the road
      surface
    C: Snowplows do not clear bridges as often as regular roads
    D: They are elevated closer to the freezing atmosphere
  answer: B
  explanation: Black ice is common on bridges and overpasses because moisture freezes
    quickly due to circulating air both above and below the road surface.
- id: 197
  category: safe_driving_rules
  question: How much greater can stopping distances be when driving on ice and snow
    compared to normal conditions?
  choices:
    A: 2 times greater
    B: 5 times greater
    C: 10 times greater
    D: 20 times greater
  answer: C
  explanation: The manual warns that you should begin slowing down long before anticipating
    a stop because stopping distances can be 10 times greater in ice and snow.
- id: 198
  category: sharing_the_road
  question: What is the typical operating speed of a snowplow?
  choices:
    A: 15-25 mph
    B: 25-35 mph
    C: 35-45 mph
    D: 45-55 mph
  answer: B
  explanation: According to the manual, snowplows typically operate at 25-35 mph,
    and many drivers fail to realize this and hit them from behind.
- id: 199
  category: sharing_the_road
  question: When sharing the road with a snowplow, where should you never attempt
    to pass?
  choices:
    A: On the left side
    B: On a multi-lane highway
    C: On the shoulder side
    D: In a passing zone
  answer: C
  explanation: 'The manual explicitly states: "Never pass on the shoulder side of
    a plow. Plows will move snow to the shoulders."'
- id: 200
  category: vehicle_information
  question: If your vehicle's engine stalls while driving, what should you expect?
  choices:
    A: The steering wheel will lock completely
    B: The brakes will stop working entirely
    C: The steering wheel will be difficult to turn and you will have to push very
      hard on the brake pedal
    D: The vehicle will immediately come to a sudden stop
  answer: C
  explanation: If the engine stalls, the manual notes that the steering wheel will
    be difficult to turn (but you can turn it) and the brakes will still work, but
    you will have to push very hard on the brake pedal.
- id: 201
  category: vehicle_information
  question: What is the first step you should take if your brakes stop working?
  choices:
    A: Shift into neutral immediately
    B: Pump the brake pedal several times
    C: Engage the parking brake as fast and hard as possible
    D: Turn off the engine
  answer: B
  explanation: If your brakes stop working, the first step is to pump the brake pedal
    several times, which will often build up enough brake pressure to allow you to
    stop.
- id: 202
  category: vehicle_information
  question: What should you do if your gas pedal becomes stuck while driving?
  choices:
    A: Turn off the engine immediately while still moving
    B: Quickly shift to neutral and pull off the road
    C: Pump the brake pedal rapidly
    D: Shift into a lower gear and steer into a ditch
  answer: B
  explanation: For a stuck gas pedal, the manual instructs drivers to keep their eyes
    on the road, quickly shift to neutral, pull off the road when safe, and turn off
    the engine AFTER stopping.
- id: 203
  category: driver_responsibility
  question: Under state law, within how many hours must you report a crash involving
    injury, death, or property damage over $1,500 to avoid losing your driving privileges?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 96 hours
  answer: C
  explanation: It is state law to report such a crash to the police. Failure to do
    so within 72 hours of the incident will result in the loss of your driving privileges
    and further penalties.
- id: 204
  category: vehicle_information
  question: What happens if you remove the key from the ignition while the vehicle
    is still moving?
  choices:
    A: The engine will stall but steering will remain normal
    B: The steering wheel will lock, causing a potential loss of control
    C: The brakes will automatically engage
    D: The vehicle will safely coast to a stop
  answer: B
  explanation: The manual warns never to remove the key while driving because the
    steering wheel will lock, which may cause loss of control of the vehicle and could
    result in a crash.
- id: 205
  category: driver_responsibility
  question: When interacting with law enforcement after a crash, which of the following
    documents should you be ready to provide?
  choices:
    A: Vehicle insurance, vehicle registration, and driver's license
    B: Birth certificate and social security card
    C: Vehicle title and proof of purchase
    D: Medical records and driver's license
  answer: A
  explanation: The manual states that you must be ready to provide a law enforcement
    officer with vehicle insurance information, vehicle registration, and your driver's
    license.
- id: 206
  category: driver_responsibility
  question: According to the manual, what must you do if you are considered at fault
    in a crash involving another driver?
  choices:
    A: Pay the other driver in cash immediately at the scene
    B: Discuss what expenses you will have to cover for them with your insurance
    C: Surrender your driver's license to the other driver
    D: Leave the scene before law enforcement arrives
  answer: B
  explanation: 'The manual states: ''If you are considered at fault in a crash involving
    another driver, you will need to discuss what expenses you will have to cover
    for them as well.'''
- id: 207
  category: safe_driving_rules
  question: What is the general rule when engaging with a law enforcement officer?
  choices:
    A: Argue your case immediately
    B: Remain calm and follow instructions
    C: Exit your vehicle to greet the officer
    D: Refuse to speak until a lawyer is present
  answer: B
  explanation: The manual advises that when engaging with a law enforcement officer,
    you should remain calm and follow instructions.
- id: 208
  category: license_system
  question: If you have autism or are deaf or hard of hearing, what option is available
    for your driver's license or ID?
  choices:
    A: You can choose to have an indicator added to your license or ID
    B: You are required to carry a doctor's note at all times
    C: You must apply for a restricted driver's license
    D: You cannot legally operate a motor vehicle
  answer: A
  explanation: 'The manual notes: ''If you have autism and/or are deaf or hard of
    hearing, you may choose to have an indicator added to your license or ID.'''
- id: 209
  category: license_system
  question: Where is the autism or deaf/hard of hearing indicator visible to law enforcement?
  choices:
    A: Only on the physical driver's license or ID
    B: Only in the law enforcement database
    C: Printed on the license/ID and visible in the database used by law enforcement
    D: On a special sticker placed on the vehicle's windshield
  answer: C
  explanation: The manual states that this type of indicator is printed on your license/ID
    and will also be visible in the database used by law enforcement to lookup a driver's
    information.
- id: 210
  category: driver_responsibility
  question: What is the primary purpose of adding an autism or deaf/hard of hearing
    indicator to your license?
  choices:
    A: To exempt the driver from paying traffic fines
    B: To allow the driver to park in handicap parking spaces
    C: To help the officer be better prepared to interact with you during a traffic
      stop
    D: To notify emergency medical services of your blood type
  answer: C
  explanation: According to the manual, having the indicator visible to law enforcement
    'helps the officer be better prepared to interact with you.'
- id: 211
  category: safe_driving_rules
  question: If an official law enforcement vehicle signals you to stop on a busy street
    or highway, where is the safest place to pull over?
  choices:
    A: In the center median
    B: Into a parking lot or on a less busy side street
    C: On the left shoulder of the highway
    D: Directly in the travel lane
  answer: B
  explanation: The manual advises that on busy streets or highways, it may be safest
    to pull over into a parking lot or on a less busy side street.
- id: 212
  category: safe_driving_rules
  question: When being pulled over by law enforcement, where should you NEVER stop
    your vehicle?
  choices:
    A: In a parking lot
    B: On a less busy side street
    C: In a clear area
    D: In the travel lane
  answer: D
  explanation: 'The manual explicitly states: ''Do not stop in the travel lane.''
    when you are signaled to stop by a law enforcement vehicle.'
- id: 213
  category: safe_driving_rules
  question: What should you do with your vehicle once you have safely pulled over
    for a traffic stop?
  choices:
    A: Keep the engine running in case you need to move
    B: Turn off your vehicle
    C: Put the vehicle in neutral and apply the parking brake only
    D: Turn on your hazard lights and leave the engine running
  answer: B
  explanation: During a traffic stop, the manual instructs drivers to 'Turn off your
    vehicle, keep your hands visible... remain calm, and follow the officer's instructions.'
- id: 214
  category: safe_driving_rules
  question: During a traffic stop, where is it recommended that you keep your hands?
  choices:
    A: In your pockets
    B: Reaching for your registration in the glove box
    C: Visible, recommended on the steering wheel
    D: Outside the driver's side window
  answer: C
  explanation: The manual advises drivers to 'keep your hands visible (recommended
    on the steering wheel)' during a traffic stop.
- id: 215
  category: driver_responsibility
  question: 'The Iowa driver''s manual is intended as general information and is NOT
    a substitute for:'
  choices:
    A: A driver's education course
    B: Legal advice
    C: A valid driver's license
    D: Vehicle insurance
  answer: B
  explanation: 'The manual includes a disclaimer stating: ''This publication is intended
    as general information and is not a substitute for legal advice.'''
- id: 216
  category: driver_testing
  question: Where can you take a practice knowledge test before scheduling an appointment
    for the real test?
  choices:
    A: Only at the local police station
    B: Online at the Iowa DOT website
    C: By calling the Iowa DOT Civil Rights office
    D: At any authorized vehicle dealership
  answer: B
  explanation: The manual states you can 'Take our practice knowledge test online
    at iowadot.gov/mvd/driverslicense/manuals-and-practice-tests'.
- id: 217
  category: driver_responsibility
  question: Which of the following is NOT listed as a document you must be ready to
    provide to a law enforcement officer?
  choices:
    A: Vehicle insurance information
    B: Vehicle registration
    C: Driver's license
    D: Proof of vehicle inspection
  answer: D
  explanation: The manual lists vehicle insurance information, vehicle registration,
    and driver's license as the documents to provide. Proof of vehicle inspection
    is not mentioned.
- id: 218
  category: driver_responsibility
  question: If a person with limited English proficiency needs special assistance,
    who should they contact according to the manual?
  choices:
    A: The local highway patrol
    B: Iowa DOT Civil Rights
    C: Their insurance provider
    D: The state legislature
  answer: B
  explanation: 'The manual states: ''If you need more information or special assistance
    for persons with disabilities or limited English proficiency, contact Iowa DOT
    Civil Rights at 515-239-1111...'''
- id: 219
  category: driver_responsibility
  question: Why should you refer to your liability coverage after a crash?
  choices:
    A: To assess what expenses will need to be paid and what you are eligible to receive
    B: To determine if you can legally drive your vehicle home
    C: To find out if you need to report the crash to law enforcement
    D: To calculate the points that will be added to your license
  answer: A
  explanation: 'Under Step 4: Report to insurance, the manual instructs: ''Refer to
    your liability coverage to assess what expenses will need to be paid and what
    you are eligible to receive.'''
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 220
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 221
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 222
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 223
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 224
- image: no_u_turn.png
  category: signs_and_signals
