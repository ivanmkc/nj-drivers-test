questions:
- id: 1
  category: safe_driving_rules
  question: ¿Según las reglas básicas de seguridad del manual, quién está obligado
    a abrocharse el cinturón en el vehículo?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero
    B: Solo los niños menores de 18 años
    C: Todos, sin importar en qué parte del vehículo estén sentados
    D: Solo los pasajeros del asiento trasero
  answer: C
  explanation: 'El manual establece como regla básica de seguridad: "Abroche su cinturón,
    sin importar en qué parte del vehículo esté sentado".'
- id: 2
  category: safe_driving_rules
  question: ¿Cuál de las siguientes se enumera como una regla básica de seguridad
    para comenzar como un conductor seguro?
  choices:
    A: Conducir a 5 mph por debajo del límite de velocidad
    B: Prestar toda su atención a la tarea de conducir
    C: Usar solo dispositivos de manos libres al conducir
    D: Mantener las luces delanteras encendidas en todo momento
  answer: B
  explanation: El manual enumera explícitamente "Prestar toda su atención a la tarea
    de conducir" como una de las reglas básicas de seguridad.
- id: 3
  category: license_system
  question: Al visitar un centro de servicios de licencias de conducir en Iowa, ¿qué
    ubicación debe visitar?
  choices:
    A: Debe visitar la ubicación más cercana a su lugar de residencia
    B: Debe visitar la sede principal del DOT en Des Moines
    C: Puede visitar cualquier Centro de Servicios del DOT de Iowa o la Oficina del
      Tesorero del Condado
    D: Solo puede visitar la Oficina del Tesorero del Condado si es un residente nuevo
  answer: C
  explanation: El manual establece que hay centros de servicio en todo el estado en
    los Centros de Servicio del DOT de Iowa y en las Oficinas del Tesorero del Condado,
    y que "Puede visitar cualquier ubicación; no tiene que ser la más cercana a donde
    vive".
- id: 4
  category: license_system
  question: ¿A qué edad es potencialmente elegible para renovar su licencia de conducir
    de Iowa en línea?
  choices:
    A: 16 años o más
    B: 18 años o más
    C: 21 años o más
    D: 25 años o más
  answer: B
  explanation: Según el manual, algunos servicios, como la renovación de la licencia,
    están disponibles en línea si tiene 18 años o más y cumple con otros requisitos.
- id: 5
  category: license_system
  question: ¿Sobre qué advierte el manual con respecto a los servicios de licencias
    de conducir en línea?
  choices:
    A: Los servicios en línea solo están disponibles durante el horario comercial
      habitual
    B: Existen sitios web que venden información que el DOT proporciona de forma gratuita
    C: Debe pagar una tarifa de conveniencia adicional para renovar en línea
    D: La renovación en línea solo está disponible para conductores comerciales
  answer: B
  explanation: El manual advierte que "Existen varios sitios web que venden información
    que nosotros proporcionamos de forma gratuita. Le hacen pensar que está obteniendo
    una nueva licencia de conducir, pero no es así".
- id: 6
  category: license_system
  question: En Iowa, se requiere tener un permiso o licencia si opera ¿cuál de los
    siguientes en las vías públicas?
  choices:
    A: Un vehículo motorizado, motocicleta o ciclomotor (moped)
    B: Una bicicleta o un scooter eléctrico
    C: Una silla de ruedas motorizada
    D: Solo un tractor agrícola
  answer: A
  explanation: 'El manual establece: "En Iowa, cualquier persona que opere un vehículo
    motorizado, motocicleta o ciclomotor (moped) en las vías públicas debe tener un
    permiso o licencia".'
- id: 7
  category: license_system
  question: Se le considera residente de Iowa para fines de la licencia de conducir
    si ha vivido en Iowa continuamente durante ¿cuántos días?
  choices:
    A: 14 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Se le considera residente de Iowa si ha "Vivido en Iowa continuamente
    durante 30 días".
- id: 8
  category: license_system
  question: ¿Cuál de las siguientes acciones lo convierte en residente de Iowa para
    los fines de la licencia de conducir?
  choices:
    A: Alojarse en un hotel en Iowa durante dos semanas
    B: Inscribir a su hijo en una escuela pública de Iowa
    C: Visitar a la familia en Iowa durante el verano
    D: Conducir a través de Iowa en un viaje por carretera por todo el país
  answer: B
  explanation: Uno de los criterios para ser considerado residente de Iowa para fines
    de licencia es si ha "Inscrito a su hijo en una escuela pública de Iowa".
- id: 9
  category: license_system
  question: ¿Cuál de estos criterios establece la residencia en Iowa para fines de
    la licencia de conducir?
  choices:
    A: Registrarse para votar en este estado
    B: Aceptar un trabajo temporal de dos semanas en Iowa
    C: Alquilar un auto en Iowa
    D: Asistir a una conferencia de fin de semana en Iowa
  answer: A
  explanation: El manual enumera "Registrado para votar en este estado" como una de
    las condiciones que lo convierte en residente de Iowa para fines de la licencia
    de conducir.
- id: 10
  category: license_system
  question: ¿Bajo qué condición NO necesita una licencia de conducir de Iowa mientras
    conduce un vehículo militar?
  choices:
    A: Si es veterano de las Fuerzas Armadas de los EE. UU.
    B: Si conduce un vehículo militar mientras está en servicio con las Fuerzas Armadas
      de los EE. UU.
    C: Si conduce un vehículo militar para un desfile
    D: Si es un contratista civil que trabaja en una base militar
  answer: B
  explanation: El manual establece que NO necesita una licencia de conducir si está
    "Conduciendo un vehículo militar mientras está en servicio con las Fuerzas Armadas
    de los EE. UU.".
- id: 11
  category: license_system
  question: ¿Usted NO necesita una licencia de conducir de Iowa si está conduciendo
    equipo agrícola entre la granja principal y tierras de cultivo cercanas dentro
    de qué distancia?
  choices:
    A: 2 millas
    B: 5 millas
    C: 10 millas
    D: 15 millas
  answer: A
  explanation: Usted no necesita una licencia si está "conduciendo equipo agrícola
    entre la granja principal y cualquier tierra de cultivo o explotación agrícola
    cercana dentro de un radio de dos millas".
- id: 12
  category: license_system
  question: Si usted es un visitante o estudiante en Iowa, ¿necesita una licencia
    de conducir de Iowa para conducir?
  choices:
    A: Sí, debe obtener una licencia de Iowa en un plazo de 30 días
    B: Sí, a menos que solo se quede por menos de una semana
    C: No, siempre que conduzca con una licencia vigente de su estado o país de origen
    D: No, pero debe obtener un permiso de conducir temporal para visitantes
  answer: C
  explanation: Usted NO necesita una licencia de conducir de Iowa si está "conduciendo
    con una licencia vigente de su estado o país de origen mientras se encuentra en
    Iowa como visitante o estudiante".
- id: 13
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes opciones aparece explícitamente en las reglas
    básicas de seguridad del manual con respecto al alcohol y la conducción?
  choices:
    A: Conducir sobrio
    B: Su concentración de alcohol en sangre (BAC) debe ser inferior al 0.08%
    C: No beber dentro de las 4 horas previas a la conducción
    D: Solo conducir si ha tomado una bebida o menos
  answer: A
  explanation: La sección "Mensaje importante para los conductores" enumera "Conducir
    sobrio" como una de las reglas básicas de seguridad.
- id: 14
  category: license_system
  question: ¿Recibir qué tipo de asistencia lo convierte en residente de Iowa para
    fines de la licencia de conducir?
  choices:
    A: Préstamos estudiantiles federales
    B: Asistencia pública del estado de Iowa
    C: Beneficios del Seguro Social
    D: Beneficios de Medicare
  answer: B
  explanation: Se le considera residente de Iowa para fines de la licencia de conducir
    si "recibe asistencia pública del estado de Iowa".
- id: 15
  category: license_system
  question: ¿Bajo qué condición NO se requiere que tenga una licencia de conducir
    de Iowa?
  choices:
    A: Conducir un camión de reparto comercial para un negocio local.
    B: Conducir equipo agrícola entre la granja principal y tierras de cultivo dentro
      de un radio de dos millas.
    C: Conducir un ciclomotor (moped) en una carretera pública.
    D: Conducir un vehículo personal a una escuela secundaria.
  answer: B
  explanation: Según el manual, no necesita una licencia de conducir si está conduciendo
    equipo agrícola entre la granja principal y cualquier tierra de cultivo o explotación
    agrícola cercana dentro de un radio de dos millas.
- id: 16
  category: driver_responsibility
  question: ¿Qué documentos deben llevar consigo los conductores de vehículos en Iowa
    mientras conducen?
  choices:
    A: Licencia, certificado de nacimiento y título del vehículo.
    B: Tarjeta de Seguro Social, licencia y comprobante de registro.
    C: Licencia o permiso, comprobante de registro vigente y una tarjeta de seguro.
    D: Tarjeta de seguro, título del vehículo y un pasaporte.
  answer: C
  explanation: Los conductores de vehículos en Iowa deben llevar su licencia o permiso,
    comprobante de registro vigente y una tarjeta de seguro (impresa o electrónica)
    para verificar el comprobante de seguro de responsabilidad civil.
- id: 17
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia de no llevar su licencia, comprobante
    de registro y tarjeta de seguro mientras conduce?
  choices:
    A: Revocación inmediata de la licencia por un año.
    B: Multas y posible incautación del vehículo.
    C: Un curso obligatorio de conducción defensiva.
    D: Servicio comunitario y una advertencia por escrito.
  answer: B
  explanation: No llevar su licencia, comprobante de registro vigente y una tarjeta
    de seguro podría resultar en multas y la posible incautación del vehículo.
- id: 18
  category: driver_testing
  question: ¿Cuál de los siguientes es un examen de salud obligatorio al solicitar
    una licencia de conducir de Iowa?
  choices:
    A: Una prueba de audición.
    B: Una prueba de resistencia física.
    C: Un examen de la vista.
    D: Un formulario de autorización médica de un doctor.
  answer: C
  explanation: Cuando solicite su licencia, se le requerirá completar un examen de
    la vista.
- id: 19
  category: signs_and_signals
  question: ¿Qué tipo de información proporciona una señal de tráfico azul?
  choices:
    A: Advertencias generales sobre peligros en la carretera.
    B: Dirección hacia sitios históricos y parques.
    C: Servicios para viajeros como áreas de descanso, hospitales y alojamiento.
    D: Información sobre leyes y ordenanzas aplicables.
  answer: C
  explanation: Las señales azules indican servicios para viajeros y lo dirigen a lugares
    como áreas de descanso, sitios turísticos, hospitales, alojamiento, gasolineras
    y restaurantes.
- id: 20
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico de color rosa fluorescente?
  choices:
    A: Advertencias de peatones y zonas escolares.
    B: Gestión de incidentes, como limpieza de choques o eliminación de escombros.
    C: Obras viales y control de tráfico temporal.
    D: Puntos de interés recreativo y cultural.
  answer: B
  explanation: Las señales de color rosa fluorescente son señales de advertencia y
    guía para la gestión de incidentes, como limpieza de choques, eliminación de escombros,
    tráfico, etc.
- id: 21
  category: signs_and_signals
  question: 'Una señal de tráfico en forma de banderín se encuentra en el lado izquierdo
    de la carretera y advierte a los conductores sobre:'
  choices:
    A: Un cruce de ferrocarril más adelante.
    B: Una zona escolar.
    C: Una zona de no rebasar.
    D: Un requisito de ceder el paso.
  answer: C
  explanation: Una señal en forma de banderín estará en el lado izquierdo de la carretera
    y le advierte sobre una zona de no rebasar.
- id: 22
  category: safe_driving_rules
  question: 'Los límites de velocidad máxima que se muestran en las señales de límite
    de velocidad están destinados a:'
  choices:
    A: Condiciones de conducción ideales.
    B: Condiciones de carretera mojada o resbaladiza.
    C: Condiciones de tráfico pesado.
    D: Conducción nocturna únicamente.
  answer: A
  explanation: Los límites de velocidad máxima son para condiciones de conducción
    ideales. Debe reducir su velocidad cuando las condiciones lo requieran, como cuando
    la calzada está resbaladiza o es difícil ver.
- id: 23
  category: signs_and_signals
  question: ¿Qué significa una señal reglamentaria con un círculo rojo y una franja
    roja diagonal sobre un símbolo?
  choices:
    A: Debe ceder el paso al vehículo que se muestra en el símbolo.
    B: No puede realizar la acción mostrada por el símbolo.
    C: Se está aproximando a un peligro relacionado con el símbolo.
    D: La carretera está cerrada más adelante.
  answer: B
  explanation: Algunas señales reglamentarias tienen un círculo rojo con una franja
    roja diagonal sobre un símbolo. Estas indican que no puede hacer algo; por ejemplo,
    no girar a la izquierda, no girar a la derecha o no dar vuelta en U.
- id: 24
  category: safe_driving_rules
  question: Al acercarse a una señal de alto (pare), ¿qué debe hacer si hay una línea
    de parada presente?
  choices:
    A: Reducir la velocidad y pasar la línea si la intersección está despejada.
    B: Detenerse por completo en la línea de parada antes de continuar.
    C: Detenerse solo si se aproxima tráfico transversal.
    D: Detenerse después de la línea de parada para tener una mejor vista del tráfico.
  answer: B
  explanation: Una señal de alto significa que debe detenerse por completo. Debe detenerse
    en la línea de parada si hay una presente, y luego avanzar si es necesario cuando
    sea seguro hacerlo.
- id: 25
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando vea una señal de advertencia en forma de diamante
    que indica una colina más adelante?
  choices:
    A: Acelerar para mantener su velocidad al bajar la colina.
    B: Poner su vehículo en punto muerto (neutral).
    C: Revisar sus frenos antes de bajar la colina.
    D: Detenerse a un lado y esperar a que pasen los vehículos más grandes.
  answer: C
  explanation: La señal de colina es una advertencia de que la carretera más adelante
    baja por una colina. El manual establece que debe revisar sus frenos antes de
    bajar la colina.
- id: 26
  category: sharing_the_road
  question: ¿Cómo debe reaccionar cuando vea una señal de advertencia de vehículos
    tirados por caballos o maquinaria agrícola?
  choices:
    A: Tocar la bocina para alertarlos de su presencia.
    B: Mantener su velocidad y rebasar rápidamente.
    C: Reducir su velocidad y rebasar lentamente.
    D: Detener su vehículo y esperar a que se orillen.
  answer: C
  explanation: Cuando vea señales de vehículos tirados por caballos o maquinaria agrícola,
    debe estar atento a los vehículos de movimiento lento en las carreteras, reducir
    su velocidad y rebasar lentamente.
- id: 27
  category: sharing_the_road
  question: Según la actualización del código de tráfico de Iowa de 2024, ¿cuál de
    los siguientes se considera un "medio de transporte peatonal"?
  choices:
    A: Un carruaje tirado por caballos.
    B: Un tractor agrícola.
    C: Una motocicleta de baja velocidad.
    D: Un dispositivo de propulsión humana como una silla de ruedas, un cochecito
      o una bicicleta.
  answer: D
  explanation: Los medios de transporte peatonales se definen como cualquier dispositivo
    de propulsión humana mediante el cual un peatón puede desplazarse, incluyendo
    sillas de ruedas, cochecitos, bicicletas, patinetas, monopatines y dispositivos
    eléctricos personales de asistencia a la movilidad.
- id: 28
  category: sharing_the_road
  question: ¿Cómo deben tratar los conductores a las personas que usan patinetas,
    monopatines o dispositivos eléctricos personales de asistencia a la movilidad
    en los cruces peatonales?
  choices:
    A: Los conductores tienen el derecho de paso sobre estos dispositivos.
    B: Los conductores deben cederles el derecho de paso, tal como lo harían con los
      peatones a pie.
    C: Los conductores solo necesitan ceder el paso si la persona es menor de 18 años.
    D: Los conductores deben tocar la bocina para advertirles que despejen el cruce
      peatonal.
  answer: B
  explanation: La ley de 2024 establece que los vehículos deben ceder el derecho de
    paso a los peatones a pie y a aquellos que utilicen cualquier dispositivo de propulsión
    humana, conocido como medio de transporte peatonal (que incluye patinetas, monopatines,
    etc.).
- id: 29
  category: signs_and_signals
  question: ¿Qué indica un triángulo naranja reflectante en la parte trasera de un
    vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo viaja a 35 mph o menos
    C: El vehículo es de respuesta a emergencias
    D: El vehículo está averiado y no puede moverse
  answer: B
  explanation: Un triángulo naranja reflectante en la parte trasera de un vehículo
    significa que es un vehículo de movimiento lento que viaja a 35 mph o menos, visto
    a menudo en equipos de mantenimiento de carreteras o vehículos agrícolas.
- id: 30
  category: signs_and_signals
  question: ¿Qué información específica proporcionan los marcadores de milla en una
    Interestatal?
  choices:
    A: El límite de velocidad para el tramo actual de la carretera
    B: El número de millas hasta la próxima área de descanso
    C: El número de millas desde donde la ruta Interestatal entró al estado
    D: La distancia al hospital más cercano
  answer: C
  explanation: Los marcadores de milla muestran el número de millas desde donde la
    ruta Interestatal entró al estado en el que está viajando, y pueden usarse para
    dar su ubicación exacta en una emergencia.
- id: 31
  category: signs_and_signals
  question: ¿Cómo debe reaccionar un conductor ante un semáforo en rojo intermitente?
  choices:
    A: Ceder el paso al tráfico que viene en sentido contrario y avanzar sin detenerse
    B: Tratarlo de la misma manera que una señal de alto (Pare)
    C: Detenerse y esperar a que la luz cambie a verde
    D: Avanzar con precaución sin detenerse
  answer: B
  explanation: El manual establece que al encontrarse con un semáforo en rojo intermitente,
    debe tratarlo de la misma manera que una señal de alto (Pare).
- id: 32
  category: signs_and_signals
  question: ¿Qué indica una flecha amarilla intermitente para un conductor que gira
    a la izquierda?
  choices:
    A: El tráfico en sentido contrario debe detenerse, por lo que usted tiene el derecho
      de paso
    B: Debe detenerse por completo y esperar a una flecha verde
    C: Ceder el paso al tráfico en sentido contrario y a los peatones, luego girar
      a la izquierda avanzando con precaución
    D: La señal está averiada y debe tratarla como una parada de cuatro vías
  answer: C
  explanation: Una flecha amarilla intermitente significa que debe ceder el paso al
    tráfico en sentido contrario y a los peatones, y luego girar a la izquierda avanzando
    con precaución, ya que el tráfico en sentido contrario tiene luz verde.
- id: 33
  category: signs_and_signals
  question: ¿Cuál es la acción correcta al acercarse a un semáforo con luz amarilla
    fija?
  choices:
    A: Acelerar para despejar la intersección antes de que cambie a rojo
    B: Detenerse inmediatamente, incluso si se encuentra en medio de la intersección
    C: No entrar en la intersección si puede detenerse de manera segura
    D: Tratarla como una señal de ceda el paso y avanzar
  answer: C
  explanation: 'Para una luz amarilla fija, la regla es: No entre en la intersección
    si puede detenerse de manera segura. Si no puede detenerse de forma segura, cruce
    la intersección con precaución.'
- id: 34
  category: safe_driving_rules
  question: ¿Cuál de los siguientes vehículos debe detenerse entre 15 y 50 pies de
    las vías del tren antes de cruzar?
  choices:
    A: Un vehículo de pasajeros que remolca un bote
    B: Un conductor que transporta pasajeros por contrato, como Uber o Lyft
    C: Una motocicleta
    D: Una furgoneta de reparto que transporta paquetes no peligrosos
  answer: B
  explanation: Todos los autobuses escolares, autobuses de alquiler, conductores que
    transportan pasajeros por contrato (como Uber o Lyft) y vehículos con carteles
    de materiales peligrosos deben detenerse entre 15 y 50 pies de las vías del tren
    antes de cruzar.
- id: 35
  category: safe_driving_rules
  question: ¿Qué es lo primero que debe hacer si su vehículo se apaga o se queda atascado
    en las vías del tren?
  choices:
    A: Permanecer en el vehículo e intentar arrancar el motor de nuevo
    B: Cambiar de marcha para intentar empujar el vehículo fuera de las vías
    C: Hacer que todos salgan y se alejen inmediatamente, incluso si no ve un tren
    D: Llamar a una empresa local de grúas
  answer: C
  explanation: Si su vehículo se queda atascado o se apaga en un cruce, debe hacer
    que todos salgan y se alejen inmediatamente, incluso si no ve un tren.
- id: 36
  category: signs_and_signals
  question: ¿Dónde puede encontrar el número de teléfono de emergencia para llamar
    si su vehículo está atascado en un cruce de ferrocarril?
  choices:
    A: En el triángulo naranja reflectante
    B: En la señal azul y blanca del Sistema de Notificación de Emergencias (ENS)
    C: En la parte posterior de la señal de cruce de ferrocarril (crossbuck)
    D: En el marcador de milla más cercano
  answer: B
  explanation: La señal azul y blanca del Sistema de Notificación de Emergencias (ENS)
    contiene el primer número de teléfono al que debe llamar si un vehículo se queda
    atascado o se apaga en las vías, junto con un número de identificación del cruce.
- id: 37
  category: signs_and_signals
  question: ¿Cómo están marcados los cruces de ferrocarril con protección pasiva?
  choices:
    A: Con luces rojas intermitentes y barreras que bajan
    B: Con una señal de cruce de ferrocarril (crossbuck) y una señal de alto o de
      ceda el paso
    C: Con un semáforo en rojo fijo
    D: Únicamente con una señal ENS azul y blanca
  answer: B
  explanation: Los cruces de ferrocarril con protección pasiva no tienen luces ni
    barreras. Solo estarán marcados con una señal de cruce de ferrocarril (crossbuck)
    y una señal de alto o de ceda el paso.
- id: 38
  category: safe_driving_rules
  question: Cuando se detiene en un cruce de ferrocarril, ¿cuál es la distancia mínima
    que debe dejar entre su vehículo y el riel más cercano?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 50 pies
  answer: C
  explanation: Cuando se detiene en un cruce de ferrocarril, debe dejar al menos 15
    pies entre la parte delantera o trasera de su vehículo y el riel más cercano.
- id: 39
  category: safe_driving_rules
  question: ¿De qué peligro específico debe ser consciente al cruzar múltiples vías
    de tren?
  choices:
    A: Múltiples vías significan que el límite de velocidad se reduce
    B: Múltiples vías pueden significar que podría haber varios trenes presentes
    C: Debe cambiar de marcha mientras cruza múltiples vías
    D: Se requiere que se detenga en cada vía individual
  answer: B
  explanation: Múltiples vías pueden significar múltiples trenes. Debe asegurarse
    de poder ver claramente a lo largo de las vías en ambas direcciones antes de avanzar.
- id: 40
  category: signs_and_signals
  question: ¿Cómo puede un conductor identificar el tipo de carretera por la que viaja,
    como una interestatal o una carretera del condado?
  choices:
    A: Por el color de los marcadores de milla
    B: Por la forma de la señal de la ruta
    C: Por la presencia de señales de servicio
    D: Por el límite de velocidad publicado
  answer: B
  explanation: 'La forma de una señal de ruta indica el tipo de carretera que es:
    interestatal, carretera de EE. UU., ruta de Iowa, carretera del condado, etc.'
- id: 41
  category: signs_and_signals
  question: ¿Qué indica una flecha verde fija?
  choices:
    A: Puede seguir recto a través de la intersección
    B: Debe ceder el paso al tráfico que viene en sentido contrario antes de girar
    C: Los conductores pueden proceder con el giro y el tráfico en sentido contrario
      debe detenerse
    D: La señal está a punto de cambiar a rojo
  answer: C
  explanation: Una flecha verde fija significa que los conductores pueden proceder
    con el giro a la izquierda o a la derecha, y el tráfico en sentido contrario debe
    detenerse. Debe conducir únicamente en la dirección de la flecha.
- id: 42
  category: safe_driving_rules
  question: ¿Cuándo se le permite avanzar sin detenerse a un vehículo que normalmente
    debe detenerse en los cruces de ferrocarril?
  choices:
    A: Cuando el cruce está marcado con una señal de "EXEMPT" (exento)
    B: Cuando el conductor tiene prisa
    C: Cuando el cruce está protegido pasivamente
    D: Cuando el tren es visible pero se mueve lentamente
  answer: A
  explanation: Los vehículos que normalmente deben detenerse no tienen que hacerlo
    si un oficial de policía o una señal de tráfico en la carretera dirige el tráfico
    para que avance, o si el cruce está marcado con una señal de "EXEMPT" (exento).
- id: 43
  category: signs_and_signals
  question: ¿Cuál es el color básico de las señales y dispositivos de advertencia
    utilizados en las zonas de obras?
  choices:
    A: Rojo
    B: Naranja
    C: Amarillo
    D: Verde fluorescente
  answer: B
  explanation: El naranja es el color básico de las señales y dispositivos de advertencia
    en las zonas de obras.
- id: 44
  category: penalties_and_points
  question: ¿Qué puede suceder con las multas de tráfico si comete una infracción
    en una zona de obras?
  choices:
    A: Se exoneran para quienes cometen la infracción por primera vez.
    B: Siguen siendo las mismas que en las zonas normales.
    C: Pueden duplicarse.
    D: Se reducen si no hay trabajadores presentes.
  answer: C
  explanation: El manual indica mantenerse alerta y conducir con precaución, ya que
    las multas pueden duplicarse en las zonas de obras.
- id: 45
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas pintadas en el pavimento?
  choices:
    A: Separan el tráfico que se mueve en direcciones opuestas.
    B: Separan el tráfico que se mueve en la misma dirección.
    C: Indican una zona de no rebasar.
    D: Marcan un carril compartido para girar a la izquierda.
  answer: B
  explanation: Las líneas blancas separan el tráfico que se mueve en la misma dirección.
    Las líneas amarillas separan el tráfico que se mueve en direcciones opuestas.
- id: 46
  category: signs_and_signals
  question: ¿Cómo se marcan las líneas de ceder el paso en el pavimento?
  choices:
    A: Una fila de triángulos blancos sólidos que apuntan hacia los vehículos que
      se aproximan.
    B: Líneas amarillas sólidas dobles a través del carril.
    C: Una sola línea blanca gruesa a través de la intersección.
    D: Una serie de cuadrados blancos discontinuos.
  answer: A
  explanation: Las líneas de ceder el paso consisten en una fila de triángulos blancos
    sólidos que apuntan hacia los vehículos que se aproximan para indicar dónde deben
    ceder el paso los vehículos.
- id: 47
  category: signs_and_signals
  question: Al conducir en un carril reversible, ¿qué significa una "X" amarilla intermitente?
  choices:
    A: No puede usar el carril.
    B: El uso del carril está cambiando y debe salir de él.
    C: El carril es solo para girar.
    D: Puede usar el carril solo para rebasar.
  answer: C
  explanation: En un carril reversible, una "X" amarilla intermitente significa que
    el carril es solo para girar.
- id: 48
  category: signs_and_signals
  question: ¿Qué indica una "X" amarilla fija sobre un carril reversible?
  choices:
    A: El carril está abierto para el tránsito normal.
    B: El carril está reservado para vehículos de alta ocupación.
    C: El carril es solo para girar.
    D: El uso del carril está cambiando y debe salir de él de manera segura.
  answer: D
  explanation: Una "X" amarilla fija significa que el uso del carril está cambiando
    y debe salir de él tan pronto como sea seguro hacerlo.
- id: 49
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los carriles
    compartidos para girar a la izquierda?
  choices:
    A: Pueden usarse para rebasar vehículos más lentos.
    B: Están reservados para giros a la izquierda desde cualquier dirección.
    C: Están marcados por líneas blancas sólidas dobles.
    D: Solo los vehículos de alta ocupación pueden usarlos.
  answer: B
  explanation: Los carriles compartidos para girar a la izquierda están reservados
    para vehículos que realizan giros a la izquierda desde cualquier dirección y no
    pueden usarse para rebasar.
- id: 50
  category: defensive_driving
  question: En una carretera con tres o más carriles que circulan en la misma dirección,
    ¿cuál es el mejor carril para usar si hay mucho tráfico entrando?
  choices:
    A: El carril del extremo izquierdo
    B: El carril central
    C: El carril del extremo derecho
    D: El arcén
  answer: B
  explanation: En una carretera con tres o más carriles, si hay mucho tráfico entrando,
    lo mejor es utilizar el carril central.
- id: 51
  category: safe_driving_rules
  question: ¿Cuándo es permisible rebasar a un vehículo por el acotamiento (shoulder)
    de la carretera?
  choices:
    A: Cuando el vehículo de adelante está girando a la izquierda.
    B: Cuando el acotamiento está pavimentado.
    C: Nunca, ya sea que el acotamiento esté pavimentado o no.
    D: Cuando el tráfico está congestionado por más de una milla.
  answer: C
  explanation: Nunca rebase por el acotamiento, ya sea que esté pavimentado o no.
    Otros conductores no esperarán que usted esté allí y podrían salirse de la carretera
    sin mirar.
- id: 52
  category: sharing_the_road
  question: ¿Cuándo puede un automovilista conducir en un carril para bicicletas designado?
  choices:
    A: Al rebasar a un vehículo que circula despacio.
    B: Al realizar movimientos de giro.
    C: Cuando el carril de tráfico adyacente está bloqueado.
    D: A los automovilistas nunca se les permite estar en un carril para bicicletas.
  answer: B
  explanation: Los automovilistas solo pueden conducir en carriles para bicicletas
    al realizar movimientos de giro y deben mirar cuidadosamente al lado y detrás
    de su vehículo para detectar ciclistas.
- id: 53
  category: sharing_the_road
  question: ¿Qué debe hacer un automovilista al encontrarse con un carril para bicicletas
    pintado de verde?
  choices:
    A: Detenerse sobre el pavimento verde para verificar si hay bicicletas.
    B: Usar el pavimento verde como un carril de giro compartido.
    C: Buscar ciclistas antes de cruzar y no detenerse sobre el pavimento verde.
    D: Ceder el paso solo si hay una bicicleta en la intersección en ese momento.
  answer: C
  explanation: Los carriles para bicicletas pueden estar pintados de verde y los automovilistas
    deben prestar mucha atención y buscar ciclistas antes de cruzar el pavimento verde.
    Los automovilistas no deben detenerse sobre el pavimento verde.
- id: 54
  category: sharing_the_road
  question: ¿Cuál es el propósito de las marcas de pavimento de carril compartido,
    también conocidas como "sharrows"?
  choices:
    A: Designar una parte de la calzada para el uso exclusivo de bicicletas.
    B: Alertar a los automovilistas sobre la presencia de ciclistas y fomentar el
      rebase seguro.
    C: Indicar dónde deben detenerse los ciclistas ante los peatones.
    D: Marcar un carril exclusivamente para vehículos de alta ocupación.
  answer: B
  explanation: Las marcas de pavimento de carril compartido (sharrows) alertan a los
    automovilistas sobre la presencia de ciclistas, fomentan el rebase seguro y reducen
    el ciclismo en sentido contrario. A diferencia de los carriles para bicicletas,
    no designan el uso exclusivo para bicicletas.
- id: 55
  category: signs_and_signals
  question: Al acercarse a una Baliza Híbrida para Peatones (Pedestrian Hybrid Beacon),
    ¿qué debe hacer un automovilista cuando las dos luces rojas superiores se vuelven
    fijas?
  choices:
    A: Proceder con precaución.
    B: Reducir la velocidad y prepararse para detenerse.
    C: Detenerse ante los peatones.
    D: Detenerse y luego proceder de inmediato incluso si hay peatones presentes.
  answer: C
  explanation: Cuando las dos luces rojas superiores se vuelven fijas en una Baliza
    Híbrida para Peatones, los automovilistas deben detenerse ante los peatones.
- id: 56
  category: sharing_the_road
  question: ¿Cómo puede un conductor identificar a un peatón con discapacidad visual?
  choices:
    A: Llevarán un chaleco amarillo fluorescente.
    B: Caminarán con un bastón que es blanco o blanco con la punta roja.
    C: Llevarán una bandera roja.
    D: Caminarán en una caja para bicicletas designada.
  answer: B
  explanation: Es probable que una persona tenga una discapacidad visual si es guiada
    por un animal de servicio con arnés o si camina con un bastón que es blanco o
    blanco con la punta roja.
- id: 57
  category: signs_and_signals
  question: ¿Cómo se marcan típicamente los carriles reservados para vehículos especiales,
    como los vehículos de alta ocupación (HOV)?
  choices:
    A: Con un diamante blanco colocado al lado de la carretera y/o pintado en la superficie
      de la carretera.
    B: Con una línea verde sólida pintada a lo largo del carril.
    C: Con una "X" amarilla intermitente sobre el carril.
    D: Con una fila de triángulos blancos sólidos que apuntan hacia los vehículos
      que se aproximan.
  answer: A
  explanation: Los carriles reservados están marcados con señales que indican que
    el carril está reservado para un uso especial, y a menudo tienen un diamante blanco
    colocado al lado de la carretera y/o pintado en la superficie de la carretera.
- id: 58
  category: safe_driving_rules
  question: Según el manual del conductor de Iowa, ¿cuál de las siguientes afirmaciones
    es verdadera con respecto al derecho de paso?
  choices:
    A: La ley otorga el derecho de paso al vehículo más grande.
    B: La ley establece quién debe ceder el derecho de paso, pero no otorga a nadie
      el derecho de paso.
    C: La ley otorga el derecho de paso al vehículo que viaja más rápido.
    D: La ley establece que los peatones siempre tienen el derecho de paso sobre los
      vehículos de emergencia.
  answer: B
  explanation: 'El manual establece: ''La ley dice quién debe ceder el derecho de
    paso; no le otorga a nadie el derecho de paso''.'
- id: 59
  category: safe_driving_rules
  question: ¿Cuál es la causa número uno de muertes relacionadas con el tráfico en
    Iowa?
  choices:
    A: Conducir bajo la influencia
    B: Exceso de velocidad
    C: No ceder el derecho de paso
    D: Conducción distraída
  answer: C
  explanation: Según el manual, no ceder el derecho de paso es la causa número 1 de
    muertes relacionadas con el tráfico en Iowa.
- id: 60
  category: safe_driving_rules
  question: Si dos vehículos llegan a una parada de todas las direcciones (all-way
    stop) exactamente al mismo tiempo, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo de la izquierda puede pasar primero.
    B: El vehículo de la derecha puede pasar primero.
    C: El vehículo que viaja recto puede pasar primero.
    D: El vehículo que gira a la derecha puede pasar primero.
  answer: B
  explanation: En una parada de todas las direcciones, para los vehículos que llegan
    al mismo tiempo, el vehículo a la derecha tiene el derecho de paso.
- id: 61
  category: safe_driving_rules
  question: ¿Qué debe hacer si se encuentra en una intersección cuando ve o escucha
    que se aproxima un vehículo de emergencia?
  choices:
    A: Detenerse inmediatamente en medio de la intersección.
    B: Orillarse al borde derecho de la intersección y detenerse.
    C: Cruzar la intersección antes de orillarse a la derecha.
    D: Acelerar para despejar la intersección y continuar conduciendo normalmente.
  answer: C
  explanation: Si se encuentra en una intersección (incluyendo glorietas), debe cruzar
    la intersección antes de orillarse para dejar pasar a un vehículo de emergencia.
- id: 62
  category: safe_driving_rules
  question: ¿A qué distancia debe mantenerse detrás de un vehículo de emergencia que
    utiliza luces y sirenas?
  choices:
    A: Al menos 100 pies
    B: Al menos 250 pies
    C: Al menos 300 pies
    D: Al menos 500 pies
  answer: D
  explanation: El manual exige que los conductores se mantengan al menos a 500 pies
    de distancia de cualquier vehículo de emergencia que utilice luces y sirenas.
- id: 63
  category: safe_driving_rules
  question: Al encontrarse con un autobús escolar de frente en una carretera de dos
    carriles y ver que sus luces amarillas de advertencia parpadean, ¿qué debe hacer?
  choices:
    A: Mantener su velocidad y pasar con precaución.
    B: Reducir la velocidad de su vehículo a no más de 20 mph y estar preparado para
      detenerse.
    C: Detenerse inmediatamente, independientemente del brazo de parada.
    D: Orillarse al acotamiento y apagar el motor.
  answer: B
  explanation: Al encontrarse con un autobús de frente en una carretera de dos o tres
    carriles y ver las luces amarillas de advertencia parpadeando, debe reducir la
    velocidad de su vehículo a no más de 20 mph y estar preparado para detenerse.
- id: 64
  category: safe_driving_rules
  question: Al conducir en una carretera de cuatro o más carriles, ¿qué debe hacer
    si se encuentra con un autobús escolar detenido que viene en dirección opuesta
    con las luces parpadeando y el brazo de parada extendido?
  choices:
    A: Debe detenerse y esperar a que el brazo de parada se retraiga.
    B: Debe reducir la velocidad a 15 mph.
    C: No es necesario detenerse.
    D: Debe detenerse y luego proceder con precaución.
  answer: C
  explanation: Al encontrarse con el autobús en uno de los carriles opuestos (dos
    o más) en una carretera de cuatro o más carriles, no es necesario detenerse, incluso
    si el autobús se ha detenido con las luces parpadeando y el brazo de parada extendido.
- id: 65
  category: penalties_and_points
  question: ¿Cuál es la posible sanción por violar la ley de detención ante un autobús
    escolar en Iowa?
  choices:
    A: Una advertencia por la primera infracción.
    B: Su licencia puede ser suspendida por hasta 180 días.
    C: Su licencia será revocada permanentemente.
    D: Una sentencia de cárcel obligatoria de 30 días.
  answer: B
  explanation: Violar la ley de detención ante un autobús escolar puede resultar en
    la suspensión de su licencia por hasta 180 días.
- id: 66
  category: safe_driving_rules
  question: Al estacionarse en una calzada con bordillo (curb), ¿a qué distancia del
    bordillo debe estacionarse?
  choices:
    A: A menos de 6 pulgadas
    B: A menos de 12 pulgadas
    C: A menos de 18 pulgadas
    D: A menos de 24 pulgadas
  answer: C
  explanation: Si hay un bordillo, debe estacionar su vehículo a una distancia de
    18 pulgadas o menos del mismo.
- id: 67
  category: safe_driving_rules
  question: ¿A qué distancia de un hidrante de incendios se le permite estacionar
    legalmente?
  choices:
    A: No puede estacionarse a menos de 5 pies.
    B: No puede estacionarse a menos de 10 pies.
    C: No puede estacionarse a menos de 15 pies.
    D: No puede estacionarse a menos de 20 pies.
  answer: A
  explanation: No puede estacionarse a menos de cinco pies de un hidrante de incendios
    o en una zona roja designada para hidrantes.
- id: 68
  category: safe_driving_rules
  question: Según la Ley de Hacerse a un Lado o Reducir la Velocidad (Move Over or
    Slow Down Law) de Iowa, ¿qué debe hacer si se aproxima a un vehículo de pasajeros
    detenido que muestra luces de emergencia y no puede cambiar de carril de manera
    segura?
  choices:
    A: Detenerse inmediatamente en su carril.
    B: Mantener su velocidad pero tocar la bocina.
    C: Reducir la velocidad y estar preparado para detenerse.
    D: Acelerar para rebasar el vehículo rápidamente.
  answer: C
  explanation: Si no es posible cambiar de carril, si la ley lo prohíbe o si no es
    seguro al aproximarse a un vehículo detenido con luces intermitentes, debe reducir
    la velocidad y estar preparado para detenerse.
- id: 69
  category: penalties_and_points
  question: ¿Cuál es el período máximo de suspensión de la licencia por violar la
    Ley de Hacerse a un Lado o Reducir la Velocidad de Iowa?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: Un año
  answer: D
  explanation: Violar la Ley de Hacerse a un Lado o Reducir la Velocidad de Iowa puede
    resultar en la suspensión de su licencia por hasta un año.
- id: 70
  category: safe_driving_rules
  question: De acuerdo con la ley 'Steer It-Clear It' (Muévalo y Despeje), ¿qué se
    le requiere hacer si está involucrado en un choque sin heridos y su vehículo puede
    funcionar?
  choices:
    A: Dejar el vehículo exactamente donde está hasta que llegue la policía.
    B: Mover su vehículo fuera de los carriles de circulación del tráfico.
    C: Esperar a que una grúa mueva el vehículo.
    D: Intercambiar información del seguro antes de mover el vehículo.
  answer: B
  explanation: Si está involucrado en un choque sin heridos, la ley de Iowa exige
    que mueva su vehículo fuera de los carriles de circulación si el vehículo funciona
    y puede moverse de manera segura.
- id: 71
  category: vehicle_information
  question: ¿Cuántos sistemas de frenado independientes se requieren para automóviles
    y camiones?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: 'Los automóviles, camiones y vehículos todoterreno (ATV/UTV) necesitan
    dos sistemas de frenado independientes: un freno de pie y un freno de estacionamiento.'
- id: 72
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a compartir
    la carretera con ciclistas?
  choices:
    A: Los ciclistas siempre deben ceder el paso a los vehículos motorizados.
    B: Los automovilistas deben estar preparados para ceder el paso, incluso en momentos
      en que el ciclista debería cederlo.
    C: Las bicicletas no se consideran vulnerables en los choques.
    D: Los ciclistas no comparten los mismos derechos y responsabilidades que los
      automovilistas.
  answer: B
  explanation: 'El manual aconseja a los conductores: "Esté preparado para ceder el
    paso, incluso en momentos en que los ciclistas deberían cederle el paso a usted",
    porque no tienen defensa contra un vehículo.'
- id: 73
  category: vehicle_information
  question: ¿A qué distancia debe ser visible la luz roja en la parte trasera de su
    vehículo?
  choices:
    A: Al menos 100 pies
    B: Al menos 200 pies
    C: Al menos 300 pies
    D: Al menos 500 pies
  answer: D
  explanation: Se necesita al menos una luz roja en la parte trasera del vehículo,
    y debe ser visible desde al menos 500 pies.
- id: 74
  category: vehicle_information
  question: ¿Hasta qué porcentaje puede reducir la efectividad de las luces la suciedad
    en los lentes de los faros de su vehículo?
  choices:
    A: 10 por ciento
    B: 25 por ciento
    C: 50 por ciento
    D: 75 por ciento
  answer: C
  explanation: El manual establece que la suciedad en los lentes puede reducir la
    efectividad de la luz en un 50 por ciento.
- id: 75
  category: vehicle_information
  question: ¿Cuál es el porcentaje mínimo de luz que deben permitir pasar los parabrisas
    polarizados y las ventanas laterales delanteras según la ley de Iowa?
  choices:
    A: 30 por ciento
    B: 50 por ciento
    C: 70 por ciento
    D: 90 por ciento
  answer: C
  explanation: La ley de Iowa exige que los parabrisas polarizados y las ventanas
    situadas a la derecha o izquierda inmediata del conductor permitan el paso de
    al menos el 70 por ciento de la luz.
- id: 76
  category: vehicle_information
  question: ¿Cuál es el mejor momento para revisar la presión de aire de sus neumáticos?
  choices:
    A: Inmediatamente después de un viaje largo
    B: Cuando los neumáticos están fríos
    C: Cuando los neumáticos están calientes
    D: Mientras el motor está en marcha
  answer: B
  explanation: El manual aconseja revisar la presión de aire de los neumáticos con
    un manómetro cuando los neumáticos están fríos.
- id: 77
  category: safe_driving_rules
  question: ¿Por qué es peligroso dejar el motor en marcha en un garaje cerrado?
  choices:
    A: Agotará la batería del vehículo
    B: Puede hacer que el motor se sobrecaliente rápidamente
    C: Los gases de un escape con fugas pueden causar la muerte en muy poco tiempo
    D: Hará que el sistema de suspensión falle
  answer: C
  explanation: El manual advierte que los gases de un escape con fugas pueden causar
    la muerte en muy poco tiempo, y nunca debe dejar el motor en marcha en el garaje.
- id: 78
  category: vehicle_information
  question: ¿A qué distancia detrás de su vehículo debe poder ver usando su espejo
    retrovisor?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: C
  explanation: Debe poder ver al menos 200 pies detrás de usted en su espejo retrovisor.
- id: 79
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima recomendada entre su pecho y el volante?
  choices:
    A: 5 pulgadas
    B: 10 pulgadas
    C: 15 pulgadas
    D: 20 pulgadas
  answer: B
  explanation: Al ajustar su asiento, debe haber al menos 10 pulgadas entre el volante
    y su pecho, con la bolsa de aire (airbag) apuntando hacia su pecho.
- id: 80
  category: safe_driving_rules
  question: ¿Dónde debe colocarse el reposacabezas en relación con el conductor?
  choices:
    A: En la base del cuello
    B: En el centro de la cabeza del conductor
    C: Por encima de la parte superior de la cabeza del conductor
    D: Tocando los hombros del conductor
  answer: B
  explanation: El manual establece que el reposacabezas debe estar en el centro de
    la cabeza del conductor.
- id: 81
  category: defensive_driving
  question: ¿Cómo debe posicionarse para ajustar correctamente el espejo lateral izquierdo?
  choices:
    A: Sentarse perfectamente derecho en el asiento del conductor
    B: Inclinarse hacia la derecha sobre la consola central del auto
    C: Inclinar la cabeza hacia la ventana del lado izquierdo
    D: Girar la cabeza para mirar por la ventana trasera
  answer: C
  explanation: Para ajustar el espejo lateral izquierdo, incline la cabeza hacia la
    ventana del lado izquierdo y ajuste el espejo de modo que apenas pueda ver el
    costado del vehículo.
- id: 82
  category: driver_testing
  question: ¿Cuál de los siguientes sistemas avanzados de asistencia al conductor
    (ADAS) NO está permitido utilizar durante un examen de conducir?
  choices:
    A: Alerta de marcha atrás
    B: Monitor de punto ciego
    C: Asistente de mantenimiento de carril
    D: Control de crucero adaptativo
  answer: D
  explanation: Durante un examen de conducir, no debe recibir ayuda de tecnologías
    de conveniencia del vehículo como el control de crucero adaptativo. Aparece como
    "No" en la lista de sistemas de asistencia permitidos.
- id: 83
  category: driver_testing
  question: Durante un examen de conducir, ¿cuál de las siguientes tecnologías de
    conveniencia del vehículo está prohibida?
  choices:
    A: Estacionamiento en paralelo automático
    B: Frenado de emergencia automático
    C: Alerta de colisión frontal
    D: Alerta de tráfico cruzado trasero
  answer: A
  explanation: El estacionamiento en paralelo automático aparece como "No" en la lista
    de sistemas de asistencia permitidos para el examen.
- id: 84
  category: safe_driving_rules
  question: Según el manual, ¿cuál es el uso adecuado de la bocina de un vehículo?
  choices:
    A: Para saludar a otros conductores
    B: Para expresar frustración en el tráfico
    C: Solo debe usarse como advertencia para los demás
    D: Para indicar a los peatones que crucen la calle
  answer: C
  explanation: Puede que la bocina no parezca un dispositivo de seguridad importante,
    pero como advertencia, podría salvarle la vida. Solo debe usarse como advertencia
    para los demás.
- id: 85
  category: vehicle_information
  question: ¿Qué moneda recomienda el manual para comprobar la profundidad de la banda
    de rodadura de los neumáticos?
  choices:
    A: Una moneda de 25 centavos (quarter)
    B: Una moneda de 10 centavos (dime)
    C: Una moneda de 5 centavos (nickel)
    D: Una moneda de un centavo (penny)
  answer: D
  explanation: El manual recomienda comprobar la banda de rodadura de los neumáticos
    con una moneda de un centavo (penny). Si la banda de rodadura no llega al menos
    a la parte superior de la cabeza de Lincoln, el neumático no es seguro.
- id: 86
  category: defensive_driving
  question: Incluso si su vehículo está equipado con un sistema de alerta de marcha
    atrás, ¿qué debe seguir haciendo al retroceder?
  choices:
    A: Confiar totalmente en el sonido de advertencia
    B: Revisar los espejos y por encima de sus hombros
    C: Apagar el sistema de advertencia
    D: Tocar la bocina continuamente
  answer: B
  explanation: Al utilizar un sistema de alerta de marcha atrás, aún debe demostrar
    todos los comportamientos necesarios para supervisar y maniobrar con seguridad,
    lo que incluye revisar los espejos laterales, el espejo retrovisor y por encima
    de los hombros (giros de cabeza).
- id: 87
  category: vehicle_information
  question: ¿Cuándo se activa normalmente la cámara trasera de un vehículo?
  choices:
    A: Cuando el vehículo alcanza una velocidad de 10 mph
    B: Cuando el conductor pone la marcha atrás (reversa)
    C: Cuando se activa la luz de giro
    D: Cuando el vehículo está estacionado y apagado
  answer: B
  explanation: Según el manual, cuando el conductor pone la marcha atrás, la cámara
    trasera se activa para mostrar el área detrás del vehículo.
- id: 88
  category: vehicle_information
  question: ¿Cómo se activa habitualmente una cámara de visión lateral?
  choices:
    A: Poniendo el vehículo en marcha atrás
    B: Presionando firmemente el pedal del freno
    C: Usando la luz de giro o un botón manual
    D: Superando el límite de velocidad indicado
  answer: C
  explanation: El manual establece que puede usar la luz de giro o activar la función
    de cámara de visión lateral a través de un botón que suele estar situado en la
    palanca de las luces de giro.
- id: 89
  category: vehicle_information
  question: ¿Cómo crea un sistema de monitor de visión periférica o de visión 360°
    una vista aérea virtual del vehículo?
  choices:
    A: Mediante el uso de una señal de satélite en vivo
    B: Procesando el video de cuatro cámaras de ángulo ancho
    C: Mediante el uso de sensores de radar montados en el techo
    D: Desplegando un pequeño dron sobre el vehículo
  answer: B
  explanation: El monitor de visión periférica procesa el video de cuatro cámaras
    de ángulo ancho situadas en la parte delantera, trasera, izquierda y derecha para
    mostrar las imágenes compuestas como una única vista aérea.
- id: 90
  category: vehicle_information
  question: ¿A qué velocidades funcionan generalmente los sistemas de detección de
    bicicletas, peatones y obstáculos?
  choices:
    A: Velocidades de autopista superiores a 55 mph
    B: Velocidades bajas, generalmente alrededor de 25 mph
    C: Solo cuando el vehículo está completamente detenido
    D: Velocidades entre 40 y 60 mph
  answer: B
  explanation: Estos sistemas de detección le alertan cuando se ha detectado un obstáculo
    al conducir a bajas velocidades, generalmente alrededor de 25 mph.
- id: 91
  category: defensive_driving
  question: ¿Qué significa que los pitidos de advertencia se vuelvan continuos al
    utilizar un sistema de detección de obstáculos?
  choices:
    A: El sistema está encendido y funciona correctamente
    B: Los sensores necesitan limpieza
    C: Un choque es inminente
    D: El obstáculo se ha movido de forma segura fuera del camino
  answer: C
  explanation: El manual señala que los pitidos se vuelven más rápidos a medida que
    el vehículo se acerca al obstáculo, y un choque es inminente cuando los pitidos
    se vuelven continuos.
- id: 92
  category: vehicle_information
  question: ¿Qué tecnología utiliza el sistema de advertencia de velocidad en curvas
    para rastrear la velocidad y ubicación del vehículo?
  choices:
    A: Marcas viales
    B: GPS
    C: Cuatro cámaras de ángulo ancho
    D: Sensores de radar traseros
  answer: B
  explanation: El sistema de advertencia de velocidad en curvas rastrea la velocidad
    y ubicación del vehículo a través de GPS y le advierte que reduzca la velocidad
    al acercarse a curvas y salidas.
- id: 93
  category: vehicle_information
  question: ¿Frena automáticamente un sistema de advertencia de colisión frontal por
    el conductor?
  choices:
    A: Sí, siempre aplica los frenos automáticamente para evitar un choque
    B: Sí, pero solo a velocidades superiores a 50 mph
    C: No, la advertencia por sí sola no frenará automáticamente por el conductor
    D: No, solo aleja el vehículo del objeto mediante la dirección
  answer: C
  explanation: El manual establece explícitamente que la advertencia de colisión frontal
    por sí sola no frenará automáticamente por el conductor; solo le alerta de una
    colisión inminente.
- id: 94
  category: vehicle_information
  question: ¿A qué distancia hacia adelante escanea el tráfico el sistema de advertencia
    de colisión frontal?
  choices:
    A: Hasta 100 pies
    B: Hasta 250 pies
    C: Hasta 500 pies
    D: Hasta 1,000 pies
  answer: C
  explanation: El sistema de advertencia de colisión frontal escanea el tráfico de
    adelante 20 veces por segundo hasta 500 pies frente a su vehículo.
- id: 95
  category: safe_driving_rules
  question: ¿Cuál es la acción recomendada si suena la alerta de alta velocidad de
    su vehículo?
  choices:
    A: Pisar los frenos a fondo inmediatamente para reducir la velocidad
    B: Reducir la velocidad del auto con cuidado soltando el acelerador o frenando
      ligeramente
    C: Apagar el centro de infoentretenimiento para silenciar la alarma
    D: Dirigirse al acotamiento de la carretera y detenerse
  answer: B
  explanation: Si suena una advertencia, debe reducir la velocidad del auto con cuidado
    hasta el límite de velocidad indicado soltando el acelerador o frenando ligeramente.
    No debe frenar bruscamente.
- id: 96
  category: vehicle_information
  question: ¿En qué se basa un dispositivo de advertencia de salida de carril para
    funcionar correctamente?
  choices:
    A: Rastreo por GPS
    B: Marcas viales
    C: Las luces direccionales del vehículo
    D: Sensores de radar en el parachoques trasero
  answer: B
  explanation: El manual establece que la función de advertencia de salida de carril
    se basa en las marcas viales para operar y alertarle si el auto comienza a salirse
    de un carril.
- id: 97
  category: defensive_driving
  question: ¿Cuál de los siguientes elementos podrían no detectar los sensores de
    estacionamiento?
  choices:
    A: Vehículos grandes estacionados cerca
    B: Objetos que están planos en el suelo o debajo del parachoques
    C: Paredes directamente frente al vehículo
    D: Vehículos en movimiento en el carril adyacente
  answer: B
  explanation: Los conductores no deben confiar únicamente en los sensores de estacionamiento
    porque podrían no detectar objetos que están planos en el suelo, debajo del parachoques,
    demasiado cerca del vehículo o demasiado lejos de él.
- id: 98
  category: vehicle_information
  question: ¿Cuál es la función principal de un sistema de alerta de tráfico cruzado
    trasero?
  choices:
    A: Advertir si hay vehículos a punto de entrar en la trayectoria de retroceso
      desde la izquierda o la derecha
    B: Estacionar el vehículo en paralelo automáticamente
    C: Alertar al conductor sobre peatones que cruzan frente al vehículo
    D: Monitorear los puntos ciegos mientras se conduce a velocidades de autopista
  answer: A
  explanation: La alerta de tráfico cruzado trasero le advierte si uno o más vehículos
    están a punto de entrar en la trayectoria de retroceso. Los sensores en la parte
    trasera detectan vehículos que se aproximan por la izquierda y la derecha.
- id: 99
  category: vehicle_information
  question: ¿Cómo responde un sistema de frenado de emergencia automático si usted
    no frena ante un peligro adelante?
  choices:
    A: Hace sonar la bocina de forma continua hasta que usted aplique los frenos
    B: Reduce la velocidad rápidamente o detiene el vehículo por sí solo
    C: Dirige automáticamente el vehículo hacia el carril de al lado
    D: Aumenta la velocidad del vehículo para pasar el peligro rápidamente
  answer: B
  explanation: Si usted no frena o no maniobra para evitar un peligro adelante, el
    sistema de frenado de emergencia automático reducirá la velocidad rápidamente
    o detendrá el vehículo por sí solo para evitar un choque.
- id: 100
  category: defensive_driving
  question: Incluso cuando un vehículo está equipado con cámaras avanzadas y monitores
    de punto ciego, ¿qué debe seguir haciendo el conductor?
  choices:
    A: Confiar totalmente en la pantalla del tablero para los cambios de carril
    B: Quitar las manos del volante mientras retrocede
    C: Revisar frecuentemente los espejos y realizar comprobaciones visuales sobre
      los hombros
    D: Desactivar los sistemas cuando se conduce en tráfico pesado
  answer: C
  explanation: El manual enfatiza repetidamente que los conductores no deben volverse
    dependientes de estas tecnologías y deben continuar revisando los espejos laterales,
    el espejo retrovisor y por encima de los hombros (comprobaciones visuales).
- id: 101
  category: vehicle_information
  question: ¿Qué mantenimiento se requiere para que los sensores de detección del
    vehículo funcionen correctamente?
  choices:
    A: Deben mantenerse limpios
    B: Deben reemplazarse cada año
    C: Deben pintarse para que coincidan con el vehículo
    D: Deben activarse manualmente antes de cada viaje
  answer: A
  explanation: 'Una nota específica en el manual establece: ''Los sensores deben mantenerse
    limpios para que funcionen correctamente''.'
- id: 102
  category: vehicle_information
  question: ¿Qué debe hacer incluso si su vehículo está equipado con frenado automático
    de reversa?
  choices:
    A: Confiar totalmente en el sistema para detener el vehículo.
    B: Continuar revisando los espejos, mirar por encima del hombro y usar las cámaras
      traseras.
    C: Desactivar el sistema antes de retroceder para mantener el control manual.
    D: Acelerar rápidamente para anular los sensores del sistema.
  answer: B
  explanation: 'El manual establece: "No dependa de la tecnología de frenado automático
    de reversa. Continúe revisando los espejos, mire por encima del hombro (controles
    visuales de cabeza) y use las cámaras traseras si están equipadas".'
- id: 103
  category: vehicle_information
  question: ¿Bajo qué condición es probable que la función de asistencia para mantenerse
    en el carril NO funcione correctamente?
  choices:
    A: Al conducir de noche.
    B: Cuando las líneas del carril son tenues o están cubiertas de nieve o suciedad.
    C: Al conducir en una autopista de varios carriles.
    D: Cuando el vehículo viaja a menos de 30 mph.
  answer: B
  explanation: Según el manual, la función de asistencia para mantenerse en el carril
    "no funcionará cuando las líneas del carril sean tenues o estén cubiertas de nieve
    o suciedad".
- id: 104
  category: driver_testing
  question: ¿Se permite el uso de tecnologías de conveniencia como el control de crucero
    adaptativo (ACC) durante el examen de conducción?
  choices:
    A: Sí, si el vehículo está equipado con ellas.
    B: Sí, pero solo para el estacionamiento en paralelo.
    C: No, no están permitidas durante el proceso del examen de conducción.
    D: No, a menos que el examinador solicite específicamente su uso.
  answer: C
  explanation: 'El manual establece explícitamente: "No se permite el uso de tecnologías
    de conveniencia durante el proceso del examen de conducción".'
- id: 105
  category: safe_driving_rules
  question: ¿Cuándo se aconseja NO utilizar ningún control de crucero, incluido el
    control de crucero adaptativo (ACC)?
  choices:
    A: En autopistas interestatales.
    B: En condiciones climáticas adversas y otras condiciones de conducción inseguras.
    C: Al conducir largas distancias.
    D: Al seguir a camiones grandes.
  answer: B
  explanation: El manual aconseja que "en condiciones climáticas adversas y otras
    condiciones de conducción inseguras, se recomienda no utilizar ningún control
    de crucero, incluido el ACC".
- id: 106
  category: vehicle_information
  question: Al utilizar un sistema de estacionamiento automático en paralelo, ¿de
    qué sigue siendo responsable el conductor?
  choices:
    A: Girar el volante hacia el espacio.
    B: Frenar y monitorear el entorno.
    C: Activar la señal de giro después de estacionar.
    D: Medir el espacio de estacionamiento manualmente.
  answer: B
  explanation: El manual señala que con el estacionamiento automático en paralelo,
    "usted sigue siendo responsable de frenar y monitorear el entorno".
- id: 107
  category: sharing_the_road
  question: ¿Por qué nunca debe permanecer al lado de un vehículo grande, como un
    camión o un autobús?
  choices:
    A: Viajan a velocidades mucho más altas que los automóviles de pasajeros.
    B: Tienen puntos ciegos grandes y es difícil para ellos verlo.
    C: Tienen más probabilidades de sufrir reventones de neumáticos.
    D: Con frecuencia realizan cambios repentinos de carril sin señalizar.
  answer: B
  explanation: 'El manual advierte: "Nunca permanezca al lado de un vehículo grande,
    como un camión o un autobús. Estos vehículos tienen puntos ciegos grandes y es
    difícil para ellos verlo".'
- id: 108
  category: defensive_driving
  question: ¿Cuál de los siguientes puede aumentar los puntos ciegos de su vehículo
    al crear reflejos deslumbrantes?
  choices:
    A: Conducir con las ventanillas bajadas.
    B: El sol reflejándose en las superficies de las ventanas, especialmente en el
      parabrisas delantero.
    C: Usar los parasoles del vehículo.
    D: Usar gafas de sol polarizadas.
  answer: B
  explanation: El manual establece que "el sol puede crear puntos ciegos con reflejos
    en cualquiera de las superficies de sus ventanas. El parabrisas delantero es el
    lugar más común para los reflejos deslumbrantes y los puntos ciegos".
- id: 109
  category: safe_driving_rules
  question: ¿Cómo debe usar el cinturón de seguridad una mujer embarazada?
  choices:
    A: A través del abdomen lo más alto posible.
    B: Usando solo la correa del hombro y no el cinturón de regazo.
    C: A través de la pelvis, lo más bajo posible debajo del abdomen.
    D: Las mujeres embarazadas están exentas de usar cinturones de seguridad.
  answer: C
  explanation: 'El manual instruye: "Si está embarazada, puede usar el cinturón de
    manera segura a través de la pelvis, lo más bajo posible debajo de su abdomen".'
- id: 110
  category: penalties_and_points
  question: En Iowa, ¿cuál es la multa máxima por una infracción del cinturón de seguridad
    para un pasajero menor de 18 años?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: D
  explanation: La violación de la ley del cinturón de seguridad se castiga con una
    multa de hasta $50 por pasajero y "$100 por pasajero menor de 18 años".
- id: 111
  category: safe_driving_rules
  question: ¿Cuál es el requisito para asegurar a un niño menor de un año que pesa
    menos de 20 libras?
  choices:
    A: Deben estar asegurados en un asiento elevador (booster seat) orientado hacia
      adelante.
    B: Deben estar asegurados en un sistema de sujeción infantil orientado hacia atrás.
    C: Pueden estar asegurados con un cinturón de seguridad estándar en el asiento
      trasero.
    D: Pueden viajar en el asiento delantero si un adulto los sostiene.
  answer: B
  explanation: Según la ley de Iowa, "un niño menor de un año y que pese menos de
    20 libras debe estar asegurado en un sistema de sujeción infantil orientado hacia
    atrás".
- id: 112
  category: safe_driving_rules
  question: Según la ley de Iowa, ¿cómo debe estar asegurado en un vehículo un niño
    menor de seis años?
  choices:
    A: En un sistema de sujeción infantil, como un asiento de seguridad o un asiento
      elevador (booster seat).
    B: Con un cinturón de seguridad estándar para adultos en el asiento delantero.
    C: Con un cinturón de seguridad estándar para adultos en el asiento trasero.
    D: En un asiento de automóvil orientado hacia atrás, independientemente del peso.
  answer: A
  explanation: 'El manual establece: "Un niño menor de seis años debe estar asegurado
    en un sistema de sujeción infantil (un asiento de seguridad o un asiento elevador,
    no un cinturón de seguridad)".'
- id: 113
  category: safe_driving_rules
  question: Según la ley de Iowa, ¿quién tiene prohibido viajar en la parte trasera
    de una camioneta (pickup) en movimiento?
  choices:
    A: Cualquier persona menor de 21 años.
    B: Cualquier persona menor de 18 años.
    C: Solo los niños menores de 6 años.
    D: Pasajeros de cualquier edad.
  answer: B
  explanation: 'El manual establece explícitamente: "Un niño menor de 18 años no puede
    viajar en la parte trasera de una camioneta (pickup) en movimiento".'
- id: 114
  category: defensive_driving
  question: ¿Por qué es un mito que los cinturones de seguridad solo son necesarios
    en viajes largos?
  choices:
    A: Porque los cinturones de seguridad solo son efectivos a velocidades superiores
      a 60 mph.
    B: Porque más de la mitad de todas las muertes por accidentes de tráfico ocurren
      a menos de 25 millas de casa.
    C: Porque los viajes cortos suelen implicar la conducción por autopista.
    D: Porque las bolsas de aire no se despliegan en viajes cortos.
  answer: B
  explanation: 'Al abordar el mito de que los cinturones de seguridad son solo para
    viajes largos, el manual explica: "Más de la mitad de todas las muertes por accidentes
    de tráfico ocurren a menos de 25 millas de casa. Muchas ocurren en carreteras
    con límites de velocidad de menos de 45 mph".'
- id: 115
  category: driver_responsibility
  question: ¿Por qué es importante asegurar los objetos sueltos en su vehículo?
  choices:
    A: Pueden rodar debajo del pedal del freno o herir a alguien en una parada repentina.
    B: Pueden hacer que el vehículo exceda su límite de peso máximo.
    C: Interfieren con los sensores de frenado automático de emergencia del vehículo.
    D: Aumentan el consumo de combustible del vehículo.
  answer: A
  explanation: El manual establece que debe asegurarse de que no haya objetos sueltos
    "que puedan herir a alguien en caso de una parada repentina o choque" ni objetos
    en el suelo "que puedan rodar debajo del pedal del freno, dificultando o imposibilitando
    la aplicación de los frenos".
- id: 116
  category: sharing_the_road
  question: ¿Qué debe hacer si se encuentra conduciendo en el punto ciego de otro
    conductor?
  choices:
    A: Toque la bocina continuamente hasta que se muevan.
    B: Haga destellos con las luces altas para alertarlos.
    C: Aumente o disminuya la velocidad para que el otro conductor pueda ver su vehículo.
    D: Mantenga su velocidad y posición para establecer el derecho de paso.
  answer: C
  explanation: 'El manual aconseja con respecto a los puntos ciegos de otros conductores:
    "No conduzca en el punto ciego de otro conductor. Aumente o disminuya la velocidad
    para que el otro conductor pueda ver su vehículo".'
- id: 117
  category: safe_driving_rules
  question: A 55 millas por hora, ¿con cuánta fuerza golpea un objeto suelto de 20
    libras en su vehículo en caso de una parada repentina o un choque?
  choices:
    A: 100 libras
    B: 500 libras
    C: 1,000 libras
    D: 2,000 libras
  answer: C
  explanation: Según el manual, a 55 millas por hora, un objeto de 20 libras golpea
    con 1,000 libras de fuerza.
- id: 118
  category: defensive_driving
  question: ¿Qué tipo de distracción implica hacer algo que hace que la mente del
    conductor divague o se concentre en otra parte, como tener una conversación?
  choices:
    A: Distracción visual
    B: Distracción manual
    C: Distracción cognitiva
    D: Distracción auditiva
  answer: C
  explanation: El manual define una distracción cognitiva como hacer algo que hace
    que la mente del conductor divague o se concentre en otra parte, como escuchar
    música o tener una conversación.
- id: 119
  category: safe_driving_rules
  question: Según la ley de Iowa, ¿cuándo se les permite hacer o recibir llamadas
    telefónicas a los conductores menores de 18 años con un permiso de instrucción
    o una licencia intermedia?
  choices:
    A: Solo cuando usan un dispositivo de manos libres
    B: Solo cuando viajan a menos de 30 mph
    C: Solo cuando el vehículo está completamente detenido fuera de la parte transitada
      de la calzada
    D: Nunca se les permite usar un teléfono bajo ninguna circunstancia
  answer: C
  explanation: Los conductores menores de 18 años con un permiso de instrucción, licencia
    intermedia o licencia restringida especial para menores tienen prohibido hacer
    y recibir llamadas a menos que su vehículo esté completamente detenido fuera de
    la parte transitada de la calzada.
- id: 120
  category: safe_driving_rules
  question: Según la ley de manos libres de Iowa, ¿cuál de las siguientes acciones
    está permitida mientras se conduce?
  choices:
    A: Ingresar manualmente una dirección en un GPS
    B: Hacer una llamada usando activación por voz
    C: Sostener el teléfono para ver un mensaje de texto
    D: Transmitir un video usando comandos de voz
  answer: B
  explanation: La ley de manos libres de Iowa establece que no se puede llamar, enviar
    mensajes de texto ni marcar a menos que se use manos libres o activación por voz.
    Sostener el teléfono, ingresar direcciones de GPS y transmitir videos están explícitamente
    prohibidos.
- id: 121
  category: alcohol_drugs_health
  question: 'En Iowa, la infracción oficial de "Operar bajo los efectos del alcohol
    o drogas" (OWI) se define como tener una concentración de alcohol en sangre (BAC)
    de al menos:'
  choices:
    A: '.02'
    B: '.04'
    C: '.06'
    D: '.08'
  answer: D
  explanation: Operar bajo los efectos del alcohol o drogas se define como tener una
    concentración de alcohol en sangre (BAC) de .08 o superior, o conducir con cualquier
    cantidad de una sustancia controlada en su sistema.
- id: 122
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de Consentimiento Implícito de Iowa para las personas
    que poseen una licencia de conducir de Iowa?
  choices:
    A: Usted acepta que su vehículo sea registrado en cualquier parada de tráfico.
    B: Usted acepta contractualmente dar su consentimiento para una prueba de sobriedad
      en el campo cuando lo solicite la policía.
    C: Usted acepta pagar todas las multas de tráfico en un plazo de 30 días.
    D: Usted acepta someterse a pruebas de detección de drogas aleatorias por parte
      de su empleador.
  answer: B
  explanation: Como titular de una licencia de conducir de Iowa, usted acepta contractualmente
    dar su consentimiento para una prueba de sobriedad en el campo cuando lo solicite
    la policía bajo la ley de Consentimiento Implícito para Pruebas.
- id: 123
  category: penalties_and_points
  question: ¿Cuál es la sanción mínima por negarse a una prueba de alcoholemia (alcoholímetro)
    en Iowa?
  choices:
    A: Una revocación de la licencia por 180 días y una multa de $500
    B: Una revocación de la licencia por un año y una multa mínima de $1,250
    C: Una revocación de la licencia por 60 días y servicio comunitario obligatorio
    D: Una suspensión de la licencia por 30 días y una multa de $200
  answer: B
  explanation: Las consecuencias por negarse a una prueba de alcoholemia incluyen
    una revocación automática de su licencia por un año y una multa mínima de $1,250.
- id: 124
  category: alcohol_drugs_health
  question: 'Se considera que un conductor menor de edad (menor de 21 años) está operando
    bajo los efectos del alcohol o drogas en Iowa si su concentración de alcohol en
    sangre (BAC) es igual o superior a:'
  choices:
    A: '.00'
    B: '.02'
    C: '.04'
    D: '.08'
  answer: B
  explanation: Se considera que un conductor menor de edad está operando bajo los
    efectos del alcohol o drogas con un BAC de .02 o más.
- id: 125
  category: alcohol_drugs_health
  question: ¿Dónde es legal transportar un recipiente de alcohol abierto y sin sellar
    en un vehículo motorizado?
  choices:
    A: En la guantera
    B: Debajo del asiento del pasajero
    C: En el maletero del vehículo
    D: En el portavasos del asiento trasero
  answer: C
  explanation: La Ley de Recipientes Abiertos establece que los recipientes abiertos
    de bebidas alcohólicas pueden transportarse en el maletero de un vehículo.
- id: 126
  category: alcohol_drugs_health
  question: 'Estar despierto durante 18 horas seguidas se considera tan perjudicial
    como tener una concentración de alcohol en sangre (BAC) de:'
  choices:
    A: 0.02 por ciento
    B: 0.04 por ciento
    C: 0.08 por ciento
    D: 0.10 por ciento
  answer: C
  explanation: Estar despierto durante 18 horas seguidas es tan perjudicial como una
    concentración de alcohol en sangre (BAC) del 0.08 por ciento, lo cual se considera
    legalmente ebrio.
- id: 127
  category: safe_driving_rules
  question: ¿Qué recurso proporciona las últimas condiciones de viaje, como clima
    adverso y construcción de carreteras, para las autopistas e interestatales de
    Iowa?
  choices:
    A: Iowa 311
    B: Iowa 411
    C: Iowa 511
    D: Iowa 911
  answer: C
  explanation: Los conductores pueden visitar www.511ia.org o descargar la aplicación
    móvil gratuita (Iowa 511) para mantenerse al día sobre las últimas condiciones
    de viaje.
- id: 128
  category: vehicle_information
  question: Al conducir un vehículo con transmisión automática, ¿qué significa la
    "N" en el selector de marchas?
  choices:
    A: Normal
    B: Neutral (Punto muerto)
    C: Night (Noche)
    D: Navigate (Navegar)
  answer: B
  explanation: En un selector de marchas de transmisión automática, N significa "Neutral"
    (punto muerto) para dejar el motor en ralentí.
- id: 129
  category: vehicle_information
  question: En un vehículo con transmisión manual, ¿qué pie se utiliza para presionar
    el tercer pedal llamado "embrague" (clutch)?
  choices:
    A: El pie derecho
    B: El pie izquierdo
    C: Se puede usar cualquier pie
    D: Ambos pies simultáneamente
  answer: B
  explanation: El paso 1 para cambiar de marcha en un vehículo de transmisión manual
    es "presionar el embrague con el pie izquierdo".
- id: 130
  category: safe_driving_rules
  question: ¿Qué dos factores componen la distancia total de frenado de un vehículo?
  choices:
    A: Distancia de reacción y distancia de frenado
    B: Distancia de velocidad y distancia de peso
    C: Distancia de aceleración y distancia de frenado
    D: Distancia visual y distancia manual
  answer: A
  explanation: De acuerdo con la fórmula de distancia de frenado en el manual, Distancia
    de Reacción + Distancia de Frenado = Distancia de Parada.
- id: 131
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una excepción a la ley de conducción distraída
    de Iowa que prohíbe el uso de dispositivos electrónicos portátiles?
  choices:
    A: Un conductor que cambia una lista de reproducción de música
    B: Una persona que recibe información relacionada con la seguridad, como alertas
      meteorológicas
    C: Un conductor que consulta una aplicación de mapas mientras está detenido en
      un semáforo en rojo
    D: Un conductor que lee un mensaje de texto de un familiar
  answer: B
  explanation: Las excepciones a la ley de conducción distraída incluyen a una persona
    que recibe información relacionada con la seguridad, incluyendo alertas de emergencia,
    de tráfico y meteorológicas.
- id: 132
  category: safe_driving_rules
  question: Bajo condiciones normales de conducción, ¿cuál es la distancia de seguimiento
    mínima que debe mantener un conductor principiante o sin experiencia?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: B
  explanation: Un conductor principiante o sin experiencia debe mantener al menos
    una distancia de seguimiento de tres segundos bajo condiciones normales de conducción.
- id: 133
  category: defensive_driving
  question: ¿Qué distancia de seguimiento se recomienda cuando las condiciones de
    la carretera son resbaladizas o el vehículo delante de usted bloquea su visión?
  choices:
    A: Dos segundos
    B: Tres a cuatro segundos
    C: Cuatro a cinco segundos
    D: Seis o más segundos
  answer: D
  explanation: Cuando las condiciones de la carretera son resbaladizas o el vehículo
    delante de usted bloquea su visión, se recomienda una distancia de seguimiento
    de seis o más segundos.
- id: 134
  category: vehicle_information
  question: 'Si su vehículo tiene un sistema de frenos antibloqueo (ABS) y necesita
    detenerse rápidamente, usted debe:'
  choices:
    A: Bombear los frenos rápidamente para evitar derrapar.
    B: Presionar el pedal del freno tan fuerte como pueda y mantener la presión.
    C: Aplicar una presión ligera al pedal del freno y aumentarla gradualmente.
    D: Soltar el pedal del freno si siente que este empuja hacia atrás.
  answer: B
  explanation: Si su vehículo tiene ABS y necesita detenerse rápidamente, presione
    el pedal del freno tan fuerte como pueda y manténgalo presionado. No suelte el
    pedal del freno aunque sienta que empuja hacia atrás.
- id: 135
  category: defensive_driving
  question: ¿Cómo puede usar sus luces de freno para comunicarse con un conductor
    detrás de usted que lo sigue demasiado de cerca?
  choices:
    A: Encendiendo y apagando sus luces de emergencia.
    B: Presionando el pedal del freno firmemente y manteniéndolo así.
    C: Tocando el pedal del freno tres o cuatro veces rápidamente.
    D: Pisando ligeramente el pedal del freno durante una cuadra entera.
  answer: C
  explanation: Si el vehículo detrás de usted lo sigue demasiado de cerca, toque el
    pedal del freno tres o cuatro veces rápidamente. Esto les hará saber a quienes
    vienen detrás que usted está a punto de disminuir la velocidad.
- id: 136
  category: sharing_the_road
  question: 'Usted siempre debe detenerse por completo al acercarse a una persona
    con discapacidad visual que camina frente a usted y que lleva un:'
  choices:
    A: Bastón amarillo o con punta negra.
    B: Bastón blanco o con punta roja.
    C: Letrero naranja reflectante.
    D: Bastón azul o con punta verde.
  answer: B
  explanation: Usted siempre debe detenerse cuando una persona con discapacidad visual
    con un bastón (a menudo blanco o con punta roja) o un perro guía camina frente
    a usted o lo suficientemente cerca como para que la persona pueda estar en peligro.
- id: 137
  category: safe_driving_rules
  question: En caso de que el límite de velocidad no esté señalizado, ¿cuál es el
    límite de velocidad general en un distrito residencial o escolar?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: En caso de que el límite de velocidad no esté señalizado, el límite
    general es de 25 mph en un distrito residencial o distrito escolar.
- id: 138
  category: safe_driving_rules
  question: ¿Cuál es la velocidad mínima permitida en el sistema de autopistas interestatales
    bajo condiciones normales?
  choices:
    A: 40 mph
    B: 45 mph
    C: 50 mph
    D: 55 mph
  answer: A
  explanation: En el sistema interestatal hay una velocidad mínima de 40 mph. Los
    vehículos que no pueden ir al menos a esa velocidad bajo condiciones normales
    no tienen permitido circular por la interestatal.
- id: 139
  category: vehicle_information
  question: Para reducir el riesgo de lesiones por las bolsas de aire (airbags) delanteras
    y mantener el control de su vehículo, ¿dónde deben colocarse las manos en el volante?
  choices:
    A: A las 10 y las 2 en punto
    B: A las 9 y las 3 en punto o un poco más abajo a las 7 y las 5 en punto
    C: A las 8 y las 4 en punto o un poco más arriba a las 11 y la 1 en punto
    D: Una mano a las 12 en punto
  answer: B
  explanation: Sus manos deben colocarse en lados opuestos del volante, a las 9 y
    las 3 en punto o un poco más abajo a las 7 y las 5 en punto, para reducir el riesgo
    de lesiones por las bolsas de aire delanteras y mantener mejor el control.
- id: 140
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una técnica adecuada al retroceder (dar marcha
    atrás) con su vehículo?
  choices:
    A: Depender totalmente de su cámara de retroceso y de los espejos.
    B: Girar el volante en la dirección opuesta a la que desea que viaje el automóvil.
    C: Girar la cadera, darse vuelta y mirar por encima del hombro derecho a través
      de la ventana trasera.
    D: Usar el acelerador a fondo para completar la maniobra rápidamente.
  answer: C
  explanation: Al retroceder, gire la cadera y dese vuelta para tener una buena visión
    detrás del vehículo. Coloque su brazo derecho sobre el respaldo del asiento, sujete
    la parte superior del volante con la mano izquierda y mire por encima de su hombro
    derecho a través de la ventana trasera.
- id: 141
  category: safe_driving_rules
  question: Según la ley de Iowa, si el límite de velocidad es superior a 45 mph,
    ¿con cuánta anticipación debe señalizar antes de realizar un giro?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: D
  explanation: La ley de Iowa exige que señalice al menos 100 pies antes de un giro
    si el límite de velocidad es de 45 mph o menos, y si el límite de velocidad es
    superior a 45 mph, debe señalizar al menos 300 pies antes de girar.
- id: 142
  category: defensive_driving
  question: Si hay calles o entradas para autos entre usted y el lugar donde desea
    girar, ¿cuándo debe usar su señal de giro?
  choices:
    A: Tan pronto como vea su destino.
    B: Al menos 500 pies antes del giro, independientemente de las intersecciones.
    C: Espere hasta haber pasado las otras calles o entradas para señalizar.
    D: Señalice temprano y haga señas a otros conductores para que pasen por la intersección.
  answer: C
  explanation: Tenga cuidado de no señalizar demasiado pronto. Si hay calles, entradas
    para autos o accesos entre usted y el lugar donde desea girar, espere hasta haberlos
    pasado para señalizar.
- id: 143
  category: safe_driving_rules
  question: ¿Bajo qué condición puede realizar un giro a la izquierda con luz roja?
  choices:
    A: Al girar desde una calle de doble sentido hacia una de un solo sentido.
    B: Al girar desde el carril izquierdo de una calle de un solo sentido hacia otra
      calle de un solo sentido.
    C: Al girar desde una calle de un solo sentido hacia una de doble sentido.
    D: Los giros a la izquierda con luz roja nunca están permitidos en Iowa.
  answer: B
  explanation: Puede realizar un giro a la izquierda con luz roja si está girando
    desde el carril izquierdo de una calle de un solo sentido hacia otra calle de
    un solo sentido.
- id: 144
  category: safe_driving_rules
  question: Al girar la cabeza para revisar sus puntos ciegos antes de cambiar de
    carril, ¿cuál es una precaución de seguridad importante?
  choices:
    A: Asegúrese de mantener el volante recto.
    B: Gire ligeramente el volante en la dirección en la que está mirando.
    C: Toque los frenos para alertar a otros conductores.
    D: Reduzca la velocidad significativamente antes de mirar.
  answer: A
  explanation: Cuando gire la cabeza para revisar los puntos ciegos, asegúrese de
    mantener el volante recto; las personas tienen una tendencia natural a girar los
    brazos en la misma dirección que la cabeza.
- id: 145
  category: defensive_driving
  question: En comparación con un vehículo que viaja a 30 mph, ¿cuánta más distancia
    recorrerá un vehículo que viaja a 60 mph antes de detenerse por completo?
  choices:
    A: 2 veces más lejos
    B: 3 veces más lejos
    C: 4 veces más lejos
    D: 5 veces más lejos
  answer: B
  explanation: Cuanto más rápido vaya su vehículo, más distancia le tomará girar,
    reducir la velocidad o detenerse. Por ejemplo, un vehículo que viaja a 60 mph
    recorrerá 3 veces más distancia que un vehículo que viaja a 30 mph antes de detenerse
    por completo.
- id: 146
  category: safe_driving_rules
  question: ¿Qué establece el manual con respecto a los giros de tres puntos?
  choices:
    A: Son la forma más segura de dar la vuelta en una calle concurrida.
    B: Deben realizarse en todas las calles sin salida.
    C: Generalmente no son una maniobra segura y pueden aumentar el riesgo de colisiones.
    D: Son obligatorios para aprobar el examen de conducir.
  answer: C
  explanation: Los giros de tres puntos generalmente no son una maniobra segura y
    pueden aumentar su riesgo y exposición a colisiones. Es mejor continuar hasta
    la intersección más cercana.
- id: 147
  category: safe_driving_rules
  question: ¿Qué debe hacer con el volante al girar la cabeza para revisar sus puntos
    ciegos?
  choices:
    A: Gírelo ligeramente en la dirección en la que está mirando.
    B: Manténgalo recto.
    C: Gírelo ligeramente en dirección opuesta a la que está mirando.
    D: Suelte el volante momentáneamente.
  answer: B
  explanation: Cuando gire la cabeza para revisar los puntos ciegos, asegúrese de
    mantener el volante recto; las personas tienen una tendencia natural a girar los
    brazos en la misma dirección que la cabeza.
- id: 148
  category: safe_driving_rules
  question: Al adelantar a otro vehículo, ¿cuándo es seguro regresar a su carril original?
  choices:
    A: Tan pronto como haya pasado el parachoques delantero del otro vehículo.
    B: Cuando pueda ver la parte delantera del auto que adelantó en su espejo retrovisor.
    C: Después de haber acelerado durante tres segundos.
    D: Cuando el vehículo adelantado parpadee sus luces delanteras.
  answer: B
  explanation: Cuando vea la parte delantera del auto que adelantó en el espejo retrovisor
    y su vehículo esté bien alejado, señalice su intención y regrese suave y lentamente
    al carril original.
- id: 149
  category: signs_and_signals
  question: ¿Qué indican las líneas amarillas en el pavimento de una calzada?
  choices:
    A: Separan el tráfico que viaja en la misma dirección.
    B: Indican una zona escolar más adelante.
    C: Separan el tráfico que viaja en diferentes direcciones.
    D: Marcan el borde derecho de la calzada.
  answer: C
  explanation: Según las reglas de marcas en el pavimento, las líneas amarillas separan
    el tráfico que viaja en diferentes direcciones, mientras que las líneas blancas
    separan el tráfico que viaja en la misma dirección.
- id: 150
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones se considera ilegal adelantar?
  choices:
    A: A menos de 100 pies de un cruce de ferrocarril.
    B: En una carretera con líneas blancas discontinuas.
    C: Cuando el vehículo de adelante viaja por debajo del límite de velocidad.
    D: Cuando tiene una línea amarilla discontinua de su lado de la carretera.
  answer: A
  explanation: Adelantar es ilegal en varias situaciones, incluyendo a menos de 100
    pies de un cruce de ferrocarril, intersección o puente/túnel estrecho.
- id: 151
  category: defensive_driving
  question: ¿Según el manual, qué porcentaje de los choques graves se deben a decisiones
    peligrosas o errores que cometen las personas al volante?
  choices:
    A: 50 por ciento
    B: 75 por ciento
    C: 82 por ciento
    D: 94 por ciento
  answer: D
  explanation: El manual establece que el 94 por ciento de los choques graves se deben
    a decisiones peligrosas o errores que cometen las personas al volante.
- id: 152
  category: defensive_driving
  question: ¿Con cuánta anticipación debe observar las condiciones de la carretera
    para mantenerse al tanto de su entorno?
  choices:
    A: De 5 a 10 segundos
    B: De 10 a 15 segundos
    C: De 20 a 30 segundos
    D: De 30 a 45 segundos
  answer: C
  explanation: Como parte de la conducción defensiva, debe revisar sus espejos con
    frecuencia y observar las condiciones de 20 a 30 segundos por delante de usted.
- id: 153
  category: defensive_driving
  question: ¿Qué significa 'tener una ruta de escape' al conducir?
  choices:
    A: Conocer la ruta más rápida hacia su destino.
    B: Mantener las ventanillas bajadas en caso de una emergencia.
    C: Dejarse una salida o una trayectoria alterna si su camino inmediato se bloquea.
    D: Memorizar la ubicación de todas las salidas de la autopista.
  answer: C
  explanation: 'Tener una ruta de escape significa dejarse una salida: un lugar hacia
    donde mover su vehículo si su trayectoria inmediata de viaje se bloquea repentinamente.'
- id: 154
  category: safe_driving_rules
  question: ¿Según el manual, cuándo son más seguras las carreteras?
  choices:
    A: Cuando todos los vehículos viajan al límite de velocidad máximo.
    B: Cuando todos los vehículos viajan a la misma velocidad pero sin exceder el
      límite de velocidad.
    C: Cuando el tráfico más lento permanece estrictamente en el carril derecho.
    D: Cuando hay una mezcla de vehículos rápidos y lentos.
  answer: B
  explanation: Las carreteras son más seguras cuando todos los vehículos viajan a
    la misma velocidad pero sin exceder el límite de velocidad.
- id: 155
  category: sharing_the_road
  question: ¿Qué tipo de señal podría ver en la parte trasera de un vehículo de movimiento
    lento, como un tractor agrícola o un vehículo tirado por caballos?
  choices:
    A: Un octágono rojo
    B: Un diamante amarillo
    C: Un triángulo naranja
    D: Un rectángulo blanco
  answer: C
  explanation: Los vehículos de movimiento lento pueden tener una señal de vehículo
    de movimiento lento (un triángulo naranja o luces intermitentes) en la parte trasera.
- id: 156
  category: defensive_driving
  question: ¿Qué debe hacer si otro vehículo lo sigue demasiado de cerca (tailgating)?
  choices:
    A: Frenar repentinamente para advertir al conductor.
    B: Aumentar la velocidad para incrementar la distancia entre ustedes.
    C: Moverse ligeramente hacia la derecha e intentar reducir la velocidad para animarlo
      a rebasar.
    D: Encender las luces de emergencia y detenerse en su carril.
  answer: C
  explanation: Si lo están siguiendo demasiado de cerca, muévase ligeramente hacia
    la derecha y dele al conductor de atrás una mejor visión de lo que hay adelante...
    Intente reducir la velocidad y anime al conductor de atrás a rebasarlo.
- id: 157
  category: safe_driving_rules
  question: Según la ley de Iowa, ¿cuándo es obligatorio usar los faros delanteros?
  choices:
    A: Desde el atardecer hasta el amanecer o siempre que la visibilidad sea de 500
      pies o menos.
    B: Solo de 8 PM a 6 AM.
    C: Siempre que esté conduciendo en una autopista.
    D: Solo cuando la visibilidad sea inferior a 100 pies.
  answer: A
  explanation: La ley de Iowa exige el uso de ambos faros delanteros desde el atardecer
    hasta el amanecer o siempre que la visibilidad sea de 500 pies o menos (niebla,
    lluvia intensa, nieve, etc.).
- id: 158
  category: vehicle_information
  question: ¿Cuál es una buena regla general con respecto al uso de los faros durante
    el mal tiempo?
  choices:
    A: Encender los faros delanteros siempre que encienda los limpiaparabrisas.
    B: Usar las luces altas solo en nieve intensa.
    C: Apagar los faros si su vehículo tiene luces de circulación diurna.
    D: Usar las luces de emergencia en lugar de los faros en la lluvia.
  answer: A
  explanation: Una buena regla general es encender los faros delanteros siempre que
    encienda los limpiaparabrisas.
- id: 159
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones debería usar la bocina?
  choices:
    A: Para saludar a un amigo que camina por la acera.
    B: Para expresar enojo hacia un conductor que se le cruzó.
    C: Cuando esté saliendo de un callejón estrecho y no pueda ver lo que hay adelante.
    D: Para animar a un conductor lento a que acelere.
  answer: C
  explanation: Debe usar la bocina cuando llegue a un lugar donde no pueda ver lo
    que hay adelante, como al salir de un callejón estrecho.
- id: 160
  category: defensive_driving
  question: ¿Qué deben hacer usted y sus pasajeros si su vehículo se detiene en un
    carril de circulación y no se puede mover?
  choices:
    A: Permanecer dentro del vehículo con los cinturones de seguridad abrochados.
    B: Salir del vehículo rápidamente y permanecer en un área segura lejos de los
      vehículos en movimiento.
    C: Pararse directamente detrás del vehículo para indicar al tráfico que lo rodee.
    D: Intentar empujar el vehículo mientras el tráfico está en movimiento.
  answer: B
  explanation: Si se queda detenido en un carril de circulación, usted y sus pasajeros
    deben salir del vehículo rápidamente y permanecer en un área segura; cuando sea
    posible, lejos del arcén de la carretera y lejos de los vehículos en movimiento.
- id: 161
  category: safe_driving_rules
  question: ¿Al prepararse para entrar en una intersección, en qué orden debe buscar
    vehículos y peatones que se aproximan?
  choices:
    A: Derecha, izquierda y derecha de nuevo
    B: Izquierda, derecha e izquierda de nuevo
    C: Hacia adelante, luego detrás de usted
    D: Izquierda, luego hacia adelante
  answer: B
  explanation: Antes de avanzar por una intersección, debe mirar a la izquierda, a
    la derecha y a la izquierda de nuevo para detectar vehículos y peatones que se
    aproximen.
- id: 162
  category: defensive_driving
  question: ¿Por qué debe tener cuidado con una señal de giro "falsa" de un vehículo
    que se aproxima?
  choices:
    A: El conductor puede planear girar más allá de usted o se olvidó de apagar la
      señal.
    B: Las señales de giro suelen estar mal cableadas en los vehículos más nuevos.
    C: El conductor está señalizando para indicarle que usted pase primero.
    D: Indica que el vehículo está a punto de detenerse repentinamente.
  answer: A
  explanation: No gire solo porque un vehículo que se aproxima tenga encendida una
    señal de giro. El conductor puede planear girar más allá de usted o haber olvidado
    apagar la señal de un giro anterior.
- id: 163
  category: safe_driving_rules
  question: Al cruzar o girar a la izquierda en una carretera rural de cuatro carriles,
    ¿cuál es el método más seguro?
  choices:
    A: Acelerar rápidamente para cruzar ambas direcciones de tráfico a la vez.
    B: Avanzar hacia la mediana, permanecer detenido, mirar a la derecha y cruzar
      cuando sea seguro.
    C: Esperar hasta que no haya tráfico en ninguna dirección durante al menos una
      milla.
    D: Incorporarse primero al carril derecho y luego hacer un giro en U.
  answer: B
  explanation: No intente cruzar ambas direcciones de tráfico al mismo tiempo. Deténgase
    en la señal de alto, mire a la izquierda y avance hacia la mediana cuando sea
    seguro. Permanezca detenido en la mediana, mire a la derecha y cruce o gire a
    la izquierda cuando sea seguro.
- id: 164
  category: safe_driving_rules
  question: ¿Cuál es el propósito del área de aceleración e incorporación de una rampa
    de entrada a la interestatal?
  choices:
    A: Detenerse por completo y esperar un espacio en el tráfico.
    B: Aumentar la velocidad de su vehículo hasta alcanzar la del tráfico e incorporarse
      cuando sea seguro.
    C: Escanear la calzada y evaluar cuánto espacio tiene.
    D: Permitir que el tráfico de la interestatal salga de la autopista de manera
      segura.
  answer: B
  explanation: Use el área de aceleración e incorporación para aumentar la velocidad
    de su vehículo hasta alcanzar la del tráfico e incorpórese cuando sea seguro hacerlo.
    No se detenga por completo en la rampa a menos que sea absolutamente necesario.
- id: 165
  category: safe_driving_rules
  question: ¿Cómo giran a la izquierda o cruzan una carretera de cuatro carriles los
    conductores en una calle lateral en una intersección de conflicto reducido?
  choices:
    A: Esperando un espacio en ambas direcciones de tráfico simultáneamente.
    B: Usando un semáforo tradicional para cruzar directamente.
    C: Girando a la derecha hacia la carretera, incorporándose a la izquierda y haciendo
      un giro en U en una apertura designada.
    D: Conduciendo brevemente por el lado opuesto de la carretera antes de desviarse
      de nuevo.
  answer: C
  explanation: En las intersecciones de conflicto reducido, los conductores en la
    calle lateral que deseen girar a la izquierda o cruzar la carretera de cuatro
    carriles girarán a la derecha hacia la carretera, se incorporarán al carril izquierdo
    y luego harán un giro en U en una apertura de la mediana designada.
- id: 166
  category: safe_driving_rules
  question: ¿Cuál es una característica única de un intercambio de diamante divergente?
  choices:
    A: Dirige el tráfico en sentido contrario a las agujas del reloj alrededor de
      una isla central.
    B: Requiere que los conductores se detengan en la mediana antes de cruzar la segunda
      mitad de la carretera.
    C: Dirige a los conductores brevemente por el lado opuesto de la carretera antes
      de desviarse de nuevo hacia la dirección correcta.
    D: Utiliza solo señales de ceda el paso y no semáforos.
  answer: C
  explanation: Un intercambio de diamante divergente tiene un diseño único que dirige
    a los conductores brevemente por el lado opuesto de la carretera antes de desviarse
    de nuevo hacia la dirección correcta.
- id: 167
  category: safe_driving_rules
  question: ¿En qué dirección se mueve el tráfico en una rotonda?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En un patrón de figura en ocho
    D: Directamente a través de la isla central
  answer: B
  explanation: Las rotondas son intersecciones que dirigen el tráfico en sentido contrario
    a las agujas del reloj alrededor de una isla central.
- id: 168
  category: signs_and_signals
  question: ¿Cuál de los siguientes dispositivos de control de tráfico NO se encuentra
    en una rotonda?
  choices:
    A: Señales de ceda el paso
    B: Señales direccionales
    C: Marcas en el pavimento
    D: Señales de alto y semáforos
  answer: D
  explanation: Las rotondas no tienen señales de alto ni semáforos. Las señales de
    ceda el paso, las señales direccionales y las marcas en el pavimento guían el
    tráfico a través de la intersección.
- id: 169
  category: safe_driving_rules
  question: ¿Cómo debe salir un automovilista de una rotonda de un solo carril?
  choices:
    A: Detenerse por completo y luego girar a la derecha.
    B: Señalizar, luego salir de la rotonda hacia su derecha, cediendo el paso a cualquier
      persona en el cruce peatonal.
    C: Acelerar y salir sin señalizar para mantener el flujo de tráfico.
    D: Cambiar al carril izquierdo antes de salir.
  answer: B
  explanation: Al salir de una rotonda de un solo carril, debe señalizar, luego salir
    de la rotonda hacia su derecha y ceder el paso a cualquier persona en el cruce
    peatonal.
- id: 170
  category: sharing_the_road
  question: ¿Cómo debe navegar una rotonda un ciclista experimentado si decide circular
    por ella como un automovilista?
  choices:
    A: Pegarse al bordillo para mantenerse fuera del camino de los vehículos.
    B: Circular por el medio del carril para evitar que los vehículos lo adelanten.
    C: Circular por el delantal del camión (truck apron).
    D: Circular en contra del flujo del tráfico.
  answer: B
  explanation: Los ciclistas experimentados que navegan por las rotondas como automovilistas
    no deben pegarse al bordillo. Deben circular por el medio del carril para evitar
    que los vehículos los adelanten.
- id: 171
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una regla para conducir en una glorieta (roundabout)
    de varios carriles?
  choices:
    A: Cambiar de carril mientras está dentro de la glorieta para llegar a su salida.
    B: Rebasar camiones y autobuses rápidamente para evitar sus puntos ciegos.
    C: No cambiar de carril en la glorieta.
    D: Conducir siempre por el carril exterior, independientemente de su salida.
  answer: C
  explanation: Al conducir en una glorieta de varios carriles, no debe cambiar de
    carril dentro de la glorieta.
- id: 172
  category: sharing_the_road
  question: ¿Por qué debe evitar rebasar o conducir al lado de camiones o autobuses
    en una glorieta de varios carriles?
  choices:
    A: Se les exige conducir mucho más rápido que los automóviles.
    B: Pueden ocupar varios carriles o es posible que no lo vean.
    C: No se les permite entrar en las glorietas y podrían comportarse de forma impredecible.
    D: Siempre deben usar la isla central para girar.
  answer: B
  explanation: No debe rebasar ni conducir al lado de camiones o autobuses en una
    glorieta porque pueden ocupar varios carriles o es posible que no lo vean.
- id: 173
  category: defensive_driving
  question: ¿Cómo debe ajustar su conducción al viajar sobre grava suelta en comparación
    con el pavimento?
  choices:
    A: Conducir más rápido para mantener el impulso sobre la grava.
    B: Realizar giros bruscos para evitar deslizarse.
    C: Frenar con firmeza y rapidez al detenerse.
    D: Reducir la velocidad, evitar giros bruscos y aumentar su distancia de seguimiento.
  answer: D
  explanation: Conducir sobre grava suelta reduce la tracción. Debe reducir la velocidad,
    evitar giros bruscos, acelerar y frenar lentamente, y aumentar su distancia de
    seguimiento.
- id: 174
  category: safe_driving_rules
  question: ¿Qué es cierto acerca de las intersecciones no controladas, que son comunes
    en los caminos de grava?
  choices:
    A: Están controladas por semáforos pero no por señales.
    B: No están controladas por señales de ceda el paso o de alto (stop).
    C: Siempre requieren que el conductor de la derecha se detenga.
    D: Solo se encuentran en zonas urbanas.
  answer: B
  explanation: Las intersecciones no controladas son más comunes en los caminos de
    grava. No están controladas por señales de ceda el paso o de alto, por lo que
    todos los conductores deben tener precaución y estar preparados para detenerse.
- id: 175
  category: safe_driving_rules
  question: ¿Qué vehículo debe ceder el paso en una intersección no controlada?
  choices:
    A: El vehículo a la derecha
    B: El vehículo a la izquierda
    C: El vehículo más grande
    D: El vehículo que viaja más rápido
  answer: B
  explanation: En una intersección no controlada, el vehículo de la izquierda debe
    ceder el paso. Nunca debe asumir que la intersección está despejada o que el otro
    vehículo se detendrá.
- id: 176
  category: safe_driving_rules
  question: ¿Qué debe hacer para que su vehículo sea más visible para los demás durante
    condiciones de mucho polvo en caminos rurales?
  choices:
    A: Usar las luces altas (high beam)
    B: Encender las luces de emergencia (hazard lights)
    C: Usar las luces bajas (low beam)
    D: Tocar la bocina periódicamente
  answer: C
  explanation: El manual establece que se deben usar las luces bajas para que su vehículo
    sea más visible para los demás durante condiciones de mucho polvo.
- id: 177
  category: defensive_driving
  question: Si queda deslumbrado por los faros de un vehículo que viene en sentido
    contrario por la noche, ¿hacia dónde debe mirar?
  choices:
    A: Directamente a los faros que se aproximan
    B: A la línea central de la carretera
    C: A la franja blanca en el borde derecho del pavimento
    D: A su espejo retrovisor
  answer: C
  explanation: Si queda deslumbrado por los faros de otro vehículo, reduzca la velocidad
    y observe la franja blanca en el borde derecho del pavimento hasta que pase el
    efecto.
- id: 178
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si encuentra un animal en la carretera
    y no tiene tiempo para detenerse?
  choices:
    A: Virar bruscamente a la izquierda
    B: Virar bruscamente a la derecha
    C: Tocar la bocina y acelerar
    D: No virar ni desviarse bruscamente
  answer: D
  explanation: Si se encuentra con un animal y no hay tiempo para detenerse, no vire
    ni se desvíe bruscamente, ya que esto probablemente resultará en un choque más
    grave.
- id: 179
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego o "zona prohibida"
    (no-zone) de un camión grande?
  choices:
    A: Está conduciendo exactamente al límite de velocidad
    B: No puede ver al conductor del camión en el espejo del camión
    C: Está a más de tres longitudes de automóvil detrás del camión
    D: Las luces direccionales del camión están parpadeando
  answer: B
  explanation: Los camiones grandes tienen puntos ciegos, o "zonas prohibidas". Si
    no puede ver al conductor del camión en el espejo del camión, el conductor del
    camión no puede verlo a usted.
- id: 180
  category: sharing_the_road
  question: ¿Por qué debe evitar meterse entre un camión grande y la acera en una
    intersección?
  choices:
    A: Los camiones a menudo giran ampliamente hacia la izquierda para realizar un
      giro a la derecha de manera segura.
    B: El camión puede acelerar más rápido que su automóvil.
    C: Es ilegal rebasar a un camión por la derecha bajo cualquier circunstancia.
    D: El escape del camión oscurecerá su visión.
  answer: A
  explanation: Los conductores de camiones a veces necesitan girar ampliamente hacia
    la izquierda para realizar un giro a la derecha de manera segura. Meterse entre
    el camión y la acera aumenta la posibilidad de un choque.
- id: 181
  category: sharing_the_road
  question: ¿Dónde es más probable que ocurran colisiones entre automóviles y motocicletas?
  choices:
    A: En autopistas interestatales
    B: En las intersecciones
    C: En caminos rurales de grava
    D: En estacionamientos
  answer: B
  explanation: Las intersecciones son los lugares donde es más probable que ocurran
    colisiones entre automóviles y motocicletas. Asegúrese de ver la motocicleta y
    conocer su velocidad antes de girar.
- id: 182
  category: sharing_the_road
  question: ¿Cuál es la distancia de seguimiento mínima recomendada al conducir detrás
    de una motocicleta en condiciones normales?
  choices:
    A: 1-2 segundos
    B: 3-4 segundos
    C: 5-6 segundos
    D: 7-8 segundos
  answer: B
  explanation: Al conducir detrás de una motocicleta, deje al menos una distancia
    de seguimiento de 3 a 4 segundos. Esto le da al motociclista suficiente espacio
    para maniobrar o detenerse en una emergencia.
- id: 183
  category: sharing_the_road
  question: ¿Cuál es el procedimiento adecuado para rebasar a un ciclista en la carretera?
  choices:
    A: Toque la bocina y rebase de cerca en el mismo carril
    B: Muévase a la mitad del carril contiguo para rebasar
    C: Cambie de carril por completo, dándole al ciclista todo el carril
    D: Acelere y rebase lo más rápido posible en el mismo carril
  answer: C
  explanation: Al rebasar ciclistas, debe cambiar de carril por completo, dándole
    al ciclista todo el carril tal como lo haría con cualquier otro vehículo.
- id: 184
  category: safe_driving_rules
  question: ¿Por qué nunca debe rebasar a otro vehículo que se ha detenido o está
    reduciendo la velocidad por un peatón?
  choices:
    A: El vehículo podría estar preparándose para dar una vuelta en U.
    B: Es ilegal cambiar de carril cerca de una intersección.
    C: Es posible que no pueda ver al peatón cuando se acerque.
    D: El vehículo detenido podría acelerar repentinamente.
  answer: C
  explanation: Nunca rebase a otro vehículo que se haya detenido o esté reduciendo
    la velocidad por un peatón, ya que es posible que no pueda ver al peatón cuando
    se acerque al vehículo detenido.
- id: 185
  category: driver_responsibility
  question: En Iowa, ¿qué acción es legalmente permisible si ve a una persona o animal
    atrapado dentro de un vehículo cerrado y caliente que necesita atención médica?
  choices:
    A: Puede romper la ventana del vehículo.
    B: Puede remolcar el vehículo a un área sombreada.
    C: Debe esperar a que lleguen las autoridades antes de tomar cualquier medida.
    D: Puede forzar la cerradura pero no puede dañar el vehículo.
  answer: A
  explanation: En Iowa es legal romper la ventana de un vehículo para brindar atención
    médica a una persona o animal atrapado en su interior.
- id: 186
  category: safe_driving_rules
  question: ¿Qué función de su vehículo NO debe utilizar durante el mal tiempo?
  choices:
    A: Luces bajas (faros de corto alcance)
    B: Limpiaparabrisas
    C: Desempañador
    D: Control de crucero (cruise control)
  answer: D
  explanation: Si debe conducir con mal tiempo, reduzca la velocidad y aumente su
    distancia de seguimiento. NO utilice el control de crucero (cruise control) durante
    las inclemencias del tiempo.
- id: 187
  category: safe_driving_rules
  question: ¿Cuál es una característica común de los cruces ferroviarios en caminos
    rurales?
  choices:
    A: Siempre tienen barreras de cruce.
    B: Normalmente no tienen luces rojas intermitentes, campanas de advertencia ni
      barreras de cruce.
    C: Siempre están marcados con señales de pavimento de neón brillante.
    D: Están elevados por encima de la calzada.
  answer: B
  explanation: A diferencia de la mayoría de los cruces ferroviarios en las carreteras
    principales, normalmente no hay luces rojas intermitentes, campanas de advertencia,
    barreras de cruce ni marcas en el pavimento en los cruces ferroviarios de caminos
    rurales.
- id: 188
  category: defensive_driving
  question: ¿En qué meses ocurren típicamente la mayor cantidad de colisiones con
    ciervos en Iowa?
  choices:
    A: Enero, febrero y marzo
    B: Junio, julio y agosto
    C: Octubre, noviembre y mayo
    D: Diciembre, abril y septiembre
  answer: C
  explanation: Octubre, noviembre y mayo son los meses de mayor actividad de colisiones
    con ciervos; sin embargo, pueden ocurrir en cualquier momento del año.
- id: 189
  category: sharing_the_road
  question: ¿Por qué debería tener un cuidado especial con las señales de giro de
    una motocicleta?
  choices:
    A: A menudo son demasiado tenues para verse durante el día.
    B: No se apagan automáticamente y los conductores pueden olvidar cancelarlas.
    C: Parpadean más rápido que las señales de giro de un automóvil.
    D: Las motocicletas no están obligadas a tener señales de giro.
  answer: B
  explanation: Las señales de giro no se apagan automáticamente en una motocicleta
    y los conductores ocasionalmente olvidan cancelarlas después de completar un giro.
    Asegúrese de saber qué va a hacer el conductor ANTES de cruzarse en su camino.
- id: 190
  category: safe_driving_rules
  question: ¿Qué debe hacer con su distancia de seguimiento al conducir en carreteras
    mojadas o resbaladizas?
  choices:
    A: Reducirla a dos segundos
    B: Mantenerla en tres segundos
    C: Aumentarla a cinco o seis segundos
    D: Aumentarla a diez segundos
  answer: C
  explanation: El manual establece que en carreteras mojadas o resbaladizas, debe
    conducir más lento de lo normal y aumentar su distancia de seguimiento a cinco
    o seis segundos.
- id: 191
  category: safe_driving_rules
  question: ¿Al conducir en condiciones climáticas adversas, qué función del vehículo
    NUNCA debe usar?
  choices:
    A: Desempañador
    B: Luces bajas
    C: Limpiaparabrisas
    D: Control de crucero (Cruise control)
  answer: D
  explanation: 'El manual advierte explícitamente: "NO USE EL CONTROL DE CRUCERO DURANTE
    CONDICIONES CLIMÁTICAS ADVERSAS" y repite esta advertencia para condiciones de
    humedad, resbaladizas, con hielo o nieve.'
- id: 192
  category: defensive_driving
  question: ¿Cuánta agua en movimiento se necesita para arrastrar un vehículo, incluyendo
    camionetas SUV y pickups?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: A
  explanation: Según el manual, el agua en movimiento es extremadamente poderosa,
    y tan solo 6 pulgadas de agua pueden arrastrar un vehículo, incluyendo camionetas
    SUV y pickups.
- id: 193
  category: defensive_driving
  question: Si su automóvil es arrastrado por el agua y queda sumergido, ¿cuál es
    la forma recomendada de escapar?
  choices:
    A: Patear el parabrisas inmediatamente
    B: Esperar a que el vehículo se llene de agua para que las puertas sean más fáciles
      de abrir
    C: Bajar las ventanas antes de que el agua llegue a la manija de la puerta
    D: Abrir la puerta inmediatamente contra la presión del agua
  answer: B
  explanation: El manual aconseja que si su automóvil queda sumergido, debe mantener
    la calma y esperar a que el vehículo se llene de agua, porque una vez que el vehículo
    esté lleno, las puertas son más fáciles de abrir.
- id: 194
  category: safe_driving_rules
  question: ¿Por qué debe evitar el uso de luces altas al conducir con niebla?
  choices:
    A: Agotan la batería del vehículo demasiado rápido
    B: Se reflejan en la niebla, causando deslumbramiento y reducción de la visibilidad
    C: Dificultan ver las líneas en la carretera
    D: Pueden sobrecalentar el conjunto de los faros
  answer: B
  explanation: El manual establece que debe usar luces bajas o luces antiniebla porque
    las luces altas se reflejan en la niebla, causando deslumbramiento y reducción
    de la visibilidad.
- id: 195
  category: defensive_driving
  question: Si está conduciendo y se emite una advertencia de tornado, pero no puede
    llegar a un refugio, ¿qué debe hacer si permanece en su vehículo?
  choices:
    A: Estacionarse debajo de un puente o paso elevado
    B: Intentar rebasar el tornado conduciendo a alta velocidad
    C: Detenerse a un lado, agacharse por debajo de las ventanas, mantener el cinturón
      de seguridad abrochado y cubrirse la cabeza
    D: Salir del vehículo y pararse junto a él para protegerse
  answer: C
  explanation: Si no puede llegar a un refugio, el manual aconseja detenerse a un
    lado, agacharse por debajo de las ventanas, mantener el cinturón de seguridad
    abrochado y cubrirse la cabeza con las manos o un objeto.
- id: 196
  category: safe_driving_rules
  question: ¿Por qué los puentes y pasos elevados son particularmente propensos al
    hielo negro (black ice)?
  choices:
    A: Suelen ser de metal en lugar de hormigón
    B: La humedad se congela rápidamente debido a la circulación de aire tanto por
      encima como por debajo de la superficie de la carretera
    C: Las quitanieves no limpian los puentes con tanta frecuencia como las carreteras
      normales
    D: Están elevados más cerca de la atmósfera gélida
  answer: B
  explanation: El hielo negro (black ice) es común en puentes y pasos elevados porque
    la humedad se congela rápidamente debido a la circulación de aire tanto por encima
    como por debajo de la superficie de la carretera.
- id: 197
  category: safe_driving_rules
  question: ¿Cuánto más largas pueden ser las distancias de frenado al conducir sobre
    hielo y nieve en comparación con las condiciones normales?
  choices:
    A: 2 veces más largas
    B: 5 veces más largas
    C: 10 veces más largas
    D: 20 veces más largas
  answer: C
  explanation: El manual advierte que debe comenzar a reducir la velocidad mucho antes
    de anticipar una parada porque las distancias de frenado pueden ser 10 veces más
    largas en hielo y nieve.
- id: 198
  category: sharing_the_road
  question: ¿Cuál es la velocidad de operación típica de una quitanieves?
  choices:
    A: 15-25 mph
    B: 25-35 mph
    C: 35-45 mph
    D: 45-55 mph
  answer: B
  explanation: Según el manual, las quitanieves suelen operar a 25-35 mph, y muchos
    conductores no se dan cuenta de esto y las chocan por detrás.
- id: 199
  category: sharing_the_road
  question: Al compartir la carretera con una quitanieves, ¿por dónde nunca debe intentar
    rebasar?
  choices:
    A: Por el lado izquierdo
    B: En una autopista de varios carriles
    C: Por el lado del arcén (banquina)
    D: En una zona de adelantamiento
  answer: C
  explanation: 'El manual establece explícitamente: "Nunca rebase por el lado del
    arcén de una quitanieves. Las quitanieves moverán la nieve hacia los arcenes".'
- id: 200
  category: vehicle_information
  question: Si el motor de su vehículo se apaga (se cala) mientras conduce, ¿qué debe
    esperar?
  choices:
    A: El volante se bloqueará por completo
    B: Los frenos dejarán de funcionar por completo
    C: El volante será difícil de girar y tendrá que presionar muy fuerte el pedal
      del freno
    D: El vehículo se detendrá repentinamente de inmediato
  answer: C
  explanation: Si el motor se apaga, el manual señala que el volante será difícil
    de girar (pero podrá girarlo) y los frenos seguirán funcionando, pero tendrá que
    presionar muy fuerte el pedal del freno.
- id: 201
  category: vehicle_information
  question: ¿Cuál es el primer paso que debe tomar si sus frenos dejan de funcionar?
  choices:
    A: Cambiar a punto muerto (neutral) inmediatamente
    B: Bombear el pedal del freno varias veces
    C: Accionar el freno de estacionamiento tan rápido y fuerte como sea posible
    D: Apagar el motor
  answer: B
  explanation: Si sus frenos dejan de funcionar, el primer paso es bombear el pedal
    del freno varias veces, lo que a menudo generará suficiente presión de frenado
    para permitirle detenerse.
- id: 202
  category: vehicle_information
  question: ¿Qué debe hacer si el pedal del acelerador se queda atascado mientras
    conduce?
  choices:
    A: Apagar el motor inmediatamente mientras aún está en movimiento
    B: Cambiar rápidamente a punto muerto (neutral) y salir de la carretera
    C: Bombear el pedal del freno rápidamente
    D: Cambiar a una marcha más baja y dirigirse hacia una zanja
  answer: B
  explanation: Para un acelerador atascado, el manual instruye a los conductores a
    mantener la vista en la carretera, cambiar rápidamente a punto muerto (neutral),
    salir de la carretera cuando sea seguro y apagar el motor DESPUÉS de detenerse.
- id: 203
  category: driver_responsibility
  question: Según la ley estatal, ¿dentro de cuántas horas debe informar un choque
    que involucre lesiones, muerte o daños a la propiedad superiores a $1,500 para
    evitar perder sus privilegios de conducir?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 96 horas
  answer: C
  explanation: Es ley estatal informar dicho choque a la policía. No hacerlo dentro
    de las 72 horas posteriores al incidente resultará en la pérdida de sus privilegios
    de conducir y sanciones adicionales.
- id: 204
  category: vehicle_information
  question: ¿Qué sucede si retira la llave del encendido mientras el vehículo aún
    está en movimiento?
  choices:
    A: El motor se apagará, pero la dirección seguirá siendo normal
    B: El volante se bloqueará, lo que provocará una posible pérdida de control
    C: Los frenos se activarán automáticamente
    D: El vehículo se detendrá por inercia de manera segura
  answer: B
  explanation: El manual advierte que nunca se debe retirar la llave mientras se conduce
    porque el volante se bloqueará, lo que puede causar la pérdida de control del
    vehículo y podría resultar en un choque.
- id: 205
  category: driver_responsibility
  question: Al interactuar con las autoridades después de un choque, ¿cuál de los
    siguientes documentos debe estar preparado para proporcionar?
  choices:
    A: Seguro del vehículo, registro del vehículo y licencia de conducir
    B: Certificado de nacimiento y tarjeta de seguro social
    C: Título del vehículo y comprobante de compra
    D: Registros médicos y licencia de conducir
  answer: A
  explanation: El manual establece que debe estar preparado para proporcionar a un
    oficial de la ley la información del seguro del vehículo, el registro del vehículo
    y su licencia de conducir.
- id: 206
  category: driver_responsibility
  question: Según el manual, ¿qué debe hacer si se le considera culpable en un choque
    que involucra a otro conductor?
  choices:
    A: Pagar al otro conductor en efectivo inmediatamente en el lugar de los hechos
    B: Discutir con su seguro qué gastos tendrá que cubrir para ellos
    C: Entregar su licencia de conducir al otro conductor
    D: Abandonar la escena antes de que lleguen las autoridades
  answer: B
  explanation: 'El manual establece: ''Si se le considera culpable en un choque que
    involucra a otro conductor, también deberá discutir qué gastos tendrá que cubrir
    para ellos''.'
- id: 207
  category: safe_driving_rules
  question: ¿Cuál es la regla general al interactuar con un oficial de la ley?
  choices:
    A: Argumentar su caso inmediatamente
    B: Mantener la calma y seguir las instrucciones
    C: Salir de su vehículo para saludar al oficial
    D: Negarse a hablar hasta que un abogado esté presente
  answer: B
  explanation: El manual aconseja que, al interactuar con un oficial de la ley, debe
    mantener la calma y seguir las instrucciones.
- id: 208
  category: license_system
  question: Si tiene autismo o es sordo o tiene dificultades auditivas, ¿qué opción
    está disponible para su licencia de conducir o identificación?
  choices:
    A: Puede optar por que se agregue un indicador a su licencia o identificación
    B: Se le requiere llevar una nota del médico en todo momento
    C: Debe solicitar una licencia de conducir restringida
    D: No puede operar legalmente un vehículo motorizado
  answer: A
  explanation: 'El manual señala: ''Si tiene autismo y/o es sordo o tiene dificultades
    auditivas, puede optar por que se agregue un indicador a su licencia o identificación''.'
- id: 209
  category: license_system
  question: ¿Dónde es visible para las autoridades el indicador de autismo o de sordera/dificultad
    auditiva?
  choices:
    A: Solo en la licencia de conducir física o identificación
    B: Solo en la base de datos de las autoridades
    C: Impreso en la licencia/identificación y visible en la base de datos utilizada
      por las autoridades
    D: En una calcomanía especial colocada en el parabrisas del vehículo
  answer: C
  explanation: El manual establece que este tipo de indicador se imprime en su licencia/identificación
    y también será visible en la base de datos utilizada por las autoridades para
    buscar la información de un conductor.
- id: 210
  category: driver_responsibility
  question: ¿Cuál es el propósito principal de agregar un indicador de autismo o de
    sordera/dificultad auditiva a su licencia?
  choices:
    A: Eximir al conductor del pago de multas de tráfico
    B: Permitir que el conductor se estacione en espacios de estacionamiento para
      personas con discapacidad
    C: Ayudar al oficial a estar mejor preparado para interactuar con usted durante
      una parada de tráfico
    D: Notificar a los servicios médicos de emergencia su tipo de sangre
  answer: C
  explanation: Según el manual, tener el indicador visible para las autoridades 'ayuda
    al oficial a estar mejor preparado para interactuar con usted'.
- id: 211
  category: safe_driving_rules
  question: ¿Si un vehículo oficial de las fuerzas del orden le indica que se detenga
    en una calle o autopista con mucho tráfico, cuál es el lugar más seguro para orillarse?
  choices:
    A: En la mediana central
    B: En un estacionamiento o en una calle lateral menos transitada
    C: En el arcén izquierdo de la autopista
    D: Directamente en el carril de circulación
  answer: B
  explanation: El manual aconseja que en calles o autopistas con mucho tráfico, puede
    ser más seguro orillarse en un estacionamiento o en una calle lateral menos transitada.
- id: 212
  category: safe_driving_rules
  question: Cuando las fuerzas del orden le indiquen que se detenga, ¿dónde NO debe
    detener nunca su vehículo?
  choices:
    A: En un estacionamiento
    B: En una calle lateral menos transitada
    C: En un área despejada
    D: En el carril de circulación
  answer: D
  explanation: 'El manual establece explícitamente: ''No se detenga en el carril de
    circulación'' cuando un vehículo de las fuerzas del orden le indique que se detenga.'
- id: 213
  category: safe_driving_rules
  question: ¿Qué debe hacer con su vehículo una vez que se haya orillado de manera
    segura para una parada de tráfico?
  choices:
    A: Mantener el motor encendido en caso de que necesite moverse
    B: Apagar su vehículo
    C: Poner el vehículo en punto muerto y aplicar solo el freno de mano
    D: Encender las luces de emergencia y dejar el motor en marcha
  answer: B
  explanation: Durante una parada de tráfico, el manual instruye a los conductores
    a 'Apagar su vehículo, mantener las manos visibles... mantener la calma y seguir
    las instrucciones del oficial'.
- id: 214
  category: safe_driving_rules
  question: Durante una parada de tráfico, ¿dónde se recomienda que mantenga las manos?
  choices:
    A: En sus bolsillos
    B: Buscando su registro en la guantera
    C: Visibles, se recomienda que sea sobre el volante
    D: Fuera de la ventana del lado del conductor
  answer: C
  explanation: El manual aconseja a los conductores 'mantener las manos visibles (se
    recomienda sobre el volante)' durante una parada de tráfico.
- id: 215
  category: driver_responsibility
  question: 'El manual del conductor de Iowa está destinado a ser información general
    y NO es un sustituto de:'
  choices:
    A: Un curso de educación vial
    B: Asesoramiento legal
    C: Una licencia de conducir válida
    D: Seguro de vehículo
  answer: B
  explanation: 'El manual incluye un descargo de responsabilidad que establece: ''Esta
    publicación está destinada a ser información general y no es un sustituto del
    asesoramiento legal''.'
- id: 216
  category: driver_testing
  question: ¿Dónde puede realizar un examen de práctica de conocimientos antes de
    programar una cita para el examen real?
  choices:
    A: Solo en la estación de policía local
    B: En línea en el sitio web del DOT de Iowa
    C: Llamando a la oficina de Derechos Civiles del DOT de Iowa
    D: En cualquier concesionario de vehículos autorizado
  answer: B
  explanation: El manual establece que puede 'Realizar nuestro examen de práctica
    de conocimientos en línea en iowadot.gov/mvd/driverslicense/manuals-and-practice-tests'.
- id: 217
  category: driver_responsibility
  question: ¿Cuál de los siguientes NO figura como un documento que debe estar listo
    para proporcionar a un oficial de las fuerzas del orden?
  choices:
    A: Información del seguro del vehículo
    B: Registro del vehículo
    C: Licencia de conducir
    D: Comprobante de inspección del vehículo
  answer: D
  explanation: El manual enumera la información del seguro del vehículo, el registro
    del vehículo y la licencia de conducir como los documentos a proporcionar. No
    se menciona el comprobante de inspección del vehículo.
- id: 218
  category: driver_responsibility
  question: Si una persona con dominio limitado del inglés necesita asistencia especial,
    ¿con quién debe comunicarse según el manual?
  choices:
    A: La patrulla de caminos local
    B: Derechos Civiles del DOT de Iowa
    C: Su proveedor de seguros
    D: La legislatura estatal
  answer: B
  explanation: 'El manual establece: ''Si necesita más información o asistencia especial
    para personas con discapacidades o dominio limitado del inglés, comuníquese con
    Derechos Civiles del DOT de Iowa al 515-239-1111...'''
- id: 219
  category: driver_responsibility
  question: ¿Por qué debería consultar su cobertura de responsabilidad civil después
    de un choque?
  choices:
    A: Para evaluar qué gastos deberán pagarse y qué es elegible para recibir
    B: Para determinar si puede conducir legalmente su vehículo a casa
    C: Para saber si necesita reportar el choque a las fuerzas del orden
    D: Para calcular los puntos que se añadirán a su licencia
  answer: A
  explanation: 'Bajo el Paso 4: Reportar al seguro, el manual instruye: ''Consulte
    su cobertura de responsabilidad civil para evaluar qué gastos deberán pagarse
    y qué es elegible para recibir''.'
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 220
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 221
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico en sentido contrario.
  id: 222
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda
    de manera segura.
  id: 223
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de un solo sentido (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 224
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 225
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 226
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 227
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido adelantar.
  id: 228
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 229
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 230
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 231
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que crucen la calle.
  id: 232
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o un cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 233
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 234
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de vías. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 235
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 236
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 237
