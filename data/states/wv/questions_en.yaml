metadata:
  source: 2025 West Virginia Driver's Manual
  total_questions: 241
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In West Virginia, what is the minimum age to apply for a Level 1 Instructional
    Permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 17 years old
  answer: B
  explanation: According to the West Virginia Driver's Licensing Handbook, an applicant
    must be at least 15 years old to obtain a Level 1 Instructional Permit.
- id: 2
  category: license_system
  question: Under the West Virginia GDL system, a Level 1 Instructional Permit holder
    must be accompanied by a licensed driver who is at least how old?
  choices:
    A: 18 years old
    B: 19 years old
    C: 21 years old
    D: 25 years old
  answer: C
  explanation: A Level 1 permit holder must be accompanied by a licensed driver aged
    21 or older in the front seat.
- id: 3
  category: license_system
  question: What are the restricted driving hours for a West Virginia Level 1 Instructional
    Permit holder?
  choices:
    A: 11:00 PM to 4:00 AM
    B: 10:00 PM to 5:00 AM
    C: Midnight to 6:00 AM
    D: 9:00 PM to 6:00 AM
  answer: B
  explanation: Level 1 permit holders are prohibited from driving between the hours
    of 10:00 PM and 5:00 AM.
- id: 4
  category: license_system
  question: During the first six months of holding a Level 2 Intermediate License
    in West Virginia, how many non-family passengers under the age of 20 may the driver
    carry?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: A
  explanation: For the first six months of a Level 2 license, the driver may not carry
    any non-family passengers under the age of 20.
- id: 5
  category: license_system
  question: After holding a Level 2 Intermediate License for six months, how many
    non-family passengers under age 20 is the driver permitted to transport?
  choices:
    A: One
    B: Two
    C: Three
    D: Unlimited
  answer: A
  explanation: After the initial six-month period, a Level 2 driver may transport
    one non-family passenger under the age of 20.
- id: 6
  category: license_system
  question: To qualify for a Level 2 Intermediate License, a Level 1 permit holder
    must complete how many hours of certified driving practice?
  choices:
    A: 30 hours (5 at night)
    B: 40 hours (10 at night)
    C: 50 hours (10 at night)
    D: 60 hours (15 at night)
  answer: C
  explanation: West Virginia requires 50 hours of practice, at least 10 of which must
    be at night, certified by a parent or guardian.
- id: 7
  category: license_system
  question: In West Virginia, how many points accumulated on your driving record within
    a two-year period will result in a license suspension?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: If you accumulate 12 or more points on your driving record, your license
    will be suspended.
- id: 8
  category: license_system
  question: If a student under age 18 drops out of school or has excessive unexcused
    absences, what happens to their WV driving privileges?
  choices:
    A: Nothing, as long as they have a license
    B: Their license or permit will be suspended
    C: They must pay a $500 fine
    D: They are restricted to driving only to work
  answer: B
  explanation: West Virginia law requires students under 18 to maintain school eligibility
    (enrollment and attendance) to keep their driving privileges.
- id: 9
  category: license_system
  question: What is the minimum vision requirement to obtain a West Virginia driver's
    license without restrictions?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Applicants must have at least 20/40 vision in at least one eye to pass
    the vision screening without corrective lens restrictions.
- id: 10
  category: license_system
  question: How many days do you have to notify the WV DMV of a change of address?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: West Virginia law requires you to notify the DMV of an address change
    within 20 days.
- id: 11
  category: license_system
  question: Which of the following is a requirement for a Level 2 Intermediate License
    holder to graduate to a Level 3 License?
  choices:
    A: Must be at least 17 years old
    B: Must have held Level 2 for at least one year
    C: Must have no convictions for 12 months
    D: All of the above
  answer: D
  explanation: To get a Level 3 license, you must be 17, have held Level 2 for 12
    months, and have remained conviction-free for those 12 months.
- id: 12
  category: license_system
  question: What is the Blood Alcohol Concentration (BAC) limit for a driver under
    the age of 21 in West Virginia?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: West Virginia has a 'Zero Tolerance' law for minors, setting the BAC
    limit at 0.02% for drivers under 21.
- id: 13
  category: license_system
  question: When applying for a West Virginia permit or license, how many documents
    are required to prove WV residency?
  choices:
    A: One
    B: Two
    C: Three
    D: None, if you have a birth certificate
  answer: B
  explanation: Applicants must provide two documents to prove West Virginia residency
    (e.g., utility bills, bank statements).
- id: 14
  category: license_system
  question: If you fail the West Virginia knowledge test, how long must you wait before
    you can take it again?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 14 days
  answer: C
  explanation: If you fail the knowledge test, you must wait at least 7 days (one
    week) before retesting.
- id: 15
  category: license_system
  question: Which of the following is prohibited for Level 1 and Level 2 drivers under
    the WV GDL system?
  choices:
    A: Using a hands-free cell phone
    B: Using a handheld cell phone
    C: Texting while driving
    D: All of the above
  answer: D
  explanation: Under West Virginia law, GDL drivers are prohibited from using any
    wireless communication device (handheld or hands-free) while operating a motor
    vehicle.
- id: 16
  category: license_system
  question: New residents to West Virginia who possess a valid driver's license from
    another state must apply for a West Virginia license within how many days of establishing
    residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: According to the West Virginia Driver's Licensing Handbook, new residents
    must transfer their out-of-state license to a West Virginia license within 30
    days of establishing residency.
- id: 17
  category: license_system
  question: 'In West Virginia, a standard driver''s license for operating a regular
    passenger vehicle is classified as a:'
  choices:
    A: Class A license
    B: Class D license
    C: Class E license
    D: Class G license
  answer: C
  explanation: A Class E license is the standard graduation license for West Virginia
    residents 18 and older, or those who have completed the GDL requirements, to operate
    non-commercial vehicles.
- id: 18
  category: license_system
  question: Under the West Virginia GDL system, a Level 2 Intermediate License holder
    is prohibited from driving between what hours, unless for specific employment
    or school reasons?
  choices:
    A: 11:00 PM to 4:00 AM
    B: 10:00 PM to 5:00 AM
    C: Midnight to 6:00 AM
    D: 9:00 PM to 5:00 AM
  answer: B
  explanation: Level 2 Intermediate License holders in WV are restricted from driving
    between 10:00 PM and 5:00 AM unless they are traveling for school-sanctioned activities,
    religious activities, or employment.
- id: 19
  category: license_system
  question: What are the minimum liability insurance coverage limits required for
    a motor vehicle registered in West Virginia?
  choices:
    A: 15/30/10 ($15k bodily injury per person, $30k per accident, $10k property damage)
    B: 20/40/15 ($20k bodily injury per person, $40k per accident, $15k property damage)
    C: 25/50/25 ($25k bodily injury per person, $50k per accident, $25k property damage)
    D: 50/100/50 ($50k bodily injury per person, $100k per accident, $50k property
      damage)
  answer: C
  explanation: West Virginia law requires minimum liability coverage of $25,000 for
    one person in one accident, $50,000 for two or more persons in one accident, and
    $25,000 for property damage.
- id: 20
  category: license_system
  question: 'Under West Virginia''s ''Implied Consent'' law, if you are arrested for
    DUI and refuse to submit to a chemical breath test, your license will be revoked
    for at least:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: By driving on WV roads, you give consent to chemical testing. Refusal
    to take the secondary breath test results in an automatic license revocation for
    a period of one year.
- id: 21
  category: license_system
  question: A West Virginia Level 1 Instructional Permit is valid for how long before
    it expires?
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 2 years
  answer: B
  explanation: A Level 1 Instructional Permit in West Virginia is valid for a period
    of 180 days and is not renewable.
- id: 22
  category: license_system
  question: In the West Virginia point system, how many points are assessed against
    your driving record for 'Reckless Driving'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Reckless driving is considered a serious offense in West Virginia and
    carries a penalty of 6 points on the driver's record.
- id: 23
  category: license_system
  question: West Virginia drivers may have their total point count reduced by 3 points
    if they complete which of the following?
  choices:
    A: A vehicle maintenance course
    B: An approved defensive driving course
    C: One year of driving without a ticket
    D: A community service program
  answer: B
  explanation: Drivers who have accumulated points may complete an approved 8-hour
    defensive driving course once every 12 months to remove 3 points from their record.
- id: 24
  category: license_system
  question: To be eligible for a Level 3 Full Class E License, a West Virginia driver
    must be at least how old?
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 21 years old
  answer: B
  explanation: Under the GDL system, a driver must be at least 17 years old and have
    held a Level 2 license for at least 12 months without any violations to graduate
    to a Level 3 license.
- id: 25
  category: license_system
  question: If you fail the West Virginia Road Skills Test (driving test), how long
    must you wait before you are permitted to retake it for the first time?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 14 days
  answer: C
  explanation: If an applicant fails the road skills test, they must wait a minimum
    of 7 days before they are eligible to attempt the test again.
- id: 26
  category: license_system
  question: 'If you legally change your name through marriage or court order, you
    must notify the West Virginia DMV and apply for a corrected license within:'
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: West Virginia law requires drivers to notify the DMV of a legal name
    change within 30 days.
- id: 27
  category: license_system
  question: A West Virginia 'Real ID' compliant license is distinguished from a non-compliant
    license by what feature?
  choices:
    A: A blue background
    B: A gold star in the upper right corner
    C: A holographic state seal
    D: A red 'Under 21' banner
  answer: B
  explanation: Real ID compliant licenses in West Virginia feature a gold star in
    the upper right-hand corner, indicating they meet federal security standards for
    boarding aircraft and entering federal facilities.
- id: 28
  category: license_system
  question: To progress from a Level 2 Intermediate License to a Level 3 License,
    the driver must have remained conviction-free for how many months immediately
    preceding the application?
  choices:
    A: 6 months
    B: 9 months
    C: 12 months
    D: 18 months
  answer: C
  explanation: A Level 2 driver must hold the license for at least 12 months and remain
    conviction-free for those 12 months before they can graduate to Level 3.
- id: 29
  category: license_system
  question: What is the standard reinstatement fee for a West Virginia driver's license
    that has been suspended for points or safety-related reasons?
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: B
  explanation: The standard fee to reinstate a West Virginia driver's license after
    a suspension (non-DUI related) is $50.
- id: 30
  category: license_system
  question: When applying for an original West Virginia driver's license, which of
    the following is a required document to prove your identity?
  choices:
    A: A library card
    B: A credit card with a photo
    C: A certified birth certificate
    D: A utility bill
  answer: C
  explanation: A certified birth certificate is one of the primary documents required
    by the WV DMV to prove identity and legal presence for an original license application.
- id: 31
  category: driver_testing
  question: The West Virginia knowledge test consists of 25 multiple-choice questions.
    What is the minimum number of questions you must answer correctly to pass?
  choices:
    A: '15'
    B: '17'
    C: '19'
    D: '21'
  answer: C
  explanation: According to the West Virginia Driver's Licensing Handbook, applicants
    must achieve a score of at least 76%, which is 19 out of 25 questions correct.
- id: 32
  category: driver_testing
  question: During the West Virginia road skills test, which of the following actions
    will result in an immediate failure?
  choices:
    A: Failing to use a turn signal once
    B: Striking a curb or sidewalk
    C: Adjusting the mirrors before starting
    D: Driving with both hands on the wheel
  answer: B
  explanation: In West Virginia, striking a curb, sidewalk, or another vehicle during
    the road test results in an automatic and immediate failure.
- id: 33
  category: driver_testing
  question: How often must a motor vehicle registered in West Virginia pass a safety
    inspection at an official state inspection station?
  choices:
    A: Every 6 months
    B: Every 12 months
    C: Every 24 months
    D: Only when the vehicle is sold
  answer: B
  explanation: West Virginia law requires all registered vehicles to undergo a safety
    inspection every 12 months.
- id: 34
  category: driver_testing
  question: According to the West Virginia Driver's Handbook, you may not park within
    how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: B
  explanation: West Virginia law prohibits parking within 15 feet of a fire hydrant.
- id: 35
  category: driver_testing
  question: In West Virginia, what is the minimum fine for a first-offense conviction
    of littering from a motor vehicle?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: A first-offense littering conviction in West Virginia carries a minimum
    fine of $100 and a maximum of $1,000.
- id: 36
  category: driver_testing
  question: 'West Virginia law requires drivers to use headlights whenever visibility
    is less than:'
  choices:
    A: 200 feet
    B: 400 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Headlights must be used in West Virginia during nighttime, during fog/smoke/rain,
    or whenever visibility is less than 500 feet.
- id: 37
  category: driver_testing
  question: If you are convicted of 'Passing a Stopped School Bus' in West Virginia,
    how many points will be added to your driving record?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Passing a stopped school bus with its red lights flashing is a major
    violation in WV and results in 6 points.
- id: 38
  category: driver_testing
  question: In West Virginia, when parallel parking on a level street, your right-hand
    wheels must be within how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: The West Virginia Driver's Handbook states that when parallel parked,
    your tires must be within 18 inches of the curb.
- id: 39
  category: driver_testing
  question: When driving at night, West Virginia law requires you to dim your high-beam
    headlights when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: You must dim your high beams to low beams when an oncoming vehicle
    is within 500 feet.
- id: 40
  category: driver_testing
  question: 'In West Virginia, you must dim your high-beam headlights when following
    another vehicle from behind within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: A
  explanation: West Virginia law requires drivers to switch to low beams when following
    another vehicle within 200 feet.
- id: 41
  category: driver_testing
  question: 'Under West Virginia law, you must notify the police immediately if you
    are involved in a crash that results in property damage of at least:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Any crash resulting in injury, death, or total property damage of $500
    or more must be reported to the nearest police department.
- id: 42
  category: driver_testing
  question: In West Virginia, you are not allowed to park within how many feet of
    a crosswalk at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: West Virginia law prohibits parking within 20 feet of a crosswalk at
    an intersection.
- id: 43
  category: driver_testing
  question: 'West Virginia law requires that the service brake on a vehicle be capable
    of stopping the car from a speed of 20 mph within a distance of:'
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: According to the West Virginia Driver's Handbook, the service brake
    must be able to stop the vehicle within 30 feet when traveling at 20 mph.
- id: 44
  category: driver_testing
  question: In West Virginia, how many points are assessed against your driving record
    for speeding 11 to 15 miles per hour over the posted limit?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: B
  explanation: The West Virginia point system assigns 3 points for speeding 11-15
    mph over the limit. Speeding 1-10 mph over results in 2 points, and 16 mph or
    more over results in 6 points.
- id: 45
  category: driver_testing
  question: Under West Virginia law, how many points are added to your driving record
    for a conviction of reckless driving?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Reckless driving is considered a serious offense in West Virginia and
    results in 6 points being added to the driver's record.
- id: 46
  category: driver_testing
  question: West Virginia law requires that all motor vehicles registered in the state
    undergo a safety inspection how often?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: West Virginia requires an annual (once a year) safety inspection for
    all motor vehicles registered in the state to ensure they are in safe operating
    condition.
- id: 47
  category: driver_testing
  question: When following another vehicle at night in West Virginia, you must dim
    your high-beam headlights when you are within how many feet of the vehicle ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: Drivers in West Virginia must switch to low beams when following another
    vehicle within 200 feet to avoid blinding the driver ahead through their mirrors.
- id: 48
  category: driver_testing
  question: 'According to the West Virginia Driver''s Handbook, you must use your
    headlights whenever you use your windshield wipers due to inclement weather. This
    is known as the:'
  choices:
    A: Wiper-Light Law
    B: Clear Vision Act
    C: Safety Visibility Rule
    D: Inclement Weather Mandate
  answer: A
  explanation: West Virginia law requires that if your windshield wipers are in use
    due to rain, snow, or fog, your headlights must also be turned on. This is commonly
    referred to as the 'Wiper-Light Law'.
- id: 49
  category: driver_testing
  question: In West Virginia, a driver must signal their intention to turn at least
    how many feet before making the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: West Virginia law requires drivers to give a continuous signal for
    at least 100 feet before turning or changing lanes.
- id: 50
  category: driver_testing
  question: In West Virginia, it is illegal to park within how many feet of a fire
    hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: West Virginia law prohibits parking a vehicle within 15 feet of a fire
    hydrant.
- id: 51
  category: driver_testing
  question: When parking near an intersection in West Virginia, you must be at least
    how many feet away from a crosswalk?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Under West Virginia traffic laws, you are not permitted to park within
    20 feet of a crosswalk at an intersection.
- id: 52
  category: driver_testing
  question: In West Virginia, if you are involved in a traffic accident that results
    in total property damage of ____ or more, you must immediately contact law enforcement.
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $1,500
  answer: B
  explanation: West Virginia law requires that any accident resulting in injury, death,
    or total property damage of $500 or more must be reported to the nearest police
    department or the State Police.
- id: 53
  category: driver_testing
  question: Under West Virginia's 'Move Over' law, what must a driver do when approaching
    an authorized emergency vehicle with flashing lights parked on the side of a multi-lane
    highway?
  choices:
    A: Maintain speed but honk the horn
    B: Stop completely until signaled to pass
    C: Move to a non-adjacent lane if safe to do so, or slow down significantly
    D: Speed up to pass the area quickly
  answer: C
  explanation: West Virginia's Move Over law requires drivers to move into a lane
    not adjacent to the emergency vehicle if possible. If changing lanes is unsafe,
    the driver must slow down and proceed with caution.
- id: 54
  category: driver_testing
  question: In West Virginia, children under what age must be properly secured in
    a federally approved child passenger restraint system?
  choices:
    A: Under 4 years old
    B: Under 6 years old
    C: Under 8 years old
    D: Under 10 years old
  answer: C
  explanation: West Virginia law requires that any child under the age of eight (8)
    must be properly secured in a child passenger restraint system while being transported
    in a motor vehicle.
- id: 55
  category: driver_responsibility
  question: In West Virginia, you must file a written accident report (SR-13) with
    the DMV if an accident results in property damage exceeding what amount?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $1,500
  answer: C
  explanation: According to the West Virginia Driver's Licensing Handbook, any accident
    resulting in bodily injury, death, or total property damage to an extent of $1,000
    or more must be reported to the DMV.
- id: 56
  category: driver_responsibility
  question: A West Virginia driver who accumulates points on their record may have
    3 points removed by doing which of the following?
  choices:
    A: Driving for one year without a ticket
    B: Completing an approved defensive driving course
    C: Paying a double fine for the last infraction
    D: Writing a letter of appeal to the DMV Commissioner
  answer: B
  explanation: The WV DMV allows drivers to complete an approved 8-hour defensive
    driving course to remove 3 points from their record, provided they have not used
    this option in the last 12 months.
- id: 57
  category: driver_responsibility
  question: In West Virginia, what is the point penalty for failing to yield the right-of-way
    to an emergency vehicle?
  choices:
    A: 2 points
    B: 3 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Failure to yield to an emergency vehicle in West Virginia results in
    3 points being assessed against your driver's license.
- id: 58
  category: driver_responsibility
  question: If a West Virginia driver is convicted of 'Hit and Run' (leaving the scene
    of an accident), how many points are assessed?
  choices:
    A: 3 points
    B: 5 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Leaving the scene of an accident (Hit and Run) is a major violation
    in West Virginia and carries a 6-point penalty.
- id: 59
  category: driver_responsibility
  question: When a vehicle is sold in West Virginia, what must the seller do with
    the license plate?
  choices:
    A: Leave it on the vehicle for the new owner
    B: Destroy it immediately
    C: Remove it and keep it or return it to the DMV
    D: Give it to the local police department
  answer: C
  explanation: In West Virginia, the license plate belongs to the owner, not the vehicle.
    When a vehicle is sold, the seller must remove the plate and may transfer it to
    another vehicle they own or return it to the DMV.
- id: 60
  category: driver_responsibility
  question: What is the maximum speed limit on rural interstate highways in West Virginia,
    unless otherwise posted?
  choices:
    A: 55 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: While some specific sections may vary, the standard maximum speed limit
    for rural interstates in West Virginia is 70 mph.
- id: 61
  category: driver_responsibility
  question: If your West Virginia driver's license is revoked for a DUI, you may be
    required to install what device to regain driving privileges?
  choices:
    A: A speed governor
    B: An Ignition Interlock Device (IID)
    C: A GPS tracking unit
    D: An emergency brake lock
  answer: B
  explanation: West Virginia utilizes the Motor Vehicle Alcohol Test and Lock Program,
    which requires the installation of an Ignition Interlock Device for those convicted
    of DUI to regain limited or full driving privileges.
- id: 62
  category: driver_responsibility
  question: How many points are assessed for speeding 15 mph or more over the posted
    limit in West Virginia?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: C
  explanation: Speeding 15 mph or more over the limit in West Virginia results in
    5 points being added to your driving record.
- id: 63
  category: driver_responsibility
  question: In West Virginia, if you are involved in an accident, you are required
    by law to provide your name, address, and what other information to the other
    parties involved?
  choices:
    A: Social Security Number
    B: Registration number and Insurance information
    C: Employer's contact information
    D: A copy of your birth certificate
  answer: B
  explanation: WV law requires drivers involved in an accident to exchange their name,
    address, vehicle registration number, and insurance information with others involved.
- id: 64
  category: driver_responsibility
  question: What is the point penalty for 'Failing to Observe a Stop Sign' in West
    Virginia?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Disregarding a stop sign or a traffic control signal in West Virginia
    results in 3 points being assessed against your driving record.
- id: 65
  category: driver_responsibility
  question: If a West Virginia driver is convicted of a first-offense 'No Insurance'
    violation, what is the mandatory license suspension period?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: Until proof of insurance is provided and a reinstatement fee is paid
  answer: D
  explanation: For a first offense of driving without insurance, the driver's license
    is suspended until the driver provides proof of insurance and pays the required
    reinstatement fee.
- id: 66
  category: driver_responsibility
  question: According to West Virginia law, a child must be secured in a child passenger
    restraint system (car seat or booster) until they reach what age or height?
  choices:
    A: Age 6 or 4 feet tall
    B: Age 8 or 4 feet 9 inches tall
    C: Age 10 or 5 feet tall
    D: Age 12 or 4 feet 11 inches tall
  answer: B
  explanation: West Virginia law requires children under the age of 8 to be properly
    secured in a child passenger restraint system. If the child is younger than 8
    but at least 4'9" tall, a standard seat belt is sufficient.
- id: 67
  category: driver_responsibility
  question: When approaching a stationary emergency vehicle with flashing lights on
    a multi-lane highway in West Virginia, what does the 'Move Over' law require you
    to do?
  choices:
    A: Stop completely until the vehicle leaves
    B: Maintain speed but honk your horn
    C: Move to a non-adjacent lane if safe, or slow down significantly if changing
      lanes is not possible
    D: Speed up to pass the area as quickly as possible
  answer: C
  explanation: West Virginia's Move Over law requires drivers to move to a lane not
    adjacent to the emergency vehicle if safe to do so. If a lane change is not possible,
    the driver must slow down and proceed with caution.
- id: 68
  category: driver_responsibility
  question: What is the penalty for a first-offense conviction of passing a school
    bus that has its red lights flashing and stop arm extended in West Virginia?
  choices:
    A: A $50 fine only
    B: A 30-day license suspension and 2 points
    C: A minimum 60-day license suspension and a fine of $500 to $1,000
    D: Permanent revocation of driving privileges
  answer: C
  explanation: Passing a stopped school bus is a serious violation in WV. A first
    offense results in a fine of $500 to $1,000 and a mandatory 60-day driver's license
    suspension.
- id: 69
  category: driver_responsibility
  question: When you purchase a vehicle from an individual in West Virginia, you must
    title and register it within how many days to avoid a late penalty?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: West Virginia law requires that vehicle titles be transferred and registered
    within 60 days of the purchase date to avoid a late titling fee.
- id: 70
  category: driver_responsibility
  question: 'In West Virginia, it is illegal to leave a motor vehicle unattended without
    first:'
  choices:
    A: Turning off the engine and removing the ignition key
    B: Leaving the windows cracked for ventilation
    C: Setting the alarm system
    D: Placing a 'For Sale' sign in the window
  answer: A
  explanation: WV Code §17C-14-1 states that no person driving or in charge of a motor
    vehicle shall permit it to stand unattended without first stopping the engine,
    locking the ignition, and removing the key.
- id: 71
  category: driver_responsibility
  question: What is the name of the official form required in West Virginia to prove
    you have the minimum required liability insurance?
  choices:
    A: Form SR-22
    B: Form WV-1
    C: Form ID-44
    D: Form insurance-101
  answer: B
  explanation: The WV-1 is the Certificate of Insurance form that serves as official
    proof of financial responsibility in West Virginia.
- id: 72
  category: driver_responsibility
  question: 'In West Virginia, if you are convicted of driving under the influence
    (DUI) with a minor child in the vehicle, the offense is classified as:'
  choices:
    A: A simple traffic infraction
    B: A misdemeanor with a mandatory jail sentence of 2 days to 12 months
    C: A felony with a 5-year prison sentence
    D: An offense that does not carry extra penalties
  answer: B
  explanation: DUI with a minor in the vehicle is a specific misdemeanor in West Virginia
    that carries a mandatory jail term of 48 hours to one year and a fine.
- id: 73
  category: driver_responsibility
  question: If a West Virginia driver is involved in an accident and the police do
    not investigate, how many days does the driver have to file a report with the
    DMV?
  choices:
    A: 24 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: If a crash is not investigated by a law enforcement officer and results
    in injury, death, or property damage over $1,000, the driver must file a report
    with the DMV within 10 days.
- id: 74
  category: safe_driving_rules
  question: When planning to turn, West Virginia law requires you to signal your intention
    at least how many feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: You must signal your intention to turn at least 100 feet before making
    the turn to give other drivers enough warning.
- id: 75
  category: safe_driving_rules
  question: Under West Virginia law, when are you required to use your headlights
    in relation to windshield wipers?
  choices:
    A: Only when wipers are on high speed
    B: Only during nighttime rain
    C: Whenever windshield wipers are in use due to inclement weather
    D: Only when visibility is less than 100 feet
  answer: C
  explanation: West Virginia law requires that headlights must be turned on whenever
    windshield wipers are in use due to rain, snow, sleet, or other unfavorable atmospheric
    conditions.
- id: 76
  category: safe_driving_rules
  question: What is the recommended following distance for a passenger vehicle traveling
    in good weather conditions in West Virginia?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The West Virginia Driver's Manual recommends a following distance of
    at least 3 seconds behind the vehicle in front of you.
- id: 77
  category: safe_driving_rules
  question: In West Virginia, passing is prohibited within how many feet of an intersection,
    railroad crossing, bridge, viaduct, or tunnel?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: According to West Virginia traffic laws, you may not drive on the left
    side of the roadway when approaching within 100 feet of any intersection, railroad
    grade crossing, bridge, viaduct, or tunnel.
- id: 78
  category: safe_driving_rules
  question: When driving at night in West Virginia, you must dim your high beams when
    an oncoming vehicle is within how many feet?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: West Virginia law requires you to dim your high beams when an oncoming
    vehicle is within 500 feet.
- id: 79
  category: safe_driving_rules
  question: In West Virginia, if you are on a highway divided by a median or physical
    barrier, do you have to stop for a school bus approaching from the opposite direction
    with red lights flashing?
  choices:
    A: Yes, you must always stop for a school bus
    B: No, you do not need to stop if there is a median or barrier
    C: Yes, but only if the bus driver signals you to stop
    D: No, but you must slow down to 15 mph
  answer: B
  explanation: In West Virginia, the driver of a vehicle upon a highway with separate
    roadways (divided by a median or barrier) need not stop upon meeting or passing
    a school bus which is on a different roadway.
- id: 80
  category: safe_driving_rules
  question: In West Virginia, what happens to the fine for speeding in a highway work
    zone when workers are present?
  choices:
    A: The fine is waived for first offenses
    B: The fine is doubled
    C: The fine is tripled
    D: The fine remains the same but points are doubled
  answer: B
  explanation: West Virginia law mandates that fines for speeding are doubled in work
    zones when workers are present.
- id: 81
  category: safe_driving_rules
  question: When parking your vehicle on a public road in West Virginia, how far must
    you be from a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: West Virginia law prohibits parking within 15 feet of a fire hydrant.
- id: 82
  category: safe_driving_rules
  question: In West Virginia, you are prohibited from parking within how many feet
    of a stop sign, flashing beacon, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Per West Virginia Code §17C-13-3, you may not park within 30 feet of
    any flashing beacon, stop sign, or traffic control signal located at the side
    of a roadway.
- id: 83
  category: safe_driving_rules
  question: In West Virginia, you may not pass another vehicle when you are within
    how many feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 75 feet
    C: 100 feet
    D: 200 feet
  answer: C
  explanation: West Virginia law prohibits passing when approaching within 100 feet
    of or traversing any intersection or railroad grade crossing.
- id: 84
  category: safe_driving_rules
  question: Under the West Virginia DMV point system, how many points are assessed
    for speeding in a school zone?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: D
  explanation: Speeding in a school zone is considered a serious offense in West Virginia
    and results in 6 points being added to your driving record.
- id: 85
  category: safe_driving_rules
  question: When a school bus is stopped on a four-lane highway with its red lights
    flashing and stop arm extended, which drivers must stop?
  choices:
    A: Only drivers following the bus
    B: Only drivers in the lane next to the bus
    C: Drivers in all lanes and both directions, unless there is a physical median/barrier
    D: No one is required to stop on a four-lane highway
  answer: C
  explanation: In West Virginia, you must stop for a school bus from either direction
    on any road unless it is a divided highway with a physical barrier or median strip.
- id: 86
  category: safe_driving_rules
  question: 'In West Virginia, a driver is considered to be ''Aggravated DUI'' if
    their Blood Alcohol Concentration (BAC) is at or above:'
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: West Virginia law defines Aggravated DUI as operating a motor vehicle
    with a BAC of 0.15% or higher, which carries stiffer penalties than a standard
    DUI.
- id: 87
  category: safe_driving_rules
  question: 'To maintain a safe following distance, the West Virginia Driver''s Handbook
    recommends using the:'
  choices:
    A: One-second rule
    B: Two-second rule
    C: Three-second rule
    D: Four-second rule
  answer: C
  explanation: The West Virginia Driver's Handbook recommends the 'three-second rule'
    to ensure a safe following distance behind the vehicle in front of you.
- id: 88
  category: safe_driving_rules
  question: 'When parking a vehicle headed uphill on a two-way street with a curb,
    you should turn your front wheels:'
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the right
  answer: B
  explanation: When parking uphill with a curb, turn your wheels away from the curb
    (to the left) so that if the vehicle rolls, it will hit the curb and stop.
- id: 89
  category: safe_driving_rules
  question: 'West Virginia''s ''Move Over'' law requires drivers approaching an authorized
    emergency vehicle with flashing lights to:'
  choices:
    A: Stop immediately in the lane of travel
    B: Speed up to pass the vehicle quickly
    C: Move to a non-adjacent lane or slow down significantly if changing lanes is
      unsafe
    D: Only move over if the emergency vehicle is moving
  answer: C
  explanation: West Virginia Code §17C-14-9a requires drivers to yield the right-of-way
    by moving to a lane not adjacent to the emergency vehicle, or if that is not possible,
    to slow down and proceed with caution.
- id: 90
  category: safe_driving_rules
  question: 'In West Virginia, if you are caught speeding in a highway construction
    zone while workers are present, the fine is:'
  choices:
    A: Increased by $50
    B: Doubled
    C: Tripled
    D: Waived for first-time offenders
  answer: B
  explanation: Under West Virginia law, fines for speeding are doubled in work zones
    when workers are present.
- id: 91
  category: defensive_driving
  question: According to the West Virginia Driver's Licensing Handbook, what is the
    recommended following distance behind the vehicle in front of you under ideal
    conditions?
  choices:
    A: One car length for every 10 mph
    B: Two seconds
    C: Three to four seconds
    D: Five seconds
  answer: C
  explanation: West Virginia recommends a following distance of at least three to
    four seconds to allow enough time to react to hazards.
- id: 92
  category: defensive_driving
  question: In West Virginia, at what speed can hydroplaning begin as your tires lose
    contact with the road surface during heavy rain?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: At 25 mph
    D: Only when using cruise control
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph. In a heavy rain,
    your tires can lose all contact with the road at 55 mph.
- id: 93
  category: defensive_driving
  question: 'To avoid last-minute braking or the need to turn suddenly, West Virginia
    defensive driving rules suggest you should look down the road at least:'
  choices:
    A: 5 seconds ahead
    B: 10 to 15 seconds ahead
    C: 20 to 30 seconds ahead
    D: One city block only
  answer: B
  explanation: Scanning 10 to 15 seconds ahead allows you to see hazards early and
    adjust your speed or position safely.
- id: 94
  category: defensive_driving
  question: When driving in heavy fog in West Virginia, which lights should you use
    to ensure maximum visibility and safety?
  choices:
    A: High beam headlights
    B: Parking lights only
    C: Low beam headlights
    D: Emergency flashers
  answer: C
  explanation: Low beams should be used in fog. High beams reflect off the fog and
    cause glare, making it harder to see.
- id: 95
  category: defensive_driving
  question: Under West Virginia law, what is the fine for a first offense of using
    a handheld cell phone or texting while driving?
  choices:
    A: A verbal warning only
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: The fine for a first offense of using a handheld wireless communication
    device while driving in West Virginia is $100.
- id: 96
  category: defensive_driving
  question: Roads are most slippery in West Virginia during which of the following
    conditions?
  choices:
    A: After it has been raining for several hours
    B: Just after it starts to rain
    C: When the temperature is above 90 degrees
    D: During a heavy downpour
  answer: B
  explanation: Roads are most slippery just after it starts to rain because the water
    mixes with oil and dust on the road surface to create a slick film.
- id: 97
  category: defensive_driving
  question: 'If your vehicle is equipped with Anti-lock Braking System (ABS) and you
    need to stop quickly in an emergency, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure to the brake pedal
    C: Lightly tap the brakes
    D: Shift to neutral and use the emergency brake
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. Pumping the brakes
    is unnecessary and can deactivate the ABS system.
- id: 98
  category: defensive_driving
  question: 'When following a motorcycle in West Virginia, you should increase your
    following distance because:'
  choices:
    A: Motorcycles have a shorter stopping distance than cars
    B: Motorcycles are faster than cars
    C: Motorcycles are legally required to have more space
    D: Motorcycles always travel below the speed limit
  answer: A
  explanation: Motorcycles can stop much more quickly than larger vehicles; therefore,
    you should increase your following distance to avoid a rear-end collision.
- id: 99
  category: defensive_driving
  question: 'In West Virginia, state law requires you to turn on your headlights whenever
    you are using your windshield wipers due to inclement weather. This is often referred
    to as:'
  choices:
    A: The Visibility Act
    B: The Wipers On, Lights On law
    C: The Weather Safety Rule
    D: The Inclement Condition Mandate
  answer: B
  explanation: WV Code §17C-15-2 requires motorists to turn on headlights whenever
    windshield wipers are in use due to rain, snow, or sleet.
- id: 100
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning in West Virginia
    traffic, how far ahead should you scan the road?
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 25 seconds
    D: 30 seconds
  answer: B
  explanation: The WV Driver's Handbook advises scanning 10 to 15 seconds ahead to
    identify potential hazards early.
- id: 101
  category: defensive_driving
  question: At what speed can hydroplaning (tires losing contact with the road surface)
    begin on wet West Virginia roads?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Exactly 45 mph
    D: Only during heavy downpours at 65 mph
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph, and at 55 mph, tires
    may lose all contact with the road.
- id: 102
  category: defensive_driving
  question: When driving on slippery roads (snow or ice) in West Virginia, how should
    you adjust your following distance?
  choices:
    A: Keep the standard 3-second distance
    B: Increase it to at least 6 seconds or more
    C: Decrease it to 1 second to stay in the tracks of the car ahead
    D: Following distance does not matter if you have winter tires
  answer: B
  explanation: In adverse conditions like snow or ice, you should double or triple
    your following distance to allow for increased stopping time.
- id: 103
  category: defensive_driving
  question: 'In West Virginia, you must use your headlights from:'
  choices:
    A: One hour after sunset to one hour before sunrise
    B: Sunset to sunrise
    C: 8:00 PM to 6:00 AM
    D: Dusk to dawn only
  answer: B
  explanation: West Virginia law requires headlights to be on from sunset to sunrise
    and whenever visibility is less than 500 feet.
- id: 104
  category: defensive_driving
  question: When passing a bicycle traveling in the same direction on a West Virginia
    roadway, what is the minimum distance you must maintain between your vehicle and
    the bicycle?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 5 feet
  answer: C
  explanation: West Virginia law requires motorists to leave a safe distance of not
    less than three feet when passing a bicycle.
- id: 105
  category: defensive_driving
  question: 'When approaching a railroad crossing in West Virginia with lowered gates
    or flashing lights, you must stop your vehicle within:'
  choices:
    A: 5 to 10 feet from the nearest rail
    B: 15 to 50 feet from the nearest rail
    C: 50 to 100 feet from the nearest rail
    D: Exactly 25 feet from the nearest rail
  answer: B
  explanation: WV Code §17C-12-1 states you must stop between 15 and 50 feet from
    the nearest rail at a railroad crossing.
- id: 106
  category: alcohol_drugs_health
  question: In West Virginia, what is the maximum fine for a first-offense DUI with
    a Blood Alcohol Concentration (BAC) between .08 and .15?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,500
  answer: B
  explanation: For a first-offense DUI in West Virginia where the BAC is at least
    .08 but less than .15, the fine ranges from $100 to $500, plus court costs.
- id: 107
  category: alcohol_drugs_health
  question: 'In West Virginia, an ''Aggravated DUI'' is defined as operating a vehicle
    with a Blood Alcohol Concentration (BAC) of at least:'
  choices:
    A: 0.10%
    B: 0.12%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: West Virginia law defines an Aggravated DUI as having a BAC of 0.15%
    or higher, which carries stiffer penalties than a standard DUI.
- id: 108
  category: alcohol_drugs_health
  question: What is the mandatory minimum jail sentence for a first-offense 'Aggravated
    DUI' (BAC of .15 or higher) in West Virginia?
  choices:
    A: 24 hours
    B: 48 hours
    C: 10 days
    D: 30 days
  answer: B
  explanation: A first-offense Aggravated DUI in West Virginia requires a mandatory
    minimum jail term of 48 hours, and up to six months.
- id: 109
  category: alcohol_drugs_health
  question: 'Under West Virginia''s Zero Tolerance law, a driver under 21 who is convicted
    of driving with a BAC of .02 or more but less than .08 will have their license
    revoked for:'
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: B
  explanation: A first-offense Zero Tolerance violation for a driver under 21 results
    in a license revocation for 60 days.
- id: 110
  category: alcohol_drugs_health
  question: In West Virginia, if you are convicted of DUI while transporting a person
    under the age of 16, it is considered 'Child Endangerment.' What is the minimum
    jail sentence?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 1 week
  answer: B
  explanation: DUI with a minor in the vehicle (Child Endangerment) carries a mandatory
    minimum jail sentence of 48 hours and a maximum of 12 months.
- id: 111
  category: alcohol_drugs_health
  question: West Virginia's 'Test and Lock' program refers to which of the following?
  choices:
    A: A mandatory drug testing program for high school students
    B: An ignition interlock program for DUI offenders
    C: A vehicle anti-theft registration system
    D: The process for testing brakes during a state inspection
  answer: B
  explanation: The 'Test and Lock' program is West Virginia's Ignition Interlock Program,
    which allows DUI offenders to drive during their revocation period if they install
    a breath-testing device in their car.
- id: 112
  category: alcohol_drugs_health
  question: In West Virginia, what is the BAC limit for a driver operating a Commercial
    Motor Vehicle (CMV)?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Commercial drivers in West Virginia are considered legally impaired
    if their BAC is 0.04% or higher.
- id: 113
  category: alcohol_drugs_health
  question: 'If you are convicted of a second DUI offense within a 10-year period
    in West Virginia, your driver''s license will be revoked for:'
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: 10 years
  answer: D
  explanation: A second DUI offense within 10 years in West Virginia results in a
    10-year license revocation, though participation in the Interlock program may
    provide earlier driving privileges.
- id: 114
  category: alcohol_drugs_health
  question: 'In West Virginia, if you are caught driving while your license is revoked
    for DUI, the mandatory minimum jail sentence for a first offense is:'
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 6 months
  answer: B
  explanation: Driving on a license revoked for DUI is a serious offense in West Virginia,
    carrying a mandatory minimum jail sentence of 30 days.
- id: 115
  category: alcohol_drugs_health
  question: According to the West Virginia Driver's Manual, what is the only way to
    reduce the amount of alcohol in your system?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Allowing time to pass
  answer: D
  explanation: Only time allows the body to process and eliminate alcohol. Coffee,
    showers, and exercise do not lower BAC.
- id: 116
  category: alcohol_drugs_health
  question: In West Virginia, if a driver has a medical condition such as epilepsy,
    they must generally be seizure-free for how long before they can be licensed to
    drive?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: West Virginia typically requires a driver with a seizure disorder to
    be seizure-free for 6 months and provide a medical report from a physician.
- id: 117
  category: alcohol_drugs_health
  question: What happens if you are convicted of a DUI in another state while holding
    a West Virginia driver's license?
  choices:
    A: Nothing; West Virginia only tracks in-state violations
    B: The conviction will be reported to WV and your license will be revoked as if
      it happened in WV
    C: You will only have to pay a fine to West Virginia
    D: Your license will be suspended for exactly 10 days
  answer: B
  explanation: West Virginia participates in the Driver License Compact; out-of-state
    DUI convictions are reported back to the home state and result in the same penalties
    as if they occurred in West Virginia.
- id: 118
  category: alcohol_drugs_health
  question: Which of the following is true regarding prescription drugs and driving
    in West Virginia?
  choices:
    A: You cannot be arrested for DUI if the drug was legally prescribed
    B: Prescription drugs are only dangerous if mixed with alcohol
    C: You can be convicted of DUI if a prescription drug impairs your ability to
      drive safely
    D: Only 'Schedule I' drugs can result in a DUI charge
  answer: C
  explanation: In West Virginia, a driver can be charged with DUI for being under
    the influence of any controlled substance or drug, including legal prescriptions,
    if it impairs their driving.
- id: 119
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' mentioned in driver education regarding
    alcohol and drugs?
  choices:
    A: The body processing alcohol faster when drugs are present
    B: The combined effect of alcohol and drugs being greater than the sum of their
      individual effects
    C: The ability of drugs to cancel out the effects of alcohol
    D: A specific type of roadside sobriety test
  answer: B
  explanation: The synergistic effect occurs when alcohol and drugs are taken together,
    causing much greater impairment than either substance would alone.
- id: 120
  category: alcohol_drugs_health
  question: 'In West Virginia, if you are involved in a fatal crash and a law enforcement
    officer has reasonable grounds to believe you were driving under the influence:'
  choices:
    A: You can choose to take the test 24 hours later
    B: You are required to submit to a blood test under implied consent
    C: You only have to take a breath test, never a blood test
    D: You cannot be tested without a written confession
  answer: B
  explanation: Under West Virginia's implied consent laws, if there is a fatality
    and reasonable grounds for DUI, you must submit to chemical testing, which may
    include a blood test.
- id: 121
  category: alcohol_drugs_health
  question: In West Virginia, what is the maximum fine for a first-offense DUI with
    a BAC of less than 0.15%?
  choices:
    A: Up to $100
    B: Up to $500
    C: Up to $1,000
    D: Up to $2,500
  answer: B
  explanation: A first-offense non-aggravated DUI (BAC < 0.15%) in West Virginia carries
    a fine ranging from $100 to $500, plus court costs.
- id: 122
  category: alcohol_drugs_health
  question: Who is responsible for the costs associated with the West Virginia Motor
    Vehicle Alcohol Test and Lock Program (Interlock)?
  choices:
    A: The West Virginia DMV
    B: The county where the offense occurred
    C: The driver/offender
    D: The driver's insurance company
  answer: C
  explanation: The driver is responsible for all costs related to the Alcohol Test
    and Lock Program, including installation, monthly monitoring fees, and removal.
- id: 123
  category: alcohol_drugs_health
  question: 'In West Virginia, if a driver is convicted of a DUI that causes ''serious
    bodily injury'' to another person, the offense is classified as a:'
  choices:
    A: Minor traffic infraction
    B: Simple misdemeanor
    C: Felony
    D: Administrative violation only
  answer: C
  explanation: DUI resulting in serious bodily injury is a felony in West Virginia,
    punishable by 2 to 10 years in a state correctional facility and significant fines.
- id: 124
  category: alcohol_drugs_health
  question: 'West Virginia''s ''Open Container'' law prohibits the possession of an
    open alcoholic beverage container in:'
  choices:
    A: The trunk only
    B: The passenger area of any motor vehicle on a public highway
    C: Commercial vehicles only
    D: Vehicles driven by persons under 21 only
  answer: B
  explanation: West Virginia law prohibits the possession of any open alcoholic beverage
    container in the passenger area of a motor vehicle located on a public highway
    or right-of-way.
- id: 125
  category: alcohol_drugs_health
  question: What is the only effective way to reduce your Blood Alcohol Concentration
    (BAC) before driving?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Allowing time to pass
  answer: D
  explanation: Only time allows the body to metabolize alcohol. Coffee, showers, and
    exercise do not speed up the process of lowering BAC.
- id: 126
  category: alcohol_drugs_health
  question: If you are convicted of a second DUI offense in West Virginia within a
    10-year period, what is the mandatory minimum jail sentence?
  choices:
    A: 24 hours
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: A second DUI offense within 10 years in West Virginia is a misdemeanor
    and carries a mandatory jail term of 6 months to 1 year.
- id: 127
  category: alcohol_drugs_health
  question: 'In West Virginia, if you have a medical condition that causes a loss
    of consciousness (such as epilepsy), you may be required to:'
  choices:
    A: Surrender your license permanently
    B: Drive only during daylight hours
    C: Be seizure-free for a specific period and provide a medical report
    D: Only drive with a licensed nurse in the vehicle
  answer: C
  explanation: Drivers with conditions like epilepsy must generally be seizure-free
    for a period (often 6 months to 1 year) and submit medical reports from their
    physician to the DMV for review.
- id: 128
  category: alcohol_drugs_health
  question: Which of the following is a symptom of driving under the influence of
    marijuana in West Virginia?
  choices:
    A: Improved night vision
    B: Faster reaction times
    C: Decreased ability to judge distance and time
    D: Increased alertness
  answer: C
  explanation: Marijuana use impairs driving by slowing reaction times, decreasing
    coordination, and making it difficult to judge distances and the passage of time.
- id: 129
  category: alcohol_drugs_health
  question: 'In West Virginia, if a driver is involved in a fatal accident and there
    is ''reasonable cause'' to believe they were driving under the influence, they
    must:'
  choices:
    A: Be released until a court date is set
    B: Submit to a blood test to determine drug or alcohol content
    C: Only take a breath test if they choose to
    D: Pay a fine on the spot
  answer: B
  explanation: Under WV law, if there is reasonable cause to believe a driver caused
    a death or serious injury while under the influence, a blood test can be required.
- id: 130
  category: penalties_and_points
  question: In West Virginia, what is the point penalty for illegally passing a stopped
    school bus receiving or discharging school children?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 10 points
  answer: C
  explanation: Passing a stopped school bus is a major safety violation in West Virginia
    and carries a penalty of 6 points.
- id: 131
  category: penalties_and_points
  question: By completing a DMV-approved defensive driving course, a West Virginia
    driver can have how many points removed from their record?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: West Virginia allows drivers to deduct 3 points from their accumulated
    total upon the successful completion of an approved defensive driving course,
    provided they have not taken the course for point reduction within the last 12
    months.
- id: 132
  category: penalties_and_points
  question: How long do points remain on a West Virginia driving record from the date
    of the conviction?
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: Permanently
  answer: B
  explanation: In West Virginia, points remain on your driving record for two years
    from the date of the conviction.
- id: 133
  category: penalties_and_points
  question: What is the point penalty for speeding 20 miles per hour or more over
    the posted limit in West Virginia?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: D
  explanation: Speeding 20 mph or more over the posted speed limit results in 6 points
    being added to your West Virginia driving record.
- id: 134
  category: penalties_and_points
  question: How many points are assessed for 'Failure to Yield Right-of-Way' in West
    Virginia?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: A conviction for failure to yield the right-of-way results in 3 points
    on a West Virginia driver's record.
- id: 135
  category: penalties_and_points
  question: In West Virginia, how many points are assessed for 'Following Too Closely'
    (tailgating)?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: A
  explanation: Following too closely, or tailgating, is a 2-point violation in the
    state of West Virginia.
- id: 136
  category: penalties_and_points
  question: What is the point penalty for an 'Improper Lane Change' in West Virginia?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Making an improper lane change results in 2 points being added to your
    West Virginia driving record.
- id: 137
  category: penalties_and_points
  question: Which of the following violations results in the mandatory revocation
    of a West Virginia driver's license?
  choices:
    A: Speeding 5 mph over the limit
    B: Drag racing
    C: Failure to use a turn signal
    D: Parking in a no-parking zone
  answer: B
  explanation: Under West Virginia law, drag racing on public streets or highways
    is a violation that results in the mandatory revocation of the driver's license.
- id: 138
  category: penalties_and_points
  question: 'West Virginia drivers may have their point total reduced by three points
    if they complete an approved Defensive Driving Course, provided they have not
    taken the course for point reduction within the last:'
  choices:
    A: 6 months
    B: 12 months
    C: 24 months
    D: 5 years
  answer: B
  explanation: A driver can receive a 3-point credit on their record by completing
    an approved course, but this credit is only available once every 12 months.
- id: 139
  category: penalties_and_points
  question: How many points are assessed for leaving the scene of an accident involving
    property damage in West Virginia?
  choices:
    A: 3 points
    B: 5 points
    C: 6 points
    D: License is immediately revoked
  answer: C
  explanation: Leaving the scene of an accident involving property damage (Hit and
    Run) results in 6 points on a West Virginia driving record.
- id: 140
  category: penalties_and_points
  question: What is the fine for a first-time violation of the West Virginia mandatory
    seat belt law for an adult driver?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: In West Virginia, the fine for a seat belt violation is $25. It is
    a primary enforcement law, meaning an officer can pull you over solely for not
    wearing a seat belt.
- id: 141
  category: penalties_and_points
  question: A conviction for 'Failure to Yield' in West Virginia results in how many
    points on your driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failure to yield the right-of-way is a 3-point violation under the
    West Virginia DMV point system.
- id: 142
  category: penalties_and_points
  question: 'For a first-offense DUI conviction (non-aggravated) in West Virginia,
    a driver may face a jail sentence of up to:'
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: A first-offense DUI (non-aggravated) in West Virginia carries a potential
    jail sentence of up to 6 months.
- id: 143
  category: penalties_and_points
  question: What is the fine range for failing to properly secure a child in a child
    passenger safety device in West Virginia?
  choices:
    A: $10 to $20
    B: $50 to $100
    C: $100 to $200
    D: $250 to $500
  answer: A
  explanation: West Virginia law mandates child safety seats; failure to comply results
    in a fine of not less than $10 nor more than $20.
- id: 144
  category: penalties_and_points
  question: How many points are assessed for 'Improper Passing' on a West Virginia
    driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Improper passing is categorized as a 3-point violation in the West
    Virginia DMV point system.
- id: 145
  category: penalties_and_points
  question: In West Virginia, speeding 5 to 10 mph over the posted limit results in
    how many points?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: The lowest tier for speeding points in West Virginia is 2 points for
    going 5-10 mph over the limit.
- id: 146
  category: sharing_the_road
  question: In West Virginia, what is the helmet requirement for motorcycle operators
    and passengers?
  choices:
    A: Only required for those under 21 years of age
    B: Only required for the operator, not the passenger
    C: All operators and passengers must wear a DOT-approved helmet regardless of
      age
    D: Helmets are optional if the rider has at least $10,000 in medical insurance
  answer: C
  explanation: West Virginia law requires all motorcycle operators and passengers
    to wear a securely fastened, Department of Transportation (DOT) approved helmet
    at all times.
- id: 147
  category: sharing_the_road
  question: 'When following a large truck, if you cannot see the truck driver''s side-view
    mirrors, you are:'
  choices:
    A: In the truck's 'No-Zone' (blind spot)
    B: In a safe drafting position to save fuel
    C: In the driver's direct line of sight
    D: Following at a safe legal distance
  answer: A
  explanation: The West Virginia Driver's Licensing Handbook states that if you cannot
    see the driver's face in their side-view mirror, they cannot see you, meaning
    you are in their 'No-Zone' or blind spot.
- id: 148
  category: sharing_the_road
  question: In West Virginia, what must a driver do when a pedestrian is crossing
    the street guided by a dog or carrying a white cane (with or without a red tip)?
  choices:
    A: Honk to let them know you are there
    B: Take the right-of-way if you have a green light
    C: Come to a complete stop and take precautions to avoid injury
    D: Slow down and drive around them carefully
  answer: C
  explanation: WV Code §17C-10-7 states that drivers must take all necessary precautions
    to avoid injuring a blind pedestrian. You must come to a complete stop to allow
    them to cross safely.
- id: 149
  category: sharing_the_road
  question: What is the mandatory license suspension period for a first-offense conviction
    of illegally passing a stopped school bus in West Virginia?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 6 months
  answer: B
  explanation: Under West Virginia law, a first-offense conviction for passing a stopped
    school bus results in a mandatory 30-day driver's license suspension.
- id: 150
  category: sharing_the_road
  question: When following a motorcycle, why should a driver allow for a greater following
    distance than when following a car?
  choices:
    A: Motorcycles have a much shorter stopping distance
    B: Motorcycles are allowed to weave in their lane
    C: Motorcycles are lighter and can be blown over by wind
    D: Motorcycles are legally required to be followed by 500 feet
  answer: A
  explanation: Motorcycles can stop much more quickly than larger vehicles. Drivers
    should allow a following distance of at least 3 to 4 seconds to avoid a rear-end
    collision.
- id: 151
  category: sharing_the_road
  question: 'If an emergency vehicle with sirens and flashing lights is approaching
    from behind on a two-lane road, you should:'
  choices:
    A: Stop immediately in your lane
    B: Pull over to the right edge of the road and stop
    C: Speed up to find a place to turn off
    D: Pull over to the left shoulder
  answer: B
  explanation: When an emergency vehicle approaches, West Virginia law requires drivers
    to pull to the right-hand edge or curb of the roadway, clear of any intersection,
    and stop until the vehicle has passed.
- id: 152
  category: sharing_the_road
  question: 'In West Virginia, bicyclists riding on the roadway have:'
  choices:
    A: No legal rights and must yield to all cars
    B: The same rights and responsibilities as motor vehicle drivers
    C: The right to ride on the sidewalk only
    D: The right to ignore stop signs if no cars are present
  answer: B
  explanation: Bicyclists are considered vehicles when on the road and have the same
    rights and are subject to the same duties as the drivers of motor vehicles.
- id: 153
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may:'
  choices:
    A: Turn from the left lane to clear the curb
    B: Swing wide to the left before or during the turn
    C: Stay strictly in the right lane regardless of the curb
    D: Only turn from a designated truck route
  answer: B
  explanation: Large trucks often need to swing wide to the left to make a right turn
    without the rear wheels hitting the curb or other objects. Drivers should never
    try to squeeze between a turning truck and the curb.
- id: 154
  category: sharing_the_road
  question: 'In West Virginia, you are NOT required to stop for a school bus with
    flashing red lights if:'
  choices:
    A: The bus is on the opposite side of a divided highway with a median
    B: The bus is in a school zone
    C: There are at least three lanes of travel
    D: You are traveling at the speed limit
  answer: A
  explanation: Drivers do not need to stop for a school bus if they are traveling
    in the opposite direction on a highway divided by a median or physical barrier.
- id: 155
  category: sharing_the_road
  question: West Virginia's 'Move Over' law applies to which of the following stationary
    vehicles with flashing lights?
  choices:
    A: Police and Fire vehicles only
    B: Ambulances and Tow trucks only
    C: Police, Fire, Ambulance, Tow trucks, and Utility/Maintenance vehicles
    D: Any vehicle with hazard lights on
  answer: C
  explanation: The law was expanded to include not just emergency responders and tow
    trucks, but also highway maintenance and utility service vehicles displaying flashing
    lights.
- id: 156
  category: sharing_the_road
  question: 'When turning left at an intersection in West Virginia, you must yield
    the right-of-way to:'
  choices:
    A: Only other motor vehicles
    B: Pedestrians in the crosswalk and oncoming traffic
    C: Only pedestrians on your right
    D: No one, if you have a green light
  answer: B
  explanation: Drivers turning left must yield to all oncoming traffic and any pedestrians
    crossing in the path of the vehicle.
- id: 157
  category: sharing_the_road
  question: How many motorcycles are permitted to ride abreast (side-by-side) in a
    single lane in West Virginia?
  choices:
    A: None; they must ride in single file
    B: Two
    C: Three
    D: As many as can safely fit
  answer: B
  explanation: West Virginia law permits two motorcycles to ride abreast in a single
    lane, but they are not permitted to ride more than two abreast.
- id: 158
  category: sharing_the_road
  question: 'Under West Virginia law, when passing a bicycle traveling in the same
    direction, a motorist must leave a safe distance of at least:'
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: West Virginia Code §17C-7-3 requires motorists to leave a safe distance
    of not less than three feet when overtaking and passing a bicycle.
- id: 159
  category: sharing_the_road
  question: 'When an emergency vehicle with flashing lights and a siren is approaching
    from either direction, West Virginia drivers must:'
  choices:
    A: Speed up to get out of the way
    B: Stop immediately in the lane of travel
    C: Pull over to the right edge of the curb and stop
    D: Continue driving at the speed limit
  answer: C
  explanation: West Virginia law requires drivers to yield the right-of-way by immediately
    pulling to the right-hand edge or curb of the road, clear of any intersection,
    and stopping until the emergency vehicle has passed.
- id: 160
  category: sharing_the_road
  question: 'When driving near large trucks, the ''No-Zone'' refers to:'
  choices:
    A: The speed limit for trucks
    B: The area where trucks are not allowed to drive
    C: Blind spots around the truck where the driver cannot see you
    D: The cargo area of the truck
  answer: C
  explanation: The 'No-Zone' represents the danger areas around trucks where crashes
    are more likely to occur because the truck driver's vision is restricted in the
    front, back, and sides.
- id: 161
  category: sharing_the_road
  question: In West Virginia, when a school bus is stopped on a divided highway with
    a median strip or physical barrier, which vehicles are required to stop?
  choices:
    A: Vehicles in all lanes
    B: Only vehicles following the bus
    C: Only vehicles approaching from the front
    D: No vehicles are required to stop
  answer: B
  explanation: On a highway with separate roadways (divided by a median or barrier),
    West Virginia law states that drivers on the opposite roadway do not need to stop
    for a school bus.
- id: 162
  category: sharing_the_road
  question: 'In West Virginia, vehicles in a funeral procession must identify themselves
    by using:'
  choices:
    A: Only their turn signals
    B: Headlights and emergency hazard flashers
    C: A special flag on the antenna only
    D: Loud music
  answer: B
  explanation: West Virginia law requires vehicles in a funeral procession to have
    their headlights and emergency hazard flashers turned on to be granted the right-of-way.
- id: 163
  category: sharing_the_road
  question: In West Virginia, is it legal for a motorcycle to 'lane split' (drive
    between rows of stopped or moving vehicles)?
  choices:
    A: Yes, at speeds under 20 mph
    B: Yes, but only on interstate highways
    C: No, it is illegal
    D: Yes, if the motorcycle has its lights on
  answer: C
  explanation: Lane splitting is illegal in West Virginia. Motorcycles are entitled
    to the full use of a lane, and no motor vehicle shall be driven in such a manner
    as to deprive any motorcycle of the full use of a lane.
- id: 164
  category: sharing_the_road
  question: Bicyclists in West Virginia are required by law to have what equipment
    when riding at night?
  choices:
    A: A white lamp on the front and a red reflector on the rear
    B: A bell or horn audible for 500 feet
    C: Neon clothing and a helmet
    D: A blue light on the front and a green light on the rear
  answer: A
  explanation: WV Code §17C-11-7 requires every bicycle used at nighttime to be equipped
    with a lamp on the front emitting a white light visible from 500 feet and a red
    reflector on the rear visible from all distances from 50 feet to 300 feet.
- id: 165
  category: sharing_the_road
  question: 'When a funeral procession is led by a law-enforcement vehicle with flashing
    lights, other drivers must:'
  choices:
    A: Pass the procession on the right
    B: Yield the right-of-way and not drive between vehicles in the procession
    C: Follow the procession closely to get through traffic
    D: Only stop if the procession is at a stop sign
  answer: B
  explanation: In West Virginia, motorists are prohibited from driving between vehicles
    in a funeral procession and must yield the right-of-way to the entire procession
    until it has passed.
- id: 166
  category: sharing_the_road
  question: What does a slow-moving vehicle emblem look like in West Virginia?
  choices:
    A: A square red sign
    B: A circular yellow sign
    C: A triangular orange-red sign with a dark red border
    D: A diamond-shaped blue sign
  answer: C
  explanation: Slow-moving vehicles, such as farm tractors or machinery designed for
    speeds of 25 mph or less, must display a triangular fluorescent orange-red emblem
    with a dark red reflective border.
- id: 167
  category: vehicle_information
  question: According to West Virginia law, how often must a motor vehicle registered
    in the state undergo a safety inspection?
  choices:
    A: Every 6 months
    B: Every 12 months
    C: Every 24 months
    D: Only when the vehicle is sold
  answer: B
  explanation: West Virginia law requires all motor vehicles registered in the state
    to pass an official safety inspection every 12 months (annually).
- id: 168
  category: vehicle_information
  question: 'In West Virginia, you must use your headlights whenever you cannot see
    persons or vehicles at a distance of:'
  choices:
    A: 200 feet
    B: 350 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: West Virginia law requires headlights to be on from sunset to sunrise,
    and at any other time when visibility is limited to less than 500 feet.
- id: 169
  category: vehicle_information
  question: Under West Virginia safety inspection standards, what is the minimum allowable
    tread depth for tires?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: To pass the West Virginia safety inspection, tires must have a tread
    depth of at least 2/32 of an inch.
- id: 170
  category: vehicle_information
  question: West Virginia law states that after-market window tinting on the side
    windows of a passenger car must allow at least what percentage of light to pass
    through?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: West Virginia law (WV Code §17C-15-36a) requires that window tinting
    on the front side windows and rear side windows allow more than 35% light transmission.
- id: 171
  category: vehicle_information
  question: 'Every motor vehicle in West Virginia must be equipped with a horn that
    can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: West Virginia law requires a horn to be audible under normal conditions
    from a distance of not less than 200 feet.
- id: 172
  category: vehicle_information
  question: Which of the following equipment is required on all motor vehicles in
    West Virginia to prevent excessive or unusual noise and annoying smoke?
  choices:
    A: A catalytic converter
    B: A muffler
    C: An air filter
    D: A fuel injector
  answer: B
  explanation: West Virginia law requires every motor vehicle to be equipped with
    a muffler in good working order to prevent excessive noise and smoke.
- id: 173
  category: vehicle_information
  question: 'West Virginia law requires that the rear license plate of a vehicle must
    be illuminated so that it is clearly visible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The rear license plate must be illuminated by a white light so that
    it is legible from a distance of 50 feet to the rear.
- id: 174
  category: vehicle_information
  question: 'In West Virginia, you are required to turn on your headlights whenever
    you are using your:'
  choices:
    A: Hazard lights
    B: Windshield wipers
    C: Defroster
    D: Cruise control
  answer: B
  explanation: West Virginia law requires headlights to be turned on whenever windshield
    wipers are in use due to inclement weather.
- id: 175
  category: vehicle_information
  question: 'West Virginia law requires all motor vehicles to have a rearview mirror
    that provides a view of the highway for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Every motor vehicle must be equipped with a mirror so located as to
    reflect to the driver a view of the highway for a distance of at least 200 feet
    to the rear.
- id: 176
  category: vehicle_information
  question: Under West Virginia law, who is required to wear a safety belt in a passenger
    vehicle?
  choices:
    A: Only the driver
    B: The driver and all front seat passengers
    C: The driver and all passengers under age 18, regardless of seating position
    D: Both B and C
  answer: D
  explanation: In West Virginia, the driver and all front seat passengers must wear
    seat belts. Additionally, all passengers under the age of 18 must be buckled up
    regardless of where they are sitting in the vehicle.
- id: 177
  category: vehicle_information
  question: 'If you are involved in a crash in West Virginia and your vehicle''s equipment
    is damaged, you must ensure it is repaired and re-inspected if the damage affects:'
  choices:
    A: The paint color
    B: The radio operation
    C: The safe operation of the vehicle
    D: The interior upholstery
  answer: C
  explanation: Any damage that affects the safe operation of the vehicle or its compliance
    with safety standards must be repaired to maintain the vehicle's legal status
    on West Virginia roads.
- id: 178
  category: vehicle_information
  question: What is the minimum legal tire tread depth for a passenger vehicle to
    pass inspection in West Virginia?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires are considered unsafe and will fail the West Virginia state inspection
    if the tread depth is less than 2/32 of an inch.
- id: 179
  category: vehicle_information
  question: Between which dates are West Virginia drivers permitted to use studded
    snow tires on state highways?
  choices:
    A: October 1 to March 1
    B: November 1 to April 15
    C: December 1 to March 15
    D: November 15 to April 1
  answer: B
  explanation: In West Virginia, studded snow tires are legal for use only from November
    1st through April 15th.
- id: 180
  category: vehicle_information
  question: 'Under West Virginia law, the horn on your vehicle must be audible from
    a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: Every motor vehicle must be equipped with a horn in good working order
    capable of emitting sound audible under normal conditions from a distance of not
    less than 200 feet.
- id: 181
  category: vehicle_information
  question: In West Virginia, what is the maximum legal window tinting percentage
    allowed for the front side windows of a passenger car?
  choices:
    A: 20% light transmission
    B: 35% light transmission
    C: 50% light transmission
    D: Window tinting is completely prohibited
  answer: B
  explanation: West Virginia law requires that window tinting on the front side windows
    must allow more than 35% of light to pass through.
- id: 182
  category: vehicle_information
  question: 'West Virginia law requires that your vehicle''s turn signals be visible
    from a distance of not less than:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Turn signals must be visible to both the front and the rear from a
    distance of at least 100 feet in normal sunlight.
- id: 183
  category: vehicle_information
  question: 'A tail light or a separate lamp must be maintained to illuminate the
    rear registration plate with a white light so that the plate is clearly legible
    from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: West Virginia equipment regulations require the rear license plate
    to be illuminated and legible from a distance of 50 feet.
- id: 184
  category: vehicle_information
  question: 'When driving in West Virginia, you must turn on your headlights if visibility
    is reduced to less than:'
  choices:
    A: 200 feet
    B: 400 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Headlights must be turned on from sunset to sunrise and at any other
    time when, due to insufficient light or unfavorable atmospheric conditions, persons
    and vehicles on the highway are not clearly discernible at a distance of 500 feet.
- id: 185
  category: vehicle_information
  question: If your vehicle's directional signals (turn signals) are not working,
    you must use hand signals. What is the hand signal for a 'slow or stop'?
  choices:
    A: Arm extended straight out the window
    B: Arm extended upward
    C: Arm extended downward
    D: Arm waved in a circular motion
  answer: C
  explanation: The standard hand signal for slowing or stopping is the left arm extended
    downward out of the window.
- id: 186
  category: signs_and_signals
  question: In West Virginia, what does a flashing red light at an intersection mean?
  choices:
    A: Slow down and proceed with caution
    B: The signal is broken; ignore it
    C: Stop completely and proceed when it is safe to do so
    D: Yield to traffic on the right only
  answer: C
  explanation: 'According to the West Virginia Driver''s Licensing Handbook, a flashing
    red light has the same meaning as a stop sign: you must come to a complete stop
    and proceed only when it is safe.'
- id: 187
  category: signs_and_signals
  question: What is the meaning of a flashing yellow light at a West Virginia intersection?
  choices:
    A: Stop and wait for a green light
    B: Proceed with caution
    C: Speed up to clear the intersection
    D: The light is about to turn red
  answer: B
  explanation: A flashing yellow light means you should slow down and proceed with
    caution, staying alert for potential hazards.
- id: 188
  category: signs_and_signals
  question: When a West Virginia driver extends their left arm and hand straight out
    the window, which signal are they giving?
  choices:
    A: Right turn
    B: Left turn
    C: Stop or slow down
    D: U-turn
  answer: B
  explanation: The standard hand signal for a left turn is the arm and hand extended
    straight out horizontally.
- id: 189
  category: signs_and_signals
  question: 'In West Virginia, a pennant-shaped sign (isosceles triangle pointing
    right) found on the left side of the road indicates:'
  choices:
    A: A school zone
    B: A yield requirement
    C: A no-passing zone
    D: A railroad crossing
  answer: C
  explanation: A pennant-shaped sign is placed on the left side of the road to mark
    the beginning of a no-passing zone.
- id: 190
  category: signs_and_signals
  question: What does a steady yellow 'X' posted over a traffic lane signify in West
    Virginia?
  choices:
    A: The lane is for HOV only
    B: You may use the lane with caution
    C: The lane control signal is about to change to a red 'X'
    D: The lane is closed to all traffic
  answer: C
  explanation: A steady yellow 'X' indicates that the lane control signal is about
    to change to red, and you should prepare to leave that lane safely.
- id: 191
  category: signs_and_signals
  question: On West Virginia roads, what do double solid yellow lines in the center
    of the highway mean?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on the right
    C: Passing is prohibited in both directions
    D: The road is a one-way street
  answer: C
  explanation: Double solid yellow lines indicate that passing is not allowed for
    traffic moving in either direction.
- id: 192
  category: signs_and_signals
  question: What does a round-shaped yellow sign with a black 'X' and the letters
    'RR' indicate?
  choices:
    A: A rest area is ahead
    B: A railroad crossing is ahead
    C: Road repairs are in progress
    D: A rough road surface
  answer: B
  explanation: A round yellow sign with a black 'X' and 'RR' is a warning sign that
    you are approaching a railroad crossing.
- id: 193
  category: signs_and_signals
  question: In West Virginia, what does a steady red arrow signal mean?
  choices:
    A: You may turn after stopping and yielding
    B: You must stop and may not turn in the direction of the arrow
    C: The arrow is for pedestrians only
    D: The lane is closed
  answer: B
  explanation: A steady red arrow means you must stop and cannot make a movement in
    the direction indicated by the arrow until a green signal appears.
- id: 194
  category: signs_and_signals
  question: Which hand signal should a West Virginia driver use to indicate they are
    stopping or slowing down?
  choices:
    A: Arm and hand extended upward
    B: Arm and hand extended straight out
    C: Arm and hand extended downward
    D: Waving the hand out the window
  answer: C
  explanation: To signal stopping or slowing down, the driver should extend their
    arm and hand downward with the palm facing the rear.
- id: 195
  category: signs_and_signals
  question: What is the primary purpose of an orange-colored diamond-shaped sign in
    West Virginia?
  choices:
    A: To guide drivers to state parks
    B: To indicate service facilities like gas and food
    C: To warn of construction or maintenance hazards
    D: To show the distance to the next exit
  answer: C
  explanation: Orange signs are used specifically for construction and maintenance
    work zones to alert drivers to unusual or potentially dangerous conditions.
- id: 196
  category: signs_and_signals
  question: In West Virginia, what does a broken white line on the pavement indicate?
  choices:
    A: Traffic is moving in opposite directions
    B: Traffic is moving in the same direction and passing is allowed
    C: The edge of the roadway
    D: A pedestrian crosswalk
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction;
    drivers may cross these lines to change lanes when safe.
- id: 197
  category: signs_and_signals
  question: 'A pentagon-shaped (five-sided) sign indicates that you are approaching:'
  choices:
    A: A hospital
    B: A school zone or school crossing
    C: A county intersection
    D: A no-passing zone
  answer: B
  explanation: The five-sided pentagon shape is reserved exclusively for school zones
    and school crossings.
- id: 198
  category: signs_and_signals
  question: What does a flashing yellow arrow mean at a West Virginia traffic signal?
  choices:
    A: Stop and wait for a green arrow
    B: You have the right-of-way to turn
    C: Turns are permitted, but you must first yield to oncoming traffic and pedestrians
    D: The signal is malfunctioning
  answer: C
  explanation: A flashing yellow arrow means left turns are allowed, but they are
    'unprotected,' meaning you must yield to oncoming traffic and pedestrians before
    turning.
- id: 199
  category: signs_and_signals
  question: In West Virginia, what color are signs that provide information about
    public recreation and scenic guidance?
  choices:
    A: Blue
    B: Green
    C: Brown
    D: Yellow
  answer: C
  explanation: Brown signs are used to provide guidance to public recreation areas,
    cultural sites, and scenic points of interest.
- id: 200
  category: signs_and_signals
  question: When you see a 'Crossbuck' sign at a railroad crossing in West Virginia,
    you should treat it as which other type of sign?
  choices:
    A: A Stop sign
    B: A Yield sign
    C: A Do Not Enter sign
    D: A Speed Limit sign
  answer: B
  explanation: A railroad crossbuck sign should be treated as a yield sign; you must
    yield to any approaching trains.
- id: 201
  category: signs_and_signals
  question: When using hand signals to indicate a turn in West Virginia, how should
    you signal a right turn?
  choices:
    A: Extend left arm straight out
    B: Extend left arm upward
    C: Extend left arm downward
    D: Extend right arm straight out
  answer: B
  explanation: To signal a right turn using hand signals in West Virginia, the driver
    should extend their left arm out the window and bend it upward at the elbow.
- id: 202
  category: signs_and_signals
  question: 'To signal that you are slowing down or stopping using hand signals, you
    should:'
  choices:
    A: Extend left arm upward
    B: Extend left arm straight out
    C: Extend left arm downward
    D: Wave your hand out the window
  answer: C
  explanation: The hand signal for slowing or stopping is extending the left arm out
    the window and pointing it downward toward the ground.
- id: 203
  category: signs_and_signals
  question: Unless otherwise posted, what is the regulatory speed limit in a West
    Virginia business or residential district?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: Under West Virginia law, the default speed limit in any business or
    residential district is 25 mph unless signs indicate otherwise.
- id: 204
  category: signs_and_signals
  question: 'Double solid yellow lines on a West Virginia roadway mean:'
  choices:
    A: Passing is allowed if the road is clear
    B: Passing is prohibited in both directions
    C: You are on a one-way street
    D: You may pass slow-moving farm equipment only
  answer: B
  explanation: Double solid yellow lines indicate that passing is prohibited for traffic
    moving in both directions.
- id: 205
  category: signs_and_signals
  question: In West Virginia, how many points are assessed against your driver's license
    for failing to yield the right-of-way?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: B
  explanation: According to the West Virginia DMV point system, failure to yield the
    right-of-way results in 3 points being added to your driving record.
- id: 206
  category: signs_and_signals
  question: 'A red and white triangular sign pointing downward is a:'
  choices:
    A: Stop sign
    B: Yield sign
    C: No entry sign
    D: Wrong way sign
  answer: B
  explanation: The downward-pointing triangle is the standard shape and color for
    a yield sign, requiring drivers to slow down and give the right-of-way to other
    traffic.
- id: 207
  category: signs_and_signals
  question: 'Diamond-shaped signs that are orange in color are used in West Virginia
    to indicate:'
  choices:
    A: General warnings about road conditions
    B: Service facilities like gas or food
    C: Construction or maintenance work zones
    D: Public recreation areas
  answer: C
  explanation: Orange diamond-shaped signs are specifically used for temporary traffic
    control in construction and maintenance work zones.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 208
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 209
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 210
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 211
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 212
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 213
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 214
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 215
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 216
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 217
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 218
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 219
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 220
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 221
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 222
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 223
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 224
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 225
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 226
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 227
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 228
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 229
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 230
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 231
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 232
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 233
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 234
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 235
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 236
- image: cross_road.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: A railroad crossing ahead
    B: A crossroad or intersection ahead
    C: A hospital ahead
    D: A pedestrian crossing
  answer: B
  explanation: This sign warns that a crossroad or 4-way intersection is ahead. Watch
    for traffic entering from side roads.
  id: 237
- image: side_road.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A T-intersection ahead
    B: A side road entering from the right
    C: A curve in the road
    D: A dead end
  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles
    entering the highway from the side road.
  id: 238
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Lanes are merging
