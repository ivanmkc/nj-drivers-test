metadata:
  source: West Virginia Driver's Licensing Handbook (transportation.wv.gov)
  total_questions: 407
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: What are the operating hours for the Kanawha City DMV regional office
    on Saturdays?
  choices:
    A: Closed
    B: 8:00 am - 12:00 pm
    C: 8:30 am - 5:00 pm
    D: 8:00 am - 6:00 pm
  answer: B
  explanation: According to the manual, the Kanawha City regional office is open on
    Saturday from 8 am - 12 pm.
- id: 2
  category: license_system
  question: What are the standard operating hours for most DMV regional offices Monday
    through Friday?
  choices:
    A: 8:00 am - 5:00 pm
    B: 8:30 am - 5:00 pm
    C: 9:00 am - 5:00 pm
    D: 8:00 am - 6:00 pm
  answer: B
  explanation: All DMV regional offices are open Monday-Friday 8:30 am - 5:00 pm,
    with the exception of Kanawha City.
- id: 3
  category: driver_responsibility
  question: 'According to the West Virginia driver''s manual, driving a motor vehicle
    is considered a:'
  choices:
    A: Constitutional right
    B: Federal right
    C: Privilege
    D: Requirement for state residency
  answer: C
  explanation: The manual states that driving a motor vehicle in West Virginia is
    a privilege that carries many responsibilities and must be earned.
- id: 4
  category: license_system
  question: A Class E driver's license is generally intended for operators of which
    types of vehicles?
  choices:
    A: Commercial trucks and buses
    B: Motorcycles and mopeds
    C: Regular passenger vehicles, pickup trucks, or vans
    D: Agricultural tractors and heavy machinery
  answer: C
  explanation: The manual states that the majority of applicants for a driver's license
    will be operators of regular passenger vehicles, pickup trucks, or vans (Class
    E).
- id: 5
  category: penalties_and_points
  question: If you do not continue to show you are a safe driver, how long can you
    lose your driving privilege?
  choices:
    A: Only for a short time
    B: Only up to one year
    C: For a short time, a long time, or a lifetime
    D: Until you pay a standard fine
  answer: C
  explanation: The manual states, 'You can lose your driver's license for a short
    time, a long time, or a lifetime' if you do not continue to show you are a safe
    driver.
- id: 6
  category: license_system
  question: How many types of Driver's Licenses and ID Cards are offered in West Virginia
    regarding federal identification?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: 'The Table of Contents indicates there are TWO types of Driver''s Licenses
    & ID Cards: ''Not for Federal Identification'' and ''For Federal Identification''
    (REAL ID).'
- id: 7
  category: license_system
  question: How many proofs of West Virginia residency are required to obtain a driver's
    license?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: 'The Table of Contents lists the requirement: ''You Must Have Two Proofs
    of West Virginia Residency.'''
- id: 8
  category: license_system
  question: When obtaining a driver's license, how many proofs of your Social Security
    Number must you provide?
  choices:
    A: None
    B: One
    C: Two
    D: Three
  answer: B
  explanation: 'The Table of Contents explicitly states: ''You Must Have One Proof
    of Social Security Number.'''
- id: 9
  category: license_system
  question: The Graduated Driver's License (GDL) program is designed for applicants
    in which age group?
  choices:
    A: Ages 14-16
    B: Ages 15-17
    C: Ages 16-18
    D: Ages 18 and over
  answer: B
  explanation: The Table of Contents lists 'Graduated Driver's License (GDL) - Ages
    15-17.'
- id: 10
  category: license_system
  question: At what age can an applicant apply for a Regular Instruction Permit instead
    of a Graduated Driver's License?
  choices:
    A: 15 and over
    B: 16 and over
    C: 18 and over
    D: 21 and over
  answer: C
  explanation: The Table of Contents lists 'Regular Instruction Permit - Ages 18 and
    Over.'
- id: 11
  category: driver_testing
  question: What service is provided by calling the toll-free number 1-866-2MAKE-IT?
  choices:
    A: Free and confidential help with reading skills
    B: Scheduling a driving test
    C: Reporting an impaired driver
    D: Paying unpaid traffic tickets
  answer: A
  explanation: The manual provides the number 1-866-2MAKE-IT (1-866-262-5348) for
    'FREE AND CONFIDENTIAL HELP WITH READING IS OUT THERE'.
- id: 12
  category: penalties_and_points
  question: Which of the following issues shares the same contact phone number (926-2505)
    as the Point System and Student Attendance?
  choices:
    A: Compulsory Insurance
    B: Unpaid Tickets
    C: Driving Records
    D: Driving Under the Influence
  answer: B
  explanation: The manual lists the phone number 926-2505 for the Point System, Student
    Attendance, and Unpaid Tickets.
- id: 13
  category: alcohol_drugs_health
  question: If you need to contact the DMV regarding Driving Under the Influence 'Interlock'
    issues, which number should you call?
  choices:
    A: (304) 926-3801
    B: (304) 926-2505
    C: (304) 926-3952
    D: (304) 926-2507
  answer: D
  explanation: The manual lists (304) 926-2507 as the number for Driving Under the
    Influence 'Interlock'.
- id: 14
  category: license_system
  question: Besides Kanawha City, which other DMV regional office is open on Saturdays
    from 8:00 am to 12:00 pm?
  choices:
    A: Beckley
    B: Martinsburg
    C: Huntington
    D: Morgantown
  answer: B
  explanation: The manual states that the Martinsburg regional office is also open
    on Saturday from 8:00 am - 12:00 pm.
- id: 15
  category: driver_testing
  question: What is the purpose of the driver examination program?
  choices:
    A: To generate revenue for the state highway fund
    B: To provide fundamental education in traffic safety and match driving ability
      with accepted standards
    C: To issue commercial driver's licenses to all applicants
    D: To track the number of vehicles owned by a resident
  answer: B
  explanation: 'The manual states: ''The driver examination program provides fundamental
    education in traffic safety and allows you to match your driving ability with
    accepted standards for safe driving.'''
- id: 16
  category: license_system
  question: According to the manual, what age group does the Graduated Driver’s License
    (GDL) program apply to?
  choices:
    A: Ages 14-16
    B: Ages 15-17
    C: Ages 16-18
    D: Ages 18 and over
  answer: B
  explanation: The manual specifically lists the 'Graduated Driver’s License (GDL)'
    as applying to 'Ages 15-17'.
- id: 17
  category: license_system
  question: What type of permit is issued to applicants who are ages 18 and over?
  choices:
    A: Level 1 GDL
    B: Regular Instruction Permit
    C: Intermediate Driver’s License
    D: Class F License
  answer: B
  explanation: The manual outlines the 'Regular Instruction Permit' for 'Ages 18 and
    Over'.
- id: 18
  category: license_system
  question: Under the Graduated Driver's License program, what is a Level 1 GDL?
  choices:
    A: Intermediate Driver’s License
    B: Full Driver’s License
    C: Instruction Permit
    D: Motorcycle Permit
  answer: C
  explanation: The manual designates the 'Level 1 GDL' as an '(Instruction Permit)'.
- id: 19
  category: license_system
  question: What type of license is a Level 2 GDL?
  choices:
    A: Instruction Permit
    B: Intermediate Driver’s License
    C: Regular Driver’s License
    D: Chauffeur’s License
  answer: B
  explanation: According to the manual, the 'Level 2 GDL' is the '(Intermediate Driver’s
    License)'.
- id: 20
  category: license_system
  question: Which of the following is listed as a specific Driver’s License Designation
    in the manual?
  choices:
    A: Honor Roll Student
    B: Commercial Driver
    C: Veteran’s Designation
    D: Safe Driver
  answer: C
  explanation: Under 'Driver’s License Designations', the manual lists 'Veteran’s
    Designation' alongside Organ Donor and Diabetic/Deaf/Hard of Hearing designations.
- id: 21
  category: license_system
  question: What letter is used to designate a Motorcycle Endorsement or a Motorcycle
    Only Driver’s License?
  choices:
    A: M
    B: F
    C: C
    D: E
  answer: B
  explanation: The manual lists the 'Motorcycle Endorsement (F)' and the 'Motorcycle
    Only Driver’s License (Class F License)'.
- id: 22
  category: driver_responsibility
  question: Which chapter of the manual covers 'Driver Responsibilities'?
  choices:
    A: Chapter I
    B: Chapter II
    C: Chapter III
    D: Chapter IV
  answer: B
  explanation: The manual's table of contents explicitly titles Chapter II as 'Driver
    Responsibilities'.
- id: 23
  category: driver_responsibility
  question: Under which chapter would you find information about 'Compulsory Insurance'?
  choices:
    A: Driving Under The Influence
    B: Examination Procedures And Requirements
    C: Driver Responsibilities
    D: Graduated Driver’s License
  answer: C
  explanation: '''Compulsory Insurance'' is listed as a section under Chapter II:
    Driver Responsibilities.'
- id: 24
  category: alcohol_drugs_health
  question: Which chapter is dedicated to 'Driving Under The Influence'?
  choices:
    A: Chapter I
    B: Chapter II
    C: Chapter III
    D: Chapter IV
  answer: C
  explanation: The manual's table of contents titles Chapter III as 'Driving Under
    The Influence'.
- id: 25
  category: alcohol_drugs_health
  question: 'According to the manual, drowsy driving is categorized as a form of:'
  choices:
    A: Reckless driving
    B: Impaired driving
    C: Aggressive driving
    D: Distracted driving
  answer: B
  explanation: In Chapter III, there is a specific section titled 'Drowsy Driving
    is Impaired Driving'.
- id: 26
  category: penalties_and_points
  question: Where in the manual would you find the 'Point Scale (Chart)'?
  choices:
    A: Chapter I
    B: Chapter II (Driver Responsibilities)
    C: Chapter III (Driving Under The Influence)
    D: Chapter IV (Examination Procedures)
  answer: B
  explanation: 'The ''Point Scale (Chart)'' is listed at the end of Chapter II: Driver
    Responsibilities.'
- id: 27
  category: driver_testing
  question: 'Which of the following topics is covered under Chapter IV: Examination
    Procedures And Requirements?'
  choices:
    A: School Attendance for Minors
    B: Implied Consent and the Chemical Test
    C: Vision Screening
    D: Point System
  answer: C
  explanation: '''Vision Screening'' is listed as one of the first sections under
    Chapter IV: Examination Procedures And Requirements.'
- id: 28
  category: license_system
  question: What specific medical conditions are mentioned as having a Driver’s License
    Designation?
  choices:
    A: Diabetic, Deaf, or Hard of Hearing
    B: Epilepsy or Seizure Disorders
    C: Color Blindness
    D: Heart Conditions
  answer: A
  explanation: Under 'Driver’s License Designations', the manual specifically lists
    'Diabetic, Deaf, or Hard of Hearing'.
- id: 29
  category: driver_responsibility
  question: According to the manual's table of contents, what is required for minors
    regarding their education under Driver Responsibilities?
  choices:
    A: College Enrollment
    B: School Attendance
    C: Driver's Ed Completion
    D: Honor Roll Status
  answer: B
  explanation: Chapter II (Driver Responsibilities) includes a section titled 'School
    Attendance for Minors'.
- id: 30
  category: driver_testing
  question: Which of the following is listed as a component of the Basic Vehicle Control
    Skills Test in the manual?
  choices:
    A: Highway Merging
    B: Parallel Parking
    C: Scoring
    D: Night Driving
  answer: C
  explanation: Under the 'Basic Vehicle Control Skills Test' section, the manual lists
    'Instructions', 'Scoring', and 'Exercises'.
- id: 31
  category: safe_driving_rules
  question: According to the provided text, which section of the West Virginia State
    Code covers Prohibited Parking?
  choices:
    A: §17C-13-3
    B: §17C-13-4
    C: §17C-13-5
    D: §17C-13-6
  answer: A
  explanation: The manual lists 'Prohibited Parking' under §17C-13-3 of the W. Va.
    State Code.
- id: 32
  category: driver_testing
  question: Which of the following turnabouts is listed as an exercise on the driver's
    test?
  choices:
    A: Four-Point Turnabout
    B: U-Turn Turnabout
    C: Three-Point Turnabout
    D: Alleyway Turnabout
  answer: C
  explanation: The 'Three-Point Turnabout' is explicitly listed under the Exercises
    section of the driver's test.
- id: 33
  category: driver_testing
  question: During the Road Test portion of your driver's examination, which of the
    following specific environments will you be tested on?
  choices:
    A: Rural Area Driving
    B: Urban Area Driving
    C: Interstate Driving
    D: Off-road Driving
  answer: B
  explanation: '''Urban Area Driving'' is listed as one of the specific categories
    you will be tested on during the Road Test.'
- id: 34
  category: safe_driving_rules
  question: According to the manual, West Virginia State Code §17C-13-4 regulates
    which of the following parking maneuvers?
  choices:
    A: Prohibited Parking and Parking on Hills
    B: Angle Parking and Parallel Parking
    C: Double Parking and Alley Parking
    D: Interstate Parking and Emergency Parking
  answer: B
  explanation: The text lists both 'Angle Parking' and 'Parallel Parking' with the
    citation (§17C-13-4, W. Va. State Code).
- id: 35
  category: sharing_the_road
  question: The concept of the 'No-Zone' is discussed in the manual in relation to
    sharing the road with which type of vehicle?
  choices:
    A: Motorcycles
    B: Bicycles
    C: Heavy Trucks
    D: Public Buses
  answer: C
  explanation: The 'No-Zone' is listed immediately following 'Sharing the Road with
    Heavy Trucks' and 'Truck Safety DOs & DON'Ts'.
- id: 36
  category: signs_and_signals
  question: Which of the following is classified as a Traffic Control Device in Chapter
    V of the manual?
  choices:
    A: Basic Speed Law
    B: Right-of-Way
    C: Lane Use Control Signals
    D: Following Distance
  answer: C
  explanation: '''Lane Use Control Signals'' are listed under Chapter V: Traffic Control
    Devices, while the others are in Chapter VI.'
- id: 37
  category: signs_and_signals
  question: Which of the following is a specific category of signs discussed in the
    Traffic Control Devices chapter?
  choices:
    A: Diamond & Warning Signs
    B: Octagon & Stop Signs
    C: Triangle & Yield Signs
    D: Round & Railroad Signs
  answer: A
  explanation: '''Diamond & Warning Signs'' is explicitly listed as a section under
    Chapter V: Traffic Control Devices.'
- id: 38
  category: driver_testing
  question: Which of the following maneuvers is evaluated in the 'Exercises' section
    rather than the general 'Road Test' section?
  choices:
    A: Lane Changes
    B: Intersections
    C: Left Side or Right Side Parallel Parking
    D: Curves
  answer: C
  explanation: '''Left Side or Right Side Parallel Parking'' is listed under the Exercises
    section, whereas Lane Changes, Intersections, and Curves are under the Road Test
    section.'
- id: 39
  category: safe_driving_rules
  question: Which of the following topics is covered under 'Traffic Laws And Rules
    Of The Road'?
  choices:
    A: Crosswalk Signals
    B: Right-of-Way
    C: Intersection Flashers
    D: Pavement Markings
  answer: B
  explanation: '''Right-of-Way'' is listed in Chapter VI: Traffic Laws And Rules Of
    The Road, while the others are Traffic Control Devices.'
- id: 40
  category: signs_and_signals
  question: According to the manual's organization, which of the following is considered
    a Traffic Control Device?
  choices:
    A: Pavement Markings
    B: Driving Signals
    C: Headlights
    D: Turning Maneuvers
  answer: A
  explanation: '''Pavement Markings'' are included in Chapter V: Traffic Control Devices.'
- id: 41
  category: sharing_the_road
  question: 'The manual includes specific sections on sharing the road with all of
    the following EXCEPT:'
  choices:
    A: Animal Riders
    B: Joggers
    C: Bicycles
    D: Skateboarders
  answer: D
  explanation: The text lists sharing the road with Animal Riders, Bicycles, and Joggers,
    but does not mention Skateboarders.
- id: 42
  category: safe_driving_rules
  question: Which of the following parking situations has a dedicated section in Chapter
    VI of the manual?
  choices:
    A: Parking at Intersections
    B: Parking on Hills
    C: Parking in Driveways
    D: Parking near Fire Hydrants
  answer: B
  explanation: '''Parking on Hills'' is explicitly listed as a section under Parking
    Maneuvers in Chapter VI.'
- id: 43
  category: signs_and_signals
  question: Which of the following sign shapes/types is specifically listed as a section
    in Chapter V?
  choices:
    A: Square & Rectangular Signs
    B: Circular & Oval Signs
    C: Triangular & Pennant Signs
    D: Hexagon & Octagon Signs
  answer: A
  explanation: '''Square & Rectangular Signs'' is explicitly listed as a section under
    Chapter V: Traffic Control Devices.'
- id: 44
  category: driver_testing
  question: According to the manual, which of the following is a component of the
    'Exercises' section of the driver's test?
  choices:
    A: Forward Two-Point and Reverse Two-Point Turnabout
    B: Highway Merging
    C: Night Driving
    D: Emergency Braking
  answer: A
  explanation: '''Forward Two-Point and Reverse Two-Point Turnabout'' is listed under
    the Exercises section of the driver''s test.'
- id: 45
  category: defensive_driving
  question: According to the Defensive Driving chapter, which of the following is
    classified as a 'Bad Driving Habit'?
  choices:
    A: Laziness
    B: Fatigue
    C: Emotional States
    D: High Winds
  answer: A
  explanation: The manual specifically lists Laziness, Impatience, Inattention, and
    Arrogance and Aggressiveness under 'Bad Driving Habits'.
- id: 46
  category: driver_responsibility
  question: Which of the following is categorized as a 'Driver Condition' that can
    affect your driving?
  choices:
    A: Inattention
    B: Impatience
    C: Fatigue
    D: Arrogance
  answer: C
  explanation: According to the manual, Fatigue and Emotional States are classified
    as 'Driver Conditions', whereas inattention and impatience are considered bad
    driving habits.
- id: 47
  category: safe_driving_rules
  question: When driving on interstates, which of the following maneuvers is specifically
    addressed as a topic of concern in the manual?
  choices:
    A: Parallel parking
    B: U-Turns
    C: Three-point turns
    D: Angle parking
  answer: B
  explanation: The 'Driving On Interstates' chapter specifically includes a section
    on the rules and dangers of making U-Turns on interstates.
- id: 48
  category: vehicle_information
  question: Which of the following vehicle malfunctions is classified as an 'Emergency
    Situation' in the manual?
  choices:
    A: Worn brake pads
    B: Stuck Gas Pedal
    C: Low windshield washer fluid
    D: Squeaking fan belt
  answer: B
  explanation: The manual lists a 'Stuck Gas Pedal' as a specific emergency situation,
    alongside blowouts, brake failure, and steering failure.
- id: 49
  category: defensive_driving
  question: Which of the following weather conditions is explicitly covered in the
    Defensive Driving chapter?
  choices:
    A: Hurricanes
    B: Fog and Smoke
    C: Hail storms
    D: Sun glare
  answer: B
  explanation: The Defensive Driving chapter explicitly covers driving in Rain, Flooding,
    Snow and Sleet, High Winds, and Fog and Smoke.
- id: 50
  category: vehicle_information
  question: If a specific dashboard warning light activates, it is treated as an emergency
    situation. Which light is specifically mentioned in the manual's emergency section?
  choices:
    A: Check Engine Light
    B: Low Tire Pressure Light
    C: Oil Pressure Light
    D: ABS Warning Light
  answer: C
  explanation: The Emergency Situations chapter includes a specific section on what
    to do when the 'Oil Pressure Light Comes On'.
- id: 51
  category: safe_driving_rules
  question: According to the manual, which of the following is a recommended step
    for emergency preparedness?
  choices:
    A: Keeping a Basic Emergency Kit
    B: Installing a roll cage
    C: Carrying a spare engine belt
    D: Keeping a 5-gallon gas can in the trunk
  answer: A
  explanation: The manual's Emergency Preparedness chart specifically recommends carrying
    'The Basic Emergency Kit' and 'The Basic First Aid Kit'.
- id: 52
  category: vehicle_information
  question: What state law regarding vehicle conditions is specifically noted in the
    Defensive Driving chapter?
  choices:
    A: Window Tinting Law
    B: Noise Ordinance Law
    C: State Inspection Law
    D: Emissions Testing Law
  answer: C
  explanation: The manual discusses vehicle conditions specifically in the context
    of the 'State Inspection Law'.
- id: 53
  category: safe_driving_rules
  question: How many 'Simple Steps to Safe and Happy Driving' does the manual outline?
  choices:
    A: '5'
    B: '8'
    C: '10'
    D: '12'
  answer: B
  explanation: The Defensive Driving chapter concludes with a section titled '8 Simple
    Steps to Safe and Happy Driving'.
- id: 54
  category: defensive_driving
  question: Which of the following loss-of-control scenarios is covered under Emergency
    Situations?
  choices:
    A: Hydroplaning
    B: Skids
    C: Fishtailing
    D: Oversteering
  answer: B
  explanation: The manual specifically lists 'Skids' as an emergency situation that
    drivers must know how to handle.
- id: 55
  category: driver_responsibility
  question: What legal protection is discussed in the Emergency Situations chapter
    for those who assist in a crash?
  choices:
    A: The Safe Harbor Law
    B: The First Responder Act
    C: The Good Samaritan Law
    D: The Duty to Rescue Law
  answer: C
  explanation: The 'Good Samaritan Law' is covered in the Emergency Situations chapter
    to address providing first aid and assistance at a crash scene.
- id: 56
  category: safe_driving_rules
  question: Which specific demographic is addressed in the Defensive Driving chapter
    regarding risk reduction?
  choices:
    A: Elderly drivers
    B: Teen drivers
    C: Infants and Toddlers
    D: Pedestrians
  answer: C
  explanation: The Defensive Driving chapter includes a specific section on 'Risk
    Reduction for Infants and Toddlers'.
- id: 57
  category: sharing_the_road
  question: In addition to joggers and children at play, which specific type of vehicle
    does the manual highlight for sharing the road?
  choices:
    A: Public Buses
    B: Delivery Trucks
    C: Agricultural Equipment
    D: Street Sweepers
  answer: A
  explanation: The manual includes a dedicated section on 'Sharing the Road with Public
    Buses'.
- id: 58
  category: safe_driving_rules
  question: Which of the following is listed as a specific hazard when driving on
    interstates?
  choices:
    A: School Zones
    B: Construction Zones
    C: Pedestrian Crossings
    D: Railroad Crossings
  answer: B
  explanation: The 'Driving On Interstates' chapter specifically covers navigating
    'Construction Zones'.
- id: 59
  category: alcohol_drugs_health
  question: What is the legal Blood Alcohol Concentration (BAC) limit for drivers
    under the age of 21 in West Virginia?
  choices:
    A: 0.08% or higher
    B: 0.05% or higher
    C: 0.02% or higher
    D: 0.00%
  answer: C
  explanation: According to the manual, for drivers under the age of 21, it is against
    the law to drive if the BAC is 0.02% or higher.
- id: 60
  category: penalties_and_points
  question: Under West Virginia's Implied Consent Law, what is the penalty for failing
    to submit to a chemical test if charged with driving under the influence?
  choices:
    A: A fine of up to $500
    B: Suspension of driving privileges for at least one (1) year
    C: Mandatory community service
    D: Immediate vehicle impoundment
  answer: B
  explanation: The Implied Consent Law states that failure to submit to a chemical
    test will result in suspension of the driving privilege for at least one (1) year.
- id: 61
  category: penalties_and_points
  question: What is the difference between a license suspension and a license revocation?
  choices:
    A: A suspension is permanent, while a revocation is temporary.
    B: A revocation means privileges are terminated and shall not be renewed, while
      a suspension is a temporary withdrawal.
    C: A suspension applies only to commercial drivers, while a revocation applies
      to all drivers.
    D: There is no difference; both terms mean a temporary loss of driving privileges.
  answer: B
  explanation: Revocation means a driver's license and all privileges are terminated
    and shall not be renewed, whereas a suspension means privileges are temporarily
    withdrawn.
- id: 62
  category: vehicle_information
  question: 'By definition, a moped in West Virginia has a maximum engine displacement
    of 50 cc and a maximum speed of:'
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: A moped is defined as having an independent power source providing
    a maximum of two horsepower, a maximum engine displacement of 50 cc, and a maximum
    speed of 30 mph.
- id: 63
  category: safe_driving_rules
  question: 'Low-speed vehicles may only be operated on public roads and streets where
    the speed limit is no more than:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: Low-speed vehicles may only be operated on private roads, on public
    roads, and streets within the corporate limits of a municipality where the speed
    limit is not more than twenty-five (25) miles per hour.
- id: 64
  category: vehicle_information
  question: 'A Commercial Motor Vehicle is defined as any motor vehicle with a gross
    vehicle weight rating (GVWR) of at least:'
  choices:
    A: 10,001 pounds
    B: 16,000 pounds
    C: 26,001 pounds
    D: 32,000 pounds
  answer: C
  explanation: A Commercial Motor Vehicle is any motor vehicle with a gross vehicle
    weight rating (GVWR) of 26,001 pounds or more.
- id: 65
  category: license_system
  question: Which of the following individuals is exempt from needing a West Virginia
    driver's license?
  choices:
    A: A new resident who has lived in West Virginia for 30 days
    B: A nonresident attending a West Virginia college who has a valid license from
      another state
    C: A 17-year-old high school dropout
    D: Anyone operating a farm tractor on an interstate highway
  answer: B
  explanation: A nonresident who is attending a West Virginia college or university
    and has a valid license from another state is expressly exempt from needing a
    West Virginia driver's license.
- id: 66
  category: license_system
  question: 'West Virginia may deny a driver''s license to any person under the age
    of 18 who is:'
  choices:
    A: Not enrolled in, or graduated from, an approved educational institution
    B: Employed full-time
    C: Enrolled in a Graduated Driver's License program
    D: Not a U.S. citizen
  answer: A
  explanation: A driver's license can be denied to any person who is under the age
    of 18 and not enrolled in, or graduated from, an approved educational institution.
- id: 67
  category: license_system
  question: When you apply for a REAL ID compliant driver's license in West Virginia,
    how do you receive your permanent card?
  choices:
    A: It is printed and handed to you immediately at the DMV.
    B: It arrives at your address via USPS in approximately 10-15 business days.
    C: You must return to the DMV after 30 days to pick it up.
    D: It is emailed to you as a digital barcode.
  answer: B
  explanation: The 'for federal identification use' cards arrive at the applicant's
    address via USPS in approximately 10-15 business days, while a temporary license
    is issued at the DMV.
- id: 68
  category: license_system
  question: What feature on a West Virginia driver's license indicates that it is
    certified as REAL ID compliant for federal identification use?
  choices:
    A: A silver hologram of the state seal
    B: A gold star on the face of the card
    C: A red border around the driver's photo
    D: A magnetic stripe on the front
  answer: B
  explanation: REAL ID compliant cards contain a gold star on the face of the card,
    indicating that the card meets full federal requirements for use at airports and
    other designated federal facilities.
- id: 69
  category: defensive_driving
  question: What is the definition of 'Blind Spots' according to the West Virginia
    driver's manual?
  choices:
    A: Areas on the road where streetlights are broken
    B: Areas on both sides of vehicles where you cannot see without turning your head
    C: Intersections with no traffic signals
    D: The space cushion between your vehicle and the vehicle directly ahead
  answer: B
  explanation: Blind Spots are defined as areas on both sides of vehicles where you
    cannot see without turning your head.
- id: 70
  category: safe_driving_rules
  question: What is the purpose of an acceleration lane?
  choices:
    A: To allow vehicles leaving the highway to reduce speed
    B: To provide a safe area for emergency vehicles to park
    C: To permit drivers to pick up speed before merging with traffic in through lanes
    D: To separate traffic proceeding in opposite directions
  answer: C
  explanation: An acceleration lane is an extra lane on the side of a high-speed highway
    that permits you to enter the highway to pick up speed before merging with traffic
    in through lanes.
- id: 71
  category: vehicle_information
  question: To qualify as an 'Antique Vehicle' in West Virginia, a motor vehicle must
    be over how many years old?
  choices:
    A: 15 years old
    B: 20 years old
    C: 25 years old
    D: 50 years old
  answer: C
  explanation: An Antique Vehicle is defined as a motor vehicle that is over 25 years
    old and is owned solely as a collector's item.
- id: 72
  category: safe_driving_rules
  question: How does the West Virginia driver's manual define 'Right-Of-Way'?
  choices:
    A: The privilege of the immediate use of the highway
    B: The legal speed limit on a divided highway
    C: The unpaved strip of land separating opposite directions of traffic
    D: The portion of the highway exclusive of the berm or shoulder
  answer: A
  explanation: Right-Of-Way is defined as the privilege of the immediate use of the
    highway.
- id: 73
  category: license_system
  question: What does a gold star on a West Virginia driver's license indicate?
  choices:
    A: The driver has a clean driving record.
    B: The card meets full federal requirements for use at airports and federal facilities.
    C: The driver is a commercial vehicle operator.
    D: The card is only valid within the state of West Virginia.
  answer: B
  explanation: A REAL ID/For Federal Use card contains a gold star, indicating that
    the card meets full federal requirements for future use at airports and other
    designated federal facilities.
- id: 74
  category: license_system
  question: How many days does a new resident have to apply for a West Virginia driver's
    license if they want to drive in the state?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: According to the manual, new residents who want to drive in WV must
    apply for a WV driver's license within 30 days.
- id: 75
  category: license_system
  question: If you are transferring a driver's license from another state, your certified
    driving record from the previous state must be dated within how many days of the
    application?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: B
  explanation: Applicants transferring from another state must present a current certified
    driving record from their previous state dated 30 days or less from the date of
    the application.
- id: 76
  category: license_system
  question: Which of the following is NOT considered an acceptable proof of identity
    document?
  choices:
    A: A valid U.S. Passport
    B: A U.S. Military birth certificate
    C: A hospital birth certificate
    D: A Certificate of Naturalization
  answer: C
  explanation: The manual states that U.S. Department of State and U.S. Military birth
    certificates ARE acceptable, but hospital birth certificates and Bureau of Census
    records are NOT acceptable.
- id: 77
  category: license_system
  question: How much is the additional cost for a "For Federal Identification" (REAL
    ID) card?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: B
  explanation: The manual specifies that the REAL ID card costs an additional $10.00.
- id: 78
  category: license_system
  question: How long does it typically take for a REAL ID card to be sent to the applicant's
    address via USPS?
  choices:
    A: 3-5 business days
    B: 5-7 business days
    C: 10-15 business days
    D: 20-30 business days
  answer: C
  explanation: The REAL ID card is sent to the applicant's address via USPS in 10-15
    business days.
- id: 79
  category: license_system
  question: If an applicant is not eligible for a Social Security number, what must
    they provide to the DMV?
  choices:
    A: A valid U.S. Passport
    B: A letter of denial from the SSA or a written self-certification statement
    C: A hospital birth certificate
    D: Two additional proofs of West Virginia residency
  answer: B
  explanation: If an applicant is not eligible for a Social Security card, they must
    provide a letter from the Social Security Administration stating they are not
    eligible or provide a written self-certification statement of ineligibility.
- id: 80
  category: license_system
  question: 'When providing a utility bill as proof of West Virginia residency, the
    document cannot be older than:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: The manual states that any recurring document used for proof of residency,
    such as a utility bill, cannot be more than 90 days old.
- id: 81
  category: license_system
  question: Which of the following is an acceptable document for proof of a legal
    name change?
  choices:
    A: A souvenir marriage document
    B: A Minister's copy of a marriage certificate
    C: A certified divorce decree
    D: A hospital birth certificate
  answer: C
  explanation: Acceptable proof of legal name change documents include a certified
    divorce decree. Souvenir documents and Minister's copies of marriage certificates
    are not acceptable.
- id: 82
  category: license_system
  question: To renew a "Not For Federal Identification" driver's license with NO changes,
    how many proofs of West Virginia residency are required?
  choices:
    A: None
    B: One
    C: Two
    D: Three
  answer: B
  explanation: Renewal applicants for a driver's license or ID card with no changes
    are required to provide one (1) proof of West Virginia residency document.
- id: 83
  category: license_system
  question: Under what condition is an applicant with a previously issued West Virginia
    driver's license considered a "first-time applicant"?
  choices:
    A: If their license has been expired for more than 30 days
    B: If their license has been expired for more than six (6) months
    C: If they are upgrading to a REAL ID
    D: If they have changed their legal name
  answer: B
  explanation: Applicants who have a West Virginia driver's license that has been
    expired for more than six (6) months are considered first-time applicants.
- id: 84
  category: license_system
  question: Can a photocopy of a Wage and Tax Statement (W-2) be used as proof of
    a Social Security number?
  choices:
    A: Yes, if it is less than 90 days old
    B: Yes, if it is notarized
    C: No, photocopies of a W-2 are not acceptable
    D: No, unless accompanied by a utility bill
  answer: C
  explanation: The manual explicitly states under Acceptable Proof of Social Security
    Number that "a photocopy of a W-2 is not acceptable."
- id: 85
  category: license_system
  question: If you are age 50 or over and have gone through at least one WV license
    renewal cycle, what can you submit in lieu of a name change document?
  choices:
    A: A signed statement
    B: A utility bill
    C: A W-2 form
    D: A U.S. Passport
  answer: A
  explanation: If you are age 50 or over, hold a current WV driver's license in the
    name being verified, and have gone through at least one WV license renewal cycle,
    a signed statement may be submitted in lieu of the name change document.
- id: 86
  category: license_system
  question: When applying for a REAL ID (For Federal Identification) card, how many
    proofs of West Virginia residency must you provide?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: All applicants (Renewal, Duplicate, New, Transfers, and Expired) choosing
    a "For Federal Use" (REAL ID) card are required to provide two (2) proofs of WV
    residency documents.
- id: 87
  category: license_system
  question: Are documents with a P.O. Box acceptable as proof of West Virginia residency?
  choices:
    A: Yes, for any applicant
    B: Yes, but only for renewal applicants
    C: No, documents with a P.O. Box are not acceptable
    D: No, unless accompanied by a W-2 form
  answer: C
  explanation: The manual clearly states under Acceptable Proof of West Virginia Residency
    that "Documents with a PO Box are not acceptable."
- id: 88
  category: license_system
  question: If using a West Virginia W-2 form as proof of residency, what is the maximum
    age the document can be?
  choices:
    A: 6 months old
    B: 12 months old
    C: 18 months old
    D: 24 months old
  answer: C
  explanation: According to the manual, a WV W-2 form used as proof of residency cannot
    be more than 18 months old.
- id: 89
  category: license_system
  question: How many forms of West Virginia residency must a new resident provide
    when applying for a driver's license?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: The manual states, 'If you are a new resident in the state you will
    be required to provide two (2) forms of WV residency.'
- id: 90
  category: license_system
  question: How many documents proving West Virginia residency are required for a
    driver's license renewal applicant?
  choices:
    A: One
    B: Two
    C: Three
    D: None
  answer: A
  explanation: The manual specifies that 'All renewal applicants are required to provide
    one (1) document' for proof of WV residency.
- id: 91
  category: license_system
  question: Who is required to provide a valid School Driver Eligibility Certificate
    to perform any driver's license transaction?
  choices:
    A: All first-time applicants
    B: Applicants under the age of 18
    C: Applicants applying for a commercial driver's license
    D: New residents transferring an out-of-state license
  answer: B
  explanation: The manual states, 'A valid School Driver Eligibility Certificate is
    required for an applicant under the age of 18 to perform any driver’s license
    transaction.'
- id: 92
  category: license_system
  question: If an applicant under 18 provides a School Driver Eligibility Certificate
    that lists a PO Box instead of a physical address, what else must they provide?
  choices:
    A: A letter from the US Post Office
    B: A W-2 form in the student's name
    C: Two additional proofs of WV residency in the name of a parent or legal guardian
    D: A certified driving record
  answer: C
  explanation: If the address on the School Driver Eligibility Certificate is a PO
    Box, the applicant is required to provide two (2) additional proofs of WV residency
    in the name of the applicant’s parent or legal guardian.
- id: 93
  category: license_system
  question: If an applicant is under 18 but has already graduated from school, what
    document can be used in place of the School Driver Eligibility Certificate?
  choices:
    A: A birth certificate
    B: A diploma
    C: A W-2 form
    D: A voter's registration card
  answer: B
  explanation: The manual notes, 'If an applicant has already graduated from school
    and has not reached the age of 18, a diploma can be used in place of the School
    Driver Eligibility Certificate.'
- id: 94
  category: driver_responsibility
  question: What is the Problem Driver Point System (PDPS)?
  choices:
    A: A state program that rewards safe drivers with insurance discounts
    B: A national driver registry designed to track violations and suspensions from
      state to state
    C: A written examination required for all new residents
    D: A point system used exclusively for drivers under the age of 18
  answer: B
  explanation: The manual defines the Problem Driver Point System (PDPS) as 'a national
    driver registry designed to track violations and suspensions from state to state.'
- id: 95
  category: penalties_and_points
  question: What will the West Virginia DMV do if they receive notice that you have
    failed to pay a citation issued in another state?
  choices:
    A: Automatically deduct points from your license
    B: Suspend your driver's license after notifying you by certified mail
    C: Issue a warrant for your arrest
    D: Require you to retake the driving skills test
  answer: B
  explanation: West Virginia DMV will suspend your driver’s license if they receive
    notice from another state that you failed to pay a citation, and they will notify
    you by certified mail to give you time to address the matter.
- id: 96
  category: driver_responsibility
  question: If your license is facing suspension due to an unpaid citation in another
    state, whose responsibility is it to provide the DMV with proof that the citation
    has been paid?
  choices:
    A: The out-of-state court
    B: The police officer who issued the citation
    C: The driver
    D: The National Driver Registry
  answer: C
  explanation: The manual states, 'Any unpaid citations are your responsibility. Do
    not expect the court to notify the DMV... you must provide the DMV with proof
    that you have paid the citation.'
- id: 97
  category: license_system
  question: Which of the following combinations of documents must a first-time applicant
    for a driver's license present?
  choices:
    A: One proof of Social Security number, one proof of identity, and two proofs
      of WV residency
    B: Two proofs of identity and one proof of WV residency
    C: One proof of identity, one proof of WV residency, and a W-2 form
    D: Two proofs of Social Security number and one proof of identity
  answer: A
  explanation: Any first-time applicant must present one (1) proof of Social Security
    number document, one (1) proof of identity document, and two (2) proofs of WV
    residency documents.
- id: 98
  category: driver_testing
  question: When transferring a valid, unexpired out-of-state driver's license to
    West Virginia, what tests or courses must the applicant complete?
  choices:
    A: A written knowledge test and a driving skills test
    B: A vision screening and a brief alcohol awareness course
    C: A defensive driving course and a written knowledge test
    D: Only a vision screening
  answer: B
  explanation: To transfer a valid out-of-state license, you are required to pass
    a vision screening, complete a brief alcohol awareness course, and surrender your
    out-of-state driver’s license.
- id: 99
  category: driver_testing
  question: What is required if a new resident applies for a West Virginia driver's
    license but their out-of-state license has expired?
  choices:
    A: They must pay a late fee but are exempt from testing
    B: They must take all examinations required for a first-time applicant
    C: They must wait 30 days before applying
    D: They only need to pass a vision screening
  answer: B
  explanation: If the applicant’s out-of-state driver’s license has expired, the applicant
    is required to take all examinations that are required for a first-time applicant.
- id: 100
  category: license_system
  question: If a new resident wants to waive the testing requirement but cannot provide
    their physical out-of-state driver's license, what must they do?
  choices:
    A: Obtain a certified driving record from the state where they were previously
      licensed
    B: Sign an affidavit stating they lost their license
    C: Provide three additional proofs of WV residency
    D: Take a brief alcohol awareness course
  answer: A
  explanation: A new resident who cannot provide their out-of-state driver’s license
    must obtain a certified driving record from the state or jurisdiction in which
    they were previously licensed in order to waive the testing requirement.
- id: 101
  category: driver_responsibility
  question: How many days do you have to notify the DMV in writing if you change your
    address?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: If you change your address you are required to notify, in writing,
    the DMV within 20 days of the change.
- id: 102
  category: license_system
  question: Before obtaining a driver's license in West Virginia, applicants must
    receive a clearance from which system?
  choices:
    A: The National Highway Traffic Safety Administration (NHTSA)
    B: The Problem Driver Point System (PDPS)
    C: The Federal Motor Carrier Safety Administration (FMCSA)
    D: The Interstate Driver License Compact (IDLC)
  answer: B
  explanation: You will not be licensed in WV until you receive a clearance from the
    Problem Driver Point System (PDPS).
- id: 103
  category: license_system
  question: If your West Virginia driver's license has been expired for six months
    or more, what are you required to do?
  choices:
    A: Pay a late fee of $50
    B: Complete a defensive driving course
    C: Retest by going through the full examination process
    D: Submit a medical clearance form
  answer: C
  explanation: Any person renewing a WV driver's license that has been expired for
    six (6) months or more is required to retest and go through the full examination
    process.
- id: 104
  category: license_system
  question: What format and color-coding is used for driver's licenses issued to applicants
    who are 15 to 17 years old?
  choices:
    A: Horizontal and color-coded red
    B: Vertical and color-coded blue
    C: Horizontal and color-coded blue
    D: Vertical and color-coded red
  answer: D
  explanation: Applicants 15 to 17 years old are issued a driver's license or instruction
    permit that is vertical and color-coded red.
- id: 105
  category: license_system
  question: A vertical driver's license that is color-coded blue indicates the cardholder
    is in which age group?
  choices:
    A: 15 to 17 years old
    B: 18 to 20 years old
    C: 21 to 25 years old
    D: Under 15 years old
  answer: B
  explanation: Applicants 18 to 20 years old are issued a vertical driver's license
    or instruction permit that is color-coded blue.
- id: 106
  category: license_system
  question: How long is a regular Class E instruction permit valid for applicants
    18 and over?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: The regular Class E instruction permit will be valid for a period of
    six (6) months.
- id: 107
  category: safe_driving_rules
  question: When driving with a regular Class E instruction permit, you must be accompanied
    by a licensed driver who is at least what age in the front seat?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: The instruction permit allows you to operate a motor vehicle when a
    licensed driver who is 21 or older occupies the front seat with you.
- id: 108
  category: driver_testing
  question: To qualify for a driver's license in West Virginia, you must have at least
    what vision in one eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: To qualify for a driver's license in WV you must have at least 20/40
    vision in one (1) eye.
- id: 109
  category: safe_driving_rules
  question: Between what hours is a driver with a Level 1 GDL instruction permit allowed
    to drive?
  choices:
    A: 5:00 am and 10:00 pm
    B: 6:00 am and 9:00 pm
    C: 5:00 am and 11:00 pm
    D: 7:00 am and 8:00 pm
  answer: A
  explanation: Level 1 GDL Instruction Permit Requirements state you may only drive
    between the hours of 5:00 am and 10:00 pm.
- id: 110
  category: safe_driving_rules
  question: How many non-family passengers is a Level 1 GDL instruction permit holder
    allowed to have in the vehicle, in addition to the supervising adult?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: C
  explanation: You may only have two (2) additional non-family passengers in addition
    to the supervising, licensed adult driver.
- id: 111
  category: penalties_and_points
  question: How many convictions will result in the revocation of a Level 1 GDL instruction
    permit for 90 days?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Two (2) convictions will result in revocation of your instruction permit
    (for 90 days).
- id: 112
  category: safe_driving_rules
  question: When is a Level 1 GDL instruction permit holder permitted to use a wireless
    communication device while driving?
  choices:
    A: When using a hands-free Bluetooth device
    B: When stopped at a red light
    C: Only when contacting a 9-1-1 system
    D: When communicating with a parent or legal guardian
  answer: C
  explanation: You may not use a wireless communication device while operating a motor
    vehicle, unless the use of the wireless communication device is for contacting
    a 9-1-1 system.
- id: 113
  category: license_system
  question: How long is a School Driver Eligibility Certificate valid from its date
    of issuance during the regular school year?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: The expiration date of the document will be 30 days from the date of
    issuance.
- id: 114
  category: license_system
  question: If you are under the age of 18 and applying for a duplicate driver's license,
    which specific document must you provide?
  choices:
    A: A valid School Driver Eligibility Certificate
    B: A letter of recommendation from a teacher
    C: A signed waiver from a driving instructor
    D: A high school diploma
  answer: A
  explanation: If you are under the age of 18 and are applying for a duplicate driver's
    license, you need a valid School Driver Eligibility Certificate.
- id: 115
  category: driver_testing
  question: What is the fee for each attempt of the knowledge test for a Level 1 GDL?
  choices:
    A: $5.00
    B: $7.50
    C: $10.00
    D: $15.00
  answer: B
  explanation: The fee for a knowledge test is $7.50 for each attempt.
- id: 116
  category: license_system
  question: When does a Level 1 GDL instruction permit expire?
  choices:
    A: On the applicant's 16th birthday
    B: On the applicant's 18th birthday, with a 30-day grace period
    C: Exactly 180 days after it is issued
    D: On the applicant's 21st birthday
  answer: B
  explanation: According to the manual, a Level 1 GDL instruction permit is issued
    up to the applicant's 18th birthday and expires on the 18th birthday, though a
    30-day grace period is allowed to complete the Road Skills Examination.
- id: 117
  category: license_system
  question: How many behind-the-wheel driving hours must be certified on the log sheet
    to apply for a Level 2 GDL intermediate driver's license?
  choices:
    A: 30 hours, including 5 hours at night
    B: 40 hours, including 10 hours at night
    C: 50 hours, including 10 hours at night
    D: 60 hours, including 15 hours at night
  answer: C
  explanation: To be eligible for a Level 2 GDL, you must have a parent or legal guardian
    certification of a minimum of 50 hours behind the wheel, including a minimum of
    10 hours at night, or complete an approved driver's education course.
- id: 118
  category: safe_driving_rules
  question: Between what hours must a Level 2 GDL intermediate driver be accompanied
    by a supervising, licensed adult who is age 21 or older?
  choices:
    A: 9:00 pm and 6:00 am
    B: 10:00 pm and 5:00 am
    C: 11:00 pm and 6:00 am
    D: Midnight and 5:00 am
  answer: B
  explanation: The manual states that a Level 2 GDL intermediate driver's license
    holder must drive with a supervising, licensed adult driver who is age 21 or older
    between the hours of 10:00 pm and 5:00 am.
- id: 119
  category: safe_driving_rules
  question: During the first six months of holding a Level 2 GDL intermediate driver's
    license, what is the restriction regarding passengers?
  choices:
    A: No passengers are allowed in the vehicle at any time.
    B: Only one non-family member under the age of 20 is allowed.
    C: No non-family members under the age of 20 are allowed as passengers.
    D: Up to three non-family members are allowed as long as they wear seatbelts.
  answer: C
  explanation: A Level 2 GDL intermediate driver's license holder may not operate
    a motor vehicle during their first six months with any non-family members under
    the age of 20 as a passenger.
- id: 120
  category: penalties_and_points
  question: What is the penalty for receiving two convictions while holding a Level
    1 GDL instruction permit?
  choices:
    A: A warning letter and a $50 fine
    B: Revocation of your GDL for 30 days
    C: Revocation of your GDL for 90 days
    D: Revocation of your driving privilege until age 18
  answer: C
  explanation: Under a Level 1 GDL instruction permit, two (2) convictions will result
    in the revocation of your GDL for 90 days. After 90 days, you must re-apply and
    retest.
- id: 121
  category: penalties_and_points
  question: What is required of a Level 2 GDL intermediate driver upon their first
    conviction?
  choices:
    A: They must surrender their license for 30 days.
    B: They must enroll in a driver improvement program.
    C: They must pay a $500 fine.
    D: They must retake the road skills test.
  answer: B
  explanation: Level 2 GDL intermediate driver's license holders are required to enroll
    in a driver improvement program upon the first conviction.
- id: 122
  category: safe_driving_rules
  question: Under what circumstance may a driver under the age of 18 use a wireless
    communication device while operating a motor vehicle?
  choices:
    A: When talking to a parent or legal guardian
    B: When using a hands-free Bluetooth device
    C: When stopped at a red light or stop sign
    D: When contacting a 9-1-1 system
  answer: D
  explanation: Drivers under the age of 18 may not use a wireless communication device
    while operating a motor vehicle, unless the cell phone is used for contacting
    a 9-1-1 system.
- id: 123
  category: license_system
  question: How many months of conviction-free driving under a Level 2 GDL are required
    to be eligible for a Level 3 GDL?
  choices:
    A: 6 months
    B: 9 months
    C: 12 months
    D: 18 months
  answer: C
  explanation: To be eligible for a Level 3 GDL, you must have completed 12 months
    of conviction-free driving under a Level 2 GDL and be at least 17 years old.
- id: 124
  category: driver_testing
  question: Who is allowed in the exam room during testing?
  choices:
    A: The applicant and one parent or guardian
    B: Only the applicant taking the test
    C: The applicant and a certified driving instructor
    D: Up to two applicants at a time
  answer: B
  explanation: 'The manual strictly states: "Only the applicant taking the test is
    allowed in the exam room."'
- id: 125
  category: license_system
  question: Under the "Drive for Five" program, in what year will your driver's license
    generally expire?
  choices:
    A: Every four years from the date of issuance
    B: In a year in which your age is divisible by five
    C: On your 21st and 65th birthdays only
    D: Exactly five years from the date you pass your road test
  answer: B
  explanation: Under the "Drive for Five" program, all driver's licenses will expire
    in a year in which your age is divisible by five (for example, age 25, 30, 35,
    40, 45, etc.).
- id: 126
  category: license_system
  question: Where is the explanation of a driver's license restriction code located?
  choices:
    A: On the front of the driver's license
    B: On the back of the driver's license
    C: In the driver's manual only
    D: On the vehicle's registration card
  answer: B
  explanation: The restriction will be indicated on the front of the driver's license
    by a number or letter code, and the explanation of the restriction will appear
    on the back of the driver's license.
- id: 127
  category: license_system
  question: What does restriction code "2" indicate on a driver's license?
  choices:
    A: Artificial Limbs
    B: Automatic Transmission
    C: Corrective Lenses
    D: Daylight Driving Only
  answer: C
  explanation: According to the Driver's License Restrictions chart, code "2" stands
    for Corrective Lenses.
- id: 128
  category: safe_driving_rules
  question: Which of the following is an exception to the rule requiring a supervising
    adult for a Level 2 GDL driver between 10:00 pm and 5:00 am?
  choices:
    A: Returning from a school-sanctioned activity
    B: Driving home from a friend's house
    C: Going to a 24-hour grocery store
    D: Traveling to a family vacation
  answer: A
  explanation: 'Exceptions to the 10:00 pm to 5:00 am supervising adult rule include
    participating in, going to, or returning from: (1) lawful employment; (2) a school-sanctioned
    activity; (3) a religious activity; or (4) an emergency situation.'
- id: 129
  category: penalties_and_points
  question: What happens if a Level 2 GDL driver receives a second conviction for
    a moving violation?
  choices:
    A: They must pay a $100 fine and attend traffic school.
    B: Their driving privilege is revoked until age 18 and they must retest as a first-time
      applicant.
    C: They are demoted to a Level 1 GDL for 6 months.
    D: Their license is suspended for 30 days.
  answer: B
  explanation: 'The manual states: "The second conviction for a moving violation requires
    the revocation of your driving privilege until you are 18 and you will be required
    to retest as a first-time applicant."'
- id: 130
  category: license_system
  question: For new driver's licenses issued after January 1, 2001, on what day does
    the license expire?
  choices:
    A: At the end of the issuance month
    B: On the first day of the new year
    C: On the applicant's birthday
    D: Exactly 5 years from the issue date regardless of birthday
  answer: C
  explanation: New driver's licenses issued after January 1, 2001, expire on the applicant's
    birthday instead of at the end of the month.
- id: 131
  category: license_system
  question: How long is the grace period for driver's licenses expiring on a licensee's
    18th or 21st birthday to obtain the appropriate color license?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: According to the manual, driver's licenses expiring on a licensee's
    18th or 21st birthday will have a 30-day grace period to allow the bearer to obtain
    the appropriate color license.
- id: 132
  category: license_system
  question: How is the renewal fee for a standard driver's license calculated in West
    Virginia?
  choices:
    A: A flat fee of $25.00 every five years
    B: $5.00 per year until your age is divisible by five
    C: $10.00 per year for the length of the license
    D: $2.50 per year until your age is divisible by ten
  answer: B
  explanation: All driver's license renewal fees will be based on the number of years
    you will have a driver's license until your age is divisible by five, at a rate
    of $5.00 per year.
- id: 133
  category: license_system
  question: What is required for an applicant to add a diabetic, deaf, or hard of
    hearing designation to their driver's license?
  choices:
    A: A written request from an immediate family member
    B: Audiologist and/or physician certification
    C: An additional fee of $10.00
    D: A court order
  answer: B
  explanation: Applicants that wish to have diabetic, deaf, or hard of hearing designated
    on their driver's license will need audiologist and/or physician certification
    turned in at the time of application.
- id: 134
  category: penalties_and_points
  question: What is the penalty for failing to provide your driver's license upon
    demand to a law enforcement officer?
  choices:
    A: It is a felony
    B: It is a misdemeanor
    C: Your license is immediately revoked
    D: A mandatory 30-day jail sentence
  answer: B
  explanation: You are required to provide your driver's license upon demand to any
    law enforcement officer. Violation of this requirement is a misdemeanor.
- id: 135
  category: penalties_and_points
  question: If you are arrested for failing to provide your driver's license to an
    officer, how can you avoid a conviction?
  choices:
    A: Pay a $50 fine within 24 hours
    B: Produce a valid license in court or the arresting officer's office
    C: Complete a defensive driving course
    D: Request a hearing with the DMV commissioner
  answer: B
  explanation: You will not be convicted if your driver's license or instructional
    permit is valid at the time of arrest and you can produce it in court or in the
    office of the arresting officer.
- id: 136
  category: license_system
  question: What restrictions apply when riding a motorcycle with a motorcycle instruction
    permit?
  choices:
    A: You may only ride on public roads during daylight hours without passengers
    B: You may ride at any time but cannot carry passengers
    C: You may only ride on private property
    D: You may carry one passenger if they are over 18
  answer: A
  explanation: The motorcycle instruction permit allows you to ride a motorcycle on
    public roads during daylight hours without passengers.
- id: 137
  category: driver_testing
  question: 'To obtain a motorcycle instruction permit, you must pass a 25-question
    knowledge examination with a grade of at least:'
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: In order to obtain a motorcycle instruction permit you must pass a
    25-question motorcycle knowledge examination with a grade of 80% or better.
- id: 138
  category: license_system
  question: How long must you hold a motorcycle instruction permit before you are
    eligible to add a motorcycle endorsement (F) to your driver's license?
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 90 days
  answer: A
  explanation: You must hold your instruction permit for a minimum of seven (7) days
    before you are eligible to add a motorcycle endorsement (F).
- id: 139
  category: driver_testing
  question: How can an applicant have the DMV on-cycle skills test waived when applying
    for a motorcycle endorsement?
  choices:
    A: By holding an instruction permit for 6 months
    B: By successfully passing the Basic Rider Course (BRC)
    C: By paying an additional $10.00 fee
    D: By having a clean driving record for 3 years
  answer: B
  explanation: If an applicant who has held an instruction permit for at least 7 days
    successfully passes the BRC they will be eligible to have the on-cycle skills
    test for the DMV waived.
- id: 140
  category: license_system
  question: What is a limitation of holding a Class F (motorcycle-only) driver's license?
  choices:
    A: You cannot ride on interstate highways
    B: You cannot drive any other type of motor vehicle
    C: You must renew the license every year
    D: You can only ride during daylight hours
  answer: B
  explanation: The Class F driver's license limits the licensee. The bearer of a Class
    F driver's license cannot drive any other type of motor vehicle.
- id: 141
  category: driver_responsibility
  question: In addition to your driver's license, what documents must you keep in
    your vehicle and show to a law enforcement officer if stopped for a moving violation?
  choices:
    A: Your vehicle title and birth certificate
    B: Proof of West Virginia liability insurance and current registration card
    C: A copy of your driving record and insurance policy
    D: Your vehicle's maintenance log and registration card
  answer: B
  explanation: You will need to keep your valid proof of West Virginia liability insurance
    (certificate of insurance) as well as current registration card with you. If stopped
    for a moving violation, you are required to show this proof.
- id: 142
  category: license_system
  question: What is the additional fee required to obtain or renew a "FOR FEDERAL
    IDENTIFICATION" driver's license or identification card?
  choices:
    A: $5.00
    B: $7.50
    C: $10.00
    D: $15.00
  answer: C
  explanation: An additional $10.00 is required to obtain, renew, or obtain a duplicate
    "FOR FEDERAL IDENTIFICATION" driver's license or identification card.
- id: 143
  category: license_system
  question: What must a person under the age of 18 complete before being eligible
    for a motorcycle instruction permit?
  choices:
    A: The Experienced Rider Course (ERC)
    B: The requirements for a Level 2 Intermediate Driver's License or a Class E driver's
      license
    C: 50 hours of supervised driving
    D: A high school driver's education course
  answer: B
  explanation: Any person under the age of 18 must have first completed the requirements
    for a Level 2 Intermediate Driver's License or a class E drivers license before
    being eligible for a motorcycle instruction permit.
- id: 144
  category: license_system
  question: The DMV offers young men the opportunity to register with the U.S. Selective
    Service when applying for a license. What age group does this apply to?
  choices:
    A: Ages 15-26
    B: Ages 16-21
    C: Ages 18-25
    D: Ages 17-30
  answer: A
  explanation: The DMV offers young men ages 15-26 the opportunity to register with
    the U.S. Selective Service when applying for a driver's license, instruction permit,
    or photo ID card.
- id: 145
  category: license_system
  question: If you wish to add or remove the organ donor designation on the face of
    your driver's license, what must you do?
  choices:
    A: Write a letter to the DMV commissioner
    B: Obtain a new driver's license and pay any applicable fees
    C: Update your status online and print a confirmation receipt
    D: Request a free replacement sticker from the DMV
  answer: B
  explanation: In order to add or remove the organ donor designation on the face of
    the driver's license or ID card the applicant must obtain a new driver's license
    and pay any applicable fees.
- id: 146
  category: driver_responsibility
  question: What action will the DMV take if a minor's school reports excessive unexcused
    absences?
  choices:
    A: The minor's license will be permanently revoked.
    B: The minor's license will be restricted to driving only for work, medical, educational,
      religious, and emergency purposes until age 17.
    C: The minor will be required to take an approved defensive driving course.
    D: The minor will receive a $100 fine and three points on their driving record.
  answer: B
  explanation: If a school notifies the DMV of excessive unexcused absences, the DMV
    restricts the minor's license to driving only for work, medical, educational,
    religious, and emergency purposes until age 17, or until a Release of Restriction
    form is presented.
- id: 147
  category: driver_responsibility
  question: Who is authorized to submit information to the DMV regarding an unsafe
    driver?
  choices:
    A: Only law enforcement officers
    B: Only the driver's personal physician
    C: Immediate family members, law enforcement, or physicians
    D: Any licensed driver in the state of West Virginia
  answer: C
  explanation: The manual states that immediate family members, law enforcement (if
    they have had personal observation), or a personal physician may submit information
    to the DMV regarding an unsafe driver.
- id: 148
  category: driver_testing
  question: What is the penalty for refusing to submit to a medical, written, or driving
    re-examination when required by the Commissioner of Motor Vehicles?
  choices:
    A: A $500 fine
    B: Three points added to your driving record
    C: Grounds for suspension or revocation of your driver's license
    D: Immediate impoundment of your vehicle
  answer: C
  explanation: Refusal to submit to a required medical, written, or driving examination
    is grounds for suspension or revocation of your driver's license.
- id: 149
  category: driver_responsibility
  question: Under what circumstances must a crash be reported to law enforcement within
    five days?
  choices:
    A: Any crash resulting in property damage over $500
    B: Any crash resulting in injury, death, or property damage in excess of $1,000
    C: Only crashes involving two or more vehicles
    D: Only crashes occurring on an interstate highway
  answer: B
  explanation: Crashes resulting in injury to, or death of, any person or property
    damage in excess of $1,000 must be reported by the quickest means possible within
    five (5) days.
- id: 150
  category: vehicle_information
  question: What is the minimum amount of West Virginia liability insurance coverage
    required for property damage?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: The minimum amount of coverage provided by law includes $25,000 for
    property damage.
- id: 151
  category: vehicle_information
  question: Which of the following is considered valid proof of insurance when requested
    by an investigating officer?
  choices:
    A: A verbal confirmation from the vehicle owner
    B: A bank statement showing an insurance premium payment
    C: An image displayed on a wireless communication device
    D: A copy of the vehicle's title
  answer: C
  explanation: An image displayed on a wireless communication device, as provided
    in §17D-2A-4, is a valid proof of insurance that can be presented to an investigating
    officer.
- id: 152
  category: penalties_and_points
  question: What is the penalty for filing false or fraudulent insurance information?
  choices:
    A: A 30-day license suspension and a $500 fine
    B: An additional 90-day license suspension, revocation of vehicle registration,
      and possible jail time
    C: A permanent revocation of driving privileges
    D: Six points added to your driving record
  answer: B
  explanation: Filing false or fraudulent insurance information results in an additional
    90-day suspension of your driver's license, revocation of your vehicle registration,
    and possible prosecution carrying a fine up to $1,000 and jail time not to exceed
    one year.
- id: 153
  category: safe_driving_rules
  question: According to statistics, how much does a driver's concentration drop when
    using a wireless communication device?
  choices:
    A: 10 - 15 percent
    B: 20 - 33 percent
    C: 40 - 50 percent
    D: 60 - 75 percent
  answer: B
  explanation: Statistics show that a driver's concentration drops by 20 - 33 percent
    when using a wireless communication device.
- id: 154
  category: penalties_and_points
  question: What is the penalty for a first offense of using an electronic communications
    device without hands-free equipment while driving?
  choices:
    A: $50 fine and 1 point
    B: $100 fine and zero (0) points
    C: $200 fine and 2 points
    D: $300 fine and 3 points
  answer: B
  explanation: Fines and points assessed for a first offense of using an electronic
    communications device are a $100 fine and zero (0) points.
- id: 155
  category: penalties_and_points
  question: How many points are assessed against a driver's record for a third or
    subsequent offense of using a handheld electronic communications device?
  choices:
    A: Zero (0) points
    B: Two (2) points
    C: Three (3) points
    D: Six (6) points
  answer: C
  explanation: A third and subsequent offenses for using an electronic communications
    device result in a $300 fine and three (3) points.
- id: 156
  category: penalties_and_points
  question: How long do points remain on your West Virginia driving record?
  choices:
    A: One (1) year from the conviction date
    B: Two (2) years from the conviction date
    C: Three (3) years from the conviction date
    D: Five (5) years from the conviction date
  answer: B
  explanation: Points remain on your driving record for two (2) years from the conviction
    date.
- id: 157
  category: penalties_and_points
  question: At what point accumulation will the DMV send a driver a letter of caution?
  choices:
    A: 3 points
    B: 6 points
    C: 9 points
    D: 12 points
  answer: B
  explanation: When you have six (6) points or more on your record, the DMV will send
    you a letter of caution, urging you to be careful while driving.
- id: 158
  category: defensive_driving
  question: How can a driver have three points deducted from their driving record?
  choices:
    A: By paying a $100 fee to the DMV
    B: By going one full year without a traffic violation
    C: By completing an approved eight-hour defensive driving class
    D: By retaking the written driving examination
  answer: C
  explanation: You may have three (3) points deducted from your record by completing
    an approved eight (8) hour defensive driving class.
- id: 159
  category: driver_responsibility
  question: What happens if you receive a traffic violation in another state that
    is a member of the Driver License Compact?
  choices:
    A: The violation is ignored by the West Virginia DMV.
    B: You must surrender your West Virginia license and obtain a license in that
      state.
    C: The violation becomes part of your West Virginia driving record and points
      may be assessed.
    D: You will be fined, but points cannot be transferred across state lines.
  answer: C
  explanation: Because West Virginia is a member of the Driver License Compact, traffic
    violations you receive in other states will become part of your West Virginia
    driving record and, if warranted, points will be assessed.
- id: 160
  category: license_system
  question: What is the purpose of the Non-Resident Violator Compact?
  choices:
    A: It allows drivers to ignore traffic tickets received in other states.
    B: It allows drivers to accept traffic citations in member states and continue
      on their way.
    C: It prevents out-of-state drivers from receiving traffic citations.
    D: It requires drivers to pay fines immediately to the police officer.
  answer: B
  explanation: According to the manual, the Non-Resident Violator Compact allows drivers
    to accept traffic citations for certain violations and continue on their way,
    regardless of whether the driver resides in that jurisdiction.
- id: 161
  category: penalties_and_points
  question: According to West Virginia state law, the DMV is required to suspend your
    driver's license if you fail to maintain which of the following?
  choices:
    A: Vehicle insurance
    B: A clean driving record
    C: Child support payment obligations
    D: A valid vehicle registration
  answer: C
  explanation: 'The manual states: ''State law also requires the DMV to suspend your
    driver’s license if you fail to maintain any child support payment obligations.'''
- id: 162
  category: penalties_and_points
  question: What is the penalty for using someone else's driver's license as your
    own or providing false information on your application?
  choices:
    A: A 30-day suspension
    B: A 60-day suspension
    C: A 90-day suspension
    D: A 1-year revocation
  answer: C
  explanation: It is illegal to provide false information or use someone else's license
    as your own. The manual specifies, 'The penalty for these offenses is a 90-day
    suspension.'
- id: 163
  category: penalties_and_points
  question: The DMV must revoke your driver's license if you receive how many convictions
    of reckless driving in a 24-month period?
  choices:
    A: Two (2)
    B: Three (3)
    C: Four (4)
    D: Five (5)
  answer: B
  explanation: The DMV must revoke a driver’s license when it receives a notice of
    final conviction for 'Three (3) convictions of reckless driving in 24 months.'
- id: 164
  category: penalties_and_points
  question: What is the mandatory minimum jail sentence for driving while your driver's
    license is revoked for a DUI?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: The manual states that the penalty for driving while your driver’s
    license is revoked on a DUI is a mandatory minimum jail sentence of 30 days to
    six (6) months.
- id: 165
  category: license_system
  question: How much does it cost to view and purchase a driving record online through
    the DMV Online Services?
  choices:
    A: $5.00
    B: $10.00
    C: $12.50
    D: $15.00
  answer: C
  explanation: Applicants have the ability to view and purchase a driving record online
    for a fee of $12.50.
- id: 166
  category: penalties_and_points
  question: How many points will be added to your driving record for fleeing from
    a police officer?
  choices:
    A: 3 points
    B: 5 points
    C: 6 points
    D: 8 points
  answer: D
  explanation: According to the Point Scale provided in the manual, 'Fleeing from
    an Officer' carries a point value of 8.
- id: 167
  category: penalties_and_points
  question: What is the point value for a conviction of speeding in a school zone?
  choices:
    A: 2 points
    B: 3 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: According to the Point Scale, 'Speeding in a School Zone' carries a
    point value of 6.
- id: 168
  category: safe_driving_rules
  question: Having more than 3 passengers in the front seat of your vehicle will result
    in how many points on your driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: A
  explanation: The Point Scale indicates that having 'More than 3 Passengers in the
    Front Seat' results in 2 points.
- id: 169
  category: alcohol_drugs_health
  question: Which of the following is the only effective way to help someone sober
    up after drinking alcohol?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Getting fresh air
    D: Time
  answer: D
  explanation: The manual notes that physical exercise, black coffee, fresh air, and
    cold showers do not effectively help someone sober up. 'Time is the only sobering
    influence.'
- id: 170
  category: alcohol_drugs_health
  question: 'A 12-ounce can of beer contains the same amount of alcohol as:'
  choices:
    A: A 12-ounce glass of wine
    B: A one-ounce shot of 100-proof whiskey
    C: Two ounces of 80-proof vodka
    D: A six-ounce glass of malt liquor
  answer: B
  explanation: 'The manual states: ''The amount of alcohol in a one-ounce shot of
    100-proof whiskey, six-ounce glass of wine, or a 12-ounce can of beer is the same.'''
- id: 171
  category: alcohol_drugs_health
  question: Under West Virginia's zero tolerance law, what happens if a driver under
    the age of 21 is found with any measurable amount of alcohol in their system?
  choices:
    A: They will receive a warning for the first offense.
    B: They will lose their driver's license.
    C: They will be fined but can keep their license.
    D: They will receive 6 points on their driving record.
  answer: B
  explanation: 'West Virginia has a zero tolerance law for drivers under 21. The manual
    states: ''if you are under the age of 21 and any amount of alcohol is found in
    your system, you will lose your driver’s license.'''
- id: 172
  category: alcohol_drugs_health
  question: In West Virginia, a driver is presumed to be driving under the influence
    if their Blood Alcohol Concentration (BAC) is at or above what level?
  choices:
    A: 0.04 percent
    B: 0.05 percent
    C: 0.08 percent
    D: 0.10 percent
  answer: C
  explanation: 'The manual states: ''If a driver’s BAC is 0.08 percent or more, they
    are presumed to be driving under the influence.'''
- id: 173
  category: alcohol_drugs_health
  question: Under the Implied Consent Law, what is the penalty for refusing to take
    a designated Breathalyzer test when arrested for DUI?
  choices:
    A: A 90-day license suspension
    B: A $500 fine and 30 days in jail
    C: Revocation of your driving privilege for a period of one year up to life
    D: Immediate impoundment of your vehicle
  answer: C
  explanation: If you refuse to take the Breathalyzer, the manual states 'your privilege
    to operate a motor vehicle will be revoked for a period of one (1) year and up
    to life.'
- id: 174
  category: penalties_and_points
  question: 'If you are under the age of 18 and commit a DUI offense, your driver''s
    license will be revoked until you reach the age of 18 or for the applicable statutory
    period, whichever is:'
  choices:
    A: Shorter
    B: Longer
    C: Determined by the arresting officer
    D: Agreed upon by the court
  answer: B
  explanation: If you are under the age of 18, a DUI offense will result in revocation
    of your driver’s license until you reach the age of 18 or for the applicable statutory
    period of revocation or suspension, 'whichever is longer'.
- id: 175
  category: penalties_and_points
  question: If you are under the age of 18, what is the penalty for a DUI offense
    regarding your driver's license?
  choices:
    A: Revocation for exactly 30 days
    B: Revocation until age 18 or the statutory period, whichever is longer
    C: A warning for the first offense
    D: Suspension for 6 months
  answer: B
  explanation: If you are under the age of 18, a DUI offense will result in revocation
    of your driver's license until you reach the age of 18 or for the applicable statutory
    period of revocation or suspension, whichever is longer.
- id: 176
  category: penalties_and_points
  question: What must you complete before you are eligible to reinstate your driving
    privileges after a DUI revocation or suspension?
  choices:
    A: A defensive driving course
    B: A prescribed Safety and Treatment program
    C: 50 hours of community service
    D: A written apology to the DMV
  answer: B
  explanation: Any time your driver's license is revoked or suspended for a DUI, you
    must complete a prescribed Safety and Treatment program before you will be eligible
    to reinstate your driving privileges.
- id: 177
  category: penalties_and_points
  question: What is the minimum revocation period for a first offense under the Zero
    Tolerance law (Under 21 with ANY measurable alcohol)?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: B
  explanation: According to the DUI penalties chart, a 1st Offense for ZERO Tolerance
    (Under 21 with ANY Measurable Alcohol) carries a minimum revocation period of
    30 days.
- id: 178
  category: penalties_and_points
  question: Participation in the Interlock Program is mandatory if a driver's license
    has been revoked for how many DUIs or related offenses within a ten-year period?
  choices:
    A: One or more
    B: Two or more
    C: Three or more
    D: Four or more
  answer: B
  explanation: If the driver has been revoked for two (2) or more DUI's or related
    offenses within a ten-year period, participation in the Interlock Program is mandatory.
- id: 179
  category: alcohol_drugs_health
  question: 'After being awake for 18 hours, your driving skills are comparable to:'
  choices:
    A: A newly licensed teenage driver
    B: Someone driving in heavy rain
    C: Someone under the influence of drugs or alcohol
    D: A driver distracted by a cell phone
  answer: C
  explanation: After being awake for 18 hours (time varies), driving skills are comparable
    to someone under the influence of drugs or alcohol.
- id: 180
  category: defensive_driving
  question: If you feel drowsy while driving, how long of a nap can make a big difference
    in reducing drowsiness?
  choices:
    A: 5 to 10 minutes
    B: 10 to 20 minutes
    C: 30 to 45 minutes
    D: At least 1 hour
  answer: B
  explanation: If you are drowsy, don't drive. Pull over to a safe area as soon as
    you can and take a short nap. As little as 10-20 minutes of sleep can make a big
    difference.
- id: 181
  category: defensive_driving
  question: Which of the following is a sign that you may be drowsy while driving?
  choices:
    A: Checking your mirrors frequently
    B: Difficulty remembering the last few miles driven
    C: Maintaining a consistent speed
    D: Anticipating the actions of other drivers
  answer: B
  explanation: Signs that you are drowsy while driving include difficulty remembering
    the last few miles driven, missing road signs or exits, and yawning.
- id: 182
  category: driver_testing
  question: 'To pass the vision screening without a restriction, your vision must
    be at least:'
  choices:
    A: 20/20 in both eyes
    B: 20/30 in at least one eye
    C: 20/40 or better using both eyes
    D: 20/50 or better using both eyes
  answer: C
  explanation: If your vision is 20/40 or better using both eyes, either with or without
    conventional corrective lenses, and you show no serious visual defect, you will
    pass the vision screening.
- id: 183
  category: driver_testing
  question: Which of the following may NOT be utilized to satisfy the visual acuity
    standards for a driver's license?
  choices:
    A: Contact lenses
    B: Conventional glasses
    C: Bi-optic or telescopic lenses
    D: Prescription sunglasses
  answer: C
  explanation: Special lens arrangements, including but not limited to bi-optic or
    telescopic lenses, may not be utilized to satisfy the visual acuity standards.
- id: 184
  category: driver_testing
  question: How many questions must you answer correctly to pass the automated knowledge
    examination?
  choices:
    A: 15 out of 20
    B: 18 out of 25
    C: 19 out of 25
    D: 20 out of 25
  answer: C
  explanation: The knowledge examination has at least 25 questions. You must answer
    19 out of the 25 questions correctly to pass the test.
- id: 185
  category: driver_testing
  question: What happens if you do not answer a question on the knowledge examination
    within the prescribed time limit?
  choices:
    A: The question is skipped and you get a new one
    B: The question is considered incorrect
    C: The test pauses until you answer
    D: You receive half credit for the question
  answer: B
  explanation: There is a time limit on the test and any questions not answered in
    the prescribed time will be considered incorrect.
- id: 186
  category: driver_testing
  question: Who is required to complete a short DUI awareness course upon passing
    the road skills test?
  choices:
    A: Only drivers under the age of 18
    B: Only drivers who have had a previous DUI
    C: All first-time applicants and out-of-state drivers coming into West Virginia
    D: Only commercial driver's license applicants
  answer: C
  explanation: The DMV requires that all first-time applicants for a driver's license...
    complete a short DUI awareness course. The course must be completed by all out-of-state
    drivers coming into West Virginia.
- id: 187
  category: driver_testing
  question: If your testing vehicle has a minor defect during the vehicle check, what
    might the examiner permit you to do?
  choices:
    A: Continue the examination in another vehicle on the same test date
    B: Have the minor defect corrected and continue the examination
    C: Skip the vehicle check portion of the test
    D: Take the road test anyway without fixing the defect
  answer: B
  explanation: The examiner may permit you to have a minor defect corrected and continue
    the examination. However, you will not be permitted to continue the examination
    in another vehicle on the same test date.
- id: 188
  category: penalties_and_points
  question: What is the minimum revocation period for a first offense DUI with a BAC
    of .15 or greater?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: C
  explanation: According to the DUI penalties chart, a 1st Offense for DUI - Alcohol
    or Drugs w/.15 or > carries a minimum revocation period of 45 days.
- id: 189
  category: penalties_and_points
  question: What is the minimum revocation period for a DUI resulting in death (a
    felony)?
  choices:
    A: 60 days
    B: 6 months
    C: 1 year
    D: 5 years
  answer: C
  explanation: According to the DUI penalties chart, a DUI - With Death (Felony) carries
    a minimum revocation period of 1 Year.
- id: 190
  category: driver_testing
  question: What will happen if an applicant is unable to locate and demonstrate the
    use of any vehicle safety equipment during the road skills test?
  choices:
    A: The examiner will show them how to use it.
    B: It will result in an automatic failure.
    C: Points will be deducted from their final score.
    D: They must switch to a different test vehicle.
  answer: B
  explanation: According to the manual, if the applicant is unable to both locate
    and demonstrate the use of any of the vehicle safety equipment, this will result
    in an automatic failure on the road skills test.
- id: 191
  category: vehicle_information
  question: Which of the following is considered illegal equipment on a test vehicle?
  choices:
    A: Windows tinted to less than 35 percent light transmission.
    B: A passenger vehicle load extending 4 inches beyond the right fenders.
    C: Exactly two backup lights.
    D: A driver side window that rolls down.
  answer: A
  explanation: The manual lists 'Windows tinted to less than 35 percent light transmission'
    as illegal equipment.
- id: 192
  category: vehicle_information
  question: Who is authorized to have red and/or blue flashing lights on their vehicle?
  choices:
    A: Any passenger vehicle.
    B: Commercial tow trucks only.
    C: Only authorized emergency vehicles.
    D: Vehicles participating in a funeral procession.
  answer: C
  explanation: The manual states that red and/or blue flashing lights are illegal
    equipment, and only authorized emergency vehicles may have these warning lights.
- id: 193
  category: driver_testing
  question: If you fail either the knowledge or road skills test, how long must you
    wait before you can be tested again?
  choices:
    A: 24 hours
    B: 48 hours
    C: One week
    D: One month
  answer: C
  explanation: Applicants who fail either the knowledge or road skills test may not
    be tested twice within a period of one (1) week, in accordance with §17B-2-6,
    West Virginia State Code.
- id: 194
  category: safe_driving_rules
  question: When should you adjust the vehicle seat and rear view mirror for the driving
    examination?
  choices:
    A: While driving to the first intersection.
    B: Before driving.
    C: Only if the examiner asks you to.
    D: After completing the basic vehicle control skills test.
  answer: B
  explanation: The manual instructs drivers to adjust the vehicle seat and rear view
    mirror before driving to assure better control of the vehicle.
- id: 195
  category: safe_driving_rules
  question: Which of the following is a proper driving technique to use during your
    driving examination?
  choices:
    A: Keep one hand on the steering wheel and the other on the gear shift.
    B: Rest your left elbow in the window to maintain a relaxed posture.
    C: Keep both hands on the steering wheel and do not rest your elbow in the window.
    D: Adjust your mirrors while navigating a moderate grade.
  answer: C
  explanation: 'The manual explicitly states: ''Keep both hands on the steering wheel
    and do not rest your elbow in the window.'''
- id: 196
  category: driver_testing
  question: Which of the following actions will result in an automatic failure during
    the driving test?
  choices:
    A: Forgetting to adjust the radio.
    B: Jumping the curb during any part of the driving test.
    C: Asking the examiner a question about the instructions.
    D: Stopping too far behind the stop line.
  answer: B
  explanation: Jumping the curb during any part of the driving test is listed under
    'Automatic Failures'.
- id: 197
  category: defensive_driving
  question: When stopping behind another vehicle at an intersection, what is considered
    a safe gap?
  choices:
    A: Stopping where you can see the rear tires of the vehicle ahead of you.
    B: Stopping exactly one car length behind the vehicle.
    C: Stopping where you can see the driver's face in their rearview mirror.
    D: Stopping within three feet of the vehicle's rear bumper.
  answer: A
  explanation: A safe gap when stopping behind another vehicle is to stop where you
    can see the rear tires of the vehicle ahead of you.
- id: 198
  category: safe_driving_rules
  question: If you must stop before making a turn because of traffic, how should you
    position your front wheels?
  choices:
    A: Aimed slightly to the right.
    B: Aimed slightly to the left.
    C: Turned in the direction you intend to go.
    D: Aimed straight ahead.
  answer: D
  explanation: If you must stop before making a turn because of traffic, signals,
    or signs, you should keep the front wheels aimed straight ahead.
- id: 199
  category: safe_driving_rules
  question: What is the rule regarding lane changes while driving through an intersection?
  choices:
    A: You may change lanes if you use your turn signal.
    B: You should change lanes to avoid pedestrians.
    C: Do not change lanes while proceeding through the intersection.
    D: You may only change lanes if the intersection is controlled by a traffic light.
  answer: C
  explanation: 'When driving through an intersection, the manual explicitly states:
    ''Do not change lanes while proceeding through the intersection.'''
- id: 200
  category: vehicle_information
  question: Which window on the test vehicle MUST be fully operational for the driving
    examination?
  choices:
    A: The rear passenger window.
    B: The driver side window.
    C: The front passenger window.
    D: The rear windshield.
  answer: B
  explanation: Under the features that must be fully functional, the manual specifies
    that the 'Driver Side Window MUST Be Operational.'
- id: 201
  category: vehicle_information
  question: A passenger vehicle is considered illegally equipped if a load extends
    beyond the line of the fenders on the left side or more than how many inches beyond
    the line of the fenders on the right side?
  choices:
    A: 2 inches
    B: 4 inches
    C: 6 inches
    D: 8 inches
  answer: C
  explanation: It is illegal equipment to have any load on the passenger vehicle extending
    beyond the line of the fenders on the left side or six (6) inches beyond the line
    of the fenders on the right side.
- id: 202
  category: driver_testing
  question: When practicing basic vehicle control skills like parallel parking, you
    should practice with a parent, guardian, or friend who is properly licensed and
    over what age?
  choices:
    A: '18'
    B: '21'
    C: '25'
    D: '30'
  answer: B
  explanation: The manual advises to practice these exercises with a parent, guardian,
    or friend who is properly licensed and over the age of 21.
- id: 203
  category: driver_testing
  question: During the basic control skills test, what must you do if your turn signal
    cancels automatically before you have completed the maneuver?
  choices:
    A: Leave it off to avoid confusing other drivers.
    B: Reactivate it when necessary.
    C: Use hand signals instead.
    D: Stop the vehicle and restart the exercise.
  answer: B
  explanation: 'The manual states: ''If your turn signal cancels automatically make
    sure to reactivate it when necessary.'''
- id: 204
  category: safe_driving_rules
  question: After completing a turn and accelerating to the speed of traffic, which
    lane should you move into when it is safe to do so?
  choices:
    A: The left-most lane.
    B: The center lane.
    C: The right-most lane.
    D: The lane with the least amount of traffic.
  answer: C
  explanation: After a turn, you should check your blind spots and mirrors and 'move
    into the right-most lane when it is safe to do so (if not already there).'
- id: 205
  category: driver_testing
  question: What must you do with a hands-free parking device during the basic control
    skills test?
  choices:
    A: Use it to demonstrate proficiency.
    B: Deactivate it.
    C: Use it only on your final attempt.
    D: Keep it on standby in case you need help.
  answer: B
  explanation: 'The manual states on the Basic Control Skills Test form: ''If equipped,
    hands-free parking device must be deactivated.'''
- id: 206
  category: safe_driving_rules
  question: When approaching a curve, when should you reduce your speed?
  choices:
    A: While in the middle of the curve
    B: After exiting the curve
    C: Before entering the curve
    D: Only if you see other traffic approaching
  answer: C
  explanation: 'The manual states: ''Before entering the curve, reduce your speed
    so further braking is not required in the curve, and keep vehicle in the lane.'''
- id: 207
  category: driver_testing
  question: Which of the following steering methods is NOT acceptable during the road
    test?
  choices:
    A: Hand-over-hand steering
    B: Hand-to-hand steering
    C: Keeping both hands on the outside of the wheel
    D: Palming the steering wheel
  answer: D
  explanation: 'The manual states: ''All methods of steering are acceptable (i.e.,
    hand-over hand and hand-to-hand) as long as both hands are on the outside of the
    wheel (no palming).'''
- id: 208
  category: safe_driving_rules
  question: When completing a left turn on a multiple-lane road, which lane should
    you finish the turn in?
  choices:
    A: The left-most lane
    B: The center lane
    C: The right-most curb lane
    D: Any available lane
  answer: C
  explanation: 'The manual states regarding proper lane usage: ''Finish the turn in
    the right-most curb lane.'''
- id: 209
  category: safe_driving_rules
  question: Where is it explicitly prohibited to attempt a lane change?
  choices:
    A: On a multiple-lane highway
    B: At intersections
    C: In urban areas
    D: On rural roadways
  answer: B
  explanation: 'The manual states under Proper lane usage: ''Do not attempt lane changes
    at intersections.'''
- id: 210
  category: safe_driving_rules
  question: If there is no stop line or crosswalk at an intersection, where should
    you stop your vehicle?
  choices:
    A: In the middle of the intersection
    B: Just past the stop sign
    C: Before your vehicle enters the intersection
    D: Even with the intersecting road's center line
  answer: C
  explanation: 'The manual states: ''If there is no stop line or crosswalk, stop before
    your vehicle enters the intersection.'''
- id: 211
  category: driver_testing
  question: What happens if you use a wireless communications device at any time during
    the road test?
  choices:
    A: You will lose 5 points.
    B: You will be disqualified.
    C: You will be given a warning.
    D: The examiner will ask you to turn it off.
  answer: B
  explanation: The manual lists 'If at anytime you use your wireless communications
    device' under Road Skills Test Automatic Failures, which means you will be disqualified.
- id: 212
  category: safe_driving_rules
  question: How should you properly check your blind spots before changing lanes?
  choices:
    A: By relying solely on your rearview mirror
    B: By looking over your shoulder (head check)
    C: By checking your side mirrors twice
    D: By activating your turn signal and waiting 3 seconds
  answer: B
  explanation: 'The manual states: ''...check your blind spots by looking over your
    shoulder (head check)...'''
- id: 213
  category: driver_testing
  question: During the road test, what is the expectation for your lane position in
    urban area driving?
  choices:
    A: You should drive in the left-most lane at all times.
    B: You should straddle the lane markings to avoid parked cars.
    C: Your vehicle should be centered in the proper lane (right-most lane).
    D: You should frequently change lanes to maintain speed.
  answer: C
  explanation: 'The manual states under Urban Area Driving: ''Your vehicle should
    be centered in the proper lane (right-most lane)...'''
- id: 214
  category: driver_testing
  question: When performing the parallel parking maneuver on the basic control skills
    test, how far from the curb line results in a failure after 3 attempts?
  choices:
    A: Outside 6 inches
    B: Outside 12 inches
    C: Outside 18 inches
    D: Outside 24 inches
  answer: C
  explanation: The Basic Control Skills Test score form indicates a failure for being
    'outside 18” curb line (after 3 att.)'.
- id: 215
  category: safe_driving_rules
  question: What should you do with your turn signal upon completion of a turn or
    lane change?
  choices:
    A: Leave it on for an additional 100 feet
    B: Cancel it immediately
    C: Wait for it to cancel itself automatically
    D: Flash your hazard lights to indicate completion
  answer: B
  explanation: 'The manual explicitly states: ''Cancel turn signals upon completion
    of a turn or lane change.'''
- id: 216
  category: driver_testing
  question: What will happen if you refuse to perform any maneuver which is part of
    the road test?
  choices:
    A: You will lose 10 points.
    B: The examiner will perform it for you.
    C: You will be disqualified.
    D: You will skip that section and be graded on the rest.
  answer: C
  explanation: The manual lists 'If you refuse to perform any maneuver which is part
    of the road test' under Road Skills Test Automatic Failures, meaning you will
    be disqualified.
- id: 217
  category: signs_and_signals
  question: What does an eight-sided (octagon) traffic sign indicate?
  choices:
    A: Yield the right-of-way to cross traffic
    B: You must stop completely
    C: A school zone is ahead
    D: The beginning of a no-passing zone
  answer: B
  explanation: Eight-sided (octagon) signs are reserved for stop signs. These signs
    mean you must stop completely.
- id: 218
  category: safe_driving_rules
  question: Where must you stop at a stop sign if there are no pavement markings or
    crosswalks?
  choices:
    A: Directly next to the stop sign
    B: Ten feet before the intersection
    C: Before entering the intersection
    D: After pulling slightly into the intersection to see traffic
  answer: C
  explanation: If there are no pavement markings or crosswalks, you must stop before
    entering an intersection at a place where you can see traffic coming from all
    directions.
- id: 219
  category: signs_and_signals
  question: What does a pennant-shaped traffic sign mark?
  choices:
    A: A railroad crossing
    B: A school zone
    C: The beginning of a no-passing zone
    D: A yield zone
  answer: C
  explanation: A pennant-shaped sign marks the beginning of a no-passing zone.
- id: 220
  category: safe_driving_rules
  question: What is the maximum speed limit in a school zone when children are present?
  choices:
    A: 10 m.p.h.
    B: 15 m.p.h.
    C: 20 m.p.h.
    D: 25 m.p.h.
  answer: B
  explanation: The maximum speed limit in a school zone is 15 m.p.h. when children
    are present or when specified.
- id: 221
  category: signs_and_signals
  question: What does a right-side-up triangular sign with a reflective red border
    and fluorescent orange center identify?
  choices:
    A: A slow-moving vehicle or a vehicle making an emergency stop
    B: A hazardous materials transport vehicle
    C: A construction zone ahead
    D: An upcoming yield sign
  answer: A
  explanation: A right side up triangular sign with a reflective red border and fluorescent
    orange center identifies a slow moving vehicle or a vehicle which has made an
    emergency stop.
- id: 222
  category: signs_and_signals
  question: What does a red outline with a diagonal bar through it on a traffic sign
    mean?
  choices:
    A: Caution
    B: Yield
    C: 'No'
    D: Stop
  answer: C
  explanation: A red outline with a diagonal bar through it always means 'NO.'
- id: 223
  category: safe_driving_rules
  question: Which of the following is a rule regarding a dual turn lane?
  choices:
    A: It can be used to safely overtake and pass other vehicles.
    B: It is used only for making left turns from either direction.
    C: It is used for making right turns only.
    D: It is a designated lane for emergency vehicles.
  answer: B
  explanation: A dual turn lane is posted over a highway lane that is used only for
    making left turns from either direction. You must never use a turning lane to
    overtake and pass other vehicles.
- id: 224
  category: signs_and_signals
  question: What color are advisory speed signs found at interstate entrances and
    exit ramps?
  choices:
    A: White on green
    B: Black on yellow
    C: Black on white
    D: White on blue
  answer: B
  explanation: Advisory speed signs can be found at interstate entrances and exit
    ramps which show the maximum recommended safe speed for driving on the ramp. These
    advisory signs are black on yellow.
- id: 225
  category: signs_and_signals
  question: While most warning signs are yellow with black letters, what color may
    pedestrian and school warning signs be?
  choices:
    A: Yellow-green with black letters
    B: Orange with black letters
    C: White with red letters
    D: Blue with white letters
  answer: A
  explanation: Pedestrian and school warning signs may be yellow-green with black
    letters.
- id: 226
  category: signs_and_signals
  question: What is the basic color for construction and maintenance signs and devices?
  choices:
    A: Yellow
    B: Red
    C: Orange
    D: Brown
  answer: C
  explanation: Orange is the basic color for construction and maintenance signs and
    devices.
- id: 227
  category: signs_and_signals
  question: What do diagonal stripes sloping downward to the right on a barricade
    or vertical panel indicate?
  choices:
    A: The driver should bear to the left.
    B: The driver should bear to the right.
    C: The road is completely closed ahead.
    D: There is a pedestrian crossing to the right.
  answer: B
  explanation: The diagonal stripes on a barricade or vertical panel guide the driver.
    Stripes sloping downward to the right mean the driver should bear to the right.
- id: 228
  category: signs_and_signals
  question: What color are motorist services signs, which let you know what amenities
    are available off interstate exits?
  choices:
    A: White on green
    B: White on brown
    C: White on blue
    D: Black on yellow
  answer: C
  explanation: Motorist services signs are white on blue.
- id: 229
  category: signs_and_signals
  question: What color are guide signs for parks and public recreation areas?
  choices:
    A: White on green
    B: White on brown
    C: White on blue
    D: Yellow on black
  answer: B
  explanation: Signs for parks and public recreation areas are white on brown.
- id: 230
  category: signs_and_signals
  question: What does a yellow-and-black circular sign indicate?
  choices:
    A: A school zone ahead
    B: A no-passing zone
    C: Advance warning of a railroad crossing ahead
    D: A hospital zone
  answer: C
  explanation: A yellow-and-black circular sign gives advance warning of a railroad
    crossing ahead.
- id: 231
  category: defensive_driving
  question: What should you do when you see a warning sign indicating a hill ahead?
  choices:
    A: Accelerate to maintain your speed
    B: Shift into neutral
    C: Slow down before you start downhill
    D: Move to the left lane
  answer: C
  explanation: The hill sign warns you of hills where special care must be taken.
    You should slow down before you start downhill.
- id: 232
  category: signs_and_signals
  question: What colors are used for Interstate route markers?
  choices:
    A: Black and white
    B: Red, white, and blue
    C: Green and white
    D: Yellow and black
  answer: B
  explanation: According to the manual, Interstate markers are red, white, and blue.
- id: 233
  category: safe_driving_rules
  question: When approaching a railroad crossing behind another vehicle, when is it
    safe to enter the crossing?
  choices:
    A: As soon as the vehicle ahead starts crossing
    B: Only when the vehicle ahead has moved far enough that you can completely clear
      the tracks
    C: When the flashing lights stop, even if the barrier is down
    D: Immediately after the train passes
  answer: B
  explanation: The manual states that you should not enter a railroad crossing until
    the vehicle ahead has moved far enough ahead that you can clear the tracks, to
    avoid being trapped.
- id: 234
  category: signs_and_signals
  question: What does a steady circular yellow traffic light indicate?
  choices:
    A: The green light is ending and will change to red
    B: You must come to a complete stop immediately
    C: You have the right-of-way to proceed
    D: The traffic signal is out of order
  answer: A
  explanation: A steady circular yellow light means that the green light is ending
    and will change to red. You should only drive through if the vehicle clearance
    is within the intersection.
- id: 235
  category: safe_driving_rules
  question: Under what condition is a driver permitted to make a left turn on a steady
    red light?
  choices:
    A: When turning from a two-way street onto a one-way street
    B: When turning from a one-way street to another one-way street
    C: When there is no oncoming traffic on a two-way street
    D: Left turns on red are never permitted
  answer: B
  explanation: A driver may turn left on red from a one-way street to another one-way
    street after yielding to all other traffic and pedestrians, provided no signs
    prohibit it.
- id: 236
  category: signs_and_signals
  question: How should a driver react to a circular flashing yellow light at an intersection?
  choices:
    A: Come to a complete stop and wait for a green light
    B: Treat it as a four-way stop
    C: Proceed through the intersection with caution
    D: Yield to all traffic on the right
  answer: C
  explanation: Drivers facing a circular flashing yellow light may proceed through
    the intersection with caution.
- id: 237
  category: signs_and_signals
  question: What does a Yellow X lane use control signal mean?
  choices:
    A: The lane is closed and you must not use it
    B: Traffic may use the lane under the arrow
    C: The lane is about to be closed or its direction is about to reverse
    D: You must stop immediately in that lane
  answer: C
  explanation: A Yellow X indicates that the lane is about to be closed or its direction
    is about to reverse, and you should move out of it as soon as you can.
- id: 238
  category: sharing_the_road
  question: When does a blind pedestrian using a guide dog or white cane have the
    right-of-way?
  choices:
    A: Only when they are within a marked crosswalk
    B: Only at intersections with pedestrian signals
    C: Regardless of whether they are in a crosswalk or not
    D: Only during daylight hours
  answer: C
  explanation: A blind person who is on foot and using a guide dog, service animal,
    or white cane has the right-of-way on a highway, street, or road regardless of
    whether they are in a crosswalk or not.
- id: 239
  category: signs_and_signals
  question: What does a solid yellow line on your side of the road indicate?
  choices:
    A: You may pass if the road ahead is clear
    B: You MUST NOT PASS
    C: The lane is designated for carpools
    D: You are on a one-way street
  answer: B
  explanation: Solid yellow lines separate traffic moving in opposite directions.
    If a solid yellow line is on your side of the road, you MUST NOT PASS.
- id: 240
  category: safe_driving_rules
  question: What should you do if lanes of traffic moving in the same direction are
    separated by solid white lines?
  choices:
    A: Change lanes only if you use a turn signal
    B: DO NOT CHANGE LANES
    C: Pass slower vehicles on the right
    D: Merge into the center lane
  answer: B
  explanation: When solid white lines separate lanes of traffic moving in the same
    direction, the manual states DO NOT CHANGE LANES.
- id: 241
  category: signs_and_signals
  question: What does a white diamond shape painted on the roadway indicate?
  choices:
    A: A railroad crossing is ahead
    B: The lane is reserved for left turns only
    C: The lane is designated for car pools, bicycles, or buses
    D: A pedestrian crosswalk is approaching
  answer: C
  explanation: White diamond shapes painted in the roadway inform drivers the lane
    is designated for car pools, bicycles, or buses.
- id: 242
  category: signs_and_signals
  question: How are reversible lanes marked on the roadway?
  choices:
    A: By a solid white line on both sides
    B: By a double yellow broken line on both sides
    C: By a single solid yellow line in the center
    D: By white diamond shapes
  answer: B
  explanation: Lanes which reverse are marked on both sides by a double yellow broken
    line. This is the only case where a driver may drive to the left of a yellow line.
- id: 243
  category: safe_driving_rules
  question: What is the maximum speed limit on an interstate in West Virginia, unless
    otherwise posted?
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 70 mph
  answer: D
  explanation: The designated speed limit for an Interstate is a maximum speed of
    70 mph unless otherwise posted.
- id: 244
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit on an open county highway?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: The designated speed limit for an Open County Highway is 55 mph unless
    otherwise posted.
- id: 245
  category: defensive_driving
  question: 'Regardless of the posted speed limit, West Virginia law prohibits driving
    at a speed that is:'
  choices:
    A: Slower than the flow of traffic
    B: Greater than reasonable and prudent for existing conditions
    C: Less than 10 mph below the limit
    D: Exactly the posted speed limit during rain
  answer: B
  explanation: West Virginia law prohibits driving at a speed that is greater than
    reasonable and prudent for existing conditions.
- id: 246
  category: sharing_the_road
  question: What should you do if you must drive slower than the designated speed
    on a road with one lane in each direction?
  choices:
    A: Drive in the center of the road to prevent passing
    B: Pull off at the first safe turnout to let faster moving traffic pass
    C: Turn on your hazard lights and maintain your speed
    D: Stop immediately in your lane to let vehicles go around
  answer: B
  explanation: If you must drive slower than the designated speed, you should pull
    off at the first safe turnout to let faster moving traffic pass when overtaking
    traffic does not have a clear lane.
- id: 247
  category: safe_driving_rules
  question: How far in advance should you signal before you plan to turn?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: B
  explanation: You should get into the habit of signaling every time you make a change
    and signal at least 100 feet before you plan to turn.
- id: 248
  category: vehicle_information
  question: What does a driver's arm pointing straight out the window indicate?
  choices:
    A: Slow or stop
    B: Right turn
    C: Left turn
    D: Hazard ahead
  answer: C
  explanation: An arm pointing straight out indicates a left turn. An arm pointing
    up is a right turn, and an arm pointing down means slow or stop.
- id: 249
  category: defensive_driving
  question: Where should your hands be placed on the steering wheel for maximum control
    and safety?
  choices:
    A: 10 o'clock and 2 o'clock
    B: 9 o'clock and 3 o'clock
    C: 8 o'clock and 4 o'clock
    D: 12 o'clock and 6 o'clock
  answer: C
  explanation: The left hand should be placed approximately at 8 o'clock and the right
    hand at 4 o'clock to afford maximum control and reduce the chance of a deploying
    air bag knocking your hands off the wheel.
- id: 250
  category: safe_driving_rules
  question: Why should you keep your wheels straight while waiting to make a left
    turn?
  choices:
    A: It saves wear and tear on your tires
    B: It prevents a bump from behind from pushing your vehicle into oncoming traffic
    C: It allows you to accelerate faster when the light changes
    D: It signals to other drivers that you are yielding
  answer: B
  explanation: When waiting to turn left, do not turn the wheels to the left. Otherwise,
    a bump from behind could push your vehicle into oncoming traffic.
- id: 251
  category: safe_driving_rules
  question: It is against the law to turn your vehicle around near the crest of a
    hill where you cannot be seen by an approaching vehicle within what distance?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: It is against the law to turn your vehicle around near a curve or the
    crest of a hill where you cannot be seen by another vehicle approaching within
    500 feet in either direction.
- id: 252
  category: safe_driving_rules
  question: You are not allowed to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: Stopping, standing or parking is not allowed within 15 feet of a fire
    hydrant.
- id: 253
  category: safe_driving_rules
  question: Parking is prohibited within how many feet of any stop sign or traffic
    control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Stopping, standing or parking is not allowed within 30 feet of any
    stop sign or traffic control signal.
- id: 254
  category: safe_driving_rules
  question: Which way should you turn your front wheels when parking uphill on a street
    with a curb?
  choices:
    A: Turn wheels to the right
    B: Turn wheels toward the curb
    C: Turn wheels away from the curb
    D: Keep wheels straight
  answer: C
  explanation: When parking up hill with a curb, you should turn your wheels from
    (away from) the curb.
- id: 255
  category: safe_driving_rules
  question: When parking downhill, which way should you turn your wheels?
  choices:
    A: Turn wheels to the curb
    B: Turn wheels away from the curb
    C: Keep wheels perfectly straight
    D: Turn wheels to the left
  answer: A
  explanation: When parking down hill, you should turn your wheels to the curb so
    the vehicle will not roll into traffic.
- id: 256
  category: safe_driving_rules
  question: When parallel parking, your wheels should be within how many inches of
    the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: When you parallel park, park so the wheels are parallel to and within
    18 inches of the curb.
- id: 257
  category: safe_driving_rules
  question: You must not park your vehicle within how many feet of the nearest rail
    of a railroad crossing?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: D
  explanation: Stopping, standing or parking is not allowed within 50 feet of the
    nearest rail of a railroad crossing.
- id: 258
  category: safe_driving_rules
  question: When parallel parking, what is the maximum distance your vehicle should
    be from the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: The manual states, "Do not park more than 18” from the curb."
- id: 259
  category: defensive_driving
  question: What is the recommended following distance when driving in dark or raining
    conditions?
  choices:
    A: Two seconds
    B: Three to four seconds
    C: At least four seconds
    D: At least six seconds
  answer: C
  explanation: According to the manual, "If it is dark or raining, the distance should
    be at least four seconds."
- id: 260
  category: defensive_driving
  question: How many seconds of following distance should you maintain if there is
    ice or snow on the road?
  choices:
    A: 2 seconds
    B: 3 to 4 seconds
    C: 4 seconds
    D: At least 6 seconds
  answer: D
  explanation: The manual states, "If there is ice or snow, stay at least six seconds
    behind the vehicle in front."
- id: 261
  category: safe_driving_rules
  question: In which of the following locations is it explicitly prohibited to change
    lanes?
  choices:
    A: On a multi-lane highway
    B: In an intersection or at a railroad crossing
    C: In a school zone
    D: On a one-way street
  answer: B
  explanation: The proper lane changing rules state, "DO NOT change lanes in an intersection
    or at a railroad crossing."
- id: 262
  category: safe_driving_rules
  question: When passing a vehicle on a two-lane highway, when is it safe to return
    to your proper lane?
  choices:
    A: As soon as you pass the other vehicle's front bumper
    B: When you see the front of the vehicle (both headlights) you have passed in
      your rear view mirror
    C: When you are 50 feet ahead of the passed vehicle
    D: When the driver you are passing blinks their headlights
  answer: B
  explanation: The manual instructs to "Signal and return to the proper lane when
    you see the front of the vehicle (both headlights) you have passed in your rear
    view mirror."
- id: 263
  category: safe_driving_rules
  question: Passing is prohibited within how many feet of a bridge, viaduct, tunnel,
    or underpass?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Passing is PROHIBITED "Within 100 feet of a bridge, viaduct, tunnel,
    or underpass."
- id: 264
  category: safe_driving_rules
  question: If you reach an uncontrolled intersection at the same time as another
    vehicle, who has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver going the fastest
    D: The driver on the larger road
  answer: B
  explanation: 'For uncontrolled intersections and four-way stop intersections, the
    manual states: "If you reach the intersection at the same time as another vehicle,
    yield to the driver on the right."'
- id: 265
  category: sharing_the_road
  question: What should you do when an emergency vehicle is approaching with a sounding
    siren and flashing warning lights?
  choices:
    A: Speed up to get out of its way
    B: Stop immediately in your current lane
    C: Pull over to the right edge of the road, clear of the intersection, and stop
    D: Move to the left lane and slow down
  answer: C
  explanation: 'The manual states: "Pull over to the right edge of the road, clear
    of the intersection, and stop until the emergency vehicle has passed."'
- id: 266
  category: sharing_the_road
  question: If a pedestrian is walking along a road where there is no sidewalk, where
    must they walk?
  choices:
    A: On the right side with the flow of traffic
    B: On the left side facing oncoming traffic
    C: In the center of the road
    D: Pedestrians are not allowed on roads without sidewalks
  answer: B
  explanation: 'The manual states pedestrians must: "When walking along a road where
    there is no sidewalk, walk on the left side facing oncoming traffic."'
- id: 267
  category: penalties_and_points
  question: What is the minimum penalty for a first offense of passing a stopped school
    bus with flashing red lights?
  choices:
    A: 30 days license suspension and a $250 fine
    B: 60 days license suspension and a minimum fine of $500
    C: 90 days license suspension and a $1,000 fine
    D: 6 months license suspension and a $500 fine
  answer: B
  explanation: '"The penalty for passing a stopped school bus is a minimum of 60 days
    driver’s license suspension and a minimum fine of $500 or confinement in jail
    for not more than six (6) months for the first offense."'
- id: 268
  category: sharing_the_road
  question: Under what condition is traffic coming toward a stopped school bus NOT
    required to stop?
  choices:
    A: When driving on a four-lane city street
    B: When driving on a private road
    C: When driving on an Interstate Highway on the other side of the median
    D: When the school bus is in a parking lot
  answer: C
  explanation: '"Only on Interstate Highways does traffic coming toward a school bus
    stopped on the other side of the median not have to stop."'
- id: 269
  category: defensive_driving
  question: If a check of your rear view mirror shows another vehicle following too
    closely, what is one step you should take?
  choices:
    A: Speed up to increase the distance
    B: Slam on your brakes to warn them
    C: Tap your brakes gently to flash the brake lights
    D: Turn on your hazard lights and stop in the lane
  answer: C
  explanation: To deal with a tailgater, the manual suggests to "Tap your brakes gently
    to flash the brake lights and warn the tailgater."
- id: 270
  category: safe_driving_rules
  question: When driving at night, you must dim your headlights within how many feet
    of an approaching vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: The manual states to "Dim your headlights within 500 feet of an approaching
    vehicle."
- id: 271
  category: vehicle_information
  question: Which lights should you use when driving in fog?
  choices:
    A: High beam lights
    B: Low beam lights
    C: Parking lights
    D: Hazard lights
  answer: B
  explanation: The manual advises to "Use low beam lights when driving in fog. High
    beams cause the light to be reflected back into your eyes."
- id: 272
  category: defensive_driving
  question: How can you avoid the glare from the headlights of approaching vehicles
    at night?
  choices:
    A: Look directly at the oncoming headlights
    B: Look toward the left edge of the road
    C: Look toward the right edge of the road
    D: Turn on your high beams
  answer: C
  explanation: The manual states to "Avoid looking directly into the lights of oncoming
    vehicles by looking toward the right edge of the road."
- id: 273
  category: safe_driving_rules
  question: When are you required to turn on your headlights?
  choices:
    A: Only when driving on interstate highways
    B: When visibility is less than 1,000 feet
    C: From sunset to sunrise, in fog, rain, or when visibility is less than 500 feet
    D: Only between the hours of 8 PM and 6 AM
  answer: C
  explanation: The manual states to turn on your headlights from sunset to sunrise,
    during fog, smoke, rain, or at any other time when persons and vehicles cannot
    be seen clearly at a distance of 500 feet.
- id: 274
  category: sharing_the_road
  question: What is the recommended safe minimum following distance when driving behind
    a motorcycle?
  choices:
    A: One to two seconds
    B: Three to four seconds
    C: Five to six seconds
    D: Seven to eight seconds
  answer: B
  explanation: According to the manual, it is wise to keep a safe minimum three-to-four
    second following distance when behind a motorcycle, and to increase this time
    at night or under adverse weather conditions.
- id: 275
  category: sharing_the_road
  question: 'When passing a motorcycle, a driver should:'
  choices:
    A: Share the lane with the motorcycle to save space
    B: Honk the horn continuously to warn the rider
    C: Go all the way into the other lane
    D: Pass as closely as possible to the motorcycle
  answer: C
  explanation: The manual instructs that when passing a motorcycle, you should go
    all the way into the other lane because the motorcyclist has the legal right to
    an entire lane and may need to swerve to avoid hazards.
- id: 276
  category: signs_and_signals
  question: What type of sign are slow-moving vehicles, such as farm or construction
    equipment, required to display?
  choices:
    A: A square orange sign
    B: A circular yellow sign
    C: A special triangular emblem sign
    D: A diamond-shaped reflective sign
  answer: C
  explanation: Slow-moving vehicles are required to display a special triangular emblem
    sign which means 'Slow-Moving Vehicle' to warn approaching drivers.
- id: 277
  category: sharing_the_road
  question: Compared to a standard vehicle, how much distance does a fully loaded
    tractor-trailer traveling at 55 mph need to stop?
  choices:
    A: Two times the distance
    B: Three times the distance
    C: Four times the distance
    D: Five times the distance
  answer: B
  explanation: The manual states that a fully loaded tractor-trailer, traveling 55
    mph, needs three (3) times the distance a vehicle needs to stop.
- id: 278
  category: defensive_driving
  question: How can you easily determine if you are driving in a heavy truck's blind
    spot (the 'No-Zone')?
  choices:
    A: You are within 50 feet of the truck's rear bumper
    B: You cannot see the truck driver's reflection in their side mirror
    C: The truck's taillights are not visible to you
    D: You are driving on the left side of the truck
  answer: B
  explanation: The easiest way to avoid lingering in the 'No-Zone' is to look for
    the truck driver's reflection in the side mirror. If you cannot see the driver's
    reflection, you are in the truck driver's blind spot.
- id: 279
  category: safe_driving_rules
  question: After passing a heavy truck in wet conditions, how much space should you
    give before merging back to the right?
  choices:
    A: One to two seconds
    B: Two seconds
    C: Three seconds
    D: At least four to six seconds
  answer: D
  explanation: The Truck Safety DOs section states that in wet conditions, you should
    give at least four (4) to six (6) seconds of space after passing a truck.
- id: 280
  category: sharing_the_road
  question: Which of the following is a rule regarding animal riders on public roads?
  choices:
    A: They are allowed to ride on interstate highways
    B: You should sound your horn to let them know you are passing
    C: They have the same rights as motor vehicle users and are subject to the same
      rules
    D: They must ride facing oncoming traffic
  answer: C
  explanation: The manual notes that persons riding animals have the same rights as
    motor vehicle users and are subject to the same rules. It also explicitly states
    they may not use interstates and drivers should never sound their horn near a
    horse.
- id: 281
  category: sharing_the_road
  question: 'When meeting an oncoming bicyclist at night, you should:'
  choices:
    A: Flash your high beams
    B: Always dim your lights
    C: Sound your horn
    D: Pull over and stop
  answer: B
  explanation: 'The manual explicitly states: ''When meeting an oncoming bicyclist
    at night, always dim your lights.'''
- id: 282
  category: sharing_the_road
  question: 'Bicyclists are required to follow all of the following rules EXCEPT:'
  choices:
    A: Ride in the same direction as other vehicles
    B: Yield the right-of-way to pedestrians
    C: Ride facing oncoming traffic
    D: Signal turns unless both hands are required for balance
  answer: C
  explanation: Bicyclists must ride in the same direction as other vehicles, not facing
    oncoming traffic. They must also yield to pedestrians and signal turns.
- id: 283
  category: vehicle_information
  question: Which of the following audible signaling devices is NOT permitted on a
    bicycle?
  choices:
    A: A bell
    B: A siren or whistle
    C: A device audible for 100 feet
    D: A standard bicycle horn
  answer: B
  explanation: Bicycles must have a bell or other device capable of giving a signal
    audible for at least 100 feet, but the manual specifies 'No siren or whistle is
    permitted.'
- id: 284
  category: vehicle_information
  question: 'For riding after dark, a bicycle must be equipped with a white headlight
    that is visible for at least:'
  choices:
    A: 100 feet to the front
    B: 200 feet to the front
    C: 300 feet to the front
    D: 500 feet to the front
  answer: D
  explanation: The manual requires that for riding after dark, a bicycle must have
    a white headlight that is visible for at least 500 feet to the front.
- id: 285
  category: sharing_the_road
  question: 'When sharing the road with a public bus, drivers should:'
  choices:
    A: Always come to a complete stop when the bus stops
    B: Pass the bus on the right side
    C: Watch for passengers crossing the street as they get on and off
    D: Sound their horn before passing the bus
  answer: C
  explanation: While traffic does not have to stop for a public bus, the manual advises
    drivers to watch for passengers crossing the street as they are getting on and
    off the bus.
- id: 286
  category: license_system
  question: How does a person obtain a mobility impaired parking placard or license
    plate?
  choices:
    A: By paying a $50 fee at the local police station
    B: By having a doctor certify their condition on a form provided by the DMV
    C: By showing a valid driver's license to a parking attendant
    D: By applying online without medical certification
  answer: B
  explanation: To obtain a mobility impaired parking placard or license plate, you
    must have a doctor certify your condition on a form provided by the DMV.
- id: 287
  category: vehicle_information
  question: When is it appropriate to use your vehicle's parking lights?
  choices:
    A: When driving in heavy fog
    B: Only when you are parked
    C: Between sunset and sunrise
    D: When approaching an intersection
  answer: B
  explanation: 'The manual explicitly states: ''Use your parking lights only when
    you are parked.'''
- id: 288
  category: driver_responsibility
  question: How far in advance must you contact the DMV if you require an auxiliary
    aid or service for effective communication?
  choices:
    A: No later than 12 hours before arrival
    B: No later than 24 hours before arrival
    C: No later than 48 hours before arrival
    D: No later than 72 hours before arrival
  answer: C
  explanation: According to the manual, anyone who requires an auxiliary aid or service
    should contact the DMV no later than 48 hours before the scheduled arrival.
- id: 289
  category: signs_and_signals
  question: What direction do even-numbered interstate highways run?
  choices:
    A: North to south
    B: East to west
    C: Diagonally across state lines
    D: In a circular beltway around cities
  answer: B
  explanation: The manual states that even-numbered interstates run east to west,
    while odd-numbered interstates run north to south.
- id: 290
  category: signs_and_signals
  question: What does a three-digit interstate number starting with an odd number
    identify?
  choices:
    A: A beltway or bypass around a city
    B: A route running east to west
    C: A spur route
    D: A route running north to south
  answer: C
  explanation: Three-digit numbers with an odd first number identify spur routes,
    whereas three-digit numbers with an even first number identify beltways or bypasses.
- id: 291
  category: safe_driving_rules
  question: Which lane should slower traffic use on an interstate highway?
  choices:
    A: The left-hand lane
    B: The center lane
    C: The right-hand lane
    D: The deceleration lane
  answer: C
  explanation: The manual specifies that slower traffic should drive in the right-hand
    lane, except when passing.
- id: 292
  category: safe_driving_rules
  question: Who has the right-of-way when a vehicle is entering an interstate from
    an acceleration lane?
  choices:
    A: The vehicle entering the interstate
    B: Traffic already on the interstate
    C: The vehicle traveling at the highest speed
    D: Commercial trucks and buses only
  answer: B
  explanation: When entering an interstate, you must remember that traffic already
    on the interstate has the right-of-way.
- id: 293
  category: defensive_driving
  question: What should you do if a gap in traffic is not available when you reach
    the end of an interstate acceleration lane?
  choices:
    A: Force your way into the nearest lane
    B: Stop immediately in the acceleration lane
    C: Drive onto the shoulder beyond the end of the acceleration lane and stop
    D: Honk your horn until a vehicle yields
  answer: C
  explanation: If a gap in traffic is not available, it may be necessary to drive
    onto the shoulder beyond the end of the acceleration lane and stop as a last resort.
- id: 294
  category: safe_driving_rules
  question: Where is the proper place to slow down when exiting an interstate?
  choices:
    A: In the right-hand through lane
    B: In the exit gore
    C: In the deceleration lane
    D: On the exit ramp only
  answer: C
  explanation: You should never slow down on the interstate itself. Wait until you
    are in the deceleration lane, then brake gently.
- id: 295
  category: signs_and_signals
  question: What is an exit gore on an interstate?
  choices:
    A: The lane used to accelerate before merging
    B: The triangular area between the through lane and the exit ramp
    C: The shoulder area designated for disabled vehicles
    D: A special lane for commercial vehicles
  answer: B
  explanation: The exit gore is defined as the triangular area between the through
    lane and the exit ramp. You should never stop in this area.
- id: 296
  category: safe_driving_rules
  question: Under normal weather and road conditions, what is the minimum speed you
    should drive on a West Virginia interstate?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: C
  explanation: You should not drive slower than 55 mph on an interstate unless the
    weather or road conditions are bad or a lower speed has been posted.
- id: 297
  category: safe_driving_rules
  question: If your vehicle becomes disabled on the interstate, where should you place
    emergency flares?
  choices:
    A: One 100 feet behind and another 200 feet behind
    B: One vehicle length behind and another 300 feet back
    C: One vehicle length in front and one 100 feet back
    D: Only directly behind the rear bumper
  answer: B
  explanation: The manual instructs drivers to put a flare about one vehicle length
    behind the disabled vehicle and another about 300 feet back on the shoulder.
- id: 298
  category: defensive_driving
  question: What should you do if you are involved in a crash in heavy fog on the
    interstate?
  choices:
    A: Leave your vehicle exactly where it is and wait for police
    B: Try to get your vehicle off the road as far as possible
    C: Stand in the road to wave down other drivers
    D: Turn off all your lights to conserve battery
  answer: B
  explanation: If involved in a crash in heavy fog, try to get your vehicle off the
    road as far as possible. Leaving it on the road invites further crashes.
- id: 299
  category: safe_driving_rules
  question: What is the proper procedure if you miss your exit and need to turn around
    on an interstate?
  choices:
    A: Make a U-turn using the median crossover
    B: Back up carefully on the right shoulder
    C: Go to the next exit to turn around
    D: Stop in the exit gore and wait for traffic to clear
  answer: C
  explanation: You should never make a U-turn on an interstate. You must go to the
    next exit to turn around before re-entering the interstate.
- id: 300
  category: signs_and_signals
  question: How is a lane removal usually indicated on an interstate?
  choices:
    A: By a red and white diamond sign
    B: By a black and yellow panel below a green and white overhead guide sign
    C: By a flashing yellow light on the shoulder
    D: By a solid double white line
  answer: B
  explanation: Where a lane is removed, the change is usually indicated by a black
    and yellow panel below the green and white overhead guide sign.
- id: 301
  category: sharing_the_road
  question: When entering an interstate, why should you be cooperative and give trucks
    and buses extra time and space?
  choices:
    A: They always have the right-of-way over passenger vehicles
    B: They may need extra time to adjust to traffic patterns
    C: They are required to drive in the left lane
    D: They are not allowed to use acceleration lanes
  answer: B
  explanation: The manual states that trucks and buses entering the interstate may
    need extra time to adjust to traffic patterns, so you should be cooperative and
    give them extra time and space.
- id: 302
  category: license_system
  question: What should you do if you have a physical disability or medical problem
    that may interfere with your driving ability when applying for a license?
  choices:
    A: Pay a surcharge to the DMV for special testing
    B: Prepare a letter explaining the situation to accompany your application
    C: Apply for a commercial driver's license instead
    D: Bring a medical doctor to your driving test
  answer: B
  explanation: If you have a physical disability or medical problem that may interfere
    with your driving ability, you should prepare a letter explaining the situation
    to accompany your application.
- id: 303
  category: safe_driving_rules
  question: Who is permitted to use the gravel or paved crossovers in the medians
    of highways?
  choices:
    A: Any driver who missed their exit.
    B: Drivers of commercial vehicles.
    C: Only police and emergency vehicles.
    D: Drivers experiencing a mechanical breakdown.
  answer: C
  explanation: The manual states, "The gravel or paved crossovers in the medians of
    some highways are to be used only by police and emergency vehicles."
- id: 304
  category: sharing_the_road
  question: 'When driving in a construction zone where a lane is closed, you should:'
  choices:
    A: Wait until the last minute to change lanes.
    B: Move over to the open lane as soon as possible.
    C: Speed up to pass the construction equipment quickly.
    D: Drive on the shoulder to bypass the closed lane.
  answer: B
  explanation: The manual advises, "If a lane is closed, signs will be posted well
    in advance. You should move over to the open lane as soon as possible. Avoid waiting
    until the last minute to change lanes."
- id: 305
  category: defensive_driving
  question: According to the manual, which of the following is considered a lazy driving
    habit?
  choices:
    A: Looking only in the rear view mirror instead of turning your head to look behind
      you.
    B: Coming to a complete stop at a red light before turning right.
    C: Keeping a firm grip on the steering wheel.
    D: Dimming your headlights within 500 feet of an oncoming vehicle.
  answer: A
  explanation: 'The manual describes laziness as failing to turn your head and look
    behind you for traffic, warning drivers: "Do not become lazy and look only in
    the rear view mirror."'
- id: 306
  category: driver_responsibility
  question: 'An impatient driver is often tempted to:'
  choices:
    A: Drive below the speed limit.
    B: Only slow down for a stop sign instead of coming to a complete stop.
    C: Yield the right-of-way to all pedestrians.
    D: Leave their vehicle in a flooded roadway.
  answer: B
  explanation: The manual states that due to pressure from following vehicles and
    absence of cross traffic, an impatient driver "may tempt you to only slow down
    for a stop sign" instead of coming to a complete stop.
- id: 307
  category: defensive_driving
  question: How does the manual distinguish an arrogant or aggressive driver from
    an impatient driver?
  choices:
    A: An arrogant driver is simply in a hurry, while an impatient driver is purposely
      in a hurry.
    B: An arrogant driver is purposely in a hurry and competes with their vehicle
      as an extension of their ego.
    C: An arrogant driver always yields to pedestrians.
    D: An arrogant driver only drives fast in construction zones.
  answer: B
  explanation: The manual states, "While the impatient driver is simply in a hurry,
    the arrogant or aggressive driver is purposely in a hurry... you compete with
    your vehicle because it is an extension of your ego."
- id: 308
  category: safe_driving_rules
  question: What does the term 'over driving your headlights' mean?
  choices:
    A: Leaving your high beams on when following another vehicle.
    B: Driving too fast to stop safely within the distance clearly lit by your headlights.
    C: Using your headlights during the daytime.
    D: Driving with your parking lights on instead of your headlights.
  answer: B
  explanation: According to the manual, "Over driving your headlights means driving
    too fast to stop safely within the distance clearly lit by your headlights."
- id: 309
  category: defensive_driving
  question: Where should you look if you are momentarily blinded by the headlights
    of an oncoming vehicle at night?
  choices:
    A: Directly at the oncoming headlights.
    B: At the center line of the road.
    C: Well in front of your vehicle at the right edge of the road.
    D: At your rear view mirror.
  answer: C
  explanation: 'The manual instructs: "When meeting an oncoming vehicle at night,
    slow down, keep to the right of your traffic lane, and look well in front of your
    vehicle at the right edge of the road."'
- id: 310
  category: safe_driving_rules
  question: 'When following another vehicle at night, you must dim your headlights
    within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: The manual states, "When following another vehicle, dim your headlights
    within 200 feet of the other vehicle."
- id: 311
  category: safe_driving_rules
  question: Why is wet pavement particularly dangerous at the start of a light rain?
  choices:
    A: The rain washes away the painted lane markings.
    B: A mixture of oil, dirt, and water forms a slippery film on the road.
    C: The water immediately causes total hydroplaning at any speed.
    D: It causes your headlights to reflect back into your eyes.
  answer: B
  explanation: The manual explains that wet pavement is dangerous "particularly at
    the start of a light rain when a mixture of oil, dirt, and water form a slippery
    film on the road."
- id: 312
  category: safe_driving_rules
  question: At what speed do the tires of a standard passenger vehicle lose all contact
    with the road during a severe rainstorm?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: D
  explanation: The manual states, "In a severe rainstorm, tires lose all contact with
    the road at 55 mph."
- id: 313
  category: safe_driving_rules
  question: How much water on a flooded roadway does it take to float some smaller
    vehicles?
  choices:
    A: Two inches
    B: Six inches
    C: One foot
    D: Two feet
  answer: B
  explanation: The manual warns, "As little as six (6) inches of water can float some
    smaller vehicles, while two (2) feet of water will carry most away."
- id: 314
  category: defensive_driving
  question: What should you do if your vehicle stalls in a flooded roadway?
  choices:
    A: Stay inside the vehicle and wait for emergency services.
    B: Roll up the windows to prevent water from entering.
    C: Leave the vehicle immediately and seek higher ground.
    D: Attempt to restart the engine and reverse out of the water.
  answer: C
  explanation: The manual advises, "If your vehicle stalls in a flooded roadway, leave
    it immediately and seek higher ground. Remember it is better to be wet than dead."
- id: 315
  category: safe_driving_rules
  question: Compared to dry pavement, how much distance does it take to stop your
    vehicle on snow or ice?
  choices:
    A: 2 times the normal distance
    B: 4 times the normal distance
    C: 8 times the normal distance
    D: As much as 12 times the normal distance
  answer: D
  explanation: The manual states, "It takes as much as 12 times the normal distance
    to stop on snow or ice as it takes to stop on dry pavement."
- id: 316
  category: vehicle_information
  question: If your vehicle is NOT equipped with anti-lock brakes, how should you
    stop on ice or packed snow?
  choices:
    A: Slam on the brakes and hold the steering wheel firmly.
    B: Pump the brakes by applying and releasing them several times.
    C: Shift into neutral and let the vehicle coast to a stop.
    D: Apply the emergency brake immediately.
  answer: B
  explanation: In a vehicle without anti-lock brakes, you cannot steer unless you
    pump the brakes, applying and releasing them several times until you have the
    vehicle under complete control.
- id: 317
  category: safe_driving_rules
  question: Which headlights should you use when driving in fog or dense smoke?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Daytime running lights only
  answer: B
  explanation: If you must drive in fog or dense smoke conditions, you should use
    your low-beam headlights.
- id: 318
  category: vehicle_information
  question: How often does West Virginia require a state inspection of all vehicles
    to ensure they are in safe driving condition?
  choices:
    A: Every 6 months
    B: Yearly
    C: Every 2 years
    D: Every 5 years
  answer: B
  explanation: West Virginia requires a yearly inspection of all vehicles to ensure
    they are in safe driving condition.
- id: 319
  category: driver_responsibility
  question: To prevent fatigue on a long trip, how often should you take a 10-minute
    rest break?
  choices:
    A: At least every hour
    B: At least every two hours
    C: At least every four hours
    D: Only when you need to refuel
  answer: B
  explanation: If you are on a long trip, the manual recommends taking a 10-minute
    rest break at least every two (2) hours.
- id: 320
  category: safe_driving_rules
  question: During which hours is inbound rush-hour traffic to metropolitan areas
    usually the heaviest?
  choices:
    A: Between 5 am and 7 am
    B: Between 7 am and 9 am
    C: Between 11 am and 1 pm
    D: Between 4 pm and 6 pm
  answer: B
  explanation: Rush-hour traffic is usually inbound to metropolitan areas between
    7 am and 9 am and outbound from these areas between 4 pm and 6 pm.
- id: 321
  category: defensive_driving
  question: What should you do to avoid a crash when another vehicle is passing you?
  choices:
    A: Speed up to prevent them from passing.
    B: Move to the left side of your lane.
    C: Slow down and keep as close to the right side of the road as possible.
    D: Flash your high beams to warn them.
  answer: C
  explanation: To avoid the possibility of a crash with a vehicle passing you, check
    your rear view mirror frequently, know what is going on around you, slow down,
    and keep as close to the right side of the road as possible.
- id: 322
  category: safe_driving_rules
  question: When passing another vehicle, when is it safe to merge back into the right
    lane?
  choices:
    A: As soon as your vehicle is ahead of the other vehicle.
    B: When you see the front headlights of the vehicle you passed in your rear view
      mirror.
    C: When the driver you are passing flashes their headlights.
    D: After you have traveled at least 100 feet past the vehicle.
  answer: B
  explanation: Step 9 of the 10 steps to passing another vehicle safely is to merge
    right when you see the front headlights of the vehicle you passed in your rear
    view mirror.
- id: 323
  category: safe_driving_rules
  question: Which of the following is true regarding your speed when passing another
    vehicle?
  choices:
    A: You may exceed the speed limit by 5 mph to pass safely.
    B: You may exceed the speed limit by 10 mph on interstate highways.
    C: Exceeding the speed limit when passing is illegal.
    D: Speed limits do not apply while actively passing a slower vehicle.
  answer: C
  explanation: The manual explicitly states that exceeding the speed limit when passing
    is illegal. If you have to speed to pass, you probably do not need to pass.
- id: 324
  category: driver_responsibility
  question: According to West Virginia law, who is responsible for ensuring that all
    passengers are buckled into their safety belts?
  choices:
    A: The passengers themselves
    B: The driver of the vehicle
    C: The owner of the vehicle
    D: The front-seat passenger
  answer: B
  explanation: It is the responsibility of the driver to ensure that all passengers
    are buckled into their safety belts.
- id: 325
  category: safe_driving_rules
  question: What is the only legal age exception for wearing a safety belt in a passenger
    vehicle in West Virginia (excluding medical reasons)?
  choices:
    A: Persons 16 years or older riding in the front seat.
    B: Persons 18 years or older who are riding in the back seat.
    C: Persons 21 years or older riding anywhere in the vehicle.
    D: There are no age exceptions for wearing a safety belt.
  answer: B
  explanation: The only legal exception to the safety belt law is for persons 18 years
    or older who are riding in the back seat of a vehicle.
- id: 326
  category: driver_responsibility
  question: Statistics show that wearing safety belts reduces the chances of injury
    or death resulting from collisions by what percentage?
  choices:
    A: 10 to 20 percent
    B: 25 to 30 percent
    C: 45 to 50 percent
    D: 75 to 80 percent
  answer: C
  explanation: Statistics show that wearing safety belts reduces the chances of injury
    or death resulting from collisions by 45 to 50 percent.
- id: 327
  category: safe_driving_rules
  question: West Virginia law requires a child to be properly secured in a child passenger
    safety device system if they are under what age?
  choices:
    A: 4 years old
    B: 6 years old
    C: 8 years old
    D: 10 years old
  answer: C
  explanation: West Virginia law states that every driver who transports a child under
    the age of 8 years must provide for the protection of the child by properly placing
    them in a child passenger safety device system.
- id: 328
  category: defensive_driving
  question: If fog or smoke severely impairs your vision while driving, what is the
    safest course of action?
  choices:
    A: Turn on your high beams and continue at a slow speed.
    B: Pull off to the side of the road, stop, and turn on your hazard lights.
    C: Follow the taillights of the vehicle in front of you closely.
    D: Drive in the center of the road to avoid ditches.
  answer: B
  explanation: If the fog or smoke impairs your vision, you should pull off to the
    side of the road and stop, leave your lights on, and also turn your hazard lights
    on.
- id: 329
  category: vehicle_information
  question: How should a lap safety belt be worn for maximum protection?
  choices:
    A: Loosely across the stomach.
    B: Snugly and comfortably over the lower part of the hips.
    C: High up on the abdomen.
    D: Tucked under the arm.
  answer: B
  explanation: The lap belt should be worn so that it fits snugly and comfortably
    over the lower part of the hips. This will allow for normal bending of the body.
- id: 330
  category: safe_driving_rules
  question: Under West Virginia law, a child under the age of 8 may use a standard
    safety belt instead of a child passenger safety device if they meet what requirement?
  choices:
    A: They weigh more than 60 pounds.
    B: They are at least 4 feet 9 inches tall.
    C: They are riding in the back seat.
    D: They are accompanied by a parent or guardian.
  answer: B
  explanation: The manual states that if a child is under the age of 8 years and at
    least 4'-9" tall, a safety belt shall be sufficient to meet the requirements of
    the child safety seat law.
- id: 331
  category: vehicle_information
  question: How should adjustable head restraints be properly positioned in a vehicle?
  choices:
    A: To fit against the back of your neck.
    B: To fit against the back of your head.
    C: At least three inches above your head.
    D: Tilted forward to support your chin.
  answer: B
  explanation: According to the manual, if head restraints are adjustable, they should
    be positioned to fit against the back of your head, not your neck, to reduce the
    chance of whiplash.
- id: 332
  category: vehicle_information
  question: What is the correct way to brake in an emergency when driving a vehicle
    equipped with an Anti-Lock Brake System (ABS)?
  choices:
    A: Pump the brakes rapidly to avoid wheel lockup.
    B: Push hard on the brake and continue to steer.
    C: Lightly tap the brakes while shifting to a lower gear.
    D: Apply the parking brake while holding the steering wheel straight.
  answer: B
  explanation: The manual instructs that when applying the brake in a vehicle with
    ABS, the driver must continue to steer the vehicle while pushing hard on the brake.
    Pumping ABS brakes will reduce the system's ability to stop safely.
- id: 333
  category: vehicle_information
  question: Which of the following is true regarding the stopping distance of a vehicle
    equipped with an Anti-Lock Brake System (ABS)?
  choices:
    A: ABS will stop a vehicle in half the distance of regular brakes.
    B: ABS improves stopping performance by about 10 percent at best.
    C: ABS allows a vehicle to stop on a dime under all circumstances.
    D: ABS increases the stopping distance by 20 percent.
  answer: B
  explanation: The manual notes that it is a misconception that ABS will stop a vehicle
    in a much shorter distance. In a sudden stop, ABS will improve performance by
    only about 10 percent at best.
- id: 334
  category: safe_driving_rules
  question: To minimize the risk of injury from an air bag deployment, what is the
    safest placement for your hands on the steering wheel?
  choices:
    A: Right hand at 2 o'clock and left hand at 10 o'clock.
    B: Right hand at 3 o'clock and left hand at 9 o'clock.
    C: Right hand at 4 o'clock and left hand at 8 o'clock.
    D: Both hands resting at the 6 o'clock position.
  answer: C
  explanation: The manual states that the driver should hold the steering wheel from
    the side so hands and arms are not between the air bag and their body; the safest
    placement is right hand at 4 o'clock and left hand at 8 o'clock.
- id: 335
  category: safe_driving_rules
  question: Under what circumstances should an infant in a rear-facing safety seat
    be placed in the front passenger seat equipped with an air bag?
  choices:
    A: Only if the passenger seat is pushed all the way back.
    B: Only if the infant is over 20 pounds.
    C: Only when there is no other mode of transportation.
    D: Under no circumstances.
  answer: D
  explanation: 'The manual explicitly states: "If a vehicle is equipped with a passenger-side
    air bag, under NO circumstances should an infant in a rear-facing safety seat
    be placed in the front passenger seat."'
- id: 336
  category: defensive_driving
  question: According to the "Eight Simple Steps to Safe and Happy Driving," what
    should you do if you become lost?
  choices:
    A: Pull over on the side of the road to study your map.
    B: Drive to the nearest well-lit, populated, public place.
    C: Stop in the middle of the road and turn on your hazard lights.
    D: Ask a hitchhiker for directions.
  answer: B
  explanation: 'Step 6 states: "Should you become lost, do not pull over on the side
    of the road to study your map or directions. Instead drive to the nearest well-lit,
    populated, public place such as a service station or restaurant."'
- id: 337
  category: vehicle_information
  question: When checking your brakes before driving, what might it indicate if the
    brake pedal feels spongy?
  choices:
    A: The parking brake needs adjustment.
    B: There may be a leak in the braking system.
    C: There may be air bubbles in the brake line.
    D: The brake pads are completely worn out.
  answer: C
  explanation: The manual explains that when checking brakes, if the pedal feels spongy,
    air bubbles may be in the brake line.
- id: 338
  category: vehicle_information
  question: When using a penny to check your tire tread depth, what indicates that
    your tires are too worn and need replacement?
  choices:
    A: You can see all of Abraham Lincoln's head.
    B: Abraham Lincoln's head is completely hidden.
    C: The penny falls out of the groove.
    D: You can only see the top of the Lincoln Memorial.
  answer: A
  explanation: When checking tread depth with a penny, if you place Lincoln's head
    first into the groove and can see all of his head, your tires are too worn and
    should be replaced.
- id: 339
  category: vehicle_information
  question: Where can you typically find the sticker that indicates the correct "PSI"
    (tire pressure) for your vehicle?
  choices:
    A: On the steering wheel.
    B: On the inside of the car door jamb.
    C: Underneath the floor mats.
    D: On the exterior of the gas tank door.
  answer: B
  explanation: 'The manual states: "Open your car door, on the inside jamb, you should
    see a sticker. Write down or take a picture of the number that says ''PSI''."'
- id: 340
  category: defensive_driving
  question: What is the first thing you should do if you experience a tire blowout
    while driving?
  choices:
    A: Slam on the brakes immediately.
    B: Pump the brakes rapidly to slow down.
    C: Hold tightly to the steering wheel and steer straight ahead.
    D: Shift into neutral and turn off the engine.
  answer: C
  explanation: In the event of a blowout, the manual instructs drivers to "hold tightly
    to the steering wheel, steer straight ahead, and ease up on the accelerator. Do
    not brake until the vehicle is under control."
- id: 341
  category: defensive_driving
  question: If your brakes fail while driving, which of the following actions should
    you take?
  choices:
    A: Shift into a higher gear and accelerate.
    B: Pump the brake pedal quickly.
    C: Turn off the ignition immediately.
    D: Pull the parking brake up as fast and hard as possible.
  answer: B
  explanation: If your brakes fail, the manual advises to "Pump the brake pedal quickly,"
    shift to a lower gear, and use the parking brake while holding the release to
    avoid a skid.
- id: 342
  category: vehicle_information
  question: How can you help prevent your engine from overheating in slow-moving traffic?
  choices:
    A: Shift into neutral and race your engine briefly during stops.
    B: Turn on the vehicle's heater to the highest setting.
    C: Remove the radiator cap while idling.
    D: Pump the gas pedal continuously while moving.
  answer: A
  explanation: 'The manual states: "You can prevent overheating in slow-moving traffic
    by shifting into neutral and racing your engine briefly during stops. This will
    speed up the fan and water pump."'
- id: 343
  category: defensive_driving
  question: If the rear of your vehicle begins to skid to the right, how should you
    steer to regain control?
  choices:
    A: Steer to the left.
    B: Steer to the right.
    C: Keep the steering wheel perfectly straight.
    D: Lock the steering wheel in its current position.
  answer: B
  explanation: 'To steer out of a skid, you should turn your steering wheel in the
    direction of the skid. The manual specifies: "If the rear of your vehicle is skidding
    to the right, turn to the right."'
- id: 344
  category: safe_driving_rules
  question: What should you do if the rear of your vehicle is skidding to the right?
  choices:
    A: Turn your steering wheel to the left.
    B: Turn your steering wheel to the right.
    C: Apply maximum pressure to the brakes.
    D: Shift the vehicle into neutral.
  answer: B
  explanation: If your vehicle is skidding, you should turn in the direction of the
    skid. If the rear of your vehicle is skidding to the right, turn to the right.
- id: 345
  category: vehicle_information
  question: If your gas pedal sticks, what is the first thing you should try to do
    after concentrating on steering?
  choices:
    A: Turn off the ignition immediately.
    B: Apply maximum pressure to the brakes.
    C: Try to free the pedal with your foot.
    D: Shift into reverse.
  answer: C
  explanation: If your gas pedal sticks, you should concentrate on steering, keep
    your eyes on the road, and try to free the pedal with your foot. If that does
    not work, push in the clutch or shift into neutral.
- id: 346
  category: defensive_driving
  question: If your wheels run off the road, how should you return your vehicle to
    the pavement?
  choices:
    A: Turn your wheels gradually onto the pavement.
    B: Turn your wheels sharply onto the pavement.
    C: Accelerate to highway speed before returning.
    D: Brake hard and stop completely on the shoulder.
  answer: B
  explanation: If you run off the road, you should reduce your speed, check for traffic,
    and then turn your wheels sharply onto the pavement. As soon as they hit the edge,
    turn them the other way to keep from heading across the highway.
- id: 347
  category: vehicle_information
  question: Why should you NOT use water to put out a fire in your vehicle?
  choices:
    A: Water will permanently damage the engine block.
    B: Burning gasoline will float on water and spread the fire.
    C: Water can cause a dangerous electrical short circuit.
    D: Water evaporates too quickly to be effective on engine fires.
  answer: B
  explanation: If there is a fire in your vehicle, do not use water because burning
    gasoline will float on water and spread the fire. Use dirt or sand if a chemical
    fire extinguisher is not available.
- id: 348
  category: defensive_driving
  question: If you see a vehicle coming toward you in your lane, why should you avoid
    turning into the lane the vehicle has left?
  choices:
    A: It is illegal to cross the center line in an emergency.
    B: The other driver may realize their mistake and turn back into the proper lane.
    C: You will automatically lose your right-of-way.
    D: Your vehicle is more likely to skid out of control.
  answer: B
  explanation: If a vehicle is approaching in your lane, move to the right, slow down,
    sound your horn, and flash your headlights. Do not turn into the lane the vehicle
    has left, since the driver may realize their mistake and turn back into the proper
    lane.
- id: 349
  category: vehicle_information
  question: When jump-starting a vehicle with a dead battery, where should you connect
    the negative post of the live battery?
  choices:
    A: To the negative post of the dead battery.
    B: To the positive post of the dead battery.
    C: To the engine block or frame of the vehicle with the dead battery.
    D: To the steering wheel column of the vehicle with the dead battery.
  answer: C
  explanation: When jump-starting a vehicle, you should connect the negative post
    of the live battery to the engine block or frame of the vehicle with the dead
    battery.
- id: 350
  category: driver_responsibility
  question: According to the manual, what is the first step in giving first aid to
    an injured victim at a crash scene?
  choices:
    A: Restore breathing
    B: Treat for shock
    C: Protect broken bones
    D: Control bleeding
  answer: D
  explanation: 'The manual states that first aid should be given in the following
    order: 1. Control bleeding, 2. Restore breathing, 3. Treat for shock, 4. Protect
    broken bones.'
- id: 351
  category: driver_responsibility
  question: 'The Good Samaritan Law protects individuals who give emergency care in
    good faith at the scene of a crash from:'
  choices:
    A: Criminal prosecution
    B: Civil damages
    C: Traffic citations
    D: Insurance rate increases
  answer: B
  explanation: The Good Samaritan Law states that anyone who in good faith gives emergency
    care at the scene of a crash, without pay, is not liable for any civil damages
    as the result of any act or omission in giving emergency care.
- id: 352
  category: driver_responsibility
  question: 'You must notify the nearest law enforcement agency if you are involved
    in a crash resulting in injury, death, or property damage of at least:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: If you are involved in a crash resulting in injury or death of any
    person or property damage of $1,000 or more, you must notify the nearest law enforcement
    agency.
- id: 353
  category: driver_responsibility
  question: 'If you strike an unattended vehicle and cannot locate the owner, you
    must:'
  choices:
    A: Wait by the vehicle until the owner returns.
    B: Call a tow truck to remove the vehicle.
    C: Leave a written notice containing your information and circumstances of the
      crash.
    D: Report it to your insurance company within 30 days and leave the scene.
  answer: C
  explanation: If you strike an unattended vehicle and cannot locate the owner, you
    must leave a written notice containing your name, address, license plate number,
    driver’s license number, motor vehicle insurance information, and circumstances
    of the crash.
- id: 354
  category: safe_driving_rules
  question: How can you easily identify a West Virginia Courtesy Patrol vehicle?
  choices:
    A: A red SUV with a flashing red light.
    B: A white pickup truck with blue and gold logos and a flashing orange bar light.
    C: A yellow tow truck with green reflective stripes.
    D: A black sedan with a siren and blue lights.
  answer: B
  explanation: The Courtesy Patrol drivers are in white pickup trucks with easily
    identifiable blue and gold reflective Courtesy Patrol logos and a flashing orange
    bar light on top of the vehicle.
- id: 355
  category: safe_driving_rules
  question: What is the most common type of crash in a work zone?
  choices:
    A: Head-on collisions
    B: Sideswipes
    C: Rear-end crashes
    D: Rollovers
  answer: C
  explanation: Rear-end crashes (running into the rear of a slowing or stopping vehicle)
    are the most common type of work zone crash.
- id: 356
  category: defensive_driving
  question: 'If you suddenly lose steering control and your vehicle starts heading
    toward a pedestrian, you should:'
  choices:
    A: Ease up on the accelerator and wait for the vehicle to slow down.
    B: Apply the brakes quickly, using maximum pressure.
    C: Shift into neutral and sound your horn.
    D: Turn off the ignition immediately.
  answer: B
  explanation: If steering fails and your vehicle starts off the road or toward a
    pedestrian or another vehicle, apply brakes quickly, using maximum pressure.
- id: 357
  category: vehicle_information
  question: If your headlights fail on a dark highway and all other lights fail as
    well, what should you do?
  choices:
    A: Stop immediately in your lane and wait for help.
    B: Stay on the roadway and slow down enough to pull off safely.
    C: Accelerate to reach the nearest exit quickly.
    D: Drive on the shoulder until you reach a gas station.
  answer: B
  explanation: If all lights fail, stay on the roadway and slow down enough to pull
    off the roadway safely.
- id: 358
  category: safe_driving_rules
  question: 'If your vehicle stalls on railroad tracks and a train is coming, you
    should:'
  choices:
    A: Stay in the vehicle and try to restart the engine.
    B: Shift into neutral and try to push the vehicle off the tracks.
    C: Get out of the vehicle and proceed to a safe location.
    D: Sound your horn to warn the train engineer.
  answer: C
  explanation: If a train is coming and your vehicle is stalled on the tracks, get
    out of the vehicle and proceed to a safe location.
- id: 359
  category: defensive_driving
  question: What is the best way to assure a proper following distance, such as when
    driving in a work zone?
  choices:
    A: Use the two-second rule
    B: Use the three-to-four second rule
    C: Stay one car length behind for every 10 mph
    D: Use the five-second rule
  answer: B
  explanation: According to the manual, the best way to assure proper following distance
    is to use the three-to-four second rule.
- id: 360
  category: safe_driving_rules
  question: When is it appropriate to change lanes safely?
  choices:
    A: Whenever you signal your intention for at least 100 feet
    B: Only where pavement markings indicate and traffic conditions permit
    C: At any time if you are driving under the speed limit
    D: Only when passing a slow-moving vehicle on the right
  answer: B
  explanation: The manual states to change lanes only where pavement markings indicate,
    and only when traffic conditions permit.
- id: 361
  category: safe_driving_rules
  question: What should you do when approaching a lane closure?
  choices:
    A: Speed up to pass the closure quickly
    B: Wait until the last moment to merge
    C: Move into the open lane as soon as possible
    D: Stop and wait for a flagger to direct you
  answer: C
  explanation: When approaching lane closures, you should move into the open lane
    as soon as possible and pay close attention to vehicles in your blind spot.
- id: 362
  category: safe_driving_rules
  question: Why should you turn your headlights on from sunset to sunrise, even if
    it isn't required by law?
  choices:
    A: It prevents your battery from dying
    B: It ensures that road workers and other drivers can see you
    C: It helps you see pavement markings better
    D: It reduces the glare from oncoming traffic
  answer: B
  explanation: Turning your headlights on from sunset to sunrise ensures that road
    workers and other drivers can see you.
- id: 363
  category: penalties_and_points
  question: What is the potential fine for a littering conviction in West Virginia?
  choices:
    A: Not less than $10 nor more than $100
    B: Not less than $50 nor more than $1,000
    C: Exactly $500
    D: Not less than $1,000 nor more than $5,000
  answer: B
  explanation: Upon conviction for littering, an individual can be fined not less
    than $50 nor more than $1,000.
- id: 364
  category: penalties_and_points
  question: Upon conviction for littering, an individual can be imprisoned in the
    county jail for up to how many days?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: An individual convicted of littering can be imprisoned in the county
    jail for not more than 60 days.
- id: 365
  category: penalties_and_points
  question: A person convicted of littering may be sentenced to remove litter from
    roadways for a total of not less than how many hours?
  choices:
    A: 10 hours
    B: 20 hours
    C: 30 hours
    D: 40 hours
  answer: C
  explanation: A littering conviction can result in being sentenced to remove litter
    from any public or private roadway for a total of not less than 30 hours.
- id: 366
  category: penalties_and_points
  question: In addition to fines and jail time, what else may happen to a driver convicted
    of littering?
  choices:
    A: Their vehicle will be impounded
    B: They may have points assessed against their driving record
    C: Their license will be permanently revoked
    D: They must retake the driving test
  answer: B
  explanation: The manual notes that a driver may also have "points" assessed against
    their driving record for littering.
- id: 367
  category: driver_responsibility
  question: Which of the following vehicle waste products pose the biggest threats
    to the environment?
  choices:
    A: Dirty motor oil, old tires, antifreeze, and batteries
    B: Windshield wiper fluid and brake pads
    C: Exhaust fumes and air filters
    D: Scrap metal and broken glass
  answer: A
  explanation: The manual states that the waste products posing the biggest threats
    are dirty motor oil, old tires, antifreeze, and batteries.
- id: 368
  category: driver_responsibility
  question: If dumped in a lake, the oil from a single oil change (about a gallon)
    can ruin how much water?
  choices:
    A: A thousand gallons
    B: Ten thousand gallons
    C: A hundred thousand gallons
    D: A million gallons
  answer: D
  explanation: If dumped in a lake, the oil from a single oil change (about a gallon)
    can ruin a million gallons of water.
- id: 369
  category: driver_responsibility
  question: What is a negative consequence of illegally stockpiling used tires?
  choices:
    A: They release toxic gases into the air
    B: They collect water, attract mosquitoes, and become a temptation for arsonists
    C: They contaminate the soil with lead
    D: They dissolve and pollute groundwater
  answer: B
  explanation: When stockpiled illegally, used tires collect water, attract mosquitoes,
    and become a temptation for arsonists.
- id: 370
  category: vehicle_information
  question: Which agency lists antifreeze as a hazardous waste?
  choices:
    A: The Department of Transportation
    B: The Environmental Protection Agency
    C: The Division of Motor Vehicles
    D: The Department of Energy
  answer: B
  explanation: Antifreeze is listed as a hazardous waste by the Environmental Protection
    Agency.
- id: 371
  category: vehicle_information
  question: Old batteries and other hazardous wastes contain large amounts of what
    substances?
  choices:
    A: Lead and sulfuric acid
    B: Mercury and freon
    C: Carbon monoxide and nitrogen
    D: Lithium and alkaline
  answer: A
  explanation: Old batteries and other hazardous wastes contain large amounts of lead
    and sulfuric acid.
- id: 372
  category: driver_responsibility
  question: What are battery retailers required by law to do regarding old batteries?
  choices:
    A: Charge a disposal fee
    B: Send them to a landfill
    C: Recycle them upon request
    D: Refuse to accept them
  answer: C
  explanation: Battery retailers are required by law to recycle old batteries upon
    request.
- id: 373
  category: driver_responsibility
  question: Where can you typically recycle used motor oil for free?
  choices:
    A: At any public landfill
    B: Many auto part retailers and gas stations with service areas
    C: The Division of Motor Vehicles
    D: The Environmental Protection Agency headquarters
  answer: B
  explanation: Many auto part retailers and gas stations with service areas recycle
    used oil for free.
