questions:
- id: 1
  category: license_system
  question: ¿En West Virginia, cuál es la edad mínima para solicitar un Permiso de
    Instrucción de Nivel 1?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 17 años
  answer: B
  explanation: Según el Manual de Licencias de Conducir de West Virginia, el solicitante
    debe tener al menos 15 años para obtener un Permiso de Instrucción de Nivel 1.
- id: 2
  category: license_system
  question: Bajo el sistema de Licencia de Conducir Graduada (GDL) de West Virginia,
    ¿el titular de un Permiso de Instrucción de Nivel 1 debe estar acompañado por
    un conductor con licencia que tenga al menos qué edad?
  choices:
    A: 18 años
    B: 19 años
    C: 21 años
    D: 25 años
  answer: C
  explanation: El titular de un permiso de Nivel 1 debe estar acompañado por un conductor
    con licencia de 21 años o más en el asiento delantero.
- id: 3
  category: license_system
  question: ¿Cuáles son las horas restringidas de conducción para el titular de un
    Permiso de Instrucción de Nivel 1 en West Virginia?
  choices:
    A: 11:00 PM a 4:00 AM
    B: 10:00 PM a 5:00 AM
    C: Medianoche a 6:00 AM
    D: 9:00 PM a 6:00 AM
  answer: B
  explanation: Los titulares de permisos de Nivel 1 tienen prohibido conducir entre
    las 10:00 PM y las 5:00 AM.
- id: 4
  category: license_system
  question: Durante los primeros seis meses de tener una Licencia Intermedia de Nivel
    2 en West Virginia, ¿cuántos pasajeros que no sean familiares menores de 20 años
    puede llevar el conductor?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: A
  explanation: Durante los primeros seis meses de una licencia de Nivel 2, el conductor
    no puede llevar a ningún pasajero que no sea familiar menor de 20 años.
- id: 5
  category: license_system
  question: Después de tener una Licencia Intermedia de Nivel 2 durante seis meses,
    ¿cuántos pasajeros que no sean familiares menores de 20 años se le permite transportar
    al conductor?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ilimitado
  answer: A
  explanation: Después del período inicial de seis meses, un conductor de Nivel 2
    puede transportar a un pasajero que no sea familiar menor de 20 años.
- id: 6
  category: license_system
  question: Para calificar para una Licencia Intermedia de Nivel 2, ¿cuántas horas
    de práctica de conducción certificada debe completar el titular de un permiso
    de Nivel 1?
  choices:
    A: 30 horas (5 de noche)
    B: 40 horas (10 de noche)
    C: 50 horas (10 de noche)
    D: 60 horas (15 de noche)
  answer: C
  explanation: West Virginia requiere 50 horas de práctica, de las cuales al menos
    10 deben ser de noche, certificadas por un padre o tutor.
- id: 7
  category: license_system
  question: ¿En West Virginia, cuántos puntos acumulados en su historial de conducción
    dentro de un período de dos años resultarán en la suspensión de la licencia?
  choices:
    A: 8 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: C
  explanation: Si acumula 12 o más puntos en su historial de conducción, su licencia
    será suspendida.
- id: 8
  category: license_system
  question: Si un estudiante menor de 18 años abandona la escuela o tiene excesivas
    ausencias injustificadas, ¿qué sucede con sus privilegios de conducción en WV?
  choices:
    A: Nada, siempre y cuando tengan una licencia
    B: Su licencia o permiso será suspendido
    C: Debe pagar una multa de $500
    D: Está restringido a conducir solo al trabajo
  answer: B
  explanation: La ley de West Virginia requiere que los estudiantes menores de 18
    años mantengan la elegibilidad escolar (inscripción y asistencia) para conservar
    sus privilegios de conducción.
- id: 9
  category: license_system
  question: ¿Cuál es el requisito mínimo de visión para obtener una licencia de conducir
    de West Virginia sin restricciones?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Los solicitantes deben tener al menos una visión de 20/40 en al menos
    un ojo para aprobar el examen de la vista sin restricciones de lentes correctivos.
- id: 10
  category: license_system
  question: ¿Cuántos días tiene para notificar al DMV de WV sobre un cambio de dirección?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: La ley de West Virginia requiere que notifique al DMV sobre un cambio
    de dirección dentro de los 20 días.
- id: 11
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que el titular de una Licencia
    Intermedia de Nivel 2 pase a una Licencia de Nivel 3?
  choices:
    A: Debe tener al menos 17 años de edad
    B: Debe haber tenido el Nivel 2 durante al menos un año
    C: No debe tener condenas durante 12 meses
    D: Todas las anteriores
  answer: D
  explanation: Para obtener una licencia de Nivel 3, debe tener 17 años, haber tenido
    la licencia de Nivel 2 durante 12 meses y haber permanecido sin condenas durante
    esos 12 meses.
- id: 12
  category: license_system
  question: ¿Cuál es el límite de concentración de alcohol en sangre (BAC) para un
    conductor menor de 21 años en West Virginia?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: West Virginia tiene una ley de "Tolerancia Cero" para menores, estableciendo
    el límite de BAC en 0.02% para conductores menores de 21 años.
- id: 13
  category: license_system
  question: Al solicitar un permiso o licencia de West Virginia, ¿cuántos documentos
    se requieren para demostrar la residencia en WV?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ninguno, si tiene un acta de nacimiento
  answer: B
  explanation: Los solicitantes deben proporcionar dos documentos para demostrar la
    residencia en West Virginia (por ejemplo, facturas de servicios públicos, estados
    de cuenta bancarios).
- id: 14
  category: license_system
  question: Si reprueba el examen de conocimientos de West Virginia, ¿cuánto tiempo
    debe esperar antes de poder realizarlo nuevamente?
  choices:
    A: 24 horas
    B: 48 horas
    C: 7 días
    D: 14 días
  answer: C
  explanation: Si reprueba el examen de conocimientos, debe esperar al menos 7 días
    (una semana) antes de volver a realizar la prueba.
- id: 15
  category: license_system
  question: ¿Cuál de las siguientes acciones está prohibida para los conductores de
    Nivel 1 y Nivel 2 bajo el sistema GDL de WV?
  choices:
    A: Usar un teléfono celular con manos libres
    B: Usar un teléfono celular de mano
    C: Enviar mensajes de texto mientras conduce
    D: Todas las anteriores
  answer: D
  explanation: Bajo la ley de West Virginia, los conductores con GDL tienen prohibido
    el uso de cualquier dispositivo de comunicación inalámbrica (ya sea de mano o
    manos libres) mientras operan un vehículo motorizado.
- id: 16
  category: license_system
  question: Los nuevos residentes de West Virginia que posean una licencia de conducir
    válida de otro estado deben solicitar una licencia de West Virginia dentro de
    ¿cuántos días después de establecer su residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: De acuerdo con el Manual de Licencias de Conducir de West Virginia,
    los nuevos residentes deben transferir su licencia de otro estado a una licencia
    de West Virginia dentro de los 30 días posteriores a establecer su residencia.
- id: 17
  category: license_system
  question: 'En West Virginia, una licencia de conducir estándar para operar un vehículo
    de pasajeros regular se clasifica como:'
  choices:
    A: Licencia Clase A
    B: Licencia Clase D
    C: Licencia Clase E
    D: Licencia Clase G
  answer: C
  explanation: Una licencia Clase E es la licencia de graduación estándar para los
    residentes de West Virginia de 18 años o más, o para aquellos que han completado
    los requisitos del GDL, para operar vehículos no comerciales.
- id: 18
  category: license_system
  question: Bajo el sistema GDL de West Virginia, ¿entre qué horas tiene prohibido
    conducir el titular de una Licencia Intermedia de Nivel 2, a menos que sea por
    motivos específicos de empleo o escuela?
  choices:
    A: 11:00 PM a 4:00 AM
    B: 10:00 PM a 5:00 AM
    C: Medianoche a 6:00 AM
    D: 9:00 PM a 5:00 AM
  answer: B
  explanation: Los titulares de una Licencia Intermedia de Nivel 2 en WV tienen restringido
    conducir entre las 10:00 PM y las 5:00 AM, a menos que viajen por actividades
    autorizadas por la escuela, actividades religiosas o empleo.
- id: 19
  category: license_system
  question: ¿Cuáles son los límites mínimos de cobertura de seguro de responsabilidad
    civil requeridos para un vehículo motorizado registrado en West Virginia?
  choices:
    A: 15/30/10 ($15k por lesiones corporales por persona, $30k por accidente, $10k
      por daños a la propiedad)
    B: 20/40/15 ($20k por lesiones corporales por persona, $40k por accidente, $15k
      por daños a la propiedad)
    C: 25/50/25 ($25k por lesiones corporales por persona, $50k por accidente, $25k
      por daños a la propiedad)
    D: 50/100/50 ($50k por lesiones corporales por persona, $100k por accidente, $50k
      por daños a la propiedad)
  answer: C
  explanation: La ley de West Virginia requiere una cobertura mínima de responsabilidad
    civil de $25,000 por una persona en un accidente, $50,000 por dos o más personas
    en un accidente y $25,000 por daños a la propiedad.
- id: 20
  category: license_system
  question: 'Bajo la ley de "Consentimiento Implícito" de West Virginia, si es arrestado
    por DUI y se niega a someterse a una prueba química de aliento, su licencia será
    revocada por al menos:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Al conducir en las carreteras de WV, usted otorga su consentimiento
    para realizar pruebas químicas. La negativa a realizar la prueba secundaria de
    aliento resulta en la revocación automática de la licencia por un período de un
    año.
- id: 21
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Instrucción de Nivel 1 de West
    Virginia antes de que expire?
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 2 años
  answer: B
  explanation: Un Permiso de Instrucción de Nivel 1 en West Virginia es válido por
    un período de 180 días y no es renovable.
- id: 22
  category: license_system
  question: En el sistema de puntos de West Virginia, ¿cuántos puntos se asignan a
    su historial de conducción por 'Conducción Temeraria' (Reckless Driving)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La conducción temeraria se considera una infracción grave en West Virginia
    y conlleva una penalización de 6 puntos en el historial del conductor.
- id: 23
  category: license_system
  question: Los conductores de West Virginia pueden reducir su conteo total de puntos
    en 3 puntos si completan ¿cuál de los siguientes?
  choices:
    A: Un curso de mantenimiento de vehículos
    B: Un curso aprobado de conducción defensiva
    C: Un año de conducción sin multas
    D: Un programa de servicio comunitario
  answer: B
  explanation: Los conductores que han acumulado puntos pueden completar un curso
    aprobado de conducción defensiva de 8 horas una vez cada 12 meses para eliminar
    3 puntos de su historial.
- id: 24
  category: license_system
  question: Para ser elegible para una Licencia Completa Clase E de Nivel 3, ¿qué
    edad mínima debe tener un conductor de West Virginia?
  choices:
    A: 16 años
    B: 17 años
    C: 18 años
    D: 21 años
  answer: B
  explanation: Bajo el sistema de Licencia Graduada de Conducir (GDL), un conductor
    debe tener al menos 17 años y haber tenido una licencia de Nivel 2 durante al
    menos 12 meses sin ninguna infracción para graduarse a una licencia de Nivel 3.
- id: 25
  category: license_system
  question: Si reprueba el Examen de Habilidades en Carretera de West Virginia (examen
    de conducción), ¿cuánto tiempo debe esperar antes de que se le permita volver
    a tomarlo por primera vez?
  choices:
    A: 24 horas
    B: 48 horas
    C: 7 días
    D: 14 días
  answer: C
  explanation: Si un solicitante reprueba el examen de habilidades en carretera, debe
    esperar un mínimo de 7 días antes de ser elegible para intentar el examen nuevamente.
- id: 26
  category: license_system
  question: 'Si cambia legalmente su nombre por matrimonio u orden judicial, debe
    notificar al DMV de West Virginia y solicitar una licencia corregida dentro de:'
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley de West Virginia requiere que los conductores notifiquen al
    DMV sobre un cambio de nombre legal dentro de los 30 días.
- id: 27
  category: license_system
  question: ¿Qué característica distingue a una licencia de West Virginia que cumple
    con 'Real ID' de una que no cumple?
  choices:
    A: Un fondo azul
    B: Una estrella dorada en la esquina superior derecha
    C: Un sello estatal holográfico
    D: Un banner rojo de 'Menor de 21'
  answer: B
  explanation: Las licencias que cumplen con Real ID en West Virginia presentan una
    estrella dorada en la esquina superior derecha, lo que indica que cumplen con
    los estándares federales de seguridad para abordar aeronaves e ingresar a instalaciones
    federales.
- id: 28
  category: license_system
  question: Para pasar de una Licencia Intermedia de Nivel 2 a una Licencia de Nivel
    3, ¿durante cuántos meses inmediatamente anteriores a la solicitud debe el conductor
    haber permanecido sin condenas?
  choices:
    A: 6 meses
    B: 9 meses
    C: 12 meses
    D: 18 meses
  answer: C
  explanation: Un conductor de Nivel 2 debe tener la licencia durante al menos 12
    meses y permanecer sin condenas durante esos 12 meses antes de poder graduarse
    al Nivel 3.
- id: 29
  category: license_system
  question: ¿Cuál es la tarifa estándar de restablecimiento para una licencia de conducir
    de West Virginia que ha sido suspendida por puntos o razones relacionadas con
    la seguridad?
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: B
  explanation: La tarifa estándar para restablecer una licencia de conducir de West
    Virginia después de una suspensión (no relacionada con DUI) es de $50.
- id: 30
  category: license_system
  question: Al solicitar una licencia de conducir original de West Virginia, ¿cuál
    de los siguientes es un documento requerido para demostrar su identidad?
  choices:
    A: Una tarjeta de biblioteca
    B: Una tarjeta de crédito con foto
    C: Un certificado de nacimiento certificado
    D: Una factura de servicios públicos
  answer: C
  explanation: Un certificado de nacimiento certificado es uno de los documentos principales
    requeridos por el DMV de WV para demostrar la identidad y la presencia legal para
    una solicitud de licencia original.
- id: 31
  category: driver_testing
  question: El examen de conocimientos de West Virginia consta de 25 preguntas de
    opción múltiple. ¿Cuál es el número mínimo de preguntas que debe responder correctamente
    para aprobar?
  choices:
    A: '15'
    B: '17'
    C: '19'
    D: '21'
  answer: C
  explanation: Según el Manual de Licencia de Conducir de West Virginia, los solicitantes
    deben lograr una puntuación de al menos el 76%, lo que equivale a 19 de 25 preguntas
    correctas.
- id: 32
  category: driver_testing
  question: Durante el examen de habilidades viales de West Virginia, ¿cuál de las
    siguientes acciones resultará en una reprobación inmediata?
  choices:
    A: No usar la luz direccional una vez
    B: Golpear un bordillo o acera
    C: Ajustar los espejos antes de comenzar
    D: Conducir con ambas manos en el volante
  answer: B
  explanation: En West Virginia, golpear un bordillo, una acera u otro vehículo durante
    el examen vial resulta en una reprobación automática e inmediata.
- id: 33
  category: driver_testing
  question: ¿Con qué frecuencia debe un vehículo motorizado registrado en West Virginia
    aprobar una inspección de seguridad en una estación de inspección oficial del
    estado?
  choices:
    A: Cada 6 meses
    B: Cada 12 meses
    C: Cada 24 meses
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: La ley de West Virginia exige que todos los vehículos registrados se
    sometan a una inspección de seguridad cada 12 meses.
- id: 34
  category: driver_testing
  question: Según el Manual del Conductor de West Virginia, ¿a cuántos pies de un
    hidrante de incendios no se permite estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: B
  explanation: La ley de West Virginia prohíbe estacionar a menos de 15 pies de un
    hidrante de incendios.
- id: 35
  category: driver_testing
  question: En West Virginia, ¿cuál es la multa mínima por una condena de primera
    ofensa por tirar basura desde un vehículo motorizado?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: Una condena por tirar basura por primera vez en West Virginia conlleva
    una multa mínima de $100 y una máxima de $1,000.
- id: 36
  category: driver_testing
  question: 'La ley de West Virginia exige que los conductores usen los faros delanteros
    siempre que la visibilidad sea inferior a:'
  choices:
    A: 200 pies
    B: 400 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Los faros delanteros deben usarse en West Virginia durante la noche,
    durante niebla/humo/lluvia, o siempre que la visibilidad sea inferior a 500 pies.
- id: 37
  category: driver_testing
  question: Si es condenado por 'Rebasar un autobús escolar detenido' en West Virginia,
    ¿cuántos puntos se añadirán a su historial de conducción?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Rebasar un autobús escolar detenido con sus luces rojas parpadeando
    es una infracción grave en WV y resulta en 6 puntos.
- id: 38
  category: driver_testing
  question: En West Virginia, al estacionar en paralelo en una calle nivelada, ¿a
    cuántas pulgadas del bordillo deben estar las ruedas del lado derecho?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: El Manual del Conductor de West Virginia establece que, al estacionar
    en paralelo, los neumáticos deben estar a menos de 18 pulgadas del bordillo.
- id: 39
  category: driver_testing
  question: Al conducir de noche, la ley de West Virginia exige que baje las luces
    altas de sus faros cuando se encuentre a cuántos pies de un vehículo que viene
    en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Debe cambiar de luces altas a luces bajas cuando un vehículo que viene
    en sentido contrario esté a menos de 500 pies.
- id: 40
  category: driver_testing
  question: 'En West Virginia, debe bajar las luces altas de sus faros cuando siga
    a otro vehículo por detrás a una distancia de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: A
  explanation: La ley de West Virginia exige que los conductores cambien a luces bajas
    cuando sigan a otro vehículo a menos de 200 pies.
- id: 41
  category: driver_testing
  question: 'Según la ley de West Virginia, debe notificar a la policía de inmediato
    si se ve involucrado en un choque que resulte en daños a la propiedad de al menos:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Cualquier choque que resulte en lesiones, muerte o daños totales a
    la propiedad de $500 o más debe ser reportado al departamento de policía más cercano.
- id: 42
  category: driver_testing
  question: En West Virginia, ¿a cuántos pies de un paso de peatones en una intersección
    no se le permite estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: La ley de West Virginia prohíbe estacionar a menos de 20 pies de un
    paso de peatones en una intersección.
- id: 43
  category: driver_testing
  question: 'La ley de West Virginia exige que el freno de servicio de un vehículo
    sea capaz de detener el automóvil desde una velocidad de 20 mph a una distancia
    de:'
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Según el Manual del Conductor de West Virginia, el freno de servicio
    debe poder detener el vehículo en una distancia de 30 pies cuando se viaja a 20
    mph.
- id: 44
  category: driver_testing
  question: En West Virginia, ¿cuántos puntos se asignan a su historial de conducción
    por exceder el límite de velocidad establecido entre 11 y 15 millas por hora?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: B
  explanation: El sistema de puntos de West Virginia asigna 3 puntos por exceder el
    límite de velocidad entre 11 y 15 mph. Exceder el límite entre 1 y 10 mph resulta
    en 2 puntos, y 16 mph o más resulta en 6 puntos.
- id: 45
  category: driver_testing
  question: Según la ley de West Virginia, ¿cuántos puntos se añaden a su historial
    de conducción por una condena de conducción temeraria?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La conducción temeraria se considera una infracción grave en West Virginia
    y resulta en la adición de 6 puntos al historial del conductor.
- id: 46
  category: driver_testing
  question: La ley de West Virginia exige que todos los vehículos motorizados registrados
    en el estado se sometan a una inspección de seguridad, ¿con qué frecuencia?
  choices:
    A: Cada 6 meses
    B: Cada año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: West Virginia requiere una inspección de seguridad anual (una vez al
    año) para todos los vehículos motorizados registrados en el estado para garantizar
    que se encuentren en condiciones de funcionamiento seguras.
- id: 47
  category: driver_testing
  question: Al seguir a otro vehículo por la noche en West Virginia, ¿debe atenuar
    sus luces altas cuando se encuentre a menos de cuántos pies del vehículo que va
    delante?
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: Los conductores en West Virginia deben cambiar a luces bajas cuando
    sigan a otro vehículo a menos de 200 pies para evitar cegar al conductor de adelante
    a través de sus espejos.
- id: 48
  category: driver_testing
  question: 'Según el Manual del Conductor de West Virginia, debe usar sus faros delanteros
    siempre que use los limpiaparabrisas debido a las inclemencias del tiempo. Esto
    se conoce como la:'
  choices:
    A: Wiper-Light Law (Ley de Limpiaparabrisas y Luces)
    B: Clear Vision Act (Ley de Visión Clara)
    C: Safety Visibility Rule (Regla de Visibilidad de Seguridad)
    D: Inclement Weather Mandate (Mandato de Clima Inclemente)
  answer: A
  explanation: La ley de West Virginia exige que si sus limpiaparabrisas están en
    uso debido a la lluvia, la nieve o la niebla, sus faros delanteros también deben
    estar encendidos. Esto se conoce comúnmente como la 'Wiper-Light Law'.
- id: 49
  category: driver_testing
  question: En West Virginia, ¿un conductor debe señalizar su intención de girar al
    menos cuántos pies antes de realizar el giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de West Virginia exige que los conductores den una señal continua
    durante al menos 100 pies antes de girar o cambiar de carril.
- id: 50
  category: driver_testing
  question: En West Virginia, ¿es ilegal estacionar a menos de cuántos pies de un
    hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de West Virginia prohíbe estacionar un vehículo a menos de 15
    pies de un hidrante de incendios.
- id: 51
  category: driver_testing
  question: Al estacionar cerca de una intersección en West Virginia, ¿a cuántos pies
    de distancia como mínimo debe estar de un paso de peatones?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: Según las leyes de tránsito de West Virginia, no se permite estacionar
    a menos de 20 pies de un paso de peatones en una intersección.
- id: 52
  category: driver_testing
  question: En West Virginia, si usted está involucrado en un accidente de tránsito
    que resulte en daños a la propiedad por un total de ____ o más, debe comunicarse
    de inmediato con las autoridades policiales.
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $1,500
  answer: B
  explanation: La ley de West Virginia exige que cualquier accidente que resulte en
    lesiones, muerte o daños totales a la propiedad de $500 o más debe ser reportado
    al departamento de policía más cercano o a la Policía Estatal.
- id: 53
  category: driver_testing
  question: Según la ley de "Hacerse a un lado" (Move Over) de West Virginia, ¿qué
    debe hacer un conductor al acercarse a un vehículo de emergencia autorizado con
    luces intermitentes estacionado a un lado de una carretera de carriles múltiples?
  choices:
    A: Mantener la velocidad pero tocar la bocina
    B: Detenerse por completo hasta que se le indique pasar
    C: Cambiarse a un carril no adyacente si es seguro hacerlo, o reducir la velocidad
      significativamente
    D: Aumentar la velocidad para pasar el área rápidamente
  answer: C
  explanation: La ley Move Over de West Virginia exige que los conductores se muevan
    a un carril que no sea adyacente al vehículo de emergencia si es posible. Si cambiar
    de carril no es seguro, el conductor debe reducir la velocidad y proceder con
    precaución.
- id: 54
  category: driver_testing
  question: En West Virginia, ¿los niños menores de qué edad deben estar debidamente
    asegurados en un sistema de retención infantil aprobado por el gobierno federal?
  choices:
    A: Menores de 4 años
    B: Menores de 6 años
    C: Menores de 8 años
    D: Menores de 10 años
  answer: C
  explanation: La ley de West Virginia exige que cualquier niño menor de ocho (8)
    años debe estar debidamente asegurado en un sistema de retención infantil mientras
    sea transportado en un vehículo motorizado.
- id: 55
  category: driver_responsibility
  question: En West Virginia, ¿debe presentar un informe de accidente por escrito
    (SR-13) ante el DMV si un accidente resulta en daños a la propiedad que excedan
    qué cantidad?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $1,500
  answer: C
  explanation: Según el Manual de Licencias de Conducir de West Virginia, cualquier
    accidente que resulte en lesiones corporales, muerte o daños totales a la propiedad
    por un monto de $1,000 o más debe ser reportado al DMV.
- id: 56
  category: driver_responsibility
  question: Un conductor de West Virginia que acumule puntos en su historial puede
    eliminar 3 puntos haciendo ¿cuál de las siguientes acciones?
  choices:
    A: Conducir durante un año sin recibir una multa
    B: Completar un curso aprobado de conducción defensiva
    C: Pagar una multa doble por la última infracción
    D: Escribir una carta de apelación al Comisionado del DMV
  answer: B
  explanation: El DMV de West Virginia permite a los conductores completar un curso
    aprobado de conducción defensiva de 8 horas para eliminar 3 puntos de su historial,
    siempre que no hayan utilizado esta opción en los últimos 12 meses.
- id: 57
  category: driver_responsibility
  question: En West Virginia, ¿cuál es la penalización en puntos por no ceder el paso
    a un vehículo de emergencia?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: No ceder el paso a un vehículo de emergencia en West Virginia resulta
    en la asignación de 3 puntos contra su licencia de conducir.
- id: 58
  category: driver_responsibility
  question: Si un conductor de West Virginia es condenado por "Hit and Run" (huir
    de la escena de un accidente), ¿cuántos puntos se asignan?
  choices:
    A: 3 puntos
    B: 5 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Huir de la escena de un accidente (Hit and Run) es una infracción grave
    en West Virginia y conlleva una penalización de 6 puntos.
- id: 59
  category: driver_responsibility
  question: Cuando se vende un vehículo en West Virginia, ¿qué debe hacer el vendedor
    con la placa?
  choices:
    A: Dejarla en el vehículo para el nuevo propietario
    B: Destruirla inmediatamente
    C: Quitarla y conservarla o devolverla al DMV
    D: Entregarla al departamento de policía local
  answer: C
  explanation: En West Virginia, la placa pertenece al propietario, no al vehículo.
    Cuando se vende un vehículo, el vendedor debe quitar la placa y puede transferirla
    a otro vehículo de su propiedad o devolverla al DMV.
- id: 60
  category: driver_responsibility
  question: ¿Cuál es el límite de velocidad máximo en las carreteras interestatales
    rurales en West Virginia, a menos que se indique lo contrario?
  choices:
    A: 55 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: Aunque algunas secciones específicas pueden variar, el límite de velocidad
    máximo estándar para las carreteras interestatales rurales en West Virginia es
    de 70 mph.
- id: 61
  category: driver_responsibility
  question: Si su licencia de conducir de West Virginia es revocada por un DUI, ¿qué
    dispositivo se le puede requerir instalar para recuperar los privilegios de conducir?
  choices:
    A: Un regulador de velocidad
    B: Un dispositivo de bloqueo de encendido (IID)
    C: Una unidad de rastreo GPS
    D: Un bloqueo de freno de emergencia
  answer: B
  explanation: West Virginia utiliza el Programa de Prueba y Bloqueo de Alcohol en
    Vehículos Motorizados, que requiere la instalación de un dispositivo de bloqueo
    de encendido (IID) para aquellos condenados por DUI para recuperar privilegios
    de conducir limitados o completos.
- id: 62
  category: driver_responsibility
  question: ¿Cuántos puntos se asignan por exceder el límite de velocidad establecido
    por 15 mph o más en West Virginia?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: C
  explanation: Exceder el límite de velocidad por 15 mph o más en West Virginia resulta
    en la adición de 5 puntos a su historial de manejo.
- id: 63
  category: driver_responsibility
  question: En West Virginia, si usted está involucrado en un accidente, ¿qué otra
    información está obligado por ley a proporcionar a las otras partes involucradas,
    además de su nombre y dirección?
  choices:
    A: Número de Seguro Social
    B: Número de registro e información del seguro
    C: Información de contacto del empleador
    D: Una copia de su certificado de nacimiento
  answer: B
  explanation: La ley de WV exige que los conductores involucrados en un accidente
    intercambien su nombre, dirección, número de registro del vehículo e información
    del seguro con los demás involucrados.
- id: 64
  category: driver_responsibility
  question: ¿Cuál es la penalización en puntos por 'No respetar una señal de alto'
    en West Virginia?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: No respetar una señal de alto o una señal de control de tráfico en
    West Virginia resulta en la asignación de 3 puntos en su historial de manejo.
- id: 65
  category: driver_responsibility
  question: Si un conductor de West Virginia es condenado por una primera infracción
    de 'Sin seguro', ¿cuál es el período obligatorio de suspensión de la licencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: Hasta que se proporcione prueba de seguro y se pague una tarifa de reinstalación
  answer: D
  explanation: Para una primera infracción por conducir sin seguro, la licencia de
    conducir se suspende hasta que el conductor proporcione prueba de seguro y pague
    la tarifa de reinstalación requerida.
- id: 66
  category: driver_responsibility
  question: Según la ley de West Virginia, un niño debe estar asegurado en un sistema
    de retención infantil (asiento de seguridad o asiento elevador) hasta que alcance
    ¿qué edad o estatura?
  choices:
    A: 6 años de edad o 4 pies de altura
    B: 8 años de edad o 4 pies y 9 pulgadas de altura
    C: 10 años de edad o 5 pies de altura
    D: 12 años de edad o 4 pies y 11 pulgadas de altura
  answer: B
  explanation: La ley de West Virginia exige que los niños menores de 8 años estén
    debidamente asegurados en un sistema de retención infantil. Si el niño es menor
    de 8 años pero mide al menos 4'9" de altura, un cinturón de seguridad estándar
    es suficiente.
- id: 67
  category: driver_responsibility
  question: Al acercarse a un vehículo de emergencia estacionario con luces intermitentes
    en una carretera de varios carriles en West Virginia, ¿qué le exige hacer la ley
    de 'Moverse al carril contiguo' (Move Over)?
  choices:
    A: Detenerse por completo hasta que el vehículo se retire
    B: Mantener la velocidad pero tocar la bocina
    C: Moverse a un carril no adyacente si es seguro, o reducir la velocidad significativamente
      si no es posible cambiar de carril
    D: Acelerar para pasar el área lo más rápido posible
  answer: C
  explanation: La ley Move Over de West Virginia exige que los conductores se muevan
    a un carril que no sea adyacente al vehículo de emergencia si es seguro hacerlo.
    Si no es posible cambiar de carril, el conductor debe reducir la velocidad y proceder
    con precaución.
- id: 68
  category: driver_responsibility
  question: ¿Cuál es la penalización por una condena de primera infracción por rebasar
    a un autobús escolar que tiene sus luces rojas intermitentes encendidas y el brazo
    de parada extendido en West Virginia?
  choices:
    A: Solo una multa de $50
    B: Una suspensión de la licencia por 30 días y 2 puntos
    C: Una suspensión obligatoria de la licencia de al menos 60 días y una multa de
      $500 a $1,000
    D: Revocación permanente de los privilegios de conducir
  answer: C
  explanation: Rebasar a un autobús escolar detenido es una infracción grave en WV.
    Una primera infracción resulta en una multa de $500 a $1,000 y una suspensión
    obligatoria de la licencia de conducir de 60 días.
- id: 69
  category: driver_responsibility
  question: Cuando compra un vehículo a un particular en West Virginia, ¿dentro de
    cuántos días debe titularlo y registrarlo para evitar una multa por retraso?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: La ley de West Virginia exige que los títulos de los vehículos se transfieran
    y registren dentro de los 60 días posteriores a la fecha de compra para evitar
    una tarifa por titulación tardía.
- id: 70
  category: driver_responsibility
  question: 'En West Virginia, es ilegal dejar un vehículo motorizado sin supervisión
    sin antes:'
  choices:
    A: Apagar el motor y quitar la llave de encendido
    B: Dejar las ventanas entreabiertas para ventilación
    C: Activar el sistema de alarma
    D: Colocar un letrero de 'Se vende' en la ventana
  answer: A
  explanation: El Código de WV §17C-14-1 establece que ninguna persona que conduzca
    o esté a cargo de un vehículo motorizado permitirá que este permanezca sin supervisión
    sin antes detener el motor, bloquear el encendido y quitar la llave.
- id: 71
  category: driver_responsibility
  question: ¿Cuál es el nombre del formulario oficial requerido en West Virginia para
    demostrar que tiene el seguro de responsabilidad civil mínimo requerido?
  choices:
    A: Formulario SR-22
    B: Formulario WV-1
    C: Formulario ID-44
    D: Formulario insurance-101
  answer: B
  explanation: El WV-1 es el formulario de Certificado de Seguro que sirve como prueba
    oficial de responsabilidad financiera en West Virginia.
- id: 72
  category: driver_responsibility
  question: 'En West Virginia, si es condenado por conducir bajo los efectos del alcohol
    o las drogas (DUI) con un niño menor de edad en el vehículo, la infracción se
    clasifica como:'
  choices:
    A: Una simple infracción de tránsito
    B: Un delito menor con una sentencia de cárcel obligatoria de 2 días a 12 meses
    C: Un delito grave con una sentencia de 5 años de prisión
    D: Una infracción que no conlleva sanciones adicionales
  answer: B
  explanation: Conducir bajo los efectos del alcohol o las drogas (DUI) con un menor
    en el vehículo es un delito menor específico en West Virginia que conlleva una
    pena de cárcel obligatoria de 48 horas a un año y una multa.
- id: 73
  category: driver_responsibility
  question: Si un conductor de West Virginia se ve involucrado en un accidente y la
    policía no lo investiga, ¿cuántos días tiene el conductor para presentar un informe
    ante el DMV?
  choices:
    A: 24 horas
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Si un choque no es investigado por un oficial de la ley y resulta en
    lesiones, muerte o daños a la propiedad superiores a $1,000, el conductor debe
    presentar un informe ante el DMV en un plazo de 10 días.
- id: 74
  category: safe_driving_rules
  question: En West Virginia, ¿cuál es el límite de velocidad máximo en una zona escolar
    mientras hay niños presentes o cuando lo indica una luz intermitente?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Según el Manual de Licencias de Conducir de West Virginia, el límite
    de velocidad en una zona escolar es de 15 mph cuando hay niños presentes o cuando
    una luz intermitente está funcionando.
- id: 75
  category: safe_driving_rules
  question: Al planear girar, la ley de West Virginia exige que señalice su intención
    al menos ¿cuántos pies antes del giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Debe señalizar su intención de girar al menos 100 pies antes de realizar
    el giro para dar suficiente aviso a los demás conductores.
- id: 76
  category: safe_driving_rules
  question: Según la ley de West Virginia, ¿cuándo es obligatorio usar los faros delanteros
    en relación con los limpiaparabrisas?
  choices:
    A: Solo cuando los limpiaparabrisas están a alta velocidad
    B: Solo durante la lluvia nocturna
    C: Siempre que los limpiaparabrisas estén en uso debido a las inclemencias del
      tiempo
    D: Solo cuando la visibilidad es inferior a 100 pies
  answer: C
  explanation: La ley de West Virginia exige que los faros delanteros se enciendan
    siempre que los limpiaparabrisas estén en uso debido a la lluvia, nieve, aguanieve
    u otras condiciones atmosféricas desfavorables.
- id: 77
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada para un vehículo de pasajeros
    que viaja en buenas condiciones climáticas en West Virginia?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de West Virginia recomienda una distancia de
    seguimiento de al menos 3 segundos detrás del vehículo que tiene delante.
- id: 78
  category: safe_driving_rules
  question: En West Virginia, ¿está prohibido rebasar a cuántos pies de una intersección,
    cruce de ferrocarril, puente, viaducto o túnel?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Según las leyes de tránsito de West Virginia, no puede conducir por
    el lado izquierdo de la calzada al acercarse a menos de 100 pies de cualquier
    intersección, cruce ferroviario a nivel, puente, viaducto o túnel.
- id: 79
  category: safe_driving_rules
  question: Al conducir de noche en West Virginia, debe bajar las luces altas cuando
    un vehículo que viene en sentido contrario esté a menos de ¿cuántos pies?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de West Virginia exige que baje las luces altas cuando un vehículo
    que viene en sentido contrario esté a menos de 500 pies.
- id: 80
  category: safe_driving_rules
  question: En West Virginia, si se encuentra en una carretera dividida por una mediana
    o barrera física, ¿tiene que detenerse ante un autobús escolar que se aproxima
    en dirección opuesta con las luces rojas intermitentes?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar
    B: No, no es necesario detenerse si hay una mediana o barrera
    C: Sí, pero solo si el conductor del autobús le indica que se detenga
    D: No, pero debe reducir la velocidad a 15 mph
  answer: B
  explanation: En West Virginia, el conductor de un vehículo en una carretera con
    calzadas separadas (divididas por una mediana o barrera) no necesita detenerse
    al encontrarse o pasar a un autobús escolar que se encuentra en una calzada diferente.
- id: 81
  category: safe_driving_rules
  question: ¿En West Virginia, qué sucede con la multa por exceso de velocidad en
    una zona de obras viales cuando hay trabajadores presentes?
  choices:
    A: La multa se exonera por la primera infracción
    B: La multa se duplica
    C: La multa se triplica
    D: La multa sigue siendo la misma pero los puntos se duplican
  answer: B
  explanation: La ley de West Virginia exige que las multas por exceso de velocidad
    se dupliquen en las zonas de obras cuando hay trabajadores presentes.
- id: 82
  category: safe_driving_rules
  question: Al estacionar su vehículo en una vía pública en West Virginia, ¿a qué
    distancia debe estar de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de West Virginia prohíbe estacionar a menos de 15 pies de un
    hidrante de incendios.
- id: 83
  category: safe_driving_rules
  question: En West Virginia, ¿se prohíbe estacionar a menos de cuántos pies de una
    señal de alto (stop), una baliza intermitente o una señal de control de tráfico?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Según el Código de West Virginia §17C-13-3, no se puede estacionar
    a menos de 30 pies de cualquier baliza intermitente, señal de alto o señal de
    control de tráfico ubicada al costado de una calzada.
- id: 84
  category: safe_driving_rules
  question: En West Virginia, ¿no puede adelantar a otro vehículo cuando se encuentre
    a menos de cuántos pies de una intersección o un cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 200 pies
  answer: C
  explanation: La ley de West Virginia prohíbe adelantar al acercarse a menos de 100
    pies de, o al atravesar, cualquier intersección o cruce de ferrocarril a nivel.
- id: 85
  category: safe_driving_rules
  question: Bajo el sistema de puntos del DMV de West Virginia, ¿cuántos puntos se
    asignan por exceso de velocidad en una zona escolar?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: D
  explanation: El exceso de velocidad en una zona escolar se considera una infracción
    grave en West Virginia y resulta en la adición de 6 puntos a su historial de conducción.
- id: 86
  category: safe_driving_rules
  question: Cuando un autobús escolar se detiene en una carretera de cuatro carriles
    con sus luces rojas intermitentes y el brazo de parada extendido, ¿qué conductores
    deben detenerse?
  choices:
    A: Solo los conductores que siguen al autobús
    B: Solo los conductores en el carril contiguo al autobús
    C: Los conductores en todos los carriles y en ambas direcciones, a menos que haya
      una mediana o barrera física
    D: Nadie está obligado a detenerse en una carretera de cuatro carriles
  answer: C
  explanation: En West Virginia, debe detenerse ante un autobús escolar desde cualquier
    dirección en cualquier carretera, a menos que sea una carretera dividida con una
    barrera física o una franja mediana.
- id: 87
  category: safe_driving_rules
  question: 'En West Virginia, se considera que un conductor tiene un ''DUI Agravado''
    si su concentración de alcohol en sangre (BAC) es igual o superior a:'
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: La ley de West Virginia define el DUI Agravado como la operación de
    un vehículo motorizado con un BAC de 0.15% o superior, lo cual conlleva sanciones
    más severas que un DUI estándar.
- id: 88
  category: safe_driving_rules
  question: 'Para mantener una distancia de seguimiento segura, el Manual del Conductor
    de West Virginia recomienda utilizar la:'
  choices:
    A: Regla de un segundo
    B: Regla de dos segundos
    C: Regla de tres segundos
    D: Regla de cuatro segundos
  answer: C
  explanation: El Manual del Conductor de West Virginia recomienda la 'regla de los
    tres segundos' para garantizar una distancia de seguimiento segura detrás del
    vehículo que le precede.
- id: 89
  category: safe_driving_rules
  question: 'Al estacionar un vehículo cuesta arriba en una calle de doble sentido
    con acera (bordillo), debe girar las ruedas delanteras:'
  choices:
    A: Hacia la acera
    B: En dirección contraria a la acera
    C: Paralelas a la acera
    D: Hacia la derecha
  answer: B
  explanation: Al estacionar cuesta arriba con acera, gire las ruedas en dirección
    contraria a la acera (hacia la izquierda) para que, si el vehículo rueda, golpee
    la acera y se detenga.
- id: 90
  category: safe_driving_rules
  question: 'La ley ''Move Over'' (Moverse de carril) de West Virginia exige que los
    conductores que se acerquen a un vehículo de emergencia autorizado con luces intermitentes
    deben:'
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Acelerar para pasar el vehículo rápidamente
    C: Moverse a un carril no adyacente o reducir la velocidad significativamente
      si cambiar de carril no es seguro
    D: Solo moverse de carril si el vehículo de emergencia está en movimiento
  answer: C
  explanation: El Código de West Virginia §17C-14-9a exige que los conductores cedan
    el paso moviéndose a un carril que no sea adyacente al vehículo de emergencia
    o, si eso no es posible, reducir la velocidad y proceder con precaución.
- id: 91
  category: safe_driving_rules
  question: 'En West Virginia, si lo sorprenden excediendo el límite de velocidad
    en una zona de construcción de carreteras mientras hay trabajadores presentes,
    la multa se:'
  choices:
    A: Aumenta en $50
    B: Duplica
    C: Triplica
    D: Se exonera para infractores por primera vez
  answer: B
  explanation: Según la ley de West Virginia, las multas por exceso de velocidad se
    duplican en las zonas de obras cuando hay trabajadores presentes.
- id: 92
  category: defensive_driving
  question: Según el Manual de Licencias de Conducir de West Virginia, ¿cuál es la
    distancia de seguimiento recomendada detrás del vehículo que va delante de usted
    en condiciones ideales?
  choices:
    A: El largo de un vehículo por cada 10 mph
    B: Dos segundos
    C: De tres a cuatro segundos
    D: Cinco segundos
  answer: C
  explanation: West Virginia recomienda una distancia de seguimiento de al menos tres
    a cuatro segundos para permitir suficiente tiempo para reaccionar ante los peligros.
- id: 93
  category: defensive_driving
  question: En West Virginia, ¿a qué velocidad puede comenzar el hidroplaneo (hydroplaning)
    cuando sus neumáticos pierden contacto con la superficie de la carretera durante
    una lluvia intensa?
  choices:
    A: Tan baja como 35 mph
    B: Solo por encima de 55 mph
    C: A 25 mph
    D: Solo cuando se usa el control de crucero
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    En una lluvia intensa, sus neumáticos pueden perder todo contacto con la carretera
    a 55 mph.
- id: 94
  category: defensive_driving
  question: 'Para evitar frenar a último momento o la necesidad de girar repentinamente,
    las reglas de conducción defensiva de West Virginia sugieren que debe mirar hacia
    adelante en la carretera al menos:'
  choices:
    A: 5 segundos hacia adelante
    B: De 10 a 15 segundos hacia adelante
    C: De 20 a 30 segundos hacia adelante
    D: Solo una cuadra de la ciudad
  answer: B
  explanation: Escanear de 10 a 15 segundos hacia adelante le permite ver los peligros
    con anticipación y ajustar su velocidad o posición de manera segura.
- id: 95
  category: defensive_driving
  question: Al conducir con niebla densa en West Virginia, ¿qué luces debe usar para
    garantizar la máxima visibilidad y seguridad?
  choices:
    A: Luces altas (high beam)
    B: Solo luces de estacionamiento
    C: Luces bajas (low beam)
    D: Luces de emergencia
  answer: C
  explanation: Se deben usar las luces bajas en la niebla. Las luces altas se reflejan
    en la niebla y causan deslumbramiento, lo que dificulta la visión.
- id: 96
  category: defensive_driving
  question: Según la ley de West Virginia, ¿cuál es la multa por una primera infracción
    por usar un teléfono celular de mano o enviar mensajes de texto mientras conduce?
  choices:
    A: Solo una advertencia verbal
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: La multa por una primera infracción por usar un dispositivo de comunicación
    inalámbrica de mano mientras se conduce en West Virginia es de $100.
- id: 97
  category: defensive_driving
  question: ¿En cuál de las siguientes condiciones las carreteras están más resbaladizas
    en West Virginia?
  choices:
    A: Después de que ha estado lloviendo durante varias horas
    B: Justo después de que comienza a llover
    C: Cuando la temperatura es superior a 90 grados
    D: Durante un aguacero intenso
  answer: B
  explanation: Las carreteras están más resbaladizas justo después de que comienza
    a llover porque el agua se mezcla con el aceite y el polvo en la superficie de
    la carretera para crear una capa resbaladiza.
- id: 98
  category: defensive_driving
  question: 'Si su vehículo está equipado con un Sistema de Frenos Antibloqueo (ABS)
    y necesita detenerse rápidamente en una emergencia, usted debe:'
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y constante al pedal del freno
    C: Tocar ligeramente los frenos
    D: Cambiar a neutral y usar el freno de emergencia
  answer: B
  explanation: Con el ABS, debe aplicar una presión firme y constante. Bombear los
    frenos es innecesario y puede desactivar el sistema ABS.
- id: 99
  category: defensive_driving
  question: 'Al seguir a una motocicleta en West Virginia, debe aumentar su distancia
    de seguimiento porque:'
  choices:
    A: Las motocicletas tienen una distancia de frenado más corta que los automóviles
    B: Las motocicletas son más rápidas que los automóviles
    C: Las motocicletas están legalmente obligadas a tener más espacio
    D: Las motocicletas siempre viajan por debajo del límite de velocidad
  answer: A
  explanation: Las motocicletas pueden detenerse mucho más rápido que los vehículos
    más grandes; por lo tanto, debe aumentar su distancia de seguimiento para evitar
    una colisión por alcance.
- id: 100
  category: defensive_driving
  question: 'En West Virginia, la ley estatal exige que encienda los faros delanteros
    siempre que use los limpiaparabrisas debido a las inclemencias del tiempo. Esto
    a menudo se conoce como:'
  choices:
    A: La Ley de Visibilidad
    B: La ley de 'Limpiaparabrisas encendidos, luces encendidas' (Wipers On, Lights
      On)
    C: La Regla de Seguridad Meteorológica
    D: El Mandato de Condiciones Inclementes
  answer: B
  explanation: El Código de WV §17C-15-2 exige que los automovilistas enciendan los
    faros delanteros siempre que los limpiaparabrisas estén en uso debido a la lluvia,
    la nieve o el aguanieve.
- id: 101
  category: defensive_driving
  question: Para evitar la necesidad de frenar o girar en el último momento en el
    tráfico de West Virginia, ¿con cuánta anticipación debe observar el camino?
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 15 segundos
    C: De 20 a 25 segundos
    D: 30 segundos
  answer: B
  explanation: El Manual del Conductor de WV recomienda observar de 10 a 15 segundos
    hacia adelante para identificar posibles peligros con anticipación.
- id: 102
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (pérdida de contacto de
    los neumáticos con la superficie de la carretera) en las carreteras mojadas de
    West Virginia?
  choices:
    A: A tan solo 35 mph
    B: Solo por encima de 55 mph
    C: Exactamente a 45 mph
    D: Solo durante aguaceros intensos a 65 mph
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph,
    y a 55 mph, los neumáticos pueden perder todo contacto con la carretera.
- id: 103
  category: defensive_driving
  question: Al conducir por carreteras resbaladizas (nieve o hielo) en West Virginia,
    ¿cómo debe ajustar su distancia de seguimiento?
  choices:
    A: Mantener la distancia estándar de 3 segundos
    B: Aumentarla a al menos 6 segundos o más
    C: Disminuirla a 1 segundo para mantenerse en las huellas del auto de adelante
    D: La distancia de seguimiento no importa si tiene neumáticos de invierno
  answer: B
  explanation: En condiciones adversas como nieve o hielo, debe duplicar o triplicar
    su distancia de seguimiento para permitir un mayor tiempo de frenado.
- id: 104
  category: defensive_driving
  question: 'En West Virginia, debe usar sus faros delanteros desde:'
  choices:
    A: Una hora después del atardecer hasta una hora antes del amanecer
    B: El atardecer hasta el amanecer
    C: De 8:00 PM a 6:00 AM
    D: Solo desde el anochecer hasta el alba
  answer: B
  explanation: La ley de West Virginia exige que los faros delanteros estén encendidos
    desde el atardecer hasta el amanecer y siempre que la visibilidad sea inferior
    a 500 pies.
- id: 105
  category: defensive_driving
  question: Al rebasar una bicicleta que circula en la misma dirección en una carretera
    de West Virginia, ¿cuál es la distancia mínima que debe mantener entre su vehículo
    y la bicicleta?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: La ley de West Virginia exige que los automovilistas dejen una distancia
    de seguridad no inferior a tres pies al rebasar una bicicleta.
- id: 106
  category: defensive_driving
  question: 'Al acercarse a un cruce de ferrocarril en West Virginia con las barreras
    bajadas o luces intermitentes, debe detener su vehículo a una distancia de:'
  choices:
    A: Entre 5 y 10 pies del riel más cercano
    B: Entre 15 y 50 pies del riel más cercano
    C: Entre 50 y 100 pies del riel más cercano
    D: Exactamente 25 pies del riel más cercano
  answer: B
  explanation: El Código de WV §17C-12-1 establece que debe detenerse entre 15 y 50
    pies del riel más cercano en un cruce de ferrocarril.
- id: 107
  category: alcohol_drugs_health
  question: En West Virginia, ¿cuál es la multa máxima por una primera infracción
    de DUI con una concentración de alcohol en sangre (BAC) entre .08 y .15?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,500
  answer: B
  explanation: Para una primera infracción de DUI en West Virginia donde el BAC es
    de al menos .08 pero inferior a .15, la multa oscila entre $100 y $500, más las
    costas judiciales.
- id: 108
  category: alcohol_drugs_health
  question: 'En West Virginia, un ''DUI agravado'' se define como la operación de
    un vehículo con una concentración de alcohol en sangre (BAC) de al menos:'
  choices:
    A: 0.10%
    B: 0.12%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: La ley de West Virginia define un DUI agravado como tener un BAC de
    0.15% o superior, lo que conlleva sanciones más severas que un DUI estándar.
- id: 109
  category: alcohol_drugs_health
  question: ¿Cuál es la sentencia mínima obligatoria de cárcel por una primera infracción
    de 'DUI agravado' (BAC de .15 o superior) en West Virginia?
  choices:
    A: 24 horas
    B: 48 horas
    C: 10 días
    D: 30 días
  answer: B
  explanation: Una primera infracción de DUI agravado en West Virginia requiere una
    pena de cárcel mínima obligatoria de 48 horas, y hasta seis meses.
- id: 110
  category: alcohol_drugs_health
  question: 'Bajo la ley de Tolerancia Cero de West Virginia, a un conductor menor
    de 21 años que sea condenado por conducir con un BAC de .02 o más pero menos de
    .08 se le revocará la licencia por:'
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Una primera infracción de la ley de Tolerancia Cero para un conductor
    menor de 21 años resulta en la revocación de la licencia por 60 días.
- id: 111
  category: alcohol_drugs_health
  question: En West Virginia, si se le condena por conducir bajo los efectos del alcohol
    o drogas (DUI) mientras transporta a una persona menor de 16 años, se considera
    "Peligro para menores" (Child Endangerment). ¿Cuál es la sentencia mínima de cárcel?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 1 semana
  answer: B
  explanation: Conducir bajo los efectos del alcohol o drogas (DUI) con un menor en
    el vehículo (Peligro para menores) conlleva una sentencia de cárcel mínima obligatoria
    de 48 horas y un máximo de 12 meses.
- id: 112
  category: alcohol_drugs_health
  question: ¿A qué se refiere el programa "Test and Lock" (Prueba y Bloqueo) de West
    Virginia?
  choices:
    A: Un programa obligatorio de pruebas de detección de drogas para estudiantes
      de secundaria
    B: Un programa de interbloqueo de encendido para infractores de DUI
    C: Un sistema de registro antirrobo de vehículos
    D: El proceso para probar los frenos durante una inspección estatal
  answer: B
  explanation: El programa "Test and Lock" es el Programa de Interbloqueo de Encendido
    de West Virginia, que permite a los infractores de DUI conducir durante su período
    de revocación si instalan un dispositivo de prueba de aliento en su automóvil.
- id: 113
  category: alcohol_drugs_health
  question: En West Virginia, ¿cuál es el límite de concentración de alcohol en sangre
    (BAC) para un conductor que opera un Vehículo Motorizado Comercial (CMV)?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Se considera que los conductores comerciales en West Virginia están
    legalmente incapacitados si su BAC es de 0.04% o superior.
- id: 114
  category: alcohol_drugs_health
  question: 'Si se le condena por una segunda infracción de DUI dentro de un período
    de 10 años en West Virginia, su licencia de conducir será revocada por:'
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: 10 años
  answer: D
  explanation: Una segunda infracción de DUI dentro de 10 años en West Virginia resulta
    en una revocación de la licencia por 10 años, aunque la participación en el programa
    de Interbloqueo (Interlock) puede otorgar privilegios de conducción antes.
- id: 115
  category: alcohol_drugs_health
  question: 'En West Virginia, si lo sorprenden conduciendo mientras su licencia está
    revocada por DUI, la sentencia mínima obligatoria de cárcel por una primera infracción
    es:'
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 6 meses
  answer: B
  explanation: Conducir con una licencia revocada por DUI es una infracción grave
    en West Virginia, que conlleva una sentencia mínima obligatoria de cárcel de 30
    días.
- id: 116
  category: alcohol_drugs_health
  question: Según el Manual del Conductor de West Virginia, ¿cuál es la única forma
    de reducir la cantidad de alcohol en su organismo?
  choices:
    A: Beber café solo (negro)
    B: Tomar una ducha fría
    C: Hacer ejercicio vigorosamente
    D: Dejar que pase el tiempo
  answer: D
  explanation: Solo el tiempo permite que el cuerpo procese y elimine el alcohol.
    El café, las duchas y el ejercicio no disminuyen el BAC.
- id: 117
  category: alcohol_drugs_health
  question: En West Virginia, si un conductor tiene una condición médica como la epilepsia,
    ¿por cuánto tiempo debe estar generalmente libre de convulsiones antes de que
    se le pueda otorgar la licencia para conducir?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: West Virginia generalmente requiere que un conductor con un trastorno
    convulsivo esté libre de convulsiones durante 6 meses y proporcione un informe
    médico de un médico.
- id: 118
  category: alcohol_drugs_health
  question: ¿Qué sucede si se le condena por un DUI en otro estado mientras posee
    una licencia de conducir de West Virginia?
  choices:
    A: Nada; West Virginia solo rastrea las infracciones dentro del estado
    B: La condena se informará a WV y su licencia será revocada como si hubiera ocurrido
      en WV
    C: Solo tendrá que pagar una multa a West Virginia
    D: Su licencia será suspendida por exactamente 10 días
  answer: B
  explanation: West Virginia participa en el Pacto de Licencias de Conducir (Driver
    License Compact); las condenas por DUI fuera del estado se informan al estado
    de origen y resultan en las mismas sanciones que si hubieran ocurrido en West
    Virginia.
- id: 119
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los medicamentos
    recetados y la conducción en West Virginia?
  choices:
    A: No puede ser arrestado por DUI si el medicamento fue recetado legalmente
    B: Los medicamentos recetados solo son peligrosos si se mezclan con alcohol
    C: Puede ser condenado por DUI si un medicamento recetado afecta su capacidad
      para conducir de manera segura
    D: Solo las drogas de la "Lista I" (Schedule I) pueden dar lugar a un cargo de
      DUI
  answer: C
  explanation: En West Virginia, un conductor puede ser acusado de DUI por estar bajo
    la influencia de cualquier sustancia controlada o droga, incluidas las recetas
    legales, si esto afecta su conducción.
- id: 120
  category: alcohol_drugs_health
  question: ¿Qué es el "efecto sinérgico" mencionado en la educación vial con respecto
    al alcohol y las drogas?
  choices:
    A: El cuerpo procesando el alcohol más rápido cuando hay drogas presentes
    B: El efecto combinado del alcohol y las drogas es mayor que la suma de sus efectos
      individuales
    C: La capacidad de las drogas para anular los efectos del alcohol
    D: Un tipo específico de prueba de sobriedad en la carretera
  answer: B
  explanation: El efecto sinérgico ocurre cuando se consumen alcohol y drogas juntos,
    lo que causa un deterioro mucho mayor que el que causaría cualquiera de las sustancias
    por sí sola.
- id: 121
  category: alcohol_drugs_health
  question: 'En West Virginia, si usted se ve involucrado en un choque fatal y un
    oficial de la ley tiene motivos razonables para creer que conducía bajo los efectos
    del alcohol o drogas (DUI):'
  choices:
    A: Puede optar por realizar la prueba 24 horas después
    B: Se le requiere someterse a un análisis de sangre bajo el consentimiento implícito
    C: Solo tiene que realizar una prueba de aliento, nunca un análisis de sangre
    D: No se le puede realizar ninguna prueba sin una confesión por escrito
  answer: B
  explanation: Bajo las leyes de consentimiento implícito de West Virginia, si hay
    una fatalidad y motivos razonables de DUI, usted debe someterse a pruebas químicas,
    que pueden incluir un análisis de sangre.
- id: 122
  category: alcohol_drugs_health
  question: ¿Cuál es la multa máxima en West Virginia por una primera ofensa de DUI
    con una concentración de alcohol en sangre (BAC) inferior al 0.15%?
  choices:
    A: Hasta $100
    B: Hasta $500
    C: Hasta $1,000
    D: Hasta $2,500
  answer: B
  explanation: Una primera ofensa de DUI no agravado (BAC < 0.15%) en West Virginia
    conlleva una multa que oscila entre $100 y $500, más los costos judiciales.
- id: 123
  category: alcohol_drugs_health
  question: ¿Quién es responsable de los costos asociados con el Programa de Prueba
    de Alcohol y Bloqueo de Vehículos Motorizados de West Virginia (Interlock)?
  choices:
    A: El DMV de West Virginia
    B: El condado donde ocurrió la infracción
    C: El conductor/infractor
    D: La compañía de seguros del conductor
  answer: C
  explanation: El conductor es responsable de todos los costos relacionados con el
    Programa de Prueba de Alcohol y Bloqueo, incluyendo la instalación, las tarifas
    de monitoreo mensual y el retiro del dispositivo.
- id: 124
  category: alcohol_drugs_health
  question: 'En West Virginia, si un conductor es condenado por un DUI que causa ''lesiones
    corporales graves'' a otra persona, la ofensa se clasifica como:'
  choices:
    A: Infracción de tráfico menor
    B: Delito menor simple
    C: Delito grave (Felony)
    D: Solo una violación administrativa
  answer: C
  explanation: Un DUI que resulta en lesiones corporales graves es un delito grave
    (felony) en West Virginia, castigable con 2 a 10 años en una instalación correccional
    estatal y multas significativas.
- id: 125
  category: alcohol_drugs_health
  question: 'La ley de ''Contenedor Abierto'' (Open Container) de West Virginia prohíbe
    la posesión de un recipiente de bebida alcohólica abierto en:'
  choices:
    A: Solo en el maletero
    B: El área de pasajeros de cualquier vehículo motorizado en una vía pública
    C: Solo en vehículos comerciales
    D: Solo en vehículos conducidos por personas menores de 21 años
  answer: B
  explanation: La ley de West Virginia prohíbe la posesión de cualquier recipiente
    de bebida alcohólica abierto en el área de pasajeros de un vehículo motorizado
    ubicado en una vía pública o derecho de paso.
- id: 126
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de reducir su concentración de alcohol
    en sangre (BAC) antes de conducir?
  choices:
    A: Beber café negro
    B: Tomar una ducha fría
    C: Hacer ejercicio vigoroso
    D: Permitir que pase el tiempo
  answer: D
  explanation: Solo el tiempo permite que el cuerpo metabolice el alcohol. El café,
    las duchas y el ejercicio no aceleran el proceso de reducción del BAC.
- id: 127
  category: alcohol_drugs_health
  question: Si se le condena por una segunda ofensa de DUI en West Virginia dentro
    de un período de 10 años, ¿cuál es la sentencia mínima obligatoria de cárcel?
  choices:
    A: 24 horas
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Una segunda ofensa de DUI dentro de 10 años en West Virginia es un
    delito menor y conlleva una pena de cárcel obligatoria de 6 meses a 1 año.
- id: 128
  category: alcohol_drugs_health
  question: 'En West Virginia, si tiene una condición médica que causa pérdida del
    conocimiento (como la epilepsia), se le puede requerir que:'
  choices:
    A: Entregue su licencia permanentemente
    B: Conduzca solo durante las horas del día
    C: Esté libre de convulsiones por un período específico y presente un informe
      médico
    D: Solo conduzca con una enfermera con licencia en el vehículo
  answer: C
  explanation: Los conductores con condiciones como la epilepsia generalmente deben
    estar libres de convulsiones por un período (a menudo de 6 meses a 1 año) y enviar
    informes médicos de su médico al DMV para su revisión.
- id: 129
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma de conducir bajo la influencia de
    la marihuana en West Virginia?
  choices:
    A: Mejora de la visión nocturna
    B: Tiempos de reacción más rápidos
    C: Disminución de la capacidad para juzgar la distancia y el tiempo
    D: Aumento del estado de alerta
  answer: C
  explanation: El uso de marihuana perjudica la conducción al retrasar los tiempos
    de reacción, disminuir la coordinación y dificultar el juicio de las distancias
    y el paso del tiempo.
- id: 130
  category: alcohol_drugs_health
  question: 'En West Virginia, si un conductor se ve involucrado en un accidente fatal
    y existe una ''causa razonable'' para creer que conducía bajo los efectos del
    alcohol o drogas, debe:'
  choices:
    A: Ser puesto en libertad hasta que se fije una fecha para el tribunal
    B: Someterse a un análisis de sangre para determinar el contenido de drogas o
      alcohol
    C: Solo realizar una prueba de aliento si así lo decide
    D: Pagar una multa en el acto
  answer: B
  explanation: Bajo la ley de West Virginia, si existe una causa razonable para creer
    que un conductor causó una muerte o lesiones graves mientras estaba bajo la influencia,
    se puede requerir un análisis de sangre.
- id: 131
  category: penalties_and_points
  question: ¿En West Virginia, cuál es la penalización de puntos por rebasar ilegalmente
    un autobús escolar detenido que esté recibiendo o dejando niños?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 10 puntos
  answer: C
  explanation: Rebasar un autobús escolar detenido es una violación de seguridad grave
    en West Virginia y conlleva una penalización de 6 puntos.
- id: 132
  category: penalties_and_points
  question: Al completar un curso de conducción defensiva aprobado por el DMV, ¿cuántos
    puntos se le pueden eliminar de su registro a un conductor de West Virginia?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: West Virginia permite a los conductores deducir 3 puntos de su total
    acumulado tras completar con éxito un curso de conducción defensiva aprobado,
    siempre que no hayan tomado el curso para la reducción de puntos en los últimos
    12 meses.
- id: 133
  category: penalties_and_points
  question: ¿Cuánto tiempo permanecen los puntos en un registro de conducir de West
    Virginia a partir de la fecha de la condena?
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: Permanentemente
  answer: B
  explanation: En West Virginia, los puntos permanecen en su registro de conducir
    durante dos años a partir de la fecha de la condena.
- id: 134
  category: penalties_and_points
  question: ¿Cuál es la penalización de puntos por exceder el límite de velocidad
    por 20 millas por hora o más en West Virginia?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 5 puntos
    D: 6 puntos
  answer: D
  explanation: Exceder el límite de velocidad por 20 mph o más resulta en la adición
    de 6 puntos a su registro de conducir de West Virginia.
- id: 135
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por 'No ceder el paso' (Failure to Yield Right-of-Way)
    en West Virginia?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: Una condena por no ceder el paso resulta en 3 puntos en el registro
    de un conductor de West Virginia.
- id: 136
  category: penalties_and_points
  question: ¿En West Virginia, cuántos puntos se asignan por 'Seguir demasiado cerca'
    (Following Too Closely/tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: A
  explanation: Seguir demasiado cerca, o 'tailgating', es una infracción de 2 puntos
    en el estado de West Virginia.
- id: 137
  category: penalties_and_points
  question: ¿Cuál es la penalización de puntos por un 'Cambio de carril indebido'
    (Improper Lane Change) en West Virginia?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Realizar un cambio de carril indebido resulta en la adición de 2 puntos
    a su registro de conducir de West Virginia.
- id: 138
  category: penalties_and_points
  question: ¿En West Virginia, cuál es la penalización para una persona de 21 años
    o más que es condenada por DUI con un menor en el vehículo?
  choices:
    A: Una simple advertencia
    B: Solo una multa de $50
    C: Revocación obligatoria de la licencia
    D: Ninguna penalización si el BAC era inferior al 0.08%
  answer: C
  explanation: Conducir bajo la influencia (DUI) con un menor en el vehículo es una
    ofensa grave en West Virginia que conlleva la revocación obligatoria de la licencia
    y posible tiempo en la cárcel.
- id: 139
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resulta en la revocación obligatoria
    de la licencia de conducir de West Virginia?
  choices:
    A: Exceder el límite de velocidad por 5 mph
    B: Carreras de autos (Drag racing)
    C: No usar la señal de giro
    D: Estacionarse en una zona prohibida
  answer: B
  explanation: Según la ley de West Virginia, las carreras de autos (drag racing)
    en calles o carreteras públicas es una infracción que resulta en la revocación
    obligatoria de la licencia de conducir.
- id: 140
  category: penalties_and_points
  question: 'Los conductores de West Virginia pueden reducir su total de puntos en
    tres puntos si completan un curso de conducción defensiva aprobado, siempre que
    no hayan tomado el curso para la reducción de puntos dentro de los últimos:'
  choices:
    A: 6 meses
    B: 12 meses
    C: 24 meses
    D: 5 años
  answer: B
  explanation: Un conductor puede recibir un crédito de 3 puntos en su registro al
    completar un curso aprobado, pero este crédito solo está disponible una vez cada
    12 meses.
- id: 141
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por abandonar la escena de un accidente que
    involucre daños a la propiedad en West Virginia?
  choices:
    A: 3 puntos
    B: 5 puntos
    C: 6 puntos
    D: La licencia se revoca de inmediato
  answer: C
  explanation: Abandonar la escena de un accidente que involucre daños a la propiedad
    (Hit and Run) resulta en 6 puntos en el historial de conducción de West Virginia.
- id: 142
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción de la ley de uso obligatorio
    del cinturón de seguridad de West Virginia para un conductor adulto?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: En West Virginia, la multa por una infracción del cinturón de seguridad
    es de $25. Es una ley de cumplimiento primario, lo que significa que un oficial
    puede detenerlo únicamente por no usar el cinturón de seguridad.
- id: 143
  category: penalties_and_points
  question: Una condena por "No ceder el paso" (Failure to Yield) en West Virginia
    resulta en ¿cuántos puntos en su historial de conducción?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: No ceder el derecho de paso es una infracción de 3 puntos bajo el sistema
    de puntos del DMV de West Virginia.
- id: 144
  category: penalties_and_points
  question: 'Por una condena de DUI (conducir bajo la influencia) por primera vez
    (no agravada) en West Virginia, un conductor puede enfrentar una sentencia de
    cárcel de hasta:'
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Un DUI por primera vez (no agravado) en West Virginia conlleva una
    posible sentencia de cárcel de hasta 6 meses.
- id: 145
  category: penalties_and_points
  question: ¿Cuál es el rango de la multa por no asegurar adecuadamente a un niño
    en un dispositivo de seguridad para pasajeros infantiles en West Virginia?
  choices:
    A: $10 a $20
    B: $50 a $100
    C: $100 a $200
    D: $250 a $500
  answer: A
  explanation: La ley de West Virginia exige asientos de seguridad para niños; el
    incumplimiento resulta en una multa de no menos de $10 ni más de $20.
- id: 146
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por "Rebase indebido" (Improper Passing) en
    un historial de conducción de West Virginia?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: El rebase indebido se clasifica como una infracción de 3 puntos en
    el sistema de puntos del DMV de West Virginia.
- id: 147
  category: penalties_and_points
  question: En West Virginia, exceder el límite de velocidad establecido por 5 a 10
    mph, ¿cuántos puntos genera?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: El nivel más bajo de puntos por exceso de velocidad en West Virginia
    es de 2 puntos por ir de 5 a 10 mph por encima del límite.
- id: 148
  category: sharing_the_road
  question: En West Virginia, ¿cuál es el requisito de casco para los operadores y
    pasajeros de motocicletas?
  choices:
    A: Solo se requiere para menores de 21 años
    B: Solo se requiere para el operador, no para el pasajero
    C: Todos los operadores y pasajeros deben usar un casco aprobado por el DOT independientemente
      de su edad
    D: Los cascos son opcionales si el conductor tiene al menos $10,000 en seguro
      médico
  answer: C
  explanation: La ley de West Virginia exige que todos los operadores y pasajeros
    de motocicletas usen un casco aprobado por el Departamento de Transporte (DOT)
    y debidamente asegurado en todo momento.
- id: 149
  category: sharing_the_road
  question: 'Al seguir a un camión grande, si no puede ver los espejos laterales del
    conductor del camión, usted se encuentra:'
  choices:
    A: En la "Zona No" (No-Zone) del camión (punto ciego)
    B: En una posición segura de succión para ahorrar combustible
    C: En la línea de visión directa del conductor
    D: Siguiendo a una distancia legal segura
  answer: A
  explanation: El Manual de Licencia de Conducir de West Virginia establece que si
    no puede ver la cara del conductor en su espejo lateral, él no puede verlo a usted,
    lo que significa que está en su "Zona No" (No-Zone) o punto ciego.
- id: 150
  category: sharing_the_road
  question: En West Virginia, ¿qué debe hacer un conductor cuando un peatón cruza
    la calle guiado por un perro o portando un bastón blanco (con o sin punta roja)?
  choices:
    A: Tocar la bocina para avisarles que está allí
    B: Tomar el derecho de paso si tiene luz verde
    C: Detenerse por completo y tomar precauciones para evitar lesiones
    D: Reducir la velocidad y rodearlos con cuidado
  answer: C
  explanation: El Código de WV §17C-10-7 establece que los conductores deben tomar
    todas las precauciones necesarias para evitar lesionar a un peatón ciego. Debe
    detenerse por completo para permitirles cruzar de manera segura.
- id: 151
  category: sharing_the_road
  question: ¿Cuál es el período de suspensión obligatoria de la licencia por una condena
    por primera infracción por rebasar ilegalmente un autobús escolar detenido en
    West Virginia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 6 meses
  answer: B
  explanation: Según la ley de West Virginia, una condena por primera infracción por
    rebasar un autobús escolar detenido resulta en una suspensión obligatoria de la
    licencia de conducir por 30 días.
- id: 152
  category: sharing_the_road
  question: Al seguir a una motocicleta, ¿por qué debe un conductor dejar una distancia
    de seguimiento mayor que cuando sigue a un automóvil?
  choices:
    A: Las motocicletas tienen una distancia de frenado mucho más corta
    B: A las motocicletas se les permite zigzaguear en su carril
    C: Las motocicletas son más ligeras y el viento puede derribarlas
    D: La ley exige seguir a las motocicletas a una distancia de 500 pies
  answer: A
  explanation: Las motocicletas pueden detenerse mucho más rápido que los vehículos
    más grandes. Los conductores deben dejar una distancia de seguimiento de al menos
    3 a 4 segundos para evitar una colisión por alcance.
- id: 153
  category: sharing_the_road
  question: 'Si un vehículo de emergencia con sirenas y luces intermitentes se aproxima
    por detrás en una carretera de dos carriles, usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Orillarse hacia el borde derecho de la carretera y detenerse
    C: Aumentar la velocidad para encontrar un lugar donde desviarse
    D: Orillarse hacia el arcén izquierdo
  answer: B
  explanation: Cuando se aproxima un vehículo de emergencia, la ley de West Virginia
    exige que los conductores se dirijan al borde o acera derecha de la calzada, despejando
    cualquier intersección, y se detengan hasta que el vehículo haya pasado.
- id: 154
  category: sharing_the_road
  question: 'En West Virginia, los ciclistas que circulan por la calzada tienen:'
  choices:
    A: Ningún derecho legal y deben ceder el paso a todos los autos
    B: Los mismos derechos y responsabilidades que los conductores de vehículos motorizados
    C: El derecho a circular únicamente por la acera
    D: El derecho a ignorar las señales de alto si no hay autos presentes
  answer: B
  explanation: Los ciclistas se consideran vehículos cuando están en la carretera
    y tienen los mismos derechos y están sujetos a los mismos deberes que los conductores
    de vehículos motorizados.
- id: 155
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el camión puede:'
  choices:
    A: Girar desde el carril izquierdo para no tocar el bordillo
    B: Abrirse ampliamente hacia la izquierda antes o durante el giro
    C: Permanecer estrictamente en el carril derecho sin importar el bordillo
    D: Girar solo desde una ruta designada para camiones
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse ampliamente hacia la
    izquierda para realizar un giro a la derecha sin que las ruedas traseras golpeen
    el bordillo u otros objetos. Los conductores nunca deben intentar meterse entre
    un camión que gira y el bordillo.
- id: 156
  category: sharing_the_road
  question: 'En West Virginia, usted NO está obligado a detenerse ante un autobús
    escolar con luces rojas intermitentes si:'
  choices:
    A: El autobús está en el lado opuesto de una autopista dividida por una mediana
    B: El autobús está en una zona escolar
    C: Hay al menos tres carriles de circulación
    D: Usted está viajando al límite de velocidad
  answer: A
  explanation: Los conductores no necesitan detenerse ante un autobús escolar si viajan
    en la dirección opuesta en una carretera dividida por una mediana o barrera física.
- id: 157
  category: sharing_the_road
  question: La ley de 'Move Over' (hacerse a un lado) de West Virginia se aplica a
    ¿cuál de los siguientes vehículos detenidos con luces intermitentes?
  choices:
    A: Solo vehículos de policía y bomberos
    B: Solo ambulancias y grúas
    C: Policía, bomberos, ambulancias, grúas y vehículos de servicios públicos/mantenimiento
    D: Cualquier vehículo con las luces de emergencia encendidas
  answer: C
  explanation: La ley se amplió para incluir no solo a los socorristas y grúas, sino
    también a los vehículos de mantenimiento de carreteras y de servicios públicos
    que muestren luces intermitentes.
- id: 158
  category: sharing_the_road
  question: 'Al girar a la izquierda en una intersección en West Virginia, debe ceder
    el paso a:'
  choices:
    A: Solo a otros vehículos motorizados
    B: Peatones en el paso de cebra y tráfico en sentido contrario
    C: Solo a los peatones a su derecha
    D: A nadie, si tiene la luz verde
  answer: B
  explanation: Los conductores que giran a la izquierda deben ceder el paso a todo
    el tráfico que viene en sentido contrario y a cualquier peatón que cruce en la
    trayectoria del vehículo.
- id: 159
  category: sharing_the_road
  question: ¿Cuántas motocicletas pueden circular en paralelo (una al lado de la otra)
    en un solo carril en West Virginia?
  choices:
    A: Ninguna; deben circular en fila india
    B: Dos
    C: Tres
    D: Tantas como quepan de forma segura
  answer: B
  explanation: La ley de West Virginia permite que dos motocicletas circulen en paralelo
    en un solo carril, pero no se permite que circulen más de dos una al lado de la
    otra.
- id: 160
  category: sharing_the_road
  question: 'Según la ley de West Virginia, al rebasar a una bicicleta que circula
    en la misma dirección, un automovilista debe dejar una distancia segura de al
    menos:'
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: El Código de West Virginia §17C-7-3 exige que los automovilistas dejen
    una distancia segura no menor a tres pies al alcanzar y rebasar una bicicleta.
- id: 161
  category: sharing_the_road
  question: 'Cuando un vehículo de emergencia con luces intermitentes y una sirena
    se aproxima desde cualquier dirección, los conductores de West Virginia deben:'
  choices:
    A: Acelerar para salir del camino
    B: Detenerse inmediatamente en el carril de circulación
    C: Orillarse al borde derecho de la acera y detenerse
    D: Continuar conduciendo al límite de velocidad
  answer: C
  explanation: La ley de West Virginia exige que los conductores cedan el paso orillándose
    inmediatamente al borde o acera derecha de la carretera, fuera de cualquier intersección,
    y se detengan hasta que el vehículo de emergencia haya pasado.
- id: 162
  category: sharing_the_road
  question: 'Al conducir cerca de camiones grandes, la ''No-Zone'' se refiere a:'
  choices:
    A: El límite de velocidad para los camiones
    B: El área donde los camiones no tienen permitido conducir
    C: Los puntos ciegos alrededor del camión donde el conductor no puede verlo
    D: El área de carga del camión
  answer: C
  explanation: La 'No-Zone' representa las áreas de peligro alrededor de los camiones
    donde es más probable que ocurran choques porque la visión del conductor del camión
    está restringida en la parte delantera, trasera y los lados.
- id: 163
  category: sharing_the_road
  question: En West Virginia, cuando un autobús escolar se detiene en una autopista
    dividida con una franja central o barrera física, ¿qué vehículos están obligados
    a detenerse?
  choices:
    A: Los vehículos en todos los carriles
    B: Solo los vehículos que siguen al autobús
    C: Solo los vehículos que se aproximan por delante
    D: No se requiere que ningún vehículo se detenga
  answer: B
  explanation: En una autopista con calzadas separadas (divididas por una franja central
    o barrera), la ley de West Virginia establece que los conductores en la calzada
    opuesta no necesitan detenerse ante un autobús escolar.
- id: 164
  category: sharing_the_road
  question: 'En West Virginia, los vehículos en un cortejo fúnebre deben identificarse
    mediante el uso de:'
  choices:
    A: Solo sus luces direccionales
    B: Faros delanteros y luces de advertencia de peligro (intermitentes)
    C: Solo una bandera especial en la antena
    D: Música a alto volumen
  answer: B
  explanation: La ley de West Virginia exige que los vehículos en un cortejo fúnebre
    tengan encendidos sus faros delanteros y sus luces de advertencia de peligro para
    que se les conceda el derecho de paso.
- id: 165
  category: sharing_the_road
  question: En West Virginia, ¿es legal que una motocicleta realice 'lane splitting'
    (conducir entre filas de vehículos detenidos o en movimiento)?
  choices:
    A: Sí, a velocidades inferiores a 20 mph
    B: Sí, pero solo en autopistas interestatales
    C: No, es ilegal
    D: Sí, si la motocicleta tiene sus luces encendidas
  answer: C
  explanation: Dividir el carril (lane splitting) es ilegal en West Virginia. Las
    motocicletas tienen derecho al uso completo de un carril, y ningún vehículo de
    motor debe ser conducido de tal manera que prive a cualquier motocicleta del uso
    completo de un carril.
- id: 166
  category: sharing_the_road
  question: En West Virginia, ¿qué equipo deben tener por ley los ciclistas cuando
    circulan de noche?
  choices:
    A: Una lámpara blanca en la parte delantera y un reflector rojo en la parte trasera
    B: Una campana o bocina audible a 500 pies
    C: Ropa de neón y un casco
    D: Una luz azul en la parte delantera y una luz verde en la parte trasera
  answer: A
  explanation: El Código de WV §17C-11-7 exige que cada bicicleta utilizada durante
    la noche esté equipada con una lámpara en la parte delantera que emita una luz
    blanca visible desde 500 pies y un reflector rojo en la parte trasera visible
    desde todas las distancias entre 50 y 300 pies.
- id: 167
  category: sharing_the_road
  question: 'Cuando un cortejo fúnebre es encabezado por un vehículo de las fuerzas
    del orden con luces intermitentes, los demás conductores deben:'
  choices:
    A: Rebasar el cortejo por la derecha
    B: Ceder el derecho de paso y no conducir entre los vehículos del cortejo
    C: Seguir el cortejo de cerca para avanzar entre el tráfico
    D: Solo detenerse si el cortejo está en una señal de alto
  answer: B
  explanation: En West Virginia, se prohíbe a los automovilistas conducir entre los
    vehículos de un cortejo fúnebre y deben ceder el derecho de paso a todo el cortejo
    hasta que haya pasado.
- id: 168
  category: sharing_the_road
  question: ¿Cómo es el emblema de vehículo de movimiento lento en West Virginia?
  choices:
    A: Una señal roja cuadrada
    B: Una señal amarilla circular
    C: Una señal triangular de color naranja rojizo con un borde rojo oscuro
    D: Una señal azul en forma de diamante
  answer: C
  explanation: Los vehículos de movimiento lento, como tractores agrícolas o maquinaria
    diseñada para velocidades de 25 mph o menos, deben mostrar un emblema triangular
    de color naranja rojizo fluorescente con un borde reflectante rojo oscuro.
- id: 169
  category: vehicle_information
  question: Según la ley de West Virginia, ¿con qué frecuencia debe someterse a una
    inspección de seguridad un vehículo de motor registrado en el estado?
  choices:
    A: Cada 6 meses
    B: Cada 12 meses
    C: Cada 24 meses
    D: Solo cuando se vende el vehículo
    E: null
  answer: B
  explanation: La ley de West Virginia exige que todos los vehículos de motor registrados
    en el estado pasen una inspección oficial de seguridad cada 12 meses (anualmente).
- id: 170
  category: vehicle_information
  question: 'En West Virginia, debe usar sus faros delanteros siempre que no pueda
    ver personas o vehículos a una distancia de:'
  choices:
    A: 200 pies
    B: 350 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de West Virginia exige que los faros delanteros estén encendidos
    desde el atardecer hasta el amanecer, y en cualquier otro momento en que la visibilidad
    se limite a menos de 500 pies.
- id: 171
  category: vehicle_information
  question: Según las normas de inspección de seguridad de West Virginia, ¿cuál es
    la profundidad mínima permitida de la banda de rodadura de los neumáticos?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Para aprobar la inspección de seguridad de West Virginia, los neumáticos
    deben tener una profundidad de banda de rodadura de al menos 2/32 de pulgada.
- id: 172
  category: vehicle_information
  question: La ley de West Virginia establece que el polarizado de ventanas no original
    (after-market) en las ventanas laterales de un automóvil de pasajeros debe permitir
    el paso de al menos ¿qué porcentaje de luz?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: La ley de West Virginia (Código de WV §17C-15-36a) exige que el polarizado
    de las ventanas laterales delanteras y traseras permita una transmisión de luz
    superior al 35%.
- id: 173
  category: vehicle_information
  question: 'Todo vehículo motorizado en West Virginia debe estar equipado con una
    bocina que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de West Virginia exige que la bocina sea audible en condiciones
    normales desde una distancia no menor a 200 pies.
- id: 174
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos es obligatorio en todos los vehículos
    motorizados en West Virginia para evitar ruidos excesivos o inusuales y humo molesto?
  choices:
    A: Un convertidor catalítico
    B: Un silenciador (muffler)
    C: Un filtro de aire
    D: Un inyector de combustible
  answer: B
  explanation: La ley de West Virginia exige que todo vehículo motorizado esté equipado
    con un silenciador (muffler) en buen estado de funcionamiento para evitar ruidos
    y humo excesivos.
- id: 175
  category: vehicle_information
  question: 'La ley de West Virginia exige que la placa de matrícula trasera de un
    vehículo esté iluminada de modo que sea claramente visible desde una distancia
    de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La placa de matrícula trasera debe estar iluminada por una luz blanca
    para que sea legible desde una distancia de 50 pies hacia atrás.
- id: 176
  category: vehicle_information
  question: 'En West Virginia, se requiere que encienda sus faros delanteros siempre
    que esté utilizando sus:'
  choices:
    A: Luces de emergencia (hazard lights)
    B: Limpiaparabrisas
    C: Desempañador
    D: Control de crucero (cruise control)
  answer: B
  explanation: La ley de West Virginia exige que los faros delanteros se enciendan
    siempre que los limpiaparabrisas estén en uso debido a las inclemencias del tiempo.
- id: 177
  category: vehicle_information
  question: 'La ley de West Virginia exige que todos los vehículos motorizados tengan
    un espejo retrovisor que proporcione una visión de la carretera por una distancia
    de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Todo vehículo motorizado debe estar equipado con un espejo ubicado
    de tal manera que refleje al conductor una visión de la carretera por una distancia
    de al menos 200 pies hacia atrás.
- id: 178
  category: vehicle_information
  question: Según la ley de West Virginia, ¿quién está obligado a usar el cinturón
    de seguridad en un vehículo de pasajeros?
  choices:
    A: Solo el conductor
    B: El conductor y todos los pasajeros del asiento delantero
    C: El conductor y todos los pasajeros menores de 18 años, independientemente de
      su posición en el asiento
    D: Tanto B como C
  answer: D
  explanation: En West Virginia, el conductor y todos los pasajeros del asiento delantero
    deben usar cinturones de seguridad. Además, todos los pasajeros menores de 18
    años deben estar abrochados, independientemente de dónde estén sentados en el
    vehículo.
- id: 179
  category: vehicle_information
  question: 'Si se ve involucrado en un choque en West Virginia y el equipo de su
    vehículo resulta dañado, debe asegurarse de que sea reparado y vuelto a inspeccionar
    si el daño afecta:'
  choices:
    A: El color de la pintura
    B: El funcionamiento del radio
    C: El funcionamiento seguro del vehículo
    D: La tapicería interior
  answer: C
  explanation: Cualquier daño que afecte el funcionamiento seguro del vehículo o su
    cumplimiento con las normas de seguridad debe ser reparado para mantener el estatus
    legal del vehículo en las carreteras de West Virginia.
- id: 180
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para que un vehículo de pasajeros apruebe la inspección en West Virginia?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos se consideran inseguros y no pasarán la inspección estatal
    de West Virginia si la profundidad de la banda de rodadura es inferior a 2/32
    de pulgada.
- id: 181
  category: vehicle_information
  question: ¿Entre qué fechas se les permite a los conductores de West Virginia usar
    neumáticos para nieve con clavos en las carreteras estatales?
  choices:
    A: Del 1 de octubre al 1 de marzo
    B: Del 1 de noviembre al 15 de abril
    C: Del 1 de diciembre al 15 de marzo
    D: Del 15 de noviembre al 1 de abril
    E: null
  answer: B
  explanation: En West Virginia, los neumáticos para nieve con clavos son legales
    para su uso únicamente desde el 1 de noviembre hasta el 15 de abril.
- id: 182
  category: vehicle_information
  question: 'Según la ley de West Virginia, la bocina de su vehículo debe ser audible
    desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
    E: null
  answer: B
  explanation: Todo vehículo motorizado debe estar equipado con una bocina en buen
    estado de funcionamiento capaz de emitir un sonido audible en condiciones normales
    desde una distancia no menor a 200 pies.
- id: 183
  category: vehicle_information
  question: En West Virginia, ¿cuál es el porcentaje máximo legal de polarizado de
    ventanas permitido para las ventanas laterales delanteras de un automóvil de pasajeros?
  choices:
    A: 20% de transmisión de luz
    B: 35% de transmisión de luz
    C: 50% de transmisión de luz
    D: El polarizado de ventanas está completamente prohibido
    E: null
  answer: B
  explanation: La ley de West Virginia exige que el polarizado de las ventanas laterales
    delanteras permita el paso de más del 35% de la luz.
- id: 184
  category: vehicle_information
  question: 'La ley de West Virginia exige que las señales de giro de su vehículo
    sean visibles desde una distancia no menor a:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 300 pies
    D: 500 pies
    E: null
  answer: B
  explanation: Las señales de giro deben ser visibles tanto por delante como por detrás
    desde una distancia de al menos 100 pies bajo la luz solar normal.
- id: 185
  category: vehicle_information
  question: 'Se debe mantener una luz trasera o una lámpara separada para iluminar
    la placa de matrícula trasera con una luz blanca, de modo que la placa sea claramente
    legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
    E: null
  answer: B
  explanation: Las regulaciones de equipamiento de West Virginia exigen que la placa
    de matrícula trasera esté iluminada y sea legible desde una distancia de 50 pies.
- id: 186
  category: vehicle_information
  question: 'Al conducir en West Virginia, debe encender sus faros delanteros si la
    visibilidad se reduce a menos de:'
  choices:
    A: 200 pies
    B: 400 pies
    C: 500 pies
    D: 1,000 pies
    E: null
  answer: C
  explanation: Los faros delanteros deben encenderse desde el atardecer hasta el amanecer
    y en cualquier otro momento en que, debido a luz insuficiente o condiciones atmosféricas
    desfavorables, las personas y los vehículos en la carretera no sean claramente
    visibles a una distancia de 500 pies.
- id: 187
  category: vehicle_information
  question: Si las señales direccionales de su vehículo (luces de giro) no funcionan,
    debe usar señales manuales. ¿Cuál es la señal manual para 'disminuir la velocidad
    o detenerse'?
  choices:
    A: Brazo extendido directamente hacia afuera de la ventana
    B: Brazo extendido hacia arriba
    C: Brazo extendido hacia abajo
    D: Brazo moviéndose en movimiento circular
    E: null
  answer: C
  explanation: La señal manual estándar para disminuir la velocidad o detenerse es
    el brazo izquierdo extendido hacia abajo por fuera de la ventana.
- id: 188
  category: signs_and_signals
  question: En West Virginia, ¿qué significa una luz roja intermitente en una intersección?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: La señal está averiada; ignórela
    C: Detenerse por completo y proceder cuando sea seguro hacerlo
    D: Ceder el paso al tráfico de la derecha únicamente
  answer: C
  explanation: 'Según el Manual de Licencia de Conducir de West Virginia, una luz
    roja intermitente tiene el mismo significado que una señal de alto: debe detenerse
    por completo y avanzar solo cuando sea seguro.'
- id: 189
  category: signs_and_signals
  question: ¿Cuál es el significado de una luz amarilla intermitente en una intersección
    de West Virginia?
  choices:
    A: Detenerse y esperar la luz verde
    B: Proceder con precaución
    C: Acelerar para despejar la intersección
    D: La luz está a punto de cambiar a rojo
  answer: B
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y proceder con precaución, manteniéndose alerta ante posibles peligros.
- id: 190
  category: signs_and_signals
  question: Cuando un conductor de West Virginia extiende su brazo y mano izquierdos
    directamente hacia afuera de la ventana, ¿qué señal está dando?
  choices:
    A: Giro a la derecha
    B: Giro a la izquierda
    C: Detenerse o disminuir la velocidad
    D: Giro en U
  answer: B
  explanation: La señal manual estándar para un giro a la izquierda es el brazo y
    la mano extendidos directamente hacia afuera en posición horizontal.
- id: 191
  category: signs_and_signals
  question: 'En West Virginia, una señal en forma de banderín (triángulo isósceles
    que apunta a la derecha) situada en el lado izquierdo de la carretera indica:'
  choices:
    A: Una zona escolar
    B: Un requisito de ceder el paso
    C: Una zona de no rebasar
    D: Un cruce de ferrocarril
  answer: C
  explanation: Una señal en forma de banderín se coloca en el lado izquierdo de la
    carretera para marcar el inicio de una zona de no rebasar.
- id: 192
  category: signs_and_signals
  question: ¿Qué significa una 'X' amarilla fija colocada sobre un carril de tráfico
    en West Virginia?
  choices:
    A: El carril es solo para vehículos de alta ocupación (HOV)
    B: Puede usar el carril con precaución
    C: La señal de control de carril está a punto de cambiar a una 'X' roja
    D: El carril está cerrado a todo el tráfico
  answer: C
  explanation: Una 'X' amarilla fija indica que la señal de control de carril está
    a punto de cambiar a rojo, y usted debe prepararse para salir de ese carril de
    manera segura.
- id: 193
  category: signs_and_signals
  question: En las carreteras de West Virginia, ¿qué significan las líneas amarillas
    dobles continuas en el centro de la calzada?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: Se prohíbe rebasar en ambas direcciones
    D: La carretera es de un solo sentido
  answer: C
  explanation: Las líneas amarillas dobles continuas indican que no se permite rebasar
    para el tráfico que circula en cualquier dirección.
- id: 194
  category: signs_and_signals
  question: ¿Qué indica una señal amarilla de forma redonda con una 'X' negra y las
    letras 'RR'?
  choices:
    A: Hay un área de descanso adelante
    B: Hay un cruce de ferrocarril adelante
    C: Hay reparaciones viales en curso
    D: Una superficie de carretera irregular
  answer: B
  explanation: Una señal amarilla redonda con una 'X' negra y 'RR' es una señal de
    advertencia de que se está acercando a un cruce de ferrocarril.
- id: 195
  category: signs_and_signals
  question: En West Virginia, ¿qué significa una señal de flecha roja fija?
  choices:
    A: Puede girar después de detenerse y ceder el paso
    B: Debe detenerse y no puede girar en la dirección de la flecha
    C: La flecha es solo para peatones
    D: El carril está cerrado
  answer: B
  explanation: Una flecha roja fija significa que debe detenerse y no puede realizar
    un movimiento en la dirección indicada por la flecha hasta que aparezca una señal
    verde.
- id: 196
  category: signs_and_signals
  question: ¿Qué señal manual debe usar un conductor de West Virginia para indicar
    que se va a detener o a disminuir la velocidad?
  choices:
    A: Brazo y mano extendidos hacia arriba
    B: Brazo y mano extendidos hacia afuera
    C: Brazo y mano extendidos hacia abajo
    D: Agitar la mano por la ventana
  answer: C
  explanation: Para indicar que se detiene o disminuye la velocidad, el conductor
    debe extender el brazo y la mano hacia abajo con la palma hacia atrás.
- id: 197
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de una señal naranja en forma de diamante
    en West Virginia?
  choices:
    A: Guiar a los conductores a los parques estatales
    B: Indicar instalaciones de servicio como gasolina y comida
    C: Advertir sobre peligros de construcción o mantenimiento
    D: Mostrar la distancia a la siguiente salida
  answer: C
  explanation: Las señales naranjas se utilizan específicamente para zonas de trabajo
    de construcción y mantenimiento para alertar a los conductores sobre condiciones
    inusuales o potencialmente peligrosas.
- id: 198
  category: signs_and_signals
  question: En West Virginia, ¿qué indica una línea blanca discontinua en el pavimento?
  choices:
    A: El tráfico se mueve en direcciones opuestas
    B: El tráfico se mueve en la misma dirección y se permite rebasar
    C: El borde de la calzada
    D: Un cruce de peatones
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección; los conductores pueden cruzar estas líneas para
    cambiar de carril cuando sea seguro.
- id: 199
  category: signs_and_signals
  question: 'Una señal en forma de pentágono (cinco lados) indica que se está acercando
    a:'
  choices:
    A: Un hospital
    B: Una zona escolar o cruce escolar
    C: Una intersección del condado
    D: Una zona de no rebasar
  answer: B
  explanation: La forma de pentágono de cinco lados se reserva exclusivamente para
    zonas escolares y cruces escolares.
- id: 200
  category: signs_and_signals
  question: ¿Qué significa una flecha amarilla intermitente en un semáforo de West
    Virginia?
  choices:
    A: Deténgase y espere una flecha verde
    B: Usted tiene el derecho de paso para girar
    C: Se permiten los giros, pero primero debe ceder el paso al tráfico que viene
      en sentido contrario y a los peatones
    D: El semáforo no funciona correctamente
  answer: C
  explanation: Una flecha amarilla intermitente significa que se permiten los giros
    a la izquierda, pero no están 'protegidos', lo que significa que debe ceder el
    paso al tráfico que viene en sentido contrario y a los peatones antes de girar.
- id: 201
  category: signs_and_signals
  question: ¿De qué color son las señales que proporcionan información sobre recreación
    pública y orientación escénica en West Virginia?
  choices:
    A: Azul
    B: Verde
    C: Marrón
    D: Amarillo
  answer: C
  explanation: Las señales marrones se utilizan para proporcionar orientación hacia
    áreas de recreación pública, sitios culturales y puntos de interés escénico.
- id: 202
  category: signs_and_signals
  question: Cuando vea una señal de "Cruz de San Andrés" (Crossbuck) en un cruce de
    ferrocarril en West Virginia, ¿cómo debe tratarla?
  choices:
    A: Como una señal de Pare (Stop)
    B: Como una señal de Ceda el paso (Yield)
    C: Como una señal de No entrar (Do Not Enter)
    D: Como una señal de Límite de velocidad (Speed Limit)
  answer: B
  explanation: Una señal de cruz de San Andrés para ferrocarril debe tratarse como
    una señal de ceda el paso; debe ceder el paso a cualquier tren que se aproxime.
- id: 203
  category: signs_and_signals
  question: Al usar señales manuales para indicar un giro en West Virginia, ¿cómo
    debe señalar un giro a la derecha?
  choices:
    A: Extender el brazo izquierdo recto hacia afuera
    B: Extender el brazo izquierdo hacia arriba
    C: Extender el brazo izquierdo hacia abajo
    D: Extender el brazo derecho recto hacia afuera
  answer: B
  explanation: Para señalar un giro a la derecha usando señales manuales en West Virginia,
    el conductor debe extender su brazo izquierdo por la ventana y doblarlo hacia
    arriba a la altura del codo.
- id: 204
  category: signs_and_signals
  question: 'Para señalar que está disminuyendo la velocidad o deteniéndose usando
    señales manuales, usted debe:'
  choices:
    A: Extender el brazo izquierdo hacia arriba
    B: Extender el brazo izquierdo recto hacia afuera
    C: Extender el brazo izquierdo hacia abajo
    D: Agitar la mano por la ventana
  answer: C
  explanation: La señal manual para disminuir la velocidad o detenerse consiste en
    extender el brazo izquierdo por la ventana y apuntarlo hacia abajo, hacia el suelo.
- id: 205
  category: signs_and_signals
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad reglamentario
    en un distrito comercial o residencial de West Virginia?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: Según la ley de West Virginia, el límite de velocidad predeterminado
    en cualquier distrito comercial o residencial es de 25 mph, a menos que las señales
    indiquen lo contrario.
- id: 206
  category: signs_and_signals
  question: 'Las líneas amarillas sólidas dobles en una carretera de West Virginia
    significan:'
  choices:
    A: Se permite rebasar si el camino está despejado
    B: Está prohibido rebasar en ambas direcciones
    C: Usted está en una calle de un solo sentido
    D: Puede rebasar únicamente equipos agrícolas que se muevan lentamente
  answer: B
  explanation: Las líneas amarillas sólidas dobles indican que está prohibido rebasar
    para el tráfico que circula en ambas direcciones.
- id: 207
  category: signs_and_signals
  question: En West Virginia, ¿cuántos puntos se evalúan contra su licencia de conducir
    por no ceder el derecho de paso?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: B
  explanation: De acuerdo con el sistema de puntos del DMV de West Virginia, no ceder
    el derecho de paso resulta en la adición de 3 puntos a su historial de manejo.
- id: 208
  category: signs_and_signals
  question: 'Una señal triangular roja y blanca que apunta hacia abajo es una:'
  choices:
    A: Señal de Pare (Stop)
    B: Señal de Ceda el paso (Yield)
    C: Señal de prohibido el paso
    D: Señal de contramano (Wrong way)
  answer: B
  explanation: El triángulo que apunta hacia abajo es la forma y el color estándar
    para una señal de ceda el paso, que requiere que los conductores disminuyan la
    velocidad y cedan el derecho de paso a otros vehículos.
- id: 209
  category: signs_and_signals
  question: 'Las señales en forma de diamante de color naranja se utilizan en West
    Virginia para indicar:'
  choices:
    A: Advertencias generales sobre las condiciones de la carretera
    B: Instalaciones de servicio como gasolina o comida
    C: Zonas de trabajo de construcción o mantenimiento
    D: Áreas de recreación pública
  answer: C
  explanation: Las señales naranjas en forma de diamante se utilizan específicamente
    para el control temporal del tráfico en zonas de trabajo de construcción y mantenimiento.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Disminuya la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que se aproxima
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 210
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 211
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico en sentido contrario.
  id: 212
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una calle de un solo sentido o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 213
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de un solo sentido (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 214
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 215
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 216
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 217
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido adelantar.
  id: 218
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 219
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 220
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 221
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que crucen la calle.
  id: 222
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o un cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 223
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras "R" es la
    señal de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca
    la velocidad, mire y escuche si vienen trenes.
  id: 224
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de vías férreas. Significa que debe ceder el paso a los trenes.
    Si se aproxima un tren, debe detenerse.
  id: 225
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 226
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Es necesario reducir la velocidad de forma
    más significativa antes de este giro.
  id: 227
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 228
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 229
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Esté preparado para
    ajustar su velocidad y posición.
  id: 230
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera se estrecha más adelante.
    Esté preparado para una reducción en el ancho de la vía y ajuste su posición en
    el carril.
  id: 231
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 232
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    de doble sentido.
  id: 233
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de rebase más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una vía de un solo sentido o de una autopista dividida y
    se encuentre con vehículos que circulan en la dirección opuesta.
  id: 234
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 235
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 236
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde
    el semáforo puede no ser visible desde la distancia.
  id: 237
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 238
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las calles laterales.
  id: 239
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una calle lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la carretera desde la calle lateral.
  id: 240
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 241
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 242
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 243
