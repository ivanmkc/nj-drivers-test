questions:
- id: 1
  category: license_system
  question: ¿Cuál es el horario de atención de la oficina regional del DMV de Kanawha
    City los sábados?
  choices:
    A: Cerrado
    B: 8:00 am - 12:00 pm
    C: 8:30 am - 5:00 pm
    D: 8:00 am - 6:00 pm
  answer: B
  explanation: Según el manual, la oficina regional de Kanawha City abre los sábados
    de 8:00 am a 12:00 pm.
- id: 2
  category: license_system
  question: ¿Cuál es el horario de atención estándar para la mayoría de las oficinas
    regionales del DMV de lunes a viernes?
  choices:
    A: 8:00 am - 5:00 pm
    B: 8:30 am - 5:00 pm
    C: 9:00 am - 5:00 pm
    D: 8:00 am - 6:00 pm
  answer: B
  explanation: Todas las oficinas regionales del DMV abren de lunes a viernes de 8:30
    am a 5:00 pm, con la excepción de Kanawha City.
- id: 3
  category: driver_responsibility
  question: 'Según el manual del conductor de West Virginia, conducir un vehículo
    motorizado se considera:'
  choices:
    A: Un derecho constitucional
    B: Un derecho federal
    C: Un privilegio
    D: Un requisito para la residencia estatal
  answer: C
  explanation: El manual establece que conducir un vehículo motorizado en West Virginia
    es un privilegio que conlleva muchas responsabilidades y debe ganarse.
- id: 4
  category: license_system
  question: ¿Para qué tipos de vehículos está destinada generalmente la licencia de
    conducir Clase E?
  choices:
    A: Camiones comerciales y autobuses
    B: Motocicletas y ciclomotores
    C: Vehículos de pasajeros regulares, camionetas pickup o vans
    D: Tractores agrícolas y maquinaria pesada
  answer: C
  explanation: El manual establece que la mayoría de los solicitantes de una licencia
    de conducir serán operadores de vehículos de pasajeros regulares, camionetas pickup
    o vans (Clase E).
- id: 5
  category: penalties_and_points
  question: Si no continúa demostrando que es un conductor seguro, ¿por cuánto tiempo
    puede perder su privilegio de conducir?
  choices:
    A: Solo por poco tiempo
    B: Solo hasta por un año
    C: Por poco tiempo, mucho tiempo o de por vida
    D: Hasta que pague una multa estándar
  answer: C
  explanation: 'El manual establece: ''Puede perder su licencia de conducir por poco
    tiempo, mucho tiempo o de por vida'' si no continúa demostrando que es un conductor
    seguro.'
- id: 6
  category: license_system
  question: ¿Cuántos tipos de licencias de conducir y tarjetas de identificación se
    ofrecen en West Virginia con respecto a la identificación federal?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: 'El índice indica que hay DOS tipos de licencias de conducir y tarjetas
    de identificación: ''No para identificación federal'' y ''Para identificación
    federal'' (REAL ID).'
- id: 7
  category: license_system
  question: ¿Cuántos comprobantes de residencia en West Virginia se requieren para
    obtener una licencia de conducir?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: 'El índice enumera el requisito: ''Debe tener dos comprobantes de residencia
    en West Virginia''.'
- id: 8
  category: license_system
  question: Al obtener una licencia de conducir, ¿cuántos comprobantes de su número
    de Seguro Social debe proporcionar?
  choices:
    A: Ninguno
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: 'El índice establece explícitamente: ''Debe tener un comprobante de
    número de Seguro Social''.'
- id: 9
  category: license_system
  question: ¿Para qué grupo de edad está diseñado el programa de Licencia de Conducir
    Graduada (GDL)?
  choices:
    A: Edades 14-16
    B: Edades 15-17
    C: Edades 16-18
    D: Edades 18 en adelante
  answer: B
  explanation: El índice enumera 'Licencia de Conducir Graduada (GDL) - Edades 15-17'.
- id: 10
  category: license_system
  question: ¿A qué edad puede un solicitante solicitar un Permiso de Instrucción Regular
    en lugar de una Licencia de Conducir Graduada?
  choices:
    A: 15 años en adelante
    B: 16 años en adelante
    C: 18 años en adelante
    D: 21 años en adelante
  answer: C
  explanation: El índice enumera 'Permiso de Instrucción Regular - Edades 18 en adelante'.
- id: 11
  category: driver_testing
  question: ¿Qué servicio se brinda al llamar al número gratuito 1-866-2MAKE-IT?
  choices:
    A: Ayuda gratuita y confidencial con habilidades de lectura
    B: Programación de un examen de conducir
    C: Reportar a un conductor bajo los efectos del alcohol o drogas
    D: Pago de multas de tráfico no pagadas
  answer: A
  explanation: El manual proporciona el número 1-866-2MAKE-IT (1-866-262-5348) para
    'AYUDA GRATUITA Y CONFIDENCIAL CON LA LECTURA DISPONIBLE'.
- id: 12
  category: penalties_and_points
  question: ¿Cuál de los siguientes asuntos comparte el mismo número de teléfono de
    contacto (926-2505) que el Sistema de Puntos y la Asistencia Estudiantil?
  choices:
    A: Seguro Obligatorio
    B: Multas no pagadas
    C: Registros de conducción
    D: Conducir bajo la influencia (DUI)
  answer: B
  explanation: El manual enumera el número de teléfono 926-2505 para el Sistema de
    Puntos, la Asistencia Estudiantil y las Multas no pagadas.
- id: 13
  category: alcohol_drugs_health
  question: Si necesita comunicarse con el DMV con respecto a asuntos de 'Interlock'
    (dispositivo de bloqueo de encendido) por Conducir bajo la influencia (DUI), ¿a
    qué número debe llamar?
  choices:
    A: (304) 926-3801
    B: (304) 926-2505
    C: (304) 926-3952
    D: (304) 926-2507
  answer: D
  explanation: El manual enumera el (304) 926-2507 como el número para 'Interlock'
    por Conducir bajo la influencia (DUI).
- id: 14
  category: license_system
  question: Además de Kanawha City, ¿qué otra oficina regional del DMV está abierta
    los sábados de 8:00 am a 12:00 pm?
  choices:
    A: Beckley
    B: Martinsburg
    C: Huntington
    D: Morgantown
  answer: B
  explanation: El manual establece que la oficina regional de Martinsburg también
    está abierta los sábados de 8:00 am a 12:00 pm.
- id: 15
  category: driver_testing
  question: ¿Cuál es el propósito del programa de examen de conducir?
  choices:
    A: Generar ingresos para el fondo estatal de carreteras
    B: Proporcionar educación fundamental en seguridad vial y comparar la capacidad
      de conducción con los estándares aceptados
    C: Emitir licencias de conducir comerciales a todos los solicitantes
    D: Rastrear el número de vehículos que posee un residente
  answer: B
  explanation: 'El manual establece: ''El programa de examen de conducir proporciona
    educación fundamental en seguridad vial y le permite comparar su capacidad de
    conducción con los estándares aceptados para una conducción segura''.'
- id: 16
  category: license_system
  question: Según el manual, ¿a qué grupo de edad se aplica el programa de Licencia
    de Conducir Graduada (GDL)?
  choices:
    A: Edades 14-16
    B: Edades 15-17
    C: Edades 16-18
    D: Edades 18 en adelante
  answer: B
  explanation: El manual enumera específicamente la 'Licencia de Conducir Graduada
    (GDL)' como aplicable a las 'edades de 15 a 17 años'.
- id: 17
  category: license_system
  question: ¿Qué tipo de permiso se emite a los solicitantes que tienen 18 años o
    más?
  choices:
    A: GDL de Nivel 1
    B: Permiso de instrucción regular
    C: Licencia de conducir intermedia
    D: Licencia Clase F
  answer: B
  explanation: El manual describe el 'Permiso de instrucción regular' para 'personas
    de 18 años o más'.
- id: 18
  category: license_system
  question: Bajo el programa de Licencia de Conducir Graduada (GDL), ¿qué es una GDL
    de Nivel 1?
  choices:
    A: Licencia de conducir intermedia
    B: Licencia de conducir completa
    C: Permiso de instrucción
    D: Permiso de motocicleta
  answer: C
  explanation: El manual designa la 'GDL de Nivel 1' como un '(Permiso de instrucción)'.
- id: 19
  category: license_system
  question: ¿Qué tipo de licencia es una GDL de Nivel 2?
  choices:
    A: Permiso de instrucción
    B: Licencia de conducir intermedia
    C: Licencia de conducir regular
    D: Licencia de chofer
  answer: B
  explanation: Según el manual, la 'GDL de Nivel 2' es la '(Licencia de conducir intermedia)'.
- id: 20
  category: license_system
  question: ¿Cuál de las siguientes opciones figura en el manual como una designación
    específica de la licencia de conducir?
  choices:
    A: Estudiante del cuadro de honor
    B: Conductor comercial
    C: Designación de veterano
    D: Conductor seguro
  answer: C
  explanation: Bajo 'Designaciones de la licencia de conducir', el manual enumera
    la 'Designación de veterano' junto con las designaciones de Donante de órganos
    y Diabético/Sordo/Con problemas de audición.
- id: 21
  category: license_system
  question: ¿Qué letra se utiliza para designar un Endoso de Motocicleta o una Licencia
    de Conducir Solo para Motocicletas?
  choices:
    A: M
    B: F
    C: C
    D: E
  answer: B
  explanation: El manual enumera el 'Endoso de Motocicleta (F)' y la 'Licencia de
    Conducir Solo para Motocicletas (Licencia Clase F)'.
- id: 22
  category: driver_responsibility
  question: ¿Qué capítulo del manual trata sobre las 'Responsabilidades del Conductor'?
  choices:
    A: Capítulo I
    B: Capítulo II
    C: Capítulo III
    D: Capítulo IV
  answer: B
  explanation: El índice del manual titula explícitamente el Capítulo II como 'Responsabilidades
    del Conductor'.
- id: 23
  category: driver_responsibility
  question: ¿Bajo qué capítulo encontraría información sobre el 'Seguro Obligatorio'?
  choices:
    A: Conducir Bajo la Influencia
    B: Procedimientos y Requisitos de Examen
    C: Responsabilidades del Conductor
    D: Licencia de Conducir Graduada
  answer: C
  explanation: 'El ''Seguro Obligatorio'' aparece como una sección bajo el Capítulo
    II: Responsabilidades del Conductor.'
- id: 24
  category: alcohol_drugs_health
  question: ¿Qué capítulo está dedicado a 'Conducir Bajo la Influencia'?
  choices:
    A: Capítulo I
    B: Capítulo II
    C: Capítulo III
    D: Capítulo IV
  answer: C
  explanation: El índice del manual titula el Capítulo III como 'Conducir Bajo la
    Influencia'.
- id: 25
  category: alcohol_drugs_health
  question: 'Según el manual, conducir con somnolencia se categoriza como una forma
    de:'
  choices:
    A: Conducción temeraria
    B: Conducción bajo efectos de fatiga o sustancias (Impaired driving)
    C: Conducción agresiva
    D: Conducción distraída
  answer: B
  explanation: En el Capítulo III, hay una sección específica titulada 'Conducir con
    somnolencia es conducir bajo efectos de fatiga (Impaired Driving)'.
- id: 26
  category: penalties_and_points
  question: ¿En qué parte del manual encontraría la 'Escala de Puntos (Tabla)'?
  choices:
    A: Capítulo I
    B: Capítulo II (Responsabilidades del Conductor)
    C: Capítulo III (Conducir Bajo la Influencia)
    D: Capítulo IV (Procedimientos de Examen)
  answer: B
  explanation: 'La ''Escala de Puntos (Tabla)'' se encuentra al final del Capítulo
    II: Responsabilidades del Conductor.'
- id: 27
  category: driver_testing
  question: '¿Cuál de los siguientes temas se trata en el Capítulo IV: Procedimientos
    y Requisitos de Examen?'
  choices:
    A: Asistencia escolar para menores
    B: Consentimiento implícito y la prueba química
    C: Examen de la vista
    D: Sistema de puntos
  answer: C
  explanation: 'El ''Examen de la vista'' aparece como una de las primeras secciones
    del Capítulo IV: Procedimientos y Requisitos de Examen.'
- id: 28
  category: license_system
  question: ¿Qué condiciones médicas específicas se mencionan que tienen una Designación
    en la Licencia de Conducir?
  choices:
    A: Diabético, sordo o con problemas de audición
    B: Epilepsia o trastornos convulsivos
    C: Daltonismo
    D: Afecciones cardíacas
  answer: A
  explanation: Bajo 'Designaciones de la Licencia de Conducir', el manual enumera
    específicamente 'Diabético, sordo o con problemas de audición'.
- id: 29
  category: driver_responsibility
  question: Según el índice del manual, ¿qué se requiere de los menores con respecto
    a su educación bajo las Responsabilidades del Conductor?
  choices:
    A: Inscripción universitaria
    B: Asistencia escolar
    C: Finalización del curso de educación vial
    D: Estatus de cuadro de honor
  answer: B
  explanation: El Capítulo II (Responsabilidades del Conductor) incluye una sección
    titulada 'Asistencia escolar para menores'.
- id: 30
  category: driver_testing
  question: ¿Cuál de los siguientes se enumera como un componente de la Prueba de
    Habilidades Básicas de Control del Vehículo en el manual?
  choices:
    A: Incorporación a la autopista
    B: Estacionamiento en paralelo
    C: Calificación (Scoring)
    D: Conducción nocturna
  answer: C
  explanation: Bajo la sección 'Prueba de Habilidades Básicas de Control del Vehículo',
    el manual enumera 'Instrucciones', 'Calificación' y 'Ejercicios'.
- id: 31
  category: safe_driving_rules
  question: Según el texto proporcionado, ¿qué sección del Código del Estado de Virginia
    Occidental cubre el Estacionamiento Prohibido?
  choices:
    A: §17C-13-3
    B: §17C-13-4
    C: §17C-13-5
    D: §17C-13-6
  answer: A
  explanation: El manual enumera el 'Estacionamiento Prohibido' bajo la sección §17C-13-3
    del Código del Estado de Virginia Occidental (W. Va. State Code).
- id: 32
  category: driver_testing
  question: ¿Cuál de los siguientes giros o cambios de sentido figura como ejercicio
    en el examen de conducir?
  choices:
    A: Giro de cuatro puntos
    B: Giro en U
    C: Giro de tres puntos
    D: Giro en callejón
  answer: C
  explanation: El 'Giro de tres puntos' (Three-Point Turnabout) aparece explícitamente
    en la sección de Ejercicios del examen de conducir.
- id: 33
  category: driver_testing
  question: Durante la parte de la prueba de manejo de su examen de conducir, ¿en
    cuál de los siguientes entornos específicos se le evaluará?
  choices:
    A: Conducción en zona rural
    B: Conducción en zona urbana
    C: Conducción en autopista interestatal
    D: Conducción fuera de carretera
  answer: B
  explanation: La 'Conducción en zona urbana' figura como una de las categorías específicas
    en las que se le evaluará durante la prueba de manejo.
- id: 34
  category: safe_driving_rules
  question: Según el manual, ¿cuál de las siguientes maniobras de estacionamiento
    regula la sección §17C-13-4 del Código del Estado de Virginia Occidental?
  choices:
    A: Estacionamiento prohibido y estacionamiento en colinas
    B: Estacionamiento en ángulo y estacionamiento en paralelo
    C: Estacionamiento en doble fila y estacionamiento en callejones
    D: Estacionamiento en autopistas interestatales y estacionamiento de emergencia
  answer: B
  explanation: El texto enumera tanto el 'Estacionamiento en ángulo' como el 'Estacionamiento
    en paralelo' con la citación (§17C-13-4, W. Va. State Code).
- id: 35
  category: sharing_the_road
  question: ¿En relación con qué tipo de vehículo se analiza en el manual el concepto
    de 'No-Zone' (Zona Ciega) al compartir la carretera?
  choices:
    A: Motocicletas
    B: Bicicletas
    C: Camiones pesados
    D: Autobuses públicos
  answer: C
  explanation: La 'No-Zone' aparece inmediatamente después de 'Compartir la carretera
    con camiones pesados' y 'Lo que se debe y no se debe hacer para la seguridad de
    los camiones'.
- id: 36
  category: signs_and_signals
  question: ¿Cuál de los siguientes se clasifica como un Dispositivo de Control de
    Tráfico en el Capítulo V del manual?
  choices:
    A: Ley de velocidad básica
    B: Derecho de paso
    C: Señales de control de uso de carril
    D: Distancia de seguimiento
  answer: C
  explanation: 'Las ''Señales de control de uso de carril'' se enumeran en el Capítulo
    V: Dispositivos de control de tráfico, mientras que los demás se encuentran en
    el Capítulo VI.'
- id: 37
  category: signs_and_signals
  question: ¿Cuál de las siguientes es una categoría específica de señales analizada
    en el capítulo de Dispositivos de Control de Tráfico?
  choices:
    A: Señales de rombo y de advertencia
    B: Señales octogonales y de alto
    C: Señales triangulares y de ceda el paso
    D: Señales redondas y de cruce de ferrocarril
  answer: A
  explanation: '''Señales de rombo y de advertencia'' aparece explícitamente como
    una sección del Capítulo V: Dispositivos de control de tráfico.'
- id: 38
  category: driver_testing
  question: ¿Cuál de las siguientes maniobras se evalúa en la sección de 'Ejercicios'
    en lugar de en la sección general de 'Prueba de manejo'?
  choices:
    A: Cambios de carril
    B: Intersecciones
    C: Estacionamiento en paralelo del lado izquierdo o derecho
    D: Curvas
  answer: C
  explanation: El 'Estacionamiento en paralelo del lado izquierdo o derecho' se enumera
    en la sección de Ejercicios, mientras que los cambios de carril, las intersecciones
    y las curvas se encuentran en la sección de la prueba de manejo.
- id: 39
  category: safe_driving_rules
  question: ¿Cuál de los siguientes temas se trata en 'Leyes de tránsito y reglas
    de la carretera'?
  choices:
    A: Señales de cruce peatonal
    B: Derecho de paso
    C: Luces intermitentes de intersección
    D: Marcas en el pavimento
  answer: B
  explanation: 'El ''Derecho de paso'' se enumera en el Capítulo VI: Leyes de tránsito
    y reglas de la carretera, mientras que los demás son dispositivos de control de
    tráfico.'
- id: 40
  category: signs_and_signals
  question: Según la organización del manual, ¿cuál de los siguientes se considera
    un Dispositivo de Control de Tráfico?
  choices:
    A: Marcas en el pavimento
    B: Señales de conducción
    C: Faros delanteros
    D: Maniobras de giro
  answer: A
  explanation: 'Las ''Marcas en el pavimento'' se incluyen en el Capítulo V: Dispositivos
    de control de tráfico.'
- id: 41
  category: sharing_the_road
  question: 'El manual incluye secciones específicas sobre cómo compartir la carretera
    con todos los siguientes, EXCEPTO:'
  choices:
    A: Jinetes (personas a caballo)
    B: Corredores (joggers)
    C: Bicicletas
    D: Patinadores
  answer: D
  explanation: El texto menciona compartir la carretera con jinetes, bicicletas y
    corredores, pero no menciona a los patinadores.
- id: 42
  category: safe_driving_rules
  question: ¿Cuál de las siguientes situaciones de estacionamiento tiene una sección
    dedicada en el Capítulo VI del manual?
  choices:
    A: Estacionamiento en intersecciones
    B: Estacionamiento en colinas
    C: Estacionamiento en entradas de vehículos
    D: Estacionamiento cerca de hidrantes de incendio
  answer: B
  explanation: '''Estacionamiento en colinas'' aparece explícitamente como una sección
    bajo Maniobras de Estacionamiento en el Capítulo VI.'
- id: 43
  category: signs_and_signals
  question: ¿Cuál de las siguientes formas/tipos de señales aparece específicamente
    como una sección en el Capítulo V?
  choices:
    A: Señales cuadradas y rectangulares
    B: Señales circulares y ovaladas
    C: Señales triangulares y de banderín
    D: Señales hexagonales y octogonales
  answer: A
  explanation: '''Señales cuadradas y rectangulares'' aparece explícitamente como
    una sección en el Capítulo V: Dispositivos de Control de Tráfico.'
- id: 44
  category: driver_testing
  question: Según el manual, ¿cuál de los siguientes es un componente de la sección
    de 'Ejercicios' del examen de conducir?
  choices:
    A: Giro de dos puntos hacia adelante y hacia atrás
    B: Incorporación a la autopista
    C: Conducción nocturna
    D: Frenado de emergencia
  answer: A
  explanation: El 'Giro de dos puntos hacia adelante y hacia atrás' se enumera en
    la sección de Ejercicios del examen de conducir.
- id: 45
  category: defensive_driving
  question: Según el capítulo de Conducción Defensiva, ¿cuál de los siguientes se
    clasifica como un 'Mal Hábito de Conducción'?
  choices:
    A: Pereza
    B: Fatiga
    C: Estados emocionales
    D: Vientos fuertes
  answer: A
  explanation: El manual enumera específicamente la pereza, la impaciencia, la falta
    de atención, y la arrogancia y agresividad bajo 'Malos Hábitos de Conducción'.
- id: 46
  category: driver_responsibility
  question: ¿Cuál de los siguientes se categoriza como una 'Condición del Conductor'
    que puede afectar su conducción?
  choices:
    A: Falta de atención
    B: Impaciencia
    C: Fatiga
    D: Arrogancia
  answer: C
  explanation: Según el manual, la fatiga y los estados emocionales se clasifican
    como 'Condiciones del Conductor', mientras que la falta de atención y la impaciencia
    se consideran malos hábitos de conducción.
- id: 47
  category: safe_driving_rules
  question: Al conducir en carreteras interestatales, ¿cuál de las siguientes maniobras
    se aborda específicamente como un tema de preocupación en el manual?
  choices:
    A: Estacionamiento en paralelo
    B: Giros en U
    C: Giros de tres puntos
    D: Estacionamiento en ángulo
  answer: B
  explanation: El capítulo 'Conducción en carreteras interestatales' incluye específicamente
    una sección sobre las reglas y los peligros de realizar giros en U en las interestatales.
- id: 48
  category: vehicle_information
  question: ¿Cuál de las siguientes fallas del vehículo se clasifica como una 'Situación
    de Emergencia' en el manual?
  choices:
    A: Pastillas de freno desgastadas
    B: Pedal del acelerador atascado
    C: Nivel bajo de líquido limpiaparabrisas
    D: Correa del ventilador que chirría
  answer: B
  explanation: El manual enumera el 'Pedal del acelerador atascado' como una situación
    de emergencia específica, junto con reventones de neumáticos, fallas en los frenos
    y fallas en la dirección.
- id: 49
  category: defensive_driving
  question: ¿Cuál de las siguientes condiciones climáticas se cubre explícitamente
    en el capítulo de Conducción Defensiva?
  choices:
    A: Huracanes
    B: Niebla y humo
    C: Tormentas de granizo
    D: Resplandor solar
  answer: B
  explanation: El capítulo de Conducción Defensiva cubre explícitamente la conducción
    en lluvia, inundaciones, nieve y aguanieve, vientos fuertes, y niebla y humo.
- id: 50
  category: vehicle_information
  question: Si se activa una luz de advertencia específica en el tablero, se trata
    como una situación de emergencia. ¿Qué luz se menciona específicamente en la sección
    de emergencias del manual?
  choices:
    A: Luz de revisión del motor (Check Engine)
    B: Luz de baja presión de neumáticos
    C: Luz de presión de aceite
    D: Luz de advertencia del ABS
  answer: C
  explanation: El capítulo de Situaciones de Emergencia incluye una sección específica
    sobre qué hacer cuando se enciende la 'Luz de presión de aceite'.
- id: 51
  category: safe_driving_rules
  question: Según el manual, ¿cuál de los siguientes es un paso recomendado para la
    preparación ante emergencias?
  choices:
    A: Mantener un kit básico de emergencia
    B: Instalar una jaula de seguridad
    C: Llevar una correa de motor de repuesto
    D: Mantener un bidón de gasolina de 5 galones en el maletero
  answer: A
  explanation: El cuadro de Preparación ante Emergencias del manual recomienda específicamente
    llevar 'El Kit Básico de Emergencia' y 'El Kit Básico de Primeros Auxilios'.
- id: 52
  category: vehicle_information
  question: ¿Qué ley estatal sobre las condiciones del vehículo se menciona específicamente
    en el capítulo de Conducción Defensiva?
  choices:
    A: Ley de tintado de ventanas
    B: Ley de ordenanza de ruidos
    C: Ley de inspección estatal
    D: Ley de pruebas de emisiones
  answer: C
  explanation: El manual analiza las condiciones del vehículo específicamente en el
    contexto de la 'Ley de Inspección Estatal'.
- id: 53
  category: safe_driving_rules
  question: ¿Cuántos 'Pasos sencillos para una conducción segura y feliz' describe
    el manual?
  choices:
    A: '5'
    B: '8'
    C: '10'
    D: '12'
  answer: B
  explanation: El capítulo de Conducción Defensiva concluye con una sección titulada
    '8 pasos sencillos para una conducción segura y feliz'.
- id: 54
  category: defensive_driving
  question: ¿Cuál de los siguientes escenarios de pérdida de control se cubre en Situaciones
    de Emergencia?
  choices:
    A: Hidroplaneo
    B: Derrapes (Skids)
    C: Coleteo (Fishtailing)
    D: Sobreviraje
  answer: B
  explanation: El manual enumera específicamente los 'Derrapes' (Skids) como una situación
    de emergencia que los conductores deben saber manejar.
- id: 55
  category: driver_responsibility
  question: ¿Qué protección legal se analiza en el capítulo de Situaciones de Emergencia
    para quienes ayudan en un choque?
  choices:
    A: La Ley de Puerto Seguro (Safe Harbor Law)
    B: La Ley del Primer Respondedor
    C: La Ley del Buen Samaritano
    D: La Ley del Deber de Rescate
  answer: C
  explanation: La 'Ley del Buen Samaritano' se cubre en el capítulo de Situaciones
    de Emergencia para tratar la prestación de primeros auxilios y asistencia en la
    escena de un choque.
- id: 56
  category: safe_driving_rules
  question: ¿A qué grupo demográfico específico se dirige el capítulo de Conducción
    Defensiva con respecto a la reducción de riesgos?
  choices:
    A: Conductores de edad avanzada
    B: Conductores adolescentes
    C: Bebés y niños pequeños
    D: Peatones
  answer: C
  explanation: El capítulo de Conducción Defensiva incluye una sección específica
    sobre 'Reducción de riesgos para bebés y niños pequeños'.
- id: 57
  category: sharing_the_road
  question: Además de los corredores y los niños que juegan, ¿qué tipo específico
    de vehículo destaca el manual para compartir la carretera?
  choices:
    A: Autobuses públicos
    B: Camiones de reparto
    C: Equipo agrícola
    D: Barredoras de calles
  answer: A
  explanation: El manual incluye una sección dedicada a 'Compartir la carretera con
    autobuses públicos'.
- id: 58
  category: safe_driving_rules
  question: ¿Cuál de los siguientes se enumera como un peligro específico al conducir
    por autopistas interestatales?
  choices:
    A: Zonas escolares
    B: Zonas de construcción
    C: Cruces peatonales
    D: Cruces ferroviarios
  answer: B
  explanation: El capítulo 'Conducir en autopistas interestatales' cubre específicamente
    la navegación en 'Zonas de construcción'.
- id: 59
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    conductores menores de 21 años en West Virginia?
  choices:
    A: 0.08% o superior
    B: 0.05% o superior
    C: 0.02% o superior
    D: 0.00%
  answer: C
  explanation: Según el manual, para los conductores menores de 21 años, es ilegal
    conducir si el BAC es de 0.02% o superior.
- id: 60
  category: penalties_and_points
  question: Según la Ley de Consentimiento Implícito de West Virginia, ¿cuál es la
    sanción por no someterse a una prueba química si se le acusa de conducir bajo
    los efectos del alcohol (DUI)?
  choices:
    A: Una multa de hasta $500
    B: Suspensión de los privilegios de conducir durante al menos un (1) año
    C: Servicio comunitario obligatorio
    D: Incautación inmediata del vehículo
  answer: B
  explanation: La Ley de Consentimiento Implícito establece que no someterse a una
    prueba química resultará en la suspensión del privilegio de conducir durante al
    menos un (1) año.
- id: 61
  category: penalties_and_points
  question: ¿Cuál es la diferencia entre una suspensión de licencia y una revocación
    de licencia?
  choices:
    A: Una suspensión es permanente, mientras que una revocación es temporal.
    B: Una revocación significa que los privilegios se terminan y no se renovarán,
      mientras que una suspensión es un retiro temporal.
    C: Una suspensión se aplica solo a conductores comerciales, mientras que una revocación
      se aplica a todos los conductores.
    D: No hay diferencia; ambos términos significan una pérdida temporal de los privilegios
      de conducir.
  answer: B
  explanation: La revocación significa que la licencia de conducir y todos los privilegios
    se terminan y no se renovarán, mientras que una suspensión significa que los privilegios
    se retiran temporalmente.
- id: 62
  category: vehicle_information
  question: 'Por definición, un ciclomotor (moped) en West Virginia tiene una cilindrada
    máxima de motor de 50 cc y una velocidad máxima de:'
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: Un ciclomotor se define como aquel que tiene una fuente de potencia
    independiente que proporciona un máximo de dos caballos de fuerza, una cilindrada
    máxima del motor de 50 cc y una velocidad máxima de 30 mph.
- id: 63
  category: safe_driving_rules
  question: 'Los vehículos de baja velocidad solo pueden operarse en caminos y calles
    públicas donde el límite de velocidad no sea superior a:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: Los vehículos de baja velocidad solo pueden operarse en caminos privados,
    en caminos públicos y calles dentro de los límites corporativos de un municipio
    donde el límite de velocidad no sea superior a veinticinco (25) millas por hora.
- id: 64
  category: vehicle_information
  question: 'Un Vehículo Motorizado Comercial (CMV) se define como cualquier vehículo
    motorizado con una clasificación de peso bruto vehicular (GVWR) de al menos:'
  choices:
    A: 10,001 libras
    B: 16,000 libras
    C: 26,001 libras
    D: 32,000 libras
  answer: C
  explanation: Un Vehículo Motorizado Comercial (CMV) es cualquier vehículo motorizado
    con una clasificación de peso bruto vehicular (GVWR) de 26,001 libras o más.
- id: 65
  category: license_system
  question: ¿Cuál de las siguientes personas está exenta de necesitar una licencia
    de conducir de West Virginia?
  choices:
    A: Un nuevo residente que ha vivido en West Virginia durante 30 días
    B: Un no residente que asiste a una universidad de West Virginia y tiene una licencia
      válida de otro estado
    C: Un joven de 17 años que abandonó la escuela secundaria
    D: Cualquier persona que opere un tractor agrícola en una carretera interestatal
  answer: B
  explanation: Un no residente que asiste a un colegio o universidad de West Virginia
    y tiene una licencia válida de otro estado está expresamente exento de necesitar
    una licencia de conducir de West Virginia.
- id: 66
  category: license_system
  question: 'West Virginia puede denegar una licencia de conducir a cualquier persona
    menor de 18 años que:'
  choices:
    A: No esté inscrita en, o no se haya graduado de, una institución educativa aprobada
    B: Esté empleada a tiempo completo
    C: Esté inscrita en un programa de Licencia de Conducir Graduada (GDL)
    D: No sea ciudadano de los EE. UU.
  answer: A
  explanation: Se puede denegar la licencia de conducir a cualquier persona menor
    de 18 años que no esté inscrita en, o no se haya graduado de, una institución
    educativa aprobada.
- id: 67
  category: license_system
  question: Cuando solicita una licencia de conducir que cumple con REAL ID en West
    Virginia, ¿cómo recibe su tarjeta permanente?
  choices:
    A: Se imprime y se le entrega inmediatamente en el DMV.
    B: Llega a su dirección a través del USPS en aproximadamente 10-15 días hábiles.
    C: Debe regresar al DMV después de 30 días para recogerla.
    D: Se le envía por correo electrónico como un código de barras digital.
  answer: B
  explanation: Las tarjetas 'para uso de identificación federal' llegan a la dirección
    del solicitante a través del USPS en aproximadamente 10-15 días hábiles, mientras
    que en el DMV se emite una licencia temporal.
- id: 68
  category: license_system
  question: ¿Qué característica en una licencia de conducir de West Virginia indica
    que está certificada como compatible con REAL ID para uso de identificación federal?
  choices:
    A: Un holograma plateado del sello del estado
    B: Una estrella dorada en la cara de la tarjeta
    C: Un borde rojo alrededor de la foto del conductor
    D: Una banda magnética en la parte frontal
  answer: B
  explanation: Las tarjetas que cumplen con REAL ID contienen una estrella dorada
    en la cara de la tarjeta, lo que indica que la tarjeta cumple con todos los requisitos
    federales para su uso en aeropuertos y otras instalaciones federales designadas.
- id: 69
  category: defensive_driving
  question: ¿Cuál es la definición de 'Puntos ciegos' (Blind Spots) según el manual
    del conductor de West Virginia?
  choices:
    A: Áreas en la carretera donde las luces de la calle están rotas
    B: Áreas a ambos lados de los vehículos que no se pueden ver sin girar la cabeza
    C: Intersecciones sin señales de tráfico
    D: El colchón de espacio entre su vehículo y el vehículo que está directamente
      adelante
  answer: B
  explanation: Los puntos ciegos se definen como áreas a ambos lados de los vehículos
    que no se pueden ver sin girar la cabeza.
- id: 70
  category: safe_driving_rules
  question: ¿Cuál es el propósito de un carril de aceleración?
  choices:
    A: Permitir que los vehículos que salen de la autopista reduzcan la velocidad
    B: Proporcionar un área segura para que se estacionen los vehículos de emergencia
    C: Permitir que los conductores aumenten la velocidad antes de incorporarse al
      tráfico en los carriles de circulación directa
    D: Separar el tráfico que circula en direcciones opuestas
  answer: C
  explanation: Un carril de aceleración es un carril adicional a un lado de una autopista
    de alta velocidad que le permite entrar a la autopista para aumentar la velocidad
    antes de incorporarse al tráfico en los carriles de circulación directa.
- id: 71
  category: vehicle_information
  question: ¿Para calificar como un 'Vehículo Antiguo' en West Virginia, un vehículo
    motorizado debe tener más de cuántos años de antigüedad?
  choices:
    A: 15 años
    B: 20 años
    C: 25 años
    D: 50 años
  answer: C
  explanation: Un Vehículo Antiguo se define como un vehículo motorizado que tiene
    más de 25 años de antigüedad y es propiedad exclusiva como artículo de colección.
- id: 72
  category: safe_driving_rules
  question: ¿Cómo define el manual del conductor de West Virginia el 'Derecho de Paso'
    (Right-Of-Way)?
  choices:
    A: El privilegio del uso inmediato de la carretera
    B: El límite de velocidad legal en una carretera dividida
    C: La franja de terreno sin pavimentar que separa las direcciones opuestas del
      tráfico
    D: La parte de la carretera que excluye el acotamiento o berma
  answer: A
  explanation: El Derecho de Paso se define como el privilegio del uso inmediato de
    la carretera.
- id: 73
  category: license_system
  question: ¿Qué indica una estrella dorada en una licencia de conducir de West Virginia?
  choices:
    A: El conductor tiene un historial de conducción limpio.
    B: La tarjeta cumple con todos los requisitos federales para su uso en aeropuertos
      e instalaciones federales.
    C: El conductor es un operador de vehículos comerciales.
    D: La tarjeta solo es válida dentro del estado de West Virginia.
  answer: B
  explanation: Una tarjeta REAL ID/Para Uso Federal contiene una estrella dorada,
    lo que indica que la tarjeta cumple con todos los requisitos federales para su
    uso futuro en aeropuertos y otras instalaciones federales designadas.
- id: 74
  category: license_system
  question: ¿Cuántos días tiene un nuevo residente para solicitar una licencia de
    conducir de West Virginia si desea conducir en el estado?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Según el manual, los nuevos residentes que deseen conducir en WV deben
    solicitar una licencia de conducir de WV dentro de los 30 días.
- id: 75
  category: license_system
  question: Si está transfiriendo una licencia de conducir de otro estado, ¿dentro
    de cuántos días de la solicitud debe estar fechado su historial de conducción
    certificado del estado anterior?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: B
  explanation: Los solicitantes que se transfieren de otro estado deben presentar
    un historial de conducción certificado actual de su estado anterior con una fecha
    de 30 días o menos a partir de la fecha de la solicitud.
- id: 76
  category: license_system
  question: ¿Cuál de los siguientes NO se considera un documento de prueba de identidad
    aceptable?
  choices:
    A: Un pasaporte válido de los EE. UU.
    B: Un certificado de nacimiento militar de los EE. UU.
    C: Un certificado de nacimiento de un hospital
    D: Un Certificado de Naturalización
  answer: C
  explanation: El manual establece que los certificados de nacimiento del Departamento
    de Estado de EE. UU. y de las Fuerzas Armadas de EE. UU. SON aceptables, pero
    los certificados de nacimiento de hospitales y los registros de la Oficina del
    Censo NO son aceptables.
- id: 77
  category: license_system
  question: ¿Cuál es el costo adicional por una tarjeta 'Para Identificación Federal'
    (REAL ID)?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: B
  explanation: El manual especifica que la tarjeta REAL ID tiene un costo adicional
    de $10.00.
- id: 78
  category: license_system
  question: ¿Cuánto tiempo tarda normalmente en enviarse una tarjeta REAL ID a la
    dirección del solicitante a través de USPS?
  choices:
    A: 3-5 días hábiles
    B: 5-7 días hábiles
    C: 10-15 días hábiles
    D: 20-30 días hábiles
  answer: C
  explanation: La tarjeta REAL ID se envía a la dirección del solicitante a través
    de USPS en un plazo de 10 a 15 días hábiles.
- id: 79
  category: license_system
  question: Si un solicitante no es elegible para un número de Seguro Social, ¿qué
    debe proporcionar al DMV?
  choices:
    A: Un pasaporte válido de los EE. UU.
    B: Una carta de denegación de la SSA o una declaración de autocertificación por
      escrito
    C: Un certificado de nacimiento de un hospital
    D: Dos pruebas adicionales de residencia en West Virginia
  answer: B
  explanation: Si un solicitante no es elegible para una tarjeta de Seguro Social,
    debe proporcionar una carta de la Administración del Seguro Social (SSA) que indique
    que no es elegible o proporcionar una declaración de autocertificación por escrito
    de su inelegibilidad.
- id: 80
  category: license_system
  question: 'Al proporcionar una factura de servicios públicos como prueba de residencia
    en West Virginia, el documento no puede tener una antigüedad mayor a:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: El manual establece que cualquier documento recurrente utilizado como
    prueba de residencia, como una factura de servicios públicos, no puede tener más
    de 90 días de antigüedad.
- id: 81
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable como prueba de un cambio
    de nombre legal?
  choices:
    A: Un documento de matrimonio de recuerdo
    B: Una copia del certificado de matrimonio para el ministro
    C: Un decreto de divorcio certificado
    D: Un certificado de nacimiento del hospital
  answer: C
  explanation: Los documentos aceptables como prueba de cambio de nombre legal incluyen
    un decreto de divorcio certificado. Los documentos de recuerdo y las copias para
    el ministro de los certificados de matrimonio no son aceptables.
- id: 82
  category: license_system
  question: Para renovar una licencia de conducir "No apta para identificación federal"
    (Not For Federal Identification) SIN cambios, ¿cuántos comprobantes de residencia
    en West Virginia se requieren?
  choices:
    A: Ninguno
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Los solicitantes de renovación de una licencia de conducir o tarjeta
    de identificación sin cambios deben proporcionar un (1) documento de prueba de
    residencia en West Virginia.
- id: 83
  category: license_system
  question: ¿Bajo qué condición se considera a un solicitante con una licencia de
    conducir de West Virginia emitida anteriormente como un "solicitante por primera
    vez"?
  choices:
    A: Si su licencia ha estado vencida por más de 30 días
    B: Si su licencia ha estado vencida por más de seis (6) meses
    C: Si está actualizando a una REAL ID
    D: Si ha cambiado su nombre legal
  answer: B
  explanation: Los solicitantes que tienen una licencia de conducir de West Virginia
    que ha estado vencida por más de seis (6) meses se consideran solicitantes por
    primera vez.
- id: 84
  category: license_system
  question: ¿Se puede utilizar una fotocopia de una Declaración de Salarios e Impuestos
    (W-2) como prueba de un número de Seguro Social?
  choices:
    A: Sí, si tiene menos de 90 días de antigüedad
    B: Sí, si está notarizada
    C: No, las fotocopias de un formulario W-2 no son aceptables
    D: No, a menos que vaya acompañada de una factura de servicios públicos
  answer: C
  explanation: El manual establece explícitamente en la sección de Prueba Aceptable
    del Número de Seguro Social que "una fotocopia de un W-2 no es aceptable".
- id: 85
  category: license_system
  question: Si tiene 50 años o más y ha pasado por al menos un ciclo de renovación
    de licencia de WV, ¿qué puede presentar en lugar de un documento de cambio de
    nombre?
  choices:
    A: Una declaración firmada
    B: Una factura de servicios públicos
    C: Un formulario W-2
    D: Un pasaporte de los EE. UU.
  answer: A
  explanation: Si tiene 50 años o más, posee una licencia de conducir de WV vigente
    con el nombre que se está verificando y ha pasado por al menos un ciclo de renovación
    de licencia de WV, se puede presentar una declaración firmada en lugar del documento
    de cambio de nombre.
- id: 86
  category: license_system
  question: Al solicitar una tarjeta REAL ID (Para identificación federal), ¿cuántos
    comprobantes de residencia en West Virginia debe proporcionar?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Four
  answer: B
  explanation: Todos los solicitantes (renovación, duplicado, nuevos, transferencias
    y vencidos) que elijan una tarjeta "Para uso federal" (REAL ID) deben proporcionar
    dos (2) documentos de prueba de residencia en WV.
- id: 87
  category: license_system
  question: ¿Son aceptables los documentos con un apartado de correos (P.O. Box) como
    prueba de residencia en West Virginia?
  choices:
    A: Sí, para cualquier solicitante
    B: Sí, pero solo para solicitantes de renovación
    C: No, los documentos con un apartado de correos no son aceptables
    D: No, a menos que vayan acompañados de un formulario W-2
  answer: C
  explanation: El manual establece claramente en la sección de Prueba Aceptable de
    Residencia en West Virginia que "los documentos con un apartado de correos (PO
    Box) no son aceptables".
- id: 88
  category: license_system
  question: Si se utiliza un formulario W-2 de West Virginia como prueba de residencia,
    ¿cuál es la antigüedad máxima que puede tener el documento?
  choices:
    A: 6 meses de antigüedad
    B: 12 meses de antigüedad
    C: 18 meses de antigüedad
    D: 24 meses de antigüedad
  answer: C
  explanation: Según el manual, un formulario W-2 de WV utilizado como prueba de residencia
    no puede tener más de 18 meses de antigüedad.
- id: 89
  category: license_system
  question: ¿Cuántos comprobantes de residencia en West Virginia debe proporcionar
    un nuevo residente al solicitar una licencia de conducir?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: 'El manual establece: ''Si usted es un nuevo residente en el estado,
    se le requerirá proporcionar dos (2) formas de residencia en WV''.'
- id: 90
  category: license_system
  question: ¿Cuántos documentos que acrediten la residencia en West Virginia se requieren
    para un solicitante de renovación de licencia de conducir?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ninguno
  answer: A
  explanation: El manual especifica que 'Todos los solicitantes de renovación deben
    proporcionar un (1) documento' como prueba de residencia en WV.
- id: 91
  category: license_system
  question: ¿Quién está obligado a presentar un Certificado de Elegibilidad Escolar
    para el Conductor (School Driver Eligibility Certificate) válido para realizar
    cualquier trámite de licencia de conducir?
  choices:
    A: Todos los solicitantes por primera vez
    B: Solicitantes menores de 18 años
    C: Solicitantes que solicitan una licencia de conducir comercial
    D: Nuevos residentes que transfieren una licencia de otro estado
  answer: B
  explanation: 'El manual establece: ''Se requiere un Certificado de Elegibilidad
    Escolar para el Conductor válido para que un solicitante menor de 18 años realice
    cualquier trámite de licencia de conducir''.'
- id: 92
  category: license_system
  question: Si un solicitante menor de 18 años presenta un Certificado de Elegibilidad
    Escolar para el Conductor que indica un apartado postal (PO Box) en lugar de una
    dirección física, ¿qué más debe proporcionar?
  choices:
    A: Una carta de la oficina de correos de EE. UU.
    B: Un formulario W-2 a nombre del estudiante
    C: Dos comprobantes adicionales de residencia en WV a nombre de un padre o tutor
      legal
    D: Un registro de conducción certificado
  answer: C
  explanation: Si la dirección en el Certificado de Elegibilidad Escolar para el Conductor
    es un apartado postal (PO Box), el solicitante debe proporcionar dos (2) comprobantes
    adicionales de residencia en WV a nombre del padre o tutor legal del solicitante.
- id: 93
  category: license_system
  question: Si un solicitante es menor de 18 años pero ya se ha graduado de la escuela,
    ¿qué documento puede utilizarse en lugar del Certificado de Elegibilidad Escolar
    para el Conductor?
  choices:
    A: Un certificado de nacimiento
    B: Un diploma
    C: Un formulario W-2
    D: Una tarjeta de registro de votante
  answer: B
  explanation: 'El manual señala: ''Si un solicitante ya se ha graduado de la escuela
    y no ha cumplido los 18 años, se puede utilizar un diploma en lugar del Certificado
    de Elegibilidad Escolar para el Conductor''.'
- id: 94
  category: driver_responsibility
  question: ¿Qué es el Sistema de Puntos para Conductores con Problemas (PDPS)?
  choices:
    A: Un programa estatal que recompensa a los conductores seguros con descuentos
      en el seguro
    B: Un registro nacional de conductores diseñado para rastrear infracciones y suspensiones
      de un estado a otro
    C: Un examen escrito requerido para todos los nuevos residentes
    D: Un sistema de puntos utilizado exclusivamente para conductores menores de 18
      años
  answer: B
  explanation: El manual define el Sistema de Puntos para Conductores con Problemas
    (PDPS) como 'un registro nacional de conductores diseñado para rastrear infracciones
    y suspensiones de un estado a otro'.
- id: 95
  category: penalties_and_points
  question: ¿Qué hará el DMV de West Virginia si recibe un aviso de que usted no ha
    pagado una citación emitida en otro estado?
  choices:
    A: Deducir automáticamente puntos de su licencia
    B: Suspender su licencia de conducir después de notificarle por correo certificado
    C: Emitir una orden de arresto contra usted
    D: Requerir que vuelva a tomar el examen de habilidades de conducción
  answer: B
  explanation: El DMV de West Virginia suspenderá su licencia de conducir si recibe
    un aviso de otro estado de que no pagó una citación, y se lo notificará por correo
    certificado para darle tiempo a resolver el asunto.
- id: 96
  category: driver_responsibility
  question: Si su licencia corre el riesgo de ser suspendida debido a una citación
    no pagada en otro estado, ¿de quién es la responsabilidad de proporcionar al DMV
    el comprobante de que la citación ha sido pagada?
  choices:
    A: El tribunal de fuera del estado
    B: El oficial de policía que emitió la citación
    C: El conductor
    D: El Registro Nacional de Conductores
  answer: C
  explanation: 'El manual establece: ''Cualquier citación no pagada es su responsabilidad.
    No espere que el tribunal notifique al DMV... usted debe proporcionar al DMV el
    comprobante de que ha pagado la citación''.'
- id: 97
  category: license_system
  question: ¿Cuál de las siguientes combinaciones de documentos debe presentar un
    solicitante de licencia de conducir por primera vez?
  choices:
    A: Un comprobante de número de Seguro Social, un comprobante de identidad y dos
      comprobantes de residencia en WV
    B: Dos comprobantes de identidad y un comprobante de residencia en WV
    C: Un comprobante de identidad, un comprobante de residencia en WV y un formulario
      W-2
    D: Dos comprobantes de número de Seguro Social y un comprobante de identidad
  answer: A
  explanation: Cualquier solicitante por primera vez debe presentar un (1) documento
    de comprobante de número de Seguro Social, un (1) documento de comprobante de
    identidad y dos (2) documentos de comprobante de residencia en WV.
- id: 98
  category: driver_testing
  question: Al transferir una licencia de conducir válida y no vencida de otro estado
    a West Virginia, ¿qué exámenes o cursos debe completar el solicitante?
  choices:
    A: Un examen de conocimientos escrito y un examen de habilidades de conducción
    B: Un examen de la vista y un breve curso de concientización sobre el alcohol
    C: Un curso de conducción defensiva y un examen de conocimientos escrito
    D: Solo un examen de la vista
  answer: B
  explanation: Para transferir una licencia válida de otro estado, se requiere aprobar
    un examen de la vista, completar un breve curso de concientización sobre el alcohol
    y entregar su licencia de conducir de otro estado.
- id: 99
  category: driver_testing
  question: ¿Qué se requiere si un nuevo residente solicita una licencia de conducir
    de West Virginia pero su licencia de otro estado ha vencido?
  choices:
    A: Debe pagar un cargo por demora pero está exento de los exámenes
    B: Debe realizar todos los exámenes requeridos para un solicitante por primera
      vez
    C: Debe esperar 30 días antes de presentar la solicitud
    D: Solo necesita aprobar un examen de la vista
  answer: B
  explanation: Si la licencia de conducir de otro estado del solicitante ha vencido,
    el solicitante debe realizar todos los exámenes que se requieren para un solicitante
    por primera vez.
- id: 100
  category: license_system
  question: Si un nuevo residente desea omitir el requisito del examen pero no puede
    proporcionar su licencia de conducir física de otro estado, ¿qué debe hacer?
  choices:
    A: Obtener un registro de conducción certificado del estado donde tenía la licencia
      anteriormente
    B: Firmar una declaración jurada indicando que perdió su licencia
    C: Proporcionar tres comprobantes adicionales de residencia en WV
    D: Tomar un breve curso de concientización sobre el alcohol
  answer: A
  explanation: Un nuevo residente que no pueda proporcionar su licencia de conducir
    de otro estado debe obtener un registro de conducción certificado del estado o
    jurisdicción en el que tenía la licencia anteriormente para poder omitir el requisito
    del examen.
- id: 101
  category: driver_responsibility
  question: ¿Cuántos días tiene para notificar al DMV por escrito si cambia su dirección?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Si cambia su dirección, se le requiere notificar al DMV por escrito
    dentro de los 20 días posteriores al cambio.
- id: 102
  category: license_system
  question: Antes de obtener una licencia de conducir en West Virginia, ¿de qué sistema
    deben recibir los solicitantes una autorización?
  choices:
    A: La Administración Nacional de Seguridad del Tráfico en las Carreteras (NHTSA)
    B: El Sistema de Puntos para Conductores con Problemas (PDPS)
    C: La Administración Federal de Seguridad de Autotransportes (FMCSA)
    D: El Pacto Interestatal de Licencias de Conducir (IDLC)
  answer: B
  explanation: No se le otorgará la licencia en WV hasta que reciba una autorización
    del Sistema de Puntos para Conductores con Problemas (PDPS).
- id: 103
  category: license_system
  question: Si su licencia de conducir de West Virginia ha estado vencida por seis
    meses o más, ¿qué se le requiere hacer?
  choices:
    A: Pagar un cargo por mora de $50
    B: Completar un curso de conducción defensiva
    C: Volver a examinarse pasando por el proceso completo de evaluación
    D: Presentar un formulario de autorización médica
  answer: C
  explanation: Cualquier persona que renueve una licencia de conducir de WV que haya
    estado vencida por seis (6) meses o más debe volver a tomar el examen y pasar
    por el proceso completo de evaluación.
- id: 104
  category: license_system
  question: ¿Qué formato y código de colores se utiliza para las licencias de conducir
    emitidas a solicitantes que tienen entre 15 y 17 años?
  choices:
    A: Horizontal y con código de color rojo
    B: Vertical y con código de color azul
    C: Horizontal y con código de color azul
    D: Vertical y con código de color rojo
  answer: D
  explanation: A los solicitantes de 15 a 17 años se les emite una licencia de conducir
    o permiso de instrucción que es vertical y con código de color rojo.
- id: 105
  category: license_system
  question: ¿Una licencia de conducir vertical con código de color azul indica que
    el titular pertenece a qué grupo de edad?
  choices:
    A: 15 a 17 años
    B: 18 a 20 años
    C: 21 a 25 años
    D: Menores de 15 años
  answer: B
  explanation: A los solicitantes de 18 a 20 años se les emite una licencia de conducir
    o permiso de instrucción vertical con código de color azul.
- id: 106
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de instrucción regular Clase E
    para solicitantes de 18 años o más?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: El permiso de instrucción regular Clase E será válido por un período
    de seis (6) meses.
- id: 107
  category: safe_driving_rules
  question: Al conducir con un permiso de instrucción regular Clase E, ¿debe estar
    acompañado en el asiento delantero por un conductor con licencia que tenga al
    menos qué edad?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: El permiso de instrucción le permite operar un vehículo motorizado
    cuando un conductor con licencia de 21 años o más ocupa el asiento delantero con
    usted.
- id: 108
  category: driver_testing
  question: Para calificar para una licencia de conducir en West Virginia, ¿debe tener
    al menos qué visión en un ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Para calificar para una licencia de conducir en WV, debe tener al menos
    una visión de 20/40 en un (1) ojo.
- id: 109
  category: safe_driving_rules
  question: ¿Entre qué horas se le permite conducir a un conductor con un permiso
    de instrucción GDL de Nivel 1?
  choices:
    A: 5:00 am y 10:00 pm
    B: 6:00 am y 9:00 pm
    C: 5:00 am y 11:00 pm
    D: 7:00 am y 8:00 pm
  answer: A
  explanation: Los requisitos del Permiso de Instrucción GDL de Nivel 1 establecen
    que solo puede conducir entre las 5:00 am y las 10:00 pm.
- id: 110
  category: safe_driving_rules
  question: ¿Cuántos pasajeros que no sean familiares se le permite tener en el vehículo
    al titular de un permiso de instrucción GDL de Nivel 1, además del adulto supervisor?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: C
  explanation: Solo puede tener dos (2) pasajeros adicionales que no sean familiares,
    además del conductor adulto con licencia que supervisa.
- id: 111
  category: penalties_and_points
  question: ¿Cuántas condenas resultarán en la revocación de un permiso de instrucción
    GDL de Nivel 1 por 90 días?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Dos (2) condenas resultarán en la revocación de su permiso de instrucción
    (por 90 días).
- id: 112
  category: safe_driving_rules
  question: ¿Cuándo se le permite al titular de un permiso de instrucción GDL de Nivel
    1 utilizar un dispositivo de comunicación inalámbrica mientras conduce?
  choices:
    A: Al usar un dispositivo Bluetooth de manos libres
    B: Cuando está detenido en un semáforo en rojo
    C: Solo al contactar a un sistema 9-1-1
    D: Al comunicarse con un padre o tutor legal
  answer: C
  explanation: No puede utilizar un dispositivo de comunicación inalámbrica mientras
    opera un vehículo motorizado, a menos que el uso del dispositivo sea para contactar
    a un sistema 9-1-1.
- id: 113
  category: license_system
  question: ¿Por cuánto tiempo es válido un Certificado de Elegibilidad Escolar para
    Conductores desde su fecha de emisión durante el año escolar regular?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La fecha de vencimiento del documento será de 30 días a partir de la
    fecha de emisión.
- id: 114
  category: license_system
  question: Si es menor de 18 años y solicita un duplicado de la licencia de conducir,
    ¿qué documento específico debe proporcionar?
  choices:
    A: Un Certificado de Elegibilidad Escolar para Conductores válido
    B: Una carta de recomendación de un maestro
    C: Una exención firmada por un instructor de manejo
    D: Un diploma de escuela secundaria
  answer: A
  explanation: Si es menor de 18 años y solicita un duplicado de la licencia de conducir,
    necesita un Certificado de Elegibilidad Escolar para Conductores válido.
- id: 115
  category: driver_testing
  question: ¿Cuál es la tarifa por cada intento del examen de conocimientos para una
    GDL de Nivel 1?
  choices:
    A: $5.00
    B: $7.50
    C: $10.00
    D: $15.00
  answer: B
  explanation: La tarifa por un examen de conocimientos es de $7.50 por cada intento.
- id: 116
  category: license_system
  question: ¿Cuándo vence un permiso de instrucción GDL de Nivel 1?
  choices:
    A: En el cumpleaños número 16 del solicitante
    B: En el cumpleaños número 18 del solicitante, con un período de gracia de 30
      días
    C: Exactamente 180 días después de su emisión
    D: En el cumpleaños número 21 del solicitante
  answer: B
  explanation: Según el manual, un permiso de instrucción GDL de Nivel 1 se emite
    hasta el cumpleaños número 18 del solicitante y vence en dicho cumpleaños, aunque
    se permite un período de gracia de 30 días para completar el Examen de Habilidades
    en Carretera.
- id: 117
  category: license_system
  question: ¿Cuántas horas de conducción al volante deben estar certificadas en la
    hoja de registro para solicitar una licencia de conducir intermedia GDL de Nivel
    2?
  choices:
    A: 30 horas, incluyendo 5 horas de noche
    B: 40 horas, incluyendo 10 horas de noche
    C: 50 horas, incluyendo 10 horas de noche
    D: 60 horas, incluyendo 15 horas de noche
  answer: C
  explanation: Para ser elegible para una GDL de Nivel 2, debe tener una certificación
    de un padre o tutor legal de un mínimo de 50 horas al volante, incluyendo un mínimo
    de 10 horas de noche, o completar un curso de educación vial aprobado.
- id: 118
  category: safe_driving_rules
  question: ¿Entre qué horas debe un conductor intermedio GDL de Nivel 2 estar acompañado
    por un adulto con licencia y supervisor que tenga 21 años o más?
  choices:
    A: 9:00 pm y 6:00 am
    B: 10:00 pm y 5:00 am
    C: 11:00 pm y 6:00 am
    D: Medianoche y 5:00 am
  answer: B
  explanation: El manual establece que el titular de una licencia de conducir intermedia
    GDL de Nivel 2 debe conducir con un conductor adulto con licencia y supervisor
    que tenga 21 años o más entre las 10:00 pm y las 5:00 am.
- id: 119
  category: safe_driving_rules
  question: Durante los primeros seis meses de tener una licencia de conducir intermedia
    GDL de Nivel 2, ¿cuál es la restricción con respecto a los pasajeros?
  choices:
    A: No se permiten pasajeros en el vehículo en ningún momento.
    B: Solo se permite un miembro que no sea de la familia menor de 20 años.
    C: No se permiten pasajeros menores de 20 años que no sean miembros de la familia.
    D: Se permiten hasta tres personas que no sean miembros de la familia siempre
      que usen el cinturón de seguridad.
  answer: C
  explanation: El titular de una licencia de conducir intermedia GDL de Nivel 2 no
    puede operar un vehículo motorizado durante sus primeros seis meses con ningún
    pasajero menor de 20 años que no sea miembro de la familia.
- id: 120
  category: penalties_and_points
  question: ¿Cuál es la sanción por recibir dos condenas mientras se tiene un permiso
    de instrucción GDL de Nivel 1?
  choices:
    A: Una carta de advertencia y una multa de $50
    B: Revocación de su GDL por 30 días
    C: Revocación de su GDL por 90 días
    D: Revocación de su privilegio de conducir hasta los 18 años
  answer: C
  explanation: Bajo un permiso de instrucción GDL de Nivel 1, dos (2) condenas resultarán
    en la revocación de su GDL por 90 días. Después de 90 días, debe volver a solicitarlo
    y realizar el examen nuevamente.
- id: 121
  category: penalties_and_points
  question: ¿Qué se requiere de un conductor intermedio de Nivel 2 de la GDL tras
    su primera condena?
  choices:
    A: Deben entregar su licencia por 30 días.
    B: Deben inscribirse en un programa de mejoramiento para conductores.
    C: Deben pagar una multa de $500.
    D: Deben volver a realizar el examen de habilidades viales.
  answer: B
  explanation: Los titulares de una licencia de conducir intermedia de Nivel 2 de
    la GDL deben inscribirse en un programa de mejoramiento para conductores tras
    la primera condena.
- id: 122
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia puede un conductor menor de 18 años utilizar un
    dispositivo de comunicación inalámbrica mientras opera un vehículo motorizado?
  choices:
    A: Al hablar con un padre o tutor legal
    B: Al utilizar un dispositivo Bluetooth de manos libres
    C: Al estar detenido en un semáforo en rojo o señal de alto
    D: Al contactar al sistema 9-1-1
  answer: D
  explanation: Los conductores menores de 18 años no pueden utilizar un dispositivo
    de comunicación inalámbrica mientras operan un vehículo motorizado, a menos que
    el teléfono celular se utilice para contactar al sistema 9-1-1.
- id: 123
  category: license_system
  question: ¿Cuántos meses de conducción sin condenas bajo un Nivel 2 de la GDL se
    requieren para ser elegible para un Nivel 3 de la GDL?
  choices:
    A: 6 meses
    B: 9 meses
    C: 12 meses
    D: 18 meses
  answer: C
  explanation: Para ser elegible para un Nivel 3 de la GDL, debe haber completado
    12 meses de conducción sin condenas bajo un Nivel 2 de la GDL y tener al menos
    17 años de edad.
- id: 124
  category: driver_testing
  question: ¿Quién tiene permitido estar en la sala de examen durante la prueba?
  choices:
    A: El solicitante y uno de los padres o tutor
    B: Solo el solicitante que realiza el examen
    C: El solicitante y un instructor de manejo certificado
    D: Hasta dos solicitantes a la vez
  answer: B
  explanation: 'El manual establece estrictamente: "Solo el solicitante que realiza
    el examen tiene permitido estar en la sala de examen".'
- id: 125
  category: license_system
  question: Bajo el programa "Drive for Five", ¿en qué año vencerá generalmente su
    licencia de conducir?
  choices:
    A: Cada cuatro años a partir de la fecha de emisión
    B: En un año en el que su edad sea divisible por cinco
    C: Solo en sus cumpleaños número 21 y 65
    D: Exactamente cinco años después de la fecha en que aprobó su examen vial
  answer: B
  explanation: Bajo el programa "Drive for Five", todas las licencias de conducir
    vencerán en un año en el que su edad sea divisible por cinco (por ejemplo, a los
    25, 30, 35, 40, 45 años, etc.).
- id: 126
  category: license_system
  question: ¿Dónde se encuentra la explicación de un código de restricción de la licencia
    de conducir?
  choices:
    A: En la parte frontal de la licencia de conducir
    B: En el reverso de la licencia de conducir
    C: Solo en el manual del conductor
    D: En la tarjeta de registro del vehículo
  answer: B
  explanation: La restricción se indicará en la parte frontal de la licencia de conducir
    mediante un código de número o letra, y la explicación de la restricción aparecerá
    en el reverso de la licencia de conducir.
- id: 127
  category: license_system
  question: ¿Qué indica el código de restricción "2" en una licencia de conducir?
  choices:
    A: Prótesis de extremidades
    B: Transmisión automática
    C: Lentes correctores
    D: Conducción solo durante el día
  answer: C
  explanation: De acuerdo con la tabla de Restricciones de la Licencia de Conducir,
    el código "2" significa Lentes Correctores.
- id: 128
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una excepción a la regla que requiere un adulto
    supervisor para un conductor de Nivel 2 de la GDL entre las 10:00 pm y las 5:00
    am?
  choices:
    A: Regresar de una actividad autorizada por la escuela
    B: Conducir a casa desde la casa de un amigo
    C: Ir a una tienda de comestibles abierta las 24 horas
    D: Viajar a unas vacaciones familiares
  answer: A
  explanation: 'Las excepciones a la regla del adulto supervisor de 10:00 pm a 5:00
    am incluyen participar, ir o regresar de: (1) un empleo legal; (2) una actividad
    autorizada por la escuela; (3) una actividad religiosa; o (4) una situación de
    emergencia.'
- id: 129
  category: penalties_and_points
  question: ¿Qué sucede si un conductor de Nivel 2 de la GDL recibe una segunda condena
    por una infracción de tránsito en movimiento?
  choices:
    A: Debe pagar una multa de $100 y asistir a una escuela de tránsito.
    B: Su privilegio de conducir es revocado hasta los 18 años y deberá volver a realizar
      el examen como solicitante por primera vez.
    C: Es degradado a un Nivel 1 de la GDL por 6 meses.
    D: Su licencia es suspendida por 30 días.
  answer: B
  explanation: 'El manual establece: "La segunda condena por una infracción de tránsito
    en movimiento requiere la revocación de su privilegio de conducir hasta que cumpla
    18 años y se le requerirá volver a realizar el examen como solicitante por primera
    vez".'
- id: 130
  category: license_system
  question: Para las nuevas licencias de conducir emitidas después del 1 de enero
    de 2001, ¿en qué día vence la licencia?
  choices:
    A: Al final del mes de emisión
    B: El primer día del nuevo año
    C: En el cumpleaños del solicitante
    D: Exactamente 5 años después de la fecha de emisión, independientemente del cumpleaños
  answer: C
  explanation: Las nuevas licencias de conducir emitidas después del 1 de enero de
    2001 vencen en el cumpleaños del solicitante en lugar de al final del mes.
- id: 131
  category: license_system
  question: ¿De cuánto tiempo es el período de gracia para las licencias de conducir
    que vencen en el cumpleaños número 18 o 21 del titular para obtener la licencia
    del color correspondiente?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Según el manual, las licencias de conducir que vencen en el cumpleaños
    número 18 o 21 del titular tendrán un período de gracia de 30 días para permitir
    que el portador obtenga la licencia del color correspondiente.
- id: 132
  category: license_system
  question: ¿Cómo se calcula la tarifa de renovación de una licencia de conducir estándar
    en West Virginia?
  choices:
    A: Una tarifa fija de $25.00 cada cinco años
    B: $5.00 por año hasta que su edad sea divisible por cinco
    C: $10.00 por año por la duración de la licencia
    D: $2.50 por año hasta que su edad sea divisible por diez
  answer: B
  explanation: Todas las tarifas de renovación de la licencia de conducir se basarán
    en el número de años que tendrá la licencia hasta que su edad sea divisible por
    cinco, a una tasa de $5.00 por año.
- id: 133
  category: license_system
  question: ¿Qué se requiere para que un solicitante agregue una designación de diabético,
    sordo o con problemas de audición a su licencia de conducir?
  choices:
    A: Una solicitud por escrito de un familiar directo
    B: Certificación de un audiólogo y/o médico
    C: Una tarifa adicional de $10.00
    D: Una orden judicial
  answer: B
  explanation: Los solicitantes que deseen tener la designación de diabético, sordo
    o con problemas de audición en su licencia de conducir deberán presentar una certificación
    de un audiólogo y/o médico al momento de la solicitud.
- id: 134
  category: penalties_and_points
  question: ¿Cuál es la sanción por no presentar su licencia de conducir cuando un
    oficial de la ley se lo solicite?
  choices:
    A: Es un delito grave (felony)
    B: Es un delito menor (misdemeanor)
    C: Su licencia es revocada inmediatamente
    D: Una sentencia obligatoria de 30 días de cárcel
  answer: B
  explanation: Usted está obligado a presentar su licencia de conducir a petición
    de cualquier oficial de la ley. El incumplimiento de este requisito es un delito
    menor (misdemeanor).
- id: 135
  category: penalties_and_points
  question: Si es arrestado por no presentar su licencia de conducir a un oficial,
    ¿cómo puede evitar una condena?
  choices:
    A: Pagar una multa de $50 en un plazo de 24 horas
    B: Presentar una licencia válida en el tribunal o en la oficina del oficial que
      realizó el arresto
    C: Completar un curso de conducción defensiva
    D: Solicitar una audiencia con el comisionado del DMV
  answer: B
  explanation: No será condenado si su licencia de conducir o permiso de instrucción
    es válido al momento del arresto y puede presentarlo en el tribunal o en la oficina
    del oficial que realizó el arresto.
- id: 136
  category: license_system
  question: ¿Qué restricciones se aplican al conducir una motocicleta con un permiso
    de instrucción de motocicleta?
  choices:
    A: Solo puede conducir en vías públicas durante las horas del día y sin pasajeros
    B: Puede conducir en cualquier momento pero no puede llevar pasajeros
    C: Solo puede conducir en propiedad privada
    D: Puede llevar a un pasajero si este es mayor de 18 años
  answer: A
  explanation: El permiso de instrucción de motocicleta le permite conducir una motocicleta
    en vías públicas durante las horas del día y sin pasajeros.
- id: 137
  category: driver_testing
  question: 'Para obtener un permiso de instrucción de motocicleta, debe aprobar un
    examen de conocimientos de 25 preguntas con una calificación de al menos:'
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: Para obtener un permiso de instrucción de motocicleta, debe aprobar
    un examen de conocimientos de motocicleta de 25 preguntas con una calificación
    del 80% o superior.
- id: 138
  category: license_system
  question: ¿Cuánto tiempo debe tener el permiso de instrucción de motocicleta antes
    de ser elegible para agregar un endoso de motocicleta (F) a su licencia de conducir?
  choices:
    A: 7 días
    B: 14 días
    C: 30 días
    D: 90 días
  answer: A
  explanation: Debe tener su permiso de instrucción por un mínimo de siete (7) días
    antes de ser elegible para agregar un endoso de motocicleta (F).
- id: 139
  category: driver_testing
  question: ¿Cómo puede un solicitante eximirse del examen de habilidades en motocicleta
    del DMV al solicitar un endoso de motocicleta?
  choices:
    A: Teniendo un permiso de instrucción durante 6 meses
    B: Aprobando con éxito el Curso Básico para Motociclistas (BRC)
    C: Pagando una tarifa adicional de $10.00
    D: Teniendo un historial de conducción limpio durante 3 años
  answer: B
  explanation: Si un solicitante que ha tenido un permiso de instrucción durante al
    menos 7 días aprueba con éxito el Curso Básico para Motociclistas (BRC), será
    elegible para que se le exima del examen de habilidades en motocicleta del DMV.
- id: 140
  category: license_system
  question: ¿Cuál es una limitación de tener una licencia de conducir Clase F (solo
    para motocicletas)?
  choices:
    A: No puede conducir en autopistas interestatales
    B: No puede conducir ningún otro tipo de vehículo motorizado
    C: Debe renovar la licencia cada año
    D: Solo puede conducir durante las horas del día
  answer: B
  explanation: La licencia de conducir Clase F limita al titular. El portador de una
    licencia de conducir Clase F no puede conducir ningún otro tipo de vehículo motorizado.
- id: 141
  category: driver_responsibility
  question: Además de su licencia de conducir, ¿qué documentos debe mantener en su
    vehículo y mostrar a un oficial de la ley si lo detienen por una infracción de
    tránsito?
  choices:
    A: El título de su vehículo y acta de nacimiento
    B: Comprobante de seguro de responsabilidad civil de West Virginia y tarjeta de
      registro vigente
    C: Una copia de su historial de manejo y póliza de seguro
    D: El registro de mantenimiento de su vehículo y tarjeta de registro
  answer: B
  explanation: Deberá llevar consigo su comprobante válido de seguro de responsabilidad
    civil de West Virginia (certificado de seguro), así como su tarjeta de registro
    vigente. Si lo detienen por una infracción de tránsito, se le requiere mostrar
    este comprobante.
- id: 142
  category: license_system
  question: ¿Cuál es la tarifa adicional requerida para obtener o renovar una licencia
    de conducir o tarjeta de identificación "PARA IDENTIFICACIÓN FEDERAL" (FOR FEDERAL
    IDENTIFICATION)?
  choices:
    A: $5.00
    B: $7.50
    C: $10.00
    D: $15.00
  answer: C
  explanation: Se requieren $10.00 adicionales para obtener, renovar u obtener un
    duplicado de una licencia de conducir o tarjeta de identificación "PARA IDENTIFICACIÓN
    FEDERAL".
- id: 143
  category: license_system
  question: ¿Qué debe completar una persona menor de 18 años antes de ser elegible
    para un permiso de instrucción de motocicleta?
  choices:
    A: El Curso para Motociclistas Experimentados (ERC)
    B: Los requisitos para una Licencia de Conducir Intermedia de Nivel 2 o una licencia
      de conducir Clase E
    C: 50 horas de conducción supervisada
    D: Un curso de educación vial de la escuela secundaria
  answer: B
  explanation: Cualquier persona menor de 18 años debe haber completado primero los
    requisitos para una Licencia de Conducir Intermedia de Nivel 2 o una licencia
    de conducir clase E antes de ser elegible para un permiso de instrucción de motocicleta.
- id: 144
  category: license_system
  question: El DMV ofrece a los hombres jóvenes la oportunidad de registrarse en el
    Servicio Selectivo de los EE. UU. al solicitar una licencia. ¿A qué grupo de edad
    se aplica esto?
  choices:
    A: Edades 15-26
    B: Edades 16-21
    C: Edades 18-25
    D: Edades 17-30
  answer: A
  explanation: El DMV ofrece a los hombres jóvenes de 15 a 26 años la oportunidad
    de registrarse en el Servicio Selectivo de los EE. UU. al solicitar una licencia
    de conducir, un permiso de instrucción o una tarjeta de identificación con foto.
- id: 145
  category: license_system
  question: Si desea agregar o eliminar la designación de donante de órganos en el
    frente de su licencia de conducir, ¿qué debe hacer?
  choices:
    A: Escribir una carta al comisionado del DMV
    B: Obtener una nueva licencia de conducir y pagar las tarifas correspondientes
    C: Actualizar su estado en línea e imprimir un recibo de confirmación
    D: Solicitar una calcomanía de reemplazo gratuita al DMV
  answer: B
  explanation: Para agregar o eliminar la designación de donante de órganos en el
    frente de la licencia de conducir o tarjeta de identificación, el solicitante
    debe obtener una nueva licencia de conducir y pagar las tarifas correspondientes.
- id: 146
  category: driver_responsibility
  question: ¿Qué medida tomará el DMV si la escuela de un menor informa ausencias
    injustificadas excesivas?
  choices:
    A: La licencia del menor será revocada permanentemente.
    B: La licencia del menor se restringirá a conducir solo para fines laborales,
      médicos, educativos, religiosos y de emergencia hasta los 17 años.
    C: Se requerirá que el menor tome un curso aprobado de conducción defensiva.
    D: El menor recibirá una multa de $100 y tres puntos en su historial de manejo.
  answer: B
  explanation: Si una escuela notifica al DMV sobre ausencias injustificadas excesivas,
    el DMV restringe la licencia del menor a conducir solo para fines laborales, médicos,
    educativos, religiosos y de emergencia hasta los 17 años, o hasta que se presente
    un formulario de Liberación de Restricción.
- id: 147
  category: driver_responsibility
  question: ¿Quién está autorizado para enviar información al DMV con respecto a un
    conductor inseguro?
  choices:
    A: Solo oficiales de la ley
    B: Solo el médico personal del conductor
    C: Familiares directos, fuerzas del orden o médicos
    D: Cualquier conductor con licencia en el estado de West Virginia
  answer: C
  explanation: El manual establece que los familiares directos, las fuerzas del orden
    (si han tenido observación personal) o un médico personal pueden enviar información
    al DMV con respecto a un conductor inseguro.
- id: 148
  category: driver_testing
  question: ¿Cuál es la sanción por negarse a someterse a un reexamen médico, escrito
    o de conducción cuando lo requiera el Comisionado de Vehículos Motorizados?
  choices:
    A: Una multa de $500
    B: Tres puntos añadidos a su historial de manejo
    C: Motivo de suspensión o revocación de su licencia de conducir
    D: Incautación inmediata de su vehículo
  answer: C
  explanation: La negativa a someterse a un examen médico, escrito o de conducción
    requerido es motivo de suspensión o revocación de su licencia de conducir.
- id: 149
  category: driver_responsibility
  question: ¿Bajo qué circunstancias se debe informar un choque a las autoridades
    dentro de los cinco días?
  choices:
    A: Cualquier choque que resulte en daños a la propiedad de más de $500
    B: Cualquier choque que resulte en lesiones, muerte o daños a la propiedad que
      excedan los $1,000
    C: Solo choques que involucren dos o más vehículos
    D: Solo choques que ocurran en una carretera interestatal
  answer: B
  explanation: Los choques que resulten en lesiones o la muerte de cualquier persona,
    o daños a la propiedad que excedan los $1,000, deben informarse por el medio más
    rápido posible dentro de los cinco (5) días.
- id: 150
  category: vehicle_information
  question: ¿Cuál es el monto mínimo de cobertura de seguro de responsabilidad civil
    de West Virginia requerido para daños a la propiedad?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: El monto mínimo de cobertura previsto por la ley incluye $25,000 para
    daños a la propiedad.
- id: 151
  category: vehicle_information
  question: ¿Cuál de las siguientes opciones se considera un comprobante de seguro
    válido cuando lo solicita un oficial de investigación?
  choices:
    A: Una confirmación verbal del propietario del vehículo
    B: Un estado de cuenta bancario que muestre el pago de una prima de seguro
    C: Una imagen mostrada en un dispositivo de comunicación inalámbrica
    D: Una copia del título del vehículo
  answer: C
  explanation: Una imagen mostrada en un dispositivo de comunicación inalámbrica,
    según lo dispuesto en §17D-2A-4, es un comprobante de seguro válido que puede
    presentarse ante un oficial de investigación.
- id: 152
  category: penalties_and_points
  question: ¿Cuál es la sanción por presentar información de seguro falsa o fraudulenta?
  choices:
    A: Una suspensión de la licencia por 30 días y una multa de $500
    B: Una suspensión adicional de la licencia por 90 días, la revocación del registro
      del vehículo y posible tiempo en la cárcel
    C: Una revocación permanente de los privilegios de conducir
    D: Seis puntos añadidos a su historial de conducción
  answer: B
  explanation: Presentar información de seguro falsa o fraudulenta resulta en una
    suspensión adicional de 90 días de su licencia de conducir, la revocación del
    registro de su vehículo y un posible procesamiento judicial que conlleva una multa
    de hasta $1,000 y tiempo en la cárcel que no exceda un año.
- id: 153
  category: safe_driving_rules
  question: Según las estadísticas, ¿cuánto disminuye la concentración de un conductor
    al utilizar un dispositivo de comunicación inalámbrica?
  choices:
    A: 10 - 15 por ciento
    B: 20 - 33 por ciento
    C: 40 - 50 por ciento
    D: 60 - 75 por ciento
  answer: B
  explanation: Las estadísticas muestran que la concentración de un conductor disminuye
    entre un 20 y un 33 por ciento al utilizar un dispositivo de comunicación inalámbrica.
- id: 154
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción por utilizar un dispositivo
    de comunicación electrónica sin equipo de manos libres mientras se conduce?
  choices:
    A: Multa de $50 y 1 punto
    B: Multa de $100 y cero (0) puntos
    C: Multa de $200 y 2 puntos
    D: Multa de $300 y 3 puntos
  answer: B
  explanation: Las multas y puntos asignados por una primera infracción por el uso
    de un dispositivo de comunicación electrónica son una multa de $100 y cero (0)
    puntos.
- id: 155
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan al historial de un conductor por una tercera
    infracción o infracciones posteriores por el uso de un dispositivo de comunicación
    electrónica portátil?
  choices:
    A: Cero (0) puntos
    B: Dos (2) puntos
    C: Tres (3) puntos
    D: Seis (6) puntos
  answer: C
  explanation: Una tercera infracción y las posteriores por el uso de un dispositivo
    de comunicación electrónica resultan en una multa de $300 y tres (3) puntos.
- id: 156
  category: penalties_and_points
  question: ¿Cuánto tiempo permanecen los puntos en su historial de conducción de
    West Virginia?
  choices:
    A: Un (1) año a partir de la fecha de la condena
    B: Dos (2) años a partir de la fecha de la condena
    C: Tres (3) años a partir de la fecha de la condena
    D: Cinco (5) años a partir de la fecha de la condena
  answer: B
  explanation: Los puntos permanecen en su historial de conducción durante dos (2)
    años a partir de la fecha de la condena.
- id: 157
  category: penalties_and_points
  question: ¿Con qué acumulación de puntos enviará el DMV una carta de advertencia
    a un conductor?
  choices:
    A: 3 puntos
    B: 6 puntos
    C: 9 puntos
    D: 12 puntos
  answer: B
  explanation: Cuando tenga seis (6) puntos o más en su historial, el DMV le enviará
    una carta de advertencia, instándole a tener cuidado al conducir.
- id: 158
  category: defensive_driving
  question: ¿Cómo puede un conductor lograr que se le deduzcan tres puntos de su historial
    de conducción?
  choices:
    A: Pagando una tarifa de $100 al DMV
    B: Pasando un año completo sin una infracción de tráfico
    C: Completando una clase de conducción defensiva aprobada de ocho horas
    D: Volviendo a tomar el examen de conducir escrito
  answer: C
  explanation: Se le pueden deducir tres (3) puntos de su historial al completar una
    clase de conducción defensiva aprobada de ocho (8) horas.
- id: 159
  category: driver_responsibility
  question: ¿Qué sucede si recibe una infracción de tráfico en otro estado que es
    miembro del Pacto de Licencias de Conducir (Driver License Compact)?
  choices:
    A: La infracción es ignorada por el DMV de West Virginia.
    B: Debe entregar su licencia de West Virginia y obtener una licencia en ese estado.
    C: La infracción pasa a formar parte de su historial de conducción de West Virginia
      y se pueden asignar puntos.
    D: Se le multará, pero los puntos no pueden transferirse entre estados.
  answer: C
  explanation: Debido a que West Virginia es miembro del Pacto de Licencias de Conducir
    (Driver License Compact), las infracciones de tráfico que reciba en otros estados
    formarán parte de su historial de conducción de West Virginia y, si se justifica,
    se asignarán puntos.
- id: 160
  category: license_system
  question: ¿Cuál es el propósito del Pacto de Infractores No Residentes (Non-Resident
    Violator Compact)?
  choices:
    A: Permite a los conductores ignorar las multas de tráfico recibidas en otros
      estados.
    B: Permite a los conductores aceptar citaciones de tráfico en los estados miembros
      y continuar su camino.
    C: Evita que los conductores de fuera del estado reciban citaciones de tráfico.
    D: Requiere que los conductores paguen las multas inmediatamente al oficial de
      policía.
  answer: B
  explanation: Según el manual, el Pacto de Infractores No Residentes (Non-Resident
    Violator Compact) permite a los conductores aceptar citaciones de tráfico por
    ciertas infracciones y continuar su camino, independientemente de si el conductor
    reside en esa jurisdicción.
- id: 161
  category: penalties_and_points
  question: De acuerdo con la ley estatal de West Virginia, el DMV está obligado a
    suspender su licencia de conducir si usted no cumple con ¿cuál de los siguientes?
  choices:
    A: Seguro del vehículo
    B: Un historial de manejo limpio
    C: Obligaciones de pago de manutención infantil
    D: Un registro de vehículo válido
  answer: C
  explanation: 'El manual establece: ''La ley estatal también exige que el DMV suspenda
    su licencia de conducir si usted no cumple con cualquier obligación de pago de
    manutención infantil''.'
- id: 162
  category: penalties_and_points
  question: ¿Cuál es la sanción por usar la licencia de conducir de otra persona como
    propia o proporcionar información falsa en su solicitud?
  choices:
    A: Una suspensión de 30 días
    B: Una suspensión de 60 días
    C: Una suspensión de 90 días
    D: Una revocación de 1 año
  answer: C
  explanation: 'Es ilegal proporcionar información falsa o usar la licencia de otra
    persona como propia. El manual especifica: ''La sanción por estas infracciones
    es una suspensión de 90 días''.'
- id: 163
  category: penalties_and_points
  question: ¿El DMV debe revocar su licencia de conducir si recibe cuántas condenas
    por conducción temeraria en un período de 24 meses?
  choices:
    A: Dos (2)
    B: Tres (3)
    C: Cuatro (4)
    D: Cinco (5)
  answer: B
  explanation: El DMV debe revocar una licencia de conducir cuando recibe una notificación
    de condena final por 'Tres (3) condenas por conducción temeraria en 24 meses'.
- id: 164
  category: penalties_and_points
  question: ¿Cuál es la sentencia mínima obligatoria de cárcel por conducir mientras
    su licencia de conducir está revocada por un DUI?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: El manual establece que la sanción por conducir mientras su licencia
    de conducir está revocada por un DUI es una sentencia mínima obligatoria de cárcel
    de 30 días a seis (6) meses.
- id: 165
  category: license_system
  question: ¿Cuánto cuesta ver y comprar un historial de manejo en línea a través
    de los Servicios en Línea del DMV?
  choices:
    A: $5.00
    B: $10.00
    C: $12.50
    D: $15.00
  answer: C
  explanation: Los solicitantes tienen la posibilidad de ver y comprar un historial
    de manejo en línea por una tarifa de $12.50.
- id: 166
  category: penalties_and_points
  question: ¿Cuántos puntos se añadirán a su historial de manejo por huir de un oficial
    de policía?
  choices:
    A: 3 puntos
    B: 5 puntos
    C: 6 puntos
    D: 8 puntos
  answer: D
  explanation: De acuerdo con la Escala de Puntos proporcionada en el manual, 'Huir
    de un oficial' conlleva un valor de 8 puntos.
- id: 167
  category: penalties_and_points
  question: ¿Cuál es el valor en puntos por una condena de exceso de velocidad en
    una zona escolar?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: De acuerdo con la Escala de Puntos, 'Exceso de velocidad en una zona
    escolar' conlleva un valor de 6 puntos.
- id: 168
  category: safe_driving_rules
  question: ¿Tener más de 3 pasajeros en el asiento delantero de su vehículo resultará
    en cuántos puntos en su historial de manejo?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: A
  explanation: La Escala de Puntos indica que tener 'Más de 3 pasajeros en el asiento
    delantero' resulta en 2 puntos.
- id: 169
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma efectiva de ayudar a alguien
    a recuperar la sobriedad después de beber alcohol?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Tomar aire fresco
    D: Tiempo
  answer: D
  explanation: El manual señala que el ejercicio físico, el café solo, el aire fresco
    y las duchas frías no ayudan eficazmente a alguien a recuperar la sobriedad. 'El
    tiempo es la única influencia que sobria'.
- id: 170
  category: alcohol_drugs_health
  question: 'Una lata de cerveza de 12 onzas contiene la misma cantidad de alcohol
    que:'
  choices:
    A: Una copa de vino de 12 onzas
    B: Un trago (shot) de una onza de whisky de 100 grados (100-proof)
    C: Dos onzas de vodka de 80 grados (80-proof)
    D: Un vaso de seis onzas de licor de malta
  answer: B
  explanation: 'El manual establece: ''La cantidad de alcohol en un trago de una onza
    de whisky de 100 grados, una copa de vino de seis onzas o una lata de cerveza
    de 12 onzas es la misma''.'
- id: 171
  category: alcohol_drugs_health
  question: Bajo la ley de tolerancia cero de West Virginia, ¿qué sucede si se encuentra
    a un conductor menor de 21 años con cualquier cantidad medible de alcohol en su
    sistema?
  choices:
    A: Recibirán una advertencia por la primera infracción.
    B: Perderán su licencia de conducir.
    C: Serán multados pero pueden conservar su licencia.
    D: Recibirán 6 puntos en su historial de conducción.
  answer: B
  explanation: 'West Virginia tiene una ley de tolerancia cero para conductores menores
    de 21 años. El manual establece: ''si usted es menor de 21 años y se encuentra
    cualquier cantidad de alcohol en su sistema, perderá su licencia de conducir''.'
- id: 172
  category: alcohol_drugs_health
  question: En West Virginia, se presume que un conductor está conduciendo bajo la
    influencia si su concentración de alcohol en sangre (BAC) es igual o superior
    a ¿qué nivel?
  choices:
    A: 0.04 por ciento
    B: 0.05 por ciento
    C: 0.08 por ciento
    D: 0.10 por ciento
  answer: C
  explanation: 'El manual establece: ''Si el BAC de un conductor es de 0.08 por ciento
    o más, se presume que está conduciendo bajo la influencia''.'
- id: 173
  category: alcohol_drugs_health
  question: Bajo la Ley de Consentimiento Implícito (Implied Consent Law), ¿cuál es
    la sanción por negarse a realizar una prueba de alcoholímetro (Breathalyzer) designada
    al ser arrestado por DUI?
  choices:
    A: Una suspensión de la licencia por 90 días
    B: Una multa de $500 y 30 días de cárcel
    C: Revocación de su privilegio de conducir por un período de un año hasta de por
      vida
    D: Incautación inmediata de su vehículo
  answer: C
  explanation: Si se niega a realizar la prueba del alcoholímetro, el manual establece
    que 'su privilegio para operar un vehículo motorizado será revocado por un período
    de un (1) año y hasta de por vida'.
- id: 174
  category: penalties_and_points
  question: 'Si es menor de 18 años y comete una infracción por DUI, su licencia de
    conducir será revocada hasta que cumpla los 18 años o por el período legal aplicable,
    lo que sea:'
  choices:
    A: Más corto
    B: Más largo
    C: Determinado por el oficial que realiza el arresto
    D: Acordado por el tribunal
  answer: B
  explanation: Si es menor de 18 años, una infracción por DUI resultará en la revocación
    de su licencia de conducir hasta que cumpla los 18 años o por el período legal
    aplicable de revocación o suspensión, 'lo que sea más largo'.
- id: 175
  category: penalties_and_points
  question: Si es menor de 18 años, ¿cuál es la sanción por una infracción de DUI
    con respecto a su licencia de conducir?
  choices:
    A: Revocación por exactamente 30 días
    B: Revocación hasta los 18 años o el período legal, lo que sea más largo
    C: Una advertencia por la primera infracción
    D: Suspensión por 6 meses
  answer: B
  explanation: Si es menor de 18 años, una infracción por DUI resultará en la revocación
    de su licencia de conducir hasta que cumpla los 18 años o por el período legal
    aplicable de revocación o suspensión, lo que sea más largo.
- id: 176
  category: penalties_and_points
  question: ¿Qué debe completar antes de ser elegible para restablecer sus privilegios
    de conducción después de una revocación o suspensión por DUI?
  choices:
    A: Un curso de conducción defensiva
    B: Un programa prescrito de Seguridad y Tratamiento
    C: 50 horas de servicio comunitario
    D: Una disculpa por escrito al DMV
  answer: B
  explanation: Cada vez que su licencia de conducir sea revocada o suspendida por
    un DUI, debe completar un programa prescrito de Seguridad y Tratamiento antes
    de ser elegible para restablecer sus privilegios de conducción.
- id: 177
  category: penalties_and_points
  question: ¿Cuál es el período mínimo de revocación por una primera infracción bajo
    la ley de Tolerancia Cero (menor de 21 años con CUALQUIER alcohol medible)?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: B
  explanation: Según la tabla de sanciones por DUI, una primera infracción de Tolerancia
    CERO (menor de 21 años con CUALQUIER alcohol medible) conlleva un período mínimo
    de revocación de 30 días.
- id: 178
  category: penalties_and_points
  question: La participación en el Programa de Interbloqueo (Interlock Program) es
    obligatoria si la licencia de un conductor ha sido revocada por ¿cuántos DUI o
    infracciones relacionadas dentro de un período de diez años?
  choices:
    A: Uno o más
    B: Dos o más
    C: Tres o más
    D: Cuatro o más
  answer: B
  explanation: Si al conductor se le ha revocado la licencia por dos (2) o más DUI
    o infracciones relacionadas dentro de un período de diez años, la participación
    en el Programa de Interbloqueo es obligatoria.
- id: 179
  category: alcohol_drugs_health
  question: 'Después de estar despierto durante 18 horas, sus habilidades de conducción
    son comparables a las de:'
  choices:
    A: Un conductor adolescente con licencia reciente
    B: Alguien que conduce bajo una lluvia intensa
    C: Alguien bajo la influencia de drogas o alcohol
    D: Un conductor distraído por un teléfono celular
  answer: C
  explanation: Después de estar despierto durante 18 horas (el tiempo varía), las
    habilidades de conducción son comparables a las de alguien bajo la influencia
    de drogas o alcohol.
- id: 180
  category: defensive_driving
  question: Si se siente somnoliento mientras conduce, ¿una siesta de cuánto tiempo
    puede marcar una gran diferencia para reducir la somnolencia?
  choices:
    A: De 5 a 10 minutos
    B: De 10 a 20 minutos
    C: De 30 a 45 minutos
    D: Al menos 1 hora
  answer: B
  explanation: Si tiene sueño, no conduzca. Estaciónese en un área segura tan pronto
    como pueda y tome una siesta corta. Tan solo 10-20 minutos de sueño pueden marcar
    una gran diferencia.
- id: 181
  category: defensive_driving
  question: ¿Cuál de las siguientes es una señal de que podría estar somnoliento al
    conducir?
  choices:
    A: Revisar sus espejos con frecuencia
    B: Dificultad para recordar las últimas millas recorridas
    C: Mantener una velocidad constante
    D: Anticipar las acciones de otros conductores
  answer: B
  explanation: Las señales de que está somnoliento al conducir incluyen dificultad
    para recordar las últimas millas recorridas, pasar por alto señales de tránsito
    o salidas, y bostezar.
- id: 182
  category: driver_testing
  question: 'Para aprobar el examen de la vista sin restricciones, su visión debe
    ser de al menos:'
  choices:
    A: 20/20 en ambos ojos
    B: 20/30 en al menos un ojo
    C: 20/40 o mejor usando ambos ojos
    D: 20/50 o mejor usando ambos ojos
  answer: C
  explanation: Si su visión es de 20/40 o mejor usando ambos ojos, ya sea con o sin
    lentes correctivos convencionales, y no muestra ningún defecto visual grave, aprobará
    el examen de la vista.
- id: 183
  category: driver_testing
  question: ¿Cuál de los siguientes NO puede utilizarse para cumplir con los estándares
    de agudeza visual para una licencia de conducir?
  choices:
    A: Lentes de contacto
    B: Gafas convencionales
    C: Lentes biópticos o telescópicos
    D: Gafas de sol graduadas
  answer: C
  explanation: Los sistemas de lentes especiales, incluidos, entre otros, los lentes
    biópticos o telescópicos, no pueden utilizarse para cumplir con los estándares
    de agudeza visual.
- id: 184
  category: driver_testing
  question: ¿Cuántas preguntas debe responder correctamente para aprobar el examen
    de conocimientos automatizado?
  choices:
    A: 15 de 20
    B: 18 de 25
    C: 19 de 25
    D: 20 de 25
  answer: C
  explanation: El examen de conocimientos tiene al menos 25 preguntas. Debe responder
    correctamente 19 de las 25 preguntas para aprobar el examen.
- id: 185
  category: driver_testing
  question: ¿Qué sucede si no responde una pregunta en el examen de conocimientos
    dentro del límite de tiempo prescrito?
  choices:
    A: La pregunta se omite y recibe una nueva
    B: La pregunta se considera incorrecta
    C: El examen se pausa hasta que responda
    D: Recibe medio crédito por la pregunta
  answer: B
  explanation: Existe un límite de tiempo en el examen y cualquier pregunta que no
    se responda en el tiempo prescrito se considerará incorrecta.
- id: 186
  category: driver_testing
  question: ¿Quién debe completar un curso corto de concientización sobre DUI al aprobar
    el examen de habilidades viales?
  choices:
    A: Solo los conductores menores de 18 años
    B: Solo los conductores que han tenido un DUI previo
    C: Todos los solicitantes por primera vez y conductores de otros estados que lleguen
      a West Virginia
    D: Solo los solicitantes de licencia de conducir comercial
  answer: C
  explanation: El DMV requiere que todos los solicitantes de licencia de conducir
    por primera vez... completen un curso corto de concientización sobre DUI (conducir
    bajo la influencia). El curso debe ser completado por todos los conductores de
    otros estados que lleguen a West Virginia.
- id: 187
  category: driver_testing
  question: Si su vehículo de prueba tiene un defecto menor durante la revisión del
    vehículo, ¿qué podría permitirle hacer el examinador?
  choices:
    A: Continuar el examen en otro vehículo en la misma fecha de la prueba
    B: Hacer que se corrija el defecto menor y continuar con el examen
    C: Omitir la parte de revisión del vehículo de la prueba
    D: Realizar la prueba de manejo de todos modos sin corregir el defecto
  answer: B
  explanation: El examinador puede permitirle corregir un defecto menor y continuar
    con el examen. Sin embargo, no se le permitirá continuar el examen en otro vehículo
    en la misma fecha de la prueba.
- id: 188
  category: penalties_and_points
  question: ¿Cuál es el período mínimo de revocación por una primera infracción de
    DUI con un BAC de .15 o superior?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: C
  explanation: De acuerdo con la tabla de sanciones por DUI, una primera infracción
    por DUI (alcohol o drogas) con un BAC (concentración de alcohol en sangre) de
    .15 o superior conlleva un período mínimo de revocación de 45 días.
- id: 189
  category: penalties_and_points
  question: ¿Cuál es el período mínimo de revocación por un DUI que resulte en muerte
    (un delito grave)?
  choices:
    A: 60 días
    B: 6 meses
    C: 1 año
    D: 5 años
  answer: C
  explanation: De acuerdo con la tabla de sanciones por DUI, un DUI con resultado
    de muerte (delito grave) conlleva un período mínimo de revocación de 1 año.
- id: 190
  category: driver_testing
  question: ¿Qué sucederá si un solicitante no puede ubicar y demostrar el uso de
    cualquier equipo de seguridad del vehículo durante el examen de habilidades viales?
  choices:
    A: El examinador le mostrará cómo usarlo.
    B: Resultará en una reprobación automática.
    C: Se deducirán puntos de su puntaje final.
    D: Debe cambiar a un vehículo de prueba diferente.
  answer: B
  explanation: Según el manual, si el solicitante no puede ubicar y demostrar el uso
    de cualquiera de los equipos de seguridad del vehículo, esto resultará en una
    reprobación automática en el examen de habilidades viales.
- id: 191
  category: vehicle_information
  question: ¿Cuál de los siguientes se considera equipo ilegal en un vehículo de prueba?
  choices:
    A: Ventanillas polarizadas con menos del 35 por ciento de transmisión de luz.
    B: Una carga en un vehículo de pasajeros que se extiende 4 pulgadas más allá de
      los guardabarros derechos.
    C: Exactamente dos luces de marcha atrás.
    D: Una ventanilla del lado del conductor que se puede bajar.
  answer: A
  explanation: El manual enumera las 'ventanillas polarizadas con menos del 35 por
    ciento de transmisión de luz' como equipo ilegal.
- id: 192
  category: vehicle_information
  question: ¿Quién está autorizado a tener luces intermitentes rojas y/o azules en
    su vehículo?
  choices:
    A: Cualquier vehículo de pasajeros.
    B: Solo camiones de remolque comerciales.
    C: Solo vehículos de emergencia autorizados.
    D: Vehículos que participan en un cortejo fúnebre.
  answer: C
  explanation: El manual establece que las luces intermitentes rojas y/o azules son
    equipo ilegal, y solo los vehículos de emergencia autorizados pueden tener estas
    luces de advertencia.
- id: 193
  category: driver_testing
  question: Si reprueba el examen de conocimientos o el de habilidades de conducción,
    ¿cuánto tiempo debe esperar antes de poder examinarse de nuevo?
  choices:
    A: 24 horas
    B: 48 horas
    C: Una semana
    D: Un mes
  answer: C
  explanation: Los solicitantes que reprueben el examen de conocimientos o el de habilidades
    de conducción no podrán examinarse dos veces en un periodo de una (1) semana,
    de acuerdo con el §17B-2-6 del Código del Estado de West Virginia.
- id: 194
  category: safe_driving_rules
  question: ¿Cuándo debe ajustar el asiento del vehículo y el espejo retrovisor para
    el examen de conducción?
  choices:
    A: Mientras conduce hacia la primera intersección.
    B: Antes de conducir.
    C: Solo si el examinador se lo pide.
    D: Después de completar la prueba de habilidades básicas de control del vehículo.
  answer: B
  explanation: El manual instruye a los conductores a ajustar el asiento del vehículo
    y el espejo retrovisor antes de conducir para asegurar un mejor control del vehículo.
- id: 195
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una técnica de conducción adecuada para utilizar
    durante su examen de conducción?
  choices:
    A: Mantener una mano en el volante y la otra en la palanca de cambios.
    B: Apoyar el codo izquierdo en la ventanilla para mantener una postura relajada.
    C: Mantener ambas manos en el volante y no apoyar el codo en la ventanilla.
    D: Ajustar los espejos mientras circula por una pendiente moderada.
  answer: C
  explanation: 'El manual establece explícitamente: ''Mantenga ambas manos en el volante
    y no apoye el codo en la ventanilla''.'
- id: 196
  category: driver_testing
  question: ¿Cuál de las siguientes acciones resultará en una reprobación automática
    durante el examen de conducción?
  choices:
    A: Olvidar ajustar el radio.
    B: Subirse al bordillo (acera) durante cualquier parte del examen de conducción.
    C: Hacerle al examinador una pregunta sobre las instrucciones.
    D: Detenerse demasiado atrás de la línea de parada.
  answer: B
  explanation: Subirse al bordillo durante cualquier parte del examen de conducción
    figura en la lista de 'Reprobaciones automáticas'.
- id: 197
  category: defensive_driving
  question: Al detenerse detrás de otro vehículo en una intersección, ¿qué se considera
    un espacio seguro?
  choices:
    A: Detenerse donde pueda ver los neumáticos traseros del vehículo que tiene delante.
    B: Detenerse exactamente a la distancia de un vehículo por detrás.
    C: Detenerse donde pueda ver la cara del conductor en su espejo retrovisor.
    D: Detenerse a menos de tres pies del parachoques trasero del vehículo.
  answer: A
  explanation: Un espacio seguro al detenerse detrás de otro vehículo es detenerse
    donde pueda ver los neumáticos traseros del vehículo que tiene delante.
- id: 198
  category: safe_driving_rules
  question: Si debe detenerse antes de realizar un giro debido al tráfico, ¿cómo debe
    colocar las ruedas delanteras?
  choices:
    A: Apuntando ligeramente hacia la derecha.
    B: Apuntando ligeramente hacia la izquierda.
    C: Giradas en la dirección a la que pretende ir.
    D: Apuntando hacia adelante.
  answer: D
  explanation: Si debe detenerse antes de realizar un giro debido al tráfico, señales
    o letreros, debe mantener las ruedas delanteras apuntando hacia adelante.
- id: 199
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a los cambios de carril mientras se conduce
    a través de una intersección?
  choices:
    A: Puede cambiar de carril si utiliza la luz de giro.
    B: Debe cambiar de carril para evitar a los peatones.
    C: No cambie de carril mientras atraviesa la intersección.
    D: Solo puede cambiar de carril si la intersección está controlada por un semáforo.
  answer: C
  explanation: 'Al conducir a través de una intersección, el manual establece explícitamente:
    ''No cambie de carril mientras atraviesa la intersección''.'
- id: 200
  category: vehicle_information
  question: ¿Qué ventanilla del vehículo de prueba DEBE ser totalmente operativa para
    el examen de conducción?
  choices:
    A: La ventanilla trasera del pasajero.
    B: La ventanilla del lado del conductor.
    C: La ventanilla del pasajero delantero.
    D: El parabrisas trasero.
  answer: B
  explanation: Bajo las características que deben ser totalmente funcionales, el manual
    especifica que la 'ventanilla del lado del conductor DEBE ser operativa'.
- id: 201
  category: vehicle_information
  question: ¿Se considera que un vehículo de pasajeros está equipado ilegalmente si
    una carga se extiende más allá de la línea de los guardabarros en el lado izquierdo
    o más de cuántas pulgadas más allá de la línea de los guardabarros en el lado
    derecho?
  choices:
    A: 2 pulgadas
    B: 4 pulgadas
    C: 6 pulgadas
    D: 8 pulgadas
  answer: C
  explanation: Se considera equipo ilegal tener cualquier carga en el vehículo de
    pasajeros que se extienda más allá de la línea de los guardabarros en el lado
    izquierdo o seis (6) pulgadas más allá de la línea de los guardabarros en el lado
    derecho.
- id: 202
  category: driver_testing
  question: Al practicar habilidades básicas de control del vehículo, como el estacionamiento
    en paralelo, ¿debe practicar con un padre, tutor o amigo que tenga la licencia
    correspondiente y sea mayor de qué edad?
  choices:
    A: '18'
    B: '21'
    C: '25'
    D: '30'
  answer: B
  explanation: El manual aconseja practicar estos ejercicios con un padre, tutor o
    amigo que tenga la licencia correspondiente y sea mayor de 21 años.
- id: 203
  category: driver_testing
  question: Durante la prueba de habilidades básicas de control, ¿qué debe hacer si
    su luz direccional se cancela automáticamente antes de haber completado la maniobra?
  choices:
    A: Dejarla apagada para evitar confundir a otros conductores.
    B: Reactivarla cuando sea necesario.
    C: Usar señales manuales en su lugar.
    D: Detener el vehículo y reiniciar el ejercicio.
  answer: B
  explanation: 'El manual establece: ''Si su luz direccional se cancela automáticamente,
    asegúrese de reactivarla cuando sea necesario''.'
- id: 204
  category: safe_driving_rules
  question: Después de completar un giro y acelerar a la velocidad del tráfico, ¿hacia
    qué carril debe moverse cuando sea seguro hacerlo?
  choices:
    A: El carril situado más a la izquierda.
    B: El carril central.
    C: El carril situado más a la derecha.
    D: El carril con la menor cantidad de tráfico.
  answer: C
  explanation: Después de un giro, debe revisar sus puntos ciegos y espejos y 'moverse
    al carril situado más a la derecha cuando sea seguro hacerlo (si aún no está allí)'.
- id: 205
  category: driver_testing
  question: ¿Qué debe hacer con un dispositivo de estacionamiento manos libres durante
    la prueba de habilidades básicas de control?
  choices:
    A: Usarlo para demostrar competencia.
    B: Desactivarlo.
    C: Usarlo solo en su último intento.
    D: Mantenerlo en espera en caso de que necesite ayuda.
  answer: B
  explanation: 'El manual establece en el formulario de la Prueba de Habilidades Básicas
    de Control: ''Si está equipado, el dispositivo de estacionamiento manos libres
    debe estar desactivado''.'
- id: 206
  category: safe_driving_rules
  question: Al acercarse a una curva, ¿cuándo debe reducir su velocidad?
  choices:
    A: Mientras está en medio de la curva
    B: Después de salir de la curva
    C: Antes de entrar en la curva
    D: Solo si ve que se aproxima otro tráfico
  answer: C
  explanation: 'El manual establece: ''Antes de entrar en la curva, reduzca su velocidad
    para que no sea necesario frenar más en la curva, y mantenga el vehículo en el
    carril''.'
- id: 207
  category: driver_testing
  question: ¿Cuál de los siguientes métodos de dirección NO es aceptable durante la
    prueba de manejo?
  choices:
    A: Dirección de mano sobre mano
    B: Dirección de mano a mano
    C: Mantener ambas manos en la parte exterior del volante
    D: Girar el volante con la palma de la mano (palmeo)
  answer: D
  explanation: 'El manual establece: ''Todos los métodos de dirección son aceptables
    (es decir, mano sobre mano y mano a mano) siempre que ambas manos estén en la
    parte exterior del volante (sin usar la palma de la mano)''.'
- id: 208
  category: safe_driving_rules
  question: Al completar un giro a la izquierda en una carretera de varios carriles,
    ¿en qué carril debe terminar el giro?
  choices:
    A: El carril situado más a la izquierda
    B: El carril central
    C: El carril de la derecha más cercano a la acera
    D: Cualquier carril disponible
  answer: C
  explanation: 'El manual establece con respecto al uso adecuado del carril: ''Termine
    el giro en el carril de la derecha más cercano a la acera''.'
- id: 209
  category: safe_driving_rules
  question: ¿Dónde está explícitamente prohibido intentar un cambio de carril?
  choices:
    A: En una autopista de varios carriles
    B: En las intersecciones
    C: En áreas urbanas
    D: En caminos rurales
  answer: B
  explanation: 'El manual establece bajo el Uso adecuado del carril: ''No intente
    realizar cambios de carril en las intersecciones''.'
- id: 210
  category: safe_driving_rules
  question: Si no hay una línea de parada o un cruce de peatones en una intersección,
    ¿dónde debe detener su vehículo?
  choices:
    A: En medio de la intersección
    B: Justo después de la señal de alto
    C: Antes de que su vehículo entre en la intersección
    D: A la altura de la línea central de la carretera que cruza
  answer: C
  explanation: 'El manual establece: ''Si no hay una línea de parada o un cruce de
    peatones, deténgase antes de que su vehículo entre en la intersección''.'
- id: 211
  category: driver_testing
  question: ¿Qué sucede si utiliza un dispositivo de comunicación inalámbrica en cualquier
    momento durante el examen de conducción?
  choices:
    A: Perderá 5 puntos.
    B: Será descalificado.
    C: Se le dará una advertencia.
    D: El examinador le pedirá que lo apague.
  answer: B
  explanation: El manual enumera 'Si en cualquier momento utiliza su dispositivo de
    comunicación inalámbrica' bajo Fallas Automáticas del Examen de Habilidades de
    Conducción, lo que significa que será descalificado.
- id: 212
  category: safe_driving_rules
  question: ¿Cómo debe revisar adecuadamente sus puntos ciegos antes de cambiar de
    carril?
  choices:
    A: Confiando únicamente en su espejo retrovisor
    B: Mirando sobre su hombro (revisión con la cabeza)
    C: Revisando sus espejos laterales dos veces
    D: Activando su luz direccional y esperando 3 segundos
  answer: B
  explanation: 'El manual establece: ''...revise sus puntos ciegos mirando sobre su
    hombro (revisión con la cabeza)...'''
- id: 213
  category: driver_testing
  question: Durante el examen de conducción, ¿cuál es la expectativa para su posición
    en el carril al conducir en una zona urbana?
  choices:
    A: Debe conducir en el carril del extremo izquierdo en todo momento.
    B: Debe circular sobre las marcas del carril para evitar los autos estacionados.
    C: Su vehículo debe estar centrado en el carril adecuado (el carril del extremo
      derecho).
    D: Debe cambiar de carril con frecuencia para mantener la velocidad.
  answer: C
  explanation: 'El manual establece bajo Conducción en Zonas Urbanas: ''Su vehículo
    debe estar centrado en el carril adecuado (el carril del extremo derecho)...'''
- id: 214
  category: driver_testing
  question: Al realizar la maniobra de estacionamiento en paralelo en el examen de
    habilidades de control básico, ¿qué distancia de la línea del bordillo resulta
    en una falla después de 3 intentos?
  choices:
    A: Fuera de 6 pulgadas
    B: Fuera de 12 pulgadas
    C: Fuera de 18 pulgadas
    D: Fuera de 24 pulgadas
  answer: C
  explanation: El formulario de calificación del Examen de Habilidades de Control
    Básico indica una falla por estar 'fuera de la línea del bordillo de 18” (después
    de 3 intentos)'.
- id: 215
  category: safe_driving_rules
  question: ¿Qué debe hacer con su luz direccional al completar un giro o un cambio
    de carril?
  choices:
    A: Dejarla encendida por 100 pies adicionales
    B: Cancelarla inmediatamente
    C: Esperar a que se cancele automáticamente
    D: Parpadear sus luces de emergencia para indicar que ha terminado
  answer: B
  explanation: 'El manual establece explícitamente: ''Cancele las luces direccionales
    al completar un giro o un cambio de carril''.'
- id: 216
  category: driver_testing
  question: ¿Qué sucederá si se niega a realizar cualquier maniobra que forme parte
    del examen de conducción?
  choices:
    A: Perderá 10 puntos.
    B: El examinador la realizará por usted.
    C: Será descalificado.
    D: Se saltará esa sección y se le calificará el resto.
  answer: C
  explanation: El manual enumera 'Si se niega a realizar cualquier maniobra que forme
    parte del examen de conducción' bajo Fallas Automáticas del Examen de Habilidades
    de Conducción, lo que significa que será descalificado.
- id: 217
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico de ocho lados (octágono)?
  choices:
    A: Ceder el paso al tráfico que cruza
    B: Debe detenerse por completo
    C: Hay una zona escolar más adelante
    D: El comienzo de una zona de no rebasar
  answer: B
  explanation: Las señales de ocho lados (octágono) están reservadas para las señales
    de alto. Estas señales significan que debe detenerse por completo.
- id: 218
  category: safe_driving_rules
  question: ¿Dónde debe detenerse ante una señal de alto si no hay marcas en el pavimento
    ni cruces peatonales?
  choices:
    A: Directamente al lado de la señal de alto
    B: Diez pies antes de la intersección
    C: Antes de entrar en la intersección
    D: Después de avanzar un poco en la intersección para ver el tráfico
  answer: C
  explanation: Si no hay marcas en el pavimento ni cruces peatonales, debe detenerse
    antes de entrar en una intersección en un lugar donde pueda ver el tráfico que
    viene de todas las direcciones.
- id: 219
  category: signs_and_signals
  question: ¿Qué marca una señal de tráfico en forma de banderín (pennant)?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona escolar
    C: El comienzo de una zona de no rebasar
    D: Una zona de ceder el paso
  answer: C
  explanation: Una señal en forma de banderín marca el comienzo de una zona de no
    rebasar.
- id: 220
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en una zona escolar cuando hay
    niños presentes?
  choices:
    A: 10 m.p.h.
    B: 15 m.p.h.
    C: 20 m.p.h.
    D: 25 m.p.h.
  answer: B
  explanation: El límite de velocidad máximo en una zona escolar es de 15 m.p.h. cuando
    hay niños presentes o cuando se especifique.
- id: 221
  category: signs_and_signals
  question: ¿Qué identifica una señal triangular con la punta hacia arriba, un borde
    rojo reflectante y un centro naranja fluorescente?
  choices:
    A: Un vehículo de movimiento lento o un vehículo que realiza una parada de emergencia
    B: Un vehículo de transporte de materiales peligrosos
    C: Una zona de construcción más adelante
    D: Una señal de ceder el paso próxima
  answer: A
  explanation: Una señal triangular con la punta hacia arriba, un borde rojo reflectante
    y un centro naranja fluorescente identifica un vehículo de movimiento lento o
    un vehículo que ha realizado una parada de emergencia.
- id: 222
  category: signs_and_signals
  question: ¿Qué significa un contorno rojo con una barra diagonal que lo atraviesa
    en una señal de tráfico?
  choices:
    A: Precaución
    B: Ceder el paso
    C: 'No'
    D: Pare
  answer: C
  explanation: Un contorno rojo con una barra diagonal que lo atraviesa siempre significa
    "NO".
- id: 223
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una regla con respecto a un carril de giro
    doble (dual turn lane)?
  choices:
    A: Puede usarse para adelantar y rebasar a otros vehículos de manera segura.
    B: Se utiliza únicamente para realizar giros a la izquierda desde cualquier dirección.
    C: Se utiliza únicamente para realizar giros a la derecha.
    D: Es un carril designado para vehículos de emergencia.
  answer: B
  explanation: Un carril de giro doble se señaliza sobre un carril de la carretera
    que se utiliza únicamente para realizar giros a la izquierda desde cualquier dirección.
    Nunca debe usar un carril de giro para adelantar y rebasar a otros vehículos.
- id: 224
  category: signs_and_signals
  question: ¿De qué color son las señales de velocidad recomendada que se encuentran
    en las rampas de entrada y salida de las autopistas interestatales?
  choices:
    A: Blanco sobre verde
    B: Negro sobre amarillo
    C: Negro sobre blanco
    D: Blanco sobre azul
  answer: B
  explanation: Las señales de velocidad recomendada se pueden encontrar en las rampas
    de entrada y salida de las autopistas interestatales, las cuales muestran la velocidad
    máxima segura recomendada para conducir en la rampa. Estas señales de advertencia
    son de color negro sobre amarillo.
- id: 225
  category: signs_and_signals
  question: Aunque la mayoría de las señales de advertencia son amarillas con letras
    negras, ¿de qué color pueden ser las señales de advertencia para peatones y zonas
    escolares?
  choices:
    A: Amarillo-verde con letras negras
    B: Naranja con letras negras
    C: Blanco con letras rojas
    D: Azul con letras blancas
  answer: A
  explanation: Las señales de advertencia para peatones y zonas escolares pueden ser
    de color amarillo-verde con letras negras.
- id: 226
  category: signs_and_signals
  question: ¿Cuál es el color básico para las señales y dispositivos de construcción
    y mantenimiento?
  choices:
    A: Amarillo
    B: Rojo
    C: Naranja
    D: Marrón
  answer: C
  explanation: El naranja es el color básico para las señales y dispositivos de construcción
    y mantenimiento.
- id: 227
  category: signs_and_signals
  question: ¿Qué indican las franjas diagonales con inclinación hacia abajo a la derecha
    en una barricada o panel vertical?
  choices:
    A: El conductor debe desviarse hacia la izquierda.
    B: El conductor debe desviarse hacia la derecha.
    C: La carretera está completamente cerrada más adelante.
    D: Hay un cruce de peatones a la derecha.
  answer: B
  explanation: Las franjas diagonales en una barricada o panel vertical guían al conductor.
    Las franjas con inclinación hacia abajo a la derecha significan que el conductor
    debe desviarse hacia la derecha.
- id: 228
  category: signs_and_signals
  question: ¿De qué color son las señales de servicios para el conductor, que le informan
    qué servicios están disponibles en las salidas de las autopistas interestatales?
  choices:
    A: Blanco sobre verde
    B: Blanco sobre marrón
    C: Blanco sobre azul
    D: Negro sobre amarillo
  answer: C
  explanation: Las señales de servicios para el conductor son de color blanco sobre
    azul.
- id: 229
  category: signs_and_signals
  question: ¿De qué color son las señales de guía para parques y áreas recreativas
    públicas?
  choices:
    A: Blanco sobre verde
    B: Blanco sobre marrón
    C: Blanco sobre azul
    D: Amarillo sobre negro
  answer: B
  explanation: Las señales para parques y áreas recreativas públicas son de color
    blanco sobre marrón.
- id: 230
  category: signs_and_signals
  question: ¿Qué indica una señal circular amarilla y negra?
  choices:
    A: Una zona escolar más adelante
    B: Una zona de no adelantar
    C: Advertencia anticipada de un cruce de ferrocarril más adelante
    D: Una zona de hospital
  answer: C
  explanation: Una señal circular amarilla y negra advierte con anticipación sobre
    un cruce de ferrocarril más adelante.
- id: 231
  category: defensive_driving
  question: ¿Qué debe hacer cuando ve una señal de advertencia que indica una colina
    adelante?
  choices:
    A: Acelerar para mantener su velocidad
    B: Poner el vehículo en punto muerto (neutral)
    C: Reducir la velocidad antes de comenzar a bajar
    D: Cambiarse al carril izquierdo
  answer: C
  explanation: La señal de colina le advierte sobre pendientes donde se debe tener
    especial cuidado. Debe reducir la velocidad antes de comenzar a bajar.
- id: 232
  category: signs_and_signals
  question: ¿Qué colores se utilizan para los marcadores de rutas interestatales?
  choices:
    A: Blanco y negro
    B: Rojo, blanco y azul
    C: Verde y blanco
    D: Amarillo y negro
  answer: B
  explanation: Según el manual, los marcadores de las rutas interestatales son de
    color rojo, blanco y azul.
- id: 233
  category: safe_driving_rules
  question: Al acercarse a un cruce de ferrocarril detrás de otro vehículo, ¿cuándo
    es seguro entrar al cruce?
  choices:
    A: Tan pronto como el vehículo de adelante comience a cruzar
    B: Solo cuando el vehículo de adelante se haya movido lo suficiente como para
      que usted pueda despejar completamente las vías
    C: Cuando las luces intermitentes se detengan, incluso si la barrera está bajada
    D: Inmediatamente después de que pase el tren
  answer: B
  explanation: El manual establece que no debe entrar en un cruce de ferrocarril hasta
    que el vehículo de adelante se haya movido lo suficiente como para que usted pueda
    despejar las vías, para evitar quedar atrapado.
- id: 234
  category: signs_and_signals
  question: ¿Qué indica una luz de semáforo amarilla circular fija?
  choices:
    A: La luz verde está terminando y cambiará a rojo
    B: Debe detenerse por completo de inmediato
    C: Usted tiene el derecho de paso para continuar
    D: El semáforo está fuera de servicio
  answer: A
  explanation: Una luz amarilla circular fija significa que la luz verde está terminando
    y cambiará a rojo. Solo debe seguir conduciendo si el vehículo ya se encuentra
    dentro de la intersección.
- id: 235
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite a un conductor girar a la izquierda
    con una luz roja fija?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de un solo sentido
    B: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido
    C: Cuando no hay tráfico en sentido contrario en una calle de doble sentido
    D: Nunca se permiten los giros a la izquierda en rojo
  answer: B
  explanation: Un conductor puede girar a la izquierda en rojo desde una calle de
    un solo sentido hacia otra calle de un solo sentido después de ceder el paso a
    todo el resto del tráfico y a los peatones, siempre que no haya señales que lo
    prohíban.
- id: 236
  category: signs_and_signals
  question: ¿Cómo debe reaccionar un conductor ante una luz amarilla circular intermitente
    en una intersección?
  choices:
    A: Detenerse por completo y esperar a la luz verde
    B: Tratarla como una parada de cuatro vías (four-way stop)
    C: Proceder a través de la intersección con precaución
    D: Ceder el paso a todo el tráfico a la derecha
  answer: C
  explanation: Los conductores que se enfrentan a una luz amarilla circular intermitente
    pueden pasar por la intersección con precaución.
- id: 237
  category: signs_and_signals
  question: ¿Qué significa una señal de control de uso de carril con una X amarilla?
  choices:
    A: El carril está cerrado y no debe usarlo
    B: El tráfico puede usar el carril debajo de la flecha
    C: El carril está a punto de cerrarse o su dirección está a punto de invertirse
    D: Debe detenerse inmediatamente en ese carril
  answer: C
  explanation: Una X amarilla indica que el carril está a punto de cerrarse o que
    su dirección está a punto de invertirse, y debe salir de él tan pronto como pueda.
- id: 238
  category: sharing_the_road
  question: ¿Cuándo tiene el derecho de paso un peatón ciego que utiliza un perro
    guía o un bastón blanco?
  choices:
    A: Solo cuando se encuentra dentro de un cruce de peatones marcado
    B: Solo en intersecciones con señales para peatones
    C: Independientemente de si se encuentra en un cruce de peatones o no
    D: Solo durante las horas del día
  answer: C
  explanation: Una persona ciega que va a pie y utiliza un perro guía, un animal de
    servicio o un bastón blanco tiene el derecho de paso en una carretera, calle o
    camino, independientemente de si se encuentra en un cruce de peatones o no.
- id: 239
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla continua en su lado de la carretera?
  choices:
    A: Puede adelantar si el camino adelante está despejado
    B: NO DEBE ADELANTAR
    C: El carril está designado para viajes compartidos (carpools)
    D: Se encuentra en una calle de un solo sentido
  answer: B
  explanation: Las líneas amarillas continuas separan el tráfico que se mueve en direcciones
    opuestas. Si hay una línea amarilla continua en su lado de la carretera, NO DEBE
    ADELANTAR.
- id: 240
  category: safe_driving_rules
  question: ¿Qué debe hacer si los carriles de tráfico que se mueven en la misma dirección
    están separados por líneas blancas continuas?
  choices:
    A: Cambiar de carril solo si usa una señal de giro
    B: NO CAMBIE DE CARRIL
    C: Adelantar a los vehículos más lentos por la derecha
    D: Incorporarse al carril central
  answer: B
  explanation: Cuando las líneas blancas continuas separan los carriles de tráfico
    que se mueven en la misma dirección, el manual establece NO CAMBIE DE CARRIL.
- id: 241
  category: signs_and_signals
  question: ¿Qué indica una forma de diamante blanco pintada en la calzada?
  choices:
    A: Hay un cruce de ferrocarril más adelante
    B: El carril está reservado solo para giros a la izquierda
    C: El carril está designado para vehículos compartidos (car pools), bicicletas
      o autobuses
    D: Se aproxima un cruce peatonal
  answer: C
  explanation: Las formas de diamante blanco pintadas en la calzada informan a los
    conductores que el carril está designado para vehículos compartidos (car pools),
    bicicletas o autobuses.
- id: 242
  category: signs_and_signals
  question: ¿Cómo se marcan los carriles reversibles en la calzada?
  choices:
    A: Por una línea blanca continua en ambos lados
    B: Por una línea amarilla doble discontinua en ambos lados
    C: Por una sola línea amarilla continua en el centro
    D: Por formas de diamante blanco
  answer: B
  explanation: Los carriles que son reversibles están marcados en ambos lados por
    una línea amarilla doble discontinua. Este es el único caso en el que un conductor
    puede conducir a la izquierda de una línea amarilla.
- id: 243
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en una carretera interestatal en
    West Virginia, a menos que se indique lo contrario?
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 70 mph
  answer: D
  explanation: El límite de velocidad designado para una carretera interestatal es
    una velocidad máxima de 70 mph, a menos que se indique lo contrario.
- id: 244
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    una carretera abierta del condado?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: El límite de velocidad designado para una carretera abierta del condado
    es de 55 mph, a menos que se indique lo contrario.
- id: 245
  category: defensive_driving
  question: 'Independientemente del límite de velocidad indicado, la ley de West Virginia
    prohíbe conducir a una velocidad que sea:'
  choices:
    A: Más lenta que el flujo del tráfico
    B: Mayor de lo razonable y prudente para las condiciones existentes
    C: Menos de 10 mph por debajo del límite
    D: Exactamente el límite de velocidad indicado durante la lluvia
  answer: B
  explanation: La ley de West Virginia prohíbe conducir a una velocidad que sea mayor
    de lo razonable y prudente para las condiciones existentes.
- id: 246
  category: sharing_the_road
  question: ¿Qué debe hacer si debe conducir más lento que la velocidad designada
    en una carretera con un carril en cada dirección?
  choices:
    A: Conducir en el centro de la carretera para evitar que lo adelanten
    B: Salirse de la carretera en el primer apartadero seguro para dejar pasar al
      tráfico que se mueve más rápido
    C: Encender las luces de emergencia y mantener su velocidad
    D: Detenerse inmediatamente en su carril para dejar que los vehículos pasen por
      el lado
  answer: B
  explanation: Si debe conducir más lento que la velocidad designada, debe salirse
    de la carretera en el primer apartadero seguro para dejar pasar al tráfico que
    se mueve más rápido cuando el tráfico que lo adelanta no tiene un carril despejado.
- id: 247
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe señalizar antes de planear girar?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: Debe adquirir el hábito de señalizar cada vez que realice un cambio
    y señalizar al menos 100 pies antes de planear girar.
- id: 248
  category: vehicle_information
  question: ¿Qué indica el brazo de un conductor apuntando directamente hacia afuera
    de la ventana?
  choices:
    A: Disminuir la velocidad o detenerse
    B: Giro a la derecha
    C: Giro a la izquierda
    D: Peligro más adelante
  answer: C
  explanation: Un brazo apuntando directamente hacia afuera indica un giro a la izquierda.
    Un brazo apuntando hacia arriba es un giro a la derecha, y un brazo apuntando
    hacia abajo significa disminuir la velocidad o detenerse.
- id: 249
  category: defensive_driving
  question: ¿Dónde deben colocarse las manos en el volante para obtener el máximo
    control y seguridad?
  choices:
    A: A las 10 y a las 2
    B: A las 9 y a las 3
    C: A las 8 y a las 4
    D: A las 12 y a las 6
  answer: C
  explanation: La mano izquierda debe colocarse aproximadamente a las 8 y la mano
    derecha a las 4 para permitir el máximo control y reducir la posibilidad de que
    una bolsa de aire (airbag) al desplegarse le quite las manos del volante.
- id: 250
  category: safe_driving_rules
  question: ¿Por qué debe mantener las ruedas rectas mientras espera para hacer un
    giro a la izquierda?
  choices:
    A: Ahorra el desgaste de los neumáticos
    B: Evita que un golpe por detrás empuje su vehículo hacia el tráfico que viene
      en sentido contrario
    C: Le permite acelerar más rápido cuando cambia el semáforo
    D: Indica a otros conductores que usted está cediendo el paso
  answer: B
  explanation: Al esperar para girar a la izquierda, no gire las ruedas hacia la izquierda.
    De lo contrario, un golpe por detrás podría empujar su vehículo hacia el tráfico
    que viene en sentido contrario.
- id: 251
  category: safe_driving_rules
  question: ¿Es ilegal dar la vuelta con su vehículo cerca de la cima de una colina
    donde no pueda ser visto por un vehículo que se aproxima a qué distancia?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: Es ilegal dar la vuelta con su vehículo cerca de una curva o de la
    cima de una colina donde no pueda ser visto por otro vehículo que se aproxime
    a menos de 500 pies en cualquier dirección.
- id: 252
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios no se le permite estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: No se permite detenerse, pararse o estacionarse a menos de 15 pies
    de un hidrante de incendios.
- id: 253
  category: safe_driving_rules
  question: ¿A cuántos pies de cualquier señal de alto o señal de control de tráfico
    está prohibido estacionar?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: No se permite detenerse, pararse o estacionarse a menos de 30 pies
    de cualquier señal de alto o señal de control de tráfico.
- id: 254
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar las ruedas delanteras al estacionar cuesta
    arriba en una calle con bordillo?
  choices:
    A: Girar las ruedas hacia la derecha
    B: Girar las ruedas hacia el bordillo
    C: Girar las ruedas en dirección contraria al bordillo
    D: Mantener las ruedas rectas
  answer: C
  explanation: Al estacionar cuesta arriba con bordillo, debe girar las ruedas en
    dirección contraria al bordillo.
- id: 255
  category: safe_driving_rules
  question: Al estacionar cuesta abajo, ¿hacia qué lado debe girar las ruedas?
  choices:
    A: Girar las ruedas hacia el bordillo
    B: Girar las ruedas en dirección contraria al bordillo
    C: Mantener las ruedas perfectamente rectas
    D: Girar las ruedas hacia la izquierda
  answer: A
  explanation: Al estacionar cuesta abajo, debe girar las ruedas hacia el bordillo
    para que el vehículo no ruede hacia el tráfico.
- id: 256
  category: safe_driving_rules
  question: Al estacionar en paralelo, ¿a cuántas pulgadas del bordillo deben estar
    las ruedas?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: Cuando estacione en paralelo, estacione de modo que las ruedas estén
    paralelas y a menos de 18 pulgadas del bordillo.
- id: 257
  category: safe_driving_rules
  question: ¿A cuántos pies del riel más cercano de un cruce de ferrocarril no debe
    estacionar su vehículo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: D
  explanation: No se permite detenerse, pararse o estacionarse a menos de 50 pies
    del riel más cercano de un cruce de ferrocarril.
- id: 258
  category: safe_driving_rules
  question: Al estacionar en paralelo, ¿cuál es la distancia máxima a la que debe
    estar su vehículo del bordillo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: 'El manual establece: "No estacione a más de 18 pulgadas del bordillo".'
- id: 259
  category: defensive_driving
  question: ¿Cuál es la distancia de seguimiento recomendada al conducir en condiciones
    de oscuridad o lluvia?
  choices:
    A: Dos segundos
    B: De tres a cuatro segundos
    C: Al menos cuatro segundos
    D: Al menos seis segundos
  answer: C
  explanation: Según el manual, "Si está oscuro o lloviendo, la distancia debe ser
    de al menos cuatro segundos".
- id: 260
  category: defensive_driving
  question: ¿Cuántos segundos de distancia de seguimiento debe mantener si hay hielo
    o nieve en la carretera?
  choices:
    A: 2 segundos
    B: 3 a 4 segundos
    C: 4 segundos
    D: Al menos 6 segundos
  answer: D
  explanation: 'El manual establece: "Si hay hielo o nieve, manténgase al menos seis
    segundos detrás del vehículo que va delante".'
- id: 261
  category: safe_driving_rules
  question: ¿En cuál de los siguientes lugares está explícitamente prohibido cambiar
    de carril?
  choices:
    A: En una autopista de varios carriles
    B: En una intersección o en un cruce de ferrocarril
    C: En una zona escolar
    D: En una calle de sentido único
  answer: B
  explanation: 'Las reglas adecuadas para cambiar de carril establecen: "NO cambie
    de carril en una intersección o en un cruce de ferrocarril".'
- id: 262
  category: safe_driving_rules
  question: Al rebasar a un vehículo en una carretera de dos carriles, ¿cuándo es
    seguro regresar a su carril correspondiente?
  choices:
    A: Tan pronto como pase el parachoques delantero del otro vehículo
    B: Cuando vea la parte delantera del vehículo (ambos faros delanteros) que ha
      rebasado en su espejo retrovisor
    C: Cuando esté a 50 pies por delante del vehículo rebasado
    D: Cuando el conductor al que está rebasando parpadee sus faros
  answer: B
  explanation: 'El manual indica: "Señalice y regrese al carril correspondiente cuando
    vea la parte delantera del vehículo (ambos faros delanteros) que ha rebasado en
    su espejo retrovisor".'
- id: 263
  category: safe_driving_rules
  question: ¿A cuántos pies de un puente, viaducto, túnel o paso inferior está prohibido
    rebasar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Rebasar está PROHIBIDO "dentro de los 100 pies de un puente, viaducto,
    túnel o paso inferior".
- id: 264
  category: safe_driving_rules
  question: Si llega a una intersección no controlada al mismo tiempo que otro vehículo,
    ¿quién tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que va más rápido
    D: El conductor en la carretera más grande
  answer: B
  explanation: 'Para intersecciones no controladas e intersecciones con parada en
    las cuatro direcciones, el manual establece: "Si llega a la intersección al mismo
    tiempo que otro vehículo, ceda el paso al conductor de la derecha".'
- id: 265
  category: sharing_the_road
  question: ¿Qué debe hacer cuando se aproxima un vehículo de emergencia con la sirena
    encendida y luces de advertencia intermitentes?
  choices:
    A: Acelerar para quitarse de su camino
    B: Detenerse inmediatamente en su carril actual
    C: Orillarse al borde derecho de la carretera, fuera de la intersección, y detenerse
    D: Moverse al carril izquierdo y reducir la velocidad
  answer: C
  explanation: 'El manual establece: "Oríllese al borde derecho de la carretera, fuera
    de la intersección, y deténgase hasta que el vehículo de emergencia haya pasado".'
- id: 266
  category: sharing_the_road
  question: Si un peatón camina por una carretera donde no hay acera, ¿por dónde debe
    caminar?
  choices:
    A: En el lado derecho con el flujo del tráfico
    B: En el lado izquierdo de frente al tráfico que viene en sentido contrario
    C: En el centro de la carretera
    D: No se permiten peatones en carreteras sin aceras
  answer: B
  explanation: 'El manual establece que los peatones deben: "Al caminar por una carretera
    donde no hay acera, caminar por el lado izquierdo de frente al tráfico que viene
    en sentido contrario".'
- id: 267
  category: penalties_and_points
  question: ¿Cuál es la sanción mínima por una primera infracción al rebasar un autobús
    escolar detenido con luces rojas intermitentes?
  choices:
    A: 30 días de suspensión de la licencia y una multa de $250
    B: 60 días de suspensión de la licencia y una multa mínima de $500
    C: 90 días de suspensión de la licencia y una multa de $1,000
    D: 6 meses de suspensión de la licencia y una multa de $500
  answer: B
  explanation: '"La sanción por rebasar un autobús escolar detenido es un mínimo de
    60 días de suspensión de la licencia de conducir y una multa mínima de $500 o
    reclusión en la cárcel por no más de seis (6) meses por la primera infracción".'
- id: 268
  category: sharing_the_road
  question: ¿Bajo qué condición el tráfico que viene hacia un autobús escolar detenido
    NO está obligado a detenerse?
  choices:
    A: Cuando se conduce en una calle de la ciudad de cuatro carriles
    B: Cuando se conduce en un camino privado
    C: Cuando se conduce en una autopista interestatal al otro lado de la mediana
    D: Cuando el autobús escolar está en un estacionamiento
  answer: C
  explanation: '"Solo en las autopistas interestatales el tráfico que viene hacia
    un autobús escolar detenido al otro lado de la mediana no tiene que detenerse".'
- id: 269
  category: defensive_driving
  question: Si al revisar su espejo retrovisor observa que otro vehículo lo sigue
    demasiado de cerca, ¿cuál es un paso que debe tomar?
  choices:
    A: Acelerar para aumentar la distancia
    B: Frenar bruscamente para advertirles
    C: Tocar los frenos suavemente para que parpadeen las luces de freno
    D: Encender las luces de emergencia y detenerse en el carril
  answer: C
  explanation: 'Para lidiar con alguien que lo sigue muy de cerca (tailgater), el
    manual sugiere: "Toque los frenos suavemente para que parpadeen las luces de freno
    y advertir al conductor que lo sigue de cerca".'
- id: 270
  category: safe_driving_rules
  question: Al conducir de noche, ¿a cuántos pies de un vehículo que se aproxima debe
    bajar las luces delanteras?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: 'El manual establece: "Baje sus luces delanteras a menos de 500 pies
    de un vehículo que se aproxima".'
- id: 271
  category: vehicle_information
  question: ¿Qué luces debe utilizar al conducir con niebla?
  choices:
    A: Luces altas (luces de carretera)
    B: Luces bajas (luces de cruce)
    C: Luces de estacionamiento
    D: Luces de emergencia
  answer: B
  explanation: El manual aconseja "usar las luces bajas al conducir con niebla. Las
    luces altas hacen que la luz se refleje de vuelta a sus ojos".
- id: 272
  category: defensive_driving
  question: ¿Cómo puede evitar el deslumbramiento de los faros de los vehículos que
    se aproximan por la noche?
  choices:
    A: Mirar directamente a los faros que se aproximan
    B: Mirar hacia el borde izquierdo de la carretera
    C: Mirar hacia el borde derecho de la carretera
    D: Encender las luces altas
  answer: C
  explanation: El manual indica "evitar mirar directamente a las luces de los vehículos
    que vienen en sentido contrario mirando hacia el borde derecho de la carretera".
- id: 273
  category: safe_driving_rules
  question: ¿Cuándo es obligatorio encender los faros delanteros?
  choices:
    A: Solo al conducir por autopistas interestatales
    B: Cuando la visibilidad es inferior a 1,000 pies
    C: Desde la puesta del sol hasta el amanecer, con niebla, lluvia o cuando la visibilidad
      sea inferior a 500 pies
    D: Solo entre las 8 PM y las 6 AM
  answer: C
  explanation: El manual indica encender los faros desde la puesta del sol hasta el
    amanecer, durante la niebla, el humo, la lluvia o en cualquier otro momento en
    que no se pueda ver claramente a personas y vehículos a una distancia de 500 pies.
- id: 274
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima de seguimiento segura recomendada al conducir
    detrás de una motocicleta?
  choices:
    A: De uno a dos segundos
    B: De tres a cuatro segundos
    C: De cinco a seis segundos
    D: De siete a ocho segundos
  answer: B
  explanation: Según el manual, es prudente mantener una distancia mínima de seguimiento
    segura de tres a cuatro segundos cuando se circula detrás de una motocicleta,
    y aumentar este tiempo por la noche o en condiciones climáticas adversas.
- id: 275
  category: sharing_the_road
  question: 'Al adelantar a una motocicleta, el conductor debe:'
  choices:
    A: Compartir el carril con la motocicleta para ahorrar espacio
    B: Tocar la bocina continuamente para advertir al motociclista
    C: Cambiarse completamente al otro carril
    D: Pasar lo más cerca posible de la motocicleta
  answer: C
  explanation: El manual indica que al adelantar a una motocicleta, debe cambiarse
    completamente al otro carril porque el motociclista tiene el derecho legal a un
    carril completo y puede necesitar desviarse para evitar peligros.
- id: 276
  category: signs_and_signals
  question: ¿Qué tipo de señal deben mostrar los vehículos de movimiento lento, como
    los equipos agrícolas o de construcción?
  choices:
    A: Una señal naranja cuadrada
    B: Una señal amarilla circular
    C: Una señal de emblema triangular especial
    D: Una señal reflectante en forma de diamante
  answer: C
  explanation: Los vehículos de movimiento lento deben mostrar una señal de emblema
    triangular especial que significa "Vehículo de movimiento lento" para advertir
    a los conductores que se aproximan.
- id: 277
  category: sharing_the_road
  question: En comparación con un vehículo estándar, ¿cuánta distancia necesita para
    detenerse un camión con remolque (tractor-trailer) totalmente cargado que viaja
    a 55 mph?
  choices:
    A: El doble de la distancia
    B: El triple de la distancia
    C: Cuatro veces la distancia
    D: Cinco veces la distancia
  answer: B
  explanation: El manual establece que un camión con remolque totalmente cargado,
    que viaja a 55 mph, necesita tres (3) veces la distancia que necesita un vehículo
    para detenerse.
- id: 278
  category: defensive_driving
  question: ¿Cómo puede determinar fácilmente si está conduciendo en el punto ciego
    de un camión pesado (la "Zona Prohibida" o "No-Zone")?
  choices:
    A: Está a menos de 50 pies del parachoques trasero del camión
    B: No puede ver el reflejo del conductor del camión en su espejo lateral
    C: Las luces traseras del camión no son visibles para usted
    D: Está conduciendo por el lado izquierdo del camión
  answer: B
  explanation: La forma más fácil de evitar permanecer en la "Zona Prohibida" (No-Zone)
    es buscar el reflejo del conductor del camión en el espejo lateral. Si no puede
    ver el reflejo del conductor, usted se encuentra en el punto ciego del conductor
    del camión.
- id: 279
  category: safe_driving_rules
  question: Después de adelantar a un camión pesado en condiciones de humedad, ¿cuánto
    espacio debe dejar antes de volver a incorporarse a la derecha?
  choices:
    A: De uno a dos segundos
    B: Dos segundos
    C: Tres segundos
    D: Al menos de cuatro a seis segundos
  answer: D
  explanation: La sección de reglas de seguridad para camiones establece que, en condiciones
    de humedad, debe dejar al menos de cuatro (4) a seis (6) segundos de espacio después
    de adelantar a un camión.
- id: 280
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una regla relativa a los jinetes de animales
    en las vías públicas?
  choices:
    A: Se les permite circular por autopistas interestatales
    B: Debe tocar la bocina para avisarles que está pasando
    C: Tienen los mismos derechos que los usuarios de vehículos motorizados y están
      sujetos a las mismas reglas
    D: Deben cabalgar de frente al tráfico que se aproxima
  answer: C
  explanation: El manual señala que las personas que montan animales tienen los mismos
    derechos que los usuarios de vehículos motorizados y están sujetos a las mismas
    reglas. También establece explícitamente que no pueden usar las autopistas interestatales
    y que los conductores nunca deben tocar la bocina cerca de un caballo.
- id: 281
  category: sharing_the_road
  question: 'Al encontrarse con un ciclista que viene en sentido contrario por la
    noche, usted debe:'
  choices:
    A: Hacer cambio de luces (luces altas)
    B: Bajar siempre las luces
    C: Tocar la bocina
    D: Hacerse a un lado y detenerse
  answer: B
  explanation: 'El manual establece explícitamente: ''Al encontrarse con un ciclista
    que viene en sentido contrario por la noche, baje siempre las luces''.'
- id: 282
  category: sharing_the_road
  question: 'Los ciclistas deben seguir todas las siguientes reglas EXCEPTO:'
  choices:
    A: Circular en la misma dirección que los demás vehículos
    B: Ceder el paso a los peatones
    C: Circular de frente al tráfico que viene en sentido contrario
    D: Señalizar los giros a menos que se necesiten ambas manos para mantener el equilibrio
  answer: C
  explanation: Los ciclistas deben circular en la misma dirección que los demás vehículos,
    no de frente al tráfico que viene en sentido contrario. También deben ceder el
    paso a los peatones y señalizar los giros.
- id: 283
  category: vehicle_information
  question: ¿Cuál de los siguientes dispositivos de señalización acústica NO está
    permitido en una bicicleta?
  choices:
    A: Un timbre
    B: Una sirena o silbato
    C: Un dispositivo audible a 100 pies
    D: Una bocina de bicicleta estándar
  answer: B
  explanation: Las bicicletas deben tener un timbre u otro dispositivo capaz de emitir
    una señal audible a una distancia de al menos 100 pies, pero el manual especifica
    que 'no se permite ninguna sirena o silbato'.
- id: 284
  category: vehicle_information
  question: 'Para circular después de que oscurezca, una bicicleta debe estar equipada
    con una luz delantera blanca que sea visible desde al menos:'
  choices:
    A: 100 pies hacia adelante
    B: 200 pies hacia adelante
    C: 300 pies hacia adelante
    D: 500 pies hacia adelante
  answer: D
  explanation: El manual exige que, para circular después de que oscurezca, una bicicleta
    debe tener una luz delantera blanca que sea visible desde al menos 500 pies hacia
    adelante.
- id: 285
  category: sharing_the_road
  question: 'Al compartir la carretera con un autobús público, los conductores deben:'
  choices:
    A: Detenerse por completo siempre que el autobús se detenga
    B: Rebasar el autobús por el lado derecho
    C: Estar atentos a los pasajeros que cruzan la calle al subir y bajar
    D: Tocar la bocina antes de rebasar el autobús
  answer: C
  explanation: Aunque el tráfico no tiene que detenerse ante un autobús público, el
    manual aconseja a los conductores estar atentos a los pasajeros que cruzan la
    calle mientras suben y bajan del autobús.
- id: 286
  category: license_system
  question: ¿Cómo obtiene una persona un cartel (placard) o placa de matrícula de
    estacionamiento para personas con movilidad reducida?
  choices:
    A: Pagando una tarifa de $50 en la estación de policía local
    B: Haciendo que un médico certifique su condición en un formulario proporcionado
      por el DMV
    C: Mostrando una licencia de conducir válida a un asistente de estacionamiento
    D: Solicitándolo en línea sin certificación médica
  answer: B
  explanation: Para obtener un cartel o placa de matrícula de estacionamiento para
    personas con movilidad reducida, un médico debe certificar su condición en un
    formulario proporcionado por el DMV.
- id: 287
  category: vehicle_information
  question: ¿Cuándo es apropiado usar las luces de estacionamiento de su vehículo?
  choices:
    A: Al conducir con niebla densa
    B: Solo cuando está estacionado
    C: Entre la puesta del sol y el amanecer
    D: Al acercarse a una intersección
  answer: B
  explanation: 'El manual establece explícitamente: ''Use sus luces de estacionamiento
    solo cuando esté estacionado''.'
- id: 288
  category: driver_responsibility
  question: ¿Con cuánta antelación debe ponerse en contacto con el DMV si necesita
    una ayuda o servicio auxiliar para una comunicación eficaz?
  choices:
    A: A más tardar 12 horas antes de la llegada
    B: A más tardar 24 horas antes de la llegada
    C: A más tardar 48 horas antes de la llegada
    D: A más tardar 72 horas antes de la llegada
  answer: C
  explanation: Según el manual, cualquier persona que requiera una ayuda o servicio
    auxiliar debe ponerse en contacto con el DMV a más tardar 48 horas antes de la
    llegada programada.
- id: 289
  category: signs_and_signals
  question: ¿En qué dirección corren las autopistas interestatales con números pares?
  choices:
    A: De norte a sur
    B: De este a oeste
    C: Diagonalmente a través de las fronteras estatales
    D: En una vía de circunvalación alrededor de las ciudades
  answer: B
  explanation: El manual establece que las interestatales con números pares corren
    de este a oeste, mientras que las interestatales con números impares corren de
    norte a sur.
- id: 290
  category: signs_and_signals
  question: ¿Qué identifica un número de interestatal de tres dígitos que comienza
    con un número impar?
  choices:
    A: Una vía de circunvalación o desvío alrededor de una ciudad
    B: Una ruta que corre de este a oeste
    C: Una ruta de acceso (spur route)
    D: Una ruta que corre de norte a sur
  answer: C
  explanation: Los números de tres dígitos con un primer número impar identifican
    rutas de acceso (spur routes), mientras que los números de tres dígitos con un
    primer número par identifican vías de circunvalación o desvíos.
- id: 291
  category: safe_driving_rules
  question: ¿Qué carril debe utilizar el tráfico más lento en una autopista interestatal?
  choices:
    A: El carril de la izquierda
    B: El carril central
    C: El carril de la derecha
    D: El carril de deceleración
  answer: C
  explanation: El manual especifica que el tráfico más lento debe circular por el
    carril de la derecha, excepto al adelantar.
- id: 292
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso cuando un vehículo entra en una interestatal
    desde un carril de aceleración?
  choices:
    A: El vehículo que entra en la interestatal
    B: El tráfico que ya circula por la interestatal
    C: El vehículo que circula a la velocidad más alta
    D: Solo los camiones comerciales y autobuses
  answer: B
  explanation: Al entrar en una interestatal, debe recordar que el tráfico que ya
    circula por la interestatal tiene el derecho de paso.
- id: 293
  category: defensive_driving
  question: ¿Qué debe hacer si no hay un espacio disponible en el tráfico cuando llega
    al final de un carril de aceleración de la interestatal?
  choices:
    A: Forzar su entrada en el carril más cercano
    B: Detenerse inmediatamente en el carril de aceleración
    C: Conducir hacia el arcén más allá del final del carril de aceleración y detenerse
    D: Tocar la bocina hasta que un vehículo le ceda el paso
  answer: C
  explanation: Si no hay un espacio disponible en el tráfico, puede ser necesario
    conducir hacia el arcén más allá del final del carril de aceleración y detenerse
    como último recurso.
- id: 294
  category: safe_driving_rules
  question: ¿Cuál es el lugar adecuado para reducir la velocidad al salir de una interestatal?
  choices:
    A: En el carril de paso de la derecha
    B: En la zona de bifurcación (exit gore)
    C: En el carril de deceleración
    D: Solo en la rampa de salida
  answer: C
  explanation: Nunca debe reducir la velocidad en la propia interestatal. Espere hasta
    estar en el carril de deceleración y luego frene suavemente.
- id: 295
  category: signs_and_signals
  question: ¿Qué es una zona de bifurcación (exit gore) en una interestatal?
  choices:
    A: El carril utilizado para acelerar antes de incorporarse
    B: El área triangular entre el carril de paso y la rampa de salida
    C: El área del arcén designada para vehículos averiados
    D: Un carril especial para vehículos comerciales
  answer: B
  explanation: La zona de bifurcación (exit gore) se define como el área triangular
    entre el carril de paso y la rampa de salida. Nunca debe detenerse en esta área.
- id: 296
  category: safe_driving_rules
  question: Bajo condiciones normales de clima y carretera, ¿cuál es la velocidad
    mínima a la que debe conducir en una interestatal de West Virginia?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: C
  explanation: No debe conducir a menos de 55 mph en una interestatal a menos que
    las condiciones climáticas o de la carretera sean malas o se haya señalizado una
    velocidad inferior.
- id: 297
  category: safe_driving_rules
  question: Si su vehículo queda averiado en la interestatal, ¿dónde debe colocar
    las bengalas de emergencia?
  choices:
    A: Una a 100 pies por detrás y otra a 200 pies por detrás
    B: Una a la longitud de un vehículo por detrás y otra a 300 pies hacia atrás
    C: Una a la longitud de un vehículo por delante y otra a 100 pies hacia atrás
    D: Solo directamente detrás del parachoques trasero
  answer: B
  explanation: El manual indica a los conductores que coloquen una bengala aproximadamente
    a la longitud de un vehículo detrás del vehículo averiado y otra a unos 300 pies
    hacia atrás en el arcén.
- id: 298
  category: defensive_driving
  question: ¿Qué debe hacer si se ve involucrado en un choque con niebla densa en
    la interestatal?
  choices:
    A: Dejar su vehículo exactamente donde está y esperar a la policía
    B: Intentar sacar su vehículo de la carretera lo más lejos posible
    C: Permanecer en la carretera para hacer señas a otros conductores
    D: Apagar todas las luces para conservar la batería
  answer: B
  explanation: Si se ve involucrado en un choque con niebla densa, intente sacar su
    vehículo de la carretera lo más lejos posible. Dejarlo en la carretera propicia
    más choques.
- id: 299
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado si se pasa de su salida y necesita
    dar la vuelta en una interestatal?
  choices:
    A: Hacer un giro en U usando el paso de la mediana
    B: Retroceder con cuidado por el arcén derecho
    C: Ir a la siguiente salida para dar la vuelta
    D: Detenerse en la zona de bifurcación (exit gore) y esperar a que el tráfico
      se despeje
  answer: C
  explanation: Nunca debe hacer un giro en U en una interestatal. Debe ir a la siguiente
    salida para dar la vuelta antes de volver a entrar en la interestatal.
- id: 300
  category: signs_and_signals
  question: ¿Cómo se indica habitualmente la eliminación de un carril en una interestatal?
  choices:
    A: Mediante una señal de diamante roja y blanca
    B: Mediante un panel negro y amarillo debajo de una señal de guía elevada verde
      y blanca
    C: Mediante una luz amarilla intermitente en el arcén
    D: Mediante una línea blanca doble continua
  answer: B
  explanation: Donde se elimina un carril, el cambio suele indicarse mediante un panel
    negro y amarillo debajo de la señal de guía elevada verde y blanca.
- id: 301
  category: sharing_the_road
  question: Al entrar en una autopista interestatal, ¿por qué debe cooperar y dar
    a los camiones y autobuses tiempo y espacio adicional?
  choices:
    A: Siempre tienen el derecho de paso sobre los vehículos de pasajeros
    B: Pueden necesitar tiempo adicional para ajustarse a los patrones de tráfico
    C: Se les requiere conducir en el carril izquierdo
    D: No se les permite usar carriles de aceleración
  answer: B
  explanation: El manual establece que los camiones y autobuses que entran en la interestatal
    pueden necesitar tiempo adicional para ajustarse a los patrones de tráfico, por
    lo que usted debe cooperar y darles tiempo y espacio adicional.
- id: 302
  category: license_system
  question: ¿Qué debe hacer si tiene una discapacidad física o un problema médico
    que pueda interferir con su capacidad de conducción al solicitar una licencia?
  choices:
    A: Pagar un recargo al DMV por pruebas especiales
    B: Preparar una carta explicando la situación para adjuntarla a su solicitud
    C: Solicitar una licencia de conducir comercial en su lugar
    D: Llevar a un médico a su examen de conducir
  answer: B
  explanation: Si tiene una discapacidad física o un problema médico que pueda interferir
    con su capacidad de conducción, debe preparar una carta explicando la situación
    para adjuntarla a su solicitud.
- id: 303
  category: safe_driving_rules
  question: ¿A quién se le permite usar los cruces de grava o pavimentados en las
    medianas de las autopistas?
  choices:
    A: Cualquier conductor que haya pasado su salida.
    B: Conductores de vehículos comerciales.
    C: Solo vehículos de la policía y de emergencia.
    D: Conductores que experimenten una avería mecánica.
  answer: C
  explanation: 'El manual establece: "Los cruces de grava o pavimentados en las medianas
    de algunas autopistas deben ser utilizados únicamente por vehículos de la policía
    y de emergencia".'
- id: 304
  category: sharing_the_road
  question: 'Al conducir en una zona de construcción donde un carril está cerrado,
    usted debe:'
  choices:
    A: Esperar hasta el último minuto para cambiar de carril.
    B: Cambiarse al carril abierto lo antes posible.
    C: Acelerar para pasar rápidamente el equipo de construcción.
    D: Conducir por el arcén (hombro) para evitar el carril cerrado.
  answer: B
  explanation: 'El manual aconseja: "Si un carril está cerrado, se colocarán señales
    con suficiente antelación. Debe cambiarse al carril abierto lo antes posible.
    Evite esperar hasta el último minuto para cambiar de carril".'
- id: 305
  category: defensive_driving
  question: Según el manual, ¿cuál de los siguientes se considera un hábito de conducción
    perezoso?
  choices:
    A: Mirar solo por el espejo retrovisor en lugar de girar la cabeza para mirar
      detrás de usted.
    B: Detenerse por completo en un semáforo en rojo antes de girar a la derecha.
    C: Mantener un agarre firme en el volante.
    D: Atenuar las luces delanteras a menos de 500 pies de un vehículo que viene en
      sentido contrario.
  answer: A
  explanation: 'El manual describe la pereza como no girar la cabeza y mirar detrás
    de usted para ver el tráfico, advirtiendo a los conductores: "No se vuelva perezoso
    y mire solo por el espejo retrovisor".'
- id: 306
  category: driver_responsibility
  question: 'Un conductor impaciente a menudo se siente tentado a:'
  choices:
    A: Conducir por debajo del límite de velocidad.
    B: Solo disminuir la velocidad ante una señal de pare en lugar de detenerse por
      completo.
    C: Ceder el derecho de paso a todos los peatones.
    D: Dejar su vehículo en una calzada inundada.
  answer: B
  explanation: El manual establece que debido a la presión de los vehículos que le
    siguen y la ausencia de tráfico transversal, un conductor impaciente "puede verse
    tentado a solo disminuir la velocidad ante una señal de pare" en lugar de detenerse
    por completo.
- id: 307
  category: defensive_driving
  question: ¿Cómo distingue el manual a un conductor arrogante o agresivo de un conductor
    impaciente?
  choices:
    A: Un conductor arrogante simplemente tiene prisa, mientras que un conductor impaciente
      tiene prisa a propósito.
    B: Un conductor arrogante tiene prisa a propósito y compite con su vehículo como
      una extensión de su ego.
    C: Un conductor arrogante siempre cede el paso a los peatones.
    D: Un conductor arrogante solo conduce rápido en zonas de construcción.
  answer: B
  explanation: 'El manual establece: "Mientras que el conductor impaciente simplemente
    tiene prisa, el conductor arrogante o agresivo tiene prisa a propósito... usted
    compite con su vehículo porque es una extensión de su ego".'
- id: 308
  category: safe_driving_rules
  question: ¿Qué significa el término 'conducir más allá del alcance de sus luces'
    (over driving your headlights)?
  choices:
    A: Dejar las luces altas encendidas al seguir a otro vehículo.
    B: Conducir demasiado rápido para detenerse de manera segura dentro de la distancia
      iluminada claramente por sus luces delanteras.
    C: Usar sus luces delanteras durante el día.
    D: Conducir con las luces de estacionamiento encendidas en lugar de las luces
      delanteras.
  answer: B
  explanation: Según el manual, "Conducir más allá del alcance de sus luces significa
    conducir demasiado rápido para detenerse de manera segura dentro de la distancia
    iluminada claramente por sus luces delanteras".
- id: 309
  category: defensive_driving
  question: ¿Hacia dónde debe mirar si queda momentáneamente cegado por las luces
    delanteras de un vehículo que viene en sentido contrario por la noche?
  choices:
    A: Directamente a las luces delanteras que se aproximan.
    B: A la línea central de la carretera.
    C: Bastante delante de su vehículo, hacia el borde derecho de la carretera.
    D: A su espejo retrovisor.
  answer: C
  explanation: 'El manual instruye: "Al encontrarse con un vehículo que viene en sentido
    contrario por la noche, disminuya la velocidad, manténgase a la derecha de su
    carril de tráfico y mire bastante delante de su vehículo hacia el borde derecho
    de la carretera".'
- id: 310
  category: safe_driving_rules
  question: 'Al seguir a otro vehículo por la noche, debe atenuar sus luces delanteras
    a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: 'El manual establece: "Al seguir a otro vehículo, atenúe sus luces
    delanteras a menos de 200 pies del otro vehículo".'
- id: 311
  category: safe_driving_rules
  question: ¿Por qué el pavimento mojado es particularmente peligroso al comienzo
    de una lluvia ligera?
  choices:
    A: La lluvia borra las marcas de carril pintadas.
    B: Una mezcla de aceite, suciedad y agua forma una película resbaladiza en la
      carretera.
    C: El agua causa inmediatamente un hidroplaneo total a cualquier velocidad.
    D: Hace que sus faros se reflejen de vuelta a sus ojos.
  answer: B
  explanation: El manual explica que el pavimento mojado es peligroso "particularmente
    al comienzo de una lluvia ligera cuando una mezcla de aceite, suciedad y agua
    forma una película resbaladiza en la carretera".
- id: 312
  category: safe_driving_rules
  question: ¿A qué velocidad pierden los neumáticos de un vehículo de pasajeros estándar
    todo contacto con la carretera durante una tormenta de lluvia intensa?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: D
  explanation: 'El manual establece: "En una tormenta de lluvia intensa, los neumáticos
    pierden todo contacto con la carretera a 55 mph".'
- id: 313
  category: safe_driving_rules
  question: ¿Cuánta agua en una carretera inundada se necesita para que algunos vehículos
    más pequeños floten?
  choices:
    A: Dos pulgadas
    B: Seis pulgadas
    C: Un pie
    D: Dos pies
  answer: B
  explanation: 'El manual advierte: "Tan solo seis (6) pulgadas de agua pueden hacer
    flotar algunos vehículos más pequeños, mientras que dos (2) pies de agua se llevarán
    a la mayoría".'
- id: 314
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo se apaga en una carretera inundada?
  choices:
    A: Permanecer dentro del vehículo y esperar a los servicios de emergencia.
    B: Subir las ventanillas para evitar que entre agua.
    C: Salir del vehículo inmediatamente y buscar un terreno más alto.
    D: Intentar arrancar el motor de nuevo y salir del agua en reversa.
  answer: C
  explanation: 'El manual aconseja: "Si su vehículo se apaga en una carretera inundada,
    abandónelo inmediatamente y busque un terreno más alto. Recuerde que es mejor
    estar mojado que muerto".'
- id: 315
  category: safe_driving_rules
  question: En comparación con el pavimento seco, ¿cuánta distancia se necesita para
    detener su vehículo sobre nieve o hielo?
  choices:
    A: 2 veces la distancia normal
    B: 4 veces la distancia normal
    C: 8 veces la distancia normal
    D: Hasta 12 veces la distancia normal
  answer: D
  explanation: 'El manual establece: "Se necesita hasta 12 veces la distancia normal
    para detenerse sobre nieve o hielo de lo que se necesita para detenerse sobre
    pavimento seco".'
- id: 316
  category: vehicle_information
  question: Si su vehículo NO está equipado con frenos antibloqueo (ABS), ¿cómo debe
    detenerse sobre hielo o nieve compacta?
  choices:
    A: Pisar los frenos a fondo y sujetar el volante con firmeza.
    B: Bombear los frenos presionándolos y soltándolos varias veces.
    C: Poner el vehículo en punto muerto (neutral) y dejar que se detenga por inercia.
    D: Aplicar el freno de emergencia inmediatamente.
  answer: B
  explanation: En un vehículo sin frenos antibloqueo, no puede maniobrar a menos que
    bombee los frenos, presionándolos y soltándolos varias veces hasta que tenga el
    vehículo bajo control total.
- id: 317
  category: safe_driving_rules
  question: ¿Qué faros debe usar al conducir con niebla o humo denso?
  choices:
    A: Faros de luz alta
    B: Faros de luz baja
    C: Solo luces de estacionamiento
    D: Solo luces de circulación diurna
  answer: B
  explanation: Si debe conducir en condiciones de niebla o humo denso, debe usar sus
    faros de luz baja.
- id: 318
  category: vehicle_information
  question: ¿Con qué frecuencia requiere Virginia Occidental una inspección estatal
    de todos los vehículos para garantizar que estén en condiciones seguras de conducción?
  choices:
    A: Cada 6 meses
    B: Anualmente
    C: Cada 2 años
    D: Cada 5 años
  answer: B
  explanation: Virginia Occidental requiere una inspección anual de todos los vehículos
    para garantizar que estén en condiciones seguras de conducción.
- id: 319
  category: driver_responsibility
  question: Para prevenir la fatiga en un viaje largo, ¿con qué frecuencia debe tomar
    un descanso de 10 minutos?
  choices:
    A: Al menos cada hora
    B: Al menos cada dos horas
    C: Al menos cada cuatro horas
    D: Solo cuando necesite cargar combustible
  answer: B
  explanation: Si se encuentra en un viaje largo, el manual recomienda tomar un descanso
    de 10 minutos al menos cada dos (2) horas.
- id: 320
  category: safe_driving_rules
  question: ¿Durante qué horas suele ser más pesado el tráfico de entrada a las áreas
    metropolitanas en las horas pico?
  choices:
    A: Entre las 5 am y las 7 am
    B: Entre las 7 am y las 9 am
    C: Entre las 11 am y la 1 pm
    D: Entre las 4 pm y las 6 pm
  answer: B
  explanation: El tráfico en las horas pico suele ser de entrada a las áreas metropolitanas
    entre las 7 am y las 9 am, y de salida de estas áreas entre las 4 pm y las 6 pm.
- id: 321
  category: defensive_driving
  question: ¿Qué debe hacer para evitar un choque cuando otro vehículo lo está rebasando?
  choices:
    A: Acelerar para evitar que lo rebasen.
    B: Moverse al lado izquierdo de su carril.
    C: Reducir la velocidad y mantenerse lo más cerca posible del lado derecho de
      la carretera.
    D: Encender y apagar las luces altas para advertirles.
  answer: C
  explanation: Para evitar la posibilidad de un choque con un vehículo que lo está
    rebasando, revise su espejo retrovisor con frecuencia, esté al tanto de lo que
    sucede a su alrededor, reduzca la velocidad y manténgase lo más cerca posible
    del lado derecho de la carretera.
- id: 322
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿cuándo es seguro volver al carril derecho?
  choices:
    A: Tan pronto como su vehículo esté delante del otro vehículo.
    B: Cuando vea los faros delanteros del vehículo que rebasó en su espejo retrovisor.
    C: Cuando el conductor al que está rebasando le haga señales con las luces.
    D: Después de haber avanzado al menos 100 pies más allá del vehículo.
  answer: B
  explanation: El paso 9 de los 10 pasos para rebasar a otro vehículo de manera segura
    es incorporarse a la derecha cuando vea los faros delanteros del vehículo que
    rebasó en su espejo retrovisor.
- id: 323
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a su velocidad
    al rebasar a otro vehículo?
  choices:
    A: Puede exceder el límite de velocidad por 5 mph para rebasar de manera segura.
    B: Puede exceder el límite de velocidad por 10 mph en las autopistas interestatales.
    C: Exceder el límite de velocidad al rebasar es ilegal.
    D: Los límites de velocidad no se aplican mientras se rebasa activamente a un
      vehículo más lento.
  answer: C
  explanation: El manual establece explícitamente que exceder el límite de velocidad
    al rebasar es ilegal. Si tiene que exceder la velocidad para rebasar, probablemente
    no necesite rebasar.
- id: 324
  category: driver_responsibility
  question: Según la ley de West Virginia, ¿quién es responsable de asegurar que todos
    los pasajeros tengan abrochados sus cinturones de seguridad?
  choices:
    A: Los propios pasajeros
    B: El conductor del vehículo
    C: El dueño del vehículo
    D: El pasajero del asiento delantero
  answer: B
  explanation: Es responsabilidad del conductor asegurarse de que todos los pasajeros
    tengan abrochados sus cinturones de seguridad.
- id: 325
  category: safe_driving_rules
  question: ¿Cuál de las únicas excepciones legales por edad para el uso del cinturón
    de seguridad en un vehículo de pasajeros en West Virginia (excluyendo razones
    médicas)?
  choices:
    A: Personas de 16 años o más que viajen en el asiento delantero.
    B: Personas de 18 años o más que viajen en el asiento trasero.
    C: Personas de 21 años o más que viajen en cualquier parte del vehículo.
    D: No existen excepciones de edad para el uso del cinturón de seguridad.
  answer: B
  explanation: La única excepción legal a la ley del cinturón de seguridad es para
    las personas de 18 años o más que viajen en el asiento trasero de un vehículo.
- id: 326
  category: driver_responsibility
  question: Las estadísticas muestran que el uso del cinturón de seguridad reduce
    las probabilidades de lesiones o muerte resultantes de colisiones en ¿qué porcentaje?
  choices:
    A: Del 10 al 20 por ciento
    B: Del 25 al 30 por ciento
    C: Del 45 al 50 por ciento
    D: Del 75 al 80 por ciento
  answer: C
  explanation: Las estadísticas muestran que el uso del cinturón de seguridad reduce
    las probabilidades de lesiones o muerte resultantes de colisiones entre un 45
    y un 50 por ciento.
- id: 327
  category: safe_driving_rules
  question: La ley de West Virginia exige que un niño esté debidamente asegurado en
    un sistema de dispositivo de seguridad para niños pasajeros si es menor de ¿qué
    edad?
  choices:
    A: 4 años
    B: 6 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: La ley de West Virginia establece que todo conductor que transporte
    a un niño menor de 8 años debe velar por la protección del niño colocándolo adecuadamente
    en un sistema de dispositivo de seguridad para niños pasajeros.
- id: 328
  category: defensive_driving
  question: Si la niebla o el humo dificultan gravemente su visión al conducir, ¿cuál
    es la acción más segura?
  choices:
    A: Encender las luces altas y continuar a una velocidad lenta.
    B: Salirse a un lado de la carretera, detenerse y encender las luces de emergencia.
    C: Seguir de cerca las luces traseras del vehículo que va delante.
    D: Conducir por el centro de la carretera para evitar las cunetas.
  answer: B
  explanation: Si la niebla o el humo dificultan su visión, debe salirse a un lado
    de la carretera y detenerse, dejar las luces encendidas y también encender las
    luces de emergencia (hazard lights).
- id: 329
  category: vehicle_information
  question: ¿Cómo se debe usar el cinturón de seguridad de regazo para obtener la
    máxima protección?
  choices:
    A: Holgado a través del estómago.
    B: Ajustado y cómodo sobre la parte inferior de las caderas.
    C: En la parte alta del abdomen.
    D: Metido debajo del brazo.
  answer: B
  explanation: El cinturón de regazo debe usarse de modo que quede ajustado y cómodo
    sobre la parte inferior de las caderas. Esto permitirá la flexión normal del cuerpo.
- id: 330
  category: safe_driving_rules
  question: Según la ley de West Virginia, un niño menor de 8 años puede usar un cinturón
    de seguridad estándar en lugar de un dispositivo de seguridad para niños pasajeros
    si cumple ¿con qué requisito?
  choices:
    A: Pesa más de 60 libras.
    B: Mide al menos 4 pies y 9 pulgadas de altura.
    C: Viaja en el asiento trasero.
    D: Está acompañado por un padre o tutor.
  answer: B
  explanation: El manual establece que si un niño es menor de 8 años y mide al menos
    4'-9" de altura, un cinturón de seguridad será suficiente para cumplir con los
    requisitos de la ley de asientos de seguridad para niños.
- id: 331
  category: vehicle_information
  question: ¿Cómo deben colocarse correctamente los reposacabezas ajustables en un
    vehículo?
  choices:
    A: Para que queden contra la parte posterior del cuello.
    B: Para que queden contra la parte posterior de la cabeza.
    C: Al menos tres pulgadas por encima de la cabeza.
    D: Inclinados hacia adelante para sostener la barbilla.
  answer: B
  explanation: Según el manual, si los reposacabezas son ajustables, deben colocarse
    de modo que queden contra la parte posterior de la cabeza, no del cuello, para
    reducir la posibilidad de sufrir un latigazo cervical.
- id: 332
  category: vehicle_information
  question: ¿Cuál es la forma correcta de frenar en una emergencia cuando se conduce
    un vehículo equipado con un Sistema de Frenos Antibloqueo (ABS)?
  choices:
    A: Bombear los frenos rápidamente para evitar que las ruedas se bloqueen.
    B: Presionar con fuerza el freno y continuar maniobrando el volante.
    C: Tocar ligeramente los frenos mientras se cambia a una marcha más baja.
    D: Aplicar el freno de mano mientras se mantiene el volante recto.
  answer: B
  explanation: El manual indica que al aplicar el freno en un vehículo con ABS, el
    conductor debe continuar maniobrando el vehículo mientras presiona con fuerza
    el freno. Bombear los frenos ABS reducirá la capacidad del sistema para detenerse
    de forma segura.
- id: 333
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la distancia
    de frenado de un vehículo equipado con un Sistema de Frenos Antibloqueo (ABS)?
  choices:
    A: El ABS detendrá un vehículo en la mitad de la distancia que los frenos normales.
    B: El ABS mejora el rendimiento de frenado en un 10 por ciento en el mejor de
      los casos.
    C: El ABS permite que un vehículo se detenga en seco bajo cualquier circunstancia.
    D: El ABS aumenta la distancia de frenado en un 20 por ciento.
  answer: B
  explanation: El manual señala que es un error común pensar que el ABS detendrá un
    vehículo en una distancia mucho más corta. En una parada repentina, el ABS mejorará
    el rendimiento solo en un 10 por ciento en el mejor de los casos.
- id: 334
  category: safe_driving_rules
  question: Para minimizar el riesgo de lesiones por el despliegue de una bolsa de
    aire (airbag), ¿cuál es la posición más segura para las manos en el volante?
  choices:
    A: Mano derecha a las 2 en punto y mano izquierda a las 10 en punto.
    B: Mano derecha a las 3 en punto y mano izquierda a las 9 en punto.
    C: Mano derecha a las 4 en punto y mano izquierda a las 8 en punto.
    D: Ambas manos apoyadas en la posición de las 6 en punto.
  answer: C
  explanation: El manual establece que el conductor debe sujetar el volante por los
    lados para que las manos y los brazos no queden entre la bolsa de aire y su cuerpo;
    la posición más segura es la mano derecha a las 4 en punto y la mano izquierda
    a las 8 en punto.
- id: 335
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias se debe colocar a un bebé en un asiento de seguridad
    orientado hacia atrás en el asiento del pasajero delantero equipado con una bolsa
    de aire (airbag)?
  choices:
    A: Solo si el asiento del pasajero se echa completamente hacia atrás.
    B: Solo si el bebé pesa más de 20 libras.
    C: Solo cuando no haya otro medio de transporte.
    D: Bajo ninguna circunstancia.
  answer: D
  explanation: 'El manual establece explícitamente: "Si un vehículo está equipado
    con una bolsa de aire en el lado del pasajero, bajo NINGUNA circunstancia se debe
    colocar a un bebé en un asiento de seguridad orientado hacia atrás en el asiento
    del pasajero delantero".'
- id: 336
  category: defensive_driving
  question: Según los "Ocho pasos sencillos para una conducción segura y feliz", ¿qué
    debe hacer si se pierde?
  choices:
    A: Detenerse a un lado de la carretera para estudiar su mapa.
    B: Conducir hasta el lugar público, poblado y bien iluminado más cercano.
    C: Detenerse en medio de la carretera y encender las luces de emergencia.
    D: Pedir direcciones a un autoestopista.
  answer: B
  explanation: 'El paso 6 establece: "Si se pierde, no se detenga a un lado de la
    carretera para estudiar su mapa o las direcciones. En su lugar, conduzca hasta
    el lugar público, poblado y bien iluminado más cercano, como una estación de servicio
    o un restaurante".'
- id: 337
  category: vehicle_information
  question: Al revisar los frenos antes de conducir, ¿qué podría indicar si el pedal
    del freno se siente esponjoso?
  choices:
    A: El freno de mano necesita un ajuste.
    B: Puede haber una fuga en el sistema de frenado.
    C: Puede haber burbujas de aire en la línea de freno.
    D: Las pastillas de freno están completamente desgastadas.
  answer: C
  explanation: El manual explica que al revisar los frenos, si el pedal se siente
    esponjoso, es posible que haya burbujas de aire en la línea de freno.
- id: 338
  category: vehicle_information
  question: Al usar una moneda de un centavo para verificar la profundidad de la banda
    de rodadura de los neumáticos, ¿qué indica que sus neumáticos están demasiado
    desgastados y necesitan ser reemplazados?
  choices:
    A: Se puede ver toda la cabeza de Abraham Lincoln.
    B: La cabeza de Abraham Lincoln está completamente oculta.
    C: La moneda se cae de la ranura.
    D: Solo se puede ver la parte superior del Monumento a Lincoln.
  answer: A
  explanation: Al verificar la profundidad de la banda de rodadura con una moneda
    de un centavo, si coloca la cabeza de Lincoln primero en la ranura y puede ver
    toda su cabeza, sus neumáticos están demasiado desgastados y deben reemplazarse.
- id: 339
  category: vehicle_information
  question: ¿Dónde se puede encontrar normalmente la calcomanía que indica el "PSI"
    (presión de los neumáticos) correcto para su vehículo?
  choices:
    A: En el volante.
    B: En el interior del marco de la puerta del automóvil.
    C: Debajo de las alfombrillas.
    D: En el exterior de la tapa del tanque de gasolina.
  answer: B
  explanation: 'El manual establece: "Abra la puerta de su automóvil, en el marco
    interior, debería ver una calcomanía. Anote o tome una foto del número que dice
    ''PSI''".'
- id: 340
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si se le revienta un neumático mientras
    conduce?
  choices:
    A: Pisar los frenos a fondo inmediatamente.
    B: Bombear los frenos rápidamente para reducir la velocidad.
    C: Sujetar firmemente el volante y seguir recto.
    D: Poner punto muerto y apagar el motor.
  answer: C
  explanation: En caso de un reventón, el manual instruye a los conductores a "sujetar
    firmemente el volante, seguir recto y soltar el acelerador. No frene hasta que
    el vehículo esté bajo control".
- id: 341
  category: defensive_driving
  question: Si los frenos fallan mientras conduce, ¿cuál de las siguientes acciones
    debe tomar?
  choices:
    A: Cambiar a una marcha superior y acelerar.
    B: Bombear el pedal del freno rápidamente.
    C: Apagar el motor inmediatamente.
    D: Tirar del freno de mano lo más rápido y fuerte posible.
  answer: B
  explanation: Si los frenos fallan, el manual aconseja "bombear el pedal del freno
    rápidamente", cambiar a una marcha más baja y usar el freno de mano mientras se
    mantiene presionado el botón de liberación para evitar un derrape.
- id: 342
  category: vehicle_information
  question: ¿Cómo puede ayudar a evitar que el motor se sobrecaliente en el tráfico
    lento?
  choices:
    A: Poner el vehículo en punto muerto (neutral) y acelerar el motor brevemente
      durante las paradas.
    B: Encender la calefacción del vehículo en el nivel más alto.
    C: Quitar la tapa del radiador mientras el motor está en ralentí.
    D: Bombear el pedal del acelerador continuamente mientras se mueve.
  answer: A
  explanation: 'El manual establece: "Puede evitar el sobrecalentamiento en el tráfico
    lento poniendo el vehículo en punto muerto (neutral) y acelerando el motor brevemente
    durante las paradas. Esto acelerará el ventilador y la bomba de agua".'
- id: 343
  category: defensive_driving
  question: Si la parte trasera de su vehículo comienza a derrapar hacia la derecha,
    ¿hacia dónde debe girar el volante para recuperar el control?
  choices:
    A: Girar hacia la izquierda.
    B: Girar hacia la derecha.
    C: Mantener el volante perfectamente recto.
    D: Bloquear el volante en su posición actual.
  answer: B
  explanation: 'Para salir de un derrape, debe girar el volante en la dirección del
    derrape. El manual especifica: "Si la parte trasera de su vehículo derrapa hacia
    la derecha, gire hacia la derecha".'
- id: 344
  category: safe_driving_rules
  question: ¿Qué debe hacer si la parte trasera de su vehículo derrapa hacia la derecha?
  choices:
    A: Girar el volante hacia la izquierda.
    B: Girar el volante hacia la derecha.
    C: Aplicar la máxima presión a los frenos.
    D: Poner el vehículo en punto muerto (neutral).
  answer: B
  explanation: Si su vehículo está derrapando, debe girar en la dirección del derrape.
    Si la parte trasera de su vehículo derrapa hacia la derecha, gire hacia la derecha.
- id: 345
  category: vehicle_information
  question: Si el pedal del acelerador se queda pegado, ¿qué es lo primero que debe
    intentar hacer después de concentrarse en la dirección?
  choices:
    A: Apagar el motor inmediatamente.
    B: Aplicar la máxima presión a los frenos.
    C: Intentar soltar el pedal con el pie.
    D: Cambiar a reversa.
  answer: C
  explanation: Si el pedal del acelerador se queda pegado, debe concentrarse en la
    dirección, mantener la vista en la carretera e intentar soltar el pedal con el
    pie. Si eso no funciona, presione el embrague (clutch) o ponga el vehículo en
    punto muerto (neutral).
- id: 346
  category: defensive_driving
  question: Si sus ruedas se salen de la carretera, ¿cómo debe regresar su vehículo
    al pavimento?
  choices:
    A: Girar las ruedas gradualmente hacia el pavimento.
    B: Girar las ruedas bruscamente hacia el pavimento.
    C: Acelerar a la velocidad de la autopista antes de regresar.
    D: Frenar fuerte y detenerse por completo en el arcén (acotamiento).
  answer: B
  explanation: Si se sale de la carretera, debe reducir la velocidad, verificar el
    tráfico y luego girar las ruedas bruscamente hacia el pavimento. Tan pronto como
    toquen el borde, gírelas en la otra dirección para evitar cruzar la carretera.
- id: 347
  category: vehicle_information
  question: ¿Por qué NO debe usar agua para apagar un incendio en su vehículo?
  choices:
    A: El agua dañará permanentemente el bloque del motor.
    B: La gasolina encendida flotará sobre el agua y propagará el fuego.
    C: El agua puede causar un cortocircuito eléctrico peligroso.
    D: El agua se evapora demasiado rápido para ser efectiva en incendios de motores.
  answer: B
  explanation: Si hay un incendio en su vehículo, no use agua porque la gasolina encendida
    flotará sobre el agua y propagará el fuego. Use tierra o arena si no hay un extintor
    químico disponible.
- id: 348
  category: defensive_driving
  question: Si ve un vehículo que viene hacia usted en su carril, ¿por qué debe evitar
    girar hacia el carril que el vehículo ha dejado?
  choices:
    A: Es ilegal cruzar la línea central en una emergencia.
    B: El otro conductor puede darse cuenta de su error y volver al carril correspondiente.
    C: Perderá automáticamente su derecho de paso.
    D: Es más probable que su vehículo derrape sin control.
  answer: B
  explanation: Si un vehículo se aproxima en su carril, muévase a la derecha, reduzca
    la velocidad, toque la bocina y haga parpadear sus luces delanteras. No gire hacia
    el carril que el vehículo dejó, ya que el conductor puede darse cuenta de su error
    y volver al carril correspondiente.
- id: 349
  category: vehicle_information
  question: Al pasar corriente a un vehículo con la batería descargada, ¿dónde debe
    conectar el borne negativo de la batería con carga?
  choices:
    A: Al borne negativo de la batería descargada.
    B: Al borne positivo de la batería descargada.
    C: Al bloque del motor o al chasis del vehículo con la batería descargada.
    D: A la columna del volante del vehículo con la batería descargada.
  answer: C
  explanation: Al pasar corriente a un vehículo, debe conectar el borne negativo de
    la batería con carga al bloque del motor o al chasis del vehículo con la batería
    descargada.
- id: 350
  category: driver_responsibility
  question: Según el manual, ¿cuál es el primer paso para brindar primeros auxilios
    a una víctima lesionada en la escena de un choque?
  choices:
    A: Restaurar la respiración
    B: Tratar el estado de choque (shock)
    C: Proteger los huesos rotos
    D: Controlar el sangrado
  answer: D
  explanation: 'El manual establece que los primeros auxilios deben brindarse en el
    siguiente orden: 1. Controlar el sangrado, 2. Restaurar la respiración, 3. Tratar
    el estado de choque (shock), 4. Proteger los huesos rotos.'
- id: 351
  category: driver_responsibility
  question: 'La Ley del Buen Samaritano protege a las personas que brindan atención
    de emergencia de buena fe en la escena de un choque contra:'
  choices:
    A: Procesamiento penal
    B: Daños civiles
    C: Citaciones de tráfico
    D: Aumentos en las tarifas del seguro
  answer: B
  explanation: La Ley del Buen Samaritano establece que cualquier persona que, de
    buena fe, brinde atención de emergencia en la escena de un choque, sin remuneración,
    no es responsable de ningún daño civil como resultado de cualquier acto u omisión
    al brindar dicha atención.
- id: 352
  category: driver_responsibility
  question: 'Debe notificar a la agencia de aplicación de la ley más cercana si está
    involucrado en un choque que resulte en lesiones, muerte o daños a la propiedad
    de al menos:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: Si está involucrado en un choque que resulte en lesiones o la muerte
    de cualquier persona o daños a la propiedad de $1,000 o más, debe notificar a
    la agencia de aplicación de la ley más cercana.
- id: 353
  category: driver_responsibility
  question: 'Si choca contra un vehículo desatendido y no puede localizar al propietario,
    debe:'
  choices:
    A: Esperar junto al vehículo hasta que regrese el propietario.
    B: Llamar a una grúa para que retire el vehículo.
    C: Dejar una nota por escrito que contenga su información y las circunstancias
      del choque.
    D: Informar a su compañía de seguros dentro de los 30 días y abandonar la escena.
  answer: C
  explanation: Si choca contra un vehículo desatendido y no puede localizar al propietario,
    debe dejar una nota por escrito que contenga su nombre, dirección, número de placa,
    número de licencia de conducir, información del seguro del vehículo motorizado
    y las circunstancias del choque.
- id: 354
  category: safe_driving_rules
  question: ¿Cómo puede identificar fácilmente un vehículo de la Patrulla de Cortesía
    de West Virginia?
  choices:
    A: Un SUV rojo con una luz roja intermitente.
    B: Una camioneta pickup blanca con logotipos azules y dorados y una barra de luces
      naranja intermitente.
    C: Una grúa amarilla con franjas reflectantes verdes.
    D: Un sedán negro con sirena y luces azules.
  answer: B
  explanation: Los conductores de la Patrulla de Cortesía viajan en camionetas pickup
    blancas con logotipos reflectantes de la Patrulla de Cortesía en azul y dorado
    fácilmente identificables y una barra de luces naranja intermitente en la parte
    superior del vehículo.
- id: 355
  category: safe_driving_rules
  question: ¿Cuál es el tipo de choque más común en una zona de obras?
  choices:
    A: Colisiones frontales
    B: Raspaduras laterales (sideswipes)
    C: Choques por alcance (traseros)
    D: Volcamientos
  answer: C
  explanation: Los choques por alcance (chocar contra la parte trasera de un vehículo
    que reduce la velocidad o se detiene) son el tipo más común de choque en zonas
    de obras.
- id: 356
  category: defensive_driving
  question: 'Si pierde repentinamente el control de la dirección y su vehículo comienza
    a dirigirse hacia un peatón, debe:'
  choices:
    A: Soltar el acelerador y esperar a que el vehículo disminuya la velocidad.
    B: Aplicar los frenos rápidamente, usando la presión máxima.
    C: Poner el vehículo en punto muerto (neutral) y tocar la bocina.
    D: Apagar el motor inmediatamente.
  answer: B
  explanation: Si la dirección falla y su vehículo comienza a salirse de la carretera
    o se dirige hacia un peatón u otro vehículo, aplique los frenos rápidamente, usando
    la presión máxima.
- id: 357
  category: vehicle_information
  question: Si sus faros delanteros fallan en una carretera oscura y todas las demás
    luces también fallan, ¿qué debe hacer?
  choices:
    A: Detenerse inmediatamente en su carril y esperar ayuda.
    B: Permanecer en la calzada y reducir la velocidad lo suficiente como para salir
      de ella de forma segura.
    C: Acelerar para llegar rápidamente a la salida más cercana.
    D: Conducir por el arcén (hombro) hasta llegar a una gasolinera.
  answer: B
  explanation: Si todas las luces fallan, permanezca en la calzada y reduzca la velocidad
    lo suficiente como para salir de la carretera de forma segura.
- id: 358
  category: safe_driving_rules
  question: 'Si su vehículo se apaga en las vías del tren y se aproxima un tren, debe:'
  choices:
    A: Permanecer en el vehículo e intentar arrancar el motor.
    B: Poner el vehículo en punto muerto e intentar empujarlo fuera de las vías.
    C: Salir del vehículo y dirigirse a un lugar seguro.
    D: Tocar la bocina para advertir al maquinista del tren.
  answer: C
  explanation: Si se aproxima un tren y su vehículo está varado en las vías, salga
    del vehículo y diríjase a un lugar seguro.
- id: 359
  category: defensive_driving
  question: ¿Cuál es la mejor manera de asegurar una distancia de seguimiento adecuada,
    como cuando se conduce en una zona de obras?
  choices:
    A: Usar la regla de los dos segundos
    B: Usar la regla de los tres a cuatro segundos
    C: Mantener la distancia de un vehículo por cada 10 mph
    D: Usar la regla de los cinco segundos
  answer: B
  explanation: Según el manual, la mejor manera de asegurar una distancia de seguimiento
    adecuada es usar la regla de los tres a cuatro segundos.
- id: 360
  category: safe_driving_rules
  question: ¿Cuándo es apropiado cambiar de carril de manera segura?
  choices:
    A: Siempre que señale su intención durante al menos 100 pies
    B: Solo donde las marcas en el pavimento lo indiquen y las condiciones del tráfico
      lo permitan
    C: En cualquier momento si conduce por debajo del límite de velocidad
    D: Solo al adelantar a un vehículo lento por la derecha
  answer: B
  explanation: El manual establece que se debe cambiar de carril solo donde las marcas
    en el pavimento lo indiquen y solo cuando las condiciones del tráfico lo permitan.
- id: 361
  category: safe_driving_rules
  question: ¿Qué debe hacer al acercarse al cierre de un carril?
  choices:
    A: Acelerar para pasar el cierre rápidamente
    B: Esperar hasta el último momento para incorporarse
    C: Pasarse al carril abierto lo antes posible
    D: Detenerse y esperar a que un señalizador (flagger) le dé indicaciones
  answer: C
  explanation: Al acercarse a cierres de carriles, debe pasarse al carril abierto
    lo antes posible y prestar mucha atención a los vehículos en su punto ciego.
- id: 362
  category: safe_driving_rules
  question: ¿Por qué debería encender los faros delanteros desde el atardecer hasta
    el amanecer, incluso si la ley no lo exige?
  choices:
    A: Evita que se agote la batería
    B: Asegura que los trabajadores viales y otros conductores puedan verlo
    C: Le ayuda a ver mejor las marcas en el pavimento
    D: Reduce el deslumbramiento del tráfico que viene en sentido contrario
  answer: B
  explanation: Encender los faros delanteros desde el atardecer hasta el amanecer
    asegura que los trabajadores viales y otros conductores puedan verlo.
- id: 363
  category: penalties_and_points
  question: ¿Cuál es la multa potencial por una condena por tirar basura en West Virginia?
  choices:
    A: No menos de $10 ni más de $100
    B: No menos de $50 ni más de $1,000
    C: Exactamente $500
    D: No menos de $1,000 ni más de $5,000
  answer: B
  explanation: Tras una condena por tirar basura, una persona puede ser multada con
    no menos de $50 ni más de $1,000.
- id: 364
  category: penalties_and_points
  question: Tras una condena por tirar basura, ¿por cuántos días como máximo puede
    ser encarcelada una persona en la cárcel del condado?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Una persona condenada por tirar basura puede ser encarcelada en la
    cárcel del condado por no más de 60 días.
- id: 365
  category: penalties_and_points
  question: Una persona condenada por tirar basura puede ser sentenciada a recoger
    basura de las carreteras por un total de no menos de ¿cuántas horas?
  choices:
    A: 10 horas
    B: 20 horas
    C: 30 horas
    D: 40 horas
  answer: C
  explanation: Una condena por tirar basura puede resultar en una sentencia para recoger
    basura de cualquier carretera pública o privada por un total de no menos de 30
    horas.
- id: 366
  category: penalties_and_points
  question: Además de las multas y el tiempo en la cárcel, ¿qué más le puede suceder
    a un conductor condenado por tirar basura?
  choices:
    A: Su vehículo será confiscado
    B: Se le pueden asignar puntos en su historial de conducción
    C: Su licencia será revocada permanentemente
    D: Debe volver a realizar el examen de conducir
  answer: B
  explanation: El manual señala que a un conductor también se le pueden asignar "puntos"
    en su historial de conducción por tirar basura.
- id: 367
  category: driver_responsibility
  question: ¿Cuál de los siguientes productos de desecho de vehículos representa la
    mayor amenaza para el medio ambiente?
  choices:
    A: Aceite de motor sucio, neumáticos viejos, anticongelante y baterías
    B: Líquido limpiaparabrisas y pastillas de freno
    C: Humos de escape y filtros de aire
    D: Chatarra y vidrios rotos
  answer: A
  explanation: El manual establece que los productos de desecho que representan las
    mayores amenazas son el aceite de motor sucio, los neumáticos viejos, el anticongelante
    y las baterías.
- id: 368
  category: driver_responsibility
  question: Si se vierte en un lago, el aceite de un solo cambio de aceite (aproximadamente
    un galón) ¿cuánta agua puede arruinar?
  choices:
    A: Mil galones
    B: Diez mil galones
    C: Cien mil galones
    D: Un millón de galones
  answer: D
  explanation: Si se vierte en un lago, el aceite de un solo cambio de aceite (aproximadamente
    un galón) puede arruinar un millón de galones de agua.
- id: 369
  category: driver_responsibility
  question: ¿Cuál es una consecuencia negativa de acumular ilegalmente neumáticos
    usados?
  choices:
    A: Liberan gases tóxicos al aire
    B: Acumulan agua, atraen mosquitos y se convierten en una tentación para los pirómanos
    C: Contaminan el suelo con plomo
    D: Se disuelven y contaminan las aguas subterráneas
  answer: B
  explanation: Cuando se acumulan ilegalmente, los neumáticos usados recogen agua,
    atraen mosquitos y se convierten en una tentación para los pirómanos.
- id: 370
  category: vehicle_information
  question: ¿Qué agencia clasifica el anticongelante como un residuo peligroso?
  choices:
    A: El Departamento de Transporte (DOT)
    B: La Agencia de Protección Ambiental (EPA)
    C: La División de Vehículos Motorizados (DMV)
    D: El Departamento de Energía
  answer: B
  explanation: El anticongelante está clasificado como un residuo peligroso por la
    Agencia de Protección Ambiental (EPA).
- id: 371
  category: vehicle_information
  question: ¿Qué sustancias contienen en grandes cantidades las baterías viejas y
    otros desechos peligrosos?
  choices:
    A: Plomo y ácido sulfúrico
    B: Mercurio y freón
    C: Monóxido de carbono y nitrógeno
    D: Litio y alcalino
  answer: A
  explanation: Las baterías viejas y otros desechos peligrosos contienen grandes cantidades
    de plomo y ácido sulfúrico.
- id: 372
  category: driver_responsibility
  question: ¿Qué están obligados a hacer por ley los minoristas de baterías con respecto
    a las baterías viejas?
  choices:
    A: Cobrar una tarifa de eliminación
    B: Enviarlas a un vertedero
    C: Reciclarlas a petición
    D: Negarse a aceptarlas
  answer: C
  explanation: Los minoristas de baterías están obligados por ley a reciclar las baterías
    viejas si se les solicita.
- id: 373
  category: driver_responsibility
  question: ¿Dónde se puede reciclar normalmente el aceite de motor usado de forma
    gratuita?
  choices:
    A: En cualquier vertedero público
    B: En muchos minoristas de repuestos de automóviles y gasolineras con áreas de
      servicio
    C: En la División de Vehículos Motorizados (DMV)
    D: En la sede de la Agencia de Protección Ambiental (EPA)
  answer: B
  explanation: Muchos minoristas de repuestos de automóviles y gasolineras con áreas
    de servicio reciclan el aceite usado de forma gratuita.
- id: 374
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  image: stop.png
- id: 375
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen con seguridad.
  image: yield.png
- id: 376
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entrar en esta vía
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  image: do_not_enter.png
- id: 377
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  image: wrong_way.png
- id: 378
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    apunta la flecha.'
  image: one_way_left.png
- id: 379
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  image: no_u_turn.png
- id: 380
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  image: no_left_turn.png
- id: 381
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  image: no_right_turn.png
- id: 382
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  image: no_passing.png
- id: 383
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Gire a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  image: keep_right.png
- id: 384
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  image: speed_limit_25.png
- id: 385
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  image: deer_crossing.png
- id: 386
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la carretera.
  image: pedestrian_crossing.png
- id: 387
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  image: school_zone.png
- id: 388
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  image: railroad_crossing.png
- id: 389
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces de ferrocarril. Significa que debe ceder el paso a los trenes.
    Si se acerca un tren, debe detenerse.
  image: railroad_crossbuck.png
- id: 390
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Se requiere giro a la derecha
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  image: curve_right.png
- id: 391
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Es necesario reducir la velocidad de manera
    más significativa antes de este giro.
  image: sharp_turn_right.png
- id: 392
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que la carretera
    curve primero en un sentido y luego en el otro.
  image: reverse_curve.png
- id: 393
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a las cambiantes condiciones
    de la carretera.
  image: winding_road.png
- id: 394
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  image: merge.png
- id: 395
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  image: road_narrows.png
- id: 396
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  image: divided_highway.png
- id: 397
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Una zona de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  image: divided_highway_ends.png
- id: 398
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona para adelantar más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  image: two_way_traffic.png
- id: 399
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  image: slippery_when_wet.png
- id: 400
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  image: hill.png
- id: 401
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Prepárese para
    detenerse si la luz está en rojo o amarillo. Esta señal suele colocarse donde
    el semáforo puede no ser visible desde la distancia.
  image: signal_ahead.png
- id: 402
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (yield)
    B: Un semáforo
    C: Una señal de alto (stop) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (stop) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  image: stop_ahead.png
- id: 403
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  image: cross_road.png
- id: 404
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  image: side_road.png
- id: 405
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  image: added_lane.png
- id: 406
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse o permanecer con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  image: no_parking.png
- id: 407
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para discapacitados válida pueden
    estacionarse en estos espacios. Las infracciones conllevan multas elevadas.
  image: handicap_parking.png
- id: 408
  category: sharing_the_road
  question: Según el manual de West Virginia, ¿cuál es la distancia mínima de seguimiento
    segura al conducir detrás de una motocicleta?
  choices:
    A: De uno a dos segundos
    B: De dos a tres segundos
    C: De tres a cuatro segundos
    D: De cinco a seis segundos
  answer: C
  explanation: 'El manual establece: "Es prudente mantener una distancia mínima de
    seguimiento segura de tres a cuatro segundos" al seguir motocicletas.'
- id: 409
  category: sharing_the_road
  question: ¿Qué equipo se requiere en una bicicleta para circular después del anochecer
    en West Virginia?
  choices:
    A: Una luz delantera roja visible a 500 pies
    B: Una luz delantera blanca visible al menos a 500 pies hacia adelante
    C: Cinta reflectante en ambas ruedas
    D: Una luz azul intermitente
  answer: B
  explanation: El manual establece que para circular después del anochecer, las bicicletas
    deben tener "una luz delantera blanca que sea visible al menos a 500 pies hacia
    adelante".
- id: 410
  category: sharing_the_road
  question: En West Virginia, ¿qué debe exhibirse en la parte trasera de los vehículos
    diseñados para operar a velocidades de 25 mph o menos?
  choices:
    A: Una bandera roja
    B: Una luz ámbar intermitente
    C: Un emblema triangular altamente reflectante (emblema de vehículo de movimiento
      lento)
    D: Una señal blanca de "LENTO" (SLOW)
  answer: C
  explanation: El manual describe "un emblema triangular altamente reflectante de
    18 pulgadas" que "debe exhibirse en la parte trasera de los vehículos diseñados
    para operar a velocidades de 25 mph o menos".
- id: 411
  category: sharing_the_road
  question: ¿Qué es lo que un conductor nunca debe hacer al acercarse a un caballo
    en una carretera de West Virginia?
  choices:
    A: Reducir la velocidad
    B: Tocar la bocina
    C: Cambiar de carril
    D: Hacer destellos con los faros
  answer: B
  explanation: 'El manual establece: "Nunca toque la bocina al acercarse o estar cerca
    de un caballo, ya que esto puede asustar al caballo y provocar un choque".'
- id: 412
  category: sharing_the_road
  question: Según el manual de West Virginia, ¿qué deben hacer los ciclistas cuando
    circulan uno al lado del otro?
  choices:
    A: Circular por la acera en su lugar
    B: Mantenerse dentro de un solo carril y no retrasar el tráfico
    C: Usar señales manuales en todo momento
    D: Circular únicamente por ciclovías designadas
  answer: B
  explanation: El manual establece que los ciclistas deben, "si circulan uno al lado
    del otro, mantenerse dentro de un solo carril y no retrasar el tráfico".
- id: 413
  category: sharing_the_road
  question: ¿Por qué los conductores deben tener un cuidado especial durante las horas
    de la mañana y la tarde al compartir la carretera con ciclistas en West Virginia?
  choices:
    A: Los ciclistas no están obligados a seguir las leyes de tránsito durante estas
      horas
    B: Los ciclistas se desplazan entre el hogar, el trabajo, la escuela o lugares
      de recreación durante estos horarios
    C: Los límites de velocidad son más bajos durante estas horas
    D: Las obras viales son más comunes durante estas horas
  answer: B
  explanation: 'El manual establece: "Se necesita un cuidado especial durante la mañana
    y la tarde, cuando los ciclistas se desplazan entre el hogar, el trabajo, la escuela
    o lugares de recreación".'
- id: 414
  category: sharing_the_road
  question: Según el manual de West Virginia, al rebasar una motocicleta, ¿qué debe
    hacer un conductor?
  choices:
    A: Compartir el carril con la motocicleta
    B: Pasar completamente al otro carril
    C: Tocar la bocina para alertar al motociclista
    D: Hacer destellos con los faros antes de rebasar
  answer: B
  explanation: 'El manual establece: "Al rebasar, pase completamente al otro carril.
    Además de tener el derecho legal a un carril completo, el motociclista puede necesitar
    desviarse para evitar algo en la carretera".'
- id: 415
  category: sharing_the_road
  question: En condiciones secas, ¿cuánto tiempo debe esperar después de rebasar un
    camión pesado antes de volver a incorporarse a la derecha en West Virginia?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: B
  explanation: 'El manual establece: "En condiciones secas, use la regla de los dos
    segundos. Después de rebasar, deje pasar dos (2) segundos antes de incorporarse
    a la derecha".'
- id: 416
  category: sharing_the_road
  question: Aunque el tráfico no tiene que detenerse ante un autobús público en West
    Virginia, ¿qué deben vigilar siempre los conductores?
  choices:
    A: Otros autobuses que se acerquen por detrás
    B: Pasajeros que cruzan la calle al subir y bajar del autobús
    C: Las señales manuales del conductor del autobús
    D: Luces amarillas intermitentes en el autobús
  answer: B
  explanation: 'El manual establece: "Aunque el tráfico no tiene que detenerse ante
    un autobús público, por favor vigile a los pasajeros que cruzan la calle al subir
    y bajar del autobús".'
- id: 417
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor al encontrarse con un ciclista que viene
    en sentido contrario por la noche en West Virginia?
  choices:
    A: Hacer destellos con las luces altas para alertar al ciclista
    B: Bajar siempre las luces (usar luces bajas)
    C: Moverse al extremo derecho de su carril
    D: Detenerse por completo
  answer: B
  explanation: 'El manual establece: "Al encontrarse con un ciclista que viene en
    sentido contrario por la noche, baje siempre las luces".'
