questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima en Missouri para que una persona pueda solicitar
    un Permiso de Instrucción estándar?
  choices:
    A: 14 años
    B: 15 años
    C: 15 años y medio
    D: 16 años
  answer: B
  explanation: De acuerdo con la Guía del Conductor de Missouri, una persona debe
    tener al menos 15 años de edad para solicitar un Permiso de Instrucción.
- id: 2
  category: license_system
  question: Para obtener una Licencia Intermedia en Missouri, ¿cuánto tiempo debe
    una persona mantener su Permiso de Instrucción sin condenas relacionadas con el
    alcohol ni puntos de tráfico?
  choices:
    A: 90 días
    B: 120 días
    C: 182 días
    D: Un año
  answer: C
  explanation: La ley de Missouri exige que los solicitantes mantengan un Permiso
    de Instrucción durante al menos 182 días (aproximadamente 6 meses) antes de ser
    elegibles para una Licencia Intermedia.
- id: 3
  category: license_system
  question: Bajo la ley de Licencia de Conducir Graduada (GDL) de Missouri, ¿cuáles
    son las horas de conducción restringidas para el titular de una Licencia Intermedia?
  choices:
    A: De medianoche a 6:00 AM
    B: De 11:00 PM a 5:00 AM
    C: De 1:00 AM a 5:00 AM
    D: De 10:00 PM a 4:00 AM
  answer: C
  explanation: Los titulares de una Licencia Intermedia en Missouri tienen restringido
    conducir entre la 1:00 AM y las 5:00 AM, a menos que estén acompañados por un
    conductor con licencia de 21 años o más, o por motivos específicos de trabajo,
    escuela o emergencia.
- id: 4
  category: license_system
  question: Durante los primeros seis meses de tener una Licencia Intermedia de Missouri,
    ¿cuántos pasajeros menores de 19 años (que no sean familiares directos) puede
    llevar el conductor?
  choices:
    A: Ninguno
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Durante los primeros seis meses, el titular de una Licencia Intermedia
    no puede operar un vehículo motorizado con más de un pasajero menor de 19 años
    que no sea miembro de su familia inmediata.
- id: 5
  category: license_system
  question: ¿Cuántas horas de conducción supervisada, incluyendo horas nocturnas,
    debe completar el titular de un permiso en Missouri antes de solicitar una Licencia
    Intermedia?
  choices:
    A: 30 horas totales, 5 de noche
    B: 40 horas totales, 10 de noche
    C: 50 horas totales, 10 de noche
    D: 20 horas totales, 5 de noche
  answer: B
  explanation: Missouri requiere 40 horas de instrucción al volante, incluyendo un
    mínimo de 10 horas de conducción nocturna, verificadas por un padre o tutor.
- id: 6
  category: license_system
  question: Según la ley de Missouri, su privilegio de conducir será suspendido si
    acumula ¿cuántos puntos en su historial de conducción en un plazo de 18 meses?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: El Departamento de Ingresos de Missouri suspenderá su privilegio de
    conducir si acumula 8 o más puntos en 18 meses.
- id: 7
  category: license_system
  question: En Missouri, su licencia de conducir será revocada por un año si acumula
    ¿cuántos puntos en un período de 12 meses?
  choices:
    A: 8 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: C
  explanation: La ley de Missouri exige la revocación de los privilegios de conducir
    por un año si un conductor acumula 12 puntos en 12 meses, 18 puntos en 24 meses
    o 24 puntos en 36 meses.
- id: 8
  category: license_system
  question: ¿Cuál es el límite legal de Contenido de Alcohol en la Sangre (BAC) para
    un conductor menor de 21 años en Missouri?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Missouri aplica una política de 'Tolerancia Cero' para menores; si
    es menor de 21 años, su licencia puede ser suspendida si lo sorprenden conduciendo
    con un BAC de 0.02% o superior.
- id: 9
  category: license_system
  question: Al mudarse a una nueva residencia dentro de Missouri, ¿cuántos días tiene
    para notificar al Departamento de Ingresos sobre su cambio de dirección?
  choices:
    A: 10 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: B
  explanation: La ley de Missouri exige que los conductores notifiquen al Departamento
    de Ingresos dentro de los 30 días posteriores al cambio de su dirección.
- id: 10
  category: license_system
  question: ¿Quién tiene permitido sentarse en el asiento delantero para supervisar
    al titular de un Permiso de Instrucción de Missouri de 15 años?
  choices:
    A: Cualquier conductor con licencia mayor de 18 años
    B: Un hermano que tenga al menos 18 años
    C: Un conductor con licencia de 21 años de edad o más
    D: Cualquier persona que los padres del conductor autoricen
  answer: C
  explanation: El titular de un permiso debe estar acompañado por una persona calificada
    (padre, tutor o instructor de manejo) o un conductor con licencia que tenga al
    menos 21 años de edad.
- id: 11
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir estándar de Missouri
    para conductores de entre 21 y 69 años antes de que expire?
  choices:
    A: 3 años
    B: 4 años
    C: 6 años
    D: 8 años
  answer: C
  explanation: En Missouri, a los conductores de 21 a 69 años se les suele expedir
    una licencia con una validez de 6 años. Los menores de 21 años o mayores de 70
    años reciben licencias de 3 años.
- id: 12
  category: license_system
  question: Para ser elegible para una Licencia Intermedia, un solicitante de Missouri
    no debe haber tenido ningún accidente 'por su culpa' (at-fault) en los últimos
    ____ meses.
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: B
  explanation: Los requisitos del sistema de Licencia de Conducir Graduada (GDL) de
    Missouri establecen que el solicitante debe estar libre de accidentes e infracciones
    durante los 12 meses inmediatamente anteriores a la solicitud.
- id: 13
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es aceptable como prueba de residencia
    en Missouri al solicitar una licencia?
  choices:
    A: Una factura de servicios públicos de los últimos 60 días
    B: Un estado de cuenta bancario de los últimos 60 días
    C: Una pieza de correo dirigida a 'Ocupante' (Occupant)
    D: Un talón de pago de los últimos 60 días
  answer: C
  explanation: La prueba de residencia debe mostrar el nombre y la dirección física
    del solicitante; el correo genérico dirigido a 'Ocupante' no es una documentación
    válida.
- id: 14
  category: license_system
  question: En Missouri, ¿cuál es la edad mínima para solicitar una licencia de conducir
    completa (para menores de 21 años), siempre que se hayan cumplido todos los requisitos
    de la GDL?
  choices:
    A: 16 años
    B: 17 años
    C: 18 años
    D: 21 años
  answer: C
  explanation: Una persona puede solicitar una licencia de conducir completa a los
    18 años, siempre que haya completado la etapa de Licencia Intermedia sin suspensiones
    ni revocaciones.
- id: 15
  category: license_system
  question: Si un conductor de Missouri es condenado por una primera infracción de
    MIP (Menor en Posesión), ¿qué sucede con su privilegio de conducir?
  choices:
    A: Nada, a menos que estuviera conduciendo en ese momento
    B: Su licencia se suspende por 30 días
    C: Su licencia se suspende por 90 días
    D: Su licencia se revoca por un año
  answer: B
  explanation: Bajo la ley de 'Abuso y Pérdida' (Abuse and Lose) de Missouri, una
    primera condena por MIP resulta en una suspensión de 30 días de los privilegios
    de conducir, incluso si el menor no estaba operando un vehículo.
- id: 16
  category: license_system
  question: En Missouri, ¿qué clase de licencia se requiere para operar un vehículo
    de alquiler, como un transporte de enlace (shuttle) o un vehículo de entrega,
    que no requiere una Licencia de Conducir Comercial (CDL)?
  choices:
    A: Clase F
    B: Clase E
    C: Clase M
    D: Clase A
  answer: B
  explanation: Se requiere una licencia Clase E (de alquiler o 'For-Hire') en Missouri
    para las personas que operan un vehículo motorizado como parte de su empleo para
    transportar personas o bienes por alquiler, o un vehículo que transporte 14 pasajeros
    o menos.
- id: 17
  category: license_system
  question: Para cumplir con los requisitos de visión para una licencia de conducir
    de Missouri sin restricciones, ¿qué agudeza visual debe tener un solicitante en
    al menos un ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Missouri requiere que los solicitantes tengan al menos una visión de
    20/40 en uno o ambos ojos para calificar para una licencia sin restricciones.
    Si la visión está entre 20/41 y 20/160, pueden aplicarse restricciones.
- id: 18
  category: license_system
  question: Si un solicitante de Missouri reprueba el examen de habilidades de conducción
    tres veces, ¿cuál es el procedimiento requerido antes de que pueda volver a examinarse?
  choices:
    A: Debe esperar 6 meses.
    B: Debe completar 40 horas de capacitación adicional.
    C: Debe obtener un permiso por escrito del Departamento de Ingresos (Department
      of Revenue).
    D: Debe volver a tomar únicamente el examen escrito.
  answer: C
  explanation: Según la Guía del Conductor de Missouri, si reprueba el examen de conducir
    tres veces, el examinador le entregará un formulario que debe enviar al Departamento
    de Ingresos para solicitar permiso para realizar exámenes adicionales.
- id: 19
  category: license_system
  question: En Missouri, ¿entre qué edades los solicitantes masculinos se registran
    automáticamente en el Servicio Selectivo (Selective Service) al solicitar una
    licencia de conducir o una tarjeta de identificación?
  choices:
    A: 16 a 18
    B: 18 a 25
    C: 18 a 30
    D: 21 a 26
  answer: B
  explanation: La ley de Missouri exige que cualquier ciudadano estadounidense o inmigrante
    varón que tenga al menos 18 años pero menos de 26 años de edad sea registrado
    en el Sistema del Servicio Selectivo al solicitar una licencia.
- id: 20
  category: license_system
  question: Si cambia su nombre debido a un matrimonio o una orden judicial, ¿cuántos
    días tiene para visitar una oficina de licencias de Missouri para actualizar su
    licencia de conducir?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley de Missouri le exige notificar al Departamento de Ingresos sobre
    un cambio de nombre y obtener un duplicado de la licencia dentro de los 30 días
    posteriores al cambio.
- id: 21
  category: license_system
  question: ¿Cuántos meses antes de que venza su licencia de conducir de Missouri
    se le permite renovarla?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: En Missouri, puede renovar su licencia de conducir hasta 6 meses (180
    días) antes de la fecha de vencimiento.
- id: 22
  category: license_system
  question: ¿Cuál es la clase de licencia de operador estándar en Missouri para un
    vehículo de pasajeros típico?
  choices:
    A: Clase A
    B: Clase C
    C: Clase F
    D: Clase G
  answer: C
  explanation: La Clase F es la licencia de conducir básica de Missouri. Le permite
    operar cualquier vehículo motorizado (que no sea un vehículo motorizado comercial)
    que no sea de alquiler y no requiera una licencia de motocicleta.
- id: 23
  category: license_system
  question: ¿Cuál de los siguientes es un documento requerido para demostrar el "Estatus
    Legal" (Lawful Status) para una licencia de Missouri que cumpla con la ley REAL
    ID?
  choices:
    A: Una factura de servicios públicos de los últimos 30 días
    B: Un Certificado de Nacimiento de los EE. UU. certificado
    C: Un diploma de escuela secundaria
    D: Una tarjeta de biblioteca válida
  answer: B
  explanation: Para obtener una licencia que cumpla con la ley REAL ID en Missouri,
    debe proporcionar una prueba de estatus legal, como un Certificado de Nacimiento
    de los EE. UU. certificado, un Pasaporte de los EE. UU. válido o un Certificado
    de Naturalización.
- id: 24
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un permiso de instrucción de motocicleta
    en Missouri si el solicitante ya ha completado un curso de capacitación para conductores
    de motocicletas?
  choices:
    A: 15 años
    B: 15 años y medio
    C: 16 años
    D: 18 años
  answer: B
  explanation: En Missouri, una persona que tenga al menos 15 años y medio (15 1/2)
    puede solicitar un permiso de instrucción de motocicleta si ha aprobado los exámenes
    correspondientes o ha completado un curso de capacitación.
- id: 25
  category: license_system
  question: Bajo la ley "Motor Voter" (Votante Motorizado), ¿cuál es la edad mínima
    a la que un residente de Missouri puede preinscribirse para votar en una oficina
    de licencias?
  choices:
    A: 16 años
    B: 17 años
    C: 17 años y medio
    D: 18 años
  answer: C
  explanation: Los residentes de Missouri pueden registrarse para votar en la oficina
    de licencias. Aunque debe tener 18 años para votar, puede preinscribirse a los
    17 años y medio (17 1/2).
- id: 26
  category: license_system
  question: Si un solicitante no tiene un número de Seguro Social, ¿qué debe proporcionar
    al Departamento de Ingresos (Department of Revenue) de Missouri para obtener una
    licencia?
  choices:
    A: Nada; no es obligatorio.
    B: Una carta de la Administración del Seguro Social que indique que no es elegible
      para un número.
    C: Una carta notariada de uno de los padres.
    D: Una copia de su declaración de impuestos más reciente.
  answer: B
  explanation: Si no tiene un número de Seguro Social, debe presentar una carta de
    la Administración del Seguro Social (SSA) con respecto a su estado de elegibilidad
    para un número de Seguro Social.
- id: 27
  category: license_system
  question: ¿Por cuánto tiempo son válidos los resultados de un examen escrito de
    conducir de Missouri?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Hasta que el solicitante cumpla 21 años
  answer: B
  explanation: Los resultados del examen escrito en Missouri son válidos por un año
    a partir de la fecha del examen.
- id: 28
  category: license_system
  question: Para que se coloque la designación de "VETERAN" (VETERANO) en una licencia
    de conducir de Missouri, ¿qué documento debe presentar el solicitante?
  choices:
    A: Una tarjeta de identificación militar
    B: Una carta del hospital local de la VA
    C: Un formulario DD-214 que muestre una baja honorable
    D: Una tarjeta de registro de votante
  answer: C
  explanation: Los veteranos de Missouri pueden solicitar que se coloque la palabra
    "VETERAN" en su licencia presentando un formulario DD-214 (Documentos de Baja)
    que indique una baja honorable.
- id: 29
  category: license_system
  question: En Missouri, ¿por cuántos años es válida una licencia de conducir si el
    solicitante tiene 70 años de edad o más?
  choices:
    A: 1 año
    B: 3 años
    C: 6 años
    D: 8 años
  answer: B
  explanation: Las licencias de conducir de Missouri emitidas a personas de 70 años
    o más son válidas por 3 años, mientras que las licencias para personas de entre
    21 y 69 años son válidas por 6 años.
- id: 30
  category: license_system
  question: ¿Cuál es el cargo estándar de restitución para un conductor de Missouri
    cuya licencia fue suspendida por acumular demasiados puntos?
  choices:
    A: $10
    B: $20
    C: $45
    D: $100
  answer: B
  explanation: El cargo estándar de restitución por una suspensión relacionada con
    puntos en Missouri es de $20. Otros tipos de suspensiones (como las relacionadas
    con el seguro) pueden tener cargos más altos.
- id: 31
  category: driver_testing
  question: ¿Cuál es el monto mínimo de cobertura de seguro de responsabilidad civil
    requerido por la ley de Missouri para daños a la propiedad?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de Missouri requiere un mínimo de $25,000 por accidente para
    daños a la propiedad, además de $25,000 por persona y $50,000 por accidente por
    lesiones corporales.
- id: 32
  category: driver_testing
  question: Según la Guía del Conductor de Missouri, ¿cuántas preguntas tiene el examen
    escrito de permiso (conocimientos) y cuál es la puntuación para aprobar?
  choices:
    A: 20 preguntas; 70%
    B: 25 preguntas; 80%
    C: 30 preguntas; 75%
    D: 50 preguntas; 80%
  answer: B
  explanation: El examen de conocimientos de Missouri consta de 25 preguntas de opción
    múltiple. Debe responder correctamente al menos 20 preguntas (80%) para aprobar.
- id: 33
  category: driver_testing
  question: Si usted es residente de Missouri y compra un vehículo, ¿cuántos días
    tiene para titular el vehículo y pagar el impuesto sobre las ventas antes de enfrentar
    una multa?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley de Missouri exige que titule y pague el impuesto sobre las ventas
    de un vehículo recién comprado dentro de los 30 días posteriores a la fecha de
    compra para evitar multas por retraso.
- id: 34
  category: driver_testing
  question: Para aprobar el examen de la vista de Missouri sin restricciones, ¿qué
    grado de visión periférica combinada debe tener como mínimo?
  choices:
    A: 70 grados
    B: 85 grados
    C: 105 grados
    D: 140 grados
  answer: C
  explanation: Missouri requiere una visión periférica horizontal combinada de al
    menos 105 grados para aprobar el examen de la vista sin restricciones.
- id: 35
  category: driver_testing
  question: Bajo el Sistema de Puntos de Missouri, ¿cuántos puntos se agregan a su
    historial de conducción por una condena de "Exceso de velocidad" (Speeding) en
    violación de la ley estatal?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: Una condena por exceso de velocidad en violación de la ley estatal
    de Missouri resulta en la adición de 3 puntos a su historial de conducción. Las
    violaciones de ordenanzas municipales por exceso de velocidad suelen resultar
    en 2 puntos.
- id: 36
  category: driver_testing
  question: 'Si conduce un año completo sin una nueva condena de tráfico en Missouri,
    el total de sus puntos acumulados se reducirá en:'
  choices:
    A: Un cuarto
    B: Un tercio
    C: La mitad
    D: Todos los puntos
  answer: B
  explanation: El sistema de reducción de puntos de Missouri reduce sus puntos totales
    en un tercio durante el primer año completo de conducción sin una nueva condena.
- id: 37
  category: driver_testing
  question: ¿Cuál de los siguientes es un requisito para el vehículo que usted proporcione
    para el examen de habilidades de conducción en carretera de Missouri?
  choices:
    A: Debe ser un sedán de tamaño mediano
    B: Debe tener transmisión manual
    C: Debe tener placas de matrícula válidas y una inspección manual vigente (si
      es requerida)
    D: Debe tener menos de 10 años de antigüedad
  answer: C
  explanation: El vehículo utilizado para el examen de carretera debe estar en buenas
    condiciones mecánicas, tener un registro válido, mostrar prueba de responsabilidad
    financiera y tener placas de matrícula vigentes.
- id: 38
  category: driver_testing
  question: En Missouri, ¿cuál es la sanción por una primera condena por no mantener
    la responsabilidad financiera (seguro)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 8 puntos
    D: Revocación permanente inmediata
  answer: B
  explanation: Una primera condena por no mantener el seguro en Missouri resulta en
    la adición de 4 puntos a su historial de conducción.
- id: 39
  category: driver_testing
  question: ¿Cuántos días después de reprobar el primer examen de habilidades de conducción
    de Missouri debe esperar antes de poder realizar el examen nuevamente?
  choices:
    A: 1 día
    B: 3 días
    C: 7 días
    D: 30 días
  answer: A
  explanation: Si reprueba el examen de habilidades de conducción, debe esperar al
    menos un día antes de volver a realizar el examen.
- id: 40
  category: driver_testing
  question: Según la ley de Missouri, ¿quién está obligado a usar el cinturón de seguridad
    en un vehículo de pasajeros?
  choices:
    A: Solo el conductor
    B: Solo los niños menores de 12 años
    C: El conductor, todos los pasajeros del asiento delantero y todos los pasajeros
      menores de 16 años
    D: Solo los pasajeros en el asiento trasero
  answer: C
  explanation: La ley de Missouri exige que el conductor, todos los pasajeros del
    asiento delantero y todos los pasajeros menores de 16 años estén debidamente abrochados.
- id: 41
  category: driver_testing
  question: Si se muda a Missouri desde otro estado y tiene una licencia de conducir
    válida y no vencida, ¿qué exámenes se le requiere tomar usualmente?
  choices:
    A: Exámenes escrito, de la vista y de manejo
    B: Solo exámenes de la vista y de manejo
    C: Solo exámenes de la vista y escrito
    D: Solo el examen de la vista
  answer: D
  explanation: Los nuevos residentes de Missouri con una licencia válida de otro estado
    generalmente solo deben aprobar el examen de la vista y la prueba de reconocimiento
    de señales de tránsito.
- id: 42
  category: driver_testing
  question: En Missouri, ¿cuántos puntos se asignan por una condena de 'Abandonar
    la escena de un accidente' en violación de la ley estatal?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: D
  explanation: Abandonar la escena de un accidente en violación de la ley estatal
    es una infracción grave y resulta en 12 puntos, lo que conlleva a la revocación
    inmediata de los privilegios de conducir.
- id: 43
  category: driver_testing
  question: ¿Cuál es el límite de velocidad máximo en las carreteras interestatales
    rurales en Missouri, a menos que se indique lo contrario?
  choices:
    A: 60 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: El límite de velocidad legal para las carreteras interestatales y autopistas
    rurales en Missouri es de 70 mph, a menos que las señales indiquen lo contrario.
- id: 44
  category: driver_testing
  question: Si su privilegio de conducir en Missouri es suspendido por acumular 8
    puntos en 18 meses, ¿cuánto tiempo dura el primer período de suspensión?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: A
  explanation: La primera vez que se suspende su privilegio de conducir en Missouri
    por puntos, la suspensión dura 30 días.
- id: 45
  category: driver_testing
  question: ¿Cuáles son los límites mínimos de cobertura de seguro de responsabilidad
    civil requeridos por la ley para el propietario de un vehículo motorizado en Missouri?
  choices:
    A: $15,000 por lesiones corporales por persona; $30,000 por accidente; $10,000
      por daños a la propiedad
    B: $25,000 por lesiones corporales por persona; $50,000 por accidente; $25,000
      por daños a la propiedad
    C: $50,000 por lesiones corporales por persona; $100,000 por accidente; $50,000
      por daños a la propiedad
    D: $10,000 por lesiones corporales por persona; $20,000 por accidente; $5,000
      por daños a la propiedad
  answer: B
  explanation: 'La ley de Missouri requiere una cobertura ''25/50/25'': $25,000 por
    lesiones corporales por persona, $50,000 por lesiones corporales por accidente
    y $25,000 por daños a la propiedad.'
- id: 46
  category: driver_testing
  question: En Missouri, ¿cuántos puntos se agregan a su historial de conducción por
    una condena de 'Conducción descuidada e imprudente'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: La conducción descuidada e imprudente es una infracción grave en Missouri
    y conlleva una penalización de 4 puntos en el historial del conductor.
- id: 47
  category: driver_testing
  question: Si su licencia de conducir de Missouri ha estado vencida por más de ______,
    debe tomar los exámenes escrito y de manejo nuevamente para renovarla.
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Missouri requiere que los conductores cuyas licencias hayan estado
    vencidas por más de 6 meses completen nuevamente todo el proceso de evaluación
    (escrito, de la vista y de manejo).
- id: 48
  category: driver_testing
  question: Antes de comenzar el examen de manejo en Missouri, el examinador revisará
    la seguridad de su vehículo. ¿Cuál de los siguientes causaría que el examen se
    posponga?
  choices:
    A: Una radio rota
    B: El aire acondicionado no funciona
    C: Luces direccionales que no funcionan
    D: Una pequeña grieta en la ventana del lado del pasajero
  answer: C
  explanation: El vehículo utilizado para el examen de manejo debe tener todo el equipo
    de seguridad en buen estado de funcionamiento, incluyendo las luces direccionales,
    las luces de freno y la bocina.
- id: 49
  category: driver_testing
  question: Para aprobar el examen de la vista de Missouri, ¿debe tener al menos qué
    grado de visión periférica en cada ojo (u 85 grados en un ojo)?
  choices:
    A: 35 grados
    B: 45 grados
    C: 55 grados
    D: 75 grados
  answer: C
  explanation: Los requisitos de visión de Missouri establecen que un solicitante
    debe tener al menos 55 grados de visión periférica en cada ojo, u 85 grados en
    un ojo.
- id: 50
  category: driver_testing
  question: Después de una suspensión de su privilegio de conducir en Missouri relacionada
    con puntos, ¿cuál es la tarifa de reinstalación requerida?
  choices:
    A: $10
    B: $20
    C: $45
    D: $65
  answer: B
  explanation: Para reinstalar una licencia después de una suspensión por puntos,
    el conductor debe pagar una tarifa de $20 y presentar una prueba de responsabilidad
    financiera (SR-22).
- id: 51
  category: driver_testing
  question: Si su licencia de Missouri es suspendida o revocada por una infracción
    relacionada con el alcohol, ¿qué programa debe completar antes de que su licencia
    pueda ser restablecida?
  choices:
    A: DDC (Curso de Manejo Defensivo)
    B: SATOP (Programa para Infractores de Tráfico por Abuso de Sustancias)
    C: Panel de Impacto de Víctimas de MADD (Madres Contra la Conducción Bajo los
      Efectos del Alcohol)
    D: Una clínica estándar de 4 horas para la mejora del conductor
  answer: B
  explanation: El SATOP es el programa obligatorio en Missouri para personas a quienes
    se les ha suspendido o revocado el privilegio de conducir debido a infracciones
    relacionadas con el alcohol o las drogas.
- id: 52
  category: driver_testing
  question: ¿Por cuánto tiempo es válida la licencia de conducir para un conductor
    de Missouri que tiene 70 años de edad o más?
  choices:
    A: 1 año
    B: 3 años
    C: 6 años
    D: Indefinidamente
  answer: B
  explanation: En Missouri, a los conductores de 70 años o más se les emiten licencias
    que son válidas por 3 años, en lugar del período estándar de 6 años para los adultos
    más jóvenes.
- id: 53
  category: driver_testing
  question: El examen escrito de conducir de Missouri consta de 25 preguntas. ¿Cuál
    es el número mínimo de respuestas correctas requeridas para aprobar?
  choices:
    A: '15'
    B: '18'
    C: '20'
    D: '22'
  answer: C
  explanation: Se requiere una puntuación del 80% para aprobar el examen escrito de
    Missouri, lo que significa que debe responder correctamente al menos 20 de las
    25 preguntas.
- id: 54
  category: driver_testing
  question: Durante el examen de manejo de Missouri, se le requerirá retroceder su
    vehículo en línea recta por ¿qué distancia?
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: El examen de habilidades de conducción de Missouri requiere que el
    solicitante retroceda el vehículo en línea recta por una distancia de 50 pies
    de manera segura y suave.
- id: 55
  category: driver_testing
  question: Si lo sorprenden conduciendo un vehículo motorizado en Missouri sin mantener
    el seguro requerido, ¿cuántos puntos se añadirán a su historial de conducción
    por una primera infracción?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: Una condena por no mantener la responsabilidad financiera (seguro)
    resulta en la adición de 4 puntos a su historial de conducción de Missouri.
- id: 56
  category: driver_testing
  question: ¿Cuál es la sanción por hacer una declaración falsa o declaración jurada
    bajo juramento al Departamento de Ingresos (Department of Revenue) de Missouri
    al solicitar una licencia?
  choices:
    A: Una multa de $50
    B: Una suspensión de 30 días
    C: Un delito menor de Clase A y la posible revocación de la licencia
    D: 10 horas obligatorias de servicio comunitario
  answer: C
  explanation: Proporcionar información falsa en una solicitud de licencia es una
    infracción grave (delito menor de Clase A) y puede resultar en la revocación de
    los privilegios de conducir por un año.
- id: 57
  category: driver_testing
  question: En el examen de manejo de Missouri, ¿aproximadamente cuántos pies de largo
    tiene el espacio de estacionamiento en paralelo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 25 pies
    D: 30 pies
  answer: C
  explanation: El espacio estándar para el estacionamiento en paralelo utilizado durante
    el examen de habilidades de conducción de Missouri tiene 25 pies de largo y 7
    pies de ancho.
- id: 58
  category: driver_testing
  question: Durante el examen de manejo de Missouri, ¿cuál de las siguientes acciones
    resultará en una reprobación inmediata?
  choices:
    A: No usar la luz de giro una vez
    B: Tocar el bordillo (curva) mientras se estaciona en paralelo
    C: Una acción peligrosa donde un accidente se evita solo por la intervención del
      examinador
    D: Conducir a 2 mph por debajo del límite de velocidad
  answer: C
  explanation: Cualquier acción peligrosa, violación de las leyes de tránsito o incidente
    que requiera que el examinador tome el control del vehículo resulta en una reprobación
    inmediata del examen de manejo de Missouri.
- id: 59
  category: driver_responsibility
  question: 'En Missouri, debe presentar un Informe de Accidente de Vehículo Motorizado
    (Formulario 1140) si el accidente involucró a un conductor sin seguro y los daños
    a la propiedad de cualquier persona excedieron:'
  choices:
    A: $200
    B: $500
    C: $1,000
    D: $2,500
  answer: B
  explanation: Si ocurre un accidente en Missouri, involucra a una parte sin seguro
    y resulta en más de $500 en daños a la propiedad o cualquier lesión/muerte, se
    debe presentar un informe dentro de los 30 días.
- id: 60
  category: driver_responsibility
  question: Si es condenado por una primera infracción por no mantener la responsabilidad
    financiera (seguro) en Missouri, ¿cuántos puntos se añadirán a su historial de
    conducción?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: Una condena por no mantener el seguro en Missouri resulta en la adición
    de 4 puntos a su historial de conducción por la primera infracción.
- id: 61
  category: driver_responsibility
  question: 'Por una segunda condena o condenas subsiguientes por conducir sin seguro,
    el Departamento de Ingresos de Missouri suspenderá su privilegio de conducir por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Una segunda condena o condenas subsiguientes por no mantener el seguro
    resultan en una suspensión de 90 días y una tarifa de reinstalación de $200.
- id: 62
  category: driver_responsibility
  question: 'Para demostrar responsabilidad financiera después de una suspensión relacionada
    con el seguro, un conductor de Missouri debe mantener una presentación de SR-22
    por un período de:'
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Missouri requiere que los conductores mantengan una presentación de
    seguro SR-22 durante tres años a partir de la fecha de la suspensión para demostrar
    responsabilidad financiera futura.
- id: 63
  category: driver_responsibility
  question: Cuando compra un vehículo en Missouri, ¿cuántos días tiene para titular
    y registrar el vehículo antes de que se apliquen cargos por mora?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley de Missouri exige que los vehículos sean titulados y registrados
    dentro de los 30 días posteriores a la fecha de compra para evitar multas por
    retraso.
- id: 64
  category: driver_responsibility
  question: 'En Missouri, la mayoría de los vehículos motorizados deben someterse
    a una inspección de seguridad cada:'
  choices:
    A: Año
    B: Dos años
    C: Cinco años
    D: Solo al momento de vender el vehículo
  answer: B
  explanation: Missouri requiere inspecciones de seguridad bienales (cada dos años)
    para la mayoría de los vehículos, según el año del modelo del vehículo (años pares
    para modelos con números pares, impares para impares).
- id: 65
  category: driver_responsibility
  question: ¿Cuál de las siguientes áreas de Missouri requiere una inspección de emisiones
    además de una inspección de seguridad?
  choices:
    A: Condado de Greene
    B: Condado de St. Charles
    C: Condado de Boone
    D: Condado de Cole
  answer: B
  explanation: Se requieren inspecciones de emisiones para los vehículos registrados
    en la ciudad de St. Louis, el condado de St. Louis, el condado de St. Charles,
    el condado de Franklin y el condado de Jefferson.
- id: 66
  category: driver_responsibility
  question: Según la ley de Missouri, ¿cuál es la multa máxima por una primera condena
    por tirar basura?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Tirar basura es un delito en Missouri. Una primera condena puede resultar
    en una multa de hasta $1,000 y/o hasta un año de cárcel.
- id: 67
  category: driver_responsibility
  question: Si se ve involucrado en un choque en Missouri que cumple con los criterios
    de notificación, ¿cuánto tiempo tiene para presentar un Informe de Accidente de
    Vehículo Motorizado (Formulario 1140)?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 1 año
  answer: B
  explanation: La ley de Missouri exige que el Informe de Accidente de Vehículo Motorizado
    se presente dentro de los 30 días posteriores al accidente si se cumplen los criterios
    (falta de seguro, daños > $500 o lesiones).
- id: 68
  category: driver_responsibility
  question: En Missouri, ¿cuál es el valor de puntos asignado por una condena de 'Conducción
    descuidada e imprudente' (Careless and Imprudent Driving)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 8 puntos
  answer: C
  explanation: Una condena por Conducción descuidada e imprudente en Missouri resulta
    en la adición de 4 puntos al historial del conductor.
- id: 69
  category: driver_responsibility
  question: Si un conductor de Missouri es condenado por 'Abandonar la escena de un
    accidente' (una violación estatal), ¿cuántos puntos se asignan a su historial?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: D
  explanation: Abandonar la escena de un accidente es una ofensa grave en Missouri
    y resulta en 12 puntos, lo que conlleva a la revocación inmediata de los privilegios
    de conducir.
- id: 70
  category: driver_responsibility
  question: ¿De qué manera exige la ley de Missouri que la mayoría de los vehículos
    motorizados (excluyendo motocicletas y remolques) exhiban las placas de matrícula?
  choices:
    A: Solo en la parte trasera
    B: Solo en la parte delantera
    C: Tanto en la parte delantera como en la trasera del vehículo
    D: En la ventana trasera
  answer: C
  explanation: 'La ley de Missouri exige que la mayoría de los vehículos motorizados
    exhiban dos placas de matrícula: una en la parte delantera y otra en la trasera.'
- id: 71
  category: driver_responsibility
  question: 'En Missouri, si lo detienen por sospecha de conducir bajo los efectos
    del alcohol o drogas (DWI) y se niega a realizarse una prueba química de aliento,
    sangre u orina, su licencia de conducir será revocada por:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Bajo la Ley de Consentimiento Implícito de Missouri, si se niega a
    una prueba química cuando un oficial lo solicita, su licencia se revoca automáticamente
    por un año.
- id: 72
  category: driver_responsibility
  question: ¿En Missouri, cuáles son los requisitos mínimos de seguro de responsabilidad
    civil por lesiones corporales para dos o más personas en un accidente?
  choices:
    A: $25,000
    B: $50,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: La ley de Missouri exige una cobertura mínima de responsabilidad civil
    de $25,000 por persona por lesiones corporales y $50,000 por accidente por lesiones
    corporales (25/50/25).
- id: 73
  category: driver_responsibility
  question: ¿Cuál es el cargo máximo por retraso en la titulación que se puede cobrar
    en Missouri por no titular un vehículo dentro del plazo requerido?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: El cargo por retraso en la titulación es de $25 por los primeros 30
    días de demora y aumenta $25 por cada 30 días subsiguientes, hasta un máximo de
    $200.
- id: 74
  category: driver_responsibility
  question: En Missouri, por lo general, se requiere una inspección de seguridad para
    la renovación del registro si el vehículo tiene más de ¿cuántos años de antigüedad?
  choices:
    A: 5 años
    B: 10 años
    C: 15 años
    D: 20 años
  answer: B
  explanation: Los vehículos con más de 10 años de antigüedad (o aquellos con más
    de 150,000 millas) requieren una inspección de seguridad para la renovación del
    registro en Missouri.
- id: 75
  category: driver_responsibility
  question: ¿En cuál de las siguientes ubicaciones de Missouri se requiere una inspección
    de emisiones para la mayoría de los vehículos motorizados?
  choices:
    A: Condado de Boone
    B: Condado de Greene
    C: Condado de St. Charles
    D: Condado de Cole
  answer: C
  explanation: Se requieren inspecciones de emisiones para los residentes de la ciudad
    de St. Louis y los condados de St. Louis, St. Charles, Jefferson y Franklin.
- id: 76
  category: driver_responsibility
  question: ¿Cuántos puntos se agregan a un historial de conducción de Missouri por
    una condena de 'Operar un vehículo motorizado sin mantener la responsabilidad
    financiera' (primera infracción)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: Una condena por no mantener el seguro (responsabilidad financiera)
    resulta en la adición de 4 puntos a su historial de conducción de Missouri.
- id: 77
  category: driver_responsibility
  question: Según la ley de Missouri, ¿dónde deben exhibirse las placas de matrícula
    en un vehículo de pasajeros típico?
  choices:
    A: Solo en el parachoques trasero
    B: Solo en el parachoques delantero
    C: Tanto en el parachoques delantero como en el trasero
    D: En el parachoques trasero y en el interior del parabrisas delantero
  answer: C
  explanation: La ley de Missouri exige que la mayoría de los vehículos motorizados
    (excepto las motocicletas y ciertos vehículos comerciales) exhiban placas de matrícula
    tanto en la parte delantera como en la trasera.
- id: 78
  category: driver_responsibility
  question: 'Si un conductor de Missouri es condenado por una primera infracción por
    no mantener el seguro, su privilegio de conducir será suspendido hasta que pague
    una tarifa de reinstalación de:'
  choices:
    A: $20
    B: $50
    C: $150
    D: $500
  answer: A
  explanation: Para una primera suspensión por falta de seguro, la licencia del conductor
    se suspende y la tarifa de reinstalación es de $20.
- id: 79
  category: driver_responsibility
  question: Después de una suspensión de licencia por una infracción de seguro, ¿por
    cuánto tiempo debe un conductor de Missouri presentar y mantener una prueba de
    responsabilidad financiera (SR-22)?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: B
  explanation: Missouri exige que los conductores mantengan una presentación de SR-22
    durante dos años a partir de la fecha de la suspensión por infracciones relacionadas
    con el seguro.
- id: 80
  category: driver_responsibility
  question: Al vender un vehículo en Missouri, ¿la inspección de seguridad proporcionada
    al comprador no debe tener más de cuántos días de antigüedad?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Un certificado de inspección de seguridad debe tener una fecha dentro
    de los 60 días posteriores a la fecha de venta para ser válido para el registro
    del comprador.
- id: 81
  category: driver_responsibility
  question: 'Bajo la Ley de Consentimiento Implícito (Implied Consent Law) de Missouri,
    si se niega a someterse a una prueba química para determinar su nivel de alcohol
    en sangre (BAC), su licencia de conducir será revocada por:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Bajo la Ley de Consentimiento Implícito, si se niega a una prueba química,
    el Departamento de Ingresos revocará su privilegio de conducir por un año (Revocación
    Química).
- id: 82
  category: driver_responsibility
  question: Si se ve involucrado en un choque en Missouri, ¿cuál de la siguiente información
    está obligado por ley a intercambiar con las otras partes?
  choices:
    A: Número de licencia de conducir y número de seguro social
    B: Nombre de la compañía de seguros y número de póliza
    C: Número de título del vehículo y fecha de registro
    D: Información de empleo y dirección particular
  answer: B
  explanation: La ley de Missouri exige que los conductores involucrados en un accidente
    intercambien nombres, direcciones, números de licencia de conducir, registro del
    vehículo e información del seguro.
- id: 83
  category: driver_responsibility
  question: Un conductor de Missouri que tiene la culpa en un accidente mientras no
    tiene seguro puede tener su licencia suspendida por ¿cuánto tiempo si no paga
    los daños?
  choices:
    A: 6 meses
    B: 1 año
    C: 4 años
    D: Indefinidamente hasta que se cumpla con la sentencia
  answer: D
  explanation: Bajo la Ley de Responsabilidad de Seguridad (Safety Responsibility
    Law), si un conductor sin seguro tiene la culpa y no paga los daños, su licencia
    puede ser suspendida hasta que liquide la reclamación o cumpla con la sentencia.
- id: 84
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad estándar para las carreteras de Missouri
    identificadas con letras, como la Ruta A o la Ruta BB, a menos que se indique
    lo contrario?
  choices:
    A: 45 mph
    B: 55 mph
    C: 60 mph
    D: 65 mph
  answer: B
  explanation: En Missouri, el límite de velocidad para las carreteras con letras
    suele ser de 55 mph, a menos que las señales indiquen un límite diferente.
- id: 85
  category: safe_driving_rules
  question: Según la ley de Missouri, ¿a cuántos pies de un hidrante de incendios
    no debe estacionar su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Missouri prohíbe estacionar a menos de 15 pies de un hidrante
    de incendios.
- id: 86
  category: safe_driving_rules
  question: Al estacionar su vehículo cerca de una señal de alto (stop sign), ¿cuál
    es la distancia mínima que debe mantener con respecto a la señal?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Las regulaciones de Missouri establecen que no se puede estacionar
    a menos de 30 pies de cualquier señal intermitente, señal de alto o señal de control
    de tráfico ubicada al costado de una calzada.
- id: 87
  category: safe_driving_rules
  question: 'La ley de Missouri exige que los conductores enciendan sus faros siempre
    que utilicen los limpiaparabrisas. Esto se conoce comúnmente como la:'
  choices:
    A: Regla de Visibilidad
    B: Ley de "Limpiaparabrisas encendidos, luces encendidas"
    C: Acta de Días Lluviosos
    D: Mandato de Seguridad Primero
  answer: B
  explanation: La ley de Missouri exige que los faros se enciendan siempre que se
    utilicen los limpiaparabrisas debido a la lluvia, la nieve u otras precipitaciones.
- id: 88
  category: safe_driving_rules
  question: 'En Missouri, se le permite rebasar a un vehículo por la derecha solo
    cuando:'
  choices:
    A: El vehículo de adelante está girando a la izquierda y hay espacio para pasar
    B: Se encuentra en una carretera de dos carriles con un acotamiento ancho
    C: El vehículo de adelante conduce demasiado lento en el carril izquierdo
    D: Nunca se permite rebasar por la derecha en Missouri
  answer: A
  explanation: Puede rebasar por la derecha en Missouri cuando el vehículo de adelante
    está girando a la izquierda, o en una calle/autopista con dos o más carriles de
    tráfico que se mueven en la misma dirección.
- id: 89
  category: safe_driving_rules
  question: Si viaja por una autopista dividida por una barrera física o un camellón,
    ¿debe detenerse ante un autobús escolar que tiene sus luces rojas intermitentes
    en la dirección opuesta?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar
    B: No, no es necesario detenerse si hay un camellón o barrera
    C: Sí, pero solo si hay niños cruzando
    D: No, pero debe reducir la velocidad a 15 mph
  answer: B
  explanation: En Missouri, si la autopista está dividida por un camellón o una barrera
    física, no es necesario detenerse si viaja en la dirección opuesta al autobús
    escolar.
- id: 90
  category: safe_driving_rules
  question: 'Al usar señales manuales para indicar sus intenciones, extender el brazo
    hacia abajo por la ventana significa:'
  choices:
    A: Un giro a la derecha
    B: Un giro a la izquierda
    C: Reducir la velocidad o detenerse
    D: Peligro adelante
  answer: C
  explanation: La señal manual para reducir la velocidad o detenerse consiste en extender
    el brazo hacia abajo con la palma de la mano hacia atrás.
- id: 91
  category: safe_driving_rules
  question: En Missouri, ¿cuál es la multa adicional mínima por una segunda o subsiguiente
    infracción por exceso de velocidad en una zona de construcción o de trabajo designada?
  choices:
    A: $100
    B: $250
    C: $300
    D: $500
  answer: C
  explanation: La ley de Missouri impone una multa mínima de $250 por la primera infracción
    en una zona de trabajo y una multa mínima de $300 por infracciones subsiguientes,
    además de los costos judiciales y multas regulares.
- id: 92
  category: safe_driving_rules
  question: Según la ley de Missouri, ¿cuándo se permite girar a la izquierda con
    luz roja?
  choices:
    A: Nunca
    B: De una calle de un solo sentido a otra calle de un solo sentido
    C: De una calle de doble sentido a una calle de un solo sentido
    D: En cualquier momento que no haya tráfico en sentido contrario
  answer: B
  explanation: La ley de Missouri permite girar a la izquierda en rojo solo cuando
    se gira desde una calle de un solo sentido hacia otra calle de un solo sentido,
    después de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 93
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada para un vehículo de pasajeros
    bajo condiciones normales de conducción en Missouri?
  choices:
    A: El largo de un automóvil
    B: Dos segundos
    C: Tres segundos
    D: Four segundos
  answer: C
  explanation: La Guía del Conductor de Missouri recomienda una distancia de seguimiento
    de tres segundos para permitir suficiente tiempo para reaccionar ante los peligros.
- id: 94
  category: safe_driving_rules
  question: 'Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    aproxima por detrás, la ley de "Hacerse a un lado" (Move Over) de Missouri le
    exige:'
  choices:
    A: Aumentar la velocidad para salir del camino
    B: Detenerse inmediatamente en su carril
    C: Detenerse en el borde derecho de la carretera
    D: Moverse al carril izquierdo y reducir la velocidad
  answer: C
  explanation: La ley de Missouri exige que los conductores se detengan lo más a la
    derecha posible y permanezcan detenidos hasta que el vehículo de emergencia haya
    pasado.
- id: 95
  category: safe_driving_rules
  question: 'Al estacionar su vehículo cuesta arriba en una calle de doble sentido
    con acera (bordillo), debe girar sus ruedas delanteras:'
  choices:
    A: Hacia la acera
    B: Lejos de la acera
    C: Paralelas a la acera
    D: Hacia la derecha
  answer: B
  explanation: Al estacionar cuesta arriba con acera, gire las ruedas en dirección
    contraria a la acera para que, si el vehículo rueda, la parte trasera de la llanta
    delantera golpee la acera y detenga el automóvil.
- id: 96
  category: safe_driving_rules
  question: ¿A qué distancia debe bajar las luces altas (cambiar a luces bajas) cuando
    sigue a otro vehículo por detrás en Missouri?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Missouri exige que baje las luces altas cuando se encuentre
    a menos de 300 pies del vehículo que está siguiendo.
- id: 97
  category: safe_driving_rules
  question: En Missouri, ¿con cuántos pies de antelación, como mínimo, debe indicar
    su intención de girar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Missouri exige que los conductores pongan la señal al menos
    100 pies antes de girar o cambiar de carril.
- id: 98
  category: safe_driving_rules
  question: Al estacionar su vehículo en paralelo a una acera en Missouri, ¿a cuántas
    pulgadas de la acera deben estar sus ruedas?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: La ley de Missouri exige que, al estacionar en paralelo, las ruedas
    del vehículo deben estar a no más de 18 pulgadas de la acera.
- id: 99
  category: safe_driving_rules
  question: Según la ley de Missouri, ¿cuándo NO es obligatorio detenerse ante un
    autobús escolar que tiene sus luces rojas intermitentes encendidas y el brazo
    de parada extendido?
  choices:
    A: Cuando el autobús está en el lado opuesto de una carretera dividida con una
      mediana o barrera
    B: Cuando se encuentra en una zona residencial
    C: Cuando el autobús está detenido en un cruce de ferrocarril
    D: Cuando viaja en la misma dirección en una carretera de cuatro carriles
  answer: A
  explanation: En Missouri, no tiene que detenerse ante un autobús escolar si viaja
    en la dirección opuesta en una carretera dividida por una mediana o una barrera
    física.
- id: 100
  category: safe_driving_rules
  question: En Missouri, ¿es ilegal estacionar su vehículo a menos de cuántos pies
    de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: De acuerdo con las regulaciones de estacionamiento de Missouri, no
    puede estacionar a menos de 15 pies de un hidrante de incendios.
- id: 101
  category: safe_driving_rules
  question: ¿En Missouri, a cuántos pies de una intersección, cruce de ferrocarril,
    puente, viaducto o túnel no se permite rebasar a otro vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: La ley de Missouri prohíbe rebasar al acercarse a menos de 100 pies
    de cualquier intersección, cruce ferroviario a nivel, puente, viaducto o túnel.
- id: 102
  category: safe_driving_rules
  question: ¿Qué exige la ley 'Move Over' (Hacerse a un lado) de Missouri que hagan
    los conductores al acercarse a un vehículo de emergencia estacionado con luces
    intermitentes?
  choices:
    A: Detenerse por completo hasta que el vehículo se retire
    B: Aumentar la velocidad para rebasar el vehículo rápidamente
    C: Proceder con precaución y, si es seguro, cambiarse a un carril que no esté
      adyacente al vehículo
    D: Tocar la bocina para alertar a los trabajadores de emergencia
  answer: C
  explanation: La ley 'Move Over' de Missouri exige que los conductores procedan con
    precaución y, si se encuentran en una carretera de varios carriles, se muevan
    a un carril que no esté adyacente al vehículo de emergencia estacionado si es
    seguro hacerlo.
- id: 103
  category: safe_driving_rules
  question: En una parada de cuatro vías en Missouri, si dos vehículos llegan al mismo
    tiempo, ¿qué conductor tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que viaja a mayor velocidad
    D: El conductor que gira a la izquierda
  answer: B
  explanation: En Missouri, si dos vehículos llegan a una intersección al mismo tiempo,
    el conductor de la izquierda debe ceder el paso al conductor de la derecha.
- id: 104
  category: safe_driving_rules
  question: 'En Missouri, el hidroplaneo (donde los neumáticos pierden contacto con
    la carretera en una superficie mojada) puede comenzar a velocidades tan bajas
    como:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: La Guía del Conductor de Missouri establece que el hidroplaneo puede
    comenzar a velocidades tan bajas como 35 mph, y a 55 mph, los neumáticos pueden
    perder todo contacto con la carretera.
- id: 105
  category: safe_driving_rules
  question: 'Para mantener una distancia de seguimiento segura en Missouri bajo condiciones
    normales, debe utilizar la:'
  choices:
    A: Regla de un segundo
    B: Regla de dos segundos
    C: Regla de tres segundos
    D: Regla de cuatro segundos
  answer: C
  explanation: La Guía del Conductor de Missouri recomienda una distancia de seguimiento
    de tres segundos para la mayoría de las situaciones de conducción para permitir
    suficiente tiempo para reaccionar ante los peligros.
- id: 106
  category: safe_driving_rules
  question: 'En Missouri, un conductor puede girar a la izquierda con luz roja ÚNICAMENTE
    cuando:'
  choices:
    A: Gira de una calle de un solo sentido a otra calle de un solo sentido
    B: No hay tráfico en sentido contrario
    C: Gira de una calle de doble sentido a una calle de un solo sentido
    D: Es después de la medianoche
  answer: A
  explanation: La ley de Missouri permite girar a la izquierda en rojo solo cuando
    se gira de una calle de un solo sentido a otra calle de un solo sentido, después
    de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 107
  category: defensive_driving
  question: Según la Guía del Conductor de Missouri, ¿cuál es la distancia de seguimiento
    recomendada para un vehículo que viaja en condiciones ideales?
  choices:
    A: La longitud de un automóvil por cada 10 mph
    B: Dos segundos
    C: Tres segundos
    D: Cuatro segundos
  answer: C
  explanation: La Guía del Conductor de Missouri recomienda usar la 'regla de los
    tres segundos' para mantener una distancia de seguimiento segura en condiciones
    de conducción ideales.
- id: 108
  category: defensive_driving
  question: ¿En Missouri, cuándo debe encender sus faros delanteros según la ley estatal
    con respecto a las condiciones climáticas?
  choices:
    A: Solo cuando la visibilidad es inferior a 100 pies
    B: Siempre que los limpiaparabrisas estén en uso
    C: Solo durante las horas nocturnas
    D: Solo cuando se conduce por la interestatal durante la lluvia
  answer: B
  explanation: La ley de Missouri (RSMo 307.020) exige que los conductores enciendan
    sus faros delanteros siempre que los limpiaparabrisas estén en uso continuo debido
    a las condiciones climáticas.
- id: 109
  category: defensive_driving
  question: Al conducir de noche en Missouri, ¿a cuántos pies de un vehículo que viene
    en sentido contrario debe bajar las luces altas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: En Missouri, se requiere bajar las luces altas cuando se encuentre
    a menos de 500 pies de un vehículo que se aproxima.
- id: 110
  category: defensive_driving
  question: Para evitar el hidroplaneo en carreteras mojadas de Missouri, ¿a qué velocidad
    debería empezar a ser extra precavido, ya que sus neumáticos podrían perder contacto
    con la carretera?
  choices:
    A: 25 mph
    B: 35 mph
    C: 50 mph
    D: 70 mph
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph,
    donde los neumáticos pueden comenzar a deslizarse sobre una película de agua.
- id: 111
  category: defensive_driving
  question: Al escanear el camino adelante para practicar la conducción defensiva
    en Missouri, ¿qué tan lejos debe mirar en el tráfico de la ciudad?
  choices:
    A: Una cuadra (aproximadamente de 10 a 12 segundos)
    B: La longitud de dos vehículos
    C: 5 segundos
    D: 30 segundos
  answer: A
  explanation: La Guía del Conductor de Missouri sugiere mirar aproximadamente una
    cuadra adelante (de 10 a 12 segundos) al conducir en la ciudad para anticipar
    posibles peligros.
- id: 112
  category: defensive_driving
  question: Si conduce con niebla densa en Missouri, ¿qué configuración de luces debe
    usar para garantizar la mejor visibilidad?
  choices:
    A: Luces altas (High-beam)
    B: Luces bajas (Low-beam)
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia
  answer: B
  explanation: En condiciones de niebla, se deben usar las luces bajas porque las
    luces altas se reflejan en la humedad del aire, lo que dificulta la visión.
- id: 113
  category: defensive_driving
  question: En Missouri, ¿cuál es la multa adicional mínima por exceso de velocidad
    en una zona de construcción o mantenimiento señalizada cuando hay trabajadores
    presentes?
  choices:
    A: Sin multa adicional
    B: $50
    C: $150
    D: $250
  answer: D
  explanation: Según la ley de Missouri (RSMo 304.582), una persona condenada por
    una segunda o subsiguiente infracción de movimiento en una zona de construcción,
    o una primera infracción por exceso de velocidad donde hay trabajadores presentes,
    enfrenta una multa mínima de $250 además de las sanciones estándar.
- id: 114
  category: defensive_driving
  question: Al rebasar a un ciclista en una carretera de Missouri, ¿cuánto espacio
    debe dejar entre su vehículo y la bicicleta?
  choices:
    A: 1 pie
    B: Una distancia segura (normalmente al menos 3 pies)
    C: 6 pulgadas
    D: No se requiere una distancia específica
  answer: B
  explanation: La ley de Missouri exige que los automovilistas rebasen a los ciclistas
    a una distancia segura. Aunque el manual estatal enfatiza la precaución, 3 pies
    es el estándar de seguridad generalmente aceptado para la conducción defensiva.
- id: 115
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera resbaladiza de Missouri,
    ¿hacia qué lado debe girar el volante?
  choices:
    A: En la dirección opuesta al derrape
    B: En la dirección en la que está derrapando la parte trasera del vehículo
    C: Mantener el volante perfectamente recto
    D: Girar bruscamente hacia el acotamiento
  answer: B
  explanation: Para recuperarse de un derrape, debe soltar el freno y girar el volante
    en la dirección en la que se desliza la parte trasera del vehículo.
- id: 116
  category: defensive_driving
  question: Al ingresar a una autopista desde un carril de aceleración en Missouri,
    ¿cuál es el procedimiento correcto de conducción defensiva?
  choices:
    A: Detenerse al final de la rampa y esperar un espacio
    B: Ceder el paso al tráfico que ya está en la autopista y ajustar su velocidad
      para que coincida con el flujo
    C: Forzar su entrada al tráfico; ellos deben dejarlo pasar
    D: Conducir por el acotamiento hasta encontrar una apertura
  answer: B
  explanation: Los conductores que ingresan a una autopista deben ceder el paso al
    tráfico que ya circula por ella y utilizar el carril de aceleración para alcanzar
    una velocidad que permita una incorporación segura.
- id: 117
  category: defensive_driving
  question: Según la Guía del Conductor de Missouri, ¿con qué frecuencia debe revisar
    sus espejos para mantener la conciencia situacional?
  choices:
    A: Cada 2 a 5 segundos
    B: Cada 10 a 15 segundos
    C: Solo cuando esté a punto de cambiar de carril
    D: Una vez cada minuto
  answer: A
  explanation: La conducción defensiva en Missouri implica revisar los espejos retrovisores
    y laterales cada 2 a 5 segundos para estar al tanto del tráfico circundante.
- id: 118
  category: defensive_driving
  question: Al acercarse a una intersección, ¿en qué orden debe escanear el tráfico
    transversal?
  choices:
    A: Derecha, luego izquierda
    B: Izquierda, luego derecha, luego izquierda otra vez
    C: Solo hacia adelante
    D: Derecha, luego izquierda, luego derecha otra vez
  answer: B
  explanation: La Guía del Conductor de Missouri recomienda mirar a la izquierda,
    luego a la derecha y luego a la izquierda nuevamente antes de entrar en una intersección,
    ya que el tráfico que viene de la izquierda está más cerca de usted.
- id: 119
  category: defensive_driving
  question: 'En Missouri, si sigue a un vehículo y la carretera se vuelve resbaladiza
    debido a la lluvia o la nieve, debe aumentar su distancia de seguimiento a al
    menos:'
  choices:
    A: 4 a 6 segundos
    B: 2 segundos
    C: 100 pies
    D: 10 segundos
  answer: A
  explanation: Cuando las condiciones de la carretera son malas (lluvia, nieve, hielo),
    la Guía del Conductor de Missouri recomienda aumentar la distancia de seguimiento
    a al menos 4 a 6 segundos para permitir más tiempo de frenado.
- id: 120
  category: defensive_driving
  question: Para evitar frenazos de último minuto o la necesidad de girar repentinamente,
    la Guía del Conductor de Missouri sugiere que debe escanear el camino con qué
    anticipación?
  choices:
    A: 5 a 8 segundos
    B: 10 a 12 segundos
    C: 20 a 30 segundos
    D: Solo el vehículo que tiene inmediatamente delante
  answer: B
  explanation: Escanear de 10 a 12 segundos adelante (aproximadamente una cuadra en
    la ciudad o un cuarto de milla en la autopista) le permite ver los peligros antes
    de que se conviertan en emergencias.
- id: 121
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (hidroplaneo o "hydroplaning",
    donde los neumáticos pierden contacto con la carretera y se deslizan sobre una
    fina capa de agua) en las condiciones climáticas de Missouri?
  choices:
    A: Tan baja como 35 mph
    B: Solo por encima de 55 mph
    C: Exactamente 45 mph
    D: Solo durante lluvia helada
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    En una lluvia intensa, sus neumáticos pueden perder todo contacto con la carretera
    a 55 mph.
- id: 122
  category: defensive_driving
  question: Al seguir a otro vehículo de noche en Missouri, ¿a cuántos pies del vehículo
    que va delante debe atenuar sus luces altas?
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: B
  explanation: La ley de Missouri establece que debe cambiar a luces bajas cuando
    siga a otro vehículo a menos de 300 pies para no cegar al conductor de adelante
    a través de sus espejos.
- id: 123
  category: defensive_driving
  question: Si conduce por una autopista de Missouri con al menos dos carriles en
    su dirección y ve un vehículo de emergencia estacionado con luces intermitentes
    en el arcén (acotamiento), ¿qué le exige hacer la ley de "Ceder el Paso" (Move
    Over)?
  choices:
    A: Detenerse inmediatamente en la calzada
    B: Continuar al límite de velocidad pero tocar la bocina
    C: Moverse al carril más alejado del vehículo de emergencia si es seguro hacerlo
    D: Acelerar para pasar el área rápidamente
  answer: C
  explanation: La ley "Move Over" de Missouri exige que los conductores se muevan
    a un carril que no sea adyacente al vehículo de emergencia estacionado. Si cambiar
    de carril no es seguro, el conductor debe reducir la velocidad y proceder con
    precaución.
- id: 124
  category: defensive_driving
  question: Al conducir con niebla densa en Missouri, ¿qué ajuste de luces debe utilizar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: No se requieren luces durante el día
  answer: B
  explanation: En condiciones de niebla, debe usar las luces bajas. Las luces altas
    se reflejan en la niebla y crean un resplandor, lo que dificulta la visión.
- id: 125
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera resbaladiza de Missouri,
    ¿cuál es la respuesta correcta de conducción defensiva?
  choices:
    A: Frenar bruscamente de inmediato
    B: Girar el volante en la dirección en la que se desliza la parte trasera del
      automóvil
    C: Girar el volante en la dirección opuesta al derrape
    D: Poner el automóvil en punto muerto (neutral) y apagar el motor
  answer: B
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar el volante en la dirección en la que se desliza la parte trasera del vehículo.
    No frene bruscamente.
- id: 126
  category: defensive_driving
  question: Según la Guía del Conductor de Missouri, ¿cuándo está más resbaladiza
    la carretera durante una tormenta de lluvia?
  choices:
    A: Después de que ha estado lloviendo durante varias horas
    B: Justo cuando comienza a llover
    C: Solo cuando la temperatura es bajo cero
    D: Cuando la lluvia se detiene y sale el sol
  answer: B
  explanation: Las carreteras están más resbaladizas justo cuando comienza a llover
    porque el agua se mezcla con el aceite y la grasa de la superficie de la carretera
    que aún no se han lavado.
- id: 127
  category: defensive_driving
  question: Al seguir a un camión grande o un camión con remolque en una autopista
    de Missouri, ¿por qué debería aumentar su distancia de seguimiento a más de tres
    segundos?
  choices:
    A: Los camiones tienen mejor visibilidad que los automóviles
    B: Para permitir que el conductor del camión lo vea en sus espejos laterales
    C: Porque los camiones aceleran más rápido que los automóviles
    D: Es obligatorio por ley para todos los vehículos de más de 4,000 lbs
  answer: B
  explanation: Si lo sigue demasiado de cerca, se encuentra en la "Zona Ciega" (No-Zone)
    del camión. Aumentar su distancia asegura que el conductor pueda verlo en sus
    espejos laterales.
- id: 128
  category: defensive_driving
  question: Si debe detenerse rápidamente en un vehículo equipado con frenos antibloqueo
    (ABS) en una carretera mojada de Missouri, ¿cómo debe aplicar los frenos?
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y constante sin bombear
    C: Tocar ligeramente los frenos
    D: Tirar del freno de emergencia
  answer: B
  explanation: Con el sistema ABS, debe aplicar una presión firme y constante. Bombear
    los frenos en realidad desactiva la efectividad del sistema ABS.
- id: 129
  category: defensive_driving
  question: En Missouri, al acercarse a un cruce de ferrocarril con luces intermitentes,
    ¿a cuántos pies del riel más cercano debe detener su vehículo?
  choices:
    A: De 5 a 10 pies
    B: De 15 a 50 pies
    C: De 50 a 100 pies
    D: Exactamente 25 pies
  answer: B
  explanation: La ley de Missouri exige que los conductores se detengan entre 15 y
    50 pies del riel más cercano cuando las señales indiquen que se aproxima un tren.
- id: 130
  category: defensive_driving
  question: Al entrar en una rotonda en Missouri, ¿cuál de las siguientes es una práctica
    correcta de conducción defensiva?
  choices:
    A: Ceder siempre el paso al tráfico que entra por la derecha
    B: Ceder el paso al tráfico que ya circula por la rotonda
    C: Detenerse antes de entrar incluso si no hay tráfico
    D: Cambiar de carril mientras está dentro de la rotonda para salir rápidamente
  answer: B
  explanation: Las reglas de Missouri para las rotondas exigen que el tráfico que
    entra ceda el paso a los vehículos que ya están en el círculo. Nunca debe cambiar
    de carril mientras esté dentro de la rotonda.
- id: 131
  category: alcohol_drugs_health
  question: Bajo la ley de 'Consentimiento Implícito' de Missouri, si usted se niega
    a someterse a una prueba química para determinar su BAC, ¿cuál es la sanción inmediata?
  choices:
    A: Su licencia será suspendida por 30 días.
    B: Su licencia será revocada por un año.
    C: Se le multará con $500 pero conservará su licencia.
    D: Su licencia será suspendida por 90 días.
  answer: B
  explanation: La ley de Consentimiento Implícito de Missouri establece que, al conducir
    por las carreteras de Missouri, usted ya ha dado su consentimiento para una prueba
    química. Si se niega, el Departamento de Ingresos revocará su privilegio de conducir
    por un año.
- id: 132
  category: alcohol_drugs_health
  question: ¿Cuántos puntos se asignan a su historial de conducción de Missouri por
    una primera condena por Conducir en Estado de Ebriedad (DWI)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: Una primera condena por DWI en Missouri resulta en la adición de 8
    puntos a su historial de conducción, lo que provoca la suspensión de los privilegios
    de conducir.
- id: 133
  category: alcohol_drugs_health
  question: ¿Qué programa debe completar un conductor de Missouri para restablecer
    su licencia después de una suspensión o revocación relacionada con el alcohol?
  choices:
    A: El Curso de Conducción Defensiva (DDC)
    B: El Programa para Infractores de Tránsito con Conciencia de Sustancias (SATOP)
    C: El Proyecto de Acción de Seguridad contra el Alcohol de Missouri (MASAP)
    D: El Programa de Mejora del Conductor (DIP)
  answer: B
  explanation: La ley de Missouri exige que los conductores con infracciones relacionadas
    con el alcohol completen el Programa para Infractores de Tránsito con Conciencia
    de Sustancias (SATOP) antes de que se pueda restablecer su licencia.
- id: 134
  category: alcohol_drugs_health
  question: 'Bajo la ley de ''Abuso y Pérdida'' de Missouri, por una primera infracción
    que involucre la posesión o el uso de alcohol o drogas siendo menor de 21 años,
    su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: La ley de 'Abuso y Pérdida' exige una suspensión de 90 días por una
    primera infracción que involucre alcohol o drogas por parte de alguien menor de
    21 años, incluso si la infracción no involucró la conducción.
- id: 135
  category: alcohol_drugs_health
  question: 'Para restablecer una licencia de conducir de Missouri después de una
    suspensión relacionada con el alcohol, debe presentar una prueba de responsabilidad
    financiera durante dos años. Esto se conoce comúnmente como:'
  choices:
    A: Una presentación de SR-22
    B: Una fianza de responsabilidad civil
    C: Una póliza de cobertura amplia
    D: Una presentación de FR-44
  answer: A
  explanation: Missouri requiere que se mantenga una presentación de seguro SR-22
    durante dos años después de una suspensión o revocación relacionada con el alcohol.
- id: 136
  category: alcohol_drugs_health
  question: 'En Missouri, se considera que una persona que opera un vehículo motorizado
    comercial está conduciendo bajo la influencia si su BAC es igual o superior a:'
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.01%
  answer: B
  explanation: Para los conductores comerciales en Missouri, el límite legal de BAC
    es más estricto, establecido en 0.04%.
- id: 137
  category: alcohol_drugs_health
  question: 'Si es condenado por una segunda infracción de DWI en Missouri dentro
    de un periodo de cinco años, su licencia será revocada por:'
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: Permanentemente
  answer: C
  explanation: Una segunda condena por DWI dentro de un periodo de cinco años resulta
    en una revocación de los privilegios de conducir por 5 años.
- id: 138
  category: alcohol_drugs_health
  question: En Missouri, si es menor de 21 años y su BAC se mide en .02% o más, su
    licencia será suspendida administrativamente por cuántos días en una primera infracción?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Bajo la ley de Tolerancia Cero de Missouri, un conductor menor de 21
    años con un BAC de .02% o superior enfrentará una suspensión administrativa de
    90 días por una primera infracción.
- id: 139
  category: alcohol_drugs_health
  question: La ley de Missouri exige la instalación de un Dispositivo de Interbloqueo
    de Encendido (IID) en el vehículo de cualquier conductor condenado por una segunda
    o posterior infracción relacionada con el alcohol. ¿Por cuánto tiempo debe permanecer
    instalado?
  choices:
    A: Al menos 3 meses
    B: Al menos 6 meses
    C: Al menos 12 meses
    D: Durante toda la vida del conductor
  answer: C
  explanation: Para una segunda infracción o posteriores, Missouri requiere un IID
    durante al menos 12 meses después de que se restablezca la licencia.
- id: 140
  category: alcohol_drugs_health
  question: 'Si está tomando un medicamento recetado y este afecta su capacidad de
    conducir, la ley de Missouri establece que:'
  choices:
    A: No puede ser acusado de DWI porque el medicamento era legal.
    B: Puede ser acusado de DWI al igual que si estuviera bajo la influencia del alcohol.
    C: Solo puede ser acusado si también bebió alcohol.
    D: Solo recibirá una advertencia.
  answer: B
  explanation: En Missouri, conducir bajo la influencia de cualquier droga (legal
    o ilegal) que afecte su capacidad para conducir de manera segura es motivo para
    un cargo de DWI.
- id: 141
  category: alcohol_drugs_health
  question: 'En Missouri, el Departamento de Ingresos (Department of Revenue) toma
    una acción ''administrativa'' por alcohol contra su licencia basándose en:'
  choices:
    A: Únicamente una condena judicial
    B: El arresto y los resultados de una prueba química (o la negativa a realizarla)
    C: La recomendación de un médico
    D: La cantidad de puntos en su registro por exceso de velocidad
  answer: B
  explanation: Las acciones administrativas son independientes de los casos en los
    tribunales penales y se basan en el arresto y los resultados de la prueba química
    (o la negativa) informados por el oficial.
- id: 142
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es una posible sanción por una tercera condena
    por DWI (conducir en estado de ebriedad) en el estado de Missouri?
  choices:
    A: Una denegación de la licencia por 10 años
    B: Una denegación de la licencia por 1 año
    C: Una multa de $100
    D: Una suspensión de 30 días
  answer: A
  explanation: Una tercera condena por DWI en Missouri (estatus de 'infractor persistente')
    resulta en una denegación de la licencia por 10 años.
- id: 143
  category: alcohol_drugs_health
  question: Si usted es un conductor de Missouri y se ve involucrado en un accidente
    teniendo un BAC (concentración de alcohol en sangre) de .15% o más, ¿cuál es un
    requisito obligatorio para su primera infracción?
  choices:
    A: Revocación permanente de la licencia
    B: Instalación de un dispositivo de bloqueo de encendido (IID)
    C: Una sentencia de cárcel obligatoria de 1 año
    D: Confiscación del vehículo
  answer: B
  explanation: Si el BAC de un conductor es de .15% o superior, la ley de Missouri
    exige la instalación de un dispositivo de bloqueo de encendido (IID) incluso para
    una primera infracción.
- id: 144
  category: alcohol_drugs_health
  question: 'Si un conductor de Missouri tiene una condición médica, como epilepsia
    o diabetes, que podría afectar su conducción, debe:'
  choices:
    A: Entregar su licencia de inmediato.
    B: Conducir únicamente durante las horas del día.
    C: Informar la condición a la Oficina de Licencias de Conducir (Driver License
      Bureau) para su evaluación.
    D: Llevar una nota del médico en todo momento mientras conduce.
  answer: C
  explanation: La ley de Missouri exige que los conductores informen al Departamento
    de Ingresos sobre cualquier condición física o mental que pueda impedirles operar
    un vehículo motorizado de manera segura.
- id: 145
  category: alcohol_drugs_health
  question: 'La ley de ''Consentimiento Implícito'' (Implied Consent) de Missouri
    significa que, al conducir por las carreteras de Missouri, usted ha aceptado:'
  choices:
    A: Mantener su vehículo asegurado en todo momento
    B: Someterse a una prueba química de su aliento, sangre u orina para determinar
      el contenido de alcohol o drogas
    C: Llevar siempre su licencia de conducir mientras opera un vehículo
    D: Ceder el paso a todos los vehículos de emergencia
  answer: B
  explanation: Bajo la ley de Consentimiento Implícito de Missouri, si usted conduce
    un vehículo motorizado, se considera que ha dado su consentimiento para una prueba
    química de su aliento, sangre u orina si un oficial sospecha que está conduciendo
    bajo los efectos del alcohol o drogas.
- id: 146
  category: alcohol_drugs_health
  question: 'Si se niega a realizarse una prueba química para determinar su BAC cuando
    lo solicite un oficial de la ley en Missouri, su licencia de conducir será revocada
    por:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Si se niega a realizarse una prueba química en Missouri (Revocación
    Química), su privilegio de conducir será revocado por un año, independientemente
    de si se le declara culpable en el tribunal.
- id: 147
  category: alcohol_drugs_health
  question: ¿Cuál es el nombre del programa obligatorio que los conductores de Missouri
    deben completar para restituir su licencia después de una infracción relacionada
    con el alcohol?
  choices:
    A: Panel de Impacto de MADD
    B: Programa de Concientización sobre Sustancias para Infractores de Tránsito (SATOP)
    C: Proyecto de Acción de Seguridad contra el Alcohol de Missouri (ASAP)
    D: Programa de Mejora del Conductor (DIP)
  answer: B
  explanation: La ley de Missouri exige que los conductores con contactos policiales
    relacionados con el alcohol completen el Programa de Concientización sobre Sustancias
    para Infractores de Tránsito (SATOP) antes de que se pueda restituir su licencia.
- id: 148
  category: alcohol_drugs_health
  question: 'Bajo la ley de ''Abuso y Pérdida'' (Abuse and Lose) de Missouri, su licencia
    será suspendida o revocada si es menor de 21 años y es sorprendido:'
  choices:
    A: Excediendo el límite de velocidad por más de 20 mph
    B: Poseyendo o usando cualquier droga ilegal
    C: Conduciendo sin el cinturón de seguridad
    D: No cediendo el paso a un peatón
  answer: B
  explanation: La ley 'Abuso y Pérdida' se aplica a cualquier persona menor de 21
    años que sea declarada culpable de posesión o uso de cualquier droga ilegal, o
    cualquier infracción relacionada con el alcohol.
- id: 149
  category: alcohol_drugs_health
  question: ¿Cuántos puntos se añaden a su registro de conducir de Missouri si es
    condenado por una primera infracción de DWI (conducir en estado de ebriedad)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: Una condena por conducir en estado de ebriedad (DWI) en Missouri resulta
    en la adición de 8 puntos a su registro de conducir, lo que conlleva a una suspensión
    automática.
- id: 150
  category: alcohol_drugs_health
  question: En Missouri, ¿cuál es el límite legal de BAC para un conductor que opera
    un Vehículo Motorizado Comercial (CMV)?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Los conductores comerciales en Missouri están sujetos a un estándar
    más estricto y se consideran legalmente intoxicados si su BAC es de 0.04% o superior
    mientras operan un CMV.
- id: 151
  category: alcohol_drugs_health
  question: 'Un "Arresto Administrativo por Alcohol" ocurre en Missouri si lo detienen
    y una prueba química muestra que su nivel de alcohol en sangre (BAC) es igual
    o superior a:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.15%
  answer: C
  explanation: Un Arresto Administrativo por Alcohol ocurre cuando un conductor es
    arrestado por causa probable de conducir mientras está intoxicado y una prueba
    química indica un BAC de 0.08% o más (o 0.02% para menores de edad).
- id: 152
  category: alcohol_drugs_health
  question: 'En Missouri, un Dispositivo de Bloqueo de Encendido (IID) es obligatorio
    para un conductor que:'
  choices:
    A: Es condenado por una primera infracción de exceso de velocidad
    B: Tiene más de un contacto con las autoridades relacionado con el alcohol
    C: Es menor de 18 años y recibe cualquier multa de tráfico
    D: No paga una multa de estacionamiento
  answer: B
  explanation: La ley de Missouri exige la instalación de un Dispositivo de Bloqueo
    de Encendido (IID) para cualquier conductor que tenga más de un contacto con las
    autoridades relacionado con el alcohol en su historial.
- id: 153
  category: alcohol_drugs_health
  question: 'Si un conductor de Missouri es condenado por una segunda infracción de
    Menor en Posesión (MIP), su privilegio de conducir será suspendido por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Mientras que una primera infracción de MIP resulta en una suspensión
    de 30 días, una segunda infracción de MIP en Missouri resulta en una suspensión
    de 90 días de los privilegios de conducir.
- id: 154
  category: alcohol_drugs_health
  question: ¿Qué es el "efecto sinérgico" de combinar alcohol con otras drogas al
    conducir?
  choices:
    A: Las drogas anulan el alcohol
    B: El alcohol hace que las drogas sean menos efectivas
    C: El efecto combinado es mucho mayor que la suma de las partes
    D: No hay un efecto medible en la capacidad de conducción
  answer: C
  explanation: Combinar alcohol con otras drogas (incluso medicamentos de venta libre)
    puede multiplicar los efectos de ambos, afectando gravemente la coordinación y
    el juicio del conductor más de lo que lo haría cualquiera de las sustancias por
    sí sola.
- id: 155
  category: alcohol_drugs_health
  question: ¿Cuánto dura la primera suspensión para un conductor de Missouri que es
    arrestado por una infracción administrativa por alcohol (BAC por encima del límite
    legal)?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Para una primera infracción administrativa por alcohol en Missouri,
    la licencia del conductor se suspende por 90 días.
- id: 156
  category: alcohol_drugs_health
  question: 'Si tiene una condición física o mental que pueda afectar su capacidad
    para conducir de manera segura, el Departamento de Ingresos de Missouri puede
    exigirle que:'
  choices:
    A: Entregue su licencia de inmediato
    B: Proporcione una Declaración del Médico para Evaluación Médica
    C: Solo conduzca durante las horas del día
    D: Siempre conduzca con un pasajero
  answer: B
  explanation: La ley de Missouri permite que el Departamento de Ingresos exija una
    evaluación médica de un médico si hay razones para creer que un conductor tiene
    una condición que podría afectar su seguridad al conducir.
- id: 157
  category: alcohol_drugs_health
  question: 'Bajo la ley de Tolerancia Cero de Missouri, si se descubre que un conductor
    menor de 21 años tiene un BAC de 0.02% o superior, su licencia será suspendida
    por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Bajo la ley de Tolerancia Cero, una primera suspensión administrativa
    para un menor con un BAC de 0.02% o más es de 90 días.
- id: 158
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resulta en 12 puntos inmediatos y
    la revocación de su privilegio de conducir en Missouri por un año?
  choices:
    A: Exceso de velocidad de más de 20 mph sobre el límite
    B: No ceder el paso
    C: Abandonar la escena de un accidente
    D: Seguir a otro vehículo demasiado cerca
  answer: C
  explanation: Abandonar la escena de un accidente (choque y fuga) es una infracción
    grave que resulta en 12 puntos y la revocación inmediata de los privilegios de
    conducir en Missouri.
- id: 159
  category: penalties_and_points
  question: Si su licencia de Missouri es suspendida o revocada, ¿por cuánto tiempo
    debe mantener generalmente una presentación de seguro SR-22 a partir de la fecha
    de la suspensión?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: B
  explanation: En Missouri, los conductores generalmente deben presentar y mantener
    un SR-22 (Prueba de Responsabilidad Financiera) durante dos años después de una
    suspensión o revocación.
- id: 160
  category: penalties_and_points
  question: Bajo la ley de "Abuso y Pérdida" (Abuse and Lose) de Missouri, su licencia
    puede ser suspendida por ¿cuál de las siguientes infracciones no relacionadas
    con la conducción si es menor de 21 años?
  choices:
    A: Posesión o uso de cualquier sustancia controlada
    B: Robo en tiendas
    C: Ausentismo escolar
    D: Vandalismo
  answer: A
  explanation: La ley "Abuso y Pérdida" se aplica a cualquier persona menor de 21
    años y resulta en la suspensión o revocación de la licencia por infracciones relacionadas
    con el alcohol o las drogas, incluyendo la posesión o el uso de sustancias controladas,
    incluso si no estaba operando un vehículo.
- id: 161
  category: penalties_and_points
  question: ¿Para los conductores de 21 años o más, cuál es el nivel de Contenido
    de Alcohol en la Sangre (BAC) en el que se considera legalmente intoxicado en
    Missouri?
  choices:
    A: 0.02% o superior
    B: 0.05% o superior
    C: 0.08% o superior
    D: 0.10% o superior
  answer: C
  explanation: En Missouri, el límite legal de intoxicación para conductores de 21
    años o más es un BAC de 0.08% o superior.
- id: 162
  category: penalties_and_points
  question: 'Si conduce durante un año completo sin recibir nuevos puntos en su historial
    de Missouri, el Departamento de Ingresos (Department of Revenue) reducirá sus
    puntos totales en:'
  choices:
    A: 1 punto
    B: Un cuarto (25%)
    C: Un tercio (33.3%)
    D: La mitad (50%)
  answer: C
  explanation: 'Missouri tiene un sistema de reducción de puntos: después de 1 año
    de conducción limpia, los puntos se reducen en un tercio; después de 2 años, se
    reducen a la mitad; y después de 3 años, se reducen a cero.'
- id: 163
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por una condena por no mantener la responsabilidad
    financiera (seguro) en Missouri?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: No mantener el seguro de responsabilidad civil para vehículos motorizados
    requerido en Missouri resulta en la adición de 4 puntos a su historial de conducción.
- id: 164
  category: penalties_and_points
  question: En Missouri, ¿a qué nivel de BAC o superior se le requiere a un infractor
    de DWI por primera vez instalar un Dispositivo de Bloqueo de Encendido (IID)?
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: Si bien los IID son comunes para infractores reincidentes, los infractores
    de DWI por primera vez en Missouri deben instalar un IID si su BAC era de 0.15%
    o superior al momento del arresto.
- id: 165
  category: penalties_and_points
  question: ¿Cuántos puntos resultan usualmente en Missouri por una condena por una
    infracción de tránsito de una ordenanza municipal (como pasarse una señal de alto
    dentro de los límites de la ciudad)?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: La mayoría de las infracciones de tránsito de ordenanzas municipales
    en Missouri resultan en la adición de 2 puntos al historial del conductor.
- id: 166
  category: penalties_and_points
  question: 'Si un conductor de Missouri pasa dos años consecutivos sin ninguna condena
    de tránsito, su total de puntos se reduce en:'
  choices:
    A: Un tercio (1/3)
    B: La mitad (1/2)
    C: 75%
    D: Se eliminan todos los puntos
  answer: B
  explanation: La ley de Missouri establece que después de dos años de conducción
    limpia, los puntos restantes en su historial se reducen a la mitad.
- id: 167
  category: penalties_and_points
  question: ¿Cuántos años de conducción limpia (sin nuevas condenas) se requieren
    en Missouri para reducir los puntos de su historial de conducción a cero?
  choices:
    A: 2 años
    B: 3 años
    C: 5 años
    D: 10 años
  answer: B
  explanation: En Missouri, si conduce durante tres años consecutivos sin ninguna
    nueva condena de tránsito, su total de puntos se reducirá a cero.
- id: 168
  category: penalties_and_points
  question: En Missouri, ¿cuántos puntos se añaden a su historial por abandonar la
    escena de un accidente en violación de la ley estatal?
  choices:
    A: 4 puntos
    B: 8 puntos
    C: 12 puntos
    D: 15 puntos
  answer: C
  explanation: Abandonar la escena de un accidente es una infracción grave en Missouri
    y conlleva una penalización de 12 puntos.
- id: 169
  category: penalties_and_points
  question: Para una tercera suspensión o subsiguiente debido a la acumulación de
    puntos en Missouri, ¿por cuánto tiempo se suspende la licencia de conducir?
  choices:
    A: 60 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: B
  explanation: Una tercera suspensión o subsiguiente por acumular 8 puntos en 18 meses
    en Missouri dura 90 días.
- id: 170
  category: penalties_and_points
  question: Bajo la ley 'Abuse and Lose' (Abuso y Pérdida) de Missouri, ¿por cuántos
    días se le suspenderá el privilegio de conducir a una persona menor de 21 años
    por una primera infracción de posesión o consumo de alcohol?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: La ley 'Abuse and Lose' en Missouri requiere una suspensión de 90 días
    por una primera infracción que involucre alcohol o drogas por parte de alguien
    menor de 21 años.
- id: 171
  category: sharing_the_road
  question: Según la ley de "Hacerse a un lado" (Move Over) de Missouri, ¿qué debe
    hacer al acercarse a un vehículo de emergencia estacionado con luces intermitentes
    en una carretera de cuatro o más carriles?
  choices:
    A: Detenerse por completo hasta que el vehículo de emergencia se retire
    B: Continuar al límite de velocidad pero tocar la bocina
    C: Proceder con precaución y, si es seguro, cambiarse a un carril que no sea adyacente
      al vehículo estacionado
    D: Mantener su velocidad y posición en el carril para evitar interrumpir el tráfico
  answer: C
  explanation: La ley de Missouri exige que los conductores se muevan a un carril
    no adyacente si es seguro hacerlo, o que reduzcan la velocidad y procedan con
    precaución al pasar vehículos de emergencia estacionados con luces intermitentes.
- id: 172
  category: sharing_the_road
  question: En Missouri, ¿cuál es la edad mínima que debe tener un conductor de motocicleta
    para optar por no usar casco, siempre que cuente con la cobertura de seguro médico
    adecuada?
  choices:
    A: 18 años
    B: 21 años
    C: 26 años
    D: El uso del casco es obligatorio para todos los conductores independientemente
      de su edad
  answer: C
  explanation: A partir de agosto de 2020, la ley de Missouri permite que los conductores
    de 26 años o más conduzcan sin casco si tienen seguro médico. Los conductores
    menores de 26 años y aquellos con permisos de instrucción aún deben usar casco.
- id: 173
  category: sharing_the_road
  question: Al seguir a un camión grande o autobús en Missouri, ¿por qué debería aumentar
    su distancia de seguimiento?
  choices:
    A: Para permitir que el conductor del camión lo vea en sus espejos laterales
    B: Porque los camiones tienen una distancia de frenado más corta que los automóviles
    C: Para evitar que el camión ruede hacia atrás y lo golpee
    D: Para mejorar su ahorro de combustible mediante la succión (drafting)
  answer: A
  explanation: Si lo sigue demasiado de cerca, se encuentra en la "Zona Ciega" (No-Zone)
    del camión. Aumentar su distancia permite que el conductor del camión vea su vehículo
    en sus espejos laterales.
- id: 174
  category: sharing_the_road
  question: Según la ley de Missouri, ¿cuánta distancia debe mantener al rebasar una
    bicicleta?
  choices:
    A: Al menos 1 pie
    B: Al menos 2 pies
    C: Una distancia segura
    D: Las bicicletas deben hacerse a un lado para dejar pasar a los autos
  answer: C
  explanation: El Estatuto Revisado de Missouri 304.678 establece que el operador
    de un vehículo motorizado que rebase a una bicicleta debe dejar una distancia
    segura al hacerlo.
- id: 175
  category: sharing_the_road
  question: ¿Cuál es la regla con respecto a los cortejos fúnebres en las intersecciones
    en Missouri?
  choices:
    A: El cortejo debe ceder el paso a todo el resto del tráfico
    B: Solo el vehículo principal tiene el derecho de paso
    C: Todo el cortejo tiene el derecho de paso una vez que el vehículo principal
      ha entrado legalmente en la intersección
    D: Los cortejos solo están permitidos los domingos
  answer: C
  explanation: La ley de Missouri (RSMo 194.503) otorga el derecho de paso a un cortejo
    fúnebre en una intersección, independientemente de los dispositivos de control
    de tráfico, siempre que el vehículo principal haya entrado en la intersección
    legalmente.
- id: 176
  category: sharing_the_road
  question: ¿Por cuánto tiempo puede resultar la suspensión de la licencia tras una
    primera condena por rebasar un autobús escolar detenido en Missouri mientras está
    bajando niños?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Según la ley de Missouri, una primera condena por rebasar un autobús
    escolar detenido resulta en una evaluación de 8 puntos, lo que conlleva una suspensión
    de 90 días de los privilegios de conducir.
- id: 177
  category: sharing_the_road
  question: Cuando un vehículo comercial está girando a la derecha en una intersección,
    ¿de qué debe estar consciente el conductor que va detrás?
  choices:
    A: El camión girará únicamente desde el carril izquierdo
    B: El camión puede necesitar abrirse ampliamente hacia la izquierda para completar
      el giro
    C: El camión siempre se detendrá antes de girar
    D: El camión tiene el derecho de paso sobre todos los peatones
  answer: B
  explanation: Los vehículos grandes, como camiones y autobuses, a menudo necesitan
    abrirse hacia la izquierda para no tocar el bordillo al girar a la derecha. Los
    conductores no deben intentar meterse entre el camión y el bordillo.
- id: 178
  category: sharing_the_road
  question: En Missouri, ¿qué debe hacer cuando un peatón que lleva un bastón blanco
    o usa un perro guía está cruzando la calle?
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Ceder el derecho de paso y tomar precauciones para evitar lesiones
    C: Rodearlos si hay suficiente espacio
    D: Solo detenerse si hay un cruce peatonal marcado
  answer: B
  explanation: La ley de Missouri exige que los conductores cedan el derecho de paso
    a cualquier peatón ciego que lleve un bastón blanco o use un perro guía, independientemente
    de si se encuentra en un cruce peatonal.
- id: 179
  category: sharing_the_road
  question: 'Cuando una motocicleta lo esté rebasando en Missouri, usted debe:'
  choices:
    A: Mantener su velocidad y posición en el carril
    B: Aumentar la velocidad para ayudarles a pasar más rápido
    C: Moverse hacia el lado izquierdo de su carril
    D: Encender sus luces altas
  answer: A
  explanation: Cuando una motocicleta lo esté rebasando, debe mantener su velocidad
    y posición en el carril para permitir que el motociclista complete la maniobra
    de manera segura.
- id: 180
  category: sharing_the_road
  question: La ley de Missouri exige que use sus señales de giro al menos ¿cuántos
    pies antes de girar o cambiar de carril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: La Guía del Conductor de Missouri especifica que debe señalar su intención
    de girar o cambiar de carril con al menos 100 pies de antelación.
- id: 181
  category: sharing_the_road
  question: Si usted sigue a una motocicleta, ¿cuál es la distancia de seguimiento
    recomendada en Missouri por seguridad?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: De 3 a 4 segundos
    D: Al menos 10 segundos
  answer: C
  explanation: La Guía del Conductor de Missouri recomienda una distancia de seguimiento
    de 3 a 4 segundos cuando se circula detrás de una motocicleta para permitirles
    detenerse rápidamente y reaccionar ante los peligros de la carretera.
- id: 182
  category: sharing_the_road
  question: 'En Missouri, generalmente se requiere que los ciclistas circulen:'
  choices:
    A: Solo por la acera
    B: En contra del flujo del tráfico
    C: Tan a la derecha de la calzada como sea seguro y factible
    D: Solo en carriles para bicicletas designados
  answer: C
  explanation: Los ciclistas en Missouri tienen los mismos derechos y responsabilidades
    que los automovilistas y, por lo general, se les exige circular tan a la derecha
    como sea seguro y factible.
- id: 183
  category: sharing_the_road
  question: En Missouri, cuando un autobús escolar se detiene en una carretera de
    dos carriles con sus luces rojas intermitentes y el brazo de parada extendido,
    ¿quién debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que se aproxima por delante
    C: El tráfico de ambas direcciones
    D: Nadie, si hay al menos dos carriles de circulación
  answer: C
  explanation: Según la Guía del Conductor de Missouri, en una carretera de dos carriles,
    los conductores que viajan en ambas direcciones deben detenerse cuando un autobús
    escolar hace señales para subir o bajar niños.
- id: 184
  category: sharing_the_road
  question: En una carretera de Missouri con cuatro o más carriles y una mediana o
    barrera física, ¿cuándo debe detenerse por un autobús escolar detenido en la dirección
    opuesta?
  choices:
    A: Nunca se requiere que se detenga si viaja en la dirección opuesta
    B: Solo si el conductor del autobús le indica que se detenga
    C: Solo si hay niños cruzando la mediana
    D: Siempre debe detenerse independientemente de la mediana
  answer: A
  explanation: En Missouri, si el autobús está en una carretera con cuatro o más carriles
    y usted viaja en la dirección opuesta, no es necesario detenerse, aunque debe
    mantener la precaución.
- id: 185
  category: sharing_the_road
  question: En Missouri, ¿cuánto espacio debería dejar idealmente entre su vehículo
    y una bicicleta al rebasarla?
  choices:
    A: Al menos 1 pie
    B: Al menos 3 pies
    C: Al menos 5 pies
    D: Al menos 10 pies
  answer: B
  explanation: Si bien la ley estatal de Missouri exige rebasar a una 'distancia segura',
    la Guía del Conductor de Missouri y muchas ordenanzas locales especifican que
    se debe dejar al menos 3 pies de distancia al rebasar a un ciclista.
- id: 186
  category: sharing_the_road
  question: 'Al seguir a un camión grande en Missouri, si no puede ver la cara del
    conductor del camión en sus espejos laterales, usted está:'
  choices:
    A: En la 'No-Zone' (punto ciego) del conductor
    B: En una posición segura de succión (drafting)
    C: Siguiendo a una distancia legal y segura
    D: En la 'Zona Despejada' del camión
  answer: A
  explanation: La Guía del Conductor de Missouri enfatiza que si no puede ver al conductor
    del camión en su espejo, él no puede verlo a usted, lo que significa que está
    en una 'No-Zone' o punto ciego.
- id: 187
  category: sharing_the_road
  question: En Missouri, ¿cuál es la velocidad máxima para la que suele estar diseñado
    un 'Vehículo de movimiento lento' (que lleva el triángulo reflectante naranja)?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: La señal triangular naranja indica un vehículo que circula a velocidades
    de 25 mph o menos, como maquinaria agrícola o carruajes tirados por caballos.
- id: 188
  category: sharing_the_road
  question: Según la ley de Missouri, ¿quién tiene el derecho de paso en un cortejo
    fúnebre?
  choices:
    A: El cortejo tiene el derecho de paso en las intersecciones, independientemente
      de las señales de tráfico, una vez que el vehículo guía ha entrado legalmente
    B: Los vehículos individuales del cortejo deben respetar todos los semáforos y
      señales de alto
    C: El cortejo debe ceder el paso a todo el resto del tráfico
    D: Solo el vehículo guía tiene el derecho de paso
  answer: A
  explanation: La ley de Missouri (RSMo 194.503) establece que los cortejos fúnebres
    organizados tienen el derecho de paso en las intersecciones. Una vez que el vehículo
    guía entra legalmente en una intersección, todos los demás vehículos del cortejo
    pueden seguirlo sin detenerse, siempre que utilicen luces intermitentes.
- id: 189
  category: sharing_the_road
  question: 'En Missouri, es ilegal seguir a un camión de bomberos que responde a
    una alarma a una distancia menor de:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Missouri prohíbe seguir a los vehículos de emergencia, específicamente
    a los equipos de bomberos, a menos de 500 pies cuando responden a una emergencia.
- id: 190
  category: sharing_the_road
  question: 'Cuando un peatón cruza la calle guiado por un perro o lleva un bastón
    blanco (con o sin punta roja), la ley de Missouri le exige:'
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Ceder el derecho de paso y tomar precauciones para evitar lesiones
    C: Solo detenerse si están en un cruce de peatones marcado
    D: Reducir la velocidad pero continuar conduciendo si no están en su carril
  answer: B
  explanation: La ley de Missouri otorga protecciones específicas de derecho de paso
    a los peatones ciegos o con discapacidad visual que utilizan bastones o animales
    de servicio; los conductores deben detenerse por completo si es necesario para
    evitar lesiones.
- id: 191
  category: sharing_the_road
  question: En Missouri, ¿cuántos puntos se asignan por una condena de 'Rebasar un
    autobús escolar detenido'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: D
  explanation: Rebasar un autobús escolar detenido mientras sus luces rojas parpadean
    es una infracción grave en Missouri y resulta en 8 puntos en su historial de conducción.
- id: 192
  category: sharing_the_road
  question: 'Al girar a la derecha en Missouri y si hay un ciclista a su derecha,
    usted debe:'
  choices:
    A: Acelerar para rebasar al ciclista antes de girar
    B: Tocar la bocina para advertir al ciclista que se detenga
    C: Ceder el paso al ciclista y dejar que pase primero por la intersección
    D: Girar rápidamente para que el ciclista no tenga que reducir la velocidad
  answer: C
  explanation: Los ciclistas suelen viajar más rápido de lo que parece. En Missouri,
    debe ceder el paso a un ciclista tal como lo haría con cualquier otro vehículo
    en el carril que está cruzando.
- id: 193
  category: sharing_the_road
  question: 'Según la ley de Missouri, si se ve involucrado en un choque con un vehículo
    estacionado o una propiedad y el dueño no está presente, usted debe:'
  choices:
    A: Esperar 2 horas a que el dueño regrese
    B: Abandonar la escena si el daño es inferior a $500
    C: Dejar una nota con su nombre, dirección y número de registro, y reportarlo
      a la policía
    D: Solo reportarlo si no tiene seguro
  answer: C
  explanation: La ley de Missouri exige que notifique al propietario o deje un aviso
    por escrito con su información de contacto y los detalles del vehículo, y luego
    informe el accidente a la agencia del orden público correspondiente.
- id: 194
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para un vehículo de pasajeros en Missouri?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 1/16 de pulgada
  answer: B
  explanation: En Missouri, los neumáticos se consideran inseguros y no pasarán la
    inspección si la profundidad de la banda de rodadura es inferior a 2/32 de pulgada.
- id: 195
  category: vehicle_information
  question: La ley de Missouri exige que el freno de pedal de su vehículo sea capaz
    de detener el automóvil en cuántos pies cuando viaja a 20 mph?
  choices:
    A: 15 pies
    B: 25 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: La Guía del Conductor de Missouri establece que el freno de pedal debe
    ser capaz de detener el vehículo en un máximo de 25 pies cuando se viaja a una
    velocidad de 20 mph.
- id: 196
  category: vehicle_information
  question: ¿Cuál es el límite legal en Missouri para la transmisión de luz en las
    ventanillas laterales delanteras (conductor y pasajero delantero) de un vehículo
    motorizado?
  choices:
    A: 20% de transmisión de luz
    B: 35% de transmisión de luz
    C: 50% de transmisión de luz
    D: 70% de transmisión de luz
  answer: B
  explanation: La ley de Missouri permite el polarizado de las ventanillas laterales
    delanteras siempre que permitan al menos un 35% de transmisión de luz (más o menos
    un 3% de tolerancia).
- id: 197
  category: vehicle_information
  question: ¿Durante qué meses se les permite a los conductores de Missouri usar neumáticos
    para nieve con clavos en sus vehículos?
  choices:
    A: Del 1 de octubre al 1 de marzo
    B: Del 1 de noviembre al 1 de abril
    C: Del 1 de diciembre al 31 de marzo
    D: Del 15 de noviembre al 15 de marzo
  answer: B
  explanation: La ley de Missouri permite el uso de neumáticos con clavos únicamente
    entre el 1 de noviembre y el 1 de abril.
- id: 198
  category: vehicle_information
  question: 'Según la ley de Missouri, las luces traseras de su vehículo deben ser
    visibles desde una distancia de al menos:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Las regulaciones de equipo de Missouri exigen que las luces traseras
    (de color rojo) sean visibles desde una distancia de 500 pies hacia atrás.
- id: 199
  category: vehicle_information
  question: 'En Missouri, la placa de matrícula trasera debe estar iluminada por una
    luz blanca para que sea visible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Missouri exige una luz blanca para iluminar la placa de matrícula
    trasera, haciéndola claramente legible desde una distancia de 50 pies.
- id: 200
  category: vehicle_information
  question: 'La ley de Missouri exige que cada vehículo motorizado tenga una bocina
    que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: Un vehículo motorizado en Missouri debe estar equipado con una bocina
    en buen estado de funcionamiento capaz de emitir un sonido audible en condiciones
    normales desde una distancia no menor a 200 pies.
- id: 201
  category: vehicle_information
  question: ¿A qué distancia mínima, en pies, deben ser visibles las luces direccionales
    de su vehículo bajo la luz solar normal?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Las regulaciones de Missouri requieren que las luces direccionales
    sean visibles desde una distancia de al menos 100 pies bajo la luz solar normal.
- id: 202
  category: vehicle_information
  question: En Missouri, ¿qué vehículos están generalmente exentos del requisito de
    inspección de seguridad bienal (cada dos años)?
  choices:
    A: Todos los vehículos fabricados en los últimos 5 años
    B: Vehículos con menos de 150,000 millas y menos de 10 años de antigüedad
    C: Solo vehículos eléctricos
    D: Vehículos conducidos menos de 5,000 millas por año
  answer: B
  explanation: La ley de Missouri exime a los vehículos motorizados durante los primeros
    diez años posteriores al año del modelo de fabricación, siempre que el vehículo
    tenga menos de 150,000 millas al momento del registro.
- id: 203
  category: vehicle_information
  question: La ley de Missouri exige que el espejo retrovisor de su vehículo proporcione
    una visión de la carretera de al menos ¿cuántos pies hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los vehículos deben estar equipados con un espejo ubicado de tal manera
    que refleje al conductor una vista de la carretera por una distancia de al menos
    200 pies hacia atrás.
- id: 204
  category: vehicle_information
  question: ¿Cuál es el polarizado máximo permitido para las ventanas laterales delanteras
    (a la izquierda y derecha del conductor) en Missouri?
  choices:
    A: 20% de transmisión de luz
    B: 35% de transmisión de luz
    C: 50% de transmisión de luz
    D: No se permite polarizado en las ventanas laterales
  answer: B
  explanation: La ley de Missouri permite el polarizado en las ventanas laterales
    delanteras siempre que permita un 35% (más o menos 3%) de transmisión de luz.
- id: 205
  category: vehicle_information
  question: La ley de Missouri exige que todo vehículo motorizado esté equipado con
    ¿cuál de los siguientes sistemas de frenado?
  choices:
    A: Solo un freno de pie
    B: Solo un freno de estacionamiento
    C: Tanto un freno de pie como un freno de estacionamiento
    D: Un sistema de frenos antibloqueo (ABS)
  answer: C
  explanation: 'Todo vehículo motorizado en Missouri debe tener dos medios separados
    para aplicar los frenos: un freno de servicio (de pie) y un freno de estacionamiento
    (de emergencia).'
- id: 206
  category: vehicle_information
  question: 'En Missouri, un neumático se considera inseguro y no pasará la inspección
    de seguridad si la profundidad de la banda de rodadura es inferior a:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 (1/16) de pulgada
    C: 4/32 (1/8) de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos deben tener al menos 2/32 (o 1/16) de pulgada de banda
    de rodadura para pasar una inspección de seguridad de Missouri.
- id: 207
  category: vehicle_information
  question: ¿Con qué frecuencia se requiere generalmente que los residentes de Missouri
    realicen una inspección de seguridad para la renovación del registro de su vehículo?
  choices:
    A: Cada año
    B: Cada dos años, según el año del modelo del vehículo
    C: Cada cinco años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Missouri requiere inspecciones de seguridad bienales (cada dos años).
    Los vehículos de años de modelo par se inspeccionan en años pares, y los vehículos
    de años de modelo impar en años impares.
- id: 208
  category: vehicle_information
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    para un vehículo motorizado en Missouri?
  choices:
    A: $10,000/$20,000/$10,000
    B: $25,000/$50,000/$25,000
    C: $50,000/$100,000/$50,000
    D: $100,000/$300,000/$100,000
  answer: B
  explanation: La ley de Missouri exige una cobertura mínima de responsabilidad civil
    de $25,000 por lesiones corporales por persona, $50,000 por lesiones corporales
    por accidente y $25,000 por daños a la propiedad.
- id: 209
  category: vehicle_information
  question: Para la mayoría de los vehículos de pasajeros en Missouri, ¿dónde deben
    exhibirse las placas de matrícula?
  choices:
    A: Solo en la parte trasera del vehículo
    B: Solo en la parte delantera del vehículo
    C: Tanto en la parte delantera como en la trasera del vehículo
    D: En la parte trasera y en el parabrisas delantero
  answer: C
  explanation: 'La ley de Missouri exige que la mayoría de los vehículos motorizados
    exhiban dos placas de matrícula: una en la parte delantera y otra en la trasera.'
- id: 210
  category: vehicle_information
  question: 'La ley de Missouri exige que las luces traseras sean de color rojo y
    visibles desde una distancia de al menos:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Todo vehículo motorizado debe tener al menos dos luces traseras rojas
    (una para vehículos más antiguos) que sean visibles desde una distancia de 500
    pies.
- id: 211
  category: vehicle_information
  question: ¿Si una carga se extiende más de cuántos pies más allá de la parte trasera
    de un vehículo, se debe colocar una bandera roja o una luz al final de la carga
    en Missouri?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: C
  explanation: Siempre que una carga se extienda 4 pies o más más allá de la parte
    trasera de un vehículo, se debe mostrar una bandera roja (de día) o una luz roja
    (de noche) al final de la carga.
- id: 212
  category: signs_and_signals
  question: En Missouri, ¿qué significa un semáforo en rojo intermitente?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: La luz está a punto de cambiar a rojo fijo
    C: Lo mismo que una señal de alto (STOP)
    D: Ceder el paso a todo el tráfico, pero no detenerse
  answer: C
  explanation: Según la Guía del Conductor de Missouri, una luz roja intermitente
    significa lo mismo que una señal de alto. Debe detenerse por completo y avanzar
    solo cuando sea seguro.
- id: 213
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal en forma de banderín ubicada en el
    lado izquierdo de la carretera en Missouri?
  choices:
    A: Zona escolar
    B: Zona de no rebasar (No Passing Zone)
    C: Ceder el paso
    D: Cruce de ferrocarril
  answer: B
  explanation: Una señal en forma de banderín se coloca en el lado izquierdo de la
    carretera para marcar el inicio de una 'Zona de no rebasar'.
- id: 214
  category: signs_and_signals
  question: En Missouri, ¿qué indica una señal de 'X' amarilla fija sobre un carril
    de tráfico?
  choices:
    A: El carril es solo para giros a la izquierda
    B: El carril está cerrado a todo el tráfico
    C: Salga de este carril porque la señal está a punto de cambiar a una X roja
    D: Puede usar este carril con precaución
  answer: C
  explanation: Una 'X' amarilla fija significa que la señal está a punto de cambiar
    a una 'X' roja y usted debe prepararse para salir de ese carril de manera segura.
- id: 215
  category: signs_and_signals
  question: En Missouri, ¿con qué propósito se puede utilizar un 'carril compartido
    para girar a la izquierda' (marcado por líneas amarillas continuas y discontinuas)?
  choices:
    A: Rebasar vehículos más lentos
    B: Viajar hasta 500 pies para incorporarse al tráfico
    C: Hacer un giro a la izquierda o un giro en U donde esté permitido
    D: Estacionar su vehículo temporalmente
  answer: C
  explanation: Los carriles compartidos para girar a la izquierda están reservados
    para realizar giros a la izquierda y pueden ser utilizados por vehículos que viajan
    en cualquier dirección. No deben usarse para circular de frente o para rebasar.
- id: 216
  category: signs_and_signals
  question: Si las luces direccionales de su vehículo fallan, ¿cuál es la señal manual
    correcta para un giro a la derecha en Missouri?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido hacia afuera
  answer: B
  explanation: Para indicar un giro a la derecha mediante señales manuales, extienda
    el brazo izquierdo por la ventana y dóblelo hacia arriba a la altura del codo.
- id: 217
  category: signs_and_signals
  question: ¿Qué indica una señal de forma redonda en el estado de Missouri?
  choices:
    A: Ceder el paso
    B: Alto (Stop)
    C: Cruce de ferrocarril más adelante
    D: Hospital cercano
  answer: C
  explanation: Una señal amarilla de forma redonda se utiliza exclusivamente para
    advertir a los conductores que se aproximan a un cruce de ferrocarril.
- id: 218
  category: signs_and_signals
  question: En Missouri, ¿de qué color son las señales reglamentarias que proporcionan
    información sobre los límites de velocidad y el estacionamiento?
  choices:
    A: Amarillo
    B: Naranja
    C: Blanco
    D: Verde
  answer: C
  explanation: Las señales reglamentarias, que le indican lo que debe o no debe hacer
    (como los límites de velocidad), suelen ser rectangulares y tienen un fondo blanco
    con letras o símbolos negros.
- id: 219
  category: signs_and_signals
  question: Al acercarse a un autobús escolar con luces rojas intermitentes y un brazo
    de parada extendido en una carretera dividida por una franja mediana, ¿quién debe
    detenerse?
  choices:
    A: El tráfico en ambas direcciones
    B: Solo el tráfico que sigue al autobús
    C: Solo el tráfico que se aproxima al autobús por delante
    D: Nadie está obligado a detenerse en una carretera dividida
  answer: B
  explanation: En Missouri, si una carretera está dividida por una mediana o una isla,
    solo el tráfico que sigue al autobús debe detenerse. El tráfico que se mueve en
    la dirección opuesta no necesita detenerse.
- id: 220
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas discontinuas en el pavimento en Missouri?
  choices:
    A: Separación de carriles de tráfico que se mueven en direcciones opuestas
    B: Separación de carriles de tráfico que se mueven en la misma dirección
    C: Una zona de 'No Rebasar'
    D: El borde de la calzada
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección. Puede cruzar estas líneas para cambiar de carril
    cuando sea seguro hacerlo.
- id: 221
  category: signs_and_signals
  question: ¿Cuál es la señal manual para "Disminuir la velocidad o Detenerse" en
    Missouri?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho moviéndose hacia el suelo
  answer: C
  explanation: Para indicar que está disminuyendo la velocidad o deteniéndose, extienda
    el brazo izquierdo por la ventana y apunte hacia abajo.
- id: 222
  category: signs_and_signals
  question: En Missouri, ¿qué representa una señal naranja en forma de diamante?
  choices:
    A: Advertencia general de peligros en la carretera
    B: Advertencia de construcción o mantenimiento
    C: Guía direccional hacia parques estatales
    D: Información reglamentaria del límite de velocidad
  answer: B
  explanation: Las señales naranjas en forma de diamante se utilizan específicamente
    para zonas de trabajo de construcción y mantenimiento para advertir a los conductores
    sobre condiciones inusuales o potencialmente peligrosas.
- id: 223
  category: signs_and_signals
  question: ¿Qué significa una luz amarilla intermitente en una intersección según
    la Guía del Conductor de Missouri?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Acelerar para despejar la intersección rápidamente
    C: Disminuir la velocidad y proceder con precaución
    D: La señal está averiada; trátela como una parada de cuatro vías
  answer: C
  explanation: Una luz amarilla intermitente advierte a los conductores que deben
    disminuir la velocidad y atravesar la intersección con precaución.
- id: 224
  category: signs_and_signals
  question: Si las luces direccionales de su vehículo no funcionan, ¿cómo debe señalizar
    un giro a la derecha usando señales manuales en Missouri?
  choices:
    A: Extienda el brazo izquierdo recto hacia afuera de la ventana
    B: Extienda el brazo izquierdo hacia afuera y apunte hacia arriba
    C: Extienda el brazo izquierdo hacia afuera y apunte hacia abajo
    D: Extienda el brazo derecho recto hacia afuera de la ventana
  answer: B
  explanation: Para señalizar un giro a la derecha mediante señales manuales, debe
    extender el brazo izquierdo por la ventana y doblarlo hacia arriba a la altura
    del codo.
- id: 225
  category: signs_and_signals
  question: En una carretera de dos carriles en Missouri, ¿qué significa una línea
    amarilla continua en su lado de la línea central?
  choices:
    A: Puede adelantar si el camino por delante está despejado
    B: Se encuentra en una calle de sentido único
    C: Está prohibido adelantar (rebasar) para su carril
    D: Debe disminuir la velocidad a 25 mph
  answer: C
  explanation: Una línea amarilla continua en su lado de la línea central significa
    que está prohibido adelantar para los vehículos en su carril.
- id: 226
  category: signs_and_signals
  question: 'Al entrar en una rotonda en Missouri, debe ceder el paso a:'
  choices:
    A: El tráfico que entra por la derecha
    B: El tráfico que ya está circulando en la rotonda
    C: A nadie; usted tiene el derecho de paso
    D: Solo a los vehículos de emergencia
  answer: B
  explanation: Los conductores que entran en una rotonda deben ceder el paso al tráfico
    que ya está dentro del círculo y a los peatones en el cruce peatonal.
- id: 227
  category: signs_and_signals
  question: ¿Cuál es el significado principal de una señal de tráfico en forma de
    diamante?
  choices:
    A: Pare o Ceda el paso
    B: Advertencia de posibles peligros más adelante
    C: Información reglamentaria
    D: Cruce de ferrocarril más adelante
  answer: B
  explanation: Las señales en forma de diamante son señales de advertencia que alertan
    a los conductores sobre peligros, cambios en las condiciones de la carretera o
    próximas intersecciones.
- id: 228
  category: signs_and_signals
  question: 'Una luz roja intermitente en una intersección en Missouri debe tratarse
    igual que una:'
  choices:
    A: Señal de ceder el paso
    B: Señal de alto (Pare)
    C: Luz verde
    D: Señal de precaución
  answer: B
  explanation: Una luz roja intermitente significa que debe detenerse por completo
    y proceder solo cuando sea seguro hacerlo, al igual que una señal de alto.
- id: 229
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas discontinuas en una calzada de Missouri?
  choices:
    A: El tráfico se mueve en direcciones opuestas
    B: El borde de la calzada
    C: El tráfico se mueve en la misma dirección
    D: Una zona de cruce de peatones
  answer: C
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección; puede cruzarlas para cambiar de carril si es
    seguro.
- id: 230
  category: signs_and_signals
  question: ¿Qué significa una señal blanca en forma de X (cruceta) con las palabras
    "Railroad Crossing"?
  choices:
    A: Detenerse inmediatamente
    B: La carretera está cerrada más adelante
    C: Ceder el paso a cualquier tren que se aproxime
    D: No se permite adelantar durante la próxima milla
  answer: C
  explanation: La señal de cruceta (Crossbuck) es una señal reglamentaria que marca
    un cruce de ferrocarril y requiere que los conductores cedan el paso a cualquier
    tren que se aproxime.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 231
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 232
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 233
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 234
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda únicamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 235
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 236
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 237
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 238
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 239
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha únicamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 240
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 241
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 242
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que crucen la calle.
  id: 243
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 244
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 245
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los pasos a nivel. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 246
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 247
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 248
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que la carretera gire
    primero en un sentido y luego en el otro.
  id: 249
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 250
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica este letrero que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 251
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la vía y ajuste
    su posición en el carril.
  id: 252
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 253
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
  id: 254
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de rebase más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico se mueve en ambas direcciones'
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico en ambos sentidos más adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 255
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 256
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Superficie de carretera irregular
    C: Una colina o pendiente empinada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente empinada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 257
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 258
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 259
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las carreteras
    laterales.
  id: 260
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 261
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está agregando un carril nuevo; no es necesario incorporarse (merging)
    D: Se requiere girar a la derecha
  answer: C
  explanation: Una señal de carril adicional significa que un carril nuevo se une
    a la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 262
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 263
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 264
