questions:
- id: 1
  category: driver_testing
  question: ¿Cuántas preguntas debe responder correctamente para aprobar el examen
    de conducir escrito de Missouri?
  choices:
    A: '15'
    B: '18'
    C: '20'
    D: '25'
  answer: C
  explanation: Según el manual, debe responder correctamente 20 de las 25 preguntas
    de opción múltiple para aprobar el examen escrito.
- id: 2
  category: license_system
  question: ¿Cuál de las siguientes personas NO está obligada a tener una licencia
    de conducir de Missouri para conducir en Missouri?
  choices:
    A: Un nuevo residente de Missouri que tiene una licencia de otro estado.
    B: Un estudiante de tiempo completo con una licencia de conducir válida de su
      estado de origen.
    C: Un residente de Missouri de 16 años que planea conducir.
    D: Un conductor comercial de otro estado que se mudó a Missouri hace 20 días.
  answer: B
  explanation: El manual establece que no necesita una licencia de conducir de Missouri
    si es un estudiante de tiempo completo y tiene una licencia de conducir válida
    de su estado de origen.
- id: 3
  category: license_system
  question: ¿Cuál es la edad mínima elegible para obtener un Permiso de Instrucción
    estándar en Missouri?
  choices:
    A: '14'
    B: '15'
    C: 15 y medio
    D: '16'
  answer: B
  explanation: La edad elegible para un Permiso de Instrucción, que es el primer paso
    en el Programa de Licencia de Conducir Graduada (GDL) de Missouri, es de 15 años.
- id: 4
  category: license_system
  question: ¿Qué debe hacer con el registro de examen de conducir emitido por la Patrulla
    de Carreteras del Estado de Missouri?
  choices:
    A: Guárdelo en su guantera como un permiso temporal válido.
    B: Envíelo por correo al Departamento de Ingresos dentro de los 30 días.
    C: Llévelo a una oficina de licencias local para solicitar el permiso o licencia
      real.
    D: Preséntelo a un adulto con licencia antes de comenzar la práctica de manejo.
  answer: C
  explanation: El registro del examen de conducir no es válido como permiso o licencia.
    Debe llevar su copia del registro y otros documentos requeridos a su oficina de
    licencias local para solicitar el permiso o licencia real.
- id: 5
  category: license_system
  question: ¿Cuándo comienza oficialmente el período de permiso requerido de seis
    meses para una licencia intermedia?
  choices:
    A: En su cumpleaños número 15.
    B: Cuando apruebe el examen escrito.
    C: Cuando la Patrulla de Carreteras del Estado de Missouri emita su registro de
      examen.
    D: Tras la emisión del permiso de instrucción temporal en la oficina de licencias.
  answer: D
  explanation: El manual establece explícitamente que el período de permiso de seis
    meses requerido para una licencia intermedia no comienza hasta la emisión del
    permiso de instrucción temporal.
- id: 6
  category: license_system
  question: ¿A qué edad puede solicitar un Permiso de Instrucción de Motocicleta SIN
    que se le requiera completar un curso de capacitación para conductores de motocicletas
    aprobado?
  choices:
    A: '15'
    B: 15 y medio
    C: '16'
    D: '18'
  answer: C
  explanation: Si tiene 16 años o más, puede solicitar un permiso de instrucción de
    motocicleta y no se requiere el curso de capacitación para conductores de motocicletas.
- id: 7
  category: license_system
  question: ¿Cuál de las siguientes es una restricción para una persona de 15 años
    y medio que tiene un Permiso de Instrucción de Motocicleta?
  choices:
    A: Solo pueden conducir dentro de un radio de 100 millas de su hogar.
    B: Se les permite llevar a un pasajero.
    C: Solo pueden operar una motocicleta de no más de 250 cc.
    D: Se les permite conducir de noche si van acompañados por un adulto.
  answer: C
  explanation: Para una persona de 15 años y medio, el permiso permite conducir solo
    durante el día, dentro de un radio de 50 millas de su hogar, una motocicleta de
    no más de 250 cc y sin pasajeros.
- id: 8
  category: license_system
  question: ¿Qué clase de licencia es la licencia de conducir básica, también conocida
    como licencia de operador, para conductores de 18 años o más?
  choices:
    A: Clase A
    B: Clase E
    C: Clase F
    D: Clase M
  answer: C
  explanation: La Licencia de Conducir Completa (Clase F) es la licencia de conducir
    básica, también llamada licencia de operador, y la edad elegible es 18 años.
- id: 9
  category: driver_testing
  question: Si ya tiene una licencia Clase F, ¿qué examen NO se requiere al solicitar
    una Licencia para Alquiler (Clase E)?
  choices:
    A: Examen de la vista
    B: Examen de señales de tránsito
    C: Examen escrito
    D: Examen de manejo
  answer: D
  explanation: Al realizar el examen para una licencia Clase E, si ya tiene una licencia
    Clase F, no se requiere un examen de manejo.
- id: 10
  category: license_system
  question: ¿Cuál de los siguientes documentos NO figura explícitamente como verificación
    requerida al obtener una nueva licencia o permiso?
  choices:
    A: Verificación de estatus legal
    B: Número de seguro social
    C: Comprobante de inscripción en la escuela secundaria
    D: Residencia en Missouri
  answer: C
  explanation: Cualquier persona que obtenga una nueva licencia o permiso debe mostrar
    verificación de estatus legal, identidad (nombre legal completo), número de seguro
    social y residencia en Missouri. El comprobante de inscripción en la escuela secundaria
    no figura en la lista.
- id: 11
  category: driver_testing
  question: ¿Cuántas preguntas de opción múltiple tiene el examen escrito de conducir
    de Missouri?
  choices:
    A: '20'
    B: '25'
    C: '30'
    D: '50'
  answer: B
  explanation: Para evaluar sus conocimientos sobre las leyes de tránsito, deberá
    realizar un examen escrito de 25 preguntas de opción múltiple.
- id: 12
  category: license_system
  question: ¿Cuál es la edad mínima elegible para obtener una Licencia de Alquiler
    (Clase E)?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: C
  explanation: La edad elegible para una Licencia de Alquiler (Clase E) es de 18 años.
- id: 13
  category: license_system
  question: 'Si usted es menor de 21 años, su permiso o licencia:'
  choices:
    A: Será válido por solo seis meses.
    B: Lo identificará como menor de edad.
    C: Requerirá que conduzca solo durante las horas del día.
    D: Le prohibirá conducir en la autopista.
  answer: B
  explanation: El manual establece que si usted es menor de 21 años, se le expedirá
    un permiso o licencia que lo identifique como menor de edad.
- id: 14
  category: license_system
  question: ¿Bajo qué condición puede una persona operar un tractor agrícola en una
    autopista sin una licencia de conducir de Missouri?
  choices:
    A: Si tiene al menos 14 años de edad.
    B: Si lo opera para fines relacionados con la agricultura.
    C: Si permanece dentro de un radio de 50 millas de su granja.
    D: Si tiene un permiso de instrucción válido.
  answer: B
  explanation: No necesita una licencia de conducir de Missouri si opera o maneja
    o traslada temporalmente cualquier tractor o implemento agrícola en una autopista
    para fines relacionados con la agricultura.
- id: 15
  category: license_system
  question: ¿Cuál es la edad elegible para solicitar una licencia Clase E en Missouri?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: Según el manual, la edad elegible para una licencia Clase E es de 18
    años.
- id: 16
  category: license_system
  question: ¿Cuál de las siguientes personas NO está obligada a obtener una licencia
    de alquiler (Clase E)?
  choices:
    A: Un conductor que transporta 14 pasajeros o menos para un centro de cuidado
      infantil.
    B: Un conductor de entrega de una floristería que transporta bienes por un pago.
    C: Una persona que presta servicios de entrega de comida preparada para un restaurante
      de comida rápida.
    D: Un conductor que opera un vehículo de carga de un empleador que pesa 20,000
      libras.
  answer: C
  explanation: Las personas que prestan servicios de entrega de comida preparada para
    entidades como un restaurante de comida rápida o una charcutería (delicatessen)
    no están obligadas a obtener una licencia Clase E.
- id: 17
  category: driver_testing
  question: ¿Qué exámenes debe aprobar para obtener una licencia o permiso Clase M?
  choices:
    A: Solo un examen de habilidades en motocicleta.
    B: Los exámenes escritos de Clase F y Clase M, de la vista, de señales de tránsito
      y de habilidades en motocicleta.
    C: Solo los exámenes escritos y de la vista de Clase M.
    D: Un examen de habilidades de conducción en un vehículo de pasajeros estándar.
  answer: B
  explanation: Para obtener una licencia Clase M, deberá aprobar los exámenes escritos
    de Clase F y Clase M, de la vista, de señales de tránsito y de habilidades en
    motocicleta.
- id: 18
  category: license_system
  question: ¿Qué tipo de licencia se requiere para operar una bicicleta motorizada
    en las vías públicas?
  choices:
    A: Un endoso de motocicleta Clase M.
    B: Una licencia de alquiler Clase E.
    C: Una licencia de operador válida (o de una clasificación superior).
    D: Una Licencia de Conducir Comercial (CDL).
  answer: C
  explanation: Un conductor que opera una bicicleta motorizada no está obligado a
    obtener un endoso de motocicleta; sin embargo, debe poseer una licencia de operador
    válida (o de una clasificación superior).
- id: 19
  category: license_system
  question: ¿Qué edad debe tener para obtener una Licencia de Conducir Comercial (CDL)
    con un endoso de Materiales Peligrosos o de Autobús Escolar?
  choices:
    A: 16 años
    B: 18 años
    C: 21 años
    D: 25 años
  answer: C
  explanation: Debe tener al menos 21 años de edad para obtener una CDL con un endoso
    de Materiales Peligrosos o de Autobús Escolar.
- id: 20
  category: license_system
  question: ¿Cuándo vence generalmente una identificación estándar con foto para no
    conductores (Clase ND)?
  choices:
    A: En su fecha de nacimiento en el tercer año después de su solicitud.
    B: En su fecha de nacimiento en el sexto año después de su solicitud.
    C: Nunca vence.
    D: Diez años a partir de la fecha de emisión.
  answer: B
  explanation: Su identificación de no conductor vence en su fecha de nacimiento en
    el sexto año después de su solicitud.
- id: 21
  category: license_system
  question: ¿Si tiene 70 años o más y solicita una identificación de no conductor
    que no cumple con REAL ID, por cuánto tiempo es válida la tarjeta?
  choices:
    A: 3 años
    B: 6 años
    C: Se emite sin fecha de vencimiento.
    D: 10 años
  answer: C
  explanation: Si tiene 70 años o más, su identificación de no conductor se emitirá
    sin fecha de vencimiento, a menos que solicite una tarjeta que cumpla con REAL
    ID.
- id: 22
  category: driver_testing
  question: ¿Qué exámenes se requieren si está transfiriendo una licencia de conducir
    de otro estado a Missouri?
  choices:
    A: El examen de conducir de cuatro partes.
    B: Solo el examen de habilidades de conducción.
    C: Los exámenes de la vista y de señales de tránsito.
    D: No se requieren exámenes.
  answer: C
  explanation: Si está transfiriendo su licencia de conducir de otro estado, debe
    entregar la licencia de su estado de residencia anterior y realizar los exámenes
    de la vista y de señales de tránsito.
- id: 23
  category: driver_testing
  question: 'Debe realizar el examen de conducir de cuatro partes si su licencia de
    conducir de Missouri ha estado vencida por más de:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses (184 días)
    D: 1 año (365 días)
  answer: C
  explanation: Debe realizar el examen de conducir de cuatro partes si su licencia
    de conducir de Missouri ha estado vencida por más de seis meses (184 días).
- id: 24
  category: license_system
  question: ¿Cuál de los siguientes NO es un documento aceptable para demostrar el
    estatus legal para una licencia de conducir?
  choices:
    A: Un pasaporte estadounidense válido y vigente.
    B: Un certificado de nacimiento de un hospital.
    C: Un Certificado de Ciudadanía de EE. UU.
    D: Un Certificado de Nacimiento de EE. UU. certificado emitido por una agencia
      de registros vitales.
  answer: B
  explanation: Los certificados de nacimiento de hospitales y las tarjetas de registro
    de nacimiento no son aceptables como prueba de estatus legal.
- id: 25
  category: license_system
  question: Los solicitantes de 65 años o más que renueven una licencia no comercial
    que no cumpla con REAL ID pueden estar exentos de presentar ¿qué tipo de documento?
  choices:
    A: Documentos del lugar de nacimiento.
    B: Prueba de residencia en Missouri.
    C: Prueba del Número de Seguro Social.
    D: Prueba de identidad.
  answer: A
  explanation: Si está renovando un permiso, licencia de conducir o identificación
    de no conductor no comercial que no cumple con REAL ID y tiene 65 años o más,
    puede estar exento de presentar documentos del lugar de nacimiento.
- id: 26
  category: license_system
  question: ¿Qué dos datos deben contener los documentos utilizados para verificar
    su identidad?
  choices:
    A: Su nombre legal completo y su número de seguro social.
    B: Su nombre legal completo y su fecha de nacimiento.
    C: Su fecha de nacimiento y su dirección residencial.
    D: Su firma y fotografía.
  answer: B
  explanation: Los documentos utilizados para verificar la identidad deben contener
    su nombre legal completo y su fecha de nacimiento.
- id: 27
  category: license_system
  question: ¿Cuántos documentos que verifiquen la residencia en Missouri se requieren
    para obtener un documento que cumpla con REAL ID?
  choices:
    A: Un documento
    B: Dos documentos
    C: Tres documentos
    D: Cuatro documentos
  answer: B
  explanation: Para obtener un documento que cumpla con REAL ID, debe proporcionar
    dos documentos que verifiquen la residencia en Missouri.
- id: 28
  category: license_system
  question: ¿Cuál de los siguientes NO es aceptable para usar como dirección residencial
    al solicitar una licencia de Missouri?
  choices:
    A: Un apartado postal (P.O. Box).
    B: El lugar donde una persona está físicamente presente y considera su hogar.
    C: Un hogar verdadero, fijo y principal.
    D: Un hogar permanente al que una persona tiene la intención de regresar.
  answer: A
  explanation: Un apartado postal (P.O. Box) no es aceptable como dirección residencial.
    Debe mostrar un comprobante de dirección residencial y una dirección postal alternativa
    (si corresponde).
- id: 29
  category: license_system
  question: Si un solicitante menor de 21 años no puede proporcionar un documento
    aceptable para la verificación de una dirección residencial en Missouri, ¿cuál
    es una alternativa aceptable?
  choices:
    A: Puede usar una factura de servicios públicos de un amigo.
    B: Un padre o tutor legal puede proporcionar un documento en su nombre.
    C: Está exento de proporcionar prueba de residencia.
    D: Debe esperar hasta cumplir 21 años para presentar la solicitud.
  answer: B
  explanation: Si es menor de 21 años y no puede proporcionar un documento aceptable
    de la lista para la verificación de una dirección residencial en Missouri, un
    padre o tutor legal puede proporcionar dicho documento en su nombre.
- id: 30
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es aceptable para proporcionar su
    Número de Seguro Social para una solicitud de licencia de Missouri?
  choices:
    A: Un comprobante de salarios e impuestos W-2.
    B: Una tarjeta de Seguro Social laminada.
    C: Un formulario 1099.
    D: Un talón de pago con su nombre y Número de Seguro Social.
  answer: B
  explanation: El manual establece que la tarjeta del Seguro Social debe ser original,
    estar firmada y no estar laminada.
- id: 31
  category: license_system
  question: ¿Si necesita cambiar su primer o segundo nombre en su licencia de conducir,
    qué documento debe presentar?
  choices:
    A: Un acta de nacimiento enmendada
    B: Una licencia de matrimonio certificada
    C: Una orden judicial certificada
    D: Una sentencia de divorcio certificada
  answer: C
  explanation: Según el manual, se requiere una orden judicial certificada para un
    cambio de primer nombre o un cambio de segundo nombre.
- id: 32
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Instrucción de Missouri?
  choices:
    A: 0 a 6 meses
    B: 0 a 12 meses
    C: La duración de un curso aprobado
    D: 1 año no renovable
  answer: B
  explanation: La tabla de tarifas de permisos del manual indica que un Permiso de
    Instrucción es válido por un periodo de 0 a 12 meses.
- id: 33
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por desobedecer las restricciones de conducción
    impuestas en su licencia?
  choices:
    A: Se le requerirá volver a tomar el examen escrito
    B: Puede ser acusado de conducir sin licencia
    C: Su vehículo será confiscado de inmediato
    D: Recibirá una carta de advertencia
  answer: B
  explanation: 'El manual establece: ''Si desobedece la(s) restricción(es), puede
    ser acusado de conducir sin licencia y, si es declarado culpable, se sumarán puntos
    a su historial de conducción''.'
- id: 34
  category: license_system
  question: ¿Qué indica el código de restricción 'C' en una licencia de conducir de
    Missouri?
  choices:
    A: Lentes correctivos
    B: Restringido a 45 MPH
    C: Conducción solo durante el día
    D: Licencia intermedia
  answer: C
  explanation: De acuerdo con la tabla de Códigos de Restricción del manual, el código
    'C' significa Conducción solo durante el día (Daylight Driving Only).
- id: 35
  category: alcohol_drugs_health
  question: Debe presentar una declaración médica al Departamento de Ingresos (Department
    of Revenue) si ha tenido ataques epilépticos, convulsiones o desmayos, ¿dentro
    de qué plazo previo a su solicitud de licencia?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 2 años
  answer: B
  explanation: Se requiere una remisión médica si ha tenido ataques epilépticos, convulsiones
    o desmayos dentro de los seis meses anteriores a su solicitud de licencia.
- id: 36
  category: alcohol_drugs_health
  question: Si un médico o un oficial de la ley cree que usted tiene una condición
    médica que lo convierte en un conductor inseguro, ¿qué formulario deben presentar
    al Departamento?
  choices:
    A: Formulario de Variación Médica
    B: Formulario de Restricción No Codificada
    C: Informe de Condición del Conductor (Formulario 4319)
    D: Formulario 1099
  answer: C
  explanation: El manual establece que las personas autorizadas que crean que usted
    tiene una condición médica que lo convierte en un conductor inseguro deben completar
    un Informe de Condición del Conductor (Formulario 4319) y enviarlo al Departamento.
- id: 37
  category: license_system
  question: ¿Cuál es la edad mínima para que se le otorgue un endoso de Autobús Escolar
    (S) en Missouri?
  choices:
    A: '18'
    B: '21'
    C: '25'
    D: '75'
  answer: B
  explanation: El manual especifica que se puede otorgar un endoso de autobús escolar
    a conductores de 21 años o más que posean una licencia Clase E o una licencia
    comercial con un endoso de Pasajeros (P).
- id: 38
  category: penalties_and_points
  question: ¿Por cuánto tiempo se suspenderá un endoso de autobús escolar si el conductor
    no pasa una prueba de drogas, alcohol o sustancias químicas?
  choices:
    A: 6 meses
    B: 1 año
    C: 3 años
    D: Permanentemente
  answer: B
  explanation: Un endoso de autobús escolar puede ser suspendido por un año si una
    persona no pasa cualquier prueba de drogas, alcohol o sustancias químicas administrada
    de acuerdo con las leyes federales o estatales.
- id: 39
  category: driver_testing
  question: ¿Qué exámenes se requieren para agregar un endoso de motocicleta (M) a
    una licencia existente?
  choices:
    A: Solo examen escrito y examen de habilidades
    B: Solo examen de la vista y de habilidades
    C: Solo examen escrito y examen de señales de tránsito
    D: Examen escrito, de la vista, de señales de tránsito y un examen de habilidades
  answer: D
  explanation: Para agregar el endoso de motocicleta a una licencia existente, deberá
    aprobar el examen escrito de motocicleta, el de la vista, el de señales de tránsito
    y un examen de habilidades en una motocicleta o mototriciclo.
- id: 40
  category: license_system
  question: ¿Con cuánta anticipación puede renovar su licencia de conducir de Missouri
    antes de que venza?
  choices:
    A: Hasta 30 días
    B: Hasta 3 meses
    C: Hasta 6 meses
    D: Hasta 1 año
  answer: C
  explanation: 'El manual establece: ''Puede renovar su licencia hasta seis meses
    antes de que venza''.'
- id: 41
  category: driver_testing
  question: ¿Qué exámenes debe realizar cada vez que renueva su licencia de conducir?
  choices:
    A: Exámenes escrito y de conducción
    B: Exámenes de la vista y de señales de tránsito
    C: Exámenes de la vista y escrito
    D: Exámenes de conducción y de señales de tránsito
  answer: B
  explanation: De acuerdo con la sección de recordatorios de renovación, 'Cada vez
    que renueve, se le requerirá realizar el examen de la vista y el de señales de
    tránsito'.
- id: 42
  category: license_system
  question: ¿Bajo qué circunstancia puede solicitar una renovación anticipada de su
    licencia de conducir más allá del periodo estándar de renovación de 6 meses?
  choices:
    A: Si va a cumplir 21 años
    B: Si va a salir del estado o del país por un tiempo prolongado
    C: Si va a comprar un vehículo nuevo
    D: Si ha perdido su recordatorio de renovación
  answer: B
  explanation: 'El manual establece una excepción: ''Si va a salir del estado o del
    país por un tiempo prolongado, puede solicitar una renovación anticipada de su
    licencia de conducir en su oficina local de licencias''.'
- id: 43
  category: license_system
  question: ¿Cuál es el costo de una tarjeta de identificación para no conductores
    (Nondriver ID Card) solo para fines de votación para un solicitante que tiene
    17 años y medio?
  choices:
    A: $0.00
    B: $14.00
    C: $16.50
    D: $24.00
  answer: A
  explanation: La tabla de tarifas de licencias indica que el costo de una tarjeta
    de identificación para no conductores (solo para fines de votación) para una edad
    mínima de 17 años y medio es de $0.00.
- id: 44
  category: driver_testing
  question: Si no renueva su licencia de conducir dentro de los seis meses (184 días)
    posteriores a su fecha de vencimiento, ¿qué exámenes adicionales debe realizar?
  choices:
    A: Solo el examen de la vista
    B: Solo el examen de señales de tránsito
    C: Los exámenes escrito y de conducción
    D: Un examen químico
  answer: C
  explanation: Si no renueva su licencia dentro de los seis meses (o 184 días) posteriores
    a su fecha de vencimiento, tendrá que realizar los exámenes escrito y de conducción,
    además de los exámenes de la vista y de señales de tránsito.
- id: 45
  category: license_system
  question: ¿Cuánto tiempo tiene un miembro de las fuerzas armadas para renovar una
    licencia vencida de otro estado sin volver a examinarse después de una baja honorable?
  choices:
    A: Hasta 30 días
    B: Hasta 90 días
    C: Hasta seis meses
    D: Hasta un año
  answer: C
  explanation: Missouri permite una renovación sin volver a examinarse para los miembros
    de las fuerzas armadas cuya licencia haya vencido mientras estaban fuera del estado,
    por un periodo de hasta seis meses a partir de la baja honorable o dentro de los
    90 días posteriores al restablecimiento de la residencia.
- id: 46
  category: license_system
  question: ¿Cuál es una opción para ahorrar tiempo si su licencia se pierde o es
    robada y vence dentro de los próximos seis meses?
  choices:
    A: Conducir sin licencia hasta que venza
    B: Renovar su licencia anticipadamente en lugar de obtener un duplicado
    C: Solicitar un permiso temporal de 30 días
    D: Esperar hasta la fecha de vencimiento para solicitar una nueva
  answer: B
  explanation: Si su licencia se pierde, es robada o se destruye y vence dentro de
    los próximos seis meses, puede renovar su licencia anticipadamente en lugar de
    obtener un duplicado para ahorrar tiempo y dinero.
- id: 47
  category: license_system
  question: ¿Puede renovar su licencia de conducir no comercial mientras su privilegio
    de conducir está suspendido?
  choices:
    A: No, debe esperar hasta que se levante la suspensión
    B: Sí, pero solo si vuelve a realizar el examen de conducción
    C: Sí, puede realizar los exámenes de la vista y de señales de tránsito y renovarla
    D: No, las licencias suspendidas se cancelan permanentemente
  answer: C
  explanation: Si poseía una licencia de conducir no comercial, puede realizar los
    exámenes de la vista y de señales de tránsito y renovar su licencia incluso mientras
    su privilegio de conducir esté suspendido.
- id: 48
  category: license_system
  question: ¿Qué símbolo aparece en la parte frontal de su licencia de conducir si
    autoriza un indicador de donante de órganos?
  choices:
    A: Un lazo azul
    B: Un corazón rojo con un estandarte verde
    C: Una cruz verde
    D: Una insignia roja de alerta médica
  answer: B
  explanation: Si dice 'sí' para agregar el símbolo de donante de órganos, aparecerá
    un corazón rojo con un estandarte verde en la parte frontal de su permiso de instrucción,
    licencia de conducir o identificación de no conductor.
- id: 49
  category: license_system
  question: ¿Cuál es la tarifa para colocar el símbolo de donante de órganos en su
    licencia de conducir o para ser agregado al registro?
  choices:
    A: $1
    B: $5
    C: $10
    D: No hay ningún cargo
  answer: D
  explanation: 'El manual establece explícitamente: ''No hay ningún cargo por colocar
    el símbolo en su permiso de instrucción, licencia de conducir o identificación
    de no conductor, ni por incluir su nombre en el registro''.'
- id: 50
  category: license_system
  question: Al solicitar una licencia de conducir, ¿el empleado está obligado a preguntarle
    si desea realizar una donación monetaria a cuál de los siguientes fondos?
  choices:
    A: Al fondo de mantenimiento de carreteras
    B: Al fondo de donantes de órganos o al fondo de concientización sobre la ceguera
    C: Al fondo de escuelas públicas
    D: Al fondo de asistencia para veteranos
  answer: B
  explanation: Cuando solicita una licencia de conducir, permiso o identificación
    de no conductor, el empleado debe preguntarle si desea realizar una donación monetaria
    al fondo de donantes de órganos o al fondo de concientización sobre la ceguera.
- id: 51
  category: license_system
  question: ¿Qué indica la anotación 'DHH' en una licencia de conducir de Missouri
    al personal de emergencia?
  choices:
    A: El conductor es un Ayudante de Carretera Designado (Designated Highway Helper)
    B: El conductor tiene una autorización del Departamento de Salud y Hospitales
    C: El conductor es sordo o tiene dificultades auditivas (DHH)
    D: El conductor tiene un endoso de transporte pesado dual
  answer: C
  explanation: La anotación 'DHH' permite que las fuerzas del orden o el personal
    médico y de emergencia determinen fácilmente si usted es sordo o tiene dificultades
    auditivas en caso de una emergencia.
- id: 52
  category: license_system
  question: ¿Cuál es el costo adicional al agregar inicialmente un indicador de seguridad
    para navegantes a su licencia de conducir?
  choices:
    A: No hay costo adicional
    B: $1
    C: $5
    D: $10
  answer: B
  explanation: Se agregará un costo adicional de $1 a las tarifas de procesamiento
    estándar cuando se agregue inicialmente el indicador de identificación de navegante
    a una licencia de conducir o a un documento de identificación de no conductor.
- id: 53
  category: license_system
  question: ¿Qué se requiere para que se coloque un indicador de discapacidad permanente
    en su licencia de conducir?
  choices:
    A: Una solicitud verbal en la oficina de licencias
    B: Una Declaración del Médico (Formulario 5294) firmada por un profesional de
      la salud autorizado
    C: Prueba de recibir beneficios por discapacidad del seguro social
    D: Una tarifa de procesamiento de $5
  answer: B
  explanation: Para ser elegible para el indicador de discapacidad permanente, debe
    presentar una Declaración del Médico (Formulario 5294) - Indicador de Discapacidad
    Permanente completada y firmada por su médico, terapeuta físico, terapeuta ocupacional
    u otro profesional de la salud autorizado.
- id: 54
  category: driver_responsibility
  question: ¿Qué sucede si no recibe un recordatorio para renovar su licencia de conducir?
  choices:
    A: La fecha de vencimiento de su licencia se extiende automáticamente por 30 días
    B: Está exento de realizar el examen de la vista al renovar
    C: Sigue siendo su responsabilidad renovarla, y puede ser multado por conducir
      sin una licencia válida
    D: Debe esperar hasta que llegue el recordatorio para renovar su licencia
  answer: C
  explanation: Es su responsabilidad renovar su licencia de conducir, incluso si no
    recibe su recordatorio. Puede ser multado por conducir sin una licencia válida.
- id: 55
  category: license_system
  question: ¿Existe un cargo adicional por agregar una anotación de alerta médica
    a su licencia de conducir de Missouri?
  choices:
    A: Sí, hay un cargo de $5.
    B: Sí, hay un cargo de $10.
    C: No, no hay costo adicional.
    D: Sí, pero solo para ciertas condiciones médicas.
  answer: C
  explanation: Según el manual, no hay costo adicional para agregar la anotación de
    alerta médica a su licencia de conducir o identificación de no conductor.
- id: 56
  category: penalties_and_points
  question: Si es menor de 18 años, ¿cómo puede un padre o tutor cancelar su licencia
    de conducir?
  choices:
    A: Confiscando su tarjeta de licencia física.
    B: Presentando una Solicitud de Padre o Tutor para Denegar una Licencia de Conducir
      (Formulario 4811).
    C: Llamando al departamento de policía local para denunciarlo.
    D: Eliminándolo de su póliza de seguro de automóvil.
  answer: B
  explanation: Si es menor de 18 años, su padre o tutor puede solicitar que el Director
    de Ingresos deniegue o cancele su licencia presentando el Formulario 4811.
- id: 57
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una razón válida por la cual su licencia de
    conducir de Missouri puede ser suspendida o revocada?
  choices:
    A: No votar en una elección local.
    B: Recibir una sola multa de estacionamiento.
    C: No pagar la manutención de los hijos.
    D: Conducir a 5 mph sobre el límite de velocidad una vez.
  answer: C
  explanation: El manual enumera 'No pagar la manutención de los hijos' como una de
    las razones por las que puede perder su licencia.
- id: 58
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por cambiar la información en su licencia
    de conducir para intentar comprar alcohol?
  choices:
    A: Recibirá una carta de advertencia.
    B: Debe tomar un curso obligatorio de conducción defensiva.
    C: Su licencia puede ser revocada o suspendida.
    D: Debe pagar una multa de $50 pero conservará su licencia.
  answer: C
  explanation: Cambiar la información en su licencia o usar la licencia de otra persona
    al intentar comprar alcohol se enumera como una razón por la cual su licencia
    puede ser revocada o suspendida.
- id: 59
  category: safe_driving_rules
  question: 'Si es menor de 16 años y tiene un permiso de instrucción, puede conducir
    cuando esté acompañado por una persona que tenga al menos 25 años y tenga licencia
    por un mínimo de tres años, SIEMPRE QUE también tenga:'
  choices:
    A: Un historial de conducción completamente limpio.
    B: Prueba de relación familiar inmediata.
    C: Permiso por escrito de su padre o tutor legal.
    D: La propiedad del vehículo que está conduciendo.
  answer: C
  explanation: Si es menor de 16 años, puede conducir con una persona de al menos
    25 años que haya tenido licencia durante tres años si ha recibido el permiso por
    escrito de su padre o tutor legal.
- id: 60
  category: safe_driving_rules
  question: Si tiene 16 años o más y posee un permiso de instrucción, ¿quién debe
    acompañarlo en el asiento delantero mientras conduce?
  choices:
    A: Una persona que tenga al menos 21 años y tenga una licencia de conducir válida.
    B: Solo un padre o tutor legal.
    C: Cualquier persona que tenga al menos 18 años.
    D: Un instructor de manejo con licencia.
  answer: A
  explanation: A los 16 años o más, puede conducir cuando esté acompañado en el asiento
    delantero por una persona que tenga al menos 21 años y tenga una licencia de conducir
    válida.
- id: 61
  category: license_system
  question: ¿Para obtener una Licencia Intermedia (Intermediate License), cuántas
    horas de instrucción de manejo debe completar?
  choices:
    A: 20 horas, incluyendo 5 horas de conducción nocturna.
    B: 30 horas, incluyendo 10 horas de conducción nocturna.
    C: 40 horas, incluyendo 10 horas de conducción nocturna.
    D: 50 horas, incluyendo 15 horas de conducción nocturna.
  answer: C
  explanation: Debe completar 40 horas de instrucción de manejo, que deben incluir
    al menos diez horas de conducción nocturna, para obtener una Licencia Intermedia.
- id: 62
  category: license_system
  question: ¿Cuánto tiempo debe tener un permiso de instrucción (instruction permit)
    antes de poder obtener una Licencia Intermedia?
  choices:
    A: Al menos 3 meses (90 días).
    B: Al menos 6 meses (182 días).
    C: Al menos 9 meses (270 días).
    D: Al menos 12 meses (365 días).
  answer: B
  explanation: Debe tener un permiso de instrucción por un mínimo de seis meses (182
    días) a partir del día siguiente a la emisión para obtener una Licencia Intermedia.
- id: 63
  category: driver_testing
  question: 'Para obtener una Licencia Intermedia, no debe tener condenas de tráfico
    en los últimos:'
  choices:
    A: 3 meses.
    B: 6 meses.
    C: 12 meses.
    D: 24 meses.
  answer: B
  explanation: Para obtener una Licencia Intermedia, no debe tener condenas relacionadas
    con el alcohol en los últimos 12 meses ni condenas de tráfico en los últimos seis
    meses.
- id: 64
  category: safe_driving_rules
  question: Durante los primeros seis meses de tener una Licencia Intermedia, ¿cuál
    es la restricción sobre los pasajeros?
  choices:
    A: No se permiten pasajeros bajo ninguna circunstancia.
    B: No puede conducir con más de un pasajero menor de 19 años que no sea de su
      familia inmediata.
    C: Puede tener hasta tres pasajeros menores de 19 años que no sean de su familia
      inmediata.
    D: Solo puede conducir con pasajeros que tengan 21 años o más.
  answer: B
  explanation: Durante los primeros seis meses, no puede operar un vehículo motorizado
    con más de un pasajero que sea menor de 19 años y que no sea miembro de su familia
    inmediata.
- id: 65
  category: safe_driving_rules
  question: ¿Después de los primeros seis meses de tener una Licencia Intermedia,
    cuántos pasajeros menores de 19 años (que no sean de su familia inmediata) se
    le permite tener en el vehículo?
  choices:
    A: Ninguno
    B: Uno
    C: Dos
    D: Tres
  answer: D
  explanation: Después de los primeros seis meses, no puede operar un vehículo motorizado
    con más de tres pasajeros que sean menores de 19 años y que no sean miembros de
    su familia inmediata.
- id: 66
  category: safe_driving_rules
  question: ¿Cuáles son las horas de conducción restringidas para el titular de una
    Licencia Intermedia que conduce solo?
  choices:
    A: 10:00 p.m. a 5:00 a.m.
    B: 11:00 p.m. a 6:00 a.m.
    C: 12:00 a.m. a 6:00 a.m.
    D: 1:00 a.m. a 5:00 a.m.
  answer: D
  explanation: No puede conducir solo entre la 1:00 a.m. y las 5:00 a.m., excepto
    para ir o volver de una actividad escolar, trabajo o una emergencia.
- id: 67
  category: license_system
  question: ¿Los solicitantes masculinos de qué rango de edad pueden registrarse en
    el Servicio Selectivo (Selective Service) al momento de su solicitud de licencia
    o permiso?
  choices:
    A: 16 a 18
    B: 18 a 21
    C: 18 a 26
    D: 21 a 30
  answer: C
  explanation: Los solicitantes masculinos, de 18 a 26 años, pueden registrarse en
    el Servicio Selectivo al momento de su solicitud de licencia o permiso.
- id: 68
  category: license_system
  question: ¿Cuáles son sus opciones con respecto a su licencia de conducir cuando
    cumple 21 años?
  choices:
    A: Debe entregar inmediatamente su licencia al estado.
    B: Debe volver a tomar los exámenes escrito y de manejo para eliminar la indicación
      de menor de edad.
    C: Puede solicitar una licencia sin la indicación de menor de edad o esperar hasta
      que expire su licencia actual.
    D: Se le requiere pagar una multa para eliminar la indicación de menor de edad.
  answer: C
  explanation: Según el manual, cuando cumple 21 años, puede solicitar y pagar por
    otra licencia de conducir (sin la indicación de menor de edad) o esperar hasta
    que expire su licencia de conducir para menores de 21 años.
- id: 69
  category: license_system
  question: Si usted es un nuevo residente de Missouri que transfiere una licencia
    de conducir de otro estado, ¿la licencia de otro estado debe ser válida o haber
    expirado hace no más de cuántos días?
  choices:
    A: 30 días
    B: 90 días
    C: 184 días
    D: 365 días
  answer: C
  explanation: Un nuevo residente de Missouri que transfiere una licencia de conducir
    de otro estado debe presentar una licencia de otro estado que sea válida o que
    haya expirado hace no más de 184 días.
- id: 70
  category: driver_testing
  question: Según la Guía del Conductor de Missouri, ¿aproximadamente qué porcentaje
    de todas las personas que toman el examen reprueban el examen escrito la primera
    vez?
  choices:
    A: 25 por ciento
    B: 30 por ciento
    C: 50 por ciento
    D: 75 por ciento
  answer: C
  explanation: El manual recomienda estudiar la guía porque casi el 50 por ciento
    de todas las personas que toman el examen reprueban la primera vez.
- id: 71
  category: license_system
  question: 'Para obtener una Licencia de Conducir Completa para Menores de 21 años,
    no debe haber tenido ninguna infracción relacionada con el alcohol ni condenas
    de tráfico en los últimos:'
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: B
  explanation: Para obtener una Licencia de Conducir Completa para Menores de 21 años,
    no puede tener ninguna infracción relacionada con el alcohol ni condenas de tráfico
    en los últimos 12 meses.
- id: 72
  category: driver_testing
  question: ¿De qué cuatro partes consta el examen de conducir de Missouri?
  choices:
    A: Examen escrito, examen de la vista, examen de señales de tránsito y examen
      de conducción
    B: Examen escrito, examen de audición, examen de señales de tránsito y examen
      de conducción
    C: Examen de la vista, examen físico, examen escrito y examen de conducción
    D: Examen escrito, examen de la vista, examen de reflejos y examen de conducción
  answer: A
  explanation: 'El examen de conducir consta de una prueba de cuatro partes: un examen
    escrito, un examen de la vista, un examen de señales de tránsito y un examen de
    conducción (habilidades).'
- id: 73
  category: driver_testing
  question: Si tiene una licencia de conducir válida de otro estado y solicita el
    mismo tipo de licencia en Missouri, ¿qué exámenes debe realizar?
  choices:
    A: Solo el examen escrito
    B: Solo el examen de conducción
    C: Los exámenes de la vista y de señales de tránsito
    D: Las cuatro partes del examen de conducir
  answer: C
  explanation: Si tiene una licencia de conducir de otro estado que sea válida o haya
    expirado hace menos de 184 días, y solicita el mismo tipo de licencia en Missouri,
    solo tiene que realizar los exámenes de la vista y de señales de tránsito.
- id: 74
  category: driver_testing
  question: ¿Cuántas preguntas tiene el examen escrito de opción múltiple para una
    licencia Clase F (operador)?
  choices:
    A: '20'
    B: '25'
    C: '30'
    D: '40'
  answer: B
  explanation: Si solicita una licencia Clase F (operador), debe realizar un examen
    escrito de opción múltiple de 25 preguntas.
- id: 75
  category: driver_testing
  question: ¿Qué información adicional se incluye en el examen escrito para una licencia
    Clase E (de alquiler/comercial) que NO está en el examen de Clase F?
  choices:
    A: Leyes de seguridad para motocicletas
    B: Información sobre vehículos comerciales
    C: Técnicas avanzadas de estacionamiento en paralelo
    D: Navegación en autopistas interestatales
  answer: B
  explanation: El examen escrito para una licencia Clase E (de alquiler) incluye las
    leyes y métodos de conducción cubiertos en la Guía, pero también incluirá la información
    sobre vehículos comerciales que se encuentra en el Capítulo 15.
- id: 76
  category: driver_testing
  question: ¿Cuál es la agudeza visual mínima estándar requerida para aprobar el examen
    de la vista para una licencia de conducir de Missouri?
  choices:
    A: 20/20 con uno o ambos ojos
    B: 20/30 con uno o ambos ojos
    C: 20/40 con uno o ambos ojos
    D: 20/50 con uno o ambos ojos
  answer: C
  explanation: La agudeza visual mínima estándar es de al menos 20/40 con uno o ambos
    ojos.
- id: 77
  category: driver_testing
  question: 'Usted no puede realizar el examen de conducción ni tener una licencia
    de conducir si su agudeza visual natural y corregida es peor que:'
  choices:
    A: 20/40
    B: 20/80
    C: 20/100
    D: 20/160
  answer: D
  explanation: Si tanto su agudeza visual natural como la corregida son peores que
    20/160, o su visión periférica combinada es inferior a 70 grados, no puede realizar
    el examen de conducción ni tener una licencia de conducir.
- id: 78
  category: vehicle_information
  question: ¿Cuál de los siguientes es un requisito para el vehículo que utilice para
    realizar su examen de conducción?
  choices:
    A: Debe tener una cámara de reversa.
    B: Debe tener dos juegos de frenos (de estacionamiento y de pedal) en buen estado
      de funcionamiento.
    C: Debe tener menos de 10 años de antigüedad.
    D: Debe tener transmisión automática.
  answer: B
  explanation: El vehículo utilizado para el examen de conducción debe tener dos juegos
    de frenos (de estacionamiento y de pedal) en buen estado de funcionamiento, entre
    otros requisitos de seguridad.
- id: 79
  category: driver_testing
  question: ¿A quién se le permite ir en el vehículo con usted durante su examen de
    conducción?
  choices:
    A: Solo el examinador de licencias de conducir
    B: El examinador y uno de los padres o tutor
    C: El examinador y su instructor de manejo
    D: Cualquier persona, siempre que se siente en el asiento trasero
  answer: A
  explanation: Usted conducirá y el examinador se sentará a su lado. Nadie más puede
    viajar en el vehículo durante el examen.
- id: 80
  category: driver_testing
  question: 'Durante el examen de conducción, se le pedirá que se estacione en paralelo
    en un espacio que mide:'
  choices:
    A: 20 pies de largo y seis pies de ancho
    B: 25 pies de largo y siete pies de ancho
    C: 30 pies de largo y ocho pies de ancho
    D: 35 pies de largo y nueve pies de ancho
  answer: B
  explanation: Se le pedirá que se estacione en paralelo al bordillo, en un espacio
    de 25 pies de largo y siete pies de ancho.
- id: 81
  category: driver_testing
  question: ¿A cuántas pulgadas del bordillo, como máximo, debe estacionar cuando
    se le evalúe el estacionamiento en paralelo durante el examen de conducción?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: Durante la parte de estacionamiento en paralelo del examen de conducción,
    se le evaluará que estacione a no más de 18 pulgadas del bordillo.
- id: 82
  category: driver_testing
  question: 'Al evaluar su capacidad para dar marcha atrás con el vehículo, el examinador
    comprobará si usted:'
  choices:
    A: Confía únicamente en su espejo retrovisor.
    B: Mira por encima de su hombro derecho para ver a través del vidrio trasero.
    C: Utiliza su cámara de reversa de manera efectiva.
    D: Toca la bocina antes de poner la marcha atrás.
  answer: B
  explanation: Al evaluar la marcha atrás, el examinador comprobará que usted mire
    por encima de su hombro derecho para ver a través del vidrio trasero.
- id: 83
  category: driver_testing
  question: Al realizar el examen de habilidades de conducción, ¿cuál es la distancia
    máxima permitida para estacionar con respecto al bordillo?
  choices:
    A: 12 pulgadas
    B: 18 pulgadas
    C: 24 pulgadas
    D: 36 pulgadas
  answer: B
  explanation: Durante el examen de conducción, se le evaluará que estacione a no
    más de 18 pulgadas del bordillo.
- id: 84
  category: driver_testing
  question: ¿Cuál de las siguientes acciones resultará en la reprobación automática
    de su examen de habilidades de conducción?
  choices:
    A: Perder 15 puntos en el examen
    B: Tardar más de un minuto en estacionar
    C: Negarse a conducir como lo solicita el examinador
    D: Estacionar a 16 pulgadas del bordillo
  answer: C
  explanation: Reprobará el examen si se niega a conducir como lo solicita el examinador,
    si golpea a un peatón, si viola una ley de tránsito o si pierde más de 30 puntos.
- id: 85
  category: driver_testing
  question: ¿Qué se requiere si reprueba el examen de conducción tres veces?
  choices:
    A: Debe esperar seis meses antes de volver a realizar el examen.
    B: Debe enviar un comprobante de capacitación adicional de conducción al volante
      al Departamento de Ingresos (Department of Revenue).
    C: Se le prohíbe permanentemente obtener una licencia de conducir.
    D: Debe pagar una multa de $250 para volver a realizar el examen.
  answer: B
  explanation: Si reprueba el examen de conducción tres veces, debe enviar un comprobante
    de capacitación adicional de conducción al volante y obtener la aprobación para
    realizar el examen por parte del Departamento de Ingresos antes de volver a tomarlo.
- id: 86
  category: penalties_and_points
  question: 'Cometer fraude durante el proceso de examen, como hacer trampa o usar
    un dispositivo de grabación, puede resultar en:'
  choices:
    A: Una advertencia y la repetición inmediata del examen
    B: La pérdida de su privilegio de conducir por hasta un año
    C: Una sentencia de prisión obligatoria de 5 años
    D: Una multa mínima de $500
  answer: B
  explanation: El fraude es un delito menor de Clase 'A' que puede resultar en la
    pérdida de su privilegio de conducir por hasta un año.
- id: 87
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones sobre las leyes de derecho de paso
    es verdadera?
  choices:
    A: La ley otorga el derecho de paso al conductor que entra primero en la intersección.
    B: La ley otorga el derecho de paso a los peatones en todo momento.
    C: La ley establece quién debe ceder el derecho de paso, pero no otorga el derecho
      de paso a nadie.
    D: La ley otorga el derecho de paso a los vehículos que circulan por autopistas
      de varios carriles.
  answer: C
  explanation: La ley establece quién debe ceder el derecho de paso; no otorga el
    derecho de paso a ningún conductor. Usted debe hacer todo lo posible para evitar
    golpear a un peatón o a otro vehículo.
- id: 88
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por una primera infracción por exceso de velocidad
    o por rebasar en una zona de construcción o de trabajo en las carreteras estatales
    de Missouri?
  choices:
    A: $100
    B: $150
    C: $250
    D: $300
  answer: C
  explanation: Si lo sorprenden por exceso de velocidad o rebasando en una zona de
    construcción o zona de trabajo, podría ser multado con un mínimo de $250 por la
    primera infracción.
- id: 89
  category: safe_driving_rules
  question: ¿Bajo qué condición es legal rebasar y adelantar a otro vehículo por la
    derecha?
  choices:
    A: Cuando el vehículo al que está adelantando está girando o está a punto de girar
      a la izquierda.
    B: Cuando usted conduce fuera de la parte pavimentada de la calzada hacia el acotamiento.
    C: Cuando se aproxima a la cima de una colina.
    D: Cuando hay una línea amarilla continua en su lado de la carretera.
  answer: A
  explanation: Puede rebasar por la derecha cuando el vehículo adelantado esté girando
    o esté a punto de girar a la izquierda, siempre que usted no conduzca fuera de
    la parte pavimentada o principal de la calzada.
- id: 90
  category: safe_driving_rules
  question: Se le prohíbe conducir por el lado izquierdo de la calzada para rebasar
    a otro vehículo cuando su visión esté obstruida a menos de cuántos pies de un
    puente, viaducto o túnel?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Ningún vehículo deberá conducirse por el lado izquierdo de la calzada
    cuando la visión esté obstruida al acercarse a menos de 100 pies de cualquier
    puente, viaducto o túnel.
- id: 91
  category: safe_driving_rules
  question: 'Cuando usted está girando a la izquierda en una intersección, debe:'
  choices:
    A: Ceder el paso a los vehículos que vienen en sentido contrario y siguen recto.
    B: Tomar el derecho de paso sobre todos los demás vehículos.
    C: Ceder el paso solo a los vehículos que giran a la derecha.
    D: Esperar a que el semáforo cambie a amarillo antes de avanzar.
  answer: A
  explanation: En las intersecciones, los conductores que giran a la izquierda deben
    ceder el paso a los vehículos que vienen en sentido contrario y siguen recto.
- id: 92
  category: safe_driving_rules
  question: En una intersección donde no hay señal de alto (stop) ni semáforo, ¿a
    quién debe cederle el paso?
  choices:
    A: A los vehículos que vienen por la izquierda
    B: A los vehículos que vienen por la derecha
    C: A los vehículos que giran a la izquierda
    D: A los vehículos que entran desde una entrada privada (driveway)
  answer: B
  explanation: En una intersección donde no hay señal de alto ni semáforo (con excepción
    de las rotondas), los conductores deben ceder el paso a los vehículos que vienen
    por la derecha.
- id: 93
  category: sharing_the_road
  question: ¿Qué debe hacer si se encuentra en una intersección cuando ve o escucha
    que se aproxima un vehículo de emergencia con su sirena y luces intermitentes?
  choices:
    A: Detenerse inmediatamente en medio de la intersección.
    B: Detenerse en el borde izquierdo de la intersección.
    C: Cruzar la intersección antes de detenerse en el borde derecho de la carretera.
    D: Acelerar para despejar la intersección y mantenerse por delante del vehículo
      de emergencia.
  answer: C
  explanation: Si se encuentra en una intersección, cruce la intersección antes de
    detenerse en el borde derecho de la carretera. Permanezca detenido hasta que pase
    el vehículo de emergencia.
- id: 94
  category: sharing_the_road
  question: Al acercarse a un vehículo de emergencia estacionado que muestra luces
    rojas o rojas y azules encendidas en una carretera de varios carriles, ¿qué debe
    hacer si es seguro?
  choices:
    A: Detenerse inmediatamente y esperar a que el vehículo se mueva.
    B: Cambiarse a un carril que no esté adyacente al vehículo estacionado.
    C: Tocar la bocina para alertar a los trabajadores de emergencia.
    D: Mantener su velocidad y permanecer en el carril adyacente.
  answer: B
  explanation: Debe proceder con precaución y, si es seguro hacerlo, realizar un cambio
    de carril a un carril que no esté junto al vehículo estacionado.
- id: 95
  category: sharing_the_road
  question: ¿Con cuánta anticipación encenderá un autobús escolar sus luces amarillas
    de advertencia antes de realizar una parada designada?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Las luces amarillas de advertencia parpadearán 500 pies antes de que
    el autobús llegue a una parada designada para subir o bajar escolares.
- id: 96
  category: driver_testing
  question: 'Durante la parte de retroceso de la prueba de habilidades de conducción,
    el examinador verificará si usted:'
  choices:
    A: Depende únicamente de su espejo retrovisor.
    B: Mira por encima de su hombro derecho para ver a través del vidrio trasero.
    C: Retrocede a una velocidad de al menos 15 mph.
    D: Enciende las luces de emergencia (hazard lights) antes de retroceder.
  answer: B
  explanation: Al realizar la prueba de retroceso, el examinador verificará si está
    mirando por encima de su hombro derecho para ver a través del vidrio trasero.
- id: 97
  category: safe_driving_rules
  question: 'Al acercarse a una intersección de rotonda, usted debe:'
  choices:
    A: Ceder el paso al tráfico que ya está en el círculo y a los peatones en los
      cruces peatonales.
    B: Entrar sin detenerse ya que usted tiene el derecho de paso.
    C: Ceder el paso solo a los vehículos que entran por la derecha.
    D: Detenerse en medio de la rotonda para dejar entrar a otros vehículos.
  answer: A
  explanation: Al acercarse a una intersección de rotonda, siempre ceda el paso al
    tráfico en el círculo y a los peatones en los cruces peatonales. Espere un espacio
    en el tráfico antes de entrar.
- id: 98
  category: sharing_the_road
  question: ¿En cuál de las siguientes situaciones NO es obligatorio detenerse ante
    un autobús escolar con sus luces rojas intermitentes?
  choices:
    A: Cuando viaja en la misma dirección en una carretera de dos carriles
    B: Cuando viaja en la dirección opuesta en una carretera de cuatro o más carriles
    C: Cuando viaja en la dirección opuesta en una carretera de dos carriles
    D: Cuando sigue al autobús en una calle de sentido único de dos carriles
  answer: B
  explanation: No tiene que detenerse cuando viaja en la dirección opuesta a un autobús
    escolar en una carretera que tiene cuatro o más carriles de tráfico.
- id: 99
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima con la que debe señalizar antes de realizar
    un giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: El manual establece que debe señalizar al menos 100 pies antes de girar
    para que los demás conductores puedan estar preparados.
- id: 100
  category: safe_driving_rules
  question: ¿Dónde está específicamente prohibido realizar un giro en U?
  choices:
    A: En una carretera recta y plana de dos carriles
    B: En una intersección controlada por un semáforo o un oficial de policía
    C: En una calle residencial sin tráfico
    D: En un carril designado para giros a la izquierda en ambos sentidos
  answer: B
  explanation: Nunca realice un giro en U en un lugar marcado con una señal de 'No
    U-Turn' (Prohibido girar en U) o en una intersección controlada por un semáforo
    o un oficial de policía.
- id: 101
  category: defensive_driving
  question: ¿Por qué debe evitar abrirse demasiado hacia la izquierda antes de realizar
    un giro a la derecha?
  choices:
    A: Hará que su vehículo pierda tracción
    B: El conductor detrás de usted puede pensar que va a girar a la izquierda e intentar
      rebasarlo por la derecha
    C: Es ilegal cruzar la línea central bajo cualquier circunstancia
    D: Activará incorrectamente los sensores de la señal de tráfico
  answer: B
  explanation: Si se abre demasiado hacia la izquierda antes de un giro a la derecha,
    el conductor detrás de usted puede pensar que está cambiando de carril o que va
    a girar a la izquierda, y podría intentar rebasarlo por la derecha.
- id: 102
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima que un vehículo puede recorrer en un carril
    central de giro a la izquierda de dos sentidos?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El manual especifica que no debe usar un carril de giro a la izquierda
    de dos sentidos como carril de circulación, y un vehículo no puede circular por
    este carril por más de 500 pies.
- id: 103
  category: safe_driving_rules
  question: ¿Cuál de las siguientes maniobras está estrictamente prohibida al entrar
    en una rotonda?
  choices:
    A: Ceder el paso a los peatones
    B: Girar a la izquierda para entrar
    C: Reducir la velocidad antes de entrar
    D: Hacer un ligero giro a la derecha
  answer: B
  explanation: 'Al aproximarse a una rotonda, el manual establece explícitamente:
    "NUNCA gire a la izquierda para entrar en una rotonda".'
- id: 104
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso en una rotonda?
  choices:
    A: Los vehículos que entran a la rotonda
    B: Los vehículos que ya están dentro de la rotonda
    C: Los camiones grandes que se aproximan a la rotonda
    D: Los vehículos que salen de la rotonda
  answer: B
  explanation: Al circular por una rotonda, los vehículos que están dentro de la misma
    tienen el derecho de paso.
- id: 105
  category: defensive_driving
  question: ¿Qué debe hacer si se pasa de la salida prevista mientras circula por
    una rotonda?
  choices:
    A: Detenerse y esperar a que el tráfico se despeje antes de retroceder
    B: Hacer un giro en U dentro de la rotonda
    C: Continuar por la rotonda hasta llegar nuevamente a su salida correspondiente
    D: Cambiar de carril inmediatamente para forzar su salida
  answer: C
  explanation: Si se pasa de su salida, debe continuar circulando por la rotonda hasta
    llegar nuevamente a su salida correspondiente.
- id: 106
  category: sharing_the_road
  question: ¿Cómo debe reaccionar si se aproxima un vehículo de emergencia mientras
    usted conduce dentro de una rotonda?
  choices:
    A: Detenerse inmediatamente dentro de la rotonda para dejarlo pasar
    B: Acelerar y salir lo más rápido posible
    C: Salir inmediatamente y hacerse a la derecha
    D: Detenerse junto a la isla central
  answer: C
  explanation: NUNCA se detenga mientras esté dentro de una rotonda. Si se aproxima
    un vehículo de emergencia mientras está en la rotonda, salga inmediatamente y
    hágase a la derecha.
- id: 107
  category: sharing_the_road
  question: ¿Cuál es el propósito de una zona de rebase para camiones (truck apron)
    en una rotonda?
  choices:
    A: Es un área de estacionamiento designada para vehículos averiados
    B: Es un carril de rebase para automóviles de pasajeros y SUV
    C: Proporciona espacio adicional para las ruedas traseras de los camiones grandes
      al girar
    D: Es una zona segura para que los peatones crucen
  answer: C
  explanation: Una zona de rebase para camiones (truck apron) es el área pavimentada
    en la parte interior de la rotonda para que las ruedas traseras de los camiones
    grandes la utilicen al girar. No debe ser utilizada por automóviles, SUV o camionetas.
- id: 108
  category: safe_driving_rules
  question: ¿Cómo navega un conductor en una intersección con giro en J (J-turn)?
  choices:
    A: Cruzando todos los carriles de tráfico directamente hacia el lado opuesto
    B: Girando a la derecha, incorporándose al carril del extremo izquierdo y luego
      girando a la izquierda
    C: Entrando en una isla circular y cediendo el paso a la izquierda
    D: Usando un carril central de giro a la izquierda de dos sentidos para incorporarse
  answer: B
  explanation: En una intersección con giro en J (J-turn), los conductores giran a
    la derecha en la misma dirección del tráfico, se incorporan al carril del extremo
    izquierdo y luego realizan un giro a la izquierda en la dirección en la que pretenden
    viajar.
- id: 109
  category: driver_responsibility
  question: Según el manual, los gobiernos locales tienen la autoridad para crear
    ordenanzas de tráfico que hagan ¿cuál de las siguientes acciones?
  choices:
    A: Emitir licencias de conducir
    B: Prohibir el uso de dispositivos de advertencia que produzcan sonido
    C: Cambiar la edad mínima de conducción del estado
    D: Eliminar la necesidad de registro de vehículos
  answer: B
  explanation: Las ciudades y pueblos pueden tener regulaciones para varias cosas,
    incluyendo "Prohibir el uso de dispositivos de advertencia que produzcan sonido".
- id: 110
  category: safe_driving_rules
  question: Al realizar un giro donde no hay señales ni marcas en los carriles, ¿hacia
    qué carril debe girar?
  choices:
    A: El carril más alejado de aquel del que proviene
    B: El carril central, independientemente de la dirección
    C: El carril más cercano a aquel del que proviene
    D: Cualquier carril que esté libre de tráfico
  answer: C
  explanation: Si no hay señales ni marcas en los carriles para controlar el giro,
    debe girar desde el carril que esté más cerca de la dirección a la que desea ir,
    y girar hacia el carril más cercano a aquel del que proviene.
- id: 111
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una restricción al usar un carril de giro a
    la izquierda de dos sentidos?
  choices:
    A: No puede usarlo para reducir la velocidad antes de girar a la izquierda
    B: No debe usarlo al entrar a la calzada desde una calle lateral
    C: Solo puede usarlo si conduce un vehículo comercial
    D: Debe viajar en él por al menos 500 pies antes de girar
  answer: B
  explanation: 'El manual establece con respecto a los carriles de giro a la izquierda
    de dos sentidos: "no use este carril al entrar a la calzada desde una calle lateral".'
- id: 112
  category: sharing_the_road
  question: 'Al viajar en el mismo carril que una motocicleta, usted debe:'
  choices:
    A: Compartir el carril para mejorar el flujo del tráfico.
    B: No compartir el carril, ya que el motociclista necesita el carril completo.
    C: Conducir de cerca detrás de ellos para reducir la resistencia al viento.
    D: Rebasarlos dentro del mismo carril si es lo suficientemente ancho.
  answer: B
  explanation: Según el manual, no debe compartir el carril con una motocicleta porque
    el motociclista necesita el carril completo por razones de seguridad.
- id: 113
  category: license_system
  question: ¿Qué se requiere para conducir legalmente una motocicleta en las calles
    públicas?
  choices:
    A: Solo una licencia de conducir estándar Clase F.
    B: Una licencia de conducir válida con un endoso de motocicleta o una licencia
      de motocicleta.
    C: Una licencia de conducir comercial (CDL).
    D: Un permiso especial de la patrulla de caminos.
  answer: B
  explanation: Para conducir cualquier motocicleta en las calles públicas, debe tener
    una licencia de conducir válida con un endoso de motocicleta o una licencia de
    motocicleta.
- id: 114
  category: sharing_the_road
  question: ¿Qué es la "Zona-No" (No-Zone) en referencia a los camiones grandes y
    autobuses?
  choices:
    A: El área de estacionamiento designada para vehículos comerciales.
    B: Los puntos ciegos a cada lado, en la parte trasera y en la parte delantera
      del vehículo.
    C: El carril restringido para camiones que viajan por pendientes pronunciadas.
    D: El área cerca de las estaciones de pesaje donde no se permiten automóviles.
  answer: B
  explanation: Un camión o autobús tiene puntos ciegos a cada lado, en la parte trasera
    y en la parte delantera donde no se puede ver un automóvil. Estos puntos ciegos
    se conocen como la "Zona-No" (No-Zone).
- id: 115
  category: vehicle_information
  question: ¿Aproximadamente cuánto tiempo le toma a un camión con remolque (tractor-trailer)
    totalmente cargado que viaja a 55 mph detenerse por completo?
  choices:
    A: De 130 a 140 pies.
    B: 200 pies.
    C: Casi 400 pies.
    D: Más de 600 pies.
  answer: C
  explanation: Mientras que un automóvil de pasajeros promedio a 55 mph puede detenerse
    en unos 130-140 pies, un camión con remolque totalmente cargado puede tardar casi
    400 pies en detenerse por completo.
- id: 116
  category: signs_and_signals
  question: ¿Qué debe hacer como peatón si aparece una señal intermitente de "No cruzar"
    (Don't Walk) mientras ya está cruzando la calle?
  choices:
    A: Detenerse en medio del paso de peatones y esperar.
    B: Dar la vuelta y regresar a la acera de donde empezó.
    C: Correr lo más rápido posible hacia el otro lado.
    D: Terminar de cruzar la calle.
  answer: D
  explanation: El manual establece que si la señal intermitente de "No cruzar" (Don't
    Walk) aparece cuando está cruzando la calle, puede terminar de cruzar la calle.
- id: 117
  category: safe_driving_rules
  question: Al rebasar un camión grande, ¿cuándo es seguro volver a entrar al carril
    delante del camión?
  choices:
    A: Tan pronto como su parachoques trasero pase la parte delantera del camión.
    B: Cuando pueda ver la cabina del camión en su espejo retrovisor.
    C: Inmediatamente después de activar su señal de giro a la derecha.
    D: Cuando el conductor del camión parpadee sus faros delanteros.
  answer: B
  explanation: Después de rebasar un camión, asegúrese de poder ver la cabina del
    camión en su espejo retrovisor antes de volver a entrar al carril.
- id: 118
  category: defensive_driving
  question: Como motociclista, ¿cuánta distancia de seguridad debe dejar al rebasar
    por la izquierda a un vehículo estacionado o en movimiento?
  choices:
    A: Uno a dos pies.
    B: Tres a cuatro pies.
    C: Cinco a seis pies.
    D: Al menos el ancho de un carril completo.
  answer: B
  explanation: Los motociclistas deben dejar de tres a cuatro pies de distancia de
    seguridad al rebasar por la izquierda a un vehículo estacionado o en movimiento
    para evitar puertas de automóviles que se abren repentinamente o para permitir
    que un vehículo se desvíe.
- id: 119
  category: sharing_the_road
  question: Si un peatón cruza la carretera en medio de una cuadra donde no hay un
    paso de peatones, ¿quién tiene el derecho de paso?
  choices:
    A: El peatón siempre tiene el derecho de paso.
    B: El peatón debe ceder el derecho de paso a todo el tráfico.
    C: Los vehículos deben detenerse y ceder el paso al peatón.
    D: El derecho de paso pertenece a la parte que se mueva más rápido.
  answer: B
  explanation: Al cruzar en medio de la cuadra sin un paso de peatones, un peatón
    debe ceder el derecho de paso a todo el tráfico.
- id: 120
  category: sharing_the_road
  question: ¿Por qué un camión grande podría abrirse hacia la izquierda antes de realizar
    un giro?
  choices:
    A: Para permitir que los autos pasen por la derecha.
    B: Como primer paso para realizar un giro a la derecha debido a su gran tamaño.
    C: Para revisar sus puntos ciegos del lado izquierdo.
    D: Para ganar más velocidad antes de entrar en la intersección.
  answer: B
  explanation: Debido a su tamaño, los camiones grandes pueden abrirse hacia la izquierda
    como primer paso para realizar un giro a la derecha.
- id: 121
  category: safe_driving_rules
  question: 'Si un vehículo delante de usted se ha detenido o ha reducido la velocidad
    para ceder el paso a un peatón, usted debe:'
  choices:
    A: Tocar la bocina para advertir al peatón y continuar.
    B: Rebasar el vehículo por la izquierda si el carril está despejado.
    C: Rebasar el vehículo por la derecha usando el acotamiento.
    D: No rebasar el vehículo.
  answer: D
  explanation: Como conductor, no debe rebasar a un vehículo que se ha detenido o
    ha reducido la velocidad para ceder el paso a un peatón.
- id: 122
  category: defensive_driving
  question: ¿Por qué es peligroso subestimar la velocidad de un camión de carga (tractor-trailer)
    que se aproxima?
  choices:
    A: Porque a menudo parecen viajar más rápido de lo que realmente van.
    B: Porque su gran tamaño hace que parezcan viajar más lentamente que su velocidad
      real.
    C: Porque frecuentemente aceleran al acercarse a las intersecciones.
    D: Porque sus faros son más tenues que los de los automóviles de pasajeros.
  answer: B
  explanation: Nunca subestime el tamaño y la velocidad de un camión de carga (tractor-trailer)
    que se aproxima. Debido a su gran tamaño, un camión de carga a menudo parece viajar
    más lentamente que su velocidad real.
- id: 123
  category: sharing_the_road
  question: ¿Por qué podría un motociclista cambiar repentinamente de velocidad o
    de posición en el carril?
  choices:
    A: Para evitar que los autos los rebasen.
    B: Para reaccionar ante malas condiciones de la carretera, como tapas de alcantarilla
      o escombros en el camino.
    C: Porque sus vehículos son más ligeros y más difíciles de maniobrar en pavimento
      liso.
    D: Para indicar que están a punto de dar una vuelta en U.
  answer: B
  explanation: Los motociclistas cambian de velocidad y de posición en el carril cuando
    encuentran malas condiciones en la carretera, como tapas de alcantarilla, vías
    de ferrocarril diagonales, escombros en el camino o ante vientos fuertes.
- id: 124
  category: driver_responsibility
  question: 'Según el manual, los municipios, ciudades y pueblos tienen la autoridad
    para promulgar regulaciones que:'
  choices:
    A: Emitan licencias de conducir comerciales.
    B: Prohíban que los vehículos comerciales utilicen ciertas calles.
    C: Anulen los límites de velocidad de las autopistas estatales en las carreteras
      interestatales.
    D: Eximan a las motocicletas de las leyes sobre el uso del casco.
  answer: B
  explanation: Las ciudades y los pueblos pueden tener regulaciones para realizar
    varias acciones, incluyendo la prohibición de que los vehículos comerciales utilicen
    ciertas calles.
- id: 125
  category: defensive_driving
  question: ¿Cómo puede saber si está conduciendo demasiado cerca detrás de un camión
    grande o autobús?
  choices:
    A: No puede ver al conductor en sus espejos retrovisores.
    B: Puede leer la placa de matrícula con claridad.
    C: Las luces de freno del camión parecen excesivamente brillantes.
    D: Se encuentra a menos de 100 pies del vehículo.
  answer: A
  explanation: Si conduce detrás de un camión o un autobús y no puede ver al conductor
    en sus espejos retrovisores, el conductor de ese vehículo no puede verlo a usted.
- id: 126
  category: safe_driving_rules
  question: Si usted camina como peatón y no hay una acera disponible, ¿cómo debe
    caminar?
  choices:
    A: Camine en la misma dirección que el tráfico.
    B: Camine de frente al tráfico.
    C: Camine por el centro de la carretera.
    D: Camine por el lado derecho de la carretera, independientemente del flujo del
      tráfico.
  answer: B
  explanation: El manual establece que los peatones deben caminar de frente al tráfico
    cuando no hay una acera disponible.
- id: 127
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor cuando un peatón guiado por un perro o que
    lleva un bastón blanco está cruzando la calle?
  choices:
    A: Tocar la bocina para alertarlo
    B: Reducir la velocidad y proceder con precaución
    C: Detenerse por completo
    D: Maniobrar alrededor del peatón
  answer: C
  explanation: Cuando un peatón cruza una calle o carretera guiado por un perro o
    llevando un bastón blanco (o un bastón blanco con punta roja), los vehículos deben
    detenerse por completo.
- id: 128
  category: safe_driving_rules
  question: ¿Cuándo debe obedecer un límite de velocidad más bajo en una zona escolar?
  choices:
    A: Solo durante las horas de la mañana
    B: Cuando las luces estén parpadeando o haya niños presentes
    C: Solo cuando haya un guardia de cruce presente
    D: En todo momento, las 24 horas del día
  answer: B
  explanation: Debe obedecer un límite de velocidad más bajo en una zona escolar cuando
    las luces estén parpadeando o haya niños presentes.
- id: 129
  category: sharing_the_road
  question: 'Al rebasar una bicicleta o un ciclomotor (moped), usted debe:'
  choices:
    A: Pasar ajustadamente si el carril es estrecho
    B: Tocar la bocina para que se muevan a un lado
    C: Darles el ancho completo de un carril
    D: Rebasar lo más cerca posible
  answer: C
  explanation: Al rebasar, dé a las bicicletas y ciclomotores (mopeds) el ancho completo
    de un carril. No intente pasar ajustadamente junto a estos usuarios de la vía.
- id: 130
  category: sharing_the_road
  question: ¿Cuándo se le permite cruzar un carril para bicicletas designado?
  choices:
    A: Al rebasar a otro vehículo motorizado
    B: Al girar o al entrar o salir de la calzada
    C: Siempre que necesite espacio adicional para maniobrar
    D: Nunca se le permite cruzar un carril para bicicletas
  answer: B
  explanation: Puede cruzar un carril para bicicletas al girar o al entrar o salir
    de la calzada. Debe ceder el paso a los ciclistas en un carril para bicicletas.
- id: 131
  category: sharing_the_road
  question: 'Al conducir una bicicleta o un ciclomotor en calles públicas, usted debe:'
  choices:
    A: Circular siempre en sentido contrario al tráfico
    B: Circular siempre a favor del tráfico, nunca en contra
    C: Circular por la acera siempre que sea posible
    D: Zigzaguear entre los autos estacionados
  answer: B
  explanation: En las calles y carreteras públicas, usted tiene los mismos derechos
    y responsabilidades que el conductor de un vehículo motorizado. Circule siempre
    a favor del tráfico, nunca en contra.
- id: 132
  category: safe_driving_rules
  question: ¿Dónde es ilegal conducir un ciclomotor?
  choices:
    A: En calles residenciales
    B: En calles y carreteras públicas
    C: En cualquier parte del sistema de autopistas interestatales federales
    D: En carreteras con un límite de velocidad superior a 35 mph
  answer: C
  explanation: La ley no permite conducir un ciclomotor en ninguna parte del sistema
    de autopistas interestatales federales.
- id: 133
  category: vehicle_information
  question: 'Los frenos de un ciclomotor o bicicleta deben ser capaces de detener
    el vehículo en un tramo de:'
  choices:
    A: 15 pies al viajar a 10 mph
    B: 25 pies al viajar a 10 mph
    C: 50 pies al viajar a 20 mph
    D: 100 pies al viajar a 30 mph
  answer: B
  explanation: Sus frenos deben ser capaces de detenerlo en un tramo de 25 pies cuando
    viaje a diez mph.
- id: 134
  category: vehicle_information
  question: 'Al andar en bicicleta entre media hora después de la puesta del sol y
    media hora antes del amanecer, debe tener una luz blanca en la parte delantera
    visible desde al menos:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: C
  explanation: Debe tener una luz blanca en la parte delantera de su bicicleta o llevarla
    con usted para que otros conductores puedan verla desde 500 pies.
- id: 135
  category: vehicle_information
  question: 'Al andar en bicicleta por la noche, su reflector rojo trasero o luz roja
    trasera debe ser visible cuando sea reflejado por las luces bajas de los faros
    a:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: D
  explanation: Debe tener un reflector rojo trasero, de al menos dos pulgadas cuadradas,
    o una luz roja trasera que los conductores puedan ver cuando sea reflejada por
    las luces bajas de sus vehículos a 600 pies.
- id: 136
  category: license_system
  question: ¿Requiere la operación de una bicicleta eléctrica una licencia de conducir?
  choices:
    A: Sí, se requiere una licencia de operador estándar
    B: Sí, se requiere una licencia de motocicleta
    C: No, no requiere una licencia de operador ni de motocicleta
    D: Sí, se requiere una licencia de conducir comercial
  answer: C
  explanation: La operación de una bicicleta eléctrica, según lo definido por 301.010
    RSMo, no requiere que el ciclista posea una licencia de operador o una licencia
    de motocicleta.
- id: 137
  category: sharing_the_road
  question: ¿Cuál de los siguientes tiene el derecho de paso en todas las intersecciones,
    independientemente de cualquier dispositivo de control de tráfico (excepto los
    vehículos de emergencia)?
  choices:
    A: Ciclistas
    B: Ciclomotores
    C: Una procesión funeraria organizada
    D: Peatones fuera de los cruces peatonales
  answer: C
  explanation: Una procesión funeraria organizada tiene el derecho de paso en todas
    las intersecciones, independientemente de cualquier dispositivo de control de
    tráfico, excepto para los vehículos de emergencia o cuando los oficiales de la
    ley indiquen lo contrario.
- id: 138
  category: safe_driving_rules
  question: Si conduce un vehículo en una procesión funeraria, ¿qué debe utilizar?
  choices:
    A: Sus luces altas
    B: Su bocina en cada intersección
    C: Sus luces de emergencia intermitentes
    D: Su señal de giro a la izquierda continuamente
  answer: C
  explanation: Cada vehículo en la procesión debe usar sus luces de emergencia intermitentes.
- id: 139
  category: sharing_the_road
  question: 'Un ciclista puede moverse hacia el centro o la izquierda del carril cuando:'
  choices:
    A: El carril es demasiado estrecho para compartirlo con otro vehículo
    B: Quieren circular uno al lado del otro con un amigo
    C: Viajan más lento que el flujo del tráfico
    D: Se aproximan a una colina
  answer: A
  explanation: 'Puede moverse más hacia el centro o la izquierda del carril o de la
    calzada, según corresponda, cuando: realice un giro a la izquierda; evite peligros;
    el carril sea demasiado estrecho para compartirlo con otro vehículo; o haya un
    carril exclusivo para girar a la derecha y usted siga recto.'
- id: 140
  category: sharing_the_road
  question: ¿Cuándo tiene una procesión funeraria organizada el derecho de paso en
    una intersección?
  choices:
    A: Solo cuando el semáforo está en verde.
    B: En todas las intersecciones, independientemente de los dispositivos de control
      de tráfico, excepto para los vehículos de emergencia.
    C: Solo en las paradas de cuatro vías.
    D: Nunca tienen el derecho de paso sobre el tráfico regular.
  answer: B
  explanation: Según el manual, una procesión funeraria organizada tiene el derecho
    de paso en todas las intersecciones, independientemente de cualquier dispositivo
    de control de tráfico, excepto para los vehículos de emergencia o cuando la ley
    lo indique de otra manera.
- id: 141
  category: sharing_the_road
  question: ¿Si usted no forma parte de un cortejo fúnebre organizado, cuál es la
    regla con respecto a rebasar el cortejo?
  choices:
    A: Puede rebasar en cualquier momento si toca la bocina.
    B: Puede rebasar solo si utiliza el acotamiento derecho.
    C: Nunca debe rebasar un cortejo fúnebre bajo ninguna circunstancia.
    D: No puede rebasar a ningún vehículo del cortejo, excepto donde se haya habilitado
      específicamente un carril de rebase.
  answer: D
  explanation: El manual establece que los conductores que no participan en un cortejo
    fúnebre no deben intentar rebasar a ningún vehículo del cortejo, excepto donde
    se haya habilitado específicamente un carril de rebase.
- id: 142
  category: defensive_driving
  question: ¿Qué número debe marcar en su teléfono celular para reportar un incidente
    de furia al volante después de salir de la carretera de manera segura?
  choices:
    A: '*44'
    B: '*55 (o 911 si se encuentra en un área metropolitana)'
    C: '*HP'
    D: '411'
  answer: B
  explanation: Cuando se enfrente a una situación de furia al volante, el manual aconseja
    salir de la carretera a un área segura y marcar *55 (o 911 si se encuentra en
    un área metropolitana).
- id: 143
  category: penalties_and_points
  question: ¿Cuál es la sanción máxima si un juez lo declara culpable de tirar basura?
  choices:
    A: Una multa de $500 y 30 días de cárcel.
    B: Una multa de $1,000 y/o hasta un año de cárcel.
    C: Una multa de $2,000 y la suspensión de la licencia.
    D: Una multa de $100 y servicio comunitario.
  answer: B
  explanation: Tirar basura es contra la ley. Si un juez lo declara culpable de tirar
    basura, es posible que deba pagar una multa de hasta $1,000 y/o pasar hasta un
    año en la cárcel.
- id: 144
  category: safe_driving_rules
  question: ¿Dónde se le permite normalmente estacionar en una calle de un solo sentido?
  choices:
    A: Solo en el lado derecho.
    B: Solo en el lado izquierdo.
    C: Ya sea en el lado derecho o en el izquierdo.
    D: Nunca se permite estacionar en calles de un solo sentido.
  answer: C
  explanation: El manual establece que en las calles de un solo sentido, normalmente
    se puede estacionar tanto en el lado derecho como en el izquierdo de la calle.
- id: 145
  category: safe_driving_rules
  question: Al salir de un vehículo estacionado en una calle, ¿cómo deben salir los
    pasajeros, especialmente los niños?
  choices:
    A: Por el lado de la calle para evitar a los peatones.
    B: Por el lado de la acera.
    C: Por el maletero.
    D: Por el lado que esté más cerca de su asiento.
  answer: B
  explanation: El manual aconseja que los pasajeros, especialmente los niños, salgan
    siempre del vehículo por el lado de la acera para evitar el tráfico.
- id: 146
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar las ruedas al estacionar en una colina para
    evitar que el vehículo ruede hacia el tráfico?
  choices:
    A: Bruscamente hacia el centro de la carretera.
    B: Hacia adelante en línea recta.
    C: Bruscamente hacia el lado de la carretera.
    D: Ligeramente hacia el carril izquierdo.
  answer: C
  explanation: Cuando estacione en una colina, debe girar las ruedas bruscamente hacia
    el lado de la carretera para que, si el vehículo comienza a rodar cuesta abajo,
    lo haga lejos del tráfico.
- id: 147
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una zona designada donde no se permite estacionar?
  choices:
    A: A lo largo de un bordillo que esté pintado de amarillo.
    B: En el lado derecho de una calle de un solo sentido.
    C: En un estacionamiento techado designado.
    D: En una calle con un límite de velocidad superior a 35 mph.
  answer: A
  explanation: El manual enumera varias áreas donde no se puede estacionar, incluyendo
    a lo largo de un bordillo que esté pintado de amarillo.
- id: 148
  category: penalties_and_points
  question: ¿Cuál es la multa por estacionar ilegalmente en un espacio marcado con
    el Símbolo Internacional de Acceso (estacionamiento para personas con discapacidad)?
  choices:
    A: No menos de $10 y no más de $50.
    B: No menos de $50 y no más de $300.
    C: Exactamente $500.
    D: Hasta $1,000.
  answer: B
  explanation: Los infractores que se estacionen ilegalmente en espacios para personas
    con discapacidad, al ser condenados, serán castigados con una multa de no menos
    de cincuenta dólares ($50) y no más de trescientos dólares ($300).
- id: 149
  category: safe_driving_rules
  question: ¿Cuándo es ilegal usar el cartel (placard) de una persona con discapacidad
    para estacionar en un espacio designado para personas con discapacidad?
  choices:
    A: Cuando la persona con discapacidad conduce el vehículo.
    B: Cuando se está dejando a la persona con discapacidad en un lugar.
    C: Cuando la persona con discapacidad no está siendo transportada en ese momento.
    D: Cuando el vehículo está estacionado por menos de 15 minutos.
  answer: C
  explanation: Es ilegal usar el cartel o las placas de matrícula de una persona con
    discapacidad para estacionar en espacios de estacionamiento designados para personas
    con discapacidad si la persona con discapacidad no está siendo transportada en
    ese momento.
- id: 150
  category: safe_driving_rules
  question: Al comenzar a estacionar en paralelo, ¿a qué distancia a la izquierda
    del vehículo que está delante del espacio de estacionamiento debe detenerse?
  choices:
    A: A unas 6 pulgadas.
    B: A aproximadamente 1½ pies.
    C: A aproximadamente 3 pies.
    D: A aproximadamente 5 pies.
  answer: B
  explanation: Para comenzar a estacionar en paralelo, debe detenerse a la par del
    vehículo que está delante del espacio de estacionamiento, a aproximadamente 1½
    pies a la izquierda de ese vehículo.
- id: 151
  category: safe_driving_rules
  question: ¿En una carretera con cuatro o más carriles, cuándo se le permite conducir
    en el carril izquierdo?
  choices:
    A: En cualquier momento, siempre que conduzca al límite de velocidad.
    B: Solo cuando conduce un vehículo comercial.
    C: Al rebasar tráfico más lento, permitir que otro conductor entre de forma segura
      o prepararse para un giro a la izquierda.
    D: Solo durante las horas del día.
  answer: C
  explanation: En carreteras con cuatro o más carriles, manténgase siempre a la derecha
    a menos que esté rebasando tráfico más lento, permitiendo que otro conductor tenga
    espacio para entrar de forma segura o preparándose para realizar un giro legal
    a la izquierda.
- id: 152
  category: safe_driving_rules
  question: ¿Cuándo es permisible rebasar a un vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante conduce por debajo del límite de velocidad.
    B: Cuando el vehículo de adelante está realizando un giro a la izquierda, siempre
      que no utilice el acotamiento o la parte no pavimentada de la carretera.
    C: Siempre que haya suficiente espacio en el acotamiento derecho.
    D: Nunca es permisible rebasar por la derecha.
  answer: B
  explanation: Puede usar el carril derecho al rebasar a un vehículo que está realizando
    un giro a la izquierda. Sin embargo, nunca debe usar el acotamiento o la parte
    no pavimentada de la carretera para rebasar.
- id: 153
  category: defensive_driving
  question: ¿Cuál es la mejor manera de revisar sus "puntos ciegos" antes de rebasar
    a un vehículo en una carretera de cuatro carriles?
  choices:
    A: Tocar la bocina para alertar a otros conductores.
    B: Confiar totalmente en su espejo retrovisor interior.
    C: Mirar brevemente por encima de su hombro.
    D: Hacer destellos con las luces delanteras.
  answer: C
  explanation: Mirar por encima de su hombro izquierdo es importante porque le permite
    revisar los "puntos ciegos", que son espacios que no puede ver con sus espejos
    retrovisores.
- id: 154
  category: vehicle_information
  question: ¿Cómo debe asegurar su vehículo al estacionar si tiene transmisión manual?
  choices:
    A: Dejarlo en punto muerto (neutral) y no poner el freno de estacionamiento.
    B: Dejarlo en posición de estacionamiento (park) y poner el freno de estacionamiento.
    C: Dejar el vehículo en marcha (engranado) y poner el freno de estacionamiento.
    D: Dejar las llaves en el encendido.
  answer: C
  explanation: El manual indica que siempre debe poner el freno de estacionamiento
    cuando se estacione y dejar el vehículo en marcha (engranado) si tiene una transmisión
    manual.
- id: 155
  category: defensive_driving
  question: ¿Qué debe hacer si otro vehículo comienza a rebasarlo?
  choices:
    A: Aumentar la velocidad para evitar que lo rebasen.
    B: Moverse al carril izquierdo.
    C: Tocar ligeramente los frenos para advertir al conductor.
    D: Permanecer en su carril y no aumentar su velocidad.
  answer: D
  explanation: 'El manual establece: "Si otro vehículo comienza a rebasarlo, permanezca
    en su carril y no aumente su velocidad".'
- id: 156
  category: safe_driving_rules
  question: Si conduce mucho más lento que otros vehículos y el tráfico se está acumulando
    detrás de usted, ¿qué debe hacer?
  choices:
    A: Mantener su velocidad y permanecer en su carril.
    B: Aumentar la velocidad para superar el límite de velocidad.
    C: Hacerse a un lado y dejar que pasen cuando sea seguro hacerlo.
    D: Encender sus luces de emergencia y detenerse en el carril.
  answer: C
  explanation: 'El manual establece: "Si los vehículos se acumulan detrás de usted,
    hágase a un lado y déjelos pasar cuando sea seguro hacerlo".'
- id: 157
  category: defensive_driving
  question: Si debe detenerse en el acotamiento de la carretera en una emergencia,
    ¿cómo puede alertar a otros conductores?
  choices:
    A: Pararse en la calzada y agitar los brazos.
    B: Encender sus luces de emergencia y levantar el capó.
    C: Tocar la bocina continuamente.
    D: Hacer destellos con las luces altas.
  answer: B
  explanation: 'El manual establece: "Puede detenerse en el acotamiento de la carretera
    en una emergencia. Si lo hace, alerte a otros conductores encendiendo sus luces
    de emergencia. También es útil levantar el capó o atar un paño blanco a la antena".'
- id: 158
  category: safe_driving_rules
  question: Al entrar en una carretera usando una rampa de entrada y un carril de
    aceleración, ¿qué debe hacer?
  choices:
    A: Detenerse al final del carril de aceleración y esperar un espacio.
    B: Conducir lentamente hasta incorporarse al carril izquierdo.
    C: Aumentar su velocidad para igualar la velocidad de los vehículos en la carretera.
    D: Ceder el paso deteniéndose inmediatamente en la rampa.
  answer: C
  explanation: 'El manual establece: "Use la rampa y el carril de aceleración para
    aumentar su velocidad para igualar la velocidad de los vehículos en la carretera".'
- id: 159
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida en una carretera de acceso controlado?
  choices:
    A: Detenerse y retroceder hasta la salida perdida.
    B: Hacer un giro en U a través de la mediana.
    C: Detenerse en el acotamiento y esperar a que el tráfico se despeje antes de
      retroceder.
    D: Salir en la siguiente salida y regresar a la salida que se pasó.
  answer: D
  explanation: 'El manual establece: "Si se pasa de su salida, NO se detenga, no retroceda
    ni intente dar la vuelta en la carretera. Tendrá que salir de la carretera en
    la siguiente salida y regresar a la salida que se pasó".'
- id: 160
  category: safe_driving_rules
  question: ¿Cuál es una característica única de conducir a través de un Intercambio
    de Diamante Divergente (DDI)?
  choices:
    A: Debe detenerse en todas las rampas de entrada.
    B: Viajará por el lado izquierdo de la calzada durante una distancia corta.
    C: Se requiere que conduzca en un círculo completo.
    D: Debe ceder el paso al tráfico que entra por la izquierda.
  answer: B
  explanation: 'El manual establece: "Al conducir a través de un DDI, viajará por
    el lado izquierdo de la calzada durante una distancia corta".'
- id: 161
  category: defensive_driving
  question: ¿Cómo puede evitar la "hipnosis de carretera" al conducir?
  choices:
    A: Moviendo constantemente los ojos y observando el tráfico y las señales.
    B: Mirando fijamente hacia adelante a la línea central.
    C: Conduciendo ligeramente por encima del límite de velocidad.
    D: Manteniendo las ventanillas cerradas y la radio apagada.
  answer: A
  explanation: 'El manual establece: "Puede evitar la hipnosis de carretera moviendo
    constantemente los ojos y observando el tráfico y las señales de la carretera
    a su alrededor".'
- id: 162
  category: defensive_driving
  question: ¿Cuál es el número de teléfono celular para llamar en caso de emergencia
    en las carreteras de Missouri?
  choices:
    A: '*911'
    B: '*55'
    C: '*HP'
    D: '*44'
  answer: B
  explanation: 'El manual establece: "El número celular para llamar en una emergencia
    es *55".'
- id: 163
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla en el pavimento de la calzada?
  choices:
    A: Separa el tráfico que viaja en la misma dirección.
    B: Marca el borde derecho de la carretera.
    C: Separa el tráfico que viaja en direcciones opuestas.
    D: Indica un cruce de peatones.
  answer: C
  explanation: 'El manual establece: "El amarillo separa el tráfico que viaja en direcciones
    opuestas".'
- id: 164
  category: signs_and_signals
  question: ¿Qué indica una marca central que consiste en dos líneas amarillas continuas?
  choices:
    A: El tráfico del otro lado se mueve en la misma dirección.
    B: Puede cruzar las líneas para rebasar si el camino está despejado.
    C: Nunca debe cruzar las dos líneas amarillas continuas para rebasar.
    D: Se está aproximando a una intersección.
  answer: C
  explanation: 'El manual establece: "Las líneas amarillas le indican que el tráfico
    al otro lado de las líneas se mueve en la dirección opuesta. Nunca debe cruzar
    las dos líneas amarillas continuas para rebasar".'
- id: 165
  category: signs_and_signals
  question: Cuando se le requiera detenerse debido a una señal o semáforo, ¿dónde
    debe detener su vehículo?
  choices:
    A: Justo después de la línea de parada para poder ver el tráfico.
    B: Antes de que su vehículo llegue a la línea de parada o al cruce de peatones.
    C: Dentro del cruce de peatones.
    D: Al menos 20 pies antes de la línea de parada.
  answer: B
  explanation: 'El manual establece: "Cuando se le requiera detenerse debido a una
    señal o semáforo, debe detenerse antes de que su vehículo llegue a la línea de
    parada o, si hay uno, al cruce de peatones".'
- id: 166
  category: defensive_driving
  question: Si su vehículo se avería y tiene una llanta desinflada, ¿qué NO debe hacer
    nunca?
  choices:
    A: Encender las luces de emergencia (intermitentes).
    B: Intentar cambiar una llanta si eso significa que tiene que estar en un carril
      de tráfico.
    C: Atar un paño blanco a la antena o a la manija de la puerta.
    D: Colocar bengalas de emergencia detrás del vehículo.
  answer: B
  explanation: 'El manual establece: "Nunca se pare en la calzada. No intente cambiar
    una llanta si eso significa que tiene que estar en un carril de tráfico".'
- id: 167
  category: safe_driving_rules
  question: ¿Qué debe hacer al acercarse a una intersección con un cruce de peatones
    pero sin líneas marcadas?
  choices:
    A: Continuar sin ceder el paso si no hay líneas pintadas en la carretera.
    B: Ceder el paso a los peatones que estén en el cruce o a punto de entrar en él.
    C: Tocar la bocina para advertir a los peatones antes de pasar.
    D: Detenerse solo si el semáforo está actualmente en rojo.
  answer: B
  explanation: El manual establece que no todos los cruces de peatones están marcados,
    y usted debe ceder el paso a los peatones que estén en un cruce o a punto de entrar
    en él. Debe estar alerta a los peatones al cruzar intersecciones que no tienen
    cruces de peatones definidos.
- id: 168
  category: signs_and_signals
  question: Usted se encuentra en un carril de uso compartido y desea girar. El semáforo
    muestra solo una flecha recta. ¿Qué debe hacer?
  choices:
    A: Girar con precaución si la intersección está libre de tráfico en sentido contrario.
    B: Continuar recto y girar en la siguiente intersección disponible.
    C: Esperar a que aparezca la flecha de giro antes de realizar el giro.
    D: Incorporarse al carril adyacente para realizar el giro.
  answer: C
  explanation: Según el manual, si desea girar en un carril de uso compartido y solo
    se muestra la flecha recta, debe esperar a la flecha de giro.
- id: 169
  category: defensive_driving
  question: ¿Por qué nunca debe rebasar a un vehículo por el acotamiento (shoulder)
    de la carretera?
  choices:
    A: Es ilegal a menos que conduzca un vehículo comercial.
    B: Otros conductores no esperarán que usted esté allí y podrían salirse de la
      carretera sin mirar.
    C: El acotamiento está reservado estrictamente para vehículos policiales.
    D: Los acotamientos siempre son demasiado blandos para soportar el peso de un
      vehículo de pasajeros.
  answer: B
  explanation: El manual advierte que nunca se debe rebasar por el acotamiento porque
    "Otros conductores no esperarán que usted esté allí y podrían salirse de la carretera
    sin mirar".
- id: 170
  category: safe_driving_rules
  question: Si un oficial de tránsito le indica que se detenga ante una luz verde,
    ¿qué debe hacer?
  choices:
    A: Continuar con precaución porque el semáforo está en verde.
    B: Detenerse, porque debe obedecer a los oficiales de tránsito en todo momento.
    C: Tocar la bocina para llamar la atención del oficial antes de continuar.
    D: Orillarse al acotamiento y esperar a que la luz cambie a rojo.
  answer: B
  explanation: Debe obedecer a los oficiales de tránsito en todo momento. Si un oficial
    da instrucciones, debe hacer lo que diga e ignorar cualquier señal o semáforo,
    incluyendo detenerse ante una luz verde.
- id: 171
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente?
  choices:
    A: Reduzca la velocidad y continúe con precaución.
    B: El semáforo está averiado y usted tiene automáticamente el derecho de paso.
    C: Significa lo mismo que una señal de alto (stop).
    D: Deténgase y espere a que la luz cambie a verde fijo.
  answer: C
  explanation: Según el manual, una luz roja intermitente significa lo mismo que una
    señal de alto (stop).
- id: 172
  category: signs_and_signals
  question: ¿Cómo debe tratar una intersección donde los semáforos están apagados
    o no funcionan?
  choices:
    A: Ceda el paso al vehículo a su izquierda.
    B: Continúe por la intersección sin detenerse.
    C: Trate la intersección como una señal de ceda el paso (yield).
    D: Trate la intersección como una parada de cuatro vías (four-way stop).
  answer: D
  explanation: El manual establece que los semáforos apagados, o que no funcionan,
    operan como una parada de cuatro vías (four-way stop).
- id: 173
  category: signs_and_signals
  question: ¿Qué indica una flecha amarilla intermitente cuando está girando a la
    izquierda?
  choices:
    A: Usted tiene un giro protegido y el tráfico opuesto está detenido.
    B: Se le permite girar, pero debe esperar a que haya un espacio adecuado en el
      tráfico opuesto.
    C: Debe detenerse y esperar a una flecha verde fija.
    D: El semáforo está a punto de cambiar a rojo.
  answer: B
  explanation: Una flecha amarilla intermitente le indica que se le permite conducir
    en la dirección que señala la flecha, pero se requiere que espere a que haya un
    espacio adecuado en el tráfico opuesto antes de realizar el giro.
- id: 174
  category: signs_and_signals
  question: ¿Qué color se utiliza para las señales de tráfico que indican recreación
    pública e interés cultural?
  choices:
    A: Azul
    B: Verde
    C: Marrón
    D: Naranja
  answer: C
  explanation: La tabla de colores de señales del manual indica que el color marrón
    se utiliza para Recreación Pública e Interés Cultural.
- id: 175
  category: signs_and_signals
  question: ¿Qué forma de señal se utiliza exclusivamente para las señales de advertencia?
  choices:
    A: Octágono
    B: Rectángulo vertical
    C: Diamante
    D: Banderín
  answer: C
  explanation: Según la tabla de formas de señales del manual, la forma de diamante
    se utiliza para las señales de advertencia.
- id: 176
  category: signs_and_signals
  question: ¿Qué forma tiene una señal de zona escolar o de cruce escolar?
  choices:
    A: Pentágono
    B: Redonda
    C: Triángulo
    D: Rectángulo horizontal
  answer: A
  explanation: La tabla de formas de señales del manual especifica que se utiliza
    la forma de pentágono para las señales escolares.
- id: 177
  category: signs_and_signals
  question: ¿Qué indica una señal de "Carril Adicional" (Added Lane)?
  choices:
    A: Dos carriles de tráfico pronto se convertirán en uno solo.
    B: El tráfico de otra carretera está entrando, pero no es necesario incorporarse
      porque se ha añadido un carril.
    C: Debe incorporarse a la izquierda para permitir que el tráfico que entra se
      una a la calzada.
    D: La carretera pronto se convertirá en tráfico de doble sentido dividido por
      una mediana.
  answer: B
  explanation: La señal de "Carril Adicional" (Added Lane) significa que el tráfico
    de otra carretera entrará a la vía, y no es necesario incorporarse porque se ha
    añadido un carril.
- id: 178
  category: signs_and_signals
  question: ¿Cuál es la diferencia entre una señal de Curva (Curve) y una señal de
    Giro (Turn)?
  choices:
    A: Una señal de Giro indica una velocidad máxima recomendada de 30 mph o menos,
      mientras que una señal de Curva es para velocidades recomendadas menores al
      límite publicado pero generalmente superiores a 30 mph.
    B: Una señal de Curva solo se usa en autopistas divididas, mientras que una señal
      de Giro se usa en carreteras de dos carriles.
    C: Una señal de Giro significa que debe detenerse por completo, mientras que una
      señal de Curva significa que solo necesita reducir la velocidad.
    D: No hay diferencia; se utilizan indistintamente en todas las carreteras.
  answer: A
  explanation: El manual establece que una señal de giro advierte de un giro cerrado
    donde la velocidad máxima recomendada es de 30 mph o menos, mientras que una señal
    de curva advierte de una curva donde la velocidad recomendada es menor que el
    límite de velocidad establecido.
- id: 179
  category: vehicle_information
  question: ¿Qué significa un triángulo naranja reflectante en la parte trasera de
    un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos.
    B: El vehículo viaja a menos de 25 mph.
    C: El vehículo está averiado y no puede moverse.
    D: El vehículo es una carga ancha y no se puede rebasar.
  answer: B
  explanation: Un triángulo naranja reflectante en la parte trasera de un vehículo
    es una señal de Vehículo de Movimiento Lento (Slow Moving Vehicle), lo que significa
    que el vehículo viaja a menos de 25 mph.
- id: 180
  category: safe_driving_rules
  question: ¿Cómo se marcan en el pavimento los carriles centrales compartidos?
  choices:
    A: Por líneas blancas sólidas dobles a cada lado.
    B: Por una sola línea blanca discontinua en el centro.
    C: Por una línea amarilla sólida y una línea amarilla discontinua a cada lado.
    D: Por líneas amarillas sólidas dobles a cada lado.
  answer: C
  explanation: El manual establece que los carriles centrales compartidos están marcados
    a cada lado por una línea amarilla sólida y una línea amarilla discontinua.
- id: 181
  category: signs_and_signals
  question: ¿Qué forma y color tienen la mayoría de las señales reglamentarias?
  choices:
    A: En forma de diamante y amarillas
    B: Redondas y azules
    C: Cuadradas o rectangulares y blancas con letras negras o rojas
    D: Triangulares y naranjas
  answer: C
  explanation: Muchas señales reglamentarias tienen forma cuadrada o rectangular y
    son blancas, con letras o símbolos negros o rojos.
- id: 182
  category: safe_driving_rules
  question: Si se aproxima a una señal de alto (stop) en una intersección sin línea
    de parada ni paso de peatones, ¿dónde debe detenerse?
  choices:
    A: En la ubicación exacta de la señal de alto
    B: Antes de entrar en la intersección
    C: Diez pies antes de la intersección
    D: No es necesario detenerse si la intersección está despejada
  answer: B
  explanation: Si no hay una línea de parada o un paso de peatones, debe avanzar y
    detenerse cerca del borde de la intersección antes de entrar en ella.
- id: 183
  category: safe_driving_rules
  question: Bajo condiciones normales de la calzada, ¿cuál es la velocidad mínima
    a la que puede conducir en una carretera interestatal en Missouri?
  choices:
    A: 30 mph
    B: 40 mph
    C: 45 mph
    D: 50 mph
  answer: B
  explanation: No puede conducir a menos de 40 mph en carreteras interestatales bajo
    condiciones normales de la calzada.
- id: 184
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad predeterminado
    en cualquier ciudad, pueblo o aldea en Missouri?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: El límite de velocidad en cualquier ciudad, pueblo o aldea es de 25
    mph, a menos que se indique lo contrario.
- id: 185
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en las carreteras con letras en
    Missouri, a menos que se indique lo contrario?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: C
  explanation: Según la guía de velocidad máxima del manual, el límite de velocidad
    para las carreteras con letras es de 55 mph.
- id: 186
  category: safe_driving_rules
  question: Cuando debe detenerse en un cruce de ferrocarril porque las luces rojas
    parpadean o la barrera está bajada, ¿a qué distancia de las vías debe detenerse?
  choices:
    A: De 5 a 10 pies
    B: De 10 a 15 pies
    C: De 15 a 50 pies
    D: De 50 a 100 pies
  answer: C
  explanation: Debe detenerse entre 15 y 50 pies antes de las vías del tren si las
    luces rojas parpadean o si la barrera está bajada.
- id: 187
  category: safe_driving_rules
  question: ¿Por qué se aconseja no cambiar de marcha al cruzar las vías del tren?
  choices:
    A: Daña la transmisión.
    B: Hace que el vehículo acelere demasiado rápido.
    C: Su vehículo podría calarse (apagarse).
    D: Es ilegal.
  answer: C
  explanation: No es prudente cambiar de marcha al cruzar las vías del tren, en caso
    de que su vehículo se apague o se cale.
- id: 188
  category: signs_and_signals
  question: Una señal blanca en forma de X ("crossbuck") en un cruce de ferrocarril
    tiene el mismo significado que ¿qué otra señal?
  choices:
    A: Señal de alto (Stop)
    B: Señal de ceda el paso (Yield)
    C: Señal de prohibido el paso (Do Not Enter)
    D: Señal de límite de velocidad
  answer: B
  explanation: Una señal blanca en forma de X o "crossbuck" se encuentra en el cruce
    de ferrocarril. Esta señal tiene el mismo significado que una señal de "ceda el
    paso"; por lo tanto, debe ceder el paso a los trenes en los cruces.
- id: 189
  category: signs_and_signals
  question: ¿De qué color son las señales de zona de obras?
  choices:
    A: Naranja fluorescente
    B: Amarillo brillante
    C: Verde neón
    D: Blanco reflectante
  answer: A
  explanation: Las señales de zona de obras son de color naranja fluorescente e indican
    que se está realizando algún tipo de trabajo en la calzada o junto a ella.
- id: 190
  category: safe_driving_rules
  question: ¿En qué tipo de zona de obras encontrará a un banderillero (flagger) controlando
    el tráfico de los vehículos que se aproximan?
  choices:
    A: Una zona de obras móvil
    B: Una zona de obras en el arcén (hombro)
    C: Una carretera de dos carriles y dos sentidos con un carril cerrado
    D: Una interestatal de varios carriles con todos los carriles abiertos
  answer: C
  explanation: Una operación de banderilleros es un trabajo que se realiza en una
    carretera de dos carriles y dos sentidos con un carril cerrado. Habrá uno o más
    banderilleros presentes al principio y al final de la zona de obras para controlar
    el tráfico.
- id: 191
  category: defensive_driving
  question: ¿Qué debe esperar ver un conductor al acercarse a una zona de obras móvil?
  choices:
    A: Una barrera de concreto permanente
    B: Un vehículo de protección con un panel de flecha intermitente
    C: Una señal de desvío que dirige el tráfico fuera de la autopista
    D: Un semáforo temporal
  answer: B
  explanation: Al acercarse a una zona de obras móvil, el conductor debe esperar ver
    un vehículo de protección en el carril con un panel de flecha intermitente que
    indique el carril correcto al que debe incorporarse.
- id: 192
  category: signs_and_signals
  question: ¿Qué indica una señal reglamentaria con un círculo rojo y una barra diagonal
    roja sobre un símbolo?
  choices:
    A: Debe ceder el paso.
    B: Se está acercando a un peligro.
    C: No puede hacer algo, como un giro en U.
    D: Debe detenerse de inmediato.
  answer: C
  explanation: Algunas señales reglamentarias tienen un círculo rojo con una barra
    diagonal roja sobre un símbolo. Estas indican que no se puede hacer algo, por
    ejemplo, no girar a la izquierda o no dar vuelta en U.
- id: 193
  category: safe_driving_rules
  question: ¿Qué debe hacer si ve una señal de "Sentido Contrario" (Wrong Way) y se
    da cuenta de que ha entrado en un carril de tráfico en sentido opuesto?
  choices:
    A: Toque la bocina y continúe conduciendo lentamente.
    B: Retroceda su vehículo hasta llegar a la intersección.
    C: Salga de la carretera lo más rápido y seguro posible, dé la vuelta y regrese.
    D: Deténgase en su carril y espere a que el tráfico se despeje.
  answer: C
  explanation: Si cometió un error al girar y ha entrado en un carril de tráfico en
    sentido opuesto, debe, de la manera más rápida y segura posible, salir de la carretera,
    dar la vuelta y regresar.
- id: 194
  category: signs_and_signals
  question: ¿De qué color y forma son las señales de guía que muestran la dirección
    y la distancia a varios lugares?
  choices:
    A: Cuadradas o rectangulares, azules con letras blancas
    B: Cuadradas o rectangulares, verdes o marrones con letras blancas
    C: En forma de diamante, amarillas con letras negras
    D: Circulares, verdes con letras blancas
  answer: B
  explanation: Las señales de guía son cuadradas o rectangulares, y son verdes o marrones
    con letras blancas. Muestran la dirección y la distancia a varios lugares, como
    ciudades, aeropuertos y límites estatales.
- id: 195
  category: signs_and_signals
  question: ¿Qué señales muestran la ubicación de diversos servicios, como áreas de
    descanso y hospitales?
  choices:
    A: Señales de guía
    B: Señales de ruta
    C: Señales de servicio
    D: Marcadores de referencia de emergencia
  answer: C
  explanation: Las señales de servicio son cuadradas o rectangulares, y son azules
    con letras o símbolos blancos. Muestran la ubicación de diversos servicios, como
    áreas de descanso y hospitales.
- id: 196
  category: signs_and_signals
  question: ¿Cómo se identifican las rutas de norte a sur en las señales de ruta?
  choices:
    A: Por números pares
    B: Por números impares
    C: Por números pares de tres dígitos
    D: Por números impares de tres dígitos
  answer: B
  explanation: Las rutas de norte a sur se identifican con números impares. Las carreteras
    de este a oeste se identifican con números pares.
- id: 197
  category: signs_and_signals
  question: En una carretera interestatal que viaja de oeste a este, ¿cómo están organizados
    los números de las salidas?
  choices:
    A: Comienzan en cero en el este y aumentan a medida que conduce hacia el oeste.
    B: Comienzan en cero en el oeste y aumentan a medida que conduce hacia el este.
    C: Están numeradas al azar según el condado.
    D: Comienzan en cero en la capital del estado y aumentan hacia afuera.
  answer: B
  explanation: Las carreteras interestatales que viajan de oeste a este están numeradas
    comenzando desde el oeste hacia el este. Esto significa que los números de las
    salidas comienzan en cero y aumentan a medida que conduce hacia el este.
- id: 198
  category: signs_and_signals
  question: ¿Con qué frecuencia se ubican los marcadores de referencia de emergencia
    a lo largo del arcén exterior de la interestatal?
  choices:
    A: Cada décima de milla
    B: Cada dos décimas de milla
    C: Cada media milla
    D: Cada milla completa
  answer: B
  explanation: Los marcadores de referencia se ubican cada dos décimas de milla, para
    que los automovilistas siempre tengan una señal a la vista.
- id: 199
  category: safe_driving_rules
  question: ¿Cuál es la forma correcta de usar el cinturón de seguridad de un vehículo?
  choices:
    A: El cinturón de regazo bajo y ajustado a través de las caderas y el cinturón
      de hombro a través del pecho.
    B: El cinturón de regazo a través del estómago y el cinturón de hombro debajo
      del brazo.
    C: El cinturón de regazo bajo a través de las caderas y el cinturón de hombro
      detrás de la espalda.
    D: El cinturón de regazo flojo a través de los muslos y el cinturón de hombro
      a través del cuello.
  answer: A
  explanation: Los cinturones de seguridad siempre deben usarse con el cinturón de
    regazo bajo y ajustado a través de las caderas y el cinturón de hombro a través
    del pecho. Los cinturones de hombro nunca deben colocarse debajo del brazo o detrás
    de la espalda.
- id: 200
  category: safe_driving_rules
  question: ¿La Administración Nacional de Seguridad del Tráfico en las Carreteras
    (NHTSA) recomienda que los conductores se sienten con al menos cuánto espacio
    entre el centro de su esternón y el centro del volante?
  choices:
    A: Cinco pulgadas
    B: Ocho pulgadas
    C: Diez pulgadas
    D: Doce pulgadas
  answer: C
  explanation: La Administración Nacional de Seguridad del Tráfico en las Carreteras
    (NHTSA) recomienda que los conductores se sienten con al menos diez pulgadas entre
    el centro de su esternón y el centro del volante para evitar lesiones por el despliegue
    de una bolsa de aire.
- id: 201
  category: driver_responsibility
  question: ¿Según la ley de Missouri, quién debe estar debidamente sujeto al acompañar
    al titular de una licencia de conducir intermedia (Intermediate Driver License)?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero
    B: Solo los niños menores de 12 años
    C: Solo los pasajeros del asiento trasero
    D: TODOS los pasajeros del vehículo
  answer: D
  explanation: La ley de Missouri exige que TODOS los pasajeros que acompañen al titular
    de una licencia de conducir intermedia deben estar debidamente sujetos.
- id: 202
  category: safe_driving_rules
  question: Bajo la Ley de Sujeción de Niños Pasajeros de Missouri, ¿qué se requiere
    para un niño menor de cuatro años?
  choices:
    A: Pueden usar un cinturón de seguridad estándar del vehículo si pesan más de
      30 libras.
    B: Deben estar asegurados en un sistema de sujeción para niños adecuado para ese
      niño, independientemente del peso.
    C: Deben estar asegurados en un asiento elevado (booster seat).
    D: Se les permite viajar sin sujeción en el asiento trasero.
  answer: B
  explanation: Los niños menores de cuatro años, independientemente de su peso, deberán
    estar asegurados en un sistema de sujeción para niños adecuado para ese niño.
- id: 203
  category: safe_driving_rules
  question: Un niño que tiene seis años, pesa 50 libras y mide 4'5" de altura debe
    estar asegurado en ¿qué tipo de sujeción?
  choices:
    A: Un cinturón de seguridad estándar del vehículo
    B: Una sujeción para bebés orientada hacia atrás
    C: Un sistema de sujeción para niños o un asiento elevado (booster seat)
    D: La ley no exige ninguna sujeción
  answer: C
  explanation: Los niños de al menos cuatro años de edad pero menores de ocho años,
    que también pesen al menos 40 libras pero menos de 80 libras, y que también midan
    menos de 4'9" de altura, deberán estar asegurados en un sistema de sujeción para
    niños o un asiento elevado (booster seat).
- id: 204
  category: defensive_driving
  question: Al acercarse a una intersección como conductor defensivo, ¿qué debe hacer
    incluso si el resto del tráfico tiene una luz roja o una señal de alto?
  choices:
    A: Acelerar para despejar la intersección rápidamente.
    B: Mirar a la izquierda y a la derecha.
    C: Tocar la bocina para advertir a otros conductores.
    D: Confiar completamente en la señal de tráfico para evitar que otros crucen.
  answer: B
  explanation: En una intersección, mire a la izquierda y a la derecha, incluso si
    el resto del tráfico tiene una luz roja o una señal de alto. No confíe en las
    señales de tráfico o señales de alto para evitar que otros crucen delante de usted.
- id: 205
  category: vehicle_information
  question: ¿Cuál es la posición recomendada de las manos en el volante?
  choices:
    A: Mano izquierda a las 10 y mano derecha a las 2
    B: Mano izquierda entre las 7 y las 9 y mano derecha entre las 3 y las 5
    C: Ambas manos apoyadas en la posición de las 6
    D: Mano izquierda a las 12 y mano derecha en la palanca de cambios
  answer: B
  explanation: Use un agarre adecuado. Coloque su mano izquierda entre las posiciones
    de las siete y las nueve y su mano derecha entre las posiciones de las tres y
    las cinco en el volante.
- id: 206
  category: vehicle_information
  question: ¿Por qué nunca debe girar la llave de encendido de su vehículo a la posición
    de "lock" (bloqueo) mientras el vehículo aún está en movimiento?
  choices:
    A: Hará que el motor se sobrecaliente.
    B: Dañará permanentemente la transmisión.
    C: Hará que el volante se bloquee, lo que resultará en una pérdida de control.
    D: Desplegará las bolsas de aire del vehículo.
  answer: C
  explanation: Nunca gire la llave de encendido de su vehículo a la posición de "lock"
    (bloqueo) mientras su vehículo esté todavía en movimiento. Esto hará que el volante
    se bloquee si intenta girarlo, y perderá el control de su vehículo.
- id: 207
  category: defensive_driving
  question: ¿Cuál es una buena manera de medir una distancia de seguimiento segura
    entre su vehículo y el vehículo que está delante de usted?
  choices:
    A: La regla de la longitud de un automóvil
    B: La regla de los tres segundos
    C: La regla de los cinco segundos
    D: La regla de los diez pies
  answer: B
  explanation: Una buena manera de medir su distancia de seguimiento segura es usar
    la "regla de los tres segundos". Cuente lentamente, "mil uno, mil dos, mil tres"
    después de que el vehículo de adelante pase un objeto.
- id: 208
  category: defensive_driving
  question: ¿Qué debe hacer si otro conductor lo sigue demasiado de cerca (tailgated)
    y hay un carril derecho disponible?
  choices:
    A: Tocar los frenos repetidamente para advertir al conductor.
    B: Acelerar para aumentar la distancia entre los vehículos.
    C: Cambiarse al carril derecho.
    D: Detener su vehículo en el carril.
  answer: C
  explanation: Si otro conductor lo sigue demasiado de cerca o le hace "tailgating",
    y hay un carril derecho, cámbiese al carril de la derecha.
- id: 209
  category: sharing_the_road
  question: Si está adelantando a una bicicleta y un vehículo en sentido contrario
    se aproxima al mismo tiempo, ¿cuál es la acción más segura a tomar?
  choices:
    A: Acelerar para pasar la bicicleta antes de que el vehículo llegue a usted.
    B: Tocar la bocina para que la bicicleta se salga de la carretera.
    C: Acercarse más a la bicicleta para dejar espacio al vehículo que viene en sentido
      contrario.
    D: Reducir la velocidad y dejar que el vehículo que viene en sentido contrario
      pase primero para poder dar espacio adicional a la bicicleta.
  answer: D
  explanation: El manual aconseja tomar los peligros potenciales uno a la vez. Si
    adelanta a una bicicleta con un vehículo que viene en sentido contrario, reduzca
    la velocidad y deje que el vehículo pase primero para poder dar espacio adicional
    a la bicicleta.
- id: 210
  category: safe_driving_rules
  question: 'La distancia total de parada de un vehículo es igual a:'
  choices:
    A: Distancia de frenado más distancia de seguimiento.
    B: Distancia de reacción más distancia de frenado.
    C: Distancia de reacción más distancia de seguimiento.
    D: Distancia de frenado menos distancia de reacción.
  answer: B
  explanation: Según el manual, su distancia de parada es igual a su distancia de
    reacción más su distancia de frenado.
- id: 211
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe intentar señalizar antes de realizar un
    giro o un cambio de carril?
  choices:
    A: Al menos 50 pies.
    B: Al menos 100 pies.
    C: Al menos 200 pies.
    D: Al menos 500 pies.
  answer: B
  explanation: El manual establece que debe intentar señalizar al menos 100 pies antes
    de realizar su maniobra.
- id: 212
  category: safe_driving_rules
  question: 'Si planea girar, pero hay otras calles o entradas para vehículos entre
    usted y el lugar donde desea girar, usted debe:'
  choices:
    A: Señalizar con al menos 500 pies de anticipación, independientemente de las
      entradas.
    B: Activar su señal de giro inmediatamente para advertir a otros conductores con
      tiempo.
    C: Esperar hasta haber pasado las otras calles o entradas antes de señalizar.
    D: Usar señales manuales en lugar de las luces de giro de su vehículo.
  answer: C
  explanation: El manual aconseja que si hay otras calles, entradas para vehículos
    o accesos entre usted y el lugar donde desea girar, espere hasta haberlos pasado
    para señalizar.
- id: 213
  category: safe_driving_rules
  question: Según el manual, ¿cuál es el único motivo aceptable para usar la bocina?
  choices:
    A: Para mostrar enojo o frustración hacia otro conductor.
    B: Para advertir a otros conductores.
    C: Para avisarle a un conductor lento que desea rebasarlo.
    D: Para saludar a peatones o ciclistas.
  answer: B
  explanation: 'El manual establece que solo hay una razón para usar la bocina: para
    advertir a otros conductores. No debe usarse como una muestra de enojo o frustración.'
- id: 214
  category: safe_driving_rules
  question: Bajo condiciones normales de conducción, ¿cuándo es legal conducir más
    lento que la velocidad mínima establecida?
  choices:
    A: Nunca es legal bajo condiciones normales de conducción.
    B: Cuando conduce un vehículo recién comprado.
    C: Cuando busca una dirección específica.
    D: Cuando conduce por el carril derecho.
  answer: A
  explanation: Es contra la ley conducir más lento que la velocidad mínima establecida
    bajo condiciones normales de conducción. Solo puede conducir más despacio en caso
    de mal tiempo, tráfico pesado o en una carretera en mal estado.
- id: 215
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una práctica recomendada para evitar el envenenamiento
    mortal por monóxido de carbono?
  choices:
    A: Dejar el motor en marcha en un garaje cerrado para calentar el vehículo.
    B: Usar la calefacción en un vehículo estacionado con las ventanas cerradas.
    C: Dejar las rejillas de ventilación abiertas cuando sigue de cerca a otro vehículo.
    D: No conducir con un silenciador o sistema de escape defectuoso.
  answer: D
  explanation: 'Para evitar el envenenamiento por monóxido de carbono, el manual establece
    explícitamente: "No conduzca con un silenciador o sistema de escape defectuoso".'
- id: 216
  category: defensive_driving
  question: ¿Durante qué meses ocurren la mayoría de los choques relacionados con
    ciervos?
  choices:
    A: Febrero, marzo y abril.
    B: Junio, julio y agosto.
    C: Enero, mayo y de octubre a diciembre.
    D: Septiembre y octubre solamente.
  answer: C
  explanation: El manual establece que la mayoría de los choques relacionados con
    ciervos ocurren en enero, mayo y de octubre a diciembre.
- id: 217
  category: defensive_driving
  question: ¿Por qué debe evitar aplicar demasiada presión a los frenos si un choque
    con un ciervo es inevitable?
  choices:
    A: Hará que sus bolsas de aire se desplieguen prematuramente.
    B: Puede hacer que la parte delantera del vehículo baje, permitiendo que el ciervo
      golpee el compartimiento de pasajeros.
    C: Hará que el ciervo se quede paralizado ante los faros.
    D: Bloqueará el volante y le impedirá dar un volantazo.
  answer: B
  explanation: Demasiada presión en los frenos puede hacer que la parte delantera
    del vehículo baje, golpeando al ciervo en las patas y permitiendo que el cuerpo
    entre en el compartimiento de pasajeros.
- id: 218
  category: vehicle_information
  question: ¿Dónde puede encontrar el PSI (libras por pulgada cuadrada) recomendado
    para los neumáticos de su vehículo?
  choices:
    A: En el flanco del propio neumático.
    B: En el manual del propietario del vehículo o en el marco de la puerta del lado
      del conductor.
    C: En la columna de dirección del vehículo.
    D: En el bloque del motor.
  answer: B
  explanation: El manual indica revisar la presión de los neumáticos utilizando el
    PSI recomendado que se encuentra en el manual del propietario del vehículo o en
    el marco de la puerta del lado del conductor del vehículo.
- id: 219
  category: vehicle_information
  question: 'Al usar la prueba de la moneda (penny test) para verificar el desgaste
    de los neumáticos, se considera que sus neumáticos no son seguros y tienen un
    agarre muy reducido si la banda de rodadura está por debajo de aproximadamente:'
  choices:
    A: 1/32 de pulgada.
    B: 2/32 de pulgada.
    C: 3/32 de pulgada.
    D: 4/32 de pulgada.
  answer: B
  explanation: El manual establece que si la banda de rodadura baja de aproximadamente
    2/32 de pulgada, la capacidad de su automóvil para agarrarse a la carretera en
    condiciones adversas se reduce considerablemente.
- id: 220
  category: driver_responsibility
  question: ¿Qué debe hacer con sus manos cuando lo detiene un oficial de la ley?
  choices:
    A: Mantenerlas ocultas debajo de sus piernas.
    B: Meter la mano en la guantera para sacar su registro.
    C: Mantenerlas en el volante para que sean fácilmente observables.
    D: Sacarlas por la ventana para hacer señas al oficial.
  answer: C
  explanation: El manual instruye a los conductores a "Mantener las manos en el volante
    para que sean fácilmente observables" cuando los detiene la policía.
- id: 221
  category: driver_responsibility
  question: Si tiene un arma en su vehículo durante una parada de tráfico, ¿cuándo
    debe informar al oficial de la ley?
  choices:
    A: Solo si el oficial pide registrar el vehículo.
    B: Al primer contacto con el oficial.
    C: Después de haber entregado su licencia de conducir.
    D: No está obligado a informar al oficial.
  answer: B
  explanation: 'El manual establece: "Si tiene un arma(s) en el vehículo, informe
    al oficial al primer contacto".'
- id: 222
  category: defensive_driving
  question: Si ve que un choque con un ciervo es inevitable, ¿qué le aconseja hacer
    el manual?
  choices:
    A: Virar bruscamente fuera de la carretera hacia la derecha.
    B: Virar bruscamente hacia la trayectoria del tráfico que viene en sentido contrario.
    C: No virar bruscamente.
    D: Acelerar para minimizar el tiempo de impacto.
  answer: C
  explanation: 'El manual establece explícitamente: "Si ve que un choque es inevitable,
    no vire bruscamente. Virar bruscamente fuera de la carretera o hacia la trayectoria
    de un automóvil que viene en sentido contrario puede aumentar el riesgo de lesiones".'
- id: 223
  category: penalties_and_points
  question: ¿Qué indica su firma en una multa de tráfico?
  choices:
    A: Una admisión de culpabilidad.
    B: Una renuncia a su derecho a un abogado.
    C: La aceptación de la multa, pero no una admisión de culpabilidad.
    D: Un acuerdo para pagar la multa de inmediato.
  answer: C
  explanation: 'El manual establece: "Su aceptación y firma en una multa de tráfico
    no es una admisión de culpabilidad; sin embargo, la negativa a firmar una multa
    de tráfico puede resultar en su arresto".'
- id: 224
  category: safe_driving_rules
  question: ¿Cuándo es obligatorio encender los faros delanteros por la noche?
  choices:
    A: Desde 1 hora después de la puesta del sol hasta 1 hora antes del amanecer.
    B: Desde ½ hora después de la puesta del sol hasta ½ hora antes del amanecer.
    C: Solo cuando está completamente oscuro afuera.
    D: Desde la puesta del sol hasta el amanecer.
  answer: B
  explanation: Para conducir de noche, debe encender los faros delanteros desde ½
    hora después de la puesta del sol hasta ½ hora antes del amanecer.
- id: 225
  category: safe_driving_rules
  question: Al conducir de noche, ¿a qué distancia de un vehículo que viene en sentido
    contrario debe usar las luces bajas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Debe usar las luces bajas cuando se encuentre a menos de 500 pies (aproximadamente
    una cuadra) de un vehículo que viene en sentido contrario.
- id: 226
  category: defensive_driving
  question: ¿A qué distancia hacia adelante le permiten ver sus faros cuando conduce
    de noche?
  choices:
    A: Unos 200 pies
    B: Unos 350 pies
    C: Unos 500 pies
    D: Unos 600 pies
  answer: B
  explanation: No sobrepase el alcance de sus faros. Sus faros solo le permiten ver
    a unos 350 pies de distancia.
- id: 227
  category: safe_driving_rules
  question: 'Debe usar sus faros en cualquier momento en que las condiciones climáticas
    requieran el uso de:'
  choices:
    A: Su desempañador
    B: Sus limpiaparabrisas
    C: Sus luces de emergencia
    D: Sus luces antiniebla
  answer: B
  explanation: 'El manual establece: "Debe usar sus faros en cualquier momento en
    que las condiciones climáticas requieran el uso de sus limpiaparabrisas".'
- id: 228
  category: defensive_driving
  question: ¿Cuál es la distancia de seguimiento segura recomendada al conducir sobre
    nieve o hielo?
  choices:
    A: De dos a tres segundos
    B: De tres a cuatro segundos
    C: De cinco a siete segundos
    D: De ocho a diez segundos
  answer: D
  explanation: Tomará más tiempo detener su vehículo cuando conduzca sobre nieve o
    hielo. Asegúrese de dejar una distancia segura, de unos ocho a diez segundos,
    entre su vehículo y cualquier vehículo que esté delante de usted.
- id: 229
  category: defensive_driving
  question: ¿Qué partes de la carretera se congelarán y se volverán resbaladizas antes
    que otras partes?
  choices:
    A: Intersecciones
    B: Puentes y pasos elevados
    C: Curvas
    D: Pendientes cuesta arriba
  answer: B
  explanation: Recuerde que los puentes y los pasos elevados se congelarán y se volverán
    resbaladizos antes que otras partes de la carretera.
- id: 230
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar a ocurrir el hidroplaneo (hydroplaning)
    sobre pavimento mojado?
  choices:
    A: Cualquier velocidad superior a 25 mph
    B: Cualquier velocidad superior a 35 mph
    C: Cualquier velocidad superior a 45 mph
    D: Cualquier velocidad superior a 55 mph
  answer: B
  explanation: El hidroplaneo se refiere a una pérdida de tracción y control sobre
    el pavimento mojado, y puede ocurrir a cualquier velocidad superior a 35 mph.
- id: 231
  category: defensive_driving
  question: ¿Qué debe hacer si cree que sus neumáticos están experimentando hidroplaneo
    (hydroplaning)?
  choices:
    A: Frenar bruscamente de inmediato.
    B: Bombear los frenos rápidamente.
    C: Quitar el pie del acelerador y reducir la velocidad.
    D: Girar bruscamente hacia el acotamiento de la carretera.
  answer: C
  explanation: Si cree que sus neumáticos están experimentando hidroplaneo, quite
    el pie del acelerador y reduzca la velocidad. No pise los frenos, ya que esto
    podría causar un derrape.
- id: 232
  category: vehicle_information
  question: Si su vehículo está equipado con un Sistema de Frenos Antibloqueo (ABS),
    ¿qué debe hacer durante una situación de frenado de emergencia?
  choices:
    A: Bombear los frenos rápidamente.
    B: Mantener una presión firme y continua en el freno mientras gira el volante.
    C: Quitar el pie del freno y usar el freno de emergencia.
    D: Presionar el freno ligeramente y evitar girar el volante.
  answer: B
  explanation: Si su automóvil está equipado con ABS, mantenga una presión firme y
    continua en el freno mientras gira el volante para permitir que el ABS de las
    cuatro ruedas funcione correctamente. No bombee los frenos.
- id: 233
  category: defensive_driving
  question: ¿Cómo debe manejar un derrape del vehículo?
  choices:
    A: Pisar los frenos y mantener el volante recto.
    B: Girar suavemente el volante en la dirección en la que se deslizan las ruedas
      traseras.
    C: Girar el volante en la dirección opuesta al derrape.
    D: Acelerar para recuperar la tracción.
  answer: B
  explanation: Para controlar un derrape, quite el pie del acelerador, NO pise los
    frenos y gire suavemente el volante en la dirección en la que se deslizan las
    ruedas traseras.
- id: 234
  category: safe_driving_rules
  question: 'Al conducir con niebla, debe mantener las luces delanteras en:'
  choices:
    A: Luz alta
    B: Luz baja
    C: Ajuste automático
    D: Solo luces de estacionamiento
  answer: B
  explanation: Mantenga las luces delanteras en luz baja. Con niebla, verá menos si
    sus luces están en luz alta.
- id: 235
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si el pedal del freno se hunde repentinamente
    hasta el piso?
  choices:
    A: Apagar la llave de encendido de inmediato.
    B: Cambiar a una marcha alta.
    C: Bombear el pedal del freno rápida y fuertemente varias veces.
    D: Tirar del freno de emergencia con tanta fuerza como pueda.
  answer: C
  explanation: Si el pedal del freno se hunde repentinamente hasta el piso, bombee
    el pedal del freno rápida y fuertemente varias veces. Si eso no funciona, use
    el freno de emergencia o de estacionamiento gradualmente.
- id: 236
  category: driver_responsibility
  question: ¿Qué debe hacer para ayudar con la visibilidad si un oficial de la ley
    lo detiene por la noche?
  choices:
    A: Encender las luces altas.
    B: Encender las luces de emergencia y salir del vehículo.
    C: Encender las luces interiores tan pronto como se detenga.
    D: Apuntar con una linterna por la ventana.
  answer: C
  explanation: Si es de noche, el oficial puede dirigir un reflector hacia su vehículo
    una vez detenido. Para ayudar con la visibilidad, encienda las luces interiores
    tan pronto como se detenga para ayudar al oficial a ver el interior de su vehículo.
- id: 237
  category: defensive_driving
  question: Si experimenta el reventón de un neumático mientras conduce, ¿cuál es
    la acción correcta a tomar con respecto a los frenos?
  choices:
    A: Frenar bruscamente de inmediato para detenerse.
    B: Bombear los frenos rápidamente para mantener el control.
    C: No pise los frenos hasta que el vehículo esté casi detenido.
    D: Aplicar una presión firme y constante a los frenos.
  answer: C
  explanation: Durante el reventón de un neumático, debe quitar el pie del acelerador
    pero no pisar los frenos. Aplique los frenos solo cuando el vehículo esté casi
    detenido.
- id: 238
  category: defensive_driving
  question: ¿Qué debe hacer si sus ruedas se salen del borde pavimentado de la carretera?
  choices:
    A: Dar un tirón brusco al volante hacia la izquierda para volver a la carretera.
    B: Acelerar para recuperar la tracción en la tierra.
    C: Frenar bruscamente para detenerse de inmediato.
    D: Sujetar el volante con firmeza y quitar el pie del acelerador.
  answer: D
  explanation: Si sus ruedas se salen del borde pavimentado, sujete el volante con
    firmeza, quite el pie del acelerador y no pise los frenos. Solo aplique una presión
    suave al freno si es necesario.
- id: 239
  category: defensive_driving
  question: Si el acelerador se queda atascado mientras conduce, ¿a qué marcha debe
    cambiar?
  choices:
    A: Estacionamiento (Park)
    B: Reversa (Reverse)
    C: Neutral (Neutral)
    D: Primera marcha
  answer: C
  explanation: Si el acelerador se queda atascado, debe cambiar a neutral, aplicar
    los frenos e intentar conducir de manera segura fuera de la carretera.
- id: 240
  category: defensive_driving
  question: Si un vehículo se aproxima de frente en su carril, ¿por qué NO debe desviarse
    hacia el carril izquierdo?
  choices:
    A: El carril izquierdo está reservado solo para rebasar.
    B: El otro conductor también podría regresar a ese carril.
    C: Es ilegal cruzar la línea central en una emergencia.
    D: Su vehículo perderá tracción si gira a la izquierda.
  answer: B
  explanation: Cuando un vehículo se aproxima de frente, NO se desvíe hacia el carril
    izquierdo porque el otro conductor también podría regresar a ese carril. En su
    lugar, hágase a la derecha y toque la bocina.
- id: 241
  category: safe_driving_rules
  question: Si su vehículo se apaga en las vías del tren y se aproxima un tren, ¿en
    qué dirección debe correr después de salir del vehículo?
  choices:
    A: En la dirección hacia la que se dirige el tren.
    B: En la dirección de donde viene el tren.
    C: Perpendicular a las vías.
    D: Paralelo a las vías en cualquier dirección.
  answer: B
  explanation: Corra en la dirección de donde viene el tren. Si corre en la dirección
    hacia la que se dirige el tren, podría ser golpeado por los escombros cuando el
    tren choque con su vehículo.
- id: 242
  category: vehicle_information
  question: Según la Junta Nacional de Seguridad en el Transporte (NTSB), las camionetas
    de 12 y 15 pasajeros son inherentemente inestables cuando transportan a más de
    ¿cuántos pasajeros?
  choices:
    A: Seis
    B: Ocho
    C: Diez
    D: Doce
  answer: C
  explanation: La NTSB ha determinado que las camionetas de 12 y 15 pasajeros son
    inherentemente inestables cuando se cargan al nivel para el que fueron diseñadas,
    transportando a más de diez pasajeros.
- id: 243
  category: penalties_and_points
  question: ¿Cuál es una posible sanción si lesiona o mata a alguien porque estaba
    bebiendo o consumiendo drogas mientras conducía?
  choices:
    A: Pasar de dos a siete años en la cárcel.
    B: Pagar una multa máxima de $1,000.
    C: Perder su licencia de conducir por un año.
    D: Completar 100 horas de servicio comunitario.
  answer: A
  explanation: Si lesiona o mata a alguien porque estaba bebiendo o consumiendo drogas
    mientras conducía, puede pasar de dos a siete años en la cárcel, pagar una multa
    de $5,000 y/o perder su licencia de conducir por cinco años.
- id: 244
  category: penalties_and_points
  question: Si un oficial de policía lo detiene y su nivel de contenido de alcohol
    en sangre (BAC) es de .08% o más, ¿cuántos días después de recibir la notificación
    se suspenderá o revocará su licencia?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: El oficial le retirará la licencia y le entregará una notificación
    indicando que su licencia será suspendida o revocada (y no podrá conducir legalmente)
    después de 15 días.
- id: 245
  category: penalties_and_points
  question: ¿Cuál es el tiempo máximo de cárcel por una primera infracción de conducir
    en estado de ebriedad (DWI)?
  choices:
    A: Hasta 30 días
    B: Hasta seis meses
    C: Hasta un año
    D: Hasta cuatro años
  answer: B
  explanation: Por una primera infracción de DWI o un BAC de .08% o más, puede pasar
    hasta seis meses en la cárcel y pagar una multa de hasta $500.
- id: 246
  category: penalties_and_points
  question: Bajo la Ley de Abuso y Pérdida (Abuse and Lose Law) de Missouri, ¿por
    cuánto tiempo se le puede retirar su licencia de conducir si es menor de 21 años
    y posee o consume alcohol mientras conduce?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Si es menor de 21 años de edad, se le puede retirar su licencia de
    conducir por 90 días si posee o consume alcohol o drogas mientras conduce un vehículo.
- id: 247
  category: penalties_and_points
  question: ¿Cuál es la sanción de la licencia de conducir por una primera infracción
    de menor en posesión (MIP)?
  choices:
    A: Suspensión de 15 días
    B: Suspensión de 30 días
    C: Suspensión de 90 días
    D: Revocación de un año
  answer: B
  explanation: Por una primera infracción de menor en posesión (MIP), la consecuencia
    es una suspensión de 30 días de su licencia de conducir.
- id: 248
  category: defensive_driving
  question: ¿Qué debe hacer si el capó se abre repentinamente y bloquea su visión
    mientras conduce?
  choices:
    A: Baje la ventanilla para poder mirar alrededor de lo que sea que esté bloqueando
      su vista.
    B: Frene bruscamente y deténgase en su carril de inmediato.
    C: Encienda las luces altas para ver a través del hueco.
    D: Acelere para obligar al capó a cerrarse.
  answer: A
  explanation: Si el capó se abre repentinamente o algo más bloquea su visión, baje
    la ventanilla para poder mirar alrededor de lo que sea que esté bloqueando su
    vista, encienda las luces de emergencia y salga de la carretera.
- id: 249
  category: defensive_driving
  question: Si las luces delanteras de su vehículo se apagan, ¿qué es lo primero que
    debe intentar?
  choices:
    A: Salirse de la carretera inmediatamente sin señalizar.
    B: Probar el interruptor de cambio de intensidad o el interruptor de las luces.
    C: Encender la luz interior del techo.
    D: Tocar la bocina continuamente.
  answer: B
  explanation: Si las luces delanteras de su vehículo se apagan, pruebe el interruptor
    de cambio de intensidad o el interruptor de las luces, ya que eso podría encenderlas
    de nuevo.
- id: 250
  category: penalties_and_points
  question: Para recuperar su licencia después de que se la retiren bajo la Ley de
    Abuso y Pérdida (Abuse and Lose Law), ¿por cuánto tiempo debe proporcionar una
    prueba de seguro (presentación del formulario SR-22)?
  choices:
    A: Seis meses
    B: Un año
    C: Dos años
    D: Cinco años
  answer: C
  explanation: Para recuperar su licencia bajo la Ley de Abuso y Pérdida, debe proporcionar
    una prueba de seguro por dos años (presentación del formulario SR-22), pagar una
    tarifa de $45, presentar un formulario SATOP y volver a realizar el examen de
    conducir completo.
- id: 251
  category: penalties_and_points
  question: ¿Cuál es la consecuencia por una primera infracción de Menor en Posesión
    (MIP) o por tener un contenido de alcohol en la sangre (BAC) de más del .02% siendo
    menor de edad?
  choices:
    A: Suspensión de 30 días
    B: Suspensión de 90 días
    C: Revocación de un año
    D: Suspensión de 60 días
  answer: A
  explanation: Según el manual, una primera infracción por Menor en Posesión (MIP)
    o tener un BAC de más del .02% resulta en una suspensión de 30 días.
- id: 252
  category: penalties_and_points
  question: ¿A qué sanción se enfrenta un joven por una tercera infracción de Menor
    en Posesión (MIP)?
  choices:
    A: Suspensión de 30 días
    B: Suspensión de 90 días
    C: Revocación de un año
    D: Revocación de cinco años
  answer: C
  explanation: El manual establece que una tercera infracción por Menor en Posesión
    (MIP) resulta en una revocación de un año.
- id: 253
  category: penalties_and_points
  question: ¿Quién está exento de presentar una prueba de seguro (SR-22) por un cargo
    relacionado con la intoxicación en su primera infracción?
  choices:
    A: Conductores comerciales con un BAC del .04%
    B: Menores con un BAC del .02% o más
    C: Conductores mayores de 21 años con un BAC del .08%
    D: Cualquier persona que se haya negado a una prueba química
  answer: B
  explanation: 'Existe una excepción a la regla del SR-22: los menores con un BAC
    del .02% o más no tienen que presentar una prueba de seguro en su primera infracción.'
- id: 254
  category: alcohol_drugs_health
  question: ¿Qué sucede con su licencia de conducir si se niega a realizarse una prueba
    química para determinar su contenido de alcohol en la sangre (BAC)?
  choices:
    A: Se suspende por 30 días.
    B: Se suspende por 90 días.
    C: Se le retira por un año.
    D: Se revoca permanentemente.
  answer: C
  explanation: Si un oficial de policía lo detiene y usted se niega a realizarse una
    prueba química para determinar su BAC, se le retirará su licencia de conducir
    por un año.
- id: 255
  category: vehicle_information
  question: ¿A qué componentes del vehículo se conecta un Dispositivo de Bloqueo de
    Encendido (IID)?
  choices:
    A: La transmisión, los frenos y el volante
    B: El encendido, la bocina y los faros delanteros
    C: El velocímetro, el radio y los limpiaparabrisas
    D: El escape, la batería y el alternador
  answer: B
  explanation: Un dispositivo de bloqueo de encendido (IID) es una unidad mecánica
    que se conecta al encendido, la bocina y los faros delanteros del vehículo.
- id: 256
  category: penalties_and_points
  question: Si es requerido, ¿cuál es el tiempo mínimo que se debe mantener un Dispositivo
    de Bloqueo de Encendido (IID) a partir de la fecha de su restitución?
  choices:
    A: Tres meses
    B: Seis meses
    C: Un año
    D: Dos años
  answer: B
  explanation: El IID debe mantenerse durante un mínimo de seis meses a partir de
    la fecha de su restitución sin ninguna infracción en los últimos tres meses.
- id: 257
  category: penalties_and_points
  question: ¿Cuál es la sanción por una condena de primera infracción por no tener
    instalado un Dispositivo de Bloqueo de Encendido (IID) según lo exige la ley?
  choices:
    A: Una suspensión de 30 días
    B: Una suspensión de 90 días
    C: Una revocación de un año
    D: Una revocación de cinco años
  answer: C
  explanation: Si recibe una multa por no tener instalado un IID según lo exige la
    ley y es condenado en el tribunal, su privilegio de conducir será revocado por
    un año.
- id: 258
  category: alcohol_drugs_health
  question: ¿En qué se diferencian las sanciones por Conducir Bajo los Efectos del
    Alcohol o Drogas (DWI) si la alteración es causada por drogas en lugar de alcohol?
  choices:
    A: La alteración por drogas conlleva una sanción menor.
    B: La alteración por drogas conlleva una sanción más severa.
    C: Las sanciones son exactamente las mismas.
    D: La alteración por drogas solo resulta en una advertencia para la primera infracción.
  answer: C
  explanation: Las sanciones por DWI en Missouri son exactamente las mismas, independientemente
    de si la alteración es por drogas o por alcohol.
- id: 259
  category: penalties_and_points
  question: ¿Cuál es la sentencia máxima de prisión y la multa por una condena de
    DWI en Missouri?
  choices:
    A: Hasta 30 días de prisión y una multa de $100
    B: Hasta 6 meses de prisión y una multa de $500
    C: Hasta 1 año de prisión y una multa de $1,000
    D: Hasta 5 años de prisión y una multa de $5,000
  answer: B
  explanation: El castigo para los condenados por DWI es de hasta seis meses de prisión
    y una multa de hasta $500, además de la pérdida de los privilegios de conducir.
- id: 260
  category: alcohol_drugs_health
  question: ¿Cuál es el límite ilegal de contenido de alcohol en la sangre (BAC) para
    un conductor de vehículo comercial en Missouri?
  choices:
    A: 0.02% o más
    B: 0.04% o más
    C: 0.06% o más
    D: 0.08% o más
  answer: B
  explanation: Es ilegal conducir con un contenido de alcohol en la sangre (BAC) de
    0.08% o más, pero el límite es de 0.04% para los conductores de vehículos comerciales.
- id: 261
  category: alcohol_drugs_health
  question: ¿Cómo pueden las pastillas para adelgazar y los estimulantes ("uppers")
    afectar a un conductor después de que desaparece el estado de alerta inicial a
    corto plazo?
  choices:
    A: Mejoran la visión nocturna y el tiempo de reacción.
    B: Hacen que la persona se sienta nerviosa, mareada e incapaz de concentrarse.
    C: Aumentan permanentemente el periodo de atención del conductor.
    D: Reducen el contenido de alcohol en la sangre (BAC) del conductor.
  answer: B
  explanation: Las pastillas estimulantes ("pep pills"), los estimulantes ("uppers")
    y las pastillas para adelgazar pueden hacer que un conductor esté más alerta por
    un corto tiempo. Sin embargo, más tarde pueden hacer que la persona se sienta
    nerviosa, mareada y no pueda concentrarse.
- id: 262
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a conducir
    bajo la influencia de la marihuana en Missouri?
  choices:
    A: Es legal siempre que el conductor tenga una tarjeta de marihuana medicinal.
    B: Solo es ilegal si se combina con alcohol.
    C: Nunca es legal ni seguro conducir bajo la influencia de la marihuana.
    D: Es legal si el BAC del conductor es inferior al 0.08%.
  answer: C
  explanation: Aunque la marihuana medicinal fue aprobada por los votantes de Missouri
    a partir de 2020, nunca es legal ni seguro conducir bajo la influencia de la marihuana.
- id: 263
  category: alcohol_drugs_health
  question: Según estudios de investigación, ¿cuál es un efecto negativo de la marihuana
    en los conductores?
  choices:
    A: Disminución del zigzagueo entre carriles
    B: Mejora del juicio de tiempo y distancia
    C: Mal tiempo de reacción
    D: Aumento de la coordinación
  answer: C
  explanation: Los estudios de investigación han demostrado efectos negativos de la
    marihuana en los conductores, incluyendo un aumento en el zigzagueo entre carriles,
    un mal tiempo de reacción y una atención alterada a la carretera.
- id: 264
  category: alcohol_drugs_health
  question: ¿Cuál es uno de los mayores predictores de que alguien desarrolle un trastorno
    por consumo de sustancias o una adicción?
  choices:
    A: El uso temprano de sustancias nocivas
    B: Conducir un vehículo comercial
    C: Tomar medicamentos para la alergia de venta libre
    D: Tener un cerebro completamente desarrollado
  answer: A
  explanation: Uno de los mayores predictores de que alguien desarrolle una adicción
    es el uso temprano. El cerebro poco desarrollado de una persona joven puede dañarse
    más rápido y de manera más grave.
- id: 265
  category: penalties_and_points
  question: ¿Durante cuánto tiempo debe mantenerse archivado el comprobante de seguro
    (SR-22) en la Oficina de Licencias de Conducir (Driver License Bureau) por una
    infracción relacionada con la intoxicación?
  choices:
    A: Seis meses
    B: Un año
    C: Dos años
    D: Cinco años
  answer: C
  explanation: El comprobante de seguro debe mantenerse archivado en la Oficina de
    Licencias de Conducir durante dos años.
- id: 266
  category: penalties_and_points
  question: Según la ley estatal de Missouri, ¿cuántos puntos se añadirán a su historial
    de conducción si es declarado culpable de exceso de velocidad?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: El manual establece que, bajo las violaciones de la ley estatal, una
    condena por exceso de velocidad conlleva un valor de 3 puntos.
- id: 267
  category: penalties_and_points
  question: ¿Qué medida tomará el Departamento si usted acumula un total de 4 puntos
    en 12 meses?
  choices:
    A: Suspender su licencia por 30 días
    B: Revocar su licencia por un año
    C: Enviarle un aviso de acumulación de puntos
    D: Requerir que vuelva a tomar el examen de conducir
  answer: C
  explanation: Si acumula un total de 4 puntos en 12 meses, el Departamento le enviará
    un aviso de acumulación de puntos.
- id: 268
  category: penalties_and_points
  question: ¿Su privilegio de conducir será suspendido si acumula cuántos puntos en
    un periodo de 18 meses?
  choices:
    A: 4 o más puntos
    B: 6 o más puntos
    C: 8 o más puntos
    D: 12 o más puntos
  answer: C
  explanation: Si acumula un total de 8 o más puntos en 18 meses, su privilegio de
    conducir será suspendido.
- id: 269
  category: penalties_and_points
  question: Si acumula 8 puntos en 18 meses, ¿cuánto tiempo durará su primera suspensión
    del privilegio de conducir?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: A
  explanation: Las consecuencias por acumular 8 puntos en 18 meses incluyen una suspensión
    de 30 días para la primera suspensión.
- id: 270
  category: penalties_and_points
  question: ¿Cuál de las siguientes acumulaciones de puntos resultará en la revocación
    de su privilegio de conducir por un año?
  choices:
    A: 8 o más puntos en 12 meses
    B: 12 o más puntos en 12 meses
    C: 12 o más puntos en 24 meses
    D: 18 o más puntos en 36 meses
  answer: B
  explanation: Su privilegio de conducir será revocado por un año si acumula 12 o
    más puntos en 12 meses, 18 o más puntos en 24 meses, o 24 o más puntos en 36 meses.
- id: 271
  category: penalties_and_points
  question: ¿Qué debe hacer para restablecer su privilegio de conducir después de
    una suspensión por puntos no relacionada con el alcohol?
  choices:
    A: Pagar una tarifa de $50 y volver a tomar el examen escrito
    B: Presentar un comprobante de seguro (SR-22) y pagar una tarifa de restablecimiento
      de $20
    C: Completar un curso de conducción defensiva y pagar una tarifa de $20
    D: Presentar un comprobante de seguro (SR-22) y pagar una tarifa de $45
  answer: B
  explanation: Para una suspensión o revocación por puntos no relacionada con el alcohol,
    deberá presentar un comprobante de seguro (SR-22) y pagar una tarifa de restablecimiento
    de $20.
- id: 272
  category: penalties_and_points
  question: Después de que se restablece su privilegio de conducir, sus puntos se
    reducen a cuatro. ¿Cómo se reducen sus puntos restantes después de un año de conducir
    sin obtener nuevos puntos?
  choices:
    A: Se reducen a cero
    B: Se reducen a la mitad
    C: Se reducen en un tercio
    D: Se reducen en dos puntos
  answer: C
  explanation: Después de un año de conducir sin obtener nuevos puntos en su historial,
    los puntos restantes se reducirán en un tercio.
- id: 273
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia si se le condena por conducir mientras
    su licencia está suspendida?
  choices:
    A: Su privilegio de conducir puede ser revocado por un año
    B: Recibirá 4 puntos en su historial
    C: Su vehículo será confiscado permanentemente
    D: Se le condenará por un delito grave (felony)
  answer: A
  explanation: Si conduce mientras su licencia está suspendida, su privilegio de conducir
    puede ser revocado por un año después de ser condenado.
- id: 274
  category: penalties_and_points
  question: Si no comparece ante el tribunal por una infracción de tráfico, ¿cuántos
    días le otorga el tribunal para pagar las multas antes de notificar a la Oficina
    de Licencias de Conducir (DLB)?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Cuando no comparece ante el tribunal por una infracción de tráfico,
    el tribunal le dará 30 días para pagar las multas antes de notificar a la Oficina
    de Licencias de Conducir (DLB).
- id: 275
  category: vehicle_information
  question: ¿De cuántos días dispone para solicitar un título después de comprar un
    vehículo para evitar pagar una tarifa de penalización?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Al comprar un vehículo, debe solicitar el título en un plazo de 30
    días. Si no lo solicita en ese plazo, deberá pagar una tarifa de penalización.
- id: 276
  category: vehicle_information
  question: ¿Dónde recomienda el manual del conductor de Missouri guardar el título
    de su vehículo?
  choices:
    A: En la guantera del vehículo
    B: Debajo del asiento del conductor
    C: En el maletero del vehículo
    D: No en su vehículo
  answer: D
  explanation: 'El título es un documento personal muy importante. El manual establece
    explícitamente: NO guarde su título en su vehículo.'
- id: 277
  category: vehicle_information
  question: Al comprar un vehículo nuevo en Missouri, ¿qué documento le entregará
    el concesionario para indicar que el vehículo nunca ha sido registrado?
  choices:
    A: Una Declaración de Origen del Fabricante (MSO)
    B: Un formulario de verificación de ID/OD
    C: Un título de salvamento
    D: Solo una factura de venta
  answer: A
  explanation: Para un vehículo nuevo comprado en Missouri, el concesionario le entregará
    una solicitud de título y una Declaración de Origen del Fabricante (MSO) asignada,
    que indica que el vehículo es nuevo y nunca ha sido registrado.
- id: 278
  category: vehicle_information
  question: ¿Para qué vehículos se requiere una declaración adecuada del odómetro
    al comprar o vender?
  choices:
    A: Todos los vehículos, independientemente de su antigüedad
    B: Vehículos de año de modelo 2011 y posteriores hasta que el vehículo cumpla
      20 años
    C: Solo vehículos fabricados antes de 2011
    D: Vehículos que tengan más de 20 años
  answer: B
  explanation: Al comprar o vender un vehículo, el vendedor debe anotar la lectura
    del kilometraje en la asignación del título si el año del modelo es 2011 o posterior
    y el vehículo tiene menos de 20 años.
- id: 279
  category: vehicle_information
  question: Si compra un vehículo usado y el título que se le asigna es de otro estado,
    ¿qué debe obtener?
  choices:
    A: Una nueva Declaración de Origen del Fabricante
    B: Un formulario de verificación del número de identificación y del odómetro (ID/OD)
    C: Un título de salvamento de Missouri
    D: Un permiso especial de la patrulla de carreteras
  answer: B
  explanation: Si el título asignado es de otro estado, debe obtener un formulario
    de verificación del número de identificación y del odómetro (ID/OD) completado
    por una estación de inspección autorizada.
- id: 280
  category: penalties_and_points
  question: ¿Cuántos puntos se asignarán a su historial de conducción por obtener
    una licencia de conducir mediante falsedad o tergiversación?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 8 puntos
    D: 12 puntos
  answer: D
  explanation: Según la tabla de valores de puntos del manual, obtener una licencia
    de conducir mediante falsedad o tergiversación resulta en 12 puntos.
- id: 281
  category: vehicle_information
  question: ¿En qué se basa la tarifa de registro de un vehículo de pasajeros en Missouri?
  choices:
    A: El peso bruto del vehículo
    B: Los caballos de fuerza fiscales (taxable horsepower) del vehículo
    C: La antigüedad del vehículo
    D: La zona y el peso bruto del vehículo
  answer: B
  explanation: Si está registrando un vehículo de pasajeros, su tarifa de registro
    se basará en los caballos de fuerza fiscales (taxable horsepower) de su vehículo.
- id: 282
  category: vehicle_information
  question: ¿Bajo qué condición es elegible para obtener un registro de dos años para
    su vehículo durante un año par?
  choices:
    A: Si tiene un historial de conducción limpio
    B: Si su vehículo tiene un año de modelo impar
    C: Si su vehículo tiene un año de modelo par
    D: Si paga el doble de la tarifa de procesamiento
  answer: C
  explanation: Durante un año par (como 2018), puede registrarse por dos años si su
    vehículo tiene un año de modelo par.
- id: 283
  category: vehicle_information
  question: 'Al renovar el registro de su vehículo, se debe haber completado un certificado
    vigente de inspección de seguridad y/o emisiones dentro de los últimos:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Debe proporcionar un certificado vigente de inspección de seguridad
    y/o emisiones realizado dentro de los últimos 60 días, si corresponde.
- id: 284
  category: driver_responsibility
  question: ¿Cuántos días tiene para informar la venta de su vehículo motorizado enviando
    un Aviso de Venta (Formulario 5049)?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley estatal exige que informe la venta de su vehículo motorizado
    o vehículo todo terreno completando un Aviso de Venta (Formulario 5049) y enviándolo
    a cualquier oficina de licencias o a la dirección que figura en el formulario
    dentro de los 30 días.
- id: 285
  category: vehicle_information
  question: ¿Cuántas veces al año puede reemplazar las placas y calcomanías (tabs)
    robadas sin costo (excluyendo la tarifa de procesamiento) si firma una declaración
    jurada ante notario?
  choices:
    A: Una vez
    B: Dos veces
    C: Tres veces
    D: Veces ilimitadas
  answer: B
  explanation: La ley estatal le permite reemplazar las placas y calcomanías (tabs)
    robadas hasta dos veces al año SIN COSTO (se aplica una tarifa de procesamiento
    de $9.00) si firma una declaración jurada ante notario que certifique que las
    placas o calcomanías fueron robadas.
- id: 286
  category: driver_responsibility
  question: ¿Cuál es el nivel mínimo de cobertura de responsabilidad civil exigido
    por la ley estatal para daños a la propiedad por choque?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: El nivel mínimo de cobertura exigido por la ley estatal incluye $25,000
    por choque por daños a la propiedad.
- id: 287
  category: driver_responsibility
  question: ¿Cuál es la cobertura mínima requerida de seguro de responsabilidad civil
    por lesiones corporales por persona?
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $75,000
  answer: B
  explanation: El nivel mínimo de cobertura exigido por la ley estatal incluye $25,000
    por persona por lesiones corporales.
- id: 288
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una forma aceptable de mostrar el comprobante
    de seguro al registrar un vehículo?
  choices:
    A: Una declaración verbal de su agente de seguros
    B: Un dispositivo electrónico portátil que muestre su póliza
    C: Una fotocopia del título de su vehículo
    D: Un estado de cuenta bancario que muestre un pago de seguro
  answer: B
  explanation: Las formas aceptables de proporcionar un comprobante de seguro incluyen
    un dispositivo electrónico portátil, una tarjeta de identificación original, una
    póliza o contrato provisional (binder), o un recibo de seguro pagado.
- id: 289
  category: driver_responsibility
  question: Para calificar para ser autoasegurado en Missouri, ¿debe tener más de
    cuántos vehículos?
  choices:
    A: 5 vehículos
    B: 10 vehículos
    C: 25 vehículos
    D: 50 vehículos
  answer: C
  explanation: Para ser autoasegurado, debe tener más de 25 vehículos y poder demostrar
    que puede y pagará por los daños causados por sus vehículos.
- id: 290
  category: penalties_and_points
  question: Si su licencia de conducir y sus placas se suspenden por no mantener el
    seguro, ¿qué formulario debe presentar para demostrar que tiene seguro?
  choices:
    A: Formulario 5049
    B: SR-22
    C: Formulario 1099
    D: SR-10
  answer: B
  explanation: La forma más común de presentar un comprobante de seguro es a través
    de una presentación de seguro SR-22. Comuníquese con su compañía o agente de seguros
    para presentar el formulario SR-22.
- id: 291
  category: penalties_and_points
  question: ¿Cuál es la sanción por una segunda suspensión en un plazo de dos años
    por no mantener el seguro?
  choices:
    A: Suspensión de 30 días y una tarifa de $100
    B: Suspensión de 90 días y una tarifa de $200
    C: Suspensión de 6 meses y una tarifa de $300
    D: Suspensión de 1 año y una tarifa de $400
  answer: B
  explanation: Por dos suspensiones (dentro de un periodo de dos años entre sí), su
    licencia de conducir y/o las placas de su vehículo serán suspendidas por 90 días.
    También debe pagar una tarifa de $200 y presentar una prueba de seguro durante
    tres años.
- id: 292
  category: penalties_and_points
  question: ¿Qué tarifa debe pagar para restablecer su licencia después de una tercera
    suspensión por no mantener el seguro?
  choices:
    A: $20
    B: $100
    C: $200
    D: $400
  answer: D
  explanation: Por tres (o más) suspensiones, su licencia de conducir y/o las placas
    de su vehículo serán suspendidas por un año. También debe pagar una tarifa de
    $400 y presentar una prueba de seguro durante tres años.
- id: 293
  category: penalties_and_points
  question: ¿Qué sucede si usted es el culpable en un accidente y no paga por los
    daños que causó?
  choices:
    A: Su vehículo será confiscado por 30 días.
    B: Su licencia de conducir y/o las placas de su vehículo serán suspendidas por
      un año.
    C: Se le pedirá que vuelva a realizar el examen de conducir.
    D: Recibirá una carta de advertencia del Departamento de Ingresos (Department
      of Revenue).
  answer: B
  explanation: Si usted es el culpable en un accidente y no paga por los daños que
    causó, su licencia de conducir y/o las placas de su vehículo serán suspendidas
    por un año.
- id: 294
  category: driver_responsibility
  question: La ley estatal exige que usted tenga una cobertura de automovilista sin
    seguro de ¿qué cantidad por lesiones corporales por accidente?
  choices:
    A: $25,000
    B: $50,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: La ley también exige que tenga una cobertura de automovilista sin seguro
    de $25,000 por lesiones corporales por persona y $50,000 por lesiones corporales
    por accidente.
- id: 295
  category: vehicle_information
  question: Si no recibe un aviso de renovación del registro del vehículo por correo,
    ¿qué debe hacer?
  choices:
    A: Esperar hasta que llegue el aviso antes de renovar.
    B: Conducir legalmente sin renovar hasta que el Departamento se comunique con
      usted.
    C: La ley le exige renovar las placas de su vehículo antes de que venzan.
    D: Solicitar un título y registro completamente nuevos.
  answer: C
  explanation: Si no recibe el aviso, la ley le exige renovar las placas de su vehículo
    antes de que venzan.
- id: 296
  category: penalties_and_points
  question: ¿Cuál es la sanción si recibe dos suspensiones de la licencia de conducir
    en un plazo de dos años entre sí?
  choices:
    A: Su licencia será suspendida por 30 días y debe pagar una tarifa de $100.
    B: Su licencia será suspendida por 90 días y debe pagar una tarifa de $200.
    C: Su licencia será suspendida por 1 año y debe pagar una tarifa de $400.
    D: Su licencia será revocada permanentemente.
  answer: B
  explanation: Según el manual, si tiene dos suspensiones en un plazo de dos años
    entre sí, su licencia de conducir y/o las placas de su vehículo serán suspendidas
    por 90 días, y debe pagar una tarifa de $200 y presentar una prueba de seguro
    durante tres años.
- id: 297
  category: penalties_and_points
  question: Si acumula tres o más suspensiones, ¿por cuánto tiempo se suspenderá su
    licencia de conducir y/o las placas de su vehículo?
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 3 años
  answer: C
  explanation: El manual establece que por tres (o más) suspensiones, su licencia
    de conducir y/o las placas de su vehículo serán suspendidas por un año, y debe
    pagar una tarifa de $400.
- id: 298
  category: driver_responsibility
  question: ¿Qué debe hacer si se ve involucrado en un accidente de tráfico con un
    vehículo estacionado?
  choices:
    A: Retirarse de inmediato si no hay daños visibles en su vehículo.
    B: Dejar una nota en el parabrisas y marcharse sin reportarlo.
    C: No se retire, ya que abandonar la escena de un accidente de tráfico es un delito.
    D: Esperar 10 minutos y marcharse si el dueño no aparece.
  answer: C
  explanation: 'El manual establece explícitamente: "Incluso si tiene un choque con
    un vehículo estacionado, no se retire. Abandonar la escena de un accidente de
    tráfico es un delito".'
- id: 299
  category: safe_driving_rules
  question: Bajo la ley "Move It" (Muévalo) de Missouri, ¿qué debe hacer si se ve
    involucrado en un accidente de tráfico menor y sin heridos?
  choices:
    A: Dejar su vehículo exactamente donde está hasta que llegue la policía.
    B: Mover su vehículo al arcén (hombro) u otro lugar cercano fuera de la calzada.
    C: Esperar a que una grúa mueva su vehículo.
    D: Conducir inmediatamente a la estación de policía más cercana.
  answer: B
  explanation: Una ley estatal exige que los vehículos involucrados en choques menores
    y sin heridos se muevan fuera de la carretera hacia el arcén u otro lugar cercano
    para evitar colisiones múltiples y congestión de tráfico.
- id: 300
  category: defensive_driving
  question: Según el manual del conductor de Missouri, ¿qué porcentaje de muertes
    en Missouri causan los accidentes secundarios?
  choices:
    A: 10 por ciento
    B: 18 por ciento
    C: 25 por ciento
    D: 30 por ciento
  answer: B
  explanation: La ley "Move It" ayuda a reducir la posibilidad de que los automovilistas
    se vean involucrados en accidentes secundarios, los cuales causan el 18 por ciento
    de las muertes en Missouri.
- id: 301
  category: driver_responsibility
  question: Si se le requiere presentar un informe de accidente ante el Departamento
    de Ingresos (Department of Revenue), ¿dentro de cuántos días debe presentarse?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Bajo ciertas circunstancias, la ley estatal exige que el informe de
    accidente se presente dentro de los 30 días.
- id: 302
  category: driver_responsibility
  question: ¿Debe informar un accidente a la Oficina de Licencias de Conducir (Driver
    License Bureau) si alguien involucrado no tenía seguro de responsabilidad civil
    (liability insurance) y hay daños a la propiedad que superan qué cantidad?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Debe informar un accidente si alguien involucrado no tenía seguro de
    responsabilidad civil Y hay daños a la propiedad de una o más personas que superen
    los $500, o si hubo lesiones personales o muerte.
- id: 303
  category: penalties_and_points
  question: ¿Qué puede suceder con su privilegio de conducir si golpea a un trabajador
    de la carretera o a un socorrista de emergencia dentro de una zona designada de
    construcción, trabajo o emergencia?
  choices:
    A: Será suspendido por exactamente 30 días.
    B: Puede ser revocado.
    C: Recibirá una advertencia y una multa.
    D: Se le requerirá tomar un curso de conducción defensiva.
  answer: B
  explanation: Si se ve involucrado en un choque de vehículo motorizado y golpea a
    un trabajador de la carretera o a un socorrista de emergencia dentro de una zona
    designada de construcción, trabajo o emergencia, su privilegio de conducir puede
    ser revocado.
- id: 304
  category: vehicle_information
  question: ¿Por cuánto tiempo es válido un certificado estándar de inspección de
    seguridad vehicular para mostrar como prueba de inspección?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Si su vehículo pasa la inspección de seguridad, la estación de inspección
    le entregará un certificado de inspección para mostrar como prueba. El certificado
    es válido por 60 días.
- id: 305
  category: vehicle_information
  question: Los vehículos motorizados están exentos del requisito de inspección de
    seguridad durante los primeros diez años posteriores al año del modelo de fabricación,
    siempre que tengan menos de ¿cuántas millas en el odómetro?
  choices:
    A: 50,000 millas
    B: 100,000 millas
    C: 150,000 millas
    D: 200,000 millas
  answer: C
  explanation: Los vehículos motorizados durante los primeros diez años posteriores
    al año del modelo de fabricación y que tengan menos de 150,000 millas en el odómetro
    están exentos del requisito de inspección de seguridad.
- id: 306
  category: vehicle_information
  question: ¿Cuál de los siguientes tipos de vehículos está exento del requisito de
    inspección de seguridad de Missouri?
  choices:
    A: Todos los automóviles de pasajeros de más de 5 años
    B: Todas las motocicletas
    C: Todos los remolques (trailers)
    D: Todos los camiones comerciales
  answer: C
  explanation: El manual enumera "Todos los remolques" como una de las excepciones
    al requisito de inspección de seguridad.
- id: 307
  category: vehicle_information
  question: ¿Su vehículo debe tener al menos dos luces traseras rojas y reflectores
    que funcionen y que otros conductores puedan ver desde qué distancia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Bajo el equipo requerido, el manual establece que su vehículo debe
    tener al menos dos luces traseras rojas y reflectores que funcionen y que otros
    conductores puedan ver desde 500 pies.
- id: 308
  category: vehicle_information
  question: Si su automóvil de pasajeros fue fabricado después del 30 de junio de
    1964, ¿cuál es el requisito mínimo de cinturones de seguridad para el asiento
    delantero?
  choices:
    A: Un juego de cinturones de seguridad
    B: Dos juegos de cinturones de seguridad
    C: Tres juegos de cinturones de seguridad
    D: Los cinturones de seguridad solo son obligatorios en el asiento trasero
  answer: B
  explanation: 'El manual establece: "Cinturones de seguridad — Si su automóvil de
    pasajeros fue fabricado después del 30 de junio de 1964, debe tener dos juegos
    de cinturones de seguridad en el asiento delantero".'
- id: 309
  category: vehicle_information
  question: Si su vehículo fue fabricado después de 1967, ¿con qué espejos debe estar
    equipado para pasar una inspección de seguridad?
  choices:
    A: Solo un espejo retrovisor interior.
    B: Solo un espejo retrovisor exterior.
    C: Un espejo retrovisor interior y uno exterior.
    D: Dos espejos retrovisores exteriores.
  answer: C
  explanation: 'El manual establece: "Espejos — Si su vehículo fue fabricado después
    de 1967, debe tener un espejo retrovisor interior y uno exterior".'
- id: 310
  category: vehicle_information
  question: ¿Cuál es la altura máxima permitida para los parachoques (bumpers) en
    vehículos de pasajeros cuando se mide en el punto más alto desde el suelo?
  choices:
    A: 18 pulgadas
    B: 22 pulgadas
    C: 26 pulgadas
    D: 30 pulgadas
  answer: B
  explanation: 'El manual establece: "Los parachoques de los vehículos de pasajeros
    no pueden exceder las 22 pulgadas sobre el suelo cuando se miden en el punto más
    alto".'
- id: 311
  category: vehicle_information
  question: Si tiene un camión con una licencia para más de 12,000 libras y recibe
    solo una placa de matrícula, ¿dónde debe colocarse?
  choices:
    A: En la parte trasera del camión
    B: En la parte delantera del camión
    C: Dentro del parabrisas delantero
    D: Ya sea en la parte delantera o trasera
  answer: B
  explanation: Si tiene un camión con una licencia para más de 12,000 libras, recibirá
    solo una placa, la cual debe colocarse en la parte delantera del camión.
- id: 312
  category: vehicle_information
  question: ¿Su vehículo debe tener una luz blanca que ilumine la placa de matrícula
    trasera para que la placa pueda verse desde qué distancia?
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 150 pies
  answer: B
  explanation: Su vehículo debe tener una luz blanca que ilumine la placa de matrícula
    trasera para que la placa pueda verse desde 50 pies.
- id: 313
  category: safe_driving_rules
  question: ¿Se requiere equipo especial si una carga sobresale de la parte trasera
    de su vehículo por más de cuántos pies?
  choices:
    A: Dos pies
    B: Tres pies
    C: Cuatro pies
    D: Cinco pies
  answer: D
  explanation: Necesita equipo especial si algo en su vehículo sobresale de la parte
    trasera por más de cinco pies.
- id: 314
  category: safe_driving_rules
  question: Al remolcar otro vehículo, ¿cuál es la distancia máxima que su línea de
    remolque puede mantener alejados a los vehículos?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: Cuando esté remolcando otro vehículo, su línea de remolque debe mantener
    los vehículos a una distancia máxima de 15 pies entre sí.
- id: 315
  category: signs_and_signals
  question: Se debe exhibir una señal de "vehículo de movimiento lento" en la parte
    trasera de cualquier vehículo que se mueva a una velocidad igual o inferior a
    qué velocidad desde el atardecer hasta ½ hora antes del amanecer?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: Desde el atardecer hasta ½ hora antes del amanecer, cualquier vehículo
    que se mueva a 25 mph o más lento debe tener una señal de "vehículo de movimiento
    lento".
- id: 316
  category: vehicle_information
  question: ¿Entre qué fechas se permiten los neumáticos para nieve con clavos en
    los vehículos en Missouri?
  choices:
    A: 1 de octubre al 1 de marzo
    B: 1 de noviembre al 1 de abril
    C: 15 de noviembre al 15 de abril
    D: 1 de diciembre al 31 de marzo
  answer: B
  explanation: Su vehículo puede tener neumáticos para nieve con clavos solo del 1
    de noviembre al 1 de abril.
- id: 317
  category: vehicle_information
  question: ¿Cuál es el bloqueo de luz máximo permitido para el polarizado en las
    ventanas de las puertas delanteras?
  choices:
    A: 35%
    B: 50%
    C: 65%
    D: 80%
  answer: C
  explanation: Se permite el polarizado o material de protección solar en las ventanas
    laterales y traseras (las ventanas de las puertas delanteras con no más del 65%
    de bloqueo de luz).
- id: 318
  category: vehicle_information
  question: ¿Cuál es el ancho máximo permitido para cualquier vehículo sin un permiso
    especial?
  choices:
    A: 8 pies
    B: 8½ pies
    C: 9 pies
    D: 9½ pies
  answer: B
  explanation: El ancho máximo de cualquier vehículo es de 8½ pies.
- id: 319
  category: vehicle_information
  question: ¿Cuál es la altura máxima de cualquier vehículo en autopistas fuera de
    una zona comercial o autopistas designadas?
  choices:
    A: 13½ pies
    B: 14 pies
    C: 14½ pies
    D: 15 pies
  answer: A
  explanation: La altura máxima en todas las demás autopistas (fuera de las zonas
    comerciales y autopistas designadas) es de 13½ pies.
- id: 320
  category: safe_driving_rules
  question: ¿Qué tan lejos de los límites de la ciudad se extiende la zona comercial
    de la ciudad de St. Louis?
  choices:
    A: 2 millas
    B: 12 millas
    C: 15 millas
    D: 18 millas
  answer: D
  explanation: La zona comercial de la ciudad de St. Louis se extiende 18 millas más
    allá de los límites de la ciudad.
- id: 321
  category: safe_driving_rules
  question: 'Los transportistas de vehículos motorizados pueden llevar cargas que
    excedan sus límites legales de longitud, pero la carga no debe extenderse más
    de:'
  choices:
    A: Dos pies más allá de la parte delantera o tres pies más allá de la parte trasera
    B: Tres pies más allá de la parte delantera o cuatro pies más allá de la parte
      trasera
    C: Cuatro pies más allá de la parte delantera o cinco pies más allá de la parte
      trasera
    D: Cinco pies más allá de la parte delantera o seis pies más allá de la parte
      trasera
  answer: B
  explanation: Las cargas no deben extenderse más de tres pies más allá de la parte
    delantera o cuatro pies más allá de la parte trasera del vehículo.
- id: 322
  category: vehicle_information
  question: ¿Cuál es el peso bruto máximo permitido en todas las carreteras de Missouri,
    excepto donde las estructuras de los puentes tengan señalizados límites menores?
  choices:
    A: 60,000 libras
    B: 70,000 libras
    C: 80,000 libras
    D: 90,000 libras
  answer: C
  explanation: El peso bruto máximo permitido en todas las carreteras de Missouri
    es de 80,000 libras, excepto donde las estructuras de los puentes tengan señalizados
    límites de peso menores.
- id: 323
  category: vehicle_information
  question: ¿Cuál de los siguientes es un requisito para recibir un permiso de exceso
    de dimensiones o de peso?
  choices:
    A: La carga en su vehículo debe ser reducible.
    B: Debe tener un seguro de responsabilidad civil por daños a la propiedad y lesiones
      corporales.
    C: Debe conducir un vehículo con licencia para uso agrícola.
    D: Debe tener un mínimo de cinco ejes.
  answer: B
  explanation: Para recibir un permiso de exceso de dimensiones o de peso, la carga
    de su vehículo debe ser no reducible, debe tener un seguro de responsabilidad
    civil por daños a la propiedad y lesiones corporales, y debe pagar una tarifa
    de permiso.
- id: 324
  category: safe_driving_rules
  question: ¿Qué tipo de vehículo comercial tiene prohibido transportar antorchas
    de combustión líquida (bengalas) como dispositivos de advertencia de emergencia?
  choices:
    A: Vehículos que transportan residuos sólidos.
    B: Vehículos con licencia para más de 12,000 libras.
    C: Vehículos que transportan material explosivo o inflamable.
    D: Vehículos que operan únicamente dentro del estado (intrastatales).
  answer: C
  explanation: La combinación de tres bengalas, tres fusibles y dos banderas rojas
    no debe ser transportada por vehículos que trasladen material explosivo o inflamable,
    o que utilicen gas comprimido inflamable como combustible para el motor.
- id: 325
  category: safe_driving_rules
  question: Si conduce un autobús o un camión, ¿cuál es la distancia mínima que debe
    mantener al seguir a otro autobús o camión fuera de un distrito comercial o residencial?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Si conduce un autobús o un camión, no debe seguir a otro autobús o
    camión a menos de 300 pies. Sin embargo, puede seguirlos más de cerca cuando se
    encuentre en un distrito comercial o residencial, o al rebasar.
- id: 326
  category: defensive_driving
  question: ¿Cuál es la regla de distancia de seguimiento recomendada para un vehículo
    comercial basada en su longitud?
  choices:
    A: Mantenga al menos un segundo entre usted y el vehículo de adelante por cada
      diez pies de longitud de su vehículo.
    B: Mantenga al menos dos segundos entre usted y el vehículo de adelante por cada
      diez pies de longitud.
    C: Mantenga al menos un segundo por cada veinte pies de longitud.
    D: Mantenga una distancia de seguimiento estándar de cuatro segundos independientemente
      de la longitud.
  answer: A
  explanation: Por cada diez pies de longitud de su vehículo, mantenga al menos un
    segundo entre usted y el vehículo que tiene delante. Por ejemplo, un vehículo
    de 40 pies requiere cuatro segundos.
- id: 327
  category: safe_driving_rules
  question: ¿Cuál de los siguientes vehículos está obligado a detenerse entre 15 y
    50 pies antes de las vías del tren?
  choices:
    A: Un vehículo comercial con licencia para 18,000 libras o menos.
    B: Un transportista de residuos sólidos.
    C: Un autobús escolar.
    D: Cualquier vehículo que transporte una carga no reducible.
  answer: C
  explanation: Debe detenerse entre 15 y 50 pies antes de las vías del tren si conduce
    un autobús escolar, un vehículo motorizado que transporte pasajeros por contrato
    o un vehículo que transporte ciertos materiales peligrosos.
- id: 328
  category: vehicle_information
  question: 'Para compensar la desviación de las ruedas traseras (off-tracking) al
    realizar un giro a la derecha en un vehículo grande, usted debe:'
  choices:
    A: Comenzar el giro lo más a la derecha posible.
    B: Comenzar el giro lo más a la izquierda posible.
    C: Acelerar rápidamente durante el giro.
    D: Girar el volante bruscamente antes de avanzar.
  answer: B
  explanation: Cuando un vehículo gira, las ruedas traseras siguen una trayectoria
    más corta que las delanteras. Para compensar la desviación de las ruedas traseras,
    comience el giro a la derecha lo más a la izquierda posible.
- id: 329
  category: safe_driving_rules
  question: 'Todos los vehículos motorizados comerciales deben detenerse en las estaciones
    de pesaje, EXCEPTO aquellos con licencia para:'
  choices:
    A: 12,000 libras o menos.
    B: 18,000 libras o menos.
    C: 26,000 libras o menos.
    D: 36,000 libras o menos.
  answer: B
  explanation: Todos los vehículos motorizados comerciales deben detenerse en las
    estaciones de pesaje, excepto aquellos con licencia para 18,000 libras o menos
    o que estén exentos por ley, a menos que lo indique un oficial de paz.
- id: 330
  category: defensive_driving
  question: Si otro vehículo lo sigue muy de cerca (tailgating), ¿cuál es la acción
    más segura?
  choices:
    A: Parpadear sus luces de freno para advertir al conductor que lo sigue.
    B: Acelerar para aumentar la distancia entre usted y el vehículo de atrás.
    C: Hacer una parada repentina para obligar al conductor de atrás a retroceder.
    D: Reducir la velocidad y aumentar la distancia entre usted y el vehículo de adelante.
  answer: D
  explanation: Para evitar un choque con alguien que lo sigue muy de cerca, debe reducir
    la velocidad, evitar giros o paradas repentinas, aumentar la distancia entre usted
    y el vehículo de adelante, y no parpadear sus luces traseras o de freno.
- id: 331
  category: driver_responsibility
  question: Según el manual, ¿qué se considera, con diferencia, la distracción al
    conducir de mayor riesgo?
  choices:
    A: Comer y beber
    B: Ajustar el radio
    C: Enviar mensajes de texto
    D: Hablar con los pasajeros
  answer: C
  explanation: Debido a que el envío de mensajes de texto requiere atención visual,
    manual y cognitiva por parte del conductor, es con diferencia la distracción de
    mayor riesgo.
- id: 332
  category: safe_driving_rules
  question: ¿Cuál es la forma adecuada de viajar con una mascota en un vehículo en
    movimiento?
  choices:
    A: Permitir que la mascota se siente en su regazo para mantenerla tranquila.
    B: Asegurar a la mascota en un transportador de mascotas, una jaula portátil o
      un arnés especialmente diseñado.
    C: Dejar que la mascota deambule libremente en el asiento trasero.
    D: Sujetar a la mascota con una mano mientras conduce con la otra.
  answer: B
  explanation: Asegure adecuadamente a su mascota en un transportador de mascotas,
    una jaula portátil o un arnés para mascotas especialmente diseñado cuando esté
    conduciendo. Nunca permita que su mascota se siente en su regazo mientras conduce.
- id: 333
  category: vehicle_information
  question: ¿Qué información debe ser claramente visible en un vehículo motorizado
    comercial que se utiliza regularmente para fines comerciales y tiene una licencia
    para más de 36,000 libras?
  choices:
    A: El número de la licencia de conducir del operador.
    B: El nombre del propietario y la dirección desde la cual se opera el vehículo.
    C: El peso bruto máximo permitido para el vehículo.
    D: La longitud y anchura exactas del vehículo.
  answer: B
  explanation: 'La siguiente información debe ser claramente visible en los vehículos
    motorizados comerciales: el nombre del propietario; la dirección desde la cual
    se opera el vehículo y el número emitido a un transportista motorizado.'
- id: 334
  category: defensive_driving
  question: 'Al verificar el espacio libre superior para su vehículo comercial, usted
    debe:'
  choices:
    A: Confiar siempre en que las alturas publicadas en los puentes son correctas.
    B: Solo verificar el espacio libre cuando conduzca por caminos no pavimentados.
    C: No asumir que las alturas publicadas en puentes o pasos inferiores son correctas.
    D: Confiar en que el vehículo detrás de usted le advierta sobre espacios libres
      bajos.
  answer: C
  explanation: Asegúrese de tener suficiente espacio sobre su vehículo en todo momento.
    No asuma que las alturas publicadas en puentes o pasos inferiores son correctas.
- id: 335
  category: vehicle_information
  question: 'Un vehículo motorizado comercial utilizado para el comercio intraestatal
    con licencia para más de 12,000 libras debe llevar un extintor de incendios con
    una clasificación de al menos:'
  choices:
    A: 2 A:B
    B: 5 B:C
    C: 10 B:C
    D: 15 A:C
  answer: B
  explanation: Cualquier otro vehículo motorizado comercial utilizado para el comercio
    intraestatal o interestatal que tenga licencia para más de 12,000 libras debe
    llevar... Un extintor de incendios. El extintor debe tener una clasificación de
    5 B:C o más.
- id: 336
  category: defensive_driving
  question: ¿Cómo afectan el peso y la longitud de su vehículo al cruzar o entrar
    en el tráfico?
  choices:
    A: Un vehículo más pesado acelera más rápido, requiriendo un espacio más pequeño.
    B: La longitud del vehículo no afecta el tiempo que tarda en cruzar la carretera.
    C: Un vehículo largo o muy pesado necesita un espacio más grande para cruzar la
      carretera que un automóvil.
    D: Los vehículos pesados tienen el derecho de paso, por lo que el tamaño del espacio
      es irrelevante.
  answer: C
  explanation: Su tasa de aceleración varía según el peso de su vehículo. Y su tiempo
    para cruzar la carretera también se ve afectado por la longitud de su vehículo.
    En un vehículo largo o muy pesado, necesitará un espacio más grande para cruzar
    la carretera de lo que necesitaría en un automóvil.
- id: 337
  category: safe_driving_rules
  question: ¿Cuándo es el mejor momento para ajustar los controles de su vehículo,
    como el control de temperatura, los espejos o el radio?
  choices:
    A: Mientras está detenido en una señal de ceda el paso
    B: Antes de comenzar a conducir
    C: Mientras conduce por una carretera recta
    D: Solo cuando conduzca a menos de 30 mph
  answer: B
  explanation: El manual establece que debe ajustar los controles de su vehículo (control
    de temperatura, espejos, radio, asiento, etc.) antes de comenzar a conducir para
    disminuir el riesgo de un choque.
- id: 338
  category: safe_driving_rules
  question: Si necesita ajustar el control de temperatura o el sistema de navegación
    mientras conduce, ¿cuál es una práctica segura recomendada?
  choices:
    A: Pedir a sus pasajeros que los ajusten por usted
    B: Maniobrar el volante con las rodillas mientras ajusta
    C: Esperar hasta estar en la autopista
    D: Detenerse en el arcén izquierdo inmediatamente
  answer: A
  explanation: El manual recomienda pedir a sus pasajeros que ajusten el radio, el
    control de temperatura, el sistema de navegación, etc., por usted para evitar
    la conducción distraída.
- id: 339
  category: defensive_driving
  question: Según el manual, ¿cuál de los siguientes se considera una distracción
    visual fuera de su ventana en la que puede ser peligroso concentrarse?
  choices:
    A: El velocímetro de su vehículo
    B: La escena de un choque
    C: El espejo retrovisor
    D: El camino por delante
  answer: B
  explanation: Mirar por la ventana la escena de un choque, una valla publicitaria,
    un vehículo detenido o una vista panorámica puede ser una distracción si se concentra
    en observarlo bien.
- id: 340
  category: safe_driving_rules
  question: Según la ley de dispositivos de comunicación electrónica, ¿qué tiene prohibido
    hacer un conductor mientras el vehículo está en movimiento?
  choices:
    A: Usar funciones operadas por voz
    B: Sostener físicamente un teléfono celular con cualquier parte de su cuerpo
    C: Utilizar el Bluetooth del automóvil
    D: Escuchar un podcast
  answer: B
  explanation: Mientras el vehículo está en movimiento, los conductores tienen prohibido
    sostener o apoyar físicamente un teléfono celular con cualquier parte de su cuerpo.
- id: 341
  category: safe_driving_rules
  question: ¿Mientras conduce un vehículo motorizado en movimiento, cuál de las siguientes
    acciones relacionadas con un teléfono celular es ilegal?
  choices:
    A: Enviar un mensaje de texto usando funciones de voz a texto
    B: Escribir o leer manualmente un mensaje de texto
    C: Realizar una llamada manos libres con un solo toque
    D: Escuchar una grabación de audio digital
  answer: B
  explanation: Se prohíbe a los conductores escribir, redactar, enviar o leer manualmente
    mensajes de texto mientras el vehículo está en movimiento.
- id: 342
  category: safe_driving_rules
  question: 'La ley sobre dispositivos de comunicación electrónica permite a los conductores:'
  choices:
    A: Ver un video o película
    B: Transmitir un video en vivo en redes sociales
    C: Realizar una llamada de voz manos libres con un solo toque o deslizamiento
    D: Sostener el teléfono sobre su hombro mientras habla
  answer: C
  explanation: La ley permite a los conductores realizar o recibir llamadas de voz
    utilizando funciones operadas por voz o manos libres que pueden activarse o desactivarse
    con un solo toque o deslizamiento.
- id: 343
  category: safe_driving_rules
  question: ¿De qué manera se les permite legalmente a los conductores enviar o recibir
    comunicaciones de texto mientras conducen?
  choices:
    A: Escribiendo con una mano
    B: A través de funciones de voz a texto
    C: Solo mientras están detenidos en un semáforo en rojo
    D: Teniendo el teléfono apoyado en su regazo
  answer: B
  explanation: La ley permite a los conductores enviar o recibir comunicaciones de
    texto a través de funciones de voz a texto.
- id: 344
  category: safe_driving_rules
  question: 'Para que el conductor de una empresa de red de transporte pueda usar
    legalmente un dispositivo para transmitir información a través de una red digital
    mientras conduce, el dispositivo debe estar:'
  choices:
    A: Sostenido en la mano del conductor
    B: Colocado en el asiento del pasajero
    C: Fijado o montado en el vehículo
    D: Guardado en la guantera
  answer: C
  explanation: El conductor de una empresa puede usar un dispositivo para transmitir
    información a través de la red digital de una empresa de red de transporte, siempre
    que el dispositivo esté fijado o montado en el vehículo.
- id: 345
  category: penalties_and_points
  question: 'Antes del 1 de enero de 2025, los conductores que violen las disposiciones
    sobre el uso de un dispositivo de comunicación electrónica pueden estar sujetos
    a:'
  choices:
    A: Una advertencia
    B: Una infracción
    C: La suspensión de la licencia
    D: Un cargo por delito grave
  answer: A
  explanation: Antes del 1 de enero de 2025, los conductores que violen estas disposiciones
    sobre el uso de un dispositivo de comunicación electrónica pueden estar sujetos
    a una advertencia.
- id: 346
  category: penalties_and_points
  question: ¿A qué posible sanción se enfrentan los conductores comerciales si violan
    la sección de dispositivos de comunicación electrónica?
  choices:
    A: Descalificación
    B: Repetición obligatoria del examen de conducir
    C: Prohibición permanente de conducir cualquier vehículo
    D: Confiscación de su carga
  answer: A
  explanation: Los conductores comerciales que violen esta sección pueden estar sujetos
    a la descalificación, y también pueden aplicarse multas y sanciones penales.
- id: 347
  category: alcohol_drugs_health
  question: Según el índice del manual, ¿qué significan las siglas 'BAC'?
  choices:
    A: Control Automotriz Básico (Basic Auto Control)
    B: Contenido de Alcohol en la Sangre (Blood Alcohol Content)
    C: Verificación de Evaluación del Alcoholímetro (Breathalyzer Assessment Check)
    D: Oficina de Choques Automovilísticos (Bureau of Automotive Crashes)
  answer: B
  explanation: El índice del manual indica que BAC significa Contenido de Alcohol
    en la Sangre (Blood Alcohol Content).
- id: 348
  category: license_system
  question: 'Según el índice del manual, la licencia Clase E se conoce como:'
  choices:
    A: Licencia de Conducir Comercial (Commercial Driver License)
    B: Licencia de Conducir Completa (Full Driver License)
    C: Licencia de Alquiler (For-Hire License)
    D: Licencia Intermedia (Intermediate License)
  answer: C
  explanation: El índice enumera la licencia Clase E como una 'Licencia de Alquiler'
    (For-Hire License).
- id: 349
  category: license_system
  question: ¿Qué significan las siglas 'GDL' en el manual del conductor de Missouri?
  choices:
    A: Límites Generales de Conducción (General Driving Limits)
    B: Ley de Licencia de Conducir Graduada (Graduated Driver License Law)
    C: Aprendizaje de Conducción Guiado (Guided Driver Learning)
    D: Responsabilidad de Conducción Bruta (Gross Driving Liability)
  answer: B
  explanation: El índice se refiere a GDL como la Ley de Licencia de Conducir Graduada
    (Graduated Driver License Law).
- id: 350
  category: license_system
  question: ¿Qué indica la notación 'DHH' en una solicitud de licencia de conducir?
  choices:
    A: El conductor tiene discapacidades (Driver Has Handicaps)
    B: Sordo o con dificultades auditivas (Deaf or Hard of Hearing)
    C: Departamento de Salud de Carreteras (Department of Highway Health)
    D: Historial de Peligros al Conducir (Driving Hazard History)
  answer: B
  explanation: El índice indica que la notación 'DHH' es para solicitantes sordos
    o con dificultades auditivas (Deaf or Hard of Hearing).
- id: 351
  category: driver_responsibility
  question: ¿Cuál es el número gratuito de asistencia de emergencia a nivel estatal
    de la Patrulla de Caminos (Highway Patrol)?
  choices:
    A: 1-800-525-5555
    B: 1-800-911-0000
    C: 1-888-555-1234
    D: 1-800-444-4444
  answer: A
  explanation: De acuerdo con la sección de información de contacto, el número gratuito
    de asistencia de emergencia a nivel estatal de la Patrulla de Caminos es 1-800-525-5555.
- id: 352
  category: driver_responsibility
  question: ¿Qué número puede marcar desde un teléfono celular para comunicarse con
    la Asistencia de Emergencia a Nivel Estatal de la Patrulla de Caminos?
  choices:
    A: '*911'
    B: '*55'
    C: '*HP'
    D: '*77'
  answer: B
  explanation: El manual establece que puede marcar *55 desde un teléfono celular
    para obtener Asistencia de Emergencia a Nivel Estatal de la Patrulla de Caminos.
- id: 353
  category: license_system
  question: ¿A qué número de teléfono debe llamar para obtener información general
    sobre preguntas relacionadas con la licencia de conducir?
  choices:
    A: (573) 526-3669
    B: (573) 751-1887
    C: (573) 526-2407
    D: (816) 622-0800
  answer: B
  explanation: La información de contacto indica el (573) 751-1887 como el número
    para información general sobre preguntas relacionadas con la licencia de conducir.
- id: 354
  category: license_system
  question: ¿Qué número proporciona información automatizada las 24 horas, los 7 días
    de la semana, para preguntas sobre la licencia de conducir?
  choices:
    A: (573) 526-2407
    B: (573) 751-1887
    C: (573) 526-3669
    D: (800) 525-5555
  answer: A
  explanation: El manual indica el (573) 526-2407 como la línea de información automatizada
    las 24 horas, los 7 días de la semana, para preguntas sobre la licencia de conducir.
- id: 355
  category: vehicle_information
  question: Si tiene preguntas generales sobre vehículos motorizados, ¿a qué número
    de teléfono debe comunicarse?
  choices:
    A: (573) 751-1887
    B: (573) 526-2407
    C: (573) 526-3669
    D: (417) 895-6868
  answer: C
  explanation: La sección de información de contacto proporciona el (573) 526-3669
    para información general sobre preguntas relacionadas con vehículos motorizados.
- id: 356
  category: driver_responsibility
  question: ¿Dónde se encuentra ubicada la Tropa A de la Patrulla de Caminos del Estado?
  choices:
    A: Macon
    B: Lee's Summit
    C: Springfield
    D: Rolla
  answer: B
  explanation: De acuerdo con la información de contacto, la Tropa A de la Patrulla
    de Caminos del Estado se encuentra en Lee's Summit.
- id: 357
  category: driver_responsibility
  question: ¿Qué tropa de la Patrulla de Caminos del Estado se encuentra en Jefferson
    City?
  choices:
    A: Tropa C
    B: Tropa E
    C: Tropa F
    D: Tropa H
  answer: C
  explanation: La información de contacto indica que la Tropa F se encuentra en Jefferson
    City.
- id: 358
  category: license_system
  question: ¿Qué clase de licencia está designada para una licencia de motocicleta?
  choices:
    A: Clase A
    B: Clase C
    C: Clase M
    D: Clase ND
  answer: C
  explanation: El índice enumera la licencia de motocicleta como una licencia (Clase
    M).
- id: 359
  category: license_system
  question: ¿Qué abreviatura se utiliza en el manual para denotar una tarjeta de identificación
    para no conductores (Nondriver Identification Card)?
  choices:
    A: NI
    B: ND
    C: NIC
    D: NDI
  answer: B
  explanation: El índice enumera la tarjeta de identificación para no conductores
    con la abreviatura (ND).
- id: 360
  category: signs_and_signals
  question: Según el índice del manual, ¿las señales de tránsito se categorizan por
    cuál de las siguientes características?
  choices:
    A: Colores, formas y tipos
    B: Tamaño, reflectividad y ubicación
    C: Reglamentarias, de advertencia y de guía
    D: Velocidad, dirección y distancia
  answer: A
  explanation: 'El índice divide la sección de ''Señales de tránsito'' en tres subcategorías:
    colores, formas y tipos.'
- id: 361
  category: license_system
  question: ¿El manual incluye una exención específica de la documentación requerida
    para qué grupo de personas?
  choices:
    A: Veteranos militares
    B: Ciudadanos de la tercera edad
    C: Transferencias de fuera del estado
    D: Conductores adolescentes
  answer: B
  explanation: El índice enumera una sección titulada 'Exención de documentación requerida
    para ciudadanos de la tercera edad'.
- id: 362
  category: driver_responsibility
  question: Si necesita ponerse en contacto con la Tropa I de la Patrulla de Caminos
    del Estado (State Highway Patrol), ¿en qué ciudad se encuentran?
  choices:
    A: Rolla
    B: Macon
    C: Willow Springs
    D: Lee's Summit
  answer: A
  explanation: La información de contacto indica que la Tropa I de la Patrulla de
    Caminos del Estado se encuentra en Rolla.
- id: 363
  category: driver_responsibility
  question: ¿Qué dos subtemas cubre específicamente la sección del manual sobre accidentes
    de tráfico?
  choices:
    A: Reclamaciones de seguros y responsabilidad civil
    B: Qué hacer y cómo reportar un accidente
    C: Vehículos en movimiento y primeros auxilios
    D: Informes policiales y remolque
  answer: B
  explanation: El índice enumera 'Qué hacer' y 'Cómo reportar un accidente' como los
    subtemas específicos bajo Accidentes de Tráfico.
- id: 364
  category: driver_testing
  question: Según el índice, ¿la sección del examen de la vista incluye información
    específica sobre qué situación?
  choices:
    A: Uso de lentes de contacto
    B: Reprobar el examen de la vista
    C: Cirugía ocular con láser
    D: Ceguera nocturna
  answer: B
  explanation: El índice enumera explícitamente 'Reprobar el examen de la vista' como
    un subtema bajo la sección del examen de la vista.
- id: 365
  category: safe_driving_rules
  question: ¿Cuál es la circunstancia número uno que contribuye a los accidentes de
    tráfico en Missouri?
  choices:
    A: Exceso de velocidad
    B: Conducir bajo la influencia
    C: Falta de atención del conductor
    D: Condiciones climáticas
  answer: C
  explanation: Según el manual, la circunstancia número uno que contribuye a los accidentes
    de tráfico en Missouri es la falta de atención del conductor.
- id: 366
  category: sharing_the_road
  question: Según la ley de Missouri, ¿qué debe hacer cuando se aproxima un vehículo
    de emergencia?
  choices:
    A: Acelerar para apartarse del camino
    B: Detenerse inmediatamente en su carril actual
    C: Ceder el paso, conducir lo más a la derecha posible y detenerse
    D: Moverse al carril izquierdo y reducir la velocidad
  answer: C
  explanation: La ley exige que los automovilistas cedan el paso e inmediatamente
    conduzcan a una posición paralela y lo más a la derecha posible de la parte transitada
    de la carretera y se detengan.
- id: 367
  category: sharing_the_road
  question: ¿Cuánto tiempo debe permanecer detenido cuando se hace a un lado por un
    vehículo de emergencia que se aproxima?
  choices:
    A: Durante al menos un minuto
    B: Hasta que el vehículo de emergencia haya pasado
    C: Hasta que pueda incorporarse al tráfico de forma segura
    D: Hasta que el vehículo de emergencia se pierda de vista
  answer: B
  explanation: Los automovilistas deben detenerse y permanecer en esa posición hasta
    que el vehículo de emergencia haya pasado, a menos que un oficial indique lo contrario.
- id: 368
  category: safe_driving_rules
  question: Si se aproxima a un vehículo de emergencia estacionado con luces intermitentes
    y cambiar de carril no sería seguro, ¿qué le exige la ley que haga?
  choices:
    A: Detenerse en la calzada hasta que el vehículo se retire
    B: Proceder con la debida precaución y reducir la velocidad
    C: Acelerar para rebasar el vehículo rápidamente
    D: Hacerse a la derecha y esperar instrucciones
  answer: B
  explanation: Si cambiar de carril fuera inseguro o imposible, debe proceder con
    la debida precaución y reducir la velocidad del vehículo, manteniendo una velocidad
    segura para las condiciones de la carretera.
- id: 369
  category: penalties_and_points
  question: ¿Cuál es la sanción por violar la ley relativa a la aproximación a un
    vehículo de emergencia estacionado?
  choices:
    A: Un delito grave de Clase C
    B: Un delito menor de Clase A
    C: Una infracción de tráfico con una multa de $50
    D: Una advertencia por la primera infracción
  answer: B
  explanation: La violación de la sección relativa a la aproximación a un vehículo
    de emergencia estacionado es un delito menor de Clase A.
- id: 370
  category: sharing_the_road
  question: ¿Bajo qué circunstancia NO se le exige hacerse a la derecha y detenerse
    ante un vehículo de emergencia que se aproxima?
  choices:
    A: Cuando tiene prisa
    B: Cuando conduce por una calle de sentido único
    C: Cuando un oficial de policía o de tránsito indique lo contrario
    D: Cuando el vehículo de emergencia está en el carril opuesto de una carretera
      dividida
  answer: C
  explanation: Debe hacerse a un lado y detenerse hasta que el vehículo de emergencia
    haya pasado, excepto cuando un oficial de policía o de tránsito indique lo contrario.
- id: 371
  category: sharing_the_road
  question: La revisión de 2017 de la ley "Move Over" (Moverse a un Lado) se aplica
    a vehículos detenidos que muestran ¿qué colores de luces?
  choices:
    A: Luces verdes o moradas
    B: Luces rojas, rojas y azules, o ámbar y blancas
    C: Solo luces rojas
    D: Solo luces azules
  answer: B
  explanation: La ley se aplica a los conductores que se aproximan a un vehículo de
    emergencia detenido que muestra luces rojas o rojas y azules encendidas, o a vehículos
    que muestran luces ámbar o ámbar y blancas.
- id: 372
  category: defensive_driving
  question: Según el manual, ¿qué dos factores estuvieron involucrados cuando los
    oficiales fueron atropellados y murieron por vehículos?
  choices:
    A: Exceso de velocidad y conducción temeraria
    B: Conducir bajo los efectos del alcohol o drogas o no prestar atención
    C: Falla del vehículo y mal tiempo
    D: Conducción nocturna y falta de visibilidad
  answer: B
  explanation: El manual establece que ocho oficiales murieron tras ser atropellados
    por un vehículo cuyo conductor estaba bajo los efectos de sustancias o no estaba
    prestando atención.
- id: 373
  category: sharing_the_road
  question: Cuando se le requiere ceder el paso a un vehículo de emergencia que se
    aproxima, ¿dónde debe posicionar su vehículo?
  choices:
    A: Paralelo y lo más a la derecha posible de la parte transitada de la carretera
    B: En la mediana central de la carretera
    C: Lo más a la izquierda posible
    D: En la intersección más cercana
  answer: A
  explanation: La ley exige que los conductores se dirijan inmediatamente a una posición
    paralela y lo más a la derecha posible de la parte transitada de la carretera.
- id: 374
  category: sharing_the_road
  question: Para que se le exija cambiar de carril para alejarse de un vehículo de
    emergencia detenido, ¿la calzada debe tener al menos cuántos carriles que circulen
    en la misma dirección?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: El requisito de cambio de carril se aplica si se circula por una calzada
    que tiene al menos cuatro carriles, con no menos de dos carriles que circulen
    en la misma dirección que el vehículo que se aproxima.
- id: 375
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima a un vehículo detenido que muestra luces
    ámbar o ámbar y blancas a un lado de la carretera?
  choices:
    A: Tratarlo como un vehículo normal y mantener la velocidad
    B: Proceder con precaución y ceder el derecho de paso cambiando de carril si es
      posible
    C: Detenerse y ofrecer asistencia
    D: Tocar la bocina para advertirles de su aproximación
  answer: B
  explanation: La ley exige que los conductores que se aproximen a vehículos que muestren
    luces ámbar o ámbar y blancas procedan con precaución y cedan el derecho de paso
    realizando un cambio de carril si es posible.
- id: 376
  category: defensive_driving
  question: ¿Cuál es el mensaje principal de la sección "La seguridad está en sus
    hombros" (Safety is on Your Shoulders) con respecto a los vehículos de emergencia
    detenidos?
  choices:
    A: Siempre deténgase y ayude a los vehículos detenidos
    B: Reduzca la velocidad y muévase a otro carril para alejarse de los vehículos
      detenidos con equipo de emergencia activado
    C: Aumente la velocidad para despejar el área rápidamente
    D: Tome fotos de la escena de emergencia para informar
  answer: B
  explanation: 'El manual establece explícitamente: "Por favor, reduzca la velocidad
    y muévase a otro carril para alejarse de los vehículos detenidos a lo largo de
    la carretera con su equipo de emergencia activado. ES LA LEY".'
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que se aproxima
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octogonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 377
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Deténgase por completo
    B: Aumente la velocidad para incorporarse al tráfico
    C: Reduzca la velocidad y ceda el derecho de paso al tráfico y a los peatones
    D: Proceda sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 378
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 379
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debería hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una calle de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 380
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 381
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 382
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 383
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 384
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro en forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona donde está prohibido adelantar.
  id: 385
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 386
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 387
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan frecuentemente la carretera en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 388
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 389
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 390
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 391
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de trenes. Significa que debe ceder el paso a los trenes. Si se
    aproxima un tren, debe detenerse.
  id: 392
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 393
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 394
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 395
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 396
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: Inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 397
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Fin de la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 398
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 399
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 400
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de sentido único o de una autopista dividida
    y se encuentre con vehículos que circulan en la dirección opuesta.
  id: 401
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 402
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 403
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo
    donde el semáforo puede no ser visible desde la distancia.
  id: 404
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 405
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las calles laterales.
  id: 406
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la carretera desde la calle lateral.
  id: 407
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: 'Se está añadiendo un nuevo carril: no es necesario incorporarse'
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir incorporación. El tráfico que entra desde la rampa tiene
    su propio carril nuevo.
  id: 408
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionar en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 409
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para discapacitados válido pueden
    estacionar en estos espacios. Las infracciones conllevan multas elevadas.
  id: 410
