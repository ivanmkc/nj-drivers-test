questions:
- id: 1
  category: driver_testing
  question: ミズーリ州の運転免許筆記試験に合格するには、何問正解する必要がありますか？
  choices:
    A: '15'
    B: '18'
    C: '20'
    D: '25'
  answer: C
  explanation: マニュアルによると、筆記試験に合格するには25問の多肢選択式問題のうち20問に正解する必要があります。
- id: 2
  category: license_system
  question: ミズーリ州で運転する際、ミズーリ州の運転免許証を所持している必要が「ない」のは次のうち誰ですか？
  choices:
    A: 他州の免許証を持っているミズーリ州の新規居住者。
    B: 出身州の有効な運転免許証を持っているフルタイムの学生。
    C: 運転を予定している16歳のミズーリ州居住者。
    D: 20日前にミズーリ州に転入した他州の商用ドライバー。
  answer: B
  explanation: マニュアルには、フルタイムの学生であり、出身州の有効な運転免許証を持っている場合は、ミズーリ州の運転免許証は必要ないと記載されています。
- id: 3
  category: license_system
  question: ミズーリ州で標準的な学習許可証（Instruction Permit）を取得できる最低年齢は何歳ですか？
  choices:
    A: '14'
    B: '15'
    C: 15歳半
    D: '16'
  answer: B
  explanation: ミズーリ州の段階的運転免許プログラム（GDL）の最初のステップである学習許可証（Instruction Permit）の対象年齢は15歳です。
- id: 4
  category: license_system
  question: ミズーリ州高速道路巡回隊（Missouri State Highway Patrol）から発行された運転試験成績表はどうしなければなりませんか？
  choices:
    A: 有効な仮許可証としてダッシュボードの小物入れに保管する。
    B: 30日以内に財務局（Department of Revenue）に郵送する。
    C: 実際の許可証または免許証を申請するために、地元の免許事務局に持参する。
    D: 運転練習を始める前に、免許を持つ成人に提示する。
  answer: C
  explanation: 運転試験成績表は、許可証や免許証として有効ではありません。成績表の控えとその他の必要書類を地元の免許事務局に持参し、実際の許可証または免許証を申請する必要があります。
- id: 5
  category: license_system
  question: 中間免許（Intermediate License）に必要とされる6ヶ月間の許可証保持期間は、公式にいつから始まりますか？
  choices:
    A: 15歳の誕生日。
    B: 筆記試験に合格したとき。
    C: ミズーリ州高速道路巡回隊が試験成績表を発行したとき。
    D: 免許事務局で仮学習許可証（Temporary Instruction Permit）が発行されたとき。
  answer: D
  explanation: マニュアルには、中間免許に必要とされる6ヶ月間の許可証保持期間は、免許事務局で仮学習許可証が発行されるまで開始されないと明記されています。
- id: 6
  category: license_system
  question: 承認されたモーターサイクル・ライダー・トレーニング・コースを修了すること「なく」、二輪車学習許可証（Motorcycle Instruction
    Permit）を申請できるのは何歳からですか？
  choices:
    A: '15'
    B: 15歳半
    C: '16'
    D: '18'
  answer: C
  explanation: 16歳以上であれば、二輪車学習許可証を申請することができ、モーターサイクル・ライダー・トレーニング・コースの受講は義務付けられていません。
- id: 7
  category: license_system
  question: 二輪車学習許可証を保持する15歳半の人に対する制限事項は、次のうちどれですか？
  choices:
    A: 自宅から半径100マイル以内に限り運転できる。
    B: 同乗者を1名乗せることができる。
    C: 排気量250cc以下の二輪車のみ運転できる。
    D: 成人が同伴する場合に限り、夜間の運転が許可される。
  answer: C
  explanation: 15歳半の場合、許可証では日中の運転のみ、自宅から半径50マイル以内、排気量250cc以下の二輪車、同乗者なしという条件で運転が許可されます。
- id: 8
  category: license_system
  question: 18歳以上のドライバー向けの、一般に「オペレーター・ライセンス」とも呼ばれる基本の運転免許証の区分（クラス）は何ですか？
  choices:
    A: クラスA
    B: クラスE
    C: クラスF
    D: クラスM
  answer: C
  explanation: 普通運転免許証（クラスF）は、オペレーター・ライセンスとも呼ばれる基本の運転免許証で、対象年齢は18歳です。
- id: 9
  category: driver_testing
  question: すでにクラスFの免許を所持している場合、事業用免許（クラスE）を申請する際に「不要」な試験はどれですか？
  choices:
    A: 視力検査
    B: 道路標識テスト
    C: 筆記試験
    D: 路上試験（実技試験）
  answer: D
  explanation: クラスE免許の試験を受ける際、すでにクラスF免許を所持している場合は、路上試験（実技試験）は免除されます。
- id: 10
  category: license_system
  question: 新しい免許証や許可証を取得する際の確認書類として、明示的に記載されて「いない」ものは次のうちどれですか？
  choices:
    A: 合法的地位の証明
    B: 社会保障番号（SSN）
    C: 高校の在学証明書
    D: ミズーリ州の居住証明
  answer: C
  explanation: 新しい免許証や許可証を取得する人は、合法的地位、身元（法的氏名）、社会保障番号、およびミズーリ州の居住証明を提示する必要があります。高校の在学証明書はリストに含まれていません。
- id: 11
  category: driver_testing
  question: ミズーリ州の運転免許筆記試験には、何問の選択式問題がありますか？
  choices:
    A: '20'
    B: '25'
    C: '30'
    D: '50'
  answer: B
  explanation: 交通法規の知識を確認するため、25問の選択式問題による筆記試験を受ける必要があります。
- id: 12
  category: license_system
  question: 営業用免許（クラスE）を取得できる最低年齢は何歳ですか？
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: C
  explanation: 営業用免許（クラスE）の取得可能年齢は18歳です。
- id: 13
  category: license_system
  question: 21歳未満の場合、許可証または免許証はどのようになりますか？
  choices:
    A: 有効期間が6ヶ月間のみとなる。
    B: 未成年者であることが識別できるように記載される。
    C: 日中のみの運転が義務付けられる。
    D: 高速道路での運転が禁止される。
  answer: B
  explanation: マニュアルによると、21歳未満の場合は、未成年者であることを識別できる許可証または免許証が発行されます。
- id: 14
  category: license_system
  question: ミズーリ州の運転免許証なしで、公道（ハイウェイ）で農用トラクターを運転できるのはどのような条件の場合ですか？
  choices:
    A: 少なくとも14歳以上である場合。
    B: 農業関連の目的で運転している場合。
    C: 農場から半径50マイル以内の範囲に留まる場合。
    D: 有効な練習許可証（instruction permit）を所持している場合。
  answer: B
  explanation: 農業関連の目的で公道（ハイウェイ）において農用トラクターや農機具を運転、または一時的に操作・移動させる場合は、ミズーリ州の運転免許証は必要ありません。
- id: 15
  category: license_system
  question: ミズーリ州でクラスE免許を申請できる年齢は何歳ですか？
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: マニュアルによると、クラスE免許の取得可能年齢は18歳です。
- id: 16
  category: license_system
  question: 次のうち、営業用（クラスE）免許の取得が「義務付けられていない」のは誰ですか？
  choices:
    A: デイケアセンターのために14人以下の乗客を輸送する運転手。
    B: 報酬を得て物品を輸送する生花店の配送運転手。
    C: ファストフード店の調理済み食品の配達サービスを行う個人。
    D: 雇用主の所有する重量20,000ポンドの貨物車両を運転する運転手。
  answer: C
  explanation: ファストフード店やデリカテッセンなどの事業体のために調理済み食品の配達サービスを行う個人は、クラスE免許を取得する必要はありません。
- id: 17
  category: driver_testing
  question: クラスMの免許または許可証を取得するには、どの試験に合格する必要がありますか？
  choices:
    A: 二輪車の技能試験のみ。
    B: クラスFおよびクラスMの筆記試験、視力検査、道路標識試験、および二輪車技能試験。
    C: クラスMの筆記試験と視力検査のみ。
    D: 標準的な乗用車での運転技能試験。
  answer: B
  explanation: クラスM免許を取得するには、クラスFおよびクラスMの筆記試験、視力検査、道路標識試験、および二輪車技能試験に合格する必要があります。
- id: 18
  category: license_system
  question: 公道で原動機付自転車（モペッド）を運転するには、どのような種類の免許が必要ですか？
  choices:
    A: クラスMの二輪車限定（endorsement）。
    B: クラスEの営業用免許。
    C: 有効な普通免許（またはそれ以上の区分）。
    D: 商業用運転免許（CDL）。
  answer: C
  explanation: 原動機付自転車を運転する場合、二輪車限定（endorsement）を取得する必要はありませんが、有効な普通免許（またはそれ以上の区分）を所持している必要があります。
- id: 19
  category: license_system
  question: 危険物（Hazardous Materials）またはスクールバスの限定（endorsement）が付いた商業用運転免許（CDL）を取得するには、何歳である必要がありますか？
  choices:
    A: 16歳
    B: 18歳
    C: 21歳
    D: 25歳
  answer: C
  explanation: 危険物またはスクールバスの限定が付いたCDLを取得するには、21歳以上である必要があります。
- id: 20
  category: license_system
  question: 標準的な写真付き非運転者用身分証明書（クラスND）は、通常いつ失効しますか？
  choices:
    A: 申請後3年目の誕生日。
    B: 申請後6年目の誕生日。
    C: 有効期限はない。
    D: 発行日から10年後。
  answer: B
  explanation: 非運転者用身分証明書は、申請後6年目の誕生日に失効します。
- id: 21
  category: license_system
  question: 70歳以上でREAL ID非準拠の非運転者用身分証明書（nondriver ID）を申請する場合、そのカードの有効期限はどのくらいですか？
  choices:
    A: 3年
    B: 6年
    C: 無期限として発行される
    D: 10年
  answer: C
  explanation: 70歳以上の場合、REAL ID準拠のカードを申請しない限り、非運転者用身分証明書（nondriver ID）は無期限として発行されます。
- id: 22
  category: driver_testing
  question: 他州の運転免許証をミズーリ州に切り替える（移管する）場合、どのテストが必要ですか？
  choices:
    A: 4部構成の運転免許試験すべて
    B: 運転技能試験のみ
    C: 視力検査と道路標識テスト
    D: テストは不要
  answer: C
  explanation: 他州の運転免許証を切り替える場合は、以前の居住州の免許証を返納し、視力検査と道路標識テストを受ける必要があります。
- id: 23
  category: driver_testing
  question: ミズーリ州の運転免許証の有効期限が切れてからどのくらいの期間が経過すると、4部構成の運転免許試験を再度受ける必要がありますか？
  choices:
    A: 30日
    B: 90日
    C: 6ヶ月（184日）
    D: 1年（365日）
  answer: C
  explanation: ミズーリ州の運転免許証の有効期限が切れてから6ヶ月（184日）以上経過している場合は、4部構成の運転免許試験を受ける必要があります。
- id: 24
  category: license_system
  question: 運転免許証の申請において、法的地位（lawful status）を証明する書類として認められないものは次のうちどれですか？
  choices:
    A: 有効で期限の切れていない米国パスポート
    B: 病院発行の出生証明書
    C: 米国市民権証明書
    D: 人口動態統計局が発行した認証済みの米国出生証明書
  answer: B
  explanation: 病院発行の出生証明書や出生登録カードは、法的地位を証明する書類としては認められません。
- id: 25
  category: license_system
  question: 65歳以上の申請者がREAL ID非準拠の非商用免許証を更新する際、提示を免除される可能性がある書類はどれですか？
  choices:
    A: 出生地を証明する書類
    B: ミズーリ州の居住証明書
    C: 社会保障番号（SSN）の証明書
    D: 本人確認書類
  answer: A
  explanation: 65歳以上で、REAL ID非準拠の非商用許可証、運転免許証、または非運転者用身分証明書（nondriver ID）を更新する場合、出生地を証明する書類の提示が免除される場合があります。
- id: 26
  category: license_system
  question: 本人確認に使用される書類には、どの2つの情報が含まれている必要がありますか？
  choices:
    A: 法的氏名のフルネームと社会保障番号
    B: 法的氏名のフルネームと生年月日
    C: 生年月日と居住住所
    D: 署名と写真
  answer: B
  explanation: 本人確認に使用される書類には、法的氏名のフルネームと生年月日が含まれている必要があります。
- id: 27
  category: license_system
  question: REAL ID準拠の書類を取得するために、ミズーリ州の居住を証明する書類は何通必要ですか？
  choices:
    A: 1通
    B: 2通
    C: 3通
    D: 4通
  answer: B
  explanation: REAL ID準拠の書類を取得するには、ミズーリ州の居住を証明する書類を2通提出する必要があります。
- id: 28
  category: license_system
  question: ミズーリ州の免許証を申請する際、居住住所として認められないものは次のうちどれですか？
  choices:
    A: 郵便私書箱（P.O. Box）
    B: 本人が実際に所在し、自宅とみなしている場所
    C: 真正かつ固定された主要な住居
    D: 本人が戻る意図を持っている恒久的な住居
  answer: A
  explanation: 郵便私書箱（P.O. Box）は居住住所として認められません。居住住所の証明と、該当する場合は別の郵送先住所を提示する必要があります。
- id: 29
  category: license_system
  question: 21歳未満の申請者がミズーリ州の居住住所を証明する適切な書類を提示できない場合、認められる代替手段は何ですか？
  choices:
    A: 友人の公共料金の請求書を使用できる
    B: 親または法的保護者が代理で書類を提示できる
    C: 居住証明の提示を免除される
    D: 申請するために21歳になるまで待たなければならない
  answer: B
  explanation: 21歳未満で、リストにあるミズーリ州の居住住所を証明する適切な書類を提示できない場合は、親または法的保護者が代理でその書類を提示することができます。
- id: 30
  category: license_system
  question: ミズーリ州の免許申請において、社会保障番号（SSN）を証明する書類として認められないものは次のうちどれですか？
  choices:
    A: W-2（賃金・税金申告書）
    B: ラミネート加工された社会保障カード
    C: 1099フォーム
    D: 氏名と社会保障番号が記載された給与明細
  answer: B
  explanation: マニュアルによると、社会保障カードは原本であり、署名がなされており、かつラミネート加工されていないものでなければなりません。
- id: 31
  category: license_system
  question: 運転免許証の名（ファーストネーム）またはミドルネームを変更する必要がある場合、どの書類を提示しなければなりませんか？
  choices:
    A: 修正済みの出生証明書
    B: 公証済みの結婚許可証
    C: 公証済みの裁判所命令
    D: 公証済みの離婚判決書
  answer: C
  explanation: マニュアルによると、名（ファーストネーム）またはミドルネームの変更には、公証済みの裁判所命令が必要です。
- id: 32
  category: license_system
  question: ミズーリ州の学習許可証（Instruction Permit）の有効期間はどのくらいですか？
  choices:
    A: 0〜6ヶ月
    B: 0〜12ヶ月
    C: 承認されたコースの期間
    D: 1年間（更新不可）
  answer: B
  explanation: マニュアルの許可証手数料一覧表によると、学習許可証（Instruction Permit）の有効期間は0〜12ヶ月です。
- id: 33
  category: penalties_and_points
  question: 免許証に課された運転制限に従わなかった場合の罰則は何ですか？
  choices:
    A: 筆記試験の再受験が求められる
    B: 無免許運転で起訴される可能性がある
    C: 車両が直ちに押収される
    D: 警告書が送付される
  answer: B
  explanation: マニュアルには、「制限事項に従わない場合、無免許運転で起訴される可能性があり、有罪判決を受けた場合は運転記録に違反点数が加算されます」と記載されています。
- id: 34
  category: license_system
  question: ミズーリ州の運転免許証において、制限コード「C」は何を示していますか？
  choices:
    A: 矯正レンズ（眼鏡・コンタクト）の使用
    B: 時速45マイル（45 MPH）制限
    C: 日中走行のみ
    D: 中間免許（Intermediate License）
  answer: C
  explanation: マニュアルの制限コード一覧表によると、コード「C」は「日中走行のみ（Daylight Driving Only）」を意味します。
- id: 35
  category: alcohol_drugs_health
  question: 免許申請前のどのくらいの期間内に、てんかん発作、けいれん、または意識喪失（ブラックアウト）があった場合、財務省（Department of
    Revenue）に医師の診断書を提出しなければなりませんか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 12ヶ月
    D: 2年
  answer: B
  explanation: 免許申請前の6ヶ月以内に、てんかん発作、けいれん、または意識喪失があった場合は、医療照会（医師の診断書）が必要です。
- id: 36
  category: alcohol_drugs_health
  question: 医師または法執行官が、あなたの健康状態により安全な運転ができないと判断した場合、当局にどの書類を提出しなければなりませんか？
  choices:
    A: 医療免除申請書（Medical Variance Form）
    B: 未コード化制限フォーム（Uncoded Restriction Form）
    C: 運転者状態報告書（Driver Condition Report / フォーム4319）
    D: フォーム1099
  answer: C
  explanation: マニュアルによると、健康状態により安全な運転ができないと判断した権限を持つ個人は、運転者状態報告書（Driver Condition
    Report / フォーム4319）に記入し、当局に提出しなければなりません。
- id: 37
  category: license_system
  question: ミズーリ州でスクールバス（S）の裏書き（エンドースメント）を取得できる最低年齢は何歳ですか？
