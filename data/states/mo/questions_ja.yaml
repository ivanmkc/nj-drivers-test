    B: 取り消される可能性がある。
    C: 警告と罰金が科せられる。
    D: 安全運転講習の受講が義務付けられる。
  answer: B
  explanation: 自動車事故を起こし、指定された建設、作業、または緊急ゾーン内で道路作業員や緊急対応要員に衝突した場合、運転資格が取り消される（revoked）可能性があります。
- id: 304
