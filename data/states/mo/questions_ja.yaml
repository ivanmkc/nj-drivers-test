  choices:
    A: 20時間（うち5時間の夜間走行を含む）
    B: 30時間（うち10時間の夜間走行を含む）
    C: 40時間（うち10時間の夜間走行を含む）
    D: 50時間（うち15時間の夜間走行を含む）
