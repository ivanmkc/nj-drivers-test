  explanation: 車両が曲がるとき、後輪は前輪よりも短い経路を通ります。内輪差を補正するために、右折はできるだけ左側に寄って開始してください。
- id: 329
  category: safe_driving_rules
  question: すべての商用車は検量所に停止しなければなりませんが、以下のうち何ポンド以下で登録された車両は除外されますか？
  choices:
    A: 12,000ポンド以下。
    B: 18,000ポンド以下。
    C: 26,000ポンド以下。
    D: 36,000ポンド以下。
  answer: B
  explanation: すべての商用車は、平和維持官（警察官）の指示がない限り、18,000ポンド以下で登録された車両、または法律で免除されている車両を除き、検量所に停止しなければなりません。
- id: 330
  category: defensive_driving
  question: 他の車両に車間を詰められた（あおられた）場合、最も安全な行動は何ですか？
  choices:
    A: ブレーキランプを点滅させて、後続車に警告する。
    B: 速度を上げて、後続車との距離を広げる。
    C: 急停車して、後続車を下がらせる。
    D: 減速し、前方車両との距離を広げる。
  answer: D
  explanation: 後続車との衝突を避けるためには、減速し、急な右左折や停止を避け、前方車両との距離を広げる必要があります。テールランプやブレーキランプを点滅させてはいけません。
- id: 331
  category: driver_responsibility
  question: マニュアルによると、群を抜いて最もリスクの高い運転中の注意散漫（ディストラクション）と見なされるものはどれですか？
  choices:
    A: 飲食
    B: ラジオの調整
    C: テキストメッセージの送受信
    D: 同乗者との会話
  answer: C
  explanation: テキストメッセージの送受信は、運転者の視覚的、手動的、および認知的な注意を必要とするため、群を抜いて最もリスクの高い注意散漫となります。
- id: 332
  category: safe_driving_rules
