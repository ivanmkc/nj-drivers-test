    B: 車両の長さ10フィートにつき、前方車両との間に少なくとも2秒の間隔を空ける。
    C: 車両の長さ20フィートにつき、少なくとも1秒の間隔を空ける。
    D: 長さに関係なく、標準の4秒の車間距離を維持する。
  answer: A
  explanation: 車両の長さ10フィートにつき、前方車両との間に少なくとも1秒の間隔を空けてください。例えば、40フィートの車両の場合は4秒必要です。
- id: 327
  category: safe_driving_rules
  question: 鉄道線路の手前15〜50フィート以内で停止しなければならない車両は、次のうちどれですか？
  choices:
    A: 18,000ポンド以下で登録された商用車。
    B: 固形廃棄物運搬車。
