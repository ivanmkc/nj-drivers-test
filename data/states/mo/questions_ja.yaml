  explanation: 中級免許に昇格するには、発行日の翌日から数えて最低6ヶ月間（182日間）、学習許可証を保持している必要があります。
- id: 63
  category: driver_testing
  question: 中級免許（Intermediate License）を取得するには、過去何ヶ月間に交通違反の有罪判決がないことが条件となりますか？
  choices:
