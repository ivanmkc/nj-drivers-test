  choices:
    A: ペットを落ち着かせるために膝の上に座らせる。
    B: ペットキャリア、携帯用ケージ、または特別に設計されたハーネスでペットを固定する。
    C: 後部座席でペットを自由に歩き回らせる。
    D: 片手でハンドルを操作しながら、もう一方の手でペットを抱く。
