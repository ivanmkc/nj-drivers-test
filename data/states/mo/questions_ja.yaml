  answer: B
  explanation: この法律は、赤色または赤色と青色のライトを点灯させて停車している緊急車両、あるいは琥珀色または琥珀色と白色のライトを点灯させている車両に接近する運転者に適用されます。
- id: 372
  category: defensive_driving
  question: マニュアルによると、警察官が車両にはねられて死亡した事故には、どのような2つの要因が関わっていましたか？
  choices:
    A: スピード違反と無謀な運転
    B: 障害運転（飲酒・薬物など）または不注意
    C: 車両の故障と悪天候
    D: 夜間運転と視界不良
  answer: B
  explanation: マニュアルには、8人の警察官が、障害運転（Impaired driving）または不注意な運転をしていたドライバーの車両にはねられて死亡したと記載されています。
- id: 373
  category: sharing_the_road
  question: 接近する緊急車両に道を譲る必要がある場合、車両をどこに配置すべきですか？
  choices:
    A: 道路の走行車線部分の右側にできるだけ寄り、かつ平行に停車する
    B: 高速道路の中央分離帯の中
    C: できるだけ左側に寄せる
    D: 最寄りの交差点の中
  answer: A
  explanation: 法律により、運転者は直ちに道路の走行車線部分の右側にできるだけ寄り、かつ平行な位置まで運転して停車することが義務付けられています。
- id: 374
  category: sharing_the_road
  question: 停車中の緊急車両から離れるために車線変更が義務付けられるには、その道路に同一方向に進む車線が少なくとも何車線ある必要がありますか？
  choices:
    A: 1車線
    B: 2車線
    C: 3車線
    D: 4車線
  answer: B
  explanation: 車線変更の義務は、少なくとも4車線あり、そのうち接近する車両と同じ方向に進む車線が2車線以上ある道路に適用されます。
- id: 375
  category: safe_driving_rules
  question: 道路脇に琥珀色（アンバー）または琥珀色と白のライトを点灯させて停車している車両に近づく場合、どうしなければなりませんか？
  choices:
    A: 通常の車両として扱い、速度を維持する
    B: 注意して進み、可能であれば車線変更をして優先権を譲る
    C: 停車して援助を申し出る
    D: 接近を知らせるためにクラクションを鳴らす
  answer: B
  explanation: 法律により、琥珀色または琥珀色と白色のライトを点灯させている車両に接近する運転者は、注意して進行し、可能であれば車線変更を行って優先権を譲ることが義務付けられています。
- id: 376
  category: defensive_driving
  question: 停車中の緊急車両に関する「Safety is on Your Shoulders（安全はあなたの肩にかかっている）」セクションの主なメッセージは何ですか？
  choices:
    A: 停車している車両を見かけたら常に停車して助けること
    B: 緊急装備を作動させて道路脇に停車している車両からは、減速して離れるように移動すること
    C: そのエリアを素早く通過するために加速すること
    D: 報告のために緊急現場の写真を撮ること
  answer: B
  explanation: マニュアルには明示的に次のように記載されています。「緊急装備を作動させて道路脇に停車している車両からは、減速して離れるように移動してください。これは法律です。」
- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 減速して注意深く進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤色の八角形の「STOP（一時停止）」標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進行する前に、交通状況と歩行者を確認してください。
  id: 377
- image: yield.png
  category: signs_and_signals
  question: この標識は何をすることを求めていますか？
  choices:
    A: 完全に停止する
    B: 加速して交通の流れに合流する
    C: 減速し、他の車両や歩行者に優先権を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（譲れ）」標識は、減速して他の車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 378
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路に進入してはならない
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「DO NOT ENTER（進入禁止）」標識は、この標識が掲示されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや、進入すると対向車の進路に入ってしまう一方通行の道路で見られます。
  id: 379
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけた場合、どうすべきですか？
  choices:
    A: Uターンする
    B: 注意深く運転を続ける
    C: 停止してバックするか向きを変える。あなたは逆走している
    D: そのエリアを素早く抜けるために加速する
  answer: C
  explanation: 赤と白の「WRONG WAY（進入禁止/逆走）」標識は、一方通行の道路や高速道路のランプを逆走していることを意味します。直ちに停止し、安全に向きを変えるかバックしてください。
  id: 380
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 一方通行（左方向）
    C: 中央分離帯の左側を通行すること
    D: 左側に高速道路の出口あり
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」標識は、その道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 381
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、その場所での転回（Uターン）が禁止されていることを意味します。
  id: 382
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が許可されていないことを意味します。
  id: 383
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 転回（Uターン）禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、その場所での右折が禁止されていることを意味します。
  id: 384
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道幅が狭くなる
    B: この区間内での追い越し禁止
    C: この先、対面通行
    D: 右側通行
  answer: B
  explanation: 「NO PASSING ZONE（追い越し禁止区間）」と書かれた白黒のペナント型（三角形）の標識は、その区域で他の車両を追い越すことが禁止されていることを意味します。これは追い越し禁止区間の始まりを示します。
  id: 385
- image: keep_right.png
  category: signs_and_signals
  question: この標識はドライバーに何を指示していますか？
  choices:
    A: 右側に合流すること
    B: 右折専用
    C: 分離帯や障害物の右側を通行すること
    D: この先、右車線終点
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 386
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 白い長方形に黒い文字の標識は規制標識です。速度制限標識は、理想的な条件下においてその区域で許容される法定最高速度を示します。
  id: 387
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色のひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園またはサファリパークあり
    B: この付近はシカが頻繁に道路を横断する
    C: この先、狩猟区域
    D: 近くに野生動物保護区あり
  answer: B
  explanation: シカのシルエットが描かれた黄色のひし形の標識は、この付近でシカが頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 388
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、スクールゾーン
    B: この先、歩行者横断あり
    C: 近くにハイキングコースあり
    D: この先、バス停あり
  answer: B
  explanation: 歩行者の姿が描かれた黄色のひし形の標識は、この先に歩行者横断歩道があることを警告しています。道路を横断する歩行者のために停止できるよう準備してください。
  id: 389
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区域
    C: スクールゾーンまたは通学路の横断
    D: 病院周辺
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路の横断を示しています。速度を落とし、子供に注意してください。
  id: 390
- image: railroad_crossing.png
  category: signs_and_signals
  question: この黄色い円形の標識は何を警告していますか？
  choices:
    A: この先に環状交差点（ラウンドアバウト）がある
    B: 病院地帯である
    C: この先に踏切がある
    D: 追い越し禁止区間である
  answer: C
  explanation: 黒いXと2つのRが描かれた黄色い円形の標識は、この先に踏切があることを知らせる事前警告標識です。速度を落とし、列車の音や姿を確認してください。
  id: 391
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX型のクロスカット（踏切道標識）は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  id: 392
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: この先で行き止まり
    B: 右折必須
    C: この先に右カーブがある
    D: この先に回り道（迂回路）がある
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、この先に道路のカーブがあることを警告しています。カーブに入る前に速度を落としてください。
  id: 393
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角であることを示している
    B: 大幅な減速が必要な急カーブであることを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 394
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道
    B: この先に単一のカーブがある
    C: 反対方向への2つの連続するカーブがある
    D: この先に環状交差点（ラウンドアバウト）がある
  answer: C
  explanation: 背向（はいこう）カーブの標識は、この先に反対方向への2つのカーブがあることを警告しています。速度を落とし、道路がまず一方向に曲がり、次に反対方向に曲がることに備えてください。
  id: 395
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 1つの急カーブ
    B: 滑りやすい路面
    C: この先に一連のカーブや曲がり角がある
    D: この先に坂道がある
  answer: C
  explanation: 「屈曲あり（ワインディング・ロード）」の標識は、この先に一連のカーブや曲がり角があることを警告しています。速度を落とし、変化する道路状況に注意してください。
  id: 396
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の終了
    B: 別の道路からの交通の合流
    C: 中央分離帯のある道路の開始
    D: 道幅が1車線に減少すること
  answer: B
  explanation: 黄色いひし形の合流標識は、別の道路からの交通が自分の車線に合流してくることを警告しています。速度や位置を調整する準備をしてください。
  id: 397
- image: road_narrows.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に橋がある
    B: この先で道幅が狭くなる
    C: 車線の終了
    D: 中央分離帯の終了
  answer: B
  explanation: この警告標識は、この先の道幅が狭くなることを示しています。道幅が減少することに備え、車線内の位置を調整してください。
  id: 398
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 中央分離帯のある道路の開始
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって反対車線と仕切られた「中央分離帯のある道路（ディバイデッド・ハイウェイ）」になることを警告しています。右側を通行してください。
  id: 399
- image: divided_highway_ends.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある道路の開始
    B: 中央分離帯が終了し、対面通行に戻る
    C: この先に合流地点がある
    D: この先に道路工事がある
  answer: B
  explanation: この標識は、中央分離帯のある道路が終了することを警告しています。反対車線の交通が中央分離帯で仕切られなくなります。対面通行に備えてください。
  id: 400
- image: two_way_traffic.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 分離ハイウェイの始まり
    B: この先に追い越し区間あり
    C: この先対面通行 — 車両が両方向に通行します
    D: この先に車線移動あり
  answer: C
  explanation: この標識はこの先が対面通行であることを警告しています。一方通行の道路や分離ハイウェイが終わり、反対方向から来る車両と遭遇する可能性があります。
  id: 401
- image: slippery_when_wet.png
  category: signs_and_signals
  question: この標識はどのような路面状態を警告していますか？
  choices:
    A: 路面の凍結
    B: 濡れている時に滑りやすい
    C: この先に曲がりくねった道あり
    D: 路面の凹凸
  answer: B
  explanation: 「スリップ注意」の標識は、雨や濡れた状態で路面が非常に滑りやすくなる可能性があることを警告しています。速度を落とし、急ブレーキや急ハンドルを避けてください。
  id: 402
- image: hill.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 路面の隆起
    B: 路面の凹凸
    C: この先に急な下り坂または勾配あり
    D: 道路工事
  answer: C
  explanation: この標識はこの先に急な坂道や勾配があることを警告しています。特にトラックや牽引中の場合は、速度を調整し、低いギアにシフトダウンする必要があるかもしれません。
  id: 403
- image: signal_ahead.png
  category: signs_and_signals
  question: この標識は何に備えるよう警告していますか？
  choices:
    A: この先に一時停止標識あり
    B: この先に信号機あり
    C: 通学路の横断歩道
    D: 検問所
  answer: B
  explanation: この標識はこの先に信号機があることを警告しています。赤信号や黄信号の場合に停止できるよう準備してください。この標識は、遠くから信号機が見えにくい場所に設置されることが多いです。
  id: 404
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 譲れ（前方優先）の標識
    B: 信号機
    C: 一時停止が必要な一時停止標識
    D: スピードバンプ（減速帯）
  answer: C
  explanation: この標識はこの先に一時停止標識があることを警告しています。速度を落とし始め、一時停止標識の場所で完全に停止できるよう準備してください。
  id: 405
- image: cross_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に踏切あり
    B: この先に十字路または交差点あり
    C: この先に病院あり
    D: 歩行者横断歩道
  answer: B
  explanation: この標識はこの先に十字路または四差路の交差点があることを警告しています。脇道から進入してくる車両に注意してください。
  id: 406
- image: side_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に丁字路（T字路）あり
    B: 右側から合流する脇道あり
    C: 道路のカーブ
    D: 行き止まり
  answer: B
  explanation: この標識は右側から脇道が合流していることを警告しています。脇道からハイウェイに進入してくる車両に注意してください。
  id: 407
- image: added_lane.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 車線が合流しています
    B: 車線が減少します
    C: 新しい車線が追加されます — 合流の必要はありません
    D: 右折必須
  answer: C
  explanation: 「付加車線」の標識は、合流を必要とせずに新しい車線がハイウェイに加わることを意味します。ランプ（接続路）から進入する車両には、専用の新しい車線が用意されています。
  id: 408
- image: no_parking.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: いかなる時の停車も禁止
    B: この区域での駐車
    C: 停車またはアイドリング
    D: 荷物の積み下ろし
  answer: B
  explanation: 赤と白の「駐車禁止」標識は、この区域に車両を駐車できないことを意味します。乗客の乗り降りのために短時間停車することは許可される場合があります。
  id: 409
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転者
  answer: C
  explanation: 車椅子のシンボルが描かれた青い標識は、障害者のために予約された駐車スペースを示しています。有効な障害者用駐車許可証またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反には高額の罰金が科せられます。
  id: 410
