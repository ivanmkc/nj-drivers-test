    B: $1
    C: $5
    D: $10
  answer: B
  explanation: 運転免許証または非運転者用IDカードにボート安全運転者の表示を最初に追加する場合、通常の事務手数料に加えて1ドルの追加費用がかかります。
- id: 53
  category: license_system
