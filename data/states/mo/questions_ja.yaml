- id: 334
  category: defensive_driving
  question: 商用車の頭上スペースを確認する際、どのようにすべきですか？
  choices:
    A: 橋に掲示されている高さは常に正しいと信頼する。
    B: 未舗装の道路を走行する場合のみ、クリアランスを確認する。
    C: 橋や地下道の掲示されている高さが正しいと決めつけない。
    D: クリアランスが低い場合は、後続車が警告してくれることを期待する。
  answer: C
  explanation: 常に車両の頭上に十分なスペースがあることを確認してください。橋や地下道に掲示されている高さが正しいとは限りません。
- id: 335
  category: vehicle_information
  question: 12,000ポンドを超える認可を受け、州内通商に使用される商用車は、少なくともどの定格の消火器を携帯しなければなりませんか？
  choices:
    A: 2 A:B
    B: 5 B:C
    C: 10 B:C
    D: 15 A:C
  answer: B
  explanation: 12,000ポンドを超える認可を受け、州内または州間通商に使用されるその他の商用車は、消火器を1本携帯しなければなりません。消火器の定格は5
    B:C以上である必要があります。
- id: 336
  category: defensive_driving
  question: 車両の重量と長さは、交通の横断や進入にどのように影響しますか？
  choices:
    A: 重い車両ほど加速が速いため、必要な車間距離（ギャップ）は小さくなる。
    B: 車両の長さは、道路を横断するのにかかる時間に影響しない。
    C: 長い車両や重量のある車両は、乗用車よりも道路を横断するために大きな車間距離（ギャップ）を必要とする。
    D: 重い車両には優先権があるため、車間距離の大きさは関係ない。
  answer: C
  explanation: 加速率は車両の重量によって異なります。また、道路を横断する時間は車両の長さによっても影響を受けます。長い車両や重量のある車両では、乗用車の場合よりも道路を横断するために大きな車間距離（ギャップ）が必要になります。
