- id: 328
  category: vehicle_information
  question: 大型車両で右折する際の内輪差（オフトラッキング）を補正するために、どのようにすべきですか？
  choices:
    A: できるだけ右側に寄って右折を開始する。
    B: できるだけ左側に寄って右折を開始する。
    C: 右折中に素早く加速する。
    D: 前進する前にハンドルを急に切る。
