  explanation: 運転中は、ペットをペットキャリア、携帯用ケージ、または特別に設計されたペット用ハーネスで適切に固定してください。運転中にペットを膝の上に座らせてはいけません。
- id: 333
  category: vehicle_information
  question: 定期的に商業目的で使用され、36,000ポンドを超える認可を受けている商用車において、明確に表示されていなければならない情報は何ですか？
  choices:
