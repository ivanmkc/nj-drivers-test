  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: C
  explanation: バスまたはトラックを運転している場合、別のバスまたはトラックとの車間距離を300フィート未満にしてはなりません。ただし、商業地区や住宅地区内、または追い越しをする場合は、これより近づくことができます。
- id: 326
  category: defensive_driving
