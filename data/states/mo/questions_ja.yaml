- id: 67
  category: license_system
  question: 免許証または許可証の申請時に、選抜徴兵対象者登録制度（Selective Service）への登録が可能な男性申請者の年齢層はどれですか？
  choices:
    A: 16歳から18歳
    B: 18歳から21歳
    C: 18歳から26歳
    D: 21歳から30歳
  answer: C
  explanation: 18歳から26歳の男性申請者は、免許証または許可証の申請時に選抜徴兵対象者登録制度（Selective Service）への登録を行うことができます。
- id: 68
  category: license_system
  question: 21歳になった際、運転免許証に関してどのような選択肢がありますか？
  choices:
    A: 直ちに免許証を州に返納しなければならない。
    B: 未成年表示を消すために、筆記試験と実技試験を再受験しなければならない。
    C: 未成年表示のない免許証を申請するか、現在の免許証の有効期限が切れるまで待つことができる。
    D: 未成年表示を消すために罰金を支払う必要がある。
  answer: C
  explanation: マニュアルによると、21歳になったときは、未成年表示のない別の運転免許証を申請して費用を支払うか、21歳未満用の運転免許証の有効期限が切れるまで待つことができます。
- id: 69
  category: license_system
  question: ミズーリ州の新しい居住者が他州の運転免許証を切り替える場合、その免許証は有効であるか、または失効後何日以内でなければなりませんか？
  choices:
    A: 30日
    B: 90日
    C: 184日
    D: 365日
  answer: C
  explanation: 他州の運転免許証を切り替えるミズーリ州の新規居住者は、有効な免許証、または失効後184日以内の免許証を提示する必要があります。
- id: 70
  category: driver_testing
  question: ミズーリ州ドライバーガイドによると、全受験者の約何パーセントが最初の筆記試験で不合格になりますか？
  choices:
    A: 25パーセント
    B: 30パーセント
    C: 50パーセント
    D: 75パーセント
  answer: C
  explanation: 全受験者のほぼ50パーセントが初回で不合格になるため、マニュアルではガイドをよく学習することを推奨しています。
- id: 71
  category: license_system
  question: 21歳未満の正式な運転免許証（Full Under-21 Driver License）に移行するには、過去何ヶ月以内にアルコール関連の違反や交通違反の有罪判決がないことが条件ですか？
  choices:
    A: 6ヶ月
    B: 12ヶ月
    C: 18ヶ月
    D: 24ヶ月
  answer: B
  explanation: 21歳未満の正式な運転免許証（Full Under-21 Driver License）に移行するには、過去12ヶ月以内にアルコール関連の違反や交通違反の有罪判決がないことが条件となります。
- id: 72
  category: driver_testing
  question: ミズーリ州の運転免許試験を構成する4つのパートはどれですか？
  choices:
    A: 筆記試験、視力検査、道路標識テスト、実技試験
    B: 筆記試験、聴力検査、道路標識テスト、実技試験
    C: 視力検査、身体検査、筆記試験、実技試験
    D: 筆記試験、視力検査、反射神経テスト、実技試験
  answer: A
  explanation: 運転免許試験は、筆記試験、視力検査、道路標識テスト、実技試験（スキルテスト）の4つのパートで構成されています。
- id: 73
  category: driver_testing
  question: 他州の有効な運転免許証を所持しており、ミズーリ州で同じ種類の免許を申請する場合、どの試験を受ける必要がありますか？
  choices:
    A: 筆記試験のみ
    B: 実技試験のみ
    C: 視力検査と道路標識テスト
    D: 運転免許試験の全4パート
  answer: C
  explanation: 他州の運転免許証が有効であるか、失効後184日未満であり、ミズーリ州で同じ種類の免許を申請する場合は、視力検査と道路標識テストのみを受ける必要があります。
- id: 74
  category: driver_testing
  question: クラスF（一般運転者）免許の多肢選択式筆記試験は何問ありますか？
  choices:
    A: 20問
    B: 25問
    C: 30問
    D: 40問
  answer: B
  explanation: クラスF（一般運転者）免許を申請する場合、25問の多肢選択式筆記試験を受ける必要があります。
- id: 75
  category: driver_testing
  question: クラスE（営業用/for-hire）免許の筆記試験には、クラスFの試験には含まれないどのような追加情報が含まれていますか？
  choices:
    A: モーターサイクルの安全法規
    B: 商用車に関する情報
    C: 高度な縦列駐車のテクニック
    D: 州間高速道路のナビゲーション
  answer: B
  explanation: クラスE（営業用）免許の筆記試験には、ガイドに記載されている運転に関する法律や方法に加え、第15章にある商用車に関する情報も含まれます。
- id: 76
  category: driver_testing
  question: ミズーリ州の運転免許証の視力検査に合格するために必要な、標準的な最小視力はどれくらいですか？
  choices:
    A: 片眼または両眼で 20/20
    B: 片眼または両眼で 20/30
    C: 片眼または両眼で 20/40
    D: 片眼または両眼で 20/50
  answer: C
  explanation: 標準的な最小視力は、片眼または両眼で少なくとも 20/40 以上である必要があります。
- id: 77
  category: driver_testing
  question: 裸眼および矯正視力の両方が以下の数値より悪い場合、実技試験を受けることも運転免許証を所持することもできません。
  choices:
    A: 20/40
    B: 20/80
    C: 20/100
    D: 20/160
  answer: D
  explanation: 裸眼および矯正視力の両方が 20/160 より悪い場合、または両眼の周辺視野が 70 度未満の場合は、実技試験を受けることができず、運転免許証を取得することもできません。
- id: 78
  category: vehicle_information
  question: 実技試験に使用する車両の要件として、正しいものはどれですか？
  choices:
    A: バックカメラが装備されていること。
    B: 正常に機能する2系統のブレーキ（パーキングブレーキとフットブレーキ）を備えていること。
    C: 製造から10年未満の車両であること。
    D: オートマチックトランスミッション車であること。
  answer: B
  explanation: 実技試験に使用する車両は、他の安全要件に加え、正常に機能する2系統のブレーキ（パーキングブレーキとフットブレーキ）を備えている必要があります。
- id: 79
  category: driver_testing
  question: 実技試験中、車両に同乗することが許可されているのは誰ですか？
  choices:
    A: 運転免許試験官のみ
    B: 試験官と親または保護者1名
    C: 試験官と教習所の指導員
    D: 後部座席に座る限り、誰でも可
  answer: A
  explanation: あなたが運転し、試験官が隣に座ります。試験中、他の誰かが車両に同乗することはできません。
- id: 80
  category: driver_testing
  question: 実技試験では、以下のどのサイズのスペースに縦列駐車（parallel park）するよう求められますか？
  choices:
    A: 長さ20フィート、幅6フィート
    B: 長さ25フィート、幅7フィート
    C: 長さ30フィート、幅8フィート
    D: 長さ35フィート、幅9フィート
  answer: B
  explanation: 縁石と平行に、長さ25フィート、幅7フィートのスペースに駐車するよう求められます。
- id: 81
  category: driver_testing
  question: 運転免許試験の縦列駐車の際、縁石から最大何インチ以内に駐車しなければなりませんか？
  choices:
    A: 6インチ
    B: 12インチ
    C: 18インチ
    D: 24インチ
  answer: C
  explanation: 運転免許試験の縦列駐車の項目では、縁石から18インチ以内に駐車できるかどうかがテストされます。
- id: 82
  category: driver_testing
  question: 車を後退（バック）させる試験の際、試験官は受験者が以下のどの動作を行うかを確認しますか？
  choices:
    A: バックミラーのみを頼りにしているか。
    B: 右肩越しに後部窓（リアガラス）から後方を確認しているか。
    C: バックカメラを効果的に使用しているか。
    D: リバースにギアを入れる前にクラクションを鳴らしているか。
  answer: B
  explanation: 後退の試験では、試験官は受験者が右肩越しに後部窓から後方を目視確認しているかをチェックします。
- id: 83
  category: driver_testing
  question: 運転技能試験において、縁石から離れて駐車できる最大距離はどれくらいですか？
  choices:
    A: 12インチ
    B: 18インチ
    C: 24インチ
    D: 36インチ
  answer: B
  explanation: 運転免許試験では、縁石から18インチ以内に駐車することが求められます。
- id: 84
  category: driver_testing
  question: 運転技能試験において、即不合格となる行為は次のうちどれですか？
  choices:
    A: 試験で15点減点される
    B: 駐車に1分以上かかる
    C: 試験官の指示に従った運転を拒否する
    D: 縁石から16インチ離して駐車する
  answer: C
  explanation: 試験官の指示に従った運転を拒否した場合、歩行者に接触した場合、交通法規に違反した場合、または30点を超えて減点された場合は不合格となります。
- id: 85
  category: driver_testing
  question: 運転免許試験に3回不合格となった場合、何が必要ですか？
  choices:
    A: 再試験まで6ヶ月待たなければならない。
    B: 追加の実技教習を受けた証明書を財務省（Department of Revenue）に送付しなければならない。
    C: 運転免許の取得が永久に禁止される。
    D: 再試験のために250ドルの罰金を支払わなければならない。
  answer: B
  explanation: 運転免許試験に3回不合格になった場合は、追加の実技教習を受けた証明書を送付し、財務省から再試験の承認を得る必要があります。
- id: 86
  category: penalties_and_points
  question: 試験中にカンニングや録音機器の使用などの不正行為を行った場合、どのような結果を招く可能性がありますか？
  choices:
    A: 警告を受け、直ちに試験をやり直す
    B: 最大1年間の運転資格の喪失
    C: 5年間の強制的な禁錮刑
    D: 最低500ドルの罰金
  answer: B
  explanation: 不正行為は「クラスA」の軽罪とみなされ、最大1年間の運転資格停止処分を受ける可能性があります。
- id: 87
  category: safe_driving_rules
  question: 優先権（Right-of-way）に関する法律について、正しい記述はどれですか？
  choices:
    A: 法律は、交差点に最初に進入したドライバーに優先権を与える。
    B: 法律は、いかなる時も歩行者に優先権を与える。
    C: 法律は、誰が優先権を「譲らなければならないか」を定めているが、誰かに優先権を「与える」ものではない。
    D: 法律は、複数車線のハイウェイを走行する車両に優先権を与える。
  answer: C
  explanation: 法律は、誰が優先権を譲るべきかを規定していますが、どのドライバーにも優先権を「与える」わけではありません。歩行者や他の車両との衝突を避けるために、あらゆる手段を講じる必要があります。
- id: 88
  category: penalties_and_points
  question: ミズーリ州の道路の工事区間または作業区域において、スピード違反や追い越しを初めて行った場合の最低罰金額はいくらですか？
  choices:
    A: $100
    B: $150
    C: $250
    D: $300
  answer: C
  explanation: 工事区間または作業区域でのスピード違反や追い越しで摘発された場合、初犯で最低250ドルの罰金が科せられる可能性があります。
- id: 89
  category: safe_driving_rules
  question: 右側からの追い越しが法的に認められるのは、どのような条件下ですか？
  choices:
    A: 追い越そうとする車両が左折している、または左折しようとしているとき。
    B: 道路の舗装部分から外れて路肩を走行するとき。
    C: 丘の頂上に近づいているとき。
    D: 道路の自分の側に黄色の実線があるとき。
  answer: A
  explanation: 追い越される車両が左折中、または左折しようとしている場合、舗装された主要走行部分からはみ出さない限り、右側から追い越すことができます。
- id: 90
  category: safe_driving_rules
  question: 橋、高架橋、またはトンネルから何フィート以内で視界が遮られている場合、他の車両を追い越すために道路の左側を走行することが禁止されていますか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: B
  explanation: 橋、高架橋、またはトンネルに100フィート以内に接近し、視界が遮られている場合は、道路の左側を走行（追い越し）してはいけません。
- id: 91
  category: safe_driving_rules
  question: 交差点で左折する場合、どうしなければなりませんか？
  choices:
    A: 直進してくる対向車に道を譲る。
    B: 他のすべての車両に対して優先権を持つ。
    C: 右折する車両にのみ道を譲る。
    D: 進行する前に信号が黄色に変わるのを待つ。
  answer: A
  explanation: 交差点では、左折するドライバーは直進してくる対向車に道を譲らなければなりません。
- id: 92
  category: safe_driving_rules
  question: 一時停止標識や交通信号のない交差点では、誰に道を譲らなければなりませんか？
  choices:
    A: 左側から来る車両
    B: 右側から来る車両
    C: 左折する車両
    D: ドライブウェイ（私道）から進入する車両
  answer: B
  explanation: 一時停止標識や交通信号のない交差点（ラウンドアバウトを除く）では、ドライバーは右側から来る車両に道を譲らなければなりません。
- id: 93
  category: sharing_the_road
  question: 交差点内にいるときに、サイレンを鳴らし赤色灯を点滅させた緊急車両が近づいてくるのを見たり聞いたりした場合、どうすべきですか？
  choices:
    A: 交差点の真ん中ですぐに停止する。
    B: 交差点の左端に寄せて停止する。
    C: 交差点を通り抜けてから、道路の右端に寄せて停止する。
    D: 交差点を抜けるために加速し、緊急車両の前を走り続ける。
  answer: C
  explanation: 交差点内にいる場合は、交差点を通り抜けてから道路の右端に寄せてください。緊急車両が通過するまで停止したままでいてください。
- id: 94
  category: sharing_the_road
  question: 複数車線の道路で、赤色または赤色と青色のライトを点灯させて停車している緊急車両に近づく際、安全であれば何をしなければなりませんか？
  choices:
    A: すぐに停止し、その車両が移動するのを待つ。
    B: 停車している車両に隣接しない車線へ車線変更を行う。
    C: クラクションを鳴らして緊急作業員に注意を促す。
    D: 速度を維持し、隣接する車線を走行し続ける。
  answer: B
  explanation: 注意して進行し、安全であれば、停車している車両に隣接しない車線へ車線変更を行わなければなりません。
- id: 95
  category: sharing_the_road
  question: スクールバスが指定の停留所に停車する際、どのくらい手前から琥珀色（アンバー）の警告灯を点滅させますか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: スクールバスが学童の乗降のために指定の停留所に停車する500フィート手前から、琥珀色の警告灯が点滅します。
- id: 96
  category: driver_testing
  question: 運転技能試験の後退（バック）の項目において、試験官はあなたが以下のことを行っているかを確認します：
  choices:
    A: バックミラー（ルームミラー）のみに頼っている。
    B: 右肩越しに後ろを向き、リアガラス越しに確認している。
    C: 少なくとも時速15マイルで後退している。
    D: 後退する前にハザードランプを点灯させている。
  answer: B
  explanation: 後退の試験では、試験官はあなたが右肩越しに後ろを向き、リアガラス越しに確認しているかどうかをチェックします。
- id: 97
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）に近づく際、どうしなければなりませんか？
  choices:
    A: すでに環状交差点内にいる車両と、横断歩道にいる歩行者に道を譲る。
    B: 自分に優先権があるため、停止せずに進入する。
    C: 右側から進入してくる車両にのみ道を譲る。
    D: 他の車両を進入させるために、ラウンドアバウトの真ん中で停止する。
  answer: A
  explanation: ラウンドアバウトに近づく際は、常に環状交差点内の交通と横断歩道の歩行者に道を譲ってください。交通が途切れるのを待ってから進入します。
- id: 98
  category: sharing_the_road
  question: 赤色灯を点滅させているスクールバスに対して、停止する必要が「ない」のは次のうちどの状況ですか？
  choices:
    A: 2車線道路で同じ方向に進んでいるとき
    B: 4車線以上あるハイウェイで、反対方向に進んでいるとき
    C: 2車線道路で反対方向に進んでいるとき
    D: 2車線の片側通行の道路で、バスの後ろを走っているとき
  answer: B
  explanation: 4車線以上の車線があるハイウェイで、スクールバスと反対方向に進んでいる場合は、停止する必要はありません。
- id: 99
  category: safe_driving_rules
  question: 曲がる際、少なくともどのくらい手前から合図（ウィンカー）を出すべきですか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: B
  explanation: マニュアルには、他のドライバーが準備できるように、曲がる少なくとも100フィート手前で合図を出すべきであると記載されています。
- id: 100
  category: safe_driving_rules
  question: Uターン（転回）が明確に禁止されている場所はどこですか？
  choices:
    A: まっすぐで平坦な2車線のハイウェイ
    B: 交通信号機または警察官によって制御されている交差点
    C: 交通量のない住宅街の通り
    D: 指定された双方向左折車線内
  answer: B
  explanation: 「Uターン禁止」の標識がある場所や、交通信号機または警察官によって制御されている交差点では、絶対にUターンをしないでください。
- id: 101
  category: defensive_driving
  question: 右折する前に、左側に大きく膨らんでハンドルを切るのを避けるべきなのはなぜですか？
  choices:
    A: タイヤの牽引力（トラクション）を失う原因になるため
    B: 後続車のドライバーが、あなたが左折しようとしていると勘違いし、右側から追い越そうとする可能性があるため
    C: いかなる状況でもセンターラインを越えることは違法であるため
    D: 信号機のセンサーが誤作動するため
  answer: B
  explanation: 右折前に左側に大きく膨らむと、後続車のドライバーが、あなたが車線変更をするか左折しようとしていると思い込み、右側から追い越そうとする可能性があります。
- id: 102
  category: safe_driving_rules
  question: 中央二方向左折車線（center two-way left-turn lane）を走行できる最大距離はどれくらいですか？
  choices:
    A: 100フィート
    B: 250フィート
    C: 500フィート
    D: 1,000フィート
  answer: C
  explanation: マニュアルでは、二方向左折車線を走行車線として使用してはならず、この車線を500フィート以上走行することはできないと規定されています。
- id: 103
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）に入る際、厳格に禁止されている操作はどれですか？
  choices:
    A: 歩行者に道を譲る
    B: 左折して進入する
    C: 進入前に減速する
    D: わずかに右にハンドルを切る
  answer: B
  explanation: ラウンドアバウトに接近する際、マニュアルには「ラウンドアバウトに入るために決して左折してはならない」と明記されています。
- id: 104
  category: safe_driving_rules
  question: ラウンドアバウトにおいて、どちらに優先権がありますか？
  choices:
    A: ラウンドアバウトに進入しようとしている車両
    B: すでにラウンドアバウト内を走行している車両
    C: ラウンドアバウトに接近している大型トラック
    D: ラウンドアバウトから出ようとしている車両
  answer: B
  explanation: ラウンドアバウトを走行する場合、ラウンドアバウト内にいる車両が優先権を持ちます。
- id: 105
  category: defensive_driving
  question: ラウンドアバウトを走行中、目的の出口を通り過ぎてしまった場合はどうすべきですか？
  choices:
    A: 停車し、交通が途切れるのを待ってからバックする
    B: ラウンドアバウト内でUターンする
    C: 適切な出口に到達するまで、そのままラウンドアバウトを回り続ける
    D: すぐに車線変更をして強引に出る
  answer: C
  explanation: 出口を通り過ぎてしまった場合は、適切な出口に到達するまでラウンドアバウト内をそのまま回り続けなければなりません。
- id: 106
  category: sharing_the_road
  question: ラウンドアバウト内を走行中に緊急車両が接近してきた場合、どのように対応すべきですか？
  choices:
    A: 通過させるため、ラウンドアバウト内ですぐに停車する
    B: 加速して、できるだけ早く出口から出る
    C: すぐに出口から出て、右側に寄せる
    D: 中央のアイランド（中央島）側に寄せる
  answer: C
  explanation: ラウンドアバウト内では決して停車してはいけません。ラウンドアバウト内にいるときに緊急車両が接近してきた場合は、すぐに出口から出て、右側に寄せてください。
- id: 107
  category: sharing_the_road
  question: ラウンドアバウトにおける「トラックエプロン（truck apron）」の目的は何ですか？
  choices:
    A: 故障車の指定駐車エリア
    B: 乗用車やSUVのための追い越し車線
    C: 大型トラックが回転する際、後輪のための余分なスペースを確保するため
    D: 歩行者が横断するための安全地帯
  answer: C
  explanation: トラックエプロンとは、大型トラックが回転する際に後輪が通るために設けられた、ラウンドアバウト内側の舗装されたエリアのことです。乗用車、SUV、ピックアップトラックが使用するためのものではありません。
- id: 108
  category: safe_driving_rules
  question: ドライバーはJターン交差点をどのように進みますか？
  choices:
    A: すべての車線を横切り、直接反対側へ向かう
    B: 右折して交通の流れに合流し、一番左の車線に移動してから左折する
    C: 円形のアイランドに入り、左側に道を譲る
    D: 中央二方向左折車線を使用して合流する
  answer: B
  explanation: Jターン交差点では、ドライバーは交通と同じ方向に右折し、一番左の車線に合流してから、目的の方向に左折します。
- id: 109
  category: driver_responsibility
  question: マニュアルによると、地方自治体は以下のうちどの権限を持つ交通条例を制定することができますか？
  choices:
    A: 運転免許証の発行
    B: 音響警告装置（クラクション等）の使用禁止
    C: 州の最低運転年齢の変更
    D: 車両登録の必要性の撤廃
  answer: B
  explanation: 市町村は、いくつかの事項について規制を設けることができ、その中には「音響警告装置の使用禁止」が含まれています。
- id: 110
  category: safe_driving_rules
  question: 標識や車線表示がない場所で右左折する場合、どの車線に入るべきですか？
  choices:
    A: 元いた車線から最も遠い車線
    B: 方向に関わらず中央の車線
    C: 元いた車線に最も近い車線
    D: 交通のない任意の車線
  answer: C
  explanation: 右左折を制御する標識や車線表示がない場合は、進みたい方向に最も近い車線から曲がり、元いた車線に最も近い車線に入る必要があります。
- id: 111
  category: safe_driving_rules
  question: 双方向左折車線（two-way left-turn lane）を使用する際の制限事項として、正しいものはどれですか？
  choices:
    A: 左折前に減速するために使用することはできない
    B: 脇道から車道に入る際に使用してはならない
    C: 商用車を運転している場合にのみ使用できる
    D: 曲がる前に少なくとも500フィートはその車線を走行しなければならない
  answer: B
  explanation: マニュアルには、双方向左折車線について「脇道から車道に入る際にこの車線を使用してはならない」と記載されています。
- id: 112
  category: sharing_the_road
  question: オートバイと同じ車線を走行する場合、どのようにすべきですか？
  choices:
    A: 交通の流れを良くするために、車線を共有する。
    B: オートバイの運転者は車線全体を必要とするため、車線を共有しない。
    C: 空気抵抗を減らすために、オートバイのすぐ後ろを走行する。
    D: 車線が十分に広い場合は、同じ車線内で追い越す。
  answer: B
  explanation: マニュアルによると、安全上の理由からオートバイの運転者は車線全体を必要とするため、オートバイと車線を共有してはいけません。
- id: 113
  category: license_system
  question: 公道で合法的にオートバイを運転するために必要なものは何ですか？
  choices:
    A: 標準的なクラスF運転免許証のみ。
    B: オートバイの裏書き（エンドースメント）がある有効な運転免許証、またはオートバイ専用免許証。
    C: 商用運転免許証（CDL）。
    D: ハイウェイパトロールからの特別許可証。
  answer: B
  explanation: 公道でオートバイを運転するには、オートバイの裏書き（エンドースメント）がある有効な運転免許証、またはオートバイ専用免許証が必要です。
- id: 114
  category: sharing_the_road
  question: 大型トラックやバスに関連する「ノー・ゾーン（No-Zone）」とは何ですか？
  choices:
    A: 商用車の指定駐車エリア。
    B: 車両の両側、後方、および前方にある、乗用車が隠れてしまう死角。
    C: 急勾配を走行するトラック用に制限された車線。
    D: 乗用車の立ち入りが禁止されている車両重量検問所付近のエリア。
  answer: B
  explanation: トラックやバスには、乗用車が視認できない死角が両側、後方、前方にあります。これらの死角は「ノー・ゾーン（No-Zone）」と呼ばれます。
- id: 115
  category: vehicle_information
  question: 時速55マイル（mph）で走行中の、荷物を満載したトラクター・トレーラーが完全に停止するまでに、およそどのくらいの距離が必要ですか？
  choices:
    A: 130〜140フィート。
    B: 200フィート。
    C: ほぼ400フィート。
    D: 600フィート以上。
  answer: C
  explanation: 時速55マイルで走行する一般的な乗用車は約130〜140フィートで停止できますが、荷物を満載したトラクター・トレーラーが完全に停止するには、ほぼ400フィートかかる場合があります。
- id: 116
  category: signs_and_signals
  question: 歩行者として道路を横断中に「歩行禁止（Don't Walk）」の合図が点滅し始めた場合、どうすべきですか？
  choices:
    A: 横断歩道の真ん中で止まって待つ。
    B: 引き返して、出発した側の歩道に戻る。
    C: できるだけ速く反対側まで走る。
    D: そのまま横断を完了する。
  answer: D
  explanation: マニュアルには、道路を横断中に「歩行禁止（Don't Walk）」の合図が点滅し始めた場合は、そのまま横断を完了してもよいと記載されています。
- id: 117
  category: safe_driving_rules
  question: 大型トラックを追い越す際、トラックの前の車線に戻っても安全なのはいつですか？
  choices:
    A: 自分の車のリアバンパーがトラックの前方を通過してすぐ。
    B: バックミラーにトラックのキャビン（運転席部分）が見えたとき。
    C: 右側の方向指示器を出した直後。
    D: トラックの運転手がヘッドライトを点滅させたとき。
  answer: B
  explanation: トラックを追い越した後は、車線に戻る前に、バックミラーでトラックのキャビンが見えることを確認してください。
- id: 118
  category: defensive_driving
  question: オートバイのライダーとして、停車中または走行中の車両の左側を通過する際、どのくらいの余裕（クリアランス）を空けるべきですか？
  choices:
    A: 1〜2フィート。
    B: 3〜4フィート。
    C: 5〜6フィート。
    D: 少なくとも車線1つ分の幅。
  answer: B
  explanation: オートバイのライダーは、車のドアが突然開いたり、車両が急ハンドルを切ったりするのを避けるため、停車中または走行中の車両の左側を通過する際に3〜4フィートの余裕を空ける必要があります。
- id: 119
  category: sharing_the_road
  question: 横断歩道のないブロックの途中で歩行者が道路を横断する場合、優先権はどちらにありますか？
  choices:
    A: 常に歩行者に優先権がある。
    B: 歩行者はすべての交通に対して優先権を譲らなければならない。
    C: 車両は停止して歩行者に道を譲らなければならない。
    D: より速く動いている方に優先権がある。
  answer: B
  explanation: 横断歩道のないブロックの途中で横断する場合、歩行者はすべての交通に対して優先権を譲らなければなりません。
- id: 120
  category: sharing_the_road
  question: 大型トラックが右折する前に左側に大きく膨らむ（スイングする）のはなぜですか？
  choices:
    A: 乗用車が右側を追い越せるようにするため。
    B: 車体が大きいため、右折の最初のステップとして行う。
    C: 左側の死角を確認するため。
    D: 交差点に入る前に速度を上げるため。
  answer: B
  explanation: 大型トラックはその大きさゆえに、右折の最初のステップとして左側に大きく膨らむことがあります。
- id: 121
  category: safe_driving_rules
  question: 前方の車両が歩行者のために停止または減速している場合、どうすべきですか？
  choices:
    A: 警音器（クラクション）を鳴らして歩行者に警告し、進む。
    B: 車線が空いている場合は、その車両を左側から追い越す。
    C: 路肩を利用して、その車両を右側から追い越す。
    D: その車両を追い越してはならない。
  answer: D
  explanation: ドライバーは、歩行者のために停止または減速した車両を追い越してはいけません。
- id: 122
  category: defensive_driving
  question: 近づいてくるトラクター・トレーラーの速度を過小評価するのが危険なのはなぜですか？
  choices:
    A: 実際よりも速く走っているように見えることが多いため。
    B: 車体が大きいため、実際の速度よりも遅く走っているように見えるため。
    C: 交差点に近づくと頻繁に加速するため。
    D: 乗用車よりもヘッドライトが暗いため。
  answer: B
  explanation: 近づいてくるトラクター・トレーラーの大きさと速度を過小評価してはいけません。その大きな車体のために、トラクター・トレーラーはしばしば実際の速度よりも遅く走っているように見えます。
- id: 123
  category: sharing_the_road
  question: オートバイの運転者が突然速度や車線内の位置を変えることがあるのはなぜですか？
  choices:
    A: 車に追い越されるのを防ぐため。
    B: マンホールの蓋や道路上の破片などの悪い路面状況に対応するため。
    C: 車体が軽く、滑らかな路面ではハンドル操作が難しいため。
    D: Uターンをしようとしている合図を送るため。
  answer: B
  explanation: オートバイの運転者は、マンホールの蓋、斜めに交差する線路、道路上の破片、または強風などの悪い路面状況に遭遇した際、速度や車線内の位置を変更します。
- id: 124
  category: driver_responsibility
  question: マニュアルによると、地方自治体、市、町にはどのような規制を制定する権限がありますか？
  choices:
    A: 商業運転免許（CDL）を発行する。
    B: 商業用車両が特定の通りを通行することを禁止する。
    C: 州間高速道路における州の法定速度を無効にする。
    D: オートバイのヘルメット着用義務を免除する。
  answer: B
  explanation: 市や町には、特定の通りでの商業用車両の通行禁止を含む、いくつかの規制を行う権限があります。
- id: 125
  category: defensive_driving
  question: 大型トラックやバスの後方を車間距離を詰めすぎて走行しているかどうかは、どうすれば分かりますか？
  choices:
    A: 相手の車両のバックミラー（サイドミラー）越しに、その運転者の姿が見えない。
    B: ナンバープレートがはっきりと読み取れる。
    C: トラックのブレーキランプが非常に明るく見える。
    D: 車両から100フィート（約30メートル）以内にいる。
  answer: A
  explanation: トラックやバスの後方を走行中、相手のミラー越しにその運転者の姿が見えない場合、相手の運転者からもあなたの姿は見えていません。
- id: 126
  category: safe_driving_rules
  question: 歩行者として歩いている際、歩道がない場合はどのように歩くべきですか？
  choices:
    A: 車の流れと同じ方向に歩く。
    B: 車の流れに向き合う（対面交通）形で歩く。
    C: 道路の中央を歩く。
    D: 車の流れに関係なく、道路の右側を歩く。
  answer: B
  explanation: マニュアルでは、歩道がない場合、歩行者は車の流れに向き合う形で歩くべきであると規定されています。
- id: 127
  category: sharing_the_road
  question: 盲導犬を連れた歩行者や白杖（白い杖）を持った歩行者が通りを横断しているとき、ドライバーはどうしなければなりませんか？
  choices:
    A: 警音器（クラクション）を鳴らして注意を促す。
    B: 減速して注意深く進む。
    C: 一時停止する。
    D: 歩行者を避けてハンドルを切る。
  answer: C
  explanation: 盲導犬を連れた歩行者、または白杖（あるいは先端が赤色の白杖）を持った歩行者が通りや幹線道路を横断しているとき、車両は一時停止しなければなりません。
- id: 128
  category: safe_driving_rules
  question: スクールゾーンで低速の制限速度に従わなければならないのはいつですか？
  choices:
    A: 午前中の時間帯のみ。
    B: ライトが点滅しているとき、または子供がいるとき。
    C: 横断監視員（クロッシングガード）がいるときのみ。
    D: 24時間、常に。
  answer: B
  explanation: スクールゾーンでは、ライトが点滅しているとき、または子供がいるとき、低速の制限速度に従わなければなりません。
- id: 129
  category: sharing_the_road
  question: 自転車やモペッド（原動機付自転車）を追い越すときは、どうすべきですか？
  choices:
    A: 車線が狭い場合は、無理に横を通り抜ける。
    B: 警音器（クラクション）を鳴らして脇に寄らせる。
    C: 1車線分の幅を十分に空ける。
    D: できるだけ近くを通り過ぎる。
  answer: C
  explanation: 追い越す際は、自転車やモペッドに対して1車線分の幅を十分に空けてください。これらの道路利用者の横を無理に通り抜けてはいけません。
- id: 130
  category: sharing_the_road
  question: 指定された自転車専用レーンを横切ることが許可されるのはどのようなときですか？
  choices:
    A: 他の自動車を追い越すとき。
    B: 右左折するとき、または道路に出入りするとき。
    C: 操縦のために余分なスペースが必要なときはいつでも。
    D: 自転車専用レーンを横切ることは決して許されない。
  answer: B
  explanation: 右左折するとき、または道路に出入りするときは、自転車専用レーンを横切ることができます。その際、自転車専用レーンにいる自転車に道を譲らなければなりません。
- id: 131
  category: sharing_the_road
  question: 公道で自転車やモペッド（原動機付自転車）に乗る際は、次のようにすべきです：
  choices:
    A: 常に交通の流れに逆らって走る
    B: 常に交通の流れに沿って走り、決して逆らわない
    C: 可能な限り歩道を走る
    D: 駐車車両の間を縫うように走る
  answer: B
  explanation: 公道や高速道路では、自動車の運転者と同じ権利と責任があります。常に交通の流れに沿って走り、決して逆らわないでください。
- id: 132
  category: safe_driving_rules
  question: モペッド（原動機付自転車）の走行が禁止されている場所はどこですか？
  choices:
    A: 住宅街の通り
    B: 公道および高速道路
    C: 連邦州間高速道路網（Interstate Highway System）のいかなる部分
    D: 制限速度が時速35マイル（35 mph）を超える道路
  answer: C
  explanation: 法律により、連邦州間高速道路網のいかなる部分においてもモペッドを走行させることは許可されていません。
- id: 133
  category: vehicle_information
  question: モペッドや自転車のブレーキは、どのくらいの距離で車両を停止できなければなりませんか？
  choices:
    A: 時速10マイル（10 mph）で走行中に15フィート以内
    B: 時速10マイル（10 mph）で走行中に25フィート以内
    C: 時速20マイル（20 mph）で走行中に50フィート以内
    D: 時速30マイル（30 mph）で走行中に100フィート以内
  answer: B
  explanation: ブレーキは、時速10マイル（10 mph）で走行中に25フィート以内で停止できる性能が必要です。
- id: 134
  category: vehicle_information
  question: 日没の30分後から日の出の30分前までの間に自転車に乗る場合、少なくともどのくらいの距離から見える白色のフロントライトを装備しなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 500フィート
    D: 600フィート
  answer: C
  explanation: 自転車の前面に、または自身で携帯する形で、他の運転者が500フィート先から確認できる白色のライトを装備しなければなりません。
- id: 135
  category: vehicle_information
  question: 夜間に自転車に乗る際、後部の赤色反射板または赤色灯は、ロービーム（下向きライト）に照らされたときにどのくらいの距離から見える必要がありますか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 500フィート
    D: 600フィート
  answer: D
  explanation: 少なくとも2平方インチ以上の後部赤色反射板、または他の車両のロービームに照らされた際に600フィート先から見える後部赤色灯を装備しなければなりません。
- id: 136
  category: license_system
  question: 電動自転車の運転には運転免許証が必要ですか？
  choices:
    A: はい、標準の運転免許証が必要です
    B: はい、自動二輪免許が必要です
    C: いいえ、運転免許証も自動二輪免許も必要ありません
    D: はい、商用運転免許証（CDL）が必要です
  answer: C
  explanation: ミズーリ州改訂法令（RSMo）301.010で定義されている電動自転車の運転には、運転免許証や自動二輪免許を保持している必要はありません。
- id: 137
  category: sharing_the_road
  question: 交通制御装置（信号や標識）に関わらず、すべての交差点で優先権を持つのは次のうちどれですか（緊急車両を除く）？
  choices:
    A: 自転車
    B: モペッド
    C: 組織された葬列
    D: 横断歩道外の歩行者
  answer: C
  explanation: 組織された葬列は、緊急車両や法執行官による指示がある場合を除き、交通制御装置に関わらずすべての交差点で優先権を持ちます。
- id: 138
  category: safe_driving_rules
  question: 葬列に加わって車両を運転している場合、何を使用しなければなりませんか？
  choices:
    A: ハイビーム（上向きライト）
    B: すべての交差点でのクラクション
    C: 点滅する非常点滅表示灯（ハザードランプ）
    D: 継続的な左折信号
  answer: C
  explanation: 葬列に加わっているすべての車両は、点滅する非常点滅表示灯（ハザードランプ）を使用しなければなりません。
- id: 139
  category: sharing_the_road
  question: 自転車の運転者が車道の中央または左側に移動できるのはどのような場合ですか？
  choices:
    A: 車線が狭すぎて他の車両と共有できない場合
    B: 友人と並んで走りたい場合
    C: 交通の流れよりも遅く走っている場合
    D: 坂道に近づいている場合
  answer: A
  explanation: 左折する場合、危険を回避する場合、車線が狭すぎて他の車両と共有できない場合、または右折専用車線があるが直進する場合など、状況に応じて車線や車道の中央または左側に移動することができます。
- id: 140
  category: sharing_the_road
  question: 組織された葬列が交差点で優先権を持つのはいつですか？
  choices:
    A: 信号が青のときのみ
    B: 緊急車両を除き、交通制御装置に関わらずすべての交差点で
    C: 4方向一時停止（4-way stop）の交差点のみ
    D: 通常の交通に対して優先権を持つことはない
  answer: B
  explanation: マニュアルによると、組織された葬列は、緊急車両や法執行官による指示がある場合を除き、交通制御装置に関わらずすべての交差点で優先権を持ちます。
- id: 141
  category: sharing_the_road
  question: 葬列（葬儀の車列）に参加していない場合、その車列を追い越す際のルールは何ですか？
  choices:
    A: クラクションを鳴らせば、いつでも追い越すことができる。
    B: 右側の路肩を使用する場合に限り、追い越すことができる。
    C: いかなる状況においても、葬列を追い越してはならない。
    D: 追い越し車線が特別に設けられている場所以外では、車列内のいかなる車両も追い越してはならない。
  answer: D
  explanation: マニュアルには、葬列に参加していない運転者は、追い越し車線が特別に設けられている場所以外では、車列内のいかなる車両も追い越そうとしてはならないと記載されています。
- id: 142
  category: defensive_driving
  question: 道路から安全に退避した後、あおり運転（ロード・レイジ）の事案を報告するために携帯電話でダイヤルすべき番号は何番ですか？
  choices:
    A: '*44'
    B: '*55（または都市部にいる場合は911）'
    C: '*HP'
    D: '411'
  answer: B
  explanation: あおり運転に遭遇した際、マニュアルでは道路から安全な場所へ退避し、*55（または都市部にいる場合は911）にダイヤルすることを推奨しています。
- id: 143
  category: penalties_and_points
  question: 裁判官によってポイ捨ての有罪判決が下された場合の最大罰則は何ですか？
  choices:
    A: 500ドルの罰金と30日間の禁錮。
    B: 1,000ドルの罰金および/または最大1年間の禁錮。
    C: 2,000ドルの罰金と免許停止。
    D: 100ドルの罰金と社会奉仕活動。
  answer: B
  explanation: ポイ捨ては法律違反です。裁判官によってポイ捨ての有罪判決が下された場合、最大1,000ドルの罰金の支払い、および/または最大1年間の禁錮刑に処される可能性があります。
- id: 144
  category: safe_driving_rules
  question: 一方通行の道路では、通常どこに駐車することが許可されていますか？
  choices:
    A: 右側のみ。
    B: 左側のみ。
    C: 右側または左側のどちらでも。
    D: 一方通行の道路では駐車は一切禁止されている。
  answer: C
  explanation: マニュアルには、一方通行の道路では、通常、通りの右側または左側のどちらにでも駐車できると記載されています。
- id: 145
  category: safe_driving_rules
  question: 路上に駐車した車両から降りる際、同乗者（特に子供）はどのように降りるべきですか？
  choices:
    A: 歩行者を避けるため、車道側から降りる。
    B: 歩道側（縁石側）から降りる。
    C: トランクから降りる。
    D: 自分の座席に最も近い側から降りる。
  answer: B
  explanation: マニュアルでは、交通を避けるため、同乗者（特に子供）は常に車両の歩道側（縁石側）から降ろすようにアドバイスしています。
- id: 146
  category: safe_driving_rules
  question: 坂道で駐車する際、車両が車道側に動き出すのを防ぐために、車輪はどちらの方向に向けるべきですか？
  choices:
    A: 道路の中央に向かって一杯に切る。
    B: まっすぐ前を向ける。
    C: 道路の端（路肩）に向かって一杯に切る。
    D: 左車線に向かってわずかに向ける。
  answer: C
  explanation: 坂道で駐車するときは、車両が下り坂を転がり始めた場合に車道から離れていくよう、車輪を道路の端（路肩）の方へ一杯に切っておく必要があります。
- id: 147
  category: safe_driving_rules
  question: 次のうち、駐車禁止区域に指定されているのはどれですか？
  choices:
    A: 黄色く塗られた縁石に沿った場所。
    B: 一方通行の道路の右側。
    C: 指定された駐車場内。
    D: 制限速度が時速35マイル（35 mph）を超える道路。
  answer: A
  explanation: マニュアルには駐車できない場所がいくつか挙げられており、その中には黄色く塗られた縁石に沿った場所も含まれています。
- id: 148
  category: penalties_and_points
  question: 国際シンボルマーク（障害者用駐車場）が表示されたスペースに違法に駐車した場合の罰金はいくらですか？
  choices:
    A: 10ドル以上50ドル以下。
    B: 50ドル以上300ドル以下。
    C: 一律500ドル。
    D: 最大1,000ドル。
  answer: B
  explanation: 障害者用スペースに違法に駐車した違反者は、有罪判決を受けた場合、50ドル以上300ドル以下の罰金に処されます。
- id: 149
  category: safe_driving_rules
  question: 障害者用駐車許可証（プラカード）を使用して指定の障害者用スペースに駐車することが違法となるのは、どのような場合ですか？
  choices:
    A: 障害者本人が車両を運転している場合。
    B: 障害者本人を降ろすところである場合。
    C: その時点で障害者本人が同乗（輸送）されていない場合。
    D: 駐車時間が15分未満である場合。
  answer: C
  explanation: 障害者本人がその時に同乗（輸送）されていない場合に、障害者用のプラカードやナンバープレートを使用して指定の障害者用駐車スペースに駐車することは違法です。
- id: 150
  category: safe_driving_rules
  question: 縦列駐車を開始する際、駐車スペースの前方に停まっている車両の左側に、どの程度の距離を空けて停車すべきですか？
  choices:
    A: 約6インチ（約15センチメートル）。
    B: 約1.5フィート（約45センチメートル）。
    C: 約3フィート（約90センチメートル）。
    D: 約5フィート（約1.5メートル）。
  answer: B
  explanation: 縦列駐車を開始するには、駐車スペースの前方にある車両と並び、その車両の左側から約1.5フィート（約45センチメートル）離れた位置で停車します。
- id: 151
  category: safe_driving_rules
  question: 4車線以上の高速道路で、左側車線を走行できるのはどのような時ですか？
  choices:
    A: 制限速度を守っている限り、いつでも走行できる。
    B: 商用車を運転している時のみ。
    C: 遅い車を追い越す時、他の車が安全に合流できるようにスペースを空ける時、または左折の準備をする時。
    D: 日中の時間帯のみ。
  answer: C
  explanation: 4車線以上の高速道路では、遅い車を追い越す場合、他の車が安全に合流できるスペースを空ける場合、または法的に認められた左折の準備をする場合を除き、常に右側を走行してください。
- id: 152
  category: safe_driving_rules
  question: 右側から車両を追い越すことが許されるのはどのような時ですか？
  choices:
    A: 前方の車両が制限速度以下で走行している時。
    B: 前方の車両が左折しようとしており、路肩や高速道路の未舗装部分を使用せずに追い越せる時。
    C: 右側の路肩に十分なスペースがある時はいつでも。
    D: 右側からの追い越しは決して許されない。
  answer: B
  explanation: 左折しようとしている車両を追い越す際には、右側車線を使用できます。ただし、追い越しの際に路肩や高速道路の未舗装部分を決して使用してはいけません。
- id: 153
  category: defensive_driving
  question: 4車線の高速道路で車両を追い越す前に、「死角（ブラインドスポット）」を確認する最善の方法は何ですか？
  choices:
    A: クラクションを鳴らして他のドライバーに知らせる。
    B: ルームミラー（バックミラー）だけに頼る。
    C: 素早く肩越しに目視する。
    D: ヘッドライトを点滅させる。
  answer: C
  explanation: 左肩越しに目視することは重要です。なぜなら、バックミラーでは確認できない空間である「死角」を確認できるからです。
- id: 154
  category: vehicle_information
  question: マニュアル車（MT車）を駐車する際、どのように車両を固定すべきですか？
  choices:
    A: ニュートラルに入れ、パーキングブレーキはかけない。
    B: パーキング（P）に入れ、パーキングブレーキをかける。
    C: ギアを入れた状態にし、パーキングブレーキをかける。
    D: イグニッションに鍵を差し込んだままにする。
  answer: C
  explanation: マニュアル（説明書）では、駐車時には常にパーキングブレーキをかけ、マニュアル車の場合はギアを入れたままにするよう指示されています。
- id: 155
  category: defensive_driving
  question: 他の車両があなたを追い越し始めたら、どうすべきですか？
  choices:
    A: 追い越しを阻止するために加速する。
    B: 左側車線に移動する。
    C: ブレーキを軽く踏んでドライバーに警告する。
    D: 自分の車線を維持し、速度を上げない。
  answer: D
  explanation: マニュアルには、「他の車両があなたを追い越し始めたら、自分の車線を維持し、速度を上げないこと」と記載されています。
- id: 156
  category: safe_driving_rules
  question: 他の車両よりもかなり遅く走行しており、後ろに車が溜まっている場合はどうすべきですか？
  choices:
    A: 速度を維持し、自分の車線にとどまる。
    B: 制限速度を超えるまで加速する。
    C: 安全な時に路肩に寄せて、後続車を先に行かせる。
    D: 非常点滅表示灯（ハザードランプ）を点け、車線内で停止する。
  answer: C
  explanation: マニュアルには、「後ろに車が溜まっている場合は、安全な時に路肩に寄せて先に行かせること」と記載されています。
- id: 157
  category: defensive_driving
  question: 緊急時に高速道路の路肩に停車しなければならない場合、どのように他のドライバーに知らせることができますか？
  choices:
    A: 車道に立ち、手を振る。
    B: 非常点滅表示灯（ハザードランプ）を点け、ボンネットを上げる。
    C: クラクションを鳴らし続ける。
    D: ハイビームを点滅させる。
  answer: B
  explanation: マニュアルには、「緊急時には高速道路の路肩に停車できます。その場合は、非常点滅表示灯を点けて他のドライバーに知らせてください。また、ボンネットを上げたり、アンテナに白い布を縛り付けたりすることも有効です」と記載されています。
- id: 158
  category: safe_driving_rules
  question: 入口ランプと加速車線を使って高速道路に入る際、どうすべきですか？
  choices:
    A: 加速車線の終わりで停止し、隙間ができるのを待つ。
    B: 左側車線に合流するまでゆっくり走行する。
    C: 高速道路を走る車両の速度に合わせて加速する。
    D: ランプですぐに停止して、優先権を譲る。
  answer: C
  explanation: マニュアルには、「ランプと加速車線を使用して、高速道路を走る車両の速度に合うように加速すること」と記載されています。
- id: 159
  category: safe_driving_rules
  question: 出入り制限のある高速道路で出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 停止して、通り過ぎた出口までバックする。
    B: 中央分離帯を通ってUターンする。
    C: 路肩に寄せて交通が途切れるのを待ち、バックする。
    D: 次の出口で降りて、通り過ぎた出口まで戻る。
  answer: D
  explanation: マニュアルには、「出口を通り過ぎてしまった場合、高速道路上で停止、バック、または転回をしようとしてはいけません。次の出口で高速道路を降り、通り過ぎた出口まで戻る必要があります」と記載されています。
- id: 160
  category: safe_driving_rules
  question: ダイバージング・ダイヤモンド・インターチェンジ（DDI）を走行する際のユニークな特徴は何ですか？
  choices:
    A: すべての入口ランプで停止しなければならない。
    B: 短距離の間、道路の左側を走行することになる。
    C: 完全に円を描くように走行する必要がある。
    D: 左側から進入してくる車両に道を譲らなければならない。
  answer: B
  explanation: マニュアルには、「DDIを走行する際は、短距離の間、道路の左側を走行することになります」と記載されています。
- id: 161
  category: defensive_driving
  question: 運転中に「高速道路催眠現象（highway hypnosis）」を避けるにはどうすればよいですか？
  choices:
    A: 常に目を動かし、周囲の交通状況や標識を確認する。
    B: 前方のセンターラインをじっと見つめる。
    C: 制限速度をわずかに超えて運転する。
    D: 窓を閉め切り、ラジオをオフにする。
  answer: A
  explanation: マニュアルには、「常に目を動かし、周囲の交通状況や高速道路の標識を確認することで、高速道路催眠現象を避けることができます」と記載されています。
- id: 162
  category: defensive_driving
  question: ミズーリ州の道路で緊急時に電話する携帯電話の番号は何番ですか？
  choices:
    A: '*911'
    B: '*55'
    C: '*HP'
    D: '*44'
  answer: B
  explanation: マニュアルには、「緊急時にかける携帯電話の番号は *55 です」と記載されています。
- id: 163
  category: signs_and_signals
  question: 路面の黄色の線は何を示していますか？
  choices:
    A: 同じ方向に進む交通を分けている。
    B: 道路の右端を示している。
    C: 反対方向に進む交通を分けている。
    D: 歩行者用横断歩道を示している。
  answer: C
  explanation: マニュアルには、「黄色は反対方向に進む交通を分けます」と記載されています。
- id: 164
  category: signs_and_signals
  question: 2本の黄色の実線で構成される中央標示は何を示していますか？
  choices:
    A: 反対側の交通は同じ方向に進んでいる。
    B: 道が空いていれば、線を越えて追い越してもよい。
    C: 追い越しの際、この2本の黄色の実線を決して越えてはならない。
    D: 交差点に近づいている。
  answer: C
  explanation: マニュアルには、「黄色の線は、線の反対側の交通が逆方向に進んでいることを示しています。追い越しの際、2本の黄色の実線を決して越えてはいけません」と記載されています。
- id: 165
  category: signs_and_signals
  question: 標識や信号のために停止する必要がある場合、車両のどこで停止しなければなりませんか？
  choices:
    A: 交通状況が見えるように、停止線を少し越えたところ。
    B: 車両が停止線または横断歩道に達する前。
    C: 横断歩道の中。
    D: 停止線の少なくとも20フィート手前。
  answer: B
  explanation: マニュアルには、「標識や信号のために停止する必要がある場合は、車両が停止線に達する前、または横断歩道がある場合はその手前で停止しなければなりません」と記載されています。
- id: 166
  category: defensive_driving
  question: 車両が故障し、タイヤがパンクした場合、絶対にやってはいけないことは何ですか？
  choices:
    A: 非常点滅表示灯（ハザードランプ）を点ける。
    B: 走行車線に入らなければならない状況で、タイヤ交換を試みる。
    C: アンテナやドアハンドルに白い布を結びつける。
    D: 車両の後方に緊急用フレア（発炎筒）を置く。
  answer: B
  explanation: マニュアルには、「決して路上に立たないでください。走行車線に入らなければならない場合は、タイヤ交換をしようとしないでください」と記載されています。
- id: 167
  category: safe_driving_rules
  question: 横断歩道はあるが白線が引かれていない交差点に近づくとき、どうしなければなりませんか？
  choices:
    A: 道路に線が描かれていない場合は、譲らずに進む。
    B: 横断歩道内にいる、または入ろうとしている歩行者に道を譲る。
    C: 通り抜ける前に、歩行者に警告するためにクラクションを鳴らす。
    D: 信号が赤の場合のみ停止する。
  answer: B
  explanation: マニュアルには、すべての横断歩道に線が引かれているわけではないこと、そして横断歩道内にいる、または入ろうとしている歩行者に道を譲らなければならないことが記載されています。明確な横断歩道がない交差点を通過する際も、歩行者に注意を払う必要があります。
- id: 168
  category: signs_and_signals
  question: 併用車線（dual-use lane）にいて、曲がりたいと考えています。信号機には直進の矢印のみが表示されています。どうすべきですか？
  choices:
    A: 対向車がいなければ、注意して曲がる。
    B: 直進し、次の利用可能な交差点で曲がる。
    C: 右左折の矢印が表示されるまで待ってから曲がる。
    D: 隣の車線に合流して曲がる。
  answer: C
  explanation: マニュアルによると、併用車線で曲がりたいときに直進の矢印のみが表示されている場合は、右左折の矢印が出るまで待たなければなりません。
- id: 169
  category: defensive_driving
  question: 路肩で車両を追い越してはいけないのはなぜですか？
  choices:
    A: 商用車を運転している場合を除き、違法であるため。
    B: 他のドライバーはそこに車がいると思わず、確認せずに道路から外れて停車する可能性があるため。
    C: 路肩は法執行機関の車両専用であるため。
    D: 路肩は常に柔らかすぎて、乗用車の重量を支えられないため。
  answer: B
  explanation: マニュアルでは、路肩での追い越しをしないよう警告しています。その理由は「他のドライバーはそこに車がいると思わず、確認せずに道路から外れて停車する可能性があるため」です。
- id: 170
  category: safe_driving_rules
  question: 信号が青のときに交通警察官が停止の合図をした場合、どうしなければなりませんか？
  choices:
    A: 信号が青なので、注意して進む。
    B: 常に交通警察官に従わなければならないため、停止する。
    C: 進む前に警察官の注意を引くためにクラクションを鳴らす。
    D: 路肩に寄せて、信号が赤になるのを待つ。
  answer: B
  explanation: 常に交通警察官に従わなければなりません。警察官が指示を出している場合は、青信号での停止を含め、交通標識や信号を無視して警察官の指示に従う必要があります。
- id: 171
  category: signs_and_signals
  question: 赤の点滅信号は何を意味しますか？
  choices:
    A: 徐行して注意深く進む。
    B: 信号機が故障しており、自動的に優先権がある。
    C: 一時停止標識と同じ意味である。
    D: 停止し、信号が青に変わるのを待つ。
  answer: C
  explanation: マニュアルによると、赤の点滅信号は一時停止標識と同じ意味を持ちます。
- id: 172
  category: signs_and_signals
  question: 信号機が消灯している、または作動していない交差点ではどのように対処すべきですか？
  choices:
    A: 左側の車両に道を譲る。
    B: 停止せずに交差点を通過する。
    C: 交差点を「譲れ（Yield）」の標識として扱う。
    D: 交差点を四方向一時停止（4-way stop）として扱う。
  answer: D
  explanation: マニュアルには、消灯している信号や作動していない信号機がある場合は、四方向一時停止として機能すると記載されています。
- id: 173
  category: signs_and_signals
  question: 左折時に黄色の矢印が点滅している場合、何を示していますか？
  choices:
    A: 保護された右左折（優先）であり、対向車は停止している。
    B: 曲がることはできるが、対向車との間に十分な間隔ができるまで待たなければならない。
    C: 停止して、緑の矢印が点灯するのを待たなければならない。
    D: 信号がまもなく赤に変わることを示している。
  answer: B
  explanation: 黄色の点滅矢印は、矢印の方向に進むことは可能ですが、曲がる前に対向車との間に十分な間隔ができるまで待つ必要があることを示しています。
- id: 174
  category: signs_and_signals
  question: 公共のレクリエーションや文化的関心事を示す交通標識には何色が使われますか？
  choices:
    A: 青
    B: 緑
    C: 茶色
    D: オレンジ
  answer: C
  explanation: マニュアルの標識の色チャートによると、茶色は公共のレクリエーションおよび文化的関心事に使用されます。
- id: 175
  category: signs_and_signals
  question: 警戒標識（Warning signs）にのみ使用される標識の形はどれですか？
  choices:
    A: 八角形
    B: 縦の長方形
    C: 菱形（ダイヤモンド型）
    D: ペナント型（三角旗型）
  answer: C
  explanation: マニュアルの標識の形状チャートによると、菱形は警戒標識に使用されます。
- id: 176
  category: signs_and_signals
  question: 学校区域（スクールゾーン）または通学路の横断標識はどのような形をしていますか？
  choices:
    A: 五角形
    B: 円形
    C: 三角形
    D: 横の長方形
  answer: A
  explanation: マニュアルの標識の形状チャートでは、五角形が学校関連の標識に使用されると規定されています。
- id: 177
  category: signs_and_signals
  question: 「付加車線（Added Lane）」の標識は何を示していますか？
  choices:
    A: 2車線の道路がまもなく1車線になる。
    B: 別の道路から車両が進入してくるが、車線が付加されているため合流（マージ）の必要はない。
    C: 進入車両が道路に入れるよう、左側に合流しなければならない。
    D: 道路がまもなく中央分離帯で仕切られた対面通行になる。
  answer: B
  explanation: 「付加車線（Added Lane）」の標識は、別の道路から車両が進入してくるが、新しい車線が追加されているため、合流の必要がないことを意味します。
- id: 178
  category: signs_and_signals
  question: 「カーブ（Curve）」標識と「右左折（Turn）」標識の違いは何ですか？
  choices:
    A: 「右左折」標識は推奨最高速度が時速30マイル（30 mph）以下であることを示し、「カーブ」標識は推奨速度が制限速度よりは低いが、一般的に時速30マイルより高い場合に使用される。
    B: 「カーブ」標識は中央分離帯のある高速道路でのみ使用され、「右左折」標識は2車線道路で使用される。
    C: 「右左折」標識は完全停止しなければならないことを意味し、「カーブ」標識は徐行するだけでよいことを意味する。
    D: 違いはない。すべての道路で入れ替えて使用される。
  answer: A
  explanation: マニュアルによると、右左折標識は推奨最高速度が時速30マイル以下の急な曲がり角を警告し、カーブ標識は推奨速度が制限速度よりも低いカーブを警告します。
- id: 179
  category: vehicle_information
  question: 車両の後部にある反射材のオレンジ色の三角形は何を意味していますか？
  choices:
    A: 車両が危険物を運搬している。
    B: 車両が時速25マイル（25 mph）未満で走行している。
    C: 車両が故障しており、動くことができない。
    D: 車両の幅が広く、追い越しができない。
  answer: B
  explanation: 車両の後部にある反射材のオレンジ色の三角形は「低速走行車両（Slow Moving Vehicle）」の標識であり、その車両が時速25マイル未満で走行していることを意味します。
- id: 180
  category: safe_driving_rules
  question: 共有センターレーン（右左折用中央車線）は路面にどのように表示されていますか？
  choices:
    A: 両側に2本の白い実線。
    B: 中央に1本の白い破線。
    C: 両側に黄色の実線と黄色の破線。
    D: 両側に2本の黄色の実線。
  answer: C
  explanation: マニュアルによると、共有センターレーンは各サイドが黄色の実線と黄色の破線でマークされています。
- id: 181
  category: signs_and_signals
  question: 規制標識（regulatory signs）の多くはどのような形と色をしていますか？
  choices:
    A: 菱形で黄色
    B: 円形で青色
    C: 正方形または長方形で、白地に黒または赤の文字
    D: 三角形でオレンジ色
  answer: C
  explanation: 多くの規制標識は正方形または長方形で、白地に黒または赤の文字や記号が描かれています。
- id: 182
  category: safe_driving_rules
  question: 停止線や横断歩道のない交差点で一時停止標識（stop sign）に近づいた場合、どこで停止しなければなりませんか？
  choices:
    A: 一時停止標識のちょうど真横
    B: 交差点に入る直前
    C: 交差点の10フィート手前
    D: 交差点に車両がいなければ停止する必要はない
  answer: B
  explanation: 停止線や横断歩道がない場合は、交差点に入る直前の、交差点の端の近くまで進んで停止しなければなりません。
- id: 183
  category: safe_driving_rules
  question: 通常の道路状況において、ミズーリ州の州間高速道路（interstate highway）で走行できる最低速度は何マイルですか？
  choices:
    A: 30 mph
    B: 40 mph
    C: 45 mph
    D: 50 mph
  answer: B
  explanation: 通常の道路状況では、州間高速道路を40 mph未満の速度で走行することはできません。
- id: 184
  category: safe_driving_rules
  question: 別段の掲示がない限り、ミズーリ州の都市、町、または村における規定の制限速度は何マイルですか？
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: 別段の掲示がない限り、都市、町、または村における制限速度は25 mphです。
- id: 185
  category: safe_driving_rules
  question: 別段の掲示がない限り、ミズーリ州のレター道路（lettered roads）における最高制限速度は何マイルですか？
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: C
  explanation: マニュアルの最高速度ガイドによると、レター道路の制限速度は55 mphです。
- id: 186
  category: safe_driving_rules
  question: 赤信号が点滅しているか遮断機が降りているために踏切で停止しなければならない場合、線路からどのくらい離れた場所で停止する必要がありますか？
  choices:
    A: 5〜10フィート
    B: 10〜15フィート
    C: 15〜50フィート
    D: 50〜100フィート
  answer: C
  explanation: 赤信号が点滅しているか遮断機が降りている場合、踏切の線路の手前15〜50フィート以内で停止しなければなりません。
- id: 187
  category: safe_driving_rules
  question: 踏切を横断する際にギアチェンジをしない方がよいとされるのはなぜですか？
  choices:
    A: トランスミッションを損傷するため
    B: 車両が急加速するため
    C: 車両がエンスト（stall）する可能性があるため
    D: 違法であるため
  answer: C
  explanation: 踏切を横断中に車両がエンストする可能性があるため、横断中にギアチェンジをすることは賢明ではありません。
- id: 188
  category: signs_and_signals
  question: 踏切にある白いX字型の「クロスバック（crossbuck）」標識は、他のどの標識と同じ意味を持ちますか？
  choices:
    A: 一時停止（Stop）標識
    B: 譲れ（Yield）標識
    C: 進入禁止（Do Not Enter）標識
    D: 制限速度（Speed Limit）標識
  answer: B
  explanation: 踏切には白いX字型の標識、つまり「クロスバック」が設置されています。この標識は「譲れ（yield）」標識と同じ意味を持ちます。したがって、踏切では列車に道を譲らなければなりません。
- id: 189
  category: signs_and_signals
  question: 工事区間（work zone）の標識は何色ですか？
  choices:
    A: 蛍光オレンジ色
    B: 明るい黄色
    C: ネオングリーン
    D: 反射ホワイト
  answer: A
  explanation: 工事区間の標識は蛍光オレンジ色で、道路上または道路沿いで何らかの工事が行われていることを示します。
- id: 190
  category: safe_driving_rules
  question: 対向車に対して交通規制を行う誘導員（flagger）がいるのは、どのような種類の工事区間ですか？
  choices:
    A: 移動式工事区間
    B: 路肩の工事区間
    C: 片側1車線が閉鎖された2車線の対面通行道路
    D: 全車線が開放されている多車線の州間高速道路
  answer: C
  explanation: 誘導業務（Flagging Operation）は、片側1車線が閉鎖された2車線の対面通行道路で行われる作業です。工事区間の開始地点と終了地点に誘導員が配置され、交通規制を行います。
- id: 191
  category: defensive_driving
  question: 移動式作業区域に近づく際、ドライバーは何を目にすることを想定すべきですか？
  choices:
    A: 恒久的なコンクリート製の障壁
    B: 点滅する矢印パネルを備えた防護車両
    C: 交通を高速道路外へ誘導する迂回標識
    D: 一時的な信号機
  answer: B
  explanation: 移動式作業区域に近づく際、ドライバーは車線内に、合流すべき正しい車線を示す点滅矢印パネルを備えた防護車両があることを想定しておく必要があります。
- id: 192
  category: signs_and_signals
  question: 赤い円とシンボルの上に赤い斜線が描かれた規制標識は何を示していますか？
  choices:
    A: 優先権を譲らなければならない。
    B: 危険に近づいている。
    C: Uターン禁止など、特定の行為が禁止されていること。
    D: 直ちに停止しなければならない。
  answer: C
  explanation: 一部の規制標識には、赤い円とシンボルの上に赤い斜線が描かれています。これらは、左折禁止やUターン禁止など、特定の行為ができないことを示しています。
- id: 193
  category: safe_driving_rules
  question: 「進入禁止（Wrong Way）」の標識を目にし、対向車線に入ってしまったことに気づいた場合、どうすべきですか？
  choices:
    A: クラクションを鳴らし、ゆっくり走行を続ける。
    B: 交差点に到達するまで車両を後退させる。
    C: 可能な限り迅速かつ安全に道路脇に寄せ、向きを変えて戻る。
    D: 車線内で停止し、交通が途切れるのを待つ。
  answer: C
  explanation: 誤って曲がり対向車線に入ってしまった場合は、可能な限り迅速かつ安全に道路から離れ、向きを変えて戻らなければなりません。
- id: 194
  category: signs_and_signals
  question: 各地への方向や距離を示す案内標識の色と形は何ですか？
  choices:
    A: 正方形または長方形で、青地に白文字
    B: 正方形または長方形で、緑地または茶地に白文字
    C: ひし形で、黄地に黒文字
    D: 円形で、緑地に白文字
  answer: B
  explanation: 案内標識は正方形または長方形で、緑地または茶地に白文字で表示されます。これらは、都市、空港、州境などの各地への方向や距離を示します。
- id: 195
  category: signs_and_signals
  question: 休憩所や病院などのさまざまなサービスの場所を示す標識はどれですか？
  choices:
    A: 案内標識
    B: 路線番号標識
    C: サービス標識
    D: 緊急参照マーカー
  answer: C
  explanation: サービス標識は正方形または長方形で、青地に白の文字またはシンボルで表示されます。これらは、休憩所や病院などのさまざまなサービスの場所を示します。
- id: 196
  category: signs_and_signals
  question: 路線番号標識において、南北方向のルートはどのように識別されますか？
  choices:
    A: 偶数によって
    B: 奇数によって
    C: 3桁の偶数によって
    D: 3桁の奇数によって
  answer: B
  explanation: 南北方向のルートは奇数で識別されます。東西方向の道路は偶数で識別されます。
- id: 197
  category: signs_and_signals
  question: 西から東へ走る州間高速道路（インターステート）において、出口番号はどのように配置されていますか？
  choices:
    A: 東側を0として始まり、西へ進むにつれて増える。
    B: 西側を0として始まり、東へ進むにつれて増える。
    C: 郡に基づいてランダムに番号が振られている。
    D: 州都を0として始まり、外側に向かって増える。
  answer: B
  explanation: 東西に走る州間高速道路は、西から東に向かって番号が振られています。つまり、出口番号は西側を0として始まり、東へ進むにつれて増えていきます。
- id: 198
  category: signs_and_signals
  question: 州間高速道路の外側の路肩に沿って、緊急参照マーカーはどのくらいの間隔で設置されていますか？
  choices:
    A: 0.1マイルごと
    B: 0.2マイルごと
    C: 0.5マイルごと
    D: 1マイルごと
  answer: B
  explanation: 参照マーカーは0.2マイルごとに設置されているため、ドライバーは常に標識が視界に入るようになっています。
- id: 199
  category: safe_driving_rules
  question: 車両のシートベルトの正しい着用方法は何ですか？
  choices:
    A: 腰ベルトは腰の低い位置にぴったりと締め、肩ベルトは胸を横切るように着用する。
    B: 腰ベルトは腹部を横切り、肩ベルトは脇の下を通す。
    C: 腰ベルトは腰の低い位置に、肩ベルトは背中の後ろに通す。
    D: 腰ベルトは太ももの上に緩めに、肩ベルトは首を横切るように着用する。
  answer: A
  explanation: シートベルトは常に、腰ベルトを腰の低い位置にぴったりと締め、肩ベルトを胸に当てるように着用してください。肩ベルトを脇の下に通したり、背中の後ろに回したりしてはいけません。
- id: 200
  category: safe_driving_rules
  question: 米国国家道路交通安全局（NHTSA）は、ドライバーの胸骨の中心とステアリングホイールの中心との間に、少なくともどれくらいの距離を空けて座ることを推奨していますか？
  choices:
    A: 5インチ
    B: 8インチ
    C: 10インチ
    D: 12インチ
  answer: C
  explanation: 米国国家道路交通安全局（NHTSA）は、エアバッグ作動時の負傷を防ぐため、ドライバーの胸骨の中心とステアリングホイールの中心との間に少なくとも10インチの距離を空けて座ることを推奨しています。
- id: 201
  category: driver_responsibility
  question: ミズーリ州の法律によると、中級運転免許（intermediate driver license）保持者に同乗する場合、誰が適切に拘束（シートベルト等の着用）されていなければなりませんか？
  choices:
    A: 運転者と助手席の乗員のみ
    B: 12歳未満の子供のみ
    C: 後部座席の乗員のみ
    D: 車内のすべての乗員
  answer: D
  explanation: ミズーリ州の法律では、中級運転免許保持者に同乗するすべての乗員が適切に拘束されていることが義務付けられています。
- id: 202
  category: safe_driving_rules
  question: ミズーリ州のチャイルドシート等着用義務法（Child Passenger Restraint Law）に基づき、4歳未満の子供には何が義務付けられていますか？
  choices:
    A: 体重が30ポンド（約13.6kg）を超えていれば、標準のシートベルトを使用できる。
    B: 体重に関わらず、その子供に適したチャイルドシート（乳幼児用補助乗車装置）で固定しなければならない。
    C: ブースターシートで固定しなければならない。
    D: 後部座席であれば、何も着用せずに乗車できる。
  answer: B
  explanation: 4歳未満の子供は、体重に関わらず、その子供に適したチャイルドシート（乳幼児用補助乗車装置）で固定しなければなりません。
- id: 203
  category: safe_driving_rules
  question: 6歳で体重50ポンド（約22.7kg）、身長4フィート5インチ（約135cm）の子供は、どのような装置で固定しなければなりませんか？
  choices:
    A: 標準の車両用シートベルト
    B: 後ろ向きの乳児用シート
    C: チャイルドシートまたはブースターシート
    D: 法律で義務付けられている装置はない
  answer: C
  explanation: 4歳以上8歳未満で、かつ体重が40ポンド（約18kg）以上80ポンド（約36kg）未満、かつ身長が4フィート9インチ（約145cm）未満の子供は、チャイルドシートまたはブースターシートで固定しなければなりません。
- id: 204
  category: defensive_driving
  question: 防衛運転（defensive driving）を行う際、交差点に近づいたときに、他の車両側が赤信号や一時停止標識であっても、何をすべきですか？
  choices:
    A: 交差点を素早く通過するために加速する。
    B: 左右を確認する。
    C: 他の運転者に警告するためにクラクションを鳴らす。
    D: 他の車が横切らないよう、交通信号を完全に信頼する。
  answer: B
  explanation: 交差点では、他の車両側が赤信号や一時停止標識であっても、左右を確認してください。他の車が自分の前を横切らないようにするために、交通信号や標識を完全に信頼してはいけません。
- id: 205
  category: vehicle_information
  question: ハンドル（ステアリングホイール）を握る際、推奨される手の位置はどこですか？
  choices:
    A: 左手を10時の位置、右手を2時の位置
    B: 左手を7時から9時の間、右手を3時から5時の間
    C: 両手を6時の位置に置く
    D: 左手を12時の位置、右手はシフトレバーに置く
  answer: B
  explanation: 適切なグリップを使用してください。ハンドルの左手を7時から9時の位置に、右手を3時から5時の位置に置きます。
- id: 206
  category: vehicle_information
  question: 車両が走行中に、イグニッションキーを「LOCK（ロック）」の位置に回してはいけないのはなぜですか？
  choices:
    A: エンジンがオーバーヒートするため。
    B: トランスミッションに永久的な損傷を与えるため。
    C: ハンドルがロックされ、制御不能になるため。
    D: エアバッグが作動するため。
  answer: C
  explanation: 車両が走行中に、イグニッションキーを「LOCK」の位置に回してはいけません。ハンドルを回そうとするとハンドルがロックされ、車両の制御ができなくなります。
- id: 207
  category: defensive_driving
  question: 前方の車両との安全な車間距離を測るための良い方法は何ですか？
  choices:
    A: 車1台分の長さルール
    B: 3秒ルール
    C: 5秒ルール
    D: 10フィート（約3m）ルール
  answer: B
  explanation: 安全な車間距離を測る良い方法は「3秒ルール」を使用することです。前方の車両が特定の物（標識など）を通過した後、ゆっくりと「1001、1002、1003」と数えます。
- id: 208
  category: defensive_driving
  question: 他の運転者に車間距離を詰められた（あおられた）場合、右側に車線があるときはどうすべきですか？
  choices:
    A: 運転者に警告するために、繰り返しブレーキを軽く踏む。
    B: 車間距離を広げるために加速する。
    C: 右側の車線に移動する。
    D: その車線内で停車する。
  answer: C
  explanation: 他の運転者に車間距離を詰められたり「あおられたり」した場合、右側に車線があれば、右側に移動してください。
- id: 209
  category: sharing_the_road
  question: 自転車を追い越そうとしているときに、同時に対向車が近づいてきた場合、最も安全な行動は何ですか？
  choices:
    A: 対向車が来る前に自転車を追い越せるよう加速する。
    B: 自転車が道路から外れるようクラクションを鳴らす。
    C: 対向車のためにスペースを空けるよう、自転車に近づく。
    D: 減速して先に対向車を通過させ、自転車に対して十分なスペースを確保できるようにする。
  answer: D
  explanation: マニュアルでは、潜在的な危険には一つずつ対処することを推奨しています。対向車が近づいているときに自転車を追い越す場合は、減速して先に対向車を通過させ、自転車に対して十分なスペースを空けられるようにします。
- id: 210
  category: safe_driving_rules
  question: 車両の総停止距離は、何と等しいですか？
  choices:
    A: 制動距離 ＋ 車間距離
    B: 空走距離（反応距離） ＋ 制動距離
    C: 空走距離（反応距離） ＋ 車間距離
    D: 制動距離 － 空走距離（反応距離）
  answer: B
  explanation: マニュアルによると、停止距離は空走距離（反応距離）と制動距離を足したものに等しくなります。
- id: 211
  category: safe_driving_rules
  question: 右左折や車線変更をする際、どのくらい手前から合図を出すように努めるべきですか？
  choices:
    A: 少なくとも50フィート。
    B: 少なくとも100フィート。
    C: 少なくとも200フィート。
    D: 少なくとも500フィート。
  answer: B
  explanation: マニュアルには、行動を開始する少なくとも100フィート手前から合図を出すように努めるべきであると記載されています。
- id: 212
  category: safe_driving_rules
  question: 右左折しようとしている場所との間に別の通りや私道がある場合、どうすべきですか？
  choices:
    A: 私道に関係なく、少なくとも500フィート手前で合図を出す。
    B: 他のドライバーに早く知らせるため、すぐに合図を出す。
    C: 他の通りや私道を通り過ぎるまで待ってから合図を出す。
    D: 車両の方向指示器の代わりに手信号を使用する。
  answer: C
  explanation: マニュアルでは、曲がりたい場所との間に他の通り、私道、または入り口がある場合は、それらを通り過ぎるまで合図を待つよう助言しています。
- id: 213
  category: safe_driving_rules
  question: マニュアルによると、クラクション（警音器）を使用することが認められる唯一の理由は何ですか？
  choices:
    A: 他のドライバーに対して怒りや不満を示すため。
    B: 他のドライバーに警告するため。
    C: 遅いドライバーに追い越したいことを知らせるため。
    D: 歩行者や自転車利用者に挨拶するため。
  answer: B
  explanation: マニュアルには、クラクションを使用する理由はただ一つ、他のドライバーに警告するためであると記載されています。怒りや不満の表現として使用してはいけません。
- id: 214
  category: safe_driving_rules
  question: 通常の運転条件下で、掲示されている最低速度よりも遅く走ることが合法となるのはいつですか？
  choices:
    A: 通常の運転条件下では、決して合法ではありません。
    B: 新しく購入した車両を運転しているとき。
    C: 特定の住所を探しているとき。
    D: 右車線を走行しているとき。
  answer: A
  explanation: 通常の運転条件下で、掲示されている最低速度よりも遅く走ることは法律違反です。悪天候、交通渋滞、または道路状況が悪い場合にのみ、より低速で運転することができます。
- id: 215
  category: safe_driving_rules
  question: 致命的な一酸化炭素中毒を避けるために推奨される習慣は次のうちどれですか？
  choices:
    A: 車両を暖めるために、閉め切ったガレージでエンジンをかけたままにする。
    B: 窓を閉めた状態で、停車中の車両のヒーターを使用する。
    C: 他の車両のすぐ後ろを走行するときは、通気口を開けておく。
    D: 欠陥のあるマフラーや排気システムで運転しない。
  answer: D
  explanation: 一酸化炭素中毒を避けるため、マニュアルには「欠陥のあるマフラーや排気システムで運転しないでください」と明記されています。
- id: 216
  category: defensive_driving
  question: シカに関連する衝突事故が最も多く発生するのは何月ですか？
  choices:
    A: 2月、3月、4月。
    B: 6月、7月、8月。
    C: 1月、5月、および10月から12月。
    D: 9月と10月のみ。
  answer: C
  explanation: マニュアルによると、シカに関連する衝突事故の多くは1月、5月、および10月から12月にかけて発生します。
- id: 217
  category: defensive_driving
  question: シカとの衝突が避けられない場合、ブレーキを強く踏み込みすぎるのを避けるべきなのはなぜですか？
  choices:
    A: エアバッグが早まって作動する原因になるため。
    B: 車両のフロントエンドが沈み込み、シカが客室（車内）に衝突する可能性があるため。
    C: シカがヘッドライトの光で立ちすくんでしまうため。
    D: ハンドルがロックされ、回避行動が取れなくなるため。
  answer: B
  explanation: ブレーキ圧が強すぎると車両のフロントエンドが沈み込み、シカの足に当たって体が客室（車内）に飛び込んでくる可能性があるためです。
- id: 218
  category: vehicle_information
  question: 車両のタイヤの推奨空気圧（PSI）はどこで確認できますか？
  choices:
    A: タイヤ自体のサイドウォール（側面）。
    B: 車両のオーナーズマニュアル（取扱説明書）または運転席側のドアジャム（ドアの縁）。
    C: 車両のステアリングコラム（ハンドルの軸）。
    D: エンジンブロック。
  answer: B
  explanation: マニュアルには、車両のオーナーズマニュアルまたは運転席側のドアジャムに記載されている推奨PSIを使用してタイヤの空気圧を確認するように記載されています。
- id: 219
  category: vehicle_information
  question: ペニーテスト（硬貨を使ったテスト）でタイヤの摩耗をチェックする際、溝の深さが約何インチを下回ると、安全ではなくグリップ力が大幅に低下しているとみなされますか？
  choices:
    A: 1/32インチ。
    B: 2/32インチ。
    C: 3/32インチ。
    D: 4/32インチ。
  answer: B
  explanation: マニュアルによると、溝が約2/32インチを下回ると、悪条件下で路面をグリップする車の能力が大幅に低下します。
- id: 220
  category: driver_responsibility
  question: 警察官に停車を命じられた際、手はどうすべきですか？
  choices:
    A: 足の下に隠しておく。
    B: 登録証を取り出すためにグローブボックスに手を入れる。
    C: 容易に確認できるように、ハンドル（ステアリングホイール）の上に置いておく。
    D: 警察官に合図を送るために窓の外で手を振る。
  answer: C
  explanation: マニュアルは、警察官に止められた際、「手が容易に確認できるように、ハンドル（ステアリングホイール）の上に置いておくこと」とドライバーに指示しています。
- id: 221
  category: driver_responsibility
  question: 交通取り締まりで停車させられた際、車内に武器を所持している場合、いつ警察官に知らせるべきですか？
  choices:
    A: 警察官が車内捜索を求めた場合のみ。
    B: 警察官と最初に接触したとき。
    C: 運転免許証を提示した後。
    D: 警察官に知らせる義務はない。
  answer: B
  explanation: マニュアルには、「車内に武器がある場合は、警察官と最初に接触した際にその旨を伝えてください」と記載されています。
- id: 222
  category: defensive_driving
  question: シカとの衝突が避けられないと判断した場合、マニュアルではどのように行動することを推奨していますか？
  choices:
    A: 道路の右側に急ハンドルを切る。
    B: 対向車線に急ハンドルを切る。
    C: 急ハンドルを切らない。
    D: 衝撃時間を最小限にするために加速する。
  answer: C
  explanation: マニュアルには明確に次のように記載されています。「衝突が避けられないと判断した場合は、急ハンドルを切らないでください。道路外や対向車の進路に急ハンドルを切ると、負傷のリスクが高まる可能性があります。」
- id: 223
  category: penalties_and_points
  question: 交通違反切符への署名は何を意味しますか？
  choices:
    A: 罪を認めること。
    B: 弁護士を依頼する権利の放棄。
    C: 切符の受領。ただし、罪を認めることではない。
    D: 即座に罰金を支払うことへの同意。
  answer: C
  explanation: マニュアルには、「交通違反切符の受領と署名は、罪を認めることではありません。しかし、署名を拒否すると逮捕される可能性があります」と記載されています。
- id: 224
  category: safe_driving_rules
  question: 夜間、ヘッドライトを点灯しなければならないのはいつですか？
  choices:
    A: 日没の1時間後から日の出の1時間前まで。
    B: 日没の30分後から日の出の30分前まで。
    C: 外が完全に暗いときのみ。
    D: 日没から日の出まで。
  answer: B
  explanation: 夜間の運転では、日没の30分後から日の出の30分前までヘッドライトを点灯させる必要があります。
- id: 225
  category: safe_driving_rules
  question: 夜間の運転中、対向車とどのくらいの距離になったらロービームに切り替えるべきですか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 400フィート
    D: 500フィート
  answer: D
  explanation: 対向車との距離が500フィート（約1ブロック）以内になったら、ロービームを使用する必要があります。
- id: 226
  category: defensive_driving
  question: 夜間の運転中、ヘッドライトで前方どのくらいの距離まで見ることができますか？
  choices:
    A: 約200フィート
    B: 約350フィート
    C: 約500フィート
    D: 約600フィート
  answer: B
  explanation: ヘッドライトの照射範囲を超えた速度で運転しないでください。ヘッドライトで前方を確認できるのは約350フィートまでです。
- id: 227
  category: safe_driving_rules
  question: 気象条件により何を使用する必要がある場合、常にヘッドライトを点灯しなければなりませんか？
  choices:
    A: デフロスター
    B: フロントガラスのワイパー
    C: 非常点滅表示灯（ハザードランプ）
    D: フォグランプ
  answer: B
  explanation: マニュアルには、「気象条件によりフロントガラスのワイパーを使用する必要がある場合は、常にヘッドライトを点灯しなければなりません」と記載されています。
- id: 228
  category: defensive_driving
  question: 雪道や凍結路を走行する際、推奨される安全な車間距離はどのくらいですか？
  choices:
    A: 2〜3秒
    B: 3〜4秒
    C: 5〜7秒
    D: 8〜10秒
  answer: D
  explanation: 雪道や凍結路では、停車するまでにより長い時間がかかります。前方の車両との間に、約8〜10秒の安全な車間距離を保つようにしてください。
- id: 229
  category: defensive_driving
  question: 道路のどの部分が他の部分よりも先に凍結し、滑りやすくなりますか？
  choices:
    A: 交差点
    B: 橋や高架橋
    C: カーブ
    D: 上り坂
  answer: B
  explanation: 橋や高架橋は、道路の他の部分よりも先に凍結し、滑りやすくなることを覚えておいてください。
- id: 230
  category: defensive_driving
  question: 濡れた路面でハイドロプレーニング現象が起こり始める速度はどれくらいですか？
  choices:
    A: 時速25マイル（mph）を超えるすべての速度
    B: 時速35マイル（mph）を超えるすべての速度
    C: 時速45マイル（mph）を超えるすべての速度
    D: 時速55マイル（mph）を超えるすべての速度
  answer: B
  explanation: ハイドロプレーニング現象とは、濡れた路面でトラクション（駆動力）と制御を失うことを指し、時速35マイル（mph）を超える速度であればいつでも発生する可能性があります。
- id: 231
  category: defensive_driving
  question: ハイドロプレーニング現象が起きていると思われる場合、どうすべきですか？
  choices:
    A: すぐにブレーキを強く踏む。
    B: ブレーキを素早く何度も踏む（ポンピングブレーキ）。
    C: アクセルから足を離し、減速する。
    D: 路肩に向かって急ハンドルを切る。
  answer: C
  explanation: ハイドロプレーニング現象が起きていると思われる場合は、アクセルから足を離して減速してください。ブレーキを踏むとスリップの原因となる可能性があるため、踏まないようにしてください。
- id: 232
  category: vehicle_information
  question: 車両にアンチロック・ブレーキ・システム（ABS）が装備されている場合、緊急ブレーキ時にはどのように操作すべきですか？
  choices:
    A: ブレーキを素早く何度も踏む（ポンピングブレーキ）。
    B: ハンドル操作をしながら、ブレーキを強く一定の圧力で踏み続ける。
    C: ブレーキから足を離し、非常用ブレーキ（パーキングブレーキ）を使用する。
    D: ブレーキを軽く踏み、ハンドル操作を控える。
  answer: B
  explanation: ABSが装備されている車では、4輪ABSを適切に作動させるために、ハンドル操作を行いながらブレーキを強く一定の圧力で踏み続けてください。ポンピングブレーキは行わないでください。
- id: 233
  category: defensive_driving
  question: 車両がスリップした場合はどのように対処すべきですか？
  choices:
    A: ブレーキを踏み、ハンドルを真っ直ぐに固定する。
    B: 後輪が滑っている方向に、ハンドルを穏やかに切る。
    C: スリップしている方向とは逆の方向にハンドルを切る。
    D: トラクションを回復させるために加速する。
  answer: B
  explanation: スリップに対処するには、アクセルから足を離し、ブレーキは踏まずに、後輪が滑っている方向にハンドルを穏やかに切ってください。
- id: 234
  category: safe_driving_rules
  question: 霧の中を走行する際、ヘッドライトはどの設定にすべきですか？
  choices:
    A: ハイビーム（走行用前照灯）
    B: ロービーム（すれ違い用前照灯）
    C: オート設定
    D: パーキングライト（車幅灯）のみ
  answer: B
  explanation: ヘッドライトはロービームにしてください。霧の中でハイビームにすると、光が反射してかえって視界が悪くなります。
- id: 235
  category: defensive_driving
  question: 走行中にブレーキペダルが突然床まで沈み込んでしまった場合、まず最初に何をすべきですか？
  choices:
    A: すぐにイグニッションキーを切る。
    B: 高いギアにシフトチェンジする。
    C: ブレーキペダルを素早く、強く数回踏み込む（ポンピング）。
    D: 非常用ブレーキ（パーキングブレーキ）を力いっぱい引く。
  answer: C
  explanation: ブレーキペダルが突然床まで沈み込んだ場合は、ブレーキペダルを素早く強く数回踏み込んでください。それでも効果がない場合は、非常用ブレーキ（パーキングブレーキ）を徐々に使用してください。
- id: 236
  category: driver_responsibility
  question: 夜間に警察官に停車を命じられた際、視認性を高めるために何をすべきですか？
  choices:
    A: ハイビームをつける。
    B: ハザードランプを点灯させ、車から降りる。
    C: 停車後すぐに車内灯（ルームランプ）をつける。
    D: 窓から懐中電灯で外を照らす。
  answer: C
  explanation: 夜間の場合、停車後に警察官が車両にスポットライトを向けることがあります。警察官が車内の様子を確認しやすくし、視認性を助けるために、停車したらすぐに車内灯をつけてください。
- id: 237
  category: defensive_driving
  question: 走行中にタイヤがバースト（破裂）した場合、ブレーキ操作に関して取るべき正しい行動は何ですか？
  choices:
    A: 停止するために、すぐにブレーキを強く踏む。
    B: コントロールを維持するために、ブレーキを素早く何度も踏む。
    C: 車両がほぼ停止するまで、ブレーキを踏まない。
    D: ブレーキを一定の強い力で踏み続ける。
  answer: C
  explanation: タイヤがバーストした際は、アクセルから足を離しますが、ブレーキは踏まないでください。ブレーキは車両がほぼ停止してからかけるようにします。
- id: 238
  category: defensive_driving
  question: 車輪が舗装路の端から外れてしまった場合、どうすべきですか？
  choices:
    A: 道路に戻るために、ハンドルを左に急に切る。
    B: 未舗装路でトラクションを得るために加速する。
    C: すぐに停止するために、ブレーキを強く踏む。
    D: ハンドルをしっかりと握り、アクセルから足を離す。
  answer: D
  explanation: 車輪が舗装路から外れた場合は、ハンドルをしっかりと握り、アクセルから足を離してください。ブレーキは踏まず、必要な場合にのみ軽くブレーキをかけてください。
- id: 239
  category: defensive_driving
  question: 走行中にアクセルが戻らなくなった（固着した）場合、どのギアに入れるべきですか？
  choices:
    A: パーク (P)
    B: リバース (R)
    C: ニュートラル (N)
    D: ローギア（1速）
  answer: C
  explanation: アクセルが戻らなくなった場合は、ギアをニュートラルに入れ、ブレーキをかけ、安全に道路脇へ誘導してください。
- id: 240
  category: defensive_driving
  question: 自分の車線に対向車が正面から向かってきている場合、左側の車線（対向車線側）に避けてはいけないのはなぜですか？
  choices:
    A: 左側の車線は追い越し専用だから。
    B: 相手のドライバーも、その車線に戻ろうとする可能性があるから。
    C: 緊急時であっても中央線を越えることは違法だから。
    D: 左に曲がると車両のトラクションが失われるから。
  answer: B
  explanation: 対向車が正面から向かってくる場合、相手のドライバーも元の車線（あなたから見て左側）に戻ろうとする可能性があるため、左側に避けてはいけません。代わりに、右側の路肩に寄せて、ホーン（警笛）を鳴らしてください。
- id: 241
  category: safe_driving_rules
  question: 踏切内で車が動かなくなり、列車が近づいてきた場合、車から降りた後はどの方向に逃げるべきですか？
  choices:
    A: 列車の進行方向。
    B: 列車が来る方向。
    C: 線路に対して垂直な方向。
    D: 線路と平行に、どちらかの方向。
  answer: B
  explanation: 列車が来る方向に走ってください。列車の進行方向に走ると、列車が車に衝突した際に飛散する破片に当たる恐れがあります。
- id: 242
  category: vehicle_information
  question: 国家運輸安全委員会（NTSB）によると、12人乗りおよび15人乗りのバンは、何人以上の乗客を乗せると本質的に不安定になりますか？
  choices:
    A: 6人
    B: 8人
    C: 10人
    D: 12人
  answer: C
  explanation: NTSBは、12人乗りおよび15人乗りのバンが設計上の定員まで積載された場合、つまり10人を超える乗客を乗せているときは、本質的に不安定であると判断しています。
- id: 243
  category: penalties_and_points
  question: 飲酒または薬物使用状態で運転し、人を負傷または死亡させた場合の潜在的な罰則は何ですか？
  choices:
    A: 2年から7年の禁錮刑。
    B: 最大1,000ドルの罰金。
    C: 1年間の運転免許取り消し。
    D: 100時間の社会奉仕活動。
  answer: A
  explanation: 飲酒または薬物使用状態で運転し、人を負傷または死亡させた場合、2年から7年の禁錮刑、5,000ドルの罰金、および/または5年間の免許取り消し処分を受ける可能性があります。
- id: 244
  category: penalties_and_points
  question: 警察官に止められ、血中アルコール濃度（BAC）が0.08%以上であった場合、通知を受け取ってから何日後に免許が停止または取り消されますか？
  choices:
    A: 5日
    B: 10日
    C: 15日
    D: 30日
  answer: C
  explanation: 警察官は免許証を没収し、15日後に免許が停止または取り消され、法的に運転できなくなることを記した通知書を交付します。
- id: 245
  category: penalties_and_points
  question: 酒気帯び運転（DWI）の初回違反に対する最大禁錮期間はどれくらいですか？
  choices:
    A: 最大30日
    B: 最大6ヶ月
    C: 最大1年
    D: 最大4年
  answer: B
  explanation: 初回のDWI違反、またはBACが0.08%以上の場合、最大6ヶ月の禁錮刑および最大500ドルの罰金が科せられる可能性があります。
- id: 246
  category: penalties_and_points
  question: ミズーリ州の「乱用・喪失法（Abuse and Lose Law）」に基づき、21歳未満で運転中にアルコールを所持または使用した場合、運転免許は何日間取り上げられる可能性がありますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 1年
  answer: C
  explanation: 21歳未満の場合、車両の運転中にアルコールや薬物を所持または使用すると、運転免許が90日間取り上げられる可能性があります。
- id: 247
  category: penalties_and_points
  question: 未成年者の飲酒・所持（MIP）の初回違反に対する運転免許の罰則は何ですか？
  choices:
    A: 15日間の免許停止
    B: 30日間の免許停止
    C: 90日間の免許停止
    D: 1年間の免許取り消し
  answer: B
  explanation: 未成年者の飲酒・所持（MIP）の初回違反の場合、30日間の運転免許停止処分となります。
- id: 248
  category: defensive_driving
  question: 走行中に突然ボンネットが開き、視界が遮られた場合はどうすべきですか？
  choices:
    A: 窓を開け、視界を遮っているものの横から周囲を確認する。
    B: 急ブレーキをかけ、その車線ですぐに停止する。
    C: 隙間から見えるようにハイビームを点灯する。
    D: 加速してボンネットを押し下げる。
  answer: A
  explanation: 突然ボンネットが開いたり、他の何かが視界を遮ったりした場合は、窓を開けて視界を遮っているものの横から周囲を確認し、ハザードランプを点灯させて道路脇に停車してください。
- id: 249
  category: defensive_driving
  question: 車のヘッドライトが消えてしまった場合、まず最初に何を試すべきですか？
  choices:
    A: 合図を出さずに、すぐに道路脇に停車する。
    B: ディマースイッチまたはヘッドライトスイッチを操作してみる。
    C: 車内のルームランプを点ける。
    D: クラクションを鳴らし続ける。
  answer: B
  explanation: 車のヘッドライトが消えてしまった場合は、ディマースイッチやヘッドライトスイッチを操作してみてください。それによって再び点灯することがあります。
- id: 250
  category: penalties_and_points
  question: 「乱用・喪失法（Abuse and Lose Law）」に基づいて取り上げられた免許を再取得するには、どのくらいの期間、保険の証明（SR-22の提出）を維持する必要がありますか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 5年
  answer: C
  explanation: 乱用・喪失法に基づき免許を再取得するには、2年間の保険証明（SR-22の提出）、45ドルの手数料の支払い、SATOPフォームの提出、および運転免許試験の全項目の再受験が必要です。
- id: 251
  category: penalties_and_points
  question: 未成年者による所持（MIP）の初回違反、または未成年者として0.02%以上の血中アルコール濃度（BAC）が検出された場合の処分は何ですか？
  choices:
    A: 30日間の免許停止
    B: 90日間の免許停止
    C: 1年間の免許取消
    D: 60日間の免許停止
  answer: A
  explanation: マニュアルによると、未成年者による所持（MIP）の初回違反、または0.02%以上の血中アルコール濃度（BAC）が検出された場合は、30日間の免許停止となります。
- id: 252
  category: penalties_and_points
  question: 若年者が3回目の未成年者による所持（MIP）違反を犯した場合、どのような罰則が科されますか？
  choices:
    A: 30日間の免許停止
    B: 90日間の免許停止
    C: 1年間の免許取消
    D: 5年間の免許取消
  answer: C
  explanation: マニュアルには、未成年者による所持（MIP）の3回目の違反は、1年間の免許取消になると記載されています。
- id: 253
  category: penalties_and_points
  question: 飲酒・薬物関連の初回違反において、保険証明（SR-22）の提出を免除されるのは誰ですか？
  choices:
    A: BACが0.04%の商用車運転者
    B: BACが0.02%以上の未成年者
    C: BACが0.08%の21歳以上の運転者
    D: 化学検査を拒否したすべての人
  answer: B
  explanation: SR-22の規則には1つの例外があります。0.02%以上の血中アルコール濃度（BAC）が検出された未成年者は、初回違反時に保険証明を提出する必要はありません。
- id: 254
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）を測定するための化学検査を拒否した場合、運転免許証はどうなりますか？
  choices:
    A: 30日間停止される。
    B: 90日間停止される。
    C: 1年間取り上げられる（取消）。
    D: 永久に剥奪される。
  answer: C
  explanation: 警察官に止められ、血中アルコール濃度（BAC）を測定するための化学検査を拒否した場合、運転免許証は1年間取り上げられます。
- id: 255
  category: vehicle_information
  question: イグニッション・インターロック装置（IID）は、車両のどの部品に接続されますか？
  choices:
    A: トランスミッション、ブレーキ、ステアリングホイール
    B: イグニッション（点火装置）、ホーン、ヘッドライト
    C: スピードメーター、ラジオ、ワイパー
    D: 排気装置、バッテリー、オルタネーター
  answer: B
  explanation: イグニッション・インターロック装置（IID）は、車両のイグニッション、ホーン、およびヘッドライトに接続される機械ユニットです。
- id: 256
  category: penalties_and_points
  question: 義務付けられた場合、免許再交付日から最低でもどのくらいの期間、イグニッション・インターロック装置（IID）を維持しなければなりませんか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 1年
    D: 2年
  answer: B
  explanation: IIDは、免許再交付日から最低6ヶ月間維持する必要があり、かつ直近3ヶ月間に違反がないことが条件となります。
- id: 257
  category: penalties_and_points
  question: 法律で義務付けられているイグニッション・インターロック装置（IID）を設置しなかった場合の初回違反の罰則は何ですか？
  choices:
    A: 30日間の免許停止
    B: 90日間の免許停止
    C: 1年間の免許取消
    D: 5年間の免許取消
  answer: C
  explanation: 法律で義務付けられているIIDを設置しなかったことで違反切符を切られ、裁判所で有罪となった場合、運転資格は1年間取り消されます。
- id: 258
  category: alcohol_drugs_health
  question: 薬物による障害が原因で「酔った状態での運転（DWI）」となった場合、アルコールによる場合と比べて罰則はどのように異なりますか？
  choices:
    A: 薬物による障害の方が罰則が軽い。
    B: 薬物による障害の方が罰則が重い。
    C: 罰則は全く同じである。
    D: 薬物による障害の場合、初回違反は警告のみとなる。
  answer: C
  explanation: ミズーリ州におけるDWIの罰則は、障害の原因が薬物であってもアルコールであっても、全く同じです。
- id: 259
  category: penalties_and_points
  question: ミズーリ州におけるDWI（酔った状態での運転）有罪判決に対する最大禁錮刑と罰金はいくらですか？
  choices:
    A: 最大30日の禁錮と100ドルの罰金
    B: 最大6ヶ月の禁錮と500ドルの罰金
    C: 最大1年の禁錮と1,000ドルの罰金
    D: 最大5年の禁錮と5,000ドルの罰金
  answer: B
  explanation: DWIで有罪判決を受けた者への処罰は、最大6ヶ月の禁錮と最大500ドルの罰金、および運転資格の喪失です。
- id: 260
  category: alcohol_drugs_health
  question: ミズーリ州における商用車運転者の違法な血中アルコール濃度（BAC）の制限値は何パーセントですか？
  choices:
    A: 0.02%以上
    B: 0.04%以上
    C: 0.06%以上
    D: 0.08%以上
  answer: B
  explanation: 血中アルコール濃度（BAC）0.08%以上での運転は違法ですが、商用車運転者の場合の制限値は0.04%です。
- id: 261
  category: alcohol_drugs_health
  question: ダイエット薬や「アッパー（興奮剤）」は、初期の短時間の覚醒効果が切れた後、ドライバーにどのような影響を与えますか？
  choices:
    A: 夜間視力と反応時間を向上させる。
    B: 神経質になり、めまいがして、集中できなくなる。
    C: ドライバーの注意持続時間を永久に延ばす。
    D: ドライバーの血中アルコール濃度（BAC）を下げる。
  answer: B
  explanation: 興奮剤（ペップピル）、「アッパー」、およびダイエット薬は、短時間はドライバーの注意力を高めることがあります。しかし、その後、神経質になったり、めまいがしたり、集中できなくなったりすることがあります。
- id: 262
  category: alcohol_drugs_health
  question: ミズーリ州において、マリファナの影響下での運転に関する記述のうち、正しいものはどれですか？
  choices:
    A: 医療用大麻カードを持っていれば合法である。
    B: アルコールと併用した場合のみ違法である。
    C: マリファナの影響下で運転することは、決して合法でも安全でもない。
    D: 血中アルコール濃度（BAC）が0.08%未満であれば合法である。
  answer: C
  explanation: 2020年にミズーリ州の有権者によって医療用大麻が承認されましたが、マリファナの影響下で運転することは、決して合法でも安全でもありません。
- id: 263
  category: alcohol_drugs_health
  question: 研究調査によると、マリファナがドライバーに与える悪影響は何ですか？
  choices:
    A: 車線のふらつきの減少
    B: 時間と距離の判断力の向上
    C: 反応時間の遅れ
    D: 運動能力の向上
  answer: C
  explanation: 研究調査により、車線のふらつきの増加、反応時間の遅れ、道路への注意力の変化など、マリファナがドライバーに与える悪影響が示されています。
- id: 264
  category: alcohol_drugs_health
  question: 物質使用障害や依存症を発症する最大の予測因子の1つは何ですか？
  choices:
    A: 有害物質の早期使用
    B: 商用車の運転
    C: 市販のアレルギー薬の服用
    D: 脳が完全に発達していること
  answer: A
  explanation: 依存症を発症する最大の予測因子の1つは、早期の使用です。若者の未発達な脳は、より早く、より深刻なダメージを受ける可能性があります。
- id: 265
  category: penalties_and_points
  question: 飲酒・薬物関連の違反について、保険加入証明（SR-22）を運転免許局（Driver License Bureau）に提出し続ける必要がある期間はどれくらいですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 5年
  answer: C
  explanation: 保険加入証明は、2年間運転免許局に提出し続ける必要があります。
- id: 266
  category: penalties_and_points
  question: ミズーリ州法によると、速度超過で違反が確定した場合、運転記録に何ポイント加算されますか？
  choices:
    A: 2ポイント
    B: 3ポイント
    C: 4ポイント
    D: 6ポイント
  answer: B
  explanation: マニュアルによると、州法違反において、速度超過の有罪判決には3ポイントが科せられます。
- id: 267
  category: penalties_and_points
  question: 12ヶ月間に合計4ポイントが累積された場合、当局（Department）はどのような措置をとりますか？
  choices:
    A: 免許を30日間停止する
    B: 免許を1年間取り消す
    C: 累積ポイント通知を送付する
    D: 運転免許試験の再受験を求める
  answer: C
  explanation: 12ヶ月間に合計4ポイントが累積された場合、当局は累積ポイント通知を送付します。
- id: 268
  category: penalties_and_points
  question: 18ヶ月間に何ポイント累積されると、運転免許が停止されますか？
  choices:
    A: 4ポイント以上
    B: 6ポイント以上
    C: 8ポイント以上
    D: 12ポイント以上
  answer: C
  explanation: 18ヶ月間に合計8ポイント以上累積されると、運転免許が停止されます。
- id: 269
  category: penalties_and_points
  question: 18ヶ月間に8ポイント累積された場合、最初の免許停止期間はどれくらいですか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 120日間
  answer: A
  explanation: 18ヶ月間に8ポイント累積された場合の処分として、最初の停止期間は30日間となります。
- id: 270
  category: penalties_and_points
  question: 次の累積ポイントのうち、運転免許が1年間取り消されるのはどれですか？
  choices:
    A: 12ヶ月間に8ポイント以上
    B: 12ヶ月間に12ポイント以上
    C: 24ヶ月間に12ポイント以上
    D: 36ヶ月間に18ポイント以上
  answer: B
  explanation: 12ヶ月間に12ポイント以上、24ヶ月間に18ポイント以上、または36ヶ月間に24ポイント以上累積された場合、運転免許は1年間取り消されます。
- id: 271
  category: penalties_and_points
  question: アルコールに関連しない点数による免許停止の後、運転資格を回復するには何をしなければなりませんか？
  choices:
    A: 50ドルの手数料を支払い、筆記試験を再受験する
    B: 保険の証明（SR-22）を提出し、20ドルの再交付手数料を支払う
    C: 安全運転講習（defensive driving course）を修了し、20ドルの手数料を支払う
    D: 保険の証明（SR-22）を提出し、45ドルの再交付手数料を支払う
  answer: B
  explanation: アルコールに関連しない点数による免許停止または取り消しの場合、保険の証明（SR-22）を提出し、20ドルの再交付手数料を支払う必要があります。
- id: 272
  category: penalties_and_points
  question: 運転資格が回復した後、点数は4点に減らされます。その後、新たな点数を受けることなく1年間運転した場合、残りの点数はどのように減らされますか？
  choices:
    A: 0点になる
    B: 2分の1に減らされる
    C: 3分の1に減らされる
    D: 2点減らされる
  answer: C
  explanation: 新たな点数を受けることなく1年間運転した後、記録に残っている点数は3分の1減らされます。
- id: 273
  category: penalties_and_points
  question: 免許停止中に運転して有罪判決を受けた場合、どのような結果になる可能性がありますか？
  choices:
    A: 運転資格が1年間取り消される可能性がある
    B: 記録に4点の点数が加算される
    C: 車両が永久に没収される
    D: 重罪（felony）で有罪となる
  answer: A
  explanation: 免許停止中に運転した場合、有罪判決後、運転資格が1年間取り消される可能性があります。
- id: 274
  category: penalties_and_points
  question: 交通違反で出廷しなかった場合、裁判所が運転免許局（DLB）に通知する前に、罰金を支払うために与えられる期間は何日間ですか？
  choices:
    A: 10日間
    B: 15日間
    C: 30日間
    D: 60日間
  answer: C
  explanation: 交通違反で出廷しなかった場合、裁判所は運転免許局（DLB）に通知する前に、罰金を支払うための30日間の猶予を与えます。
- id: 275
  category: vehicle_information
  question: 車両を購入した後、罰金の支払いを避けるために、何日以内にタイトルの申請を行う必要がありますか？
  choices:
    A: 10日間
    B: 15日間
    C: 30日間
    D: 60日間
  answer: C
  explanation: 車両を購入した際は、30日以内にタイトルの申請をしなければなりません。30日以内に申請しない場合は、罰金を支払う必要があります。
- id: 276
  category: vehicle_information
  question: ミズーリ州のドライバーズマニュアルでは、車両のタイトル（所有権証明書）をどこに保管することを推奨していますか？
  choices:
    A: 車両のグローブボックスの中
    B: 運転席の下
    C: 車両のトランクの中
    D: 車内には保管しない
  answer: D
  explanation: タイトルは非常に重要な個人書類です。マニュアルには「タイトルを車内に保管してはいけません」と明記されています。
- id: 277
  category: vehicle_information
  question: ミズーリ州で新車を購入する際、その車両が一度も登録されていないことを示すためにディーラーから渡される書類は何ですか？
  choices:
    A: 製造者原産地証明書（MSO）
    B: ID/OD確認フォーム
    C: サルベージタイトル
    D: 売買証書（bill of sale）のみ
  answer: A
  explanation: ミズーリ州で購入された新車の場合、ディーラーはタイトル申請書と、その車両が新車で未登録であることを示す製造者原産地証明書（MSO）を渡します。
- id: 278
  category: vehicle_information
  question: 車両の売買において、適切な走行距離計の開示が必要なのはどの車両ですか？
  choices:
    A: 年式に関わらずすべての車両
    B: 2011年式以降の車両で、車齢が20年に達するまで
    C: 2011年より前に製造された車両のみ
    D: 車齢が20年を超える車両
  answer: B
  explanation: 車両を売買する際、モデル年式が2011年以降で、かつ車齢が20年未満の場合、売主はタイトルの譲渡欄に走行距離を記入しなければなりません。
- id: 279
  category: vehicle_information
  question: 中古車を購入し、譲渡されたタイトルが他州のタイトルであった場合、何を取得しなければなりませんか？
  choices:
    A: 新しい製造者原産地証明書（MSO）
    B: 識別番号および走行距離（ID/OD）確認フォーム
    C: ミズーリ州のサルベージタイトル
    D: ハイウェイパトロールからの特別許可証
  answer: B
  explanation: 譲渡されたタイトルが他州のものである場合、認可された検査ステーションで識別番号および走行距離（ID/OD）確認フォームを作成してもらう必要があります。
- id: 280
  category: penalties_and_points
  question: 虚偽の申告によって運転免許証を取得した場合、運転記録に何点の点数が加算されますか？
  choices:
    A: 3点
    B: 4点
    C: 8点
    D: 12点
  answer: D
  explanation: マニュアルの点数表によると、虚偽の申告による運転免許証の取得は12点の加算となります。
- id: 281
  category: vehicle_information
  question: ミズーリ州における乗用車の登録手数料は何に基づいていますか？
  choices:
    A: 車両の総重量
    B: 車両の課税対象馬力
    C: 車両の年式
    D: 車両のゾーンと総重量
  answer: B
  explanation: 乗用車を登録する場合、登録手数料は車両の課税対象馬力に基づいて決定されます。
- id: 282
  category: vehicle_information
  question: 偶数年に車両の2年間登録を行うことができるのは、どのような条件の場合ですか？
  choices:
    A: 違反歴がない場合
    B: 車両のモデル年式が奇数の場合
    C: 車両のモデル年式が偶数の場合
    D: 手数料を2倍支払う場合
  answer: C
  explanation: 2018年などの偶数年には、車両のモデル年式が偶数であれば、2年間の登録を行うことができます。
- id: 283
  category: vehicle_information
  question: 車両登録を更新する際、現在の安全点検および/または排ガス検査の証明書は、過去何日以内に完了したものである必要がありますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 120日
  answer: B
  explanation: 該当する場合、過去60日以内に実施された最新の安全点検および/または排ガス検査の証明書を提出する必要があります。
- id: 284
  category: driver_responsibility
  question: 売却通知書（フォーム5049）を提出して自動車の売却を報告するには、何日間の猶予がありますか？
  choices:
    A: 10日
    B: 15日
    C: 30日
    D: 60日
  answer: C
  explanation: 州法により、自動車または全地形対応車（ATV）を売却した場合は、30日以内に売却通知書（フォーム5049）に記入し、免許事務局またはフォームに記載された住所に提出して報告することが義務付けられています。
- id: 285
  category: vehicle_information
  question: 公証された宣誓供述書に署名した場合、盗難に遭ったナンバープレートとタブを、年間何回まで無料（事務手数料を除く）で交換できますか？
  choices:
    A: 1回
    B: 2回
    C: 3回
    D: 無制限
  answer: B
  explanation: 州法により、プレートまたはタブが盗まれたことを証明する公証済みの宣誓供述書に署名した場合、年間2回まで無料（9.00ドルの事務手数料がかかります）で盗難されたナンバープレートとタブを交換することが認められています。
- id: 286
  category: driver_responsibility
  question: 州法で義務付けられている、1回の事故あたりの物損に対する賠償責任保険の最低補償額はいくらですか？
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: 州法で義務付けられている最低補償額には、1回の事故あたりの物損（Property Damage）に対する25,000ドルが含まれています。
- id: 287
  category: driver_responsibility
  question: 1人あたりの対人賠償責任保険の最低必要補償額はいくらですか？
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $75,000
  answer: B
  explanation: 州法で義務付けられている最低補償額には、1人あたりの対人賠償（Bodily Injury）に対する25,000ドルが含まれています。
- id: 288
  category: driver_responsibility
  question: 車両を登録する際、保険の証明として認められる方法は次のうちどれですか？
  choices:
    A: 保険代理店による口頭での説明
    B: 保険証券を表示した携帯型電子機器
    C: 車両タイトルのコピー
    D: 保険料の支払いが記載された銀行の明細書
  answer: B
  explanation: 保険の証明として認められる方法には、携帯型電子機器、IDカードの原本、保険証券または仮受証、あるいは保険料の領収書が含まれます。
- id: 289
  category: driver_responsibility
  question: ミズーリ州で自己保険（Self-insured）の資格を得るには、何台以上の車両を所有している必要がありますか？
  choices:
    A: 5台
    B: 10台
    C: 25台
    D: 50台
  answer: C
  explanation: 自己保険の資格を得るには、25台を超える車両を所有し、かつ自社の車両によって引き起こされた損害を支払う能力があることを証明できなければなりません。
- id: 290
  category: penalties_and_points
  question: 保険の維持を怠ったために運転免許証とナンバープレートが停止された場合、保険に加入していることを証明するためにどの書類を提出する必要がありますか？
  choices:
    A: フォーム 5049
    B: SR-22
    C: フォーム 1099
    D: SR-10
  answer: B
  explanation: 保険の証明を提出する最も一般的な方法は、SR-22保険証明書の提出です。SR-22フォームを提出するには、保険会社または代理店に連絡してください。
- id: 291
  category: penalties_and_points
  question: 2年以内に2回目の保険未加入による免許停止処分を受けた場合の罰則は何ですか？
  choices:
    A: 30日間の停止と100ドルの手数料
    B: 90日間の停止と200ドルの手数料
    C: 6ヶ月の停止と300ドルの手数料
    D: 1年間の停止と400ドルの手数料
  answer: B
  explanation: 2年以内に2回の停止処分を受けた場合、運転免許証および/またはナンバープレートが90日間停止されます。また、200ドルの手数料を支払い、3年間の保険証明を提出する必要があります。
- id: 292
  category: penalties_and_points
  question: 保険未加入による3回目の免許停止後、免許を再交付するために支払う必要がある手数料はいくらですか？
  choices:
    A: $20
    B: $100
    C: $200
    D: $400
  answer: D
  explanation: 3回（またはそれ以上）の停止処分の場合、運転免許証および/またはナンバープレートは1年間停止されます。また、400ドルの手数料を支払い、3年間の保険証明を提出する必要があります。
- id: 293
  category: penalties_and_points
  question: 事故で自分に過失があり、引き起こした損害の支払いをしない場合、どうなりますか？
  choices:
    A: 車両が30日間押収される。
    B: 運転免許証および/または車両のナンバープレートが1年間停止される。
    C: 運転免許試験の再受験が求められる。
    D: 財務省（Department of Revenue）から警告状が届く。
  answer: B
  explanation: 事故で自分に過失があり、引き起こした損害の支払いをしない場合、運転免許証および/または車両のナンバープレートが1年間停止されます。
- id: 294
  category: driver_responsibility
  question: 州法では、1回の事故につき、対人賠償としていくらの無保険車傷害保険に加入することが義務付けられていますか？
  choices:
    A: $25,000
    B: $50,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: 法律では、1人あたり25,000ドルの身体傷害、および1回の事故あたり50,000ドルの身体傷害に対する無保険車傷害保険への加入も義務付けられています。
- id: 295
  category: vehicle_information
  question: 郵送で車両登録更新通知が届かない場合、どうする必要がありますか？
  choices:
    A: 更新する前に通知が届くまで待つ。
    B: 当局から連絡があるまで、更新せずに合法的に運転する。
    C: 法律により、有効期限が切れる前にナンバープレートを更新することが義務付けられている。
    D: 完全に新しい所有権（タイトル）と登録を申請する。
  answer: C
  explanation: 通知が届かない場合でも、法律により、有効期限が切れる前にナンバープレートを更新することが義務付けられています。
- id: 296
  category: penalties_and_points
  question: 2年以内に2回の運転免許停止処分を受けた場合の罰則は何ですか？
  choices:
    A: 免許が30日間停止され、100ドルの手数料を支払わなければならない。
    B: 免許が90日間停止され、200ドルの手数料を支払わなければならない。
    C: 免許が1年間停止され、400ドルの手数料を支払わなければならない。
    D: 免許が永久に剥奪される。
  answer: B
  explanation: マニュアルによると、2年以内に2回の停止処分を受けた場合、運転免許証および/またはナンバープレートが90日間停止され、200ドルの手数料を支払い、3年間の保険証明を提出する必要があります。
- id: 297
  category: penalties_and_points
  question: 3回以上の停止処分が累積した場合、運転免許証および/またはナンバープレートはどのくらいの期間停止されますか？
  choices:
    A: 90日間
    B: 6ヶ月
    C: 1年間
    D: 3年間
  answer: C
  explanation: マニュアルには、3回（またはそれ以上）の停止処分の場合、運転免許証および/またはナンバープレートは1年間停止され、400ドルの手数料を支払う必要があると記載されています。
- id: 298
  category: driver_responsibility
  question: 駐車中の車両と交通事故を起こした場合、どうすべきですか？
  choices:
    A: 自分の車に目に見える損傷がなければ、すぐに立ち去る。
    B: フロントガラスにメモを残し、報告せずに立ち去る。
    C: 交通事故の現場を立ち去ることは犯罪であるため、その場を離れてはならない。
    D: 10分間待ち、所有者が現れなければ立ち去る。
  answer: C
  explanation: マニュアルには明示的に次のように記載されています。「駐車中の車両と事故を起こした場合でも、その場を離れてはいけません。交通事故の現場を立ち去ることは犯罪です。」
- id: 299
  category: safe_driving_rules
  question: ミズーリ州の「ムーブ・イット（Move It）」法に基づき、軽微な負傷者のいない交通事故を起こした場合、何をすることが義務付けられていますか？
  choices:
    A: 警察が到着するまで、車両をそのままの場所に置いておく。
    B: 車両を路肩やその他の道路外の近くの場所に移動させる。
    C: レッカー車が車両を移動させるのを待つ。
    D: 直ちに最寄りの警察署まで運転していく。
  answer: B
  explanation: 州法により、大規模な玉突き事故や交通渋滞を防ぐため、軽微な負傷者のいない事故に関与した車両は、道路から路肩やその他の近くの場所に移動することが義務付けられています。
- id: 300
  category: defensive_driving
  question: ミズーリ州の運転マニュアルによると、ミズーリ州における死亡事故の何パーセントが二次事故によるものですか？
  choices:
    A: 10パーセント
    B: 18パーセント
    C: 25パーセント
    D: 30パーセント
  answer: B
  explanation: 「ムーブ・イット（Move It）」法は、ドライバーが二次事故に巻き込まれる可能性を減らすのに役立ちます。二次事故はミズーリ州における死亡事故の18パーセントを占めています。
- id: 301
  category: driver_responsibility
  question: 財務局（Department of Revenue）に事故報告書を提出する必要がある場合、何日以内に提出しなければなりませんか？
  choices:
    A: 10日
    B: 15日
    C: 30日
    D: 60日
  answer: C
  explanation: 特定の状況下では、州法により30日以内に事故報告書を提出することが義務付けられています。
- id: 302
  category: driver_responsibility
  question: 関係者の誰かが賠償責任保険に加入しておらず、かつ物損額がいくらを超える場合、運転免許局（Driver License Bureau）に事故を報告しなければなりませんか？
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: 関係者の誰かが賠償責任保険に加入しておらず、かつ1人以上の財産損害が500ドルを超える場合、または人身傷害や死亡が発生した場合には、事故を報告しなければなりません。
- id: 303
  category: penalties_and_points
  question: 指定された建設、作業、または緊急ゾーン内で、道路作業員や緊急対応要員に衝突した場合、運転資格はどうなる可能性がありますか？
  choices:
