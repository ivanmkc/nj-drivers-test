metadata:
  source: 2025 Missouri Driver Guide (dor.mo.gov)
  total_questions: 410
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalities_and_points
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_testing
  question: How many questions must you answer correctly to pass the Missouri written
    driving test?
  choices:
    A: '15'
    B: '18'
    C: '20'
    D: '25'
  answer: C
  explanation: According to the manual, you must correctly answer 20 out of 25 multiple-choice
    questions to pass the written test.
- id: 2
  category: license_system
  question: Which of the following individuals is NOT required to have a Missouri
    driver license to drive in Missouri?
  choices:
    A: A new resident of Missouri who has an out-of-state license.
    B: A full-time student with a valid driver license from their home state.
    C: A 16-year-old Missouri resident who plans to drive.
    D: An out-of-state commercial driver who moved to Missouri 20 days ago.
  answer: B
  explanation: The manual states that you do not need a Missouri driver license if
    you are a full-time student and have a valid driver license from your home state.
- id: 3
  category: license_system
  question: What is the minimum eligible age to obtain a standard Instruction Permit
    in Missouri?
  choices:
    A: '14'
    B: '15'
    C: 15 and a half
    D: '16'
  answer: B
  explanation: The eligible age for an Instruction Permit, which is the first step
    in Missouri's Graduated Driver License Program, is 15.
- id: 4
  category: license_system
  question: What must you do with the driver examination record issued by the Missouri
    State Highway Patrol?
  choices:
    A: Keep it in your glove box as a valid temporary permit.
    B: Mail it to the Department of Revenue within 30 days.
    C: Take it to a local license office to apply for the actual permit or license.
    D: Present it to a licensed adult before beginning driving practice.
  answer: C
  explanation: The driver examination record is not valid as a permit or license.
    You must take your copy of the record and other required documents to your local
    license office to apply for the actual permit or license.
- id: 5
  category: license_system
  question: When does the required six-month permit period for an intermediate license
    officially begin?
  choices:
    A: On your 15th birthday.
    B: When you pass the written examination.
    C: When the Missouri State Highway Patrol issues your examination record.
    D: Upon the issuance of the temporary instruction permit at the license office.
  answer: D
  explanation: The manual explicitly states that the six-month permit period required
    for an intermediate license does not start until the issuance of the temporary
    instruction permit.
- id: 6
  category: license_system
  question: At what age can you apply for a Motorcycle Instruction Permit WITHOUT
    being required to complete an approved motorcycle rider training course?
  choices:
    A: '15'
    B: 15 and a half
    C: '16'
    D: '18'
  answer: C
  explanation: If you are 16 years old or older, you may apply for a motorcycle instruction
    permit, and the motorcycle rider training course is not required.
- id: 7
  category: license_system
  question: Which of the following is a restriction for a 15½-year-old holding a Motorcycle
    Instruction Permit?
  choices:
    A: They can only drive within a 100-mile radius of home.
    B: They are allowed to carry one passenger.
    C: They can only operate a motorcycle of no larger than 250 cc.
    D: They are permitted to drive at night if accompanied by an adult.
  answer: C
  explanation: For a 15½-year-old, the permit allows daylight driving only, within
    a 50-mile radius of home, a motorcycle of no larger than 250 cc, and no passengers.
- id: 8
  category: license_system
  question: What class of license is the basic driver license, also known as an operator
    license, for drivers 18 and older?
  choices:
    A: Class A
    B: Class E
    C: Class F
    D: Class M
  answer: C
  explanation: The Full Driver License (Class F) is the basic driver license, also
    called an operator license, and the eligible age is 18.
- id: 9
  category: driver_testing
  question: If you already have a Class F license, what test is NOT required when
    applying for a For-Hire License (Class E)?
  choices:
    A: Vision test
    B: Road sign test
    C: Written exam
    D: Driving test
  answer: D
  explanation: When testing for a Class E license, if you already have a Class F license,
    a driving test is not required.
- id: 10
  category: license_system
  question: Which of the following documents is NOT explicitly listed as required
    verification when obtaining a new license or permit?
  choices:
    A: Verification of lawful status
    B: Social security number
    C: Proof of high school enrollment
    D: Missouri residency
  answer: C
  explanation: Anyone obtaining a new license or permit is required to show verification
    of lawful status, identity (full legal name), social security number, and Missouri
    residency. Proof of high school enrollment is not listed.
- id: 11
  category: driver_testing
  question: How many multiple-choice questions are on the Missouri written driving
    test?
  choices:
    A: '20'
    B: '25'
    C: '30'
    D: '50'
  answer: B
  explanation: To test your knowledge of traffic laws, you will need to take a written
    test of 25 multiple-choice questions.
- id: 12
  category: license_system
  question: What is the minimum eligible age to obtain a For-Hire License (Class E)?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: C
  explanation: The eligible age for a For-Hire License (Class E) is 18.
- id: 13
  category: license_system
  question: 'If you are under 21 years of age, your permit or license will:'
  choices:
    A: Be valid for only six months.
    B: Identify you as a minor.
    C: Require you to drive only during daylight hours.
    D: Prohibit you from driving on the highway.
  answer: B
  explanation: The manual states that if you are under 21 years of age, you will be
    issued a permit or license identifying you as a minor.
- id: 14
  category: license_system
  question: Under what condition may a person operate a farm tractor on a highway
    without a Missouri driver license?
  choices:
    A: If they are at least 14 years old.
    B: If they are operating it for agri-related purposes.
    C: If they stay within a 50-mile radius of their farm.
    D: If they have a valid instruction permit.
  answer: B
  explanation: You do not need a Missouri driver license if you operate or temporarily
    operate or move any farm tractor or implement on a highway for agri-related purposes.
- id: 15
  category: license_system
  question: What is the eligible age to apply for a Class E license in Missouri?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: According to the manual, the eligible age for a Class E license is
    18.
- id: 16
  category: license_system
  question: Which of the following individuals is NOT required to obtain a for-hire
    (Class E) license?
  choices:
    A: A driver transporting 14 or fewer passengers for a day care center.
    B: A florist delivery driver transporting property for pay.
    C: An individual providing prepared food delivery services for a fast food restaurant.
    D: A driver operating an employer's freight vehicle weighing 20,000 pounds.
  answer: C
  explanation: Individuals providing prepared food delivery services for entities
    such as a fast food restaurant or delicatessen are not required to obtain a Class
    E license.
- id: 17
  category: driver_testing
  question: What tests must you pass to obtain a Class M license or permit?
  choices:
    A: Only a motorcycle skills test.
    B: Class F and Class M written, vision, road sign, and motorcycle skills tests.
    C: Class M written and vision tests only.
    D: A driving skills test in a standard passenger vehicle.
  answer: B
  explanation: To obtain a Class M license, you will need to pass the Class F and
    Class M written, vision, road sign, and motorcycle skills tests.
- id: 18
  category: license_system
  question: What type of license is required to operate a motorized bicycle on public
    roadways?
  choices:
    A: A Class M motorcycle endorsement.
    B: A Class E for-hire license.
    C: A valid operator's (or higher classification) license.
    D: A Commercial Driver License.
  answer: C
  explanation: A driver operating a motorized bicycle is not required to obtain a
    motorcycle endorsement, however he or she must hold a valid operator’s (or higher
    classification) license.
- id: 19
  category: license_system
  question: How old must you be to obtain a Commercial Driver License (CDL) with a
    Hazardous Materials or School Bus endorsement?
  choices:
    A: 16 years old
    B: 18 years old
    C: 21 years old
    D: 25 years old
  answer: C
  explanation: You must be at least 21 years old to obtain a CDL with a Hazardous
    Materials or School Bus endorsement.
- id: 20
  category: license_system
  question: When does a standard photo nondriver ID (Class ND) generally expire?
  choices:
    A: On your date of birth in the third year after you apply.
    B: On your date of birth in the sixth year after you apply.
    C: It never expires.
    D: Ten years from the date of issuance.
  answer: B
  explanation: Your nondriver ID expires on your date of birth in the sixth year after
    you apply.
- id: 21
  category: license_system
  question: If you are age 70 or older applying for a non-REAL ID compliant nondriver
    ID, how long is the card valid?
  choices:
    A: 3 years
    B: 6 years
    C: It is issued as non-expiring.
    D: 10 years
  answer: C
  explanation: If you are age 70 or older, your nondriver ID will be issued as non-expiring,
    unless applying for a REAL ID-compliant card.
- id: 22
  category: driver_testing
  question: What tests are required if you are transferring an out-of-state driver
    license to Missouri?
  choices:
    A: The four-part driver examination.
    B: Only the driving skills test.
    C: The vision and road sign tests.
    D: No tests are required.
  answer: C
  explanation: If you are transferring your out-of-state driver license, you must
    surrender the license from your previous state of residence, and take the vision
    and road sign tests.
- id: 23
  category: driver_testing
  question: 'You must take the four-part driver examination if your Missouri driver
    license has been expired for more than:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months (184 days)
    D: 1 year (365 days)
  answer: C
  explanation: You must take the four-part driver examination if your Missouri driver
    license has been expired for more than six months (184 days).
- id: 24
  category: license_system
  question: Which of the following is NOT an acceptable document to prove lawful status
    for a driver's license?
  choices:
    A: A valid, unexpired U.S. passport.
    B: A hospital birth certificate.
    C: A U.S. Certificate of Citizenship.
    D: A certified U.S. Birth Certificate issued by a vital records agency.
  answer: B
  explanation: Hospital birth certificates and birth registration cards are not acceptable
    as proof of lawful status.
- id: 25
  category: license_system
  question: Applicants age 65 and older renewing a non REAL ID-compliant non-commercial
    license may be exempt from presenting which type of document?
  choices:
    A: Documents for place of birth.
    B: Proof of Missouri residency.
    C: Proof of Social Security Number.
    D: Proof of identity.
  answer: A
  explanation: If you are renewing a non REAL ID-compliant non-commercial permit or
    driver license or nondriver ID and are age 65 or older you may be exempt from
    presenting documents for place of birth.
- id: 26
  category: license_system
  question: Documents used to verify your identity must contain which two pieces of
    information?
  choices:
    A: Your full legal name and social security number.
    B: Your full legal name and date of birth.
    C: Your date of birth and residential address.
    D: Your signature and photograph.
  answer: B
  explanation: Documents used for verify identity must contain your full legal name
    and date of birth.
- id: 27
  category: license_system
  question: How many documents verifying Missouri residency are required to obtain
    a REAL ID-compliant document?
  choices:
    A: One document
    B: Two documents
    C: Three documents
    D: Four documents
  answer: B
  explanation: To obtain a REAL ID-compliant document, you must provide two documents
    verifying Missouri residency.
- id: 28
  category: license_system
  question: Which of the following is NOT acceptable to use as a residential address
    when applying for a Missouri license?
  choices:
    A: A Post Office Box.
    B: The location where a person is physically present and regards as home.
    C: A true, fixed, principal home.
    D: A permanent home to which a person intends to return.
  answer: A
  explanation: A Post Office Box is not acceptable as a residential address. You need
    to show proof of residential address and alternate mailing address (if applicable).
- id: 29
  category: license_system
  question: If an applicant under the age of 21 cannot provide an acceptable document
    for verification of a Missouri residential address, what is an acceptable alternative?
  choices:
    A: They can use a friend's utility bill.
    B: A parent or legal guardian may provide a document on their behalf.
    C: They are exempt from providing proof of residency.
    D: They must wait until they are 21 to apply.
  answer: B
  explanation: If you are under the age of 21, and cannot provide an acceptable document
    from the list for verification of a Missouri residential address, a parent or
    legal guardian may provide such a document on your behalf.
- id: 30
  category: license_system
  question: Which of the following documents is NOT acceptable to provide your Social
    Security Number for a Missouri license application?
  choices:
    A: A W-2 Wage and Tax Statement
    B: A laminated Social Security Card
    C: A 1099 Form
    D: A paystub with your name and Social Security Number
  answer: B
  explanation: The manual states that the Social Security Card must be original, signed,
    and not laminated.
- id: 31
  category: license_system
  question: If you need to change your first or middle name on your driver license,
    which document must you present?
  choices:
    A: An amended birth certificate
    B: A certified marriage license
    C: A certified court order
    D: A certified divorce decree
  answer: C
  explanation: According to the manual, a certified court order is required for a
    first name change or a middle name change.
- id: 32
  category: license_system
  question: How long is a Missouri Instruction Permit valid for?
  choices:
    A: 0 to 6 months
    B: 0 to 12 months
    C: Length of an approved course
    D: 1 year nonrenewable
  answer: B
  explanation: The manual's permit fee chart indicates that an Instruction Permit
    is valid for 0-12 months.
- id: 33
  category: penalties_and_points
  question: What is a potential penalty for disobeying the driving restrictions placed
    on your license?
  choices:
    A: You will be required to retake the written test
    B: You can be charged with driving without a license
    C: Your vehicle will be immediately impounded
    D: You will receive a warning letter
  answer: B
  explanation: 'The manual states: ''If you disobey the restriction(s), you can be
    charged with driving without a license, and if convicted, points will be placed
    on your driving record.'''
- id: 34
  category: license_system
  question: What does restriction code 'C' indicate on a Missouri driver license?
  choices:
    A: Corrective Lenses
    B: Restricted to 45 MPH
    C: Daylight Driving Only
    D: Intermediate License
  answer: C
  explanation: According to the Restriction Codes chart in the manual, code 'C' stands
    for Daylight Driving Only.
- id: 35
  category: alcohol_drugs_health
  question: You must submit a physician's statement to the Department of Revenue if
    you have had epileptic seizures, convulsions, or blackouts within what time frame
    prior to your license application?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 2 years
  answer: B
  explanation: A medical referral is required if you have had epileptic seizures,
    convulsions, or blackouts within the six months prior to your application for
    a license.
- id: 36
  category: alcohol_drugs_health
  question: If a physician or law enforcement officer believes you have a medical
    condition that makes you an unsafe driver, what form must they submit to the Department?
  choices:
    A: Medical Variance Form
    B: Uncoded Restriction Form
    C: Driver Condition Report (Form 4319)
    D: Form 1099
  answer: C
  explanation: The manual states that authorized individuals who believe you have
    a medical condition making you an unsafe driver must complete a Driver Condition
    Report (Form 4319) and submit it to the Department.
- id: 37
  category: license_system
  question: What is the minimum age to be issued a School Bus (S) endorsement in Missouri?
  choices:
    A: '18'
    B: '21'
    C: '25'
    D: '75'
  answer: B
  explanation: The manual specifies that a school bus endorsement may be issued to
    drivers age 21 or older who hold a Class E license or a commercial license with
    a Passenger (P) endorsement.
- id: 38
  category: penalties_and_points
  question: How long will a school bus endorsement be suspended if the driver fails
    to pass a drug, alcohol, or chemical test?
  choices:
    A: 6 months
    B: 1 year
    C: 3 years
    D: Permanently
  answer: B
  explanation: A school bus endorsement can be suspended for one year if a person
    fails to pass any drug, alcohol, or chemical test administered in accordance with
    federal or state law.
- id: 39
  category: driver_testing
  question: What tests are required to add a motorcycle (M) endorsement to an existing
    license?
  choices:
    A: Written test and skills test only
    B: Vision and skills test only
    C: Written test and road sign test only
    D: Written test, vision, road sign, and a skills test
  answer: D
  explanation: To add the motorcycle endorsement to an existing license, you will
    need to pass the motorcycle written test, vision, road sign, and a skills test
    on a motorcycle or motortricycle.
- id: 40
  category: license_system
  question: How early can you renew your Missouri driver license before it expires?
  choices:
    A: Up to 30 days
    B: Up to 3 months
    C: Up to 6 months
    D: Up to 1 year
  answer: C
  explanation: 'The manual states: ''You can renew your license up to six months before
    it expires.'''
- id: 41
  category: driver_testing
  question: Which tests are you required to take each time you renew your driver license?
  choices:
    A: Written and driving tests
    B: Vision and road sign tests
    C: Vision and written tests
    D: Driving and road sign tests
  answer: B
  explanation: According to the renewal reminders section, 'Each time you renew, you
    will be required to take the vision and road sign test.'
- id: 42
  category: license_system
  question: Under what circumstance may you request an early renewal of your driver
    license beyond the standard 6-month renewal period?
  choices:
    A: If you are turning 21 years old
    B: If you are leaving the state or country for an extended time
    C: If you are purchasing a new vehicle
    D: If you have lost your renewal reminder
  answer: B
  explanation: 'The manual provides an exception: ''If you will be leaving the state
    or country for an extended time you may request an early renewal of your driver
    license at your local license office.'''
- id: 43
  category: license_system
  question: What is the cost of a Nondriver ID Card for voting purposes only for an
    applicant who is 17½ years old?
  choices:
    A: $0.00
    B: $14.00
    C: $16.50
    D: $24.00
  answer: A
  explanation: The license fee chart lists the cost of a Nondriver ID Card (Voting
    Purposes Only) for a minimum age of 17½ as $0.00.
- id: 44
  category: driver_testing
  question: If you fail to renew your driver license within six months (184 days)
    after its expiration date, what additional tests must you take?
  choices:
    A: Only the vision test
    B: Only the road sign test
    C: The written and driving tests
    D: A chemical test
  answer: C
  explanation: If you do not renew your license within six months (or 184 days) after
    its expiration date, you will have to take the written and driving tests, in addition
    to the vision and road sign tests.
- id: 45
  category: license_system
  question: How long does a member of the armed forces have to renew an expired out-of-state
    license without re-examination after an honorable discharge?
  choices:
    A: Up to 30 days
    B: Up to 90 days
    C: Up to six months
    D: Up to one year
  answer: C
  explanation: Missouri allows a renewal without re-examination for members of the
    armed forces whose license has expired while out of state, for up to six months
    from honorable discharge or within 90 days of reestablishing residency.
- id: 46
  category: license_system
  question: What is a time-saving option if your license is lost or stolen and it
    expires within the next six months?
  choices:
    A: Drive without a license until it expires
    B: Renew your license early rather than obtaining a duplicate
    C: Request a temporary 30-day permit
    D: Wait until the expiration date to apply for a new one
  answer: B
  explanation: If your license is lost, stolen, or destroyed and expires within the
    next six months, you may renew your license early rather than obtain a duplicate
    license to save time and money.
- id: 47
  category: license_system
  question: Can you renew your non-commercial driver license while your driving privilege
    is suspended?
  choices:
    A: No, you must wait until the suspension is lifted
    B: Yes, but only if you retake the driving test
    C: Yes, you may take the vision and road sign tests and renew it
    D: No, suspended licenses are permanently canceled
  answer: C
  explanation: If you held a non-commercial driver license, you may take the vision
    and road sign tests and renew your license even while your driving privilege is
    suspended.
- id: 48
  category: license_system
  question: What symbol appears on the front of your driver license if you authorize
    an Organ Donor indicator?
  choices:
    A: A blue ribbon
    B: A red heart with a green banner
    C: A green cross
    D: A red medical alert badge
  answer: B
  explanation: If you say 'yes' to add the organ donor symbol, a red heart with a
    green banner will appear on the front of your instruction permit, driver license,
    or nondriver ID.
- id: 49
  category: license_system
  question: What is the fee to place the organ donor symbol on your driver license
    or to be added to the registry?
  choices:
    A: $1
    B: $5
    C: $10
    D: There is no fee
  answer: D
  explanation: 'The manual explicitly states: ''There is no fee to place the symbol
    on your instruction permit, driver license or nondriver ID, or place your name
    in the registry.'''
- id: 50
  category: license_system
  question: When applying for a driver license, the clerk is required to ask if you
    would like to make a monetary donation to which of the following funds?
  choices:
    A: The highway maintenance fund
    B: The organ donor fund or the blindness awareness fund
    C: The public schools fund
    D: The veterans assistance fund
  answer: B
  explanation: When you apply for a driver license, permit or nondriver ID the clerk
    must ask you if you would like to make a monetary donation to the organ donor
    fund or the blindness awareness fund.
- id: 51
  category: license_system
  question: What does the 'DHH' notation on a Missouri driver license indicate to
    emergency personnel?
  choices:
    A: The driver is a Designated Highway Helper
    B: The driver has a Department of Health and Hospitals clearance
    C: The driver is deaf or hard of hearing
    D: The driver has a dual-heavy hauling endorsement
  answer: C
  explanation: The 'DHH' notation allows law enforcement or emergency and medical
    personnel to readily determine if you are deaf or hard of hearing in the event
    of an emergency.
- id: 52
  category: license_system
  question: What is the additional cost when initially adding a boater safety indicator
    to your driver license?
  choices:
    A: There is no additional cost
    B: $1
    C: $5
    D: $10
  answer: B
  explanation: There will be an additional cost of $1 added to standard processing
    fees when the boater identification indicator is initially added to a driver license
    or nondriver ID document.
- id: 53
  category: license_system
  question: What is required to have a permanent disability indicator placed on your
    driver license?
  choices:
    A: A verbal request at the license office
    B: A Physicians Statement (Form 5294) signed by an authorized healthcare practitioner
    C: Proof of receiving social security disability benefits
    D: A $5 processing fee
  answer: B
  explanation: To be eligible for the permanent disability indicator, you must submit
    a Physicians Statement (Form 5294) - Permanent Disability Indicator completed
    and signed by your physician, physical therapist, occupational therapist, or other
    authorized healthcare practitioner.
- id: 54
  category: driver_responsibility
  question: What happens if you do not receive a reminder to renew your driver license?
  choices:
    A: Your license expiration date is automatically extended by 30 days
    B: You are exempt from taking the vision test upon renewal
    C: It is still your responsibility to renew it, and you can be ticketed for driving
      without a valid license
    D: You must wait until the reminder arrives to renew your license
  answer: C
  explanation: It is your responsibility to renew your driver license, even if you
    do not receive your reminder. You can be ticketed for driving without a valid
    license.
- id: 55
  category: license_system
  question: Is there an additional fee to add a medical alert notation to your Missouri
    driver license?
  choices:
    A: Yes, there is a $5 fee.
    B: Yes, there is a $10 fee.
    C: No, there is no additional cost.
    D: Yes, but only for certain medical conditions.
  answer: C
  explanation: According to the manual, there is no additional cost to add the medical
    alert notation to your driver license or nondriver ID.
- id: 56
  category: penalties_and_points
  question: If you are under the age of 18, how can a parent or guardian cancel your
    driver license?
  choices:
    A: By confiscating your physical license card.
    B: By submitting a Parent or Guardian Request to Deny a Driver License (Form 4811).
    C: By calling the local police department to report you.
    D: By removing you from their auto insurance policy.
  answer: B
  explanation: If you are under 18, your parent or guardian may request that the Director
    of Revenue deny or cancel your license by submitting Form 4811.
- id: 57
  category: penalties_and_points
  question: Which of the following is a valid reason your Missouri driver license
    may be suspended or revoked?
  choices:
    A: Failing to vote in a local election.
    B: Getting a single parking ticket.
    C: Failing to pay child support.
    D: Driving 5 mph over the speed limit once.
  answer: C
  explanation: The manual lists 'Failing to pay child support' as one of the reasons
    you can lose your license.
- id: 58
  category: penalties_and_points
  question: What is a potential penalty for changing the information on your driver
    license to attempt to buy alcohol?
  choices:
    A: You will receive a warning letter.
    B: You must take a mandatory defensive driving course.
    C: Your license may be revoked or suspended.
    D: You must pay a $50 fine but will keep your license.
  answer: C
  explanation: Changing the information on your license or using someone else's license
    when attempting to buy alcohol is listed as a reason your license may be revoked
    or suspended.
- id: 59
  category: safe_driving_rules
  question: 'If you are under age 16 with an instruction permit, you may drive when
    accompanied by a person who is at least 25 years old and licensed for a minimum
    of three years, PROVIDED they also have:'
  choices:
    A: A completely clean driving record.
    B: Proof of immediate family relationship.
    C: Written permission from your parent or legal guardian.
    D: Ownership of the vehicle you are driving.
  answer: C
  explanation: Under age 16, you may drive with a person at least 25 years old who
    has been licensed for three years if they have received written permission from
    your parent or legal guardian.
- id: 60
  category: safe_driving_rules
  question: If you are 16 or older and hold an instruction permit, who must accompany
    you in the front seat while driving?
  choices:
    A: A person who is at least 21 years old and has a valid driver license.
    B: A parent or legal guardian only.
    C: Anyone who is at least 18 years old.
    D: A licensed driving instructor.
  answer: A
  explanation: At age 16 or older, you may drive when accompanied in the front seat
    by a person who is at least 21 years old and has a valid driver license.
- id: 61
  category: license_system
  question: To graduate to an Intermediate License, how many hours of driving instruction
    must you complete?
  choices:
    A: 20 hours, including 5 hours of nighttime driving.
    B: 30 hours, including 10 hours of nighttime driving.
    C: 40 hours, including 10 hours of nighttime driving.
    D: 50 hours, including 15 hours of nighttime driving.
  answer: C
  explanation: You must complete 40 hours of driving instruction, which must include
    at least ten hours of nighttime driving, to graduate to an Intermediate License.
- id: 62
  category: license_system
  question: How long must you hold an instruction permit before you can graduate to
    an Intermediate License?
  choices:
    A: At least 3 months (90 days).
    B: At least 6 months (182 days).
    C: At least 9 months (270 days).
    D: At least 12 months (365 days).
  answer: B
  explanation: You must have an instruction permit for a minimum of six months (182
    days) beginning the day after issuance to graduate to an Intermediate License.
- id: 63
  category: driver_testing
  question: 'To obtain an Intermediate License, you must have no traffic convictions
    in the last:'
  choices:
    A: 3 months.
    B: 6 months.
    C: 12 months.
    D: 24 months.
  answer: B
  explanation: To obtain an Intermediate License, you must have no alcohol-related
    convictions in the last 12 months and no traffic convictions in the last six months.
- id: 64
  category: safe_driving_rules
  question: During the first six months of holding an Intermediate License, what is
    the restriction on passengers?
  choices:
    A: No passengers are allowed under any circumstances.
    B: You may not drive with more than one passenger under age 19 who is not immediate
      family.
    C: You may have up to three passengers under age 19 who are not immediate family.
    D: You may only drive with passengers who are 21 or older.
  answer: B
  explanation: During the first six months, you may not operate a motor vehicle with
    more than one passenger who is under the age of 19 and who is not a member of
    your immediate family.
- id: 65
  category: safe_driving_rules
  question: After the first six months of holding an Intermediate License, how many
    passengers under age 19 (who are not immediate family) are you allowed to have
    in the vehicle?
  choices:
    A: None
    B: One
    C: Two
    D: Three
  answer: D
  explanation: After the first six months, you may not operate a motor vehicle with
    more than three passengers who are under 19 years of age and who are not members
    of your immediate family.
- id: 66
  category: safe_driving_rules
  question: What are the restricted driving hours for an Intermediate License holder
    driving alone?
  choices:
    A: 10:00 p.m. to 5:00 a.m.
    B: 11:00 p.m. to 6:00 a.m.
    C: 12:00 a.m. to 6:00 a.m.
    D: 1:00 a.m. to 5:00 a.m.
  answer: D
  explanation: You may not drive alone between 1:00 a.m. and 5:00 a.m. except to and
    from a school activity, job, or an emergency.
- id: 67
  category: license_system
  question: Male applicants of what age range may register with the Selective Service
    at the time of their license or permit application?
  choices:
    A: 16 to 18
    B: 18 to 21
    C: 18 to 26
    D: 21 to 30
  answer: C
  explanation: Male applicants, age 18 to 26, may register with the Selective Service
    at the time of their license or permit application.
- id: 68
  category: license_system
  question: What are your options regarding your driver license when you turn 21 years
    old?
  choices:
    A: You must immediately surrender your license to the state.
    B: You must retake the written and driving tests to remove the minor indication.
    C: You may apply for a license without the minor indication or wait until your
      current license expires.
    D: You are required to pay a fine to remove the minor indication.
  answer: C
  explanation: According to the manual, when you become 21 years old, you may apply
    and pay for another driver license (without the minor indication) or wait until
    your under-21 driver license expires.
- id: 69
  category: license_system
  question: If you are a new Missouri resident transferring an out-of-state driver
    license, the out-of-state license must be valid or expired for no more than how
    many days?
  choices:
    A: 30 days
    B: 90 days
    C: 184 days
    D: 365 days
  answer: C
  explanation: A new Missouri resident transferring an out-of-state driver license
    must present an out-of-state license that is valid or expired no more than 184
    days.
- id: 70
  category: driver_testing
  question: According to the Missouri Driver Guide, approximately what percentage
    of all test-takers fail the written exam the first time?
  choices:
    A: 25 percent
    B: 30 percent
    C: 50 percent
    D: 75 percent
  answer: C
  explanation: The manual encourages studying the guide because almost 50 percent
    of all test-takers fail the first time.
- id: 71
  category: license_system
  question: 'To graduate to a Full Under-21 Driver License, you must not have any
    alcohol-related offenses or traffic convictions within the last:'
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: To graduate to a Full Under-21 Driver License, you may not have any
    alcohol-related offenses or traffic convictions within the last 12 months.
- id: 72
  category: driver_testing
  question: The Missouri driver examination consists of which four parts?
  choices:
    A: Written test, vision test, road sign test, and driving test
    B: Written test, hearing test, road sign test, and driving test
    C: Vision test, physical exam, written test, and driving test
    D: Written test, vision test, reflex test, and driving test
  answer: A
  explanation: 'The driver examination consists of a four-part test: a written test,
    a vision test, a road sign test, and a driving test (skills).'
- id: 73
  category: driver_testing
  question: If you have a valid driver license from another state and are applying
    for the same type of license in Missouri, which tests are you required to take?
  choices:
    A: Only the written test
    B: Only the driving test
    C: The vision and road sign tests
    D: All four parts of the driver examination
  answer: C
  explanation: If you have a driver license from another state that is valid or has
    been expired for less than 184 days, and you are applying for the same type of
    license in Missouri, you only have to take the vision and road sign tests.
- id: 74
  category: driver_testing
  question: How many questions are on the multiple-choice written test for a Class
    F (operator) license?
  choices:
    A: '20'
    B: '25'
    C: '30'
    D: '40'
  answer: B
  explanation: If you are applying for a Class F (operator) license, you must take
    a 25 question multiple-choice written test.
- id: 75
  category: driver_testing
  question: What additional information is included on the written test for a Class
    E (for-hire) license that is NOT on the Class F test?
  choices:
    A: Motorcycle safety laws
    B: Information on commercial vehicles
    C: Advanced parallel parking techniques
    D: Interstate highway navigation
  answer: B
  explanation: The written test for a Class E (for-hire) license includes the laws
    and methods of driving covered in the Guide, but will also include the information
    on commercial vehicles found in Chapter 15.
- id: 76
  category: driver_testing
  question: What is the standard minimum acuity required to pass the vision test for
    a Missouri driver license?
  choices:
    A: 20/20 with either or both eyes
    B: 20/30 with either or both eyes
    C: 20/40 with either or both eyes
    D: 20/50 with either or both eyes
  answer: C
  explanation: The standard minimum acuity is at least 20/40 with either or both eyes.
- id: 77
  category: driver_testing
  question: 'You cannot take the driving test and cannot have a driver license if
    your natural and corrected acuity vision is worse than:'
  choices:
    A: 20/40
    B: 20/80
    C: 20/100
    D: 20/160
  answer: D
  explanation: If both your natural and corrected acuity vision are worse than 20/160,
    or your peripheral combined is worse than 70 degrees, you cannot take the driving
    test and cannot have a driver license.
- id: 78
  category: vehicle_information
  question: Which of the following is a requirement for the vehicle you use to take
    your driving test?
  choices:
    A: It must have a backup camera.
    B: It must have two sets of brakes (parking and a foot brake) in good working
      order.
    C: It must be less than 10 years old.
    D: It must have an automatic transmission.
  answer: B
  explanation: The vehicle used for the driving test must have two sets of brakes
    (parking and a foot brake) in good working order, among other safety requirements.
- id: 79
  category: driver_testing
  question: Who is allowed to ride in the vehicle with you during your driving test?
  choices:
    A: Only the driver license examiner
    B: The examiner and one parent or guardian
    C: The examiner and your driving instructor
    D: Anyone, as long as they sit in the back seat
  answer: A
  explanation: You will drive, and the examiner will sit beside you. No one else may
    ride in the vehicle during the test.
- id: 80
  category: driver_testing
  question: 'During the driving test, you will be asked to parallel park in a space
    that is:'
  choices:
    A: 20 feet long and six feet wide
    B: 25 feet long and seven feet wide
    C: 30 feet long and eight feet wide
    D: 35 feet long and nine feet wide
  answer: B
  explanation: You will be asked to park parallel to the curb, in a space 25 feet
    long and seven feet wide.
- id: 81
  category: driver_testing
  question: When tested on parallel parking during the driving exam, you must park
    no more than how many inches from the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: During the parallel parking portion of the driving test, you will be
    tested on parking no more than 18 inches from the curb.
- id: 82
  category: driver_testing
  question: 'When being tested on backing your vehicle, the examiner will check if
    you:'
  choices:
    A: Rely solely on your rearview mirror.
    B: Look over your right shoulder to see through the rear glass.
    C: Use your backup camera effectively.
    D: Honk your horn before shifting into reverse.
  answer: B
  explanation: When testing backing, the examiner will test you for looking over your
    right shoulder to see through the rear glass.
- id: 83
  category: driver_testing
  question: When taking the driving skills test, what is the maximum distance you
    are allowed to park from the curb?
  choices:
    A: 12 inches
    B: 18 inches
    C: 24 inches
    D: 36 inches
  answer: B
  explanation: During the driving test, you will be tested for parking no more than
    18 inches from the curb.
- id: 84
  category: driver_testing
  question: Which of the following actions will result in an automatic failure of
    your driving skills test?
  choices:
    A: Losing 15 points on the test
    B: Taking more than one minute to park
    C: Refusing to drive as the examiner asks
    D: Parking 16 inches from the curb
  answer: C
  explanation: You will fail the test if you refuse to drive as the examiner asks,
    hit a pedestrian, violate a traffic law, or lose more than 30 points.
- id: 85
  category: driver_testing
  question: What is required if you fail the driving test three times?
  choices:
    A: You must wait six months before testing again.
    B: You must send proof of additional behind-the-wheel driver training to the Department
      of Revenue.
    C: You are permanently barred from obtaining a driver's license.
    D: You must pay a $250 fine to retake the test.
  answer: B
  explanation: If you fail the driving test three times, you must send proof of additional
    behind-the-wheel driver training and obtain approval to test from the Department
    of Revenue before taking the test again.
- id: 86
  category: penalties_and_points
  question: 'Committing fraud during the examination process, such as cheating or
    using a recording device, may result in:'
  choices:
    A: A warning and an immediate retake of the exam
    B: The loss of your driving privilege for up to one year
    C: A mandatory 5-year prison sentence
    D: A minimum fine of $500
  answer: B
  explanation: Fraud is a Class 'A' misdemeanor that may result in the loss of your
    driving privilege for up to one year.
- id: 87
  category: safe_driving_rules
  question: Which of the following statements about right-of-way laws is true?
  choices:
    A: The law gives the right-of-way to the driver who enters the intersection first.
    B: The law gives the right-of-way to pedestrians at all times.
    C: The law says who must yield the right-of-way, but it does not give anyone the
      right-of-way.
    D: The law gives the right-of-way to vehicles traveling on multi-lane highways.
  answer: C
  explanation: The law says who must yield the right-of-way; it does not give any
    driver the right-of-way. You must do everything you can to prevent striking a
    pedestrian or another vehicle.
- id: 88
  category: penalties_and_points
  question: What is the minimum fine for a first offense of speeding or passing in
    a construction or work zone on Missouri state roadways?
  choices:
    A: $100
    B: $150
    C: $250
    D: $300
  answer: C
  explanation: If you are caught speeding or passing in a construction zone or work
    zone, you could be fined a minimum of $250 for the first offense.
- id: 89
  category: safe_driving_rules
  question: Under which condition is it legal to overtake and pass another vehicle
    on the right?
  choices:
    A: When the vehicle you are passing is making or about to make a left turn.
    B: When you drive off the paved portion of the roadway onto the shoulder.
    C: When you are approaching the crest of a hill.
    D: When there is a solid yellow line on your side of the road.
  answer: A
  explanation: You may pass on the right when the vehicle overtaken is making or about
    to make a left turn, provided you do not drive off the paved or main traveled
    portion of the roadway.
- id: 90
  category: safe_driving_rules
  question: You are prohibited from driving to the left side of the roadway to pass
    another vehicle when your view is obstructed within how many feet of a bridge,
    viaduct, or tunnel?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: No vehicle shall be driven to the left side of the roadway when the
    view is obstructed upon approaching within 100 feet of any bridge, viaduct, or
    tunnel.
- id: 91
  category: safe_driving_rules
  question: 'When you are turning left at an intersection, you must:'
  choices:
    A: Yield to oncoming vehicles going straight.
    B: Take the right-of-way over all other vehicles.
    C: Yield only to vehicles turning right.
    D: Wait for the traffic light to turn yellow before proceeding.
  answer: A
  explanation: At intersections, drivers turning left must yield to oncoming vehicles
    going straight.
- id: 92
  category: safe_driving_rules
  question: At an intersection where there is no stop sign or traffic signal, who
    must you yield to?
  choices:
    A: Vehicles coming from the left
    B: Vehicles coming from the right
    C: Vehicles turning left
    D: Vehicles entering from a driveway
  answer: B
  explanation: At an intersection where there is no stop sign or traffic signal (with
    the exception of roundabouts), drivers must yield to vehicles coming from the
    right.
- id: 93
  category: sharing_the_road
  question: What should you do if you are in an intersection when you see or hear
    an emergency vehicle approaching with its siren and flashing lights?
  choices:
    A: Stop immediately in the middle of the intersection.
    B: Pull over to the left edge of the intersection and stop.
    C: Drive through the intersection before pulling over to the right edge of the
      road.
    D: Speed up to clear the intersection and stay ahead of the emergency vehicle.
  answer: C
  explanation: If you are in an intersection, drive through the intersection before
    you pull over to the right edge of the road. Remain stopped until the emergency
    vehicle passes.
- id: 94
  category: sharing_the_road
  question: When approaching a stationary emergency vehicle displaying lighted red
    or red and blue lights on a multi-lane roadway, what must you do if it is safe?
  choices:
    A: Stop immediately and wait for the vehicle to move.
    B: Make a lane change into a lane not adjacent to the stationary vehicle.
    C: Honk your horn to alert the emergency workers.
    D: Maintain your speed and stay in the adjacent lane.
  answer: B
  explanation: You must proceed with caution and, if safe to do so, make a lane change
    into a lane not adjacent to the stationary vehicle.
- id: 95
  category: sharing_the_road
  question: How far in advance will a school bus flash its amber warning lights before
    coming to a designated stop?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: Amber warning lights will flash 500 feet before the bus comes to a
    designated stop to load or unload school children.
- id: 96
  category: driver_testing
  question: 'During the backing portion of the driving skills test, the examiner will
    check to see if you:'
  choices:
    A: Rely solely on your rearview mirror.
    B: Look over your right shoulder to see through the rear glass.
    C: Back up at a speed of at least 15 mph.
    D: Turn on your hazard lights before backing.
  answer: B
  explanation: When testing for backing, the examiner will check if you are looking
    over your right shoulder to see through the rear glass.
- id: 97
  category: safe_driving_rules
  question: 'When approaching a roundabout intersection, you must:'
  choices:
    A: Yield to traffic already in the circle and pedestrians in the crosswalks.
    B: Enter without stopping as you have the right-of-way.
    C: Yield only to vehicles entering from the right.
    D: Stop in the middle of the roundabout to let other vehicles enter.
  answer: A
  explanation: When approaching a roundabout intersection, always yield to traffic
    in the circle and pedestrians in the crosswalks. Wait for a gap in traffic before
    entering.
- id: 98
  category: sharing_the_road
  question: In which of the following situations are you NOT required to stop for
    a school bus with its red lights flashing?
  choices:
    A: When traveling in the same direction on a two-lane road
    B: When traveling in the opposite direction on a highway with four or more lanes
    C: When traveling in the opposite direction on a two-lane road
    D: When following the bus on a two-lane, one-way street
  answer: B
  explanation: You do not have to stop when you are traveling the opposite direction
    of a school bus on a highway containing four or more lanes of traffic.
- id: 99
  category: safe_driving_rules
  question: What is the minimum distance you should signal before making a turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: The manual states that you should signal at least 100 feet before you
    turn so the other drivers can be ready.
- id: 100
  category: safe_driving_rules
  question: Where is it specifically prohibited to make a U-turn?
  choices:
    A: On a straight, flat two-lane highway
    B: At an intersection controlled by a traffic signal or police officer
    C: On a residential street with no traffic
    D: In a designated two-way left-turn lane
  answer: B
  explanation: Never make a U-turn at a location that is marked with a 'No U-Turn'
    sign or at an intersection controlled by a traffic signal or police officer.
- id: 101
  category: defensive_driving
  question: Why should you avoid swinging wide to the left before making a right turn?
  choices:
    A: It will cause your vehicle to lose traction
    B: The driver behind you may think you are turning left and try to pass on the
      right
    C: It is illegal to cross the center line under any circumstances
    D: It will trigger the traffic signal sensors incorrectly
  answer: B
  explanation: If you swing wide to the left before a right turn, the driver behind
    you may think you are changing lanes or going to turn left, and may try to pass
    you on the right.
- id: 102
  category: safe_driving_rules
  question: What is the maximum distance a vehicle may travel in a center two-way
    left-turn lane?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: The manual specifies that you must not use a two-way left-turn lane
    as a travel lane, and a vehicle may not travel in this lane for more than 500
    feet.
- id: 103
  category: safe_driving_rules
  question: Which of the following maneuvers is strictly prohibited when entering
    a roundabout?
  choices:
    A: Yielding to pedestrians
    B: Making a left turn to enter
    C: Slowing down before entering
    D: Making a slight right turn
  answer: B
  explanation: When approaching a roundabout, the manual explicitly states to 'NEVER
    make a left turn to enter a roundabout.'
- id: 104
  category: safe_driving_rules
  question: Who has the right-of-way at a roundabout?
  choices:
    A: Vehicles entering the roundabout
    B: Vehicles already within the roundabout
    C: Large trucks approaching the roundabout
    D: Vehicles exiting the roundabout
  answer: B
  explanation: When traveling through a roundabout, vehicles within the roundabout
    have the right of way.
- id: 105
  category: defensive_driving
  question: What should you do if you miss your intended exit while traveling through
    a roundabout?
  choices:
    A: Stop and wait for traffic to clear before backing up
    B: Make a U-turn inside the roundabout
    C: Continue through the roundabout until you reach your appropriate exit
    D: Change lanes immediately to force your way out
  answer: C
  explanation: If you miss your exit, you must continue through the roundabout until
    you reach your appropriate exit.
- id: 106
  category: sharing_the_road
  question: How should you react if an emergency vehicle approaches while you are
    driving inside a roundabout?
  choices:
    A: Stop immediately inside the roundabout to let it pass
    B: Speed up and exit as quickly as possible
    C: Exit immediately and pull to the right
    D: Pull over to the center island
  answer: C
  explanation: NEVER stop while inside a roundabout. If an emergency vehicle approaches
    while you are in the roundabout, exit immediately and pull to the right.
- id: 107
  category: sharing_the_road
  question: What is the purpose of a truck apron in a roundabout?
  choices:
    A: It is a designated parking area for disabled vehicles
    B: It is a passing lane for passenger cars and SUVs
    C: It provides extra space for the rear wheels of large trucks when turning
    D: It is a safe zone for pedestrians to cross
  answer: C
  explanation: A truck apron is the paved area on the inside of the roundabout for
    the rear wheels of large trucks to use when turning. It is not to be used by cars,
    SUVs, or pickup trucks.
- id: 108
  category: safe_driving_rules
  question: How does a driver navigate a J-turn intersection?
  choices:
    A: By crossing all lanes of traffic directly to the opposite side
    B: By turning right, merging into the far left lane, and then making a left turn
    C: By entering a circular island and yielding to the left
    D: By using a center two-way left-turn lane to merge
  answer: B
  explanation: At a J-turn intersection, drivers turn right in the same direction
    of traffic, merge into the far left lane, and then make a left turn in the direction
    they intend to travel.
- id: 109
  category: driver_responsibility
  question: According to the manual, local governments have the authority to create
    traffic ordinances that do which of the following?
  choices:
    A: Issue driver's licenses
    B: Prohibit the use of sound-producing warning devices
    C: Change the state's minimum driving age
    D: Eliminate the need for vehicle registration
  answer: B
  explanation: Cities and towns may have regulations to do several things, including
    to 'Prohibit the use of sound-producing warning devices.'
- id: 110
  category: safe_driving_rules
  question: When making a turn where there are no signs or lane markings, which lane
    should you turn into?
  choices:
    A: The lane furthest from the one you came from
    B: The center lane, regardless of direction
    C: The lane closest to the one you came from
    D: Any lane that is free of traffic
  answer: C
  explanation: If there are no signs or lane markings to control turning, you should
    turn from the lane that is closest to the direction you want to go, and turn into
    the lane closest to the one you came from.
- id: 111
  category: safe_driving_rules
  question: Which of the following is a restriction when using a two-way left-turn
    lane?
  choices:
    A: You cannot use it to slow down before making a left turn
    B: You must not use it when entering the roadway from a side street
    C: You can only use it if you are driving a commercial vehicle
    D: You must travel in it for at least 500 feet before turning
  answer: B
  explanation: 'The manual states regarding two-way left-turn lanes: ''do not use
    this lane when entering the roadway from a side street.'''
- id: 112
  category: sharing_the_road
  question: 'When traveling in the same lane as a motorcycle, you should:'
  choices:
    A: Share the lane to improve traffic flow.
    B: Not share the lane, as the motorcyclist needs the entire lane.
    C: Drive closely behind them to reduce wind resistance.
    D: Pass them within the same lane if it is wide enough.
  answer: B
  explanation: According to the manual, you should not share a lane with a motorcycle
    because the motorcyclist needs the entire lane for safety reasons.
- id: 113
  category: license_system
  question: What is required to legally drive a motorcycle on public streets?
  choices:
    A: A standard Class F driver license only.
    B: A valid driver license with a motorcycle endorsement or a motorcycle license.
    C: A commercial driver license (CDL).
    D: A special permit from the highway patrol.
  answer: B
  explanation: To drive any motorcycle on the public streets, you must have a valid
    driver license with a motorcycle endorsement or a motorcycle license.
- id: 114
  category: sharing_the_road
  question: What is the "No-Zone" in reference to large trucks and buses?
  choices:
    A: The designated parking area for commercial vehicles.
    B: The blind spots on each side, in the rear, and in the front of the vehicle.
    C: The lane restricted for trucks traveling up steep grades.
    D: The area near weigh stations where cars are not allowed.
  answer: B
  explanation: A truck or bus has blind spots on each side, in the rear and in the
    front where an automobile cannot be seen. These blind spots are referred to as
    the "No-Zone."
- id: 115
  category: vehicle_information
  question: Approximately how long does it take a fully loaded tractor-trailer traveling
    at 55 mph to come to a complete stop?
  choices:
    A: 130 to 140 feet.
    B: 200 feet.
    C: Almost 400 feet.
    D: Over 600 feet.
  answer: C
  explanation: While an average passenger car at 55 mph can stop in about 130-140
    feet, a fully loaded tractor-trailer may take almost 400 feet to come to a complete
    stop.
- id: 116
  category: signs_and_signals
  question: What should you do as a pedestrian if a flashing "Don't Walk" sign appears
    while you are already crossing the street?
  choices:
    A: Stop in the middle of the crosswalk and wait.
    B: Turn around and return to the curb you started from.
    C: Run as fast as possible to the other side.
    D: Finish crossing the street.
  answer: D
  explanation: The manual states that if the flashing "Don't Walk" sign appears when
    you are crossing the street, you may finish crossing the street.
- id: 117
  category: safe_driving_rules
  question: When passing a large truck, when is it safe to reenter the lane in front
    of the truck?
  choices:
    A: As soon as your rear bumper clears the front of the truck.
    B: When you can see the cab of the truck in your rearview mirror.
    C: Immediately after you activate your right turn signal.
    D: When the truck driver flashes their headlights.
  answer: B
  explanation: After you pass a truck, make sure you can see the cab of the truck
    in your rearview mirror before reentering the lane.
- id: 118
  category: defensive_driving
  question: As a motorcycle rider, how much clearance should you leave when passing
    to the left of a parked or moving vehicle?
  choices:
    A: One to two feet.
    B: Three to four feet.
    C: Five to six feet.
    D: At least one full lane width.
  answer: B
  explanation: Motorcycle riders should leave three to four feet of clearance when
    passing to the left of a parked or moving vehicle to avoid suddenly opened car
    doors or to allow for a vehicle to swerve.
- id: 119
  category: sharing_the_road
  question: If a pedestrian crosses the road in the middle of a block where there
    is no crosswalk, who has the right-of-way?
  choices:
    A: The pedestrian always has the right-of-way.
    B: The pedestrian must yield the right-of-way to all traffic.
    C: Vehicles must stop and yield to the pedestrian.
    D: The right-of-way belongs to whichever party is moving faster.
  answer: B
  explanation: When crossing in the middle of the block without a crosswalk, a pedestrian
    must yield the right-of-way to all traffic.
- id: 120
  category: sharing_the_road
  question: Why might a large truck swing out to the left before making a turn?
  choices:
    A: To allow cars to pass on the right.
    B: As the first step in making a right turn due to their large size.
    C: To check their left-side blind spots.
    D: To gain more speed before entering the intersection.
  answer: B
  explanation: Because of their size, large trucks may swing out to the left as the
    first step in making a right turn.
- id: 121
  category: safe_driving_rules
  question: 'If a vehicle ahead of you has stopped or slowed down for a pedestrian,
    you should:'
  choices:
    A: Honk your horn to warn the pedestrian and proceed.
    B: Pass the vehicle on the left if the lane is clear.
    C: Pass the vehicle on the right using the shoulder.
    D: Not pass the vehicle.
  answer: D
  explanation: As a driver, you must not pass a vehicle that has stopped or slowed
    down for a pedestrian.
- id: 122
  category: defensive_driving
  question: Why is it dangerous to underestimate the speed of an approaching tractor-trailer?
  choices:
    A: Because they often appear to be traveling faster than they actually are.
    B: Because their large size makes them appear to be traveling more slowly than
      their actual speed.
    C: Because they frequently speed up when approaching intersections.
    D: Because their headlights are dimmer than passenger cars.
  answer: B
  explanation: Never underestimate the size and speed of an approaching tractor-trailer.
    Because of its large size, a tractor-trailer often appears to be traveling more
    slowly than its actual speed.
- id: 123
  category: sharing_the_road
  question: Why might a motorcyclist suddenly change speed or lane position?
  choices:
    A: To prevent cars from passing them.
    B: To react to bad road conditions like manhole covers or road debris.
    C: Because their vehicles are lighter and harder to steer on smooth pavement.
    D: To signal that they are about to make a U-turn.
  answer: B
  explanation: Motorcyclists change speed and lane position when encountering bad
    road conditions, such as manhole covers, diagonal railroad tracks, road debris,
    or in strong winds.
- id: 124
  category: driver_responsibility
  question: 'According to the manual, municipalities, cities, and towns have the authority
    to enact regulations that:'
  choices:
    A: Issue commercial driver licenses.
    B: Prohibit commercial vehicles from using certain streets.
    C: Override state highway speed limits on interstates.
    D: Exempt motorcycles from helmet laws.
  answer: B
  explanation: Cities and towns may have regulations to do several things, including
    prohibiting commercial vehicles from using certain streets.
- id: 125
  category: defensive_driving
  question: How can you tell if you are driving too closely behind a large truck or
    bus?
  choices:
    A: You cannot see the driver in his or her rearview mirrors.
    B: You can read the license plate clearly.
    C: The truck's brake lights appear excessively bright.
    D: You are within 100 feet of the vehicle.
  answer: A
  explanation: If you are driving behind a truck or a bus and cannot see the driver
    in his or her rearview mirrors, the driver of that vehicle cannot see you.
- id: 126
  category: safe_driving_rules
  question: If you are walking as a pedestrian and there is no sidewalk available,
    how should you walk?
  choices:
    A: Walk in the same direction as traffic.
    B: Walk facing traffic.
    C: Walk in the center of the road.
    D: Walk on the right side of the road regardless of traffic flow.
  answer: B
  explanation: The manual states that pedestrians should walk facing traffic when
    no sidewalk is available.
- id: 127
  category: sharing_the_road
  question: What must a driver do when a pedestrian guided by a dog or carrying a
    white cane is crossing the street?
  choices:
    A: Honk the horn to alert them
    B: Slow down and proceed with caution
    C: Come to a complete stop
    D: Steer around the pedestrian
  answer: C
  explanation: When a pedestrian is crossing a street or highway guided by a dog or
    carrying a white cane (or a white cane with a red tip), vehicles must come to
    a complete stop.
- id: 128
  category: safe_driving_rules
  question: When must you obey a slower speed limit in a school zone?
  choices:
    A: Only during morning hours
    B: When lights are flashing or children are present
    C: Only when a crossing guard is present
    D: At all times, 24 hours a day
  answer: B
  explanation: You must obey a slower speed limit in a school zone when lights are
    flashing or children are present.
- id: 129
  category: sharing_the_road
  question: 'When passing a bicycle or moped, you should:'
  choices:
    A: Squeeze past them if the lane is narrow
    B: Honk your horn to make them move over
    C: Give them a full lane width
    D: Pass as closely as possible
  answer: C
  explanation: When you are passing, give bicycles and mopeds a full lane width. Do
    not squeeze past these road users.
- id: 130
  category: sharing_the_road
  question: When are you permitted to cross a designated bicycle lane?
  choices:
    A: When passing another motor vehicle
    B: When turning or when entering or leaving the roadway
    C: Whenever you need extra room to maneuver
    D: You are never allowed to cross a bicycle lane
  answer: B
  explanation: You may cross a bicycle lane when turning or when entering or leaving
    the roadway. You must yield to bicyclists in a bicycle lane.
- id: 131
  category: sharing_the_road
  question: 'When riding a bicycle or moped on public streets, you should:'
  choices:
    A: Always ride against traffic
    B: Always ride with traffic, never against it
    C: Ride on the sidewalk whenever possible
    D: Weave in and out of parked cars
  answer: B
  explanation: On public streets and highways, you have the same rights and responsibilities
    as a motor vehicle operator. Always ride with traffic, never against it.
- id: 132
  category: safe_driving_rules
  question: Where is it illegal to ride a moped?
  choices:
    A: On residential streets
    B: On public streets and highways
    C: On any part of the federal interstate highway system
    D: On roads with a speed limit over 35 mph
  answer: C
  explanation: The law does not allow you to ride a moped on any part of the federal
    interstate highway system.
- id: 133
  category: vehicle_information
  question: 'The brakes on a moped or bicycle must be able to stop the vehicle within:'
  choices:
    A: 15 feet when traveling 10 mph
    B: 25 feet when traveling 10 mph
    C: 50 feet when traveling 20 mph
    D: 100 feet when traveling 30 mph
  answer: B
  explanation: Your brakes must be able to stop you within 25 feet when traveling
    ten mph.
- id: 134
  category: vehicle_information
  question: 'When riding a bicycle between 1/2 hour after sunset and 1/2 hour before
    sunrise, you must have a white light on the front visible from at least:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: C
  explanation: You must have a White Light on the front of your bicycle or carried
    by you that other drivers can see from 500 feet.
- id: 135
  category: vehicle_information
  question: 'When riding a bicycle at night, your rear red reflector or rear red light
    must be visible when reflected by low beam headlights at:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: D
  explanation: You must have a Rear Red Reflector, at least two square inches, or
    a Rear Red Light that drivers can see when reflected by their vehicles’ low beam
    headlights at 600 feet.
- id: 136
  category: license_system
  question: Does the operation of an electric bicycle require a driver license?
  choices:
    A: Yes, a standard operator license is required
    B: Yes, a motorcycle license is required
    C: No, it does not require an operator or motorcycle license
    D: Yes, a commercial driver license is required
  answer: C
  explanation: Operation of an electric bicycle as defined by 301.010 RSMo does not
    require the rider to hold an operator license or motorcycle license.
- id: 137
  category: sharing_the_road
  question: Which of the following has the right-of-way at all intersections regardless
    of any traffic control device (except for emergency vehicles)?
  choices:
    A: Bicyclists
    B: Mopeds
    C: An organized funeral procession
    D: Pedestrians outside of crosswalks
  answer: C
  explanation: An organized funeral procession has the right-of-way at all intersections
    regardless of any traffic control device, except for emergency vehicles or when
    directed otherwise by law enforcement officials.
- id: 138
  category: safe_driving_rules
  question: If you are driving a vehicle in a funeral procession, what must you use?
  choices:
    A: Your high beam headlights
    B: Your horn at every intersection
    C: Your flashing emergency lights
    D: Your left turn signal continuously
  answer: C
  explanation: Every vehicle in the procession must use its flashing emergency lights.
- id: 139
  category: sharing_the_road
  question: 'A bicyclist may move toward the middle or left of the lane when:'
  choices:
    A: The lane is too narrow to share with another vehicle
    B: They want to ride side-by-side with a friend
    C: They are traveling slower than the flow of traffic
    D: They are approaching a hill
  answer: A
  explanation: 'You may move more toward the middle or left of the lane or roadway,
    as appropriate when: Making a left turn; Avoiding hazards; The lane is too narrow
    to share with another vehicle; or There is a right-turn-only lane and you are
    going straight.'
- id: 140
  category: sharing_the_road
  question: When does an organized funeral procession have the right-of-way at an
    intersection?
  choices:
    A: Only when the traffic light is green.
    B: At all intersections regardless of traffic control devices, except for emergency
      vehicles.
    C: Only at four-way stops.
    D: They never have the right-of-way over regular traffic.
  answer: B
  explanation: According to the manual, an organized funeral procession has the right-of-way
    at all intersections regardless of any traffic control device, except for emergency
    vehicles or when directed otherwise by law enforcement.
- id: 141
  category: sharing_the_road
  question: If you are not involved in an organized funeral procession, what is the
    rule regarding passing the procession?
  choices:
    A: You may pass at any time if you honk your horn.
    B: You may pass only if you use the right shoulder.
    C: You must never pass a funeral procession under any circumstances.
    D: You may not pass any vehicle in the procession except where a passing lane
      has been specifically provided.
  answer: D
  explanation: The manual states that drivers not involved in a funeral procession
    must not attempt to pass any vehicle in the procession except where a passing
    lane has been specifically provided.
- id: 142
  category: defensive_driving
  question: What number should you dial on your cellular phone to report a road rage
    incident after safely exiting the roadway?
  choices:
    A: '*44'
    B: '*55 (or 911 if you are in a metropolitan area)'
    C: '*HP'
    D: '411'
  answer: B
  explanation: When confronted with road rage, the manual advises to exit the roadway
    to a safe area and dial *55 (or 911 if you are in a metropolitan area).
- id: 143
  category: penalties_and_points
  question: What is the maximum penalty if a judge finds you guilty of littering?
  choices:
    A: A $500 fine and 30 days in jail.
    B: A $1,000 fine and/or up to one year in jail.
    C: A $2,000 fine and license suspension.
    D: A $100 fine and community service.
  answer: B
  explanation: Littering is against the law. If a judge finds you guilty of littering,
    you may have to pay up to a $1,000 fine and/or spend up to one year in jail.
- id: 144
  category: safe_driving_rules
  question: Where are you normally allowed to park on a one-way street?
  choices:
    A: Only on the right side.
    B: Only on the left side.
    C: On either the right or left side.
    D: Parking is never allowed on one-way streets.
  answer: C
  explanation: The manual states that on one-way streets, you may normally park on
    either the right or left side of the street.
- id: 145
  category: safe_driving_rules
  question: When exiting a parked vehicle on a street, how should passengers, especially
    children, exit?
  choices:
    A: On the street side to avoid pedestrians.
    B: On the curb side.
    C: From the trunk.
    D: Whichever side is closest to their seat.
  answer: B
  explanation: The manual advises to always have passengers, especially children,
    exit the vehicle on the curb side to avoid traffic.
- id: 146
  category: safe_driving_rules
  question: Which way should you turn your wheels when parking on a hill to prevent
    the vehicle from rolling into traffic?
  choices:
    A: Sharply towards the center of the road.
    B: Straight ahead.
    C: Sharply towards the side of the road.
    D: Slightly towards the left lane.
  answer: C
  explanation: When you park on a hill, you should turn your wheels sharply towards
    the side of the road so that if the vehicle starts to roll downhill, it will roll
    away from traffic.
- id: 147
  category: safe_driving_rules
  question: Which of the following is a designated no-parking zone?
  choices:
    A: Alongside a curb that is painted yellow.
    B: On the right side of a one-way street.
    C: In a designated parking garage.
    D: On a street with a speed limit over 35 mph.
  answer: A
  explanation: The manual lists several areas where you cannot park, including alongside
    a curb that is painted yellow.
- id: 148
  category: penalties_and_points
  question: What is the fine for illegally parking in a space marked with the International
    Symbol of Access (handicapped parking)?
  choices:
    A: No less than $10 and no more than $50.
    B: No less than $50 and no more than $300.
    C: Exactly $500.
    D: Up to $1,000.
  answer: B
  explanation: Violators who park illegally in handicapped spaces, when convicted,
    shall be punished by a fine of no less than fifty dollars ($50) and no more than
    three hundred dollars ($300).
- id: 149
  category: safe_driving_rules
  question: When is it illegal to use a handicapped person's placard to park in a
    designated handicapped space?
  choices:
    A: When the handicapped person is driving the vehicle.
    B: When the handicapped person is being dropped off.
    C: When the handicapped person is not being transported at the time.
    D: When the vehicle is parked for less than 15 minutes.
  answer: C
  explanation: It is illegal to use a handicapped person’s placard or license plates
    to park in designated handicapped parking spaces if the handicapped person is
    not being transported at the time.
- id: 150
  category: safe_driving_rules
  question: When beginning to parallel park, how far to the left of the vehicle ahead
    of the parking space should you stop?
  choices:
    A: About 6 inches.
    B: About 1½ feet.
    C: About 3 feet.
    D: About 5 feet.
  answer: B
  explanation: To begin parallel parking, you should stop even with the vehicle ahead
    of the parking space about 1½ feet to the left of that vehicle.
- id: 151
  category: safe_driving_rules
  question: On a highway with four or more lanes, when are you allowed to drive in
    the left lane?
  choices:
    A: At any time, as long as you are driving the speed limit.
    B: Only when you are driving a commercial vehicle.
    C: When passing slower traffic, letting another driver enter safely, or preparing
      for a left turn.
    D: Only during daylight hours.
  answer: C
  explanation: On highways with four or more lanes, always keep to the right unless
    you are passing slower traffic, letting another driver have room to enter safely,
    or getting ready to make a legal left turn.
- id: 152
  category: safe_driving_rules
  question: When is it permissible to pass a vehicle on the right?
  choices:
    A: When the vehicle ahead is driving below the speed limit.
    B: When the vehicle ahead is making a left turn, provided you do not use the shoulder
      or unpaved part of the highway.
    C: Whenever there is enough room on the right shoulder.
    D: It is never permissible to pass on the right.
  answer: B
  explanation: You can use the right lane when passing a vehicle that is making a
    left turn. However, you must never use the shoulder or unpaved part of the highway
    to pass.
- id: 153
  category: defensive_driving
  question: What is the best way to check your "blind spots" before passing a vehicle
    on a four-lane highway?
  choices:
    A: Honk your horn to alert other drivers.
    B: Rely entirely on your inside rearview mirror.
    C: Briefly look over your shoulder.
    D: Flash your headlights.
  answer: C
  explanation: Looking over your left shoulder is important because it allows you
    to check for "blind spots," which are spaces you cannot see with your rearview
    mirrors.
- id: 154
  category: vehicle_information
  question: How should you secure your vehicle when parking if it has a manual transmission?
  choices:
    A: Leave it in neutral and do not set the parking brake.
    B: Leave it in park and set the parking brake.
    C: Leave the vehicle in gear and set the parking brake.
    D: Leave the keys in the ignition.
  answer: C
  explanation: The manual instructs to always set your parking brake when you park
    and to leave the vehicle in gear if it has a manual transmission.
- id: 155
  category: defensive_driving
  question: What should you do if another vehicle begins to pass you?
  choices:
    A: Speed up to prevent them from passing.
    B: Move to the left lane.
    C: Tap your brakes to warn the driver.
    D: Stay in your lane and do not increase your speed.
  answer: D
  explanation: The manual states, "If another vehicle begins to pass you, stay in
    your lane and do not increase your speed."
- id: 156
  category: safe_driving_rules
  question: If you are driving much slower than other vehicles and traffic is piling
    up behind you, what should you do?
  choices:
    A: Maintain your speed and stay in your lane.
    B: Speed up to exceed the speed limit.
    C: Pull over and let them pass when it is safe to do so.
    D: Turn on your emergency flashers and stop in the lane.
  answer: C
  explanation: The manual states, "If vehicles are piled up behind you, pull over
    and let them pass when it is safe to do so."
- id: 157
  category: defensive_driving
  question: If you must stop on the shoulder of the highway in an emergency, how can
    you alert other drivers?
  choices:
    A: Stand in the roadway and wave your arms.
    B: Turn on your emergency flashers and raise the hood.
    C: Honk your horn continuously.
    D: Flash your high-beam headlights.
  answer: B
  explanation: The manual states, "You can stop on the shoulder of the highway in
    an emergency. If you do, alert other drivers by turning on your emergency flashers.
    It is also helpful to raise the hood, or tie a white cloth to the antenna."
- id: 158
  category: safe_driving_rules
  question: When entering a highway using an entrance ramp and acceleration lane,
    what should you do?
  choices:
    A: Stop at the end of the acceleration lane and wait for a gap.
    B: Drive slowly until you merge into the left lane.
    C: Increase your speed to match the speed of the vehicles on the highway.
    D: Yield the right-of-way by stopping immediately on the ramp.
  answer: C
  explanation: The manual states, "Use the ramp and acceleration lane to increase
    your speed to match the speed of the vehicles on the highway."
- id: 159
  category: safe_driving_rules
  question: What should you do if you miss your exit on a controlled access highway?
  choices:
    A: Stop and back up to the missed exit.
    B: Make a U-turn through the median.
    C: Pull onto the shoulder and wait for traffic to clear before backing up.
    D: Get off at the next exit and come back to the exit you missed.
  answer: D
  explanation: The manual states, "If you miss your exit, DO NOT stop, back up, or
    try to turn around on the highway. You will have to get off the highway at the
    next exit and come back to the exit you missed."
- id: 160
  category: safe_driving_rules
  question: What is a unique feature of driving through a Diverging Diamond Interchange
    (DDI)?
  choices:
    A: You must stop at all entrance ramps.
    B: You will travel on the left side of the roadway for a short distance.
    C: You are required to drive in a complete circle.
    D: You must yield to traffic entering from the left.
  answer: B
  explanation: The manual states, "When driving through a DDI, you will travel on
    the left side of the roadway for a short distance."
- id: 161
  category: defensive_driving
  question: How can you avoid "highway hypnosis" while driving?
  choices:
    A: By constantly moving your eyes and watching traffic and signs.
    B: By staring straight ahead at the center line.
    C: By driving slightly above the speed limit.
    D: By keeping your windows rolled up and the radio off.
  answer: A
  explanation: The manual states, "You can avoid highway hypnosis by constantly moving
    your eyes and watching the traffic and highway signs around you."
- id: 162
  category: defensive_driving
  question: What is the cellular phone number to call in an emergency on Missouri
    roadways?
  choices:
    A: '*911'
    B: '*55'
    C: '*HP'
    D: '*44'
  answer: B
  explanation: The manual states, "The cellular number to call in an emergency is
    *55."
- id: 163
  category: signs_and_signals
  question: What does a yellow pavement line on the roadway indicate?
  choices:
    A: It separates traffic traveling in the same direction.
    B: It marks the right edge of the road.
    C: It separates traffic traveling in opposite directions.
    D: It indicates a pedestrian crosswalk.
  answer: C
  explanation: The manual states, "Yellow separates traffic traveling in opposite
    directions."
- id: 164
  category: signs_and_signals
  question: What does a center marking consisting of two solid yellow lines indicate?
  choices:
    A: Traffic on the other side is moving in the same direction.
    B: You may cross the lines to pass if the way is clear.
    C: You should never cross the two solid yellow lines to pass.
    D: You are approaching an intersection.
  answer: C
  explanation: The manual states, "The yellow lines tell you the traffic on the other
    side of the lines is moving in the opposite direction. You should never cross
    the two solid yellow lines to pass."
- id: 165
  category: signs_and_signals
  question: When required to stop because of a sign or signal, where must you stop
    your vehicle?
  choices:
    A: Just past the stop line so you can see traffic.
    B: Before your vehicle reaches the stop line or crosswalk.
    C: Inside the crosswalk.
    D: At least 20 feet before the stop line.
  answer: B
  explanation: The manual states, "When required to stop because of a sign or signal,
    you must stop before your vehicle reaches the stop line or, if there is one, the
    crosswalk."
- id: 166
  category: defensive_driving
  question: If your vehicle breaks down and you have a flat tire, what should you
    NEVER do?
  choices:
    A: Turn on your emergency flashers.
    B: Try to change a tire if it means you have to be in a traffic lane.
    C: Tie a white cloth to the antenna or door handle.
    D: Place emergency flares behind the vehicle.
  answer: B
  explanation: The manual states, "Never stand in the roadway. Do not try to change
    a tire if it means you have to be in a traffic lane."
- id: 167
  category: safe_driving_rules
  question: What must you do when approaching an intersection with a crosswalk but
    no marked lines?
  choices:
    A: Proceed without yielding if there are no lines painted on the road.
    B: Yield to pedestrians in or about to enter the crosswalk.
    C: Sound your horn to warn pedestrians before driving through.
    D: Stop only if a traffic signal is currently red.
  answer: B
  explanation: The manual states that not all crosswalks are marked, and you must
    yield to pedestrians in or about to enter a crosswalk. You must be alert for pedestrians
    when crossing intersections that do not have defined crosswalks.
- id: 168
  category: signs_and_signals
  question: You are in a dual-use lane and want to turn. The traffic signal shows
    only a straight arrow. What should you do?
  choices:
    A: Turn cautiously if the intersection is clear of oncoming traffic.
    B: Proceed straight and turn at the next available intersection.
    C: Wait for the turn arrow to appear before making your turn.
    D: Merge into the adjacent lane to make your turn.
  answer: C
  explanation: According to the manual, if you want to turn in a dual-use lane and
    only the straight arrow is showing, you must wait for the turn arrow.
- id: 169
  category: defensive_driving
  question: Why should you never pass a vehicle on the shoulder of the road?
  choices:
    A: It is illegal unless you are driving a commercial vehicle.
    B: Other drivers will not expect you to be there and may pull off the road without
      looking.
    C: The shoulder is reserved strictly for law enforcement vehicles.
    D: Shoulders are always too soft to support the weight of a passenger vehicle.
  answer: B
  explanation: The manual warns to never pass on the shoulder because "Other drivers
    will not expect you to be there and may pull off the road without looking."
- id: 170
  category: safe_driving_rules
  question: If a traffic officer signals for you to stop at a green light, what must
    you do?
  choices:
    A: Proceed cautiously because the traffic light is green.
    B: Stop, because you must obey traffic officers at all times.
    C: Honk your horn to get the officer's attention before proceeding.
    D: Pull over to the shoulder and wait for the light to turn red.
  answer: B
  explanation: You must obey traffic officers at all times. If an officer gives directions,
    you must do what they say and ignore any traffic signs or signals, including stopping
    at a green light.
- id: 171
  category: signs_and_signals
  question: What does a flashing red traffic light mean?
  choices:
    A: Slow down and proceed with caution.
    B: The traffic signal is broken and you automatically have the right-of-way.
    C: It means the same thing as a stop sign.
    D: Stop and wait for the light to turn solid green.
  answer: C
  explanation: According to the manual, a flashing red light means the same thing
    as a stop sign.
- id: 172
  category: signs_and_signals
  question: How should you treat an intersection where the traffic signals are dark
    or not working?
  choices:
    A: Yield to the vehicle on your left.
    B: Proceed through the intersection without stopping.
    C: Treat the intersection as a yield sign.
    D: Treat the intersection as a four-way stop.
  answer: D
  explanation: The manual states that dark signals, or traffic signals that aren't
    working, operate as a four-way stop.
- id: 173
  category: signs_and_signals
  question: What does a flashing yellow arrow indicate when you are turning left?
  choices:
    A: You have a protected turn and opposing traffic is stopped.
    B: You are allowed to turn but must wait for an adequate gap in opposing traffic.
    C: You must stop and wait for a solid green arrow.
    D: The traffic signal is about to turn red.
  answer: B
  explanation: A flashing yellow arrow tells you that you are allowed to drive in
    the direction the arrow is pointing but are required to wait for an adequate gap
    in the opposing traffic prior to making your turn.
- id: 174
  category: signs_and_signals
  question: What color is used for traffic signs indicating public recreation and
    cultural interests?
  choices:
    A: Blue
    B: Green
    C: Brown
    D: Orange
  answer: C
  explanation: The manual's sign color chart indicates that Brown is used for Public
    Recreation & Cultural Interests.
- id: 175
  category: signs_and_signals
  question: Which sign shape is used exclusively for warning signs?
  choices:
    A: Octagon
    B: Vertical Rectangle
    C: Diamond
    D: Pennant
  answer: C
  explanation: According to the sign shapes chart in the manual, the Diamond shape
    is used for Warning signs.
- id: 176
  category: signs_and_signals
  question: What shape is a school zone or school crossing sign?
  choices:
    A: Pentagon
    B: Round
    C: Triangle
    D: Horizontal Rectangle
  answer: A
  explanation: The manual's sign shapes chart specifies that a Pentagon shape is used
    for School signs.
- id: 177
  category: signs_and_signals
  question: What does an "Added Lane" sign indicate?
  choices:
    A: Two lanes of traffic will soon become one lane.
    B: Traffic from another road is entering, but no merging is necessary because
      a lane has been added.
    C: You must merge left to allow entering traffic to join the roadway.
    D: The road will soon become two-way traffic divided by a median.
  answer: B
  explanation: The "Added Lane" sign means traffic from another road will be entering
    the road, and no merging is necessary because a lane has been added.
- id: 178
  category: signs_and_signals
  question: What is the difference between a Curve sign and a Turn sign?
  choices:
    A: A Turn sign indicates a recommended maximum speed of 30 mph or less, while
      a Curve sign is for recommended speeds less than the posted limit but generally
      higher than 30 mph.
    B: A Curve sign is only used on divided highways, while a Turn sign is used on
      two-lane roads.
    C: A Turn sign means you must come to a complete stop, while a Curve sign means
      you only need to slow down.
    D: There is no difference; they are used interchangeably on all roads.
  answer: A
  explanation: The manual states a turn sign warns of a sharp turn where the recommended
    maximum speed is 30 mph or less, whereas a curve sign warns of a curve where the
    recommended speed is less than the posted speed limit.
- id: 179
  category: vehicle_information
  question: What does a reflective orange triangle on the rear of a vehicle mean?
  choices:
    A: The vehicle is carrying hazardous materials.
    B: The vehicle is traveling less than 25 mph.
    C: The vehicle is broken down and cannot move.
    D: The vehicle is a wide load and you cannot pass.
  answer: B
  explanation: A reflective orange triangle on the rear of a vehicle is a Slow Moving
    Vehicle sign, which means the vehicle is traveling less than 25 mph.
- id: 180
  category: safe_driving_rules
  question: How are shared center lanes marked on the pavement?
  choices:
    A: By double solid white lines on each side.
    B: By a single dashed white line in the center.
    C: By a solid yellow and dashed yellow line on each side.
    D: By double solid yellow lines on each side.
  answer: C
  explanation: The manual states that shared center lanes are marked on each side
    by a solid yellow and dashed yellow lines.
- id: 181
  category: signs_and_signals
  question: What shape and color are most regulatory signs?
  choices:
    A: Diamond-shaped and yellow
    B: Round and blue
    C: Square or rectangular and white with black or red letters
    D: Triangular and orange
  answer: C
  explanation: Many regulatory signs are square- or rectangular-shaped and are white,
    with black or red letters or symbols.
- id: 182
  category: safe_driving_rules
  question: If you approach a stop sign at an intersection with no stop line or crosswalk,
    where must you stop?
  choices:
    A: At the exact location of the stop sign
    B: Before entering the intersection
    C: Ten feet before the intersection
    D: You do not need to stop if the intersection is clear
  answer: B
  explanation: If there is no stop line or crosswalk, you must pull up and stop near
    the edge of the intersection before entering it.
- id: 183
  category: safe_driving_rules
  question: Under normal roadway conditions, what is the minimum speed you may drive
    on an interstate highway in Missouri?
  choices:
    A: 30 mph
    B: 40 mph
    C: 45 mph
    D: 50 mph
  answer: B
  explanation: You may not drive slower than 40 mph on interstate highways under normal
    roadway conditions.
- id: 184
  category: safe_driving_rules
  question: Unless posted otherwise, what is the default speed limit in any city,
    town, or village in Missouri?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: The speed limit in any city, town, or village is 25 mph, unless posted
    otherwise.
- id: 185
  category: safe_driving_rules
  question: What is the maximum speed limit on lettered roads in Missouri, unless
    posted otherwise?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: C
  explanation: According to the maximum speed guide in the manual, the speed limit
    for lettered roads is 55 mph.
- id: 186
  category: safe_driving_rules
  question: When you must stop at a railroad crossing because the red lights are flashing
    or the gate is down, how far from the tracks must you stop?
  choices:
    A: 5 to 10 feet
    B: 10 to 15 feet
    C: 15 to 50 feet
    D: 50 to 100 feet
  answer: C
  explanation: You must stop within 15 to 50 feet before the railroad tracks if the
    red lights are flashing or the gate is down.
- id: 187
  category: safe_driving_rules
  question: Why is it advised not to shift gears when crossing railroad tracks?
  choices:
    A: It damages the transmission.
    B: It causes the vehicle to speed up too quickly.
    C: Your vehicle might stall.
    D: It is illegal.
  answer: C
  explanation: It is not wise to shift gears when crossing railroad tracks, just in
    case your vehicle might stall.
- id: 188
  category: signs_and_signals
  question: A white, X-shaped "crossbuck" sign at a railroad crossing has the same
    meaning as which other sign?
  choices:
    A: Stop sign
    B: Yield sign
    C: Do Not Enter sign
    D: Speed Limit sign
  answer: B
  explanation: A white, X-shaped sign or "crossbuck" is located at the railroad crossing.
    This sign has the same meaning as a "yield" sign; therefore, you must yield to
    trains at crossings.
- id: 189
  category: signs_and_signals
  question: What color are work zone signs?
  choices:
    A: Fluorescent orange
    B: Bright yellow
    C: Neon green
    D: Reflective white
  answer: A
  explanation: Work zone signs are fluorescent orange and indicate some type of work
    is being performed on or alongside the roadway.
- id: 190
  category: safe_driving_rules
  question: In which type of work zone will you find a flagger providing traffic control
    to oncoming vehicles?
  choices:
    A: A mobile work zone
    B: A shoulder work zone
    C: A two-lane, two-way roadway with one lane closed
    D: A multi-lane interstate with all lanes open
  answer: C
  explanation: A Flagging Operation is work that takes place on a two-lane, two-way
    roadway with one lane closed. A flagger(s) will be present at the beginning and
    end points of the work zone providing traffic control.
- id: 191
  category: defensive_driving
  question: What should a driver expect to see when approaching a mobile work zone?
  choices:
    A: A permanent concrete barrier
    B: A protective vehicle with a flashing arrow panel
    C: A detour sign directing traffic off the highway
    D: A temporary stoplight
  answer: B
  explanation: When approaching the mobile work zone, a driver should expect to see
    a protective vehicle in the lane with a flashing arrow panel designating the correct
    lane to merge to.
- id: 192
  category: signs_and_signals
  question: What does a regulatory sign with a red circle and a red slash over a symbol
    indicate?
  choices:
    A: You must yield the right-of-way.
    B: You are approaching a hazard.
    C: You cannot do something, such as a U-turn.
    D: You must stop immediately.
  answer: C
  explanation: Some regulatory signs have a red circle with a red slash over a symbol.
    These indicate you cannot do something, for example, no left turn, or no U-turn.
- id: 193
  category: safe_driving_rules
  question: What should you do if you see a "Wrong Way" sign and realize you have
    entered a lane of oncoming traffic?
  choices:
    A: Honk your horn and continue driving slowly.
    B: Reverse your vehicle until you reach the intersection.
    C: Pull off the road as quickly and safely as possible, turn around, and go back.
    D: Stop in your lane and wait for traffic to clear.
  answer: C
  explanation: If you made a wrong turn and have entered a lane of oncoming traffic,
    you must, as quickly and safely as possible, pull off the road, turn around and
    go back.
- id: 194
  category: signs_and_signals
  question: What color and shape are guide signs that show direction and distance
    to various locations?
  choices:
    A: Square or rectangular, blue with white lettering
    B: Square or rectangular, green or brown with white lettering
    C: Diamond-shaped, yellow with black lettering
    D: Circular, green with white lettering
  answer: B
  explanation: Guide signs are square or rectangular, and are green or brown with
    white lettering. They show direction and distance to various locations such as
    cities, airports, and state lines.
- id: 195
  category: signs_and_signals
  question: Which signs show the location of various services, such as rest areas
    and hospitals?
  choices:
    A: Guide signs
    B: Route signs
    C: Service signs
    D: Emergency reference markers
  answer: C
  explanation: Service signs are square or rectangular, and are blue with white letters
    or symbols. They show the location of various services, such as rest areas and
    hospitals.
- id: 196
  category: signs_and_signals
  question: How are north-south routes identified on route signs?
  choices:
    A: By even numbers
    B: By odd numbers
    C: By three-digit even numbers
    D: By three-digit odd numbers
  answer: B
  explanation: North-south routes are identified by odd numbers. East-west roads are
    identified by even numbers.
- id: 197
  category: signs_and_signals
  question: On an interstate traveling west to east, how are the exit numbers arranged?
  choices:
    A: They start at zero on the east and increase as you drive west.
    B: They start at zero on the west and increase as you drive east.
    C: They are numbered randomly based on the county.
    D: They start at zero at the state capital and increase outward.
  answer: B
  explanation: Interstates traveling west/east are numbered starting from the west
    and going east. This means exit numbers start at zero and increase as you drive
    east.
- id: 198
  category: signs_and_signals
  question: How often are emergency reference markers located along the outside shoulder
    of the interstate?
  choices:
    A: Every one-tenth of a mile
    B: Every two-tenths of a mile
    C: Every half mile
    D: Every full mile
  answer: B
  explanation: The reference markers are located every two-tenths of a mile, so motorists
    will always be in sight of a sign.
- id: 199
  category: safe_driving_rules
  question: What is the proper way to wear a vehicle seat belt?
  choices:
    A: The lap belt low and snug across the hips and the shoulder belt across the
      chest.
    B: The lap belt across the stomach and the shoulder belt under the arm.
    C: The lap belt low across the hips and the shoulder belt behind the back.
    D: The lap belt loosely across the thighs and the shoulder belt across the neck.
  answer: A
  explanation: Seat belts should always be worn with the lap belt low and snug across
    the hips and the shoulder belt across the chest. Shoulder belts should never be
    placed under the arm or behind the back.
- id: 200
  category: safe_driving_rules
  question: The National Highway Traffic Safety Administration recommends drivers
    sit with at least how much space between the center of their breastbone and the
    center of the steering wheel?
  choices:
    A: Five inches
    B: Eight inches
    C: Ten inches
    D: Twelve inches
  answer: C
  explanation: The National Highway Traffic Safety Administration recommends drivers
    sit with at least ten inches between the center of their breastbone and the center
    of the steering wheel to prevent injury from a deploying air bag.
- id: 201
  category: driver_responsibility
  question: According to Missouri law, who must be properly restrained when accompanying
    an intermediate driver license holder?
  choices:
    A: Only the driver and front seat passengers
    B: Only children under the age of 12
    C: Only passengers in the back seat
    D: ALL passengers in the vehicle
  answer: D
  explanation: Missouri law requires that ALL passengers accompanying an intermediate
    driver license holder must be properly restrained.
- id: 202
  category: safe_driving_rules
  question: Under Missouri's Child Passenger Restraint Law, what is required for a
    child who is less than four years old?
  choices:
    A: They may use a standard vehicle safety belt if they weigh over 30 pounds.
    B: They must be secured in a child passenger restraint system appropriate for
      that child, regardless of weight.
    C: They must be secured in a booster seat.
    D: They are allowed to ride unrestrained in the back seat.
  answer: B
  explanation: Children less than four years old, regardless of weight, shall be secured
    in a child passenger restraint system appropriate for that child.
- id: 203
  category: safe_driving_rules
  question: A child who is six years old, weighs 50 pounds, and is 4'5" tall must
    be secured in what type of restraint?
  choices:
    A: A standard vehicle safety belt
    B: A rear-facing infant restraint
    C: A child passenger restraint system or booster seat
    D: No restraint is required by law
  answer: C
  explanation: Children at least four years of age but less than eight years of age,
    who also weigh at least 40 pounds but less than 80 pounds, and are also less than
    4'9" tall shall be secured in a child passenger restraint system or booster seat.
- id: 204
  category: defensive_driving
  question: When approaching an intersection as a defensive driver, what should you
    do even if other traffic has a red light or stop sign?
  choices:
    A: Speed up to clear the intersection quickly.
    B: Look to the left and right.
    C: Honk your horn to warn other drivers.
    D: Rely completely on the traffic signal to keep others from crossing.
  answer: B
  explanation: At an intersection, look to the left and right, even if other traffic
    has a red light or a stop sign. Do not rely on traffic signals or signs to keep
    others from crossing in front of you.
- id: 205
  category: vehicle_information
  question: What is the recommended hand position on the steering wheel?
  choices:
    A: Left hand at 10 o'clock and right hand at 2 o'clock
    B: Left hand between 7 & 9 o'clock and right hand between 3 & 5 o'clock
    C: Both hands resting at the 6 o'clock position
    D: Left hand at 12 o'clock and right hand on the gear shift
  answer: B
  explanation: Use a proper grip. Place your left hand between the seven & nine o'clock
    positions and your right hand between the three & five o'clock positions on the
    steering wheel.
- id: 206
  category: vehicle_information
  question: Why should you never turn your vehicle's ignition key to the "lock" position
    while the vehicle is still in motion?
  choices:
    A: It will cause the engine to overheat.
    B: It will permanently damage the transmission.
    C: It will cause the steering wheel to lock, resulting in a loss of control.
    D: It will deploy the vehicle's air bags.
  answer: C
  explanation: Never turn your vehicle's ignition key to the "lock" position while
    your vehicle is still in motion. This will cause the steering wheel to lock if
    you try to turn the steering wheel, and you will lose control of your vehicle.
- id: 207
  category: defensive_driving
  question: What is a good way to measure a safe following distance between your vehicle
    and the vehicle in front of you?
  choices:
    A: The one car length rule
    B: The three second rule
    C: The five second rule
    D: The ten foot rule
  answer: B
  explanation: A good way to measure your safe following distance is to use the "three
    second rule." Count slowly, "one-thousand one, one-thousand two, one-thousand
    three" after the vehicle ahead passes an object.
- id: 208
  category: defensive_driving
  question: What should you do if you are being followed too closely (tailgated) by
    another driver and there is a right lane available?
  choices:
    A: Tap your brakes repeatedly to warn the driver.
    B: Speed up to increase the distance between vehicles.
    C: Move over to the right lane.
    D: Stop your vehicle in the lane.
  answer: C
  explanation: If you are followed too closely or "tailgated" by another driver, and
    there is a right lane, move over to the right.
- id: 209
  category: sharing_the_road
  question: If you are overtaking a bicycle and an oncoming vehicle is approaching
    at the same time, what is the safest action to take?
  choices:
    A: Speed up to pass the bicycle before the vehicle reaches you.
    B: Honk your horn so the bicycle moves off the road.
    C: Move closer to the bicycle to leave room for the oncoming vehicle.
    D: Slow down and let the oncoming vehicle pass first so you can give extra room
      to the bicycle.
  answer: D
  explanation: The manual advises taking potential hazards one at a time. If overtaking
    a bicycle with an oncoming vehicle approaching, slow down and let the vehicle
    pass first so you can give extra room to the bicycle.
- id: 210
  category: safe_driving_rules
  question: 'A vehicle''s total stopping distance is equal to:'
  choices:
    A: Braking distance plus following distance.
    B: Reaction distance plus braking distance.
    C: Reaction distance plus following distance.
    D: Braking distance minus reaction distance.
  answer: B
  explanation: According to the manual, your stopping distance equals your reaction
    distance plus your braking distance.
- id: 211
  category: safe_driving_rules
  question: How far in advance should you try to signal before making a turn or lane
    change?
  choices:
    A: At least 50 feet.
    B: At least 100 feet.
    C: At least 200 feet.
    D: At least 500 feet.
  answer: B
  explanation: The manual states that you should try to signal at least 100 feet before
    you make your move.
- id: 212
  category: safe_driving_rules
  question: 'If you plan to turn, but there are other streets or driveways between
    you and where you want to turn, you should:'
  choices:
    A: Signal at least 500 feet in advance regardless of the driveways.
    B: Turn on your signal immediately to warn other drivers early.
    C: Wait until you have passed the other streets or driveways before signaling.
    D: Use your hand signals instead of your vehicle's turn signals.
  answer: C
  explanation: The manual advises that if there are other streets, driveways, or entrances
    between you and where you want to turn, wait until you have passed them to signal.
- id: 213
  category: safe_driving_rules
  question: According to the manual, what is the only acceptable reason to use your
    horn?
  choices:
    A: To show anger or frustration at another driver.
    B: To warn other drivers.
    C: To let a slow driver know you want to pass.
    D: To greet pedestrians or bicyclists.
  answer: B
  explanation: 'The manual states there is only one reason to use your horn: to warn
    other drivers. It should not be used as a display of anger or frustration.'
- id: 214
  category: safe_driving_rules
  question: Under normal driving conditions, when is it legal to drive slower than
    the posted minimum speed?
  choices:
    A: It is never legal under normal driving conditions.
    B: When you are driving a newly purchased vehicle.
    C: When you are looking for a specific address.
    D: When you are driving in the right lane.
  answer: A
  explanation: It is against the law to drive slower than the posted minimum speed
    under normal driving conditions. You may only drive more slowly in bad weather,
    heavy traffic, or on a bad road.
- id: 215
  category: safe_driving_rules
  question: Which of the following is a recommended practice to avoid deadly carbon
    monoxide poisoning?
  choices:
    A: Leave the motor running in a closed garage to warm up the vehicle.
    B: Use the heater in a parked vehicle with the windows closed.
    C: Leave the vents open when following closely behind another vehicle.
    D: Do not drive with a defective muffler or exhaust system.
  answer: D
  explanation: 'To avoid carbon monoxide poisoning, the manual explicitly states:
    "Do not drive with a defective muffler or exhaust system."'
- id: 216
  category: defensive_driving
  question: During which months do most deer-related crashes occur?
  choices:
    A: February, March, and April.
    B: June, July, and August.
    C: January, May, and October through December.
    D: September and October only.
  answer: C
  explanation: The manual states that most deer-related crashes occur in January,
    May, and October through December.
- id: 217
  category: defensive_driving
  question: Why should you avoid applying too much brake pressure if a deer crash
    is unavoidable?
  choices:
    A: It will cause your airbags to deploy prematurely.
    B: It can cause the front end of the vehicle to drop, allowing the deer to strike
      the passenger compartment.
    C: It will cause the deer to freeze in the headlights.
    D: It will lock your steering wheel and prevent you from swerving.
  answer: B
  explanation: Too much brake pressure can cause the front end of the vehicle to drop
    down, striking the deer in the legs and allowing the body to come into the passenger
    compartment.
- id: 218
  category: vehicle_information
  question: Where can you find the recommended PSI (pounds per square inch) for your
    vehicle's tires?
  choices:
    A: On the sidewall of the tire itself.
    B: In the vehicle owner's manual or the driver's side door jam.
    C: On the vehicle's steering column.
    D: On the engine block.
  answer: B
  explanation: The manual states to check the tire pressure using the recommended
    PSI located in the vehicle owner’s manual or the driver’s side door jam of the
    vehicle.
- id: 219
  category: vehicle_information
  question: 'When using the penny test to check tire wear, your tires are considered
    unsafe and have greatly reduced grip if the tread is below approximately:'
  choices:
    A: 1/32 of an inch.
    B: 2/32 of an inch.
    C: 3/32 of an inch.
    D: 4/32 of an inch.
  answer: B
  explanation: The manual states that if your tread gets below approximately 2/32
    of an inch, your car's ability to grip the road in adverse conditions is greatly
    reduced.
- id: 220
  category: driver_responsibility
  question: What should you do with your hands when stopped by a law enforcement officer?
  choices:
    A: Keep them hidden under your legs.
    B: Reach into the glove compartment to retrieve your registration.
    C: Keep them on the steering wheel so they are easily observable.
    D: Wave them out the window to signal the officer.
  answer: C
  explanation: The manual instructs drivers to "Keep your hands on the steering wheel
    so they are easily observable" when stopped by law enforcement.
- id: 221
  category: driver_responsibility
  question: If you have a weapon in your vehicle during a traffic stop, when should
    you inform the law enforcement officer?
  choices:
    A: Only if the officer asks to search the vehicle.
    B: Upon first contact with the officer.
    C: After you have handed over your driver's license.
    D: You are not required to inform the officer.
  answer: B
  explanation: 'The manual states: "If you have a weapon(s) in the vehicle, inform
    the officer upon first contact."'
- id: 222
  category: defensive_driving
  question: If you see that a crash with a deer is unavoidable, what does the manual
    advise you to do?
  choices:
    A: Swerve off the road to the right.
    B: Swerve into the path of oncoming traffic.
    C: Do not swerve.
    D: Accelerate to minimize the impact time.
  answer: C
  explanation: 'The manual explicitly states: "If you see that a crash is unavoidable,
    do not swerve. Swerving off the road or into the path of an oncoming car can increase
    the risk of injury."'
- id: 223
  category: penalties_and_points
  question: What does your signature on a traffic ticket indicate?
  choices:
    A: An admission of guilt.
    B: A waiver of your right to an attorney.
    C: Acceptance of the ticket, but not an admission of guilt.
    D: An agreement to pay the fine immediately.
  answer: C
  explanation: The manual states, "Your acceptance and signature on a traffic ticket
    is not an admission of guilt; however, the refusal to sign a traffic ticket may
    result in your arrest."
- id: 224
  category: safe_driving_rules
  question: When are you required to turn on your headlights at night?
  choices:
    A: From 1 hour after sunset until 1 hour before sunrise.
    B: From ½ hour after sunset until ½ hour before sunrise.
    C: Only when it is completely dark outside.
    D: From sunset to sunrise.
  answer: B
  explanation: For driving at night, you should turn your headlights on from ½ hour
    after sunset until ½ hour before sunrise.
- id: 225
  category: safe_driving_rules
  question: When driving at night, you should use your low beams when you come within
    what distance of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: You should use your low beams when you come within 500 feet (about
    one block) of an oncoming vehicle.
- id: 226
  category: defensive_driving
  question: How far ahead do your headlights let you see when driving at night?
  choices:
    A: About 200 feet
    B: About 350 feet
    C: About 500 feet
    D: About 600 feet
  answer: B
  explanation: Do not overdrive your headlights. Your headlights only let you see
    about 350 feet ahead.
- id: 227
  category: safe_driving_rules
  question: 'You must use your headlights any time weather conditions require the
    use of:'
  choices:
    A: Your defroster
    B: Your windshield wipers
    C: Your emergency flashers
    D: Your fog lights
  answer: B
  explanation: The manual states, "You must use your headlights any time weather conditions
    require the use of your windshield wipers."
- id: 228
  category: defensive_driving
  question: What is the recommended safe following distance when driving on snow or
    ice?
  choices:
    A: Two to three seconds
    B: Three to four seconds
    C: Five to seven seconds
    D: Eight to ten seconds
  answer: D
  explanation: It will take longer to stop your vehicle when driving on snow or ice.
    Be sure to leave a safe distance, about eight to ten seconds, between your vehicle
    and any vehicle ahead of you.
- id: 229
  category: defensive_driving
  question: Which parts of the road will freeze and become slippery before other parts?
  choices:
    A: Intersections
    B: Bridges and overpasses
    C: Curves
    D: Uphill grades
  answer: B
  explanation: Remember that bridges and overpasses will freeze and become slippery
    before other parts of the road.
- id: 230
  category: defensive_driving
  question: At what speed can hydroplaning begin to happen on wet pavement?
  choices:
    A: Any speed over 25 mph
    B: Any speed over 35 mph
    C: Any speed over 45 mph
    D: Any speed over 55 mph
  answer: B
  explanation: Hydroplaning refers to a loss of traction and control on wet pavement,
    and it can happen at any speed over 35 mph.
- id: 231
  category: defensive_driving
  question: What should you do if you think your tires are hydroplaning?
  choices:
    A: Slam on the brakes immediately.
    B: Pump the brakes rapidly.
    C: Take your foot off the accelerator and slow down.
    D: Steer sharply toward the shoulder of the road.
  answer: C
  explanation: If you think your tires are hydroplaning, take your foot off the accelerator
    and slow down. Do not hit the brakes as this may cause you to skid.
- id: 232
  category: vehicle_information
  question: If your vehicle is equipped with an Anti-Lock Braking System (ABS), what
    should you do during an emergency braking situation?
  choices:
    A: Pump the brakes rapidly.
    B: Maintain a firm and continuous pressure on the brake while steering.
    C: Take your foot off the brake and use the emergency brake.
    D: Press the brake lightly and avoid steering.
  answer: B
  explanation: If your car is equipped with ABS, maintain a firm and continuous pressure
    on the brake while steering to enable the four-wheel ABS to work properly. Do
    not pump your brakes.
- id: 233
  category: defensive_driving
  question: How should you handle a vehicle skid?
  choices:
    A: Hit the brakes and hold the steering wheel straight.
    B: Gently turn your steering wheel in the direction that your rear wheels are
      sliding.
    C: Turn your steering wheel in the opposite direction of the skid.
    D: Accelerate to regain traction.
  answer: B
  explanation: To handle a skid, take your foot off the accelerator, DO NOT hit the
    brakes, and gently turn your steering wheel in the direction that your rear wheels
    are sliding.
- id: 234
  category: safe_driving_rules
  question: 'When driving in fog, you should keep your headlights on:'
  choices:
    A: High beam
    B: Low beam
    C: Auto setting
    D: Parking lights only
  answer: B
  explanation: Keep your headlights on low beam. In fog, you will see less if your
    lights are on high beam.
- id: 235
  category: defensive_driving
  question: What is the first thing you should do if your brake pedal suddenly sinks
    to the floor?
  choices:
    A: Turn off the ignition key immediately.
    B: Shift to a high gear.
    C: Pump the brake pedal fast and hard several times.
    D: Pull the emergency brake as hard as you can.
  answer: C
  explanation: If your brake pedal suddenly sinks to the floor, pump the brake pedal
    fast and hard several times. If that does not work, use your emergency or parking
    brake gradually.
- id: 236
  category: driver_responsibility
  question: What should you do to assist with visibility if you are pulled over by
    a law enforcement officer at nighttime?
  choices:
    A: Turn on your high beams.
    B: Turn on your hazard lights and exit the vehicle.
    C: Turn on your interior lights as soon as you stop.
    D: Shine a flashlight out the window.
  answer: C
  explanation: If it’s nighttime, the officer may direct a spotlight at your vehicle
    once stopped. To assist with visibility, turn on your interior lights as soon
    as you stop to help the officer see inside your vehicle.
- id: 237
  category: defensive_driving
  question: If you experience a tire blowout while driving, what is the correct action
    to take regarding the brakes?
  choices:
    A: Slam on the brakes immediately to stop.
    B: Pump the brakes rapidly to maintain control.
    C: Do not hit the brakes until the vehicle is almost stopped.
    D: Apply steady, hard pressure to the brakes.
  answer: C
  explanation: During a tire blowout, you should take your foot off the accelerator
    but do not hit the brakes. Apply the brakes only when the vehicle is almost stopped.
- id: 238
  category: defensive_driving
  question: What should you do if your wheels run off the paved edge of the road?
  choices:
    A: Jerk the steering wheel sharply to the left to get back on the road.
    B: Accelerate to regain traction on the dirt.
    C: Slam on the brakes to stop immediately.
    D: Hold the steering wheel tightly and take your foot off the accelerator.
  answer: D
  explanation: If your wheels run off the paved edge, hold the steering wheel tightly,
    take your foot off the accelerator, and do not hit the brakes. Only apply gentle
    brake pressure if necessary.
- id: 239
  category: defensive_driving
  question: If your accelerator becomes stuck while driving, what gear should you
    shift into?
  choices:
    A: Park
    B: Reverse
    C: Neutral
    D: First gear
  answer: C
  explanation: If your accelerator becomes stuck, you should shift to neutral, apply
    the brakes, and try to drive safely off the road.
- id: 240
  category: defensive_driving
  question: If a vehicle is approaching head-on in your lane, why should you NOT swing
    over into the left lane?
  choices:
    A: The left lane is reserved for passing only.
    B: The other driver may pull back over into that lane, too.
    C: It is illegal to cross the center line in an emergency.
    D: Your vehicle will lose traction if you turn left.
  answer: B
  explanation: When a vehicle is approaching head-on, DO NOT swing over into the left
    lane because the other driver may pull back over into that lane, too. Instead,
    pull over to the right and sound your horn.
- id: 241
  category: safe_driving_rules
  question: If your vehicle stalls on railroad tracks and a train is approaching,
    in which direction should you run after exiting the vehicle?
  choices:
    A: In the direction the train is heading.
    B: In the direction the train is coming from.
    C: Perpendicular to the tracks.
    D: Parallel to the tracks in either direction.
  answer: B
  explanation: Run in the direction the train is coming from. If you run in the direction
    the train is heading, you may be hit with debris when the train hits your vehicle.
- id: 242
  category: vehicle_information
  question: According to the National Transportation Safety Board (NTSB), 12- and
    15-passenger vans are inherently unstable when carrying more than how many passengers?
  choices:
    A: Six
    B: Eight
    C: Ten
    D: Twelve
  answer: C
  explanation: The NTSB has determined that 12- and 15-passenger vans are inherently
    unstable when loaded to the level for which they are designed, carrying more than
    ten passengers.
- id: 243
  category: penalties_and_points
  question: What is a potential penalty if you injure or kill someone because you
    were drinking or using drugs while driving?
  choices:
    A: Spend two to seven years in jail.
    B: Pay a maximum fine of $1,000.
    C: Lose your driver license for one year.
    D: Complete 100 hours of community service.
  answer: A
  explanation: If you injure or kill someone because you were drinking or using drugs
    while driving, you may spend two to seven years in jail, pay a $5,000 fine, and/or
    lose your driver license for five years.
- id: 244
  category: penalties_and_points
  question: If a police officer stops you and your Blood Alcohol Content (BAC) level
    is .08% or more, how many days after receiving the notice will your license be
    suspended or revoked?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: The officer will take your license away and give you a notice stating
    that your license will be suspended or revoked (and you will not be able to legally
    drive) after 15 days.
- id: 245
  category: penalties_and_points
  question: What is the maximum jail time for a first offense of Driving While Intoxicated
    (DWI)?
  choices:
    A: Up to 30 days
    B: Up to six months
    C: Up to one year
    D: Up to four years
  answer: B
  explanation: For a 1st Offense DWI or BAC of .08% or more, you may spend up to six
    months in jail and pay up to a $500 fine.
- id: 246
  category: penalties_and_points
  question: Under Missouri's Abuse and Lose Law, for how long may your driver license
    be taken away if you are younger than 21 and possess or use alcohol while driving?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: If you are younger than 21 years of age, your driver license may be
    taken away for 90 days if you possess or use alcohol or drugs while driving a
    vehicle.
- id: 247
  category: penalties_and_points
  question: What is the driver license penalty for a first offense Minor in Possession
    (MIP)?
  choices:
    A: 15-day suspension
    B: 30-day suspension
    C: 90-day suspension
    D: One-year revocation
  answer: B
  explanation: For a 1st Offense Minor in Possession (MIP), the consequence is a 30-day
    suspension of your driver license.
- id: 248
  category: defensive_driving
  question: What should you do if your hood suddenly flies open and blocks your vision
    while driving?
  choices:
    A: Roll down the window so you can look around whatever is blocking your view.
    B: Slam on the brakes and stop in your lane immediately.
    C: Turn on your high beam headlights to see through the gap.
    D: Accelerate to force the hood back down.
  answer: A
  explanation: If your hood suddenly flies open or something else blocks your vision,
    roll down the window so you can look around whatever is blocking your view, turn
    on your emergency flashers, and pull off the road.
- id: 249
  category: defensive_driving
  question: If your vehicle's headlights go out, what is the first thing you should
    try?
  choices:
    A: Pull off the road immediately without signaling.
    B: Try the dimmer switch or headlight switch.
    C: Turn on your interior dome light.
    D: Honk your horn continuously.
  answer: B
  explanation: If your vehicle's headlights go out, try the dimmer switch or headlight
    switch, as that might turn them on again.
- id: 250
  category: penalties_and_points
  question: To get your license back after it is taken away under the Abuse and Lose
    Law, you must provide proof of insurance (SR-22 filing) for how long?
  choices:
    A: Six months
    B: One year
    C: Two years
    D: Five years
  answer: C
  explanation: To get your license back under the Abuse and Lose Law, you must provide
    proof of insurance for two years (SR-22 filing), pay a $45 fee, submit a SATOP
    form, and retake the complete driver exam.
- id: 251
  category: penalties_and_points
  question: What is the consequence for a first-offense Minor in Possession (MIP)
    or having a BAC of more than .02% as a minor?
  choices:
    A: 30-day suspension
    B: 90-day suspension
    C: One-year revocation
    D: 60-day suspension
  answer: A
  explanation: According to the manual, a 1st Offense for Minor in Possession (MIP)
    or having a BAC of more than .02% results in a 30-day suspension.
- id: 252
  category: penalties_and_points
  question: What penalty does a young person face for a third Minor in Possession
    (MIP) offense?
  choices:
    A: 30-day suspension
    B: 90-day suspension
    C: One-year revocation
    D: Five-year revocation
  answer: C
  explanation: The manual states that a 3rd Offense for Minor in Possession (MIP)
    results in a one-year revocation.
- id: 253
  category: penalties_and_points
  question: Who is exempt from filing proof of insurance (SR-22) for a first-offense
    intoxication-related charge?
  choices:
    A: Commercial drivers with a BAC of .04%
    B: Minors with a BAC of .02% or more
    C: Drivers over 21 with a BAC of .08%
    D: Anyone who refused a chemical test
  answer: B
  explanation: 'There is one exception to the SR-22 rule: Minors with a BAC of .02%
    or more do not have to file proof of insurance on a first-offense.'
- id: 254
  category: alcohol_drugs_health
  question: What happens to your driver license if you refuse to take a chemical test
    to determine your Blood Alcohol Content (BAC)?
  choices:
    A: It is suspended for 30 days.
    B: It is suspended for 90 days.
    C: It is taken away for one year.
    D: It is permanently revoked.
  answer: C
  explanation: If a police officer stops you and you refuse to take a chemical test
    to determine your BAC, your driver license will be taken away for one year.
- id: 255
  category: vehicle_information
  question: What vehicle components is an Ignition Interlock Device (IID) connected
    to?
  choices:
    A: The transmission, brakes, and steering wheel
    B: The ignition, horn, and headlights
    C: The speedometer, radio, and wipers
    D: The exhaust, battery, and alternator
  answer: B
  explanation: An ignition interlock device (IID) is a mechanical unit that is connected
    to the vehicle’s ignition, horn, and headlights.
- id: 256
  category: penalties_and_points
  question: If required, what is the minimum amount of time an Ignition Interlock
    Device (IID) must be maintained from your reinstatement date?
  choices:
    A: Three months
    B: Six months
    C: One year
    D: Two years
  answer: B
  explanation: The IID must be maintained for a minimum of six months from your reinstatement
    date without any violations in the last three months.
- id: 257
  category: penalties_and_points
  question: What is the penalty for a first-offense conviction of failing to have
    an Ignition Interlock Device (IID) installed as required by law?
  choices:
    A: A 30-day suspension
    B: A 90-day suspension
    C: A one-year revocation
    D: A five-year revocation
  answer: C
  explanation: If you receive a ticket for failing to have an IID installed as required
    by law and you are convicted in court, your driving privilege will be revoked
    for one year.
- id: 258
  category: alcohol_drugs_health
  question: How do the penalties for Driving While Intoxicated (DWI) differ if the
    impairment is caused by drugs instead of alcohol?
  choices:
    A: Drug impairment carries a lighter penalty.
    B: Drug impairment carries a harsher penalty.
    C: The penalties are exactly the same.
    D: Drug impairment only results in a warning for the first offense.
  answer: C
  explanation: The penalties for DWI in Missouri are exactly the same regardless of
    whether the impairment is from drugs or alcohol.
- id: 259
  category: penalties_and_points
  question: What is the maximum prison sentence and fine for a DWI conviction in Missouri?
  choices:
    A: Up to 30 days in prison and a $100 fine
    B: Up to 6 months in prison and a $500 fine
    C: Up to 1 year in prison and a $1,000 fine
    D: Up to 5 years in prison and a $5,000 fine
  answer: B
  explanation: The punishment for those convicted of DWI is up to six months in prison
    and a fine of up to $500 and the loss of driving privileges.
- id: 260
  category: alcohol_drugs_health
  question: What is the illegal Blood Alcohol Content (BAC) limit for a commercial
    vehicle driver in Missouri?
  choices:
    A: 0.02% or more
    B: 0.04% or more
    C: 0.06% or more
    D: 0.08% or more
  answer: B
  explanation: It is illegal to drive with a blood alcohol content (BAC) of 0.08%
    or more, but the limit is 0.04% for commercial vehicle drivers.
- id: 261
  category: alcohol_drugs_health
  question: How can diet pills and "uppers" affect a driver after the initial short-term
    alertness wears off?
  choices:
    A: They improve night vision and reaction time.
    B: They cause a person to be nervous, dizzy, and unable to concentrate.
    C: They permanently increase the driver's attention span.
    D: They lower the driver's blood alcohol content.
  answer: B
  explanation: Pep pills, “uppers,” and diet pills can make a driver more alert for
    a short time. Later, however, they can cause a person to be nervous, dizzy, and
    not able to concentrate.
- id: 262
  category: alcohol_drugs_health
  question: Which of the following statements is true regarding driving under the
    influence of marijuana in Missouri?
  choices:
    A: It is legal as long as the driver has a medical marijuana card.
    B: It is only illegal if combined with alcohol.
    C: It is never legal or safe to drive while under the influence of marijuana.
    D: It is legal if the driver's BAC is below 0.08%.
  answer: C
  explanation: Even though medical marijuana was approved by Missouri voters effective
    in 2020, it is never legal or safe to drive while under the influence of marijuana.
- id: 263
  category: alcohol_drugs_health
  question: According to research studies, what is a negative effect of marijuana
    on drivers?
  choices:
    A: Decreased lane weaving
    B: Improved judgment of time and distance
    C: Poor reaction time
    D: Increased coordination
  answer: C
  explanation: Research studies have shown negative effects of marijuana on drivers,
    including an increase in lane weaving, poor reaction time, and altered attention
    to the road.
- id: 264
  category: alcohol_drugs_health
  question: What is one of the greatest predictors of someone developing a substance
    use disorder or addiction?
  choices:
    A: Early use of harmful substances
    B: Driving a commercial vehicle
    C: Taking over-the-counter allergy medication
    D: Having a fully developed brain
  answer: A
  explanation: One of the greatest predictors of someone developing an addiction is
    early use. A young person’s under-developed brain can become damaged quicker and
    more severely.
- id: 265
  category: penalties_and_points
  question: How long must proof of insurance (SR-22) be kept on file with the Driver
    License Bureau for an intoxication-related offense?
  choices:
    A: Six months
    B: One year
    C: Two years
    D: Five years
  answer: C
  explanation: Proof of insurance must be kept on file with the Driver License Bureau
    for two years.
- id: 266
  category: penalties_and_points
  question: According to Missouri state law, how many points will be added to your
    driving record if you are convicted of speeding?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: The manual states that under state law violations, a conviction for
    speeding carries a point value of 3 points.
- id: 267
  category: penalties_and_points
  question: What action will the Department take if you accumulate a total of 4 points
    in 12 months?
  choices:
    A: Suspend your license for 30 days
    B: Revoke your license for one year
    C: Send you a point accumulation advisory
    D: Require you to retake the driving test
  answer: C
  explanation: If you accumulate a total of 4 points in 12 months, the Department
    will send you a point accumulation advisory.
- id: 268
  category: penalties_and_points
  question: Your driving privilege will be suspended if you accumulate how many points
    in an 18-month period?
  choices:
    A: 4 or more points
    B: 6 or more points
    C: 8 or more points
    D: 12 or more points
  answer: C
  explanation: If you accumulate a total of 8 or more points in 18 months, your driving
    privilege will be suspended.
- id: 269
  category: penalties_and_points
  question: If you accumulate 8 points in 18 months, how long will your first driving
    privilege suspension last?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: A
  explanation: The consequences for accumulating 8 points in 18 months include a 30-day
    suspension for the 1st suspension.
- id: 270
  category: penalties_and_points
  question: Which of the following point accumulations will result in your driving
    privilege being revoked for one year?
  choices:
    A: 8 or more points in 12 months
    B: 12 or more points in 12 months
    C: 12 or more points in 24 months
    D: 18 or more points in 36 months
  answer: B
  explanation: Your driving privilege will be revoked for one year if you accumulate
    12 or more points in 12 months, 18 or more points in 24 months, or 24 or more
    points in 36 months.
- id: 271
  category: penalties_and_points
  question: What must you do to reinstate your driving privilege after a non-alcohol
    related point suspension?
  choices:
    A: Pay a $50 fee and retake the written test
    B: Submit proof of insurance (SR-22) and pay a $20 reinstatement fee
    C: Complete a defensive driving course and pay a $20 fee
    D: Submit proof of insurance (SR-22) and pay a $45 fee
  answer: B
  explanation: For a non-alcohol related point suspension or revocation, you will
    need to submit proof of insurance (SR-22) and pay a $20 reinstatement fee.
- id: 272
  category: penalties_and_points
  question: After your driving privilege is reinstated, your points are reduced to
    four. How are your remaining points reduced after one year of driving without
    getting new points?
  choices:
    A: Reduced to zero
    B: Reduced by one-half
    C: Reduced by one-third
    D: Reduced by two points
  answer: C
  explanation: After one year of driving without getting new points on your record,
    the remaining points will be reduced by one-third.
- id: 273
  category: penalties_and_points
  question: What is a potential consequence if you are convicted of driving while
    your license is suspended?
  choices:
    A: Your driving privilege may be revoked for one year
    B: You will receive 4 points on your record
    C: Your vehicle will be permanently confiscated
    D: You will be convicted of a felony
  answer: A
  explanation: If you drive while your license is suspended, your driving privilege
    may be revoked for one year after you are convicted.
- id: 274
  category: penalties_and_points
  question: If you fail to appear in court for a traffic violation, how many days
    does the court give you to pay the fines before notifying the Driver License Bureau?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: When you fail to appear in court for a traffic violation, the court
    will give you 30 days to pay the fines before notifying the Driver License Bureau
    (DLB).
- id: 275
  category: vehicle_information
  question: How many days do you have to apply for a title after buying a vehicle
    to avoid paying a penalty fee?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: When you buy a vehicle, you must apply for a title within 30 days.
    If you do not apply within 30 days, you will have to pay a penalty fee.
- id: 276
  category: vehicle_information
  question: Where does the Missouri driver's manual recommend keeping your vehicle's
    title?
  choices:
    A: In the vehicle's glove compartment
    B: Under the driver's seat
    C: In the trunk of the vehicle
    D: Not in your vehicle
  answer: D
  explanation: 'A title is a very important personal document. The manual explicitly
    states: Do NOT keep your title in your vehicle.'
- id: 277
  category: vehicle_information
  question: When buying a new vehicle in Missouri, what document will the dealer give
    you to indicate the vehicle has never been registered?
  choices:
    A: A Manufacturer's Statement of Origin (MSO)
    B: An ID/OD verification form
    C: A salvage title
    D: A bill of sale only
  answer: A
  explanation: For a new vehicle bought in Missouri, the dealer will give you a title
    application and an assigned Manufacturer’s Statement of Origin (MSO), which indicates
    the vehicle is new and has never been registered.
- id: 278
  category: vehicle_information
  question: For which vehicles is a proper odometer disclosure required when buying
    or selling?
  choices:
    A: All vehicles regardless of age
    B: Vehicles model year 2011 and newer until the vehicle reaches 20 years old
    C: Only vehicles manufactured before 2011
    D: Vehicles that are more than 20 years old
  answer: B
  explanation: When you buy or sell a vehicle, the seller must write the mileage reading
    on the title assignment if the model year is 2011 or newer and the vehicle is
    less than 20 years old.
- id: 279
  category: vehicle_information
  question: If you buy a used vehicle and the title assigned to you is an out-of-state
    title, what must you obtain?
  choices:
    A: A new Manufacturer's Statement of Origin
    B: An identification number and odometer (ID/OD) verification form
    C: A Missouri salvage title
    D: A special permit from the highway patrol
  answer: B
  explanation: If the title assigned to you is an out-of-state title, you must get
    an identification number and odometer (ID/OD) verification form completed by a
    licensed inspection station.
- id: 280
  category: penalties_and_points
  question: How many points will be assessed to your driving record for obtaining
    a driver license by misrepresentation?
  choices:
    A: 3 points
    B: 4 points
    C: 8 points
    D: 12 points
  answer: D
  explanation: According to the point value chart in the manual, obtaining a driver
    license by misrepresentation results in 12 points.
- id: 281
  category: vehicle_information
  question: What is the registration fee for a passenger vehicle based on in Missouri?
  choices:
    A: The vehicle's gross weight
    B: The vehicle's taxable horsepower
    C: The vehicle's age
    D: The vehicle's zone and gross weight
  answer: B
  explanation: If you are registering a passenger vehicle, your registration fee will
    be based on your vehicle's taxable horsepower.
- id: 282
  category: vehicle_information
  question: Under what condition are you eligible to obtain a two-year registration
    for your vehicle during an even-numbered year?
  choices:
    A: If you have a clean driving record
    B: If your vehicle has an odd-numbered model year
    C: If your vehicle has an even-numbered model year
    D: If you pay double the processing fee
  answer: C
  explanation: During an even-numbered year (like 2018) you may register for two years
    if your vehicle has an even-numbered model year.
- id: 283
  category: vehicle_information
  question: 'When renewing your vehicle registration, a current certificate of safety
    and/or emissions inspection must have been completed within the last:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: You must provide a current certificate of safety and/or emissions inspection
    done within the last 60 days, if applicable.
- id: 284
  category: driver_responsibility
  question: How many days do you have to report the sale of your motor vehicle by
    submitting a Notice of Sale (Form 5049)?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: State law requires you to report the sale of your motor vehicle or
    all-terrain vehicle by completing a Notice of Sale (Form 5049) and submitting
    it to any license office or to the address on the form within 30 days.
- id: 285
  category: vehicle_information
  question: How many times per year can you replace stolen license plates and tabs
    at no cost (excluding the processing fee) if you sign a notarized affidavit?
  choices:
    A: One time
    B: Two times
    C: Three times
    D: Unlimited times
  answer: B
  explanation: State law allows you to replace stolen license plates and tabs up to
    two times per year at NO COST (a $9.00 processing fee is applicable) if you sign
    a notarized affidavit certifying the plates or tabs were stolen.
- id: 286
  category: driver_responsibility
  question: What is the minimum level of liability coverage required by state law
    for property damage per crash?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: The minimum level of coverage required by state law includes $25,000
    per crash for property damage.
- id: 287
  category: driver_responsibility
  question: What is the minimum required liability insurance coverage for bodily injury
    per person?
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $75,000
  answer: B
  explanation: The minimum level of coverage required by state law includes $25,000
    per person for bodily injury.
- id: 288
  category: driver_responsibility
  question: Which of the following is an acceptable way to show proof of insurance
    when registering a vehicle?
  choices:
    A: A verbal statement from your insurance agent
    B: A hand held electronic device showing your policy
    C: A photocopy of your vehicle title
    D: A bank statement showing an insurance payment
  answer: B
  explanation: Acceptable ways to provide proof of insurance include a hand held electronic
    device, an original ID card, a policy or binder, or a paid insurance receipt.
- id: 289
  category: driver_responsibility
  question: To qualify to be self-insured in Missouri, you must have more than how
    many vehicles?
  choices:
    A: 5 vehicles
    B: 10 vehicles
    C: 25 vehicles
    D: 50 vehicles
  answer: C
  explanation: To be self-insured, you must have more than 25 vehicles and be able
    to show you can and will pay for damage caused by your vehicles.
- id: 290
  category: penalties_and_points
  question: If your driver license and license plates are suspended for failing to
    keep insurance, what form must you file to prove you have insurance?
  choices:
    A: Form 5049
    B: SR-22
    C: Form 1099
    D: SR-10
  answer: B
  explanation: The most common way to file proof of insurance is through an SR-22
    insurance filing. Contact your insurance company or agent to file the SR-22 form.
- id: 291
  category: penalties_and_points
  question: What is the penalty for a second suspension within two years for failing
    to maintain insurance?
  choices:
    A: 30-day suspension and a $100 fee
    B: 90-day suspension and a $200 fee
    C: 6-month suspension and a $300 fee
    D: 1-year suspension and a $400 fee
  answer: B
  explanation: For two suspensions (within two years of each other), your driver license
    and/or license plates will be suspended for 90 days. You must also pay a $200
    fee and file proof of insurance for three years.
- id: 292
  category: penalties_and_points
  question: What fee must you pay to reinstate your license after a third suspension
    for failing to maintain insurance?
  choices:
    A: $20
    B: $100
    C: $200
    D: $400
  answer: D
  explanation: For three (or more) suspensions, your driver license and/or license
    plates will be suspended for one year. You must also pay a $400 fee and file proof
    of insurance for three years.
- id: 293
  category: penalties_and_points
  question: What happens if you are at fault in an accident and do not pay for the
    damages you caused?
  choices:
    A: Your vehicle will be impounded for 30 days.
    B: Your driver license and/or vehicle license plates will be suspended for one
      year.
    C: You will be required to retake the driving test.
    D: You will receive a warning letter from the Department of Revenue.
  answer: B
  explanation: If you are at fault in an accident and do not pay for the damages you
    caused, your driver license and/or vehicle license plates will be suspended for
    one year.
- id: 294
  category: driver_responsibility
  question: State law requires you to have uninsured motorist coverage of what amount
    for bodily injury per crash?
  choices:
    A: $25,000
    B: $50,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: The law also requires you to have uninsured motorist coverage of $25,000
    for bodily injury per person and $50,000 for bodily injury per crash.
- id: 295
  category: vehicle_information
  question: If you do not receive a vehicle registration renewal notice in the mail,
    what are you required to do?
  choices:
    A: Wait until the notice arrives before renewing.
    B: Drive legally without renewing until the Department contacts you.
    C: You are still required by law to renew your license plates before they expire.
    D: Apply for a completely new title and registration.
  answer: C
  explanation: If you do not receive the notice, you are still required by law to
    renew your license plates before they expire.
- id: 296
  category: penalties_and_points
  question: What is the penalty if you receive two driver license suspensions within
    two years of each other?
  choices:
    A: Your license will be suspended for 30 days and you must pay a $100 fee.
    B: Your license will be suspended for 90 days and you must pay a $200 fee.
    C: Your license will be suspended for 1 year and you must pay a $400 fee.
    D: Your license will be permanently revoked.
  answer: B
  explanation: According to the manual, if you have two suspensions within two years
    of each other, your driver license and/or license plates will be suspended for
    90 days, and you must pay a $200 fee and file proof of insurance for three years.
- id: 297
  category: penalties_and_points
  question: If you accumulate three or more suspensions, your driver license and/or
    license plates will be suspended for how long?
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 3 years
  answer: C
  explanation: The manual states that for three (or more) suspensions, your driver
    license and/or license plates will be suspended for one year, and you must pay
    a $400 fee.
- id: 298
  category: driver_responsibility
  question: What should you do if you are involved in a traffic crash with a parked
    vehicle?
  choices:
    A: Leave immediately if there is no visible damage to your vehicle.
    B: Leave a note on the windshield and drive away without reporting it.
    C: Do not leave, as leaving the scene of a traffic crash is a crime.
    D: Wait 10 minutes and leave if the owner does not appear.
  answer: C
  explanation: 'The manual explicitly states: "Even if you have a crash with a parked
    vehicle, do not leave. Leaving the scene of a traffic crash is a crime."'
- id: 299
  category: safe_driving_rules
  question: Under Missouri's "Move It" law, what are you required to do if you are
    involved in a minor, non-injury traffic crash?
  choices:
    A: Leave your vehicle exactly where it is until the police arrive.
    B: Move your vehicle onto the shoulder or other nearby location off the roadway.
    C: Wait for a tow truck to move your vehicle.
    D: Drive immediately to the nearest police station.
  answer: B
  explanation: A state law requires vehicles involved in minor, non-injury crashes
    to move off the road onto the shoulder or other nearby location to prevent major
    pileups and traffic backups.
- id: 300
  category: defensive_driving
  question: According to the Missouri driver's manual, secondary crashes cause what
    percentage of fatalities in Missouri?
  choices:
    A: 10 percent
    B: 18 percent
    C: 25 percent
    D: 30 percent
  answer: B
  explanation: The "Move It" law helps reduce the chance of motorists being involved
    in secondary crashes, which cause 18 percent of fatalities in Missouri.
- id: 301
  category: driver_responsibility
  question: If you are required to file an accident report with the Department of
    Revenue, within how many days must it be filed?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Under certain circumstances, state law requires the accident report
    to be filed within 30 days.
- id: 302
  category: driver_responsibility
  question: You must report an accident to the Driver License Bureau if someone involved
    did not have liability insurance and there is property damage exceeding what amount?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: You must report an accident if someone involved did not have liability
    insurance AND there is damage to one or more person's property in excess of $500,
    or there was personal injury or death.
- id: 303
  category: penalties_and_points
  question: What may happen to your driving privilege if you strike a highway worker
    or emergency responder within a designated construction, work, or emergency zone?
  choices:
    A: It will be suspended for exactly 30 days.
    B: It may be revoked.
    C: You will receive a warning and a fine.
    D: You will be required to take a defensive driving course.
  answer: B
  explanation: If you are involved in a motor vehicle crash and struck a highway worker
    or emergency responder within a designated construction, work, or emergency zone,
    your driving privilege may be revoked.
- id: 304
  category: vehicle_information
  question: How long is a standard vehicle safety inspection certificate valid for
    showing proof of inspection?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: If your vehicle passes the safety inspection, the inspection station
    will give you a certificate of inspection to show as proof. The certificate is
    good for 60 days.
- id: 305
  category: vehicle_information
  question: Motor vehicles are exempt from the safety inspection requirement for the
    first ten years following the model year of manufacture provided they have less
    than how many miles on the odometer?
  choices:
    A: 50,000 miles
    B: 100,000 miles
    C: 150,000 miles
    D: 200,000 miles
  answer: C
  explanation: Motor vehicles for the first ten years following the model year of
    manufacture and having less than 150,000 miles on the odometer are exempt from
    the safety inspection requirement.
- id: 306
  category: vehicle_information
  question: Which of the following types of vehicles is exempt from the Missouri safety
    inspection requirement?
  choices:
    A: All passenger cars over 5 years old
    B: All motorcycles
    C: All trailers
    D: All commercial trucks
  answer: C
  explanation: The manual lists "All trailers" as one of the exceptions to the safety
    inspection requirement.
- id: 307
  category: vehicle_information
  question: Your vehicle must have at least two functioning red taillights and reflectors
    that other drivers can see from what distance?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: Under required equipment, the manual states your vehicle must have
    at least two functioning red taillights and reflectors that other drivers can
    see from 500 feet.
- id: 308
  category: vehicle_information
  question: If your passenger car was made after June 30, 1964, what is the minimum
    seat belt requirement for the front seat?
  choices:
    A: One set of seat belts
    B: Two sets of seat belts
    C: Three sets of seat belts
    D: Seat belts are only required in the back seat
  answer: B
  explanation: 'The manual states: "Seat Belts — If your passenger car was made after
    June 30, 1964, it must have two sets of seat belts in the front seat."'
- id: 309
  category: vehicle_information
  question: If your vehicle was manufactured after 1967, what mirrors must it be equipped
    with to pass a safety inspection?
  choices:
    A: Only an inside rearview mirror.
    B: Only an outside rearview mirror.
    C: An inside and an outside rearview mirror.
    D: Two outside rearview mirrors.
  answer: C
  explanation: 'The manual states: "Mirrors — If your vehicle was made after 1967,
    it must have an inside and an outside rearview mirror."'
- id: 310
  category: vehicle_information
  question: What is the maximum allowed height for bumpers on passenger vehicles when
    measured at the highest point from the ground?
  choices:
    A: 18 inches
    B: 22 inches
    C: 26 inches
    D: 30 inches
  answer: B
  explanation: 'The manual states: "Bumpers on passenger vehicles may not exceed 22
    inches above the ground when measured at the highest point."'
- id: 311
  category: vehicle_information
  question: If you have a truck licensed in excess of 12,000 pounds and receive only
    one license plate, where must it be placed?
  choices:
    A: On the rear of the truck
    B: On the front of the truck
    C: Inside the front windshield
    D: On either the front or the rear
  answer: B
  explanation: If you have a truck licensed in excess of 12,000 pounds, you will only
    receive one plate, which must be placed on the front of the truck.
- id: 312
  category: vehicle_information
  question: Your vehicle must have a white light shining on the rear license plate
    so that the plate can be seen from what distance?
  choices:
    A: 25 feet
    B: 50 feet
    C: 100 feet
    D: 150 feet
  answer: B
  explanation: Your vehicle must have a white light shining on the rear license plate
    so the plate can be seen from 50 feet.
- id: 313
  category: safe_driving_rules
  question: Special equipment is required if a load overhangs the rear of your vehicle
    by more than how many feet?
  choices:
    A: Two feet
    B: Three feet
    C: Four feet
    D: Five feet
  answer: D
  explanation: You need special equipment if something in your vehicle overhangs the
    rear by more than five feet.
- id: 314
  category: safe_driving_rules
  question: When towing another vehicle, what is the maximum distance your towline
    can keep the vehicles apart?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: When you are towing another vehicle, your towline must keep the vehicles
    within 15 feet of each other.
- id: 315
  category: signs_and_signals
  question: A "slow moving vehicle" sign must be displayed on the rear of any vehicle
    moving at or below what speed from sunset to ½ hour before sunrise?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: From sunset to ½ hour before sunrise, any vehicle moving 25 mph or
    slower must have a “slow moving vehicle” sign.
- id: 316
  category: vehicle_information
  question: Between which dates are studded snow tires permitted on vehicles in Missouri?
  choices:
    A: October 1 to March 1
    B: November 1 to April 1
    C: November 15 to April 15
    D: December 1 to March 31
  answer: B
  explanation: Your vehicle may have studded snow tires only from November 1 to April
    1.
- id: 317
  category: vehicle_information
  question: What is the maximum permitted light blockage for tinting on front door
    windows?
  choices:
    A: 35%
    B: 50%
    C: 65%
    D: 80%
  answer: C
  explanation: Tinting or sun-screening material is permitted on the side and rear
    windows (front door windows at no more than 65% light blockage).
- id: 318
  category: vehicle_information
  question: What is the maximum width allowed for any vehicle without a special permit?
  choices:
    A: 8 feet
    B: 8½ feet
    C: 9 feet
    D: 9½ feet
  answer: B
  explanation: The maximum width of any vehicle is 8½ feet.
- id: 319
  category: vehicle_information
  question: What is the maximum height of any vehicle on highways outside of a commercial
    zone or designated highways?
  choices:
    A: 13½ feet
    B: 14 feet
    C: 14½ feet
    D: 15 feet
  answer: A
  explanation: The maximum height on all other highways (outside commercial zones
    and designated highways) is 13½ feet.
- id: 320
  category: safe_driving_rules
  question: How far beyond the city limits does the commercial zone for St. Louis
    City extend?
  choices:
    A: 2 miles
    B: 12 miles
    C: 15 miles
    D: 18 miles
  answer: D
  explanation: The commercial zone for St. Louis City extends 18 miles beyond the
    city limits.
- id: 321
  category: safe_driving_rules
  question: 'Motor vehicle carriers may carry loads that extend beyond their legal
    length limits, but the load must not extend more than:'
  choices:
    A: Two feet beyond the front or three feet beyond the rear
    B: Three feet beyond the front or four feet beyond the rear
    C: Four feet beyond the front or five feet beyond the rear
    D: Five feet beyond the front or six feet beyond the rear
  answer: B
  explanation: Loads must not extend more than three feet beyond the front or four
    feet beyond the rear of the vehicle.
- id: 322
  category: vehicle_information
  question: What is the maximum gross weight allowed on all highways in Missouri,
    except where bridge structures are posted with lesser limits?
  choices:
    A: 60,000 pounds
    B: 70,000 pounds
    C: 80,000 pounds
    D: 90,000 pounds
  answer: C
  explanation: The maximum gross weight allowed on all highways in Missouri is 80,000
    pounds, except where bridge structures are posted with lesser weight limits.
- id: 323
  category: vehicle_information
  question: Which of the following is a requirement to receive an oversize or overweight
    permit?
  choices:
    A: The load on your vehicle must be reducible.
    B: You must have property damage and bodily injury liability insurance.
    C: You must be driving a vehicle licensed for farm use.
    D: You must have a minimum of five axles.
  answer: B
  explanation: To receive an oversize or overweight permit, the load on your vehicle
    must be non-reducible, you must have property damage and bodily injury liability
    insurance, and you must pay a permit fee.
- id: 324
  category: safe_driving_rules
  question: Which type of commercial vehicle is prohibited from carrying liquid-burning
    pot torches (flares) as emergency warning devices?
  choices:
    A: Vehicles transporting solid waste.
    B: Vehicles licensed for more than 12,000 pounds.
    C: Vehicles transporting explosive or flammable material.
    D: Vehicles operating solely intrastate.
  answer: C
  explanation: The combination of three flares, three fuses, and two red flags must
    not be carried by vehicles transporting explosive or flammable material or using
    flammable compressed gas as a motor fuel.
- id: 325
  category: safe_driving_rules
  question: If you are driving a bus or truck, what is the minimum distance you must
    maintain when following another bus or truck outside of a business or residential
    district?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: If you are driving a bus or truck, you must not follow another bus
    or truck any closer than 300 feet. However, you may follow closer when in a business
    or residential district, or when passing.
- id: 326
  category: defensive_driving
  question: What is the recommended following distance rule for a commercial vehicle
    based on its length?
  choices:
    A: Keep at least one second between you and the vehicle in front for each ten
      feet of length in your vehicle.
    B: Keep at least two seconds between you and the vehicle in front for each ten
      feet of length.
    C: Keep at least one second for every twenty feet of length.
    D: Keep a standard four-second following distance regardless of length.
  answer: A
  explanation: For each ten feet of length in your vehicle, keep at least one second
    between you and the vehicle in front of you. For example, a 40-foot vehicle requires
    four seconds.
- id: 327
  category: safe_driving_rules
  question: Which of the following vehicles is required to stop within 15 to 50 feet
    before railroad tracks?
  choices:
    A: A commercial vehicle licensed for 18,000 pounds or less.
    B: A solid waste hauler.
    C: A school bus.
    D: Any vehicle carrying a non-reducible load.
  answer: C
  explanation: You must stop within 15 to 50 feet before the railroad tracks if you
    are driving a school bus, a motor vehicle carrying passengers for hire, or a vehicle
    carrying certain hazardous materials.
- id: 328
  category: vehicle_information
  question: 'To compensate for off-tracking when making a right turn in a large vehicle,
    you should:'
  choices:
    A: Begin the turn as far to the right as possible.
    B: Begin the turn as far to the left as possible.
    C: Accelerate quickly through the turn.
    D: Turn the steering wheel sharply before moving forward.
  answer: B
  explanation: When a vehicle turns, the rear wheels take a shorter path than the
    front wheels. To compensate for off-tracking, begin a right-turn as far to the
    left as possible.
- id: 329
  category: safe_driving_rules
  question: 'All commercial motor vehicles must stop at weigh stations EXCEPT those
    licensed for:'
  choices:
    A: 12,000 pounds or less.
    B: 18,000 pounds or less.
    C: 26,000 pounds or less.
    D: 36,000 pounds or less.
  answer: B
  explanation: All commercial motor vehicles must stop at weigh stations except those
    licensed for 18,000 pounds or less or otherwise exempted by law, unless directed
    by a peace officer.
- id: 330
  category: defensive_driving
  question: If you are being tailgated by another vehicle, what is the safest course
    of action?
  choices:
    A: Flash your brake lights to warn the tailgater.
    B: Speed up to increase the distance between you and the tailgater.
    C: Make a sudden stop to force the tailgater to back off.
    D: Slow down and increase the distance between you and the vehicle in front of
      you.
  answer: D
  explanation: To avoid a crash with a tailgater, you should slow down, avoid sudden
    turns or stops, increase the distance between you and the vehicle in front of
    you, and do not flash your taillights or brake lights.
- id: 331
  category: driver_responsibility
  question: According to the manual, what is considered by far the most high-risk
    driving distraction?
  choices:
    A: Eating and drinking
    B: Adjusting the radio
    C: Text messaging
    D: Talking to passengers
  answer: C
  explanation: Because text messaging requires visual, manual, and cognitive attention
    from the driver, it is by far the most high risk distraction.
- id: 332
  category: safe_driving_rules
  question: What is the proper way to travel with a pet in a moving vehicle?
  choices:
    A: Allow the pet to sit on your lap to keep it calm.
    B: Secure the pet in a pet carrier, portable kennel, or specially designed harness.
    C: Let the pet roam freely in the back seat.
    D: Hold the pet with one hand while steering with the other.
  answer: B
  explanation: Properly secure your pet in a pet carrier, portable kennel, or specially
    designed pet harness when you are driving. Never allow your pet to sit on your
    lap while you are driving.
- id: 333
  category: vehicle_information
  question: What information must be clearly visible on a commercial motor vehicle
    that is regularly used for commercial purposes and licensed for over 36,000 pounds?
  choices:
    A: The driver's license number of the operator.
    B: The name of the owner and the address the vehicle is operated from.
    C: The maximum gross weight allowed for the vehicle.
    D: The vehicle's exact length and width.
  answer: B
  explanation: 'The following information must be clearly visible on commercial motor
    vehicles: The name of the owner; the address the vehicle is operated from and
    the number issued to a motor carrier.'
- id: 334
  category: defensive_driving
  question: 'When checking the space overhead for your commercial vehicle, you should:'
  choices:
    A: Always trust that posted heights at bridges are correct.
    B: Only check for clearance when driving on unpaved roads.
    C: Not assume that posted heights at bridges or underpasses are correct.
    D: Rely on the vehicle behind you to warn you of low clearances.
  answer: C
  explanation: Make sure you have enough space over your vehicle at all times. Do
    not assume that posted heights at bridges or underpasses are correct.
- id: 335
  category: vehicle_information
  question: 'A commercial motor vehicle used for intrastate commerce licensed for
    more than 12,000 pounds must carry a fire extinguisher rated at least:'
  choices:
    A: 2 A:B
    B: 5 B:C
    C: 10 B:C
    D: 15 A:C
  answer: B
  explanation: Any other commercial motor vehicle used for intrastate or interstate
    commerce that is licensed for more than 12,000 pounds must carry... One fire extinguisher.
    The extinguisher must be rated at 5 B:C or more.
- id: 336
  category: defensive_driving
  question: How does the weight and length of your vehicle affect crossing or entering
    traffic?
  choices:
    A: A heavier vehicle accelerates faster, requiring a smaller gap.
    B: The length of the vehicle does not affect the time it takes to cross the road.
    C: A long or heavily weighted vehicle needs a larger gap to cross the road than
      a car.
    D: Heavy vehicles have the right-of-way, so gap size is irrelevant.
  answer: C
  explanation: Your acceleration rate varies with the weight of your vehicle. And
    your time to cross the road is also affected by the length of your vehicle. In
    a long or heavily weighted vehicle, you will need a larger gap to cross the road
    than you would in a car.
- id: 337
  category: safe_driving_rules
  question: When is the best time to adjust your vehicle's controls, such as the climate
    controls, mirrors, or radio?
  choices:
    A: While stopped at a yield sign
    B: Before you begin to drive
    C: While driving on a straight road
    D: Only when driving under 30 mph
  answer: B
  explanation: The manual states that you should adjust your vehicle's controls (climate
    controls, mirrors, radio, seat, etc.) before you begin to drive to decrease your
    risk of a crash.
- id: 338
  category: safe_driving_rules
  question: If you need to adjust the climate control or navigation system while driving,
    what is a recommended safe practice?
  choices:
    A: Ask your passengers to adjust them for you
    B: Steer with your knees while adjusting
    C: Wait until you are on the highway
    D: Pull over to the left shoulder immediately
  answer: A
  explanation: The manual recommends asking your passengers to adjust the radio, climate
    control, navigation system, etc., for you to avoid distracted driving.
- id: 339
  category: defensive_driving
  question: According to the manual, which of the following is considered a visual
