metadata:
  source: 2025 Missouri Driver's Manual
  total_questions: 261
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Missouri, what is the minimum age at which an individual can apply
    for a standard Instruction Permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 15 and a half years old
    D: 16 years old
  answer: B
  explanation: According to the Missouri Driver Guide, an individual must be at least
    15 years old to apply for an Instruction Permit.
- id: 2
  category: license_system
  question: To graduate to an Intermediate License in Missouri, how long must a person
    hold their Instruction Permit without any alcohol-related convictions or traffic
    points?
  choices:
    A: 90 days
    B: 120 days
    C: 182 days
    D: One year
  answer: C
  explanation: Missouri law requires applicants to hold an Instruction Permit for
    at least 182 days (approximately 6 months) before becoming eligible for an Intermediate
    License.
- id: 3
  category: license_system
  question: Under Missouri's Graduated Driver License (GDL) law, what are the restricted
    driving hours for an Intermediate License holder?
  choices:
    A: Midnight to 6:00 AM
    B: 11:00 PM to 5:00 AM
    C: 1:00 AM to 5:00 AM
    D: 10:00 PM to 4:00 AM
  answer: C
  explanation: Intermediate License holders in Missouri are restricted from driving
    between 1:00 AM and 5:00 AM unless accompanied by a licensed driver 21 or older,
    or for specific work/school/emergency reasons.
- id: 4
  category: license_system
  question: During the first six months of holding a Missouri Intermediate License,
    how many passengers under the age of 19 (who are not immediate family) may the
    driver carry?
  choices:
    A: None
    B: One
    C: Two
    D: Three
  answer: B
  explanation: For the first six months, an Intermediate License holder may not operate
    a motor vehicle with more than one passenger under age 19 who is not a member
    of their immediate family.
- id: 5
  category: license_system
  question: How many hours of supervised driving, including nighttime hours, must
    a Missouri permit holder complete before applying for an Intermediate License?
  choices:
    A: 30 total hours, 5 at night
    B: 40 total hours, 10 at night
    C: 50 total hours, 10 at night
    D: 20 total hours, 5 at night
  answer: B
  explanation: Missouri requires 40 hours of behind-the-wheel instruction, including
    a minimum of 10 hours of nighttime driving, verified by a parent or guardian.
- id: 6
  category: license_system
  question: Under Missouri law, your driving privilege will be suspended if you accumulate
    how many points on your driving record within 18 months?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: The Missouri Department of Revenue will suspend your driving privilege
    if you accumulate 8 or more points in 18 months.
- id: 7
  category: license_system
  question: In Missouri, your driver license will be revoked for one year if you accumulate
    how many points in a 12-month period?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: Missouri law mandates a one-year revocation of driving privileges if
    a driver accumulates 12 points in 12 months, 18 points in 24 months, or 24 points
    in 36 months.
- id: 8
  category: license_system
  question: What is the legal Blood Alcohol Content (BAC) limit for a driver under
    the age of 21 in Missouri?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Missouri enforces a 'Zero Tolerance' policy for minors; if you are
    under 21, your license can be suspended if you are caught driving with a BAC of
    0.02% or higher.
- id: 9
  category: license_system
  question: When moving to a new residence within Missouri, how many days do you have
    to notify the Department of Revenue of your address change?
  choices:
    A: 10 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: B
  explanation: Missouri law requires drivers to notify the Department of Revenue within
    30 days of changing their address.
- id: 10
  category: license_system
  question: Who is allowed to sit in the front seat to supervise a 15-year-old Missouri
    Instruction Permit holder?
  choices:
    A: Any licensed driver over the age of 18
    B: A sibling who is at least 18 years old
    C: A licensed driver 21 years of age or older
    D: Anyone the driver's parents authorize
  answer: C
  explanation: A permit holder must be accompanied by a qualified person (parent,
    guardian, or driving instructor) or a licensed driver who is at least 21 years
    of age.
- id: 11
  category: license_system
  question: For drivers between the ages of 21 and 69, how long is a standard Missouri
    driver license valid before it expires?
  choices:
    A: 3 years
    B: 4 years
    C: 6 years
    D: 8 years
  answer: C
  explanation: In Missouri, drivers aged 21 through 69 are typically issued a license
    that is valid for 6 years. Those under 21 or over 70 receive 3-year licenses.
- id: 12
  category: license_system
  question: To be eligible for an Intermediate License, a Missouri applicant must
    not have had any 'at-fault' accidents in the last ____ months.
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: Missouri GDL requirements state the applicant must be accident-free
    and violation-free for the 12 months immediately preceding the application.
- id: 13
  category: license_system
  question: In Missouri, what is the minimum age to apply for a full (under-21) driver
    license, provided all GDL requirements have been met?
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 21 years old
  answer: C
  explanation: An individual can apply for a full driver license at age 18, provided
    they have completed the Intermediate License stage without any suspensions or
    revocations.
- id: 14
  category: license_system
  question: If a Missouri driver is convicted of a first-time MIP (Minor in Possession)
    offense, what happens to their driving privilege?
  choices:
    A: Nothing, unless they were driving at the time
    B: Their license is suspended for 30 days
    C: Their license is suspended for 90 days
    D: Their license is revoked for one year
  answer: B
  explanation: Under Missouri's 'Abuse and Lose' law, a first-time MIP conviction
    results in a 30-day suspension of driving privileges, even if the minor was not
    operating a vehicle.
- id: 15
  category: license_system
  question: In Missouri, which license class is required to operate a vehicle for-hire,
    such as a shuttle or delivery vehicle, that does not require a Commercial Driver
    License (CDL)?
  choices:
    A: Class F
    B: Class E
    C: Class M
    D: Class A
  answer: B
  explanation: A Class E (For-Hire) license is required in Missouri for individuals
    who operate a motor vehicle as part of their employment to transport people or
    property for hire, or a vehicle that carries 14 or fewer passengers.
- id: 16
  category: license_system
  question: To meet the vision requirements for a Missouri driver license without
    restrictions, an applicant must have at least what visual acuity in at least one
    eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Missouri requires applicants to have at least 20/40 vision in either
    or both eyes to qualify for a license without restrictions. If vision is between
    20/41 and 20/160, restrictions may apply.
- id: 17
  category: license_system
  question: If a Missouri applicant fails the driving skills test three times, what
    is the required procedure before they can test again?
  choices:
    A: They must wait 6 months.
    B: They must complete 40 hours of additional training.
    C: They must obtain written permission from the Department of Revenue.
    D: They must retake the written exam only.
  answer: C
  explanation: According to the Missouri Driver Guide, if you fail the driving test
    three times, the examiner will provide you with a form that you must send to the
    Department of Revenue to request permission for additional testing.
- id: 18
  category: license_system
  question: In Missouri, male applicants between what ages are automatically registered
    with the Selective Service when applying for a driver license or ID card?
  choices:
    A: 16 to 18
    B: 18 to 25
    C: 18 to 30
    D: 21 to 26
  answer: B
  explanation: Missouri law requires that any male U.S. citizen or immigrant who is
    at least 18 years of age but less than 26 years of age be registered with the
    Selective Service System when applying for a license.
- id: 19
  category: license_system
  question: If you change your name due to marriage or a court order, how many days
    do you have to visit a Missouri license office to update your driver license?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Missouri law requires you to notify the Department of Revenue of a
    name change and obtain a duplicate license within 30 days of the change.
- id: 20
  category: license_system
  question: How many months before your Missouri driver license expires are you permitted
    to renew it?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: In Missouri, you can renew your driver license up to 6 months (180
    days) before the expiration date.
- id: 21
  category: license_system
  question: What is the standard operator license class in Missouri for a typical
    passenger vehicle?
  choices:
    A: Class A
    B: Class C
    C: Class F
    D: Class G
  answer: C
  explanation: Class F is the basic Missouri driver license. It allows you to operate
    any motor vehicle (other than a commercial motor vehicle) that is not for-hire
    and does not require a motorcycle license.
- id: 22
  category: license_system
  question: Which of the following is a required document to prove 'Lawful Status'
    for a Missouri REAL ID-compliant license?
  choices:
    A: A utility bill from the last 30 days
    B: A certified U.S. Birth Certificate
    C: A high school diploma
    D: A valid library card
  answer: B
  explanation: To obtain a REAL ID-compliant license in Missouri, you must provide
    proof of lawful status, such as a certified U.S. Birth Certificate, a valid U.S.
    Passport, or a Certificate of Naturalization.
- id: 23
  category: license_system
  question: What is the minimum age to apply for a motorcycle instruction permit in
    Missouri if the applicant has already completed a motorcycle rider training course?
  choices:
    A: 15 years old
    B: 15 1/2 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: In Missouri, an individual who is at least 15 1/2 years old may apply
    for a motorcycle instruction permit if they have passed the appropriate tests
    or completed a training course.
- id: 24
  category: license_system
  question: Under the 'Motor Voter' law, what is the minimum age at which a Missouri
    resident can pre-register to vote at a license office?
  choices:
    A: 16 years old
    B: 17 years old
    C: 17 1/2 years old
    D: 18 years old
  answer: C
  explanation: Missouri residents can register to vote at the license office. While
    you must be 18 to vote, you may pre-register at age 17 1/2.
- id: 25
  category: license_system
  question: If an applicant does not have a Social Security number, what must they
    provide to the Missouri Department of Revenue to obtain a license?
  choices:
    A: Nothing; it is not required.
    B: A letter from the Social Security Administration stating they are not eligible
      for a number.
    C: A notarized letter from a parent.
    D: A copy of their most recent tax return.
  answer: B
  explanation: If you do not have a Social Security number, you must present a letter
    from the Social Security Administration (SSA) regarding your status of Social
    Security number eligibility.
- id: 26
  category: license_system
  question: How long are the results of a Missouri driver's written examination valid
    for?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Until the applicant turns 21
  answer: B
  explanation: Written test results in Missouri are valid for one year from the date
    of the test.
- id: 27
  category: license_system
  question: To have the 'VETERAN' designation placed on a Missouri driver license,
    what document must the applicant present?
  choices:
    A: A military ID card
    B: A letter from the local VA hospital
    C: A DD-214 showing an honorable discharge
    D: A voter registration card
  answer: C
  explanation: Missouri veterans can have 'VETERAN' placed on their license by presenting
    a DD-214 (Discharge Papers) that indicates an honorable discharge.
- id: 28
  category: license_system
  question: In Missouri, for how many years is a driver license valid if the applicant
    is 70 years of age or older?
  choices:
    A: 1 year
    B: 3 years
    C: 6 years
    D: 8 years
  answer: B
  explanation: Missouri driver licenses issued to persons age 70 and older are valid
    for 3 years, whereas licenses for those aged 21-69 are valid for 6 years.
- id: 29
  category: license_system
  question: What is the standard reinstatement fee for a Missouri driver whose license
    was suspended for accumulating too many points?
  choices:
    A: $10
    B: $20
    C: $45
    D: $100
  answer: B
  explanation: The standard reinstatement fee for a point-related suspension in Missouri
    is $20. Other types of suspensions (like insurance-related) may have higher fees.
- id: 30
  category: driver_testing
  question: What is the minimum amount of liability insurance coverage required by
    Missouri law for property damage?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Missouri law requires a minimum of $25,000 per accident for property
    damage, in addition to $25,000 per person and $50,000 per accident for bodily
    injury.
- id: 31
  category: driver_testing
  question: According to the Missouri Driver Guide, how many questions are on the
    written permit (knowledge) test, and what is the passing score?
  choices:
    A: 20 questions; 70%
    B: 25 questions; 80%
    C: 30 questions; 75%
    D: 50 questions; 80%
  answer: B
  explanation: The Missouri knowledge test consists of 25 multiple-choice questions.
    You must answer at least 20 questions correctly (80%) to pass.
- id: 32
  category: driver_testing
  question: If you are a Missouri resident and purchase a vehicle, how many days do
    you have to title the vehicle and pay the sales tax before facing a penalty?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Missouri law requires you to title and pay sales tax on a newly purchased
    vehicle within 30 days of the purchase date to avoid late penalties.
- id: 33
  category: driver_testing
  question: To pass the Missouri vision screening without restrictions, you must have
    at least what degree of combined peripheral vision?
  choices:
    A: 70 degrees
    B: 85 degrees
    C: 105 degrees
    D: 140 degrees
  answer: C
  explanation: Missouri requires a combined horizontal peripheral vision of at least
    105 degrees to pass the vision screening without restrictions.
- id: 34
  category: driver_testing
  question: Under the Missouri Point System, how many points are added to your driving
    record for a conviction of 'Speeding' in violation of state law?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: A conviction for speeding in violation of Missouri state law results
    in 3 points being added to your driving record. Municipal ordinance violations
    for speeding typically result in 2 points.
- id: 35
  category: driver_testing
  question: 'If you drive one full year without a new traffic conviction in Missouri,
    your total accumulated points will be reduced by:'
  choices:
    A: One-fourth
    B: One-third
    C: One-half
    D: All points
  answer: B
  explanation: Missouri's point reduction system reduces your total points by one-third
    for the first full year of driving without a new conviction.
- id: 36
  category: driver_testing
  question: Which of the following is a requirement for the vehicle you provide for
    the Missouri on-road driving skills test?
  choices:
    A: It must be a mid-size sedan
    B: It must have a manual transmission
    C: It must have valid license plates and a current manual inspection (if required)
    D: It must be less than 10 years old
  answer: C
  explanation: The vehicle used for the road test must be in good mechanical condition,
    have a valid registration, show proof of financial responsibility, and have valid
    license plates.
- id: 37
  category: driver_testing
  question: In Missouri, what is the penalty for a first-time conviction of failing
    to maintain financial responsibility (insurance)?
  choices:
    A: 2 points
    B: 4 points
    C: 8 points
    D: Immediate permanent revocation
  answer: B
  explanation: A first-time conviction for failing to maintain insurance in Missouri
    results in 4 points being added to your driving record.
- id: 38
  category: driver_testing
  question: How many days after failing the first Missouri driving skills test must
    you wait before you can take the test again?
  choices:
    A: 1 day
    B: 3 days
    C: 7 days
    D: 30 days
  answer: A
  explanation: If you fail the driving skills test, you must wait at least one day
    before taking the test again.
- id: 39
  category: driver_testing
  question: Under Missouri law, who is required to wear a seat belt in a passenger
    vehicle?
  choices:
    A: Only the driver
    B: Only children under 12
    C: The driver, all front-seat passengers, and all passengers under 16
    D: Only passengers in the back seat
  answer: C
  explanation: Missouri law requires the driver, all front-seat passengers, and all
    passengers under the age of 16 to be properly buckled up.
- id: 40
  category: driver_testing
  question: If you are moving to Missouri from another state and have a valid, unexpired
    driver license, which tests are you usually required to take?
  choices:
    A: Written, Vision, and Road tests
    B: Vision and Road tests only
    C: Vision and Written tests only
    D: Vision test only
  answer: D
  explanation: New Missouri residents with a valid out-of-state license are typically
    only required to pass the vision screening and the road sign recognition test.
- id: 41
  category: driver_testing
  question: In Missouri, how many points are assessed for a conviction of 'Leaving
    the scene of an accident' in violation of state law?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: D
  explanation: Leaving the scene of an accident in violation of state law is a serious
    offense and results in 12 points, which leads to immediate revocation of driving
    privileges.
- id: 42
  category: driver_testing
  question: What is the maximum speed limit on rural interstates in Missouri, unless
    otherwise posted?
  choices:
    A: 60 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: The statutory speed limit for rural interstates and freeways in Missouri
    is 70 mph, unless signs indicate otherwise.
- id: 43
  category: driver_testing
  question: If your Missouri driving privilege is suspended for accumulating 8 points
    in 18 months, how long is the first suspension period?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: A
  explanation: The first time your Missouri driving privilege is suspended for points,
    the suspension lasts for 30 days.
- id: 44
  category: driver_testing
  question: What are the minimum liability insurance coverage limits required by law
    for a Missouri motor vehicle owner?
  choices:
    A: $15,000 for bodily injury per person; $30,000 per accident; $10,000 for property
      damage
    B: $25,000 for bodily injury per person; $50,000 per accident; $25,000 for property
      damage
    C: $50,000 for bodily injury per person; $100,000 per accident; $50,000 for property
      damage
    D: $10,000 for bodily injury per person; $20,000 per accident; $5,000 for property
      damage
  answer: B
  explanation: 'Missouri law requires ''25/50/25'' coverage: $25,000 for bodily injury
    per person, $50,000 for bodily injury per accident, and $25,000 for property damage.'
- id: 45
  category: driver_testing
  question: In Missouri, how many points are added to your driving record for a conviction
    of 'Careless and Imprudent Driving'?
  choices:
    A: 2 points
    B: 4 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: Careless and Imprudent driving is a serious offense in Missouri and
    carries a penalty of 4 points on the driver's record.
- id: 46
  category: driver_testing
  question: If your Missouri driver license has been expired for more than ______,
    you must take the written and road tests again to renew it.
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Missouri requires drivers whose licenses have been expired for more
    than 6 months to complete the full testing process (written, vision, and road)
    again.
- id: 47
  category: driver_testing
  question: Before beginning the Missouri road test, the examiner will check your
    vehicle for safety. Which of the following would cause the test to be postponed?
  choices:
    A: A broken radio
    B: The air conditioning is not working
    C: Non-functioning turn signals
    D: A small crack in the passenger side window
  answer: C
  explanation: The vehicle used for the road test must have all safety equipment in
    working order, including turn signals, brake lights, and a horn.
- id: 48
  category: driver_testing
  question: To pass the Missouri vision test, you must have at least what degree of
    peripheral vision in each eye (or 85 degrees in one eye)?
  choices:
    A: 35 degrees
    B: 45 degrees
    C: 55 degrees
    D: 75 degrees
  answer: C
  explanation: Missouri vision requirements state that an applicant must have at least
    55 degrees of peripheral vision in each eye, or 85 degrees in one eye.
- id: 49
  category: driver_testing
  question: After a point-related suspension of your Missouri driving privilege, what
    is the required reinstatement fee?
  choices:
    A: $10
    B: $20
    C: $45
    D: $65
  answer: B
  explanation: To reinstate a license after a suspension for points, the driver must
    pay a $20 fee and provide proof of financial responsibility (SR-22).
- id: 50
  category: driver_testing
  question: If your Missouri license is suspended or revoked for an alcohol-related
    offense, you must complete which program before your license can be reinstated?
  choices:
    A: DDC (Defensive Driving Course)
    B: SATOP (Substance Abuse Traffic Offender Program)
    C: MADD (Mothers Against Drunk Driving) Victim Impact Panel
    D: A standard 4-hour driver improvement clinic
  answer: B
  explanation: SATOP is the mandatory program in Missouri for individuals who have
    had their driving privileges suspended or revoked due to alcohol or drug-related
    offenses.
- id: 51
  category: driver_testing
  question: For a Missouri driver who is 70 years of age or older, how long is the
    driver license valid?
  choices:
    A: 1 year
    B: 3 years
    C: 6 years
    D: Indefinitely
  answer: B
  explanation: In Missouri, drivers age 70 and older are issued licenses that are
    valid for 3 years, rather than the standard 6-year term for younger adults.
- id: 52
  category: driver_testing
  question: The Missouri written driver examination consists of 25 questions. What
    is the minimum number of correct answers required to pass?
  choices:
    A: '15'
    B: '18'
    C: '20'
    D: '22'
  answer: C
  explanation: A score of 80% is required to pass the Missouri written test, which
    means you must answer at least 20 out of 25 questions correctly.
- id: 53
  category: driver_testing
  question: During the Missouri road test, you will be required to back your vehicle
    in a straight line for what distance?
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The Missouri driving skills test requires the applicant to back the
    vehicle in a straight line for a distance of 50 feet safely and smoothly.
- id: 54
  category: driver_testing
  question: If you are caught driving a motor vehicle in Missouri without maintaining
    the required insurance, how many points will be added to your driving record for
    a first offense?
  choices:
    A: 2 points
    B: 4 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: A conviction for failure to maintain financial responsibility (insurance)
    results in 4 points being added to your Missouri driving record.
- id: 55
  category: driver_testing
  question: What is the penalty for making a false statement or affidavit under oath
    to the Missouri Department of Revenue when applying for a license?
  choices:
    A: A $50 fine
    B: A 30-day suspension
    C: A Class A misdemeanor and potential license revocation
    D: A mandatory 10 hours of community service
  answer: C
  explanation: Providing false information on a license application is a serious offense
    (Class A misdemeanor) and can result in the revocation of driving privileges for
    one year.
- id: 56
  category: driver_testing
  question: In the Missouri road test, the parallel parking space is approximately
    how many feet long?
  choices:
    A: 15 feet
    B: 20 feet
    C: 25 feet
    D: 30 feet
  answer: C
  explanation: The standard parallel parking space used during the Missouri driving
    skills test is 25 feet long and 7 feet wide.
- id: 57
  category: driver_testing
  question: During the Missouri road test, which of the following actions will result
    in an immediate failure?
  choices:
    A: Failing to use a turn signal once
    B: Touching the curb while parallel parking
    C: A dangerous action where an accident is prevented only by the examiner's intervention
    D: Driving 2 mph below the speed limit
  answer: C
  explanation: Any dangerous action, traffic law violation, or incident requiring
    the examiner to take control of the vehicle results in an immediate failure of
    the Missouri road test.
- id: 58
  category: driver_responsibility
  question: 'In Missouri, you must file a Motor Vehicle Accident Report (Form 1140)
    if the accident involved an uninsured motorist and property damage to any one
    person exceeded:'
  choices:
    A: $200
    B: $500
    C: $1,000
    D: $2,500
  answer: B
  explanation: If an accident occurs in Missouri, involves an uninsured party, and
    results in more than $500 in property damage or any injury/death, a report must
    be filed within 30 days.
- id: 59
  category: driver_responsibility
  question: If you are convicted of a first offense for failing to maintain financial
    responsibility (insurance) in Missouri, how many points will be added to your
    driving record?
  choices:
    A: 2 points
    B: 4 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: A conviction for failing to maintain insurance in Missouri results
    in 4 points being added to your driving record for the first offense.
- id: 60
  category: driver_responsibility
  question: 'For a second or subsequent conviction of driving without insurance, the
    Missouri Department of Revenue will suspend your driving privilege for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: A second or subsequent conviction for failing to maintain insurance
    results in a 90-day suspension and a $200 reinstatement fee.
- id: 61
  category: driver_responsibility
  question: 'To prove financial responsibility after an insurance-related suspension,
    a Missouri driver must maintain an SR-22 filing for a period of:'
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Missouri requires drivers to maintain an SR-22 insurance filing for
    three years from the date of suspension to prove future financial responsibility.
- id: 62
  category: driver_responsibility
  question: When you purchase a vehicle in Missouri, how many days do you have to
    title and register the vehicle before late fees apply?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Missouri law requires vehicles to be titled and registered within 30
    days of the purchase date to avoid late penalties.
- id: 63
  category: driver_responsibility
  question: 'In Missouri, most motor vehicles are required to undergo a safety inspection
    every:'
  choices:
    A: Year
    B: Two years
    C: Five years
    D: Time the vehicle is sold only
  answer: B
  explanation: Missouri requires biennial (every two years) safety inspections for
    most vehicles, based on the vehicle's model year (even years for even-numbered
    models, odd for odd).
- id: 64
  category: driver_responsibility
  question: Which of the following Missouri areas requires an emissions inspection
    in addition to a safety inspection?
  choices:
    A: Greene County
    B: St. Charles County
    C: Boone County
    D: Cole County
  answer: B
  explanation: Emissions inspections are required for vehicles registered in St. Louis
    City, St. Louis County, St. Charles County, Franklin County, and Jefferson County.
- id: 65
  category: driver_responsibility
  question: Under Missouri law, what is the maximum fine for a first-time littering
    conviction?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Littering is a crime in Missouri. A first conviction can result in
    a fine of up to $1,000 and/or up to one year in jail.
- id: 66
  category: driver_responsibility
  question: If you are involved in a crash in Missouri that meets reporting criteria,
    how long do you have to file a Motor Vehicle Accident Report (Form 1140)?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 1 year
  answer: B
  explanation: Missouri law requires the Motor Vehicle Accident Report to be filed
    within 30 days of the accident if the criteria (uninsured, damage > $500, or injury)
    are met.
- id: 67
  category: driver_responsibility
  question: In Missouri, what is the point value assessed for a conviction of 'Careless
    and Imprudent Driving'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 8 points
  answer: C
  explanation: A conviction for Careless and Imprudent Driving in Missouri results
    in 4 points being added to the driver's record.
- id: 68
  category: driver_responsibility
  question: If a Missouri driver is convicted of 'Leaving the Scene of an Accident'
    (a state violation), how many points are assessed to their record?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: D
  explanation: Leaving the scene of an accident is a serious offense in Missouri and
    results in 12 points, which leads to immediate revocation of driving privileges.
- id: 69
  category: driver_responsibility
  question: Missouri law requires most motor vehicles (excluding motorcycles and trailers)
    to display license plates in which manner?
  choices:
    A: Rear only
    B: Front only
    C: On both the front and rear of the vehicle
    D: In the rear window
  answer: C
  explanation: 'Missouri law requires most motor vehicles to display two license plates:
    one on the front and one on the rear.'
- id: 70
  category: driver_responsibility
  question: 'In Missouri, if you are stopped for a suspected DWI and refuse to take
    a chemical test of your breath, blood, or urine, your driver license will be revoked
    for:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: Under Missouri's Implied Consent Law, if you refuse a chemical test
    when requested by an officer, your license is automatically revoked for one year.
- id: 71
  category: driver_responsibility
  question: In Missouri, what are the minimum liability insurance requirements for
    bodily injury for two or more persons in one accident?
  choices:
    A: $25,000
    B: $50,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: Missouri law requires minimum liability coverage of $25,000 per person
    for bodily injury and $50,000 per accident for bodily injury (25/50/25).
- id: 72
  category: driver_responsibility
  question: What is the maximum late titling fee that can be charged in Missouri for
    failing to title a vehicle within the required timeframe?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: The late titling fee is $25 for the first 30 days of delay and increases
    by $25 for every 30 days thereafter, up to a maximum of $200.
- id: 73
  category: driver_responsibility
  question: In Missouri, a safety inspection is generally required for registration
    renewal if the vehicle is more than how many years old?
  choices:
    A: 5 years
    B: 10 years
    C: 15 years
    D: 20 years
  answer: B
  explanation: Vehicles more than 10 years old (or those with more than 150,000 miles)
    require a safety inspection for registration renewal in Missouri.
- id: 74
  category: driver_responsibility
  question: In which of the following Missouri locations is an emissions inspection
    required for most motor vehicles?
  choices:
    A: Boone County
    B: Greene County
    C: St. Charles County
    D: Cole County
  answer: C
  explanation: Emissions inspections are required for residents of St. Louis City,
    St. Louis County, St. Charles County, Jefferson County, and Franklin County.
- id: 75
  category: driver_responsibility
  question: How many points are added to a Missouri driving record for a conviction
    of 'Operating a motor vehicle without maintaining financial responsibility' (first
    offense)?
  choices:
    A: 2 points
    B: 4 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: A conviction for failing to maintain insurance (financial responsibility)
    results in 4 points being added to your Missouri driving record.
- id: 76
  category: driver_responsibility
  question: According to Missouri law, where must license plates be displayed on a
    typical passenger vehicle?
  choices:
    A: Rear bumper only
    B: Front bumper only
    C: Both the front and rear bumpers
    D: Rear bumper and the inside of the front windshield
  answer: C
  explanation: Missouri law requires that most motor vehicles (except motorcycles
    and certain commercial vehicles) display license plates on both the front and
    the rear.
- id: 77
  category: driver_responsibility
  question: 'If a Missouri driver is convicted of a first-time violation for failing
    to maintain insurance, their driving privilege will be suspended until they pay
    a reinstatement fee of:'
  choices:
    A: $20
    B: $50
    C: $150
    D: $500
  answer: A
  explanation: For a first-time insurance suspension, the driver's license is suspended
    and the reinstatement fee is $20.
- id: 78
  category: driver_responsibility
  question: After a license suspension for an insurance violation, a Missouri driver
    must file and maintain proof of financial responsibility (SR-22) for how long?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: Missouri requires drivers to maintain an SR-22 filing for two years
    from the date of the suspension for insurance-related violations.
- id: 79
  category: driver_responsibility
  question: When selling a vehicle in Missouri, the safety inspection provided to
    the buyer must be no more than how many days old?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: A safety inspection certificate must be dated within 60 days of the
    date of sale to be valid for the buyer's registration.
- id: 80
  category: driver_responsibility
  question: 'Under Missouri''s Implied Consent Law, if you refuse to submit to a chemical
    test to determine your BAC, your driver license will be revoked for:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: Under the Implied Consent Law, if you refuse a chemical test, the Department
    of Revenue will revoke your driving privilege for one year (Chemical Revocation).
- id: 81
  category: driver_responsibility
  question: If you are involved in a crash in Missouri, you are required by law to
    exchange which of the following information with the other parties?
  choices:
    A: Driver license number and social security number
    B: Insurance company name and policy number
    C: Vehicle title number and registration date
    D: Employment information and home address
  answer: B
  explanation: Missouri law requires drivers involved in an accident to exchange names,
    addresses, driver license numbers, vehicle registration, and insurance information.
- id: 82
  category: driver_responsibility
  question: A Missouri driver who is at fault in an accident while uninsured may have
    their license suspended for up to how long if they do not pay for the damages?
  choices:
    A: 6 months
    B: 1 year
    C: 4 years
    D: Indefinitely until the judgment is satisfied
  answer: D
  explanation: Under the Safety Responsibility Law, if an uninsured driver is at fault
    and fails to pay for damages, their license can be suspended until they settle
    the claim or satisfy the judgment.
- id: 83
  category: safe_driving_rules
  question: What is the standard speed limit for lettered Missouri roads, such as
    Route A or Route BB, unless otherwise posted?
  choices:
    A: 45 mph
    B: 55 mph
    C: 60 mph
    D: 65 mph
  answer: B
  explanation: In Missouri, the speed limit for lettered roads is typically 55 mph
    unless signs indicate a different limit.
- id: 84
  category: safe_driving_rules
  question: Under Missouri law, you must not park your vehicle within how many feet
    of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Missouri law prohibits parking within 15 feet of a fire hydrant.
- id: 85
  category: safe_driving_rules
  question: When parking your vehicle near a stop sign, what is the minimum distance
    you must maintain from the sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Missouri regulations state that you cannot park within 30 feet of any
    flashing signal, stop sign, or traffic control signal located at the side of a
    roadway.
- id: 86
  category: safe_driving_rules
  question: 'Missouri law requires drivers to turn on their headlights whenever they
    are using their windshield wipers. This is commonly known as the:'
  choices:
    A: Visibility Rule
    B: Wipers On, Lights On Law
    C: Rainy Day Act
    D: Safety First Mandate
  answer: B
  explanation: Missouri law requires that headlights be turned on any time windshield
    wipers are in use due to rain, snow, or other precipitation.
- id: 87
  category: safe_driving_rules
  question: 'In Missouri, you are permitted to pass a vehicle on the right only when:'
  choices:
    A: The vehicle ahead is making a left turn and there is room to pass
    B: You are on a two-lane road with a wide shoulder
    C: The vehicle ahead is driving too slowly in the left lane
    D: Passing on the right is never permitted in Missouri
  answer: A
  explanation: You may pass on the right in Missouri when the vehicle ahead is making
    a left turn, or on a street/highway with two or more lanes of traffic moving in
    the same direction.
- id: 88
  category: safe_driving_rules
  question: If you are traveling on a highway divided by a physical barrier or median,
    do you have to stop for a school bus with its red lights flashing in the opposite
    direction?
  choices:
    A: Yes, you must always stop for a school bus
    B: No, you do not need to stop if there is a median or barrier
    C: Yes, but only if there are children crossing
    D: No, but you must slow down to 15 mph
  answer: B
  explanation: In Missouri, if the highway is divided by a median or physical barrier,
    you do not need to stop if you are traveling in the opposite direction of the
    school bus.
- id: 89
  category: safe_driving_rules
  question: 'When using hand signals to indicate your intentions, extending your arm
    downward out the window signifies:'
  choices:
    A: A right turn
    B: A left turn
    C: Slowing or stopping
    D: Hazard ahead
  answer: C
  explanation: The hand signal for slowing or stopping is extending the arm downward
    with the palm facing the rear.
- id: 90
  category: safe_driving_rules
  question: In Missouri, what is the minimum additional fine for a second or subsequent
    speeding violation in a designated construction or work zone?
  choices:
    A: $100
    B: $250
    C: $300
    D: $500
  answer: C
  explanation: Missouri law imposes a minimum $250 fine for the first work zone offense
    and a minimum $300 fine for subsequent offenses, in addition to regular court
    costs and fines.
- id: 91
  category: safe_driving_rules
  question: Under Missouri law, when is a left turn on a red light permitted?
  choices:
    A: Never
    B: From a one-way street onto another one-way street
    C: From a two-way street onto a one-way street
    D: Anytime there is no oncoming traffic
  answer: B
  explanation: Missouri law allows a left turn on red only when turning from a one-way
    street onto another one-way street, after coming to a complete stop and yielding
    to traffic and pedestrians.
- id: 92
  category: safe_driving_rules
  question: What is the recommended following distance for a passenger vehicle under
    normal driving conditions in Missouri?
  choices:
    A: One car length
    B: Two seconds
    C: Three seconds
    D: Four seconds
  answer: C
  explanation: The Missouri Driver Guide recommends a three-second following distance
    to allow enough time to react to hazards.
- id: 93
  category: safe_driving_rules
  question: 'When an emergency vehicle with sirens and flashing lights is approaching
    from behind, Missouri''s ''Move Over'' law requires you to:'
  choices:
    A: Speed up to get out of the way
    B: Stop immediately in your lane
    C: Pull to the right edge of the road and stop
    D: Move to the left lane and slow down
  answer: C
  explanation: Missouri law requires drivers to pull as far to the right as possible
    and stop until the emergency vehicle has passed.
- id: 94
  category: safe_driving_rules
  question: 'When parking your vehicle headed uphill on a two-way street with a curb,
    you should turn your front wheels:'
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the right
  answer: B
  explanation: When parking uphill with a curb, turn your wheels away from the curb
    so that if the vehicle rolls, the back of the front tire will hit the curb and
    stop the car.
- id: 95
  category: safe_driving_rules
  question: At what distance must you dim your high-beam headlights when following
    another vehicle from behind in Missouri?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: Missouri law requires you to dim your high beams when you are within
    300 feet of the vehicle you are following.
- id: 96
  category: safe_driving_rules
  question: In Missouri, you must signal your intention to turn at least how many
    feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Missouri law requires drivers to signal at least 100 feet before turning
    or changing lanes.
- id: 97
  category: safe_driving_rules
  question: When parking your vehicle parallel to a curb in Missouri, your wheels
    must be within how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: Missouri law requires that when parallel parking, the wheels of the
    vehicle must be within 18 inches of the curb.
- id: 98
  category: safe_driving_rules
  question: Under Missouri law, when are you NOT required to stop for a school bus
    with its red lights flashing and stop arm extended?
  choices:
    A: When the bus is on the opposite side of a divided highway with a median or
      barrier
    B: When you are in a residential area
    C: When the bus is stopped at a railroad crossing
    D: When you are traveling in the same direction on a four-lane road
  answer: A
  explanation: In Missouri, you do not have to stop for a school bus if you are traveling
    in the opposite direction on a highway divided by a median or physical barrier.
- id: 99
  category: safe_driving_rules
  question: In Missouri, it is illegal to park your vehicle within how many feet of
    a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: According to Missouri parking regulations, you may not park within
    15 feet of a fire hydrant.
- id: 100
  category: safe_driving_rules
  question: In Missouri, you may not pass another vehicle within how many feet of
    an intersection, railroad crossing, bridge, viaduct, or tunnel?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Missouri law prohibits passing when approaching within 100 feet of
    any intersection, railroad grade crossing, bridge, viaduct, or tunnel.
- id: 101
  category: safe_driving_rules
  question: Missouri's 'Move Over' law requires drivers to do what when approaching
    a stationary emergency vehicle with flashing lights?
  choices:
    A: Stop completely until the vehicle leaves
    B: Speed up to pass the vehicle quickly
    C: Proceed with caution and, if safe, move into a lane not adjacent to the vehicle
    D: Honk your horn to alert the emergency workers
  answer: C
  explanation: Missouri's Move Over law requires drivers to proceed with caution and,
    if on a multi-lane highway, move into a lane that is not adjacent to the stationary
    emergency vehicle if it is safe to do so.
- id: 102
  category: safe_driving_rules
  question: At a four-way stop in Missouri, if two vehicles arrive at the same time,
    which driver has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver traveling at a higher speed
    D: The driver turning left
  answer: B
  explanation: In Missouri, if two vehicles reach an intersection at the same time,
    the driver on the left must yield to the driver on the right.
- id: 103
  category: safe_driving_rules
  question: 'In Missouri, hydroplaning (where tires lose contact with the road on
    a wet surface) can begin at speeds as low as:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The Missouri Driver Guide states that hydroplaning can begin at speeds
    as low as 35 mph, and at 55 mph, tires may lose all contact with the road.
- id: 104
  category: safe_driving_rules
  question: 'To maintain a safe following distance in Missouri under normal conditions,
    you should use the:'
  choices:
    A: One-second rule
    B: Two-second rule
    C: Three-second rule
    D: Four-second rule
  answer: C
  explanation: The Missouri Driver Guide recommends a three-second following distance
    for most driving situations to allow enough time to react to hazards.
- id: 105
  category: safe_driving_rules
  question: 'In Missouri, a driver may turn left on a red light ONLY when:'
  choices:
    A: Turning from a one-way street onto another one-way street
    B: There is no oncoming traffic
    C: Turning from a two-way street onto a one-way street
    D: It is after midnight
  answer: A
  explanation: Missouri law allows a left turn on red only when turning from a one-way
    street onto another one-way street, after coming to a complete stop and yielding
    to traffic and pedestrians.
- id: 106
  category: defensive_driving
  question: According to the Missouri Driver Guide, what is the recommended following
    distance for a vehicle traveling under ideal conditions?
  choices:
    A: One car length for every 10 mph
    B: Two seconds
    C: Three seconds
    D: Four seconds
  answer: C
  explanation: The Missouri Driver Guide recommends using the 'three-second rule'
    to maintain a safe following distance under ideal driving conditions.
- id: 107
  category: defensive_driving
  question: In Missouri, when must you turn on your headlights according to state
    law regarding weather conditions?
  choices:
    A: Only when visibility is less than 100 feet
    B: Whenever your windshield wipers are in use
    C: Only during nighttime hours
    D: Only when driving on the interstate during rain
  answer: B
  explanation: Missouri law (RSMo 307.020) requires drivers to turn on their headlights
    whenever windshield wipers are in continuous use due to weather conditions.
- id: 108
  category: defensive_driving
  question: When driving at night in Missouri, you must dim your high-beam headlights
    within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: In Missouri, you are required to dim your high beams when you are within
    500 feet of an oncoming vehicle.
- id: 109
  category: defensive_driving
  question: To avoid hydroplaning on wet Missouri roads, at what speed should you
    begin to be extra cautious as your tires may lose contact with the road?
  choices:
    A: 25 mph
    B: 35 mph
    C: 50 mph
    D: 70 mph
  answer: B
  explanation: Hydroplaning can begin at speeds as low as 35 mph, where tires may
    start to ride up on a film of water.
- id: 110
  category: defensive_driving
  question: When scanning the road ahead to practice defensive driving in Missouri,
    how far ahead should you look in city traffic?
  choices:
    A: One block (about 10 to 12 seconds)
    B: Two car lengths
    C: 5 seconds
    D: 30 seconds
  answer: A
  explanation: The Missouri Driver Guide suggests looking about one block ahead (10
    to 12 seconds) when driving in the city to anticipate hazards.
- id: 111
  category: defensive_driving
  question: If you are driving in heavy fog in Missouri, which light setting should
    you use to ensure the best visibility?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: In fog, low-beam headlights should be used because high beams reflect
    off the moisture in the air, making it harder to see.
- id: 112
  category: defensive_driving
  question: In Missouri, what is the minimum additional fine for speeding in a marked
    construction or maintenance zone when workers are present?
  choices:
    A: No additional fine
    B: $50
    C: $150
    D: $250
  answer: D
  explanation: Under Missouri law (RSMo 304.582), a person convicted of a second or
    subsequent moving violation in a construction zone or a first-time speeding violation
    where workers are present faces a minimum $250 fine in addition to standard penalties.
- id: 113
  category: defensive_driving
  question: When passing a bicyclist on a Missouri roadway, how much space should
    you leave between your vehicle and the bicycle?
  choices:
    A: 1 foot
    B: A safe distance (typically at least 3 feet)
    C: 6 inches
    D: There is no specific distance required
  answer: B
  explanation: Missouri law requires motorists to pass bicyclists at a safe distance.
    While the state manual emphasizes caution, 3 feet is the generally accepted safe
    standard for defensive driving.
- id: 114
  category: defensive_driving
  question: If your vehicle begins to skid on a slippery Missouri road, which way
    should you turn your steering wheel?
  choices:
    A: In the opposite direction of the skid
    B: In the direction the rear of the vehicle is skidding
    C: Keep the wheel perfectly straight
    D: Turn sharply toward the shoulder
  answer: B
  explanation: To recover from a skid, you should stay off the brake and turn the
    steering wheel in the direction the rear of the vehicle is sliding.
- id: 115
  category: defensive_driving
  question: When entering a highway from an acceleration lane in Missouri, what is
    the correct defensive driving procedure?
  choices:
    A: Stop at the end of the ramp and wait for a gap
    B: Yield to traffic already on the highway and adjust your speed to match the
      flow
    C: Force your way into traffic; they must let you in
    D: Drive on the shoulder until you find an opening
  answer: B
  explanation: Drivers entering a highway must yield to traffic already on the highway
    and use the acceleration lane to reach a speed that allows for a safe merge.
- id: 116
  category: defensive_driving
  question: According to the Missouri Driver Guide, how often should you check your
    mirrors to maintain situational awareness?
  choices:
    A: Every 2 to 5 seconds
    B: Every 10 to 15 seconds
    C: Only when you are about to change lanes
    D: Once every minute
  answer: A
  explanation: Defensive driving in Missouri involves checking your rearview and side
    mirrors every 2 to 5 seconds to stay aware of surrounding traffic.
- id: 117
  category: defensive_driving
  question: When approaching an intersection, in what order should you scan for cross-traffic?
  choices:
    A: Right, then left
    B: Left, then right, then left again
    C: Straight ahead only
    D: Right, then left, then right again
  answer: B
  explanation: The Missouri Driver Guide recommends looking left, then right, then
    left again before entering an intersection, as traffic from the left is closer
    to you.
- id: 118
  category: defensive_driving
  question: 'In Missouri, if you are following a vehicle and the road becomes slippery
    due to rain or snow, you should increase your following distance to at least:'
  choices:
    A: 4 to 6 seconds
    B: 2 seconds
    C: 100 feet
    D: 10 seconds
  answer: A
  explanation: When road conditions are poor (rain, snow, ice), the Missouri Driver
    Guide recommends increasing your following distance to at least 4 to 6 seconds
    to allow for more stopping time.
- id: 119
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, the Missouri
    Driver Guide suggests you should scan the road how far ahead?
  choices:
    A: 5 to 8 seconds
    B: 10 to 12 seconds
    C: 20 to 30 seconds
    D: Only the car immediately in front of you
  answer: B
  explanation: Scanning 10 to 12 seconds ahead (about one block in the city or a quarter-mile
    on the highway) allows you to see hazards before they become emergencies.
- id: 120
  category: defensive_driving
  question: At what speed can hydroplaning (where tires lose contact with the road
    and ride on a thin film of water) begin in Missouri weather conditions?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Exactly 45 mph
    D: Only during freezing rain
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph. In a heavy rain,
    your tires can lose all contact with the road at 55 mph.
- id: 121
  category: defensive_driving
  question: When following another vehicle at night in Missouri, you must dim your
    high beams when you are within how many feet of the vehicle ahead?
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: B
  explanation: Missouri law states you must switch to low beams when following another
    vehicle within 300 feet so you do not blind the driver ahead through their mirrors.
- id: 122
  category: defensive_driving
  question: If you are driving on a Missouri highway with at least two lanes in your
    direction and you see a stationary emergency vehicle with flashing lights on the
    shoulder, what does the 'Move Over' law require you to do?
  choices:
    A: Stop immediately in the roadway
    B: Proceed at the speed limit but honk your horn
    C: Move to the lane farthest from the emergency vehicle if safe to do so
    D: Speed up to pass the area quickly
  answer: C
  explanation: Missouri's 'Move Over' law requires drivers to move into a lane not
    adjacent to the stationary emergency vehicle. If changing lanes is unsafe, the
    driver must slow down and proceed with caution.
- id: 123
  category: defensive_driving
  question: When driving in heavy fog in Missouri, which light setting should you
    use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights are required during the day
  answer: B
  explanation: In fog, you should use low beams. High beams reflect off the fog and
    create a glare, making it harder for you to see.
- id: 124
  category: defensive_driving
  question: If your vehicle begins to skid on a slippery Missouri road, what is the
    correct defensive driving response?
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel in the direction the rear of the car is sliding
    C: Turn the steering wheel in the opposite direction of the skid
    D: Shift the car into neutral and turn off the engine
  answer: B
  explanation: To recover from a skid, you should take your foot off the gas and steer
    in the direction the rear of the vehicle is sliding. Do not slam on the brakes.
- id: 125
  category: defensive_driving
  question: According to the Missouri Driver Guide, when is the road most slippery
    during a rainstorm?
  choices:
    A: After it has been raining for several hours
    B: Just as it begins to rain
    C: Only when the temperature is below freezing
    D: When the rain stops and the sun comes out
  answer: B
  explanation: Roads are most slippery just as it begins to rain because the water
    mixes with oil and grease on the road surface that has not yet washed away.
- id: 126
  category: defensive_driving
  question: When following a large truck or tractor-trailer on a Missouri highway,
    why should you increase your following distance to more than three seconds?
  choices:
    A: Trucks have better visibility than cars
    B: To allow the truck driver to see you in their side mirrors
    C: Because trucks accelerate faster than cars
    D: It is required by law for all vehicles over 4,000 lbs
  answer: B
  explanation: If you follow too closely, you are in the truck's 'No-Zone' (blind
    spot). Increasing your distance ensures the driver can see you in their side mirrors.
- id: 127
  category: defensive_driving
  question: If you must stop quickly in a vehicle equipped with Anti-lock Brakes (ABS)
    on a wet Missouri road, how should you apply the brakes?
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure without pumping
    C: Lightly tap the brakes
    D: Pull the emergency brake
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. Pumping the brakes
    actually deactivates the ABS system's effectiveness.
- id: 128
  category: defensive_driving
  question: In Missouri, when approaching a railroad crossing with flashing lights,
    you must stop your vehicle within how many feet of the nearest rail?
  choices:
    A: 5 to 10 feet
    B: 15 to 50 feet
    C: 50 to 100 feet
    D: Exactly 25 feet
  answer: B
  explanation: Missouri law requires drivers to stop between 15 and 50 feet from the
    nearest rail when signals indicate a train is approaching.
- id: 129
  category: defensive_driving
  question: When entering a roundabout in Missouri, which of the following is a correct
    defensive driving practice?
  choices:
    A: Always yield to traffic entering from the right
    B: Yield to traffic already circulating in the roundabout
    C: Stop before entering even if no traffic is present
    D: Change lanes while inside the roundabout to exit quickly
  answer: B
  explanation: Missouri rules for roundabouts require entering traffic to yield to
    the vehicles already in the circle. You should never change lanes while inside
    the roundabout.
- id: 130
  category: alcohol_drugs_health
  question: Under Missouri's 'Implied Consent' law, if you refuse to submit to a chemical
    test to determine your BAC, what is the immediate penalty?
  choices:
    A: Your license will be suspended for 30 days.
    B: Your license will be revoked for one year.
    C: You will be fined $500 but keep your license.
    D: Your license will be suspended for 90 days.
  answer: B
  explanation: Missouri's Implied Consent law states that by driving on Missouri roadways,
    you have already given consent to a chemical test. If you refuse, the Department
    of Revenue will revoke your driving privilege for one year.
- id: 131
  category: alcohol_drugs_health
  question: How many points are assessed against your Missouri driving record for
    a first-time conviction of Driving While Intoxicated (DWI)?
  choices:
    A: 2 points
    B: 4 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: A first-time DWI conviction in Missouri results in 8 points being added
    to your driving record, which triggers a suspension of driving privileges.
- id: 132
  category: alcohol_drugs_health
  question: What program must a Missouri driver complete to reinstate their license
    after an alcohol-related suspension or revocation?
  choices:
    A: The Defensive Driving Course (DDC)
    B: The Substance Awareness Traffic Offender Program (SATOP)
    C: The Missouri Alcohol Safety Action Project (MASAP)
    D: The Driver Improvement Program (DIP)
  answer: B
  explanation: Missouri law requires drivers with alcohol-related offenses to complete
    the Substance Awareness Traffic Offender Program (SATOP) before their license
    can be reinstated.
- id: 133
  category: alcohol_drugs_health
  question: 'Under Missouri''s ''Abuse and Lose'' law, for a first offense involving
    the possession or use of alcohol or drugs while under age 21, your license will
    be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: The 'Abuse and Lose' law mandates a 90-day suspension for a first offense
    involving alcohol or drugs by someone under 21, even if the offense did not involve
    driving.
- id: 134
  category: alcohol_drugs_health
  question: 'To reinstate a Missouri driver license after an alcohol-related suspension,
    you must file proof of financial responsibility for two years. This is commonly
    known as:'
  choices:
    A: An SR-22 filing
    B: A Liability Bond
    C: A Comprehensive Policy
    D: An FR-44 filing
  answer: A
  explanation: Missouri requires an SR-22 insurance filing to be maintained for two
    years following an alcohol-related suspension or revocation.
- id: 135
  category: alcohol_drugs_health
  question: 'In Missouri, a person operating a commercial motor vehicle is considered
    to be driving under the influence if their BAC is at or above:'
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.01%
  answer: B
  explanation: For commercial drivers in Missouri, the legal BAC limit is stricter,
    set at 0.04%.
- id: 136
  category: alcohol_drugs_health
  question: 'If you are convicted of a second DWI offense in Missouri within a five-year
    period, your license will be revoked for:'
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: Permanently
  answer: C
  explanation: A second DWI conviction within a five-year period results in a 5-year
    revocation of driving privileges.
- id: 137
  category: alcohol_drugs_health
  question: In Missouri, if you are under 21 and your BAC is measured at .02% or more,
    your license will be administratively suspended for how many days on a first offense?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: Under Missouri's Zero Tolerance law, a driver under 21 with a BAC of
    .02% or higher will face a 90-day administrative suspension for a first offense.
- id: 138
  category: alcohol_drugs_health
  question: Missouri law requires an Ignition Interlock Device (IID) to be installed
    on the vehicle of any driver convicted of a second or subsequent alcohol-related
    offense. For how long must it remain?
  choices:
    A: At least 3 months
    B: At least 6 months
    C: At least 12 months
    D: The duration of the driver's life
  answer: C
  explanation: For second or subsequent offenses, Missouri requires an IID for at
    least 12 months after the license is reinstated.
- id: 139
  category: alcohol_drugs_health
  question: 'If you are taking a prescription drug and it impairs your driving, Missouri
    law states that:'
  choices:
    A: You cannot be charged with a DWI because the drug was legal.
    B: You can be charged with a DWI just as if you were under the influence of alcohol.
    C: You can only be charged if you also drank alcohol.
    D: You will only receive a warning.
  answer: B
  explanation: In Missouri, driving under the influence of any drug—legal or illegal—that
    impairs your ability to drive safely is grounds for a DWI charge.
- id: 140
  category: alcohol_drugs_health
  question: 'In Missouri, an ''Administrative'' alcohol action is taken against your
    license by the Department of Revenue based on:'
  choices:
    A: A court conviction only
    B: The arrest and the results of a chemical test (or refusal)
    C: A recommendation from a doctor
    D: The amount of points on your record from speeding
  answer: B
  explanation: Administrative actions are separate from criminal court cases and are
    based on the arrest and the chemical test results (or refusal) reported by the
    officer.
- id: 141
  category: alcohol_drugs_health
  question: Which of the following is a potential penalty for a third DWI conviction
    in the state of Missouri?
  choices:
    A: A 10-year license denial
    B: A 1-year license denial
    C: A $100 fine
    D: A 30-day suspension
  answer: A
  explanation: A third DWI conviction in Missouri (a 'persistent offender' status)
    results in a 10-year license denial.
- id: 142
  category: alcohol_drugs_health
  question: If you are a Missouri driver and you are involved in an accident while
    having a BAC of .15% or more, what is a mandatory requirement for your first offense?
  choices:
    A: Permanent license revocation
    B: Installation of an Ignition Interlock Device (IID)
    C: A mandatory 1-year jail sentence
    D: Forfeiture of the vehicle
  answer: B
  explanation: If a driver's BAC is .15% or higher, Missouri law requires the installation
    of an Ignition Interlock Device (IID) even for a first offense.
- id: 143
  category: alcohol_drugs_health
  question: 'If a Missouri driver has a medical condition, such as epilepsy or diabetes,
    that might affect their driving, they must:'
  choices:
    A: Surrender their license immediately.
    B: Only drive during daylight hours.
    C: Report the condition to the Driver License Bureau for evaluation.
    D: Carry a doctor's note at all times while driving.
  answer: C
  explanation: Missouri law requires drivers to report any physical or mental condition
    that might prevent them from being able to operate a motor vehicle safely to the
    Department of Revenue.
- id: 144
  category: alcohol_drugs_health
  question: 'Missouri''s ''Implied Consent'' law means that by driving on Missouri
    roadways, you have agreed to:'
  choices:
    A: Keep your vehicle insured at all times
    B: Submit to a chemical test of your breath, blood, or urine to determine alcohol
      or drug content
    C: Always carry your driver license while operating a vehicle
    D: Yield the right-of-way to all emergency vehicles
  answer: B
  explanation: Under Missouri's Implied Consent law, if you drive a motor vehicle,
    you are deemed to have given consent to a chemical test of your breath, blood,
    or urine if an officer suspects you are driving while intoxicated.
- id: 145
  category: alcohol_drugs_health
  question: 'If you refuse to take a chemical test to determine your BAC when requested
    by a law enforcement officer in Missouri, your driver license will be revoked
    for:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: If you refuse to take a chemical test in Missouri (Chemical Revocation),
    your driving privilege will be revoked for one year, regardless of whether you
    are found guilty in court.
- id: 146
  category: alcohol_drugs_health
  question: What is the name of the mandatory program Missouri drivers must complete
    to reinstate their license after an alcohol-related offense?
  choices:
    A: MADD Impact Panel
    B: Substance Awareness Traffic Offender Program (SATOP)
    C: Missouri Alcohol Safety Action Project (ASAP)
    D: Driver Improvement Program (DIP)
  answer: B
  explanation: Missouri law requires drivers with alcohol-related law enforcement
    contacts to complete the Substance Awareness Traffic Offender Program (SATOP)
    before their license can be reinstated.
- id: 147
  category: alcohol_drugs_health
  question: 'Under Missouri''s ''Abuse and Lose'' law, your license will be suspended
    or revoked if you are under 21 and are caught:'
  choices:
    A: Speeding more than 20 mph over the limit
    B: Possessing or using any illegal drug
    C: Driving without a seatbelt
    D: Failing to yield to a pedestrian
  answer: B
  explanation: The 'Abuse and Lose' law applies to anyone under 21 years of age who
    is found guilty of possession or use of any illegal drug, or any alcohol-related
    offense.
- id: 148
  category: alcohol_drugs_health
  question: How many points are added to your Missouri driving record if you are convicted
    of a first-offense DWI (Driving While Intoxicated)?
  choices:
    A: 2 points
    B: 4 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: A conviction for Driving While Intoxicated (DWI) in Missouri results
    in 8 points being added to your driving record, which leads to an automatic suspension.
- id: 149
  category: alcohol_drugs_health
  question: In Missouri, what is the legal BAC limit for a driver operating a Commercial
    Motor Vehicle (CMV)?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Commercial drivers in Missouri are held to a stricter standard and
    are considered legally intoxicated if their BAC is 0.04% or higher while operating
    a CMV.
- id: 150
  category: alcohol_drugs_health
  question: 'An ''Administrative Alcohol Arrest'' occurs in Missouri if you are stopped
    and a chemical test shows your BAC is at or above:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.15%
  answer: C
  explanation: An Administrative Alcohol Arrest occurs when a driver is arrested upon
    probable cause of driving while intoxicated and a chemical test indicates a BAC
    of 0.08% or more (or 0.02% for minors).
- id: 151
  category: alcohol_drugs_health
  question: 'In Missouri, an Ignition Interlock Device (IID) is mandatory for a driver
    who:'
  choices:
    A: Is convicted of a first-time speeding offense
    B: Has more than one alcohol-related law enforcement contact
    C: Is under 18 and receives any traffic ticket
    D: Fails to pay a parking fine
  answer: B
  explanation: Missouri law requires the installation of an Ignition Interlock Device
    (IID) for any driver with more than one alcohol-related law enforcement contact
    on their record.
- id: 152
  category: alcohol_drugs_health
  question: 'If a Missouri driver is convicted of a second Minor in Possession (MIP)
    offense, their driving privilege will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: While a first MIP offense results in a 30-day suspension, a second
    MIP offense in Missouri results in a 90-day suspension of driving privileges.
- id: 153
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' of combining alcohol with other drugs
    while driving?
  choices:
    A: The drugs cancel out the alcohol
    B: The alcohol makes the drugs less effective
    C: The combined effect is much greater than the sum of the parts
    D: There is no measurable effect on driving ability
  answer: C
  explanation: Combining alcohol with other drugs (even over-the-counter medications)
    can multiply the effects of both, severely impairing a driver's coordination and
    judgment more than either substance would alone.
- id: 154
  category: alcohol_drugs_health
  question: How long is the first suspension for a Missouri driver who is arrested
    for an Administrative Alcohol offense (BAC over the legal limit)?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: For a first Administrative Alcohol offense in Missouri, the driver's
    license is suspended for 90 days.
- id: 155
  category: alcohol_drugs_health
  question: 'If you have a physical or mental condition that might affect your ability
    to drive safely, the Missouri Department of Revenue may require you to:'
  choices:
    A: Surrender your license immediately
    B: Provide a Physician’s Statement for Medical Evaluation
    C: Only drive during daylight hours
    D: Always drive with a passenger
  answer: B
  explanation: Missouri law allows the Department of Revenue to require a medical
    evaluation from a physician if there is reason to believe a driver has a condition
    that could impair their driving safety.
- id: 156
  category: alcohol_drugs_health
  question: 'Under Missouri''s Zero Tolerance law, if a driver under age 21 is found
    to have a BAC of 0.02% or higher, their license will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Under the Zero Tolerance law, a first-time administrative suspension
    for a minor with a BAC of 0.02% or more is 90 days.
- id: 157
  category: penalties_and_points
  question: Which of the following violations results in an immediate 12 points and
    the revocation of your Missouri driving privilege for one year?
  choices:
    A: Speeding more than 20 mph over the limit
    B: Failure to yield right-of-way
    C: Leaving the scene of an accident
    D: Following too closely
  answer: C
  explanation: Leaving the scene of an accident (Hit and Run) is a major violation
    that results in 12 points and immediate revocation of driving privileges in Missouri.
- id: 158
  category: penalties_and_points
  question: If your Missouri license is suspended or revoked, you must typically maintain
    an SR-22 insurance filing for how long from the date of suspension?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: In Missouri, drivers are generally required to file and maintain an
    SR-22 (Proof of Financial Responsibility) for two years following a suspension
    or revocation.
- id: 159
  category: penalties_and_points
  question: Under Missouri's 'Abuse and Lose' law, your license can be suspended for
    which of the following non-driving offenses if you are under 21?
  choices:
    A: Possession or use of any controlled substance
    B: Shoplifting
    C: Truancy from school
    D: Vandalism
  answer: A
  explanation: The 'Abuse and Lose' law applies to anyone under 21 and results in
    license suspension/revocation for alcohol or drug-related offenses, including
    possession or use of controlled substances, even if not operating a vehicle.
- id: 160
  category: penalties_and_points
  question: For drivers age 21 or older, what is the Blood Alcohol Content (BAC) level
    at which you are considered legally intoxicated in Missouri?
  choices:
    A: 0.02% or higher
    B: 0.05% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: C
  explanation: In Missouri, the legal limit for intoxication for drivers 21 and older
    is a BAC of 0.08% or higher.
- id: 161
  category: penalties_and_points
  question: 'If you drive for one full year without receiving any new points on your
    Missouri record, the Department of Revenue will reduce your total points by:'
  choices:
    A: 1 point
    B: One-fourth (25%)
    C: One-third (33.3%)
    D: One-half (50%)
  answer: C
  explanation: 'Missouri has a point reduction system: after 1 year of clean driving,
    points are reduced by one-third; after 2 years, they are reduced by one-half;
    and after 3 years, they are reduced to zero.'
- id: 162
  category: penalties_and_points
  question: How many points are assessed for a conviction of failing to maintain financial
    responsibility (insurance) in Missouri?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Failing to maintain the required motor vehicle liability insurance
    in Missouri results in 4 points being added to your driving record.
- id: 163
  category: penalties_and_points
  question: In Missouri, a first-time DWI offender is required to install an Ignition
    Interlock Device (IID) if their BAC was at or above what level?
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: While IIDs are common for repeat offenders, first-time DWI offenders
    in Missouri must install an IID if their BAC was 0.15% or higher at the time of
    arrest.
- id: 164
  category: penalties_and_points
  question: A conviction for a traffic violation of a municipal ordinance (such as
    running a stop sign within city limits) usually results in how many points in
    Missouri?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Most municipal ordinance traffic violations in Missouri result in 2
    points being added to the driver's record.
- id: 165
  category: penalties_and_points
  question: 'If a Missouri driver goes two consecutive years without any traffic convictions,
    their point total is reduced by:'
  choices:
    A: One-third (1/3)
    B: One-half (1/2)
    C: 75%
    D: All points are removed
  answer: B
  explanation: Missouri law states that after two years of clean driving, the remaining
    points on your record are reduced by one-half.
- id: 166
  category: penalties_and_points
  question: How many years of clean driving (no new convictions) are required in Missouri
    to reduce your driving record points to zero?
  choices:
    A: 2 years
    B: 3 years
    C: 5 years
    D: 10 years
  answer: B
  explanation: In Missouri, if you drive for three consecutive years without any new
    traffic convictions, your point total will be reduced to zero.
- id: 167
  category: penalties_and_points
  question: In Missouri, leaving the scene of an accident in violation of state law
    results in how many points being added to your record?
  choices:
    A: 4 points
    B: 8 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: Leaving the scene of an accident is a major violation in Missouri and
    carries a penalty of 12 points.
- id: 168
  category: penalties_and_points
  question: For a third or subsequent suspension due to point accumulation in Missouri,
    how long is the driver's license suspended?
  choices:
    A: 60 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: B
  explanation: A third or subsequent suspension for accumulating 8 points in 18 months
    in Missouri lasts for 90 days.
- id: 169
  category: penalties_and_points
  question: Under Missouri's 'Abuse and Lose' law, a person under 21 years of age
    will have their driving privilege suspended for how many days for a first offense
    of possession or consumption of alcohol?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: The 'Abuse and Lose' law in Missouri requires a 90-day suspension for
    a first offense involving alcohol or drugs by someone under age 21.
- id: 170
  category: sharing_the_road
  question: Under Missouri's 'Move Over' law, what must you do when approaching a
    stationary emergency vehicle with flashing lights on a highway with four or more
    lanes?
  choices:
    A: Stop completely until the emergency vehicle leaves
    B: Proceed at the speed limit but honk your horn
    C: Proceed with caution and, if safe, move into a lane that is not adjacent to
      the stationary vehicle
    D: Maintain your speed and lane position to avoid disrupting traffic
  answer: C
  explanation: Missouri law requires drivers to move over to a non-adjacent lane if
    safe to do so, or slow down and proceed with caution when passing stationary emergency
    vehicles with flashing lights.
- id: 171
  category: sharing_the_road
  question: In Missouri, what is the minimum age a motorcycle operator must be to
    choose not to wear a helmet, provided they have appropriate health insurance coverage?
  choices:
    A: 18 years old
    B: 21 years old
    C: 26 years old
    D: Helmets are mandatory for all riders regardless of age
  answer: C
  explanation: As of August 2020, Missouri law allows riders 26 years of age or older
    to ride without a helmet if they have medical insurance. Riders under 26 and those
    with instructional permits must still wear a helmet.
- id: 172
  category: sharing_the_road
  question: When following a large truck or bus in Missouri, why should you increase
    your following distance?
  choices:
    A: To allow the truck driver to see you in their side mirrors
    B: Because trucks have a shorter stopping distance than cars
    C: To prevent the truck from rolling backward into you
    D: To improve your fuel economy by drafting
  answer: A
  explanation: If you follow too closely, you are in the truck's 'No-Zone' (blind
    spot). Increasing your distance allows the truck driver to see your vehicle in
    their side mirrors.
- id: 173
  category: sharing_the_road
  question: According to Missouri law, how much distance should you maintain when
    passing a bicycle?
  choices:
    A: At least 1 foot
    B: At least 2 feet
    C: A safe distance
    D: Bicycles must pull over to let cars pass
  answer: C
  explanation: Missouri Revised Statute 304.678 states that the operator of a motor
    vehicle passing a bicycle shall leave a safe distance when passing the bicycle.
- id: 174
  category: sharing_the_road
  question: What is the rule regarding funeral processions at intersections in Missouri?
  choices:
    A: The procession must yield to all other traffic
    B: Only the lead vehicle has the right-of-way
    C: The entire procession has the right-of-way once the lead vehicle has legally
      entered the intersection
    D: Processions are only allowed on Sundays
  answer: C
  explanation: Missouri law (RSMo 194.503) grants the right-of-way to a funeral procession
    at an intersection regardless of traffic control devices, provided the lead vehicle
    entered the intersection lawfully.
- id: 175
  category: sharing_the_road
  question: A first-time conviction for passing a stopped school bus in Missouri while
    it is discharging children can result in a license suspension for how long?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: Under Missouri law, a first conviction for passing a stopped school
    bus results in an 8-point assessment, which leads to a 90-day suspension of driving
    privileges.
- id: 176
  category: sharing_the_road
  question: When a commercial vehicle is making a right turn at an intersection, what
    should a driver behind it be aware of?
  choices:
    A: The truck will turn from the left lane only
    B: The truck may need to swing wide to the left to complete the turn
    C: The truck will always stop before turning
    D: The truck has the right-of-way over all pedestrians
  answer: B
  explanation: Large vehicles like trucks and buses often need to swing wide to the
    left to clear the curb when making a right turn. Drivers should not try to squeeze
    between the truck and the curb.
- id: 177
  category: sharing_the_road
  question: In Missouri, what must you do when a pedestrian carrying a white cane
    or using a guide dog is crossing the street?
  choices:
    A: Honk your horn to let them know you are there
    B: Yield the right-of-way and take precautions to avoid injury
    C: Drive around them if there is enough room
    D: Only stop if there is a marked crosswalk
  answer: B
  explanation: Missouri law requires drivers to yield the right-of-way to any blind
    pedestrian carrying a white cane or using a guide dog, regardless of whether they
    are in a crosswalk.
- id: 178
  category: sharing_the_road
  question: 'When being passed by a motorcycle in Missouri, you should:'
  choices:
    A: Maintain your speed and lane position
    B: Speed up to help them pass faster
    C: Move to the left side of your lane
    D: Turn on your high beams
  answer: A
  explanation: When a motorcycle is passing you, you should maintain your speed and
    lane position to allow the motorcyclist to complete the maneuver safely.
- id: 179
  category: sharing_the_road
  question: Missouri law requires that you use your turn signals at least how many
    feet before turning or changing lanes?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: The Missouri Driver Guide specifies that you should signal your intention
    to turn or change lanes at least 100 feet in advance.
- id: 180
  category: sharing_the_road
  question: If you are following a motorcycle, what is the recommended following distance
    in Missouri for safety?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 to 4 seconds
    D: At least 10 seconds
  answer: C
  explanation: The Missouri Driver Guide recommends a following distance of 3 to 4
    seconds when behind a motorcycle to allow for their ability to stop quickly and
    for road hazards.
- id: 181
  category: sharing_the_road
  question: 'In Missouri, bicyclists are generally required to ride:'
  choices:
    A: On the sidewalk only
    B: Against the flow of traffic
    C: As far to the right of the roadway as safe and practicable
    D: Only in designated bike lanes
  answer: C
  explanation: Bicyclists in Missouri have the same rights and responsibilities as
    motorists and are generally required to ride as far to the right as is safe and
    practicable.
- id: 182
  category: sharing_the_road
  question: In Missouri, when a school bus is stopped on a two-lane highway with its
    red lights flashing and stop arm extended, who is required to stop?
  choices:
    A: Only traffic following the bus
    B: Only traffic approaching from the front
    C: Traffic from both directions
    D: No one, if there are at least two lanes of travel
  answer: C
  explanation: According to the Missouri Driver Guide, on a two-lane road, drivers
    traveling in both directions must stop when a school bus signals to load or unload
    children.
- id: 183
  category: sharing_the_road
  question: On a Missouri highway with four or more lanes and a median or physical
    barrier, when must you stop for a school bus stopped in the opposite direction?
  choices:
    A: You are never required to stop if you are traveling in the opposite direction
    B: Only if the bus driver signals you to stop
    C: Only if there are children crossing the median
    D: You must always stop regardless of the median
  answer: A
  explanation: In Missouri, if the bus is on a highway with four or more lanes and
    you are traveling in the opposite direction, you do not need to stop, though you
    should remain cautious.
- id: 184
  category: sharing_the_road
  question: In Missouri, how much space should you ideally leave between your vehicle
    and a bicycle when passing?
  choices:
    A: At least 1 foot
    B: At least 3 feet
    C: At least 5 feet
    D: At least 10 feet
  answer: B
  explanation: While Missouri state law requires passing at a 'safe distance,' the
    Missouri Driver Guide and many local ordinances specify that you should leave
    at least 3 feet of distance when passing a bicyclist.
- id: 185
  category: sharing_the_road
  question: 'When following a large truck in Missouri, if you cannot see the truck
    driver''s face in their side-view mirrors, you are:'
  choices:
    A: In the driver's 'No-Zone' (blind spot)
    B: In a safe drafting position
    C: Following at a legal and safe distance
    D: In the truck's 'Clear-Zone'
  answer: A
  explanation: The Missouri Driver Guide emphasizes that if you can't see the truck
    driver in their mirror, they can't see you, meaning you are in a 'No-Zone' or
    blind spot.
- id: 186
  category: sharing_the_road
  question: In Missouri, what is the maximum speed a 'Slow-Moving Vehicle' (bearing
    the orange reflective triangle) is typically designed to travel?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: The orange triangular sign indicates a vehicle that travels at speeds
    of 25 mph or less, such as farm machinery or horse-drawn carriages.
- id: 187
  category: sharing_the_road
  question: According to Missouri law, who has the right-of-way in a funeral procession?
  choices:
    A: The procession has the right-of-way at intersections regardless of traffic
      signals once the lead vehicle has entered legally
    B: Individual vehicles in the procession must follow all traffic lights and stop
      signs
    C: The procession must yield to all other traffic
    D: Only the lead vehicle has the right-of-way
  answer: A
  explanation: Missouri law (RSMo 194.503) states that organized funeral processions
    have the right-of-way at intersections. Once the lead vehicle enters an intersection
    legally, all other vehicles in the procession may follow without stopping, provided
    they use flashing lights.
- id: 188
  category: sharing_the_road
  question: 'In Missouri, it is illegal to follow a fire truck responding to an alarm
    closer than:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Missouri law prohibits following emergency vehicles, specifically fire
    apparatus, closer than 500 feet when they are responding to an emergency.
- id: 189
  category: sharing_the_road
  question: 'When a pedestrian is crossing the street guided by a dog or carrying
    a white cane (with or without a red tip), Missouri law requires you to:'
  choices:
    A: Honk to let them know you are there
    B: Yield the right-of-way and take precautions to avoid injury
    C: Only stop if they are in a marked crosswalk
    D: Slow down but continue driving if they are not in your lane
  answer: B
  explanation: Missouri law grants specific right-of-way protections to blind or visually
    impaired pedestrians using canes or service animals; drivers must come to a complete
    stop if necessary to avoid injury.
- id: 190
  category: sharing_the_road
  question: In Missouri, how many points are assessed for a conviction of 'Passing
    a stopped school bus'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: D
  explanation: Passing a stopped school bus while its red lights are flashing is a
    major violation in Missouri and results in 8 points on your driving record.
- id: 191
  category: sharing_the_road
  question: 'When turning right in Missouri and a bicyclist is to your right, you
    should:'
  choices:
    A: Speed up to pass the bicyclist before turning
    B: Honk to warn the bicyclist to stop
    C: Yield to the bicyclist and let them go through the intersection first
    D: Turn quickly so the bicyclist doesn't have to slow down
  answer: C
  explanation: Bicyclists often travel faster than they appear. In Missouri, you must
    yield to a bicyclist just as you would to any other vehicle in the lane you are
    crossing.
- id: 192
  category: sharing_the_road
  question: 'Under Missouri law, if you are involved in a crash with a parked vehicle
    or property and the owner is not present, you must:'
  choices:
    A: Wait for 2 hours for the owner to return
    B: Leave the scene if the damage is less than $500
    C: Leave a note with your name, address, and registration number and report it
      to the police
    D: Only report it if you do not have insurance
  answer: C
  explanation: Missouri law requires you to notify the owner or leave a written notice
    with your contact information and vehicle details, then report the accident to
    the proper law enforcement agency.
- id: 193
  category: vehicle_information
  question: What is the minimum legal tread depth for tires on a passenger vehicle
    in Missouri?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 1/16 of an inch
  answer: B
  explanation: In Missouri, tires are considered unsafe and will fail inspection if
    the tread depth is less than 2/32 of an inch.
- id: 194
  category: vehicle_information
  question: Missouri law requires that your vehicle's foot brake must be able to stop
    the car within how many feet when traveling at 20 mph?
  choices:
    A: 15 feet
    B: 25 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: The Missouri Driver Guide states that the foot brake must be capable
    of stopping the vehicle within 25 feet when traveling at a speed of 20 mph.
- id: 195
  category: vehicle_information
  question: What is the Missouri legal limit for light transmission on the front side
    windows (driver and front passenger) of a motor vehicle?
  choices:
    A: 20% light transmission
    B: 35% light transmission
    C: 50% light transmission
    D: 70% light transmission
  answer: B
  explanation: Missouri law permits window tinting on the front side windows as long
    as they allow at least 35% light transmission (plus or minus 3% tolerance).
- id: 196
  category: vehicle_information
  question: During which months are Missouri drivers permitted to use studded snow
    tires on their vehicles?
  choices:
    A: October 1 to March 1
    B: November 1 to April 1
    C: December 1 to March 31
    D: November 15 to March 15
  answer: B
  explanation: Missouri law allows the use of studded tires only between November
    1 and April 1.
- id: 197
  category: vehicle_information
  question: 'Under Missouri law, your vehicle''s tail lights must be visible from
    a distance of at least:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Missouri equipment regulations require that tail lights (red in color)
    must be visible from a distance of 500 feet to the rear.
- id: 198
  category: vehicle_information
  question: 'In Missouri, your rear license plate must be illuminated by a white light
    so that it is visible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Missouri law requires a white light to illuminate the rear license
    plate, making it clearly legible from a distance of 50 feet.
- id: 199
  category: vehicle_information
  question: 'Missouri law requires every motor vehicle to have a horn that can be
    heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: A motor vehicle in Missouri must be equipped with a horn in good working
    order capable of emitting sound audible under normal conditions from a distance
    of not less than 200 feet.
- id: 200
  category: vehicle_information
  question: Your vehicle's turn signals must be visible from a distance of at least
    how many feet in normal sunlight?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Missouri regulations require that turn signals be visible from a distance
    of at least 100 feet in normal sunlight.
- id: 201
  category: vehicle_information
  question: In Missouri, which vehicles are generally exempt from the biennial (every
    two years) safety inspection requirement?
  choices:
    A: All vehicles manufactured within the last 5 years
    B: Vehicles with less than 150,000 miles and less than 10 years old
    C: Only electric vehicles
    D: Vehicles driven less than 5,000 miles per year
  answer: B
  explanation: Missouri law exempts motor vehicles for the first ten years following
    the model year of manufacture, provided the vehicle has less than 150,000 miles
    at the time of registration.
- id: 202
  category: vehicle_information
  question: Missouri law requires that your vehicle's rearview mirror must provide
    a view of the highway for at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Vehicles must be equipped with a mirror so located as to reflect to
    the driver a view of the highway for a distance of at least 200 feet to the rear.
- id: 203
  category: vehicle_information
  question: What is the maximum allowable window tint for the front side windows (to
    the left and right of the driver) in Missouri?
  choices:
    A: 20% light transmission
    B: 35% light transmission
    C: 50% light transmission
    D: No tint is allowed on side windows
  answer: B
  explanation: Missouri law permits window tint on the front side windows as long
    as it allows 35% (plus or minus 3%) light transmission.
- id: 204
  category: vehicle_information
  question: Missouri law requires that every motor vehicle must be equipped with which
    of the following braking systems?
  choices:
    A: Only a foot brake
    B: Only a parking brake
    C: Both a foot brake and a parking brake
    D: An anti-lock braking system (ABS)
  answer: C
  explanation: 'Every motor vehicle in Missouri must have two separate means of applying
    brakes: a service (foot) brake and a parking (emergency) brake.'
- id: 205
  category: vehicle_information
  question: 'In Missouri, a tire is considered unsafe and will fail a safety inspection
    if the tread depth is less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 (1/16) of an inch
    C: 4/32 (1/8) of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires must have at least 2/32 (or 1/16) of an inch of tread to pass
    a Missouri safety inspection.
- id: 206
  category: vehicle_information
  question: How often are Missouri residents generally required to have a safety inspection
    for their vehicle registration renewal?
  choices:
    A: Every year
    B: Every two years, based on the vehicle's model year
    C: Every five years
    D: Only when the vehicle is sold
  answer: B
  explanation: Missouri requires biennial (every two years) safety inspections. Even-model-year
    vehicles are inspected in even years, and odd-model-year vehicles in odd years.
- id: 207
  category: vehicle_information
  question: What are the minimum liability insurance requirements for a motor vehicle
    in Missouri?
  choices:
    A: $10,000/$20,000/$10,000
    B: $25,000/$50,000/$25,000
    C: $50,000/$100,000/$50,000
    D: $100,000/$300,000/$100,000
  answer: B
  explanation: Missouri law requires minimum liability coverage of $25,000 for bodily
    injury per person, $50,000 for bodily injury per accident, and $25,000 for property
    damage.
- id: 208
  category: vehicle_information
  question: For most passenger vehicles in Missouri, where must license plates be
    displayed?
  choices:
    A: Only on the rear of the vehicle
    B: Only on the front of the vehicle
    C: On both the front and the rear of the vehicle
    D: On the rear and in the front windshield
  answer: C
  explanation: 'Missouri law requires most motor vehicles to display two license plates:
    one on the front and one on the rear.'
- id: 209
  category: vehicle_information
  question: 'Missouri law requires tail lights to be red in color and visible from
    a distance of at least:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Every motor vehicle must have at least two red tail lamps (one for
    older vehicles) that are visible from a distance of 500 feet.
- id: 210
  category: vehicle_information
  question: If a load extends more than how many feet beyond the rear of a vehicle,
    a red flag or light must be attached to the end of the load in Missouri?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: C
  explanation: Whenever a load extends 4 feet or more beyond the rear of a vehicle,
    a red flag (day) or red light (night) must be displayed at the end of the load.
- id: 211
  category: signs_and_signals
  question: In Missouri, what does a flashing red traffic light signify?
  choices:
    A: Slow down and proceed with caution
    B: The light is about to turn solid red
    C: The same as a stop sign
    D: Yield to all traffic, but do not stop
  answer: C
  explanation: According to the Missouri Driver Guide, a flashing red light means
    the same as a stop sign. You must come to a complete stop and proceed only when
    it is safe.
- id: 212
  category: signs_and_signals
  question: What is the meaning of a pennant-shaped sign located on the left side
    of the road in Missouri?
  choices:
    A: School Zone
    B: No Passing Zone
    C: Yield Right-of-Way
    D: Railroad Crossing
  answer: B
  explanation: A pennant-shaped sign is placed on the left side of the road to mark
    the beginning of a 'No Passing Zone'.
- id: 213
  category: signs_and_signals
  question: In Missouri, what does a steady yellow 'X' signal above a traffic lane
    indicate?
  choices:
    A: The lane is for left turns only
    B: The lane is closed to all traffic
    C: Move out of this lane because the signal is about to change to a red X
    D: You may use this lane with caution
  answer: C
  explanation: A steady yellow 'X' means that the signal is about to change to a red
    'X' and you should prepare to leave that lane safely.
- id: 214
  category: signs_and_signals
  question: If your vehicle's turn signals fail, what is the correct hand signal for
    a right turn in Missouri?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out
  answer: B
  explanation: To signal a right turn using hand signals, extend your left arm out
    the window and bend it upward at the elbow.
- id: 215
  category: signs_and_signals
  question: What does a round-shaped sign indicate in the state of Missouri?
  choices:
    A: Yield
    B: Stop
    C: Railroad Crossing ahead
    D: Hospital nearby
  answer: C
  explanation: A yellow, round-shaped sign is used exclusively to warn drivers that
    they are approaching a railroad crossing.
- id: 216
  category: signs_and_signals
  question: In Missouri, what color are regulatory signs that provide information
    about speed limits and parking?
  choices:
    A: Yellow
    B: Orange
    C: White
    D: Green
  answer: C
  explanation: Regulatory signs, which tell you what you must do or not do (like speed
    limits), are typically rectangular and have a white background with black letters/symbols.
- id: 217
  category: signs_and_signals
  question: When approaching a school bus with flashing red lights and an extended
    stop arm on a highway divided by a median strip, who must stop?
  choices:
    A: Traffic in both directions
    B: Only traffic following the bus
    C: Only traffic approaching the bus from the front
    D: No one is required to stop on a divided highway
  answer: B
  explanation: In Missouri, if a highway is divided by a median or an island, only
    the traffic following the bus must stop. Traffic moving in the opposite direction
    does not need to stop.
- id: 218
  category: signs_and_signals
  question: What do broken white lines on the pavement indicate in Missouri?
  choices:
    A: Separation of lanes of traffic moving in opposite directions
    B: Separation of lanes of traffic moving in the same direction
    C: A 'No Passing' zone
    D: The edge of the roadway
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction.
    You may cross these lines to change lanes when it is safe to do so.
- id: 219
  category: signs_and_signals
  question: What is the hand signal for 'Slow or Stop' in Missouri?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm waving toward the ground
  answer: C
  explanation: To signal that you are slowing down or stopping, extend your left arm
    out the window and point it downward.
- id: 220
  category: signs_and_signals
  question: In Missouri, what does a diamond-shaped orange sign represent?
  choices:
    A: General warning of road hazards
    B: Construction or maintenance warning
    C: Directional guidance to state parks
    D: Regulatory speed limit information
  answer: B
  explanation: Orange diamond-shaped signs are used specifically for construction
    and maintenance work zones to warn drivers of unusual or potentially dangerous
    conditions.
- id: 221
  category: signs_and_signals
  question: What does a flashing yellow light at an intersection mean according to
    the Missouri Driver Guide?
  choices:
    A: Stop and wait for the light to turn green
    B: Speed up to clear the intersection quickly
    C: Slow down and proceed with caution
    D: The signal is broken; treat it as a four-way stop
  answer: C
  explanation: A flashing yellow light warns drivers to slow down and proceed through
    the intersection with caution.
- id: 222
  category: signs_and_signals
  question: On a two-lane road in Missouri, what does a solid yellow line on your
    side of the center line mean?
  choices:
    A: You may pass if the road ahead is clear
    B: You are on a one-way street
    C: Passing is prohibited for your lane
    D: You must slow down to 25 mph
  answer: C
  explanation: A solid yellow line on your side of the center line means that passing
    is prohibited for vehicles in your lane.
- id: 223
  category: signs_and_signals
  question: 'When entering a roundabout in Missouri, you must yield the right-of-way
    to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already circulating in the roundabout
    C: No one; you have the right of way
    D: Only emergency vehicles
  answer: B
  explanation: Drivers entering a roundabout must yield to traffic already inside
    the circle and to pedestrians in the crosswalk.
- id: 224
  category: signs_and_signals
  question: What is the primary meaning of a diamond-shaped traffic sign?
  choices:
    A: Stop or Yield
    B: Warning of possible hazards ahead
    C: Regulatory information
    D: Railroad crossing ahead
  answer: B
  explanation: Diamond-shaped signs are warning signs that alert drivers to hazards,
    changes in road conditions, or upcoming intersections.
- id: 225
  category: signs_and_signals
  question: 'A flashing red light at an intersection in Missouri should be treated
    the same as a:'
  choices:
    A: Yield sign
    B: Stop sign
    C: Green light
    D: Caution signal
  answer: B
  explanation: A flashing red light means you must come to a complete stop and proceed
    only when it is safe to do so, just like a stop sign.
- id: 226
  category: signs_and_signals
  question: What do broken white lines on a Missouri roadway indicate?
  choices:
    A: Traffic is moving in opposite directions
    B: The edge of the roadway
    C: Traffic is moving in the same direction
    D: A pedestrian crossing zone
  answer: C
  explanation: Broken white lines separate lanes of traffic moving in the same direction;
    you may cross them to change lanes if it is safe.
- id: 227
  category: signs_and_signals
  question: What does a white X-shaped sign (Crossbuck) with the words 'Railroad Crossing'
    mean?
  choices:
    A: Stop immediately
    B: The road is closed ahead
    C: Yield to any approaching trains
    D: No passing is allowed for the next mile
  answer: C
  explanation: The Crossbuck sign is a regulatory sign that marks a railroad crossing
    and requires drivers to yield to any approaching trains.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 228
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 229
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 230
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 231
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 232
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 233
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
